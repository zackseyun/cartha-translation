review_pass:
  verdict: revise
  source_fidelity: La traduction conserve l’adresse au singulier, l’insistance de l’enroulement et la répétition de « là ». Toutefois, « resteront » ajoute l’idée de permanence, absente de l’hébreu, dont la seconde occurrence de שָׁמָּה introduit simplement le lieu où se trouveront les chars. « Rouler en boule » rend plus directement l’image de כַּדּוּר et l’action intensive de la racine צנף, sans introduire un verbe distinct tel que « lancer ».
  naturalness: « Il te roulera en boule, vers un vaste pays » est une formulation imagée mais intelligible, adaptée au ton prophétique. « Là seront les chars de ta gloire » est à la fois naturel et plus proche de la construction hébraïque que « là resteront les chars qui faisaient ta gloire ».
  terminology: « Vaste pays », « chars », « gloire », « honte » et « maître » conviennent au contexte. La note sur les chars doit présenter le lien avec la fierté du destinataire comme une possibilité interprétative, non comme une conclusion probable imposée.
