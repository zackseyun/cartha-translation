translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement conserve l’adresse prophétique singulière. La répétition de « là » et l’apostrophe finale maintiennent la vigueur rhétorique de l’hébreu, tandis que les notes signalent les principales ambiguïtés lexicales.
