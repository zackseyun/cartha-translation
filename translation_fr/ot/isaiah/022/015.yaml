- from: 'Ainsi parle le Seigneur Yahweh, le maître des armées : « Va, rends-toi[a] auprès de cet intendant, Shebna, qui est responsable du palais[b] :'
  to: 'Ainsi parle le Seigneur Yahweh, maître des armées : « Va trouver[a] cet intendant, Shebna, qui est préposé au palais[b] :'
  rationale: La révision remplace un calque français peu naturel du double impératif par « Va trouver », solution idiomatique qui en exprime la force conjointe ; la note documente la formulation littérale et ne tranche pas au-delà de ce que permet l’hébreu. Elle allège aussi l’apposition du titre divin et emploie « préposé au palais », qui conserve mieux la tonalité institutionnelle de « celui qui est sur la maison ». Les deux ancres de note sont conservées et placées sur les expressions pertinentes.
