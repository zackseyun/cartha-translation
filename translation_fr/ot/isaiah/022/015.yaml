source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת לֶךְ בֹּא֙ אֶל הַ/סֹּכֵ֣ן הַ/זֶּ֔ה עַל שֶׁבְנָ֖א אֲשֶׁ֥ר עַל הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh, maître des armées : « Va trouver[a] cet intendant, Shebna, qui est préposé au palais[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu juxtapose deux impératifs, littéralement « Va, viens ». Ils peuvent fonctionner ensemble au sens de « va trouver » ou « rends-toi auprès de ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « qui est sur la maison » : cette expression désigne le haut fonctionnaire chargé de l’administration du palais royal.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, à la fois fidèle, concise et naturelle en français biblique moderne.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, le maître des armées
  rationale: « Seigneur » rend אֲדֹנָי, « Yahweh » représente explicitement le nom divin יהוה, et « le maître des armées » exprime naturellement le titre צְבָאוֹת sans en limiter la portée aux seules armées humaines.
- source_word: לֶךְ בֹּא
  choice: Va, rends-toi
  rationale: Les deux impératifs sont conservés tout en évitant l’expression française déroutante « Va, viens ». La note signale la forme littérale et la possibilité d’un fonctionnement idiomatique conjoint.
- source_word: הַסֹּכֵן הַזֶּה
  choice: cet intendant
  rationale: סֹכֵן désigne ici un haut fonctionnaire chargé d’une administration. « Intendant » communique l’idée d’une autorité déléguée et s’accorde avec la fonction précisée ensuite.
- source_word: עַל שֶׁבְנָא
  choice: Shebna
  rationale: Shebna est compris comme une apposition qui identifie « cet intendant ». Une répétition telle que « auprès de Shebna » serait lourde en français.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: qui est responsable du palais
  rationale: 'Littéralement « qui est sur la maison » : il s’agit du titre d’un haut administrateur de la maison royale. « Palais » explicite ici le référent institutionnel sans suggérer une simple maisonnée privée.'
theological_decisions:
- issue: Représentation du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La formulation retenue distingue le titre אֲדֹנָי du nom propre יהוה et rend ce dernier de manière explicite, sans confondre les deux éléments.
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: le maître des armées
  alternative: des armées
  rationale: L’ajout de « maître » rend le rapport implicite entre Yahweh et les armées et produit un titre idiomatique en français, tout en laissant ouverte l’étendue céleste ou terrestre de ces armées.
translation_notes:
  register: Français moderne, digne et accessible, avec la cadence solennelle de la formule prophétique. Les deux impératifs hébreux sont perceptibles sans imposer un calque obscur. La ponctuation finale conserve les deux-points, puisque l’ordre divin se poursuit au verset suivant.
