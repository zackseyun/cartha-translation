source:
  edition: WLC
  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
translation:
  language: fr
  text: Voici que Yahweh va te projeter violemment, ô homme, et t’envelopper étroitement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Voici que Yahweh va te jeter violemment, homme fort, et t’envelopper complètement. » L’hébreu est compact et difficile. Le mot גָּבֶר peut signifier « homme » ou « homme fort »; sa fonction syntaxique est discutée et il peut ne pas être une apostrophe.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Introduit avec emphase une annonce prophétique imminente, dans un français moderne et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  choice: va te secouer violemment
  rationale: Le pilpel et l’accusatif apparenté expriment ensemble une secousse ou projection énergique; « violemment » restitue l’intensification sans répétition artificielle.
- source_word: גָּבֶר
  choice: ô homme
  rationale: Le terme est compris comme une apostrophe, tout en conservant dans la note l’autre analyse syntaxique possible et sa nuance de force.
- source_word: וְעֹטְךָ עָטֹה
  choice: et t’envelopper étroitement
  rationale: Le verbe עטה évoque l’action d’envelopper; l’infinitif absolu intensifie cette action, rendue ici par « étroitement ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé par translittération, sans le remplacer par un titre traditionnel.
- issue: Fonction syntaxique de גָּבֶר
  choice: 'apostrophe : « ô homme »'
  alternative: 'élément lié à l’action : « te secouer avec violence, homme fort » / « te lancer comme un homme fort »'
  rationale: L’hébreu est compact et difficile. Le texte principal retient l’apostrophe, mais la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et soutenu. « Voici que » garde la force déictique sans archaïsme marqué; « ô homme » est légèrement solennel, conformément au ton prophétique. La formulation et la note maintiennent l’incertitude syntaxique de l’hébreu.
