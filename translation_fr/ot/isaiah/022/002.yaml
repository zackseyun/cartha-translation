revisions:
- from: Toi qui es pleine de clameurs[a], ville bruyante, cité en liesse ! Ceux qui sont tombés chez toi ne sont pas tombés sous l’épée, ils ne sont pas morts au combat.
  to: Ville pleine de clameurs[a], ville bruyante, cité en liesse ! Tes tués ne sont pas tombés sous l’épée, ni ne sont morts au combat.
  rationale: La révision supprime l’ajout locatif « chez toi » et rend explicitement le terme hébreu pour « tes tués ». Elle conserve le parallélisme, le registre prophétique et l’ambiguïté du verset quant à la cause effective de ces morts.
  reviewer_model: gpt-5.6-terra
