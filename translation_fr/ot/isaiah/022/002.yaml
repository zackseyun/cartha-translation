  text: תְּשֻׁא֣וֹת מְלֵאָ֗ה עִ֚יר הֽוֹמִיָּ֔ה קִרְיָ֖ה עַלִּיזָ֑ה חֲלָלַ֨יִ/ךְ֙ לֹ֣א חַלְלֵי חֶ֔רֶב וְ/לֹ֖א מֵתֵ֥י מִלְחָמָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
translation:
  language: fr
  text: Ville pleine de clameurs[a], ville bruyante, cité en liesse ! Tes tués ne sont pas tombés sous l’épée, ni ne sont morts au combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleine de tumulte, ville retentissante, cité joyeuse ». L’hébreu accumule des termes proches pour évoquer le vacarme animé et festif de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת מְלֵאָה
  choice: pleine de clameurs
  rationale: Le nom désigne un bruit intense, des cris ou un tumulte. « Pleine de clameurs » conserve l’image et convient au parallélisme poétique.
- source_word: עִיר הוֹמִיָּה
  choice: ville bruyante
  rationale: הוֹמִיָּה évoque une ville retentissante, agitée ou tumultueuse. « Bruyante » est naturel et maintient l’accumulation de termes sonores.
- source_word: קִרְיָה עַלִּיזָה
  choice: cité en liesse
  rationale: קִרְיָה est un synonyme poétique de « ville », et עַלִּיזָה exprime la joie exubérante. « Cité en liesse » rend le registre prophétique et festif.
- source_word: חֲלָלַיִךְ
  choice: ceux qui sont tombés chez toi
  rationale: Le terme désigne des personnes abattues ou tuées. Cette formulation française naturelle préserve ici l’idée de morts tout en permettant la reprise négative qui suit.
- source_word: לֹא חַלְלֵי חֶרֶב
  choice: ne sont pas tombés sous l’épée
  rationale: L’expression désigne normalement ceux que l’épée a tués. « Tombés sous l’épée » conserve la répétition de la racine חלל autant que le permet un français idiomatique.
- source_word: וְלֹא מֵתֵי מִלְחָמָה
  choice: ils ne sont pas morts au combat
  rationale: La phrase nie que ces morts soient des victimes de la guerre. « Morts au combat » est concis et courant.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. L’apostrophe initiale est rendue par « Toi qui es… » afin d’exprimer naturellement l’adresse à la ville. Le contraste entre son agitation festive et ses morts qui ne sont pas tombés au combat demeure volontairement inexpliqué dans ce verset.
