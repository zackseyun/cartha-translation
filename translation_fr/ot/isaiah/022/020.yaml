  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/קָרָ֣אתִי לְ/עַבְדִּ֔/י לְ/אֶלְיָקִ֖ים בֶּן חִלְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
translation:
  language: fr
  text: Il arrivera, en ce jour-là, que j’appellerai[a] mon serviteur Éliakim, fils de Hilkija.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je convoquerai ». Le verbe hébreu peut désigner l’appel adressé à quelqu’un en vue d’une fonction ou d’une mission.'
    reason: Alternative lexicale préservant la nuance possible de convocation ou de mandat.
lexical_decisions:
- source_word: וְהָיָה
  choice: En ce jour-là
  rationale: La construction introduit ici un événement futur lié à la formule temporelle qui suit. En français, il est naturel de fondre « il arrivera » et « en ce jour-là » en une seule entrée temporelle sans perte de sens.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, rendue dans un français moderne et digne.
- source_word: וְקָרָאתִי
  choice: j’appellerai
  rationale: Avec ל, קרא peut exprimer l’appel ou la convocation d’une personne. « J’appellerai » conserve cette amplitude sans expliciter indûment une nomination.
- source_word: לְעַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte de mission confiée par Dieu, « serviteur » exprime naturellement la relation de service et de mandat sans mettre au premier plan le statut social d’esclave.
- source_word: אֶלְיָקִים
  choice: Éliakim
  rationale: Translittération française usuelle du nom hébreu.
- source_word: בֶּן חִלְקִיָּהוּ
  choice: fils de Hilqiya
  rationale: Rend directement le patronyme hébreu. « Hilqiya » suit de près la forme hébraïque tout en restant lisible en français.
theological_decisions:
- issue: Désignation divine d’Éliakim
  choice: mon serviteur
  alternative: mon esclave
  rationale: Le syntagme présente Éliakim comme celui qui appartient au service de Dieu et reçoit son mandat. La traduction n’importe aucune identification messianique ou typologique ultérieure et n’accentue pas inutilement la condition servile.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite l’archaïsme « il arrivera en ce jour-là » en intégrant naturellement la formule événementielle à l’indication temporelle. Le marqueur [a] est placé après l’ensemble nominal auquel se rattache la note sur l’action divine.
