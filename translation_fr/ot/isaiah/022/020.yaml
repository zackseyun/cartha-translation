    rationale: La note explique le verbe « j’appellerai » ; son marqueur doit être attaché à ce verbe plutôt qu’au nom « Hilqiya ».
  - severity: low
    issue: Forme française du nom du père
    rationale: « Hilkija » correspond à l’usage français biblique courant et reste une translittération fidèle de חִלְקִיָּהוּ. « Hilqiya » n’est pas fautif, mais est moins idiomatico-usuel en français international.
  revised_text: Il arrivera, en ce jour-là, que j’appellerai[a] mon serviteur Éliakim, fils de Hilkija.
