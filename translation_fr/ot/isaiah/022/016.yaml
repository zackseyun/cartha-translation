source:
  edition: WLC
  text: מַה לְּ/ךָ֥ פֹה֙ וּ/מִ֣י לְ/ךָ֣ פֹ֔ה כִּֽי חָצַ֧בְתָּ לְּ/ךָ֛ פֹּ֖ה קָ֑בֶר חֹצְבִ֤י מָרוֹם֙ קִבְר֔/וֹ חֹקְקִ֥י בַ/סֶּ֖לַע מִשְׁכָּ֥ן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
translation:
  language: fr
  text: Qu’as-tu ici, et qui as-tu ici, pour t’être creusé ici un tombeau, creusant son tombeau sur la hauteur et taillant dans le rocher une demeure pour lui-même[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formulation plus fluide possible : « creusant ton tombeau sur la hauteur et te taillant dans le rocher une demeure ». L’hébreu passe ici de la deuxième à la troisième personne.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  choice: Qu’as-tu ici
  rationale: Cette formulation conserve la brièveté et le ton de défi de l’expression hébraïque, sans expliciter davantage par « Quel droit as-tu ici ? ».
- source_word: וּמִי לְךָ פֹה
  choice: et qui as-tu ici
  rationale: Le parallélisme avec la première question est maintenu; la formule peut viser les liens familiaux ou sociaux de l’homme dans ce lieu sans les préciser.
- source_word: כִּי
  choice: pour
  rationale: Dans cette question rhétorique, « pour » introduit naturellement l’acte qui motive le reproche, tout en évitant de fixer trop strictement la relation logique.
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  choice: pour t’être creusé ici un tombeau
  rationale: « Creuser » est naturel en français pour l’aménagement d’un tombeau dans la pierre; la construction pronominale rend לְּךָ et conserve la répétition de « ici ».
- source_word: חֹצְבִי מָרוֹם קִבְרוֹ
  choice: creusant son tombeau sur la hauteur
  rationale: Le participe reprend l’action avec insistance. « Sur la hauteur » garde l’image concrète d’un emplacement élevé, tandis que « son » respecte le suffixe de troisième personne du texte massorétique.
- source_word: חֹקְקִי בַסֶּלַע מִשְׁכָּן לוֹ
  choice: taillant dans le rocher une demeure pour lui-même
  rationale: « Taillant » évoque le travail de la roche; « demeure » conserve le sens propre de מִשְׁכָּן et son effet funéraire, sans le réduire à une nouvelle occurrence de « tombeau ».
theological_decisions:
- issue: Passage de la deuxième à la troisième personne dans les propositions participiales
  choice: Conserver « son tombeau… pour lui-même »
  alternative: 'Harmoniser à la deuxième personne : « ton tombeau… pour toi-même »'
  rationale: Le texte massorétique passe de l’adresse directe à des suffixes de troisième personne. La traduction préserve cette rupture inhabituelle au lieu de la corriger silencieusement; une formulation harmonisée est donnée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « ici » et l’étrange changement de personne sont conservés parce qu’ils appartiennent à la forme du texte hébreu.
