base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
translation:
  language: fr
  text: En ce jour-là, déclare le SEIGNEUR des armées, le pieu fixé dans un endroit sûr cédera ; il sera coupé et tombera, et la charge qui était sur lui sera retranchée[a], car le SEIGNEUR a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Charge » peut aussi se traduire par « fardeau » ; le terme hébreu désigne ici ce qui était suspendu au pieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclare Yahvé, le maître des armées
  rationale: נְאֻם est rendu par la formule prophétique naturelle « déclare ». Le nom divin est transcrit « Yahvé », et צְבָאוֹת est exprimé dans un français actuel qui conserve l'idée de commandement sur les armées célestes sans la limiter aux seules armées terrestres.
- source_word: תָּמוּשׁ
  choice: cédera
  rationale: Le verbe מוּשׁ évoque ici un déplacement ou un relâchement. Pour un pieu porteur devenu instable, « cédera » rend naturellement l'idée de défaillance.
- source_word: הַיָּתֵד
  choice: le pieu
  rationale: יָתֵד peut désigner un pieu, une cheville ou un clou. « Pieu » maintient l'image d'un objet solidement planté et portant une charge, sans imposer le cadre particulier d'une tente.
- source_word: הַתְּקוּעָה בְּמָקוֹם נֶאֱמָן
  choice: solidement planté
  rationale: Le participe indique que le pieu a été enfoncé ou fixé, tandis que מָקוֹם נֶאֱמָן évoque un emplacement ferme et sûr. La formulation française condense naturellement ces deux éléments.
- source_word: וְנִגְדְּעָה וְנָפְלָה
  choice: il sera tranché et tombera
  rationale: גדע exprime une coupe violente, et נפל la chute qui s'ensuit. « Tranché » convient à un pieu et conserve la séquence du jugement.
- source_word: וְנִכְרַת הַמַּשָּׂא אֲשֶׁר עָלֶיהָ
  choice: et la charge qui reposait sur lui disparaîtra
  rationale: מַשָּׂא désigne concrètement la charge portée par le pieu. נִכְרַת signifie littéralement qu'elle sera retranchée ; « disparaîtra » exprime clairement le résultat en français, tandis qu'une note conserve l'image plus littérale.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: car Yahvé a parlé
  rationale: Cette conclusion prophétique affirme la certitude de l'annonce. La traduction reste directe et solennelle.
theological_decisions:
- issue: Référent du pieu
  choice: Conserver la métaphore sans identifier explicitement le pieu.
  alternative: Identifier le pieu à Éliakim, à sa maison ou à la dynastie qu'il soutient.
  rationale: Le verset ne nomme pas lui-même le référent. La traduction préserve donc l'ambiguïté et la tension avec les promesses des versets précédents.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le rythme solennel de l'oracle tout en évitant les tournures archaïques. « Pieu » est préféré à « clou » ou « cheville » pour préserver la force de l'image sans la préciser excessivement.
