revisions:
- from: En ce jour-là, déclare Yahvé, le maître des armées, le pieu solidement planté cédera ; il sera tranché et tombera, et la charge qui reposait sur lui disparaîtra[a], car Yahvé a parlé.
  to: En ce jour-là, déclare le SEIGNEUR des armées, le pieu fixé dans un endroit sûr cédera ; il sera coupé et tombera, et la charge qui était sur lui sera retranchée[a], car le SEIGNEUR a parlé.
  rationale: 'La révision conserve l''ambiguïté du référent du pieu et la progression poétique du texte, tout en rétablissant le titre divin, le complément indiquant le lieu sûr, et l''image de retranchement appliquée à la charge. La note est simplifiée : le texte principal rend désormais directement le verbe hébreu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend fidèlement la séquence principale : formule oraculaire, pieu fixé, défaillance, coupe, chute et disparition de ce qui y est attaché. Toutefois, « le maître des armées » est une interprétation réductrice et peu idiomatique de YHWH Sabaot ; « le SEIGNEUR des armées » conserve mieux le titre traditionnel et son ampleur. « Solidement planté » ne rend pas explicitement le complément « dans un lieu ferme/sûr » et peut suggérer à tort que le pieu est planté dans le sol. Enfin, « disparaîtra » affaiblit le passif imagé « sera retranchée » de נִכְרַת.'
  naturalness: Le français est globalement naturel et solennel. « Pieu fixé dans un endroit sûr » est à la fois plus précis et plus naturel dans cette image que « pieu solidement planté ». « Sera retranchée » est légèrement plus soutenu, mais reste clair dans le registre prophétique et préserve la métaphore.
  terminology: Employer « le SEIGNEUR des armées » pour יהוה צבאות assure une terminologie biblique française largement reconnaissable sans restreindre « armées » à une lecture terrestre. « Yahvé » est possible, mais la forme « le SEIGNEUR » correspond ici à la convention française habituelle de représentation du Tétragramme. « Charge » convient à מַשָּׂא ; la note peut signaler « fardeau » et le sens contextuel de ce qui est suspendu.
  issues:
  - severity: medium
    issue: « le maître des armées » pour יהוה צבאות
    rationale: Cette expression n'est pas le rendu biblique français habituel et tend à reformuler le titre comme une relation de commandement. « le SEIGNEUR des armées » préserve plus directement le nom divin et l'expression consacrée, sans expliciter la nature des armées.
  - severity: medium
    issue: « solidement planté » omet le lieu ferme/sûr
    rationale: Le texte dit littéralement que le pieu est fixé « dans un lieu ferme/sûr ». La condensation perd cet élément et « planté » peut évoquer un pieu en terre plutôt qu'un support fixé dans une paroi.
  - severity: medium
    issue: « disparaîtra » pour וְנִכְרַת
    rationale: Le verbe signifie être retranché, coupé ou supprimé. « Disparaîtra » n'est pas faux quant au résultat, mais efface l'imagerie de coupe maintenue dans les verbes précédents.
  revised_text: En ce jour-là, déclare le SEIGNEUR des armées, le pieu fixé dans un endroit sûr cédera ; il sera coupé et tombera, et la charge qui était sur lui sera retranchée[a], car le SEIGNEUR a parlé.
  revised_footnotes:
  - marker: a
    text: « Charge » peut aussi se traduire par « fardeau » ; le terme hébreu désigne ici ce qui était suspendu au pieu.
    reason: lexical_alternative
  revision_rationale: 'La révision conserve l''ambiguïté du référent du pieu et la progression poétique du texte, tout en rétablissant le titre divin, le complément indiquant le lieu sûr, et l''image de retranchement appliquée à la charge. La note est simplifiée : le texte principal rend désormais directement le verbe hébreu.'
