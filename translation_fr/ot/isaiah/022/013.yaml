  text: וְ/הִנֵּ֣ה שָׂשׂ֣וֹן וְ/שִׂמְחָ֗ה הָרֹ֤ג בָּקָר֙ וְ/שָׁחֹ֣ט צֹ֔אן אָכֹ֥ל בָּשָׂ֖ר וְ/שָׁת֣וֹת יָ֑יִן אָכ֣וֹל וְ/שָׁת֔וֹ כִּ֥י מָחָ֖ר נָמֽוּת׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
translation:
  language: fr
  text: 'Et voici : joie et allégresse, on abat du gros bétail et on égorge du petit bétail, on mange de la viande et on boit du vin : « Mangeons et buvons, car demain nous mourrons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Mais voici
  rationale: Le contexte oppose cette scène de fête à l'appel divin au deuil au verset précédent. « Voici » conserve la fonction présentative et vive de הִנֵּה, tandis que « mais » rend naturellement la valeur contrastive possible de וְ.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: joie et allégresse
  rationale: Les deux noms proches sont conservés afin de reproduire l'insistance sur l'atmosphère festive sans y ajouter de jugement explicite.
- source_word: הָרֹג בָּקָר
  choice: on tue des bovins
  rationale: La construction nominale et concise décrit une activité en cours. « Bovins » rend בָּקָר sans restreindre indûment le terme aux seuls bœufs.
- source_word: וְשָׁחֹט צֹאן
  choice: on égorge des moutons
  rationale: « Égorge » exprime la mise à mort par incision impliquée par שׁחט sans faire de la scène un sacrifice rituel. Dans ce contexte alimentaire, « moutons » est une formulation naturelle, bien que צֹאן puisse désigner plus largement le petit bétail.
- source_word: אָכֹל בָּשָׂר וְשָׁתוֹת יָיִן
  choice: on mange de la viande et on boit du vin
  rationale: La formulation courante en français restitue les activités festives concrètes et maintient le parallélisme verbal.
- source_word: אָכוֹל וְשָׁתוֹ
  choice: Mangeons et buvons
  rationale: Ces infinitifs absolus ont ici la force d'un mot d'ordre exhortatif ; la première personne du pluriel s'accorde avec נָמוּת et donne au slogan sa concision naturelle en français.
- source_word: כִּי מָחָר נָמוּת
  choice: car demain nous mourrons
  rationale: Le futur français est requis naturellement par « demain » et conserve la formule brève et fataliste de l'hébreu.
theological_decisions:
- issue: Faut-il rendre explicitement condamnable la fête décrite ?
  choice: Décrire les actes sans leur ajouter de qualificatif moral.
  alternative: Employer des expressions comme « débauche coupable » ou « fête impie ».
  rationale: Le verset décrit la réaction du peuple ; sa condamnation ressort du contexte prophétique. Ajouter un jugement dans le texte traduirait une interprétation plutôt que les mots hébreux eux-mêmes.
- issue: Valeur du mot d'ordre אָכוֹל וְשָׁתוֹ
  choice: 'Le rendre comme une exhortation collective : « Mangeons et buvons ».'
  alternative: 'Conserver des impératifs directs : « Mangez et buvez ».'
  rationale: La suite « nous mourrons » indique que les locuteurs s'incluent dans l'invitation. L'exhortation à la première personne préserve cette cohérence sans effacer la forme hébraïque inhabituelle.
translation_notes:
  register: Français international moderne, digne et direct. Les phrases brèves et l'exclamation rendent la vivacité de la scène et du slogan, tandis que le vocabulaire reste descriptif et non confessionnel.
