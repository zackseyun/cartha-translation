id: ISA.22.9
reference: Isaiah 22:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
translation:
  language: fr
  text: Vous avez vu que les brèches de la cité de David étaient nombreuses, et vous avez recueilli les eaux du réservoir inférieur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les eaux du bassin inférieur ». Le terme hébreu peut désigner un bassin ou un réservoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִיעֵי
  choice: les brèches
  rationale: Le nom désigne des ouvertures ou ruptures dans une construction; dans ce contexte de défense urbaine, « brèches » est précis et naturel.
- source_word: עִיר דָּוִד
  choice: la cité de David
  rationale: Cette désignation historique traditionnelle rend naturellement la chaîne construite hébraïque et distingue ce secteur de la ville au sens large.
- source_word: רְאִיתֶם
  choice: vous avez vu
  rationale: Le qal accompli de ראה signifie directement « voir »; le contexte implique que les destinataires ont constaté l'état des fortifications.
- source_word: כִּי רָבּוּ
  choice: que … étaient nombreuses
  rationale: כִּי introduit ici le contenu de ce qui a été constaté, tandis que רָבּוּ exprime le grand nombre des brèches.
- source_word: וַתְּקַבְּצוּ
  choice: vous avez recueilli
  rationale: קבץ signifie rassembler ou recueillir. Avec l'eau comme complément, « recueillir » convient à l'aménagement des ressources hydriques tout en restant proche de l'hébreu.
- source_word: מֵי הַבְּרֵכָה
  choice: les eaux du réservoir
  rationale: מֵי est un pluriel construit, rendu par « les eaux », et בְּרֵכָה peut désigner un bassin ou un réservoir. Ici, la collecte et la conservation de l'eau favorisent « réservoir ».
- source_word: הַתַּחְתּוֹנָה
  choice: inférieur
  rationale: L'adjectif situe le réservoir par rapport à un autre ouvrage hydraulique; « réservoir inférieur » est concis et naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « les eaux » conserve la forme hébraïque; « cité de David » maintient la désignation historique. Le marqueur de note est placé après la proposition concernée.
