base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
translation:
  language: fr
  text: Je le revêtirai de ta tunique, je fixerai solidement sur lui ta ceinture. Je remettrai ton autorité dans sa main, et il sera un père[a] pour les habitants de Jérusalem et pour la maison de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il sera pour père ». La métaphore évoque une autorité protectrice et responsable, non une paternité biologique.'
    reason: Clarifie l’expression hébraïque directe sans remplacer la métaphore dans le texte.
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּיו
  choice: Je le revêtirai
  rationale: Le hifil de לבש avec suffixe masculin singulier signifie « faire porter un vêtement à quelqu’un ». « Revêtir » convient au contexte solennel d’investiture sans être obscur.
- source_word: כֻּתָּנְתֶּךָ
  choice: ta tunique
  rationale: כֻּתֹּנֶת désigne un vêtement de type tunique. « Tunique » est précis et compréhensible en français moderne.
- source_word: וְאַבְנֵטְךָ
  choice: ta ceinture
  rationale: אַבְנֵט désigne une ceinture ou bande portée autour du corps, parfois comme élément d’une tenue officielle. « Ceinture » est ici plus naturel et moins ambigu que « écharpe ».
- source_word: אֲחַזְּקֶנּוּ
  choice: j’attacherai solidement … autour de lui
  rationale: Le piel de חזק exprime l’action de rendre ferme. Avec la ceinture comme objet, la formulation évoque le fait de la fixer solidement, plutôt qu’un affermissement abstrait de la personne.
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: ton autorité
  rationale: מֶמְשָׁלָה peut désigner le pouvoir de gouverner ou la domination. Dans ce transfert de fonction officielle, « autorité » est naturel et exact.
- source_word: אֶתֵּן בְּיָדוֹ
  choice: Je remettrai … entre ses mains
  rationale: L’expression concrète « donner dans sa main » signifie confier un pouvoir ou une responsabilité. « Remettre entre ses mains » conserve l’image tout en étant idiomatique en français.
- source_word: וְהָיָה לְאָב
  choice: il deviendra un père
  rationale: La construction décrit le statut résultant de la nomination. La métaphore directe de la paternité est conservée.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִַם
  choice: pour les habitants de Jérusalem
  rationale: Le participe singulier a ici une valeur collective. Le pluriel français rend naturellement cette portée.
- source_word: וּלְבֵית יְהוּדָה
  choice: pour la maison de Juda
  rationale: « Maison de Juda » conserve l’expression biblique qui désigne le peuple ou le royaume de Juda.
theological_decisions:
- issue: Emploi métaphorique de « père » pour un haut fonctionnaire
  choice: il deviendra un père
  alternative: il sera comme un père ; il deviendra un protecteur
  rationale: L’hébreu emploie directement le nom « père », sans marqueur de comparaison. Garder la métaphore préserve l’image d’une autorité protectrice et responsable sans lui imposer un sens doctrinal ou ecclésiastique ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde les images concrètes de l’investiture et du transfert d’autorité. Le marqueur de note a été placé après « père », terme auquel la note se rapporte dans le texte hébreu.
