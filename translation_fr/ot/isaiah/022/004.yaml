base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
translation:
  language: fr
  text: 'C’est pourquoi j’ai dit : « Détournez vos regards de moi[a] ; laissez-moi pleurer amèrement. N’insistez pas pour me consoler de la dévastation de la fille de mon peuple[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Détournez-vous de moi ». Le verbe hébreu peut demander de détourner son regard ou, plus largement, de se retirer.'
    reason: lexical_alternative
  - marker: b
    text: « La fille de mon peuple » est une expression poétique prophétique qui personnifie le peuple sous les traits d’une fille.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  choice: Détournez de moi vos regards
  rationale: L’impératif pluriel de שעה, suivi de « de moi », demande probablement aux interlocuteurs de détourner leur regard et de laisser le locuteur seul dans son deuil. Cette formulation française conserve la nuance visuelle possible tout en restant naturelle.
- source_word: אֲמָרֵר בַּבֶּכִי
  choice: laissez-moi pleurer amèrement
  rationale: La forme intensive de מרר associée au nom « pleurs » exprime une profonde amertume manifestée par les larmes. La tournure rend naturellement en français la valeur volitive du contexte sans l’aplatir en simple futur.
- source_word: אַל תָּאִיצוּ לְנַחֲמֵנִי
  choice: N’insistez pas pour me consoler
  rationale: Le hiphil de אוץ peut évoquer le fait de presser, de hâter ou d’exercer une insistance. Ici, le locuteur repousse les efforts de consolation ; « n’insistez pas » exprime clairement cette pression importune en français courant.
- source_word: שֹׁד
  choice: dévastation
  rationale: Le nom désigne une destruction violente, une ruine ou un ravage. « Dévastation » garde la force de la catastrophe sans la limiter au pillage.
- source_word: בַּת עַמִּי
  choice: la fille de mon peuple
  rationale: La traduction littérale préserve la personnification poétique du texte prophétique, sans identifier plus précisément la figure à Jérusalem ou à Sion lorsque le verset ne le fait pas explicitement.
theological_decisions:
- issue: Faut-il expliciter « la fille de mon peuple » comme désignant directement Jérusalem, Sion ou le peuple lui-même ?
  choice: Conserver « la fille de mon peuple » dans le texte principal.
  alternative: Traduire par « mon peuple », « Jérusalem » ou « la fille de Sion ».
  rationale: L’hébreu emploie ici une personnification poétique. La conserver respecte l’image, sa charge affective et l’indétermination exacte de son référent dans ce seul verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde le ton intense de la lamentation. « N’insistez pas » est préféré à une formulation plus littérale comme « ne vous hâtez pas », car le contexte évoque des tentatives de consolation repoussées. Les guillemets français et l’espace avant le point-virgule suivent l’usage typographique français.
