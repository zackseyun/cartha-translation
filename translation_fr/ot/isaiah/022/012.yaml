revisions:
- from: En ce jour-là, le Seigneur Yahweh, le maître des armées, a appelé à pleurer et à se lamenter, à se raser la tête[a] et à revêtir la toile de sac.
  to: En ce jour-là, le Seigneur Yahweh des armées a appelé à pleurer et à se lamenter, à se raser la tête[a] et à revêtir le sac.
  rationale: La révision supprime l’ajout interprétatif « maître » afin de rendre directement le titre hébreu, et remplace « la toile de sac » par l’expression française biblique usuelle « le sac ». Le reste de la traduction rend fidèlement l’appel aux quatre manifestations de deuil et la note conserve la valeur littérale du terme relatif à la calvitie.
