source:
  edition: WLC
  text: וַ/יִּקְרָ֗א אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בַּ/יּ֣וֹם הַ/ה֑וּא לִ/בְכִי֙ וּ/לְ/מִסְפֵּ֔ד וּ/לְ/קָרְחָ֖ה וְ/לַ/חֲגֹ֥ר שָֽׂק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/012.yaml
  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
translation:
  language: fr
  text: En ce jour-là, le Seigneur Yahweh des armées a appelé à pleurer et à se lamenter, à se raser la tête[a] et à revêtir le sac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la calvitie ». Il s’agit de se raser la tête ou de se rendre chauve en signe de deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: a appelé à
  rationale: Dans ce contexte, קרא exprime un appel pressant à accomplir les actes de deuil énumérés. « A appelé à » reste proche de l’hébreu tout en étant naturel en français.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, le maître des armées
  rationale: « Seigneur Yahweh » conserve les deux éléments du titre divin, tandis que « le maître des armées » rend clairement צְבָאוֹת comme titre de souveraineté sans limiter ces armées à un seul domaine.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle naturelle en français, qui conserve le registre prophétique.
- source_word: לִבְכִי
  choice: à pleurer
  rationale: Le nom בְּכִי désigne les pleurs; la tournure verbale française exprime naturellement le contenu de l’appel.
- source_word: וּלְמִסְפֵּד
  choice: à se lamenter
  rationale: מִסְפֵּד désigne une lamentation de deuil, souvent publique. « Se lamenter » la distingue des simples pleurs.
- source_word: וּלְקָרְחָה
  choice: à se raser la tête
  rationale: Le nom signifie littéralement « calvitie », mais il désigne ici le fait de rendre la tête chauve comme pratique de deuil. La traduction explicite l’action impliquée sans masquer l’ambiguïté, signalée en note.
- source_word: וְלַחֲגֹר שָׂק
  choice: à revêtir la toile de sac
  rationale: חגר évoque le fait d’attacher un vêtement autour de soi; « revêtir » est idiomatique et conserve l’acte concret. שָׂק est rendu par l’expression biblique française usuelle « toile de sac ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois אֲדֹנָי et le nom propre YHWH. « Le Seigneur Yahweh » préserve explicitement les deux éléments sans produire l’expression artificielle « le Seigneur SEIGNEUR ».
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: le maître des armées
  alternative: des armées
  rationale: L’hébreu ne précise pas s’il s’agit d’armées célestes, terrestres ou des deux. La formulation retenue conserve cette ouverture et exprime la souveraineté impliquée par le titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des quatre manifestations du deuil est conservé. « Toile de sac » maintient la résonance culturelle biblique tout en restant intelligible.
