id: ISA.22.22
reference: Isaiah 22:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
translation:
  language: fr
  text: Je placerai la clé de la maison de David sur son épaule ; il ouvrira[a], et personne ne fermera ; il fermera, et personne n’ouvrira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette image de celui qui ouvre et ferme avec une autorité que nul ne peut contester trouve un écho en Apocalypse 3.7.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je placerai
  rationale: נתן peut signifier « donner, mettre, placer ». Avec « sur son épaule », « placer » exprime naturellement le geste concret par lequel Dieu confie l’autorité symbolisée par la clé.
- source_word: מַפְתֵּחַ
  choice: la clé
  rationale: Le nom signifie « clé ». Le complément déterminatif « de la maison de David » désigne ici une clé précise, emblème d’une charge.
- source_word: בֵּית דָּוִד
  choice: la maison de David
  rationale: Cette formulation proche de l’hébreu préserve à la fois les dimensions dynastique et administrative sans ajouter d’explication interprétative.
- source_word: עַל שִׁכְמוֹ
  choice: sur son épaule
  rationale: C’est le sens direct de l’hébreu. L’image peut évoquer le port d’un insigne de fonction, mais cette explication n’a pas à être intégrée au texte.
- source_word: וּפָתַח
  choice: il ouvrira
  rationale: La forme poursuit la séquence future introduite par la promesse divine. Le futur français est naturel et maintient le parallélisme.
- source_word: וְאֵין סֹגֵר
  choice: et personne ne fermera
  rationale: La construction indique que nul ne pourra inverser son action. Cette formulation française rend clairement cette autorité incontestable.
- source_word: וְסָגַר
  choice: il fermera
  rationale: Le rendu parallèle à « il ouvrira » conserve l’équilibre et la force rhétorique de l’hébreu.
- source_word: וְאֵין פֹּתֵחַ
  choice: et personne n’ouvrira
  rationale: Cette formulation reproduit le parallélisme précédent et indique que nul ne pourra annuler sa décision.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal l’écho messianique ou néotestamentaire ?
  choice: Conserver le sens historique et littéraire immédiat du verset sans ajouter d’interprétation messianique explicite.
  alternative: Employer une formulation orientée vers Apocalypse 3.7 ou développer « maison de David » en « maison royale de David ».
  rationale: Dans Ésaïe, le verset décrit directement une autorité déléguée liée à la maison de David. Son écho ultérieur dans l’Apocalypse est signalé en note plutôt qu’introduit dans la traduction.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu est conservé, avec une syntaxe claire et sans archaïsmes. Le point-virgule met en relief les deux actions opposées.
