  terminology: « Yahweh » est cohérent avec le choix de translittérer le tétragramme. « L’Esprit », « repos », « peuple » et « nom glorieux » sont justes et naturels. Les notes couvrent adéquatement l’alternative lexicale de רוּחַ, le singulier collectif du suffixe et la variante « un nom de gloire ». Les ancres a, b et c sont placées sur les expressions concernées.
