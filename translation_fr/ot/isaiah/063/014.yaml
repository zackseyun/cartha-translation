  variant: modern international French
source:
  edition: WLC
  text: כַּ/בְּהֵמָה֙ בַּ/בִּקְעָ֣ה תֵרֵ֔ד ר֥וּחַ יְהוָ֖ה תְּנִיחֶ֑/נּוּ כֵּ֚ן נִהַ֣גְתָּ עַמְּ/ךָ֔ לַ/עֲשׂ֥וֹת לְ/ךָ֖ שֵׁ֥ם תִּפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
translation:
  language: fr
  text: Comme le bétail qui descend dans la vallée, l’Esprit de Yahweh[a] lui a accordé le repos[b]. C’est ainsi que tu as conduit ton peuple afin de te faire un nom glorieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi signifier « le vent de Yahweh » ou « le souffle de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement « lui a accordé le repos » : le singulier renvoie vraisemblablement à Israël, considéré comme un peuple collectif. On peut aussi traduire selon le sens : « leur a accordé le repos ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « un nom de gloire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבְּהֵמָה
  choice: Comme le bétail
  rationale: בְּהֵמָה est ici un collectif désignant des animaux domestiques. « Le bétail » rend naturellement ce sens collectif en français sans suggérer des animaux sauvages.
- source_word: בַּבִּקְעָה תֵרֵד
  choice: qui descend dans la vallée
  rationale: בִּקְעָה peut désigner une vallée ou une large plaine encaissée; avec ירד, « descend dans la vallée » exprime clairement le mouvement et fournit une comparaison naturelle.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: רוּחַ peut signifier « esprit », « vent » ou « souffle ». Dans ce rappel de la conduite divine et du repos accordé au peuple, « Esprit » convient le mieux, tout en signalant l’autre possibilité en note. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: תְּנִיחֶנּוּ
  choice: lui a accordé le repos
  rationale: Le hiphil de נוח signifie faire reposer ou accorder le repos. Le pronom suffixe est au masculin singulier; « lui » en conserve la forme et renvoie au peuple d’Israël considéré collectivement.
- source_word: כֵּן נִהַגְתָּ עַמְּךָ
  choice: C’est ainsi que tu as conduit ton peuple
  rationale: כֵּן tire la conclusion de la comparaison, et נהג exprime ici l’action de conduire ou guider. « C’est ainsi » et « conduit » sont naturels et gardent le motif de la conduite du peuple.
- source_word: לַעֲשׂוֹת לְךָ שֵׁם תִּפְאָרֶת
  choice: afin de te faire un nom glorieux
  rationale: L’infinitif exprime le but ou le résultat. « Te faire » reflète le datif pronominal, tandis que « un nom glorieux » rend idiomatiquement le groupe שֵׁם תִּפְאָרֶת.
theological_decisions:
- issue: Référent du suffixe singulier dans תְּנִיחֶנּוּ
  choice: Maintien du singulier avec « lui », compris comme renvoyant au peuple d’Israël collectivement.
  alternative: Employer le pluriel « leur » pour expliciter la pluralité des membres du peuple ou du bétail.
  rationale: Le suffixe hébreu est sans ambiguïté au masculin singulier, alors que le contexte parle du peuple comme d’une entité collective. Le français permet à « lui » de reprendre « ton peuple »; cette formulation préserve donc la forme de la source sans exclure le sens collectif.
- issue: Sens de רוּחַ יְהוָה
  choice: « l’Esprit de Yahweh »
  alternative: « le vent de Yahweh » ou « le souffle de Yahweh »
  rationale: Le contexte plus large d’Ésaïe 63 évoque l’action et la conduite divines durant l’exode, ce qui favorise « Esprit ». La polysémie réelle de רוּחַ demeure indiquée en note sans imposer une précision théologique étrangère au texte.
- issue: Relation exprimée par לַעֲשׂוֹת לְךָ
  choice: But rendu par « afin de te faire »
  alternative: Résultat rendu par « et tu t’es ainsi fait »
  rationale: L’infinitif peut exprimer le but ou le résultat. La formulation choisie conserve la structure intentionnelle du texte sans exclure que ce nom glorieux soit aussi le résultat de la conduite divine.
translation_notes:
  register: Français international moderne, digne et accessible. La comparaison reste concrète; le passé composé convient au rappel narratif. Le singulier « lui » conserve la tension grammaticale de l’hébreu, et les notes exposent les principales ambiguïtés lexicales sans alourdir le verset.
