  naturalness: Le français est globalement digne et moderne, mais l’enchaînement appositif « de Botsra, les vêtements rougis ? Celui-ci » est heurté. Une seule interrogation qui regroupe les qualifications reproduit mieux la syntaxe descriptive de l’hébreu et se lit plus naturellement.
  terminology: « Édom », « Botsra », « vêtements rougis », « magnifique », « justice » et « puissant pour sauver » conviennent. « Avec justice » est plus idiomatique que « selon la justice » tout en conservant la portée morale et judiciaire de בִּצְדָקָה. La note sur צֹעֶה doit éviter « fièrement », nuance interprétative non exigée par le terme difficile.
