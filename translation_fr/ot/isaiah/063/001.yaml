source:
  edition: WLC
  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
translation:
  language: fr
  text: Qui est celui qui vient d’Édom, de Botsra, avec des vêtements rougis[a], magnifique dans son habit, qui s’avance dans toute sa force[b] ? — C’est moi, qui parle avec justice[c], puissant pour sauver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des vêtements teints en rouge ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le sens du mot hébreu est incertain ; on peut aussi comprendre : « qui marche à grands pas dans toute sa force ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui parle avec droiture ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמוּץ בְּגָדִים
  choice: les vêtements rougis
  rationale: Le participe/adjectif rare décrit des vêtements devenus rouges. « Rougis » conserve cette idée sans préciser dès ce verset ce qui les a ainsi colorés; l’image du pressoir l’éclairera au verset suivant.
- source_word: מֵאֱדוֹם
  choice: d’Édom
  rationale: Le nom propre désigne le territoire d’Édom et reste translittéré selon l’usage français établi.
- source_word: מִבָּצְרָה
  choice: de Botsra
  rationale: Le nom de cette ville d’Édom est rendu selon sa forme française biblique courante.
- source_word: הָדוּר
  choice: magnifique
  rationale: Le terme exprime une apparence imposante, splendide ou majestueuse; « magnifique » garde cette dignité visuelle sans identifier davantage le personnage.
- source_word: בִּלְבוּשׁוֹ
  choice: dans son habit
  rationale: « Habit » rend le vêtement ou la tenue dans un registre soutenu mais actuel, tout en évitant de répéter immédiatement « vêtements ».
- source_word: צֹעֶה
  choice: qui s’avance
  rationale: Ce mot rare décrit vraisemblablement une démarche ou un mouvement imposant. « S’avance » reste naturel et prudent; une autre nuance possible est signalée en note.
- source_word: בְּרֹב כֹּחוֹ
  choice: dans toute sa force
  rationale: Cette formulation française exprime l’abondance ou la grandeur de la force indiquée par רֹב, sans lourdeur littérale.
- source_word: מְדַבֵּר בִּצְדָקָה
  choice: qui parle selon la justice
  rationale: La tournure conserve la portée morale et judiciaire de צְדָקָה. « Selon la justice » est idiomatique en français et ne réduit pas l’expression à la seule véracité.
- source_word: רַב לְהוֹשִׁיעַ
  choice: puissant pour sauver
  rationale: La formule exprime la grandeur de la capacité à sauver ou délivrer, tout en gardant la concision et la force de l’hébreu.
theological_decisions:
- issue: Identité du personnage qui répond
  choice: Le texte laisse son identité implicite et reproduit simplement sa réponse à la première personne.
  alternative: L’identifier explicitement comme le Seigneur, comme une figure messianique ou comme une personnification prophétique.
  rationale: L’hébreu met en scène un dialogue dramatique sans nommer ici celui qui répond. L’identifier dans la traduction supprimerait une tension interprétative réelle.
- issue: Portée de צְדָקָה
  choice: justice
  alternative: droiture
  rationale: Le mot peut évoquer la conformité à ce qui est juste, la rectitude et la justice exercée. « Justice » convient au contexte judiciaire et guerrier, tandis que « droiture » est conservé en note afin de ne pas effacer la dimension morale.
translation_notes:
  register: Français international moderne, clair et digne, avec la forme interrogative dramatique du texte hébreu. Le tiret distingue la réponse sans ajouter l’identité du locuteur. Les répétitions sémantiques du vêtement et de la force sont préservées sans archaïsme.
