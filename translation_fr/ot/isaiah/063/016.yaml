source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
translation:
  language: fr
  text: 'Car tu es notre Père : Abraham ne nous connaît pas, et Israël[a] ne nous reconnaît pas. Toi, Yahweh, tu es notre Père ; notre Rédempteur depuis les temps anciens, tel est ton nom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Israël » désigne probablement Jacob, le patriarche, en parallèle avec Abraham.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde la supplication du contexte, sans donner au lien une précision excessive.
- source_word: אָבִינוּ
  choice: notre Père
  rationale: Conserve la portée relationnelle et théologique de l’adresse à Dieu, au-delà d’un simple rapport généalogique.
- source_word: יְדָעָנוּ
  choice: ne nous connaît pas
  rationale: Rend directement le qal de ידע et sa nuance de connaissance relationnelle.
- source_word: יַכִּירָנוּ
  choice: ne nous reconnaît pas
  rationale: Le hiphil de נכר exprime ici la reconnaissance. Ce choix maintient une légère distinction avec « connaître ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: גֹּאֲלֵנוּ
  choice: notre Rédempteur
  rationale: Exprime avec concision l’action de délivrer et de revendiquer les siens, tout en laissant implicite la nuance possible de parent proche.
- source_word: מֵעוֹלָם
  choice: depuis les temps anciens
  rationale: Préserve l’idée d’une durée remontant à un passé lointain sans imposer ici le sens métaphysique plus fort d’éternité.
- source_word: שְׁמֶךָ
  choice: tel est ton nom
  rationale: Restitue naturellement en français la proposition nominale hébraïque et souligne que cette désignation caractérise l’identité et la réputation de Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa transcription conserve le caractère personnel du nom divin.
- issue: Valeur temporelle de מֵעוֹלָם
  choice: depuis les temps anciens
  alternative: depuis toujours / de toute éternité
  rationale: Le terme peut évoquer soit l’antiquité lointaine, soit une durée indéfinie ou éternelle. Le texte principal retient le sens temporel moins déterminé, tandis que la note conserve l’autre possibilité.
- issue: Identité d’« Israël » dans le parallélisme
  choice: Le nom demeure « Israël » dans le texte, avec identification probable à Jacob en note
  alternative: le peuple d’Israël
  rationale: Le parallélisme avec Abraham favorise une référence au patriarche Jacob, mais le nom lui-même peut aussi faire résonner l’identité collective du peuple ; la traduction ne tranche pas silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise de « notre Père » conserve l’insistance poétique. « Même si » rend naturellement la valeur concessive de כִּי dans les deux propositions concernant les patriarches. Les guillemets autour du titre final clarifient en français la construction nominale hébraïque sans en modifier le contenu.
