revisions:
- from: Regarde du haut des cieux et vois, depuis la demeure de ta sainteté et de ta gloire. Où sont ton zèle et tes actes puissants ? Le frémissement de tes entrailles[a] et tes compassions se retiennent envers moi[b].
  to: Regarde du haut des cieux et vois, depuis la demeure de ta sainteté et de ta gloire. Où sont ton zèle et tes actes puissants ? Le frémissement de tes entrailles[a] et ta compassion me sont refusés[b].
  rationale: 'La révision remplace uniquement la finale maladroite par une expression française moderne et claire du résultat : la compassion divine semble être refusée au suppliant. La note conserve l’alternative plus proche du réfléchi hébreu (« se retiennent »), sans imposer une analyse grammaticale plus précise que le texte ne l’exige.'
