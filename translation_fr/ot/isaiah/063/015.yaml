review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : les deux impératifs, la demeure céleste, le zèle, les actes de puissance et l’image corporelle de la compassion sont bien conservés. La finale rend toutefois le hitpael et son résultat de façon moins claire que nécessaire : « se retiennent envers moi » n’est pas idiomatique et « envers moi » ne convient pas avec ce verbe dans ce sens.'
  naturalness: Le registre est digne et globalement naturel. « Se retiennent envers moi » est une tournure tendue au point de gêner la compréhension ; « me sont refusés » exprime naturellement le résultat de la retenue évoquée par l’hébreu. Le pluriel « compassions » est possible dans un style biblique, mais « compassion » est plus naturel en français moderne sans perte de sens.
  terminology: « Cieux », « demeure », « sainteté », « gloire », « zèle », « actes puissants » et « entrailles » sont appropriés. « Compassion » conserve le champ sémantique de רַחֲמִים tout en évitant un pluriel français inutilement lourd.
  issues:
  - severity: medium
    issue: Tournure finale peu idiomatique
    rationale: « Le frémissement de tes entrailles et tes compassions se retiennent envers moi » n’est pas une formulation française naturelle. La préposition « envers » suggère une attitude à l’égard de quelqu’un, non l’éloignement ou la privation que demande le contexte. Une formulation passive française rend le résultat du hitpael sans inventer d’agent.
