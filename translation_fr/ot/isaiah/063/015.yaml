source:
  edition: WLC
  text: הַבֵּ֤ט מִ/שָּׁמַ֨יִם֙ וּ/רְאֵ֔ה מִ/זְּבֻ֥ל קָדְשְׁ/ךָ֖ וְ/תִפְאַרְתֶּ֑/ךָ אַיֵּ֤ה קִנְאָֽתְ/ךָ֙ וּ/גְב֣וּרֹתֶ֔/ךָ הֲמ֥וֹן מֵעֶ֛י/ךָ וְֽ/רַחֲמֶ֖י/ךָ אֵלַ֥/י הִתְאַפָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
translation:
  language: fr
  text: Regarde du haut des cieux et vois, depuis la demeure de ta sainteté et de ta gloire. Où sont ton zèle et tes actes puissants ? Le frémissement de tes entrailles[a] et ta compassion me sont refusés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « le frémissement de tes entrailles » : en hébreu, les entrailles sont le siège de l’émotion profonde et de la compassion.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « se retiennent loin de moi » ou « sont retenus loin de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: Regarde du haut des cieux
  rationale: Le contexte vertical justifie « du haut de », tandis que le pluriel « cieux » correspond à l’usage biblique français naturel.
- source_word: וּרְאֵה
  choice: et vois
  rationale: Conserve simplement les deux impératifs hébreux.
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  choice: depuis la demeure de ta sainteté et de ta gloire
  rationale: Cette formulation conserve les substantifs abstraits et leur coordination, sans réduire la construction à deux adjectifs.
- source_word: קִנְאָתְךָ
  choice: ton zèle
  rationale: Dans cet appel à l’intervention divine, קִנְאָה désigne le zèle ardent; « jalousie » reste possible mais risquerait d’évoquer une passion mesquine.
- source_word: גְבוּרוֹתֶיךָ
  choice: tes actes puissants
  rationale: Le pluriel renvoie ici aux manifestations concrètes de la puissance divine.
- source_word: הֲמוֹן מֵעֶיךָ
  choice: le frémissement de tes entrailles
  rationale: « Frémissement » exprime l’agitation intérieure, et « entrailles » préserve l’image corporelle hébraïque de l’émotion profonde.
- source_word: רַחֲמֶיךָ
  choice: tes compassions
  rationale: Le pluriel français, peu courant mais intelligible, maintient le pluriel emphatique de l’hébreu.
- source_word: אֵלַי הִתְאַפָּקוּ
  choice: se retiennent envers moi
  rationale: Le réfléchi rend la valeur du hitpael et « envers moi » préserve l’orientation de אֵלַי, malgré une tournure française volontairement tendue.
theological_decisions:
- issue: Langage corporel appliqué aux émotions de Dieu
  choice: Conserver « tes entrailles » dans le texte
  alternative: ton cœur; ton émotion profonde
  rationale: L’image anthropopathique appartient à la force poétique du verset et ne doit pas être transformée silencieusement en abstraction.
- issue: Sens de קִנְאָה appliqué à Dieu
  choice: ton zèle
  alternative: ta jalousie
  rationale: « Zèle » exprime ici plus clairement l’ardeur de Dieu à agir, tout en évitant les connotations modernes négatives de « jalousie ».
- issue: Ambiguïté de הִתְאַפָּקוּ
  choice: se retiennent envers moi
  alternative: me sont refusés; sont retenus loin de moi
  rationale: Le réfléchi laisse entendre que les émotions divines se contiennent elles-mêmes, conformément à la forme verbale, sans préciser indûment l’agent de cette retenue.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe conserve la tension du texte hébreu, notamment l’image des entrailles et la retenue des compassions, sans l’aplanir en une simple demande abstraite de miséricorde.
