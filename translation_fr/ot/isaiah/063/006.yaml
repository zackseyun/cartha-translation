source:
  edition: WLC
  text: וְ/אָב֤וּס עַמִּים֙ בְּ/אַפִּ֔/י וַ/אֲשַׁכְּרֵ֖/ם בַּ/חֲמָתִ֑/י וְ/אוֹרִ֥יד לָ/אָ֖רֶץ נִצְחָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/006.yaml
  text: I trampled peoples in my anger[a]; I made them drunk in my wrath[b], and I brought their lifeblood down to the earth.
translation:
  language: fr
  text: J’ai foulé des peuples dans ma colère ; je les ai enivrés dans ma fureur, et j’ai fait couler leur sang[a] jusqu’à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est difficile ; il peut évoquer leur jus, leur sang, leur force ou leur éclat. Dans l’image du pressoir, il désigne probablement le liquide qui s’écoule, compris ici comme leur sang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוּס
  choice: J’ai foulé
  rationale: Le verbe בוס signifie fouler ou piétiner. « Foulé » conserve l’image du pressoir qui structure le contexte, tout en exprimant le jugement violent.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel עַמִּים désigne des peuples ou des nations. « Peuples » évite l’association anachronique avec les États-nations modernes.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: אַף désigne littéralement le nez ou les narines, mais exprime idiomatiquement la colère.
- source_word: וַאֲשַׁכְּרֵם
  choice: je les ai enivrés
  rationale: Le piel de שׁכר signifie « rendre ivre ». « Enivrés » est direct, naturel et maintient l’imagerie du vin et du jugement.
- source_word: בַּחֲמָתִי
  choice: dans ma fureur
  rationale: חֵמָה exprime une colère ardente. « Fureur » distingue ce terme de אַף rendu par « colère » et conserve son intensité.
- source_word: וְאוֹרִיד
  choice: j’ai fait couler … jusqu’à terre
  rationale: Le hiphil de ירד signifie littéralement « faire descendre ». Avec un objet compris comme un liquide dans l’image du pressoir, « faire couler … jusqu’à terre » rend naturellement le mouvement sans effacer le sens causatif.
- source_word: לָאָרֶץ
  choice: jusqu’à terre
  rationale: La préposition ל marque ici la destination. « Jusqu’à terre » exprime précisément le mouvement descendant vers le sol.
- source_word: נִצְחָם
  choice: leur sang vital
  rationale: נֵצַח est difficile dans ce passage et peut évoquer le liquide ou jus qui s’écoule des êtres foulés, compris comme leur sang. « Sang vital » conserve le lien entre le pressoir et la mort sans masquer l’incertitude lexicale, signalée en note.
theological_decisions:
- issue: Rendre l’image violente du jugement divin liée au pressoir
  choice: Conserver ensemble le foulage, l’ivresse et le sang qui coule à terre.
  alternative: Expliciter davantage le moyen par « je les ai enivrés de ma fureur », ou rester plus opaque avec « leur jus ».
  rationale: L’hébreu superpose les images du pressoir, de l’ivresse et du sang versé. La traduction maintient cette tension métaphorique sans l’adoucir ni ajouter une interprétation doctrinale.
- issue: Rapport syntaxique entre l’ivresse et la fureur
  choice: « je les ai enivrés dans ma fureur »
  alternative: « je les ai enivrés de ma fureur »
  rationale: La préposition ב peut indiquer la sphère ou le moyen. « Dans ma fureur » préserve cette ouverture plutôt que de présenter explicitement la fureur comme la boisson.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en trois propositions reprend la progression de l’hébreu. « Foulé » et « sang vital » maintiennent l’imagerie du pressoir et du jugement ; la note préserve l’ambiguïté réelle de נִצְחָם.
