  yaml_path: translation/ot/isaiah/063/012.yaml
  text: who led his glorious arm at the right hand of Moses, who split the waters before them to make for himself an everlasting name,
translation:
  language: fr
  text: qui faisait avancer son bras glorieux à la droite de Moïse, qui fendait les eaux devant eux pour se faire un nom éternel,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: conduisait
  rationale: Le participe hiphil exprime ici l’action de mener ou de faire avancer; « conduisait » reste naturel tout en conservant l’image du bras divin guidé aux côtés de Moïse.
- source_word: זְרוֹעַ תִּפְאַרְתּוֹ
  choice: son bras glorieux
  rationale: Littéralement « le bras de sa splendeur/gloire »; cette formulation française conserve l’image de la puissance glorieuse de Dieu.
- source_word: לִימִין מֹשֶׁה
  choice: à la droite de Moïse
  rationale: Rend directement la localisation hébraïque sans préciser davantage le rapport entre le bras divin et Moïse.
- source_word: בּוֹקֵעַ מַיִם
  choice: qui fendait les eaux
  rationale: בקע désigne l’action de fendre ou d’ouvrir en deux; « les eaux » convient au récit de l’Exode et au pluriel conceptuel du terme hébreu.
- source_word: שֵׁם עוֹלָם
  choice: un nom éternel
  rationale: Conserve l’expression hébraïque où le « nom » représente la renommée durable acquise par l’action divine.
theological_decisions:
- issue: Référent et fonction du « bras glorieux »
  choice: Maintenir l’image selon laquelle Dieu conduit son propre bras à la droite de Moïse.
  alternative: Comprendre le bras comme une désignation personnelle ou comme la puissance accordée directement à Moïse.
  rationale: Le texte hébreu attribue explicitement le bras à Dieu et ne tranche pas davantage la nature de cette personnification; la traduction préserve donc cette tension.
- issue: Finalité de l’ouverture des eaux
  choice: « pour se faire un nom éternel »
  alternative: « afin d’acquérir une renommée éternelle »
  rationale: La traduction littérale préserve le langage biblique du « nom » et le pronom réfléchi renvoyant à Dieu.
translation_notes:
  register: Français moderne, soutenu mais accessible. La structure participiale et la ponctuation finale sont conservées parce que le verset s’insère dans une longue question commencée aux versets précédents.
