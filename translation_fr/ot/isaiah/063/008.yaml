source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
translation:
  language: fr
  text: 'Car il a dit : « Oui, ils sont mon peuple, des enfants qui n’agiront pas de manière trompeuse[a]. » Ainsi, il est devenu leur sauveur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne mentiront pas » ou « qui ne se montreront pas faux ».
    reason: 'Alternative lexicale : שׁקר peut désigner le mensonge verbal, une conduite trompeuse ou le fait de ne pas répondre à la confiance accordée.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Car il a dit
  rationale: Le waw narratif fait avancer le récit, tandis que « Car » rend naturellement en français le lien explicatif avec le contexte précédent.
- source_word: אַךְ
  choice: Oui
  rationale: Dans ce contexte, la particule exprime une affirmation appuyée plutôt qu’une restriction. « Oui » conserve cette force dans un français naturel et digne.
- source_word: עַמִּי הֵמָּה
  choice: ils sont mon peuple
  rationale: Cette formulation conserve l’expression d’alliance « mon peuple » ainsi que l’accent porté par le pronom indépendant הֵמָּה.
- source_word: בָּנִים
  choice: des enfants
  rationale: Le masculin pluriel désigne ici les membres du peuple dans leur relation filiale avec Dieu, sans viser seulement les personnes de sexe masculin.
- source_word: לֹא יְשַׁקֵּרוּ
  choice: qui ne se montreront pas infidèles
  rationale: Le piel de שׁקר peut décrire plus largement une conduite fausse ou le fait de décevoir la confiance, et non seulement un mensonge verbal. La note conserve les autres nuances possibles.
- source_word: וַיְהִי לָהֶם
  choice: Ainsi, il est devenu leur
  rationale: « Ainsi » exprime idiomatiquement la relation de conséquence, et « est devenu leur » rend la relation établie en leur faveur.
- source_word: לְמוֹשִׁיעַ
  choice: sauveur
  rationale: Le nom participial issu de ישׁע désigne celui qui sauve ou délivre. « Sauveur » en préserve à la fois le sens direct et la portée théologique, sans ajouter d’identification étrangère au verset.
theological_decisions:
- issue: Désignation divine dans לְמוֹשִׁיעַ
  choice: sauveur
  alternative: libérateur
  rationale: Le texte présente Dieu comme celui qui sauve son peuple. « Sauveur » garde la force de cette désignation tout en restant fidèle au sens verbal hébreu.
- issue: Genre grammatical de בָּנִים
  choice: enfants
  alternative: fils
  rationale: Le pluriel masculin englobe ici le peuple dans son ensemble. « Enfants » restitue la relation filiale sans suggérer à tort une limitation aux hommes.
- issue: Portée de לֹא יְשַׁקֵּרוּ
  choice: ne se montreront pas infidèles
  alternative: ne mentiront pas / ne se montreront pas faux
  rationale: Le contexte permet d’entendre soit le mensonge, soit plus largement une conduite fausse ou une défaillance relationnelle. Le texte principal retient une formulation naturelle sans supprimer l’ambiguïté, explicitée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu, tout en évitant les calques raides. La minuscule à « sauveur » suit l’usage courant du français pour un nom commun employé comme attribut.
