  text: מוֹלִיכָ֖/ם בַּ/תְּהֹמ֑וֹת כַּ/סּ֥וּס בַּ/מִּדְבָּ֖ר לֹ֥א יִכָּשֵֽׁלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/013.yaml
  text: leading them through the depths like a horse in the wilderness[a]; they did not stumble.
translation:
  language: fr
  text: les conduisant à travers les profondeurs[a], comme un cheval dans le désert ; ils n’ont pas trébuché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les eaux profondes ». L’hébreu dit « les profondeurs », en écho à la traversée lors de l’exode.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיכָם
  choice: les conduisant
  rationale: Le participe hiphil de הלך avec suffixe de troisième personne masculine plurielle décrit la conduite passée du peuple et maintient le mouvement participial du contexte.
- source_word: בַּתְּהֹמוֹת
  choice: à travers les profondeurs
  rationale: Le pluriel תְּהֹמוֹת désigne des profondeurs, souvent aquatiques. « À travers » rend le déplacement évoqué sans ajouter explicitement « la mer ».
- source_word: כַּסּוּס
  choice: comme un cheval
  rationale: Le nom singulier précédé du כ comparatif forme une comparaison générale, naturellement rendue en français par l’indéfini.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage ou désertique. « Désert » est ici courant, clair et adapté à l’image d’un terrain dégagé.
- source_word: לֹא יִכָּשֵׁלוּ
  choice: ils n’ont pas trébuché
  rationale: Le nifal de כשל signifie « trébucher, chanceler ». Une proposition indépendante préserve la forme directe de l’hébreu sans imposer explicitement une relation de but ou de résultat.
theological_decisions:
- issue: Image du passage de l’exode à travers la mer
  choice: Traduire תְּהֹמוֹת par « les profondeurs »
  alternative: « les eaux profondes » ou « la mer »
  rationale: Le contexte évoque clairement l’exode, mais le terme hébreu est plus large que « mer ». La formulation retenue laisse le contexte porter cette allusion sans la rendre plus explicite que le texte.
translation_notes:
  register: Français moderne, digne et accessible. Le participe initial conserve le lien syntaxique avec le contexte précédent ; le point-virgule maintient distincte la proposition finale de l’hébreu.
