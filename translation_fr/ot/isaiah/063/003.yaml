source:
  edition: WLC
  text: פּוּרָ֣ה דָּרַ֣כְתִּי לְ/בַדִּ֗/י וּ/מֵֽ/עַמִּים֙ אֵֽין אִ֣ישׁ אִתִּ֔/י וְ/אֶדְרְכֵ֣/ם בְּ/אַפִּ֔/י וְ/אֶרְמְסֵ֖/ם בַּ/חֲמָתִ֑/י וְ/יֵ֤ז נִצְחָ/ם֙ עַל בְּגָדַ֔/י וְ/כָל מַלְבּוּשַׁ֖/י אֶגְאָֽלְתִּי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
translation:
  language: fr
  text: J’ai foulé seul le pressoir ; d’entre les peuples, personne n’était avec moi[a]. Je les ai foulés dans ma colère, je les ai piétinés dans ma fureur ; leur sang a éclaboussé mes vêtements[b], et j’ai souillé tous mes habits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucun homme n’était avec moi ».'
    reason: Préserve la formulation masculine singulière de אִישׁ tout en gardant « personne », plus idiomatique dans le texte.
  - marker: b
    text: Le terme hébreu peut aussi évoquer le jus qui jaillit des raisins dans l’image du pressoir, tout en désignant le sang de ceux qui sont jugés.
    reason: Préserve l’ambivalence imagée de נִצְחָם.
lexical_decisions:
- source_word: פּוּרָה
  choice: le pressoir
  rationale: Le nom désigne l’installation où l’on foule le raisin. « Le pressoir » est naturel en français et conserve l’image du jugement.
- source_word: דָּרַכְתִּי
  choice: j’ai foulé
  rationale: Le passé composé exprime ici une action accomplie racontée avec vivacité ; « fouler » convient au pressoir et permet de reprendre la même racine plus loin.
- source_word: לְבַדִּי
  choice: seul
  rationale: Rendu direct et idiomatique, qui souligne l’action solitaire.
- source_word: וּמֵעַמִּים
  choice: parmi les peuples
  rationale: Avec l’énoncé d’absence, « parmi les peuples » exprime naturellement qu’aucun de leurs membres n’accompagnait le locuteur, tout en maintenant le pluriel collectif.
- source_word: אֵין אִישׁ אִתִּי
  choice: personne n’était avec moi
  rationale: אִישׁ peut désigner un individu humain dans une proposition négative. « Personne » restitue idiomatiquement la portée totale de l’hébreu sans suggérer que le contraste porte spécifiquement sur le sexe.
- source_word: וְאֶדְרְכֵם
  choice: je les ai foulés
  rationale: La répétition de « fouler » conserve le jeu verbal qui assimile les peuples aux raisins dans le pressoir.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: אַף désigne idiomatiquement la colère ; le français évite le littéralisme anatomique.
- source_word: וְאֶרְמְסֵם
  choice: je les ai piétinés
  rationale: « Piétiner » rend l’intensification portée par רמס et reste distinct de « fouler ».
- source_word: בַּחֲמָתִי
  choice: dans ma fureur
  rationale: « Fureur » traduit la force brûlante de חֵמָה et forme un parallélisme naturel avec « colère ».
- source_word: וְיֵז
  choice: a éclaboussé
  rationale: Le verbe évoque un liquide projeté. « Éclabousser » convient à la violence de la scène et à son image vinicole.
- source_word: נִצְחָם
  choice: leur sang
  rationale: Dans cette scène de jugement, le liquide des personnes foulées est leur sang. Une note conserve l’écho possible au jus qui jaillit du raisin.
- source_word: בְּגָדַי / מַלְבּוּשַׁי
  choice: mes vêtements / mes habits
  rationale: Deux termes français courants maintiennent le parallélisme lexical sans répétition artificielle.
- source_word: אֶגְאָלְתִּי
  choice: j’ai souillé
  rationale: Dans ce contexte, le verbe signifie rendre les vêtements tachés ou souillés par le liquide projeté.
theological_decisions:
- issue: Image du guerrier divin et jugement
  choice: Conserver à la première personne l’image violente du pressoir, ainsi que la colère et la fureur.
  alternative: Atténuer la scène en la présentant comme une simple victoire ou une action judiciaire abstraite.
  rationale: L’hébreu décrit le jugement divin de façon personnelle et saisissante. La traduction ne doit ni adoucir cette tension théologique ni lui ajouter une identification confessionnelle.
- issue: Portée de אִישׁ dans une proposition négative
  choice: personne n’était avec moi
  alternative: aucun homme n’était avec moi
  rationale: Dans la construction אֵין אִישׁ, אִישׁ a naturellement le sens de « personne ». Le rendu choisi exprime l’absence absolue d’un compagnon sans imposer un contraste sexué que le contexte ne met pas en avant.
- issue: Identification du liquide נִצְחָם
  choice: leur sang
  alternative: leur force vitale / leur jus
  rationale: Le référent humain et la violence du jugement orientent vers le sang, tandis que la note préserve le double écho poétique avec le jus du pressoir.
translation_notes:
  register: Français international moderne, poétique et digne sans archaïsmes. Le rythme parallèle est conservé par « foulé / piétinés », « colère / fureur » et « vêtements / habits ». Tous les marqueurs de note figurent dans le texte.
