revisions:
- from: Nous sommes devenus comme ceux sur qui tu n’as jamais régné, ceux qui n’ont jamais été appelés de ton nom. Si seulement tu déchirais le ciel et descendais ! Devant toi, les montagnes fondraient.[a]
  to: Nous sommes devenus comme ceux sur qui tu n’as jamais régné, ceux qui n’ont jamais porté ton nom. Si seulement tu déchirais les cieux et descendais ! Devant toi, les montagnes fondraient.[a]
  rationale: La révision remplace une expression française non idiomatique par « porter ton nom », qui rend naturellement l’idiome hébreu d’identification sans l’expliquer davantage. Elle rétablit le pluriel « les cieux » et précise dans la note que « couleraient » est l’alternative lexicale directe, tandis que « trembler » relève de l’effet poétique possible.
  reviewer_model: gpt-5.6-terra
