source:
  edition: WLC
  text: הָיִ֗ינוּ מֵֽ/עוֹלָם֙ לֹֽא מָשַׁ֣לְתָּ בָּ֔/ם לֹֽא נִקְרָ֥א שִׁמְ/ךָ֖ עֲלֵי/הֶ֑ם לוּא קָרַ֤עְתָּ שָׁמַ֨יִם֙ יָרַ֔דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
translation:
  language: fr
  text: Nous sommes devenus comme ceux sur qui tu n’as jamais régné, ceux qui n’ont jamais porté ton nom. Si seulement tu déchirais les cieux et descendais ! Devant toi, les montagnes fondraient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « les montagnes couleraient » ; le verbe peut aussi évoquer l’idée de trembler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ
  choice: Nous sommes devenus
  rationale: Le qal accompli à la 1re personne du pluriel peut exprimer un état présent résultant d’une évolution passée ; le contexte de lamentation privilégie ce sens.
- source_word: מֵעוֹלָם לֹא מָשַׁלְתָּ בָּם
  choice: comme ceux sur qui tu n’as jamais régné
  rationale: La proposition hébraïque est très condensée et difficile. Cette formulation naturelle conserve la comparaison implicite et rend la valeur temporelle de מֵעוֹלָם par « jamais », sans imposer le calque obscur « depuis toujours ».
- source_word: לֹא נִקְרָא שִׁמְךָ עֲלֵיהֶם
  choice: ceux qui n’ont jamais été appelés de ton nom
  rationale: La tournure passive indique que ces personnes portent le nom de Dieu et lui appartiennent. La formulation française préserve l’image biblique sans l’expliciter excessivement.
- source_word: לוּא
  choice: Si seulement
  rationale: La particule introduit ici un souhait intense ; « Si seulement » est actuel, naturel et adapté à la plainte.
- source_word: קָרַעְתָּ שָׁמַיִם
  choice: tu déchirais le ciel
  rationale: קרע signifie « déchirer ». Le singulier collectif « le ciel » est idiomatique en français et garde la vigueur de l’image.
- source_word: יָרַדְתָּ
  choice: descendais
  rationale: Sous la portée de לוּא, l’accompli exprime un souhait. L’imparfait français convient à cette construction optative.
- source_word: מִפָּנֶיךָ
  choice: Devant toi
  rationale: Littéralement « de devant ta face/présence » ; ici, la locution décrit la réaction des montagnes à la manifestation divine.
- source_word: הָרִים נָזֹלּוּ
  choice: les montagnes fondraient
  rationale: נזל signifie fondamentalement « couler ». Appliqué aux montagnes dans cette théophanie, « fondre » conserve mieux l’image concrète que « trembler », tout en restant naturel en français.
theological_decisions:
- issue: Identité d’alliance exprimée par l’appel du nom divin
  choice: ceux qui n’ont jamais été appelés de ton nom
  alternative: ceux sur qui ton nom n’a jamais été invoqué
  rationale: L’expression désigne vraisemblablement l’appartenance et l’identification au Dieu dont le nom est porté, plutôt qu’un simple acte verbal d’invocation.
- issue: Réaction des montagnes à la présence divine
  choice: les montagnes fondraient
  alternative: les montagnes couleraient / trembleraient
  rationale: Le texte représente poétiquement les montagnes comme devenant fluides devant Dieu. « Fondraient » garde cette image théophanique sans la réduire au seul tremblement.
- issue: Relation syntaxique de la dernière proposition
  choice: 'Proposition juxtaposée : « Devant toi, les montagnes fondraient »'
  alternative: 'Proposition finale : « afin que les montagnes fondent devant toi »'
  rationale: L’hébreu ne comporte aucun marqueur explicite de but ou de conséquence. La juxtaposition préserve donc la tension syntaxique du texte.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse personnelle à Dieu. Le parallélisme de la plainte et l’image vive de la descente divine sont conservés ; la syntaxe finale reste juxtaposée afin de ne pas ajouter un rapport de but absent de l’hébreu.
