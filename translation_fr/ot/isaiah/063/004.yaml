id: ISA.63.4
reference: Isaiah 63:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֛י י֥וֹם נָקָ֖ם בְּ/לִבִּ֑/י וּ/שְׁנַ֥ת גְּאוּלַ֖/י בָּֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
translation:
  language: fr
  text: Car le jour de la vengeance était dans mon cœur, et l’année de mes rachetés[a] était arrivée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’année de ma rédemption ». L’hébreu peut désigner soit l’année concernant ceux que le locuteur rachète, soit le temps de son action rédemptrice.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’action décrite auparavant et conserve clairement le lien explicatif avec le contexte.
- source_word: יוֹם נָקָם
  choice: le jour de la vengeance
  rationale: Rend directement l’expression hébraïque et maintient l’idée d’un moment décisif de juste rétribution.
- source_word: בְּלִבִּי
  choice: était dans mon cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de l’intention et de la résolution, sans la réduire à la seule pensée.
- source_word: וּשְׁנַת גְּאוּלַי
  choice: et l’année de mes rachetés
  rationale: 'גְּאוּלַי se comprend le plus naturellement comme un participe passif substantivé au pluriel avec suffixe de première personne : « mes rachetés ». La note signale l’interprétation événementielle possible dans ce parallélisme.'
- source_word: בָּאָה
  choice: était arrivée
  rationale: Le plus-que-parfait français exprime qu’au point de vue du locuteur, le temps fixé était déjà venu.
theological_decisions:
- issue: Rapport entre le jugement divin et la délivrance dans גְּאוּלַי
  choice: mes rachetés
  alternative: ma rédemption
  rationale: Le texte associe le jour de la vengeance à l’année concernant ceux que le locuteur rachète. Cette lecture respecte la forme personnelle du terme, tandis que la note conserve la possibilité de comprendre l’expression comme visant l’action rédemptrice elle-même.
translation_notes:
  register: Français international moderne, sobre et digne. « Mes rachetés » garde la concision et la coloration théologique de l’hébreu; la note explicite l’autre compréhension sans trancher artificiellement l’ambiguïté.
