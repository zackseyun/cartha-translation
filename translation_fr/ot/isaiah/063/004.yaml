  source_fidelity: Le texte rend fidèlement כִּי comme une justification contextuelle (« Car »), יוֹם נָקָם comme « le jour de la vengeance », et בְּלִבִּי sans réduire l’image du cœur à une simple pensée. « L’année de mes rachetés » représente de manière défendable la lecture personnelle plurielle de גְּאוּלַי. La note préserve correctement l’autre analyse possible, abstraite ou événementielle (« ma rédemption »), sans résoudre indûment l’ambiguïté. Le plus-que-parfait « était arrivée » est compatible avec l’aspect accompli de בָּאָה dans ce discours.
