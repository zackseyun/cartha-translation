  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
translation:
  language: fr
  text: 'Alors il se souvint des jours anciens, de Moïse et de son peuple[a] : « Où est celui qui les a fait remonter de la mer avec les bergers de son troupeau[b] ? Où est celui qui a mis en lui son Esprit saint[c] ? »


    [a] La formulation hébraïque est très condensée et sa syntaxe incertaine. On peut aussi comprendre : « Alors son peuple se souvint des jours anciens, de Moïse. »

    [b] Le texte hébreu porte « les bergers de son troupeau » ; certains comprennent toutefois « le berger de son troupeau », qui désignerait probablement Moïse.

    [c] Ou « en eux » ou « au milieu d’eux ». L’hébreu emploie un suffixe singulier (« en lui »), mais son référent est discuté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque est très condensée et sa syntaxe incertaine. On peut aussi comprendre : « Alors son peuple se souvint des jours anciens, de Moïse. »'
    reason: alternative_reading
  - marker: b
    text: Le texte hébreu porte « les bergers de son troupeau » ; certains comprennent toutefois « le berger de son troupeau », qui désignerait probablement Moïse.
    reason: alternative_reading
  - marker: c
    text: Ou « en eux » ou « au milieu d’eux ». L’hébreu emploie un suffixe singulier (« en lui »), mais son référent est discuté.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Alors il se souvint
  rationale: Le wayyiqtol fait progresser l’énoncé. « Alors » restitue naturellement la succession, tandis que le pronom masculin singulier respecte la forme verbale sans expliciter davantage son référent.
- source_word: יְמֵי עוֹלָם
  choice: les jours anciens
  rationale: Dans ce contexte, l’expression renvoie aux temps d’autrefois, particulièrement aux actes fondateurs de délivrance accomplis lors de l’exode.
- source_word: מֹשֶׁה עַמּוֹ
  choice: de Moïse et de son peuple
  rationale: La suite hébraïque est fortement condensée et difficile à analyser. Le texte principal rattache Moïse et le peuple aux jours remémorés ; une autre analyse syntaxique importante est signalée en note.
- source_word: אַיֵּה
  choice: Où est celui qui
  rationale: Le présent conserve la force rhétorique et plaintive de l’interrogation répétée.
- source_word: הַמַּעֲלֵם מִיָּם
  choice: qui les a fait remonter de la mer
  rationale: Le causatif de עלה exprime le fait de faire monter ou remonter. Le suffixe pluriel est rendu par « les », et « de la mer » conserve l’image de la délivrance.
- source_word: אֵת רֹעֵי צֹאנוֹ
  choice: avec les bergers de son troupeau
  rationale: Le texte massorétique vocalisé porte un pluriel, « bergers ». Le singulier contextuellement possible, souvent rapporté à Moïse, est conservé en note.
- source_word: הַשָּׂם
  choice: celui qui a mis
  rationale: Le participe de שׂים signifie « mettre, placer » et forme un parallèle avec la première désignation interrogative.
- source_word: בְּקִרְבּוֹ
  choice: en lui
  rationale: Le suffixe hébreu est masculin singulier. Son référent restant débattu, la forme singulière est maintenue dans le texte et les lectures collectives sont données en note.
- source_word: רוּחַ קָדְשׁוֹ
  choice: son Esprit saint
  rationale: L’expression désigne l’Esprit de sainteté appartenant à Dieu. La majuscule à « Esprit » suit l’usage français pour l’Esprit divin, tandis que « saint » garde la minuscule adjectivale normale.
theological_decisions:
- issue: Sujet de « se souvint »
  choice: 'Maintenir dans le texte principal le sujet masculin singulier implicite : « il »'
  alternative: « son peuple se souvint »
  rationale: La forme verbale est singulière et permet de poursuivre avec le Seigneur comme acteur implicite. Toutefois, la proximité de עַמּוֹ permet une autre analyse où « son peuple » serait le sujet collectif ; la note préserve cette ambiguïté syntaxique sans imposer une résolution doctrinale.
- issue: Référent de « en lui » pour la présence de l’Esprit
  choice: Conserver le singulier « en lui »
  alternative: « en eux » ou « au milieu d’eux »
  rationale: Le suffixe du texte massorétique est singulier, mais il peut renvoyer à Moïse, au peuple considéré collectivement ou au milieu du peuple. La traduction garde la morphologie hébraïque et expose les autres possibilités en note.
translation_notes:
  register: Français international moderne, digne et lisible. Les deux interrogations parallèles sont conservées. Le passé composé convient au discours direct actuel (« Où est celui qui… ? »), et les ambiguïtés syntaxiques ou référentielles réelles sont signalées sans être résolues dans un sens confessionnel.
