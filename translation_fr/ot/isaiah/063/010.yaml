id: ISA.63.10
reference: Isaiah 63:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
translation:
  language: fr
  text: Mais eux se sont rebellés et ont attristé son Esprit Saint[a]. Alors il se retourna contre eux comme un ennemi; lui-même a combattu contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son esprit saint »; plus littéralement, « l’esprit de sa sainteté ».
    reason: Alternative lexicale et traduction littérale de la construction hébraïque.
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mais eux
  rationale: La conjonction et le pronom indépendant marquent ici un contraste avec les actes de salut précédents de Dieu; « Mais eux » conserve aussi l’insistance sur le sujet.
- source_word: מָרוּ
  choice: se sont rebellés
  rationale: Le verbe מרה exprime couramment la rébellion ou l’insoumission envers Dieu; cette formulation est directe et naturelle en français.
- source_word: וְעִצְּבוּ
  choice: ont attristé
  rationale: Le piel de עצב signifie causer de la peine ou du chagrin. « Attrister » rend clairement la portée affective et relationnelle du verbe.
- source_word: אֶת רוּחַ קָדְשׁוֹ
  choice: son Esprit saint
  rationale: La construction signifie littéralement « l’esprit de sa sainteté » et peut idiomatiquement se rendre par « son esprit saint ». La majuscule à « Esprit » indique ici le référent personnel suggéré par le fait qu’il puisse être attristé, sans ajouter de terme au texte.
- source_word: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  choice: Alors il est devenu leur ennemi
  rationale: Le niphal exprime un retournement de relation ou de position, tandis que לָהֶם לְאוֹיֵב signifie littéralement « pour eux, en ennemi ». La formulation française rend nettement ce renversement sans surinterpréter sa causalité.
- source_word: הוּא
  choice: lui-même
  rationale: Le pronom explicite est emphatique; « lui-même » en conserve l’insistance.
- source_word: נִלְחַם בָּם
  choice: a combattu contre eux
  rationale: Le verbe לחם construit avec ב signifie ici combattre contre quelqu’un. Cette traduction évite l’ambiguïté de « combattre avec eux ».
theological_decisions:
- issue: Interprétation et typographie de רוּחַ קָדְשׁוֹ
  choice: son Esprit saint
  alternative: son esprit saint; l’esprit de sa sainteté
  rationale: Le syntagme hébreu permet une traduction plus littérale et ne porte pas de distinction typographique. Le contexte présente toutefois l’Esprit comme pouvant être attristé, ce qui justifie la lecture personnelle « son Esprit saint ». Les autres possibilités sont conservées en note afin de ne pas effacer l’ambiguïté lexicale.
- issue: Agent du retournement exprimé par וַיֵּהָפֵךְ
  choice: il est devenu leur ennemi
  alternative: il s’est retourné contre eux en ennemi; il fut changé pour eux en ennemi
  rationale: Dans le contexte, le sujet naturel est Dieu. « Est devenu » conserve le renversement de sa relation avec eux sans suggérer qu’un agent extérieur l’aurait transformé.
translation_notes:
  register: Français international moderne, digne et accessible. « Mais eux » marque le contraste avec le contexte antérieur; les deux phrases courtes préservent la progression de la rébellion au jugement. La graphie « Esprit saint » suit l’usage français courant, avec majuscule au nom et minuscule à l’adjectif.
