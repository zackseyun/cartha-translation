  text: לַ/מִּצְעָ֕ר יָרְשׁ֖וּ עַם קָדְשֶׁ֑/ךָ צָרֵ֕י/נוּ בּוֹסְס֖וּ מִקְדָּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
translation:
  language: fr
  text: Ton peuple saint en a pris possession[a] pendant peu de temps[b] ; nos adversaires ont foulé aux pieds ton sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne précise pas ce dont le peuple a pris possession ; le contexte suggère le pays ou l’héritage, et non nécessairement le sanctuaire lui-même.
    reason: alternative_reading
  - marker: b
    text: Ou « brièvement ». L’expression hébraïque peut évoquer une courte durée ou une faible étendue.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמִּצְעָר
  choice: pendant peu de temps
  rationale: מִצְעָר exprime ce qui est petit ou bref. Avec לַ, l’expression fonctionne ici naturellement comme une indication de courte durée, sans ajouter l’idée plus appuyée de « seulement ».
- source_word: יָרְשׁוּ
  choice: en a pris possession
  rationale: ירשׁ peut signifier hériter, posséder ou prendre possession. L’objet n’étant pas exprimé en hébreu, le pronom « en » renvoie discrètement, selon le contexte, au pays ou à l’héritage sans l’identifier au sanctuaire.
- source_word: עַם קָדְשֶׁךָ
  choice: ton peuple saint
  rationale: La tournure construite signifie littéralement « le peuple de ta sainteté » ; « ton peuple saint » est idiomatique en français et conserve à la fois l’appartenance à Dieu et la consécration.
- source_word: צָרֵינוּ
  choice: nos adversaires
  rationale: צָר désigne une personne hostile, un adversaire ou un ennemi. « Adversaires » convient au registre élevé de la lamentation sans renforcer indûment le terme.
- source_word: בּוֹסְסוּ
  choice: ont foulé aux pieds
  rationale: Le verbe בוס exprime l’action de piétiner. « Fouler aux pieds » est une formulation française naturelle qui conserve la force profanatrice de l’image.
- source_word: מִקְדָּשֶׁךָ
  choice: ton sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu saint ou un sanctuaire. « Sanctuaire » préserve cette portée sans réduire explicitement le référent à un bâtiment précis, même si le temple de Jérusalem est vraisemblablement visé.
theological_decisions:
- issue: Objet implicite de יָרְשׁוּ (« prendre possession »)
  choice: Employer « en » sans nommer explicitement l’objet, avec une note indiquant que le contexte suggère le pays ou l’héritage.
  alternative: Faire de « ton sanctuaire » l’objet du verbe, ou laisser en français une construction sans objet.
  rationale: L’hébreu ne précise pas l’objet. La proposition suivante nomme séparément le sanctuaire ; l’identifier comme objet de la première proposition risquerait donc d’effacer la tension et le parallélisme du texte.
- issue: Portée de לַמִּצְעָר
  choice: 'Comprendre l’expression temporellement : « pendant peu de temps ».'
  alternative: 'La comprendre quantitativement : « dans une faible mesure », ou adopter une lecture fondée sur une autre vocalisation.'
  rationale: Dans le contexte de la lamentation, la courte durée de la possession fournit un sens cohérent, tout en signalant en note que l’hébreu peut aussi évoquer une faible étendue ou mesure.
translation_notes:
  register: Français international moderne, naturel et digne. « Fouler aux pieds » maintient le registre de lamentation et la violence symbolique de la profanation. Les notes préservent l’objet implicite du verbe ainsi que la latitude sémantique de לַמִּצְעָר.
