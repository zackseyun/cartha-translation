base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
translation:
  language: fr
  text: J’ai regardé, mais il n’y avait personne pour m’aider ; j’ai été consterné[a], mais il n’y avait personne pour me soutenir. Alors, mon propre bras m’a apporté le salut[b], et ma fureur — c’est elle qui m’a soutenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai été stupéfait ». Le verbe hébreu peut exprimer une stupéfaction accablée ou une désolation consternée.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’a donné la victoire ». Le verbe hébreu appartient à une racine souvent rendue par « sauver » ou « délivrer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבִּיט
  choice: J’ai regardé
  rationale: Le hifil de נבט exprime un regard dirigé ou attentif. « J’ai regardé » est naturel et conserve la sobriété de l’hébreu.
- source_word: עֹזֵר
  choice: pour aider
  rationale: Le participe de עזר désigne quelqu’un qui aide. Après « personne », l’infinitif rend idiomatiquement cette fonction en français.
- source_word: וְאֶשְׁתּוֹמֵם
  choice: j’ai été consterné
  rationale: La forme réfléchie de שמם peut exprimer une stupeur profonde, mêlée de désolation. « Consterné » garde cette intensité sans imposer une nuance trop précise.
- source_word: סוֹמֵךְ
  choice: pour soutenir
  rationale: Le participe de סמך signifie soutenir ou servir d’appui. « Soutenir » convient au parallélisme avec « aider » et maintient le lien lexical avec le dernier verbe.
- source_word: וַתּוֹשַׁע לִי זְרֹעִי
  choice: mon propre bras m’a apporté le salut
  rationale: Le verbe ישׁע avec לִי présente le bras du locuteur comme l’agent de sa délivrance. « Mon propre bras » souligne que nul autre n’est intervenu, tandis que « salut » conserve le champ lexical de la racine.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה évoque une colère ardente. « Fureur » rend cette intensité dans un français actuel et solennel.
- source_word: הִיא סְמָכָתְנִי
  choice: c’est elle qui m’a soutenu
  rationale: Le pronom féminin renvoie explicitement à חֲמָתִי. La tournure disloquée française restitue cette mise en relief et reprend le verbe « soutenir » issu de סמך.
theological_decisions:
- issue: Autodélivrance divine exprimée par l’image anthropomorphique du bras
  choice: mon propre bras m’a apporté le salut
  alternative: mon bras m’a donné la victoire
  rationale: Le texte représente la puissance propre du locuteur agissant sans aide humaine. « Salut » préserve le lien avec ישׁע et laisse ouverte la nuance contextuelle de délivrance ou de victoire.
- issue: La fureur comme force qui soutient le locuteur dans le jugement
  choice: ma fureur — c’est elle qui m’a soutenu
  alternative: ma colère m’a servi d’appui
  rationale: La formulation conserve la tension du texte, où la fureur divine est présentée comme ce qui soutient l’action, sans atténuer l’image du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que la reprise de « soutenir » pour les deux occurrences de la racine סמך. Le tiret met en relief le pronom féminin hébreu renvoyant à « ma fureur ».
