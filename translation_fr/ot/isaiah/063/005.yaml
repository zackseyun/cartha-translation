  source_fidelity: 'Le sens du texte hébreu est fidèlement rendu : le locuteur ne trouve ni aide ni soutien, puis son propre bras lui procure le salut/la délivrance et sa fureur le soutient. L’accent porté par le pronom féminin הִיא est conservé sans identifier au-delà du texte la nature de cette action.'
