  terminology: « Consterné », « salut » et « fureur » rendent adéquatement les termes hébreux et conviennent au registre prophétique. La reprise de « soutenir » préserve utilement le lien lexical entre סוֹמֵךְ et סְמָכָתְנִי. La note a est légèrement reformulée pour une expression française plus idiomatique tout en maintenant l’ambiguïté lexicale.
