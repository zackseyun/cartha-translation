source:
  edition: WLC
  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
translation:
  language: fr
  text: Je rappellerai les marques d’amour fidèle de Yahweh[a], les louanges de Yahweh, à la mesure de tout ce que Yahweh nous a accordé[b], ainsi que la grande bonté qu’il a accordée à la maison d’Israël, selon sa compassion et selon l’abondance de son amour fidèle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu YHWH est ici translittéré « Yahweh » ; on trouve aussi « Yahvé », et de nombreuses traductions le rendent par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « tout le bien que Yahweh nous a fait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי / חֲסָדָיו
  choice: les marques d’amour fidèle / son amour fidèle
  rationale: חסד exprime ici un amour loyal, durable et lié à l’engagement de Dieu envers son peuple. Au premier emploi, le pluriel hébreu désigne naturellement les manifestations concrètes de cet amour; au second, le singulier collectif français s’accorde mieux avec «l’abondance».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אַזְכִּיר
  choice: Je rappellerai
  rationale: Le hifil de זכר décrit ici l’action de faire mémoire verbalement, dans un contexte de proclamation et de louange, et non un simple souvenir intérieur.
- source_word: תְּהִלֹּת
  choice: les louanges
  rationale: Ce choix conserve le pluriel et la formulation du texte, tout en permettant aux propositions suivantes d’expliciter les motifs de louange.
- source_word: כְּעַל כֹּל אֲשֶׁר
  choice: à la mesure de tout ce que
  rationale: La formulation garde la nuance comparative ou normative de la construction sans la réduire à un simple lien causal.
- source_word: גְּמָלָנוּ / גְּמָלָם
  choice: nous a accordé / a accordée à
  rationale: Dans ce contexte bienveillant, גמל désigne les bienfaits accordés. La formulation française reste naturelle tout en préservant le passage de «nous» à «la maison d’Israël».
- source_word: וְרַב טוּב
  choice: la grande bonté
  rationale: L’expression rend l’ampleur de la bonté divine sans transformer le nom abstrait en une liste de dons précis.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: «Maison d’Israël» conserve la désignation collective et historique du texte hébreu.
- source_word: כְּרַחֲמָיו
  choice: selon sa compassion
  rationale: Le singulier collectif français exprime naturellement la tendresse et la miséricorde portées par רחמים.
- source_word: וּכְרֹב חֲסָדָיו
  choice: et l’abondance de son amour fidèle
  rationale: «Abondance» rend רֹב, tandis que «amour fidèle» maintient le contenu relationnel et durable de חסד.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte emploie le nom divin lui-même. Sa translittération préserve cette donnée et évite de remplacer silencieusement un nom propre par un titre.
- issue: Sens théologique de חסד
  choice: amour fidèle
  alternative: bonté; bienveillance; miséricorde; fidélité à l’alliance
  rationale: «Amour fidèle» conserve à la fois la dimension affective, loyale et durable du terme, sans imposer une définition confessionnelle plus étroite.
- issue: Rapport entre les pronoms «nous» et la maison d’Israël
  choice: conserver le passage de «nous» à «la maison d’Israël»
  alternative: harmoniser tout le verset à la première ou à la troisième personne
  rationale: Le changement de perspective appartient au texte hébreu et peut refléter l’identification du locuteur au peuple avant qu’il ne le désigne explicitement; il ne convient pas de l’effacer.
translation_notes:
  register: Français international actuel, digne et lisible. La phrase conserve le mouvement ample et poétique de l’hébreu. «Marques d’amour fidèle» explicite naturellement le pluriel initial de חסד, tandis que «amour fidèle» au dernier membre évite une lourdeur en français. Tous les marqueurs de notes figurent dans le texte.
