  text: מַדּ֥וּעַ אָדֹ֖ם לִ/לְבוּשֶׁ֑/ךָ וּ/בְגָדֶ֖י/ךָ כְּ/דֹרֵ֥ךְ בְּ/גַֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
translation:
  language: fr
  text: Pourquoi ton vêtement est-il rouge[a], et pourquoi tes habits sont-ils comme ceux de quelqu’un qui foule dans un pressoir[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rougi » ou « écarlate » ; l’hébreu dit simplement « rouge », sans encore préciser la cause.
    reason: lexical_alternative
  - marker: b
    text: L’image est celle d’une personne qui foule des raisins dans un pressoir et dont les habits sont tachés de jus rouge.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Rend directement et naturellement l’adverbe interrogatif qui introduit la question.
- source_word: אָדֹם
  choice: rouge
  rationale: Préserve la simple indication de couleur sans préciser prématurément la cause de cette coloration.
- source_word: לִלְבוּשֶׁךָ
  choice: ton vêtement
  rationale: לְבוּשׁ désigne l’habillement ou le vêtement; le singulier français respecte ici la forme hébraïque et reste naturel.
- source_word: וּבְגָדֶיךָ
  choice: tes habits
  rationale: Rend le pluriel בְּגָדִים tout en conservant le parallélisme poétique avec « ton vêtement ».
- source_word: כְּדֹרֵךְ
  choice: comme ceux d’un homme qui foule le raisin
  rationale: Le participe désigne celui qui foule; la formulation française rattache naturellement la comparaison aux habits et explicite le geste sous-entendu par l’image du pressoir.
- source_word: בְּגַת
  choice: dans un pressoir
  rationale: גַּת désigne un pressoir à raisin; l’article indéfini correspond à l’absence d’article en hébreu et convient à la comparaison.
theological_decisions:
- issue: Faut-il expliciter l’image du sang et du jugement derrière les vêtements rouges ?
  choice: Conserver la description visuelle « rouge » sans ajouter « taché de sang ».
  alternative: Pourquoi tes vêtements sont-ils tachés de sang… ?
  rationale: Le verset décrit d’abord la couleur et évoque le pressoir; l’interprétation liée au sang et au jugement se précise dans la suite. La traduction préserve ainsi la progression et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « pourquoi » clarifie la coordination française sans modifier le sens de la question hébraïque. « Foule le raisin » rend l’image ancienne compréhensible sans développer l’interprétation théologique.
