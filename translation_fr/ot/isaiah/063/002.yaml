    issue: Ajout de « le raisin » dans le texte principal
    rationale: Le participe hébreu signifie « celui qui foule » et est suivi de « dans un pressoir » ; l’objet foulé est implicite dans l’image, non exprimé. Il vaut mieux le réserver à la note culturelle.
  - severity: low
    issue: La note b précise « éclaboussés »
    rationale: Le rapprochement porte sur des vêtements rouges ou tachés par le jus ; « éclaboussés » suggère plus précisément des projections. « Tachés de jus rouge » est plus neutre et plus fidèle à l’image.
