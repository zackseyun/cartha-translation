revisions:
- from: Pourquoi ton vêtement est-il rouge[a], et pourquoi tes habits sont-ils comme ceux d’un homme qui foule le raisin dans un pressoir[b] ?
  to: Pourquoi ton vêtement est-il rouge[a], et pourquoi tes habits sont-ils comme ceux de quelqu’un qui foule dans un pressoir[b] ?
  rationale: La révision retire du texte principal l’objet implicite « le raisin », afin de suivre de plus près la construction hébraïque, tout en conservant cette précision explicative dans la note culturelle. Elle remplace aussi « éclaboussés » par « tachés », formulation moins descriptive et mieux adaptée à la comparaison poétique.
