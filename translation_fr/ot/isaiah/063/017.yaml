revisions:
- from: Pourquoi, Yahweh, nous fais-tu errer loin de tes voies et endurcis-tu notre cœur, au point que nous ne te craignons plus ? Reviens[a] à cause de tes serviteurs, des tribus qui sont ton héritage.
  to: Pourquoi, Yahweh, nous fais-tu errer loin de tes voies et endurcis-tu notre cœur au point de nous éloigner de ta crainte ? Reviens[a] pour l’amour de tes serviteurs, les tribus de ton héritage.
  rationale: La révision retire l’ajout temporel « plus » et rend la séparation d’avec la crainte de Dieu dans une formulation française naturelle. Elle ajuste aussi la valeur de לְמַעַן en « pour l’amour de ». L’ambiguïté et la tension de l’attribution directe à Dieu sont préservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:33Z'
review_pass:
  verdict: revise
  source_fidelity: La causalité directe des deux hiphils est bien conservée, de même que le singulier collectif « notre cœur ». Toutefois, « nous ne te craignons plus » ajoute l’idée temporelle de cessation (« plus »), absente de l’hébreu. « À cause de » rend moins précisément la valeur bénéficiaire/intercessive de לְמַעַן.
  naturalness: Le français est globalement clair, digne et adapté à une lamentation. « Au point de nous éloigner de ta crainte » exprime plus naturellement le rapport de séparation qu’implique מִן, sans ajouter une durée ou un état antérieur.
  terminology: « Yahweh », « voies », « endurcis », « cœur », « crainte », « serviteurs », « tribus » et « héritage » sont appropriés. « Pour l’amour de » rend ici plus fidèlement לְמַעַן que « à cause de », tout en restant naturel dans un registre biblique moderne.
  issues:
  - severity: medium
    issue: Ajout de « plus » dans « nous ne te craignons plus »
    rationale: Le texte hébreu exprime l’éloignement de la crainte de Dieu résultant de l’endurcissement, mais ne dit pas explicitement que le peuple le craignait auparavant et a cessé de le faire.
  - severity: low
    issue: « À cause de » pour לְמַעַן
    rationale: Cette expression peut indiquer une cause générale; « pour l’amour de » restitue mieux l’appel lancé en faveur des serviteurs de Dieu.
  revised_text: Pourquoi, Yahweh, nous fais-tu errer loin de tes voies et endurcis-tu notre cœur au point de nous éloigner de ta crainte ? Reviens[a] pour l’amour de tes serviteurs, les tribus de ton héritage.
  revised_footnotes:
  - marker: a
    text: Ou « Tourne-toi de nouveau vers nous ». La demande appelle Yahweh à se tourner de nouveau vers son peuple avec faveur.
    reason: lexical_alternative
  revision_rationale: La révision retire l’ajout temporel « plus » et rend la séparation d’avec la crainte de Dieu dans une formulation française naturelle. Elle ajuste aussi la valeur de לְמַעַן en « pour l’amour de ». L’ambiguïté et la tension de l’attribution directe à Dieu sont préservées.
