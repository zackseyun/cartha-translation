source:
  edition: WLC
  text: לָ֣/מָּה תַתְעֵ֤/נוּ יְהוָה֙ מִ/דְּרָכֶ֔י/ךָ תַּקְשִׁ֥יחַ לִבֵּ֖/נוּ מִ/יִּרְאָתֶ֑/ךָ שׁ֚וּב לְמַ֣עַן עֲבָדֶ֔י/ךָ שִׁבְטֵ֖י נַחֲלָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
translation:
  language: fr
  text: Pourquoi, Yahweh, nous fais-tu errer loin de tes voies et endurcis-tu notre cœur au point de nous éloigner de ta crainte ? Reviens[a] pour l’amour de tes serviteurs, les tribus de ton héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tourne-toi de nouveau vers nous ». La demande appelle Yahweh à se tourner de nouveau vers son peuple avec faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Introduit directement la question de lamentation, sans ajouter d’intensité absente de l’hébreu.
- source_word: תַתְעֵנוּ
  choice: nous fais-tu errer
  rationale: Le hiphil de תעה est causatif. Cette formulation conserve l’attribution directe à Dieu sans aller jusqu’à suggérer qu’il trompe moralement son peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מִדְּרָכֶיךָ
  choice: loin de tes voies
  rationale: La préposition מִן marque ici l’éloignement. « Loin de » exprime naturellement en français le mouvement de séparation.
- source_word: תַּקְשִׁיחַ
  choice: endurcis-tu
  rationale: Le hiphil de קשׁח signifie rendre dur ou endurcir. Le verbe français conserve la force causative du texte.
- source_word: לִבֵּנוּ
  choice: notre cœur
  rationale: L’hébreu porte un singulier collectif, qui présente le peuple comme une communauté unie. Le français peut conserver cette image.
- source_word: מִיִּרְאָתֶךָ
  choice: au point que nous ne te craignons plus
  rationale: Après « endurcir », מִן exprime l’éloignement résultant par rapport à la crainte révérencielle de Dieu. Cette tournure est claire en français et garde le lien de conséquence.
- source_word: שׁוּב
  choice: Reviens
  rationale: Dans cette prière, שוב demande à Dieu de se tourner de nouveau vers son peuple et de lui manifester sa faveur.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Exprime le motif de l’intervention demandée. La formule est naturelle en français et n’implique pas que les serviteurs méritent cette faveur.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans ce contexte d’alliance et de prière, « serviteurs » convient mieux que « esclaves ».
- source_word: שִׁבְטֵי נַחֲלָתֶךָ
  choice: des tribus qui sont ton héritage
  rationale: Rend explicite l’apposition hébraïque et conserve le vocabulaire d’alliance qui présente Israël comme l’héritage de Dieu.
theological_decisions:
- issue: Causalité divine dans l’égarement et l’endurcissement
  choice: Conserver l’attribution causative directe à Yahweh
  alternative: 'Employer une formulation permissive : « pourquoi nous laisses-tu errer » ou « pourquoi permets-tu que notre cœur s’endurcisse »'
  rationale: Les deux verbes hébreux sont au hiphil et attribuent directement l’action à Yahweh. La prière exprime une tension théologique qu’une traduction ne doit pas résoudre en l’atténuant.
- issue: Singulier collectif de לִבֵּנוּ
  choice: notre cœur
  alternative: nos cœurs
  rationale: Contrairement à la dernière révision anglaise, la forme hébraïque est bien au singulier avec suffixe pluriel. Le singulier français préserve la solidarité collective du peuple.
- issue: Sens de שׁוּב adressé à Dieu
  choice: Reviens
  alternative: Tourne-toi de nouveau vers nous
  rationale: « Reviens » conserve la brièveté de l’impératif et la supplication en faveur du retour de la présence ou de la faveur divine, sans expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, digne et adapté à la prière. La syntaxe interrogative reste directe. « Notre cœur » est volontairement collectif et légèrement solennel. Le marqueur [a] figure immédiatement après le terme annoté.
