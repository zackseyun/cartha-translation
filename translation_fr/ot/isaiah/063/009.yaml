source:
  edition: WLC
  text: בְּֽ/כָל צָרָתָ֣/ם לא צָ֗ר וּ/מַלְאַ֤ךְ פָּנָי/ו֙ הֽוֹשִׁיעָ֔/ם בְּ/אַהֲבָת֥/וֹ וּ/בְ/חֶמְלָת֖/וֹ ה֣וּא גְאָלָ֑/ם וַֽ/יְנַטְּלֵ֥/ם וַֽ/יְנַשְּׂאֵ֖/ם כָּל יְמֵ֥י עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
translation:
  language: fr
  text: Dans toutes leurs détresses, il n’a pas été affligé[a], et l’ange de sa présence les a sauvés. Dans son amour et sa compassion, il les a rachetés ; il les a soulevés et portés tous les jours d’autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une ancienne variante de lecture : « Dans toutes leurs détresses, il a été affligé. » Le texte massorétique porte : « il n’a pas été affligé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  choice: Dans toutes leurs détresses
  rationale: La tournure exprime l’ensemble des situations d’affliction vécues par le peuple. Le pluriel français est naturel et conserve cette portée globale.
- source_word: לֹא צָר
  choice: il n’a pas été dans la détresse
  rationale: Cette traduction suit le texte massorétique vocalisé, qui porte la négation לֹא. La formulation reste volontairement proche de l’hébreu sans remplacer le texte par l’ancienne variante לוֹ צָר.
- source_word: וּמַלְאַךְ פָּנָיו
  choice: et l’ange de sa présence
  rationale: מַלְאָךְ peut signifier « messager » ou « ange » ; « ange » convient au contexte du salut divin. פָּנָיו évoque ici sa face, donc sa présence.
- source_word: הוֹשִׁיעָם
  choice: les a sauvés
  rationale: Le hiphil de יָשַׁע désigne l’action de sauver ou de délivrer ; « sauvés » en conserve la force et reste direct.
- source_word: בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ
  choice: Dans son amour et sa compassion
  rationale: La préposition ב peut indiquer le cadre ou le motif de l’action. Cette formulation française préserve le parallélisme et la dimension affective.
- source_word: הוּא גְאָלָם
  choice: il les a rachetés
  rationale: גאל désigne l’intervention du proche rédempteur et, par extension, la délivrance revendicatrice de Dieu. « Rachetés » maintient cette résonance sans développer l’image.
- source_word: וַיְנַטְּלֵם וַיְנַשְּׂאֵם
  choice: il les a soulevés et portés
  rationale: 'Les deux verbes successifs sont distingués : le premier évoque le fait de soulever ou prendre en charge, le second celui de porter.'
- source_word: כָּל יְמֵי עוֹלָם
  choice: tous les jours d’autrefois
  rationale: Dans ce contexte rétrospectif, עוֹלָם renvoie au passé lointain plutôt qu’à l’éternité future.
theological_decisions:
- issue: Lecture de לֹא צָר dans la première proposition
  choice: 'Suivre le texte massorétique : « il n’a pas été dans la détresse »'
  alternative: « dans toutes leurs détresses, il a été dans la détresse » ou, plus naturellement, « il a souffert avec eux », selon l’ancienne lecture לוֹ צָר
  rationale: Le WLC fourni lit explicitement לֹא, « ne… pas ». L’ancienne variante לוֹ, attestée par une tradition ancienne et souvent suivie, est importante mais ne doit pas remplacer silencieusement la leçon massorétique ; elle est donc signalée en note.
- issue: Identité de « l’ange de sa présence »
  choice: Conserver l’expression sans identifier davantage cet ange
  alternative: L’assimiler explicitement à une manifestation divine particulière
  rationale: Le verset associe étroitement cet ange au salut de Dieu, mais ne précise pas son identité. La traduction préserve cette tension sans importer une conclusion doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe poétique reste claire ; le point après « sauvés » allège la longue coordination hébraïque. La formulation inhabituelle de la première proposition est maintenue afin de respecter la leçon massorétique, tandis que l’autre lecture ancienne est donnée explicitement en note.
