id: ISA.62.2
reference: Isaiah 62:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָא֤וּ גוֹיִם֙ צִדְקֵ֔/ךְ וְ/כָל מְלָכִ֖ים כְּבוֹדֵ֑/ךְ וְ/קֹ֤רָא לָ/ךְ֙ שֵׁ֣ם חָדָ֔שׁ אֲשֶׁ֛ר פִּ֥י יְהוָ֖ה יִקֳּבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
translation:
  language: fr
  text: Les nations verront ta justice[a], et tous les rois, ta gloire ; on t’appellera d’un nom nouveau que la bouche de Yahweh désignera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture », « la reconnaissance de ton bon droit » ou « ta réhabilitation » pour « ta justice ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que la bouche de Yahweh le désignera », le pronom « le » renvoyant au nom nouveau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: verront
  rationale: Dans ce discours prophétique, la forme verbale se rend naturellement par un futur, qui conserve la portée prédictive.
- source_word: גוֹיִם
  choice: les nations
  rationale: Le terme désigne ici l’ensemble des peuples étrangers dans la perspective internationale d’Ésaïe ; « les nations » est plus large et plus naturel que « les païens ».
- source_word: צִדְקֵךְ
  choice: ta justice
  rationale: צדק peut évoquer la justice, la droiture ou la reconnaissance publique du bon droit. « Justice » conserve en français la largeur lexicale et théologique du terme sans réduire le contexte à la seule réhabilitation.
- source_word: וְכָל מְלָכִים
  choice: et tous les rois
  rationale: Cette formulation directe et idiomatique garde le parallélisme avec « les nations ».
- source_word: כְּבוֹדֵךְ
  choice: ta gloire
  rationale: « Gloire » exprime la manifestation publique de l’honneur et de la splendeur de Sion tout en correspondant au vocabulaire théologique habituel d’Ésaïe.
- source_word: וְקֹרָא לָךְ
  choice: on t’appellera
  rationale: Le verbe hébreu est formellement à la troisième personne masculine du singulier, mais le français emploie naturellement le pronom indéfini « on » dans cette formule d’attribution d’un nom. La suite précise que ce nom vient de Yahweh.
- source_word: שֵׁם חָדָשׁ
  choice: un nom nouveau
  rationale: La tournure française naturelle évoque une identité ou une condition nouvelle accordée à Sion.
- source_word: אֲשֶׁר פִּי יְהוָה
  choice: que la bouche de Yahweh
  rationale: Le maintien de « la bouche » préserve l’image anthropomorphique de l’hébreu et souligne que le nom procède de la parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend distinctement le nom divin dans un français moderne et international.
- source_word: יִקֳּבֶנּוּ
  choice: désignera
  rationale: Le verbe נקב signifie ici préciser, désigner ou nommer. « Désignera » évite la répétition maladroite de « nom » et « nommer » tout en conservant l’idée que Yahweh détermine le nom.
theological_decisions:
- issue: Sens de צִדְקֵךְ dans le rétablissement public de Sion
  choice: ta justice
  alternative: ta droiture ; la reconnaissance de ton bon droit ; ta réhabilitation
  rationale: « Justice » maintient la tension entre la qualité juste de Sion, l’action juste de Dieu en sa faveur et sa réhabilitation visible devant les nations, sans imposer un seul de ces aspects.
- issue: Formule divine d’attribution du nom
  choice: on t’appellera d’un nom nouveau que la bouche de Yahweh désignera
  alternative: il te donnera un nom nouveau que la bouche de Yahweh nommera
  rationale: La formulation retenue reste naturelle en français, conserve l’image de la bouche de Yahweh et ne masque pas que la nouvelle identité est fixée par la parole divine.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse prophétique à Sion. La ponctuation met en relief le parallélisme poétique sans alourdir la phrase.
