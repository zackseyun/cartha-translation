revisions:
- from: 'Yahweh l’a juré par sa main droite et par son bras puissant : « Jamais plus je ne livrerai ton blé en nourriture à tes ennemis[a], et jamais plus les étrangers ne boiront le vin nouveau pour lequel tu as travaillé. »'
  to: 'Yahweh a juré par sa main droite et par son bras puissant : « Je ne donnerai plus jamais ton blé comme nourriture à tes ennemis[a], et les étrangers ne boiront plus ton vin nouveau, pour lequel tu as travaillé. »'
  rationale: 'La révision améliore deux tournures françaises sans modifier le sens : « donner ... comme nourriture » rend plus idiomatiquement le don du grain aux ennemis, et « Yahweh a juré par » évite un pronom anticipatif. La virgule avant la relative finale clarifie que le labeur se rapporte au vin nouveau, tout en restant conforme à l’hébreu.'
