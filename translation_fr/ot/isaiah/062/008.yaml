  source_fidelity: 'Le sens fondamental est bien rendu : Yahweh prête serment par sa main droite et son bras puissant, avec la négation énergique implicite de la formule hébraïque explicitée. « Ton blé », « les étrangers », « le vin nouveau » et l’adresse féminine singulière sont fidèles au texte. La révision maintient l’application de « plus jamais » à l’ensemble de la promesse, conformément à la portée de la formule de serment.'
  naturalness: « Livrer ton blé en nourriture à tes ennemis » est compréhensible, mais moins idiomatique que « donner ton blé comme nourriture à tes ennemis ». « Yahweh a juré par… » est aussi plus direct et naturel que « Yahweh l’a juré par… », dont le pronom est légèrement anticipatif.
  terminology: « Yahweh », « bras puissant », « blé », « vin nouveau » et « étrangers » conviennent au français international moderne et préservent les distinctions pertinentes du texte hébreu. Aucun enjeu doctrinal n’est introduit.
