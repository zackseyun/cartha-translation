  text: נִשְׁבַּ֧ע יְהוָ֛ה בִּֽ/ימִינ֖/וֹ וּ/בִ/זְר֣וֹעַ עֻזּ֑/וֹ אִם אֶתֵּן֩ אֶת דְּגָנֵ֨/ךְ ע֤וֹד מַֽאֲכָל֙ לְ/אֹ֣יְבַ֔יִ/ךְ וְ/אִם יִשְׁתּ֤וּ בְנֵֽי נֵכָר֙ תִּֽירוֹשֵׁ֔/ךְ אֲשֶׁ֥ר יָגַ֖עַתְּ בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
translation:
  language: fr
  text: 'Yahweh a juré par sa main droite et par son bras puissant : « Je ne donnerai plus jamais ton blé comme nourriture à tes ennemis[a], et les étrangers ne boiront plus ton vin nouveau, pour lequel tu as travaillé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Si je donne encore ton blé… et si les fils de l’étranger boivent ton vin nouveau… » Dans cette formule de serment, « si » exprime une négation solennelle : « certainement pas ».'
    reason: La formule de serment hébraïque est elliptique ; une traduction littérale par « si » en français n’en communiquerait pas la valeur négative.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu, conformément à l’usage du projet.
- source_word: נִשְׁבַּע
  choice: l’a juré
  rationale: Le parfait nifal exprime un serment effectivement prononcé; le passé composé convient naturellement en français actuel.
- source_word: בִּימִינוֹ
  choice: par sa main droite
  rationale: Reproduit simplement l’image et la formule de serment hébraïques.
- source_word: וּבִזְרֹעַ עֻזּוֹ
  choice: et par son bras puissant
  rationale: Rend naturellement le groupe littéral « le bras de sa force » tout en conservant l’accent sur la puissance.
- source_word: אִם אֶתֵּן ... וְאִם יִשְׁתּוּ
  choice: Jamais plus je ne livrerai ... et jamais plus ... ne boiront
  rationale: Après le verbe « jurer », אִם introduit ici une formule de serment elliptique ayant valeur de forte négation; une traduction littérale par « si » serait trompeuse en français.
- source_word: דְּגָנֵךְ
  choice: ton blé
  rationale: Dans ce contexte agricole, « blé » est un équivalent français courant de דגן, qui désigne les céréales ou le grain récolté.
- source_word: מַאֲכָל לְאֹיְבַיִךְ
  choice: en nourriture à tes ennemis
  rationale: Conserve le sens concret du produit agricole remis aux ennemis pour être consommé.
- source_word: בְנֵי נֵכָר
  choice: les étrangers
  rationale: Rend en français naturel l’expression idiomatique littérale « fils de l’étranger ».
- source_word: תִּירוֹשֵׁךְ
  choice: le vin nouveau
  rationale: Préserve la distinction lexicale de תירוש, qui désigne le vin nouveau ou le produit frais de la vendange.
- source_word: אֲשֶׁר יָגַעַתְּ בּוֹ
  choice: pour lequel tu as travaillé
  rationale: Rend l’idée d’un labeur ou d’une peine consacrée à sa production, sans préciser davantage que l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le nom propre divin; sa transcription préserve cette donnée sans la remplacer par un titre.
- issue: Valeur de אִם dans la formule de serment
  choice: Expliciter la forte négation par « Jamais plus ... ne »
  alternative: Conserver littéralement « Si je livre... et si les étrangers boivent... »
  rationale: L’hébreu laisse elliptique la conséquence imprécatoire du serment. En français, la négation explicite communique correctement sa force pragmatique sans ajouter de contenu doctrinal.
- issue: Référent du suffixe féminin singulier « ton/tes »
  choice: Conserver l’adresse au féminin singulier
  alternative: Neutraliser ou pluraliser l’adresse
  rationale: Les suffixes hébreux s’adressent à une figure féminine singulière, vraisemblablement Sion/Jérusalem dans le contexte; le français « ton/tes » conserve le nombre sans devoir nommer explicitement cette destinataire.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le discours direct met en relief les paroles jurées sans modifier leur contenu. « Jamais plus » restitue à la fois la négation énergique de la formule de serment et עוֹד (« encore »). Le tutoiement singulier suit l’adresse poétique à Sion/Jérusalem.
