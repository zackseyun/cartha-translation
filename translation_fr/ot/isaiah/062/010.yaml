source:
  edition: WLC
  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
translation:
  language: fr
  text: Passez, passez par les portes ! Dégagez le chemin pour le peuple. Construisez, construisez la chaussée ! Débarrassez-la des pierres. Dressez un étendard au-dessus des peuples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dressez un signal au-dessus des peuples. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ
  choice: Passez, passez
  rationale: L’impératif répété exprime directement le mouvement et conserve l’insistance rhétorique de l’hébreu.
- source_word: בַּשְּׁעָרִים
  choice: par les portes
  rationale: Avec le verbe précédent, la préposition indique naturellement le passage par les portes, sans ajouter explicitement « de la ville ».
- source_word: פַּנּוּ דֶּרֶךְ
  choice: Dégagez le chemin
  rationale: Au piel, פנה peut désigner l’action de débarrasser ou de préparer une voie. « Dégagez » convient à l’image des travaux routiers.
- source_word: הָעָם
  choice: le peuple
  rationale: Le singulier collectif est maintenu et se distingue du pluriel « les peuples » à la fin du verset.
- source_word: סֹלּוּ סֹלּוּ
  choice: Construisez, construisez
  rationale: Dans ce contexte routier, סלל évoque l’aménagement par remblai d’une voie. La répétition de l’impératif est conservée.
- source_word: הַמְסִלָּה
  choice: la chaussée
  rationale: מסלה désigne une voie aménagée, souvent surélevée. « Chaussée » rend l’idée d’une route construite sans suggérer nécessairement une autoroute moderne.
- source_word: סַקְּלוּ מֵאֶבֶן
  choice: Enlevez-en les pierres
  rationale: Le piel de סקל signifie ici débarrasser la voie des pierres. Le pronom « en » reprend naturellement « la chaussée ».
- source_word: הָרִימוּ נֵס
  choice: Dressez un étendard
  rationale: נס désigne un signal visible, une bannière ou un étendard servant de point de ralliement. « Dressez un étendard » garde cette image publique.
- source_word: עַל הָעַמִּים
  choice: au-dessus des peuples
  rationale: Cette formulation conserve le sens spatial direct de על ainsi que le pluriel עמים, tout en laissant ouverte la fonction précise de l’étendard.
theological_decisions:
- issue: Référent du singulier « le peuple » et du pluriel « les peuples »
  choice: Maintenir la distinction entre « le peuple » et « les peuples »
  alternative: Comprendre les deux expressions comme désignant Israël, ou les appliquer toutes deux à l’ensemble des nations
  rationale: L’hébreu passe intentionnellement du singulier collectif הָעָם au pluriel הָעַמִּים. La traduction préserve ce contraste sans préciser davantage les référents dans le corps du texte.
- issue: Portée de la préposition עַל devant « les peuples »
  choice: au-dessus des peuples
  alternative: pour les peuples / à l’intention des peuples
  rationale: Le sens spatial est le plus direct. Une valeur fonctionnelle est possible, mais la préciser dans le texte résoudrait une ambiguïté que l’hébreu laisse ouverte.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Les répétitions impératives sont conservées pour rendre la vigueur poétique. « Chaussée » exprime une voie construite ou surélevée, et « étendard » garde l’imagerie ancienne sans archaïsme syntaxique.
