review_pass:
  verdict: revise
  source_fidelity: Le texte conserve bien les impératifs répétés, le passage par les portes, l’opposition entre « le peuple » (singulier collectif) et « les peuples » (pluriel), ainsi que l’image de la chaussée et de l’étendard. « Construisez, construisez la chaussée » est une restitution acceptable de סללו סללו. En revanche, « Enlevez-en les pierres » ne rend pas correctement ni naturellement l’impératif סַקְּלוּ, qui commande de débarrasser la chaussée des pierres.
  naturalness: 'Le registre est actuel et soutenu. La séquence « Enlevez-en les pierres » est toutefois maladroite et sémantiquement confuse en français : le pronom « en » ne peut pas reprendre naturellement « la chaussée » dans cette construction. « Débarrassez-la des pierres » est idiomatique et explicite.'
  terminology: « Chaussée » convient à מְסִלָּה, voie aménagée ou rehaussée; « étendard » convient à נֵס. « Au-dessus des peuples » préserve utilement la valeur spatiale première de עַל sans fixer une interprétation fonctionnelle. La note doit conserver cette même préposition afin de ne pas transformer l’alternative lexicale en interprétation.
  issues:
  - severity: medium
    issue: « Enlevez-en les pierres »
    rationale: Cette formulation est non idiomatique et ne désigne pas clairement la chaussée comme l’objet à débarrasser. L’hébreu demande de retirer les pierres de la voie. « Débarrassez-la des pierres » rend directement le sens et la syntaxe.
  - severity: low
    issue: La note propose « pour les peuples » au lieu de conserver « au-dessus des peuples »
    rationale: « Signal » est une alternative lexicale valable pour נֵס, mais « pour » interprète la préposition עַל, dont le texte principal maintient à juste titre la valeur spatiale. La note devrait limiter l’alternative à « signal ».
  revised_text: Passez, passez par les portes ! Dégagez le chemin pour le peuple. Construisez, construisez la chaussée ! Débarrassez-la des pierres. Dressez un étendard au-dessus des peuples.[a]
