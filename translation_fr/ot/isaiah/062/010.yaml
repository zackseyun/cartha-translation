revisions:
- from: Passez, passez par les portes ! Dégagez le chemin pour le peuple. Construisez, construisez la chaussée ! Enlevez-en les pierres. Dressez un étendard au-dessus des peuples.[a]
  to: Passez, passez par les portes ! Dégagez le chemin pour le peuple. Construisez, construisez la chaussée ! Débarrassez-la des pierres. Dressez un étendard au-dessus des peuples.[a]
  rationale: La révision corrige la construction française fautive relative aux pierres et ajuste la note pour qu’elle offre seulement l’alternative lexicale « signal » pour נֵס, sans résoudre autrement l’ambiguïté de עַל. Le reste du texte est conservé, car il respecte la répétition, les images routières et la distinction voulue entre le singulier « le peuple » et le pluriel « les peuples ».
  reviewer_model: gpt-5.6-terra
