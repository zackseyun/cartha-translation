  source_fidelity: 'Le texte rend fidèlement les deux images nominales hébraïques : « une couronne de splendeur » pour עֲטֶרֶת תִּפְאֶרֶת et « un turban royal » pour צָנִיף מְלוּכָה. « Dans la main » et « dans la paume » maintiennent avec justesse la variation entre יָד et כַּף. Le futur « Tu seras » convient au parfait prophétique adressé à Sion au féminin singulier. « Yahweh » et « ton Dieu » correspondent respectivement à יְהוָה et אֱלֹהָיִךְ.'
  naturalness: Le français est moderne, fluide et d’un registre biblique sobre. La reprise de « dans » dans les deux membres est naturelle et ne neutralise pas le parallélisme. « Turban royal » est une expression claire et concrète.
  terminology: 'Les termes essentiels sont cohérents : « Yahweh » conserve le tétragramme, « Dieu » rend אֱלֹהִים au singulier contextuel, et la distinction imagée entre « couronne » et « turban » est préservée. La note est lexicalement exacte et son ancre [a] est correctement placée après « turban royal ».'
