id: ISA.62.3
reference: Isaiah 62:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
translation:
  language: fr
  text: 'Tu seras une couronne de splendeur dans la main de Yahweh,

    et un turban royal[a] dans la paume de ton Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une coiffure royale » ou « un diadème royal ». Le nom hébreu désigne une coiffure faite d’une étoffe enroulée, semblable à un turban.
    reason: Alternative lexicale pour צָנִיף, dont l’image concrète peut être rendue de plusieurs façons en français.
lexical_decisions:
- source_word: וְהָיִיתְ
  choice: Tu seras
  rationale: Le parfait qal à la 2e personne du féminin singulier, précédé de la conjonction et employé dans un discours prophétique, a ici une valeur future. Le féminin singulier maintient l’adresse directe à Sion/Jérusalem.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: une couronne de splendeur
  rationale: Cette formulation conserve la relation de construction entre les deux noms et rend תִּפְאֶרֶת par un terme naturel qui évoque à la fois l’éclat, la beauté et la magnificence.
- source_word: בְּיַד
  choice: dans la main de
  rationale: La traduction concrète préserve l’image de Sion tenue comme un objet précieux, sans réduire la main à une simple métaphore de puissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וְצָנִיף מְלוּכָה
  choice: et un turban royal
  rationale: צָנִיף désigne une coiffure faite d’une étoffe enroulée, tandis que מְלוּכָה lui confère ici un caractère royal. « Turban » garde une image distincte de celle de la couronne.
- source_word: בְּכַף
  choice: dans la paume de
  rationale: כַּף désigne précisément la paume ou le creux de la main. Ce choix préserve la variation poétique par rapport à יָד dans le premier membre.
- source_word: אֱלֹהָיִךְ
  choice: ton Dieu
  rationale: Avec le suffixe féminin singulier et dans ce contexte, אֱלֹהִים désigne le Dieu d’Israël au singulier; le possessif maintient la relation d’alliance exprimée dans l’adresse à Sion.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre; « Jéhovah » repose sur une vocalisation traditionnelle plus tardive.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le parallélisme concret entre « main » et « paume », ainsi que la distinction entre « couronne » et « turban », est conservé. Le marqueur de note est placé après « turban royal », expression à laquelle la note se rapporte.
