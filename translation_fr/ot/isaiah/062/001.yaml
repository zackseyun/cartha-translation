source:
  edition: WLC
  text: לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם לֹ֣א אֶשְׁק֑וֹט עַד יֵצֵ֤א כַ/נֹּ֨גַהּ֙ צִדְקָ֔/הּ וִ/ישׁוּעָתָ֖/הּ כְּ/לַפִּ֥יד יִבְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
translation:
  language: fr
  text: Pour Sion, je[c] ne garderai pas le silence ; pour Jérusalem, je ne connaîtrai pas de repos[a], jusqu’à ce que sa justice[b] paraisse comme une lumière éclatante et que son salut brûle comme une torche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne resterai pas tranquille ». Le verbe hébreu peut exprimer le fait d’être tranquille, immobile ou au repos.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa réhabilitation ». Le mot hébreu peut désigner la justice au sens moral ou relationnel, mais aussi une réhabilitation rendue publique.
    reason: lexical_alternative
  - marker: c
    text: Le verset n’identifie pas explicitement celui qui parle. Il peut s’agir du prophète, du SEIGNEUR ou d’une autre voix représentative.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: pour
  rationale: Dans « Pour Sion » et « pour Jérusalem », cette formulation française concise exprime la motivation ou l’intérêt en jeu et conserve le parallélisme.
- source_word: אֶחֱשֶׁה
  choice: je ne garderai pas le silence
  rationale: Rend directement l’idée de ne pas se taire, dans un français naturel et soutenu.
- source_word: אֶשְׁקוֹט
  choice: je ne resterai pas tranquille
  rationale: Le verbe peut signifier être calme, tranquille ou au repos. Cette formulation conserve l’idée d’une action qui ne cesse pas tout en restant distincte du silence du premier membre.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Marque la poursuite de l’action jusqu’à l’aboutissement annoncé.
- source_word: יֵצֵא
  choice: jaillisse
  rationale: Le sens fondamental est « sortir ». Avec l’image lumineuse, « jaillir » produit en français une expression naturelle sans préciser indûment qu’il s’agit de l’aube.
- source_word: כַנֹּגַהּ
  choice: comme une clarté
  rationale: נֹגַהּ désigne la clarté ou la splendeur lumineuse. « Clarté » préserve cette image sans la restreindre à l’aurore.
- source_word: צִדְקָהּ
  choice: sa justice
  rationale: Le terme peut désigner la justice ou la rectitude, avec en contexte une nuance possible de réhabilitation publique. « Justice » conserve sa portée morale et relationnelle.
- source_word: וִישׁוּעָתָהּ
  choice: son salut
  rationale: « Salut » garde l’ampleur du terme, qui comprend délivrance, secours et restauration.
- source_word: כְלַפִּיד
  choice: comme une torche
  rationale: לַפִּיד désigne une torche, image vive et visible, plutôt qu’une petite lampe.
- source_word: יִבְעָר
  choice: brûle
  rationale: Rend directement le verbe « brûler » sans ajouter une intensité qui n’est pas explicitement formulée.
theological_decisions:
- issue: Identité du locuteur à la première personne
  choice: Le locuteur reste non identifié dans le texte traduit.
  alternative: Identifier le locuteur comme le prophète, le SEIGNEUR ou une voix représentative telle que celle des veilleurs.
  rationale: L’hébreu n’identifie pas explicitement celui qui parle. Conserver « je » sans ajouter de nom préserve l’ambiguïté réelle du passage.
- issue: Portée de צִדְקָהּ
  choice: sa justice
  alternative: sa réhabilitation
  rationale: Dans ce contexte prophétique, le mot peut évoquer à la fois la justice de Jérusalem et sa réhabilitation manifeste. Le texte principal conserve le terme plus large, tandis qu’une note signale l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que les images de la lumière et de la torche. Le point-virgule distingue les deux membres parallèles sans alourdir le verset.
