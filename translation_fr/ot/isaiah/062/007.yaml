source:
  edition: WLC
  text: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ עַד יְכוֹנֵ֞ן וְ/עַד יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
translation:
  language: fr
  text: et ne lui laissez aucun repos[a] jusqu’à ce qu’il établisse Jérusalem et jusqu’à ce qu’il fasse de Jérusalem un sujet de louange sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « silence ». Le mot hébreu peut désigner le silence, le calme ou le repos.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le pays ». Le mot hébreu peut désigner soit la terre, soit le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּתְּנוּ
  choice: et ne lui laissez aucun
  rationale: La conjonction et la négation poursuivent l’exhortation du verset précédent. Avec דֳמִי, « ne lui laissez aucun repos » rend naturellement l’idée de ne pas accorder de répit.
- source_word: דֳמִי לוֹ
  choice: repos
  rationale: Le nom peut désigner le silence, le calme ou le repos. Dans cette construction, « ne lui laissez aucun repos » exprime en français courant l’appel incessant adressé au Seigneur, tout en conservant l’image hébraïque.
- source_word: עַד יְכוֹנֵן
  choice: jusqu’à ce qu’il établisse
  rationale: כון exprime ici l’action d’affermir ou d’établir. Jérusalem, explicitée dans la proposition parallèle, est naturellement comprise comme objet dans la première.
- source_word: וְעַד יָשִׂים אֶת יְרוּשָׁלִַם
  choice: et fasse d’elle
  rationale: La répétition de עַד introduit un second but parallèle. En français, le pronom « elle » évite une répétition lourde de « Jérusalem » sans modifier le sens.
- source_word: תְּהִלָּה
  choice: un sujet de louange
  rationale: Le nom signifie « louange » et peut désigner ce qui suscite la louange. « Un sujet de louange » est plus naturel et plus clair en français que « une louange », tout en préservant la métaphore.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre entière ou le pays. Le contexte de la renommée publique de Jérusalem permet la portée universelle « sur la terre »; l’autre possibilité est signalée en note.
theological_decisions:
- issue: Référent du pronom « lui »
  choice: Le Seigneur, auquel les veilleurs adressent sans cesse leur appel
  alternative: Un référent divin ou céleste laissé implicite
  rationale: Ésaïe 62:6 mentionne ceux qui rappellent le Seigneur à son souvenir et leur ordonne de ne pas garder le silence; le pronom masculin singulier du verset 7 reprend naturellement le Seigneur.
- issue: Objet implicite de יְכוֹנֵן
  choice: Jérusalem
  alternative: La situation promise ou l’œuvre de restauration, comprise plus largement
  rationale: Le parallélisme avec la proposition suivante, où Jérusalem est l’objet explicite de יָשִׂים, soutient fortement l’ellipse de « Jérusalem » après « établisse ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « ne lui laissez aucun repos » est idiomatique tout en restant proche de l’hébreu; « un sujet de louange » clarifie la valeur prédicative de תְּהִלָּה. La répétition hébraïque de « jusqu’à ce que » est légèrement resserrée pour une lecture française naturelle.
