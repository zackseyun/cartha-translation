  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
translation:
  language: fr
  text: On ne t’appellera plus « Abandonnée », et l’on n’appellera plus ta terre « Dévastée ». On t’appellera « Elle fait mes délices »[a], et ta terre « Épousée »[b], car Yahvé trouve son plaisir en toi, et ta terre sera épousée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Hephzibah, nom qui signifie « Elle fait mes délices ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : Beulah, nom qui signifie « Épousée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  choice: Abandonnée
  rationale: Le participe passif désigne celle qui a été laissée ou délaissée. Employé ici comme un nom symbolique, « Abandonnée » est clair, actuel et conserve le féminin de la Sion personnifiée.
- source_word: שְׁמָמָה
  choice: Dévastée
  rationale: Le mot évoque un lieu ravagé et laissé dans la désolation. « Dévastée » fonctionne naturellement comme nom symbolique appliqué à la terre et évite le sens affectif que « désolée » peut avoir en français courant.
- source_word: חֶפְצִי בָהּ
  choice: Mon plaisir est en elle
  rationale: Cette expression forme un nom symbolique dont le sens est transparent en hébreu. La traduction en restitue les éléments et maintient le lien lexical avec le verbe חָפֵץ qui suit.
- source_word: בְּעוּלָה
  choice: Épousée
  rationale: Le terme exprime le statut d’une femme mariée. « Épousée » conserve la forme passive, le féminin et l’image matrimoniale appliquée à la terre.
- source_word: חָפֵץ
  choice: prend plaisir en
  rationale: Cette formulation reprend le vocabulaire du nom « Mon plaisir est en elle » et rend explicitement la joie ou la faveur de Yahvé envers Sion.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme « Yahvé » représente directement le nom divin et correspond à son usage courant en français international.
- source_word: תִּבָּעֵל
  choice: sera épousée
  rationale: Le niphal de בעל est rendu comme un passif matrimonial. La formulation reprend « Épousée » et préserve sans l’atténuer la métaphore de restauration conjugale.
- source_word: לָךְ / אַרְצֵךְ
  choice: toi / ta terre
  rationale: Le texte distingue la Sion personnifiée de sa terre. « Ta terre » permet en outre de conserver le féminin de la métaphore matrimoniale hébraïque.
theological_decisions:
- issue: Traduction des noms symboliques ou translittération traditionnelle
  choice: Traduire dans le texte les noms par « Abandonnée », « Dévastée », « Mon plaisir est en elle » et « Épousée »
  alternative: Employer les translittérations traditionnelles, notamment Hefziba et Béoula
  rationale: Ces appellations ont un sens immédiatement perceptible en hébreu et structurent l’annonce du renversement de situation. Leur traduction rend la force rhétorique du passage; les formes traditionnelles sont données en notes.
- issue: Métaphore matrimoniale appliquée à la terre
  choice: Conserver directement « Épousée » et « sera épousée »
  alternative: Généraliser en parlant seulement de restauration, d’habitation ou de possession
  rationale: Le texte hébreu emploie expressément deux formes de בעל. Garder l’image matrimoniale préserve la tension poétique et théologique du texte sans l’expliquer ni l’atténuer.
translation_notes:
  register: Français moderne, digne et accessible. Les guillemets signalent clairement les quatre noms symboliques. Le choix de « terre », plutôt que « pays », conserve le féminin grammatical nécessaire au parallélisme avec la Sion personnifiée et à l’image matrimoniale.
