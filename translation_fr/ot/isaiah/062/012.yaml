  text: וְ/קָרְא֥וּ לָ/הֶ֛ם עַם הַ/קֹּ֖דֶשׁ גְּאוּלֵ֣י יְהוָ֑ה וְ/לָ/ךְ֙ יִקָּרֵ֣א דְרוּשָׁ֔ה עִ֖יר לֹ֥א נֶעֱזָֽבָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
translation:
  language: fr
  text: On les appellera « le peuple saint, ceux que Yahweh a rachetés[a] » ; et toi, on t’appellera « Recherchée[b], ville qui n’est pas abandonnée[c] ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rachetés de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Celle que l’on recherche » ou « Celle dont on s’enquiert ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ville qui n’est pas délaissée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ לָהֶם
  choice: On les appellera
  rationale: Le pluriel indéfini hébreu se rend naturellement par « on » en français. La tournure avec קרא et ל est une formule d’attribution de nom ou de titre.
- source_word: עַם הַקֹּדֶשׁ
  choice: le peuple saint
  rationale: עַם désigne ici un peuple, tandis que la construction définie présente l’expression comme un titre.
- source_word: גְּאוּלֵי יְהוָה
  choice: ceux que Yahweh a rachetés
  rationale: Cette formulation française exprime clairement le sens passif et résultatif du participe tout en conservant Yahweh comme auteur naturel du rachat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément au texte hébreu.
- source_word: וְלָךְ יִקָּרֵא
  choice: et toi, on t’appellera
  rationale: La forme passive hébraïque est rendue par une construction française idiomatique qui maintient le parallèle avec « On les appellera ». Le féminin singulier s’adresse à Sion ou Jérusalem personnifiée.
- source_word: דְרוּשָׁה
  choice: Recherchée
  rationale: Le participe féminin de דרשׁ signifie que la ville est recherchée ou que l’on se soucie d’elle. La majuscule indique qu’il s’agit d’un titre nouveau.
- source_word: עִיר לֹא נֶעֱזָבָה
  choice: ville qui n’est pas abandonnée
  rationale: Cette apposition décrit la ville restaurée. « Abandonnée » est naturel en français moderne et maintient le contraste avec son état antérieur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; sa translittération préserve le caractère personnel du nom divin sans lui substituer un titre.
- issue: Rapport entre Yahweh et les personnes rachetées dans גְּאוּלֵי יְהוָה
  choice: ceux que Yahweh a rachetés
  alternative: les rachetés de Yahweh
  rationale: Le génitif hébreu peut formellement exprimer l’appartenance ou l’agent. Le contexte de délivrance favorise Yahweh comme auteur du rachat, tandis que la note conserve l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle des deux formules de nomination est conservée, et les titres sont signalés par des majuscules.
