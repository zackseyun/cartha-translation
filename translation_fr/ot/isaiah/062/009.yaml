  text: כִּ֤י מְאַסְפָי/ו֙ יֹאכְלֻ֔/הוּ וְ/הִֽלְל֖וּ אֶת יְהוָ֑ה וּֽ/מְקַבְּצָ֥י/ו יִשְׁתֻּ֖/הוּ בְּ/חַצְר֥וֹת קָדְשִֽׁ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
translation:
  language: fr
  text: Mais[a] ceux qui l’auront récolté le mangeront et loueront Yahweh ; et ceux qui l’auront recueilli le boiront dans les cours de mon sanctuaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car ceux qui l’auront récolté le mangeront. » Le mot hébreu peut aussi se rendre par « car » ou « en effet » ; « mais » souligne ici le contraste avec le verset précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « dans les cours de mon lieu saint ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: Dans le contexte, la particule introduit le contraste avec le verset précédent, où les étrangers sont exclus de la consommation des récoltes. « Car » reste néanmoins possible.
- source_word: מְאַסְפָיו
  choice: ceux qui l’auront récolté
  rationale: Le participe désigne ceux qui rentrent le produit de la terre, ici le grain évoqué au verset précédent. Le futur antérieur exprime naturellement en français l’action préalable à sa consommation.
- source_word: יֹאכְלֻהוּ
  choice: le mangeront
  rationale: Rend directement le verbe « manger » et son pronom objet masculin singulier, qui renvoie au produit récolté.
- source_word: וְהִלְלוּ אֶת־יְהוָה
  choice: et loueront Yahweh
  rationale: Le piel de הלל signifie couramment « louer ». Le nom divin est translittéré « Yahweh ».
- source_word: וּמְקַבְּצָיו
  choice: ceux qui l’auront recueilli
  rationale: Le verbe קבץ évoque le rassemblement ou la collecte. « Recueilli » maintient le parallélisme tout en évitant une répétition exacte de « récolté ».
- source_word: יִשְׁתֻּהוּ
  choice: le boiront
  rationale: Le verbe signifie simplement « boire » ; d’après le contexte précédent, le pronom renvoie au vin nouveau.
- source_word: בְּחַצְרוֹת קָדְשִׁי
  choice: dans les cours de mon sanctuaire
  rationale: חצרות désigne les cours d’un ensemble architectural, tandis que קדשי est compris concrètement comme le lieu saint appartenant à Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en conserve la valeur de nom propre sans substituer un titre.
- issue: Sens cultuel de קָדְשִׁי
  choice: mon sanctuaire
  alternative: mon lieu saint / ma sainteté
  rationale: Associé aux « cours », le nom désigne naturellement un espace sacré concret, tout en laissant une note signaler le rendu plus littéral.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébraïque est conservé ; les futurs antérieurs rendent clairement la récolte préalable à la consommation. Tous les marqueurs de notes figurent dans le texte.
