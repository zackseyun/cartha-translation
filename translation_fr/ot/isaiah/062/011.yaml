  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה הִשְׁמִ֨יעַ֙ אֶל קְצֵ֣ה הָ/אָ֔רֶץ אִמְרוּ֙ לְ/בַת צִיּ֔וֹן הִנֵּ֥ה יִשְׁעֵ֖/ךְ בָּ֑א הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
translation:
  language: fr
  text: 'Voici, Yahweh l’a proclamé jusqu’à l’extrémité de la terre :


    « Dites à la fille de Sion :


    “Voici, ton salut[a] arrive ;


    voici, sa récompense est avec lui,


    et sa rétribution est devant lui.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton sauveur arrive ». L’hébreu dit littéralement « ton salut », mais les expressions qui suivent emploient des pronoms masculins (« sa récompense… sa rétribution »), ce qui peut personnifier le salut dans celui qui vient délivrer.
    reason: Lecture alternative préservant l’ambiguïté entre le salut annoncé et sa personnification dans un sauveur.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: הִשְׁמִיעַ
  choice: l’a proclamé
  rationale: Le hiphil de שׁמע exprime ici l’action de faire entendre publiquement, donc de proclamer.
- source_word: אֶל קְצֵה הָאָרֶץ
  choice: jusqu’à l’extrémité de la terre
  rationale: Conserve le singulier hébreu et le mouvement de la proclamation vers la limite de la terre.
- source_word: לְבַת צִיּוֹן
  choice: à la fille de Sion
  rationale: Préserve la personnification poétique de Sion sous une forme biblique claire en français.
- source_word: יִשְׁעֵךְ
  choice: ton salut
  rationale: Rend directement le nom hébreu « salut, délivrance » sans trancher la possible personnification indiquée par la suite du verset.
- source_word: בָּא
  choice: arrive
  rationale: Exprime naturellement en français la venue annoncée avec la force présente ou imminente du parfait prophétique.
- source_word: שְׂכָרוֹ
  choice: sa récompense
  rationale: Rend le sens de salaire ou récompense dans un registre prophétique digne.
- source_word: וּפְעֻלָּתוֹ
  choice: et sa rétribution
  rationale: Dans ce contexte, le terme désigne le produit ou paiement dû de l’œuvre; « rétribution » maintient le parallèle sans répéter « récompense ».
- source_word: לְפָנָיו
  choice: le précède
  rationale: Rend idiomatiquement l’image spatiale de ce qui se trouve devant lui, tout en conservant son mouvement.
- source_word: הִנֵּה
  choice: Voici
  rationale: La répétition de « Voici » restitue les trois appels emphatiques à l’attention dans un registre prophétique naturel.
theological_decisions:
- issue: Faut-il rendre יִשְׁעֵךְ de manière abstraite (« ton salut ») ou personnelle (« ton sauveur ») ?
  choice: ton salut
  alternative: ton sauveur
  rationale: Le texte hébreu porte littéralement le nom « ton salut », mais les suffixes masculins qui suivent peuvent personnifier ce salut dans celui qui vient. Le texte principal conserve la forme lexicale, tandis que la note maintient ouverte la lecture personnelle.
translation_notes:
  register: Français international moderne, poétique et digne. La disposition en lignes met en valeur le parallélisme prophétique. « La fille de Sion » conserve l’image traditionnelle tout en restant compréhensible; la triple répétition de « Voici » reproduit l’insistance de l’hébreu.
