  text: כִּֽי יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּ/ךְ בָּנָ֑יִ/ךְ וּ/מְשׂ֤וֹשׂ חָתָן֙ עַל כַּלָּ֔ה יָשִׂ֥ישׂ עָלַ֖יִ/ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
translation:
  language: fr
  text: Car, comme un jeune homme épouse une vierge[a], ainsi tes fils t’épouseront ; et comme l’époux se réjouit de son épouse, ainsi ton Dieu se réjouira de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture, reflétée par certaines versions anciennes et retenue par de nombreux interprètes : « ainsi ton bâtisseur t’épousera » ou « ainsi tes bâtisseurs t’épouseront ». Le texte hébreu massorétique porte « tes fils ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל / יִבְעָלוּךְ
  choice: épouse / t’épouseront
  rationale: Dans cette comparaison nuptiale, le verbe בעל exprime l’entrée dans le mariage. « Épouser » rend naturellement le sens tout en maintenant la répétition du verbe hébreu.
- source_word: בָּחוּר
  choice: jeune homme
  rationale: Le terme désigne ici un homme jeune en âge de se marier, sans connotation militaire nécessaire.
- source_word: בְּתוּלָה
  choice: vierge
  rationale: Ce choix conserve la précision lexicale du nom hébreu dans le cadre de la comparaison matrimoniale.
- source_word: בָּנָיִךְ
  choice: tes fils
  rationale: Le texte massorétique vocalisé porte « tes fils ». Cette lecture reçue est conservée malgré l’image inhabituelle ; l’autre lecture ancienne et interprétative est signalée en note.
- source_word: מְשׂוֹשׂ חָתָן עַל כַּלָּה
  choice: comme l’époux se réjouit de son épouse
  rationale: La tournure nominale hébraïque est rendue par une proposition verbale naturelle en français. « Époux » et « épouse » conviennent au registre poétique et évitent l’ambiguïté possible de « mariée ».
- source_word: יָשִׂישׂ עָלַיִךְ
  choice: se réjouira de toi
  rationale: Le verbe exprime une joie vive ; « se réjouira » restitue clairement le parallèle avec la joie de l’époux.
- source_word: אֱלֹהָיִךְ
  choice: ton Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne au singulier le Dieu d’Israël, et le suffixe féminin renvoie à Sion personnifiée.
- source_word: כִּי
  choice: Car, comme… ainsi…
  rationale: כִּי introduit ici une explication formulée au moyen de deux comparaisons parallèles.
theological_decisions:
- issue: Faut-il traduire בָּנָיִךְ par « tes fils » ou adopter la lecture « ton bâtisseur / tes bâtisseurs » ?
  choice: tes fils
  alternative: ton bâtisseur / tes bâtisseurs
  rationale: La vocalisation massorétique donne « tes fils ». Bien que la métaphore de Sion épousée par ses fils soit difficile, elle demeure intelligible dans la personnification prophétique de la ville et de ses habitants. La variante, attestée indirectement par certaines versions anciennes et retenue par de nombreux interprètes, est assez importante pour être indiquée en note sans remplacer le texte reçu.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « comme… ainsi… » reproduit la structure du verset. Le tutoiement féminin vise Sion/Jérusalem personnifiée.
