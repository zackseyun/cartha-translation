  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
translation:
  language: fr
  text: Sur tes murailles, Jérusalem, j’ai placé des guetteurs ; tout le jour et toute la nuit, sans cesse, ils ne se tairont pas. Vous qui invoquez Yahweh[a], ne vous accordez aucun répit,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous qui faites mention de Yahweh » ou, plus littéralement, « vous qui rappelez Yahweh à son souvenir ». L’expression hébraïque, particulièrement frappante, évoque un appel persistant adressé à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  choice: tes murailles
  rationale: חוֹמָה désigne la muraille fortifiée d’une ville. « Murailles » convient naturellement à Jérusalem et conserve l’image défensive.
- source_word: הִפְקַדְתִּי
  choice: j’ai placé
  rationale: Le hifil de פקד exprime ici l’action d’affecter ou de poster quelqu’un à une fonction. « J’ai placé » est naturel avec des guetteurs sur des murailles sans préciser davantage leur identité.
- source_word: שֹׁמְרִים
  choice: des guetteurs
  rationale: Le participe de שמר désigne ceux qui montent la garde. « Guetteurs » préserve l’image de personnes postées sur les murailles.
- source_word: כָּל הַיּוֹם וְכָל הַלַּיְלָה תָּמִיד
  choice: tout le jour et toute la nuit, sans cesse
  rationale: Cette formulation rend les trois éléments hébreux et leur insistance sur une vigilance ininterrompue.
- source_word: לֹא יֶחֱשׁוּ
  choice: ils ne se tairont pas
  rationale: חשה signifie rester silencieux ou tranquille. La négation avec l’inaccompli exprime ici une absence continue de silence.
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  choice: vous qui rappelez à Yahweh
  rationale: Le participe hifil de זכר évoque littéralement le fait de faire se souvenir ou de rappeler. Cette traduction garde l’image hébraïque frappante de l’appel persistant adressé à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver sa valeur de nom propre dans le texte source.
- source_word: אַל דֳּמִי לָכֶם
  choice: ne vous accordez aucun répit
  rationale: דֳּמִי peut désigner le silence, le calme ou le repos. Avec la négation et לָכֶם, l’expression exhorte les personnes interpellées à ne pas interrompre leur appel.
theological_decisions:
- issue: Identité des « guetteurs » et de ceux qui « rappellent à Yahweh »
  choice: Conserver l’image sans identifier ces figures.
  alternative: Les comprendre comme des gardiens angéliques, des prophètes ou des intercesseurs humains.
  rationale: L’hébreu ne précise pas explicitement leur identité. La traduction maintient donc l’ambiguïté et l’appel à une supplication persistante.
translation_notes:
  register: Français international moderne, digne et accessible. « Murailles » et « guetteurs » entretiennent l’image urbaine sans archaïsme excessif. La répétition temporelle et l’absence de silence restent nettement marquées. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
