  rationale: La révision remplace une construction française incomplète par « invoquez Yahweh », lecture contextuellement naturelle de l’expression. La note conserve à la fois la possibilité de « faire mention de Yahweh » et l’image plus littérale de la mise en remembrance, sans imposer une interprétation de l’identité des guetteurs ni du mécanisme de leur intercession. La virgule finale est maintenue, car la phrase se poursuit au verset 7.
