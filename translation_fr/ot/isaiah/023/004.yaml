source:
  edition: WLC
  text: בּ֣וֹשִׁי צִיד֔וֹן כִּֽי אָמַ֣ר יָ֔ם מָע֥וֹז הַ/יָּ֖ם לֵ/אמֹ֑ר לֹֽא חַ֣לְתִּי וְ/לֹֽא יָלַ֗דְתִּי וְ/לֹ֥א גִדַּ֛לְתִּי בַּחוּרִ֖ים רוֹמַ֥מְתִּי בְתוּלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
translation:
  language: fr
  text: 'Aie honte, Sidon, car la mer a parlé — la forteresse de la mer[a] — en disant : « Je n’ai pas connu les douleurs de l’accouchement[b], je n’ai pas enfanté ; je n’ai pas élevé de jeunes hommes ni fait grandir de jeunes filles vierges[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le refuge fortifié de la mer ». L’expression peut décrire la mer personnifiée dans sa puissance ou faire allusion à Tyr comme place forte maritime.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Je n’ai pas été en travail » ou « Je ne me suis pas tordue de douleur ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « jeunes femmes ». Le terme hébreu désigne couramment des jeunes filles considérées comme vierges.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  choice: Aie honte
  rationale: L’impératif féminin singulier s’adresse à Sidon, personnifiée comme une femme. Cette formulation conserve à la fois la force de l’ordre et le motif de la honte.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Forme française traditionnelle et courante du nom de la ville phénicienne.
- source_word: יָם
  choice: la mer
  rationale: Le nom est pris dans son sens ordinaire et la mer est personnifiée comme prenant la parole.
- source_word: מָעוֹז הַיָּם
  choice: la forteresse de la mer
  rationale: מָעוֹז désigne un refuge fortifié ou une forteresse. La formulation maintient l’image maritime et l’apposition ambiguë du texte hébreu sans identifier explicitement la forteresse à Tyr.
- source_word: לֹא חַ֣לְתִּי
  choice: Je n’ai pas connu les douleurs de l’accouchement
  rationale: Le verbe évoque ici les douleurs et les contorsions de l’enfantement. La formulation française est actuelle et s’intègre à la séquence de la maternité.
- source_word: יָלַדְתִּי
  choice: je n’ai pas enfanté
  rationale: « Enfanter » rend directement le verbe de la naissance et convient au registre prophétique.
- source_word: גִדַּלְתִּי
  choice: je n’ai pas élevé
  rationale: Dans le contexte des enfants devenant adultes, le verbe signifie les élever ou les faire grandir.
- source_word: בַּחוּרִים
  choice: de jeunes hommes
  rationale: Le terme désigne des hommes jeunes plutôt que spécifiquement des fils; le choix conserve le contraste avec les jeunes filles du membre parallèle.
- source_word: רוֹמַמְתִּי
  choice: fait grandir
  rationale: Le verbe signifie littéralement élever ou exalter. Dans ce parallélisme familial, « faire grandir » exprime naturellement l’éducation jusqu’à la maturité tout en restant distinct de « élever ».
- source_word: בְתוּלוֹת
  choice: de jeunes filles vierges
  rationale: Le terme désigne couramment des jeunes femmes non mariées et met explicitement en avant leur virginité; cette traduction conserve cette précision.
theological_decisions:
- issue: Identité de « la forteresse de la mer »
  choice: Conserver l’expression en apposition à « la mer » sans identifier son référent.
  alternative: Traduire ou expliquer directement comme une désignation de Tyr.
  rationale: La syntaxe et l’image permettent une personnification de la mer dans sa puissance, mais peuvent aussi faire allusion à Tyr comme place forte maritime. Le texte principal ne tranche pas cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief l’apposition « la forteresse de la mer » sans résoudre son rattachement. Le discours direct conserve l’enchaînement des images de l’accouchement et de l’éducation des jeunes.
