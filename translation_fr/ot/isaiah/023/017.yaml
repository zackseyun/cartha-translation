  - severity: low
    issue: La note c décrit les mots hébreux comme « apparentés ».
    rationale: אָרֶץ et אֲדָמָה sont ici deux termes distincts pour lesquels la traduction maintient une différence; les appeler « apparentés » n’est ni nécessaire ni une caractérisation lexicale sûre.
