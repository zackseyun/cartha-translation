  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֞ה מִ/קֵּ֣ץ שִׁבְעִ֣ים שָׁנָ֗ה יִפְקֹ֤ד יְהוָה֙ אֶת צֹ֔ר וְ/שָׁבָ֖ה לְ/אֶתְנַנָּ֑/ה וְ/זָֽנְתָ֛ה אֶת כָּל מַמְלְכ֥וֹת הָ/אָ֖רֶץ עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
translation:
  language: fr
  text: Au terme de soixante-dix ans, Yahweh interviendra à l’égard de Tyr[a]. Elle retournera à son salaire[b] et se prostituera avec tous les royaumes de la terre, sur toute la surface du sol[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « visitera Tyr ». Le verbe hébreu peut désigner une intervention favorable, punitive ou restauratrice, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « salaire » désigne la rémunération d’une prostituée. L’image présente les échanges commerciaux de Tyr avec les nations comme de la prostitution.
    reason: cultural_note
  - marker: c
    text: L’hébreu emploie ici deux termes distincts, rendus respectivement par « terre » et « sol ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Au bout de
  rationale: La construction prophétique introduit ici une circonstance future; en français, la suite verbale au futur rend naturellement cette valeur sans calquer «et il arrivera».
- source_word: מִקֵּץ שִׁבְעִים שָׁנָה
  choice: au bout de soixante-dix ans
  rationale: Cette expression marque l’achèvement de la période fixée.
- source_word: יִפְקֹד
  choice: interviendra en faveur de
  rationale: פקד désigne une intervention attentive de Yahweh. Le contexte immédiat aboutit à la reprise de l’activité de Tyr; «en faveur de» rend cette orientation contextuelle sans préciser davantage la nature de l’intervention. La note conserve l’alternative plus formelle et l’amplitude du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin dans cette traduction, plutôt que substitution par un titre.
- source_word: צֹר
  choice: Tyr
  rationale: Forme française conventionnelle du nom de la ville.
- source_word: וְשָׁבָה
  choice: Elle retournera
  rationale: Le féminin singulier maintient la personnification de la ville comme femme.
- source_word: לְאֶתְנַנָּה
  choice: au salaire de sa prostitution
  rationale: אֶתְנַן désigne spécifiquement la rémunération d’une prostituée; l’explicitation est idiomatique en français et maintient le lien avec le verbe suivant.
- source_word: וְזָנְתָה
  choice: se prostituera
  rationale: Rendu direct et contemporain de la métaphore commerciale et sexuelle appliquée à Tyr.
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  choice: avec tous les royaumes de la terre
  rationale: Avec זנה, le complément désigne les partenaires de Tyr; la portée de «tous les royaumes» justifie «terre» plutôt que «pays».
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sur toute la surface du sol
  rationale: Cette formulation rend l’idiome hébreu et distingue אֲדָמָה de אָרֶץ employé juste avant, tout en restant intelligible en français.
theological_decisions:
- issue: Valeur de l’intervention divine exprimée par יִפְקֹד
  choice: Yahweh interviendra en faveur de Tyr
  alternative: Yahweh visitera Tyr / s’occupera de Tyr / demandera des comptes à Tyr
  rationale: Le verbe peut évoquer diverses formes d’intervention divine. La reprise des activités de Tyr favorise ici une orientation bénéfique, mais la note signale que l’hébreu reste plus ouvert et évite d’identifier précisément cette intervention à une restauration morale ou à une approbation.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin conserve la personnification de Tyr. La métaphore de la prostitution est maintenue sans euphémisme. Les marqueurs suivent immédiatement les expressions qu’ils expliquent.
