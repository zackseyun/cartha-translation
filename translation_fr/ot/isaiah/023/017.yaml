revisions:
- from: Au bout de soixante-dix ans, Yahweh interviendra en faveur de Tyr[a]. Elle retournera au salaire de sa prostitution[b] et se prostituera avec tous les royaumes de la terre, sur toute la surface du sol[c].
  to: Au terme de soixante-dix ans, Yahweh interviendra à l’égard de Tyr[a]. Elle retournera à son salaire[b] et se prostituera avec tous les royaumes de la terre, sur toute la surface du sol[c].
  rationale: La révision rétablit la neutralité de יִפְקֹד sans altérer la suite du verset ni imposer une interprétation théologique de l’intervention divine. Elle simplifie aussi « salaire de sa prostitution », déjà explicité par le verbe suivant et par la note, et corrige la formulation lexicale de la note c.
  reviewer_model: gpt-5.6-terra
