source:
  edition: WLC
  text: דֹּ֖מּוּ יֹ֣שְׁבֵי אִ֑י סֹחֵ֥ר צִיד֛וֹן עֹבֵ֥ר יָ֖ם מִלְאֽוּ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/002.yaml
  text: Be silent[a], inhabitants of the coastland; the merchant of Sidon, crossing the sea[b], has filled you.
translation:
  language: fr
  text: Gardez le silence, habitants de la côte[a] ! Les marchands de Sidon, qui traversent la mer, t’ont remplie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner une île ou une région côtière.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils t’ont remplie ». Le sens peut être celui de biens apportés par les marchands (« t’ont approvisionnée ») ou, plus largement, de revenus qu’ils procuraient. Le féminin singulier peut renvoyer à la côte, à l’île ou à une ville personnifiée à laquelle le prophète s’adresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹּמּוּ
  choice: Gardez le silence
  rationale: L’impératif qal pluriel exprime ici un silence imposé par le choc du jugement. Cette formulation conserve la force de l’ordre sans préciser qu’il s’agit nécessairement d’un deuil silencieux.
- source_word: יֹשְׁבֵי אִי
  choice: habitants de la côte
  rationale: Le participe substantivé désigne les habitants, tandis que אִי peut évoquer aussi bien une île qu’une région côtière. « La côte » convient au cadre maritime et reste naturel en français.
- source_word: סֹחֵר צִידוֹן
  choice: les marchands de Sidon
  rationale: סֹחֵר est morphologiquement singulier, mais peut avoir un sens collectif; le verbe מִלְאוּךְ est pluriel. Le pluriel français rend naturellement cet accord selon le sens.
- source_word: עֹבֵר יָם
  choice: qui traversent la mer
  rationale: Le participe singulier prolonge le sujet collectif et décrit l’activité maritime habituelle des marchands. Le pluriel français suit le collectif explicité dans la proposition principale.
- source_word: מִלְאוּךְ
  choice: t’ont comblée
  rationale: La forme verbale signifie littéralement « ils t’ont remplie/comblée » et porte un suffixe féminin singulier. « Comblée » conserve l’image tout en pouvant suggérer l’abondance commerciale; le féminin renvoie à la côte personnifiée.
theological_decisions:
- issue: Passage du pluriel « habitants » au féminin singulier « te »
  choice: Conserver le changement d’adresse par « t’ont comblée »
  alternative: 'Harmoniser au pluriel : « vous ont comblés »'
  rationale: L’hébreu passe d’un impératif pluriel adressé aux habitants à un suffixe féminin singulier, vraisemblablement adressé à la côte, à l’île ou à la ville personnifiée. La traduction préserve cette tension grammaticale et rhétorique.
translation_notes:
  register: Français moderne, soutenu mais accessible. L’impératif garde sa solennité prophétique. Le changement volontaire du pluriel au féminin singulier reproduit le mouvement de l’hébreu; la note explicite cette personnification sans l’effacer.
