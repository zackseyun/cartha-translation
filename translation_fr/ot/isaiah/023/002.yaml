  source_fidelity: Le pluriel français « les marchands » rend de façon idiomatique le sujet collectif impliqué par le verbe hébreu au pluriel, tout en conservant le singulier morphologique de סֹחֵר comme collectif. Le passage de l’adresse plurielle (« habitants ») au suffixe féminin singulier est à préserver. En revanche, « t’ont comblée » interprète l’image de « remplir » comme un bienfait abondant et atténue le verbe concret מִלְאוּךְ.
  naturalness: La formulation est naturelle et convient à un registre prophétique moderne. « T’ont remplie » est légèrement plus heurté que « t’ont comblée », mais cette tension est préférable ici, car elle reproduit l’image commerciale concrète et le changement d’adresse du texte hébreu.
  terminology: « Côte » est un choix recevable pour אִי, avec note signalant « île » et « région côtière ». « Sidon » est la forme française usuelle. « Marchands » et « traversent la mer » rendent clairement le lexique maritime et commercial.
