  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/נִשְׁכַּ֤חַת צֹר֙ שִׁבְעִ֣ים שָׁנָ֔ה כִּ/ימֵ֖י מֶ֣לֶךְ אֶחָ֑ד מִ/קֵּ֞ץ שִׁבְעִ֤ים שָׁנָה֙ יִהְיֶ֣ה לְ/צֹ֔ר כְּ/שִׁירַ֖ת הַ/זּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
translation:
  language: fr
  text: 'Ce jour-là, Tyr sera oubliée pendant soixante-dix ans — comme les jours d’un seul roi[a]. Au terme de soixante-dix ans, il en sera de Tyr comme dans le chant de la prostituée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme les jours d’un seul roi ». On peut aussi comprendre : « pendant la durée de vie d’un roi ».'
    reason: L’expression hébraïque conserve une comparaison dont la portée exacte n’est pas explicitée.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: La tournure française exprime naturellement la circonstance future annoncée par la formule prophétique, sans reproduire lourdement le verbe introductif.
- source_word: וְנִשְׁכַּחַת
  choice: sera oubliée
  rationale: 'Le niphal de שׁכח a ici un sens passif : Tyr disparaîtra de la mémoire et de l’attention.'
- source_word: צֹר
  choice: Tyr
  rationale: Forme française traditionnelle et actuelle du nom de la ville.
- source_word: שִׁבְעִים שָׁנָה
  choice: pendant soixante-dix ans
  rationale: « Pendant » rend explicitement et naturellement la durée en français.
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  choice: autant que les jours d’un seul roi
  rationale: Cette formulation conserve la comparaison et l’expression concrète « les jours », sans imposer l’interprétation plus précise « la durée de vie » ou « le règne ».
- source_word: מִקֵּץ
  choice: Au terme de
  rationale: Rend précisément le point d’aboutissement de la période annoncée dans un registre soutenu mais courant.
- source_word: יִהְיֶה לְצֹר
  choice: il en sera de Tyr
  rationale: Expression française idiomatique qui restitue היה ל sans préciser au-delà du texte la nature de ce qui arrivera à Tyr.
- source_word: כְּשִׁירַת הַזּוֹנָה
  choice: comme dans le chant de la prostituée
  rationale: « Comme dans » introduit naturellement le chant cité au verset suivant, tandis que « prostituée » traduit directement זונה dans un français moderne.
theological_decisions:
- issue: Portrait métaphorique de Tyr sous les traits d’une prostituée
  choice: Conserver directement « la prostituée »
  alternative: la femme débauchée
  rationale: L’image sexuelle et commerciale appartient à la force rhétorique de l’oracle et prépare le chant du verset suivant. La neutraliser obscurcirait la métaphore.
- issue: Rapport entre les soixante-dix ans et les jours d’un roi
  choice: Maintenir une comparaison littérale sans l’identifier explicitement à un règne ou à une vie
  alternative: pendant la durée de vie d’un roi
  rationale: L’hébreu dit littéralement « comme les jours d’un seul roi » et laisse ouverte la portée exacte de cette comparaison.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe prophétique est rendue avec fluidité, tout en conservant l’image forte de la prostituée et l’ambiguïté de la comparaison avec les jours d’un roi.
