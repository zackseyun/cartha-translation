id: ISA.23.16
reference: Isaiah 23:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קְחִ֥י כִנּ֛וֹר סֹ֥בִּי עִ֖יר זוֹנָ֣ה נִשְׁכָּחָ֑ה הֵיטִ֤יבִי נַגֵּן֙ הַרְבִּי שִׁ֔יר לְמַ֖עַן תִּזָּכֵֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
translation:
  language: fr
  text: Prends une lyre[a], parcours la ville, prostituée oubliée ! Joue avec talent, multiplie tes chants, afin que l’on se souvienne de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « harpe ». Le terme hébreu désigne un ancien instrument à cordes (kinnor).
    reason: Alternative lexicale et précision historique sur l’instrument.
lexical_decisions:
- source_word: קְחִי
  choice: Prends
  rationale: Impératif féminin singulier de לקח. « Prends » rend directement et naturellement l’ordre de saisir l’instrument.
- source_word: כִנּוֹר
  choice: une lyre
  rationale: כִּנּוֹר désigne un ancien instrument à cordes. « Lyre » est généralement plus précis que le traditionnel « harpe ».
- source_word: סֹבִּי עִיר
  choice: parcours la ville
  rationale: Le verbe סבב exprime ici le fait de circuler dans ou autour de la ville. « Parcours la ville » est idiomatique sans imposer un trajet circulaire précis.
- source_word: זוֹנָה נִשְׁכָּחָה
  choice: prostituée oubliée
  rationale: Le syntagme conserve sans l’atténuer la personnification explicite de Tyr, dans un français moderne et non archaïque.
- source_word: הֵיטִיבִי נַגֵּן
  choice: Joue avec talent
  rationale: הֵיטִיבִי qualifie l’action de jouer de l’instrument. « Avec talent » exprime une exécution habile et reste naturel en français.
- source_word: הַרְבִּי שִׁיר
  choice: multiplie tes chants
  rationale: Littéralement, l’expression commande de multiplier le chant. Le pluriel français rend naturellement la valeur collective de שִׁיר, tandis que « tes » explicite le lien avec l’interprète sans modifier le sens.
- source_word: לְמַעַן תִּזָּכֵרִי
  choice: afin que l’on se souvienne de toi
  rationale: לְמַעַן marque le but et le niphal de זכר a ici une valeur passive. La tournure impersonnelle française restitue naturellement « afin que tu sois rappelée au souvenir ».
theological_decisions:
- issue: Désignation métaphorique de Tyr comme prostituée
  choice: Conserver dans le texte la métaphore explicite « prostituée oubliée »
  alternative: « courtisane oubliée » ou « femme prostituée oubliée »
  rationale: Le passage personnifie Tyr sous les traits d’une prostituée qui cherche à attirer de nouveau l’attention. « Prostituée » préserve la force prophétique du texte sans archaïsme ni interprétation doctrinale ajoutée.
- issue: Sujet implicite de l’acte de se souvenir
  choice: Employer l’impersonnel « l’on »
  alternative: « afin que tu sois de nouveau présente au souvenir »
  rationale: Le texte hébreu ne précise pas qui se souviendra d’elle. La formulation impersonnelle conserve cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs féminins et l’apostrophe rendent la personnification de Tyr. La ponctuation marque l’interpellation sans ajouter d’explication au verset.
