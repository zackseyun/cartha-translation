  text: When the report comes to Egypt[a], they will writhe at the report of Tyre.
translation:
  language: fr
  text: Quand la nouvelle parviendra en Égypte, ils se tordront de douleur à la nouvelle de Tyr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quand
  rationale: La conjonction introduit ici le moment où la nouvelle atteint l’Égypte; « quand » rend naturellement cette valeur temporelle.
- source_word: שֵׁמַע לְמִצְרָיִם
  choice: la nouvelle parviendra en Égypte
  rationale: שֵׁמַע désigne une nouvelle ou un rapport, et לְמִצְרָיִם indique vraisemblablement sa destination. Le verbe « parviendra », fourni par le contexte elliptique, donne une formulation française naturelle.
- source_word: יָחִילוּ
  choice: on se tordra de douleur
  rationale: Le verbe חול évoque une violente détresse pouvant se manifester par des contorsions, des tremblements ou des douleurs comparables à celles de l’accouchement. Cette expression conserve la force corporelle de l’image.
- source_word: כְּשֵׁמַע
  choice: à la nouvelle
  rationale: La préposition כ marque ici l’occasion ou la cause déclenchante de la détresse. La répétition de « nouvelle » préserve celle de שֵׁמַע dans l’hébreu.
- source_word: צֹר
  choice: Tyr
  rationale: Forme française traditionnelle et standard du nom de la ville phénicienne.
