id: ISA.23.12
reference: Isaiah 23:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא תוֹסִ֥יפִי ע֖וֹד לַ/עְל֑וֹז הַֽ/מְעֻשָּׁקָ֞ה בְּתוּלַ֣ת בַּת צִיד֗וֹן כתיים ק֣וּמִי עֲבֹ֔רִי גַּם שָׁ֖ם לֹא יָנ֥וּחַֽ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
translation:
  language: fr
  text: 'Il a dit : « Tu ne te réjouiras plus[b], vierge opprimée, fille de Sidon. Lève-toi, passe à Kittim[a] ! Même là, tu ne trouveras pas de repos. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim désigne probablement Chypre et peut, par extension, évoquer les territoires maritimes de l’ouest.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Tu n’exulteras plus. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il a dit
  rationale: Le wayyiqtol de אמר introduit la parole dans le récit. Le passé composé est naturel en français moderne tout en conservant la valeur narrative.
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלֹז
  choice: Tu ne te réjouiras plus
  rationale: La négation de יסף accompagnée de עוֹד exprime la cessation, rendue naturellement par « ne… plus ». עלז désigne une joie vive; « se réjouir » reste clair et digne, tandis que l’intensité possible est signalée en note.
- source_word: הַמְעֻשָּׁקָה
  choice: opprimée
  rationale: Le participe passif de עשׁק décrit celle qui subit l’oppression; « opprimée » en est l’équivalent direct.
- source_word: בְּתוּלַת בַּת צִידוֹן
  choice: vierge opprimée, fille de Sidon
  rationale: Cette formulation conserve la personnification prophétique et le lien avec Sidon sans remplacer l’image par une explication.
- source_word: כתיים / כִּתִּים
  choice: Kittim
  rationale: Le nom propre est translittéré afin de ne pas réduire à tort sa portée à une seule identification géographique; une note fournit le contexte probable.
- source_word: קוּמִי עֲבֹרִי
  choice: Lève-toi, passe
  rationale: Les deux impératifs féminins singuliers sont conservés avec leur urgence et s’adressent à Sidon personnifiée.
- source_word: גַּם שָׁם
  choice: Même là
  rationale: 'Cette expression rend l’insistance: le lieu de fuite lui-même ne procurera aucun soulagement.'
- source_word: לֹא יָנוּחַ לָךְ
  choice: tu ne trouveras pas de repos
  rationale: La tournure hébraïque signifie idiomatiquement qu’aucun repos ne sera disponible pour la destinataire; cette formulation est naturelle en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La personnification prophétique de Sidon est maintenue, ainsi que le nom géographique traditionnel « Kittim ». Les marqueurs ont été placés auprès des éléments auxquels leurs notes se rapportent.
