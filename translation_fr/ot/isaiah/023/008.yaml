source:
  edition: WLC
  text: מִ֚י יָעַ֣ץ זֹ֔את עַל צֹ֖ר הַ/מַּֽעֲטִירָ֑ה אֲשֶׁ֤ר סֹחֲרֶ֨י/ה֙ שָׂרִ֔ים כִּנְעָנֶ֖י/הָ נִכְבַּדֵּי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
translation:
  language: fr
  text: Qui a décidé cela contre Tyr, celle qui confère des couronnes[a], dont les marchands sont des princes et les négociants[b] des notables de la terre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque présente Tyr comme celle qui confère des couronnes, peut-être en établissant ou en enrichissant des souverains.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses Cananéens ». Dans ce contexte commercial, le terme désigne probablement ses négociants.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יָעַץ זֹאת
  choice: Qui a décidé cela
  rationale: La question rhétorique est conservée. Dans ce contexte, יָעַץ exprime un dessein arrêté; « a décidé » est naturel en français moderne tout en gardant l’idée d’une action intentionnelle.
- source_word: עַל צֹר
  choice: contre Tyr
  rationale: Dans le contexte du jugement annoncé, עַל a une valeur hostile; « contre » convient mieux que « au sujet de ».
- source_word: הַמַּעֲטִירָה
  choice: elle qui décerne des couronnes
  rationale: Le participe féminin dérivé de עטר présente Tyr comme celle qui confère des couronnes. Cette formulation conserve la métaphore et évite de suggérer simplement que Tyr serait elle-même couronnée.
- source_word: סֹחֲרֶיהָ שָׂרִים
  choice: dont les marchands sont des princes
  rationale: « Marchands » rend le commerce de Tyr, et « princes » préserve le rang social élevé exprimé par שָׂרִים.
- source_word: כִּנְעָנֶיהָ
  choice: les négociants
  rationale: Le mot signifie formellement « Cananéens », mais peut désigner des commerçants par métonymie. « Négociants » rend ici le parallélisme commercial tout en évitant la répétition de « marchands »; le sens littéral est signalé en note.
- source_word: נִכְבַּדֵּי אָרֶץ
  choice: des gens honorés sur toute la terre
  rationale: נִכְבַּדֵּי désigne des personnes considérées, honorées. Dans le portrait de l’influence internationale de Tyr, אָרֶץ a une portée mondiale; « sur toute la terre » l’explicite naturellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La structure interrogative et les deux propositions relatives de l’hébreu sont maintenues sans lourdeur excessive; la métaphore des couronnes et l’ambiguïté de « Cananéens » sont préservées dans le texte et la note.
