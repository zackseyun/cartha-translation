id: ISA.23.9
reference: Isaiah 23:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֖וֹת יְעָצָ֑/הּ לְ/חַלֵּל֙ גְּא֣וֹן כָּל צְבִ֔י לְ/הָקֵ֖ל כָּל נִכְבַּדֵּי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
translation:
  language: fr
  text: 'Yahweh, le Seigneur des armées, l’a décidé[a] : profaner l’orgueil de toute splendeur[b], rabaisser tous ceux qui sont honorés sur la terre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a formé ce projet contre elle », « elle » désignant alors Tyr.'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu peut aussi être rendu par « beauté » ou « éclat ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « couvrir de mépris » tous ceux qui sont honorés sur la terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est conservé sous la forme « Yahweh ». « Des armées » rend צְבָאוֹת de manière claire et actuelle, sans limiter ces armées aux seules forces humaines.
- source_word: יְעָצָהּ
  choice: l’a décidé
  rationale: 'Le verbe exprime ici un dessein arrêté. L’élision française dans « l’a » laisse ouverte la référence du suffixe féminin : le jugement annoncé ou Tyr elle-même.'
- source_word: לְחַלֵּל
  choice: profaner
  rationale: Le piel de חלל signifie profaner, déshonorer ou rendre commun. « Profaner » conserve la force du terme sans réduire le passage à un contexte exclusivement cultuel.
- source_word: גְּאוֹן כָּל צְבִי
  choice: l’orgueil de toute splendeur
  rationale: גְּאוֹן évoque l’orgueil ou l’élévation, tandis que צְבִי désigne la beauté, l’éclat ou la splendeur. Cette formulation compacte maintient l’ambiguïté poétique de l’hébreu.
- source_word: לְהָקֵל
  choice: rabaisser
  rationale: Le hiphil de קלל peut signifier rendre léger, mépriser, avilir ou abaisser. « Rabaisser » exprime à la fois la perte de rang et le déshonneur.
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  choice: tous ceux qui sont honorés sur la terre
  rationale: Le participe substantivé désigne largement les personnes tenues en honneur ou considérées comme importantes. La périphrase évite de restreindre le sens aux seuls nobles ou dirigeants.
theological_decisions:
- issue: Référence du suffixe féminin dans יְעָצָהּ
  choice: « l’a décidé », le pronom pouvant renvoyer au jugement ou au dessein annoncé
  alternative: « a formé ce projet contre elle », avec Tyr comme référent explicite
  rationale: La forme française élidée préserve discrètement l’ambiguïté grammaticale de l’hébreu au lieu d’imposer un référent unique.
- issue: Portée de אֶרֶץ
  choice: « sur la terre »
  alternative: « du pays »
  rationale: Le contexte peut viser les personnages éminents liés au commerce de Tyr, mais la formulation hébraïque permet une portée plus vaste. « La terre » conserve cette ampleur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme des deux infinitifs est conservé, ainsi que la densité poétique du texte hébreu.
