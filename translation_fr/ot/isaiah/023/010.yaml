  text: עִבְרִ֥י אַרְצֵ֖/ךְ כַּ/יְאֹ֑ר בַּת תַּרְשִׁ֕ישׁ אֵ֖ין מֵ֥זַח עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/010.yaml
  text: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
translation:
  language: fr
  text: 'Traverse ton pays comme le Nil[a], fille de Tarsis : il n’y a plus d’entrave[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Parcours ton pays comme le Nil » ou « Répands-toi dans ton pays comme le Nil ». Le verbe hébreu signifie passer ou traverser, tandis que la comparaison avec le Nil peut suggérer son débordement.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu, rare, peut aussi être compris au sens de « barrière », « port » ou « amarre ». L’idée générale est que Tarsis n’est désormais plus retenue.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי
  choice: Parcours
  rationale: L’impératif féminin singulier de עבר signifie fondamentalement « passer, traverser ». « Parcours » conserve cette action tout en permettant à la comparaison avec le Nil d’en préciser la manière, sans intégrer d’emblée l’idée de débordement dans le verbe.
- source_word: אַרְצֵךְ
  choice: ton pays
  rationale: Le nom אֶרֶץ avec suffixe féminin singulier désigne ici le territoire de Tarsis. « Ton pays » est naturel dans cette apostrophe à une cité personnifiée.
- source_word: כַיְאֹר
  choice: comme le Nil
  rationale: יְאֹר désigne couramment le Nil ou l’un de ses bras. La référence précise au Nil préserve l’image poétique de ses eaux qui parcourent et inondent le territoire.
- source_word: בַּת תַּרְשִׁישׁ
  choice: fille de Tarsis
  rationale: Cette expression personnifie poétiquement Tarsis, sa population ou sa cité. La traduction littérale conserve cette figure prophétique sans la réduire à une seule interprétation.
- source_word: אֵין
  choice: il n’y a
  rationale: Rendu français idiomatique de la négation existentielle.
- source_word: מֵזַח
  choice: entrave
  rationale: Ce mot rare semble désigner ce qui ceint, retient ou fixe. « Entrave » exprime le sens général possible sans choisir trop précisément entre les interprétations concrètes proposées, telles que barrière, port ou amarre.
- source_word: עוֹד
  choice: plus
  rationale: Avec la négation, עוֹד indique que ce qui existait auparavant n’existe désormais plus.
