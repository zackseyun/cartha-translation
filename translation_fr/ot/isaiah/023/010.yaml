  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’apostrophe prophétique adressée à Tarsis personnifiée. « Parcours » préserve la structure hébraïque, dans laquelle la comparaison avec le Nil précise la manière de l’action.
