  rationale: La révision corrige la relative défectueuse en rétablissant « la », qui désigne la cité personnifiée et correspond au suffixe objet hébreu. Elle conserve le temps évocateur du récit, l’ancienneté de la cité et la nuance de résidence temporaire ou étrangère de « séjourner ». La note est resserrée afin de signaler l’ambiguïté de « de/au loin » sans imposer une lecture.
