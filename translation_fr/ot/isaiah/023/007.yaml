  naturalness: « Cité en liesse » et « séjourner » sont naturels dans un registre biblique moderne et soutenu. « Dont les pieds la portaient au loin » est idiomatique et conserve la personnification sans alourdir la phrase.
  terminology: « Origine », « temps anciens » et « séjourner » correspondent adéquatement aux termes hébreux et ne surinterprètent pas le passage. « Porter » rend de façon recevable יבל avec « pieds » comme sujet.
