  text: הֲ/זֹ֥את לָ/כֶ֖ם עַלִּיזָ֑ה מִֽ/ימֵי קֶ֤דֶם קַדְמָתָ/הּ֙ יֹבִל֣וּ/הָ רַגְלֶ֔י/הָ מֵֽ/רָח֖וֹק לָ/גֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/007.yaml
  text: Is this your exultant city[a], whose origin is from days of old, whose feet carried her far away to sojourn?
translation:
  language: fr
  text: Est-ce là votre cité en liesse, dont l’origine remonte aux temps anciens, dont les pieds la portaient au loin pour y séjourner[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont l’ancienneté remonte aux temps anciens ; ses pieds la conduisaient de loin pour séjourner. » L’expression peut évoquer un déplacement vers un lieu lointain ou depuis un lieu lointain.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: הֲזֹאת לָכֶם
  choice: Est-ce là votre
  rationale: La particule interrogative et le démonstratif ouvrent une question rhétorique. La tournure possessive rend naturellement לָכֶם en français dans ce contexte.
- source_word: עַלִּיזָה
  choice: cité en liesse
  rationale: L’adjectif féminin évoque une joie exubérante. « Cité » explicite le référent féminin, Tyr, tandis que « en liesse » garde le ton de célébration fière.
- source_word: מִימֵי קֶדֶם קַדְמָתָהּ
  choice: dont l’origine remonte aux temps anciens
  rationale: L’expression affirme la grande ancienneté de la cité. Cette formulation française naturelle conserve l’idée de commencements reculés sans surdéfinir leur nature.
- source_word: יֹבִלוּהָ רַגְלֶיהָ
  choice: que ses pieds emportaient
  rationale: Le hiphil de יבל signifie mener, conduire ou emporter. La formulation préserve la personnification de la cité et rend l’imparfait hébreu comme une activité caractéristique de son passé.
- source_word: מֵרָחוֹק לָגוּר
  choice: au loin pour y séjourner
  rationale: גור désigne souvent le fait de résider temporairement ou comme étranger. « Séjourner » conserve cette nuance, tandis que « au loin » exprime la distance associée au déplacement.
theological_decisions: []
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. « Cité en liesse » garde la vigueur poétique et la personnification de Tyr ; « séjourner » reste accessible tout en conservant l’idée d’une résidence hors de chez soi.
