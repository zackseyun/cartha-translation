revisions:
- from: 'Son commerce et son salaire seront consacrés à Yahweh[a]. Ils ne seront ni amassés ni mis en réserve, car les profits de son commerce reviendront à ceux qui demeurent devant Yahweh : ils pourront ainsi manger à satiété et se vêtir de manière durable[b].'
  to: Son commerce et son salaire[a] seront consacrés à Yahweh. Ils ne seront ni amassés ni mis en réserve, car son commerce sera destiné à ceux qui demeurent devant Yahweh, afin qu’ils mangent à satiété et aient des vêtements durables[b].
  rationale: La révision conserve la répétition de « son commerce » et rend la relation de destination exprimée par le texte sans en inférer des profits ni un retour. Elle restitue la finale comme des vêtements fournis, tout en maintenant par note l’incertitude lexicale sur l’adjectif. L’appel de note sur « salaire » est également replacé sur son référent.
