  source_fidelity: La première occurrence de סַחְרָהּ est bien rendue par « son commerce », mais la seconde devrait conserver ce sens plutôt que devenir « les profits de son commerce », ce qui restreint le terme et introduit une nuance financière non exprimée. « Sera destiné à » rend naturellement יהיה ... לבלי ajouter l’idée de retour impliquée par « reviendront ». La finale doit désigner une provision de vêtements/couverture durables, non la manière durable de s’habiller.
  naturalness: Le français proposé est globalement moderne et fluide. « Afin qu’ils mangent à satiété et aient des vêtements durables » est plus idiomatique et plus précis que « ils pourront ainsi ... se vêtir de manière durable ».
  terminology: « Consacrés à Yahweh », « salaire », « amassés » et « mis en réserve » conviennent. « Salaire » conserve, avec note, l’écho possible au vocabulaire de la prostitution sans le surtraduire. « Vêtements durables » rend de façon prudente l’expression finale difficile.
