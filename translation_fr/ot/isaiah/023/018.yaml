base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
translation:
  language: fr
  text: Son commerce et son salaire[a] seront consacrés à Yahweh. Ils ne seront ni amassés ni mis en réserve, car son commerce sera destiné à ceux qui demeurent devant Yahweh, afin qu’ils mangent à satiété et aient des vêtements durables[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « salaire » peut aussi désigner la rémunération d’une prostituée, ce qui peut rappeler l’image de Tyr employée au verset précédent.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière expression hébraïque est difficile. Autres traductions possibles : « des vêtements somptueux », « d’amples vêtements » ou « des vêtements de choix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַחְרָהּ
  choice: son commerce / les profits de son commerce
  rationale: Le nom désigne le commerce, les marchandises ou leur produit. « Son commerce » convient à la première occurrence; dans la proposition distributive, « les profits de son commerce » explicite naturellement ce qui sert à la subsistance sans réduire le terme au seul bénéfice financier.
- source_word: אֶתְנַנָּהּ
  choice: son salaire
  rationale: Le mot désigne une rémunération et peut aussi évoquer le salaire d’une prostituée, en continuité avec l’image appliquée à Tyr au verset précédent. « Salaire » garde cette possibilité sans la rendre explicite à tort.
- source_word: קֹדֶשׁ לַיהוָה
  choice: consacrés à Yahweh
  rationale: קדש exprime ici une mise à part sacrée. « Consacrés » est idiomatique en français et conserve la force cultuelle de l’expression.
- source_word: יֵאָצֵר וְלֹא יֵחָסֵן
  choice: ni amassés ni mis en réserve
  rationale: Les deux verbes parallèles parlent de l’accumulation et de la conservation de richesses. Deux expressions distinctes préservent le parallélisme sans lourdeur.
- source_word: לַיֹּשְׁבִים לִפְנֵי יְהוָה
  choice: à ceux qui demeurent devant Yahweh
  rationale: La formulation reste proche de l’hébreu et conserve ouverte l’identité précise de ces personnes ainsi que la portée cultuelle de « devant Yahweh ».
- source_word: לֶאֱכֹל לְשָׂבְעָה
  choice: manger à satiété
  rationale: Expression française naturelle correspondant exactement à l’idée de manger jusqu’au rassasiement.
- source_word: לִמְכַסֶּה עָתִיק
  choice: se vêtir de manière durable
  rationale: מכסה renvoie à ce qui couvre, notamment un vêtement. Le sens de עתיק est difficile; « durable » retient l’idée probable de qualité qui dure, tout en signalant les autres possibilités en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre et préserve sa fonction de nom d’alliance.
- issue: Nature de l’affectation des revenus de Tyr
  choice: consacrés à Yahweh
  alternative: mis à part pour Yahweh; saints pour Yahweh
  rationale: Le substantif קדש indique une consécration sacrée, et non une simple taxation ou redistribution économique. La traduction n’en précise pas davantage les modalités.
- issue: Identité de ceux qui demeurent devant Yahweh
  choice: formulation non explicitée
  alternative: les prêtres; les adorateurs de Yahweh
  rationale: Le texte ne nomme pas précisément ce groupe. La traduction préserve cette ouverture au lieu d’imposer une identification théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée pour être naturelle, tout en maintenant le parallélisme, l’image commerciale et les ambiguïtés réelles du texte hébreu.
