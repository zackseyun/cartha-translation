id: ISA.23.3
reference: Isaiah 23:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/מַ֤יִם רַבִּים֙ זֶ֣רַע שִׁחֹ֔ר קְצִ֥יר יְא֖וֹר תְּבֽוּאָתָ֑/הּ וַ/תְּהִ֖י סְחַ֥ר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/003.yaml
  text: On many waters was the grain of Shihor[a], the harvest of the Nile, her revenue[b]; and she became the merchant of nations.
translation:
  language: fr
  text: Sur les grandes eaux, le grain du Shihor[a], la moisson du Nil, constituait son revenu ; elle devint le marché des nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le Shihor désigne probablement le Nil ou l’un de ses bras. Autre traduction : « le grain du Nil ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le commerce des nations » ; le terme hébreu peut aussi désigner les marchandises ou le trafic commercial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  choice: Sur les grandes eaux
  rationale: Cette formulation conserve l’image maritime et permet d’évoquer les voies commerciales empruntées par les cargaisons, sans réduire la préposition à une simple proximité spatiale.
- source_word: זֶרַע
  choice: le grain
  rationale: Dans ce contexte agricole et commercial, le mot désigne la production céréalière plutôt que la semence destinée aux semailles.
- source_word: שִׁחֹר
  choice: Shihor
  rationale: Le nom géographique hébreu est conservé dans le texte principal; son identification probable avec le Nil ou l’un de ses bras est donnée en note.
- source_word: קְצִיר יְאֹר
  choice: la moisson du Nil
  rationale: Dans le contexte égyptien, יְאֹר désigne le Nil ou l’un de ses canaux. La construction française exprime naturellement le rapport génitival.
- source_word: תְּבוּאָתָהּ
  choice: constituait son revenu
  rationale: Le nom peut désigner un produit, une récolte ou le revenu qu’ils procurent. Ici, le contexte du commerce de Tyr favorise le sens économique, tandis que le suffixe féminin renvoie vraisemblablement à la ville.
- source_word: וַתְּהִי
  choice: elle devint
  rationale: Le féminin singulier reprend naturellement Tyr, ville personnifiée, et « devint » conserve la valeur résultative possible de la forme verbale.
- source_word: סְחַר גּוֹיִם
  choice: le marché des nations
  rationale: סְחַר appartient au champ du commerce, des marchandises et du trafic marchand. « Le marché des nations » exprime le rôle international de Tyr sans la transformer explicitement en personne exerçant le métier de marchand.
theological_decisions: []
