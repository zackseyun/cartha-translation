id: ISA.23.11
reference: Isaiah 23:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
translation:
  language: fr
  text: 'Il a étendu sa main sur la mer[a] ; il a fait trembler les royaumes. Yahweh a donné un ordre au sujet de Canaan[b] : détruire ses places fortes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre la mer ». La préposition hébraïque peut ici exprimer une position au-dessus de la mer ou un mouvement hostile contre elle.
    reason: alternative_reading
  - marker: b
    text: Dans ce contexte consacré à Tyr, « Canaan » désigne vraisemblablement la région phénicienne.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu porte un suffixe féminin singulier, ce qui peut personnifier le pays ou la ville : littéralement, « ses places fortes » en parlant d’elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ
  choice: sa main
  rationale: Conserve l’image anthropomorphique concrète de la main comme expression de l’action et de la puissance, sans la remplacer par l’abstraction « puissance ».
- source_word: נָטָה
  choice: a étendu
  rationale: Rend directement l’idée d’étendre ou de déployer et forme en français une expression naturelle avec « sa main ».
- source_word: עַל הַיָּם
  choice: sur la mer
  rationale: « Sur » conserve la portée spatiale la plus directe de עַל tout en laissant le contexte exprimer le jugement ; la nuance possible « contre » est signalée en note.
- source_word: הִרְגִּיז
  choice: a fait trembler
  rationale: Le hifil exprime ici le fait de provoquer agitation ou tremblement ; cette formulation rend clairement l’effet produit sur les royaumes.
- source_word: מַמְלָכוֹת
  choice: les royaumes
  rationale: Équivalent courant et transparent pour des entités politiques gouvernées comme des royaumes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: צִוָּה
  choice: a donné un ordre
  rationale: Exprime directement l’acte de commander et s’accorde naturellement avec la formulation prudente « au sujet de Canaan ».
- source_word: אֶל כְּנַעַן
  choice: au sujet de Canaan
  rationale: Après צוה, אֶל est inhabituel et peut désigner la cible ou l’objet de l’ordre. Cette traduction préserve cette latitude sans décider silencieusement entre « à » et « contre ».
- source_word: כְּנַעַן
  choice: Canaan
  rationale: Maintient le nom géographique du texte hébreu ; son emploi contextuel pour la région phénicienne est expliqué en note.
- source_word: לַשְׁמִיד
  choice: détruire
  rationale: Rend la force du verbe שׁמד sans ajouter la nuance plus absolue d’« anéantir ».
- source_word: מָעֻזְנֶיהָ
  choice: ses places fortes
  rationale: מָעוֹז désigne un lieu fortifié, un refuge ou une forteresse. « Places fortes » convient au contexte politico-militaire et le possessif français reste naturel malgré le suffixe féminin hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Identification de כנען dans le contexte d’Ésaïe 23
  choice: Canaan dans le texte, avec l’identification contextuelle à la région phénicienne en note
  alternative: la Phénicie
  rationale: Le nom attesté par l’hébreu doit rester visible, tandis que le contexte de Tyr justifie une clarification historique sans imposer cette interprétation dans le corps du texte.
- issue: Rapport syntaxique de l’ordre avec Canaan
  choice: au sujet de Canaan
  alternative: contre Canaan ; à Canaan
  rationale: La préposition אֶל après צוה permet plusieurs analyses. La formulation retenue maintient l’ambiguïté quant à Canaan comme destinataire, cible ou objet de l’ordre.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme prophétique est conservé par deux propositions brèves, puis par l’ordre introduit après les deux-points. Les notes maintiennent les ambiguïtés réelles de עַל et אֶל ainsi que la personnification féminine du texte hébreu.
