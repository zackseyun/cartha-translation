  to: 'Voici le pays des Chaldéens : ce peuple n’était pas[a]. L’Assyrie l’a fondé pour les créatures du désert[b]. Ils ont dressé leurs tours de siège[c], mis à nu ses palais[d] et fait de lui un monceau de ruines[e].'
