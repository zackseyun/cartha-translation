  text: הֵ֣ן אֶ֣רֶץ כַּשְׂדִּ֗ים זֶ֤ה הָ/עָם֙ לֹ֣א הָיָ֔ה אַשּׁ֖וּר יְסָדָ֣/הּ לְ/צִיִּ֑ים הֵקִ֣ימוּ בחיני/ו עֹרְרוּ֙ אַרְמְנוֹתֶ֔י/הָ שָׂמָ֖/הּ לְ/מַפֵּלָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
translation:
  language: fr
  text: 'Voici le pays des Chaldéens : ce peuple n’était pas[a]. L’Assyrie l’a fondé pour les créatures du désert[b]. Ils ont dressé leurs tours de siège[c], mis à nu ses palais[d] et fait de lui un monceau de ruines[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce peuple n’existait pas » ou « ce peuple ne comptait pas ». La proposition hébraïque est concise et difficile.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « pour les habitants du désert ». Le terme hébreu peut désigner des créatures sauvages ou des habitants des régions désertiques.'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu traduit par « tours de siège » est incertain ; on propose aussi « tours de guet » ou « fortifications ».
    reason: textual_variant
  - marker: d
    text: 'Ou : « dépouillé ses palais ».'
    reason: lexical_alternative
  - marker: e
    text: Le dernier verbe hébreu est au singulier féminin, alors que les deux verbes précédents sont au pluriel. Le texte reçu est difficile ; le français conserve ici la continuité du pluriel.
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: Interjection déictique qui attire l’attention; « Voyez » reste digne, direct et naturel en français.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: le pays des Chaldéens
  rationale: Rend naturellement le syntagme construit tout en conservant sa portée ethnogéographique.
- source_word: זֶה הָעָם לֹא הָיָה
  choice: ce peuple n’existait pas
  rationale: La proposition hébraïque est elliptique et difficile. Cette formulation demeure proche de son sens apparent sans intégrer dans le corps du texte l’interprétation possible « ne comptait pas ».
- source_word: אַשּׁוּר
  choice: L’Assyrie
  rationale: Nom français usuel de la puissance géopolitique évoquée ici.
- source_word: יְסָדָהּ
  choice: l’a établi
  rationale: Le verbe יסד signifie fonder ou établir. « Établi » convient mieux que « fondé » avec le complément énigmatique qui suit, sans aller jusqu’à l’interprétation plus libre « destiné ».
- source_word: לְצִיִּים
  choice: pour les créatures du désert
  rationale: Le terme désigne couramment des êtres ou animaux du désert, mais peut aussi viser des habitants du désert; l’ambiguïté est signalée en note.
- source_word: הֵקִימוּ בחיניו
  choice: Ils ont dressé leurs tours de siège
  rationale: La tradition textuelle est difficile; dans la séquence militaire, des ouvrages ou tours de siège donnent un sens cohérent, tout en nécessitant une note.
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  choice: mis à nu ses palais
  rationale: Dans ce contexte de destruction, le verbe exprime vraisemblablement l’action de dénuder ou de dépouiller plutôt que son sens courant « éveiller ».
- source_word: שָׂמָהּ לְמַפֵּלָה
  choice: fait de lui un monceau de ruines
  rationale: Exprime l’aboutissement en ruine ou en amas effondré. Le masculin français renvoie au « pays », malgré les suffixes féminins de l’hébreu.
theological_decisions:
- issue: Identification du sujet et enchaînement historique dans la proposition difficile
  choice: 'Conserver l’ordre apparent du texte massorétique: « L’Assyrie l’a établi… Ils ont dressé… »'
  alternative: Comprendre ou réorganiser la phrase selon certaines reconstructions historiques ou textuelles
  rationale: Le texte hébreu transmis est obscur. La traduction évite de résoudre la tension par une reconstruction historique non exprimée dans la source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’impératif « Voyez » conserve la force d’appel de הֵן. Les phrases restent abruptes afin de ne pas masquer l’obscurité réelle de l’hébreu. Les référents grammaticaux sont adaptés au genre français de « pays ».
