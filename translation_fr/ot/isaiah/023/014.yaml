  text: הֵילִ֖ילוּ אֳנִיּ֣וֹת תַּרְשִׁ֑ישׁ כִּ֥י שֻׁדַּ֖ד מָעֻזְּ/כֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/014.yaml
  text: Wail[a], ships of Tarshish[b], for your stronghold has been destroyed.
translation:
  language: fr
  text: Lamentez-vous, navires de Tarsis[a], car votre forteresse[b] a été dévastée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « navires de Tarsis » désigne des navires liés à Tarsis; elle ne précise pas davantage la nature de ce lien.
    reason: historical_context
  - marker: b
    text: Ou « votre refuge » ou « votre place forte ». Le terme hébreu désigne vraisemblablement Tyr comme lieu de sécurité pour ces navires.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentez-vous
  rationale: L’impératif pluriel de ילל exprime un cri audible de douleur ou de détresse. « Lamentez-vous » est naturel et digne en français moderne, tout en conservant la force de l’appel prophétique.
- source_word: אֳנִיּוֹת
  choice: navires
  rationale: Le nom pluriel désigne simplement des navires. Le contexte commercial ne justifie pas d’ajouter « marchands » dans le texte.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Nom propre rendu selon sa forme française biblique courante. La construction signifie traditionnellement « navires de Tarsis ».
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la lamentation et convient au registre prophétique sans obscurcir le lien logique.
- source_word: שֻׁדַּד
  choice: a été dévasté
  rationale: Le passif accompli de שדד évoque une ruine violente. « A été dévasté » conserve cette nuance plus précisément que le simple « détruit ».
- source_word: מָעֻזְּכֶן
  choice: votre refuge fortifié
  rationale: מָעוֹז peut désigner une place forte, une forteresse ou un refuge. Le suffixe féminin pluriel renvoie aux navires. « Refuge fortifié » préserve à la fois les idées de sécurité et de force, probablement en référence à Tyr comme base sûre.
theological_decisions: []
