id: ISA.23.1
reference: Isaiah 23:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַשָּׂ֖א צֹ֑ר הֵילִ֣ילוּ אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ כִּֽי שֻׁדַּ֤ד מִ/בַּ֨יִת֙ מִ/בּ֔וֹא מֵ/אֶ֥רֶץ כִּתִּ֖ים נִגְלָה לָֽ/מוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
translation:
  language: fr
  text: 'Oracle sur Tyr :

    Lamentez-vous, navires de Tarsis,

    car elle est dévastée :

    plus de maison, plus d’accès au port.[a]

    C’est du pays de Kittim[b]

    que la nouvelle leur parvient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus de maison, plus d’entrée ». L’hébreu semble indiquer que Tyr est dévastée au point qu’il ne reste ni habitation ni accès possible.
    reason: lexical_alternative
  - marker: b
    text: Kittim désigne probablement Chypre ou des régions côtières occidentales voisines.
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  choice: Oracle
  rationale: Dans les titres prophétiques, le terme introduit couramment une déclaration, souvent de jugement. « Oracle » exprime clairement ce sens de genre sans imposer le sens littéral de « fardeau ».
- source_word: צֹר
  choice: Tyr
  rationale: Forme française usuelle du nom propre de la ville phénicienne.
- source_word: הֵילִילוּ
  choice: Lamentez-vous
  rationale: L’impératif pluriel appelle à une lamentation bruyante. Cette formulation est naturelle et digne en français moderne, tout en conservant la force du contexte prophétique.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: navires de Tarsis
  rationale: L’expression peut désigner des navires associés à Tarsis par leur provenance, leur destination ou leur catégorie. La construction française conserve cette ouverture.
- source_word: שֻׁדַּד
  choice: elle est dévastée
  rationale: Le passif hébreu évoque une destruction résultant d’un ravage ou d’un pillage. Le pronom féminin renvoie naturellement à Tyr en français sans répéter le nom absent de cette proposition en hébreu.
- source_word: מִבַּיִת מִבּוֹא
  choice: plus de maison, plus d’accès au port
  rationale: 'Les deux emplois de מִן sont compris dans un sens privatif : la dévastation ne laisse ni habitation ni possibilité d’entrer. Dans ce contexte maritime, « accès au port » explicite naturellement la portée probable de בּוֹא, tout en signalant l’ambiguïté dans une note.'
- source_word: מֵאֶרֶץ כִּתִּים
  choice: du pays de Kittim
  rationale: La translittération conserve le terme ethnogéographique hébreu, dont le référent peut être Chypre ou, plus largement, des régions côtières occidentales.
- source_word: נִגְלָה לָמוֹ
  choice: la nouvelle leur parvient
  rationale: Le passif indique ici que l’événement est porté à leur connaissance. « La nouvelle leur parvient » rend ce sens naturellement en français et convient au fait que les navires apprennent la dévastation depuis Kittim.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La mise en lignes fait ressortir le rythme poétique. La traduction conserve « Tarsis » et « Kittim » sans préciser excessivement leur identification géographique, et maintient par une note l’ambiguïté de la formule « maison/entrée ».
