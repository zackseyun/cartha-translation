  source_fidelity: Le texte rend correctement les deux impératifs pluriels, la destination Tarsis et le groupe nominal final. « Région côtière » est une bonne restitution contextuelle et non surspécifiée de אִי, dont l’ambiguïté avec « île » est conservée par la note. « Passez à Tarsis » est une formulation française biblique établie qui conserve l’idée de déplacement sans introduire l’idée, absente du texte, de refuge ou d’exil.
