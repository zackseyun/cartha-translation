  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עִבְר֖וּ תַּרְשִׁ֑ישָׁ/ה הֵילִ֖ילוּ יֹ֥שְׁבֵי אִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/006.yaml
  text: Cross over to Tarshish; wail[a], inhabitants of the coastland.
translation:
  language: fr
  text: Passez à Tarsis ; lamentez-vous, habitants de la région côtière[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’île ». Le mot hébreu peut désigner une île ou une région maritime côtière.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ
  choice: Passez
  rationale: L’impératif pluriel exprime un déplacement ou une traversée. « Passez » reste naturel en français et n’explicite pas indûment le moyen du voyage.
- source_word: תַּרְשִׁישָׁה
  choice: à Tarsis
  rationale: Le hé directionnel indique un mouvement vers Tarsis ; « à Tarsis » rend cette direction de manière idiomatique.
- source_word: הֵילִילוּ
  choice: poussez des cris de désespoir
  rationale: L’impératif désigne des cris intenses de douleur ou de détresse. Cette formulation actuelle conserve la force du verbe sans recourir à l’ambiguïté de « hurlez ».
- source_word: יֹשְׁבֵי
  choice: habitants de
  rationale: Le participe substantivé désigne ceux qui résident dans le lieu ; « habitants de » est clair et idiomatique.
- source_word: אִי
  choice: la région côtière
  rationale: Le terme peut désigner une île ou un territoire maritime côtier. Dans ce contexte lié à Tyr et à Tarsis, « région côtière » convient, tandis qu’une note préserve l’autre possibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs pluriels et l’intensité de la lamentation sont conservés ; l’ambiguïté géographique de אִי est signalée en note.
