  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
translation:
  language: fr
  text: Comme une femme enceinte, sur le point d’accoucher, se tord et crie sous l’effet des douleurs de l’enfantement, ainsi étions-nous devant toi[a], Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ta présence » ; l’expression hébraïque renvoie littéralement à la face ou à la présence de Yahweh. Certains la comprennent au sens de « à cause de toi ».
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Comme
  rationale: Introduit directement la comparaison et convient au français courant.
- source_word: הָרָה
  choice: une femme enceinte
  rationale: Expression française claire et naturelle pour désigner celle qui porte un enfant.
- source_word: תַּקְרִיב לָלֶדֶת
  choice: sur le point d’accoucher
  rationale: Rend naturellement l’idée que le moment de l’accouchement approche.
- source_word: תָּחִיל
  choice: se tord
  rationale: Conserve l’image corporelle vive des douleurs du travail, sans la réduire à la simple indication qu’elle est en travail.
- source_word: תִּזְעַק
  choice: crie
  rationale: Exprime un cri fort tout en gardant une formulation sobre et naturelle.
- source_word: בַּחֲבָלֶיהָ
  choice: dans les douleurs de l’enfantement
  rationale: Dans ce contexte, le terme désigne les douleurs de l’accouchement; cette formulation est claire et digne.
- source_word: כֵּן
  choice: ainsi
  rationale: Marque nettement le second terme de la comparaison.
- source_word: הָיִינוּ
  choice: étions-nous
  rationale: Rend la forme verbale au passé et l’inversion donne une cadence naturelle après « ainsi ».
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Préserve l’image hébraïque de la face ou de la présence divine sans trancher en faveur d’un sens explicitement causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; la transcription conserve le nom personnel divin.
- issue: Sens de מִפָּנֶיךָ dans la comparaison
  choice: devant toi
  alternative: à cause de toi / en ta présence
  rationale: « Devant toi » garde la référence à la face et à la présence de Dieu, ainsi que la tension du passage, sans imposer une causalité que la préposition peut seulement suggérer.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la vigueur de l’image de l’accouchement et place correctement l’appel de note après l’expression ambiguë « devant toi ».
