  variant: modern international French
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ יֹצֵ֣א מִ/מְּקוֹמ֔/וֹ לִ/פְקֹ֛ד עֲוֺ֥ן יֹֽשֵׁב הָ/אָ֖רֶץ עָלָ֑י/ו וְ/גִלְּתָ֤ה הָ/אָ֨רֶץ֙ אֶת דָּמֶ֔י/הָ וְ/לֹֽא תְכַסֶּ֥ה ע֖וֹד עַל הֲרוּגֶֽי/הָ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: fr
  text: Car voici que le SEIGNEUR sort de sa demeure pour demander compte de sa faute à l’habitant de la terre. La terre dévoilera le sang versé sur elle et ne couvrira plus ceux qu’on y a tués.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici que
  rationale: Rend à la fois le lien explicatif כִּי et la particule présentative emphatique הִנֵּה dans un français naturel et solennel.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française largement reconnue pour le tétragramme, avec petites capitales représentées ici par des capitales.
- source_word: יֹצֵא מִמְּקוֹמוֹ
  choice: sort de sa demeure
  rationale: מָקוֹם signifie littéralement « lieu », mais dans ce contexte la demeure divine est la formulation française la plus naturelle sans préciser abusivement sa nature.
- source_word: לִפְקֹד עֲוֹן
  choice: pour demander compte de sa faute
  rationale: פקד associé à עון exprime ici l’intervention judiciaire qui fait répondre quelqu’un de sa faute; cette formulation conserve l’idée de jugement sans réduire le verbe à une simple punition.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: l’habitant de la terre
  rationale: Conserve le singulier collectif du texte hébreu et l’ambiguïté de אֶרֶץ entre terre et pays.
- source_word: וְגִלְּתָה הָאָרֶץ אֶת דָּמֶיהָ
  choice: La terre dévoilera le sang versé sur elle
  rationale: Le pluriel hébreu דמים évoque le sang répandu et les crimes de sang. « Sur elle » explicite naturellement le rapport à la terre sans personnification féminine artificielle en français.
- source_word: הֲרוּגֶיהָ
  choice: ceux qu’on y a tués
  rationale: Rend les victimes mises à mort et leur relation à la terre, tout en évitant l’ambiguïté française de « ses morts », qui pourrait désigner les auteurs ou une simple possession.
theological_decisions:
- issue: Portée de la visite judiciaire divine
  choice: demander compte de sa faute à l’habitant de la terre
  alternative: punir l’iniquité de l’habitant de la terre sur lui
  rationale: Le choix retenu exprime la reddition de comptes impliquée par פקד et l’imputation de la faute portée par עָלָיו, sans décider au-delà du texte de la forme précise du châtiment.
- issue: Témoignage de la terre concernant les victimes
  choice: la terre dévoilera le sang versé sur elle
  alternative: la terre découvrira ses sangs
  rationale: La formulation préserve l’image théologique d’une terre qui ne dissimule plus les crimes de sang, tout en restant intelligible en français moderne.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de la progression hébraïque, mais les idiomes judiciaires et les pluriels de sang sont rendus naturellement. Le singulier collectif « l’habitant de la terre » est conservé.
