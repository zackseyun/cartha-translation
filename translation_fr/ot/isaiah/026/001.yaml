  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
translation:
  language: fr
  text: 'En ce jour-là, on chantera ce chant dans le pays de Juda : « Nous avons une ville forte[a] ; il établit le salut comme murailles et rempart[b][c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous avons une ville fortifiée. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il fait du salut ses murailles et son rempart ». Le sujet du verbe hébreu n’est pas exprimé ; dans le contexte, il est généralement compris comme désignant Dieu.'
    reason: alternative_reading
  - marker: c
    text: Le mot hébreu traduit par « rempart » désigne une fortification défensive extérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Rend naturellement l’expression temporelle prophétique tout en conservant sa portée.
- source_word: יוּשַׁר
  choice: on chantera
  rationale: Le hofal exprime ici qu’un chant sera chanté ; le pronom indéfini français rend naturellement ce passif sans préciser les chanteurs.
- source_word: הַשִּׁיר הַזֶּה
  choice: ce chant
  rationale: Reproduit le texte sans ajouter l’idée explicite de louange.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Conserve explicitement אֶרֶץ et sa dimension géographique.
- source_word: עִיר עָז
  choice: une ville forte
  rationale: Expression concise qui garde l’image de puissance et de sécurité ; « ville fortifiée » reste possible.
- source_word: לָנוּ
  choice: Nous avons
  rationale: Le datif possessif de la proposition nominale se rend idiomatiquement ainsi en français.
- source_word: יְשׁוּעָה
  choice: salut
  rationale: Équivalent direct qui conserve la richesse théologique du terme, sans le réduire à une victoire militaire.
- source_word: יָשִׁית
  choice: il fait de
  rationale: Dans cette construction, « faire de X Y » exprime naturellement l’établissement du salut comme moyen de défense, tout en maintenant le sujet masculin singulier implicite.
- source_word: חוֹמוֹת
  choice: murailles
  rationale: Conserve le pluriel hébreu et convient au système défensif d’une ville.
- source_word: וָחֵל
  choice: et son rempart
  rationale: חֵל désigne une fortification défensive extérieure ; « rempart » est clair en français contemporain.
theological_decisions:
- issue: Sujet de יָשִׁית (« il fait de »)
  choice: Maintenir le sujet masculin singulier sous la forme « il », sans le nommer.
  alternative: Expliciter « Dieu » ou « le Seigneur », ou employer une tournure impersonnelle.
  rationale: Le verbe hébreu est au singulier, mais son sujet n’est pas exprimé. Le contexte suggère Dieu, sans toutefois le nommer dans ce verset ; la traduction préserve donc cette implicitation.
- issue: Rapport entre le salut et les défenses de la ville
  choice: « il fait du salut ses murailles et son rempart »
  alternative: « il établit le salut comme murailles et rempart »
  rationale: La formulation retenue préserve la métaphore selon laquelle le salut constitue la défense de la ville, sans expliquer davantage la nature de ce salut.
translation_notes:
  register: Français international moderne, digne et aisément compréhensible. « On chantera » évite un passif lourd ; « murailles » et « rempart » maintiennent l’image urbaine et défensive. Tous les marqueurs de notes sont placés au point précis qu’ils éclairent.
