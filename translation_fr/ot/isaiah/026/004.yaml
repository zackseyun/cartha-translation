  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: fr
  text: Faites confiance au SEIGNEUR pour toujours, car en Yah[a], le SEIGNEUR est un rocher éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yah » est une forme courte du nom divin représenté ici par « le SEIGNEUR ».
    reason: Explique au lecteur moderne la relation lexicale entre יָהּ et יהוה sans effacer leur juxtaposition dans le texte.
lexical_decisions:
- source_word: בִּטְחוּ
  choice: Mettez votre confiance
  rationale: L’impératif hébreu est au pluriel. Cette tournure française actuelle exprime naturellement l’appel adressé à la communauté.
- source_word: בַיהוָה
  choice: dans le SEIGNEUR
  rationale: La préposition ב est rendue par « dans », et le tétragramme par « le SEIGNEUR », convention qui signale le nom divin sans lui substituer un nom confessionnel particulier.
- source_word: עֲדֵי עַד
  choice: pour toujours
  rationale: L’expression intensive désigne une durée perpétuelle; « pour toujours » est clair, naturel et fidèle.
- source_word: בְּיָהּ יְהוָה
  choice: en Yah, le SEIGNEUR
  rationale: Conserve la préposition ב, la forme courte יָהּ et le tétragramme qui la suit, sans niveler la formulation hébraïque inhabituelle.
- source_word: צוּר עוֹלָמִים
  choice: un rocher éternel
  rationale: Préserve la métaphore de צוּר et rend idiomatiquement le pluriel intensif עוֹלָמִים, qui évoque la permanence.
theological_decisions:
- issue: Rapport entre « Yah » et « le SEIGNEUR » dans בְּיָהּ יְהוָה
  choice: Conserver « en Yah, le SEIGNEUR »
  alternative: « car Yah, le SEIGNEUR, est le rocher éternel »
  rationale: La solution retenue maintient le בְ explicite et la tension syntaxique du texte massorétique, au lieu de transformer silencieusement les deux désignations en une simple apposition.
- issue: Détermination de « rocher »
  choice: « un rocher éternel »
  alternative: « le rocher éternel »
  rationale: L’hébreu n’emploie pas l’article devant צוּר; l’indéfini évite d’ajouter une détermination absente, tout en gardant la portée théologique de la métaphore.
translation_notes:
  register: Français international moderne, sobre et poétique. L’impératif pluriel est rendu explicitement. La seconde proposition garde volontairement une syntaxe marquée afin de refléter la formulation hébraïque inhabituelle plutôt que de la résoudre.
