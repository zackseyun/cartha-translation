id: ISA.26.10
reference: Isaiah 26:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
translation:
  language: fr
  text: Même si l’on fait grâce au méchant[a], il n’apprend pas la justice[b] ; dans un pays où règne la droiture[c], il agit injustement et ne voit pas[d] la majesté[e] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si l’on fait grâce au méchant. » Le début hébreu peut être compris comme une condition plutôt que comme une concession.'
    reason: alternative_reading
  - marker: b
    text: Le terme traduit par « justice » peut aussi désigner la droiture ou ce qui est juste.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans un pays de droiture ». Autres traductions possibles : « dans un pays droit » ou « dans un pays d’équité ».'
    reason: lexical_alternative
  - marker: d
    text: Ici, « voir » peut avoir le sens de percevoir ou de reconnaître.
    reason: lexical_alternative
  - marker: e
    text: 'Ou : « la grandeur » ou « l’élévation » de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן
  choice: Même si l’on fait grâce
  rationale: Le hophal de חנן exprime le fait de recevoir grâce ou faveur. La tournure impersonnelle française conserve le passif, et « même si » rend naturellement la valeur concessive suggérée par le contexte.
- source_word: רָשָׁע
  choice: au méchant
  rationale: L’adjectif substantivé singulier désigne ici de façon représentative la personne méchante, sans qu’il soit nécessaire d’ajouter « homme ».
- source_word: בַּל לָמַד
  choice: il n’apprend pas
  rationale: בַּל marque la négation, et le qal de למד signifie normalement « apprendre ». Le présent convient à la portée générale de l’énoncé.
- source_word: צֶדֶק
  choice: la justice
  rationale: צֶדֶק peut désigner la justice, la droiture ou ce qui est juste. « Justice » est naturel en français et maintient le contraste avec l’action injuste qui suit.
- source_word: בְּאֶרֶץ נְכֹחוֹת
  choice: dans un pays où règne la droiture
  rationale: נְכֹחוֹת évoque la rectitude, l’ordre juste ou l’équité. Cette formulation française restitue l’idée d’un pays caractérisé par la droiture sans rendre l’expression artificielle.
- source_word: יְעַוֵּל
  choice: il commet l’injustice
  rationale: Le piel de עול signifie agir injustement ou commettre le mal. Cette expression conserve la nuance éthique et fait écho à « la justice ».
- source_word: וּבַל יִרְאֶה
  choice: et ne voit pas
  rationale: ראה signifie littéralement « voir » mais peut inclure l’idée de percevoir ou reconnaître. Le texte principal garde l’image hébraïque, précisée en note.
- source_word: גֵּאוּת
  choice: la majesté
  rationale: גֵּאוּת désigne l’élévation, la grandeur ou la majesté. « Majesté » convient au référent divin sans confondre ce terme avec le vocabulaire hébreu propre à la gloire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin « Yahweh », plutôt que remplacé par un titre.
theological_decisions:
- issue: Valeur concessive ou conditionnelle de la proposition initiale
  choice: 'Concessive : « Même si l’on fait grâce au méchant »'
  alternative: 'Conditionnelle : « Si l’on fait grâce au méchant »'
  rationale: Dans le contexte, la proposition oppose la faveur reçue à l’obstination du méchant, qui n’apprend toujours pas la justice. La lecture concessive exprime le mieux ce contraste, tandis que la lecture conditionnelle demeure possible et figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure antithétique du verset, le nom divin et l’image de la vision, tout en évitant un calque peu naturel de « pays de droiture » dans le texte principal.
