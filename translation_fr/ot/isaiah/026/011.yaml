revisions:
- from: Yahvé, ta main est levée, mais ils ne la voient pas. Ils verront ton zèle pour ton peuple[a] et seront couverts de honte. Oui, le feu destiné à tes ennemis[b] les dévorera.
  to: Yahvé, ta main est levée, mais ils ne la voient pas. Ils verront ton zèle pour ton peuple[a] et en auront honte. Oui, un feu dévorera tes ennemis[b].
  rationale: La révision retire l'ajout interprétatif « destiné à », rend explicitement « tes ennemis » comme objet de « dévorera » et emploie une expression française de la honte plus directement proportionnée au verbe hébreu. Les deux ambiguïtés syntaxiques signalées par l'audit sont préservées en notes sans imposer une lecture confessionnelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'La première proposition est fidèle. Le texte principal rend correctement la lecture contextuellement probable de קִנְאַת עָם comme le zèle de Yahvé en faveur de son peuple, tout en la signalant en note. En revanche, « le feu destiné à tes ennemis les dévorera » explicite un rapport de destination absent de l''hébreu et maintient un pronom dont le référent est moins direct que dans le texte source. La formulation révisée rend plus directement אֵשׁ צָרֶיךָ תֹאכְלֵם : « un feu dévorera tes ennemis ».'
  naturalness: Le français du projet est globalement moderne et naturel. « Ils verront ton zèle pour ton peuple et en auront honte » établit clairement le rapport entre la vision du zèle et la honte, sans employer la tournure un peu plus lourde « seront couverts de honte ». « Un feu dévorera tes ennemis » est idiomatique et vigoureux.
  terminology: « Yahvé », « zèle », « peuple » et « ennemis » conviennent au registre biblique français international. « Oui » rend adéquatement la valeur additive ou intensive de אַף, sans lui attribuer une nuance doctrinale. La note a est conservée pour l'ambiguïté réelle de קִנְאַת עָם. La note b est reformulée afin de ne pas présenter comme sens principal une interprétation que le texte français ne retient pas.
  issues:
  - severity: medium
    issue: « destiné à tes ennemis » ajoute une relation de destination.
    rationale: Le syntagme hébreu peut être analysé de diverses façons, mais il ne comporte pas de terme équivalant à « destiné à ». Le contexte permet de comprendre le feu comme jugement contre les ennemis, sans devoir lexicaliser cette destination.
  - severity: low
    issue: Le pronom « les » a un antécédent moins immédiat dans la dernière phrase.
    rationale: Avec « le feu destiné à tes ennemis les dévorera », le lecteur doit reprendre « tes ennemis » à l'intérieur d'un complément. Nommer directement l'objet conserve la clarté et l'ordre sémantique de la clause hébraïque.
  - severity: low
    issue: « seront couverts de honte » est plus intensif que nécessaire.
    rationale: Le verbe יבשו exprime le fait d'avoir honte ou d'être confondu. « En auront honte » reste naturel et plus proche sans affaiblir le ton.
  revised_text: Yahvé, ta main est levée, mais ils ne la voient pas. Ils verront ton zèle pour ton peuple[a] et en auront honte. Oui, un feu dévorera tes ennemis[b].
  revised_footnotes:
  - marker: a
    text: Ou « le zèle du peuple ». L’expression hébraïque est condensée et peut être comprise de plusieurs manières.
    reason: alternative_reading
  - marker: b
    text: Ou, selon un autre rattachement, « le feu de tes ennemis les dévorera ». La construction hébraïque est ambiguë; le contexte favorise toutefois le feu du jugement qui dévore les ennemis de Yahvé.
    reason: alternative_reading
  revision_rationale: La révision retire l'ajout interprétatif « destiné à », rend explicitement « tes ennemis » comme objet de « dévorera » et emploie une expression française de la honte plus directement proportionnée au verbe hébreu. Les deux ambiguïtés syntaxiques signalées par l'audit sont préservées en notes sans imposer une lecture confessionnelle.
