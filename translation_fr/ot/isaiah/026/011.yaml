id: ISA.26.11
reference: Isaiah 26:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֛ה רָ֥מָה יָדְ/ךָ֖ בַּל יֶחֱזָי֑וּ/ן יֶחֱז֤וּ וְ/יֵבֹ֨שׁוּ֙ קִנְאַת עָ֔ם אַף אֵ֖שׁ צָרֶ֥י/ךָ תֹאכְלֵֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
translation:
  language: fr
  text: Yahvé, ta main est levée, mais ils ne la voient pas. Ils verront ton zèle pour ton peuple[a] et en auront honte. Oui, un feu dévorera tes ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le zèle du peuple ». L’expression hébraïque est condensée et peut être comprise de plusieurs manières.
    reason: alternative_reading
  - marker: b
    text: Ou, selon un autre rattachement, « le feu de tes ennemis les dévorera ». La construction hébraïque est ambiguë; le contexte favorise toutefois le feu du jugement qui dévore les ennemis de Yahvé.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, employé ici comme vocatif.
- source_word: רָמָה יָדְךָ
  choice: ta main est levée
  rationale: Conserve l’image de la main élevée, signe de l’action ou de la puissance divine, sans en préciser davantage la portée.
- source_word: בַּל יֶחֱזָיוּן
  choice: mais ils ne la voient pas
  rationale: Le pronom « la » reprend naturellement « ta main » en français; « voir » garde la simplicité du verbe hébreu.
- source_word: יֶחֱזוּ וְיֵבֹשׁוּ
  choice: Ils verront … et seront couverts de honte
  rationale: L’imparfait hébreu est rendu avec une valeur future, créant le contraste avec leur aveuglement présent; la tournure française exprime fortement la honte subie.
- source_word: קִנְאַת עָם
  choice: ton zèle pour ton peuple
  rationale: La construction hébraïque est très condensée. Le contexte favorise le zèle de Yahvé en faveur de son peuple, mais l’autre analyse possible est signalée en note.
- source_word: אַף
  choice: Oui
  rationale: Marque l’insistance et la progression vers l’annonce finale du jugement.
- source_word: אֵשׁ צָרֶיךָ
  choice: le feu destiné à tes ennemis
  rationale: Cette formulation comprend le feu comme le jugement réservé aux ennemis de Yahvé, tout en signalant en note l’autre rattachement grammatical possible.
- source_word: תֹאכְלֵם
  choice: les dévorera
  rationale: Avec le feu pour sujet, « dévorer » conserve l’image vive du verbe hébreu « manger, dévorer ».
theological_decisions:
- issue: Sens de קִנְאַת עָם
  choice: le zèle de Yahvé pour son peuple
  alternative: le zèle du peuple
  rationale: Le parallèle avec « tes ennemis » favorise l’idée que Yahvé agit avec zèle en faveur de son peuple. La syntaxe compacte ne permet toutefois pas d’exclure que le peuple soit le sujet ou le possesseur du zèle; cette ambiguïté est conservée en note.
- issue: Rattachement de אֵשׁ צָרֶיךָ
  choice: le feu destiné aux ennemis de Yahvé
  alternative: le feu des ennemis de Yahvé
  rationale: Dans le contexte du jugement divin, le feu qui dévore les ennemis se comprend le plus naturellement comme le feu qui leur est destiné. L’hébreu permet néanmoins de rattacher « tes ennemis » à « feu » comme un complément de possession ou d’origine.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme et les images concrètes de la main levée et du feu dévorant sont conservés; les ambiguïtés syntaxiques réelles sont indiquées sans alourdir le texte principal.
