id: ISA.26.7
reference: Isaiah 26:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
translation:
  language: fr
  text: Le sentier du juste est uni ; toi qui es droit[a], tu aplanis la voie du juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le sentier du juste est uni ; droit est le parcours du juste que tu aplanis. » L’hébreu permet de comprendre « droit » comme une qualification du parcours plutôt que comme une adresse directe, bien que le verbe à la deuxième personne favorise cette dernière lecture.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח
  choice: sentier
  rationale: Désigne un chemin concret ou, par image, une manière de vivre. « Sentier » convient au parallélisme poétique avec מַעְגַּל.
- source_word: לַצַּדִּיק
  choice: du juste
  rationale: Le ל exprime ici la relation ou l’appartenance. Le singulier générique « le juste » conserve la forme et la portée collective possibles de l’hébreu.
- source_word: מֵישָׁרִים
  choice: uni
  rationale: Ce pluriel nominal fonctionne ici comme prédicat et évoque un terrain égal, sans obstacle. « Uni » garde l’image concrète du chemin.
- source_word: יָשָׁר
  choice: toi qui es droit
  rationale: La lecture vocative est favorisée par le verbe suivant à la deuxième personne du masculin singulier. Cette formulation française exprime l’adresse sans créer un titre divin artificiellement figé.
- source_word: מַעְגַּל
  choice: voie
  rationale: Le terme désigne une piste, une trace ou un parcours. « Voie » maintient l’image du déplacement tout en évitant la répétition de « sentier ».
- source_word: צַדִּיק
  choice: du juste
  rationale: Le singulier hébreu a une valeur générique. « Le juste » reste inclusif dans sa portée sans ajouter une précision de genre absente de l’intention poétique.
- source_word: תְּפַלֵּס
  choice: tu aplanis
  rationale: Le piel de פלס peut signifier niveler ou rendre praticable un chemin. « Aplanir » rend naturellement l’action exercée sur la voie et conserve le lien avec l’idée de terrain uni.
theological_decisions:
- issue: יָשָׁר peut-il qualifier le chemin ou servir d’adresse à Dieu ?
  choice: 'Lecture vocative : « toi qui es droit »'
  alternative: 'Lecture adjectivale : « droit est le parcours du juste que tu aplanis »'
  rationale: Le verbe תְּפַלֵּס, à la deuxième personne du masculin singulier, favorise une adresse directe à Dieu, mais l’absence de marque vocative explicite permet aussi de rattacher יָשָׁר au chemin. La note conserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme routier est conservé par « sentier », « voie », « uni » et « aplanis ». La formulation demeure accessible sans effacer l’ambiguïté syntaxique de יָשָׁר.
