source:
  edition: WLC
  text: תִּרְמְסֶ֖/נָּה רָ֑גֶל רַגְלֵ֥י עָנִ֖י פַּעֲמֵ֥י דַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
translation:
  language: fr
  text: 'Le pied la piétine : les pieds du pauvre, les pas des faibles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le pied la piétinera : les pieds du pauvre, les pas des faibles. » Le verbe hébreu peut avoir ici une valeur future.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  choice: la piétine
  rationale: Le verbe רמס signifie « piétiner, fouler ». Le suffixe féminin renvoie naturellement à la ville élevée, nom féminin dans le contexte immédiat (v. 5). Le présent donne à la scène sa vivacité poétique.
- source_word: רָגֶל
  choice: Le pied
  rationale: Le singulier collectif et poétique est conservé, puis développé par les deux expressions parallèles qui suivent.
- source_word: רַגְלֵי עָנִי
  choice: les pieds du pauvre
  rationale: עָנִי peut désigner une personne pauvre, affligée ou opprimée. « Du pauvre » conserve le singulier hébreu et exprime ici le renversement entre les humiliés et la ville hautaine.
- source_word: פַּעֲמֵי
  choice: les pas
  rationale: Le nom désigne ici les pas ou les empreintes de pas. « Les pas » forme un parallèle naturel et poétique avec « les pieds ».
- source_word: דַלִּים
  choice: des faibles
  rationale: דַלִּים désigne ceux qui sont faibles, de condition modeste ou démunis. « Des faibles » préserve une distinction lexicale avec עָנִי sans exclure la dimension sociale du terme.
theological_decisions:
- issue: Référent du suffixe féminin dans תִּרְמְסֶנָּה
  choice: Le pronom « la » renvoie à la ville élevée abaissée au verset 5.
  alternative: Laisser l'objet féminin non identifié.
  rationale: Le contexte immédiat fournit un antécédent féminin clair. Le pronom français maintient ce lien sans ajouter d'interprétation doctrinale.
- issue: Valeur temporelle du verbe תִּרְמְסֶנָּה
  choice: 'Présent poétique : « la piétine »'
  alternative: 'Futur : « la piétinera »'
  rationale: La forme préfixée peut recevoir une valeur future dans le contexte, mais le présent rend bien la scène prophétique de façon vive. L'ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, sobre et poétique. La reprise « Le pied… les pieds… les pas » reproduit le développement parallèle de l'hébreu. « Des faibles » est retenu plutôt que « des nécessiteux » afin de distinguer דַלִּים de עָנִי tout en préservant l'idée de personnes socialement vulnérables.
