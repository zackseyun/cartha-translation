id: ISA.26.2
reference: Isaiah 26:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פִּתְח֖וּ שְׁעָרִ֑ים וְ/יָבֹ֥א גוֹי צַדִּ֖יק שֹׁמֵ֥ר אֱמֻנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
translation:
  language: fr
  text: Ouvrez les portes, pour que la nation juste entre, celle qui demeure fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celle qui garde la vérité » ou « celle qui garde la foi ». Le mot hébreu peut désigner la fidélité, la fiabilité, la vérité ou la foi, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Ouvrez
  rationale: Impératif qal pluriel de פתח. « Ouvrez » rend directement et naturellement l’ordre en français.
- source_word: שְׁעָרִים
  choice: les portes
  rationale: Le pluriel désigne ici, selon le contexte, les portes de la ville. L’article défini est naturel en français même s’il n’est pas exprimé en hébreu.
- source_word: וְיָבֹא
  choice: pour que … entre
  rationale: Après l’impératif, la conjonction suivie de l’imparfait exprime ici le but ou le résultat. « Entre » reprend naturellement l’image des portes.
- source_word: גוֹי
  choice: nation
  rationale: גוי désigne un peuple constitué en collectivité; « nation » conserve cette dimension collective.
- source_word: צַדִּיק
  choice: juste
  rationale: L’adjectif qualifie la nation sur le plan moral et relationnel. En français moderne, « juste » est plus naturel que « droite » et conserve le sens biblique.
- source_word: שֹׁמֵר
  choice: celle qui demeure
  rationale: Le participe qal caractérise durablement la nation. Avec « fidèle », « demeure » exprime de façon idiomatique la persévérance impliquée par שׁמר, sans imposer le calque peu naturel « garde la fidélité ».
- source_word: אֱמֻנִים
  choice: fidèle
  rationale: Le pluriel abstrait/intensif issu de אמן peut évoquer la fidélité, la fiabilité, la vérité ou la foi. La tournure « demeure fidèle » restitue naturellement en français l’idée de fidélité constante.
theological_decisions:
- issue: Sens de אֱמֻנִים appliqué à la nation juste
  choice: celle qui demeure fidèle
  alternative: celle qui garde la vérité / celle qui garde la foi
  rationale: Le contexte décrit vraisemblablement la constance et la loyauté de la nation. Cette traduction préserve la portée éthique et relationnelle sans réduire le terme à la croyance subjective; une note maintient les autres sens possibles.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche de l’appel poétique hébreu, tandis que « demeure fidèle » évite un calque maladroit et exprime la continuité du participe.
