  yaml_path: translation/ot/isaiah/026/003.yaml
  text: You keep in perfect peace the mind that is stayed on you[c][b][a], because it trusts in you.
translation:
  language: fr
  text: Tu gardes dans une paix parfaite[a] l’esprit ferme[b], car il a confiance en toi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « paix, paix » ; la répétition exprime une paix pleine ou complète.'
    reason: lexical_alternative
  - marker: b
    text: Ou « la disposition intérieure », « l’inclination » ou « la manière de penser ».
    reason: lexical_alternative
  - marker: c
    text: 'On traduit aussi l’ensemble : « Tu gardes dans une paix parfaite celui dont l’esprit s’appuie sur toi, parce qu’il a confiance en toi. » L’hébreu nomme plus directement « l’esprit » ou « la disposition intérieure ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵצֶר
  choice: l’esprit
  rationale: Le nom peut désigner ce qui est formé, l’inclination, la disposition intérieure ou la pensée. Ici, « l’esprit » exprime naturellement la disposition intérieure qui demeure ferme et se confie en Dieu.
- source_word: סָמוּךְ
  choice: qui demeure ferme
  rationale: Le participe passif de סמך évoque ce qui est soutenu, appuyé ou fermement établi. « Qui demeure ferme » rend cette stabilité sans ajouter explicitement un complément absent à cet endroit du texte hébreu.
- source_word: תִּצֹּר
  choice: Tu gardes
  rationale: Le verbe נצר signifie garder, protéger ou préserver. « Tu gardes » conserve l’adresse directe à Dieu et s’emploie naturellement avec l’idée d’un maintien dans la paix.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: dans une paix parfaite
  rationale: La répétition de שָׁלוֹם intensifie l’idée de paix et exprime sa plénitude. « Une paix parfaite » en communique le sens dans un français naturel, tandis que la forme littérale est signalée en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la stabilité et de la paix décrites dans la première proposition.
- source_word: בְךָ
  choice: en toi
  rationale: La préposition ב marque l’objet de la confiance. « Se confier en toi » est l’expression française idiomatique correspondante.
- source_word: בָּטוּחַ
  choice: il se confie
  rationale: La forme de בטח exprime la confiance ou l’assurance. Le pronom « il » reprend grammaticalement « l’esprit », tout en laissant entendre la personne caractérisée par cette disposition intérieure.
theological_decisions:
- issue: Référence du sujet et langage anthropologique
  choice: Présenter directement « l’esprit » comme ce que Dieu garde
  alternative: « Tu gardes dans une paix parfaite celui dont l’esprit s’appuie sur toi »
  rationale: L’hébreu nomme directement יֵצֶר, la disposition intérieure, sans pronom personnel explicite. La formulation retenue respecte cette construction et évite d’introduire silencieusement un sujet masculin absent du texte.
- issue: Traduction du redoublement שָׁלוֹם שָׁלוֹם
  choice: une paix parfaite
  alternative: paix, paix ; une paix complète
  rationale: Le redoublement intensifie le nom. « Une paix parfaite » transmet cette plénitude en français courant et digne, tandis qu’une note conserve la texture littérale.
- issue: Relation entre סָמוּךְ et בְךָ
  choice: Ne pas ajouter « sur toi » après « demeure ferme »
  alternative: « l’esprit qui s’appuie sur toi »
  rationale: 'Dans le texte massorétique, בְךָ appartient explicitement à la proposition causale avec בָּטוּחַ : « car il se confie en toi ». La traduction évite donc de faire porter deux fois « toi » sur des éléments distincts, tout en préservant le lien logique entre fermeté et confiance.'
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. L’adresse à Dieu au singulier est conservée. La formulation maintient le parallélisme entre fermeté intérieure, confiance et paix, sans reprendre mécaniquement une tournure traditionnelle étrangère à la syntaxe hébraïque.
