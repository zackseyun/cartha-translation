source:
  edition: WLC
  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
translation:
  language: fr
  text: Oui, sur le chemin de tes jugements[a], Yahweh, nous t’avons attendu ; ton nom et ton souvenir[b] sont ce que l’âme désire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta justice » ou « tes décisions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ton mémorial » ou « la mémoire de toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Oui
  rationale: La particule introduit ici l’affirmation avec insistance. « Oui » restitue cette force dans un français poétique naturel, sans imposer un rapport logique trop précis.
- source_word: אֹרַח
  choice: chemin
  rationale: Le mot désigne un chemin ou une voie. « Chemin » conserve l’image métaphorique de l’hébreu.
- source_word: מִשְׁפָּטֶיךָ
  choice: tes jugements
  rationale: מִשְׁפָּט peut désigner les jugements, la justice ou les décisions établies. « Tes jugements » maintient ici la tension entre l’ordre juste de Dieu et ses interventions judiciaires.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de représenter directement le tétragramme présent dans le texte hébreu.
- source_word: קִוִּינוּךָ
  choice: nous t’avons attendu
  rationale: קוה exprime une attente confiante et porte ici un suffixe objet de deuxième personne. Cette formulation garde explicites aussi bien l’attente que son objet.
- source_word: לְשִׁמְךָ
  choice: ton nom
  rationale: Le sens direct convient au contexte et peut évoquer à la fois le nom révélé et la réputation de Dieu sans explicitation supplémentaire.
- source_word: וּלְזִכְרְךָ
  choice: et ton souvenir
  rationale: זֵכֶר peut désigner le souvenir, la mémoire ou ce qui perpétue la renommée. « Ton souvenir » préserve le parallélisme compact avec « ton nom ».
- source_word: תַּאֲוַת נָפֶשׁ
  choice: sont ce que l’âme désire
  rationale: Cette tournure française naturelle rend la proposition nominale « désir de l’âme » tout en maintenant le singulier poétique נֶפֶשׁ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin. Sa transcription préserve cette donnée au lieu de la remplacer silencieusement par un titre.
- issue: Portée de מִשְׁפָּטֶיךָ
  choice: tes jugements
  alternative: ta justice / tes décisions
  rationale: « Jugements » conserve l’ambivalence entre les actes judiciaires de Dieu, ses décisions et l’ordre juste qu’il établit.
- issue: Référent de נָפֶשׁ
  choice: l’âme
  alternative: notre âme
  rationale: L’hébreu ne comporte pas de suffixe possessif sur נָפֶשׁ. Le singulier générique est donc conservé, sans rendre explicitement collectif ce qui reste grammaticalement indéfini.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe poétique claire. L’invocation « Yahweh » et le singulier générique « l’âme » maintiennent la densité du texte hébreu sans archaïsme inutile.
