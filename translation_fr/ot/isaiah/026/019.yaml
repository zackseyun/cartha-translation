source:
  edition: WLC
  text: יִֽחְי֣וּ מֵתֶ֔י/ךָ נְבֵלָתִ֖/י יְקוּמ֑וּ/ן הָקִ֨יצוּ וְ/רַנְּנ֜וּ שֹׁכְנֵ֣י עָפָ֗ר כִּ֣י טַ֤ל אוֹרֹת֙ טַלֶּ֔/ךָ וָ/אָ֖רֶץ רְפָאִ֥ים תַּפִּֽיל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
translation:
  language: fr
  text: Tes morts vivront ; mes corps sans vie se relèveront[a]. Réveillez-vous et criez de joie, vous qui habitez dans la poussière ! Car ta rosée est une rosée de lumières[b], et la terre rejettera les défunts[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu porte « mon cadavre », avec un possessif à la première personne du singulier, mais le verbe est au pluriel. Le nom peut donc être compris collectivement : « mes corps sans vie ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « une rosée de lumière » ou « une rosée lumineuse ». L’expression hébraïque est difficile et peut évoquer une rosée rayonnante qui donne la vie.
    reason: lexical_alternative
  - marker: c
    text: Ou « les ombres ». Le terme hébreu רְפָאִים peut désigner les morts, représentés comme les habitants indistincts du séjour des morts.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵתֶיךָ
  choice: tes morts
  rationale: Le pluriel construit avec suffixe masculin singulier est rendu directement et naturellement, sans préciser si l’interlocuteur est Dieu ou Sion.
- source_word: נְבֵלָתִי
  choice: mes corps sans vie
  rationale: נְבֵלָה désigne un cadavre ou un corps mort. Le pluriel français s’accorde avec le verbe hébreu pluriel יְקוּמוּן, tandis que le possessif à la première personne est conservé. « Corps sans vie » reste digne et naturel dans ce contexte poétique.
- source_word: יְקוּמוּן
  choice: se relèveront
  rationale: Le qal de קום exprime ici le fait de se lever. Le verbe pronominal français convient à l’image de résurrection et maintient le parallélisme avec « vivront ».
- source_word: הָקִיצוּ
  choice: Réveillez-vous
  rationale: L’impératif appelle les habitants de la poussière à sortir du sommeil de la mort. Cette formulation est directe et courante en français moderne.
- source_word: וְרַנְּנוּ
  choice: criez de joie
  rationale: רנן exprime une exultation sonore. « Criez de joie » restitue cette vigueur sans imposer nécessairement l’idée de chant.
- source_word: שֹׁכְנֵי עָפָר
  choice: vous qui habitez dans la poussière
  rationale: La traduction conserve l’adresse directe et la métaphore des morts demeurant dans la poussière.
- source_word: טַל אוֹרֹת
  choice: une rosée de lumières
  rationale: Cette formulation conserve le pluriel énigmatique אוֹרֹת et l’image poétique hébraïque, sans trancher entre lumière, éclat et puissance vivifiante.
- source_word: רְפָאִים
  choice: les défunts
  rationale: Dans ce contexte, le terme désigne les morts associés au séjour souterrain, et non le peuple des Rephaïm. « Défunts » communique ce sens tout en laissant à une note la possibilité plus imagée des « ombres ».
- source_word: תַּפִּיל
  choice: rejettera
  rationale: Le hiphil de נפל présente la terre comme faisant sortir les morts hors d’elle. « Rejettera » garde la force de cette image mieux qu’une paraphrase telle que « rendra à la vie ».
theological_decisions:
- issue: Langage de résurrection dans un contexte poétique et prophétique
  choice: Conserver directement les images de morts qui vivent, se relèvent et sortent de la terre.
  alternative: Comprendre l’ensemble uniquement comme une métaphore du rétablissement national.
  rationale: La formulation évoque fortement une résurrection réelle tout en pouvant porter une espérance collective pour Israël. La traduction ne réduit pas cette tension à une seule lecture.
- issue: Référence du locuteur dans « mes corps sans vie »
  choice: Maintenir le possessif à la première personne.
  alternative: Harmoniser en « leurs corps » ou « tes corps » par conjecture.
  rationale: Le texte massorétique porte un suffixe de première personne. L’identité exacte du locuteur restant discutée, il convient de préserver la forme transmise.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe conserve le parallélisme du verset et ses images concrètes. Les formulations difficiles du texte hébreu sont maintenues dans le corps du texte puis éclairées en notes, sans résoudre artificiellement leurs ambiguïtés.
