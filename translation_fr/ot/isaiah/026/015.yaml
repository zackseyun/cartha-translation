source:
  edition: WLC
  text: יָסַ֤פְתָּ לַ/גּוֹי֙ יְהוָ֔ה יָסַ֥פְתָּ לַ/גּ֖וֹי נִכְבָּ֑דְתָּ רִחַ֖קְתָּ כָּל קַצְוֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
translation:
  language: fr
  text: 'Tu as fait grandir la nation, Yahvé,

    tu as fait grandir la nation ;

    tu as été glorifié[a] ;

    tu as repoussé loin toutes les frontières du pays[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu t’es couvert de gloire », « tu as été honoré » ou « tu as manifesté ta gloire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes les extrémités de la terre ». L’hébreu peut désigner les extrémités ou les limites ; dans ce contexte, il s’agit probablement des frontières du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ לַגּוֹי
  choice: tu as agrandi la nation
  rationale: Avec ל suivi d’un nom collectif, יסף exprime ici l’accroissement ou l’agrandissement. « Agrandi » reste naturel en français et convient aussi bien à l’augmentation du peuple qu’à son expansion, sans trancher inutilement entre les deux.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est translittéré sous sa forme française courante « Yahvé », plutôt que remplacé par le titre « le Seigneur ».
- source_word: נִכְבָּדְתָּ
  choice: tu as été glorifié
  rationale: 'Le niphal de כבד peut ici avoir une valeur passive ou résultative : Yahvé apparaît revêtu de gloire ou reçoit la gloire. La formulation retenue suit de près la forme hébraïque tout en laissant ouverte la question de l’agent.'
- source_word: רִחַקְתָּ
  choice: tu as étendu au loin
  rationale: Le verbe signifie littéralement « rendre éloigné ». Avec les limites du pays comme complément, il décrit naturellement leur extension vers le lointain.
- source_word: כָּל קַצְוֵי אָרֶץ
  choice: toutes les frontières du pays
  rationale: קצה peut désigner une extrémité, une limite ou une frontière, et ארץ peut signifier « pays » ou « terre ». Le parallèle avec l’agrandissement de la nation favorise ici l’image territoriale des frontières du pays.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat associe l’accroissement de la nation à l’éloignement de ses limites, ce qui favorise un sens territorial. Le sens plus vaste « terre » demeure possible et est signalé en note.
- issue: Nuance de נִכְבָּדְתָּ
  choice: tu as été glorifié
  alternative: tu t’es couvert de gloire / tu as manifesté ta gloire
  rationale: La forme hébraïque permet plusieurs nuances passives, résultatives ou réfléchies. Le passif français conserve au mieux cette ouverture sans attribuer explicitement l’action à Dieu lui-même ni à un agent extérieur.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La répétition de « tu as agrandi la nation » est conservée pour respecter l’insistance poétique de l’hébreu. Le tutoiement correspond à l’adresse directe à Dieu et « au loin » restitue la valeur concrète de רחק.
