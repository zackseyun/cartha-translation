    text: Ou « la cité exaltée » ou « la cité située en hauteur ». L’hébreu ne précise pas de quelle cité il s’agit.
    reason: Alternative lexicale et maintien de l’indétermination du référent.
  revision_rationale: La révision corrige la valeur aspectuelle du participe hébreu et resserre la dernière image sur le sens de « jusqu’à ». Elle conserve l’ordre, la répétition poétique, le référent non identifié et le registre de la traduction.
