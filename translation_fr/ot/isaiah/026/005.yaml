review_pass:
  verdict: revise
  source_fidelity: 'La structure et l’imagerie du texte hébreu sont bien rendues : l’abaissement de la cité est répété avec insistance et conduit « jusqu’à la poussière ». Toutefois, le participe יֹשְׁבֵי appelle en français un présent/générique (« ceux qui habitent ») plutôt qu’un imparfait narratif (« habitaient »). « Jusque dans la poussière » ajoute légèrement l’idée d’entrer dans la poussière ; « jusqu’à la poussière » correspond plus directement au mouvement exprimé par עַד עָפָר.'
  naturalness: Le registre est moderne, poétique et naturel. La répétition « il l’abaisse, il l’abaisse » fonctionne bien. La ponctuation révisée rend plus clairement les deux dernières propositions parallèles.
  terminology: « Cité élevée » rend sobrement קִרְיָה נִשְׂגָּבָה et préserve l’absence d’identification. La note est améliorée afin d’offrir des équivalents français plus idiomatiques que « haut placée », qui peut évoquer un rang social ou politique plutôt qu’une situation élevée.
  issues:
  - severity: low
    issue: Temps de « habitaient »
    rationale: Le participe hébreu « ceux qui habitent » décrit les habitants de la hauteur/cité sans marquer un passé. Le présent conserve mieux cette valeur.
  - severity: low
    issue: « jusque dans la poussière »
    rationale: La préposition « dans » renforce l’image au-delà de עַד (« jusqu’à »). « Jusqu’à la poussière » maintient plus exactement l’ambiguïté et le parallélisme.
  - severity: low
    issue: Formulation de l’alternative en note
    rationale: « Haut placée » est moins naturel et peut suggérer une position hiérarchique. « Exaltée » et « située en hauteur » rendent plus clairement les possibilités lexicales sans imposer d’interprétation.
  revised_text: Car il a abaissé ceux qui habitent les hauteurs, la cité élevée[a] ; il l’abaisse, il l’abaisse jusqu’à terre ; il la fait descendre jusqu’à la poussière.
  revised_footnotes:
