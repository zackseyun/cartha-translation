source:
  edition: WLC
  text: כִּ֤י הֵשַׁח֙ יֹשְׁבֵ֣י מָר֔וֹם קִרְיָ֖ה נִשְׂגָּבָ֑ה יַשְׁפִּילֶ֤/נָּה יַשְׁפִּילָ/הּ֙ עַד אֶ֔רֶץ יַגִּיעֶ֖/נָּה עַד עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/005.yaml
  text: For he has brought down those who dwell on high[a], the lofty city; he lays it low, he lays it low to the earth; he brings it down to the dust.
translation:
  language: fr
  text: Car il a abaissé ceux qui habitent les hauteurs, la cité élevée[a] ; il l’abaisse, il l’abaisse jusqu’à terre ; il la fait descendre jusqu’à la poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cité exaltée » ou « la cité située en hauteur ». L’hébreu ne précise pas de quelle cité il s’agit.
    reason: Alternative lexicale et maintien de l’indétermination du référent.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison de la louange exprimée dans le contexte ; « Car » rend naturellement cette valeur explicative.
- source_word: הֵשַׁח
  choice: a abaissé
  rationale: Le hiphil de שׁחח exprime le fait de rendre bas ou d’humilier. « A abaissé » conserve à la fois l’image verticale et la portée de jugement.
- source_word: יֹשְׁבֵי מָרוֹם
  choice: ceux qui habitaient sur les hauteurs
  rationale: Cette formulation préserve le sens spatial ainsi que la possible connotation d’orgueil ou de sécurité, sans trancher entre eux.
- source_word: קִרְיָה נִשְׂגָּבָה
  choice: la cité élevée
  rationale: « Cité » convient au registre poétique de קִרְיָה, et « élevée » rend נִשְׂגָּבָה sans identifier ni caractériser davantage la ville.
- source_word: יַשְׁפִּילֶנָּה יַשְׁפִּילָהּ
  choice: il l’abaisse, il l’abaisse
  rationale: La répétition du verbe est conservée pour respecter l’insistance et l’intensification poétiques de l’hébreu.
- source_word: עַד אֶרֶץ
  choice: jusqu’à terre
  rationale: Dans le parallélisme avec « poussière », אֶרֶץ désigne ici le sol ; l’expression française est naturelle et garde le mouvement d’abaissement.
- source_word: יַגִּיעֶנָּה
  choice: il la fait descendre
  rationale: Le hiphil de נגע signifie littéralement « faire atteindre/toucher ». Dans ce contexte, cette formulation exprime clairement que la cité est menée jusqu’à la poussière.
- source_word: עַד עָפָר
  choice: jusque dans la poussière
  rationale: « Poussière » conserve l’image biblique d’humiliation extrême et complète le parallélisme avec « jusqu’à terre ».
theological_decisions:
- issue: Identification de la « cité élevée »
  choice: Maintenir une désignation générique sans nommer la cité
  alternative: L’identifier à Babylone, à une puissance historique précise ou à l’orgueil humain en général
  rationale: Le texte hébreu ne donne aucun nom. La traduction conserve donc cette indétermination et laisse ouverte l’identification interprétative.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition hébraïque est maintenue. « Cité » soutient le registre poétique, tandis que la syntaxe reste accessible.
