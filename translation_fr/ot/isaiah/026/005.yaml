revisions:
- from: Car il a abaissé ceux qui habitaient sur les hauteurs, la cité élevée[a] ; il l’abaisse, il l’abaisse jusqu’à terre ; il la fait descendre jusque dans la poussière.
  to: Car il a abaissé ceux qui habitent les hauteurs, la cité élevée[a] ; il l’abaisse, il l’abaisse jusqu’à terre ; il la fait descendre jusqu’à la poussière.
  rationale: La révision corrige la valeur aspectuelle du participe hébreu et resserre la dernière image sur le sens de « jusqu’à ». Elle conserve l’ordre, la répétition poétique, le référent non identifié et le registre de la traduction.
