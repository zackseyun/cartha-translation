  text: יְהוָ֖ה בַּ/צַּ֣ר פְּקָד֑וּ/ךָ צָק֣וּ/ן לַ֔חַשׁ מוּסָרְ/ךָ֖ לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/016.yaml
  text: O Yahweh[a], in distress they sought you[c][b]; they poured out a whispered prayer when your discipline was upon them.
translation:
  language: fr
  text: Yahweh, dans la détresse, ils se sont tournés vers toi[a] ; ils ont répandu une prière murmurée[b] lorsque ta discipline[c] pesait sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils t’ont cherché », « ils ont fait appel à toi » ou, plus littéralement, « ils t’ont visité ». Le verbe hébreu peut exprimer le fait de s’occuper de quelqu’un, de se tourner vers lui ou de le rechercher.
    reason: lexical_alternative
  - marker: b
    text: Plus littéralement, « ils ont répandu un murmure ». L’expression hébraïque, très concise, peut désigner une supplication prononcée à voix basse.
    reason: lexical_alternative
  - marker: c
    text: « Ta discipline » peut aussi se traduire par « ta correction » ou « ton instruction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בַּצַּר
  choice: dans la détresse
  rationale: צַר désigne ici une situation d’angoisse ou d’adversité, non un lieu matériellement étroit.
- source_word: פְּקָדוּךָ
  choice: ils se sont tournés vers toi
  rationale: Dans ce contexte de détresse et de supplication, פקד exprime l’attention portée à Dieu ou le recours à lui. La formulation française reste naturelle tout en signalant en note la polysémie du verbe.
- source_word: צָקוּן
  choice: ils ont répandu
  rationale: Le verbe évoque l’action de verser ou d’épancher et s’emploie ici métaphoriquement pour une parole adressée à Dieu.
- source_word: לַחַשׁ
  choice: une prière murmurée
  rationale: לַחַשׁ désigne une parole dite à voix basse, un murmure. Le contexte de recours à Yahweh justifie « prière », sans effacer les autres possibilités, données en note.
- source_word: מוּסָרְךָ
  choice: ta discipline
  rationale: מוּסָר associe correction et instruction. « Discipline » conserve cette double orientation mieux qu’un terme exclusivement punitif.
- source_word: לָמוֹ
  choice: sur eux
  rationale: La préposition avec suffixe est comprise comme indiquant que la discipline divine pesait ou s’exerçait sur eux.
theological_decisions:
- issue: Nature de מוּסָר attribuée à Dieu
  choice: ta discipline
  alternative: ta correction ; ton instruction
  rationale: « Discipline » maintient la dimension corrective et éducative sans réduire l’action divine à un châtiment pur ni à un simple enseignement.
- issue: Nature de לַחַשׁ
  choice: une prière murmurée
  alternative: un murmure ; une parole chuchotée
  rationale: Le contexte indique une parole tournée vers Yahweh, mais la note préserve la concision et l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’adresse directe à Yahweh et le parallélisme entre la détresse, le recours à Dieu et la discipline. Les notes rendent visibles les principales ambiguïtés lexicales sans alourdir le texte.
