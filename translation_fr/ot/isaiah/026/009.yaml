source:
  edition: WLC
  text: נַפְשִׁ֤/י אִוִּיתִ֨י/ךָ֙ בַּ/לַּ֔יְלָה אַף רוּחִ֥/י בְ/קִרְבִּ֖/י אֲשַֽׁחֲרֶ֑/ךָּ כִּ֞י כַּ/אֲשֶׁ֤ר מִשְׁפָּטֶ֨י/ךָ֙ לָ/אָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
translation:
  language: fr
  text: La nuit, mon âme t’a désiré ; oui, mon esprit en moi te cherche dès l’aube.[a] Car, lorsque tes jugements sont sur la terre,[b] les habitants du monde apprennent la justice.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te cherche avec ardeur ». Le verbe hébreu évoque une recherche entreprise de bonne heure, dès l’aube, et peut par extension exprimer une quête ardente.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tes jugements sont dans la terre » ou « sur la terre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou « la droiture » : le terme hébreu peut désigner ce qui est juste, droit ou conforme à la justice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Mon âme
  rationale: Le terme désigne ici l’être intérieur et son désir. « Mon âme » conserve le parallélisme poétique avec « mon esprit » sans réduire l’expression à un simple « je ».
- source_word: אִוִּיתִיךָ
  choice: te désire
  rationale: Le verbe exprime un désir profond ou une aspiration. Le présent français convient au mouvement poétique et à l’état qui se prolonge dans le contexte.
- source_word: בַּלַּיְלָה
  choice: pendant la nuit
  rationale: Cette formulation rend naturellement la valeur temporelle de la préposition et conserve le cadre nocturne.
- source_word: אַף
  choice: oui
  rationale: « Oui » restitue avec naturel la force à la fois additive et emphatique de la particule dans le second membre du parallélisme.
- source_word: רוּחִי בְקִרְבִּי
  choice: mon esprit, au-dedans de moi
  rationale: La traduction préserve l’insistance de l’hébreu sur l’intériorité du locuteur et le parallélisme avec « mon âme ».
- source_word: אֲשַׁחֲרֶךָּ
  choice: te cherche dès l’aube
  rationale: Le verbe évoque étymologiquement la recherche matinale et peut aussi exprimer une quête ardente. « Dès l’aube » maintient l’image temporelle en contraste avec la nuit, tandis que l’autre nuance est signalée en note.
- source_word: כִּי כַּאֲשֶׁר
  choice: Car, lorsque
  rationale: La combinaison introduit à la fois la raison de ce qui précède et la circonstance temporelle dans laquelle les habitants apprennent la justice.
- source_word: מִשְׁפָּטֶיךָ לָאָרֶץ
  choice: tes jugements s’exercent sur la terre
  rationale: L’hébreu est elliptique, littéralement « tes jugements à/dans la terre ». « S’exercent sur la terre » donne en français un sens naturel de manifestation effective sans imposer l’idée supplémentaire d’une arrivée.
- source_word: צֶדֶק
  choice: la justice
  rationale: En français, « justice » désigne naturellement ici ce qui est juste et conforme à l’ordre moral révélé par les jugements de Dieu. « Droiture » demeure une possibilité et est conservée en note.
- source_word: לָמְדוּ
  choice: apprennent
  rationale: Le présent rend naturellement la portée générale ou gnomique de la forme accomplie dans cette proposition.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: les habitants du monde
  rationale: Cette expression idiomatique conserve la portée universelle du syntagme hébreu désignant les humains qui peuplent le monde habité.
theological_decisions:
- issue: Sens de צֶדֶק dans le contexte des jugements divins
  choice: la justice
  alternative: la droiture
  rationale: Le mot hébreu recouvre la justice, la rectitude et la conformité à ce qui est droit. « Justice » s’accorde naturellement avec « jugements » en français, sans limiter le terme au seul domaine judiciaire ; la note préserve la nuance morale de « droiture ».
- issue: Nature des jugements divins sur la terre
  choice: s’exercent sur la terre
  alternative: sont sur la terre
  rationale: Le texte hébreu laisse elliptique le rapport exact entre les jugements et la terre. La traduction indique leur présence effective sans préciser s’il s’agit de sentences, d’actes judiciaires ou d’un ordre juste, et la note donne la formulation littérale.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « mon âme / mon esprit » et la progression « nuit / aube » sont conservés. La ponctuation rend lisibles les membres poétiques sans archaïsme.
