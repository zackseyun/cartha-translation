  variant: modern international French
source:
  edition: WLC
  text: לֵ֤ךְ עַמִּ/י֙ בֹּ֣א בַ/חֲדָרֶ֔י/ךָ וּֽ/סְגֹ֥ר דלתי/ך בַּעֲדֶ֑/ךָ חֲבִ֥י כִ/מְעַט רֶ֖גַע עַד יעבור זָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
translation:
  language: fr
  text: Va, mon peuple, entre dans tes chambres[a] et ferme tes portes derrière toi. Cache-toi[b] un bref instant, jusqu’à ce que la colère[c] soit passée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tes pièces retirées ». Le terme hébreu peut désigner des pièces intérieures ou privées.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu s’adresse au peuple comme à une seule personne. Les impératifs précédents sont au masculin singulier, tandis que « cache-toi » correspond ici à une forme féminine singulière; le français ne marque pas cette différence de genre.
    reason: grammatical_clarification
  - marker: c
    text: Ou « l’indignation ». L’hébreu ne précise pas explicitement de qui elle vient.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵךְ
  choice: Va
  rationale: Impératif qal masculin singulier de הלך. « Va » rend directement l’appel et convient à la suite d’impératifs.
- source_word: עַמִּי
  choice: mon peuple
  rationale: עם avec suffixe de première personne du singulier forme ici l’adresse prophétique personnelle et collective « mon peuple ».
- source_word: בֹּא
  choice: entre
  rationale: L’impératif de בוא exprime l’entrée dans un espace fermé ; « entre » est naturel en français avec « dans tes chambres ».
- source_word: בַחֲדָרֶיךָ
  choice: dans tes chambres
  rationale: חדר désigne une pièce, souvent intérieure ou retirée. « Chambres » conserve l’idée d’espaces privés sans imposer qu’il s’agisse uniquement de chambres à coucher.
- source_word: וּסְגֹר דלתיך
  choice: et ferme tes portes
  rationale: סגר signifie fermer, et דלתיך est un pluriel avec suffixe de deuxième personne du singulier.
- source_word: בַּעֲדֶךָ
  choice: derrière toi
  rationale: Avec le verbe « fermer », בעדך indique que les portes doivent être closes derrière la personne, formulation idiomatique en français.
- source_word: חֲבִי
  choice: Cache-toi
  rationale: L’impératif singulier s’accorde naturellement en français avec le collectif singulier « mon peuple », sans transformer l’adresse en pluriel.
- source_word: כִמְעַט רֶגַע
  choice: un bref instant
  rationale: L’expression associe l’idée de petitesse à celle d’un instant et désigne une très courte durée ; « un bref instant » est concis et naturel.
- source_word: עַד יַעֲבוֹר
  choice: jusqu’à ce que … soit passée
  rationale: עד suivi de l’imparfait de עבר marque le terme de la période de refuge. Le passé du subjonctif exprime en français l’achèvement attendu.
- source_word: זָעַם
  choice: la colère
  rationale: זעם désigne une colère intense ou l’indignation, souvent dans un contexte de jugement. « Colère » est clair, digne et laisse son détenteur implicite comme en hébreu.
theological_decisions:
- issue: Référent et portée de זָעַם
  choice: la colère
  alternative: l’indignation
  rationale: L’hébreu ne précise pas explicitement de qui vient cette colère. La traduction n’ajoute donc ni « de Dieu » ni « du Seigneur », tout en conservant la gravité judiciaire suggérée par le contexte prophétique.
- issue: Nombre grammatical dans l’adresse au peuple
  choice: 'Impératifs et pronoms au singulier : « Va », « tes », « toi », « Cache-toi »'
  alternative: Employer le pluriel pour expliciter la collectivité du peuple
  rationale: Le texte hébreu s’adresse au peuple comme à une entité collective au moyen de formes singulières. Le français permet de préserver exactement cette personnification collective.
translation_notes:
  register: Français international moderne, sobre et solennel. Les impératifs brefs conservent l’urgence du texte. Le tutoiement singulier maintient l’adresse personnifiée à « mon peuple », et le référent de la colère reste volontairement implicite.
