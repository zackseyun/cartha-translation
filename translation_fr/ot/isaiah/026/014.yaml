  source_fidelity: 'Le texte français rend fidèlement les parallélismes hébreux : מֵתִים (« les morts »), רְפָאִים dans son sens de défunts du monde souterrain (« les ombres »), et les inaccomplis négatifs avec une valeur de non-retour (« ne vivront pas », « ne se relèveront pas »). « C’est pourquoi » rend bien לָכֵן. La série des parfaits divins est correctement rendue par des passés composés. « Tu leur as demandé des comptes » est une option judicieuse pour פקד dans ce contexte de jugement, sans prétendre épuiser la polysémie du verbe. « Tu as fait disparaître tout souvenir d’eux » restitue naturellement le causatif et l’effacement total de la mémoire.'
