id: ISA.26.14
reference: Isaiah 26:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
translation:
  language: fr
  text: Les morts ne vivront pas ; les ombres[a] ne se relèveront pas. C’est pourquoi tu leur as demandé des comptes[b] et tu les as détruits ; tu as fait disparaître tout souvenir d’eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les esprits des défunts ». Ici, le mot hébreu désigne les morts du séjour des morts, et non l’ancien peuple appelé les Rephaïm.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu es intervenu contre eux » ou « tu les as punis ». Le verbe hébreu peut désigner une intervention favorable ou un jugement ; ici, le contexte indique un jugement.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tu as fait périr tout souvenir d’eux ».'
    reason: literal_rendering
lexical_decisions:
- source_word: מֵתִים
  choice: les morts
  rationale: Le terme est employé substantivement au pluriel. « Les morts » est naturel en français et conserve son sens collectif.
- source_word: בַּל יִחְיוּ
  choice: ne vivront pas
  rationale: La négation poétique בַּל avec l’inaccompli peut exprimer ici une impossibilité ou un avenir refusé. Le futur français convient au contexte sans ajouter explicitement l’idée de « revivre », absente du verbe lui-même.
- source_word: רְפָאִים
  choice: les ombres
  rationale: En parallèle avec « les morts », רְפָאִים désigne ici les défunts du séjour des morts, non l’ancien peuple des Rephaïm. « Les ombres » garde l’image poétique sans employer « fantômes », trop concret en français courant.
- source_word: בַּל יָקֻמוּ
  choice: ne se relèveront pas
  rationale: קום signifie se lever ou se relever. Cette formulation naturelle maintient la possible résonance d’un relèvement après la mort sans la préciser davantage.
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Cette locution marque clairement le rapport de conséquence exprimé par לָכֵן et reste naturelle dans un registre soutenu mais accessible.
- source_word: פָּקַדְתָּ
  choice: tu leur as demandé des comptes
  rationale: פקד possède un champ sémantique large, notamment intervenir, visiter ou demander des comptes. Dans ce contexte de jugement suivi de destruction, cette expression rend la valeur punitive sans réduire le verbe à son seul effet final.
- source_word: וַתַּשְׁמִידֵם
  choice: tu les as détruits
  rationale: שׁמד exprime une destruction forte. « Détruits » rend cette force sans introduire une thèse philosophique sur l’anéantissement absolu.
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  choice: tu as fait disparaître tout souvenir d’eux
  rationale: La tournure française restitue le causatif et l’idée d’effacement total du souvenir, tout en demeurant claire et idiomatique.
theological_decisions:
- issue: Sens de רְפָאִים dans ce verset
  choice: les défunts du séjour des morts, décrits comme « les ombres »
  alternative: les Rephaïm, ancien peuple ou groupe humain
  rationale: Le parallélisme avec « les morts » et avec les verbes « vivre » et « se relever » indique que le mot désigne ici des morts, non un groupe ethnique.
- issue: Portée de « ne se relèveront pas »
  choice: affirmation poétique de la chute sans retour des maîtres hostiles jugés dans ce passage
  alternative: négation universelle de toute résurrection
  rationale: Le contexte vise des personnages ou puissances déterminés soumis au jugement. La traduction conserve l’énoncé catégorique du verset sans en faire une déclaration doctrinale universelle.
- issue: Valeur judiciaire de פקד
  choice: demander des comptes
  alternative: visiter, intervenir en faveur de, punir
  rationale: Le verbe peut décrire une intervention favorable ou défavorable. Les verbes de destruction qui suivent imposent ici une orientation judiciaire, mais la formulation retenue conserve une part de sa largeur sémantique.
translation_notes:
  register: Français international moderne, digne et poétique, avec des phrases immédiatement compréhensibles. Le futur rend naturellement les inaccomplis hébreux, tandis que « ombres » conserve l’imagerie du séjour des morts. Les notes signalent les principales ambiguïtés lexicales sans surcharger le texte.
