id: ISA.26.18
reference: Isaiah 26:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
translation:
  language: fr
  text: Nous avons conçu[a], nous avons connu les douleurs de l’accouchement ; pour ainsi dire, nous avons enfanté du vent[b]. Nous n’avons accompli aucune délivrance sur la terre[c], et les habitants du monde ne sont pas venus au jour[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous sommes devenus enceintes ».'
    reason: lexical_alternative
  - marker: b
    text: Le même mot hébreu peut aussi signifier « souffle » ou « esprit ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans le pays » ou « pour le pays ».'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « ne tombent pas ». Dans le contexte de l’accouchement, le verbe peut évoquer ici la venue au monde.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  choice: nous avons conçu
  rationale: Le verbe הרה désigne le fait de concevoir ou de devenir enceinte. « Nous avons conçu » maintient l’image de la grossesse tout en restant naturel avec un sujet collectif en français.
- source_word: חַ֔לְנוּ
  choice: nous avons connu les douleurs de l’accouchement
  rationale: Dans ce contexte, חול/חיל évoque les douleurs et les contractions de l’enfantement. Cette formulation moderne conserve l’intensité de l’image.
- source_word: כְּמוֹ
  choice: pour ainsi dire
  rationale: כמו introduit ici une comparaison ou une qualification. « Pour ainsi dire » rend le caractère figuré et presque ironique de l’enfantement qui ne produit que du vent.
- source_word: יָלַדְנוּ
  choice: nous avons enfanté
  rationale: ילד est le verbe ordinaire de l’enfantement. « Enfanter » convient au registre poétique et prolonge clairement la métaphore.
- source_word: רוּחַ
  choice: du vent
  rationale: רוּחַ peut signifier « vent », « souffle » ou « esprit ». Dans cette lamentation sur un effort stérile, « vent » exprime le mieux l’inconsistance du résultat sans introduire une lecture pneumatologique.
- source_word: יְשׁוּעֹת
  choice: aucune délivrance
  rationale: Le pluriel hébreu peut désigner des actes de salut ou de délivrance. Le singulier collectif français après « aucune » transmet naturellement l’idée d’une délivrance qui n’a pas été réalisée.
- source_word: נַעֲשֶׂה אֶרֶץ
  choice: nous n’avons accompli aucune délivrance sur la terre
  rationale: Avec un nom abstrait, עשה peut signifier accomplir ou produire. « Sur la terre » conserve la portée possible de אֶרֶץ et son parallélisme avec « le monde ».
- source_word: יִפְּלוּ
  choice: ne sont pas venus au jour
  rationale: Le sens habituel de נפל est « tomber », mais, dans la continuité de l’image de l’accouchement, le verbe est vraisemblablement employé ici pour la venue au monde. La traduction principale rend cette cohérence imagée, tandis que le sens lexical ordinaire est signalé en note.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: les habitants du monde
  rationale: Cette expression courante désigne ceux qui peuplent le monde. Elle distingue תֵבֵל de אֶרֶץ tout en préservant le parallélisme poétique.
theological_decisions:
- issue: Sens de רוּחַ dans la métaphore de l’accouchement
  choice: vent
  alternative: souffle ; esprit
  rationale: 'Le contexte décrit la stérilité des efforts du peuple : la grossesse et les douleurs n’aboutissent qu’au vent, puis aucune délivrance n’est accomplie. « Esprit » pourrait suggérer indûment une lecture positive ou pneumatologique.'
- issue: Interprétation de יִפְּלוּ dans la dernière proposition
  choice: ne sont pas venus au jour
  alternative: ne sont pas tombés
  rationale: Le sens « venir au jour » prolonge naturellement le tableau de la conception, des douleurs et de l’enfantement. Cependant, comme נפל signifie normalement « tomber », cette ambiguïté réelle est conservée dans une note plutôt que passée sous silence.
- issue: Portée de אֶרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le parallélisme avec תֵבֵל, « le monde », favorise ici la portée large de « terre », sans exclure entièrement la lecture plus locale « pays ».
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible, tandis que « pour ainsi dire » conserve la qualification introduite par כְּמוֹ. Les notes rendent visibles les principales ambiguïtés lexicales sans alourdir le texte principal.
