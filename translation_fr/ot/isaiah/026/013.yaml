review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : YHWH est directement invoqué comme « notre Dieu », des seigneurs autres que lui ont exercé une domination, et le peuple mentionne son nom exclusivement en relation avec lui. L’identité des « seigneurs » demeure à juste titre non précisée. La préposition ב dans בך לבד est réellement souple et l’alternative doit être conservée.'
  naturalness: '« Ont dominé sur nous » n’est pas idiomatique en français moderne : on domine quelqu’un, ou l’on exerce sa domination sur quelqu’un. De plus, « par toi seul nous faisons mention » est grammaticalement possible mais peu naturel et peut donner artificiellement à Dieu le rôle de moyen instrumental. Une formulation avec « en toi seul » est plus fluide tout en restant fidèle à une lecture possible de ב.'
  terminology: « Éternel » est une désignation française traditionnelle et recevable de YHWH dans ce registre. « Dieu », « seigneurs » et « ton nom » sont appropriés. « Faire mention de » est un registre légèrement soutenu mais naturel dans un texte poétique et rend adéquatement le hiphil de זכר.
  issues:
  - severity: medium
    issue: Tour idiomatique « ont dominé sur nous »
    rationale: En français standard moderne, « dominer sur » n’est pas le tour attendu avec un complément personnel. « Ont exercé leur domination sur nous » rend la domination exprimée par בעל sans modifier le sens.
  - severity: low
    issue: Lecture principale et fluidité de « par toi seul »
    rationale: La lecture instrumentale de ב est possible, mais « par toi seul nous faisons mention » est raide en français et s’interprète moins naturellement. « C’est en toi seul que… » exprime clairement la lecture de sphère/attachement; la lecture instrumentale reste signalée en note.
