revisions:
- from: Éternel, notre Dieu, d’autres seigneurs que toi ont dominé sur nous ; mais par toi seul nous faisons mention de ton nom.[a]
  to: Éternel, notre Dieu, des seigneurs autres que toi ont exercé leur domination sur nous ; c’est en toi seul que nous faisons mention de ton nom.[a]
  rationale: La révision corrige le tour français non idiomatique concernant la domination et adopte pour le texte principal une formulation plus naturelle de la lecture « en toi seul ». Elle maintient l’ambiguïté sémantique de ב dans une note explicitement ancrée, sans identifier les seigneurs ni développer le sens théologique du « nom ».
  reviewer_model: gpt-5.6-terra
