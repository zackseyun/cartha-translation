  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּעָל֥וּ/נוּ אֲדֹנִ֖ים זֽוּלָתֶ֑/ךָ לְ/בַד בְּ/ךָ֖ נַזְכִּ֥יר שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
translation:
  language: fr
  text: Éternel, notre Dieu, des seigneurs autres que toi ont exercé leur domination sur nous ; c’est en toi seul que nous faisons mention de ton nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « c’est par toi seul que nous faisons mention de ton nom ». La préposition hébraïque traduite par « en » peut aussi exprimer le moyen et être rendue par « par ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Éternel
  rationale: Rend le nom divin dans une forme française traditionnelle, digne et directement adressée, sans ajouter une interjection absente de l’hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Dans l’adresse à YHWH, le pluriel morphologique désigne le Dieu unique ; le suffixe de première personne du pluriel donne « notre ».
- source_word: בְּעָלוּנוּ
  choice: ont dominé sur nous
  rationale: Le verbe exprime l’exercice d’une maîtrise ou d’une seigneurie ; cette formulation garde la nuance de domination et le lien lexical avec « seigneurs ».
- source_word: אֲדֹנִים
  choice: seigneurs
  rationale: Le pluriel reste ouvert à des maîtres humains, étrangers ou éventuellement à des puissances rivales, sans préciser leur identité.
- source_word: זוּלָתֶךָ
  choice: d’autres … que toi
  rationale: 'Cette tournure française exprime naturellement l’exclusion ou le contraste : des seigneurs autres que YHWH.'
- source_word: לְבַד
  choice: seul
  rationale: Marque l’exclusivité et porte ici sur « par toi ».
- source_word: בְּךָ
  choice: par toi
  rationale: La préposition ב peut exprimer le moyen ou la sphère. « Par toi » offre une lecture concise, tout en laissant l’autre nuance en note.
- source_word: נַזְכִּיר
  choice: nous faisons mention de
  rationale: Le hiphil de זכר signifie couramment faire se souvenir, mentionner ou commémorer. Cette traduction formelle conserve l’acte explicite d’évoquer le nom.
- source_word: שְׁמֶךָ
  choice: ton nom
  rationale: Rendu direct qui préserve sans l’expliciter la portée cultuelle et relationnelle du « nom ».
theological_decisions:
- issue: Contraste entre YHWH et les « autres seigneurs »
  choice: Conserver « seigneurs » sans identifier ces figures.
  alternative: Les comprendre explicitement comme des souverains humains, ou comme des idoles et faux dieux personnifiés.
  rationale: Le verbe convient particulièrement à des maîtres politiques, mais le texte n’impose pas une identification exclusive. La traduction maintient cette ouverture.
- issue: Valeur de בך לבד
  choice: « par toi seul » dans le texte principal
  alternative: « en toi seul »
  rationale: La préposition ב peut indiquer le moyen ou la sphère. Le texte principal retient une formulation française lisible, tandis que la note préserve l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde le parallélisme et la tension du texte hébreu. « Faire mention de » est légèrement soutenu, mais reste intelligible et reproduit plus précisément le verbe hébreu qu’une paraphrase comme « proclamer ».
