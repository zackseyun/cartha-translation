id: ISA.26.12
reference: Isaiah 26:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
translation:
  language: fr
  text: Yahvé, tu établiras pour nous la paix[a], car c’est bien toi qui as accompli pour nous toutes nos œuvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « paix » peut aussi évoquer le bien-être, l’intégrité ou la plénitude.
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « tu as accompli en nous toutes nos œuvres ». Toutefois, « pour nous » rend plus directement la préposition hébraïque.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom propre de l’alliance est rendu directement par sa forme française courante « Yahvé ». L’adresse directe est naturelle sans ajouter « ô », qui n’est pas explicitement marqué en hébreu.
- source_word: תִּשְׁפֹּת
  choice: tu établiras
  rationale: Le verbe exprime ici l’action de fixer ou d’instaurer. « Établiras » reste naturel en français et conserve la valeur d’assurance future.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: « Paix » est l’équivalent principal dans ce contexte, tout en laissant signaler en note le champ plus large de bien-être et de plénitude.
- source_word: לָנוּ
  choice: pour nous
  rationale: Avec « établir la paix », la préposition ל indique naturellement le bénéficiaire.
- source_word: כִּי גַּם
  choice: car c’est bien
  rationale: « Car » exprime le rapport explicatif, tandis que « c’est bien toi » restitue l’emphase portée par גַּם sans alourdir la phrase.
- source_word: כָּל מַעֲשֵׂינוּ
  choice: toutes nos œuvres
  rationale: Cette formulation conserve le lien lexical avec les actes ou réalisations du peuple et, surtout, la tension entre leur attribution au peuple et l’action décisive de Dieu.
- source_word: פָּעַלְתָּ
  choice: tu as accompli
  rationale: Le verbe désigne l’action d’effectuer ou de mener à réalisation. « Accompli » rend clairement l’action divine achevée.
- source_word: לָּנוּ
  choice: pour nous
  rationale: La préposition indique le plus directement que Dieu agit en faveur du peuple. La possibilité interprétative « en nous » est conservée en note.
theological_decisions:
- issue: L’action de Dieu dans « toutes nos œuvres »
  choice: Dieu est présenté comme celui qui a accompli pour son peuple les œuvres pourtant appelées « nos œuvres ».
  alternative: « Tu as accompli en nous toutes nos œuvres » ; ou Dieu a fait réussir les entreprises du peuple.
  rationale: Le texte hébreu maintient une tension réelle entre les œuvres attribuées au peuple et leur accomplissement par Dieu. La traduction ne transforme pas cette tension en formule doctrinale plus précise. « Pour nous » représente plus directement לָנוּ, tandis que « en nous » demeure une possibilité interprétative signalée en note.
translation_notes:
  register: 'Français international moderne, sobre et digne. La formulation « toutes nos œuvres » garde volontairement le paradoxe du texte : ces œuvres sont celles du peuple, mais leur accomplissement est attribué à Dieu.'
