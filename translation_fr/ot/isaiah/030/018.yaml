source:
  edition: WLC
  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
translation:
  language: fr
  text: C’est pourquoi Yahweh attend pour vous faire grâce, et c’est pourquoi il se lèvera[a] pour avoir compassion de vous ; car Yahweh est un Dieu de justice. Heureux tous ceux qui l’attendent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il sera élevé pour avoir compassion de vous » ou « il s’élèvera pour avoir compassion de vous ».'
    reason: Le verbe hébreu יָרוּם peut désigner le fait de se lever, d’être élevé ou de s’élever.
lexical_decisions:
- source_word: וְלָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement en français la transition inférentielle répétée et conserve son effet rhétorique.
- source_word: יְחַכֶּה
  choice: attend
  rationale: Conserve le sens premier de חכה ainsi que la tension d’une grâce différée, sans renforcer indûment l’idée de désir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לַחֲנַנְכֶם
  choice: pour vous faire grâce
  rationale: Exprime l’action favorable de חנן et la distingue de רחם dans le membre parallèle.
- source_word: יָרוּם
  choice: il se lèvera
  rationale: Le qal de רום peut évoquer le fait de s’élever ou de se lever. Dans le parallélisme, cette formulation suggère une mise en mouvement en vue d’agir, tout en laissant l’autre lecture en note.
- source_word: לְרַחֶמְכֶם
  choice: pour avoir compassion de vous
  rationale: Rend רחם par un français naturel et maintient une distinction lexicale avec « faire grâce ».
- source_word: כִּי
  choice: car
  rationale: Introduit avec concision le fondement explicatif de l’affirmation précédente.
- source_word: אֱלֹהֵי מִשְׁפָּט
  choice: un Dieu de justice
  rationale: La construction qualifie le caractère de Yahweh ; « justice » convient ici à son gouvernement juste mieux que « jugement ».
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Formule française courante des béatitudes et des déclarations sapientielles, exprimant une condition favorable qui dépasse une émotion passagère.
- source_word: כָּל חוֹכֵי לוֹ
  choice: tous ceux qui l’attendent
  rationale: Préserve la portée universelle, l’orientation vers Dieu et surtout l’écho littéraire avec l’attente de Yahweh au début du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve ici le nom personnel plutôt que de le remplacer par un titre.
- issue: Sens de יָרוּם dans son contexte
  choice: il se lèvera
  alternative: il sera élevé ; il s’élèvera
  rationale: Le verbe peut décrire soit un mouvement vers l’action, soit l’élévation. Le parallélisme avec l’attente suivie de l’infinitif exprimant la compassion favorise « se lèvera », mais l’ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition de l’idée d’attendre sont conservés. Le futur « se lèvera » suit naturellement en français la perspective ouverte par « attend », sans effacer l’ambiguïté lexicale signalée en note.
