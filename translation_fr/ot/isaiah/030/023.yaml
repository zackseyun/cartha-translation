  terminology: « Semence », « sol », « pain », « bétail » et « pâturage » préservent le registre agricole. « Riche et abondant » rend de façon idiomatique les adjectifs דָשֵׁן וְשָׁמֵן; la note conserve l’expression littérale et sa valeur figurée.
