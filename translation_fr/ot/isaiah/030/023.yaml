  text: וְ/נָתַן֩ מְטַ֨ר זַרְעֲ/ךָ֜ אֲשֶׁר תִּזְרַ֣ע אֶת הָ/אֲדָמָ֗ה וְ/לֶ֨חֶם֙ תְּבוּאַ֣ת הָֽ/אֲדָמָ֔ה וְ/הָיָ֥ה דָשֵׁ֖ן וְ/שָׁמֵ֑ן יִרְעֶ֥ה מִקְנֶ֛י/ךָ בַּ/יּ֥וֹם הַ/ה֖וּא כַּ֥ר נִרְחָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
translation:
  language: fr
  text: Il donnera de la pluie pour ta semence, celle dont tu ensemenceras le sol, et le pain issu de la récolte du sol[a] sera riche et abondant[b]. Ce jour-là, ton bétail paîtra dans un vaste pâturage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pain, produit du sol ». L’hébreu peut être compris comme une apposition.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « gras et riche », expression évoquant la fertilité et l’abondance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Il donnera
  rationale: Dans ce contexte prophétique, le parfait avec waw exprime naturellement en français une action future. Le pronom reprend le Seigneur, sujet indiqué par le contexte précédent, sans ajouter son nom au texte hébreu.
- source_word: מְטַר זַרְעֲךָ
  choice: la pluie à la semence
  rationale: Cette formulation conserve l’image agricole et rend naturellement l’idée d’une pluie accordée pour la semence.
- source_word: אֲשֶׁר תִּזְרַע אֶת הָאֲדָמָה
  choice: dont tu ensemenceras le sol
  rationale: Le français exige une légère restructuration de la construction hébraïque littérale, « avec laquelle tu sèmeras le sol ». « Ensemencer » exprime clairement l’emploi de la semence sans alourdir la phrase.
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  choice: le pain produit par le sol
  rationale: לֶחֶם est conservé dans son sens concret de « pain », tandis que la relation avec תְּבוּאַת הָאֲדָמָה est rendue naturellement. Une lecture appositionnelle reste possible et est signalée en note.
- source_word: דָשֵׁן וְשָׁמֵן
  choice: nourrissant et abondant
  rationale: Les deux adjectifs évoquent littéralement ce qui est gras et riche, image idiomatique de fertilité, de qualité et d’abondance. Cette traduction en transmet la portée agricole dans un français courant.
- source_word: יִרְעֶה מִקְנֶיךָ
  choice: ton bétail paîtra
  rationale: מִקְנֶיךָ désigne collectivement les animaux domestiques, et יִרְעֶה leur action de paître.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Formule temporelle prophétique courante, rendue de façon naturelle et reconnaissable en français.
- source_word: כַּר נִרְחָב
  choice: dans de vastes pâturages
  rationale: כַּר désigne un pâturage ou une prairie, et נִרְחָב souligne son étendue. Le pluriel français exprime idiomatiquement l’idée d’un vaste espace où paître.
theological_decisions:
- issue: Sujet implicite du premier verbe
  choice: « Il », renvoyant au Seigneur dans le contexte immédiat
  alternative: Répéter explicitement « le Seigneur »
  rationale: L’hébreu ne répète pas le sujet. Le pronom maintient cette continuité sans introduire dans le verset un nom absent du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond aux formes hébraïques. La formulation conserve l’imagerie agricole tout en évitant un littéralisme obscur.
