  yaml_path: translation/ot/isaiah/030/004.yaml
  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: fr
  text: Car ses hauts fonctionnaires sont à Tsoan, et ses envoyés atteignent Hanès.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: Le terme שׂרים désigne ici les responsables de haut rang chargés de la mission politique; « hauts fonctionnaires » est naturel en français moderne et convient au contexte diplomatique.
- source_word: מַלְאָכָיו
  choice: ses envoyés
  rationale: Dans ce contexte, מַלְאָכִים désigne des messagers ou représentants humains; « envoyés » rend clairement leur fonction diplomatique.
- source_word: יַגִּיעוּ
  choice: atteignent
  rationale: Le verbe נגע au hiphil exprime ici le fait d'arriver jusqu'à un lieu; « atteignent » conserve cette idée sans préciser indûment le moment de l'arrivée.
- source_word: צֹעַן / חָנֵס
  choice: Tsoan / Hanès
  rationale: Translittérations françaises reconnaissables des deux noms de lieux égyptiens, avec un accent sur Hanès pour guider naturellement la prononciation.
theological_decisions:
- issue: Référent du suffixe masculin singulier « ses »
  choice: Conserver « ses » sans expliciter le référent
  alternative: Remplacer par « les hauts fonctionnaires de Juda » ou « du roi »
  rationale: Le verset hébreu laisse le référent dépendre du contexte immédiat; l'expliciter ici supprimerait une part de cette dépendance contextuelle.
translation_notes:
  register: Français moderne, sobre et digne. La structure parallèle de l'hébreu est conservée, ainsi que le présent narratif des deux propositions.
source_grounding:
