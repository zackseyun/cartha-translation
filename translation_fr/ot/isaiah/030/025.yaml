id: ISA.30.25
reference: Isaiah 30:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה עַל כָּל הַ֣ר גָּבֹ֗הַ וְ/עַל֙ כָּל גִּבְעָ֣ה נִשָּׂאָ֔ה פְּלָגִ֖ים יִבְלֵי מָ֑יִם בְּ/יוֹם֙ הֶ֣רֶג רָ֔ב בִּ/נְפֹ֖ל מִגְדָּלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/025.yaml
  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
translation:
  language: fr
  text: Sur toute haute montagne et sur toute colline élevée, il y aura des ruisseaux, des cours d’eau[a], au jour du grand massacre, quand les tours tomberont.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « canaux d’eau ». Le terme hébreu est relativement rare; il peut désigner des rigoles, des ruisselets ou des cours d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: il y aura
  rationale: Rend naturellement en français la valeur existentielle future de l’idiome hébreu.
- source_word: הַר גָּבֹהַ
  choice: haute montagne
  rationale: Expression topographique courante qui conserve l’idée d’altitude.
- source_word: גִּבְעָה נִשָּׂאָה
  choice: colline élevée
  rationale: Préserve le sens de ce qui est haut ou dressé dans un français naturel.
- source_word: פְּלָגִים
  choice: ruisseaux
  rationale: Dans ce contexte d’eau abondante, le terme désigne des courants ou des ramifications d’eau; « ruisseaux » est clair et concret.
- source_word: יִבְלֵי מָיִם
  choice: cours d’eau
  rationale: Expression rare dont la nuance exacte est incertaine; « cours d’eau » la distingue de פְּלָגִים tout en restant naturelle.
- source_word: בְּיוֹם הֶרֶג רָב
  choice: au jour du grand massacre
  rationale: Conserve la force et la solennité du langage prophétique de jugement.
- source_word: בִּנְפֹל מִגְדָּלִים
  choice: quand les tours tomberont
  rationale: Rend temporellement l’infinitif construit et conserve l’image générale de la chute des tours.
theological_decisions:
- issue: Rapport entre l’abondance des eaux et les images de jugement
  choice: Maintenir ensemble l’image bienfaisante des eaux et celle du grand massacre et de la chute des tours.
  alternative: Présenter explicitement les eaux comme une restauration après le jugement, ou comme une provision au milieu du jugement.
  rationale: L’hébreu juxtapose fécondité et destruction sans préciser leur articulation; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme prophétique, le parallélisme topographique et la tension entre abondance et jugement.
