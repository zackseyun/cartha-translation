  rationale: La révision conserve le sens de jugement et la lecture contextuelle attestée par l’audit anglais, mais elle ne transforme pas en informations grammaticalement explicites l’objet de « frappera » ni l’appartenance du bâton. La note b documente cette lecture sans imposer une résolution que l’hébreu concis ne formule pas expressément.
