  text: כִּֽי מִ/קּ֥וֹל יְהוָ֖ה יֵחַ֣ת אַשּׁ֑וּר בַּ/שֵּׁ֖בֶט יַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/031.yaml
  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
translation:
  language: fr
  text: Car, à la voix de Yahweh, l’Assyrie sera brisée[a] ; avec un bâton, il frappera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera terrifiée », « s’effondrera » ou « sera mise en pièces » ; le verbe hébreu peut exprimer l’effroi, l’effondrement ou le brisement.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu n’exprime ni le sujet ni le complément de « frappera » dans cette proposition. Dans le contexte, on comprend probablement que Yahweh frappera l’Assyrie ; « bâton » peut aussi se traduire par « verge », « staff » ou « sceptre ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’énoncé précédent et convient au mouvement argumentatif du passage.
- source_word: מִקּוֹל
  choice: à la voix de
  rationale: Exprime ici la cause ou l’occasion tout en conservant l’image vive de la voix divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: יֵחַת
  choice: sera brisée
  rationale: Le nifal de חתת peut évoquer l’effroi, l’effondrement ou le brisement ; dans ce contexte de jugement militaire, « sera brisée » rend bien l’écroulement d’Assyrie sans effacer les autres nuances possibles.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Désigne ici la nation ou l’empire ; la forme française usuelle est retenue.
- source_word: בַּשֵּׁבֶט
  choice: de son bâton
  rationale: שֵׁבֶט désigne un bâton, une verge ou un sceptre. « Bâton » est naturel en français et exprime ici l’instrument du coup ; le possessif explicite le lien syntaxique retenu avec Yahweh.
- source_word: יַכֶּה
  choice: il la frappera
  rationale: Le verbe נכה signifie « frapper ». Le sujet masculin singulier implicite est compris comme Yahweh et l’objet non exprimé comme l’Assyrie, lecture naturelle dans le contexte immédiat.
theological_decisions:
- issue: Référent du sujet implicite de יַכֶּה
  choice: 'Yahweh est le sujet : « il la frappera ».'
  alternative: La syntaxe concise permet d’autres analyses, notamment une tournure passive ou une compréhension différente des participants.
  rationale: Le sujet n’est pas répété en hébreu, mais Yahweh, mentionné dans la proposition précédente, constitue l’antécédent le plus naturel. Une note signale que cette identification reste implicite.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de la voix divine et la force du jugement, tout en signalant les ambiguïtés lexicales et syntaxiques dans les notes.
