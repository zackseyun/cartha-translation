base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/010.yaml
  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
translation:
  language: fr
  text: 'eux qui disent aux voyants : « Ne voyez pas ! » et aux visionnaires : « Ne voyez pas pour nous ce qui est juste[a] ! Dites-nous des paroles flatteuses[b] ! Ayez des visions trompeuses[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est droit » ou « la vérité ». Le terme hébreu désigne ce qui est droit, correct ou conforme à la vérité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des choses lisses » ; c’est-à-dire des propos agréables ou flatteurs.
    reason: lexical_alternative
  - marker: c
    text: Ou « des tromperies » ou « des illusions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: voyants
  rationale: Participe substantivé de ראה désignant ici des figures prophétiques. « Voyants » est naturel en français biblique et permet de conserver le jeu avec « voyez ».
- source_word: תִרְאוּ
  choice: voyez
  rationale: 'La traduction directe maintient la reprise lexicale entre רֹאִים et תִרְאוּ : « voyants… voyez ».'
- source_word: חֹזִים
  choice: visionnaires
  rationale: Ce terme prophétique dérive de חזה, distinct de ראה. « Visionnaires » préserve autant que possible la distinction avec « voyants ».
- source_word: תֶחֱזוּ
  choice: ayez … de visions
  rationale: Le français ne possède pas de verbe courant et digne directement apparenté à « visionnaires ». La locution « avoir des visions » restitue naturellement l’activité visionnaire sans employer l’ambigu « visionner ».
- source_word: נְכֹחוֹת
  choice: ce qui est juste
  rationale: Le terme désigne ce qui est droit, correct ou conforme à la vérité. « Ce qui est juste » conserve sa portée à la fois morale et factuelle.
- source_word: דַּבְּרוּ
  choice: dites-nous
  rationale: L’impératif pluriel appelle une parole adressée au peuple. « Dites-nous » est plus idiomatique ici que le calque « parlez-nous ».
- source_word: חֲלָקוֹת
  choice: paroles flatteuses
  rationale: Littéralement, il s’agit de « choses lisses », image qui évoque des propos agréables, séduisants ou flatteurs. La traduction explicite cette valeur dans un français naturel.
- source_word: מַהֲתַלּוֹת
  choice: visions trompeuses
  rationale: Le nom évoque des tromperies, illusions ou égarements. « Trompeuses » conserve clairement la dimension mensongère tout en s’accordant au contexte visionnaire.
- source_word: אֲשֶׁר אָמְרוּ
  choice: eux qui disent
  rationale: La relative caractérise les rebelles mentionnés dans le contexte précédent. Le présent convient à cette caractérisation, tandis que « eux » facilite le raccord syntaxique avec le verset antérieur.
theological_decisions:
- issue: Nature du contenu prophétique rejeté
  choice: « ce qui est juste »
  alternative: « la vérité » ou « des choses droites »
  rationale: Cette formulation garde ensemble la rectitude morale et la véracité sans réduire le terme à une catégorie doctrinale plus étroite.
- issue: Distinction entre les deux désignations prophétiques
  choice: « voyants » et « visionnaires »
  alternative: Traduire les deux termes par « voyants » ou par « prophètes »
  rationale: L’hébreu emploie deux racines différentes liées à la vision prophétique. Les distinguer respecte le parallélisme lexical sans leur attribuer des fonctions théologiques différentes.
- issue: Caractère des visions demandées
  choice: « visions trompeuses »
  alternative: « illusions » ou « égarements »
  rationale: Le texte peut évoquer des illusions aussi bien que des messages délibérément trompeurs. L’adjectif « trompeuses » préserve cette amplitude sans préciser qui est conscient de la tromperie.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs brefs rendent la vigueur de la demande. La paire « voyants… voyez » conserve un jeu lexical hébreu; « visionnaires… visions » reproduit le second autant que le permet un français naturel.
