source:
  edition: WLC
  text: עַתָּ֗ה בּ֣וֹא כָתְבָ֥/הּ עַל ל֛וּחַ אִתָּ֖/ם וְ/עַל סֵ֣פֶר חֻקָּ֑/הּ וּ/תְהִי֙ לְ/י֣וֹם אַחֲר֔וֹן לָ/עַ֖ד עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/008.yaml
  text: Now come[a], write it before them on a tablet, and inscribe it in a scroll, that it may stand for a later day[b], as a witness forever and ever.
translation:
  language: fr
  text: 'Maintenant, viens : écris cela devant eux sur une tablette et inscris-le sur un rouleau, afin que cela subsiste pour un jour à venir[a], à jamais, pour toujours[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le dernier jour » ; l’expression hébraïque peut désigner simplement un jour futur ou prendre une portée plus ultime.
    reason: alternative_reading
  - marker: b
    text: L’hébreu accumule deux expressions de durée permanente, que l’on peut aussi rendre ensemble par « pour l’éternité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: L’adverbe introduit l’ordre immédiat avec la même netteté qu’en hébreu.
- source_word: בּוֹא
  choice: viens
  rationale: L’impératif de בוא est conservé comme appel direct; les deux-points rendent naturellement en français sa fonction d’introduction aux ordres suivants.
- source_word: כָתְבָהּ
  choice: écris cela
  rationale: Le suffixe féminin renvoie au message à mettre par écrit. « Cela » évite d’en préciser indûment la nature et reste naturel en français.
- source_word: עַל לוּחַ
  choice: sur une tablette
  rationale: לוּחַ désigne ici un support matériel destiné à l’écriture; « tablette » est précis sans être anachronique.
- source_word: אִתָּם
  choice: devant eux
  rationale: Dans le contexte d’un écrit public appelé à demeurer, l’expression indique vraisemblablement que l’inscription se fait en leur présence.
- source_word: וְעַל סֵפֶר חֻקָּהּ
  choice: et consigne-le dans un rouleau
  rationale: סֵפֶר désigne un document écrit, probablement un rouleau. חקק exprime l’idée d’inscrire durablement; « consigner » convient au support sans suggérer qu’un rouleau serait littéralement gravé.
- source_word: וּתְהִי
  choice: afin que cela subsiste
  rationale: La forme exprime ici le résultat ou le but recherché. « Subsiste » rend la permanence voulue sans ajouter explicitement la notion de témoignage.
- source_word: לְיוֹם אַחֲרוֹן
  choice: pour un jour à venir
  rationale: אַחֲרוֹן peut désigner un moment ultérieur sans constituer nécessairement une référence eschatologique technique; l’ambiguïté est signalée en note.
- source_word: לָעַד עַד עוֹלָם
  choice: à jamais, pour toujours
  rationale: Les deux expressions successives soulignent la durée permanente. La répétition française conserve cette insistance hébraïque.
theological_decisions:
- issue: Éventuelle portée eschatologique de לְיוֹם אַחֲרוֹן
  choice: pour un jour à venir
  alternative: pour le dernier jour
  rationale: Le contexte permet de comprendre un jour futur ou ultérieur sans imposer une lecture eschatologique. La note conserve l’autre possibilité.
- issue: Valeur de לָעַד
  choice: à jamais
  alternative: comme témoignage
  rationale: Le sens temporel de durée est le plus directement lexical et forme une expression renforcée avec עַד עוֹלָם. La fonction testimoniale de l’écrit est possible dans le contexte, mais elle n’est pas introduite dans le texte principal comme si elle était certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation fait de « viens » un appel introductif naturel. « Rouleau » respecte le support antique, tandis que « consigne » évite l’image peu naturelle d’un rouleau matériellement gravé. Tous les appels de note figurent dans le texte.
