  variant: modern international French
source:
  edition: WLC
  text: הַ/הֹלְכִים֙ לָ/רֶ֣דֶת מִצְרַ֔יִם וּ/פִ֖/י לֹ֣א שָׁאָ֑לוּ לָ/עוֹז֙ בְּ/מָע֣וֹז פַּרְעֹ֔ה וְ/לַ/חְס֖וֹת בְּ/צֵ֥ל מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: fr
  text: qui descendent en Égypte sans consulter ma bouche, pour chercher refuge dans la forteresse de Pharaon et s’abriter à l’ombre de l’Égypte !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהֹלְכִים לָרֶדֶת
  choice: qui descendent
  rationale: Le participe décrit ceux qui vont entreprendre la descente vers l’Égypte. En français naturel, « qui descendent » conserve le mouvement et convient à l’interpellation commencée au verset précédent.
- source_word: וּפִי לֹא שָׁאָלוּ
  choice: sans consulter ma bouche
  rationale: La formulation garde l’image hébraïque inhabituelle de la « bouche » divine, c’est-à-dire la parole ou l’avis de Dieu, plutôt que de l’expliciter entièrement.
- source_word: לָעוֹז בְּמָעוֹז פַּרְעֹה
  choice: pour chercher leur force dans la forteresse de Pharaon
  rationale: Le choix reproduit autant que possible le jeu de mots entre עוז et מעוז. « Leur force » exprime la valeur du verbe à l’infinitif construit, tandis que « forteresse » rend le lieu ou moyen de protection.
- source_word: וְלַחְסוֹת בְּצֵל מִצְרָיִם
  choice: et s’abriter à l’ombre de l’Égypte
  rationale: « S’abriter » et « à l’ombre » préservent la métaphore biblique de protection politique sans la réduire à une simple alliance.
theological_decisions:
- issue: Sens de « ma bouche »
  choice: Conserver littéralement « ma bouche »
  alternative: « sans me consulter » ou « sans demander mon avis »
  rationale: Le texte identifie l’autorité divine à la parole qui sort de sa bouche. Garder cette image préserve sa force théologique et son caractère concret, malgré une tournure moins courante en français.
- issue: Nature de la sécurité recherchée auprès de Pharaon
  choice: « chercher leur force dans la forteresse de Pharaon »
  alternative: « chercher refuge sous la protection de Pharaon »
  rationale: La formulation retenue ne décide pas si מָעוֹז désigne surtout une forteresse, une protection ou un refuge, tout en maintenant le contraste implicite entre la confiance en Dieu et la puissance politique égyptienne.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste étroitement liée au verset 1, dont ce membre poursuit la dénonciation. L’expression volontairement marquée « consulter ma bouche » conserve l’image hébraïque; « forteresse » et « ombre » maintiennent les deux métaphores parallèles de protection.
