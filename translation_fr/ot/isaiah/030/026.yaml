  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר הַ/לְּבָנָה֙ כְּ/א֣וֹר הַֽ/חַמָּ֔ה וְ/א֤וֹר הַֽ/חַמָּה֙ יִהְיֶ֣ה שִׁבְעָתַ֔יִם כְּ/א֖וֹר שִׁבְעַ֣ת הַ/יָּמִ֑ים בְּ/י֗וֹם חֲבֹ֤שׁ יְהוָה֙ אֶת שֶׁ֣בֶר עַמּ֔/וֹ וּ/מַ֥חַץ מַכָּת֖/וֹ יִרְפָּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
translation:
  language: fr
  text: La lumière de la lune sera comme la lumière du soleil, et la lumière du soleil sera sept fois plus intense, comme la lumière de sept jours, le jour où Yahweh pansera la fracture de son peuple et guérira la blessure causée par son coup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se rendre plus littéralement par : « guérira l’écrasement causé par son coup ». L’expression désigne la blessure résultant du coup porté par Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Le futur français exprime naturellement l’état à venir introduit par la forme hébraïque.
- source_word: אוֹר
  choice: lumière
  rationale: Terme direct et naturel, dont la répétition conserve la structure poétique du texte.
- source_word: הַלְּבָנָה
  choice: la lune
  rationale: Désignation poétique courante de la lune dans ce contexte.
- source_word: כְּאוֹר הַחַמָּה
  choice: comme la lumière du soleil
  rationale: Conserve la comparaison explicite et la répétition du mot « lumière ».
- source_word: שִׁבְעָתַיִם
  choice: sept fois plus forte
  rationale: Rend clairement en français moderne la multiplication par sept tout en qualifiant naturellement « lumière ».
- source_word: כְּאוֹר שִׁבְעַת הַיָּמִים
  choice: comme la lumière de sept jours
  rationale: Préserve l’image poétique et son ambiguïté quant à une éventuelle lumière cumulée.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Expression temporelle idiomatique qui garde la précision et le registre prophétique.
- source_word: חֲבֹשׁ
  choice: bandera
  rationale: Le verbe français « bander » convient précisément au traitement d’une fracture et maintient la métaphore médicale.
- source_word: שֶׁבֶר עַמּוֹ
  choice: la fracture de son peuple
  rationale: « Fracture » conserve l’image concrète de la rupture, tandis que « son peuple » rend directement le suffixe possessif.
- source_word: מַחַץ מַכָּתוֹ
  choice: la blessure causée par le coup qu’il lui a porté
  rationale: Explicite la relation entre la blessure et le coup sans atténuer l’idée que Yahweh guérit les conséquences de son propre châtiment.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération identifie clairement le nom propre divin présent dans l’hébreu.
- issue: Référent du suffixe dans מַכָּתוֹ
  choice: le coup qu’il lui a porté
  alternative: sa blessure
  rationale: Le contexte permet et favorise l’idée que Yahweh guérit son peuple après l’avoir frappé. Cette formulation maintient la tension entre jugement divin et restauration, tout en rendant explicite en français le peuple comme destinataire du coup.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « lumière » et les images concrètes de la fracture, du bandage et de la guérison conservent la force poétique et médicale de l’hébreu.
