id: ISA.30.15
reference: Isaiah 30:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
translation:
  language: fr
  text: 'Car ainsi parle le Seigneur, l’Éternel, le Saint d’Israël :


    « En revenant[a] et en vous reposant, vous serez sauvés[b] ;


    dans le calme et la confiance sera votre force. »


    Mais vous ne l’avez pas voulu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous repentant ». L’hébreu parle littéralement d’un retour, qui peut inclure la repentance et le retour à Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous serez délivrés ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: 'Rend distinctement les deux éléments du titre divin composé : אֲדֹנָי par « le Seigneur » et le nom divin יהוה selon la convention française « l’Éternel ».'
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Expression précise et naturelle qui conserve le titre caractéristique d’Ésaïe ainsi que le lien avec Israël.
- source_word: בְּשׁוּבָה
  choice: En revenant
  rationale: 'Conserve l’image concrète du retour et laisse ouverte sa portée : retour à Dieu, changement de conduite ou repentance.'
- source_word: וָנַחַת
  choice: et dans le repos
  rationale: נַחַת évoque le repos, l’apaisement et l’absence d’agitation ; « repos » maintient le parallélisme sans préciser excessivement le sens.
- source_word: תִּוָּשֵׁעוּן
  choice: vous serez sauvés
  rationale: Le nifal de ישׁע signifie être sauvé ou délivré. « Sauvés » garde à la fois la portée concrète et la résonance théologique du terme.
- source_word: בְּהַשְׁקֵט
  choice: dans le calme
  rationale: Rend naturellement en français l’idée de tranquillité ou d’absence d’agitation.
- source_word: וּבְבִטְחָה
  choice: et la confiance
  rationale: « Confiance » exprime la disposition de dépendre de Dieu sans réduire le mot à une simple sécurité extérieure.
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  choice: sera votre force
  rationale: Suit la construction hébraïque et traduit גְּבוּרָה par le terme français le plus naturel dans ce contexte.
- source_word: וְלֹא אֲבִיתֶם
  choice: Mais vous ne l’avez pas voulu
  rationale: Rend directement le refus volontaire exprimé par אָבָה et produit une conclusion idiomatique en français.
theological_decisions:
- issue: Portée de בְּשׁוּבָה
  choice: Traduire par « En revenant »
  alternative: « dans la repentance » ou « en vous repentant »
  rationale: La racine שׁוב peut désigner la repentance, mais le contexte inclut plus largement le retour à Dieu et l’abandon d’une stratégie fondée sur les alliances et la puissance humaine. La traduction retenue préserve cette amplitude.
- issue: Portée salvifique de תִּוָּשֵׁעוּן
  choice: Traduire par « vous serez sauvés »
  alternative: « vous serez délivrés »
  rationale: Le contexte peut viser une délivrance historique de Juda, tandis que le verbe porte aussi une résonance plus large de salut. « Sauvés » conserve cette tension, et la lecture circonstancielle figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique hébreu est conservé. « Le Seigneur, l’Éternel » distingue les deux éléments du titre divin composé, et la formulation finale reste directe sans surinterpréter le refus.
