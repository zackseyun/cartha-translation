  text: וְ/הִשְׁמִ֨יעַ יְהוָ֜ה אֶת ה֣וֹד קוֹל֗/וֹ וְ/נַ֤חַת זְרוֹע/וֹ֙ יַרְאֶ֔ה בְּ/זַ֣עַף אַ֔ף וְ/לַ֖הַב אֵ֣שׁ אוֹכֵלָ֑ה נֶ֥פֶץ וָ/זֶ֖רֶם וְ/אֶ֥בֶן בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
translation:
  language: fr
  text: Yahvé fera entendre la majesté de sa voix et montrera son bras qui s’abat[a], dans une colère furieuse, avec la flamme d’un feu dévorant, une averse violente[b], une tempête et des grêlons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. Autres traductions possibles : « la descente de son bras » ou « le coup porté par son bras ». Elle peut souligner soit le mouvement descendant du bras, soit l’impact du coup.'
    reason: lexical_alternative
  - marker: b
    text: Ou « une pluie diluvienne ». Le terme hébreu évoque probablement un déferlement soudain et violent.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui le distingue du titre « Seigneur » tout en restant naturelle dans un registre biblique digne.
- source_word: הִשְׁמִיעַ
  choice: fera entendre
  rationale: Le hifil de שׁמע a une valeur causative, rendue naturellement en français par « faire entendre ».
- source_word: הוֹד קוֹלוֹ
  choice: la majesté de sa voix
  rationale: הוֹד exprime la majesté ou la splendeur; la formulation nominale conserve la force théophanique de l’hébreu.
- source_word: נַחַת זְרוֹעוֹ
  choice: son bras qui s’abat
  rationale: L’expression difficile évoque vraisemblablement le mouvement descendant du bras, avec l’idée contextuelle d’un coup porté en jugement. Cette formulation française garde l’image concrète sans imposer exclusivement l’impact ou le mouvement.
- source_word: יַרְאֶה
  choice: montrera
  rationale: Le hifil de ראה signifie ici « faire voir, montrer ».
- source_word: בְּזַעַף אַף
  choice: dans une colère furieuse
  rationale: Cette expression intensive associe deux termes liés à la fureur et à la colère; la traduction en restitue l’intensité sans répétition artificielle.
- source_word: לַהַב אֵשׁ אוֹכֵלָה
  choice: la flamme d’un feu dévorant
  rationale: La formulation conserve l’image poétique du feu qui consume ainsi que la structure nominale de l’hébreu.
- source_word: נֶפֶץ
  choice: trombe d’eau
  rationale: Dans cette série de phénomènes météorologiques violents, le mot désigne probablement une pluie qui éclate avec violence ou un déferlement d’eau.
- source_word: זֶרֶם
  choice: tempête
  rationale: Le terme peut évoquer une pluie torrentielle ou une tempête; « tempête » s’intègre naturellement à la séquence sans la réduire au seul écoulement de l’eau.
- source_word: אֶבֶן בָּרָד
  choice: grêlons
  rationale: L’expression littérale « pierre de grêle » désigne idiomatiquement des grêlons.
theological_decisions:
- issue: Image anthropomorphique du bras et de la colère de Yahvé
  choice: Conserver concrètement le bras qui s’abat et la colère furieuse comme images poétiques du jugement divin.
  alternative: Abstraire ces images en parlant seulement de la manifestation de la puissance divine.
  rationale: Le texte hébreu emploie délibérément un langage corporel et affectif. Le conserver maintient la vigueur prophétique sans définir la nature de Dieu au-delà de ce que dit le passage.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsmes. La phrase conserve l’accumulation vigoureuse des images de jugement tout en restant lisible à voix haute.
