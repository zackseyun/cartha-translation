  text: וְ/הָ/אֲלָפִ֣ים וְ/הָ/עֲיָרִ֗ים עֹֽבְדֵי֙ הָֽ/אֲדָמָ֔ה בְּלִ֥יל חָמִ֖יץ יֹאכֵ֑לוּ אֲשֶׁר זֹרֶ֥ה בָ/רַ֖חַת וּ/בַ/מִּזְרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/024.yaml
  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
translation:
  language: fr
  text: Les bœufs et les ânes qui travaillent la terre mangeront un fourrage assaisonné[a], vanné à la pelle et à la fourche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un fourrage salé » ; le sens exact de l’adjectif hébreu est incertain, mais il semble désigner un fourrage spécialement amélioré ou préparé.
    reason: lexical_alternative
  - marker: b
    text: Les deux termes hébreux désignent des outils agricoles employés pour le vannage, traditionnellement rendus par « pelle » et « fourche à vanner ».
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים
  choice: les bœufs
  rationale: Dans ce contexte agricole, le terme désigne des bovins employés comme animaux de trait; « bœufs » rend cette fonction plus précisément que « bovins ».
- source_word: הָעֲיָרִים
  choice: les ânes
  rationale: Équivalent courant et naturel en français moderne pour ces animaux de travail.
- source_word: עֹבְדֵי הָאֲדָמָה
  choice: qui travaillent la terre
  rationale: La proposition participiale caractérise les animaux par leur travail agricole et conserve l'image concrète de l'hébreu.
- source_word: בְּלִיל
  choice: un fourrage
  rationale: Le mot désigne une nourriture préparée ou mélangée pour le bétail; « fourrage » est clair, courant et adapté au contexte.
- source_word: חָמִיץ
  choice: savoureux
  rationale: Le sens précis est discuté; l'adjectif évoque vraisemblablement un fourrage amélioré, notamment salé ou assaisonné. « Savoureux » exprime sa qualité supérieure sans imposer un procédé particulier.
- source_word: יֹאכֵלוּ
  choice: mangeront
  rationale: Le futur convient à la promesse d'abondance annoncée dans le contexte.
- source_word: אֲשֶׁר זֹרֶה
  choice: vanné
  rationale: Bien que la forme hébraïque soit active, le fourrage est ce qui subit l'action; le participe passif français communique naturellement ce rapport.
- source_word: בָרַחַת
  choice: à la pelle
  rationale: Il s'agit d'un instrument agricole servant à lancer la matière en l'air lors du vannage; « pelle » est l'équivalent traditionnel et intelligible.
- source_word: וּבַמִּזְרֶה
  choice: et à la fourche
  rationale: Le terme désigne un second instrument de vannage, probablement une fourche; le contexte et la note précisent sa fonction.
theological_decisions: []
