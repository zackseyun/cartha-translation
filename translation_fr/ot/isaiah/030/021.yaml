source:
  edition: WLC
  text: וְ/אָזְנֶ֨י/ךָ֙ תִּשְׁמַ֣עְנָה דָבָ֔ר מֵֽ/אַחֲרֶ֖י/ךָ לֵ/אמֹ֑ר זֶ֤ה הַ/דֶּ֨רֶךְ֙ לְכ֣וּ ב֔/וֹ כִּ֥י תַאֲמִ֖ינוּ וְ/כִ֥י תַשְׂמְאִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
translation:
  language: fr
  text: 'Tes oreilles entendront derrière toi une parole qui te dira : « Voici le chemin : suivez-le », lorsque vous vous tournerez à droite et lorsque vous vous tournerez à gauche.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand vous irez à droite et quand vous irez à gauche ». Les verbes hébreux de cette dernière proposition sont difficiles, particulièrement le premier ; le sens général est qu’une direction sera donnée lorsqu’on s’apprête à s’orienter d’un côté ou de l’autre.'
    reason: Alternative lexicale et difficulté du texte hébreu
lexical_decisions:
- source_word: וְאָזְנֶיךָ
  choice: Tes oreilles
  rationale: Le pluriel concret de l’hébreu est conservé. Le possessif singulier correspond au destinataire individuel dans la première proposition.
- source_word: תִּשְׁמַעְנָה דָבָר
  choice: entendront […] une parole
  rationale: Le futur exprime naturellement l’assurance prophétique; « une parole » rend directement דָבָר sans préciser l’identité ni le moyen d’expression du guide.
- source_word: מֵאַחֲרֶיךָ
  choice: derrière toi
  rationale: Cette formulation naturelle conserve l’image spatiale d’une parole entendue depuis l’arrière.
- source_word: לֵאמֹר
  choice: qui dira
  rationale: En français, la proposition relative introduit le discours direct plus naturellement que le calque « disant ».
- source_word: זֶה הַדֶּרֶךְ
  choice: Voici le chemin
  rationale: « Voici » restitue la désignation immédiate exprimée par זֶה; « chemin » garde à la fois l’image d’un itinéraire et sa portée figurée.
- source_word: לְכוּ בוֹ
  choice: suivez-le
  rationale: L’impératif pluriel לְכוּ est rendu au pluriel. « Suivez-le » est idiomatique en français avec « chemin » et transmet l’idée d’avancer selon la voie indiquée.
- source_word: כִּי תַאֲמִינוּ וְכִי תַשְׂמְאִילוּ
  choice: que vous alliez à droite ou à gauche
  rationale: La formule exprime de manière naturelle les deux directions parallèles. Le premier verbe est difficile, mais le parallélisme avec « aller à gauche » soutient le sens directionnel « aller à droite ».
theological_decisions:
- issue: Nature de la « parole » qui guide
  choice: Une parole directrice donnée sans identification explicite du locuteur ni du mécanisme
  alternative: La voix d’un enseignant, une impulsion intérieure de la conscience ou une instruction prophétique
  rationale: Le verset promet une direction sûre, mais cette proposition ne nomme pas explicitement celui qui parle. La traduction conserve donc l’image et son ouverture.
- issue: Alternance du singulier et du pluriel
  choice: Conserver « toi » dans l’annonce et « vous » dans la parole citée
  alternative: Uniformiser tout le verset au singulier ou au pluriel
  rationale: L’hébreu passe du suffixe masculin singulier dans « tes oreilles » et « derrière toi » aux impératifs et verbes pluriels dans le discours cité. Cette tension grammaticale est significative et peut être conservée en français.
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve l’image concrète des oreilles et du chemin, ainsi que le passage inhabituel du singulier (« tes oreilles », « derrière toi ») au pluriel (« suivez », « vous alliez »).
