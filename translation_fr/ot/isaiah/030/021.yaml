    rationale: « Que vous alliez à droite ou à gauche » exprime l’idée générale, mais atténue la structure « lorsque… et lorsque… » du texte et son aspect de guidance au moment de s’orienter dans l’une ou l’autre direction.
  - severity: low
    issue: La relation entre « une parole » et le discours direct peut être rendue plus fluide.
    rationale: « Une parole qui te dira » est plus naturel en français et rend sans surcharge l’infinitif לֵאמֹר introduisant les paroles rapportées.
