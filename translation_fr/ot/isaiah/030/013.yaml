  text: לָ/כֵ֗ן יִֽהְיֶ֤ה לָ/כֶם֙ הֶ/עָוֺ֣ן הַ/זֶּ֔ה כְּ/פֶ֣רֶץ נֹפֵ֔ל נִבְעֶ֖ה בְּ/חוֹמָ֣ה נִשְׂגָּבָ֑ה אֲשֶׁר פִּתְאֹ֥ם לְ/פֶ֖תַע יָב֥וֹא שִׁבְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: fr
  text: C’est pourquoi cette faute sera pour vous comme une brèche qui s’effondre, une saillie dans une haute muraille, dont l’effondrement survient soudain, en un instant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָוֺן הַזֶּה
  choice: cette faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa conséquence. « Cette faute » est naturel en français et conserve ici le lien avec le refus dénoncé au verset précédent.
- source_word: כְּפֶרֶץ נֹפֵל
  choice: comme une brèche qui s’effondre
  rationale: פֶּרֶץ désigne une brèche ou rupture, et נֹפֵל est un participe exprimant la chute en cours ou imminente. Cette formulation garde l’image dynamique sans ajouter explicitement « prête à ».
- source_word: נִבְעֶה
  choice: comme un renflement
  rationale: Le terme décrit quelque chose qui bombe ou fait saillie. « Renflement » rend clairement l’image d’une muraille déformée sous la pression.
- source_word: שִׁבְרָהּ
  choice: elle s’écroule
  rationale: Le nom שֶׁבֶר évoque la rupture ou l’effondrement. La reformulation verbale produit une phrase française naturelle tout en conservant la soudaineté de la catastrophe.
theological_decisions:
- issue: Rapport entre la faute et le jugement
  choice: Conserver l’identification imagée de la faute avec la brèche qui mène à l’effondrement
  alternative: Traduire עָוֹן par « châtiment » ou « conséquence de la faute »
  rationale: Le texte hébreu laisse subsister la tension entre la faute, la culpabilité et ses conséquences. « Faute » évite de réduire explicitement le terme au seul châtiment.
translation_notes:
  register: Français international moderne, imagé et digne. La répétition de « comme » clarifie l’apposition hébraïque, tandis que les deux verbes « s’effondre / s’écroule » préservent le mouvement de l’image et sa conclusion soudaine.
