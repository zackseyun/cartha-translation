revisions:
- from: 'C’est pourquoi cette faute sera pour vous comme une brèche qui s’effondre, comme un renflement dans une haute muraille : soudain, en un instant, elle s’écroule.'
  to: C’est pourquoi cette faute sera pour vous comme une brèche qui s’effondre, une saillie dans une haute muraille, dont l’effondrement survient soudain, en un instant.
  rationale: La révision conserve les choix lexicaux prudents du projet et l’ambiguïté inhérente à l’image de la muraille, tout en rendant plus directement le nom possessif « son effondrement » et la relation appositionnelle entre les deux descriptions.
  reviewer_model: gpt-5.6-terra
