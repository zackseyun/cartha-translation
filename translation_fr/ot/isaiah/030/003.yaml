revisions:
- from: Alors, la forteresse de Pharaon tournera à votre honte, et l’abri à l’ombre de l’Égypte, à votre humiliation.[a]
  to: Alors, la protection de Pharaon vous vaudra la honte, et le refuge à l’ombre de l’Égypte, l’humiliation.[a]
  rationale: La révision rend מָעוֹז par « protection », sens contextuellement le plus naturel dans l’oracle contre la confiance en l’Égypte. Elle maintient la métaphore de l’ombre, le futur de conséquence et la nuance rhétorique entre « honte » et « humiliation ».
