review_pass:
  verdict: revise
  source_fidelity: Le sens conséquentiel futur de וְהָיָה est bien rendu. Toutefois, dans ce contexte, מָעוֹז פַּרְעֹה désigne plus naturellement la protection ou le refuge procuré par Pharaon que sa « forteresse » au sens d’un édifice. La révision conserve le parallélisme et la distinction avec חָסוּת.
  naturalness: « La forteresse de Pharaon tournera à votre honte » est compréhensible, mais « la protection de Pharaon vous vaudra la honte » est plus idiomatique et correspond mieux au contexte de la recherche d’appui politique. La seconde proposition garde une ellipse française naturelle.
  terminology: « Pharaon », « honte » et « humiliation » conviennent. « Protection » pour מָעוֹז et « refuge » pour חָסוּת permettent de distinguer les deux substantifs sans donner à « forteresse » un sens matériel trop marqué.
  issues:
  - severity: medium
    issue: « la forteresse de Pharaon » peut indûment matérialiser מָעוֹז.
    rationale: Le mot peut désigner une forteresse, mais le contexte immédiat porte sur le fait de chercher protection auprès de Pharaon et de l’Égypte. « Protection » rend mieux cette fonction sans effacer le parallélisme avec « refuge ».
  - severity: low
    issue: La note précise « que Juda cherchait ».
    rationale: Cette précision contextuelle est plausible, mais elle n’est pas nécessaire à l’explication de la métaphore dans ce verset. Une formulation plus neutre reste plus strictement attachée à l’ancrage lexical.
  revised_text: Alors, la protection de Pharaon vous vaudra la honte, et le refuge à l’ombre de l’Égypte, l’humiliation.[a]
  revised_footnotes:
  - marker: a
    text: L’expression « à l’ombre de l’Égypte » évoque la recherche de protection auprès de l’Égypte.
    reason: cultural_note
