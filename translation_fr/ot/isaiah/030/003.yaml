source:
  edition: WLC
  text: וְ/הָיָ֥ה לָ/כֶ֛ם מָע֥וֹז פַּרְעֹ֖ה לְ/בֹ֑שֶׁת וְ/הֶ/חָס֥וּת בְּ/צֵל מִצְרַ֖יִם לִ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
translation:
  language: fr
  text: Alors, la protection de Pharaon vous vaudra la honte, et le refuge à l’ombre de l’Égypte, l’humiliation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « à l’ombre de l’Égypte » évoque la recherche de protection auprès de l’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors, … tournera à
  rationale: Dans ce contexte d’avertissement prophétique, la forme exprime la conséquence future. « Tournera à » rend naturellement le résultat, tandis que « alors » marque la progression du discours.
- source_word: מָעוֹז
  choice: la forteresse
  rationale: Le nom désigne un lieu ou un moyen de force et de protection. « Forteresse » conserve l’image concrète et le distingue de חָסוּת dans le membre parallèle.
- source_word: פַּרְעֹה
  choice: de Pharaon
  rationale: Forme française usuelle du titre royal.
- source_word: לְבֹשֶׁת
  choice: à votre honte
  rationale: בֹּשֶׁת désigne la honte ou l’opprobre. La formulation française intègre aussi la valeur de לָכֶם, qui indique que ce résultat atteindra les destinataires.
- source_word: וְהֶחָסוּת
  choice: et l’abri
  rationale: Le substantif évoque le fait ou le moyen de chercher protection. « Abri » est naturel en français et évite de répéter « forteresse ».
- source_word: בְּצֵל מִצְרַיִם
  choice: à l’ombre de l’Égypte
  rationale: La traduction conserve la métaphore hébraïque de l’ombre protectrice, ici appliquée à la protection recherchée auprès de l’Égypte.
- source_word: לִכְלִמָּה
  choice: à votre humiliation
  rationale: כְּלִמָּה désigne la honte, le déshonneur ou l’humiliation. « Humiliation » maintient une nuance distincte de בֹּשֶׁת dans le parallélisme.
theological_decisions:
- issue: Maintien de la distinction entre les deux termes hébreux relatifs à la honte
  choice: « honte » pour בֹּשֶׁת et « humiliation » pour כְּלִמָּה
  alternative: Employer « honte » ou « déshonneur » dans les deux membres
  rationale: Les deux termes sont proches mais distincts. Les différencier respecte le parallélisme hébreu sans lui imposer une distinction doctrinale artificielle.
- issue: Interprétation de l’ombre de l’Égypte
  choice: Conserver littéralement la métaphore dans le texte et l’expliquer en note
  alternative: Traduire directement par « la protection de l’Égypte »
  rationale: L’image de l’ombre comme protection est intelligible et poétique; la note explicite son sens contextuel sans effacer la formulation hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle du verset est conservée; « forteresse » et « abri » reflètent deux substantifs hébreux distincts. Le marqueur de note [a] figure dans le texte.
