  text: כֹּ֣ל הבאיש עַל עַ֖ם לֹא יוֹעִ֣ילוּ לָ֑/מוֹ לֹ֤א לְ/עֵ֨זֶר֙ וְ/לֹ֣א לְ/הוֹעִ֔יל כִּ֥י לְ/בֹ֖שֶׁת וְ/גַם לְ/חֶרְפָּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
translation:
  language: fr
  text: Tous sont couverts de honte à cause d’un peuple qui ne leur est d’aucun profit[a], qui ne leur apporte ni aide ni profit, mais seulement honte et opprobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu הבאיש est difficile. Il peut évoquer le fait de devenir odieux ou de sentir mauvais, mais, dans ce contexte d’alliance décevante et en parallèle avec « honte » et « opprobre », le sens « sont couverts de honte » est retenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Tous
  rationale: Le terme est pris distributivement et désigne l’ensemble des personnes concernées; « Tous » reste naturel et concis.
- source_word: הבאיש
  choice: sont couverts de honte
  rationale: Le verbe est difficile. Dans ce contexte, le parallélisme avec בֹּשֶׁת et חֶרְפָּה favorise l’idée d’une honte ou d’un déshonneur subi plutôt que celle d’une mauvaise odeur ou d’un sentiment intérieur.
- source_word: עַל
  choice: à cause de
  rationale: La préposition exprime ici la cause ou l’occasion de leur humiliation.
- source_word: עַם
  choice: un peuple
  rationale: Cette formulation conserve le singulier collectif sans expliciter dans le verset qu’il s’agit de l’Égypte.
- source_word: לֹא יוֹעִילוּ לָמוֹ
  choice: qui ne leur est d’aucun profit
  rationale: יעל exprime l’utilité ou le bénéfice. Cette traduction indique l’absence totale d’avantage et maintient le lien lexical avec לְהוֹעִיל.
- source_word: לְעֵזֶר
  choice: aide
  rationale: « Aide » rend directement le nom עֵזֶר dans la construction parallèle.
- source_word: לְהוֹעִיל
  choice: avantage
  rationale: « Avantage » exprime l’utilité ou le bénéfice; la reprise sémantique avec « profit » préserve l’insistance hébraïque sans lourdeur excessive en français.
- source_word: כִּי
  choice: mais seulement
  rationale: 'Dans cette structure négative, כִּי introduit l’issue opposée: non l’aide ou l’avantage, mais la honte. « Seulement » rend l’exclusivité implicite du contraste.'
- source_word: לְבֹשֶׁת
  choice: honte
  rationale: « Honte » est le correspondant direct et s’accorde avec le champ lexical dominant du verset.
- source_word: וְגַם
  choice: et
  rationale: L’addition est naturellement exprimée en français par « et »; l’intensification se dégage déjà de l’accumulation des deux termes.
- source_word: לְחֶרְפָּה
  choice: déshonneur
  rationale: « Déshonneur » évoque la disgrâce publique et l’opprobre, tout en se distinguant de בֹּשֶׁת traduit par « honte ».
