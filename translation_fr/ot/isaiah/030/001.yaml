  variant: modern international French
source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
translation:
  language: fr
  text: 'Malheur aux enfants rebelles, déclare Yahvé : vous qui mettez un projet à exécution, mais sans qu’il vienne de moi, et qui versez une libation[a], mais non par mon Esprit, pour ajouter péché sur péché !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et qui tissent une couverture » ; dans ce contexte, certains comprennent plus largement : « et qui concluent une alliance ». Le texte hébreu tel qu’il est vocalisé se lit le plus naturellement : « et qui versent une libation ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Malheur
  rationale: Introduit avec force une dénonciation prophétique, tout en pouvant porter une nuance de lamentation.
- source_word: בָּנִים סוֹרְרִים
  choice: enfants rebelles
  rationale: Conserve la relation filiale et collective ainsi que l’idée d’une désobéissance obstinée.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: Rend de façon solennelle la formule prophétique et transcrit explicitement le nom divin.
- source_word: לַעֲשׂוֹת עֵצָה
  choice: qui mettent un projet à exécution
  rationale: Le syntagme évoque l’élaboration ou la réalisation d’une politique; cette formulation souligne ici sa mise en œuvre.
- source_word: וְלֹא מִנִּי
  choice: mais sans qu’il vienne de moi
  rationale: Exprime naturellement en français l’absence d’origine divine du projet.
- source_word: וְלִנְסֹךְ מַסֵּכָה
  choice: et qui versent une libation
  rationale: Suit le sens le plus naturel du texte massorétique vocalisé, sans imposer au texte principal l’interprétation contextuelle d’une alliance.
- source_word: וְלֹא רוּחִי
  choice: mais non par mon Esprit
  rationale: Préserve la possibilité que רוּחַ désigne l’Esprit de Yahvé comme source ou agent, sans développer davantage.
- source_word: לְמַעַן סְפוֹת
  choice: ajoutant ainsi
  rationale: Exprime de manière concise le résultat ou le but de leurs actes.
- source_word: חַטָּאת עַל חַטָּאת
  choice: le péché au péché
  rationale: Conserve la répétition hébraïque et l’idée d’une culpabilité qui s’accumule.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: « Yahvé » rend explicitement le tétragramme et convient à l’usage biblique français moderne, sans remplacer le nom propre par un titre.
- issue: Interprétation de וְלִנְסֹךְ מַסֵּכָה
  choice: versent une libation
  alternative: tissent une couverture; concluent une alliance
  rationale: Le texte massorétique vocalisé se lit le plus naturellement comme l’action de verser une libation. Le contexte de l’alliance avec l’Égypte explique les autres interprétations, qui sont signalées en note afin de préserver l’ambiguïté textuelle.
- issue: Sens de רוּחִי
  choice: mon Esprit
  alternative: mon souffle; ma volonté
  rationale: La majuscule met en relief l’Esprit propre de Yahvé, tout en laissant intacte la concision de l’hébreu; les nuances de souffle ou de disposition ne sont pas développées dans le texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation détache la formule prophétique sans alourdir la phrase. Le texte principal suit la vocalisation massorétique et la note conserve les autres lectures importantes.
