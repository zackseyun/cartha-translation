revisions:
- from: Mille fuiront devant la menace d’un seul ; devant la menace de cinq, vous fuirez, jusqu’à ce que vous restiez comme un mât[a] au sommet d’une montagne et comme un étendard[b] sur une colline.
  to: À la réprimande d’un seul, mille fuiront ; à la réprimande de cinq, vous fuirez, jusqu’à ce que vous ne soyez plus qu’un mât[a] au sommet d’une montagne et qu’un étendard[b] sur une colline.
  rationale: La révision remplace l’interprétatif « menace » par « réprimande », qui reflète plus directement גַּעֲרָה, et reformule la dernière proposition pour rendre l’idée d’un peuple laissé comme reste. Elle conserve les images non interprétées du mât et de l’étendard, le parallélisme et les deux ancres de notes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:00Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens numérique et l’alternance entre « mille » (sujet à la troisième personne) et « vous » (adresse directe) sont bien rendus. Toutefois, גַּעֲרָה désigne d’abord une réprimande, un reproche ou une semonce menaçante ; « menace » restreint et interprète le terme. Le niphal נוֹתַרְתֶּם évoque le fait d’être laissés comme reste après la déroute ; « vous restiez » affaiblit cette nuance.
  naturalness: La phrase est fluide en français international actuel. « À la réprimande de » est naturel dans ce parallélisme et rend mieux la causalité que « devant ». La tournure « vous ne soyez plus qu’un mât » exprime idiomatiquement l’état de reste sans expliquer la métaphore.
  terminology: « Mât » pour תֹּרֶן et « étendard » pour נֵס sont des choix sûrs, concrets et cohérents avec les notes lexicales. « Réprimande » est préférable à « menace » pour conserver le noyau sémantique de גַּעֲרָה, tout en laissant entendre la force du contexte.
  issues:
  - severity: medium
    issue: « menace » pour גַּעֲרַת
    rationale: Le terme hébreu a pour sens de base « réprimande / reproche / semonce ». Une menace peut être impliquée par le contexte de fuite, mais elle ne doit pas remplacer le terme dans le texte principal.
  - severity: medium
    issue: « jusqu’à ce que vous restiez » pour נוֹתַרְתֶּם
    rationale: Le niphal indique que les destinataires sont laissés en reste après la débâcle. Le simple verbe français « rester » peut décrire une permanence volontaire ou neutre et atténue le résultat de dévastation.
