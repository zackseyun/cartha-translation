source:
  edition: WLC
  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
translation:
  language: fr
  text: À la réprimande d’un seul, mille fuiront ; à la réprimande de cinq, vous fuirez, jusqu’à ce que vous ne soyez plus qu’un mât[a] au sommet d’une montagne et qu’un étendard[b] sur une colline.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un poteau de signalisation ». Le mot hébreu תֹּרֶן peut désigner un mât ou un haut poteau.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme une bannière servant de signal ». Le mot hébreu נֵס désigne un étendard ou une bannière élevée comme signal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  choice: Mille
  rationale: L’expression signifie « un millier » ; « mille » est la formulation française la plus naturelle et conserve la force du contraste numérique.
- source_word: מִפְּנֵי
  choice: devant
  rationale: La préposition exprime ici la cause immédiate de la fuite et l’idée de reculer face à quelqu’un ; « devant » convient naturellement au contexte de débâcle.
- source_word: גַּעֲרַת
  choice: menace
  rationale: Le terme désigne une réprimande ou une parole menaçante. Dans ce contexte militaire, « menace » restitue naturellement la terreur provoquée sans réduire le mot à un simple cri.
- source_word: תָּנֻסוּ
  choice: vous fuirez
  rationale: Le verbe est à la deuxième personne du pluriel et maintient l’adresse directe au peuple. Dans la première proposition, « fuiront » est fourni par ellipse à partir de ce même verbe.
- source_word: עַד אִם
  choice: jusqu’à ce que
  rationale: 'Cette locution marque le terme et le résultat de la fuite : elle se poursuit jusqu’à l’état d’isolement décrit ensuite.'
- source_word: נוֹתַרְתֶּם
  choice: vous restiez
  rationale: La forme passive exprime le fait d’être laissés comme survivants après la débâcle. Après « jusqu’à ce que », le subjonctif « restiez » est requis en français.
- source_word: כַּתֹּרֶן
  choice: comme un mât
  rationale: תֹּרֶן peut désigner un mât ou un haut poteau. « Mât » préserve l’image concrète et son ambiguïté fonctionnelle, tandis que le contexte souligne surtout l’isolement et la visibilité.
- source_word: עַל רֹאשׁ הָהָר
  choice: au sommet d’une montagne
  rationale: Cette formulation française naturelle rend littéralement la position élevée sans imposer l’idée d’une montagne particulière.
- source_word: וְכַנֵּס
  choice: et comme un étendard
  rationale: נֵס désigne une bannière ou un étendard élevé servant de signal. « Étendard » est digne, compréhensible et conserve l’objet concret de la comparaison.
- source_word: עַל הַגִּבְעָה
  choice: sur une colline
  rationale: Traduction topographique directe et naturelle ; l’article indéfini convient à la portée générale de la comparaison.
theological_decisions:
- issue: Portée de la comparaison finale
  choice: Conserver les images concrètes du mât et de l’étendard, qui évoquent un reste isolé, exposé et visible après la fuite.
  alternative: Expliciter uniquement un signal d’avertissement, ou uniquement la petitesse et la fragilité du reste.
  rationale: Le parallélisme met en scène des objets solitaires dressés sur des hauteurs. La traduction garde cette tension imagée sans réduire la métaphore à une seule interprétation.
translation_notes:
  register: Français international actuel, sobre et soutenu. Le parallélisme, l’adresse directe et la disproportion rhétorique entre mille, un et cinq sont maintenus. Le verbe « fuiront », elliptique en hébreu dans la première proposition, est explicité en français pour assurer la clarté.
