  to: Vous aurez un chant comme dans la nuit où l’on consacre une fête[a], et la joie au cœur comme celui qui va au son de la flûte[b] pour se rendre à la montagne de Yahvé[c], auprès du Rocher d’Israël[d].
  rationale: La révision restaure la structure nominale et la définitude de « le chant », maintient les deux comparaisons poétiques et rend plus directement la destination exprimée par אֶל. Elle conserve la formulation française moderne et évite de trancher la syntaxe discutée de « nuit / consécration d’une fête » ou la relation théologique entre la montagne de Yahvé et le Rocher d’Israël.
