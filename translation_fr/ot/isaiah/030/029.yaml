source:
  edition: WLC
  text: הַ/שִּׁיר֙ יִֽהְיֶ֣ה לָ/כֶ֔ם כְּ/לֵ֖יל הִתְקַדֶּשׁ חָ֑ג וְ/שִׂמְחַ֣ת לֵבָ֗ב כַּֽ/הוֹלֵךְ֙ בֶּֽ/חָלִ֔יל לָ/ב֥וֹא בְ/הַר יְהוָ֖ה אֶל צ֥וּר יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/029.yaml
  text: The song will be for you as in the night when a feast is consecrated[a], and gladness of heart as when one goes with the flute to come to the mountain of Yahweh[d][c][b], to the Rock of Israel.
translation:
  language: fr
  text: Vous aurez un chant comme dans la nuit où l’on consacre une fête[a], et la joie au cœur comme celui qui va au son de la flûte[b] pour se rendre à la montagne de Yahvé[c], auprès du Rocher d’Israël[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme pendant la nuit où une fête est consacrée ». La formulation hébraïque peut désigner la nuit liée à la consécration ou à l’observance d’une fête.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec une flûte » ou « avec un instrument à vent ». Le mot hébreu désigne un instrument à vent employé dans un contexte festif.'
    reason: lexical_alternative
  - marker: c
    text: « Yahvé » rend le nom divin YHWH ; selon l’usage traditionnel, on peut aussi traduire par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: d
    text: 'Ou : « vers le Rocher d’Israël ». « Rocher » est ici un titre divin qui évoque la force, la stabilité et le refuge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁיר יִהְיֶה לָכֶם
  choice: Vous chanterez
  rationale: La tournure hébraïque signifie littéralement « le chant sera pour vous ». Le verbe français exprime naturellement l’expérience promise, sans ajouter l’idée d’un chant particulier absent du contexte immédiat français.
- source_word: כְּלֵיל הִתְקַדֶּשׁ חָג
  choice: comme dans la nuit où l’on célèbre une fête sacrée
  rationale: La comparaison évoque une nuit de fête cultuelle, vraisemblablement dans un cadre de pèlerinage. « Fête sacrée » garde la mise à part religieuse exprimée par קדשׁ, tandis que « célèbre » donne une formulation française naturelle.
- source_word: וְשִׂמְחַת לֵבָב
  choice: vous aurez le cœur en joie
  rationale: Cette expression idiomatique actuelle conserve le sens concret de « joie du cœur » et rend explicite, sans changer le sens, la relation de la proposition nominale avec « pour vous ».
- source_word: כַּהוֹלֵךְ בֶּחָלִיל
  choice: comme celui qui marche au son de la flûte
  rationale: Le participe est générique. חליל désigne une flûte ou un chalumeau accompagnant ici une marche festive ; « au son de la flûte » communique clairement cet accompagnement.
- source_word: לָבוֹא בְהַר יְהוָה
  choice: pour se rendre à la montagne de Yahvé
  rationale: L’infinitif indique le but ou la destination. Avec un verbe de mouvement, la préposition בְ se rend naturellement par « à » en français.
- source_word: אֶל צוּר יִשְׂרָאֵל
  choice: vers le Rocher d’Israël
  rationale: « Rocher » conserve la métaphore divine de solidité, de force et de refuge. La majuscule signale son emploi comme titre divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin YHWH. « Yahvé » est une forme française courante qui le présente comme un nom propre plutôt que de le remplacer silencieusement par un titre ; la note indique l’usage traditionnel concurrent.
- issue: Nuance cultuelle de הִתְקַדֶּשׁ חָג
  choice: la nuit où l’on célèbre une fête sacrée
  alternative: la nuit où une fête est consacrée
  rationale: La syntaxe condensée peut évoquer soit la consécration de la fête, soit l’observance d’une nuit festive mise à part. Le texte principal rend naturellement la scène cultuelle sans préciser de quelle fête il s’agit, et la note conserve l’autre formulation.
- issue: Relation entre la montagne de YHWH et le Rocher d’Israël
  choice: à la montagne de Yahvé, vers le Rocher d’Israël
  alternative: à la montagne de Yahvé, auprès du Rocher d’Israël
  rationale: Les deux compléments successifs sont maintenus sans décider si le second désigne Yahvé directement, le sanctuaire comme lieu de sa présence, ou une apposition théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par deux comparaisons introduites par « comme ». Les formulations cultuelles restent compréhensibles sans vocabulaire confessionnel spécialisé.
