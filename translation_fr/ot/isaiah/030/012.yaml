source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל יַ֥עַן מָֽאָסְ/כֶ֖ם בַּ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/תִּבְטְחוּ֙ בְּ/עֹ֣שֶׁק וְ/נָל֔וֹז וַ/תִּֽשָּׁעֲנ֖וּ עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Saint d’Israël : « Puisque vous avez rejeté cette parole[a], que vous avez mis votre confiance dans l’oppression et la perversité, et que vous vous êtes appuyés sur cela[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ce message » ou « cette affaire » : le mot hébreu peut avoir ces différents sens.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom hébreu est au singulier (« sur lui ») ; il peut viser la perversité ou l’ensemble formé par l’oppression et la perversité. « Oppression » peut aussi se traduire par « extorsion », et « perversité » par « ce qui est tortueux ».
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de la réprimande précédente.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique exacte et plus naturelle en français moderne que le calque « ainsi dit ».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Rend directement le titre caractéristique d’Ésaïe et en conserve la force théologique.
- source_word: יַעַן
  choice: Puisque
  rationale: Introduit clairement la cause du jugement annoncé, tout en s’intégrant à une phrase qui se poursuit au verset suivant.
- source_word: מָאַסְכֶם
  choice: vous avez rejeté
  rationale: Exprime la répudiation volontaire sans accentuer indûment l’idée de mépris affectif.
- source_word: בַּדָּבָר הַזֶּה
  choice: cette parole
  rationale: Dans ce contexte prophétique, דָּבָר désigne probablement la parole ou le message divin qui vient d’être communiqué, tout en gardant une certaine amplitude sémantique.
- source_word: וַתִּבְטְחוּ
  choice: vous avez mis votre confiance
  rationale: Rend clairement l’idée de placer sa sécurité dans quelque chose et prépare le parallélisme avec « vous vous êtes appuyés ».
- source_word: בְּעֹשֶׁק
  choice: dans l’oppression
  rationale: Conserve la portée générale du recours à des moyens injustes; « extorsion » demeure possible selon le contexte.
- source_word: וְנָלוֹז
  choice: et la perversité
  rationale: Rend l’idée de ce qui est tordu ou dévoyé dans un français naturel, digne et moralement marqué.
- source_word: וַתִּשָּׁעֲנוּ
  choice: vous vous êtes appuyés
  rationale: Préserve l’image concrète du verbe hébreu, celle d’un soutien sur lequel on s’appuie.
- source_word: עָלָיו
  choice: sur elles
  rationale: Le pronom hébreu est singulier, mais le français reprend naturellement les deux réalités coordonnées, « l’oppression et la perversité », par un pluriel sans trancher laquelle serait visée isolément.
theological_decisions:
- issue: Référent de « cette parole »
  choice: la parole prophétique qui vient d’être donnée
  alternative: ce message; cette chose; cette affaire
  rationale: Le contexte favorise la parole d’avertissement divine, mais la note maintient la largeur sémantique de דָּבָר.
- issue: Nature de ce en quoi le peuple place sa confiance
  choice: l’oppression et la perversité
  alternative: l’extorsion et ce qui est tortueux; la fraude et la tromperie
  rationale: La formulation conserve la condamnation éthique générale sans identifier abusivement un mécanisme politique ou historique précis.
- issue: Référent et nombre de עָלָיו
  choice: reprise collective des deux moyens injustes par « elles »
  alternative: « sur elle », visant spécialement la perversité ou l’ensemble conçu comme une seule réalité
  rationale: Le singulier hébreu est authentique, mais un singulier français créerait une référence artificiellement étroite ou ambiguë; la note signale la forme source.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique est rendue idiomatiquement. La phrase reste ouverte par une virgule, puisque la conséquence annoncée arrive au verset suivant.
