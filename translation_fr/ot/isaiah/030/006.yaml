id: ISA.30.6
reference: Isaiah 30:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַשָּׂ֖א בַּהֲמ֣וֹת נֶ֑גֶב בְּ/אֶרֶץ֩ צָרָ֨ה וְ/צוּקָ֜ה לָבִ֧יא וָ/לַ֣יִשׁ מֵ/הֶ֗ם אֶפְעֶה֙ וְ/שָׂרָ֣ף מְעוֹפֵ֔ף יִשְׂאוּ֩ עַל כֶּ֨תֶף עֲיָרִ֜ים חֵֽילֵ/הֶ֗ם וְ/עַל דַּבֶּ֤שֶׁת גְּמַלִּים֙ אֽוֹצְרֹתָ֔/ם עַל עַ֖ם לֹ֥א יוֹעִֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
translation:
  language: fr
  text: 'Oracle sur les bêtes du Néguev[a] :

    À travers un pays de détresse et d’angoisse,

    où vivent la lionne et le lion[b],

    la vipère et le serpent brûlant qui vole,

    ils transportent leurs richesses sur les épaules de jeunes ânes

    et leurs trésors sur les bosses des chameaux,

    à destination d’un peuple qui ne leur sera d’aucun profit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fardeau concernant les bêtes du Sud ». Le mot hébreu du titre peut désigner un oracle prophétique ou un fardeau, et « Néguev » peut aussi avoir le sens plus général de « Sud ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le lion et le lion ». L’hébreu emploie deux termes distincts, mais leur différence précise dans ce contexte est incertaine.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui ne leur sera d’aucune aide ». Le verbe hébreu peut signifier « être utile », « procurer un avantage » ou « aider ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Oracle
  rationale: Dans les titres prophétiques, le terme introduit une déclaration solennelle. « Oracle » est établi en français biblique tout en restant compréhensible; « fardeau » serait plus littéral mais obscurcirait ici la fonction du titre.
- source_word: בַּהֲמוֹת נֶגֶב
  choice: les bêtes du Néguev
  rationale: Le pluriel désigne des animaux, probablement les bêtes de somme mentionnées ensuite. « Néguev » conserve la référence géographique possible sans réduire le terme au simple point cardinal.
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  choice: À travers un pays de détresse et d’angoisse
  rationale: La préposition est comprise comme indiquant l’espace traversé. Les deux noms proches expriment l’épreuve, l’oppression et l’extrême difficulté; la paire française conserve leur intensification.
- source_word: לָבִיא וָלַיִשׁ
  choice: la lionne et le lion
  rationale: L’hébreu emploie deux mots distincts pour le lion. « Lionne et lion » les différencie naturellement, tout en signalant en note que la distinction zoologique exacte demeure incertaine.
- source_word: אֶפְעֶה
  choice: la vipère
  rationale: Le terme désigne un serpent venimeux; « vipère » est précis, courant et immédiatement intelligible.
- source_word: שָׂרָף מְעוֹפֵף
  choice: le serpent brûlant qui vole
  rationale: Cette formulation conserve les deux éléments de l’expression hébraïque et son image saisissante sans imposer une identification zoologique ou symbolique.
- source_word: יִשְׂאוּ
  choice: ils transportent
  rationale: Dans ce contexte de caravanes chargées de biens, « transportent » exprime naturellement l’action, tandis que le pronom maintient le sujet implicite et indéterminé de l’hébreu.
- source_word: עַל כֶּתֶף עֲיָרִים
  choice: sur les épaules de jeunes ânes
  rationale: « Épaules » conserve l’image précise de l’hébreu, et עֲיָרִים désigne ici de jeunes ânes employés comme bêtes de somme.
- source_word: חֵילֵהֶם
  choice: leurs richesses
  rationale: Parmi les sens possibles de force, ressources et richesse, le contexte des biens envoyés à une puissance étrangère favorise « richesses ».
- source_word: עַל דַּבֶּשֶׁת גְּמַלִּים
  choice: sur les bosses des chameaux
  rationale: Le nom hébreu désigne spécifiquement la bosse du chameau; la traduction en conserve le détail concret et le parallélisme avec les épaules des ânes.
- source_word: אֽוֹצְרֹתָם
  choice: leurs trésors
  rationale: Le terme évoque des biens précieux mis en réserve; « trésors » convient au contexte d’un envoi coûteux.
- source_word: עַל עַם לֹא יוֹעִילוּ
  choice: à destination d’un peuple qui ne leur sera d’aucun profit
  rationale: Après le mouvement de transport, עַל marque ici la destination. Le verbe peut signifier procurer un avantage ou venir en aide; « d’aucun profit » conserve la nuance d’utilité et souligne la futilité de la démarche.
theological_decisions:
- issue: Nature de la liste des créatures dangereuses du Néguev
  choice: Présenter les animaux comme faisant partie du dangereux trajet dans le désert, sans les allégoriser.
  alternative: Y voir des symboles de puissances politiques, ou réduire l’ensemble à de simples bêtes sauvages et serpents.
  rationale: Le verset met en relief le péril et la futilité de l’ambassade. La traduction directe préserve l’imagerie prophétique sans introduire une identification symbolique que le texte n’explicite pas.
translation_notes:
  register: Français international actuel, solennel sans archaïsme. La disposition poétique met en valeur la progression du trajet périlleux vers sa conclusion ironique. Les images concrètes et les ambiguïtés lexicales significatives sont conservées, avec des variantes en notes.
