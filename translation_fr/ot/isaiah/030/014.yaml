    issue: La formulation « comme celui d’une jarre » ne reproduit pas explicitement la répétition hébraïque autour de la brisure.
    rationale: Le texte dit littéralement, de manière emphatique, que sa rupture est comme la rupture d’un récipient de potier. « Comme le bris d’une jarre » conserve mieux cette image.
  - severity: low
    issue: « Une réserve » peut désigner une provision de façon trop générale.
    rationale: גבא désigne un lieu ou une étendue où l’eau est rassemblée. « Une réserve d’eau » explicite le référent sans trancher entre citerne, bassin ou mare.
