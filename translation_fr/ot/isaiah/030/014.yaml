  text: וּ֠/שְׁבָרָ/הּ כְּ/שֵׁ֨בֶר נֵ֧בֶל יוֹצְרִ֛ים כָּת֖וּת לֹ֣א יַחְמֹ֑ל וְ/לֹֽא יִמָּצֵ֤א בִ/מְכִתָּת/וֹ֙ חֶ֔רֶשׂ לַ/חְתּ֥וֹת אֵשׁ֙ מִ/יָּק֔וּד וְ/לַ/חְשֹׂ֥ף מַ֖יִם מִ/גֶּֽבֶא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
translation:
  language: fr
  text: Son effondrement sera comme le bris d’une jarre de potier, fracassée sans ménagement, au point qu’on ne trouvera parmi ses débris aucun tesson permettant de prendre du feu dans le foyer[a] ou de puiser de l’eau dans une réserve d’eau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de recueillir des braises ou des charbons ardents dans le foyer ». L’hébreu dit littéralement « prendre du feu du lieu où il brûle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans une citerne » ou « dans une mare ». Le terme hébreu désigne plus généralement une accumulation d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  choice: Son effondrement
  rationale: Le nom avec suffixe féminin renvoie à la réalité personnifiée du contexte. « Effondrement » exprime ici la ruine annoncée et introduit naturellement la comparaison.
- source_word: כְּשֵׁבֶר
  choice: comme celui de
  rationale: Le pronom reprend « effondrement » sans répéter lourdement le même terme, tout en conservant la comparaison explicite de l’hébreu.
- source_word: נֵבֶל יוֹצְרִים
  choice: une jarre de potier
  rationale: נֵבֶל désigne un récipient, et יוֹצְרִים l’associe au travail du potier. « Jarre de potier » est concret et naturel en français moderne.
- source_word: כָּתוּת
  choice: fracassée
  rationale: Le terme évoque un récipient violemment brisé en morceaux; « fracassée » restitue cette force.
- source_word: לֹא יַחְמֹל
  choice: sans ménagement
  rationale: Littéralement, « il ne ménage pas / n’a pas pitié ». Dans l’image d’un objet brisé, « sans ménagement » est idiomatique et évite d’attribuer artificiellement un sentiment à la jarre.
- source_word: וְלֹא יִמָּצֵא
  choice: au point qu’on ne trouvera
  rationale: Cette tournure rend la conséquence de la destruction totale et le passif impersonnel hébreu.
- source_word: בִמְכִתָּתוֹ
  choice: parmi ses débris
  rationale: Le mot renvoie au résultat du concassage. « Parmi ses débris » exprime clairement l’ensemble des morceaux produits.
- source_word: חֶרֶשׂ
  choice: aucun tesson
  rationale: חֶרֶשׂ est un fragment de poterie. « Tesson » est le terme français précis et courant dans ce contexte.
- source_word: לַחְתּוֹת אֵשׁ
  choice: prendre du feu
  rationale: Cette formulation reste proche de l’hébreu, qui dit littéralement « prendre du feu », sans imposer qu’il s’agisse précisément de braises ou de charbons.
- source_word: מִיָּקוּד
  choice: dans le foyer
  rationale: Le nom désigne un lieu où brûle le feu. « Foyer » convient naturellement à l’usage domestique évoqué.
- source_word: וְלַחְשֹׂף מַיִם
  choice: puiser de l’eau
  rationale: Dans ce contexte, le verbe décrit l’action de retirer ou recueillir de l’eau avec un tesson; « puiser » est idiomatique en français.
- source_word: מִגֶּבֶא
  choice: dans une réserve
  rationale: גֶּבֶא peut désigner une étendue ou accumulation d’eau. « Réserve » conserve cette généralité sans imposer avec certitude une citerne aménagée.
