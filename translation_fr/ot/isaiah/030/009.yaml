id: ISA.30.9
reference: Isaiah 30:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י עַ֤ם מְרִי֙ ה֔וּא בָּנִ֖ים כֶּחָשִׁ֑ים בָּנִ֕ים לֹֽא אָב֥וּ שְׁמ֖וֹעַ תּוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/009.yaml
  text: For they are a rebellious people[a], lying children, children unwilling to hear the law of Yahweh[b],
translation:
  language: fr
  text: Car c’est un peuple rebelle, des enfants menteurs[a], des enfants qui ne veulent pas écouter la loi de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des enfants trompeurs » ou « des enfants qui mentent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des enfants qui refusent d’écouter l’enseignement de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’évaluation prophétique précédente et conserve naturellement sa valeur causale ou explicative.
- source_word: עַם מְרִי
  choice: un peuple rebelle
  rationale: Le nom מְרִי, « rébellion », qualifie ici le peuple; la tournure adjectivale est naturelle en français et maintient la portée morale et relationnelle de l’accusation.
- source_word: בָּנִים
  choice: des enfants
  rationale: Le terme désigne métaphoriquement les membres du peuple comme des enfants; ce choix inclusif et courant n’en restreint pas la portée aux hommes.
- source_word: כֶּחָשִׁים
  choice: menteurs
  rationale: Le mot caractérise ces enfants par le mensonge ou la fausseté. « Menteurs » rend directement la vigueur de l’accusation, tandis que « trompeurs » reste une possibilité lexicale.
- source_word: לֹא אָבוּ
  choice: qui ne veulent pas
  rationale: La formulation exprime un refus volontaire, et non une simple incapacité; le présent convient à la caractérisation générale du peuple dans ce discours.
- source_word: שְׁמוֹעַ
  choice: écouter
  rationale: « Écouter » exprime mieux que le simple « entendre » l’accueil attentif attendu, sans expliciter excessivement l’idée d’obéir qui peut être impliquée.
- source_word: תּוֹרַת
  choice: la loi
  rationale: « Loi » conserve ici le poids autoritatif et relationnel de la Torah de Yahweh; « enseignement » ou « instruction » demeure une autre traduction légitime.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre.
- issue: Sens de תּוֹרָה dans ce contexte prophétique
  choice: la loi
  alternative: l’enseignement; l’instruction
  rationale: « Loi » maintient la force normative de la Torah dans l’accusation de rébellion, tandis que la note conserve son champ sémantique plus large.
- issue: Portée de שׁמע
  choice: écouter
  alternative: entendre; obéir à
  rationale: Le verbe peut impliquer l’obéissance dans un contexte d’alliance, mais « écouter » préserve cette implication sans la transformer en sens explicitement unique.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « des enfants » reproduit l’insistance du texte hébreu. La syntaxe reste directe et accusatrice, conformément au registre prophétique.
