base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
translation:
  language: fr
  text: Car un peuple habitera à Sion, à Jérusalem. Tu ne pleureras assurément plus[a]. Il te fera certainement grâce[b] au son de ton cri ; dès qu’il l’entendra, il te répondra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement une tournure redoublée : « pleurer, tu ne pleureras pas », qui renforce la négation.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie de nouveau une tournure redoublée : « faire grâce, il te fera grâce », pour souligner la certitude de sa faveur.'
    reason: lexical_alternative
  - marker: c
    text: La forme hébraïque est un parfait, littéralement « il t’a répondu » ; dans cette promesse, elle peut présenter comme certaine une réponse encore à venir.
    reason: textual_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement de la promesse précédente et conserve le lien logique avec le contexte.
- source_word: עַם בְּצִיּוֹן יֵשֵׁב בִּירוּשָׁלִָם
  choice: un peuple habitera à Sion, à Jérusalem
  rationale: Maintient « peuple » comme sujet collectif, rend ישׁב par le verbe d’établissement « habiter » et conserve les deux indications géographiques parallèles.
- source_word: בָּכוֹ לֹא תִבְכֶּה
  choice: Tu ne pleureras vraiment plus
  rationale: L’infinitif absolu suivi du verbe conjugué renforce ici la négation ; « vraiment plus » exprime cette insistance en français naturel.
- source_word: חָנוֹן יָחְנְךָ
  choice: Il te fera certainement grâce
  rationale: La racine חנן exprime la faveur accordée, tandis que l’infinitif absolu souligne la certitude de l’action.
- source_word: לְקוֹל זַעֲקֶךָ
  choice: au son de ton cri
  rationale: Traduction proche de l’image auditive de l’hébreu, sans anticiper le verbe « entendre » de la proposition suivante.
- source_word: כְּשָׁמְעָתוֹ
  choice: dès qu’il l’entendra
  rationale: Le tour temporel peut signifier « quand » ou « dès que » ; ce dernier exprime naturellement l’immédiateté suggérée par le contexte.
- source_word: עָנָךְ
  choice: il te répondra
  rationale: Le parfait hébreu est compris dans la perspective future de la promesse. Le français rend explicitement le sujet divin exigé par sa syntaxe.
theological_decisions:
- issue: Sujet implicite des dernières propositions
  choice: « Il », renvoyant au Seigneur dans le contexte
  alternative: Répéter explicitement « le Seigneur »
  rationale: L’hébreu n’énonce pas ici le nom divin. Le pronom fournit le sujet nécessaire en français sans ajouter une désignation absente du verset.
- issue: Valeur temporelle de עָנָךְ
  choice: 'Futur : « il te répondra »'
  alternative: 'Passé accompli : « il t’a répondu »'
  rationale: Bien que la forme soit un parfait, la série de promesses et la réponse qui suit l’écoute du cri favorisent une valeur future ou certaine, sans nier l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse hébraïque au peuple considéré collectivement. « Sion » et « Jérusalem » sont maintenus sans paraphrase.
