source:
  edition: WLC
  text: וְ/נָתַ֨ן לָ/כֶ֧ם אֲדֹנָ֛/י לֶ֥חֶם צָ֖ר וּ/מַ֣יִם לָ֑חַץ וְ/לֹֽא יִכָּנֵ֥ף עוֹד֙ מוֹרֶ֔י/ךָ וְ/הָי֥וּ עֵינֶ֖י/ךָ רֹא֥וֹת אֶת מוֹרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
translation:
  language: fr
  text: Le Seigneur vous donnera du pain de détresse et de l’eau d’oppression[a]. Pourtant, celui qui vous enseigne ne se cachera plus[b], et vos yeux verront celui qui vous enseigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du pain d’adversité et de l’eau d’affliction ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se comprendre ainsi : « ceux qui vous enseignent ne seront plus cachés » ou, selon l’interprétation traditionnelle : « celui qui vous enseigne ne sera plus relégué dans un coin ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rendu français courant et digne du titre divin, sans confondre ce terme avec le nom propre YHWH.
- source_word: לֶחֶם צָר
  choice: du pain de détresse
  rationale: Préserve la métaphore concrète du pain marqué par l’épreuve et le parallélisme poétique.
- source_word: מַיִם לָחַץ
  choice: de l’eau d’oppression
  rationale: לָחַץ évoque la pression, l’oppression ou l’affliction ; ce choix conserve la formulation forte et le parallèle avec « pain de détresse ».
- source_word: יִכָּנֵף
  choice: ne se cachera plus
  rationale: Le nifal de כנף indique probablement le fait d’être caché ou de se tenir dissimulé. La tournure pronominale est naturelle en français tout en maintenant la lecture personnelle du sujet.
- source_word: מוֹרֶיךָ
  choice: celui qui vous enseigne
  rationale: La forme hébraïque permet une compréhension au singulier ou au pluriel. Cette formulation française rend clairement la lecture singulière retenue dans le texte sans identifier théologiquement le référent.
- source_word: עֵינֶיךָ רֹאוֹת
  choice: vos yeux verront
  rationale: Traduction directe qui conserve l’accent hébraïque sur la perception visuelle personnelle.
theological_decisions:
- issue: Identité et nombre de מוֹרֶיךָ (« celui qui vous enseigne »)
  choice: Référent singulier non précisé, sans majuscule ni identification explicite à Dieu.
  alternative: « ceux qui vous enseignent » pour désigner plusieurs enseignants ou prophètes ; le contexte peut aussi suggérer un référent divin.
  rationale: La forme hébraïque et le contexte permettent plusieurs compréhensions. Le texte principal garde la lecture singulière compatible avec le verbe, tandis que la note préserve la lecture plurielle et l’interprétation traditionnelle sans trancher l’identité du référent.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme poétique et les images concrètes de l’hébreu sont conservés. « Celui qui vous enseigne » évite le masculin professionnel plus marqué de « maître » et maintient l’ambiguïté sur l’identité du référent.
