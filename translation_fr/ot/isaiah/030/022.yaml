review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les revêtements précieux des idoles sont profanés puis rejetés. Toutefois, « une chose souillée par les règles » est trop indéterminé pour כְּמוֹ דָוָה, image traditionnellement comprise comme un linge menstruel. Le pronom final hébreu לוֹ est singulier ; le français doit éviter de le transformer explicitement en pluriel.'
  naturalness: La phrase est fluide dans l’ensemble, mais « comme une chose souillée par les règles » est lourd et peu idiomatique dans un registre biblique moderne. « Comme un linge menstruel » rend l’image de manière plus nette et naturelle.
  terminology: « Rendre impur », « revêtement », « idoles sculptées » et « image en métal fondu » préservent convenablement le vocabulaire cultuel et matériel. « Linge menstruel » maintient la force de l’image sans euphémisation.
  issues:
  - severity: medium
    issue: Image de כְּמוֹ דָוָה rendue de façon trop vague
    rationale: « Une chose souillée par les règles » ne donne pas le référent concret traditionnellement impliqué par l’expression et affaiblit l’image de rejet. « Un linge menstruel » est plus précis et idiomatique.
  - severity: low
    issue: Pronom final rendu au pluriel
    rationale: Le texte hébreu porte le singulier לוֹ (« à lui/à elle/à cela »), malgré les antécédents collectifs. En français, l’impératif direct sans pronom conserve l’adresse et évite d’imposer un pluriel absent de la forme source.
  revised_text: 'Vous rendrez impur le revêtement d’argent de vos idoles sculptées et le placage d’or de votre image en métal fondu. Vous les jetterez comme un linge menstruel ; vous direz : « Dehors ! »'
  revised_footnotes: []
  revision_rationale: La révision précise l’image menstruelle, conserve le caractère cultuel de l’impureté et évite de surtraduire le pronom singulier final par un pluriel explicite. « Jetterez » exprime naturellement, dans ce contexte de répudiation, le rejet que décrit le verbe hébreu.
