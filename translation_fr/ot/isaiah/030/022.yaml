- from: 'Vous rendrez impur le revêtement d’argent de vos idoles sculptées et le placage d’or de vos statues en métal fondu. Vous les disperserez comme une chose souillée par les règles ; vous leur direz : « Dehors ! »'
  to: 'Vous rendrez impur le revêtement d’argent de vos idoles sculptées et le placage d’or de votre image en métal fondu. Vous les jetterez comme un linge menstruel ; vous direz : « Dehors ! »'
  rationale: La révision précise l’image menstruelle, conserve le caractère cultuel de l’impureté et évite de surtraduire le pronom singulier final par un pluriel explicite. « Jetterez » exprime naturellement, dans ce contexte de répudiation, le rejet que décrit le verbe hébreu.
