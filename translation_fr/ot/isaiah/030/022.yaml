id: ISA.30.22
reference: Isaiah 30:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: fr
  text: 'Vous rendrez impur le revêtement d’argent de vos idoles sculptées et le placage d’or de votre image en métal fondu. Vous les jetterez comme un linge menstruel ; vous direz : « Dehors ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטִמֵּאתֶם
  choice: Vous rendrez impur
  rationale: Conserve le sens cultuel fort de טמא sans réduire le verbe à une simple destruction matérielle.
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  choice: le revêtement d’argent de vos idoles sculptées
  rationale: צִפּוּי désigne ce qui recouvre, et פְּסִילִים des images taillées ou sculptées.
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  choice: le placage d’or de vos statues en métal fondu
  rationale: אֲפֻדָּה évoque ici un revêtement ou placage, tandis que מַסֵּכָה désigne une image obtenue par fonte.
- source_word: תִּזְרֵם
  choice: Vous les disperserez
  rationale: Le suffixe pluriel renvoie naturellement aux objets idolâtres mentionnés dans les deux groupes précédents.
- source_word: כְּמוֹ דָוָה
  choice: comme une chose souillée par les règles
  rationale: דָוָה renvoie à l’impureté liée aux menstruations ; cette formulation garde l’image cultuelle tout en restant claire en français moderne.
- source_word: צֵא
  choice: Dehors !
  rationale: Rend l’impératif masculin singulier comme une injonction énergique de rejet, idiomatique en français.
theological_decisions:
- issue: Nature du rejet des idoles
  choice: Maintenir le vocabulaire d’impureté cultuelle et l’image menstruelle
  alternative: Paraphraser par « comme un objet répugnant » ou « comme un linge sale »
  rationale: Le texte associe délibérément les idoles à l’impureté rituelle ; neutraliser cette image affaiblirait sa portée polémique.
- issue: Référent du pronom dans « vous leur direz »
  choice: Pluriel renvoyant à l’ensemble des objets idolâtres
  alternative: Singulier, suivant la forme grammaticale de צֵא et du suffixe לוֹ
  rationale: Le discours vise les idoles et images évoquées collectivement. Le français emploie naturellement le pluriel, tandis que l’hébreu peut personnifier ou collectiviser le référent au singulier.
translation_notes:
  register: Français international moderne, digne et direct. « Une chose souillée par les règles » explicite l’image sans employer une expression clinique trop froide ni ajouter le mot « linge », absent de l’hébreu.
