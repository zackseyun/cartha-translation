  to: 'Mais vous avez dit : « Non ! Nous nous enfuirons à cheval. » C’est pourquoi vous vous enfuirez. Et vous avez dit : « Nous monterons sur des montures rapides[a]. » C’est pourquoi ceux qui vous poursuivent seront rapides.'
  rationale: La révision élimine le « car » causal, qui obscurcit la réplique hébraïque, et adopte « monter sur » pour une expression française plus idiomatique. Elle conserve les répétitions rhétoriques essentielles (« s’enfuir », « rapides »), le contraste judiciaire et l'ambiguïté du nom sous-entendu après « rapide ».
