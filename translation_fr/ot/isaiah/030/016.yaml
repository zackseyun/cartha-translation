  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
translation:
  language: fr
  text: 'Mais vous avez dit : « Non ! Nous nous enfuirons à cheval. » C’est pourquoi vous vous enfuirez. Et vous avez dit : « Nous monterons sur des montures rapides[a]. » C’est pourquoi ceux qui vous poursuivent seront rapides.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « sur [ce qui est] rapide » ; le nom est sous-entendu et, dans le contexte, désigne probablement des chevaux ou des montures.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  choice: Mais vous avez dit
  rationale: Le waw fait progresser le discours, tandis que « Mais » rend l’opposition contextuelle entre l’appel divin du verset précédent et la réponse du peuple.
- source_word: לֹא כִּי
  choice: Non ! Car
  rationale: Cette formulation conserve à la fois le refus énergique exprimé par לֹא et l’explication introduite par כִּי.
- source_word: עַל סוּס נָנוּס
  choice: nous nous enfuirons à cheval
  rationale: « À cheval » est l’expression française naturelle pour le singulier collectif סוּס, et « nous nous enfuirons » rend clairement le mouvement de fuite tout en préparant la reprise ironique du même verbe.
- source_word: עַל כֵּן תְּנוּסוּן
  choice: C’est pourquoi vous vous enfuirez
  rationale: 'La reprise de « s’enfuir » conserve le jeu verbal et le retournement judiciaire : la fuite projetée devient la fuite imposée.'
- source_word: עַל קַל נִרְכָּב
  choice: Nous monterons des montures rapides[a]
  rationale: Le contexte équestre permet d’expliciter le nom sous-entendu après l’adjectif substantivé קַל. « Montures » évite une répétition lourde de « chevaux » et convient au verbe רכב.
- source_word: יִקַּלּוּ רֹדְפֵיכֶם
  choice: ceux qui vous poursuivent seront rapides
  rationale: Cette formulation naturelle rend le participe substantivé רֹדְפֵיכֶם et maintient l’écho ironique entre la rapidité des montures et celle des poursuivants.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief les deux déclarations du peuple et leurs conséquences ironiques, tandis que la répétition de « s’enfuir » et de « rapides » préserve la structure rhétorique de l’hébreu.
