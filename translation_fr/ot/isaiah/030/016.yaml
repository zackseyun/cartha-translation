    issue: « Non ! Car nous nous enfuirons à cheval »
    rationale: Le lien causal exprimé par « car » est maladroit dans la bouche des interlocuteurs et ne rend pas bien la force corrective ou emphatique de לֹא כִּי dans ce contexte.
  - severity: low
    issue: « Nous monterons des montures rapides »
    rationale: Le tour est possible, mais « monter sur des montures rapides » est plus naturel en français international moderne et rend explicitement la préposition עַל.
  - severity: low
    issue: Formulation de la note
    rationale: '« L’hébreu dit simplement “des rapides” » ne reflète pas exactement la construction : le texte porte littéralement « sur [un] rapide », l''adjectif substantivé ayant un nom implicite déterminé par le contexte.'
