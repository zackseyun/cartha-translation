  to: Voici[a], le nom de Yahweh vient de loin ; sa colère brûle, et une épaisse fumée s’élève[b] ; ses lèvres sont pleines d’indignation, et sa langue est comme un feu qui dévore.
  rationale: La révision conserve l’interprétation contextuellement plausible d’une fumée épaisse, mais la présente comme une proposition coordonnée plutôt que comme un attribut de la colère. La note signale explicitement que le syntagme hébreu demeure incertain et fournit une possibilité plus littérale. « Indignation » distingue naturellement זַעַם de la colère déjà exprimée dans le membre précédent.
