source:
  edition: WLC
  text: הִנֵּ֤ה שֵׁם יְהוָה֙ בָּ֣א מִ/מֶּרְחָ֔ק בֹּעֵ֣ר אַפּ֔/וֹ וְ/כֹ֖בֶד מַשָּׂאָ֑ה שְׂפָתָי/ו֙ מָ֣לְאוּ זַ֔עַם וּ/לְשׁוֹנ֖/וֹ כְּ/אֵ֥שׁ אֹכָֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
translation:
  language: fr
  text: Voici[a], le nom de Yahweh vient de loin ; sa colère brûle, et une épaisse fumée s’élève[b] ; ses lèvres sont pleines d’indignation, et sa langue est comme un feu qui dévore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regardez » ; la particule hébraïque attire vivement l’attention sur la vision.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est difficile ; plus littéralement : « et le poids d’un soulèvement ». Elle peut désigner ici une épaisse fumée qui s’élève.'
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Particule qui attire l’attention et introduit vivement la vision. « Voici » conserve sa force déictique dans un registre biblique digne, sans être obscur.
- source_word: שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: Conserve explicitement « le nom » comme sujet, au lieu de le réduire à Yahweh lui-même, et maintient ainsi la nuance de présence ou de puissance manifestée.
- source_word: בָּא מִמֶּרְחָק
  choice: vient de loin
  rationale: Rend directement le mouvement présenté dans la scène prophétique, en français naturel.
- source_word: בֹּעֵר אַפּוֹ
  choice: sa colère est brûlante
  rationale: אַפּ désigne littéralement le nez ou la narine, mais exprime idiomatiquement la colère. La formulation française conserve l’image de la combustion.
- source_word: וְכֹבֶד מַשָּׂאָה
  choice: accompagnée d’une épaisse fumée
  rationale: Interprétation contextuelle d’une expression hébraïque difficile. Elle s’accorde avec la théophanie de feu, tout en signalant en note l’incertitude et le rendu plus littéral possible.
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  choice: ses lèvres sont pleines de fureur
  rationale: Rendu proche de la forme hébraïque qui préserve l’image des lèvres et le registre du jugement divin.
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  choice: et sa langue est comme un feu dévorant
  rationale: Préserve la comparaison et la force active du participe אֹכָלֶת dans une expression française vive et naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Maintien de « nom » comme sujet de la venue
  choice: le nom de Yahweh vient
  alternative: Yahweh vient
  rationale: L’hébreu fait explicitement du « nom de Yahweh » le sujet. Le maintenir préserve la tension entre l’identité transcendante de Dieu et sa présence manifestée dans le jugement.
- issue: Interprétation de וְכֹבֶד מַשָּׂאָה
  choice: accompagnée d’une épaisse fumée
  alternative: et une lourdeur d’élévation ; et un lourd fardeau
  rationale: Le contexte de feu peut suggérer une masse ou colonne de fumée, mais l’expression demeure incertaine. La note conserve ouvertement l’autre possibilité au lieu de résoudre silencieusement la difficulté.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe reste lisible tout en conservant les images corporelles et ardentes de l’hébreu ainsi que l’ambiguïté de l’expression וְכֹבֶד מַשָּׂאָה.
