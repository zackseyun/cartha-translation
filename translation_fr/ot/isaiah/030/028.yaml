revisions:
- from: Son souffle est comme un torrent qui déborde[a] ; il monte jusqu’au cou. Il secoue les nations dans le crible du néant[b], et un mors qui égare est placé entre les mâchoires des peuples[c].
  to: Son souffle est comme un torrent en crue[a] ; il monte jusqu’au cou[b], pour tamiser les nations au moyen d’un crible de néant[c]. Une bride qui égare est sur les mâchoires des peuples[d].
  rationale: La révision améliore la fidélité à la préposition hébraïque et au terme de harnachement, rend le criblage plus naturel en français, et sépare les notes afin que chaque ambiguïté textuelle soit ancrée au bon endroit. Elle conserve la portée énigmatique et judiciaire des métaphores.
