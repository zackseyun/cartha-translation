  variant: modern international French
source:
  edition: WLC
  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
translation:
  language: fr
  text: Son souffle est comme un torrent en crue[a] ; il monte jusqu’au cou[b], pour tamiser les nations au moyen d’un crible de néant[c]. Une bride qui égare est sur les mâchoires des peuples[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son esprit » ou « son vent ». L’expression peut aussi se traduire par « comme un torrent impétueux » ou « comme un cours d’eau qui déborde ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie littéralement « diviser » ou « fendre ». Dans l’image du torrent, il est généralement compris au sens d’atteindre ou de monter jusqu’au cou.
    reason: textual_ambiguity
  - marker: c
    text: Ou « un crible de vanité », « un crible de fausseté » ou « un crible sans valeur ».
    reason: lexical_alternative
  - marker: d
    text: Ou « un mors qui égare » ; « les joues des peuples » est aussi possible pour « les mâchoires des peuples ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחוֹ
  choice: son souffle
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. Dans cette scène de jugement, en lien avec ce qui sort de la bouche du SEIGNEUR au verset précédent et avec l’image du torrent, « souffle » garde une image concrète sans exclure entièrement les autres résonances.
- source_word: כְּנַחַל שׁוֹטֵף
  choice: comme un torrent qui déborde
  rationale: נַחַל désigne un cours d’eau ou un torrent, et שׁוֹטֵף exprime une crue qui déborde et emporte. Cette formulation est naturelle en français et conserve la force de l’inondation.
- source_word: עַד צַוָּאר יֶחֱצֶה
  choice: il monte jusqu’au cou
  rationale: חצה signifie normalement « partager, traverser », mais l’expression est comprise ici, dans l’image de la crue, comme indiquant que les eaux atteignent le niveau du cou. « Monte jusqu’au cou » rend clairement cette image tout en signalant par une note l’ambiguïté du verbe.
- source_word: לַהֲנָפָה
  choice: il secoue
  rationale: La forme issue de נוף évoque l’action d’agiter, de secouer ou de vanner. Avec le crible mentionné ensuite, « secoue » restitue l’action sans lisser la métaphore en un simple « trie ».
- source_word: גוֹיִם
  choice: les nations
  rationale: Le terme désigne ici les nations dans le cadre du jugement divin, plutôt qu’une catégorie religieuse spécifique.
- source_word: בְּנָפַת שָׁוְא
  choice: dans le crible du néant
  rationale: נָפָה est un crible. שָׁוְא peut signifier néant, vanité, fausseté ou ce qui est sans valeur. « Du néant » maintient la formulation saisissante et son ambiguïté sans préciser indûment le résultat du criblage.
- source_word: רֶסֶן
  choice: un mors
  rationale: רֶסֶן désigne le dispositif qui maîtrise et dirige un animal, mors ou bride. Avec son emplacement entre les mâchoires, « mors » produit en français l’image anatomique la plus cohérente.
- source_word: מַתְעֶה
  choice: qui égare
  rationale: 'Le participe dérivé de תעה exprime une action causative : faire errer ou conduire hors du chemin. « Qui égare » conserve cette force active.'
- source_word: עַל לְחָיֵי עַמִּים
  choice: est placé entre les mâchoires des peuples
  rationale: לְחִי peut désigner la joue ou la mâchoire, et עַל signifie littéralement « sur ». Pour un mors, le français idiomatique demande « entre les mâchoires » ; la note conserve la formulation plus littérale possible.
theological_decisions:
- issue: Référent du pronom dans « son souffle »
  choice: Le pronom renvoie au SEIGNEUR dans le contexte immédiat du jugement divin.
  alternative: Une force de tempête impersonnelle.
  rationale: Le contexte présente la venue du SEIGNEUR, sa colère, ses lèvres et sa langue. Le possessif maintient son action personnelle sans ajouter de précision doctrinale étrangère au texte.
- issue: Fonction du crible et du mors dans le jugement
  choice: Conserver les métaphores énigmatiques du criblage par le néant et de la direction qui égare.
  alternative: Les expliciter comme destruction certaine des nations ou comme tromperie morale.
  rationale: L’hébreu associe des images tendues dont la portée exacte reste discutée. Une traduction explicative résoudrait indûment leur ambiguïté théologique et poétique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme est conservé, ainsi que les images violentes et volontairement énigmatiques du torrent, du crible et du mors. Les termes confessionnellement marqués sont évités.
