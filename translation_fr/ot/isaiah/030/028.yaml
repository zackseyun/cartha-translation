    rationale: Le texte hébreu emploie עַל, « sur ». L’emplacement « entre » est une adaptation mécanique plausible pour un mors, mais elle introduit une précision non exprimée et dépend du choix interprétatif « mors ».
  - severity: medium
    issue: « Un mors » est moins directement approprié que « une bride » pour רֶסֶן dans cette construction.
    rationale: רֶסֶן peut désigner un dispositif de conduite, mais « bride » rend mieux le terme générique et permet de conserver la formulation spatiale « sur les mâchoires ».
  - severity: low
    issue: La note b porte sur deux éléments distincts et ne permet pas d’identifier clairement l’ambiguïté de יֶחֱצֶה.
    rationale: L’ambiguïté du verbe relatif à la montée jusqu’au cou mérite son propre ancrage; les sens possibles de שָׁוְא doivent être rattachés au crible.
