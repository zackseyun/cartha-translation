revisions:
- from: Et chaque coup du bâton fixé que Yahweh fera tomber sur lui sera accompagné de tambourins et de lyres[a] ; et il combattra contre eux dans des batailles où l’on brandit les armes[b].
  to: Et chaque coup de la verge établie que Yahweh posera sur lui sera accompagné de tambourins et de lyres[a] ; et, dans des combats de brandissement, il combattra contre eux[b].
  rationale: La révision rapproche le verbe de l’hébreu (« posera »), élimine l’ajout non exprimé « les armes », et emploie « verge » pour l’instrument de châtiment. Elle maintient le pluriel contextuel « eux » dans le texte principal, tout en préservant explicitement en note l’ambiguïté grammaticale du suffixe féminin singulier.
