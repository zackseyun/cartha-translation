source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
translation:
  language: fr
  text: Et chaque coup de la verge établie que Yahweh posera sur lui sera accompagné de tambourins et de lyres[a] ; et, dans des combats de brandissement, il combattra contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chaque passage de la verge établie ». L’expression hébraïque est difficile ; « coup » comprend chaque passage de la verge comme un coup porté.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans des combats de brandissement ». La fin peut aussi se traduire : « il combattra contre elle » ou « contre cela » ; le suffixe hébreu est féminin singulier et son référent reste incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כֹּל מַעֲבַר
  choice: Et chaque coup
  rationale: מַעֲבַר signifie normalement « passage », mais, avec le bâton dans cette scène de jugement, il évoque vraisemblablement chacun de ses passages, donc chacun de ses coups. La note conserve l’ambiguïté.
- source_word: מַטֵּה מוּסָדָה
  choice: du bâton fixé
  rationale: מַטֶּה désigne ici l’instrument du châtiment. Le participe passif מוּסָדָה exprime ce qui est établi ou fixé d’avance ; « fixé » reste proche de cette image sans préciser excessivement « décrété » ou « destiné ».
- source_word: אֲשֶׁר יָנִיחַ יְהוָה עָלָיו
  choice: que Yahweh fera tomber sur lui
  rationale: Le hifil de נוח signifie littéralement faire reposer ou poser. Dans le contexte des coups portés par un bâton, « fera tomber sur lui » rend naturellement l’action punitive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin conformément à la terminologie du projet.
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  choice: sera accompagné de tambourins et de lyres
  rationale: Les prépositions ב indiquent ici l’accompagnement musical. « Tambourins » et « lyres » sont des désignations modernes et précises des instruments.
- source_word: וּבְמִלְחֲמוֹת תְּנוּפָה
  choice: dans des batailles où l’on brandit les armes
  rationale: תְּנוּפָה évoque l’action de balancer ou de brandir. L’ajout explicatif « les armes » rend l’image martiale intelligible en français tout en conservant l’idée du geste, mais il est signalé en note comme implicite.
- source_word: נִלְחַם בָהּ
  choice: il combattra contre eux
  rationale: Le sujet le plus naturel est Yahweh, et le contexte vise l’Assyrie ou ses forces. Cependant, le suffixe hébreu est féminin singulier ; cette difficulté est conservée dans une note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: « Yahweh » représente directement le nom propre hébreu sans lui substituer un titre.
- issue: Référent du suffixe dans נִלְחַם בָהּ
  choice: contre eux, compris d’après le contexte comme l’ennemi assyrien ou ses forces
  alternative: contre elle / contre cela
  rationale: Le contexte immédiat porte sur le jugement de l’Assyrie, mais la forme féminine singulière du suffixe ne permet pas une identification entièrement certaine ; la note préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde l’image du bâton et le contraste frappant entre jugement guerrier et accompagnement musical. Les deux difficultés majeures de l’hébreu — מַעֲבַר et le suffixe féminin singulier final — sont explicitement préservées en notes.
