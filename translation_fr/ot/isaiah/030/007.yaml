  text: וּ/מִצְרַ֕יִם הֶ֥בֶל וָ/רִ֖יק יַעְזֹ֑רוּ לָ/כֵן֙ קָרָ֣אתִי לָ/זֹ֔את רַ֥הַב הֵ֖ם שָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/007.yaml
  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
translation:
  language: fr
  text: Car l’aide de l’Égypte est vaine et inutile ; c’est pourquoi je l’appelle « Rahab, celle qui reste assise ».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Rahab » est un surnom poétique de l’Égypte ; le mot peut aussi évoquer l’orgueil ou la vantardise. La formule hébraïque entière est très condensée. On peut aussi comprendre : « Rahab — ils restent assis » ou « la vantarde qui ne fait rien ».'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  choice: Car l’aide de l’Égypte
  rationale: La conjonction introduit ici la raison de l’avertissement précédent. La restructuration nominale exprime naturellement en français l’aide que l’Égypte est censée fournir.
- source_word: הֶבֶל וָרִיק
  choice: vaine et inutile
  rationale: Les deux termes évoquent ensemble le vide, la futilité et l’inefficacité. Ce couple français conserve l’intensification sans répétition maladroite.
- source_word: יַעְזֹרוּ
  choice: l’aide
  rationale: Le verbe signifie « aider ». Sa nominalisation donne une phrase française naturelle tout en gardant l’idée centrale de l’assistance égyptienne, le pluriel hébreu pouvant envisager l’Égypte collectivement ou ses agents.
- source_word: לָכֵן
  choice: c’est pourquoi
  rationale: Cette tournure marque clairement et naturellement la conséquence en français moderne.
- source_word: קָרָאתִי לָזֹאת
  choice: je l’appelle
  rationale: Le féminin renvoie vraisemblablement à l’Égypte personnifiée. Le présent convient à une désignation prophétique formulée comme une raillerie.
- source_word: רַהַב
  choice: Rahab
  rationale: Le terme fonctionne comme un nom ou surnom poétique de l’Égypte, tout en évoquant l’orgueil et la vantardise. La translittération préserve ce double fonctionnement, expliqué en note.
- source_word: הֵם שָׁבֶת
  choice: qui reste sans bouger
  rationale: La formule hébraïque, très condensée, paraît tourner en dérision l’inaction de l’Égypte. Cette traduction garde l’image de l’immobilité sans effacer l’ambiguïté, signalée en note.
theological_decisions:
- issue: Interprétation du nom satirique רַהַב הֵם שָׁבֶת
  choice: « Rahab qui reste sans bouger »
  alternative: « Rahab — ils restent immobiles » ou « la vantarde qui ne fait rien »
  rationale: Le passage emploie une satire prophétique plutôt qu’une affirmation doctrinale. La traduction retenue conserve Rahab comme appellation poétique et rend l’inaction suggérée par la seconde partie, tandis que la note maintient les autres analyses possibles de cette formule difficile.
translation_notes:
  register: Français international moderne, clair et digne. « Reste sans bouger » conserve la vigueur concrète et moqueuse de l’hébreu. Le marqueur de note est placé après l’ensemble du surnom afin que la note couvre à la fois « Rahab » et la formule difficile qui l’accompagne.
