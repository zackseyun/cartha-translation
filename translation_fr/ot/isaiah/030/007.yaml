revisions:
- from: Car l’aide de l’Égypte est vaine et inutile ; c’est pourquoi je l’appelle « Rahab qui reste sans bouger ».[a]
  to: Car l’aide de l’Égypte est vaine et inutile ; c’est pourquoi je l’appelle « Rahab, celle qui reste assise ».[a]
  rationale: La révision remplace une expression française moins naturelle par une formulation qui reproduit plus directement l’image d’une figure assise et inactive. La note conserve les principales possibilités de lecture de l’hébreu difficile, notamment le pluriel littéral « ils » et l’interprétation satirique, sans trancher indûment l’ambiguïté.
