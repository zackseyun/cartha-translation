review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend correctement la valeur de la construction hébraïque : l’aide attendue de l’Égypte est vaine et vide/inefficace. « Car » et « c’est pourquoi » reproduisent bien les liens discursifs. Rahab est correctement conservé comme surnom poétique de l’Égypte. La formule הֵם שָׁבֶת demeure grammaticalement et sémantiquement comprimée ; la traduction ne doit pas présenter son analyse comme certaine.'
  naturalness: « Rahab qui reste sans bouger » est compréhensible, mais « rester sans bouger » est moins idiomatique dans un surnom solennel et ne rend pas explicitement l’image de « s’asseoir / rester assis ». « Rahab, celle qui reste assise » est plus naturel, conserve l’image, et laisse entendre l’inaction satirique.
  terminology: « Égypte », « aide », « Rahab » et « vaine et inutile » conviennent au français international moderne. La note doit distinguer clairement le surnom Rahab et les lectures possibles de la formule entière, sans donner à entendre que Rahab est nécessairement un nom propre au sens strict.
  issues:
