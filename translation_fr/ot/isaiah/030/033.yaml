revisions:
- from: Car Tofeth est préparé depuis longtemps[a] ; il est même prêt pour le roi. On l’a fait profond et large ; son bûcher regorge de feu et de bois. Le souffle de Yahweh, pareil à un torrent de soufre, l’embrase.
  to: Car Topheth est préparé depuis longtemps[a] ; il est même préparé pour le roi. On l’a rendu profond et large ; son bûcher regorge de feu et de bois. Le souffle de Yahweh, comme un torrent de soufre, l’embrase.
  rationale: La révision normalise la graphie française du toponyme et rend explicitement הוּכָן par « est préparé ». Elle conserve l’ambiguïté concernant le roi et le sujet de « On l’a rendu », ainsi que l’image violente mais strictement textuelle du bûcher embrasé.
