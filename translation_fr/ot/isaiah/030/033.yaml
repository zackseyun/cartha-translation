  variant: modern international French
source:
  edition: WLC
  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
translation:
  language: fr
  text: Car Topheth est préparé depuis longtemps[a] ; il est même préparé pour le roi. On l’a rendu profond et large ; son bûcher regorge de feu et de bois. Le souffle de Yahweh, comme un torrent de soufre, l’embrase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis hier », expression qui signifie ici « depuis longtemps » ou « d’avance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּךְ מֵאֶתְמוּל
  choice: est préparé depuis longtemps
  rationale: Le participe passif exprime un état résultant, tandis que l’expression littérale « depuis hier » indique idiomatiquement une préparation ancienne ou préalable.
- source_word: תָּפְתֶּה
  choice: Tofeth
  rationale: Translittération française usuelle du nom de lieu, sans transformer le nom propre en interprétation.
- source_word: גַּם הוא לַמֶּלֶךְ הוּכָן
  choice: il est même prêt pour le roi
  rationale: « Même » rend la valeur emphatique de גַּם ; « le roi » conserve le référent non précisé du texte hébreu.
- source_word: הֶעְמִיק הִרְחִב
  choice: On l’a fait profond et large
  rationale: Les formes causatives ont un sujet masculin singulier non exprimé. Le français indéfini « on » préserve cette absence d’identification explicite mieux qu’un « il » interprétatif.
- source_word: מְדֻרָתָהּ
  choice: son bûcher
  rationale: Le nom désigne ici l’endroit ou l’amas destiné à la combustion ; « bûcher » rend naturellement l’image du jugement par le feu.
- source_word: אֵשׁ וְעֵצִים הַרְבֵּה
  choice: regorge de feu et de bois
  rationale: Cette formulation française naturelle conserve l’idée d’une grande abondance de combustible.
- source_word: נִשְׁמַת יְהוָה
  choice: Le souffle de Yahweh
  rationale: « Souffle » est le sens direct de נְשָׁמָה et la comparaison suivante en communique la puissance destructrice ; le nom divin est translittéré.
- source_word: כְּנַחַל גָּפְרִית
  choice: pareil à un torrent de soufre
  rationale: « Torrent » exprime la force possible de נַחַל dans ce contexte, et « soufre » est le terme français moderne pour גָּפְרִית.
- source_word: בֹּעֲרָה בָּהּ
  choice: l’embrase
  rationale: Le participe féminin se rapporte au souffle et décrit son action sur Tofeth ou son bûcher ; « embrase » restitue cette image sans lourdeur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme ; « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre.
- issue: Identité du « roi »
  choice: le roi
  alternative: le roi d’Assyrie / Molok
  rationale: Le verset ne précise pas son identité. La traduction conserve donc l’ambiguïté textuelle au lieu d’imposer une identification débattue.
- issue: Sujet de הֶעְמִיק הִרְחִב
  choice: On l’a fait
  alternative: Il l’a fait
  rationale: Même si le contexte peut faire penser à une action divine, le sujet n’est pas nommé dans cette proposition ; la tournure indéfinie évite de le préciser silencieusement.
translation_notes:
  register: Français international moderne, digne et imagé. La phrase garde le parallélisme et la progression vers l’embrasement final, tout en évitant les archaïsmes. Le nom Tofeth est conservé comme toponyme et l’ambiguïté concernant le roi et le sujet des verbes causatifs demeure ouverte.
