source:
  edition: WLC
  text: ס֚וּרוּ מִנֵּי דֶ֔רֶךְ הַטּ֖וּ מִנֵּי אֹ֑רַח הַשְׁבִּ֥יתוּ מִ/פָּנֵ֖י/נוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/011.yaml
  text: Turn aside from the way[a]; depart from the path; remove the Holy One of Israel from before us.
translation:
  language: fr
  text: Écartez-vous du chemin, détournez-vous du sentier ; faites disparaître le Saint d’Israël de devant nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּרוּ מִנֵּי דֶרֶךְ
  choice: Écartez-vous du chemin
  rationale: L’impératif pluriel de סור exprime l’action de quitter une voie. Cette formulation conserve l’image du déplacement hors d’un chemin et reste naturelle en français.
- source_word: הַטּוּ מִנֵּי אֹרַח
  choice: détournez-vous du sentier
  rationale: Le verbe נטה, parallèle à סור, appelle ici à dévier d’une trajectoire. « Sentier » distingue אֹרַח de דֶרֶךְ tout en préservant le parallélisme poétique.
- source_word: הַשְׁבִּיתוּ
  choice: faites disparaître
  rationale: 'Le hiphil impératif de שבת a une valeur causative : faire cesser ou faire en sorte que quelqu’un ne soit plus présent. « Faites disparaître » rend clairement cette demande hostile sans suggérer nécessairement une destruction.'
- source_word: מִפָּנֵינוּ
  choice: de devant nous
  rationale: Cette expression conserve le sens spatial et relationnel de « loin de notre face/notre présence » avec une tournure française intelligible.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette traduction directe maintient le titre divin caractéristique d’Ésaïe, son langage de sainteté et son lien explicite avec Israël.
theological_decisions:
- issue: Référent du « Saint d’Israël »
  choice: Titre divin désignant le Dieu d’Israël
  alternative: Référence métonymique au message prophétique d’Ésaïe ou à la sainteté divine prise abstraitement
  rationale: Dans Ésaïe, l’expression fonctionne régulièrement comme un titre de Dieu. La conserver sans paraphrase maintient la force théologique du rejet de sa présence et de sa parole.
translation_notes:
  register: Français moderne, digne et direct. Les deux impératifs parallèles et les deux termes désignant une voie sont distingués afin de préserver la poésie hébraïque. L’exclamation finale restitue la vigueur de la parole rapportée.
