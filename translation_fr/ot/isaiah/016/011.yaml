source:
  edition: WLC
  text: עַל כֵּן֙ מֵעַ֣/י לְ/מוֹאָ֔ב כַּ/כִּנּ֖וֹר יֶֽהֱמ֑וּ וְ/קִרְבִּ֖/י לְ/קִ֥יר חָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/011.yaml
  text: Therefore my inward parts moan like a harp for Moab[b][a], and my inner being for Kir-heres.
translation:
  language: fr
  text: C’est pourquoi mes entrailles gémissent comme une lyre[a] pour Moab, et tout mon être pour Kir-Hérès[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une harpe »; le mot hébreu désigne un instrument à cordes.'
    reason: lexical_alternative
  - marker: b
    text: 'Kir-Hérès est une ville de Moab; nom traditionnel : « Kir-Haréseth ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: mes entrailles
  rationale: Le terme désigne littéralement les parties internes du corps et, par image, le siège d’une émotion profonde. « Mes entrailles » conserve cette image concrète tout en restant idiomatique en français.
- source_word: לְמוֹאָב
  choice: pour Moab
  rationale: La préposition indique ici l’objet vers lequel se porte la lamentation; « pour Moab » exprime naturellement cette douleur compatissante.
- source_word: כַכִּנּוֹר
  choice: comme une lyre
  rationale: כִּנּוֹר désigne un instrument à cordes ancien. « Lyre » évite de lui attribuer trop précisément la forme de la harpe moderne et convient à l’image sonore.
- source_word: יֶהֱמוּ
  choice: gémissent
  rationale: Le verbe évoque un grondement ou une résonance profonde. Dans ce contexte de lamentation, « gémissent » rend à la fois le son et la douleur, sans réduire l’expression à une simple vibration musicale.
- source_word: וְקִרְבִּי
  choice: et tout mon être
  rationale: קֶרֶב désigne l’intérieur d’une personne. Dans le parallélisme avec « mes entrailles », « tout mon être » exprime clairement le moi intérieur sans répéter exactement la première image.
- source_word: לְקִיר חָרֶשׂ
  choice: pour Kir-Hérès
  rationale: Le groupe est compris comme le nom d’une ville moabite. Sa translittération conserve le toponyme du texte hébreu.
