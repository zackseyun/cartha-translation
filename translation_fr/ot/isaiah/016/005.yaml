id: ISA.16.5
reference: Isaiah 16:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הוּכַ֤ן בַּ/חֶ֨סֶד֙ כִּסֵּ֔א וְ/יָשַׁ֥ב עָלָ֛י/ו בֶּ/אֱמֶ֖ת בְּ/אֹ֣הֶל דָּוִ֑ד שֹׁפֵ֛ט וְ/דֹרֵ֥שׁ מִשְׁפָּ֖ט וּ/מְהִ֥ר צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
translation:
  language: fr
  text: 'Un trône sera affermi par l’amour fidèle[a], et quelqu’un y siégera avec fidélité[b], dans la tente de David : il jugera, recherchera la justice et sera prompt à faire ce qui est juste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ḥèsèd peut aussi se traduire par « bonté », « amour constant » ou « loyauté envers l’alliance ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la vérité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַן
  choice: sera affermi
  rationale: Le hofal de כון exprime l’établissement ferme et durable. « Sera affermi » conserve la voix passive et la nuance de stabilité.
- source_word: בַּחֶסֶד
  choice: par l’amour fidèle
  rationale: 'חֶסֶד désigne souvent un amour loyal, miséricordieux et lié à l’alliance. La préposition ב est comprise ici de façon instrumentale : cet amour est ce par quoi le trône est affermi.'
- source_word: כִּסֵּא
  choice: un trône
  rationale: Le nom hébreu est sans article ; l’indéfini français en rend directement la forme.
- source_word: וְיָשַׁב עָלָיו
  choice: et quelqu’un y siégera
  rationale: Le verbe est au masculin singulier, mais aucun sujet nominal n’est exprimé. « Quelqu’un » préserve cette indétermination sans empêcher de comprendre qu’il s’agit du souverain davidique.
- source_word: בֶּאֱמֶת
  choice: avec fidélité
  rationale: אֱמֶת peut signifier vérité, fiabilité ou fidélité. Dans ce contexte royal et judiciaire, « avec fidélité » décrit naturellement la manière de gouverner tout en laissant l’autre sens en note.
- source_word: בְּאֹהֶל דָּוִד
  choice: dans la tente de David
  rationale: La traduction conserve l’image concrète de la « tente », qui peut évoquer la dynastie davidique sans remplacer l’image par une interprétation.
- source_word: שֹׁפֵט
  choice: il jugera
  rationale: Le participe décrit l’activité continue du souverain assis sur le trône. Une proposition verbale est plus naturelle en français tout en gardant cette fonction.
- source_word: וְדֹרֵשׁ מִשְׁפָּט
  choice: recherchera la justice
  rationale: דרשׁ associé à מִשְׁפָּט exprime la recherche active et le souci d’un jugement juste. « Rechercher la justice » préserve ce mouvement.
- source_word: וּמְהִר צֶדֶק
  choice: s’empressera d’établir ce qui est juste
  rationale: La formule hébraïque est concise et quelque peu elliptique. Cette formulation française rend la promptitude exprimée par מְהִר et la justice concrète évoquée par צֶדֶק, sans réduire celle-ci à une qualité intérieure.
theological_decisions:
- issue: Référent messianique ou davidique
  choice: Décrire un souverain davidique idéal sans l’identifier explicitement
  alternative: Identifier directement ce souverain comme le Messie ou le Christ
  rationale: Le texte mentionne le trône et la tente de David, mais ne nomme pas le souverain. La traduction conserve cette retenue et permet la lecture messianique sans l’inscrire explicitement dans le verset.
- issue: Sujet implicite de וְיָשַׁב
  choice: Employer « quelqu’un »
  alternative: Employer « il » et identifier plus directement le souverain attendu
  rationale: L’hébreu marque un sujet masculin singulier par le verbe, mais ne l’exprime pas nominalement. Le français exige un sujet ; « quelqu’un » maintient au mieux l’indétermination textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme royal et judiciaire est rendu dans une phrase fluide. L’image de la tente de David et l’ambiguïté du sujet sont conservées ; la dernière expression, très condensée en hébreu, est explicitée avec mesure pour être naturelle en français.
