revisions:
- from: 'Un trône sera affermi par l’amour fidèle[a], et quelqu’un y siégera avec fidélité[b], dans la tente de David : il jugera, recherchera la justice et s’empressera d’établir ce qui est juste.'
  to: 'Un trône sera affermi par l’amour fidèle[a], et quelqu’un y siégera avec fidélité[b], dans la tente de David : il jugera, recherchera la justice et sera prompt à faire ce qui est juste.'
  rationale: La révision se limite à la dernière expression. « Sera prompt à faire ce qui est juste » conserve la promptitude de מְהִר et le champ de la droiture/justice de צֶדֶק sans ajouter l’action d’établir ou d’instituer la justice. Les notes existantes sont conservées, avec leurs ancres correctement placées.
  reviewer_model: gpt-5.6-terra
