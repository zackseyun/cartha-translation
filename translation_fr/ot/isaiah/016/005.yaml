review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend fidèlement la structure principale : trône passif « sera affermi », amour fidèle pour חֶסֶד, sujet non nommé de « siégera », tente de David, et fonctions judiciaires du souverain. « Par l’amour fidèle » est une interprétation instrumentale recevable de בַּחֶסֶד. La dernière formulation actuelle ajoute toutefois l’idée d’« établir », absente de l’expression elliptique וּמְהִר צֶדֶק, qui exprime plutôt la promptitude à agir avec justice ou à faire ce qui est juste.'
  naturalness: Le français est moderne, fluide et de registre convenable. « Sera prompt à faire ce qui est juste » est plus direct et plus proche de la concision hébraïque que « s’empressera d’établir ce qui est juste ».
  terminology: « Amour fidèle », « fidélité », « tente de David » et « justice » conviennent au contexte royal et judiciaire. La note sur ḥèsèd présente utilement les sens possibles sans imposer une lecture théologique. Les ancres de notes correspondent aux termes annotés.
  issues:
  - severity: medium
    issue: La finale « s’empressera d’établir ce qui est juste » introduit le verbe notionnel « établir ».
    rationale: Le texte hébreu dit littéralement qu’il est « prompt/rapide [en] justice/droiture » ; il ne mentionne pas l’établissement de la justice. Une formulation qui décrit directement l’action juste préserve mieux l’ellipse poétique.
