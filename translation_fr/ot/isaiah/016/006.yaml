source:
  edition: WLC
  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּ֣א מְאֹ֑ד גַּאֲוָת֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/עֶבְרָת֖/וֹ לֹא כֵ֥ן בַּדָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
translation:
  language: fr
  text: Nous avons entendu parler de l’orgueil de Moab — combien il est orgueilleux ! —, de son arrogance, de son orgueil et de sa fureur ; ses vantardises[a] ne sont pas fondées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses paroles creuses » ou « ses mensonges ». Le terme hébreu peut désigner des prétentions vantardes, des paroles vides ou des propos mensongers.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Nous avons entendu parler
  rationale: Le parfait qal à la première personne du pluriel exprime ici ce que les locuteurs savent par ouï-dire. Le passé composé et la locution « entendre parler de » rendent naturellement cette valeur en français actuel.
- source_word: גְאוֹן
  choice: orgueil
  rationale: Dans ce contexte de jugement contre Moab, le nom désigne une élévation hautaine plutôt qu’une majesté neutre.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française usuelle du nom du pays et du peuple.
- source_word: גֵּא מְאֹד
  choice: combien il est orgueilleux !
  rationale: La tournure exclamative restitue l’intensification produite par מְאֹד ainsi que la répétition emphatique du vocabulaire de l’orgueil.
- source_word: גַּאֲוָתוֹ
  choice: son arrogance
  rationale: Ce terme proche des autres mots de la série est différencié par « arrogance » afin de conserver l’accumulation rhétorique sans tout rendre par un seul mot français.
- source_word: וּגְאוֹנוֹ
  choice: de son orgueil
  rationale: La reprise du nom גאון maintient le terme central de l’accusation. La préposition « de » est répétée pour assurer la clarté de l’énumération française.
- source_word: וְעֶבְרָתוֹ
  choice: et de sa fureur
  rationale: עברה évoque une colère débordante ; « fureur » est à la fois vigoureux, actuel et adapté au ton de dénonciation.
- source_word: לֹא כֵן
  choice: ne correspondent pas à la réalité
  rationale: Cette formulation française naturelle conserve la négation concise de la validité ou de la conformité des propos de Moab sans préciser au-delà du texte en quoi ils sont faux.
- source_word: בַּדָּיו
  choice: ses vantardises
  rationale: Dans cette accumulation de termes relatifs à l’orgueil, « vantardises » rend bien les prétentions hautaines, tout en laissant en note les sens possibles de paroles creuses ou mensongères.
theological_decisions:
- issue: Nature exacte des paroles de Moab désignées par בַּדָּיו
  choice: ses vantardises ne correspondent pas à la réalité
  alternative: ses paroles creuses ne sont pas fondées / ses mensonges ne sont pas vrais
  rationale: Le mot peut évoquer des prétentions orgueilleuses, des paroles vides ou des mensonges. Le texte principal suit le contexte immédiat de l’orgueil, tandis que la note préserve l’étendue lexicale sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’accumulation des termes relatifs à l’orgueil est conservée, ainsi que la brusque négation finale. La ponctuation met en relief l’intensification centrale sans alourdir la phrase.
