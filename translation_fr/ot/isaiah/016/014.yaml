source:
  edition: WLC
  text: וְ/עַתָּ֗ה דִּבֶּ֣ר יְהוָה֮ לֵ/אמֹר֒ בְּ/שָׁלֹ֤שׁ שָׁנִים֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/נִקְלָה֙ כְּב֣וֹד מוֹאָ֔ב בְּ/כֹ֖ל הֶ/הָמ֣וֹן הָ/רָ֑ב וּ/שְׁאָ֥ר מְעַ֛ט מִזְעָ֖ר ל֥וֹא כַבִּֽיר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
translation:
  language: fr
  text: 'Mais maintenant, Yahweh a parlé : « Dans trois ans, comme les années d’un salarié[a], la gloire de Moab sera abaissée avec toute sa grande multitude[b] ; et le reste sera peu nombreux, très réduit et sans grande puissance[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme les années d’un salarié ». L’image suggère probablement une durée fixée et comptée avec exactitude.'
    reason: clarification
  - marker: b
    text: 'Ou : « avec toute sa grande foule » ; le terme peut aussi évoquer une abondance ou un faste, et la relation exacte avec l’abaissement de la gloire de Moab reste concise dans l’hébreu.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « peu, très peu, non considérable ». Le dernier mot peut évoquer la puissance, la grandeur ou l’importance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Marque une transition contrastive vers une nouvelle déclaration divine.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh a parlé
  rationale: Le parfait exprime une déclaration solennelle désormais établie ; le nom divin est rendu directement.
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  choice: Dans trois ans, comptés aussi exactement que les années d’un salarié
  rationale: « Dans trois ans » conserve la valeur temporelle de בְּ ; la comparaison avec le salarié souligne vraisemblablement une durée strictement comptée.
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  choice: la gloire de Moab sera abaissée
  rationale: Le nifal de קלה indique ici une perte de prestige ou d’importance, tout en maintenant le contraste avec « gloire ».
- source_word: בְּכֹל הֶהָמוֹן הָרָב
  choice: malgré toute sa nombreuse population
  rationale: Le contexte favorise une valeur concessive de בְּ et הָמוֹן peut désigner la masse de la population, mais le syntagme reste lexicalement ouvert.
- source_word: וּשְׁאָר
  choice: ce qui en restera
  rationale: Rend le sens concret de reste sans imposer ici les connotations théologiques possibles de « reste » comme terme technique.
- source_word: מְעַט מִזְעָר
  choice: peu nombreux, infime
  rationale: Reproduit les deux expressions cumulatives qui accentuent l’extrême petitesse de ce qui subsistera.
- source_word: לֹא כַבִּיר
  choice: sans force
  rationale: Dans ce jugement national, כַבִּיר évoque vraisemblablement la puissance ou l’importance ; « sans force » est naturel en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée de שְׁאָר
  choice: ce qui en restera
  alternative: le reste / les survivants
  rationale: La formulation choisie conserve l’idée de ce qui subsiste après le jugement sans lui attribuer automatiquement une valeur théologique positive.
- issue: Sens de כַבִּיר
  choice: sans force
  alternative: sans importance / pas grand
  rationale: Le terme peut viser la force, la grandeur ou l’importance ; le contexte de l’abaissement de Moab favorise la faiblesse, tandis qu’une note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement explicitée pour rendre naturellement la comparaison avec les années du salarié, tout en signalant la formulation littérale en note. Les ambiguïtés de הָמוֹן, de la préposition בְּ et de כַבִּיר sont préservées dans les notes.
