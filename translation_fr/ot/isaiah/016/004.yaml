  text: יָג֤וּרוּ בָ/ךְ֙ נִדָּחַ֔/י מוֹאָ֛ב הֱוִי סֵ֥תֶר לָ֖/מוֹ מִ/פְּנֵ֣י שׁוֹדֵ֑ד כִּֽי אָפֵ֤ס הַ/מֵּץ֙ כָּ֣לָה שֹׁ֔ד תַּ֥מּוּ רֹמֵ֖ס מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
translation:
  language: fr
  text: Que les exilés de Moab séjournent chez toi ! Sois pour eux un abri contre le dévastateur. Car l’oppresseur n’est plus, la dévastation a cessé, ceux qui foulent aux pieds le pays ont disparu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture courante, fondée sur une vocalisation ou une division différente des premiers mots : « Que mes exilés séjournent chez toi, Moab ! Sois pour eux un abri contre le dévastateur. »'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  choice: séjournent chez toi
  rationale: גור exprime ici un séjour sous protection, probablement temporaire. « Séjourner chez toi » reste naturel tout en conservant cette nuance.
- source_word: נִדָּחַי מוֹאָב
  choice: les exilés de Moab
  rationale: נדח désigne des personnes chassées ou dispersées. « Exilés » rend clairement leur condition subie sans suggérer qu’elles fuient de leur propre initiative.
- source_word: הֱוִי סֵתֶר לָמוֹ
  choice: Sois pour eux un abri
  rationale: סֵתֶר désigne un lieu où l’on est caché et protégé. « Abri » conserve l’image concrète et convient au français courant.
- source_word: מִפְּנֵי שׁוֹדֵד
  choice: contre le dévastateur
  rationale: Le participe שׁוֹדֵד évoque celui qui pille et ravage. « Dévastateur » rend l’ampleur de la violence mieux que le plus étroit « pillard ».
- source_word: אָפֵס הַמֵּץ
  choice: l’oppresseur n’est plus
  rationale: אָפֵס indique la disparition ou la fin, tandis que הַמֵּץ, terme difficile, désigne vraisemblablement celui qui opprime ou extorque. Cette formulation reste concise et n’impose pas un sens économique trop précis.
- source_word: כָּלָה שֹׁד
  choice: la dévastation a cessé
  rationale: שֹׁד peut désigner le ravage, la violence ou le pillage. « Dévastation » maintient le parallélisme avec le dévastateur et couvre ce champ sémantique.
- source_word: תַּמּוּ רֹמֵס מִן הָאָרֶץ
  choice: ceux qui piétinaient le pays ont disparu
  rationale: Le verbe תַּמּוּ est pluriel, ce que rend « ceux qui ». רֹמֵס évoque l’action de fouler aux pieds, littéralement ou comme image de domination, et הָאָרֶץ désigne ici le pays concerné.
theological_decisions:
- issue: Destinataires et syntaxe de l’appel initial
  choice: Le texte massorétique est compris comme un appel adressé à une entité féminine singulière afin qu’elle accueille les exilés de Moab.
  alternative: « Que mes exilés séjournent chez toi, Moab ! Sois pour eux un abri contre le dévastateur. »
  rationale: La vocalisation massorétique fournie se lit naturellement « les exilés de Moab » après בָךְ au féminin singulier. Une autre vocalisation ou division des mots, ancienne et courante, comprend « mes exilés » et prend Moab comme destinataire. L’ambiguïté textuelle est signalée sans remplacer la lecture du WLC dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme ternaire de la seconde moitié est conservé. « Séjourner » maintient la nuance de résidence provisoire; « piétinaient le pays » garde l’image hébraïque tout en explicitant naturellement le complément.
