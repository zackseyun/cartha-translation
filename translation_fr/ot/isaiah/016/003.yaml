    issue: « ne livre pas le fugitif » interprète le verbe hébreu גלה de manière trop spécifique.
    rationale: גלה signifie littéralement révéler, découvrir ou exposer. « Livrer » peut impliquer remettre activement quelqu’un à des adversaires, élément que le texte ne formule pas explicitement. Une traduction directe préserve mieux la portée ouverte de l’impératif.
