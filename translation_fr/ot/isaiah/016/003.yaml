- from: Donnez un conseil ; rendez une décision[a]. Rends ton ombre pareille à la nuit en plein midi[b] ; cache les exilés ; ne livre pas le fugitif[c].
  to: Donnez un conseil ; rendez une décision[a]. Rends ton ombre pareille à la nuit en plein midi[b] ; cache les exilés ; ne révèle pas le fugitif[c].
  rationale: La seule modification nécessaire remplace « ne livre pas » par « ne révèle pas », afin de traduire plus directement גלה sans introduire l’idée supplémentaire d’une remise du fugitif. La note est ajustée pour refléter la valeur littérale de « découvrir/dévoiler » et ses équivalents français contextuels. Le reste du texte est conservé, y compris le changement volontaire de nombre et de genre des impératifs.
