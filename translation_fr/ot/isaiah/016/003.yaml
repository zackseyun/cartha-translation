review_pass:
  verdict: revise
  source_fidelity: Le texte rend bien la succession des impératifs et conserve correctement le passage du pluriel initial au féminin singulier. « Exilés » est une contextualisation recevable de נִדָּחִים (« personnes chassées/bannies »). En revanche, « ne livre pas » explicite une conséquence possible de גלה, mais ne traduit pas directement le verbe, qui signifie « révéler, découvrir/exposer » ; cette formulation risque d’ajouter l’idée de remise aux poursuivants.
  naturalness: Le français est globalement naturel, clair et d’un registre biblique moderne. « Rends ton ombre pareille à la nuit » et « en plein midi » produisent un contraste idiomatique efficace. « Ne révèle pas le fugitif » est un peu plus littéral, mais reste intelligible et convient au registre soutenu du passage.
  terminology: « Rendre une décision » préserve convenablement la portée judiciaire de פְלִילָה. « Fugitif » rend bien נֹדֵד dans ce contexte sans imposer « réfugié ». La correction de « ne livre pas » à « ne révèle pas » maintient l’ambiguïté du texte hébreu entre divulguer et exposer.
  issues:
