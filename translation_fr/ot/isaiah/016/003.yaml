  text: הביאו עֵצָה֙ עֲשׂ֣וּ פְלִילָ֔ה שִׁ֧יתִי כַ/לַּ֛יִל צִלֵּ֖/ךְ בְּ/ת֣וֹךְ צָהֳרָ֑יִם סַתְּרִי֙ נִדָּחִ֔ים נֹדֵ֖ד אַל תְּגַלִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
translation:
  language: fr
  text: Donnez un conseil ; rendez une décision[a]. Rends ton ombre pareille à la nuit en plein midi[b] ; cache les exilés ; ne révèle pas le fugitif[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendez la justice », « prononcez un jugement » ou « arbitrez ». Le nom hébreu possède une nuance juridique ou judiciaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au milieu de midi ».'
    reason: literal_rendering
  - marker: c
    text: Littéralement, « ne découvre pas » ; aussi « ne révèle pas » ou « n’expose pas » le fugitif.
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  choice: Donnez un conseil
  rationale: L’impératif pluriel causatif הביאו a ici le sens de « donner, présenter », et עֵצָה désigne un conseil ou un avis. Cette formulation reste naturelle tout en gardant le ton d’une délibération politique.
- source_word: עֲשׂוּ פְלִילָה
  choice: rendez une décision
  rationale: פְלִילָה porte une nuance judiciaire. « Rendre une décision » exprime mieux cette portée juridique que le calque « faire une décision ».
- source_word: שִׁיתִי כַלַּיִל צִלֵּךְ
  choice: Rends ton ombre pareille à la nuit
  rationale: שִׁיתִי est un impératif féminin singulier, d’où le passage au tutoiement singulier. « Ombre » conserve l’image de l’obscurité nocturne, et « pareille à » rend explicitement la comparaison.
- source_word: בְּתוֹךְ צָהֳרָיִם
  choice: en plein midi
  rationale: Expression française naturelle qui restitue « au milieu de midi » et souligne le contraste entre la nuit et la lumière la plus forte.
- source_word: סַתְּרִי נִדָּחִים
  choice: cache les exilés
  rationale: סַתְּרִי commande de dissimuler ou protéger, tandis que נִדָּחִים désigne des personnes chassées, bannies ou dispersées. « Exilés » convient au contexte de personnes déplacées cherchant refuge.
- source_word: נֹדֵד אַל תְּגַלִּי
  choice: ne livre pas le fugitif
  rationale: גלה signifie littéralement « découvrir, révéler, exposer ». Dans ce contexte de protection, « ne livre pas » rend la conséquence pragmatique de révéler le fugitif à ses poursuivants, sans employer le plus fort « trahir ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve le changement du pluriel (« Donnez », « rendez ») au féminin singulier (« Rends », « cache », « ne livre pas ») présent dans l’hébreu, sans préciser dans la traduction l’identité de l’interlocutrice.
