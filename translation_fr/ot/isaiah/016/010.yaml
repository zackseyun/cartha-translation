id: ISA.16.10
reference: Isaiah 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
translation:
  language: fr
  text: La joie et l’allégresse ont disparu de la terre fertile[a]. Dans les vignes, plus de chants joyeux, plus de cris ; personne ne foule le raisin dans les pressoirs. J’ai fait cesser le cri des vendanges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Carmel », si כַּרְמֶל est compris comme un nom de lieu plutôt que comme « la terre fertile ».
    reason: alternative_reading
  - marker: b
    text: L’hébreu désigne le cri associé aux vendanges et au foulage du raisin dans le pressoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף
  choice: ont disparu
  rationale: Le niphal de אסף exprime ici le retrait ou la disparition. Cette tournure française est naturelle et s’accorde avec le sujet double « la joie et l’allégresse ».
- source_word: שִׂמְחָה וָגִיל
  choice: la joie et l’allégresse
  rationale: Le binôme poétique est conservé au moyen de deux termes proches mais distincts.
- source_word: כַּרְמֶל
  choice: la terre fertile
  rationale: Dans le parallélisme agricole avec les vignes et les pressoirs, le sens commun de terrain fertile paraît préférable au nom propre Carmel.
- source_word: יְרֻנָּן לֹא יְרֹעָע
  choice: plus de chants joyeux, plus de cris
  rationale: La construction nominale française restitue naturellement les deux manifestations sonores et festives exprimées par les verbes hébreux.
- source_word: יַיִן בַּיְקָבִים לֹא יִדְרֹךְ הַדֹּרֵךְ
  choice: personne ne foule le raisin dans les pressoirs
  rationale: « Le raisin » rend explicitement l’activité de production du vin dans les pressoirs. La répétition étymologique hébraïque est allégée pour obtenir un français courant et digne.
- source_word: הֵידָד
  choice: le cri des vendangeurs
  rationale: Le mot désigne ici le cri rythmé associé aux vendanges et au foulage du raisin ; cette formulation précise le contexte sans supposer que tout emploi du terme exprime la joie.
- source_word: הִשְׁבַּתִּי
  choice: J’ai fait cesser
  rationale: Cette formulation conserve directement la valeur causative du hiphil de שבת.
theological_decisions:
- issue: Identité du locuteur à la première personne
  choice: Conserver « J’ai fait cesser » sans nommer le locuteur
  alternative: « Moi, le Seigneur, j’ai fait cesser »
  rationale: L’hébreu porte la première personne du singulier, tandis que le contexte identifie le locuteur divin. Ajouter « le Seigneur » dépasserait la formulation du verset.
- issue: Nom propre ou nom commun pour כַּרְמֶל
  choice: la terre fertile
  alternative: Carmel
  rationale: Le parallélisme avec les vignes, le raisin et les pressoirs favorise le sens agricole commun, tout en laissant l’autre analyse en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme poétique est marqué par les reprises « plus de… plus de… », et les termes agricoles restent accessibles sans archaïsme.
