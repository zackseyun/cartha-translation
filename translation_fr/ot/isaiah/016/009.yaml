source:
  edition: WLC
  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
translation:
  language: fr
  text: C’est pourquoi je pleure avec les pleurs de Jaézer sur la vigne de Sibma ; je vous inonde de mes larmes, Hesbon et Éléalé, car sur vos fruits d’été et sur votre moisson, le cri est tombé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « cri » peut désigner un cri hostile qui s’abat sur les récoltes ou, selon une autre compréhension de l’image, le cri joyeux de la récolte qui a cessé.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶבְכֶּה
  choice: je pleure
  rationale: L’imparfait qal à la première personne peut exprimer le présent ou l’avenir ; dans cette lamentation, le présent français rend naturellement la douleur en cours sans exclure sa prolongation.
- source_word: בִּבְכִי יַעְזֵר
  choice: avec les pleurs de Yazer
  rationale: La préposition ב est comprise dans un sens associatif ou instrumental. Cette formulation conserve la construction poétique et évite de préciser indûment si Yazer pleure ou fait l’objet des pleurs.
- source_word: גֶּפֶן שִׂבְמָה
  choice: la vigne de Sibma
  rationale: Le singulier גפן est maintenu afin de préserver l’image poétique, même s’il peut avoir une valeur collective.
- source_word: אֲרַיָּוֶךְ דִּמְעָתִי
  choice: je vous inonde de mes larmes
  rationale: Le piel de רוה exprime l’idée d’abreuver abondamment, de saturer ou d’inonder. « Inonder de mes larmes » est idiomatique et garde la force de la métaphore.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Heshbon et Éléalé
  rationale: Les noms de lieux sont rendus comme une apostrophe directe, sans ajouter d’interjection absente de l’hébreu.
- source_word: קֵיצֵךְ
  choice: vos fruits d’été
  rationale: קיץ désigne ici les produits ou fruits récoltés en été ; le pluriel français convient au sens collectif.
- source_word: קְצִירֵךְ
  choice: votre moisson
  rationale: « Moisson » rend le terme agricole standard et s’accorde naturellement avec les fruits d’été.
- source_word: הֵידָד נָפָל
  choice: le cri est tombé
  rationale: La traduction conserve l’image littérale et l’indétermination de הֵידָד, qui peut évoquer un cri de vendange ou un cri hostile dans ce contexte de dévastation.
theological_decisions:
- issue: Sens du dernier membre הֵידָד נָפָל
  choice: le cri est tombé
  alternative: le cri de guerre s’est abattu ; le cri joyeux de la récolte a cessé
  rationale: L’hébreu permet plusieurs lectures contextuelles. Le texte principal préserve l’image et la tension poétiques sans imposer soit une attaque militaire, soit la cessation des réjouissances agricoles.
translation_notes:
  register: Français international moderne, poétique et digne. Les noms propres suivent des formes françaises usuelles. La syntaxe reste proche du parallélisme hébreu tout en demeurant naturelle.
