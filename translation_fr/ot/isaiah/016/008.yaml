  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י שַׁדְמוֹת֩ חֶשְׁבּ֨וֹן אֻמְלָ֜ל גֶּ֣פֶן שִׂבְמָ֗ה בַּעֲלֵ֤י גוֹיִם֙ הָלְמ֣וּ שְׂרוּקֶּ֔י/הָ עַד יַעְזֵ֥ר נָגָ֖עוּ תָּ֣עוּ מִדְבָּ֑ר שְׁלֻ֣חוֹתֶ֔י/הָ נִטְּשׁ֖וּ עָ֥בְרוּ יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/008.yaml
  text: For the fields of Heshbon languish[a], the vine of Sibmah as well. The lords of the nations have struck down its choice vines; they reached as far as Jazer, they wandered into the wilderness[c][b]; its shoots spread out and crossed the sea.
translation:
  language: fr
  text: 'Car les champs de Heshbon dépérissent,

    tout comme la vigne de Sibma.

    Les souverains des nations ont abattu ses ceps de choix[a].

    Ils ont atteint Yazer,

    ils se sont égarés dans le désert ;

    ses rameaux se sont déployés[b]

    et ont traversé la mer[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses sarments » ; le terme hébreu peut désigner des plants sélectionnés ou, selon une autre compréhension, les ramifications de la vigne.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses rameaux étaient laissés à l’abandon » ; le verbe hébreu est difficile et peut être compris de plusieurs manières.
    reason: lexical_alternative
  - marker: c
    text: Dans la géographie de la région, « la mer » pourrait désigner la mer Morte.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁדְמוֹת
  choice: champs
  rationale: Le nom désigne des terres cultivées. « Champs » reste naturel et ne précise pas indûment qu’il s’agit exclusivement de vignobles.
- source_word: אֻמְלָל
  choice: dépérissent
  rationale: Le verbe évoque l’affaiblissement, le dessèchement ou le dépérissement ; ce choix convient à la fois aux champs et à l’image de la vigne.
- source_word: גֶּפֶן שִׂבְמָה
  choice: la vigne de Sibma
  rationale: Le singulier collectif et poétique de l’hébreu est conservé plutôt que remplacé par « les vignobles ».
- source_word: בַּעֲלֵי גוֹיִם
  choice: les maîtres des nations
  rationale: « Maîtres » préserve le registre élevé et la portée large du terme, qui peut désigner des puissants ou des souverains étrangers.
- source_word: הָלְמוּ
  choice: ont abattu
  rationale: Le verbe signifie frapper ; dans le contexte de la destruction des ceps, « abattre » exprime naturellement la violence et son effet.
- source_word: שְׂרוּקֶיהָ
  choice: ses ceps de choix
  rationale: Le terme est probablement lié à une vigne ou à un plant de qualité, mais son sens exact demeure discuté ; l’alternative est signalée en note.
- source_word: עַד יַעְזֵר נָגָעוּ
  choice: Ils s’étendaient jusqu’à Yazer
  rationale: Le mouvement décrit vraisemblablement l’extension des ceps plutôt que l’avancée des assaillants. Le pronom conserve néanmoins la transition poétique de l’hébreu.
- source_word: תָּעוּ מִדְבָּר
  choice: ils erraient dans le désert
  rationale: La traduction garde le sens concret de « errer » et la personnification poétique de la croissance de la vigne.
- source_word: שְׁלֻחוֹתֶיהָ
  choice: ses rameaux
  rationale: Le mot désigne ce que la vigne envoie au loin, donc ses pousses ou ses branches ; « rameaux » convient au registre poétique.
- source_word: נִטְּשׁוּ
  choice: se déployaient
  rationale: Dans cette image végétale, le verbe difficile semble décrire des rameaux laissés libres ou étendus au loin. La note conserve une autre compréhension possible.
- source_word: עָבְרוּ יָם
  choice: traversaient la mer
  rationale: La formulation traduit directement l’hébreu sans identifier explicitement cette mer au lac salé ou mer Morte.
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme est disposé en lignes brèves. Les noms Heshbon, Sibma et Yazer suivent des formes françaises transparentes et proches de l’hébreu. Les pronoms pluriels maintiennent la progression imagée des ceps vers les rameaux sans transformer explicitement la description en explication.
