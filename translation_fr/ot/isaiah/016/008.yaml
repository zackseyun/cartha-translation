    issue: « Les maîtres des nations » est ambigu en français.
    rationale: Cette expression peut se comprendre comme « ceux qui possèdent les nations » ou comme des propriétaires. « Les souverains des nations » est plus idiomatique et correspond bien à la valeur de puissants/régents de בעלי גוים.
  - severity: low
    issue: Alternance peu motivée entre passé composé et imparfait dans la description de l’extension des ceps.
    rationale: L’hébreu enchaîne des formes accomplies. Employer le passé composé pour « ont atteint », « se sont égarés », « se sont déployés » et « ont traversé » rend plus clairement la succession poétique sans modifier le sens.
