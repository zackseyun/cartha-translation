  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : les terres de Heshbon et la vigne de Sibma dépérissent, les puissants ont dévasté les ceps, et l’image décrit leur extension jusqu’à Yazer, dans le désert et au-delà de la mer. « Abattu » est défendable pour הָלְמוּ dans ce contexte. Une harmonisation des temps verbaux rend toutefois mieux la série de formes accomplies hébraïques et la progression de l’image.'
  naturalness: Le français est globalement poétique et naturel. « Les maîtres des nations » est néanmoins moins idiomatique et peut évoquer des propriétaires plutôt que des dirigeants. « Les souverains des nations » exprime plus naturellement la fonction de בעלי גוים. Les imparfaits après « ont abattu » brouillent légèrement la séquence ; le passé composé assure une progression plus nette.
  terminology: Les images agricoles (« champs », « vigne », « ceps », « rameaux ») et les toponymes Heshbon, Sibma et Yazer conviennent. « Souverains » conserve le registre élevé sans imposer une identification historique précise. Les notes préservent à juste titre les difficultés de שׂרוקיה et נטשו.
  issues:
