    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du jugement annoncé précédemment.
- source_word: יְיֵלִיל
  choice: se lamentera
  rationale: Rend la lamentation forte exprimée par ילל, dans un registre digne et courant.
- source_word: לְמוֹאָב
  choice: sur Moab
  rationale: 'La préposition marque ici l’objet ou le motif de la lamentation : Moab se lamente sur son propre sort.'
- source_word: כֻּלֹּה
  choice: tout entier
  rationale: Reprend Moab comme collectivité personnifiée et exprime que la nation entière participe à la lamentation.
- source_word: לַאֲשִׁישֵׁי
  choice: sur les gâteaux de raisins
  rationale: Le texte massorétique se comprend le plus naturellement comme désignant des gâteaux de raisins, probablement évocateurs d’une prospérité désormais perdue ; la difficulté lexicale est signalée en note.
- source_word: קִיר חֲרֶשֶׂת
  choice: Qir-Haréset
  rationale: Translittération française du nom propre de la ville moabite.
- source_word: תֶּהְגּוּ
  choice: Vous gémirez
  rationale: Dans ce contexte de deuil, הגה désigne une expression sourde et audible de douleur ; la deuxième personne du pluriel conserve l’adresse directe aux Moabites.
- source_word: אַךְ נְכָאִים
  choice: complètement abattus
  rationale: אַךְ intensifie ici l’état de ceux que l’affliction a frappés ; « abattus » exprime à la fois l’écrasement et la détresse.
