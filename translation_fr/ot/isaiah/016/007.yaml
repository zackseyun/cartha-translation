  text: Therefore Moab will wail for Moab; all of it will wail. You will moan[a] for the raisin-cakes of Kir-hareseth, utterly stricken.
translation:
  language: fr
  text: C’est pourquoi Moab se lamentera pour Moab ; tout entier, il se lamentera. Vous gémirez pour les gâteaux de raisins de Qir-Haréset[a], complètement abattus.
  philosophy: optimal-equivalence
  footnotes:
