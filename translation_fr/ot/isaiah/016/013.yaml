id: ISA.16.13
reference: Isaiah 16:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל מוֹאָ֖ב מֵ/אָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/013.yaml
  text: This is the word that Yahweh spoke concerning Moab in time past[a].
translation:
  language: fr
  text: Voici la parole que Yahweh a prononcée autrefois au sujet de Moab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici le message que Yahweh a adressé autrefois à Moab. »'
    reason: Alternative lexicale reflétant les sens possibles de הַדָּבָר et de אֶל.
lexical_decisions:
- source_word: זֶה
  choice: Voici
  rationale: Le présentatif « Voici » rend naturellement la force déictique de l’hébreu et introduit la récapitulation, bien que le verbe qui suit renvoie à une parole antérieure.
- source_word: הַדָּבָר
  choice: la parole
  rationale: דבר peut désigner une parole, une affaire ou un message. Dans ce contexte prophétique, « la parole » conserve l’idiome biblique tout en restant clair en français moderne.
- source_word: דִּבֶּר
  choice: a prononcée
  rationale: Le verbe signifie fondamentalement « parler ». Avec « parole » comme complément, « a prononcée » évite une répétition peu naturelle et n’ajoute pas la force de « déclarer ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֶל מוֹאָב
  choice: au sujet de Moab
  rationale: Dans cette récapitulation d’un oracle, אֶל a une valeur référentielle. Cette formulation n’impose ni l’idée d’une adresse directe ni celle d’une hostilité explicitement marquée.
- source_word: מֵאָז
  choice: autrefois
  rationale: L’adverbe situe cette parole dans un temps antérieur. « Autrefois » est concis, naturel et ne précise pas indûment qu’il s’agit d’un passé très lointain.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur de אֶל devant Moab
  choice: au sujet de Moab
  alternative: à Moab / contre Moab
  rationale: Le verset résume un oracle concernant Moab. Le rendu choisi conserve la valeur référentielle possible de la préposition sans transformer implicitement la parole en adresse directe ou en formule hostile.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » convient à une formule récapitulative; « parole » maintient le registre prophétique traditionnel sans archaïsme marqué.
