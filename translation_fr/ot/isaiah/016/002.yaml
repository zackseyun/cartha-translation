  text: וְ/הָיָ֥ה כְ/עוֹף נוֹדֵ֖ד קֵ֣ן מְשֻׁלָּ֑ח תִּֽהְיֶ֨ינָה֙ בְּנ֣וֹת מוֹאָ֔ב מַעְבָּרֹ֖ת לְ/אַרְנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
translation:
  language: fr
  text: Comme un oiseau errant, comme un nid délogé[a], ainsi seront les filles de Moab[b] aux gués de l’Arnon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un nid envoyé » ou « un nid chassé ». L’image hébraïque, très condensée, peut évoquer un nid dérangé et abandonné.'
    reason: lexical_alternative
  - marker: b
    text: « Les filles de Moab » peut désigner les femmes moabites au sens propre ou, par personnification, les villes et les communautés de Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ainsi seront
  rationale: La forme de היה introduit ici l’aboutissement de la double comparaison. « Ainsi seront » exprime naturellement en français le rapport entre les images initiales et le sujet qui suit.
- source_word: כְעוֹף נוֹדֵד
  choice: comme un oiseau errant
  rationale: עוֹף désigne un oiseau ou une créature ailée, tandis que נוֹדֵד évoque le déplacement, l’errance ou la fuite. « Errant » conserve l’image du déracinement sans imposer l’idée plus précise de panique.
- source_word: קֵן מְשֻׁלָּח
  choice: comme une nichée dispersée
  rationale: Littéralement, l’expression associe « nid » à un participe passif signifiant « renvoyé, chassé ». « Nichée dispersée » rend en français une image intelligible de vulnérabilité et de déplacement, tout en signalant en note la formulation hébraïque condensée.
- source_word: בְּנוֹת מוֹאָב
  choice: les filles de Moab
  rationale: 'La traduction littérale préserve l’ambiguïté poétique : il peut s’agir des femmes moabites ou, par personnification, des localités et communautés de Moab.'
- source_word: מַעְבָּרֹת
  choice: aux gués
  rationale: Le pluriel désigne des lieux de passage, particulièrement des passages à gué dans ce contexte géographique.
- source_word: לְאַרְנוֹן
  choice: de l’Arnon
  rationale: Le nom propre renvoie ici au cours d’eau ou à ses gorges ; « les gués de l’Arnon » est la tournure française naturelle.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La reprise de « comme » conserve le parallélisme hébreu, tandis que « ainsi seront » relie clairement les deux comparaisons à leur sujet. Les ambiguïtés de l’image du nid et de l’expression « filles de Moab » sont maintenues ou explicitées en note.
