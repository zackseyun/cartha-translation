id: ISA.16.12
reference: Isaiah 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֧ה כִֽי נִרְאָ֛ה כִּֽי נִלְאָ֥ה מוֹאָ֖ב עַל הַ/בָּמָ֑ה וּ/בָ֧א אֶל מִקְדָּשׁ֛/וֹ לְ/הִתְפַּלֵּ֖ל וְ/לֹ֥א יוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/012.yaml
  text: And when it is seen that Moab is worn out on the high place[a], and he comes to his sanctuary to pray[c][b], he will not be able.
translation:
  language: fr
  text: Et quand on verra que Moab est épuisé sur le haut lieu[a], il viendra dans son sanctuaire pour prier, mais il ne pourra pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un « haut lieu » était un lieu de culte, souvent aménagé sur une hauteur.
    reason: cultural_note
  - marker: b
    text: 'Ou : « il n’y pourra rien ». Littéralement, l’hébreu dit simplement : « il ne pourra pas »; le contexte suggère l’échec de sa démarche religieuse sans en préciser davantage la portée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et quand
  rationale: La formule introduit une circonstance à venir; « Et quand » en conserve la valeur temporelle dans un français naturel.
- source_word: נִרְאָה
  choice: on verra
  rationale: Ce nifal peut exprimer ce qui devient manifeste. La tournure impersonnelle française préserve cette nuance sans imposer « il sera vu ».
- source_word: נִלְאָה
  choice: s’épuise
  rationale: Le verbe évoque la lassitude ou l’épuisement causé par un effort vain; « s’épuise » rend bien ici le processus.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle du nom du peuple et du pays, ici personnifié au singulier.
- source_word: עַל הַבָּמָה
  choice: sur le haut lieu
  rationale: במה désigne un lieu de culte aménagé sur une hauteur. Le singulier et la préposition sont conservés.
- source_word: וּבָא אֶל מִקְדָּשׁוֹ
  choice: il entrera dans son sanctuaire
  rationale: בוא suivi de אֶל peut signifier entrer dans un lieu. « Sanctuaire » reste assez large pour désigner un lieu de culte moabite.
- source_word: לְהִתְפַּלֵּל
  choice: pour prier
  rationale: Le hitpael de פלל signifie ici prier, sans qu’il soit nécessaire de préciser une intercession.
- source_word: וְלֹא יוּכָל
  choice: mais il n’y pourra rien
  rationale: Littéralement, Moab « ne pourra pas ». La tournure idiomatique française exprime son incapacité et, dans ce contexte, l’inefficacité de sa démarche, tout en laissant une note signaler l’expression plus formelle.
theological_decisions:
- issue: Référent des formes verbales masculines singulières associées à Moab
  choice: 'Personnifier Moab au masculin singulier : « il entrera… il n’y pourra rien »'
  alternative: Employer un pluriel pour les Moabites ou reformuler entièrement de manière impersonnelle
  rationale: L’hébreu traite le nom national Moab comme un singulier. Cette personnification conserve la rhétorique du texte sans introduire d’interprétation doctrinale.
- issue: Portée de l’échec final
  choice: Exprimer une incapacité sans préciser explicitement si elle concerne seulement la prière ou l’ensemble de la démarche
  alternative: Traduire « sa prière restera sans effet » ou « il ne l’emportera pas »
  rationale: Le texte dit simplement qu’il ne pourra pas. Le contexte implique l’échec de la prière, mais la traduction principale évite de réduire la portée de l’énoncé.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la progression de l’hébreu tout en évitant une tournure passive lourde. « Haut lieu » est le terme biblique usuel et reçoit une brève explication culturelle.
