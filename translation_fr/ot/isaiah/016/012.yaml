review_pass:
  verdict: revise
  source_fidelity: La personnification de Moab au singulier et « sanctuaire » rendent bien l’hébreu. Toutefois, נִלְאָה décrit ici Moab comme déjà las/épuisé, plutôt qu’en train de s’épuiser. La conjonction finale peut être rendue par « mais » en français pour faire ressortir l’issue contrastée, sans modifier le sens.
  naturalness: Le français est sobre et naturel. « Est épuisé » est plus idiomatique et plus fidèle au résultat exprimé que « s’épuise ». « Il n’y pourra rien » est naturel, mais « il ne pourra pas » conserve plus directement l’indétermination de l’hébreu.
  terminology: « Haut lieu » est le terme biblique français établi; la note culturelle est appropriée. « Sanctuaire » convient à un lieu cultuel moabite sans présumer d’une institution précise. La note finale doit correspondre à une traduction principale qui ne paraphrase pas déjà l’incapacité.
  issues:
  - severity: medium
    issue: Aspect de « s’épuise »
    rationale: Le participe/verbe נִלְאָה présente Moab comme las ou épuisé à ce stade; « s’épuise » déplace légèrement le sens vers un processus en cours. « Est épuisé » préserve mieux la valeur résultative.
  - severity: low
    issue: « il n’y pourra rien » explicite le champ de l’incapacité
    rationale: Cette expression française rattache nettement l’échec à la démarche de prière. Le contexte le suggère, mais « il ne pourra pas » reproduit plus étroitement l’ellipse et l’ambiguïté de וְלֹא יוּכָל.
  revised_text: Et quand on verra que Moab est épuisé sur le haut lieu[a], il viendra dans son sanctuaire pour prier, mais il ne pourra pas[b].
