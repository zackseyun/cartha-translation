revisions:
- from: Et quand on verra que Moab s’épuise sur le haut lieu[a], il entrera dans son sanctuaire pour prier, mais il n’y pourra rien[b].
  to: Et quand on verra que Moab est épuisé sur le haut lieu[a], il viendra dans son sanctuaire pour prier, mais il ne pourra pas[b].
  rationale: La révision corrige l’aspect de l’état d’épuisement de Moab et rend la dernière expression avec une formulation française directe qui conserve l’ellipse du texte hébreu. Les notes restent limitées à l’explication culturelle nécessaire et à l’alternative idiomatique de la clause finale.
