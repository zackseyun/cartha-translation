  text: שִׁלְחוּ כַ֥ר מֹשֵֽׁל אֶ֖רֶץ מִ/סֶּ֣לַע מִדְבָּ֑רָ/ה אֶל הַ֖ר בַּת צִיּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
translation:
  language: fr
  text: Envoyez un agneau[b] au souverain du pays, depuis Séla[a], à travers le désert, à la montagne de la fille de Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le rocher » ou « depuis l’escarpement » ; le mot hébreu peut être un nom commun, bien qu’il désigne probablement ici le lieu appelé Séla.
    reason: lexical_alternative
  - marker: b
    text: Cet agneau était probablement envoyé comme tribut au souverain.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: Envoyez
  rationale: Impératif qal masculin pluriel de שלח. « Envoyez » exprime naturellement l’ordre adressé à un groupe, sans ajouter de nuance absente de l’hébreu.
- source_word: כַר
  choice: un agneau
  rationale: Le nom désigne un jeune ovin. Le contexte évoque probablement un tribut, mais le texte nomme concrètement l’animal; cette image est donc conservée dans le corps du verset.
- source_word: מֹשֵׁל אֶרֶץ
  choice: au souverain du pays
  rationale: מֹשֵׁל désigne celui qui gouverne, et אֶרֶץ signifie ici vraisemblablement « pays » plutôt que « terre » au sens universel. « Souverain » convient au registre politique et poétique.
- source_word: מִסֶּלַע
  choice: depuis Séla
  rationale: סלע peut être le nom commun « rocher, escarpement », mais il est probablement employé ici comme nom de lieu. La translittération française « Séla » est retenue, avec l’autre lecture en note.
- source_word: מִדְבָּרָה
  choice: à travers le désert
  rationale: La forme avec hé locale ou directionnelle est difficile. Dans le contexte d’un envoi depuis Séla vers Sion, la traduction indique avec prudence l’itinéraire dans la région désertique sans imposer une reconstruction syntaxique trop technique.
- source_word: אֶל הַר בַּת צִיּוֹן
  choice: jusqu’à la montagne de la fille de Sion
  rationale: La traduction conserve la personnification poétique « fille de Sion » plutôt que de la réduire à « Jérusalem ». « Jusqu’à » rend naturellement la destination après la description de l’itinéraire.
theological_decisions:
- issue: Faut-il expliciter dans le texte qu’il s’agit d’un tribut politique?
  choice: Conserver la formulation concrète « Envoyez un agneau » et signaler en note le sens probable de tribut.
  alternative: Envoyez un agneau en tribut; Envoyez un tribut d’agneaux.
  rationale: Le contexte favorise fortement l’idée d’un tribut, mais כַר signifie concrètement « agneau ». L’ambiguïté entre objet littéral et fonction politique ne doit pas être supprimée dans le texte principal.
- issue: Séla est-il un nom de lieu ou un nom commun?
  choice: Lire סלע comme le toponyme « Séla » dans le texte principal.
  alternative: depuis le rocher; depuis l’escarpement.
  rationale: Le cadre géographique rend le toponyme probable, mais la forme hébraïque permet réellement la lecture comme nom commun; celle-ci est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe reste claire pour un lectorat général, tout en conservant l’image de l’agneau, le toponyme vraisemblable et la personnification « fille de Sion ».
