review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’appel solennel, « mon serviteur », la conduite avisée avec l’alternative « réussira », et la triple élévation sont tous conservés. Toutefois, « il s’élèvera » attribue au serviteur une élévation réflexive que le qal יָרוּם n’exige pas. Dans cette chaîne d’exaltation, « il sera élevé » rend plus sûrement la valeur résultative/passive-compatible, sans créer une opposition artificielle avec le verbe suivant.'
  naturalness: « Voici » et « mon serviteur » conviennent au registre prophétique moderne. « Il sera élevé, il sera élevé » serait lourd si l’on répétait le même verbe ; « il sera élevé, il sera exalté, il sera très haut placé » conserve une progression claire, idiomatique et solennelle.
  terminology: « Serviteur » est le terme juste et ne préjuge pas de l’identité du personnage. « Agira avec sagesse » est fidèle à יַשְׂכִּיל ; la note préserve à bon droit la nuance de réussite. « Exalté » convient particulièrement à la gradation d’élévation, tandis que « très haut placé » rend גָבַהּ מְאֹד sans condenser les trois termes.
  issues:
  - severity: medium
    issue: « il s’élèvera » pour יָרוּם
    rationale: Le qal peut décrire le fait de devenir haut/élevé, mais le pronominal français suggère plus directement une auto-élévation. Vu les deux verbes suivants et le contexte d’exaltation, une formulation non réflexive est plus neutre et plus fidèle à l’ambiguïté de l’hébreu.
  - severity: low
    issue: « il sera placé très haut »
    rationale: La formulation est compréhensible, mais « placé » introduit une image d’installation ou de nomination qui n’est pas exprimée par גבהּ. « Il sera très haut placé » est plus idiomatique et garde l’idée de position élevée.
  revised_text: Voici, mon serviteur agira avec sagesse[a] ; il sera élevé, il sera exalté, il sera très haut placé.
  revised_footnotes:
  - marker: a
    text: Ou « réussira ». Le verbe hébreu peut désigner une conduite avisée et, par extension, la réussite qui en résulte.
    reason: lexical_alternative
  revision_rationale: 'La révision évite le sens réflexif ajouté par « il s’élèvera » tout en maintenant la triple gradation rhétorique : élevé, exalté, très haut placé. Elle ne tranche pas l’identité théologique du serviteur et conserve la note lexicale nécessaire sur יַשְׂכִּיל.'
