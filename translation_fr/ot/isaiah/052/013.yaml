revisions:
- from: Voici, mon serviteur agira avec sagesse[a] ; il s’élèvera, il sera élevé, il sera placé très haut.
  to: Voici, mon serviteur agira avec sagesse[a] ; il sera élevé, il sera exalté, il sera très haut placé.
