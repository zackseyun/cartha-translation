  text: הִנֵּ֥ה יַשְׂכִּ֖יל עַבְדִּ֑/י יָר֧וּם וְ/נִשָּׂ֛א וְ/גָבַ֖הּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
translation:
  language: fr
  text: Voici, mon serviteur agira avec sagesse[a] ; il sera élevé, il sera exalté, il sera très haut placé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réussira ». Le verbe hébreu peut désigner une conduite avisée et, par extension, la réussite qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque solennellement et avec insistance l’entrée en scène du serviteur ; « Voici » est naturel dans le registre prophétique français.
- source_word: יַשְׂכִּיל
  choice: agira avec sagesse
  rationale: Le hiphil de שׂכל exprime une conduite avisée et peut aussi impliquer la réussite qui en découle. Le texte principal conserve le noyau lexical de sagesse, tandis que l’autre nuance figure en note.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Rend directement le statut relationnel exprimé par le suffixe de première personne, sans préciser dans la traduction l’identité du serviteur.
- source_word: יָרוּם
  choice: il s’élèvera
  rationale: Le qal de רום exprime ici le fait d’être ou de devenir élevé. Cette formulation conserve l’image verticale sans imposer un agent extérieur.
- source_word: וְנִשָּׂא
  choice: il sera élevé
  rationale: La forme de נשׂא a ici une valeur passive d’élévation ou d’exaltation ; la formulation française distingue cette forme du verbe précédent.
- source_word: וְגָבַהּ מְאֹד
  choice: il sera placé très haut
  rationale: Rend le point culminant de la triple élévation et la forte intensification de מְאֹד dans un français clair et digne.
theological_decisions:
- issue: Identification possible du serviteur comme figure messianique
  choice: Conserver « mon serviteur » sans identification explicite.
  alternative: Introduire « le Messie » ou « le Christ » dans le texte.
  rationale: L’hébreu de ce verset dit seulement « mon serviteur ». La traduction laisse ouverte l’identification théologique au lieu de l’inscrire dans le texte.
- issue: Nuance d’élévation dans יָרוּם וְנִשָּׂא וְגָבַהּ
  choice: Préserver les trois expressions successives d’élévation.
  alternative: Les condenser en une seule formule telle que « il sera souverainement exalté ».
  rationale: La triple progression est rhétoriquement importante et peut porter plusieurs résonances ; la conserver évite d’aplanir le texte.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « il » maintient la cadence prophétique et rend distincts les trois verbes hébreux d’élévation.
