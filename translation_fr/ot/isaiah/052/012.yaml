  text: כִּ֣י לֹ֤א בְ/חִפָּזוֹן֙ תֵּצֵ֔אוּ וּ/בִ/מְנוּסָ֖ה לֹ֣א תֵלֵכ֑וּ/ן כִּֽי הֹלֵ֤ךְ לִ/פְנֵי/כֶם֙ יְהוָ֔ה וּ/מְאַסִּפְ/כֶ֖ם אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
translation:
  language: fr
  text: Car vous ne sortirez pas à la hâte et vous ne partirez pas en fuyant[a], car Yahweh marche devant vous, et le Dieu d’Israël ferme votre marche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous ne vous en irez pas comme des fugitifs ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « le Dieu d’Israël vous rassemble par-derrière » ; autrement dit, il protège l’arrière du peuple en marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  choice: à la hâte
  rationale: Le nom חִפָּזוֹן exprime la hâte ou la précipitation. « À la hâte » est naturel en français et maintient le contraste avec un départ paisible placé sous la protection divine.
- source_word: תֵּצֵאוּ
  choice: vous ne sortirez pas
  rationale: Le verbe יצא signifie concrètement « sortir ». Cette traduction conserve l’image du mouvement hors d’un lieu et son écho possible à l’Exode.
- source_word: וּבִמְנוּסָה
  choice: en fuyant
  rationale: מְנוּסָה désigne la fuite. La tournure « en fuyant » est idiomatique et exprime clairement que le peuple ne partira pas comme un groupe forcé de s’échapper.
- source_word: תֵלֵכוּן
  choice: vous ne partirez pas
  rationale: הלך signifie couramment « aller » ou « marcher ». Dans ce parallélisme avec « sortir », « partir » donne un français naturel sans perdre l’idée de déplacement.
- source_word: הֹלֵךְ לִפְנֵיכֶם
  choice: marche devant vous
  rationale: Le participe הֹלֵךְ présente Yahweh en train d’aller devant le peuple. « Marche devant vous » conserve l’image concrète d’une conduite active.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וּמְאַסִּפְכֶם
  choice: ferme votre marche
  rationale: Le participe d’אסף peut décrire celui qui rassemble les retardataires depuis l’arrière et assure l’arrière d’une troupe en déplacement. « Ferme votre marche » restitue naturellement cette fonction protectrice tout en conservant l’image processionnelle.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette traduction directe de la construction génitivale préserve l’identité relationnelle et historique exprimée par l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin. « Yahweh » le représente comme nom propre et évite de le remplacer par un titre.
- issue: Sens de l’action divine à l’arrière du peuple
  choice: le Dieu d’Israël ferme votre marche
  alternative: le Dieu d’Israël vous rassemble par-derrière
  rationale: L’hébreu garde l’image d’un Dieu qui rassemble depuis l’arrière, avec une fonction de protection et de cohésion. La traduction principale exprime cette fonction sans exclure le sens plus littéral, signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle de l’hébreu est conservé par « vous ne sortirez pas… vous ne partirez pas », tandis que les présents « marche » et « ferme » rendent la vigueur des participes hébreux.
