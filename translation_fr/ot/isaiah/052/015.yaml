base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
translation:
  language: fr
  text: Ainsi, il aspergera de nombreuses nations[a] ; à cause de lui, des rois fermeront leur bouche. Car ils verront ce qui ne leur avait pas été raconté, et ils comprendront ce qu’ils n’avaient pas entendu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il frappera de stupeur de nombreuses nations ». Le verbe hébreu signifie habituellement « asperger », mais certains lui donnent ici le sens de provoquer l’étonnement.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: Introduit la correspondance avec la description du verset précédent tout en restant naturel en français.
- source_word: יַזֶּה
  choice: il fera l’aspersion sur
  rationale: Le hiphil de נזה signifie habituellement « asperger » dans des contextes rituels. Cette formulation conserve ce sens lexical sans expliciter davantage la portée de l’aspersion.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: גּוֹיִם désigne ici largement les nations ou les peuples, sans imposer le terme plus marqué « païens ».
- source_word: עָלָיו
  choice: à cause de lui
  rationale: Dans l’expression qui suit, la préposition indique naturellement la cause ou l’occasion du silence des rois.
- source_word: יִקְפְּצוּ מְלָכִים פִּיהֶם
  choice: des rois fermeront la bouche
  rationale: Préserve l’image concrète de rois réduits au silence par la stupeur.
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם רָאוּ
  choice: ils verront ce qui ne leur avait pas été raconté
  rationale: Le plus-que-parfait marque que l’absence de récit est antérieure à leur découverte, tandis que le futur rend la valeur prophétique de l’accompli hébreu.
- source_word: וַאֲשֶׁר לֹא שָׁמְעוּ הִתְבּוֹנָנוּ
  choice: ils comprendront ce qu’ils n’avaient pas entendu
  rationale: הִתְבּוֹנָנוּ exprime une compréhension réfléchie, et non une simple perception auditive.
theological_decisions:
- issue: Sens de יַזֶּה dans le contexte du serviteur
  choice: il fera l’aspersion sur de nombreuses nations
  alternative: il frappera de stupeur de nombreuses nations
  rationale: Le sens lexical habituel du hiphil de נזה est celui d’asperger, notamment dans les contextes rituels. La traduction principale le conserve sans préciser si l’image implique purification, consécration ou autre effet. L’interprétation « frapper de stupeur », motivée par la réaction des rois, demeure signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image rituelle inhabituelle de l’aspersion ainsi que le parallélisme entre voir et comprendre.
