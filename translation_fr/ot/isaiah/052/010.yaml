id: ISA.52.10
reference: Isaiah 52:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
translation:
  language: fr
  text: Yahweh a mis à nu son bras saint sous les yeux de toutes les nations[a], et toutes les extrémités de la terre verront le salut de notre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « aux yeux de toutes les nations ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la délivrance de notre Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂף
  choice: a mis à nu
  rationale: Le verbe signifie découvrir ou dénuder. « A mis à nu » conserve l’image concrète d’un bras dégagé en vue d’une action décisive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: son bras saint
  rationale: Cette formulation naturelle en français maintient à la fois l’image anthropomorphique du bras, qui évoque la puissance agissante, et sa qualification comme saint.
- source_word: לְעֵינֵי כָּל הַגּוֹיִם
  choice: sous les yeux de toutes les nations
  rationale: L’expression garde la dimension visuelle et publique de l’action, tout en étant idiomatique en français moderne.
- source_word: וְרָאוּ
  choice: verront
  rationale: Bien que la forme hébraïque soit un accompli, le contexte prophétique permet ici une portée future exprimant le résultat de l’action annoncée.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: toutes les extrémités de la terre
  rationale: Cette expression française familière reproduit l’image hébraïque des régions les plus lointaines et, par extension, du monde entier.
- source_word: יְשׁוּעַת
  choice: le salut
  rationale: Le nom peut désigner le salut ou la délivrance. « Salut » convient au vaste acte salvateur de Dieu sans exclure l’idée concrète de délivrance.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La traduction conserve la perspective communautaire à la première personne du pluriel.
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’action divine
  choice: Conserver l’image de « son bras saint » mis à nu.
  alternative: Expliciter par « sa sainte puissance ».
  rationale: L’hébreu emploie délibérément une image corporelle et poétique. La conserver évite de réduire le texte à une abstraction interprétative.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre.
- issue: Valeur temporelle de וְרָאוּ
  choice: 'Futur : « verront ».'
  alternative: 'Accompli prophétique : « ont vu ».'
  rationale: Dans l’enchaînement prophétique, la vision universelle est présentée comme la conséquence attendue de l’action déjà proclamée de Yahweh; le futur français rend clairement cette relation sans effacer la force de certitude de l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore concrète du bras est préservée, ainsi que la portée universelle de l’annonce. « Sous les yeux de » exprime naturellement le caractère visible et public de l’acte.
