source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה מִצְרַ֛יִם יָֽרַד עַמִּ֥/י בָ/רִֽאשֹׁנָ֖ה לָ/ג֣וּר שָׁ֑ם וְ/אַשּׁ֖וּר בְּ/אֶ֥פֶס עֲשָׁקֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : « D’abord, mon peuple est descendu en Égypte pour y séjourner comme étranger, et l’Assyrie l’a opprimé sans raison.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour rien », « gratuitement » ou « sans contrepartie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition peu naturelle « le Seigneur SEIGNEUR ».
- source_word: בָרִאשֹׁנָה
  choice: autrefois
  rationale: Dans ce rappel historique, le terme renvoie au premier épisode, celui de la descente en Égypte, antérieur à l’oppression assyrienne. « Autrefois » est naturel en français tout en conservant cette valeur temporelle.
- source_word: לָגוּר
  choice: séjourner comme étranger
  rationale: Le verbe גור désigne ici le fait de résider dans un pays où l’on est étranger, nuance que le simple verbe « habiter » effacerait.
- source_word: עֲשָׁקוֹ
  choice: l’a opprimé
  rationale: Le suffixe hébreu est au masculin singulier et reprend collectivement « mon peuple ». Le pronom français « l’ » conserve naturellement ce singulier collectif.
- source_word: בְּאֶפֶס
  choice: sans raison
  rationale: Cette expression peut indiquer une oppression gratuite, dépourvue de motif légitime. La note conserve l’autre nuance possible, « pour rien » ou « sans contrepartie ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix fait apparaître le nom propre divin יהוה tout en rendant אֲדֹנָי par « le Seigneur ».
- issue: Nombre du pronom dans עֲשָׁקוֹ
  choice: 'singulier collectif : « l’a opprimé »'
  alternative: 'pluriel selon le sens : « les a opprimés »'
  rationale: L’hébreu personnifie le peuple comme une entité masculine singulière. Le français permet de préserver cette construction sans manquer de naturel.
- issue: Sens de בְּאֶפֶס
  choice: sans raison
  alternative: pour rien / sans contrepartie
  rationale: Le contexte favorise l’idée d’une oppression injustifiée, mais la formulation hébraïque peut aussi évoquer l’absence de gain ou de paiement; cette possibilité est signalée en note.
translation_notes:
  register: Français international actuel, digne et accessible. « Séjourner comme étranger » explicite une nuance lexicale importante sans recourir au terme plus littéraire « séjourner en étranger ». Le singulier collectif de « peuple » permet de rendre fidèlement le suffixe masculin singulier hébreu.
