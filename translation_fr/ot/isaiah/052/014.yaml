revisions:
- from: De même que beaucoup ont été horrifiés en te voyant — tant son apparence était défigurée, au point de ne plus être celle d’un homme, et son aspect, celui des êtres humains[a] —
  to: De même que beaucoup ont été horrifiés devant toi — tant son apparence était défigurée, plus que celle d’un homme, et son aspect, plus que celui des êtres humains —
  rationale: La révision conserve le changement de personne et la structure comparative du texte massorétique, tout en évitant l’ajout interprétatif « ne plus être ». Elle corrige également l’explication lexicale de בני אדם dans la note.
