review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement la corrélation « De même que … tant », ainsi que le changement abrupt de la deuxième personne (« te ») à la troisième (« son »). Toutefois, « au point de ne plus être » explicite excessivement la comparaison exprimée par מן (« plus que / au-delà de ») et transforme une formulation comparative en affirmation interprétative. La note qualifie aussi inexactement בני אדם de « fils d’Adam » au sens littéral; l’expression signifie littéralement « fils de l’homme / de l’humain » et désigne idiomatiquement les êtres humains.
  naturalness: Le français est globalement moderne et clair. « Beaucoup ont été horrifiés en te voyant » est naturel, mais « devant toi » rend mieux la relation de עַל sans introduire explicitement l’acte de voir. La reprise elliptique « et son aspect, plus que celui des êtres humains » est soutenue et naturelle dans cette construction poétique.
  terminology: « Défigurée » rend bien מִשְׁחַת en français moderne. « Apparence » et « aspect » préservent utilement la distinction entre מראה et תאר. « Êtres humains » rend le sens générique de בני אדם, tandis que la note doit signaler la formulation littérale sans l’assimiler indûment au nom propre Adam.
  issues:
  - severity: medium
    issue: La formulation « au point de ne plus être celle d’un homme » dépasse la comparaison hébraïque.
    rationale: מֵאִישׁ et מִבְּנֵי אָדָם expriment une comparaison d’excès. La traduction ne devrait pas décider explicitement que l’apparence a cessé d’être humaine.
  - severity: medium
    issue: La note donne « les fils d’Adam » comme sens littéral de בני אדם.
    rationale: Le texte porte « fils de l’homme / de l’humain »; Adam peut être compris comme le nom commun אדם, mais le présenter comme le nom propre « Adam » est trompeur dans cette note.
  revised_text: De même que beaucoup ont été horrifiés devant toi — tant son apparence était défigurée, plus que celle d’un homme, et son aspect, plus que celui des êtres humains —
  revised_footnotes:
  - marker: a
    text: 'L’hébreu passe de « toi » à « son » dans le même verset : « beaucoup ont été horrifiés devant toi… son apparence… son aspect ». Littéralement, la dernière expression est « les fils de l’homme »; elle désigne idiomatiquement les êtres humains.'
    reason: alternative_reading
  revision_rationale: La révision conserve le changement de personne et la structure comparative du texte massorétique, tout en évitant l’ajout interprétatif « ne plus être ». Elle corrige également l’explication lexicale de בני אדם dans la note.
