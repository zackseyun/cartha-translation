source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר שָׁמְמ֤וּ עָלֶ֨י/ךָ֙ רַבִּ֔ים כֵּן מִשְׁחַ֥ת מֵ/אִ֖ישׁ מַרְאֵ֑/הוּ וְ/תֹאֲר֖/וֹ מִ/בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
translation:
  language: fr
  text: De même que beaucoup ont été horrifiés devant toi — tant son apparence était défigurée, plus que celle d’un homme, et son aspect, plus que celui des êtres humains —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: De même que ... tant
  rationale: Rend la structure corrélative qui commence ici et se poursuit au verset suivant, tout en introduisant naturellement en français le degré extrême de la défiguration.
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: ont été horrifiés en te voyant
  rationale: Le verbe exprime ici une réaction de stupeur effrayée devant l’apparence du serviteur. « En te voyant » explicite naturellement en français le rapport contextuel de עַל sans effacer la deuxième personne.
- source_word: מִשְׁחַת
  choice: défigurée
  rationale: Le terme évoque une apparence abîmée ou ruinée. « Défigurée » est clair, actuel et adapté au contexte physique; « mutilée » serait plus précis que ne l’autorise le mot.
- source_word: מֵאִישׁ מַרְאֵהוּ
  choice: son apparence était défigurée, au point de ne plus être celle d’un homme
  rationale: 'Le מִן comparatif marque ici un dépassement: son apparence est présentée comme ne correspondant plus à une apparence humaine normale.'
- source_word: וְתֹאֲרוֹ
  choice: et son aspect
  rationale: « Aspect » distingue תֹּאַר de מַרְאֶה tout en restant idiomatique et compréhensible.
- source_word: מִבְּנֵי אָדָם
  choice: celui des êtres humains
  rationale: L’expression hébraïque désigne idiomatiquement les humains. Cette formulation française conserve le sens générique sans calquer l’expression peu naturelle « fils de l’homme ».
theological_decisions:
- issue: Changement de personne grammaticale dans le verset
  choice: Conserver le passage de « te » à « son »
  alternative: Harmoniser tout le verset à la deuxième ou à la troisième personne
  rationale: Le texte massorétique passe abruptement de la deuxième personne masculine singulière aux suffixes de troisième personne masculine singulière. La traduction préserve cette tension textuelle au lieu de l’aplanir.
- issue: Portée de בְּנֵי אָדָם
  choice: êtres humains
  alternative: fils d’Adam / fils de l’homme
  rationale: Dans ce contexte comparatif, l’expression a une portée générique et désigne l’humanité, sans limitation aux hommes de sexe masculin.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase demeure ouverte par un tiret final implicite dans la syntaxe, puisque la comparaison commencée ici trouve son aboutissement au verset 15.
