- from: Et maintenant, qu’ai-je à faire ici ? — déclaration de Yahweh. En effet, mon peuple a été emmené pour rien ; ceux qui le dominent poussent des cris[a] — déclaration de Yahweh — et, sans cesse, tout au long du jour, mon nom est méprisé[b].
  to: Et maintenant, qu’ai-je donc ici ? — déclaration de Yahweh. En effet, mon peuple a été emmené pour rien ; ceux qui le dominent hurlent[a] — déclaration de Yahweh — et, sans cesse, tout au long du jour, mon nom est méprisé[b].
  rationale: La révision retire l’ajout sémantique de « à faire » afin de préserver la question rhétorique hébraïque, et remplace l’expression vague « poussent des cris » par « hurlent », plus proche de la force lexicale de יְהֵילִילוּ. Les notes et leurs ancrages restent inchangés et adéquats.
