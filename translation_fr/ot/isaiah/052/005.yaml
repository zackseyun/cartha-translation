base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
translation:
  language: fr
  text: Et maintenant, qu’ai-je donc ici ? — déclaration de Yahweh. En effet, mon peuple a été emmené pour rien ; ceux qui le dominent hurlent[a] — déclaration de Yahweh — et, sans cesse, tout au long du jour, mon nom est méprisé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses oppresseurs hurlent » ; le terme hébreu désigne ceux qui exercent le pouvoir sur le peuple et, dans ce contexte, leur domination est oppressive.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon nom est blasphémé sans cesse, tout au long du jour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et la transition temporelle du texte hébreu.
- source_word: מַה־לִּי פֹה
  choice: qu’ai-je à faire ici ?
  rationale: Expression française naturelle qui restitue la question rhétorique et la protestation divine sans lui donner un sens excessivement précis.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Formule prophétique solennelle, proche de la construction nominale hébraïque et naturelle en français biblique actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte source.
- source_word: כִּי
  choice: En effet
  rationale: Introduit ici le motif de la question précédente ; « En effet » rend clairement ce lien argumentatif.
- source_word: לֻקַּח עַמִּי
  choice: mon peuple a été emmené
  rationale: Le passif accompli décrit une action achevée dont les conséquences demeurent ; « emmené » convient au contexte de déportation.
- source_word: חִנָּם
  choice: pour rien
  rationale: Préserve l’ambiguïté entre l’absence de paiement, de profit légitime ou de juste motif.
- source_word: מֹשְׁלָיו
  choice: ceux qui le dominent
  rationale: Rend le participe « ceux qui exercent le pouvoir sur lui » et laisse percevoir la domination oppressive du contexte sans remplacer le terme par « oppresseurs ».
- source_word: יְהֵילִילוּ
  choice: poussent des cris
  rationale: Restitue les cris sonores désignés par le verbe, tout en conservant l’ambiguïté contextuelle quant à leur nuance exacte, plainte ou clameur arrogante.
- source_word: וְתָמִיד כָּל־הַיּוֹם
  choice: et, sans cesse, tout au long du jour
  rationale: Conserve les deux expressions temporelles cumulatives et leur effet d’insistance.
- source_word: שְׁמִי
  choice: mon nom
  rationale: Traduction directe qui maintient la portée biblique du nom comme réputation et honneur révélés de Dieu.
- source_word: מִנֹּאָץ
  choice: est méprisé
  rationale: Rend le sens large de rejet et d’outrage sans restreindre le verbe à la seule notion de blasphème.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le tétragramme ; employer « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Identité et attitude de מֹשְׁלָיו יְהֵילִילוּ
  choice: ceux qui le dominent poussent des cris
  alternative: ses oppresseurs hurlent / ses dirigeants se lamentent
  rationale: Le sujet désigne grammaticalement ceux qui gouvernent ou dominent le peuple, tandis que le verbe évoque un cri puissant. La traduction principale évite de décider si ces cris expriment exclusivement la lamentation ou une clameur oppressive.
- issue: Nature de l’outrage exprimé par מִנֹּאָץ
  choice: mon nom est méprisé
  alternative: mon nom est blasphémé
  rationale: Le verbe peut désigner largement le mépris ou, dans ce contexte, le blasphème. Le texte principal retient le sens englobant et la note conserve la lecture plus spécifique.
