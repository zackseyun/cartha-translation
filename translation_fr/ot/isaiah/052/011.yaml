id: ISA.52.11
reference: Isaiah 52:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ס֤וּרוּ ס֨וּרוּ֙ צְא֣וּ מִ/שָּׁ֔ם טָמֵ֖א אַל תִּגָּ֑עוּ צְא֣וּ מִ/תּוֹכָ֔/הּ הִבָּ֕רוּ נֹשְׂאֵ֖י כְּלֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
translation:
  language: fr
  text: Éloignez-vous[a], éloignez-vous ! Sortez de là. Ne touchez rien d’impur. Sortez du milieu d’elle[b] ; purifiez-vous[c], vous qui portez les objets sacrés de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Partez, partez ! » La répétition renforce l’appel à se séparer.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « du milieu d’elle » ; le féminin renvoie probablement à la ville personnifiée.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « soyez purs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Éloignez-vous
  rationale: L’impératif pluriel répété exprime avec force la séparation demandée. « Éloignez-vous » garde cette nuance tout en distinguant ce verbe de צְאוּ, rendu par « sortez ».
- source_word: צְאוּ
  choice: Sortez
  rationale: L’impératif pluriel de יצא indique directement qu’il faut quitter le lieu en question ; « sortez » est clair et naturel.
- source_word: מִשָּׁם
  choice: de là
  rationale: Cette expression adverbiale désigne simplement le lieu à quitter.
- source_word: טָמֵא אַל תִּגָּעוּ
  choice: Ne touchez rien d’impur
  rationale: L’adjectif טָמֵא est employé substantivement. Cette formulation française conserve le vocabulaire de l’impureté sans préciser indûment s’il s’agit du domaine rituel ou moral.
- source_word: מִתּוֹכָהּ
  choice: du milieu d’elle
  rationale: Le suffixe féminin singulier est conservé, probablement en référence à la ville personnifiée, sans remplacer cette référence par un neutre.
- source_word: הִבָּרוּ
  choice: purifiez-vous
  rationale: L’impératif exprime ici la mise en état de pureté, particulièrement appropriée pour ceux qui portent les objets consacrés à Yahweh. La note conserve l’autre rendu possible, « soyez purs ».
- source_word: נֹשְׂאֵי
  choice: vous qui portez
  rationale: Le participe a une valeur vocative et désigne le rôle continu des personnes interpellées.
- source_word: כְּלֵי יְהוָה
  choice: les objets sacrés de Yahweh
  rationale: כְּלִי désigne ici les objets ou récipients liés au culte. « Objets sacrés » est naturel en français moderne et rend explicite leur fonction cultuelle immédiate sans employer l’archaïque « vases ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée du langage de l’impureté
  choice: Conserver « impur » et « purifiez-vous » sans limiter ces termes à la seule pureté rituelle ou à la seule conduite morale.
  alternative: Interpréter exclusivement l’ordre comme une purification cérémonielle, ou exclusivement comme une rupture morale avec le péché de Babylone.
  rationale: Le port des objets sacrés inscrit le verset dans un cadre cultuel, tandis que l’appel à quitter la ville peut aussi avoir une portée morale. La traduction maintient cette tension.
- issue: Référent féminin de מִתּוֹכָהּ
  choice: Conserver le féminin dans « du milieu d’elle ».
  alternative: Neutraliser la référence par « de ce lieu » ou préciser « de Babylone ».
  rationale: L’hébreu emploie un suffixe féminin, vraisemblablement pour une ville personnifiée, mais le verset ne nomme pas explicitement cette ville. La traduction ne tranche donc pas davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs brefs préservent l’urgence du texte. « Objets sacrés » évite l’emploi aujourd’hui ambigu ou archaïque de « vases », tandis que « Yahweh » conserve le nom divin.
