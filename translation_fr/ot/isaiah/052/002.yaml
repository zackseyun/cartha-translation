source:
  edition: WLC
  text: הִתְנַעֲרִ֧י מֵ/עָפָ֛ר ק֥וּמִי שְּׁבִ֖י יְרֽוּשָׁלִָ֑ם התפתחו מוֹסְרֵ֣י צַוָּארֵ֔/ךְ שְׁבִיָּ֖ה בַּת צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
translation:
  language: fr
  text: Secoue la poussière qui te couvre, lève-toi, prends place[a], Jérusalem ! Détache les liens de ton cou[b], captive, fille de Sion[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « assieds-toi ». Dans ce contexte, l’expression peut évoquer une place d’honneur retrouvée.'
    reason: lexical_alternative
  - marker: b
    text: La forme hébraïque traduite par « Détache » est difficile et irrégulière. Elle signifie probablement « détache-toi » ou « sois délivrée » des liens qui entourent ton cou.
    reason: textual_variant
  - marker: c
    text: 'On pourrait aussi comprendre : « fille captive de Sion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְנַעֲרִי מֵעָפָר
  choice: Secoue la poussière qui te couvre
  rationale: Le hitpael impératif exprime l’action réflexive de se débarrasser de la poussière. Cette formulation française conserve l’image concrète de l’abaissement tout en étant plus naturelle que « secoue-toi de la poussière ».
- source_word: קוּמִי
  choice: lève-toi
  rationale: Impératif féminin singulier de קום, rendu par l’expression française courante correspondant au mouvement hors de l’abaissement.
- source_word: שְּׁבִי
  choice: prends place
  rationale: Le verbe signifie littéralement « assieds-toi ». « Prends place » reste proche de ce sens tout en pouvant suggérer, sans l’imposer, la dignité retrouvée dans ce contexte de restauration.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville personnifiée.
- source_word: התפתחו
  choice: Détache
  rationale: La forme hébraïque est difficile et irrégulière, mais le sens probable est celui d’un dégagement des entraves. Le singulier français s’accorde avec la destinataire personnifiée sans prétendre résoudre la difficulté morphologique.
- source_word: מוֹסְרֵי צַוָּארֵךְ
  choice: les liens de ton cou
  rationale: La construction désigne les entraves attachées au cou. « Liens » préserve une certaine généralité plutôt que de préciser indûment cordes ou chaînes.
- source_word: שְׁבִיָּה
  choice: captive
  rationale: Le féminin singulier qualifie la destinataire et maintient l’image de la captivité.
- source_word: בַּת צִיּוֹן
  choice: fille de Sion
  rationale: Expression prophétique traditionnelle et naturelle en français pour la personnification de Sion.
theological_decisions:
- issue: Portée de שְּׁבִי dans l’oracle de restauration
  choice: prends place
  alternative: assieds-toi ; siège en reine
  rationale: Le contexte oppose la poussière et la captivité à une position restaurée, mais le verbe ne dit pas explicitement « régner » ou « être intronisée ». La formulation choisie laisse percevoir la dignité retrouvée sans ajouter cette notion au texte.
- issue: Forme irrégulière התפתחו
  choice: Détache les liens de ton cou
  alternative: Que les liens de ton cou soient détachés ; libère-toi des liens de ton cou
  rationale: La traduction donne le sens probable du commandement tout en signalant en note l’irrégularité de la forme, sans adopter silencieusement une correction textuelle.
- issue: Relation syntaxique entre שְׁבִיָּה et בַּת צִיּוֹן
  choice: captive, fille de Sion
  alternative: fille captive de Sion
  rationale: La ponctuation maintient « captive » comme désignation apposée et préserve la formule « fille de Sion », sans trancher plus que nécessaire leur articulation exacte.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs féminins rendent la personnification de Jérusalem/Sion. Le parallélisme et les images concrètes de poussière, de place retrouvée et d’entraves sont conservés, sans introduire explicitement une intronisation absente du lexème.
