  source_fidelity: 'Le texte rend fidèlement l’exclamation, l’image des « pieds », les participes successifs et la proclamation royale. Toutefois, « la nouvelle de bonnes choses » ne correspond pas au second emploi de מְבַשֵּׂר : l’hébreu répète l’idée de « porter/annoncer une bonne nouvelle », avec טוֹב pour contenu. La répétition doit être conservée plus exactement.'
