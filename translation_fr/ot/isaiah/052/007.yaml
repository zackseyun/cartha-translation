source:
  edition: WLC
  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
translation:
  language: fr
  text: 'Qu’ils sont beaux, sur les montagnes, les pieds de celui qui apporte une bonne nouvelle, qui annonce la paix, qui apporte la bonne nouvelle de ce qui est bon, qui annonce le salut et qui dit à Sion : « Ton Dieu règne ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ton Dieu est devenu roi ! » ou « Ton Dieu est roi ! » L’hébreu peut mettre l’accent sur l’avènement du roi ou sur l’exercice de sa royauté.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נָּאווּ
  choice: Qu’ils sont beaux
  rationale: מַה introduit ici une exclamation admirative, et נָאווּ exprime la beauté ou le caractère agréable. Cette tournure française conserve l’exclamation poétique sans la transformer en question.
- source_word: עַל הֶהָרִים
  choice: sur les montagnes
  rationale: Conserve l’image géographique concrète du messager arrivant par les hauteurs; « montagnes » correspond directement à הָרִים.
- source_word: רַגְלֵי
  choice: les pieds
  rationale: La traduction littérale préserve l’image poétique vive où les pieds représentent l’arrivée bienvenue du messager.
- source_word: מְבַשֵּׂר
  choice: celui qui apporte une bonne nouvelle
  rationale: Le participe substantivé désigne celui qui porte une bonne nouvelle. Cette formulation naturelle conserve la force verbale sans introduire une fonction technique.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: qui annonce la paix
  rationale: Le hifil de שמע signifie faire entendre, donc annoncer ou proclamer. « Annonce la paix » est clair et respecte le caractère public du message.
- source_word: מְבַשֵּׂר טוֹב
  choice: qui apporte la nouvelle de bonnes choses
  rationale: Cette formulation conserve la répétition de la racine בשׂר et la portée large de טוֹב, sans la limiter à la prospérité matérielle.
- source_word: מַשְׁמִיעַ יְשׁוּעָה
  choice: qui annonce le salut
  rationale: יְשׁוּעָה désigne le salut ou la délivrance. « Salut » préserve sa portée théologique et canonique sans exclure l’idée de délivrance concrète.
- source_word: אֹמֵר לְצִיּוֹן
  choice: qui dit à Sion
  rationale: Rend simplement l’introduction au discours direct et conserve le nom traditionnel « Sion ».
- source_word: מָלַךְ אֱלֹהָיִךְ
  choice: Ton Dieu règne !
  rationale: Le qatal de מלך peut annoncer l’exercice de la royauté ou l’avènement royal. « Règne » est une proclamation française naturelle qui n’impose pas trop étroitement un événement ponctuel.
theological_decisions:
- issue: Sens de la proclamation royale מָלַךְ אֱלֹהָיִךְ
  choice: Ton Dieu règne !
  alternative: « Ton Dieu est devenu roi ! » ou « Ton Dieu est roi ! »
  rationale: La forme hébraïque peut souligner soit l’avènement du roi, soit sa royauté désormais exercée. Le texte principal emploie une proclamation idiomatique, tandis que la note maintient les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et poétique. La structure cumulative et la répétition de l’annonce sont conservées, tout en évitant des formulations archaïques comme « bonnes nouvelles » au pluriel ou « messager de bonnes nouvelles ».
