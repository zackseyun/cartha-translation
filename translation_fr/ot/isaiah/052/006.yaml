id: ISA.52.6
reference: Isaiah 52:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֛ן יֵדַ֥ע עַמִּ֖/י שְׁמִ֑/י לָ/כֵן֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי אֲנִי ה֥וּא הַֽ/מְדַבֵּ֖ר הִנֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/006.yaml
  text: 'Therefore my people will know my name[a]; therefore on that day they will know that I am he who speaks: Here I am.'
translation:
  language: fr
  text: 'C’est pourquoi mon peuple connaîtra mon nom ; c’est pourquoi, ce jour-là, il saura que c’est moi qui parle[a] : « Me voici ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « que moi, je suis celui qui parle » — l’hébreu exprime une forte insistance sur l’identité du locuteur.'
    reason: ambiguïté syntaxique et emphase de l’expression hébraïque
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Ce connecteur exprime la conséquence de ce qui précède. Sa répétition est conservée afin de reproduire l’insistance du texte hébreu.
- source_word: יֵדַע
  choice: connaîtra / saura
  rationale: L’imparfait hébreu a ici une valeur future. En français, « connaître » convient avec « mon nom », tandis que « savoir » introduit naturellement une proposition complétive.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Cette expression d’alliance est rendue directement, en gardant le singulier collectif.
- source_word: שְׁמִי
  choice: mon nom
  rationale: Le terme peut évoquer l’identité, la réputation et le caractère révélé de Dieu, mais la traduction littérale préserve toute cette richesse sans l’expliciter abusivement.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Formulation française naturelle pour cette expression temporelle fréquente dans les textes prophétiques.
- source_word: כִּי
  choice: que
  rationale: La particule introduit ici le contenu de ce que le peuple saura, plutôt qu’une proposition causale.
- source_word: אֲנִי הוּא הַמְדַבֵּר
  choice: c’est moi qui parle
  rationale: Cette tournure française naturelle rend l’identification emphatique אֲנִי הוּא et le participe substantivé הַמְדַבֵּר, sans transformer la formule en affirmation théologique plus développée.
- source_word: הִנֵּנִי
  choice: Me voici !
  rationale: Cette formule de présentation exprime avec concision la présence immédiate du locuteur.
theological_decisions:
- issue: Formule emphatique d’auto-identification divine אֲנִי הוּא
  choice: c’est moi qui parle
  alternative: moi, je suis celui qui parle
  rationale: Le choix retient l’emphase et l’unité de l’expression en français idiomatique. La note signale une construction plus proche de la forme hébraïque, afin de préserver la densité de l’auto-identification sans lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « C’est pourquoi » et le rythme solennel de la déclaration prophétique sont conservés ; les guillemets mettent en relief la parole finale de présentation divine.
