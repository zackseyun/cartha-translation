source:
  edition: WLC
  text: פִּצְח֤וּ רַנְּנוּ֙ יַחְדָּ֔ו חָרְב֖וֹת יְרוּשָׁלִָ֑ם כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ גָּאַ֖ל יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/009.yaml
  text: Break forth[a], sing together, you ruins of Jerusalem, for Yahweh has comforted his people; he has redeemed Jerusalem.
translation:
  language: fr
  text: Éclatez de joie et chantez toutes ensemble[a], ruines de Jérusalem, car Yahweh a consolé son peuple ; il a racheté Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Éclatez toutes ensemble en chants de joie, ruines de Jérusalem. »'
    reason: La paire d’impératifs hébreux peut être rendue par une expression française unifiée qui conserve l’idée d’une irruption collective de joie chantée.
lexical_decisions:
- source_word: פִּצְחוּ
  choice: Éclatez
  rationale: L’impératif pluriel évoque le déclenchement soudain et puissant d’un chant ou d’un cri. « Éclatez » conserve cette image vive en français.
- source_word: רַנְּנוּ
  choice: en chants de joie
  rationale: Le verbe désigne une expression vocale jubilante, chantée ou criée. Dans cette construction française, « en chants de joie » rend naturellement la joie sonore tout en se combinant avec l’impératif précédent.
- source_word: יַחְדָּו
  choice: toutes ensemble
  rationale: L’adverbe souligne la réjouissance collective. L’accord au féminin reprend « ruines ».
- source_word: חָרְבוֹת
  choice: ruines
  rationale: Le nom désigne les lieux dévastés de Jérusalem. « Ruines » est concis, concret et naturel.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu, répétée à la fin comme dans l’hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée aux ruines de se réjouir.
- source_word: נִחַם
  choice: a consolé
  rationale: Le parfait exprime ici l’action de procurer consolation et soulagement. « A consolé » garde le sens prophétique de restauration sans l’expliciter excessivement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Rend directement le nom avec son suffixe possessif masculin singulier.
- source_word: גָּאַל
  choice: a racheté
  rationale: Le verbe exprime l’acte de délivrer ou de reprendre comme rédempteur. « A racheté » conserve sa portée de délivrance et ses résonances d’alliance sans préciser un mécanisme absent du verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel.
- issue: Portée de גָּאַל
  choice: a racheté Jérusalem
  alternative: a délivré Jérusalem ; a repris Jérusalem
  rationale: « Racheté » maintient la profondeur juridique, familiale et alliancielle possible du verbe, sans réduire le sens à une simple libération ni importer une explication doctrinale particulière.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe aux ruines est conservée, ainsi que la répétition finale de « Jérusalem ». La ponctuation maintient les deux actes divins parallèles sans ajouter de lien interprétatif.
