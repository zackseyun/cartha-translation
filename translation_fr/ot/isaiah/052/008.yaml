source:
  edition: WLC
  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
translation:
  language: fr
  text: La voix de tes guetteurs ! Ils élèvent la voix ; tous ensemble, ils poussent des cris de joie, car ils verront de leurs propres yeux[a] Yahweh revenir à Sion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « œil à œil », c’est-à-dire directement, de façon immédiate.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « quand Yahweh rétablira Sion ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֥וֹל
  choice: La voix de
  rationale: Le nom signifie « voix » ou « son ». L’ouverture nominale est conservée sans ajouter un impératif absent de l’hébreu.
- source_word: צֹפַיִךְ
  choice: tes guetteurs
  rationale: Le terme désigne ceux qui montent la garde et observent au loin. Le possessif féminin singulier s’adresse à Sion.
- source_word: נָשְׂאוּ קוֹל
  choice: ils élèvent la voix
  rationale: Cette expression idiomatique signifie élever ou faire entendre sa voix.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Cette formulation naturelle souligne l’unité des guetteurs dans leur joie.
- source_word: יְרַנֵּנוּ
  choice: ils poussent des cris de joie
  rationale: Le verbe exprime une acclamation jubilante, éventuellement chantée ; « pousser des cris de joie » convient à cette annonce publique.
- source_word: עַיִן בְּעַיִן
  choice: de leurs propres yeux
  rationale: La locution évoque une vision directe et personnelle. Cette formulation communique naturellement ce sens en français, tandis qu’une note conserve l’image hébraïque.
- source_word: יִרְאוּ
  choice: ils verront
  rationale: Dans ce contexte d’annonce, l’inaccompli hébreu est rendu au futur.
- source_word: בְּשׁוּב
  choice: revenir
  rationale: L’infinitif construit de שוב peut exprimer le retour de Yahweh. Après un verbe de perception, l’infinitif français permet une phrase naturelle sans effacer la possibilité d’une autre analyse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom propre traditionnel est conservé en français.
theological_decisions:
- issue: Sens de עַיִן בְּעַיִן
  choice: de leurs propres yeux
  alternative: œil à œil ; directement
  rationale: Le contexte indique vraisemblablement une vision immédiate et personnelle, non un accord entre personnes. La note maintient toutefois l’image littérale et son ambiguïté.
- issue: Sujet et valeur de בְּשׁוּב יְהוָה צִיּוֹן
  choice: Yahweh revient à Sion
  alternative: Yahweh rétablit Sion
  rationale: La lecture de Yahweh comme sujet de « revenir » convient bien au contexte et à la construction, mais la possibilité d’un emploi transitif de שוב, « rétablir », mérite d’être signalée.
translation_notes:
  register: Français international actuel, digne et accessible. L’ouverture nominale et l’élan poétique du verset sont conservés ; la ponctuation met en relief l’annonce des guetteurs.
