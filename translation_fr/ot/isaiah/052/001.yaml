language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
translation:
  language: fr
  text: Réveille-toi, réveille-toi ! Revêts-toi de ta force, Sion ! Revêts tes habits de splendeur[a], Jérusalem, ville sainte ! Car désormais, l’incirconcis et l’impur[b] n’entreront plus chez toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes magnifiques habits » ou « tes beaux habits ».
    reason: lexical_alternative
  - marker: b
    text: Les expressions « l’incirconcis » et « l’impur » reprennent le langage biblique de l’alliance et de la pureté. Ici, leur portée peut être ethnique, rituelle ou morale, sans que le verset la précise entièrement.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  choice: Réveille-toi, réveille-toi !
  rationale: Le double impératif féminin singulier interpelle Sion avec urgence. La répétition et la vigueur poétique sont conservées dans un français naturel.
- source_word: לִבְשִׁי עֻזֵּךְ
  choice: Revêts-toi de ta force
  rationale: Cette formulation conserve l’image hébraïque de la force portée comme un vêtement, tout en restant claire et digne en français.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  choice: Revêts tes habits de splendeur
  rationale: « Habits » traduit concrètement בִּגְדֵי, tandis que « splendeur » rend la beauté, l’éclat et la magnificence exprimés par תִפְאֶרֶת.
- source_word: יְרוּשָׁלִַם עִיר הַקֹּדֶשׁ
  choice: Jérusalem, ville sainte
  rationale: L’apposition vocative est rendue sans article, tournure fluide et naturelle en français, tout en conservant le caractère défini de la ville qualifiée de sainte.
- source_word: כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד
  choice: Car désormais, … n’entreront plus chez toi
  rationale: « Ne… plus » exprime la cessation future marquée par לֹא יוֹסִיף et עוֹד. « Désormais » renforce cette perspective sans la redoubler maladroitement.
- source_word: עָרֵל וְטָמֵא
  choice: l’incirconcis et l’impur
  rationale: Les substantifs singuliers collectifs et les catégories d’alliance et de pureté sont maintenus, sans les limiter à une interprétation ethnique, rituelle ou morale.
theological_decisions:
- issue: Portée de « l’incirconcis et l’impur »
  choice: Conserver les catégories d’alliance et de pureté sans préciser davantage leur référent.
  alternative: Identifier explicitement des envahisseurs étrangers, des personnes rituellement impures ou les exclus d’une Jérusalem eschatologique.
  rationale: Le texte peut évoquer plusieurs dimensions à la fois et ne tranche pas lui-même entre elles. La traduction préserve cette tension théologique.
- issue: Personnification de Sion et de Jérusalem
  choice: Maintenir les impératifs féminins adressés à la ville personnifiée.
  alternative: Paraphraser en s’adressant directement aux habitants de Jérusalem.
  rationale: La personnification est structurante dans le texte hébreu et doit rester visible.
translation_notes:
  register: Français international moderne, poétique et digne. Les exclamations rendent l’intensité des impératifs répétés. « Revêts » conserve l’image vestimentaire sans archaïsme excessif; « chez toi » désigne naturellement l’entrée dans la ville personnifiée.
