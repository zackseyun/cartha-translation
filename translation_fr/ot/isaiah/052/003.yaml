id: ISA.52.3
reference: Isaiah 52:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : « Vous avez été vendus pour rien, et vous serez rachetés sans argent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la déclaration divine avec une valeur explicative liée au contexte précédent, sans imposer un rapport causal plus précis que l’hébreu.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique consacrée dans un français moderne et digne, tout en conservant sa force déclarative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu, conformément à l’orientation du projet.
- source_word: חִנָּם
  choice: pour rien
  rationale: Exprime naturellement l’absence de prix reçu et maintient le contraste rhétorique avec « sans argent ».
- source_word: נִמְכַּרְתֶּם
  choice: vous avez été vendus
  rationale: Le nifal est rendu comme un passif; une lecture réflexive telle que « vous vous êtes vendus » n’est pas exigée par la forme.
- source_word: בְכֶסֶף
  choice: sans argent
  rationale: כֶּסֶף peut désigner l’argent-métal, mais dans cette construction il évoque naturellement l’argent comme moyen de paiement.
- source_word: תִּגָּאֵלוּ
  choice: vous serez rachetés
  rationale: Rend le passif de גאל et conserve à la fois l’image économique et la portée de délivrance, sans préciser le mécanisme du rachat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve la référence au nom personnel de Dieu sans le remplacer par un titre.
- issue: Portée de l’affirmation sur le rachat
  choice: Conserver la métaphore économique sans en préciser le mécanisme
  alternative: Un rachat financier littéral ou une restauration formulée sans métaphore
  rationale: Le verset oppose la vente « pour rien » au rachat « sans argent ». La traduction maintient cette tension imagée sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et solennel. « Voici ce que dit » évite l’archaïsme de « Ainsi parle » tout en gardant la forme prophétique; le parallélisme et le contraste économique de l’hébreu sont conservés.
