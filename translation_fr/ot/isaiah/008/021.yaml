  text: וְ/עָ֥בַר בָּ֖/הּ נִקְשֶׁ֣ה וְ/רָעֵ֑ב וְ/הָיָ֨ה כִֽי יִרְעַ֜ב וְ/הִתְקַצַּ֗ף וְ/קִלֵּ֧ל בְּ/מַלְכּ֛/וֹ וּ/בֵ/אלֹהָ֖י/ו וּ/פָנָ֥ה לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
translation:
  language: fr
  text: Il traversera le pays[a], accablé et affamé. Quand il aura faim, il entrera en fureur et maudira son roi et son Dieu, puis il se tournera vers le haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il la traversera ». Le pronom féminin renvoie probablement au pays.'
    reason: implicit_referent
  - marker: b
    text: 'Littéralement : « vers le haut ». Autre traduction possible : « il regardera vers le haut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  choice: Il traversera le pays
  rationale: Le verbe et le suffixe sont au masculin singulier et au féminin singulier respectivement. Le référent féminin implicite est naturellement compris, dans le contexte, comme le pays; l’expliciter évite en français un pronom sans antécédent clair.
- source_word: נִקְשֶׁה וְרָעֵב
  choice: accablé et affamé
  rationale: «Accablé» exprime la situation de forte détresse ou d’oppression; «affamé» rend רָעֵב sans ajouter une cause particulière à sa faim.
- source_word: וְהָיָה כִי יִרְעַב
  choice: Quand il aura faim
  rationale: La tournure française restitue naturellement la circonstance temporelle introduite par la construction hébraïque, sans reproduire lourdement «et il arrivera que».
- source_word: וְהִתְקַצַּף
  choice: il entrera en fureur
  rationale: Cette formulation exprime l’entrée dans un état de colère intense suggérée par la forme verbale.
- source_word: וְקִלֵּל בְּמַלְכּוֹ וּבֵאלֹהָיו
  choice: et maudira son roi et son Dieu
  rationale: Avec קִלֵּל, la préposition introduit les personnes visées par la malédiction. Le singulier «Dieu» convient au contexte tout en maintenant l’expression possessive du texte.
- source_word: וּפָנָה לְמָעְלָה
  choice: puis il se tournera vers le ciel
  rationale: Le verbe signifie littéralement «se tourner» et לְמָעְלָה «vers le haut». «Vers le ciel» exprime naturellement en français la direction indiquée, tout en conservant le geste plutôt que de le réduire au seul regard.
theological_decisions:
- issue: Masculin singulier représentatif dans une scène de jugement
  choice: Maintenir «il» dans tout le verset
  alternative: Employer «on» ou un pluriel générique
  rationale: Les formes hébraïques sont constamment au masculin singulier. Le français peut les conserver naturellement; ce singulier présente un individu représentatif et ne limite pas nécessairement la scène aux hommes.
- issue: Référent de אֱלֹהָיו
  choice: Traduire «son Dieu» sans préciser davantage son identité
  alternative: Traduire «ses dieux» ou identifier explicitement le SEIGNEUR
  rationale: Le contexte favorise ici le singulier, mais le texte ne donne pas le nom divin. La traduction préserve donc cette tension sans déterminer si l’homme est membre infidèle du peuple ou adorateur d’un autre dieu.
- issue: Orientation finale vers le haut
  choice: Conserver le geste ambigu de se tourner vers le ciel
  alternative: Interpréter ce geste comme une prière, un appel au secours ou un simple regard
  rationale: Le texte décrit une orientation vers le haut après la malédiction, sans expliquer sa valeur spirituelle. La traduction ne transforme donc pas ce mouvement en prière ni en repentance.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation en deux phrases allège la longue coordination hébraïque. «Accablé» et «entrera en fureur» restent accessibles tout en gardant l’intensité du passage.
