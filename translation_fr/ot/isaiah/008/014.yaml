  text: וְ/הָיָ֖ה לְ/מִקְדָּ֑שׁ וּ/לְ/אֶ֣בֶן נֶ֠גֶף וּ/לְ/צ֨וּר מִכְשׁ֜וֹל לִ/שְׁנֵ֨י בָתֵּ֤י יִשְׂרָאֵל֙ לְ/פַ֣ח וּ/לְ/מוֹקֵ֔שׁ לְ/יוֹשֵׁ֖ב יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
translation:
  language: fr
  text: Il deviendra un sanctuaire, une pierre à laquelle on se heurte et un rocher sur lequel on trébuche pour les deux maisons d’Israël, un piège et un filet pour les habitants de Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement un participe au singulier, « celui qui habite Jérusalem », avec un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Il deviendra
  rationale: Dans ce discours prophétique, la forme verbale a une valeur future. « Deviendra » exprime naturellement l’attribution des rôles qui suivent.
- source_word: לְמִקְדָּשׁ
  choice: un sanctuaire
  rationale: Le terme désigne normalement un lieu saint ou sanctuaire et conserve ici à la fois sa portée cultuelle et sa possible nuance protectrice.
- source_word: אֶבֶן נֶגֶף
  choice: une pierre à laquelle on se heurte
  rationale: Cette formulation concrète rend l’idée de choc attachée à נֶגֶף tout en la distinguant du trébuchement explicitement exprimé dans le syntagme suivant.
- source_word: צוּר מִכְשׁוֹל
  choice: un rocher sur lequel on trébuche
  rationale: La traduction garde l’image physique du rocher et rend clairement מִכְשׁוֹל comme cause de trébuchement.
- source_word: לִשְׁנֵי בָתֵּי יִשְׂרָאֵל
  choice: pour les deux maisons d’Israël
  rationale: La formulation préserve explicitement la dualité historique et politique exprimée par l’hébreu.
- source_word: לְפַח
  choice: un piège
  rationale: « Piège » est le terme français général le plus clair pour פַח, souvent un piège à oiseaux.
- source_word: וּלְמוֹקֵשׁ
  choice: un filet
  rationale: « Filet » distingue le second dispositif du « piège » et restitue l’image d’une prise qui entrave, sans fusionner les deux mots hébreux.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִָם
  choice: pour les habitants de Jérusalem
  rationale: Le participe singulier a ici une valeur collective; le pluriel idiomatique en français rend cette portée sans suggérer un seul individu.
theological_decisions:
- issue: Référent implicite du verbe « il deviendra »
  choice: Le pronom renvoie au SEIGNEUR dans le contexte immédiat d’Ésaïe 8.13, sans remplacer le pronom par le nom divin.
  alternative: Comprendre un référent impersonnel ou lié au message prophétique.
  rationale: Le contexte fournit le SEIGNEUR comme antécédent le plus proche. Garder « il » respecte toutefois la formulation hébraïque et n’explicite pas davantage que le texte.
- issue: Paradoxe entre sanctuaire et jugement
  choice: Conserver ensemble « sanctuaire » et les images de pierre, rocher, piège et filet, avec « mais aussi » pour rendre leur contraste contextuel.
  alternative: Réduire « sanctuaire » à « refuge » ou présenter les images négatives comme une simple réaction humaine.
  rationale: Le verset juxtapose intentionnellement protection sacrée et occasion de chute ou de capture sous un même référent; la traduction ne résout pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores concrètes sont maintenues; « mais aussi » rend le contraste implicite du contexte sans effacer la coordination hébraïque. Le marqueur [a] figure dans le texte principal.
