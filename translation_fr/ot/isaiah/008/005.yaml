  yaml_path: translation/ot/isaiah/008/005.yaml
  text: Yahweh spoke to me again[a], saying,
translation:
  language: fr
  text: 'Yahweh me parla de nouveau[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh ajouta encore à me parler, en disant » ; cette tournure hébraïque signifie que Yahweh me parla de nouveau.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיֹּסֶף ... עוֹד
  choice: de nouveau
  rationale: La tournure hébraïque exprime ici la répétition de la parole divine. « De nouveau » en restitue naturellement la valeur itérative sans reproduire littéralement l’idiome « ajouta à parler ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre substitutif.
- source_word: דַּבֵּר אֵלַי
  choice: me parla
  rationale: 'Le verbe דּבר signifie couramment « parler », et אֵלַי désigne le destinataire à la première personne : « à moi ».'
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit le discours direct qui suit. « En ces termes » conserve cette fonction tout en évitant la lourdeur de « parla… en disant » en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » en préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, simple et digne. La formulation garde le nom divin et la reprise du discours, tout en rendant idiomatiquement la construction hébraïque.
