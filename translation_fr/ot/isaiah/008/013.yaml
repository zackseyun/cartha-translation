  source_fidelity: 'Le texte rend fidèlement la structure et les termes essentiels de l’hébreu : le nom divin est conservé (« Yahweh »), צְבָאוֹת est rendu sans surinterprétation par « des armées », et l’objet antéposé אֹתוֹ est reflété par l’insistance « c’est lui ». « Reconnaître comme saint » communique correctement le hiphil de קדשׁ dans ce contexte, sans suggérer que les humains confèrent la sainteté à Yahweh. « Votre crainte » et « votre effroi » maintiennent les deux prédicats nominaux parallèles et l’intensification du second terme.'
