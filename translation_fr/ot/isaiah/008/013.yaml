id: ISA.8.13
reference: Isaiah 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת יְהוָ֥ה צְבָא֖וֹת אֹת֣/וֹ תַקְדִּ֑ישׁוּ וְ/ה֥וּא מוֹרַאֲ/כֶ֖ם וְ/ה֥וּא מַֽעֲרִֽצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/013.yaml
  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
translation:
  language: fr
  text: Yahweh des armées, c’est lui que vous reconnaîtrez comme saint[a] ; c’est lui qui sera votre crainte, c’est lui qui sera votre effroi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « vous le sanctifierez ». Il s’agit de reconnaître et de traiter Yahweh comme saint, non de le rendre saint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est transcrit « Yahweh ». « Des armées » rend צְבָאוֹת sans préciser indûment s’il s’agit des armées célestes ou terrestres.
- source_word: אֹתוֹ תַקְדִּישׁוּ
  choice: c’est lui que vous reconnaîtrez comme saint
  rationale: Le hiphil de קדשׁ demande ici de reconnaître et de traiter Yahweh comme saint, non de lui conférer la sainteté. La tournure disloquée conserve l’insistance portée par אֹתוֹ.
- source_word: מוֹרַאֲכֶם
  choice: votre crainte
  rationale: Le nom מוֹרָא peut désigner la crainte ou ce qui l’inspire. « Votre crainte » reste proche de la proposition nominale hébraïque et maintient le parallélisme.
- source_word: מַעֲרִצְכֶם
  choice: votre effroi
  rationale: « Effroi » exprime la crainte intense du terme et marque une progression par rapport à « crainte », sans réduire les deux membres à un même verbe.
- source_word: וְהוּא ... וְהוּא
  choice: c’est lui qui sera… c’est lui qui sera…
  rationale: Cette reprise française rend l’insistance de וְהוּא et prolonge naturellement la portée exhortative du premier impératif, tout en gardant la structure parallèle.
theological_decisions:
- issue: Rendu du nom et du titre divins יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR de l’univers
  rationale: La traduction conserve le nom personnel divin et le sens militaire large de צְבָאוֹת, sans remplacer le nom par un titre ni élargir le terme jusqu’à « univers ».
- issue: Sens de la sanctification de Yahweh
  choice: vous reconnaîtrez comme saint
  alternative: vous consacrerez
  rationale: La formulation indique que les humains reconnaissent et honorent la sainteté propre de Dieu ; elle évite de suggérer qu’ils le rendent saint, tout en préservant la force théologique du verbe.
- issue: Rapport entre crainte et effroi
  choice: deux prédicats parallèles et croissants
  alternative: c’est lui que vous craindrez et redouterez
  rationale: Les substantifs français conservent la forme nominale, la répétition emphatique et la tension du texte, où Yahweh lui-même doit être la crainte et l’effroi de son peuple.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition « c’est lui » restitue l’emphase hébraïque ; « crainte » et « effroi » préservent le parallélisme substantival et son intensification.
