  terminology: « Yahweh des armées » est un rendu précis et cohérent du tétragramme et de son titre. Les termes « saint », « crainte » et « effroi » conservent le poids religieux et rhétorique du texte sans imposer d’interprétation confessionnelle. La note explique utilement l’alternative formelle « sanctifierez ».
