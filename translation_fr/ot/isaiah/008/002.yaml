translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure hébraïque tout en étant naturelle. « Dignes de confiance » privilégie le sens contextuel de fiabilité de נֶאֱמָנִים ; la note conserve l’ambiguïté du verbe וְאָעִידָה.
