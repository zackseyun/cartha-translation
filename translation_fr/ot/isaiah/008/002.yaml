  text: וְ/אָעִ֣ידָה לִּ֔/י עֵדִ֖ים נֶאֱמָנִ֑ים אֵ֚ת אוּרִיָּ֣ה הַ/כֹּהֵ֔ן וְ/אֶת זְכַרְיָ֖הוּ בֶּ֥ן יְבֶרֶכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/002.yaml
  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
translation:
  language: fr
  text: 'Je prendrai[a] pour moi des témoins dignes de confiance : le prêtre Urie et Zacharie, fils de Jebérékia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe peut aussi se comprendre ainsi : « Je ferai témoigner » ou « je désignerai comme témoins », ce qui souligne le caractère officiel de l’attestation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָעִידָה
  choice: Je prendrai … des témoins
  rationale: Le hiphil de עוד exprime ici l’action de faire intervenir ou de désigner officiellement des témoins. « Prendre des témoins » est naturel en français et conserve la portée juridique de l’attestation.
- source_word: לִּי
  choice: pour moi
  rationale: La préposition avec suffixe de première personne indique l’intérêt personnel du locuteur dans l’établissement du témoignage.
- source_word: עֵדִים
  choice: témoins
  rationale: Terme français courant et précis pour des personnes appelées à attester un acte ou un fait.
- source_word: נֶאֱמָנִים
  choice: dignes de confiance
  rationale: L’adjectif désigne des personnes fiables, auxquelles on peut se fier. Cette formulation exprime clairement ce sens dans le contexte juridique.
- source_word: אֵת
  choice: ':'
  rationale: La marque de l’objet direct introduit ici les témoins nommément désignés ; en français, les deux-points rendent naturellement cette fonction.
- source_word: אוּרִיָּה
  choice: Urie
  rationale: Forme française biblique usuelle du nom hébreu.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Rendu direct du titre défini qui précise la fonction d’Urie.
- source_word: וְאֶת
  choice: et
  rationale: La conjonction relie le second témoin au premier ; la marque de l’objet direct n’a pas d’équivalent lexical nécessaire en français.
- source_word: זְכַרְיָהוּ
  choice: Zacharie
  rationale: Forme française biblique usuelle du nom hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Rendu naturel et précis de la construction patronymique hébraïque.
- source_word: יְבֶרֶכְיָהוּ
  choice: Jebérékia
  rationale: Translittération française claire du nom hébreu, avec accents facilitant sa prononciation.
