revisions:
- from: C’est pourquoi, voici que le Seigneur fait monter contre eux les eaux puissantes et abondantes du Fleuve[a] — le roi d’Assyrie et toute sa gloire. Il montera au-dessus de tous ses chenaux et franchira toutes ses rives.
  to: C’est pourquoi, voici que le Seigneur fait monter contre eux les eaux du Fleuve, puissantes et abondantes[a] — le roi d’Assyrie et toute sa gloire. Il envahira tous ses chenaux et débordera toutes ses rives.
  rationale: La révision clarifie la structure « eaux du Fleuve » et remplace une expression française susceptible de suggérer une simple traversée des rives par des verbes qui rendent naturellement la progression débordante de la crue. Le singulier « Il » est conservé, de sorte que demeure la tension voulue entre le Fleuve imagé et son identification appositionnelle au roi d’Assyrie.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:11Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend fidèlement la conséquence, l’appel à l’attention, l’action divine, le Fleuve non nommé, l’apposition au roi d’Assyrie et le singulier final. Toutefois, « franchira toutes ses rives » évoque plutôt le fait de traverser des rives que le débordement de la crue exprimé par l’hébreu.
  naturalness: Le français est globalement moderne et soutenu. Réordonner « les eaux du Fleuve, puissantes et abondantes » rend le groupe nominal plus net. « Il envahira tous ses chenaux et débordera toutes ses rives » conserve l’élan de l’image tout en étant plus idiomatique que « montera au-dessus ... et franchira ... ».
  terminology: « le Seigneur », « le Fleuve », « le roi d’Assyrie » et « gloire » conviennent. La note sur le Fleuve est exacte et conserve le caractère probable de l’identification à l’Euphrate.
  issues:
  - severity: medium
    issue: « franchira toutes ses rives » ne rend pas clairement le débordement.
    rationale: וְהָלַךְ עַל כָּל גְּדוֹתָיו décrit les eaux qui passent au-dessus de leurs berges. En français, « franchir des rives » peut décrire un déplacement d’un point à un autre, plutôt qu’une crue qui sort de son lit.
  - severity: low
    issue: Placement des adjectifs dans « les eaux puissantes et abondantes du Fleuve ».
    rationale: La formulation est intelligible, mais placer « du Fleuve » directement après « eaux » reflète plus clairement le syntagme source « les eaux du Fleuve », puis qualifie ces eaux comme puissantes et abondantes.
  revised_text: C’est pourquoi, voici que le Seigneur fait monter contre eux les eaux du Fleuve, puissantes et abondantes[a] — le roi d’Assyrie et toute sa gloire. Il envahira tous ses chenaux et débordera toutes ses rives.
  revised_footnotes:
