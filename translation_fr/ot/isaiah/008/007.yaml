source:
  edition: WLC
  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
translation:
  language: fr
  text: C’est pourquoi, voici que le Seigneur fait monter contre eux les eaux du Fleuve, puissantes et abondantes[a] — le roi d’Assyrie et toute sa gloire. Il envahira tous ses chenaux et débordera toutes ses rives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Fleuve » désigne probablement l’Euphrate, le grand fleuve associé à l’Assyrie.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le rapport de conséquence avec le refus évoqué au verset précédent.
- source_word: הִנֵּה
  choice: voici que
  rationale: Conserve la fonction d’appel à l’attention et la vivacité prophétique sans tournure archaïque.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rend le titre אֲדֹנָי sans le confondre avec le nom divin YHWH.
- source_word: מַעֲלֶה עֲלֵיהֶם
  choice: fait monter contre eux
  rationale: Le participe présente l’action comme imminente ou déjà en cours; la formulation garde aussi l’image d’eaux qui montent.
- source_word: מֵי הַנָּהָר
  choice: les eaux du Fleuve
  rationale: Le texte dit littéralement « le Fleuve » sans le nommer; la majuscule signale son emploi comme désignation géographique reconnue.
- source_word: הָעֲצוּמִים וְהָרַבִּים
  choice: puissantes et abondantes
  rationale: 'Les deux adjectifs restent distincts: le premier souligne la force des eaux, le second leur grande quantité.'
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדוֹ
  choice: le roi d’Assyrie et toute sa gloire
  rationale: La formulation conserve l’apposition qui identifie la crue au roi d’Assyrie et à toute sa puissance éclatante, sans réduire la portée de כבוד à une seule nuance.
- source_word: וְעָלָה
  choice: Il montera
  rationale: Le singulier hébreu reprend la crue comme une réalité unifiée, probablement le Fleuve personnifié; le pronom français maintient ce mouvement sans explicitation excessive.
- source_word: אֲפִיקָיו
  choice: ses chenaux
  rationale: « Chenaux » désigne avec précision les voies où s’écoulent normalement les eaux et préserve la distinction avec les rives dans le membre suivant.
- source_word: וְהָלַךְ עַל כָּל גְּדוֹתָיו
  choice: franchira toutes ses rives
  rationale: Cette formulation française naturelle exprime les eaux qui dépassent leurs limites ordinaires tout en restant proche de l’image hébraïque.
theological_decisions:
- issue: Identité des eaux envahissantes
  choice: La traduction conserve la métaphore de la crue et l’apposition qui l’identifie au roi d’Assyrie et à toute sa gloire.
  alternative: Transformer directement l’image en une affirmation explicite sur l’armée ou la puissance militaire assyrienne.
  rationale: L’hébreu associe explicitement les eaux du Fleuve au roi d’Assyrie, mais garde toute la force de l’image; il convient donc de ne pas la remplacer par une interprétation.
- issue: Référent du verbe singulier וְעָלָה
  choice: « Il montera » renvoie naturellement au Fleuve ou au flot envisagé comme une unité.
  alternative: Employer le pluriel « elles monteront » en accord avec « les eaux », ou faire du roi d’Assyrie le référent explicite.
  rationale: Le verbe hébreu est au singulier. Le maintien du singulier respecte la grammaire source et préserve une légère tension entre l’image du Fleuve et son référent assyrien.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde l’élan prophétique, le titre divin « le Seigneur », l’image de la crue et l’ambiguïté mesurée du singulier final.
