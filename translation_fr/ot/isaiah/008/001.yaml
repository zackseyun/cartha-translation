source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קַח לְ/ךָ֖ גִּלָּי֣וֹן גָּד֑וֹל וּ/כְתֹ֤ב עָלָי/ו֙ בְּ/חֶ֣רֶט אֱנ֔וֹשׁ לְ/מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/001.yaml
  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
translation:
  language: fr
  text: 'Puis Yahweh me dit : « Prends une grande tablette et écris dessus avec un stylet ordinaire[a] : “Maher-Shalal-Hash-Baz[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un stylet d’homme », « avec un stylet courant » ou « en écriture courante ».
    reason: lexical_alternative
  - marker: b
    text: En hébreu, Maher-Shalal-Hash-Baz signifie probablement « Prompt au pillage, rapide au butin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin, conformément à sa forme dans le texte hébreu.
- source_word: גִּלָּיוֹן גָּדוֹל
  choice: une grande tablette
  rationale: גִּלָּיוֹן désigne ici un support destiné à recevoir une inscription; « tablette » convient au contexte tout en laissant ouverte la nature matérielle précise de l’objet.
- source_word: וּכְתֹב עָלָיו
  choice: et écris dessus
  rationale: Rend simplement l’impératif et son complément dans un français actuel et naturel.
- source_word: בְּחֶרֶט אֱנוֹשׁ
  choice: avec un stylet ordinaire
  rationale: חֶרֶט peut désigner un stylet ou instrument d’écriture; אֱנוֹשׁ semble ici qualifier une écriture ou un instrument humain, courant. L’ambiguïté est signalée en note.
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Maher-Shalal-Hash-Baz
  rationale: La formule devient dans le contexte un nom symbolique; elle est donc transcrite dans le texte et son sens probable est donné en note.
- source_word: קַח לְךָ
  choice: Prends
  rationale: En français, l’impératif simple exprime naturellement l’ordre; traduire explicitement לְךָ par « pour toi » alourdirait ici la formulation sans ajouter de sens décisif.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Puis ... me dit
  rationale: « Puis » marque naturellement la progression du récit portée par le waw consécutif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie le tétragramme; « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Traduction ou transcription de לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Transcription comme nom symbolique dans le texte
  alternative: Traduire directement par « Prompt au pillage, rapide au butin »
  rationale: Les versets suivants emploient cette formule comme nom. La transcription préserve cette fonction, tandis que la note en communique le sens lexical probable.
- issue: Sens de אֱנוֹשׁ dans בְּחֶרֶט אֱנוֹשׁ
  choice: ordinaire
  alternative: humain / d’homme / en écriture courante
  rationale: L’expression est difficile et peut viser un instrument humain ordinaire ou une écriture courante et lisible. La traduction retient le sens contextuel probable sans masquer les autres possibilités, conservées en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste directe afin de conserver la force de l’ordre divin. Les ambiguïtés de la formule בְּחֶרֶט אֱנוֹשׁ et du nom symbolique sont préservées dans les notes.
