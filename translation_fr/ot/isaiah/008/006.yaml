source:
  edition: WLC
  text: יַ֗עַן כִּ֤י מָאַס֙ הָ/עָ֣ם הַ/זֶּ֔ה אֵ֚ת מֵ֣י הַ/שִּׁלֹ֔חַ הַ/הֹלְכִ֖ים לְ/אַ֑ט וּ/מְשׂ֥וֹשׂ אֶת רְצִ֖ין וּ/בֶן רְמַלְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
translation:
  language: fr
  text: Parce que ce peuple a rejeté les eaux de Shiloah[a], qui coulent doucement, et qu’il se réjouit de Retsîn et du fils de Remalia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shiloah est le nom hébreu ; la tradition grecque emploie la forme Siloé.
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible de ce passage difficile : « et qu’il tremble devant Retsîn et le fils de Remalia ». Le texte hébreu porte « se réjouit », mais certains comprennent autrement le sens en fonction du contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Parce que
  rationale: Cette locution introduit la cause du jugement annoncé au verset suivant. « Parce que » en conserve clairement la valeur causale.
- source_word: מָאַס
  choice: a rejeté
  rationale: Le verbe exprime un refus décidé. « A rejeté » est naturel et n’accentue pas indûment l’idée de mépris affectif.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette formulation conserve le singulier et l’idiome prophétique de l’hébreu.
- source_word: מֵי הַשִּׁלֹחַ
  choice: les eaux de Shiloah
  rationale: « Shiloah » translittère directement le nom hébreu; la forme grecque traditionnelle « Siloé » est signalée en note.
- source_word: הַהֹלְכִים לְאַט
  choice: qui coulent doucement
  rationale: Littéralement, les eaux « vont doucement/lentement ». « Coulent doucement » est idiomatique en français et prépare le contraste avec le fleuve impétueux du verset suivant.
- source_word: וּמְשׂוֹשׂ
  choice: et qu’il se réjouit au sujet de
  rationale: Le texte massorétique porte une forme issue de שׂושׂ, « se réjouir, exulter ». La tournure « au sujet de » garde un rapport assez large avec les personnes désignées, sans introduire une préposition absente de l’hébreu.
- source_word: אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: Retsîn et du fils de Remalia
  rationale: Les noms sont translittérés depuis l’hébreu. « Le fils de Remalia » préserve la désignation indirecte de Péqah sans explicitation interprétative.
theological_decisions:
- issue: Interprétation de וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ dans un contexte difficile
  choice: 'Traduire le texte massorétique selon son sens lexical direct : « et qu’il se réjouit au sujet de Retsîn et du fils de Remalia »'
  alternative: « et qu’il tremble devant Retsîn et le fils de Remalia »
  rationale: La lecture du texte massorétique relève de la racine שׂושׂ, « se réjouir/exulter ». Même si le contexte a conduit certains à comprendre la proposition comme l’expression de la peur, il ne convient pas de remplacer silencieusement la lecture transmise par une conjecture. L’autre compréhension est donc conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par une virgule, puisque la conséquence commence au verset suivant. Les notes préservent à la fois la forme grecque traditionnelle du toponyme et l’ambiguïté interprétative de la dernière proposition.
