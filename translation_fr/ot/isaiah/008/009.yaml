  variant: modern international French
source:
  edition: WLC
  text: רֹ֤עוּ עַמִּים֙ וָ/חֹ֔תּוּ וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל מֶרְחַקֵּי אָ֑רֶץ הִתְאַזְּר֣וּ וָ/חֹ֔תּוּ הִֽתְאַזְּר֖וּ וָ/חֹֽתּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
translation:
  language: fr
  text: Soyez brisés[a], peuples, et soyez terrassés ! Écoutez, vous tous, lointains confins de la terre ! Préparez-vous au combat, et soyez terrassés ! Préparez-vous au combat[b], et soyez terrassés !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le premier impératif hébreu est difficile. On peut aussi traduire : « Poussez un cri de guerre, peuples » ou « Rassemblez-vous, peuples ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Ceignez-vous » ; le verbe hébreu désigne le fait de se préparer, probablement au combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  choice: Soyez brisés
  rationale: L’impératif hébreu est difficile et peut recevoir plusieurs analyses. Dans ce contexte de défi lancé aux peuples ennemis, le parallélisme avec וָחֹתּוּ répété favorise l’annonce ironique de leur ruine. Les autres lectures sérieuses sont conservées en note.
- source_word: עַמִּים
  choice: peuples
  rationale: « Peuples » rend directement le pluriel et convient à l’adresse poétique lancée à plusieurs groupes étrangers.
- source_word: וָחֹתּוּ
  choice: et soyez terrassés
  rationale: Le verbe חתת peut exprimer l’effondrement, la défaite ou l’épouvante. « Soyez terrassés » réunit naturellement en français l’idée de défaite et d’abattement, tout en évitant la répétition immédiate de « brisés ».
- source_word: וְהַאֲזִינוּ
  choice: Écoutez
  rationale: Impératif français actuel et direct, qui exprime l’appel à prêter attention.
- source_word: כֹּל מֶרְחַקֵּי אָרֶץ
  choice: vous tous, lointains confins de la terre
  rationale: La formulation conserve la portée universelle et l’éloignement géographique, tout en rendant explicite l’adresse aux régions lointaines.
- source_word: הִתְאַזְּרוּ
  choice: Préparez-vous au combat
  rationale: Le hitpael de אזר signifie se ceindre ou s’équiper, souvent en vue d’une lutte. Cette expression moderne restitue le sens contextuel sans employer l’archaïsme « ceignez-vous ».
theological_decisions:
- issue: Interprétation de l’impératif initial רֹעוּ
  choice: 'Un défi annonçant le jugement : « Soyez brisés »'
  alternative: « Poussez un cri de guerre » ou « Rassemblez-vous »
  rationale: La répétition de l’annonce de l’effondrement des peuples soutient une lecture ironique et judiciaire, mais l’incertitude lexicale réelle de l’hébreu est explicitement maintenue en note.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsme marqué. Les exclamations rendent la vigueur des impératifs répétés. La répétition de « Préparez-vous au combat » et de « soyez terrassés » préserve la structure insistante et l’ironie du verset.
