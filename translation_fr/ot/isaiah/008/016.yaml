source:
  edition: WLC
  text: צ֖וֹר תְּעוּדָ֑ה חֲת֥וֹם תּוֹרָ֖ה בְּ/לִמֻּדָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
translation:
  language: fr
  text: Enveloppe le témoignage, scelle l’instruction[a] parmi mes disciples[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi » ou « l’enseignement ». Le mot hébreu torah peut désigner largement une instruction, et non seulement un code légal.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi ceux qui reçoivent mon instruction ». L’hébreu désigne des personnes instruites, rattachées au locuteur par le suffixe « mes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  choice: Lie
  rationale: Impératif masculin singulier exprimant l’action de lier ou d’envelopper afin de conserver en sûreté; « Lie » préserve l’image concrète et la concision de l’hébreu.
- source_word: תְּעוּדָה
  choice: le témoignage
  rationale: Désigne un témoignage ou une attestation formelle, vraisemblablement la parole prophétique donnée dans le contexte.
- source_word: חֲת֥וֹם
  choice: scelle
  rationale: Impératif masculin singulier évoquant la fermeture ou la mise en sûreté d’un document au moyen d’un sceau; le français conserve aussi la portée documentaire du terme.
- source_word: תּוֹרָ֖ה
  choice: l’instruction
  rationale: Dans ce contexte prophétique, le mot peut désigner un enseignement autorisé sans se limiter à un code légal; « instruction » garde cette ampleur.
- source_word: בְּ/לִמֻּדָֽ/י
  choice: parmi mes disciples
  rationale: Le nom désigne littéralement les personnes instruites par le locuteur. « Mes disciples » est naturel en français et « parmi » rend ici la sphère dans laquelle l’instruction est conservée.
theological_decisions:
- issue: Portée de תּוֹרָה dans le contexte prophétique
  choice: l’instruction
  alternative: la loi; l’enseignement
  rationale: « Instruction » évite de réduire le terme à la seule législation mosaïque tout en conservant son autorité et son poids théologique.
- issue: Identité des לִמֻּדָי
  choice: mes disciples
  alternative: ceux que j’instruis; ceux qui ont reçu mon enseignement
  rationale: La formulation garde le suffixe de première personne et le rapport d’apprentissage, sans préciser davantage l’identité du locuteur ni celle du groupe.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs brefs conservent le parallélisme et l’image documentaire du texte hébreu.
