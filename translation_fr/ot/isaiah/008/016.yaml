  - severity: low
    issue: Précision insuffisante de la note b
    rationale: « Littéralement “ceux que j’instruis” » surinterprète légèrement la relation exprimée par le suffixe. Une note formulée comme une alternative de sens rend mieux le passif nominal hébreu.
  revised_text: Enveloppe le témoignage, scelle l’instruction[a] parmi mes disciples[b].
