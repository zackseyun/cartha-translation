base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/015.yaml
  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
translation:
  language: fr
  text: Beaucoup d’entre eux trébucheront[a] ; ils tomberont et se briseront ; ils seront pris au piège et capturés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « beaucoup trébucheront sur eux » ou « à cause d’eux », si le pronom renvoie aux images de la pierre et du piège dans le contexte immédiat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: trébucheront
  rationale: Le verbe כשל évoque le fait de trébucher ou de chanceler. « Trébucheront » prolonge naturellement l’image de la pierre qui fait trébucher dans le contexte immédiat.
- source_word: בָם
  choice: d’entre eux
  rationale: La préposition ב avec le suffixe pronominal peut ici désigner le groupe au sein duquel beaucoup trébuchent. « D’entre eux » est idiomatique en français, tandis qu’une note conserve l’autre rattachement possible du pronom à l’imagerie précédente.
- source_word: רַבִּים
  choice: beaucoup
  rationale: רַבִּים signifie simplement « beaucoup » ou « de nombreux ». Employé comme substantif, « beaucoup » garde la concision de l’hébreu.
- source_word: וְנָפְלוּ
  choice: ils tomberont
  rationale: נפל est le verbe courant pour « tomber ». La reprise du sujet rend en français la succession des conséquences avec clarté.
- source_word: וְנִשְׁבָּרוּ
  choice: se briseront
  rationale: Le nifal de שבר exprime ici le fait d’être brisé. La tournure pronominale française est naturelle et maintient l’image concrète sans l’intensifier en « voler en éclats ».
- source_word: וְנוֹקְשׁוּ
  choice: seront pris au piège
  rationale: Le nifal de יקשׁ indique qu’on est pris dans un piège. Cette formulation française courante préserve nettement l’image du piège.
- source_word: וְנִלְכָּדוּ
  choice: capturés
  rationale: לכד signifie saisir ou capturer. « Capturés » distingue l’aboutissement de la séquence du fait précédent d’être pris au piège.
theological_decisions:
- issue: Langage métaphorique du jugement dans le contexte de la pierre qui fait trébucher
  choice: 'Conserver la suite concrète : trébucher, tomber, se briser, être pris au piège et être capturé.'
  alternative: Reformuler abstraitement en termes de ruine générale ou de chute spirituelle.
  rationale: Le verset poursuit les images concrètes du contexte immédiat. Les maintenir préserve leur force ainsi que la tension théologique, sans les réduire à une seule interprétation abstraite.
- issue: Référent de בָם
  choice: 'Comprendre le pronom comme désignant le groupe : « beaucoup d’entre eux ».'
  alternative: Le rattacher à l’imagerie précédente et comprendre que beaucoup trébucheront sur eux ou à cause d’eux.
  rationale: La syntaxe et le contexte permettent plus d’un rattachement. Le texte principal adopte une formulation française naturelle, tandis que la note signale l’ambiguïté réelle sans la supprimer.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme en deux propositions coordonnées conserve l’accumulation du texte hébreu. « Pris au piège » est préféré à « piégés » pour préserver explicitement l’image concrète.
