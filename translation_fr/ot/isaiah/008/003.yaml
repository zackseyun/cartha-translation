id: ISA.8.3
reference: Isaiah 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶקְרַב֙ אֶל הַ/נְּבִיאָ֔ה וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֣א שְׁמ֔/וֹ מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
translation:
  language: fr
  text: 'Je m’approchai de la prophétesse ; elle devint enceinte et mit au monde un fils. Alors Yahvé me dit : « Appelle-le Maher-Shalal-Hash-Baz[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce nom peut se comprendre comme « Vite au butin, prompt au pillage ».
    reason: Le nom symbolique est porteur d’un sens essentiel dans le contexte, mais la formulation hébraïque concise permet plusieurs nuances.
lexical_decisions:
- source_word: וָאֶקְרַב
  choice: Je m’approchai
  rationale: Le verbe קרב signifie littéralement « s’approcher ». Dans ce contexte, il évoque avec retenue les relations conjugales ; la traduction conserve l’euphémisme hébreu sans l’expliciter.
- source_word: הַנְּבִיאָה
  choice: la prophétesse
  rationale: Le nom hébreu est la forme féminine de « prophète ». « Prophétesse » est le terme français courant et conserve cette indication de genre.
- source_word: וַתַּהַר
  choice: elle devint enceinte
  rationale: Le verbe הרה signifie « concevoir, devenir enceinte ». Cette formulation est naturelle en français moderne et convient à la progression du récit.
- source_word: וַתֵּלֶד בֵּן
  choice: et mit au monde un fils
  rationale: Cette expression rend naturellement en français le verbe ילד suivi de « fils ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du tétragramme préserve ici le nom personnel divin plutôt que de lui substituer un titre.
- source_word: קְרָא שְׁמוֹ
  choice: Appelle-le
  rationale: L’expression hébraïque signifie littéralement « appelle son nom ». « Appelle-le » restitue naturellement en français la formule de nomination.
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  choice: Maher-Shalal-Hash-Baz
  rationale: L’expression fonctionne comme un nom personnel symbolique ; elle est donc translittérée dans le texte, tandis que son sens est indiqué en note.
theological_decisions:
- issue: Faut-il expliciter le sens sexuel de « Je m’approchai de la prophétesse » ?
  choice: Conserver l’euphémisme hébreu sans l’expliciter
  alternative: « J’eus des relations avec la prophétesse »
  rationale: Le contexte implique des relations conjugales, mais l’hébreu emploie une formulation retenue. La traduction respecte le degré d’explicitation du texte source.
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation évite une succession pesante de phrases introduites par « alors », tout en conservant l’enchaînement narratif hébreu. L’euphémisme et le nom symbolique sont maintenus.
