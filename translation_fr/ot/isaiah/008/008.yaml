id: ISA.8.8
reference: Isaiah 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חָלַ֤ף בִּֽ/יהוּדָה֙ שָׁטַ֣ף וְ/עָבַ֔ר עַד צַוָּ֖אר יַגִּ֑יעַ וְ/הָיָה֙ מֻטּ֣וֹת כְּנָפָ֔י/ו מְלֹ֥א רֹֽחַב אַרְצְ/ךָ֖ עִמָּ֥נוּ אֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
translation:
  language: fr
  text: Il déferlera sur Juda, débordera et le traversera ; il montera jusqu’au cou. Le déploiement de ses ailes remplira toute la largeur de ton pays, ô Emmanuel[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Emmanuel signifie « Dieu est avec nous ».
    reason: Sens lexical du nom hébreu.
lexical_decisions:
- source_word: וְחָלַף בִּיהוּדָה
  choice: Il déferlera sur Juda
  rationale: Dans la métaphore du fleuve envahissant héritée du verset précédent, « déferlera » exprime un mouvement puissant et destructeur ; « sur Juda » marque naturellement l’irruption dans le territoire.
- source_word: שָׁטַף וְעָבַר
  choice: débordera et le traversera
  rationale: « Débordera » maintient l’image de la crue, tandis que « le traversera » rend le mouvement à travers Juda ; le pronom explicite en français le complément implicite.
- source_word: עַד צַוָּאר יַגִּיעַ
  choice: il montera jusqu’au cou
  rationale: Cette formulation française naturelle conserve l’image d’une submersion presque totale et d’un péril extrême.
- source_word: מֻטּוֹת כְּנָפָיו
  choice: le déploiement de ses ailes
  rationale: Le syntagme évoque des ailes qui s’étendent au loin, prolongeant l’image de la puissance envahissante sans trancher précisément le rapport entre l’oiseau et la crue.
- source_word: מְלֹא רֹחַב אַרְצְךָ
  choice: remplira toute la largeur de ton pays
  rationale: Cette traduction garde l’idée concrète de largeur et d’extension complète du territoire, sans réduire l’expression à une simple paraphrase.
- source_word: עִמָּנוּ אֵל
  choice: ô Emmanuel
  rationale: L’expression est traitée ici comme le nom déjà introduit en Ésaïe 7.14 et comme une adresse directe ; sa signification est donnée en note.
theological_decisions:
- issue: Faut-il comprendre עִמָּנוּ אֵל comme un nom propre ou comme la proposition « Dieu est avec nous » ?
  choice: 'Le rendre dans le texte comme le nom employé en apostrophe : « ô Emmanuel »'
  alternative: « Dieu est avec nous » ou « ô Dieu-avec-nous »
  rationale: Le contexte littéraire renvoie au nom annoncé en Ésaïe 7.14. La translittération préserve ce lien et l’ambiguïté attachée au nom, tandis que la note en fournit le sens.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation fait entendre la progression de la crue puis l’apostrophe finale. « Ô » signale clairement l’adresse directe sans ajouter d’interprétation confessionnelle.
