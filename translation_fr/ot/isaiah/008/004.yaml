source:
  edition: WLC
  text: כִּ֗י בְּ/טֶ֨רֶם֙ יֵדַ֣ע הַ/נַּ֔עַר קְרֹ֖א אָבִ֣/י וְ/אִמִּ֑/י יִשָּׂ֣א אֶת חֵ֣יל דַּמֶּ֗שֶׂק וְ/אֵת֙ שְׁלַ֣ל שֹׁמְר֔וֹן לִ/פְנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
translation:
  language: fr
  text: Car, avant que le garçon[c] sache appeler « Mon père ! Ma mère ! »[a], les richesses de Damas et le butin de Samarie[b] seront emportés devant le roi d’Assyrie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sache dire : “Mon père ! Ma mère !” » Le verbe hébreu signifie littéralement « appeler » ou « crier ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les biens pillés de Samarie ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit simplement « le garçon »; dans le contexte, il s’agit vraisemblablement de l’enfant nommé dans le passage environnant.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du signe annoncé dans le contexte précédent.
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: Marque qu’un événement se produira avant que l’enfant atteigne une étape de son développement.
- source_word: יֵדַע ... קְרֹא
  choice: sache appeler
  rationale: La construction exprime ici la capacité acquise de prononcer une forme d’appel; « sache appeler » reste proche de l’hébreu tout en étant naturel en français.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: Le nom peut désigner un enfant ou un jeune homme; le contexte d’apprentissage du langage indique ici un très jeune garçon, tandis que le masculin est conservé.
- source_word: אָבִי וְאִמִּי
  choice: « Mon père ! Ma mère ! »
  rationale: Les deux formes hébraïques portent explicitement le suffixe possessif de première personne; la traduction évite d’ajouter la nuance familière de « papa » et « maman ».
- source_word: יִשָּׂא
  choice: seront emportés
  rationale: Bien que la forme hébraïque soit active, son sujet n’est pas exprimé. Le passif français rend naturellement cette valeur impersonnelle sans ajouter un agent.
- source_word: חֵיל דַּמֶּשֶׂק
  choice: les richesses de Damas
  rationale: חֵיל peut désigner la force, les ressources, l’armée ou la richesse. Son parallélisme avec le butin favorise ici le sens matériel de richesses ou ressources.
- source_word: שְׁלַל שֹׁמְרוֹן
  choice: le butin de Samarie
  rationale: שְׁלַל désigne les biens saisis à la guerre; « butin » est précis et courant en français.
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  choice: devant le roi d’Assyrie
  rationale: Conserve l’image spatiale de l’hébreu et peut évoquer les biens emportés en présence du roi ou amenés devant lui.
theological_decisions:
- issue: Référent de « le garçon »
  choice: Le texte garde la désignation non explicitée « le garçon ».
  alternative: Identifier directement le garçon comme Maher-Shalal-Hash-Baz, fils d’Ésaïe, ou comme une figure prophétique plus large.
  rationale: Le verset lui-même ne donne ici que le syntagme « le garçon ». Le contexte peut orienter l’identification, mais la traduction ne doit pas la fixer dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans archaïsme; les exclamations rendent naturellement l’appel parental, et les notes préservent les principales possibilités lexicales et l’ouverture du référent.
