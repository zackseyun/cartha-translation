id: ISA.8.10
reference: Isaiah 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֻ֥צוּ עֵצָ֖ה וְ/תֻפָ֑ר דַּבְּר֤וּ דָבָר֙ וְ/לֹ֣א יָק֔וּם כִּ֥י עִמָּ֖/נוּ אֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
translation:
  language: fr
  text: Formez un projet, et il sera déjoué ; prononcez une parole, et elle ne tiendra pas, car Dieu est avec nous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car avec nous est Dieu », expression qui fait écho au nom Emmanuel (« Dieu avec nous ») en Ésaïe 7.14 et 8.8.'
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ עֵצָה
  choice: Formez un projet
  rationale: L’impératif pluriel et son complément expriment l’élaboration d’un plan. Cette tournure française actuelle conserve le défi lancé aux adversaires et évite le sens plus faible de « donner un conseil ».
- source_word: וְתֻפָר
  choice: et il sera déjoué
  rationale: Le nifal de פרר indique que le projet sera brisé, annulé ou mis en échec. « Déjoué » convient naturellement à un projet hostile.
- source_word: דַּבְּרוּ דָבָר
  choice: prononcez une parole
  rationale: La répétition de la racine hébraïque est rendue par une construction française digne et intelligible. « Parole » préserve le parallèle avec le projet sans préciser indûment s’il s’agit d’un ordre, d’une décision ou d’une proposition.
- source_word: וְלֹא יָקוּם
  choice: et elle ne tiendra pas
  rationale: קום signifie ici tenir, subsister ou se réaliser. « Ne tiendra pas » conserve l’image hébraïque et l’ambiguïté entre validité et accomplissement.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’échec annoncé.
- source_word: עִמָּנוּ אֵל
  choice: Dieu est avec nous
  rationale: La proposition nominale signifie littéralement « avec nous [est] Dieu ». Cette formulation naturelle en français maintient son sens tout en laissant la note signaler l’écho au nom Emmanuel.
theological_decisions:
- issue: Rapport entre עִמָּנוּ אֵל et le thème d’Emmanuel en Ésaïe 7–8
  choice: Traduire dans le texte « Dieu est avec nous » et signaler l’écho à Emmanuel en note.
  alternative: Traduire « car Emmanuel » ou « car avec nous est Dieu ».
  rationale: Le texte présente ici deux mots formant une proposition, et non directement la forme du nom propre. Cependant, l’écho à Emmanuel en Ésaïe 7.14 et 8.8 est manifeste et doit être conservé sans transformer la proposition en nom propre.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux défis et de leurs échecs est conservé. Le pronom « elle » reprend naturellement « une parole ».
