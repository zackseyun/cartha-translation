source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י וְ/הַ/יְלָדִים֙ אֲשֶׁ֣ר נָֽתַן לִ֣/י יְהוָ֔ה לְ/אֹת֥וֹת וּ/לְ/מוֹפְתִ֖ים בְּ/יִשְׂרָאֵ֑ל מֵ/עִם֙ יְהוָ֣ה צְבָא֔וֹת הַ/שֹּׁכֵ֖ן בְּ/הַ֥ר צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
translation:
  language: fr
  text: Voici, moi et les enfants que Yahweh m’a donnés, nous sommes des signes et des prodiges en Israël, de la part de Yahweh des armées[a], qui demeure sur le mont Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le SEIGNEUR des armées » ou « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec naturel l’appel d’attention et l’emphase déictique du discours prophétique.
- source_word: אָנֹכִי וְהַיְלָדִים
  choice: moi et les enfants
  rationale: Le pronom indépendant אָנֹכִי est emphatique; « moi » après « Voici » conserve cette mise en relief. יְלָדִים désigne ici largement les enfants d’Ésaïe.
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  choice: que Yahweh m’a donnés
  rationale: Le passé composé exprime naturellement en français un don passé dont la portée demeure présente; l’accord de « donnés » se fait avec le complément antéposé « que », renvoyant aux enfants.
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  choice: nous servons de signes et de présages
  rationale: La préposition ל indique ici la fonction ou le résultat. « Servons de » est idiomatique en français. מוֹפְתִים peut désigner des prodiges ou des présages; « présages » convient au rôle symbolique des personnes et de leurs noms dans ce contexte sans imposer l’idée de miracles spectaculaires.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Rend directement la valeur locative de בְּ.
- source_word: מֵעִם
  choice: de la part de
  rationale: Exprime la provenance personnelle et l’autorité de Yahweh plus clairement que le simple « de » en français.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve le nom divin et traduit צְבָאוֹת de manière transparente; la formulation traditionnelle est indiquée en note.
- source_word: הַשֹּׁכֵן בְּהַר צִיּוֹן
  choice: qui demeure sur le mont Sion
  rationale: Le participe décrit une demeure caractéristique et continue; « sur le mont Sion » est l’expression française naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération préserve cette distinction sans lui substituer un titre.
- issue: Fonction d’Ésaïe et de ses enfants comme אֹתוֹת et מוֹפְתִים
  choice: nous servons de signes et de présages
  alternative: nous sommes des signes et des prodiges
  rationale: La traduction conserve leur fonction symbolique donnée par Dieu et la tension sémantique de מוֹפֵת, tout en évitant de suggérer nécessairement qu’ils accomplissent eux-mêmes des miracles.
- issue: Rapport exprimé par מֵעִם יְהוָה צְבָאוֹת
  choice: de la part de Yahweh des armées
  alternative: venant de Yahweh des armées
  rationale: Cette formulation garde Yahweh comme source et autorité des signes sans préciser davantage le mécanisme de cette provenance.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la solennité prophétique sans archaïsme excessif; « nous servons de » évite une tournure nominale raide. Le nom « Yahweh » est conservé et le titre צְבָאוֹת est traduit de façon transparente.
