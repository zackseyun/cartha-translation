- from: Voici, moi et les enfants que Yahweh m’a donnés, nous servons de signes et de présages en Israël, de la part de Yahweh des armées[a], qui demeure sur le mont Sion.
  to: Voici, moi et les enfants que Yahweh m’a donnés, nous sommes des signes et des prodiges en Israël, de la part de Yahweh des armées[a], qui demeure sur le mont Sion.
  rationale: « Prodiges » rend plus largement מוֹפְתִים et forme avec « signes » un binôme français naturel. La tournure « nous sommes » exprime directement la fonction attribuée par les prépositions לְ. La note est resserrée sur des équivalents traditionnels attestés du titre, tout en conservant « Yahweh des armées » dans le texte.
