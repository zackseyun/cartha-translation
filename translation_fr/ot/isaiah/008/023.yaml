  text: כִּ֣י לֹ֣א מוּעָף֮ לַ/אֲשֶׁ֣ר מוּצָ֣ק לָ/הּ֒ כָּ/עֵ֣ת הָ/רִאשׁ֗וֹן הֵקַ֞ל אַ֤רְצָ/ה זְבֻלוּן֙ וְ/אַ֣רְצָ/ה נַפְתָּלִ֔י וְ/הָ/אַחֲר֖וֹן הִכְבִּ֑יד דֶּ֤רֶךְ הַ/יָּם֙ עֵ֣בֶר הַ/יַּרְדֵּ֔ן גְּלִ֖יל הַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
translation:
  language: fr
  text: Car il n’y aura pas d’obscurité pour celle qui était dans la détresse.[a] Dans le passé, il a couvert de mépris le pays de Zabulon et le pays de Nephtali ; mais à l’avenir, il couvrira de gloire le chemin de la mer, la région au-delà du Jourdain, la Galilée des nations.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du verset est difficile en hébreu. « Obscurité » peut aussi se comprendre comme « pénombre » ou « sombre accablement ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la Galilée des nations » ; on peut aussi comprendre : « la Galilée des non-Juifs ».'
    reason: lexical_alternative
  - marker: c
    text: Matthieu 4.15-16 cite ces indications géographiques à propos du début du ministère public de Jésus.
    reason: cross_reference
lexical_decisions:
- source_word: מוּעָף
  choice: obscurité
  rationale: Le terme rare évoque une pénombre ou une obscurité accablante. « Obscurité » reste naturel en français et prépare le contraste avec la lumière au verset suivant.
- source_word: מוּצָק
  choice: détresse
  rationale: Le mot exprime une situation d’oppression et d’affliction. « Détresse » convient au contexte sans restreindre le sens à une émotion intérieure.
- source_word: הֵקַל
  choice: a couvert de mépris
  rationale: Le verbe est opposé à הִכְבִּיד, « donner du poids, honorer ». Cette formulation rend ici l’abaissement et le déshonneur plutôt qu’un simple allègement.
- source_word: הִכְבִּיד
  choice: il couvrira de gloire
  rationale: Littéralement, le verbe signifie « rendre lourd ». En contraste avec l’humiliation antérieure, il exprime l’honneur et la gloire accordés ultérieurement.
- source_word: דֶּרֶךְ הַיָּם
  choice: le chemin de la mer
  rationale: Traduction formelle qui conserve l’expression géographique hébraïque sans l’identifier plus précisément que ne le fait le texte.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: la région au-delà du Jourdain
  rationale: « Au-delà du Jourdain » préserve le point de vue géographique implicite; l’ajout de « la région » rend la série de territoires plus naturelle en français.
- source_word: גְּלִיל הַגּוֹיִם
  choice: la Galilée des nations
  rationale: « Nations » est le sens large et direct de גּוֹיִם; « non-Juifs » demeure une possibilité contextuelle signalée en note.
- source_word: כִּי לֹא
  choice: Car il n’y aura plus
  rationale: Cette formulation marque le renversement annoncé après l’obscurité décrite au contexte précédent. « Plus » explicite naturellement la cessation impliquée.
- source_word: לַאֲשֶׁר מוּצָק לָהּ
  choice: pour celle qui était dans la détresse
  rationale: Le féminin est conservé afin de respecter la personnification probable de la région ou du pays, sans introduire explicitement un référent absent de l’hébreu.
theological_decisions:
- issue: 'Valeur de הִכְבִּיד dans la dernière proposition : exaltation future ou prolongement du jugement'
  choice: 'exaltation future : « il couvrira de gloire »'
  alternative: 'jugement prolongé : « il a rendu pesant » ou « il a accablé »'
  rationale: L’opposition lexicale entre הֵקַל et הִכְבִּיד ainsi que le passage de l’obscurité à l’espérance favorisent un contraste entre humiliation passée et honneur à venir. La note conserve toutefois la difficulté temporelle et sémantique de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine du territoire est maintenue. Les noms traditionnels « Zabulon » et « Nephtali » sont conservés. La phrase garde la progression temporelle et géographique de l’hébreu tout en évitant une syntaxe artificielle.
