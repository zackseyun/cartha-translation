    issue: Ajout de « plus » dans « il n’y aura plus d’obscurité ».
    rationale: Le texte porte simplement « il n’y aura pas d’obscurité/gloom ». Le contexte peut suggérer une fin de l’obscurité, mais « plus » l’explicite davantage que l’hébreu. Le supprimer préserve plus exactement la formulation source.
  - severity: low
    issue: Les expressions temporelles sont quelque peu pesantes.
    rationale: « Dans un premier temps » et « dans un temps à venir » sont compréhensibles, mais « dans le passé » et « à l’avenir » rendent plus naturellement le contraste כָּעֵת הָרִאשׁוֹן / וְהָאַחֲרוֹן.
