source:
  edition: WLC
  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
translation:
  language: fr
  text: Ne qualifiez pas de « conspiration » tout ce que ce peuple qualifie de « conspiration »[a]. Ne craignez pas ce qu’il craint[b] et ne vous laissez pas terrifier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne dites pas : “Conspiration !” à propos de tout ce dont ce peuple dit : “Conspiration !” »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement un suffixe singulier renvoyant à l’expression collective « ce peuple ». L’expression peut aussi se comprendre : « ne craignez pas sa crainte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר / קָשֶׁר
  choice: conspiration
  rationale: Le nom désigne une entente conspiratrice ou un complot. « Conspiration » conserve ici la portée politique et sociale ainsi que la répétition rhétorique de l’hébreu.
- source_word: תֹאמְרוּן
  choice: qualifiez de
  rationale: Le verbe signifie littéralement « dire », mais la construction attribue une désignation. « Qualifier de » exprime naturellement en français l’acte d’apposer l’étiquette « conspiration ».
- source_word: לְכֹל אֲשֶׁר יֹאמַר הָעָם הַזֶּה
  choice: tout ce que ce peuple qualifie de
  rationale: Cette formulation rend la relation implicite entre l’objet et son qualificatif tout en conservant la portée générale de כֹל.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: « Ce peuple » restitue l’expression collective et son possible ton de distance ou de reproche, sans la réduire à « ces gens » ni l’élargir à « cette nation ».
- source_word: מוֹרָאוֹ
  choice: ce qu’il craint
  rationale: Le suffixe singulier renvoie naturellement au collectif « ce peuple ». L’expression peut désigner la peur ou son objet; « ce qu’il craint » préserve cette portée contextuelle sans changer le nombre grammatical.
- source_word: תִירְאוּ
  choice: craignez
  rationale: Équivalent direct de ירא, il maintient le lien lexical et le parallélisme avec מוֹרָאוֹ.
- source_word: תַעֲרִיצוּ
  choice: n’en soyez pas terrifiés
  rationale: Le hiphil de ערץ exprime l’effroi ou le fait de tenir quelque chose pour terrifiant. « Être terrifiés » rend l’intensification après « craindre »; « en » rattache naturellement la proposition à l’objet de crainte précédent.
theological_decisions:
- issue: Référent et portée de l’interdiction concernant la crainte
  choice: Le verset interdit aux destinataires d’adopter l’évaluation alarmiste et la peur du peuple.
  alternative: Le verset interdirait précisément de participer à une véritable conspiration, ou principalement de craindre le peuple lui-même.
  rationale: La répétition de « conspiration » et les propositions parallèles orientent vers un refus de reprendre le diagnostic et la panique du peuple. La traduction demeure assez ouverte pour ne pas préciser indûment le référent historique.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets signalent que « conspiration » est une qualification reprise dans le discours. Le singulier « il » maintient l’accord avec le collectif « ce peuple », naturel en français, tandis que la seconde injonction conserve l’intensification poétique.
