  text: לְ/תוֹרָ֖ה וְ/לִ/תְעוּדָ֑ה אִם לֹ֤א יֹֽאמְרוּ֙ כַּ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אֵֽין ל֖/וֹ שָֽׁחַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
translation:
  language: fr
  text: À l’instruction[a] et au témoignage ! S’ils ne parlent pas conformément à cette parole[b], il n’y a pas d’aurore pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À la loi ». Le mot hébreu torah peut désigner aussi bien une instruction qu’une loi.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « S’ils ne parlent pas conformément à cette parole, qui n’a pas d’aurore. » La brève proposition finale de l’hébreu peut être comprise soit comme se rapportant à « cette parole », soit comme visant ceux qui ne parlent pas selon elle.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  choice: à l’instruction
  rationale: תּוֹרָה désigne ici l’enseignement ou la directive faisant autorité. « Instruction » conserve cette portée plus large que « loi » et forme un parallélisme naturel avec « témoignage ».
- source_word: וְלִתְעוּדָה
  choice: et au témoignage
  rationale: תְּעוּדָה évoque un témoignage ou une attestation faisant autorité. « Témoignage » est précis, digne et naturel dans ce contexte prophétique.
- source_word: אִם לֹא יֹאמְרוּ
  choice: s’ils ne parlent pas
  rationale: La formulation garde le sens conditionnel ordinaire de אִם לֹא. « Parler » convient au contexte de ceux qui donnent des conseils ou transmettent un message.
- source_word: כַּדָּבָר הַזֶּה
  choice: conformément à cette parole
  rationale: דָּבָר peut signifier « parole », « message » ou « chose ». « Cette parole » préserve le lien formel avec la révélation qui sert de norme, tandis que « conformément à » exprime naturellement la valeur de la préposition כְּ.
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  choice: il n’y a pas d’aurore pour eux
  rationale: « Aurore » conserve l’image concrète de שַׁחַר. Le pronom hébreu singulier peut renvoyer distributivement ou collectivement à ceux qui ne parlent pas conformément à cette parole ; le pluriel français reprend naturellement le sujet précédent sans supprimer l’ambiguïté, signalée en note.
theological_decisions:
- issue: Référent et portée de la proposition finale
  choice: La proposition avertit que ceux qui ne parlent pas conformément à la révélation divine n’ont pas d’aurore devant eux.
  alternative: 'On peut rattacher plus étroitement la proposition à « cette parole » et comprendre : « une parole pour laquelle il n’y a pas d’aurore » ; אִם peut aussi recevoir une nuance affirmative plutôt que strictement conditionnelle.'
  rationale: Le contexte oppose la recherche de conseils auprès des morts au recours à l’instruction et au témoignage de Dieu. La lecture personnelle suit naturellement le sujet pluriel, mais la note maintient l’ambiguïté réelle de l’hébreu compact sans lui imposer une conclusion doctrinale développée.
translation_notes:
  register: Français international moderne, sobre et solennel. L’exclamation initiale conserve la forme brève de l’appel hébreu. « Aurore » maintient l’image poétique sans l’expliciter par « lumière » ou « espoir ».
