base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/022.yaml
  text: And he will look to the earth[a], and behold, distress and darkness, the gloom of anguish[b]; and thick darkness will be driven away.
translation:
  language: fr
  text: 'Il regardera vers la terre[a] : voici la détresse et les ténèbres, l’obscurité de l’angoisse ; il sera chassé dans une profonde obscurité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est très condensé : littéralement, quelque chose comme « détresse et ténèbres, obscurité d’angoisse, et profonde obscurité — [quelqu’un] chassé ». Le mot rendu par « chassé » est masculin ; il peut se rapporter au sujet implicite du verset. La relation exacte entre ce participe et « profonde obscurité » reste elliptique.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. Dans le contraste contextuel entre regarder en haut et regarder vers la terre, « la terre » restitue naturellement la portée spatiale du texte, tout en signalant l’autre possibilité en note.
- source_word: יַבִּיט
  choice: il regardera
  rationale: Le hifil de נבט signifie couramment « regarder » ou « porter le regard ». Le futur simple convient au contexte prophétique et au verbe hébreu à l’inaccompli.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction déictique de הִנֵּה, qui attire solennellement l’attention sur ce qui apparaît.
- source_word: צָרָה
  choice: la détresse
  rationale: צָרָה évoque la détresse, le malheur ou l’adversité. « Détresse » convient à l’accumulation poétique et conserve l’intensité du terme.
- source_word: חֲשֵׁכָה
  choice: les ténèbres
  rationale: Le nom désigne les ténèbres ou l’obscurité. « Les ténèbres » maintient ici une diction poétique et permet de distinguer ce terme des expressions plus fortes qui suivent.
- source_word: מְעוּף צוּקָה
  choice: l’obscurité de l’angoisse
  rationale: Le rare מְעוּף est vraisemblablement en relation construite avec צוּקָה. Cette traduction garde la formulation nominale, dense et intensifiée, sans en préciser abusivement le rapport.
- source_word: אֲפֵלָה
  choice: une profonde obscurité
  rationale: אֲפֵלָה désigne une obscurité particulièrement épaisse ou profonde. La tournure choisie est idiomatique en français et marque l’intensification.
- source_word: מְנֻדָּח
  choice: il sera chassé
  rationale: Le participe passif masculin singulier de נדח évoque quelqu’un que l’on chasse, repousse ou bannit. Son genre ne s’accorde pas avec אֲפֵלָה, féminin, ce qui favorise l’interprétation d’un sujet humain implicite, déjà exprimé par « il » au début du verset.
theological_decisions:
- issue: Sujet et relation syntaxique de la dernière expression וַאֲפֵלָה מְנֻדָּח
  choice: « il sera chassé dans une profonde obscurité »
  alternative: « une profonde obscurité, chassé » ou « et une profonde obscurité sera repoussée »
  rationale: L’hébreu final est extrêmement condensé. Le masculin singulier מְנֻדָּח s’accorde plus naturellement avec le sujet humain implicite qu’avec אֲפֵלָה, nom féminin. La préposition « dans » est toutefois suppléée pour rendre la relation intelligible en français ; la note conserve l’ambiguïté formelle du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation rend lisible l’accumulation poétique sans effacer sa densité. « Voici » et « ténèbres » préservent la solennité du passage, tandis que les notes maintiennent les principales ambiguïtés lexicales et syntaxiques.
