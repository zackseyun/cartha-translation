base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
translation:
  language: fr
  text: 'Et lorsqu’on vous dira : « Consultez les médiums[a] et les devins qui pépient et murmurent[b] », un peuple ne devrait-il pas consulter son Dieu ? Consulterait-il les morts en faveur des vivants ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les esprits » ou « ceux qui évoquent les esprits ». Le terme hébreu peut désigner les esprits consultés ou les praticiens qui prétendent entrer en contact avec eux.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui poussent de petits cris et marmonnent ». L’hébreu évoque des sons aigus, presque semblables à des cris d’oiseaux, ainsi qu’un murmure indistinct associé à la consultation des esprits.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יֹאמְרוּ אֲלֵיכֶם
  choice: Et lorsqu’on vous dira
  rationale: Le tour introduit une situation envisagée ou attendue. Le français emploie naturellement le singulier indéfini « on » pour rendre le pluriel hébreu sans identifier les locuteurs.
- source_word: דִּרְשׁוּ
  choice: Consultez
  rationale: Dans ce contexte divinatoire, דרש désigne la recherche d’une réponse ou d’une direction auprès d’une source ; « consulter » est précis et actuel.
- source_word: הָאֹבוֹת
  choice: les médiums
  rationale: Le terme peut désigner les esprits évoqués ou ceux qui servent d’intermédiaires avec eux. « Médiums » exprime clairement ici la pratique nécromantique, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: הַיִּדְּעֹנִים
  choice: les devins
  rationale: Le mot désigne des praticiens occultes associés à la consultation des esprits. « Devins » est compréhensible en français moderne et évite les connotations fantastiques de « sorciers ».
- source_word: הַמְצַפְצְפִים וְהַמַּהְגִּים
  choice: qui pépient et murmurent
  rationale: Les participes évoquent respectivement des sons aigus, presque semblables à des cris d’oiseaux, et une parole basse ou indistincte. La formulation garde cet effet sonore étrange.
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  choice: un peuple ne devrait-il pas consulter son Dieu ?
  rationale: La question rhétorique attend une réponse affirmative. La répétition de « consulter » maintient le lien lexical avec דרש et fait ressortir le contraste.
- source_word: בְּעַד הַחַיִּים אֶל הַמֵּתִים
  choice: Consulterait-il les morts en faveur des vivants ?
  rationale: La seconde occurrence de l’idée de consultation est elliptique en hébreu ; elle est explicitée en français. « En faveur des vivants » rend la valeur de בְּעַד sans trancher au-delà du contexte.
theological_decisions:
- issue: Contraste entre la consultation de Dieu et celle des morts
  choice: Le texte réprouve la recherche de conseils auprès des morts et de leurs intermédiaires plutôt qu’auprès de Dieu.
  alternative: Comprendre la dernière proposition uniquement comme une moquerie de l’irrationalité de cette pratique, ou comme un énoncé complet sur l’état et les capacités des morts.
  rationale: La formulation conserve la force polémique et la question rhétorique du verset sans lui faire affirmer une doctrine plus développée sur les morts que ne le permet le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel du texte source est rendu par « vous » ; les questions rhétoriques restent explicites. Le vocabulaire occulte demeure descriptif sans recourir à une terminologie confessionnelle ou archaïque.
