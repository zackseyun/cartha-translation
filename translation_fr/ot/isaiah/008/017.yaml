  text: וְ/חִכִּ֨יתִי֙ לַ/יהוָ֔ה הַ/מַּסְתִּ֥יר פָּנָ֖י/ו מִ/בֵּ֣ית יַעֲקֹ֑ב וְ/קִוֵּ֖יתִֽי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
translation:
  language: fr
  text: Et j’attendrai Yahweh, qui cache son visage à la maison de Jacob[a], et je mettrai mon espérance en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Jacob » désigne collectivement les descendants de Jacob, c’est-à-dire Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִכִּיתִי
  choice: Et moi, j’attendrai
  rationale: Le verbe חכה exprime une attente confiante. La mise en relief « Et moi » rend naturellement en français le contraste porté par la forme verbale et son contexte, sans ajouter la notion de patience.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל indique celui vers qui se porte l’attente; le tétragramme est translittéré « Yahweh » afin de conserver le nom divin.
- source_word: הַמַּסְתִּיר פָּנָיו
  choice: qui cache son visage
  rationale: Cette formulation naturelle conserve le participe hébreu dans sa valeur continue ou caractéristique ainsi que l’image théologique, sans l’expliciter par « retire sa faveur ».
- source_word: מִבֵּית יַעֲקֹב
  choice: à la maison de Jacob
  rationale: Avec « cacher son visage », le français emploie naturellement « à ». « La maison de Jacob » préserve la désignation collective et biblique des descendants de Jacob.
- source_word: וְקִוֵּיתִי
  choice: et je mettrai mon espérance
  rationale: קוה associe attente et espérance confiante. Cette traduction distingue le second verbe de חכה tout en préservant le parallélisme.
- source_word: לוֹ
  choice: en lui
  rationale: Avec « mettre son espérance », « en lui » exprime idiomatiquement en français l’orientation de la confiance vers Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom d’alliance au lieu de lui substituer un titre.
- issue: Dieu cache son visage
  choice: Conserver l’image « cache son visage »
  alternative: retire sa faveur / se détourne
  rationale: L’image hébraïque porte une tension théologique qu’une explicitation résoudrait indûment; elle est donc maintenue sans interprétation ajoutée.
- issue: Valeur temporelle du participe הַמַּסְתִּיר
  choice: qui cache
  alternative: qui est en train de cacher / qui a caché
  rationale: Le participe peut décrire une action continue ou caractéristique. Le présent français reste naturel et laisse cette nuance ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique en deux verbes — attendre puis mettre son espérance — est conservée, ainsi que l’expression biblique « maison de Jacob ».
