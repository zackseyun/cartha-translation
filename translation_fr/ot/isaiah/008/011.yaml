  text: כִּי֩ כֹ֨ה אָמַ֧ר יְהוָ֛ה אֵלַ֖/י כְּ/חֶזְקַ֣ת הַ/יָּ֑ד וְ/יִסְּרֵ֕/נִי מִ/לֶּ֛כֶת בְּ/דֶ֥רֶךְ הָֽ/עָם הַ/זֶּ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
translation:
  language: fr
  text: 'Car voici ce que Yahweh m’a dit, alors que sa main pesait fortement sur moi[a] et qu’il m’avertissait de ne pas suivre la voie de ce peuple, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une main forte ». Littéralement, l’expression évoque la force de la main ; dans ce contexte, elle peut désigner la puissante emprise de Dieu sur le prophète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que … m’a dit
  rationale: כִּי relie cette déclaration au contexte précédent, et כֹה introduit la parole divine. Cette formulation française est naturelle tout en conservant la valeur explicative et la solennité prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin représenté par le tétragramme, plutôt que substitution par un titre.
- source_word: כְּחֶזְקַת הַיָּד
  choice: tandis que sa main me saisissait avec force
  rationale: La tournure hébraïque, littéralement liée à la « force de la main », évoque ici une action divine puissante exercée sur le prophète. La formulation garde l’image de la main sans préciser au-delà du texte s’il s’agit surtout de contrainte, d’emprise ou d’impulsion prophétique.
- source_word: וְיִסְּרֵנִי
  choice: il m’avertissait
  rationale: Le verbe יסר peut signifier corriger, discipliner, instruire ou avertir. Puisqu’il introduit ici une interdiction, « avertissait » exprime naturellement sa fonction contextuelle, tout en signalant les autres possibilités en note.
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  choice: de ne pas suivre la voie
  rationale: Après יסר, מִן marque l’éloignement ou l’empêchement. « Suivre la voie » rend en français courant la métaphore hébraïque de la marche comme conduite.
- source_word: הָעָם הַזֶּה
  choice: de ce peuple
  rationale: Conserve le collectif singulier et la désignation déictique de l’hébreu.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Introduit la teneur de l’avertissement, qui se poursuit au verset suivant; les deux-points préservent cette continuité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Nature de l’action exprimée par יסר
  choice: il m’avertissait
  alternative: il m’instruisait / me corrigeait
  rationale: Le contexte immédiat présente une interdiction. « Avertissait » convient donc, sans exclure la dimension d’instruction ou de discipline propre au verbe.
- issue: Force de la main divine
  choice: tandis que sa main me saisissait avec force
  alternative: avec une main forte / lorsque sa main pesait fortement sur moi
  rationale: La syntaxe est concise et l’expression peut évoquer une forte emprise divine. Le choix conserve l’image sans définir précisément la nature de l’expérience prophétique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure prophétique demeure solennelle sans archaïsme. Le deux-points final signale que la parole citée se poursuit au verset suivant.
