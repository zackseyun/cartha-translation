    issue: « tandis que sa main me saisissait avec force » surinterprète l'idiome.
    rationale: כְּחֶזְקַת הַיָּד évoque la force ou le poids de la main divine, probablement exercée sur le prophète dans ce contexte, mais ne décrit pas explicitement une action de saisir. « Pesait fortement sur moi » rend l'emprise sans ajouter ce geste précis.
  - severity: high
    issue: La note identifie à tort le littéral comme « comme la main devenait forte ».
    rationale: La construction ne signifie pas que la main « devenait » forte. Elle se rapporte à la force de la main, avec une valeur idiomatique que l'on peut rendre par « d'une main forte » ou, contextuellement, « alors que sa main pesait fortement sur moi ».
  revised_text: 'Car voici ce que Yahweh m’a dit, alors que sa main pesait fortement sur moi[a] et qu’il m’avertissait de ne pas suivre la voie de ce peuple, en disant :'
  revised_footnotes:
