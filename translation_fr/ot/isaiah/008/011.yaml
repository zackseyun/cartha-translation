  to: 'Car voici ce que Yahweh m’a dit, alors que sa main pesait fortement sur moi[a] et qu’il m’avertissait de ne pas suivre la voie de ce peuple, en disant :'
  rationale: La révision conserve la relation explicative introduite par « Car », le nom divin et l'image de la main, tout en évitant d'ajouter l'idée spécifique d'une saisie. La note est corrigée afin de distinguer le sens littéral de la valeur idiomatique contextuelle.
