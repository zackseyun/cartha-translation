source:
  edition: WLC
  text: דְּרָכָ֥י/ו רָאִ֖יתִי וְ/אֶרְפָּאֵ֑/הוּ וְ/אַנְחֵ֕/הוּ וַ/אֲשַׁלֵּ֧ם נִֽחֻמִ֛ים ל֖/וֹ וְ/לַ/אֲבֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
translation:
  language: fr
  text: J’ai vu ses voies, et je le guérirai ; je le guiderai et je lui accorderai des consolations, ainsi qu’à ceux qui sont en deuil avec lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ses endeuillés ». L’expression peut désigner ceux qui sont liés à son deuil ou ceux qui portent son deuil ; le texte ne précise pas davantage leur relation avec lui.'
    reason: Préserver l’ambiguïté du suffixe possessif dans « ses endeuillés » et la relation exacte entre l’homme et les personnes en deuil.
lexical_decisions:
- source_word: דְּרָכָיו
  choice: ses voies
  rationale: Le pluriel désigne ici sa manière de vivre ou sa conduite. « Ses voies » conserve l’image hébraïque, naturelle en français biblique courant, sans préciser davantage la valeur morale.
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le passé composé exprime naturellement en français un constat antérieur qui demeure pertinent pour les promesses qui suivent.
- source_word: וְאֶרְפָּאֵהוּ
  choice: et je le guérirai
  rationale: Le verbe רפא signifie normalement « guérir » et garde ici sa portée à la fois concrète et figurée.
- source_word: וְאַנְחֵהוּ
  choice: je le conduirai
  rationale: Le hifil de נחה signifie conduire ou guider. « Conduire » exprime directement l’action personnelle de Dieu.
- source_word: וַאֲשַׁלֵּם
  choice: je rendrai
  rationale: Dans ce contexte, le piel de שׁלם a le sens de restituer ou de rendre pleinement, plutôt que de payer une dette.
- source_word: נִחֻמִים
  choice: le réconfort
  rationale: Le nom hébreu est au pluriel, mais le nom massif singulier « réconfort » est plus idiomatique en français et transmet bien l’idée de consolations accordées.
- source_word: לּוֹ
  choice: à lui
  rationale: La préposition ל désigne le bénéficiaire. La formulation explicite maintient le parallélisme avec le groupe suivant.
- source_word: וְלַאֲבֵלָיו
  choice: ainsi qu’à ceux qui sont en deuil avec lui
  rationale: Le suffixe relie les personnes endeuillées à l’homme mentionné, sans imposer l’idée qu’elles pleurent sa mort, ce qui s’accorderait mal avec la promesse de le guérir.
theological_decisions:
- issue: Portée morale de « ses voies » dans un contexte de restauration
  choice: Le texte affirme que Dieu a vu les voies de cet homme et promet néanmoins de le guérir et de le conduire.
  alternative: Traduire de façon plus explicite par « sa mauvaise conduite » ou introduire sa repentance.
  rationale: Le verset ne qualifie pas lui-même ces voies et ne mentionne pas explicitement la repentance. La traduction conserve donc la tension entre le regard lucide de Dieu et sa promesse de restauration.
- issue: Rapport logique entre le constat et la guérison
  choice: Conserver la coordination « et », conformément au waw hébreu.
  alternative: Employer « mais » pour expliciter le contraste suggéré par le contexte.
  rationale: Le contraste est plausible, mais il n’est pas marqué lexicalement de façon univoque. La coordination préserve l’ambiguïté discursive du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Ses voies » garde l’image traditionnelle sans devenir archaïque ; « le réconfort » privilégie l’usage français naturel malgré le pluriel hébreu.
