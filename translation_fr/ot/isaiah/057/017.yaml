  rationale: La révision supprime l’adversatif ajouté et conserve la coordination hébraïque. Elle resserre l’expression de la cause, rend la répétition de קצף par une expression française directe et homogène, et isole dans la note b la seule alternative textuelle pertinente, sans modifier le sens du passage.
