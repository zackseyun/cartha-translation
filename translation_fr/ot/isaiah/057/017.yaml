  source_fidelity: 'Le sens central est bien rendu : la colère divine est motivée par le בֶּצַע fautif, Dieu frappe puis se cache, et l’homme continue dans une voie dictée par son cœur. Toutefois, « mais » ajoute une opposition que le waw narratif ne marque pas explicitement, et la note b introduit à tort une ambiguïté de conjonction dans une note consacrée à הַסְתֵּר.'
