  terminology: « Gain malhonnête » convient bien à בִּצְעוֹ. « Je me suis indigné » est défendable pour קצף, mais « je me suis mis en colère » est plus direct, moins interprétatif et reflète clairement la répétition du verbe hébreu. « La voie de son cœur » conserve l’image sans imposer une lecture doctrinale.
