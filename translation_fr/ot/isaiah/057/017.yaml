source:
  edition: WLC
  text: בַּ/עֲוֺ֥ן בִּצְע֛/וֹ קָצַ֥פְתִּי וְ/אַכֵּ֖/הוּ הַסְתֵּ֣ר וְ/אֶקְצֹ֑ף וַ/יֵּ֥לֶךְ שׁוֹבָ֖ב בְּ/דֶ֥רֶךְ לִבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/017.yaml
  text: Because of the iniquity of his unjust gain I was angry[a], and I struck him; I hid myself and was angry[b], and he went on backsliding in the way of his heart.
translation:
  language: fr
  text: À cause de la faute de son gain malhonnête, je me suis mis en colère[a] et je l’ai frappé ; je me suis caché et je me suis mis en colère[b], et il a continué à se détourner, suivant la voie de son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son avidité ». Le terme hébreu peut désigner soit le désir cupide, soit le profit obtenu par avidité.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai caché ma face et je me suis mis en colère ». « Cacher sa face » est un idiome biblique fréquent, mais le mot « face » n’est pas explicite ici.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲוֺן
  choice: À cause de la faute liée à
  rationale: La préposition ב est comprise ici dans un sens causal. Cette formulation française relie clairement la faute au gain évoqué sans alourdir la phrase.
- source_word: בִּצְעוֹ
  choice: son gain malhonnête
  rationale: בֶּצַע peut désigner le profit obtenu par avidité ou l’avidité elle-même. « Gain malhonnête » conserve la dimension concrète et la condamnation morale.
- source_word: קָצַפְתִּי / וְאֶקְצֹף
  choice: je me suis indigné
  rationale: קצף exprime une vive colère. « S’indigner » convient au registre digne du passage et se répète pour préserver l’écho hébreu.
- source_word: וְאַכֵּהוּ
  choice: et je l’ai frappé
  rationale: Le hiphil de נכה désigne ici une action punitive concrète; « frapper » en conserve directement le sens.
- source_word: הַסְתֵּר
  choice: Je me suis caché
  rationale: L’infinitif absolu est elliptique ou adverbial. La formulation n’ajoute pas le mot « face », absent de l’hébreu.
- source_word: וַיֵּלֶךְ שׁוֹבָב
  choice: mais lui a persisté à se détourner
  rationale: הלך associé à שׁוֹבָב décrit la poursuite d’une conduite déviante. « A persisté à se détourner » rend ce caractère continu en français actuel; « mais » explicite le contraste contextuel entre le jugement divin et la persistance humaine.
- source_word: בְּדֶרֶךְ לִבּוֹ
  choice: en suivant la voie de son cœur
  rationale: La formulation conserve l’image de la voie tout en exprimant naturellement une conduite dictée par les dispositions ou la volonté intérieures.
theological_decisions:
- issue: Expression du retrait divin dans הַסְתֵּר
  choice: Je me suis caché
  alternative: J’ai caché ma face
  rationale: Le texte hébreu ne mentionne pas explicitement la face. Le texte principal évite donc de l’ajouter, tandis que la note conserve l’idiome biblique possible.
- issue: Objet moral du jugement dans בִּצְעוֹ
  choice: son gain malhonnête
  alternative: son avidité
  rationale: Le nom peut viser soit le désir cupide, soit le profit qui en résulte. Le choix principal garde le référent économique concret sans effacer sa dimension morale.
- issue: Relation entre le jugement divin et la conduite persistante
  choice: mais lui a persisté
  alternative: et il a persisté
  rationale: La conjonction hébraïque est formellement ו, souvent traduite par « et », mais le contexte permet une valeur contrastive. La note préserve la coordination plus formelle afin de ne pas masquer l’ambiguïté discursive.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la colère divine est conservé, de même que les images du retrait de Dieu et de la voie du cœur. Les deux ambiguïtés lexicales principales sont signalées en notes.
