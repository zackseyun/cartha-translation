id: ISA.57.14
reference: Isaiah 57:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַ֥ר סֹֽלּוּ סֹ֖לּוּ פַּנּוּ דָ֑רֶךְ הָרִ֥ימוּ מִכְשׁ֖וֹל מִ/דֶּ֥רֶךְ עַמִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
translation:
  language: fr
  text: 'Et l’on dira : « Aménagez, aménagez la route[a] ; dégagez le chemin ; enlevez du chemin de mon peuple l’obstacle qui fait trébucher. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus traditionnellement : « Remblayez, remblayez ; préparez le chemin. » L’hébreu emploie l’image de la construction d’une route.'
    reason: Alternative lexicale qui rend plus littéralement l’image hébraïque de la voie surélevée ou remblayée.
lexical_decisions:
- source_word: וְאָמַר
  choice: Et l’on dira
  rationale: Le qatal 3ms précédé de la conjonction fonctionne ici comme une formule d’annonce dont le sujet n’est pas précisé. La tournure impersonnelle française préserve cette indétermination sans imposer un locuteur.
- source_word: סֹלּוּ סֹלּוּ
  choice: Aménagez, aménagez la route
  rationale: Le verbe סלל évoque l’aménagement ou la construction en remblai d’une voie. La répétition impérative est conservée, tandis que « aménagez la route » rend l’image compréhensible en français moderne.
- source_word: פַּנּוּ דָרֶךְ
  choice: dégagez le chemin
  rationale: פנה à l’impératif exprime ici l’action de libérer ou de préparer le passage. « Dégagez le chemin » conserve concrètement l’idée d’enlever ce qui encombre.
- source_word: הָרִימוּ
  choice: enlevez
  rationale: Le hifil de רום signifie littéralement « soulever ». Avec l’obstacle comme complément, le sens contextuel est de le soulever pour l’écarter ; « enlevez » est l’expression française naturelle de ce résultat.
- source_word: מִכְשׁוֹל
  choice: l’obstacle qui fait trébucher
  rationale: מכשול désigne ce qui provoque une chute, au sens propre ou figuré. Cette formulation conserve explicitement la métaphore du trébuchement, que le seul mot « obstacle » atténuerait.
- source_word: מִדֶּרֶךְ עַמִּי
  choice: du chemin de mon peuple
  rationale: La préposition מן marque l’éloignement hors du chemin associé au peuple de Dieu. L’ordre « enlevez du chemin… » est idiomatique et garde la relation possessive du texte.
theological_decisions:
- issue: Identification du locuteur dans la formule initiale
  choice: 'Formule impersonnelle : « l’on dira »'
  alternative: « il dira », avec Dieu comme sujet, ou « quelqu’un dira »
  rationale: L’hébreu ne nomme pas explicitement le sujet. La tournure choisie maintient cette ambiguïté et n’attribue pas arbitrairement la parole à Dieu ou à un interlocuteur humain déterminé.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. Le parallélisme impératif et la répétition emphatique de l’hébreu sont conservés. « L’on » évite l’ambiguïté familière de « on » tout en restant naturel.
