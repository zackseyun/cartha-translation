  terminology: « Route », « chemin » et « obstacle qui fait trébucher » sont cohérents avec l’image de la voie et du retrait d’un empêchement. La note, correctement ancrée à « route », signale utilement la possibilité plus traditionnelle liée au remblai, sans prétendre résoudre davantage le sens lexical.
