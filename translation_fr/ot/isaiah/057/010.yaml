  text: בְּ/רֹ֤ב דַּרְכֵּ/ךְ֙ יָגַ֔עַתְּ לֹ֥א אָמַ֖רְתְּ נוֹאָ֑שׁ חַיַּ֤ת יָדֵ/ךְ֙ מָצָ֔את עַל כֵּ֖ן לֹ֥א חָלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
translation:
  language: fr
  text: 'À force de suivre tant de voies, tu t’es fatiguée, mais tu n’as pas dit : « C’est sans espoir. »[a] Tu as trouvé de la vigueur dans ta main[b] ; c’est pourquoi tu ne t’es pas affaiblie.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y a aucun espoir. » L’expression hébraïque traduit le désespoir ou la conclusion que tout nouvel effort serait inutile.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la vie de ta main ». L’expression peut désigner la vitalité ou la force qui permet de continuer.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tu n’es pas devenue faible » ; le verbe peut aussi signifier « devenir malade » ou « défaillir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  choice: à parcourir tant de chemins
  rationale: L’expression associe l’abondance ou la multitude à « tes chemins ». Cette formulation française conserve l’idée de démarches nombreuses tout en exprimant naturellement le lien avec la fatigue.
- source_word: יָגַעַתְּ
  choice: tu t’es fatiguée
  rationale: Le verbe indique la fatigue produite par l’effort. Le féminin rend le genre grammatical de la destinataire en hébreu.
- source_word: נוֹאָשׁ
  choice: C’est sans espoir
  rationale: Cette proposition exprime naturellement en français le constat de désespoir ou de futilité que la destinataire refuse de formuler.
- source_word: חַיַּת יָדֵךְ
  choice: de la vigueur dans ta main
  rationale: Littéralement, l’expression évoque « la vie » ou « la vitalité de ta main ». « Vigueur » communique la capacité retrouvée de poursuivre, tandis que « dans ta main » préserve l’image hébraïque de la main comme puissance d’action.
- source_word: מָצָאת
  choice: tu as trouvé
  rationale: Le sens courant de מצא est « trouver » ; il introduit ici ce qui permet à la destinataire de continuer.
- source_word: עַל־כֵּן
  choice: c’est pourquoi
  rationale: La locution marque une conséquence et se rend de façon claire et naturelle par « c’est pourquoi ».
- source_word: לֹא חָלִית
  choice: tu ne t’es pas affaiblie
  rationale: חלה peut désigner le fait de devenir faible ou malade. Dans ce contexte, « s’affaiblir » conserve l’ambiguïté physique et figurée mieux qu’une formulation centrée uniquement sur le découragement.
theological_decisions:
- issue: Valeur de la persévérance décrite dans le contexte de l’idolâtrie
  choice: Conserver une description sobre de la poursuite obstinée sans la présenter explicitement comme vertueuse
  alternative: Expliciter dans le verset qu’il s’agit d’une persévérance coupable
  rationale: Le contexte d’Ésaïe 57 donne à cette persévérance une portée négative, mais le verset lui-même l’exprime par l’ironie et la réprimande implicite. La traduction laisse le contexte porter ce jugement.
- issue: Sens de חַיַּת יָדֵךְ
  choice: Rendre l’expression par « de la vigueur dans ta main » tout en signalant sa forme littérale en note
  alternative: Traduire littéralement « la vie de ta main »
  rationale: La traduction strictement littérale serait obscure en français. Le choix retenu préserve l’image de la main et le sens probable de vitalité sans imposer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement et les formes féminines correspondent à la deuxième personne féminine singulière du texte hébreu. La métaphore de la main est maintenue, mais l’expression hébraïque condensée est rendue intelligible dans le corps du texte et documentée en note.
