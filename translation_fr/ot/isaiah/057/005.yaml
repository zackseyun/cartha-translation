id: ISA.57.5
reference: Isaiah 57:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/נֵּֽחָמִים֙ בָּֽ/אֵלִ֔ים תַּ֖חַת כָּל עֵ֣ץ רַעֲנָ֑ן שֹׁחֲטֵ֤י הַ/יְלָדִים֙ בַּ/נְּחָלִ֔ים תַּ֖חַת סְעִפֵ֥י הַ/סְּלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/005.yaml
  text: you who burn with lust among the terebinths[a], under every green tree, who slaughter the children in the wadis[b], under the clefts of the rocks.
translation:
  language: fr
  text: vous qui brûlez de désir parmi les térébinthes[a], sous tout arbre verdoyant, vous qui égorgez les enfants dans les oueds[b], sous les fentes des rochers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les chênes ». L’hébreu peut désigner ici de grands arbres sacrés de manière plus générale.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les ravins ». Il s’agit de lits de torrents ou de cours d’eau, souvent saisonniers.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֵּחָמִים
  choice: vous qui brûlez de désir
  rationale: Dans ce contexte de pratiques idolâtres, le participe exprime vraisemblablement l’idée de s’échauffer ou de s’enflammer. « Brûlez de désir » restitue naturellement en français sa force érotique probable sans préciser davantage la nature du rite.
- source_word: בָּאֵלִים
  choice: parmi les térébinthes
  rationale: Le parallélisme avec « sous tout arbre verdoyant » favorise le sens de grands arbres cultuels plutôt que celui de « dieux ». « Térébinthes » est ici le sens spécifique le plus probable; « chênes » demeure possible.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: sous tout arbre verdoyant
  rationale: Cette formulation conserve l’image hébraïque et l’expression prophétique désignant des lieux de culte illicite, dans un français naturel.
- source_word: שֹׁחֲטֵי
  choice: vous qui égorgez
  rationale: Le verbe désigne l’abattage par égorgement, souvent sacrificiel. « Égorgez » conserve à la fois la violence concrète et la possible dimension cultuelle.
- source_word: הַיְלָדִים
  choice: les enfants
  rationale: Le terme désigne ici les enfants ou la progéniture sans imposer un sexe ni un âge plus précis.
- source_word: בַּנְּחָלִים
  choice: dans les oueds
  rationale: Le mot hébreu désigne des cours d’eau ou lits de torrents, souvent saisonniers, ainsi que les ravins correspondants. « Oueds » rend précisément cette réalité géographique.
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  choice: sous les fentes des rochers
  rationale: Appliqué aux rochers, le terme évoque leurs divisions, fissures ou renfoncements. « Fentes des rochers » préserve l’image de lieux rocheux retirés sans retenir le littéralisme obscur de « branches ».
theological_decisions:
- issue: Faut-il expliciter la portée érotique et cultuelle du participe initial?
  choice: « vous qui brûlez de désir »
  alternative: « vous qui vous échauffez » ou « vous qui êtes enflammés »
  rationale: Le contexte associe arbres cultuels et sacrifice d’enfants; il donne au participe une portée érotique probable. La traduction l’exprime sans ajouter de doctrine ni définir plus précisément le rite.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme accusateur du verset et la violence du vocabulaire sont conservés. « Oueds » est précis géographiquement; la note fournit l’équivalent plus courant « ravins ».
