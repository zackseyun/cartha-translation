reference: Isaiah 57:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחַ֤ר הַ/דֶּ֨לֶת֙ וְ/הַ/מְּזוּזָ֔ה שַׂ֖מְתְּ זִכְרוֹנֵ֑/ךְ כִּ֣י מֵ/אִתִּ֞/י גִּלִּ֣ית וַֽ/תַּעֲלִ֗י הִרְחַ֤בְתְּ מִשְׁכָּבֵ/ךְ֙ וַ/תִּכְרָת לָ֣/ךְ מֵ/הֶ֔ם אָהַ֥בְתְּ מִשְׁכָּבָ֖/ם יָ֥ד חָזִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
translation:
  language: fr
  text: Derrière la porte et le montant, tu as placé ton mémorial[a] ; car, loin de moi, tu t’es découverte et tu es montée ; tu as élargi ta couche et tu as conclu pour toi un pacte avec eux[b] ; tu as aimé leur couche ; tu as contemplé une main[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton signe commémoratif » ou « ton souvenir ». Le mot hébreu peut désigner ici un objet cultuel placé en secret.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « tu as coupé pour toi avec eux ». L’hébreu emploie le langage habituel de la conclusion d’une alliance, sans toutefois exprimer le nom « alliance » ou « pacte ».
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « tu as contemplé une main ». L’expression est obscure ; « main » pourrait désigner un monument ou un signe, ou constituer un euphémisme sexuel.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  choice: Derrière la porte et le montant
  rationale: אַחַר a ici un sens spatial. מְזוּזָה désigne le montant latéral de la porte, non le seuil. La formulation française conserve l’idée d’un emplacement caché.
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  choice: tu as placé ton mémorial
  rationale: זִכָּרוֹן peut désigner un mémorial, un objet-souvenir ou un signe commémoratif. « Mémorial » préserve le caractère concret et l’ambiguïté du terme sans introduire explicitement « idole ».
- source_word: כִּי מֵאִתִּי גִּלִּית
  choice: car, loin de moi, tu t’es découverte
  rationale: מֵאִתִּי exprime la séparation d’avec le locuteur, tandis que גלה conserve ici une image de dévoilement chargée de connotations sexuelles et honteuses. Le féminin correspond à la destinataire personnifiée.
- source_word: וַתַּעֲלִי
  choice: et tu es montée
  rationale: עלה signifie littéralement « monter ». Cette traduction laisse ouverte une éventuelle allusion aux hauts lieux sans l’expliciter.
- source_word: הִרְחַבְתְּ מִשְׁכָּבֵךְ
  choice: tu as élargi ta couche
  rationale: Le causatif de רחב signifie rendre large ou élargir. « Couche » maintient l’image sexuelle de מִשְׁכָּב dans un registre digne.
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  choice: tu as conclu pour toi un pacte avec eux
  rationale: כרת appartient au langage de la conclusion d’une alliance, bien que le nom בְּרִית ne soit pas exprimé. « Conclure un pacte » rend l’idiome naturellement tout en signalant la dimension d’engagement mutuel.
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  choice: tu as aimé leur couche
  rationale: La formulation garde l’image sexuelle et son possible rapport métaphorique avec l’idolâtrie ou les alliances illicites, sans choisir entre ces référents.
- source_word: יָד חָזִית
  choice: tu as contemplé une main
  rationale: יָד signifie normalement « main », mais la formule reste obscure et peut avoir ici un sens spécialisé ou euphémistique. חזה suggère une vision ou un regard attentif ; « contemplé » préserve cette nuance sans résoudre l’énigme.
theological_decisions:
- issue: Métaphore sexuelle et idolâtre de l’infidélité de Juda
  choice: Conserver dans le texte les images du dévoilement et de la couche, sans les réduire à une explication abstraite.
  alternative: Expliciter partout soit le culte idolâtre, soit les alliances politiques.
  rationale: Le passage fait jouer ensemble infidélité sexuelle, idolâtrie et peut-être alliances illicites. La traduction préserve cette tension théologique et rhétorique.
- issue: Portée de l’expression כרת sans mention explicite de בְּרִית
  choice: « conclure un pacte », avec une note signalant que le mot « pacte » est implicite
  alternative: « conclure un accord » ou, très littéralement, « couper pour toi avec eux »
  rationale: Le verbe relève couramment du langage de l’alliance, mais l’absence du substantif exige de ne pas masquer entièrement l’implicitation.
- issue: Interprétation de יָד חָזִית
  choice: Maintenir l’expression énigmatique « tu as contemplé une main » dans le texte et présenter les principales possibilités en note.
  alternative: Choisir directement « monument », « emblème phallique » ou « puissance ».
  rationale: Aucune interprétation contextuelle ne s’impose assez sûrement pour remplacer le sens lexical ordinaire dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement féminin suit la personnification de la destinataire. « Couche », « mémorial » et « pacte » maintiennent un registre littéraire compréhensible sans atténuer les images ni surinterpréter leurs référents.
