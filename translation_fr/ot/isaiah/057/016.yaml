  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
translation:
  language: fr
  text: Car je ne serai pas toujours en conflit, et je ne resterai pas en colère sans fin ; car l’esprit[a] défaillirait devant moi, ainsi que les souffles de vie[b] que j’ai moi-même faits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle ». Le mot hébreu רוּחַ peut désigner l’esprit ou le souffle.
    reason: lexical_alternative
  - marker: b
    text: Ou « les âmes » ou « les vies ». Le mot hébreu נְשָׁמוֹת signifie littéralement « souffles » et peut désigner les êtres auxquels la vie a été donnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם
  choice: toujours
  rationale: Dans cette proposition négative et en parallèle avec לָנֶצַח, le mot exprime une durée indéfinie. « Pas toujours » est idiomatique en français et conserve la portée temporelle.
- source_word: אָרִיב
  choice: je serai en querelle
  rationale: Le verbe ריב peut évoquer une contestation, une accusation ou un différend. « Être en querelle » reste compréhensible, conserve la dimension relationnelle et judiciaire sans réduire le sens à une procédure précise.
- source_word: לָנֶצַח
  choice: sans fin
  rationale: Cette expression forme un parallèle avec לְעוֹלָם. « Sans fin » en restitue l’insistance tout en évitant une répétition lourde.
- source_word: אֶקְּצֹף
  choice: je resterai en colère
  rationale: קצף désigne la colère ou le courroux. L’ajout idiomatique de « rester » exprime ici la durée niée par לָנֶצַח, sans intensifier indûment le terme.
- source_word: רוּחַ
  choice: l’esprit
  rationale: En parallèle avec נְשָׁמוֹת, רוּחַ désigne ici vraisemblablement l’esprit ou le souffle vital de la créature. « L’esprit » préserve l’ambivalence anthropologique, tandis qu’une note signale « le souffle ».
- source_word: מִלְּפָנַי
  choice: devant moi
  rationale: Littéralement « de devant moi » ; dans ce contexte, « devant moi » exprime naturellement la défaillance qui se produirait en présence de Dieu.
- source_word: יַעֲטוֹף
  choice: défaillirait
  rationale: עטף peut décrire l’affaiblissement, la défaillance ou l’accablement. Le conditionnel français rend la conséquence implicite d’une colère divine qui se prolongerait sans fin.
- source_word: נְשָׁמוֹת
  choice: les souffles de vie
  rationale: Le pluriel de נשמה évoque les souffles qui animent les êtres vivants. « Souffles de vie » garde l’image concrète tout en étant plus intelligible en français que le seul mot « souffles ».
- source_word: אֲנִי עָשִׂיתִי
  choice: que j’ai faits
  rationale: Le verbe עשה signifie « faire ». L’accord masculin pluriel reprend « souffles » ; le pronom sujet exprimé maintient suffisamment la présence du אֲנִי hébreu sans ajouter une emphase artificielle comme « moi-même ».
theological_decisions:
- issue: Valeur anthropologique de רוּחַ et נְשָׁמוֹת
  choice: Comprendre ces termes comme l’esprit et les souffles de vie des créatures humaines.
  alternative: Voir dans רוּחַ une référence à l’Esprit de Dieu, ou traduire נְשָׁמוֹת par « âmes » ou « vies ».
  rationale: Le verset motive la retenue de Dieu par la fragilité de la vie qu’il a lui-même donnée. Le parallélisme entre רוּחַ et נְשָׁמוֹת favorise donc le souffle ou l’esprit de la créature, sans imposer une anthropologie technique ni une référence au Saint-Esprit.
- issue: Rapport logique de la seconde proposition introduite par כִּי
  choice: Conserver « car » et laisser au contexte la nuance de conséquence hypothétique.
  alternative: Traduire explicitement « sinon » ou « autrement ».
  rationale: Le second כִּי introduit formellement une motivation. Le conditionnel « défaillirait » rend la conséquence envisagée, tandis que « car » préserve le lien causal du texte hébreu sans le reformuler entièrement.
translation_notes:
  register: Français international actuel, digne et lisible. Le parallélisme poétique est maintenu, avec une formulation légèrement soutenue (« en querelle », « défaillirait ») adaptée au registre prophétique. Les deux notes sont placées sur les termes hébreux réellement concernés.
