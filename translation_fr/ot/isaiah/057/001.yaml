    text: 'Ou : « à l’abri du malheur », « avant le désastre qui vient » ; ou, selon une autre analyse : « à cause du mal ».'
    reason: La locution מִפְּנֵי הָרָעָה peut décrire le retrait du juste devant un malheur ou un désastre imminent ; elle peut aussi être comprise dans un sens causal. « Mal » dans le texte principal conserve l’ambiguïté de רָעָה.
  revision_rationale: La révision renforce le rendu de אָבָד par « périt », remplace une périphrase interprétative de חֶסֶד par « hommes de bonté », et emploie une expression française plus idiomatique pour שָׂם עַל לֵב. Elle maintient « emportés » et la répétition voulue, ainsi que « loin du mal » comme formulation principale non doctrinale. La note élargit les options sans trancher l’ambiguïté de מִפְּנֵי הָרָעָה.
