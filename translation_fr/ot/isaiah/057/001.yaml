revisions:
- from: Le juste disparaît, et personne ne le prend à cœur ; les hommes qui vivent dans la fidélité sont emportés, sans que personne comprenne que le juste est emporté loin du mal[a].
  to: Le juste périt, et personne n’y prête attention ; les hommes de bonté sont emportés, sans que personne comprenne que le juste est emporté loin du mal[a].
  rationale: La révision renforce le rendu de אָבָד par « périt », remplace une périphrase interprétative de חֶסֶד par « hommes de bonté », et emploie une expression française plus idiomatique pour שָׂם עַל לֵב. Elle maintient « emportés » et la répétition voulue, ainsi que « loin du mal » comme formulation principale non doctrinale. La note élargit les options sans trancher l’ambiguïté de מִפְּנֵי הָרָעָה.
