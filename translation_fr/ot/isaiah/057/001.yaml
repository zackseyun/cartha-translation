source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
translation:
  language: fr
  text: Le juste périt, et personne n’y prête attention ; les hommes de bonté sont emportés, sans que personne comprenne que le juste est emporté loin du mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’abri du malheur », « avant le désastre qui vient » ; ou, selon une autre analyse : « à cause du mal ».'
    reason: La locution מִפְּנֵי הָרָעָה peut décrire le retrait du juste devant un malheur ou un désastre imminent ; elle peut aussi être comprise dans un sens causal. « Mal » dans le texte principal conserve l’ambiguïté de רָעָה.
lexical_decisions:
- source_word: הַצַּדִּיק
  choice: le juste
  rationale: L’adjectif substantivé masculin singulier désigne ici l’homme juste de manière représentative. « Le juste » est idiomatique, digne et précis en français biblique moderne.
- source_word: אָבָד
  choice: disparaît
  rationale: Le qal parfait peut exprimer la disparition, la perte ou la mort. « Disparaît » garde ouverte la nuance de décès ou de retrait et s’accorde avec le parallélisme de « est emporté ».
- source_word: שָׂם עַל לֵב
  choice: le prend à cœur
  rationale: Cette expression rend naturellement l’idiome hébreu qui signifie prêter une attention profonde et sérieuse à un fait.
- source_word: אַנְשֵׁי חֶסֶד
  choice: les hommes qui vivent dans la fidélité
  rationale: חֶסֶד associe bonté, loyauté et amour fidèle. Cette formulation naturelle conserve l’idée d’une fidélité vécue sans réduire le terme à la seule compassion.
- source_word: נֶאֱסָפִים / נֶאֱסַף
  choice: sont emportés / est emporté
  rationale: Le niphal de אסף peut évoquer le fait d’être recueilli ou retiré, notamment par la mort. « Emporté » transmet clairement ce retrait tout en conservant la répétition du texte.
- source_word: בְּאֵין מֵבִין
  choice: sans que personne comprenne
  rationale: 'La construction exprime une circonstance concomitante : ces hommes sont emportés alors que personne n’en saisit le sens.'
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que personne ne comprend.
- source_word: מִפְּנֵי הָרָעָה
  choice: loin du mal
  rationale: מִפְּנֵי peut exprimer l’éloignement ou la mise à l’abri de ce qui menace. « Loin du mal » préserve cette nuance spatiale et laisse à רָעָה sa portée entre mal moral et malheur imminent.
theological_decisions:
- issue: רָעָה peut désigner le mal moral ou un malheur, notamment un désastre à venir.
  choice: mal
  alternative: malheur ou désastre à venir
  rationale: « Mal » conserve l’étendue sémantique et la tension du texte, tandis que la note signale explicitement la lecture circonstancielle probablement suggérée par le contexte.
- issue: La relation exprimée par מִפְּנֵי peut indiquer l’éloignement protecteur ou, selon une autre analyse, la cause.
  choice: loin du mal
  alternative: à cause du mal
  rationale: La lecture spatiale rend compte du sens courant de la locution et de l’idée que la mort du juste peut le soustraire au malheur à venir, sans imposer une explication doctrinale de sa mort.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme en deux membres et la répétition de « le juste est emporté » sont conservés. La formulation évite un archaïsme excessif tout en gardant la densité poétique et l’ambiguïté du verset.
