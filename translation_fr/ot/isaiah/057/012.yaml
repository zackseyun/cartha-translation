source:
  edition: WLC
  text: אֲנִ֥י אַגִּ֖יד צִדְקָתֵ֑/ךְ וְ/אֶֽת מַעֲשַׂ֖יִ/ךְ וְ/לֹ֥א יוֹעִילֽוּ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/012.yaml
  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
translation:
  language: fr
  text: Moi, je proclamerai ta justice[a] et tes œuvres, mais elles ne te serviront à rien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture ». Le mot hébreu peut désigner la justice ou la droiture selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « mais elles ne te seront d’aucun secours » ou « ne te profiteront pas ». Le verbe hébreu peut signifier « être utile, profiter, aider ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, je
  rationale: Le pronom indépendant est exprimé devant le verbe et porte une valeur emphatique. « Moi, je » restitue naturellement cette insistance en français moderne.
- source_word: אַגִּיד
  choice: je proclamerai
  rationale: Le hifil de נגד signifie couramment « déclarer, faire connaître, annoncer ». « Proclamerai » conserve cette idée sans imposer dans le texte le sens plus interprétatif de « dévoilerai ».
- source_word: צִדְקָתֵךְ
  choice: ta justice
  rationale: צדקה peut désigner la justice ou la droiture. Dans cette adresse accusatrice, « ta justice » garde la formulation concise et l'ironie possible sans ajouter « prétendue ».
- source_word: וְאֶת מַעֲשַׂיִךְ
  choice: et tes œuvres
  rationale: מַעֲשִׂים désigne les actes, les œuvres ou ce qui a été fait. « Œuvres » maintient le lien lexical traditionnel tout en restant compréhensible.
- source_word: וְלֹא יוֹעִילוּךְ
  choice: mais elles ne te serviront à rien
  rationale: Au hifil, יעל signifie « être utile, profiter, aider ». Cette tournure idiomatique française exprime clairement l'absence de tout bénéfice; « mais » rend le contraste implicite dans la coordination hébraïque.
theological_decisions:
- issue: Valeur de « ta justice » dans le contexte
  choice: Conserver « ta justice » sans guillemets ni qualificatif.
  alternative: ta prétendue justice ; tes actes justes
  rationale: Le contexte peut donner à l'expression une portée ironique ou accusatrice, mais le texte hébreu ne marque pas explicitement cette ironie. La formulation retenue préserve donc la tension sans résoudre l'interprétation.
translation_notes:
  register: Français international moderne, digne et direct. « Moi, je » marque l'insistance du pronom hébreu; « servir à rien » est courant sans être familier. Le féminin pluriel « elles » reprend naturellement « ta justice et tes œuvres ».
