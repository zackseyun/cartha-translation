base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
translation:
  language: fr
  text: C’est parmi les galets polis du torrent que se trouve ta part[a] ; eux, oui, eux sont ton lot. Tu leur as même versé une libation, tu as offert une offrande de céréales. Est-ce à cause de ces choses que je me laisserais fléchir[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les parts du torrent » ; l’hébreu désigne probablement les galets polis du lit d’un cours d’eau, ce qui correspond au contexte idolâtre.
    reason: lexical_alternative
  - marker: b
    text: Ou « Est-ce à cause de ces choses que je serais consolé ? » Le verbe hébreu peut aussi signifier être consolé ou apaisé.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  choice: parmi les galets polis du torrent
  rationale: חַלְּקֵי peut évoquer ce qui est lisse et, dans ce contexte idolâtre, désigner les galets polis du lit d’un cours d’eau. « Torrent » rend naturellement נַחַל sans imposer le terme technique « oued ».
- source_word: חֶלְקֵךְ
  choice: ta part
  rationale: חֵלֶק désigne une part attribuée. « Part » conserve le lien de sens et le jeu de mots avec « lot » dans le membre parallèle.
- source_word: הֵם הֵם
  choice: eux, oui, eux
  rationale: La reprise du pronom est fortement emphatique. Cette formulation française en restitue l’insistance sans lourdeur excessive.
- source_word: גּוֹרָלֵךְ
  choice: ton lot
  rationale: גּוֹרָל désigne concrètement le lot attribué et forme un parallèle avec « ta part ».
- source_word: נֶסֶךְ
  choice: une libation
  rationale: נֶסֶךְ est le terme cultuel pour une offrande liquide versée. « Libation » est précis et bien établi en français biblique courant.
- source_word: הֶעֱלִית מִנְחָה
  choice: tu as offert une offrande de céréales
  rationale: Le hiphil de עָלָה a ici un sens sacrificiel, rendu naturellement par « offrir ». Dans ce contexte cultuel, מִנְחָה désigne vraisemblablement une offrande végétale, formulée de façon accessible comme « offrande de céréales ».
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  choice: Est-ce à cause de ces choses que je me laisserais fléchir ?
  rationale: Le niphal de נָחַם peut exprimer le fait de revenir sur une décision, de se laisser apaiser ou d’être consolé. « Me laisser fléchir » convient à l’accusation divine sans effacer l’autre sens, signalé en note.
theological_decisions:
- issue: Sens de la question rhétorique finale
  choice: Une question sur le fait que Dieu se laisserait fléchir et renoncerait à sévir
  alternative: Une question sur le fait que Dieu serait consolé ou apaisé par ces actes
  rationale: Le contexte condamne le culte idolâtre et appelle une réponse négative. La traduction principale exprime donc l’idée de fléchissement, tout en conservant en note l’ambiguïté réelle de נָחַם.
translation_notes:
  register: Français international moderne, digne et lisible. Le féminin singulier de l’interlocutrice est perceptible dans « ta part », tandis que l’emphase hébraïque de הֵם הֵם est rendue explicitement. La terminologie sacrificielle reste précise sans devenir technique.
