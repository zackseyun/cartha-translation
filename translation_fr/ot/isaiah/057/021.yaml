  text: There is no peace," says my God[b][a], "for the wicked.
translation:
  language: fr
  text: « Il n’y a pas de paix[a] pour les méchants », dit mon Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bien-être » ou « intégrité »; le mot hébreu shalom a un sens plus large que la seule absence de conflit.
    reason: lexical_alternative
  - marker: b
    text: 'Ésaïe 48.22 présente une formulation très proche : « Il n’y a pas de paix pour les méchants, dit l’Éternel. » Ici, l’hébreu porte « mon Dieu ».'
    reason: cross_reference
lexical_decisions:
- source_word: אֵין
  choice: Il n’y a pas de
  rationale: Cette tournure rend naturellement en français la négation existentielle hébraïque et conserve son caractère absolu.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est l’équivalent français courant de shalom dans ce contexte, tout en pouvant évoquer plus largement le bien-être et l’intégrité.
- source_word: אָמַר
  choice: dit
  rationale: Bien que la forme hébraïque soit un accompli, « dit » fonctionne naturellement comme formule déclarative dans le discours prophétique.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne du singulier est explicitement conservé, sans harmonisation avec Ésaïe 48.22.
- source_word: לָרְשָׁעִים
  choice: pour les méchants
  rationale: La préposition indique ici que la paix n’existe pas pour eux; « les méchants » conserve la catégorie morale générale du terme hébreu.
theological_decisions:
- issue: Attribution de la parole divine
  choice: « mon Dieu » conformément au texte massorétique
  alternative: « l’Éternel », par harmonisation avec Ésaïe 48.22, ou simplement « Dieu »
  rationale: Le texte hébreu reçu porte אֱלֹהַי, « mon Dieu ». Le possessif est donc maintenu afin de préserver la formulation particulière du verset sans la lisser ni l’harmoniser.
translation_notes:
  register: Français international moderne, sobre et prophétique. La phrase reste concise et solennelle; les guillemets français rendent clairement la parole citée.
