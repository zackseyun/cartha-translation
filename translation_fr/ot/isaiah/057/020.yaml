id: ISA.57.20
reference: Isaiah 57:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/רְשָׁעִ֖ים כַּ/יָּ֣ם נִגְרָ֑שׁ כִּ֤י הַשְׁקֵט֙ לֹ֣א יוּכָ֔ל וַ/יִּגְרְשׁ֥וּ מֵימָ֖י/ו רֶ֥פֶשׁ וָ/טִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
translation:
  language: fr
  text: 'Mais les méchants sont comme la mer agitée[a] : elle ne peut se calmer, et ses eaux rejettent de la vase et de la boue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mer poussée et remuée ». Le verbe hébreu évoque littéralement ce qui est chassé ou poussé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  choice: Mais les méchants
  rationale: Le nom désigne des personnes méchantes. Dans le contexte, la conjonction introduit un contraste avec la paix évoquée au verset précédent ; « Mais » exprime naturellement cette valeur adversative.
- source_word: כַּיָּם נִגְרָשׁ
  choice: comme la mer agitée
  rationale: La préposition marque la comparaison. Le participe de גרשׁ présente la mer comme poussée et remuée par des forces qui l'agitent. « Mer agitée » rend l'image clairement en français moderne, tout en conservant en note la nuance plus littérale de « poussée ».
- source_word: כִּי הַשְׁקֵט לֹא יוּכָל
  choice: elle ne peut se calmer
  rationale: כִּי introduit ici l'explication de la comparaison ; en français, les deux-points la rendent sans lourdeur. שׁקט évoque le calme ou le repos, et la tournure pronominale « se calmer » convient naturellement à la mer.
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  choice: et ses eaux rejettent
  rationale: Le verbe גרשׁ signifie chasser ou expulser. Avec les eaux pour sujet, « rejettent » exprime naturellement l'expulsion des matières remuées, tout en maintenant le lien lexical avec l'image précédente.
- source_word: רֶפֶשׁ וָטִיט
  choice: de la vase et de la boue
  rationale: רֶפֶשׁ désigne une matière fangeuse ou sale, bien rendue ici par « vase » dans un contexte marin ; טִיט désigne la boue ou l'argile humide. Le binôme français conserve l'accumulation concrète de l'hébreu.
theological_decisions:
- issue: Valeur de la conjonction initiale
  choice: Mais les méchants
  alternative: Et les méchants
  rationale: Le contexte oppose leur état à la paix du verset précédent. « Mais » explicite cette relation discursive sans ajouter de contenu doctrinal.
- issue: État de la mer dans la comparaison
  choice: la mer agitée
  alternative: la mer poussée / la mer déchaînée
  rationale: « Agitée » est idiomatique et maintient l'image d'une mer continuellement remuée. La note signale la valeur plus concrète de גרשׁ afin de ne pas effacer l'ambiguïté entre état troublé et action subie.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation par deux-points rend la relation explicative portée par כִּי. « Vase et boue » conserve l'image concrète sans vocabulaire archaïque.
