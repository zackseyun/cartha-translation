source:
  edition: WLC
  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
translation:
  language: fr
  text: Qui donc as-tu redouté et craint, au point de mentir, de ne pas te souvenir de moi et de ne pas prendre cela à cœur[a] ? N’est-ce pas parce que, depuis longtemps[b], je garde le silence que tu ne me crains pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne l’as pas mis sur ton cœur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « depuis les temps anciens » ; « pendant longtemps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּאַגְתְּ וַתִּירְאִי
  choice: redoutais-tu et craignais-tu
  rationale: Le premier verbe exprime l’inquiétude ou l’appréhension et le second la peur. Le doublet français conserve le parallélisme et la force de la question.
- source_word: כִּי תְכַזֵּבִי
  choice: pour que tu mentes
  rationale: 'כִּי est compris ici comme introduisant le résultat ou la conséquence : la peur éprouvée devant d’autres conduit au mensonge.'
- source_word: וְאוֹתִי לֹא זָכַרְתְּ
  choice: que tu ne te souviennes pas de moi
  rationale: La formulation conserve le sens cognitif et relationnel de זכר sans expliciter davantage ce que le texte laisse implicite.
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  choice: que tu ne prennes pas cela à cœur
  rationale: Cette locution française naturelle rend l’idiome hébreu, littéralement « mettre sur ton cœur ». Le démonstratif reprend de façon non spécifiée ce que la destinataire aurait dû considérer sérieusement.
- source_word: מַחְשֶׁה
  choice: j’ai gardé le silence
  rationale: Le verbe חשה signifie rester ou garder le silence. Le passé composé convient à un silence commencé auparavant et pertinent dans la situation présente.
- source_word: וּמֵעוֹלָם
  choice: et cela depuis longtemps
  rationale: Dans ce contexte, עוֹלָם indique une longue durée passée plutôt que l’éternité abstraite.
- source_word: וְאוֹתִי לֹא תִירָאִי
  choice: que tu ne me crains pas
  rationale: Le présent rend naturellement la portée résultative ou habituelle de l’imparfait hébreu.
theological_decisions:
- issue: Sens du silence de Dieu
  choice: Le silence prolongé de Dieu est présenté comme l’occasion dont la destinataire tire à tort l’absence de crainte.
  alternative: Comprendre ce silence comme une indifférence divine ou une dissimulation absolue.
  rationale: Le verset relie directement le manque de crainte au silence ancien de Dieu, mais n’affirme ni son approbation ni son indifférence. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement féminin singulier du texte hébreu est conservé dans les formes verbales sans ajout explicatif. La structure rhétorique en deux questions ainsi que le double vocabulaire de la peur sont maintenus.
