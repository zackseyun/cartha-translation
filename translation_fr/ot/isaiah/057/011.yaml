revisions:
- from: Et qui donc redoutais-tu et craignais-tu, pour que tu mentes, que tu ne te souviennes pas de moi et que tu ne prennes pas cela à cœur[a] ? N’est-ce pas parce que j’ai gardé le silence, et cela depuis longtemps[b], que tu ne me crains pas ?
  to: Qui donc as-tu redouté et craint, au point de mentir, de ne pas te souvenir de moi et de ne pas prendre cela à cœur[a] ? N’est-ce pas parce que, depuis longtemps[b], je garde le silence que tu ne me crains pas ?
  rationale: La révision conserve le doublet de crainte, la conséquence introduite par כִּי, l’objet implicite de l’idiome « mettre sur le cœur » et la portée prolongée de « depuis longtemps ». Elle améliore la syntaxe française sans résoudre davantage l’ambiguïté contextuelle ou théologique du verset.
