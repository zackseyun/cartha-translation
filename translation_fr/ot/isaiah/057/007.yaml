source:
  edition: WLC
  text: עַ֤ל הַר גָּבֹ֨הַּ֙ וְ/נִשָּׂ֔א שַׂ֖מְתְּ מִשְׁכָּבֵ֑/ךְ גַּם שָׁ֥ם עָלִ֖ית לִ/זְבֹּ֥חַ זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/007.yaml
  text: On a high and lofty mountain you set your bed[b][a]; there too you went up to sacrifice a sacrifice.
translation:
  language: fr
  text: Sur une montagne haute et élevée, tu as installé ton lit[a] ; là aussi[b], tu es montée pour offrir un sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « ton lit » évoque probablement, par une image sexuelle, le culte idolâtre.
    reason: cultural_note
  - marker: b
    text: 'Ou : « même là ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַר
  choice: Sur une montagne
  rationale: La préposition est locative et הַר désigne normalement une montagne ; cette formulation est naturelle en français.
- source_word: גָּבֹהַּ וְנִשָּׂא
  choice: haute et élevée
  rationale: Les deux adjectifs renforcent l’idée d’altitude. Leur coordination est conservée sans introduire ici la nuance théologique possible d’« exaltée ».
- source_word: שַׂמְתְּ
  choice: tu as installé
  rationale: Le qal accompli à la 2e personne du féminin singulier signifie « mettre, placer ». Avec « lit », « installer » donne une expression française naturelle tout en gardant l’acte délibéré.
- source_word: מִשְׁכָּבֵךְ
  choice: ton lit
  rationale: Le nom désigne un lit ou un lieu où l’on se couche et conserve ici l’image concrète ainsi que ses connotations sexuelles et idolâtres.
- source_word: גַּם שָׁם
  choice: là aussi
  rationale: Cette traduction préserve la valeur additive de גַּם ; « même là » demeure une possibilité selon la portée emphatique.
- source_word: עָלִית
  choice: tu es montée
  rationale: Le verbe exprime la montée et sa forme s’adresse au féminin singulier, distinction que le français permet de manifester.
- source_word: לִזְבֹּחַ זָבַח
  choice: pour offrir un sacrifice
  rationale: L’infinitif suivi du nom apparenté exprime explicitement l’acte sacrificiel. Le français naturel évite la répétition lourde « sacrifier un sacrifice » tout en conservant l’objet.
theological_decisions:
- issue: Portée métaphorique de « lit » dans un contexte d’idolâtrie et d’adultère spirituel
  choice: Conserver l’image concrète « ton lit » dans le texte principal.
  alternative: ton lieu de culte impur
  rationale: L’hébreu laisse l’image porter l’accusation. Une explicitation dans le corps du texte réduirait la tension métaphorique et transformerait l’interprétation en traduction.
- issue: Valeur cultuelle de זבח
  choice: Employer « offrir un sacrifice ».
  alternative: sacrifier un sacrifice
  rationale: « Offrir un sacrifice » garde le sens cultuel et l’objet explicite dans un français digne et courant, sans reproduire mécaniquement la construction apparentée de l’hébreu.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le féminin singulier de l’interpellation est rendu par « montée ». Les marqueurs suivent immédiatement les expressions qu’ils éclairent.
