source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר רָ֣ם וְ/נִשָּׂ֗א שֹׁכֵ֥ן עַד֙ וְ/קָד֣וֹשׁ שְׁמ֔/וֹ מָר֥וֹם וְ/קָד֖וֹשׁ אֶשְׁכּ֑וֹן וְ/אֶת דַּכָּא֙ וּ/שְׁפַל ר֔וּחַ לְ/הַחֲיוֹת֙ ר֣וּחַ שְׁפָלִ֔ים וּֽ/לְ/הַחֲי֖וֹת לֵ֥ב נִדְכָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
translation:
  language: fr
  text: 'Car ainsi parle celui qui est haut et élevé,

    qui habite l’éternité[a]

    et dont le nom est Saint :


    « J’habite dans un lieu élevé et saint,

    et aussi avec celui qui est écrasé et humble d’esprit[b],

    afin de ranimer l’esprit des humbles

    et de ranimer le cœur de ceux qui sont écrasés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui demeure pour toujours ». L’expression hébraïque peut évoquer soit le fait d’habiter l’éternité, soit une demeure qui dure éternellement.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « avec celui qui est contrit et humble d’esprit » ; puis « le cœur de ceux qui sont contrits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  choice: haut et élevé
  rationale: Cette expression conserve le parallélisme et l’image verticale de l’hébreu, caractéristiques du langage d’Ésaïe, sans ajouter une interprétation.
- source_word: שֹׁכֵן עַד
  choice: qui habite l’éternité[a]
  rationale: Cette formulation poétique maintient le lien lexical avec « J’habite » et rend la portée élevée de עַד, tout en signalant en note l’interprétation temporelle également possible.
- source_word: קָדוֹשׁ שְׁמוֹ
  choice: dont le nom est Saint
  rationale: Rend naturellement la proposition nominale hébraïque et conserve la valeur prédicative de « Saint ».
- source_word: מָרוֹם וְקָדוֹשׁ אֶשְׁכּוֹן
  choice: J’habite dans un lieu élevé et saint
  rationale: Le mot « lieu » est explicité pour produire un français naturel, tandis que « J’habite » préserve la reprise du verbe שכן.
- source_word: דַּכָּא
  choice: la personne écrasée
  rationale: « Écrasée » restitue directement l’image lexicale de ce qui est broyé ou brisé. « La personne » permet d’exprimer naturellement en français l’adjectif substantivé singulier.
- source_word: שְׁפַל רוּחַ
  choice: humble d’esprit
  rationale: Cette expression conserve la référence à l’esprit et traduit l’abaissement intérieur sans lourdeur.
- source_word: לְהַחֲיוֹת
  choice: ranimer
  rationale: Le hiphil de חיה signifie faire vivre ou rendre à la vie. « Ranimer » convient ici à la restauration intérieure sans imposer l’idée plus précise de résurrection.
- source_word: רוּחַ שְׁפָלִים
  choice: l’esprit des humbles
  rationale: Conserve le terme anthropologique « esprit » et rend naturellement l’adjectif pluriel substantivé.
- source_word: לֵב נִדְכָּאִים
  choice: le cœur de ceux qui sont écrasés
  rationale: Maintient « cœur » et traduit le participe apparenté à דַּכָּא de manière cohérente, sans réduire le sens à la seule contrition religieuse.
theological_decisions:
- issue: La transcendance et la proximité divines réunies dans le même verset
  choice: Présenter à la fois l’habitation élevée et sainte de Dieu et sa présence réelle auprès de la personne écrasée et humble.
  alternative: Atténuer l’un des deux aspects ou comprendre la présence auprès des écrasés comme une simple image.
  rationale: Le texte hébreu juxtapose explicitement ces deux réalités. La traduction conserve cette tension sans chercher à l’expliquer ni à la résoudre.
- issue: Sens de דַּכָּא et נִדְכָּאִים
  choice: Employer « écrasé(s) » dans le texte principal.
  alternative: Employer « contrit(s) » ou « brisé(s) ».
  rationale: La racine évoque directement le fait d’être écrasé ou broyé. « Contrit » mettrait au premier plan le repentir, nuance possible dans certains contextes mais plus étroite que le sens lexical ici.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition de « J’habite / habite » et de « ranimer » reproduit les échos structurants de l’hébreu. « Et aussi » conserve la juxtaposition sans transformer explicitement la coordination en opposition.
