  terminology: « Haut et élevé », « l’éternité », « Saint », « humble d’esprit », « esprit », « cœur » et « ranimer » conviennent. « Écrasé » maintient à bon droit l’image lexicale de דכא / נדכאים sans introduire la nuance interprétative de « contrit ».
