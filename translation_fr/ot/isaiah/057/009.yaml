language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תָּשֻׁ֤רִי לַ/מֶּ֨לֶךְ֙ בַּ/שֶּׁ֔מֶן וַ/תַּרְבִּ֖י רִקֻּחָ֑יִ/ךְ וַ/תְּשַׁלְּחִ֤י צִרַ֨יִ/ךְ֙ עַד מֵ֣/רָחֹ֔ק וַ/תַּשְׁפִּ֖ילִי עַד שְׁאֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
translation:
  language: fr
  text: Tu t’es rendue auprès du roi avec de l’huile[a], et tu as multiplié tes parfums. Tu as envoyé tes émissaires au loin et tu t’es abaissée jusqu’au séjour des morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « auprès de Molek », si « le roi » est ici un titre faisant allusion à cette divinité.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  choice: tu t’es rendue
  rationale: Le verbe est difficile, mais le contexte d’une démarche auprès du roi favorise l’idée d’aller ou de se présenter. « Tu t’es rendue » reste naturel et laisse ouvertes les nuances diplomatiques, séductrices ou cultuelles.
- source_word: לַמֶּלֶךְ
  choice: auprès du roi
  rationale: Le texte consonantique et la vocalisation massorétique donnent « le roi ». « Auprès du roi » exprime naturellement la démarche vers lui sans imposer l’identification possible à Molek.
- source_word: בַּשֶּׁמֶן
  choice: avec de l’huile
  rationale: שֶׁמֶן désigne couramment l’huile, ici probablement parfumée ou employée comme présent. Le terme concret est conservé.
- source_word: וַתַּרְבִּי רִקֻּחָיִךְ
  choice: tu as multiplié tes parfums
  rationale: La formulation rend l’abondance des préparations aromatiques composées et conserve l’intensité du verbe רבה.
- source_word: צִרַיִךְ
  choice: tes émissaires
  rationale: Le mot désigne vraisemblablement des messagers ou envoyés. « Émissaires » convient à la possible dimension diplomatique du passage.
- source_word: עַד מֵרָחֹק
  choice: au loin
  rationale: Expression française concise et naturelle pour une destination très éloignée.
- source_word: וַתַּשְׁפִּילִי
  choice: tu t’es abaissée
  rationale: Le verbe signifie faire descendre ou abaisser. La tournure pronominale transmet ici l’avilissement volontaire sans expliciter davantage que l’hébreu son jugement moral.
- source_word: עַד שְׁאוֹל
  choice: jusqu’au séjour des morts
  rationale: שְׁאוֹל désigne le domaine des morts. La traduction sémantique est immédiatement compréhensible en français moderne et conserve l’image d’une descente extrême.
theological_decisions:
- issue: Identification possible du « roi » à Molek
  choice: Conserver « le roi » dans le texte principal
  alternative: « Molek » ou une allusion à cette divinité
  rationale: Le texte massorétique porte « le roi » et peut évoquer une démarche politique ou une infidélité idolâtre. L’allusion possible à Molek est signalée sans être imposée.
- issue: Sens de la descente jusqu’au shéol
  choice: Traduire par « jusqu’au séjour des morts »
  alternative: Translittérer « jusqu’au Shéol »
  rationale: L’expression peut être comprise comme une image d’abaissement extrême plutôt que comme l’affirmation d’un déplacement littéral. La traduction garde cette tension sans la résoudre.
translation_notes:
  register: Français moderne, digne et direct. Le féminin singulier de l’hébreu est conservé. La ponctuation en deux phrases facilite la lecture tout en maintenant la progression de l’accusation prophétique.
