source:
  edition: WLC
  text: עַל מִי֙ תִּתְעַנָּ֔גוּ עַל מִ֛י תַּרְחִ֥יבוּ פֶ֖ה תַּאֲרִ֣יכוּ לָשׁ֑וֹן הֲ/לֽוֹא אַתֶּ֥ם יִלְדֵי פֶ֖שַׁע זֶ֥רַע שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
translation:
  language: fr
  text: De qui vous moquez-vous[a] ? Contre qui ouvrez-vous grand la bouche et tirez-vous la langue[b] ? N’êtes-vous pas des enfants de la révolte, une descendance du mensonge[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « De qui faites-vous vos délices ? » Dans ce contexte, l’expression évoque probablement le plaisir pris à railler quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous allongez votre langue » ; il s’agit d’un geste de moquerie.'
    reason: lexical_alternative
  - marker: c
    text: Les expressions « enfants de la révolte » et « descendance du mensonge » emploient l’image de la filiation pour désigner des personnes caractérisées par la rébellion et le mensonge.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנָּגוּ
  choice: vous moquez-vous
  rationale: Le hitpael de ענג signifie littéralement prendre plaisir ou se délecter. Dans ce contexte, les gestes de dérision qui suivent indiquent un plaisir moqueur; « vous moquez-vous » exprime naturellement cette valeur sans effacer l’ambiguïté, signalée en note.
- source_word: תַּרְחִיבוּ פֶה
  choice: ouvrez-vous grand la bouche
  rationale: Cette formulation française conserve l’image hébraïque d’une bouche largement ouverte, ici associée à une attitude insolente et méprisante.
- source_word: תַּאֲרִיכוּ לָשׁוֹן
  choice: tirez-vous la langue
  rationale: Littéralement, le texte dit « allongez-vous la langue ». L’expression française « tirer la langue » restitue clairement le geste concret de moquerie.
- source_word: הֲלוֹא
  choice: N’êtes-vous pas
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative; cette tournure en est l’équivalent direct et naturel.
- source_word: יִלְדֵי פֶשַׁע
  choice: des enfants de la révolte
  rationale: « Enfants de » préserve la métaphore familiale. « Révolte » rend פשע comme rupture et rébellion coupable, avec une force plus précise ici que le terme français plus abstrait « transgression ».
- source_word: זֶרַע שָׁקֶר
  choice: une descendance du mensonge
  rationale: « Descendance » conserve l’image de זרע, tandis que « mensonge » rend directement שׁקר et maintient le parallélisme moral avec « enfants de la révolte ».
theological_decisions:
- issue: Langage de filiation morale dans l’accusation prophétique
  choice: Conserver les images « enfants de la révolte » et « descendance du mensonge », en précisant leur portée métaphorique.
  alternative: Reformuler explicitement par « gens rebelles et menteurs », ou comprendre ces expressions comme une affirmation de filiation biologique.
  rationale: Les constructions hébraïques de filiation peuvent caractériser la conduite ou l’identité morale. Garder l’image préserve la force prophétique sans transformer le texte en affirmation ethnique, biologique ou métaphysique.
translation_notes:
  register: Français international moderne, direct et digne. Les questions rhétoriques et les images corporelles de la raillerie sont conservées; les tournures trop littérales qui seraient obscures en français sont expliquées en notes.
