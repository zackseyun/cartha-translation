review_pass:
  verdict: approve
  source_fidelity: Le texte rend avec fidélité l’interpellation contrastive (« Mais vous »), l’impératif pluriel (« venez ici »), ainsi que la double désignation généalogique injurieuse. « Fils », « descendance », « devineresse », « homme adultère » et « prostituée » correspondent de manière adéquate aux termes hébreux, sans transformer l’image prophétique en affirmation explicative dans le corps du verset.
  naturalness: Le français est moderne, direct et solennel. « Mais vous, venez ici » est idiomatique dans ce contexte de sommation, et la répétition de « fils » puis « descendance » conserve utilement le parallélisme expressif hébreu.
  terminology: « Devineresse » est un équivalent compréhensible et suffisamment précis pour עֹנְנָה; la note fournit à juste titre une formulation plus explicite. Le vocabulaire accusateur (« adultère », « prostituée ») conserve le registre prophétique sans archaïsme inutile. La note b préserve correctement la possibilité d’une dénonciation métaphorique de l’idolâtrie et de l’infidélité.
