id: ISA.57.3
reference: Isaiah 57:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּ֥ם קִרְבוּ הֵ֖נָּה בְּנֵ֣י עֹנְנָ֑ה זֶ֥רַע מְנָאֵ֖ף וַ/תִּזְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/003.yaml
  text: But you—come here[a], sons of a sorceress[b], offspring of an adulterer and a prostitute.
translation:
  language: fr
  text: Mais vous, venez ici, fils d’une devineresse[a], descendance d’un homme adultère et d’une prostituée[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une femme qui pratique la divination ». Le terme hébreu désigne une pratique divinatoire interdite.
    reason: lexical_alternative
  - marker: b
    text: Cette filiation peut être une image prophétique de l’idolâtrie et de l’infidélité envers Dieu, et non nécessairement une affirmation littérale sur l’ascendance des destinataires.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mais vous
  rationale: La conjonction suivie du pronom indépendant marque ici un contraste appuyé avec le contexte précédent ; « Mais vous » le rend naturellement.
- source_word: קִרְבוּ הֵנָּה
  choice: venez ici
  rationale: L’impératif pluriel de קרב accompagné de l’adverbe déictique הֵנָּה constitue une sommation directe. « Venez ici » est plus naturel en français courant que « approchez ici ».
- source_word: בְּנֵי
  choice: fils de
  rationale: Le texte porte explicitement le masculin pluriel construit. « Fils de » conserve cette forme ainsi que l’idée d’appartenance ou de caractérisation.
- source_word: עֹנְנָה
  choice: une devineresse
  rationale: Cette forme féminine liée à ענן désigne une femme qui se livre à une pratique divinatoire interdite. « Devineresse » est concis et intelligible, sans élargir indûment le sens à toute forme de magie.
- source_word: זֶרַע
  choice: descendance de
  rationale: Dans cette dénonciation formulée en termes de filiation, « descendance » rend naturellement זֶרַע sans le littéralisme peu idiomatique de « semence ».
- source_word: מְנָאֵף
  choice: un homme adultère
  rationale: Le participe est masculin singulier et désigne celui qui commet l’adultère. Cette formulation explicite le genre du référent en français naturel.
- source_word: וַ/תִּזְנֶה
  choice: et d’une prostituée
  rationale: La forme féminine singulière de זנה décrit une femme qui se prostitue. La nominalisation française s’intègre naturellement à la formule généalogique et conserve la force de la dénonciation.
theological_decisions:
- issue: Nature de la filiation dénoncée
  choice: Conserver sans l’expliquer dans le corps du texte l’image d’une descendance issue de figures associées à la divination et à l’infidélité sexuelle.
  alternative: Comprendre l’énoncé comme une affirmation littérale concernant les parents biologiques des destinataires.
  rationale: Le contexte prophétique emploie un langage familial et sexuel fortement accusateur pour dénoncer l’idolâtrie et l’infidélité à l’alliance. Une note signale cette portée métaphorique possible sans exclure dogmatiquement une lecture littérale.
translation_notes:
  register: Français international moderne, direct et solennel. La vigueur de l’interpellation et des images accusatrices est conservée sans recourir à un vocabulaire archaïque ni atténuer la distinction de genre présente dans l’hébreu.
