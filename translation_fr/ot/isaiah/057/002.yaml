  yaml_path: translation/ot/isaiah/057/002.yaml
  text: He enters into peace[a]; they rest on their beds[c][b], each one who walks in his uprightness.
translation:
  language: fr
  text: Il entre dans la paix[a] ; ils reposent sur leurs couches[b], chacun marchant droit devant lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il vient dans la paix. » Le verbe hébreu permet les deux traductions dans ce contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu passe du singulier au pluriel : « Il entre… ils reposent… », puis emploie un participe singulier, rendu ici de façon distributive par « chacun ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « avec droiture » ou « dans sa droiture ». L’expression hébraïque est concise et son suffixe singulier peut se comprendre de plusieurs manières.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבוֹא
  choice: entre
  rationale: Le qal inaccompli 3ms de בוא peut signifier « venir » ou « entrer ». Dans ce contexte poétique, « entre dans la paix » exprime naturellement le passage du juste à un état de paix, sans exclure l’autre nuance.
- source_word: שָׁלוֹם
  choice: paix
  rationale: שָׁלוֹם englobe la paix, le bien-être et la plénitude. « Paix » est ici le terme français le plus direct et le plus évocateur.
- source_word: יָנוּחוּ
  choice: ils reposent
  rationale: Le qal inaccompli 3mp de נוח décrit le repos. « Ils reposent » conserve le pluriel hébreu et l’image sobre du repos dans la mort.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: sur leurs couches
  rationale: L’expression désigne littéralement leurs lieux où ils sont couchés. « Couches » garde la métaphore poétique et convient mieux que « lits » au contexte funéraire implicite, sans l’expliciter.
- source_word: הֹלֵךְ
  choice: ceux qui marchent
  rationale: Le participe qal masculin singulier de הלך décrit une conduite caractéristique. La formulation distributive française rend le sens collectif tout en restant proche de l’image biblique de la marche.
- source_word: נְכֹחוֹ
  choice: dans la droiture
  rationale: Le terme évoque ce qui est droit ou direct. La construction suffixée est concise et ambiguë ; « dans la droiture » exprime le sens éthique probable sans préciser abusivement le référent du suffixe.
theological_decisions:
- issue: Alternance du singulier et du pluriel
  choice: Conserver « Il entre » puis « ils reposent », et rendre la dernière expression de manière distributive par « tous ceux qui marchent »
  alternative: Uniformiser tout le verset au singulier ou tout au pluriel
  rationale: L’hébreu passe du singulier au pluriel, puis revient à un participe singulier. La traduction conserve cette tension de nombre autant que le permet un français naturel, sans la résoudre silencieusement.
- issue: Portée de l’image de la mort
  choice: Maintenir les images de paix et de repos sur des couches
  alternative: Préciser qu’il s’agit soit de la tombe, soit d’un repos céleste
  rationale: Le texte évoque la mort du juste sans définir explicitement son état métaphysique. Il convient de préserver sa consolation et son ambiguïté plutôt que d’y importer une doctrine plus détaillée.
- issue: Sens de נְכֹחוֹ
  choice: « dans la droiture »
  alternative: « droit devant lui » ou « avec droiture »
  rationale: La tournure hébraïque peut décrire soit une conduite droite, soit une marche droite devant quelqu’un. Le corps du texte retient le sens éthique contextuellement probable, tandis que la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, digne et poétique. « Couches » préserve l’image du texte sans expliciter la tombe. L’alternance singulier-pluriel est volontairement maintenue ; la formulation finale est distributive pour rester intelligible en français.
