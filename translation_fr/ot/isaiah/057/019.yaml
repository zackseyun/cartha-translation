  text: בּוֹרֵ֖א נוב שְׂפָתָ֑יִם שָׁל֨וֹם שָׁל֜וֹם לָ/רָח֧וֹק וְ/לַ/קָּר֛וֹב אָמַ֥ר יְהוָ֖ה וּ/רְפָאתִֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
translation:
  language: fr
  text: '« Je crée le fruit des lèvres[a] : Paix, paix[b] à celui qui est loin et à celui qui est près[c] ! — dit Yahvé —, et je le guérirai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que produisent les lèvres » ; l’expression désigne ce que les lèvres produisent, probablement des paroles de louange ou de confession.
    reason: lexical_alternative
  - marker: b
    text: La répétition « Paix, paix » reproduit l’insistance de l’hébreu.
    reason: lexical_alternative
  - marker: c
    text: « Celui qui est loin » et « celui qui est près » peuvent désigner, dans le contexte immédiat, les membres dispersés et les membres proches du peuple de Dieu ; des textes bibliques ultérieurs reprennent cette expression dans un sens plus large.
    reason: cross_reference
lexical_decisions:
- source_word: בּוֹרֵא
  choice: Je crée
  rationale: Le participe qal poursuit la parole divine. En français, une forme personnelle rend naturellement le sujet implicite tout en conservant l’action créatrice attribuée à Yahvé.
- source_word: נוב שְׂפָתָיִם
  choice: le fruit des lèvres
  rationale: Cette traduction garde l’image hébraïque de ce que les lèvres produisent, sans la réduire explicitement à la louange ou à la confession.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Paix, paix
  rationale: La répétition hébraïque est conservée pour son effet d’insistance, et « paix » maintient l’étendue sémantique de שָׁלוֹם.
- source_word: לָרָחוֹק וְלַקָּרוֹב
  choice: à celui qui est loin et à celui qui est près
  rationale: Les adjectifs substantivés au singulier désignent les destinataires de la paix. La formulation française demeure naturelle sans préciser leur identité.
- source_word: אָמַר יְהוָה
  choice: dit Yahvé
  rationale: Le présent français convient à la formule prophétique de déclaration, tandis que « Yahvé » rend le nom divin plutôt qu’un titre de substitution.
- source_word: וּרְפָאתִיו
  choice: et je le guérirai
  rationale: Le futur exprime ici la promesse qui découle de l’annonce de paix. « Guérir » préserve les résonances concrètes et restauratrices du verbe רפא.
theological_decisions:
- issue: Identité de « celui qui est loin » et de « celui qui est près »
  choice: La désignation générale est conservée sans identifier explicitement ces personnes.
  alternative: Les comprendre exclusivement comme les membres dispersés et ceux restés proches du peuple d’Israël, ou y voir déjà les non-Juifs et les Juifs.
  rationale: Le contexte immédiat évoque la restauration du peuple de Dieu, mais le texte hébreu ne définit pas expressément les deux groupes. La traduction maintient cette ouverture.
- issue: Sens du « fruit des lèvres »
  choice: L’image hébraïque est conservée dans le texte principal.
  alternative: Traduire directement par « louange » ou « confession ».
  rationale: Ces interprétations sont possibles, mais elles précisent davantage que l’expression source et supprimeraient son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La structure concise de l’hébreu est préservée autant que le permet la syntaxe française ; les images et répétitions significatives restent visibles.
