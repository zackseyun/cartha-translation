source:
  edition: WLC
  text: בְּ/זַֽעֲקֵ/ךְ֙ יַצִּילֻ֣/ךְ קִבּוּצַ֔יִ/ךְ וְ/אֶת כֻּלָּ֥/ם יִשָּׂא ר֖וּחַ יִקַּח הָ֑בֶל וְ/הַ/חוֹסֶ֥ה בִ/י֙ יִנְחַל אֶ֔רֶץ וְ/יִירַ֖שׁ הַר קָדְשִֽׁ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
translation:
  language: fr
  text: Quand tu crieras, que ceux que tu as rassemblés[a] te délivrent ! Mais le vent les emportera tous ; un souffle les enlèvera[b]. Celui qui trouve refuge en moi héritera du pays[c] et prendra possession de ma montagne sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tes rassemblements » ou « ceux que tu as rassemblés » ; il peut s’agir d’idoles, d’alliés ou d’autres objets de confiance.
    reason: lexical_alternative
  - marker: b
    text: Les mots hébreux traduits par « vent » et « souffle » forment un parallèle poétique qui souligne avec quelle facilité ces faux appuis disparaissent.
    reason: cultural_note
  - marker: c
    text: Ou « de la terre ». Le mot hébreu peut désigner le pays ou la terre ; le contexte de la montagne sainte favorise ici « pays ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  choice: Quand tu crieras
  rationale: Le ב préfixé donne ici naturellement une valeur temporelle. Le futur français convient à cette mise au défi prophétique.
- source_word: יַצִּילֻךְ
  choice: que ... viennent te délivrer !
  rationale: L’imparfait hébreu prend dans le contexte la force ironique d’un défi, mieux rendue par une tournure jussive que par une simple prédiction.
- source_word: קִבּוּצַיִךְ
  choice: ceux que tu as rassemblés
  rationale: Le terme désigne littéralement ce qui a été rassemblé. Cette formulation conserve l’indétermination du référent — idoles, alliés ou autres appuis — plutôt que d’insérer « idoles » dans le texte.
- source_word: יִשָּׂא רוּחַ
  choice: le vent les emportera
  rationale: רוּחַ signifie ici « vent », en parallèle avec הָבֶל. « Emporter » exprime naturellement l’action de נשׂא dans cette image.
- source_word: יִקַּח הָבֶל
  choice: un souffle les enlèvera
  rationale: Dans le parallélisme avec « vent », הָבֶל évoque un souffle ou une vapeur et souligne la fragilité des faux appuis.
- source_word: וְהַחוֹסֶה בִי
  choice: Celui qui trouve refuge en moi
  rationale: Le participe exprime une attitude durable de confiance. La formulation est actuelle, digne et garde le singulier représentatif.
- source_word: יִנְחַל אֶרֶץ
  choice: héritera du pays
  rationale: נחל porte l’idée de recevoir en héritage. Dans le contexte de Sion et de la montagne sainte, אֶרֶץ désigne vraisemblablement le pays, tout en pouvant aussi signifier la terre.
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  choice: prendra possession de ma montagne sainte
  rationale: ירשׁ signifie hériter ou prendre possession. Cette formulation évite de répéter « hériter » tout en conservant l’idée de possession.
theological_decisions:
- issue: Référent de קִבּוּצַיִךְ
  choice: ceux que tu as rassemblés, avec référent laissé implicite
  alternative: tes idoles rassemblées ; tes alliés ; tes autres objets de confiance
  rationale: Le contexte vise probablement les idoles ou, plus largement, les faux appuis. Toutefois, le mot hébreu ne nomme pas explicitement les idoles ; le texte principal préserve donc cette ambiguïté réelle et la note en indique les principales possibilités.
- issue: Sens de אֶרֶץ
  choice: le pays
  alternative: la terre
  rationale: La mention immédiate de la montagne sainte et le cadre de Sion favorisent le sens territorial. Une note conserve néanmoins la portée lexicale plus large possible.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le tutoiement singulier reflète les formes féminines singulières adressées à la collectivité. Le mouvement antithétique entre les faux refuges et le refuge en Dieu est conservé, ainsi que le parallélisme « vent / souffle ».
