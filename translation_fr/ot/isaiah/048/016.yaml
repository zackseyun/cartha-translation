source:
  edition: WLC
  text: קִרְב֧וּ אֵלַ֣/י שִׁמְעוּ זֹ֗את לֹ֤א מֵ/רֹאשׁ֙ בַּ/סֵּ֣תֶר דִּבַּ֔רְתִּי מֵ/עֵ֥ת הֱיוֹתָ֖/הּ שָׁ֣ם אָ֑נִי וְ/עַתָּ֗ה אֲדֹנָ֧/י יְהוִ֛ה שְׁלָחַ֖/נִי וְ/רוּחֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
translation:
  language: fr
  text: '« Approchez-vous de moi ; écoutez ceci : dès le commencement, je n’ai pas parlé en secret. Depuis que cela existe[a], j’y suis. Et maintenant, le Seigneur Yahweh m’a envoyé[b], et son Esprit[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « depuis le moment où cela s’est produit » ou « depuis le moment où cela a existé ». L’hébreu dit littéralement : « depuis le temps de son être ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu n’identifie pas explicitement le locuteur. Des lecteurs chrétiens ont souvent compris qu’il s’agissait du Serviteur ou du Messie, mais le texte lui-même laisse son identité implicite.
    reason: alternative_reading
  - marker: c
    text: Ou « et son esprit ». La formule hébraïque peut présenter l’Esprit comme un sujet associé à l’envoi, ou être comprise de façon moins spécifique ; sa construction précise reste ambiguë.
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ
  choice: Approchez-vous de moi
  rationale: L’impératif pluriel de קרב appelle directement les auditeurs à s’approcher. Cette formulation est naturelle en français et conserve la force de l’invitation.
- source_word: שִׁמְעוּ זֹאת
  choice: écoutez ceci
  rationale: L’impératif suivi du démonstratif est rendu par une formule française directe et courante.
- source_word: לֹא מֵרֹאשׁ בַּסֵּתֶר דִּבַּרְתִּי
  choice: dès le commencement, je n’ai pas parlé en secret
  rationale: מֵרֹאשׁ désigne le commencement ou le point de départ, tandis que בַּסֵּתֶר exprime la dissimulation. Le passé composé relie naturellement la parole passée à la déclaration présente.
- source_word: מֵעֵת הֱיוֹתָהּ
  choice: Depuis le moment où cela est venu à l’existence
  rationale: La formulation conserve le sens littéral de « depuis le temps de son être » sans préciser abusivement si le suffixe renvoie à une chose, une parole ou un événement.
- source_word: שָׁם אָנִי
  choice: j’étais là
  rationale: La proposition nominale signifie littéralement « là, moi ». L’imparfait exprime clairement en français la présence du locuteur au moment évoqué, tout en respectant le contexte rétrospectif.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: אֲדֹנָי est rendu comme un titre et יהוה comme le nom divin Yahweh, ce qui évite de confondre les deux éléments du syntagme.
- source_word: שְׁלָחַנִי
  choice: m’a envoyé
  rationale: Le parfait avec suffixe de première personne est naturellement rendu au passé composé, qui convient à une mission reçue et toujours pertinente.
- source_word: וְרוּחוֹ
  choice: et son Esprit
  rationale: La conjonction est conservée sans paraphrase. « Esprit » convient au contexte d’envoi, mais la construction syntaxique et le sens plus général de רוּחַ demeurent signalés en note.
theological_decisions:
- issue: Identité du locuteur
  choice: Ne pas identifier explicitement le « moi » dans le corps du texte.
  alternative: Nommer le Serviteur ou le Messie comme locuteur.
  rationale: L’hébreu passe à la première personne sans désigner expressément celui qui parle. La traduction préserve cette indétermination, malgré les lectures messianiques traditionnelles.
- issue: Fonction de וְרוּחוֹ dans la proposition finale
  choice: Conserver la formulation coordonnée « et son Esprit ».
  alternative: Traduire explicitement « avec son Esprit », « et son esprit » ou comprendre le Seigneur et son Esprit comme sujets conjoints de l’envoi.
  rationale: La syntaxe hébraïque est concise et permet plusieurs analyses. Une coordination directe préserve mieux cette tension qu’une reformulation explicative.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU ou le Seigneur YHWH
  rationale: Ce rendu distingue le titre אֲדֹנָי du nom personnel יהוה et conserve le nom divin sans produire l’expression maladroite « le Seigneur, le SEIGNEUR ».
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation suit les mouvements du discours prophétique. Les termes théologiquement chargés ne sont pas développés au-delà de ce que permet l’hébreu, et les ambiguïtés concernant le locuteur et l’Esprit sont conservées.
