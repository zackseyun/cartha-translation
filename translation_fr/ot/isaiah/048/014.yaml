source:
  edition: WLC
  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
translation:
  language: fr
  text: 'Rassemblez-vous tous et écoutez : qui parmi eux a annoncé ces choses ? Yahweh l’aime. Il accomplira son dessein à Babylone, et son bras agira contre les Chaldéens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Yahweh l’aime. Il accomplira son dessein à Babylone, et son bras agira contre les Chaldéens », les pronoms « il » et « son » désignant alors Yahweh plutôt que l’agent qu’il a choisi.'
    reason: Le texte hébreu permet de rapporter les pronoms soit à l’agent choisi, soit à Yahweh.
lexical_decisions:
- source_word: הִקָּבְצוּ כֻלְּכֶם
  choice: Rassemblez-vous tous
  rationale: L’impératif nifal appelle l’ensemble des destinataires à se réunir. Cette formulation conserve l’exhortation directe et l’insistance de « tous » dans un français naturel.
- source_word: וּשֲׁמָעוּ
  choice: et écoutez
  rationale: « Écoutez » exprime ici une attention volontaire, plus naturellement que le simple « entendez » en français contemporain.
- source_word: מִי בָהֶם הִגִּיד אֶת־אֵלֶּה
  choice: qui parmi eux a annoncé ces choses ?
  rationale: La question rhétorique demande lequel du groupe évoqué a préalablement fait connaître ces événements. « Annoncé » rend le hiphil de נגד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֲהֵבוֹ
  choice: l’aime
  rationale: Le suffixe masculin singulier est conservé sans nommer l’agent. Le présent français exprime naturellement la faveur établie indiquée par le parfait hébreu.
- source_word: יַעֲשֶׂה חֶפְצוֹ
  choice: Il accomplira son dessein
  rationale: L’expression désigne la réalisation effective d’une volonté ou d’un projet. « Dessein » garde la portée intentionnelle sans employer l’expression vieillie « bon plaisir ».
- source_word: בְּבָבֶל
  choice: à Babylone
  rationale: La préposition בְּ est rendue selon son sens local ordinaire. Le contexte implique une action touchant Babylone sans qu’il soit nécessaire de transformer explicitement la préposition en « contre ».
- source_word: וּזְרֹעוֹ כַּשְׂדִּים
  choice: et son bras agira contre les Chaldéens
  rationale: « Bras » conserve la métaphore hébraïque de la puissance. La proposition nominale elliptique reçoit le verbe sobre « agira » et la relation hostile suggérée par le contexte est explicitée par « contre ».
theological_decisions:
- issue: Référent des pronoms masculins singuliers après « Yahweh l’aime »
  choice: Le sujet de « Il accomplira » et le possesseur de « son bras » sont compris comme l’agent humain aimé et appelé par Yahweh, sans le nommer dans le verset.
  alternative: Yahweh peut être compris comme le sujet de « accomplira » et comme le possesseur du bras.
  rationale: Le contexte immédiat distingue vraisemblablement Yahweh de l’agent qu’il aime et appelle à agir contre Babylone. Cependant, la succession des pronoms hébreux permet aussi de rapporter les derniers à Yahweh ; la note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation sépare clairement l’appel, la question rhétorique et l’annonce. La métaphore du « bras » est maintenue, tandis que l’ellipse hébraïque est légèrement explicitée pour être intelligible.
