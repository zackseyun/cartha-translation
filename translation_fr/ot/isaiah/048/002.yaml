  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
translation:
  language: fr
  text: Car ils portent le nom de la Ville sainte[a] et s’appuient sur le Dieu d’Israël ; Yahvé des armées est son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi évoquer leur origine dans la Ville sainte : « ils sont appelés depuis la Ville sainte ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif explicatif qui prolonge l’accusation du contexte précédent.
- source_word: מֵעִיר הַקֹּדֶשׁ נִקְרָאוּ
  choice: ils portent le nom de la Ville sainte
  rationale: Rend naturellement en français le passif de קרא associé à מִן, avec l’idée d’une identité ou d’une désignation tirée de la ville. L’ambiguïté possible avec l’origine géographique est conservée en note.
- source_word: וְעַל אֱלֹהֵי יִשְׂרָאֵל נִסְמָכוּ
  choice: et s’appuient sur le Dieu d’Israël
  rationale: « S’appuyer sur » conserve la métaphore de סמך et laisse percevoir la tension ironique du contexte entre leur profession de confiance et leur conduite.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת par l’expression française claire et traditionnelle « des armées », sans limiter explicitement celles-ci aux seules armées terrestres ou célestes.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: Reproduit sobrement la formule hébraïque de désignation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahvé » préserve ici le nom propre plutôt que de lui substituer un titre.
- issue: Rapport du peuple à la Ville sainte
  choice: ils portent le nom de la Ville sainte
  alternative: ils sont appelés de la Ville sainte / ils viennent de la Ville sainte
  rationale: Le contexte met en avant une identité revendiquée, mais la construction hébraïque peut aussi suggérer l’origine. Le texte principal privilégie une formulation française naturelle liée à la désignation, tandis que la note maintient l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. « Ville sainte » prend une majuscule comme désignation de Jérusalem. La formulation conserve la métaphore de l’appui et l’ambiguïté de la première proposition grâce à la note.
