    issue: La note qualifie « ils sont appelés de la Ville sainte » de formulation « plus littérale » alors que cette tournure est peu naturelle et ambiguë de manière différente en français.
    rationale: La note doit éclairer l’alternative sans créer une formulation artificielle. Elle peut expliquer directement que l’hébreu permet aussi de comprendre une origine dans la Ville sainte.
  - severity: low
    issue: Le texte principal privilégie nettement l’idée de désignation par « portent le nom de », bien que l’hébreu avec מִן demeure discuté.
    rationale: La note conserve l’autre possibilité, mais une note reformulée plus clairement est nécessaire pour préserver utilement l’ambiguïté source.
