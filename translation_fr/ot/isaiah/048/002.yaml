review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement כִּי (« Car »), la métaphore de נִסְמָכוּ (« s’appuient sur »), le titre divin et la formule finale. Toutefois, « portent le nom de la Ville sainte » explicite de façon assez forte la nuance de désignation que la construction מֵעִיר ... נִקְרָאוּ laisse ouverte. Une formulation plus proche du passif hébreu, avec la préposition « de », préserve mieux l’ambiguïté entre appellation liée à la ville et provenance.
  naturalness: « Ils sont appelés de la Ville sainte » est grammaticalement possible mais peu idiomatique en français moderne. « Ils sont appelés d’après la Ville sainte » est naturel et rend bien la relation de dénomination, mais réduirait l’ambiguïté. « Ils se réclament de la Ville sainte » serait idiomatique, mais trop interprétatif. Le texte actuel est naturel; la note doit néanmoins proposer une alternative française véritablement compréhensible et fidèle.
  terminology: « Yahvé des armées » est un rendu établi et approprié de יְהוָה צְבָאוֹת. « Le Dieu d’Israël » et « Ville sainte » conviennent. La majuscule à « Ville » est acceptable si elle fonctionne comme désignation de Jérusalem.
  issues:
