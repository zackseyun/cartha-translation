  - severity: medium
    issue: « sans vérité ni justice » rend צְדָקָה par « justice ».
    rationale: Dans cette formule qui qualifie leur serment et leur invocation, צְדָקָה renvoie plus largement à la droiture ou à la justice morale. « Droiture » conserve mieux cette portée, parallèlement à « vérité », que « justice » peut faire entendre principalement comme une institution ou une décision judiciaire.
