source:
  edition: WLC
  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
translation:
  language: fr
  text: Écoutez ceci, maison de Jacob, vous qui portez le nom d’Israël et qui êtes sortis des eaux de Juda[a], vous qui prêtez serment par le nom de Yahweh et qui invoquez le Dieu d’Israël, mais non avec vérité ni avec droiture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des eaux de Juda » ; l’expression désigne probablement la descendance de Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Écoutez ceci
  rationale: L’impératif pluriel suivi du démonstratif constitue une sommation directe. « Écoutez ceci » est naturel en français et demeure proche de l’hébreu.
- source_word: בֵּית יַעֲקֹב
  choice: maison de Jacob
  rationale: Cette formule prophétique traditionnelle désigne le peuple issu de Jacob. La conserver maintient sa résonance biblique sans rendre le français obscur.
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  choice: vous qui portez le nom d’Israël
  rationale: Littéralement, ils sont « appelés par le nom d’Israël ». « Porter le nom » exprime clairement leur désignation et leur identité revendiquée, sans suggérer un simple appel oral.
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  choice: et qui êtes issus des eaux de Juda
  rationale: La formulation conserve l’image inhabituelle des « eaux de Juda » et rend יָצָאוּ par « êtes issus », qui exprime naturellement la provenance généalogique. La note indique le sens vraisemblable de descendance.
- source_word: הַנִּשְׁבָּעִים בְּשֵׁם יְהוָה
  choice: vous qui prêtez serment par le nom de Yahweh
  rationale: Le participe niphal de שׁבע avec בְּשֵׁם désigne le fait de jurer en prenant le nom divin à témoin. « Prêter serment » est clair et digne en français contemporain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: וּבֵאלֹהֵי יִשְׂרָאֵל יַזְכִּירוּ
  choice: et qui invoquez le Dieu d’Israël
  rationale: 'Dans ce contexte religieux et lié au serment, le hiphil de זכר a une valeur performative : faire appel au nom de Dieu, et non simplement le mentionner.'
- source_word: לֹא בֶאֱמֶת וְלֹא בִצְדָקָה
  choice: mais sans vérité ni justice
  rationale: אֱמֶת peut évoquer la vérité ou la fidélité, et צְדָקָה la justice ou la droiture. La formule française concise conserve les deux notions et le reproche portant sur l’absence d’authenticité morale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Interprétation de מִמֵּי יְהוּדָה
  choice: Conserver « des eaux de Juda » dans le texte et expliquer en note le sens généalogique probable.
  alternative: issus de Juda ; descendants de Juda ; sortis des reins de Juda
  rationale: L’expression hébraïque est singulière et probablement euphémistique ou poétique. La traduction maintient cette image authentique, tandis que la note permet au lecteur d’en comprendre le sens probable sans effacer l’ambiguïté.
- issue: Portée de אֱמֶת et צְדָקָה
  choice: vérité et justice
  alternative: fidélité et droiture ; sincérité et justice
  rationale: Ces noms ont un champ sémantique large. Les équivalents retenus restent proches de la formulation hébraïque et ne réduisent pas le reproche à la seule sincérité subjective.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe vocative et les répétitions de « vous qui » préservent le mouvement de l’adresse prophétique. L’image difficile des « eaux de Juda » est maintenue avec une note explicative.
