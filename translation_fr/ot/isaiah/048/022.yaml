  yaml_path: translation/ot/isaiah/048/022.yaml
  text: There is no peace," says Yahweh[a], "for the wicked.
translation:
  language: fr
  text: « Il n’y a pas de paix[a] pour les méchants », dit Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bien-être » ou « plénitude ». Le mot hébreu shalom peut aussi désigner le bien-être ou la plénitude.
    reason: alternative lexicale
lexical_decisions:
- source_word: אֵין
  choice: Il n’y a pas de
  rationale: Cette tournure existentielle négative rend naturellement en français le constat d’absence exprimé par la particule hébraïque.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le rendu français le plus concis et traditionnel; une note conserve la portée plus large du terme hébreu, qui peut inclure bien-être et plénitude.
- source_word: אָמַר
  choice: dit
  rationale: Bien que la forme hébraïque soit un accompli, « dit » fonctionne naturellement comme formule prophétique introduisant une parole divine qui fait autorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu, sans le remplacer par un titre.
- source_word: לָרְשָׁעִים
  choice: pour les méchants
  rationale: La préposition ל indique ici les personnes auxquelles ce constat s’applique; « pour les méchants » est idiomatique et le pluriel substantivé désigne ceux qui agissent avec méchanceté.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, international et digne. La brièveté tranchante de l’oracle hébreu est conservée; la note explicite sans la réduire l’étendue sémantique de shalom.
