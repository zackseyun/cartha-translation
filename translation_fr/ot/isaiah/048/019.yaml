source:
  edition: WLC
  text: וַ/יְהִ֤י כַ/חוֹל֙ זַרְעֶ֔/ךָ וְ/צֶאֱצָאֵ֥י מֵעֶ֖י/ךָ כִּ/מְעֹתָ֑י/ו לֹֽא יִכָּרֵ֧ת וְֽ/לֹא יִשָּׁמֵ֛ד שְׁמ֖/וֹ מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
translation:
  language: fr
  text: Ta descendance aurait été comme le sable, et tes descendants, issus de ton corps, comme ses grains[a] ; son nom[b] n’aurait été ni retranché ni détruit de devant moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme ses particules » ou « comme ses petits cailloux » ; le mot hébreu désigne les petites unités qui composent le sable.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son nom ». Le singulier peut personnifier la descendance comme une lignée collective ; on pourrait aussi comprendre « leur nom » ou « le nom de cette descendance ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: aurait été
  rationale: Le verset poursuit la conséquence irréelle de la lamentation conditionnelle du verset 18 ; le conditionnel passé exprime clairement ce sens en français.
- source_word: כַחוֹל
  choice: comme le sable
  rationale: חוֹל désigne couramment le sable ; cette comparaison naturelle évoque une descendance innombrable.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: זֶרַע est ici employé collectivement pour la postérité humaine. « Descendance » est clair et conserve cette valeur collective.
- source_word: וְצֶאֱצָאֵי מֵעֶיךָ
  choice: et ceux qui sont issus de ton corps
  rationale: L’expression désigne les descendants provenant physiquement de la personne. Cette formulation garde l’idée de provenance corporelle sans recourir à l’archaïsme « entrailles » ou « reins ».
- source_word: כִּמְעֹתָיו
  choice: comme ses grains
  rationale: Le suffixe renvoie naturellement au sable, et le nom désigne ses petites unités ou particules. « Grains » prolonge idiomatiquement l’image en français.
- source_word: לֹא יִכָּרֵת
  choice: n’aurait été ni retranché
  rationale: Au nifal, כרת exprime ici le fait d’être retranché, notamment pour un nom ou une lignée ; le conditionnel passé maintient la portée contrefactuelle.
- source_word: וְלֹא יִשָּׁמֵד
  choice: ni détruit
  rationale: שׁמד au nifal signifie être détruit ou exterminé. « Détruit » conserve le renforcement parallèle sans exagération.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: Le texte hébreu porte un suffixe masculin singulier. « Son nom » en préserve la forme et laisse entendre la personnification collective de la descendance ou de la lignée.
- source_word: מִלְּפָנָי
  choice: de devant moi
  rationale: Cette formulation garde l’image hébraïque de la face ou de la présence divine et sa solennité, sans préciser davantage la relation implicite.
theological_decisions:
- issue: Valeur contrefactuelle dans la continuité du verset 18
  choice: 'Employer le conditionnel passé : « aurait été… n’aurait été… »'
  alternative: Employer un passé ou un futur simple sans marquer explicitement l’irréel
  rationale: Le verset énonce la conséquence non réalisée de « Si seulement tu avais été attentif… ». Le français exige le conditionnel passé pour rendre nettement cette relation.
- issue: Nombre et référent de שְׁמוֹ
  choice: Conserver le singulier « son nom »
  alternative: Traduire « leur nom » pour expliciter la descendance collective
  rationale: Le suffixe hébreu est masculin singulier. Le maintien du singulier respecte la forme du texte et préserve l’ambiguïté entre un descendant collectif, une lignée personnifiée et l’ensemble de la postérité.
- issue: Portée de מִלְּפָנָי
  choice: Traduire littéralement « de devant moi »
  alternative: Traduire plus idiomatiquement « loin de ma présence »
  rationale: La formulation littérale conserve l’image de la présence divine sans décider si elle indique surtout relation, reconnaissance ou maintien devant Dieu.
translation_notes:
  register: Français international moderne, clair et digne. Le conditionnel passé rend la conséquence irréelle du contexte. « De devant moi » conserve volontairement une tournure sémitique solennelle, tandis que « ceux qui sont issus de ton corps » explicite naturellement l’image généalogique.
