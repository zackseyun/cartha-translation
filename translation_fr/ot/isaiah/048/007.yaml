source:
  edition: WLC
  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
translation:
  language: fr
  text: 'Maintenant, elles sont créées[a], et non autrefois ; avant ce jour, tu n’en avais pas entendu parler, de peur que tu ne dises : « Voici, je les savais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Maintenant, elles ont été créées, et non autrefois ; avant ce jour, tu n’en avais pas entendu parler. »'
    reason: L’accompli nifal peut être rendu par un passé composé français ; la note conserve cette possibilité sans atténuer le langage de création ni l’opposition temporelle.
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: L’adverbe marque la réalisation présente, en contraste avec un passé lointain.
- source_word: נִבְרְאוּ
  choice: elles sont créées
  rationale: Le nifal accompli de ברא conserve explicitement le langage de la création. Le présent français rend ici la force actuelle de l’annonce sans réduire le verbe à « annoncer ».
- source_word: מֵאָז
  choice: depuis longtemps
  rationale: Dans la proposition négative, cette expression française naturelle indique que ces réalités ne remontent pas à un passé éloigné.
- source_word: וְלִפְנֵי יוֹם
  choice: avant aujourd’hui
  rationale: Rend clairement l’expression temporelle hébraïque et son contraste avec « maintenant ».
- source_word: שְׁמַעְתָּם
  choice: tu n’en avais pas entendu parler
  rationale: Le plus-que-parfait exprime l’absence de connaissance antérieure à la révélation présente ; « en entendre parler » est plus idiomatique en français que « les entendre » pour des événements ou réalités annoncés.
- source_word: פֶּן תֹּאמַר
  choice: de peur que tu ne dises
  rationale: Cette tournure exprime le résultat que la non-divulgation préalable vise à empêcher, tout en restant naturelle dans un registre digne.
- source_word: הִנֵּה
  choice: Regarde
  rationale: Interjection déictique actuelle et intelligible, moins archaïque que « Voici » dans cette parole rapportée.
- source_word: יְדַעְתִּין
  choice: je les connaissais
  rationale: L’imparfait français exprime une connaissance déjà possédée dans le passé sans ajouter explicitement « déjà », absent du texte hébreu.
theological_decisions:
- issue: Sens de « créées » appliqué aux réalités nouvellement révélées
  choice: Conserver « elles sont créées »
  alternative: « elles sont produites » ou « elles sont annoncées »
  rationale: Le texte emploie ברא, verbe fort de création. Le maintenir préserve l’accent sur l’action souveraine de Dieu sans décider si le verset vise principalement la venue à l’existence des événements ou leur manifestation dans l’annonce.
- issue: Référence des suffixes pluriels
  choice: Employer le féminin pluriel « elles »
  alternative: Répéter « ces choses » ou employer un référent neutre reformulé
  rationale: Le féminin renvoie naturellement aux « choses nouvelles » du contexte immédiat (Ésaïe 48.6) et respecte le nombre sans surinterpréter leur nature.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve l’adresse masculine singulière du texte. La ponctuation française et les espaces avant les signes doubles sont appliquées.
