  variant: modern international French
source:
  edition: WLC
  text: ל֥וּא הִקְשַׁ֖בְתָּ לְ/מִצְוֺתָ֑/י וַ/יְהִ֤י כַ/נָּהָר֙ שְׁלוֹמֶ֔/ךָ וְ/צִדְקָתְ/ךָ֖ כְּ/גַלֵּ֥י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
translation:
  language: fr
  text: Si seulement tu avais prêté attention à mes commandements ! Alors ta paix aurait été comme un fleuve, et ta justice[a] comme les vagues de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  choice: Si seulement
  rationale: Cette tournure française actuelle exprime naturellement le souhait irréalisé et la lamentation portés par לוּא.
- source_word: הִקְשַׁ֖בְתָּ
  choice: tu avais prêté attention
  rationale: Le verbe désigne une écoute attentive impliquant la prise en compte, et non la simple perception auditive.
- source_word: לְמִצְוֺתָי
  choice: à mes commandements
  rationale: « Commandements » conserve le poids moral et relationnel de מִצְוָה ainsi que le pluriel et le suffixe de première personne.
- source_word: וַיְהִי
  choice: Alors ... aurait été
  rationale: Après le souhait contraire aux faits introduit par לוּא, la forme exprime ici la conséquence qui se serait produite.
- source_word: כַנָּהָר
  choice: comme un fleuve
  rationale: « Fleuve » rend naturellement נָהָר et préserve l’image d’un cours d’eau ample et continu.
- source_word: שְׁלוֹמֶךָ
  choice: ta paix
  rationale: « Paix » est la traduction concise traditionnelle de שָׁלוֹם, tout en laissant résonner ses nuances de bien-être et de plénitude.
- source_word: וְצִדְקָתְךָ
  choice: ta justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou la conformité à ce qui est juste. En français moderne, « justice » préserve ici la portée morale et communautaire sans réduire le terme à une qualité privée.
- source_word: כְּגַלֵּי הַיָּם
  choice: comme les vagues de la mer
  rationale: Cette formulation proche de l’hébreu conserve l’image poétique de l’abondance et de la continuité.
theological_decisions:
- issue: Sens de צְדָקָה dans ce contexte
  choice: justice
  alternative: droiture
  rationale: Le terme hébreu couvre à la fois la conduite conforme au juste et la justice qui en résulte. « Justice » est idiomatique et large en français; la note maintient l’autre lecture légitime sans trancher excessivement.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond au singulier hébreu adressé à Israël. La construction contrefactuelle est explicitée naturellement par « Si seulement… Alors… aurait été ».
