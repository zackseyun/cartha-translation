  to: 'Je te l’ai annoncé depuis longtemps ; avant que cela arrive, je te l’ai fait entendre, de peur que tu ne dises : « Mon idole a fait ces choses ; mon image sculptée et mon image en métal fondu ont ordonné ces choses. »'
  rationale: La révision conserve le registre et les choix lexicaux solides du projet, tout en rétablissant les deux objets pluriels du texte hébreu et l’accord du verbe avec les deux images. « Ces choses » laisse ouvert le référent précis — choses annoncées ou événements — sans introduire une interprétation supplémentaire. La note grammaticale devient inutile, puisque le pluriel est désormais visible dans la traduction.
