  text: וָ/אַגִּ֤יד לְ/ךָ֙ מֵ/אָ֔ז בְּ/טֶ֥רֶם תָּב֖וֹא הִשְׁמַעְתִּ֑י/ךָ פֶּן תֹּאמַר֙ עָצְבִּ֣/י עָשָׂ֔/ם וּ/פִסְלִ֥/י וְ/נִסְכִּ֖/י צִוָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
translation:
  language: fr
  text: 'Je te l’ai annoncé depuis longtemps ; avant que cela arrive, je te l’ai fait entendre, de peur que tu ne dises : « Mon idole a fait ces choses ; mon image sculptée et mon image en métal fondu ont ordonné ces choses. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַגִּיד
  choice: je te l’ai annoncé
  rationale: Le hiphil de נגד exprime l’action d’annoncer ou de faire connaître ; « annoncé » convient au registre prophétique tout en restant naturel.
- source_word: מֵאָז
  choice: depuis longtemps
  rationale: L’expression situe l’annonce dans un passé antérieur à l’accomplissement ; « depuis longtemps » rend bien cette antériorité en français courant.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: avant que cela arrive
  rationale: Le verbe féminin singulier évoque la venue ou la réalisation de ce qui a été annoncé. « Cela » laisse le référent contextuel ouvert sans l’alourdir.
- source_word: הִשְׁמַעְתִּיךָ
  choice: je te l’ai fait entendre
  rationale: Cette formulation conserve la valeur causative du hiphil de שמע et l’écho avec l’annonce précédente.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française exprime naturellement le but préventif introduit par פן, dans un registre digne.
- source_word: עָצְבִּי
  choice: mon idole
  rationale: עצב désigne ici une idole ; ce terme général se distingue des deux désignations techniques qui suivent.
- source_word: עָשָׂם
  choice: a fait tout cela
  rationale: Le suffixe pluriel renvoie aux choses ou événements annoncés. Le collectif français « tout cela » est idiomatique et conserve ce sens contextuel.[a]
- source_word: פִסְלִי
  choice: mon image sculptée
  rationale: פסל désigne une représentation façonnée par sculpture ; « image sculptée » est précis et compréhensible.
- source_word: נִסְכִּי
  choice: mon image en métal fondu
  rationale: Le nom désigne une image produite par fonte ou coulage. La formulation explicite le procédé sans employer le peu naturel « image coulée ».
- source_word: צִוָּם
  choice: l’a ordonné
  rationale: צוה signifie normalement « ordonner ». Le pronom singulier « l’ » reprend en français le collectif « tout cela », tout en conservant l’attribution ironique du cours des événements aux images.
theological_decisions:
- issue: Distinction entre les trois termes relatifs aux idoles
  choice: « idole », « image sculptée » et « image en métal fondu »
  alternative: Rendre les trois termes par « idole », ou employer « image taillée » et « image coulée »
  rationale: L’hébreu emploie trois termes distincts qui renforcent la polémique contre les faux dieux. Les différencier préserve la rhétorique du texte sans ajouter d’interprétation confessionnelle.
- issue: Référent pluriel de עָשָׂם et צִוָּם
  choice: Le rendre par le collectif français « tout cela », repris par « l’ »
  alternative: Employer « ces choses » et les pronoms pluriels « les »
  rationale: L’hébreu renvoie au pluriel aux événements annoncés. « Tout cela » exprime naturellement ce collectif en français tout en maintenant l’ambiguïté sur les événements précis.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme prophétique et distingue les trois désignations idolâtres. « De peur que… ne » relève d’un registre soutenu mais demeure courant dans une traduction biblique.
