  terminology: « Yahweh », « Chaldéens », « serviteur Jacob » et « a racheté » sont appropriés et respectent les choix lexicaux importants du texte. Les notes conservent utilement l’alternative géographique et la variation singulier/pluriel pour « extrémité(s) ».
