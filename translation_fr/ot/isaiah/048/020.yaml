source:
  edition: WLC
  text: צְא֣וּ מִ/בָּבֶל֮ בִּרְח֣וּ מִ/כַּשְׂדִּים֒ בְּ/ק֣וֹל רִנָּ֗ה הַגִּ֤ידוּ הַשְׁמִ֨יעוּ֙ זֹ֔את הוֹצִיא֖וּ/הָ עַד קְצֵ֣ה הָ/אָ֑רֶץ אִמְר֕וּ גָּאַ֥ל יְהוָ֖ה עַבְדּ֥/וֹ יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
translation:
  language: fr
  text: 'Sortez de Babylone ; fuyez les Chaldéens[a] ! Annoncez cela avec des cris de joie, faites-le entendre, diffusez-le jusqu’à l’extrémité de la terre[b]. Dites : « Yahweh a racheté son serviteur Jacob. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fuyez la Chaldée » ; l’hébreu nomme littéralement le peuple : « les Chaldéens ».'
    reason: Alternative lexicale et géographique.
  - marker: b
    text: Ou « jusqu’aux extrémités de la terre ».
    reason: Le texte hébreu emploie le singulier, tandis que le pluriel est une tournure française courante de sens comparable.
lexical_decisions:
- source_word: צְאוּ מִבָּבֶל
  choice: Sortez de Babylone
  rationale: L’impératif pluriel de יצא appelle à quitter Babylone. « Sortez » conserve directement le mouvement exprimé par l’hébreu.
- source_word: בִּרְחוּ מִכַּשְׂדִּים
  choice: fuyez loin des Chaldéens
  rationale: ברח exprime une fuite urgente, et כַּשְׂדִּים désigne formellement le peuple chaldéen. « Loin des » rend naturellement en français la séparation marquée par מִן.
- source_word: בְּקוֹל רִנָּה
  choice: avec des cris de joie
  rationale: La locution associe une expression vocale audible à la jubilation. Le pluriel français est idiomatique et garde la vigueur de la proclamation.
- source_word: הַגִּידוּ הַשְׁמִיעוּ זֹאת
  choice: Annoncez-le avec des cris de joie, faites-le entendre
  rationale: 'Les deux impératifs sont maintenus : le premier commande l’annonce publique, le second, forme causative de שמע, demande qu’elle soit entendue.'
- source_word: הוֹצִיאוּהָ
  choice: diffusez-le
  rationale: Le hiphil de יצא avec suffixe féminin demande de faire sortir ou circuler ce qui vient d’être annoncé. « Diffusez-le » exprime naturellement la propagation du message sans imposer un support particulier.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: jusqu’à l’extrémité de la terre
  rationale: Le singulier hébreu קְצֵה est conservé. La formule française reste claire et solennelle.
- source_word: גָּאַל
  choice: a racheté
  rationale: גאל désigne l’action de reprendre ou libérer en qualité de rédempteur. « Racheter » conserve cette portée propre au vocabulaire de la rédemption, au-delà du simple fait de délivrer.
- source_word: עַבְדּוֹ יַעֲקֹב
  choice: son serviteur Jacob
  rationale: La relation possessive et le titre de serviteur sont rendus sans explicitation interprétative.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de גָּאַל dans l’annonce du retour d’exil
  choice: a racheté
  alternative: a délivré
  rationale: « A racheté » préserve le champ lexical particulier de גאל et sa résonance d’intervention rédemptrice, sans préciser davantage le mécanisme de cette délivrance.
translation_notes:
  register: Français international moderne, accessible et digne, avec une cadence prophétique marquée par la série d’impératifs. La répétition des verbes de proclamation est conservée, et les formulations évitent aussi bien l’archaïsme que la paraphrase confessionnelle.
