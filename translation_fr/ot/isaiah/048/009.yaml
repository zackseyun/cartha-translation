  to: Par égard pour mon nom, je diffère ma colère[a] ; pour ma louange, je la réfrène en ta faveur[b], afin de ne pas te retrancher[c].
  rationale: La révision rend distinctement le report de la colère dans la première proposition et sa répression dans la seconde. Elle remplace l’explicitation interprétative de « la louange qui m’est due » par « pour ma louange », plus proche de l’hébreu, et rend לָךְ par « en ta faveur », naturel en français tout en conservant la relation bénéfique au destinataire. Les ancres de notes restent correctement associées aux éléments qu’elles expliquent.
