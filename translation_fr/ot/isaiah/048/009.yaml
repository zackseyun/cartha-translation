  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
translation:
  language: fr
  text: Par égard pour mon nom, je diffère ma colère[a] ; pour ma louange, je la réfrène en ta faveur[b], afin de ne pas te retrancher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « j’allonge mon nez », expression qui signifie que Dieu diffère sa colère ou qu’il est lent à la colère.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « je la contiens ». Le verbe hébreu peut évoquer l’action de museler ou de brider.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « te détruire », « t’anéantir ». « Te retrancher » conserve l’image plus littérale, avec sa portée judiciaire possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שְׁמִי
  choice: À cause de mon nom
  rationale: Exprime le motif de l’action divine tout en conservant « mon nom », qui désigne aussi la réputation, l’honneur et le caractère révélé de Dieu.
- source_word: אַאֲרִיךְ אַפִּי
  choice: je retiens ma colère
  rationale: L’expression hébraïque signifie littéralement « j’allonge mon nez/ma colère » et décrit le fait de différer la manifestation de la colère. « Je retiens ma colère » est naturel en français et convient à l’action ponctuelle exprimée ici.
- source_word: וּתְהִלָּתִי
  choice: à cause de la louange qui m’est due
  rationale: Le nom hébreu signifie « louange ». La formulation française explicite sans l’abstraire en « gloire » que cette louange a Dieu pour objet.
- source_word: אֶחֱטָם
  choice: je la réfrène
  rationale: Le verbe évoque l’action de museler ou de brider. « Réfréner » conserve cette image de maîtrise sans produire une formulation trop littérale.
- source_word: לָךְ
  choice: pour toi
  rationale: Rend simplement la relation au destinataire et le bénéfice qu’il retire de cette retenue.
- source_word: לְבִלְתִּי
  choice: afin de ne pas
  rationale: Exprime clairement en français moderne le but ou le résultat visé.
- source_word: הַכְרִיתֶךָ
  choice: te retrancher
  rationale: Conserve l’image judiciaire de « couper/retrancher » et son possible arrière-plan d’alliance, plutôt que de la généraliser immédiatement en « détruire ».
theological_decisions:
- issue: Motif de Dieu lorsqu’il retient son jugement
  choice: Dieu retient sa colère à cause de son propre nom et de la louange qui lui est due ; la préservation du destinataire en est le résultat déclaré.
  alternative: Présenter principalement cette retenue comme motivée par l’intérêt d’Israël, ou remplacer « louange » par « gloire » ou « renommée ».
  rationale: Le texte fonde explicitement l’action divine sur son nom et sa louange, sans invoquer le mérite du destinataire. La traduction maintient cette tension sans l’intégrer à un système doctrinal.
- issue: Objet implicite du verbe אֶחֱטָם
  choice: Le pronom « la » renvoie à la colère mentionnée dans la proposition précédente.
  alternative: Laisser l’objet inexprimé ou répéter « ma colère ».
  rationale: Le français appelle ici un complément. Le pronom préserve l’ellipse hébraïque tout en rendant le lien contextuel clair.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux motifs divins est rendu par la répétition de « à cause de ». « Réfréner » et « retrancher » donnent une légère solennité adaptée au registre prophétique, tandis que les notes signalent les images et les autres sens possibles.
