id: ISA.48.13
reference: Isaiah 48:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַף יָדִ/י֙ יָ֣סְדָה אֶ֔רֶץ וִֽ/ימִינִ֖/י טִפְּחָ֣ה שָׁמָ֑יִם קֹרֵ֥א אֲנִ֛י אֲלֵי/הֶ֖ם יַעַמְד֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
translation:
  language: fr
  text: Oui, ma main a fondé la terre, et ma main droite a déployé les cieux[a] ; quand je les appelle, ils se tiennent ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a étendu les cieux » ; le verbe peut aussi évoquer le fait de les mesurer à l’empan.
    reason: Alternative lexicale liée au sens rare de טפח dans ce contexte.
lexical_decisions:
- source_word: אַף
  choice: Oui
  rationale: La particule a ici une valeur emphatique. « Oui » introduit naturellement en français moderne cette affirmation solennelle sans lui ajouter de contenu.
- source_word: יָדִי
  choice: ma main
  rationale: La traduction concrète conserve l’image anthropomorphique de l’action créatrice de Dieu.
- source_word: יָסְדָה
  choice: a fondé
  rationale: Le verbe יסד évoque la pose de fondations. « A fondé » reste concis et préserve cette image appliquée à la terre.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le contexte cosmique de la création désigne la terre, et non un territoire particulier.
- source_word: וִימִינִי
  choice: et ma main droite
  rationale: Cette formulation explicite en français le nom sous-entendu et conserve le parallélisme ainsi que l’image de puissance et d’action.
- source_word: טִפְּחָה
  choice: a déployé
  rationale: Dans ce contexte, le verbe décrit l’extension des cieux. « Déployer » est naturel, digne et maintient l’image cosmique, tout en laissant en note les nuances possibles d’étendue ou de mesure à l’empan.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français traditionnel et toujours compréhensible convient au contexte de création et reflète la forme hébraïque.
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם
  choice: quand je les appelle
  rationale: La construction participiale présente vivement l’action. La formulation temporelle rend clairement en français son rapport avec la proposition suivante.
- source_word: יַעַמְדוּ
  choice: ils se tiennent
  rationale: Le verbe עמד signifie fondamentalement « se tenir, être debout ». Cette traduction directe conserve l’image de la création répondant à l’appel divin sans la préciser davantage.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: Ce choix préserve le sens ordinaire de l’adverbe et l’unité de la terre et des cieux devant l’appel de Dieu.
theological_decisions:
- issue: Langage anthropomorphique décrivant l’action créatrice de Dieu
  choice: Conserver les images concrètes de la « main » et de la « main droite ».
  alternative: Paraphraser par « ma puissance » et « ma force ».
  rationale: L’hébreu emploie explicitement des images corporelles. Les maintenir respecte la vigueur du texte et affirme l’action créatrice directe et souveraine de Dieu sans transformer l’image en explication abstraite.
- issue: Réponse de la terre et des cieux à l’appel divin
  choice: « ils se tiennent ensemble »
  alternative: « ils se présentent ensemble »
  rationale: « Se présentent » expliciterait une comparution au service de Dieu, sens contextuellement plausible, mais « se tiennent » préserve davantage l’expression hébraïque et son ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébraïque et les images corporelles sont conservés. La ponctuation rend lisible l’enchaînement entre l’œuvre créatrice et la réponse immédiate de la création.
