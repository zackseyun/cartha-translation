source:
  edition: WLC
  text: הִנֵּ֥ה צְרַפְתִּ֖י/ךָ וְ/לֹ֣א בְ/כָ֑סֶף בְּחַרְתִּ֖י/ךָ בְּ/כ֥וּר עֹֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/010.yaml
  text: Behold[a], I have refined you, but not as silver[b]; I have chosen you in the furnace of affliction.
translation:
  language: fr
  text: Voici, je t’ai affiné, mais pas comme l’argent[a] ; je t’ai choisi[b] dans la fournaise de l’affliction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pas avec, dans ou comme l’argent ». La construction hébraïque est difficile ; elle signifie probablement que cet affinage ne s’est pas fait comme celui de l’argent.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu signifie habituellement « choisir ». Dans ce contexte d’affinage, certains le comprennent au sens de « mettre à l’épreuve » : « je t’ai éprouvé dans la fournaise de l’affliction ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec force l’attention tout en gardant un registre prophétique digne et naturel en français moderne.
- source_word: צְרַפְתִּיךָ
  choice: je t’ai affiné
  rationale: Le verbe désigne l’affinage des métaux. « Affiné » conserve clairement la métaphore métallurgique liée à l’argent et à la fournaise.
- source_word: וְלֹא בְכָסֶף
  choice: mais pas comme l’argent
  rationale: La valeur de la préposition ב est difficile ici. La tournure comparative rend le sens contextuel probable sans masquer l’incertitude, signalée en note.
- source_word: בְּחַרְתִּיךָ
  choice: je t’ai choisi
  rationale: בחר signifie normalement « choisir ». Ce sens lexical premier est maintenu dans le texte, tandis que l’interprétation contextuelle « éprouver » est conservée en note.
- source_word: בְּכוּר
  choice: dans la fournaise
  rationale: כור désigne une fournaise servant au travail des métaux. « Fournaise » est clair et prolonge naturellement l’image de l’affinage.
- source_word: עֹנִי
  choice: de l’affliction
  rationale: Le nom peut évoquer l’affliction, la misère ou la pauvreté. « Affliction » garde ici sa portée générale et sa gravité.
theological_decisions:
- issue: Sens de בְּחַרְתִּיךָ dans la métaphore de l’affinage
  choice: je t’ai choisi
  alternative: je t’ai éprouvé
  rationale: Le sens ordinaire du verbe est « choisir » et ne doit pas être écarté uniquement pour harmoniser la proposition avec l’image métallurgique. La lecture « éprouvé », favorisée par le contexte, est néanmoins donnée en note afin de préserver la tension du texte.
- issue: Rapport entre l’affinage d’Israël et celui de l’argent
  choice: mais pas comme l’argent
  alternative: mais non avec de l’argent / mais pas pour de l’argent
  rationale: La construction hébraïque est concise et difficile. La lecture comparative s’accorde le mieux avec la métaphore, mais les autres valeurs possibles de la préposition sont signalées sans en tirer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. La métaphore métallurgique est conservée, et les deux difficultés lexicales majeures sont rendues visibles par des notes.
