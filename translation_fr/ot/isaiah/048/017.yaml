  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/ךָ֖ קְד֣וֹשׁ יִשְׂרָאֵ֑ל אֲנִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מְלַמֶּדְ/ךָ֣ לְ/הוֹעִ֔יל מַדְרִֽיכֲ/ךָ֖ בְּ/דֶ֥רֶךְ תֵּלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé, celui qui te rachète, le Saint d’Israël : « Moi, Yahvé, je suis ton Dieu, celui qui t’enseigne pour ton bien[a] et qui te conduit sur le chemin où tu dois marcher[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui t’enseigne pour ton profit ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « qui te conduit sur le chemin où tu marches ». L’hébreu peut être lu de manière instructionnelle ou descriptive.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente clairement le nom divin et permet de conserver sa répétition emphatique dans le verset.
- source_word: גֹּאַלְךָ
  choice: celui qui te rachète
  rationale: Cette formulation actuelle et concrète rend le participe comme une action caractéristique de Dieu, sans imposer dans le texte principal la nuance plus précise du proche parent chargé du rachat.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Ce titre caractéristique d’Ésaïe est rendu sous sa forme française concise et consacrée.
- source_word: מְלַמֶּדְךָ לְהוֹעִיל
  choice: celui qui t’enseigne pour ton bien
  rationale: La tournure exprime naturellement le but ou le résultat bénéfique de l’enseignement, tout en évitant le français peu idiomatique « t’enseigne à profiter ».
- source_word: מַדְרִיכֲךָ
  choice: qui te conduit
  rationale: Le causatif évoque une direction active et s’accorde avec l’image du chemin.
- source_word: בְּדֶרֶךְ תֵּלֵךְ
  choice: sur le chemin où tu dois marcher
  rationale: Cette traduction conserve l’image de la marche et rend la nuance instructionnelle probable de l’imparfait, sans la transformer en commandement explicite.
theological_decisions:
- issue: Répétition du nom divin et auto-identification
  choice: « Ainsi parle Yahvé… Moi, Yahvé, je suis ton Dieu »
  alternative: « Ainsi parle le Seigneur… Je suis le Seigneur, ton Dieu »
  rationale: Le choix conserve les deux occurrences de יְהוָה et l’accent de l’auto-identification, sans substituer un titre au nom propre.
- issue: Portée de la direction divine sur le chemin
  choice: « le chemin où tu dois marcher »
  alternative: « le chemin où tu marches »
  rationale: Le contexte pédagogique favorise une lecture normative, mais la forme hébraïque permet aussi une lecture descriptive; cette ambiguïté est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit le singulier hébreu adressé à Israël. Les parallélismes et la répétition du nom divin sont préservés; les formulations trop techniques ou archaïques sont évitées.
