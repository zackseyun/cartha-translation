  text: שְׁמַ֤ע אֵלַ/י֙ יַֽעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל מְקֹרָאִ֑/י אֲנִי הוּא֙ אֲנִ֣י רִאשׁ֔וֹן אַ֖ף אֲנִ֥י אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/012.yaml
  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
translation:
  language: fr
  text: 'Écoute-moi, Jacob, et toi, Israël, que j’ai appelé : c’est moi[a]. Je suis le premier, et je suis aussi le dernier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis lui ». L’hébreu emploie une formule concise d’auto-identification divine qui revient à plusieurs reprises dans Ésaïe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֵלַי
  choice: Écoute-moi
  rationale: L’impératif appelle à une écoute attentive. « Écoute-moi » est naturel en français moderne et conserve la force directe de l’hébreu.
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Jacob, et toi, Israël
  rationale: Les deux noms employés comme apostrophes sont conservés. L’ajout idiomatique de « toi » clarifie que « Israël » est également interpellé.
- source_word: מְקֹרָאִי
  choice: que j’ai appelé
  rationale: Cette forme désigne Israël comme celui que Dieu a appelé. La proposition relative exprime clairement ce rapport sans l’expression peu naturelle « mon appelé ».
- source_word: אֲנִי הוּא
  choice: c’est moi
  rationale: La formule hébraïque compacte d’auto-identification signifie littéralement « moi, lui ». « C’est moi » en rend naturellement la vigueur en français sans la réduire au simple verbe « être ».
- source_word: רִאשׁוֹן
  choice: le premier
  rationale: L’adjectif est employé substantivement et possède ici une portée absolue, bien rendue par l’article défini français.
- source_word: אַף
  choice: aussi
  rationale: La particule ajoute et souligne le second membre parallèle. « Aussi » en conserve explicitement la valeur additive.
- source_word: אַחֲרוֹן
  choice: le dernier
  rationale: L’adjectif substantivé est rendu parallèlement à « le premier », ce qui maintient l’affirmation solennelle de l’unicité divine.
theological_decisions:
- issue: La formule divine אֲנִי הוּא
  choice: c’est moi
  alternative: moi, je suis lui ; je suis celui qui est
  rationale: « C’est moi » préserve une déclaration concise d’identité sans introduire une explicitation ontologique absente du texte. La note signale la forme plus littérale et son emploi récurrent dans Ésaïe.
- issue: La portée de רִאשׁוֹן ... אַחֲרוֹן
  choice: le premier… le dernier
  alternative: premier… dernier
  rationale: Les articles donnent en français la force absolue et quasi titulaire du parallélisme hébreu, sans développer la déclaration en paraphrase doctrinale.
translation_notes:
  register: Français international moderne, direct et solennel. La structure parallèle et la brièveté de la déclaration divine sont conservées, tout en évitant les formulations archaïques ou confessionnellement chargées.
