source:
  edition: WLC
  text: הָ/רִֽאשֹׁנוֹת֙ מֵ/אָ֣ז הִגַּ֔דְתִּי וּ/מִ/פִּ֥/י יָצְא֖וּ וְ/אַשְׁמִיעֵ֑/ם פִּתְאֹ֥ם עָשִׂ֖יתִי וַ/תָּבֹֽאנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
translation:
  language: fr
  text: Les événements passés[a], je les ai annoncés il y a longtemps ; ils sont sortis de ma bouche et je les ai fait entendre[b]. Soudain, j’ai agi[c], et ils se sont produits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les choses d’autrefois » ; littéralement : « les premières choses » ou « les choses antérieures ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je les ai proclamés ». Le verbe hébreu est causatif : « je les ai fait entendre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « j’ai fait cela ». Le verbe hébreu est le verbe courant signifiant « faire » ou « agir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: les événements passés
  rationale: L’adjectif féminin pluriel substantivé désigne les réalités ou événements antérieurs. « Les événements passés » est naturel en français et maintient le contraste prophétique avec ce qui sera annoncé ensuite.
- source_word: מֵאָז
  choice: depuis longtemps
  rationale: Dans ce contexte, l’expression renvoie à une annonce faite dans un passé éloigné. Cette formulation française exprime clairement cette distance temporelle.
- source_word: הִגַּדְתִּי
  choice: je les ai annoncés
  rationale: Le hiphil de נגד exprime ici le fait de faire connaître par une déclaration prophétique. « Annoncer » convient au registre solennel sans être archaïque.
- source_word: וּמִפִּי יָצְאוּ
  choice: ils sont sortis de ma bouche
  rationale: La formulation conserve l’image concrète de paroles qui sortent de la bouche de Dieu, même si le pronom reprend grammaticalement les événements passés.
- source_word: וְאַשְׁמִיעֵם
  choice: je les ai fait entendre
  rationale: 'Cette traduction garde la valeur causative du hiphil de שמע : Dieu a fait en sorte que ces annonces soient entendues.'
- source_word: פִּתְאֹם
  choice: Soudain
  rationale: L’adverbe marque le caractère brusque de l’intervention divine.
- source_word: עָשִׂיתִי
  choice: j’ai agi
  rationale: Le verbe courant « faire » désigne ici l’intervention de Dieu. « J’ai agi » reste concis et évite d’expliciter plus que le texte la nature de cette action.
- source_word: וַתָּבֹאנָה
  choice: ils se sont produits
  rationale: Le verbe a littéralement le sens de « venir », mais, appliqué à des événements annoncés, il indique naturellement en français qu’ils se sont réalisés.
theological_decisions:
- issue: Rapport entre l’annonce divine et l’accomplissement
  choice: La traduction présente Dieu comme celui qui annonce les événements, puis agit avant qu’ils ne se produisent.
  alternative: On pourrait traduire plus littéralement « j’ai fait, et ils sont venus », sans préciser idiomatiquement qu’il s’agit de la réalisation des événements.
  rationale: La succession des verbes relie clairement l’annonce à l’action divine, tout en laissant subsister la sobriété du texte sur la manière dont cette action produit l’accomplissement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’image hébraïque des événements qui « sortent » de la bouche de Dieu, tandis que « se sont produits » rend idiomatiquement leur accomplissement.
