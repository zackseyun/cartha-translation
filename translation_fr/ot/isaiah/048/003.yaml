  source_fidelity: 'Le sens général est fidèle : Dieu rappelle qu’il a annoncé les réalités antérieures, les a fait entendre, puis a agi et elles se sont réalisées. « Événements passés » est recevable dans ce contexte, où leur réalisation est ensuite évoquée. Toutefois, « depuis longtemps » avec un passé composé peut suggérer une durée se prolongeant jusqu’au présent, alors que מֵאָז situe l’annonce dans un passé lointain. « Il y a longtemps » rend plus exactement cette valeur temporelle.'
  naturalness: Le français est moderne, clair et de registre approprié. La reprise par « ils » est grammaticalement cohérente avec « événements ». Le déplacement de « il y a longtemps » améliore la netteté idiomatique sans modifier l’emphase initiale du texte.
  terminology: « Annoncés », « sortis de ma bouche », « fait entendre », « soudain », « agi » et « se sont produits » rendent convenablement les termes hébreux et leur progression. Les notes conservent les principales alternatives lexicales et la valeur causative de la forme hiphil.
