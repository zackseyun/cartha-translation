id: ISA.48.21
reference: Isaiah 48:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֣א צָמְא֗וּ בָּ/חֳרָבוֹת֙ הֽוֹלִיכָ֔/ם מַ֥יִם מִ/צּ֖וּר הִזִּ֣יל לָ֑/מוֹ וַ/יִּ֨בְקַע צ֔וּר וַ/יָּזֻ֖בוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
translation:
  language: fr
  text: 'Ils n’ont pas eu soif quand il les a conduits à travers les étendues arides[a] : il a fait couler pour eux de l’eau du rocher ; il a fendu le rocher[b], et les eaux ont jailli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les déserts » ou « à travers les lieux desséchés ».
    reason: lexical_alternative
  - marker: b
    text: Ce verset fait écho au don de l’eau tirée du rocher dans le désert (par exemple Exode 17.6 ; Nombres 20.11).
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  choice: ont eu soif
  rationale: Le verbe exprime l’expérience de la soif. Avec la négation, « n’ont pas eu soif » conserve sa force verbale et reste naturel en français.
- source_word: בָּחֳרָבוֹת
  choice: à travers les étendues arides
  rationale: Le pluriel désigne des régions sèches et désolées. « Étendues arides » préserve cette portée sans imposer une topographie précise, tandis que « à travers » convient au verbe de déplacement.
- source_word: הוֹלִיכָם
  choice: il les a conduits
  rationale: Le hifil de הלך signifie ici faire aller ou conduire. Cette formulation rend naturellement la valeur causative.
- source_word: הִזִּיל
  choice: il a fait couler
  rationale: 'Le hifil de נזל est causatif : il a fait s’écouler l’eau. « A fait couler » exprime clairement cette nuance.'
- source_word: מִצּוּר
  choice: du rocher
  rationale: Le nom singulier précédé de la préposition indique le rocher comme source de l’eau et garde l’écho du récit du désert.
- source_word: וַיִּבְקַע צוּר
  choice: il a fendu le rocher
  rationale: בקע signifie fendre ou ouvrir en séparant. « Fendre » est précis, concret et d’un registre digne en français moderne.
- source_word: וַיָּזֻבוּ מָיִם
  choice: les eaux ont jailli
  rationale: Le verbe décrit l’écoulement de l’eau. « Ont jailli » restitue ici l’image vive et abondante, tandis que le pluriel « les eaux » reflète מָיִם.
theological_decisions:
- issue: Référent du sujet masculin singulier implicite
  choice: « il » renvoie au SEIGNEUR selon le contexte, sans expliciter son nom dans le verset
  alternative: Introduire « le SEIGNEUR » dans le corps du texte
  rationale: L’hébreu emploie des formes verbales sans nom divin explicite dans ce verset. Le pronom préserve cette forme tout en laissant le contexte identifier le sujet.
- issue: Écho au don de l’eau tirée du rocher dans le désert
  choice: Conserver l’allusion historique et poétique sans l’expliciter dans le corps du texte
  alternative: Ajouter une interprétation typologique ou sacramentelle
  rationale: Le texte évoque nettement les récits du désert, mais ne formule pas ici une interprétation théologique ultérieure. Une note signale les renvois sans résoudre davantage l’allusion.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme poétique est conservé par trois propositions successives ; les pronoms restent implicites quant à l’identité divine comme dans l’hébreu, et les notes rendent compte de l’alternative lexicale et de l’écho intertextuel.
