  yaml_path: translation/ot/isaiah/048/006.yaml
  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: fr
  text: Tu as entendu ; vois tout cela. Et vous, ne le proclamerez-vous pas ? Dès maintenant, je te fais entendre des choses nouvelles, des réalités cachées que vous n’avez pas connues.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu alterne ici entre le singulier (« tu »), le pluriel (« vous »), puis de nouveau le singulier et enfin le pluriel.
    reason: Signaler les changements grammaticaux de nombre présents dans le texte source, sans les lisser ni en déduire l’identité des destinataires.
lexical_decisions:
- source_word: חֲזֵה
  choice: considère
  rationale: L’impératif invite non seulement à voir, mais à examiner attentivement l’ensemble des faits évoqués.
- source_word: תַגִּידוּ
  choice: annoncerez-vous
  rationale: Le verbe signifie déclarer ou faire connaître ; « annoncer » convient au contexte public et conserve la forme interrogative.
- source_word: מֵעַתָּה
  choice: Dès maintenant
  rationale: Rend la valeur temporelle du syntagme hébreu sans ajouter d’explication.
- source_word: וּנְצֻרוֹת
  choice: des choses gardées en secret
  rationale: Le participe passif évoque des réalités gardées, préservées ou tenues cachées ; cette formulation conserve à la fois l’idée de garde et celle de non-divulgation.
theological_decisions:
- issue: Changement de nombre grammatical dans l’adresse
  choice: Conserver le passage de « tu » à « vous », puis le retour à « tu »
  alternative: Uniformiser toute l’adresse au singulier ou au pluriel
  rationale: L’hébreu passe explicitement d’impératifs et suffixes singuliers à אַתֶּם et תַגִּידוּ au pluriel, avant de revenir au singulier. Le maintien de cette tension évite de déterminer artificiellement l’identité précise des interlocuteurs.
- issue: Nature des « choses nouvelles »
  choice: Ne pas préciser leur contenu
  alternative: Les identifier explicitement à des prophéties, à des actes de salut ou à des révélations doctrinales
  rationale: Le verset les qualifie de nouvelles et gardées en secret, mais ne les définit pas davantage.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement rend l’adresse collective au singulier, tandis que le pluriel ponctuel de l’hébreu est volontairement conservé.
