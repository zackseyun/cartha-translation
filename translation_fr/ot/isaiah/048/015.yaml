id: ISA.48.15
reference: Isaiah 48:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֥י אֲנִ֛י דִּבַּ֖רְתִּי אַף קְרָאתִ֑י/ו הֲבִיאֹתִ֖י/ו וְ/הִצְלִ֥יחַ דַּרְכּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
translation:
  language: fr
  text: Moi, moi, j’ai parlé ; oui, je l’ai appelé[a], je l’ai fait venir, et il mènera son entreprise à bien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pronoms « l’ » et « il » renvoient à celui que Dieu a appelé et fait venir ; dans le contexte, il s’agit généralement de Cyrus (voir Ésaïe 48.14).
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « il fera réussir sa voie ». On peut aussi comprendre : « sa voie réussira » ou « il réussira dans son entreprise ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  choice: Moi, moi
  rationale: Le redoublement du pronom est conservé afin de rendre l’insistance rhétorique de l’hébreu.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le parfait présente la déclaration divine comme accomplie ; le passé composé est naturel en français et garde sa solennité.
- source_word: אַף
  choice: oui
  rationale: Dans ce contexte, la particule confirme et renforce la proposition précédente plutôt qu’elle ne marque une simple addition.
- source_word: קְרָאתִיו
  choice: je l’ai appelé
  rationale: Cette traduction conserve le sens courant de « appeler », avec sa possible nuance de convocation ou de mission, sans la préciser excessivement.
- source_word: הֲבִיאֹתִיו
  choice: je l’ai fait venir
  rationale: La tournure causative rend directement le hifil de בוא et convient naturellement au français.
- source_word: וְהִצְלִיחַ
  choice: il mènera … à bien
  rationale: 'La forme verbale est un hifil à la troisième personne masculine du singulier : le sujet est donc « il », et non « je ». Le futur français rend ici la portée prospective du parfait dans l’annonce prophétique.'
- source_word: דַּרְכּוֹ
  choice: son entreprise
  rationale: Littéralement « son chemin » ou « sa voie » ; dans ce contexte, דֶּרֶךְ désigne le cours de l’action ou l’entreprise de l’agent appelé. « Mener son entreprise à bien » exprime naturellement en français l’idée causative de réussite.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Le texte garde les pronoms sans nommer leur référent ; dans le contexte, ils renvoient à l’agent que Dieu a appelé et fait venir, généralement identifié à Cyrus.
  alternative: Insérer explicitement le nom de Cyrus dans le corps du verset.
  rationale: L’hébreu n’emploie ici que des pronoms. La traduction préserve cette formulation tout en indiquant le référent contextuel dans une note.
- issue: Sujet de וְהִצְלִיחַ
  choice: '« il » : l’agent appelé mènera son entreprise à bien.'
  alternative: '« je » : Dieu fera réussir son entreprise.'
  rationale: La forme hébraïque וְהִצְלִיחַ est à la troisième personne masculine du singulier. Rendre le verbe par la première personne effacerait le changement grammatical de sujet présent dans le texte massorétique.
translation_notes:
  register: Français international actuel, digne et accessible. Le redoublement « Moi, moi » garde l’emphase hébraïque. « Mener son entreprise à bien » évite le calque peu naturel « faire prospérer sa voie », tandis que la note en conserve la forme littérale et l’ambiguïté d’interprétation.
