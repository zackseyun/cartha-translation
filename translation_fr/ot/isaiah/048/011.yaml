source:
  edition: WLC
  text: לְמַעֲנִ֧/י לְמַעֲנִ֛/י אֶעֱשֶׂ֖ה כִּ֣י אֵ֣יךְ יֵחָ֑ל וּ/כְבוֹדִ֖/י לְ/אַחֵ֥ר לֹֽא אֶתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
translation:
  language: fr
  text: C’est pour moi-même, pour moi-même, que j’agirai, car comment cela serait-il profané[a] ? Et ma gloire, je ne la donnerai pas à un autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car comment mon nom serait-il profané ? » L’hébreu ne précise pas explicitement ce qui serait profané.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲנִי
  choice: pour moi-même
  rationale: La locution לְמַעַן avec le suffixe de première personne exprime ici le motif de l’action. « Pour moi-même », répété comme en hébreu, rend l’insistance réflexive dans un français naturel.
- source_word: אֶעֱשֶׂה
  choice: j’agirai
  rationale: Le verbe עשה est employé sans complément exprimé. « J’agirai » restitue cette construction et l’idée d’une intervention résolue sans préciser indûment l’action.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la justification de la déclaration précédente ; « car » conserve clairement cette valeur explicative.
- source_word: אֵיךְ
  choice: comment
  rationale: L’interrogatif ouvre une question rhétorique. En français, « comment serait-il… ? » en exprime naturellement la force.
- source_word: יֵחָל
  choice: serait-il profané
  rationale: Le niphal de חלל signifie « être profané ». Le référent n’étant pas exprimé dans le texte hébreu, le pronom « il » maintient cette ellipse, tandis que le conditionnel traduit bien la portée rhétorique de la question.
- source_word: וּכְבוֹדִי
  choice: Et ma gloire
  rationale: כָּבוֹד désigne ici la gloire ou l’honneur divins. « Gloire » convient au contexte et la dislocation « ma gloire, je ne la… » garde la mise en relief de l’élément placé en tête.
- source_word: לְאַחֵר
  choice: à un autre
  rationale: אַחֵר désigne un autre être ou prétendant sans l’identifier davantage. « À un autre » conserve cette indétermination et la concision de l’hébreu.
- source_word: אֶתֵּן
  choice: je ne la donnerai pas
  rationale: נתן a son sens courant de « donner ». Le pronom « la », nécessaire à la reprise disloquée en français, renvoie sans ambiguïté à « ma gloire ».
theological_decisions:
- issue: Référent implicite de יֵחָל (« serait profané »)
  choice: Ne pas ajouter « mon nom » dans le texte principal.
  alternative: « car comment mon nom serait-il profané ? »
  rationale: L’hébreu n’exprime pas le référent de la forme verbale. « Mon nom » est une explicitation plausible, notamment à la lumière du contexte, mais l’introduire dans le texte principal lèverait une ambiguïté réelle. La formulation elliptique et une note préservent à la fois le texte source et l’interprétation courante.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition initiale est maintenue pour son emphase, et la dislocation finale souligne « ma gloire » sans alourdir la phrase.
