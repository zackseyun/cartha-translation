id: ISA.48.4
reference: Isaiah 48:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/דַּעְתִּ֕/י כִּ֥י קָשֶׁ֖ה אָ֑תָּה וְ/גִ֤יד בַּרְזֶל֙ עָרְפֶּ֔/ךָ וּ/מִצְחֲ/ךָ֖ נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/004.yaml
  text: Because I knew that you are stubborn[a], and your neck is an iron sinew, and your forehead is bronze[c][b],
translation:
  language: fr
  text: Puisque je savais que tu es obstiné[a], que ton cou est un tendon de fer[b] et que ton front est de bronze[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dur » ou « inflexible ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ton cou est un tendon de fer ». Cette image évoque une résistance obstinée.'
    reason: cultural_note
  - marker: c
    text: L’image du front de bronze évoque un endurcissement qui ne cède pas.
    reason: cultural_note
lexical_decisions:
- source_word: מִדַּעְתִּי כִּי
  choice: Puisque je savais que
  rationale: La préposition מִן dans מִדַּעְתִּי donne ici à la proposition une valeur causale liée au contexte précédent, tandis que כִּי introduit ce qui est su. « Puisque je savais que » rend naturellement cette articulation en français.
- source_word: קָשֶׁה
  choice: obstiné
  rationale: L’adjectif signifie littéralement « dur », mais appliqué ici à une personne dans un reproche prophétique, il exprime l’obstination. « Obstiné » conserve cette portée morale sans aplatir l’image qui suit.
- source_word: וְגִיד בַּרְזֶל
  choice: un tendon de fer
  rationale: גִּיד désigne un tendon ou un nerf. « Tendon de fer » est concret, compréhensible en français moderne et préserve la métaphore corporelle du texte.
- source_word: עָרְפֶּךָ
  choice: ton cou
  rationale: Le terme peut désigner la nuque, mais « cou » est naturel dans l’image de la raideur obstinée et évite une précision anatomique inutile.
- source_word: וּמִצְחֲךָ
  choice: et que ton front
  rationale: מֵצַח désigne le front. La répétition de « que » clarifie en français la coordination des trois éléments connus du locuteur.
- source_word: נְחוּשָׁה
  choice: de bronze
  rationale: Le mot désigne le cuivre ou le bronze. « Bronze » convient à l’image de dureté et constitue ici l’équivalent contextuel le plus naturel.
theological_decisions:
- issue: Description métaphorique de la rébellion d’Israël
  choice: 'Conserver les images corporelles et métalliques : « ton cou est un tendon de fer » et « ton front est de bronze ».'
  alternative: 'Expliciter : « tu refuses de plier et tu n’as aucune honte ».'
  rationale: L’hébreu formule le reproche au moyen d’images concrètes qui évoquent l’obstination et l’endurcissement. Les conserver maintient la vigueur poétique et laisse au lecteur leur portée sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à la deuxième personne masculine singulière de l’hébreu. Les métaphores corporelles sont maintenues; « tendon » est préféré à « nerf » pour la précision anatomique et la clarté. La ponctuation finale reste une virgule afin de respecter la continuité syntaxique indiquée par le texte de consultation.
