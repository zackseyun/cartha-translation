id: ISA.48.8
reference: Isaiah 48:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
translation:
  language: fr
  text: Tu n’en avais vraiment rien entendu, tu n’en savais vraiment rien, et depuis longtemps, ton oreille ne s’était pas ouverte. Car je savais que tu agirais assurément en traître et que, dès le ventre maternel[a], on t’appellerait « rebelle »[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dès le ventre ». L’expression peut désigner le tout premier commencement de la vie, autrement dit « dès la naissance ».'
    reason: Préciser l’image hébraïque et son emploi idiomatique sans trancher sa portée théologique.
  - marker: b
    text: 'Ou : « transgresseur ». Le mot hébreu désigne quelqu’un qui se révolte ou rompt la fidélité due.'
    reason: Préserver une autre nuance lexicale importante de פֹשֵׁעַ.
lexical_decisions:
- source_word: גַּם לֹא
  choice: tu n’en avais rien… tu n’en savais rien
  rationale: La triple reprise hébraïque produit une accumulation emphatique. En français, la répétition de « rien » puis la troisième proposition coordonnée rendent cette insistance sans alourdir le verset par trois « en effet ».
- source_word: שָׁמַעְתָּ
  choice: tu n’en avais rien entendu
  rationale: Le plus-que-parfait situe cette absence d’information avant l’annonce évoquée dans le contexte ; « en » donne au français une tournure naturelle.
- source_word: יָדַעְתָּ
  choice: tu n’en savais rien
  rationale: Cette formulation conserve le sens cognitif de ידע et forme un parallèle idiomatique avec « entendu ».
- source_word: מֵאָז
  choice: depuis longtemps
  rationale: L’expression indique une durée remontant loin dans le passé. « Depuis longtemps » est naturel en français tout en gardant cette profondeur temporelle.
- source_word: פִתְּחָה אָזְנֶךָ
  choice: ton oreille ne s’était pas ouverte
  rationale: La formulation conserve l’image et suit la construction hébraïque où « oreille » est le sujet, sans expliciter si l’ouverture désigne la réceptivité ou la révélation.
- source_word: בָּגוֹד תִּבְגּוֹד
  choice: tu agirais bel et bien en traître
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action. « Bel et bien » transmet cette insistance, tandis que « agir en traître » rend le champ sémantique de la perfidie et de la rupture de fidélité.
- source_word: מִבֶּטֶן
  choice: dès le ventre maternel
  rationale: La traduction garde l’image concrète de l’hébreu et son sens temporel, celui du tout premier commencement de la vie.
- source_word: פֹשֵׁעַ
  choice: rebelle
  rationale: Le participe substantivé désigne celui qui se révolte ou rompt avec l’autorité. « Rebelle » est direct, actuel et convient à l’adresse collective à Israël.
- source_word: קֹרָא לָךְ
  choice: on t’appellerait
  rationale: Le tour impersonnel français exprime naturellement l’attribution d’un nom ou d’une qualification, sans identifier un agent que l’hébreu ne précise pas.
theological_decisions:
- issue: « Dès le ventre maternel » décrit-il une culpabilité prénatale littérale ou la rébellion ancienne et persistante d’Israël ?
  choice: Conserver littéralement l’image dans le texte et signaler seulement sa portée temporelle possible en note.
  alternative: Paraphraser « depuis ta naissance » ou formuler explicitement une doctrine de culpabilité dès la conception.
  rationale: Le prophète s’adresse collectivement à Israël/Jacob et emploie une image des origines. La traduction ne doit ni effacer cette image ni lui imposer une précision doctrinale que le verset ne formule pas.
- issue: Portée de פֹשֵׁעַ dans le cadre de l’alliance
  choice: « rebelle », avec l’alternative « transgresseur » en note.
  alternative: « transgresseur » dans le texte principal.
  rationale: « Rebelle » rend clairement la défiance et la rupture de fidélité en français courant, tandis que la note préserve la valeur de transgression attachée au terme.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme initial reste audible, l’image de l’oreille qui ne s’ouvre pas est conservée, et l’intensification hébraïque est rendue par « bel et bien ».
