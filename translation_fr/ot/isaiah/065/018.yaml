source:
  edition: WLC
  text: כִּֽי אִם שִׂ֤ישׂוּ וְ/גִ֨ילוּ֙ עֲדֵי עַ֔ד אֲשֶׁ֖ר אֲנִ֣י בוֹרֵ֑א כִּי֩ הִנְ/נִ֨י בוֹרֵ֧א אֶת יְרוּשָׁלִַ֛ם גִּילָ֖ה וְ/עַמָּ֥/הּ מָשֽׂוֹשׂ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
translation:
  language: fr
  text: 'Mais soyez dans l’allégresse et réjouissez-vous à jamais de ce que je crée ! Car voici[a] : je crée Jérusalem pour l’allégresse, et son peuple pour la joie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « je crée Jérusalem comme une allégresse, et son peuple comme une joie ».'
    reason: Les noms hébreux peuvent être compris soit comme exprimant la destination (« pour l’allégresse / la joie »), soit comme des attributs prédicatifs ou résultatifs.
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: La locution marque ici un contraste avec l’interdiction de se rappeler les réalités anciennes au verset précédent. « Mais » exprime naturellement cette opposition.
- source_word: שִׂישׂוּ וְגִילוּ
  choice: soyez dans l’allégresse et réjouissez-vous
  rationale: Deux expressions distinctes rendent le doublet synonymique hébreu et son intensification poétique, sans répétition maladroite en français.
- source_word: עֲדֵי עַד
  choice: à jamais
  rationale: Cette expression idiomatique rend la durée sans fin dans un registre actuel et digne.
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  choice: de ce que je crée
  rationale: La relative désigne l’objet ou le motif de la joie. Le présent français conserve la valeur vive du participe hébreu.
- source_word: הִנְנִי
  choice: voici
  rationale: « Voici » garde la force de l’annonce divine solennelle tout en étant plus naturel en français moderne que « voici que » dans cette construction.
- source_word: בוֹרֵא
  choice: je crée
  rationale: Le présent rend le participe hébreu, qui présente l’action divine comme en cours ou imminente dans le discours prophétique.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française conventionnelle du nom de la ville.
- source_word: גִּילָה
  choice: pour qu’elle soit allégresse
  rationale: Cette formulation conserve la valeur prédicative ou résultative du nom tout en produisant un français intelligible et poétique.
- source_word: וְעַמָּהּ
  choice: et son peuple
  rationale: Le possessif renvoie naturellement à Jérusalem, nom féminin en français comme en hébreu.
- source_word: מָשׂוֹשׂ
  choice: pour qu’il soit joie
  rationale: La formulation parallèle préserve l’image du peuple constitué en joie et la structure poétique du texte.
theological_decisions:
- issue: Valeur des noms prédicatifs גִּילָה et מָשׂוֹשׂ après ברא
  choice: Jérusalem est créée pour être allégresse, et son peuple pour être joie
  alternative: Jérusalem est créée comme sujet d’allégresse, et son peuple comme sujet de joie
  rationale: L’hébreu permet une lecture prédicative ou résultative, mais aussi une nuance de destination ou de cause. Le texte principal conserve l’idée de transformation en évitant le tour peu naturel « créer comme allégresse » ; la note signale l’autre compréhension possible sans trancher la tension.
translation_notes:
  register: Français international moderne, poétique et digne. L’exclamation soutient les impératifs de joie ; « à jamais » et « voici » maintiennent le ton prophétique sans archaïsme excessif. Le marqueur [a] figure dans le texte principal.
