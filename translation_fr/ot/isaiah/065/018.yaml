    text: 'Autre traduction : « je crée Jérusalem comme une allégresse, et son peuple comme une joie ».'
    reason: Les noms hébreux peuvent être compris soit comme exprimant la destination (« pour l’allégresse / la joie »), soit comme des attributs prédicatifs ou résultatifs.
  revision_rationale: La révision remplace les subordonnées finales par deux groupes nominaux parallèles. Elle conserve ainsi le caractère poétique, la concision et l’ambiguïté contrôlée de l’hébreu, sans imposer une lecture doctrinale ou causalement plus précise. La note documente l’autre possibilité de lecture avec un ancrage maintenu après « voici ».
