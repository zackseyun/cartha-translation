source:
  edition: WLC
  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
translation:
  language: fr
  text: le peuple qui me provoque sans cesse sous mes yeux, qui offre des sacrifices dans les jardins et fait brûler de l’encens sur les briques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner des installations cultuelles ou des autels construits en briques et employés pour un culte condamné ici.
    reason: Précision sur le référent probable d’une expression hébraïque concrète mais ambiguë.
lexical_decisions:
- source_word: הָעָם
  choice: le peuple
  rationale: L’article défini désigne un groupe déterminé déjà présent dans le contexte. « Le peuple » conserve la valeur collective sans préciser indûment « nation ».
- source_word: הַמַּכְעִיסִים
  choice: qui … me provoque
  rationale: Le hifil de כעס exprime l’action de provoquer à la colère. « Provoquer » rend la dimension active et défiante du comportement.
- source_word: עַל־פָּנַי
  choice: en face
  rationale: Littéralement « sur ma face ». Dans ce reproche, « en face » conserve l’idée d’un affront ouvert commis dans la présence même de Dieu.
- source_word: תָּמִיד
  choice: sans cesse
  rationale: Cette locution française naturelle exprime la continuité et la répétition marquées par l’adverbe hébreu.
- source_word: זֹבְחִים
  choice: qui offre des sacrifices
  rationale: Le participe décrit une pratique cultuelle répétée. Cette formulation explicite naturellement en français le sens rituel du verbe.
- source_word: בַּגַּנּוֹת
  choice: dans les jardins
  rationale: La traduction locative directe préserve l’image des jardins sans transformer explicitement ceux-ci en sanctuaires.
- source_word: וּמְקַטְּרִים
  choice: et fait brûler de l’encens
  rationale: Dans ce contexte cultuel, le piel de קטר désigne l’action de brûler de l’encens ou de produire une fumée sacrificielle. « Faire brûler de l’encens » est clair et idiomatique.
- source_word: עַל־הַלְּבֵנִים
  choice: sur les briques
  rationale: Le nom hébreu désigne explicitement des briques, non des autels. La traduction conserve donc la formulation concrète et son ambiguïté, tandis que la note indique le référent cultuel probable.
theological_decisions:
- issue: Nature des לְבֵנִים dans le cadre cultuel
  choice: sur les briques
  alternative: sur des autels en briques
  rationale: Les sacrifices et l’encens indiquent vraisemblablement des installations cultuelles, peut-être des autels construits en briques. Toutefois, le texte nomme seulement les briques; ajouter « autels » dans le corps du verset résoudrait une ambiguïté que l’hébreu laisse ouverte.
translation_notes:
  register: Français moderne, courant et digne. Le singulier verbal français s’accorde avec le nom collectif « le peuple », alors que les participes hébreux sont au pluriel. La reprise de « qui » clarifie la construction sans effacer le mouvement participial du texte.
