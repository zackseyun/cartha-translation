source:
  edition: WLC
  text: לֹ֤א יִֽיגְעוּ֙ לָ/רִ֔יק וְ/לֹ֥א יֵלְד֖וּ לַ/בֶּהָלָ֑ה כִּ֣י זֶ֜רַע בְּרוּכֵ֤י יְהוָה֙ הֵ֔מָּה וְ/צֶאֱצָאֵי/הֶ֖ם אִתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
translation:
  language: fr
  text: Ils ne peineront pas pour rien et ne mettront pas au monde des enfants voués au malheur[a], car ils sont la descendance de ceux que Yahweh a bénis, et leurs descendants seront avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des enfants destinés à l’épouvante » ou « à un désastre soudain ». Le mot hébreu peut désigner la panique, l’épouvante ou une catastrophe soudaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיגְעוּ
  choice: peineront
  rationale: Le verbe יגע exprime un travail pénible ou épuisant. « Peiner » restitue naturellement l’effort soutenu.
- source_word: לָרִיק
  choice: pour rien
  rationale: רִיק évoque le vide et, dans ce contexte, l’absence de résultat. « Pour rien » exprime clairement un labeur infructueux.
- source_word: יֵלְדוּ
  choice: mettront au monde des enfants
  rationale: Le verbe ילד désigne ici le fait d’engendrer ou de donner naissance. Cette formulation inclusive convient à la communauté entière.
- source_word: לַבֶּהָלָה
  choice: voués au malheur
  rationale: בֶּהָלָה peut évoquer l’épouvante, la panique ou un désastre soudain. Avec ילד, la tournure française « enfants voués au malheur » exprime idiomatiquement la destinée tragique niée par le verset, sans réduire le terme à la seule émotion de peur.
- source_word: זֶרַע
  choice: une descendance
  rationale: זֶרַע signifie littéralement « semence » et désigne fréquemment la postérité. « Descendance » conserve ici le sens collectif et familial.
- source_word: בְּרוּכֵי יְהוָה
  choice: bénie par Yahweh
  rationale: La construction désigne une descendance qui reçoit la bénédiction de Yahweh. L’accord au singulier avec le nom collectif « descendance » produit un français naturel.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: et leurs descendants
  rationale: צֶאֱצָאִים désigne ceux qui sont issus d’une personne, donc ses descendants. Le terme marque la continuité des générations.
- source_word: אִתָּם
  choice: seront avec eux
  rationale: L’hébreu dit littéralement « avec eux » sans répéter de verbe. En français, « seront » explicite naturellement l’ellipse et souligne la présence durable des descendants.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance plutôt que de le remplacer par un titre.
- issue: Rapport entre זֶרַע et בְּרוּכֵי יְהוָה
  choice: '« une descendance bénie par Yahweh » : la bénédiction qualifie la descendance elle-même'
  alternative: '« la descendance de ceux que Yahweh a bénis » : la bénédiction qualifie leurs ancêtres'
  rationale: La construction hébraïque peut être comprise comme « descendance de bénis de Yahweh » ou comme « descendance bénie de Yahweh ». La première lecture est grammaticalement défendable, mais le parallélisme avec « leurs descendants avec eux » et le caractère collectif de זֶרַע permettent la seconde. La note signale l’ambiguïté réelle au lieu de l’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. « Peiner » conserve l’idée d’effort; « pour rien » est plus idiomatique que « pour le vide ». La formulation évite le littéralisme obscur tout en conservant l’ambiguïté de la proposition causale dans une note.
