  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
translation:
  language: fr
  text: Il ne s’y trouvera plus de nourrisson qui ne vive que quelques jours[a], ni de vieillard qui n’aille pas au bout de ses jours. En effet, le jeune mourra à l’âge de cent ans, et le pécheur âgé de cent ans sera maudit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nourrisson de jours »; c’est-à-dire un nourrisson qui ne vit que quelques jours.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sera sous le coup d’une malédiction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: là
  rationale: Dans cette tournure existentielle, « là » est le rendu français naturel du lieu évoqué, tandis que le sens spatial de מִן est absorbé par l’expression française.
- source_word: עוּל יָמִים
  choice: nourrisson qui ne vive que quelques jours
  rationale: Littéralement « nourrisson de jours », l’expression désigne ici un nourrisson dont la vie ne dure que peu de jours. Le sens idiomatique figure dans le texte et l’image hébraïque en note.
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת יָמָיו
  choice: vieillard qui n’aille pas au bout de ses jours
  rationale: Cette formulation française naturelle conserve l’image de jours portés à leur plein accomplissement, c’est-à-dire d’une vie menée jusqu’à son terme.
- source_word: הַנַּעַר
  choice: le jeune
  rationale: נַעַר couvre plusieurs âges, du garçon au jeune homme. « Le jeune » garde cette relative indétermination et maintient le contraste paradoxal avec l’âge de cent ans.
- source_word: בֶּן מֵאָה שָׁנָה
  choice: à l’âge de cent ans / âgé de cent ans
  rationale: Il s’agit de la tournure hébraïque ordinaire indiquant l’âge; les deux formulations françaises conviennent aux syntagmes respectifs de la phrase.
- source_word: יָמוּת
  choice: mourra
  rationale: L’imparfait hébreu a ici une valeur future dans la description prophétique.
- source_word: הַחוֹטֵא
  choice: le pécheur
  rationale: Le participe substantivé désigne la personne caractérisée par le péché; « le pécheur » est concis et direct.
- source_word: יְקֻלָּל
  choice: sera maudit
  rationale: Le pual exprime le fait de subir une malédiction. « Sera maudit » garde la force judiciaire de l’énoncé dans un français actuel.
theological_decisions:
- issue: La présence de la mort et de la malédiction dans une prophétie de création renouvelée
  choice: Conserver directement « mourra » et « sera maudit »
  alternative: Interpréter la mort au sens figuré ou reformuler le verset afin de supprimer sa tension avec d’autres textes eschatologiques
  rationale: Le texte hébreu affirme explicitement la mort du jeune à cent ans et la malédiction du pécheur. La traduction laisse cette tension théologique ouverte au lieu de la résoudre.
- issue: Le caractère paradoxal du « jeune » qui meurt à cent ans
  choice: Maintenir la formulation paradoxale du texte
  alternative: 'Paraphraser: « celui qui mourra à cent ans sera considéré comme jeune »'
  rationale: La paraphrase explicite une interprétation plausible, mais la syntaxe hébraïque dit plus directement que « le jeune mourra à cent ans ». Le texte principal préserve donc cette formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase privilégie une syntaxe naturelle tout en conservant le paradoxe du jeune qui meurt à cent ans et la force de la malédiction.
