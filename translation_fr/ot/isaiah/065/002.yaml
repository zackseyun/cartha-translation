  text: פֵּרַ֧שְׂתִּי יָדַ֛/י כָּל הַ/יּ֖וֹם אֶל עַ֣ם סוֹרֵ֑ר הַ/הֹלְכִים֙ הַ/דֶּ֣רֶךְ לֹא ט֔וֹב אַחַ֖ר מַחְשְׁבֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/002.yaml
  text: I spread out my hands all day long to a rebellious people[a], who walk in a way that is not good[c][b], following their own thoughts.
translation:
  language: fr
  text: J’ai tendu les mains[a] tout au long du jour vers un peuple rebelle[b], qui suit une voie qui n’est pas bonne et suit ses propres pensées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « J’ai déployé mes mains »; on peut aussi comprendre « J’ai gardé les mains tendues ».
    reason: lexical_alternative
  - marker: b
    text: Ou « rétif » ou « obstiné ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ses propres projets » ou « ses propres desseins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי יָדַי
  choice: J’ai tendu les mains
  rationale: Le piel de פרשׂ décrit ici le déploiement ou l’extension des mains. « Tendre les mains » conserve le geste concret tout en étant naturel en français; l’article défini est idiomatique avec une partie du corps dont le possesseur est déjà indiqué par le sujet.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette formulation exprime une action qui se prolonge pendant toute la journée, dans un français actuel et soutenu.
- source_word: אֶל עַם סוֹרֵר
  choice: vers un peuple rebelle
  rationale: « Vers » garde la direction du geste exprimée par אֶל. « Rebelle » rend la résistance et le refus d’obéir que peut exprimer סוֹרֵר.
- source_word: הַהֹלְכִים הַדֶּרֶךְ
  choice: qui marche sur un chemin
  rationale: La traduction maintient la métaphore de la marche comme conduite habituelle. Le singulier français assure l’accord naturel avec le nom collectif « peuple ».
- source_word: לֹא טוֹב
  choice: qui n’est pas bon
  rationale: Cette traduction reproduit la négation de « bon » sans la renforcer en « mauvais », « méchant » ou « mauvais chemin ».
- source_word: אַחַר מַחְשְׁבֹתֵיהֶם
  choice: en suivant ses propres pensées
  rationale: אַחַר indique ce que le peuple suit, et מַחְשָׁבוֹת peut désigner des pensées, des projets ou des desseins. « Propres » explicite naturellement en français le caractère autoréférentiel du possessif.
theological_decisions:
- issue: L’attitude de Dieu envers un peuple désobéissant
  choice: Conserver l’image corporelle de Dieu qui tend les mains avec persistance.
  alternative: Paraphraser par « Je n’ai cessé de faire appel à eux ».
  rationale: L’image anthropomorphique appartient au texte et laisse subsister la tension entre l’initiative persistante de Dieu et la rébellion du peuple, sans préciser arbitrairement si le geste exprime surtout l’appel, l’accueil ou la supplication.
- issue: L’évaluation morale du chemin suivi
  choice: Traduire לֹא טוֹב par « qui n’est pas bon ».
  alternative: Employer « mauvais » ou « mauvais chemin ».
  rationale: L’hébreu nie le qualificatif « bon ». Garder cette formulation évite de durcir ou de préciser davantage l’évaluation portée par le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la métaphore hébraïque du chemin et le geste concret des mains, tout en évitant les tournures artificiellement archaïques.
