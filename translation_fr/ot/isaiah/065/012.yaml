  terminology: « Destiner à l’épée » préserve bien l’écho possible avec le Destin du verset précédent, sans imposer un sens doctrinal. « Courber » rend convenablement כרע sans imposer la prosternation cultuelle ou l’effondrement. « Ce que je n’aimais pas » rend naturellement la désapprobation exprimée par חפץ dans le cadre passé de l’accusation.
