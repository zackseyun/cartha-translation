  text: וּ/מָנִ֨יתִי אֶתְ/כֶ֜ם לַ/חֶ֗רֶב וְ/כֻלְּ/כֶם֙ לַ/טֶּ֣בַח תִּכְרָ֔עוּ יַ֤עַן קָרָ֨אתִי֙ וְ/לֹ֣א עֲנִיתֶ֔ם דִּבַּ֖רְתִּי וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בְּחַרְתֶּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
translation:
  language: fr
  text: Je vous destinerai à l’épée[a], et vous vous courberez tous pour le massacre[b], parce que j’ai appelé et que vous n’avez pas répondu ; j’ai parlé et vous n’avez pas écouté[c]. Vous avez fait ce qui est mal à mes yeux et vous avez choisi ce que je n’aimais pas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je vous assignerai » ou « Je vous compterai ». Le verbe hébreu peut aussi former un jeu de mots avec le « Destin » du verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous vous agenouillerez » ou « vous vous effondrerez ». Le verbe hébreu désigne littéralement l’action de plier le genou ; dans ce contexte, il peut évoquer l’affaissement sous le jugement.
    reason: lexical_alternative
  - marker: c
    text: Ou « vous n’avez pas entendu » ; le verbe hébreu peut aussi impliquer « vous n’avez pas obéi ».
    reason: lexical_alternative
  - marker: d
    text: Ou « ce que je ne désirais pas » ou « ce en quoi je ne prenais aucun plaisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי
  choice: Je vous destinerai
  rationale: Le verbe מנה peut signifier compter, assigner ou destiner. « Destiner » exprime ici l’assignation au jugement et conserve l’écho ironique possible avec la divinité « Destin » mentionnée au verset précédent.
- source_word: לַחֶרֶב
  choice: à l’épée
  rationale: Expression française naturelle indiquant que les destinataires seront livrés à une mort violente, tout en conservant l’image concrète de l’hébreu.
- source_word: לַטֶּבַח
  choice: pour être égorgés
  rationale: טבח désigne l’abattage ou l’égorgement. La tournure verbale est plus naturelle en français dans cette construction et garde toute la force du jugement.
- source_word: תִּכְרָעוּ
  choice: vous ploierez le genou
  rationale: כרע décrit littéralement le fait de plier le genou. Cette formulation préserve l’image corporelle, qui peut évoquer ici l’effondrement sous le jugement sans l’expliciter dans le texte.
- source_word: יַעַן
  choice: parce que
  rationale: Introduit directement le motif du jugement.
- source_word: קָרָאתִי ... עֲנִיתֶם
  choice: j’ai appelé et vous n’avez pas répondu
  rationale: Préserve avec simplicité la correspondance entre l’appel divin et l’absence de réponse.
- source_word: דִּבַּרְתִּי ... שְׁמַעְתֶּם
  choice: j’ai parlé et vous n’avez pas écouté
  rationale: « Écouté » rend la réception volontaire impliquée par שמע sans réduire le terme à la simple audition ni expliciter entièrement l’idée d’obéissance.
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Vous avez fait ce qui est mal à mes yeux
  rationale: Conserve l’idiome évaluatif hébreu dans une formulation claire et courante en français moderne.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  choice: vous avez choisi ce à quoi je ne prends aucun plaisir
  rationale: חפץ peut exprimer le désir, le plaisir ou la satisfaction. Cette traduction garde la dimension personnelle du désaveu divin sans en préciser excessivement la nuance.
theological_decisions:
- issue: Force et portée du langage de jugement divin
  choice: « Je vous destinerai à l’épée […] vous ploierez le genou pour être égorgés »
  alternative: « Je vous compterai pour l’épée […] vous vous effondrerez pour le massacre »
  rationale: La formulation maintient l’action judiciaire explicite de Dieu et la violence des images, sans développer une doctrine de la prédestination ni préciser un scénario militaire absent du texte.
- issue: Portée de שמע
  choice: « vous n’avez pas écouté »
  alternative: « vous n’avez pas entendu » ou « vous n’avez pas obéi »
  rationale: « Écouté » conserve à la fois le cadre auditif du parallélisme et l’idée d’un refus coupable, tout en laissant implicite la conséquence d’obéissance.
- issue: Image exprimée par כרע
  choice: « vous ploierez le genou »
  alternative: « vous vous prosternerez », « vous vous agenouillerez » ou « vous vous effondrerez »
  rationale: Le choix garde le geste concret et son ambiguïté entre agenouillement et affaissement sous le jugement, sans lui donner artificiellement un sens cultuel.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme parallèle de l’hébreu est conservé, avec répétition des pronoms pour souligner l’universalité du jugement. Les images concrètes ne sont ni adoucies ni développées au-delà du texte source.
