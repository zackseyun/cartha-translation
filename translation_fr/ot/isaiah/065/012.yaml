  source_fidelity: 'Le sens général est fidèle : Dieu assigne les destinataires à l’épée, l’accusation est fondée sur leur refus de répondre et d’écouter, puis sur leur choix du mal. Toutefois, « être égorgés » restreint טֶבַח à une modalité précise de mise à mort (égorgement), tandis que le terme hébreu désigne plus largement le massacre ou l’abattage. « Pour le massacre » conserve mieux l’image et le parallélisme avec « à l’épée ».'
