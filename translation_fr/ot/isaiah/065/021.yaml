source:
  edition: WLC
  text: וּ/בָנ֥וּ בָתִּ֖ים וְ/יָשָׁ֑בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/אָכְל֖וּ פִּרְיָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
translation:
  language: fr
  text: Ils bâtiront des maisons et les habiteront ; ils planteront des vignes et en mangeront le fruit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנוּ
  choice: Ils bâtiront
  rationale: Le qal accompli, dans cette suite prophétique, exprime une promesse future. « Bâtir » restitue directement בנה dans un registre digne et courant.
- source_word: בָתִּים
  choice: des maisons
  rationale: Le pluriel concret de בית est conservé ; « maisons » n’ajoute pas la nuance affective de « foyers ».
- source_word: וְיָשָׁבוּ
  choice: les habiteront
  rationale: ישב signifie ici demeurer ou habiter. « Les habiteront » est naturel en français, reprend clairement « maisons » et conserve le sens concret.
- source_word: וְנָטְעוּ
  choice: ils planteront
  rationale: נטע signifie « planter » ; le futur français convient à la portée prophétique de la forme verbale.
- source_word: כְרָמִים
  choice: des vignes
  rationale: Dans l’usage français courant, « planter des vignes » désigne naturellement l’établissement de vignobles. « Vignobles » serait possible, mais s’emploie moins naturellement comme objet de « planter ».
- source_word: וְאָכְלוּ
  choice: mangeront
  rationale: אכל signifie concrètement « manger » ; cette traduction évite l’élargissement interprétatif de « jouiront de ».
- source_word: פִּרְיָם
  choice: en mangeront le fruit
  rationale: פרי désigne le fruit ou le produit. Le pronom adverbial « en » rattache naturellement le fruit aux vignes, tandis que le singulier collectif français correspond au nom hébreu.
theological_decisions:
- issue: Valeur temporelle des accomplis prophétiques
  choice: Traduire la suite par des futurs de promesse
  alternative: Employer des passés simples ou des passés composés
  rationale: Le contexte de restauration décrit l’avenir promis au peuple. Le futur français communique cette portée sans transformer la promesse en récit passé.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux propositions est conservé. « Bâtiront » maintient une légère élévation de registre biblique sans archaïsme ; « habiteront » reste précis et naturel.
