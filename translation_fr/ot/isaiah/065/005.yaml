source:
  edition: WLC
  text: הָ/אֹֽמְרִים֙ קְרַ֣ב אֵלֶ֔י/ךָ אַל תִּגַּשׁ בִּ֖/י כִּ֣י קְדַשְׁתִּ֑י/ךָ אֵ֚לֶּה עָשָׁ֣ן בְּ/אַפִּ֔/י אֵ֥שׁ יֹקֶ֖דֶת כָּל הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
translation:
  language: fr
  text: 'qui disent : « Reste à l’écart, ne t’approche pas de moi, car je suis plus saint que toi[a]. » Ceux-là sont une fumée dans mes narines, un feu qui brûle toute la journée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car je suis trop saint pour toi », ou : « car je me suis tenu saint, loin de toi ». La proposition hébraïque est difficile et exprime une prétention à la supériorité rituelle ou morale.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: qui disent
  rationale: Le participe substantivé poursuit la description des personnes évoquées au verset précédent ; une proposition relative est naturelle en français.
- source_word: קְרַב אֵלֶיךָ
  choice: Reste à l’écart
  rationale: La tournure hébraïque est inhabituelle et exprime ici un ordre de garder ses distances. Cette formulation française rend clairement le rejet sans reproduire une construction obscure.
- source_word: אַל תִּגַּשׁ בִּי
  choice: ne t’approche pas de moi
  rationale: נגשׁ avec ב indique l’action de s’approcher de quelqu’un. Le français conserve directement la force d’exclusion.
- source_word: כִּי קְדַשְׁתִּיךָ
  choice: car je suis plus saint que toi
  rationale: La forme hébraïque est difficile. Dans le contexte, elle exprime une prétention arrogante à une sainteté supérieure et à la séparation rituelle ou morale ; une note conserve les autres analyses possibles.
- source_word: אֵלֶּה
  choice: Ceux-là
  rationale: Le démonstratif renvoie avec une nuance accusatrice aux personnes qui viennent de parler.
- source_word: עָשָׁן בְּאַפִּי
  choice: une fumée dans mes narines
  rationale: L’image concrète de la fumée irritante est conservée ; אַף peut évoquer aussi la colère, mais son sens corporel structure ici la métaphore.
- source_word: אֵשׁ יֹקֶדֶת
  choice: un feu qui brûle
  rationale: Cette formulation rend simplement le participe et maintient l’image d’une irritation persistante.
- source_word: כָּל הַיּוֹם
  choice: toute la journée
  rationale: Équivalent français courant de l’expression de durée, qui souligne la continuité.
theological_decisions:
- issue: Interprétation de כִּי קְדַשְׁתִּיךָ
  choice: car je suis plus saint que toi
  alternative: car je suis trop saint pour toi ; car je me suis tenu saint, loin de toi
  rationale: La proposition est grammaticalement difficile et admet plusieurs compréhensions. Le texte principal rend la prétention à la supériorité religieuse que le contexte condamne, sans présenter cette prétention comme vraie ; la note préserve l’ambiguïté de l’hébreu.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste abrupt et méprisant ; les images concrètes de la fumée dans les narines et du feu continuellement brûlant sont préservées.
