id: ISA.65.24
reference: Isaiah 65:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֥ה טֶֽרֶם יִקְרָ֖אוּ וַ/אֲנִ֣י אֶעֱנֶ֑ה ע֛וֹד הֵ֥ם מְדַבְּרִ֖ים וַ/אֲנִ֥י אֶשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/024.yaml
  text: And it will happen that before they call[a], I will answer; while they are still speaking[b], I will hear.
translation:
  language: fr
  text: Et il arrivera qu’avant qu’ils appellent[a], moi, je répondrai ; alors qu’ils parleront encore[b], moi, j’entendrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils crient ». Le verbe peut désigner le fait d’appeler ou de lancer un cri, notamment pour adresser une demande à Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tandis qu’ils parlent encore ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et il arrivera
  rationale: Cette formule française naturelle conserve la valeur prospective de la tournure prophétique sans employer une expression archaïque.
- source_word: טֶרֶם
  choice: avant
  rationale: L’adverbe situe clairement la réponse divine avant même l’appel.
- source_word: יִקְרָאוּ
  choice: ils appellent
  rationale: « Appeler » garde l’étendue du verbe hébreu, qui peut désigner un appel ou un cri adressé à Dieu, sans expliciter davantage la prière.
- source_word: אֶעֱנֶה
  choice: je répondrai
  rationale: « Répondre » rend directement le verbe hébreu et forme un couple naturel avec « appeler ».
- source_word: עוֹד
  choice: encore
  rationale: Le mot marque ici une action toujours en cours au moment où Dieu entend.
- source_word: מְדַבְּרִים
  choice: ils parleront
  rationale: Le participe hébreu exprime la continuité de leur parole ; la proposition introduite par « alors que » la restitue naturellement en français.
- source_word: אֶשְׁמָע
  choice: j’entendrai
  rationale: « Entendre » préserve le sens premier du verbe sans préciser si l’accent porte sur l’écoute attentive ou sur l’exaucement.
theological_decisions:
- issue: Faut-il rendre explicite le contexte de la prière ?
  choice: Conserver les termes généraux « appeler », « répondre » et « entendre ».
  alternative: « Avant qu’ils prient, je les exaucerai » ou « pendant qu’ils parleront encore, je les écouterai ».
  rationale: Le contexte évoque fortement la prière et la réponse de Dieu, mais l’hébreu emploie des verbes plus larges. La formulation retenue préserve cette ouverture et n’ajoute ni « prier » ni « exaucer ».
- issue: Valeur de אֶשְׁמָע dans la promesse divine
  choice: j’entendrai
  alternative: je les écouterai / je les exaucerai
  rationale: '« J’entendrai » conserve la formulation hébraïque et sa tension : dans ce contexte, entendre implique une attention favorable, mais le texte ne recourt pas au verbe explicite « exaucer ».'
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « moi, je » reflète la présence insistante du pronom hébreu וַאֲנִי dans les deux propositions et souligne, sans surcharge interprétative, l’initiative et la promptitude de Dieu.
