  to: 'Ainsi parle Yahweh :


    « De même que l’on trouve du vin nouveau[a] dans une grappe

    et que l’on dit : “Ne le détruis pas,

    car il y a en lui une bénédiction”,

    ainsi j’agirai pour le bien de mes serviteurs,

    afin de ne pas tout détruire[b]. »'
  rationale: La révision rétablit le lien grammatical avec « vin nouveau », préserve l’objet non exprimé de la dernière proposition, et rend plus nettement la comparaison hébraïque. Elle ne modifie pas le sens général de préservation en faveur des serviteurs de Yahweh.
