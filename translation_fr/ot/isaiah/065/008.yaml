    rationale: « Ne la détruis pas, car elle contient une bénédiction » fait de la grappe l’objet explicite. Or le suffixe masculin -הוּ et בּוֹ se rapporte le plus naturellement à תִּירוֹשׁ, « vin nouveau », masculin. Une formulation française sans pronom genré conserve mieux ce rapport.
  - severity: medium
    issue: Objet implicite de הַשְׁחִית הַכֹּל
    rationale: « Ne pas les détruire tous » explicite un référent humain plausible contextuellement, mais absent de la syntaxe hébraïque. « Ne pas tout détruire » maintient l’ambiguïté du texte source.
  - severity: low
    issue: Valeur comparative de כַּאֲשֶׁר … כֵּן
    rationale: La construction « De même que … ainsi » marque explicitement et naturellement l’analogie présente dans l’hébreu.
