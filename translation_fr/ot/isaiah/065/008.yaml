base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « De même que l’on trouve du vin nouveau[a] dans une grappe

    et que l’on dit : “Ne le détruis pas,

    car il y a en lui une bénédiction”,

    ainsi j’agirai pour le bien de mes serviteurs,

    afin de ne pas tout détruire[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vin frais » ; le mot hébreu désigne spécifiquement le vin nouveau.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « afin de ne pas détruire le tout » ; l’objet demeure implicite en hébreu. Dans le contexte, il peut désigner le peuple ou l’ensemble visé par le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français moderne.
- source_word: כַּאֲשֶׁר
  choice: Quand
  rationale: Introduit ici la situation qui sert de comparaison, reprise par « alors… de même ».
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: Désigne plus précisément le vin nouveau ou le produit frais de la vigne, et non le vin de manière générique.
- source_word: אֶשְׁכּוֹל
  choice: grappe
  rationale: Le contexte viticole permet d’employer le terme français simple et précis sans ajouter « de raisin ».
- source_word: וְאָמַר
  choice: et que l’on dit
  rationale: Le verbe hébreu a un sujet singulier indéfini ; « on » en rend naturellement la valeur générique.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Ne la détruis pas
  rationale: Le pronom renvoie naturellement à la grappe en français ; « détruire » maintient la répétition du verbe avec la fin du verset.
- source_word: כִּי בְרָכָה בּוֹ
  choice: car elle contient une bénédiction
  rationale: Formulation française naturelle qui conserve le terme théologique concret « bénédiction ».
- source_word: כֵּן אֶעֱשֶׂה
  choice: alors j’agirai de même
  rationale: Explicite sobrement la correspondance entre l’image de la grappe et l’action annoncée par Yahweh.
- source_word: לְמַעַן עֲבָדַי
  choice: à cause de mes serviteurs
  rationale: Rend la considération motivant l’action divine ; « serviteurs » convient au contexte prophétique.
- source_word: לְבִלְתִּי הַשְׁחִית הַכֹּל
  choice: afin de ne pas les détruire tous
  rationale: Le contexte permet de comprendre les personnes visées par le jugement comme objet implicite, tout en signalant en note la formulation moins déterminée de l’hébreu.
theological_decisions:
- issue: Référent de « tous » dans la dernière proposition
  choice: 'Le texte principal comprend comme objet implicite le groupe humain menacé par le jugement : « ne pas les détruire tous » ס.'
  alternative: « afin de ne pas tout détruire »
  rationale: La mise en application de l’image concerne le peuple au milieu duquel se trouvent les serviteurs de Yahweh. La note conserve toutefois l’indétermination grammaticale de l’hébreu et évite de la masquer.
translation_notes:
  register: Français international moderne, au registre prophétique digne mais accessible. La mise en vers fait ressortir l’image et son application. « Yahweh » conserve le nom divin, et les notes documentent les principales possibilités lexicales et l’ambiguïté de l’objet final.
