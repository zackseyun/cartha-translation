source:
  edition: WLC
  text: וְ/גַלְתִּ֥י בִ/ירוּשָׁלִַ֖ם וְ/שַׂשְׂתִּ֣י בְ/עַמִּ֑/י וְ/לֹֽא יִשָּׁמַ֥ע בָּ/הּ֙ ע֔וֹד ק֥וֹל בְּכִ֖י וְ/ק֥וֹל זְעָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
translation:
  language: fr
  text: 'Je ferai de Jérusalem mon allégresse

    et de mon peuple ma joie[a].


    On n’y entendra plus[b]

    ni pleurs ni cris[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement « en » dans les deux expressions. Selon le contexte, cette préposition peut exprimer la joie à l’égard de Jérusalem et du peuple.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en elle », c’est-à-dire en Jérusalem, nom féminin en hébreu.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « appels de détresse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  choice: Je me réjouirai
  rationale: Le verbe גיל exprime une joie vive. Le futur convient au contexte prospectif des promesses, malgré la forme qatal hébraïque.
- source_word: בִירוּשָׁלִַם
  choice: en Jérusalem
  rationale: La préposition ב est rendue dans son sens locatif le plus direct. « En Jérusalem », un peu plus soutenu que « à Jérusalem », permet aussi de maintenir le parallélisme avec « en mon peuple ».
- source_word: וְשַׂשְׂתִּי
  choice: et je trouverai ma joie
  rationale: Cette formulation naturelle distingue שׂושׂ du verbe précédent tout en conservant l’idée de joie et de délectation.
- source_word: בְעַמִּי
  choice: en mon peuple
  rationale: La préposition ב est conservée; l’expression indique que le peuple est l’objet et la sphère de la joie divine, sans imposer une seule nuance relationnelle.
- source_word: יִשָּׁמַע
  choice: on entendra
  rationale: Le niphal de שׁמע a ici une valeur passive. La tournure impersonnelle française rend naturellement « ne sera pas entendu ».
- source_word: בָּהּ
  choice: y
  rationale: Le pronom féminin renvoie à Jérusalem. Le pronom adverbial « y » est idiomatique en français, tandis qu’une note explicite son antécédent.
- source_word: עוֹד
  choice: plus
  rationale: 'Associé à la négation, עוֹד marque la cessation: « ne… plus ».'
- source_word: קוֹל בְּכִי
  choice: pleurs
  rationale: Dans « entendre des pleurs », le français exprime naturellement l’idée du son sans devoir traduire קוֹל par « bruit » ou « voix ».
- source_word: וְקוֹל זְעָקָה
  choice: ni… cris
  rationale: זְעָקָה désigne des cris ou un appel de détresse. « Cris » reste naturel et conserve le parallélisme auditif.
theological_decisions:
- issue: Portée de la préposition ב avec Jérusalem et le peuple
  choice: « en Jérusalem » et « en mon peuple »
  alternative: « au sujet de Jérusalem » et « à cause de mon peuple »
  rationale: Le sens locatif ou sphérique de ב est maintenu dans le texte, tandis que la note signale la nuance relationnelle possible sans trancher au-delà de l’hébreu.
- issue: Deux verbes proches exprimant la joie divine
  choice: « me réjouirai » et « trouverai ma joie »
  alternative: Employer deux fois « me réjouirai »
  rationale: La distinction française reflète les deux verbes hébreux apparentés sans leur attribuer artificiellement des sens théologiques différents.
- issue: Personnification féminine de Jérusalem
  choice: Employer l’idiomatique « y » et expliquer la référence en note
  alternative: « en elle »
  rationale: Le français ne marque pas naturellement ici la ville par « elle ». La note conserve l’information grammaticale et littéraire du texte hébreu.
translation_notes:
  register: Français moderne, digne et poétique. La disposition en quatre lignes restitue le parallélisme. « En Jérusalem » est volontairement soutenu mais compréhensible; « on n’y entendra plus » évite une construction passive lourde.
