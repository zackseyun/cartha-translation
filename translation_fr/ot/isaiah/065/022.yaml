source:
  edition: WLC
  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
translation:
  language: fr
  text: Ils ne bâtiront pas pour qu’un autre habite; ils ne planteront pas pour qu’un autre mange. Car les jours de mon peuple seront comme les jours d’un arbre, et ceux que j’ai choisis profiteront jusqu’au bout de l’œuvre de leurs mains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « useront l’œuvre de leurs mains » ou « en épuiseront l’usage »; l’image indique qu’ils en profiteront pendant toute sa durée.'
    reason: Précision lexicale sur יְבַלּוּ et conservation de son image concrète.
lexical_decisions:
- source_word: יִבְנוּ
  choice: ils ne bâtiront pas
  rationale: Le qal inaccompli à la 3e personne du pluriel prend ici une valeur future dans le contexte de la restauration promise. « Bâtir » conserve le registre digne du passage.
- source_word: וְאַחֵר יֵשֵׁב
  choice: pour qu’un autre habite
  rationale: יָשַׁב signifie ici habiter ou demeurer; l’objet, la maison bâtie, reste implicite comme en hébreu. La tournure française exprime naturellement le résultat injuste qui n’aura plus lieu.
- source_word: יִטְּעוּ
  choice: ils ne planteront pas
  rationale: Le verbe נטע désigne simplement l’action de planter; le futur convient au contexte prophétique.
- source_word: וְאַחֵר יֹאכֵל
  choice: pour qu’un autre mange
  rationale: אָכַל est le verbe courant pour « manger ». Le produit des plantations demeure implicite, conformément au texte hébreu.
- source_word: כִּי כִימֵי הָעֵץ
  choice: Car les jours … seront comme les jours d’un arbre
  rationale: La préposition comparative כ est rendue par « comme ». L’article hébreu a ici une portée générique, que le français exprime naturellement par « un arbre ».
- source_word: יְמֵי עַמִּי
  choice: les jours de mon peuple
  rationale: Le groupe construit est rendu directement, sans expliciter s’il désigne la longévité individuelle ou la durée collective du peuple.
- source_word: וּמַעֲשֵׂה יְדֵיהֶם
  choice: l’œuvre de leurs mains
  rationale: Cette expression conserve l’image hébraïque du produit du travail personnel tout en restant claire en français.
- source_word: יְבַלּוּ
  choice: profiteront jusqu’au bout
  rationale: Le piel de בלה peut évoquer le fait d’user ou d’épuiser quelque chose par un long usage. Dans ce contexte de bénédiction, cette formulation française garde l’idée de durée et de plein usage sans suggérer maladroitement qu’ils détruiront leur ouvrage.
- source_word: בְחִירָי
  choice: ceux que j’ai choisis
  rationale: Cette formulation rend le substantif pluriel « mes choisis » en français courant et évite la charge doctrinale que pourrait prendre « mes élus ».
theological_decisions:
- issue: Portée de יְבַלּוּ dans une promesse de restauration
  choice: profiteront jusqu’au bout de l’œuvre de leurs mains
  alternative: useront l’œuvre de leurs mains / jouiront pleinement du travail de leurs mains
  rationale: Le verbe porte l’image d’un usage qui se prolonge jusqu’à l’usure ou à l’épuisement. La traduction retenue communique la jouissance durable du fruit de son travail sans trancher davantage la nature de l’accomplissement promis.
- issue: Sens des « jours de mon peuple »
  choice: conserver l’expression sans l’expliciter
  alternative: la vie des membres de mon peuple / la durée de mon peuple
  rationale: L’hébreu peut évoquer la longévité du peuple et celle de ses membres. La formulation directe préserve cette amplitude au lieu de choisir silencieusement une seule lecture.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé; les objets implicites de « habiter » et « manger » ne sont pas ajoutés. La ponctuation met en valeur les deux promesses parallèles et leur justification.
