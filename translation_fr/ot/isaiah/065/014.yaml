source:
  edition: WLC
  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
translation:
  language: fr
  text: Voici, mes serviteurs pousseront des cris de joie à cause de la joie de leur cœur[a], mais vous, vous crierez à cause de la douleur de votre cœur et vous vous lamenterez à cause d’un esprit brisé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause du bonheur (ou du bien-être) du cœur » ; le verbe peut aussi se traduire par « chanteront de joie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à cause d’un esprit écrasé » ; le dernier verbe peut aussi se traduire par « hurlerez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec naturel et dignité l’appel emphatique à l’attention.
- source_word: עֲבָדַי
  choice: mes serviteurs
  rationale: Désigne ceux qui appartiennent à Dieu et le servent, sans accentuer ici la condition servile.
- source_word: יָרֹנּוּ
  choice: pousseront des cris de joie
  rationale: Le verbe רנן peut évoquer un chant ou une acclamation joyeuse; cette formulation conserve l’intensité vocale et le contraste avec les cris de détresse.
- source_word: מִטּוּב לֵב
  choice: le cœur heureux
  rationale: Rend idiomatiquement la joie et le bien-être intérieurs exprimés par טוּב לֵב, tout en conservant l’image du cœur.
- source_word: תִּצְעֲקוּ
  choice: vous crierez
  rationale: צעק désigne un cri intense, souvent provoqué par la détresse.
- source_word: מִכְּאֵב לֵב
  choice: le cœur dans la douleur
  rationale: Conserve l’image et le parallélisme du cœur tout en exprimant clairement la cause du cri.
- source_word: מִשֵּׁבֶר רוּחַ
  choice: l’esprit brisé
  rationale: Préserve la métaphore de l’être intérieur brisé ou écrasé.
- source_word: תְּיֵלִילוּ
  choice: vous vous lamenterez
  rationale: Exprime une lamentation forte sans imposer la nuance plus animale de « hurler ».
theological_decisions:
- issue: Identité de « mes serviteurs » et du groupe désigné par « vous »
  choice: Conserver le contraste entre les serviteurs de Dieu et les destinataires opposés, sans préciser davantage leur identité.
  alternative: Identifier explicitement les premiers au reste fidèle et les seconds aux Israélites infidèles.
  rationale: Le verset établit nettement le contraste, mais la traduction ne doit pas trancher au-delà de ce que dit le texte lui-même.
translation_notes:
  register: Français international actuel, naturel et digne. La structure met en relief le contraste entre « mes serviteurs » et « vous », tout en conservant le parallélisme du cœur heureux, du cœur douloureux et de l’esprit brisé.
