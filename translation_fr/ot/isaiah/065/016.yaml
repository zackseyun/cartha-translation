source:
  edition: WLC
  text: אֲשֶׁ֨ר הַ/מִּתְבָּרֵ֜ךְ בָּ/אָ֗רֶץ יִתְבָּרֵךְ֙ בֵּ/אלֹהֵ֣י אָמֵ֔ן וְ/הַ/נִּשְׁבָּ֣ע בָּ/אָ֔רֶץ יִשָּׁבַ֖ע בֵּ/אלֹהֵ֣י אָמֵ֑ן כִּ֣י נִשְׁכְּח֗וּ הַ/צָּרוֹת֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/כִ֥י נִסְתְּר֖וּ מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
translation:
  language: fr
  text: Celui qui se bénira dans le pays se bénira par le Dieu de vérité[a], et celui qui prêtera serment dans le pays prêtera serment par le Dieu de vérité, car les détresses d’autrefois sont oubliées et cachées à mes yeux.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le Dieu fidèle » ; littéralement, « par le Dieu de l’Amen ». Le mot hébreu évoque la fermeté, la fidélité et la vérité.
    reason: alternative_reading
  - marker: b
    text: « Dans le pays » peut aussi se traduire par « sur la terre ». Les verbes rendus par « sont oubliées » et « sont cachées » présentent en hébreu ces réalités comme accomplies.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Celui qui
  rationale: Introduit ici une proposition relative à valeur générale. « Celui qui » est naturel en français et conserve cette portée indéfinie.
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  choice: se bénira
  rationale: Le hitpael de ברך est réflexif. « Se bénir » préserve cette forme et l’idée de se déclarer ou de s’estimer béni, sans imposer une seule explicitation.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner le pays ou la terre. « Dans le pays » convient au cadre communautaire immédiat, tandis que la portée plus large est signalée en note.
- source_word: בֵּאלֹהֵי אָמֵן
  choice: par le Dieu de vérité
  rationale: אָמֵן employé comme qualificatif divin évoque ce qui est ferme, digne de foi et vrai. « Le Dieu de vérité » est intelligible et digne en français, tout en laissant « le Dieu fidèle » comme nuance possible en note.
- source_word: הַנִּשְׁבָּע / יִשָּׁבַע
  choice: celui qui prêtera serment / prêtera serment
  rationale: Le niphal de שׁבע signifie prêter serment. Cette tournure évite l’ambiguïté moderne de « jurer » et exprime précisément l’acte solennel.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison des affirmations précédentes. « Car » convient à la syntaxe soutenue mais actuelle du verset.
- source_word: נִשְׁכְּחוּ
  choice: seront oubliées
  rationale: Le parfait prophétique décrit l’état accompli envisagé dans l’avenir du contexte. Le futur français s’accorde aux verbes précédents et rend clairement cette perspective.
- source_word: הַצָּרוֹת הָרִאשֹׁנוֹת
  choice: les détresses d’autrefois
  rationale: צָרוֹת désigne des détresses ou adversités graves. « D’autrefois » rend naturellement l’antériorité de רִאשֹׁנוֹת.
- source_word: נִסְתְּרוּ מֵעֵינָי
  choice: elles seront cachées à mes yeux
  rationale: La formulation conserve l’image anthropomorphique hébraïque selon laquelle ces détresses ne seront plus devant le regard de Dieu.
theological_decisions:
- issue: Sens de בֵּאלֹהֵי אָמֵן
  choice: le Dieu de vérité
  alternative: le Dieu fidèle ; littéralement, le Dieu de l’Amen
  rationale: Le terme אָמֵן est inhabituel comme épithète divine et réunit les notions de fermeté, de fidélité et de vérité. Le texte principal privilégie un français immédiatement compréhensible sans réduire la nuance à la seule fidélité; la note conserve les autres possibilités.
- issue: Portée de בָּאָרֶץ
  choice: dans le pays
  alternative: sur la terre
  rationale: Le contexte peut être compris dans un cadre local et communautaire ou dans celui, plus vaste, de la création renouvelée. Le texte retient la portée plus restreinte sans éliminer l’autre lecture.
- issue: Temps des parfaits נִשְׁכְּחוּ et נִסְתְּרוּ
  choice: futur français
  alternative: 'passé composé ou état présent : « ont été oubliées » / « sont cachées »'
  rationale: Après les imparfaits à valeur future et dans le contexte eschatologique, les parfaits présentent vraisemblablement des réalités futures comme accomplies. Le futur produit en français une séquence temporelle cohérente, tout en signalant en note la valeur d’accompli.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition structurante du texte hébreu est conservée. « Prêter serment » est préféré à « jurer » pour éviter une ambiguïté courante, et les notes maintiennent les principales tensions lexicales et temporelles.
