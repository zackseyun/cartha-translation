  text: וְ/הָיָ֤ה הַ/שָּׁרוֹן֙ לִ/נְוֵה צֹ֔אן וְ/עֵ֥מֶק עָכ֖וֹר לְ/רֵ֣בֶץ בָּקָ֑ר לְ/עַמִּ֖/י אֲשֶׁ֥ר דְּרָשֽׁוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
translation:
  language: fr
  text: Le Saron deviendra un pâturage pour les troupeaux[a], et la vallée d’Acor un lieu de repos pour le gros bétail[b], pour mon peuple qui m’a recherché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un lieu de séjour pour les moutons » ou « un lieu de pâture pour les moutons ».
    reason: lexical_alternative
  - marker: b
    text: La vallée d’Acor est associée à un jugement antérieur (Josué 7.24-26) ; elle est ici présentée comme un lieu de restauration et de sécurité.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: deviendra
  rationale: Dans ce discours prophétique, la forme exprime naturellement un résultat futur. « Deviendra » souligne la transformation annoncée.
- source_word: הַשָּׁרוֹן
  choice: le Saron
  rationale: Le nom géographique est translittéré selon son usage français courant; l’article hébreu est naturellement rendu en français.
- source_word: לִנְוֵה צֹאן
  choice: un pâturage pour les troupeaux
  rationale: נָוֶה peut désigner une demeure, un pacage ou un pâturage. Cette formulation moderne conserve l’image pastorale sans réduire explicitement צֹאן aux seuls moutons.
- source_word: וְעֵמֶק עָכוֹר
  choice: et la vallée d’Akor
  rationale: עֵמֶק signifie « vallée » et עָכוֹר est conservé comme nom propre sous la forme française « Akor ».
- source_word: לְרֵבֶץ בָּקָר
  choice: un lieu de repos pour le gros bétail
  rationale: רֵבֶץ évoque l’endroit où les animaux se couchent et reposent en sécurité. בָּקָר désigne les bovins ou le gros bétail.
- source_word: לְעַמִּי
  choice: pour mon peuple
  rationale: 'La préposition לְ indique ici vraisemblablement le bénéficiaire: ces lieux restaurés seront destinés au peuple de Dieu.'
- source_word: אֲשֶׁר דְּרָשׁוּנִי
  choice: qui m’a recherché
  rationale: דָּרַשׁ, avec Dieu pour objet, signifie couramment « rechercher ». Le passé composé présente cette démarche accomplie comme caractérisant encore le peuple concerné.
theological_decisions:
- issue: Identité de « mon peuple qui m’a recherché »
  choice: La formulation désigne les membres du peuple que Dieu reconnaît comme siens et qui l’ont recherché, sans préciser davantage leur identité doctrinale.
  alternative: Un reste fidèle au sein d’Israël, ou l’ensemble d’Israël restauré.
  rationale: Le verset ne tranche pas explicitement entre ces lectures. La traduction conserve donc la portée du syntagme sans y importer une définition théologique plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme pastoral de l’hébreu est maintenu. « Gros bétail » distingue clairement בָּקָר des troupeaux de petit bétail évoqués dans le premier membre.
