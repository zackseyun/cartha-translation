  naturalness: La phrase révisée demeure fluide en français international moderne. « Dans leurs récipients se trouve… » est plus idiomatique et plus proche de la construction hébraïque que « dont les récipients contiennent… ».
  terminology: « Tombes », « lieux cachés », « viande de porc », « bouillon », « choses impures » et « récipients » sont appropriés. Les notes maintiennent explicitement l’incertitude de נְצוּרִים et les possibilités lexicales de מָרָק / פִּגּוּלִים, sans surinterprétation doctrinale.
