  text: הַ/יֹּֽשְׁבִים֙ בַּ/קְּבָרִ֔ים וּ/בַ/נְּצוּרִ֖ים יָלִ֑ינוּ הָ/אֹֽכְלִים֙ בְּשַׂ֣ר הַ/חֲזִ֔יר ו/פרק פִּגֻּלִ֖ים כְּלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/004.yaml
  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
translation:
  language: fr
  text: eux qui séjournent parmi les tombes et passent la nuit dans des lieux cachés[a], qui mangent de la viande de porc, et dans leurs récipients se trouve du bouillon de choses impures[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu est difficile. On peut aussi comprendre : « dans des lieux gardés » ou, moins probablement dans ce contexte, « dans des lieux assiégés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la soupe » ou « du ragoût de choses impures ou répugnantes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים
  choice: ceux qui s’installent
  rationale: Le participe qal de ישׁב peut signifier « s’asseoir », « demeurer » ou « séjourner ». « S’installent » conserve l’idée concrète d’une présence prolongée sans suggérer nécessairement une habitation permanente.
- source_word: בַּקְּבָרִים
  choice: parmi les tombes
  rationale: קברים désigne des tombes ou des sépulcres. Avec ב, « parmi les tombes » exprime naturellement en français la fréquentation de lieux funéraires.
- source_word: וּבַנְּצוּרִים
  choice: dans des lieux cachés
  rationale: Le terme נְצוּרִים est difficile. Le contexte nocturne et cultuel favorise « lieux cachés », tout en laissant en note les sens possibles de lieux gardés ou assiégés.
- source_word: יָלִינוּ
  choice: passent la nuit
  rationale: Le verbe לין signifie loger ou demeurer pendant la nuit. « Passent la nuit » est idiomatique et précis.
- source_word: הָאֹכְלִים
  choice: qui mangent
  rationale: Le participe substantivé poursuit la description du groupe et se rend naturellement par une proposition relative.
- source_word: בְּשַׂר הַחֲזִיר
  choice: de la viande de porc
  rationale: Cette formulation moderne garde l’image concrète de la chair de l’animal et la portée alimentaire du syntagme.
- source_word: ופרק
  choice: du bouillon
  rationale: Le mot rare est traditionnellement compris comme un mets liquide, bouillon, soupe ou ragoût. « Bouillon » convient à ce qui se trouve dans des récipients, mais l’incertitude est signalée en note.
- source_word: פִּגֻּלִים
  choice: de choses impures
  rationale: פִּגֻּלִים évoque des aliments rituellement souillés ou répugnants. « Choses impures » préserve la dimension rituelle sans préciser au-delà du texte.
- source_word: כְּלֵיהֶם
  choice: leurs récipients
  rationale: כְּלִי est un terme général désignant un récipient, un objet ou un ustensile. « Récipients » évite de restreindre indûment le sens à des marmites.
theological_decisions:
- issue: Langage relatif aux aliments rituellement offensants
  choice: Conserver les images concrètes de la viande de porc, du bouillon, des récipients et des choses impures.
  alternative: Généraliser en parlant d’« aliments interdits » ou d’« abominations ».
  rationale: Le verset condamne des pratiques liées à l’impureté et à un culte illicite. La traduction garde les éléments explicites sans les développer selon des catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale de l’hébreu est conservée sous la forme « ceux qui… qui… ». « Tombes », « viande de porc » et « récipients » sont courants sans être familiers. Les deux termes hébreux rares ou discutés sont rendus lisiblement, avec leur incertitude préservée en notes.
