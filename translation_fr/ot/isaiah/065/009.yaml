  text: וְ/הוֹצֵאתִ֤י מִֽ/יַּעֲקֹב֙ זֶ֔רַע וּ/מִ/יהוּדָ֖ה יוֹרֵ֣שׁ הָרָ֑/י וִ/ירֵשׁ֣וּ/הָ בְחִירַ֔/י וַ/עֲבָדַ֖/י יִשְׁכְּנוּ שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
translation:
  language: fr
  text: Je ferai sortir de Jacob une descendance[a], et de Juda quelqu’un qui héritera de mes montagnes. Ceux que j’ai choisis en prendront possession[b], et mes serviteurs y habiteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une semence ». Le mot hébreu זֶרַע est un singulier collectif qui peut désigner la semence, la descendance ou les descendants.
    reason: lexical_alternative
  - marker: b
    text: Ou « en hériteront ». En hébreu, le même verbe est employé pour « héritera » et « prendront possession », ce qui associe étroitement héritage et possession.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Je ferai sortir
  rationale: 'Le hiphil de יצא exprime ici la causation : Dieu fera surgir ou sortir une descendance. Cette formulation reste proche de l’image hébraïque tout en étant naturelle en français.'
- source_word: מִיַּעֲקֹב זֶרַע
  choice: de Jacob une descendance
  rationale: זֶרַע est un singulier collectif pouvant désigner la semence ou les descendants. « Une descendance » rend clairement ce sens collectif sans interpréter davantage Jacob.
- source_word: וּמִיהוּדָה יוֹרֵשׁ
  choice: et de Juda quelqu’un qui héritera
  rationale: Le participe יוֹרֵשׁ désigne celui qui hérite ou prend possession. La proposition relative permet de construire naturellement le complément direct pluriel « mes montagnes » en français.
- source_word: הָרָי
  choice: mes montagnes
  rationale: Le pluriel concret est conservé, sans le généraliser en « pays » ni en donner une interprétation exclusivement symbolique.
- source_word: וִירֵשׁוּהָ
  choice: en prendront possession
  rationale: Le verbe reprend la racine ירש, associant héritage et prise de possession. Le pronom adverbial « en » renvoie naturellement aux montagnes et évite de forcer le suffixe féminin singulier du texte consonantique.
- source_word: בְחִירַי
  choice: ceux que j’ai choisis
  rationale: Cette tournure française courante exprime la sélection divine sans les connotations doctrinales que peut porter « mes élus ».
- source_word: וַעֲבָדַי
  choice: mes serviteurs
  rationale: Dans ce contexte de relation avec Dieu, « serviteurs » est naturel et fidèle, sans mettre indûment au premier plan le sens social d’esclave.
- source_word: יִשְׁכְּנוּ שָׁמָּה
  choice: y habiteront
  rationale: שכן indique une habitation établie. « Y habiteront » est sobre, actuel et renvoie clairement au lieu précédemment évoqué.
theological_decisions:
- issue: Référent de « mes montagnes » et nature de la promesse d’héritage
  choice: Conserver l’image territoriale concrète de « mes montagnes ».
  alternative: Rendre l’expression par « mon pays » ou l’interpréter directement comme une bénédiction eschatologique spirituelle.
  rationale: L’hébreu nomme explicitement les montagnes de Dieu. La traduction maintient la dimension géographique et l’idée d’héritage sans trancher la question de l’accomplissement théologique plus large.
- issue: Relation entre יוֹרֵשׁ et וִירֵשׁוּהָ
  choice: Traduire le premier par « héritera » et le second par « prendront possession », tout en signalant la répétition de la même racine.
  alternative: Employer « hériter » dans les deux propositions.
  rationale: La variation donne un français idiomatique et laisse apparaître les deux dimensions sémantiques de ירש — héritage et possession — sans les dissocier théologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme entre Jacob et Juda, tandis que « quelqu’un qui héritera » évite la tournure peu naturelle « un héritier de mes montagnes ». Les marqueurs [a] et [b] figurent tous deux dans le texte.
