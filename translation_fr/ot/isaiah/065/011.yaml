source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֹזְבֵ֣י יְהוָ֔ה הַ/שְּׁכֵחִ֖ים אֶת הַ֣ר קָדְשִׁ֑/י הַֽ/עֹרְכִ֤ים לַ/גַּד֙ שֻׁלְחָ֔ן וְ/הַֽ/מְמַלְאִ֖ים לַ/מְנִ֥י מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
translation:
  language: fr
  text: Mais vous, qui abandonnez Yahweh, qui oubliez ma montagne sainte, qui dressez une table pour Gad[a] et remplissez pour Meni[b] une coupe de vin mélangé[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gad était probablement le nom d’une divinité associée à la fortune ; autre traduction possible : « la Fortune ».'
    reason: alternative_reading
  - marker: b
    text: 'Meni était probablement le nom d’une divinité associée au destin ; autre traduction possible : « le Destin ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « une boisson mélangée ». Le terme désigne une boisson préparée, vraisemblablement destinée à une libation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mais vous
  rationale: La conjonction et le pronom indépendant marquent ici le contraste avec le contexte précédent; « Mais vous » le rend naturellement.
- source_word: עֹזְבֵי יְהוָה
  choice: qui abandonnez Yahweh
  rationale: Le participe décrit le groupe interpellé. « Abandonner » exprime clairement la rupture impliquée par עזב, tandis que le nom divin est translittéré.
- source_word: הַשְּׁכֵחִים אֶת הַר קָדְשִׁי
  choice: qui oubliez ma montagne sainte
  rationale: La formulation conserve le sens direct du participe et rend l’expression hébraïque dans un français naturel.
- source_word: הָעֹרְכִים לַגַּד שֻׁלְחָן
  choice: qui dressez une table pour Gad
  rationale: Avec « table », ערך désigne sa préparation ou sa disposition. Gad est conservé comme nom propre probable.
- source_word: וְהַמְמַלְאִים לַמְנִי מִמְסָךְ
  choice: et remplissez une coupe de vin mélangé pour Meni
  rationale: Le verbe signifie littéralement « remplir ». L’ajout explicatif de « une coupe » fournit en français le contenant implicite requis par le verbe, sans transformer l’action en offrande versée; מִמְסָךְ désigne une boisson préparée ou mélangée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin; sa translittération préserve son statut de nom propre sans lui substituer un titre.
- issue: Statut de גַּד et מְנִי
  choice: Gad et Meni comme noms propres dans le texte
  alternative: la Fortune et le Destin
  rationale: Le contexte cultuel favorise des noms de divinités ou de puissances personnifiées, mais leur valeur sémantique reste pertinente et est signalée en notes.
- issue: Nature de מִמְסָךְ
  choice: vin mélangé
  alternative: boisson mélangée; libation
  rationale: Le terme désigne une boisson préparée, vraisemblablement à base de vin. « Libation » préciserait la fonction rituelle au-delà du sens lexical immédiat.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « qui » conserve la structure accusatrice des participes hébreux. La phrase reste ouverte par une virgule, puisque le verset suivant donne la proposition principale et la conséquence.
