base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/001.yaml
  text: I let myself be sought by those who did not ask[a]; I let myself be found by those who did not seek me. I said, ‘Here I am[b], here I am,’ to a nation that did not call on my name.
translation:
  language: fr
  text: 'Je me suis laissé rechercher par ceux qui ne s’enquéraient pas de moi[a] ; je me suis laissé trouver par ceux qui ne me cherchaient pas. J’ai dit : « Me voici, me voici ! » à une nation qui n’invoquait pas mon nom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « J’ai été recherché par ceux qui ne s’enquéraient pas de moi ; j’ai été trouvé par ceux qui ne me cherchaient pas. » Les formes hébraïques peuvent être comprises comme de simples passifs, tandis que le contexte suggère que Dieu se rend accessible à ceux qui ne le recherchent pas.'
    reason: lexical_alternative
  - marker: b
    text: Paul cite ce verset en Romains 10.20 en l’appliquant aux non-Juifs. Le mot hébreu traduit ici par « nation » garde toutefois son sens général dans le texte.
    reason: cross_reference
lexical_decisions:
- source_word: נִדְרַשְׁתִּי
  choice: Je me suis laissé rechercher
  rationale: Le nifal peut être compris comme un passif simple (« j’ai été recherché »), mais le contexte permet aussi de souligner que Dieu s’est rendu accessible. La tournure pronominale causative conserve cette nuance sans effacer le passif hébreu, signalé en note.
- source_word: לְלֹא שָׁאָלוּ
  choice: par ceux qui ne me consultaient pas
  rationale: שׁאל peut exprimer ici le fait de consulter ou d’interroger Dieu. « Consulter » s’accorde naturellement avec דרשׁ et rend l’idée plus précisément que le seul verbe « demander » ; l’objet « me » est explicité en français d’après le contexte.
- source_word: נִמְצֵאתִי
  choice: je me suis laissé trouver
  rationale: Le nifal signifie littéralement « j’ai été trouvé ». En parallèle avec נדרשתי, « je me suis laissé trouver » exprime la disponibilité et la manifestation de Dieu tout en restant proche de la forme source.
- source_word: לְלֹא בִקְשֻׁנִי
  choice: par ceux qui ne me cherchaient pas
  rationale: בקשׁ signifie directement « chercher » et le suffixe impose « me ». L’imparfait français décrit naturellement l’absence d’une démarche en cours ou habituelle.
- source_word: הִנֵּנִי הִנֵּנִי
  choice: Me voici, me voici !
  rationale: « Me voici » est la formule française biblique naturelle pour exprimer présence et disponibilité. La répétition emphatique de l’hébreu est maintenue.
- source_word: גּוֹי
  choice: une nation
  rationale: Le sens lexical premier est « nation ». Ce choix évite d’introduire directement « les non-Juifs » dans le texte, tout en permettant de signaler en note l’application de Paul en Romains 10.20.
- source_word: לֹא קֹרָא בִשְׁמִי
  choice: qui n’invoquait pas mon nom
  rationale: La construction active קרא בְּשֵׁם signifie ici « invoquer le nom », plutôt que « être appelé de mon nom ». « Invoquer » est précis, naturel dans ce registre et conserve la portée cultuelle de l’expression.
theological_decisions:
- issue: Portée des nifals נִדְרַשְׁתִּי et נִמְצֵאתִי
  choice: Employer « je me suis laissé rechercher/trouver » dans le texte et donner le passif simple en note.
  alternative: « J’ai été recherché… j’ai été trouvé »
  rationale: Le passif est formellement possible et doit demeurer visible, mais le contexte suggère également l’initiative de Dieu qui se rend accessible à ceux qui ne le recherchent pas.
- issue: Identification de la גּוֹי avec les non-Juifs
  choice: Conserver « une nation » dans le texte et mentionner l’application paulinienne en note.
  alternative: Traduire directement par « les non-Juifs » ou « une nation païenne ».
  rationale: L’hébreu ne précise pas à lui seul « les non-Juifs ». Romains 10.20 applique toutefois le verset aux nations ; la note préserve ce lien canonique sans imposer cette précision au texte d’Ésaïe.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition emphatique sont conservés. « Consulter », « chercher » et « invoquer » distinguent les trois expressions hébraïques sans lourdeur. Les marqueurs [a] et [b] figurent tous deux dans le texte, au plus près des éléments concernés.
