id: ISA.65.25
reference: Isaiah 65:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זְאֵ֨ב וְ/טָלֶ֜ה יִרְע֣וּ כְ/אֶחָ֗ד וְ/אַרְיֵה֙ כַּ/בָּקָ֣ר יֹֽאכַל תֶּ֔בֶן וְ/נָחָ֖שׁ עָפָ֣ר לַחְמ֑/וֹ לֹֽא יָרֵ֧עוּ וְ/לֹֽא יַשְׁחִ֛יתוּ בְּ/כָל הַ֥ר קָדְשִׁ֖/י אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
translation:
  language: fr
  text: 'Le loup et l’agneau[a] brouteront ensemble,

    et le lion mangera de la paille comme le gros bétail ;

    la poussière sera la nourriture du serpent[b].

    Ils ne feront aucun mal[c] et ne détruiront rien

    sur toute ma montagne sainte,

    déclare Yahvé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chevreau » ; le mot hébreu peut désigner plus largement le petit d’un animal du petit bétail.
    reason: lexical_alternative
  - marker: b
    text: Le serpent qui se nourrit de poussière fait probablement écho à Genèse 3.14.
    reason: cross_reference
  - marker: c
    text: Ou « ne feront aucun tort » ; le premier verbe peut désigner aussi bien le fait de mal agir que celui de causer du tort.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב
  choice: loup
  rationale: Équivalent français courant et précis du nom de l’animal.
- source_word: טָלֶה
  choice: agneau
  rationale: Dans ce contraste entre prédateur et proie vulnérable, « agneau » est le rendu français le plus naturel, tout en signalant en note la portée plus large possible du terme hébreu.
- source_word: יִרְעוּ כְאֶחָד
  choice: brouteront ensemble
  rationale: רעה désigne ici l’action de paître, et כְאֶחָד exprime une action commune et paisible.
- source_word: אַרְיֵה
  choice: lion
  rationale: Rendu direct du nom de l’animal.
- source_word: כַּבָּקָר
  choice: comme le gros bétail
  rationale: בָּקָר est un nom collectif désignant les bovins; « gros bétail » conserve cette valeur collective sans imposer un bœuf particulier.
- source_word: יֹאכַל תֶּבֶן
  choice: mangera de la paille
  rationale: Rendu direct et idiomatique qui préserve l’image du régime non prédateur du lion.
- source_word: נָחָשׁ
  choice: serpent
  rationale: « Serpent » convient au registre prophétique et préserve l’écho possible à Genèse 3.
- source_word: עָפָר לַחְמוֹ
  choice: la poussière sera la nourriture du serpent
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner la nourriture en général; « nourriture » est ici naturel et maintient l’image sans la surinterpréter.
- source_word: לֹא יָרֵעוּ
  choice: ils ne feront aucun mal
  rationale: Le hiphil de רעע peut évoquer aussi bien le mal moral que l’action nuisible; cette formulation française garde les deux nuances accessibles.
- source_word: לֹא יַשְׁחִיתוּ
  choice: ne détruiront rien
  rationale: Le verbe שׁחת exprime ici la destruction; cette tournure conserve sa valeur verbale active et le parallélisme avec la proposition précédente.
- source_word: בְּכָל הַר קָדְשִׁי
  choice: sur toute ma montagne sainte
  rationale: « Sur » est idiomatique en français avec « montagne », tandis que « toute » maintient la portée totale de כָל.
- source_word: אָמַר יְהוָה
  choice: déclare Yahvé
  rationale: La formule prophétique est rendue naturellement au présent en français; « Yahvé » représente explicitement le tétragramme.
theological_decisions:
- issue: Écho possible à la malédiction du serpent en Genèse 3.14
  choice: Conserver « serpent » et l’image de la poussière comme nourriture sans expliciter la malédiction dans le texte.
  alternative: Employer « reptile » ou ajouter une explication de la malédiction dans le corps du verset.
  rationale: Le rapprochement avec Genèse 3.14 est probable, mais Ésaïe ne l’explicite pas; la traduction préserve donc l’allusion sans imposer son interprétation.
- issue: Portée morale ou concrètement nuisible de לֹא יָרֵעוּ
  choice: « Ils ne feront aucun mal »
  alternative: « Ils ne feront aucun tort » ou « Ils n’agiront pas avec méchanceté »
  rationale: La formulation retenue laisse subsister la tension entre mal moral et dommage concret, au lieu de réduire le verbe à une seule nuance.
- issue: Référent du sujet pluriel dans la conclusion
  choice: Maintenir le pronom pluriel « Ils » sans préciser davantage son référent.
  alternative: Employer une tournure impersonnelle telle que « Il ne se fera aucun mal ».
  rationale: L’hébreu emploie deux verbes au pluriel sans nommer à nouveau leur sujet; conserver ce pluriel respecte cette ouverture grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par la disposition en lignes. « Gros bétail » rend la valeur collective de בָּקָר; « Yahvé » représente le nom divin יהוה.
