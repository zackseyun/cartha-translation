  text: עֲ֠וֺנֹתֵי/כֶם וַ/עֲוֺנֹ֨ת אֲבוֹתֵי/כֶ֤ם יַחְדָּו֙ אָמַ֣ר יְהוָ֔ה אֲשֶׁ֤ר קִטְּרוּ֙ עַל הֶ֣/הָרִ֔ים וְ/עַל הַ/גְּבָע֖וֹת חֵרְפ֑וּ/נִי וּ/מַדֹּתִ֧י פְעֻלָּתָ֛/ם רִֽאשֹׁנָ֖ה על חֵיקָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
translation:
  language: fr
  text: Vos fautes et celles de vos pères, réunies, dit Yahweh, parce qu’ils ont brûlé de l’encens sur les montagnes et m’ont outragé sur les collines ; je mesurerai donc dans leur giron[b] leur œuvre d’autrefois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner soit l’œuvre ou l’acte accompli, soit le salaire ou la rétribution qui lui correspond.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans leur giron ». Cette expression hébraïque évoque une rétribution remise directement et personnellement à quelqu’un.
    reason: cultural_note
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם וַעֲוֺנֹת אֲבוֹתֵיכֶם
  choice: vos fautes et celles de vos pères
  rationale: « Fautes » exprime ici les actes moralement coupables sans réduire עָוֹן à leur seule punition. La reprise par « celles » rend le français plus naturel tout en conservant la référence explicite aux pères.
- source_word: יַחְדָּו
  choice: toutes ensemble
  rationale: L’accord au féminin renvoie aux fautes des deux générations et souligne qu’elles sont prises en compte conjointement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel au lieu de le remplacer par un titre.
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte, la particule introduit la raison du jugement; cette valeur causale est naturelle en français.
- source_word: קִטְּרוּ
  choice: ont fait brûler de l’encens
  rationale: Le piel de קטר désigne l’action cultuelle de brûler de l’encens; la formulation évite de préciser indûment le destinataire de ce culte.
- source_word: עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  choice: sur les montagnes ... sur les collines
  rationale: La traduction conserve les deux lieux explicitement nommés et leur parallélisme, sans les remplacer par le terme interprétatif « hauts lieux ».
- source_word: חֵרְפוּנִי
  choice: m’ont outragé
  rationale: « Outrager » exprime le mépris offensant de חרף dans un registre digne et courant.
- source_word: וּמַדֹּתִי
  choice: Je mesurerai donc
  rationale: Le verbe concret « mesurer » préserve l’image hébraïque; « donc » explicite sobrement la conséquence du motif qui précède.
- source_word: פְעֻלָּתָם רִאשֹׁנָה
  choice: le prix de leur conduite passée
  rationale: « Conduite passée » rend l’œuvre ou l’action antérieure; « prix » laisse entendre, sans l’épuiser, la nuance possible de salaire ou rétribution portée par פְּעֻלָּה dans ce contexte judiciaire.
- source_word: עַל חֵיקָם
  choice: dans leur giron ... à eux personnellement
  rationale: « Dans leur giron » conserve l’image corporelle et culturelle; l’explicitation brève en français commun en indique la portée personnelle.
theological_decisions:
- issue: Faute intergénérationnelle et jugement
  choice: Le texte associe les fautes des destinataires à celles de leurs pères sans expliquer davantage le rapport exact entre participation présente et héritage ancestral.
  alternative: Présenter le verset comme l’affirmation explicite que les descendants sont punis indépendamment de leur propre conduite.
  rationale: La traduction maintient côte à côte « vos fautes » et celles des pères, ainsi que le passage du « vous » au « ils/leur », sans imposer une harmonisation doctrinale extérieure au verset.
- issue: Sens judiciaire de פְעֻלָּתָם
  choice: le prix de leur conduite passée
  alternative: leur œuvre passée ; leur rétribution antérieure
  rationale: Le terme peut désigner l’acte accompli ou ce qui lui est dû. La formulation choisie maintient le lien entre conduite et paiement, tandis que la note signale l’ambiguïté lexicale.
translation_notes:
  register: Français international actuel, solennel sans archaïsme. Le parallélisme des montagnes et des collines ainsi que l’image du giron sont conservés. « Pères » maintient la formulation historique masculine de l’hébreu; « ancêtres » resterait une possibilité plus inclusive mais moins formellement précise.
