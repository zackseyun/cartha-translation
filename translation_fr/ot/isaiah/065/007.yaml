revisions:
- from: vos fautes et celles de vos pères, toutes ensemble, dit Yahweh, parce qu’ils ont fait brûler de l’encens sur les montagnes et m’ont outragé sur les collines. Je mesurerai donc dans leur giron le prix de leur conduite passée[a], à eux personnellement[b].
  to: Vos fautes et celles de vos pères, réunies, dit Yahweh, parce qu’ils ont brûlé de l’encens sur les montagnes et m’ont outragé sur les collines ; je mesurerai donc dans leur giron[b] leur œuvre d’autrefois[a].
  rationale: La révision retire l’explicitation ajoutée, place l’ancre culturelle sur « giron » et remplace la formulation interprétative « le prix de leur conduite passée » par « leur œuvre d’autrefois ». Cette dernière conserve la possibilité d’une connotation de rétribution, signalée en note, sans décider la question dans le corps du texte.
  reviewer_model: gpt-5.6-terra
