review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris la valeur imprécatoire probable de לִשְׁבוּעָה et l’alternance intentionnelle du pluriel (« vous ») au singulier (« te »). Toutefois, « parmi ceux que j’ai choisis » affaiblit et déplace la valeur de לִבְחִירַי, qui désigne plus naturellement les personnes pour lesquelles/qui emploieront le nom dans une formule de malédiction.
  naturalness: Le français est globalement moderne et clair. « Te fera mourir » est possible, mais « te mettra à mort » rend plus directement le hiphil de מות dans un contexte de jugement. La note b actuelle donne une prétendue formulation littérale qui ajoute « pour » d’une manière peu justifiée par le texte hébreu.
  terminology: « Le Seigneur Yahweh » rend adéquatement אֲדֹנָי יְהוִה en conservant le titre et le nom divin. « Serviteurs » convient à עֲבָדָיו dans ce contexte. « Malédiction » est un bon rendu contextuel de שְׁבוּעָה; la note conserve l’alternative liée au serment.
  issues:
  - severity: medium
    issue: Rendu de לִבְחִירַי par « parmi ceux que j’ai choisis »
    rationale: La préposition ל ne signifie pas ici « parmi ». Dans le contexte d’une formule de malédiction, le nom est laissé « pour » les élus, c’est-à-dire pour leur usage. « Pour ceux que j’ai choisis » est à la fois plus proche du texte et plus naturel.
  - severity: low
    issue: Note b présentée comme littérale
    rationale: '« Il appellera pour ses serviteurs un autre nom » n’est pas une restitution littérale française fiable de וְלַעֲבָדָיו יִקְרָא שֵׁם אַחֵר. Une note d’alternative idiomatique peut plutôt expliciter la possibilité : « il appellera ses serviteurs d’un autre nom ».'
  - severity: low
    issue: « te fera mourir »
    rationale: La formule est compréhensible mais moins idiomatique et moins directe que « te mettra à mort » pour le causatif hébreu dans cet oracle de jugement.
  revised_text: Vous laisserez votre nom comme une malédiction pour ceux que j’ai choisis[a] ; le Seigneur Yahweh te mettra à mort. Mais il donnera à ses serviteurs un autre nom[b].
