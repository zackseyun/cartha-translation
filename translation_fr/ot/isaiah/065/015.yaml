source:
  edition: WLC
  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
translation:
  language: fr
  text: Vous laisserez votre nom comme une malédiction pour ceux que j’ai choisis[a] ; le Seigneur Yahweh te mettra à mort. Mais il donnera à ses serviteurs un autre nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « comme une formule de serment » : votre nom sera employé dans une imprécation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il appellera ses serviteurs d’un autre nom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנַּחְתֶּם שִׁמְכֶם
  choice: Vous laisserez votre nom
  rationale: Le hiphil de נוח avec « nom » pour complément exprime ici ce que le groupe laissera derrière lui comme désignation ou souvenir.
- source_word: לִשְׁבוּעָה
  choice: comme une malédiction
  rationale: שְׁבוּעָה signifie couramment « serment », mais, dans ce contexte de jugement, le nom sert de formule imprécatoire. « Malédiction » communique naturellement cette valeur, tandis que le sens plus littéral est signalé en note.
- source_word: לִבְחִירַי
  choice: parmi ceux que j’ai choisis
  rationale: Cette formulation française rend le substantif pluriel « mes choisis » avec naturel et dignité. La préposition ל peut ici désigner le groupe au sein duquel le nom servira de malédiction.
- source_word: וֶהֱמִיתְךָ
  choice: te fera mourir
  rationale: Le hiphil de מות est causatif. Le passage soudain du pluriel au singulier est conservé en français plutôt que régularisé.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom divin יהוה et évite la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: וְלַעֲבָדָיו
  choice: mais ... à ses serviteurs
  rationale: Le ו a ici une valeur contrastive entre le sort du groupe jugé et celui des serviteurs de Dieu. « Serviteurs » convient au contexte d’appartenance et de service.
- source_word: יִקְרָא שֵׁם אַחֵר
  choice: il donnera ... un autre nom
  rationale: Littéralement « il appellera un autre nom ». En français, « donner un autre nom » exprime naturellement l’attribution d’une nouvelle désignation sans changer le sens.
theological_decisions:
- issue: Valeur de שְׁבוּעָה dans un oracle de jugement
  choice: comme une malédiction
  alternative: comme un serment
  rationale: Le sens lexical « serment » demeure possible, mais le contexte indique vraisemblablement que le nom deviendra un exemple cité dans une formule de malédiction. La note préserve l’ambiguïté.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix conserve à la fois le titre et le nom propre présents dans l’hébreu.
- issue: Alternance du pluriel au singulier
  choice: « Vous laisserez » puis « te fera mourir »
  alternative: uniformiser tout le verset au pluriel
  rationale: Le texte massorétique passe réellement du suffixe pluriel כֶם au suffixe singulier ךָ. La traduction conserve cette tension grammaticale au lieu de la résoudre silencieusement.
- issue: Sujet de יִקְרָא et bénéficiaire du nouveau nom
  choice: Yahweh donnera un autre nom à ses serviteurs
  alternative: lecture rattachant directement cette proposition à la mise à mort
  rationale: La syntaxe la plus naturelle reprend le Seigneur Yahweh comme sujet de יִקְרָא et ses serviteurs comme destinataires du nouveau nom.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le changement inattendu du pluriel « vous » au singulier « te » reproduit l’hébreu. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
