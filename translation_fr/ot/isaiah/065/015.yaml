revisions:
- from: 'Vous laisserez votre nom comme une malédiction parmi ceux que j’ai choisis[a] : le Seigneur Yahweh te fera mourir ; mais il donnera à ses serviteurs un autre nom[b].'
  to: Vous laisserez votre nom comme une malédiction pour ceux que j’ai choisis[a] ; le Seigneur Yahweh te mettra à mort. Mais il donnera à ses serviteurs un autre nom[b].
  rationale: La révision corrige la relation exprimée par לִבְחִירַי, remplace une expression française moins naturelle par un rendu direct du causatif, et reformule la note b pour qu’elle présente une véritable alternative interprétative sans revendiquer une littéralité inexacte. Elle conserve le contraste, le nom divin et le passage délibéré du pluriel au singulier du texte massorétique.
