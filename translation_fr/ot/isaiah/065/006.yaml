  - severity: medium
    issue: « Dans le creux de leur vêtement » surspécifie חֵיק.
    rationale: Le mot hébreu peut évoquer le sein, le giron ou la partie repliée du vêtement à la poitrine. Le traduire directement par « creux de leur vêtement » fixe une explication culturelle qui convient mieux à une note qu’au texte.
  - severity: low
