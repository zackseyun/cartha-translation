  text: הִנֵּ֥ה כְתוּבָ֖ה לְ/פָנָ֑/י לֹ֤א אֶחֱשֶׂה֙ כִּ֣י אִם שִׁלַּ֔מְתִּי וְ/שִׁלַּמְתִּ֖י עַל חֵיקָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/006.yaml
  text: 'Look[a], it is written before me: I will not keep silent, but I will repay; indeed[b], I will repay into their lap.'
translation:
  language: fr
  text: 'Voici[a] : c’est écrit devant moi : je ne me tairai pas, mais je leur rendrai ce qui leur revient ; oui, je le leur rendrai dans leur sein[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela est écrit devant moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur leur sein ». Le terme peut désigner le sein, le giron ou le pli du vêtement contre la poitrine; l’image exprime une rétribution remise directement à la personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit solennellement la déclaration et attire l’attention, dans un français actuel et digne.
- source_word: כְתוּבָה לְפָנַי
  choice: cela est écrit devant moi
  rationale: Conserve l’image d’un écrit qui demeure placé devant Dieu, sans la réduire explicitement à un registre.
- source_word: לֹא אֶחֱשֶׂה
  choice: je ne garderai pas le silence
  rationale: Exprime naturellement la résolution future indiquée dans le contexte.
- source_word: כִּי אִם
  choice: mais
  rationale: Marque l’opposition entre le refus de rester silencieux et l’action de rendre la pareille.
- source_word: שִׁלַּמְתִּי
  choice: je rendrai la pareille
  rationale: Le parfait peut ici présenter comme certaine une action future de rétribution; cette formulation garde l’idée de réciprocité judiciaire.
- source_word: וְשִׁלַּמְתִּי
  choice: oui, je la leur rendrai
  rationale: La reprise souligne la certitude et l’intensité de la rétribution.
- source_word: עַל חֵיקָם
  choice: dans le creux de leur vêtement
  rationale: Restitue l’image concrète du חֵיק, la partie repliée du vêtement contre la poitrine ou formant une poche, où quelque chose peut être versé ou déposé.
theological_decisions:
- issue: Valeur aspectuelle et temporelle de שִׁלַּמְתִּי / וְשִׁלַּמְתִּי
  choice: 'Sens futur : « je rendrai… oui, je rendrai »'
  alternative: 'Sens accompli : « j’ai rendu »'
  rationale: Dans cette annonce prophétique de jugement, les parfaits présentent avec certitude une rétribution à venir; le futur français rend clairement cette force.
- issue: Nature de la rétribution
  choice: Réciprocité judiciaire exprimée par « rendre la pareille »
  alternative: Traduire explicitement par « punir » ou « me venger »
  rationale: Le verbe שׁלם indique ici la rétribution, mais le texte ne précise pas davantage sa forme; la traduction évite donc un resserrement interprétatif.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Voici » convient à l’annonce prophétique. L’expression « le creux de leur vêtement » préserve mieux l’image culturelle hébraïque que le moderne « leurs genoux », tandis que la note donne la formulation littérale.
