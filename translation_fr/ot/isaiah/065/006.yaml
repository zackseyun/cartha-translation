  verdict: revise
  source_fidelity: Le sens général est bien celui d’une déclaration divine de rétribution certaine. Toutefois, « rendre la pareille » est trop familier et polémique pour שׁלם dans cette proclamation de jugement; il introduit aussi un pronom (« la ») sans antécédent explicite. « Le creux de leur vêtement » explicite de façon trop précise une compréhension matérielle possible de חֵיק, alors que le terme désigne plus largement le sein, la poitrine ou le giron. La répétition emphatique des deux formes de שׁלם doit être maintenue.
  naturalness: « Voici » et « je ne garderai pas le silence » sont naturels, mais « je rendrai la pareille » abaisse le registre solennel et sonne idiomatiquement comme une riposte personnelle. « Je ne me tairai pas » est plus direct et courant dans un français moderne soutenu. « Dans leur sein » conserve l’image sans imposer une description vestimentaire.
  terminology: « Rétribuer » / « rendre » convient mieux que « rendre la pareille » pour la réciprocité judiciaire de שׁלם. Le texte conserve « sein » pour חֵיק; la note explique l’image et signale le littéral « sur leur sein », sans la réduire à une seule reconstruction culturelle.
  issues:
