id: ISA.65.17
reference: Isaiah 65:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֥י בוֹרֵ֛א שָׁמַ֥יִם חֲדָשִׁ֖ים וָ/אָ֣רֶץ חֲדָשָׁ֑ה וְ/לֹ֤א תִזָּכַ֨רְנָה֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/לֹ֥א תַעֲלֶ֖ינָה עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
translation:
  language: fr
  text: Car voici que je crée de nouveaux cieux et une nouvelle terre. On ne se souviendra plus des choses passées, et elles ne viendront plus à l’esprit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elles ne monteront pas sur le cœur », expression qui signifie qu’elles ne viendront pas à l’esprit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative ou causale qui relie cette annonce au contexte précédent.
- source_word: הִנְנִי
  choice: voici que je
  rationale: Rend la particule d’attention et l’insistance sur le locuteur dans un français actuel et digne.
- source_word: בוֹרֵא
  choice: je crée
  rationale: Le participe hébreu présente l’action divine comme en cours ou fermement engagée; le présent français en préserve la vivacité sans imposer un simple futur.
- source_word: שָׁמַיִם חֲדָשִׁים
  choice: de nouveaux cieux
  rationale: « Cieux » convient au cadre cosmique de la création et conserve les résonances bibliques de l’expression.
- source_word: וָאָרֶץ חֲדָשָׁה
  choice: et une nouvelle terre
  rationale: En parallèle avec « cieux », אֶרֶץ désigne ici la terre dans sa portée cosmique plutôt qu’un territoire particulier.
- source_word: הָרִאשֹׁנוֹת
  choice: les choses passées
  rationale: L’adjectif féminin pluriel substantivé désigne largement les réalités antérieures; cette formulation naturelle évite de préciser indûment leur contenu.
- source_word: תִזָּכַרְנָה
  choice: On ne se souviendra plus
  rationale: Rend naturellement en français la forme niphal et l’idée que les choses antérieures ne seront plus remémorées.
- source_word: תַעֲלֶינָה עַל לֵב
  choice: elles ne viendront plus à l’esprit
  rationale: Transmet clairement le sens de l’expression idiomatique hébraïque, littéralement « monter sur le cœur ».
theological_decisions:
- issue: Portée de la nouvelle création promise
  choice: « de nouveaux cieux et une nouvelle terre » est conservé comme langage cosmique de création
  alternative: Comprendre l’expression uniquement comme une image de la restauration politique ou nationale
  rationale: Le couple « cieux et terre » possède une portée créationnelle. La traduction en maintient l’ampleur sans imposer un système eschatologique détaillé ni exclure les dimensions historiques du contexte.
translation_notes:
  register: Français international moderne, clair et soutenu. « Voici que » garde la solennité de l’annonce sans archaïsme excessif; « venir à l’esprit » traduit l’idiome de façon naturelle, avec sa forme littérale signalée en note.
