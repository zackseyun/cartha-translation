source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : « Voici, mes serviteurs[a] mangeront, mais vous aurez faim ; voici, mes serviteurs boiront, mais vous aurez soif ; voici, mes serviteurs se réjouiront, mais vous serez couverts de honte[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « esclaves » ; ici, « serviteurs » convient mieux à ceux qui appartiennent à Dieu et le servent.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous aurez honte ». L’hébreu peut évoquer soit le sentiment de honte, soit la disgrâce subie.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence qui relie cette annonce au réquisitoire précédent.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager dans un français actuel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יְהוִה, sans produire la répétition peu naturelle « le Seigneur SEIGNEUR ».
- source_word: הִנֵּה
  choice: voici
  rationale: Conserve la fonction d’appel à l’attention. En français, une occurrence introductive porte naturellement sur toute la série parallèle, sans qu’il soit nécessaire de répéter « voici » devant chaque proposition.
- source_word: עֲבָדַי
  choice: mes serviteurs
  rationale: Le terme peut désigner des esclaves ou des serviteurs ; ici, il souligne surtout l’appartenance à Dieu et le service qui lui est rendu.
- source_word: תִּרְעָבוּ
  choice: vous aurez faim
  rationale: Expression française idiomatique qui maintient le contraste concret avec « mangeront ».
- source_word: תִּצְמָאוּ
  choice: vous aurez soif
  rationale: Équivalent français naturel, directement opposé à « boiront ».
- source_word: יִשְׂמָחוּ
  choice: se réjouiront
  rationale: Préserve le registre prophétique élevé et l’expression active de la joie.
- source_word: תֵּבֹשׁוּ
  choice: vous serez couverts de honte
  rationale: Exprime ici la honte subie dans le renversement judiciaire annoncé, tout en restant idiomatique en français.
- source_word: וְאַתֶּם
  choice: mais vous
  rationale: La conjonction hébraïque est formellement additive, mais la structure répétée établit une opposition nette entre les deux groupes.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom divin. « Le Seigneur Yahweh » rend les deux éléments explicitement et évite de masquer le nom propre.
- issue: Nature de la honte exprimée par תֵּבֹשׁוּ
  choice: vous serez couverts de honte
  alternative: vous aurez honte
  rationale: Dans ce contexte de jugement, la formulation retenue fait ressortir la disgrâce subie ; une lecture centrée sur le sentiment intérieur demeure néanmoins possible.
translation_notes:
  register: Français international moderne, clair et solennel. Le parallélisme ternaire et l’opposition répétée entre « mes serviteurs » et « vous » sont conservés. La répétition hébraïque de הִנֵּה est condensée en une introduction unique, conformément à l’usage naturel du français, sans atténuer l’emphase de l’ensemble.
