  text: וְ/נָפַ֤ל אַשּׁוּר֙ בְּ/חֶ֣רֶב לֹא אִ֔ישׁ וְ/חֶ֥רֶב לֹֽא אָדָ֖ם תֹּֽאכֲלֶ֑/נּוּ וְ/נָ֥ס ל/וֹ֙ מִ/פְּנֵי חֶ֔רֶב וּ/בַחוּרָ֖י/ו לָ/מַ֥ס יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
translation:
  language: fr
  text: L’Assyrie tombera par une épée qui n’est pas celle d’un homme ; une épée qui n’est pas humaine la dévorera[a]. Elle fuira devant l’épée, et ses jeunes hommes[b] seront astreints au travail forcé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu oppose en parallèle « homme » et « être humain ». Il indique que l’épée ou la puissance qui frappe n’est pas humaine, sans préciser le moyen exact du jugement.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ses hommes d’élite ». Le terme hébreu désigne des jeunes hommes dans la force de l’âge, souvent dans un contexte militaire.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « seront soumis à la corvée », c’est-à-dire à un service obligatoire imposé par le vainqueur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפַל
  choice: tombera
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur prédictive ; le futur français la rend naturellement.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Le nom désigne ici collectivement la puissance assyrienne. « L’Assyrie » est la désignation française courante et permet de conserver cette portée nationale.
- source_word: בְּחֶרֶב
  choice: sous une épée
  rationale: La préposition indique ici le moyen de la chute. Cette tournure française reste proche de l’image hébraïque sans suggérer que l’Assyrie manie elle-même l’épée.
- source_word: לֹא אִישׁ … לֹא אָדָם
  choice: qui n’est pas celle d’un homme … qui n’est pas humaine
  rationale: La formulation conserve le parallélisme et reflète la variation entre אִישׁ et אָדָם, tout en exprimant clairement la négation d’une origine ou d’une puissance humaine.
- source_word: תֹּאכֲלֶנּוּ
  choice: la dévorera
  rationale: Le verbe, dont le sujet est « l’épée », emploie une image forte. « Dévorer » restitue cette métaphore de façon idiomatique en français.
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  choice: Elle fuira devant l’épée
  rationale: Le singulier collectif se poursuit avec l’Assyrie comme sujet. « Fuir devant » rend naturellement l’expression hébraïque מִפְּנֵי en français.
- source_word: בַחוּרָיו
  choice: ses jeunes hommes
  rationale: Le terme désigne normalement des hommes jeunes dans la force de l’âge, souvent avec une implication militaire contextuelle, sans signifier nécessairement « guerriers ».
- source_word: לָמַס יִהְיוּ
  choice: seront astreints au travail forcé
  rationale: מַס peut désigner une corvée ou un service obligatoire imposé par un vainqueur. La tournure choisie communique clairement la contrainte et l’état résultant.
theological_decisions:
- issue: Nature de l’épée qui abat l’Assyrie
  choice: Une épée qui n’est pas humaine, instrument du jugement
  alternative: Une épée littérale sans combattant humain, ou une image d’une intervention divine telle qu’un fléau ou une action angélique
  rationale: L’hébreu nie à deux reprises le caractère humain de l’épée ou de son action, mais ne précise pas le moyen exact du jugement. Le texte et la note maintiennent cette indétermination.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est conservé sans calquer lourdement la syntaxe hébraïque. La personnification féminine découle naturellement de « l’Assyrie » en français.
