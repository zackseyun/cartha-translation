source:
  edition: WLC
  text: כְּ/צִפֳּרִ֣ים עָפ֔וֹת כֵּ֗ן יָגֵ֛ן יְהוָ֥ה צְבָא֖וֹת עַל יְרֽוּשָׁלִָ֑ם גָּנ֥וֹן וְ/הִצִּ֖יל פָּסֹ֥חַ וְ/הִמְלִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
translation:
  language: fr
  text: 'Comme des oiseaux qui volent, ainsi Yahweh des armées défendra Jérusalem : il la défendra et la délivrera, il passera au-dessus d’elle[a] et la fera échapper.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il l’épargnera » ou « il la protégera » ; le verbe hébreu fait aussi écho au langage de la Pâque dans l’Exode.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/צִפֳּרִים עָפוֹת
  choice: Comme des oiseaux qui planent
  rationale: Le préfixe כְּ introduit la comparaison, צִפֳּרִים désigne des oiseaux et עָפוֹת signifie littéralement « volant ». « Qui planent » exprime naturellement en français l’image d’oiseaux volant au-dessus d’un lieu, sans expliciter davantage l’image protectrice.
- source_word: יָגֵן … גָּנוֹן
  choice: défendra … il la défendra
  rationale: La racine גנן exprime l’action de couvrir, protéger ou défendre. « Défendre » convient au contexte menaçant et permet de conserver la répétition insistante de la même racine hébraïque.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente le nom divin יהוה, tandis que « des armées » rend le pluriel צְבָאוֹת dans un français moderne et transparent, sans réduire ses possibles connotations terrestres ou célestes.
- source_word: עַל יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Avec le verbe « défendre », le français construit naturellement l’objet sans préposition. L’idée de protection exercée sur la ville demeure portée par le contexte et par la comparaison initiale.
- source_word: וְ/הִצִּיל
  choice: et la délivrera
  rationale: Le hifil de נצל signifie arracher au danger ou délivrer. Le futur coordonné rend clairement en français la séquence verbale hébraïque.
- source_word: פָּסֹחַ
  choice: il passera par-dessus elle
  rationale: Cette formulation conserve le sens concret possible de פסח et son écho au récit de la Pâque, au lieu de trancher silencieusement en faveur du seul sens « épargner » ou « protéger ».
- source_word: וְ/הִמְלִיט
  choice: et la fera échapper
  rationale: Le hifil de מלט signifie faire échapper ou mettre en sûreté. « La fera échapper » préserve cette valeur causative et distingue le verbe du précédent « délivrera ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de פָּסֹחַ et possible évocation de la Pâque
  choice: il passera par-dessus elle
  alternative: il l’épargnera / il la protégera
  rationale: Le choix principal garde l’écho lexical possible à la Pâque, tandis que la note signale les sens protecteurs également défendables. L’ambiguïté du texte n’est donc pas supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « défendra » reproduit l’insistance de la racine hébraïque. Le tour inhabituel « passera par-dessus elle » est maintenu pour préserver l’image et l’écho possible à la Pâque, avec une note qui en précise les autres lectures.
