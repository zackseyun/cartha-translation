id: ISA.31.2
reference: Isaiah 31:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם ה֤וּא חָכָם֙ וַ/יָּ֣בֵא רָ֔ע וְ/אֶת דְּבָרָ֖י/ו לֹ֣א הֵסִ֑יר וְ/קָם֙ עַל בֵּ֣ית מְרֵעִ֔ים וְ/עַל עֶזְרַ֖ת פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
translation:
  language: fr
  text: 'Pourtant, lui aussi est sage : il fait venir le malheur[a] et ne retire pas ses paroles[b]. Il se dresse contre la maison de ceux qui font le mal et contre l’aide de ceux qui commettent l’injustice.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la calamité ». Le mot hébreu peut signifier « mal », mais il désigne ici le malheur qui survient comme jugement, non le mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne révoque pas ses paroles »; littéralement, « n’enlève pas ses paroles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם הוּא
  choice: Pourtant, lui aussi
  rationale: 'Rend l’addition emphatique et la nuance contrastive, voire ironique, dans le contexte : le Seigneur aussi est sage, contrairement aux calculs humains fondés sur l’Égypte.'
- source_word: חָכָם
  choice: est sage
  rationale: Conserve le sens ordinaire de l’adjectif et la force judiciaire que lui donne le contexte.
- source_word: וַיָּבֵא רָע
  choice: il fait venir le malheur
  rationale: רָע désigne ici le malheur judiciaire ou la calamité, non le mal moral. La tournure causative préserve l’action exprimée par le verbe hébreu.
- source_word: וְאֶת דְּבָרָיו לֹא הֵסִיר
  choice: et ne retire pas ses paroles
  rationale: Suit de près l’image hébraïque tout en restant idiomatique en français; il ne révoque pas ce qu’il a annoncé.
- source_word: וְקָם עַל
  choice: Il se dresse contre
  rationale: Exprime l’intervention hostile portée par קום avec עַל. Une nouvelle phrase rend la progression naturelle sans effacer le waw hébreu.
- source_word: בֵּית מְרֵעִים
  choice: la maison de ceux qui font le mal
  rationale: Préserve le nom collectif « maison » et rend מְרֵעִים dans un français actuel et intelligible.
- source_word: עֶזְרַת
  choice: l’aide
  rationale: Conserve le substantif abstrait hébreu plutôt que de le transformer en nom de personnes (« ceux qui aident »).
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui commettent l’injustice
  rationale: Rend naturellement l’idée de personnes qui pratiquent activement une conduite mauvaise; « injustice » préserve la portée morale de אָוֶן sans employer le terme vieilli « iniquité ».
theological_decisions:
- issue: Sens de רָע appliqué à l’action divine
  choice: le malheur
  alternative: le mal; la calamité
  rationale: Dans ce contexte prophétique, le mot désigne un désastre infligé comme jugement. « Malheur » préserve cette portée sans laisser entendre que Dieu accomplit le mal moral.
- issue: Référent du pronom הוּא
  choice: maintenir « lui » dans le texte
  alternative: expliciter « le Seigneur »
  rationale: Le contexte identifie le Seigneur comme sujet. Le pronom emphatique de l’hébreu est conservé afin de maintenir le contraste sans ajouter un nom absent du verset.
- issue: Nature de l’« aide » visée
  choice: conserver le substantif abstrait « l’aide »
  alternative: les alliés; ceux qui aident
  rationale: Le texte condamne à la fois la maison des malfaiteurs et le secours sur lequel elle s’appuie. Garder l’abstraction évite de réduire la référence aux seules personnes.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque, tout en évitant les archaïsmes tels que « iniquité ». Les deux emplois moralement distincts de רָע et אָוֶן sont différenciés par « malheur » et « injustice ».
