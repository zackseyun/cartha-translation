source:
  edition: WLC
  text: וּ/מִצְרַ֤יִם אָדָם֙ וְֽ/לֹא אֵ֔ל וְ/סוּסֵי/הֶ֥ם בָּשָׂ֖ר וְ/לֹא ר֑וּחַ וַֽ/יהוָ֞ה יַטֶּ֣ה יָד֗/וֹ וְ/כָשַׁ֤ל עוֹזֵר֙ וְ/נָפַ֣ל עָזֻ֔ר וְ/יַחְדָּ֖ו כֻּלָּ֥/ם יִכְלָיֽוּ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
translation:
  language: fr
  text: L’Égypte est humaine, elle n’est pas Dieu[a] ; ses chevaux sont chair et non esprit[b]. Quand le Seigneur étendra la main, celui qui porte secours trébuchera, celui qui est secouru tombera, et tous ensemble, ils périront[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « L’Égypte est un être humain, et non Dieu. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, « esprit » peut aussi évoquer le souffle, la force vitale ou une puissance immatérielle ; le mot ne désigne pas nécessairement directement l’Esprit saint.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils seront tous anéantis » ; le verbe peut aussi exprimer l’idée d’être consumé ou détruit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם אָדָם
  choice: L’Égypte est humaine
  rationale: Le prédicat singulier אָדָם oppose la condition humaine et créaturelle de l’Égypte à Dieu. « Est humaine » est naturel en français et n’introduit pas l’idée que l’Égypte serait un homme de sexe masculin.
- source_word: אֵל
  choice: Dieu
  rationale: Dans cette opposition, אֵל désigne la divinité véritable, d’où la majuscule.
- source_word: סוּסֵיהֶם
  choice: ses chevaux
  rationale: Le référent collectif « l’Égypte » se reprend naturellement par le singulier en français, bien que le suffixe hébreu soit pluriel.
- source_word: בָּשָׂר
  choice: chair
  rationale: Le terme concret préserve l’opposition rhétorique avec רוּחַ ainsi que l’idée de fragilité créaturelle.
- source_word: רוּחַ
  choice: esprit
  rationale: La minuscule maintient l’ambiguïté entre souffle, force immatérielle et puissance spirituelle sans imposer une référence directe à l’Esprit saint.
- source_word: יהוה
  choice: le Seigneur
  rationale: Rendu français traditionnel et intelligible du nom divin dans le corps du texte.
- source_word: יַטֶּה יָדוֹ
  choice: étendra la main
  rationale: Expression française naturelle conservant l’image d’une intervention divine décisive. Le futur hébreu est rendu au futur dans la proposition temporelle.
- source_word: עוֹזֵר
  choice: celui qui porte secours
  rationale: Rend clairement le participe actif et forme un contraste naturel avec le participe passif suivant.
- source_word: עָזֻר
  choice: celui qui est secouru
  rationale: Préserve la distinction grammaticale entre l’auteur et le bénéficiaire de l’aide.
- source_word: כָשַׁל
  choice: trébuchera
  rationale: Conserve l’image du faux pas qui précède la chute.
- source_word: נָפַל
  choice: tombera
  rationale: Traduction directe qui maintient la progression « trébucher / tomber ».
- source_word: יִכְלָיוּן
  choice: disparaîtront
  rationale: Exprime l’issue commune et définitive, tout en laissant en note les nuances possibles de périr ou d’être anéanti.
theological_decisions:
- issue: Portée de רוּחַ dans l’opposition entre chair et esprit
  choice: esprit
  alternative: souffle ; Esprit
  rationale: Le contexte oppose la faiblesse matérielle des chevaux à une puissance non charnelle. La minuscule évite d’identifier explicitement le terme à l’Esprit saint, identification que l’hébreu n’impose pas.
- issue: Sens de אָדָם appliqué à l’Égypte
  choice: humaine
  alternative: un homme ; faite d’hommes
  rationale: Le propos porte sur le caractère humain, non divin et créaturel de l’Égypte. La formulation choisie garde ce contraste sans suggérer que le sexe masculin serait en jeu.
- issue: Identification des deux parties qui s’effondrent
  choice: celui qui porte secours / celui qui est secouru
  alternative: l’allié / celui qu’il aide
  rationale: Les désignations fonctionnelles préservent la portée générale des participes et n’explicitent pas davantage que le texte les identités d’Égypte et de Juda.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure antithétique « humaine / Dieu » et « chair / esprit », puis la progression « trébuchera / tombera / disparaîtront », reproduisent la force rhétorique de l’hébreu sans alourdir la phrase.
