  text: כִּ֚י בַּ/יּ֣וֹם הַ/ה֔וּא יִמְאָס֗וּ/ן אִ֚ישׁ אֱלִילֵ֣י כַסְפּ֔/וֹ וֶ/אֱלִילֵ֖י זְהָב֑/וֹ אֲשֶׁ֨ר עָשׂ֥וּ לָ/כֶ֛ם יְדֵי/כֶ֖ם חֵֽטְא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: fr
  text: Car, ce jour-là, chacun rejettera ses idoles d’argent et ses idoles d’or, que vous avez fabriquées pour vous de vos propres mains en péchant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִמְאָסוּן
  choice: rejettera
  rationale: Le verbe מָאַס exprime le rejet ou le refus; le singulier français s’accorde naturellement avec « chacun », qui rend אִישׁ distributif.
- source_word: אֱלִילֵי כַסְפּוֹ וֶאֱלִילֵי זְהָבוֹ
  choice: ses idoles d’argent et ses idoles d’or
  rationale: Rend directement les deux groupes parallèles et conserve les possessifs singuliers du texte hébreu.
- source_word: אֲשֶׁר עָשׂוּ לָכֶם יְדֵיכֶם
  choice: que vos mains ont fabriquées pour vous
  rationale: Préserve le passage du singulier distributif au pluriel collectif ainsi que l’insistance hébraïque sur la responsabilité humaine.
- source_word: חֵטְא
  choice: commettant ainsi un péché
  rationale: Le nom final « péché », syntaxiquement abrupt en hébreu, qualifie vraisemblablement l’acte de fabrication; cette formulation française conserve sa portée morale sans traiter les idoles elles-mêmes comme une offrande pour le péché.
theological_decisions:
- issue: Rapport syntaxique du mot final חֵטְא à la fabrication des idoles
  choice: « commettant ainsi un péché »
  alternative: « que vos mains pécheresses ont fabriquées pour vous » ou « que vos mains ont fabriquées pour vous comme un péché »
  rationale: Le texte massorétique place un nom singulier absolu à la fin sans préposition explicite. La formulation retenue signale l’apposition circonstancielle probable—la fabrication constitue un péché—tout en évitant une expression française obscure ou une lecture sacrificielle indue.
translation_notes:
  register: Français international moderne, clair et digne. « Chacun » restitue naturellement la valeur distributive de אִישׁ; « fabriquer » convient à des objets matériels et souligne qu’ils sont l’œuvre des mains humaines.
