review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : le rejet distributif des idoles d’argent et d’or, fabriquées par les destinataires eux-mêmes, correspond au texte hébreu. Toutefois, « commettant ainsi un péché » rattache grammaticalement le participe à « vos mains », comme si les mains étaient le sujet moral de l’acte. La finale hébraïque חֵטְא est elliptique et qualifie vraisemblablement la fabrication comme acte de péché; il convient de le rendre sans cette anomalie syntaxique.'
  naturalness: La phrase est naturelle jusqu’à la finale. La reformulation proposée est idiomatique en français moderne et maintient l’insistance sur la responsabilité humaine par « de vos propres mains ».
  terminology: « idoles », « argent », « or » et « rejettera » conviennent. « Fabriquer » est approprié pour des images cultuelles. « En péchant » rend sobrement la valeur morale de חֵטְא sans introduire une lecture sacrificielle.
  issues:
  - severity: medium
    issue: Participe à sujet grammatical inadéquat dans « vos mains ont fabriquées pour vous, commettant ainsi un péché ».
    rationale: En français, « commettant » se rapporte normalement au sujet immédiatement disponible, « vos mains ». Or le péché est celui des fabricants. L’hébreu final חֵטְא est elliptique; il ne requiert pas de faire des mains l’agent de l’action morale.
  revised_text: Car, ce jour-là, chacun rejettera ses idoles d’argent et ses idoles d’or, que vous avez fabriquées pour vous de vos propres mains en péchant.
