source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
translation:
  language: fr
  text: Malheur à ceux qui descendent en Égypte pour y chercher du secours, qui s’appuient sur des chevaux et mettent leur confiance dans les chars parce qu’ils sont nombreux, et dans les cavaliers[a] parce qu’ils sont très puissants, mais qui ne se tournent pas vers le Saint d’Israël et ne recherchent pas Yahweh[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cavalerie ».
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » représente le nom divin hébreu YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de dénonciation et d’annonce du jugement propre à l’interjection prophétique.
- source_word: הַיֹּרְדִים מִצְרַיִם לְעֶזְרָה
  choice: ceux qui descendent en Égypte pour chercher du secours
  rationale: « Descendent » respecte la représentation géographique hébraïque; « pour chercher du secours » exprime naturellement le but du déplacement sans le confondre avec le verbe final « rechercher ».
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  choice: qui s’appuient sur des chevaux
  rationale: Le verbe à l’état niphal évoque concrètement le fait de prendre appui sur quelque chose et, figurativement, d’en dépendre.
- source_word: וַיִּבְטְחוּ עַל רֶכֶב
  choice: et mettent leur confiance dans les chars
  rationale: Cette tournure française rend clairement la confiance placée dans la puissance militaire; le singulier collectif רֶכֶב est rendu au pluriel.
- source_word: כִּי רָב
  choice: parce qu’ils sont nombreux
  rationale: L’adjectif renvoie à l’abondance des chars, compris comme une force collective.
- source_word: וְעַל פָּרָשִׁים
  choice: ainsi que dans les cavaliers
  rationale: « Cavaliers » préserve l’image concrète des combattants montés; « cavalerie » reste une possibilité collective.
- source_word: כִּי עָצְמוּ מְאֹד
  choice: parce qu’ils sont très puissants
  rationale: עָצַם peut évoquer la force ou l’importance numérique; « puissants » maintient ici l’accent militaire sans réduire le sens au seul nombre.
- source_word: וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל
  choice: mais qui ne tournent pas leurs regards vers le Saint d’Israël
  rationale: Cette formulation exprime l’attention orientée vers quelqu’un et fait ressortir le contraste avec l’appui recherché auprès de l’Égypte.
- source_word: וְאֶת יְהוָה לֹא דָרָשׁוּ
  choice: et ne recherchent pas Yahweh
  rationale: « Rechercher » rend la démarche de consultation et de recours à Dieu, tandis que « Yahweh » représente directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Valeur temporelle des formes verbales dans l’oracle
  choice: présent à portée générale
  alternative: passé narratif
  rationale: Le participe substantivé introduit une catégorie de personnes visée par le malheur prophétique; le présent français maintient cette portée caractérisante malgré la succession de formes hébraïques pouvant être rendues littéralement au passé.
- issue: Sens de עָצְמוּ dans le parallèle militaire
  choice: très puissants
  alternative: très nombreux
  rationale: Le verbe peut exprimer la puissance ou l’accroissement numérique. Le parallélisme avec les chars « nombreux » permet de conserver une nuance distincte de puissance, sans nier l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue phrase conserve l’élan rhétorique de l’oracle tout en clarifiant les rapports syntaxiques. « Malheur à », « le Saint d’Israël » et « Yahweh » maintiennent la dignité et les repères théologiques du texte source.
