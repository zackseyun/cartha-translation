revisions:
- from: Malheur à ceux qui descendent en Égypte pour chercher du secours, qui s’appuient sur des chevaux et mettent leur confiance dans les chars parce qu’ils sont nombreux, ainsi que dans les cavaliers[a] parce qu’ils sont très puissants, mais qui ne tournent pas leurs regards vers le Saint d’Israël et ne recherchent pas Yahweh[b] !
  to: Malheur à ceux qui descendent en Égypte pour y chercher du secours, qui s’appuient sur des chevaux et mettent leur confiance dans les chars parce qu’ils sont nombreux, et dans les cavaliers[a] parce qu’ils sont très puissants, mais qui ne se tournent pas vers le Saint d’Israël et ne recherchent pas Yahweh[b] !
  rationale: 'Révision limitée à deux améliorations stylistiques et syntaxiques sûres : la coordination explicite de la confiance placée dans les chars et les cavaliers, et une formulation française plus naturelle pour le refus de se tourner vers le Saint d’Israël. Le sens, le présent caractérisant de l’oracle, les termes théologiques et les notes sont maintenus.'
