  text: כִּ֣י כֹ֣ה אָֽמַר יְהוָ֣ה אֵלַ֡/י כַּ/אֲשֶׁ֣ר יֶהְגֶּה֩ הָ/אַרְיֵ֨ה וְ/הַ/כְּפִ֜יר עַל טַרְפּ֗/וֹ אֲשֶׁ֨ר יִקָּרֵ֤א עָלָי/ו֙ מְלֹ֣א רֹעִ֔ים מִ/קּוֹלָ/ם֙ לֹ֣א יֵחָ֔ת וּ/מֵֽ/הֲמוֹנָ֖/ם לֹ֣א יַֽעֲנֶ֑ה כֵּ֗ן יֵרֵד֙ יְהוָ֣ה צְבָא֔וֹת לִ/צְבֹּ֥א עַל הַר צִיּ֖וֹן וְ/עַל גִּבְעָתָֽ/הּ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
translation:
  language: fr
  text: 'Car ainsi Yahweh m’a dit : Comme le lion, ou le jeune lion, gronde sur sa proie[a], même si une foule de bergers est appelée contre lui, il n’est pas terrifié par leur voix ni intimidé par leur vacarme[b] ; ainsi Yahweh des armées descendra pour combattre sur le mont Sion et sur sa colline.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lion et le jeune lion » ; la paire hébraïque peut être comprise comme un doublet poétique plutôt que comme une stricte alternative.
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne répond pas à leur vacarme » ; le verbe hébreu peut signifier plus littéralement « répondre », mais le parallèle suggère ici l’idée de ne pas se laisser soumettre ou intimider.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin et le distingue du titre « Seigneur ».
- source_word: יֶהְגֶּה
  choice: gronde
  rationale: Évoque le grondement bas et menaçant du lion penché sur sa proie plutôt qu’un rugissement à pleine voix.
- source_word: הָאַרְיֵה וְהַכְּפִיר
  choice: le lion, ou le jeune lion
  rationale: Rend la paire poétique de façon naturelle sans imposer l’image de deux animaux agissant ensemble ; l’autre analyse est signalée en note.
- source_word: מְלֹא רֹעִים
  choice: une foule de bergers
  rationale: Exprime le groupe complet ou nombreux de bergers rassemblés, dans un français courant et digne.
- source_word: מִקּוֹלָם
  choice: par leurs cris
  rationale: Dans la scène, « voix » désigne concrètement les cris destinés à effrayer le lion.
- source_word: לֹא יֵחָת
  choice: il n’est pas terrifié
  rationale: Conserve la force de l’idée d’épouvante ou de consternation dans l’image du prédateur impassible.
- source_word: לֹא יַעֲנֶה
  choice: ni intimidé
  rationale: Le parallélisme favorise ici l’idée de soumission ou d’intimidation, tout en maintenant en note le sens plus littéral possible de « répondre ».
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Rend le titre de manière transparente et en préserve la portée militaire dans ce contexte.
- source_word: לִצְבֹּא
  choice: pour combattre
  rationale: Exprime l’action militaire de partir en campagne ou de livrer bataille, naturellement en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Relation de Yahweh à Sion dans לִצְבֹּא עַל
  choice: combattre sur le mont Sion
  alternative: combattre contre le mont Sion ; combattre pour le mont Sion
  rationale: La préposition עַל peut décrire le lieu ou la cible, tandis que le contexte plus large peut suggérer une défense de Sion. « Sur » préserve cette tension au lieu de préciser silencieusement contre qui Yahweh combat.
- issue: Sens de לֹא יַעֲנֶה
  choice: le lion n’est pas intimidé par le vacarme
  alternative: le lion ne répond pas au vacarme
  rationale: Le parallélisme avec « n’est pas terrifié » soutient un effet de subjugation ou d’intimidation ; la lecture littérale reste explicitement disponible en note.
translation_notes:
  register: Français international moderne, accessible et soutenu sans archaïsme. La ponctuation conserve l’ample comparaison prophétique. « Yahweh des armées » maintient la transparence du titre, et « combattre sur » laisse ouverte l’ambiguïté réelle concernant la cible ou le lieu du combat.
