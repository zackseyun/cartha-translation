base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
translation:
  language: fr
  text: Son rocher disparaîtra sous l’effet de la terreur[a], et ses chefs seront consternés à cause de l’étendard[b], déclare Yahweh, dont le feu est à Sion et dont la fournaise est à Jérusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son refuge fort disparaîtra dans la terreur ». Le mot hébreu traduit par « rocher » peut être une image du refuge puissant ou du dirigeant de l’Assyrie.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses chefs seront épouvantés au signal ». Le terme hébreu peut désigner un étendard, un signal ou une bannière.
    reason: alternative_reading
  - marker: c
    text: Le « feu » et la « fournaise » de Yahweh à Sion et à Jérusalem évoquent probablement sa présence consumante dans le jugement, sans que le texte précise davantage cette image.
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  choice: son rocher
  rationale: Le sens concret de סֶלַע, « rocher », est conservé afin de préserver la métaphore hébraïque, qui peut désigner le refuge puissant ou le dirigeant de l’Assyrie.
- source_word: מִמָּגוֹר יַעֲבוֹר
  choice: disparaîtra sous l’effet de la terreur
  rationale: עבר exprime ici vraisemblablement la disparition ou la mise à l’écart, tandis que מִן peut indiquer la cause. Cette formulation est naturelle en français sans supprimer l’ambiguïté de la préposition.
- source_word: וְחַתּוּ
  choice: seront épouvantés
  rationale: Le qal de חתת peut évoquer l’effondrement, la consternation ou la terreur. Avec des responsables humains comme sujet, « seront épouvantés » convient au contexte de panique militaire.
- source_word: מִנֵּס
  choice: devant l’étendard
  rationale: נֵס désigne un étendard ou signal dressé. La traduction conserve l’image visible et laisse ouverte la question de savoir s’il s’agit d’un signal de bataille ou de rassemblement.
- source_word: שָׂרָיו
  choice: ses chefs
  rationale: שַׂר peut désigner des princes, des responsables ou des commandants. « Chefs » reste large, naturel et adapté au contexte militaire.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique est rendue idiomatiquement, et le nom divin יהוה est translittéré « Yahweh » conformément à la couche de consultation fournie.
- source_word: אֲשֶׁר אוּר לוֹ בְצִיּוֹן
  choice: lui qui a son feu à Sion
  rationale: אוּר signifie ici « feu », notamment en parallèle avec « fournaise ». La construction avec לוֹ est rendue naturellement sans déterminer davantage la nature de ce feu.
- source_word: וְתַנּוּר לוֹ בִּירוּשָׁלִָם
  choice: et sa fournaise à Jérusalem
  rationale: תַּנּוּר peut désigner un four ou une fournaise. « Fournaise » maintient l’intensité de l’image et son parallélisme avec le feu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve ici le nom propre divin, conformément aux indications théologiques de la consultation anglaise.
- issue: Portée de l’image du feu et de la fournaise
  choice: Conserver l’image sans l’identifier précisément
  alternative: L’expliciter comme feu de l’autel ou comme jugement eschatologique
  rationale: Le texte associe à Yahweh un feu à Sion et une fournaise à Jérusalem, mais n’en fixe pas explicitement la référence. La traduction préserve donc la tension entre présence divine et jugement.
- issue: Référent métaphorique de « son rocher »
  choice: Maintenir « son rocher » dans le texte
  alternative: son refuge fort ou son roi
  rationale: Le contexte permet plusieurs référents possibles. Les préciser dans le corps du texte résoudrait une ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique reste compact; les images concrètes de « rocher », « étendard », « feu » et « fournaise » sont préservées, tandis que les principales ambiguïtés lexicales sont signalées en notes.
