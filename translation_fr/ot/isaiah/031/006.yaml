source:
  edition: WLC
  text: שׁ֗וּבוּ לַ/אֲשֶׁ֛ר הֶעְמִ֥יקוּ סָרָ֖ה בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/006.yaml
  text: Return to him from whom the sons of Israel have deeply revolted[a][b].
translation:
  language: fr
  text: Revenez à celui contre qui vous vous êtes si profondément révoltés, fils d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Revenez à celui dont vous vous êtes si profondément détournés, fils d’Israël. » La construction hébraïque est condensée et associe le retour vers Dieu à la profonde rébellion d’Israël contre lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Revenez
  rationale: L’impératif pluriel de שׁוב appelle à revenir, avec ici une portée de repentance. « Revenez » conserve le mouvement vers la personne visée et reste naturel en français.
- source_word: לַאֲשֶׁר
  choice: à celui contre qui
  rationale: La construction relative est condensée. La préposition ל marque la personne vers laquelle il faut revenir, tandis que la révolte qui suit appelle en français « contre qui ». Cette formulation préserve le relatif sans ajouter explicitement le nom de Dieu.
- source_word: הֶעְמִיקוּ סָרָה
  choice: vous vous êtes si profondément révoltés
  rationale: Le hifil de עמק intensifie סרה, terme de défection ou de rébellion. La tournure adverbiale rend naturellement l’idée d’une révolte poussée très loin.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Traduction formellement proche du syntagme hébreu masculin pluriel, employé ici comme désignation collective d’Israël.
theological_decisions:
- issue: Faut-il nommer explicitement Dieu ou le SEIGNEUR comme objet du retour ?
  choice: Conserver l’expression relative « celui contre qui »
  alternative: « Revenez au SEIGNEUR, contre qui… »
  rationale: Le contexte identifie le référent comme le Dieu d’Israël, mais le verset hébreu ne donne pas ici le nom divin. La traduction évite donc de l’ajouter.
- issue: Rapport entre le retour vers quelqu’un et la révolte contre lui
  choice: « à celui contre qui »
  alternative: « à celui dont vous vous êtes profondément détournés »
  rationale: La formulation retenue exprime à la fois la direction du retour et l’objet de la révolte. L’alternative restitue mieux l’éloignement, mais atténue la force de סרה comme rébellion.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le vocatif final « fils d’Israël » suit l’ordre hébreu et maintient la désignation collective sans employer la formulation traditionnelle « enfants d’Israël ».
