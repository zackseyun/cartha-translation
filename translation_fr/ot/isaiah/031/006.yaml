  source_fidelity: « Revenez à celui contre qui vous vous êtes si profondément révoltés » rend adéquatement l’impératif pluriel שׁוּבוּ, la construction relative condensée לַאֲשֶׁר et l’intensification de la rébellion dans הֶעְמִיקוּ סָרָה. Le relatif ne nomme pas Dieu explicitement, conformément à l’hébreu, tout en exprimant clairement que le retour est dirigé vers celui contre qui Israël s’est rebellé. Le vocatif final « fils d’Israël » est défendable pour בְּנֵי יִשְׂרָאֵל et explique correctement l’adresse à la deuxième personne.
