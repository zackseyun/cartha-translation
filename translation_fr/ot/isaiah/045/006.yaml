source:
  edition: WLC
  text: לְמַ֣עַן יֵדְע֗וּ מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ וּ/מִ/מַּ֣עֲרָבָ֔/הּ כִּי אֶ֖פֶס בִּלְעָדָ֑/י אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/006.yaml
  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
translation:
  language: fr
  text: afin qu’on sache, du levant au couchant[a], qu’il n’y a pas d’autre que moi. Je suis Yahvé[b], et il n’y en a pas d’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis le lever du soleil et depuis son coucher » ; c’est-à-dire d’est en ouest.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH ; traditionnellement traduit par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: afin que l’on sache
  rationale: La construction exprime le but ou le résultat visé. Le pronom indéfini « on » rend naturellement en français le sujet pluriel non exprimé sans lui attribuer un référent plus précis que l’hébreu.
- source_word: מִמִּזְרַח שֶׁמֶשׁ וּמִמַּעֲרָבָהּ
  choice: du levant au couchant
  rationale: Cette formulation française conserve l’image solaire et exprime naturellement l’étendue d’est en ouest. La note donne le sens littéral de la construction hébraïque.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qui doit être su.
- source_word: אֶפֶס בִּלְעָדָי
  choice: qu’il n’y en a aucun en dehors de moi
  rationale: La formulation exprime l’unicité exclusive affirmée par l’idiome hébreu, sans préciser indûment « personne » ou « rien ».
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahvé
  rationale: Le pronom explicite est conservé pour l’emphase, et le nom divin est rendu par sa forme française courante « Yahvé ».
- source_word: וְאֵין עוֹד
  choice: et il n’y en a pas d’autre
  rationale: Cette tournure française claire conserve la formule absolue d’exclusivité et son parallélisme avec la proposition précédente.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » représente le nom propre en français, tandis que la note signale la traduction traditionnelle.
- issue: Portée de l’expression géographique
  choice: du levant au couchant
  alternative: depuis le lieu où le soleil se lève jusqu’au lieu où il se couche
  rationale: La traduction retient l’image solaire et sa portée universelle sans la réduire aux seuls points cardinaux.
- issue: Formule d’exclusivité monothéiste
  choice: il n’y en a aucun en dehors de moi… il n’y en a pas d’autre
  alternative: il n’y a rien à part moi… il n’y en a plus
  rationale: Le choix garde la portée absolue ainsi que la tension lexicale de l’hébreu sans ajouter une formulation doctrinale postérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « Du levant au couchant » maintient la poésie tout en restant intelligible ; la répétition finale conserve l’insistance rhétorique de l’hébreu.
