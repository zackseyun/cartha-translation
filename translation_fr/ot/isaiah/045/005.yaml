source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ וְ/אֵ֣ין ע֔וֹד זוּלָתִ֖/י אֵ֣ין אֱלֹהִ֑ים אֲאַזֶּרְ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
translation:
  language: fr
  text: Je suis Yahweh, et il n’y en a pas d’autre ; hors de moi, il n’y a pas de Dieu. Je te fortifie[a], bien que tu ne m’aies pas connu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je t’équipe », « je t’arme » ou « je te ceins ». Le verbe hébreu peut désigner le fait d’équiper ou de ceindre quelqu’un pour lui donner de la force.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et tu ne m’as pas connu ». La conjonction hébraïque peut exprimer une simple coordination, bien que le contexte permette de la comprendre dans un sens concessif.'
    reason: source_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre, conformément au texte hébreu.
- source_word: וְאֵין עוֹד
  choice: et il n’y en a pas d’autre
  rationale: Cette tournure française naturelle conserve l’affirmation absolue d’exclusivité exprimée par אֵין עוֹד.
- source_word: זוּלָתִי
  choice: en dehors de moi
  rationale: Cette expression rend clairement l’exclusion marquée par la préposition munie du suffixe de première personne et maintient le parallélisme.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: 'Dans cette affirmation monothéiste absolue, la majuscule convient au sens référentiel : aucun Dieu n’existe en dehors de Yahweh.'
- source_word: אֲאַזֶּרְךָ
  choice: Je te fortifie
  rationale: Au piel, אזר peut évoquer le fait de ceindre, d’équiper ou de donner de la force. « Je te fortifie » exprime naturellement en français l’habilitation accordée à Cyrus, tandis qu’une note conserve les images lexicales possibles.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: bien que tu ne me connaisses pas
  rationale: 'Dans le contexte, la coordination prend naturellement une valeur concessive : Yahweh habilite Cyrus malgré l’absence de connaissance de sa part. Le présent français garde cette absence de connaissance comme état pertinent, sans la surinterpréter.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ou « le Seigneur »
  rationale: Le texte emploie directement le nom divin. Sa transcription préserve le nom personnel au lieu de lui substituer un titre.
- issue: Valeur de la conjonction dans la proposition finale
  choice: bien que tu ne me connaisses pas
  alternative: et tu ne me connaissais pas
  rationale: Le contexte favorise une relation concessive, soulignant que Yahweh fortifie Cyrus sans que celui-ci le connaisse. Une note signale toutefois que la conjonction hébraïque peut être comprise comme une simple coordination.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le parallélisme des deux affirmations d’exclusivité est conservé, ainsi que la tension entre l’action souveraine de Yahweh et l’absence de connaissance chez Cyrus.
