  text: אֲנִי֙ לְ/פָנֶ֣י/ךָ אֵלֵ֔ךְ וַ/הֲדוּרִ֖ים אושר דַּלְת֤וֹת נְחוּשָׁה֙ אֲשַׁבֵּ֔ר וּ/בְרִיחֵ֥י בַרְזֶ֖ל אֲגַדֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
translation:
  language: fr
  text: Moi-même, j’irai devant toi et j’aplanirai les terrains accidentés[a] ; je briserai les portes de bronze et je couperai les barres de fer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je rendrai droits les lieux accidentés ». L’expression hébraïque est difficile sur les plans textuel et lexical ; certaines traductions comprennent plus précisément « les montagnes » ou « les hauteurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Moi-même
  rationale: Le pronom explicite, normalement facultatif en hébreu, souligne l’engagement personnel de celui qui parle.
- source_word: לְפָנֶיךָ אֵלֵךְ
  choice: je marcherai devant toi
  rationale: L’expression indique que le locuteur ira en avant de son destinataire. Le futur convient au contexte de promesse prophétique.
- source_word: וַהֲדוּרִים אושר
  choice: et j’aplanirai les endroits accidentés
  rationale: La formulation hébraïque transmise est difficile sur les plans textuel et lexical. Cette traduction conserve l’idée probable d’un terrain irrégulier ou élevé rendu praticable, sans préciser indûment qu’il s’agit de montagnes.
- source_word: דַּלְתוֹת נְחוּשָׁה
  choice: les portes de bronze
  rationale: דְּלָתוֹת désigne littéralement des portes, tandis que נְחוּשָׁה désigne ici le bronze.
- source_word: אֲשַׁבֵּר
  choice: je briserai
  rationale: Le piel exprime une action énergique et destructrice ; « briser » la rend naturellement en français.
- source_word: בְרִיחֵי בַרְזֶל
  choice: les barres de fer
  rationale: בְּרִיחַ désigne une barre ou un verrou servant à fermer une porte. « Barres de fer » s’accorde bien avec le parallélisme.
- source_word: אֲגַדֵּעַ
  choice: je trancherai
  rationale: Le verbe évoque le fait de couper nettement ou de sectionner ; « trancher » exprime ici la suppression décisive des barres.
theological_decisions:
- issue: Mise en relief de l’engagement divin
  choice: Moi-même, je marcherai devant toi
  alternative: Je marcherai devant toi
  rationale: L’hébreu emploie le pronom indépendant אֲנִי, ce qui met le sujet en relief. « Moi-même » préserve cette insistance sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle de la promesse est conservé, avec un vocabulaire concret. La note maintient l’incertitude réelle de la deuxième proposition.
