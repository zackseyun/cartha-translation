base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
translation:
  language: fr
  text: À cause de Jacob, mon serviteur, et d’Israël, celui que j’ai choisi, je t’ai appelé par ton nom ; je t’ai donné un titre[a], alors même que tu ne me connaissais pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je t’ai donné un nom », « je t’ai attribué une appellation » ou « je t’ai désigné ». Le verbe hébreu peut désigner l’attribution d’un nom, d’une appellation ou d’un titre.
    reason: alternative lexicale pour un verbe hébreu rare
lexical_decisions:
- source_word: לְמַעַן
  choice: À cause de
  rationale: Exprime ici le motif de l’action divine en faveur de Jacob et d’Israël. Cette formulation est naturelle en français et conserve la nuance causale et intentionnelle.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte prophétique, le terme constitue une désignation honorifique et relationnelle de Jacob, sans mettre l’accent sur la servitude juridique.
- source_word: בְּחִירִי
  choice: celui que j’ai choisi
  rationale: Rend clairement la valeur substantivée du terme et la relation personnelle exprimée par le suffixe possessif.
- source_word: וָאֶקְרָא לְךָ בִּשְׁמֶךָ
  choice: je t’ai appelé par ton nom
  rationale: Reproduit l’idée d’un appel et d’une désignation personnels tout en restant idiomatique en français.
- source_word: אֲכַנְּךָ
  choice: je t’ai donné un titre
  rationale: Le verbe rare désigne vraisemblablement l’attribution d’une appellation ou d’un titre. Cette traduction reste compréhensible sans préciser de façon excessive la nature honorifique de ce titre.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: alors même que tu ne me connaissais pas
  rationale: La tournure concessive fait ressortir que Dieu a appelé et désigné Cyrus malgré son absence de connaissance de Dieu.
theological_decisions:
- issue: Ignorance de Dieu par le destinataire
  choice: Le texte affirme que Cyrus ne connaissait pas Dieu au moment où Dieu l’a appelé et lui a donné un titre.
  alternative: Comprendre qu’il ne reconnaissait pas pleinement Dieu plutôt qu’il l’ignorait entièrement.
  rationale: 'Le français conserve la tension du contexte : Dieu mandate souverainement un dirigeant étranger qui ne le connaît pas, sans suggérer une conversion ni définir davantage la nature de cette ignorance.'
- issue: Identification du locuteur dans le pronom « me »
  choice: Traduire littéralement par « me ».
  alternative: Expliciter par « le Seigneur » ou « l’Éternel ».
  rationale: L’hébreu emploie uniquement un suffixe objet de première personne. Le contexte identifie déjà le locuteur divin ; une explicitation ajouterait une interprétation absente de cette proposition.
translation_notes:
  register: Français international moderne, clair et digne. La construction détachée met en relief le motif de l’action divine. « Alors même que » exprime naturellement la concession sans atténuer l’ignorance de Dieu attribuée à Cyrus.
