review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : les artisans d’images/idoles subissent collectivement honte et humiliation, puis vont dans la disgrâce. Toutefois, « tous humiliés » atténue la coordination emphatique de וְגַם et la ponctuation actuelle laisse « les artisans d’idoles » comme une apposition finale assez lourde et syntaxiquement flottante.'
  naturalness: '« Ils sont couverts de honte, tous humiliés ; ensemble, ils s’en vont dans la disgrâce, les artisans d’idoles » n’est pas pleinement naturel en français moderne : l’apposition finale après une proposition complète est ambiguë. Une reprise explicite du sujet nommé améliore nettement la lisibilité tout en conservant le parallélisme.'
  terminology: « Artisans d’idoles » est un choix approprié dans le contexte polémique et « images » doit demeurer en note comme possibilité lexicale. « Couverts de honte », « humiliés » et « disgrâce » rendent convenablement les termes hébreux apparentés sans les aplatir.
  issues:
  - severity: medium
    issue: Coordination de וְגַם insuffisamment exprimée
    rationale: « Tous humiliés » ne rend pas clairement « et aussi/et même humiliés ». Il convient d’exprimer la seconde prédication coordonnée.
  - severity: medium
    issue: Apposition finale ambiguë
    rationale: Après « ils s’en vont dans la disgrâce », « les artisans d’idoles » est grammaticalement possible mais pesant et peut sembler détaché de façon imprécise. En faire le sujet explicite de la seconde proposition reflète clairement le sens.
  revised_text: Ils sont couverts de honte et aussi humiliés, tous ensemble ; les artisans d’idoles s’en vont dans la disgrâce[a].
  revised_footnotes:
  - marker: a
    text: Ou « les artisans d’images ».
    reason: Alternative lexicale pour צִירִים, qui peut désigner des images façonnées, comprises ici comme des idoles.
  revision_rationale: La révision restitue explicitement la coordination « et aussi », conserve l’intensité collective de « tous ensemble » et rend la dernière expression hébraïque par un sujet français clair. La note préserve l’alternative « images » sans imposer au texte principal une interprétation au-delà du contexte immédiat.
