source:
  edition: WLC
  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
translation:
  language: fr
  text: Ils sont couverts de honte et aussi humiliés, tous ensemble ; les artisans d’idoles s’en vont dans la disgrâce[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les artisans d’images ».
    reason: Alternative lexicale pour צִירִים, qui peut désigner des images façonnées, comprises ici comme des idoles.
lexical_decisions:
- source_word: בּוֹשׁוּ
  choice: sont couverts de honte
  rationale: Le verbe exprime ici la honte et l’échec publiquement constatés. Cette tournure française rend naturellement l’état résultant du parfait prophétique.
- source_word: וְגַם נִכְלְמוּ
  choice: tous humiliés
  rationale: וְגַם renforce le second terme parallèle, tandis que נכלם intensifie l’idée de honte. En français, « tous humiliés » conserve la progression sans lourde répétition de la coordination.
- source_word: כֻּלָּם יַחְדָּו
  choice: tous… ensemble
  rationale: Les deux éléments sont rendus explicitement afin de préserver à la fois la totalité du groupe et son sort commun.
- source_word: הָלְכוּ בַכְּלִמָּה
  choice: ils s’en vont dans la disgrâce
  rationale: הלך décrit idiomatiquement l’entrée ou le départ dans un état. Le présent français convient à la déclaration prophétique et « dans la disgrâce » conserve l’image hébraïque.
- source_word: חָרָשֵׁי צִירִים
  choice: les artisans d’idoles
  rationale: חָרָשׁ désigne des artisans ou fabricants, et צִירִים, dans cette polémique contre les faux dieux, des représentations cultuelles. « Artisans d’idoles » reste précis et naturel.
theological_decisions:
- issue: Référent de חָרָשֵׁי צִירִים
  choice: les artisans d’idoles
  alternative: les artisans d’images
  rationale: Le contexte immédiat oppose le Seigneur aux faux dieux et à ceux qui les façonnent. « Idoles » explicite la fonction cultuelle, tandis que la note conserve le sens lexical plus général « images ».
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure poétique garde le parallélisme des termes de honte et place le groupe visé en apposition finale, conformément à l’ordre emphatique de l’hébreu.
