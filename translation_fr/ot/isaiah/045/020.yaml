language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִקָּבְצ֥וּ וָ/בֹ֛אוּ הִֽתְנַגְּשׁ֥וּ יַחְדָּ֖ו פְּלִיטֵ֣י הַ/גּוֹיִ֑ם לֹ֣א יָדְע֗וּ הַ/נֹּֽשְׂאִים֙ אֶת עֵ֣ץ פִּסְלָ֔/ם וּ/מִתְפַּלְלִ֔ים אֶל אֵ֖ל לֹ֥א יוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
translation:
  language: fr
  text: Rassemblez-vous et venez ; approchez-vous tous ensemble, rescapés des nations ! Ils ne savent rien, ceux qui portent le bois de leur statue sculptée[a] et qui prient un dieu incapable de sauver[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le bois de leur statue sculptée » ; c’est-à-dire une idole en bois.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un dieu qui ne sauve pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ וָבֹאוּ
  choice: Rassemblez-vous et venez
  rationale: Les deux impératifs lancent un appel direct. « Rassemblez-vous » rend la valeur réfléchie du nifal, tandis que « venez » exprime simplement le mouvement demandé.
- source_word: הִתְנַגְּשׁוּ יַחְדָּו
  choice: approchez-vous tous ensemble
  rationale: Le hitpael de נגש appelle les destinataires à s’avancer ou à s’approcher ; « tous ensemble » explicite naturellement la portée collective de יַחְדָּו.
- source_word: פְּלִיטֵי הַגּוֹיִם
  choice: rescapés des nations
  rationale: פְּלִיטֵי désigne ceux qui ont échappé à un danger ou à un désastre. « Rescapés » est actuel, précis et conserve la force du terme hébreu.
- source_word: לֹא יָדְעוּ
  choice: Ils ne savent rien
  rationale: Cette tournure française naturelle conserve le jugement catégorique porté sur l’ignorance des adorateurs d’idoles.
- source_word: הַנֹּשְׂאִים אֶת עֵץ פִּסְלָם
  choice: ceux qui portent le bois de leur statue sculptée
  rationale: 'La formulation garde explicitement « le bois » et « leur statue sculptée », préservant ainsi la force polémique de l’image : l’objet porté comme un dieu n’est que du bois façonné.'
- source_word: וּמִתְפַּלְלִים אֶל אֵל
  choice: et qui prient un dieu
  rationale: Le participe est rendu parallèlement par une relative. « Un dieu » conserve la désignation polémique de ce que les nations tiennent pour une divinité.
- source_word: לֹא יוֹשִׁיעַ
  choice: incapable de sauver
  rationale: Cette formulation exprime l’impuissance salvatrice visée dans la polémique, tout en signalant en note la traduction plus formelle « qui ne sauve pas ».
theological_decisions:
- issue: Portée de אֵל לֹא יוֹשִׁיעַ dans la polémique contre les idoles
  choice: un dieu incapable de sauver
  alternative: un dieu qui ne sauve pas
  rationale: Le texte appelle ironiquement l’objet de prière « un dieu » tout en niant son pouvoir de salut. La traduction retenue met en relief cette impuissance sans reconnaître à l’idole le statut d’un vrai dieu ; la note préserve la modalité plus strictement formelle.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs conservent le ton solennel de la convocation prophétique. « Rescapés » reste accessible sans affaiblir l’idée de personnes ayant échappé au désastre. Le parallélisme « ceux qui portent… et qui prient… » reproduit clairement la caractérisation hébraïque.
