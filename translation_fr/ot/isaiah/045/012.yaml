id: ISA.45.12
reference: Isaiah 45:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָֽנֹכִי֙ עָשִׂ֣יתִי אֶ֔רֶץ וְ/אָדָ֖ם עָלֶ֣י/הָ בָרָ֑אתִי אֲנִ֗י יָדַ/י֙ נָט֣וּ שָׁמַ֔יִם וְ/כָל צְבָאָ֖/ם צִוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/012.yaml
  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
translation:
  language: fr
  text: C’est moi qui ai fait la terre et qui ai créé l’être humain[a] sur elle. Ce sont mes mains qui ont déployé les cieux, et j’ai donné des ordres à toute leur armée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’humanité ». Le mot hébreu ʾadam est ici un singulier collectif qui désigne le genre humain.
    reason: Préciser la portée collective du terme sans l’alourdir dans le texte principal.
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: C’est moi qui
  rationale: Le pronom indépendant est emphatique. La tournure clivée restitue naturellement cette insistance en français moderne.
- source_word: עָשִׂיתִי
  choice: ai fait
  rationale: Dans ce contexte de création, « faire » est naturel et maintient la distinction avec ברא, rendu par « créer ».
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le parallélisme avec « les cieux » indique le sens cosmique plutôt que celui de « pays ».
- source_word: וְאָדָם
  choice: l’être humain[a]
  rationale: אָדָם désigne ici collectivement le genre humain. « L’être humain » conserve le singulier représentatif tout en exprimant clairement la portée générique en français contemporain.
- source_word: עָלֶיהָ
  choice: sur elle
  rationale: Le suffixe féminin renvoie explicitement à « la terre »; cette formulation conserve ce lien grammatical et spatial.
- source_word: בָרָאתִי
  choice: ai créé
  rationale: ברא est le verbe caractéristique de l’action créatrice divine; « créer » le distingue de עשה, « faire ».
- source_word: אֲנִי יָדַי
  choice: Ce sont mes mains qui
  rationale: La construction hébraïque met de nouveau l’agent divin en relief devant « mes mains ». La tournure clivée française préserve l’emphase sans ajouter l’idée non explicite de « propres ».
- source_word: נָטוּ
  choice: ont déployé
  rationale: « Déployer » rend l’image d’étendre les cieux dans un registre poétique, actuel et digne.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel traditionnel et cosmique convient au parallélisme avec « la terre ».
- source_word: וְכָל צְבָאָם
  choice: toute leur armée
  rationale: La formule désigne l’ensemble ordonné associé aux cieux. « Armée » conserve l’image hébraïque et son amplitude sans préciser s’il s’agit des astres ou d’êtres célestes.
- source_word: צִוֵּיתִי
  choice: j’ai donné mes ordres à
  rationale: Cette expression rend le sens de « commander, donner des ordres » et évite l’ambiguïté française de « commander une armée », qui pourrait signifier simplement la diriger.
theological_decisions:
- issue: Portée collective de אָדָם
  choice: l’être humain
  alternative: l’humanité; l’homme
  rationale: Le nom hébreu est un singulier collectif qui renvoie ici à l’ensemble de l’humanité. « L’être humain » conserve la forme singulière sans donner à tort au passage une portée exclusivement masculine; une note signale l’autre rendu collectif possible.
- issue: Identité de « toute leur armée »
  choice: laisser l’expression générale
  alternative: les astres; les êtres célestes
  rationale: Le contexte évoque l’ensemble céleste, mais le texte ne précise pas ici ses composantes. La traduction conserve donc l’ambiguïté au lieu de trancher entre astres et êtres célestes.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les deux tournures clivées rendent l’insistance des pronoms hébreux indépendants. Le vocabulaire cosmique et poétique reste accessible, et l’ambiguïté de l’« armée » des cieux est volontairement conservée.
