  text: אָנֹכִי֙ הַעִירֹתִ֣/הֽוּ בְ/צֶ֔דֶק וְ/כָל דְּרָכָ֖י/ו אֲיַשֵּׁ֑ר הֽוּא יִבְנֶ֤ה עִירִ/י֙ וְ/גָלוּתִ֣/י יְשַׁלֵּ֔חַ לֹ֤א בִ/מְחִיר֙ וְ/לֹ֣א בְ/שֹׁ֔חַד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
translation:
  language: fr
  text: C’est moi qui l’ai suscité dans la justice[a], et j’aplanirai toutes ses voies. C’est lui qui rebâtira[b] ma ville et renverra mes exilés, sans prix ni pot-de-vin, dit Yahvé des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je l’ai éveillé dans la justice ». Autre compréhension possible : « Je l’ai suscité pour accomplir la justice ».'
    reason: La nuance causative de עור et la portée de בְּצֶדֶק admettent plusieurs rendus sans que la relation exacte soit explicitée de façon univoque.
  - marker: b
    text: 'Ou : « bâtira ma ville ». Le verbe hébreu signifie simplement « bâtir » ; « rebâtira » reflète le contexte de restauration de Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  choice: je l’ai suscité
  rationale: Le hifil de עור signifie éveiller, mettre en mouvement ou susciter. « Suscité » exprime naturellement l’initiative divine sans préciser davantage la fonction du personnage.
- source_word: בְצֶדֶק
  choice: dans la justice
  rationale: La préposition et le nom sont rendus directement, en maintenant la portée morale et judiciaire de צדק ainsi que l’ambiguïté entre la manière juste d’agir et le dessein de justice.
- source_word: אֲיַשֵּׁר ... דְּרָכָיו
  choice: j’aplanirai toutes ses voies
  rationale: Le piel de ישר peut signifier rendre droit, uni ou praticable. « Aplanir les voies » conserve l’image routière tout en étant idiomatique en français.
- source_word: יִבְנֶה עִירִי
  choice: rebâtira ma ville
  rationale: בנה signifie littéralement « bâtir »; dans le contexte de la restauration d’une ville détruite, « rebâtir » transmet naturellement le sens contextuel. La valeur littérale est signalée en note.
- source_word: גָלוּתִי
  choice: mes exilés
  rationale: גלות peut désigner l’exil ou la communauté déportée. Avec le verbe שלח, le sens personnel « mes exilés » est le plus naturel.
- source_word: יְשַׁלֵּחַ
  choice: renverra
  rationale: Le piel de שלח peut signifier laisser partir, relâcher ou renvoyer. Ici « renverra » convient au retour des exilés sans expliciter une destination absente de la proposition.
- source_word: לֹא בִמְחִיר וְלֹא בְשֹׁחַד
  choice: sans prix ni pot-de-vin
  rationale: 'Cette formulation française concise conserve les deux images distinctes: aucun paiement et aucune corruption.'
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: « Yahvé » rend le nom divin יהוה. L’apposition idiomatique « le maître des armées » exprime la souveraineté impliquée par le titre צבאות sans employer l’archaïque « des armées » comme simple complément ambigu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; sa translittération française courante préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Identification du personnage comme Cyrus
  choice: conserver les pronoms « l’ » et « lui »
  alternative: nommer Cyrus dans le corps du verset
  rationale: Le contexte identifie le personnage, mais le verset hébreu n’emploie que des pronoms. Le nommer ici ajouterait une précision explicative au texte.
- issue: Sens de בְצֶדֶק
  choice: dans la justice
  alternative: pour accomplir la justice
  rationale: La construction hébraïque peut évoquer la sphère, la manière ou le dessein. Le rendu retenu préserve cette tension au lieu d’imposer une relation finale.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est moi » et « c’est lui » rendent l’insistance des pronoms hébreux. La note [b] doit être appelée dans le texte principal; elle est placée après « rebâtira ma ville » dans la version publiée.
