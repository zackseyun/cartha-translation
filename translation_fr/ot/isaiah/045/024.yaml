  text: אַ֧ךְ בַּ/יהוָ֛ה לִ֥/י אָמַ֖ר צְדָק֣וֹת וָ/עֹ֑ז עָדָי/ו֙ יָב֣וֹא וְ/יֵבֹ֔שׁוּ כֹּ֖ל הַ/נֶּחֱרִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
translation:
  language: fr
  text: '« On dira de moi : “C’est seulement en Yahweh que se trouvent la justice[a] et la force.” Vers lui on viendra[b], et tous ceux qui sont furieux contre lui seront couverts de honte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un pluriel, qui peut aussi désigner des « actes de justice », des « délivrances » ou des « justifications ».
    reason: lexical_alternative
  - marker: b
    text: 'La formule hébraïque au début du verset est très condensée. On peut aussi comprendre : « On dira : “C’est seulement en Yahweh que se trouvent la justice et la force.” » Le verbe « viendra » est au singulier en hébreu et peut avoir un sens indéfini ou distributif : « chacun viendra » ou « ils viendront ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: C’est seulement
  rationale: Le terme marque ici l’exclusivité avec une nuance d’insistance; cette tournure est naturelle en français et rattache clairement la justice et la force à Yahweh seul.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב indique ici la sphère ou la source dans laquelle résident la justice et la force; le nom divin יהוה est translittéré « Yahweh ».
- source_word: לִי אָמַר
  choice: dira-t-on de moi
  rationale: La formule hébraïque est très condensée et son sujet n’est pas explicite. Cette traduction conserve la valeur déclarative et le pronom de première personne sans identifier davantage le locuteur.
- source_word: צְדָקוֹת
  choice: la justice
  rationale: Bien que le nom soit au pluriel en hébreu, il peut exprimer globalement la justice, les actes justes ou les interventions qui établissent le droit. Le singulier abstrait est idiomatique en français, tandis que le pluriel est signalé en note.
- source_word: וָעֹז
  choice: et la force
  rationale: עֹז désigne la force ou la puissance; « force » forme ici un binôme naturel avec « justice ».
- source_word: עָדָיו יָבֹא
  choice: Vers lui on viendra
  rationale: Le verbe est morphologiquement au singulier, mais son sujet reste indéfini. Le pronom français « on » respecte ce caractère indéterminé sans imposer prématurément un sujet pluriel.
- source_word: וְיֵבֹשׁוּ
  choice: seront couverts de honte
  rationale: Dans ce contexte de jugement, בוש évoque la honte publique et la confusion résultant de l’échec, plus fortement que le simple sentiment d’avoir honte.
- source_word: הַנֶּחֱרִים בּוֹ
  choice: ceux qui étaient furieux contre lui
  rationale: Le participe de חרה décrit une colère ardente, et בּוֹ désigne ici la personne contre laquelle cette colère est dirigée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom d’alliance sans le remplacer par un titre.
- issue: Portée de צְדָקוֹת
  choice: la justice
  alternative: les actes de justice / les délivrances
  rationale: Le mot peut englober la qualité d’être juste, les actions justes et les interventions qui donnent raison ou délivrent. « La justice » conserve cette largeur sémantique, et la note maintient visible le pluriel hébreu.
- issue: Formule ambiguë לִי אָמַר
  choice: dira-t-on de moi
  alternative: 'on dira : « C’est seulement en Yahweh que résident la justice et la force » / il m’a dit'
  rationale: La syntaxe permet plusieurs rattachements et n’explicite pas nettement le sujet de אָמַר. Le texte principal conserve la première personne et la formule rapportée; la note présente une autre ponctuation plausible sans trancher l’identité du locuteur.
- issue: Sujet de עָדָיו יָבֹא
  choice: on viendra vers lui
  alternative: il viendra vers lui / ils viendront vers lui
  rationale: Le verbe hébreu est singulier, mais peut avoir une valeur indéfinie ou distributive. Le français « on » préserve cette indétermination et s’accorde avec le passage immédiat au pluriel dans la proposition suivante.
translation_notes:
  register: Français international actuel, digne et accessible. Les incises signalent la syntaxe comprimée sans la lisser excessivement. « Résident » exprime naturellement l’idée que la justice et la force se trouvent en Yahweh, tandis que « couverts de honte » garde la force publique et judiciaire du verbe final.
