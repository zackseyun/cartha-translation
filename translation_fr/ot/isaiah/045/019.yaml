  - severity: low
    issue: 'Formulation de l’alternative en note : « je parle avec justice »'
    rationale: Cette tournure peut décrire la manière de parler plutôt que le contenu de la proclamation. « Je parle de justice » rend plus directement le groupe דֹּבֵר צֶדֶק, tout en restant une alternative interprétative.
