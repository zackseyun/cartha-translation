source:
  edition: WLC
  text: לֹ֧א בַ/סֵּ֣תֶר דִּבַּ֗רְתִּי בִּ/מְקוֹם֙ אֶ֣רֶץ חֹ֔שֶׁךְ לֹ֥א אָמַ֛רְתִּי לְ/זֶ֥רַע יַעֲקֹ֖ב תֹּ֣הוּ בַקְּשׁ֑וּ/נִי אֲנִ֤י יְהוָה֙ דֹּבֵ֣ר צֶ֔דֶק מַגִּ֖יד מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
translation:
  language: fr
  text: 'Je n’ai pas parlé en secret, dans un lieu obscur de la terre. Je n’ai pas dit à la descendance de Jacob : « Cherchez-moi en vain. » Moi, Yahvé, je dis ce qui est juste[a], je proclame ce qui est droit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je parle de justice ». Le mot hébreu peut désigner la justice, la rectitude ou ce qui est juste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: en secret
  rationale: Expression française naturelle qui conserve l’idée de dissimulation et le contraste avec la révélation publique de Yahvé.
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  choice: dans quelque lieu d’un pays de ténèbres
  rationale: Conserve davantage que la simplification « dans un pays de ténèbres » la mention hébraïque de מְקוֹם (« lieu »), tout en restant intelligible en français.
- source_word: לְזֶרַע יַעֲקֹב
  choice: à la descendance de Jacob
  rationale: Rend naturellement le collectif זֶרַע sans recourir au calque « semence ».
- source_word: תֹּהוּ
  choice: en vain
  rationale: 'Dans cet ordre de chercher Yahvé, le mot évoque l’inanité ou la vacuité : cette recherche n’est pas vouée à l’échec.'
- source_word: בַקְּשׁוּנִי
  choice: Cherchez-moi
  rationale: Rend directement l’impératif pluriel assorti du suffixe de première personne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin plutôt que de lui substituer un titre.
- source_word: דֹּבֵר צֶדֶק
  choice: je dis ce qui est juste
  rationale: Formulation française idiomatique qui maintient la portée morale de צֶדֶק sans l’enfermer dans le seul sens judiciaire.
- source_word: מַגִּיד מֵישָׁרִים
  choice: je proclame ce qui est droit
  rationale: Préserve l’image éthique de rectitude portée par מֵישָׁרִים dans une tournure française naturelle.
theological_decisions:
- issue: Portée de la description finale de la parole divine
  choice: je dis ce qui est juste, je proclame ce qui est droit
  alternative: je parle avec justice, j’annonce la droiture
  rationale: Le choix conserve la rectitude morale et la fiabilité de la parole de Yahvé, sans réduire צֶדֶק à la seule justice judiciaire ni à la seule vérité propositionnelle.
- issue: Sens de תֹּהוּ dans l’ordre de chercher Yahvé
  choice: Cherchez-moi en vain
  alternative: Cherchez-moi dans le néant / pour rien
  rationale: Le contexte oppose la révélation fiable de Yahvé à une quête futile. « En vain » garde cette tension sans importer ici le sens cosmologique de chaos.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, avec un passé pour les déclarations négatives et un présent caractérisant l’action constante de Yahvé.
