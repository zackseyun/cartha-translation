  to: 'Ainsi parle Yahvé :


    « Le fruit du travail de l’Égypte, les marchandises de Koush

    et les Sabéens, hommes de haute taille,

    viendront à toi et seront à toi.

    Ils marcheront derrière toi,

    ils passeront enchaînés.

    Ils se prosterneront devant toi

    et t’adresseront leur prière[a] :


    “Oui, Dieu est en toi, et il n’y en a pas d’autre ;

    il n’existe aucun autre dieu.” »'
  rationale: La révision rétablit la valeur de « en toi » pour בָּךְ et remplace une formulation française ambiguë concernant les chaînes par « enchaînés ». « Viendront à toi » rend naturellement le mouvement vers l’interlocutrice sans faire de « passer » un calque inutilement opaque. L’ambiguïté concernant la prière adressée à l’interlocutrice est préservée dans le texte et explicitée par la note.
