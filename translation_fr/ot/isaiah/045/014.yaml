source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
translation:
  language: fr
  text: 'Ainsi parle Yahvé :


    « Le fruit du travail de l’Égypte, les marchandises de Koush

    et les Sabéens, hommes de haute taille,

    viendront à toi et seront à toi.

    Ils marcheront derrière toi,

    ils passeront enchaînés.

    Ils se prosterneront devant toi

    et t’adresseront leur prière[a] :


    “Oui, Dieu est en toi, et il n’y en a pas d’autre ;

    il n’existe aucun autre dieu.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te supplieront ». Le verbe hébreu peut désigner la prière ou une supplication pressante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française traditionnelle et immédiatement reconnaissable du nom divin, plutôt que le titre « le Seigneur ».
- source_word: יְגִיעַ מִצְרַיִם
  choice: le fruit du travail de l’Égypte
  rationale: יְגִיעַ désigne littéralement le labeur ou ce qu’il produit. Cette formulation conserve cette image tout en exprimant les ressources acquises par le travail.
- source_word: סְחַר כּוּשׁ
  choice: les marchandises de Koush
  rationale: סְחַר peut désigner les biens issus du commerce. « Koush » conserve le nom géographique ancien sans l’identifier de manière anachronique à un pays moderne.
- source_word: סְבָאִים
  choice: les Sabéens
  rationale: Ethnonyme français conventionnel pour le peuple de Seba.
- source_word: אַנְשֵׁי מִדָּה
  choice: hommes de haute taille
  rationale: L’expression évoque des hommes remarquables par leurs dimensions physiques ; « de haute taille » est naturel en français et évite le sens social possible de « grande stature ».
- source_word: עָלַיִךְ יַעֲבֹרוּ
  choice: passeront chez toi
  rationale: Le suffixe féminin singulier renvoie probablement à Sion ou à la communauté personnifiée. « Chez toi » rend le mouvement vers sa sphère sans imposer une interprétation trop précise.
- source_word: וְלָךְ יִהְיוּ
  choice: seront à toi
  rationale: Rend directement l’idée de possession ou de sujétion, tout en conservant la sobriété de l’hébreu.
- source_word: בַּזִּקִּים
  choice: chargés de chaînes
  rationale: Le terme désigne des entraves ou des chaînes. La formulation française rend clairement l’image de captifs enchaînés.
- source_word: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ
  choice: ils se prosterneront devant toi
  rationale: Le verbe décrit une prosternation qui peut exprimer l’hommage ou l’adoration. Ici, l’objet étant féminin singulier, « se prosterner devant » préserve le geste sans conclure à un culte divin rendu à Sion.
- source_word: אֵלַיִךְ יִתְפַּלָּלוּ
  choice: t’adresseront leur prière
  rationale: Le verbe signifie couramment « prier », mais peut ici exprimer une supplication. La traduction maintient la direction explicite vers l’interlocutrice et signale l’autre nuance en note.
- source_word: אֶפֶס אֱלֹהִים
  choice: il n’existe aucun autre dieu
  rationale: La minuscule rend אֱלֹהִים comme nom commun dans l’affirmation qu’aucune autre divinité n’existe.
theological_decisions:
- issue: La prosternation est-elle une adoration de Sion ou un hommage rendu devant elle ?
  choice: « ils se prosterneront devant toi »
  alternative: « ils t’adoreront »
  rationale: L’hébreu permet une prosternation cultuelle ou non cultuelle. La traduction conserve le geste et laisse la confession suivante préciser que Dieu est présent chez l’interlocutrice, sans attribuer explicitement la divinité à celle-ci.
- issue: La prière est-elle adressée à Sion elle-même ou s’agit-il d’une supplication faite auprès d’elle à cause de la présence de Dieu ?
  choice: « t’adresseront leur prière » avec une note
  alternative: « te supplieront »
  rationale: Le complément hébreu est bien à la deuxième personne du féminin singulier. Le texte principal en respecte la forme surprenante, tandis que la note préserve la nuance possible de supplication sans résoudre la tension.
- issue: Sens de l’affirmation אַךְ בָּךְ אֵל
  choice: « Oui, Dieu est chez toi »
  alternative: « C’est seulement chez toi qu’est Dieu »
  rationale: אַךְ peut renforcer l’assertion ou marquer l’exclusivité. La formulation choisie demeure naturelle et laisse la négation qui suit porter explicitement l’unicité divine.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le féminin singulier de « toi » n’est pas explicité par un ajout tel que « Sion », afin de ne pas fournir dans ce verset seul un référent absent du texte hébreu. Le parallélisme poétique est présenté en lignes brèves.
