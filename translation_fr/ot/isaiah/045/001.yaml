- from: 'Ainsi parle Yahvé à celui qu’il a oint[a], à Cyrus, dont j’ai saisi la main droite pour soumettre devant lui des nations et défaire la ceinture des rois[b], pour ouvrir devant lui les portes à deux battants[c], afin que les portails ne soient pas fermés :'
  to: 'Ainsi parle Yahvé à son oint[a], à Cyrus, dont j’ai saisi la main droite, pour lui soumettre des nations et défaire la ceinture des rois[b], pour ouvrir devant lui les portes[c], et les portails ne seront pas fermés :'
  rationale: La révision rétablit « son oint », qui correspond directement au substantif hébreu tout en restant naturel en français. Elle conserve la nuance possible du duel dans la note plutôt que de la présenter comme certaine dans le corps du texte. Elle rend enfin la dernière proposition comme une coordination déclarative au futur passif, conformément à l’hébreu.
