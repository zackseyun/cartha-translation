language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּה אָמַ֣ר יְהוָה֮ לִ/מְשִׁיח/וֹ֮ לְ/כ֣וֹרֶשׁ אֲשֶׁר הֶחֱזַ֣קְתִּי בִֽ/ימִינ֗/וֹ לְ/רַד לְ/פָנָי/ו֙ גּוֹיִ֔ם וּ/מָתְנֵ֥י מְלָכִ֖ים אֲפַתֵּ֑חַ לִ/פְתֹּ֤חַ לְ/פָנָי/ו֙ דְּלָתַ֔יִם וּ/שְׁעָרִ֖ים לֹ֥א יִסָּגֵֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
translation:
  language: fr
  text: 'Ainsi parle Yahvé à son oint[a], à Cyrus, dont j’ai saisi la main droite, pour lui soumettre des nations et défaire la ceinture des rois[b], pour ouvrir devant lui les portes[c], et les portails ne seront pas fermés :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « son oint ». Elle appartient à la même famille de mots que « Messie » ; ici, elle désigne Cyrus comme l’homme choisi et investi par Yahvé pour cette mission.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « ouvrir les reins des rois » : image qui peut évoquer le fait de leur défaire la ceinture, et donc de les affaiblir ou de les désarmer.'
    reason: idiom_explanation
  - marker: c
    text: Le mot hébreu est au duel et peut évoquer une double porte, ou une porte formée de deux battants.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française concise conserve le caractère solennel et prophétique de la déclaration hébraïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui le rend comme un nom propre plutôt que comme un titre.
- source_word: לִמְשִׁיחוֹ
  choice: à celui qu’il a oint
  rationale: Rend explicitement l’acte d’onction exprimé par מָשִׁיחַ, tout en évitant de faire de « Messie » un titre spécialisé appliqué sans explication à Cyrus.
- source_word: לְכוֹרֶשׁ
  choice: à Cyrus
  rationale: Cyrus est la forme française établie du nom du souverain perse.
- source_word: הֶחֱזַקְתִּי בִימִינוֹ
  choice: dont j’ai saisi la main droite
  rationale: Préserve l’image concrète de Yahvé saisissant la main droite de Cyrus pour le soutenir et lui donner autorité.
- source_word: לְרַד לְפָנָיו גּוֹיִם
  choice: pour soumettre devant lui des nations
  rationale: « Soumettre » exprime ici la domination militaire et politique, tandis que « devant lui » conserve la formulation spatiale du texte.
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  choice: et défaire la ceinture des rois
  rationale: L’expression hébraïque évoque littéralement l’ouverture ou le relâchement à la hauteur des reins. La ceinture rend l’image intelligible en français et suggère le désarmement ou l’affaiblissement sans le substituer à l’image.
- source_word: דְּלָתַיִם
  choice: les portes à deux battants
  rationale: Le duel hébreu désigne vraisemblablement une paire de battants. Cette formulation française restitue naturellement cette nuance.
- source_word: וּשְׁעָרִים לֹא יִסָּגֵרוּ
  choice: afin que les portails ne soient pas fermés
  rationale: « Portails » distingue שְׁעָרִים des portes à battants mentionnées juste avant et convient aux accès monumentaux ou fortifiés d’une ville.
theological_decisions:
- issue: Désignation de Cyrus par מְשִׁיחוֹ
  choice: celui qu’il a oint
  alternative: son Messie / son oint
  rationale: Le terme désigne réellement une personne consacrée par l’onction et appartient à la famille lexicale de « Messie ». Ici, il s’applique à Cyrus dans le cadre de la mission historique que Yahvé lui confie. La traduction retenue maintient cette tension sans lui imposer le sens christologique spécialisé acquis dans d’autres contextes.
- issue: Rôle de Yahvé dans les conquêtes de Cyrus
  choice: Yahvé saisit sa main pour soumettre les nations et défaire la ceinture des rois
  alternative: Cyrus agit de manière autonome avec une simple approbation divine
  rationale: La syntaxe attribue l’initiative et l’habilitation à Yahvé tout en présentant Cyrus comme l’agent historique. La traduction conserve ces deux dimensions.
translation_notes:
  register: Français international actuel, solennel sans archaïsmes. Le rythme de l’oracle est conservé, ainsi que les images concrètes de la main droite, de la ceinture et des portes. Les deux termes hébreux successifs désignant des accès sont différenciés par « portes à deux battants » et « portails ».
