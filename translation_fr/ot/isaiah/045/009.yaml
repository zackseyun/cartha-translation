source:
  edition: WLC
  text: ה֗וֹי רָ֚ב אֶת יֹ֣צְר֔/וֹ חֶ֖רֶשׂ אֶת חַרְשֵׂ֣י אֲדָמָ֑ה הֲ/יֹאמַ֨ר חֹ֤מֶר לְ/יֹֽצְר/וֹ֙ מַֽה תַּעֲשֶׂ֔ה וּ/פָעָלְ/ךָ֖ אֵין יָדַ֥יִם לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
translation:
  language: fr
  text: 'Malheur à celui qui conteste celui qui l’a façonné — tesson parmi les tessons de terre ! L’argile dira-t-elle à celui qui la façonne : « Que fais-tu ? » Ou ton ouvrage dira-t-il : « Il n’a pas de mains[a] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, peut-être : « Il n’a pas d’anses », si l’ouvrage critique sa propre forme plutôt que l’habileté de celui qui l’a façonné.'
    reason: Alternative lexicale et syntaxique possible pour יָדַיִם et le référent de לוֹ.
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force prophétique de dénonciation et d’avertissement.
- source_word: רָב אֶת יֹצְרוֹ
  choice: celui qui conteste avec celui qui l’a façonné
  rationale: רָב exprime ici la contestation ou la querelle, tandis que יֹצֵר désigne celui qui forme. Cette formulation garde le lien avec l’image du potier sans identifier plus explicitement le référent que l’hébreu.
- source_word: חֶרֶשׂ אֶת חַרְשֵׂי אֲדָמָה
  choice: simple tesson parmi les tessons de terre
  rationale: Le tour hébreu est elliptique. « Parmi » en rend naturellement le sens comparatif, et « simple » souligne sans lourdeur l’abaissement rhétorique du contestataire.
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ
  choice: L’argile dira-t-elle à celui qui la façonne
  rationale: « Argile » convient à l’image du potier, et « façonne » reprend le verbe יצר tout en restant idiomatique en français.
- source_word: מַה תַּעֲשֶׂה
  choice: Que fais-tu ?
  rationale: עשה peut signifier « faire » ou « fabriquer ». « Que fais-tu ? » préserve mieux l’étendue sémantique et le ton de défi, tout en restant compatible avec l’acte de façonnage.
- source_word: וּפָעָלְךָ
  choice: Et ton ouvrage dira-t-il
  rationale: פֹּעַל désigne ici le produit façonné. Le verbe « dira-t-il » est explicité à partir du parallélisme hébreu afin d’obtenir une phrase française claire.
- source_word: אֵין יָדַיִם לוֹ
  choice: Il n’a pas de mains
  rationale: La formulation littérale vise probablement l’incapacité ou l’incompétence prêtée avec insolence à l’artisan. L’autre lecture possible, « il n’a pas d’anses », est signalée en note.
theological_decisions:
- issue: La critique anthropomorphique dans la dernière proposition
  choice: 'L’ouvrage dit du façonneur : « Il n’a pas de mains. »'
  alternative: 'L’ouvrage se décrit lui-même : « Il n’a pas d’anses. »'
  rationale: Le contexte reproche à la créature de contester celui qui l’a formée ; la critique des mains du façonneur s’accorde donc bien avec le mouvement rhétorique. La construction hébraïque permet toutefois une autre compréhension, qui est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire concret de l’argile, du façonnage et des tessons est maintenu. La structure interrogative et la tension entre le Créateur et la créature sont préservées sans ajout doctrinal.
