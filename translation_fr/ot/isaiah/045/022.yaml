  text: פְּנוּ אֵלַ֥/י וְ/הִוָּשְׁע֖וּ כָּל אַפְסֵי אָ֑רֶץ כִּ֥י אֲנִי אֵ֖ל וְ/אֵ֥ין עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
translation:
  language: fr
  text: Tournez-vous vers moi et soyez sauvés[a], vous tous, aux extrémités de la terre, car je suis Dieu, et il n’y en a pas d’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Regardez vers moi et soyez sauvés ». Le verbe hébreu peut exprimer le fait de se tourner vers quelqu’un et, dans ce contexte, peut inclure l’idée de diriger son regard vers Dieu.
    reason: Alternative lexicale
lexical_decisions:
- source_word: פְּנוּ
  choice: Tournez-vous
  rationale: L’impératif de פנה exprime ici l’orientation vers Dieu. « Tournez-vous vers moi » est naturel en français et conserve l’appel directionnel sans le réduire au seul regard.
- source_word: אֵלַי
  choice: vers moi
  rationale: La préposition אֶל avec le suffixe de première personne indique une orientation vers le locuteur ; « vers moi » s’accorde idiomatiquement avec « tournez-vous ».
- source_word: וְהִוָּשְׁעוּ
  choice: et soyez sauvés
  rationale: L’impératif pluriel au nifal de ישׁע présente le salut comme une délivrance reçue. La coordination « et » respecte la forme hébraïque sans la transformer en proposition de but.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: vous tous qui habitez jusqu’aux extrémités de la terre
  rationale: L’expression désigne par métonymie les peuples des régions les plus éloignées. Cette formulation française rend explicites les destinataires humains de l’impératif tout en conservant l’image des « extrémités de la terre ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le fondement de l’appel et « car » en restitue clairement la valeur explicative dans un registre digne.
- source_word: אֲנִי אֵל
  choice: je suis Dieu
  rationale: אֵל est ici le titre ou nom commun « Dieu », non un nom propre à translittérer. Aucun ajout tel que « seul » n’est nécessaire, puisque la proposition suivante exprime l’exclusivité.
- source_word: וְאֵין עוֹד
  choice: et il n’y en a pas d’autre
  rationale: Cette tournure française actuelle exprime l’exclusivité absolue affirmée par l’idiome hébreu sans ajouter explicitement « à part moi ».
theological_decisions:
- issue: Portée de l’appel au salut
  choice: L’appel s’adresse à tous les habitants jusqu’aux extrémités de la terre.
  alternative: Traduire littéralement « toutes les extrémités de la terre ».
  rationale: Le masculin pluriel des impératifs vise des personnes ; l’expression géographique les désigne de manière métonymique. La traduction rend cette portée universelle intelligible sans la restreindre à un groupe particulier.
- issue: Exclusivité divine
  choice: « je suis Dieu, et il n’y en a pas d’autre »
  alternative: « je suis Dieu, et il n’y en a pas d’autre que moi »
  rationale: L’hébreu affirme sans réserve l’unicité de Dieu comme fondement de l’appel universel. La formulation retenue garde cette force tout en évitant d’ajouter un complément absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement pluriel est porté par l’impératif « tournez-vous » sans employer le pronom autonome « vous » devant le premier verbe. La formulation explicite les destinataires humains de l’expression géographique tout en préservant son image traditionnelle.
