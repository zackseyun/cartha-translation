  text: אָכֵ֕ן אַתָּ֖ה אֵ֣ל מִסְתַּתֵּ֑ר אֱלֹהֵ֥י יִשְׂרָאֵ֖ל מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/015.yaml
  text: Truly[a], you are a God who hides himself, the God of Israel, the Savior.
translation:
  language: fr
  text: Vraiment, tu es un Dieu qui se cache[a], le Dieu d’Israël, le Sauveur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un Dieu caché » ou « un Dieu qui est caché ». Le participe hébreu peut être compris soit dans un sens réfléchi (« qui se cache »), soit dans un sens plus statif (« qui est caché »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Oui
  rationale: L’adverbe introduit ici une affirmation solennelle, voire une prise de conscience. « Oui » restitue naturellement cette force confessionnelle en français moderne.
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom hébreu masculin singulier s’adresse directement à Dieu. Le tutoiement est naturel dans le registre biblique français contemporain.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, le nom désigne clairement le Dieu d’Israël ; « Dieu » rend le terme sans lui ajouter une nuance absente du texte.
- source_word: מִסְתַּתֵּר
  choice: qui se cache
  rationale: 'Le participe hitpael exprime le plus naturellement une action réflexive ou moyenne : Dieu se dérobe aux regards. Cette traduction conserve la valeur verbale, tout en signalant en note la lecture plus stative.'
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Le groupe nominal est en apposition et précise l’identité du Dieu auquel le locuteur s’adresse. L’article produit une formulation naturelle en français.
- source_word: מוֹשִׁיעַ
  choice: le Sauveur
  rationale: Le participe hiphil de ישׁע désigne celui qui sauve ou délivre. « Le Sauveur » en préserve la portée caractérisante et s’insère naturellement dans l’apposition.
theological_decisions:
- issue: Sens de la façon dont Dieu est caché
  choice: qui se cache
  alternative: qui est caché / un Dieu caché
  rationale: Le texte affirme la dissimulation ou le caractère caché de Dieu sans préciser s’il s’agit de son action providentielle, de son insondabilité ou d’un retrait temporaire. La traduction conserve cette tension, et la note maintient l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement maintient l’adresse directe à Dieu. L’apposition finale est rendue sans vocatif ajouté.
