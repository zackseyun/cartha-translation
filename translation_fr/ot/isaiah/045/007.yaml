  yaml_path: translation/ot/isaiah/045/007.yaml
  text: forming light and creating darkness[a], making peace and creating calamity; I am Yahweh, who does all these things.
translation:
  language: fr
  text: Je façonne la lumière et je crée les ténèbres ; je fais la paix et je crée le malheur[a] ; moi, Yahweh, je fais toutes ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le désastre » ou « le mal ». Le mot hébreu רָע peut désigner le mal, le dommage, le désastre ou le malheur. Ici, en opposition à « la paix », il évoque très probablement le malheur ou l’adversité plutôt que le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצֵר
  choice: façonne
  rationale: Le participe qal de יצר évoque l’action de façonner. « Façonne » le distingue de ברא, rendu par « crée », tout en conservant le parallélisme.
- source_word: אוֹר
  choice: la lumière
  rationale: Sens lexical direct, en opposition poétique explicite avec « les ténèbres ».
- source_word: וּבוֹרֵא
  choice: et crée
  rationale: Le participe qal de ברא désigne ici l’activité créatrice divine; la même traduction est conservée aux deux occurrences.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Équivalent français naturel et traditionnel, qui maintient l’antithèse avec la lumière.
- source_word: עֹשֶׂה
  choice: établit / fais
  rationale: Le verbe עשה est large. « Établit » s’emploie naturellement avec « la paix », tandis que « fais » convient à la formule récapitulative finale.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם peut aussi évoquer le bien-être ou la prospérité, mais « paix » préserve la formulation concise et son opposition contextuelle à רָע.
- source_word: רָע
  choice: le malheur
  rationale: Dans ce contraste avec שָׁלוֹם, רָע désigne vraisemblablement l’adversité ou le désastre plutôt que le mal moral. « Malheur » garde toutefois une certaine largeur sémantique et la tension de l’affirmation.
- source_word: אֲנִי יְהוָה
  choice: c’est moi, Yahweh
  rationale: Cette formulation rend l’emphase du pronom explicite אֲנִי et conserve le nom divin sous la forme « Yahweh ».
- source_word: עֹשֶׂה כָל־אֵלֶּה
  choice: qui fais toutes ces choses
  rationale: La proposition participiale finale récapitule l’ensemble des actions précédentes et souligne que Yahweh en est l’auteur.
theological_decisions:
- issue: Sens de רָע sous l’action créatrice de Yahweh
  choice: le malheur
  alternative: le désastre ; le mal
  rationale: רָע possède une gamme de sens comprenant le mal, le dommage, l’adversité et le désastre. Son opposition à שָׁלוֹם oriente ici vers une situation funeste plutôt que vers le mal moral. La note conserve les autres possibilités lexicales sans faire dire au texte que Dieu crée nécessairement le mal moral.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » représente le nom propre et suit la décision terminologique fournie.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle de l’hébreu est conservé par la succession « façonne / crée / établit / crée ». L’article défini est employé naturellement devant les noms abstraits. « C’est moi, Yahweh » restitue l’emphase de l’hébreu sans alourdir excessivement la phrase.
