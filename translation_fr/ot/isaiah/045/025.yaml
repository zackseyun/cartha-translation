    issue: Accord collectif au singulier malgré les verbes hébreux pluriels
    rationale: Le singulier français avec « toute la descendance » est défendable, mais le pluriel explicite des deux verbes hébreux est mieux préservé par « tous les descendants ... seront ... se glorifieront ».
  - severity: medium
    issue: Ancrage de la note b
    rationale: L’appel b est actuellement placé après « se glorifiera », alors que la note porte notamment sur « semence d’Israël ». Il doit suivre le groupe rendu par « descendants d’Israël ».
  - severity: low
    issue: Formulation de la note a
    rationale: « Obtiendra gain de cause » est plus idiomatique et moins directement parallèle à la formulation collective proposée ; « sera vindiqué » préserve mieux la nuance judiciaire possible de צדק.
