revisions:
- from: En Yahweh, toute la descendance d’Israël sera reconnue juste[a] et se glorifiera[b].
  to: C’est en Yahweh que tous les descendants d’Israël[b] seront reconnus justes[a] et se glorifieront.
  rationale: La révision rend les deux prédicats au pluriel, conformément à l’hébreu, tout en conservant le caractère collectif de זרע par « tous les descendants ». Elle maintient la portée non tranchée de ביהוה avec « C’est en Yahweh que », garde la nuance déclarative de צדק dans le texte et rétablit des appels de note correspondant précisément aux mots commentés.
