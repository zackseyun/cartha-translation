review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : ביהוה exprime le cadre ou le fondement en Yahweh, צדק permet « être reconnu juste / être justifié / être vindiqué », et הלל au hitpael évoque le fait de se glorifier. Toutefois, les verbes hébreux sont au pluriel et se rapportent à l’ensemble des descendants ; une formulation plurielle française les reflète plus directement.'
  naturalness: « Toute la descendance ... sera ... et se glorifiera » est grammaticalement possible comme collectif, mais « tous les descendants ... seront ... et se glorifieront » est plus immédiat et naturel en français international moderne. « C’est en Yahweh que » rend aussi plus fluidement la mise en relief initiale.
  terminology: « Yahweh », « reconnus justes » et « se glorifieront » sont appropriés et ne surinterprètent pas le texte. La note sur צדק doit conserver « justifiés » et « vindiqués » comme possibilités sans les présenter comme des équivalents exhaustifs. La note sur « semence » doit être ancrée sur « descendants », non sur le verbe final.
  issues:
