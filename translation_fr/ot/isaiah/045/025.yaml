  text: בַּ/יהוָ֛ה יִצְדְּק֥וּ וְ/יִֽתְהַלְל֖וּ כָּל זֶ֥רַע יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/025.yaml
  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
translation:
  language: fr
  text: C’est en Yahweh que tous les descendants d’Israël[b] seront reconnus justes[a] et se glorifieront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront justifiés » ou « seront vindiqués ». Le verbe hébreu peut désigner le fait d’être dans son droit, d’être reconnu juste ou d’être justifié.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « toute la semence d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: En Yahweh
  rationale: 'La préposition ב peut exprimer ici la sphère ou le fondement : c’est en relation avec Yahweh que la descendance d’Israël est reconnue juste et se glorifie. La formulation compacte préserve l’ambiguïté entre « en » et « par ».'
- source_word: יִצְדְּקוּ
  choice: sera reconnue juste
  rationale: Le qal de צדק peut signifier être juste, être déclaré ou reconnu juste, ou obtenir gain de cause. « Sera reconnue juste » rend la valeur déclarative sans imposer un système doctrinal plus étroit.
- source_word: וְיִתְהַלְלוּ
  choice: et se glorifiera
  rationale: Le hitpael de הלל exprime le fait de se glorifier ou de tirer fierté. « Se glorifiera » conserve la valeur réfléchie et convient au registre biblique contemporain.
- source_word: כָּל
  choice: toute
  rationale: כָּל porte sur le groupe collectif « descendance d’Israël » ; « toute » est naturel en français.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: la descendance d’Israël
  rationale: זֶרַע signifie littéralement « semence », mais désigne collectivement les descendants. « Descendance » est clair, digne et naturel en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Nuance de צדק dans ce contexte de salut
  choice: sera reconnue juste
  alternative: sera déclarée juste ; sera justifiée ; obtiendra gain de cause
  rationale: L’hébreu permet une nuance de juste statut aussi bien que de justification ou de réhabilitation. Le texte principal garde cette ouverture, et la note signale les principales possibilités.
- issue: Portée de ב dans ביהוה
  choice: En Yahweh
  alternative: Par Yahweh
  rationale: La préposition peut indiquer la sphère, le fondement ou le moyen. « En » conserve la concision et la tension du texte sans trancher entièrement.
translation_notes:
  register: Français international moderne, au registre digne et accessible. L’accord au singulier traite « toute la descendance » comme un collectif, tandis que l’hébreu emploie des verbes au pluriel. Les deux appels de note figurent dans le texte principal.
