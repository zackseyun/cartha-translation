  text: ה֛וֹי אֹמֵ֥ר לְ/אָ֖ב מַה תּוֹלִ֑יד וּ/לְ/אִשָּׁ֖ה מַה תְּחִילִֽי/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
translation:
  language: fr
  text: 'Malheur à qui dit à un père[a] : « Qu’engendres-tu ? » ou à une femme[b] : « Qu’es-tu en train de mettre au monde ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Qu’as-tu engendré ? » Le verbe hébreu désigne ici spécifiquement l’action du père qui engendre.
    reason: lexical_alternative
  - marker: b
    text: Ou « De quoi es-tu en travail ? » Le verbe hébreu évoque le travail et les douleurs de la femme qui accouche.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de dénonciation de l’interjection prophétique, contrairement à un « Hélas ! » plus plaintif.
- source_word: אֹמֵר
  choice: qui dit
  rationale: Le participe substantivé désigne de manière générale la personne qui parle; cette tournure est concise et naturelle en français.
- source_word: לְאָב
  choice: à un père
  rationale: Le texte ne porte aucun suffixe possessif. « Un père » est donc plus exact que « son père » et maintient la portée représentative de l’image.
- source_word: מַה תּוֹלִיד
  choice: Qu’engendres-tu ?
  rationale: Le hiphil de ילד, adressé à un homme, désigne ici l’action paternelle d’engendrer. Le verbe français conserve cette distinction sans ajouter de complément absent de l’hébreu.
- source_word: וּלְאִשָּׁה
  choice: ou à une femme
  rationale: Dans ce parallélisme, « ou » relie naturellement les deux paroles réprouvées. Aucun possessif ne justifie « sa mère ».
- source_word: מַה תְּחִילִין
  choice: Qu’es-tu en train de mettre au monde ?
  rationale: Le verbe évoque les douleurs et le travail de l’accouchement. Cette formulation actuelle exprime naturellement l’acte maternel tout en laissant la note signaler la nuance du travail pénible.
theological_decisions:
- issue: Portée de l’image du père et de la femme
  choice: Conserver littéralement l’image parentale sans expliciter Dieu comme référent dans ce verset.
  alternative: Paraphraser en précisant qu’il s’agit de contester son Créateur, ou remplacer « une femme » par « sa mère ».
  rationale: Le contexte applique l’image à celui qui conteste son Créateur, mais le verset lui-même formule une comparaison concrète. L’expliciter ici effacerait sa tension rhétorique et ajouterait au texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Engendrer » est légèrement soutenu mais reste clair et permet de préserver l’opposition précise entre l’action du père et celle de la femme. La seconde question adopte une tournure plus courante, tandis que la note conserve la nuance des douleurs du travail.
