id: ISA.45.18
reference: Isaiah 45:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh[a] : « Lui qui a créé les cieux — lui est Dieu —, qui a façonné la terre et l’a faite, lui qui l’a solidement établie, il ne l’a pas créée pour qu’elle soit déserte[b], mais il l’a façonnée pour qu’elle soit habitée. Je suis Yahweh, et il n’y en a pas d’autre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est le nom personnel de Dieu représenté en hébreu par les quatre consonnes YHWH.
    reason: clarification du nom divin
  - marker: b
    text: Ou « vide », « livrée au chaos » ou « informe ». Le mot hébreu tohu peut désigner le vide, la désolation ou un état informe ; ici, son opposition avec « habitée » favorise « déserte ».
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve son caractère personnel au lieu de lui substituer un titre.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: lui qui a créé les cieux
  rationale: La proposition relative rend naturellement la valeur verbale du participe, tandis que « les cieux » correspond à la forme hébraïque et au contexte cosmique.
- source_word: הוּא הָאֱלֹהִים
  choice: c’est lui qui est Dieu
  rationale: Cette formulation rend l’identification emphatique sans ajouter « seul », puisque l’exclusivité est explicitement affirmée à la fin du verset.
- source_word: יֹצֵר הָאָרֶץ וְעֹשָׂהּ
  choice: qui a façonné la terre et l’a faite
  rationale: « Façonner » conserve la nuance de mise en forme de יצר, tandis que « faire » rend simplement le sens large de עשה.
- source_word: כּוֹנְנָהּ
  choice: l’a solidement établie
  rationale: La tournure exprime l’idée de stabilité et d’affermissement portée par כון.
- source_word: לֹא תֹהוּ בְרָאָהּ
  choice: Il ne l’a pas créée pour qu’elle soit déserte
  rationale: Dans l’opposition avec une terre destinée à être habitée, תֹהוּ évoque ici surtout la désolation ou l’état inhabitable. La construction française explicite naturellement la valeur de finalité ou de résultat.
- source_word: לָשֶׁבֶת יְצָרָהּ
  choice: il l’a façonnée pour qu’elle soit habitée
  rationale: La formulation préserve la finalité exprimée par ל et reprend « façonnée » afin de maintenir le lien lexical avec יֹצֵר.
- source_word: וְאֵין עוֹד
  choice: et il n’y en a pas d’autre
  rationale: Cette expression française naturelle conserve l’affirmation absolue d’exclusivité sans préciser un référent que l’hébreu laisse implicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le nom personnel est conservé par translittération plutôt que remplacé par un titre.
- issue: Sens de תֹהוּ dans l’énoncé sur le but de la création
  choice: déserte
  alternative: vide ; informe ; vouée au chaos
  rationale: Le contraste explicite avec « habitée » favorise le champ de la désolation et de l’inhabitabilité, sans réduire le mot à un seul sens possible.
- issue: Force de הוּא הָאֱלֹהִים
  choice: c’est lui qui est Dieu
  alternative: il est le Dieu ; lui seul est Dieu
  rationale: Le rendu garde l’emphase identificatrice sans anticiper par « seul » l’affirmation d’exclusivité placée à la fin du verset.
- issue: Référent implicite dans וְאֵין עוֹד
  choice: il n’y en a pas d’autre
  alternative: il n’y a pas d’autre Dieu
  rationale: Le français conserve l’ellipse de l’hébreu ; le contexte rend le référent clair sans qu’il soit nécessaire d’ajouter « Dieu ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase ample et les incises reflètent la structure solennelle de l’hébreu, tandis que la ponctuation et les propositions relatives en assurent la lisibilité. Les deux marqueurs [a] et [b] figurent dans le texte principal.
