  terminology: « Yahweh », « les cieux », « façonné », « établie » et « habitée » conviennent au registre et aux termes hébreux. « Lui est Dieu » restitue plus directement l’apposition emphatique הוּא הָאֱלֹהִים que « c’est lui qui est Dieu », sans ajouter l’idée d’exclusivité avant la fin du verset.
