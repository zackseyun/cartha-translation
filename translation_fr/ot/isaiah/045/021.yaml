revisions:
- from: Proclamez-le et présentez votre cause[a] ! Qu’ils se consultent même tous ensemble ! Qui a fait entendre cela depuis longtemps ? Qui l’a proclamé autrefois ? N’est-ce pas moi, Yahweh[b] ? Il n’y a pas d’autre Dieu en dehors de moi, un Dieu juste[c] et un Sauveur ; il n’y en a aucun excepté moi.
  to: Faites-le savoir et présentez votre cause[a] ! Qu’ils se concertent ensemble ! Qui a fait entendre cela dès les temps anciens ? Qui l’a proclamé autrefois ? N’est-ce pas moi, Yahweh[b] ? Il n’y a pas d’autre Dieu que moi, Dieu juste[c] et Sauveur ; il n’y en a pas d’autre que moi.
  rationale: La révision améliore l'idiomaticité française et la clarté référentielle sans expliciter les sujets implicites ni modifier la portée judiciaire probable. « Dès les temps anciens » marque plus nettement l'antériorité de מִקֶּדֶם. L'apposition « Dieu juste et Sauveur » et la répétition finale maintiennent la forme et l'insistance de l'hébreu.
