  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
translation:
  language: fr
  text: Faites-le savoir et présentez votre cause[a] ! Qu’ils se concertent ensemble ! Qui a fait entendre cela dès les temps anciens ? Qui l’a proclamé autrefois ? N’est-ce pas moi, Yahweh[b] ? Il n’y a pas d’autre Dieu que moi, Dieu juste[c] et Sauveur ; il n’y en a pas d’autre que moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apportez-la » ou « présentez-la » ; dans ce contexte, l’hébreu peut évoquer la présentation d’une cause devant un tribunal.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « un Dieu droit » ; le terme hébreu peut exprimer la droiture aussi bien que la justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Proclamez-le
  rationale: L’impératif pluriel appelle une déclaration publique et formelle ; « proclamez » convient au contexte de défi judiciaire.
- source_word: וְהַגִּישׁוּ
  choice: présentez votre cause
  rationale: Dans ce contexte de controverse, le hiphil de נגשׁ évoque vraisemblablement la présentation d’une cause ou d’éléments à l’appui, plutôt qu’un simple mouvement physique.
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  choice: Qu’ils se consultent même tous ensemble
  rationale: Le tour conserve l’idée de délibération collective et la force additive de אַף, sans identifier explicitement les sujets laissés implicites en hébreu.
- source_word: מִי הִשְׁמִיעַ זֹאת מִקֶּדֶם
  choice: Qui a fait entendre cela depuis longtemps ?
  rationale: « Faire entendre » reflète la forme causative de שׁמע, tandis que « depuis longtemps » exprime naturellement l’antériorité de מִקֶּדֶם.
- source_word: מֵאָז הִגִּידָהּ
  choice: Qui l’a proclamé autrefois ?
  rationale: La seconde question parallèle reprend par ellipse l’interrogatif « qui » et rend l’annonce remontant aux temps passés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin distinctif plutôt que de le remplacer par un titre ; une note signale la convention traditionnelle.
- source_word: אֵל צַדִּיק
  choice: un Dieu juste
  rationale: « Juste » rend naturellement צַדִּיק appliqué à Dieu et conserve à la fois les dimensions morale et judiciaire du terme.
- source_word: וּמוֹשִׁיעַ
  choice: et un Sauveur
  rationale: Le participe désigne celui qui sauve ou délivre ; « Sauveur » est concis, idiomatique et fidèle.
- source_word: אַיִן זוּלָתִי
  choice: il n’y en a aucun excepté moi
  rationale: Cette formulation maintient la seconde affirmation exclusive tout en évitant une répétition française strictement identique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le préserve explicitement, tandis que la note indique le rendu traditionnel sans l’imposer dans le texte.
- issue: Sens de צַדִּיק appliqué à Dieu
  choice: juste
  alternative: droit ; conforme à la justice
  rationale: Le mot peut exprimer la droiture et la justice. « Juste » est le terme français courant qui garde cette amplitude sans résoudre la nuance en un sens uniquement judiciaire.
- issue: Relation entre « Dieu juste » et « Sauveur »
  choice: un Dieu juste et un Sauveur
  alternative: un Dieu qui est juste et qui sauve
  rationale: La coordination nominale de l’hébreu est conservée, maintenant ensemble justice et salut sans expliquer ni atténuer leur tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs gardent le ton solennel du défi, et les questions parallèles restent distinctes. La ponctuation souligne la vigueur rhétorique sans ajouter de destinataire absent du verset.
