id: ISA.45.17
reference: Isaiah 45:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשְׂרָאֵל֙ נוֹשַׁ֣ע בַּ/יהוָ֔ה תְּשׁוּעַ֖ת עוֹלָמִ֑ים לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ עַד ע֥וֹלְמֵי עַֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
translation:
  language: fr
  text: Israël est sauvé par Yahweh[a] d’un salut éternel ; vous ne serez ni couverts de honte ni humiliés[b], pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Yahweh » ; la préposition hébraïque peut exprimer aussi bien le moyen ou l’agent que la sphère dans laquelle le salut se réalise.
    reason: alternative_reading
  - marker: b
    text: Ou « vous n’aurez pas honte et ne serez pas déshonorés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹשַׁע
  choice: est sauvé
  rationale: Le niphal de ישׁע exprime ici la délivrance d’Israël. Le présent français conserve la formulation prophétique sans imposer un accomplissement exclusivement passé ou futur.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: 'Avec le passif « est sauvé », « par » exprime naturellement l’action efficace de Yahweh, tout en signalant en note que la préposition ב peut aussi indiquer la sphère : « en Yahweh ».'
- source_word: יהוה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa forme personnelle usuelle en français, plutôt que par un titre, afin de représenter directement le tétragramme du texte hébreu.
- source_word: תְּשׁוּעַת עוֹלָמִים
  choice: d’un salut éternel
  rationale: Cette expression construite signifie littéralement un « salut des âges ». « Un salut éternel » en restitue clairement et naturellement la durée illimitée.
- source_word: לֹא תֵבֹשׁוּ וְלֹא תִכָּלְמוּ
  choice: vous ne serez ni couverts de honte ni humiliés
  rationale: 'La traduction distingue les deux termes parallèles : בושׁ évoque la honte éprouvée ou publique, tandis que כלם accentue l’humiliation et le déshonneur.'
- source_word: עַד עוֹלְמֵי עַד
  choice: pour toujours et à jamais
  rationale: Cette locution hébraïque redoublée intensifie l’idée de perpétuité ; la formule française en conserve l’emphase poétique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le caractère de nom propre sans substituer au nom un titre traditionnel.
- issue: Valeur de la préposition ב dans בַּיהוָה
  choice: par Yahweh
  alternative: en Yahweh
  rationale: La construction avec le verbe passif favorise une lecture agentive, mais l’hébreu permet aussi une lecture de sphère. La note préserve cette ambiguïté théologiquement significative.
- issue: Portée temporelle du salut
  choice: est sauvé
  alternative: sera sauvé / a été sauvé
  rationale: Le participe hébreu ne fixe pas à lui seul le salut dans un moment unique. Le présent français exprime l’état ou la réalité proclamée, tandis que les verbes suivants portent explicitement la promesse.
translation_notes:
  register: Français international moderne, clair et solennel. Le parallélisme poétique est maintenu sans archaïsmes ; « pour toujours et à jamais » conserve l’intensification de la formule hébraïque.
