  text: הַרְעִ֤יפוּ שָׁמַ֨יִם֙ מִ/מַּ֔עַל וּ/שְׁחָקִ֖ים יִזְּלוּ צֶ֑דֶק תִּפְתַּח אֶ֣רֶץ וְ/יִפְרוּ יֶ֗שַׁע וּ/צְדָקָ֤ה תַצְמִ֨יחַ֙ יַ֔חַד אֲנִ֥י יְהוָ֖ה בְּרָאתִֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
translation:
  language: fr
  text: Cieux, distillez d’en haut[a] ; que les nuages fassent ruisseler la justice. Que la terre s’ouvre, que le salut porte du fruit et qu’elle fasse germer la justice en même temps. Moi, Yahweh, j’ai créé cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu évoque des gouttes qui tombent ou qui ruissellent. Les deux mots hébreux rendus par « justice » peuvent aussi être traduits par « droiture » : « que les nuages fassent ruisseler la droiture » et « qu’elle fasse germer la droiture en même temps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְעִיפוּ
  choice: laissez tomber vos gouttes
  rationale: L’impératif de רָעַף évoque ce qui tombe goutte à goutte. Cette formulation conserve l’image de la précipitation sans suggérer nécessairement un violent orage ; « vos gouttes » explicite en français l’objet sous-entendu.
- source_word: שָׁמַיִם ... מִמַּעַל
  choice: Cieux ... d’en haut
  rationale: « Cieux » maintient le pluriel et le registre cosmique du poème ; « d’en haut » rend directement la provenance verticale.
- source_word: שְׁחָקִים יִזְּלוּ
  choice: que les nuages fassent couler
  rationale: שְׁחָקִים désigne ici les nuages dans le parallélisme avec les cieux, et נזל exprime l’écoulement vers le bas.
- source_word: צֶדֶק / צְדָקָה
  choice: justice
  rationale: Dans ce tableau où le salut et l’ordre juste accordé par Dieu apparaissent ensemble, « justice » est naturel en français et couvre l’action conforme au droit ; la note conserve l’autre nuance majeure, « droiture ».
- source_word: תִּפְתַּח אֶרֶץ
  choice: Que la terre s’ouvre
  rationale: La tournure jussive française restitue l’appel poétique, et « terre » préserve la portée cosmique plutôt que territoriale.
- source_word: וְיִפְרוּ יֶשַׁע
  choice: que le salut y germe
  rationale: La formulation rend l’apparition féconde du salut dans l’image végétale. Le « y » relie naturellement cette germination à la terre qui s’ouvre, sans alourdir le vers.
- source_word: וּצְדָקָה תַצְמִיחַ יַחַד
  choice: et qu’elle fasse aussi germer la justice
  rationale: Le verbe féminin singulier permet de reprendre « la terre » comme sujet. « Aussi » exprime ici l’émergence conjointe indiquée par יַחַד, tandis que « faire germer » respecte le causatif et l’image végétale.
- source_word: אֲנִי יְהוָה
  choice: Moi, Yahweh
  rationale: La mise en relief rend l’apposition hébraïque, et le nom personnel divin est translittéré « Yahweh ».
- source_word: בְּרָאתִיו
  choice: j’ai créé tout cela
  rationale: Le suffixe masculin singulier renvoie vraisemblablement à l’ensemble du phénomène décrit. « Tout cela » garde cette référence globale de manière plus naturelle que le simple pronom français « le ».
theological_decisions:
- issue: Sens de צֶדֶק / צְדָקָה
  choice: justice
  alternative: droiture
  rationale: Les deux emplois appartiennent au champ de ce qui est juste et conforme à l’ordre voulu par Dieu. « Justice » convient au contexte de salut public et cosmique, mais « droiture » demeure possible et est signalé en note.
- issue: Référent du suffixe dans בְּרָאתִיו
  choice: l’ensemble de la réalité décrite (« tout cela »)
  alternative: le salut pris isolément
  rationale: Le suffixe masculin peut grammaticalement se rattacher à יֶשַׁע, « salut », mais la déclaration finale peut aussi embrasser la venue conjointe du salut et de la justice. La traduction ne réduit donc pas la création divine à un seul élément.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente le nom propre présent dans le texte hébreu sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs et les subjonctifs maintiennent l’invocation cosmique ; le vocabulaire de l’eau puis de la germination conserve le développement des images hébraïques.
