id: ISA.45.3
reference: Isaiah 45:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לְ/ךָ֙ אוֹצְר֣וֹת חֹ֔שֶׁךְ וּ/מַטְמֻנֵ֖י מִסְתָּרִ֑ים לְמַ֣עַן תֵּדַ֗ע כִּֽי אֲנִ֧י יְהוָ֛ה הַ/קּוֹרֵ֥א בְ/שִׁמְ/ךָ֖ אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
translation:
  language: fr
  text: Je te donnerai les trésors des ténèbres et les richesses cachées dans des lieux secrets[a], afin que tu saches que je suis Yahvé[b], celui qui t’appelle par ton nom, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «les trésors cachés dans l’obscurité et les trésors de lieux secrets».
    reason: L’hébreu juxtapose deux expressions poétiques dont les rapports précis — appartenance, emplacement ou dissimulation — peuvent être rendus de plusieurs façons.
  - marker: b
    text: Le nom hébreu YHWH est ici rendu par «Yahvé»; il est traditionnellement remplacé par «le SEIGNEUR» dans de nombreuses traductions.
    reason: Cette note signale la présence du nom divin dans le texte source et l’autre convention française courante.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je te donnerai
  rationale: Le parfait qal à la première personne, dans cette promesse prophétique adressée à Cyrus, a ici une valeur future. En français, le futur simple exprime naturellement cette promesse.
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  choice: les trésors des ténèbres
  rationale: 'Cette traduction conserve la construction imagée de l’hébreu et son ambiguïté: il peut s’agir de trésors appartenant aux ténèbres ou, plus concrètement, dissimulés dans l’obscurité.'
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  choice: les richesses cachées dans des lieux secrets
  rationale: מַטְמֻנִים désigne des biens ou trésors cachés, tandis que מִסְתָּרִים évoque des cachettes ou lieux secrets. La formulation française garde les deux dimensions sans lourdeur excessive.
- source_word: לְמַעַן תֵּדַע
  choice: afin que tu saches
  rationale: La locution לְמַעַן exprime clairement le but. «Afin que» convient au registre prophétique tout en restant courant et compréhensible.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante «Yahvé» translittère le nom divin YHWH au lieu de le remplacer par un titre.
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  choice: celui qui t’appelle par ton nom
  rationale: Le participe présente Dieu comme celui qui appelle Cyrus personnellement. «Par ton nom» rend explicitement בְשִׁמְךָ et reste idiomatique en français.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette formulation naturelle restitue directement la construction hébraïque et l’identification du Dieu qui parle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. «Yahvé», forme consacrée en français, le représente directement plutôt que de lui substituer un titre.
- issue: Nature des trésors promis
  choice: Des richesses concrètes cachées dans l’obscurité ou dans des lieux secrets, avec maintien de l’image poétique
  alternative: Des trésors spirituels métaphoriques
  rationale: Le contexte concernant Cyrus, les nations, les portes et leurs richesses favorise le sens matériel. La traduction ne spiritualise donc pas l’expression, tout en préservant son imagerie et sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe au singulier faite à Cyrus. Le parallélisme poétique et l’ambiguïté de «trésors des ténèbres» sont conservés, avec une note donnant une explicitation possible.
