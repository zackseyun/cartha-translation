source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé, le Saint d’Israël, celui qui l’a formé : « Interrogez-moi sur ce qui va venir concernant mes fils[a] ; quant à l’œuvre de mes mains, donnez-moi des ordres[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mes fils » ; l’expression peut désigner collectivement Israël, le peuple de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'La formulation est volontairement saisissante. On peut aussi la comprendre comme un reproche sous forme de question : « Et au sujet de l’œuvre de mes mains, allez-vous me donner des ordres ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui en préserve la valeur propre et l’importance d’alliance.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Rendu français consacré et naturel de ce titre prophétique.
- source_word: וְיֹצְרוֹ
  choice: celui qui l’a façonné
  rationale: Le suffixe hébreu est masculin singulier (« l’/le »), avec Israël comme référent probable. Cette formulation conserve le pronom au lieu de l’expliciter ou de l’effacer.
- source_word: הָאֹתִיּוֹת
  choice: ce qui va venir
  rationale: Dans ce contexte prophétique, le terme désigne vraisemblablement les événements à venir. La formulation reste naturelle sans réduire le sens à de simples « signes ».
- source_word: שְׁאָלוּנִי
  choice: Interrogez-moi
  rationale: L’impératif est pluriel et porte un suffixe de première personne. « Interrogez-moi » convient bien à une demande portant sur l’avenir.
- source_word: עַל בָּנַי
  choice: au sujet de mes fils
  rationale: Le texte porte explicitement le masculin pluriel « mes fils » ; celui-ci est conservé, même s’il peut désigner collectivement le peuple d’Israël.
- source_word: פֹּעַל יָדַי
  choice: l’œuvre de mes mains
  rationale: Conserve l’image concrète et le parallélisme de l’expression hébraïque.
- source_word: תְּצַוֻּנִי
  choice: donnez-moi des ordres
  rationale: Rend directement la force provocatrice du verbe « commander, donner des ordres », sans l’atténuer en « instruire » ou « confier ».
theological_decisions:
- issue: La possibilité pour des humains de commander à Dieu dans la dernière proposition
  choice: Conserver l’impératif provocateur « donnez-moi des ordres »
  alternative: 'Lire la proposition comme une question de reproche : « allez-vous me donner des ordres ? »'
  rationale: La syntaxe écrite permet plusieurs ponctuations et le contexte peut suggérer l’ironie ou le reproche. Le texte principal maintient néanmoins la formulation impérative saisissante, tandis qu’une note signale l’autre lecture sans trancher silencieusement.
- issue: La portée de בָּנַי
  choice: mes fils
  alternative: mes enfants
  rationale: Le substantif source est masculin pluriel. Le sens collectif possible, appliqué à Israël, est précisé en note plutôt que neutralisé dans le texte.
translation_notes:
  register: Français international actuel, digne et direct. Le pluriel des impératifs est conservé. Les guillemets structurent la parole divine, et le point d’exclamation fait entendre la vigueur de la dernière injonction sans supprimer l’ambiguïté rhétorique signalée en note.
