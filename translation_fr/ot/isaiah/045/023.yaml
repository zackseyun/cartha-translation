base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/023.yaml
  text: 'By myself I have sworn[a]; from my mouth has gone out a righteous word, and it will not return: to me every knee will bow[b], every tongue will swear allegiance.'
translation:
  language: fr
  text: 'J’ai juré par moi-même : de ma bouche est sortie une parole juste[a], et elle ne reviendra pas : c’est à moi que tout genou fléchira, toute langue prêtera serment[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « de ma bouche est sortie, avec justice, une parole ». La construction hébraïque peut souligner soit la justice de la parole, soit la manière juste dont elle est prononcée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute langue jurera fidélité ». Le verbe hébreu signifie prêter serment, sans préciser explicitement ici le contenu du serment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Je le jure par moi-même
  rationale: La formule hébraïque exprime un serment prêté par Dieu sur lui-même. Le présent français rend naturellement la force actuelle et irrévocable de l’accompli hébreu.
- source_word: יָצָא מִפִּי
  choice: de ma bouche est sortie
  rationale: Conserve l’image concrète d’une parole qui sort de la bouche de Dieu, dans un français naturel.
- source_word: צְדָקָה דָּבָר
  choice: une parole juste
  rationale: La construction hébraïque condensée permet de rattacher צְדָקָה à la parole elle-même ou à la manière dont elle est prononcée. « Une parole juste » est idiomatique et préserve l’idée de justice ou de rectitude.
- source_word: וְלֹא יָשׁוּב
  choice: qui ne reviendra pas
  rationale: Préserve la métaphore hébraïque sans expliciter davantage par « ne sera pas révoquée ».
- source_word: לִי תִּכְרַע כָּל בֶּרֶךְ
  choice: devant moi tout genou fléchira
  rationale: « Devant moi » exprime idiomatiquement en français l’hommage ou la soumission impliqués, tandis que « tout genou fléchira » reste proche de l’image hébraïque.
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  choice: toute langue prêtera serment
  rationale: Rend directement le verbe de serment sans ajouter explicitement l’idée d’allégeance, que le contexte peut néanmoins impliquer.
theological_decisions:
- issue: Nature de la soumission universelle
  choice: Décrire l’hommage et le serment universels sans préciser s’ils sont volontaires ou contraints.
  alternative: « toute langue jurera fidélité »
  rationale: L’hébreu affirme la reconnaissance universelle de la souveraineté du Seigneur, mais ne précise pas ici la disposition intérieure de ceux qui se soumettent.
- issue: Portée de צְדָקָה dans la parole divine
  choice: « une parole juste »
  alternative: « une parole prononcée avec justice »
  rationale: La formulation française principale rattache la justice à la parole, tout en signalant en note l’autre relation syntaxique possible afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images du serment divin, de la parole qui sort de la bouche, du genou qui fléchit et de la langue qui prête serment.
