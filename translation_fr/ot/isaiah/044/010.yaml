id: ISA.44.10
reference: Isaiah 44:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִֽי יָצַ֥ר אֵ֖ל וּ/פֶ֣סֶל נָסָ֑ךְ לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/010.yaml
  text: Who fashions a god or casts an idol that is profitable for nothing?[a]
translation:
  language: fr
  text: Qui façonne un dieu ou coule une idole qui ne sert à rien ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Qui façonne un dieu et coule une idole, sans en tirer aucun profit ? »'
    reason: La conjonction ו peut se rendre par « et », et לְבִלְתִּי הוֹעִיל peut qualifier l’entreprise de fabrication plutôt que seulement l’idole.
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif ouvre une question rhétorique incisive.
- source_word: יָצַר
  choice: façonne
  rationale: Le verbe désigne l’action de former ou de modeler, ici dans le travail d’un artisan.
- source_word: אֵל
  choice: un dieu
  rationale: Le nom est indéfini et désigne ici une divinité fabriquée, non le Dieu d’Israël.
- source_word: וּפֶסֶל
  choice: ou … une idole
  rationale: Dans ce parallélisme, le waw peut être rendu naturellement par « ou »; פֶסֶל désigne une image taillée ou sculptée servant d’idole.
- source_word: נָסָךְ
  choice: coule
  rationale: Dans le contexte de la fabrication d’une idole, le verbe évoque le coulage du métal dans un moule.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: qui ne sert à rien
  rationale: Cette formulation idiomatique exprime l’absence totale d’utilité, tout en rattachant naturellement l’idée à l’idole dans la phrase française.
theological_decisions:
- issue: Sens de אֵל dans la polémique contre les idoles
  choice: un dieu
  alternative: Dieu
  rationale: La minuscule et l’article indéfini indiquent qu’il s’agit d’une prétendue divinité fabriquée; « Dieu » ferait à tort penser au vrai Dieu.
- issue: Rattachement de לְבִלְתִּי הוֹעִיל
  choice: l’inutilité caractérise l’idole fabriquée
  alternative: la fabrication elle-même se fait sans aucun profit
  rationale: La syntaxe hébraïque permet une certaine souplesse. Le texte principal adopte le rattachement le plus naturel en français, tandis que la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, direct et digne. « Façonne » et « coule » maintiennent le vocabulaire artisanal; la question rhétorique conserve la force polémique du verset.
