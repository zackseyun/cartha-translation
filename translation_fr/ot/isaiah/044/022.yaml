  text: מָחִ֤יתִי כָ/עָב֙ פְּשָׁעֶ֔י/ךָ וְ/כֶ/עָנָ֖ן חַטֹּאותֶ֑י/ךָ שׁוּבָ֥/ה אֵלַ֖/י כִּ֥י גְאַלְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
translation:
  language: fr
  text: J’ai effacé tes révoltes comme un nuage[a], et tes péchés comme une nuée. Reviens à moi[b], car je t’ai racheté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « J’ai fait disparaître tes révoltes comme un nuage, et tes péchés comme un nuage. » L’hébreu emploie en parallèle deux termes apparentés désignant les nuages.'
    reason: lexical_alternative
  - marker: b
    text: « Reviens à moi » peut aussi se traduire par « Retourne-toi vers moi »; le verbe peut évoquer à la fois un retour relationnel et le repentir.
    reason: lexical_alternative
  - marker: c
    text: 'Dans le langage prophétique, les deux verbes au parfait peuvent éventuellement exprimer un avenir tenu pour certain : « J’effacerai ... je te rachèterai. »'
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  choice: J’ai effacé
  rationale: Le verbe מחה exprime l’action d’effacer, de faire disparaître ou de supprimer. « Effacé » est naturel en français moderne et conserve l’image d’une faute entièrement ôtée.
- source_word: כָעָב
  choice: comme un nuage
  rationale: La préposition כ marque ici la comparaison, et עָב désigne un nuage, souvent épais. « Comme un nuage » rend directement l’image.
- source_word: פְּשָׁעֶיךָ
  choice: tes révoltes
  rationale: פשע évoque souvent la rébellion contre une autorité, et non une faute quelconque. « Révoltes » préserve cette force tout en restant compréhensible.
- source_word: וְכֶעָנָן
  choice: et ... comme une nuée
  rationale: עָנָן désigne un nuage. « Nuée » permet de garder la variation poétique avec עָב sans transformer indûment le terme en « brume ».
- source_word: חַטֹּאותֶיךָ
  choice: tes péchés
  rationale: « Péchés » est le sens courant et contextuellement approprié de חטאות; il forme un parallèle naturel avec « révoltes ».
- source_word: שׁוּבָה אֵלַי
  choice: Reviens à moi
  rationale: L’impératif de שוב peut signifier revenir ou faire demi-tour. « Reviens à moi » garde à la fois la dimension relationnelle et l’appel au retournement.
- source_word: כִּי
  choice: car
  rationale: 'כִּי introduit le motif de l’appel à revenir : le rachat accompli ou assuré par Dieu. « Car » exprime clairement ce lien.'
- source_word: גְאַלְתִּיךָ
  choice: je t’ai racheté
  rationale: גאל appartient au vocabulaire de la délivrance et du rachat, notamment par celui qui exerce un droit ou une responsabilité de proche. « Racheté » en conserve la portée biblique sans préciser un mécanisme absent du verset.
theological_decisions:
- issue: Valeur temporelle et aspectuelle des formes verbales מָחִיתִי et גְאַלְתִּיךָ
  choice: 'Les rendre par des passés composés : « J’ai effacé ... je t’ai racheté »'
  alternative: 'Les comprendre comme des parfaits prophétiques exprimant l’avenir assuré : « J’effacerai ... je te rachèterai »'
  rationale: Dans le contexte, l’appel à revenir repose sur l’action divine présentée comme accomplie ou certaine. Le passé composé exprime bien en français une action achevée dont le résultat demeure, tandis qu’une note conserve la lecture future possible en langage prophétique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé par « nuage / nuée », et « révoltes / péchés » maintient la distinction sémantique entre les deux termes hébreux.
