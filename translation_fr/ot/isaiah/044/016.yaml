source:
  edition: WLC
  text: חֶצְי/וֹ֙ שָׂרַ֣ף בְּמוֹ אֵ֔שׁ עַל חֶצְי/וֹ֙ בָּשָׂ֣ר יֹאכֵ֔ל יִצְלֶ֥ה צָלִ֖י וְ/יִשְׂבָּ֑ע אַף יָחֹם֙ וְ/יֹאמַ֣ר הֶאָ֔ח חַמּוֹתִ֖י רָאִ֥יתִי אֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/016.yaml
  text: 'Half of it he burns in the fire[a]; over the other half he eats meat: he roasts a roast and is satisfied. He also warms himself and says, “Aha! I am warm[c][b]; I have seen the fire.”'
translation:
  language: fr
  text: 'Il en brûle la moitié dans le feu. Avec l’autre moitié, il fait rôtir un rôti[a], mange de la viande et se rassasie. Il se chauffe aussi et dit : « Ah ! je suis bien au chaud, je vois le feu[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un verbe et un nom de même racine : « il fait rôtir un rôti ». On peut aussi traduire : « il fait rôtir de la viande ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la flamme » ou « la lueur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶצְיוֹ
  choice: la moitié / l’autre moitié
  rationale: Le nom avec suffixe renvoie au morceau de bois évoqué dans le contexte. « En… la moitié » puis « l’autre moitié » exprime naturellement en français le partage en deux usages.
- source_word: שָׂרַף בְּמוֹ אֵשׁ
  choice: il en brûle… dans le feu
  rationale: Le parfait hébreu appartient à une description vive des actions de l’artisan; le présent français convient à cette séquence. « Dans le feu » rend naturellement le moyen et la situation.
- source_word: עַל חֶצְיוֹ בָּשָׂר יֹאכֵל יִצְלֶה צָלִי
  choice: Avec l’autre moitié, il fait rôtir de la viande, la mange
  rationale: La formulation française rétablit l’ordre logique de la préparation et du repas tout en conservant les deux idées du texte. « Avec » présente cette moitié du bois comme combustible, valeur contextuelle de עַל.
- source_word: וְיִשְׂבָּע
  choice: et se rassasie
  rationale: Le verbe indique qu’il mange jusqu’à satiété; « se rassasie » est précis, courant et digne.
- source_word: אַף יָחֹם
  choice: Il se chauffe aussi
  rationale: אַף ajoute un autre usage du bois, et le contexte donne à יָחֹם un sens réfléchi naturel en français.
- source_word: הֶאָח
  choice: Ah !
  rationale: L’interjection exprime ici le plaisir satisfait de l’homme devant la chaleur.
- source_word: חַמּוֹתִי
  choice: Je me suis réchauffé
  rationale: Le parfait présente l’état atteint grâce au feu. Le passé composé français conserve ce résultat mieux qu’un simple état présent.
- source_word: רָאִיתִי אוּר
  choice: j’ai vu la flamme
  rationale: אוּר peut désigner le feu, la flamme ou sa lueur. « Flamme » est concret et évite la répétition immédiate de « feu », sans fermer les autres nuances signalées en note.
theological_decisions:
- issue: Rendre la satire anti-idolâtrique sans ajouter une interprétation absente du verset
  choice: Décrire simplement les usages ordinaires du bois et la satisfaction de l’artisan
  alternative: Ajouter dans le verset une mention explicite de l’idole ou souligner verbalement l’ironie
  rationale: Le contexte porte la satire, mais ce verset se limite au combustible, à la nourriture et à la chaleur. La traduction laisse l’ironie émerger sans commentaire doctrinal ajouté.
translation_notes:
  register: Français international moderne, clair et digne. Le présent maintient la vivacité descriptive du passage; le discours direct emploie le passé composé pour rendre les parfaits de résultat. La légère restructuration de la proposition sur la viande rend l’enchaînement intelligible, tandis que la note garde visible la formulation hébraïque.
