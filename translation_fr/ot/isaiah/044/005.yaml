  naturalness: « J’appartiens à Yahweh » est la formulation moderne, claire et sobre. « Se réclamera du nom de Jacob » et « se donnera le nom d’Israël » sont naturels et maintiennent la distinction des deux expressions hébraïques.
  terminology: Yahweh, Jacob et Israël sont correctement conservés. La formulation révisée exprime l’allégeance sans introduire de catégories confessionnelles ultérieures.
