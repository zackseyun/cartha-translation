source:
  edition: WLC
  text: זֶ֤ה יֹאמַר֙ לַֽ/יהוָ֣ה אָ֔נִי וְ/זֶ֖ה יִקְרָ֣א בְ/שֵֽׁם יַעֲקֹ֑ב וְ/זֶ֗ה יִכְתֹּ֤ב יָד/וֹ֙ לַֽ/יהוָ֔ה וּ/בְ/שֵׁ֥ם יִשְׂרָאֵ֖ל יְכַנֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
translation:
  language: fr
  text: 'L’un dira : « J’appartiens à Yahweh »[a] ; un autre se réclamera du nom de Jacob ; un autre encore écrira sur sa main : « J’appartiens à Yahweh »[b], et se donnera le nom d’Israël[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Celui-ci dira : “À Yahweh, moi.” » L’expression hébraïque est elliptique et exprime vraisemblablement l’appartenance à Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « écrira sa main à Yahweh ». Il s’agit probablement d’une inscription ou d’une marque sur la main indiquant l’appartenance à Yahweh; la syntaxe exacte est discutée.'
    reason: cultural_note
  - marker: c
    text: 'Autre traduction possible : « et se surnommera du nom d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  choice: L’un… un autre… un autre encore
  rationale: La répétition du démonstratif distingue plusieurs personnes successives. Cette formulation française naturelle en conserve la valeur distributive.
- source_word: יֹאמַר
  choice: dira
  rationale: Dans ce contexte prophétique, l’inaccompli hébreu se rend naturellement par le futur.
- source_word: לַיהוָה אָנִי
  choice: Je suis à Yahweh
  rationale: L’expression hébraïque est elliptique, littéralement « À Yahweh, moi ». « Je suis à Yahweh » exprime avec sobriété l’appartenance revendiquée, sans ajouter un verbe absent du texte au-delà de ce qu’exige le français.
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  choice: se réclamera du nom de Jacob
  rationale: Dans le parallélisme du verset, l’expression indique vraisemblablement que la personne adopte publiquement l’identité associée à Jacob. « Se réclamer du nom de » garde cette idée d’identification sans suggérer qu’elle invoque Jacob dans la prière.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est conservé ; dans le contexte, il représente aussi le peuple portant ce nom.
- source_word: יִכְתֹּב יָדוֹ לַיהוָה
  choice: 'écrira sur sa main : « À Yahweh »'
  rationale: L’hébreu dit littéralement « écrira sa main à Yahweh », tournure difficile probablement liée à une inscription ou marque d’appartenance. La traduction conserve l’image concrète de la main tout en signalant en note l’incertitude syntaxique.
- source_word: יָדוֹ
  choice: sa main
  rationale: Traduction directe du nom hébreu, qui désigne ici la main.
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  choice: et se donnera le nom d’Israël
  rationale: Le piel de כנה exprime ici l’attribution ou l’adoption d’un nom. La tournure française rend clairement l’auto-identification, tout en conservant en note l’autre traduction traditionnelle possible.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé ; comme Jacob, il désigne ici une identité liée au peuple de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Portée de la confession et des noms adoptés
  choice: Le verset présente des personnes qui déclarent publiquement leur appartenance à Yahweh et leur identification à Jacob-Israël.
  alternative: On pourrait y voir une affiliation sociale plus générale à Israël, sans confession explicite d’alliance.
  rationale: Les propositions parallèles associent déclaration, adoption d’un nom et inscription sur la main. La traduction en conserve la force d’appartenance sans introduire de catégories religieuses postérieures.
- issue: Sens de l’inscription sur la main
  choice: La formule est présentée comme une inscription « À Yahweh », signe probable d’appartenance.
  alternative: L’hébreu pourrait être compris plus littéralement comme « écrira sa main à Yahweh », éventuellement au sens de consacrer ou engager sa main.
  rationale: La syntaxe hébraïque est condensée et discutée. Le texte principal offre une lecture intelligible et courante, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La structure ternaire est rendue avec fluidité, les noms Jacob, Israël et Yahweh sont conservés, et les notes exposent les ellipses et ambiguïtés sans alourdir le texte principal.
