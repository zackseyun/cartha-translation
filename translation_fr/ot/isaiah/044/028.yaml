  text: הָ/אֹמֵ֤ר לְ/כ֨וֹרֶשׁ֙ רֹעִ֔/י וְ/כָל חֶפְצִ֖/י יַשְׁלִ֑ם וְ/לֵ/אמֹ֤ר לִ/ירוּשָׁלִַ֨ם֙ תִּבָּנֶ֔ה וְ/הֵיכָ֖ל תִּוָּסֵֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: fr
  text: 'celui qui dit de Cyrus : « Il est mon berger, et il accomplira tout ce que je désire », en disant de Jérusalem : « Elle sera rebâtie », et du temple : « Sa fondation sera posée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹעִי
  choice: mon berger
  rationale: Rend directement la métaphore royale et pastorale de l’hébreu, sans l’expliciter ni l’atténuer.
- source_word: חֶפְצִי
  choice: tout ce que je désire
  rationale: חֵפֶץ peut désigner le désir, le bon plaisir ou le dessein. Cette formulation naturelle conserve ici l’idée de la volonté divine sans la réduire à un plan abstrait.
- source_word: יַשְׁלִם
  choice: il accomplira
  rationale: Le verbe signifie mener à son terme, accomplir pleinement; ce choix convient au complément חֶפְצִי.
- source_word: תִּבָּנֶה
  choice: elle sera rebâtie
  rationale: Le nifal exprime ici la reconstruction de Jérusalem; « rebâtie » rend le contexte de restauration plus précisément que le simple « bâtie ».
- source_word: תִּוָּסֵד
  choice: ses fondations seront posées
  rationale: Rend le hofal de יסד et fait du temple le référent naturel; le pluriel « fondations » est idiomatique en français.
theological_decisions:
- issue: Cyrus appelé « mon berger »
  choice: Conserver littéralement « mon berger »
  alternative: mon pasteur / celui qui conduit mon peuple
  rationale: Le titre attribué à un souverain étranger constitue une tension théologique voulue par le texte; il ne faut ni la gommer ni l’interpréter dans la traduction.
- issue: Portée de חֶפְצִי
  choice: tout ce que je désire
  alternative: tout mon dessein / toute ma volonté
  rationale: Le choix préserve la dimension de bon plaisir ou de volonté sans imposer une systématisation doctrinale du dessein divin.
- issue: Enchaînement de וְלֵאמֹר
  choice: qui dit de Jérusalem
  alternative: en disant de Jérusalem
  rationale: Le participe initial « celui qui dit » reste le cadre syntaxique le plus naturel; l’hébreu permet un enchaînement où Dieu demeure le locuteur. La traduction évite de faire de Cyrus le sujet du second « dire ».
translation_notes:
  register: Français moderne, digne et lisible. La structure poétique parallèle est conservée, avec des formulations naturelles. Aucun ajout explicatif ni marque confessionnelle.
