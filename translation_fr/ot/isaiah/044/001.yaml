source:
  edition: WLC
  text: וְ/עַתָּ֥ה שְׁמַ֖ע יַעֲקֹ֣ב עַבְדִּ֑/י וְ/יִשְׂרָאֵ֖ל בָּחַ֥רְתִּי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
translation:
  language: fr
  text: Mais maintenant, écoute, Jacob, mon serviteur, toi, Israël que j’ai choisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et maintenant, écoute, Jacob, mon serviteur, toi, Israël que j’ai choisi. »'
    reason: La conjonction initiale peut être rendue par « et » plutôt que par « mais ».
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: La conjonction et l’adverbe temporel introduisent ici un tournant par rapport au jugement qui précède. « Mais maintenant » exprime naturellement ce contraste en français.
- source_word: שְׁמַע
  choice: écoute
  rationale: L’impératif signifie « entendre, écouter ». Dans une adresse directe, « écoute » est plus idiomatique en français moderne tout en conservant la force prophétique.
- source_word: יַעֲקֹב עַבְדִּי
  choice: Jacob, mon serviteur
  rationale: « Serviteur » rend le rôle relationnel et vocationnel d’Israël sans accentuer indûment l’idée d’esclavage.
- source_word: וְיִשְׂרָאֵל
  choice: et toi, Israël
  rationale: Le pronom ajouté en français clarifie que l’impératif s’adresse parallèlement à Israël, autre nom du même peuple personnifié, sans modifier le sens.
- source_word: בָּחַרְתִּי בוֹ
  choice: que j’ai choisi
  rationale: Avec בחר, la préposition ב introduit idiomatiquement l’être choisi. Le passé composé exprime un choix accompli dont la portée demeure présente.
theological_decisions:
- issue: Désignation d’Israël comme עַבְדִּי
  choice: mon serviteur
  alternative: mon esclave
  rationale: Dans ce contexte d’alliance et de vocation, « serviteur » rend mieux la relation et la mission d’Israël; « esclave » mettrait excessivement l’accent sur la servitude.
- issue: Valeur de la conjonction initiale וְ
  choice: Mais maintenant
  alternative: Et maintenant
  rationale: Le contexte passe du reproche et du jugement à une nouvelle parole de consolation. La valeur adversative rend ce tournant rhétorique sans ajouter une idée étrangère.
- issue: Aspect du parfait בָּחַרְתִּי
  choice: j’ai choisi
  alternative: je choisis / je choisis autrefois
  rationale: Le passé composé garde l’idée d’un acte accompli avec une pertinence actuelle, sans transformer explicitement le choix en action présente.
translation_notes:
  register: Français international moderne, naturel et digne. « Écoute » convient mieux que « entends » à une injonction directe. L’ajout de « toi » soutient le parallélisme et évite que « Israël » soit lu comme un simple complément de « serviteur ».
