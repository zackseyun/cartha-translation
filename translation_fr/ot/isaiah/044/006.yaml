source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé, le roi d’Israël et son rédempteur, Yahvé des armées : « Je suis le premier et je suis le dernier ; en dehors de moi, il n’y a pas de Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en dehors de moi, il n’y a pas de dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rend directement le groupe construit et conserve le titre en apposition à Yahvé.
- source_word: גֹאֲלוֹ
  choice: celui qui le rachète
  rationale: Exprime naturellement l’action du participe גאל et rend explicite que le suffixe renvoie à Israël, sans imposer le sens plus précis de « proche parent rédempteur ».
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Traduction transparente du titre hébreu, plus immédiatement compréhensible aujourd’hui que la formule traditionnelle « Yahvé des armées célestes » ou « Seigneur des armées ».
- source_word: אֲנִי רִאשׁוֹן וַאֲנִי אַחֲרוֹן
  choice: Je suis le premier et je suis le dernier
  rationale: Conserve la répétition emphatique du pronom et le parallélisme solennel de l’hébreu.
- source_word: וּמִבַּלְעָדַי
  choice: en dehors de moi
  rationale: Formulation française idiomatique qui exprime l’exclusivité de « hors de, à part ».
- source_word: אֵין אֱלֹהִים
  choice: il n’y a pas de Dieu
  rationale: Rend l’affirmation existentielle absolue dans son contexte monothéiste, tout en signalant en note la possibilité graphique et sémantique de « dieu ».
theological_decisions:
- issue: Portée de גֹאֲלוֹ
  choice: celui qui le rachète
  alternative: son rédempteur
  rationale: La formulation verbale reste accessible et conserve l’idée de délivrance ou de rachat, sans surdéterminer les connotations juridiques et familiales possibles de גאל.
- issue: Titre יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: Yahvé, le maître des armées
  rationale: Le choix retenu suit de près le lexique hébreu et maintient la forme traditionnelle du titre sans introduire l’interprétation « Tout-Puissant ».
- issue: Force monothéiste de אֵין אֱלֹהִים
  choice: il n’y a pas de Dieu
  alternative: il n’y a pas de dieu
  rationale: La majuscule exprime naturellement en français la déclaration absolue sur l’unicité divine; une note préserve l’autre présentation possible du nom commun hébreu.
translation_notes:
  register: Français international actuel, digne et oralement fluide. La répétition « Je suis… je suis… » est conservée pour respecter l’emphase et la cadence de l’hébreu. Le nom divin est rendu par « Yahvé ».
