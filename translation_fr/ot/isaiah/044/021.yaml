id: ISA.44.21
reference: Isaiah 44:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זְכָר אֵ֣לֶּה יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל כִּ֣י עַבְדִּ/י אָ֑תָּה יְצַרְתִּ֤י/ךָ עֶֽבֶד לִ/י֙ אַ֔תָּה יִשְׂרָאֵ֖ל לֹ֥א תִנָּשֵֽׁ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
translation:
  language: fr
  text: Souviens-toi de ces choses, Jacob, et toi, Israël, car tu es mon serviteur. Je t’ai façonné ; tu es mon serviteur. Israël, je ne t’oublierai pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Israël, ne m’oublie pas. » La forme hébraïque peut aussi être comprise comme une exhortation adressée à Israël plutôt que comme une assurance donnée par Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר
  choice: Souviens-toi
  rationale: Impératif qal masculin singulier de זכר ; « Souviens-toi » rend directement et naturellement l’appel adressé à Jacob-Israël.
- source_word: אֵלֶּה
  choice: de ces choses
  rationale: Le démonstratif pluriel renvoie à ce qui précède ; le substantif « choses » est explicité pour obtenir un français idiomatique.
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Jacob, et toi, Israël
  rationale: Les deux noms désignent le même peuple interpellé. « Et toi » fait entendre naturellement la reprise vocative sans changer le référent.
- source_word: כִּי עַבְדִּי אָתָּה
  choice: car tu es mon serviteur
  rationale: כִּי donne ici le motif de l’exhortation, et « serviteur » convient au rapport d’appartenance et de vocation exprimé dans ce contexte.
- source_word: יְצַרְתִּיךָ
  choice: Je t’ai façonné
  rationale: יצר évoque l’action de former ou de modeler ; « façonné » conserve cette image créatrice en français courant.
- source_word: עֶבֶד לִי אַתָּה
  choice: tu es mon serviteur
  rationale: Cette formulation préserve la proposition distincte et l’insistance du texte hébreu. Le possessif français exprime naturellement le datif לִי dans ce rapport d’appartenance.
- source_word: לֹא תִנָּשֵׁנִי
  choice: je ne t’oublierai pas
  rationale: 'La forme est comprise comme une assurance passive quant au sens : Israël ne sera pas oublié par Dieu. La tournure active est plus naturelle en français et conserve le même rapport sémantique.'
theological_decisions:
- issue: Sens sujet-objet de לֹא תִנָּשֵׁנִי
  choice: 'Assurance divine : « je ne t’oublierai pas »'
  alternative: 'Exhortation adressée à Israël : « ne m’oublie pas »'
  rationale: Le contexte immédiat, centré sur Israël comme serviteur façonné par Dieu, favorise une assurance de fidélité divine. L’ambiguïté réelle de la forme hébraïque est néanmoins conservée dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « serviteur » et les propositions distinctes sont maintenues afin de respecter l’insistance et la structure de l’hébreu.
