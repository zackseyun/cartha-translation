base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
translation:
  language: fr
  text: Il coupe pour lui-même des cèdres ; il prend un cyprès[a] ou un chêne et le rend vigoureux parmi les arbres de la forêt[b]. Il plante un pin[c], et la pluie le fait pousser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu תִּרְזָה désigne une essence d’identification incertaine ; on propose aussi le chêne vert, le térébinthe ou l’orme.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et il le choisit parmi les arbres de la forêt ». La proposition hébraïque est difficile ; elle peut évoquer soit le fait de rendre l’arbre vigoureux, soit le choix d’un arbre robuste.'
    reason: alternative_reading
  - marker: c
    text: Le mot hébreu אֹרֶ désigne une essence d’identification incertaine ; on propose aussi le sapin, le frêne ou le laurier.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִכְרָת ל֣וֹ אֲרָזִ֔ים
  choice: Il se coupe des cèdres
  rationale: L’infinitif avec לְ poursuit la description de l’activité de l’artisan. La tournure pronominale française exprime naturellement le datif d’intérêt לֹו, « pour lui-même ».
- source_word: וַיִּקַּ֤ח
  choice: il prend
  rationale: Le waw fait avancer la description. Le point-virgule suffit en français à marquer l’enchaînement sans imposer une stricte chronologie.
- source_word: תִּרְזָה֙
  choice: un cyprès
  rationale: L’identification botanique est incertaine. « Cyprès » est une possibilité courante et adaptée à un contexte de bois de construction ou de sculpture ; l’incertitude est signalée en note.
- source_word: וְאַלּ֔וֹן
  choice: ou un chêne
  rationale: אַלּוֹן désigne bien le chêne. Dans cette énumération d’essences possibles, « ou » rend clairement l’alternative implicite.
- source_word: וַיְאַמֶּץ ל֖וֹ בַּעֲצֵי יָ֑עַר
  choice: et le laisse devenir vigoureux parmi les arbres de la forêt
  rationale: Le verbe אמץ porte normalement l’idée de force ou d’affermissement. Cette traduction conserve ce sens lexical et comprend la proposition comme la croissance entretenue ou permise de l’arbre, tout en signalant en note la difficulté de l’hébreu et l’autre lecture possible.
- source_word: נָטַ֥ע אֹ֖רֶ
  choice: Il plante un pin
  rationale: Le présent convient au tableau général des gestes de l’artisan. L’essence désignée par אֹרֶ reste incertaine ; « pin » est un équivalent plausible, avec note explicative.
- source_word: וְגֶ֥שֶׁם יְגַדֵּֽל
  choice: et la pluie le fait pousser
  rationale: La formulation rend simplement la valeur causative du verbe et souligne que la croissance de l’arbre dépend de la pluie.
theological_decisions:
- issue: Description condensée de la provenance du bois dans une satire contre l’idolâtrie
  choice: 'Présenter une suite d’actions ordinaires : l’artisan coupe ou prend du bois, laisse un arbre devenir vigoureux, en plante un autre, puis la pluie le fait pousser.'
  alternative: Comprendre וַיְאַמֶּץ לּוֹ comme « il choisit pour lui-même un arbre robuste parmi les arbres de la forêt ».
  rationale: Le texte met en contraste l’usage idolâtre ultérieur avec l’origine banale et dépendante du bois. La traduction ne renforce pas artificiellement la portée théologique du verset et maintient en note l’ambiguïté de la proposition difficile.
translation_notes:
  register: Français international moderne, clair et digne. Le présent donne au passage la valeur d’une description générale. « Il se coupe » restitue sans lourdeur l’idée de bénéfice personnel, tandis que les notes préservent les deux incertitudes botaniques et l’ambiguïté syntaxique.
