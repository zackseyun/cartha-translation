language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָרַ֤שׁ בַּרְזֶל֙ מַֽעֲצָ֔ד וּ/פָעַל֙ בַּ/פֶּחָ֔ם וּ/בַ/מַּקָּב֖וֹת יִצְּרֵ֑/הוּ וַ/יִּפְעָלֵ֨/הוּ֙ בִּ/זְר֣וֹעַ כֹּח֔/וֹ גַּם רָעֵב֙ וְ/אֵ֣ין כֹּ֔חַ לֹא שָׁ֥תָה מַ֖יִם וַ/יִּיעָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
translation:
  language: fr
  text: Le forgeron travaille avec un outil de taille[a] et travaille sur les braises ; à coups de marteau, il façonne l’objet et le travaille de son bras vigoureux. Il a aussi faim et n’a plus de force ; il n’a pas bu d’eau et s’épuise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une herminette », « un burin » ou « un ciseau » ; l’outil précis désigné par le terme hébreu est incertain.
    reason: 'Alternative lexicale : l’identification exacte de מַעֲצָד est discutée.'
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  choice: Le forgeron
  rationale: L’expression désigne un artisan travaillant le fer. « Forgeron » est précis, courant et naturel en français.
- source_word: מַעֲצָד
  choice: un outil de taille
  rationale: Le terme désigne un outil servant à tailler ou façonner, mais son identification exacte reste incertaine. Le choix français conserve cette indétermination, avec les possibilités plus précises en note.
- source_word: וּפָעַל / וַיִּפְעָלֵהוּ
  choice: travaille / le travaille
  rationale: La répétition de « travailler » reproduit celle de la racine פעל et souligne l’effort soutenu de l’artisan.
- source_word: בַּפֶּחָם
  choice: sur les braises
  rationale: Le mot renvoie au charbon incandescent employé dans le travail du métal. « Sur les braises » restitue naturellement la scène de forge.
- source_word: וּבַמַּקָּבוֹת
  choice: à coups de marteau
  rationale: La forme plurielle évoque les frappes répétées ou les marteaux employés. Cette tournure française rend clairement et vivement le geste.
- source_word: יִצְּרֵהוּ
  choice: il façonne l’objet
  rationale: Le verbe signifie former ou façonner. « L’objet » explicite sobrement le référent du pronom masculin hébreu, qui n’est pas nommé dans ce verset en français.
- source_word: בִּזְרֹעַ כֹּחוֹ
  choice: de son bras vigoureux
  rationale: Cette formulation naturelle rend littéralement l’idée du « bras de sa force » et maintient l’accent sur l’effort physique.
- source_word: גַּם רָעֵב וְאֵין כֹּחַ
  choice: Il a aussi faim et n’a plus de force
  rationale: Le rendu garde l’enchaînement sobre de la faim et de l’épuisement, sans ajouter d’explication interprétative.
- source_word: לֹא שָׁתָה מַיִם
  choice: il n’a pas bu d’eau
  rationale: Le passé composé rend l’accompli hébreu et son résultat présent dans la progression vers l’épuisement.
- source_word: וַיִּיעָף
  choice: et s’épuise
  rationale: Le verbe exprime la fatigue ou la défaillance. « S’épuise » convient au point culminant de la faim, de la soif et de l’effort.
theological_decisions:
- issue: La satire prophétique de la fabrication des idoles
  choice: Décrire concrètement le travail épuisant et la faiblesse physique du forgeron.
  alternative: Introduire dans le verset une formulation explicite sur la vanité ou l’absurdité de l’idolâtrie.
  rationale: Le contexte plus large porte la satire, tandis que ce verset décrit directement le labeur de l’artisan. La traduction laisse la portée théologique ressortir du contexte sans l’ajouter au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition volontaire de « travaille » reflète celle de l’hébreu. Le marqueur [a] est placé après le terme réellement concerné par la note, contrairement à son emplacement incohérent dans la couche de consultation anglaise.
