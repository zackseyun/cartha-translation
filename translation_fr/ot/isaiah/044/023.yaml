  variant: modern international French
source:
  edition: WLC
  text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ הָרִים֙ רִנָּ֔ה יַ֖עַר וְ/כָל עֵ֣ץ בּ֑/וֹ כִּֽי גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּ/בְ/יִשְׂרָאֵ֖ל יִתְפָּאָֽר־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
translation:
  language: fr
  text: Cieux, chantez de joie, car Yahweh a agi[a] ! Profondeurs de la terre[b], poussez des acclamations ! Montagnes, éclatez en chants de joie, ainsi que la forêt et tous les arbres qui s’y trouvent ! Car Yahweh a racheté Jacob, et en Israël il manifeste sa gloire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car Yahweh a fait cela ». L’hébreu n’exprime pas l’objet du verbe « faire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « régions les plus basses de la terre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « en Israël il se glorifie » ou « en Israël il se montre glorieux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רָנּוּ
  choice: chantez de joie
  rationale: L’impératif pluriel de רנן exprime une louange vocale jubilante. Cette formulation française rend à la fois le chant et la joie.
- source_word: כִּי עָשָׂה יְהוָה
  choice: car Yahweh a agi
  rationale: Le verbe עשה a ici un emploi absolu, sans objet exprimé. « A agi » reste naturel en français sans préciser ce que le texte hébreu laisse implicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin יהוה, qui le distingue d’un titre comme « le Seigneur ».
- source_word: הָרִיעוּ
  choice: poussez des acclamations
  rationale: Le hiphil impératif de רוע désigne ici une forte acclamation jubilante. La formulation ne lui ajoute aucun complément absent de l’hébreu.
- source_word: תַּחְתִּיּוֹת אָרֶץ
  choice: profondeurs de la terre
  rationale: Expression poétique désignant les régions les plus basses de la terre et contribuant à la portée cosmique de l’appel.
- source_word: פִּצְחוּ ... רִנָּה
  choice: éclatez en chants de joie
  rationale: L’expression évoque le déclenchement soudain d’une célébration sonore. « Éclatez en chants de joie » est idiomatique et conserve l’élan poétique.
- source_word: יַעַר וְכָל עֵץ בּוֹ
  choice: la forêt et tous les arbres qui s’y trouvent
  rationale: Rend le collectif singulier יער et la totalité distributive de כל עץ בו dans un français clair.
- source_word: גָאַל
  choice: a racheté
  rationale: גאל exprime la délivrance accomplie par un rédempteur ou proche garant. « Racheter » conserve cette portée sans développer le mécanisme.
- source_word: יִתְפָּאָר
  choice: il manifeste sa gloire
  rationale: Le hitpael peut exprimer le fait de se glorifier ou de se montrer glorieux. La formulation choisie communique que la gloire de Yahweh devient visible en Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin, non le titre אֲדֹנָי. Sa transcription préserve cette distinction.
- issue: Valeur de יִתְפָּאָר dans la proposition finale
  choice: en Israël il manifeste sa gloire
  alternative: en Israël il se glorifie ; en Israël il se montre glorieux
  rationale: Le sujet grammatical est Yahweh. Le choix retenu rend la manifestation de sa gloire sans faire d’Israël le sujet, tandis que la note préserve la nuance réflexive possible du hitpael.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs placés après les vocatifs évitent l’emploi répété de « ô », aujourd’hui marqué, tout en maintenant clairement la personnification cosmique. Le rythme exclamatif et les parallélismes de l’hébreu sont conservés.
