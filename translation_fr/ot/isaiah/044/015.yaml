source:
  edition: WLC
  text: וְ/הָיָ֤ה לְ/אָדָם֙ לְ/בָעֵ֔ר וַ/יִּקַּ֤ח מֵ/הֶם֙ וַ/יָּ֔חָם אַף יַשִּׂ֖יק וְ/אָ֣פָה לָ֑חֶם אַף יִפְעַל אֵל֙ וַ/יִּשְׁתָּ֔חוּ עָשָׂ֥/הוּ פֶ֖סֶל וַ/יִּסְגָּד לָֽ/מוֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
translation:
  language: fr
  text: 'Il sert alors de combustible à l’homme : celui-ci en prend et se chauffe ; il allume aussi un feu et fait cuire du pain. Il en fait aussi un dieu et se prosterne ; il en fait une image sculptée et se prosterne devant elle[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « devant eux ». L’hébreu emploie ici une forme pronominale plurielle, peut-être par usage poétique ou en référence aux morceaux de bois pris collectivement.
    reason: La note préserve une particularité grammaticale et une ambiguïté réelle de l’hébreu que le français courant ne peut reproduire sans créer une rupture d’accord.
lexical_decisions:
- source_word: וְהָיָה לְאָדָם לְבָעֵר
  choice: Il sert alors de combustible à l’homme
  rationale: Cette formulation exprime naturellement en français le résultat et la fonction indiqués par היה et l’infinitif avec ל. « L’homme » garde ici la valeur générique et singulière de אָדָם.
- source_word: וַיִּקַּח מֵהֶם
  choice: celui-ci en prend
  rationale: Le pronom adverbial « en » rend avec concision la valeur partitive de מֵהֶם et renvoie aux éléments de bois du contexte précédent.
- source_word: וַיָּחָם
  choice: se chauffe
  rationale: Le contexte montre que l’homme utilise le bois pour obtenir de la chaleur ; le tour pronominal est idiomatique en français.
- source_word: אַף יַשִּׂיק וְאָפָה לָחֶם
  choice: il allume aussi un feu et fait cuire du pain
  rationale: אַף ajoute l’idée de « aussi » ; « allumer un feu » explicite naturellement en français l’action d’embraser nécessaire à la cuisson.
- source_word: אַף יִפְעַל אֵל
  choice: Il en fait aussi un dieu
  rationale: « Dieu » traduit directement אֵל et conserve l’ironie prophétique d’un dieu fabriqué avec le même bois que celui qui sert de combustible. « En » maintient le lien matériel avec le bois.
- source_word: וַיִּשְׁתָּחוּ
  choice: et se prosterne
  rationale: Le verbe désigne concrètement l’action de s’incliner ou de se prosterner ; ce rendu ne remplace pas le geste par son interprétation cultuelle.
- source_word: עָשָׂהוּ פֶסֶל
  choice: il en fait une statue sculptée
  rationale: פֶסֶל désigne une représentation façonnée, notamment par taille ou sculpture. « Statue sculptée » conserve l’aspect matériel sans employer le terme archaïque « image taillée » ni réduire d’emblée le mot à « idole ».
- source_word: וַיִּסְגָּד לָמוֹ
  choice: et se prosterne devant elle[a]
  rationale: Le singulier féminin reprend naturellement « une statue » en français. La forme pronominale hébraïque לָמוֹ est toutefois formellement plurielle ou poétique et cette particularité est signalée en note.
theological_decisions:
- issue: Langage de fabrication de l’objet de culte
  choice: en fait aussi un dieu… en fait une statue sculptée
  alternative: fabrique une idole… façonne une image taillée
  rationale: La distinction entre אֵל (« dieu ») et פֶסֶל (« statue/image sculptée ») est maintenue afin de préserver l’ironie du texte sans uniformiser les deux termes sous « idole ».
- issue: Référence pronominale de לָמוֹ
  choice: devant elle, avec une note sur la forme hébraïque
  alternative: devant eux
  rationale: Le français exige normalement l’accord avec le référent immédiat singulier, « une statue ». La note conserve cependant la donnée formelle du pluriel hébreu et les possibilités qu’elle ouvre, sans imposer une explication unique.
- issue: Valeur générique de אָדָם
  choice: l’homme
  alternative: un être humain / quelqu’un
  rationale: Le singulier générique « l’homme » correspond à la forme hébraïque et demeure intelligible dans ce contexte descriptif.
translation_notes:
  register: Français international moderne, courant et digne. La ponctuation met en relief l’enchaînement ironique des usages du même bois. Les répétitions de « fait » et « se prosterne » sont conservées parce qu’elles structurent la rhétorique hébraïque.
