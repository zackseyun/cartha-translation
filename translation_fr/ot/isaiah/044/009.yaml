source:
  edition: WLC
  text: יֹֽצְרֵי פֶ֤סֶל כֻּלָּ/ם֙ תֹּ֔הוּ וַ/חֲמוּדֵי/הֶ֖ם בַּל יוֹעִ֑ילוּ וְ/עֵדֵי/הֶ֣ם הֵׄ֗מָּׄהׄ בַּל יִרְא֛וּ וּ/בַל יֵדְע֖וּ לְמַ֥עַן יֵבֹֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
translation:
  language: fr
  text: Tous ceux qui façonnent une idole ne valent rien[a], et les objets qui leur sont chers ne servent à rien[b]. Leurs témoins eux-mêmes[c] ne voient rien et ne savent rien, de sorte qu’ils seront couverts de honte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont tous néant », « sont tous vanité » ou « sont tous vides ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « leurs choses désirables »; autre traduction possible : « leurs objets précieux ». Il s’agit vraisemblablement des idoles ou des objets cultuels auxquels ils tiennent.'
    reason: lexical_alternative
  - marker: c
    text: « Leurs témoins » peut désigner les adorateurs qui témoignent en faveur des idoles ou, par ironie, les idoles elles-mêmes.
    reason: alternative_reading
  - marker: d
    text: Ou « afin qu’ils soient couverts de honte » ou « afin qu’ils aient honte ». L’expression hébraïque peut marquer le résultat ou le but.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל
  choice: ceux qui façonnent une idole
  rationale: Le participe de יצר exprime l’action de former ou de façonner, et פֶסֶל désigne une image taillée, couramment une idole. Cette formulation reste concrète et naturelle en français.
- source_word: כֻּלָּם
  choice: Tous ceux qui
  rationale: L’idée de totalité est placée naturellement en tête de la proposition française, sans conserver l’ordre plus lourd « les façonneurs d’une idole, eux tous ».
- source_word: תֹּהוּ
  choice: ne valent rien
  rationale: Dans ce contexte polémique, תֹּהוּ exprime la vacuité et l’absence de valeur ou d’efficacité, non le chaos primordial. « Ne valent rien » restitue cette portée sans suggérer nécessairement une non-existence métaphysique.
- source_word: וַחֲמוּדֵיהֶם
  choice: les objets qui leur sont chers
  rationale: Le terme issu de חמד désigne ce qui est désirable, précieux ou chéri. « Les objets qui leur sont chers » conserve la dimension affective tout en laissant le référent — les idoles ou objets cultuels — implicite.
- source_word: בַּל יוֹעִילוּ
  choice: ne servent à rien
  rationale: La forme verbale signifie procurer un avantage, être utile ou profitable. Cette tournure française actuelle exprime clairement leur complète inutilité.
- source_word: וְעֵדֵיהֶם הֵמָּה
  choice: Leurs témoins eux-mêmes
  rationale: « Leurs témoins » maintient la relation possessive et l’ambiguïté du référent; « eux-mêmes » rend l’insistance du pronom הֵמָּה sans alourdir excessivement la phrase.
- source_word: בַּל יִרְאוּ וּבַל יֵדְעוּ
  choice: ne voient rien et ne savent rien
  rationale: La répétition de בַּל nie séparément les deux facultés. La construction parallèle en français conserve l’accusation de cécité et d’ignorance.
- source_word: לְמַעַן יֵבֹשׁוּ
  choice: de sorte qu’ils seront couverts de honte
  rationale: לְמַעַן peut introduire un but ou un résultat. Ici, « de sorte que » présente la honte comme l’aboutissement de leur aveuglement, tandis que la note conserve l’autre possibilité.
theological_decisions:
- issue: Référent de « leurs témoins »
  choice: La traduction ne précise pas si les témoins sont les adorateurs qui témoignent en faveur des idoles ou, par ironie, les idoles elles-mêmes.
  alternative: Identifier explicitement les témoins soit aux fabricants et adorateurs, soit aux idoles.
  rationale: Les verbes « voir » et « savoir » peuvent dénoncer l’ignorance des idolâtres ou l’insensibilité des idoles. Garder « leurs témoins » préserve la tension rhétorique de l’hébreu.
- issue: Portée de תֹּהוּ
  choice: 'Une déclaration de nullité et d’inutilité pratique : « ne valent rien ».'
  alternative: « sont néant », « sont vanité » ou « sont vides ».
  rationale: Le contexte condamne la fabrication des idoles comme vaine et sans profit. La traduction évite d’imposer au texte une affirmation métaphysique plus précise.
- issue: Valeur de לְמַעַן devant יֵבֹשׁוּ
  choice: 'Conséquence : « de sorte qu’ils seront couverts de honte ».'
  alternative: 'But : « afin qu’ils soient couverts de honte » ou nuance modale : « pour qu’ils aient honte ».'
  rationale: La préposition peut exprimer le but ou le résultat. Le contexte permet de comprendre que l’absence de vue et de connaissance aboutira à la honte, mais la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et digne. « Façonnent » garde le caractère artisanal de l’acte; « ne valent rien » et « ne servent à rien » rendent le parallélisme polémique dans une langue immédiatement compréhensible. Les reprises de « rien » sont volontaires et donnent au verset sa force accusatrice.
