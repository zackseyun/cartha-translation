id: ISA.44.25
reference: Isaiah 44:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: fr
  text: qui réduit à néant les signes des menteurs[a], rend fous les devins, fait reculer les sages et tourne leur savoir en folie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des diseurs de faussetés »; le terme hébreu peut désigner ceux qui profèrent des paroles mensongères ou vides.'
    reason: Signale la nuance lexicale de בַּדִּים sans imposer une identification plus précise que le texte.
lexical_decisions:
- source_word: מֵפֵר
  choice: réduit à néant
  rationale: Exprime l’action d’annuler, de déjouer ou de rendre sans effet, dans un français naturel et soutenu.
- source_word: בַּדִּים
  choice: menteurs
  rationale: Dans ce contexte polémique, le terme désigne ceux qui profèrent des paroles fausses ou vides; « menteurs » suit le sens contextuel le plus probable sans préciser indûment leur fonction.
- source_word: אֹתוֹת
  choice: signes
  rationale: Conserve le terme général hébreu, qui peut ici viser les signes ou prédictions invoqués par les prétendus révélateurs.
- source_word: יְהוֹלֵל
  choice: rend fous
  rationale: Le verbe signifie faire agir en insensé ou faire perdre la raison; cette formulation garde la vigueur du parallélisme.
- source_word: מֵשִׁיב ... אָחוֹר
  choice: fait reculer
  rationale: Reproduit l’image littérale d’un retour en arrière, qui peut impliquer la défaite ou la confusion.
- source_word: יְשַׂכֵּל
  choice: tourne ... en folie
  rationale: Rend le contraste délibéré entre le savoir des sages et l’état de sottise auquel Dieu le réduit.
theological_decisions:
- issue: Identité des בַּדִּים
  choice: menteurs
  alternative: vantards / diseurs de faussetés
  rationale: Le texte condamne leurs prétentions comme fausses, mais ne les identifie pas explicitement à une catégorie religieuse ou institutionnelle précise.
- issue: Nature des « signes »
  choice: signes
  alternative: présages / prédictions
  rationale: Le terme hébreu reste général; le traduire par « signes » préserve l’ambiguïté tout en laissant le contexte des devins orienter la lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale est conservée pour s’intégrer à la série décrivant l’action de Dieu dans le contexte immédiat; la virgule finale indique que la phrase se poursuit au verset suivant.
