  source_fidelity: 'La structure et les images du texte hébreu sont bien rendues : il se nourrit de cendres, son cœur trompé l’a détourné, et il est incapable de se délivrer ou de reconnaître la fausseté de ce qu’il tient. Toutefois, הִטָּהוּ est un accompli (« l’a égaré / détourné »), non un présent (« l’égare »). « Dire » est plus direct et plus fidèle que « se dire », le réfléchi n’étant pas exprimé par l’hébreu.'
  naturalness: « Se nourrit de cendres » est plus courant en français international moderne que « se repaît de cendres », tout en conservant la métaphore. La phrase révisée reste soutenue et accessible.
  terminology: « Cœur », « cendres », « se délivrer lui-même », « mensonge » et « main droite » rendent adéquatement les termes hébreux. Le choix de « lui-même » pour נֶפֶשׁ est contextuellement juste et évite une précision anthropologique indue.
