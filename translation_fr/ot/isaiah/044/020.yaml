source:
  edition: WLC
  text: רֹעֶ֣ה אֵ֔פֶר לֵ֥ב הוּתַ֖ל הִטָּ֑/הוּ וְ/לֹֽא יַצִּ֤יל אֶת נַפְשׁ/וֹ֙ וְ/לֹ֣א יֹאמַ֔ר הֲ/ל֥וֹא שֶׁ֖קֶר בִּ/ימִינִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/020.yaml
  text: He feeds on ashes[a]; a deceived heart has led him astray, and he cannot deliver himself or say[b], “Is there not a lie in my right hand?”
translation:
  language: fr
  text: 'Il se nourrit de cendres[a] ; un cœur trompé l’a égaré, et il ne peut se délivrer lui-même[b] ni dire : « N’y a-t-il pas un mensonge dans ma main droite ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il broute des cendres. » L’hébreu conserve de manière frappante l’image de quelqu’un qui paît ou se nourrit.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « délivrer sa נֶפֶשׁ ». Selon le contexte, ce mot peut désigner la personne elle-même, sa vie ou son âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: se repaît de
  rationale: Le participe de רעה évoque l’action de paître ou de se nourrir. « Se repaît de » conserve cette image concrète tout en restant naturel dans ce contexte métaphorique.
- source_word: אֵפֶר
  choice: cendres
  rationale: Le nom désigne normalement les cendres ; il s’accorde avec la satire du bois brûlé et suggère ici ce qui est vide et sans valeur.
- source_word: לֵב הוּתַל
  choice: un cœur trompé
  rationale: « Cœur » préserve le terme anthropologique hébreu, qui englobe pensée, volonté et disposition intérieure. « Trompé » maintient l’état de duperie exprimé par la forme passive.
- source_word: הִטָּהוּ
  choice: l’égare
  rationale: La forme causative de נטה indique que ce cœur le détourne du vrai chemin. « L’égare » exprime clairement cette déviation sans surcharger la phrase.
- source_word: וְלֹא יַצִּיל אֶת נַפְשׁוֹ
  choice: Il ne peut se délivrer lui-même
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne ou sa vie plutôt qu’une âme immatérielle envisagée techniquement. La tournure réflexive rend naturellement l’incapacité de l’idolâtre à se sauver.
- source_word: וְלֹא יֹאמַר
  choice: ni se dire
  rationale: Après la première proposition négative, « ni » restitue naturellement la coordination. Le réfléchi « se dire » fait ressortir l’examen intérieur impliqué par la question citée.
- source_word: הֲלוֹא
  choice: N’y a-t-il pas
  rationale: Cette formulation conserve la question rhétorique qui attend une réponse affirmative.
- source_word: שֶׁקֶר
  choice: un mensonge
  rationale: Le nom désigne la fausseté ou une chose trompeuse. « Un mensonge » garde la force concise de l’accusation portée contre l’idole.
- source_word: בִּימִינִי
  choice: dans ma main droite
  rationale: La traduction littérale préserve l’image frappante de l’objet idolâtré tenu par son fabricant, ainsi que la première personne du discours cité.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: lui-même
  alternative: sa vie ; son âme
  rationale: Le passage vise l’incapacité de l’idolâtre à sauver sa propre personne de son égarement. « Lui-même » rend l’idiome hébreu sans imposer une définition doctrinale plus étroite de l’âme.
- issue: Agent de l’égarement
  choice: un cœur trompé l’égare
  alternative: son cœur abusé l’a détourné
  rationale: 'La formulation conserve la tension du texte : le cœur est lui-même trompé tout en devenant ce qui égare l’homme. Elle évite de préciser un agent extérieur que le verset ne nomme pas.'
translation_notes:
  register: Français international moderne, digne et accessible. « Se repaît de cendres » conserve la vigueur poétique de la métaphore ; la ponctuation en deux phrases clarifie le mouvement du verset sans effacer ses coordinations ni sa question rhétorique.
