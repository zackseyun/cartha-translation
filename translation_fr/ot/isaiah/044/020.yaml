  to: 'Il se nourrit de cendres[a] ; un cœur trompé l’a égaré, et il ne peut se délivrer lui-même[b] ni dire : « N’y a-t-il pas un mensonge dans ma main droite ? »'
  rationale: La révision restitue l’accompli de הִטָּהוּ par « l’a égaré », évite le réfléchi non exprimé de « se dire » et adopte « se nourrit de », formulation naturelle qui préserve l’image du participe רֹעֶה. Les ancres et le contenu des notes sont maintenus.
