base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
translation:
  language: fr
  text: 'Et avec ce qui reste du bois, il en fait un dieu, son image sculptée[a]. Il se prosterne devant elle, l’adore et la prie en disant : « Délivre-moi, car tu es mon dieu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son idole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  choice: Et avec ce qui reste du bois
  rationale: שְׁאֵרִית désigne le reste; le suffixe renvoie au bois mentionné dans le contexte. « du bois » explicite naturellement le référent sans changer le sens.
- source_word: לְאֵל עָשָׂה
  choice: il fait un dieu
  rationale: La préposition לְ marque ici le résultat ou la destination de l’action; le présent convient à cette description vivante d’un comportement typique.
- source_word: לְפִסְלוֹ
  choice: une statue sculptée
  rationale: פֶסֶל désigne une représentation façonnée, particulièrement par sculpture. Cette expression garde le caractère concret du terme, tandis que « idole » reste une autre traduction possible.
- source_word: יִסְגּוֹד לוֹ
  choice: Il se prosterne devant elle
  rationale: סגד exprime la prosternation en signe d’hommage ou de culte; cette traduction conserve le geste physique.
- source_word: וְיִשְׁתַּחוּ
  choice: l’adore
  rationale: שׁחה peut désigner la prosternation et, dans ce contexte cultuel, l’adoration. « l’adore » évite une répétition française maladroite tout en conservant la portée religieuse.
- source_word: וְיִתְפַּלֵּל אֵלָיו
  choice: et la prie
  rationale: התפלל אל signifie prier ou adresser une prière à quelqu’un. Le féminin renvoie naturellement en français à « statue ».
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif de נצל demande d’être arraché au danger ou délivré; « Délivre-moi » garde la force de l’appel et l’ironie du contexte.
- source_word: כִּי אֵלִי אָתָּה
  choice: car tu es mon dieu
  rationale: כִּי introduit le motif de la demande, et אֵלִי signifie « mon dieu ».
theological_decisions:
- issue: Genre grammatical et référent de l’objet idolâtre
  choice: Employer « elle / la » en accord avec « statue »
  alternative: Employer « lui / le » pour refléter les formes masculines de l’hébreu ou choisir « idole », également féminin en français
  rationale: Les formes masculines de l’hébreu relèvent de l’accord avec אֵל et פֶסֶל et n’établissent pas la personnalité réelle de l’objet. Le français exige un accord naturel avec le nom choisi; la parole directe conserve néanmoins « tu », comme dans l’hébreu.
- issue: Relation entre « dieu » et « statue sculptée »
  choice: Conserver les deux désignations en apposition
  alternative: Fusionner en « une idole »
  rationale: Le texte juxtapose לְאֵל et לְפִסְלוֹ, soulignant que l’artisan traite comme dieu l’objet qu’il a lui-même sculpté. La formulation retenue préserve cette tension satirique.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent rend la scène de manière vivante; la succession « se prosterne, adore et prie » préserve l’accumulation rhétorique de l’hébreu.
