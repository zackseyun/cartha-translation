  terminology: « Dieu », « image sculptée », « se prosterne », « adore », « prie » et « Délivre-moi » rendent convenablement les termes hébreux et l’accumulation cultuelle. Le féminin des pronoms est naturel avec « image » et ne prétend pas reproduire le genre grammatical masculin de l’hébreu.
