  to: L’artisan du bois tend un cordeau ; il en trace les contours avec une pointe à tracer ; il le façonne avec des rabots[a] et en trace les contours au compas. Il en fait une figure à l’image d’un homme, belle comme un être humain, pour qu’elle demeure dans une maison.
  rationale: La révision rétablit explicitement les deux comparaisons du texte hébreu tout en gardant une phrase française fluide. Le pronom féminin final renvoie sans ambiguïté à « figure » et maintient l’ironie de l’image fabriquée destinée à demeurer dans une maison. La note existante est conservée, car elle encadre correctement l’incertitude concernant les outils de façonnage.
