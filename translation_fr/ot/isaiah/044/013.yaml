  terminology: « Artisan du bois », « cordeau » et « compas » conviennent. « Pointe à tracer » est un peu plus idiomatique et précis que « une pointe » pour un instrument, sans résoudre indûment l’incertitude de שֶׂרֶד. « Rabots » demeure défendable avec la note sur l’incertitude des outils.
