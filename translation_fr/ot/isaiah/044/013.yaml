  text: חָרַ֣שׁ עֵצִים֮ נָ֣טָה קָו֒ יְתָאֲרֵ֣/הוּ בַ/שֶּׂ֔רֶד יַעֲשֵׂ֨/הוּ֙ בַּ/מַּקְצֻע֔וֹת וּ/בַ/מְּחוּגָ֖ה יְתָאֳרֵ֑/הוּ וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּ/תַבְנִ֣ית אִ֔ישׁ כְּ/תִפְאֶ֥רֶת אָדָ֖ם לָ/שֶׁ֥בֶת בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
translation:
  language: fr
  text: L’artisan du bois tend un cordeau ; il en trace les contours avec une pointe à tracer ; il le façonne avec des rabots[a] et en trace les contours au compas. Il en fait une figure à l’image d’un homme, belle comme un être humain, pour qu’elle demeure dans une maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des outils tranchants ». Le terme hébreu désigne probablement des outils servant à façonner le bois, mais leur nature exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  choice: l’artisan du bois
  rationale: La construction désigne un artisan travaillant le bois. Cette expression garde le matériau explicite sans réduire son métier à la menuiserie ou à la charpenterie.
- source_word: נָטָה קָו
  choice: tend un cordeau
  rationale: L’expression décrit l’action de déployer une ligne servant à mesurer ou à tracer ; « cordeau » est naturel dans un contexte d’atelier.
- source_word: יְתָאֲרֵהוּ
  choice: en trace les contours
  rationale: Le verbe évoque la délinéation ou l’esquisse de l’objet. Cette formulation rend clairement le geste sans préciser indûment la technique.
- source_word: בַשֶּׂרֶד
  choice: avec une pointe
  rationale: Le terme désigne vraisemblablement un instrument servant à tracer, mais son identification exacte demeure incertaine. « Pointe » conserve l’image d’un outil de marquage sans imposer une matière précise.
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  choice: il le façonne avec des rabots
  rationale: Le pluriel désigne probablement des outils de travail du bois, souvent compris comme des rabots ou des instruments tranchants. Le choix concret de « rabots » est accompagné d’une note signalant l’incertitude.
- source_word: וּבַמְּחוּגָה
  choice: au compas
  rationale: Le mot désigne un instrument permettant de tracer des cercles ou des arcs ; « compas » est l’équivalent français courant.
- source_word: כְּתַבְנִית אִישׁ
  choice: la forme d’un homme
  rationale: תַּבְנִית signifie forme, modèle ou configuration. « La forme d’un homme » préserve la comparaison concrète et le singulier masculin אִישׁ.
- source_word: כְּתִפְאֶרֶת אָדָם
  choice: la beauté d’un être humain
  rationale: תִּפְאֶרֶת peut exprimer la beauté, la splendeur ou l’ornement. אָדָם est ici générique ; « être humain » maintient le contraste entre l’idole et l’humanité sans en faire le nom propre Adam.
- source_word: לָשֶׁבֶת בָּיִת
  choice: pour qu’il demeure dans une maison
  rationale: יָשַׁב peut signifier s’asseoir, habiter ou demeurer. « Demeurer » préserve la légère personnification ironique de l’objet fabriqué, tandis que « maison » traduit directement בַּיִת sans l’interpréter nécessairement comme un sanctuaire.
theological_decisions:
- issue: Sens générique de אָדָם
  choice: un être humain
  alternative: un homme ; l’humanité
  rationale: Dans ce parallèle avec אִישׁ, le terme décrit l’apparence humaine de l’idole plutôt que l’humanité collective ou le personnage Adam. La formulation retenue préserve le générique singulier.
- issue: Portée de לָשֶׁבֶת בָּיִת
  choice: demeurer dans une maison
  alternative: être placé dans une maison ; siéger dans un sanctuaire
  rationale: Le texte peut suggérer l’installation d’une idole dans un bâtiment ou un sanctuaire, mais il dit littéralement « maison ». La traduction conserve à la fois cette généralité et l’ironie d’un objet censé demeurer quelque part.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire concret de l’atelier est conservé, de même que la répétition du geste de traçage et l’ironie discrète d’une figure fabriquée qui « demeure » dans une maison.
