source:
  edition: WLC
  text: כֹּה אָמַ֨ר יְהוָ֥ה עֹשֶׂ֛/ךָ וְ/יֹצֶרְ/ךָ֥ מִ/בֶּ֖טֶן יַעְזְרֶ֑/ךָּ אַל תִּירָא֙ עַבְדִּ֣/י יַֽעֲקֹ֔ב וִ/ישֻׁר֖וּן בָּחַ֥רְתִּי בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
translation:
  language: fr
  text: 'Ainsi parle Yahvé, celui qui t’a fait et qui t’a façonné dans le sein maternel, celui qui te secourra : « N’aie pas peur, Jacob, mon serviteur, Yeshouroun[a], que j’ai choisi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeshouroun est un nom poétique donné à Israël ; il signifie probablement « celui qui est droit ».
    reason: Signaler le sens lexical probable d’un nom poétique conservé par transcription.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue d’un titre tel que « le Seigneur » et préserve sa fonction dans l’alliance.
- source_word: עֹשֶׂךָ
  choice: celui qui t’a fait
  rationale: Le participe substantivé désigne Dieu comme celui qui a fait Israël. Cette formulation naturelle conserve l’action personnelle exprimée par le verbe.
- source_word: וְיֹצֶרְךָ
  choice: et qui t’a façonné
  rationale: Le verbe יצר évoque une formation intentionnelle, comme le travail d’un potier, et reste distinct du verbe plus général « faire ».
- source_word: מִבֶּטֶן
  choice: dès le sein maternel
  rationale: Cette expression conserve l’image de l’origine dans le ventre maternel tout en étant naturelle et digne en français.
- source_word: יַעְזְרֶךָּ
  choice: celui qui te secourra
  rationale: L’imparfait hébreu peut ici exprimer l’action à venir de Dieu. « Secourir » rend l’idée d’aide promise dans ce contexte de réconfort.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Formulation idiomatique moderne de la défense hébraïque, adressée à un interlocuteur singulier.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans cette désignation d’Israël, « serviteur » exprime l’appartenance et le service envers Dieu sans imposer l’image sociale plus étroite de l’esclavage.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle du nom, employé ici pour personnifier collectivement Israël.
- source_word: וִישֻׁרוּן
  choice: Yeshouroun
  rationale: Transcription moderne de ce nom poétique d’Israël; son sens probable est indiqué en note plutôt que substitué au nom dans le texte.
- source_word: בָּחַרְתִּי בוֹ
  choice: que j’ai choisi
  rationale: La proposition relative rend naturellement le parfait hébreu et son pronom objet, dont l’antécédent est le destinataire personnifié par Jacob et Yeshouroun.
theological_decisions:
- issue: Pronoms singuliers dans une adresse collective à Israël
  choice: Conserver le singulier (« t’ », « te », « n’aie ») avec Jacob et Yeshouroun comme désignations du destinataire.
  alternative: Employer un pluriel ou expliciter « Israël ».
  rationale: L’hébreu s’adresse au peuple comme à une personne singulière. Garder ce trait préserve la personnification prophétique et la portée collective sans l’expliciter excessivement.
- issue: Interprétation de יְשֻׁרוּן
  choice: Garder « Yeshouroun » dans le texte et signaler son sens probable en note.
  alternative: Traduire directement par « celui qui est droit » ou « le peuple droit ».
  rationale: Le terme fonctionne comme un nom poétique d’Israël. La transcription évite de réduire le nom à une seule étymologie tout en permettant d’en éclairer la nuance.
- issue: Valeur temporelle de יַעְזְרֶךָּ
  choice: 'Employer le futur : « te secourra ».'
  alternative: 'Employer le présent : « te secourt » ou une désignation nominale : « ton secours ».'
  rationale: Dans l’annonce de réconfort, l’inaccompli hébreu se prête à une promesse future, sans exclure que l’aide caractérise durablement Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « celui qui » maintient la structure descriptive de l’hébreu; « façonné » conserve l’image d’une formation intentionnelle. Le discours direct est marqué par des guillemets français pour faciliter la lecture.
