source:
  edition: WLC
  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
translation:
  language: fr
  text: Voici, tous ceux qui lui sont associés seront couverts de honte ; les artisans ne sont que des êtres humains[a]. Qu’ils se rassemblent tous et se présentent ! Ils seront saisis de peur et, tous ensemble, couverts de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne sont que des humains ». L’hébreu porte littéralement une expression du type « [issus] de l’humain » ; elle souligne que les fabricants d’idoles sont seulement humains, et non divins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Marque ici une affirmation emphatique attirant l’attention, dans un registre naturel et digne.
- source_word: כָּל חֲבֵרָיו
  choice: tous ceux qui lui sont associés
  rationale: Conserve l’association avec l’idole ou son fabricant sans préciser indûment la nature du groupe.
- source_word: יֵבֹשׁוּ
  choice: seront couverts de honte
  rationale: Exprime le résultat public et judiciaire de la honte, tout en permettant la reprise en fin de verset.
- source_word: וְחָרָשִׁים
  choice: les artisans
  rationale: Terme assez large pour désigner les ouvriers qualifiés qui fabriquent les idoles, sans les limiter aux forgerons.
- source_word: הֵמָּה מֵאָדָם
  choice: ne sont que des êtres humains
  rationale: Rend explicitement le contraste entre leur simple condition humaine et toute prétention divine.
- source_word: יִתְקַבְּצוּ כֻלָּם
  choice: Qu’ils se rassemblent tous
  rationale: L’imparfait prend dans ce contexte une valeur de défi ou de sommation ; la formulation est idiomatique en français moderne.
- source_word: יַעֲמֹדוּ
  choice: se présentent
  rationale: Dans cette scène de confrontation, le verbe évoque le fait de prendre position et de comparaître, plutôt que la seule posture physique.
- source_word: יִפְחֲדוּ
  choice: seront saisis de peur
  rationale: Traduit fortement mais naturellement la réaction de crainte annoncée.
- source_word: יָחַד
  choice: tous ensemble
  rationale: Souligne leur sort collectif commun.
theological_decisions:
- issue: Portée de מֵאָדָם dans le contraste entre les fabricants et la divinité
  choice: ne sont que des êtres humains
  alternative: sont issus de l’humanité
  rationale: Le contexte insiste sur le caractère purement humain des artisans. La traduction retenue conserve ce contraste sans introduire de distinction de genre ni résoudre au-delà du texte l’identité précise de l’antécédent de « lui ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme de la honte est conservé, ainsi que le ton de sommation des deux verbes centraux. Le pronom « lui » maintient l’ambiguïté contextuelle de l’hébreu quant à son référent exact.
