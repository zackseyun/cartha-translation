source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ גֹּאֲלֶ֔/ךָ וְ/יֹצֶרְ/ךָ֖ מִ/בָּ֑טֶן אָנֹכִ֤י יְהוָה֙ עֹ֣שֶׂה כֹּ֔ל נֹטֶ֤ה שָׁמַ֨יִם֙ לְ/בַדִּ֔/י רֹקַ֥ע הָ/אָ֖רֶץ מי את/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, ton rédempteur, celui qui t’a façonné dès le ventre maternel : « Moi, je suis Yahweh, celui qui fait toutes choses, qui seul déploie les cieux et étend la terre par moi-même[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon une autre analyse des derniers mots hébreux, « qui était avec moi ? » Dans les deux cas, le verset affirme que Yahweh a créé sans aucune aide.
    reason: Lecture alternative d’une expression hébraïque textuellement et syntaxiquement difficile.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: גֹּאֲלֶךָ
  choice: ton rédempteur
  rationale: « Rédempteur » conserve l’idée de délivrance et les résonances relationnelles de גאל sans préciser excessivement « proche parent ».
- source_word: וְיֹצֶרְךָ
  choice: celui qui t’a façonné
  rationale: « Façonner » restitue l’image artisanale du verbe יצר et s’emploie naturellement pour l’action créatrice de Dieu.
- source_word: מִבָּטֶן
  choice: dès le ventre maternel
  rationale: Cette formulation garde l’image prénatale explicite du texte hébreu tout en étant claire en français moderne.
- source_word: עֹשֶׂה כֹּל
  choice: celui qui fait toutes choses
  rationale: La formulation rend la portée universelle de כֹּל et conserve la valeur descriptive du participe.
- source_word: נֹטֶה שָׁמַיִם
  choice: qui seul a déployé les cieux
  rationale: « Déployer » exprime naturellement l’image cosmique d’étendre les cieux; « seul » rend לְבַדִּי et souligne l’action sans auxiliaire.
- source_word: רֹקַע הָאָרֶץ
  choice: qui a étendu la terre
  rationale: רקע évoque une surface étalée ou déployée; « étendre » transmet cette image sans imposer la métaphore plus technique du martelage.
- source_word: מי אתי / מֵאִתִּי
  choice: par lui-même
  rationale: La fin consonantique et sa syntaxe sont difficiles. Le texte principal exprime l’action créatrice sans aide, tandis que l’autre analyse possible est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie le nom propre divin. Le conserver distingue le nom révélé d’un simple titre.
- issue: Action exclusive de Yahweh dans la création
  choice: « qui seul… par lui-même »
  alternative: « qui était avec moi ? »
  rationale: Le texte hébreu final est difficile. Le corps du verset rend son affirmation manifeste de l’action créatrice exclusive de Yahweh, tandis que la note préserve l’autre analyse syntaxique possible sans effacer l’incertitude.
translation_notes:
  register: Français international moderne, digne et accessible. La structure déclarative solennelle est conservée; « ventre maternel » évite l’ambiguïté de « ventre » seul, et la note maintient l’incertitude réelle de la fin hébraïque.
