  to: 'Ainsi parle Yahweh, ton rédempteur, celui qui t’a façonné dès le ventre maternel : « Moi, je suis Yahweh, celui qui fait toutes choses, qui seul déploie les cieux et étend la terre par moi-même[a]. »'
  rationale: La révision remplace « par lui-même » par « par moi-même » afin de conserver la première personne du locuteur divin et de mieux refléter l’expression finale difficile. Les verbes de création passent au présent pour rendre plus directement les participes descriptifs de l’hébreu. La note est conservée, car elle préserve l’ambiguïté textuelle réelle.
