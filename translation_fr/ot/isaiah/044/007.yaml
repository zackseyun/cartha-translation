  source_fidelity: 'Le sens général est fidèlement rendu : défi rhétorique, déclaration et mise en ordre, établissement d’un peuple ancien, puis annonce de réalités à venir. Toutefois, עַם est indéfini ; « le peuple d’autrefois » introduit une détermination absente de l’hébreu. « Un peuple d’autrefois » conserve mieux cette indétermination tout en gardant la lecture temporelle retenue.'
  naturalness: Le français est actuel et soutenu. « Qu’il appelle » sans complément reste cependant peu naturel et ambigu en français moderne ; « Qu’il proclame » rend de manière idiomatique l’appel public impliqué par יקרא dans ce défi, sans ajouter de référent. La succession des subjonctifs maintient bien la force provocatrice.
  terminology: « Établir » convient pour שׂוּם dans ce contexte. « Un peuple d’autrefois » rend עַם עוֹלָם sans imposer le sens de perpétuité ; la note préserve cette possibilité. « Événements à venir » est contextuellement défendable pour אֹתִיּוֹת, avec « signes » conservé en note.
  issues:
