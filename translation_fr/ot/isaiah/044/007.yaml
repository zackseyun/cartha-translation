  text: וּ/מִֽי כָמ֣וֹ/נִי יִקְרָ֗א וְ/יַגִּידֶ֤/הָ וְ/יַעְרְכֶ֨/הָ֙ לִ֔/י מִ/שּׂוּמִ֖/י עַם עוֹלָ֑ם וְ/אֹתִיּ֛וֹת וַ/אֲשֶׁ֥ר תָּבֹ֖אנָה יַגִּ֥ידוּ לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
translation:
  language: fr
  text: Et qui est comme moi ? Qu’il proclame, qu’il annonce cela et me l’expose dans l’ordre, depuis que j’ai établi un peuple d’autrefois[a] ! Qu’ils leur annoncent les événements à venir[b], et ce qui arrivera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis que j’ai établi un peuple ancien » ; on peut aussi comprendre « un peuple éternel ». Le mot hébreu peut évoquer aussi bien un passé lointain que la perpétuité.
    reason: lexical_alternative
  - marker: b
    text: Ou « les signes ». Le terme hébreu peut être compris comme désignant des signes ou des marques, mais le parallélisme avec « ce qui arrivera » favorise ici les événements futurs.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  choice: Et qui est comme moi ?
  rationale: La question rhétorique et la conjonction qui la relie au discours précédent sont conservées dans une formulation française directe.
- source_word: יִקְרָא
  choice: Qu’il appelle
  rationale: L’imparfait hébreu a ici une valeur d’invitation provocatrice ou de défi ; le subjonctif français rend cette nuance jussive sans préciser indûment l’objet de l’appel.
- source_word: וְיַגִּידֶהָ
  choice: qu’il annonce cela
  rationale: Le hiphil de נגד signifie faire connaître ou annoncer. « Cela » représente naturellement en français le complément pronominal féminin dont l’antécédent reste implicite en hébreu.
- source_word: וְיַעְרְכֶהָ לִי
  choice: et me l’expose dans l’ordre
  rationale: ערך exprime l’idée d’ordonner ou de disposer. Cette formulation conserve à la fois l’organisation méthodique et le complément לִי, tout en restant idiomatique.
- source_word: מִשּׂוּמִי עַם עוֹלָם
  choice: depuis que j’ai établi le peuple d’autrefois
  rationale: מן avec l’infinitif construit reçoit ici un sens temporel. שׂים est rendu par « établir », et עולם par l’ancienneté, ce qui convient au défi fondé sur la maîtrise divine de l’histoire.
- source_word: וְאֹתִיּוֹת
  choice: les événements à venir
  rationale: Dans son parallélisme avec וַאֲשֶׁר תָּבֹאנָה, le terme désigne vraisemblablement des réalités futures. La traduction principale exprime ce sens contextuel, tandis qu’une note conserve l’autre analyse possible, « les signes ».
- source_word: וַאֲשֶׁר תָּבֹאנָה
  choice: et ce qui arrivera
  rationale: La proposition relative au féminin pluriel vise ce qui viendra ou se produira. Cette formulation française évite une répétition lourde sans effacer le second membre du parallélisme.
- source_word: יַגִּידוּ לָמוֹ
  choice: Qu’ils leur annoncent
  rationale: Les formes de troisième personne du pluriel sont maintenues, malgré leurs référents implicites et la formulation comprimée de l’hébreu.
theological_decisions:
- issue: Sens de עַם עוֹלָם
  choice: le peuple d’autrefois
  alternative: un peuple éternel
  rationale: Dans ce contexte, עולם peut renvoyer à l’antiquité plutôt qu’à la perpétuité. La traduction retient le sens historique sans introduire une affirmation doctrinale sur le statut éternel du peuple.
- issue: Sens de וְאֹתִיּוֹת
  choice: les événements à venir
  alternative: les signes
  rationale: Le parallélisme immédiat avec « ce qui arrivera » favorise une référence générale aux réalités futures. L’autre analyse lexicale demeure explicitement signalée en note.
- issue: Référents de יַגִּידוּ לָמוֹ
  choice: maintien de « ils » et « leur » sans explicitation
  alternative: identifier les sujets comme les divinités rivales et les destinataires comme leurs fidèles
  rationale: L’hébreu laisse les référents implicites. Les préciser dans le corps du texte résoudrait une ambiguïté que le verset conserve.
translation_notes:
  register: Français international actuel, digne et accessible. Le défi rhétorique demeure vif ; les pronoms dont les référents sont implicites en hébreu ne sont pas développés dans le texte. Les deux notes rendent visibles les principales ambiguïtés lexicales sans alourdir le verset.
