    issue: Détermination ajoutée à « le peuple d’autrefois »
    rationale: L’hébreu עַם ne porte pas d’article. Bien que le contexte puisse évoquer Israël, le texte ne l’identifie pas explicitement ici ; « un peuple d’autrefois » préserve donc mieux la formulation source.
  - severity: low
    issue: « Qu’il appelle » est elliptique et peu idiomatique
    rationale: Le verbe français appeler appelle normalement un complément ou une construction réflexive dans ce sens. « Qu’il proclame » exprime naturellement l’appel/proclamation publique de יקרא dans le contexte polémique.
