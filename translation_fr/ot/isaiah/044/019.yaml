base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/019.yaml
  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
translation:
  language: fr
  text: 'Il ne réfléchit pas ; il n’a ni connaissance ni intelligence pour se dire : « J’en ai brûlé la moitié au feu ; j’ai même fait cuire du pain sur ses braises, j’ai rôti de la viande et je l’ai mangée. Vais-je faire de ce qui en reste une abomination ? Vais-je me prosterner devant un simple morceau de bois[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une bûche » ou « un bloc de bois » ; l’expression hébraïque est méprisante et souligne que l’idole n’est rien de plus que du bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׁיב אֶל לִבּוֹ
  choice: se met à réfléchir
  rationale: L’expression hébraïque signifie ramener quelque chose à son cœur, donc l’examiner intérieurement. Cette formulation française naturelle exprime la réflexion sans suggérer principalement une réaction affective.
- source_word: דַעַת וְלֹא תְבוּנָה
  choice: ni connaissance ni intelligence
  rationale: 'Les deux noms restent distincts : דַעַת désigne la connaissance, tandis que תְבוּנָה évoque l’intelligence ou le discernement.'
- source_word: חֶצְיוֹ
  choice: la moitié
  rationale: Le suffixe renvoie au bois mentionné dans le contexte ; « j’en ai brûlé la moitié » rend ce lien clairement.
- source_word: בְמוֹ אֵשׁ
  choice: au feu
  rationale: Cette tournure idiomatique convient à la scène concrète où le bois est brûlé comme combustible.
- source_word: וְאַף אָפִיתִי
  choice: j’ai même fait cuire
  rationale: אַף ajoute ici une nuance cumulative et emphatique, bien rendue par « même ».
- source_word: עַל גֶּחָלָיו
  choice: sur ses braises
  rationale: 'Le suffixe renvoie naturellement au bois consumé : le pain est cuit sur les braises qu’il a produites.'
- source_word: לֶחֶם
  choice: du pain
  rationale: Le terme concret « pain » est conservé plutôt que généralisé en « nourriture ».
- source_word: אֶצְלֶה בָשָׂר
  choice: j’ai rôti de la viande
  rationale: צלה désigne la cuisson de viande par exposition au feu ; « rôtir » est précis et naturel.
- source_word: וְיִתְרוֹ
  choice: ce qui en reste
  rationale: Cette expression française marque clairement le contraste avec la moitié déjà brûlée.
- source_word: לְתוֹעֵבָה
  choice: une chose abominable
  rationale: Le choix conserve la forte réprobation religieuse de תוֹעֵבָה sans identifier explicitement l’objet par un terme absent de cette proposition.
- source_word: לְבוּל עֵץ
  choice: un simple morceau de bois
  rationale: La formulation souligne avec mépris que l’objet adoré n’est rien de plus que du bois, tout en restant naturelle en français.
theological_decisions:
- issue: Préserver la dérision prophétique envers l’objet idolâtre
  choice: un simple morceau de bois
  alternative: une bûche ; un bloc de bois
  rationale: 'L’ajout idiomatique de « simple » fait ressortir le contraste théologique du texte : le même bois sert d’abord de combustible, puis son reste reçoit un culte. La formulation ne précise ni la forme ni la taille que l’hébreu laisse ouvertes.'
- issue: Valeur interrogative des deux dernières propositions
  choice: deux questions délibératives
  alternative: deux affirmations décrivant ce que l’homme fait
  rationale: Le contexte et la formulation soutiennent le raisonnement que l’homme devrait tenir en lui-même. Les questions rendent le caractère absurde de son geste sans supprimer la nuance délibérative des formes hébraïques.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme accumulatif de l’hébreu est conservé dans le discours intérieur, tandis que la ponctuation française distingue nettement le constat initial, les usages ordinaires du bois et les deux questions finales.
