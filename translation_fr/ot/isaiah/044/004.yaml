  text: וְ/צָמְח֖וּ בְּ/בֵ֣ין חָצִ֑יר כַּ/עֲרָבִ֖ים עַל יִבְלֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/004.yaml
  text: And they will spring up among the grass like willows by streams of water[a].
translation:
  language: fr
  text: Ils pousseront au milieu de l’herbe, comme des saules au bord des cours d’eau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des peupliers au bord des cours d’eau ». Le mot hébreu עֲרָבִים est généralement traduit par « saules », mais il pourrait désigner plus largement un arbre riverain de type peuplier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָמְחוּ
  choice: Ils pousseront
  rationale: Le qal de צמח évoque la croissance ou la germination végétale. « pousseront » rend naturellement en français l’apparition vigoureuse suggérée par l’image, tout en conservant la valeur future.
- source_word: בְּבֵין
  choice: au milieu de
  rationale: La préposition signifie littéralement « entre », mais devant un collectif comme « herbe », « au milieu de » exprime plus naturellement la situation spatiale.
- source_word: חָצִיר
  choice: l’herbe
  rationale: חָצִיר désigne couramment l’herbe ou la végétation herbacée. Le singulier collectif français « l’herbe » convient à l’image.
- source_word: כַּעֲרָבִים
  choice: comme des saules
  rationale: עֲרָבִים est traditionnellement identifié aux saules, arbres associés aux lieux humides. L’identification botanique n’étant pas entièrement certaine, « peupliers » est signalé en note.
- source_word: עַל
  choice: au bord de
  rationale: Dans cette description de végétaux situés près de l’eau, עַל a une valeur locative que « au bord de » rend de façon idiomatique et précise.
- source_word: יִבְלֵי מָיִם
  choice: des cours d’eau
  rationale: L’expression désigne des chenaux ou courants d’eau. « cours d’eau » conserve l’idée de voies d’eau et le pluriel, dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le parallélisme végétal et l’image de croissance abondante près de l’eau, sans préciser dans ce verset seul l’antécédent du pronom « ils ».
