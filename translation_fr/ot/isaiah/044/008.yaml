  variant: modern international French
source:
  edition: WLC
  text: אַֽל תִּפְחֲדוּ֙ וְ/אַל תִּרְה֔וּ הֲ/לֹ֥א מֵ/אָ֛ז הִשְׁמַעְתִּ֥י/ךָ וְ/הִגַּ֖דְתִּי וְ/אַתֶּ֣ם עֵדָ֑/י הֲ/יֵ֤שׁ אֱל֨וֹהַּ֙ מִ/בַּלְעָדַ֔/י וְ/אֵ֥ין צ֖וּר בַּל יָדָֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
translation:
  language: fr
  text: 'N’ayez pas peur et ne tremblez pas.[a] Ne te l’ai-je pas fait entendre et annoncé depuis longtemps ?[b] Vous êtes mes témoins. Y a-t-il un Dieu en dehors de moi ? Il n’y a pas de Rocher[c] : je n’en connais aucun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « N’ayez pas peur et ne soyez pas terrifiés. » Le second verbe est rare et peut renforcer la première interdiction.
    reason: lexical_alternative
  - marker: b
    text: Ou « Ne te l’ai-je pas fait entendre et annoncé dès les temps anciens ? »
    reason: lexical_alternative
  - marker: c
    text: « Rocher » est ici un titre donné à Dieu, qui souligne sa stabilité et sa fiabilité ; on peut aussi écrire « rocher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְחֲדוּ
  choice: ayez peur
  rationale: Le verbe פחד exprime la peur ou l’effroi. Dans une interdiction, « N’ayez pas peur » est direct, naturel et fidèle.
- source_word: תִּרְהוּ
  choice: tremblez
  rationale: Cette forme rare est généralement comprise comme un second verbe de crainte qui renforce le premier. « Tremblez » conserve le parallélisme poétique sans préciser excessivement son sens.
- source_word: מֵאָז
  choice: depuis longtemps
  rationale: L’expression renvoie à un temps antérieur. « Depuis longtemps » est idiomatique en français moderne et garde la portée rétrospective de l’affirmation.
- source_word: הִשְׁמַעְתִּיךָ
  choice: je te l’ai fait entendre
  rationale: Le hiphil de שמע avec suffixe masculin singulier exprime une action causative. Cette formulation préserve à la fois ce sens et le passage du groupe interpellé au singulier collectif.
- source_word: וְהִגַּדְתִּי
  choice: je l’ai annoncé
  rationale: Le verbe נגד signifie faire connaître ou proclamer. « Annoncé » rend clairement cette idée dans un registre digne et courant.
- source_word: עֵדָי
  choice: mes témoins
  rationale: Le nom est au pluriel avec suffixe de première personne. Le choix maintient le motif juridique du témoignage et l’adresse collective.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Dans cette question rhétorique sur l’unicité divine, « Dieu » désigne une véritable divinité éventuelle autre que le Dieu qui parle; la majuscule soutient cette portée sans ajouter une précision absente du texte.
- source_word: מִבַּלְעָדַי
  choice: en dehors de moi
  rationale: L’expression marque l’exclusion. « En dehors de moi » est naturel et conserve l’affirmation d’exclusivité.
- source_word: צוּר
  choice: Rocher
  rationale: Le terme fonctionne ici comme un titre métaphorique de Dieu, évoquant sa stabilité et sa fiabilité. La majuscule rend visible cet emploi titulaire.
- source_word: בַּל יָדָעְתִּי
  choice: je n’en connais aucun
  rationale: Cette formulation idiomatique restitue la négation catégorique et reprend naturellement « Rocher ».
theological_decisions:
- issue: Exclusivité divine dans la question rhétorique
  choice: '« Y a-t-il un Dieu en dehors de moi ? Il n’y a pas de Rocher : je n’en connais aucun. »'
  alternative: Employer « dieu » avec une minuscule pour mettre davantage l’accent sur la catégorie des divinités.
  rationale: Le contexte affirme l’unicité du Dieu d’Israël face aux idoles. La question et la réponse forment une négation absolue de toute autre divinité véritable.
- issue: Emploi de צוּר comme titre divin
  choice: Écrire « Rocher » avec une majuscule.
  alternative: Écrire « rocher » avec une minuscule.
  rationale: Dans ce contexte, le mot est une désignation métaphorique de Dieu plutôt qu’un simple élément matériel. La majuscule signale discrètement cette fonction sans supprimer la métaphore.
- issue: Alternance entre destinataire singulier et pluriel
  choice: Conserver « te » dans la question, puis « vous » dans « Vous êtes mes témoins ».
  alternative: Uniformiser tout le verset au pluriel pour une lecture française plus lisse.
  rationale: L’hébreu passe d’interdictions au pluriel à un suffixe singulier, puis revient au pluriel. Cette alternance peut refléter Israël envisagé à la fois collectivement et comme communauté; la préserver évite d’effacer une tension réelle du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme bref des prohibitions et des questions est conservé. L’alternance hébraïque entre le singulier collectif (« te ») et le pluriel communautaire (« vous ») demeure visible, malgré sa légère aspérité en français.
