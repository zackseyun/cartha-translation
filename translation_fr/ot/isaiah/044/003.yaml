source:
  edition: WLC
  text: כִּ֤י אֶצָּק מַ֨יִם֙ עַל צָמֵ֔א וְ/נֹזְלִ֖ים עַל יַבָּשָׁ֑ה אֶצֹּ֤ק רוּחִ/י֙ עַל זַרְעֶ֔/ךָ וּ/בִרְכָתִ֖/י עַל צֶאֱצָאֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
translation:
  language: fr
  text: Car je verserai de l’eau sur la terre assoiffée[a] et des ruisseaux[b] sur le sol desséché ; je répandrai mon Esprit[c] sur ta descendance et ma bénédiction sur tes descendants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur celui qui a soif ». L’hébreu emploie simplement « assoiffé », mais le parallèle avec « le sol desséché » favorise ici le sens de « terre assoiffée ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « des choses qui coulent » ; on pourrait aussi traduire « des eaux qui coulent ».
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi signifier « souffle » ou « vent » ; dans ce contexte de bénédiction accordée à la descendance, « Esprit » paraît le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la promesse précédente et conserve naturellement la valeur causale ou explicative.
- source_word: אֶצָּק / אֶצֹּק (יצק)
  choice: je verserai / je répandrai
  rationale: Le verbe décrit l’action de verser. « Verser » convient à l’eau, tandis que « répandre » exprime naturellement en français la même image avec l’Esprit.
- source_word: צָמֵא
  choice: la terre assoiffée
  rationale: L’hébreu porte littéralement l’adjectif « assoiffé ». Le parallèle avec le sol desséché favorise un paysage, mais l’ajout de « terre » reste explicité par une note.
- source_word: וְנֹזְלִים
  choice: des eaux ruisselantes
  rationale: Le terme signifie littéralement « ce qui coule ». Cette formulation conserve davantage l’image verbale que « ruisseaux », sans préciser indûment la forme des cours d’eau.
- source_word: יַבָּשָׁה
  choice: le sol desséché
  rationale: Rend l’idée de terre sèche dans un français naturel et maintient le parallélisme avec la terre assoiffée.
- source_word: רוּחִי
  choice: mon Esprit
  rationale: Dans cette promesse de bénédiction accordée aux générations futures, « Esprit » est le sens contextuel le plus probable, tout en signalant les autres sens possibles en note.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: Le nom signifie littéralement « semence », mais désigne collectivement la postérité ; « descendance » est clair et naturel.
- source_word: וּבִרְכָתִי
  choice: et ma bénédiction
  rationale: Correspond au sens usuel du nom et conserve toute l’ampleur de la faveur divine.
- source_word: צֶאֱצָאֶיךָ
  choice: ceux qui sont issus de toi
  rationale: Rend la postérité tout en distinguant ce membre parallèle de « ta descendance », sans effacer la synonymie poétique.
theological_decisions:
- issue: Sens de רוּחִי dans cette promesse
  choice: mon Esprit
  alternative: mon souffle / mon vent
  rationale: Le parallélisme entre l’Esprit et la bénédiction, appliqués à la descendance, favorise la présence vivifiante de Dieu. La note préserve néanmoins la polysémie du terme hébreu.
- issue: Référent de צָמֵא
  choice: la terre assoiffée
  alternative: l’assoiffé / celui qui a soif
  rationale: Le parallèle immédiat avec « le sol desséché » favorise la lecture environnementale, sans éliminer silencieusement la possibilité grammaticale d’un référent personnel.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé, avec un point-virgule marquant le passage de l’image de l’eau à son application à la descendance.
