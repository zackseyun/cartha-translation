source:
  edition: WLC
  text: לֹ֥א יָדְע֖וּ וְ/לֹ֣א יָבִ֑ינוּ כִּ֣י טַ֤ח מֵֽ/רְאוֹת֙ עֵֽינֵי/הֶ֔ם מֵ/הַשְׂכִּ֖יל לִבֹּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
translation:
  language: fr
  text: Ils ne savent pas et ne comprennent pas, car on a enduit leurs yeux pour les empêcher de voir, et leurs cœurs pour les empêcher de comprendre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une image concrète : les yeux et les cœurs sont « enduits » ou « recouverts ». Le cœur y est le siège de la pensée et du discernement, et pas seulement des émotions. Le sujet du verbe « a enduit » est implicite en hébreu (à la troisième personne masculine du singulier) ; le texte ne nomme pas l’agent.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: יָדְעוּ
  choice: ils ne savent rien
  rationale: Le parfait qal nié exprime ici un constat général. L’ajout idiomatique de « rien » rend naturellement en français la négation absolue du contexte.
- source_word: יָבִינוּ
  choice: ne comprennent rien
  rationale: בין désigne la compréhension ou le discernement. « Comprendre » forme un couple naturel avec « savoir ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de leur ignorance; « car » conserve le lien explicatif dans un registre digne et courant.
- source_word: טַח
  choice: on a enduit
  rationale: Le verbe évoque concrètement l’action d’enduire ou de recouvrir. Cette traduction préserve l’image sans la réduire à l’interprétation « aveugler ».
- source_word: מֵרְאוֹת עֵינֵיהֶם
  choice: leurs yeux, de sorte qu’ils ne voient pas
  rationale: מִן avec l’infinitif exprime ici l’empêchement. Cette formulation est plus naturelle en français que « leurs yeux de voir ».
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  choice: leur cœur, de sorte qu’ils ne discernent pas
  rationale: השׂכיל renvoie à l’intelligence et au discernement. Le singulier collectif « leur cœur » est idiomatique en français tout en conservant l’anthropologie hébraïque.
- source_word: לִבֹּתָם
  choice: leur cœur
  rationale: Dans l’hébreu biblique, le cœur est aussi le siège de la pensée et du jugement, non seulement des émotions.
theological_decisions:
- issue: Sujet implicite de טַח
  choice: on a enduit
  alternative: il a enduit; leurs yeux sont enduits
  rationale: Le verbe hébreu est à la troisième personne masculine du singulier, mais son sujet n’est pas nommé. Le « on » français laisse l’agent indéterminé plutôt que de l’identifier silencieusement à Dieu, à l’artisan ou à un autre sujet.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore concrète de l’enduit est conservée; l’agent demeure volontairement indéterminé. La répétition « de sorte que » explicite naturellement en français la construction hébraïque d’empêchement.
