  text: הָ/אֹמֵ֥ר לַ/צּוּלָ֖ה חֳרָ֑בִי וְ/נַהֲרֹתַ֖יִ/ךְ אוֹבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/027.yaml
  text: who says to the deep[a], ‘Be dry, and I will dry up your rivers,’
translation:
  language: fr
  text: 'qui dit à l’abîme[a] : « Sois à sec ! J’assécherai tes fleuves. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux profondeurs ». Le terme hébreu désigne la profondeur aquatique.
    reason: 'Alternative lexicale : le nom hébreu, au singulier, peut aussi évoquer les profondeurs aquatiques.'
lexical_decisions:
- source_word: הָאֹמֵר
  choice: qui dit
  rationale: Le participe avec article a une valeur substantivée et poursuit la description commencée dans le contexte précédent. « qui dit » conserve naturellement cette continuité en français.
- source_word: לַצּוּלָה
  choice: aux eaux profondes
  rationale: צּוּלָה désigne la profondeur ou les profondeurs, particulièrement la masse d’eau profonde. « eaux profondes » rend clairement cette image en français moderne sans la réduire à la mer.
- source_word: חֳרָבִי
  choice: Tarissez-vous !
  rationale: L’impératif féminin singulier s’adresse à צּוּלָה. Le verbe « se tarir » exprime idiomatiquement l’assèchement d’une étendue d’eau; le pluriel grammatical s’accorde avec « eaux profondes ».
- source_word: וְנַהֲרֹתַיִךְ
  choice: vos fleuves
  rationale: נְהָרוֹת est le pluriel de « fleuve/rivière », avec un suffixe féminin singulier renvoyant à la profondeur aquatique personnifiée. « fleuves » convient à l’ampleur poétique de l’image.
- source_word: אוֹבִישׁ
  choice: Je mettrai … à sec
  rationale: Le hifil inaccompli à la première personne exprime ici l’action causative annoncée par Dieu. « mettre à sec » est une formulation française naturelle et directe.
theological_decisions:
- issue: Identité du locuteur et lien avec le contexte précédent
  choice: Conserver la proposition relative « qui dit » sans ajouter de sujet explicite dans ce verset.
  alternative: Ajouter « le Seigneur » ou « l’Éternel » comme sujet explicite d’après le contexte.
  rationale: Le texte hébreu dépend syntaxiquement de la description de Dieu dans les versets précédents. Ne pas expliciter le sujet préserve l’enchaînement littéraire et évite d’ajouter des mots absents du verset.
translation_notes:
  register: Français international moderne, courant et digne. La personnification des eaux est conservée, ainsi que la dépendance syntaxique envers le contexte précédent.
