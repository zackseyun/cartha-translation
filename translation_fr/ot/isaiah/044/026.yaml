source:
  edition: WLC
  text: מֵקִים֙ דְּבַ֣ר עַבְדּ֔/וֹ וַ/עֲצַ֥ת מַלְאָכָ֖י/ו יַשְׁלִ֑ים הָ/אֹמֵ֨ר לִ/ירוּשָׁלִַ֜ם תּוּשָׁ֗ב וּ/לְ/עָרֵ֤י יְהוּדָה֙ תִּבָּנֶ֔ינָה וְ/חָרְבוֹתֶ֖י/הָ אֲקוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
translation:
  language: fr
  text: 'qui confirme la parole de son serviteur et accomplit le dessein de ses messagers[a], qui dit de Jérusalem : « Elle sera habitée », et des villes de Juda : « Elles seront rebâties », et : « Je relèverai ses ruines. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses anges » ; le mot hébreu peut désigner des messagers humains ou célestes. Ici, il s’agit probablement d’agents prophétiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: confirme
  rationale: Le participe hiphil de קום, avec « parole » pour complément, signifie faire tenir ou rendre effective cette parole. « Confirme » exprime naturellement en français sa validation par l’accomplissement.
- source_word: דְּבַר עַבְדּוֹ
  choice: la parole de son serviteur
  rationale: « Parole » conserve la formulation prophétique et le singulier « serviteur » du texte hébreu sans en préciser l’identité.
- source_word: וַעֲצַת
  choice: et le dessein
  rationale: עֵצָה peut désigner un conseil, un projet ou un dessein. Ici, « dessein » s’associe naturellement à « accomplit » et rend l’idée d’une intention annoncée qui devient réalité.
- source_word: מַלְאָכָיו
  choice: de ses messagers[a]
  rationale: מַלְאָךְ peut désigner des envoyés humains ou des anges. Le parallélisme avec « son serviteur » et le contexte prophétique favorisent « messagers », tout en conservant l’autre possibilité en note.
- source_word: יַשְׁלִים
  choice: accomplit
  rationale: Le hiphil de שלם exprime ici le fait de mener à son terme ou de réaliser pleinement quelque chose.
- source_word: הָאֹמֵר
  choice: qui dit
  rationale: Le participe avec article décrit Dieu et poursuit naturellement la proposition relative commencée dans le contexte.
- source_word: לִירוּשָׁלִַם
  choice: de Jérusalem
  rationale: Bien que ל soit littéralement « à », « dire de Jérusalem » indique naturellement en français ce que Dieu déclare à son sujet.
- source_word: תּוּשָׁב
  choice: Elle sera habitée
  rationale: La forme féminine singulière présente Jérusalem comme une ville de nouveau peuplée. Le pronom « elle » conserve cette reprise grammaticale.
- source_word: וּלְעָרֵי יְהוּדָה
  choice: et des villes de Juda
  rationale: La préposition est rendue de façon idiomatique pour introduire la déclaration faite au sujet des villes.
- source_word: תִּבָּנֶינָה
  choice: Elles seront rebâties
  rationale: Le niphal signifie « être bâties »; dans cette annonce de restauration après la dévastation, « rebâties » restitue la valeur contextuelle sans modifier l’image.
- source_word: וְחָרְבוֹתֶיהָ
  choice: ses ruines
  rationale: חָרְבוֹת désigne les lieux ruinés ou dévastés. « Ruines » est concis, naturel et maintient le suffixe féminin singulier.
- source_word: אֲקוֹמֵם
  choice: Je relèverai
  rationale: Le polel de קום exprime ici l’action de faire se relever ou de restaurer. « Relèverai » conserve l’image de la remise debout et convient à des ruines.
theological_decisions:
- issue: Identité du « serviteur » et des « messagers »
  choice: La traduction conserve les désignations génériques et les nombres grammaticaux sans identifier leurs référents.
  alternative: Identifier le serviteur à Ésaïe et les messagers à un groupe précis de prophètes.
  rationale: Le verset ne nomme pas le serviteur et ne précise pas l’identité des messagers. Il convient donc de préserver cette ouverture interprétative.
- issue: Sens de מַלְאָכָיו
  choice: « ses messagers » dans le texte principal
  alternative: « ses anges »
  rationale: Le parallélisme prophétique rend vraisemblable le sens d’envoyés humains, mais le terme hébreu peut aussi désigner des êtres célestes; la note maintient cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure relative du passage et les images de restauration sont conservées; la ponctuation distingue clairement les trois déclarations divines.
