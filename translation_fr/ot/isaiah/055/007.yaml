source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
translation:
  language: fr
  text: 'Que le méchant abandonne sa voie,

    et l’homme injuste ses pensées[a] !


    Qu’il revienne à Yahweh[b], qui aura compassion de lui ;

    qu’il revienne à notre Dieu, car il pardonnera abondamment[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme d’iniquité » ; le mot traduit par « pensées » peut aussi désigner ses intentions ou ses projets.'
    reason: Précise la forme hébraïque et la gamme de sens sans alourdir le texte principal.
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH.
    reason: Signale que le texte emploie le nom personnel de Dieu.
  - marker: c
    text: 'Ou : « car il accordera largement son pardon ».'
    reason: Indique une autre manière naturelle de rendre l’expression hébraïque intensive.
lexical_decisions:
- source_word: יַעֲזֹב
  choice: abandonne
  rationale: Dans cette exhortation, le verbe exprime le renoncement volontaire à une conduite mauvaise ; « abandonner » en garde la force morale.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le nom masculin singulier désigne ici une personne caractérisée par sa méchanceté ; l’emploi substantivé français est naturel et conserve sa portée représentative.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: « Voie » préserve l’image hébraïque du chemin comme orientation et conduite de vie.
- source_word: אִישׁ אָוֶן
  choice: l’homme injuste
  rationale: Cette formulation rend naturellement en français une expression désignant un homme marqué par le mal ou l’iniquité, sans conserver le calque peu idiomatique « homme d’iniquité » dans le corps du texte.
- source_word: מַחְשְׁבֹתָיו
  choice: ses pensées
  rationale: Le terme peut désigner les pensées, les intentions ou les projets. « Pensées » maintient le contraste entre la disposition intérieure et la voie extérieure.
- source_word: וְיָשֹׁב
  choice: qu’il revienne
  rationale: Le verbe שׁוב décrit un retour vers Dieu. « Revenir » conserve cette image relationnelle sans la réduire au terme théologique « se repentir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וִירַחֲמֵהוּ
  choice: qui aura compassion de lui
  rationale: Le verbe רחם exprime une compassion miséricordieuse et personnelle. La proposition relative relie naturellement en français la compassion promise au retour vers Yahweh.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La forme possessive est conservée afin de respecter la voix communautaire du prophète.
- source_word: כִּי יַרְבֶּה לִסְלוֹחַ
  choice: car il pardonne abondamment
  rationale: La tournure avec רבה intensifie l’acte de pardonner. « Pardonne abondamment » en restitue directement l’idée sans le calque « multiplie pour pardonner ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le tétragramme, nom personnel de Dieu. « Yahweh » le rend explicitement au lieu de le remplacer par un titre traditionnel.
- issue: Portée de שׁוב
  choice: revienne
  alternative: se repente / retourne
  rationale: « Revienne » conserve le mouvement relationnel vers Dieu tout en laissant l’abandon de la voie et des pensées mauvaises exprimer le contenu concret de la repentance.
- issue: Rapport syntaxique de « et à notre Dieu »
  choice: coordonné à « revienne »
  alternative: répéter « qu’il revienne » avant « à notre Dieu »
  rationale: L’hébreu présente Yahweh et « notre Dieu » comme deux désignations parallèles du destinataire du retour, malgré l’insertion de la promesse de compassion. La coordination est conservée sans répéter artificiellement le verbe.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme poétique est maintenu sur quatre lignes. L’ellipse verbale dans « et l’homme injuste ses pensées » reste claire et donne à l’exhortation une concision solennelle ; la structure inhabituelle du second mouvement préserve la coordination hébraïque entre « à Yahweh » et « à notre Dieu ».
