  terminology: « Le méchant », « sa voie », « l’homme injuste », « ses pensées », « Yahweh » et « notre Dieu » conviennent au français international moderne. « Homme injuste » est une traduction naturelle de אִישׁ אָוֶן ; la note conserve à juste titre l’expression plus littérale « homme d’iniquité ».
