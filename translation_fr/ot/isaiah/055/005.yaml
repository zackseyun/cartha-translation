source:
  edition: WLC
  text: הֵ֣ן גּ֤וֹי לֹֽא תֵדַע֙ תִּקְרָ֔א וְ/ג֥וֹי לֹֽא יְדָע֖וּ/ךָ אֵלֶ֣י/ךָ יָר֑וּצוּ לְמַ֨עַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/005.yaml
  text: Behold[a], you will call a nation that you do not know, and a nation that did not know you will run to you, because of Yahweh your God, and the Holy One of Israel[c][b], for he has glorified you.
translation:
  language: fr
  text: Voici, tu appelleras une nation que tu ne connais pas, et une nation qui ne te connaissait pas accourra vers toi[a], à cause de Yahvé, ton Dieu, et du Saint d’Israël[b], car il t’a glorifié[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se hâtera vers toi » ou « courra vers toi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour l’amour de Yahvé, ton Dieu, et du Saint d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: Ou « t’a honoré », « t’a paré » ou « t’a donné de la splendeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Introduit avec force l’annonce prophétique tout en restant naturel et digne en français moderne.
- source_word: גּוֹי
  choice: nation
  rationale: Désigne ici un groupe humain constitué; « nation » conserve la portée générale de l’hébreu sans préciser qu’il s’agit de non-Israélites.
- source_word: לֹא תֵדַע
  choice: que tu ne connais pas
  rationale: L’imparfait hébreu s’intègre naturellement comme une caractéristique présente dans cette phrase orientée vers l’avenir.
- source_word: תִּקְרָא
  choice: tu appelleras
  rationale: Rend directement le sens courant de קרא et sa valeur future, sans renforcer inutilement en « convoquer ».
- source_word: לֹא יְדָעוּךָ
  choice: qui ne te connaissait pas
  rationale: Le parfait décrit une absence de relation antérieure par rapport à la venue future de la nation.
- source_word: אֵלֶיךָ יָרוּצוּ
  choice: accourra vers toi
  rationale: Le français emploie idiomatiquement le singulier avec le sujet collectif « une nation »; « accourir » restitue le mouvement rapide de רוץ.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Exprime clairement ici le motif de l’afflux de la nation, tout en laissant en note l’autre nuance possible de but ou d’intérêt.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la construction hébraïque avec le suffixe de deuxième personne du singulier.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: et du Saint d’Israël
  rationale: Conserve la coordination hébraïque et le titre traditionnel, sans effacer son lien appositionnel possible avec « Yahvé, ton Dieu ».
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français l’explication donnée par la dernière proposition.
- source_word: פֵאֲרָךְ
  choice: il t’a glorifié
  rationale: Dans ce contexte où l’honneur accordé par Dieu attire les nations, « glorifier » exprime la mise en honneur publique, tout en signalant les nuances concrètes possibles en note.
theological_decisions:
- issue: Référent des pronoms à la deuxième personne du singulier
  choice: Maintenir simplement « tu/te/toi » sans identifier explicitement l’interlocuteur.
  alternative: Préciser qu’il s’agit de Sion/Jérusalem, d’Israël ou d’une figure davidique.
  rationale: Le verset emploie le singulier mais ne tranche pas à lui seul l’identité exacte de l’interlocuteur; la traduction préserve donc cette tension interprétative.
- issue: Relation entre « Yahvé, ton Dieu » et « le Saint d’Israël »
  choice: Conserver la coordination « et du Saint d’Israël ».
  alternative: 'Rendre le second titre comme une apposition explicite: « c’est-à-dire le Saint d’Israël ».'
  rationale: Les deux désignations renvoient au même Dieu, mais la conjonction hébraïque est maintenue sans imposer une reformulation explicative absente du texte.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien du tutoiement singulier de l’hébreu. « Voici » garde la solennité prophétique sans archaïsme excessif; « accourra » restitue avec naturel l’image vive du mouvement rapide.
