source:
  edition: WLC
  text: ה֤וֹי כָּל צָמֵא֙ לְכ֣וּ לַ/מַּ֔יִם וַ/אֲשֶׁ֥ר אֵֽין ל֖/וֹ כָּ֑סֶף לְכ֤וּ שִׁבְרוּ֙ וֶֽ/אֱכֹ֔לוּ וּ/לְכ֣וּ שִׁבְר֗וּ בְּ/לוֹא כֶ֛סֶף וּ/בְ/ל֥וֹא מְחִ֖יר יַ֥יִן וְ/חָלָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/001.yaml
  text: Come[a], everyone who is thirsty, come to the waters; and he who has no money, come, buy and eat! Yes[b], come, buy wine and milk without money and without price.
translation:
  language: fr
  text: Venez[a], vous tous qui avez soif, venez vers les eaux ! Et vous qui n’avez pas d’argent[b], venez, achetez et mangez ! Venez, achetez du vin et du lait, sans argent et sans frais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Holà ! Vous tous qui avez soif, venez vers les eaux ! »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit au singulier masculin : « celui qui n’a pas d’argent », avec une portée générique.'
    reason: source_form
lexical_decisions:
- source_word: הוֹי
  choice: Venez
  rationale: Dans ce contexte, l’interjection introduit un appel pressant plutôt qu’une lamentation. L’intégrer à l’invitation par « Venez » donne un français actuel et naturel ; la forme plus littérale est signalée en note.
- source_word: כָּל צָמֵא
  choice: vous tous qui avez soif
  rationale: כָּל suivi de l’adjectif singulier a ici une portée collective. Cette formulation conserve à la fois l’universalité de l’appel et l’image concrète de la soif.
- source_word: לְכוּ
  choice: venez
  rationale: Bien que le verbe puisse littéralement signifier « allez », il exprime ici une invitation directe. « Venez » est idiomatique en français, et sa répétition rend l’insistance de l’hébreu.
- source_word: לַמַּיִם
  choice: vers les eaux
  rationale: Le pluriel hébreu est conservé afin de maintenir l’image poétique d’une eau abondante.
- source_word: וַאֲשֶׁר אֵין לוֹ כָּסֶף
  choice: Et vous qui n’avez pas d’argent
  rationale: Le singulier masculin hébreu a une portée représentative et générique. Le passage au « vous » collectif est naturel après l’appel universel et évite en français une formulation qui pourrait sembler limitée aux hommes ; la forme source est précisée en note.
- source_word: שִׁבְרוּ
  choice: achetez
  rationale: Dans un contexte d’approvisionnement alimentaire, le verbe signifie couramment « acheter ». Ce choix préserve le paradoxe délibéré d’un achat sans argent.
- source_word: וֶאֱכֹלוּ
  choice: et mangez
  rationale: La coordination simple des deux impératifs reproduit directement la suite hébraïque sans ajouter d’explication.
- source_word: בְּלוֹא כֶסֶף
  choice: sans argent
  rationale: Traduction directe et idiomatique qui maintient l’image économique du texte.
- source_word: וּבְלוֹא מְחִיר
  choice: et sans paiement
  rationale: מְחִיר désigne le prix ou la contrepartie. « Sans paiement » est naturel en français et garde le parallélisme avec « sans argent » sans recourir à l’expression moins idiomatique « sans prix ».
- source_word: יַיִן וְחָלָב
  choice: du vin et du lait
  rationale: Les réalités concrètes sont conservées afin de préserver l’image d’une provision riche et abondante, sans la remplacer par une interprétation spirituelle.
theological_decisions:
- issue: Portée du masculin singulier dans l’invitation
  choice: Rendre la portée générique par « vous qui n’avez pas d’argent » dans le texte principal.
  alternative: « celui qui n’a pas d’argent »
  rationale: L’hébreu emploie un masculin singulier grammatical à valeur représentative. En français moderne, le pluriel adressé à l’ensemble des auditeurs communique clairement cette portée sans restreindre l’invitation ; une note conserve l’information formelle.
- issue: Imagerie économique et alimentaire ou paraphrase spirituelle
  choice: Conserver les termes concrets « achetez », « vin » et « lait ».
  alternative: Expliciter dans le verset une offre gratuite de salut ou de bénédictions spirituelles.
  rationale: Le texte exprime son invitation théologique au moyen d’images concrètes de marché et de nourriture. Les conserver permet au lecteur d’entendre l’image et sa tension propres sans imposer une interprétation confessionnelle dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne, avec une cadence poétique soutenue par la répétition de « venez ». L’interjection archaïsante « Holà ! » est réservée à la note, tandis que le texte principal privilégie un appel naturel et pressant. Les images concrètes et le paradoxe d’un achat gratuit sont maintenus.
