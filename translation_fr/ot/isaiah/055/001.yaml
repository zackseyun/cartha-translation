  terminology: « Argent », « achetez », « mangez », « vin » et « lait » sont appropriés et n’ajoutent aucune spiritualisation. La note sur le singulier masculin générique est exacte. « Holà ! » convient comme équivalent formel signalé seulement en note, non dans le texte courant.
