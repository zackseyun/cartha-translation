source:
  edition: WLC
  text: תַּ֤חַת הַֽ/נַּעֲצוּץ֙ יַעֲלֶ֣ה בְר֔וֹשׁ תחת הַ/סִּרְפַּ֖ד יַעֲלֶ֣ה הֲדַ֑ס וְ/הָיָ֤ה לַֽ/יהוָה֙ לְ/שֵׁ֔ם לְ/א֥וֹת עוֹלָ֖ם לֹ֥א יִכָּרֵֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
translation:
  language: fr
  text: À la place du buisson épineux poussera le cyprès[a] ; à la place de la ronce[b] poussera le myrte. Cela sera pour Yahvé une renommée, un signe éternel qui ne sera pas retranché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sapin » ; l’espèce exacte désignée par le mot hébreu berosh est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « ortie » ou « buisson épineux » ; la plante exacte désignée par le mot hébreu sirpad est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte poétique de restauration, la préposition exprime la substitution plutôt qu’une position spatiale.
- source_word: הַנַּעֲצוּץ
  choice: le buisson épineux
  rationale: Le mot désigne une plante épineuse dont l’espèce exacte est incertaine ; ce rendu conserve l’image sans précision botanique excessive.
- source_word: בְרוֹשׁ
  choice: le cyprès
  rationale: L’identification précise est discutée, mais « cyprès » est un équivalent français courant évoquant un arbre persistant et majestueux.
- source_word: הַסִּרְפַּד
  choice: la ronce
  rationale: L’espèce est incertaine ; « ronce » désigne naturellement une végétation sauvage nuisible et maintient le parallélisme poétique.
- source_word: הֲדַס
  choice: le myrte
  rationale: Il s’agit de l’identification habituelle et solidement établie.
- source_word: וְהָיָה
  choice: cela vaudra… ce sera
  rationale: Le singulier résume vraisemblablement toute la transformation qui vient d’être décrite ; la reprise par « cela » l’explicite naturellement en français.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le tétragramme est rendu par le nom divin « Yahvé », et le lamed marque ici le bénéficiaire ou la référence de la renommée produite par cette transformation.
- source_word: לְשֵׁם
  choice: un nom
  rationale: Le rendu conserve l’expression hébraïque tout en signalant en note son sens idiomatique de renommée ou de mémorial.
- source_word: לְאוֹת עוֹלָם
  choice: un signe éternel
  rationale: Ce rendu naturel préserve la portée publique de אוֹת et la durée indéfinie exprimée par עוֹלָם.
- source_word: לֹא יִכָּרֵת
  choice: qui ne sera pas retranché
  rationale: « Retranché » conserve l’image littérale de la coupe et sa résonance possible avec les végétaux du verset, sans réduire le sens à « détruit ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahvé » transmet en français moderne le nom propre divin plutôt que de le remplacer par un titre.
- issue: Référent du singulier וְהָיָה
  choice: l’ensemble de la transformation décrite
  alternative: le myrte seul ou chacun des arbres
  rationale: Le singulier peut reprendre globalement le renouvellement annoncé. « Cela » préserve cette lecture collective sans attribuer arbitrairement le signe à un seul végétal.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme de substitution est maintenu, ainsi que l’image finale de la coupe dans « retranché ». Les incertitudes botaniques sont conservées en notes plutôt que résolues dans le corps du texte.
