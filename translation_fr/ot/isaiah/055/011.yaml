id: ISA.55.11
reference: Isaiah 55:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֵּ֣ן יִֽהְיֶ֤ה דְבָרִ/י֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/פִּ֔/י לֹֽא יָשׁ֥וּב אֵלַ֖/י רֵיקָ֑ם כִּ֤י אִם עָשָׂה֙ אֶת אֲשֶׁ֣ר חָפַ֔צְתִּי וְ/הִצְלִ֖יחַ אֲשֶׁ֥ר שְׁלַחְתִּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
translation:
  language: fr
  text: 'ainsi en sera-t-il de ma parole qui sort de ma bouche : elle ne reviendra pas à moi sans résultat[a], mais elle accomplira ce que je désire et mènera à bien ce pour quoi je l’ai envoyée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « vide » ; c’est-à-dire sans effet ou sans résultat.
    reason: lexical_alternative
  - marker: b
    text: Ou « et réussira dans la mission pour laquelle je l’ai envoyée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן יִהְיֶה
  choice: ainsi en sera-t-il
  rationale: Cette tournure relie clairement le verset à la comparaison précédente de la pluie et de la neige, tout en conservant la valeur future et comparative de l’hébreu.
- source_word: דְבָרִי
  choice: ma parole
  rationale: « Parole » garde l’étendue sémantique de דָּבָר et convient au contexte de la déclaration divine efficace, sans en faire explicitement un titre personnel.
- source_word: אֲשֶׁר יֵצֵא מִפִּי
  choice: qui sort de ma bouche
  rationale: La formulation conserve l’image concrète de la parole qui sort de la bouche de Dieu.
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  choice: elle ne reviendra pas à moi sans résultat
  rationale: Dans ce contexte, רֵיקָם signifie que la parole ne revient pas vide, c’est-à-dire sans avoir produit d’effet. « Sans résultat » exprime naturellement cette portée en français moderne.
- source_word: כִּי אִם
  choice: mais
  rationale: 'Après la négation, cette locution introduit un contraste fort : non pas sans résultat, mais en accomplissant la volonté divine.'
- source_word: עָשָׂה אֵת אֲשֶׁר חָפַצְתִּי
  choice: elle accomplira ce que je désire
  rationale: Le parfait hébreu exprime ici le résultat assuré de la mission. « Désire » préserve la notion de volonté ou de bon plaisir sans introduire le terme plus technique de décret.
- source_word: וְהִצְלִיחַ אֲשֶׁר שְׁלַחְתִּיו
  choice: et mènera à bien ce pour quoi je l’ai envoyée
  rationale: Le hifil de צלח porte l’idée de réussite. « Mener à bien » est idiomatique avec « parole » comme sujet et conserve l’idée d’une mission menée avec succès.
theological_decisions:
- issue: Personnification possible de « ma parole »
  choice: Présenter la parole comme la déclaration efficace de Dieu, sans en faire explicitement un titre personnel.
  alternative: Lire « la Parole » comme une désignation christologique du Fils préincarné.
  rationale: Dans le contexte immédiat d’Ésaïe 55, il s’agit de l’efficacité de la parole prononcée par Dieu, illustrée par la pluie et la neige. La traduction ne doit pas imposer une identification christologique que l’hébreu de ce verset n’exige pas.
- issue: Efficacité divine et réponse humaine
  choice: Affirmer avec le texte la certitude que la parole divine atteint l’intention de Dieu, sans ajouter de formulation déterministe.
  alternative: Paraphraser le verset en termes de décret irrésistible ou, à l’inverse, de simple persuasion.
  rationale: L’hébreu affirme que la parole ne revient pas sans effet et qu’elle réussit dans sa mission, mais il ne développe pas ici un système doctrinal concernant les modalités de cette efficacité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image poétique de la parole envoyée qui revient, tout en évitant l’archaïsme « à vide » et le langage confessionnel spécialisé.
