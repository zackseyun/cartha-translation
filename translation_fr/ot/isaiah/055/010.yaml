source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁ֣ר יֵרֵד֩ הַ/גֶּ֨שֶׁם וְ/הַ/שֶּׁ֜לֶג מִן הַ/שָּׁמַ֗יִם וְ/שָׁ֨מָּ/ה֙ לֹ֣א יָשׁ֔וּב כִּ֚י אִם הִרְוָ֣ה אֶת הָ/אָ֔רֶץ וְ/הוֹלִידָ֖/הּ וְ/הִצְמִיחָ֑/הּ וְ/נָ֤תַן זֶ֨רַע֙ לַ/זֹּרֵ֔עַ וְ/לֶ֖חֶם לָ/אֹכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
translation:
  language: fr
  text: Car, tout comme la pluie et la neige descendent du ciel[a] et n’y retournent pas sans avoir arrosé la terre, l’avoir rendue féconde et l’avoir fait germer[b], et sans avoir donné de la semence à celui qui sème et du pain à celui qui mange,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des cieux ». Le mot hébreu שָׁמַיִם a une forme plurielle et peut désigner le ciel ou les cieux selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’avoir fait produire et l’avoir fait pousser ». Les deux verbes associés soulignent la fécondité de la terre sous l’effet de la pluie et de la neige.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Car, tout comme
  rationale: « Car » conserve la valeur explicative de כִּי, tandis que « tout comme » introduit naturellement la comparaison développée au verset suivant.
- source_word: יֵרֵד
  choice: descendent
  rationale: Le verbe ירד exprime un mouvement vers le bas. « Descendent » convient à la pluie et à la neige tout en conservant ce sens directionnel.
- source_word: הַגֶּשֶׁם וְהַשֶּׁלֶג
  choice: la pluie et la neige
  rationale: Traduction directe et courante des deux noms concrets.
- source_word: מִן הַשָּׁמַיִם
  choice: du ciel
  rationale: Dans ce contexte météorologique, « du ciel » est la formulation française la plus naturelle; le pluriel formel de l’hébreu est signalé en note.
- source_word: וְשָׁמָּה לֹא יָשׁוּב
  choice: et n’y retournent pas
  rationale: Le pronom « y » rend שָׁמָּה (« là, à cet endroit »). Le pluriel français s’accorde naturellement avec le sujet composé « la pluie et la neige », malgré le singulier du verbe hébreu.
- source_word: כִּי אִם
  choice: sans avoir
  rationale: 'Dans la tournure négative, cette formulation exprime naturellement l’exception ou la condition préalable: elles ne retournent pas avant d’avoir produit les effets énumérés.'
- source_word: הִרְוָה אֶת הָאָרֶץ
  choice: avoir arrosé la terre
  rationale: Le hiphil de רוה signifie arroser, abreuver ou saturer. « Arroser la terre » est clair et naturel dans l’image agricole.
- source_word: וְהוֹלִידָהּ
  choice: l’avoir rendue féconde
  rationale: Le hiphil de ילד décrit ici le fait de rendre la terre productive. « Rendue féconde » conserve l’idée causative et l’image de la terre qui produit.
- source_word: וְהִצְמִיחָהּ
  choice: et l’avoir fait germer
  rationale: Le hiphil de צמח signifie faire germer ou pousser. Cette traduction maintient la distinction avec le verbe précédent et l’image végétale.
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ
  choice: et sans avoir donné de la semence à celui qui sème
  rationale: La formulation restitue l’image agricole concrète et le participe hébreu sans employer le mot plus spécialisé « semeur ».
- source_word: וְלֶחֶם לָאֹכֵל
  choice: et du pain à celui qui mange
  rationale: « Pain » conserve le sens concret de לֶחֶם et « celui qui mange » maintient le parallélisme avec « celui qui sème ».
