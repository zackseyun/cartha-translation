  text: הַטּ֤וּ אָזְנְ/כֶם֙ וּ/לְכ֣וּ אֵלַ֔/י שִׁמְע֖וּ וּ/תְחִ֣י נַפְשְׁ/כֶ֑ם וְ/אֶכְרְתָ֤ה לָ/כֶם֙ בְּרִ֣ית עוֹלָ֔ם חַֽסְדֵ֥י דָוִ֖ד הַ/נֶּאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
translation:
  language: fr
  text: 'Tendez l’oreille et venez à moi ; écoutez, et vous vivrez. Je conclurai avec vous une alliance éternelle : les bontés constantes promises à David.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les bontés fidèles accordées à David », « les grâces assurées de David ». Le mot hébreu peut désigner la bonté, la fidélité bienveillante ou l’amour loyal manifesté dans une alliance ; le rapport précis avec David reste condensé en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  choice: Tendez l’oreille
  rationale: Conserve la métaphore hébraïque de l’oreille tendue tout en employant une expression française naturelle qui appelle à une écoute attentive.
- source_word: וּלְכוּ אֵלַי
  choice: et venez à moi
  rationale: Dans cette invitation prononcée par le locuteur, « venez à moi » rend naturellement le mouvement vers celui qui parle.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: « Écoutez » exprime ici une réception attentive et potentiellement obéissante sans expliciter abusivement « obéissez ».
- source_word: וּתְחִי נַפְשְׁכֶם
  choice: afin que vous viviez
  rationale: נֶפֶשׁ désigne ici la personne ou la vie entière. Le français idiomatique « que vous viviez » restitue le sens global et la valeur résultative ou finale de la proposition, sans suggérer une opposition anthropologique entre l’âme et le corps.
- source_word: וְאֶכְרְתָה לָכֶם בְּרִית
  choice: Je conclurai avec vous une alliance
  rationale: « Conclure une alliance » est l’équivalent français naturel de l’idiome hébreu littéralement « couper une alliance ».
- source_word: בְּרִית עוֹלָם
  choice: une alliance éternelle
  rationale: Dans ce contexte d’alliance, עוֹלָם exprime une durée permanente ; « éternelle » est clair, digne et courant en français.
- source_word: חַסְדֵי דָוִד הַנֶּאֱמָנִים
  choice: les marques fidèles de bonté promises à David
  rationale: Le pluriel חַסְדֵי peut évoquer les manifestations de la bonté loyale de Dieu, tandis que הַנֶּאֱמָנִים souligne leur fiabilité. « Promises à David » explicite avec prudence la relation génitive la plus probable dans le contexte, tout en signalant en note d’autres rendus possibles.
theological_decisions:
- issue: Rapport entre l’alliance éternelle et חַסְדֵי דָוִד הַנֶּאֱמָנִים
  choice: La dernière expression désigne les manifestations fiables de la bonté d’alliance promise à David, désormais offertes aux auditeurs.
  alternative: « les bontés fidèles de David » ou « les grâces assurées accordées à David »
  rationale: Dieu promet ici une alliance aux auditeurs et la rattache à David. La formulation garde ce lien sans importer dans le verset une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme impératif de l’hébreu est conservé. « Afin que vous viviez » rend נֶפֶשׁ au sens de la personne entière plutôt que par le calque potentiellement trompeur « votre âme ».
