id: ISA.55.9
reference: Isaiah 55:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
translation:
  language: fr
  text: Car, autant les cieux[a] sont élevés au-dessus de la terre, autant mes voies sont élevées au-dessus de vos voies, et mes pensées[b] au-dessus de vos pensées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le ciel ». Le mot hébreu est de forme plurielle et se traduit traditionnellement par « les cieux ».
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « pensées » peut aussi signifier « projets » ou « intentions » dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement cette valeur causale en français.
- source_word: גָבְהוּ
  choice: sont élevés au-dessus de
  rationale: Le verbe exprime ici un état et, avec la préposition comparative מִן, une supériorité de hauteur plutôt qu’un mouvement ascendant.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Ce pluriel traditionnel convient au registre poétique et élevé du passage, sans exclure le sens concret de « ciel » ou « airs ».
- source_word: מֵאָרֶץ
  choice: au-dessus de la terre
  rationale: מִן marque ici la comparaison; cette formulation française exprime clairement la différence de hauteur.
- source_word: כֵּן
  choice: autant… autant
  rationale: Cette construction française rend avec fluidité la correspondance analogique entre la hauteur des cieux et la supériorité des voies et pensées divines.
- source_word: דְרָכַי
  choice: mes voies
  rationale: Conserve la métaphore hébraïque de la voie, qui peut désigner la conduite ou la manière d’agir.
- source_word: מִדַּרְכֵיכֶם
  choice: au-dessus de vos voies
  rationale: Maintient le parallélisme et rend la valeur comparative de מִן.
- source_word: וּמַחְשְׁבֹתַי
  choice: et mes pensées
  rationale: « Pensées » préserve l’ampleur sémantique du terme, qui peut aussi désigner des projets ou des intentions, et assure le lien lexical avec le verset 8.
- source_word: מִמַּחְשְׁבֹתֵיכֶם
  choice: au-dessus de vos pensées
  rationale: Rend la comparaison tout en conservant le parallélisme poétique entre Dieu et les destinataires.
theological_decisions:
- issue: Comparaison anthropomorphique entre les voies et pensées de Dieu et celles des humains
  choice: Conserver directement « mes voies » et « mes pensées »
  alternative: Expliciter par « ma manière d’agir » et « mes projets »
  rationale: Les métaphores originales expriment la transcendance divine sans définir trop étroitement la nature de l’action ou de la pensée de Dieu; les préserver maintient la force poétique et la tension théologique.
translation_notes:
  register: Français international moderne, digne et poétique. La structure corrélative « autant… autant » restitue naturellement l’analogie hébraïque, tandis que l’ellipse de « sont élevées » dans le dernier membre conserve le parallélisme et la concision du vers.
