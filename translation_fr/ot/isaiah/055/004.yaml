  text: הֵ֛ן עֵ֥ד לְאוּמִּ֖ים נְתַתִּ֑י/ו נָגִ֥יד וּ/מְצַוֵּ֖ה לְאֻמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/004.yaml
  text: Behold[a], I have made him a witness to the peoples[c][b], a leader and commander for the peoples.
translation:
  language: fr
  text: Voici, je l’ai[a] établi[b] comme témoin auprès des peuples[c], comme chef et commandant des peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom renvoie probablement à David ou à un représentant de la lignée de David dans ce contexte ; certains y voient une référence messianique.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « je l’ai donné ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Cette particule attire solennellement l’attention. « Voici » conserve la force prophétique tout en restant naturel dans un registre biblique moderne.
- source_word: עֵד
  choice: témoin
  rationale: Le nom désigne ici une personne qui rend témoignage, et non le témoignage comme notion abstraite.
- source_word: לְאוּמִּים
  choice: pour les peuples
  rationale: La préposition ל exprime la relation de fonction envers les groupes concernés. « Peuples » préserve le pluriel collectif et ethnique du terme hébreu.
- source_word: נְתַתִּיו
  choice: je l’ai établi
  rationale: Le sens littéral est « je l’ai donné », mais, devant les fonctions « témoin », « chef » et « commandant », « établir » exprime naturellement en français l’idée de désignation, sans effacer l’alternative littérale signalée en note.
- source_word: נָגִיד
  choice: chef
  rationale: Le mot désigne une personne placée à la tête d’autres personnes. « Chef » reste large et n’impose ni le titre dynastique de « prince » ni la nuance plus absolue de « souverain ».
- source_word: וּמְצַוֵּה
  choice: commandant
  rationale: Le participe de צוה désigne celui qui donne des ordres. « Commandant » conserve cette idée de manière concise, en parallèle avec « chef », sans la spécialiser en « législateur ».
theological_decisions:
- issue: Référent du suffixe masculin singulier « lui »
  choice: Conserver le pronom sans nommer son référent dans le corps du texte.
  alternative: David lui-même, un représentant davidique ou messianique, ou Israël personnifié.
  rationale: Le contexte immédiat rappelle les promesses faites à David, mais le verset ne précise pas explicitement le référent. La traduction maintient donc l’ambiguïté du texte hébreu au lieu de la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « pour les peuples » reproduit le parallélisme hébreu. « Voici » maintient la solennité de l’appel à l’attention, tandis que « chef et commandant » conserve la structure appositive concise de l’original.
