base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/008.yaml
  text: For my thoughts are not your thoughts[a], and your ways are not my ways, declares Yahweh.
translation:
  language: fr
  text: Car mes pensées ne sont pas vos pensées[a], et vos voies ne sont pas mes voies, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car mes projets ne sont pas vos projets, et vos voies ne sont pas mes voies. » Le mot hébreu traduit par « pensées » peut aussi désigner des projets ou des intentions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’exhortation précédente et conserve naturellement la valeur justificative de la conjonction.
- source_word: מַחְשְׁבוֹתַי / מַחְשְׁבוֹתֵיכֶם
  choice: mes pensées / vos pensées
  rationale: « Pensées » préserve la répétition hébraïque et reste assez large pour inclure les projets et les intentions.
- source_word: דַרְכֵיכֶם / דְּרָכָי
  choice: vos voies / mes voies
  rationale: « Voies » conserve la métaphore et sa portée figurée, qui peut englober la conduite et la manière d’agir.
- source_word: לֹא ... וְלֹא
  choice: ne sont pas… et… ne sont pas
  rationale: La répétition de la négation et du verbe restitué préserve le parallélisme équilibré des deux propositions nominales.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule garde la solennité de la formule prophétique נְאֻם tout en restant intelligible en français courant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » en préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Portée de מַחְשָׁבוֹת
  choice: pensées, avec une note signalant « projets » et « intentions »
  alternative: projets
  rationale: Le terme hébreu peut désigner aussi bien les pensées que les projets ou intentions. Le texte principal conserve sa largeur sémantique, et la note évite de masquer l’autre nuance contextuellement possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition du texte hébreu sont conservés. Le tiret met en relief la formule prophétique finale sans en modifier le sens.
