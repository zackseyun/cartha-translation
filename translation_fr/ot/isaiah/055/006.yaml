source:
  edition: WLC
  text: דִּרְשׁ֥וּ יְהוָ֖ה בְּ/הִמָּצְא֑/וֹ קְרָאֻ֖/הוּ בִּֽ/הְיוֹת֥/וֹ קָרֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
translation:
  language: fr
  text: Cherchez Yahweh tant qu’il se laisse trouver[a] ; invoquez-le tant qu’il est proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tant qu’il peut être trouvé ».'
    reason: Alternative lexicale reflétant plus directement la forme passive hébraïque.
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Cherchez
  rationale: À l’impératif, דרש exprime ici la recherche de Dieu, notamment dans une démarche de retour à lui et de prière. « Cherchez » est direct, naturel et conserve la force de l’exhortation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre, afin de préserver le nom divin présent dans le texte hébreu.
- source_word: בְּהִמָּצְאוֹ
  choice: tant qu’il se laisse trouver
  rationale: 'La préposition ב avec l’infinitif construit niphal de מצא et le suffixe pronominal a une valeur temporelle : « lorsqu’il est trouvé » ou « tant qu’il peut être trouvé ». La formulation retenue est naturelle en français et exprime l’occasion présente, tandis qu’une note conserve l’autre lecture possible.'
- source_word: קְרָאֻהוּ
  choice: invoquez-le
  rationale: Dans ce contexte religieux, קרא avec une personne pour objet signifie l’appeler, faire appel à elle ou l’invoquer. « Invoquez-le » rend avec concision l’idée d’un appel adressé à Dieu.
- source_word: בִּהְיוֹתוֹ
  choice: tant qu’il est
  rationale: La préposition ב suivie de l’infinitif construit de היה introduit une proposition temporelle. « Tant qu’il est » maintient le parallélisme et l’urgence de la première proposition.
- source_word: קָרוֹב
  choice: proche
  rationale: קרוב signifie « proche » ou « à proximité ». « Proche » préserve à la fois la simplicité du terme et ses résonances relationnelles et spatiales.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Portée de בְּהִמָּצְאוֹ
  choice: tant qu’il se laisse trouver
  alternative: tant qu’il peut être trouvé
  rationale: La forme hébraïque indique le fait d’être trouvé sans expliciter entièrement la modalité. Le texte principal adopte une tournure française idiomatique, mais la note préserve une traduction plus strictement passive et évite de présenter l’interprétation comme la seule possible.
translation_notes:
  register: Français international moderne, sobre et exhortatif. Le parallélisme poétique est conservé par la répétition de « tant que », et « invoquez-le » maintient un registre digne sans devenir archaïque.
