source:
  edition: WLC
  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
translation:
  language: fr
  text: Pourquoi pesez-vous de l’argent pour ce qui n’est pas du pain[a], et pourquoi consacrez-vous votre labeur à ce qui ne rassasie pas ? Écoutez-moi attentivement[b], mangez ce qui est bon, et que votre âme trouve ses délices dans l’abondance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépensez-vous de l’argent » ; l’hébreu dit littéralement « pesez de l’argent », selon l’usage ancien qui consistait à payer le métal au poids.
    reason: lexical_alternative
  - marker: b
    text: Ou « Écoutez, écoutez-moi » ; l’hébreu renforce l’ordre par l’association d’un impératif et d’un infinitif absolu.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « dans la graisse » ; le terme hébreu peut évoquer des mets riches, la prospérité ou l’abondance.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  choice: pesez-vous de l’argent
  rationale: Le verbe שׁקל évoque concrètement l’action de peser le métal servant au paiement. « Pesez-vous de l’argent » conserve cette image économique ancienne, tandis que « dépenser » en exprimerait seulement le sens idiomatique.
- source_word: בְּלוֹא לֶחֶם
  choice: pour ce qui n’est pas du pain
  rationale: Cette formulation garde la négation et l’image concrète du pain sans expliciter à tort la portée spirituelle de la métaphore.
- source_word: וִיגִיעֲכֶם
  choice: le fruit de votre travail
  rationale: יְגִיעַ peut désigner le labeur ou ce qu’il rapporte. Dans le parallèle avec l’argent versé, « le fruit de votre travail » rend clairement le revenu acquis par l’effort tout en maintenant le lien avec celui-ci.
- source_word: בְּלוֹא לְשָׂבְעָה
  choice: pour ce qui ne rassasie pas
  rationale: Le nom שָׂבְעָה exprime la satiété. Une tournure verbale est naturelle en français et maintient l’image alimentaire.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Écoutez-moi attentivement
  rationale: L’infinitif absolu associé à l’impératif renforce l’ordre. « Attentivement » communique cette insistance dans un français naturel.
- source_word: וְאִכְלוּ טוֹב
  choice: mangez ce qui est bon
  rationale: L’adjectif טוֹב est employé substantivement. « Ce qui est bon » respecte son ampleur sémantique et reste idiomatique.
- source_word: וְתִתְעַנַּג ... נַפְשְׁכֶם
  choice: que votre âme trouve ses délices
  rationale: La forme verbale féminine singulière s’accorde avec נֶפֶשׁ, son sujet. Cette formulation conserve l’âme comme sujet et rend naturellement la nuance réflexive du hitpael.
- source_word: בַּדֶּשֶׁן
  choice: dans l’abondance
  rationale: דֶּשֶׁן désigne littéralement la graisse, puis la richesse, les mets nourrissants ou l’abondance. « Dans l’abondance » restitue ici l’idée de provision généreuse sans les connotations modernes trompeuses de « graisse ».
theological_decisions:
- issue: Langage métaphorique de la nourriture
  choice: Conserver les images du pain, de la satiété et de l’action de manger sans les qualifier explicitement de spirituelles.
  alternative: Paraphraser l’invitation comme une promesse de nourriture ou de satisfaction spirituelle.
  rationale: L’hébreu laisse les images concrètes porter leur portée théologique. Une explicitation dans le texte principal réduirait la force poétique et trancherait ce que le verset laisse implicite.
- issue: Sens de נֶפֶשׁ
  choice: votre âme
  alternative: vous-mêmes / votre être
  rationale: « Âme » maintient la personnification poétique et l’accent sur la personne intérieure, sans imposer ici une anthropologie technique.
translation_notes:
  register: Français international moderne, poétique et digne. Le vouvoiement pluriel correspond aux formes hébraïques adressées à la collectivité. La ponctuation met en relief les deux questions parallèles, puis la triple invitation.
