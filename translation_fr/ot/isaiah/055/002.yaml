revisions:
- from: Pourquoi pesez-vous de l’argent pour ce qui n’est pas du pain[a], et le fruit de votre travail pour ce qui ne rassasie pas ? Écoutez-moi attentivement[b], mangez ce qui est bon, et que votre âme trouve ses délices dans l’abondance[c].
  to: Pourquoi pesez-vous de l’argent pour ce qui n’est pas du pain[a], et pourquoi consacrez-vous votre labeur à ce qui ne rassasie pas ? Écoutez-moi attentivement[b], mangez ce qui est bon, et que votre âme trouve ses délices dans l’abondance[c].
  rationale: La révision résout la construction elliptique difficile du second membre par « pourquoi consacrez-vous votre labeur à », qui exprime naturellement en français l’investissement du travail évoqué par le parallélisme hébreu. Le remplacement de « fruit de votre travail » par « labeur » évite de décider si יְגִיעַ vise l’effort ou son gain. Les images alimentaires, la force de l’appel à écouter et la formulation poétique finale sont conservées, de même que les trois ancres de notes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:02:20Z'
