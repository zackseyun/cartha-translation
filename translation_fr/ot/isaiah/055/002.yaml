  terminology: « Argent », « pain », « rassasie », « âme » et « abondance » conviennent. « Labeur » conserve mieux que « fruit de votre travail » la double portée de יְגִיעַ, tout en gardant une diction poétique accessible. « Consacrez-vous votre labeur » exprime l’investissement de l’effort sans transformer l’image en interprétation spirituelle.
