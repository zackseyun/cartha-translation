source:
  edition: WLC
  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
translation:
  language: fr
  text: 'Car vous partirez dans la joie

    et vous serez conduits dans la paix[a] ;

    devant vous, les montagnes et les collines

    éclateront en cris de joie[b],

    et tous les arbres des champs

    battront des mains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous serez menés dans la paix ». Le verbe hébreu signifie « être conduit » ou « être mené » ; il ne répète pas explicitement l’idée de sortir.
    reason: lexical_alternative
  - marker: b
    text: Ou « éclateront en chants de joie devant vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve le lien logique avec la promesse qui précède, sans trancher excessivement entre cause et conséquence.
- source_word: בְשִׂמְחָה
  choice: dans la joie
  rationale: Expression française naturelle qui maintient le nom et le parallélisme avec « dans la paix ».
- source_word: תֵצֵאוּ
  choice: vous partirez
  rationale: Rend naturellement l’idée de sortir ou de se mettre en route dans cette scène de restauration, sans imposer explicitement une destination.
- source_word: וּבְשָׁלוֹם
  choice: dans la paix
  rationale: Préserve la portée large de שָׁלוֹם — paix, sécurité et bien-être — dans une formulation concise.
- source_word: תּוּבָלוּן
  choice: vous serez conduits
  rationale: Le hophal de יבל exprime le fait d’être mené ou conduit. Le français n’ajoute pas « hors de », absent du verbe hébreu lui-même.
- source_word: הֶהָרִים וְהַגְּבָעוֹת
  choice: les montagnes et les collines
  rationale: Équivalent courant et précis du paysage poétique hébreu.
- source_word: יִפְצְחוּ ... רִנָּה
  choice: éclateront en chants de joie
  rationale: Restitue l’élan soudain et exubérant de l’expression hébraïque tout en faisant entendre la joie portée par רִנָּה.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: Conserve l’ambiguïté naturelle entre « en votre présence » et « sur votre passage », sans choisir « devant vous » au sens strictement spatial d’« en avant ».
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: et tous les arbres des champs
  rationale: Formulation poétique idiomatique en français qui garde l’image collective du paysage rural.
- source_word: יִמְחֲאוּ כָף
  choice: battront des mains
  rationale: Rend directement l’idiome hébreu et préserve la personnification frappante des arbres.
theological_decisions:
- issue: Personnification poétique de la création dans l’image de la restauration
  choice: Conserver les montagnes, les collines et les arbres comme participants personnifiés à la joie
  alternative: Réduire l’image à une description non personnifiée d’une nature belle ou accueillante
  rationale: Le texte hébreu représente intentionnellement la création comme chantant et battant des mains. Garder cette personnification respecte le thème d’une restauration dont la joie gagne tout le monde créé, sans lui ajouter de précision doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. La disposition en vers met en valeur les parallélismes de la poésie hébraïque. Le tutoiement ou vouvoiement ne se pose pas ici : le pluriel « vous » correspond à la deuxième personne du pluriel hébraïque.'
