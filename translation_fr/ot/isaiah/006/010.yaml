  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
translation:
  language: fr
  text: Rends insensible le cœur de ce peuple, alourdis ses oreilles et ferme-lui les yeux[a], de peur qu’il ne voie de ses yeux, n’entende de ses oreilles, ne comprenne avec son cœur, ne revienne[b] et ne soit guéri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rends ses yeux insensibles » ou « enduis-lui les yeux » ; le verbe hébreu rare évoque des yeux fermés ou rendus incapables de voir.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne retourne » ; le verbe peut désigner simplement le fait de revenir et, dans ce contexte, peut aussi évoquer la repentance.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמֵן לֵב
  choice: Rends insensible le cœur
  rationale: Le hiphil de שׁמן signifie littéralement « rendre gras ». Avec « cœur », il décrit une faculté intérieure devenue insensible. Cette formulation restitue l’idiome sans introduire le terme théologiquement plus chargé « endurcir ».
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Conserve le collectif singulier hébreu et le registre prophétique naturel en français.
- source_word: וְאָזְנָיו הַכְבֵּד
  choice: alourdis ses oreilles
  rationale: Préserve l’image concrète du hiphil de כבד, celle d’oreilles rendues lourdes et donc peu réceptives.
- source_word: וְעֵינָיו הָשַׁע
  choice: ferme-lui les yeux
  rationale: Le verbe rare הָשַׁע évoque des yeux rendus inopérants, possiblement fermés ou comme enduits. « Ferme-lui les yeux » garde l’image sans la réduire au seul résultat abstrait « aveugle ».
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Rend naturellement en français moderne la valeur préventive de פֶּן tout en conservant la solennité de la phrase.
- source_word: יִרְאֶה ... יִשְׁמָע ... יָבִין
  choice: il ne voie… n’entende… ne comprenne
  rationale: Les verbes hébreux sont au singulier et reprennent le collectif singulier « ce peuple ». Le français permet de conserver cet accord sans maladresse.
- source_word: וָשָׁב
  choice: ne revienne
  rationale: שׁוב signifie fondamentalement revenir ou se détourner pour revenir. « Revienne » préserve l’ambiguïté entre retour général et repentance.
- source_word: וְרָפָא לוֹ
  choice: ne soit guéri
  rationale: La construction hébraïque est concise et peut exprimer le résultat passif, sans nommer explicitement celui qui guérit. Le passif français conserve cette réserve.
theological_decisions:
- issue: Action divine dans l’endurcissement judiciaire
  choice: 'Conserver les impératifs directs : « Rends… alourdis… ferme… »'
  alternative: Affaiblir en tournure permissive (« Laisse le cœur devenir insensible ») ou présenter seulement un résultat
  rationale: L’hébreu emploie trois impératifs adressés au prophète. Leur force abrupte et la tension théologique du passage ne doivent pas être atténuées.
- issue: Valeur de וָשָׁב
  choice: « revienne »
  alternative: « se repente »
  rationale: Le contexte peut inclure la repentance, mais le verbe hébreu garde une portée plus large. La traduction évite de préciser ce que le texte laisse ouvert.
- issue: Référence collective au peuple
  choice: Maintenir le singulier dans toute la phrase
  alternative: Passer au pluriel avec « ils » et « leurs »
  rationale: Contrairement à l’anglais, le français emploie naturellement le singulier avec le nom collectif « peuple », ce qui reflète aussi exactement les formes hébraïques.
translation_notes:
  register: Français international moderne, digne et direct. Les métaphores corporelles du texte hébreu sont conservées autant que le permet l’usage naturel. Le singulier collectif est maintenu, et la syntaxe « de peur que… ne » porte la série des verbes sans multiplier les sujets.
