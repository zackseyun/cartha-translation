  source_fidelity: Le texte rend fidèlement les trois impératifs hiphil adressés à Isaïe (« Rends… alourdis… ferme… »), ainsi que la proposition de prévention introduite par פֶּן. Le singulier collectif de « ce peuple » et les verbes singuliers de la seconde partie sont justement conservés. « Revienne » maintient l’ouverture sémantique de שׁוב, et « soit guéri » respecte l’ellipse passive du dernier verbe sans expliciter indûment l’agent de la guérison.
  naturalness: Le français est moderne, clair et d’un registre prophétique approprié. La construction « de peur qu’il ne voie…, n’entende…, ne comprenne… » est naturelle et porte correctement toute la série. « Alourdis ses oreilles » conserve une image un peu marquée mais intelligible, conforme au caractère imagé du texte.
  terminology: « Cœur » préserve le terme anthropologique hébreu; « insensible » rend bien l’effet idiomatique de « rendre gras » sans imposer « endurcir ». « Ferme-lui les yeux » est une option française naturelle pour le verbe hébreu rare et disputé; la note signale avec justesse les possibilités d’« enduire » ou de rendre les yeux inopérants. Aucun terme doctrinal interprétatif n’est ajouté.
