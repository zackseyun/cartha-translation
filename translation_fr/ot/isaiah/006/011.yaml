  text: וָ/אֹמַ֕ר עַד מָתַ֖י אֲדֹנָ֑/י וַ/יֹּ֡אמֶר עַ֣ד אֲשֶׁר֩ אִם שָׁא֨וּ עָרִ֜ים מֵ/אֵ֣ין יוֹשֵׁ֗ב וּ/בָתִּים֙ מֵ/אֵ֣ין אָדָ֔ם וְ/הָ/אֲדָמָ֖ה תִּשָּׁאֶ֥ה שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
translation:
  language: fr
  text: 'Alors je demandai[a] : « Jusqu’à quand, Seigneur ? » Il répondit : « Jusqu’à ce que les villes soient dévastées, sans habitants, que les maisons soient sans personne, et que le pays soit ravagé et devienne une désolation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Combien de temps, Seigneur ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors je dis
  rationale: Le waw consécutif fait avancer le récit. « Alors » marque naturellement la succession en français, tandis que le présent de narration convient au récit prophétique.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Rend directement l’expression hébraïque et maintient son lien avec la réponse introduite par « jusqu’à ce que ».
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin usuel en adresse ; le suffixe de première personne est lexicalisé et ne nécessite pas « mon Seigneur » ici.
- source_word: עַד אֲשֶׁר אִם
  choice: Jusqu’à ce que
  rationale: Cette tournure introduit le terme du jugement annoncé ; אִם a ici une valeur idiomatique ou intensive plutôt qu’une valeur conditionnelle autonome.
- source_word: שָׁאוּ עָרִים
  choice: les villes soient dévastées
  rationale: שׁאה exprime la dévastation ou la désolation. Cette formulation est claire, forte et naturelle en français.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sans habitants
  rationale: Le participe singulier a une valeur collective. Le pluriel français s’accorde naturellement avec « les villes » et désigne l’absence de toute population.
- source_word: וּבָתִּים מֵאֵין אָדָם
  choice: les maisons, sans personne
  rationale: אָדָם désigne ici génériquement un être humain. « Sans personne » rend exactement l’absence de tout occupant sans suggérer une restriction au sexe masculin.
- source_word: וְהָאֲדָמָה
  choice: et que le pays
  rationale: Dans ce contexte de jugement national, אֲדָמָה désigne le territoire plutôt que le sol matériel. « Pays » convient mieux que « terre » à cette portée.
- source_word: תִּשָּׁאֶה שְׁמָמָה
  choice: soit ravagé, réduit en désolation
  rationale: Le verbe et le nom cumulent deux expressions de dévastation. La traduction conserve cette intensification sans produire une tournure française artificielle.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: sans personne
  alternative: sans homme
  rationale: Le mot ne vise pas ici un individu masculin, mais l’absence de tout être humain dans les maisons. « Sans personne » préserve cette portée générique en français moderne.
- issue: Durée du jugement exprimée par עַד מָתַי et עַד אֲשֶׁר אִם
  choice: Jusqu’à quand ? … Jusqu’à ce que…
  alternative: Combien de temps ? … Jusqu’à ce que…
  rationale: 'La formulation retenue préserve le parallélisme lexical et laisse intacte la tension du passage : le jugement se poursuit jusqu’à la dévastation décrite, sans préciser ici ce qui vient ensuite.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression solennelle de l’oracle et l’accumulation des images de dévastation, tout en évitant les calques peu naturels. Le marqueur [a] figure bien dans le texte principal.
