  text: וְ/קָרָ֨א זֶ֤ה אֶל זֶה֙ וְ/אָמַ֔ר קָד֧וֹשׁ קָד֛וֹשׁ קָד֖וֹשׁ יְהוָ֣ה צְבָא֑וֹת מְלֹ֥א כָל הָ/אָ֖רֶץ כְּבוֹדֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/003.yaml
  text: 'And one called to another and said: “Holy[a], holy, holy is Yahweh of hosts[b]; the whole earth is full of his glory.”'
translation:
  language: fr
  text: 'L’un criait à l’autre et disait : « Saint, saint, saint est Yahweh des armées[a] ! Toute la terre est pleine de sa gloire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre hébreu « Yahweh des armées » évoque les forces sous son commandement, sans préciser ici s’il s’agit de forces célestes, terrestres ou des deux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָא זֶה אֶל זֶה
  choice: L’un appelait l’autre
  rationale: L’expression réciproque זֶה אֶל זֶה est rendue idiomatiquement, tandis que « appelait » conserve l’idée d’une proclamation adressée de l’un à l’autre.
- source_word: וְאָמַר
  choice: et disait
  rationale: L’imparfait français s’accorde naturellement avec la scène visionnaire et présente la proclamation répétée ou soutenue sans surinterpréter son déroulement.
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  choice: Saint, saint, saint
  rationale: La triple répétition est conservée intégralement pour respecter son intensité rhétorique et sa force liturgique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: le maître des armées
  rationale: Dans ce titre divin, צְבָאוֹת désigne les forces rangées sous le commandement de Yahweh. Cette formulation est claire en français moderne et évite l’opacité de « des armées » employé seul comme complément du nom divin.
- source_word: מְלֹא כָל הָאָרֶץ כְּבוֹדוֹ
  choice: Toute la terre est remplie de sa gloire
  rationale: La construction nominale hébraïque est rendue par une phrase française naturelle, sans perdre la portée universelle de כָל הָאָרֶץ ni le lien avec la gloire divine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahweh » le préserve explicitement, tandis que « le SEIGNEUR » reflète la tradition de lecture substitutive.
- issue: Sens du titre יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  alternative: Yahweh des armées
  rationale: La formulation choisie exprime l’autorité de Yahweh sur les armées sans préciser indûment qu’elles seraient exclusivement célestes ou terrestres. La forme plus littérale reste possible, mais elle est moins naturelle en français courant.
translation_notes:
  register: Français international moderne, solennel et oralement fluide. La triple acclamation et le nom divin sont conservés; la syntaxe est légèrement idiomatisée pour rester claire à la lecture publique.
