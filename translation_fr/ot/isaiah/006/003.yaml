review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu, y compris la triple acclamation, le nom divin et l’affirmation que toute la terre est pleine de gloire. Toutefois, « l’un appelait l’autre » rend plutôt un appel adressé à l’autre qu’un échange réciproque : זֶה אֶל־זֶה signifie « l’un à l’autre ». « Le maître des armées » explicite une relation de maîtrise qui n’est pas formulée par le titre constructif hébreu יְהוָה צְבָאוֹת.'
  naturalness: Le registre est solennel et naturel. « L’un criait à l’autre » est à la fois idiomatique en français et approprié à la proclamation antiphonale de la vision. « Toute la terre est pleine de sa gloire » est plus direct et plus proche de la construction hébraïque que « est remplie ».
  terminology: « Yahweh » rend correctement le tétragramme. « Yahweh des armées » est la forme française la plus fidèle du titre, tout en restant compréhensible dans ce contexte; une note peut en signaler l’étendue possible sans la restreindre aux forces célestes ou terrestres.
  issues:
  - severity: medium
    issue: Relation réciproque insuffisamment exprimée
    rationale: « L’un appelait l’autre » ne correspond pas pleinement à זֶה אֶל־זֶה (« l’un à l’autre »). La préposition « à » doit être maintenue afin de rendre l’adresse antiphonale.
  - severity: medium
    issue: Expansion interprétative du titre divin
    rationale: « le maître des armées » ajoute « maître », absent de יְהוָה צְבָאוֹת, et transforme le titre traditionnellement construit. « Yahweh des armées » est plus fidèle sans être obscur.
  revised_text: 'L’un criait à l’autre et disait : « Saint, saint, saint est Yahweh des armées[a] ! Toute la terre est pleine de sa gloire. »'
  revised_footnotes:
