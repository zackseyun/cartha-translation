id: ISA.6.12
reference: Isaiah 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רִחַ֥ק יְהוָ֖ה אֶת הָ/אָדָ֑ם וְ/רַבָּ֥ה הָ/עֲזוּבָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
translation:
  language: fr
  text: Yahweh éloignera les humains, et l’abandon sera grand au cœur du pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « les lieux abandonnés seront nombreux à l’intérieur du pays » ou « la désolation sera grande au cœur du pays ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק
  choice: éloignera
  rationale: Le verbe exprime ici le fait de mettre à distance; dans ce contexte prophétique, le parfait avec waw se rend naturellement par un futur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel au lieu de lui substituer un titre.
- source_word: הָאָדָם
  choice: les humains
  rationale: Le singulier collectif désigne ici la population humaine; le pluriel français en restitue naturellement la portée générique.
- source_word: וְרַבָּה
  choice: sera grand
  rationale: Le verbe au féminin singulier s’accorde avec הָעֲזוּבָה et exprime l’ampleur de l’abandon ou de la désolation.
- source_word: הָעֲזוּבָה
  choice: l’abandon
  rationale: Le terme peut désigner abstraitement l’état d’abandon; cette traduction préserve sa forme singulière et évite de préciser sans nécessité qu’il s’agit de lieux.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au cœur du pays
  rationale: Expression française naturelle qui conserve l’image spatiale de קֶרֶב et situe l’abandon à l’intérieur du territoire concerné.
theological_decisions:
- issue: Portée collective de הָאָדָם
  choice: les humains
  alternative: l’être humain; la population
  rationale: Le contexte annonce l’éloignement des habitants en général. « Les humains » rend la valeur collective sans limiter le propos aux hommes de sexe masculin.
- issue: Interprétation de הָעֲזוּבָה
  choice: l’abandon sera grand
  alternative: les lieux abandonnés seront nombreux; la désolation sera grande
  rationale: L’hébreu permet une lecture abstraite ou concrète. Le texte principal conserve la formulation abstraite, tandis que la note signale les autres compréhensions plausibles sans trancher la tension lexicale.
translation_notes:
  register: Français international moderne, sobre et solennel. La formulation reste proche de la structure hébraïque tout en étant naturelle; « pays » est retenu pour le territoire en contexte, et la note conserve l’ambiguïté de הָעֲזוּבָה.
