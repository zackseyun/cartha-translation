    rationale: Le texte hébreu répète כי avant « mes yeux ont vu le Roi ». Dans le mouvement du verset, cette vision est donnée comme la raison déterminante du malheur proclamé par Ésaïe. « Car » préserve cette relation sans surinterpréter le sens de נִדְמֵיתִי.
