  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Malheur à moi ! Je suis perdu[a], car je suis un homme aux lèvres impures, j’habite au milieu d’un peuple aux lèvres impures, car mes yeux ont vu le Roi, Yahweh des armées[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je suis anéanti », « je suis réduit au silence » ou « je suis retranché ».'
    reason: Le sens précis de נִדְמֵיתִי est discuté; le contexte permet plusieurs nuances liées à la ruine ou à la disparition.
  - marker: b
    text: 'Traditionnellement : « le Seigneur des armées »; hébreu : YHWH tsevaot.'
    reason: La note signale le rendu traditionnel et la forme hébraïque du titre divin.
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Malheur à moi !
  rationale: Cette exclamation exprime à la fois la lamentation et la menace de mort; la formulation est naturelle, forte et digne en français.
- source_word: נִדְמֵיתִי
  choice: Je suis perdu
  rationale: Le nifal de דמה évoque ici la ruine de l’orateur devant la présence divine. « Je suis perdu » reste clair et conserve l’ambiguïté entre anéantissement, condamnation et perte, explicitée en note.
- source_word: אִישׁ טְמֵא שְׂפָתַיִם
  choice: un homme aux lèvres impures
  rationale: La formulation garde le masculin autoréférentiel et rend naturellement en français la construction hébraïque qui caractérise l’homme par l’impureté de ses lèvres.
- source_word: וּבְתוֹךְ עַם
  choice: au milieu d’un peuple
  rationale: Cette expression rend explicitement la position d’Ésaïe au sein de sa communauté et conserve le sens collectif indéfini de עַם.
- source_word: יוֹשֵׁב
  choice: j’habite
  rationale: Dans ce contexte, ישב désigne une résidence durable plutôt que l’action littérale de s’asseoir. « J’habite » est actuel et direct.
- source_word: הַמֶּלֶךְ
  choice: le Roi
  rationale: La majuscule signale la valeur de titre dans cette référence directe à Dieu sans ajouter de contenu au texte.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que צְבָאוֹת est traduit de façon transparente. La tournure française « des armées » exprime la souveraineté de Yahweh sur les armées célestes sans recourir au traditionnel mais aujourd’hui moins clair « des armées célestes » ou « des puissances ».
- source_word: רָאוּ עֵינָי
  choice: mes yeux ont vu
  rationale: Le passé composé rend l’expérience achevée dont les conséquences immédiates motivent le cri du prophète.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre confessionnel traditionnel.
- issue: Sens de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: des puissances / Sabaot
  rationale: Le terme désigne des armées ou troupes, notamment célestes dans ce contexte. La traduction concrète conserve l’imagerie militaire et la souveraineté divine sans l’aplanir.
- issue: Portée de l’impureté des lèvres
  choice: conserver l’image concrète des lèvres impures
  alternative: paroles impures
  rationale: Le texte nomme les lèvres, non simplement la parole. Garder cette métonymie préserve le lien avec la purification des lèvres dans les versets suivants.
translation_notes:
  register: Français international moderne, direct et solennel. La répétition de « lèvres impures » et l’enchaînement causal avec « car » sont conservés. La ponctuation souligne l’effroi sans archaïsme.
