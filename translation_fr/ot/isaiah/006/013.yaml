revisions:
- from: Et même s’il en reste un dixième, celui-ci sera de nouveau voué à la destruction, tel un térébinthe ou un chêne dont la souche demeure quand on l’abat[a]. La semence sainte est sa souche.
  to: Et même s’il en reste un dixième, celui-ci sera de nouveau livré au feu, comme un térébinthe ou un chêne dont il reste une souche après l’abattage[a]. La semence sainte est sa souche.
  rationale: La révision remplace le terme générique « destruction » par « livré au feu », afin de refléter plus fidèlement לְבָעֵר tout en évitant de surdéterminer le mécanisme précis du jugement. Elle lisse aussi légèrement la comparaison arboricole. La note conserve explicitement l’alternative liée à בְּשַׁלֶּכֶת et son caractère disputé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:08Z'
review_pass:
  verdict: revise
  source_fidelity: La structure concessive (« même s’il en reste un dixième »), la récurrence (« de nouveau »), les deux essences et l’image de la souche sont bien rendues. Toutefois, « voué à la destruction » neutralise indûment le champ de בָּעֵר, qui évoque le fait d’être livré à la combustion/consumation. « Livré au feu » conserve l’image sans prétendre préciser davantage le mode du jugement.
  naturalness: Le français est globalement fluide et d’un registre biblique moderne. « Sera de nouveau livré au feu » est à la fois plus idiomatique et plus concret que « sera de nouveau voué à la destruction ». La formulation de la comparaison est légèrement régularisée pour éviter que le singulier « on l’abat » ne paraisse viser seulement le second arbre.
  terminology: « Térébinthe », « chêne », « souche » et « semence sainte » sont appropriés. « Semence sainte » maintient volontairement l’ouverture du syntagme hébreu et ne lui impose aucune identification doctrinale.
  issues:
  - severity: medium
    issue: « voué à la destruction » pour וְהָיְתָה לְבָעֵר
    rationale: Cette expression est trop générale et efface l’imagerie du feu/du fait de brûler portée par בָּעֵר. Une formulation française évoquant le feu est préférable tout en conservant la portée figurée du jugement.
  - severity: low
    issue: Accord référentiel de l’image des arbres
    rationale: « dont la souche demeure quand on l’abat » est intelligible, mais le singulier peut sembler ne renvoyer qu’à un seul des deux arbres. « après l’abattage » garde l’image de façon plus neutre.
  revised_text: Et même s’il en reste un dixième, celui-ci sera de nouveau livré au feu, comme un térébinthe ou un chêne dont il reste une souche après l’abattage[a]. La semence sainte est sa souche.
  revised_footnotes:
