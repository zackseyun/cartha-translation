base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
translation:
  language: fr
  text: Et même s’il en reste un dixième, celui-ci sera de nouveau livré au feu, comme un térébinthe ou un chêne dont il reste une souche après l’abattage[a]. La semence sainte est sa souche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au temps de la chute des feuilles » ou « quand ses feuilles tombent ». Le sens du terme hébreu est incertain ; le texte principal retient l’image d’un arbre abattu dont la souche demeure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְע֥וֹד בָּהּ עֲשִׂרִיָּה
  choice: Et même s’il en reste un dixième
  rationale: La tournure concessive rend naturellement l’idée qu’une portion subsiste encore dans le pays ou la communauté, sans expliciter davantage le référent féminin de בָּהּ.
- source_word: וְשָׁבָה וְהָיְתָה לְבָעֵר
  choice: celui-ci sera de nouveau voué à la destruction
  rationale: « De nouveau » exprime la récurrence portée par שׁוב. « Voué à la destruction » conserve la construction de destination לְבָעֵר sans réduire nécessairement le jugement à une combustion matérielle.
- source_word: כָּאֵלָה וְכָאַלּוֹן
  choice: tel un térébinthe ou un chêne
  rationale: Les deux espèces d’arbres sont conservées. « Ou » présente en français les deux formes parallèles d’une même comparaison.
- source_word: אֲשֶׁר בְּשַׁלֶּכֶת מַצֶּבֶת בָּם
  choice: dont la souche demeure quand on l’abat
  rationale: מַצֶּבֶת désigne ici ce qui reste debout, compris dans l’image comme une souche. Le sens de בְּשַׁלֶּכֶת est difficile ; le texte principal retient l’abattage, qui s’accorde étroitement avec cette image, tandis que l’autre lecture est signalée en note.
- source_word: זֶרַע קֹדֶשׁ מַצַּבְתָּהּ
  choice: La semence sainte est sa souche
  rationale: La formulation brève maintient le lien lexical avec la souche évoquée juste avant et conserve « semence » avec ses résonances collectives et théologiques sans en préciser le référent.
theological_decisions:
- issue: Identité de « la semence sainte »
  choice: La semence sainte est sa souche
  alternative: Le reste fidèle d’Israël ; le peuple de l’alliance qui survivra ; une lignée messianique
  rationale: Le texte évoque un noyau consacré qui subsiste après le jugement, mais il ne l’identifie pas plus précisément. La traduction littérale préserve cette ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression sévère du jugement vers l’image de la souche, ainsi que la conclusion concise et théologiquement ouverte.
