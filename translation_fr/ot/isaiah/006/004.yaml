  text: וַ/יָּנֻ֨עוּ֙ אַמּ֣וֹת הַ/סִּפִּ֔ים מִ/קּ֖וֹל הַ/קּוֹרֵ֑א וְ/הַ/בַּ֖יִת יִמָּלֵ֥א עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
translation:
  language: fr
  text: Les bases des seuils[a] tremblèrent à la voix de celui qui appelait, et la maison[b] fut remplie de fumée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les montants des seuils » ou « les supports des seuils ». L’expression hébraïque désigne des éléments structurels de la zone des seuils ou des ouvertures.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple ». Littéralement « la maison », terme couramment employé pour désigner le sanctuaire du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנֻעוּ
  choice: tremblèrent
  rationale: Le verbe נוּעַ exprime ici un mouvement ou un ébranlement. « Tremblèrent » rend naturellement la secousse physique dans ce récit visionnaire.
- source_word: אַמּוֹת הַסִּפִּים
  choice: les bases des seuils
  rationale: L’expression désigne des éléments porteurs de la zone des seuils ou des ouvertures. « Bases des seuils » conserve l’image architecturale sans trancher excessivement entre bases, supports et montants; une note signale les autres possibilités.
- source_word: מִקּוֹל
  choice: à la voix de
  rationale: קוֹל peut désigner la voix ou le son, et la préposition מִן marque ici la cause. « À la voix de » est idiomatique en français et convient à un être qui crie.
- source_word: הַקּוֹרֵא
  choice: celui qui criait
  rationale: Le participe substantivé présente l’action en cours. Dans le contexte de la proclamation retentissante des séraphins, « criait » exprime mieux l’intensité que « appelait », qui pourrait suggérer une convocation.
- source_word: וְהַבַּיִת
  choice: et la maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici le sanctuaire du temple. Le maintien de « maison » préserve la formulation hébraïque; la note explicite le sens contextuel.
- source_word: יִמָּלֵא
  choice: se remplit
  rationale: Le niphal s’intègre naturellement à la suite narrative par le passé simple pronominal français, avec un sens résultatif passif ou médial.
- source_word: עָשָׁן
  choice: fumée
  rationale: Équivalent lexical direct et naturel.
theological_decisions:
- issue: Désignation du sanctuaire dans la vision
  choice: la maison
  alternative: le temple
  rationale: L’hébreu emploie « la maison », désignation courante du sanctuaire. Conserver cette expression respecte le texte et son imagerie, tandis qu’une note indique clairement qu’il s’agit du temple.
translation_notes:
  register: Français moderne, sobre et solennel. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation conserve l’ambiguïté architecturale et la désignation hébraïque du sanctuaire.
