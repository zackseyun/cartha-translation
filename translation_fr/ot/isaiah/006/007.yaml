  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: fr
  text: 'Il toucha ma bouche et dit : « Voici, ceci a touché tes lèvres ; ta faute s’est éloignée, et ton péché est expié. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגַּע עַל־פִּי
  choice: Il toucha ma bouche
  rationale: Le verbe נגע avec עַל exprime ici le contact avec la bouche ; cette formulation française est naturelle et fidèle.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » conserve la fonction déictique et solennelle du terme dans cette déclaration.
- source_word: וְסָר עֲוֹנֶךָ
  choice: ta faute est écartée
  rationale: סוּר signifie s’écarter ou être ôté, tandis que עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Ta faute est écartée » préserve cette amplitude sans réduire le terme au seul sentiment de culpabilité.
- source_word: וְחַטָּאתְךָ תְכֻפָּר
  choice: ton péché est expié
  rationale: Le passif de כפר exprime l’expiation ou la couverture rituelle du péché ; « est expié » est précis, idiomatique et adapté au contexte cultuel.
theological_decisions:
- issue: Rapport entre la faute ôtée et le péché expié
  choice: 'Conserver les deux propositions parallèles : « ta faute est écartée, et ton péché est expié »'
  alternative: Fusionner en une seule affirmation de pardon
  rationale: L’hébreu emploie deux termes et deux verbes distincts. Les maintenir respecte le parallélisme et évite d’aplanir la portée théologique du texte.
translation_notes:
  register: Français moderne, digne et accessible. « Voici » maintient le ton prophétique sans archaïsme excessif ; la structure brève conserve la solennité de la scène.
