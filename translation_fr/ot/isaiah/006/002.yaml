source:
  edition: WLC
  text: שְׂרָפִ֨ים עֹמְדִ֤ים מִ/מַּ֨עַל֙ ל֔/וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְ/אֶחָ֑ד בִּ/שְׁתַּ֣יִם יְכַסֶּ֣ה פָנָ֗י/ו וּ/בִ/שְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖י/ו וּ/בִ/שְׁתַּ֥יִם יְעוֹפֵֽף׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
translation:
  language: fr
  text: 'Des séraphins[a] se tenaient au-dessus de lui. Chacun avait six ailes : avec deux ailes, il se couvrait le visage ; avec deux, il se couvrait les pieds ; et avec deux, il volait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme « séraphins » est peut-être apparenté à une racine qui signifie « brûler » ; on pourrait alors comprendre « êtres brûlants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂרָפִים
  choice: séraphins
  rationale: Le terme traditionnel français désigne naturellement cette catégorie d’êtres célestes, tout en évitant de présenter l’étymologie possible « êtres brûlants » comme une traduction certaine.
- source_word: עֹמְדִים
  choice: se tenaient
  rationale: Le participe décrit leur position dans la scène. L’imparfait français convient à l’arrière-plan d’une vision et « se tenaient » est plus naturel ici que « étaient debout ».
- source_word: מִמַּעַל לוֹ
  choice: au-dessus de lui
  rationale: La locution exprime leur position par rapport au Seigneur assis sur le trône. Le pronom masculin personnel conserve le référent immédiat.
- source_word: שֵׁשׁ כְּנָפַיִם ... שֵׁשׁ כְּנָפַיִם לְאֶחָד
  choice: Chacun avait six ailes
  rationale: Cette formulation rend clairement la valeur distributive de l’hébreu, malgré la répétition littérale de « six ailes » dans le texte source.
- source_word: בִּשְׁתַּיִם
  choice: de deux
  rationale: La tournure française concise indique que deux des six ailes servent à chacune des trois actions et préserve la répétition structurante du verset.
- source_word: יְכַסֶּה
  choice: il se couvrait
  rationale: Le singulier correspond à « chacun » et l’imparfait décrit les actions constitutives de la scène visionnaire.
- source_word: פָנָיו
  choice: le visage
  rationale: 'Avec le verbe pronominal français, l’article défini rend naturellement la possession : « il se couvrait le visage ».'
- source_word: רַגְלָיו
  choice: les pieds
  rationale: « Pieds » est le sens contextuel normal; avec le verbe pronominal, l’article défini exprime naturellement la possession.
- source_word: יְעוֹפֵף
  choice: il volait
  rationale: L’imparfait coordonne cette action aux deux précédentes et présente ce que faisait chaque séraphin dans la vision.
theological_decisions:
- issue: Traduction littérale ou transcription de שְׂרָפִים
  choice: séraphins
  alternative: êtres brûlants
  rationale: Le contexte présente une catégorie particulière d’êtres célestes. Le terme reconnu « séraphins » préserve cette désignation sans transformer une étymologie possible en affirmation explicite du texte.
- issue: Référent de לוֹ
  choice: au-dessus de lui
  alternative: au-dessus du trône
  rationale: Dans le contexte immédiat, le suffixe renvoie le plus naturellement au Seigneur assis sur le trône. Expliciter « le trône » modifierait le référent grammatical.
- issue: Maintien du singulier distributif
  choice: Chacun avait… il se couvrait… il volait
  alternative: Ils avaient chacun… ils se couvraient… ils volaient
  rationale: Le singulier français reproduit la transition hébraïque vers chaque séraphin pris individuellement, sans traiter ces êtres personnels comme des objets.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait unifie la description visionnaire. La triple reprise de « de deux » conserve le rythme et la répartition précise des six ailes.
