  text: וַ/יֹּ֕אמֶר לֵ֥ךְ וְ/אָמַרְתָּ֖ לָ/עָ֣ם הַ/זֶּ֑ה שִׁמְע֤וּ שָׁמ֨וֹעַ֙ וְ/אַל תָּבִ֔ינוּ וּ/רְא֥וּ רָא֖וֹ וְ/אַל תֵּדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
translation:
  language: fr
  text: 'Il dit[a] : « Va dire à ce peuple : “Écoutez bien, mais ne comprenez pas ; regardez bien, mais ne reconnaissez pas.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie des impératifs renforcés : « Écoutez bien, mais ne comprenez pas ; regardez bien, mais ne reconnaissez pas. » Dans ce contexte de jugement, la phrase peut aussi être comprise avec une portée prédictive : « Vous entendrez bel et bien… vous verrez bel et bien… »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol narratif de אמר introduit ici le discours direct. « Il dit » est naturel en français et n’ajoute pas une nuance temporelle absente du texte.
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Va dire
  rationale: L’impératif suivi de la forme verbale coordonnée exprime une mission. « Va dire » rend naturellement en français l’enchaînement littéral « Va, et tu diras ».
- source_word: לָעָם הַזֶּה
  choice: à ce peuple
  rationale: עָם désigne le peuple, et le démonstratif est conservé. La formulation préserve aussi la tonalité de mise à distance.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Vous aurez beau écouter
  rationale: L’impératif suivi de l’infinitif absolu intensifie l’action. Dans ce parallélisme, « avoir beau » communique clairement l’écoute répétée ou appuyée qui demeure sans résultat, tout en laissant la forme impérative plus littérale en note.
- source_word: וְאַל תָּבִינוּ
  choice: vous ne comprendrez pas
  rationale: בין signifie comprendre ou discerner. La tournure française avec « avoir beau » appelle ici un futur qui exprime le résultat refusé, sans réduire la portée judiciaire du propos.
- source_word: וּרְאוּ רָאוֹ
  choice: vous aurez beau regarder
  rationale: Comme dans le premier membre, l’impératif et l’infinitif absolu intensifient l’action. « Regarder » conserve l’acte visuel délibéré et forme un parallélisme naturel avec « écouter ».
- source_word: וְאַל תֵּדָעוּ
  choice: vous ne discernerez pas
  rationale: ידע signifie littéralement « savoir, connaître », mais peut ici désigner la reconnaissance ou la perception effective de ce qui est vu. « Discerner » convient au contexte et évite en français l’expression peu naturelle « regarder sans savoir ».
theological_decisions:
- issue: 'Valeur des impératifs : commandement direct à portée ironique et judiciaire, ou prédiction'
  choice: Le texte principal emploie « vous aurez beau… », qui conserve la force rhétorique et l’inéluctable absence de compréhension.
  alternative: '« Écoutez encore et encore, mais ne comprenez pas ; regardez encore et encore, mais ne discernez pas. » Ou, avec une valeur prédictive : « Vous entendrez bel et bien… vous verrez bel et bien… »'
  rationale: Les formes hébraïques שִׁמְעוּ et רְאוּ sont grammaticalement des impératifs, suivis de prohibitions. Toutefois, l’association de l’impératif à l’infinitif absolu et le contexte de commission prophétique permettent une portée ironique ou judiciaire proche d’un constat prédictif. La note préserve ces possibilités sans trancher la tension.
translation_notes:
  register: Français moderne, international et digne. « Vous aurez beau » rend l’intensification et l’inefficacité paradoxale de l’écoute et du regard dans une formulation immédiatement compréhensible. La note conserve plus formellement les impératifs hébreux ainsi que leur possible portée prédictive.
