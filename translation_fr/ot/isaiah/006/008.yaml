id: ISA.6.8
reference: Isaiah 6:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
translation:
  language: fr
  text: 'Puis j’entendis la voix du Seigneur qui disait : « Qui enverrai-je, et qui ira pour nous[a] ? » Je répondis : « Me voici[b], envoie-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pour nous ». Le pluriel peut évoquer le conseil céleste; certains lecteurs chrétiens y voient aussi, à la lumière de l’ensemble du canon, un écho à la révélation trinitaire ultérieure. Le texte lui-même n’en précise pas le référent.
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque marque la disponibilité et l’empressement à répondre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Puis j’entendis
  rationale: Le wayyiqtol fait progresser le récit. « Puis » en rend naturellement la succession, et « j’entendis » conserve ici un registre narratif digne.
- source_word: קוֹל
  choice: la voix
  rationale: Puisqu’il s’agit d’une parole articulée, « voix » est plus précis et naturel que « son ».
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le titre divin אֲדֹנָי désigne ici Dieu; « le Seigneur » est la formulation française établie et naturelle.
- source_word: אֹמֵר
  choice: qui disait
  rationale: Cette tournure française rend naturellement le participe qui introduit les paroles entendues.
- source_word: מִי אֶשְׁלַח
  choice: Qui enverrai-je
  rationale: Le pronom interrogatif est l’objet du verbe. En français, « qui » convient aussi bien pour une personne objet et évite une formulation artificielle.
- source_word: וּמִי יֵלֶךְ לָנוּ
  choice: et qui ira pour nous
  rationale: « Pour nous » conserve directement la première personne du pluriel לָנוּ sans en préciser le référent.
- source_word: הִנְנִי
  choice: Me voici
  rationale: L’expression idiomatique marque la présence, la disponibilité et l’empressement; « Me voici » est à la fois naturel et solennel en français.
- source_word: שְׁלָחֵנִי
  choice: envoie-moi
  rationale: L’impératif avec suffixe de première personne exprime une offre directe et volontaire.
theological_decisions:
- issue: Le pluriel dans la parole divine (« pour nous »)
  choice: Maintenir « pour nous » dans le texte sans identifier son référent.
  alternative: Comprendre ce pluriel comme renvoyant au conseil céleste, comme un pluriel de majesté ou de délibération, ou, dans une lecture chrétienne canonique, comme faisant écho à la révélation trinitaire ultérieure.
  rationale: L’hébreu porte explicitement un suffixe de première personne du pluriel. La traduction doit préserver cette tension sans remplacer le pluriel par un singulier ni imposer une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le registre narratif biblique sans archaïsme excessif; le discours direct reste clair et immédiat.
