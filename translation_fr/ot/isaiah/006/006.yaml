id: ISA.6.6
reference: Isaiah 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֣עָף אֵלַ֗/י אֶחָד֙ מִן הַ/שְּׂרָפִ֔ים וּ/בְ/יָד֖/וֹ רִצְפָּ֑ה בְּ/מֶ֨לְקַחַ֔יִם לָקַ֖ח מֵ/עַ֥ל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
translation:
  language: fr
  text: Alors l’un des séraphins vola vers moi. Il tenait à la main une braise ardente[a], qu’il avait prise sur l’autel avec des pincettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pierre brûlante ». Le terme hébreu peut désigner une pierre chauffée ou une braise prise sur l’autel.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיָּעָף אֵלַי
  choice: vola vers moi
  rationale: Le verbe עוּף exprime le vol, tandis que אֵלַי indique un mouvement en direction du prophète. « Vola vers moi » rend naturellement les deux éléments.
- source_word: אֶחָד מִן הַשְּׂרָפִים
  choice: l’un des séraphins
  rationale: « Séraphins » est le terme français établi pour ces êtres célestes particuliers de la vision d’Ésaïe, sans imposer la glose étymologique « êtres brûlants ».
- source_word: וּבְיָדוֹ
  choice: Il tenait à la main
  rationale: La proposition nominale indique que l’objet se trouvait dans sa main. Cette formulation est naturelle en français et conserve l’image concrète.
- source_word: רִצְפָּה
  choice: une braise ardente
  rationale: Le mot peut désigner une pierre chauffée ou une braise provenant de l’autel. « Braise ardente » exprime clairement la chaleur de l’objet dans un français actuel.
- source_word: בְּמֶלְקַחַיִם
  choice: avec des pincettes
  rationale: Le nom désigne l’instrument servant à saisir l’objet brûlant. « Pincettes » convient au contexte de l’autel et demeure immédiatement compréhensible.
- source_word: לָקַח
  choice: qu’il avait prise
  rationale: L’accompli décrit vraisemblablement une action antérieure au vol du séraphin; le plus-que-parfait restitue cette relation temporelle.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: מֵעַל signifie littéralement « de dessus ». Avec « prendre », le français « prise sur l’autel » rend sobrement l’origine de la braise.
theological_decisions:
- issue: Désignation des שְׂרָפִים dans la vision céleste
  choice: séraphins
  alternative: êtres brûlants
  rationale: La translittération consacrée préserve l’identité littéraire de cette catégorie d’êtres célestes et évite de transformer une étymologie possible en interprétation explicite.
- issue: Nature de רִצְפָּה dans la scène de purification
  choice: braise ardente
  alternative: pierre brûlante
  rationale: Le contexte établit qu’il s’agit d’un objet brûlant pris sur l’autel, mais le terme hébreu peut aussi évoquer une pierre chauffée. Le texte principal emploie l’expression française la plus naturelle, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque est divisée en deux phrases françaises pour éviter une coordination lourde, sans modifier la progression de la scène.
