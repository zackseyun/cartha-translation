  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
translation:
  language: fr
  text: L’année de la mort du roi Ozias, je vis le Seigneur, haut et élevé, assis sur un trône. Les pans de son vêtement[a] remplissaient le temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa traîne ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « palais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: L’année de la mort de
  rationale: Cette formulation française naturelle conserve l’expression temporelle et présente מוֹת comme l’événement de la mort.
- source_word: הַמֶּלֶךְ עֻזִּיָּהוּ
  choice: du roi Ozias
  rationale: Le titre suivi du nom se rend idiomatiquement ainsi en français; «Ozias» est la forme française traditionnelle et largement reconnue du nom biblique.
- source_word: וָאֶרְאֶה
  choice: je vis
  rationale: Le passé simple convient au récit solennel et ponctuel de la vision tout en restant compréhensible en français moderne.
- source_word: אֶת אֲדֹנָי
  choice: le Seigneur
  rationale: אֲדֹנָי est ici le titre divin, distinct du tétragramme; «le Seigneur» en conserve la valeur sans introduire le nom d’alliance.
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: assis sur un trône
  rationale: Le participe décrit la posture royale du Seigneur; cette expression est claire et naturelle en français.
- source_word: רָם וְנִשָּׂא
  choice: haut et élevé
  rationale: Le double qualificatif préserve le parallélisme appuyé et l’imagerie d’exaltation du texte hébreu, sans réduire les deux termes à un seul.
- source_word: שׁוּלָיו
  choice: les pans de son vêtement
  rationale: Le pluriel désigne les parties inférieures ou retombantes du vêtement. «Les pans de son vêtement» rend concrètement l’image; «sa traîne» demeure une autre traduction possible.
- source_word: מְלֵאִים אֶת הַהֵיכָל
  choice: remplissaient le temple
  rationale: Le participe pluriel s’accorde avec les pans du vêtement et décrit une scène en cours. Dans ce contexte visionnaire de sanctuaire, «temple» est le sens le plus probable de הֵיכָל.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: le Maître
  rationale: Le texte emploie le titre אֲדֹנָי et non le nom YHWH. «Le Seigneur» maintient cette distinction et la portée divine du titre.
- issue: Sens de הֵיכָל dans la vision
  choice: temple
  alternative: palais
  rationale: Le mot peut désigner un palais ou un temple. Le contexte immédiat de la vision, avec les séraphins et l’acclamation de sainteté, favorise le sanctuaire, tandis que le trône conserve la dimension royale de la scène.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le registre visionnaire sans archaïsme excessif. La répétition «haut et élevé» est volontaire afin de préserver l’intensité de l’expression hébraïque.
