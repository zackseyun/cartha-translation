source:
  edition: WLC
  text: וּ/פָרָ֤ה וָ/דֹב֙ תִּרְעֶ֔ינָה יַחְדָּ֖ו יִרְבְּצ֣וּ יַלְדֵי/הֶ֑ן וְ/אַרְיֵ֖ה כַּ/בָּקָ֥ר יֹֽאכַל תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
translation:
  language: fr
  text: La vache et l’ours paîtront[a] ; leurs petits se coucheront ensemble, et le lion mangera de la paille comme le bœuf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se nourriront ». Le verbe hébreu peut désigner plus généralement le fait de se nourrir, mais « paître » conserve bien l’image des animaux au pâturage.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme le bétail ». Le mot hébreu בָּקָר peut désigner collectivement le bétail aussi bien qu’un bovin particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרָה
  choice: la vache
  rationale: פָרָה désigne une vache ou une génisse. « La vache » est ici le terme courant qui convient au parallélisme entre animaux.
- source_word: וָדֹב
  choice: l’ourse
  rationale: דֹב désigne un ours ; la forme verbale féminine plurielle qui régit la vache et l’animal indique ici une femelle. « L’ourse » rend cette donnée grammaticale et s’accorde avec la mention de leurs petits.
- source_word: תִּרְעֶינָה
  choice: paîtront
  rationale: Le qal de רעה décrit ici l’action de se nourrir au pâturage. « Paîtront » conserve l’image concrète tout en s’appliquant naturellement aux deux animaux dans cette scène prophétique.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe signifie « ensemble » ou « réunis ». Sa place près de « se coucheront » donne une phrase française fluide sans modifier le sens.
- source_word: יִרְבְּצוּ
  choice: se coucheront
  rationale: רבץ désigne couramment des animaux qui se couchent ou reposent. « Se coucheront » est précis et naturel.
- source_word: יַלְדֵיהֶן
  choice: leurs petits
  rationale: Le terme signifie littéralement « leurs enfants/leurs petits ». Pour des animaux, « leurs petits » est l’équivalent français idiomatique.
- source_word: וְאַרְיֵה
  choice: et le lion
  rationale: Traduction directe et usuelle de אַרְיֵה.
- source_word: כַּבָּקָר
  choice: comme le bétail
  rationale: בָּקָר désigne souvent collectivement les bovins ou le gros bétail. « Comme le bétail » préserve ce sens collectif et forme en français une comparaison naturelle avec la manière dont le lion mangera.
- source_word: יֹאכַל
  choice: mangera
  rationale: Dans cette description prophétique, l’imparfait hébreu s’exprime naturellement par le futur français.
- source_word: תֶּבֶן
  choice: de la paille
  rationale: תֶּבֶן désigne la paille ou les tiges sèches employées comme fourrage. « De la paille » est clair, concret et conventionnel dans ce contexte.
theological_decisions:
- issue: Nature de l’image de paix entre les animaux
  choice: Présenter concrètement la création réconciliée sans préciser si l’accomplissement est littéral, symbolique ou les deux.
  alternative: Interpréter explicitement la scène soit comme une simple image de paix politique entre humains, soit comme une transformation zoologique strictement littérale.
  rationale: L’hébreu donne une scène animale saisissante, mais le verset ne tranche pas lui-même la question de son mode d’accomplissement. La traduction conserve donc l’image et sa tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste sobre et imagée. « L’ourse » explicite le genre indiqué par l’accord verbal hébreu ; « le bétail » maintient le caractère collectif possible de בָּקָר.
