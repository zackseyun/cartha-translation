  text: וְ/הָ֥יָה צֶ֖דֶק אֵז֣וֹר מָתְנָ֑י/ו וְ/הָ/אֱמוּנָ֖ה אֵז֥וֹר חֲלָצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/005.yaml
  text: Righteousness will be the belt of his waist[b][a], and faithfulness the belt of his loins.
translation:
  language: fr
  text: 'La justice[a] sera la ceinture autour de sa taille,

    et la fidélité[b], la ceinture autour de ses hanches.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la constance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce discours prophétique, le parfait avec waw prend naturellement une valeur future. Le français peut omettre le « et » initial sans perdre le lien avec le contexte.
- source_word: צֶדֶק
  choice: la justice
  rationale: Le terme désigne ce qui est juste ou droit. Dans le contexte du règne et des jugements du souverain annoncé, « justice » rend directement sa qualité morale et judiciaire, tout en laissant « droiture » comme possibilité.
- source_word: אֵזוֹר
  choice: la ceinture
  rationale: Terme concret désignant ce qui entoure le corps; « ceinture » est moderne, clair et conserve l'image.
- source_word: מָתְנָיו
  choice: sa taille
  rationale: Le mot désigne la région de la taille ou des reins. « Taille » est naturel en français et permet de distinguer les deux termes corporels du parallélisme.
- source_word: וְהָאֱמוּנָה
  choice: et la fidélité
  rationale: אֱמוּנָה exprime ici la fermeté fiable, la constance ou la fidélité du souverain. « Fidélité » est idiomatique et convient à une qualité personnelle.
- source_word: אֵזוֹר
  choice: la ceinture
  rationale: La répétition est maintenue afin de préserver le parallélisme poétique hébreu.
- source_word: חֲלָצָיו
  choice: ses reins
  rationale: Le terme renvoie aux reins ou aux hanches. « Reins » conserve l'image corporelle biblique et distingue ce membre de « taille » dans le premier vers.
theological_decisions:
- issue: Rendu des deux qualités du souverain annoncé
  choice: « justice » et « fidélité » comme qualités caractérisant le souverain
  alternative: « droiture » et « constance »
  rationale: Le verset présente poétiquement ces qualités comme une ceinture. Le rendu conserve l'image et sa portée éthique sans ajouter de formulation christologique ou systématique absente de l'hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la métaphore vestimentaire sont conservés; « taille » et « reins » rendent distinctement les deux termes anatomiques hébreux.
