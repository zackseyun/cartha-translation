  source_fidelity: La proposition « se dressera » transforme le participe hébreu עֹמֵד (« qui se tient / se dresse ») en futur, alors que le futur explicite porte sur la recherche des nations et sur la proposition finale. יִדְרֹשׁוּ signifie plus directement « rechercheront » que « se tourneront vers ». « Gloire » rend bien כָּבוֹד comme nom prédicatif, et « lieu de repos » est une restitution défendable de מְנֻחָתוֹ.
  naturalness: La formulation révisée reste fluide dans un registre prophétique moderne. La reprise masculine « lui » suit le référent personnel implicite porté par le masculin hébreu, malgré l’image française grammaticalement féminine de « racine ».
  terminology: « Racine de Jessé », « étendard », « peuples », « nations » et « gloire » conservent les images et termes essentiels sans identification doctrinale ajoutée.
