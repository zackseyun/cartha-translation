  - severity: low
    issue: « se tourneront vers lui » atténue יִדְרֹשׁוּ
    rationale: Le verbe דרש porte ici l’idée de chercher ou rechercher. « Rechercheront » est plus proche tout en ne précisant pas indûment le type de démarche.
