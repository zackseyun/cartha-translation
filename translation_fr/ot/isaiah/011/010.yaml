  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא שֹׁ֣רֶשׁ יִשַׁ֗י אֲשֶׁ֤ר עֹמֵד֙ לְ/נֵ֣ס עַמִּ֔ים אֵלָ֖י/ו גּוֹיִ֣ם יִדְרֹ֑שׁוּ וְ/הָיְתָ֥ה מְנֻחָת֖/וֹ כָּבֽוֹד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: fr
  text: 'En ce jour-là, la racine de Jessé, qui se tient comme un étendard pour les peuples : les nations le rechercheront, et son lieu de repos sera gloire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  choice: la racine de Jessé
  rationale: Conserve l’image hébraïque littérale et sa portée dynastique, sans la remplacer par une interprétation explicative.
- source_word: עֹמֵד לְנֵס עַמִּים
  choice: se dressera comme un étendard pour les peuples
  rationale: « Se dresser » rend naturellement la posture exprimée par עֹמֵד dans ce contexte, tandis qu’« étendard » traduit l’image de נֵס comme signe visible de ralliement.
- source_word: אֵלָיו גּוֹיִם יִדְרֹשׁוּ
  choice: Les nations se tourneront vers lui
  rationale: ידרשו exprime ici le fait de rechercher, consulter ou se mettre en quête de quelqu’un. « Se tourneront vers » restitue naturellement cette orientation sans préciser indûment sa modalité.
- source_word: מְנֻחָתוֹ
  choice: son lieu de repos
  rationale: Le nom peut désigner le repos ou le lieu où l’on repose. Le contexte et le suffixe personnel favorisent ici le sens concret de demeure ou lieu de repos.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Maintient le prédicat nominal hébreu plutôt que de l’aplanir en adjectif (« glorieux »), préservant ainsi sa formulation forte et ouverte.
theological_decisions:
- issue: Identification de « la racine de Jessé »
  choice: Conserver l’expression imagée sans identifier explicitement son référent dans le corps du verset.
  alternative: Traduire ou annoter explicitement « le Messie » ou un descendant précis de Jessé.
  rationale: Le texte prophétique donne une image dynastique sans employer ici un titre messianique explicite; la traduction ne doit pas résoudre cette identification à la place du lecteur.
- issue: Nature de la démarche des nations
  choice: « se tourneront vers lui »
  alternative: « le consulteront », « le rechercheront » ou « mettront leur espérance en lui »
  rationale: L’hébreu permet les idées de recherche et de consultation. Le choix retenu conserve l’orientation vers cette figure tout en évitant d’imposer une nuance cultuelle, politique ou psychologique unique.
- issue: Construction finale « son lieu de repos sera gloire »
  choice: Préserver « gloire » comme nom prédicatif.
  alternative: « son lieu de repos sera glorieux »
  rationale: La construction hébraïque est nominale et plus saisissante. La formulation française, volontairement élevée mais intelligible, respecte cette tension au lieu de la normaliser.
translation_notes:
  register: Français moderne, international et digne. Le rythme prophétique est conservé en deux phrases pour la clarté. Aucun archaïsme ni développement confessionnel n’est ajouté.
