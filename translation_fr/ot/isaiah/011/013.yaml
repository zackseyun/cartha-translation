  variant: modern international French
source:
  edition: WLC
  text: וְ/סָ֨רָה֙ קִנְאַ֣ת אֶפְרַ֔יִם וְ/צֹרְרֵ֥י יְהוּדָ֖ה יִכָּרֵ֑תוּ אֶפְרַ֨יִם֙ לֹֽא יְקַנֵּ֣א אֶת יְהוּדָ֔ה וִֽ/יהוּדָ֖ה לֹֽא יָצֹ֥ר אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
translation:
  language: fr
  text: La jalousie d’Éphraïm disparaîtra[a], et les adversaires de Juda seront retranchés ; Éphraïm ne sera pas jaloux de Juda[a], et Juda ne traitera pas Éphraïm comme un ennemi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’envie » et « n’enviera pas » ; le terme hébreu peut exprimer la jalousie ou l’envie née d’une rivalité.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne harcèlera pas Éphraïm » ou « n’opprimera pas Éphraïm » ; le verbe hébreu peut exprimer l’hostilité, le harcèlement ou l’oppression.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה
  choice: disparaîtra
  rationale: Le verbe סור présente ici la jalousie comme quelque chose qui s’éloigne ou disparaît. « Disparaîtra » restitue naturellement cette image en français moderne.
- source_word: קִנְאַת / יְקַנֵּא
  choice: la jalousie / ne sera pas jaloux de
  rationale: Dans le contexte de la rivalité entre Éphraïm et Juda, קנא/קנאה désigne vraisemblablement une jalousie envieuse. La répétition du même champ lexical est conservée.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est translittéré sans expliciter son référent collectif, afin de préserver la formulation historique et poétique de l’hébreu.
- source_word: וְצֹרְרֵי יְהוּדָה
  choice: et les adversaires de Juda
  rationale: Le participe substantivé désigne ceux qui se comportent en ennemis de Juda. « Adversaires » reste assez large pour ne pas limiter leur hostilité à la guerre ou à l’oppression.
- source_word: יִכָּרֵתוּ
  choice: seront retranchés
  rationale: Le nifal de כרת signifie couramment « être retranché ». Cette formulation française conserve la force de l’idiome hébreu sans préciser indûment la modalité de leur disparition.
- source_word: לֹא יָצֹר אֶת אֶפְרָיִם
  choice: ne traitera pas Éphraïm en ennemi
  rationale: Le verbe exprime une conduite hostile et peut, selon le contexte, évoquer le harcèlement ou l’oppression. Cette traduction maintient l’idée fondamentale d’inimitié sans imposer une forme particulière d’agression.
theological_decisions:
- issue: Référent d’Éphraïm et de Juda
  choice: Conserver les noms « Éphraïm » et « Juda ».
  alternative: Expliciter « le royaume du Nord » et « le royaume du Sud », ou remplacer Éphraïm par Israël.
  rationale: Le texte hébreu emploie directement ces deux noms. Les conserver respecte sa texture historique et poétique ainsi que l’ambivalence entre tribu, territoire et entité politique.
- issue: Nature de la réconciliation annoncée
  choice: Décrire la fin de la jalousie et de l’hostilité mutuelles sans préciser davantage son accomplissement.
  alternative: Interpréter explicitement le verset comme une réunification politique, messianique ou eschatologique.
  rationale: Le contexte annonce une réconciliation, mais ce verset n’en définit pas à lui seul toutes les modalités théologiques ou historiques.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme entre Éphraïm et Juda est conservé. « Retranchés » garde l’image forte de כרת tout en restant intelligible dans un registre biblique courant.
