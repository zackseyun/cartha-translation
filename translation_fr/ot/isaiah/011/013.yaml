  rationale: 'Une seule retouche stylistique sûre est apportée : l’ajout de « comme un » rend l’expression française naturelle tout en préservant l’ambiguïté lexicale de יָצֹר, que la note explicite. Le sens, les noms, la structure parallèle et les ancrages de notes sont inchangés.'
