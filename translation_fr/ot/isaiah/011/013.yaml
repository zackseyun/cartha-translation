  source_fidelity: 'Le texte rend fidèlement les quatre mouvements du verset : disparition de la jalousie d’Éphraïm, retranchement des adversaires de Juda, cessation de la jalousie d’Éphraïm envers Juda et cessation de l’hostilité de Juda envers Éphraïm. Les noms propres et le parallélisme sont conservés. « Retranchés » correspond de manière appropriée à יִכָּרֵתוּ, sans préciser le mode de cette élimination.'
