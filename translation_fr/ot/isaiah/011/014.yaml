id: ISA.11.14
reference: Isaiah 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
translation:
  language: fr
  text: Ils fondront sur le flanc des Philistins, à l’ouest[a] ; ensemble, ils pilleront les peuples de l’Orient[b]. Édom et Moab tomberont sous leur pouvoir[c], et les Ammonites leur obéiront[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur l’épaule des Philistins, vers la mer ». L’expression peut désigner leur flanc ou la région philistine située à l’ouest.'
    reason: Précision lexicale et géographique.
  - marker: b
    text: 'Littéralement : « les fils de l’Orient » ; autre traduction : « les gens de l’est ».'
    reason: Conservation de l’idiome hébraïque et de son équivalent.
  - marker: c
    text: 'Littéralement : « Édom et Moab seront l’extension de leur main ». Le sens peut aussi être rendu : « seront sous leur main » ou « ils étendront la main sur Édom et Moab ».'
    reason: L’expression hébraïque est condensée et permet plusieurs formulations proches concernant l’exercice du pouvoir ou l’attaque.
  - marker: d
    text: 'Littéralement : « les fils d’Ammon seront leur obéissance » ; autre traduction : « les Ammonites leur seront soumis ».'
    reason: Précision sur la construction nominale et son sens de sujétion.
lexical_decisions:
- source_word: וְעָפוּ
  choice: ils fondront sur
  rationale: Le verbe signifie littéralement « voler ». Dans ce contexte militaire, « fondre sur » conserve l’image d’un mouvement aérien rapide tout en exprimant clairement l’attaque.
- source_word: בְכָתֵף פְּלִשְׁתִּים
  choice: sur le flanc des Philistins
  rationale: כָּתֵף signifie littéralement « épaule », mais peut désigner un côté, un versant ou un flanc. « Flanc » garde la métaphore corporelle dans une expression militaire naturelle en français.
- source_word: יָמָּה
  choice: à l’ouest
  rationale: L’adverbe directionnel formé sur « mer » signifie couramment « vers l’ouest » dans la géographie biblique.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: Équivalent direct et naturel exprimant leur action commune.
- source_word: יָבֹזּוּ
  choice: ils pilleront
  rationale: בזז désigne le pillage ou la prise de butin dans un contexte militaire.
- source_word: בְּנֵי קֶדֶם
  choice: les peuples de l’Orient
  rationale: Littéralement « les fils de l’Orient », cette expression hébraïque désigne les populations établies à l’est. La formulation retenue rend l’idiome en français courant.
- source_word: מִשְׁלוֹחַ יָדָם
  choice: tomberont sous leur pouvoir
  rationale: L’expression nominale, littéralement « l’envoi / l’extension de leur main », évoque la portée de leur action et leur domination. La traduction française explicite ce sens sans réduire le contexte militaire.
- source_word: מִשְׁמַעְתָּם
  choice: leur obéiront
  rationale: Le nom dérivé de שׁמע exprime ici l’obéissance ou la sujétion ; la forme verbale française est claire et idiomatique.
- source_word: אֱדוֹם וּמוֹאָב
  choice: Édom et Moab
  rationale: Formes françaises usuelles des noms propres bibliques.
- source_word: וּבְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Littéralement « les fils d’Ammon » ; « les Ammonites » est l’équivalent ethnonymique naturel en français.
theological_decisions:
- issue: Faut-il atténuer les images de conquête en simple influence politique ?
  choice: Conserver explicitement les notions d’attaque, de pillage, de domination et d’obéissance.
  alternative: Employer des termes généraux évoquant seulement une influence ou une prééminence politique.
  rationale: L’hébreu recourt à des images et à des termes vigoureux d’assaut, de pillage et de sujétion. Le contexte prophétique de restauration ne justifie pas d’en atténuer la force.
- issue: Comment rendre l’expression ambiguë מִשְׁלוֹחַ יָדָם ?
  choice: « tomberont sous leur pouvoir », avec une note donnant la forme imagée et d’autres lectures possibles.
  alternative: « seront l’extension de leur main » ou « ils étendront la main sur Édom et Moab ».
  rationale: La construction hébraïque est nominale et condensée. Le texte principal doit rester intelligible en français, tandis que la note préserve son image et son éventail interprétatif.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Fondront sur » conserve l’image vive du vol hostile ; « peuples de l’Orient » et « Ammonites » rendent naturellement les désignations sémitiques, tandis que les notes en donnent la forme littérale.
