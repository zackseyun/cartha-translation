  variant: modern international French
source:
  edition: WLC
  text: וְ/גָ֤ר זְאֵב֙ עִם כֶּ֔בֶשׂ וְ/נָמֵ֖ר עִם גְּדִ֣י יִרְבָּ֑ץ וְ/עֵ֨גֶל וּ/כְפִ֤יר וּ/מְרִיא֙ יַחְדָּ֔ו וְ/נַ֥עַר קָטֹ֖ן נֹהֵ֥ג בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/006.yaml
  text: And the wolf will dwell with the lamb[a], and the leopard will lie down with the young goat; and the calf and the young lion and the fattened calf will be together[d][c][b], and a little boy will lead them.
translation:
  language: fr
  text: Le loup habitera avec l’agneau[a], et le léopard se couchera avec le chevreau. Le veau, le jeune lion et la bête engraissée seront ensemble, et un petit garçon les conduira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « séjournera auprès de l’agneau ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un jeune enfant les mènera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָר
  choice: habitera
  rationale: Le qal de גור exprime ici le fait de séjourner ou d’habiter. « Habitera » est naturel en français et met en valeur la cohabitation paisible sans imposer l’idée d’une résidence seulement temporaire.
- source_word: זְאֵב
  choice: le loup
  rationale: Équivalent français courant du nom de l’animal.
- source_word: עִם
  choice: avec
  rationale: La préposition exprime l’association ou la proximité; « avec » convient naturellement aux parallélismes du verset.
- source_word: כֶּבֶשׂ
  choice: l’agneau
  rationale: Dans ce contraste poétique entre prédateur et proie vulnérable, « agneau » rend bien le terme et l’image.
- source_word: וְנָמֵר
  choice: le léopard
  rationale: Équivalent français usuel du nom de l’animal.
- source_word: גְּדִי
  choice: le chevreau
  rationale: Le terme désigne le petit de la chèvre; « chevreau » est précis, courant et non ambigu en français.
- source_word: יִרְבָּץ
  choice: se couchera
  rationale: Le verbe רבץ décrit souvent un animal qui se couche ou reste étendu. « Se couchera » préserve ici l’image de repos paisible.
- source_word: וְעֵגֶל
  choice: le veau
  rationale: Rendu français standard pour un jeune bovin.
- source_word: וּכְפִיר
  choice: le jeune lion
  rationale: כפיר désigne un lion jeune. « Jeune lion » conserve le registre poétique et n’en réduit pas nécessairement le sens à un très petit lionceau.
- source_word: וּמְרִיא
  choice: la bête engraissée
  rationale: Le nom désigne un animal gras ou engraissé, sans préciser explicitement son espèce dans ce verset. « Bête engraissée » conserve cette relative indétermination, contrairement à « veau engraissé ».
- source_word: יַחְדָּו
  choice: seront ensemble
  rationale: L’adverbe signifie « ensemble ». L’ajout de « seront » produit une proposition française complète tout en restant fidèle à la séquence nominale hébraïque.
- source_word: וְנַעַר קָטֹן
  choice: un petit garçon
  rationale: נַעַר désigne ici un garçon ou jeune garçon et קָטֹן souligne sa petitesse ou son jeune âge. « Petit garçon » garde le masculin singulier et la vivacité de l’image.
- source_word: נֹהֵג בָּם
  choice: les conduira
  rationale: Le participe de נהג peut signifier conduire ou mener. Le futur convient au contexte prophétique et « les conduira » exprime clairement qu’un jeune enfant dirigera les animaux.
theological_decisions:
- issue: Nature des images du règne de paix
  choice: Conserver telles quelles les associations concrètes d’animaux dans une formulation prophétique et poétique.
  alternative: Les expliciter soit comme une transformation zoologique strictement littérale à venir, soit comme une simple métaphore de la réconciliation politique entre humains.
  rationale: L’hébreu présente directement des animaux prédateurs et domestiques vivant en paix. La traduction préserve cette image et laisse ouverte sa portée littérale, symbolique ou conjointe.
translation_notes:
  register: Français international moderne, clair et digne, avec un rythme poétique simple. Les noms d’animaux restent concrets; « bête engraissée » évite d’ajouter une espèce absente de l’hébreu. Les deux notes ne retiennent que les variantes françaises qui apportent une nuance réelle.
