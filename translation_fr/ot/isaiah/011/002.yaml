base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
translation:
  language: fr
  text: 'L’Esprit de Yahweh[c] reposera sur lui : esprit de sagesse et d’intelligence[a], esprit de conseil et de puissance, esprit de connaissance et de crainte de Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Après « l’Esprit de Yahweh », l’hébreu répète trois fois le mot « esprit ». Ces expressions soulignent les qualités ou les opérations de cet unique Esprit : sagesse et intelligence, conseil et puissance, connaissance et crainte de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « respect profond pour Yahweh ». L’expression hébraïque désigne une crainte révérencielle, et non une simple terreur.
    reason: lexical_alternative
  - marker: c
    text: « Yahweh » transcrit le nom divin représenté en hébreu par les quatre lettres YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָחָה עָלָיו
  choice: reposera sur lui
  rationale: Le verbe נוח exprime ici le fait de venir reposer et de demeurer. Le futur convient au contexte prophétique, tandis que « sur lui » rend naturellement עָלָיו.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans ce contexte d’habilitation du roi à venir, רוּחַ désigne l’Esprit de Dieu. La majuscule signale ce référent, et le nom divin יהוה est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: רוּחַ חָכְמָה וּבִינָה
  choice: esprit de sagesse et d’intelligence
  rationale: La reprise de רוּחַ développe par apposition les qualités ou les opérations de l’Esprit de Yahweh. « Intelligence » rend directement בִינָה, qui peut aussi évoquer le discernement.
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  choice: esprit de conseil et de puissance
  rationale: עֵצָה évoque le conseil avisé propre à l’exercice du gouvernement. גְבוּרָה désigne la force ou la puissance; « puissance » forme ici une expression française naturelle et digne.
- source_word: רוּחַ דַּעַת וְיִרְאַת יְהוָה
  choice: esprit de connaissance et de crainte de Yahweh
  rationale: דַּעַת est rendu par « connaissance ». « Crainte de Yahweh » conserve la force et l’épaisseur biblique de יִרְאַת יְהוָה sans la réduire à la terreur ni l’adoucir en simple respect.
theological_decisions:
- issue: Les reprises de רוּחַ désignent-elles plusieurs esprits ou les aspects d’un seul Esprit ?
  choice: Les présenter comme des appositions descriptives de l’Esprit de Yahweh, tout en conservant chaque reprise du mot « esprit ».
  alternative: Y voir une énumération de plusieurs esprits ou de sept dons distinctement comptés.
  rationale: La syntaxe hébraïque fait suivre « l’Esprit de Yahweh » de trois groupes appositionnels. La traduction garde cette structure et sa possible portée symbolique sans imposer un système théologique.
- issue: Sens de יִרְאַת יְהוָה
  choice: crainte de Yahweh
  alternative: respect de Yahweh ou révérence envers Yahweh
  rationale: « Crainte » préserve la tension de l’expression hébraïque, qui comprend l’effroi respectueux et la révérence sans se limiter à l’un ou à l’autre.
translation_notes:
  register: Français international moderne, clair et digne. La cadence ternaire et la répétition de « esprit » reproduisent la structure poétique hébraïque; l’absence d’articles devant les trois appositions évite d’évoquer artificiellement plusieurs êtres distincts.
