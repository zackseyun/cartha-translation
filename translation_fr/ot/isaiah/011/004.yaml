source:
  edition: WLC
  text: וְ/שָׁפַ֤ט בְּ/צֶ֨דֶק֙ דַּלִּ֔ים וְ/הוֹכִ֥יחַ בְּ/מִישׁ֖וֹר לְ/עַנְוֵי אָ֑רֶץ וְ/הִֽכָּה אֶ֨רֶץ֙ בְּ/שֵׁ֣בֶט פִּ֔י/ו וּ/בְ/ר֥וּחַ שְׂפָתָ֖י/ו יָמִ֥ית רָשָֽׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
translation:
  language: fr
  text: Mais il jugera les pauvres avec justice[a] ; il tranchera avec équité en faveur des humbles de la terre[b]. Il frappera la terre[c] du bâton de sa bouche et, du souffle de ses lèvres, il mettra à mort le méchant[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec droiture » ; le terme hébreu peut exprimer aussi bien la justice que la rectitude.
    reason: lexical_alternative
  - marker: b
    text: Ou « des doux du pays » ou « des affligés de la terre ».
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « terre » peut aussi signifier « pays ».
    reason: lexical_alternative
  - marker: d
    text: Le singulier hébreu peut désigner les méchants en général ou un méchant particulier, une figure individuelle.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁפַט
  choice: Mais il jugera
  rationale: Le verbe garde son sens judiciaire et royal. « Mais » explicite le contraste avec le verset précédent, où son jugement ne dépend pas des apparences.
- source_word: בְּצֶדֶק
  choice: avec justice
  rationale: צֶדֶק désigne ici la conformité morale et judiciaire au droit. « Justice » est naturel en français et convient au contexte du jugement royal.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: דַּלִּים désigne les personnes pauvres, faibles ou socialement démunies. « Les pauvres » exprime clairement leur vulnérabilité dans ce contexte de justice.
- source_word: וְהוֹכִיחַ בְּמִישׁוֹר
  choice: il rendra des décisions équitables
  rationale: Le hiphil de יכח peut désigner une décision ou un arbitrage judiciaire, tandis que מִישׁוֹר évoque la droiture et l’équité. Cette formulation française rend ensemble les deux éléments.
- source_word: לְעַנְוֵי אָרֶץ
  choice: en faveur des humbles de la terre
  rationale: עָנָו peut évoquer l’humilité, la douceur ou l’affliction. « Humbles » préserve cette amplitude mieux qu’un terme exclusivement économique ou psychologique.
- source_word: וְהִכָּה אֶרֶץ
  choice: Il frappera la terre
  rationale: נכה signifie frapper, et אֶרֶץ peut désigner la terre ou le pays. « La terre » convient à la portée large du passage sans effacer l’autre possibilité.
- source_word: בְּשֵׁבֶט פִּיו
  choice: du bâton de sa bouche
  rationale: שֵׁבֶט peut être un bâton, une verge ou un sceptre. « Bâton » conserve l’image concrète d’une parole qui devient l’instrument du jugement.
- source_word: וּבְרוּחַ שְׂפָתָיו
  choice: du souffle de ses lèvres
  rationale: רוּחַ peut signifier souffle, vent ou esprit. Le parallélisme entre bouche et lèvres favorise ici le sens concret de « souffle ».
- source_word: יָמִית רָשָׁע
  choice: il fera mourir le méchant
  rationale: Le hiphil de מות signifie « faire mourir ». Le singulier רָשָׁע est conservé en français, où « le méchant » peut avoir une valeur générique tout en laissant ouverte une lecture individualisée.
theological_decisions:
- issue: Portée de אֶרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte à portée universelle favorise « terre », mais le mot hébreu peut également désigner un territoire ou un pays; cette possibilité est signalée en note.
- issue: Valeur du singulier רָשָׁע
  choice: le méchant, compris possiblement au sens générique
  alternative: le Méchant, comme figure individuelle
  rationale: Le singulier hébreu peut représenter toute une catégorie ou désigner un individu. Le texte principal conserve le singulier sans imposer l’une de ces interprétations.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, avec une syntaxe naturelle. Les images de la bouche, du bâton, du souffle et des lèvres restent explicites; les ambiguïtés de עָנָו, אֶרֶץ et רָשָׁע sont signalées sans être résolues artificiellement.
