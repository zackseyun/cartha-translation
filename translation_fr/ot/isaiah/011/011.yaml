  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
translation:
  language: fr
  text: En ce jour-là, le Seigneur étendra de nouveau sa main, une seconde fois, pour reprendre le reste de son peuple qui subsistera, d’Assyrie, d’Égypte, de Patros, de Koush[a], d’Élam, de Shinéar, de Hamath et des îles de la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Koush désigne une région située au sud de l’Égypte, souvent associée à la Nubie ; certaines traductions emploient « Éthiopie ».
    reason: cultural_note
  - marker: b
    text: Ou « les régions côtières de la mer ». L’expression hébraïque peut désigner des îles ou, plus largement, des territoires maritimes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Rend naturellement la formule temporelle prophétique sans reproduire lourdement le verbe introductif hébreu.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Traduit le titre divin Adonaï, distinct du tétragramme.
- source_word: יוֹסִיף ... שֵׁנִית יָדוֹ
  choice: étendra de nouveau la main, une seconde fois
  rationale: Conserve l’image anthropomorphique de la main ainsi que les deux marques hébraïques de répétition.
- source_word: לִקְנוֹת
  choice: pour reprendre possession de
  rationale: Le verbe signifie fondamentalement acquérir ou obtenir. Dans ce contexte de rassemblement d’un peuple déjà sien, « reprendre possession de » exprime la réappropriation sans introduire le sens théologique plus chargé de « racheter ».
- source_word: שְׁאָר עַמּוֹ אֲשֶׁר יִשָּׁאֵר
  choice: du reste de son peuple qui subsistera
  rationale: « Reste » garde le terme prophétique établi, tandis que « subsistera » restitue la reprise étymologique du radical שׁאר sans une répétition française maladroite.
- source_word: אִיֵּי הַיָּם
  choice: les îles de la mer
  rationale: Rend directement l’expression hébraïque, tout en signalant en note son extension possible aux régions côtières.
theological_decisions:
- issue: Sens de לִקְנוֹת appliqué au reste du peuple
  choice: reprendre possession de
  alternative: acquérir ; recouvrer ; racheter
  rationale: « Reprendre possession de » respecte le noyau d’acquisition du verbe et le contexte d’un peuple déjà appelé « son peuple ». « Racheter » ajouterait une nuance sotériologique qui n’est pas portée à elle seule par ce verbe.
- issue: Maintien de l’image de la main divine
  choice: étendra de nouveau la main, une seconde fois
  alternative: interviendra de nouveau ; ramènera une seconde fois
  rationale: Le texte mentionne explicitement la main du Seigneur. Garder cette image préserve sa force rhétorique et laisse intacte la tension entre image et action.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les toponymes anciens sont translittérés selon des formes françaises usuelles. La structure solennelle de l’énumération et l’image de la main divine sont conservées.
