revisions:
- from: 'En ce jour-là, le Seigneur étendra de nouveau la main, une seconde fois, pour reprendre possession du reste de son peuple qui subsistera : en Assyrie, en Égypte, à Patros, à Koush[a], en Élam, à Shinéar, à Hamath et dans les îles de la mer[b].'
  to: En ce jour-là, le Seigneur étendra de nouveau sa main, une seconde fois, pour reprendre le reste de son peuple qui subsistera, d’Assyrie, d’Égypte, de Patros, de Koush[a], d’Élam, de Shinéar, de Hamath et des îles de la mer[b].
  rationale: La révision rétablit la valeur de provenance des prépositions hébraïques et allège le rendu de לִקְנוֹת dans un français naturel, tout en conservant l’image explicite de la main, la répétition « de nouveau, une seconde fois », l’ambiguïté géographique de אִיֵּי הַיָּם et les toponymes traditionnels.
