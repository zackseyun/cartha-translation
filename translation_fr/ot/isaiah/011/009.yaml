id: ISA.11.9
reference: Isaiah 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
translation:
  language: fr
  text: Ils ne feront aucun mal et ne causeront aucune destruction sur toute ma montagne sainte, car la terre sera remplie de la connaissance de Yahvé, comme les eaux couvrent la mer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרֵעוּ
  choice: feront aucun mal
  rationale: Le hifil de רעע exprime ici le fait de causer du mal; avec la négation, « ne feront aucun mal » est naturel et concret dans cet oracle de paix.
- source_word: יַשְׁחִיתוּ
  choice: ne détruiront rien
  rationale: Le hifil de שׁחת signifie couramment détruire ou ravager. « Ne détruiront rien » restitue directement l'action causative et forme un parallélisme idiomatique avec « ne feront aucun mal ».
- source_word: בְּכָל הַר קָדְשִׁי
  choice: sur toute ma montagne sainte
  rationale: ב est locatif; en français, « sur » convient naturellement à une montagne. כָל est explicitement rendu par « toute ».
- source_word: מָלְאָה
  choice: sera remplie
  rationale: L'accompli hébreu reçoit une valeur future dans ce discours prophétique. La tournure exprime l'état futur annoncé sans le présenter comme déjà réalisé.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: « Terre » convient à la portée ample de l'oracle et de la comparaison qui suit, tout en laissant le contexte déterminer l'étendue exacte.
- source_word: דֵּעָה אֶת יְהוָה
  choice: la connaissance de Yahvé
  rationale: La formule désigne une connaissance orientée vers Yahvé, et non de simples informations à son sujet.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כַּמַּיִם לַיָּם מְכַסִּים
  choice: comme les eaux couvrent la mer
  rationale: Cette formulation conserve le pluriel « les eaux », le participe à valeur générale et l'image concise de l'hébreu.
theological_decisions:
- issue: Étendue de l'oracle de paix
  choice: « la terre », suggérant une portée universelle
  alternative: « le pays », avec une portée territoriale plus locale
  rationale: הָאָרֶץ peut désigner soit la terre entière, soit le pays. L'image expansive des eaux couvrant la mer favorise ici « la terre », sans faire de cette portée une précision doctrinale ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme négatif est rendu de façon naturelle, sans alourdir le verset. Le nom divin est translittéré sous sa forme française usuelle.
