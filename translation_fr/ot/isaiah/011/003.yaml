  text: וַ/הֲרִיח֖/וֹ בְּ/יִרְאַ֣ת יְהוָ֑ה וְ/לֹֽא לְ/מַרְאֵ֤ה עֵינָי/ו֙ יִשְׁפּ֔וֹט וְ/לֹֽא לְ/מִשְׁמַ֥ע אָזְנָ֖י/ו יוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
translation:
  language: fr
  text: Il trouvera son plaisir dans la crainte de Yahvé[a]. Il ne jugera pas d’après ce que ses yeux voient et ne tranchera pas d’après ce que ses oreilles entendent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : «son flair sera dans la crainte de Yahvé» ; ou «sa perception sera dans la crainte de Yahvé». Le verbe hébreu est difficile et peut évoquer un discernement particulièrement fin.'
    reason: Alternative lexicale préservant l’image olfactive et l’ambiguïté de l’hébreu.
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  choice: Il trouvera son plaisir
  rationale: Le hifil de ריח est difficile ici. Une traduction olfactive littérale serait obscure en français. Dans ce contexte, l’expression décrit le profond accord du dirigeant avec la crainte de Yahvé, tout en pouvant évoquer une perception particulièrement fine; cette ambiguïté est signalée en note.
- source_word: בְּיִרְאַת
  choice: dans la crainte de
  rationale: Cette formulation conserve la construction hébraïque et le sens de respect mêlé de révérence devant Dieu, sans réduire יִרְאָה à une simple peur.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme «Yahvé» rend en français moderne le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: לְמַרְאֵה עֵינָיו
  choice: d’après ce que ses yeux voient
  rationale: Cette expression française naturelle préserve l’image concrète de la vue et indique que son jugement ne dépendra pas seulement des apparences visibles.
- source_word: יִשְׁפּוֹט
  choice: jugera
  rationale: שׁפט possède ici son sens judiciaire et gouvernemental direct.
- source_word: לְמִשְׁמַע אָזְנָיו
  choice: d’après ce que ses oreilles entendent
  rationale: La formulation garde le parallélisme sensoriel avec les yeux et évite de limiter le sens au seul ouï-dire.
- source_word: יוֹכִיחַ
  choice: tranchera
  rationale: Dans ce parallélisme judiciaire, le hifil de יכח signifie décider, arbitrer ou rendre une sentence. «Tranchera» est idiomatique et maintient une légère distinction avec «jugera».
theological_decisions:
- issue: Le discernement du futur dirigeant issu de David
  choice: Le verset présente ce dirigeant comme trouvant son plaisir dans la crainte de Yahvé et rendant ses décisions au-delà des seules apparences ou des seuls témoignages entendus.
  alternative: 'La première proposition peut mettre surtout l’accent sur une perception extraordinaire: «il percevra avec finesse dans la crainte de Yahvé».'
  rationale: Le contexte immédiat est celui du descendant de Jessé sur lequel repose l’Esprit. La traduction exprime sa disposition révérencieuse et son discernement exceptionnel sans préciser un mécanisme absent du texte; la difficulté de l’image olfactive est conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre les yeux et les oreilles est conservé, ainsi que la différence entre «juger» et «trancher». Le nom divin est rendu par «Yahvé».
