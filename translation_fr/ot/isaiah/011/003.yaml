    rationale: «Respirer» ne traduit pas adéquatement le champ de ריח («sentir», «flair», perception olfactive) et «respirer dans la crainte» est opaque en français. La note est précisément destinée à préserver l’ambiguïté lexicale; elle doit donc formuler l’alternative de manière exacte et intelligible.
