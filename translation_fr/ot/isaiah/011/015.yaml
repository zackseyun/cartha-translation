source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ים יְהוָ֗ה אֵ֚ת לְשׁ֣וֹן יָם מִצְרַ֔יִם וְ/הֵנִ֥יף יָד֛/וֹ עַל הַ/נָּהָ֖ר בַּ/עְיָ֣ם רוּח֑/וֹ וְ/הִכָּ֨/הוּ֙ לְ/שִׁבְעָ֣ה נְחָלִ֔ים וְ/הִדְרִ֖יךְ בַּ/נְּעָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
translation:
  language: fr
  text: Yahweh vouera à la destruction la langue de la mer d’Égypte[a]. Il agitera sa main contre le Fleuve[b], par l’ardeur de son vent[c] ; il le frappera pour en faire sept cours d’eau et y fera passer en sandales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le golfe d’Égypte » ou « le bras de mer d’Égypte » ; littéralement « la langue de la mer d’Égypte ».
    reason: Alternative lexicale et géographique pour לְשׁוֹן יָם מִצְרַיִם.
  - marker: b
    text: Probablement l’Euphrate.
    reason: Identification géographique probable de הַנָּהָר, « le Fleuve ».
  - marker: c
    text: L’hébreu est difficile ; on peut aussi comprendre « avec la chaleur de son vent » ou, selon une autre lecture, « par la puissance de son souffle ».
    reason: Préserver l’incertitude textuelle et lexicale de בַּעְיָם רוּחוֹ.
lexical_decisions:
- source_word: וְהֶחֱרִים
  choice: vouera à la destruction
  rationale: Le hiphil de חרם exprime d’abord la mise à l’interdit ou la consécration à la destruction. Cette formulation préserve ce sens fort sans substituer l’interprétation contextuelle « asséchera ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לְשׁוֹן יָם מִצְרַיִם
  choice: la langue de la mer d’Égypte
  rationale: « Langue » conserve l’image géographique concrète de לשון ; le sens possible de golfe ou bras de mer est signalé en note.
- source_word: וְהֵנִיף יָדוֹ
  choice: Il agitera la main
  rationale: La formulation garde le geste énergique de puissance exprimé par נוף au hiphil.
- source_word: הַנָּהָר
  choice: le Fleuve
  rationale: L’hébreu emploie le nom défini sans préciser son nom. La majuscule signale l’usage géographique traditionnel, tandis qu’une note donne l’identification probable.
- source_word: בַּעְיָם רוּחוֹ
  choice: sous le souffle brûlant de son vent
  rationale: La vocalisation massorétique בַּעְיָם est difficile. La traduction retient l’idée probable de chaleur brûlante tout en rendant רוח par « vent », conformément au contexte hydrologique ; une note préserve l’incertitude.
- source_word: וְהִכָּהוּ
  choice: il le frappera
  rationale: Rendu direct de נכה, avec le pronom masculin renvoyant au Fleuve.
- source_word: לְשִׁבְעָה נְחָלִים
  choice: pour en faire sept cours d’eau
  rationale: נחלים désigne des torrents, ruisseaux ou lits de cours d’eau. « Cours d’eau » reste naturel et ne décide pas si le nombre sept est littéral ou symbolique.
- source_word: וְהִדְרִיךְ בַּנְּעָלִים
  choice: permettra qu’on le traverse en sandales
  rationale: Le hiphil exprime le fait de faire marcher ou de rendre praticable le passage. Le sujet humain implicite est rendu par « on », sans identifier un groupe absent de l’hébreu.
theological_decisions:
- issue: Nature de l’image concernant la mer d’Égypte et le Fleuve
  choice: Présenter une intervention divine sur des eaux géographiques au moyen d’une imagerie prophétique élevée.
  alternative: Interpréter directement les eaux comme de purs symboles politiques ou réduire le passage à une typologie de l’Exode.
  rationale: Le texte évoque fortement la délivrance de l’Exode, mais la traduction conserve ses référents géographiques et laisse ouverte leur portée typologique ou symbolique.
- issue: Valeur du nombre sept
  choice: Conserver simplement « sept » dans le texte.
  alternative: Paraphraser comme « de nombreux cours d’eau » ou « sept cours d’eau symbolisant la totalité ».
  rationale: Le nombre peut être concret ou exprimer la plénitude ; la traduction ne tranche pas cette ambiguïté interprétative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’image inhabituelle de la « langue de la mer » est conservée pour sa force poétique et expliquée en note. Les phrases sont légèrement segmentées pour assurer la lisibilité tout en maintenant le parallélisme prophétique.
