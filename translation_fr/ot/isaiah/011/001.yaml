  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
translation:
  language: fr
  text: Alors un rejeton sortira de la souche de Jessé[a][b], et une jeune pousse issue de ses racines[c][d] portera du fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et un rejeton sortira de la souche de Jessé. » La conjonction peut se traduire simplement par « et » ; « alors » marque le passage du jugement précédent à une espérance renouvelée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une pousse », « une tige » ou « un rameau ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un surgeon » ou « un rameau » pour « une jeune pousse ». L’image peut avoir une portée messianique, mais le texte principal conserve son sens botanique ordinaire.'
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu emploie un suffixe possessif masculin singulier : « ses racines ». Il peut maintenir le lien avec Jessé dans l’image ; le français ne marque pas ce genre avec « ses ».'
    reason: source_form
lexical_decisions:
- source_word: וְיָצָא
  choice: Alors ... sortira
  rationale: Le verbe יצא signifie « sortir ». « Alors » rend le mouvement du jugement précédent vers l’espérance renouvelée, tandis que la note conserve la valeur plus simple de la conjonction.
- source_word: חֹטֶר
  choice: rejeton
  rationale: חֹטֶר désigne une pousse, une tige ou un rameau. « Rejeton » convient à la croissance surgissant d’une souche et garde en français une possible résonance dynastique sans l’imposer comme titre.
- source_word: מִגֵּזַע
  choice: de la souche
  rationale: גֵּזַע désigne la souche ou le tronc restant d’un arbre coupé. « Souche » exprime clairement l’image de vie nouvelle après l’abattage.
- source_word: יִשָׁי
  choice: Jessé
  rationale: Forme française conventionnelle du nom propre biblique.
- source_word: וְנֵצֶר
  choice: une jeune pousse
  rationale: נֵצֶר désigne une pousse fraîche, un surgeon ou un rameau. « Jeune pousse » conserve le sens botanique ordinaire et distingue le terme de חֹטֶר.
- source_word: מִשָּׁרָשָׁיו
  choice: issue de ses racines
  rationale: Le suffixe masculin singulier est préservé par « ses », dont le genre n’est pas marqué en français; « issue » explicite naturellement la provenance indiquée par מִן et s’accorde avec « pousse ».
- source_word: יִפְרֶה
  choice: portera du fruit
  rationale: פרה signifie « être fécond, porter du fruit ». Cette formulation achève naturellement l’image végétale et exprime une vitalité productive.
theological_decisions:
- issue: Résonance messianique de l’image végétale
  choice: Garder dans le texte principal le sens botanique et dynastique ordinaire, sans majuscule ni titre messianique ajouté.
  alternative: Employer « Germe » ou une majuscule afin de signaler explicitement un titre messianique.
  rationale: Le verset évoque directement une nouvelle croissance issue de la lignée de Jessé. Sa portée messianique peut ressortir du contexte canonique sans être introduite par une capitalisation ou un terme technique absent de l’hébreu.
- issue: Suffixe masculin dans מִשָּׁרָשָׁיו
  choice: Traduire par « ses racines » et signaler en note que l’hébreu porte littéralement « ses racines à lui ».
  alternative: Rapporter explicitement les racines à la souche par « les racines de celle-ci ».
  rationale: L’hébreu comporte un suffixe masculin singulier, susceptible de maintenir le lien avec Jessé au sein de la métaphore. Le français « ses » reste naturel mais ne rend pas ce genre visible; la note préserve donc l’information.
translation_notes:
  register: Français international moderne, clair et digne. La structure poétique en deux membres est conservée. « Rejeton » et « jeune pousse » évitent une répétition artificielle tout en distinguant les deux substantifs hébreux; aucune lecture confessionnelle n’est ajoutée au texte.
