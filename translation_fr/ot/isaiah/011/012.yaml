source:
  edition: WLC
  text: וְ/נָשָׂ֥א נֵס֙ לַ/גּוֹיִ֔ם וְ/אָסַ֖ף נִדְחֵ֣י יִשְׂרָאֵ֑ל וּ/נְפֻצ֤וֹת יְהוּדָה֙ יְקַבֵּ֔ץ מֵ/אַרְבַּ֖ע כַּנְפ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
translation:
  language: fr
  text: Il dressera un étendard pour les nations et rassemblera ceux d’Israël qui ont été chassés ; il réunira les dispersés de Juda[a] depuis les quatre extrémités de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « dispersés » est au féminin pluriel. Il peut toutefois désigner collectivement les personnes dispersées de Juda, et non exclusivement des femmes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis les quatre ailes de la terre », expression qui désigne ses extrémités les plus lointaines.'
    reason: cultural_note
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: Il dressera un étendard
  rationale: Avec נֵס, le verbe נשׂא décrit l’action de lever ou dresser un signe visible servant de point de ralliement. « Dresser un étendard » est naturel, digne et conserve cette image concrète.
- source_word: לַגּוֹיִם
  choice: pour les nations
  rationale: גּוֹיִם signifie normalement « nations ». La préposition ל indique ici que l’étendard est dressé à leur intention, comme signal de rassemblement.
- source_word: וְאָסַף נִדְחֵי יִשְׂרָאֵל
  choice: et rassemblera ceux d’Israël qui ont été chassés
  rationale: נדח désigne des personnes repoussées, chassées ou bannies. La formulation explicite garde la valeur passive et la force de l’expulsion sans suggérer qu’il s’agit simplement de personnes parties en exil.
- source_word: וּנְפֻצוֹת יְהוּדָה יְקַבֵּץ
  choice: il réunira les dispersés de Juda
  rationale: קבץ signifie réunir ou rassembler. « Réunira » évite une répétition lourde tout en conservant le parallélisme. נְפֻצוֹת est morphologiquement féminin pluriel, mais désigne vraisemblablement ici collectivement les personnes dispersées de Juda plutôt que les seules femmes.
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  choice: depuis les quatre extrémités de la terre
  rationale: כַּנְפוֹת signifie littéralement « ailes », et par extension « bords » ou « extrémités ». La traduction rend le sens spatial de l’expression tout en évitant de transformer l’image en affirmation cosmologique.
theological_decisions:
- issue: Portée du féminin pluriel dans וּנְפֻצוֹת יְהוּדָה
  choice: les dispersés de Juda
  alternative: les femmes dispersées de Juda
  rationale: Le féminin pluriel est réel dans la morphologie hébraïque, mais il peut s’expliquer par l’accord avec Juda envisagé comme entité collective. Le contexte parallèle avec les chassés d’Israël favorise une référence à l’ensemble des dispersés de Juda. Une note conserve l’information grammaticale sans limiter indûment le référent aux femmes.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: La mention des nations et des quatre extrémités donne à l’image une portée étendue. « La terre » convient mieux au contexte, tout en laissant à la note le soin d’expliquer l’image hébraïque.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le parallélisme poétique entre Israël et Juda. « Étendard », « rassembler » et « réunir » rendent l’image publique du signal et du retour sans ajouter d’interprétation confessionnelle.
