source:
  edition: WLC
  text: וְ/שִֽׁעֲשַׁ֥ע יוֹנֵ֖ק עַל חֻ֣ר פָּ֑תֶן וְ/עַל֙ מְאוּרַ֣ת צִפְעוֹנִ֔י גָּמ֖וּל יָד֥/וֹ הָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/008.yaml
  text: The nursing child will play over the cobra’s hole[b][a], and the weaned child will put his hand on the viper’s den.
translation:
  language: fr
  text: Le nourrisson jouera sur le trou du cobra[a], et l’enfant sevré étendra la main[b] sur le repaire de la vipère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aspic ». Le terme hébreu désigne un serpent venimeux traditionnellement identifié à l’aspic ou au cobra.
    reason: lexical_alternative
  - marker: b
    text: Ou « posera la main ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁעֲשַׁע
  choice: jouera
  rationale: Dans cette scène où un petit enfant ne court aucun danger auprès d’un serpent venimeux, le verbe évoque naturellement un jeu insouciant.
- source_word: יוֹנֵק
  choice: le nourrisson
  rationale: Le participe désigne un enfant qui tète encore. « Nourrisson » est courant en français et maintient le contraste avec l’enfant sevré.
- source_word: חֻר
  choice: trou
  rationale: Le nom désigne un trou ou une cavité; « trou » convient naturellement à l’abri d’un serpent.
- source_word: פָּתֶן
  choice: cobra
  rationale: Le terme désigne un serpent venimeux, traditionnellement identifié à l’aspic ou au cobra; « cobra » est immédiatement compréhensible aujourd’hui sans prétendre à une identification zoologique certaine.
- source_word: מְאוּרַת
  choice: repaire
  rationale: Dans ce contexte, le nom désigne l’abri ou la tanière du serpent. « Repaire » est naturel et permet de ne pas répéter « trou ».
- source_word: צִפְעוֹנִי
  choice: vipère
  rationale: Le mot désigne un serpent venimeux; « vipère » constitue un équivalent français clair sans identification zoologique excessivement précise.
- source_word: גָּמוּל
  choice: l’enfant sevré
  rationale: Le terme désigne explicitement un enfant qui a été sevré et préserve le parallélisme avec le nourrisson.
- source_word: יָדוֹ
  choice: la main
  rationale: En français, avec un sujet explicite, l’article défini est la tournure idiomatique pour une partie du corps et rend naturellement le suffixe possessif hébreu.
- source_word: הָדָה
  choice: étendra
  rationale: Le sens exact du verbe rare est discuté; « étendra la main » exprime le geste en conservant l’alternative possible « posera la main » en note.
theological_decisions:
- issue: Nature de l’image dans le contexte du règne de paix
  choice: Présenter directement l’image d’une paix et d’une sécurité extraordinaires, sans dire si elle est littérale, symbolique ou les deux.
  alternative: Comprendre soit une transformation entièrement littérale de la création, soit avant tout une représentation symbolique de la paix messianique.
  rationale: Le verset décrit poétiquement des enfants vulnérables qui restent indemnes auprès de serpents mortels. La traduction conserve cette tension sans trancher le débat interprétatif.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique entre « le nourrisson » et « l’enfant sevré », ainsi qu’entre les deux abris de serpents, est maintenu. « Près du trou » évite de suggérer que l’enfant joue physiquement au-dessus de l’ouverture, tout en rendant la préposition עַל de façon naturelle dans ce contexte.
