source:
  edition: WLC
  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
translation:
  language: fr
  text: Il y aura une grande route pour le reste de son peuple qui subsistera, venant d’Assyrie[a], comme il y en eut une pour Israël, le jour où il monta du pays d’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui restera d’Assyrie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au jour de sa montée du pays d’Égypte »; allusion à la sortie d’Égypte.'
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Il y aura
  rationale: Dans ce discours prophétique, le waw suivi de l’accompli de היה exprime ici un résultat futur. « Il y aura » est naturel en français moderne et conserve cette portée prédictive.
- source_word: מְסִלָּה
  choice: une grande route
  rationale: Le nom désigne une voie aménagée, souvent surélevée. « Grande route » rend clairement l’image d’un passage préparé sans employer le terme moderne et technique « autoroute ».
- source_word: לִשְׁאָר עַמּוֹ
  choice: pour le reste de son peuple
  rationale: « Le reste » conserve le motif isaïen du groupe survivant et garde le possessif simple du texte hébreu sans en préciser le référent.
- source_word: אֲשֶׁר יִשָּׁאֵר מֵאַשּׁוּר
  choice: qui subsistera en Assyrie
  rationale: Le verbe reprend l’idée de survivance exprimée par « le reste ». En contexte de retour, מן indique que ce reste vient d’Assyrie; la formulation française idiomatique décrit ceux qui y subsisteront, tandis qu’une note signale la forme plus littérale.
- source_word: כַּאֲשֶׁר הָיְתָה
  choice: comme il y en eut une
  rationale: Le pronom « en » reprend naturellement « une grande route » et explicite en français l’ellipse de l’hébreu sans ajouter de contenu.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: Le nom collectif est conservé directement, conformément à l’hébreu.
- source_word: בְּיוֹם עֲלֹתוֹ
  choice: le jour où il monta
  rationale: Cette formulation rend l’infinitif construit « au jour de sa montée » dans un français naturel, tout en gardant le singulier collectif qui renvoie à Israël et le verbe traditionnel de la sortie d’Égypte.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: La formulation complète préserve l’expression caractéristique du récit de l’exode et sa résonance biblique.
theological_decisions:
- issue: Référent du possessif dans « son peuple »
  choice: Conserver « son peuple » sans nommer explicitement le possesseur.
  alternative: « le peuple du SEIGNEUR » ou « le peuple du rejeton messianique »
  rationale: Le verset ne nomme pas explicitement le référent du suffixe possessif. Le conserver évite de trancher une tension contextuelle et théologique que l’hébreu laisse ouverte.
- issue: Typologie de l’exode
  choice: Présenter directement la comparaison historique avec la sortie d’Égypte.
  alternative: Paraphraser comme « un nouvel exode » ou « un second exode »
  rationale: Le texte évoque clairement le modèle de l’exode, mais ne lui donne pas lui-même cette désignation théologique. La traduction conserve l’allusion sans l’interpréter à la place du lecteur.
- issue: Nombre du sujet dans « il monta »
  choice: Conserver le singulier collectif renvoyant à Israël.
  alternative: Employer le pluriel « ils montèrent » en visant les Israélites.
  rationale: Le suffixe hébreu est masculin singulier et reprend naturellement Israël comme entité collective. Le français permet de préserver cette forme.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple « monta » convient au rappel solennel d’un événement historique bien connu; « grande route » évite l’anachronisme d’« autoroute » tout en rendant l’idée d’une voie aménagée.
