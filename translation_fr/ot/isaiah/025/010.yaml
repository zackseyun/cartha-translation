revisions:
- from: Car la main de Yahweh reposera sur cette montagne. Moab sera foulé aux pieds sur place[a], comme la paille est foulée dans l’eau d’une fosse à fumier[b].
  to: Car la main de Yahweh reposera sur cette montagne. Moab sera piétiné là même[a], comme la paille est piétinée dans l’eau d’une fosse à fumier[b].
  rationale: La révision remplace une expression légèrement familière par « là même », qui convient mieux au registre et ne tranche pas l’antécédent contesté du suffixe. Elle emploie « piétiné » dans les deux occurrences afin de conserver naturellement en français le jeu de répétition du verbe hébreu. Les deux notes restent correctement ancrées et rendent les ambiguïtés pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le rendu transmet fidèlement l’image centrale : la main de Yahweh repose sur la montagne et Moab subit un écrasement comparable au foulage de la paille dans un lieu de fumier. La répétition de « piétiné » rend utilement la répétition du radical hébreu דושׁ. Le suffixe de תַּחְתָּיו demeure syntaxiquement disputé ; le texte principal doit donc éviter une expression trop familière ou trop interprétative.'
  naturalness: « Sur place » est courant mais trop conversationnel dans ce registre et peut évoquer une action immédiate plutôt qu’une localisation. « Là même » est plus sobre, littéraire sans être archaïque, et laisse la relation précise du suffixe non explicitée. « Piétiné » est plus naturel ici que « foulé aux pieds » tout en gardant l’image de piétinement.
  terminology: « Yahweh », « main », « montagne », « Moab », « paille » et « fosse à fumier » sont appropriés. « Fosse à fumier » garde la crudité du terme מַדְמֵנָה sans prétendre fixer avec excès la nature exacte du lieu. La note conserve les possibilités lexicales.
  issues:
  - severity: low
    issue: Registre de « sur place »
    rationale: Cette expression est idiomatique, mais elle est plus conversationnelle que le contexte poétique et peut suggérer « immédiatement ». Une formulation plus neutre préserve mieux la portée locative incertaine de תַּחְתָּיו.
  - severity: low
    issue: Répétition verbale en français
    rationale: « Piétiné » dans les deux membres rend de façon plus directement naturelle le foulage/trépidation tout en préservant le parallélisme verbal hébreu.
  revised_text: Car la main de Yahweh reposera sur cette montagne. Moab sera piétiné là même[a], comme la paille est piétinée dans l’eau d’une fosse à fumier[b].
