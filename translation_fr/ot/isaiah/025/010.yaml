id: ISA.25.10
reference: Isaiah 25:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי תָנ֥וּחַ יַד יְהוָ֖ה בָּ/הָ֣ר הַ/זֶּ֑ה וְ/נָ֤דוֹשׁ מוֹאָב֙ תַּחְתָּ֔י/ו כְּ/הִדּ֥וּשׁ מַתְבֵּ֖ן ב/מי מַדְמֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
translation:
  language: fr
  text: Car la main de Yahweh reposera sur cette montagne. Moab sera piétiné là même[a], comme la paille est piétinée dans l’eau d’une fosse à fumier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « sous lui » ou « sous elle » ; l’antécédent du pronom hébreu est incertain.'
    reason: alternative_reading
  - marker: b
    text: L’expression peut aussi désigner une fosse à purin, un tas de fumier ou un autre lieu souillé associé au fumier.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la promesse et du jugement annoncés dans le contexte précédent.
- source_word: תָנוּחַ
  choice: reposera
  rationale: Conserve l’image concrète de la main de Yahweh qui vient demeurer sur la montagne, sans expliciter davantage sa faveur ou sa puissance.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: Préserve la métaphore hébraïque de l’action et de la puissance divines ainsi que le nom propre divin.
- source_word: בָּהָר הַזֶּה
  choice: sur cette montagne
  rationale: Rendu locatif naturel en français; dans le contexte, la montagne désigne Sion.
- source_word: וְנָדוֹשׁ
  choice: sera foulé aux pieds
  rationale: Le verbe דושׁ peut évoquer le foulage ou le battage. Ici, le foulage exprime clairement l’écrasement humiliant et permet de reprendre la même image dans la comparaison.
- source_word: תַּחְתָּיו
  choice: sur place
  rationale: Formulation naturelle qui n’impose pas d’antécédent précis au suffixe hébreu ambigu; la lecture plus littérale est signalée en note.
- source_word: כְּהִדּוּשׁ
  choice: comme … est foulée
  rationale: Reprend le même vocabulaire que le premier emploi de דושׁ afin de préserver le parallèle verbal hébreu.
- source_word: מַתְבֵּן
  choice: la paille
  rationale: Désigne de la paille ou du fourrage de paille; « paille » est clair et concis.
- source_word: בְּמֵי מַדְמֵנָה
  choice: dans l’eau d’une fosse à fumier
  rationale: Rend l’image d’un endroit liquide et répugnant lié au fumier, tout en signalant en note l’incertitude sur la nature exacte du lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Antécédent du suffixe dans תַּחְתָּיו
  choice: Moab sera foulé aux pieds sur place
  alternative: Moab sera foulé aux pieds sous lui / sous elle
  rationale: L’antécédent du pronom suffixe est incertain. Le texte principal conserve l’idée de jugement sans trancher, tandis que la note donne la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « foulé » préserve le lien verbal de l’hébreu; « foulé aux pieds » rend l’humiliation physique sans recourir au terme technique « battu ».
