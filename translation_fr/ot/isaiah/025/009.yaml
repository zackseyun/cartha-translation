source:
  edition: WLC
  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
translation:
  language: fr
  text: 'Ce jour-là, on dira : « Voici notre Dieu ! Nous l’avons attendu, et il nous sauvera. C’est Yahvé[a] ! Nous l’avons attendu. Réjouissons-nous et soyons dans l’allégresse de son salut ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yahvé » transcrit le nom divin יהוה (YHWH), dont la prononciation ancienne exacte demeure incertaine. Il est traditionnellement rendu par « le SEIGNEUR ».
    reason: Préciser la nature et la tradition de traduction du nom divin.
lexical_decisions:
- source_word: וְאָמַר
  choice: on dira
  rationale: Le verbe est à la 3e personne masculine singulière sans sujet exprimé. Le tour impersonnel français « on dira » évite d’ajouter un référent précis et convient à l’annonce prophétique.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Formule temporelle prophétique naturelle en français, qui conserve le renvoi à un jour déterminé dans la vision.
- source_word: הִנֵּה אֱלֹהֵינוּ זֶה
  choice: Voici notre Dieu !
  rationale: « Voici » rend la force déictique et expressive de הִנֵּה, tandis que l’identification portée par זֶה reste implicite mais claire dans cette tournure française naturelle.
- source_word: קִוִּינוּ לוֹ
  choice: Nous l’avons attendu
  rationale: קוה associe attente et espérance. « Attendre » conserve ici plus directement la durée et l’attente confiante, sans réduire le sens à un sentiment intérieur.
- source_word: וְיוֹשִׁיעֵנוּ
  choice: et il nous sauvera
  rationale: L’imparfait hébreu hiphil de ישׁע exprime naturellement ici l’action attendue de Dieu. Le futur français respecte cette forme sans transformer la coordination en proposition de but.
- source_word: זֶה יְהוָה
  choice: C’est Yahvé
  rationale: La construction identifie avec insistance celui qui vient de sauver. « C’est » est l’équivalent idiomatique français du démonstratif d’identification.
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: Réjouissons-nous, soyons dans l’allégresse
  rationale: Les deux cohortatifs appellent la communauté à la joie. Deux impératifs inclusifs en français en préservent la force exhortative et le parallélisme.
- source_word: בִּישׁוּעָתוֹ
  choice: à cause du salut qu’il donne
  rationale: La préposition ב peut indiquer le motif de la joie. « Le salut qu’il donne » exprime naturellement le suffixe possessif sans suggérer que Dieu serait lui-même le bénéficiaire de ce salut.
theological_decisions:
- issue: Transcription du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » est une transcription française courante qui distingue le nom propre du titre אֲדֹנָי, tout en signalant en note l’incertitude de sa vocalisation ancienne.
- issue: Rapport entre l’attente et le salut dans וְיוֹשִׁיעֵנוּ
  choice: 'coordination au futur : « et il nous sauvera »'
  alternative: 'proposition de but : « pour qu’il nous sauve »'
  rationale: La conjonction ו et la forme verbale permettent plusieurs nuances contextuelles. La traduction retient la coordination la plus formelle et garde l’orientation prospective du verbe, sans imposer une valeur finale qui n’est pas explicitement marquée.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les exclamations rendent l’élan de reconnaissance et de joie du texte. Le vocabulaire biblique « salut » est conservé, mais la formulation « qu’il donne » clarifie naturellement le possessif hébreu.
