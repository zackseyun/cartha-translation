  text: וּ/פֵרַ֤שׂ יָדָי/ו֙ בְּ/קִרְבּ֔/וֹ כַּ/אֲשֶׁ֛ר יְפָרֵ֥שׂ הַ/שֹּׂחֶ֖ה לִ/שְׂח֑וֹת וְ/הִשְׁפִּיל֙ גַּֽאֲוָת֔/וֹ עִ֖ם אָרְבּ֥וֹת יָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
translation:
  language: fr
  text: Il étendra les mains en son sein, comme le nageur les étend pour nager, et il abaissera son orgueil en même temps que l’habileté de ses mains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ruses de ses mains », « ses artifices » ou « ses manœuvres ». L’expression hébraïque est difficile et peut désigner une habileté pratique ou des procédés rusés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֵרַשׂ
  choice: Il étendra
  rationale: Le verbe פרשׂ signifie étendre ou déployer. « Étendra » convient au mouvement des mains dans l’image de la nage.
- source_word: יָדָיו
  choice: les mains
  rationale: Traduction littérale de l’hébreu. En français, « étendre les mains » reste compréhensible dans cette comparaison, sans remplacer l’image par « les bras ».
- source_word: בְּקִרְבּוֹ
  choice: en son sein
  rationale: Cette formulation conserve le suffixe masculin singulier et le sens spatial, sans préciser davantage son antécédent, probablement Moab personnifié dans le contexte précédent.
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  choice: comme le nageur les étend pour nager
  rationale: « Le nageur » rend le participe substantivé, et « pour nager » exprime la valeur finale de l’infinitif. Le pronom « les » reprend naturellement « les mains ».
- source_word: וְהִשְׁפִּיל
  choice: et il abaissera
  rationale: Le hiphil de שׁפל exprime l’action d’abaisser ou de faire descendre. « Abaissera » garde à la fois l’image du jugement et la possibilité d’un abaissement de l’orgueil.
- source_word: גַּאֲוָתוֹ
  choice: son orgueil
  rationale: Dans ce contexte de jugement, le nom désigne l’élévation orgueilleuse ou l’arrogance. « Orgueil » est clair, courant et digne.
- source_word: עִם
  choice: avec
  rationale: La préposition associe l’orgueil à ce qui est également abaissé. « Avec » conserve la concision de l’hébreu.
- source_word: אָרְבוֹת יָדָיו
  choice: l’habileté de ses mains
  rationale: L’expression hébraïque est difficile et peut évoquer l’adresse, des artifices ou des manœuvres rusées. « L’habileté de ses mains » offre un texte principal lisible sans exclure les nuances plus négatives signalées en note.
theological_decisions:
- issue: Référent des pronoms singuliers
  choice: Conserver « il » et « son/ses » sans nommer explicitement leur référent.
  alternative: Expliciter « Moab » ou distinguer Moab et le Seigneur comme sujets successifs.
  rationale: Les formes hébraïques sont au masculin singulier, et le contexte permet de comprendre Moab comme une figure personnifiée. Ne pas expliciter le sujet préserve toutefois l’éventuelle tension concernant le sujet de « abaissera ».
- issue: Sens de אָרְבוֹת יָדָיו
  choice: « l’habileté de ses mains » dans le texte, avec les nuances négatives en note.
  alternative: « les ruses de ses mains », « ses artifices » ou « ses manœuvres »
  rationale: Le terme est lexicalement incertain. Le choix principal demeure intelligible, tandis que la note préserve les lectures qui soulignent la ruse ou les procédés trompeurs.
translation_notes:
  register: Français international moderne, sobre et poétique. « En son sein » est légèrement soutenu, mais il conserve avec concision le rapport pronominal et spatial de l’hébreu. La répétition de « étend » reproduit délibérément celle de la racine hébraïque.
