revisions:
- from: Il étendra les mains en son sein, comme le nageur les étend pour nager, et il abaissera son orgueil avec l’habileté de ses mains.[a]
  to: Il étendra les mains en son sein, comme le nageur les étend pour nager, et il abaissera son orgueil en même temps que l’habileté de ses mains.[a]
  rationale: La seule révision remplace « avec » par « en même temps que », afin de rendre la valeur associative de עִם sans suggérer que l’habileté est l’instrument de l’abaissement. Le reste du texte, y compris l’ambiguïté des pronoms et la note lexicale, est conservé.
