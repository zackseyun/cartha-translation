    issue: Ambiguïté instrumentale de « avec »
    rationale: Dans « abaisser X avec Y », le français peut indiquer l’instrument employé. Ici עִם relie ce qui est abaissé à l’orgueil, non le moyen de l’abaisser. « En même temps que » exprime clairement cette association sans élucider davantage le terme hébreu difficile.
  revised_text: Il étendra les mains en son sein, comme le nageur les étend pour nager, et il abaissera son orgueil en même temps que l’habileté de ses mains.[a]
