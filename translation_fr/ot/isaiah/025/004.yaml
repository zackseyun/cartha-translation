  text: כִּֽי הָיִ֨יתָ מָע֥וֹז לַ/דָּ֛ל מָע֥וֹז לָ/אֶבְי֖וֹן בַּ/צַּר ל֑/וֹ מַחְסֶ֤ה מִ/זֶּ֨רֶם֙ צֵ֣ל מֵ/חֹ֔רֶב כִּ֛י ר֥וּחַ עָרִיצִ֖ים כְּ/זֶ֥רֶם קִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
translation:
  language: fr
  text: 'Car tu as été une forteresse pour le faible,

    une forteresse pour le démuni dans sa détresse,

    un refuge contre l’orage,

    une ombre contre la chaleur ;

    car le souffle[a] des tyrans

    est comme un orage contre un mur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent » ou « la rafale » ; le mot hébreu רוּחַ peut avoir ces sens dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est très concise et sa syntaxe est discutée. On peut aussi comprendre « comme une pluie torrentielle contre un mur » ou « comme un orage qui frappe un mur ».
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: מָעוֹז
  choice: forteresse
  rationale: Exprime un lieu de protection solide et défensif. La répétition est conservée afin de respecter le parallélisme hébreu.
- source_word: דָּל
  choice: faible
  rationale: Le terme peut désigner une personne faible, humble ou pauvre. « faible » préserve ici l’idée générale de vulnérabilité tout en le distinguant de אֶבְיוֹן.
- source_word: אֶבְיוֹן
  choice: démuni
  rationale: Rend le besoin matériel et social tout en maintenant une nuance distincte de דָּל.
- source_word: בַּצַּר לוֹ
  choice: dans sa détresse
  rationale: Formulation française naturelle qui conserve la détresse du démuni et le suffixe masculin singulier.
- source_word: מַחְסֶה
  choice: refuge
  rationale: Conserve l’image concrète de protection tout en variant par rapport à מָעוֹז.
- source_word: זֶרֶם
  choice: orage
  rationale: Terme suffisamment large pour évoquer une intempérie violente dans les deux occurrences, sans imposer exclusivement l’idée de pluie torrentielle.
- source_word: צֵל
  choice: ombre
  rationale: En contexte de chaleur, « ombre » désigne naturellement l’abri protecteur procuré contre le soleil.
- source_word: חֹרֶב
  choice: chaleur
  rationale: Le contraste avec l’ombre favorise ici le sens de chaleur brûlante plutôt que celui de sécheresse.
- source_word: רוּחַ
  choice: souffle
  rationale: Préserve le sens concret et la polysémie du mot hébreu, qui peut aussi désigner le vent ou une rafale.
- source_word: עָרִיצִים
  choice: êtres impitoyables
  rationale: Rend la violence oppressive du terme sans la limiter à des dirigeants politiques. « êtres » permet de ne pas imposer en français un genre absent de la portée collective du contexte.
- source_word: קִיר
  choice: mur
  rationale: Conserve l’image concrète du texte hébreu et son caractère abrupt.
theological_decisions:
- issue: Représentation métaphorique de la protection divine
  choice: Conserver les images concrètes de la forteresse, du refuge et de l’ombre sans les développer en allégorie.
  alternative: Paraphraser en termes de consolation spirituelle ou de salut.
  rationale: Le verset décrit poétiquement la protection accordée par Dieu aux personnes vulnérables. Une explicitation doctrinale dépasserait ce qu’affirme l’hébreu.
- issue: Genre et identité des personnes vulnérables
  choice: Employer le masculin singulier « sa » conformément au suffixe hébreu, sans en faire une limitation doctrinale.
  alternative: Neutraliser entièrement le nombre et le genre par une reformulation plurielle.
  rationale: Le singulier appartient à la forme poétique hébraïque et peut avoir une portée représentative.
translation_notes:
  register: Français international moderne, poétique et digne. Les lignes suivent le parallélisme du verset. « Forteresse » et « refuge » maintiennent les images concrètes de protection ; « faible » et « démuni » distinguent les deux termes sociaux voisins. Les marqueurs de notes sont placés sur les expressions réellement concernées par les ambiguïtés lexicales et syntaxiques.
