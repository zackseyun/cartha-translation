  text: And the fortified height of your walls he has brought down[a], laid low, and cast to the ground, to the dust.
translation:
  language: fr
  text: Et la forteresse, la hauteur de tes murailles, il l’a abattue, rabaissée et jetée à terre, jusque dans la poussière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְצַר מִשְׂגַּב חוֹמֹתֶיךָ
  choice: Et la hauteur fortifiée de tes murailles
  rationale: La chaîne construite hébraïque est très condensée. « Hauteur fortifiée » conserve à la fois l’idée de fortification portée par מִבְצָר et celle d’un lieu élevé et inaccessible portée par מִשְׂגָּב, sans alourdir le français par deux termes presque synonymes.
- source_word: חוֹמֹתֶיךָ
  choice: tes murailles
  rationale: Le pluriel et le suffixe masculin singulier de deuxième personne sont conservés. « Murailles » convient ici mieux que « murs » au contexte défensif, sans ajouter explicitement « de la ville ».
- source_word: הֵשַׁח
  choice: il l’a abaissée
  rationale: Le hifil exprime l’action de faire descendre ce qui était élevé. « Abaissée » maintient le contraste vertical et s’accorde avec « hauteur ».
- source_word: הִשְׁפִּיל
  choice: renversée
  rationale: Le verbe signifie rendre bas ou abaisser. Dans cette série décrivant la destruction de défenses, « renversée » rend naturellement le résultat concret tout en évitant la répétition immédiate d’« abaissée ».
- source_word: הִגִּיעַ לָאָרֶץ
  choice: jetée à terre
  rationale: Littéralement, le verbe signifie « faire parvenir jusqu’à la terre ». « Jetée à terre » exprime naturellement en français l’effondrement causé, sans perdre le mouvement descendant.
- source_word: עַד עָפָר
  choice: jusque dans la poussière
  rationale: La formule intensifie l’abaissement total. « Jusque dans la poussière » conserve cette progression de la hauteur vers la terre, puis la poussière.
