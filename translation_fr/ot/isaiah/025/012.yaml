revisions:
- from: Et la hauteur fortifiée de tes murailles[a], il l’a abaissée, renversée et jetée à terre, jusque dans la poussière.
  to: Et la forteresse, la hauteur de tes murailles, il l’a abattue, rabaissée et jetée à terre, jusque dans la poussière.
  rationale: La révision remplace « hauteur fortifiée » par une apposition qui rend explicitement les deux noms hébreux sans imposer une analyse unique de leur relation. Elle conserve la succession de trois verbes de démolition et l’intensification finale « jusque dans la poussière ».
