id: ISA.25.3
reference: Isaiah 25:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּ֖ן יְכַבְּד֣וּ/ךָ עַם עָ֑ז קִרְיַ֛ת גּוֹיִ֥ם עָרִיצִ֖ים יִירָאֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
translation:
  language: fr
  text: C’est pourquoi un peuple puissant t’honorera[a] ; une cité de nations impitoyables te craindra[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un peuple fort » ou « un peuple farouche ». L’adjectif hébreu peut exprimer la force, la puissance ou la férocité.
    reason: lexical_alternative
  - marker: b
    text: Ou « une cité de peuples impitoyables ». La construction hébraïque est condensée et peut désigner une cité appartenant à des nations impitoyables ou caractérisée par elles.
    reason: lexical_alternative
  - marker: c
    text: Ou « te révérera » ou « sera saisi de crainte devant toi ». Selon le contexte, le verbe peut exprimer la peur, la révérence ou l’effroi mêlé d’admiration.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Rend naturellement en français la conclusion logique et résultative qui découle des actes de Dieu décrits auparavant.
- source_word: יְכַבְּדוּךָ
  choice: t’honorera
  rationale: Le piel de כבד signifie « honorer » ou « glorifier ». « Honorer » conserve ici une portée large sans imposer un sens exclusivement cultuel.
- source_word: עַם עָז
  choice: un peuple puissant
  rationale: עָז peut évoquer la force, la puissance ou la férocité. « Puissant » exprime la puissance du peuple sans accentuer indûment sa violence.
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  choice: une cité de nations impitoyables
  rationale: Cette formulation préserve la chaîne construite, volontairement condensée, et l’image d’une cité liée à des nations oppressives et violentes. « Cité » convient au registre poétique d’Ésaïe.
- source_word: יִירָאוּךָ
  choice: te craindra
  rationale: ירא peut désigner la crainte, la révérence ou l’effroi. « Craindre » en conserve la force directe et laisse ouverte la nature exacte de la réaction.
theological_decisions:
- issue: Nature de la réaction des puissances envers Dieu
  choice: Le texte dit qu’un peuple puissant honorera Dieu et qu’une cité associée à des nations impitoyables le craindra, sans préciser s’il s’agit d’adoration volontaire, de soumission sous la contrainte ou d’une combinaison des deux.
  alternative: Comprendre soit une conversion authentique des nations, soit une simple soumission dans l’effroi après le jugement.
  rationale: Les verbes hébreux peuvent exprimer honneur et révérence, mais le contexte de jugement permet aussi l’idée de crainte contrainte. La traduction ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsme. Le futur singulier des verbes suit les sujets singuliers « peuple » et « cité ». Les notes conservent les principales ambiguïtés lexicales et syntaxiques de l’hébreu.
