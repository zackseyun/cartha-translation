  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
translation:
  language: fr
  text: Comme la chaleur dans un pays aride, tu réprimes le tumulte des étrangers[a] ; comme la chaleur atténuée par l’ombre d’un nuage, le chant des hommes violents est abaissé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des peuples étrangers ». Le mot peut désigner des étrangers ou des gens de l’extérieur.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu exprime de façon très condensée l’image de la chaleur et de l’ombre du nuage. Le dernier verbe peut être compris comme « est abaissé » ou « est réduit au silence » ; selon une autre analyse, il signifie « répond ».
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: כְּחֹרֶב בְּצָיוֹן
  choice: Comme la chaleur dans une terre aride
  rationale: חֹרֶב peut désigner la chaleur ou la sécheresse, et צָיוֹן un lieu aride. « Chaleur » maintient le parallèle avec l’ombre du nuage, tandis que « terre aride » restitue naturellement l’image.
- source_word: שְׁאוֹן
  choice: tumulte
  rationale: Le terme désigne un bruit puissant et agité, souvent hostile ; « tumulte » en rend les dimensions sonore et collective.
- source_word: זָרִים
  choice: étrangers
  rationale: Le mot peut désigner des étrangers ou des gens extérieurs. « Étrangers » conserve sa portée générale sans préciser davantage leur origine.
- source_word: תַּכְנִיעַ
  choice: tu fais taire
  rationale: Le hiphil de כנע signifie abaisser, soumettre ou réduire. Avec « tumulte », « faire taire » exprime naturellement l’effet de cette action tout en restant dans l’image sonore du verset.
- source_word: חֹרֶב בְּצֵל עָב
  choice: comme la chaleur sous l’ombre d’un nuage
  rationale: La répétition de « chaleur » préserve le parallélisme. צֵל signifie ombre et עָב désigne un nuage épais ; « sous l’ombre d’un nuage » est une formulation française naturelle.
- source_word: זְמִיר עָרִיצִים
  choice: le chant des tyrans
  rationale: זְמִיר désigne un chant, probablement triomphal ou arrogant ici, et עָרִיצִים des hommes violents, impitoyables ou tyranniques. « Tyrans » est concis et idiomatique.
- source_word: יַעֲנֶה
  choice: s’affaiblit
  rationale: La forme consonantique peut être rattachée à l’idée d’être abaissé ou affaibli, mais elle peut aussi être comprise comme « répond ». Le choix contextuel « s’affaiblit » correspond au parallélisme sans introduire un sujet explicite absent du dernier membre.
theological_decisions:
- issue: Changement de personne et sujet du dernier membre
  choice: 'Maintenir l’adresse directe à Dieu avec « tu » dans le premier membre, puis ne pas ajouter de sujet divin explicite dans le dernier : « le chant des tyrans s’affaiblit ».'
  alternative: « tu abaisses le chant des tyrans » ou « le chant des tyrans répond »
  rationale: תַּכְנִיעַ est explicitement à la deuxième personne du masculin singulier, tandis que יַעֲנֶה est à la troisième personne. La formulation retenue respecte cette différence et laisse subsister la difficulté du dernier verbe.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en deux comparaisons est conservé, avec un vocabulaire courant. Les notes signalent les principales ambiguïtés lexicales sans imposer une interprétation doctrinale.
