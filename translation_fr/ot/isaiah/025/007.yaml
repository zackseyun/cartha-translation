  text: וּ/בִלַּע֙ בָּ/הָ֣ר הַ/זֶּ֔ה פְּנֵֽי הַ/לּ֥וֹט הַ/לּ֖וֹט עַל כָּל הָֽ/עַמִּ֑ים וְ/הַ/מַּסֵּכָ֥ה הַ/נְּסוּכָ֖ה עַל כָּל הַ/גּוֹיִֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
translation:
  language: fr
  text: Sur cette montagne, il engloutira le voile qui enveloppe tous les peuples[a], et le voile déployé sur toutes les nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le linceul qui enveloppe tous les peuples ». L’hébreu répète des mots apparentés évoquant ce qui recouvre ou enveloppe.'
    reason: lexical_alternative
  - marker: b
    text: Ce voile peut annoncer l’engloutissement de la mort au verset suivant, mais l’image peut désigner plus largement ce qui pèse sur les nations.
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  choice: il engloutira
  rationale: Conserve la métaphore vive de בלע et son lien lexical avec l’engloutissement de la mort au verset suivant.
- source_word: בָּהָר הַזֶּה
  choice: sur cette montagne
  rationale: Expression locative naturelle en français, renvoyant dans le contexte à la montagne de Sion.
- source_word: פְּנֵי הַלּוֹט הַלּוֹט
  choice: le voile qui enveloppe
  rationale: Rend naturellement l’ensemble de l’expression et fait entendre la répétition de termes apparentés en hébreu par « voile » et « enveloppe ».
- source_word: עַל כָּל הָעַמִּים
  choice: tous les peuples
  rationale: Maintient la distinction poétique entre עַמִּים, « peuples », et גּוֹיִם, « nations ».
- source_word: וְהַמַּסֵּכָה הַנְּסוּכָה
  choice: la couverture étendue
  rationale: Dans ce parallélisme, מַסֵּכָה désigne une couverture plutôt qu’un objet de métal fondu; « étendue » rend l’image de ce qui est déployé au-dessus des nations.
- source_word: עַל כָּל הַגּוֹיִם
  choice: sur toutes les nations
  rationale: « Nations » est l’équivalent naturel de גּוֹיִם et préserve le parallélisme sans confondre les deux substantifs hébreux.
theological_decisions:
- issue: Nature de ce qui est retiré
  choice: Un voile ou une couverture métaphorique posé sur l’ensemble de l’humanité
  alternative: Un linceul funéraire désignant précisément la mort, ou un symbole particulier d’aveuglement spirituel ou de déshonneur
  rationale: Le verset 8 associe fortement l’image à la mort, mais le verset 7 garde une formulation plus large. Le texte principal conserve donc l’image sans en imposer une interprétation unique.
translation_notes:
  register: Français international moderne, clair et digne. « Engloutira » conserve l’image hébraïque; les termes « peuples » et « nations » maintiennent le parallélisme lexical. Les marqueurs de notes sont placés dans le texte principal.
