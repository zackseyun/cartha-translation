  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
translation:
  language: fr
  text: Il engloutira la mort à jamais[a]. Le Seigneur Yahweh[b] essuiera les larmes de chaque visage, et il fera disparaître de toute la terre le déshonneur de son peuple[c], car Yahweh a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a englouti la mort à jamais. » Le verbe hébreu est à la forme du parfait, qui peut présenter une action future comme déjà certaine.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « Seigneur Yahweh », associant le titre אֲדֹנָי au nom divin יהוה.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’opprobre de son peuple » ou « la honte de son peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: Il engloutira
  rationale: Le parfait hébreu peut ici présenter comme certaine une action future annoncée prophétiquement. « Engloutira » conserve l’image concrète du verbe בלע, plutôt que de l’expliciter par « détruira ».
- source_word: הַמָּוֶת לָנֶצַח
  choice: la mort à jamais
  rationale: « La mort » rend le nom défini, tandis que « à jamais » exprime la portée permanente de נצח dans un français naturel et solennel.
- source_word: וּמָחָה ... דִּמְעָה מֵעַל כָּל פָּנִים
  choice: essuiera les larmes de tous les visages
  rationale: Le verbe מחה signifie ici essuyer ou effacer. Le singulier collectif « larme » est rendu au pluriel pour former l’expression française naturelle « essuyer les larmes », et « tous les visages » conserve la portée distributive.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette expression associe le titre אֲדֹנָי, « Seigneur », au nom divin יהוה. La traduction les distingue sans remplacer le nom propre par un second titre.
- source_word: וְחֶרְפַּת עַמּוֹ
  choice: le déshonneur de son peuple
  rationale: חרפה désigne la honte subie publiquement, l’opprobre ou le déshonneur. « Déshonneur » demeure compréhensible tout en conservant cette dimension sociale.
- source_word: יָסִיר מֵעַל כָּל הָאָרֶץ
  choice: il fera disparaître de toute la terre
  rationale: Le hiphil de סור exprime l’éloignement ou la suppression. « Faire disparaître » est naturel avec « déshonneur ». Dans ce contexte de portée universelle, הארץ est rendu par « la terre » plutôt que par « le pays ».
- source_word: כִּי יְהוָה דִּבֵּר
  choice: car Yahweh a parlé
  rationale: La conjonction introduit le fondement certain de la promesse. « A parlé » conserve la formule prophétique solennelle, et יהוה est transcrit « Yahweh ».
theological_decisions:
- issue: Valeur temporelle de בִּלַּע et cohérence des annonces du verset
  choice: 'Futur : « Il engloutira… essuiera… fera disparaître »'
  alternative: 'Accompli prophétique : « Il a englouti… a essuyé… a fait disparaître »'
  rationale: Bien que בִּלַּע soit morphologiquement un parfait, le contexte annonce une intervention à venir avec une certitude prophétique. Le futur français transmet cette fonction sans effacer l’autre analyse possible, signalée en note.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » préserve la distinction entre le nom divin יהוה et le titre אֲדֹנָי, particulièrement importante dans l’expression אֲדֹנָי יְהוִה.
- issue: Portée de הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: Le contexte associe « tous les visages » à la suppression du déshonneur et favorise une portée universelle. Le mot hébreu peut toutefois aussi désigner le pays selon le cadre interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. Les images concrètes « engloutir la mort » et « essuyer les larmes » sont conservées. La syntaxe reste fluide, sans vocabulaire confessionnel ajouté; « déshonneur » maintient la dimension publique de חרפה.
