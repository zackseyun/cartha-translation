base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
translation:
  language: fr
  text: 'Yahweh, tu es mon Dieu ! Je t’exalterai, je louerai ton nom, car tu as accompli des merveilles : des projets conçus de longue date, fidélité et fermeté.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre possibilité : « car tu as accompli une merveille : des projets d’autrefois, fidélité et fermeté ». L’hébreu est compact et poétique. La finale peut caractériser les projets anciens par leur fiabilité et leur fermeté, ou souligner la fermeté avec laquelle ils sont accomplis.'
    reason: Préserver l’ambiguïté du singulier פֶּלֶא, de la portée temporelle de מֵרָחוֹק et du rapport syntaxique de אֱמוּנָה אֹמֶן.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin YHWH, conservant ici le nom propre de l’hébreu.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne du singulier exprime directement la possession.
- source_word: אֲרוֹמִמְךָ
  choice: je t’exalterai
  rationale: Le verbe רום dans cette forme exprime l’élévation dans la louange; « exalter » est naturel dans un registre poétique et cultuel.
- source_word: אוֹדֶה שִׁמְךָ
  choice: je célébrerai ton nom
  rationale: ידה peut signifier louer ou rendre grâce. « Célébrer » convient au parallélisme avec « exalter » tout en maintenant la mention explicite du nom.
- source_word: כִּי עָשִׂיתָ פֶּלֶא
  choice: car tu as accompli des merveilles
  rationale: Le singulier פֶּלֶא peut avoir une portée collective; le pluriel français restitue naturellement les actes merveilleux de Dieu.
- source_word: עֵצוֹת
  choice: des projets
  rationale: Dans ce contexte d’actes divins réalisés selon une intention préalable, « projets » est plus clair en français moderne que « conseils ».
- source_word: מֵרָחוֹק
  choice: conçus depuis longtemps
  rationale: L’expression signifie littéralement « de loin », avec ici une valeur temporelle probable. L’ajout de « conçus » rend explicite le lien idiomatique avec les projets.
- source_word: אֱמוּנָה אֹמֶן
  choice: fidèles et sûrs
  rationale: Les deux noms juxtaposés évoquent la fidélité, la solidité et la fiabilité. Deux adjectifs français permettent de les rapporter clairement aux projets sans effacer leur proximité sémantique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre sans lui substituer un titre.
- issue: Sens de מֵרָחוֹק avec עֵצוֹת
  choice: 'sens temporel : « conçus depuis longtemps »'
  alternative: 'sens spatial : « venus de loin » ou formulation littérale « de loin »'
  rationale: Le contexte célèbre l’accomplissement présent d’intentions divines anciennes; le sens temporel s’intègre le mieux à cette progression.
- issue: Rapport syntaxique de אֱמוּנָה אֹמֶן
  choice: 'deux qualités attribuées aux projets : « fidèles et sûrs »'
  alternative: « avec une parfaite fidélité »; « fidélité, fermeté »
  rationale: L’hébreu est très compact et permet plusieurs analyses. La traduction choisie suit la lecture où les termes finaux qualifient les projets, tandis qu’une note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et poétique. Le tutoiement correspond à l’adresse directe au Dieu personnel. « Célébrer » évite la répétition lexicale tout en restant accessible. La ponctuation met en relief la confession initiale et la succession de louange, motif et projets.
