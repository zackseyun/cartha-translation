  terminology: « Yahweh », « mon Dieu », « exalter » et « projets » conviennent. « Fidélité et fermeté » rend les deux termes finals comme qualités distinctes de fiabilité/stabilité sans imposer à אֹמֶן le sens plus étroit de « vérité » ni ajouter l’idée de perfection.
