base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
translation:
  language: fr
  text: Car tu as réduit la ville à un tas, la cité fortifiée à une ruine ; le palais des étrangers n’est plus une ville[a] ; jamais il ne sera rebâti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé : littéralement, « le palais des étrangers, hors d’une ville ». Le lien syntaxique exact est discuté ; la traduction comprend que ce palais a cessé d’être une ville.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour toujours, il ne sera pas bâti » ; dans ce contexte de destruction, le sens est : « il ne sera jamais rebâti ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ (שׂוּם)
  choice: tu as réduit … à
  rationale: Dans cette construction avec un état résultant, le verbe signifie « faire devenir, transformer en ». « Réduire à » exprime naturellement la destruction en français.
- source_word: מֵעִיר לַגָּל
  choice: la ville à un tas de ruines
  rationale: La préposition מִן et לְ décrivent ici le passage d’un état à un autre. גַּל désigne un tas ou un monceau, souvent de pierres ; l’ajout « de ruines » explicite l’image en français sans en changer le sens.
- source_word: קִרְיָה בְצוּרָה
  choice: la cité fortifiée
  rationale: « Cité » maintient la variation poétique avec « ville », tandis que בְצוּרָה signifie clairement « fortifiée ».
- source_word: לְמַפֵּלָה
  choice: à un monceau de décombres
  rationale: Le nom évoque l’effondrement ou la ruine. Cette formulation concrète conserve le parallélisme avec « tas de ruines ».
- source_word: אַרְמוֹן זָרִים
  choice: le palais des étrangers
  rationale: אַרְמוֹן désigne un palais ou une résidence fortifiée, et זָרִים des étrangers. Le génitif français reste proche de la construction hébraïque.
- source_word: מֵעִיר
  choice: n’est plus une ville
  rationale: La phrase hébraïque est très condensée. Dans le prolongement de la construction précédente, elle indique vraisemblablement la perte du statut ou de la réalité de ville.
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  choice: jamais il ne sera rebâti
  rationale: Avec la négation, לְעוֹלָם prend naturellement le sens de « jamais ». Après la destruction décrite, le nifal de בנה se rend contextuellement par « être rebâti ».
