  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשָׂה֩ יְהוָ֨ה צְבָא֜וֹת לְ/כָל הָֽ/עַמִּים֙ בָּ/הָ֣ר הַ/זֶּ֔ה מִשְׁתֵּ֥ה שְׁמָנִ֖ים מִשְׁתֵּ֣ה שְׁמָרִ֑ים שְׁמָנִים֙ מְמֻ֣חָיִ֔ם שְׁמָרִ֖ים מְזֻקָּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
translation:
  language: fr
  text: 'Sur cette montagne, Yahvé des armées préparera pour tous les peuples un festin de mets succulents[a], un festin de vins vieux : des mets riches en moelle et des vins vieux soigneusement clarifiés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un festin de choses grasses… un festin de vins sur la lie ». En hébreu, ces images évoquent l’abondance et le raffinement.'
    reason: Alternative lexicale et explicitation de l’image hébraïque.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: préparera
  rationale: Dans le contexte d’un banquet, « préparer » exprime naturellement le sens de עשה (« faire ») sans ajouter l’idée d’une simple distribution.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Le nom divin est translittéré sous la forme française courante « Yahvé », tandis que צבאות est traduit de façon transparente par « des armées ».
- source_word: לְכָל הָעַמִּים
  choice: pour tous les peuples
  rationale: Le pluriel « peuples » conserve la portée collective et distincte de עמים.
- source_word: בָּהָר הַזֶּה
  choice: sur cette montagne
  rationale: Cette formulation française idiomatique conserve la préposition locale et le démonstratif hébreux.
- source_word: מִשְׁתֵּה
  choice: un festin
  rationale: Le terme désigne un banquet, notamment accompagné de vin ; « festin » convient aux deux éléments parallèles du verset.
- source_word: שְׁמָנִים
  choice: mets succulents
  rationale: Littéralement « choses grasses », l’expression évoque des aliments riches et recherchés. « Mets succulents » en transmet la valeur positive dans un français naturel.
- source_word: שְׁמָרִים
  choice: vins vieux
  rationale: Le mot désigne littéralement la lie ; dans cette image de festin, il évoque du vin mûri sur sa lie. « Vins vieux » communique cette qualité positive, avec le sens concret signalé en note.
- source_word: מְמֻחָיִם
  choice: riches en moelle
  rationale: Le participe évoque des morceaux abondants en moelle, considérés comme particulièrement riches et choisis.
- source_word: מְזֻקָּקִים
  choice: soigneusement clarifiés
  rationale: Le participe indique que les vins ont été épurés ou filtrés. « Clarifiés » est précis dans le domaine du vin, et « soigneusement » rend la valeur intensive de la forme.
theological_decisions:
- issue: Portée universelle du festin
  choice: pour tous les peuples
  alternative: pour toutes les nations
  rationale: « Peuples » reproduit directement le pluriel hébreu et maintient la vision d’un festin destiné au-delà d’Israël, sans préciser davantage la manière dont cette portée s’accomplit.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme du banquet est conservé, de même que les images concrètes de la moelle et du vin clarifié.
