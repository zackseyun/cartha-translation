  rationale: La révision remplace un terme médical moins exact par « furoncle » et rend la valeur volitive finale par une proposition de but naturelle. Elle conserve explicitement « vive » dans le texte et signale en note le sens contextuel possible de guérison, sans lever l’ambiguïté lexicale du verbe hébreu.
