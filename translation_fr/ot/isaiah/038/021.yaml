  text: וַ/יֹּ֣אמֶר יְשַׁעְיָ֔הוּ יִשְׂא֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וְ/יִמְרְח֥וּ עַֽל הַ/שְּׁחִ֖ין וְ/יֶֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/021.yaml
  text: Isaiah had said[a], “Let them take a cake of figs and spread it on the boil, so that he may recover.”
translation:
  language: fr
  text: 'Ésaïe avait dit : « Qu’on prenne un gâteau de figues et qu’on l’applique sur le furoncle, afin qu’il vive[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin qu’il guérisse ». L’hébreu emploie littéralement le verbe « vivre », qui peut désigner ici le rétablissement après une maladie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: avait dit
  rationale: Le wayyiqtol signifie formellement « et il dit », mais le verset apporte ici une précision explicative en arrière-plan; le plus-que-parfait exprime naturellement cette relation discursive en français.
- source_word: יִשְׂאוּ
  choice: Qu’on prenne
  rationale: Dans ce contexte de préparation d’un remède, נשׂא a le sens naturel de prendre ou d’apporter; la tournure impersonnelle rend l’ordre à la troisième personne du pluriel.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: un gâteau de figues
  rationale: L’expression désigne une masse de figues pressées; « gâteau de figues » est clair, courant et proche de la forme hébraïque.
- source_word: וְיִמְרְחוּ
  choice: et qu’on l’applique
  rationale: מרח signifie étaler ou enduire. « Appliquer » convient naturellement à l’emploi d’un remède sur une lésion; le pronom reprend le gâteau de figues, objet sous-entendu en hébreu.
- source_word: עַל הַשְּׁחִין
  choice: sur l’ulcère
  rationale: שְׁחִין désigne une lésion cutanée enflammée, notamment un furoncle ou un ulcère. « Ulcère » est ici une formulation médicale naturelle sans préciser davantage que le texte.
- source_word: וְיֶחִי
  choice: et il vivra
  rationale: Cette traduction conserve le verbe חיה, « vivre », ainsi que la coordination hébraïque, sans résoudre entièrement la nuance contextuelle de guérison.
theological_decisions:
- issue: Portée de וְיֶחִי dans le récit de guérison
  choice: et il vivra
  alternative: afin qu’il guérisse
  rationale: Le contexte permet le sens « guérir, se rétablir », mais le texte emploie explicitement le verbe « vivre ». Le conserver dans le texte principal préserve sa force et son ambiguïté, tandis qu’une note explicite le sens contextuel possible.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « Qu’on prenne… qu’on l’applique » rend naturellement l’instruction à la troisième personne du pluriel. Le plus-que-parfait signale la fonction rétrospective du verset, sans ajouter de marqueur temporel absent de l’hébreu.
