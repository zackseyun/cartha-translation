base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/009.yaml
  text: 'A writing of Hezekiah king of Judah[b][a], when he had been sick and had recovered from his sickness:'
translation:
  language: fr
  text: 'Écrit[a] d’Ézéchias, roi de Juda, lorsqu’il fut malade et se rétablit[b] de sa maladie :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Composition d’Ézéchias » ou « Document d’Ézéchias ». Le terme hébreu désigne un écrit sans en préciser exactement le genre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et il vécut de sa maladie » ; cette expression signifie qu’il se rétablit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּב
  choice: Écrit
  rationale: Le nom désigne largement une composition écrite ou un document sans en préciser le genre. « Écrit » conserve cette indétermination mieux que « poème » ou « psaume ».
- source_word: לְחִזְקִיָּהוּ
  choice: d’Ézéchias
  rationale: Dans ce titre, la préposition ל marque vraisemblablement l’attribution ou l’association; « d’Ézéchias » est naturel en français et laisse ouverte la nuance exacte.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu direct et idiomatique de la chaîne construite qui indique la fonction et le royaume d’Ézéchias.
- source_word: בַּחֲלֹתוֹ
  choice: lorsqu’il eut été malade
  rationale: L’infinitif construit précédé de ב exprime la circonstance temporelle. Le temps composé convient au caractère rétrospectif du titre sans imposer l’idée qu’il tomba alors malade.
- source_word: וַיְחִי
  choice: se fut rétabli
  rationale: Littéralement « vécut », mais, avec « de sa maladie », le verbe exprime idiomatiquement le retour à la vie ou à la santé. « Se rétablit » évite de suggérer une résurrection.
- source_word: מֵחָלְיוֹ
  choice: de sa maladie
  rationale: La préposition מן indique ici la sortie d’un état; avec « se rétablir », le français emploie naturellement « de sa maladie ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le tour littéraire « lorsqu’il eut été… et se fut… » convient à un titre rétrospectif. Les notes conservent l’indétermination du genre de מִכְתָּב et signalent l’expression hébraïque sous-jacente à la guérison.
