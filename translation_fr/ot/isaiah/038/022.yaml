  text: וַ/יֹּ֥אמֶר חִזְקִיָּ֖הוּ מָ֣ה א֑וֹת כִּ֥י אֶעֱלֶ֖ה בֵּ֥ית יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/022.yaml
  text: And Hezekiah said[a], “What is the sign that I shall go up to the house of Yahweh?”
translation:
  language: fr
  text: 'Ézéchias dit : « Quel est le signe que je monterai à la maison de Yahweh ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple exprime naturellement cette succession sans qu’il soit nécessaire d’ajouter « et ».
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: מָה אוֹת
  choice: Quel est le signe
  rationale: Cette formulation demande l’identification du signe attendu et rend naturellement l’interrogation hébraïque. L’article défini convient au signe de confirmation envisagé dans le contexte.
- source_word: כִּי
  choice: que
  rationale: Ici, כִּי introduit le contenu que le signe doit confirmer.
- source_word: אֶעֱלֶה
  choice: je monterai
  rationale: L’imparfait hébreu a ici une valeur future. « Monter » conserve l’expression concrète et conventionnelle du déplacement vers le Temple.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction préserve l’image hébraïque de la « maison » tout en restant intelligible comme désignation du Temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » conserve le caractère de nom propre sans substituer un titre.
- issue: Portée de כִּי après « signe »
  choice: le signe confirmant que je monterai
  alternative: un signe permettant ou annonçant ma montée
  rationale: Le français « le signe que » maintient la relation assez ouverte du texte entre le signe et l’événement futur, sans préciser davantage sa fonction théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique écrit ; « maison de Yahweh » conserve la formulation source plutôt que de l’expliciter par « Temple ».
