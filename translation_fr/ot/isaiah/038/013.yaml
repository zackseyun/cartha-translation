source:
  edition: WLC
  text: שִׁוִּ֤יתִי עַד בֹּ֨קֶר֙ כָּֽ/אֲרִ֔י כֵּ֥ן יְשַׁבֵּ֖ר כָּל עַצְמוֹתָ֑/י מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/013.yaml
  text: I waited until morning[a]; like a lion, so he breaks all my bones[b]. From day to night you bring me to an end.
translation:
  language: fr
  text: J’ai attendu jusqu’au matin[a] ; comme un lion, il brise tous mes os[b]. Du jour à la nuit, tu me conduis à ma fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je me suis maîtrisé jusqu’au matin. » Le sens du verbe hébreu est difficile ; certains y voient l’idée de se contenir plutôt que celle d’attendre.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe de « il brise » à « tu me conduis à ma fin ». Ce changement poétique de personne est conservé dans la traduction.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Je me suis tenu dans l’attente
  rationale: Le verbe est difficile dans ce contexte. Cette formulation rend l’idée probable d’endurer ou d’attendre jusqu’au matin, tout en évitant de donner au terme un sens trop précis.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Expression temporelle directe, rendue naturellement en français moderne.
- source_word: כָּאֲרִי
  choice: comme un lion
  rationale: Conserve directement la comparaison et son image de violence écrasante.
- source_word: כֵּן יְשַׁבֵּר
  choice: il brise
  rationale: Le français n’a pas besoin d’un équivalent explicite de כֵּן après la comparaison. « Brise » conserve l’image concrète et violente du piel de שׁבר.
- source_word: כָּל עַצְמוֹתָי
  choice: tous mes os
  rationale: Rendu littéral qui préserve l’imagerie corporelle de la souffrance extrême.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: Du jour à la nuit
  rationale: Reproduit l’expression temporelle hébraïque sans la paraphraser comme « en un seul jour ».
- source_word: תַּשְׁלִימֵנִי
  choice: tu me conduis à ma fin
  rationale: Le hiphil de שלם signifie ici mener à l’achèvement, donc à la fin ou à la mort, et non rétablir ou donner la paix. La formulation reste digne et naturelle.
theological_decisions:
- issue: Passage de la troisième à la deuxième personne dans le verset
  choice: 'Conserver le changement : « il brise… tu me conduis »'
  alternative: Harmoniser les deux propositions à la troisième personne, ou identifier explicitement Dieu au lion dans toute la phrase.
  rationale: L’hébreu effectue ce changement de personne dans le mouvement poétique de la lamentation. Le préserver maintient l’ambiguïté de l’image et l’intensité de l’adresse directe sans imposer une harmonisation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Je me suis tenu dans l’attente » garde une légère solennité adaptée à la lamentation et reflète l’incertitude lexicale. Le changement de personne de l’hébreu est volontairement préservé.
