  text: מָֽה אֲדַבֵּ֥ר וְ/אָֽמַר לִ֖/י וְ/ה֣וּא עָשָׂ֑ה אֶדַּדֶּ֥ה כָל שְׁנוֹתַ֖/י עַל מַ֥ר נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
translation:
  language: fr
  text: Que puis-je dire ? Il m’a parlé, et c’est lui qui a agi. Je marcherai lentement durant toutes mes années à cause de l’amertume de mon âme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je marcherai doucement durant toutes mes années, dans l’amertume de mon âme. » Le verbe est rare et peut désigner une marche douce, lente ou contenue ; l’expression liée à l’« amertume » peut indiquer la manière plutôt que la cause.
    reason: Alternative lexicale et syntaxique due à la rareté du verbe אֶדַּדֶּה et à la portée possible de עַל.
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  choice: Que puis-je dire ?
  rationale: Cette question rhétorique exprime l’impuissance ou la stupéfaction du locuteur. La formulation est naturelle en français tout en conservant la force interrogative.
- source_word: וְאָמַר לִי
  choice: Il m’a parlé
  rationale: Dans cette réflexion, l’action est présentée comme accomplie. Le pronom garde implicite l’identité du sujet, que le contexte rapporte à Dieu, sans ajouter son nom au texte.
- source_word: וְהוּא עָשָׂה
  choice: et c’est lui qui a agi
  rationale: La tournure emphatique « c’est lui qui » rend la présence insistante du pronom הוּא. « A agi » conserve l’absence d’objet explicite en hébreu.
- source_word: אֶדַּדֶּה
  choice: Je marcherai lentement
  rationale: Ce verbe rare semble évoquer une démarche lente, douce ou contenue. La traduction retenue reste claire et préserve l’image d’une manière de marcher, éventuellement représentative de la conduite de vie.
- source_word: כָּל שְׁנוֹתַי
  choice: durant toutes mes années
  rationale: Cette formulation rend toute la durée évoquée sans préciser qu’il s’agit des années restantes, précision seulement implicite dans le contexte.
- source_word: עַל מַר נַפְשִׁי
  choice: à cause de l’amertume de mon âme
  rationale: עַל peut ici exprimer la cause ou le rapport avec l’état amer du locuteur. « Âme » conserve le langage anthropologique de נֶפֶשׁ sans le réduire à « cœur » ou à « moi-même ».
theological_decisions:
- issue: Référent des verbes à la troisième personne
  choice: Le pronom « il » renvoie à Dieu selon le contexte, sans que son nom soit ajouté dans le verset.
  alternative: Comprendre le sujet comme une personne non précisée.
  rationale: Le chant d’Ézéchias médite sur la parole et l’action du Seigneur dans l’épreuve. Cependant, puisque Dieu n’est pas nommé dans cette phrase, la traduction maintient le pronom.
- issue: Lien entre l’amertume et la marche
  choice: La marche lente est comprise comme résultant de l’amertume de l’âme.
  alternative: L’amertume peut décrire la manière ou le cadre dans lequel le locuteur marchera.
  rationale: La préposition עַל autorise une lecture causale, mais la construction et le verbe rare ne permettent pas d’exclure une lecture circonstancielle; celle-ci est donc signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu sans reproduire ses raideurs; l’ambiguïté du verbe rare et de la préposition est préservée par une note.
