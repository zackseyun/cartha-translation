lexical_decisions:
- source_word: וַיַּסֵּב
  choice: tourna
  rationale: Le hifil narratif de סבב décrit ici le geste concret par lequel Ézéchias dirige son visage dans une autre direction ; « tourna » est naturel et fidèle.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: פָּנָיו
  choice: son visage
  rationale: Rend explicitement le geste corporel du texte hébreu et en conserve la force narrative.
- source_word: אֶל הַקִּיר
  choice: vers le mur
  rationale: אֶל exprime l’orientation ou la direction ; « vers le mur » est idiomatique en français sans imposer l’idée d’un contact avec celui-ci.
- source_word: וַיִּתְפַּלֵּל
  choice: et pria
  rationale: Le hitpael de פלל a ici son sens courant de « prier » ; le passé simple convient au récit soutenu en français.
- source_word: אֶל יְהוָה
  choice: Yahvé
  rationale: La préposition אֶל désigne le destinataire de la prière, tandis que יהוה est rendu par la forme française courante du nom divin.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve sa fonction de nom propre dans un français naturel ; une note signale la convention traditionnelle « le SEIGNEUR » et la forme consonantique YHWH.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient la cadence narrative. Les deux gestes coordonnés restent explicites, et les deux-points annoncent naturellement les paroles de la prière au verset suivant.
