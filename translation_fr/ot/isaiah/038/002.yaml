base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/002.yaml
  text: Then Hezekiah turned his face to the wall and prayed to Yahweh[b][a],
translation:
  language: fr
  text: 'Alors Ézéchias tourna son visage vers le mur et pria Yahvé[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
