  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
translation:
  language: fr
  text: Voici, pour ma paix, j’ai connu une profonde amertume. Mais toi, tu as retenu[a] ma vie loin de la fosse de destruction, car tu as jeté derrière ton dos tous mes péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as aimé ma vie, loin de la fosse de destruction ». Le verbe hébreu peut exprimer un profond attachement ou l’amour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשָׁלוֹם
  choice: pour ma paix
  rationale: Conserve la préposition לְ et le champ sémantique large de שָׁלוֹם — paix, bien-être, intégrité — sans préciser davantage le rapport paradoxal avec l’amertume.
- source_word: מַר לִי מָר
  choice: j’ai connu une profonde amertume
  rationale: Rend avec naturel l’intensification produite par la répétition de la racine « amer », tout en gardant le caractère personnel de l’épreuve.
- source_word: חָשַׁקְתָּ
  choice: tu as retenu
  rationale: Dans cette construction avec « loin de la fosse », le verbe exprime un attachement protecteur qui aboutit à la délivrance. La nuance lexicale d’amour profond est signalée en note.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: נֶפֶשׁ désigne ici la personne vivante menacée de mort. « Ma vie » est plus naturel en français actuel que « mon âme » dans ce contexte concret.
- source_word: מִשַּׁחַת בְּלִי
  choice: loin de la fosse de destruction
  rationale: Préserve l’image concrète de la fosse et la notion de ruine portée par בְּלִי, sans réduire l’expression au seul tombeau.
- source_word: הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  choice: tu as jeté derrière ton dos
  rationale: Reproduit l’image hébraïque vive de péchés écartés du regard et de la considération de Dieu.
- source_word: חֲטָאַי
  choice: mes péchés
  rationale: Équivalent direct, clair et théologiquement non restrictif du pluriel חֲטָאַי.
theological_decisions:
- issue: Le verbe חָשַׁקְתָּ exprime-t-il principalement l’amour divin ou l’action de délivrer ?
  choice: 'Le texte principal met en avant la délivrance protectrice : « tu as retenu ma vie loin de la fosse de destruction ».'
  alternative: « dans ton amour, tu as retiré ma vie de la fosse de destruction » ou, plus littéralement, « tu as aimé ma vie hors de la fosse de destruction ».
  rationale: Le verbe dénote normalement un attachement profond ou de l’amour, tandis que la construction présente cet attachement comme arrachant la personne à la fosse. La traduction principale reste idiomatique et la note conserve la tension lexicale et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le paradoxe abrupt entre paix et amertume, ainsi que les images de la fosse et des péchés jetés derrière le dos de Dieu.
