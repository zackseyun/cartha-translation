source:
  edition: WLC
  text: דּוֹרִ֗/י נִסַּ֧ע וְ/נִגְלָ֛ה מִ/נִּ֖י כְּ/אֹ֣הֶל רֹעִ֑/י קִפַּ֨דְתִּי כָ/אֹרֵ֤ג חַיַּ/י֙ מִ/דַּלָּ֣ה יְבַצְּעֵ֔/נִי מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
translation:
  language: fr
  text: Ma demeure est arrachée et emportée loin de moi, comme une tente de berger[a]. Comme un tisserand, j’ai enroulé ma vie[b] ; il me coupe de la chaîne du métier[c]. Du jour à la nuit, tu me conduis à ma fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ma génération s’en est allée et a été retirée loin de moi, comme une tente de berger. » Le mot hébreu peut signifier « génération » ou, dans ce contexte, « demeure, habitation ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Comme un tisserand, j’ai coupé ma vie. » Le verbe hébreu est difficile ; la traduction « enroulé » suit l’image du tissage.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « il me coupe des fils pendants du métier ». Le terme hébreu désigne plus précisément, semble-t-il, les fils suspendus ou la chaîne du métier à tisser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  choice: ma demeure
  rationale: Bien que דּוֹר désigne souvent une « génération », le sens de demeure ou d’habitation convient ici à l’image parallèle de la tente que l’on démonte et emporte.
- source_word: נִסַּע וְנִגְלָה
  choice: est arrachée et emportée loin de moi
  rationale: Les deux verbes évoquent le départ et l’enlèvement d’une tente. Cette formulation garde leur valeur passive et la force concrète de l’image.
- source_word: כְּאֹהֶל רֹעִי
  choice: comme une tente de berger
  rationale: La construction évoque l’abri mobile et provisoire d’un berger ; cette expression est naturelle en français et conserve l’image pastorale.
- source_word: קִפַּדְתִּי
  choice: J’ai enroulé
  rationale: Le verbe est difficile. Dans le contexte du tissage, « enroulé » rend plausiblement l’action de ramasser ou d’enrouler la toile, sans anticiper entièrement l’image de la coupe dans la proposition suivante.
- source_word: כָאֹרֵג חַיַּי
  choice: ma vie comme un tisserand
  rationale: Cette formulation conserve la poésie hébraïque condensée et présente la vie comme une toile travaillée par un tisserand.
- source_word: מִדַּלָּה
  choice: de la chaîne du métier
  rationale: Le terme paraît désigner les fils pendants ou la chaîne d’un métier à tisser. La traduction précise l’image tout en signalant en note l’incertitude lexicale.
- source_word: יְבַצְּעֵנִי
  choice: il me coupe
  rationale: Le verbe exprime l’action de couper ou de trancher. « Il me coupe » s’accorde avec l’image du tissage et garde le sujet à la troisième personne.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: Du jour à la nuit
  rationale: La traduction suit de près l’expression hébraïque et souligne la rapidité avec laquelle la fin survient.
- source_word: תַּשְׁלִימֵנִי
  choice: tu me conduis à ma fin
  rationale: La forme causative signifie ici mener à son terme ou achever. Cette expression française est solennelle et conserve l’adresse directe à la deuxième personne.
theological_decisions:
- issue: Passage d’un sujet à la troisième personne à une adresse à la deuxième personne
  choice: Conserver « il me coupe… tu me conduis à ma fin »
  alternative: Harmoniser les deux propositions en employant « tu », ou éviter tout sujet explicite
  rationale: L’hébreu semble passer de la troisième personne, à l’intérieur de la métaphore du tisserand, à une adresse directe à Dieu. Maintenir ce changement respecte la texture poétique et ne résout pas silencieusement la tension grammaticale.
translation_notes:
  register: Français international moderne, poétique et digne. Les images concrètes de la tente et du tissage sont conservées ; les difficultés lexicales et le changement de personne grammaticale sont rendus visibles plutôt que nivelés.
