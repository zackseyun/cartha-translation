id: ISA.38.7
reference: Isaiah 38:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/007.yaml
  text: 'And this will be the sign to you from Yahweh[a], that Yahweh will do this thing that he has spoken:'
translation:
  language: fr
  text: 'Et voici pour toi le signe venant de Yahweh : Yahweh accomplira cette parole[a] qu’il a prononcée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette chose » ou « cette affaire ». Le mot hébreu davar peut désigner une parole, une affaire ou une chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: Et voici pour toi le signe
  rationale: La formulation conserve l’enchaînement introduit par וְ, le destinataire marqué par לְךָ et le caractère défini de הָאוֹת, tout en restant naturelle en français.
- source_word: מֵאֵת יְהוָה
  choice: venant de Yahweh
  rationale: מֵאֵת exprime ici la provenance du signe. Le nom divin est translittéré « Yahweh » afin de représenter directement le tétragramme.
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  choice: Yahweh accomplira
  rationale: Dans ce contexte de confirmation prophétique, « accomplira » rend naturellement יַעֲשֶׂה et explicite la portée du signe sans ajouter l’idée plus spécifique de promesse.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: דָּבָר peut désigner une parole, une affaire ou une chose. « Cette parole » convient au parallèle immédiat avec דִּבֵּר, tout en laissant les autres nuances signalées en note.
- source_word: אֲשֶׁר דִּבֵּר
  choice: qu’il a prononcée
  rationale: Le parfait désigne la déclaration déjà faite par Yahweh. « Prononcée » évite la répétition maladroite de « parole qu’il a dite » et conserve l’acte de parole.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie deux fois le tétragramme. La translittération préserve ici le nom divin personnel sans substituer un titre.
- issue: Rapport entre le signe et l’action annoncée
  choice: ponctuation explicative après « Yahweh »
  alternative: « le signe que Yahweh accomplira cette parole »
  rationale: La syntaxe hébraïque permet de comprendre la proposition comme l’explication de ce que garantit le signe. Les deux-points rendent ce rapport clairement en français sans identifier le signe lui-même à l’action annoncée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité prophétique sans archaïsme; le choix « accomplira » est idiomatique et souligne la réalisation de ce qui a été déclaré.
