id: ISA.38.20
reference: Isaiah 38:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֖ה לְ/הוֹשִׁיעֵ֑/נִי וּ/נְגִנוֹתַ֧י נְנַגֵּ֛ן כָּל יְמֵ֥י חַיֵּ֖י/נוּ עַל בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/020.yaml
  text: Yahweh is ready to save me[c][b][a]; and we will play my songs on stringed instruments all the days of our lives at the house of Yahweh.
translation:
  language: fr
  text: Yahvé est prêt à me sauver[a] ; et nous jouerons mes chants sur des instruments à cordes[b], tous les jours de notre vie, dans la maison de Yahvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahvé me sauvera » ; plus littéralement : « Yahvé, pour me sauver ». L’expression hébraïque est elliptique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ma musique » ou « ma musique pour instruments à cordes ».'
    reason: lexical_alternative
  - marker: c
    text: La préposition hébraïque peut aussi être comprise au sens de « auprès de la maison de Yahvé » ou « à la maison de Yahvé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française usuelle du nom divin représenté par le tétragramme, employée plutôt qu’un titre de substitution.
- source_word: לְהוֹשִׁיעֵנִי
  choice: est prêt à me sauver
  rationale: L’infinitif précédé de לְ forme ici une expression elliptique. Cette formulation française naturelle exprime l’intervention salvatrice de Yahvé sans masquer l’ellipse, signalée en note.
- source_word: וּנְגִינוֹתַי
  choice: mes chants sur des instruments à cordes
  rationale: Le nom désigne des chants ou une musique associés aux instruments à cordes. La traduction conserve le possessif et la nuance instrumentale.
- source_word: נְנַגֵּן
  choice: nous jouerons
  rationale: Le piel de נגן désigne normalement le fait de jouer d’un instrument ou de faire de la musique ; « jouerons » convient au contexte et au sujet pluriel.
- source_word: כָּל יְמֵי חַיֵּינוּ
  choice: tous les jours de notre vie
  rationale: Expression française idiomatique correspondant à la durée de toute la vie, avec maintien de la première personne du pluriel.
- source_word: עַל בֵּית יְהוָה
  choice: dans la maison de Yahvé
  rationale: עַל peut prendre ici une valeur locale liée au lieu du culte. « Dans » donne en français le sens contextuel le plus naturel, tandis que l’incertitude prépositionnelle est conservée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte le nom propre divin. La forme française « Yahvé » le représente directement au lieu de lui substituer un titre.
- issue: Valeur de l’expression elliptique יְהוָה לְהוֹשִׁיעֵנִי
  choice: Yahvé est prêt à me sauver
  alternative: Yahvé me sauvera
  rationale: L’hébreu dit littéralement « Yahvé, pour me sauver », sans verbe fini. Le texte principal offre une lecture contextuelle naturelle, tandis que la note maintient ouvertes les autres analyses possibles.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le futur simple exprime l’engagement durable du locuteur et de sa communauté. La ponctuation garde les deux mouvements du verset : le salut reçu, puis la musique offerte durant toute la vie.'
