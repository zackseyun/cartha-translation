source:
  edition: WLC
  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
translation:
  language: fr
  text: Seigneur, c’est par ces choses que l’on vit[a], et en toutes ces choses se trouve la vie de mon esprit. Rends-moi la santé[b] et fais-moi vivre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils vivent » ; le verbe hébreu n’a pas de sujet exprimé.
    reason: lexical_alternative
  - marker: b
    text: Ou « guéris-moi ». Le verbe peut désigner le fait de rendre la santé ou de rétablir quelqu’un.
    reason: lexical_alternative
  - marker: c
    text: Ou « ranime-moi » ou « garde-moi en vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le titre divin est rendu par « Seigneur », forme naturelle et digne dans une adresse directe à Dieu.
- source_word: עֲלֵיהֶם
  choice: par ces choses
  rationale: Dans ce contexte, la préposition renvoie aux réalités évoquées auparavant comme ce par quoi la vie est soutenue.
- source_word: יִחְיוּ
  choice: l’on vit
  rationale: Le verbe est à la troisième personne du masculin pluriel, sans sujet exprimé. La tournure générale « l’on vit » restitue naturellement en français cette portée indéterminée sans inventer un groupe précis.
- source_word: וּלְכָל בָּהֶן
  choice: et c’est en elles toutes
  rationale: Cette formulation conserve la nuance de sphère et la référence globale aux « choses » qui précèdent, tout en rendant intelligible une construction hébraïque difficile.
- source_word: חַיֵּי רוּחִי
  choice: la vie de mon esprit
  rationale: « Esprit » préserve ici le champ sémantique de רוּחַ, qui peut aussi évoquer le souffle, et convient au contexte de vie intérieure et physique retrouvée.
- source_word: וְתַחֲלִימֵנִי
  choice: Rends-moi donc la santé
  rationale: Le causatif exprime le rétablissement après la maladie. « Donc » explicite avec retenue le lien logique de la prière dans un français naturel.
- source_word: וְהַחֲיֵנִי
  choice: et fais-moi vivre
  rationale: Cette expression garde la valeur causative du verbe sans trancher entre ranimer, maintenir en vie et préserver la vie.
theological_decisions:
- issue: Sujet non exprimé de יִחְיוּ
  choice: 'Formulation générale : « l’on vit »'
  alternative: « ils vivent » ou « les hommes vivent »
  rationale: L’hébreu porte un verbe masculin pluriel sans sujet explicite. La traduction conserve son caractère général et signale l’ambiguïté en note, sans identifier arbitrairement ceux qui vivent.
- issue: Portée de חַיֵּי רוּחִי
  choice: « la vie de mon esprit »
  alternative: « la vie de mon souffle »
  rationale: Le choix de « esprit » conserve la profondeur anthropologique du terme sans exclure sa dimension vitale et corporelle dans ce contexte de guérison.
- issue: Valeur des deux causatifs finaux
  choice: Prière pour le rétablissement et la vie
  alternative: 'Constat ou assurance : « tu me rétabliras et me feras vivre »'
  rationale: Le contexte de supplication et la forme hébraïque permettent une lecture jussive rendue par des impératifs français, tout en évitant d’ajouter une conception doctrinale particulière de la guérison.
translation_notes:
  register: Français international moderne, naturel et soutenu. La structure emphatique « c’est… que » clarifie les deux propositions parallèles sans effacer la construction dense et quelque peu énigmatique de l’hébreu.
