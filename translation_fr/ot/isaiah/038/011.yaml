  text: אָמַ֨רְתִּי֙ לֹא אֶרְאֶ֣ה יָ֔הּ יָ֖הּ בְּ/אֶ֣רֶץ הַ/חַיִּ֑ים לֹא אַבִּ֥יט אָדָ֛ם ע֖וֹד עִם י֥וֹשְׁבֵי חָֽדֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
translation:
  language: fr
  text: 'Je me suis dit : « Je ne verrai pas Yah, Yah, sur la terre des vivants[a] ; je ne contemplerai plus aucun être humain parmi les habitants du monde[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yah » est la forme courte et poétique du nom divin, répétée ici en hébreu. Beaucoup de traductions rendent ce nom par « le SEIGNEUR » ou « l’Éternel ».
    reason: alternative_reading
  - marker: b
    text: 'Expression hébraïque difficile. Le mot rendu par « monde » (hadèl) est lié à l’idée de cesser ou de disparaître; il peut aussi évoquer la fragilité humaine. Certains y voient le domaine retranché de la vie ordinaire et traduisent : « avec les habitants du monde des morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Je me suis dit
  rationale: Le qal accompli à la première personne introduit les paroles de la complainte. « Je me suis dit » rend naturellement en français une parole intérieure, sans exclure le sens plus littéral « j’ai dit ».
- source_word: לֹא אֶרְאֶה
  choice: Je ne verrai plus
  rationale: La négation et l’inaccompli expriment ici la privation future attendue. « Plus » convient au contexte d’un mourant qui pense être retranché de la vie.
- source_word: יָהּ יָהּ
  choice: Yah, Yah
  rationale: Le texte répète la forme divine courte et poétique יָהּ. La translittération et la répétition respectent cette forme au lieu de la confondre avec le tétragramme complet.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: sur la terre des vivants
  rationale: Expression hébraïque désignant le domaine de ceux qui vivent, par opposition à la mort. En français, « sur la terre des vivants » est idiomatique dans ce contexte.
- source_word: לֹא אַבִּיט
  choice: je ne contemplerai plus
  rationale: Le hiphil de נבט signifie regarder ou contempler. Ce choix conserve le motif visuel tout en variant le vocabulaire par rapport à « voir ».
- source_word: אָדָם
  choice: aucun être humain
  rationale: Dans cette phrase négative, le singulier collectif אָדָם désigne un membre de l’humanité. « Aucun être humain » est naturel, précis et inclusif en français moderne.
- source_word: עוֹד
  choice: plus
  rationale: Avec le verbe nié, עוֹד indique que l’expérience ne se reproduira ou ne se poursuivra plus.
- source_word: עִם
  choice: parmi
  rationale: Littéralement « avec », la préposition peut situer ici l’être humain au sein d’un groupe. « Parmi » produit une relation claire en français, tout en laissant la difficulté de l’expression finale être signalée en note.
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe qal pluriel à l’état construit est employé substantivement et se rend naturellement par « les habitants de ».
- source_word: חָדֶל
  choice: le monde qui passe
  rationale: Le terme rare est lié à l’idée de cesser, disparaître ou être fragile. « Le monde qui passe » donne un français intelligible sans identifier avec certitude le référent à la demeure des morts; la difficulté demeure explicitée en note.
theological_decisions:
- issue: Forme du nom divin יָהּ plutôt que יהוה
  choice: Yah, Yah
  alternative: le SEIGNEUR, le SEIGNEUR
  rationale: Le texte porte deux fois la forme courte יָהּ, non le tétragramme complet. Conserver « Yah » et sa répétition respecte la forme poétique exacte et son insistance.
- issue: Référent de חָדֶל
  choice: le monde qui passe
  alternative: le monde des morts
  rationale: Le mot rare évoque la cessation ou la fragilité, mais son référent précis est discuté. La traduction principale évite de trancher en faveur du séjour des morts, tandis que la note expose les principales possibilités.
translation_notes:
  register: Français international moderne, digne et poétique. La formulation reste accessible, conserve la répétition solennelle du nom divin et signale en note l’obscurité réelle de la dernière expression hébraïque.
