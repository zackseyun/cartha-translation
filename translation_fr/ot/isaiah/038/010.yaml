  source_fidelity: 'Le texte rend fidèlement la plainte hébraïque : l’expression difficile בִּדְמִי יָמַי est traduite de façon contextuellement plausible par « Au milieu de mes jours », la marche inévitable vers les portes du shéol est conservée, et פֻּקַּדְתִּי est bien exprimé comme une privation des années restantes. « Franchir les portes » est une formulation française naturelle qui rend de manière acceptable l’entrée impliquée par l’expression « aux/dans les portes du shéol », sans surdéterminer davantage le texte.'
