id: ISA.38.10
reference: Isaiah 38:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֣י אָמַ֗רְתִּי בִּ/דְמִ֥י יָמַ֛/י אֵלֵ֖כָה בְּ/שַׁעֲרֵ֣י שְׁא֑וֹל פֻּקַּ֖דְתִּי יֶ֥תֶר שְׁנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
translation:
  language: fr
  text: 'J’ai dit : « Au milieu de mes jours[a], je dois franchir les portes du shéol[b] ; je suis privé du reste de mes années. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile : « au retranchement de mes jours » ou « dans le calme de mes jours » ; le sens est probablement « au milieu » ou « dans la pleine force de ma vie ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « le séjour des morts » ou « la tombe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי יָמַי
  choice: au milieu de mes jours
  rationale: L’expression est difficile, mais le contexte — la perte des années qui restaient — indique vraisemblablement le milieu ou la pleine force de la vie. « Mes jours » conserve l’image hébraïque de la durée de vie.
- source_word: אֵלֵכָה בְּשַׁעֲרֵי
  choice: je dois franchir les portes
  rationale: Le verbe exprime ici le départ imminent et inévitable vers la mort. Avec « les portes », « franchir » rend naturellement l’idée d’entrer dans le domaine des morts, tout en évitant une formulation française pesante.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération conserve le concept hébraïque du domaine des morts sans le réduire à la tombe ni lui attribuer les connotations doctrinales ultérieures de l’enfer.
- source_word: פֻּקַּדְתִּי יֶתֶר שְׁנוֹתָי
  choice: je suis privé du reste de mes années
  rationale: Dans cette plainte, la forme passive de פקד évoque la perte imposée des années qui auraient dû rester au locuteur. Cette formulation française exprime clairement cette privation.
theological_decisions:
- issue: Rendu de שְׁאוֹל dans une plainte devant la mort imminente
  choice: shéol
  alternative: le séjour des morts ; la tombe
  rationale: « Shéol » préserve le langage hébraïque ancien sur la mort et n’impose ni l’idée d’un simple lieu d’inhumation ni celle, plus tardive, de l’enfer.
translation_notes:
  register: Français international moderne, digne et accessible. « J’ai dit » suit directement l’hébreu ; « mes jours » maintient l’image poétique biblique. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
