  text: כְּ/ס֤וּס עָגוּר֙ כֵּ֣ן אֲצַפְצֵ֔ף אֶהְגֶּ֖ה כַּ/יּוֹנָ֑ה דַּלּ֤וּ עֵינַ/י֙ לַ/מָּר֔וֹם אֲדֹנָ֖/י עָֽשְׁקָה לִּ֥/י עָרְבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
translation:
  language: fr
  text: Comme le martinet ou la grue[a], je pousse de petits cris ; je gémis comme la colombe. Mes yeux se fatiguent à regarder vers le haut. Seigneur, je suis opprimé ; porte-toi garant pour moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’identification traditionnelle : « Comme l’hirondelle ou la grue. » Le nom du premier oiseau est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  choice: Comme le martinet ou la grue
  rationale: Les noms d’oiseaux, surtout סוּס, sont difficiles à identifier. « Martinet » est une identification moderne plausible, tandis que « hirondelle » est traditionnelle ; la note conserve cette incertitude.
- source_word: אֲצַפְצֵף
  choice: je pousse de petits cris
  rationale: Le verbe évoque les cris aigus et faibles d’un oiseau. Cette formulation est naturelle en français dans la bouche d’un malade, sans suggérer un chant joyeux.
- source_word: אֶהְגֶּה
  choice: je gémis
  rationale: Dans ce contexte de plainte, le verbe désigne une émission de voix basse et douloureuse ; « gémir » rend clairement cette détresse.
- source_word: כַּיּוֹנָה
  choice: comme la colombe
  rationale: La comparaison est directe et évoque le roucoulement plaintif de la colombe.
- source_word: דַּלּוּ עֵינַי
  choice: Mes yeux s’épuisent
  rationale: L’expression décrit des yeux affaiblis ou épuisés par l’attente et l’effort du regard.
- source_word: לַמָּרוֹם
  choice: à regarder vers les hauteurs
  rationale: Le mot signifie littéralement « vers la hauteur / les hauteurs ». Cette traduction conserve la direction du regard sans expliciter abusivement « le ciel ».
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי employé en apostrophe, et non du nom divin YHWH.
- source_word: עָשְׁקָה לִּי
  choice: je suis opprimé
  rationale: La proposition très concise exprime le tort ou l’oppression subie. La tournure passive restitue naturellement la plainte en français.
- source_word: עָרְבֵנִי
  choice: sois mon garant
  rationale: Le verbe appartient au langage de la garantie et du cautionnement. « Sois mon garant » préserve cette image juridique et relationnelle sans la réduire au sens général de « aide-moi ».
theological_decisions:
- issue: Traduction de l’adresse divine אֲדֹנָי
  choice: Seigneur
  alternative: mon Seigneur
  rationale: Le texte porte un titre divin en adresse directe. « Seigneur » le traduit sans le confondre avec le nom divin YHWH.
- issue: Identification incertaine des oiseaux dans כְּסוּס עָגוּר
  choice: Comme le martinet ou la grue
  alternative: Comme l’hirondelle ou la grue
  rationale: L’identification zoologique du premier terme est incertaine. Le texte principal retient une proposition plausible et la note signale franchement l’identification traditionnelle.
- issue: Image juridique dans עָרְבֵנִי
  choice: sois mon garant
  alternative: interviens pour moi
  rationale: La formulation retenue garde l’idée précise de se porter garant pour quelqu’un, sans transformer silencieusement cette demande en simple appel à l’aide.
translation_notes:
  register: Français moderne, international et digne. Le rythme bref conserve la succession des cris, du regard épuisé et de l’appel à Dieu. « Sois mon garant » assume une légère solennité afin de préserver l’image juridique de l’hébreu.
