  source_fidelity: 'Le texte rend fidèlement les quatre membres poétiques : שְׁאוֹל est traduit sans réduction à une tombe matérielle, ידה et הלל gardent une distinction utile (« rend grâce » / « célèbre »), et l’image de ceux qui descendent dans la fosse est préservée. « N’espèrent pas en ta fidélité » rend de façon recevable l’attente confiante associée à אמת, dont la note signale justement l’alternative « vérité ».'
