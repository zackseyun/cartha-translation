id: ISA.38.18
reference: Isaiah 38:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י לֹ֥א שְׁא֛וֹל תּוֹדֶ֖/ךָּ מָ֣וֶת יְהַלְלֶ֑/ךָּ לֹֽא יְשַׂבְּר֥וּ יֽוֹרְדֵי ב֖וֹר אֶל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
translation:
  language: fr
  text: 'Car le séjour des morts ne te rend pas grâce[a],

    la mort ne te célèbre pas ;

    ceux qui descendent dans la fosse

    n’espèrent pas en ta fidélité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Shéol » ou « le monde des morts ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’attendent pas ta vérité ». Le texte hébreu peut exprimer l’attente confiante de la vérité ou de la fidélité de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française naturelle désigne le domaine des morts sans réduire le terme hébreu à la seule tombe physique. Une note conserve « Shéol » comme autre possibilité.
- source_word: תּוֹדֶךָּ
  choice: ne te rend pas grâce
  rationale: Le hifil de ידה exprime ici l’action de rendre grâce ou de louer. « Rendre grâce » maintient une distinction avec הלל dans le membre parallèle.
- source_word: מָוֶת
  choice: la mort
  rationale: Équivalent direct du nom hébreu, employé poétiquement en parallèle avec le séjour des morts.
- source_word: יְהַלְלֶךָּ
  choice: ne te célèbre pas
  rationale: Le piel de הלל signifie louer ou célébrer. « Célébrer » évite de confondre ce verbe avec ידה tout en conservant le parallélisme.
- source_word: יְשַׂבְּרוּ
  choice: n’espèrent pas en
  rationale: Le piel de שׂבר exprime l’attente confiante. « Espérer en » est idiomatique avec la fidélité de Dieu, tandis que la note signale la possibilité « attendre ».
- source_word: יוֹרְדֵי בוֹר
  choice: ceux qui descendent dans la fosse
  rationale: La formulation participiale et l’image concrète de la descente sont conservées dans un français naturel.
- source_word: בּוֹר
  choice: la fosse
  rationale: « Fosse » préserve l’image poétique du בור associé au domaine de la mort, sans l’identifier trop étroitement à une tombe.
- source_word: אֲמִתֶּךָ
  choice: ta fidélité
  rationale: אמת peut désigner la vérité, la fiabilité ou la fidélité. Avec l’attente confiante exprimée par שׂבר, « fidélité » rend bien la constance fiable de Dieu sans exclure entièrement la nuance de vérité.
theological_decisions:
- issue: Portée de l’affirmation sur les morts et la louange
  choice: Traduire directement l’affirmation poétique selon laquelle le séjour des morts et la mort ne rendent pas grâce à Dieu, sans ajouter d’explication doctrinale dans le verset.
  alternative: Interpréter explicitement le verset comme une négation de toute conscience après la mort, ou le limiter expressément au culte public terrestre.
  rationale: Le texte décrit poétiquement la rupture produite par la mort quant à la louange et à l’attente, mais ne formule pas à lui seul une doctrine complète de l’état des morts. La traduction préserve donc cette tension.
- issue: Sens de אמת
  choice: ta fidélité
  alternative: ta vérité
  rationale: Le contexte de l’espérance favorise la fiabilité ou fidélité divine, mais le champ sémantique inclut aussi la vérité; cette autre lecture est conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Les quatre membres hébreux sont présentés sur quatre lignes pour faire ressortir le parallélisme. « Séjour des morts » est plus immédiatement intelligible que la seule translittération « Shéol », tandis que les notes préservent les principales possibilités lexicales.
