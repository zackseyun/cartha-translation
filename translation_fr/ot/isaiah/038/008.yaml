  text: הִנְ/נִ֣י מֵשִׁ֣יב אֶת צֵ֣ל הַֽ/מַּעֲל֡וֹת אֲשֶׁ֣ר יָרְדָה֩ בְ/מַעֲל֨וֹת אָחָ֥ז בַּ/שֶּׁ֛מֶשׁ אֲחֹרַנִּ֖ית עֶ֣שֶׂר מַעֲל֑וֹת וַ/תָּ֤שָׁב הַ/שֶּׁ֨מֶשׁ֙ עֶ֣שֶׂר מַעֲל֔וֹת בַּֽ/מַּעֲל֖וֹת אֲשֶׁ֥ר יָרָֽדָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/008.yaml
  text: Behold[a], I will make the shadow go back ten steps, which had gone down on the steps of Ahaz by the sun[b]. And the sun went back ten steps on the steps on which it had gone down.
translation:
  language: fr
  text: Voici que je vais faire reculer de dix marches[a] l’ombre qui était descendue, sous l’effet du soleil, sur les marches d’Ahaz[b]. Et le soleil recula de dix marches sur les marches qu’il avait descendues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dix degrés ». Le mot hébreu signifie littéralement « marches » ou « montées »; certains pensent qu’il s’agit d’une construction en forme d’escalier servant à mesurer le déplacement de l’ombre.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur le cadran d’Ahaz ». L’hébreu dit « sur les marches d’Ahaz »; la nature exacte de cette construction reste incertaine.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici que
  rationale: Introduit avec solennité l’annonce divine tout en restant naturel en français moderne.
- source_word: מֵשִׁיב
  choice: je vais faire reculer
  rationale: Rend la valeur causative du hifil de שוב et intègre naturellement l’idée de mouvement en arrière portée par אֲחֹרַנִּית.
- source_word: צֵל
  choice: l’ombre
  rationale: Conserve la désignation concrète du signe sans explicitation supplémentaire.
- source_word: מַעֲלוֹת
  choice: marches
  rationale: Le nom désigne littéralement des marches ou des degrés; « marches » préserve l’image concrète sans imposer l’interprétation d’un cadran solaire.
- source_word: בְמַעֲלוֹת אָחָז
  choice: sur les marches d’Ahaz
  rationale: Reproduit la formulation hébraïque et laisse ouverte la nature exacte de la construction associée à Ahaz.
- source_word: בַּשֶּׁמֶשׁ
  choice: sous l’effet du soleil
  rationale: Exprime en français naturel le rôle du soleil dans la descente de l’ombre, sans confondre le soleil avec l’ombre.
- source_word: עֶשֶׂר מַעֲלוֹת
  choice: dix marches
  rationale: Conserve le nombre et le sens concret du terme hébreu; « dix degrés » demeure une possibilité interprétative signalée en note.
- source_word: וַתָּשָׁב הַשֶּׁמֶשׁ
  choice: Et le soleil recula
  rationale: Le sujet explicite est le soleil. Cette formulation conserve la description phénoménologique du récit.
- source_word: אֲשֶׁר יָרָדָה
  choice: qu’il avait descendues
  rationale: Le pronom renvoie grammaticalement au soleil dans la seconde phrase et conserve l’image directionnelle du texte.
theological_decisions:
- issue: Nature du signe concernant le soleil et l’ombre
  choice: 'Décrire le phénomène comme le fait le texte: l’ombre est ramenée en arrière et le soleil recule.'
  alternative: Réduire le signe au fonctionnement d’un cadran solaire ou reformuler pour éviter toute idée de recul du soleil.
  rationale: L’hébreu présente le signe miraculeux dans le langage ordinaire de l’observation. La traduction ne doit ni l’expliquer scientifiquement ni en atténuer le caractère extraordinaire.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les répétitions structurantes du texte, son langage phénoménologique et l’incertitude concernant les « marches d’Ahaz », sans imposer l’image d’un cadran solaire.
