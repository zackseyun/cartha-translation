source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יְשַׁעְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/004.yaml
  text: Then the word of Yahweh came to Isaiah[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh[a] fut adressée à Ésaïe en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; également transcrit « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et une autre transcription traditionnelle.
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: Le wayyiqtol de היה fait progresser le récit. En français, la tournure « Alors ... fut adressée » exprime naturellement la venue de la parole sans recourir au calque archaïque « il arriva que ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule prophétique דְּבַר יְהוָה, « la parole » conserve l’expression biblique reconnaissable et reste moins interprétatif que « le message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu et à la couche de consultation fournie.
- source_word: אֶל יְשַׁעְיָהוּ
  choice: à Ésaïe
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Ésaïe » est l’équivalent français naturel.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu du discours au verset suivant. « En ces termes » remplit naturellement cette fonction en français et évite le participe lourd « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH, Jéhovah ou le SEIGNEUR
  rationale: L’hébreu porte directement le tétragramme. « Yahweh » préserve ici sa valeur de nom propre sans lui substituer un titre; la note signale la forme hébraïque et une autre transcription connue.
translation_notes:
  register: Français moderne, courant et digne. La formule prophétique « la parole de Yahweh fut adressée à » est idiomatique et reconnaissable; « en ces termes » assure la liaison avec la citation du verset suivant.
