id: ISA.38.1
reference: Isaiah 38:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּב֣וֹא אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
translation:
  language: fr
  text: 'En ces jours-là, Ézéchias tomba malade, au point d’en mourir[a]. Le prophète Ésaïe, fils d’Amots, vint le voir et lui dit : « Voici ce que dit Yahweh : Mets de l’ordre dans ta maison, car tu vas mourir ; tu ne vivras pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « jusqu’à mourir ». L’expression hébraïque présente la maladie comme mortelle.'
    reason: Précision sur la construction לָמוּת et conservation de sa nuance résultative.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Reproduit l’expression temporelle hébraïque et son lien narratif dans un français soutenu mais courant.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Ézéchias tomba malade, au point d’en mourir
  rationale: « Tomba malade » rend l’entrée dans la maladie, tandis que « au point d’en mourir » exprime la portée résultative de לָמוּת sans réduire la formule à une simple proximité de la mort.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: le prophète Ésaïe, fils d’Amots
  rationale: Ordre idiomatique en français qui conserve le titre et la filiation. Les formes françaises traditionnelles et largement reconnues des noms bibliques sont employées.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Rend naturellement en français la formule prophétique de messager tout en conservant son caractère solennel.
- source_word: צַו לְבֵיתֶךָ
  choice: Mets de l’ordre dans ta maison
  rationale: Rend l’idiome demandant de régler les affaires de sa maison avant de mourir, sans limiter בַּיִת à la seule famille ou au seul bâtiment.
- source_word: כִּי מֵת אַתָּה
  choice: car tu vas mourir
  rationale: Communique la mort imminente et certaine annoncée par le participe hébreu, là où un calque « tu es mort » serait trompeur en français.
- source_word: וְלֹא תִחְיֶה
  choice: tu ne vivras pas
  rationale: Suit directement le sens du verbe « vivre » et évite l’interprétation plus étroite « tu ne guériras pas ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’annonce כִּי מֵת אַתָּה וְלֹא תִחְיֶה
  choice: « car tu vas mourir ; tu ne vivras pas »
  alternative: « car tu es mourant et tu ne guériras pas »
  rationale: La formulation retenue conserve le caractère certain et imminent de l’annonce, sans introduire la notion médicale plus étroite de guérison.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle sans archaïsme ; le tutoiement correspond à l’adresse directe au roi au singulier.
