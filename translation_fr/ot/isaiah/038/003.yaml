source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
translation:
  language: fr
  text: 'Il dit : « Je t’en prie, Yahweh, souviens-toi que j’ai marché devant toi avec fidélité et d’un cœur entier[a], et que j’ai fait ce qui est bien à tes yeux. » Puis Ézéchias pleura abondamment[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un cœur sans partage » ; littéralement, « d’un cœur complet » ou « entier ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pleura de grands pleurs ».
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אָנָּה ... נָא
  choice: Je t’en prie
  rationale: Rend naturellement en français la supplication insistante portée par les deux particules.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: j’ai marché devant toi
  rationale: Conserve l’image biblique de la marche devant Dieu et sa portée relationnelle.
- source_word: בֶּאֱמֶת
  choice: avec fidélité
  rationale: Dans ce contexte de conduite devant Dieu, le terme exprime la loyauté et l’intégrité, tout en pouvant aussi signifier « vérité ».
- source_word: וּבְלֵב שָׁלֵם
  choice: d’un cœur entier
  rationale: Exprime la plénitude et l’intégrité de l’attachement sans suggérer une perfection morale absolue.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: j’ai fait ce qui est bien à tes yeux
  rationale: Préserve l’idiome hébreu qui présente Dieu comme juge de ce qui est bien.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: pleura abondamment
  rationale: Rend en français naturel l’intensité de la tournure littérale « pleura de grands pleurs ».
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Emploie la forme française traditionnelle et immédiatement reconnaissable du nom.
theological_decisions:
- issue: La description que fait Ézéchias de sa propre conduite
  choice: d’un cœur entier
  alternative: d’un cœur parfait ; d’un cœur sans partage
  rationale: Le texte affirme l’intégrité de son attachement dans cette prière, sans qu’il soit nécessaire d’y lire une revendication d’absence totale de péché.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les principales images hébraïques sans produire de tournures artificielles.
