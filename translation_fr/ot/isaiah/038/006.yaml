id: ISA.38.6
reference: Isaiah 38:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִ֖י עַל הָ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/006.yaml
  text: And I will deliver you and this city from the hand of the king of Assyria[a], and I will defend this city.
translation:
  language: fr
  text: Je te délivrerai, toi et cette ville, du pouvoir du roi d’Assyrie[a], et je protégerai cette ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main du roi d’Assyrie » ; cette expression hébraïque désigne ici son pouvoir ou son emprise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף
  choice: du pouvoir de
  rationale: Littéralement « de la paume de » ou, selon l’idiome, « de la main de ». En français moderne, « du pouvoir de » exprime naturellement l’idée d’emprise ou de domination tout en maintenant le sens militaire du contexte.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: du roi d’Assyrie
  rationale: Cette construction française rend directement et naturellement le groupe génitival hébreu.
- source_word: אַצִּילְךָ
  choice: Je te délivrerai
  rationale: Le hifil de נצל signifie arracher au danger, délivrer ou secourir. « Délivrer » convient au contexte militaire et conserve un registre biblique digne sans ajouter une portée doctrinale étrangère au passage.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: toi et cette ville
  rationale: Le suffixe de deuxième personne et le second objet direct sont coordonnés sous le même verbe. La répétition de « toi » rend la structure claire en français.
- source_word: וְגַנּוֹתִי
  choice: et je protégerai
  rationale: Le verbe גנן évoque l’action de couvrir, protéger ou défendre. « Protéger » restitue bien l’action divine, tandis que le contexte rend évidente sa dimension militaire.
- source_word: עַל הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Avec גנן, עַל introduit l’objet de la protection. Le français idiomatique emploie directement « protéger cette ville » plutôt qu’un calque tel que « protéger sur cette ville ».
theological_decisions:
- issue: La délivrance divine dans un contexte historique et militaire
  choice: « Je te délivrerai »
  alternative: « Je te sauverai » ou « Je te secourrai »
  rationale: Le verset annonce la libération d’Ézéchias et de Jérusalem face au roi d’Assyrie. « Délivrer » maintient cette portée historique sans imposer au verbe une signification sotériologique plus large.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la répétition finale de « cette ville », présente dans l’hébreu, et rend explicite la coordination de la personne du roi avec la ville.
