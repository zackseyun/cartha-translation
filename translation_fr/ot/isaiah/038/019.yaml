id: ISA.38.19
reference: Isaiah 38:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חַ֥י חַ֛י ה֥וּא יוֹדֶ֖/ךָ כָּמ֣וֹ/נִי הַ/יּ֑וֹם אָ֣ב לְ/בָנִ֔ים יוֹדִ֖יעַ אֶל אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
translation:
  language: fr
  text: Le vivant, le vivant, c’est lui qui te rend grâce, comme moi aujourd’hui ; un père fait connaître à ses enfants[a] ta fidélité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vérité ». Le mot hébreu peut désigner la vérité, la fidélité ou la fiabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  choice: Le vivant, le vivant
  rationale: La répétition emphatique de l’hébreu est conservée, ainsi que sa formulation nominale concise.
- source_word: יוֹדֶךָ
  choice: te rend grâce
  rationale: Dans ce chant d’Ézékias, le hifil de ידה exprime l’action de remercier Dieu et de célébrer ses bienfaits.
- source_word: כָּמוֹנִי הַיּוֹם
  choice: comme moi aujourd’hui
  rationale: Cette formulation naturelle en français reprend implicitement l’action du verbe précédent, sans supprimer la comparaison ni son ancrage dans le présent.
- source_word: אָב לְבָנִים
  choice: un père… à ses enfants
  rationale: בָּנִים signifie littéralement « fils », mais peut désigner ici les descendants auxquels un père transmet ce qu’il connaît de Dieu. La note conserve le sens formel.
- source_word: יוֹדִיעַ
  choice: fait connaître
  rationale: Cette expression rend directement la valeur causative du hifil de ידע sans préciser indûment le mode de transmission.
- source_word: אֱמִתֶּךָ
  choice: ta fidélité
  rationale: Dans ce contexte, אֱמֶת évoque le caractère digne de confiance de Dieu. « Vérité » demeure toutefois une possibilité réelle, signalée en note.
theological_decisions:
- issue: Portée de בָּנִים
  choice: enfants
  alternative: fils
  rationale: Le propos concerne vraisemblablement la transmission d’une génération à la suivante, sans qu’il soit nécessaire de la limiter aux descendants masculins ; le sens littéral est néanmoins indiqué en note.
- issue: Nuance de אֱמֶת appliqué à Dieu
  choice: fidélité
  alternative: vérité
  rationale: « Fidélité » exprime ici naturellement la fiabilité de Dieu proclamée aux générations suivantes, tandis que « vérité » reste une lecture lexicale possible et est préservée en note.
translation_notes:
  register: Français moderne, international et digne. La reprise « Le vivant, le vivant » conserve l’emphase poétique de l’hébreu ; « c’est lui qui » rend cette tournure intelligible sans en atténuer la force.
