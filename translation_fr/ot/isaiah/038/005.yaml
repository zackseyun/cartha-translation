base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: fr
  text: 'Va dire à Ézéchias : « Voici ce que dit le SEIGNEUR, le Dieu de David, ton ancêtre : J’ai entendu ta prière et j’ai vu tes larmes. Je vais ajouter quinze années à ta vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Va dire
  rationale: L’infinitif absolu suivi du verbe conjugué forme ici une instruction idiomatique; « Va dire » est naturel et fidèle au mouvement et à l’ordre.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme tout en le distinguant d’un simple titre.
- source_word: אָבִיךָ
  choice: ton ancêtre
  rationale: David n’est pas le père immédiat d’Ézéchias; le terme hébreu peut désigner un aïeul ou ancêtre.
- source_word: הִנְנִי יוֹסִף
  choice: Je vais ajouter
  rationale: הִנְנִי présente avec insistance l’action imminente du locuteur; en français, la tournure prospective rend naturellement l’ensemble sans interjection artificielle.
- source_word: עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: quinze années à ta vie
  rationale: Rend le sens de l’ajout à la durée de vie plutôt que de calquer l’expression « à tes jours ».
theological_decisions:
- issue: Relation de David à Ézéchias
  choice: ton ancêtre
  alternative: ton père
  rationale: Conserve le lien dynastique exprimé par אָב sans suggérer en français moderne une paternité immédiate.
- issue: Représentation du nom divin
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit une convention biblique française largement intelligible sans imposer une vocalisation reconstruite du tétragramme.
- issue: Force de הִנְנִי
  choice: intégrée dans « Je vais ajouter »
  alternative: Voici, j’ajoute / Regarde, je vais ajouter
  rationale: Le marqueur attire l’attention sur l’intervention divine imminente; l’imminence verbale la rend avec dignité, sans faire de « Regarde » un ordre littéral.
translation_notes:
  register: Français international moderne, clair et digne. Discours direct ponctué selon l’usage français; parallélisme de « J’ai entendu… j’ai vu… » conservé.
