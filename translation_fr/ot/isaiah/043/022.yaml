  text: וְ/לֹא אֹתִ֥/י קָרָ֖אתָ יַֽעֲקֹ֑ב כִּֽי יָגַ֥עְתָּ בִּ֖/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
translation:
  language: fr
  text: Pourtant, tu ne m’as pas invoqué[a], Jacob, car tu t’es lassé de moi[b], Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne m’as pas appelé ». Le verbe hébreu signifie simplement « appeler », mais il prend souvent le sens d’« invoquer » dans un contexte de prière ou de culte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu t’es fatigué à mon égard ». La préposition hébraïque permet une nuance proche, bien que « tu t’es lassé de moi » soit plus naturel dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Pourtant… ne… pas
  rationale: La conjonction suivie de la négation marque ici un contraste avec le contexte précédent. « Pourtant » rend naturellement la force du reproche.
- source_word: אֹתִי קָרָאתָ
  choice: tu ne m’as pas invoqué
  rationale: קרא signifie fondamentalement « appeler », mais, lorsque Dieu en est l’objet dans un contexte religieux, le verbe peut désigner le fait de l’invoquer. « Invoquer » exprime ce sens sans ajouter d’objet implicite à la prière.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est employé comme apostrophe et désigne collectivement le peuple de l’alliance.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit le motif du reproche précédent. « Car » conserve le lien explicatif dans un français fluide et digne.
- source_word: יָגַעְתָּ
  choice: tu t’es lassé
  rationale: יגע exprime la fatigue ou la lassitude. La forme pronominale française rend naturellement l’état dans lequel Israël est entré.
- source_word: בִּי
  choice: de moi
  rationale: Avec יגע, la préposition ב peut indiquer ce à l’égard de quoi on éprouve de la lassitude. « Se lasser de moi » est le sens le plus naturel dans ce contexte, tandis que l’autre construction possible est signalée en note.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre forme une seconde apostrophe parallèle à « Jacob » et désigne le même peuple.
theological_decisions:
- issue: Nature du manquement d’Israël envers Dieu
  choice: Israël est repris pour ne pas avoir invoqué Dieu et pour s’être lassé de lui.
  alternative: Israël n’a pas appelé Dieu, mais l’a fatigué.
  rationale: 'La syntaxe fait d’Israël le sujet des deux verbes à la deuxième personne : « tu ne m’as pas invoqué » et « tu t’es lassé de moi ». Cette lecture préserve l’accusation directe sans lui ajouter une explication théologique étrangère au verset.'
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier conserve l’adresse collective à Jacob-Israël. Le parallélisme des deux apostrophes et la tension du reproche sont maintenus.
