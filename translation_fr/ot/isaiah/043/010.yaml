  text: אַתֶּ֤ם עֵדַ/י֙ נְאֻם יְהוָ֔ה וְ/עַבְדִּ֖/י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ וְ/תַאֲמִ֨ינוּ לִ֤/י וְ/תָבִ֨ינוּ֙ כִּֽי אֲנִ֣י ה֔וּא לְ/פָנַ/י֙ לֹא נ֣וֹצַר אֵ֔ל וְ/אַחֲרַ֖/י לֹ֥א יִהְיֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
translation:
  language: fr
  text: « Vous êtes mes témoins, déclare Yahweh, et mon serviteur que j’ai choisi, afin que vous sachiez, croyiez en moi[a] et compreniez que c’est moi[b]. Avant moi, aucun dieu n’a été formé, et après moi, il n’y en aura pas[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « que vous me croyiez » ou « que vous me fassiez confiance ». La construction hébraïque peut exprimer le fait de croire Dieu ou de placer sa confiance en lui.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que je suis lui ». La formule hébraïque, concise, est une auto-identification divine employée dans Ésaïe. On peut aussi traduire : « que je suis celui-là ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est elliptique : « et après moi, il n’y en aura pas ». Le dieu mentionné dans la proposition précédente reste sous-entendu.'
    reason: ellipsis
lexical_decisions:
- source_word: עֵדַי
  choice: mes témoins
  rationale: Le nom est au pluriel avec un suffixe de première personne du singulier. Il présente collectivement les destinataires comme les témoins de Yahweh.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formulation française naturelle conserve la solennité de la formule prophétique et rend explicitement le nom divin.
- source_word: וְעַבְדִּי אֲשֶׁר בָּחָרְתִּי
  choice: et mon serviteur, celui que j’ai choisi
  rationale: Le singulier « serviteur » respecte la forme hébraïque, tandis que la tournure appositive rend clairement la proposition relative sans déterminer davantage l’identité du serviteur.
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but et commande naturellement le subjonctif dans les trois propositions coordonnées.
- source_word: וְתַאֲמִינוּ לִי
  choice: que vous croyiez en moi
  rationale: Le hiphil de אמן suivi de ל peut exprimer la foi ou la confiance placée en quelqu’un. « Croire en moi » est naturel en français et conserve ici la portée relationnelle, sans exclure « me faire confiance ».
- source_word: כִּי אֲנִי הוּא
  choice: que moi, je suis lui
  rationale: Cette formulation volontairement concise conserve la structure de l’auto-identification hébraïque et son poids théologique, plutôt que de la réduire à une simple copule française.
- source_word: לֹא נוֹצַר אֵל
  choice: aucun dieu n’a été formé
  rationale: Le passif de יצר est rendu directement. La minuscule à « dieu » marque le nom commun dans la comparaison polémique avec Yahweh.
- source_word: וְאַחֲרַי לֹא יִהְיֶה
  choice: et après moi, il n’y en aura pas
  rationale: Le français explicite par le pronom « en » le dieu sous-entendu dans la proposition hébraïque elliptique, tout en maintenant sa brièveté.
theological_decisions:
- issue: Référent de « mon serviteur »
  choice: Conserver le singulier sans identifier explicitement le référent
  alternative: Préciser qu’il s’agit collectivement d’Israël/Jacob, ou y voir une figure individuelle
  rationale: Le contexte immédiat favorise une référence collective au peuple, auquel le pluriel « vous » s’adresse, mais la traduction garde le singulier hébreu et n’impose pas une identification dans le verset.
- issue: Formule אֲנִי הוּא
  choice: « moi, je suis lui »
  alternative: « c’est moi » ou « je suis celui qui est »
  rationale: Le choix retient l’étrangeté et la densité de la formule hébraïque d’auto-identification. « C’est moi » serait plus idiomatique mais moins marqué, tandis que « je suis celui qui est » ajouterait une interprétation absente du texte.
- issue: Absence de dieu avant et après Yahweh
  choice: Traduire l’énoncé temporel tel qu’il se présente
  alternative: Le reformuler comme une affirmation générale et intemporelle qu’il n’existe aucun autre dieu
  rationale: 'La traduction préserve l’image et la tension du texte : aucun dieu n’a été formé avant Yahweh et aucun ne viendra après lui, sans convertir silencieusement cette formulation en proposition doctrinale plus abstraite.'
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme « savoir, croire, comprendre » ainsi que la formule divine dense. Le nom divin est rendu par « Yahweh » conformément à la couche de consultation fournie.
