id: ISA.43.3
reference: Isaiah 43:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֗י אֲנִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ קְד֥וֹשׁ יִשְׂרָאֵ֖ל מוֹשִׁיעֶ֑/ךָ נָתַ֤תִּי כָפְרְ/ךָ֙ מִצְרַ֔יִם כּ֥וּשׁ וּ/סְבָ֖א תַּחְתֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
translation:
  language: fr
  text: Car moi, je suis Yahvé, ton Dieu, le Saint d’Israël, ton Sauveur. J’ai donné l’Égypte comme rançon pour toi[a], Koush[b] et Seba à ta place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne ici un prix compensatoire donné pour quelqu’un ; la fin du verset exprime également l’idée de substitution ou d’échange.
    reason: lexical_alternative
  - marker: b
    text: Koush est une ancienne région située au sud de l’Égypte, souvent associée à la Nubie et à l’Éthiopie antique.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’assurance donnée dans le contexte précédent.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui préserve sa valeur de nom propre et sa portée d’alliance.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement le nom avec le suffixe masculin singulier de deuxième personne.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Conserve le titre caractéristique du livre d’Ésaïe dans une formulation française naturelle et consacrée.
- source_word: מוֹשִׁיעֶךָ
  choice: ton Sauveur
  rationale: Le participe substantivé caractérise Dieu comme celui qui sauve; le nom français conserve la concision et le suffixe personnel.
- source_word: נָתַתִּי
  choice: J’ai donné
  rationale: Le passé composé exprime un acte accompli dont la portée demeure pertinente dans l’oracle.
- source_word: כָפְרְךָ
  choice: pour ta rançon
  rationale: Dans ce contexte, le terme désigne un prix compensatoire remis en échange d’une personne, sans imposer un sens cultuel d’expiation.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Nom géographique français standard.
- source_word: כּוּשׁ
  choice: Koush
  rationale: La translittération évite l’identification anachronique avec un État moderne et correspond à l’usage français.
- source_word: סְבָא
  choice: Seba
  rationale: Translittération du nom géographique, distinct de Saba.
- source_word: תַּחְתֶּיךָ
  choice: à ta place
  rationale: Rend clairement la substitution exprimée par la préposition tout en conservant la force et l’ambiguïté de l’image d’échange.
theological_decisions:
- issue: Sens de l’échange impliquant l’Égypte, Koush et Seba
  choice: Le verset présente ces peuples comme donnés en rançon ou à la place d’Israël dans le cadre de sa délivrance nationale.
  alternative: Comprendre l’expression plus largement comme une compensation politique, sans véritable image de rançon.
  rationale: Le parallélisme entre « pour ta rançon » et « à ta place » soutient une idée forte de substitution ou d’échange, mais le texte ne doit pas être chargé d’une théorie ultérieure de l’expiation.
translation_notes:
  register: Français moderne, international et digne. Le redoublement « moi, je » restitue l’insistance du pronom hébreu. Les titres divins restent concis et reconnaissables; les noms anciens sont translittérés.
