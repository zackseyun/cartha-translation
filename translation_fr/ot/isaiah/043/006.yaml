id: ISA.43.6
reference: Isaiah 43:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֹמַ֤ר לַ/צָּפוֹן֙ תֵּ֔נִי וּ/לְ/תֵימָ֖ן אַל תִּכְלָ֑אִי הָבִ֤יאִי בָנַ/י֙ מֵ/רָח֔וֹק וּ/בְנוֹתַ֖/י מִ/קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
translation:
  language: fr
  text: 'Je dirai au nord : « Donne-les », et au sud : « Ne les retiens pas. » Fais venir mes fils de loin et mes filles de l’extrémité de la terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹמַר
  choice: Je dirai
  rationale: L’imparfait qal à la première personne du singulier a ici une valeur future naturelle dans cette déclaration prophétique.
- source_word: לַצָּפוֹן
  choice: au nord
  rationale: Le point cardinal est personnifié et directement interpellé.
- source_word: תֵּנִי
  choice: Donne-les
  rationale: L’impératif féminin singulier s’adresse au nord personnifié. L’objet est implicite en hébreu, mais le pronom « les » reprend naturellement les personnes dispersées mentionnées par le contexte.
- source_word: וּלְתֵימָן
  choice: et au sud
  rationale: Le parallélisme avec le nord indique le point cardinal, et non le nom propre Témân.
- source_word: אַל תִּכְלָאִי
  choice: Ne les retiens pas
  rationale: Cette formulation française actuelle exprime clairement l’interdiction adressée au sud personnifié, avec le peuple dispersé comme objet implicite.
- source_word: הָבִיאִי
  choice: Fais venir
  rationale: L’impératif hiphil exprime la causation. « Fais venir » rend plus précisément cette valeur que le simple « amène » et convient à l’appel lancé à une région personnifiée.
- source_word: בָנַי
  choice: mes fils
  rationale: Le masculin pluriel est conservé, en parallèle explicite avec « mes filles ».
- source_word: מֵרָחוֹק
  choice: de loin
  rationale: Expression française naturelle et fidèle à l’indication d’une provenance éloignée.
- source_word: וּבְנוֹתַי
  choice: et mes filles
  rationale: Le féminin pluriel est conservé afin de respecter le parallélisme genré du texte hébreu.
- source_word: מִקְצֵה הָאָרֶץ
  choice: de l’extrémité de la terre
  rationale: Cette formulation préserve le singulier hébreu קְצֵה tout en restant compréhensible dans un registre biblique moderne et digne.
theological_decisions:
- issue: Référent des ordres adressés au nord et au sud
  choice: Le nord et le sud sont des régions personnifiées auxquelles Dieu ordonne de rendre et de faire revenir son peuple dispersé.
  alternative: Des forces cosmiques purement métaphoriques, sans référence précise au rassemblement des exilés.
  rationale: Le contexte immédiat traite du rétablissement et du rassemblement d’Israël. Les formes féminines singulières correspondent aux régions personnifiées, tandis que « mes fils » et « mes filles » identifie le peuple rassemblé.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent vigoureux; le parallélisme « mes fils / mes filles » et le singulier « l’extrémité de la terre » sont préservés.
