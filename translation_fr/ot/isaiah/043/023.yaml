    issue: « encens » est trop général pour לְבוֹנָה.
    rationale: Le terme hébreu désigne l’oliban/frankincense, une résine aromatique précise. « Encens » peut désigner toute substance brûlée comme parfum et perd la précision lexicale du texte source.
  - severity: low
    issue: « de mouton » est moins naturel dans ce contexte que « des moutons ».
    rationale: Le singulier hébreu fonctionne ici de manière collective. Le pluriel générique français évoque plus naturellement les animaux apportés en sacrifice; la note maintient l’éventualité de la chèvre.
