base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
translation:
  language: fr
  text: Tu ne m’as pas apporté de moutons[a] pour tes holocaustes, et tu ne m’as pas honoré par tes sacrifices. Je ne t’ai pas imposé de me servir par des offrandes de céréales[b], et je ne t’ai pas fatigué avec de l’oliban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un mouton ou une chèvre, c’est-à-dire une bête du petit bétail.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « Je ne t’ai pas fait servir par l’offrande. » L’expression peut évoquer un service imposé comme une charge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂה
  choice: mouton[a]
  rationale: Le terme désigne une bête du petit bétail, mouton ou chèvre. « Mouton » est naturel en français courant, tandis que la note conserve l’étendue du terme hébreu.
- source_word: עֹלֹתֶיךָ
  choice: tes holocaustes
  rationale: עֹלָה est le terme sacrificiel usuel pour une offrande entièrement brûlée. « Holocaustes » demeure le terme biblique français précis dans ce contexte cultuel.
- source_word: זְבָחֶיךָ
  choice: tes sacrifices
  rationale: זֶבַח désigne largement un sacrifice, souvent une offrande animale immolée. « Sacrifices » est clair et naturel.
- source_word: כִבַּדְתָּנִי
  choice: tu ne m’as pas honoré
  rationale: Au piel, כבד signifie couramment « honorer »; la formulation exprime directement le reproche divin.
- source_word: הֶעֱבַדְתִּיךָ
  choice: je ne t’ai pas imposé de me servir
  rationale: Le hiphil de עבד signifie littéralement « faire servir » ou imposer un service. Cette traduction garde l’image du service exigé sans l’aplatir entièrement en « accabler ».
- source_word: מִנְחָה
  choice: des offrandes de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne normalement l’offrande végétale, principalement faite de farine ou de céréales.
- source_word: הוֹגַעְתִּיךָ
  choice: je ne t’ai pas fatigué
  rationale: Le hiphil de יגע signifie causer de la fatigue ou de la lassitude. « Fatigué » maintient le parallélisme avec le service imposé.
- source_word: לְבוֹנָה
  choice: encens
  rationale: לְבוֹנָה désigne précisément l’oliban, résine aromatique employée comme encens. « Encens » est le terme naturel et compréhensible en français moderne.
- source_word: לִי
  choice: m’as apporté
  rationale: Le datif hébreu indique que l’offrande est apportée à Dieu ou pour lui; « m’as apporté » le rend idiomatiquement.
theological_decisions:
- issue: Portée de la déclaration divine sur le service sacrificiel
  choice: Conserver la formulation selon laquelle Dieu n’a pas imposé à Israël de le servir par les offrandes ni ne l’a fatigué avec l’encens.
  alternative: Expliciter que Dieu n’a pas imposé des exigences rituelles oppressantes ou excessives.
  rationale: L’hébreu affirme littéralement que Dieu n’a pas « fait servir » Israël par l’offrande et ne l’a pas fatigué par l’encens. La traduction ne nie pas la place des sacrifices dans la Loi, mais elle évite aussi d’ajouter « excessivement » ou « de façon oppressive », notions interprétatives absentes du verset; elle préserve ainsi la tension rhétorique.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire cultuel reste précis, mais la syntaxe demeure accessible. « Encens » est préféré au terme technique « oliban »; « mouton » est accompagné d’une note afin de préserver l’étendue de שֵׂה.
