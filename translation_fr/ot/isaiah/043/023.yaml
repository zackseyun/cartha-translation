  rationale: La révision corrige la précision cultuelle de לְבוֹנָה par « oliban » et améliore légèrement l’idiomaticité de la première proposition par le pluriel générique « des moutons ». Elle conserve la syntaxe, le registre, la tension rhétorique et l’ambiguïté interprétative du texte hébreu; aucune lecture doctrinale n’est ajoutée.
