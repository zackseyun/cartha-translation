id: ISA.43.1
reference: Isaiah 43:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֞ה כֹּֽה אָמַ֤ר יְהוָה֙ בֹּרַאֲ/ךָ֣ יַעֲקֹ֔ב וְ/יֹצֶרְ/ךָ֖ יִשְׂרָאֵ֑ל אַל תִּירָא֙ כִּ֣י גְאַלְתִּ֔י/ךָ קָרָ֥אתִי בְ/שִׁמְ/ךָ֖ לִ/י אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
translation:
  language: fr
  text: 'Mais maintenant, ainsi parle Yahvé, lui qui t’a créé, Jacob, et qui t’a façonné, Israël : « N’aie pas peur, car je t’ai racheté ; je t’ai appelé par ton nom, tu es à moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française « Yahvé » transcrit le nom divin plutôt que de le remplacer par un titre comme « le Seigneur ».
- source_word: בֹּרַאֲךָ
  choice: lui qui t’a créé
  rationale: Le participe de ברא est rendu par une proposition relative naturelle en français ; « créé » conserve le sens propre de l’activité créatrice divine.
- source_word: וְיֹצֶרְךָ
  choice: et qui t’a façonné
  rationale: « Façonné » préserve l’image de l’artisan portée par יצר et distingue ce verbe de ברא, rendu par « créé ».
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacob… Israël
  rationale: Les deux noms désignent le peuple de l’alliance sous ses appellations patriarcale et nationale ; ils sont conservés comme vocatifs.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Formulation directe, naturelle et actuelle de l’interdiction hébraïque, sans atténuer sa force rassurante.
- source_word: גְאַלְתִּיךָ
  choice: je t’ai racheté
  rationale: « Racheter » garde la portée de délivrance et de revendication liée au rôle du proche rédempteur exprimée par גאל.
- source_word: קָרָאתִי בְשִׁמְךָ
  choice: je t’ai appelé par ton nom
  rationale: Cette formulation suit de près l’expression hébraïque tout en restant idiomatique en français et souligne l’appel personnel.
- source_word: לִי אָתָּה
  choice: tu es à moi
  rationale: La formule brève et naturelle reproduit la revendication d’appartenance exprimée par la proposition nominale hébraïque.
- source_word: וְעַתָּה כֹּה אָמַר
  choice: Mais maintenant, ainsi parle
  rationale: « Mais maintenant » marque le tournant du discours dans le contexte, tandis que « ainsi parle » conserve la solennité de la formule prophétique.
theological_decisions:
- issue: Portée d’alliance et de délivrance de גאל
  choice: je t’ai racheté
  alternative: je t’ai délivré / je t’ai repris comme mien
  rationale: « Racheté » conserve à la fois l’idée de délivrance et celle d’une revendication fondée sur une relation, sans préciser un mécanisme que le texte ne donne pas.
- issue: Revendication d’appartenance en לִי אָתָּה
  choice: tu es à moi
  alternative: tu m’appartiens
  rationale: La formulation retenue garde la concision et la force relationnelle de l’hébreu, sans développer outre mesure les notions d’élection, de possession ou de protection.
translation_notes:
  register: Français international actuel, digne et accessible. La formule prophétique « ainsi parle » maintient le registre solennel, tandis que « N’aie pas peur » évite un tour inutilement archaïque. Les pronoms au singulier reproduisent l’adresse collective personnifiée à Jacob/Israël.
