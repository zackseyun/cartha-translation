  text: הַזְכִּירֵ֕/נִי נִשָּׁפְטָ֖ה יָ֑חַד סַפֵּ֥ר אַתָּ֖ה לְמַ֥עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/026.yaml
  text: Remind me[a]; let us argue the case together. State your case[b], so that you may be proved right.
translation:
  language: fr
  text: Rappelle-moi ; plaidons ensemble. Expose toi-même ta cause, afin que tu sois reconnu dans ton droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « afin que tu sois justifié » ou « que tu aies gain de cause ».'
    reason: Le verbe hébreu peut exprimer le fait d’être déclaré juste, reconnu dans son droit ou de voir sa cause validée.
lexical_decisions:
- source_word: הַזְכִּירֵנִי
  choice: Rappelle-moi les faits
  rationale: Le hiphil impératif de זכר avec suffixe de première personne signifie littéralement « rappelle-moi ». Dans cette scène judiciaire, « les faits » explicite naturellement ce que l’interlocuteur est invité à rappeler, sans définir d’avance le contenu de sa défense.
- source_word: נִשָּׁפְטָה
  choice: plaidons
  rationale: 'La forme cohortative niphal de שפט a ici une valeur judiciaire et réciproque : les deux parties entrent ensemble dans le débat. « Plaidons » restitue cette scène de procès en français actuel.'
- source_word: יָחַד
  choice: ensemble
  rationale: L’adverbe marque la participation conjointe des parties au débat judiciaire.
- source_word: סַפֵּר
  choice: Expose … ta cause
  rationale: Le piel impératif de ספר peut signifier raconter, déclarer ou exposer. Dans ce contexte judiciaire, « expose ta cause » exprime naturellement l’appel à présenter ses arguments.
- source_word: אַתָּה
  choice: toi-même
  rationale: Le pronom indépendant est emphatique. « Toi-même » en conserve l’insistance sans produire une tournure artificielle en français.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution introduit le but ou le résultat visé.
- source_word: תִּצְדָּק
  choice: tu sois reconnu dans ton droit
  rationale: Le qal de צדק désigne ici le fait d’être déclaré ou reconnu juste dans un cadre judiciaire. Cette formulation garde la portée médico-légale sans importer automatiquement le sens doctrinal que « justifié » peut évoquer.
theological_decisions:
- issue: Portée judiciaire de צדק
  choice: tu sois reconnu dans ton droit
  alternative: tu sois justifié ; tu aies gain de cause
  rationale: Le passage met en scène une contestation judiciaire entre Dieu et son interlocuteur. La traduction retenue préserve l’idée d’une reconnaissance comme partie ayant raison, sans réduire la formule à une doctrine ultérieure de la justification.
translation_notes:
  register: Français international moderne, digne et direct. L’image judiciaire structure la formulation (« plaidons », « cause », « reconnu dans ton droit »). L’emphase de אַתָּה est conservée par « toi-même ». Tous les marqueurs de notes figurent dans le texte.
