id: ISA.43.15
reference: Isaiah 43:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֥י יְהוָ֖ה קְדֽוֹשְׁ/כֶ֑ם בּוֹרֵ֥א יִשְׂרָאֵ֖ל מַלְכְּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
translation:
  language: fr
  text: Je suis Yahvé[a], votre Saint, le créateur d’Israël, votre roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le nom divin יהוה (YHWH), dont la prononciation ancienne exacte est incertaine; il est rendu ici par « Yahvé ».
    reason: Précision textuelle et translittération du nom divin.
lexical_decisions:
- source_word: אֲנִי
  choice: Je suis
  rationale: Le pronom indépendant est emphatique. Dans cette proposition hébraïque sans verbe exprimé, « Je suis » restitue naturellement en français la déclaration d’identité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est sa forme française courante; une note signale la forme hébraïque et l’incertitude de sa vocalisation ancienne.
- source_word: קְדוֹשְׁכֶם
  choice: votre Saint
  rationale: Le terme muni du suffixe de deuxième personne du pluriel fonctionne ici comme un titre divin et exprime en même temps la relation de Dieu avec son peuple.
- source_word: בּוֹרֵא יִשְׂרָאֵל
  choice: le créateur d’Israël
  rationale: Le participe présente la création comme un rôle caractéristique de Dieu, tandis que le complément « d’Israël » conserve la formulation concise de l’hébreu.
- source_word: מַלְכְּכֶם
  choice: votre roi
  rationale: Le nom avec suffixe de deuxième personne du pluriel désigne directement Dieu comme le roi d’Israël. La minuscule suit l’usage typographique français pour les titres communs.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: YHWH; le Seigneur; Jéhovah
  rationale: Employer un nom propre plutôt qu’un titre préserve le fait que l’hébreu donne ici explicitement le nom divin. La note reconnaît que la prononciation ancienne exacte demeure incertaine.
- issue: Valeur de קְדוֹשְׁכֶם
  choice: votre Saint
  alternative: celui qui est saint pour vous; votre être saint
  rationale: « Votre Saint » conserve la formulation nominale, le caractère de titre et la relation exprimée par le suffixe, sans préciser davantage la nature de cette relation.
- issue: Capitalisation des titres divins
  choice: Majuscule à « Saint », minuscules à « créateur » et « roi »
  alternative: Majuscules à tous les titres divins
  rationale: 'Cette présentation respecte l’usage français actuel: « le Saint » est nettement substantivé comme titre, tandis que « créateur » et « roi » restent lisibles comme des appositions descriptives sans que leur référence divine soit obscurcie.'
translation_notes:
  register: Français moderne, sobre et solennel. La structure appositionnelle et le parallélisme du texte hébreu sont conservés, avec une ponctuation naturelle en français.
