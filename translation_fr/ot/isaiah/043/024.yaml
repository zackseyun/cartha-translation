revisions:
- from: Tu ne m’as pas acheté à prix d’argent de canne aromatique[a], et tu ne m’as pas rassasié de la graisse de tes sacrifices. Au contraire, tu m’as accablé de tes péchés[b], tu m’as lassé par tes iniquités.
  to: Tu ne m’as pas acheté de canne aromatique[a] avec de l’argent, et tu ne m’as pas rassasié de la graisse de tes sacrifices. Au contraire, tu m’as accablé de tes péchés[b] ; tu m’as fatigué par tes iniquités.
  rationale: La révision corrige la syntaxe du premier membre afin que « canne aromatique » soit clairement l’objet acheté pour Dieu avec de l’argent. Elle remplace aussi « lassé » par « fatigué », plus précis pour le verbe hébreu causatif. Le contraste introduit par « Au contraire », l’imagerie sacrificielle, l’anthropomorphisme et la note sur « tu m’as fait servir » sont préservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle au texte massorétique : l’absence d’achat de canne aromatique, la graisse sacrificielle, puis le contraste avec les péchés qui imposent une charge à Dieu et le fatiguent sont conservés. Cependant, « m’as pas acheté à prix d’argent de canne aromatique » place les compléments de façon à rendre la relation syntaxique incertaine en français : c’est la canne qui est achetée pour Dieu, et non Dieu qui est acheté.'
  naturalness: La formulation révisée « Tu ne m’as pas acheté de canne aromatique avec de l’argent » est claire et idiomatique en français international moderne. « Tu m’as fatigué par tes iniquités » rend plus directement le causatif de יגע que « tu m’as lassé par », tournure moins naturelle et susceptible d’évoquer l’ennui plutôt que l’épuisement.
  terminology: « Canne aromatique », « graisse de tes sacrifices », « péchés » et « iniquités » sont appropriés. La distinction entre חטאות et עונות est utilement maintenue. « Accablé » est une bonne équivalence idiomatique de l’image de service imposé, à condition que la note conserve le littéral.
  issues:
