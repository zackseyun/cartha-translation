base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
translation:
  language: fr
  text: Tu ne m’as pas acheté de canne aromatique[a] avec de l’argent, et tu ne m’as pas rassasié de la graisse de tes sacrifices. Au contraire, tu m’as accablé de tes péchés[b] ; tu m’as fatigué par tes iniquités.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « calamus » ou « roseau odorant ». Le terme hébreu désigne une canne odorante coûteuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu m’as fait servir par tes péchés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ לִּי בַכֶּסֶף קָנֶה
  choice: tu ne m’as pas acheté à prix d’argent de canne aromatique
  rationale: Le verbe קנה a ici son sens commercial naturel, confirmé par la mention de l’argent. « Canne aromatique » désigne clairement le roseau odorant coûteux sans recourir au terme technique « calamus ».
- source_word: חֵלֶב זְבָחֶיךָ
  choice: la graisse de tes sacrifices
  rationale: La traduction conserve la graisse proprement dite, notamment les portions grasses offertes dans le cadre sacrificiel, plutôt que de généraliser en « meilleure part ».
- source_word: הִרְוִיתָנִי
  choice: tu ne m’as pas rassasié
  rationale: Le hiphil de רוה exprime l’action de saturer ou de rassasier. Ce choix maintient l’image anthropomorphique forte du texte.
- source_word: אַךְ
  choice: au contraire
  rationale: Dans ce contexte, אַךְ introduit une opposition appuyée entre les offrandes qu’Israël n’a pas apportées et le poids de ses péchés.
- source_word: הֶעֱבַדְתַּנִי בְּחַטֹּאותֶיךָ
  choice: tu m’as accablé de tes péchés
  rationale: Le sens littéral est « tu m’as fait servir par tes péchés ». « Accablé » rend en français naturel l’idée d’un service pénible imposé à Dieu, tandis qu’une note conserve la formulation littérale saisissante.
- source_word: הוֹגַעְתַּנִי
  choice: tu m’as lassé
  rationale: Le hiphil de יגע signifie causer la fatigue ou la lassitude. « Lassé » convient au registre prophétique et préserve l’anthropomorphisme.
- source_word: בַּעֲוֺנֹתֶיךָ
  choice: par tes iniquités
  rationale: « Iniquités » maintient le poids moral et religieux de עָוֹן, tout en le distinguant de חַטָּאוֹת, rendu par « péchés ».
theological_decisions:
- issue: Langage anthropomorphique présentant Dieu comme rassasié, accablé et lassé
  choice: Conserver sans l’atténuer l’image de Dieu que les sacrifices auraient rassasié et que les péchés accablent et lassent.
  alternative: 'Paraphraser en termes abstraits : « tu ne m’as pas honoré… tu m’as offensé ».'
  rationale: Le texte hébreu emploie délibérément des expressions anthropomorphiques fortes. Les maintenir préserve la tension théologique et le renversement accusateur du passage.
- issue: Valeur du hiphil הֶעֱבַדְתַּנִי
  choice: Rendre idiomatiquement par « tu m’as accablé », avec le sens littéral en note.
  alternative: Traduire directement « tu m’as fait servir » ou « tu m’as asservi ».
  rationale: La traduction littérale est difficile à comprendre spontanément en français et « asservi » peut suggérer que Dieu serait devenu esclave des péchés. « Accablé » transmet la contrainte pénible sans effacer le sens source, explicité en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme prophétique, le vocabulaire sacrificiel concret et les anthropomorphismes du texte hébreu. « Iniquités », légèrement soutenu, est maintenu pour distinguer עָוֹן de « péchés » et en préserver la gravité morale.
