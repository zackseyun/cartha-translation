    issue: Ordre des compléments dans le premier membre
    rationale: « Tu ne m’as pas acheté à prix d’argent de canne aromatique » est grammaticalement mal construit ou, au minimum, ambigu. Le texte hébreu dit qu’Israël n’a pas acheté de canne pour Dieu avec de l’argent.
  - severity: low
    issue: « Lassé par tes iniquités » affaiblit légèrement la fatigue exprimée par הוֹגַעְתַּנִי
    rationale: En français moderne, « lasser » peut suggérer l’ennui. « Fatiguer » conserve plus nettement le sens causatif de faire éprouver de la fatigue, sans atténuer l’anthropomorphisme.
