  text: הַ/מּוֹצִ֥יא רֶֽכֶב וָ/ס֖וּס חַ֣יִל וְ/עִזּ֑וּז יַחְדָּ֤ו יִשְׁכְּבוּ֙ בַּל יָק֔וּמוּ דָּעֲכ֖וּ כַּ/פִּשְׁתָּ֥ה כָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/017.yaml
  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
translation:
  language: fr
  text: lui qui fait sortir chars et chevaux, armée et guerriers puissants, tous ensemble ; ils se couchent, ils ne se relèvent pas ; ils s’éteignent, ils sont éteints comme du lin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme du lin ». Dans ce contexte d’extinction, l’image peut évoquer une mèche de lin que l’on éteint facilement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: lui qui fait sortir
  rationale: Le participe hiphil de יצא poursuit la description de l’Éternel au verset précédent. Le présent conserve la force descriptive et l’allusion historique sans réduire le texte à un simple récit au passé.
- source_word: רֶכֶב וָסוּס
  choice: chars et chevaux
  rationale: Les singuliers hébreux ont ici une valeur collective. Le pluriel français exprime naturellement l’ensemble des véhicules et des montures militaires.
- source_word: חַיִל וְעִזּוּז
  choice: armée et combattants valeureux
  rationale: חַיִל désigne la force militaire ou l’armée. עִזּוּז, substantivé, désigne ce qui est fort ou les hommes puissants ; le pluriel « combattants valeureux » s’accorde naturellement avec la scène militaire sans identifier explicitement l’Égypte.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Rend l’idée de la chute collective de toutes les forces énumérées.
- source_word: יִשְׁכְּבוּ בַּל יָקוּמוּ
  choice: Ils se couchent et ne se relèvent pas
  rationale: Conserve l’image littérale de l’abattement définitif et la présentation vive de l’hébreu.
- source_word: דָּעֲכוּ כָבוּ
  choice: ils s’éteignent, consumés
  rationale: Les deux verbes appartiennent au champ de l’extinction d’un feu. Cette formulation évite une répétition française maladroite tout en maintenant l’image d’une flamme qui disparaît.
- source_word: כַפִּשְׁתָּה
  choice: comme une mèche de lin
  rationale: Le nom signifie littéralement « lin » ; dans l’image d’un feu éteint, « mèche de lin » explicite de façon naturelle le référent implicite probable. La littéralité est signalée en note.
theological_decisions:
- issue: Présentation temporelle de l’action divine et de la défaite ennemie
  choice: 'Présent descriptif : « fait sortir… se couchent… ne se relèvent pas »'
  alternative: Employer le passé pour présenter exclusivement l’événement de la mer lors de l’exode
  rationale: La forme participiale et la succession verbale permettent une évocation vive. Le présent préserve à la fois l’allusion à l’exode et la portée descriptive de l’action divine.
- issue: Identification des forces vaincues
  choice: Conserver les désignations militaires génériques du texte
  alternative: Nommer explicitement Pharaon, les Égyptiens ou leur armée
  rationale: Le contexte évoque fortement l’exode, mais ce verset ne nomme pas directement l’Égypte. La traduction maintient cette allusion sans ajouter une identification absente de l’hébreu.
- issue: Interprétation de עִזּוּז
  choice: « combattants valeureux » dans le contexte militaire
  alternative: « le puissant », « les puissants » ou l’abstrait « puissance »
  rationale: Le terme peut désigner un être fort ou la force. Le contexte favorise un référent personnel militaire, mais la formulation reste générale et n’ajoute aucun personnage précis.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure claire à l’oral. Les pluriels rendent naturellement les collectifs hébreux, tandis que le présent conserve la vivacité du tableau.
