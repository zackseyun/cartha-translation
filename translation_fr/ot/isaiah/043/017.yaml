    issue: « combattants valeureux » pour עִזּוּז
    rationale: « Valeureux » exprime le courage plutôt que la force ou la puissance indiquée par le terme hébreu. Le contexte permet « guerriers », mais il convient de préserver explicitement la notion de puissance.
  - severity: medium
    issue: « consumés comme une mèche de lin » pour דָּעֲכוּ כַּפִּשְׁתָּה כָבוּ
    rationale: « Consumés » n’est pas l’image d’extinction des deux verbes hébreux, et « une mèche de lin » introduit dans le texte principal une précision que l’hébreu exprime seulement par « lin ». La mèche peut être proposée en note.
