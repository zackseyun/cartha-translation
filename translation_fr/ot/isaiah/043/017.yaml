revisions:
- from: lui qui fait sortir chars et chevaux, armée et combattants valeureux, tous ensemble. Ils se couchent et ne se relèvent pas ; ils s’éteignent, consumés comme une mèche de lin.[a]
  to: lui qui fait sortir chars et chevaux, armée et guerriers puissants, tous ensemble ; ils se couchent, ils ne se relèvent pas ; ils s’éteignent, ils sont éteints comme du lin.[a]
  rationale: La révision rétablit la métaphore cohérente de l’extinction et laisse « lin » dans le corps du texte, conformément au sens littéral de פִּשְׁתָּה. Elle remplace « valeureux » par « puissants » afin de mieux refléter la force indiquée par עִזּוּז, tout en gardant une formulation française naturelle dans le tableau militaire.
