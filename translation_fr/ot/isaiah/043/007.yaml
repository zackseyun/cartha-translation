  text: כֹּ֚ל הַ/נִּקְרָ֣א בִ/שְׁמִ֔/י וְ/לִ/כְבוֹדִ֖/י בְּרָאתִ֑י/ו יְצַרְתִּ֖י/ו אַף עֲשִׂיתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/007.yaml
  text: everyone who is called by my name[a], whom I created for my glory, whom I formed, indeed whom I made.
translation:
  language: fr
  text: tous ceux qui portent mon nom[a], que j’ai créés pour ma gloire, que j’ai façonnés, oui, que j’ai faits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « tous ceux qui sont appelés de mon nom — c’est pour ma gloire que je les ai créés, façonnés, oui, faits. »'
    reason: Cette formulation conserve plus explicitement l’idiome hébreu « appelés de mon nom », le lien de « pour ma gloire » avec la création et la progression des trois verbes.
lexical_decisions:
- source_word: כֹּל
  choice: tous ceux
  rationale: Dans le contexte du rassemblement des personnes dispersées (v. 5-6), l’expression collective désigne des êtres humains. « Tous ceux » rend naturellement cette valeur en français.
- source_word: הַנִּקְרָא
  choice: qui sont appelés
  rationale: Le nifal de קרא signifie ici « être appelé » ou « porter le nom ». La tournure passive préserve l’idée d’identification exprimée par l’hébreu.
- source_word: בִשְׁמִי
  choice: de mon nom
  rationale: Avec נקרא, la préposition ב marque ici le nom porté par quelqu’un. « Appelés de mon nom » conserve la formulation biblique d’appartenance et d’identification, tandis qu’une note signale une formulation française plus explicite.
- source_word: וְלִכְבוֹדִי
  choice: pour ma gloire
  rationale: כבוד peut désigner la gloire, l’honneur ou la splendeur. « Pour ma gloire » garde la force théologique et la valeur de finalité du syntagme.
- source_word: בְּרָאתִיו
  choice: que j’ai créés
  rationale: Le qatal exprime ici une action accomplie. Le passé composé est naturel en français, et l’objet singulier collectif hébreu est adapté au pluriel exigé par « tous ceux ».
- source_word: יְצַרְתִּיו
  choice: que j’ai façonnés
  rationale: יצר évoque la mise en forme, souvent comme le travail d’un artisan. « Façonnés » maintient sa distinction avec « créés » et « faits ».
- source_word: אַף
  choice: oui
  rationale: אַף renforce ici le dernier membre de la série. « Oui » restitue cette insistance avec naturel et dignité en français.
- source_word: עֲשִׂיתִיו
  choice: que j’ai faits
  rationale: עשה est le verbe général « faire ». « Faits » préserve le troisième terme de la progression sans le confondre avec « créer » ou « façonner ».
theological_decisions:
- issue: Référent collectif et suffixes masculins singuliers
  choice: 'Employer « tous ceux » puis des relatives au pluriel : « que j’ai créés… façonnés… faits »'
  alternative: 'Conserver plus formellement le singulier collectif : « quiconque est appelé de mon nom… je l’ai créé… »'
  rationale: Le singulier hébreu a une portée collective et renvoie aux personnes rassemblées des versets précédents. Le pluriel français exprime clairement cette portée sans limiter indûment le référent aux hommes.
- issue: Rapport syntaxique de « pour ma gloire »
  choice: 'Rattacher l’expression à l’acte de créer : « que j’ai créés pour ma gloire »'
  alternative: 'Conserver plus strictement l’ordre hébreu : « et pour ma gloire je l’ai créé »'
  rationale: L’ordre hébreu permet de comprendre la gloire de Dieu comme la finalité de la création. Le rattachement choisi rend ce rapport naturellement en français sans supprimer l’ambiguïté de structure, signalée dans la note.
translation_notes:
  register: Français international actuel, digne et accessible. La triple progression « créés, façonnés, faits » est maintenue. « Appelés de mon nom » conserve l’idiome source; la note fournit aussi une représentation plus formelle de la syntaxe hébraïque.
