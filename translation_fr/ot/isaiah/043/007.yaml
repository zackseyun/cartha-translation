  source_fidelity: Le verset rendu conserve le référent humain collectif de כֹּל, l’identification au nom divin, la finalité « pour ma gloire », ainsi que la progression distincte créer–façonner–faire et l’intensif אַף. « Porter mon nom » exprime fidèlement, en français actuel, le sens idiomatique de « être appelé par/de mon nom », sans réduire celui-ci à un simple acte de nomination.
  naturalness: « Appelés de mon nom » est une formulation biblique traditionnelle, mais elle est peu transparente en français international moderne. « Tous ceux qui portent mon nom » est nettement plus idiomatique tout en gardant le sens d’appartenance et d’identification. La suite relative au pluriel est naturelle et cohérente avec « tous ceux ».
  terminology: « Gloire », « créés », « façonnés » et « faits » conservent les termes théologiquement et lexicalement importants, sans les confondre. « Oui » rend de façon sobre l’emphase de אַף. La note préserve la possibilité d’une représentation plus formelle du singulier collectif et de l’ordre de l’hébreu.
