- from: C’est moi qui ai annoncé, sauvé et fait entendre[a] ; il n’y avait parmi vous aucun dieu étranger. Vous êtes mes témoins — déclaration de Yahweh — et moi, je suis Dieu.
  to: C’est moi qui ai annoncé, sauvé et fait connaître[a] ; il n’y avait parmi vous aucun dieu étranger. Vous êtes mes témoins — oracle de Yahweh — et moi, je suis Dieu.
  rationale: La révision est limitée à une correction de français et de style prophétique. Elle ne modifie ni la portée emphatique du sujet divin, ni l’enchaînement des actions, ni l’interprétation contextuelle prudente de זָר; la note conserve l’ambiguïté lexicale pertinente.
