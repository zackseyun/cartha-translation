    rationale: En français, « faire entendre » appelle normalement un objet (« faire entendre une parole / sa voix »). Le verbe hébreu peut certes signifier littéralement « faire entendre », mais dans ce contexte sa valeur de proclamation ou de communication se rend plus naturellement par « faire connaître »; la littéralité peut être préservée en note.
  - severity: low
    issue: « déclaration de Yahweh » est moins idiomatique comme formule prophétique.
    rationale: La formule est compréhensible, mais « oracle de Yahweh » est une tournure française plus établie pour נְאֻם יהוה et conserve son caractère solennel.
