  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
translation:
  language: fr
  text: C’est moi qui ai annoncé, sauvé et fait connaître[a] ; il n’y avait parmi vous aucun dieu étranger. Vous êtes mes témoins — oracle de Yahweh — et moi, je suis Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « proclamé ». Littéralement : « fait entendre ». Le mot hébreu traduit par « dieu étranger » peut aussi désigner un étranger ou une personne étrangère.'
    reason: Préserve la nuance causative de וְהִשְׁמַעְתִּי ainsi que l’alternative lexicale de זָר, tandis que le contexte favorise le sens de divinité étrangère.
lexical_decisions:
- source_word: אָנֹכִי
  choice: C’est moi qui
  rationale: Le pronom indépendant est emphatique. Cette tournure française naturelle marque l’insistance sans ajouter explicitement l’idée d’exclusivité.
- source_word: הִגַּדְתִּי
  choice: ai annoncé
  rationale: Le hiphil de נגד signifie ici déclarer ou faire connaître. « Annoncé » convient au ton solennel et prépare la série des actes divins.
- source_word: וְהוֹשַׁעְתִּי
  choice: sauvé
  rationale: Le hiphil de ישׁע exprime l’action de sauver ou délivrer. « Sauvé » est direct et conserve la portée théologique du terme.
- source_word: וְהִשְׁמַעְתִּי
  choice: fait entendre
  rationale: Le hiphil de שׁמע signifie littéralement « faire entendre » et peut prendre le sens de proclamer. La formulation retenue conserve la nuance causative et distingue ce verbe de הִגַּדְתִּי.
- source_word: וְאֵין בָּכֶם זָר
  choice: il n’y avait parmi vous aucun dieu étranger
  rationale: זָר signifie un être étranger ou autre. Dans ce contexte de salut et de témoignage concernant l’identité divine, un dieu étranger est vraisemblablement visé ; l’ambiguïté lexicale est signalée en note.
- source_word: עֵדַי
  choice: mes témoins
  rationale: Le nom avec suffixe de première personne désigne directement ceux qui appartiennent à Yahweh en qualité de témoins.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule prophétique solennelle présente l’énoncé comme l’oracle de Yahweh. « Déclaration de » reste proche de la forme nominale hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin du texte hébreu.
- source_word: וַאֲנִי אֵל
  choice: et moi, je suis Dieu
  rationale: אֵל fonctionne ici comme le titre commun « Dieu ». Le redoublement pronominal naturel en français garde l’emphase sans ajouter « seul ».
theological_decisions:
- issue: Sens de זָר dans וְאֵין בָּכֶם זָר
  choice: dieu étranger
  alternative: étranger / personne étrangère
  rationale: Le contexte oppose l’action salvatrice et révélatrice de Yahweh à toute autre puissance divine. Le complément « dieu » est implicite plutôt qu’exprimé dans l’hébreu ; la note préserve donc l’autre lecture possible.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La forme « Yahweh » représente le nom propre présent dans le texte source et évite de le remplacer par un titre.
- issue: Force de וַאֲנִי אֵל
  choice: et moi, je suis Dieu
  alternative: et moi seul, je suis Dieu
  rationale: La proposition affirme clairement l’identité divine de Yahweh, mais le mot « seul » n’y est pas exprimé ; il n’est donc pas ajouté, même si le contexte porte une revendication d’unicité.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe emphatique « C’est moi qui » et « moi, je » reflète les pronoms hébreux marqués. Le tiret encadre naturellement la formule prophétique sans alourdir la phrase.
