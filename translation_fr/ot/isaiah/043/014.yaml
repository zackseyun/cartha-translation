  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, celui qui vous rachète, le Saint d’Israël : « Pour vous, j’ai envoyé à Babylone[a] et je les ai tous fait descendre comme des fugitifs[b], les Chaldéens eux-mêmes, dans les navires, avec leurs cris de joie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai envoyé contre Babylone ». L’hébreu dit littéralement « j’ai envoyé à Babylone » et laisse l’objet du verbe sous-entendu.
    reason: alternative_reading
  - marker: b
    text: Ou « je les ai tous fait descendre comme des barres ». Le mot hébreu traduit par « fugitifs » est difficile ; on l’a aussi compris au sens de « barres » ou « verrous » et, moins probablement, de « nobles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin, conformément à sa présence explicite dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: גֹּאַלְכֶם
  choice: celui qui vous rachète
  rationale: Expression naturelle en français actuel qui conserve l’idée de délivrance et de revendication propre au verbe גאל, sans imposer le terme plus technique de « rédempteur ».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Conserve la formulation consacrée de ce titre caractéristique du livre d’Ésaïe ainsi que sa portée solennelle.
- source_word: לְמַעַנְכֶם
  choice: À cause de vous
  rationale: 'Rend ici la motivation bénéficiaire : l’intervention est entreprise en faveur d’Israël. En contexte, la formule française ne suggère pas nécessairement la culpabilité.'
- source_word: שִׁלַּחְתִּי בָבֶלָה
  choice: j’ai envoyé à Babylone
  rationale: Respecte la direction marquée par le ה local de בָבֶלָה et laisse, comme l’hébreu, l’objet du verbe sous-entendu. La lecture « contre Babylone » est explicitée en note.
- source_word: וְהוֹרַדְתִּי
  choice: et je les ai tous fait descendre
  rationale: Rend la forme causative de ירד sans préciser indûment s’il s’agit d’une descente physique, d’un abaissement militaire ou des deux.
- source_word: בָרִיחִים
  choice: comme des fugitifs
  rationale: Le mot est difficile. Cette compréhension s’accorde bien avec la chute de Babylone et le mouvement des Chaldéens vers les navires, mais les autres analyses importantes sont conservées en note.
- source_word: כֻּלָּם
  choice: tous
  rationale: Conserve la portée totalisante du terme en l’intégrant naturellement au pronom objet français « les ».
- source_word: וְכַשְׂדִּים
  choice: les Chaldéens eux-mêmes
  rationale: 'Rend la conjonction avec une valeur explicative ou emphatique plausible : les personnes abaissées comprennent les Chaldéens eux-mêmes.'
- source_word: בָּאֳנִיּוֹת
  choice: dans les navires
  rationale: Rend directement la préposition ב comme indication de lieu, sans trancher davantage le mouvement exact suggéré par le contexte.
- source_word: רִנָּתָם
  choice: qui faisaient leur joie
  rationale: Exprime idiomatiquement le cri joyeux ou la jubilation associés aux navires, tout en maintenant l’ironie de leur transformation en moyen de fuite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Sens du terme difficile בָרִיחִים
  choice: comme des fugitifs
  alternative: comme des barres ; les verrous ; les nobles
  rationale: Le sens lié à la fuite produit une lecture cohérente dans le contexte de la défaite babylonienne, mais l’incertitude lexicale réelle est signalée plutôt que résolue silencieusement.
- issue: Valeur temporelle des formes verbales accomplies
  choice: 'passé composé : « j’ai envoyé… je les ai fait descendre »'
  alternative: 'futur prophétique : « j’enverrai… je ferai descendre »'
  rationale: La traduction conserve la forme accomplie du texte hébreu et sa présentation certaine de l’action divine, sans convertir explicitement les verbes en futurs.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe garde volontairement l’objet implicite après « j’ai envoyé », tandis que « celui qui vous rachète » évite un archaïsme sans affaiblir le titre divin. Les deux notes sont placées exactement sur les expressions auxquelles elles se rapportent.
