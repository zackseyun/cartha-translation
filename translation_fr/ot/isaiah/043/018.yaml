- from: Ne vous souvenez plus des événements passés[a] et ne prêtez plus attention à ce qui s’est produit autrefois.
  to: Ne vous souvenez pas des choses passées[a], ne vous attardez pas sur les choses anciennes.
  rationale: La révision retire l’aspect non exprimé de cessation (« plus »), évite de limiter les réalités antérieures à des événements et maintient les deux membres parallèles. La note reste une véritable alternative lexicale, avec un ancrage correctement placé après le premier membre.
