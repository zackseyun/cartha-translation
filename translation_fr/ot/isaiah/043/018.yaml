review_pass:
  verdict: revise
  source_fidelity: 'La suppression de « plus » est nécessaire : la particule prohibitive אַל avec l’inaccompli interdit l’action, mais n’exprime pas explicitement « ne ... plus ». « Événements » et « ce qui s’est produit » resserrent aussi indûment les deux substantifs féminins pluriels, qui peuvent désigner plus largement des « choses » ou réalités antérieures. La révision préserve le parallélisme et la nuance d’attention réfléchie de תִּתְבֹּנָנוּ.'
  naturalness: « Ne vous souvenez pas des choses passées, ne vous attardez pas sur les choses anciennes » est naturel, direct et digne en français international moderne. La répétition de « choses » rend le parallélisme hébreu sans lourdeur excessive.
  terminology: Aucun terme théologique technique n’est en jeu. « Choses passées » rend רִאשֹׁנוֹת de manière ouverte; « choses anciennes » rend קַדְמֹנִיּוֹת. « Ne vous attardez pas sur » exprime idiomatiquement l’idée de porter une attention méditative et soutenue, sans lui imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Ajout de « plus » dans les deux interdictions
    rationale: « Ne vous souvenez plus » et « ne prêtez plus attention » peuvent signifier qu’il faut cesser une pratique déjà en cours. Cette valeur cessative n’est pas marquée par l’hébreu, qui dit simplement « ne vous souvenez pas » et « ne considérez pas ».
  - severity: low
    issue: Restriction des substantifs à des événements produits
    rationale: « Événements passés » et « ce qui s’est produit autrefois » explicitent une référence événementielle possible dans le contexte, mais le texte emploie des substantifs plus généraux. « Choses » conserve mieux son ouverture et son parallélisme.
  revised_text: Ne vous souvenez pas des choses passées[a], ne vous attardez pas sur les choses anciennes.
  revised_footnotes:
  - marker: a
    text: 'Ou : « Ne vous souvenez pas des premières choses et ne réfléchissez pas aux choses anciennes. »'
    reason: Alternative plus proche des adjectifs substantivés hébreux et du sens réflexif-attentif de תִּתְבֹּנָנוּ.
  revision_rationale: La révision retire l’aspect non exprimé de cessation (« plus »), évite de limiter les réalités antérieures à des événements et maintient les deux membres parallèles. La note reste une véritable alternative lexicale, avec un ancrage correctement placé après le premier membre.
