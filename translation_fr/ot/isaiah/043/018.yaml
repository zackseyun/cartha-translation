source:
  edition: WLC
  text: אַֽל תִּזְכְּר֖וּ רִֽאשֹׁנ֑וֹת וְ/קַדְמֹנִיּ֖וֹת אַל תִּתְבֹּנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/018.yaml
  text: Do not remember the former things[a], and do not consider the things of old.
translation:
  language: fr
  text: Ne vous souvenez pas des choses passées[a], ne vous attardez pas sur les choses anciennes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous souvenez pas des premières choses et ne réfléchissez pas aux choses anciennes. »'
    reason: Alternative plus proche des adjectifs substantivés hébreux et du sens réflexif-attentif de תִּתְבֹּנָנוּ.
lexical_decisions:
- source_word: אַל תִּזְכְּרוּ
  choice: Ne vous souvenez plus
  rationale: La particule négative אַל suivie de l’inaccompli exprime une interdiction. En contexte, « ne… plus » rend naturellement l’appel à ne pas rester tourné vers le passé, sans effacer le sens fondamental de זכר, « se souvenir ».
- source_word: רִאשֹׁנוֹת
  choice: des événements passés
  rationale: L’adjectif féminin pluriel substantivé désigne les choses ou réalités antérieures. « Événements passés » est naturel en français et convient au contexte des actes antérieurs de Dieu, tout en laissant en note la traduction plus formelle.
- source_word: וְ
  choice: et
  rationale: La conjonction coordonne simplement les deux interdictions parallèles.
- source_word: קַדְמֹנִיּוֹת
  choice: ce qui s’est produit autrefois
  rationale: Ce substantif pluriel renvoie aux réalités anciennes ou d’autrefois. Cette formulation française distingue légèrement le terme de רִאשֹׁנוֹת tout en maintenant le parallélisme poétique.
- source_word: אַל תִּתְבֹּנָנוּ
  choice: ne prêtez plus attention
  rationale: La forme réfléchie de בין exprime l’attention soutenue, l’examen ou la réflexion. « Prêter attention » restitue ici l’idée de fixer son esprit sur ces réalités anciennes.
theological_decisions:
- issue: Portée de l’interdiction de se souvenir
  choice: Conserver une interdiction directe sans l’expliquer dans le texte
  alternative: 'Paraphraser : « Ne restez pas attachés au passé »'
  rationale: Le verset crée volontairement une tension avec les appels bibliques à se souvenir des actes de Dieu. La traduction ne doit pas résoudre cette tension en ajoutant une interprétation absente de l’hébreu.
translation_notes:
  register: 'Français international moderne, direct et digne. Le tutoiement n’est pas employé : les verbes hébreux sont au pluriel et s’adressent collectivement au peuple. Le parallélisme est conservé avec deux interdictions coordonnées.'
