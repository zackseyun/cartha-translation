source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/נּוֹתֵ֥ן בַּ/יָּ֖ם דָּ֑רֶךְ וּ/בְ/מַ֥יִם עַזִּ֖ים נְתִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
translation:
  language: fr
  text: 'Ainsi parle Yahweh, lui qui ouvre un chemin dans la mer et un sentier dans les eaux puissantes[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « à travers la mer » et « à travers les eaux puissantes ». La préposition hébraïque signifie littéralement « dans », mais le contexte peut exprimer un mouvement à travers les eaux.'
    reason: alternative lexicale
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française naturelle et solennelle rend la formule prophétique d’introduction sans l’alourdir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הַנּוֹתֵן
  choice: lui qui ouvre
  rationale: Le participe décrit Yahweh comme celui qui établit un passage. « Ouvre » forme en français une expression naturelle avec « chemin » et convient à l’évocation d’un passage au milieu de la mer, sans expliciter davantage l’allusion.
- source_word: בַּיָּם
  choice: dans la mer
  rationale: « Dans » correspond directement à la préposition hébraïque et préserve l’image, tandis que « à travers » reste une possibilité contextuelle.
- source_word: דָּרֶךְ
  choice: un chemin
  rationale: « Chemin » convient au sens concret de voie de passage tout en préservant les résonances plus larges du terme.
- source_word: וּבְמַיִם עַזִּים
  choice: dans les eaux puissantes
  rationale: « Puissantes » rend la force exprimée par עַזִּים sans préciser indûment que les eaux seraient déchaînées.
- source_word: נְתִיבָה
  choice: un sentier
  rationale: « Sentier » maintient le parallélisme poétique avec « chemin » tout en conservant la variation lexicale de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin sous une forme largement reconnue, sans le remplacer par le titre « le Seigneur ».
- issue: Allusion au passage de la mer
  choice: Ne pas expliciter l’Exode dans le corps du verset
  alternative: Ajouter une formulation précisant qu’il s’agit du passage d’Israël à travers la mer
  rationale: Le vocabulaire évoque fortement l’Exode, mais le verset lui-même formule l’image sans nommer l’événement. La traduction laisse donc l’allusion agir sans la résoudre explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. « Ainsi parle » garde la solennité de la formule prophétique; le parallélisme « un chemin… un sentier » reproduit la poésie hébraïque sans archaïsme.
