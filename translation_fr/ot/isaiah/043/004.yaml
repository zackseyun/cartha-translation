id: ISA.43.4
reference: Isaiah 43:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵ/אֲשֶׁ֨ר יָקַ֧רְתָּ בְ/עֵינַ֛/י נִכְבַּ֖דְתָּ וַ/אֲנִ֣י אֲהַבְתִּ֑י/ךָ וְ/אֶתֵּ֤ן אָדָם֙ תַּחְתֶּ֔י/ךָ וּ/לְאֻמִּ֖ים תַּ֥חַת נַפְשֶֽׁ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
translation:
  language: fr
  text: Parce que tu as du prix à mes yeux[a], que tu es honoré et que je t’aime, je donne des hommes en échange de toi[b], des peuples à la place de ta vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Puisque tu as eu du prix à mes yeux, que tu as été honoré et que je t’ai aimé. » En contexte, les verbes hébreux peuvent avoir une valeur passée ou présente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je donnerai des hommes en échange de toi, et des peuples à la place de ta vie ». Dans ce contexte prophétique, le verbe hébreu peut avoir une valeur future.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  choice: Parce que
  rationale: Le composé introduit ici naturellement la cause de l’action salvatrice annoncée dans le contexte. Une nuance temporelle reste possible, mais paraît moins probable.
- source_word: יָקַרְתָּ בְעֵינַי
  choice: tu as du prix à mes yeux
  rationale: Cette tournure française naturelle conserve l’image hébraïque des yeux et exprime la valeur personnelle de l’interlocuteur. Le qatal peut avoir ici une portée présente.
- source_word: נִכְבַּדְתָּ
  choice: tu es honoré
  rationale: Le niphal de כבד indique que la personne est honorée ou tenue en estime; cette formulation convient mieux au contexte relationnel que «glorieux».
- source_word: וַאֲנִי אֲהַבְתִּיךָ
  choice: et je t’aime
  rationale: Le présent français exprime l’amour comme une réalité actuelle et continue, sans le limiter à un acte passé.
- source_word: וְאֶתֵּן
  choice: je donne
  rationale: L’imparfait hébreu peut porter une valeur présente ou future dans cette déclaration prophétique. Le présent rend l’énoncé direct, tandis que le futur est signalé en note.
- source_word: אָדָם
  choice: des hommes
  rationale: Le collectif désigne ici des êtres humains mis en parallèle avec des peuples. «Des hommes» conserve la force concrète du terme sans recourir à l’abstraction «humanité».
- source_word: תַּחְתֶּיךָ
  choice: en échange de toi
  rationale: תחת exprime ici la substitution ou l’échange, et non une position spatiale.
- source_word: וּלְאֻמִּים
  choice: des peuples
  rationale: Le pluriel renvoie à des groupes humains ou nationaux; «peuples» préserve le parallélisme sans réduire le terme aux États politiques.
- source_word: תַּחַת נַפְשֶׁךָ
  choice: à la place de ta vie
  rationale: נפש désigne ici la vie ou la personne, non nécessairement une âme immatérielle. La formulation maintient clairement l’idée de substitution.
theological_decisions:
- issue: Valeur temporelle des verbes יָקַרְתָּ, נִכְבַּדְתָּ et אֲהַבְתִּיךָ
  choice: présent français
  alternative: passé ou passé composé
  rationale: Dans le contexte, ces formes décrivent vraisemblablement la condition actuelle d’Israël aux yeux de Dieu. Une note conserve toutefois la possibilité d’une lecture passée.
- issue: Valeur temporelle de וְאֶתֵּן
  choice: je donne
  alternative: je donnerai
  rationale: Le yiqtol admet une portée présente-future dans l’oracle. Le texte retient le présent vivant sans exclure le futur prophétique, indiqué en note.
- issue: Sens anthropologique de נֶפֶשׁ
  choice: vie
  alternative: âme ou personne
  rationale: Ici, le mot vise la vie de l’interlocuteur dans une construction substitutive. «Vie» évite d’imposer une anthropologie dualiste étrangère au passage.
- issue: Portée de אָדָם
  choice: des hommes
  alternative: des êtres humains ou l’humanité
  rationale: Le mot a une valeur collective et concrète dans le parallélisme. Le choix n’ajoute aucune distinction doctrinale quant au sexe des personnes concernées.
translation_notes:
  register: Français international actuel, digne et accessible. L’expression idiomatique «avoir du prix aux yeux de» conserve l’image hébraïque. La coordination a été légèrement explicitée pour assurer une lecture française fluide, sans supprimer l’ambiguïté temporelle signalée par les notes.
