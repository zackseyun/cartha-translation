id: ISA.43.8
reference: Isaiah 43:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹצִ֥יא עַם עִוֵּ֖ר וְ/עֵינַ֣יִם יֵ֑שׁ וְ/חֵרְשִׁ֖ים וְ/אָזְנַ֥יִם לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/008.yaml
  text: Bring out a blind people[a], though they have eyes, and the deaf, though they have ears.
translation:
  language: fr
  text: Fais sortir un peuple aveugle[a], bien qu’il ait des yeux, et les sourds, bien qu’ils aient des oreilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Conduis dehors le peuple aveugle, qui a pourtant des yeux, et les sourds, qui ont pourtant des oreilles. »'
    reason: 'Alternative lexicale et syntaxique : הוֹצִיא peut aussi se rendre par « conduis dehors », et les conjonctions peuvent être exprimées par « pourtant ».'
lexical_decisions:
- source_word: הוֹצִיא
  choice: Fais sortir
  rationale: 'Impératif masculin singulier au hiphil de יצא : il commande de faire sortir ou d’amener dehors. « Fais sortir » est naturel et conserve la valeur causative.'
- source_word: עַם
  choice: un peuple
  rationale: Le nom עם désigne ici collectivement un peuple, sans article dans le texte hébreu. L’indéfini français préserve cette forme.
- source_word: עִוֵּר
  choice: aveugle
  rationale: L’adjectif qualifie « peuple » et conserve l’image sensorielle, ainsi que sa possible portée métaphorique dans le contexte prophétique.
- source_word: וְעֵינַיִם יֵשׁ
  choice: bien qu’il ait des yeux
  rationale: 'Littéralement : « et il y a des yeux ». La tournure concessive exprime naturellement en français le contraste rhétorique entre l’aveuglement et la possession d’yeux.'
- source_word: וְחֵרְשִׁים
  choice: et les sourds
  rationale: Adjectif pluriel substantivé. « Les sourds » rend clairement ce nouvel ensemble dans la construction parallèle.
- source_word: וְאָזְנַיִם לָמוֹ
  choice: bien qu’ils aient des oreilles
  rationale: 'Littéralement : « et des oreilles [sont] à eux ». La formulation française explicite la possession et rend le contraste concessif.'
theological_decisions:
- issue: Nature de l’aveuglement et de la surdité
  choice: Conserver les termes sensoriels ordinaires tout en laissant le contexte suggérer une insensibilité spirituelle.
  alternative: Préciser dans le texte principal qu’il s’agit d’un aveuglement et d’une surdité spirituels.
  rationale: L’hébreu emploie les termes usuels pour « aveugle » et « sourds ». Les interpréter explicitement dans la traduction réduirait la tension voulue par l’image prophétique.
translation_notes:
  register: Français international moderne, courant et digne. Le singulier « il » reprend « un peuple », tandis que le pluriel « ils » reprend « les sourds ». La répétition concessive conserve le parallélisme et l’ironie prophétique.
