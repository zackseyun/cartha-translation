  terminology: « Profané », « chefs du sanctuaire » et « voué … à la destruction » maintiennent le registre cultuel et judiciaire du texte sans identifier indûment les chefs à des prêtres. La note sur « l’interdit » fournit utilement l’alternative technique de חֵרֶם, sans imposer la terminologie confessionnelle d’« anathème ».
