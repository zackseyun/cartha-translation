  source_fidelity: 'Le texte rend avec fidélité les trois membres de la phrase : la profanation des chefs rattachés au domaine sacré, la remise de Jacob au ḥerem/destruction et celle d’Israël aux outrages. « Donc » est recevable pour la valeur consécutive du waw dans ce contexte. « Voué … à la destruction » exprime adéquatement la force judiciaire de לַחֵרֶם, sans atténuation.'
