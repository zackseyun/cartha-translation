source:
  edition: WLC
  text: וַ/אֲחַלֵּ֖ל שָׂ֣רֵי קֹ֑דֶשׁ וְ/אֶתְּנָ֤ה לַ/חֵ֨רֶם֙ יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל לְ/גִדּוּפִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
translation:
  language: fr
  text: J’ai donc profané les chefs du sanctuaire, j’ai voué Jacob à la destruction[a] et Israël aux insultes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai livré Jacob à l’interdit », c’est-à-dire à une destruction décrétée par le jugement divin.
    reason: Alternative lexicale pour חֵרֶם, terme désignant ce qui est mis à l’interdit et voué à la destruction.
lexical_decisions:
- source_word: וַאֲחַלֵּל
  choice: J’ai donc profané
  rationale: Le piel de חלל signifie traiter comme profane ou désacraliser. « Profané » conserve la portée cultuelle; le contexte donne à la forme verbale une valeur passée et « donc » exprime son lien logique avec ce qui précède.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: les chefs du sanctuaire
  rationale: שָׂרֵי désigne des chefs ou dignitaires. Le complément קֹדֶשׁ les rattache vraisemblablement à la sphère sacrée; « du sanctuaire » reste naturel sans préciser indûment qu’il s’agit des prêtres.
- source_word: וְאֶתְּנָה
  choice: j’ai voué
  rationale: נתן signifie littéralement « donner », mais avec לַחֵרֶם il exprime ici l’affectation au jugement destructeur. « Vouer » rend idiomatiquement cette construction en français.
- source_word: לַחֵרֶם
  choice: à la destruction
  rationale: חֵרֶם désigne ce qui est mis à l’interdit et voué à la destruction dans le jugement divin. La traduction principale communique clairement la conséquence, tandis que la note conserve l’image technique de l’interdit.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est conservé; il désigne ici, par métonymie, le peuple.
- source_word: וְיִשְׂרָאֵל
  choice: et Israël
  rationale: Le nom propre est conservé en parallèle poétique avec « Jacob ».
- source_word: לְגִדּוּפִים
  choice: aux insultes
  rationale: Le pluriel גדופים désigne des paroles outrageantes, des injures ou des railleries. « Aux insultes » est naturel en français, garde le pluriel et exprime l’exposition publique au mépris sans suggérer nécessairement un blasphème dirigé contre Dieu.
theological_decisions:
- issue: Portée du jugement exprimé par חֵרֶם
  choice: « voué Jacob à la destruction »
  alternative: « livré Jacob à l’interdit » ou « frappé Jacob d’anathème »
  rationale: La formulation conserve la gravité du jugement d’alliance sans l’atténuer. La note signale le terme biblique technique sans importer les connotations ecclésiastiques ultérieures d’« anathème ».
- issue: Référent de שָׂרֵי קֹדֶשׁ
  choice: « les chefs du sanctuaire »
  alternative: « les chefs sacrés » ou « les prêtres »
  rationale: L’hébreu rattache ces chefs à la sphère sainte, mais ne les appelle pas explicitement prêtres. La traduction évite donc cette précision interprétative tout en préservant le lien cultuel.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre Jacob et Israël est conservé. « Chefs » est plus courant que « princes » pour des responsables de la sphère sacrée, et « insultes » rend naturellement le pluriel hébreu.
