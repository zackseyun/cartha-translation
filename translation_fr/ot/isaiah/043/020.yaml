  naturalness: Le français est naturel et d’un registre prophétique sobre. « Celui que j’ai choisi » est fluide, mais moins précis et plus explicatif que le terme hébreu. « Mon élu » est idiomatique et correspond mieux au lexique d’Isaïe; la note prévient une lecture individualisante.
  terminology: « Animaux sauvages », « chacals », « autruches », « désert », « terre aride » et « donner à boire » conviennent. « Fleuves » est possible pour נְהָרוֹת et conserve l’image d’une abondance remarquable. « Mon élu » rend directement בְחִירִי, sans introduire la notion verbale de choix accompli.
