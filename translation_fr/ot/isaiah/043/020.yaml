source:
  edition: WLC
  text: תְּכַבְּדֵ֨/נִי֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה תַּנִּ֖ים וּ/בְנ֣וֹת יַֽעֲנָ֑ה כִּֽי נָתַ֨תִּי בַ/מִּדְבָּ֜ר מַ֗יִם נְהָרוֹת֙ בִּֽ/ישִׁימֹ֔ן לְ/הַשְׁק֖וֹת עַמִּ֥/י בְחִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
translation:
  language: fr
  text: 'Les animaux sauvages m’honoreront,

    les chacals et les autruches[a],

    car je donnerai[b] de l’eau dans le désert,

    des fleuves dans la terre aride,

    pour donner à boire à mon peuple,

    mon élu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les filles de l’autruche », expression hébraïque désignant les autruches. Certaines traductions anciennes ont « les hiboux ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une forme accomplie : « j’ai donné ». Dans ce contexte prophétique, elle peut présenter une action future comme certaine.'
    reason: temporal_ambiguity
  - marker: c
    text: Littéralement « mon choisi » ou « mon élu ». Le singulier hébreu renvoie ici collectivement au peuple.
    reason: corporate_singular
lexical_decisions:
- source_word: תְּכַבְּדֵנִי
  choice: m’honoreront
  rationale: Le piel de כבד signifie ici « honorer » ou « glorifier ». « M’honoreront » est naturel, digne et conserve l’idée que les animaux reconnaissent l’action de Dieu.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Cette expression désigne collectivement les animaux vivant hors des espaces domestiqués. Cette formulation est plus courante en français moderne que « les bêtes des champs ».
- source_word: תַּנִּים
  choice: les chacals
  rationale: Dans ce contexte de faune du désert, le terme désigne très probablement les chacals plutôt que des créatures monstrueuses ou des serpents.
- source_word: בְנוֹת יַעֲנָה
  choice: les autruches
  rationale: L’expression signifie littéralement « filles de l’autruche » et fonctionne comme une désignation idiomatique des autruches.
- source_word: נָתַתִּי
  choice: je donnerai
  rationale: La forme est un accompli hébreu, mais le contexte immédiat annonce l’intervention nouvelle de Dieu. Le futur français exprime clairement cette action présentée comme certaine.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici une région aride et inhabitée. « Désert » est clair et idiomatique en français.
- source_word: נְהָרוֹת
  choice: des fleuves
  rationale: Le pluriel évoque des cours d’eau abondants et renforce l’ampleur de la provision divine.
- source_word: בִּישִׁימוֹן
  choice: dans la terre aride
  rationale: Le mot désigne un lieu désolé et stérile. « Terre aride » maintient le parallélisme sans répéter « désert ».
- source_word: לְהַשְׁקוֹת
  choice: pour donner à boire à
  rationale: L’infinitif exprime le but. Cette tournure concrète convient naturellement à un complément humain.
- source_word: עַמִּי בְחִירִי
  choice: mon peuple, celui que j’ai choisi
  rationale: Cette formulation conserve l’apposition entre « mon peuple » et le singulier בְחִירִי tout en rendant explicite sa valeur collective en français.
theological_decisions:
- issue: Valeur collective du singulier בְחִירִי
  choice: celui que j’ai choisi
  alternative: mon élu ; mes élus ; mon peuple choisi
  rationale: Le mot hébreu est morphologiquement singulier et renvoie collectivement au peuple. « Celui que j’ai choisi » préserve le singulier et évite que « mon élu » soit compris comme la désignation isolée d’un individu.
- issue: Valeur temporelle de נָתַתִּי
  choice: je donnerai
  alternative: j’ai donné ; je donne
  rationale: L’accompli hébreu peut présenter comme déjà certaine une action annoncée dans ce contexte prophétique. Le futur français respecte la perspective contextuelle sans nier la forme source, signalée en note.
translation_notes:
  register: Français international moderne, sobre et poétique. Les deux premiers vers gardent l’énumération hébraïque, tandis que « animaux sauvages » et « terre aride » privilégient une compréhension immédiate sans affaiblir le registre prophétique.
