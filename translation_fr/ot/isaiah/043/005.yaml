id: ISA.43.5
reference: Isaiah 43:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
translation:
  language: fr
  text: N’aie pas peur, car je suis avec toi. De l’est, je ferai venir ta descendance[a] ; de l’ouest, je te rassemblerai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un nom collectif au singulier ; on pourrait aussi traduire : « tes descendants ».'
    reason: lexical_alternative
  - marker: b
    text: Le « te » singulier s’adresse collectivement à Jacob, c’est-à-dire à Israël.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: La particule négative avec l’imparfait de ירא exprime une défense. Cette formulation est naturelle en français moderne et conserve la force directe de l’hébreu.
- source_word: כִּי אִתְּךָ אָנִי
  choice: car je suis avec toi
  rationale: כִּי donne le motif de l’exhortation, et la tournure française restitue clairement l’affirmation de présence sans ajout interprétatif.
- source_word: מִמִּזְרָח
  choice: De l’est
  rationale: מִזְרָח désigne ici le point cardinal associé au lever du soleil ; « l’est » est l’équivalent géographique idiomatique.
- source_word: אָבִיא
  choice: je ferai venir
  rationale: Le hiphil de בוא signifie « faire venir » ou « amener ». « Je ferai venir » rend explicitement la valeur causative sans ajouter la notion de retour.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: זֶרַע est un singulier collectif désignant ici les descendants. « Descendance » préserve ce caractère collectif et convient au registre prophétique moderne.
- source_word: וּמִמַּעֲרָב
  choice: de l’ouest
  rationale: מַעֲרָב est le correspondant occidental de מִזְרָח ; « l’ouest » est la formulation géographique naturelle.
- source_word: אֲקַבְּצֶךָּ
  choice: je te rassemblerai
  rationale: Le piel de קבץ exprime l’action de rassembler. Le pronom singulier est conservé afin de refléter l’adresse collective à Israël.
theological_decisions:
- issue: Référent des pronoms de deuxième personne au singulier
  choice: Conserver « toi », « ta » et « te » au singulier, en signalant le sens collectif par une note.
  alternative: Employer le pluriel ou expliciter « ton peuple ».
  rationale: L’hébreu s’adresse à Jacob/Israël comme à une personne collective. Le singulier maintient la forme prophétique et évite d’introduire une explicitation dans le texte.
translation_notes:
  register: Français international moderne, direct et digne. « N’aie pas peur » est plus naturel aujourd’hui que « Ne crains pas », tandis que « descendance » et « rassemblerai » conservent le registre prophétique. Les deux propositions géographiques sont mises en parallèle.
