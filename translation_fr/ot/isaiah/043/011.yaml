  text: אָנֹכִ֥י אָנֹכִ֖י יְהוָ֑ה וְ/אֵ֥ין מִ/בַּלְעָדַ֖/י מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/011.yaml
  text: I[a], I am Yahweh, and besides me there is no savior.
translation:
  language: fr
  text: Moi, moi, je suis Yahweh, et en dehors de moi, il n’y a pas de sauveur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « hormis moi, il n’y a pas de sauveur ».'
    reason: Variante lexicale fidèle de מִבַּלְעָדַי.
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: Moi, moi, je suis
  rationale: Le redoublement du pronom indépendant est emphatique. « Moi, moi » conserve cette répétition inhabituelle et sa force, tandis que « je suis » fournit en français la copule sous-entendue en hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par le titre « le Seigneur ».
- source_word: וְאֵין
  choice: et ... il n’y a pas de
  rationale: Cette tournure française naturelle rend la négation existentielle exprimée par אֵין.
- source_word: מִבַּלְעָדַי
  choice: en dehors de moi
  rationale: 'Cette expression rend l’idée d’exclusion portée par la préposition : nul autre que Yahweh n’est sauveur. « Hormis moi » constitue une variante plus concise.'
- source_word: מוֹשִׁיעַ
  choice: sauveur
  rationale: Le participe hiphil substantivé désigne celui qui sauve ou délivre. « Sauveur » est ici le terme français le plus direct et conserve toute la portée de l’affirmation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. La transcription « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Exclusivité du salut
  choice: en dehors de moi, il n’y a pas de sauveur
  alternative: hormis moi, il n’y a pas de sauveur
  rationale: La formulation conserve sans l’atténuer l’affirmation exclusive du texte hébreu, sans préciser davantage la nature du salut.
translation_notes:
  register: Français moderne, courant et digne. La répétition « Moi, moi » est volontairement marquée afin de préserver l’emphase de l’hébreu.
