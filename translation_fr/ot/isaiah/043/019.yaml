  text: הִנְ/נִ֨י עֹשֶׂ֤ה חֲדָשָׁה֙ עַתָּ֣ה תִצְמָ֔ח הֲ/ל֖וֹא תֵֽדָע֑וּ/הָ אַ֣ף אָשִׂ֤ים בַּ/מִּדְבָּר֙ דֶּ֔רֶךְ בִּֽ/ישִׁמ֖וֹן נְהָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
translation:
  language: fr
  text: Voici, je fais du nouveau ; maintenant, cela germe. Ne le reconnaissez-vous pas[a] ? Je mettrai même dans le désert un chemin, et dans la terre aride des fleuves[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne le savez-vous pas ? » ou « Ne vous en rendez-vous pas compte ? »'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici deux termes proches mais distincts pour les régions incultes et désolées, rendus par « désert » et « terre aride ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: La formule attire l’attention sur l’annonce divine. « Voici » est bref, digne et naturel dans ce contexte prophétique ; « Me voici » ferait davantage porter l’accent sur la présence du locuteur.
- source_word: עֹשֶׂה חֲדָשָׁה
  choice: je fais du nouveau
  rationale: Le participe présente l’action divine comme en cours ou imminente, tandis que l’adjectif féminin substantivé désigne une réalité nouvelle sans en préciser d’avance la nature.
- source_word: עַתָּה תִצְמָח
  choice: maintenant, il germe
  rationale: Cette formulation garde l’immédiateté de עַתָּה et la métaphore végétale concrète du verbe צמח.
- source_word: תֵדָעוּהָ
  choice: le reconnaissez-vous
  rationale: ידע signifie fondamentalement « connaître », mais désigne ici la perception ou la reconnaissance de l’œuvre nouvelle qui commence à paraître.
- source_word: אַף אָשִׂים
  choice: Je ferai même passer
  rationale: אַף marque une extension emphatique. Avec un chemin puis des fleuves, « faire passer » et « faire couler » rendent en français naturel l’action de placer ou d’établir ces réalités.
- source_word: בַּמִּדְבָּר דֶּרֶךְ
  choice: un chemin dans le désert
  rationale: « Chemin » conserve à la fois l’image concrète et les résonances plus larges du motif dans Ésaïe, sans imposer une lecture allégorique.
- source_word: בִּישִׁמוֹן נְהָרוֹת
  choice: des fleuves dans la terre aride
  rationale: « Terre aride » exprime une région désolée et distingue ce second terme de מִדְבָּר, rendu par « désert ».
theological_decisions:
- issue: Portée de la « chose nouvelle » et des images de renouvellement
  choice: Conserver les images concrètes d’une voie dans le désert et de fleuves en terre aride sans identifier explicitement un accomplissement doctrinal unique.
  alternative: Préciser dans le texte qu’il s’agit du retour d’exil, du salut messianique ou du renouvellement eschatologique.
  rationale: Le contexte d’Ésaïe permet notamment une lecture liée au nouvel exode et au retour, tout en ouvrant sur une portée théologique plus vaste. L’hébreu du verset ne réduit pas lui-même l’image à un seul niveau d’accomplissement.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La métaphore de la germination et le parallélisme géographique sont conservés. Les verbes « passer » et « couler » explicitent naturellement en français le verbe hébreu unique « placer/établir » qui régit à la fois le chemin et les fleuves.
