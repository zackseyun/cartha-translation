  terminology: « Délivrer », « ma main » et « J’agis » conviennent au registre et conservent les termes images essentiels. L’explicitation « mon action » dans la dernière question est acceptable, puisque le suffixe féminin renvoie vraisemblablement à l’action implicite d’« J’agis » ; elle ne spécifie aucun événement ni interprétation doctrinale.
