source:
  edition: WLC
  text: גַּם מִ/יּוֹם֙ אֲנִ֣י ה֔וּא וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּ֑יל אֶפְעַ֖ל וּ/מִ֥י יְשִׁיבֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
translation:
  language: fr
  text: Oui, depuis lors[a], c’est moi. Personne ne peut délivrer qui que ce soit de ma main. J’agis, et qui peut annuler mon action[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très concis. On peut aussi comprendre : « depuis aujourd’hui », « depuis les temps anciens » ou, de manière plus interprétative, « depuis toujours ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « qui peut la faire revenir en arrière ? », c’est-à-dire renverser ou défaire l’action de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Oui
  rationale: La particule a ici une valeur d’insistance plutôt que de simple addition. « Oui » introduit naturellement une affirmation solennelle en français.
- source_word: מִיּוֹם
  choice: depuis ce jour-là
  rationale: L’expression hébraïque, très concise, indique une durée à partir d’un jour ou d’une époque sans préciser nettement le repère. Ce choix reste intelligible tout en signalant l’ambiguïté dans une note.
- source_word: אֲנִי הוּא
  choice: c’est moi
  rationale: Cette formulation française naturelle conserve la force de l’auto-identification divine. Le calque « moi, je suis lui » serait obscur en français, tandis que « je suis le même » ajouterait explicitement une idée de permanence que la formule ne lexicalise pas à elle seule.
- source_word: וְאֵין
  choice: Personne ne peut
  rationale: Le tour existentiel négatif suivi du participe est rendu par une proposition française naturelle exprimant l’absence de tout libérateur capable d’intervenir.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: La traduction conserve la métaphore de la main, qui représente ici la puissance et la maîtrise de Dieu.
- source_word: מַצִּיל
  choice: délivrer
  rationale: Le participe désigne celui qui délivre ou arrache au pouvoir d’un autre. « Délivrer » conserve sa portée forte sans préciser un objet que l’hébreu laisse implicite.
- source_word: אֶפְעַל
  choice: J’agis
  rationale: Le verbe פעל décrit l’accomplissement d’une action. « J’agis » convient au contexte d’une intervention divine souveraine et décisive.
- source_word: יְשִׁיבֶנָּה
  choice: annuler mon action
  rationale: Le hiphil de שוב signifie ici faire revenir ou renverser ce qui a été accompli. « Annuler mon action » exprime idiomatiquement en français l’impossibilité de défaire l’acte divin; la note conserve l’image littérale du retour en arrière.
theological_decisions:
- issue: Portée temporelle de מִיּוֹם
  choice: depuis ce jour-là
  alternative: depuis aujourd’hui ; depuis les temps anciens ; depuis toujours
  rationale: L’hébreu ne précise ni démonstratif ni terme explicite pour l’éternité. Le texte principal exprime la continuité à partir d’un repère temporel, tandis que la note préserve les autres compréhensions possibles sans imposer une conclusion métaphysique à cette seule expression.
- issue: Formule d’auto-identification אֲנִי הוּא
  choice: c’est moi
  alternative: moi, je suis lui ; je suis le même ; je suis
  rationale: La formule affirme avec force l’identité unique de Dieu. « C’est moi » reste naturelle et solennelle en français, sans transformer la tournure en énoncé philosophique ni lui imposer une interprétation doctrinale ultérieure.
- issue: Référent du suffixe féminin dans יְשִׁיבֶנָּה
  choice: mon action
  alternative: la faire revenir en arrière ; renverser cela
  rationale: Le suffixe renvoie vraisemblablement à l’action divine sous-entendue par « J’agis ». L’explicitation française rend la question intelligible sans identifier cette action à un événement particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme bref et affirmatif de l’hébreu est conservé. Les métaphores de la main et de l’action demeurent visibles, tandis que les formulations trop calquées ou artificielles sont évitées.
