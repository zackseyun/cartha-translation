  source_fidelity: Le texte rend fidèlement la convocation des nations, le défi judiciaire, le suffixe de première personne plurielle dans « nous faire entendre », et la valeur judiciaire de וְיִצְדָּקוּ. Toutefois, « événements passés » restreint indûment רִאשֹׁנוֹת, qui peut aussi inclure des déclarations antérieures ; « choses passées » préserve mieux l’ampleur du terme.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Reconnus dans leur droit » exprime naturellement le cadre judiciaire. La suppression du point d’exclamation dans la parole rapportée évite d’ajouter une intensité absente de l’hébreu.
  terminology: « Nations » et « peuples » conservent utilement le parallélisme. « Choses passées » maintient la résonance isaïenne sans imposer que les réalités visées soient exclusivement des événements. Les notes restent correctement ancrées et pertinentes.
  issues:
  - severity: medium
    issue: « événements passés » est trop spécifique pour רִאשֹׁנוֹת.
    rationale: Le pluriel hébreu désigne littéralement les « choses antérieures/premières » et, dans le contexte, peut viser tant des faits que des annonces antérieures. « Événements » exclut inutilement cette seconde possibilité.
  - severity: low
    issue: Le point d’exclamation dans « C’est vrai ! » ajoute une nuance expressive.
    rationale: אֱמֶת fonctionne comme une reconnaissance de vérité dans une scène judiciaire ; un point final français est plus neutre et n’ajoute pas d’emphase.
