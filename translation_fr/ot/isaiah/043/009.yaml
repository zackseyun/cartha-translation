source:
  edition: WLC
  text: כָּֽל הַ/גּוֹיִ֞ם נִקְבְּצ֣וּ יַחְדָּ֗ו וְ/יֵאָֽסְפוּ֙ לְאֻמִּ֔ים מִ֤י בָ/הֶם֙ יַגִּ֣יד זֹ֔את וְ/רִֽאשֹׁנ֖וֹת יַשְׁמִיעֻ֑/נוּ יִתְּנ֤וּ עֵֽדֵי/הֶם֙ וְ/יִצְדָּ֔קוּ וְ/יִשְׁמְע֖וּ וְ/יֹאמְר֥וּ אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
translation:
  language: fr
  text: 'Que toutes les nations se rassemblent, et que les peuples se réunissent ! Qui parmi eux peut annoncer cela et nous faire entendre les choses passées[a] ? Qu’ils présentent leurs témoins pour qu’ils soient reconnus dans leur droit[b] ; qu’ils entendent et disent : « C’est vrai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les premières choses ». Dans Ésaïe, cette expression peut désigner des événements antérieurs ou des déclarations faites auparavant, qui attestent la souveraineté du Seigneur.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’ils soient justifiés » ou « pour qu’ils aient gain de cause ». Le verbe hébreu a ici un sens judiciaire.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: Dans cette scène judiciaire internationale, גּוֹיִם désigne naturellement les nations, et non spécifiquement les non-Juifs.
- source_word: נִקְבְּצוּ יַחְדָּו
  choice: se rassemblent
  rationale: Le niphal exprime ici le rassemblement ; le verbe français pronominal rend naturellement l’idée de se réunir tous ensemble sans lourdeur redondante.
- source_word: וְיֵאָסְפוּ לְאֻמִּים
  choice: et que les peuples se réunissent
  rationale: « Peuples » distingue לְאֻמִּים de « nations » tout en conservant le parallélisme ; « se réunissent » rend le niphal de אסף dans un français courant.
- source_word: מִי בָהֶם יַגִּיד זֹאת
  choice: Qui parmi eux peut annoncer cela
  rationale: « Peut » explicite la portée du défi rhétorique, tandis qu’« annoncer » convient au hiphil de נגד.
- source_word: וְרִאשֹׁנוֹת יַשְׁמִיעֻנוּ
  choice: et nous faire entendre les événements passés
  rationale: Le suffixe ־נוּ est rendu par « nous », et la construction causative de שמע par « faire entendre ». « Événements passés » exprime naturellement le substantif pluriel tout en maintenant sa possible référence à des actes ou déclarations antérieurs.
- source_word: יִתְּנוּ עֵדֵיהֶם
  choice: Qu’ils présentent leurs témoins
  rationale: Dans le cadre d’un procès, נתן avec « témoins » signifie naturellement les produire ou les présenter.
- source_word: וְיִצְדָּקוּ
  choice: pour qu’ils soient reconnus dans leur droit
  rationale: Cette formulation communique la valeur judiciaire de צדק — être déclaré fondé ou avoir gain de cause — sans introduire d’emblée un sens doctrinal technique.
- source_word: וְיִשְׁמְעוּ וְיֹאמְרוּ אֱמֶת
  choice: 'qu’ils entendent et disent : « C’est vrai ! »'
  rationale: La répétition du pronom conserve l’ambiguïté du sujet hébreu. « C’est vrai » donne à אֱמֶת une expression prédicative naturelle en français.
theological_decisions:
- issue: Imagerie judiciaire et sens de וְיִצְדָּקוּ
  choice: « pour qu’ils soient reconnus dans leur droit »
  alternative: « afin qu’ils soient justifiés » ou « pour qu’ils aient gain de cause »
  rationale: Le contexte est celui d’une confrontation judiciaire entre le Seigneur et les nations ou leurs dieux. Le choix retient le sens médico-légal du verbe sans lui imposer une acception doctrinale ultérieure.
- issue: Référent du sujet dans « qu’ils entendent et disent »
  choice: Maintenir le pronom « ils » sans préciser son antécédent
  alternative: Identifier explicitement les témoins ou les nations comme sujet
  rationale: L’hébreu ne tranche pas explicitement entre ces référents ; la traduction préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs de convocation rendent la scène judiciaire avec vigueur. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent, et le suffixe hébreu « nous » est conservé.
