revisions:
- from: 'Que toutes les nations se rassemblent, et que les peuples se réunissent ! Qui parmi eux peut annoncer cela et nous faire entendre les événements passés[a] ? Qu’ils présentent leurs témoins pour qu’ils soient reconnus dans leur droit[b] ; qu’ils entendent et disent : « C’est vrai ! »'
  to: 'Que toutes les nations se rassemblent, et que les peuples se réunissent ! Qui parmi eux peut annoncer cela et nous faire entendre les choses passées[a] ? Qu’ils présentent leurs témoins pour qu’ils soient reconnus dans leur droit[b] ; qu’ils entendent et disent : « C’est vrai. »'
  rationale: La révision remplace une formulation qui limitait le référent de רִאשֹׁנוֹת à des événements par « choses passées », plus englobant et toujours idiomatique. Elle neutralise également la ponctuation exclamative de l’aveu final. Le reste du texte, notamment « nous », absent par erreur de certaines étapes de l’audit anglais mais explicitement présent dans le suffixe hébreu ־נוּ, est conservé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:36Z'
