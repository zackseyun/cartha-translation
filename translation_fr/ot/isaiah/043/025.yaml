base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
translation:
  language: fr
  text: C’est moi, moi qui efface[a] tes révoltes pour moi-même, et je ne me souviendrai pas de tes péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enlève » ou « fait disparaître ». Le verbe peut évoquer ce que l’on essuie ou efface.'
    reason: lexical_alternative
  - marker: b
    text: Ici, ne pas se souvenir signifie ne plus tenir ces péchés contre son peuple.
    reason: meaning_clarification
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: Moi, moi, je suis celui qui
  rationale: La répétition emphatique du pronom et la formule d’auto-identification sont toutes deux conservées dans un français naturel et solennel.
- source_word: מֹחֶה
  choice: efface
  rationale: Le participe évoque la suppression complète d’une inscription ou d’une dette. « Efface » restitue clairement cette image en français courant.
- source_word: פְשָׁעֶיךָ
  choice: tes révoltes
  rationale: פשע désigne souvent des actes de rébellion, et non de simples fautes. « Révoltes » préserve cette gravité tout en restant distinct de « péchés » dans le second membre.
- source_word: לְמַעֲנִי
  choice: pour l’amour de moi-même
  rationale: Cette expression maintient l’insistance du texte sur Dieu comme motif de son propre acte, sans introduire une cause humaine absente du verset.
- source_word: וְחַטֹּאתֶיךָ
  choice: tes péchés
  rationale: « Péchés » est l’équivalent français direct et naturel, tout en préservant le parallélisme avec « révoltes ».
- source_word: לֹא אֶזְכֹּר
  choice: je ne me souviendrai pas
  rationale: Le futur rend la résolution exprimée par l’imparfait hébreu et conserve la formulation anthropomorphique du texte sans l’expliquer dans le corps du verset.
theological_decisions:
- issue: Le motif divin du pardon
  choice: Dieu efface les révoltes « pour l’amour de moi-même »
  alternative: Présenter le pardon comme fondé principalement sur le repentir ou le mérite du pécheur
  rationale: לְמַעֲנִי attribue explicitement à Dieu lui-même le motif de son action; la traduction ne doit ni atténuer cette affirmation ni ajouter une condition absente.
- issue: Dieu ne se souvient pas des péchés
  choice: Conserver littéralement « je ne me souviendrai pas »
  alternative: 'Expliciter dans le texte principal : « je ne les retiendrai plus contre toi »'
  rationale: La formulation hébraïque doit rester visible avec sa tension anthropomorphique; une note peut en indiquer la portée contextuelle sans remplacer l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition initiale, inhabituelle mais expressive, est maintenue afin de préserver l’emphase hébraïque. Le tutoiement singulier correspond à l’adresse au peuple personnifié.
