source:
  edition: WLC
  text: אָבִ֥י/ךָ הָ/רִאשׁ֖וֹן חָטָ֑א וּ/מְלִיצֶ֖י/ךָ פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/027.yaml
  text: Your first father sinned[b][a], and your spokesmen rebelled against me.
translation:
  language: fr
  text: Ton premier ancêtre[a] a péché, et tes porte-parole[b] se sont révoltés contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ton premier père ». Ou « ton ancêtre le plus ancien ». L’expression peut désigner de manière générale l’ancêtre fondateur d’Israël, sans nommer un personnage précis.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes interprètes » ou « tes médiateurs ». Le terme hébreu peut désigner des représentants qui parlent au nom du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיךָ הָרִאשׁוֹן
  choice: ton premier père
  rationale: 'Cette traduction directe conserve l’image hébraïque et l’ambiguïté sur l’identité du personnage visé : Adam, Jacob ou, plus généralement, le premier ancêtre d’Israël.'
- source_word: חָטָא
  choice: a péché
  rationale: « Pécher » exprime naturellement en français la faute morale et religieuse indiquée par le verbe hébreu.
- source_word: מְלִיצֶיךָ
  choice: tes porte-parole
  rationale: Le terme peut désigner des interprètes, des médiateurs ou des représentants qui parlent au nom d’autrui. « Porte-parole » rend cette fonction représentative sans imposer une médiation sacerdotale.
- source_word: פָּשְׁעוּ בִי
  choice: se sont révoltés contre moi
  rationale: Le verbe פשע évoque une transgression volontaire pouvant prendre la forme d’une rébellion; avec בִי, « contre moi » rend la relation hostile exprimée par l’hébreu.
theological_decisions:
- issue: Identité du « premier père »
  choice: L’expression est conservée sans identifier le personnage.
  alternative: Préciser qu’il s’agit d’Adam, d’Abraham ou de Jacob.
  rationale: Le texte hébreu ne nomme pas cet ancêtre. Le laisser indéterminé préserve l’ambiguïté et évite d’introduire une interprétation doctrinale particulière.
- issue: Fonction des מְלִיצֶיךָ
  choice: porte-parole
  alternative: interprètes ou médiateurs
  rationale: « Porte-parole » préserve l’idée générale de représentants parlant au nom du peuple, tandis que « médiateurs » pourrait suggérer à tort une fonction sacerdotale précise.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond au singulier hébreu adressé collectivement à Israël. La formulation reste proche de la structure du texte source tout en étant naturelle en français.
