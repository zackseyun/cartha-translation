  source_fidelity: 'L’ensemble rend fidèlement le parallélisme hébreu : la traversée des eaux et des fleuves, la présence divine, puis le passage dans le feu et la préservation. « Ils ne t’emporteront pas » est une traduction recevable de יִשְׁטְפוּךָ et la note conserve utilement l’éventail du sens. En revanche, « embraser » peut suggérer plus précisément mettre en flammes et donc renforcer l’image par rapport à תִבְעַר בָּךְ, qui exprime simplement que la flamme ne brûlera pas la personne.'
