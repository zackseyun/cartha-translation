  text: כִּֽי תַעֲבֹ֤ר בַּ/מַּ֨יִם֙ אִתְּ/ךָ אָ֔נִי וּ/בַ/נְּהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/ךָ כִּֽי תֵלֵ֤ךְ בְּמוֹ אֵשׁ֙ לֹ֣א תִכָּוֶ֔ה וְ/לֶהָבָ֖ה לֹ֥א תִבְעַר בָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
translation:
  language: fr
  text: Quand tu traverseras les eaux, je suis avec toi ; quand tu franchiras les fleuves, ils ne t’emporteront pas[a]. Quand tu marcheras dans le feu, tu ne seras pas brûlé[b], et la flamme ne te brûlera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne te submergeront pas ». Le verbe hébreu peut évoquer des eaux qui déferlent sur quelqu’un, le submergent ou l’emportent.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu ne seras pas roussi ». Le verbe de cette proposition se distingue de celui de la suivante, qui décrit plus directement l’action de la flamme.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans chacune des deux moitiés du verset, כִּי introduit une circonstance temporelle. « Quand » convient au parallélisme et n’en fait ni une simple hypothèse ni une explication causale.
- source_word: תַעֲבֹר בַּמַּיִם
  choice: tu traverseras les eaux
  rationale: עבר exprime ici le passage à travers un danger. Le pluriel « les eaux » conserve l’image poétique concrète de l’hébreu.
- source_word: אִתְּךָ אָ֔נִי
  choice: je suis avec toi
  rationale: Cette formulation rend naturellement la proposition nominale hébraïque et son assurance emphatique, sans transformer explicitement la présence divine en simple promesse future.
- source_word: וּבַנְּהָרוֹת
  choice: quand tu franchiras les fleuves
  rationale: La préposition signifie littéralement « dans », mais le mouvement déjà exprimé par le contexte appelle en français « franchir ». La reprise de « quand tu » explicite naturellement le parallélisme elliptique.
- source_word: לֹא יִשְׁטְפוּךָ
  choice: ils ne t’emporteront pas
  rationale: שטף évoque des eaux qui déferlent, submergent ou emportent. « Emporter » maintient la force concrète du courant sans réduire le verbe à une idée abstraite.
- source_word: תֵלֵךְ בְּמוֹ אֵשׁ
  choice: tu marcheras dans le feu
  rationale: הלך signifie aller ou marcher, et בְּמוֹ situe la personne au milieu du feu. Cette formulation conserve l’image et le parallélisme du texte.
- source_word: לֹא תִכָּוֶה
  choice: tu ne seras pas brûlé
  rationale: Le niphal de כוה désigne le fait d’être brûlé ou roussi. « Brûlé » est clair et courant ; une note signale la nuance possible de brûlure superficielle.
- source_word: וְלֶהָבָה לֹא תִבְעַר בָּךְ
  choice: et la flamme ne t’embrasera pas
  rationale: בער avec ב exprime ici l’action du feu sur la personne. « Embraser » reste concret, idiomatique et distingue cette proposition de la précédente sans renforcer le texte jusqu’à « consumer ».
theological_decisions:
- issue: Portée de la promesse exprimée par les eaux et le feu
  choice: Conserver les images concrètes et l’affirmation de la présence protectrice de Dieu au sein du danger.
  alternative: Limiter le verset aux épreuves spirituelles, ou en faire une garantie générale qu’aucun fidèle ne subira jamais de dommage physique.
  rationale: Le texte poétique promet la présence de Dieu et sa protection dans des dangers extrêmes, mais il ne précise pas si chaque image doit être prise littéralement ou métaphoriquement. La traduction préserve cette tension sans universaliser ni restreindre la promesse.
translation_notes:
  register: Français international moderne, poétique et digne. Le futur rend naturellement les formes verbales hébraïques dans les propositions temporelles, tandis que « je suis avec toi » préserve la force immédiate de la proposition nominale. Le tutoiement singulier correspond aux formes hébraïques adressées à Israël personnifié.
