source:
  edition: WLC
  text: עַם זוּ֙ יָצַ֣רְתִּי לִ֔/י תְּהִלָּתִ֖/י יְסַפֵּֽרוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/021.yaml
  text: This people I formed for myself[a]; they will declare my praise.
translation:
  language: fr
  text: Ce peuple, je l’ai façonné pour moi[a] ; il proclamera ma louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce peuple, je l’ai formé pour moi ; ils raconteront ma louange. »'
    reason: Alternative lexicale et maintien possible du pluriel hébreu dans la seconde proposition.
lexical_decisions:
- source_word: עַם
  choice: peuple
  rationale: « Peuple » désigne naturellement un groupe humain et convient au contexte d’alliance sans évoquer nécessairement un État-nation moderne.
- source_word: זוּ
  choice: ce
  rationale: Le démonstratif désigne le peuple dont il vient d’être question. « Ce » en conserve la valeur déictique.
- source_word: יָצַרְתִּי
  choice: je l’ai façonné
  rationale: Le verbe יצר évoque l’action intentionnelle de former ou de modeler. « Façonner » restitue cette nuance artisanale tout en restant naturel en français.
- source_word: לִי
  choice: pour moi
  rationale: 'La préposition ל avec le suffixe de première personne exprime ici l’orientation ou la destination : Dieu a façonné ce peuple pour lui-même. « Pour moi » reste proche de la formulation hébraïque.'
- source_word: תְּהִלָּתִי
  choice: ma louange
  rationale: 'תְּהִלָּה désigne normalement la louange. Le singulier « ma louange » conserve la forme et l’ambiguïté relationnelle du texte : louange appartenant à Dieu ou adressée à Dieu.'
- source_word: יְסַפֵּרוּ
  choice: il proclamera
  rationale: Au piel, ספר signifie raconter, faire connaître ou proclamer. « Proclamera » convient au registre prophétique. Le français reprend le collectif « peuple » par un singulier, tandis que l’hébreu emploie un verbe pluriel selon le sens collectif.
theological_decisions:
- issue: Nuance de but ou de résultat dans la seconde partie du verset
  choice: 'Présenter les deux propositions séparées par un point-virgule : « il proclamera ma louange »'
  alternative: « afin qu’il proclame ma louange »
  rationale: L’hébreu juxtapose l’action par laquelle Dieu façonne le peuple et la proclamation de sa louange, sans conjonction explicite. Le futur après le point-virgule préserve la relation possible de but ou de résultat sans l’expliciter davantage que le texte source.
- issue: Accord collectif entre « peuple » et le verbe hébreu pluriel
  choice: Employer le singulier français « il proclamera »
  alternative: « ils proclameront »
  rationale: Le verbe hébreu est pluriel et envisage les membres du peuple, mais la reprise singulière est plus naturelle en français avec l’antécédent collectif singulier « ce peuple ». La note signale la possibilité d’une formulation au pluriel.
translation_notes:
  register: Français international moderne, sobre et digne. La dislocation « Ce peuple, je l’ai façonné » conserve la mise en relief initiale de l’hébreu. « Façonné » garde l’image d’un travail intentionnel, tandis que « proclamera » convient au ton prophétique sans devenir archaïque.
