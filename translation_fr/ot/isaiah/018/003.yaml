id: ISA.18.3
reference: Isaiah 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֥י תֵבֵ֖ל וְ/שֹׁ֣כְנֵי אָ֑רֶץ כִּ/נְשֹׂא נֵ֤ס הָרִים֙ תִּרְא֔וּ וְ/כִ/תְקֹ֥עַ שׁוֹפָ֖ר תִּשְׁמָֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
translation:
  language: fr
  text: 'Vous tous qui habitez le monde, vous qui demeurez sur la terre : quand on dressera un étendard[a] sur les montagnes, vous le verrez ; quand on sonnera du shofar[b], vous l’entendrez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un signal ». Le mot hébreu désigne un signe dressé pour être visible de loin.
    reason: lexical_alternative
  - marker: b
    text: Le shofar est un instrument à vent fait d’une corne, souvent une corne de bélier; on peut aussi traduire ici par « cor » ou « trompe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: Vous tous qui habitez le monde
  rationale: Rend l’adresse universelle de façon naturelle en français tout en conservant la portée collective de כָּל et le sens de monde habité de תֵבֵל.
- source_word: וְשֹׁכְנֵי אָרֶץ
  choice: vous qui demeurez sur la terre
  rationale: Préserve le parallélisme poétique et la variation lexicale avec la première proposition.
- source_word: כִּנְשֹׂא נֵס
  choice: quand on dressera un étendard
  rationale: כִּי a ici une valeur temporelle. La tournure avec « on » respecte l’agent non précisé, tandis que « dresser » exprime naturellement l’élévation d’un signe visible.
- source_word: נֵס
  choice: étendard
  rationale: Désigne un signe élevé et visible de loin. « Étendard » garde la dimension publique ou militaire du terme; « signal » reste une autre traduction possible.
- source_word: הָרִים
  choice: sur les montagnes
  rationale: Conserve le pluriel du texte hébreu et la position élevée qui rend le signe visible.
- source_word: תִּרְאוּ
  choice: vous le verrez
  rationale: Conserve la deuxième personne du pluriel; le pronom explicite en français renvoie naturellement à l’étendard.
- source_word: וְכִתְקֹעַ שׁוֹפָר
  choice: quand on sonnera du shofar
  rationale: La construction temporelle parallèle est conservée. « Sonner du shofar » est idiomatique et garde la nature particulière de l’instrument hébreu sans la réduire à une trompette moderne.
- source_word: תִּשְׁמָעוּ
  choice: vous l’entendrez
  rationale: Conserve la deuxième personne du pluriel; le pronom renvoie au son du shofar, implicite dans l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le verset conserve l’adresse universelle, le parallélisme entre voir et entendre, ainsi que l’agent indéfini des deux actions de signalisation. Le terme « shofar », largement identifiable et précisé en note, évite l’image anachronique d’une trompette moderne.
