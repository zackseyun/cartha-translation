id: ISA.18.6
reference: Isaiah 18:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵעָזְב֤וּ יַחְדָּו֙ לְ/עֵ֣יט הָרִ֔ים וּֽ/לְ/בֶהֱמַ֖ת הָ/אָ֑רֶץ וְ/קָ֤ץ עָלָי/ו֙ הָ/עַ֔יִט וְ/כָל בֶּהֱמַ֥ת הָ/אָ֖רֶץ עָלָ֥י/ו תֶּחֱרָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/006.yaml
  text: They will all be left to the birds of prey of the mountains and to the beasts of the earth[a]; and the birds of prey will summer on them[b], and every beast of the earth will winter on them.
translation:
  language: fr
  text: Ils seront tous abandonnés aux rapaces des montagnes et aux bêtes de la terre[a]. Les rapaces passeront l’été sur eux[b], et toutes les bêtes de la terre y passeront l’hiver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ensemble » : « Ils seront abandonnés ensemble aux rapaces des montagnes et aux bêtes de la terre. »'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie des formes au singulier (« le rapace », « sur lui ») avec une valeur collective ; le français les rend ici au pluriel pour plus de clarté.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָזְבוּ
  choice: seront abandonnés
  rationale: 'Le nifal exprime ici naturellement le passif : les corps restent exposés et livrés aux charognards. « Abandonnés » rend avec force cette idée.'
- source_word: יַחְדָּו
  choice: tous
  rationale: L’adverbe signifie littéralement « ensemble », mais il porte ici une valeur collective que le français idiomatique exprime bien par « tous » ; l’autre lecture est signalée en note.
- source_word: לְעֵיט הָרִים
  choice: aux rapaces des montagnes
  rationale: עַיִט désigne un oiseau de proie ou charognard. Le pluriel français rend naturellement la valeur collective du singulier hébreu, tandis que « des montagnes » conserve l’image géographique.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: et aux bêtes de la terre
  rationale: Cette formulation actuelle mais digne conserve le parallélisme avec les oiseaux et la vaste catégorie animale de בְּהֵמָה.
- source_word: וְקָץ
  choice: passeront l’été
  rationale: Le verbe signifie passer la saison estivale. Cette tournure est plus naturelle en français moderne que le rare « estiveront ».
- source_word: עָלָיו
  choice: sur eux / y
  rationale: Le suffixe masculin singulier renvoie vraisemblablement de façon collective aux abandonnés ou à l’amas de corps. Le pluriel explicite ce référent en français ; « y » évite une répétition pesante dans le second membre.
- source_word: תֶּחֱרָף
  choice: y passeront l’hiver
  rationale: Le verbe désigne le fait de passer l’hiver. La formulation maintient le parallélisme saisonnier avec « passeront l’été ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve le parallélisme entre les rapaces et les bêtes ainsi qu’entre l’été et l’hiver. « Passer l’été/l’hiver » évite les verbes rares « estiver/hiverner » tout en restant proche des verbes hébreux.
