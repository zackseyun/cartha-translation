  text: הַ/שֹּׁלֵ֨חַ בַּ/יָּ֜ם צִירִ֗ים וּ/בִ/כְלֵי גֹמֶא֮ עַל פְּנֵי מַיִם֒ לְכ֣וּ מַלְאָכִ֣ים קַלִּ֗ים אֶל גּוֹי֙ מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט אֶל עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֚וֹי קַו קָ֣ו וּ/מְבוּסָ֔ה אֲשֶׁר בָּזְא֥וּ נְהָרִ֖ים אַרְצֽ/וֹ־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'who sends envoys by sea in vessels of papyrus over the waters: “Go, swift messengers, to a nation tall and smooth-skinned[a], to a people feared far and wide, a nation that measures out and tramples down[b], whose land rivers divide[c].”'
translation:
  language: fr
  text: 'qui envoie des émissaires par mer, dans des embarcations de papyrus, sur les eaux : « Allez, messagers rapides, vers une nation à la taille élancée et à la peau lisse[a], vers un peuple redouté partout, une nation qui mesure et qui piétine[b], dont les fleuves divisent le pays[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étirée et polie » ; l’expression décrit probablement l’apparence physique.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une nation de ligne sur ligne et de piétinement » ; on peut aussi comprendre : « une nation qui mesure et qui piétine ». L’expression hébraïque est obscure.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « dont les fleuves pillent le pays » ou « dévastent le pays ». Le verbe signifie ordinairement « piller » ; « divisent » est une interprétation géographique fondée sur le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: qui envoie
  rationale: L’article suivi du participe poursuit la description du verset précédent ; une proposition relative est naturelle en français.
- source_word: צִירִים
  choice: émissaires
  rationale: Dans ce contexte international, le terme désigne vraisemblablement des envoyés chargés d’une mission plutôt que de simples messagers.
- source_word: בַּיָּם
  choice: par mer
  rationale: Cette tournure française exprime naturellement la voie empruntée.
- source_word: וּבִכְלֵי גֹמֶא
  choice: dans des embarcations de papyrus
  rationale: Le syntagme désigne de légères embarcations faites de papyrus ; « embarcations » convient mieux ici que le terme plus général « vaisseaux ».
- source_word: עַל פְּנֵי מַיִם
  choice: sur les eaux
  rationale: Formulation concise et naturelle qui conserve l’image du déplacement à la surface de l’eau.
- source_word: לְכוּ
  choice: Allez
  rationale: Impératif pluriel direct adressé aux messagers.
- source_word: מַלְאָכִים קַלִּים
  choice: messagers rapides
  rationale: Dans ce contexte, קַלִּים indique la rapidité plutôt que la légèreté physique.
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  choice: une nation de haute taille et à la peau lisse
  rationale: Cette interprétation contextuelle comprend l’expression difficile comme une description physique, tout en signalant en note son sens plus littéral.
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  choice: un peuple redouté au loin
  rationale: La formule hébraïque est idiomatique et difficile ; cette traduction rend l’idée d’une crainte qui s’étend largement sans préciser indûment si l’étendue est spatiale ou temporelle.
- source_word: גּוֹי קַו קָו וּמְבוּסָה
  choice: une nation qui mesure et qui piétine
  rationale: Cette lecture relie קַו à la ligne ou au cordeau de mesure et donne à מְבוּסָה une valeur active ; l’obscurité réelle de l’expression est conservée dans une note.
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: dont les fleuves divisent le pays
  rationale: Cette interprétation géographique décrit un territoire découpé par des fleuves, tandis que la note conserve le sens ordinaire de pillage associé au verbe.
