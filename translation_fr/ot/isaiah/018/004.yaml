source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
translation:
  language: fr
  text: 'Car voici ce que Yahweh m’a dit : « Je resterai tranquille et j’observerai depuis ma demeure[a], comme une chaleur limpide au soleil[b], comme un nuage de rosée dans la chaleur de la moisson. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je resterai calme et regarderai depuis mon lieu établi ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme une chaleur limpide sur la lumière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin de l’hébreu sous sa forme usuelle dans le projet, plutôt que de le remplacer par un titre.
- source_word: אֵלַי
  choice: m’a dit
  rationale: La préposition avec le suffixe de première personne signifie naturellement « à moi » après le verbe « dire » ; en français, elle est intégrée idiomatiquement au pronom indirect.
- source_word: אשקוטה
  choice: Je resterai tranquille
  rationale: Le verbe שׁקט exprime le calme et l’absence d’intervention ou d’agitation ; cette formulation préserve ici l’idée d’une tranquillité délibérée sans suggérer le sommeil.
- source_word: וְאַבִּיטָה
  choice: et j’observerai
  rationale: נבט désigne le fait de regarder ou de considérer. « Observer » exprime une attention soutenue sans ajouter une interprétation sur l’action divine à venir.
- source_word: בִמְכוֹנִי
  choice: depuis ma demeure
  rationale: מָכוֹן désigne un lieu établi ou fixe, pouvant être une demeure. « Depuis » rend naturellement le lieu à partir duquel s’exerce l’observation, tandis que la note conserve l’autre valeur possible de la préposition.
- source_word: כְּחֹם צַח
  choice: comme une chaleur limpide
  rationale: חֹם signifie « chaleur » et צַח évoque ce qui est clair ou lumineux. La formulation garde l’étrangeté suggestive de l’image hébraïque.
- source_word: עֲלֵי אוֹר
  choice: au soleil
  rationale: Littéralement « sur la lumière ». Dans cette image météorologique, « au soleil » donne en français un sens naturel sans dissimuler la formulation littérale, signalée en note.
- source_word: כְּעָב טַל
  choice: comme un nuage de rosée
  rationale: Rend directement les deux noms עָב, « nuage », et טַל, « rosée », sans transformer l’image en simple brume.
- source_word: בְּחֹם קָצִיר
  choice: dans la chaleur de la moisson
  rationale: La tournure française conserve à la fois la circonstance de chaleur et le cadre agricole de la récolte.
theological_decisions:
- issue: Attitude divine de tranquillité et d’observation
  choice: Présenter Yahweh comme restant tranquille et observant, sans expliciter dans le verset le but de cette attitude.
  alternative: Traduire par « je me reposerai » ou paraphraser cette immobilité comme une préparation secrète au jugement.
  rationale: L’hébreu met en tension la tranquillité divine, son regard et les comparaisons naturelles. La traduction ne transforme cette tension ni en indifférence ni en annonce explicite d’une intervention.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle de la parole divine est conservée sans archaïsmes ; les images inhabituelles de l’hébreu restent perceptibles.
