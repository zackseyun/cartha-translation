  register: Français international moderne, naturel et digne. Le vocabulaire viticole reste concret; « serpes » évite l’anachronisme possible de « sécateurs ». Les termes rares relatifs aux pousses et aux branches sont traduits avec prudence, et leur incertitude est signalée en note.
