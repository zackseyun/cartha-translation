id: ISA.18.5
reference: Isaiah 18:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי לִ/פְנֵ֤י קָצִיר֙ כְּ/תָם פֶּ֔רַח וּ/בֹ֥סֶר גֹּמֵ֖ל יִֽהְיֶ֣ה נִצָּ֑ה וְ/כָרַ֤ת הַ/זַּלְזַלִּים֙ בַּ/מַּזְמֵר֔וֹת וְ/אֶת הַ/נְּטִישׁ֖וֹת הֵסִ֥יר הֵתַֽז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
translation:
  language: fr
  text: Car, avant la moisson, quand la floraison sera achevée et que la fleur deviendra un raisin en train de mûrir[a], il coupera les jeunes pousses avec des serpes et enlèvera, puis retranchera, les branches qui s’étendent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et que la fleur deviendra un raisin encore vert ». L’image hébraïque décrit le passage de la floraison au fruit en développement, avant la moisson.
    reason: lexical_alternative
  - marker: b
    text: Les mots hébreux désignant ici les différentes parties de la vigne sont rares; on pourrait aussi traduire par « rameaux », « vrilles » ou « branches retombantes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’image précédente et conserve la valeur causale ou explicative de la conjonction.
- source_word: לִפְנֵי קָצִיר
  choice: avant la moisson
  rationale: Rend directement l’expression temporelle et maintient le cadre agricole précis.
- source_word: כְּתָם פֶּרַח
  choice: quand la floraison sera achevée
  rationale: Exprime l’achèvement du stade de la floraison dans un français naturel, sans préciser davantage le processus botanique.
- source_word: וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  choice: et que la fleur deviendra un raisin en train de mûrir
  rationale: Reproduit la progression de la fleur vers le raisin encore en développement; la note signale que בֹסֶר peut être rendu plus explicitement par « raisin encore vert ».
- source_word: וְכָרַת
  choice: il coupera
  rationale: Le futur convient à l’action prophétique envisagée après la proposition temporelle.
- source_word: הַזַּלְזַלִּים
  choice: les jeunes pousses
  rationale: Le terme désigne vraisemblablement les pousses ou rameaux vigoureux de la vigne; « jeunes pousses » est concret et adapté au contexte viticole.
- source_word: בַּמַּזְמֵרוֹת
  choice: avec des serpes
  rationale: La serpe est un outil tranchant traditionnel servant notamment à tailler la vigne; ce choix évite la précision potentiellement anachronique de « sécateurs ».
- source_word: הַנְּטִישׁוֹת
  choice: les branches qui s’étendent
  rationale: Ce terme rare semble désigner une végétation allongée, étalée ou retombante; la formulation conserve cette idée sans imposer une identification trop précise.
- source_word: הֵסִיר הֵתַז
  choice: enlèvera, puis retranchera
  rationale: Conserve les deux actions hébraïques et leur effet intensif, au lieu de les fondre en un seul verbe.
theological_decisions: []
