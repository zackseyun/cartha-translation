  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: fr
  text: 'En ce temps-là, un présent sera apporté au SEIGNEUR des armées, de la part d’un peuple de haute taille et à la peau lisse[a], d’un peuple redouté de près comme de loin, d’une nation « ligne sur ligne » et de piétinement[b], dont les fleuves divisent le pays[c], jusqu’au lieu du nom du SEIGNEUR des armées : le mont Sion.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi se comprendre comme « élancé et glabre » ou « étiré et poli ».
    reason: Les deux adjectifs décrivant le peuple sont imagés et leur application exacte à l’apparence physique demeure discutée.
  - marker: b
    text: 'Hébreu obscur; littéralement, quelque chose comme « une nation ligne sur ligne et de piétinement ». On comprend aussi : « une nation qui impose règle sur règle et qui piétine ».'
    reason: La séquence קַו־קָו וּמְבוּסָה est difficile et admet plusieurs analyses lexicales; la note préserve cette ambiguïté réelle.
  - marker: c
    text: 'Le verbe hébreu est rare; autres compréhensions possibles : « dont les fleuves ont ravagé le pays » ou « dont les fleuves dépouillent le pays ».'
    reason: Le sens précis de בָּזְאוּ dans cette expression est incertain; « divisent » suit une compréhension fréquente sans exclure les autres.
lexical_decisions:
- source_word: שַׁי
  choice: présent
  rationale: Le terme désigne un don offert, éventuellement un tribut. « Présent » conserve cette amplitude sans imposer l’idée d’assujettissement politique.
- source_word: מְמֻשָּׁךְ וּמוֹרָט
  choice: de haute taille et à la peau lisse
  rationale: מְמֻשָּׁךְ évoque ce qui est étiré, d’où la haute taille; מוֹרָט peut évoquer une surface lisse, polie ou dépilée. Le rendu décrit naturellement l’apparence du peuple tout en signalant l’incertitude en note.
- source_word: נוֹרָא מִן־הוּא וָהָלְאָה
  choice: redouté au loin
  rationale: L’expression indique que la crainte inspirée par ce peuple s’étend à distance; ce rendu français est naturel et n’alourdit pas la phrase.
- source_word: גּוֹי קַו־קָו וּמְבוּסָה
  choice: une nation puissante et conquérante
  rationale: La locution est notoirement obscure. Le rendu contextuel exprime la force dominatrice associée à cette nation, tandis que la note conserve les lectures plus littérales possibles.
- source_word: בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: dont les fleuves sillonnent le pays
  rationale: Dans ce contexte, le verbe rare est couramment compris comme l’action de couper ou de diviser le territoire. « Sillonnent » restitue l’image sans la surinterpréter.
- source_word: מְקוֹם שֵׁם יְהוָה צְבָאוֹת
  choice: le lieu qui porte le nom du SEIGNEUR des armées
  rationale: Cette formulation française garde le lien explicite entre le lieu et le nom divin, sans transformer « nom » en simple périphrase de présence.
theological_decisions:
- issue: Sens cultuel ou politique de שַׁי
  choice: présent
  alternative: tribut
  rationale: Le contexte annonce une offrande apportée à Sion, mais le mot peut aussi désigner un tribut. « Présent » évite de trancher en faveur d’une soumission politique explicite.
- issue: Représentation du tétragramme יהוה
  choice: SEIGNEUR
  alternative: YHWH / Yahvé / l’Éternel
  rationale: « SEIGNEUR » en capitales suit une convention française largement intelligible pour signaler le nom divin sans en imposer une vocalisation.
- issue: Destination du présent et agent qui l’apporte
  choice: au SEIGNEUR… de la part d’un peuple
  alternative: un présent provenant d’un peuple sera apporté au SEIGNEUR
  rationale: La construction passive et la préposition ל marquent clairement le destinataire divin; « de la part de » rend la provenance ou l’agent sans identifier davantage les porteurs.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La longue phrase et ses reprises conservent l’ampleur oraculaire du verset. « Mont Sion » et « SEIGNEUR des armées » maintiennent les désignations bibliques reconnues; les principales obscurités hébraïques sont rendues lisibles dans le texte et explicitement conservées dans les notes.
