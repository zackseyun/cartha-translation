revisions:
- from: 'En ce temps-là, un présent sera apporté au SEIGNEUR des armées de la part d’un peuple de haute taille et à la peau lisse[a], d’un peuple redouté au loin, d’une nation puissante et conquérante[b], dont les fleuves sillonnent le pays[c], jusqu’au lieu qui porte le nom du SEIGNEUR des armées : le mont Sion.'
  to: 'En ce temps-là, un présent sera apporté au SEIGNEUR des armées, de la part d’un peuple de haute taille et à la peau lisse[a], d’un peuple redouté de près comme de loin, d’une nation « ligne sur ligne » et de piétinement[b], dont les fleuves divisent le pays[c], jusqu’au lieu du nom du SEIGNEUR des armées : le mont Sion.'
  rationale: La révision conserve le sens global et le registre du projet, mais retire l’interprétation « puissante et conquérante » au profit d’un rendu volontairement proche de l’hébreu et signalé comme obscur. Elle rend plus explicitement l’extension de la crainte, retient « divisent » pour l’action attribuée aux fleuves, et resserre « le lieu qui porte le nom » en « le lieu du nom », plus fidèle à la construction hébraïque sans en modifier le sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement la structure générale : offrande apportée à YHWH des armées, peuple décrit par une série d’épithètes, destination à Sion. Toutefois, « puissante et conquérante » remplace une expression hébraïque très obscure par une interprétation non portée explicitement par les mots. « Redouté au loin » atténue aussi « depuis lui et au-delà / plus loin que lui », qui exprime l’étendue de la crainte plutôt qu’une simple distance vague. Enfin, בָּזְאוּ est mieux rendu ici par « divisent » que par le plus évocateur mais moins précis « sillonnent ».'
  naturalness: La phrase est fluide, soutenue et idiomatique en français moderne. « Un peuple de haute taille et à la peau lisse » est naturel; « élancé et glabre » serait plus proche de certaines interprétations, mais nécessiterait une décision plus étroite. La reprise de « peuple » est conforme au parallélisme du verset.
  terminology: « SEIGNEUR des armées », « présent » et « mont Sion » conviennent au registre biblique moderne. « Présent » préserve utilement l’ambivalence de שַׁי entre don et tribut. Les notes doivent conserver l’incertitude de קַו־קָו וּמְבוּסָה sans que le texte principal y substitue une caractérisation politique affirmée.
  issues:
  - severity: medium
    issue: Interprétation excessive de גּוֹי קַו־קָו וּמְבוּסָה
    rationale: « Une nation puissante et conquérante » n’est pas une traduction contrôlable de la formule; ni « puissance » ni « conquérante » n’y sont explicitement exprimés. Puisque la note reconnaît l’obscurité, le texte doit employer une formulation plus proche et non doctrinalement ou historiquement déterminante.
  - severity: low
    issue: Rendu affaibli de נוֹרָא מִן־הוּא וָהָלְאָה
    rationale: « Redouté au loin » est recevable, mais « redouté de près comme de loin » rend plus clairement l’idée d’une crainte qui s’étend depuis ce peuple et au-delà, sans prétendre résoudre entièrement la syntaxe.
  - severity: low
    issue: « Sillonnent » pour בָּזְאוּ
    rationale: Le verbe rare est incertain, mais les rendus « divisent » ou « dépouillent/ravagent » sont plus directement liés aux analyses proposées. « Sillonnent » ajoute une image de réseau fluvial qui n’est pas explicitement dans le verbe.
