id: ISA.18.1
reference: Isaiah 18:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֥וֹי אֶ֖רֶץ צִלְצַ֣ל כְּנָפָ֑יִם אֲשֶׁ֥ר מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/001.yaml
  text: Ah[a], land of whirring wings, which is beyond the rivers of Cush[b],
translation:
  language: fr
  text: Ah ! pays au bruissement d’ailes[a], toi qui es au-delà des fleuves de Koush[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « pays aux ailes bourdonnantes » ou « pays au froissement d’ailes ». L’expression hébraïque est difficile et peut évoquer le bruit d’ailes, d’insectes ou de quelque chose d’ailé en mouvement.'
    reason: lexical_alternative
  - marker: b
    text: Koush désigne la région située au sud de l’Égypte, souvent associée à la Nubie ou à l’Éthiopie ancienne.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: Ah !
  rationale: L’interjection peut exprimer la plainte, la menace ou l’interpellation. Ici, « Ah ! » garde sa force exclamative sans imposer d’emblée l’idée de malheur.
- source_word: אֶרֶץ
  choice: pays
  rationale: Le terme désigne ici une région géographique. « Pays » est naturel en français et n’implique pas nécessairement un État moderne.
- source_word: צִלְצַל כְּנָפָיִם
  choice: au bruissement d’ailes
  rationale: L’expression hébraïque est difficile et évoque un bruit produit par des ailes ou par quelque chose d’ailé en mouvement. Cette traduction conserve l’image concrète et son indétermination.
- source_word: אֲשֶׁר
  choice: toi qui
  rationale: La reprise par « toi qui » rend clairement et naturellement en français l’adresse au pays introduite par le relatif.
- source_word: מֵעֵבֶר לְנַהֲרֵי
  choice: au-delà des fleuves de
  rationale: Cette tournure exprime naturellement la situation sur l’autre rive ou plus loin que les fleuves mentionnés.
- source_word: כּוּשׁ
  choice: Koush
  rationale: La translittération préserve le nom géographique hébreu sans l’identifier abusivement à un État moderne précis.
theological_decisions:
- issue: Identification de כּוּשׁ
  choice: Conserver le nom « Koush »
  alternative: Éthiopie ou Nubie
  rationale: Le texte nomme une région ancienne. La translittération évite d’imposer une équivalence géopolitique moderne trop précise.
- issue: Valeur de l’interjection הוֹי
  choice: « Ah ! »
  alternative: « Malheur à » ou « Hélas ! »
  rationale: Le contexte immédiat n’établit pas encore sans ambiguïté une condamnation ou une lamentation ; la traduction garde donc l’ouverture sémantique de l’interjection.
translation_notes:
  register: Français international moderne, courant et digne. L’apostrophe « toi qui » fluidifie la syntaxe sans effacer l’adresse directe. Le choix « bruissement » conserve l’évocation sonore tout en laissant ouverte la nature exacte des ailes.
