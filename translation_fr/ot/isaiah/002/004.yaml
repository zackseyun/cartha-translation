  rationale: La révision remplace une tournure française peu idiomatique par « sera l’arbitre de nombreux peuples », qui correspond au parallélisme judiciaire de l’hébreu et ne résout pas indûment la polyvalence de יכח. La note b est reformulée afin de ne pas qualifier abusivement de littérale une paraphrase française, tout en conservant l’ancre et le sens du passage.
