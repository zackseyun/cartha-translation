  text: וְ/שָׁפַט֙ בֵּ֣ין הַ/גּוֹיִ֔ם וְ/הוֹכִ֖יחַ לְ/עַמִּ֣ים רַבִּ֑ים וְ/כִתְּת֨וּ חַרְבוֹתָ֜/ם לְ/אִתִּ֗ים וַ/חֲנִיתֽוֹתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹא יִשָּׂ֨א ג֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ ע֖וֹד מִלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
translation:
  language: fr
  text: Il jugera entre les nations et sera l’arbitre de nombreux peuples[a]. Ils transformeront leurs épées en socs de charrue et leurs lances en serpes. Une nation ne lèvera plus l’épée contre une autre[b], et l’on n’apprendra plus la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reprendra de nombreux peuples ». Le verbe hébreu peut avoir une valeur judiciaire ou corrective.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus près de la répétition hébraïque : « Une nation ne lèvera pas l’épée contre une nation. »'
    reason: literal_rendering
lexical_decisions:
- source_word: וְשָׁפַט בֵּין הַגּוֹיִם
  choice: Il jugera entre les nations
  rationale: Le sens judiciaire de שׁפט est premier dans ce contexte, et « entre » conserve le cadre d’un jugement portant sur les nations.
- source_word: וְהוֹכִיחַ לְעַמִּים רַבִּים
  choice: et arbitrera pour de nombreux peuples
  rationale: Au hifil, יכח peut exprimer l’arbitrage, la décision ou la réprimande. En parallèle avec « jugera » et dans un contexte de paix, « arbitrera » rend naturellement la force judiciaire sans ajouter un objet absent de l’hébreu.
- source_word: וְכִתְּתוּ חַרְבוֹתָם לְאִתִּים
  choice: Ils transformeront leurs épées en socs de charrue
  rationale: כתת évoque littéralement le fait de battre ou marteler. En français courant, « transformer en » communique clairement le résultat concret de ce travail, tandis que « socs de charrue » désigne naturellement les instruments agricoles.
- source_word: וַחֲנִיתוֹתֵיהֶם לְמַזְמֵרוֹת
  choice: et leurs lances en serpes
  rationale: חנית désigne la lance, et מזמרה un outil servant à tailler. « Serpes » est une formulation française concise et traditionnelle qui préserve l’image agricole.
- source_word: לֹא יִשָּׂא גוֹי אֶל גּוֹי חֶרֶב
  choice: Une nation ne lèvera plus l’épée contre une autre
  rationale: « Lever l’épée contre » conserve l’image et l’idiome hostiles de l’hébreu. « Une autre » évite une répétition peu naturelle de « nation » en français.
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  choice: et l’on n’apprendra plus la guerre
  rationale: Cette formulation préserve l’expression littérale « apprendre la guerre » et la valeur temporelle de עוֹד, sans la réduire explicitement au seul entraînement militaire.
theological_decisions:
- issue: Identité du sujet de « Il jugera »
  choice: Conserver le pronom « Il » sans nommer son référent dans ce verset.
  alternative: Expliciter « Le SEIGNEUR jugera ».
  rationale: Le contexte permet d’identifier le Seigneur comme acteur ultime, mais la forme verbale hébraïque de ce verset a un sujet masculin singulier non exprimé. Le pronom préserve cette continuité et l’implicite du texte sans ajouter un nom divin.
- issue: Portée de וְהוֹכִיחַ
  choice: arbitrera
  alternative: réprimandera / tranchera
  rationale: Le verbe admet une force corrective aussi bien que judiciaire. Ici, son parallélisme avec « jugera » et l’issue pacifique favorisent le sens d’arbitrage, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le vers est rythmé en phrases brèves; les images traditionnelles de l’épée, du soc de charrue et de la serpe sont conservées. « L’on » permet de rendre le pluriel indéfini hébreu sans attribuer artificiellement l’action aux seules nations.
