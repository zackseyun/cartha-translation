    issue: « arbitrera pour de nombreux peuples »
    rationale: En français, « arbitrer pour » est syntaxiquement et idiomatiquement moins approprié ici. Le datif hébreu peut être rendu naturellement par « être l’arbitre de », qui maintient l’ambiguïté entre décision judiciaire et intervention corrective sans introduire « les différends ».
  - severity: low
    issue: Note b présentée comme une citation littérale
    rationale: La note actuelle appelle « littérale » une formulation française qui interprète déjà la répétition hébraïque par « contre une nation ». Il vaut mieux indiquer l’alternative plus proche de la forme répétée et la valeur de « plus » dans la traduction principale.
