revisions:
- from: Il jugera entre les nations et arbitrera pour de nombreux peuples[a]. Ils transformeront leurs épées en socs de charrue et leurs lances en serpes. Une nation ne lèvera plus l’épée contre une autre[b], et l’on n’apprendra plus la guerre.
