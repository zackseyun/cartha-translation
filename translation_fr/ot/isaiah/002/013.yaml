id: ISA.2.13
reference: Isaiah 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַל֙ כָּל אַרְזֵ֣י הַ/לְּבָנ֔וֹן הָ/רָמִ֖ים וְ/הַ/נִּשָּׂאִ֑ים וְ/עַ֖ל כָּל אַלּוֹנֵ֥י הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/013.yaml
  text: and against all the cedars of Lebanon[a], lofty and lifted up, and against all the oaks of Bashan.
translation:
  language: fr
  text: contre tous les cèdres du Liban, hauts et élevés, et contre tous les chênes du Basan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les térébinthes du Basan ». Le terme hébreu peut désigner une espèce de grand arbre identifiée soit comme un chêne, soit comme un térébinthe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: contre
  rationale: Dans cette énumération de jugements, עַל exprime une intervention hostile. Le premier וְ se rattache syntaxiquement aux versets précédents; en français, commencer par « contre » préserve naturellement la continuité de la liste sans alourdir le fragment isolé.
- source_word: כָּל
  choice: tous les
  rationale: Le pluriel collectif français « tous les » convient aux deux groupes d’arbres et restitue la portée globale de כָּל.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: les cèdres du Liban
  rationale: Le construit hébreu désigne les célèbres cèdres associés au Liban; « du Liban » est la formulation française consacrée et naturelle.
- source_word: הָרָמִים
  choice: hauts
  rationale: Le terme décrit d’abord la hauteur des arbres, tout en laissant résonner, grâce au contexte, le thème de l’élévation orgueilleuse.
- source_word: וְהַנִּשָּׂאִים
  choice: et altiers
  rationale: « Altiers » exprime à la fois la stature élevée et la connotation d’orgueil présente dans le contexte. Cette formulation française poétique évite la lourdeur de « élevés » après « hauts ».
- source_word: אַלּוֹנֵי הַבָּשָׁן
  choice: les chênes du Basan
  rationale: « Chênes » est l’identification traditionnelle et contextuellement appropriée en parallèle avec les cèdres majestueux; l’identification possible comme térébinthes est conservée en note.
theological_decisions:
- issue: Portée symbolique des arbres dans l’oracle de jugement
  choice: Conserver littéralement l’image des arbres et laisser le contexte suggérer leur association avec tout ce qui est élevé et orgueilleux.
  alternative: Expliciter dans le texte qu’ils symbolisent des chefs orgueilleux ou des nations.
  rationale: Le passage juxtapose des réalités naturelles et humaines élevées que le Seigneur abaissera. La traduction littérale respecte la poésie et n’impose pas une identification symbolique plus précise que le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme binaire et la répétition de « contre tous les » conservent la structure poétique de l’énumération. « Hauts et altiers » maintient la description physique tout en laissant entendre, sans l’expliciter, le motif contextuel de l’orgueil.
