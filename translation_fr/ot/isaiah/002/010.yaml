  text: בּ֣וֹא בַ/צּ֔וּר וְ/הִטָּמֵ֖ן בֶּֽ/עָפָ֑ר מִ/פְּנֵי֙ פַּ֣חַד יְהוָ֔ה וּ/מֵ/הֲדַ֖ר גְּאֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
translation:
  language: fr
  text: Entre dans le rocher et cache-toi dans la poussière, loin de la terreur de Yahweh[a] et de l’éclat de sa majesté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant la terreur de Yahweh »; l’expression évoque la fuite loin de sa présence.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « de la majesté de sa splendeur ». L’hébreu associe deux termes proches qui expriment une gloire royale impressionnante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַצּוּר
  choice: Entre dans le rocher
  rationale: L’impératif בּוֹא suivi de la préposition בְּ exprime ici l’entrée dans un abri rocheux. « Entre dans » rend clairement le mouvement, tandis que « le rocher » conserve le singulier concret de צוּר.
- source_word: וְהִטָּמֵן
  choice: et cache-toi
  rationale: L’impératif niphal de טמן a ici une valeur réfléchie ou moyenne. « Cache-toi » est naturel en français et conserve la force directe de l’ordre.
- source_word: בֶּעָפָר
  choice: dans la poussière
  rationale: עָפָר désigne la poussière ou la terre meuble. « Poussière » préserve l’image biblique d’abaissement et de fragilité.
- source_word: מִפְּנֵי
  choice: loin de
  rationale: L’expression signifie littéralement « de devant la face de » et évoque l’éloignement ou la fuite. « Loin de » restitue cette orientation spatiale en français naturel; la formulation littérale est signalée en note.
- source_word: פַּחַד יְהוָה
  choice: la terreur de Yahweh
  rationale: Dans ce contexte de jugement, פַּחַד désigne l’effroi plutôt qu’une crainte révérencielle. Le nom divin יְהוָה est translittéré « Yahweh ».
- source_word: וּמֵהֲדַר גְּאֹנוֹ
  choice: et de l’éclat de sa majesté
  rationale: הָדָר évoque l’éclat ou la splendeur, tandis que גָּאוֹן exprime ici la majesté ou la grandeur. Cette formulation distingue les deux termes tout en gardant leur association intensive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le nom personnel divin. La translittération « Yahweh » le conserve sans le remplacer par un titre.
- issue: Valeur de פַּחַד appliqué à Yahweh
  choice: la terreur de Yahweh
  alternative: la crainte de Yahweh
  rationale: Le contexte décrit des humains qui cherchent à se cacher devant la manifestation du jugement divin. « Terreur » exprime cet effroi sans le confondre avec la crainte révérencielle souvent évoquée ailleurs.
- issue: Rapport entre הָדָר et גָּאוֹן
  choice: l’éclat de sa majesté
  alternative: la majesté de sa splendeur
  rationale: Les deux noms proches décrivent la gloire royale et redoutable de Yahweh. Le choix évite de les fondre en une seule notion tout en conservant l’ambiguïté de leur relation génitive.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Les impératifs au singulier gardent l’adresse directe du texte hébreu. « Le rocher » maintient l’image singulière de la source, malgré son caractère légèrement inhabituel en français.
