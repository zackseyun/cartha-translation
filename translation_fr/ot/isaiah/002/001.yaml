id: ISA.2.1
reference: Isaiah 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
translation:
  language: fr
  text: La parole qu’Ésaïe, fils d’Amots, a vue au sujet de Juda et de Jérusalem[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le message » ou « L’affaire ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « a vue » ; il s’agit d’une expression prophétique courante pour parler d’une révélation reçue en vision.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: la parole
  rationale: דָּבָר peut désigner une parole, un message ou une affaire. « La parole » conserve ici l’expression concrète et traditionnelle d’un titre prophétique sans la paraphraser.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif « que » introduit naturellement en français le complément direct de « a vue ».
- source_word: חָזָה
  choice: a vue
  rationale: Le verbe signifie littéralement « voir » et sert couramment à décrire la perception prophétique. Ce choix conserve l’image visionnaire et son caractère volontairement inhabituel.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement la relation filiale exprimée par l’état construit hébreu.
- source_word: אָמֹוץ
  choice: Amots
  rationale: Transcription française usuelle permettant de distinguer ce nom de celui du prophète Amos.
- source_word: עַל
  choice: au sujet de
  rationale: Dans ce titre prophétique, la préposition introduit le thème de la révélation. « Au sujet de » reste neutre et n’impose pas le sens hostile « contre ».
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française consacrée du nom géographique.
- source_word: וִירוּשָׁלִַם
  choice: et de Jérusalem
  rationale: La coordination est rendue naturellement en répétant « de » après « au sujet de ».
theological_decisions:
- issue: Nature de la révélation prophétique exprimée par חָזָה
  choice: 'Conserver le langage visionnaire : « a vue »'
  alternative: « a reçue dans une vision » ou « a prophétisée »
  rationale: L’hébreu emploie explicitement le verbe « voir ». Le conserver évite de réduire ou de préciser indûment le mode de révélation, tandis que la note éclaire cet usage prophétique.
- issue: Portée de עַל dans le titre
  choice: « au sujet de Juda et de Jérusalem »
  alternative: « contre Juda et Jérusalem »
  rationale: Le titre présente globalement le thème de la vision, qui comprend jugement et espérance. Une formulation neutre préserve cette tension au lieu de limiter d’avance la prophétie à une accusation.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation inhabituelle « la parole qu’Ésaïe… a vue » est volontairement conservée pour refléter l’image hébraïque, avec une note explicative. Les noms suivent les formes françaises bibliques usuelles.
