source:
  edition: WLC
  text: לָ/בוֹא֙ בְּ/נִקְר֣וֹת הַ/צֻּרִ֔ים וּ/בִ/סְעִפֵ֖י הַ/סְּלָעִ֑ים מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/021.yaml
  text: to enter the caverns of the rocks and the clefts of the crags[a], from before the terror of Yahweh and from the splendor of his majesty[b], when he rises to terrify the earth.
translation:
  language: fr
  text: pour entrer dans les cavernes des rochers et dans les fentes des falaises[a], afin d’échapper à la terreur de Yahweh et à l’éclat de sa majesté, quand il se lèvera pour faire trembler la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les cavités des rochers et les fissures des falaises ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour terrifier la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא
  choice: pour entrer
  rationale: L’infinitif construit avec ל poursuit la phrase précédente et exprime le mouvement vers des refuges rocheux. « Entrer » est naturel et précis dans ce contexte.
- source_word: נִקְרוֹת הַצֻּרִים
  choice: les cavernes des rochers
  rationale: נִקְרוֹת désigne des creux ou cavités dans la roche; « cavernes » évoque clairement des abris naturels sans réduire l’image à de simples trous.
- source_word: בִסְעִפֵי הַסְּלָעִים
  choice: dans les fentes des falaises
  rationale: Dans ce contexte géologique, סְעִפֵי désigne des divisions ou fissures, tandis que סְלָעִים évoque des masses rocheuses escarpées. Cette formulation maintient la variation du parallélisme.
- source_word: מִפְּנֵי פַּחַד יְהוָה
  choice: loin de la terreur qu’inspire Yahweh
  rationale: מִפְּנֵי exprime ici l’éloignement devant une présence redoutable. L’explicitation « qu’inspire » évite de faire de la terreur une émotion éprouvée par Yahweh et rend le sens causal en français naturel.
- source_word: הֲדַר גְּאוֹנוֹ
  choice: l’éclat de sa majesté
  rationale: הֲדַר désigne la splendeur ou l’éclat, et גָּאוֹן, appliqué à Dieu, sa grandeur souveraine. La formulation conserve les deux composantes de l’expression hébraïque.
- source_word: בְּקוּמוֹ
  choice: quand il se lèvera
  rationale: L’infinitif construit précédé de ב est pris dans son emploi temporel. Le futur convient au mouvement prophétique du passage en français.
- source_word: לַעֲרֹץ הָאָרֶץ
  choice: pour faire trembler la terre
  rationale: Le verbe ערץ peut évoquer le fait de frapper de terreur ou de faire trembler. « Faire trembler » reste concret, idiomatique et laisse ouverte la dimension physique aussi bien que l’effroi.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, rendu comme nom propre afin de le distinguer d’un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte d’Ésaïe 2 envisage l’abaissement universel de l’humanité devant Yahweh. « La terre » convient à cette portée tout en restant une traduction directe du terme hébreu.
- issue: Nuance de לַעֲרֹץ
  choice: faire trembler la terre
  alternative: terrifier la terre
  rationale: Le verbe permet les deux nuances. Le texte principal retient l’image du tremblement, tandis que la note conserve explicitement la lecture liée à la terreur divine.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve sa forme de proposition infinitive dépendant du verset précédent. Le parallélisme des deux refuges rocheux et la tension entre effroi et tremblement sont maintenus.
