revisions:
- from: Ils entreront dans les grottes des rochers et dans les cavités du sol[a], loin de la terreur de Yahweh et de l’éclat de sa majesté, lorsqu’il se lèvera pour faire trembler la terre.
  to: Ils entreront dans les grottes des rochers et dans les cavités du sol[a], pour échapper à la terreur de Yahweh et à l’éclat de sa majesté, lorsqu’il se lèvera pour terrifier la terre.
  rationale: La révision corrige la relation exprimée par מִפְּנֵי afin de rendre la fuite devant Yahweh plutôt qu’une simple éloignement, et emploie « terrifier » pour refléter plus directement le sens de לַעֲרֹץ. Le reste du texte et l’ancre de note sont conservés.
  reviewer_model: gpt-5.6-terra
