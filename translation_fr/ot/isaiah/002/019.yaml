  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
translation:
  language: fr
  text: Ils entreront dans les grottes des rochers et dans les cavités du sol[a], pour échapper à la terreur de Yahweh et à l’éclat de sa majesté, lorsqu’il se lèvera pour terrifier la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les trous dans la poussière » ou « les terriers dans la poussière ».
    reason: 'Le sens précis de מְחִלּוֹת עָפָר est incertain : l’expression peut désigner divers refuges creusés dans la poussière ou le sol meuble.'
lexical_decisions:
- source_word: וּבָאוּ
  choice: Ils entreront
  rationale: Dans ce contexte prophétique, le parfait coordonné a une valeur future et successive. « Entreront » exprime naturellement le mouvement vers les cachettes introduites par בְּ.
- source_word: בִּמְעָרוֹת צֻרִים
  choice: dans les grottes des rochers
  rationale: מְעָרוֹת désigne des grottes, et צֻרִים des rochers ou escarpements. La formulation conserve l’image concrète sans l’alourdir.
- source_word: וּבִמְחִלּוֹת עָפָר
  choice: dans les cavités du sol
  rationale: מְחִלּוֹת désigne des cavités, trous ou terriers souterrains, tandis que עָפָר signifie littéralement « poussière » et, selon le contexte, le sol meuble. « Cavités du sol » est clair en français; les lectures plus littérales sont signalées en note.
- source_word: מִפְּנֵי
  choice: loin de
  rationale: L’expression signifie littéralement « de devant » ou « loin de la présence de ». Ici, elle décrit la fuite devant la manifestation redoutable de Yahweh.
- source_word: פַּחַד יְהוָה
  choice: la terreur de Yahweh
  rationale: פַּחַד désigne ici la terreur provoquée par le jugement divin, et non la crainte révérencielle. Le nom propre יהוה est translittéré « Yahweh ».
- source_word: וּמֵהֲדַר גְּאוֹנוֹ
  choice: et de l’éclat de sa majesté
  rationale: הָדָר évoque l’éclat ou la splendeur, et גָּאוֹן la majesté ou l’élévation. Cette formulation garde les deux éléments sans redondance excessive.
- source_word: בְּקוּמוֹ
  choice: lorsqu’il se lèvera
  rationale: L’infinitif construit précédé de בְּ exprime ici une circonstance temporelle.
- source_word: לַעֲרֹץ
  choice: pour faire trembler
  rationale: Le verbe peut exprimer l’action de terrifier ou de faire trembler. « Faire trembler » conserve à la fois l’effet physique et la terreur du contexte.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans cette scène de jugement à portée ample, « la terre » convient mieux que le sens local possible « le pays ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre, sans remplacer celui-ci par un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte décrit la manifestation majestueuse de Yahweh et l’abaissement universel de l’orgueil humain; « la terre » conserve cette portée possible sans la réduire à un territoire précis.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le parallélisme poétique et les images concrètes de fuite et de jugement, tout en évitant le calque peu naturel « loin de devant ». Le futur rend la valeur prophétique de la forme verbale hébraïque.
