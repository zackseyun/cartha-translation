review_pass:
  verdict: revise
  source_fidelity: La structure, le futur prophétique, les deux lieux de refuge, la terreur de Yahweh, l’éclat de sa majesté et la portée cosmique de « la terre » sont bien rendus. Toutefois, « loin de » décrit surtout une distance statique et n’exprime pas adéquatement la fuite suscitée par מִפְּנֵי. « Pour échapper à » rend explicitement et naturellement la motivation de l’entrée dans les cachettes. « Terrifier » restitue plus directement la valeur causative de לַעֲרֹץ que « faire trembler ».
  naturalness: La formulation révisée reste fluide en français international moderne. « Pour échapper à » donne une relation logique claire sans calquer l’hébreu. « Terrifier la terre » est idiomatique dans un registre prophétique soutenu mais accessible.
  terminology: « Yahweh » suit le choix de rendu du tétragramme. « Terreur », « éclat » et « majesté » correspondent bien au registre et aux termes hébreux. La note conserve les possibilités « poussière » et « terriers » pour la locution difficile מְחִלּוֹת עָפָר, sans présenter une interprétation confessionnelle comme certaine.
  issues:
  - severity: medium
    issue: « loin de la terreur de Yahweh »
    rationale: Le français « loin de » signifie principalement « à distance de »; il peut affaiblir ou déplacer la relation de fuite devant la présence terrifiante exprimée par מִפְּנֵי. Le contexte des refuges appelle une formulation dynamique telle que « pour échapper à ».
  - severity: low
    issue: « pour faire trembler la terre »
    rationale: Cette expression est possible, mais לַעֲרֹץ porte d’abord l’idée de frapper de terreur. « Pour terrifier la terre » préserve plus nettement cette valeur dans le parallélisme avec « la terreur de Yahweh ».
  revised_text: Ils entreront dans les grottes des rochers et dans les cavités du sol[a], pour échapper à la terreur de Yahweh et à l’éclat de sa majesté, lorsqu’il se lèvera pour terrifier la terre.
  revised_footnotes:
