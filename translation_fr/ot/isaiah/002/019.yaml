    text: Ou « les trous dans la poussière » ou « les terriers dans la poussière ».
    reason: 'Le sens précis de מְחִלּוֹת עָפָר est incertain : l’expression peut désigner divers refuges creusés dans la poussière ou le sol meuble.'
  revision_rationale: La révision corrige la relation exprimée par מִפְּנֵי afin de rendre la fuite devant Yahweh plutôt qu’une simple éloignement, et emploie « terrifier » pour refléter plus directement le sens de לַעֲרֹץ. Le reste du texte et l’ancre de note sont conservés.
