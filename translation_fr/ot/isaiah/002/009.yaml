source:
  edition: WLC
  text: וַ/יִּשַּׁ֥ח אָדָ֖ם וַ/יִּשְׁפַּל אִ֑ישׁ וְ/אַל תִּשָּׂ֖א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/009.yaml
  text: So man is bowed down[a], and each person is brought low; do not forgive them.
translation:
  language: fr
  text: L’être humain se courbe et chacun s’abaisse. Ne leur pardonne pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne les relève pas ». Le verbe hébreu peut signifier « lever, porter, emporter » et, dans certains contextes, « pardonner ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: s’abaisse
  rationale: Le verbe שׁחח décrit le fait de se courber ou de s’abaisser. La forme pronominale française conserve ici la possibilité d’un geste volontaire devant les idoles, tout en exprimant l’abaissement qui domine le contexte.
- source_word: אָדָם
  choice: l’être humain
  rationale: אָדָם désigne ici l’humain de manière générique. « L’être humain » est naturel en français moderne et forme un parallèle avec l’individu désigné ensuite par אִישׁ.
- source_word: וַיִּשְׁפַּל
  choice: s’humilie
  rationale: שׁפל signifie devenir bas, s’abaisser ou être humilié. « S’humilie » rend le parallélisme avec « s’abaisse » et convient au contexte où les humains se prosternent devant leurs propres idoles.
- source_word: אִישׁ
  choice: chacun
  rationale: Dans le parallélisme avec אָדָם, אִישׁ individualise l’affirmation générale. « Chacun » en restitue clairement la portée distributive sans répétition maladroite.
- source_word: וְאַל תִּשָּׂא לָהֶם
  choice: Ne leur pardonne pas
  rationale: Avec un complément personnel introduit par ל, נשׂא peut exprimer le pardon, au sens de porter ou d’enlever la faute. Cette lecture s’accorde à la demande sévère formulée dans ce contexte de jugement, sans éliminer le sens possible de relèvement, signalé en note.
theological_decisions:
- issue: Sens de נשׂא dans la dernière proposition
  choice: Une demande adressée à Dieu de ne pas leur pardonner
  alternative: Une demande de ne pas les relever ou les élever
  rationale: Le sens « pardonner » est bien attesté et convient au jugement contre l’idolâtrie et l’orgueil. Toutefois, le sens fondamental de « lever » reste possible et prolonge directement le contraste avec l’abaissement des deux premières propositions ; la note conserve donc cette tension.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme poétique est conservé par « l’être humain… chacun » et « s’abaisse… s’humilie ». Le point avant l’appel final met en relief le passage de la description à la demande adressée implicitement à Dieu.
