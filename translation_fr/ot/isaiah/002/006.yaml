language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י נָטַ֗שְׁתָּה עַמְּ/ךָ֙ בֵּ֣ית יַעֲקֹ֔ב כִּ֤י מָלְאוּ֙ מִ/קֶּ֔דֶם וְ/עֹֽנְנִ֖ים כַּ/פְּלִשְׁתִּ֑ים וּ/בְ/יַלְדֵ֥י נָכְרִ֖ים יַשְׂפִּֽיקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
translation:
  language: fr
  text: Oui, tu as abandonné ton peuple, la maison de Jacob, car ils sont remplis de pratiques venues de l’Orient[a] ; ils pratiquent la divination comme les Philistins[b] et se lient aux enfants d’étrangers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’Orient ». L’expression elliptique peut désigner des influences ou des pratiques orientales, voire des personnes venues de l’Orient.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils sont devins comme les Philistins ».'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu est rare et son sens incertain. Il peut évoquer le fait de se donner ou de se frapper la main, de conclure des accords, ou plus généralement de s’associer.
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  choice: tu as abandonné
  rationale: Le verbe נטשׁ signifie laisser, délaisser ou abandonner. « Tu as abandonné » rend directement l’accusation adressée à Dieu, sans atténuer sa force.
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  choice: ton peuple, la maison de Jacob
  rationale: 'La construction en apposition est conservée : « la maison de Jacob » précise l’identité de « ton peuple ». Le nom Jacob est maintenu conformément à l’hébreu.'
- source_word: מָלְאוּ מִקֶּדֶם
  choice: ils sont remplis de pratiques venues de l’Orient
  rationale: מָלְאוּ exprime ici un état résultant. L’expression elliptique מִקֶּדֶם, littéralement « de l’Orient », désigne vraisemblablement ce qui en vient ; « pratiques » explicite sobrement le lien avec la divination mentionnée ensuite.
- source_word: עֹנְנִים
  choice: ils pratiquent la divination
  rationale: Le participe renvoie à la divination ou aux présages. Une formulation verbale est claire et naturelle en français moderne.
- source_word: כַּפְּלִשְׁתִּים
  choice: comme les Philistins
  rationale: Cette formulation reproduit simplement la comparaison introduite par כְּ.
- source_word: וּבְיַלְדֵי נָכְרִים
  choice: aux enfants d’étrangers
  rationale: יַלְדֵי désigne des enfants ou descendants, et נָכְרִים des étrangers. La formulation reste proche de l’hébreu sans limiter indûment le groupe aux hommes.
- source_word: יַשְׂפִּיקוּ
  choice: se lient à
  rationale: Le verbe est rare et son sens discuté. « Se lient à » conserve l’idée probable d’association ou d’alliance tout en évitant de présenter comme certaine l’image possible d’un geste de la main.
theological_decisions:
- issue: Nature du compromis de la maison de Jacob avec les peuples et pratiques étrangers
  choice: Le verset dénonce l’adoption de pratiques divinatoires venues de l’Orient et des liens compromettants avec des étrangers.
  alternative: La dernière proposition peut viser plus précisément des accords ou alliances conclus avec des étrangers ; « de l’Orient » peut aussi désigner des personnes orientales plutôt que leurs pratiques.
  rationale: Le contexte porte sur le syncrétisme et les alliances ou associations infidèles, non sur une condamnation ethnique générale. La traduction garde donc l’accent sur les pratiques et les liens, tout en signalant les incertitudes lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue les trois motifs de l’accusation. Les formulations interprétatives rendues nécessaires par les ellipses et le verbe rare sont accompagnées de notes.
