source:
  edition: WLC
  text: חִדְל֤וּ לָ/כֶם֙ מִן הָ֣/אָדָ֔ם אֲשֶׁ֥ר נְשָׁמָ֖ה בְּ/אַפּ֑/וֹ כִּֽי בַ/מֶּ֥ה נֶחְשָׁ֖ב הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/022.yaml
  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: fr
  text: 'Cessez de compter sur l’être humain, dont le souffle est dans les narines : quelle valeur a-t-il vraiment ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car à quoi peut-il être estimé ? »'
    reason: La tournure hébraïque בַמֶּה נֶחְשָׁב הוּא peut porter sur la valeur, l’importance ou la considération accordée à l’être humain.
lexical_decisions:
- source_word: חִדְלוּ לָכֶם מִן־הָאָדָם
  choice: Cessez de compter sur l’être humain
  rationale: Le verbe signifie « cesser, renoncer »; dans ce contexte, « compter sur » exprime naturellement l’appel à ne plus placer sa confiance dans l’être humain. « L’être humain » rend ici הָאָדָם dans son sens collectif et universel.
- source_word: נְשָׁמָה בְּאַפּוֹ
  choice: dont le souffle est dans les narines
  rationale: Cette formulation conserve l’image concrète de l’hébreu et souligne la fragilité mortelle de l’être humain sans ajouter explicitement « seulement » ou « tant que ».
- source_word: כִּי בַמֶּה נֶחְשָׁב הוּא
  choice: quelle valeur a-t-il vraiment ?
  rationale: Cette question française naturelle rend l’idée d’évaluation ou de considération portée par נחשב; « vraiment » fait ressortir la force dépréciative de la question sans en modifier le sens fondamental.
theological_decisions:
- issue: Nature de l’exhortation concernant l’être humain
  choice: « compter sur »
  alternative: « faire cas de » ou « se détourner de »
  rationale: Le contexte de l’oracle condamne la confiance mal placée dans la puissance humaine. La traduction n’affirme pas que l’être humain est sans dignité; elle oppose sa fragilité à la souveraineté de Dieu.
- issue: Portée de la question finale
  choice: Question sur la valeur ou le poids réel de l’être humain comme objet de confiance
  alternative: « À quoi peut-il être estimé ? »
  rationale: L’hébreu permet une formulation plus littérale sur la manière dont l’être humain est « compté » ou « estimé ». Le texte principal privilégie un français clair tout en signalant l’autre lecture en note.
translation_notes:
  register: Français international moderne, direct et digne. L’image hébraïque du souffle dans les narines est conservée; le vocabulaire reste accessible sans effacer la tension entre la dignité humaine implicite et sa fragilité comme fondement de confiance.
