  text: and against all the ships of Tarshish[a], and against all the beautiful craft.
translation:
  language: fr
  text: 'et contre tous les navires de Tarsis,

    et contre tous les beaux ouvrages[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « toutes les belles images » ou « tous les objets précieux ». Le mot hébreu traduit par « ouvrages » est rare et son sens exact demeure incertain. Dans ce contexte, il peut aussi désigner des embarcations ou des objets finement travaillés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: contre / et contre
  rationale: Dans la phrase qui s’étend aux versets 12 à 16, עַל désigne les cibles du jugement du SEIGNEUR. « Contre » rend naturellement cette orientation hostile. La première conjonction peut rester implicite en français au début de l’extrait, tandis que la seconde est exprimée pour conserver le parallélisme.
- source_word: כָּל
  choice: tous les
  rationale: Ce choix rend la portée collective du terme et maintient l’ampleur ainsi que la répétition poétique du jugement.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: les navires de Tarsis
  rationale: La traduction traditionnelle préserve l’expression hébraïque sans décider si elle désigne des navires associés à Tarsis ou, par extension, de grands navires de commerce au long cours.
- source_word: שְׂכִיּוֹת
  choice: vaisseaux
  rationale: Ce nom très rare est de sens incertain. Le parallélisme maritime avec « navires de Tarsis » favorise ici un terme nautique, mais l’incertitude lexicale est signalée en note.
- source_word: הַחֶמְדָּה
  choice: magnifiques
  rationale: Le terme exprime ce qui est désirable, précieux ou plaisant. « Magnifiques » qualifie naturellement des vaisseaux prisés tout en conservant l’idée d’attrait et de valeur.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure en deux membres et la reprise de « tous les » conservent le parallélisme poétique. « Navires » puis « vaisseaux » évite une répétition lourde tout en maintenant l’écho maritime probable.
