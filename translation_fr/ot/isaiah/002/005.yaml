  yaml_path: translation/ot/isaiah/002/005.yaml
  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
translation:
  language: fr
  text: Maison de Jacob[a], venez, et marchons dans la lumière de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ô maison de Jacob ! » L’expression hébraïque s’adresse directement aux descendants de Jacob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  choice: Maison de Jacob
  rationale: Le syntagme construit est employé comme apostrophe aux descendants de Jacob. « Maison de Jacob » conserve l’expression hébraïque et le registre prophétique; la valeur vocative ressort de la ponctuation.
- source_word: לְכוּ
  choice: venez
  rationale: L’impératif pluriel de הלך introduit ici, avec le cohortatif qui suit, une invitation pressante à agir ensemble. « Venez » rend naturellement cette valeur exhortative en français; « allez » demeure possible au sens plus littéral.
- source_word: וְנֵלְכָה
  choice: et marchons
  rationale: Le cohortatif à la première personne du pluriel exprime une exhortation commune. « Marchons » préserve à la fois cette force et la métaphore biblique de la marche comme conduite.
- source_word: בְּאוֹר
  choice: dans la lumière
  rationale: La préposition ב peut marquer la sphère ou le moyen. « Dans la lumière » garde l’image d’une vie placée sous l’éclairage et la direction divins, sans exclure entièrement la nuance instrumentale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la fonction de nom propre et correspond à la translittération retenue, sans le remplacer par « le Seigneur ».
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe prophétique et la métaphore de la marche sont conservées. L’impératif « venez » suivi de « marchons » rend l’appel à une action partagée; la variante plus formelle « allez » n’est pas signalée afin d’éviter une note peu utile en français.
