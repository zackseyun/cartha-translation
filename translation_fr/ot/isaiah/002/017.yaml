source:
  edition: WLC
  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: fr
  text: L’orgueil de l’être humain sera abaissé[a], et la grandeur des hommes sera rabaissée ; Yahweh seul sera élevé en ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La hauteur de l’être humain se courbera, et l’élévation des hommes sera abaissée. » L’hébreu décrit l’orgueil humain au moyen d’images de hauteur.'
    reason: alternative lexicale et conservation de la métaphore hébraïque
lexical_decisions:
- source_word: וְשַׁח
  choice: sera abaissé
  rationale: Le parfait qal a ici une portée future dans le discours prophétique. « Sera abaissé » exprime naturellement le renversement annoncé tout en conservant l’image verticale.
- source_word: גַּבְהוּת
  choice: l’orgueil
  rationale: Le nom évoque littéralement la hauteur et, dans ce contexte, l’arrogance humaine. « Orgueil » est clair en français moderne; la note signale l’image hébraïque de hauteur.
- source_word: הָאָדָם
  choice: de l’être humain
  rationale: אָדָם est ici générique et représente l’humanité. « L’être humain » garde le singulier rhétorique sans donner à tort au propos une portée exclusivement masculine.
- source_word: וְשָׁפֵל
  choice: sera rabaissée
  rationale: Le verbe parallèle décrit l’abaissement de ce qui était élevé. « Rabaissée » maintient l’imagerie spatiale et évite de réduire le sens à un sentiment intérieur d’humiliation.
- source_word: רוּם
  choice: la grandeur
  rationale: Le nom désigne l’élévation ou la hauteur. « Grandeur » est naturel avec « des hommes » et garde l’idée d’un rang humain élevé, tandis que la note explicite l’image sous-jacente.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le pluriel désigne ici les humains et fait pendant au singulier générique précédent. « Des hommes » conserve la forme masculine du texte source dans ce second membre.
- source_word: וְנִשְׂגַּב
  choice: sera élevé
  rationale: Le nifal exprime le fait d’être placé ou reconnu en hauteur. « Sera élevé » reprend volontairement le champ lexical vertical appliqué auparavant aux humains.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: 'L’adverbe marque l’exclusivité : Yahweh, à l’exclusion de toute grandeur humaine, sera élevé.'
- source_word: בַּיּוֹם הַהוּא
  choice: en ce jour-là
  rationale: Formule temporelle prophétique courante, rendue dans un français naturel et solennel.
theological_decisions:
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le nom divin. La translittération préserve ce nom sans lui substituer un titre.
- issue: Portée anthropologique de הָאָדָם / אֲנָשִׁים
  choice: l’être humain ... les hommes
  alternative: l’homme ... les hommes
  rationale: Le premier terme est un singulier générique représentant l’humanité, tandis que le second est morphologiquement pluriel et masculin. Ce rendu conserve la variation du texte tout en rendant clairement la portée universelle du premier membre.
- issue: Rapport entre l’élévation humaine et celle de Yahweh
  choice: Maintien d’un même réseau d’images verticales
  alternative: Traduire les deux premiers termes uniquement par « arrogance » et « fierté »
  rationale: Le verset oppose la hauteur humaine abaissée à Yahweh seul élevé. La traduction et la note préservent cette tension sans transformer l’élévation divine en simple sentiment d’honneur.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, avec une légère variation (« abaissé / rabaissée »). Le point-virgule marque le contraste culminant entre l’abaissement de la grandeur humaine et l’élévation exclusive de Yahweh.
