base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/007.yaml
  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
translation:
  language: fr
  text: Son pays est rempli d’argent et d’or[a], et il n’y a pas de fin à ses trésors ; son pays est rempli de chevaux, et il n’y a pas de fin à ses chars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le singulier tout au long du verset : « son pays… ses trésors… ses chars ». Ce singulier désigne probablement de manière collective la nation ou le peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: est rempli
  rationale: Le verbe מלא exprime ici l’état résultant d’un remplissage. Le présent convient à cette description prophétique et « est rempli » garde la valeur passive ou résultative.
- source_word: אַרְצוֹ
  choice: son pays
  rationale: Le texte porte un suffixe masculin singulier. « Son pays » le préserve tout en laissant le référent collectif se dégager du contexte.
- source_word: כֶּסֶף וְזָהָב
  choice: argent et or
  rationale: Rendu usuel et direct des deux métaux précieux, qui évoquent ensemble l’abondance des richesses.
- source_word: וְאֵין קֵצֶה
  choice: sont sans fin
  rationale: Cette formulation française naturelle rend l’absence de limite exprimée par l’hébreu et maintient le parallélisme des deux propositions.
- source_word: לְאֹצְרֹתָיו
  choice: ses trésors
  rationale: אֹצָר peut désigner un trésor, un dépôt ou un entrepôt. Après « argent et or », « trésors » exprime le plus naturellement les richesses accumulées.
- source_word: סוּסִים
  choice: chevaux
  rationale: Équivalent direct du nom pluriel hébreu.
- source_word: לְמַרְכְּבֹתָיו
  choice: ses chars
  rationale: « Chars » rend le terme sans ajouter explicitement « de guerre », nuance suggérée mais non formulée dans l’hébreu.
theological_decisions:
- issue: Maintien des possessifs singuliers dans une dénonciation collective
  choice: son pays… ses trésors… ses chars
  alternative: leur pays… leurs trésors… leurs chars
  rationale: L’hébreu emploie à chaque fois un suffixe masculin singulier, vraisemblablement avec une valeur collective pour le peuple ou la nation. Le singulier est conservé afin de ne pas lisser cette particularité.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé. « Pays » est plus naturel ici que « terre » pour désigner le territoire national. Une note explicite le singulier collectif sans le résoudre dans le corps du texte.
