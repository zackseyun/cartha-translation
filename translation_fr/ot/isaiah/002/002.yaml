source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
translation:
  language: fr
  text: Dans les temps à venir[a], la montagne de la maison de Yahweh sera fermement établie comme la plus élevée des montagnes[b] ; elle sera élevée au-dessus des collines, et toutes les nations afflueront vers elle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans les derniers jours » ou « À la fin des jours ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la montagne de la maison de Yahweh sera fermement établie au sommet des montagnes ».'
    reason: alternative_reading
  - marker: c
    text: Le verbe hébreu évoque des nations qui « coulent » vers elle comme un fleuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: La formule ouvre une scène prophétique future. En français, le futur simple intégré à la proposition est naturel et évite la tournure plus lourde « il arrivera que ».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Dans les temps à venir
  rationale: Cette expression française conserve la perspective prophétique tout en évitant d'imposer le sens plus strictement eschatologique que pourrait suggérer « dans les derniers jours ».
- source_word: נָכוֹן יִהְיֶה
  choice: sera fermement établie
  rationale: La formulation exprime la stabilité et l'établissement assuré. L'adverbe « fermement » rend explicitement la nuance de solidité portée par נָכוֹן.
- source_word: הַר בֵּית יְהוָה
  choice: la montagne de la maison de Yahweh
  rationale: Cette formulation représente clairement la chaîne construite hébraïque et conserve les deux images, la montagne et la maison.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la donnée hébraïque et à la ligne éditoriale fournie.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: comme la plus élevée des montagnes
  rationale: Dans le parallélisme avec l'élévation au-dessus des collines, la phrase indique vraisemblablement la prééminence. La possibilité spatiale « au sommet des montagnes » est conservée en note.
- source_word: וְנִשָּׂא מִגְּבָעוֹת
  choice: elle dominera les collines
  rationale: Cette formulation française naturelle communique l'élévation comparative et la prééminence, sans alourdir la phrase par deux passifs successifs.
- source_word: וְנָהֲרוּ
  choice: afflueront
  rationale: Le verbe hébreu évoque l'écoulement d'un fleuve. « Affluer » préserve à la fois ce mouvement convergent et son application idiomatique à des nations.
- source_word: אֵלָיו
  choice: vers elle
  rationale: Le pronom renvoie à la montagne, nom féminin en français ; « elle » adapte donc correctement le genre grammatical.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: « Nations » rend le sens collectif général sans introduire la connotation plus interprétative de « païens ».
theological_decisions:
- issue: Portée temporelle de בְּאַחֲרִית הַיָּמִים
  choice: Dans les temps à venir
  alternative: Dans les derniers jours
  rationale: Le choix maintient l'ouverture prophétique de l'hébreu sans fixer à lui seul un schéma précis de la fin des temps. L'autre lecture est signalée en note.
- issue: Nature de l'élévation de la montagne
  choice: comme la plus élevée des montagnes
  alternative: au sommet des montagnes
  rationale: Le parallélisme favorise une lecture de prééminence, mais l'hébreu permet aussi une compréhension spatiale. La note conserve cette ambiguïté réelle.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa translittération le distingue d'un simple titre et suit la politique éditoriale indiquée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la poésie prophétique tout en étant naturelle ; les ambiguïtés temporelle et topographique sont préservées dans les notes.
