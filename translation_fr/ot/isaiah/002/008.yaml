source:
  edition: WLC
  text: וַ/תִּמָּלֵ֥א אַרְצ֖/וֹ אֱלִילִ֑ים לְ/מַעֲשֵׂ֤ה יָדָי/ו֙ יִֽשְׁתַּחֲו֔וּ לַ/אֲשֶׁ֥ר עָשׂ֖וּ אֶצְבְּעֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/008.yaml
  text: And his land is filled with idols; they bow down to the work of their hands[a], to what their fingers have made.
translation:
  language: fr
  text: Son pays[a] est rempli d’idoles ; ils se prosternent devant l’œuvre de leurs mains, devant ce que leurs doigts ont fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son pays ». Le singulier désigne collectivement le peuple ou la nation.'
    reason: Le suffixe hébreu est au masculin singulier, tandis que la suite parle des membres du peuple au pluriel.
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: est rempli
  rationale: Le niphal de מלא exprime ici un état passif. Le présent rend naturellement la description vive de la situation dénoncée par le prophète.
- source_word: אַרְצוֹ
  choice: Son pays
  rationale: Le suffixe masculin singulier est conservé. Il renvoie collectivement au peuple ou à la nation, emploi précisé en note.
- source_word: אֱלִילִים
  choice: idoles
  rationale: « Idoles » est l’équivalent français courant et clair ; le contexte porte déjà la nuance dépréciative du terme hébreu.
- source_word: יִשְׁתַּחֲווּ
  choice: ils se prosternent
  rationale: Le verbe décrit concrètement l’action de s’incliner jusqu’à terre, souvent en signe de culte. « Se prosternent » conserve à la fois l’image physique et sa portée cultuelle.
- source_word: לְמַעֲשֵׂה יָדָיו
  choice: devant l’œuvre de leurs mains
  rationale: La préposition désigne l’objet devant lequel on se prosterne. « L’œuvre de leurs mains » préserve l’expression concrète et l’ironie de l’adoration d’objets fabriqués par les humains eux-mêmes.
- source_word: לַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: devant ce que leurs doigts ont fait
  rationale: Le second membre reprend et précise le premier. Le pluriel français s’accorde naturellement avec « ils » et explicite la valeur collective des suffixes hébreux singuliers, sans ajouter l’idée de « propres » absente du texte.
theological_decisions:
- issue: Portée cultuelle de השתחוה
  choice: ils se prosternent
  alternative: ils adorent
  rationale: La traduction retenue conserve le geste corporel explicitement évoqué par l’hébreu et laisse le contexte manifester qu’il s’agit d’un acte idolâtre, sans remplacer l’image par un terme plus abstrait.
- issue: Alternance entre singulier collectif et pluriel
  choice: Son pays… ils… leurs mains… leurs doigts
  alternative: Leur pays… ils… leurs mains… leurs doigts
  rationale: Le singulier formel de « son pays » est maintenu, tandis que les possessifs liés aux membres du peuple passent au pluriel pour éviter en français une référence individuelle trompeuse. La note signale la valeur collective du singulier.
translation_notes:
  register: Français moderne, international et digne. La ponctuation met en relief le parallélisme. « Se prosternent devant » est naturel en français et conserve l’image concrète du texte hébreu.
