  yaml_path: translation/ot/isaiah/002/015.yaml
  text: and against every high tower[a], and against every fortified wall—
translation:
  language: fr
  text: contre toute haute tour[a] et contre toute muraille fortifiée —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur toute haute tour et sur toute muraille fortifiée ». La préposition hébraïque signifie plus littéralement « sur », mais elle exprime ici l’idée d’un jugement dirigé contre ces ouvrages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: contre
  rationale: Dans la série poétique d’Ésaïe 2.12-16, עַל désigne les réalités visées par le jugement divin. « Contre » en exprime naturellement la force adversative en français.
- source_word: כָּל
  choice: toute
  rationale: Devant des noms singuliers, כָּל a ici une valeur distributive, rendue naturellement par « toute ».
- source_word: מִגְדָּל
  choice: tour
  rationale: Le terme désigne largement une tour, sans imposer la précision plus étroite de « tour de guet ».
- source_word: גָּבֹהַ
  choice: élevée
  rationale: « Élevée » conserve le sens physique de hauteur tout en restant compatible avec le thème plus large de ce qui s’élève dans le chapitre.
- source_word: חוֹמָה
  choice: muraille
  rationale: Dans ce contexte défensif, « muraille » est plus idiomatique et précis que le terme générique « mur ».
- source_word: בְצוּרָה
  choice: fortifiée
  rationale: L’adjectif décrit une muraille rendue forte et sûre à des fins défensives; « fortifiée » restitue clairement cette nuance militaire.
theological_decisions:
- issue: Prolongement implicite du jugement divin dans la liste poétique
  choice: Traduire les expressions répétées avec עַל par « contre » afin d’indiquer que ces réalités sont visées par le jugement.
  alternative: Employer le spatial plus littéral « sur » et laisser le contexte communiquer seul la valeur hostile.
  rationale: Ésaïe 2.12-16 énumère ce que le jour de l’Éternel atteint dans son jugement. « Contre » explicite la valeur contextuelle sans ajouter un nouvel élément théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé par la répétition de « contre toute ». Le tiret final signale la poursuite de l’énumération poétique.
