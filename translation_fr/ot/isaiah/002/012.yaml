id: ISA.2.12
reference: Isaiah 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
translation:
  language: fr
  text: 'Car Yahweh des armées a un jour contre tout ce qui est orgueilleux et hautain, contre tout ce qui s’élève : tout cela sera abaissé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de l’annonce précédente et conserve clairement la valeur explicative du connecteur.
- source_word: יוֹם לַיהוָה
  choice: Yahweh des armées a fixé un jour
  rationale: La proposition nominale hébraïque signifie littéralement qu’un jour est à Yahweh ou pour lui. Cette formulation française exprime naturellement le jour de jugement qui lui appartient, sans expliciter davantage sa nature.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » transcrit le nom divin, tandis que « des armées » rend le sens concret et souverain de צְבָאוֹת dans un français moderne.
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte de jugement, la préposition a une valeur adversative.
- source_word: כָּל גֵּאֶה וָרָם
  choice: tout ce qui est orgueilleux et hautain
  rationale: La tournure garde la portée générale de כָּל et l’association entre l’orgueil et l’image de la hauteur, sans limiter arbitrairement la référence aux seules personnes.
- source_word: כָּל נִשָּׂא
  choice: tout ce qui s’élève
  rationale: Conserve la métaphore verticale de la racine נשׂא et son possible sens figuré d’exaltation.
- source_word: וְשָׁפֵל
  choice: et sera abaissé
  rationale: Rend la forme verbale comme l’issue du jugement annoncé et préserve le contraste entre élévation et abaissement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le Tétragramme; la translittération conserve le nom propre tout en signalant en note la tradition française.
- issue: Rendu du titre יהוה צבאות
  choice: Yahweh des armées
  alternative: Yahweh des puissances / le SEIGNEUR des armées
  rationale: « Armées » garde la dimension concrète des forces placées sous le commandement divin; « puissances » serait plus abstrait et « le SEIGNEUR » remplacerait le nom propre.
- issue: Référent des termes décrivant l’orgueil et l’élévation
  choice: tout ce qui
  alternative: quiconque / tout homme
  rationale: L’hébreu permet une portée générale, et les versets suivants appliquent cette imagerie aussi bien aux réalités élevées qu’à l’orgueil humain. La traduction n’impose donc pas un référent exclusivement personnel.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « tout ce qui » et le contraste « s’élève / sera abaissé » reproduisent la progression rhétorique de l’hébreu.
