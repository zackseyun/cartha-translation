lexical_decisions:
- source_word: וְהָאֱלִילִים
  choice: Et les idoles
  rationale: וְ est rendu par la conjonction simple « Et »; l’article défini est conservé. « Idoles » est le terme français naturel, tandis que la nuance péjorative d’inanité portée par אֱלִילִים reste perceptible dans le contexte prophétique.
- source_word: כָּלִיל
  choice: entièrement
  rationale: Employé adverbialement, le mot exprime ici la totalité et renforce le verbe.
- source_word: יַחֲלֹף
  choice: disparaîtront
  rationale: Le verbe חלף peut signifier passer, s’éloigner ou disparaître. Avec כָּלִיל et les idoles pour sujet, « disparaîtront » exprime naturellement leur élimination totale sans dépasser le sens du texte.
