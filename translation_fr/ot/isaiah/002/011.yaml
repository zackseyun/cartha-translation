id: ISA.2.11
reference: Isaiah 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵינֵ֞י גַּבְה֤וּת אָדָם֙ שָׁפֵ֔ל וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: fr
  text: Les yeux hautains de l’être humain seront abaissés[a], et l’orgueil des humains sera humilié ; Yahweh seul sera élevé en ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le regard orgueilleux de l’être humain sera abaissé ». L’hébreu évoque littéralement l’orgueil humain manifesté par des yeux élevés.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  choice: Les yeux hautains de l’être humain
  rationale: L’expression signifie littéralement « les yeux de l’élévation de l’être humain » et décrit l’orgueil visible dans le regard et l’attitude. « Les yeux hautains » conserve cette image hébraïque tout en restant compréhensible en français actuel.
- source_word: שָׁפֵל
  choice: seront abaissés
  rationale: Le terme exprime l’abaissement. Le futur rend la portée prophétique du contexte, tandis que « abaissés » maintient le contraste vertical avec Yahweh qui sera élevé.
- source_word: וְשַׁח
  choice: sera humilié
  rationale: Le verbe évoque ce qui est courbé, rabaissé ou humilié. « Sera humilié » restitue ici le sens figuré et évite une répétition pesante d’« abaissé ».
- source_word: רוּם אֲנָשִׁים
  choice: l’orgueil des humains
  rationale: רוּם désigne la hauteur ou l’élévation et, dans ce parallélisme, la prétention orgueilleuse des êtres humains. « Orgueil » exprime naturellement ce sens sans effacer le contraste vertical, déjà porté par « abaissés » et « élevé ».
- source_word: וְנִשְׂגַּב
  choice: sera élevé
  rationale: Le verbe signifie être haut, placé hors d’atteinte ou exalté. « Sera élevé » est clair et maintient l’opposition délibérée entre l’abaissement de l’orgueil humain et l’élévation de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, sans lui substituer un titre.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: 'Le mot souligne l’exclusivité : Yahweh, et nul autre, sera élevé.'
- source_word: בַּיּוֹם הַהוּא
  choice: en ce jour-là
  rationale: Cette formule prophétique courante est rendue par une expression française naturelle qui conserve sa solennité.
theological_decisions:
- issue: Portée de אָדָם et אֲנָשִׁים dans l’oracle de jugement
  choice: l’être humain… les humains
  alternative: l’homme… les hommes
  rationale: Les termes opposent l’orgueil humain dans son ensemble à l’élévation exclusive de Yahweh. Cette formulation garde le passage du singulier générique au pluriel sans laisser entendre que seuls les hommes de sexe masculin sont visés.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme ; le rendre par « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Contraste entre l’abaissement humain et l’élévation divine
  choice: abaissés… humilié ; Yahweh seul sera élevé
  alternative: humiliés… abaissé ; Yahweh seul sera exalté
  rationale: Le choix conserve le mouvement vertical du texte et son affirmation que Yahweh seul occupera la position élevée, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme poétique et le contraste vertical de l’hébreu sont conservés ; le point-virgule marque le sommet théologique du verset.
