  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
translation:
  language: fr
  text: En ce jour-là, l’être humain jettera ses idoles d’argent et ses idoles d’or, qu’on lui avait faites pour qu’il se prosterne devant elles, aux animaux fouisseurs[a] et aux chauves-souris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est incertaine; elle désigne probablement des animaux qui creusent ou vivent sous terre. Traduction traditionnelle : « les taupes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, naturelle en français et fidèle au démonstratif hébreu.
- source_word: יַשְׁלִיךְ
  choice: jettera
  rationale: Le hiphil de שלך exprime l’action de lancer ou rejeter; le contexte indique l’abandon méprisant des idoles.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Le singulier générique אָדָם représente ici l’humanité; « l’être humain » conserve le singulier sans suggérer un individu précis ni réserver l’énoncé aux hommes.
- source_word: אֱלִילֵי כַסְפּוֹ וְאֵת אֱלִילֵי זְהָבוֹ
  choice: ses idoles d’argent et ses idoles d’or
  rationale: La répétition de « ses idoles » reproduit l’insistance et la cadence de l’hébreu.
- source_word: אֲשֶׁר עָשׂוּ לוֹ
  choice: qu’on lui avait faites
  rationale: Le pluriel indéfini du verbe peut viser les artisans. Le pronom « on » le rend naturellement, et le plus-que-parfait explicite l’antériorité déjà implicite dans le contexte.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: pour qu’il se prosterne devant elles
  rationale: Conserve le geste physique de prosternation et sa valeur cultuelle sans réduire le terme au seul concept abstrait d’adoration.
- source_word: לַחְפֹּר פֵּרוֹת
  choice: aux animaux fouisseurs
  rationale: L’expression hébraïque est obscure et désigne probablement des créatures qui creusent ou vivent sous terre; une désignation générique évite de présenter « taupes » comme certaine.
- source_word: וְלָעֲטַלֵּפִים
  choice: et aux chauves-souris
  rationale: Équivalent lexical direct et naturel du terme hébreu.
theological_decisions:
- issue: Portée représentative de הָאָדָם
  choice: le singulier générique « l’être humain »
  alternative: « l’homme » ou « les humains »
  rationale: Le singulier hébreu est conservé tout en exprimant clairement la portée générique et représentative du terme.
- issue: Sens cultuel de לְהִשְׁתַּחֲוֺת
  choice: « se prosterner devant »
  alternative: « adorer »
  rationale: La traduction retient à la fois l’acte corporel et son implication cultuelle, sans effacer la nuance concrète du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme prophétique, le singulier représentatif et l’obscurité réelle du nom d’animal, signalée par une note.
