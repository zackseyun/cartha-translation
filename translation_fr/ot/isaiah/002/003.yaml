id: ISA.2.3
reference: Isaiah 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ עַמִּ֣ים רַבִּ֗ים וְ/אָמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
translation:
  language: fr
  text: 'De nombreux peuples viendront et diront[a] : « Venez, montons à la montagne de Yahweh, à la maison du Dieu de Jacob, afin qu’il nous enseigne ses voies et que nous marchions dans ses sentiers. » Car de Sion sortira l’instruction[b], et de Jérusalem la parole de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « iront » ou « marcheront »; le verbe hébreu signifie littéralement « aller, marcher », mais il décrit ici les peuples se dirigeant vers Sion.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu torah peut aussi être traduit par « loi » ou « enseignement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: viendront
  rationale: Le verbe signifie littéralement « aller/marcher », mais le mouvement des peuples converge ici vers Sion; « viendront » exprime naturellement cette perspective en français tout en conservant l’idée de pèlerinage.
- source_word: עַמִּים רַבִּים
  choice: de nombreux peuples
  rationale: « Peuples » conserve la pluralité ethnique et collective de עַמִּים sans imposer le sens politique moderne de « nations ».
- source_word: לְכוּ וְנַעֲלֶה
  choice: Venez, montons
  rationale: L’exhortation collective est rendue avec naturel; « montons » préserve l’ascension géographique et cultuelle vers Jérusalem.
- source_word: הַר יְהוָה
  choice: la montagne de Yahweh
  rationale: הַר désigne la montagne, et le nom divin יהוה est translittéré « Yahweh » afin de représenter explicitement le tétragramme.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: la maison du Dieu de Jacob
  rationale: « Maison » garde l’expression hébraïque et sa résonance théologique, bien qu’elle désigne ici le temple.
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  choice: afin qu’il nous enseigne ses voies
  rationale: La tournure française exprime le but et rend idiomatiquement la construction hébraïque avec מִן, qui signifie ici apprendre quelque chose des voies de Dieu plutôt qu’une origine matérielle.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: et que nous marchions dans ses sentiers
  rationale: « Marcher » préserve la métaphore biblique de la conduite, tandis que « sentiers » rend le parallélisme avec « voies ».
- source_word: תּוֹרָה
  choice: instruction
  rationale: Dans ce contexte prophétique, תּוֹרָה désigne largement l’enseignement divin, et non seulement un corpus légal.
- source_word: תֵּצֵא
  choice: sortira
  rationale: « Sortira » rend directement le mouvement exprimé par יצא depuis Sion vers l’extérieur.
- source_word: וּדְבַר יְהוָה
  choice: et de Jérusalem la parole de Yahweh
  rationale: « Parole de Yahweh » conserve la formule prophétique; l’ellipse du verbe dans le second membre reproduit le parallélisme poétique hébreu de façon naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre et sans privilégier la forme tardive « Jéhovah ».
- issue: Portée de תּוֹרָה dans le contexte prophétique
  choice: instruction
  alternative: loi; enseignement
  rationale: « Instruction » maintient le sens ample de l’enseignement donné par Dieu et évite de réduire le terme à la seule législation, tout en laissant ouverte sa dimension normative.
- issue: Nuance de וְיֹרֵנוּ מִדְּרָכָיו
  choice: afin qu’il nous enseigne ses voies
  alternative: et il nous enseignera quelques-unes de ses voies; afin qu’il nous instruise à partir de ses voies
  rationale: La préposition מִן peut suggérer une valeur partitive ou la source de l’enseignement. L’idiome français naturel « enseigner ses voies » transmet le sens principal sans imposer une précision contestable.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que les métaphores du pèlerinage et de la marche. La ponctuation française et les espaces avant les deux-points sont appliquées.
