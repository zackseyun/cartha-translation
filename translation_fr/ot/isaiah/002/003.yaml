  terminology: « Yahweh » représente explicitement le tétragramme de manière cohérente. « La maison du Dieu de Jacob » préserve l’expression hébraïque sans imposer « temple ». « Instruction » rend adéquatement תּוֹרָה dans son ampleur d’enseignement divin; la note conserve les possibilités « loi » et « enseignement ». « Voies » et « sentiers » maintiennent le parallélisme métaphorique.
