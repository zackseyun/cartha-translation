  text: and against all the high mountains[a], and against all the lofty hills.
translation:
  language: fr
  text: Et contre toutes les hautes montagnes[a], et contre toutes les collines élevées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « les montagnes élevées » et « les collines qui se dressent ».'
    reason: Alternative lexicale reflétant les nuances respectives des deux adjectifs hébreux sans imposer une lecture métaphorique.
lexical_decisions:
- source_word: וְעַל
  choice: et contre
  rationale: Dans cette série d’annonces de jugement, עַל introduit ce que vise l’intervention divine. « Contre » rend mieux cette force que le sens purement spatial « sur ».
- source_word: כָּל
  choice: toutes les
  rationale: Le pluriel français avec « toutes les » exprime naturellement la portée distributive de כָּל dans cette énumération poétique.
- source_word: הֶהָרִים
  choice: montagnes
  rationale: Ce terme désigne des montagnes et demeure distinct de גְּבָעוֹת, rendu par « collines » dans le membre parallèle.
- source_word: הָרָמִים
  choice: hautes
  rationale: Le mot, issu de רום, indique la hauteur. « Hautes montagnes » est naturel en français et conserve d’abord l’image topographique.
- source_word: הַגְּבָעוֹת
  choice: collines
  rationale: « Collines » rend clairement ces reliefs moins imposants et préserve le parallélisme avec les montagnes.
- source_word: הַנִּשָּׂאוֹת
  choice: élevées
  rationale: Le participe passif de נשׂא décrit ce qui est élevé ou dressé. « Élevées » est idiomatique avec « collines » tout en maintenant le motif de ce qui domine en hauteur.
theological_decisions:
- issue: Faut-il faire ressortir explicitement l’orgueil humain dans la description des reliefs ?
  choice: 'Conserver un vocabulaire topographique littéral : « hautes montagnes » et « collines élevées ».'
  alternative: Employer des termes plus interprétatifs, tels que « montagnes altières » et « collines exaltées », afin de souligner l’image de l’orgueil.
  rationale: Le contexte d’Ésaïe 2 associe ce qui est élevé à l’arrogance qui sera abaissée, mais le verset nomme directement des éléments du paysage. La traduction littérale préserve cette image concrète et laisse le contexte porter sa résonance symbolique.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « contre toutes les » conserve le rythme de l’énumération prophétique et son parallélisme.
