source:
  edition: WLC
  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: fr
  text: 'Heureux l’être humain qui agit ainsi,

    celui qui s’y attache fermement :

    il veille à ne pas profaner le sabbat

    et retient sa main de commettre le moindre mal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Désigne ici l’humain dans sa fragilité ou sa condition mortelle; cette formulation inclusive et naturelle évite de réduire le propos au sexe masculin.
- source_word: בֶן־אָדָם
  choice: le fils d’Adam
  rationale: Conserve l’expression hébraïque et son parallélisme avec « l’être humain », tout en faisant entendre l’appartenance à l’humanité issue d’Adam.
- source_word: יַחֲזִיק בָּהּ
  choice: s’y tient fermement
  rationale: Rend l’idée de saisir et de maintenir avec constance ce qui vient d’être énoncé.
- source_word: שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: il veille à ne pas profaner le sabbat
  rationale: Exprime naturellement la garde vigilante du sabbat afin de ne pas le traiter comme profane.
- source_word: שֹׁמֵר יָדוֹ מֵעֲשׂוֹת כָּל־רָע
  choice: garde sa main de faire quelque mal que ce soit
  rationale: Préserve l’image concrète de la main retenue et la portée exhaustive de כָּל־רָע.
theological_decisions:
- issue: Référent de « ceci / s’y »
  choice: Conserver le renvoi implicite par « ainsi » et « s’y »
  alternative: Préciser qu’il s’agit de la justice, du salut ou des observances qui suivent
  rationale: L’hébreu laisse le référent de זֹּאת et du suffixe בָּהּ dépendre du contexte; le préciser dans le corps du verset résoudrait indûment cette ouverture.
- issue: Rapport entre la bénédiction, le sabbat et l’abstention du mal
  choice: Employer les deux-points puis deux propositions descriptives
  alternative: Présenter explicitement ces actes comme la cause méritoire de la bénédiction
  rationale: La syntaxe décrit celui qui agit ainsi sans formuler une doctrine explicite du mérite.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est maintenu sur quatre lignes. « Fils d’Adam » est volontairement plus formel que « être humain » afin de conserver la variation lexicale de l’hébreu sans faire de l’expression un titre christologique.
