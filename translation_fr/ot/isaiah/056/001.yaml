  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שִׁמְר֥וּ מִשְׁפָּ֖ט וַ/עֲשׂ֣וּ צְדָקָ֑ה כִּֽי קְרוֹבָ֤ה יְשֽׁוּעָתִ/י֙ לָ/ב֔וֹא וְ/צִדְקָתִ֖/י לְ/הִגָּלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « Respectez le droit et pratiquez la justice,


    car mon salut[a] est proche d’arriver,


    et ma justice[b] de se révéler. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma délivrance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon action juste » ou « mon intervention qui rend justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française, naturelle et solennelle, restitue l’introduction traditionnelle d’une déclaration prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre afin de représenter directement le tétragramme du texte hébreu.
- source_word: שִׁמְרוּ מִשְׁפָּט
  choice: Respectez le droit
  rationale: שׁמר exprime ici l’observance attentive, tandis que מִשְׁפָּט désigne l’ordre juste ou le droit. Cette formulation est idiomatique en français et reste distincte de צְדָקָה.
- source_word: וַעֲשׂוּ צְדָקָה
  choice: et pratiquez la justice
  rationale: Le verbe עשה signifie littéralement « faire » ; avec un nom abstrait, « pratiquer » est plus naturel en français. « Justice » conserve la portée morale et théologique de צְדָקָה.
- source_word: כִּי קְרוֹבָה יְשׁוּעָתִי לָבוֹא
  choice: car mon salut est sur le point d’arriver
  rationale: La formulation exprime naturellement en français l’imminence indiquée par קְרוֹבָה et l’infinitif לָבוֹא, sans affaiblir le lien causal introduit par כִּי.
- source_word: וְצִדְקָתִי לְהִגָּלוֹת
  choice: et ma justice de se révéler
  rationale: « Justice » garde la largeur sémantique de צְדָקָה appliqué à Dieu, et « se révéler » rend le nifal de גלה. L’ellipse de « est sur le point » reproduit le parallélisme compact de l’hébreu.
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le représente comme le nom personnel de Dieu plutôt que de lui substituer un titre.
- issue: Rapport entre מִשְׁפָּט et צְדָקָה
  choice: le droit / la justice
  alternative: la justice / ce qui est juste
  rationale: Deux expressions françaises distinctes évitent de confondre les deux termes hébreux tout en maintenant leur étroit parallélisme éthique.
- issue: Sens de צִדְקָתִי appliqué à Dieu
  choice: ma justice
  alternative: mon action juste ; ma réhabilitation
  rationale: « Ma justice » préserve l’ambiguïté entre la qualité juste de Dieu, son action conforme au droit et son intervention qui rend justice, sans imposer une lecture exclusivement morale ou judiciaire.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme poétique est conservé sur quatre lignes. « Ainsi parle » maintient le ton prophétique sans archaïsme excessif ; « respectez » et « pratiquez » rendent les impératifs pluriels de manière naturelle.
