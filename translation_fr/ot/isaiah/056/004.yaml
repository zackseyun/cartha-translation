source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: fr
  text: 'Car ainsi parle le SEIGNEUR aux eunuques qui observent mes sabbats, qui choisissent ce qui me plaît et qui restent attachés à mon alliance :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reçue, en petites capitales.
- source_word: לַסָּרִיסִים
  choice: aux eunuques
  rationale: Traduction directe du terme désignant ici des hommes castrés, en accord avec le contexte de 56.3-5.
- source_word: יִשְׁמְרוּ אֶת שַׁבְּתוֹתַי
  choice: qui observent mes sabbats
  rationale: « Observer » exprime naturellement le fait de garder et respecter les sabbats.
- source_word: וּבָחֲרוּ בַּאֲשֶׁר חָפָצְתִּי
  choice: qui choisissent ce qui me plaît
  rationale: Conserve le parallélisme des relatives et le sens du bon plaisir divin sans surinterprétation.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: qui restent attachés à mon alliance
  rationale: Exprime l'idée de saisir fermement et de ne pas abandonner l'alliance dans un français courant et digne.
theological_decisions:
- issue: Portée des trois qualifications appliquées aux eunuques
  choice: Répéter « qui » devant chacun des trois membres
  alternative: 'Coordonner simplement : « qui observent…, choisissent… et restent attachés… »'
  rationale: La répétition rend clairement les trois caractéristiques parallèles, sans modifier leur portée théologique.
- issue: Expression de l'attachement à l'alliance
  choice: « restent attachés à mon alliance »
  alternative: « tiennent fermement à mon alliance »
  rationale: Le choix maintient l'idée de fidélité persévérante contenue dans le participe hébreu, sans suggérer une doctrine particulière.
translation_notes:
  register: Français moderne international, clair et digne. La tournure introductive solennelle « Car voici ce que dit le SEIGNEUR » convient au contexte prophétique; les termes « eunuques », « sabbats » et « alliance » sont conservés pour leur précision biblique.
