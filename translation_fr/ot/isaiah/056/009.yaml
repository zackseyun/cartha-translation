  text: כֹּ֖ל חַיְת֣וֹ שָׂדָ֑י אֵתָ֕יוּ לֶ/אֱכֹ֥ל כָּל חַיְת֖וֹ בַּ/יָּֽעַר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/009.yaml
  text: All you beasts of the field[b][a], come to devour— all you beasts of the forest.
translation:
  language: fr
  text: Vous tous, animaux des champs[b], venez dévorer[a], vous tous, animaux qui êtes dans la forêt !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « manger » ou « consumer ». Le verbe hébreu est le verbe courant signifiant « manger » ; « dévorer » fait ressortir la force prédatrice du contexte.
    reason: lexical_alternative
  - marker: b
    text: Cet appel aux animaux évoque probablement un jugement à venir ; certains comprennent ces animaux comme une image d’ennemis envahisseurs.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל
  choice: vous tous / tous
  rationale: Le quantificateur englobe collectivement tous les animaux interpellés; la reprise française « vous tous » rend clairement l’adresse directe.
- source_word: חַיְתוֹ
  choice: animaux
  rationale: Dans les expressions avec « champs » et « forêt », le terme désigne des animaux sauvages. « Animaux » est naturel en français moderne, tandis que le contexte prédateur en précise la nature.
- source_word: שָׂדָי
  choice: des champs
  rationale: Cette forme de שׂדה désigne l’espace ouvert ou la campagne, ici en contraste avec la forêt. « Des champs » conserve le parallélisme traditionnel et reste immédiatement compréhensible.
- source_word: אֵתָיוּ
  choice: venez
  rationale: L’impératif pluriel convoque directement les animaux; « venez » en restitue simplement la force.
- source_word: לֶאֱכֹל
  choice: dévorer
  rationale: Le verbe signifie couramment « manger », mais l’appel adressé à des animaux sauvages dans une scène de jugement justifie « dévorer », qui exprime la force prédatrice sans supprimer l’alternative littérale.
- source_word: בַּיָּעַר
  choice: de la forêt
  rationale: Bien que le préfixe soit normalement locatif (« dans la forêt »), l’expression désigne ici les animaux qui appartiennent au milieu forestier. « Animaux de la forêt » est idiomatique et maintient le parallélisme avec « animaux des champs ».
theological_decisions:
- issue: Image prophétique des animaux convoqués
  choice: Conserver dans le texte l’interpellation littérale des animaux sauvages comme image d’un jugement imminent.
  alternative: Comprendre directement les animaux comme une métaphore des nations ennemies ou des envahisseurs.
  rationale: L’hébreu s’adresse explicitement aux animaux et les invite à manger. La traduction préserve cette image concrète sans imposer son identification métaphorique; la note signale l’interprétation possible.
translation_notes:
  register: Français international moderne, direct et solennel. La répétition de « vous tous, animaux » conserve le parallélisme et la vigueur de la convocation prophétique. Les marqueurs sont placés immédiatement après les éléments auxquels ils se rapportent.
