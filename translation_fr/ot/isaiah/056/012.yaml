  text: אֵתָ֥יוּ אֶקְחָה יַ֖יִן וְ/נִסְבְּאָ֣ה שֵׁכָ֑ר וְ/הָיָ֤ה כָ/זֶה֙ י֣וֹם מָחָ֔ר גָּד֖וֹל יֶ֥תֶר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
translation:
  language: fr
  text: « Venez ! Je vais chercher du vin, et buvons à satiété de la boisson enivrante[a] ! Demain sera comme aujourd’hui, en bien plus grand[b] ! »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et buvons tout notre soûl de boisson enivrante ». Le verbe hébreu évoque le fait de boire jusqu’à satiété ; dans ce contexte, il suggère un excès pouvant aller jusqu’à l’ivresse.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Demain sera comme aujourd’hui, grand, beaucoup plus encore ». La formule hébraïque intensifie la vantardise : le lendemain est annoncé comme étant bien plus grand encore.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵתָיוּ
  choice: Venez !
  rationale: Interjection adressée à plusieurs personnes, qui introduit naturellement l’invitation présomptueuse des locuteurs.
- source_word: אֶקְחָה
  choice: Je vais chercher
  rationale: La forme volitive à la première personne exprime ici l’intention du locuteur. Cette tournure française est plus naturelle que « que je prenne » tout en conservant l’idée d’aller se procurer le vin.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent courant et direct du terme hébreu.
- source_word: וְנִסְבְּאָה
  choice: et buvons à satiété
  rationale: Le verbe désigne le fait de se rassasier ou de boire tout son soûl; le contexte implique l’excès sans imposer lexicalement la traduction « enivrons-nous ».
- source_word: שֵׁכָר
  choice: boisson enivrante
  rationale: Désigne une boisson alcoolisée distincte du vin. « Boisson enivrante » reste générique et évite de préciser sans preuve « bière » ou un alcool distillé anachronique.
- source_word: וְהָיָה כָזֶה יוֹם מָחָר
  choice: Demain sera comme aujourd’hui
  rationale: Rend en français naturel la comparaison entre le lendemain attendu et le jour présent.
- source_word: גָּדוֹל יֶתֶר מְאֹד
  choice: et même bien meilleur, infiniment meilleur
  rationale: 'La formule finale intensifie la vantardise: le lendemain ne sera pas seulement semblable au présent, mais le surpassera largement. « Meilleur » explicite naturellement la valeur positive de גָּדוֹל dans ce contexte d’abondance espérée.'
theological_decisions: []
translation_notes:
  register: Français international actuel, direct et digne. Les exclamations conservent le ton insouciant et fanfaron des paroles rapportées. « Boisson enivrante » est préféré à « liqueur forte », vieilli, et à « alcool fort », qui évoquerait à tort une boisson distillée.
