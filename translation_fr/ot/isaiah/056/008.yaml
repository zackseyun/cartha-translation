revisions:
- from: 'Déclaration du Seigneur Yahweh, lui qui rassemble les bannis d’Israël : « J’en rassemblerai encore d’autres auprès de lui, en plus de ceux qui sont déjà rassemblés auprès de lui.[a] »'
  to: 'Oracle du Seigneur Yahweh, qui rassemble les exilés d’Israël : « Je rassemblerai encore d’autres à lui, en plus de ceux qui lui sont déjà rassemblés.[a] »'
  rationale: La révision améliore l’idiomaticité française et réduit l’interprétation spatiale de la préposition hébraïque, tout en préservant les suffixes singuliers et l’ambiguïté de leur référent. Elle conserve la structure solennelle de l’oracle, le nom Yahweh et l’idée de personnes exilées rassemblées en supplément de celles déjà rassemblées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:02:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le rendu du nom divin (« le Seigneur Yahweh »), de « bannis » et de la promesse d’un rassemblement supplémentaire est globalement fidèle. Toutefois, « J’en rassemblerai encore d’autres auprès de lui » est maladroit : le pronom « en » est inutilement ambigu et « auprès de lui » impose une nuance spatiale que l’hébreu ne définit pas. La construction finale doit aussi mieux conserver la relation entre le singulier collectif et « ses rassemblés », sans prétendre identifier définitivement le référent.'
  naturalness: « Déclaration du Seigneur Yahweh, lui qui… » est intelligible, mais « Oracle du Seigneur Yahweh, qui… » est plus idiomatique dans un registre prophétique moderne et solennel. La révision évite également l’enchaînement lourd et ambigu de « J’en rassemblerai encore d’autres auprès de lui ».
  terminology: « Yahweh » convient à יהוה conformément à l’orientation fournie. « Seigneur » rend adéquatement אֲדֹנָי. « Exilés » exprime plus naturellement en français actuel les personnes repoussées ou dispersées que « bannis », sans exclure la dimension d’expulsion. Les suffixes masculins singuliers sont maintenus dans le texte et la note signale sobrement l’interprétation collective plurielle possible.
  issues:
  - severity: medium
    issue: Formulation pronominale et spatiale ambiguë
    rationale: « J’en rassemblerai encore d’autres auprès de lui » ne donne pas un antécédent immédiatement clair à « en » et traduit de façon trop déterminée par une proximité spatiale une construction hébraïque difficile (עָלָיו). Une formulation avec « Je rassemblerai encore d’autres à lui » conserve plus directement le rattachement au singulier collectif.
  - severity: low
    issue: Rendu de לְנִקְבָּצָיו
    rationale: « Ceux qui sont déjà rassemblés auprès de lui » rend les rassemblés comme s’ils étaient localisés auprès de lui, alors que le suffixe de נִקְבָּצָיו est d’abord possessif (« ses rassemblés »). « Ceux qui lui sont déjà rassemblés » conserve cette relation tout en gardant la syntaxe française lisible.
  revised_text: 'Oracle du Seigneur Yahweh, qui rassemble les exilés d’Israël : « Je rassemblerai encore d’autres à lui, en plus de ceux qui lui sont déjà rassemblés.[a] »'
  revised_footnotes:
  - marker: a
    text: 'Ou : « Je rassemblerai encore d’autres à eux, en plus de ceux qui leur sont déjà rassemblés. » Les suffixes hébreux sont au singulier, mais certains les comprennent avec un référent collectif et les rendent au pluriel.'
    reason: alternative_reading
  revision_rationale: La révision améliore l’idiomaticité française et réduit l’interprétation spatiale de la préposition hébraïque, tout en préservant les suffixes singuliers et l’ambiguïté de leur référent. Elle conserve la structure solennelle de l’oracle, le nom Yahweh et l’idée de personnes exilées rassemblées en supplément de celles déjà rassemblées.
