source:
  edition: WLC
  text: נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה מְקַבֵּ֖ץ נִדְחֵ֣י יִשְׂרָאֵ֑ל ע֛וֹד אֲקַבֵּ֥ץ עָלָ֖י/ו לְ/נִקְבָּצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
translation:
  language: fr
  text: 'Oracle du Seigneur Yahweh, qui rassemble les exilés d’Israël : « Je rassemblerai encore d’autres à lui, en plus de ceux qui lui sont déjà rassemblés.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je rassemblerai encore d’autres à eux, en plus de ceux qui leur sont déjà rassemblés. » Les suffixes hébreux sont au singulier, mais certains les comprennent avec un référent collectif et les rendent au pluriel.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: Déclaration de
  rationale: Le nom introduit solennellement une parole divine. « Déclaration de » conserve sa forme nominale tout en restant naturel en français.
- source_word: אֲדֹנָי יְהוָה
  choice: le Seigneur Yahweh
  rationale: Le titre associe אֲדֹנָי, « Seigneur », au nom divin יהוה. « Yahweh » conserve explicitement le nom propre plutôt que de produire l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: מְקַבֵּץ
  choice: lui qui rassemble
  rationale: Le participe caractérise Yahweh comme celui qui rassemble. La tournure avec « lui qui » rattache clairement cette fonction au sujet divin.
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: les bannis d’Israël
  rationale: Le terme désigne des personnes chassées ou dispersées. « Bannis » garde l’idée d’un éloignement subi, plus nettement que « dispersés ».
- source_word: עוֹד אֲקַבֵּץ
  choice: J’en rassemblerai encore d’autres
  rationale: L’imparfait hébreu exprime ici une promesse future, et עוֹד indique un rassemblement supplémentaire. « D’autres » explicite en français l’objet sous-entendu sans en préciser l’identité.
- source_word: עָלָיו
  choice: auprès de lui
  rationale: La préposition עַל avec le suffixe masculin singulier exprime ici le rattachement au référent collectif, vraisemblablement Israël. « Auprès de lui » préserve le singulier et convient au mouvement de rassemblement.
- source_word: לְנִקְבָּצָיו
  choice: en plus de ceux qui sont déjà rassemblés auprès de lui
  rationale: La formulation rend la valeur additive de לְ, l’état résultant du participe passif et le suffixe masculin singulier, tout en produisant une phrase française claire.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוָה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU ; le Souverain Seigneur
  rationale: Le texte contient explicitement le tétragramme. Employer « Yahweh » maintient le nom d’alliance et évite de transformer les deux éléments hébreux en une paraphrase interprétative.
- issue: Référent des suffixes singuliers de עָלָיו et נִקְבָּצָיו
  choice: Référence collective singulière, rendue par « lui »
  alternative: Référence plurielle rendue par « eux » ; référence à Sion ou au pays
  rationale: Les suffixes hébreux sont masculins singuliers. Le texte principal conserve cette donnée et sa tension interprétative, tandis que la note signale la lecture collective au pluriel.
translation_notes:
  register: Français international actuel, solennel sans archaïsme. « Déclaration » maintient la formule prophétique nominale ; « bannis » garde la force de l’exil ou de l’expulsion. Les guillemets distinguent clairement la parole divine introduite par la formule.
