source:
  edition: WLC
  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
translation:
  language: fr
  text: 'Les chiens ont un appétit vorace[a] : ils ne connaissent pas la satiété. Et eux, ce sont des bergers qui ne savent pas discerner[b]. Tous se sont tournés vers leur propre chemin, chacun vers son propre profit, tous sans exception[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont insatiables »; littéralement « puissants/féroces d’appétit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne savent pas comprendre » ou « sont dépourvus d’intelligence ».
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque est difficile. On peut aussi comprendre « de tous côtés »; elle semble ici souligner que leur corruption s’étend à tous.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּלָבִים
  choice: les chiens
  rationale: Conserve la métaphore concrète de l’hébreu, sans la remplacer par une désignation interprétative des dirigeants ou des sentinelles.
- source_word: עַזֵּי נֶפֶשׁ
  choice: ont un appétit vorace
  rationale: L’expression associe l’idée de force ou d’ardeur à נֶפֶשׁ, qui désigne ici l’appétit ou le désir. Cette formulation française exprime naturellement leur avidité tout en gardant l’image de l’appétit.
- source_word: לֹא יָדְעוּ שָׂבְעָה
  choice: ils ne connaissent pas la satiété
  rationale: Rend de près la construction hébraïque avec « connaître » et le nom désignant le rassasiement, dans un français soutenu mais clair.
- source_word: רֹעִים
  choice: bergers
  rationale: Maintient la métaphore pastorale employée pour les responsables, sans introduire le terme ecclésiastique plus étroit de « pasteurs ».
- source_word: לֹא יָדְעוּ הָבִין
  choice: qui ne savent pas discerner
  rationale: Préserve le verbe « savoir/connaître » répété dans l’hébreu, tandis que « discerner » rend la capacité de compréhension avisée suggérée par הֵבִין.
- source_word: כֻּלָּם לְדַרְכָּם פָּנוּ
  choice: Tous se sont tournés vers leur propre chemin
  rationale: Conserve à la fois l’accusation collective, le mouvement exprimé par le verbe et la métaphore morale du chemin.
- source_word: אִישׁ לְבִצְעוֹ
  choice: chacun vers son propre profit
  rationale: אִישׁ a ici une valeur distributive, rendue par « chacun ». בֶּצַע désigne le gain recherché avec avidité; « profit » laisse le contexte porter la condamnation morale sans ajouter explicitement « injuste ».
- source_word: מִקָּצֵהוּ
  choice: tous sans exception
  rationale: La formule hébraïque est difficile. Dans ce contexte, elle semble étendre l’accusation à l’ensemble du groupe; une note conserve la possibilité d’une lecture plus spatiale.
theological_decisions:
- issue: Identification métaphorique des « chiens » et des « bergers »
  choice: Conserver les deux métaphores dans le texte principal.
  alternative: Remplacer les images par « dirigeants », « sentinelles » ou « responsables ».
  rationale: Le texte hébreu superpose ces images pour dénoncer les responsables. Les conserver évite de limiter leur référent à une institution particulière et respecte la force rhétorique du passage.
- issue: Portée morale de בֶּצַע
  choice: Traduire par « profit » et laisser le contexte exprimer l’avidité condamnée.
  alternative: « profit injuste » ou « gain malhonnête ».
  rationale: Le mot peut porter une connotation répréhensible, mais l’adjectif « injuste » n’est pas exprimé séparément ici. La formulation retenue préserve cette nuance sans rendre explicite plus que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme fondé sur « connaître/savoir » est maintenu, ainsi que les métaphores concrètes des chiens, des bergers et du chemin. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal et suivent leur ordre d’apparition.
