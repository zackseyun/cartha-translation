  text: וְ/נָתַתִּ֨י לָ/הֶ֜ם בְּ/בֵיתִ֤/י וּ/בְ/חֽוֹמֹתַ/י֙ יָ֣ד וָ/שֵׁ֔ם ט֖וֹב מִ/בָּנִ֣ים וּ/מִ/בָּנ֑וֹת שֵׁ֤ם עוֹלָם֙ אֶתֶּן ל֔/וֹ אֲשֶׁ֖ר לֹ֥א יִכָּרֵֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
translation:
  language: fr
  text: Je leur donnerai, dans ma maison et à l’intérieur de mes murs, un monument[a] et un nom meilleurs que des fils et des filles. Je lui[b] donnerai un nom éternel, qui ne sera jamais retranché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un mémorial ». Littéralement en hébreu : « une main et un nom ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe ici du pluriel (« leur ») au singulier (« lui »), ce qui peut individualiser la promesse au sein du groupe.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je donnerai
  rationale: Le verbe נתן signifie couramment « donner »; ce choix simple conserve aussi sa répétition dans le verset.
- source_word: לָהֶם
  choice: leur
  rationale: Le pronom est pluriel et renvoie au groupe évoqué dans le contexte précédent.
- source_word: בְּבֵיתִי
  choice: dans ma maison
  rationale: « Maison » préserve l’expression hébraïque sans la préciser interprétativement comme « temple » dans le texte principal.
- source_word: וּבְחֹמֹתַי
  choice: et à l’intérieur de mes murs
  rationale: Cette formulation française naturelle exprime une place au sein de l’enceinte sacrée.
- source_word: יָד וָשֵׁם
  choice: un monument et un nom
  rationale: Littéralement « une main et un nom », l’expression désigne ici un mémorial concret et une renommée durable; « monument » en communique clairement la force commémorative.
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  choice: qui vaudront mieux que des fils et des filles
  rationale: La comparaison affirme que le monument et le nom ont une valeur supérieure à celle d’une descendance; « fils et filles » conserve les deux termes hébreux.
- source_word: שֵׁם עוֹלָם
  choice: un nom éternel
  rationale: עוֹלָם exprime ici une durée sans fin; « éternel » est naturel, digne et précis en français.
- source_word: אֶתֶּן לוֹ
  choice: Je lui donnerai
  rationale: Le texte massorétique passe délibérément du pluriel לָהֶם au singulier לוֹ; la traduction conserve ce changement de nombre.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: qui ne sera jamais retranché
  rationale: Le niphal de כרת signifie « être retranché ». Ce choix garde l’image de la coupure et son écho possible à la disparition d’une lignée.
theological_decisions:
- issue: Sens idiomatique de יָד וָשֵׁם
  choice: un monument et un nom
  alternative: un mémorial et un nom; une main et un nom
  rationale: « Une main » serait opaque en français. « Monument » conserve le caractère concret d’un signe commémoratif, tandis que « nom » préserve l’idée d’honneur et de mémoire durables.
- issue: Passage du pluriel לָהֶם au singulier לוֹ
  choice: conserver « leur » puis « lui »
  alternative: harmoniser au pluriel; expliciter « à chacun d’eux »
  rationale: Le changement de nombre appartient au texte hébreu et peut individualiser la promesse faite au groupe. Le conserver évite de résoudre silencieusement une tension réelle du texte.
- issue: Image de la descendance interrompue dans לֹא יִכָּרֵת
  choice: ne sera jamais retranché
  alternative: ne disparaîtra jamais; ne sera jamais supprimé
  rationale: « Retranché » garde la métaphore hébraïque de la coupure, particulièrement significative dans une promesse adressée à ceux qui ne peuvent laisser de descendance.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde « maison », « fils et filles » et « retranché » pour préserver les images du texte hébreu, tout en rendant intelligible l’expression idiomatique « une main et un nom ».
