  variant: modern international French
source:
  edition: WLC
  text: צפו עִוְרִ֤ים כֻּלָּ/ם֙ לֹ֣א יָדָ֔עוּ כֻּלָּ/ם֙ כְּלָבִ֣ים אִלְּמִ֔ים לֹ֥א יוּכְל֖וּ לִ/נְבֹּ֑חַ הֹזִים֙ שֹֽׁכְבִ֔ים אֹהֲבֵ֖י לָ/נֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
translation:
  language: fr
  text: Ses guetteurs sont tous aveugles, ils ne savent rien. Ce sont tous des chiens muets, incapables d’aboyer. Ils rêvent[a], restent couchés et aiment sommeiller.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marmonnent ». Le terme hébreu est rare et son sens est incertain dans ce contexte. Le texte principal retient « rêvent », qui s’accorde avec les images de sommeil qui suivent.
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  choice: Ses guetteurs
  rationale: Le terme désigne ceux qui sont chargés de veiller. « Guetteurs » conserve l’image concrète et convient au contexte prophétique; le possessif traditionnellement compris dans la forme défective est rendu par « ses ».
- source_word: עִוְרִים כֻּלָּם
  choice: sont tous aveugles
  rationale: La traduction garde l’image littérale de la cécité, employée ici pour dénoncer le manque de discernement.
- source_word: לֹא יָדָעוּ
  choice: ils ne savent rien
  rationale: Cette formulation française naturelle exprime avec force l’absence de connaissance ou de discernement sans préciser davantage l’objet implicite.
- source_word: כְּלָבִים אִלְּמִים
  choice: des chiens muets
  rationale: La formulation conserve l’image polémique et concrète du texte hébreu. « Muets » exprime clairement leur incapacité à donner l’alarme.
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  choice: incapables d’aboyer
  rationale: Rend directement l’incapacité exprimée en hébreu tout en préservant la métaphore canine.
- source_word: הֹזִים
  choice: Ils rêvent
  rationale: Le terme rare est difficile. Le sens de « rêver » s’accorde le mieux avec les images voisines de gens couchés et aimant sommeiller, tout en restant signalé par une note.
- source_word: שֹׁכְבִים
  choice: restent couchés
  rationale: Rend le participe par une expression idiomatique qui maintient l’image d’inertie prolongée.
- source_word: אֹהֲבֵי לָנוּם
  choice: aiment sommeiller
  rationale: « Sommeiller » restitue la nuance de torpeur ou d’assoupissement et garde un registre prophétique digne.
