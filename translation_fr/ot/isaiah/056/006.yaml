id: ISA.56.6
reference: Isaiah 56:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
translation:
  language: fr
  text: Et les étrangers[a] qui s’attachent à Yahweh pour le servir, pour aimer le nom de Yahweh et pour être ses serviteurs[b] — tous ceux qui observent le sabbat sans le profaner et qui s’attachent fermement à mon alliance —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’étranger ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses esclaves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  choice: Et les étrangers
  rationale: Littéralement « les fils de l’étranger ». En français actuel, « les étrangers » exprime naturellement la valeur collective de l’expression hébraïque sans laisser entendre qu’il s’agit seulement des descendants masculins d’un étranger; la forme littérale est signalée en note.
- source_word: הַנִּלְוִים עַל יְהוָה
  choice: qui s’attachent à Yahweh
  rationale: Le participe niphal de לוה exprime ici un attachement volontaire et une appartenance; « s’attachent à » conserve cette nuance relationnelle et covenantale.
- source_word: לְשָׁרְתוֹ
  choice: pour le servir
  rationale: שרת peut désigner un service cultuel ou ministériel. « Le servir » est naturel en français et, dans ce contexte où Yahweh est l’objet du service, garde la portée religieuse du terme.
- source_word: וּלְאַהֲבָה אֶת שֵׁם יְהוָה
  choice: pour aimer le nom de Yahweh
  rationale: La mention explicite du « nom » est conservée afin de respecter sa portée relationnelle et révérencielle.
- source_word: לִהְיוֹת לוֹ לַעֲבָדִים
  choice: pour être ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs ou des esclaves. Ici, l’accent porte sur le service volontaire et l’appartenance à Yahweh; « serviteurs » convient au contexte, tandis que l’autre valeur lexicale est indiquée en note.
- source_word: כָּל שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: tous ceux qui observent le sabbat sans le profaner
  rationale: כָּל suivi du participe singulier a une portée distributive. Le pluriel français est naturel dans l’apposition au groupe déjà pluriel. « Sans le profaner » rend clairement l’idée de le garder de toute profanation.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: et qui s’attachent fermement à mon alliance
  rationale: Le participe de חזק exprime le fait de saisir ou de tenir avec fermeté. Cette formulation française restitue la persévérance dans l’attachement à l’alliance sans recourir à un calque maladroit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la politique du projet.
theological_decisions:
- issue: Inclusion des étrangers dans l’alliance
  choice: Rendre וּבְנֵי הַנֵּכָר par « les étrangers », tout en conservant tous les verbes de leur attachement, de leur amour, de leur service et de leur fidélité à l’alliance.
  alternative: « les fils de l’étranger »
  rationale: Le français collectif évite de limiter indûment le groupe aux hommes ou aux descendants, tandis que la note préserve l’image hébraïque. Aucun développement théologique postérieur n’est ajouté.
- issue: Portée de עֲבָדִים
  choice: serviteurs
  alternative: esclaves
  rationale: Les deux valeurs sont lexicalement possibles. Dans cette série décrivant l’attachement et le service de Yahweh, « serviteurs » rend mieux l’accent contextuel, sans effacer l’autre possibilité, donnée en note.
- issue: Relation entre l’observance du sabbat et l’alliance
  choice: Conserver les deux éléments coordonnés sans préciser davantage leur rapport théologique.
  alternative: Interpréter explicitement l’observance du sabbat comme condition d’admission ou comme simple signe de l’alliance.
  rationale: Le texte les juxtapose comme caractéristiques des étrangers attachés à Yahweh; la traduction ne tranche pas au-delà de cette formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par un tiret final parce que sa construction se poursuit au verset suivant. Le premier tiret met en relief l’apposition distributive « tous ceux… » sans résoudre artificiellement la syntaxe hébraïque.
