    issue: « Regardez » pour הֵן
    rationale: L’hébreu הֵן est ici une particule d’ostension ou d’affirmation, employée par l’eunuque au sujet de lui-même. « Regardez » est un impératif adressé à plusieurs personnes et ajoute un élément qui n’est pas dans le texte. « Voici » préserve la fonction déictique sans ajouter de destinataire.
