base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: fr
  text: 'Que l’étranger qui s’est attaché à l’Éternel ne dise pas : « L’Éternel me séparera certainement de son peuple. » Et que l’eunuque ne dise pas : « Voici, je suis un arbre sec. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן הַנֵּכָר
  choice: l’étranger
  rationale: L’expression désigne une personne d’origine étrangère; en français courant, « l’étranger » restitue naturellement le sens sans calquer l’hébreu « fils de l’étranger ».
- source_word: הַנִּלְוָה אֶל־יְהוָה
  choice: qui s’est attaché à l’Éternel
  rationale: Le verbe לוה au nifal exprime le fait de se joindre ou de s’attacher à quelqu’un. « S’est attaché » convient au lien volontaire et religieux évoqué ici.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et immédiatement reconnaissable du tétragramme, employé uniformément dans le verset.
- source_word: הַבְדֵּל יַבְדִּילַנִי
  choice: me séparera certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation; « certainement » conserve cette emphase.
- source_word: הַסָּרִיס
  choice: l’eunuque
  rationale: Équivalent direct du terme hébreu dans ce contexte, où l’image de l’arbre sec renvoie à l’absence de descendance.
- source_word: הֵן
  choice: Regardez
  rationale: Interjection attirant l’attention sur la situation du locuteur; « Regardez » est naturel et conserve sa force déictique.
- source_word: עֵץ יָבֵשׁ
  choice: un arbre sec
  rationale: Traduction littérale qui préserve la métaphore biblique de stérilité et d’absence d’avenir familial.
theological_decisions:
- issue: Statut de l’étranger au sein du peuple de Dieu
  choice: Conserver « me séparera certainement de son peuple » comme crainte exprimée par l’étranger
  alternative: Reformuler explicitement comme une exclusion cultuelle ou ethnique
  rationale: Le texte ne précise pas ici la forme exacte de la séparation; la traduction préserve donc l’étendue et la tension de l’énoncé.
- issue: Portée de la métaphore de l’arbre sec
  choice: Maintenir l’image sans l’expliquer dans le corps du texte
  alternative: Paraphraser par « je n’aurai pas de descendance »
  rationale: La métaphore évoque notamment l’absence de fécondité et de postérité, mais son langage imagé possède une portée plus large qu’une simple explication biologique.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe exhortative « Que… ne dise pas » rend naturellement les deux jussifs négatifs hébreux. Le parallélisme des deux déclarations est conservé, ainsi que l’intensification de la première.
