  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : les deux jussifs négatifs, l’attachement de l’étranger à YHWH, l’intensif « séparera certainement », et l’image de l’arbre sec sont bien conservés. Toutefois, הֵן est une particule déictique (« voici », « eh bien », « voilà »), non un impératif pluriel ; « Regardez » introduit donc inutilement un destinataire pluriel absent de l’hébreu.'
  naturalness: La formulation est claire, moderne et de registre biblique sobre. « Que … ne dise pas » rend naturellement les défenses jussives. « Voici » est plus idiomatique et plus exact que « Regardez » dans cette auto-déclaration.
  terminology: « L’étranger », « s’est attaché à l’Éternel », « l’eunuque » et « un arbre sec » sont des équivalents appropriés. « L’Éternel » est employé de façon cohérente pour le tétragramme. Aucune note n’est nécessaire.
  issues:
