source:
  edition: WLC
  text: וַ/הֲבִיאוֹתִ֞י/ם אֶל הַ֣ר קָדְשִׁ֗/י וְ/שִׂמַּחְתִּי/ם֙ בְּ/בֵ֣ית תְּפִלָּתִ֔/י עוֹלֹתֵי/הֶ֧ם וְ/זִבְחֵי/הֶ֛ם לְ/רָצ֖וֹן עַֽל מִזְבְּחִ֑/י כִּ֣י בֵיתִ֔/י בֵּית תְּפִלָּ֥ה יִקָּרֵ֖א לְ/כָל הָ/עַמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
translation:
  language: fr
  text: Je les amènerai sur ma montagne sainte et je les remplirai de joie dans ma maison de prière. Leurs holocaustes et leurs sacrifices seront agréés sur mon autel, car ma maison sera appelée maison de prière pour tous les peuples[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toutes les nations ». Le mot hébreu עַמִּים peut désigner des peuples ou des nations; « peuples » met ici en valeur l’inclusion de toutes les communautés humaines.
    reason: Alternative lexicale authentique pour עַמִּים.
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  choice: Je les amènerai
  rationale: Le hiphil de בוא exprime ici l’action par laquelle Dieu les fait venir. « Je les amènerai » est naturel en français et maintient clairement l’initiative divine.
- source_word: אֶל הַר קָדְשִׁי
  choice: sur ma montagne sainte
  rationale: Avec un lieu élevé comme destination, « sur » est idiomatique en français. « Montagne sainte » conserve l’imagerie sacrée de Sion et du temple.
- source_word: וְשִׂמַּחְתִּים
  choice: et je les remplirai de joie
  rationale: Le piel de שׂמח présente Dieu comme celui qui produit leur joie. Cette formulation française conserve cette valeur causative sans devenir technique.
- source_word: בְּבֵית תְּפִלָּתִי
  choice: dans ma maison de prière
  rationale: La formulation garde la caractérisation précise du temple comme lieu de prière, plutôt que de l’élargir à la notion générale de culte.
- source_word: עוֹלֹתֵיהֶם
  choice: leurs holocaustes
  rationale: « Holocauste » est le terme sacrificiel français traditionnel et précis pour עֹלָה, offrande entièrement consumée.
- source_word: וְזִבְחֵיהֶם
  choice: et leurs sacrifices
  rationale: זֶבַח est un terme sacrificiel plus général; « sacrifices » convient naturellement en parallèle avec « holocaustes ».
- source_word: לְרָצוֹן
  choice: seront agréés
  rationale: Dans le contexte sacrificiel, רָצוֹן indique que les offrandes rencontrent la faveur et l’acceptation de Dieu. « Seront agréés » exprime ce sens avec concision.
- source_word: עַל מִזְבְּחִי
  choice: sur mon autel
  rationale: Traduction directe et idiomatique de la préposition et du nom.
- source_word: כִּי
  choice: car
  rationale: « Car » conserve la fonction explicative de la conjonction et convient au registre solennel du verset.
- source_word: בֵּיתִי בֵּית תְּפִלָּה יִקָּרֵא
  choice: ma maison sera appelée maison de prière
  rationale: Le passif « sera appelée » rend le niphal de קרא. La répétition de « maison » maintient l’accent de l’hébreu tout en restant naturelle en français.
- source_word: לְכָל הָעַמִּים
  choice: pour tous les peuples
  rationale: « Peuples » rend la portée collective et ethnique de עַמִּים sans évoquer seulement les États-nations modernes. « Pour » exprime la destination ou le bénéfice indiqué ici par לְ.
theological_decisions:
- issue: Portée de לְכָל הָעַמִּים
  choice: pour tous les peuples
  alternative: pour toutes les nations
  rationale: Le contexte ouvre l’accès au culte aux étrangers qui s’attachent au Seigneur. « Peuples » préserve cette portée universelle sans effacer le cadre cultuel et historique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la déclaration solennelle de l’hébreu, avec des termes sacrificiels précis mais courants dans le registre biblique.
