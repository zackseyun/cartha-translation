id: ISA.59.9
reference: Isaiah 59:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּ֗ן רָחַ֤ק מִשְׁפָּט֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תַשִּׂיגֵ֖/נוּ צְדָקָ֑ה נְקַוֶּ֤ה לָ/אוֹר֙ וְ/הִנֵּה חֹ֔שֶׁךְ לִ/נְגֹה֖וֹת בָּ/אֲפֵל֥וֹת נְהַלֵּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
translation:
  language: fr
  text: C’est pourquoi le droit reste loin de nous[a], et la justice ne nous rattrape pas[b]. Nous espérons la lumière, mais voici les ténèbres ; nous attendons la clarté, mais nous marchons dans une profonde obscurité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement reste loin de nous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la justice ne nous atteint pas ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans d’épaisses ténèbres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte prophétique, le mot désigne l’ordre juste et l’exercice équitable de la justice. « Le droit » convient naturellement en français et permet de le distinguer de צְדָקָה.
- source_word: רָחַק
  choice: reste loin de
  rationale: Le parfait décrit un état présent résultant d’une situation établie. « Reste loin de » exprime clairement cette distance persistante.
- source_word: צְדָקָה
  choice: la justice
  rationale: Le terme évoque ici la rectitude conforme à ce qui est juste. « Justice » est idiomatique en français tout en maintenant, avec « le droit », les deux termes du parallélisme.
- source_word: תַשִּׂיגֵנוּ
  choice: ne nous rattrape pas
  rationale: Le hiphil de נשׂג exprime couramment l’idée d’atteindre quelqu’un en le rejoignant. « Rattraper » conserve cette image dynamique.
- source_word: נְקַוֶּה
  choice: nous espérons / nous attendons
  rationale: קוה réunit les idées d’attente et d’espérance. La variation française évite une répétition pesante sans supprimer cette double nuance.
- source_word: אוֹר
  choice: la lumière
  rationale: Équivalent direct qui conserve à la fois l’image concrète et sa portée métaphorique de délivrance.
- source_word: וְהִנֵּה
  choice: mais voici
  rationale: « Voici » garde la force présentative et saisissante de הִנֵּה dans un registre moderne et digne ; « mais » explicite le contraste porté par le contexte.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Rendu français traditionnel mais toujours intelligible, adapté au contraste poétique avec la lumière.
- source_word: נְגֹהוֹת
  choice: la clarté
  rationale: Le pluriel hébreu évoque une vive luminosité. « Clarté » est naturel en français et forme un contraste net avec l’obscurité.
- source_word: אֲפֵלוֹת
  choice: une profonde obscurité
  rationale: Le terme désigne des ténèbres épaisses. Cette expression rend leur intensité physique et métaphorique.
- source_word: נְהַלֵּךְ
  choice: nous marchons
  rationale: Le rendu littéral conserve l’image hébraïque d’une condition vécue ou d’un cheminement.
theological_decisions:
- issue: Rapport entre מִשְׁפָּט et צְדָקָה
  choice: Les rendre respectivement par « le droit » et « la justice »
  alternative: « le jugement » et « la justice » ; ou « la justice » pour les deux termes
  rationale: Cette distinction préserve le parallélisme hébreu entre l’ordre ou l’action judiciaires justes et la rectitude, sans réduire les deux notions à un seul mot français.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et les images spatiales du texte hébreu sont conservés, avec une ponctuation qui met en relief le contraste entre l’espérance et l’expérience.
