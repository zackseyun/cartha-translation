  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
translation:
  language: fr
  text: Nous grognons tous comme des ours et, comme des colombes, nous gémissons sans cesse. Nous espérons[a] la justice, mais elle n’est pas là ; le salut[b], mais il est loin de nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « attendons » la justice.
    reason: lexical_alternative
  - marker: b
    text: Ou « la délivrance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה כַדֻּבִּים כֻּלָּנוּ
  choice: Nous grognons tous comme des ours
  rationale: Le verbe הָמָה évoque ici un bruit sourd et puissant. « Grognons » convient à l’image des ours, tandis que « tous » maintient la dimension collective de la plainte.
- source_word: וְכַיּוֹנִים הָגֹה נֶהְגֶּה
  choice: et, comme des colombes, nous gémissons sans cesse
  rationale: La construction infinitif absolu + verbe conjugué intensifie ou prolonge l’action. « Sans cesse » rend naturellement cette insistance, et « gémissons » exprime la tonalité plaintive associée aux colombes.
- source_word: נְקַוֶּה
  choice: nous espérons
  rationale: קוה peut exprimer l’attente ou l’espérance. « Espérons » convient à l’attente confiante mais déçue du contexte, sans exclure la nuance d’attente signalée en note.
- source_word: לַמִּשְׁפָּט
  choice: la justice
  rationale: מִשְׁפָּט désigne ici la justice attendue, plutôt qu’un simple jugement ou verdict judiciaire.
- source_word: וָאַיִן
  choice: mais elle ne vient pas
  rationale: Littéralement, « mais il n’y en a pas ». La formulation choisie exprime en français naturel l’absence de la justice attendue sans transformer celle-ci en objet comptable.
- source_word: לִישׁוּעָה
  choice: le salut
  rationale: יְשׁוּעָה peut désigner le salut ou la délivrance. « Salut » conserve l’ampleur du terme dans Ésaïe, tandis que l’autre possibilité est indiquée en note.
- source_word: רָחֲקָה מִמֶּנּוּ
  choice: mais il est loin de nous
  rationale: Cette formulation directe conserve l’image spatiale par laquelle le texte décrit l’éloignement du salut.
theological_decisions:
- issue: Portée de יְשׁוּעָה dans cette plainte prophétique
  choice: salut
  alternative: délivrance
  rationale: « Salut » préserve la portée large du terme sans lui imposer un contenu doctrinal postérieur. Dans le contexte immédiat, il comprend néanmoins l’idée concrète de secours et de délivrance.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux comparaisons animales et le caractère collectif de la plainte sont maintenus. La ponctuation conserve le parallélisme, y compris l’ellipse du verbe devant « le salut ».
