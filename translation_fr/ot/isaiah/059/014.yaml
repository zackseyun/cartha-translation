id: ISA.59.14
reference: Isaiah 59:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֻסַּ֤ג אָחוֹר֙ מִשְׁפָּ֔ט וּ/צְדָקָ֖ה מֵ/רָח֣וֹק תַּעֲמֹ֑ד כִּֽי כָשְׁלָ֤ה בָֽ/רְחוֹב֙ אֱמֶ֔ת וּ/נְכֹחָ֖ה לֹא תוּכַ֥ל לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
translation:
  language: fr
  text: La justice est repoussée en arrière, et la droiture se tient à distance ; car la vérité a trébuché sur la place publique[a], et la rectitude ne peut entrer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la rue ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui est droit ne peut entrer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻסַּג אָחוֹר
  choice: est repoussée en arrière
  rationale: Le hofal de סוג exprime un mouvement subi vers l’arrière. « Est repoussée » conserve le passif et la personnification, tandis que « en arrière » rend explicitement אָחוֹר.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte de désordre social et judiciaire, le terme désigne la justice exercée dans la vie publique plutôt qu’un simple jugement particulier.
- source_word: צְדָקָה
  choice: la droiture
  rationale: « Droiture » distingue ce terme de מִשְׁפָּט tout en exprimant la rectitude morale et sociale évoquée par le parallélisme.
- source_word: מֵרָחוֹק תַּעֲמֹד
  choice: se tient à distance
  rationale: Cette formulation naturelle maintient l’image personnifiée d’une vertu qui demeure éloignée.
- source_word: כָשְׁלָה
  choice: a trébuché
  rationale: Le verbe décrit le fait de chanceler ou de trébucher, sans imposer l’idée plus forte d’une chute définitive.
- source_word: בָרְחוֹב
  choice: sur la place publique
  rationale: רְחוֹב peut désigner une rue large ou un espace public ouvert. Ici, « place publique » rend clairement le cadre civique où devraient prévaloir justice et vérité.
- source_word: אֱמֶת
  choice: la vérité
  rationale: Le mot peut aussi évoquer la fidélité et la fiabilité, mais « vérité » convient à cette personnification dans un contexte de corruption publique.
- source_word: נְכֹחָה
  choice: la rectitude
  rationale: Le terme exprime ce qui est droit ou juste. « Rectitude » garde un nom abstrait personnifié et évite de le confondre avec les deux termes précédents.
- source_word: לֹא תוּכַל לָבוֹא
  choice: ne peut entrer
  rationale: La traduction conserve l’image d’une rectitude empêchée d’accéder à l’espace public.
theological_decisions:
- issue: Rendu du couple מִשְׁפָּט / צְדָקָה
  choice: la justice… la droiture
  alternative: le jugement… la justice
  rationale: Deux termes français distincts préservent les vertus apparentées mais non identiques du texte hébreu, sans les fondre en une seule notion théologique.
- issue: Sens de נְכֹחָה
  choice: la rectitude
  alternative: ce qui est droit
  rationale: Le substantif abstrait maintient la série de vertus personnifiées. La note signale toutefois la lecture plus concrète afin de ne pas fermer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle et les quatre réalités personnifiées sont conservés ; le point-virgule marque le lien entre la situation et sa cause.
