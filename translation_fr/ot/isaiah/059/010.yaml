base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/010.yaml
  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
translation:
  language: fr
  text: Nous tâtonnons le long du mur comme des aveugles ; comme ceux qui n’ont pas d’yeux, nous tâtonnons. Nous trébuchons en plein midi comme au crépuscule ; parmi les gens vigoureux[a], nous sommes comme les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « parmi les robustes » ou « dans des lieux fertiles » ; le terme hébreu est rare et son sens est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  choice: nous tâtonnons / nous avançons à tâtons
  rationale: Le piel de גשש décrit l’action de chercher son chemin par le toucher. La légère variation française évite une répétition pesante tout en conservant le parallélisme et l’image tactile.
- source_word: כַעִוְרִים
  choice: comme des aveugles
  rationale: Rend naturellement l’adjectif pluriel substantivé et conserve la comparaison collective sans ajout explicatif.
- source_word: קִיר
  choice: le long du mur
  rationale: Le mur sert ici de repère tactile. « Le long du mur » exprime naturellement en français l’action de le suivre à tâtons, sans modifier l’image.
- source_word: וּכְאֵין עֵינַיִם
  choice: comme ceux qui n’ont pas d’yeux
  rationale: Conserve la formulation intensifiée et frappante de l’hébreu, ainsi que sa valeur comparative.
- source_word: כָּשַׁלְנוּ
  choice: nous trébuchons
  rationale: כשל évoque le fait de trébucher ou de chanceler ; « trébuchons » prolonge clairement l’image de l’aveuglement.
- source_word: בַצָּהֳרַיִם
  choice: en plein midi
  rationale: Souligne la pleine lumière du jour et renforce le contraste paradoxal avec le crépuscule.
- source_word: כַנֶּשֶׁף
  choice: comme au crépuscule
  rationale: נשף désigne une lumière crépusculaire, sans imposer ici de préciser s’il s’agit de l’aube ou du soir.
- source_word: בָּאַשְׁמַנִּים
  choice: parmi les gens vigoureux
  rationale: Le terme rare est compris comme désignant des personnes robustes ou pleines de vitalité, ce qui crée un contraste avec « les morts ». Son incertitude lexicale est signalée en note.
- source_word: כַמֵּתִים
  choice: comme les morts
  rationale: Formulation concise et forte qui conserve la comparaison collective de l’hébreu.
