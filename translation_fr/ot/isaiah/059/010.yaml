  source_fidelity: Le sens général, les images et les contrastes de l’hébreu sont bien rendus. Toutefois, les deux occurrences du piel de גשש sont répétées en hébreu et gagnent à être rendues par le même verbe en français. La note sur בָּאַשְׁמַנִּים doit aussi refléter l’alternative personnelle « parmi les robustes », en plus de l’interprétation locative.
  naturalness: Le français est moderne, clair et d’un registre convenant à la poésie prophétique. « Tâtonner le long du mur » et « en plein midi comme au crépuscule » sont naturels. La répétition de « nous tâtonnons » est ici poétiquement motivée et plus fidèle au parallélisme.
  terminology: « Aveugles », « mur », « crépuscule », « gens vigoureux » et « morts » rendent adéquatement les termes et images du texte. « Gens vigoureux » reste une résolution raisonnable du terme hébreu rare, à condition que l’incertitude et les principales alternatives soient signalées en note.
