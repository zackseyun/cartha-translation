  text: וְ/יִֽירְא֤וּ מִֽ/מַּעֲרָב֙ אֶת שֵׁ֣ם יְהוָ֔ה וּ/מִ/מִּזְרַח שֶׁ֖מֶשׁ אֶת כְּבוֹד֑/וֹ כִּֽי יָב֤וֹא כַ/נָּהָר֙ צָ֔ר ר֥וּחַ יְהוָ֖ה נֹ֥סְסָה בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/019.yaml
  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
translation:
  language: fr
  text: Alors, de l’occident, on craindra le nom de Yahweh, et, du levant[a], sa gloire ; car il viendra comme un fleuve impétueux[b], que le souffle de Yahweh pousse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le lever du soleil » ; ou : « l’est ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de la fin du verset est difficile. Autre traduction possible : « car il viendra comme un fleuve impétueux, entraîné par l’Esprit de Yahweh ».'
    reason: alternative_reading
  - marker: c
    text: '« Le souffle de Yahweh » peut aussi se traduire par « l’Esprit de Yahweh » ou « le vent de Yahweh ». Traduction traditionnelle, selon une autre analyse de l’hébreu : « Quand l’ennemi viendra comme un fleuve, l’Esprit de Yahweh dressera un étendard contre lui. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Alors on craindra
  rationale: Le qal imparfait exprime la crainte mêlée de révérence. Le pronom « on » rend naturellement en français le pluriel indéfini hébreu, tandis que « alors » marque le lien logique avec le contexte.
- source_word: מִמַּעֲרָב
  choice: depuis l’occident
  rationale: Le terme désigne l’ouest, lieu du coucher du soleil. « L’occident » convient au parallélisme géographique et au registre poétique.
- source_word: אֶת שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: L’expression renvoie à l’identité révélée et à la renommée de Dieu. Le tétragramme est translittéré « Yahweh ».
- source_word: וּמִמִּזְרַח שֶׁמֶשׁ
  choice: depuis le levant
  rationale: Littéralement « depuis le lever du soleil ». « Le levant » conserve l’image solaire et désigne clairement l’est dans un français poétique accessible.
- source_word: אֶת כְּבוֹדוֹ
  choice: sa gloire
  rationale: כבוד évoque ici la manifestation majestueuse et visible de Dieu ; « gloire » est le terme français le plus juste dans ce contexte théophanique.
- source_word: כִּי יָבוֹא
  choice: car il viendra
  rationale: כִּי introduit vraisemblablement la raison, et le verbe est au masculin singulier. Le sujet personnel implicite est compris comme Yahweh, tout en signalant en note l’incertitude syntaxique.
- source_word: כַנָּהָר צָר
  choice: comme un fleuve impétueux
  rationale: נהר signifie « fleuve » ou « rivière ». צָר est difficile ici ; « impétueux » exprime la force pressante du courant sans adopter la lecture « ennemi », également possible mais syntaxiquement contestée.
- source_word: רוּחַ יְהוָה
  choice: le souffle de Yahweh
  rationale: רוּחַ peut signifier souffle, vent ou Esprit. Dans l’image d’un courant mis en mouvement, « souffle » garde le caractère concret tout en laissant subsister la résonance théologique.
- source_word: נֹסְסָה בוֹ
  choice: poussé par
  rationale: La forme et la construction sont difficiles. Cette traduction comprend le souffle de Yahweh comme la force qui entraîne l’avancée comparée à un fleuve, et produit une phrase française cohérente sans masquer les autres analyses, données en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Sens de רוּחַ יְהוָה
  choice: le souffle de Yahweh
  alternative: l’Esprit de Yahweh ; le vent de Yahweh
  rationale: Le contexte imagé favorise le sens concret « souffle », mais le mot hébreu porte réellement les trois valeurs ; les autres possibilités sont donc conservées en note.
- issue: Interprétation de la dernière proposition difficile
  choice: Yahweh vient comme un fleuve impétueux, poussé par son souffle
  alternative: l’ennemi vient comme un fleuve, et l’Esprit de Yahweh dresse un étendard contre lui
  rationale: Le texte hébreu ne comporte aucun nom explicite signifiant « ennemi », et le verbe rare permet plusieurs analyses. La lecture principale suit une avancée divine cohérente avec le contexte immédiat, tandis que la lecture traditionnelle est explicitement préservée.
translation_notes:
  register: Français international moderne, digne et poétique. « Le levant » préserve l’image hébraïque tout en restant intelligible. La formulation principale demeure fluide, tandis que les notes exposent franchement l’ambiguïté lexicale, syntaxique et théologique de la dernière proposition.
