  rationale: La révision améliore l’idiome français et clarifie que la force motrice décrit le fleuve imagé, non Yahweh comme sujet personnel implicite. Elle conserve la lecture principale retenue par l’audit anglais tout en maintenant, dans des notes correctement ancrées, les possibilités concernant « levant », רוּחַ et la construction très disputée de la clausule finale.
