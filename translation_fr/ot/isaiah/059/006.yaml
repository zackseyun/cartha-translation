source:
  edition: WLC
  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
translation:
  language: fr
  text: Leurs toiles ne leur serviront pas de vêtement[a], et ils ne se couvriront pas avec leurs actes. Leurs actes sont des actes de méchanceté[b], et l’œuvre de violence est dans leurs mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs toiles d’araignée ». Le mot hébreu désigne ce qui est filé ou tissé ; « toiles » préserve l’image sans la préciser davantage.
    reason: lexical_alternative
  - marker: b
    text: Ou « des actes iniques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּרֵיהֶם
  choice: leurs toiles
  rationale: Le nom désigne ce qui est filé ou tissé. « Toiles » maintient le lien avec la toile d’araignée du verset précédent sans préciser davantage que l’hébreu de ce verset.
- source_word: לְבֶגֶד
  choice: un vêtement
  rationale: בֶּגֶד désigne couramment un vêtement. Le singulier français conserve ici la forme et l’image concrète de l’hébreu.
- source_word: יִתְכַּסּוּ
  choice: ils ne se couvriront pas
  rationale: La forme hitpael a une valeur réfléchie, rendue directement par « se couvrir ».
- source_word: בְּמַעֲשֵׂיהֶם / מַעֲשֵׂיהֶם
  choice: de leurs actes / leurs actes
  rationale: « Actes » est naturel en français moderne et permet de conserver la répétition rhétorique du même nom hébreu.
- source_word: מַעֲשֵׂי אָוֶן
  choice: des actes mauvais
  rationale: אָוֶן évoque ici le mal moral, l’iniquité ou la méchanceté. « Mauvais » exprime clairement l’accusation tout en laissant une note signaler l’autre rendu possible.
- source_word: וּפֹעַל חָמָס
  choice: et l’œuvre de la violence
  rationale: Le singulier et la relation construite sont conservés. חָמָס désigne la violence, avec une possible nuance d’injustice.
- source_word: בְּכַפֵּיהֶם
  choice: est dans leurs mains
  rationale: La formulation française naturelle maintient l’image concrète des paumes ou des mains ainsi que l’idée de responsabilité.
theological_decisions:
- issue: Force métaphorique d’une couverture inadéquate
  choice: Conserver les images concrètes des toiles, du vêtement et du fait de se couvrir.
  alternative: Paraphraser en disant qu’ils ne peuvent cacher leur culpabilité par leurs actes.
  rationale: L’hébreu laisse ressortir l’accusation morale au moyen de l’image sans l’expliciter. La traduction ne doit pas résoudre la métaphore en commentaire.
translation_notes:
  register: Français international moderne, courant et digne. La répétition de « actes » et les images matérielles du texte hébreu sont volontairement conservées.
