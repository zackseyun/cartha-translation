id: ISA.59.12
reference: Isaiah 59:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי רַבּ֤וּ פְשָׁעֵ֨י/נוּ֙ נֶגְדֶּ֔/ךָ וְ/חַטֹּאותֵ֖י/נוּ עָ֣נְתָה בָּ֑/נוּ כִּֽי פְשָׁעֵ֣י/נוּ אִתָּ֔/נוּ וַ/עֲוֺנֹתֵ֖י/נוּ יְדַֽעֲנֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
translation:
  language: fr
  text: 'Car nos révoltes sont nombreuses devant toi,

    et nos péchés témoignent contre nous[a] ;

    car nos révoltes sont avec nous,

    et nos iniquités, nous les connaissons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déposent contre nous » ; plus littéralement, « répondent contre nous » ou « répondent en nous ».
    reason: L’hébreu ענה בנו associe un verbe pouvant signifier « répondre » ou « témoigner » à une préposition dont la nuance exacte demeure condensée dans cet idiome judiciaire.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication et la confession qui motivent ce qui précède. « Car » en conserve naturellement la valeur explicative.
- source_word: רַבּוּ
  choice: sont nombreuses
  rationale: Le verbe רבה exprime l’accroissement ou la grande quantité. Cette formulation rend clairement l’état résultant sans alourdir le vers.
- source_word: פְשָׁעֵינוּ
  choice: nos révoltes
  rationale: פשע désigne souvent une rupture d’autorité ou une rébellion. « Révoltes » garde cette dimension volontaire et se distingue des autres termes du verset.
- source_word: נֶגְדֶּךָ
  choice: devant toi
  rationale: נגד évoque ce qui se trouve en face de quelqu’un ou sous son regard. « Devant toi » préserve la nuance spatiale et judiciaire sans le confondre avec « contre nous » dans la proposition suivante.
- source_word: וְחַטֹּאותֵינוּ
  choice: et nos péchés
  rationale: חטאות est le terme courant pour les péchés ; l’équivalent français est direct, naturel et précis.
- source_word: עָנְתָה בָּנוּ
  choice: témoignent contre nous
  rationale: Dans ce contexte judiciaire, ענה peut signifier « répondre » ou « témoigner », et בנו prend une valeur défavorable. Le pluriel français s’accorde naturellement avec « nos péchés », tandis que l’hébreu emploie ici un verbe au singulier.
- source_word: פְשָׁעֵינוּ אִתָּנוּ
  choice: nos révoltes sont avec nous
  rationale: La formulation proche de l’hébreu exprime leur présence persistante et la conscience que le peuple en a, sans préciser davantage une image volontairement concise.
- source_word: וַעֲוֺנֹתֵינוּ
  choice: et nos iniquités
  rationale: עון peut évoquer la perversité morale, la faute et la culpabilité. « Iniquités » conserve la gravité du terme et la distingue de « révoltes » et de « péchés ».
- source_word: יְדַעֲנוּם
  choice: nous les connaissons
  rationale: ידע signifie directement « connaître ». La reprise pronominale française rend explicitement le suffixe objet hébreu et souligne la pleine conscience des fautes.
theological_decisions:
- issue: Maintien des trois termes hébreux relatifs au péché
  choice: « révoltes », « péchés » et « iniquités »
  alternative: Employer « péchés » pour les trois termes
  rationale: Le texte accumule פשע, חטא et עון, trois notions proches mais non identiques. Les distinguer préserve la force rhétorique de la confession sans imposer une systématisation doctrinale.
- issue: Valeur judiciaire de עָנְתָה בָּנוּ
  choice: « témoignent contre nous »
  alternative: « répondent contre nous » ou, plus littéralement, « répondent en nous »
  rationale: Le contexte présente les péchés comme des témoins accusateurs. La traduction principale explicite cette image judiciaire tout en signalant l’ambiguïté de l’idiome dans la note.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme poétique est conservé sur quatre lignes. « Iniquités » relève d’un registre soutenu, mais reste intelligible et permet de maintenir la distinction entre les trois vocables hébreux du péché.
