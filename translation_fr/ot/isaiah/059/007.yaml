id: ISA.59.7
reference: Isaiah 59:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַגְלֵי/הֶם֙ לָ/רַ֣ע יָרֻ֔צוּ וִֽ/ימַהֲר֔וּ לִ/שְׁפֹּ֖ךְ דָּ֣ם נָקִ֑י מַחְשְׁבֽוֹתֵי/הֶם֙ מַחְשְׁב֣וֹת אָ֔וֶן שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/מְסִלּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
translation:
  language: fr
  text: Leurs pieds courent vers le mal, et ils se hâtent de verser le sang innocent. Leurs pensées sont des pensées de malfaisance[a] ; ravage et destruction jalonnent leurs routes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs projets sont des projets malfaisants » ; le mot hébreu peut désigner des pensées, des projets ou des desseins.
    reason: lexical_alternative
  - marker: b
    text: Ou « se trouvent sur leurs sentiers » ; le terme hébreu désigne littéralement des routes et évoque aussi ici le cours de leur conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: leurs pieds
  rationale: Conserve l’image corporelle concrète, qui évoque par métonymie leur conduite.
- source_word: לָרַע יָרֻצוּ
  choice: courent vers le mal
  rationale: « Vers » exprime naturellement la direction indiquée par ל sans ajouter explicitement « faire ».
- source_word: וִימַהֲרוּ
  choice: ils se hâtent
  rationale: Rend la rapidité et l’empressement du verbe, en parallèle avec « courent ».
- source_word: לִשְׁפֹּךְ דָּם נָקִי
  choice: de verser le sang innocent
  rationale: Expression française idiomatique qui correspond directement à l’image hébraïque.
- source_word: מַחְשְׁבוֹתֵיהֶם מַחְשְׁבוֹת אָוֶן
  choice: leurs pensées sont des pensées de malfaisance
  rationale: Préserve la répétition rhétorique de מַחְשְׁבוֹת et donne à אָוֶן sa valeur morale dans ce contexte, tout en signalant en note la portée possible de « pensées ».
- source_word: שֹׁד וָשֶׁבֶר
  choice: ravage et destruction
  rationale: Maintient l’accumulation poétique de deux termes proches désignant les effets destructeurs de leur conduite.
- source_word: בִּמְסִלּוֹתָם
  choice: jalonnent leurs routes
  rationale: Conserve l’image concrète des routes tout en exprimant en français naturel que le ravage et la destruction s’y trouvent tout au long de leur parcours.
theological_decisions:
- issue: Valeur morale de אָוֶן
  choice: malfaisance
  alternative: iniquité ; mal ; trouble
  rationale: Le contexte associe intentions mauvaises, sang innocent et destruction. « Malfaisance » fait ressortir la culpabilité morale sans introduire une doctrine particulière.
- issue: Portée métaphorique de מְסִלּוֹת
  choice: routes
  alternative: sentiers ; voies
  rationale: Le terme désigne concrètement des routes, mais l’image suggère aussi le cours de leur conduite ; cette tension est conservée et précisée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme et les images concrètes de l’hébreu sont conservés sans tournure excessivement archaïque.
