source:
  edition: WLC
  text: וַ/אֲנִ֗י זֹ֣את בְּרִיתִ֤/י אוֹתָ/ם֙ אָמַ֣ר יְהוָ֔ה רוּחִ/י֙ אֲשֶׁ֣ר עָלֶ֔י/ךָ וּ/דְבָרַ֖/י אֲשֶׁר שַׂ֣מְתִּי בְּ/פִ֑י/ךָ לֹֽא יָמ֡וּשׁוּ מִ/פִּי/ךָ֩ וּ/מִ/פִּ֨י זַרְעֲ/ךָ֜ וּ/מִ/פִּ֨י זֶ֤רַע זַרְעֲ/ךָ֙ אָמַ֣ר יְהוָ֔ה מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
translation:
  language: fr
  text: '« Quant à moi, voici mon alliance avec eux, dit Yahweh : mon Esprit qui est sur toi et mes paroles que j’ai mises dans ta bouche ne quitteront ni ta bouche, ni la bouche de ta descendance, ni la bouche de la descendance de ta descendance[a], dit Yahweh, dès maintenant et pour toujours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta semence » et « la semence de ta semence ». Le mot hébreu est un nom collectif qui désigne la postérité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à partir de maintenant et pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant placé en tête marque l’insistance ou le contraste. « Quant à moi » rend naturellement ce relief discursif en français.
- source_word: זֹאת בְּרִיתִי אוֹתָם
  choice: voici mon alliance avec eux
  rationale: « Voici » introduit naturellement le contenu de l’alliance, et « avec eux » rend de façon idiomatique la relation exprimée par l’hébreu.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: Le présent « dit » convient à la formule prophétique et le nom divin est translittéré sous la forme Yahweh.
- source_word: רוּחִי אֲשֶׁר עָלֶיךָ
  choice: mon Esprit qui est sur toi
  rationale: Dans ce contexte d’alliance et de parole prophétique, רוּחַ désigne le plus vraisemblablement l’Esprit divin. « Est sur toi » conserve sobrement la préposition עַל sans préciser l’identité du destinataire.
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  choice: et mes paroles que j’ai mises dans ta bouche
  rationale: Le pluriel דְבָרַי est conservé. Le passé composé exprime en français l’acte accompli dont l’effet demeure.
- source_word: לֹא יָמוּשׁוּ מִפִּיךָ
  choice: ne quitteront ni ta bouche
  rationale: Le verbe מוּשׁ exprime ici le fait de s’éloigner ou de disparaître d’un lieu. « Ne quitteront » est naturel et garde la force durable de la promesse; la coordination « ni… ni… » restitue clairement la série négative.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע est un nom collectif désignant ici la postérité. « Descendance » est courant, inclusif et conserve cette valeur collective.
- source_word: זֶרַע זַרְעֲךָ
  choice: la descendance de ta descendance
  rationale: Cette formulation garde la répétition hébraïque et la progression des générations, sans réduire l’expression à une seule génération déterminée.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: dès maintenant et pour toujours
  rationale: Cette tournure française naturelle exprime une durée ininterrompue commençant au moment présent.
theological_decisions:
- issue: Référent du pronom singulier « toi »
  choice: Maintien du singulier « toi » sans explicitation
  alternative: Identifier le destinataire au prophète, à Sion ou Israël personnifié, au serviteur, ou à la communauté rachetée
  rationale: Le texte hébreu ne précise pas ici sans ambiguïté le référent immédiat. Le maintien du pronom préserve cette ouverture interprétative.
- issue: Sens de רוּחִי
  choice: mon Esprit
  alternative: mon souffle ou mon vent
  rationale: Le contexte associe l’Esprit de Yahweh à ses paroles placées dans la bouche du destinataire; « Esprit » est donc le sens contextuel le plus probable, tout en reconnaissant la gamme sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure solennelle de la déclaration d’alliance et la répétition de « bouche » sont conservées. Le singulier « toi » demeure volontairement non interprété.
