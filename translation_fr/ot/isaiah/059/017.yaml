source:
  edition: WLC
  text: וַ/יִּלְבַּ֤שׁ צְדָקָה֙ כַּ/שִּׁרְיָ֔ן וְ/כ֥וֹבַע יְשׁוּעָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּלְבַּ֞שׁ בִּגְדֵ֤י נָקָם֙ תִּלְבֹּ֔שֶׁת וַ/יַּ֥עַט כַּ/מְעִ֖יל קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
translation:
  language: fr
  text: Il revêtit la justice comme une cuirasse et mit sur sa tête le casque du salut[a] ; il revêtit pour habit des vêtements de vengeance et s’enveloppa de zèle comme d’un manteau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la délivrance » ou « de la victoire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de jalousie », au sens d’une ardeur intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  choice: justice
  rationale: Dans le contexte de l’intervention du guerrier divin, le terme désigne sa rectitude mise en œuvre pour rétablir le droit. « Justice » est naturel en français et conserve la dimension morale et judiciaire du mot.
- source_word: שִׁרְיָן
  choice: cuirasse
  rationale: Le mot désigne une protection portée sur le torse. « Cuirasse » restitue précisément l’image militaire dans un registre français digne et courant.
- source_word: כּוֹבַע
  choice: casque
  rationale: Équivalent direct du couvre-chef protecteur dans cette scène guerrière.
- source_word: יְשׁוּעָה
  choice: salut
  rationale: Le nom peut exprimer le salut, la délivrance ou la victoire. « Salut » conserve sa portée large et son importance dans Ésaïe, tandis que les autres nuances sont signalées en note.
- source_word: בִּגְדֵי נָקָם תִּלְבֹּשֶׁת
  choice: la vengeance comme un habit
  rationale: Cette formulation française rend l’idée que la vengeance constitue le vêtement revêtu, sans reproduire lourdement la redondance hébraïque entre « vêtements » et « habillement ».
- source_word: וַיַּעַט
  choice: s’enveloppa de
  rationale: Le verbe décrit le fait de se couvrir ou de s’envelopper, ce qui convient naturellement au manteau.
- source_word: מְעִיל
  choice: manteau
  rationale: Le terme désigne un vêtement extérieur ; « manteau » est clair, concret et adapté à la comparaison.
- source_word: קִנְאָה
  choice: zèle
  rationale: Ici, le mot exprime l’ardeur passionnée qui pousse Dieu à agir. « Zèle » évite de réduire le sens à la jalousie tout en laissant cette nuance possible en note.
theological_decisions:
- issue: Image du Seigneur comme guerrier divin
  choice: Conserver concrètement les images de la cuirasse, du casque, de l’habit et du manteau.
  alternative: Transformer les vêtements guerriers en qualités abstraites.
  rationale: L’hébreu représente Dieu se préparant lui-même à intervenir. Maintenir cette image préserve la force de son action juste, salvatrice et punitive sans l’atténuer.
- issue: Sens de יְשׁוּעָה
  choice: salut
  alternative: victoire ou délivrance
  rationale: Le contexte militaire autorise « victoire », mais « salut » garde l’étendue sémantique du terme et la tension entre délivrance des opprimés et triomphe sur les adversaires.
- issue: Sens de קִנְאָה appliqué à Dieu
  choice: zèle
  alternative: jalousie
  rationale: « Zèle » exprime ici l’ardeur intense de Dieu sans exclure l’arrière-plan d’attachement jaloux qui peut appartenir au terme hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif et poétique du passage. Le parallélisme vestimentaire et l’imagerie guerrière sont maintenus, tandis que la redondance littérale de בִּגְדֵי נָקָם תִּלְבֹּשֶׁת est rendue par une tournure française fluide.
