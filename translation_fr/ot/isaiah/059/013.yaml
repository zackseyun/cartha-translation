  text: פָּשֹׁ֤עַ וְ/כַחֵשׁ֙ בַּֽ/יהוָ֔ה וְ/נָס֖וֹג מֵ/אַחַ֣ר אֱלֹהֵ֑י/נוּ דַּבֶּר עֹ֣שֶׁק וְ/סָרָ֔ה הֹר֧וֹ וְ/הֹג֛וֹ מִ/לֵּ֖ב דִּבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/013.yaml
  text: transgressing and denying Yahweh[a], and turning back from following our God, speaking oppression and revolt[b], conceiving and uttering from the heart words of falsehood.
translation:
  language: fr
  text: nous révolter et renier Yahweh[a], nous détourner de notre Dieu, prononcer des paroles d’oppression et de rébellion[b], concevoir et exprimer du fond du cœur des paroles de mensonge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « agir avec perfidie envers Yahweh » ou « mentir à Yahweh » ; le verbe hébreu peut exprimer le reniement, le mensonge ou la déloyauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « déviation », « révolte » ou « apostasie ». Le mot hébreu désigne le fait de s’écarter ou de se rebeller, ici dans un contexte d’infidélité envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשֹׁעַ
  choice: nous révolter
  rationale: L’infinitif absolu employé dans cette confession énumère une faute active; « nous révolter » exprime nettement la rupture morale et relationnelle.
- source_word: וְכַחֵשׁ בַּיהוָה
  choice: et renier Yahweh
  rationale: כחש avec ב peut évoquer le reniement, le mensonge ou la déloyauté envers quelqu’un; « renier » rend clairement ici la répudiation de Yahweh sans exclure l’idée de perfidie.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit « Yahweh », conformément à sa fonction de nom propre dans le texte.
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  choice: nous détourner de notre Dieu
  rationale: Littéralement, l’expression décrit le fait de reculer de derrière Dieu, donc de cesser de le suivre; la formulation française conserve le mouvement d’éloignement de façon naturelle.
- source_word: דַּבֶּר עֹשֶׁק
  choice: parler d’oppression
  rationale: עֹשֶׁק désigne l’oppression ou l’exploitation injuste; « parler d’oppression » garde la construction où ces réalités constituent le contenu de la parole.
- source_word: וְסָרָה
  choice: et de rébellion
  rationale: סָרָה peut désigner la déviation, la rébellion ou l’apostasie. « Rébellion » reste large, actuel et adapté au contexte d’infidélité envers Dieu.
- source_word: הֹרוֹ וְהֹגוֹ
  choice: concevoir … et les proférer
  rationale: Les deux formes présentent la formation intérieure puis l’expression des propos. « Concevoir » et « proférer » rendent cette progression tout en produisant une phrase française naturelle.
- source_word: מִלֵּב
  choice: dans notre cœur
  rationale: Le cœur est présenté comme le lieu intérieur d’où naissent les paroles fausses; « dans notre cœur » s’accorde naturellement avec « concevoir ».
- source_word: דִּבְרֵי שָׁקֶר
  choice: des paroles mensongères
  rationale: Le groupe construit désigne des paroles caractérisées par la fausseté; cette formulation est claire et fidèle en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie directement le Tétragramme comme nom propre; « Yahweh » le distingue du titre אֲדֹנָי et préserve sa portée d’alliance.
- issue: Portée religieuse de וְסָרָה
  choice: rébellion
  alternative: apostasie; déviation; révolte
  rationale: Le contexte est celui de l’infidélité envers Dieu, mais le nom hébreu n’impose pas le terme plus spécialisé « apostasie ». « Rébellion » conserve la gravité théologique et l’étendue lexicale.
- issue: Relation exprimée par כחש avec ב
  choice: renier Yahweh
  alternative: mentir à Yahweh; agir avec perfidie envers Yahweh
  rationale: Le mot permet plusieurs nuances connexes. « Renier » convient à la confession d’une rupture avec Dieu, tandis qu’une note signale les autres lectures légitimes.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La série d’infinitifs conserve le caractère confessionnel et cumulatif du verset. Le parallélisme entre faute envers Dieu, parole injuste et mensonge conçu intérieurement demeure perceptible.
