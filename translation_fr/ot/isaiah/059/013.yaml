    issue: Ambiguïté de « parler d’oppression »
    rationale: En français, cette expression évoque normalement un discours ayant l’oppression pour sujet. Dans le texte hébreu, עֹשֶׁק et סָרָה désignent ce qui est proféré. « Prononcer des paroles d’oppression et de rébellion » maintient cette relation.
  - severity: low
    issue: Position et portée de « dans notre cœur »
    rationale: Le texte hébreu dit littéralement « concevant et proférant, du cœur, des paroles de mensonge ». La révision « du fond du cœur » conserve l’origine intérieure sans donner l’impression que les paroles sont seulement conçues, mais non exprimées, dans le cœur.
