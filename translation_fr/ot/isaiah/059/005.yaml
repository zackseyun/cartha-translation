source:
  edition: WLC
  text: בֵּיצֵ֤י צִפְעוֹנִי֙ בִּקֵּ֔עוּ וְ/קוּרֵ֥י עַכָּבִ֖ישׁ יֶאֱרֹ֑גוּ הָ/אֹכֵ֤ל מִ/בֵּֽיצֵי/הֶם֙ יָמ֔וּת וְ/הַ/זּוּרֶ֖ה תִּבָּקַ֥ע אֶפְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/005.yaml
  text: They hatch viper's eggs and weave spider's webs[a]; whoever eats from their eggs dies[b], and what is crushed breaks open into a viper.
translation:
  language: fr
  text: Ils font éclore des œufs de vipère[a] et tissent des toiles d’araignée. Celui qui mange de leurs œufs meurt ; si l’on en écrase un, une vipère en sort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des œufs de serpent venimeux ». L’espèce précise désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, selon une interprétation du texte hébreu difficile : « et celui qui est écrasé se fend : une vipère ».'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  choice: des œufs de vipère
  rationale: Le groupe construit désigne les œufs d’un serpent venimeux. « Vipère » est courant en français moderne et conserve directement l’image du danger.
- source_word: בִּקֵּעוּ
  choice: font éclore
  rationale: Le verbe signifie littéralement fendre ou ouvrir ; appliqué à des œufs, « faire éclore » rend naturellement l’action causative suggérée par la forme intensive.
- source_word: קוּרֵי עַכָּבִישׁ
  choice: des toiles d’araignée
  rationale: Cette expression désigne les fils ou la toile de l’araignée. « Toiles d’araignée » est l’expression française naturelle et s’accorde avec le verbe « tisser ».
- source_word: יֶאֱרֹגוּ
  choice: tissent
  rationale: Le verbe signifie « tisser ». Ce choix maintient l’image concrète et le parallélisme poétique.
- source_word: הָאֹכֵל מִבֵּיצֵיהֶם
  choice: Celui qui mange de leurs œufs
  rationale: Le participe substantivé a une portée générale. « Celui qui » conserve le singulier générique, tandis que « de leurs œufs » reflète la préposition מִן.
- source_word: יָמוּת
  choice: meurt
  rationale: Le présent français exprime ici une conséquence générale et certaine, conformément à la portée proverbiale de l’énoncé.
- source_word: וְהַזּוּרֶה
  choice: si l’on en écrase un
  rationale: La forme est difficile, mais elle est généralement comprise comme désignant un œuf pressé ou écrasé. La tournure conditionnelle rend clairement son rapport avec l’apparition du serpent sans alourdir le français.
- source_word: תִּבָּקַע אֶפְעֶה
  choice: une vipère en sort
  rationale: La forme verbale évoque quelque chose qui fend son enveloppe et surgit. Dans le contexte d’un œuf écrasé, « en sort » restitue naturellement l’image, tandis que « vipère » traduit le serpent venimeux אֶפְעֶה.
