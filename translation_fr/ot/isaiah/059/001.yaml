id: ISA.59.1
reference: Isaiah 59:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֛ן לֹֽא קָצְרָ֥ה יַד יְהוָ֖ה מֵֽ/הוֹשִׁ֑יעַ וְ/לֹא כָבְדָ֥ה אָזְנ֖/וֹ מִ/שְּׁמֽוֹעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/001.yaml
  text: Look[a], Yahweh’s hand is not too short to save[b], nor is his ear too dull to hear.
translation:
  language: fr
  text: 'Voici[a] : la main de Yahweh n’est pas trop courte pour sauver[b], ni son oreille trop dure pour entendre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Oui » ou « Assurément » : la particule hébraïque introduit une affirmation emphatique et attire l’attention sur ce qui suit.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la main de Yahweh n’est pas raccourcie pour sauver, et son oreille n’est pas alourdie pour entendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: La particule attire l’attention sur l’affirmation emphatique qui suit. « Voici » reste digne et immédiatement compréhensible, tout en laissant en note la valeur possible de certitude.
- source_word: קָצְרָה יַד
  choice: la main … n’est pas trop courte
  rationale: Cette formulation conserve l’image anthropomorphique hébraïque de la main, qui représente la capacité d’agir, et rend naturellement en français l’idée d’une prétendue incapacité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le tétragramme, rendu ici comme nom propre plutôt que remplacé par un titre.
- source_word: מֵהוֹשִׁיעַ
  choice: pour sauver
  rationale: Dans cette construction, la préposition avec l’infinitif exprime ce que la main serait supposément incapable d’accomplir. « Sauver » rend directement le verbe et convient au contexte.
- source_word: כָבְדָה אָזְנוֹ
  choice: son oreille n’est pas trop dure
  rationale: L’hébreu dit littéralement que l’oreille est « lourde ». En français actuel, « oreille trop dure » exprime plus naturellement l’incapacité à entendre tout en conservant l’image corporelle et le parallélisme.
- source_word: מִשְּׁמוֹעַ
  choice: pour entendre
  rationale: « Entendre » correspond directement au verbe hébreu et évite d’ajouter la nuance volontaire qu’aurait « écouter ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le nom divin lui-même. Le conserver sous la forme « Yahweh » distingue ce nom propre du titre אֲדֹנָי et ne masque pas la donnée du texte source.
- issue: Portée de la négation et capacité divine
  choice: Deux images parallèles nient toute incapacité de Yahweh à sauver ou à entendre
  alternative: 'Paraphraser directement : « Yahweh est parfaitement capable de sauver et d’entendre »'
  rationale: La traduction garde les métaphores de la main et de l’oreille sans les réduire à une proposition doctrinale abstraite; le contraste avec la suite du passage demeure ainsi intact.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe parallèle et les images concrètes du texte hébreu sont conservées. « Trop dure » évite l’étrangeté excessive de « trop lourde » en français courant, tandis que la note donne la forme littérale.
