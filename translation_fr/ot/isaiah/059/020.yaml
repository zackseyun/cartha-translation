  text: וּ/בָ֤א לְ/צִיּוֹן֙ גּוֹאֵ֔ל וּ/לְ/שָׁבֵ֥י פֶ֖שַׁע בְּ/יַֽעֲקֹ֑ב נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
translation:
  language: fr
  text: Un rédempteur[a] viendra à Sion[b], et vers ceux de Jacob qui se détournent de la transgression[c][d], déclare l’Éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rédempteur » traduit l’hébreu go’el, terme désignant celui qui délivre ou rachète, souvent avec des connotations de solidarité familiale et d’alliance.
    reason: cultural_note
  - marker: b
    text: Ou « pour Sion » ; la préposition hébraïque peut parfois avoir ce sens, bien que « à Sion » convienne ici plus naturellement avec le verbe « venir ».
    reason: lexical_alternative
  - marker: c
    text: Ou « vers les repentants de Jacob » ou « vers ceux de Jacob qui se détournent de leur rébellion ».
    reason: alternative_reading
  - marker: d
    text: Paul cite ce verset en Romains 11.26, avec une formulation en partie différente, sous l’influence de la tradition grecque.
    reason: cross_reference
lexical_decisions:
- source_word: וּבָא
  choice: viendra
  rationale: Le parfait qal, dans ce contexte prophétique, exprime naturellement un événement futur en français.
- source_word: לְצִיּוֹן
  choice: à Sion
  rationale: Avec le verbe « venir », la préposition ל indique le plus naturellement la destination, tout en permettant éventuellement le sens « pour Sion ».
- source_word: גּוֹאֵל
  choice: un rédempteur
  rationale: Le terme גֹּאֵל désigne celui qui délivre, rachète ou revendique ce qui lui revient, souvent avec des connotations familiales et d’alliance. « Rédempteur » en conserve la portée sans préciser davantage son identité.
- source_word: וּלְשָׁבֵי פֶשַׁע
  choice: vers ceux ... qui se détournent de la révolte
  rationale: Le participe de שוב garde ici sa force verbale et décrit un retournement moral. « Révolte » rend la dimension de défi envers l’autorité souvent portée par פֶשַׁע.
- source_word: בְּיַעֲקֹב
  choice: ceux de Jacob
  rationale: Cette formulation française naturelle désigne les personnes appartenant au peuple représenté par Jacob, sans remplacer le nom d’alliance par « Israël ».
- source_word: נְאֻם יְהוָה
  choice: déclare l’Éternel
  rationale: Cette formule rend de manière idiomatique la formule prophétique hébraïque et suit l’usage français courant pour le nom divin dans ce registre.
theological_decisions:
- issue: Identité du rédempteur
  choice: Conserver « un rédempteur » sans identifier explicitement le personnage.
  alternative: L’identifier au Messie ou à l’Éternel lui-même.
  rationale: Le texte hébreu ne précise ici son identité que par le titre גּוֹאֵל. La traduction laisse donc ouverte la tension théologique du passage.
- issue: Sens de שָׁבֵי פֶשַׁע
  choice: « ceux ... qui se détournent de la révolte »
  alternative: « les repentants » ou « ceux qui reviennent de leur rébellion »
  rationale: La traduction verbale conserve la nuance participiale et le mouvement d’éloignement du mal sans introduire un vocabulaire théologique plus systématisé.
- issue: Rapport entre le texte hébreu et Romains 11.26
  choice: Traduire le texte massorétique tel quel et signaler la formulation différente de la citation paulinienne en note.
  alternative: Harmoniser Ésaïe avec la formulation de Romains 11.26.
  rationale: L’harmonisation effacerait une différence textuelle réelle, notamment liée à la tradition grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme directionnel du texte hébreu tout en évitant un tour excessivement littéral. « Révolte » maintient la force relationnelle et morale de פֶשַׁע.
