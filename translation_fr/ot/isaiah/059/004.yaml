  text: אֵין קֹרֵ֣א בְ/צֶ֔דֶק וְ/אֵ֥ין נִשְׁפָּ֖ט בֶּ/אֱמוּנָ֑ה בָּט֤וֹחַ עַל תֹּ֨הוּ֙ וְ/דַבֶּר שָׁ֔וְא הָר֥וֹ עָמָ֖ל וְ/הוֹלֵ֥יד אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
translation:
  language: fr
  text: Personne ne réclame la justice[a], personne ne plaide avec loyauté[b]. Ils se fient au néant[c] et disent des faussetés ; ils conçoivent le malheur et enfantent l’iniquité[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’en appelle à la droiture ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne porte sa cause en justice avec sincérité » ou « ne plaide selon la vérité ».
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « néant » peut aussi signifier « vide », « futilité » ou « ce qui est sans consistance ».
    reason: lexical_alternative
  - marker: d
    text: Ou « le mal » ou « l’injustice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  choice: réclame la justice
  rationale: Dans ce contexte judiciaire, קרא avec ב exprime un appel en faveur de ce qui est juste. « Réclamer la justice » est naturel en français et conserve la portée à la fois morale et judiciaire de צֶדֶק.
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  choice: plaide avec loyauté
  rationale: 'Le nifal de שפט est compris ici dans son sens judiciaire : prendre part à une procédure ou défendre une cause. « Avec loyauté » rend la fiabilité et l’intégrité exprimées par אֱמוּנָה sans réduire le terme à la seule véracité.'
- source_word: בָּטוֹחַ עַל תֹּהוּ
  choice: se fiant au néant
  rationale: בטח signifie se fier à ou compter sur. תֹהוּ évoque le vide, l’irréalité ou ce qui est sans consistance. « Néant » garde l’image forte et la largeur sémantique du terme.
- source_word: וְדַבֶּר שָׁוְא
  choice: et proférant le mensonge
  rationale: שָׁוְא peut désigner le mensonge, la fausseté ou ce qui est vain. Le singulier collectif « le mensonge » conserve cette ampleur morale, tandis que « proférant » s’accorde au mouvement participial de la phrase française.
- source_word: הָרוֹ עָמָל
  choice: ils conçoivent le malheur
  rationale: הרה introduit une métaphore de conception que le français peut conserver. עָמָל désigne ici un mal nuisible, source de peine ou de malheur, plutôt qu’un simple effort pénible.
- source_word: וְהוֹלֵיד אָוֶן
  choice: et enfantent l’iniquité
  rationale: Le hifil de ילד poursuit explicitement la métaphore de la naissance. אָוֶן désigne le mal moral, l’injustice ou l’iniquité ; « iniquité » maintient sa gravité sans le confondre avec עָמָל.
theological_decisions:
- issue: Portée des termes moraux et judiciaires צֶדֶק et אֱמוּנָה
  choice: Rendre צֶדֶק par « justice » et אֱמוּנָה par « loyauté »
  alternative: Employer « droiture » et « vérité »
  rationale: Le passage vise la corruption sociale et judiciaire, mais les mots hébreux ont une portée morale plus large. « Justice » et « loyauté » maintiennent ensemble ces dimensions sans imposer une lecture exclusivement juridique ou doctrinale.
- issue: Relation entre עָמָל et אָוֶן dans la métaphore de la grossesse
  choice: Distinguer « malheur » et « iniquité »
  alternative: Rendre les deux termes par « mal » ou inverser leurs nuances
  rationale: 'Le parallélisme associe les deux réalités sans les identifier tout à fait : עָמָל souligne le tort pénible et destructeur, tandis que אָוֶן met davantage en relief la perversité morale.'
translation_notes:
  register: Français international actuel, soutenu mais accessible. La métaphore continue de la conception et de l’enfantement est conservée. Les tournures « se fiant » et « proférant » rendent la chaîne verbale hébraïque sans introduire un lien causal absent du texte.
