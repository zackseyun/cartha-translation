review_pass:
  verdict: revise
  source_fidelity: La structure et les images corporelles sont bien conservées. Toutefois, « par le crime » pour בֶּעָוֹן interprète et restreint inutilement עָוֹן à une infraction grave précise, alors que le terme peut désigner plus largement la faute, la culpabilité ou l’iniquité. La répétition explicite de « sont souillés » rend aussi clairement en français l’ellipse hébraïque sans modifier le parallélisme. Le parfait דִּבְּרוּ est mieux reflété par « ont prononcé » que par le présent « profèrent ».
  naturalness: La formulation révisée reste naturelle, claire et digne en français international moderne. « Souillés de faute » garde l’image de contamination morale tout en évitant un terme théologique ou juridique trop marqué. « Murmure l’injustice » demeure une restitution poétique acceptable de תֶהְגֶּה.
  terminology: « Faute » préserve mieux l’amplitude de עָוֹן que « crime ». « Mensonge » et « injustice » rendent convenablement שֶׁקֶר et עַוְלָה, en maintenant la distinction lexicale recherchée par le verset. La note sur le dernier verbe est correctement ancrée et ne force pas une seule nuance.
  issues:
  - severity: medium
    issue: « par le crime » restreint indûment עָוֹן.
    rationale: Dans ce contexte, עָוֹן recouvre faute, culpabilité et iniquité; « crime » introduit une spécification pénale et une gravité particulière que le mot hébreu n’impose pas.
  - severity: low
    issue: « vos lèvres profèrent » ne reflète pas aussi directement le parfait hébreu que le passé composé.
    rationale: Le parfait דִּבְּרוּ présente l’accusation comme un fait accompli; « ont prononcé » le restitue simplement en français sans empêcher la portée caractéristique de l’indictment.
