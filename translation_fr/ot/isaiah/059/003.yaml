  text: כִּ֤י כַפֵּי/כֶם֙ נְגֹאֲל֣וּ בַ/דָּ֔ם וְ/אֶצְבְּעוֹתֵי/כֶ֖ם בֶּֽ/עָוֺ֑ן שִׂפְתֽוֹתֵי/כֶם֙ דִּבְּרוּ שֶׁ֔קֶר לְשׁוֹנְ/כֶ֖ם עַוְלָ֥ה תֶהְגֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/003.yaml
  text: For your hands are defiled with blood[a], and your fingers with iniquity; your lips have spoken falsehood[c][b], your tongue mutters injustice.
translation:
  language: fr
  text: Car vos mains sont souillées de sang, et vos doigts sont souillés de faute ; vos lèvres ont prononcé le mensonge, votre langue murmure l’injustice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « votre langue profère l’injustice ». Le verbe hébreu peut signifier « murmurer », « marmonner » ou, plus généralement, « proférer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la cause de l’accusation précédente et conserve naturellement la valeur explicative du texte hébreu.
- source_word: כַפֵּיכֶם
  choice: vos mains
  rationale: Le nom désigne plus précisément les paumes, mais « mains » est la formulation française naturelle dans cette image de culpabilité liée au sang.
- source_word: נְגֹאֲלוּ בַדָּם
  choice: sont souillées de sang
  rationale: Exprime une contamination morale, et non une simple coloration physique, tout en conservant l’image concrète du sang.
- source_word: וְאֶצְבְּעוֹתֵיכֶם בֶּעָוֹן
  choice: et vos doigts par le crime
  rationale: Conserve le parallélisme corporel. עָוֹן peut désigner la faute, la culpabilité ou le crime ; ici, « crime » garde la gravité de l’accusation et s’accorde avec le sang versé.
- source_word: שִׂפְתוֹתֵיכֶם דִּבְּרוּ שֶׁקֶר
  choice: vos lèvres profèrent le mensonge
  rationale: Le présent français rend l’accusation comme une conduite caractéristique dans le contexte poétique ; « profèrent » préserve le registre digne sans archaïsme marqué.
- source_word: לְשׁוֹנְכֶם עַוְלָה תֶהְגֶּה
  choice: votre langue murmure l’injustice
  rationale: « Murmure » conserve l’image concrète de הגה, qui peut évoquer une parole dite à voix basse, tandis qu’« injustice » exprime la dimension sociale et morale de עַוְלָה.
theological_decisions:
- issue: Vocabulaire moral dans l’accusation prophétique
  choice: 'Maintenir des termes distincts : sang, crime, mensonge et injustice.'
  alternative: Uniformiser avec un terme général comme « mal » ou employer partout un vocabulaire théologique traditionnel.
  rationale: L’hébreu accumule des notions apparentées mais différentes. La traduction garde cette pluralité sans introduire de catégories doctrinales ultérieures.
- issue: Valeur de עָוֹן
  choice: crime
  alternative: faute ; culpabilité ; iniquité
  rationale: Le mot reste sémantiquement ample. Dans le parallélisme avec le sang, « crime » communique clairement la faute grave, sans réduire le terme à son seul résultat juridique, la culpabilité.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique des parties du corps est préservé. « Mains » est préféré à « paumes » pour son naturel en français, tandis que « murmure » garde la nuance imagée du verbe hébreu.
