- from: Car vos mains sont souillées de sang, et vos doigts par le crime ; vos lèvres profèrent le mensonge, votre langue murmure l’injustice.[a]
  to: Car vos mains sont souillées de sang, et vos doigts sont souillés de faute ; vos lèvres ont prononcé le mensonge, votre langue murmure l’injustice.[a]
