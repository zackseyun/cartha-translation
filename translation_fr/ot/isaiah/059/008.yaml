  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
translation:
  language: fr
  text: Ils ne connaissent pas le chemin de la paix, et il n’y a aucune justice[a] dans leurs sentiers. Ils se sont fait des routes tortueuses ; quiconque s’y engage ne connaît pas la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun droit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שָׁלוֹם
  choice: le chemin de la paix
  rationale: Conserve la métaphore hébraïque du chemin comme manière de vivre et l’expression prophétique reconnaissable, dans un français naturel.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Dans les deux occurrences, « paix » rend le sens principal tout en laissant résonner les notions plus larges de bien-être et d’intégrité portées par le terme hébreu.
- source_word: יָדְעוּ / יָדַע
  choice: connaissent / connaît
  rationale: Le verbe exprime ici une connaissance vécue et morale, non une simple compréhension intellectuelle. La répétition française reproduit celle de l’hébreu.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Le contexte dénonce une conduite contraire à l’ordre juste. « Justice » communique clairement cette dimension éthique et sociale, tandis que « droit » demeure une possibilité signalée en note.
- source_word: מַעְגְּלוֹתָם
  choice: leurs sentiers
  rationale: Le nom désigne des pistes, ornières ou sentiers figurant les conduites humaines. « Sentiers » est idiomatique et maintient l’image du déplacement.
- source_word: נְתִיבוֹתֵיהֶם עִקְּשׁוּ לָהֶם
  choice: ils se sont fait des routes tortueuses
  rationale: Cette formulation restitue à la fois l’action de rendre les voies tortueuses et la valeur réflexive de לָהֶם, dans un français fluide.
- source_word: כֹּל דֹּרֵךְ בָּהּ
  choice: quiconque s’y engage
  rationale: « Quiconque » rend la portée universelle du participe. Le pronom adverbial « y » permet une formulation naturelle sans trancher lourdement la discordance entre les voies plurielles et le pronom hébreu singulier.
theological_decisions:
- issue: Portée éthique et juridique de מִשְׁפָּט
  choice: justice
  alternative: droit ou jugement
  rationale: « Justice » convient à la dénonciation prophétique d’un ordre moral et social faussé sans réduire le terme à une décision judiciaire précise. La note conserve l’alternative « droit ».
- issue: Nombre du pronom dans בָּהּ après des antécédents pluriels
  choice: quiconque s’y engage
  alternative: quiconque marche sur elle
  rationale: Le singulier hébreu peut reprendre collectivement la voie ou l’ensemble du parcours évoqué. Le français « y » préserve naturellement cette référence sans imposer une harmonisation explicite au pluriel.
translation_notes:
  register: Français international actuel, sobre et digne. Le champ lexical du déplacement est varié (« chemin », « sentiers », « routes ») pour refléter les trois termes hébreux distincts sans rendre le verset artificiel. La répétition de « connaître la paix » encadre le verset comme dans le texte source.
