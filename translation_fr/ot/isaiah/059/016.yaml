id: ISA.59.16
reference: Isaiah 59:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּרְא֙ כִּֽי אֵ֣ין אִ֔ישׁ וַ/יִּשְׁתּוֹמֵ֖ם כִּ֣י אֵ֣ין מַפְגִּ֑יעַ וַ/תּ֤וֹשַֽׁע ל/וֹ֙ זְרֹע֔/וֹ וְ/צִדְקָת֖/וֹ הִ֥יא סְמָכָֽתְ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
translation:
  language: fr
  text: Il vit qu’il n’y avait aucun être humain[a] et fut consterné de ne trouver personne pour intervenir[b]. Alors son propre bras lui apporta le salut, et sa justice[c] le soutint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « aucun homme ». Le singulier masculin hébreu désigne ici l’absence de tout agent humain.
    reason: cultural_note
  - marker: b
    text: Ou « pour intercéder » ou « pour s’interposer ». Le participe hébreu peut désigner quelqu’un qui intervient en faveur d’un autre.
    reason: lexical_alternative
  - marker: c
    text: Ou « sa droiture ». Le terme hébreu peut évoquer à la fois la rectitude et l’action juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: être humain
  rationale: Le nom hébreu est masculin singulier, mais il désigne ici l’absence de tout agent humain. « Être humain » exprime naturellement cette portée en français moderne; la forme littérale est signalée en note.
- source_word: וַיִּשְׁתּוֹמֵם
  choice: fut consterné
  rationale: Le verbe exprime un profond étonnement mêlé de stupeur. « Fut consterné » rend la force émotionnelle et morale du terme dans ce contexte.
- source_word: מַפְגִּיעַ
  choice: pour intervenir
  rationale: Le participe peut désigner quelqu’un qui intervient, s’interpose ou intercède. « Intervenir » conserve une portée assez large et convient au contexte d’injustice sociale sans imposer exclusivement l’idée de prière.
- source_word: וַתּוֹשַׁע
  choice: lui apporta le salut
  rationale: Le verbe féminin a pour sujet « son bras » et décrit l’accomplissement de la délivrance. Cette formulation conserve explicitement la notion de salut.
- source_word: זְרֹעוֹ
  choice: son propre bras
  rationale: 'Le bras symbolise la puissance mise en action. « Propre » explicite sobrement le contraste: faute d’agent humain, le Seigneur agit lui-même.'
- source_word: צִדְקָתוֹ
  choice: sa justice
  rationale: En français, « justice » couvre ici à la fois la rectitude du Seigneur et son action juste. La possibilité de comprendre aussi sa fidélité à ce qui est droit est préservée en note.
- source_word: סְמָכָתְהוּ
  choice: le soutint
  rationale: Le verbe signifie soutenir ou maintenir. « Le soutint » conserve l’image et reste naturel dans un registre digne.
theological_decisions:
- issue: Référence des pronoms et des suffixes
  choice: Les pronoms renvoient au Seigneur, qui accomplit lui-même le salut puisqu’aucun agent humain n’est présent.
  alternative: Lire les dernières propositions de manière plus abstraite, comme une évocation de la puissance et de la justice divines sans accent réflexif marqué.
  rationale: Le contexte immédiat et les suffixes hébreux favorisent une référence constante au Seigneur. Le texte souligne son initiative propre sans introduire de catégorie doctrinale ultérieure.
- issue: Portée de צְדָקָה
  choice: justice
  alternative: droiture
  rationale: Le terme peut désigner la conformité à ce qui est droit, la droiture et l’action juste. « Justice » est ici idiomatique et s’accorde avec le contexte d’Isaïe 59, tandis que la note maintient la largeur sémantique.
- issue: Fonction de מַפְגִּיעַ
  choice: intervenir
  alternative: intercéder ou s’interposer
  rationale: Le contexte permet l’idée d’une personne qui se porte en avant pour autrui, mais ne précise pas sans ambiguïté s’il s’agit d’une intervention concrète ou d’une intercession. Le choix principal reste donc général.
translation_notes:
  register: 'Français international moderne, naturel et digne. La syntaxe garde la progression du texte hébreu: constat, consternation, puis action salvatrice du Seigneur. Les images du bras et du soutien sont conservées.'
