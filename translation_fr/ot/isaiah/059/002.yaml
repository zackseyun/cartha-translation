source:
  edition: WLC
  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
translation:
  language: fr
  text: Mais ce sont vos fautes qui vous séparent de votre Dieu, et vos péchés l’amènent à vous cacher son visage, de sorte qu’il ne vous écoute pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais ce sont
  rationale: 'Dans le contexte, l’expression oppose la cause réelle exposée ici à l’affirmation du verset précédent : ce n’est pas une incapacité de Dieu, mais les fautes du peuple. La tournure française met naturellement cette opposition en relief.'
- source_word: עֲוֺנֹתֵיכֶם
  choice: vos fautes
  rationale: « Fautes » exprime ici les actes coupables et reste distinct de « péchés », tout en étant plus courant en français moderne que « iniquités ».
- source_word: הָיוּ מַבְדִּלִים
  choice: qui vous séparent
  rationale: La construction avec היה et le participe décrit une séparation effective et persistante. Le présent français exprime naturellement cet état résultant sans reproduire une tournure hébraïque pesante.
- source_word: בֵּינֵיכֶם לְבֵין אֱלֹהֵיכֶם
  choice: de votre Dieu
  rationale: Avec « séparer », le français emploie naturellement « séparer quelqu’un de quelqu’un ». Cette formulation rend fidèlement la séparation entre les deux parties.
- source_word: וְחַטֹּאותֵיכֶם
  choice: et vos péchés
  rationale: « Péchés » est le terme français direct et usuel; il maintient le parallélisme tout en restant lexicalement distinct de « fautes ».
- source_word: הִסְתִּירוּ פָנִים מִכֶּם
  choice: vous ont caché son visage
  rationale: Cette formulation conserve comme sujet les péchés du peuple et préserve l’image concrète du visage divin caché, sans la réduire à une abstraction telle que le retrait de la faveur.
- source_word: מִשְּׁמוֹעַ
  choice: si bien qu’il ne vous écoute pas
  rationale: La préposition מִן devant l’infinitif exprime ici l’effet ou la conséquence. La tournure française rend clairement ce rapport et explicite l’objet « vous », déjà présent dans le contexte.
theological_decisions:
- issue: Langage anthropomorphique du visage divin caché
  choice: Conserver « son visage »
  alternative: « il vous a retiré sa faveur » ou « il s’est détourné de vous »
  rationale: Le texte hébreu emploie explicitement l’image du visage. La conserver maintient la force relationnelle et littéraire de l’éloignement sans substituer une interprétation abstraite à la métaphore.
- issue: Cause morale de la séparation
  choice: Présenter les fautes et les péchés du peuple comme la cause de la rupture et de l’absence d’écoute
  alternative: Formuler seulement que Dieu s’est éloigné du peuple
  rationale: Le verset attribue expressément la séparation aux fautes humaines, en contraste avec toute idée d’impuissance divine au verset précédent.
- issue: Portée de מִשְּׁמוֹעַ
  choice: « si bien qu’il ne vous écoute pas »
  alternative: « afin qu’il ne vous écoute pas »
  rationale: La formulation consécutive préserve le lien entre le visage caché et l’absence d’écoute sans suggérer que le but recherché par les péchés serait d’empêcher Dieu d’écouter.
translation_notes:
  register: Français international moderne, naturel et digne. « Fautes » évite l’archaïsme relatif d’« iniquités », tandis que « péchés » conserve le vocabulaire moral propre au passage. « Visage » maintient l’image hébraïque dans un français plus courant que l’expression biblique traditionnelle « cacher sa face ».
