  text: כְּ/עַ֤ל גְּמֻלוֹת֙ כְּ/עַ֣ל יְשַׁלֵּ֔ם חֵמָ֣ה לְ/צָרָ֔י/ו גְּמ֖וּל לְ/אֹֽיְבָ֑י/ו לָ/אִיִּ֖ים גְּמ֥וּל יְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
translation:
  language: fr
  text: 'Il rendra selon leurs actes : à ses adversaires, sa fureur ; à ses ennemis, leur rétribution ; aux terres côtières[a], il rendra ce qui leur est dû.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux îles ». Le terme hébreu peut désigner des îles ou des territoires côtiers maritimes ; dans Ésaïe, il évoque souvent, plus largement, des nations lointaines situées au-delà de la mer ou sur ses rivages.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַל גְּמֻלוֹת כְּעַל
  choice: à chacun selon ses actes
  rationale: Cette formulation française exprime naturellement la correspondance proportionnelle soulignée par la construction hébraïque répétée. « Chacun » est explicité pour rendre intelligible le complément implicite sans identifier davantage les personnes visées.
- source_word: יְשַׁלֵּם
  choice: il rendra
  rationale: Le piel de שׁלם exprime ici l’idée de rendre ou payer en retour. « Rendra » convient au contexte judiciaire et permet de conserver le parallélisme des compléments.
- source_word: חֵמָה
  choice: sa fureur
  rationale: « Fureur » rend l’intensité de חֵמָה. Le possessif, implicite dans le contexte, permet une formulation française naturelle tout en rattachant cette fureur au sujet divin.
- source_word: לְצָרָיו
  choice: à ses adversaires
  rationale: « Adversaires » conserve le sens général de personnes hostiles sans préciser indûment la nature de leur opposition.
- source_word: גְּמוּל
  choice: rétribution
  rationale: « Rétribution » maintient le motif judiciaire du paiement en retour et le lien lexical avec les actes appelant une réponse.
- source_word: לְאֹיְבָיו
  choice: à ses ennemis
  rationale: Équivalent français direct et naturel dans ce contexte de conflit et de jugement.
- source_word: לָאִיִּים
  choice: aux terres côtières
  rationale: Dans Ésaïe, אִיִּים désigne souvent des territoires maritimes éloignés, qu’il s’agisse d’îles ou de côtes. « Terres côtières » conserve cette amplitude géographique.
- source_word: גְּמוּל יְשַׁלֵּם
  choice: il rendra ce qui leur est dû
  rationale: L’expression évite le calque maladroit « rendra une rétribution » tout en préservant l’insistance hébraïque sur le paiement intégral de ce qui est dû.
theological_decisions:
- issue: Référent du sujet des verbes à la troisième personne du singulier
  choice: Conserver simplement « il » sans ajouter « le Seigneur »
  alternative: Expliciter « le Seigneur »
  rationale: Le contexte immédiat identifie le guerrier divin comme sujet, mais le verset hébreu ne répète pas son nom. Le pronom respecte la progression du discours et n’ajoute aucun titre.
- issue: Valeur du groupe initial de la racine גמל
  choice: 'Le comprendre comme la mesure du jugement : « à chacun selon ses actes »'
  alternative: Traduire littéralement « selon les rétributions »
  rationale: La construction souligne une réponse proportionnée à ce qui a été fait. Une traduction abstraite par « rétributions » serait obscure ici, tandis que le second emploi de גְּמוּל conserve explicitement le motif de la rétribution.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure en trois membres conserve le rythme judiciaire du texte, et la reprise finale de « il rendra » maintient l’insistance de l’hébreu sans produire une répétition maladroite.
