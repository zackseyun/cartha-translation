source:
  edition: WLC
  text: וַ/תְּהִ֤י הָֽ/אֱמֶת֙ נֶעְדֶּ֔רֶת וְ/סָ֥ר מֵ/רָ֖ע מִשְׁתּוֹלֵ֑ל וַ/יַּ֧רְא יְהוָ֛ה וַ/יֵּ֥רַע בְּ/עֵינָ֖י/ו כִּֽי אֵ֥ין מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
translation:
  language: fr
  text: Ainsi, la vérité faisait défaut, et celui qui se détournait du mal devenait une proie[a]. Yahweh le vit, et il trouva mauvais[b] qu’il n’y ait pas de justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se faisait dépouiller ». Le terme hébreu est rare et présente celui qui renonce au mal comme une victime.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce fut mauvais à ses yeux ».'
    reason: source_idiom
lexical_decisions:
- source_word: הָאֱמֶת
  choice: la vérité
  rationale: אֱמֶת peut désigner la vérité ou la fidélité. Dans le contexte de l’effondrement moral, social et judiciaire décrit aux versets 14–15, « la vérité » exprime le plus directement le sens public et éthique du terme.
- source_word: נֶעְדֶּרֶת
  choice: avait disparu
  rationale: Le participe nifal exprime ici l’absence ou la disparition. « Avait disparu » est naturel en français et s’accorde avec le constat dressé dans le contexte immédiat.
- source_word: וְסָר מֵרָע
  choice: celui qui se détournait du mal
  rationale: Le participe masculin singulier a une valeur générique. Cette formulation française garde la figure concrète d’une personne qui renonce activement au mal sans limiter le propos aux hommes.
- source_word: מִשְׁתּוֹלֵל
  choice: devenait une proie
  rationale: Cette forme rare évoque vraisemblablement le fait de devenir une proie ou d’être dépouillé. « Devenait une proie » conserve l’image de la victimisation sans imposer un type précis de violence ou de perte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: il considéra comme un mal
  rationale: Cette formulation française naturelle conserve la portée morale de רָע, plus forte que le simple déplaisir, tout en évitant le calque peu idiomatique « ce fut mauvais à ses yeux ».
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Dans ce contexte social et judiciaire, מִשְׁפָּט désigne la justice, c’est-à-dire un ordre moral et juridique conforme au droit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le tétragramme comme nom divin. Sa transcription préserve la distinction entre le nom propre et un titre.
- issue: Valeur générique du participe masculin וְסָר
  choice: celui qui se détournait du mal
  alternative: l’homme qui se détournait du mal
  rationale: Le masculin singulier représente ici toute personne adoptant cette conduite; « celui qui » maintient la forme singulière sans ajouter une restriction de sexe absente de la portée du passage.
- issue: Portée morale de וַיֵּרַע בְּעֵינָיו
  choice: il considéra comme un mal
  alternative: cela lui déplut
  rationale: Le choix retenu conserve l’évaluation morale explicite de la situation et ne réduit pas la réaction divine à une simple émotion de déplaisir.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement du texte hébreu, tandis que les idiomes sont rendus naturellement. L’image de la proie et la qualification morale du défaut de justice sont maintenues.
