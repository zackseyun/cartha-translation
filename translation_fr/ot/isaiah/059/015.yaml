  source_fidelity: Le sens général est bien rendu, y compris la valeur générique de « celui qui » et l’image de la personne qui devient victime en se détournant du mal. Toutefois, « avait disparu » accentue l’idée d’une disparition achevée, là où נֶעְדֶּרֶת exprime plus sobrement le fait de faire défaut. La formulation de la réaction de Yahweh gagne aussi à conserver explicitement l’évaluation de l’absence de justice.
  naturalness: Le français est globalement naturel et de registre approprié. « La vérité faisait défaut » est à la fois plus idiomatique dans ce contexte et plus proche de la valeur stative du participe hébreu. « Il trouva mauvais qu’il n’y ait pas de justice » est naturel sans réduire l’évaluation morale à un simple déplaisir.
  terminology: « Yahweh », « vérité » et « justice » sont appropriés. « Devenait une proie » conserve prudemment l’image et l’incertitude lexicale de מִשְׁתּוֹלֵל; la note maintient l’alternative de la dépossession.
