  to: Ainsi, la vérité faisait défaut, et celui qui se détournait du mal devenait une proie[a]. Yahweh le vit, et il trouva mauvais[b] qu’il n’y ait pas de justice.
  rationale: La révision atténue « avait disparu » en « faisait défaut », qui correspond plus exactement à l’absence exprimée par le participe hébreu. Elle reformule également la dernière proposition pour rendre naturellement l’idiome « mauvais à ses yeux » tout en gardant, par la note, sa forme littérale. L’image ambiguë de la proie et son ancrage de note sont conservés.
