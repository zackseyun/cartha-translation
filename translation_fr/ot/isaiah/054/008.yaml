base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
translation:
  language: fr
  text: « Dans un débordement de colère, je t’ai caché mon visage un instant[a] ; mais, dans un amour fidèle et éternel[b], j’ai eu compassion de toi, dit Yahvé, ton rédempteur. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Dans un brusque accès de colère » ou « Dans une colère débordante ». L’expression hébraïque est rare et renforce l’idée de colère.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec un amour inébranlable pour toujours ». Le mot hébreu חֶסֶד peut exprimer à la fois l’amour, la fidélité, la bonté et la loyauté dans une relation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  choice: dans un débordement de colère
  rationale: Les deux noms forment une expression intensive. Le rare שֶׁצֶף évoque vraisemblablement un débordement ou un brusque déchaînement, tandis que קֶצֶף désigne la colère. Cette formulation conserve la force et la concision de l’image.
- source_word: הִסְתַּרְתִּי פָנַי
  choice: je t’ai caché mon visage
  rationale: Traduction directe de l’expression hébraïque désignant le retrait de la faveur ou de la présence, sans remplacer l’image par une explication.
- source_word: רֶגַע
  choice: un instant
  rationale: Le mot désigne une très courte durée et crée un contraste net avec l’amour qualifié d’éternel.
- source_word: וּבְחֶסֶד עוֹלָם
  choice: mais avec un amour fidèle éternel
  rationale: חֶסֶד associe amour, fidélité, bienveillance et loyauté relationnelle. « Amour fidèle » garde cette richesse sans ajouter explicitement le mot « alliance »; « éternel » rend עוֹלָם.
- source_word: רִחַמְתִּיךְ
  choice: je t’ai montré ma compassion
  rationale: Le verbe רחם exprime une compassion profonde et miséricordieuse. Cette tournure française est naturelle et respecte l’accompli hébreu.
- source_word: גֹּאֲלֵךְ
  choice: celui qui te rachète
  rationale: גֹּאֵל désigne celui qui intervient pour délivrer ou racheter, avec parfois une nuance familiale. La périphrase est claire en français et évite de surcharger le verset du sens technique de « rédempteur ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée de חֶסֶד dans ce contexte
  choice: amour fidèle éternel
  alternative: amour éternel lié à l’alliance
  rationale: Le contexte est relationnel et peut évoquer la fidélité à l’alliance, mais le mot « alliance » n’apparaît pas dans le texte. La traduction retenue préserve cette portée possible sans la rendre explicite à tort.
- issue: Sens de גֹּאֵל
  choice: celui qui te rachète
  alternative: ton rédempteur
  rationale: La traduction verbale exprime l’action salvatrice sans imposer ici un sens technique ou une identification théologique plus précise que celle du texte.
- issue: Nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. Sa transcription préserve cette donnée de l’hébreu plutôt que de la remplacer par un titre.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement conserve l’adresse directe à Sion, grammaticalement féminine en hébreu, sans qu’il soit nécessaire de marquer son genre dans cette formulation. La ponctuation met en relief le contraste entre l’instant de colère et l’amour éternel.
