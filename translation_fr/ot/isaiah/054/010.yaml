  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י הֶֽ/הָרִים֙ יָמ֔וּשׁוּ וְ/הַ/גְּבָע֖וֹת תְּמוּטֶ֑נָה וְ/חַסְדִּ֞/י מֵ/אִתֵּ֣/ךְ לֹֽא יָמ֗וּשׁ וּ/בְרִ֤ית שְׁלוֹמִ/י֙ לֹ֣א תָמ֔וּט אָמַ֥ר מְרַחֲמֵ֖/ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/010.yaml
  text: For the mountains may depart and the hills may be shaken[a], but my steadfast love will not depart from you, and my covenant of peace will not be shaken, says Yahweh[c][b], who has compassion on you.
translation:
  language: fr
  text: Car les montagnes peuvent s’éloigner et les collines être ébranlées[a], mais mon amour fidèle[b] ne s’éloignera pas de toi, et mon alliance de paix[c] ne sera pas ébranlée, dit Yahweh, qui a compassion de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Même si les montagnes s’éloignaient et les collines étaient ébranlées ». Le texte oppose leur instabilité possible à la permanence de l’amour de Yahweh.'
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: L’« amour fidèle » traduit חֶסֶד, terme qui peut aussi évoquer un amour loyal, lié à un engagement.
    reason: alternative lexicale
  - marker: c
    text: Ou « mon alliance de bien-être ». Le mot hébreu שָׁלוֹם désigne aussi l’intégrité et le bien-être, et pas seulement l’absence de conflit.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Même si
  rationale: Dans cette construction, כִּי introduit l’éventualité extrême mise en contraste avec la permanence de l’amour de Yahweh. « Même si » rend naturellement cette valeur concessive en français, sans transformer l’image en prédiction.
- source_word: יָמוּשׁוּ / לֹא יָמוּשׁ
  choice: s’éloignaient / ne s’éloignera pas
  rationale: Le même verbe מוּשׁ est repris pour les montagnes puis pour l’amour de Yahweh. La répétition de « s’éloigner » conserve ce lien verbal et l’idée de retrait.
- source_word: תְּמוּטֶנָה / לֹא תָמוּט
  choice: étaient ébranlées / ne sera pas ébranlée
  rationale: La répétition de מוֹט met en parallèle l’instabilité possible des collines et l’inébranlable alliance. « Être ébranlé » est naturel en français et préserve cette opposition.
- source_word: חַסְדִּי
  choice: mon amour fidèle
  rationale: חֶסֶד désigne ici un amour loyal, durable et engagé. « Amour fidèle » exprime ces dimensions sans recourir à un terme archaïque ni réduire le mot à une notion doctrinale particulière.
- source_word: בְרִית שְׁלוֹמִי
  choice: mon alliance de paix
  rationale: Cette expression rend directement בְּרִית et שָׁלוֹם, tout en conservant une formulation française naturelle et les résonances bibliques de l’expression.
- source_word: מְרַחֲמֵךְ
  choice: qui a compassion de toi
  rationale: Le participe présente Yahweh comme celui qui éprouve et manifeste de la compassion envers l’interlocutrice, Sion personnifiée. La proposition relative est claire et naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Valeur de כִּי au début du verset
  choice: 'Lecture concessive : « Même si »'
  alternative: 'Lecture explicative ou causale : « Car »'
  rationale: Le contraste entre l’éventuelle disparition des éléments les plus stables du monde et la permanence de l’amour divin favorise la lecture concessive. La note signale néanmoins l’autre valeur grammaticale possible.
- issue: Portée de חֶסֶד
  choice: « amour fidèle »
  alternative: « bonté », « amour loyal » ou « amour d’alliance »
  rationale: « Amour fidèle » maintient ensemble l’affection, la loyauté et la permanence impliquées ici, tandis que la mention immédiate de l’alliance laisse paraître la dimension relationnelle sans l’ajouter explicitement au terme.
- issue: Portée de שָׁלוֹם
  choice: « paix »
  alternative: « bien-être » ou « plénitude »
  rationale: « Paix » est la traduction principale la plus reconnue, mais une note rappelle que שָׁלוֹם dépasse la seule absence de conflit et peut inclure l’intégrité et le bien-être.
translation_notes:
  register: Français international moderne, digne et accessible. Le conditionnel imparfait après « même si » présente la disparition des montagnes et l’ébranlement des collines comme une éventualité extrême; le futur de la principale affirme nettement la permanence de l’amour et de l’alliance. Les répétitions des deux verbes hébreux sont conservées séparément en français.
