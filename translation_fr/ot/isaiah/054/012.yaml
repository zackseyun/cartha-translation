base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
translation:
  language: fr
  text: Je ferai tes créneaux[b] de rubis[a], tes portes de pierres étincelantes[c], et toutes tes frontières de pierres précieuses[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu כַּדְכֹד désigne probablement une pierre rouge ou brillante, mais son identification est incertaine; on pourrait aussi traduire « grenat » ou « jaspe rouge ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu rendu par « créneaux » est rare; il peut aussi être compris comme « fenêtres » ou « couronnements ».
    reason: lexical_alternative
  - marker: c
    text: L’expression rendue par « pierres étincelantes » désigne une pierre brillante ou flamboyante dont la nature exacte demeure inconnue; des traductions plus anciennes emploient souvent « escarboucles ».
    reason: lexical_alternative
  - marker: d
    text: Ou « toutes tes limites » ou « tout ton territoire »; l’image de la ville favorise ici une compréhension architecturale des frontières.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je ferai
  rationale: Le verbe שׂוּם peut signifier « placer », « établir » ou « faire ». Dans cette évocation de construction, « je ferai » est naturel et conserve l’action divine qui façonne la ville.
- source_word: כַּדְכֹד
  choice: rubis
  rationale: Le minéral désigné reste incertain, mais il s’agit vraisemblablement d’une pierre rouge ou brillante. « Rubis » est une désignation traditionnelle et intelligible, accompagnée d’une note signalant l’incertitude.
- source_word: שִׁמְשֹׁתַיִךְ
  choice: tes créneaux
  rationale: Ce nom rare désigne probablement un élément architectural bien visible; « créneaux » convient à l’ensemble formé par les portes et l’enceinte, sans masquer les autres analyses possibles, indiquées en note.
- source_word: וּשְׁעָרַיִךְ
  choice: tes portes
  rationale: Traduction courante de שַׁעַר dans le contexte d’une ville.
- source_word: לְאַבְנֵי אֶקְדָּח
  choice: de pierres étincelantes
  rationale: אֶקְדָּח évoque vraisemblablement une pierre éclatante ou comme embrasée, dont l’identification précise est inconnue. Cette formulation restitue son éclat sans lui attribuer un minéral certain.
- source_word: וְכָל גְּבוּלֵךְ
  choice: et toute ton enceinte
  rationale: גְּבוּל peut désigner une limite, un territoire ou une bordure. Dans l’image architecturale immédiate, « enceinte » exprime naturellement le pourtour construit de la ville tout en conservant l’idée de délimitation.
- source_word: לְאַבְנֵי חֵפֶץ
  choice: de pierres précieuses
  rationale: חֵפֶץ exprime ce qui est désiré ou apprécié. Appliqué à des pierres ornementales, « pierres précieuses » rend clairement leur beauté et leur grande valeur.
