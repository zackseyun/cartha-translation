  source_fidelity: 'Le texte rend fidèlement les principaux éléments de l’hébreu : כִּי par « Car », l’expansion « à droite et à gauche », le collectif זַרְעֵךְ par « ta descendance », ירשׁ par « prendra possession de », et le hiphil יוֹשִׁיבוּ par « fera habiter ». « Prendra possession de nations » conserve prudemment la portée de ירשׁ sans imposer exclusivement le sens de dépossession.'
