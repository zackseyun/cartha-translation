id: ISA.54.3
reference: Isaiah 54:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי יָמִ֥ין וּ/שְׂמֹ֖אול תִּפְרֹ֑צִי וְ/זַרְעֵ/ךְ֙ גּוֹיִ֣ם יִירָ֔שׁ וְ/עָרִ֥ים נְשַׁמּ֖וֹת יוֹשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/003.yaml
  text: For you will spread out to the right and to the left[b][a], and your offspring will possess nations and will settle desolate cities.
translation:
  language: fr
  text: Car tu t’étendras à droite et à gauche, ta descendance prendra possession de nations[a] et fera habiter des villes dévastées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « héritera de nations » ou « dépossédera des nations ». Le verbe hébreu peut signifier hériter, prendre possession ou déposséder selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fera habiter des villes dévastées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la promesse et l’exhortation précédentes.
- source_word: יָמִין וּשְׂמֹאול
  choice: à droite et à gauche
  rationale: Conserve l’image spatiale concrète d’une expansion dans les deux directions sans la transformer en points cardinaux.
- source_word: תִּפְרֹצִי
  choice: tu t’étendras
  rationale: Dans ce contexte d’élargissement, rend naturellement l’idée de franchir ses limites et de se répandre.
- source_word: וְזַרְעֵךְ
  choice: ta descendance
  rationale: Rend le collectif זֶרַע dans un français moderne et naturel.
- source_word: גּוֹיִם
  choice: nations
  rationale: Sens direct dans ce contexte; « païens » introduirait une opposition religieuse qui n’est pas explicite.
- source_word: יִירָשׁ
  choice: prendra possession de
  rationale: Préserve ici le sens territorial de ירשׁ tout en laissant en note les nuances possibles d’hériter et de déposséder.
- source_word: עָרִים נְשַׁמּוֹת
  choice: des villes dévastées
  rationale: Exprime des villes laissées en ruines ou désolées tout en gardant le registre prophétique.
- source_word: יוֹשִׁיבוּ
  choice: fera habiter
  rationale: 'Rend explicitement la valeur causative du hiphil: la descendance fera que ces villes soient de nouveau habitées.'
theological_decisions:
- issue: Sens de ירשׁ lorsque גּוֹיִם est son complément
  choice: prendra possession de nations
  alternative: héritera de nations; dépossédera des nations
  rationale: Le verbe peut exprimer l’héritage, la prise de possession ou la dépossession. La formulation retenue conserve la dimension territoriale de la promesse sans imposer le mécanisme de conquête; la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement féminin singulier correspond à Sion personnifiée. L’ordre des notes suit leur apparition dans le texte.
