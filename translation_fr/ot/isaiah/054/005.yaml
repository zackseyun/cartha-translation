id: ISA.54.5
reference: Isaiah 54:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י בֹעֲלַ֨יִ/ךְ֙ עֹשַׂ֔יִ/ךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ וְ/גֹֽאֲלֵ/ךְ֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל אֱלֹהֵ֥י כָל הָ/אָ֖רֶץ יִקָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
translation:
  language: fr
  text: 'Car ton époux est ton Créateur : Yahvé des armées est son nom. Ton Rédempteur est le Saint d’Israël ; il est appelé le Dieu de toute la terre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il sera appelé le Dieu de toute la terre ».'
    reason: La forme verbale hébraïque peut désigner soit une appellation actuelle et générale, soit une appellation future.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’assurance donnée précédemment et conserve clairement le lien logique.
- source_word: בֹעֲלַיִךְ
  choice: ton époux
  rationale: Dans l’image où Sion est présentée comme une femme, le sens conjugal de בעל est premier ; « époux » restitue cette métaphore sans la réduire à une relation de maîtrise.
- source_word: עֹשַׂיִךְ
  choice: ton Créateur
  rationale: Le participe fonctionne ici comme un titre divin. « Créateur » est naturel en français et conserve la relation appositionnelle avec « ton époux ».
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » rend le nom divin, tandis que « des armées » exprime de façon transparente le sens de צְבָאוֹת sans recourir au traditionnel mais aujourd’hui opaque « des puissances » ou « des armées célestes ».
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: Conserve la formule solennelle d’identification divine et la cadence de l’hébreu.
- source_word: וְגֹאֲלֵךְ
  choice: Ton Rédempteur
  rationale: גאל évoque celui qui délivre ou rachète, avec de possibles connotations de solidarité familiale. « Rédempteur » garde le titre établi sans expliciter excessivement ces connotations.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Reproduit le titre divin caractéristique du livre d’Ésaïe de manière concise et traditionnelle.
- source_word: אֱלֹהֵי כָל הָאָרֶץ
  choice: Dieu de toute la terre
  rationale: Exprime directement la portée universelle du groupe construit hébreu.
- source_word: יִקָּרֵא
  choice: il est appelé
  rationale: L’imparfait niphal peut ici décrire une appellation reconnue et durable. Le présent français convient au contexte, tout en signalant en note la lecture future possible.
theological_decisions:
- issue: Métaphore conjugale entre Yahvé et Sion
  choice: Conserver explicitement « ton époux »
  alternative: « ton maître » ou « ton seigneur »
  rationale: Le contexte personnifie Sion comme une femme et favorise le sens conjugal de בעל. Cette formulation préserve l’image relationnelle et d’alliance sans lui ajouter une construction doctrinale étrangère au verset.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: « Yahvé des armées »
  alternative: « le Seigneur des armées » ou « le Seigneur des puissances »
  rationale: Le choix maintient le nom divin et rend le sens militaire ou collectif de צְבָאוֹת dans un français compréhensible, sans substituer un titre au tétragramme.
- issue: Valeur temporelle de יִקָּרֵא
  choice: 'Présent : « il est appelé »'
  alternative: 'Futur : « il sera appelé »'
  rationale: Le présent exprime naturellement une désignation reconnue, mais la forme verbale hébraïque permet aussi une lecture future ; cette possibilité est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. Les titres divins sont conservés, la métaphore conjugale reste explicite et le tutoiement féminin adressé à Sion est respecté.
