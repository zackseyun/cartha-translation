id: ISA.54.14
reference: Isaiah 54:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ/צְדָקָ֖ה תִּכּוֹנָ֑נִי רַחֲקִ֤י מֵ/עֹ֨שֶׁק֙ כִּֽי לֹ֣א תִירָ֔אִי וּ/מִ֨/מְּחִתָּ֔ה כִּ֥י לֹֽא תִקְרַ֖ב אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
translation:
  language: fr
  text: Dans la justice, tu seras affermie[a]. Tiens-toi loin de l’oppression, car tu ne craindras pas, et loin de la terreur[b], car elle ne s’approchera pas de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par la justice, tu seras affermie. » La préposition hébraïque peut exprimer aussi bien le moyen que le domaine.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « terreur » peut aussi signifier « destruction » ou « ruine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּצְדָקָה
  choice: Dans la justice
  rationale: La préposition ב peut indiquer le domaine (« dans ») ou le moyen (« par »). « Dans la justice » conserve cette formulation compacte sans réduire צְדָקָה à la seule équité sociale.
- source_word: תִּכּוֹנָנִי
  choice: tu seras affermie
  rationale: La forme exprime l’établissement dans un état ferme. Le féminin singulier est rendu explicitement, conformément à l’adresse à Sion/Jérusalem dans le contexte.
- source_word: רַחֲקִי
  choice: Tiens-toi loin
  rationale: L’impératif féminin singulier appelle la destinataire à se maintenir à distance. Cette formulation garde la valeur injonctive de l’hébreu tout en restant naturelle en français.
- source_word: מֵעֹשֶׁק
  choice: de l’oppression
  rationale: עֹשֶׁק désigne largement l’oppression, l’exploitation ou l’extorsion. « Oppression » convient le mieux à la menace générale évoquée ici.
- source_word: כִּי לֹא תִירָאִי
  choice: car tu ne craindras pas
  rationale: Le futur garde la tonalité d’assurance de l’inaccompli hébreu sans le transformer en permission ou en simple possibilité.
- source_word: וּמִמְּחִתָּה
  choice: et loin de la terreur
  rationale: מְחִתָּה peut évoquer la terreur, la destruction ou la ruine. « Terreur » s’accorde avec le verbe « craindre » et avec l’image de la menace qui ne s’approche pas.
- source_word: כִּי לֹא תִקְרַב אֵלָיִךְ
  choice: car elle ne s’approchera pas de toi
  rationale: Le pronom français « elle » reprend naturellement « la terreur » et reflète l’accord féminin singulier du verbe hébreu.
theological_decisions:
- issue: Identité et genre de la destinataire
  choice: Maintenir la deuxième personne du féminin singulier sans ajouter son nom
  alternative: Ajouter explicitement « Sion » ou « Jérusalem »
  rationale: Le contexte identifie la destinataire comme Sion/Jérusalem, personnifiée au féminin, mais le verset ne répète pas son nom. Le féminin « affermie » conserve ce trait du texte sans explicitation interprétative.
- issue: Rapport entre justice et affermissement
  choice: « Dans la justice » dans le texte, avec l’alternative instrumentale en note
  alternative: « Par la justice »
  rationale: La préposition hébraïque permet une lecture de domaine ou de moyen. La traduction principale préserve la sphère de la justice, tandis que la note maintient ouverte la lecture instrumentale.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier signale discrètement la personnification de Sion/Jérusalem. La syntaxe conserve le parallélisme hébreu entre l’éloignement de l’oppression et celui de la terreur.
