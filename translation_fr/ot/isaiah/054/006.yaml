    issue: « affligée dans son esprit »
    rationale: La préposition et le possessif ne correspondent pas de près au construit עֲצוּבַת רוּחַ et alourdissent le français. « l’esprit affligé » préserve le sens sans ajout.
  - severity: medium
    issue: Rendu et note de כִּי תִמָּאֵס
    rationale: « Que l’on a rejetée » impose un passé accompli, alors que l'imparfait niphal peut être compris temporellement (« lorsqu’elle est rejetée ») et la syntaxe admet aussi une lecture rhétorique. La note doit signaler ces possibilités sans présenter une lecture interrogative comme certaine.
