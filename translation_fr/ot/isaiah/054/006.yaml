  text: כִּֽי כְ/אִשָּׁ֧ה עֲזוּבָ֛ה וַ/עֲצ֥וּבַת ר֖וּחַ קְרָאָ֣/ךְ יְהוָ֑ה וְ/אֵ֧שֶׁת נְעוּרִ֛ים כִּ֥י תִמָּאֵ֖ס אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
translation:
  language: fr
  text: Car Yahweh t’a appelée comme une épouse abandonnée, l’esprit affligé[a], comme une épouse de jeunesse lorsqu’elle est rejetée[b], dit ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut signifier « femme » ou « épouse » ; le contexte conjugal favorise ici « épouse ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque est concise. « Épouse de jeunesse » désigne une femme mariée dans sa jeunesse. La clause peut aussi être comprise comme « une épouse de jeunesse rejetée » ou, selon une analyse possible de la syntaxe, comme une question rhétorique : « une épouse de jeunesse serait-elle rejetée ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’assurance donnée dans le contexte précédent.
- source_word: כְאִשָּׁה
  choice: comme une épouse
  rationale: אִשָּׁה peut désigner une femme ou une épouse ; la métaphore conjugale du verset favorise « épouse ».
- source_word: עֲזוּבָה
  choice: abandonnée
  rationale: Rend clairement l’idée d’une épouse délaissée tout en conservant la force relationnelle du terme.
- source_word: וַעֲצוּבַת רוּחַ
  choice: et affligée dans son esprit
  rationale: Préserve la mention explicite de רוּחַ et exprime une profonde souffrance intérieure dans un français naturel et digne.
- source_word: קְרָאָךְ
  choice: t’a appelée
  rationale: Le qatal présente l’appel comme accompli ; le pronom féminin singulier adressé à Sion est conservé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: וְאֵשֶׁת נְעוּרִים
  choice: comme une épouse de jeunesse
  rationale: Conserve l’image hébraïque compacte d’une femme épousée dans sa jeunesse sans préciser abusivement de qui il s’agit.
- source_word: כִּי תִמָּאֵס
  choice: que l’on a rejetée
  rationale: Exprime le sens passif du niphal et rattache naturellement la proposition à l’épouse, tout en signalant en note l’ambiguïté syntaxique et les nuances possibles.
- source_word: אָמַר אֱלֹהָיִךְ
  choice: dit ton Dieu
  rationale: Le présent français convient à la formule prophétique et maintient la relation d’alliance exprimée par « ton Dieu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin ; sa transcription préserve sa fonction de nom propre sans remplacer celui-ci par un titre.
- issue: Métaphore conjugale appliquée à Sion
  choice: Conserver directement l’image de l’épouse
  alternative: Généraliser en « femme » ou expliciter par « peuple » ou « ville »
  rationale: Le langage matrimonial appartient explicitement au texte et porte sa force relationnelle ; il ne convient ni de l’effacer ni d’y ajouter une interprétation confessionnelle.
- issue: Sens de כִּי תִמָּאֵס
  choice: 'Proposition descriptive : « que l’on a rejetée »'
  alternative: Lecture temporelle (« lorsque tu es rejetée »), concessive ou interrogative (« une épouse de jeunesse serait-elle rejetée ? »)
  rationale: La proposition hébraïque est très compacte. La lecture retenue s’intègre à la comparaison conjugale, tandis qu’une note conserve les principales possibilités sans trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La structure prophétique et l’adresse féminine à Sion sont maintenues ; les formulations archaïques sont évitées, tandis que les ambiguïtés lexicales et syntaxiques réelles sont signalées en notes.
