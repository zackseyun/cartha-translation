- from: Car Yahweh t’a appelée comme une épouse abandonnée et affligée dans son esprit[a], comme une épouse de jeunesse que l’on a rejetée[b], dit ton Dieu.
  to: Car Yahweh t’a appelée comme une épouse abandonnée, l’esprit affligé[a], comme une épouse de jeunesse lorsqu’elle est rejetée[b], dit ton Dieu.
  rationale: La révision améliore l’idiome français et évite d’ajouter un possessif à « esprit ». Elle remplace le passé imposé par une formulation temporelle qui correspond mieux à l’imparfait hébreu, tout en conservant en note les principales analyses possibles de la clause difficile.
