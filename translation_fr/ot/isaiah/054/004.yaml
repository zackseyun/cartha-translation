id: ISA.54.4
reference: Isaiah 54:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
translation:
  language: fr
  text: N’aie pas peur[a], car tu ne seras pas couverte de honte ; ne sois pas humiliée, car tu ne seras pas déshonorée. Car tu oublieras la honte de ta jeunesse, et tu ne te souviendras plus de l’opprobre de ton veuvage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne crains pas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du déshonneur de ton veuvage ». Le mot hébreu peut désigner le reproche, les outrages ou le déshonneur public.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: La défense s’adresse au féminin singulier à Sion personnifiée. Cette formulation est directe, naturelle en français moderne et conserve la portée de l’impératif négatif.
- source_word: תֵבוֹשִׁי
  choice: tu ne seras pas couverte de honte
  rationale: Le verbe בושׁ peut exprimer la honte subie, la confusion ou la déception. « Être couverte de honte » fait ressortir ici le déshonneur public sans le réduire à un simple sentiment intérieur.
- source_word: תִּכָּלְמִי
  choice: ne sois pas humiliée
  rationale: Le nifal de כלם évoque l’humiliation ou l’atteinte à l’honneur. Le choix reste distinct de בושׁ tout en conservant le parallélisme des termes liés à la honte.
- source_word: תַחְפִּירִי
  choice: tu ne seras pas déshonorée
  rationale: Dans ce contexte, le hifil de חפר renvoie à la disgrâce. « Déshonorée » traduit la dimension sociale du terme et forme un parallèle naturel avec « humiliée ».
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  choice: la honte de ta jeunesse
  rationale: עֲלוּמִים désigne la jeunesse ou le jeune âge. La formulation française est idiomatique et maintient l’image prophétique de Sion comme femme.
- source_word: תִּשְׁכָּחִי
  choice: tu oublieras
  rationale: 'Le futur convient à la promesse de restauration : la honte passée cessera de déterminer l’expérience de Sion.'
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  choice: l’opprobre de ton veuvage
  rationale: חֶרְפָּה désigne le reproche, la honte ou les outrages publics. « Opprobre » conserve cette dimension sociale, tandis que « veuvage » maintient intacte la métaphore conjugale.
- source_word: לֹא תִזְכְּרִי עוֹד
  choice: tu ne te souviendras plus
  rationale: Cette tournure française rend naturellement la négation renforcée par עוֹד, avec le sens de « ne plus se rappeler ».
theological_decisions:
- issue: Référent féminin singulier
  choice: Le verset s’adresse à Sion/Jérusalem personnifiée comme une femme.
  alternative: Une femme particulière non identifiée.
  rationale: Le contexte immédiat d’Ésaïe 54 emploie au féminin singulier les images de l’épouse, de la femme abandonnée et du veuvage pour parler de Sion. La traduction conserve cette adresse féminine sans ajouter le nom de Sion dans le texte.
- issue: Métaphore conjugale du veuvage
  choice: Conserver littéralement « veuvage ».
  alternative: Interpréter par « abandon » ou « désolation ».
  rationale: L’image conjugale participe à la tension théologique entre rupture apparente et restauration. La traduire littéralement évite d’imposer une interprétation explicative.
translation_notes:
  register: Français international moderne, digne et accessible. Les quatre expressions hébraïques liées à la honte sont rendues de manière distincte afin de préserver leur parallélisme sans produire une répétition artificielle. Le féminin singulier et la métaphore du veuvage sont maintenus.
