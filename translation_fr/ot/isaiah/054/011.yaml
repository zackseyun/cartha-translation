id: ISA.54.11
reference: Isaiah 54:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
translation:
  language: fr
  text: Ô toi, l’affligée, battue par la tempête, inconsolée, voici, moi, je vais sertir tes pierres dans l’antimoine[a] et poser tes fondations avec des saphirs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dans l’antimoine » évoque probablement une matière sombre servant à fixer ou à mettre en valeur les pierres ; certains y voient un mortier ou une incrustation de couleur noire.
    reason: cultural_note
  - marker: b
    text: Ou « avec du lapis-lazuli » ; le terme hébreu traditionnellement rendu par « saphirs » peut désigner une pierre précieuse bleue différente du saphir moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנִיָּה
  choice: Malheureuse
  rationale: L’adjectif féminin singulier est une adresse directe à Sion/Jérusalem personnifiée. « Malheureuse » exprime sa détresse sans réduire le terme à la pauvreté matérielle.
- source_word: סֹעֲרָה
  choice: battue par la tempête
  rationale: Le participe évoque une personne malmenée par l’orage; cette formulation conserve l’image dans un français naturel.
- source_word: לֹא נֻחָמָה
  choice: privée de consolation
  rationale: Cette tournure rend clairement l’état passif de celle qui n’a pas été consolée, tout en restant fluide avec les qualificatifs précédents.
- source_word: הִנֵּה אָנֹכִי
  choice: 'voici : moi, je vais'
  rationale: « Voici » marque l’annonce prophétique, tandis que le pronom tonique « moi » préserve l’insistance portée par אָנֹכִי.
- source_word: מַרְבִּיץ
  choice: je vais sertir
  rationale: Le participe hiphil présente l’action divine comme imminente ou vivement annoncée. Dans cette métaphore architecturale et ornementale, « sertir » exprime la mise en place des pierres dans une matière décorative sans la réduire à une simple pose.
- source_word: בַּפּוּךְ
  choice: dans l’antimoine
  rationale: פּוּךְ désigne ordinairement l’antimoine, minéral sombre employé comme fard. Ici, il semble constituer une matière de scellement ou d’ornement; le terme concret est conservé et expliqué en note.
- source_word: אֲבָנַיִךְ
  choice: tes pierres
  rationale: Le sens architectural ordinaire est maintenu; « pierres précieuses » ou « joyaux » préciserait excessivement le texte.
- source_word: וִיסַדְתִּיךְ
  choice: poser tes fondations
  rationale: Le verbe יסד signifie fonder ou établir des fondations. La formulation française explicite naturellement l’image architecturale.
- source_word: בַּסַּפִּירִים
  choice: avec des saphirs
  rationale: « Saphirs » est l’équivalent traditionnel, mais l’identification minéralogique ancienne reste incertaine; « lapis-lazuli » est donc signalé en note.
theological_decisions:
- issue: Identité de la destinataire
  choice: Sion/Jérusalem personnifiée est directement interpellée au féminin singulier.
  alternative: Une femme affligée quelconque, ou plus abstraitement la communauté de l’alliance.
  rationale: Les formes féminines singulières et le contexte d’Ésaïe 54 favorisent Sion/Jérusalem personnifiée. La traduction maintient cette adresse sans ajouter d’identification ecclésiologique.
translation_notes:
  register: Français international moderne, digne et imagé. L’adresse féminine est nette, l’annonce divine garde son relief prophétique, et les termes minéralogiques incertains sont conservés dans le texte avec clarification en notes.
