    rationale: Cette formulation va au-delà de ce que la construction עליך יפול exprime directement et risque d’introduire une interprétation non signalée par le texte. La note doit se limiter aux possibilités pertinentes de « tomber sur/contre toi », ou, selon le contexte, « tomber devant toi ».
  revised_text: 'Voici[a] : si l’on se ligue contre toi, cela ne vient pas de moi[b] ; quiconque se ligue contre toi tombera à cause de toi[c].'
