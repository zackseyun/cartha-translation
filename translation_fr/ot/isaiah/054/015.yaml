  text: הֵ֣ן גּ֥וֹר יָג֛וּר אֶ֖פֶס מֵֽ/אוֹתִ֑/י מִי גָ֥ר אִתָּ֖/ךְ עָלַ֥יִ/ךְ יִפּֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
translation:
  language: fr
  text: 'Voici[a] : si l’on se ligue contre toi, cela ne vient pas de moi[b] ; quiconque se ligue contre toi tombera à cause de toi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Assurément ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « cela ne se fait pas par moi » ou « cela se fait sans moi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tombera sur toi ». Selon la nuance donnée à cette expression, on peut aussi comprendre : « tombera contre toi » ou « tombera devant toi ». Le contexte favorise la chute de l’agresseur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule introduit ici une affirmation appuyée. « Oui » conserve cette force emphatique dans un français actuel et digne.
- source_word: גּוֹר יָגוּר
  choice: si l’on se ligue contre toi
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’idée verbale. Dans ce contexte d’hostilité envers Sion, « se liguer » exprime un rassemblement hostile sans imposer une image militaire trop précise. « Contre toi » explicite la cible, sous-entendue par le contexte et exprimée dans la reprise du verbe.
- source_word: אֶפֶס מֵאוֹתִי
  choice: cela ne vient pas de moi
  rationale: Cette tournure française naturelle conserve la nuance de provenance ou d’initiative, sans trancher plus précisément entre source, autorisation et soutien.
- source_word: מִי גָר אִתָּךְ
  choice: quiconque se ligue contre toi
  rationale: מִי a ici une valeur indéfinie proche de « quiconque ». אִתָּךְ signifie littéralement « avec toi », mais le contexte donne à cette relation un sens hostile, rendu naturellement par « contre toi ».
- source_word: עָלַיִךְ יִפּוֹל
  choice: tombera à cause de toi
  rationale: La construction נפל על admet ici plusieurs nuances. « Tombera à cause de toi » exprime la ruine de l’agresseur en raison de son opposition à Sion, tout en signalant en note les autres lectures possibles.
theological_decisions:
- issue: L’origine ou l’autorisation divine de l’hostilité contre Sion
  choice: Le rassemblement hostile ne vient pas de Dieu.
  alternative: La phrase pourrait signifier plus étroitement qu’il ne se fait pas avec l’aide ou sur l’ordre de Dieu.
  rationale: אֶפֶס מֵאוֹתִי nie explicitement un rapport de provenance avec Dieu, mais la formulation française évite de préciser au-delà du texte la nature exacte de ce rapport.
- issue: Le sort de celui qui s’oppose à Sion
  choice: L’adversaire tombera à cause de son opposition à elle.
  alternative: Il « tombera devant elle », « tombera sur elle » ou « passera de son côté ».
  rationale: Le contexte de protection et de justification favorise la défaite de l’agresseur, mais la note conserve l’ambiguïté réelle de עָלַיִךְ יִפּוֹל.
translation_notes:
  register: Français international moderne, sobre et solennel. « Se liguer » rend le rassemblement hostile de manière intelligible sans surcharger le verset de vocabulaire militaire. Les marqueurs de note suivent l’ordre du texte.
