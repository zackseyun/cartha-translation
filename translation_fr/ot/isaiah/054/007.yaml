  text: בְּ/רֶ֥גַע קָטֹ֖ן עֲזַבְתִּ֑י/ךְ וּ/בְ/רַחֲמִ֥ים גְּדֹלִ֖ים אֲקַבְּצֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/007.yaml
  text: For a brief moment I abandoned you[a], but with great compassion I will gather you.
translation:
  language: fr
  text: Pendant un bref instant, je t’ai abandonnée[a], mais avec une grande compassion, je te rassemblerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je t’ai délaissée ».
    reason: Alternative lexicale possible pour עזב, moins forte que « abandonnée » mais courante dans le registre biblique.
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  choice: pendant un bref instant
  rationale: La combinaison désigne une durée très courte. « Pendant » exprime naturellement la durée, tandis que « bref instant » rend à la fois רֶגַע et קָטֹן sans lourdeur.
- source_word: עֲזַבְתִּיךְ
  choice: je t’ai abandonnée
  rationale: עזב signifie ici laisser, délaisser ou abandonner. « Abandonnée » conserve la force affective et théologique du verbe; l’accord féminin reflète l’interlocutrice féminine singulière, Sion/Jérusalem personnifiée.
- source_word: וּבְרַחֲמִים
  choice: mais avec une compassion
  rationale: Le waw prend naturellement une valeur adversative en raison du contraste entre abandon et restauration. Le pluriel hébreu רַחֲמִים fonctionne comme un nom abstrait et se rend idiomatiquement au singulier en français.
- source_word: גְּדֹלִים
  choice: immense
  rationale: L’adjectif qualifie la compassion comme très grande. « Immense » restitue l’intensité du pluriel hébreu dans un français naturel et digne.
- source_word: אֲקַבְּצֵךְ
  choice: je te rassemblerai
  rationale: Le piel de קבץ exprime l’action de rassembler. Le futur français convient à la promesse de restauration et conserve l’image prophétique sans l’expliciter.
theological_decisions:
- issue: Réalité de l’abandon divin et promesse de restauration
  choice: Conserver l’affirmation directe d’un abandon réel mais très bref, suivie d’un rassemblement motivé par une immense compassion.
  alternative: Atténuer « abandonnée » en « délaissée » ou présenter l’abandon comme seulement apparent.
  rationale: Le texte hébreu emploie directement עזב et ne qualifie pas l’abandon d’apparent. Ses propres limites sont temporelles (« un bref instant ») et son contrepoint est la compassion qui conduit à la restauration; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin singulier est maintenu pour rendre la forme hébraïque et l’adresse à Sion/Jérusalem personnifiée. La formulation reste concise et conserve le contraste marqué du verset.
