  variant: modern international French
source:
  edition: WLC
  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
translation:
  language: fr
  text: Voici, c’est moi qui ai créé le forgeron[a], qui souffle sur le feu de braises et fabrique une arme[b] destinée à son usage[c] ; c’est moi qui ai créé le destructeur pour détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’artisan ». Le terme hébreu est plus large, mais le contexte évoque ici un ouvrier du métal.
    reason: lexical_alternative
  - marker: b
    text: Ou « un instrument » ou « un objet ». Le mot hébreu a un sens large ; dans ce contexte, il désigne probablement une arme.
    reason: lexical_alternative
  - marker: c
    text: Ou « destinée à son œuvre ». Le suffixe hébreu peut renvoyer soit au forgeron, soit à l’objet qu’il fabrique.
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  choice: Oui
  rationale: La particule attire l’attention et renforce l’affirmation. Ici, « Oui » introduit naturellement en français moderne la déclaration solennelle qui suit.
- source_word: אָנֹכִי / וְאָנֹכִי
  choice: c’est moi / c’est aussi moi
  rationale: La construction clivée restitue l’insistance des deux pronoms indépendants et met en relief l’action créatrice de Dieu dans les deux propositions.
- source_word: בָּרָאתִי
  choice: ai créé
  rationale: Le passé composé exprime naturellement en français l’action accomplie dont la portée demeure actuelle.
- source_word: חָרָשׁ
  choice: forgeron
  rationale: Le nom peut désigner plus largement un artisan, mais le feu de charbon, le soufflage et la fabrication d’une arme orientent ici vers le travail du métal.
- source_word: נֹפֵחַ בְּאֵשׁ פֶּחָם
  choice: qui souffle sur le feu de charbon
  rationale: Cette formulation conserve l’image concrète du participe et la construction hébraïque tout en restant idiomatique.
- source_word: וּמוֹצִיא כְלִי
  choice: et en tire une arme
  rationale: כלי est polysémique (« objet, instrument, arme »). Le contexte de fabrication et de destruction favorise « arme » ; « en tire » rend le mouvement de production exprimé par יצא au hiphil.
- source_word: לְמַעֲשֵׂהוּ
  choice: pour son ouvrage
  rationale: Le suffixe masculin singulier peut renvoyer au forgeron ou à l’objet produit. La formulation française conserve une certaine ouverture, explicitée en note.
- source_word: מַשְׁחִית
  choice: le destructeur
  rationale: Le participe hiphil substantivé désigne directement celui qui détruit.
- source_word: לְחַבֵּל
  choice: pour détruire
  rationale: L’infinitif exprime le but ou la fonction. La répétition « destructeur pour détruire », bien que marquée, reflète directement le parallélisme lexical et théologique du texte.
theological_decisions:
- issue: Dieu crée à la fois le forgeron et le destructeur
  choice: Affirmer explicitement, dans les deux membres, que Dieu les a créés
  alternative: Atténuer la seconde affirmation afin de ne pas attribuer directement à Dieu la création du destructeur
  rationale: L’hébreu répète le pronom emphatique et le verbe « créer ». La traduction préserve cette tension théologique sans proposer d’explication étrangère au verset.
translation_notes:
  register: Français international moderne, solennel mais accessible. La construction « c’est moi qui » conserve l’emphase divine ; le point-virgule maintient le parallélisme des deux affirmations.
