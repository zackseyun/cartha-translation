revisions:
- from: Oui, c’est moi qui ai créé le forgeron[a] qui souffle sur le feu de charbon et en tire une arme[b] pour son ouvrage[c] ; c’est aussi moi qui ai créé le destructeur pour détruire.
  to: Voici, c’est moi qui ai créé le forgeron[a], qui souffle sur le feu de braises et fabrique une arme[b] destinée à son usage[c] ; c’est moi qui ai créé le destructeur pour détruire.
  rationale: La révision remplace une expression française peu idiomatique par « feu de braises », rend l’action productive du forgeron de façon plus directe et, surtout, conserve dans le texte l’ambiguïté syntaxique du suffixe hébreu au lieu de la résoudre pour le seul forgeron. Elle préserve l’emphase divine répétée et l’affirmation théologique non atténuée concernant le destructeur.
