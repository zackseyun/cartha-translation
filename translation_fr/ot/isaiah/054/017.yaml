id: ISA.54.17
reference: Isaiah 54:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל כְּלִ֞י יוּצַ֤ר עָלַ֨יִ/ךְ֙ לֹ֣א יִצְלָ֔ח וְ/כָל לָשׁ֛וֹן תָּֽקוּם אִתָּ֥/ךְ לַ/מִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְ/צִדְקָתָ֛/ם מֵ/אִתִּ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
translation:
  language: fr
  text: Aucune arme façonnée contre toi ne réussira[a], et toute langue qui s’élèvera contre toi en justice, tu la condamneras. Tel est l’héritage des serviteurs de Yahweh, et leur justice vient de moi[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne prévaudra ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leur justification vient de moi ». Dans ce contexte judiciaire, le mot hébreu peut désigner le fait d’être reconnu comme étant dans son droit.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי
  choice: arme
  rationale: Dans ce contexte hostile, le terme général désigne un instrument destiné à l’attaque; « arme » rend clairement ce sens.
- source_word: יוּצַר
  choice: façonnée
  rationale: Le passif de יצר évoque ce qui est formé ou façonné; ce choix préserve l’image sans limiter le procédé à la forge.
- source_word: יִצְלָח
  choice: réussira
  rationale: Le verbe signifie prospérer ou réussir; appliqué à une arme, « réussir » exprime qu’elle n’atteindra pas son but.
- source_word: לָשׁוֹן
  choice: langue
  rationale: Le maintien de la métaphore hébraïque conserve la force poétique et reste naturel en français.
- source_word: לַמִּשְׁפָּט
  choice: en justice
  rationale: L’expression marque un cadre judiciaire; « en justice » communique cette dimension sans imposer l’image précise d’un tribunal moderne.
- source_word: תַּרְשִׁיעִי
  choice: tu la condamneras
  rationale: Le hiphil de רשע signifie déclarer coupable ou condamner. Le pronom « la » reprend naturellement « toute langue » en français.
- source_word: נַחֲלַת
  choice: héritage
  rationale: Le nom désigne une possession ou une part reçue; « héritage » convient au ton d’alliance du passage.
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Dans « serviteurs de Yahweh », le mot fonctionne comme un titre relationnel et collectif, plutôt que comme une insistance sur l’asservissement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu.
- source_word: צִדְקָתָם
  choice: leur justice
  rationale: Le terme peut désigner la justice, la droiture ou, dans ce cadre judiciaire, la justification. « Justice » conserve sa largeur sémantique, avec la nuance médico-légale précisée en note.
theological_decisions:
- issue: Sens de צִדְקָתָם dans la dernière proposition
  choice: leur justice vient de moi
  alternative: leur justification vient de moi
  rationale: Le terme peut évoquer aussi bien la qualité ou le statut juste que la décision favorable qui établit ce statut. Le texte principal garde le terme plus large « justice », tandis que la note conserve explicitement la lecture judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier de « toi » renvoie à Sion personnifiée dans le contexte. Le parallélisme militaire et judiciaire est conservé, ainsi que la métaphore de la langue accusatrice.
