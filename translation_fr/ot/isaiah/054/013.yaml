id: ISA.54.13
reference: Isaiah 54:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל בָּנַ֖יִ/ךְ לִמּוּדֵ֣י יְהוָ֑ה וְ/רַ֖ב שְׁל֥וֹם בָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
translation:
  language: fr
  text: Tous tes enfants[a] seront instruits par Yahweh, et grande sera la paix[b] de tes enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils », aux deux occurrences; le mot hébreu peut désigner précisément les fils ou, plus largement, les enfants.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « paix » peut aussi évoquer l’intégrité, le bien-être ou l’épanouissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Tous
  rationale: Dans la continuité poétique du passage, le français peut omettre le « et » initial sans perdre le lien avec le contexte; « tous » rend naturellement la portée collective de כָּל.
- source_word: בָּנַיִ/ךְ
  choice: tes enfants
  rationale: בנים peut désigner les fils au sens strict ou les enfants au sens collectif. Ici, « enfants » convient aux descendants ou habitants de Sion sans limiter indûment la promesse aux hommes; l’autre possibilité est signalée en note.
- source_word: לִמּוּדֵי
  choice: seront instruits
  rationale: Cette forme issue de למד désigne ceux qui sont enseignés ou formés. La tournure prédicative française « seront instruits » exprime clairement cet état et conserve Yahweh comme agent de l’instruction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: וְ/רַב
  choice: et grande sera
  rationale: Cette tournure conserve l’ordre emphatique et la tonalité poétique de l’adjectif prédicatif רַב tout en restant naturelle en français.
- source_word: שְׁלֹום
  choice: la paix
  rationale: « Paix » est l’équivalent français principal de שׁלום dans ce contexte, tandis qu’une note en indique les nuances plus larges de bien-être, d’intégrité et d’épanouissement.
- source_word: בָּנָיִ/ךְ
  choice: tes enfants
  rationale: La répétition française reprend celle de l’hébreu et maintient le même sens collectif qu’à la première occurrence.
theological_decisions:
- issue: Référent des « enfants » dans la promesse adressée à Sion
  choice: Conserver « tes enfants » sans préciser davantage leur identité.
  alternative: « tes fils » ou une explicitation comme « tes habitants »
  rationale: Le texte personnifie Sion ou Jérusalem comme une femme et parle collectivement de sa descendance. La traduction maintient cette image et son ouverture sans imposer une identification ethnique, ecclésiale ou exclusivement masculine.
translation_notes:
  register: Français international moderne, digne et poétique. L’inversion « grande sera » préserve l’accent du texte hébreu sans paraître archaïque. Le nom divin est translittéré « Yahweh ».
