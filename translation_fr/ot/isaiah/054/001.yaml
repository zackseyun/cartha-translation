reference: Isaiah 54:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
translation:
  language: fr
  text: « Pousse des cris de joie, femme stérile, toi qui n’as pas enfanté ! Éclate en chants de joie et jubile, toi qui n’as pas connu les douleurs de l’accouchement ! Car les enfants de la femme désolée sont plus nombreux[a] que ceux de la femme mariée », dit Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car nombreux sont les enfants de la femme désolée, plus que ceux de la femme mariée. » L’hébreu formule la comparaison de manière compacte.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: רָנִּי
  choice: Pousse des cris de joie
  rationale: L’impératif féminin singulier de רנן appelle à une expression vocale et joyeuse. Cette formulation rend à la fois le chant et l’exultation sans réduire le verbe au simple fait de chanter.
- source_word: עֲקָרָה
  choice: femme stérile
  rationale: Le terme désigne une femme qui ne peut avoir d’enfant. « Femme stérile » est clair, actuel et maintient explicitement le référent féminin.
- source_word: לֹא יָלָדָה
  choice: toi qui n’as pas enfanté
  rationale: La forme verbale à la troisième personne féminine décrit ici la femme directement interpellée. Le passage à la deuxième personne est naturel en français dans cette construction vocative.
- source_word: פִּצְחִי רִנָּה
  choice: Éclate en chants de joie
  rationale: פצח évoque le fait d’éclater ou de se mettre soudainement à crier ou chanter, tandis que רנה désigne une clameur joyeuse. L’expression française conserve l’élan poétique.
- source_word: וְצַהֲלִי
  choice: et jubile
  rationale: Le verbe צהל exprime une manifestation sonore et exubérante de joie. « Jubile » évite une répétition lourde tout en gardant cette intensité.
- source_word: לֹא חָלָה
  choice: toi qui n’as pas connu les douleurs de l’accouchement
  rationale: Dans ce contexte, חול/חיל renvoie aux contractions et aux souffrances de l’enfantement. La formulation est précise et immédiatement compréhensible.
- source_word: כִּי רַבִּים ... מִבְּנֵי
  choice: Car ... sont plus nombreux que
  rationale: Avec מן, רַבִּים reçoit naturellement une valeur comparative. Le français exige que cette comparaison soit formulée explicitement.
- source_word: בְּנֵי שׁוֹמֵמָה
  choice: les enfants de la femme abandonnée
  rationale: בנים peut englober l’ensemble des enfants. שוממה décrit celle qui est laissée seule, désertée ou désolée ; « abandonnée » convient à la métaphore conjugale opposée à la femme mariée.
- source_word: מִבְּנֵי בְעוּלָה
  choice: que ceux de la femme mariée
  rationale: בעולה désigne une femme unie à un mari. « Ceux » reprend naturellement « les enfants » et « femme mariée » est concis et courant.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: La formule prophétique est rendue au présent en français. Le nom divin est translittéré afin de préserver le nom propre présent dans l’hébreu.
theological_decisions:
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte hébreu porte explicitement le nom divin. « Yahweh » le traite comme un nom propre plutôt que de le remplacer par un titre.
- issue: Identité symbolique des deux femmes
  choice: Conserver les désignations imagées sans identifier explicitement leurs référents
  alternative: Ajouter « Jérusalem/Sion » ou une interprétation ecclésiologique
  rationale: Le verset lui-même parle de la femme stérile, abandonnée et mariée sans expliciter ici toutes les correspondances. La traduction préserve cette tension métaphorique.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs féminins et l’imagerie de l’enfantement sont conservés. La ponctuation met en valeur le parallélisme et l’élan de l’oracle.
