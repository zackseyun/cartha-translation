- from: Élargis l’espace de ta tente, et que les toiles de tes habitations soient déployées ; ne te retiens pas[a]. Allonge tes cordages et affermis tes piquets[b].
  to: Élargis l’espace de ta tente, que les tentures de tes demeures s’étendent ; ne te retiens pas[a]. Allonge tes cordes et affermis tes piquets[b].
  rationale: La révision améliore l’idiomaticité française et la précision de l’image matérielle tout en conservant la structure, les impératifs et l’ambiguïté lexicale du texte hébreu. Elle ne propose aucune interprétation théologique supplémentaire.
