  text: הַרְחִ֣יבִי מְק֣וֹם אָהֳלֵ֗/ךְ וִ/ירִיע֧וֹת מִשְׁכְּנוֹתַ֛יִ/ךְ יַטּ֖וּ אַל תַּחְשֹׂ֑כִי הַאֲרִ֨יכִי֙ מֵֽיתָרַ֔יִ/ךְ וִ/יתֵדֹתַ֖יִ/ךְ חַזֵּֽקִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
translation:
  language: fr
  text: Élargis l’espace de ta tente, que les tentures de tes demeures s’étendent ; ne te retiens pas[a]. Allonge tes cordes et affermis tes piquets[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne ménage pas » ou « ne retiens rien ».
    reason: lexical_alternative
  - marker: b
    text: Les « tentures » sont les pans de tissu qui forment la tente ; les « piquets » sont enfoncés dans le sol pour la maintenir.
    reason: cultural_note
lexical_decisions:
- source_word: הַרְחִיבִי
  choice: Élargis
  rationale: L’impératif hiphil féminin singulier de רחב exprime l’action de rendre plus large. « Élargis » est direct, naturel et conserve l’adresse à Sion personnifiée.
- source_word: מְקוֹם אָהֳלֵךְ
  choice: l’espace de ta tente
  rationale: מְקוֹם peut désigner le lieu ou l’espace disponible. « L’espace de ta tente » restitue concrètement l’idée d’agrandir son emplacement sans affaiblir l’image.
- source_word: וִירִיעוֹת מִשְׁכְּנוֹתַיִךְ
  choice: les toiles de tes habitations
  rationale: יְרִיעוֹת désigne les pans de toile ou tentures formant une tente, tandis que מִשְׁכְּנוֹת est au pluriel et signifie « habitations ». « Toiles » convient mieux que « rideaux » à l’image d’une tente en français actuel.
- source_word: יַטּוּ
  choice: soient déployées
  rationale: Le hiphil inaccompli pluriel de נטה a ici une valeur exhortative. La tournure passive naturelle en français laisse les agents implicites, comme dans le contexte, et exprime l’extension des toiles.
- source_word: אַל תַּחְשֹׂכִי
  choice: ne te retiens pas
  rationale: Dans cette interdiction, חשׂך peut signifier retenir, épargner ou ménager. « Ne te retiens pas » transmet naturellement l’appel à agir sans restriction tout en laissant les autres nuances en note.
- source_word: הַאֲרִיכִי מֵיתָרַיִךְ
  choice: Allonge tes cordages
  rationale: Le hiphil impératif de ארך signifie « rendre long, allonger », et מֵיתָרִים désigne les cordes qui maintiennent une tente. « Cordages » rend clairement leur fonction dans l’image.
- source_word: וִיתֵדֹתַיִךְ חַזֵּקִי
  choice: affermis tes piquets
  rationale: יָתֵד désigne ici un piquet de tente. Le piel impératif de חזק signifie renforcer ou rendre ferme ; « affermis » est idiomatique pour des piquets et conserve la force de l’ordre.
theological_decisions:
- issue: Langage métaphorique de l’habitation appliqué à Sion
  choice: Conserver littéralement l’image de la tente, de ses toiles, de ses cordages et de ses piquets.
  alternative: Expliciter dans le texte l’accroissement de la population ou la restauration de Sion.
  rationale: Le texte hébreu développe une série cohérente d’impératifs tirés de l’agrandissement d’une tente. Préserver cette métaphore permet à sa portée prophétique et théologique de ressortir du contexte sans l’imposer par une paraphrase.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs féminins singuliers adressés à Sion ne sont pas morphologiquement visibles en français, mais l’adresse directe au singulier est conservée. Le vocabulaire concret maintient l’unité de l’image de la tente.
