review_pass:
  verdict: revise
  source_fidelity: 'Le sens et la succession des impératifs hébreux sont bien rendus : agrandir, étendre, ne pas retenir, allonger et affermir. Une formulation plus directe pour יַטּוּ rend toutefois mieux le jussif actif que le passif « soient déployées ».'
  naturalness: « Les toiles de tes habitations » est compréhensible, mais peu idiomatique et affaiblit la cohérence de l’image de tente. « Les tentures de tes demeures » est plus naturel dans un registre poétique moderne. « Cordes » est plus usuel et précis que « cordages » pour les haubans d’une tente.
  terminology: « Tente », « tentures », « demeures », « cordes » et « piquets » maintiennent l’imagerie concrète sans interpréter la métaphore. La note culturelle doit définir les piquets comme des éléments enfoncés dans le sol, non comme des « chevilles », terme ambigu en français moderne.
  issues:
  - severity: low
    issue: Formulation passive de יַטּוּ
    rationale: « Soient déployées » est possible, mais l’hébreu emploie un hiphil jussif actif. « Que les tentures ... s’étendent » est à la fois plus fluide et plus proche de l’effet exhortatif.
  - severity: low
    issue: « Toiles de tes habitations »
    rationale: Cette expression est lourde et associe des toiles à des habitations de façon peu naturelle. « Tentures de tes demeures » restitue mieux les יריעות et les משכנות.
  - severity: low
    issue: 'Note b : « chevilles »'
    rationale: En français contemporain, « cheville » est ambigu et n’est pas la désignation la plus claire d’un piquet de tente. Il convient de préciser qu’il s’agit de piquets enfoncés dans le sol.
  revised_text: Élargis l’espace de ta tente, que les tentures de tes demeures s’étendent ; ne te retiens pas[a]. Allonge tes cordes et affermis tes piquets[b].
