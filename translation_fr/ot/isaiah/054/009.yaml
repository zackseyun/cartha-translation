source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
translation:
  language: fr
  text: 'Car cela est pour moi comme les eaux de Noé : de même que j’ai juré que les eaux de Noé ne passeraient plus sur la terre[a], de même j’ai juré de ne pas m’irriter contre toi ni te réprimander.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car cela est pour moi comme les eaux de Noé. » Certaines traductions, sous l’influence de versions anciennes, lisent « les jours de Noé », mais le texte hébreu porte « les eaux de Noé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou le fondement de l’assurance précédente, tout en conservant naturellement la valeur connective de l’hébreu.
- source_word: מֵי נֹחַ
  choice: les eaux de Noé
  rationale: Rend littéralement le groupe construit et préserve l’allusion au déluge sans explicitation excessive.
- source_word: זֹאת לִי
  choice: cela est pour moi comme
  rationale: L’expression hébraïque est elliptique; « comme » explicite en français la comparaison indiquée par la structure du verset sans en modifier le contenu.
- source_word: אֲשֶׁר ... כֵּן
  choice: de même que ... de même
  rationale: Fait clairement ressortir la corrélation comparative entre le serment relatif aux eaux de Noé et celui adressé à Sion.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Expression française directe et solennelle correspondant au verbe « jurer, prêter serment ».
- source_word: מֵעֲבֹר ... עוֹד עַל הָאָרֶץ
  choice: ne passeraient plus sur la terre
  rationale: Préserve le mouvement exprimé par עבר et rend la non-répétition impliquée par עוֹד dans le cadre du serment.
- source_word: מִקְּצֹף עָלַיִךְ
  choice: de ne plus m’irriter contre toi
  rationale: Rend la colère divine exprimée par קצף dans un français actuel et digne; « ne plus » correspond au parallèle avec l’interdiction d’une nouvelle répétition.
- source_word: וּמִגְּעָר בָּךְ
  choice: ni te réprimander
  rationale: גער signifie réprimander ou reprendre; « ni » coordonne naturellement les deux contenus négatifs du serment.
theological_decisions:
- issue: Comparaison elliptique dans זֹאת לִי
  choice: cela est pour moi comme les eaux de Noé
  alternative: cela est pour moi comme aux jours de Noé
  rationale: Le texte massorétique porte « eaux de Noé », non « jours de Noé ». La traduction conserve cette leçon tout en ajoutant « comme » pour rendre intelligible la comparaison elliptique.
- issue: Portée du serment suivi de מִן et d’infinitifs
  choice: j’ai juré de ne plus m’irriter contre toi ni te réprimander
  alternative: j’ai juré que je ne m’irriterai pas contre toi et que je ne te réprimanderai pas
  rationale: La formulation infinitive française reflète étroitement la construction hébraïque, tandis que la négation nécessaire est explicitée. Elle ne tranche aucune question doctrinale au-delà de l’affirmation du verset.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « les eaux de Noé » et la structure « de même que… de même » sont conservées pour respecter la rhétorique hébraïque. Le féminin singulier de « toi » renvoie à Sion personnifiée, sans qu’il soit nécessaire de l’expliciter dans le texte.
