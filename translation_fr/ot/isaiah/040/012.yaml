  variant: modern international French
source:
  edition: WLC
  text: מִֽי מָדַ֨ד בְּ/שָׁעֳל֜/וֹ מַ֗יִם וְ/שָׁמַ֨יִם֙ בַּ/זֶּ֣רֶת תִּכֵּ֔ן וְ/כָ֥ל בַּ/שָּׁלִ֖שׁ עֲפַ֣ר הָ/אָ֑רֶץ וְ/שָׁקַ֤ל בַּ/פֶּ֨לֶס֙ הָרִ֔ים וּ/גְבָע֖וֹת בְּ/מֹאזְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
translation:
  language: fr
  text: Qui a mesuré les eaux dans le creux de sa main, délimité les cieux avec un empan, recueilli la poussière de la terre dans une mesure[a], pesé les montagnes avec une balance et les collines avec des balances ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mesuré la poussière de la terre dans une mesure d’un tiers ». Le terme hébreu désigne probablement un récipient ou une ancienne unité de capacité dont l’équivalent exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָדַד
  choice: Qui a mesuré
  rationale: La question rhétorique et l’accompli hébreu sont rendus naturellement par le passé composé français.
- source_word: בְּשָׁעֳלוֹ
  choice: dans le creux de sa main
  rationale: Conserve l’image anthropomorphique concrète de la main servant de petit récipient de mesure.
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel français reflète le pluriel hébreu et convient à la portée cosmique du passage.
- source_word: וְשָׁמַיִם בַּזֶּרֶת תִּכֵּן
  choice: délimité les cieux avec un empan
  rationale: « Délimité » exprime l’idée de déterminer les dimensions, tandis qu’« empan » désigne précisément la mesure prise avec la main ouverte.
- source_word: וְכָל בַּשָּׁלִשׁ עֲפַר הָאָרֶץ
  choice: recueilli la poussière de la terre dans une mesure
  rationale: Le verbe peut évoquer le fait de contenir ou mesurer; « recueilli… dans » préserve ici l’image d’un récipient sans répéter artificiellement « mesuré ». Le volume exact de שָׁלִישׁ demeure incertain.
- source_word: וְשָׁקַל בַּפֶּלֶס הָרִים
  choice: pesé les montagnes à la balance
  rationale: Rend clairement l’action de peser au moyen d’un instrument, dans un français courant et digne.
- source_word: וּגְבָעוֹת בְּמֹאזְנָיִם
  choice: et les collines sur les plateaux
  rationale: Le duel hébreu désigne une balance à deux plateaux; la formulation maintient le parallélisme tout en évitant une répétition lourde de « balance ».
theological_decisions:
- issue: Imagerie anthropomorphique appliquée à Dieu
  choice: Maintenir littéralement le creux de la main et l’empan
  alternative: Abstraire l’image par des expressions comme « par sa puissance » ou « avec exactitude »
  rationale: La poésie souligne l’incomparabilité du Créateur au moyen d’images corporelles et d’instruments de mesure; les conserver respecte la force du texte sans imposer d’explication doctrinale.
- issue: Sujet implicite de la question
  choice: Ne pas ajouter explicitement « Dieu »
  alternative: « Quel Dieu a mesuré… ? » ou « Qui, sinon Dieu, a mesuré… ? »
  rationale: L’hébreu laisse le sujet sous la forme interrogative « Qui ? »; conserver cette formulation préserve la progression rhétorique et sa tension.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Empan » est un terme précis, compréhensible dans le contexte de la mesure manuelle. La série verbale sans répétition du pronom conserve le rythme soutenu de la question hébraïque.
