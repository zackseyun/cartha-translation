  to: Qui a mesuré les eaux dans le creux de sa main, délimité les cieux avec un empan, recueilli la poussière de la terre dans une mesure[a], pesé les montagnes avec une balance et les collines avec des balances ?
  rationale: La révision remplace seulement « sur les plateaux » par « avec des balances », afin de rendre מֹאזְנַיִם comme instrument de pesée et de rétablir un français idiomatique. Elle préserve le pluriel hébreu et le parallélisme poétique avec « avec une balance ».
