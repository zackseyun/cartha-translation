  text: הַ/נּוֹתֵ֥ן רוֹזְנִ֖ים לְ/אָ֑יִן שֹׁ֥פְטֵי אֶ֖רֶץ כַּ/תֹּ֥הוּ עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/023.yaml
  text: who brings princes to nothing[b][a], and makes the judges of the earth like emptiness.
translation:
  language: fr
  text: 'Il réduit les princes à rien

    et rend les juges de la terre semblables au vide.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au chaos », « à la désolation » ou « au néant ». Le mot hébreu tohu peut évoquer le vide, la désolation, le chaos ou l’irréalité. « Les juges de la terre » peut aussi se traduire par « les juges du pays ».
    reason: Alternatives lexicales pour תֹהוּ et ambiguïté de אֶרֶץ.
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: Il réduit
  rationale: Le participe poursuit la description de Dieu au verset précédent. Avec לְאָיִן, « réduire à rien » exprime naturellement en français l’action caractéristique indiquée par l’hébreu.
- source_word: רוֹזְנִים
  choice: les princes
  rationale: Le terme désigne de hauts responsables, dignitaires ou gouvernants. « Princes » conserve le registre élevé et politique du texte prophétique.
- source_word: לְאָיִן
  choice: à rien
  rationale: אָיִן évoque l’inexistence ou le néant. L’expression française « réduire à rien » en restitue clairement la force.
- source_word: שֹׁפְטֵי אֶרֶץ
  choice: les juges de la terre
  rationale: Le syntagme peut désigner les juges de la terre ou du pays. Le contexte universel et cosmique d’Ésaïe 40 favorise ici « terre ».
- source_word: כַּתֹּהוּ
  choice: pareils au néant
  rationale: תֹהוּ peut évoquer le vide, le chaos, la désolation ou l’irréalité. Dans ce contexte, « néant » exprime l’absence de consistance des puissants devant Dieu sans imposer le sens plus particulier d’« informe ».
- source_word: עָשָׂה
  choice: rend
  rationale: Bien que la forme hébraïque soit un accompli, son parallélisme avec le participe permet de décrire ici l’action caractéristique de Dieu au présent. « Rendre pareil à » est idiomatique en français.
theological_decisions:
- issue: Portée de אֶרֶץ dans שֹׁפְטֵי אֶרֶץ
  choice: terre
  alternative: pays
  rationale: Le contexte proche souligne la souveraineté de Dieu sur le monde et les nations; « terre » préserve cette portée universelle sans exclure l’ambiguïté lexicale, signalée dans la note.
- issue: Valeur de תֹהוּ
  choice: néant
  alternative: vide, chaos ou désolation
  rationale: Le mot conserve une amplitude sémantique que la traduction principale ne peut entièrement reproduire. « Néant » convient au parallélisme avec לְאָיִן, tandis que la note maintient les autres nuances authentiques.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé sur deux lignes; les verbes au présent rendent l’action caractéristique de Dieu. La note préserve les ambiguïtés lexicales sans alourdir le corps du verset.
