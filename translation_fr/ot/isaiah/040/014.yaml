source:
  edition: WLC
  text: אֶת מִ֤י נוֹעָץ֙ וַ/יְבִינֵ֔/הוּ וַֽ/יְלַמְּדֵ֖/הוּ בְּ/אֹ֣רַח מִשְׁפָּ֑ט וַ/יְלַמְּדֵ֣/הוּ דַ֔עַת וְ/דֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
translation:
  language: fr
  text: Qui a-t-il consulté, et qui lui a donné l’intelligence ? Qui lui a enseigné le chemin de la justice[a], lui a enseigné la connaissance et lui a fait connaître la voie du discernement[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chemin du jugement » ou « le chemin du droit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la voie de l’intelligence » ou « le chemin de la compréhension ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי נוֹעָץ
  choice: Qui a-t-il consulté
  rationale: אֶת marque ici le complément d’objet de נוֹעָץ. « Consulter » exprime naturellement en français moderne l’idée de chercher ou prendre conseil.
- source_word: וַיְבִינֵהוּ
  choice: qui lui a donné de comprendre
  rationale: Le hiphil de בין a une valeur causative. Cette formulation française conserve cette valeur sans alourdir la phrase.
- source_word: וַיְלַמְּדֵהוּ
  choice: lui a enseigné
  rationale: Rend directement le verbe למד dans son sens d’enseigner; la répétition du verbe dans l’hébreu est conservée.
- source_word: בְּאֹרַח מִשְׁפָּט
  choice: le chemin de la justice
  rationale: אֹרַח désigne un chemin ou une voie, tandis que מִשְׁפָּט peut évoquer la justice, le droit ou le jugement. « Justice » convient au contexte sapientiel, sans exclure l’autre nuance signalée en note.
- source_word: דַעַת
  choice: la connaissance
  rationale: « Connaissance » maintient la distinction lexicale avec בין et תְּבוּנוֹת, qui relèvent davantage de la compréhension et du discernement.
- source_word: וְדֶרֶךְ תְּבוּנוֹת
  choice: la voie du discernement
  rationale: דֶרֶךְ est parallèle à אֹרַח. Le pluriel abstrait תְּבוּנוֹת désigne les facultés de compréhension ou de discernement; « discernement » est naturel et évite une répétition avec « comprendre ».
- source_word: יוֹדִיעֶנּוּ
  choice: lui a fait connaître
  rationale: Le hiphil de ידע est causatif; « faire connaître » en restitue précisément et naturellement le sens.
theological_decisions:
- issue: Référent des pronoms à la troisième personne
  choice: Les pronoms renvoient au Seigneur évoqué dans le contexte immédiat, sans que son nom soit ajouté dans le verset.
  alternative: Comprendre le référent comme une divinité non précisée ou une figure abstraite.
  rationale: Ésaïe 40.13-14 décrit rhétoriquement l’indépendance et l’incomparable sagesse du Seigneur. Garder les pronoms respecte la forme hébraïque et laisse le contexte fournir le référent.
- issue: Sens de מִשְׁפָּט
  choice: justice
  alternative: jugement ou droit
  rationale: « Justice » exprime clairement ici la rectitude morale et judiciaire, tandis que « jugement » demeure une possibilité lexicale réelle, conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure interrogative et les répétitions de l’hébreu sont préservées; les deux termes hébreux désignant le chemin sont rendus par « chemin » et « voie » afin de conserver le parallélisme sans monotonie.
