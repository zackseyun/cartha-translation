  text: Even young men grow faint and become weary[a], and young men surely stumble.
translation:
  language: fr
  text: Même les jeunes faiblissent et se fatiguent, et les jeunes hommes trébuchent assurément.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִעֲפוּ
  choice: s’épuisent
  rationale: Le verbe exprime l’affaiblissement causé par l’épuisement. « S’épuisent » est naturel en français et convient à la progression poétique.
- source_word: נְעָרִים
  choice: les adolescents
  rationale: Le terme désigne ici des jeunes plutôt que des enfants. « Adolescents » maintient une distinction naturelle avec בַחוּרִים dans le membre parallèle.
- source_word: וְיִגָעוּ
  choice: se fatiguent
  rationale: Le verbe signifie se lasser ou se fatiguer. Cette formulation simple préserve le parallélisme avec « s’épuisent ».
- source_word: וּבַחוּרִים
  choice: les jeunes hommes
  rationale: בַחוּרִים désigne des jeunes hommes dans la force de l’âge. Le traduire par « choisis » importerait une nuance étymologique qui n’est pas lexicalement requise ici.
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  choice: finissent inévitablement par trébucher
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie ou affirme fortement l’action. « Inévitablement » en rend l’emphase, tandis que « finissent par » souligne que même leur vigueur ne les en préserve pas.
