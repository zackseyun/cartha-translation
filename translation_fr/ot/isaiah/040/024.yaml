source:
  edition: WLC
  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
translation:
  language: fr
  text: 'À peine sont-ils plantés[a], à peine sont-ils semés, à peine leur tige a-t-elle pris racine dans la terre, qu’il souffle sur eux : ils se dessèchent, et une tempête[b] les emporte comme du chaume.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Ils ne sont même pas plantés, ils ne sont même pas semés, et leur tige n’a même pas pris racine dans la terre. » La répétition hébraïque souligne la rapidité avec laquelle leur élévation est anéantie.'
    reason: lexical_alternative
  - marker: b
    text: Ou « un tourbillon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף בַּל
  choice: à peine
  rationale: 'La combinaison répétée exprime ici une négation emphatique à valeur temporelle : leur établissement commence à peine qu’il est déjà anéanti. « À peine » restitue naturellement en français cette progression rhétorique.'
- source_word: נִטָּעוּ
  choice: sont-ils plantés
  rationale: Le passif de נטע ouvre la métaphore végétale appliquée aux dirigeants et s’intègre au parallélisme poétique.
- source_word: זֹרָעוּ
  choice: sont-ils semés
  rationale: Le passif de זרע poursuit l’image agricole et maintient le parallélisme avec « plantés ».
- source_word: שֹׁרֵשׁ
  choice: a-t-elle pris racine
  rationale: Malgré la forme inhabituelle, le sens contextuel est celui de l’enracinement. « Prendre racine » est l’expression française naturelle pour l’établissement d’une plante et, métaphoriquement, d’un pouvoir.
- source_word: גִּזְעָם
  choice: leur tige
  rationale: גזע peut désigner une souche, un tronc ou une tige. « Tige » convient à l’ensemble de la métaphore sans imposer l’image précise d’un grand arbre.
- source_word: נָשַׁף
  choice: souffle sur eux
  rationale: Le verbe signifie souffler ou exhaler. Cette formulation conserve l’image d’une action divine immédiate et sans effort.
- source_word: וַיִּבָשׁוּ
  choice: ils se dessèchent
  rationale: יבש signifie devenir sec ou se dessécher. Le choix maintient explicitement la métaphore végétale.
- source_word: סְעָרָה
  choice: une tempête
  rationale: Le nom peut désigner une tempête, une tourmente ou un tourbillon. « Tempête » est clair, courant et suffisamment large.
- source_word: כַּקַּשׁ
  choice: comme du chaume
  rationale: קשׁ désigne la paille ou les tiges sèches restant après la moisson. « Chaume » rend précisément cette image agricole, plutôt que celle de la balle.
- source_word: תִּשָּׂאֵם
  choice: les emporte
  rationale: Dans ce contexte, נשא évoque le fait de soulever et d’emporter. « Les emporte » exprime ce mouvement avec concision.
theological_decisions:
- issue: Référent du sujet singulier de « il souffle sur eux »
  choice: Dieu est le sujet implicite, représenté par « il »
  alternative: Un vent impersonnel souffle sur eux
  rationale: Dans le contexte immédiat d’Ésaïe 40.23-24, le sujet demeure celui qui réduit les dirigeants à rien. Le pronom personnel préserve cette action divine sans ajouter le nom de Dieu là où l’hébreu ne le répète pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le triple « à peine » conserve le rythme insistant de l’hébreu; la ponctuation rend lisible l’enchaînement rapide entre établissement, souffle, dessèchement et disparition.
