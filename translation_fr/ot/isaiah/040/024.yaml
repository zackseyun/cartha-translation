  source_fidelity: 'Le triple « à peine » rend de façon fidèle la force rhétorique de אַף בַּל dans son contexte : les puissants sont à peine établis que Dieu les fait disparaître. Les passifs « sont-ils plantés / semés » conservent le parallélisme, « a-t-elle pris racine » exprime bien l’établissement figuré, et la suite rend correctement le souffle divin, le dessèchement et l’emportement comme du chaume. « Tempête » est une restitution suffisamment large de סְעָרָה.'
  naturalness: Le français est moderne, clair et poétique sans être archaïsant. La répétition de « à peine » et la construction « à peine … qu’il … » transmettent efficacement l’enchaînement brusque du verset. « Se dessèchent » et « comme du chaume » s’inscrivent naturellement dans l’image végétale.
  terminology: « Tige » est un choix recevable pour גִּזְעָם dans cette métaphore, sans imposer l’image plus spécifique d’un tronc ou d’une souche. Les termes « plantés », « semés », « racine », « tempête » et « chaume » sont précis et cohérents. Le pronom « il » maintient, conformément au contexte, l’agent divin implicite sans ajouter le nom de Dieu.
