id: ISA.40.31
reference: Isaiah 40:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קוֹיֵ֤ יְהוָה֙ יַחֲלִ֣יפוּ כֹ֔חַ יַעֲל֥וּ אֵ֖בֶר כַּ/נְּשָׁרִ֑ים יָר֨וּצוּ֙ וְ/לֹ֣א יִיגָ֔עוּ יֵלְכ֖וּ וְ/לֹ֥א יִיעָֽפוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
translation:
  language: fr
  text: Mais ceux qui espèrent en Yahweh retrouvent des forces nouvelles[a] ; ils prennent leur essor comme les aigles[b]. Ils courent sans se fatiguer, ils marchent sans défaillir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui attendent Yahweh renouvellent leur force ». Le verbe hébreu évoque une attente pleine d’espérance ; l’expression traduite par « retrouvent des forces nouvelles » peut aussi se rendre plus littéralement par « renouvellent leur force ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne un grand rapace ; selon les contextes, il peut aussi désigner un vautour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ יְהוָה
  choice: Mais ceux qui espèrent en Yahweh
  rationale: Le participe de קוה exprime une attente confiante et pleine d’espérance. « Espèrent en » est naturel en français et conserve cette attente confiante ; la conjonction marque le contraste avec l’épuisement évoqué au verset précédent.
- source_word: יַחֲלִיפוּ כֹחַ
  choice: retrouvent des forces nouvelles
  rationale: Le hiphil de חלף avec כֹּחַ évoque le renouvellement ou le remplacement des forces. Cette formulation française rend naturellement l’idée d’une vigueur restaurée.
- source_word: יַעֲלוּ אֵבֶר
  choice: ils prennent leur essor
  rationale: עלה exprime le mouvement ascendant et אבר l’aile. « Prendre son essor » restitue de façon idiomatique l’image de l’envol sans imposer l’idée moins probable de faire pousser des ailes.
- source_word: כַּנְּשָׁרִים
  choice: comme les aigles
  rationale: נשר désigne un grand rapace et peut, selon les contextes, renvoyer à l’aigle ou au vautour. « Aigles » convient à l’image poétique de l’essor, tandis que l’ambiguïté zoologique est signalée en note.
- source_word: יָרוּצוּ וְלֹא יִיגָעוּ
  choice: Ils courent sans se fatiguer
  rationale: יגע indique la fatigue produite par l’effort. La tournure française concise préserve le parallélisme.
- source_word: יֵלְכוּ וְלֹא יִיעָפוּ
  choice: ils marchent sans défaillir
  rationale: יעף désigne l’état d’épuisement ou de faiblesse. « Défaillir » exprime ici une perte de forces plus marquée que la simple fatigue et maintient la distinction avec יגע.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Nuance de קוה dans la promesse
  choice: espèrent en Yahweh
  alternative: attendent Yahweh ; mettent leur espérance en Yahweh
  rationale: Le verbe associe attente et espérance confiante. Le texte principal privilégie une expression française naturelle, et la note conserve explicitement l’autre composante sémantique.
translation_notes:
  register: Français international moderne, fluide et digne. Le rythme poétique repose sur deux phrases équilibrées et sur le contraste entre courir, marcher, se fatiguer et défaillir.
