  terminology: « Yahweh », « gloire », « toute chair » et « la bouche de Yahweh » sont cohérents avec le texte hébreu et les choix terminologiques du projet. La note propose correctement l’équivalent interprétatif « toute l’humanité » sans remplacer l’expression imagée dans le texte.
