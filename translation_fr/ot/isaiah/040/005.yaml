source:
  edition: WLC
  text: וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
translation:
  language: fr
  text: 'La gloire de Yahweh sera révélée,

    et toute chair[a], ensemble, verra,

    car la bouche de Yahweh a parlé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’humanité » ; littéralement « toute chair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְלָה
  choice: se révélera
  rationale: Le nifal de גלה exprime ici la manifestation ou le dévoilement. Le futur français rend la portée prophétique du parfait hébreu dans cette séquence.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: « Gloire » conserve les notions de splendeur, d’honneur et de majesté associées à כָּבוֹד, tandis que la construction avec « de » reflète le groupe nominal hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְרָאוּ
  choice: verra
  rationale: Le singulier s’accorde avec le collectif « toute chair ». L’emploi absolu de « voir », quoique soutenu, évite d’ajouter un complément d’objet absent de l’hébreu.
- source_word: כָל בָּשָׂר
  choice: toute chair
  rationale: Cette expression conserve l’image concrète de l’hébreu et sa portée universelle, tout en restant intelligible dans un registre biblique digne.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe souligne que la vision concerne collectivement et simultanément toute chair.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit naturellement en français le fondement et la garantie de la promesse.
- source_word: פִּי יְהוָה
  choice: la bouche de Yahweh
  rationale: La formulation conserve l’expression anthropomorphique concrète et emphatique de l’hébreu.
- source_word: דִּבֵּר
  choice: a parlé
  rationale: Le passé composé présente la parole comme déjà prononcée et donc certaine, conformément à l’accompli hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Interprétation de כָל בָּשָׂר
  choice: toute chair
  alternative: toute l’humanité
  rationale: Le sens contextuel est universel, mais garder l’expression littérale préserve l’accent hébreu sur la condition corporelle et créaturelle.
- issue: Objet implicite de וְרָאוּ
  choice: emploi absolu de « verra »
  alternative: « la verra », avec « la » renvoyant à la gloire
  rationale: L’hébreu n’exprime aucun objet après le verbe. La traduction n’ajoute donc pas de pronom et laisse subsister la légère indétermination syntaxique du texte source.
translation_notes:
  register: Français moderne, solennel et lisible. L’ordre « toute chair, ensemble, verra » est volontairement marqué afin de conserver à la fois l’adverbe hébreu et l’absence de complément d’objet explicite.
