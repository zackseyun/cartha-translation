  text: כָּל הַ/גּוֹיִ֖ם כְּ/אַ֣יִן נֶגְדּ֑/וֹ מֵ/אֶ֥פֶס וָ/תֹ֖הוּ נֶחְשְׁבוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
translation:
  language: fr
  text: Toutes les nations sont comme rien devant lui ; à ses yeux, elles sont moins que rien, du vide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elles sont comptées à ses yeux comme moins que rien et comme du vide (ou du chaos) ». Le mot hébreu rendu par « vide » peut aussi évoquer la désolation ou le chaos.'
    reason: Conserve l’alternative « comptées » pour le verbe hébreu et signale l’étendue sémantique de תֹהוּ, sans imposer une nuance unique.
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: Toutes les nations
  rationale: Rend naturellement en français la totalité collective exprimée par כָּל et le sens courant de גּוֹיִם, sans préciser davantage leur identité.
- source_word: כְּאַיִן
  choice: comme un rien
  rationale: Le préfixe comparatif כְּ est conservé par « comme », tandis que « un rien » exprime אַיִן dans un français naturel et soutenu.
- source_word: נֶגְדּוֹ
  choice: devant lui
  rationale: Préserve le sens relationnel et potentiellement évaluatif de נֶגֶד sans réduire l’expression à une comparaison explicitée.
- source_word: מֵאֶפֶס
  choice: moins que rien
  rationale: Comprend מִן dans sa valeur comparative et conserve l’intensification rhétorique du second membre.
- source_word: וָתֹהוּ
  choice: et comme néant
  rationale: « Néant » convient au parallélisme de nullité avec אֶפֶס ; l’ajout de « comme » rend la coordination idiomatique en français. Le champ lexical peut aussi inclure le vide ou le chaos, signalés en note.
- source_word: נֶחְשְׁבוּ לוֹ
  choice: elles sont considérées par lui
  rationale: Le niphal de חשׁב exprime l’évaluation ou l’imputation ; le présent convient au caractère général de l’affirmation, et « par lui » indique la perspective divine portée par לוֹ.
theological_decisions:
- issue: Degré de négation dans le second membre
  choice: « moins que rien et comme néant »
  alternative: « à partir du néant et du chaos » ou « moins que rien et comme vide »
  rationale: La lecture comparative de מִן et l’accumulation אֶפֶס וָתֹהוּ soulignent l’insignifiance totale des nations devant Dieu, sans transformer cette hyperbole en affirmation métaphysique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme poétique, l’escalade rhétorique et l’ambiguïté lexicale de תֹהוּ au moyen d’une note.
