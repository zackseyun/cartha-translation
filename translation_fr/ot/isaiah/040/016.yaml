id: ISA.40.16
reference: Isaiah 40:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְבָנ֕וֹן אֵ֥ין דֵּ֖י בָּעֵ֑ר וְ/חַיָּת֔/וֹ אֵ֥ין דֵּ֖י עוֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
translation:
  language: fr
  text: Le Liban ne suffirait pas à alimenter le feu[a], et ses animaux ne suffiraient pas pour un holocauste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le Liban évoque vraisemblablement ici ses célèbres forêts : même tout son bois ne suffirait pas à alimenter le feu du sacrifice.'
    reason: cultural_note
  - marker: b
    text: Un holocauste était une offrande entièrement consumée par le feu.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְבָנוֹן
  choice: Le Liban
  rationale: Le texte hébreu nomme directement la région. Le nom propre est conservé, tandis que le contexte évoque par métonymie ses célèbres forêts.
- source_word: אֵין דֵּי
  choice: ne suffirait pas / ne suffiraient pas
  rationale: Cette tournure rend naturellement en français l'idée d'une quantité insuffisante, tout en faisant ressortir le caractère hypothétique et démesuré de la comparaison.
- source_word: בָּעֵר
  choice: à alimenter le feu
  rationale: L'infinitif renvoie ici au combustible nécessaire au feu sacrificiel. Cette formulation française explicite sobrement la fonction du bois sans remplacer « le Liban » par « ses forêts ».
- source_word: וְחַיָּתוֹ
  choice: et ses animaux
  rationale: חַיָּה peut désigner les animaux, souvent les animaux sauvages. « Ses animaux » conserve l'étendue du terme sans préciser plus que l'hébreu.
- source_word: עוֹלָה
  choice: un holocauste
  rationale: Dans le vocabulaire sacrificiel biblique français, « holocauste » désigne l'offrande entièrement brûlée et correspond au terme hébreu singulier עוֹלָה.
theological_decisions:
- issue: Portée de l'image sacrificielle
  choice: Même les ressources forestières et animales du Liban seraient insuffisantes pour une offrande à la mesure de la grandeur de Dieu.
  alternative: Une affirmation générale selon laquelle toutes les ressources humaines consacrées au culte sont insuffisantes.
  rationale: Le contexte d'Ésaïe 40.12-17 souligne la grandeur incomparable de Dieu. La traduction maintient l'image concrète du sacrifice sans en tirer une affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « ne suffirait pas » reproduit l'insistance de l'hébreu. « Alimenter le feu » rend explicite l'emploi du bois suggéré par le contexte, sans effacer la métonymie du Liban.
