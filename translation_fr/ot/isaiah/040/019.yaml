source:
  edition: WLC
  text: הַ/פֶּ֨סֶל֙ נָסַ֣ךְ חָרָ֔שׁ וְ/צֹרֵ֖ף בַּ/זָּהָ֣ב יְרַקְּעֶ֑/נּוּ וּ/רְתֻק֥וֹת כֶּ֖סֶף צוֹרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: fr
  text: L’idole, un artisan la coule, puis un orfèvre la plaque d’or et lui façonne des chaînes d’argent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֶּסֶל
  choice: L’idole
  rationale: Dans ce contexte polémique, פֶּסֶל désigne une représentation cultuelle fabriquée; « idole » rend clairement sa fonction, plutôt que le plus formel « image sculptée ».
- source_word: נָסַךְ
  choice: la coule
  rationale: Le verbe décrit ici la fabrication par coulage du métal; le présent français convient à la description générale.
- source_word: חָרָשׁ
  choice: un artisan
  rationale: Terme général pour un ouvrier spécialisé; le contexte métallurgique précise son activité sans qu’il soit nécessaire d’ajouter « fondeur ».
- source_word: וְצֹרֵף בַּזָּהָב יְרַקְּעֶנּוּ
  choice: puis un orfèvre la plaque d’or
  rationale: רקע évoque l’étalement du métal en feuilles ou plaques. « Plaquer d’or » exprime naturellement le recouvrement de l’objet, sans suggérer qu’il est en or massif.
- source_word: וּרְתֻקוֹת כֶּסֶף צוֹרֵף
  choice: et lui façonne des chaînes d’argent
  rationale: רְתֻקוֹת signifie « chaînes »; צוֹרֵף peut désigner le travail de l’orfèvre. « Façonne » reste précis sans surdéterminer la technique exacte, contrairement à « forge ».
theological_decisions:
- issue: Nature de l’objet fabriqué
  choice: « idole »
  alternative: « statue » ou « image sculptée »
  rationale: Le contexte d’Ésaïe 40 oppose l’objet cultuel fabriqué à Dieu. « Idole » transmet cette portée sans ajouter de doctrine étrangère au texte.
translation_notes:
  register: Français international moderne, sobre et dignifié. La reprise pronominale (« la », « lui ») garde une syntaxe fluide tout en suivant la succession des opérations décrites dans l’hébreu.
