source:
  edition: WLC
  text: יָבֵ֥שׁ חָצִ֖יר נָ֣בֵֽל צִ֑יץ וּ/דְבַר אֱלֹהֵ֖י/נוּ יָק֥וּם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
translation:
  language: fr
  text: L’herbe se dessèche[a], la fleur se flétrit, mais la parole de notre Dieu subsistera pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « L’herbe sèche, la fleur se fane. » L’hébreu emploie deux verbes proches mais distincts pour décrire le dépérissement de la végétation.'
    reason: Alternative lexicale préservant la distinction entre יבש et נבל.
lexical_decisions:
- source_word: יָבֵשׁ
  choice: se dessèche
  rationale: Le qal de יבש exprime le fait de devenir sec. « Se dessèche » est naturel en français et maintient cette image distincte du flétrissement de la fleur.
- source_word: חָצִיר
  choice: l’herbe
  rationale: Dans ce parallélisme poétique, חָצִיר désigne naturellement l’herbe ou la végétation herbacée, et non du foin déjà coupé.
- source_word: נָבֵל
  choice: se flétrit
  rationale: Le verbe נבל peut évoquer le flétrissement ou le dépérissement. « Se flétrit » convient à la fleur et le distingue du dessèchement exprimé dans le premier membre.
- source_word: צִיץ
  choice: la fleur
  rationale: צִיץ désigne ici la fleur ou la floraison de l’herbe. « La fleur » est clair, courant et fidèle au parallélisme.
- source_word: וּדְבַר
  choice: mais la parole
  rationale: Le waw signifie formellement « et », mais il introduit ici un contraste net entre la végétation passagère et la permanence de la parole divine. « Mais » rend ce rapport naturellement en français.
- source_word: אֱלֹהֵינוּ
  choice: de notre Dieu
  rationale: La forme אֱלֹהִים avec le suffixe de première personne du pluriel renvoie ici, selon l’usage hébreu courant, au Dieu d’Israël au singulier.
- source_word: יָקוּם
  choice: subsistera
  rationale: קום signifie littéralement se lever ou tenir debout. Dans ce contexte de permanence, « subsistera » conserve l’idée de demeurer ferme sans donner en français l’impression d’une posture physique.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression idiomatique désigne ici une durée sans fin. « Pour toujours » est la formulation française moderne la plus naturelle.
theological_decisions:
- issue: Rapport entre la fragilité de la végétation et la permanence de la parole divine
  choice: Rendre le waw par « mais »
  alternative: « et »
  rationale: Le contraste est porté par le parallélisme du texte lui-même. « Mais » l’explicite sans ajouter de contenu doctrinal.
- issue: Portée de דָּבָר
  choice: « parole »
  alternative: « promesse » ou « message »
  rationale: « Parole » conserve l’étendue sémantique du terme hébreu et évite de le limiter à une promesse particulière ou à un type précis de message.
- issue: Métaphore de יָקוּם
  choice: « subsistera »
  alternative: « tiendra debout » ou « demeurera »
  rationale: « Subsistera » exprime en français la stabilité et la validité durables de la parole, tout en évitant de résoudre cette permanence en une catégorie théologique plus étroite.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en trois membres est conservé, avec un vocabulaire courant. « Se dessèche » et « se flétrit » maintiennent la distinction des deux verbes hébreux, tandis que « subsistera » rend idiomatiquement l’image de ce qui demeure ferme.
