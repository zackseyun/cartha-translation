source:
  edition: WLC
  text: הֲ/ל֤וֹא תֵֽדְעוּ֙ הֲ/ל֣וֹא תִשְׁמָ֔עוּ הֲ/ל֛וֹא הֻגַּ֥ד מֵ/רֹ֖אשׁ לָ/כֶ֑ם הֲ/לוֹא֙ הֲבִ֣ינֹתֶ֔ם מוֹסְד֖וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
translation:
  language: fr
  text: Ne savez-vous pas ? N’entendez-vous pas ? Ne vous l’a-t-on pas annoncé dès le commencement ? Ne l’avez-vous pas compris depuis les fondations de la terre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’avez-vous pas compris les fondations de la terre ? »'
    reason: 'Lecture syntaxique alternative : « les fondations de la terre » peut être le complément d’objet de « comprendre » plutôt qu’un repère temporel ou d’origine.'
lexical_decisions:
- source_word: הֲלוֹא
  choice: Ne… pas ?
  rationale: La particule interrogative négative répétée introduit des questions rhétoriques qui appellent une réponse affirmative. La répétition est conservée dans chaque proposition.
- source_word: תֵדְעוּ
  choice: savez
  rationale: Le verbe exprime ici le fait de savoir ou d’avoir connaissance ; « savoir » est direct et naturel.
- source_word: תִשְׁמָעוּ
  choice: avez… entendu
  rationale: שׁמע signifie fondamentalement « entendre ». Le passé composé convient au contexte, où le prophète évoque ce que les destinataires ont déjà entendu.
- source_word: הֻגַּד
  choice: a-t-on… annoncé
  rationale: Le passif de נגד désigne une information communiquée. La tournure française indéfinie « on » restitue naturellement le passif sans préciser l’agent.
- source_word: מֵרֹאשׁ
  choice: depuis le commencement
  rationale: L’expression renvoie au premier moment ou aux temps les plus anciens. « Depuis le commencement » en garde la valeur temporelle.
- source_word: הֲבִינֹתֶם
  choice: avez… compris
  rationale: Le hiphil de בין porte ici sur la compréhension ou le discernement ; « comprendre » convient à la progression cognitive du verset.
- source_word: מוֹסְדוֹת
  choice: les fondations / depuis que les fondations… ont été posées
  rationale: Le nom pluriel désigne les fondations. Dans le texte principal, la formulation explicite la lecture temporelle ou d’origine ; la lecture où le groupe nominal est l’objet direct est conservée en note.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte de création et de souveraineté cosmique désigne la terre entière plutôt qu’un territoire particulier.
theological_decisions:
- issue: Relation syntaxique de la proposition finale
  choice: Ne l’avez-vous pas compris depuis que les fondations de la terre ont été posées ?
  alternative: N’avez-vous pas compris les fondations de la terre ?
  rationale: L’hébreu ne place pas de préposition explicite devant « fondations de la terre ». Le groupe peut donc être compris comme un repère d’origine ou de temps, en parallèle avec « depuis le commencement », ou comme le complément d’objet de « comprendre ». Le texte principal retient la première lecture, mieux intégrée à la progression du verset, tout en signalant l’autre lecture possible.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les quatre questions rhétoriques et leur parallélisme sont maintenus. Les pronoms « le » renvoient implicitement à la vérité proclamée dans le contexte, sans ajouter un référent absent de l’hébreu.
