revisions:
- from: Ne le savez-vous pas ? Ne l’avez-vous pas entendu ? Ne vous l’a-t-on pas annoncé depuis le commencement ? Ne l’avez-vous pas compris depuis que les fondations de la terre ont été posées ?[a]
  to: Ne savez-vous pas ? N’entendez-vous pas ? Ne vous l’a-t-on pas annoncé dès le commencement ? Ne l’avez-vous pas compris depuis les fondations de la terre ?[a]
  rationale: La révision supprime l’ajout « ont été posées », qui n’est pas formulé dans l’hébreu, tout en conservant dans le texte principal la lecture circonstancielle adoptée dans l’audit anglais. La note maintient explicitement l’autre analyse syntaxique possible. Les deux premières questions retrouvent leur concision sans objet exprimé, conformément au texte source.
