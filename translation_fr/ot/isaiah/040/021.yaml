    issue: Ajout explicite de « ont été posées » dans la dernière question
    rationale: מוֹסְדוֹת הָאָרֶץ signifie littéralement « les fondations de la terre » ; le verbe « poser » n’est pas exprimé. Même si la lecture temporelle est possible, cet ajout explicite une image et une relation syntaxique que l’hébreu laisse ouvertes.
  - severity: low
    issue: Pronoms objets ajoutés dans les deux premières questions
    rationale: Le texte hébreu dit simplement « Ne savez-vous pas ? Ne լս-vous pas ? ». En français, l’omission est naturelle et préserve mieux le parallélisme bref de l’original.
