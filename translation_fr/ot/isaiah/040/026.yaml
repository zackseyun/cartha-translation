source:
  edition: WLC
  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
translation:
  language: fr
  text: 'Levez les yeux vers les hauteurs et regardez : qui a créé tout cela ? C’est lui qui fait sortir leur armée en nombre[a] et les appelle tous par leur nom. À cause de l’abondance de sa vigueur et de sa grande puissance, pas un ne manque.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’« armée » désigne ici la multitude ordonnée des corps célestes. Ou : « il appelle chacun par son nom ».'
    reason: Précise le sens céleste de צְבָאָם et fournit l’alternative de portée distributive pour לְכֻלָּם בְּשֵׁם יִקְרָא.
  - marker: b
    text: 'Littéralement : « à cause de l’abondance de vigueur et parce qu’il est puissant en force, pas un ne manque ». Le dernier tour emploie « homme » au sens distributif : aucun membre n’est absent.'
    reason: Signale l’ellipse et la construction de puissance de l’hébreu, ainsi que la valeur distributive de אִישׁ.
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  choice: Levez les yeux vers le ciel
  rationale: Rend naturellement l’ordre de porter le regard vers les hauteurs; « le ciel » explicite sans excès le domaine visible indiqué par מָרוֹם dans ce contexte.
- source_word: וּרְאוּ
  choice: et regardez
  rationale: Conserve le second impératif et invite à considérer ce qui est visible en haut.
- source_word: מִי בָרָא אֵלֶּה
  choice: qui a créé tout cela ?
  rationale: Le démonstratif pluriel hébreu désigne les réalités célestes montrées; « tout cela » est idiomatique en français tout en évitant d’insérer explicitement « les étoiles ».
- source_word: הַמּוֹצִיא בְמִסְפָּר צְבָאָם
  choice: C’est lui qui fait sortir leur armée au complet
  rationale: Le participe est relié clairement à la question précédente. צָבָא garde son image collective et ordonnée avec « armée »; בְמִסְפָּר exprime ici le dénombrement complet et ordonné.
- source_word: לְכֻלָּם בְּשֵׁם יִקְרָא
  choice: qui les appelle toutes par leur nom
  rationale: Suit la totalité exprimée par לְכֻלָּם et l’idée que chaque membre de l’ensemble est personnellement appelé.
- source_word: מֵרֹב אוֹנִים וְאַמִּיץ כֹּחַ
  choice: à cause de sa puissance immense et de sa force vigoureuse
  rationale: Interprète מִן dans son sens causal probable et maintient les deux expressions parallèles de puissance sans les fondre.
- source_word: אִישׁ לֹא נֶעְדָּר
  choice: aucune ne manque
  rationale: Rend le tour distributif hébreu de façon idiomatique; le féminin reprend les composantes de l’« armée » céleste sans suggérer qu’il s’agit d’hommes.
theological_decisions:
- issue: Référent de « tout cela » et de « leur armée »
  choice: Conserver une désignation indirecte des corps célestes dans le texte principal.
  alternative: Traduire explicitement par « les étoiles » et « l’armée des étoiles ».
  rationale: Le contexte indique fortement les astres, mais l’hébreu dit littéralement « ceux-ci » et « leur armée ». La formulation retenue préserve la force de la question et évite une précision supérieure à celle du texte.
- issue: Lien logique de la dernière proposition
  choice: 'Rendre מִן causalement : aucune ne manque à cause de la puissance divine.'
  alternative: 'Conserver une juxtaposition plus littérale : « par l’abondance de sa puissance… aucune ne manque ».'
  rationale: Le sens causal est naturel dans le contexte, tout en laissant intacte l’affirmation que la totalité de l’armée céleste répond à l’appel du Créateur.
- issue: Valeur distributive de אִישׁ
  choice: « aucune ne manque »
  alternative: « pas un homme ne manque » ou « pas une seule n’est absente »
  rationale: אִישׁ ne désigne pas ici un être humain masculin, mais chaque membre pris individuellement. La traduction évite une fausse spécification de genre.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formulation évite l’archaïsme « en haut » et conserve l’image biblique de l’armée céleste, expliquée en note. Tous les marqueurs de notes figurent dans le texte principal.
