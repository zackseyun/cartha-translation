  text: נֹתֵ֥ן לַ/יָּעֵ֖ף כֹּ֑חַ וּ/לְ/אֵ֥ין אוֹנִ֖ים עָצְמָ֥ה יַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
translation:
  language: fr
  text: Il donne de la force à celui qui est épuisé, et il accroît la puissance de celui qui est sans vigueur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹתֵן
  choice: Il donne
  rationale: Le participe qal exprime ici une action caractéristique de Dieu. Le présent français rend naturellement cette valeur générale.
- source_word: לַיָּעֵף
  choice: à celui qui est épuisé
  rationale: Le terme désigne une personne lasse ou à bout de forces. « Épuisé » exprime clairement cet état en français moderne.
- source_word: כֹּחַ
  choice: de la force
  rationale: Dans ce contexte, le nom évoque la capacité personnelle rendue à celui qui est épuisé; « force » est le terme français le plus naturel.
- source_word: וּלְאֵין אוֹנִים
  choice: de celui qui est sans vigueur
  rationale: La construction exprime l'absence de vigueur ou de ressources physiques. Cette formulation conserve la portée individuelle et le parallélisme.
- source_word: עָצְמָה
  choice: la puissance
  rationale: Le nom désigne une force considérable. « Puissance » le distingue de כֹּחַ tout en maintenant le parallélisme poétique.
- source_word: יַרְבֶּה
  choice: il accroît
  rationale: Le hiphil de רבה signifie rendre plus grand ou plus abondant. « Accroît » conserve cette valeur causative dans un registre digne et naturel.
theological_decisions:
- issue: Sujet implicite du verset
  choice: « Il » renvoie à Dieu dans le contexte immédiat.
  alternative: Répéter explicitement « Dieu » ou « le Seigneur ».
  rationale: L'hébreu n'exprime pas le sujet dans ce verset, mais le contexte précédent l'identifie clairement. Le pronom préserve la continuité sans ajouter un nom absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébraïque est conservé, avec une légère variation lexicale entre « force », « vigueur » et « puissance ».
