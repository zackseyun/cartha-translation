base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
translation:
  language: fr
  text: Parlez avec tendresse à Jérusalem[a] et proclamez-lui que son temps de service est accompli, que sa faute est pardonnée[b], qu’elle a reçu de la main de Yahweh le double en raison de tous ses péchés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « parlez au cœur de Jérusalem ». L’expression hébraïque signifie lui parler de manière rassurante et consolante.
    reason: idiome
  - marker: b
    text: 'Ou : « sa peine est agréée » ou « sa dette est acquittée ». Le mot hébreu traduit par « faute » peut aussi désigner la culpabilité ou la peine qui en découle.'
    reason: alternative_lexicale
  - marker: c
    text: « Le double » peut être une manière de parler d’une pleine mesure, et non nécessairement d’une quantité exactement multipliée par deux.
    reason: note_culturelle
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  choice: Parlez au cœur de
  rationale: Cette formulation conserve l’image de l’expression hébraïque, qui signifie parler de manière rassurante et consolante, tout en restant intelligible en français.
- source_word: וְקִרְאוּ אֵלֶיהָ
  choice: et proclamez-lui
  rationale: Le verbe קרא suivi de אֶל exprime ici une annonce adressée directement à Jérusalem. « Proclamez-lui » convient au contexte de la parole prophétique.
- source_word: מָלְאָה צְבָאָהּ
  choice: son temps de service est accompli
  rationale: צָבָא peut désigner la guerre, le service imposé ou la durée assignée à celui-ci. Cette traduction garde l’idée d’une période pénible désormais achevée sans imposer un sens strictement militaire.
- source_word: נִרְצָה עֲוֺנָהּ
  choice: sa faute est pardonnée
  rationale: Dans ce contexte de consolation et de restauration, la proposition annonce que la faute a été traitée et que le pardon est accordé. Une note conserve la nuance possible d’une peine agréée ou acquittée.
- source_word: לָקְחָה מִיַּד יְהוָה
  choice: elle a reçu de la main de Yahweh
  rationale: לקח prend naturellement ici le sens de « recevoir », tandis que l’expression « de la main de » maintient l’image hébraïque de la provenance divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כִּפְלַיִם
  choice: le double
  rationale: La traduction directe préserve la force et l’ambiguïté de l’expression, qui peut aussi désigner une pleine mesure plutôt qu’un rapport mathématique exact.
- source_word: בְּכָל חַטֹּאתֶיהָ
  choice: pour tous ses péchés
  rationale: Dans ce contexte, חַטֹּאות désigne les péchés de Jérusalem et non des sacrifices pour le péché.
theological_decisions:
- issue: Sens du « double » reçu de la main de Yahweh
  choice: Maintenir « le double » dans le texte sans préciser s’il s’agit d’une quantité mathématique exacte.
  alternative: Traduire explicitement par « la pleine mesure » ou comprendre une punition strictement doublée.
  rationale: Le contexte renvoie au jugement déjà subi, mais l’expression peut être idiomatique. La formulation littérale préserve cette tension.
- issue: Portée de נִרְצָה עֲוֺנָהּ
  choice: Rendre le résultat par « sa faute est pardonnée ».
  alternative: « Sa peine est agréée/acquittée » ou « sa faute a reçu satisfaction ».
  rationale: Le contexte de restauration favorise l’annonce du pardon, tandis que la note signale que le verbe hébreu évoque plus directement l’acceptation ou l’acquittement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme ternaire de l’hébreu est conservé. « Parlez au cœur » maintient l’image originale tout en étant éclairé par une note; « temps de service » évite de réduire צָבָא à la guerre seule.
