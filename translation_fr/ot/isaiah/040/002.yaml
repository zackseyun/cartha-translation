  naturalness: « Parlez au cœur de Jérusalem » est un calque compréhensible, mais peu naturel en français moderne et ne transmet pas spontanément la valeur idiomatique rassurante de דַּבְּרוּ עַל־לֵב. « Parlez avec tendresse à Jérusalem » est naturel, fidèle à la fonction de l’idiome et conserve le ton prophétique. « Le double pour tous ses péchés » est également lourd en français; « le double en raison de tous ses péchés » exprime naturellement le rapport indiqué par la préposition.
  terminology: « Yahweh » est maintenu conformément au dossier. « Faute », « péchés », « service » et « double » sont adaptés au registre moderne et ne surinterprètent pas les expressions hébraïques.
