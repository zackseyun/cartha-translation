reference: Isaiah 40:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
translation:
  language: fr
  text: 'Une voix proclame : « Dans le désert, préparez le chemin de Yahvé[a] ; dans la plaine aride, rendez droite une route pour notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre ponctuation : « Une voix proclame dans le désert : “Préparez le chemin de Yahvé ; dans la plaine aride, rendez droite une route pour notre Dieu.” »'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וֹל
  choice: Une voix
  rationale: קול désigne ici une voix ; l’indéfini convient à cette ouverture prophétique.
- source_word: קוֹרֵא
  choice: proclame
  rationale: Le participe signifie « appelant ». « Proclame » exprime naturellement en français la fonction publique et solennelle du héraut.
- source_word: בַּמִּדְבָּר
  choice: Dans le désert
  rationale: Le terme désigne une région sauvage ou désertique. Suivant les accents massorétiques, le syntagme est rattaché à l’impératif qui suit, sans supprimer l’autre analyse possible.
- source_word: פַּנּוּ
  choice: préparez
  rationale: Dans l’image de l’aménagement d’une voie, le verbe signifie dégager ou préparer le passage.
- source_word: דֶּרֶךְ
  choice: le chemin
  rationale: דרך peut désigner un chemin, une route ou une voie ; « chemin » conserve aussi la portée métaphorique du passage.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin plutôt que de le remplacer par un titre.
- source_word: יַשְּׁרוּ
  choice: rendez droite
  rationale: Le verbe signifie rendre droit ou uni ; cette formulation conserve l’image concrète et le parallélisme.
- source_word: בָּעֲרָבָה
  choice: dans la plaine aride
  rationale: ערבה désigne plus précisément une plaine désertique ou une steppe aride ; « plaine aride » la distingue de מדבר tout en restant accessible.
- source_word: מְסִלָּה
  choice: une route
  rationale: מסלה est une voie aménagée, souvent surélevée. « Route » restitue clairement l’image, sans la connotation moderne particulière d’« autoroute ».
- source_word: לֵאלֹהֵינוּ
  choice: pour notre Dieu
  rationale: אלהים, malgré sa forme morphologiquement plurielle, désigne ici au singulier le Dieu d’Israël.
theological_decisions:
- issue: Rattachement syntaxique de « dans le désert »
  choice: 'Rattacher « dans le désert » à l’ordre : « Dans le désert, préparez… »'
  alternative: 'Le rattacher à la proclamation : « Une voix proclame dans le désert : “Préparez…” »'
  rationale: Les accents massorétiques favorisent le rattachement à l’impératif. L’hébreu consonantique permet toutefois l’autre ponctuation, connue notamment par les citations néotestamentaires ; elle est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Proclame » porte la force du cri du héraut sans rudesse ; « plaine aride » préserve la distinction lexicale entre מִדְבָּר et עֲרָבָה.
