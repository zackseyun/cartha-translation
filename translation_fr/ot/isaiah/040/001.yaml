  text: נַחֲמ֥וּ נַחֲמ֖וּ עַמִּ֑/י יֹאמַ֖ר אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/001.yaml
  text: Comfort[a], comfort my people[b], says your God.
translation:
  language: fr
  text: « Consolez, consolez mon peuple[a] », dit votre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Réconfortez, réconfortez mon peuple. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dira votre Dieu »; l’inaccompli hébreu sert ici à introduire la parole prophétique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲמוּ
  choice: Consolez
  rationale: 'Impératif pluriel du piel de נחם : il appelle directement plusieurs destinataires à apporter consolation et réconfort. « Consolez » est naturel, digne et conserve la concision de l’hébreu.'
- source_word: נַחֲמוּ נַחֲמוּ
  choice: Consolez, consolez
  rationale: La répétition est maintenue afin de rendre l’insistance, l’urgence et la solennité de l’appel hébreu.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Cette expression conserve le possessif et la portée communautaire et relationnelle de עם, notamment sa résonance d’alliance.
- source_word: יֹאמַר
  choice: dit
  rationale: Bien que la forme soit un inaccompli et puisse littéralement se rendre par « dira », elle introduit ici une parole prophétique. Le présent français « dit » exprime naturellement cette fonction tout en laissant l’alternative littérale en note.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: אֱלֹהִים désigne ici le Dieu unique d’Israël; le suffixe de deuxième personne du pluriel est rendu par « votre ».
theological_decisions:
- issue: Identification du locuteur et tonalité de l’alliance
  choice: « dit votre Dieu » présente Dieu comme la source de l’ordre, sans préciser à qui les impératifs pluriels sont adressés.
  alternative: « dira votre Dieu », avec une nuance future plus explicite.
  rationale: La formulation conserve la relation restaurée exprimée par « mon peuple » et « votre Dieu », sans ajouter d’identification interprétative des messagers chargés de consoler.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition rhétorique de l’hébreu est conservée; la ponctuation française distingue l’ordre divin de l’introduction du locuteur.
