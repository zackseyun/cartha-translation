source:
  edition: WLC
  text: הִנֵּ֨ה אֲדֹנָ֤/י יְהוִה֙ בְּ/חָזָ֣ק יָב֔וֹא וּ/זְרֹע֖/וֹ מֹ֣שְׁלָה ל֑/וֹ הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
translation:
  language: fr
  text: Voici, le Seigneur Yahweh[a] vient avec puissance[b], et son bras exerce le pouvoir à son service[c]. Voici, sa récompense est avec lui, et sa rétribution devant lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Seigneur Yahweh », titre qui associe אֲדֹנָי (« Seigneur ») au nom divin יהוה (« Yahweh »).'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « viendra avec force ». La forme hébraïque peut recevoir un sens futur plus explicite.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « et son bras gouverne pour lui » ou « exerce le pouvoir en sa faveur ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « son salaire est avec lui, et le produit de son travail devant lui ». Les deux termes hébreux peuvent évoquer la récompense, le salaire ou la rétribution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve, aux deux occurrences, la force déictique et solennelle de l’interjection prophétique tout en restant naturel en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition artificielle « le Seigneur SEIGNEUR ».
- source_word: בְּחָזָק
  choice: avec puissance
  rationale: Exprime la manière dont Yahweh vient, sans transformer avec certitude l’adjectif substantivé en épithète personnelle comme « en homme puissant ».
- source_word: יָבוֹא
  choice: vient
  rationale: Le présent donne à l’annonce prophétique sa vivacité et sa certitude; l’imparfait hébreu permet également une traduction explicitement future.
- source_word: וּזְרֹעוֹ
  choice: et son bras
  rationale: Préserve l’image biblique du bras comme instrument de puissance et d’action.
- source_word: מֹשְׁלָה לוֹ
  choice: exerce la domination pour lui
  rationale: Le participe féminin s’accorde avec « son bras » et décrit l’exercice effectif de l’autorité; « pour lui » maintient la valeur du complément לוֹ sans la préciser excessivement.
- source_word: שְׂכָרוֹ
  choice: sa récompense
  rationale: Convient au parallélisme prophétique et couvre ici le sens de salaire ou de récompense.
- source_word: אִתּוֹ
  choice: est avec lui
  rationale: Rend directement l’idée d’accompagnement ou de présence.
- source_word: וּפְעֻלָּתוֹ
  choice: et sa rétribution
  rationale: Dans le parallélisme avec שְׂכָרוֹ, le terme désigne vraisemblablement le produit ou paiement du travail; « rétribution » conserve cette nuance sans réduire le sens à un salaire commercial.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Préserve l’image spatiale et la construction poétique, sans décider si la rétribution est simplement en sa présence ou marche devant lui.
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. « Le Seigneur Yahweh » représente les deux éléments et évite de masquer le nom divin.
- issue: Référent de la récompense et de la rétribution
  choice: Maintenir les possessifs « sa » sans identifier les bénéficiaires ni préciser la nature de ce qui est apporté
  alternative: Expliciter qu’il apporte la récompense destinée à son peuple et le salaire destiné à ses ennemis ou à ses serviteurs
  rationale: Le verset lui-même ne nomme pas les bénéficiaires et le vocabulaire permet plusieurs nuances; l’explicitation imposerait une interprétation contextuelle dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme prophétique est conservé par la double occurrence de « Voici » et par le parallélisme des deux derniers membres. Le nom « Yahweh » est maintenu comme nom propre, tandis que les ambiguïtés temporelles et lexicales importantes sont signalées en notes.
