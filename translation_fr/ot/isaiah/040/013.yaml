  text: מִֽי תִכֵּ֥ן אֶת ר֖וּחַ יְהוָ֑ה וְ/אִ֥ישׁ עֲצָת֖/וֹ יוֹדִיעֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
translation:
  language: fr
  text: Qui a mesuré l’Esprit de Yahweh[a], et quel homme lui a fait connaître le conseil de Yahweh ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pensée de Yahweh ». Le mot hébreu peut désigner l’esprit, le souffle ou la disposition intérieure ; la tradition grecque, reprise en Romains 11.34, porte « pensée ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre rendu possible : « Qui a dirigé l’Esprit de Yahweh, ou qui peut l’instruire ? » Ces rendus interprétatifs des verbes sont également liés à la tradition grecque, qui parle de connaître la pensée du Seigneur et d’être son conseiller.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique; « Qui » en restitue directement la force.
- source_word: תִכֵּן
  choice: a mesuré
  rationale: Le verbe תכן évoque fondamentalement l’action de mesurer, peser ou déterminer. « A mesuré » conserve la métaphore concrète et son lien avec le contexte d’Ésaïe 40.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: רוּחַ peut désigner l’esprit, le souffle ou la disposition intérieure. Avec le nom divin, « l’Esprit de Yahweh » est naturel tout en maintenant l’ambiguïté lexicale dans une note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וְאִישׁ
  choice: et quel homme
  rationale: Le nom singulier אִישׁ signifie « homme ». L’ajout interrogatif de « quel » rend explicitement en français la continuité de la question rhétorique.
- source_word: עֲצָתוֹ
  choice: son conseil
  rationale: עֵצָה peut désigner un conseil, un dessein ou un projet. « Conseil » préserve ici la nuance délibérative sans exclure celle de dessein.
- source_word: יוֹדִיעֶנּוּ
  choice: lui a fait connaître
  rationale: 'La forme causative de ידע signifie « faire connaître, informer ». Le suffixe objet renvoie vraisemblablement à Yahweh : aucun homme ne lui a fait connaître son conseil.'
theological_decisions:
- issue: Sens de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: la pensée de Yahweh
  rationale: Le texte massorétique emploie רוּחַ, dont le champ sémantique inclut esprit, souffle et disposition intérieure. Le texte principal reste proche de l’hébreu, tandis que la note conserve l’autre compréhension attestée par la tradition grecque et Romains 11.34.
- issue: Fonction de תִכֵּן
  choice: a mesuré
  alternative: a dirigé / a instruit
  rationale: « Mesuré » correspond au sens concret du verbe hébreu et au contexte immédiat. Les lectures « dirigé » ou « instruit » expriment une interprétation ancienne sans devoir remplacer le sens lexical dans le texte principal.
- issue: Référent du suffixe dans יוֹדִיעֶנּוּ
  choice: « lui » renvoie à Yahweh
  alternative: 'traduction interprétative : « qui peut l’instruire ? »'
  rationale: 'La construction est rendue de façon transparente : « lui faire connaître son conseil ». Cela préserve la question de l’indépendance absolue de Dieu sans ajouter explicitement le verbe « instruire ».'
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde le parallélisme de la question rhétorique, le nom divin Yahweh et la métaphore concrète de la mesure. Les variantes anciennes sont signalées sans être imposées au texte principal.
