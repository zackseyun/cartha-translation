source:
  edition: WLC
  text: לָ֤/מָּה תֹאמַר֙ יַֽעֲקֹ֔ב וּ/תְדַבֵּ֖ר יִשְׂרָאֵ֑ל נִסְתְּרָ֤ה דַרְכִּ/י֙ מֵֽ/יְהוָ֔ה וּ/מֵ/אֱלֹהַ֖/י מִשְׁפָּטִ֥/י יַעֲבֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/027.yaml
  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
translation:
  language: fr
  text: 'Pourquoi dis-tu, Jacob, et parles-tu, Israël : « Mon chemin est caché à Yahweh, et mon droit[a] échappe à mon Dieu » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma cause » ou « la justice qui m’est due ». Le mot hébreu peut désigner le droit d’une personne, sa cause à défendre ou la justice qu’elle attend.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Rend naturellement la question rhétorique qui met en cause la plainte d’Israël.
- source_word: תֹאמַר … וּתְדַבֵּר
  choice: dis-tu … et pourquoi parles-tu ainsi
  rationale: Préserve le parallélisme et la légère variation entre אמר et דבר. La répétition de « pourquoi » et l’ajout idiomatique de « ainsi » donnent une tournure française claire sans modifier le contenu de la plainte citée.
- source_word: יַעֲקֹב … יִשְׂרָאֵל
  choice: Jacob … Israël
  rationale: Conserve les deux noms parallèles par lesquels le prophète interpelle le peuple.
- source_word: נִסְתְּרָה דַרְכִּי
  choice: Mon chemin est caché
  rationale: Conserve le passif et la métaphore du « chemin », qui peut évoquer le parcours, la situation ou la destinée du peuple sans en réduire le sens.
- source_word: מֵיְהוָה
  choice: à Yahweh
  rationale: Le français dit naturellement qu’une chose est « cachée à » quelqu’un. Le nom divin est rendu par « Yahweh ».
- source_word: מִשְׁפָּטִי
  choice: mon droit
  rationale: Dans cette plainte, מִשְׁפָּטִי désigne vraisemblablement le droit ou la cause qui devrait être reconnu et défendu. « Mon droit » est plus idiomatique en français que « ma justice », tandis que les autres nuances sont signalées en note.
- source_word: יַעֲבוֹר
  choice: échappe
  rationale: Exprime naturellement en français l’image de quelque chose qui passe hors de l’attention ou de l’intervention de Dieu, sans expliciter excessivement par « est ignoré ».
- source_word: מֵאֱלֹהַי
  choice: à mon Dieu
  rationale: Avec « échappe », la préposition française « à » rend idiomatiquement la relation exprimée par מִן, tout en conservant « mon Dieu » et sa portée relationnelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom d’alliance.
- issue: Sens de מִשְׁפָּטִי dans la plainte
  choice: mon droit
  alternative: ma cause ; la justice qui m’est due
  rationale: Le terme peut désigner le droit du locuteur, sa cause à défendre ou la justice qui devrait lui être rendue. Le texte principal retient une formulation française concise, et la note maintient l’étendue sémantique ainsi que la tension créée par l’impression d’un délaissement divin.
- issue: Portée de יַעֲבוֹר
  choice: échappe à mon Dieu
  alternative: est ignoré par mon Dieu ; passe loin de mon Dieu
  rationale: « Échappe » préserve une trace de l’image dynamique du verbe tout en exprimant clairement la perception du peuple. La formulation présente cette négligence comme la plainte citée d’Israël, non comme un jugement du narrateur.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. L’interpellation poétique et le parallélisme sont conservés, tandis que « parles-tu ainsi » rend la seconde formule naturelle. La plainte reste volontairement forte et non résolue dans ce verset.
