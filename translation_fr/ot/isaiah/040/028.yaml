id: ISA.40.28
reference: Isaiah 40:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
translation:
  language: fr
  text: Ne le sais-tu pas ? Ne l’as-tu pas entendu ? Yahweh est le Dieu éternel[a], le Créateur des extrémités de la terre. Il ne faiblit pas et ne se fatigue pas ; son intelligence est insondable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin traditionnellement rendu par « le Seigneur ».'
    reason: Explique la forme « Yahweh » et indique l’autre convention de traduction courante.
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Ne le sais-tu pas ?
  rationale: La question rhétorique attend une réponse affirmative et rappelle à l’interlocuteur ce qu’il devrait déjà savoir.
- source_word: אִם לֹא שָׁמַעְתָּ
  choice: Ne l’as-tu pas entendu ?
  rationale: Dans ce parallélisme, אִם לֹא introduit une seconde question rhétorique plutôt qu’une véritable proposition conditionnelle.
- source_word: אֱלֹהֵי עוֹלָם
  choice: le Dieu éternel
  rationale: Le syntagme construit signifie littéralement « Dieu d’éternité » ; « le Dieu éternel » en restitue naturellement la durée sans fin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français du nom divin YHWH, qui conserve ici sa fonction de nom propre.
- source_word: בּוֹרֵא
  choice: le Créateur
  rationale: Le participe qal est employé comme désignation en apposition à Yahweh.
- source_word: קְצוֹת הָאָרֶץ
  choice: des extrémités de la terre
  rationale: Conserve l’image spatiale des confins ou parties les plus éloignées de la terre.
- source_word: לֹא יִיעַף וְלֹא יִיגָע
  choice: Il ne faiblit pas et ne se fatigue pas
  rationale: 'Les deux verbes proches sont distingués par une formulation française naturelle : défaillance d’une part, fatigue ou épuisement d’autre part.'
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: son intelligence est insondable
  rationale: La tournure hébraïque signifie qu’aucune investigation ne peut parvenir au fond de son discernement ; « insondable » garde cette métaphore.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre YHWH. « Yahweh » le représente comme nom plutôt que de lui substituer un titre, tandis qu’une note signale la graphie hébraïque.
- issue: Portée de l’intelligence divine
  choice: son intelligence est insondable
  alternative: nul ne peut sonder son intelligence
  rationale: La formulation conserve l’affirmation absolue אֵין חֵקֶר sans en préciser davantage le mécanisme ni résoudre sa tension théologique.
translation_notes:
  register: Français moderne, international et digne. Les questions brèves conservent la force de rappel du texte. « Extrémités de la terre » maintient l’image biblique sans obscurité majeure ; « insondable » reste courant dans un registre soutenu accessible.
