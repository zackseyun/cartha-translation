source:
  edition: WLC
  text: וְ/אֶל מִ֥י תְדַמְּי֖וּ/נִי וְ/אֶשְׁוֶ֑ה יֹאמַ֖ר קָדֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/025.yaml
  text: To whom then will you compare me[a], that I should be equal? says the Holy One.
translation:
  language: fr
  text: « À qui donc me comparerez-vous ? À qui serais-je égal ? » dit le Saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל מִי
  choice: À qui donc
  rationale: Introduit naturellement en français l’objet de la comparaison et marque la transition rhétorique du discours, sans rendre mécaniquement le וְ initial.
- source_word: תְדַמְּיוּנִי
  choice: me comparerez-vous
  rationale: Le piel de דמה signifie ici « comparer, assimiler ». Cette formulation est claire, actuelle et conserve la question rhétorique ainsi que la deuxième personne du pluriel.
- source_word: וְאֶשְׁוֶה
  choice: pour que je sois son égal
  rationale: שוה exprime ici l’égalité ou l’équivalence résultant de la comparaison. « Son » reprend idiomatiquement en français la personne indéfinie évoquée par « qui », sans transformer le verbe à la première personne.
- source_word: יֹאמַר
  choice: dit
  rationale: Dans cette formule prophétique, l’imparfait hébreu présente la parole divine. Le présent français « dit » convient à une déclaration actuelle et solennelle.
- source_word: קָדוֹשׁ
  choice: le Saint
  rationale: Le terme est employé seul comme titre divin. « Le Saint » est naturel en français et n’ajoute pas « d’Israël », absent du texte.
theological_decisions:
- issue: Incomparabilité et autodésignation divines
  choice: Conserver la question rhétorique et le titre exact « le Saint » sans développement doctrinal.
  alternative: Paraphraser par « Qui peut se comparer à moi ? » ou employer « le Saint d’Israël ».
  rationale: Le texte affirme l’unicité de Dieu par une question adressée aux auditeurs. La syntaxe et le titre bref doivent rester perceptibles sans ajout confessionnel.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion interrogative maintient la solennité de l’adresse prophétique sans archaïsme marqué.
source_grounding:
  english_pob_role: consult_only
