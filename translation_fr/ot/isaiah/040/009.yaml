  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַ֣ל הַר גָּבֹ֤הַ עֲלִי לָ/ךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַ/כֹּ֨חַ֙ קוֹלֵ֔/ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל תִּירָ֔אִי אִמְרִי֙ לְ/עָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
translation:
  language: fr
  text: 'Monte sur une haute montagne, toi qui annonces une bonne nouvelle à Sion[a] ! Élève la voix avec force, toi qui annonces une bonne nouvelle à Jérusalem[b] ! Élève-la, n’aie pas peur ! Dis aux villes de Juda : « Voici votre Dieu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sion, toi qui annonces une bonne nouvelle, monte sur une haute montagne… » L’hébreu permet aussi de comprendre que Sion, personnifiée, est directement interpellée comme messagère.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Jérusalem, toi qui annonces une bonne nouvelle, élève la voix avec force. » Le participe féminin peut désigner la ville personnifiée plutôt qu’une messagère qui lui apporte la nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבַשֶּׂרֶת
  choice: toi qui annonces une bonne nouvelle
  rationale: Le participe féminin singulier désigne celle qui annonce une bonne nouvelle, mais peut syntaxiquement qualifier une messagère ou les villes personnifiées. Cette formulation reste naturelle tout en laissant les notes exposer les principales analyses.
- source_word: עֲלִי
  choice: Monte
  rationale: Impératif féminin singulier de עלה ; « monte » exprime simplement le déplacement vers un lieu élevé.
- source_word: הַר גָּבֹהַ
  choice: une haute montagne
  rationale: Rend le lieu élevé d’où la proclamation doit être largement entendue ; l’indéfini est idiomatique en français dans ce contexte.
- source_word: הָרִימִי ... קוֹלֵךְ
  choice: Élève la voix
  rationale: Expression française digne et naturelle qui conserve l’image hébraïque ainsi que la force de l’impératif.
- source_word: בַכֹּחַ
  choice: avec force
  rationale: Conserve la forme nominale de כֹּחַ et souligne la vigueur de la proclamation.
- source_word: אַל תִּירָאִי
  choice: n’aie pas peur
  rationale: Interdiction directe au féminin singulier, formulée en français courant.
- source_word: לְעָרֵי יְהוּדָה
  choice: aux villes de Juda
  rationale: Traduction directe qui conserve la précision géographique.
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque l’appel à porter attention avec une tournure française claire, solennelle et actuelle.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le nom commun אֱלֹהִים avec suffixe de deuxième personne du pluriel désigne ici le Dieu des villes de Juda ; le tétragramme n’apparaît pas dans ce verset.
theological_decisions:
- issue: Identification syntaxique des participes féminins מְבַשֶּׂרֶת avec Sion et Jérusalem
  choice: Le texte principal s’adresse à une figure féminine qui annonce une bonne nouvelle à Sion et à Jérusalem.
  alternative: 'Sion et Jérusalem peuvent elles-mêmes être les messagères personnifiées : « Sion, toi qui annonces une bonne nouvelle… Jérusalem, toi qui annonces une bonne nouvelle… »'
  rationale: La construction hébraïque admet les deux analyses. Le texte principal suit la lecture où Sion et Jérusalem sont les destinataires, tandis que les notes conservent explicitement la lecture vocative et la possibilité de traduire le participe comme un titre nominal.
- issue: Traduction de אֱלֹהִים
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: Le mot employé est אֱלֹהִים, non le nom divin יהוה ; « votre Dieu » respecte donc la distinction lexicale du texte.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs au féminin singulier reflètent la grammaire hébraïque sans alourdir le texte. « Voici » garde le relief prophétique de הִנֵּה, et la répétition d’« Élève » préserve l’insistance de l’original.
