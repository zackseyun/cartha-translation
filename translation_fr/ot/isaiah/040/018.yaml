  yaml_path: translation/ot/isaiah/040/018.yaml
  text: To whom[a], then, will you liken God, and what likeness will you compare to him?
translation:
  language: fr
  text: À qui donc[a] comparerez-vous Dieu, et quelle ressemblance placerez-vous auprès de lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et à qui comparerez-vous Dieu, et quelle forme placerez-vous à côté de lui ? »'
    reason: 'Alternative lexicale et syntaxique : וְ peut se rendre par « et » plutôt que par « donc » ; דְּמוּת peut désigner une « forme », et ערך évoque l’action de placer ou de disposer en regard.'
lexical_decisions:
- source_word: וְ/אֶל מִי
  choice: À qui donc
  rationale: אֶל מִי désigne l’objet de la comparaison. Le וְ initial relie cette question au développement précédent ; « donc » rend naturellement cette transition dans le discours français.
- source_word: תְּדַמְּיוּן
  choice: comparerez-vous
  rationale: Le verbe דמה exprime ici l’idée d’établir une ressemblance ou une comparaison. « Comparerez-vous » est clair, naturel et convient à la question rhétorique.
- source_word: אֵל
  choice: Dieu
  rationale: Dans le contexte d’Ésaïe 40, אֵל désigne Dieu, présenté comme incomparable, par opposition aux représentations fabriquées.
- source_word: דְּמוּת
  choice: représentation
  rationale: דְּמוּת peut désigner une ressemblance, une forme ou une figure. « Représentation » convient au contexte immédiat des images façonnées sans réduire le terme au seul objet matériel.
- source_word: תַּעַרְכוּ לֽוֹ
  choice: mettrez-vous en parallèle avec lui
  rationale: ערך signifie fondamentalement disposer ou placer, et prend ici le sens de mettre une forme en regard de Dieu afin de la comparer à lui. Cette tournure conserve à la fois l’image spatiale et la force comparative.
theological_decisions:
- issue: Sens de אֵל dans cette question contre l’idolâtrie
  choice: Dieu
  alternative: un dieu
  rationale: Le contexte présente celui qui a créé et gouverne le monde comme l’unique référent de la question. « Dieu » préserve cette portée sans ajouter de qualification doctrinale.
- issue: Rapport entre Dieu et la דְּמוּת
  choice: une représentation mise en parallèle avec lui
  alternative: une image comparée à lui
  rationale: Le texte conteste toute représentation susceptible d’être placée en regard de Dieu. La traduction conserve cette tension sans préciser davantage la nature de la représentation.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. L’inversion interrogative maintient la dignité et la force rhétorique du texte ; « mettre en parallèle » reste accessible tout en reflétant les deux verbes hébreux distincts.
