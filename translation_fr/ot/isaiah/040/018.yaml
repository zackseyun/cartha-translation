  terminology: « Dieu » rend correctement אֵל dans le contexte. « Ressemblance » rend δְּמוּת sans imposer d’emblée le sens plus étroit de représentation matérielle. La note conserve « forme » comme possibilité contextuelle et explicite la conjonction initiale.
