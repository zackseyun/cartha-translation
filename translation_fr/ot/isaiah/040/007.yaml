  revision_rationale: La révision remplace « passe sur elle » par « souffle sur elle » afin de traduire directement נשבה et de conserver le lien causal avec le dessèchement. Elle allège aussi la conclusion tout en préservant l’emphase de אָכֵן. La note est harmonisée avec la formulation révisée et maintient l’ambiguïté lexicale de רוּחַ sans la trancher doctrinalement.
