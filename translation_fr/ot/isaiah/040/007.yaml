source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
translation:
  language: fr
  text: L’herbe se dessèche, la fleur se flétrit, car le souffle de Yahweh souffle sur elle[a]. Oui, le peuple est de l’herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent de Yahweh souffle sur elle » ; moins probablement, « l’Esprit de Yahweh souffle sur elle ».
    reason: Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ». Dans le contexte végétal, « souffle » et « vent » sont les sens les plus probables; « Esprit » demeure possible, mais moins probable.
lexical_decisions:
- source_word: יָבֵשׁ
  choice: se dessèche
  rationale: Le qal de יבש exprime le fait de devenir sec. Le présent français convient à la portée générale et poétique de l’image.
- source_word: חָצִיר
  choice: l’herbe
  rationale: Dans ce contexte végétal et métaphorique, « herbe » est le terme français le plus direct et naturel.
- source_word: נָבֵל
  choice: se flétrit
  rationale: Le verbe décrit le dépérissement d’une fleur. « Se flétrit » restitue précisément l’image et le parallélisme poétique.
- source_word: צִיץ
  choice: la fleur
  rationale: « Fleur » est clair, courant et adapté au contraste entre la beauté passagère de la végétation et sa disparition.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la cause du dessèchement. « Car » garde un ton poétique et soutenu sans être archaïque.
- source_word: רוּחַ
  choice: le souffle
  rationale: רוּחַ peut désigner le souffle, le vent ou l’Esprit. « Souffle » maintient ici l’action personnelle de Yahweh tout en laissant percevoir l’image d’un vent desséchant; les autres sens sont signalés en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: נָשְׁבָה
  choice: passe
  rationale: Le verbe signifie « souffler ». Avec le nom « souffle », « passe sur elle » évite en français la répétition pesante « le souffle souffle » tout en conservant l’image d’un courant d’air qui atteint l’herbe.
- source_word: בּוֹ
  choice: sur elle
  rationale: Le pronom renvoie naturellement à l’herbe, nom féminin en français; la préposition indique l’action exercée sur elle.
- source_word: אָכֵן
  choice: oui … bien
  rationale: Cette tournure rend l’affirmation emphatique de אָכֵן dans un français actuel et naturel.
- source_word: הָעָם
  choice: le peuple
  rationale: La traduction conserve le collectif défini de l’hébreu sans préciser indûment s’il s’agit d’Israël en particulier ou des humains en général.
theological_decisions:
- issue: Sens de רוּחַ יְהוָה
  choice: le souffle de Yahweh
  alternative: le vent de Yahweh; l’Esprit de Yahweh
  rationale: Le contexte de végétation desséchée favorise « souffle » ou « vent ». « Souffle » conserve à la fois l’image naturelle et l’action personnelle divine. « Esprit » reste lexicalement possible, mais paraît moins probable ici; l’ambiguïté est préservée en note.
- issue: Portée de הָעָם
  choice: le peuple
  alternative: l’humanité; la nation
  rationale: Le texte emploie le terme collectif défini sans expliciter davantage son référent. La traduction ne tranche donc pas entre le peuple présent dans le contexte et une application plus largement humaine.
translation_notes:
  register: Français international moderne, poétique et digne. Le présent rend la maxime générale du passage. Le parallélisme bref de l’hébreu est conservé, tandis que « passe sur elle » évite une répétition peu naturelle en français.
