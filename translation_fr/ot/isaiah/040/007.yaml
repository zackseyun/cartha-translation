revisions:
- from: L’herbe se dessèche, la fleur se flétrit, car le souffle de Yahweh passe sur elle[a]. Oui, le peuple est bien de l’herbe.
  to: L’herbe se dessèche, la fleur se flétrit, car le souffle de Yahweh souffle sur elle[a]. Oui, le peuple est de l’herbe.
  rationale: La révision remplace « passe sur elle » par « souffle sur elle » afin de traduire directement נשבה et de conserver le lien causal avec le dessèchement. Elle allège aussi la conclusion tout en préservant l’emphase de אָכֵן. La note est harmonisée avec la formulation révisée et maintient l’ambiguïté lexicale de רוּחַ sans la trancher doctrinalement.
