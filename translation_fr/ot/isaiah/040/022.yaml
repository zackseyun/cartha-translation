source:
  edition: WLC
  text: הַ/יֹּשֵׁב֙ עַל ח֣וּג הָ/אָ֔רֶץ וְ/יֹשְׁבֶ֖י/הָ כַּ/חֲגָבִ֑ים הַ/נּוֹטֶ֤ה כַ/דֹּק֙ שָׁמַ֔יִם וַ/יִּמְתָּחֵ֥/ם כָּ/אֹ֖הֶל לָ/שָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
translation:
  language: fr
  text: C’est lui qui siège au-dessus du cercle de la terre[a] ; ses habitants sont comme des sauterelles. Il déploie les cieux comme une fine étoffe[b] et les étend comme une tente destinée à être habitée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la voûte de la terre » ou « de l’horizon de la terre ». Le mot hébreu peut désigner une étendue circulaire ou une limite en forme de voûte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme un voile fin » ou « comme une gaze ». Le terme hébreu désigne quelque chose de mince ou de fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: C’est lui qui siège
  rationale: Le participe substantivé décrit Dieu dans une position ou une action continue. « Siège » garde un registre digne sans ajouter explicitement « sur un trône », absent du verbe hébreu.
- source_word: עַל
  choice: au-dessus de
  rationale: Dans ce contexte d’exaltation cosmique, cette formulation exprime naturellement la position transcendante de Dieu sans suggérer un contact matériel.
- source_word: חוּג
  choice: cercle
  rationale: « Cercle » est l’équivalent direct qui préserve l’image poétique hébraïque sans imposer un modèle cosmologique précis. Les sens possibles de voûte ou d’horizon sont signalés en note.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte cosmique vise l’ensemble de la terre plutôt qu’un territoire particulier.
- source_word: וְיֹשְׁבֶיהָ
  choice: ses habitants
  rationale: Formulation française naturelle qui rend le participe nominal et son suffixe pronominal.
- source_word: כַּחֲגָבִים
  choice: comme des sauterelles
  rationale: Le terme désigne des insectes de type sauterelle ou criquet. « Sauterelles » met clairement en valeur leur petitesse dans la comparaison, sans évoquer nécessairement un fléau.
- source_word: הַנּוֹטֶה
  choice: Il déploie
  rationale: Le participe poursuit la description de Dieu. « Déploie » rend l’action d’étendre et convient à l’image d’une étoffe.
- source_word: כַדֹּק
  choice: comme une étoffe légère
  rationale: דֹק évoque quelque chose de mince, fin ou léger. « Étoffe légère » transmet cette qualité et prépare naturellement l’image de la tente.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français conserve la forme et l’ampleur cosmique de l’hébreu, dans un registre poétique digne.
- source_word: וַיִּמְתָּחֵם
  choice: et les étend
  rationale: Le verbe exprime l’extension ou l’étirement. « Étend » demeure précis tout en évitant de répéter « déploie ».
- source_word: כָּאֹהֶל
  choice: comme une tente
  rationale: Cette traduction directe conserve l’image d’un abri dressé pour servir d’habitation.
- source_word: לָשָׁבֶת
  choice: pour qu’on y habite
  rationale: L’infinitif exprime ici le but. Le pronom indéfini « on » conserve l’absence de sujet explicite et évite d’identifier sans fondement textuel les habitants visés.
theological_decisions:
- issue: Image cosmologique de חוּג הָאָרֶץ
  choice: « le cercle de la terre »
  alternative: « la voûte de la terre » ou « l’horizon de la terre »
  rationale: Le passage exalte la transcendance et la puissance créatrice de Dieu au moyen d’une image poétique. La traduction conserve cette image sans lui faire soutenir une cosmologie scientifique ancienne ou moderne particulière.
- issue: Sujet implicite de לָשָׁבֶת
  choice: « pour qu’on y habite »
  alternative: « pour y habiter » ou « afin qu’ils y habitent »
  rationale: L’hébreu ne nomme pas explicitement le sujet de l’habitation. La tournure indéfinie préserve cette ouverture au lieu de décider s’il s’agit de Dieu, des humains ou des êtres célestes.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe a été légèrement segmentée pour rester claire à l’oral comme à l’écrit. Les images concrètes de petitesse, d’étoffe et de tente sont conservées sans surinterprétation cosmologique.
