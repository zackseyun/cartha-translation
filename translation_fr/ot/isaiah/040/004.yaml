  text: כָּל גֶּיא֙ יִנָּשֵׂ֔א וְ/כָל הַ֥ר וְ/גִבְעָ֖ה יִשְׁפָּ֑לוּ וְ/הָיָ֤ה הֶֽ/עָקֹב֙ לְ/מִישׁ֔וֹר וְ/הָ/רְכָסִ֖ים לְ/בִקְעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
translation:
  language: fr
  text: 'Toute vallée sera élevée,

    et toute montagne et toute colline seront abaissées ;

    le terrain irrégulier[a] deviendra plat,

    et les crêtes[b] deviendront une plaine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le terrain tortueux » ; le terme hébreu peut désigner ce qui est tortueux ou irrégulier.
    reason: lexical_alternative
  - marker: b
    text: Ou « les terrains accidentés » ; le nom hébreu est rare et peut désigner plus généralement un relief escarpé ou accidenté. Le terme traduit par « plaine » peut aussi désigner une large vallée.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּיא
  choice: vallée
  rationale: Le nom désigne une vallée ou un ravin. « Vallée » est ici le terme français le plus naturel et forme un contraste net avec la montagne et la colline.
- source_word: יִנָּשֵׂא
  choice: sera élevée
  rationale: Le nifal de נשׂא exprime ici l'élévation de la vallée. La tournure passive conserve l'image vive et le parallélisme du verset.
- source_word: הַר
  choice: montagne
  rationale: Équivalent français courant de ce nom, mis en parallèle avec גִבְעָה.
- source_word: גִבְעָה
  choice: colline
  rationale: Le mot désigne une hauteur généralement moindre qu'une montagne ; « colline » restitue naturellement le couple topographique.
- source_word: יִשְׁפָּלוּ
  choice: seront abaissées
  rationale: Le verbe שׁפל signifie devenir bas ou être abaissé. Cette formulation répond directement à « sera élevée » et convient à la transformation du paysage.
- source_word: הֶעָקֹב
  choice: le terrain irrégulier
  rationale: Le terme peut désigner ce qui est tortueux, irrégulier ou inégal. Dans le contexte de la préparation d'un chemin, la formulation concrète « terrain irrégulier » est claire sans exclure la nuance de sinuosité.
- source_word: לְמִישׁוֹר
  choice: plat
  rationale: מִישׁוֹר désigne un terrain plat, uni ou une plaine. Après « terrain irrégulier », l'adjectif « plat » rend le contraste avec concision.
- source_word: הָרְכָסִים
  choice: les crêtes
  rationale: Ce nom rare semble désigner des reliefs accidentés ou formant des arêtes. « Crêtes » maintient une image topographique concrète, tandis qu'une note signale l'incertitude lexicale.
- source_word: לְבִקְעָה
  choice: une plaine
  rationale: בִקְעָה désigne une large vallée ou une plaine. « Une plaine » exprime clairement l'état final du relief et évite de répéter « vallée ».
theological_decisions:
- issue: Nature de l’image
  choice: Rendre une transformation physique du paysage sans intégrer une interprétation théologique ultérieure au texte principal.
  alternative: Comprendre l’image comme l'abaissement des orgueilleux et l'élévation des humbles, ou comme la préparation eschatologique à la venue du SEIGNEUR.
  rationale: L'hébreu immédiat décrit concrètement le paysage dans le cadre de la préparation d'un chemin. Les lectures métaphoriques et eschatologiques restent possibles dans le contexte, mais ne doivent pas être imposées par la traduction.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé sur quatre lignes, avec un vocabulaire concret et accessible. Les incertitudes portant sur les deux termes topographiques moins précis sont signalées en notes.
