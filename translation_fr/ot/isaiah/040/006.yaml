source:
  edition: WLC
  text: ק֚וֹל אֹמֵ֣ר קְרָ֔א וְ/אָמַ֖ר מָ֣ה אֶקְרָ֑א כָּל הַ/בָּשָׂ֣ר חָצִ֔יר וְ/כָל חַסְדּ֖/וֹ כְּ/צִ֥יץ הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
translation:
  language: fr
  text: 'Une voix dit : « Crie ! » Et j’ai dit[a] : « Que crierai-je ? » Toute chair[b] est herbe, et toute sa beauté[c] est comme la fleur des champs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre lecture traditionnelle : « Et quelqu’un dit » ou « Et il dit ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Toute chair », expression qui désigne ici l’ensemble des êtres humains.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tout son éclat » ou « toute sa gloire ». Le mot hébreu peut désigner ici ce qui est beau, admirable ou splendide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אֹמֵר
  choice: Une voix dit
  rationale: קוֹל désigne ici naturellement une voix non identifiée, et le participe אֹמֵר donne à la scène une vivacité que rend le présent français.
- source_word: קְרָא
  choice: Crie !
  rationale: L’impératif de קרא appelle une annonce publique et énergique. « Crie ! » conserve sa brièveté et permet de reprendre le même verbe dans la question suivante.
- source_word: וְאָמַר
  choice: Et j’ai dit
  rationale: Cette traduction suit la vocalisation massorétique à la première personne. La lecture traditionnelle à la troisième personne est signalée en note.
- source_word: מָה אֶקְרָא
  choice: Que crierai-je ?
  rationale: La formulation conserve la répétition de la racine קרא et exprime la question portant sur le contenu du message à annoncer.
- source_word: כָּל הַבָּשָׂר
  choice: Toute chair
  rationale: La traduction littérale préserve l’image biblique de l’humanité dans sa condition corporelle et mortelle; son sens collectif est précisé en note.
- source_word: חָצִיר
  choice: herbe
  rationale: « Herbe » est le sens courant du terme et porte ici l’image de ce qui pousse puis se dessèche rapidement.
- source_word: חַסְדּוֹ
  choice: sa beauté
  rationale: Bien que חֶסֶד exprime souvent la bonté fidèle ou la loyauté, le parallèle avec la fleur favorise ici ce qui rend l’être humain beau, attrayant ou admirable. Une autre nuance possible est conservée en note.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: comme la fleur des champs
  rationale: צִיץ désigne une fleur ou une floraison. L’expression française naturelle « la fleur des champs » rend l’image générique et passagère de la fleur sauvage.
theological_decisions:
- issue: Identification de celui qui répond en וְאָמַר
  choice: 'Première personne : « Et j’ai dit »'
  alternative: 'Troisième personne : « Et quelqu’un dit » ou « Et il dit »'
  rationale: La vocalisation du texte massorétique soutient la première personne. Comme la tradition connaît aussi une lecture à la troisième personne et que celle-ci modifie la perception du dialogue prophétique, elle est conservée en note sans être imposée au texte principal.
- issue: Portée de כָּל הַבָּשָׂר
  choice: Conserver l’expression métaphorique « Toute chair »
  alternative: Expliciter par « tous les humains » ou « tous les êtres humains »
  rationale: L’expression vise collectivement l’humanité mortelle, mais sa formulation concrète participe au contraste poétique entre la fragilité humaine et l’herbe. La note explicite le référent sans aplatir l’image.
- issue: Sens contextuel de חַסְדּוֹ
  choice: « sa beauté »
  alternative: « son éclat » ou « sa gloire »; le sens habituel « sa bonté fidèle » reste lexicalement possible mais convient moins au parallèle
  rationale: Le parallélisme avec la fleur des champs oriente vers ce qui est beau, admirable ou splendide chez l’humanité et qui demeure passager. La traduction évite d’introduire ici, sans appui contextuel suffisant, une notion explicitement alliance-covenantale.
translation_notes:
  register: Français international moderne, sobre et poétique. Le présent « dit » rend la vivacité du participe hébreu; le passé composé « j’ai dit » suit la vocalisation massorétique sans donner au dialogue un ton archaïque. « Toute chair est herbe » conserve volontairement la métaphore directe et le rythme lapidaire de l’hébreu.
