  text: כְּ/רֹעֶה֙ עֶדְר֣/וֹ יִרְעֶ֔ה בִּ/זְרֹע/וֹ֙ יְקַבֵּ֣ץ טְלָאִ֔ים וּ/בְ/חֵיק֖/וֹ יִשָּׂ֑א עָל֖וֹת יְנַהֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
translation:
  language: fr
  text: Comme un berger, il fera paître son troupeau ; avec son bras, il rassemblera les agneaux et les portera contre sa poitrine[a] ; il conduira avec douceur les brebis qui allaitent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans son sein », image d’une proximité protectrice et tendre.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « les brebis accompagnées de leurs petits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה
  choice: Comme un berger
  rationale: Le préfixe כְּ marque la comparaison. « Comme un berger » conserve naturellement la comparaison qui présente la sollicitude de YHWH.
- source_word: עֶדְרוֹ יִרְעֶה
  choice: il fera paître son troupeau
  rationale: עֵדֶר désigne ici le troupeau, et רעה l’action concrète de le mener au pâturage et d’en prendre soin.
- source_word: בִּזְרֹעוֹ יְקַבֵּץ טְלָאִים
  choice: de son bras, il rassemblera les agneaux
  rationale: La préposition בְּ est rendue de façon instrumentale. « Rassembler » traduit קבץ, tandis que « agneaux » rend précisément טְלָאִים.
- source_word: וּבְחֵיקוֹ יִשָּׂא
  choice: et les portera contre son cœur
  rationale: חֵיק désigne le sein ou la poitrine. « Contre son cœur » restitue en français actuel l’image physique de proximité et de tendresse, sans réduire le geste à une simple prise dans les bras.
- source_word: עָלוֹת
  choice: les brebis qui allaitent
  rationale: Le terme désigne vraisemblablement les femelles qui allaitent, avec comme autre compréhension possible les brebis accompagnées de leurs petits.
- source_word: יְנַהֵל
  choice: il conduira avec douceur
  rationale: נהל signifie conduire ou guider. Le contexte des brebis vulnérables justifie l’expression « avec douceur », qui explicite la manière attentive de les mener sans transformer la métaphore.
theological_decisions:
- issue: Image divine du berger
  choice: Conserver directement la métaphore pastorale appliquée à YHWH
  alternative: Introduire explicitement une interprétation messianique ou christologique
  rationale: Le verset présente la sollicitude de YHWH sous l’image d’un berger. La traduction garde cette image sans y intégrer une interprétation théologique ultérieure.
- issue: Sens de עָלוֹת
  choice: les brebis qui allaitent
  alternative: les brebis accompagnées de leurs petits
  rationale: Le mot peut évoquer des femelles allaitantes ou ayant leurs petits auprès d’elles. Le texte principal retient le sens lactant, tandis que la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme pastoral est conservé par trois propositions parallèles. « Contre son cœur » communique clairement l’image hébraïque tout en évitant le caractère vieilli ou ambigu de « dans son sein ».
