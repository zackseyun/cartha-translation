- from: Celui qui est trop pauvre pour une offrande[a] choisit un bois qui ne pourrira pas ; il cherche pour lui-même un artisan habile, afin de préparer une idole[b] qui ne vacillera pas.
  to: Celui qui est trop pauvre pour une offrande[a] choisit un bois qui ne pourrira pas ; il cherche pour lui-même un artisan habile, afin que celui-ci prépare une idole[b] qui ne vacillera pas.
  rationale: La seule modification nécessaire explicite que l’artisan, et non l’homme qui le cherche, est chargé de préparer l’idole. Elle conserve le lexique et l’ambiguïté limitée de l’hébreu à l’ouverture, déjà signalée par la note.
