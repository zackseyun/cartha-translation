review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte massorétique : une personne démunie choisit un bois durable et recherche un artisan compétent pour qu’une idole soit préparée de façon stable. Toutefois, dans la phrase française actuelle, l’infinitif « afin de préparer » se rattache naturellement au sujet principal (« celui qui est trop pauvre »), alors que l’infinitif hébreu dépend fonctionnellement de l’artisan recherché.'
  naturalness: Le français est globalement clair et de registre approprié. « Un bois » et « ne vacillera pas » sont recevables. La reformulation proposée élimine l’ambiguïté de contrôle de l’infinitif sans alourdir indûment le verset.
  terminology: « Offrande », « artisan habile », « idole » et « image sculptée » sont appropriés. « Idole » rend bien פֶּסֶל dans ce contexte polémique, tandis que la note préserve l’alternative plus formelle.
  issues:
  - severity: medium
    issue: Ambiguïté du sujet de « afin de préparer »
    rationale: En français, « il cherche ... un artisan habile, afin de préparer une idole » laisse entendre que l’homme démuni prépare lui-même l’idole. Le texte hébreu présente l’artisan comme celui qui est recherché pour accomplir cette préparation.
