source:
  edition: WLC
  text: הַֽ/מְסֻכָּ֣ן תְּרוּמָ֔ה עֵ֥ץ לֹֽא יִרְקַ֖ב יִבְחָ֑ר חָרָ֤שׁ חָכָם֙ יְבַקֶּשׁ ל֔/וֹ לְ/הָכִ֥ין פֶּ֖סֶל לֹ֥א יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
translation:
  language: fr
  text: Celui qui est trop pauvre pour une offrande[a] choisit un bois qui ne pourrira pas ; il cherche pour lui-même un artisan habile, afin que celui-ci prépare une idole[b] qui ne vacillera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « L’indigent choisit comme offrande un bois qui ne se décomposera pas. » Le début du texte hébreu est très condensé et peut être compris de plusieurs manières proches.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une image sculptée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְסֻכָּן
  choice: celui qui est trop pauvre
  rationale: Le participe ou adjectif substantivé est généralement compris ici comme désignant une personne appauvrie, incapable de consacrer un matériau coûteux. Cette formulation française rend clairement ce sens sans durcir la syntaxe hébraïque compacte.
- source_word: תְּרוּמָה
  choice: pour une offrande
  rationale: Le nom désigne une contribution ou une offrande consacrée. « Pour une offrande » s’intègre naturellement à la lecture de הַמְסֻכָּן comme personne trop pauvre, tout en conservant la dimension cultuelle.
- source_word: עֵץ לֹא יִרְקַב
  choice: un bois qui ne pourrira pas
  rationale: Cette traduction concrète conserve l’image d’un matériau durable choisi pour la fabrication de l’image.
- source_word: יִבְחָר
  choice: choisit
  rationale: Le présent convient à la description générale et proverbiale de l’action.
- source_word: חָרָשׁ חָכָם
  choice: un artisan habile
  rationale: חָרָשׁ désigne un artisan, et חָכָם qualifie ici sa compétence technique plutôt qu’une sagesse morale.
- source_word: יְבַקֶּשׁ לוֹ
  choice: il cherche pour lui-même
  rationale: La formulation rend à la fois la recherche intentionnelle exprimée par le verbe et le bénéficiaire indiqué par לוֹ.
- source_word: לְהָכִין
  choice: afin de préparer
  rationale: Le verbe signifie préparer, disposer ou établir. « Préparer » reste proche de l’hébreu sans préciser indûment le procédé de fabrication.
- source_word: פֶּסֶל
  choice: une idole
  rationale: Dans cette dénonciation de la fabrication des faux dieux, « idole » exprime nettement la portée polémique du terme, lequel peut aussi désigner une image sculptée.
- source_word: לֹא יִמּוֹט
  choice: qui ne vacillera pas
  rationale: Le verbe évoque ce qui chancelle, glisse ou perd sa stabilité. « Ne vacillera pas » préserve l’ironie d’une idole que son propriétaire doit faire tenir solidement.
theological_decisions:
- issue: Traduction de פֶּסֶל dans la polémique contre l’idolâtrie
  choice: une idole
  alternative: une image sculptée
  rationale: « Idole » est lexicalement fondé et communique directement la critique théologique du contexte. La note conserve la traduction plus formelle et concrète.
- issue: Interprétation de l’ouverture hébraïque compacte הַמְסֻכָּן תְּרוּמָה
  choice: celui qui est trop pauvre pour une offrande
  alternative: l’indigent choisit comme offrande
  rationale: La lecture retenue est largement admise et produit une phrase française intelligible, mais la construction hébraïque demeure assez resserrée pour justifier le maintien de l’autre analyse en note.
translation_notes:
  register: 'Français international actuel, clair et digne. La syntaxe suit le mouvement du verset hébreu tout en restant naturelle. « Vacillera » conserve l’ironie discrète du passage : l’idole censée représenter une puissance doit être stabilisée par des mains humaines.'
