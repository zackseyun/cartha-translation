- from: 'Voyez : les nations sont comme une goutte d’un seau[a] ; elles sont considérées comme de la poussière sur une balance. Voyez : les terres côtières[b], il les soulève comme une fine poussière.'
  to: 'Voici : les nations sont comme une goutte provenant d’un seau[a] ; elles sont considérées comme de la poussière sur les plateaux d’une balance. Voici : il soulève les terres côtières[b] comme une fine poussière.'
  rationale: La correction améliore la précision de l’image de la balance et la fluidité du français. Elle conserve les deux particules d’appel, le sujet masculin implicite du dernier verbe et l’ambiguïté géographique de אִיִּים, signalée par la note.
