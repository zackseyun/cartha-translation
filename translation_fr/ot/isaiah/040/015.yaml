reference: Isaiah 40:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֤ן גּוֹיִם֙ כְּ/מַ֣ר מִ/דְּלִ֔י וּ/כְ/שַׁ֥חַק מֹאזְנַ֖יִם נֶחְשָׁ֑בוּ הֵ֥ן אִיִּ֖ים כַּ/דַּ֥ק יִטּֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/015.yaml
  text: Look[a], the nations are like a drop from a bucket, and are regarded as dust on the scales; look[b], the coastlands he lifts like fine dust.
translation:
  language: fr
  text: 'Voici : les nations sont comme une goutte provenant d’un seau[a] ; elles sont considérées comme de la poussière sur les plateaux d’une balance. Voici : il soulève les terres côtières[b] comme une fine poussière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « une goutte provenant d’un seau ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les îles ». Le terme hébreu peut désigner des îles, des régions côtières ou des terres maritimes éloignées.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: La particule attire vivement l’attention. « Voyez » conserve cette force rhétorique dans un français actuel, sans l’archaïsme de « voici » employé comme interjection solennelle.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le terme désigne collectivement les nations ou peuples du monde ; « les nations » est naturel dans ce contexte universel.
- source_word: כְּמַר מִדְּלִי
  choice: comme une goutte d’un seau
  rationale: מַר désigne ici une goutte, et מִן marque sa provenance. Cette formulation reste proche de l’image hébraïque sans lui substituer une locution française différente.
- source_word: וּכְשַׁחַק מֹאזְנַיִם
  choice: comme de la poussière sur une balance
  rationale: שַׁחַק évoque une poussière très fine, tandis que מֹאזְנַיִם désigne une balance. L’image souligne un poids négligeable.
- source_word: נֶחְשָׁבוּ
  choice: elles sont considérées
  rationale: Le passif de חשׁב exprime une estimation ou une manière de compter quelque chose ; « sont considérées » restitue clairement cette évaluation.
- source_word: אִיִּים
  choice: les terres côtières
  rationale: Dans Ésaïe, le terme peut désigner des îles, des côtes ou, plus largement, des terres maritimes éloignées. « Terres côtières » garde cette portée géographique assez large.
- source_word: כַּדַּק
  choice: comme une fine poussière
  rationale: דַּק qualifie ce qui est fin, menu ou ténu. Dans ce contexte, « fine poussière » exprime la petitesse et l’insignifiance de l’objet soulevé.
- source_word: יִטּוֹל
  choice: il les soulève
  rationale: Le verbe signifie soulever, prendre ou porter. La reprise pronominale française rend naturelle la mise en relief initiale de « les terres côtières » tout en gardant comme sujet implicite le référent masculin du contexte.
theological_decisions:
- issue: Sujet implicite de יִטּוֹל
  choice: Le pronom « il » est conservé et renvoie contextuellement à Dieu, sans ajouter son nom dans le verset.
  alternative: Rendre la tournure de façon impersonnelle (« on les soulève ») ou expliciter « le Seigneur les soulève ».
  rationale: Le verbe hébreu est à la troisième personne masculine du singulier, sans sujet nominal exprimé dans cette proposition. Le contexte identifie Dieu, mais la traduction n’ajoute pas un titre divin absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Les deux occurrences de הֵן sont rendues de manière identique pour préserver le parallélisme rhétorique. La dislocation « les terres côtières, il les soulève » reflète l’ordre marqué de l’hébreu tout en restant idiomatique en français.
