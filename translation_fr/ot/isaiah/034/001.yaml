id: ISA.34.1
reference: Isaiah 34:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קִרְב֤וּ גוֹיִם֙ לִ/שְׁמֹ֔עַ וּ/לְאֻמִּ֖ים הַקְשִׁ֑יבוּ תִּשְׁמַ֤ע הָ/אָ֨רֶץ֙ וּ/מְלֹאָ֔/הּ תֵּבֵ֖ל וְ/כָל צֶאֱצָאֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
translation:
  language: fr
  text: Approchez, nations, pour écouter ; peuples, prêtez attention. Que la terre écoute, elle et tout ce qui la remplit, le monde et tout ce qui en est issu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui en provient » ou « tous ses produits ». Le terme hébreu peut désigner largement ce qui sort ou naît du monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבוּ
  choice: Approchez
  rationale: L’impératif qal appelle les nations à s’approcher. « Approchez » est direct, naturel et digne en français moderne.
- source_word: גוֹיִם
  choice: nations
  rationale: Dans cette adresse prophétique universelle, le terme désigne les nations du monde, sans la connotation confessionnelle possible de « païens ».
- source_word: לִשְׁמֹעַ
  choice: pour écouter
  rationale: L’infinitif exprime ici le but de l’approche. « Écouter » convient mieux que le simple « entendre » à une convocation solennelle.
- source_word: לְאֻמִּים
  choice: peuples
  rationale: Ce quasi-synonyme de גוֹיִם est rendu distinctement afin de préserver le parallélisme poétique.
- source_word: הַקְשִׁיבוּ
  choice: prêtez attention
  rationale: Le hiphil impératif exprime une écoute attentive. Ce choix distingue le verbe de שמע tout en conservant sa force.
- source_word: תִּשְׁמַע
  choice: Que … écoute
  rationale: L’imparfait à valeur jussive est rendu par « Que », qui transmet naturellement l’appel adressé à la terre.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: La portée universelle du contexte, renforcée par « le monde », favorise « terre » plutôt que « pays ».
- source_word: מְלֹאָהּ
  choice: tout ce qui la remplit
  rationale: Cette formulation actuelle restitue l’idée de la totalité de ce que contient la terre.
- source_word: תֵּבֵל
  choice: le monde
  rationale: Le mot désigne souvent le monde habité et ordonné ; « le monde » est ici l’équivalent français le plus naturel.
- source_word: כָל צֶאֱצָאֶיהָ
  choice: tous ceux qui en sont issus
  rationale: צֶאֱצָאִים désigne ce qui sort ou naît de quelque chose. Le masculin personnel « ceux » suggère ici les habitants du monde, tout en conservant l’image de provenance et sans imposer le terme plus biologique « descendants ».
theological_decisions: []
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le parallélisme de l’hébreu est conservé par « nations / peuples » et « terre / monde ». La ponctuation rend les deux convocations successives de manière fluide.
