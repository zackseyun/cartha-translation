    reason: alternative_reading
  - marker: b
    text: 'Ou : « et les couvera à l’ombre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vautours » ; plus généralement : « oiseaux de proie » ou « rapaces ».'
    reason: alternative_reading
  revision_rationale: La révision conserve les choix zoologiques prudents et toutes les notes, mais rend la valeur assertive de אַךְ, respecte le féminin de l’expression finale et rend plus naturellement la succession relative aux œufs. « Ses petits » explicite l’objet implicite de l’action protectrice sans imposer une espèce précise.
