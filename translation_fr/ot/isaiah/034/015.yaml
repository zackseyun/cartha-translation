base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/015.yaml
  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
translation:
  language: fr
  text: Là, le serpent-flèche[a] fera son nid et pondra ; ses œufs écloront, et il rassemblera ses petits à l’ombre[b]. Assurément, là se rassembleront les milans[c], chacune avec sa compagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification du mot hébreu קִפּוֹז est incertaine ; on l’a aussi traduit par « chouette » ou par le nom d’une autre créature du désert.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « et les couvera à l’ombre ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vautours » ; plus généralement : « oiseaux de proie » ou « rapaces ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  choice: serpent-flèche
  rationale: Ce nom n’apparaît qu’ici dans la Bible hébraïque et son identification demeure très incertaine. « Serpent-flèche » conserve l’hypothèse d’un reptile qui se déplace vivement sans prétendre identifier une espèce précise.
- source_word: קִנְּנָה
  choice: fera son nid
  rationale: Le verbe קנן signifie « nicher, faire son nid ». Le futur convient à cette description prophétique de la désolation à venir.
- source_word: וַתְּמַלֵּט
  choice: pondra
  rationale: Le verbe désigne ici l’action de mettre au monde. Le contexte du nid et de l’éclosion rend « pondra » naturel en français.
- source_word: וּבָקְעָה
  choice: fera éclore ses œufs
  rationale: בקע signifie littéralement « fendre, ouvrir ». Dans ce contexte, la formulation française exprime naturellement l’ouverture des œufs et explicite leur objet sous-entendu.
- source_word: וְדָגְרָה
  choice: les abritera
  rationale: Le sens précis du verbe est discuté entre rassembler, protéger et couver. « Les abritera » s’accorde avec l’image de l’ombre protectrice, tandis que la possibilité de « couver » est signalée en note.
- source_word: בְצִלָּהּ
  choice: sous son ombre
  rationale: Cette expression garde l’image concrète de la créature qui protège sa progéniture de son ombre.
- source_word: אַךְ
  choice: aussi
  rationale: Dans la seconde moitié du verset, la particule souligne et confirme qu’en ce même lieu d’autres animaux se rassembleront. « Là aussi » rend naturellement cet effet dans le contexte.
- source_word: דַיּוֹת
  choice: milans
  rationale: Le terme désigne probablement des milans ou, plus largement, des rapaces charognards. Le choix spécifique demeure signalé comme incertain en note.
- source_word: אִשָּׁה רְעוּתָהּ
  choice: chacun auprès de son compagnon
  rationale: Littéralement « une femelle avec sa compagne », cette tournure distributive indique que les oiseaux se trouvent par paires. La formulation française reste naturelle sans imposer que le compagnon soit nécessairement un partenaire sexuel.
