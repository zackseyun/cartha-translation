  source_fidelity: 'Le texte rend fidèlement la succession et les liens du verset : l’extinction impossible du feu implicite (« Nuit et jour, il ne s’éteindra pas »), la montée perpétuelle de la fumée, la désolation à travers les générations et l’absence de tout passage. « Restera dévastée » exprime de manière légitime l’état résultant de תחרב dans son cadre duratif.'
  naturalness: Le français est moderne, clair et soutenu sans être archaïsant. Les reprises « il » (le feu implicite du contexte immédiat) et « elle » (la terre/le pays) sont naturelles et non ambiguës dans la continuité de l’oracle.
  terminology: 'Les termes de durée sont rendus sans atténuation : « pour toujours » pour לעולם et « à tout jamais » pour לנצח נצחים. « Dévastée » convient à חרב dans ce contexte de jugement territorial. Aucun terme théologique spécialisé ne requiert d’ajustement.'
