id: ISA.34.10
reference: Isaiah 34:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לַ֤יְלָה וְ/יוֹמָם֙ לֹ֣א תִכְבֶּ֔ה לְ/עוֹלָ֖ם יַעֲלֶ֣ה עֲשָׁנָ֑/הּ מִ/דּ֤וֹר לָ/דוֹר֙ תֶּחֱרָ֔ב לְ/נֵ֣צַח נְצָחִ֔ים אֵ֥ין עֹבֵ֖ר בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
translation:
  language: fr
  text: Nuit et jour, il ne s’éteindra pas ; sa fumée montera pour toujours. De génération en génération, elle restera dévastée ; à tout jamais, personne n’y passera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם
  choice: Nuit et jour
  rationale: Cette paire forme un mérisme exprimant la continuité. « Nuit et jour » est naturel en français et conserve l’ordre hébreu.
- source_word: לֹא תִכְבֶּה
  choice: il ne s’éteindra pas
  rationale: Le verbe כבה au qal désigne couramment un feu qui s’éteint. Le masculin « il » renvoie naturellement au feu mentionné au verset précédent.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression préserve sans l’atténuer la durée indéfinie et emphatique de עוֹלָם dans l’oracle.
- source_word: יַעֲלֶה עֲשָׁנָהּ
  choice: sa fumée montera
  rationale: עלה avec עשן décrit normalement la fumée qui monte. Le possessif français ne marque pas le genre du référent.
- source_word: מִדּוֹר לָדוֹר
  choice: De génération en génération
  rationale: Formule française établie qui exprime la succession continue des générations.
- source_word: תֶּחֱרָב
  choice: elle restera dévastée
  rationale: חרב décrit ici le pays devenu désert ou dévasté. « Restera dévastée » rend l’état durable suggéré par le contexte, avec le féminin renvoyant à la terre d’Édom.
- source_word: לְנֵצַח נְצָחִים
  choice: à tout jamais
  rationale: La formule intensifiée exprime une perpétuité emphatique ; « à tout jamais » la rend dans un français actuel et digne.
- source_word: אֵין עֹבֵר בָּהּ
  choice: personne n’y passera
  rationale: La construction אֵין suivie du participe indique qu’il n’y aura personne pour traverser le lieu ; « y » reprend naturellement le territoire visé.
theological_decisions:
- issue: Durée du jugement annoncé
  choice: Conserver les expressions fortes « pour toujours » et « à tout jamais »
  alternative: Les atténuer en « pendant des siècles » ou « pour longtemps »
  rationale: Le texte cumule עוֹלָם et נֵצַח נְצָחִים. La traduction doit préserver la force et la tension de ce langage prophétique sans en limiter d’avance la portée.
translation_notes:
  register: 'Français international moderne, clair et solennel. La répétition des indications de durée est maintenue. Aucun marqueur de note n’est nécessaire, car aucune note n’est retenue : la note anglaise semble rattachée par erreur à « forever », alors que son contenu concerne תֶּחֱרָב, dont le sens est rendu directement par « restera dévastée ».'
