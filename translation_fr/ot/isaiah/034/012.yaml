source:
  edition: WLC
  text: חֹרֶ֥י/הָ וְ/אֵֽין שָׁ֖ם מְלוּכָ֣ה יִקְרָ֑אוּ וְ/כָל שָׂרֶ֖י/הָ יִ֥הְיוּ אָֽפֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
translation:
  language: fr
  text: On appellera ses nobles[a], mais il n’y aura là aucun royaume, et tous ses princes ne seront plus rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ses nobles appelleront, mais il n’y aura là aucun royaume. » Le texte hébreu de la première partie du verset est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֹרֶיהָ
  choice: ses nobles
  rationale: Le nom désigne vraisemblablement les membres libres de l’aristocratie. « Nobles » convient au parallèle politique avec « princes ».
- source_word: וְאֵין שָׁם
  choice: mais il n’y aura là aucun
  rationale: La tournure française exprime naturellement la négation existentielle et conserve l’élément locatif « là » ; « mais » rend le contraste probable dans cette syntaxe difficile.
- source_word: מְלוּכָה
  choice: royaume
  rationale: Le terme peut désigner la royauté, le pouvoir royal ou un royaume. Ici, « royaume » s’accorde avec l’effondrement de l’ordre politique d’Édom, sans préciser davantage le mécanisme envisagé.
- source_word: יִקְרָאוּ
  choice: on appellera
  rationale: Le verbe signifie fondamentalement « appeler ». La troisième personne du pluriel à sujet non exprimé se rend naturellement par « on » en français, tout en maintenant « ses nobles » comme complément selon la lecture principale retenue.
- source_word: וְכָל שָׂרֶיהָ
  choice: et tous ses princes
  rationale: « Princes » conserve le registre politique élevé de שׂר et le parallélisme avec les nobles.
- source_word: יִהְיוּ אָפֶס
  choice: ne seront plus rien
  rationale: Cette expression française naturelle rend l’idée de non-existence ou de disparition portée par אָפֶס, sans imposer l’image plus forte d’un anéantissement physique.
theological_decisions:
- issue: Syntaxe difficile de la première proposition
  choice: « On appellera ses nobles, mais il n’y aura là aucun royaume »
  alternative: « Ses nobles appelleront, mais il n’y aura là aucun royaume »
  rationale: L’hébreu comprimé permet difficilement d’identifier avec certitude la fonction de « ses nobles » par rapport au verbe « appeler ». Le texte principal suit la lecture où ils sont appelés ; la note conserve l’autre possibilité sans trancher artificiellement.
- issue: Portée de la disparition des princes
  choice: « ne seront plus rien »
  alternative: « seront réduits à néant »
  rationale: La formulation choisie exprime la disparition totale de leur réalité ou de leur pouvoir politique, tout en évitant d’affirmer plus précisément une destruction physique que ne l’exige אָפֶס.
translation_notes:
  register: Français international moderne, sobre et digne. « On appellera » est idiomatique sans être familier ; « ne seront plus rien » communique clairement l’effondrement complet de l’ordre dirigeant.
