source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
translation:
  language: fr
  text: 'Consultez le livre de Yahweh et lisez : pas une d’entre elles ne manquera, aucune ne sera privée de sa compagne. Car c’est ma bouche qui l’a ordonné[a], et son Esprit les a rassemblées[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit « ma bouche », puis passe à la troisième personne avec « son Esprit ». On traduit parfois : « Car sa bouche l’a ordonné. »'
    reason: La note signale le changement de personne inhabituel et l’autre manière courante d’harmoniser la phrase.
  - marker: b
    text: Ou « son souffle » ou « son vent les a rassemblées ».
    reason: Le mot hébreu רוּחַ peut signifier « esprit », « souffle » ou « vent ».
lexical_decisions:
- source_word: דִּרְשׁוּ מֵעַל סֵפֶר יְהוָה
  choice: Consultez le livre de Yahweh
  rationale: Dans ce contexte, דרשׁ appelle à examiner un document faisant autorité. « Consultez » exprime naturellement en français cette recherche dans un écrit, tandis que « Yahweh » représente directement le nom divin יהוה.
- source_word: וּקְרָאוּ
  choice: et lisez
  rationale: Avec le livre comme contexte immédiat, קרא désigne ici la lecture, vraisemblablement à voix haute, plutôt qu’un simple appel ou une proclamation.
- source_word: אַחַת מֵהֵנָּה לֹא נֶעְדָּרָה
  choice: pas une d’entre elles ne manquera
  rationale: La tournure distributive renvoie aux créatures énumérées auparavant. Le futur français convient à l’accomplissement assuré de l’oracle.
- source_word: אִשָּׁה רְעוּתָהּ לֹא פָקָדוּ
  choice: aucune ne sera privée de sa compagne
  rationale: Le féminin et le terme רְעוּתָהּ soulignent que chacune aura sa partenaire. « Compagne » conserve le genre grammatical et reste plus large que « femelle » ou « partenaire d’accouplement ».
- source_word: כִּי פִי הוּא צִוָּה
  choice: Car c’est ma bouche qui l’a ordonné
  rationale: Le texte massorétique porte littéralement « ma bouche » et le pronom הוא lui donne une valeur emphatique. Cette formulation française respecte la première personne et l’emphase sans effacer le changement de personne qui suit.
- source_word: וְרוּחוֹ
  choice: et son Esprit
  rationale: רוּחַ peut désigner l’esprit, le souffle ou le vent. Ici, il exerce l’action divine de rassembler; « Esprit » convient au contexte, tandis qu’une note conserve les autres sens possibles.
- source_word: קִבְּצָן
  choice: les a rassemblées
  rationale: Le parfait exprime l’action accomplie ou tenue pour certaine. Le féminin pluriel français reprend les créatures évoquées par les formes féminines du verset.
theological_decisions:
- issue: Changement de personne entre « ma bouche » et « son Esprit »
  choice: Car c’est ma bouche qui l’a ordonné, et son Esprit les a rassemblées.
  alternative: Car sa bouche l’a ordonné, et son Esprit les a rassemblées.
  rationale: Le texte hébreu passe de la première personne dans פִי, « ma bouche », à la troisième personne dans רוּחוֹ, « son Esprit/souffle ». Le texte principal conserve cette tension au lieu d’uniformiser silencieusement les pronoms.
- issue: Sens de רוּחַ appliqué à l’action divine
  choice: Esprit
  alternative: souffle ou vent
  rationale: « Esprit » rend bien l’agent divin du rassemblement, mais le mot hébreu reste polysémique; les autres possibilités sont donc signalées en note sans imposer une lecture doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation garde le parallélisme, le féminin distributif des créatures et le brusque changement de personne du texte hébreu.
