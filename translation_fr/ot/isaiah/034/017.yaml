  text: וְ/הֽוּא הִפִּ֤יל לָ/הֶן֙ גּוֹרָ֔ל וְ/יָד֛/וֹ חִלְּקַ֥תָּ/ה לָ/הֶ֖ם בַּ/קָּ֑ו עַד עוֹלָם֙ יִֽירָשׁ֔וּ/הָ לְ/ד֥וֹר וָ/ד֖וֹר יִשְׁכְּנוּ בָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/017.yaml
  text: And he himself has cast the lot for them[a], and his hand has apportioned it to them by line; they will possess it forever[b]; from generation to generation they will dwell in it.
translation:
  language: fr
  text: C’est lui-même qui a jeté le sort pour eux, et sa main leur a attribué le pays au cordeau[a]. Ils le posséderont pour toujours[b] et, de génération en génération, ils y habiteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec un cordeau de mesure ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils en hériteront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: C’est lui-même qui
  rationale: Le pronom indépendant est emphatique. Cette tournure française naturelle conserve l’insistance sur l’agent divin.
- source_word: הִפִּיל לָהֶן גּוֹרָל
  choice: a jeté le sort pour eux
  rationale: L’expression hébraïque désigne l’action de tirer ou jeter le sort en vue d’une attribution. Le masculin français « eux » peut reprendre collectivement les animaux évoqués dans le contexte.
- source_word: וְיָדוֹ
  choice: et sa main
  rationale: Conserve l’image anthropomorphique de l’action directe de Dieu.
- source_word: חִלְּקַתָּה לָהֶם
  choice: leur a attribué le pays
  rationale: חלק exprime ici la répartition d’un territoire. « Le pays » explicite sobrement le référent féminin du suffixe, à savoir la terre dévastée d’Édom, sans nommer Édom dans le verset.
- source_word: בַּקָּו
  choice: au cordeau
  rationale: Le terme קָו désigne un cordeau de mesure employé pour délimiter un terrain. « Au cordeau » garde l’image d’arpentage dans un français concis.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Formulation française courante qui exprime une possession durable et indéfinie.
- source_word: יִירָשׁוּהָ
  choice: ils le posséderont
  rationale: ירש peut signifier hériter, prendre possession ou posséder. Dans cette scène d’attribution territoriale, « posséder » convient, tandis que l’alternative « hériter » est signalée en note.
- source_word: לְדוֹר וָדוֹר
  choice: de génération en génération
  rationale: Équivalent idiomatique français de la formule distributive hébraïque.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: ils y habiteront
  rationale: שׁכן indique une habitation établie et durable. « Habiter » est naturel, digne et cohérent avec le contexte.
theological_decisions:
- issue: Référent des pronoms dans la scène d’attribution
  choice: Les pronoms désignent collectivement les animaux sauvages auxquels Dieu attribue le territoire dévasté.
  alternative: Comprendre plus généralement les pronoms comme désignant les habitants indéterminés du lieu désolé.
  rationale: Le contexte immédiat, notamment les versets 11 et 13 à 15, énumère des animaux et des oiseaux occupant Édom. La traduction conserve néanmoins les pronoms du texte au lieu d’insérer explicitement « les animaux ».
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le parallélisme, l’image du sort, la main divine et le cordeau d’arpentage sont conservés.
