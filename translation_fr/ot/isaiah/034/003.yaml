  text: וְ/חַלְלֵי/הֶ֣ם יֻשְׁלָ֔כוּ וּ/פִגְרֵי/הֶ֖ם יַעֲלֶ֣ה בָאְשָׁ֑/ם וְ/נָמַ֥סּוּ הָרִ֖ים מִ/דָּמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
translation:
  language: fr
  text: Leurs morts seront jetés dehors[a], et la puanteur de leurs cadavres montera[b] ; les montagnes fondront de leur sang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront rejetés ». Le verbe hébreu peut exprimer l’idée de jeter dehors ou de rejeter.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur puanteur montera ».'
    reason: lexical_alternative
  - marker: c
    text: 'Il s’agit d’une image hyperbolique propre au langage prophétique du jugement : le sang versé est présenté comme si abondant que même les montagnes fondent de leur sang.'
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  choice: leurs morts
  rationale: Le nom désigne ici ceux qui ont été tués, notamment au combat. « Leurs morts » est naturel en français et conserve le contexte de massacre et de jugement.
- source_word: יֻשְׁלָכוּ
  choice: seront jetés dehors
  rationale: Le passif de שלך exprime l’action de jeter. « Jetés dehors » rend à la fois la violence du geste et l’indignité de cadavres abandonnés sans sépulture.
- source_word: פִגְרֵיהֶם
  choice: leurs cadavres
  rationale: פגר désigne un corps mort. « Cadavres » est précis, courant et conserve la dureté de l’image.
- source_word: יַעֲלֶה
  choice: montera
  rationale: עלה signifie monter. Appliqué à une mauvaise odeur, « montera » reste idiomatique tout en reproduisant l’image hébraïque.
- source_word: בָאְשָׁם
  choice: la puanteur de leurs cadavres
  rationale: Le terme désigne une mauvaise odeur ou une puanteur, avec un suffixe possessif. La formulation française rattache naturellement cette odeur aux cadavres qui viennent d’être mentionnés.
- source_word: וְנָמַסּוּ
  choice: fondront
  rationale: Le verbe מסס signifie fondre ou se dissoudre. « Fondront » préserve sans l’expliquer l’image prophétique saisissante.
- source_word: הָרִים
  choice: les montagnes
  rationale: הרים désigne directement les montagnes ; il n’y a aucune raison d’atténuer l’ampleur de l’image.
- source_word: מִדָּמָם
  choice: à cause de leur sang
  rationale: La préposition מן peut indiquer la source ou la cause. Ici, « à cause de leur sang » donne un français naturel tout en maintenant le sang comme cause de la fonte des montagnes.
theological_decisions:
- issue: Nature des images du jugement divin
  choice: Conserver sans l’atténuer l’image graphique et hyperbolique du jugement.
  alternative: 'Paraphraser : « les montagnes seront inondées » ou « couvertes de leur sang ».'
  rationale: L’hébreu décrit le massacre et la dissolution des montagnes dans un langage prophétique volontairement saisissant. La traduction garde cette tension et cette force sans transformer l’image en explication.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire demeure volontairement cru afin de respecter la violence de l’oracle, tandis que la syntaxe reste claire pour un lectorat général.
