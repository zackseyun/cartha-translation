source:
  edition: WLC
  text: וּ/פָגְשׁ֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/שָׂעִ֖יר עַל רֵעֵ֣/הוּ יִקְרָ֑א אַךְ שָׁם֙ הִרְגִּ֣יעָה לִּילִ֔ית וּ/מָצְאָ֥ה לָ֖/הּ מָנֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
translation:
  language: fr
  text: Les créatures du désert rencontreront les hyènes[a], et le démon-bouc appellera son semblable. C’est là, assurément, que Lilith[b] s’installera et y trouvera pour elle-même un lieu de repos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacals » ; l’identification de cet animal hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: « Lilith » peut aussi être rendu par « créature nocturne » ou « monstre nocturne » ; certaines traductions anciennes ont « petit-duc ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  choice: les créatures du désert
  rationale: Le terme désigne largement les êtres qui peuplent les régions désertiques ou les ruines, sans permettre d’identifier une espèce précise.
- source_word: אִיִּים
  choice: les hyènes
  rationale: Cette identification zoologique convient au tableau de désolation, mais le terme hébreu demeure incertain; « chacals » est signalé en note.
- source_word: שָׂעִיר
  choice: le démon-bouc
  rationale: Dans ce contexte peuplé d’êtres inquiétants du désert, le mot semble avoir son sens surnaturel plutôt que désigner simplement un bouc; cette traduction évite l’association gréco-romaine de « satyre ».
- source_word: עַל רֵעֵהוּ יִקְרָא
  choice: appellera son semblable
  rationale: L’expression évoque un être appelant un autre être de même nature; « son semblable » est naturel et ne précise pas indûment qu’il s’agit d’un compagnon ou d’un partenaire.
- source_word: אַךְ
  choice: Oui
  rationale: La particule souligne avec insistance que ce lieu sera bien celui où Lilith se reposera.
- source_word: הִרְגִּיעָה
  choice: s’installera
  rationale: Le verbe exprime ici l’idée de s’établir tranquillement ou de prendre son repos, tandis que le nom suivant formule explicitement l’idée de repos.
- source_word: לִּילִית
  choice: Lilith
  rationale: La translittération conserve l’ambiguïté de ce terme hébreu rare et sa probable résonance mythique, sans imposer une identification zoologique contestée.
- source_word: מָנוֹחַ
  choice: un lieu de repos
  rationale: Le nom peut désigner le repos ou l’endroit où l’on se repose; le sens concret s’accorde particulièrement bien avec l’image d’un être qui s’installe dans les ruines.
theological_decisions:
- issue: Faut-il neutraliser la dimension surnaturelle ou mythique des êtres du désert dans cet oracle de jugement?
  choice: Conserver cette dimension avec « démon-bouc » et « Lilith ».
  alternative: Les rendre tous deux comme de simples animaux ou oiseaux du désert.
  rationale: Le tableau hébreu évoque intentionnellement un désert hanté par des êtres inquiétants. Préserver cette évocation rend compte du texte sans construire ni cautionner une démonologie allant au-delà du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme en deux phrases conserve la progression du tableau. « Démon-bouc » et « Lilith » maintiennent l’étrangeté voulue sans recourir au terme culturellement marqué « satyre » ni résoudre artificiellement l’identité de Lilith.
