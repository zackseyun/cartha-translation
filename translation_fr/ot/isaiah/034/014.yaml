revisions:
- from: Les créatures du désert rencontreront les hyènes[a], et le démon-bouc appellera son semblable. Oui, c’est là que Lilith[b] s’installera et trouvera pour elle un lieu de repos.
  to: Les créatures du désert rencontreront les hyènes[a], et le démon-bouc appellera son semblable. C’est là, assurément, que Lilith[b] s’installera et y trouvera pour elle-même un lieu de repos.
  rationale: Révision limitée de l’expression de l’emphase, de la fluidité française et de la précision zoologique de la note, sans résoudre l’ambiguïté du terme Lilith ni atténuer l’imagerie surnaturelle probable de שָׂעִיר.
