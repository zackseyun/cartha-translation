  text: וִ/ירֵשׁ֨וּ/הָ֙ קָאַ֣ת וְ/קִפּ֔וֹד וְ/יַנְשׁ֥וֹף וְ/עֹרֵ֖ב יִשְׁכְּנוּ בָ֑/הּ וְ/נָטָ֥ה עָלֶ֛י/הָ קַֽו תֹ֖הוּ וְ/אַבְנֵי בֹֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
translation:
  language: fr
  text: Le pélican et le hérisson en prendront possession[a] ; le hibou et le corbeau y habiteront. Il étendra sur elle le cordeau du chaos et les pierres de mesure du vide[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification des animaux est incertaine. « Pélican » peut aussi être rendu par « cormoran » ou par le nom d’un rapace nocturne ; « hérisson », par « porc-épic » ou « butor ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le cordeau du tohu et les pierres du bohu ». Ces deux mots font écho à Genèse 1.2, où la terre est décrite comme « informe et vide » ; ici, le pays est présenté comme ramené au chaos et au vide.'
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  choice: en prendront possession
  rationale: Le verbe ירשׁ peut signifier « hériter », « posséder » ou « prendre possession ». Dans cette scène de jugement, il décrit des animaux sauvages occupant le territoire dévasté, sans suggérer un héritage juridique.
- source_word: קָאַת
  choice: pélican
  rationale: L’identification zoologique est incertaine. « Pélican » est une équivalence française traditionnelle et reconnaissable ; les autres possibilités sont signalées en note.
- source_word: קִפּוֹד
  choice: hérisson
  rationale: Le terme désigne un animal dont l’identification reste discutée. « Hérisson » offre une traduction courante sans masquer l’incertitude, explicitée en note.
- source_word: יַנְשׁוֹף
  choice: hibou
  rationale: Il s’agit vraisemblablement d’un oiseau nocturne de la famille des hiboux ou chouettes. Le terme générique évite une précision zoologique injustifiée.
- source_word: עֹרֵב
  choice: corbeau
  rationale: Équivalent français usuel de עֹרֵב, bien adapté à l’imagerie biblique des lieux désolés.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: y habiteront
  rationale: שׁכן exprime une habitation durable. Le pronom adverbial « y » est naturel en français et renvoie sans ambiguïté au territoire féminin évoqué par le contexte.
- source_word: וְנָטָה עָלֶיהָ
  choice: Il étendra sur elle
  rationale: Le sujet hébreu est implicite ; le contexte du jugement permet de conserver le masculin singulier, renvoyant à Dieu sans l’ajouter explicitement.
- source_word: קַו תֹהוּ
  choice: le cordeau du chaos
  rationale: קַו désigne un cordeau de mesure. « Chaos » conserve directement l’écho de תֹהוּ en Genèse 1.2 et l’image paradoxale d’une dévastation mesurée.
- source_word: וְאַבְנֵי בֹהוּ
  choice: les pierres de mesure du vide
  rationale: אַבְנֵי signifie littéralement « pierres de ». En parallèle avec le cordeau, il s’agit probablement de pierres servant à mesurer ou à mettre d’aplomb. « Du vide » préserve l’écho de בֹהוּ en Genèse 1.2 sans imposer un instrument précis que le texte ne nomme pas.
theological_decisions:
- issue: Écho au langage de la création dans תֹהוּ et בֹהוּ
  choice: Conserver dans le texte les termes « chaos » et « vide », accompagnés d’une note sur l’écho à Genèse 1.2.
  alternative: Employer « désolation » et « néant » ou « dévastation » et « vide », en reléguant entièrement l’allusion à une note.
  rationale: Les deux mots rares sont délibérément associés comme en Genèse 1.2. Les conserver rend perceptible l’image théologique d’un pays ramené à une sorte de non-création, sans expliquer cette interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme en deux propositions parallèles est conservé. « Cordeau » maintient l’image technique de mesure ; « pierres de mesure » reste intelligible tout en évitant la précision incertaine de « pierres d’aplomb ». Les marqueurs [a] et [b] figurent tous deux dans le texte.
