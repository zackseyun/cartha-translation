source:
  edition: WLC
  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
translation:
  language: fr
  text: 'Car Yahweh est indigné contre toutes les nations,


    et sa fureur est dirigée contre toutes leurs armées.


    Il les a vouées à la destruction[a],


    il les a livrées au massacre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frappées d’interdit » : le verbe hébreu évoque le fait de vouer irrévocablement quelque chose à la destruction sous le jugement divin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la convocation formulée au verset précédent et conserve naturellement la valeur explicative de la conjonction.
- source_word: קֶצֶף לַיהוָה
  choice: Yahweh est indigné
  rationale: La construction nominale exprime l’indignation appartenant à Yahweh. La tournure verbale est naturelle en français et distingue ce terme du suivant, חֵמָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עַל כָּל הַגּוֹיִם
  choice: contre toutes les nations
  rationale: Avec le vocabulaire de la colère, עַל se rend naturellement par « contre »; גּוֹיִם désigne ici les nations au sens large.
- source_word: וְחֵמָה
  choice: et sa fureur éclate
  rationale: חֵמָה désigne une colère brûlante et intense. « Fureur » maintient sa force et la distingue de קֶצֶף; « éclate » fournit en français une prédication naturelle sans atténuer l’image.
- source_word: עַל כָּל צְבָאָם
  choice: contre toutes leurs armées
  rationale: Dans ce contexte de jugement des nations, צָבָא désigne vraisemblablement leurs forces organisées. « Armées » est plus immédiatement compréhensible que « cohortes » ou « multitude ».
- source_word: הֶחֱרִימָם
  choice: Il les a vouées à la destruction
  rationale: Le hiphil de חרם exprime la mise à part irrévocable en vue de la destruction sous le jugement divin, nuance plus riche qu’un simple « détruire ».
- source_word: נְתָנָם לַטָּבַח
  choice: il les a livrées au massacre
  rationale: נתן prend ici le sens contextuel de livrer ou remettre, tandis que טֶבַח désigne un massacre ou un abattage collectif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de הֶחֱרִימָם
  choice: vouées à la destruction
  alternative: frappées d’interdit / exterminées
  rationale: La formulation retenue conserve à la fois l’idée de mise à part sous interdit et son issue destructrice, sans réduire le verbe à l’exécution matérielle ni imposer un jargon peu accessible.
translation_notes:
  register: Français moderne, solennel et accessible. Le parallélisme poétique hébreu est conservé en quatre lignes. « Indigné » et « fureur » distinguent les deux termes de colère; « armées » explicite le sens militaire probable de צְבָאָם.
