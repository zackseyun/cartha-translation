base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
translation:
  language: fr
  text: Toute l’armée des cieux se décomposera[a], et les cieux seront enroulés comme un rouleau[b]. Toute leur armée se flétrira[c], comme une feuille flétrie de vigne, comme une figue flétrie du figuier[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dissoudra » ou « dépérira ». Le verbe hébreu peut exprimer le dépérissement, la décomposition ou la dissolution.
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « rouleau » peut aussi désigner un livre ou un document écrit ; dans l’Antiquité, un tel document était généralement enroulé.
    reason: cultural_note
  - marker: c
    text: Littéralement « toute leur armée », c’est-à-dire vraisemblablement l’ensemble des corps célestes. L’expression « armée des cieux » peut notamment désigner les astres.
    reason: lexical_alternative
  - marker: d
    text: 'On peut aussi comprendre : « comme tombe une feuille de la vigne, comme tombe une figue du figuier ». L’image hébraïque peut mettre l’accent sur le flétrissement ou sur la chute qui en résulte.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָמַקּוּ
  choice: se décomposera
  rationale: Le niphal de נמק exprime le dépérissement, la décomposition ou la dissolution. « Se décomposera » conserve la vigueur concrète de l’image, tandis qu’une note signale d’autres nuances possibles.
- source_word: צְבָא הַשָּׁמַיִם
  choice: l’armée des cieux
  rationale: צָבָא désigne une armée ou une multitude organisée. L’expression vise ici l’ensemble céleste, probablement les astres, sans qu’il soit nécessaire de réduire explicitement son sens aux seules étoiles.
- source_word: נָגֹלּוּ כַסֵּפֶר
  choice: s’enrouleront comme un rouleau
  rationale: Le verbe גלל évoque l’action de rouler ou d’enrouler, et סֵפֶר désigne ici naturellement un rouleau écrit. Cette formulation restitue directement l’image ancienne.
- source_word: וְכָל צְבָאָם
  choice: Toute leur armée
  rationale: Le suffixe pluriel renvoie naturellement aux cieux. La traduction garde ce lien grammatical et l’ampleur de l’expression hébraïque sans expliciter abusivement « les étoiles ».
- source_word: יִבּוֹל
  choice: se flétrira
  rationale: נבל décrit couramment une végétation qui se flétrit, se fane ou dépérit. « Se flétrira » établit clairement le lien avec les comparaisons végétales qui suivent.
- source_word: כִּנְבֹל עָלֶה מִגֶּפֶן
  choice: comme une feuille de vigne qui se flétrit
  rationale: Cette tournure française naturelle conserve l’image agricole et la répétition lexicale de נבל, tout en laissant à la note la possibilité de la nuance de chute.
- source_word: וּכְנֹבֶלֶת מִתְּאֵנָה
  choice: comme le fruit flétri du figuier
  rationale: La forme féminine substantivée évoque ce qui se flétrit ou tombe du figuier. « Le fruit » explicite sobrement le référent implicite, sans imposer le mot « figue » dans le texte principal.
theological_decisions:
- issue: Nature des images cosmiques
  choice: Conserver sans atténuation le langage cosmique de jugement et de dé-création.
  alternative: Interpréter explicitement le verset soit comme une simple métaphore de l’effondrement politique, soit comme la description strictement littérale d’une dissolution astronomique.
  rationale: La poésie prophétique présente le jugement sous des images cosmiques puissantes. La traduction doit en préserver la portée et l’ambiguïté, sans l’enfermer dans un système eschatologique particulier.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible, avec une répétition volontaire de « armée » et de « se flétrir » afin de préserver les correspondances du texte hébreu. « Cieux » maintient le registre prophétique sans devenir archaïque.
