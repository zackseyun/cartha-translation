  text: כִּֽי רִוְּתָ֥ה בַ/שָּׁמַ֖יִם חַרְבִּ֑/י הִנֵּה֙ עַל אֱד֣וֹם תֵּרֵ֔ד וְ/עַל עַ֥ם חֶרְמִ֖/י לְ/מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
translation:
  language: fr
  text: Car mon épée s’est rassasiée dans les cieux[a] ; voici qu’elle descendra sur Édom, sur le peuple que j’ai voué à la destruction[b], pour le jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’est abreuvée dans les cieux » ou « s’est gorgée dans les cieux ». L’hébreu évoque le fait de boire à satiété ou d’être saturé, sans préciser ici de quoi l’épée est abreuvée.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne le peuple placé sous le ḥerem, c’est-à-dire voué à la destruction dans le cadre du jugement divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative ou causale de la particule sans trancher excessivement entre motif et affirmation solennelle.
- source_word: רִוְּתָה
  choice: s’est abreuvée
  rationale: Le verbe רוה évoque le fait de boire à satiété ou d’être saturé. Appliquée à l’épée, cette formulation préserve l’image hébraïque frappante et son ambiguïté mieux que « est trempée ».
- source_word: בַשָּׁמַיִם
  choice: dans les cieux
  rationale: Respecte le pluriel hébreu usuel et maintient la dimension cosmique de la scène.
- source_word: חַרְבִּי
  choice: mon épée
  rationale: Rend directement le nom et son suffixe possessif ; l’épée est l’instrument du jugement divin.
- source_word: הִנֵּה
  choice: la voici
  rationale: Attire vivement l’attention sur le mouvement imminent de l’épée, dans un français naturel et digne.
- source_word: עַל אֱדוֹם תֵּרֵד
  choice: elle descend sur Édom
  rationale: Préserve le mouvement concret depuis les cieux et la valeur de עַל, plutôt que de réduire l’image à une simple hostilité abstraite.
- source_word: עַם חֶרְמִי
  choice: le peuple que j’ai voué à la destruction
  rationale: חֵרֶם désigne ici ce qui est consacré ou voué à l’anéantissement dans le cadre du jugement divin. La formulation reste intelligible sans employer l’obscur « interdit ».
- source_word: לְמִשְׁפָּט
  choice: pour exécuter le jugement
  rationale: La tournure explicite naturellement en français la finalité judiciaire de la descente de l’épée, sans modifier le contenu du syntagme hébreu.
theological_decisions:
- issue: Sens de חֵרֶם dans un contexte de guerre et de jugement divins
  choice: « voué à la destruction »
  alternative: « frappé d’interdit » ou « sous mon interdit »
  rationale: La traduction retenue communique la mise à part en vue de la destruction judiciaire, tout en évitant de réduire le terme à une malédiction verbale ou d’introduire un jargon religieux opaque.
- issue: Image exprimée par רִוְּתָה
  choice: « s’est abreuvée »
  alternative: « s’est rassasiée », « est trempée » ou « est gorgée »
  rationale: Le texte ne précise pas explicitement de quoi l’épée s’est abreuvée. La formulation choisie conserve cette tension et n’ajoute pas « de sang », même si le contexte guerrier peut le suggérer.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « La voici qui descend » restitue l’effet déictique de הִנֵּה. Les images violentes et l’ambiguïté de רִוְּתָה sont conservées sans ajout explicatif dans le corps du verset.
