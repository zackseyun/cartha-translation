- from: Car mon épée s’est abreuvée dans les cieux[a] ; la voici qui descend sur Édom, sur le peuple que j’ai voué à la destruction[b], pour exécuter le jugement.
  to: Car mon épée s’est rassasiée dans les cieux[a] ; voici qu’elle descendra sur Édom, sur le peuple que j’ai voué à la destruction[b], pour le jugement.
  rationale: La révision est limitée à deux points. « S’est rassasiée » exprime de façon plus directe la saturation portée par רִוְּתָה, tout en préservant l’image et l’objet non exprimé. « Voici qu’elle descendra » correspond mieux à l’imparfait hébreu et « pour le jugement » rend לְמִשְׁפָּט sans expliciter davantage l’action judiciaire. Les ancres et le contenu des notes sont conservés, avec la première note adaptée au choix textuel.
