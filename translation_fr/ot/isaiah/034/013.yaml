  text: וְ/עָלְתָ֤ה אַרְמְנֹתֶ֨י/הָ֙ סִירִ֔ים קִמּ֥וֹשׂ וָ/ח֖וֹחַ בְּ/מִבְצָרֶ֑י/הָ וְ/הָיְתָה֙ נְוֵ֣ה תַנִּ֔ים חָצִ֖יר לִ/בְנ֥וֹת יַעֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/013.yaml
  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
translation:
  language: fr
  text: Des épines pousseront dans ses palais, des orties et des ronces dans ses forteresses. Elle deviendra un repaire de chacals[a], un pâturage[b] pour les autruches[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une traduction ancienne : « dragons ». Dans ce contexte de désolation, le terme hébreu désigne vraisemblablement des chacals.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une cour » ou « un enclos ». Le mot hébreu peut désigner un espace clos, une cour ou un lieu couvert d’herbe.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « pour les filles de l’autruche », expression qui désigne probablement les autruches.'
    reason: literal_expression
lexical_decisions:
- source_word: וְעָלְתָה ... סִירִים
  choice: Des épines pousseront
  rationale: Le verbe עלה décrit ici la végétation qui monte ou surgit dans des bâtiments abandonnés. « Pousseront » exprime naturellement cette image en français.
- source_word: אַרְמְנֹתֶיהָ
  choice: dans ses palais
  rationale: אַרְמוֹן désigne couramment un palais ou une résidence fortifiée. Le complément de lieu sans préposition explicite est rendu naturellement par « dans ».
- source_word: קִמּוֹשׂ וָחוֹחַ
  choice: des orties et des ronces
  rationale: Les deux termes désignent des plantes sauvages nuisibles ou épineuses. Cette formulation les distingue tout en conservant l'image de l'abandon.
- source_word: בְּמִבְצָרֶיהָ
  choice: dans ses forteresses
  rationale: מִבְצָר désigne un ouvrage ou un lieu fortifié ; « forteresses » convient au parallèle avec les palais.
- source_word: נְוֵה
  choice: le repaire
  rationale: נָוֶה peut désigner une demeure, un habitat ou un lieu de repos. « Repaire » convient ici à des animaux sauvages occupant des ruines.
- source_word: תַנִּים
  choice: des chacals
  rationale: Dans les descriptions prophétiques de lieux dévastés, תַנִּים désigne vraisemblablement des chacals. Une note signale l'ancienne traduction traditionnelle.
- source_word: חָצִיר
  choice: un enclos
  rationale: Le mot peut désigner un espace clos ou une cour, mais aussi être compris comme un lieu herbeux. « Enclos » maintient le parallélisme avec l'habitat animal, tandis qu'une note conserve l'autre possibilité.
- source_word: לִבְנוֹת יַעֲנָה
  choice: pour les autruches
  rationale: L'expression signifie littéralement « pour les filles de l'autruche » et fonctionne vraisemblablement comme une désignation idiomatique des autruches. Le sens est donné dans le texte, et la forme hébraïque est conservée en note.
