- from: Ses ravins deviendront de la poix[a], et sa poussière, du soufre[b] ; son pays deviendra de la poix en feu.
  to: Ses torrents seront changés en poix[a], et sa poussière en soufre ; son pays deviendra de la poix en feu.
  rationale: La révision conserve l’imagerie et la personnification du texte hébreu, explicite la transformation passive des torrents et retire une note lexicale inexacte. La répétition de « poix » et la description finale de la poix en feu maintiennent la force prophétique du verset.
