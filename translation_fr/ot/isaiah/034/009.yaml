review_pass:
  verdict: revise
  source_fidelity: Le sens global et la triple transformation sont bien rendus. Toutefois, le nifal de נֶהֶפְכוּ est plus fidèlement conservé par une tournure passive (« seront changés en ») que par « deviendront », qui atténue l’image de transformation subie. « Torrents » rend naturellement נְחָלִים tout en laissant la nuance de lits torrentiels en note.
  naturalness: « Ses torrents seront changés en poix » est une formulation française moderne, claire et solennelle. « De la poix en feu » restitue de manière idiomatique la poix décrite comme brûlante.
  terminology: '« Poix » et « soufre » sont exacts pour זֶפֶת et גָפְרִית. La note b doit être supprimée : « fleur de soufre » n’est ni une traduction traditionnelle pertinente de גָפְרִית ni une véritable alternative lexicale dans ce verset.'
  issues:
  - severity: medium
    issue: La note b présente « fleur de soufre » comme rendu ancien de « soufre ».
    rationale: « Fleur de soufre » désigne une préparation de soufre, non un équivalent traditionnel approprié du terme hébreu גָפְרִית. La note est donc lexicalement trompeuse et ne doit pas être ancrée au texte.
  - severity: low
    issue: « Deviendront » rend moins explicitement la voix passive de נֶהֶפְכוּ.
    rationale: Le contexte décrit des éléments du pays qui sont transformés sous le jugement. « Seront changés en » préserve cette image sans nuire à la fluidité française.
  revised_text: Ses torrents seront changés en poix[a], et sa poussière en soufre ; son pays deviendra de la poix en feu.
  revised_footnotes:
  - marker: a
    text: Ou « oueds » ou « lits de torrents ». Le mot hébreu peut désigner des cours d’eau saisonniers, leurs lits ou des ravins.
    reason: lexical_alternative
