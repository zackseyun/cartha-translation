base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/009.yaml
  text: Her wadis will be turned into pitch[a], and her dust into sulfur[b]; her land will become burning pitch.
translation:
  language: fr
  text: Ses torrents seront changés en poix[a], et sa poussière en soufre ; son pays deviendra de la poix en feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oueds » ou « lits de torrents ». Le mot hébreu peut désigner des cours d’eau saisonniers, leurs lits ou des ravins.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֶפְכוּ
  choice: deviendront
  rationale: Le nifal de הפך exprime ici, dans le discours prophétique, une transformation à venir. « Deviendront » rend naturellement le résultat sans alourdir la phrase par un passif.
- source_word: נְחָלֶיהָ
  choice: ses ravins
  rationale: נחל peut désigner un ravin, le lit d’un torrent ou un cours d’eau. Dans le cadre aride d’Édom, « ravins » convient au relief sans suggérer des rivières permanentes ; l’autre sens est signalé en note.
- source_word: זֶפֶת
  choice: poix
  rationale: זפת désigne la poix ou le bitume. « Poix » conserve l’image biblique d’une matière noire et inflammable, tout en restant intelligible en français courant.
- source_word: עֲפָרָהּ
  choice: sa poussière
  rationale: עפר signifie poussière, terre sèche ou terre meuble. « Poussière » préserve l’image saisissante de la substance même du pays transformée.
- source_word: גָפְרִית
  choice: soufre
  rationale: « Soufre » est l’équivalent moderne et précis de גפרית ; l’ancien terme français « fleur de soufre » ne conviendrait pas ici.
- source_word: אַרְצָהּ
  choice: son pays
  rationale: ארץ désigne ici le territoire d’Édom. « Son pays » est naturel et maintient, grâce au possessif, la personnification portée par les suffixes féminins hébreux.
- source_word: בֹּעֵרָה
  choice: en feu
  rationale: Le participe qal décrit la poix comme brûlante. « En feu » produit une formulation française vive et idiomatique sans préciser indûment la durée ou l’intensité.
theological_decisions:
- issue: Personnification du territoire jugé par des suffixes féminins
  choice: Conserver les possessifs « ses », « sa » et « son » rapportés au pays personnifié dans le contexte
  alternative: Employer une formulation impersonnelle telle que « les ravins du pays »
  rationale: L’hébreu répète les suffixes de troisième personne féminine singulière. Les possessifs français maintiennent cette cohésion et la personnification prophétique, même si le genre grammatical varie selon les noms possédés.
translation_notes:
  register: Français international moderne, sobre et prophétique. La structure ternaire et les répétitions de « poix » sont conservées. « Ravins » privilégie le contexte aride, avec l’ambiguïté lexicale maintenue en note.
