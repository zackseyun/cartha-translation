id: ISA.34.8
reference: Isaiah 34:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֛י י֥וֹם נָקָ֖ם לַֽ/יהוָ֑ה שְׁנַ֥ת שִׁלּוּמִ֖ים לְ/רִ֥יב צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/008.yaml
  text: For Yahweh has a day of vengeance[a], a year of recompense for Zion’s cause.
translation:
  language: fr
  text: Car Yahweh a un jour de vengeance[a], une année de représailles pour la cause de Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car c’est un jour de vengeance pour Yahweh, une année de représailles pour le procès de Sion. »'
    reason: Cette variante conserve la lecture relationnelle de לַיהוָה et rend plus explicitement le sens judiciaire possible de רִיב.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication du jugement annoncé dans le contexte précédent.
- source_word: יוֹם נָקָם
  choice: un jour de vengeance
  rationale: Cette formulation naturelle conserve l’image temporelle et la force punitive et judiciaire de l’hébreu.
- source_word: לַיהוָה
  choice: Yahweh a
  rationale: Le לְ peut exprimer ici la possession ou la relation. La tournure possessive est claire en français tout en laissant l’autre analyse en note.
- source_word: שְׁנַת שִׁלּוּמִים
  choice: une année de représailles
  rationale: Le pluriel abstrait שִׁלּוּמִים désigne le paiement en retour ou la rétribution. « Représailles » rend naturellement en français le parallélisme avec la vengeance.
- source_word: לְרִיב צִיּוֹן
  choice: pour la cause de Sion
  rationale: רִיב possède une dimension juridique et peut désigner une cause, un différend ou un procès. « La cause de Sion » reste accessible et conserve cette nuance judiciaire.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Valeur de לַיהוָה
  choice: 'lecture possessive : « Yahweh a un jour de vengeance »'
  alternative: 'lecture relationnelle : « un jour de vengeance pour Yahweh »'
  rationale: Les deux analyses sont possibles. La première donne une phrase française naturelle; la seconde est signalée en note afin de préserver l’ambiguïté syntaxique.
- issue: Sens judiciaire de רִיב צִיּוֹן
  choice: la cause de Sion
  alternative: le procès de Sion
  rationale: « Cause » maintient la portée juridique sans déterminer si Sion est explicitement partie à un procès formel.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme « un jour… une année… » est maintenu; le nom Sion est conservé sous sa forme française traditionnelle.
