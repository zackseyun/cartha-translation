    issue: « elle est engraissée de graisse » est peu idiomatique en français et sonne mécaniquement répétitif.
    rationale: Le passif hébreu de דשׁן évoque une épée devenue grasse, imprégnée ou gorgée de graisse. « S’est gorgée de graisse » rend cette image de façon naturelle et vigoureuse sans atténuer le caractère sacrificiel.
  - severity: low
    issue: L’ambiguïté de la proposition nominale « car [il y a/] Yahweh a un sacrifice » n’est pas signalée par une note ancrée.
    rationale: La traduction principale est défendable, mais l’hébreu sans verbe permet aussi « car il y a un sacrifice pour Yahweh ». Une note brève préserve cette possibilité sans modifier le sens du verset.
  revised_text: L’épée de Yahweh est remplie de sang ; elle s’est gorgée de graisse, du sang des agneaux et des boucs, de la graisse des rognons des béliers. Car Yahweh a un sacrifice à Botsra[a], et un grand carnage dans le pays d’Édom.
