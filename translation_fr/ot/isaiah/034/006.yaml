  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
translation:
  language: fr
  text: L’épée de Yahweh est remplie de sang ; elle s’est gorgée de graisse, du sang des agneaux et des boucs, de la graisse des rognons des béliers. Car Yahweh a un sacrifice à Botsra[a], et un grand carnage dans le pays d’Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il y a un sacrifice pour Yahweh à Botsra ». La proposition hébraïque ne comporte pas de verbe exprimé.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב לַיהוָה
  choice: L’épée de Yahweh
  rationale: 'Le lamed exprime ici naturellement l’appartenance ou la relation : l’épée est l’instrument de Yahweh. Le nom divin est translittéré.'
- source_word: מָלְאָה דָם
  choice: est remplie de sang
  rationale: Le parfait décrit un état résultant avec une force vive et actuelle ; cette formulation conserve l’image concrète.
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  choice: elle est engraissée de graisse
  rationale: Le passif de דשׁן évoque ce qui est rendu gras ou abondamment imprégné de graisse. Malgré sa rudesse voulue, la répétition maintient le lien lexical et sacrificiel du texte.
- source_word: כָּרִים וְעַתּוּדִים
  choice: agneaux et boucs
  rationale: כָּרִים peut désigner de jeunes béliers ou des agneaux, tandis que עַתּוּדִים désigne spécifiquement des boucs ; le français conserve ici la distinction sexuelle du second terme.
- source_word: מֵחֵלֶב כִּלְיוֹת אֵילִים
  choice: de la graisse des rognons des béliers
  rationale: « Rognons » est le terme français naturel dans un contexte animal et sacrificiel, et garde le détail anatomique explicite de l’hébreu.
- source_word: כִּי זֶבַח לַיהוָה
  choice: Car Yahweh a un sacrifice
  rationale: La proposition hébraïque est sans verbe. Fournir « a » produit un français naturel et présente le sacrifice comme celui que Yahweh ordonne ou possède, sans effacer l’autre analyse possible.
- source_word: בְּבָצְרָה
  choice: à Botsra
  rationale: Le nom propre est translittéré selon une forme française transparente ; « à » convient naturellement à une ville.
- source_word: טֶבַח גָּדוֹל
  choice: un grand carnage
  rationale: טֶבַח désigne une tuerie ou un massacre. « Carnage » restitue avec force l’image de jugement et évite de confondre ce terme avec זֶבַח, « sacrifice ».
theological_decisions:
- issue: L’imagerie sacrificielle appliquée au jugement d’Édom
  choice: Conserver explicitement le sacrifice, la graisse, les rognons et le carnage.
  alternative: Transformer l’ensemble en langage général de bataille.
  rationale: L’oracle superpose délibérément guerre, abattage et sacrifice. La traduction doit préserver cette tension théologique et la violence de l’image plutôt que l’atténuer.
- issue: Analyse de la proposition nominale זֶבַח לַיהוָה
  choice: « Yahweh a un sacrifice »
  alternative: « il y a un sacrifice pour Yahweh »
  rationale: Les deux analyses sont grammaticalement possibles. La première est fluide et cohérente avec Yahweh comme auteur du jugement, mais la proposition nominale demeure assez ouverte pour que l’alternative mérite d’être signalée en note si l’édition en comporte.
translation_notes:
  register: Français moderne, international et digne, avec une cadence poétique soutenue. Le vocabulaire sacrificiel concret est conservé sans euphémisme. Aucun marqueur de note n’est employé, puisque le projet de notes anglais fourni présente des marqueurs manifestement décalés par rapport à leur contenu ; les ambiguïtés pertinentes sont consignées dans les décisions plutôt que rattachées artificiellement au mauvais segment.
