- from: L’épée de Yahweh est remplie de sang ; elle est engraissée de graisse, du sang des agneaux et des boucs, de la graisse des rognons des béliers. Car Yahweh a un sacrifice à Botsra et un grand carnage dans le pays d’Édom.
