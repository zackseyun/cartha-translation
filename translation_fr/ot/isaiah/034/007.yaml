source:
  edition: WLC
  text: וְ/יָרְד֤וּ רְאֵמִים֙ עִמָּ֔/ם וּ/פָרִ֖ים עִם אַבִּירִ֑ים וְ/רִוְּתָ֤ה אַרְצָ/ם֙ מִ/דָּ֔ם וַ/עֲפָרָ֖/ם מֵ/חֵ֥לֶב יְדֻשָּֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
translation:
  language: fr
  text: Les bœufs sauvages tomberont avec eux[a], et les jeunes taureaux avec les puissants[b] ; leur pays sera abreuvé de sang, et leur poussière sera enrichie de graisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les oryx » ; le mot hébreu désigne un bovidé sauvage puissant, mais l’espèce exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: « Les puissants » peuvent désigner des hommes puissants ou, dans cette image poétique, des taureaux robustes ; l’hébreu permet de percevoir l’une ou l’autre nuance, voire les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: tomberont
  rationale: Le verbe signifie littéralement « descendre », mais, dans cette scène de massacre et de jugement, « tomber » exprime naturellement le fait d’être abattu.
- source_word: רְאֵמִים
  choice: buffles sauvages
  rationale: Le terme désigne un grand bovidé sauvage et puissant, mais l’espèce exacte reste incertaine. Cette formulation évite l’ancien « licornes » tout en conservant l’image animale.
- source_word: עִמָּם
  choice: avec eux
  rationale: Le pronom pluriel est conservé sans préciser davantage son antécédent.
- source_word: וּפָרִים
  choice: les jeunes taureaux
  rationale: פָּר désigne couramment un taureau, souvent jeune; la précision convient à l’imagerie de l’abattage.
- source_word: אַבִּירִים
  choice: les puissants
  rationale: Le mot peut évoquer des hommes puissants aussi bien que des animaux robustes; ce choix préserve cette ambiguïté.
- source_word: וְרִוְּתָה
  choice: sera abreuvé
  rationale: Le verbe évoque le fait de boire à satiété ou d’être saturé. Avec le pays comme sujet et le sang comme complément, « abreuvé » garde la personnification poétique.
- source_word: אַרְצָם
  choice: leur pays
  rationale: Le terme renvoie ici au territoire de ceux qui subissent le jugement.
- source_word: מִדָּם
  choice: de sang
  rationale: Cette construction française accompagne naturellement « abreuvé » et rend la matière dont le pays est saturé.
- source_word: וַעֲפָרָם
  choice: leur poussière
  rationale: La traduction concrète maintient l’image hébraïque plutôt que de la généraliser en « sol ».
- source_word: מֵחֵלֶב
  choice: de graisse
  rationale: La préposition indique ici ce qui rend la poussière grasse ou fertile dans l’image macabre du massacre.
- source_word: יְדֻשָּׁן
  choice: engraissée
  rationale: Le verbe signifie devenir gras ou être enrichi. « Engraissée » conserve le lien lexical et imagé avec la graisse, au prix d’une étrangeté poétique voulue.
theological_decisions:
- issue: Portée littérale ou métaphorique des animaux
  choice: Conserver les termes animaux tout en laissant ouverte leur portée figurée pour les puissants qui tombent sous le jugement.
  alternative: Comprendre tous les animaux soit comme des victimes animales littérales, soit exclusivement comme des métaphores de dirigeants humains.
  rationale: Le passage superpose les images du sacrifice et du champ de bataille; la traduction ne tranche pas artificiellement entre ces dimensions.
- issue: Référent de אַבִּירִים
  choice: « les puissants », formulation susceptible de désigner des hommes puissants ou de robustes taureaux.
  alternative: « les taureaux puissants » ou « les guerriers » seulement.
  rationale: Le lexème et le parallélisme permettent plusieurs nuances qui participent à la tension poétique du verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est marqué par une ponctuation nette. « Abreuvé » et « engraissée » conservent les images corporelles et sacrificielles de l’hébreu sans les expliquer dans le corps du texte.
