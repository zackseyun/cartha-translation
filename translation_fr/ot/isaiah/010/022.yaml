  naturalness: 'La révision emploie une formulation française moderne, fluide et digne : « de ce peuple » exprime naturellement le partitif tout en conservant le référent collectif, et le point-virgule rend clairement la seconde proposition sans ajouter de contenu.'
  terminology: « Reste », « reviendra », « destruction » et « justice » sont appropriés. « Justice » pour צְדָקָה est contextuellement défendable; la note conserve « droiture » comme autre nuance possible. Le nom « Israël » et l’adresse directe « ton peuple » sont maintenus.
