  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אִם יִהְיֶ֞ה עַמְּ/ךָ֤ יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם שְׁאָ֖ר יָשׁ֣וּב בּ֑/וֹ כִּלָּי֥וֹן חָר֖וּץ שׁוֹטֵ֥ף צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
translation:
  language: fr
  text: Car, même si ton peuple, Israël, est aussi nombreux que le sable de la mer, seul un reste de ce peuple reviendra[a]. Une destruction est décrétée, débordante de justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seul un reste d’entre eux reviendra » ; le pronom hébreu est au singulier et renvoie au peuple considéré collectivement.
    reason: lexical_alternative
  - marker: b
    text: Ou « débordante de droiture ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Car même si
  rationale: 'Dans ce contexte, la locution a une valeur concessive : malgré le grand nombre d’Israël, seul un reste reviendra.'
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple, Israël
  rationale: Rend directement le suffixe masculin singulier et le nom propre en apposition.
- source_word: כְּחוֹל הַיָּם
  choice: aussi nombreux que le sable de la mer
  rationale: Explicite naturellement en français la comparaison numérique impliquée par l’image, tout en conservant celle du sable de la mer.
- source_word: שְׁאָר
  choice: un reste
  rationale: Désigne la fraction survivante du peuple; « seul » exprime dans la proposition le contraste avec la multitude.
- source_word: יָשׁוּב
  choice: reviendra
  rationale: Préserve le sens large de « revenir/retourner » sans le réduire à la repentance ni à un retour historique précis.
- source_word: בּוֹ
  choice: parmi lui
  rationale: Le pronom hébreu est singulier et renvoie au nom collectif « peuple »; cette formulation française en respecte le nombre tout en exprimant la valeur partitive.
- source_word: כִּלָּיוֹן
  choice: destruction
  rationale: Terme clair qui exprime la ruine ou la dévastation sans imposer l’idée d’un anéantissement absolument total, puisque subsiste un reste.
- source_word: חָרוּץ
  choice: est décidée
  rationale: Exprime le caractère fixé et déterminé du jugement annoncé.
- source_word: שׁוֹטֵף
  choice: débordante
  rationale: Conserve la métaphore d’un flot qui déborde.
- source_word: צְדָקָה
  choice: justice
  rationale: Dans l’annonce d’un jugement destructeur, « justice » exprime naturellement en français la rectitude judiciaire de celui-ci; « droiture » reste une possibilité lexicale signalée en note.
theological_decisions:
- issue: Nature du « retour » du reste
  choice: Le rendre simplement par « reviendra »
  alternative: « se convertira » ou retour historique précis après l’exil
  rationale: Le verbe hébreu permet une résonance à la fois concrète et théologique. La traduction ne tranche pas entre retour national, retour vers Dieu et accomplissement historique particulier.
- issue: Sens de צְדָקָה dans la dernière proposition
  choice: justice
  alternative: droiture
  rationale: Les deux sens sont possibles. « Justice » convient particulièrement au caractère équitable du jugement décrété, tandis que la note conserve l’autre nuance importante.
- issue: Référent singulier de בּוֹ
  choice: parmi lui, en référence au peuple collectif
  alternative: « d’entre eux », en accord de sens avec les membres du peuple
  rationale: Le français peut conserver le singulier collectif de l’hébreu; la note précise l’autre formulation idiomatique possible.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve l’adresse directe au singulier. La formulation maintient l’image du sable, le motif du reste et la métaphore du débordement, sans préciser indûment la nature du retour.
