  text: shall I not do to Jerusalem and her idols just as I did to Samaria and her idols?[a]
translation:
  language: fr
  text: Ne ferai-je pas à Jérusalem et à ses idoles comme j’ai fait à Samarie et à ses idoles[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie deux termes différents : pour Samarie, « idoles » (אֱלִילִים), mot souvent péjoratif ; pour Jérusalem, « idoles » ou « images cultuelles » (עֲצַבִּים).'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne ferai-je pas
  rationale: Introduit une question rhétorique appelant une réponse affirmative; le futur français convient à l’imparfait hébreu אֶעֱשֶׂה.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: ce que ...
  rationale: Cette tournure française naturelle exprime nettement la correspondance entre le sort déjà infligé à Samarie et celui qui attend Jérusalem.
- source_word: עָשִׂיתִי
  choice: j’ai fait
  rationale: Le passé composé présente l’action contre Samarie comme accomplie et reste naturel en français moderne.
- source_word: לְשֹׁמְרוֹן / לִירוּשָׁלַםִ
  choice: à Samarie / à Jérusalem
  rationale: La préposition « à » conserve la construction hébraïque avec עשה sans expliciter davantage l’hostilité, fournie par le contexte.
- source_word: אֱלִילֶיהָ
  choice: ses faux dieux
  rationale: אֱלִילִים désigne des divinités sans valeur ou illusoires; « faux dieux » rend clairement cette nuance péjorative tout en distinguant le terme du suivant.
- source_word: עֲצַבֶּיהָ
  choice: ses idoles
  rationale: עֲצַבִּים désigne des représentations cultuelles ou idoles; « idoles » est précis, courant et digne.
theological_decisions:
- issue: Deux termes hébreux distincts pour les objets de culte de Samarie et de Jérusalem
  choice: Traduire אֱלִילִים par « faux dieux » et עֲצַבִּים par « idoles »
  alternative: Employer « idoles » dans les deux membres et signaler la différence lexicale en note
  rationale: Le français permet de préserver la variation lexicale du texte source sans affaiblir le parallèle rhétorique ni introduire une distinction théologique trop précise.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et le contraste temporel entre l’action accomplie contre Samarie et l’action future contre Jérusalem sont conservés.
