source:
  edition: WLC
  text: וּ/מַֽה תַּעֲשׂוּ֙ לְ/י֣וֹם פְּקֻדָּ֔ה וּ/לְ/שׁוֹאָ֖ה מִ/מֶּרְחָ֣ק תָּב֑וֹא עַל מִי֙ תָּנ֣וּסוּ לְ/עֶזְרָ֔ה וְ/אָ֥נָה תַעַזְב֖וּ כְּבוֹדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
translation:
  language: fr
  text: Que ferez-vous au jour du châtiment et lors du désastre qui viendra de loin ? Vers qui fuirez-vous pour trouver de l’aide, et où laisserez-vous votre richesse[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre gloire » ou « votre honneur ». Le mot hébreu peut désigner la gloire ou l’honneur, mais aussi, dans ce contexte, les biens précieux ou la richesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: châtiment
  rationale: Dans cet oracle de jugement, le terme désigne une intervention punitive ou un règlement de comptes. « Châtiment » exprime clairement cette portée en français moderne.
- source_word: שׁוֹאָה
  choice: désastre
  rationale: Le nom évoque une catastrophe dévastatrice ou une ruine soudaine. « Désastre » restitue sa force tout en s’intégrant naturellement à la question.
- source_word: מִמֶּרְחָק
  choice: de loin
  rationale: L’expression indique que le désastre vient d’un lieu éloigné, probablement sous la forme d’une puissance envahissante, sans que celle-ci soit explicitement nommée ici.
- source_word: תָּבוֹא
  choice: viendra
  rationale: L’imparfait hébreu a ici une valeur future, cohérente avec les questions portant sur le jour de l’intervention annoncée.
- source_word: תָּנוּסוּ
  choice: fuirez-vous
  rationale: Le verbe exprime la fuite devant un danger. Cette formulation conserve le caractère pressant de la question rhétorique.
- source_word: לְעֶזְרָה
  choice: pour trouver de l’aide
  rationale: La tournure française explicite naturellement le but de la fuite sans ajouter une source d’aide absente de l’hébreu.
- source_word: אָנָה
  choice: où
  rationale: Cet adverbe interrogatif porte sur le lieu ou la direction. « Où » est la forme naturelle en français actuel.
- source_word: תַעַזְבוּ
  choice: laisserez-vous
  rationale: Le verbe signifie laisser ou abandonner. « Laisser » préserve l’ambiguïté quant au sort de ce qui est précieux.
- source_word: כְּבוֹדְכֶם
  choice: votre richesse
  rationale: Bien que le sens premier puisse être « gloire » ou « honneur », le contexte permet une référence concrète aux biens précieux que les destinataires voudraient mettre à l’abri. L’alternative littérale est conservée en note.
theological_decisions:
- issue: Sens concret ou abstrait de כְּבוֹדְכֶם dans l’oracle de jugement
  choice: votre richesse
  alternative: votre gloire ou votre honneur
  rationale: La question demande ce que les destinataires feront de ce qu’ils tiennent pour précieux lorsque le jugement arrivera. Le sens concret « richesse » convient au contexte, mais le sens abstrait demeure réellement possible et est donc signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques et le parallélisme du texte hébreu sont conservés. Le marqueur de note est placé après « richesse », le mot auquel la variante lexicale se rapporte.
