source:
  edition: WLC
  text: כִּי ע֖וֹד מְעַ֣ט מִזְעָ֑ר וְ/כָ֣לָה זַ֔עַם וְ/אַפִּ֖/י עַל תַּבְלִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
translation:
  language: fr
  text: Car, dans très peu de temps, dans un temps très court, l’indignation prendra fin, et ma colère sera pour leur destruction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur anéantissement », « leur consommation » ou « leur fin ». Le nom hébreu est rare et son sens précis est discuté, bien que le contexte indique la chute du ou des oppresseurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’assurance qui soutient la promesse précédente et marque naturellement le lien logique en français.
- source_word: עוֹד מְעַט מִזְעָר
  choice: encore un peu, très peu de temps
  rationale: La combinaison de עוֹד et de deux termes proches souligne qu’il ne reste qu’un délai extrêmement bref. Cette formulation conserve l’intensification hébraïque dans un français naturel.
- source_word: וְכָלָה
  choice: et … prendra fin
  rationale: Dans ce discours prophétique, l’accompli hébreu a une portée future. « Prendra fin » exprime clairement la cessation annoncée.
- source_word: זַעַם
  choice: l’indignation
  rationale: Le terme désigne souvent l’indignation divine. Ce choix, d’un registre digne mais courant, le distingue de אַפִּי, rendu par « ma colère ».
- source_word: וְאַפִּי
  choice: ma colère
  rationale: Littéralement « mon nez », cette expression idiomatique hébraïque désigne la colère et conserve ici la première personne.
- source_word: עַל
  choice: sera dirigée vers
  rationale: La préposition indique ici la direction ou la cible de la colère. L’ajout du verbe implicite produit une phrase française intelligible sans préciser davantage le mécanisme du jugement.
- source_word: תַּבְלִיתָם
  choice: leur destruction
  rationale: Ce nom rare paraît désigner la destruction, la consommation ou la fin des oppresseurs. « Leur destruction » conserve le suffixe pronominal et convient au contexte, tandis qu’une note signale l’incertitude lexicale.
theological_decisions:
- issue: Référent de « leur » dans « leur destruction »
  choice: Le pronom renvoie aux ennemis oppresseurs, en particulier à l’Assyrie dans le contexte immédiat.
  alternative: On peut comprendre l’expression plus abstraitement au sens de « en vue de la destruction », sans référent personnel fortement défini.
  rationale: Le contexte annonce la fin de l’indignation contre le peuple de Dieu et le jugement de l’oppresseur. Le suffixe hébreu est néanmoins conservé sans nommer explicitement l’Assyrie dans le verset.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « un peu, très peu de temps » conserve l’insistance de l’hébreu ; le point-virgule aide à faire entendre la progression de l’annonce prophétique.
