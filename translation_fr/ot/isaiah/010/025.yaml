  - severity: low
    issue: Valeur de la préposition finale trop directionnelle
    rationale: « Sera dirigée vers leur destruction » est possible, mais « pour leur destruction » reflète plus directement l’ambiguïté de עַל dans cette formule concise et s’accorde avec la trace d’audit anglaise.
