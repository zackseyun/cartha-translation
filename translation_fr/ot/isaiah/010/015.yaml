    rationale: L’hébreu présente l’outil comme se glorifiant au-dessus de/contre son utilisateur, et non principalement comme lui causant un préjudice.
  - severity: medium
    issue: « une baguette faisait bouger ceux qui la lèvent » est trop vague pour הָנִיף.
    rationale: Le verbe évoque le fait d’agiter ou de brandir; la pointe de l’image est que l’instrument accomplirait l’action normalement exercée par son porteur.
