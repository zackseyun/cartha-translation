  source_fidelity: 'La première comparaison doit garder plus nettement le rapport d’opposition ou de supériorité exprimé par עַל, plutôt que « aux dépens de ». Dans la troisième image, « faisait bouger » affaiblit l’inversion d’agent : l’instrument est figuré comme brandissant ceux qui le soulèvent. Le pluriel de « ceux qui la soulèvent » correspond utilement à la forme hébraïque.'
  naturalness: Le français est globalement fluide et adapté à un registre biblique moderne. « Se glorifier contre » et « brandir » expriment plus précisément les images tout en restant naturels dans ce contexte rhétorique.
  terminology: « Hache », « scie », « baguette » et « bâton » maintiennent les distinctions lexicales du texte. « Quelqu’un qui n’est pas de bois » rend explicitement, sans excès interprétatif, le référent personnel probable de la finale elliptique; la note conserve l’autre possibilité.
