id: ISA.10.15
reference: Isaiah 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
translation:
  language: fr
  text: La hache se glorifie-t-elle contre celui qui taille avec elle ? La scie s’élève-t-elle au-dessus de celui qui la manie ? Ce serait comme si une baguette brandissait ceux qui la soulèvent, ou comme si un bâton soulevait quelqu’un qui n’est pas de bois[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme si un bâton soulevait pas-bois ». La fin de la phrase est elliptique et peut aussi se comprendre : « ce qui n’est pas de bois ».'
    reason: L’hébreu omet le terme auquel se rapporte « pas bois », ce qui permet plusieurs analyses de la proposition.
lexical_decisions:
- source_word: יִתְפָּאֵר
  choice: se vante
  rationale: La forme réfléchie exprime le fait de se glorifier ou de se mettre en avant. « Se vanter » est naturel en français et convient à la question rhétorique.
- source_word: הַגַּרְזֶן
  choice: la hache
  rationale: Équivalent français courant de cet outil tranchant.
- source_word: הַחֹצֵב בּוֹ
  choice: celui qui s’en sert pour tailler
  rationale: Le participe désigne celui qui taille ou équarrit, tandis que בּוֹ indique que la hache est son instrument. Cette formulation conserve les deux éléments sans lourdeur.
- source_word: יִתְגַּדֵּל
  choice: s’élève
  rationale: Le verbe décrit ici l’action de se grandir ou de s’exalter. « S’élève » exprime naturellement la prétention de l’outil face à son utilisateur.
- source_word: הַמַּשּׂוֹר
  choice: la scie
  rationale: Équivalent lexical direct et courant.
- source_word: מְנִיפוֹ
  choice: celui qui la manie
  rationale: Le terme vient du verbe « agiter, brandir, faire mouvoir ». Pour une scie, « manier » rend naturellement l’action de son utilisateur.
- source_word: כְּהָנִיף שֵׁבֶט וְאֶת מְרִימָיו
  choice: comme si une baguette faisait bouger ceux qui la lèvent
  rationale: La proposition, très concise en hébreu, inverse de manière absurde le rapport entre l’instrument et ses utilisateurs. Le pluriel morphologique de מְרִימָיו est conservé par « ceux qui la lèvent ».
- source_word: שֵׁבֶט
  choice: une baguette
  rationale: « Baguette » désigne ici un objet rigide que l’on agite et permet de le distinguer de מַטֶּה, rendu par « bâton ».
- source_word: כְּהָרִים מַטֶּה
  choice: comme si un bâton soulevait
  rationale: La formulation explicite en français l’inversion d’agent contenue dans la comparaison elliptique.
- source_word: מַטֶּה
  choice: un bâton
  rationale: Terme français courant, distinct de « baguette » tout en restant dans le même champ concret.
- source_word: לֹא עֵץ
  choice: celui qui n’est pas de bois
  rationale: L’expression hébraïque signifie littéralement « pas bois » et demeure elliptique. La traduction fait ressortir le contraste probable entre l’instrument en bois et l’être humain qui le manie, sans masquer l’ambiguïté, signalée en note.
theological_decisions:
- issue: Interprétation de la proposition elliptique finale לֹא עֵץ
  choice: « celui qui n’est pas de bois », compris comme l’utilisateur humain du bâton
  alternative: « ce qui n’est pas de bois » ; ou, selon une autre analyse syntaxique, « un bâton qui n’est pas de bois »
  rationale: Dans l’ensemble du verset, l’image repose sur l’absurdité d’un instrument qui dominerait son utilisateur. La lecture retenue maintient cette logique et l’ironie du contraste, tandis que la note préserve l’indétermination grammaticale de l’hébreu.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les questions rhétoriques et l’inversion volontaire entre l’outil et son utilisateur sont conservées. « Baguette » et « bâton » distinguent les deux termes hébreux voisins sans employer un vocabulaire archaïque.
