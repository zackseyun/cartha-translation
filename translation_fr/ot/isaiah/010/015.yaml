- from: La hache se vante-t-elle aux dépens de celui qui s’en sert pour tailler ? La scie s’élève-t-elle au-dessus de celui qui la manie ? Ce serait comme si une baguette faisait bouger ceux qui la lèvent, ou comme si un bâton soulevait celui qui n’est pas de bois[a] !
  to: La hache se glorifie-t-elle contre celui qui taille avec elle ? La scie s’élève-t-elle au-dessus de celui qui la manie ? Ce serait comme si une baguette brandissait ceux qui la soulèvent, ou comme si un bâton soulevait quelqu’un qui n’est pas de bois[a] !
  rationale: La révision renforce les relations d’opposition et de renversement d’agent présentes dans les comparaisons hébraïques. Elle préserve la distinction entre les deux instruments et maintient, par la note, l’ambiguïté de la dernière expression.
