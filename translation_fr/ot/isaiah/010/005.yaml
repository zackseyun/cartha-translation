  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
translation:
  language: fr
  text: Malheur à l’Assyrie, le bâton de ma colère ! Le bâton dans leurs mains, c’est mon indignation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: L’interjection ouvre une menace prophétique tout en gardant une nuance de lamentation ; « Malheur à » en restitue naturellement la force en français.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Nom du pays et de la puissance impériale prise collectivement, selon l’usage français courant.
- source_word: שֵׁבֶט
  choice: le bâton
  rationale: Dans ce contexte, le terme désigne un objet servant à frapper et, métaphoriquement, l’instrument de la colère divine. « Bâton » est actuel et évite l’archaïsme de « verge ».
- source_word: אַפִּי
  choice: ma colère
  rationale: Le sens idiomatique du mot, littéralement lié au nez, est la colère ; cette formulation est claire et naturelle.
- source_word: וּמַטֶּה
  choice: Le gourdin
  rationale: Le mot est parallèle à שֵׁבֶט et désigne ici un bâton comme instrument de frappe. « Gourdin » distingue les deux termes hébreux sans affaiblir l’image.
- source_word: הוּא
  choice: c’est
  rationale: La tournure présentative française rend naturellement le pronom copulatif et maintient l’identification métaphorique.
- source_word: בְיָדָם
  choice: entre leurs mains
  rationale: Le suffixe hébreu est au pluriel, tandis que le nom « main » est morphologiquement singulier. L’expression idiomatique française « entre leurs mains » préserve la référence plurielle et le sens de possession ou de maniement.
- source_word: זַעְמִי
  choice: mon indignation
  rationale: Le terme exprime une colère intense. « Indignation » garde la force théologique et le parallélisme avec « ma colère » sans employer exactement le même mot.
theological_decisions:
- issue: L’Assyrie comme instrument du jugement divin
  choice: Conserver l’identification directe de l’Assyrie avec le bâton de la colère de Dieu et du gourdin avec son indignation.
  alternative: Présenter l’Assyrie comme un acteur seulement indépendant ou comme un instrument de jugement de façon explicitement atténuée.
  rationale: Le verset attribue sans détour une fonction instrumentale à l’Assyrie. La traduction maintient cette tension sans expliquer ni résoudre la responsabilité respective de Dieu et de l’empire.
translation_notes:
  register: Français moderne, direct et solennel. « Malheur à » conserve le ton de l’oracle ; « bâton » et « gourdin » rendent concrète l’image d’instruments de frappe sans recourir au vocabulaire archaïque.
