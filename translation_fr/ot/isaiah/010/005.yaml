  source_fidelity: 'Le texte conserve correctement l’oracle de malheur, l’identification de l’Assyrie à l’instrument de la colère divine et le pluriel du suffixe de בְיָדָם (« leurs »). La note signale à juste titre la forme massorétique : nom « main » au singulier avec suffixe pluriel. Toutefois, מַטֶּה désigne normalement un bâton/une verge/un sceptre selon le contexte ; « gourdin » ajoute l’idée plus spécifique d’une massue et affaiblit le parallélisme volontaire avec שֵׁבֶט.'
  naturalness: « Malheur à l’Assyrie » et « c’est mon indignation » sont naturels et d’un registre prophétique moderne. « Le bâton dans leurs mains » est une formulation française claire, plus proche de l’image hébraïque que « entre leurs mains », qui peut évoquer une remise ou une médiation plutôt que l’instrument qu’ils tiennent.
  terminology: « Bâton » convient aux deux termes parallèles sans imposer une distinction lexicale que le contexte ne requiert pas. « Colère » et « indignation » rendent bien אַפִּי et זַעְמִי, en conservant l’intensification sans répétition mécanique.
