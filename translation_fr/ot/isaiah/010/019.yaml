  yaml_path: translation/ot/isaiah/010/019.yaml
  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
translation:
  language: fr
  text: Le reste des arbres de sa forêt sera si peu nombreux qu’un garçon pourra les noter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et un garçon les écrira ». Le terme hébreu peut aussi désigner un jeune homme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר
  choice: Ce qui restera
  rationale: שְׁאָר désigne ce qui subsiste. Cette formulation naturelle conserve ici l’image des arbres survivant à la destruction, sans donner au mot une valeur théologique technique.
- source_word: עֵץ יַעְרוֹ
  choice: des arbres de sa forêt
  rationale: עֵץ est morphologiquement singulier mais employé collectivement dans cette construction. Le suffixe masculin singulier de יַעְרוֹ est rendu par « sa ».
- source_word: מִסְפָּר יִהְיוּ
  choice: sera si peu nombreux
  rationale: 'Littéralement, ils « seront un nombre » : dans le contexte, l’expression indique qu’ils seront assez peu nombreux pour être comptés ou consignés.'
- source_word: נַעַר
  choice: un garçon
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un jeune serviteur. « Garçon » convient à l’image qui souligne combien le nombre restant sera faible.
- source_word: יִכְתְּבֵם
  choice: pourra les mettre par écrit
  rationale: La forme signifie littéralement « il les écrira ». Le contexte exprime la facilité rendue possible par leur petit nombre; « pourra » explicite cette portée, tandis que « mettre par écrit » garde l’image concrète de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’image forestière et l’idée d’un nombre si réduit qu’un jeune peut en dresser la liste.
