source:
  edition: WLC
  text: וּ/כְב֤וֹד יַעְר/וֹ֙ וְ/כַרְמִלּ֔/וֹ מִ/נֶּ֥פֶשׁ וְ/עַד בָּשָׂ֖ר יְכַלֶּ֑ה וְ/הָיָ֖ה כִּ/מְסֹ֥ס נֹסֵֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/018.yaml
  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
translation:
  language: fr
  text: Il consumera la splendeur de sa forêt et de sa terre fertile, de l’âme jusqu’à la chair, et ce sera comme le dépérissement d’un malade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et ce sera comme quelqu’un qui dépérit » ; la dernière expression hébraïque est difficile, et certains comprennent autrement son dernier mot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  choice: la splendeur
  rationale: כָּבוֹד désigne ici ce qui fait la magnificence et l’abondance des ressources de l’Assyrie. « Splendeur » restitue naturellement ce sens concret et figuré en français.
- source_word: יַעְרוֹ
  choice: sa forêt
  rationale: יַעַר signifie directement « forêt » ou « région boisée » et participe ici à l’image de la puissance nombreuse de l’Assyrie.
- source_word: וְכַרְמִלּוֹ
  choice: et de sa terre fertile
  rationale: כַּרְמֶל peut désigner une terre fertile, un verger ou une campagne cultivée. Le nom commun convient mieux ici que le toponyme Carmel, en parallèle avec « forêt ».
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  choice: de l’âme jusqu’à la chair
  rationale: La formulation conserve les deux termes concrets de l’hébreu et leur portée totalisante, sans réduire l’expression à un simple adverbe comme « entièrement ».
- source_word: יְכַלֶּה
  choice: Il consumera
  rationale: Le piel de כלה peut signifier achever, consumer ou détruire. « Consumera » s’accorde avec l’image du feu dans le contexte immédiat.
- source_word: וְהָיָה
  choice: et ce sera
  rationale: Le neutre « ce » renvoie naturellement en français à l’état résultant de la destruction de l’ensemble évoqué.
- source_word: כִּמְסֹס
  choice: comme lorsqu’un … dépérit
  rationale: La forme rare évoque probablement l’action de fondre, se dissoudre ou dépérir. Une proposition comparative rend la tournure naturelle en français.
- source_word: נֹסֵס
  choice: malade
  rationale: Le mot est difficile. L’interprétation traditionnelle et contextuelle y voit une personne qui décline sous l’effet de la maladie, mais d’autres analyses sont possibles; l’incertitude est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l’image hébraïque inhabituelle « de l’âme jusqu’à la chair » afin de préserver sa tension anthropologique et sa portée totalisante. Le pronom divin implicite dans יְכַלֶּה est rendu par « Il », conformément au contexte.
