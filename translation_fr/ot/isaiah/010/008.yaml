  text: For he says[b][a], “Are not my commanders all kings?”
translation:
  language: fr
  text: 'Car il dit : « Mes chefs[a] ne sont-ils pas tous[b] des rois ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes princes », « mes hauts fonctionnaires » ou « mes commandants »; le mot hébreu peut désigner divers types de dirigeants.
