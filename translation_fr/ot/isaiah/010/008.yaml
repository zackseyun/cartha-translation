lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de ce qui précède et conserve naturellement la valeur discursive de la conjonction.
- source_word: יֹאמַר
  choice: il dit
  rationale: Dans ce discours prophétique, l’imparfait hébreu présente naturellement la déclaration orgueilleuse du roi d’Assyrie comme actuelle.
- source_word: הֲלֹא
  choice: ne sont-ils pas
  rationale: Conserve la question rhétorique négative, qui appelle une réponse affirmative.
- source_word: שָׂרַי
  choice: mes chefs
  rationale: שַׂר peut désigner un prince, un dirigeant, un haut fonctionnaire ou un commandant. « Chefs » convient au contexte impérial et militaire tout en préservant l’étendue du terme.
- source_word: יַחְדָּו
  choice: tous
  rationale: Littéralement « ensemble »; ici, le mot souligne que chacun des chefs peut être assimilé à un roi.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le nom signifie directement « rois » et exprime la prétention selon laquelle les subordonnés du souverain assyrien ont eux-mêmes rang de rois.
