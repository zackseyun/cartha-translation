  text: ה֥וֹי הַ/חֹֽקְקִ֖ים חִקְקֵי אָ֑וֶן וּֽ/מְכַתְּבִ֥ים עָמָ֖ל כִּתֵּֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/001.yaml
  text: Woe to those who decree decrees of wickedness[a], and the writers who keep writing oppression[b],
translation:
  language: fr
  text: Malheur à ceux qui édictent des décrets injustes et à ceux qui rédigent des textes d’oppression,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Interjection prophétique annonçant le jugement; « Malheur à » est naturel, solennel et énergique en français.
- source_word: הַחֹקְקִים חִקְקֵי
  choice: ceux qui édictent des décrets
  rationale: Le verbe et le nom apparentés forment une répétition rhétorique. « Édictent des décrets » conserve le jeu étymologique et la portée juridique sans imposer un cadre législatif moderne.
- source_word: אָוֶן
  choice: injustes
  rationale: Dans ce contexte judiciaire, le terme qualifie les décrets de moralement mauvais et nuisibles; « injustes » exprime clairement leur corruption juridique.
- source_word: וּמְכַתְּבִים
  choice: et à ceux qui consignent
  rationale: Le participe désigne les personnes qui mettent les décisions par écrit. « Consignent » restitue cette activité sans supposer un office technique de scribe.
- source_word: עָמָל
  choice: des décisions oppressives
  rationale: Le mot peut évoquer peine, malheur ou injustice accablante. Dans le contexte légal, « oppressives » rend la charge imposée aux victimes; « décisions » est fourni par le parallélisme avec les décrets.
- source_word: כִּתֵּבוּ
  choice: sans cesse
  rationale: Le parfait intensif complète le participe et souligne l'activité persistante d'écriture; « sans cesse » évite une répétition française lourde tout en conservant l'insistance.
