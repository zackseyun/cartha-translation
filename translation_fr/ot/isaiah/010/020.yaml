source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: fr
  text: En ce jour-là, le reste d’Israël et les rescapés de la maison de Jacob ne continueront plus à s’appuyer sur celui qui les frappait, mais ils s’appuieront en vérité sur l’Éternel, le Saint d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאָר יִשְׂרָאֵל
  choice: le reste d’Israël
  rationale: Rend directement l’expression prophétique désignant la partie d’Israël qui subsiste.
- source_word: פְלֵיטַת בֵּית יַעֲקֹב
  choice: les rescapés de la maison de Jacob
  rationale: « Rescapés » exprime naturellement en français ceux qui ont échappé au désastre; le collectif hébreu est rendu au pluriel.
- source_word: לְהִשָּׁעֵן ... וְנִשְׁעַן
  choice: s’appuyer ... ils s’appuieront
  rationale: Conserve la répétition intentionnelle de la même racine hébraïque et le contraste entre l’ancien et le nouvel objet de confiance.
- source_word: מַכֵּהוּ
  choice: celui qui les frappait
  rationale: Le participe désigne l’oppresseur qui frappait le reste et les rescapés; l’imparfait français convient à cette action passée ou prolongée.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Forme française traditionnelle et intelligible employée pour représenter le tétragramme divin.
- source_word: בֶּאֱמֶת
  choice: en vérité
  rationale: 'Préserve la formulation concise et la portée potentiellement large du terme: sincérité, fidélité ou véritable confiance.'
theological_decisions:
- issue: Portée de בֶּאֱמֶת
  choice: en vérité
  alternative: avec fidélité / véritablement
  rationale: La traduction littérale maintient l’ambiguïté entre une confiance sincère et une confiance fidèle, sans imposer une seule interprétation.
- issue: Identité de « celui qui les frappait »
  choice: laisser le référent implicite
  alternative: préciser « l’Assyrie »
  rationale: Le verset ne nomme pas ici l’oppresseur; conserver l’implicite respecte le texte et son contexte sans ajouter une identification interprétative.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « s’appuyer » est conservée pour faire ressortir le renversement central du verset; « ne continueront plus » rend explicitement לֹא יוֹסִיף עוֹד.
