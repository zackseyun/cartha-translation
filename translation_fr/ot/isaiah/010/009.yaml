  yaml_path: translation/ot/isaiah/010/009.yaml
  text: Is not Calno like Carchemish? Is not Hamath like Arpad? Is not Samaria like Damascus?[a]
translation:
  language: fr
  text: Kalno n’est-elle pas comme Karkemish ? Hamath n’est-elle pas comme Arpad ? Samarie n’est-elle pas comme Damas ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kalno est aussi rendu par « Kalné » dans certaines traductions, selon une forme traditionnelle du nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא / אִם לֹא
  choice: n’est-elle pas
  rationale: Ces tournures introduisent ici des questions rhétoriques qui attendent une réponse affirmative. La formulation française conserve leur force et le parallélisme du verset.
- source_word: כְּ/כַרְכְּמִישׁ כַּלְנוֹ
  choice: Kalno comme Karkemish
  rationale: Le préfixe כְּ marque la comparaison. L’ordre français naturel place la ville comparée avant le terme de comparaison.
- source_word: כַּלְנוֹ
  choice: Kalno
  rationale: Translittération proche de la forme consonantique du texte hébreu ; « Kalné » est une forme traditionnelle variante.
- source_word: כַּרְכְּמִישׁ
  choice: Karkemish
  rationale: Translittération française courante du nom de lieu.
- source_word: כְ/אַרְפַּד חֲמָת
  choice: Hamath comme Arpad
  rationale: La comparaison hébraïque est rendue dans un ordre naturel en français, sans expliciter davantage la vantardise implicite.
- source_word: חֲמָת
  choice: Hamath
  rationale: Forme française courante du nom de lieu biblique.
- source_word: אַרְפַּד
  choice: Arpad
  rationale: Translittération française courante du nom de lieu.
- source_word: כְ/דַמֶּשֶׂק שֹׁמְרוֹן
  choice: Samarie comme Damas
  rationale: La formulation garde la troisième comparaison et son parallélisme rhétorique.
- source_word: דַּמֶּשֶׂק
  choice: Damas
  rationale: Nom français établi de la ville.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Nom français établi, désignant ici la capitale et pouvant évoquer par extension le royaume du Nord.
