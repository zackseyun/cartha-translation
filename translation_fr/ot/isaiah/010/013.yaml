  terminology: « Force de ma main », « sagesse », « intelligence », « frontières des peuples », « trésors » et « pille » sont fidèles et bien adaptés. La note sur le nom rare עתידות garde explicitement l’incertitude lexicale. La note finale préserve l’alternative contextuelle selon laquelle les habitants pourraient être des personnes en position d’autorité.
