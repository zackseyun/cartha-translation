  source_fidelity: 'Révision nécessaire : « j’ai agi » affaiblit le sens très général de עָשִׂיתִי, dont le complément peut être rendu naturellement par « cela ». Surtout, יוֹשְׁבִים signifie d’abord « les habitants / ceux qui demeurent »; « ceux qui siègent sur des trônes » restreint le référent à des dirigeants et ajoute « sur des trônes », absent de l’hébreu. La comparaison כַּאַבִּיר est conservée sans la transformer en interprétation institutionnelle.'
