source:
  edition: WLC
  text: כִּ֣י אָמַ֗ר בְּ/כֹ֤חַ יָדִ/י֙ עָשִׂ֔יתִי וּ/בְ/חָכְמָתִ֖/י כִּ֣י נְבֻנ֑וֹתִי וְ/אָסִ֣יר גְּבוּלֹ֣ת עַמִּ֗ים ו/עתידתי/הם שׁוֹשֵׂ֔תִי וְ/אוֹרִ֥יד כַּ/אבִּ֖יר יוֹשְׁבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
translation:
  language: fr
  text: 'Car il dit : « C’est par la force de ma main que j’ai fait cela, et par ma sagesse, car je suis doué d’intelligence. Je déplace les frontières des peuples, je pille leurs trésors[a] et, tel un puissant[b], j’abaisse les habitants[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs réserves », « leurs possessions » ou « leurs richesses accumulées ». Le terme hébreu est rare et désigne probablement des biens mis en réserve.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un être puissant ». Le terme hébreu souligne avant tout la force.
    reason: lexical_alternative
  - marker: c
    text: Ou « ceux qui sont assis » ou « ceux qui siègent ». Le participe hébreu désigne habituellement des habitants, mais, dans ce contexte, il peut aussi évoquer des personnes établies au pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַר
  choice: Car il dit
  rationale: כִּי introduit ici la raison de l’évaluation précédente, et le présent « il dit » rend la prétention caractéristique du roi avec vivacité, malgré la forme accomplie de אָמַר.
- source_word: בְּכֹחַ יָדִי
  choice: par la force de ma main
  rationale: La formulation conserve l’image concrète de la « main » comme expression de la puissance militaire personnelle.
- source_word: עָשִׂיתִי
  choice: j’ai agi
  rationale: Le verbe עשה est très général. « J’ai agi » reste concis et évite d’ajouter un complément explicite absent de l’hébreu.
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  choice: et par ma sagesse, car je suis doué d’intelligence
  rationale: « Sagesse » garde la portée stratégique de חָכְמָה, tandis que la seconde proposition exprime naturellement en français la faculté de discernement revendiquée par le locuteur.
- source_word: וְאָסִיר גְּבוּלֹת עַמִּים
  choice: Je déplace les frontières des peuples
  rationale: Le hiphil de סור signifie faire disparaître, écarter ou déplacer. Dans un contexte de conquête, « déplacer les frontières » évoque clairement le redécoupage territorial sans introduire l’idée moderne d’États-nations.
- source_word: וַעֲתִידֹתֵיהֶם
  choice: leurs trésors
  rationale: Ce nom rare semble désigner ce qui a été préparé ou mis en réserve, donc des richesses accumulées. « Trésors » convient au contexte de pillage, tout en nécessitant une note sur l’incertitude lexicale.
- source_word: שׁוֹשֵׂתִי
  choice: je pille
  rationale: Le verbe exprime directement l’action de dépouiller ou de prendre du butin; « piller » est courant, précis et adapté au registre militaire.
- source_word: וְאוֹרִיד
  choice: j’abaisse
  rationale: Le hiphil de ירד signifie « faire descendre ». « J’abaisse » conserve le mouvement métaphorique et exprime l’humiliation des puissants.
- source_word: כַּאַבִּיר
  choice: tel un puissant
  rationale: אַבִּיר désigne un être fort ou puissant. « Tel un puissant » garde la comparaison sans préciser plus que l’hébreu s’il s’agit d’un guerrier, d’un chef ou d’une autre figure de force.
- source_word: יוֹשְׁבִים
  choice: ceux qui siègent sur des trônes
  rationale: ישׁב peut signifier habiter ou être assis. Dans le contraste avec « abaisser » et dans ce contexte de domination impériale, l’idée de personnes établies au pouvoir est probable; la note conserve toutefois le sens plus général possible.
theological_decisions:
- issue: Identité du locuteur qui se glorifie
  choice: Le singulier est conservé et présente la parole orgueilleuse du roi d’Assyrie.
  alternative: L’Assyrie entière peut être personnifiée et parler collectivement.
  rationale: Le contexte immédiat vise le cœur orgueilleux du roi d’Assyrie tout en traitant aussi l’Assyrie comme puissance collective. Le texte français maintient le singulier hébreu sans exclure cette dimension représentative.
- issue: Statut de ceux qui sont abaissés
  choice: La traduction contextuelle « ceux qui siègent sur des trônes » suggère des détenteurs du pouvoir.
  alternative: Le participe peut désigner plus largement « les habitants » ou « ceux qui demeurent » dans les territoires conquis.
  rationale: L’opposition entre siéger en position élevée et être abaissé convient à la vantardise du conquérant, mais cette interprétation n’est pas imposée comme seule possibilité grâce à la note.
translation_notes:
  register: Français international moderne, clair et digne. La tournure emphatique « C’est par… que » fait ressortir l’autoglorification. Après le premier accompli (« j’ai agi »), les présents rendent la prétention comme une description vive et caractéristique des conquêtes du locuteur. Les termes institutionnels modernes ont été évités.
