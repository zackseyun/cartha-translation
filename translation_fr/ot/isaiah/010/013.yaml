- from: 'Car il dit : « C’est par la force de ma main que j’ai agi, et par ma sagesse, car je suis doué d’intelligence. Je déplace les frontières des peuples, je pille leurs trésors[a] et, tel un puissant[b], j’abaisse ceux qui siègent sur des trônes[c]. »'
