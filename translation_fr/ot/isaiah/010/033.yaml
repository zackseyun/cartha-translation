source:
  edition: WLC
  text: הִנֵּ֤ה הָ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת מְסָעֵ֥ף פֻּארָ֖ה בְּ/מַעֲרָצָ֑ה וְ/רָמֵ֤י הַ/קּוֹמָה֙ גְּדוּעִ֔ים וְ/הַ/גְּבֹהִ֖ים יִשְׁפָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
translation:
  language: fr
  text: Voici, le Seigneur, Yahweh des armées, coupe la ramure avec une force terrifiante[a] ; ceux qui sont grands de taille sont abattus[b], et ceux qui sont élevés seront abaissés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à grand fracas », « avec violence » ou « en inspirant la terreur » ; le terme hébreu évoque une force violente et redoutable.
    reason: lexical_alternative
  - marker: b
    text: L’image est celle de branches coupées et de grands arbres abattus ; elle évoque aussi l’abaissement de ceux qui sont élevés.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette particule attire vivement l’attention et introduit l’intervention divine dans un registre prophétique digne, sans archaïsme excessif.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: le Seigneur, Yahweh des armées
  rationale: « Le Seigneur » rend le titre défini אָדוֹן, tandis que « Yahweh » représente distinctement le nom divin יְהוָה. « Des armées » traduit צְבָאוֹת de manière transparente.
- source_word: מְסָעֵף
  choice: coupe
  rationale: Le participe présente l’action comme vive et imminente. Avec « la ramure », « coupe » exprime naturellement l’action d’enlever les branches sans lui donner la nuance bienveillante que pourrait suggérer « taille ».
- source_word: פֻּארָה
  choice: la ramure
  rationale: Le nom désigne l’ensemble développé des branches ou du feuillage. « Ramure » conserve clairement l’image de l’arbre et le caractère collectif du singulier hébreu.
- source_word: בְמַעֲרָצָה
  choice: avec une force terrifiante
  rationale: L’expression évoque une puissance violente qui inspire l’effroi. La note conserve les autres nuances possibles, notamment le fracas et la violence.
- source_word: רָמֵי הַקּוֹמָה
  choice: ceux qui sont grands par la taille
  rationale: La formulation garde l’image concrète de la hauteur tout en permettant son application métaphorique aux personnages élevés ou orgueilleux.
- source_word: גְּדוּעִים
  choice: sont abattus
  rationale: Le participe passif décrit le résultat d’une coupe. « Abattus » convient aux arbres tout en laissant percevoir le jugement porté contre les puissants.
- source_word: הַגְּבֹהִים יִשְׁפָּלוּ
  choice: ceux qui sont élevés seront abaissés
  rationale: Cette formulation préserve l’opposition spatiale entre hauteur et abaissement ainsi que sa portée figurée, sans expliciter indûment l’orgueil.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte associe le titre « le Seigneur » au nom propre divin. « Yahweh » maintient cette distinction et représente directement le tétragramme.
- issue: Rapport entre l’image des arbres et le jugement des personnes élevées
  choice: Conserver l’image de la coupe et le vocabulaire de la hauteur
  alternative: Paraphraser explicitement comme le jugement des orgueilleux ou des dirigeants
  rationale: L’hébreu superpose l’abattage d’une haute végétation et l’abaissement des êtres élevés. La traduction préserve cette tension métaphorique au lieu de désigner explicitement une seule catégorie humaine.
translation_notes:
  register: Français international moderne, sobre et prophétique. « Voici » et « ramure » soutiennent la dignité du passage, tandis que la syntaxe reste immédiatement compréhensible. Le présent rend l’action participiale vivement présente, puis le futur traduit l’issue annoncée par יִשְׁפָּלוּ.
