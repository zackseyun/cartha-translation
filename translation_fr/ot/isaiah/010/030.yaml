id: ISA.10.30
reference: Isaiah 10:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: צַהֲלִ֥י קוֹלֵ֖/ךְ בַּת גַּלִּ֑ים הַקְשִׁ֥יבִי לַ֖יְשָׁה עֲנִיָּ֥ה עֲנָתֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/030.yaml
  text: Cry aloud[a], daughter of Gallim! Listen[c][b], Laishah! O poor Anathoth!
translation:
  language: fr
  text: Fais retentir ta voix[a], fille de Gallim[b] ! Écoute, Laïsha ! Malheureuse Anatoth[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pousse un cri aigu ». Le verbe hébreu peut désigner un cri perçant ou retentissant.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « fille de Gallim » : manière imagée de s’adresser à la ville ou à ses habitants comme à une personne.'
    reason: cultural_note
  - marker: c
    text: Ou « Anatoth affligée » ou « pauvre Anatoth ». L’adjectif hébreu peut exprimer la pauvreté, la misère ou l’oppression.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַהֲלִי קוֹלֵךְ
  choice: Fais retentir ta voix
  rationale: L’impératif de צהל évoque un cri aigu ou sonore, et קוֹלֵךְ signifie littéralement « ta voix ». Cette formulation française conserve à la fois la force audible du cri et l’image concrète de la voix, sans préciser indûment s’il s’agit d’un cri de joie ou d’alarme.
- source_word: בַּת גַּלִּים
  choice: fille de Gallim
  rationale: La formule prophétique personnifie la ville ou ses habitants sous les traits d’une fille. La traduction conserve cette métaphore et le nom du lieu.
- source_word: הַקְשִׁיבִי
  choice: Écoute
  rationale: Cet impératif féminin singulier de קשׁב appelle à prêter une attention auditive. « Écoute » est direct, naturel et fidèle.
- source_word: לַיְשָׁה
  choice: Laïsha
  rationale: Le terme est compris comme un nom de lieu. La translittération « Laïsha » représente la forme hébraïque présente ici tout en indiquant naturellement en français que les voyelles se prononcent séparément.
- source_word: עֲנִיָּה
  choice: Malheureuse
  rationale: L’adjectif peut désigner ce qui est pauvre, affligé, misérable ou opprimé. Dans cette apostrophe à une ville menacée, « malheureuse » exprime sa détresse sans imposer la seule idée de pauvreté matérielle.
- source_word: עֲנָתוֹת
  choice: Anatoth
  rationale: Nom de lieu translittéré selon sa forme française courante. Il est pris comme le nom auquel se rapporte l’adjectif féminin עֲנִיָּה.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs féminins et la personnification des villes sont conservés. La ponctuation maintient trois apostrophes successives et le rythme pressant de l’hébreu.
