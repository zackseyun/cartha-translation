source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר יִשְׂרָאֵל֙ לְ/אֵ֔שׁ וּ/קְדוֹשׁ֖/וֹ לְ/לֶהָבָ֑ה וּ/בָעֲרָ֗ה וְ/אָֽכְלָ֛ה שִׁית֥/וֹ וּ/שְׁמִיר֖/וֹ בְּ/י֥וֹם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
translation:
  language: fr
  text: La lumière d’Israël deviendra un feu[a], et son Saint, une flamme[b] ; elle brûlera et consumera ses broussailles épineuses et ses ronces[c] en un seul jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera un feu » ; la construction hébraïque peut être rendue plus formellement ainsi, mais elle exprime probablement ici l’idée de devenir.
    reason: lexical_alternative
  - marker: b
    text: « Son Saint » est vraisemblablement un titre divin désignant le SEIGNEUR, selon un thème fréquent dans le livre d’Ésaïe.
    reason: cross_reference
  - marker: c
    text: Les deux mots hébreux désignent une végétation épineuse. Le premier est relativement rare et peut aussi s’entendre plus largement de broussailles ou de sous-bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: deviendra
  rationale: Avec לְ, le verbe היה exprime ici naturellement l’entrée dans un nouvel état ; « deviendra » rend cette dynamique tout en laissant en note la possibilité plus formelle « sera ».
- source_word: אוֹר יִשְׂרָאֵל
  choice: la lumière d’Israël
  rationale: Rend directement le groupe construit et conserve la métaphore sans en expliciter le référent dans le corps du texte.
- source_word: לְאֵשׁ
  choice: un feu
  rationale: Après היה, לְ indique l’état résultant ; l’article indéfini est naturel en français.
- source_word: וּקְדוֹשׁוֹ
  choice: son Saint
  rationale: La majuscule signale l’emploi probable comme titre divin, fréquent chez Ésaïe, sans remplacer l’expression poétique par une identification explicite.
- source_word: לְלֶהָבָה
  choice: une flamme
  rationale: Traduction directe qui maintient le parallélisme poétique avec « un feu ».
- source_word: וּבָעֲרָה
  choice: elle brûlera
  rationale: Le féminin singulier reprend naturellement « la flamme » en français ; dans cette séquence prophétique, la forme verbale a une valeur future.
- source_word: וְאָכְלָה
  choice: et consumera
  rationale: אכל décrit couramment l’action destructrice du feu ; « consumer » est idiomatique et vigoureux en français.
- source_word: שִׁיתוֹ
  choice: ses broussailles épineuses
  rationale: Le terme rare désigne vraisemblablement une végétation épineuse ou des broussailles ; cette traduction conserve cette incertitude mieux que le seul mot « épines ».
- source_word: וּשְׁמִירוֹ
  choice: ses ronces
  rationale: Rend le second terme de végétation épineuse par un mot distinct et courant, en préservant le parallélisme.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: Formulation française naturelle qui souligne la soudaineté et l’ampleur de la destruction.
theological_decisions:
- issue: Référent de « la lumière d’Israël » et de « son Saint »
  choice: Conserver la métaphore et le titre sans identifier explicitement leur référent dans le texte principal.
  alternative: Traduire ou gloser ces expressions comme une référence directe au SEIGNEUR, lumière et Saint d’Israël.
  rationale: Le contexte d’Ésaïe indique fortement un référent divin, mais le verset lui-même emploie un langage poétique. La traduction préserve donc la force théologique et la tension du texte sans ajouter une interprétation explicite.
- issue: Référent grammatical de « elle brûlera »
  choice: Faire reprendre le pronom implicite par « la flamme », féminin en français.
  alternative: Employer « il brûlera » en le rapportant au feu, ou répéter « ce feu » pour neutraliser la question.
  rationale: Le verbe hébreu est au féminin singulier, vraisemblablement en accord avec לֶהָבָה, « flamme ». Le français permet de conserver naturellement cet accord.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme poétique hébreu. « Son Saint » maintient le titre inhabituel mais intelligible ; « broussailles épineuses et ronces » exprime les deux termes proches sans les confondre.
