  text: כַּ/אֲשֶׁר֙ מָצְאָ֣ה יָדִ֔/י לְ/מַמְלְכֹ֖ת הָ/אֱלִ֑יל וּ/פְסִ֣ילֵי/הֶ֔ם מִ/ירֽוּשָׁלִַ֖ם וּ/מִ/שֹּׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/010.yaml
  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
translation:
  language: fr
  text: Comme ma main a atteint les royaumes des idoles[a], dont les images sculptées surpassaient celles de Jérusalem et de Samarie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Comme ma main a trouvé les royaumes des idoles, et leurs images sculptées, de Jérusalem et de Samarie. » L’hébreu est elliptique ; dans le contexte, la tournure exprime vraisemblablement une comparaison : leurs images étaient supérieures à celles de Jérusalem et de Samarie.'
    reason: Signaler la formulation proche de l’hébreu et son ellipse, tout en expliquant sans la masquer le sens comparatif retenu dans le texte.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Comme
  rationale: Introduit la comparaison qui se poursuit au verset suivant et convient au ton de la vantardise assyrienne.
- source_word: מָצְאָה יָדִי
  choice: ma main a atteint
  rationale: Littéralement « ma main a trouvé » ; dans ce contexte de conquête, l’expression évoque une puissance qui parvient jusqu’à ces royaumes et s’en rend maîtresse, sans supprimer la métaphore de la main.
- source_word: לְמַמְלְכֹת הָאֱלִיל
  choice: les royaumes des idoles
  rationale: La préposition est régie par l’expression verbale. « Idoles » rend clairement אֱלִיל, terme qui comporte ici une nuance péjorative de vanité ou d’inconsistance.
- source_word: וּפְסִילֵיהֶם
  choice: dont les statues sculptées
  rationale: פְסִיל désigne une représentation taillée. La tournure possessive française explicite naturellement que ces statues appartiennent aux royaumes mentionnés.
- source_word: מִירוּשָׁלִַם וּמִשֹּׁמְרוֹן
  choice: surpassaient celles de Jérusalem et de Samarie
  rationale: Le מִן porte ici un sens comparatif dans une construction hébraïque elliptique. « Celles de » restitue le terme sous-entendu sans ajouter de nouveau référent.
theological_decisions:
- issue: Faut-il expliciter la comparaison elliptique de la fin du verset ?
  choice: « dont les statues sculptées surpassaient celles de Jérusalem et de Samarie »
  alternative: « et leurs statues sculptées, [celles] de Jérusalem et de Samarie » ou, plus littéralement, « venant de Jérusalem et de Samarie »
  rationale: Le contexte et l’emploi comparatif de מִן indiquent que le roi d’Assyrie prétend avoir vaincu des royaumes dont les images étaient plus imposantes que celles de Jérusalem et de Samarie. La traduction explicite ce rapport tout en signalant l’ellipse dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule parce que la comparaison se poursuit au verset 11. « Statues sculptées » est plus courant aujourd’hui que « images taillées » ou « images gravées ».
