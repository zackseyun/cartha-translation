  text: בָּ֥א עַל עַיַּ֖ת עָבַ֣ר בְּ/מִגְר֑וֹן לְ/מִכְמָ֖שׂ יַפְקִ֥יד כֵּלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/028.yaml
  text: He has come against Aiath; he has passed through Migron. At Michmash he stores his baggage.
translation:
  language: fr
  text: Il est venu contre Ayath, il a traversé Migron ; à Mikmas, il dépose ses bagages.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא עַל
  choice: est arrivé contre
  rationale: La préposition עַל peut signaler ici un mouvement hostile contre une ville ; « contre » préserve le contexte de progression militaire sans surinterpréter l’action précise.
- source_word: עָבַר בְּמִגְרוֹן
  choice: a traversé Migron
  rationale: עָבַר exprime le passage ; en français, « traverser » rend naturellement la construction avec le lieu.
- source_word: יַפְקִיד
  choice: dépose
  rationale: Le verbe peut signifier confier, remettre ou déposer. Dans ce contexte logistique militaire, « dépose » reste naturel et n’impose pas nécessairement un entreposage durable.
- source_word: כֵּלָיו
  choice: son matériel
  rationale: כְּלִי est collectif et peut désigner équipements, objets ou bagages. « matériel » convient au contexte militaire tout en gardant une portée assez large.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les toponymes sont translittérés sous les formes Ayath, Migron et Mikmas. Le parfait initial et le parfait suivant sont rendus au passé composé, tandis que l’imparfait יַפְקִיד est conservé au présent pour reproduire la vivacité de l’itinéraire prophétique.
