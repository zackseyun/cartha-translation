  text: בִּלְתִּ֤י כָרַע֙ תַּ֣חַת אַסִּ֔יר וְ/תַ֥חַת הֲרוּגִ֖ים יִפֹּ֑לוּ בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
translation:
  language: fr
  text: Il ne reste qu’à se courber parmi les prisonniers ou à tomber parmi les tués. Malgré tout cela, sa colère ne s’est pas détournée[a], et sa main reste étendue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sinon, ils se courbent sous les prisonniers, et ils tombent sous les tués. » L’hébreu est très condensé, et le rapport exact entre les verbes et les prépositions est discuté.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְתִּי
  choice: Il ne reste qu’à
  rationale: Dans cette proposition très condensée, le terme introduit l’unique issue encore possible. Cette tournure française rend naturellement l’ellipse hébraïque sans ajouter de contenu.
- source_word: כָרַע
  choice: s’accroupir
  rationale: Le verbe exprime le fait de se courber ou de s’abaisser. Ici, « s’accroupir » évoque l’abaissement imposé par la captivité sans suggérer un geste cultuel.
- source_word: תַּחַת
  choice: parmi
  rationale: Bien que le sens spatial premier soit « sous », le contexte permet de comprendre l’intégration au nombre des prisonniers et des tués. « Parmi » donne en français un sens clair tout en conservant le parallélisme.
- source_word: אַסִּיר
  choice: les prisonniers
  rationale: Le nom désigne une personne captive ou liée. Le pluriel français exprime naturellement sa valeur collective dans ce contexte.
- source_word: הֲרוּגִים
  choice: les tués
  rationale: Le participe désigne ceux qui ont été mis à mort, et non les morts en général. « Les tués » conserve cette précision avec un langage courant.
- source_word: יִפֹּלוּ
  choice: à tomber
  rationale: La forme hébraïque est finie, « ils tomberont », mais la construction française à l’infinitif maintient le parallélisme avec « s’accroupir » et rend l’ellipse de façon intelligible. L’autre analyse est signalée en note.
- source_word: בְּכָל זֹאת
  choice: Malgré tout cela
  rationale: La locution marque ici que les jugements déjà décrits n’ont pas épuisé la colère divine. « Malgré tout cela » exprime clairement ce rapport concessif et conserve la force du refrain.
- source_word: לֹא שָׁב אַפּוֹ
  choice: sa colère ne s’est pas détournée
  rationale: אַף signifie idiomatiquement « colère », tandis que שׁוב indique qu’elle ne s’est pas retirée. La formulation conserve l’image hébraïque plutôt que de la réduire à une abstraction.
- source_word: יָדוֹ נְטוּיָה
  choice: sa main est encore étendue
  rationale: Cette image récurrente chez Ésaïe présente l’action de jugement comme toujours en cours. La traduction garde l’anthropomorphisme et la valeur continue marquée par « encore ».
theological_decisions:
- issue: Langage anthropomorphique du jugement divin
  choice: Conserver « sa colère » et « sa main est encore étendue ».
  alternative: Paraphraser par « son jugement continue ».
  rationale: L’hébreu emploie volontairement des images corporelles pour exprimer la persistance du jugement divin. Les maintenir préserve la force poétique et la tension théologique du texte.
- issue: Relation syntaxique dans la première moitié du verset
  choice: 'Comprendre deux issues parallèles : s’accroupir parmi les prisonniers ou tomber parmi les tués.'
  alternative: « Sinon se courber sous les prisonniers, et ils tomberont sous les tués. »
  rationale: L’hébreu est exceptionnellement condensé. La lecture retenue produit un parallélisme cohérent sans effacer l’autre analyse possible, laquelle est donnée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste accessible tout en conservant le refrain poétique, les images anthropomorphiques et l’ambiguïté syntaxique réelle grâce à la note.
