  register: Français international moderne, poétique mais direct. Les phrases brèves conservent le rythme rapide de l’itinéraire militaire. « Guéba sera notre étape pour la nuit » est compris comme la parole implicite des envahisseurs, signalée en hébreu par « pour nous ».
