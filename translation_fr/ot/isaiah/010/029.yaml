base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/029.yaml
  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
translation:
  language: fr
  text: Ils ont franchi le passage[a]. Guéba est notre halte pour la nuit. Rama tremble ; Guibéa de Saül a pris la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le défilé » ou « le gué ». Le mot hébreu peut désigner de manière générale un endroit où l’on traverse ; dans ce contexte d’avancée militaire, « le passage » préserve cette portée assez large.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְרוּ
  choice: Ils ont franchi
  rationale: Le qal accompli, 3e personne du pluriel, décrit l’avancée déjà réalisée des envahisseurs. Le passé composé convient au compte rendu vif, et « franchir » exprime naturellement le passage d’un obstacle ou d’un défilé.
- source_word: מַעְבָּרָה
  choice: le passage
  rationale: 'Le nom désigne un lieu où l’on passe : passage, défilé ou gué. « Le passage » conserve cette latitude sans imposer la présence d’un cours d’eau.'
- source_word: גֶּבַע
  choice: Guéba
  rationale: Translittération française usuelle du nom de lieu.
- source_word: מָלוֹן לָנוּ
  choice: sera notre étape pour la nuit
  rationale: מָלוֹן désigne un lieu où passer la nuit, et לָנוּ signifie littéralement « pour nous ». Dans ce discours direct implicite des envahisseurs, le futur français rend naturellement leur choix de Guéba comme prochain bivouac.
- source_word: חָרְדָה
  choice: tremble
  rationale: Le qal accompli féminin singulier peut décrire le saisissement ou l’effroi. Le présent donne au tableau poétique sa vivacité tout en gardant l’image concrète du tremblement.
- source_word: הָרָמָה
  choice: Rama
  rationale: Translittération française usuelle du nom de lieu, l’article hébreu faisant partie de la forme contextuelle et n’étant pas rendu séparément.
- source_word: גִּבְעַת שָׁאוּל
  choice: Guibéa de Saül
  rationale: La chaîne construite désigne la ville associée à Saül. Cette formulation française préserve la structure et distingue naturellement Guibéa de Guéba.
- source_word: נָסָה
  choice: a pris la fuite
  rationale: Le qal accompli féminin singulier signifie « fuir ». Le passé composé marque le résultat actuel de la panique provoquée par l’avancée ennemie.
