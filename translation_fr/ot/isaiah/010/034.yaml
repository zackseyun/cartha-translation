  naturalness: « Les fourrés de la forêt seront abattus avec le fer » est un français moderne, clair et poétique. « Le Liban tombera par un puissant » est légèrement soutenu, mais naturel dans le registre prophétique et rend sans ajout le rapport agentif ou instrumental possible.
  terminology: « Fourrés », « forêt », « fer », « Liban » et « puissant » sont appropriés. La minuscule à « puissant » maintient l’ambiguïté de אַדִּיר; la note indique sans l’imposer la lecture comme titre divin.
