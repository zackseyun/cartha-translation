    rationale: Le mot « coups » n’est pas présent dans le texte hébreu; « par un puissant » préserve mieux la concision et l’ambiguïté de la préposition ב.
  revised_text: Les fourrés de la forêt seront abattus avec le fer, et le Liban tombera par un puissant[a].
