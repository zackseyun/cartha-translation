  text: וְ/נִקַּ֛ף סִֽבְכֵ֥י הַ/יַּ֖עַר בַּ/בַּרְזֶ֑ל וְ/הַ/לְּבָנ֖וֹן בְּ/אַדִּ֥יר יִפּֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
translation:
  language: fr
  text: Les fourrés de la forêt seront abattus avec le fer, et le Liban tombera par un puissant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Liban tombera par le Puissant », si « Puissant » est compris comme un titre désignant Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקַּף
  choice: Il abattra
  rationale: Le nifal de נקף décrit ici l’abattage de la végétation. La tournure active impersonnelle française rend naturellement l’action sans préciser un agent que l’hébreu ne nomme pas.
- source_word: סִבְכֵי הַיַּעַר
  choice: les fourrés de la forêt
  rationale: סבך évoque une végétation dense et enchevêtrée; « fourrés » conserve cette image tout en restant clair en français moderne.
- source_word: בַּבַּרְזֶל
  choice: au fer
  rationale: Littéralement « avec/par le fer »; « au fer » garde la métonymie de l’hébreu sans ajouter explicitement une hache.
- source_word: וְהַלְּבָנוֹן
  choice: et le Liban
  rationale: Le nom est conservé sans explicitation afin de préserver à la fois la référence géographique, l’imagerie forestière et sa portée symbolique.
- source_word: בְּאַדִּיר
  choice: sous les coups d’un puissant
  rationale: La préposition ב est comprise comme indiquant l’agent ou le moyen. Cette formulation exprime la causalité tout en conservant l’indétermination de אַדִּיר.
- source_word: יִפּוֹל
  choice: tombera
  rationale: « Tombera » rend directement נפל et maintient la force poétique de l’image, sans expliciter « sera abattu ».
theological_decisions:
- issue: Faut-il comprendre אַדִּיר comme un titre divin explicite ?
  choice: un puissant
  alternative: le Puissant
  rationale: Le contexte peut désigner Dieu comme l’auteur du jugement, mais l’expression hébraïque ne contient ni nom divin ni marque imposant sans ambiguïté un titre. Le texte principal maintient donc l’ambiguïté, et la note signale la lecture divine possible.
translation_notes:
  register: Français international moderne, poétique et digne. « Au fer » conserve l’image concise de l’original; « sous les coups » rend idiomatiquement la valeur agentive ou instrumentale de la préposition sans identifier davantage l’agent.
