  text: נָדְדָ֖ה מַדְמֵנָ֑ה יֹשְׁבֵ֥י הַ/גֵּבִ֖ים הֵעִֽיזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/031.yaml
  text: Madmenah has fled[a]; the inhabitants of Gebim have sought refuge.
translation:
  language: fr
  text: Madména a pris la fuite ; les habitants de Guébim ont cherché refuge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « se sont mis à l’abri » ou « se sont enfuis pour se mettre en sécurité ». Le verbe hébreu est difficile et peut évoquer une action précipitée pour se protéger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדְדָה
  choice: a pris la fuite
  rationale: Le qal accompli, dont le sujet est le nom de lieu féminin Madména, peut exprimer l’errance ou la fuite. Dans le contexte de l’avancée militaire et de la panique des villes, « a pris la fuite » rend naturellement la personnification et le sens contextuel.
- source_word: מַדְמֵנָה
  choice: Madména
  rationale: Nom de lieu translittéré en français, avec des accents facilitant une prononciation naturelle.
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe construit de ישב est employé comme substantif collectif ; « les habitants de » est clair, idiomatique et fidèle.
- source_word: הַגֵּבִים
  choice: Guébim
  rationale: Nom de lieu translittéré selon les usages phonétiques du français. L’article hébreu n’est pas reproduit séparément, puisqu’il paraît faire partie de l’usage local du toponyme.
- source_word: הֵעִיזוּ
  choice: ont cherché refuge
  rationale: La forme hiphil accomplie est difficile ici. Dans cette scène de panique militaire, elle évoque vraisemblablement une action précipitée visant à se protéger. « Ont cherché refuge » conserve le mouvement vers la sécurité sans imposer un sens littéral incertain tel que « se montrer forts ».
