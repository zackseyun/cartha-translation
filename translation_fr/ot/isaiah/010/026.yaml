revisions:
- from: Alors Yahweh des armées brandira contre lui un fouet[a], comme lorsqu’il frappa Madian au rocher d’Oreb[b]. Son bâton sera étendu au-dessus de la mer, et il le lèvera comme il l’a fait en Égypte[c].
  to: Alors Yahweh des armées suscitera contre lui un fouet[a], comme lorsqu’il frappa Madian au rocher d’Oreb[b] ; son bâton sera au-dessus de la mer, et il le lèvera comme en Égypte[c].
  rationale: La révision corrige les deux ajouts de sens principaux (« brandira » et « sera étendu »), tout en préservant l’ambiguïté des pronoms hébreux dans la seconde moitié du verset. Elle maintient les allusions à Madian et à l’Exode sans les imposer davantage dans le texte traduit.
