id: ISA.10.26
reference: Isaiah 10:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
translation:
  language: fr
  text: Alors Yahweh des armées suscitera contre lui un fouet[a], comme lorsqu’il frappa Madian au rocher d’Oreb[b] ; son bâton sera au-dessus de la mer, et il le lèvera comme en Égypte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fera surgir contre lui un fouet ». Le terme hébreu évoque le fait de susciter ou de faire se lever un instrument de châtiment.'
    reason: lexical_alternative
  - marker: b
    text: Le « rocher d’Oreb » rappelle Juges 7.25, où Oreb, un chef madianite, fut tué.
    reason: cross_reference
  - marker: c
    text: 'Littéralement : « selon la voie de l’Égypte ». Cette expression évoque probablement la manière dont Yahweh agit lors de l’Exode, lorsque le bâton fut levé au-dessus de la mer.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹרֵר
  choice: brandira
  rationale: Le hiphil de עור exprime ici le fait de susciter ou de mettre en mouvement l’instrument du jugement. « Brandira » rend naturellement en français l’image concrète du fouet, sans ajouter un nouveau sujet.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » conserve le nom divin; « des armées » rend צְבָאוֹת dans un français actuel et évoque les forces placées sous son commandement.
- source_word: שׁוֹט
  choice: un fouet
  rationale: Le nom désigne un instrument servant à frapper. « Fouet » est concret, courant et maintient la métaphore du châtiment.
- source_word: כְּמַכַּת מִדְיָן
  choice: comme lorsqu’il frappa Madian
  rationale: Cette formulation française naturelle conserve la force verbale de מַכָּה et la comparaison avec l’intervention historique contre Madian, sans introduire l’idée plus précise d’un massacre.
- source_word: בְּצוּר עוֹרֵב
  choice: au rocher d’Oreb
  rationale: La formulation conserve le nom du lieu et l’allusion à Juges 7.25.
- source_word: וּמַטֵּהוּ עַל הַיָּם
  choice: Son bâton sera étendu au-dessus de la mer
  rationale: « Bâton » convient à l’écho de l’Exode. « Sera étendu » explicite sobrement la relation spatiale exprimée par עַל et prépare le verbe « lèvera », tout en maintenant le référent pronominal dans le texte.
- source_word: וּנְשָׂאוֹ
  choice: et il le lèvera
  rationale: נשׂא signifie lever ou élever; le pronom reprend naturellement le bâton sans préciser davantage l’identité du possesseur.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: comme il l’a fait en Égypte
  rationale: L’expression indique vraisemblablement la manière d’agir associée à l’Exode plutôt qu’une route géographique. La traduction restitue idiomatiquement cette comparaison en français.
theological_decisions:
- issue: Référent des suffixes dans la seconde moitié du verset
  choice: Le texte français présente le bâton comme appartenant vraisemblablement à Yahweh, qui le lève dans une action rappelant l’Exode.
  alternative: Les suffixes peuvent être rapportés au bâton de l’Assyrien, retourné contre lui.
  rationale: L’association de la mer et de l’Égypte favorise le rappel de l’action divine lors de l’Exode. La traduction conserve néanmoins les pronoms du texte et n’ajoute aucune identification explicative.
- issue: Portée des allusions historiques
  choice: Conserver conjointement les rappels de la victoire sur Madian et de l’Exode.
  alternative: Lire les expressions comme de simples comparaisons générales, sans allusions historiques précises.
  rationale: Le rocher d’Oreb renvoie clairement à Juges 7.25, tandis que le bâton levé au-dessus de la mer et l’Égypte évoquent la traversée de la mer.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique en deux évocations historiques est conservée; les formulations trop littérales et peu naturelles ont été évitées, sans effacer l’ambiguïté des pronoms hébreux.
