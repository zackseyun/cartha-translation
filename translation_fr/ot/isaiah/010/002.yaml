source:
  edition: WLC
  text: לְ/הַטּ֤וֹת מִ/דִּין֙ דַּלִּ֔ים וְ/לִ/גְזֹ֕ל מִשְׁפַּ֖ט עֲנִיֵּ֣י עַמִּ֑/י לִ/הְי֤וֹת אַלְמָנוֹת֙ שְׁלָלָ֔/ם וְ/אֶת יְתוֹמִ֖ים יָבֹֽזּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
translation:
  language: fr
  text: pour refuser justice aux pauvres[a] et priver les démunis de mon peuple de leur droit, afin que les veuves deviennent leur butin et qu’ils dépouillent les orphelins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les faibles ». Le terme hébreu peut désigner les personnes pauvres, faibles ou démunies.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui sont privés de père ».
    reason: lexical_precision
lexical_decisions:
- source_word: לְהַטּוֹת מִדִּין
  choice: écarter ... de la justice
  rationale: Le hiphil de נטה exprime ici l’action de détourner ou d’écarter quelqu’un du droit qui devrait lui être rendu. Cette formulation conserve l’image sans expliciter davantage par « pervertir ».
- source_word: דַּלִּים
  choice: les faibles
  rationale: דַּל désigne les personnes pauvres, faibles ou socialement démunies. « Les faibles » préserve cette amplitude dans le contexte d’une oppression judiciaire.
- source_word: וְלִגְזֹל מִשְׁפַּט
  choice: priver de leur droit
  rationale: גזל évoque une dépossession injuste ou violente, tandis que מִשְׁפָּט désigne ici le droit dû dans le cadre judiciaire. « Priver de leur droit » rend naturellement l’ensemble en français.
- source_word: עֲנִיֵּי עַמִּי
  choice: les malheureux de mon peuple
  rationale: עָנִי peut désigner les pauvres, les affligés ou les opprimés. « Les malheureux » garde ensemble la détresse sociale et l’affliction sans les réduire à la seule pauvreté matérielle.
- source_word: לִהְיוֹת אַלְמָנוֹת שְׁלָלָם
  choice: pour faire des veuves leur butin
  rationale: L’infinitif peut exprimer le but ou le résultat; « pour faire » conserve cette tension. שָׁלָל est le butin pris par prédation ou conquête.
- source_word: יְתוֹמִים
  choice: les orphelins
  rationale: יָתוֹם désigne plus précisément celui qui est privé de père, mais « orphelins » est le terme français courant et naturel pour cette catégorie sociale biblique; la précision figure en note.
- source_word: יָבֹזּוּ
  choice: dépouiller
  rationale: בזז signifie piller ou dépouiller. « Dépouiller » exprime clairement l’exploitation des personnes et évite la répétition de « butin ».
theological_decisions:
- issue: Désignation des groupes socialement vulnérables
  choice: Conserver les catégories concrètes « veuves » et « orphelins ».
  alternative: Généraliser par « les personnes vulnérables ».
  rationale: L’hébreu nomme des groupes précis exposés à l’injustice. Les conserver maintient la force éthique et sociale de l’accusation prophétique.
- issue: Suffixe de première personne dans עַמִּי
  choice: « mon peuple »
  alternative: « son peuple »
  rationale: Le suffixe hébreu est à la première personne du singulier et maintient la perspective du locuteur divin dans le contexte.
- issue: Valeur de l’infinitif לִהְיוֹת
  choice: « pour faire »
  alternative: « de sorte que ... deviennent »
  rationale: La construction peut exprimer le but ou le résultat. « Pour faire » conserve naturellement en français une part de cette ambiguïté, sans trancher en faveur du seul résultat.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure infinitive liée au verset précédent ainsi que le vocabulaire judiciaire et l’image prédatrice du butin.
