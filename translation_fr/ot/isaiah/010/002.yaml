  naturalness: La révision emploie un français moderne et clair tout en gardant le registre sobre et accusateur du texte prophétique. « Afin que les veuves deviennent leur butin » explicite naturellement en français l’image prédatrice et la relation exprimée par le possessif hébreu.
  terminology: « Pauvres » convient à דַּלִּים dans ce contexte social et judiciaire; « démunis » convient à עֲנִיֵּי et évite une répétition peu heureuse tout en conservant la vulnérabilité sociale. « Droit » rend correctement מִשְׁפָּט comme ce qui est juridiquement dû. « Orphelins » est naturel; la note maintient la précision de la catégorie hébraïque, littéralement privée de père.
