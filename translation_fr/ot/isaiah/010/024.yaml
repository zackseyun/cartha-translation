id: ISA.10.24
reference: Isaiah 10:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
translation:
  language: fr
  text: 'C’est pourquoi voici ce que dit le Seigneur Yahweh des armées : « N’aie pas peur de l’Assyrie, mon peuple qui habite à Sion ! Il te frappera avec une verge et lèvera son bâton contre toi, à la manière de l’Égypte[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la voie de l’Égypte ». L’expression peut évoquer l’oppression autrefois subie en Égypte, sans que cette allusion soit certaine.'
    reason: Préserve l’ambiguïté de בְּדֶרֶךְ מִצְרָיִם et signale avec prudence l’allusion historique probable.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée du contexte précédent.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique rendue dans un français actuel tout en conservant sa force déclarative.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, le maître des armées
  rationale: Distingue אֲדֹנָי du nom divin יהוה et rend צבאות selon son sens concret d’armées, avec une formulation française intelligible.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Interdiction directe au singulier, conforme à l’adresse collective personnifiée.
- source_word: עַמִּי יֹשֵׁב צִיּוֹן
  choice: mon peuple qui habite à Sion
  rationale: Préserve l’adresse collective et le participe singulier sans produire une tournure française artificielle.
- source_word: מֵאַשּׁוּר
  choice: de l’Assyrie
  rationale: Après le verbe craindre, מן introduit naturellement l’objet de la peur.
- source_word: בַּשֵּׁבֶט יַכֶּכָּה
  choice: Elle te frappera de son bâton
  rationale: Rend le beth instrumental et explicite en français que l’instrument appartient à l’Assyrie, conformément au sujet contextuel.
- source_word: וּמַטֵּהוּ יִשָּׂא עָלֶיךָ
  choice: et lèvera son gourdin contre toi
  rationale: La levée contre quelqu’un exprime la menace ou l’agression; « gourdin » différencie מטה de שבט tout en gardant l’image d’un instrument de domination.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: comme l’a fait l’Égypte
  rationale: Rend le sens idiomatique probable, « à la manière de l’Égypte », dans une formulation française naturelle, tout en signalant l’ambiguïté dans la note.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Conserve le nom propre de l’alliance tout en distinguant le titre אֲדֹנָי; évite de fondre les deux éléments en un seul titre.
- issue: Référent des verbes יַכֶּכָּה et יִשָּׂא
  choice: l’Assyrie, reprise par le pronom féminin « elle »
  alternative: un pronom masculin littéral pouvant être compris comme le roi d’Assyrie
  rationale: אַשּׁוּר est grammaticalement masculin en hébreu, mais « Assyrie » est féminin en français. Le texte immédiat désigne l’Assyrie comme puissance oppressive sans imposer explicitement un roi.
- issue: Allusion historique de בְּדֶרֶךְ מִצְרָיִם
  choice: comme l’a fait l’Égypte
  alternative: sur le chemin de l’Égypte
  rationale: Le contexte favorise une comparaison avec l’oppression égyptienne passée, mais la note conserve la possibilité d’une lecture plus littérale et géographique.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement singulier reflète l’adresse au peuple considéré collectivement. Les images concrètes de la verge et du bâton sont conservées sous les termes « bâton » et « gourdin ».
