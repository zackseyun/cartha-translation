revisions:
- from: Quand le Seigneur aura achevé toute son œuvre sur le mont Sion et à Jérusalem, j’interviendrai contre le fruit de l’orgueil du cœur du roi d’Assyrie[a] et contre la splendeur de son regard hautain[b].
  to: Quand le Seigneur aura achevé toute son œuvre sur le mont Sion et à Jérusalem, je punirai le fruit de l’orgueil du cœur du roi d’Assyrie[a] et la splendeur de son regard hautain[b].
  rationale: 'La révision se limite au verbe principal de jugement : « je punirai » rend explicitement la portée judiciaire de פקד על dans ce verset. La localisation neutre de l’œuvre divine, les métaphores du fruit et du cœur, ainsi que l’ironie liée à la splendeur du regard hautain sont maintenues.'
