id: ISA.10.12
reference: Isaiah 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
translation:
  language: fr
  text: Quand le Seigneur aura achevé toute son œuvre sur le mont Sion et à Jérusalem, je punirai le fruit de l’orgueil du cœur du roi d’Assyrie[a] et la splendeur de son regard hautain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fruit de la grandeur du cœur du roi d’Assyrie » ; cette « grandeur » désigne ici son orgueil.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la splendeur de la hauteur de ses yeux », expression qui évoque son regard orgueilleux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La construction introduit une circonstance future temporelle. En français, « Quand » rend naturellement l’enchaînement sans reproduire lourdement le marqueur narratif hébreu.
- source_word: יְבַצַּע
  choice: aura achevé
  rationale: Le piel exprime ici l’accomplissement complet de l’action; le futur antérieur convient à la relation temporelle avec l’intervention qui suivra.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin Adonaï, rendu par l’équivalent français courant et digne.
- source_word: כָּל מַעֲשֵׂהוּ
  choice: toute son œuvre
  rationale: « Œuvre » conserve la portée collective de l’expression et son registre solennel sans préciser abusivement s’il s’agit uniquement de jugement ou aussi d’un autre dessein.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלָם
  choice: sur le mont Sion et à Jérusalem
  rationale: La préposition est rendue de manière locative; la formulation respecte l’usage géographique naturel du français et n’ajoute pas le sens adversatif « contre ».
- source_word: אֶפְקֹד עַל
  choice: j’interviendrai contre
  rationale: פקד על désigne ici une intervention divine judiciaire. Cette traduction garde explicite l’orientation hostile du jugement tout en laissant au verbe sa nuance de visitation ou de reddition de comptes.
- source_word: פְּרִי גֹדֶל לְבַב
  choice: le fruit de l’orgueil du cœur
  rationale: « Fruit » préserve la métaphore hébraïque. Dans ce contexte, גֹדֶל לְבַב désigne non une grandeur neutre, mais l’élévation orgueilleuse du cœur; « orgueil » en communique clairement la valeur.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rendu français standard de la chaîne construite.
- source_word: תִּפְאֶרֶת רוּם עֵינָיו
  choice: la splendeur de son regard hautain
  rationale: La traduction conserve תִּפְאֶרֶת par « splendeur » et exprime idiomatiquement « la hauteur de ses yeux » par « regard hautain », tout en maintenant l’association ironique entre éclat et arrogance.
theological_decisions:
- issue: Nature de l’œuvre du Seigneur à Sion et à Jérusalem
  choice: Maintenir une localisation neutre avec « sur le mont Sion et à Jérusalem »
  alternative: « contre le mont Sion et Jérusalem »
  rationale: 'La préposition hébraïque permet ici une lecture locative. Le texte ne doit pas être contraint à ne parler que d’une action hostile: il garde ouverte la portée de l’œuvre divine accomplie dans ce lieu avant le jugement de l’Assyrie.'
- issue: Portée judiciaire de פקד על
  choice: « j’interviendrai contre »
  alternative: « je punirai » ou « je demanderai compte »
  rationale: Le contexte implique clairement le jugement, mais « intervenir contre » préserve mieux l’étendue sémantique du verbe de visitation divine sans affaiblir sa force judiciaire.
translation_notes:
  register: Français international moderne, naturel et digne. La structure temporelle est allégée pour la fluidité, tandis que les images du « fruit », du « cœur » et de la « splendeur » sont conservées. Les marqueurs [a] et [b] figurent dans le texte principal.
