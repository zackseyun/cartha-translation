  timestamp: '2026-07-15T04:20:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : l’œuvre du Seigneur est située sur le mont Sion et à Jérusalem, puis le jugement vise l’orgueil du roi d’Assyrie et son regard hautain. Toutefois, « j’interviendrai contre » atténue et rend moins directement la valeur judiciaire de אֶפְקֹד עַל dans ce contexte. « Je punirai » est à la fois clair, naturel et plus précis.'
  naturalness: La phrase est fluide en français international moderne. « Le fruit de l’orgueil du cœur » conserve volontairement l’image et l’anthropologie du texte source. « La splendeur de son regard hautain » est idiomatique et rend bien l’expression hébraïque littérale « la splendeur de la hauteur de ses yeux ».
  terminology: « Seigneur », « mont Sion », « Jérusalem » et « roi d’Assyrie » sont appropriés. « Orgueil » rend correctement la valeur péjorative contextuelle de « grandeur de cœur », sans imposer une lecture doctrinale. Les deux ancres de note correspondent aux expressions expliquées.
  issues:
  - severity: medium
    issue: « j’interviendrai contre » pour אֶפְקֹד עַל
    rationale: Dans ce contexte de condamnation du roi d’Assyrie, le verbe exprime une visitation judiciaire. « Intervenir contre » reste possible mais est trop général et affaiblit l’assertion explicite de jugement. « Je punirai » rend plus directement le sens contextuel, tout en restant une traduction française naturelle.
  revised_text: Quand le Seigneur aura achevé toute son œuvre sur le mont Sion et à Jérusalem, je punirai le fruit de l’orgueil du cœur du roi d’Assyrie[a] et la splendeur de son regard hautain[b].
