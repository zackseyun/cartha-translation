  variant: modern international French
source:
  edition: WLC
  text: בְּ/ג֤וֹי חָנֵף֙ אֲשַׁלְּחֶ֔/נּוּ וְ/עַל עַ֥ם עֶבְרָתִ֖/י אֲצַוֶּ֑/נּוּ לִ/שְׁלֹ֤ל שָׁלָל֙ וְ/לָ/בֹ֣ז בַּ֔ז ו/ל/שימ/ו מִרְמָ֖ס כְּ/חֹ֥מֶר חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
translation:
  language: fr
  text: Je l’envoie contre une nation impie[a], je lui ordonne d’agir contre le peuple objet de ma fureur, de s’emparer du butin et d’emporter les dépouilles[b], de le fouler aux pieds comme la boue des rues[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nation profane ». Le terme hébreu peut exprimer l’impiété, la profanation ou l’absence de respect envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour piller un butin et pour dépouiller des dépouilles ». La répétition de mots de même racine intensifie l’idée de pillage.'
    reason: lexical_alternative
  - marker: c
    text: 'Le suffixe hébreu est masculin singulier et renvoie vraisemblablement à la nation ou au peuple considéré comme un tout. On peut aussi traduire : « pour en faire quelque chose que l’on piétine ».'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  choice: une nation impie
  rationale: « Nation » garde la portée collective et politique de גּוֹי. Dans ce contexte prophétique, חָנֵף dénonce l’impiété plutôt qu’une simple hypocrisie.
- source_word: אֲשַׁלְּחֶנּוּ
  choice: Je l’envoie
  rationale: Le présent donne à la déclaration divine sa vivacité et conserve le pronom masculin singulier désignant l’agent du jugement.
- source_word: עַם עֶבְרָתִי
  choice: le peuple vers lequel se tourne ma fureur
  rationale: Cette formulation française exprime que le peuple est l’objet de la fureur divine, sans lui attribuer explicitement une cause que l’hébreu ne formule pas.
- source_word: אֲצַוֶּנּוּ
  choice: je lui donne des ordres
  rationale: Expression française courante qui rend clairement l’autorité du commandement divin et le pronom masculin singulier.
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: pour s’emparer du butin et emporter les dépouilles
  rationale: Les deux propositions françaises préservent le parallélisme synonymique et l’idée de pillage, tandis qu’une note signale les constructions intensives avec noms de même racine.
- source_word: וּלְשִׂימוֹ מִרְמָס
  choice: pour le livrer au piétinement
  rationale: La tournure conserve le suffixe masculin singulier et présente le peuple ou la nation comme livré à l’écrasement, sans imposer artificiellement un sens strictement locatif.
- source_word: כְּחֹמֶר חוּצוֹת
  choice: comme la boue des rues
  rationale: « Boue » restitue l’image concrète de la matière foulée aux pieds, et « des rues » rend naturellement חוּצוֹת dans ce contexte urbain.
theological_decisions:
- issue: Référent des suffixes masculins singuliers appliqués à l’agent
  choice: « l’ » et « lui » renvoient à l’agent assyrien que Dieu envoie et commande.
  alternative: Les pronoms peuvent viser plus largement l’Assyrie personnifiée.
  rationale: Le contexte immédiat présente l’Assyrie comme l’instrument du jugement divin. Le masculin singulier français respecte la forme hébraïque sans trancher entre le roi et l’empire personnifié.
- issue: Langage de la fureur divine
  choice: Conserver l’expression directe « ma fureur ».
  alternative: Paraphraser par « le peuple contre lequel je suis en colère ».
  rationale: עֶבְרָתִי attribue explicitement la fureur à Dieu dans un contexte judiciaire; la traduction n’en atténue donc pas la force théologique.
- issue: Référent du suffixe dans וּלְשִׂימוֹ
  choice: Le pronom « le » renvoie collectivement au peuple ou à la nation visés.
  alternative: Comprendre le suffixe comme renvoyant à un autre objet implicite ou rendre la cible par un pluriel explicatif.
  rationale: Le masculin singulier hébreu s’accorde naturellement avec un collectif. La formulation française maintient cette lecture tout en signalant l’ambiguïté référentielle dans une note.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset conserve la parole divine à la première personne, le parallélisme des actes de pillage et l’image concrète de la boue foulée dans les rues.
