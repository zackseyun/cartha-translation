revisions:
- from: Je l’envoie contre une nation impie[a], je lui donne des ordres contre le peuple vers lequel se tourne ma fureur, pour s’emparer du butin et emporter les dépouilles[b], pour le livrer au piétinement[c], comme la boue des rues.
  to: Je l’envoie contre une nation impie[a], je lui ordonne d’agir contre le peuple objet de ma fureur, de s’emparer du butin et d’emporter les dépouilles[b], de le fouler aux pieds comme la boue des rues[c].
  rationale: La révision élimine une image ajoutée (« se tourne »), renforce la correspondance avec le verbe hébreu « ordonner » et remplace une abstraction française peu naturelle par l’image concrète du foulage aux pieds. Elle conserve les référents collectifs et les ambiguïtés du texte source, sans leur attribuer de sens doctrinal supplémentaire.
