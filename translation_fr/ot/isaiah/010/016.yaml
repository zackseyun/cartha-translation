  source_fidelity: 'Le sens général est fidèle : le jugement vise les « gras/opulents » et oppose leur vigueur à un dépérissement, puis leur gloire à un feu destructeur. Toutefois, « le maître des armées » ne rend pas avec assez de précision la construction titulaturelle הָאָדוֹן יְהוָה צְבָאוֹת et introduit une nuance moins usuelle que « le Seigneur, Yahweh des armées ».'
