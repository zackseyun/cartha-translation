  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
translation:
  language: fr
  text: C’est pourquoi le Seigneur, Yahweh des armées, enverra le dépérissement parmi ses hommes robustes[a] ; et sous[b] sa gloire[c], un brasier s’allumera comme un feu ardent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses gras » ou « ses opulents ». L’image évoque des hommes vigoureux, prospères ou puissants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à la place de ». Le brasier remplacerait alors sa splendeur.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « sa splendeur », « son faste » ou « sa puissance imposante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence annoncée par rapport à l’oracle précédent.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: le Seigneur, Yahweh, le maître des armées
  rationale: Distingue le titre אָדוֹן du nom divin יהוה et rend צְבָאוֹת par une expression française transparente.
- source_word: בְּמִשְׁמַנָּיו
  choice: parmi ses hommes robustes
  rationale: L’expression hébraïque désigne littéralement ses « gras » ou ses « opulents » et évoque ici les hommes qui incarnent la force et la prospérité de l’Assyrie, sans ajouter explicitement « guerriers » au texte.
- source_word: רָזוֹן
  choice: le dépérissement
  rationale: Conserve l’idée de maigreur ou de consomption infligée en jugement, dans une formulation française naturelle qui répond au contraste avec les hommes robustes.
- source_word: וְתַחַת כְּבֹדוֹ
  choice: et sous sa gloire
  rationale: Préserve en priorité l’image spatiale d’un feu qui couve sous la splendeur extérieure, tout en signalant en note le sens possible « à la place de ».
- source_word: יֵקַד יְקֹד
  choice: un brasier s’allumera
  rationale: Rend idiomatiquement l’intensification produite en hébreu par le verbe et le nom de même racine.
- source_word: כִּיקוֹד אֵשׁ
  choice: comme un feu ardent
  rationale: Exprime clairement la comparaison et l’intensité du feu sans reproduire une répétition maladroite en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel ; le SEIGNEUR ; Yahvé
  rationale: Le texte porte directement le nom divin. « Yahweh » le distingue du titre « le Seigneur » qui le précède et ne remplace pas le nom propre par un titre.
- issue: Référent des « hommes robustes » et de la « gloire »
  choice: Conserver les images de la vigueur et de la splendeur de la puissance assyrienne
  alternative: Préciser « guerriers d’élite » et « faste »
  rationale: Le contexte permet une application à l’élite puissante de l’Assyrie, mais le verset lui-même emploie des images plus larges. La traduction évite donc de restreindre indûment le sens au domaine militaire.
- issue: Sens de תַחַת
  choice: sous
  alternative: à la place de
  rationale: Le sens spatial produit l’image cohérente d’un incendie sous la gloire apparente, tandis que le sens substitutif demeure grammaticalement possible et est conservé en note.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve le contraste imagé entre vigueur et dépérissement ainsi qu’entre gloire extérieure et feu destructeur. Le point-virgule maintient l’équilibre poétique des deux jugements.
