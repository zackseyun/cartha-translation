  terminology: « Seigneur » rend correctement הָאָדוֹן, « Yahweh » conserve le nom divin, et « des armées » rend צְבָאוֹת. « Dépérissement » est une option recevable pour רָזוֹן, moins médicalisante que « maladie dévorante » et compatible avec l’image de maigreur. Les notes préservent utilement les autres nuances lexicales et la lecture substitutive possible de תחת.
