  text: וְ/הוּא֙ לֹא כֵ֣ן יְדַמֶּ֔ה וּ/לְבָב֖/וֹ לֹא כֵ֣ן יַחְשֹׁ֑ב כִּ֚י לְ/הַשְׁמִ֣יד בִּ/לְבָב֔/וֹ וּ/לְ/הַכְרִ֥ית גּוֹיִ֖ם לֹ֥א מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
translation:
  language: fr
  text: Mais lui-même ne l’envisage pas ainsi, et son cœur ne le conçoit pas ainsi ; car son cœur est porté à détruire et à faire disparaître bien des nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Littéralement « pas peu de nations », une litote signifiant « un grand nombre de nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Mais lui
  rationale: La conjonction marque ici le contraste entre le dessein évoqué dans le contexte et l’intention propre du roi d’Assyrie. La présence de « lui » restitue l’emphase du pronom hébreu.
- source_word: יְדַמֶּה
  choice: ne l’envisage pas ainsi
  rationale: Le piel de דמה peut exprimer la manière de se représenter ou de concevoir une chose, voire l’intention. « Envisager » rend naturellement cette nuance sans la réduire à une simple opinion.
- source_word: לְבָבוֹ
  choice: son cœur
  rationale: לֵבָב désigne ici le centre intérieur de la pensée et de la volonté. « Cœur » conserve l’image anthropologique hébraïque, tandis que le verbe en précise la portée cognitive.
- source_word: יַחְשֹׁב
  choice: pense
  rationale: חשב signifie penser, calculer ou projeter. « Pense » est clair en français moderne et maintient le parallélisme avec le premier membre sans imposer exclusivement la notion de plan.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit l’explication de l’intention réelle du roi d’Assyrie.
- source_word: לְהַשְׁמִיד
  choice: de détruire
  rationale: Le hiphil de שׁמד exprime l’action de causer la destruction. « Détruire » en donne le sens général sans accentuer indûment l’idée d’anéantissement total.
- source_word: בִּלְבָבוֹ
  choice: il a dans le cœur
  rationale: Cette tournure conserve l’expression hébraïque et présente la destruction comme son intention intérieure.
- source_word: לְהַכְרִית
  choice: de retrancher
  rationale: Le hiphil de כרת signifie couper, supprimer ou éliminer. « Retrancher » conserve l’image fondamentale tout en laissant ouverte la manière précise dont ces nations seraient supprimées.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans ce contexte géopolitique, גּוֹיִם désigne des nations considérées comme des entités collectives.
- source_word: לֹא מְעָט
  choice: en grand nombre
  rationale: La litote hébraïque signifie littéralement « pas peu ». « En grand nombre » en communique clairement le sens en français, tandis que la note conserve la forme rhétorique originale.
theological_decisions:
- issue: Rapport entre le dessein divin et l’intention de l’Assyrien
  choice: Maintenir le contraste implicite sans expliciter ce que représente « ainsi ».
  alternative: 'Traduire de manière interprétative : « il ne comprend pas le dessein de Dieu » ou « telle n’est pas son intention ».'
  rationale: Le contexte oppose le dessein de Dieu à l’intention destructrice du roi d’Assyrie, mais le verset lui-même laisse le référent de « ainsi » implicite. La traduction préserve cette tension et cette dépendance au contexte.
translation_notes:
  register: Français international moderne, clair et digne. L’expression répétée autour du « cœur » conserve l’anthropologie et l’insistance de l’hébreu. « Retrancher » apporte une légère solennité biblique tout en restant intelligible.
