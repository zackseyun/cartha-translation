revisions:
- from: Mais lui ne l’envisage pas ainsi[a], et son cœur ne pense pas ainsi ; car il a dans le cœur de détruire et de retrancher des nations en grand nombre[b].
  to: Mais lui-même ne l’envisage pas ainsi, et son cœur ne le conçoit pas ainsi ; car son cœur est porté à détruire et à faire disparaître bien des nations[b].
  rationale: La correction remplace une tournure française défectueuse par une expression idiomatique qui conserve le rôle du « cœur » comme siège de l’intention. Elle améliore également la fluidité de la seconde action tout en préservant le sens non spécifié de « couper/supprimer ». La note a est conservée, mais son ancre doit être rétablie dans le texte.
