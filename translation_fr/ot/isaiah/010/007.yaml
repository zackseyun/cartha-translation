    rationale: Le calque est possible dans un français biblique soutenu, mais il est moins naturel en français international moderne. Une formulation qui indique la suppression sans préciser le moyen traduit plus clairement le verbe hébreu.
  revised_text: Mais lui-même ne l’envisage pas ainsi, et son cœur ne le conçoit pas ainsi ; car son cœur est porté à détruire et à faire disparaître bien des nations[b].
