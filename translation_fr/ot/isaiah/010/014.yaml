base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
translation:
  language: fr
  text: Ma main a trouvé les richesses[a] des peuples comme on trouve un nid ; et, comme on ramasse des œufs abandonnés, moi, j’ai ramassé toute la terre[b]. Personne n’a remué une aile, n’a ouvert la bouche ni n’a pépié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ressources » ou « la puissance des peuples ». Le mot hébreu חַיִל peut désigner les richesses, les ressources, la force ou une armée ; ici, le contexte favorise les biens pris comme butin.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout le pays » ou « tout le territoire ». Le mot hébreu אֶרֶץ peut désigner la terre ou un territoire ; « toute la terre » conserve ici la portée universelle de la vantardise du locuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְצָא
  choice: a trouvé
  rationale: Le sens premier de מצא est « trouver ». Ce choix conserve l’image d’une acquisition facile dans la vantardise du conquérant, sans expliciter par « saisir » ou « s’emparer de ».
- source_word: כַקֵּן
  choice: comme un nid
  rationale: La formulation garde l’image concise du nid, qui se prolonge avec les œufs, l’aile, le bec et le pépiement.
- source_word: יָדִי
  choice: ma main
  rationale: Le calque naturel en français préserve l’expression de la puissance et de l’action personnelles du locuteur.
- source_word: לְחֵיל הָעַמִּים
  choice: les richesses des peuples
  rationale: חַיִל peut désigner la force, une armée, les ressources ou les biens. L’image des œufs ramassés et le contexte du butin favorisent ici « richesses » ; « peuples » rend עַמִּים sans le réduire à des États politiques.
- source_word: וְכֶאֱסֹף בֵּיצִים עֲזֻבוֹת
  choice: et comme on ramasse des œufs abandonnés
  rationale: La tournure impersonnelle « on » exprime naturellement la comparaison en français, tandis que « abandonnés » rend le caractère laissé sans défense de עֲזֻבוֹת.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: אֶרֶץ peut signifier « terre », « pays » ou « territoire ». « Toute la terre » conserve ici la portée universalisante et hyperbolique de la prétention impériale.
- source_word: אָסָפְתִּי
  choice: j’ai ramassé
  rationale: « Ramasser » reprend exactement le verbe employé dans la comparaison des œufs et maintient la cohésion de l’image.
- source_word: וְלֹא הָיָה נֹדֵד כָּנָף
  choice: Personne n’a remué une aile
  rationale: Cette formulation française naturelle conserve l’image aviaire et exprime l’absence de la moindre résistance.
- source_word: וּפֹצֶה פֶה
  choice: ouvert le bec
  rationale: Le texte dit littéralement « ouvrir la bouche ». Dans cette suite entièrement aviaire, « bec » est l’équivalent français naturel sans transformer l’image en protestation explicite.
- source_word: וּמְצַפְצֵף
  choice: pépié
  rationale: צפצף désigne le petit cri d’un oiseau. « Pépier » est précis, intelligible et maintient l’image du nid.
theological_decisions:
- issue: Portée de כָּל הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays / tout le territoire
  rationale: Le contexte présente la prétention orgueilleuse et hyperbolique de l’Assyrien. « Terre » en conserve la portée universelle sans affirmer que le récit valide littéralement cette prétention.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La répétition de « ramasser » est volontaire : elle reproduit le lien lexical entre les œufs et la terre conquise. « Bec » et « pépié » rendent naturelle en français la série d’images aviaires.'
