source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יָס֤וּר סֻבֳּל/וֹ֙ מֵ/עַ֣ל שִׁכְמֶ֔/ךָ וְ/עֻלּ֖/וֹ מֵ/עַ֣ל צַוָּארֶ֑/ךָ וְ/חֻבַּ֥ל עֹ֖ל מִ/פְּנֵי שָֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
translation:
  language: fr
  text: Ce jour-là, son fardeau sera ôté de ton épaule, et son joug sera ôté de ton cou ; le joug sera brisé à cause de la graisse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de l’huile » ; traduction traditionnelle : « à cause de l’onction ».'
    reason: La formule hébraïque est difficile. « Graisse » rend littéralement le nom tout en préservant l’ambiguïté ; la note signale l’autre sens lexical usuel et l’interprétation traditionnelle, sans l’imposer.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend naturellement la formule temporelle prophétique en français moderne, sans l’alourdir par un calque de וְהָיָה.
- source_word: יָסוּר
  choice: quittera
  rationale: Le verbe a ici le fardeau pour sujet et exprime son retrait ; « quittera » conserve cette syntaxe active et l’image corporelle.
- source_word: סֻבֳּלוֹ
  choice: son fardeau
  rationale: Préserve le possessif hébreu et désigne naturellement la charge oppressive imposée par l’oppresseur.
- source_word: מֵעַל שִׁכְמֶךָ
  choice: ton épaule
  rationale: Avec « quittera », le français n’exige pas de préposition supplémentaire ; le singulier et l’image corporelle de l’hébreu sont conservés.
- source_word: וְעֻלּוֹ
  choice: et son joug
  rationale: « Joug » maintient la métaphore agricole traditionnelle de la domination, tandis que le possessif renvoie à l’oppresseur.
- source_word: מֵעַל צַוָּארֶךָ
  choice: ton cou
  rationale: La construction elliptique « quittera… ton cou » rend le parallélisme hébreu dans un français fluide.
- source_word: וְחֻבַּל
  choice: sera brisé
  rationale: Le passif et l’image concrète de la destruction du joug sont préservés.
- source_word: עֹל
  choice: le joug
  rationale: L’article défini assure la reprise naturelle du joug déjà mentionné.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Exprime le rapport causal probable sans préciser davantage la logique de l’image.
- source_word: שָׁמֶן
  choice: l’embonpoint
  rationale: Le nom peut désigner la graisse ou l’état de ce qui est gras. « Embonpoint » conserve l’image d’un corps devenu trop gros pour son joug, tout en évitant d’introduire dans le texte principal l’interprétation théologique de l’onction.
theological_decisions:
- issue: Interprétation de מִפְּנֵי שָׁמֶן
  choice: à cause de l’embonpoint
  alternative: à cause de l’huile ; à cause de l’onction
  rationale: La formule hébraïque est difficile. שָׁמֶן appartient au champ de la graisse et de l’huile, mais le contexte immédiat ne mentionne explicitement ni rite ni personnage oint. Le texte principal garde donc l’image concrète de la corpulence, susceptible de faire éclater le joug, et la note signale les autres compréhensions sans en imposer une.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier reproduit les suffixes de deuxième personne du singulier. La ponctuation fait ressortir le parallélisme entre l’épaule et le cou, et l’ellipse du second verbe évite une répétition lourde.
