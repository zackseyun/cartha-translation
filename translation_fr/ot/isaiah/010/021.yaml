  text: שְׁאָ֥ר יָשׁ֖וּב שְׁאָ֣ר יַעֲקֹ֑ב אֶל אֵ֖ל גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/021.yaml
  text: A remnant will return[a], the remnant of Jacob[b], to the Mighty God.
translation:
  language: fr
  text: Un reste reviendra[a], le reste de Jacob, au Dieu puissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation fait écho au nom Shear-Yashoub (« un reste reviendra ») en Ésaïe 7.3.
    reason: cross_reference
  - marker: b
    text: 'On peut aussi traduire la fin du verset : « à Dieu, le Puissant » ; moins probablement : « à un dieu puissant » ou « à un héros puissant ». Le titre hébreu אֵל גִּבּוֹר est également employé en Ésaïe 9.5 (9.6 dans certaines éditions).'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר
  choice: un reste
  rationale: Le nom désigne ce qui subsiste après le jugement ou la catastrophe. « Reste » est le terme consacré et naturel dans ce contexte prophétique.
- source_word: יָשׁוּב
  choice: reviendra
  rationale: L’imparfait qal de שוב exprime ici le retour annoncé. « Reviendra » est idiomatique et conserve l’écho du nom Shear-Yashoub.
- source_word: שְׁאָר יַעֲקֹב
  choice: le reste de Jacob
  rationale: Cette construction rend directement le syntagme hébreu tout en conservant Jacob comme nom personnel et collectif.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: L’hébreu nomme explicitement Jacob; il ne convient pas de le remplacer interprétativement par « Israël ».
- source_word: אֶל
  choice: vers
  rationale: La préposition indique ici le mouvement ou le retour en direction de quelqu’un. « Vers » s’accorde naturellement avec « revenir » et peut aussi suggérer le retournement d’allégeance sans l’imposer.
- source_word: אֵל גִּבּוֹר
  choice: le Dieu puissant
  rationale: Le syntagme fonctionne dans ce contexte comme un titre divin. « Le Dieu puissant » en conserve la force et correspond à son autre emploi en Ésaïe 9.5 dans la numérotation française courante (9.6 dans certaines éditions).
theological_decisions:
- issue: Référent et portée de אֵל גִּבּוֹר
  choice: le Dieu puissant
  alternative: Dieu, le Puissant; un dieu puissant; un héros puissant
  rationale: Le retour du reste vers cette figure favorise nettement un référent divin, et le même titre apparaît en Ésaïe 9.5. La traduction principale garde cette portée théologique sans dissimuler les possibilités lexicales moins probables, signalées en note.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « reste » est conservée afin de reproduire l’insistance de l’hébreu. Les marqueurs de note sont placés sur les éléments qu’ils expliquent; leur ordre est donc ajusté par rapport à la couche anglaise.
