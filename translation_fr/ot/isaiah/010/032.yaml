source:
  edition: WLC
  text: ע֥וֹד הַ/יּ֖וֹם בְּ/נֹ֣ב לַֽ/עֲמֹ֑ד יְנֹפֵ֤ף יָד/וֹ֙ הַ֣ר בית צִיּ֔וֹן גִּבְעַ֖ת יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/032.yaml
  text: Still this very day he will halt at Nob[a]; he will shake his hand at the mountain of the daughter of Zion[b], the hill of Jerusalem.
translation:
  language: fr
  text: Aujourd’hui encore, il s’arrêtera à Nob ; il agitera la main[a] en direction de la montagne de la maison de Sion[b], la colline de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fera un geste de la main » ou « brandira la main ». Le verbe hébreu peut désigner ici un geste menaçant.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la montagne de la maison de Sion ». Le texte hébreu fourni porte bien « maison » ; une autre tradition textuelle et certaines traductions comprennent « la montagne de la fille de Sion ».
    reason: alternative_reading
lexical_decisions:
- source_word: ע֥וֹד הַיּ֖וֹם
  choice: Aujourd’hui encore
  rationale: Cette tournure française naturelle conserve à la fois l’idée de continuité portée par עוֹד et l’immédiateté de הַיּוֹם.
- source_word: בְּנֹ֣ב לַֽעֲמֹ֑ד
  choice: il s’arrêtera à Nob
  rationale: Dans le contexte de la progression d’un envahisseur, עמד exprime ici le fait de faire halte plutôt que simplement de se tenir debout.
- source_word: יְנֹפֵ֤ף יָד/וֹ֙
  choice: il agitera la main
  rationale: Le verbe נוף décrit un mouvement de la main qui, dans ce contexte, constitue vraisemblablement un geste menaçant. « Agiter » préserve l’image sans préciser indûment qu’il s’agit d’un poing ou d’une arme.
- source_word: הַ֣ר בית צִיּ֔וֹן
  choice: la montagne de la maison de Sion
  rationale: Le texte massorétique fourni porte בית, « maison », et non בת, « fille ». La formulation quelque peu inhabituelle est donc conservée plutôt que corrigée silencieusement.
- source_word: גִּבְעַ֖ת יְרוּשָׁלִָֽם
  choice: la colline de Jérusalem
  rationale: Ce rendu direct de la chaîne construite maintient le parallélisme topographique avec la montagne mentionnée auparavant.
theological_decisions:
- issue: Référent du sujet masculin singulier implicite
  choice: Conserver « il » sans identifier explicitement le sujet
  alternative: « le roi d’Assyrie » ou l’armée assyrienne personnifiée
  rationale: Le contexte désigne l’envahisseur assyrien, mais l’hébreu maintient ici un sujet singulier non nommé. Le rendre simplement par « il » évite d’inscrire l’identification interprétative dans le texte.
- issue: Orientation du geste envers Sion et Jérusalem
  choice: « en direction de »
  alternative: « contre »
  rationale: Le contexte permet de comprendre le geste comme une menace, mais le texte ne comporte pas de préposition signifiant explicitement « contre ». « En direction de » conserve cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. « Aujourd’hui encore » donne à la scène prophétique son immédiateté. La formule inhabituelle « montagne de la maison de Sion » est maintenue en raison du texte hébreu fourni, avec une note signalant l’autre lecture.
