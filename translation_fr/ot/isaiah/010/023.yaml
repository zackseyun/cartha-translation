source:
  edition: WLC
  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
translation:
  language: fr
  text: Car le Seigneur Yahweh des armées accomplit une destruction totale, décrétée, au milieu de toute la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de tout le pays ». Le mot hébreu peut désigner soit la terre, soit un pays particulier, selon le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication de l’affirmation précédente et conserve clairement le lien logique.
- source_word: כָלָה
  choice: une destruction totale
  rationale: Dans ce contexte de jugement, le nom exprime une fin complète prenant la forme d’une destruction. Cette formulation rend à la fois l’idée d’achèvement et celle de jugement.
- source_word: וְנֶחֱרָצָה
  choice: qui a été décrétée
  rationale: Le niphal de חרץ indique que cette destruction a été décidée ou déterminée. La proposition relative restitue naturellement l’accord avec le nom féminin כָלָה.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente explicitement le nom divin יהוה sans les confondre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend directement le titre divin et conserve son évocation des puissances placées sous le commandement de Yahweh.
- source_word: עֹשֶׂה
  choice: accomplit
  rationale: Le participe présente l’action comme en cours ou imminente. « Accomplit » convient à l’exécution effective d’un jugement décrété.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Préserve la valeur spatiale de l’expression hébraïque.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: אָרֶץ peut désigner la terre entière ou un pays déterminé. Le sens large convient à la portée naturelle de l’expression, tandis que l’autre possibilité est conservée en note.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction distingue le titre אֲדֹנָי du nom personnel יהוה et rend explicitement ce dernier par « Yahweh ».
- issue: Étendue géographique de הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: Le terme hébreu permet une portée universelle aussi bien qu’une référence au pays concerné par le jugement historique. Le texte retient le sens large sans supprimer l’ambiguïté, signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. La structure conserve les deux aspects du jugement — sa totalité et son caractère décrété — tout en évitant une tournure excessivement littérale.
