  text: וַ/יִּתְפַּלֵּל֙ חִזְקִיָּ֔הוּ אֶל יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/015.yaml
  text: 'And Hezekiah prayed to Yahweh[a], saying:'
translation:
  language: fr
  text: 'Ézéchias pria Yahvé[a] en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: pria
  rationale: Le hitpael de פלל désigne ici l’action de prier. « pria » est la formulation narrative la plus naturelle et directe en français.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et couramment reconnue du nom hébreu.
- source_word: אֶל
  choice: Yahvé (complément direct de « pria »)
  rationale: La préposition désigne le destinataire de la prière. En français moderne, « prier quelqu’un » est plus naturel que « prier à quelqu’un ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme, qui conserve ici le nom divin plutôt que de lui substituer le titre « le SEIGNEUR ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit le contenu de la prière. « en disant » maintient explicitement ce lien avec les paroles qui suivent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » en est la transcription française usuelle et préserve le nom propre, tandis que la note signale le rendu traditionnel.
translation_notes:
  register: Français moderne, clair et digne. La tournure « pria Yahvé » est idiomatique et évite le calque peu naturel « pria à Yahvé » ; « en disant » conserve la structure introductive de l’hébreu.
