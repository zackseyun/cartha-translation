  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּֽׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: fr
  text: 'Voici ce que vous direz à Ézékias, roi de Juda : « Que ton Dieu, en qui tu mets ta confiance, ne te trompe pas en disant : “Jérusalem ne sera pas livrée aux mains du roi d’Assyrie.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: Voici ce que vous direz
  rationale: La formule déictique suivie de l’imparfait à valeur directive est rendue dans un français actuel et digne, tout en conservant l’instruction adressée à plusieurs messagers.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Ézékias, roi de Juda
  rationale: Les formes françaises usuelles du nom propre et du titre royal sont conservées.
- source_word: אַל יַשִּׁאֲךָ אֱלֹהֶיךָ
  choice: Que ton Dieu ... ne te trompe pas
  rationale: Le hiphil de נשׁא exprime ici l’idée de tromper ou d’égarer. « Tromper » maintient toute la violence provocatrice de la parole assyrienne sans la présenter comme vraie.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  choice: en qui tu mets ta confiance
  rationale: Cette tournure naturelle restitue la relation exprimée par בטח et le pronom relatif à référent personnel.
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit le contenu de la prétendue tromperie ; « en disant » conserve ce lien sans alourdir la phrase.
- source_word: לֹא תִנָּתֵן יְרוּשָׁלִַם
  choice: Jérusalem ne sera pas livrée
  rationale: Le passif de נתן signifie littéralement « être donnée » ; dans ce contexte militaire, « être livrée » en transmet naturellement la portée sans expliciter davantage la prise de la ville.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: aux mains du roi d’Assyrie
  rationale: L’expression française « livrer aux mains de » garde l’image idiomatique hébraïque de la main comme pouvoir ou domination.
theological_decisions:
- issue: Accusation assyrienne selon laquelle le Dieu d’Ézékias le tromperait
  choice: Que ton Dieu ... ne te trompe pas
  alternative: Que ton Dieu ... ne t’égare pas
  rationale: Le texte rapporte sans l’atténuer le blasphème du discours ennemi. « Tromper » préserve son caractère frontal, tandis que le contexte narratif permet de comprendre que cette accusation n’est pas validée.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse hébraïque au singulier visant Ézékias, tandis que « vous direz » conserve le pluriel de l’instruction donnée aux messagers. Les guillemets imbriqués distinguent la consigne, le message à Ézékias et l’assurance divine citée.
