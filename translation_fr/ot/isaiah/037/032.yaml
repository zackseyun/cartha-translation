  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
translation:
  language: fr
  text: 'Car de Jérusalem sortira un reste,

    et du mont Sion sortiront des rescapés.

    Le zèle[a] de Yahweh des armées accomplira cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la jalousie ». Le nom hébreu peut signifier « zèle » ou « jalousie » ; ici, il évoque l’engagement intense de Yahweh à accomplir sa promesse.
    reason: Alternative lexicale authentique pour קִנְאַת.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de la promesse qui précède.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: de Jérusalem sortira un reste
  rationale: Conserve la provenance marquée par מִן, la valeur prédictive de l’imparfait et le motif prophétique du reste.
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: et du mont Sion, des rescapés
  rationale: Le nom désigne ici les personnes ayant échappé au désastre; « rescapés » rend ce sens personnel dans un français actuel.
- source_word: קִנְאַת
  choice: le zèle
  rationale: Le terme exprime l’engagement intense et actif de Dieu; son autre sens possible, « jalousie », est conservé en note.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et rend directement le titre hébreu sans le réduire aux seules armées humaines.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: accomplira cela
  rationale: Rend l’action divine qui mènera effectivement la promesse à sa réalisation, dans une formulation française naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom personnel divin; sa transcription le distingue d’un simple titre.
- issue: Sens de קִנְאַת appliqué à Dieu
  choice: zèle
  alternative: jalousie
  rationale: Dans ce contexte, « zèle » exprime le puissant engagement de Yahweh à réaliser sa promesse, tandis que la note maintient l’ambivalence lexicale de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique hébreu est conservé sur deux lignes, suivi de l’affirmation de l’action divine.
