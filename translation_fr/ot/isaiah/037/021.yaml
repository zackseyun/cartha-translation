  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ הִתְפַּלַּ֣לְתָּ אֵלַ֔/י אֶל סַנְחֵרִ֖יב מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
translation:
  language: fr
  text: 'Alors Ésaïe, fils d’Amots, envoya dire à Ézéchias : « Ainsi parle Yahweh[a], le Dieu d’Israël : Parce que tu m’as adressé une prière au sujet de Sennachérib, roi d’Assyrie[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici le nom divin YHWH, traditionnellement remplacé par « le SEIGNEUR » dans de nombreuses traductions.
    reason: alternative_reading
  - marker: b
    text: 'La proposition hébraïque est elliptique et se poursuit dans la déclaration qui suit. On peut aussi conserver une tournure plus proche de l’hébreu : « Quant à ce que tu m’as adressé comme prière au sujet de Sennachérib, roi d’Assyrie… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya dire
  rationale: Le verbe signifie « envoyer », mais son objet reste implicite. En français, « envoya dire » exprime naturellement l’envoi du message sans ajouter un messager absent du texte.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Ésaïe, fils d’Amots
  rationale: Les noms suivent les formes françaises bibliques usuelles, et le patronyme est rendu directement.
- source_word: לֵאמֹר
  choice: dire
  rationale: L’infinitif complète idiomatiquement « envoya » et rend la formule hébraïque introduisant les paroles rapportées.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française, actuelle mais solennelle, conserve la force de la formule prophétique hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente le nom divin YHWH plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu transparent et naturel de la chaîne construite hébraïque.
- source_word: אֲשֶׁר
  choice: Puisque
  rationale: Dans cette proposition elliptique, « Puisque » fait ressortir le motif de la réponse divine et donne une phrase française intelligible, tout en signalant en note la construction plus formelle.
- source_word: הִתְפַּלַּלְתָּ אֵלַי
  choice: tu m’as prié
  rationale: Le verbe désigne ici l’acte de prier. Le passé composé exprime naturellement une action accomplie qui motive la réponse présente.
- source_word: אֶל סַנְחֵרִיב
  choice: au sujet de Sennachérib
  rationale: Avec le verbe « prier », la préposition introduit ici le sujet de la prière. « Contre » serait plus interprétatif.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: La chaîne construite est rendue directement; l’apposition française n’exige pas d’article.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le présente comme un nom personnel et évite de le remplacer silencieusement par un titre; une note en explique la valeur.
- issue: Traitement de la proposition elliptique introduite par אֲשֶׁר
  choice: Puisque tu m’as prié au sujet de Sennachérib, roi d’Assyrie
  alternative: Ce que tu m’as demandé dans ta prière au sujet de Sennachérib, roi d’Assyrie…
  rationale: « Puisque » donne un enchaînement français clair et correspond au sens explicité dans le récit parallèle de 2 Rois 19.20. La note conserve toutefois l’ambiguïté syntaxique et la suspension propres à l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi parle » conserve le registre prophétique; « envoya dire » évite une tournure calquée. La ponctuation finale maintient explicitement la continuité de la parole divine au verset suivant.
