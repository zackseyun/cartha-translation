- from: 'Alors Ésaïe, fils d’Amots, envoya dire à Ézéchias : « Ainsi parle Yahweh[a], le Dieu d’Israël : Puisque tu m’as prié au sujet de Sennachérib, roi d’Assyrie[b], »'
  to: 'Alors Ésaïe, fils d’Amots, envoya dire à Ézéchias : « Ainsi parle Yahweh[a], le Dieu d’Israël : Parce que tu m’as adressé une prière au sujet de Sennachérib, roi d’Assyrie[b], »'
  rationale: La révision conserve la causalité rendue par « Parce que », la continuité syntaxique avec le verset suivant et tous les référents du texte source. Elle remplace une expression française potentiellement ambiguë par une formulation moderne explicite et reformule la note afin qu’elle signale l’ellipse sans réduire la prière à une demande.
