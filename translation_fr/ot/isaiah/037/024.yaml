revisions:
- from: 'Par l’intermédiaire de tes serviteurs, tu as insulté le Seigneur[a] et tu as dit : « Avec mes nombreux chars, moi, je suis monté sur les hauteurs des montagnes, jusqu’aux régions les plus reculées du Liban. J’abattrai ses cèdres majestueux et ses cyprès les plus beaux[b]. J’atteindrai sa hauteur la plus lointaine, sa forêt luxuriante[c]. »'
  to: 'Par l’intermédiaire de tes serviteurs, tu as insulté le Seigneur[a] et tu as dit : « Avec mes nombreux chars, moi, je suis monté sur les hauteurs des montagnes, jusqu’aux régions les plus reculées du Liban. J’abattrai ses cèdres majestueux et ses plus beaux cyprès[b]. Je pénétrerai jusqu’à son sommet le plus élevé, dans sa forêt luxuriante[c]. »'
  rationale: La révision cible uniquement une formulation finale qui était à la fois peu naturelle et moins explicite quant au verbe de mouvement. L'ajout de « dans » avant « sa forêt luxuriante » fait entendre que la forêt qualifie le lieu atteint, conformément à l'apposition hébraïque. Les notes existantes restent pertinentes, leurs ancres sont conservées et placées sur les éléments concernés.
