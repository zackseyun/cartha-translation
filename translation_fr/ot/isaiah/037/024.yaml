  source_fidelity: 'Le sens général est bien rendu : l''accusation adressée au roi, l''emphase de « moi, je », la montée vers les confins du Liban, l''abattage des arbres et l''image finale de la forêt fertile sont conservés. Toutefois, « J’atteindrai sa hauteur la plus lointaine » est peu idiomatique et rend imparfaitement l''idée de pénétrer jusqu''à l''extrémité élevée du Liban exprimée par וְאָבוֹא מְרוֹם קִצּוֹ.'
