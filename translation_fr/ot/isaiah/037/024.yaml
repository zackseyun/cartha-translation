source:
  edition: WLC
  text: בְּ/יַ֣ד עֲבָדֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר בְּ/רֹ֥ב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְחַ֣ר בְּרֹשָׁ֔י/ו וְ/אָבוֹא֙ מְר֣וֹם קִצּ֔/וֹ יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
translation:
  language: fr
  text: 'Par l’intermédiaire de tes serviteurs, tu as insulté le Seigneur[a] et tu as dit : « Avec mes nombreux chars, moi, je suis monté sur les hauteurs des montagnes, jusqu’aux régions les plus reculées du Liban. J’abattrai ses cèdres majestueux et ses plus beaux cyprès[b]. Je pénétrerai jusqu’à son sommet le plus élevé, dans sa forêt luxuriante[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « provoqué » ou « outragé » ; le verbe hébreu exprime une insulte ou un défi lancé avec mépris.
    reason: lexical_alternative
  - marker: b
    text: L’identification de l’arbre désigné par le mot hébreu berosh est incertaine ; il pourrait s’agir du cyprès, du sapin ou d’un autre conifère.
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque associe la forêt à l’idée d’une terre fertile ou plantée comme un verger ; on pourrait aussi traduire « sa forêt fertile » ou « sa forêt pareille à un verger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  choice: Par l’intermédiaire de tes serviteurs
  rationale: L’expression signifie littéralement « par la main de tes serviteurs », mais elle indique ici le moyen ou les agents employés. Cette formulation française conserve ce sens sans reproduire un idiome hébreu peu naturel.
- source_word: חֵרַפְתָּ
  choice: tu as insulté
  rationale: Le verbe exprime l’outrage, le mépris ou le défi injurieux. « Insulté » convient naturellement à son complément direct et conserve la force de l’accusation.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, et non du nom יהוה. « Le Seigneur » est son équivalent français courant.
- source_word: בְּרֹב רִכְבִּי
  choice: Avec mes nombreux chars
  rationale: Cette tournure rend clairement l’abondance de la force militaire évoquée par רֹב et רֶכֶב.
- source_word: אֲנִי עָלִיתִי
  choice: moi, je suis monté
  rationale: Le pronom explicite אֲנִי donne une emphase orgueilleuse au sujet. La dislocation « moi, je » la conserve dans un français naturel.
- source_word: מְרוֹם הָרִים
  choice: sur les hauteurs des montagnes
  rationale: מְרוֹם désigne une hauteur ou une élévation. Le pluriel français s’accorde naturellement avec les montagnes tout en gardant l’image topographique.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: jusqu’aux régions les plus reculées du Liban
  rationale: יַרְכְּתֵי désigne ici les confins, les profondeurs ou les parties reculées d’un territoire.
- source_word: וְאֶכְרֹת
  choice: J’abattrai
  rationale: Dans cette déclaration de conquête, l’imparfait hébreu exprime l’action projetée. « Abattre » est précis et idiomatique pour des arbres.
- source_word: קוֹמַת אֲרָזָיו
  choice: ses cèdres majestueux
  rationale: קוֹמָה évoque la hauteur et la stature. « Majestueux » transmet la grandeur des cèdres sans l’expression française maladroite « la hauteur de ses cèdres ».
- source_word: מִבְחַר בְּרֹשָׁיו
  choice: ses cyprès les plus beaux
  rationale: מִבְחַר désigne ce qui est choisi ou excellent. L’identification botanique de בְּרוֹשׁ reste incertaine, mais « cyprès » est une désignation traditionnelle et intelligible, accompagnée d’une note.
- source_word: וְאָבוֹא מְרוֹם קִצּוֹ
  choice: J’atteindrai sa hauteur la plus lointaine
  rationale: בוא peut signifier venir, entrer ou parvenir. « Atteindrai » convient au mouvement vers un lieu élevé et reculé, tandis que קֵץ marque ici l’extrémité.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: sa forêt luxuriante
  rationale: יַעַר signifie « forêt », tandis que כַּרְמֶל peut évoquer une terre fertile, plantée ou semblable à un verger. « Forêt luxuriante » restitue naturellement l’association des deux images sans la réduire à une identification botanique précise.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le texte porte le titre אֲדֹנָי plutôt que le nom divin יהוה. L’article défini est naturel en français après « insulter » et n’introduit aucune identification absente de l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation et le rythme font entendre la vantardise royale. L’emphase de אֲנִי est conservée par « moi, je », et les incertitudes botanique et imagée sont signalées sans alourdir le corps du verset.
