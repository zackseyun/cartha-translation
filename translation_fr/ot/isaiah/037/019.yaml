    issue: « ils ont pu les détruire »
    rationale: Le verbe hiphil d’אבד avec son objet suffixé affirme qu’ils les ont détruits. L’auxiliaire « ont pu » introduit une modalité de capacité ou de possibilité qui n’est pas exprimée par le texte source et atténue l’événement rapporté.
