source:
  edition: WLC
  text: וְ/נָתֹ֥ן אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/019.yaml
  text: and have put their gods into the fire[a], for they were not gods but the work of human hands, wood and stone; so they destroyed them.
translation:
  language: fr
  text: et ils ont jeté leurs dieux au feu[a], car ce n’étaient pas des dieux, mais des objets fabriqués par des mains humaines, du bois et de la pierre ; c’est pourquoi ils les ont détruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs idoles ». L’hébreu dit « leurs dieux », puis précise aussitôt que ce n’étaient pas réellement des dieux, mais des objets fabriqués par des humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתֹן
  choice: et ils ont jeté
  rationale: נתן signifie littéralement « donner, mettre », mais avec « au feu », « jeter » exprime naturellement en français l’action de livrer ces objets aux flammes. L’infinitif absolu coordonné poursuit ici les actes rapportés dans la prière.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: La traduction directe préserve la désignation des divinités par les nations, avant que la proposition suivante nie explicitement leur divinité réelle.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: Avec le verbe de mise ou de projection, la préposition indique que les objets sont livrés au feu. « Au feu » est idiomatique et concis en français.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: car ce n’étaient pas des dieux
  rationale: La proposition motive leur destruction et conserve la négation polémique explicite du texte hébreu. L’imparfait s’accorde au contexte narratif de la prière.
- source_word: כִּי אִם
  choice: mais
  rationale: 'Dans cette construction négative, l’expression introduit le contraste correctif : non pas des dieux, mais des objets fabriqués.'
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: des ouvrages façonnés par des mains humaines
  rationale: Cette formulation rend l’idée d’œuvres produites par des humains tout en restant naturelle. « Façonnés » explicite sans excès la fabrication impliquée par מַעֲשֵׂה.
- source_word: עֵץ וָאֶבֶן
  choice: du bois et de la pierre
  rationale: Les deux noms précisent en apposition les matériaux dont ces ouvrages étaient faits.
- source_word: וַיְאַבְּדוּם
  choice: c’est pourquoi ils ont pu les détruire
  rationale: Le hiphil d’אבד signifie « détruire ». « C’est pourquoi » fait ressortir la conséquence logique. « Ont pu » explicite la possibilité fondée sur leur nature matérielle, sans changer le fait qu’ils les ont effectivement détruits.
theological_decisions:
- issue: Statut des divinités des nations
  choice: « leurs dieux », suivi de « ce n’étaient pas des dieux »
  alternative: « leurs idoles », suivi de « ce n’étaient pas des dieux »
  rationale: L’hébreu emploie d’abord le terme « dieux », puis en nie la réalité divine. Maintenir cette tension conserve la force polémique du texte au lieu d’anticiper son explication.
- issue: Lien entre leur nature matérielle et leur destruction
  choice: « c’est pourquoi ils ont pu les détruire »
  alternative: « et ils les ont détruits »
  rationale: 'La traduction retenue rend explicite l’enchaînement logique : puisqu’ils n’étaient que des objets de bois et de pierre fabriqués par des humains, ils pouvaient être détruits. Elle n’attribue aucune réalité divine à ces objets.'
translation_notes:
  register: Français moderne international, courant mais digne. La phrase conserve le contraste théologique du texte hébreu et utilise « mains humaines » pour le sens collectif de אָדָם.
