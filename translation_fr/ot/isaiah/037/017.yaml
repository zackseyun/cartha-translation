source:
  edition: WLC
  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שְׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת כָּל דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שָׁלַ֔ח לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: fr
  text: Éternel, tends l’oreille et écoute ! Éternel, ouvre les yeux et regarde ! Écoute toutes les paroles que Sennachérib a envoyées pour insulter le Dieu vivant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: tends l’oreille
  rationale: Conserve l’image hébraïque de l’oreille inclinée tout en employant une expression française naturelle.
- source_word: פְּקַח ... עֵינֶךָ
  choice: ouvre les yeux
  rationale: Rend directement l’impératif hébreu et son image anthropomorphique.
- source_word: לְחָרֵף
  choice: pour insulter
  rationale: Le verbe signifie outrager, couvrir d’opprobre ou insulter; « insulter » exprime clairement ici l’affront verbal adressé au Dieu vivant.
- source_word: אֱלֹהִים חָי
  choice: le Dieu vivant
  rationale: Traduction directe du titre, qui oppose implicitement le Dieu vivant aux idoles.
- source_word: יְהוָה
  choice: Éternel
  rationale: Rend le tétragramme selon une convention française biblique largement reconnue, en le distinguant du titre « Dieu » dans le même verset.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « tends l’oreille » et « ouvre les yeux »
  alternative: Reformuler par « sois attentif » et « considère »
  rationale: Les images appartiennent au texte hébreu et expriment la supplication sans imposer une interprétation métaphysique.
- issue: Destinataire grammatical de l’insulte
  choice: « pour insulter le Dieu vivant »
  alternative: « pour te provoquer, toi, le Dieu vivant »
  rationale: L’hébreu nomme explicitement « le Dieu vivant » à la troisième personne; la traduction préserve cette formulation.
translation_notes:
  register: Français moderne, digne et oralement fluide. Les impératifs et les exclamations gardent l’intensité de la prière. Aucun marqueur de note n’est nécessaire.
