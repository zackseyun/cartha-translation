source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
translation:
  language: fr
  text: 'Voici, tu as entendu ce que les rois d’Assyrie ont fait à tous les pays : ils les ont voués à une destruction totale[a]. Et toi, seras-tu délivré[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils les ont entièrement détruits » ou « ils les ont frappés d’interdit ». Le verbe hébreu exprime ici l’idée de vouer quelque chose à une destruction complète.
    reason: alternative_lexicale
  - marker: b
    text: Ou « échapperas-tu ? » Dans le contexte, cette phrase est une question rhétorique exprimant une raillerie.
    reason: force_discursive
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Interjection qui attire solennellement l’attention tout en restant naturelle en français biblique moderne.
- source_word: שָׁמַעְתָּ
  choice: tu as entendu
  rationale: Le passé composé exprime naturellement une information déjà reçue et désormais connue du destinataire.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ce que ... ont fait
  rationale: Rend idiomatiquement la proposition relative qui précise le contenu de ce que le destinataire a entendu.
- source_word: מַלְכֵי אַשּׁוּר
  choice: les rois d’Assyrie
  rationale: Rendu direct et courant de la construction hébraïque, sans préciser artificiellement une dynastie ou une époque.
- source_word: לְכָל הָאֲרָצוֹת
  choice: à tous les pays
  rationale: Dans ce contexte de conquêtes, le pluriel désigne les différents territoires ou pays soumis par l’Assyrie, non toute la terre.
- source_word: לְהַחֲרִימָם
  choice: ils les ont voués à une destruction totale
  rationale: Cette formulation conserve l’idée propre à חרם de livrer entièrement quelque chose à la destruction, tout en évitant dans le texte principal le terme technique et potentiellement ambigu « interdit ».
- source_word: וְאַתָּה תִּנָּצֵל
  choice: Et toi, serais-tu délivré ?
  rationale: Le pronom indépendant marque fortement le contraste. Le passif respecte le niphal, et le conditionnel interrogatif rend naturellement la raillerie rhétorique du contexte.
theological_decisions:
- issue: Valeur de חרם dans un contexte de conquête militaire
  choice: voués à une destruction totale
  alternative: entièrement détruits ; frappés d’interdit
  rationale: Le verbe évoque une mise à part conduisant ici à l’anéantissement complet, et non une destruction militaire ordinaire. Le rendu choisi en conserve la gravité sans imposer un jargon confessionnel.
- issue: Valeur interrogative de תִּנָּצֵל en fin de phrase
  choice: serais-tu délivré ?
  alternative: tu seras délivré ; échapperais-tu ?
  rationale: Le contexte montre que le roi d’Assyrie raille l’espérance d’Ézéchias. La question rhétorique communique cette force discursive, même si l’hébreu biblique ne possède pas de ponctuation interrogative.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » garde la force d’appel de l’hébreu ; la structure brève de la dernière question préserve le contraste emphatique et le ton provocateur.
