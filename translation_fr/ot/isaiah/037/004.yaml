source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
translation:
  language: fr
  text: Peut-être que Yahweh, ton Dieu, entendra les paroles du rab-shaké[a], que le roi d’Assyrie, son maître, a envoyé pour outrager le Dieu vivant, et qu’il lui demandera des comptes pour les paroles que Yahweh, ton Dieu, a entendues[b]. Fais donc monter une prière en faveur du reste qui se trouve encore[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand échanson ». « Rab-shaké » est un titre de haut fonctionnaire assyrien employé ici comme une désignation personnelle.
    reason: cultural_note
  - marker: b
    text: Ou « qu’il le réprimandera à cause des paroles ». L’hébreu peut indiquer que Dieu répondra à ces propos blasphématoires, les jugera ou en demandera compte.
    reason: lexical_alternative
  - marker: c
    text: Ou « le reste qui subsiste », « les survivants qui sont encore là ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Peut-être que … entendra
  rationale: Exprime l’espoir sans en faire une certitude et conserve le verbe hébreu « entendre ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu.
- source_word: רַב שָׁקֵה
  choice: le rab-shaké
  rationale: Conserve comme désignation quasi nominale le titre du haut fonctionnaire assyrien, avec une note explicative.
- source_word: לְחָרֵף
  choice: pour outrager
  rationale: Rend la parole insultante et blasphématoire dirigée contre le Dieu vivant, sans la réduire à une simple moquerie.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: et qu’il demandera compte des paroles
  rationale: Rend la réponse judiciaire ou réprobatrice espérée de Dieu tout en évitant l’expression peu naturelle « réprimander les paroles ».
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Fais donc monter une prière
  rationale: Dans ce contexte de demande, le parfait consécutif a une valeur exhortative; l’image de la prière qui monte reste naturelle en français biblique actuel.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: le reste qui se trouve encore
  rationale: Préserve le terme théologiquement évocateur « reste » et rend l’idée de ceux qui sont encore présents ou subsistent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom divin sans lui substituer un titre.
- issue: Portée de וְהוֹכִיחַ
  choice: il demandera compte des paroles
  alternative: il réprimandera à cause des paroles
  rationale: Le verbe peut évoquer réprimande, jugement ou mise en cause. Le choix retenu maintient cette dimension judiciaire sans préciser indûment la forme de l’intervention divine.
- issue: Sens de שְׁאֵרִית
  choice: le reste
  alternative: les survivants
  rationale: « Le reste » conserve la résonance propre à Ésaïe tout en désignant naturellement ceux qui ont survécu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe clarifie que le roi d’Assyrie est le maître du rab-shaké, tout en restant proche de l’ordre hébreu. Les répétitions de « paroles » et de « Yahweh, ton Dieu » sont conservées parce qu’elles structurent le verset.
