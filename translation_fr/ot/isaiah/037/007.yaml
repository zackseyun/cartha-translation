  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֨י נוֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב אֶל אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
translation:
  language: fr
  text: 'Voici, je vais mettre en lui un esprit[a] : il entendra une nouvelle[b] et retournera dans son pays. Je le ferai tomber par l’épée dans son propre pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une impulsion » ou « une disposition intérieure ». Le mot hébreu רוּחַ peut désigner un esprit, un souffle ou une force intérieure qui pousse à agir.
    reason: lexical_alternative
  - marker: b
    text: Ou « une information », « un bruit » ou « une rumeur ». Le mot hébreu שְׁמוּעָה ne précise pas si l’information reçue est confirmée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Rend la force présentative et attire l’attention, dans un registre prophétique digne mais courant.
- source_word: נוֹתֵן
  choice: je mets
  rationale: Le participe après הִנְנִי présente une action imminente ou engagée. « Je mets » conserve cet aspect mieux qu’un simple futur.
- source_word: בּוֹ רוּחַ
  choice: en lui un esprit
  rationale: Cette formulation maintient l’intériorité exprimée par בּוֹ et la polysémie de רוּחַ, sans réduire le terme à une simple émotion ou identifier précisément cet esprit.
- source_word: וְשָׁמַע
  choice: il entendra
  rationale: Le futur français exprime naturellement la conséquence annoncée de l’action divine; les deux-points rendent clairement l’enchaînement sans surcharger la syntaxe.
- source_word: שְׁמוּעָה
  choice: une nouvelle
  rationale: Le mot désigne une information reçue, un bruit ou un rapport, sans préciser nécessairement son degré de confirmation. « Une nouvelle » est naturel et suffisamment large en français.
- source_word: וְשָׁב אֶל אַרְצוֹ
  choice: et retournera dans son pays
  rationale: « Retournera » rend directement שׁוּב; en français, « retourner dans son pays » est plus idiomatique que « retourner vers son pays » dans ce contexte.
- source_word: וְהִפַּלְתִּיו
  choice: Je le ferai tomber
  rationale: Conserve explicitement la valeur causative du hiphil de נפל ainsi que l’action souveraine de Dieu.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Rend l’instrument ou le moyen de la mort dans l’expression hébraïque traditionnelle.
- source_word: בְּאַרְצוֹ
  choice: dans son propre pays
  rationale: '« Propre » souligne ici la répétition emphatique du possessif: sa chute aura lieu dans le pays où il sera retourné.'
theological_decisions:
- issue: Sens de רוּחַ dans l’action de Dieu sur le roi assyrien
  choice: un esprit placé en lui par Dieu
  alternative: un souffle, une disposition intérieure ou une impulsion
  rationale: « Un esprit » conserve l’étendue sémantique du terme hébreu et affirme l’action divine sans préciser le mécanisme ni réduire le mot à une réalité seulement psychologique.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la solennité de la parole prophétique sans archaïsme marqué. La syntaxe reste proche de l’enchaînement hébreu tout en étant naturelle en français.
