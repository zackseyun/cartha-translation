  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
translation:
  language: fr
  text: Alors l’ange de Yahweh[a] sortit et frappa 185 000 dans le camp assyrien. Au matin, lorsqu’on se leva, voici que tous étaient des cadavres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ». Le mot hébreu peut désigner un messager ou un ange ; ici, le contexte favorise l’idée d’un agent céleste du jugement divin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager humain ou un ange. Dans ce récit de jugement divin, « ange » exprime le plus naturellement l’agent céleste, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre, conformément au texte hébreu qui emploie ici le nom propre.
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Rend simplement le verbe יצא dans la suite narrative, en français actuel et naturel.
- source_word: וַיַּכֶּה
  choice: frappa
  rationale: נכה signifie frapper ou abattre. Le contexte et la phrase finale rendent sans équivoque l’issue mortelle, sans qu’il soit nécessaire de l’expliciter deux fois.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: dans le camp assyrien
  rationale: Formulation idiomatique correspondant au sens littéral « dans le camp d’Assyrie ».
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 185 000 hommes
  rationale: Le nombre exact est conservé selon la typographie française. « hommes » explicite naturellement les personnes comptées dans le camp, sans modifier le nombre.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Quand on se leva de bon matin
  rationale: Le verbe est au pluriel mais son sujet n’est pas exprimé. Le pronom indéfini « on » évite d’identifier abusivement ceux qui se lèvent aux victimes déjà mortes et conserve la nuance de lever matinal.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française garde la fonction de הִנֵּה, qui attire brusquement l’attention sur une scène saisissante.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: ils étaient tous des cadavres
  rationale: « Cadavres » rend idiomatiquement פְּגָרִים מֵתִים, littéralement des corps morts, et « tous » conserve l’insistance de כֻלָּם.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Nature de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte d’une intervention divine surnaturelle favorise « ange », mais le terme hébreu reste lexicalement ambigu; l’autre lecture est donc signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « De bon matin » et « voici que » préservent la vivacité du récit sans archaïsme marqué. Le sujet indéfini de la seconde phrase est maintenu par « on ».
