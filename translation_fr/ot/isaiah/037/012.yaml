  text: הַ/הִצִּ֨ילוּ אוֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִשְׁחִ֣יתוּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Telassar?
translation:
  language: fr
  text: Les dieux des nations que mes ancêtres ont détruites ont-ils délivré Gozan, Harrân, Rétseph et les gens d’Éden[a] qui étaient à Telassar ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Éden », c’est-à-dire les gens ou les habitants d’Éden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: les ont-ils délivrées
  rationale: Le hiphil accompli de נצל forme ici une question rhétorique tournée vers les défaites passées. « Délivrer » conserve le vocabulaire de sauvetage et la force de la provocation.
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux nations ensuite précisées par l’énumération. En français, le féminin pluriel s’accorde avec « nations ».
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: les dieux des nations
  rationale: Le pluriel construit désigne les divinités des peuples étrangers dans un contexte géopolitique.
- source_word: אֲשֶׁר הִשְׁחִיתוּ אֲבוֹתַי
  choice: que mes ancêtres ont détruites
  rationale: Le hiphil de שׁחת exprime la destruction militaire. « Ancêtres » rend naturellement en français moderne le sens dynastique de אבותי, plutôt que les parents immédiats.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gozan, Harrân, Rétseph
  rationale: Les noms de lieux sont translittérés selon des formes françaises transparentes, avec « Harrân » et « Rétseph » reflétant les consonnes et la vocalisation hébraïques.
- source_word: וּבְנֵי עֶדֶן
  choice: les gens d’Éden
  rationale: Littéralement « les fils d’Éden » ; dans ce contexte, בני désigne collectivement les membres ou habitants du peuple associé à Éden. « Les gens d’Éden » est naturel et non ambigu en français moderne.
- source_word: אֲשֶׁר בִּתְלַשָּׂר
  choice: qui étaient à Telassar
  rationale: La proposition relative se rattache le plus naturellement aux gens d’Éden et les situe à Telassar. La préposition ב est ici rendue idiomatiquement par « à ».
