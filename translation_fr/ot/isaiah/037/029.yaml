source:
  edition: WLC
  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣יבֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/029.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips[b], and I will turn you back by the way that you came.
translation:
  language: fr
  text: Parce que ta fureur contre moi et ton assurance insolente[a] sont montées jusqu’à mes oreilles, je mettrai mon crochet dans ton nez et mon mors entre tes lèvres, puis je te ferai repartir par le chemin par lequel tu es venu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton insouciance arrogante ». Le mot hébreu peut désigner le fait d’être tranquille ou de se croire en sécurité; ici, il évoque vraisemblablement une assurance pleine d’arrogance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit explicitement la cause du jugement annoncé et correspond naturellement à la valeur causale de l’hébreu.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: ta fureur contre moi
  rationale: Le verbe exprime ici une agitation hostile ou une rage dirigée contre Dieu; « contre moi » rend la valeur contextuelle de אֵלַי.
- source_word: שַׁאֲנַנְךָ
  choice: ton assurance insolente
  rationale: Le terme évoque l’état de celui qui se croit tranquille ou en sécurité. Dans ce contexte de défi, cette sécurité prend la forme d’une suffisance arrogante, sans que soit entièrement perdu le sens fondamental d’assurance.
- source_word: עָלָה בְאָזְנָי
  choice: sont montées jusqu’à mes oreilles
  rationale: Conserve l’image anthropomorphique et le mouvement ascendant de l’expression hébraïque tout en restant idiomatique en français.
- source_word: חַחִי בְּאַפֶּךָ
  choice: mon crochet dans ton nez
  rationale: חַח désigne un crochet ou anneau servant à maîtriser un animal ou un captif. « Crochet » rend clairement l’instrument de contrainte, et « dans ton nez » conserve l’image concrète.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: mon mors entre tes lèvres
  rationale: מֶתֶג désigne le mors qui permet de diriger un animal. « Entre tes lèvres » exprime naturellement en français l’emplacement indiqué par l’hébreu sans remplacer l’image par une abstraction.
- source_word: וַהֲשִׁיבֹתִיךָ
  choice: je te ferai repartir
  rationale: La forme causative de שׁוב indique que Dieu contraindra le roi à reprendre le chemin du retour.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: par le chemin par lequel tu es venu
  rationale: Rend la reprise du même itinéraire et conserve la structure du relatif hébreu dans un français soutenu mais naturel.
theological_decisions:
- issue: Langage anthropomorphique et images de maîtrise animale appliqués à l’action de Dieu
  choice: Conserver les images concrètes des oreilles, du crochet et du mors.
  alternative: 'Paraphraser: « J’ai entendu ton arrogance; je te maîtriserai et te renverrai. »'
  rationale: Ces images expriment avec force la souveraineté de Dieu sur le roi assyrien. Les remplacer par des abstractions affaiblirait la rhétorique du texte.
- issue: Nuance de שַׁאֲנַן dans le jugement du roi assyrien
  choice: « assurance insolente », qui associe la sécurité présumée à l’arrogance contextuelle.
  alternative: « tranquillité », « insouciance » ou « arrogance ».
  rationale: Le mot peut désigner le fait d’être tranquille ou en sécurité, mais le contexte hostile lui donne une nuance péjorative. La traduction garde ensemble ces deux dimensions sans réduire le terme à une seule.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste légèrement élevée pour convenir au discours prophétique, tandis que les images concrètes et menaçantes de l’hébreu sont conservées. Le marqueur [a] figure bien dans le texte principal.
