  to: N’as-tu pas entendu ? Depuis longtemps, je l’ai faite ; dès les jours anciens, je l’ai façonnée. Maintenant, je l’ai fait arriver, pour que tu réduises des villes fortifiées en monceaux de ruines.[a]
  rationale: La révision limitée de la dernière proposition rétablit le lien de résultat ou de dessein avec l’action divine (« je l’ai fait arriver »), tout en gardant le roi interpellé comme agent contextuel de la dévastation. La note conserve l’avertissement nécessaire sur la difficulté syntaxique et lexicale de l’hébreu.
