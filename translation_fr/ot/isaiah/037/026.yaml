  text: הֲ/לֽוֹא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אוֹתָ֣/הּ עָשִׂ֔יתִי מִ֥/ימֵי קֶ֖דֶם וִ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵאתִ֔י/הָ וּ/תְהִ֗י לְ/הַשְׁא֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: fr
  text: N’as-tu pas entendu ? Depuis longtemps, je l’ai faite ; dès les jours anciens, je l’ai façonnée. Maintenant, je l’ai fait arriver, pour que tu réduises des villes fortifiées en monceaux de ruines.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de la dernière proposition est difficile. Littéralement, il juxtapose des termes évoquant le fait de dévaster, des monceaux et des villes fortifiées ; le sens général est que ces villes sont réduites en amas de ruines.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעְתָּ
  choice: N’as-tu pas entendu ?
  rationale: La question rhétorique attend une réponse affirmative et conserve ici sa force de reproche.
- source_word: לְמֵרָחוֹק
  choice: Depuis longtemps
  rationale: Littéralement « de loin » ; dans ce contexte, l’éloignement est temporel.
- source_word: אוֹתָהּ עָשִׂיתִי
  choice: je l’ai faite
  rationale: Le pronom féminin renvoie à la réalité ou à l’entreprise envisagée sans préciser davantage son référent ; la traduction préserve cette indétermination.
- source_word: מִימֵי קֶדֶם
  choice: dès les jours anciens
  rationale: Cette expression temporelle évoque une époque reculée tout en gardant le registre prophétique.
- source_word: וִיצַרְתִּיהָ
  choice: je l’ai façonnée
  rationale: יצר exprime l’action de former avec intention ; « façonner » conserve cette image.
- source_word: עַתָּה הֲבֵאתִיהָ
  choice: Maintenant, je l’ai fait arriver
  rationale: Le hiphil de בוא présente Dieu comme celui qui fait entrer dans l’histoire ce qu’il avait formé auparavant.
- source_word: לְהַשְׁאוֹת
  choice: tu réduis ainsi … en
  rationale: L’infinitif exprime la dévastation produite dans le contexte militaire ; la formulation française rend le résultat destructeur et maintient le roi interpellé comme agent contextuel.
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: des villes fortifiées en monceaux de ruines
  rationale: 'Le texte hébreu de cette séquence est difficile. Cette formulation restitue le sens contextuel : les villes fortifiées sont transformées en amas de décombres.'
theological_decisions:
- issue: La souveraineté divine sur les conquêtes assyriennes
  choice: Dieu affirme avoir conçu cette réalité dans un passé lointain et la faire maintenant advenir, tandis que le roi assyrien accomplit la dévastation.
  alternative: Limiter l’affirmation à une simple prescience divine, ou supprimer toute agence du roi dans la dernière proposition.
  rationale: La succession « je l’ai faite… je l’ai façonnée… je l’ai fait arriver » attribue explicitement à Dieu l’origine et la réalisation de l’événement, sans nier le rôle historique du conquérant. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme temporel (« depuis longtemps… dès les jours anciens… maintenant ») et l’image artisanale de « façonner » maintiennent le ton prophétique. Le féminin des pronoms français préserve l’ambiguïté du référent hébreu.
