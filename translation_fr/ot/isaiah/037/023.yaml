source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: fr
  text: Qui as-tu insulté et outragé ? Contre qui as-tu élevé la voix et levé les yeux bien haut ? Contre le Saint d’Israël !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: as-tu insulté
  rationale: Le verbe חרף exprime ici l’affront verbal et le mépris. « Insulter » est naturel en français moderne et garde la force de l’accusation.
- source_word: וְגִדַּפְתָּ
  choice: et outragé
  rationale: גדף désigne l’outrage, notamment dirigé contre Dieu. « Outrager » préserve le caractère grave et sacrilège sans imposer un vocabulaire confessionnel spécialisé.
- source_word: הֲרִימוֹתָה קּוֹל
  choice: as-tu élevé la voix
  rationale: Rend directement l’expression hébraïque et conserve l’image d’une parole arrogante ou provocatrice.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: et porté bien haut tes regards
  rationale: La formulation conserve l’image physique du regard levé avec hauteur tout en restant idiomatique en français.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Titre caractéristique d’Ésaïe, rendu de manière formelle et traditionnelle sans explicitation ajoutée.
theological_decisions:
- issue: Portée de l’accusation finale
  choice: « Contre le Saint d’Israël ! » comme réponse emphatique aux questions
  alternative: Intégrer le syntagme à la seconde question sans phrase distincte
  rationale: L’hébreu place אֶל קְדוֹשׁ יִשְׂרָאֵל en position finale et culminante. La phrase exclamative reproduit cette force rhétorique sans modifier le référent.
- issue: Traduction de גדף
  choice: « outrager »
  alternative: « blasphémer »
  rationale: Le contexte est clairement celui d’un affront envers Dieu, mais le lexème peut désigner plus largement une injure grave. « Outrager » préserve cette étendue sémantique et évite de surspécifier.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme des deux questions est conservé, ainsi que la montée rhétorique vers l’identification finale du destinataire de l’arrogance.
