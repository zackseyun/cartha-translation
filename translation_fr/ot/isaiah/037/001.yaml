  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: fr
  text: Lorsque le roi Ézéchias entendit cela[a], il déchira ses vêtements, se couvrit de toile de sac et entra dans la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsque le roi Ézéchias entendit » ; l’objet du verbe est sous-entendu en hébreu et repris ici par « cela » d’après le contexte précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque… entendit
  rationale: La construction narrative וַיְהִי suivie de כ avec l’infinitif construit introduit ici la circonstance temporelle. En français actuel, « Lorsque… entendit » exprime naturellement cette fonction sans calquer inutilement « et il arriva ».
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: le roi Ézéchias
  rationale: Le titre suivi du nom propre se rend naturellement ainsi en français.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Traduction directe de l’expression décrivant le geste traditionnel de détresse ou de deuil.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: se couvrit d’une toile de sac
  rationale: Le hitpael exprime une action réflexive. « Toile de sac » désigne de manière compréhensible l’étoffe grossière portée en signe de deuil, sans ajouter une interprétation explicite.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: entra dans la maison de Yahweh
  rationale: בוא avec בֵּית indique ici l’entrée dans le sanctuaire; « entra dans » rend précisément le mouvement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en conserve la fonction de nom propre.
- issue: Portée symbolique des vêtements déchirés et de la toile de sac
  choice: Conserver les gestes sans les expliquer dans le corps du texte
  alternative: Ajouter « en signe de deuil » ou « de détresse »
  rationale: Le verset décrit les actes sans en expliciter lui-même le sens; la traduction évite donc de résoudre ou d’amplifier ce que le contexte laisse comprendre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative est fluide sans archaïsme; « maison de Yahweh » conserve l’expression cultuelle hébraïque, tandis que « toile de sac » reste accessible au lectorat contemporain.
