source:
  edition: WLC
  text: וְ/שִׁבְתְּ/ךָ֛ וְ/צֵאתְ/ךָ֥ וּ/בוֹאֲ/ךָ֖ יָדָ֑עְתִּי וְ/אֵ֖ת הִֽתְרַגֶּזְ/ךָ֥ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
translation:
  language: fr
  text: Mais je sais quand tu t’assieds, quand tu sors et quand tu entres, et je connais ta fureur contre moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: quand tu t’assieds
  rationale: L’infinitif construit de ישׁב avec suffixe conserve ici l’image concrète de la position assise. Dans la série avec la sortie et l’entrée, il évoque plus largement la vie établie et les mouvements ordinaires.
- source_word: וְצֵאתְךָ
  choice: quand tu sors
  rationale: L’infinitif construit de יצא désigne directement la sortie et forme une paire idiomatique avec l’entrée.
- source_word: וּבוֹאֲךָ
  choice: quand tu rentres
  rationale: L’infinitif construit de בוא est le pendant de « quand tu sors ». « Rentrer » rend naturellement en français le retour vers l’intérieur, sans perdre l’image du mouvement.
- source_word: יָדָעְתִּי
  choice: je sais … et je connais
  rationale: Le parfait qal à la première personne exprime ici une connaissance certaine et actuelle. La reprise de « je connais » devant le dernier complément rend la coordination naturelle en français tout en gardant celui-ci sous la portée du même verbe.
- source_word: הִתְרַגֶּזְךָ
  choice: ta fureur
  rationale: La forme hitpael nominalisée de רגז évoque une agitation furieuse ou un comportement rageur. « Fureur » exprime clairement sa force hostile sans la réduire à une simple émotion passagère.
- source_word: אֵלַי
  choice: contre moi
  rationale: Bien que אֶל signifie normalement « vers », l’orientation d’une fureur hostile se rend idiomatiquement par « contre moi ».
- source_word: וְאֵת
  choice: et je connais
  rationale: Le marqueur d’objet direct coordonne le dernier objet aux précédents. En français, la reprise du verbe explicite cette coordination sans attribuer un sens lexical autonome à אֵת.
theological_decisions:
- issue: Valeur temporelle de יָדָעְתִּי et connaissance divine
  choice: 'Présent : « je sais … et je connais »'
  alternative: « je savais » ou « j’ai connu »
  rationale: Dans cette déclaration, le parfait affirme la connaissance complète et certaine que le Seigneur a des actes et de l’hostilité du roi assyrien. Le présent communique naturellement cette portée sans ajouter de précision théologique étrangère au texte.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond au singulier masculin hébreu adressé au roi assyrien. La formulation conserve les images concrètes de l’hébreu, tandis que la note signale leur portée idiomatique plus large.
