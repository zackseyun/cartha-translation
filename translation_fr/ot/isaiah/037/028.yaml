review_pass:
  verdict: revise
  source_fidelity: La triade hébraïque « ton assise, ta sortie et ton entrée » est correctement comprise comme une série idiomatique décrivant la situation et les mouvements de la personne. « Ta fureur contre moi » rend bien הִתְרַגֶּזְךָ אֵלָי. Cependant, « quand tu rentres » introduit l’idée spécifique d’un retour, que בוא (« venir / entrer ») n’exprime pas nécessairement.
  naturalness: Le français est moderne et clair. Le remplacement de « tu rentres » par « tu entres » conserve une formulation naturelle tout en restant plus proche du mouvement indiqué par le texte source.
  terminology: « Fureur contre moi » est approprié pour l’hostilité exprimée par le hitpael de רגז. La note doit présenter des alternatives grammaticalement parallèles et ne pas ajouter le sens locatif « où » au premier élément.
  issues:
  - severity: low
    issue: « quand tu rentres » est plus étroit que le verbe hébreu בוא.
    rationale: « Rentrer » implique normalement un retour à son lieu de départ ou à son domicile, tandis que « entrer » rend sans cette implication le membre correspondant à « sortir ».
  - severity: low
    issue: La formulation de la note n’est pas parallèle et ajoute une nuance locative.
    rationale: « Où tu demeures » transforme le premier nom verbal en proposition locative, alors que les deux autres membres sont des noms. « Ton habitation, tes sorties et tes entrées » est plus cohérent et reflète mieux l’alternative idiomatique.
  revised_text: Mais je sais quand tu t’assieds, quand tu sors et quand tu entres, et je connais ta fureur contre moi.
  revised_footnotes:
  - marker: a
    text: Ou « ton habitation, tes sorties et tes entrées ». L’hébreu emploie une suite conventionnelle qui englobe la vie établie d’une personne et ses déplacements.
    reason: lexical_alternative
  revision_rationale: La révision évite l’implication de retour introduite par « rentrer » et corrige la note afin qu’elle présente une alternative idiomatique parallèle, sans modifier le sens du passage.
