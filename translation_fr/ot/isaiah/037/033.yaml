source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh au sujet du roi d’Assyrie : « Il n’entrera pas dans cette ville, il n’y tirera aucune flèche, il ne s’avancera pas contre elle avec un bouclier[a] et n’élèvera pas de rampe de siège contre elle[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne se présentera pas devant elle avec un bouclier ». L’expression hébraïque évoque l’approche d’une ville en vue de l’attaquer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « n’amassera pas de remblai contre elle ». Littéralement, l’hébreu dit : « ne versera pas contre elle une levée de siège ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien logique avec l’annonce précédente, tout en conservant la valeur déductive de l’hébreu.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique naturelle et digne en français moderne, équivalente à la tournure hébraïque de messager.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: au sujet du roi d’Assyrie
  rationale: Dans cette formule oraculaire, אֶל peut introduire la personne visée par la déclaration; le contenu parle du roi plutôt qu’il ne s’adresse directement à lui.
- source_word: לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  choice: Il n’entrera pas dans cette ville
  rationale: Rend clairement le mouvement vers l’intérieur de la ville et convient au contexte d’une invasion.
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: il n’y tirera aucune flèche
  rationale: Le verbe à cette forme signifie tirer une flèche; le pronom adverbial « y » reprend naturellement la ville et correspond à שָׁם.
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: il ne s’avancera pas contre elle avec un bouclier
  rationale: Conserve l’image militaire d’une approche protégée par un bouclier sans préciser indûment la tactique exacte.
- source_word: וְלֹא יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  choice: et n’élèvera pas de rampe de siège contre elle
  rationale: Rend idiomatiquement l’amoncellement d’un ouvrage de terre utilisé pour l’assaut, là où le verbe hébreu signifie littéralement « verser ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom propre sans le remplacer par un titre.
- issue: Destinataire ou sujet de l’oracle introduit par אֶל
  choice: au sujet du roi d’Assyrie
  alternative: au roi d’Assyrie
  rationale: L’énoncé qui suit parle du roi à la troisième personne. « Au sujet de » respecte cette orientation tout en reconnaissant que la préposition peut normalement signifier « à ».
translation_notes:
  register: Français international moderne, clair et solennel. La répétition hébraïque de la négation est maintenue dans chaque proposition, tandis que la coordination finale évite une lourdeur inutile. Les marqueurs de notes sont placés après les expressions réellement concernées.
