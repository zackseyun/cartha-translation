  text: וַ/יִּשְׁמַ֗ע עַל תִּרְהָ֤קָה מֶֽלֶךְ כּוּשׁ֙ לֵ/אמֹ֔ר יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יִּשְׁמַע֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/009.yaml
  text: And he heard concerning Tirhakah king of Cush[a], saying, “He has come out to fight against you.” And when he heard, he sent messengers to Hezekiah, saying[b],
translation:
  language: fr
  text: 'Il apprit au sujet de Tirhaqa, roi de Koush[a] : « Il est sorti pour te combattre[b]. » Lorsqu’il eut appris cette nouvelle, il envoya des messagers à Ézéchias pour lui dire :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi d’Éthiopie ». Le nom hébreu est Koush ; il désigne une région située au sud de l’Égypte et souvent associée à la Nubie ou à l’Éthiopie anciennes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « combattre avec toi » ; dans ce contexte militaire, le sens est « te combattre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Il apprit
  rationale: Dans ce récit, שׁמע désigne le fait de recevoir une nouvelle. « Apprit » est plus naturel en français que « entendit » tout en conservant le sens.
- source_word: עַל
  choice: au sujet de
  rationale: Avec שׁמע, la préposition introduit la personne à propos de laquelle la nouvelle est reçue.
- source_word: תִּרְהָקָה
  choice: Tirhaqa
  rationale: Translittération française proche de la forme hébraïque du nom propre.
- source_word: מֶלֶךְ כּוּשׁ
  choice: roi de Koush
  rationale: « Koush » conserve l’ethnonyme géographique hébreu sans l’identifier de manière réductrice à un État moderne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le discours rapporté qui suit, sans reproduire lourdement l’hébraïsme « en disant ».
- source_word: יָצָא
  choice: Il est parti
  rationale: Dans ce contexte militaire, יצא indique que Tirhaqa s’est mis en route; « est parti » exprime clairement ce mouvement.
- source_word: לְהִלָּחֵם
  choice: pour te combattre
  rationale: L’infinitif de לחם exprime ici le but militaire du départ.
- source_word: אִתָּךְ
  choice: te combattre
  rationale: Bien que la préposition signifie formellement « avec », l’action de combattre lui donne un sens adversatif, rendu idiomatiquement en français.
- source_word: וַיִּשְׁמַע
  choice: Après avoir appris cela
  rationale: La reprise du verbe marque que la nouvelle déclenche l’envoi des messagers. Cette formulation garde la répétition sémantique sans lourdeur.
- source_word: וַיִּשְׁלַח
  choice: il envoya
  rationale: Équivalent narratif direct et courant de שלח.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce cadre royal et politique, le mot désigne des émissaires humains, non des êtres célestes.
- source_word: אֶל חִזְקִיָּהוּ
  choice: à Ézéchias
  rationale: Forme française traditionnelle du nom et rendu naturel de la préposition אֶל.
