  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/הוּ וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
translation:
  language: fr
  text: Ézéchias prit les lettres des mains des messagers et les lut[a]. Puis il monta à la maison de Yahweh et les déploya devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un suffixe singulier après « lut » et après « déploya » : littéralement, « le lut » et « le déploya ». Il peut désigner collectivement le message contenu dans les lettres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: les lettres
  rationale: Le pluriel de סֵפֶר désigne ici les communications écrites apportées par les messagers assyriens. « Les lettres » est naturel en français et convient au contexte.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: des mains des messagers
  rationale: Cette formulation conserve l’image hébraïque de la remise en main propre tout en restant idiomatique en français.
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Dans ce récit historique, מַלְאָכִים désigne des représentants humains, non des anges. « Messagers » évite de préciser davantage leur statut.
- source_word: וַיִּקְרָאֵהוּ
  choice: et les lut
  rationale: Le verbe signifie ici « lire ». Bien que le suffixe hébreu soit singulier, il peut renvoyer collectivement au message écrit contenu dans les lettres; le pluriel français s’accorde naturellement avec « les lettres ».
- source_word: וַיַּעַל
  choice: il monta
  rationale: Le verbe עלה exprime un mouvement ascendant. « Monta » préserve ce sens, notamment le déplacement vers le sanctuaire.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction formelle « maison de Yahweh » conserve l’expression hébraïque et sa portée cultuelle sans la remplacer par l’explicitation « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: et les déploya
  rationale: פרשׂ signifie étendre ou déployer. Le pluriel français reprend « les lettres », tandis que le suffixe singulier hébreu envisage probablement leur contenu écrit comme un tout.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend de façon concise et naturelle l’idée de présentation en présence de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Nombre grammatical des objets lus et déployés
  choice: 'pluriel français : « les lut » et « les déploya »'
  alternative: 'singulier : « le lut » et « le déploya »'
  rationale: L’hébreu juxtapose le pluriel « lettres » et des suffixes singuliers, probablement parce que leur message est considéré collectivement. Le texte français suit l’antécédent pluriel, tandis qu’une note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français moderne, clair et digne. « Maison de Yahweh » conserve la forme concrète de l’hébreu; « déploya » évoque naturellement l’ouverture et l’étalement des documents. Le marqueur de note est placé après « les lut » et couvre aussi le second suffixe singulier.
