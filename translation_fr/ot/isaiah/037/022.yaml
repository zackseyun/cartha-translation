  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: fr
  text: 'Voici la parole que le SEIGNEUR a prononcée à son sujet : « La vierge, fille de Sion, te méprise et se moque de toi ; la fille de Jérusalem secoue la tête derrière toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, tout en le distinguant par les capitales.
- source_word: בְּתוּלַת בַּת־צִיּוֹן
  choice: la vierge, fille de Sion
  rationale: Conserve les deux éléments de l’expression hébraïque et son personnification poétique, avec une apposition naturelle en français.
- source_word: בָּזָה לְךָ לָעֲגָה לְךָ
  choice: Elle te méprise, elle se moque de toi
  rationale: Reproduit le parallélisme verbal et les pronoms de deuxième personne adressés au roi assyrien.
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  choice: derrière toi, elle hoche la tête
  rationale: Préserve l’image d’un geste de dérision accompli tandis que l’adversaire s’éloigne.
- source_word: בַּת יְרוּשָׁלִָם
  choice: la fille de Jérusalem
  rationale: Maintient la personnification parallèle à « fille de Sion ».
theological_decisions:
- issue: Référent du pronom עָלָיו
  choice: à son sujet
  alternative: contre lui
  rationale: L’hébreu peut introduire une parole concernant quelqu’un ou dirigée contre lui. « À son sujet » conserve ici la formulation la moins interprétative.
- issue: Personnification de Sion et de Jérusalem
  choice: Conserver les appellations féminines et poétiques
  alternative: Reformuler comme « les habitants de Sion/Jérusalem »
  rationale: Le texte personnifie explicitement la ville et ne doit pas être réduit à une explication en prose.
translation_notes:
  register: Français moderne, digne et oralement fluide. L’ordre est légèrement réorganisé pour identifier clairement le sujet féminin après les deux verbes, tout en conservant le parallélisme et l’effet poétique de l’hébreu.
