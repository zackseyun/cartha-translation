source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֔עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶלֶךְ אַשּׁ֖וּר אוֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: fr
  text: 'Ésaïe leur dit : « Vous direz ceci à votre maître : Ainsi parle Yahweh : “N’aie pas peur des paroles que tu as entendues, par lesquelles les serviteurs du roi d’Assyrie m’ont insulté[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’ont blasphémé » ou « m’ont défié ». Le verbe hébreu peut désigner des paroles outrageantes ou méprisantes dirigées contre Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְשַׁעְיָהוּ
  choice: Ésaïe leur dit
  rationale: Rend naturellement la progression narrative du wayyiqtol et conserve explicitement les destinataires.
- source_word: כֹּה תֹאמְרוּן
  choice: Vous direz ceci
  rationale: Formule de transmission claire et digne en français moderne, conservant la valeur injonctive du futur hébreu.
- source_word: אֶל אֲדֹנֵיכֶם
  choice: à votre maître
  rationale: Désigne ici Ézéchias comme supérieur humain des envoyés ; « maître » évite toute confusion avec un titre divin.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Conserve la formule prophétique solennelle et rend directement le nom divin.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Expression naturelle en français actuel qui garde la deuxième personne du singulier adressée à Ézéchias.
- source_word: מִפְּנֵי הַדְּבָרִים אֲשֶׁר שָׁמַעְתָּ
  choice: des paroles que tu as entendues
  rationale: « De » après « avoir peur » exprime idiomatiquement la cause de la crainte, tandis que « paroles » correspond au discours rapporté.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: les serviteurs du roi d’Assyrie
  rationale: Dans ce contexte diplomatique, נַעֲרִים désigne les subordonnés ou serviteurs du roi plutôt que leur âge.
- source_word: גִּדְּפוּ אֹתִי
  choice: m’ont insulté
  rationale: Le verbe exprime ici des paroles outrageantes et méprisantes dirigées contre Dieu ; « insulté » conserve sa portée concrète sans la réduire d’emblée à un terme religieux plus étroit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel divin sans le remplacer par un titre.
- issue: Portée de גִּדְּפוּ lorsque Dieu en est l’objet
  choice: m’ont insulté
  alternative: m’ont blasphémé / m’ont défié
  rationale: L’hébreu peut évoquer l’outrage verbal, le mépris ou la provocation. Le texte principal retient le français le plus large et naturel, tandis que la note préserve les nuances théologiques possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique « Ainsi parle Yahweh » conserve la solennité de l’original ; les paroles adressées à Ézéchias restent au singulier, tandis que l’ordre donné aux envoyés demeure au pluriel.
