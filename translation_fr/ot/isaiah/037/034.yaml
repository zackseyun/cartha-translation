source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר בָּ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָב֖וֹא נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: fr
  text: Par le chemin par lequel il est venu, il retournera, et il ne viendra pas dans cette ville — déclaration de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָּהּ
  choice: par le chemin par lequel il est venu
  rationale: Cette formulation naturelle en français conserve la répétition emphatique du chemin emprunté à l’aller, y compris la reprise pronominale exprimée en hébreu par בָּהּ.
- source_word: יָשׁוּב
  choice: il repartira
  rationale: Dans ce contexte de déplacement militaire, שׁוב indique qu’il fera le trajet en sens inverse. « Repartira » exprime clairement ce retour sans suggérer nécessairement une arrivée à son point d’origine.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  choice: et il n’entrera pas dans cette ville
  rationale: Avec une ville comme destination, « entrer dans » rend idiomatiquement אֶל avec בוא. Cela exprime le mouvement vers l’intérieur de la ville, sans sous-entendre qu’elle serait prise.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule prophétique solennelle qui présente l’énoncé comme une déclaration divine. Le nom propre יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; l’Éternel
  rationale: Le texte hébreu porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de לֹא יָבוֹא concernant la ville
  choice: il n’entrera pas dans cette ville
  alternative: il ne viendra pas vers cette ville
  rationale: Dans ce contexte, la construction אֶל avec בוא désigne naturellement l’entrée dans la ville. Le rendu n’ajoute toutefois aucune précision sur une conquête ou un siège.
translation_notes:
  register: Français international moderne, digne et direct. La structure parallèle du verset est conservée sans lourdeur excessive, et le tiret met en relief la formule prophétique finale.
