- from: Il repartira par le chemin par lequel il est venu, et il n’entrera pas dans cette ville — déclaration de Yahweh.
  to: Par le chemin par lequel il est venu, il retournera, et il ne viendra pas dans cette ville — déclaration de Yahweh.
