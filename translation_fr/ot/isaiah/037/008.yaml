  text: וַ/יָּ֨שָׁב֙ רַב שָׁקֵ֔ה וַ/יִּמְצָא֙ אֶת מֶ֣לֶךְ אַשּׁ֔וּר נִלְחָ֖ם עַל לִבְנָ֑ה כִּ֣י שָׁמַ֔ע כִּ֥י נָסַ֖ע מִ/לָּכִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/008.yaml
  text: Then the Rabshakeh returned and found the king of Assyria fighting against Libnah[b][a], for he had heard that he had departed from Lachish.
translation:
  language: fr
  text: Alors le Rab-Shaké[a] revint et trouva le roi d’Assyrie en train de combattre contre Libna[b], car il avait appris que le roi avait quitté Lakish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand échanson ». Le titre assyrien Rab-Shaké est traditionnellement translittéré ici, car il fonctionne comme un titre de cour et sert à désigner ce dignitaire dans le récit.
    reason: lexical_alternative
  - marker: b
    text: Ou « combattre à Libna ». L’expression hébraïque peut être rendue de manière plus locative, mais elle indique que le roi d’Assyrie livrait bataille contre la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le wayyiqtol de שוב poursuit la narration; « revint » exprime naturellement le retour de l’émissaire.
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Ce titre assyrien désigne ici le haut dignitaire déjà connu du récit. La translittération traditionnelle évite de préciser abusivement la nature exacte de sa charge.
- source_word: וַיִּמְצָא אֶת
  choice: trouva
  rationale: מצא suivi de la marque de l’objet direct signifie simplement « trouver » dans ce récit.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Traduction française usuelle et directe de la construction génitivale.
- source_word: נִלְחָם עַל
  choice: en train de combattre contre
  rationale: Le participe niphal de לחם avec על décrit un combat dirigé contre une ville; cette formulation conserve le sens hostile tout en marquant l’action en cours.
- source_word: לִבְנָה
  choice: Libna
  rationale: Translittération française conventionnelle du nom de lieu.
- source_word: כִּי שָׁמַע
  choice: car il avait appris
  rationale: Le premier כִּי introduit la raison, et le plus-que-parfait situe l’information reçue avant la scène principale.
- source_word: כִּי נָסַע
  choice: que le roi avait quitté
  rationale: Le second כִּי introduit le contenu appris. נסע évoque le départ ou la levée du camp; « avait quitté » convient au contexte militaire. La répétition de « le roi » clarifie le référent implicite sans modifier le sens.
- source_word: מִלָּכִישׁ
  choice: Lakish
  rationale: Translittération française conventionnelle du nom de lieu précédé de la préposition « de ».
