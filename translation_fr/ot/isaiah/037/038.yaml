id: ISA.37.38
reference: Isaiah 37:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר בָּנָי/ו֙ הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
translation:
  language: fr
  text: Il arriva que, pendant qu’il se prosternait[a] dans le temple[b] de Nisrok, son dieu, Adrammélek et Sarétser, ses fils, le frappèrent de l’épée, puis s’enfuirent au pays d’Ararat. Ésar-Haddôn, son fils, régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adorait »; le verbe hébreu peut mettre l’accent sur le geste de se courber ou de se prosterner dans l’adoration.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule rend la fonction narrative du wayyiqtol de היה dans un français actuel, sans recourir à l’expression vieillie « il advint que ».
- source_word: מִשְׁתַּחֲוֶה
  choice: se prosternait
  rationale: Le hitpael de שׁחה désigne ici un geste corporel d’adoration. « Se prosternait » conserve ce geste concret ainsi que sa portée cultuelle dans le contexte.
- source_word: בֵּית
  choice: le temple
  rationale: Littéralement « la maison », mais le contexte cultuel indique le sanctuaire de Nisrok. « Le temple » communique clairement ce référent en français moderne; le sens littéral est signalé en note.
- source_word: נִסְרֹךְ אֱלֹהָיו
  choice: Nisrok, son dieu
  rationale: Nisrok est traité comme un nom propre, et אֱלֹהָיו comme une apposition qui l’identifie comme le dieu de Sennachérib.
- source_word: אַדְרַמֶּלֶךְ
  choice: Adrammélek
  rationale: Translittération française usuelle du nom propre.
- source_word: שַׂרְאֶצֶר
  choice: Sarétser
  rationale: Translittération adaptée aux conventions phonographiques françaises.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne explicitement les fils du roi, et non ses enfants de façon générique.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: le frappèrent de l’épée
  rationale: La formulation conserve le sens de נכה, « frapper », tout en exprimant l’instrument indiqué par בַחֶרֶב; le contexte rend manifeste l’issue mortelle.
- source_word: נִמְלְטוּ
  choice: s’enfuirent
  rationale: Dans ce contexte, le nifal de מלט décrit leur fuite réussie après l’assassinat. « S’enfuirent » est naturel et conserve le mouvement implicite vers Ararat.
- source_word: אֶרֶץ אֲרָרָט
  choice: au pays d’Ararat
  rationale: « Pays d’Ararat » rend naturellement אֶרֶץ אֲרָרָט comme nom d’une région.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: régna à sa place
  rationale: Cette expression rend directement la succession royale indiquée par מלך et תַּחְתָּיו.
theological_decisions: []
