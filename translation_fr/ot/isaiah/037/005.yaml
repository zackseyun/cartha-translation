  text: Les serviteurs du roi Ézékias vinrent donc auprès d’Ésaïe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent donc
  rationale: Le wayyiqtol de בוא fait progresser le récit et se rend naturellement par le passé simple dans ce registre narratif. « Donc » exprime le lien avec l’ordre donné au verset précédent sans le surinterpréter.
- source_word: עַבְדֵי
  choice: les serviteurs
  rationale: Le pluriel construit de עבד désigne ici les hommes au service du roi. « Serviteurs » conserve le sens lexical sans préciser indûment leur rang administratif ni suggérer que leur statut servile est au premier plan.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: du roi Ézékias
  rationale: Cette formulation française rend naturellement le nom défini suivi du nom propre et emploie la forme française traditionnelle du nom royal.
- source_word: אֶל
  choice: auprès de
  rationale: Dans ce contexte de rencontre avec le prophète, « auprès de » rend naturellement la direction vers une personne; « chez » ou « vers » seraient également possibles.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
