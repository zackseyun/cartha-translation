  revision_rationale: La révision corrige la relation de Dieu aux royaumes, que le français « pour » rendait de manière trompeuse. « Trônes » souligne convenablement la portée royale de la formule participiale, tandis que la note préserve les possibilités spatiales sans en imposer une comme certaine.
