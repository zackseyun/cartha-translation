id: ISA.37.16
reference: Isaiah 37:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
translation:
  language: fr
  text: Yahweh des armées, Dieu d’Israël, toi qui trônes au-dessus des chérubins[a], c’est toi qui es Dieu, toi seul, sur tous les royaumes de la terre. C’est toi qui as fait les cieux et la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toi qui trônes sur les chérubins » ; selon l’image visée, on traduit aussi « toi qui demeures entre les chérubins ».
    reason: La formule יֹשֵׁב הַכְּרֻבִים décrit la présence royale de Yahweh en rapport avec les chérubins associés à l’arche. Le texte hébreu ne précise pas explicitement la relation spatiale.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Conserve le sens large du titre traditionnel, qui peut évoquer les armées ou puissances célestes sans en préciser excessivement le référent.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Rend directement la construction hébraïque, avec le sens singulier imposé par l’usage et le contexte.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: toi qui sièges au-dessus des chérubins
  rationale: Dans cette formule cultuelle et royale, le participe évoque le siège ou le trône de Yahweh associé aux chérubins. « Au-dessus » exprime naturellement l’image sans introduire dans le texte principal l’idée non explicitement prépositionnelle d’« entre ».
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: c’est toi qui es Dieu, toi seul
  rationale: La tournure disloquée reproduit en français l’insistance des pronoms hébreux et maintient explicitement l’exclusivité portée par לְבַדְּךָ.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: pour tous les royaumes de la terre
  rationale: Conserve la valeur relationnelle assez ouverte de la préposition לְ, plutôt que d’expliciter d’emblée une souveraineté par « sur », bien que celle-ci soit impliquée par le contexte.
- source_word: עָשִׂיתָ
  choice: as fait
  rationale: Rend précisément le verbe courant עשה, « faire », sans le remplacer par le verbe plus spécifique « créer ».
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: les cieux et la terre
  rationale: Préserve le pluriel hébreu de « cieux » et la formule cosmique du texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom personnel divin. Sa translittération distingue ce nom des titres et évite de substituer une interprétation confessionnelle.
- issue: Exclusivité divine dans אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: c’est toi qui es Dieu, toi seul
  alternative: tu es le seul Dieu
  rationale: Cette formulation garde à la fois l’emphase pronominale et l’affirmation d’exclusivité, sans transformer la syntaxe en définition théologique plus abstraite.
- issue: Relation de Dieu aux royaumes exprimée par לְ
  choice: pour tous les royaumes de la terre
  alternative: au-dessus de tous les royaumes de la terre
  rationale: « Pour » maintient l’indétermination relative de la préposition hébraïque; « au-dessus de » exprimerait plus explicitement la souveraineté impliquée, mais non formulée par une préposition spatiale dans ce membre de phrase.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à la prière biblique. Les reprises « toi » et « c’est toi » sont conservées pour rendre l’insistance de l’hébreu sans lourdeur excessive.
