  text: אַיֵּ֤ה מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, of Hena[b], and of Ivvah?
translation:
  language: fr
  text: Où est le roi de Hamath, le roi d’Arpad et le roi de la ville de Sepharvaïm, de Héna[a] et d’Ivva[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Héna peut aussi être transcrit « Hénah ».
    reason: lexical_alternative
  - marker: b
    text: Ivva est aussi transcrit « Avva » dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Où est
  rationale: L’adverbe interrogatif signifie « où ? ». Le singulier « est » s’accorde avec le premier sujet, « le roi », tout en introduisant une série de rois.
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Équivalent français courant de מֶלֶךְ. La triple répétition de l’hébreu est conservée pour maintenir la force rhétorique de l’énumération.
- source_word: חֲמָת
  choice: Hamath
  rationale: Transcription française usuelle de ce nom de lieu.
- source_word: אַרְפָּד
  choice: Arpad
  rationale: Transcription française usuelle de ce nom de lieu.
- source_word: לָעִיר
  choice: de la ville de
  rationale: Dans cette formule d’énumération, le ל préfixé est rendu comme introduisant le lieu auquel appartient le roi; cette tournure donne en français naturel « le roi de la ville de… ».
- source_word: סְפַרְוָיִם
  choice: Sepharvaïm
  rationale: Transcription française traditionnelle et lisible du nom propre, avec le tréma signalant la séparation des voyelles.
- source_word: הֵנַע
  choice: Héna
  rationale: Transcription adaptée aux conventions graphiques françaises; le nom est compris comme un lieu dans la série.
- source_word: עִוָּה
  choice: Ivva
  rationale: Transcription française courante du nom de lieu; une variante de transcription est signalée en note.
