id: ISA.37.20
reference: Isaiah 37:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֖/נוּ מִ/יָד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּֽי אַתָּ֥ה יְהוָ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
translation:
  language: fr
  text: Et maintenant, Yahweh notre Dieu, sauve-nous de sa main, afin que tous les royaumes de la terre sachent que toi seul, tu es Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien discursif וְ et la valeur temporelle de עַתָּה, dans une formulation naturelle de prière.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: Rend le nom divin par « Yahweh » et préserve l’adresse communautaire portée par le suffixe de première personne du pluriel.
- source_word: הוֹשִׁיעֵנוּ
  choice: sauve-nous
  rationale: L’impératif hiphil de ישׁע exprime ici une demande pressante de salut ou de délivrance; « sauve-nous » est direct et naturel.
- source_word: מִיָדוֹ
  choice: de sa main
  rationale: Préserve l’image hébraïque de la main comme pouvoir ou emprise, image compréhensible en français dans ce contexte.
- source_word: וְיֵדְעוּ
  choice: afin que … sachent
  rationale: Après l’impératif, la forme verbale exprime naturellement le but ou le résultat recherché.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: tous les royaumes de la terre
  rationale: Le contexte international favorise « terre » au sens universel plutôt que « pays ».
- source_word: כִּי אַתָּה יְהוָה לְבַדֶּךָ
  choice: que toi seul, tu es Yahweh
  rationale: La dislocation emphatique, naturelle en français, met clairement en relief l’exclusivité portée par לְבַדֶּךָ sans ajouter « Dieu », absent du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le Tétragramme comme nom propre; sa translittération préserve cette fonction plutôt que de lui substituer un titre.
- issue: Portée de לְבַדֶּךָ dans la proposition finale
  choice: toi seul, tu es Yahweh
  alternative: tu es Yahweh, toi seul
  rationale: Le français choisi maintient l’affirmation exclusive du texte tout en évitant de l’expliciter par l’ajout interprétatif « le seul Dieu ».
translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe garde le mouvement de la prière hébraïque et son image concrète de la « main », sans explicitation doctrinale ajoutée.
