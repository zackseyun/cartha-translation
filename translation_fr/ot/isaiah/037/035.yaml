source:
  edition: WLC
  text: וְ/גַנּוֹתִ֛י עַל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/035.yaml
  text: For I will defend this city to save it[b][a], for my own sake and for the sake of David my servant.
translation:
  language: fr
  text: Je protégerai cette ville pour la sauver[a], pour moi-même et pour David, mon serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la délivrer » ou « pour la secourir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי עַל
  choice: Je protégerai
  rationale: Le verbe גנן avec עַל exprime l’action de couvrir ou de protéger. « Protéger » est naturel en français et convient au contexte militaire sans imposer une image supplémentaire.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Le nom défini suivi du démonstratif se rend naturellement par « cette ville ».
- source_word: לְהוֹשִׁיעָהּ
  choice: pour la sauver
  rationale: 'L’infinitif de ישׁע exprime ici le but : sauver ou délivrer la ville; le pronom féminin « la » reprend correctement « ville ».'
- source_word: לְמַעֲנִי
  choice: à cause de moi-même
  rationale: Cette formulation conserve explicitement le motif centré sur Dieu sans ajouter une explication concernant son nom ou son honneur.
- source_word: וּלְמַעַן
  choice: et à cause de
  rationale: La répétition de « à cause de » préserve le parallélisme des deux motifs introduits par לְמַעַן.
- source_word: דָּוִד עַבְדִּי
  choice: David, mon serviteur
  rationale: Dans ce contexte royal et relationnel, « serviteur » rend עבד de façon juste et usuelle; la virgule convient à l’apposition en français.
theological_decisions:
- issue: Motif divin du salut de Jérusalem
  choice: à cause de moi-même et à cause de David, mon serviteur
  alternative: pour l’amour de moi et pour l’amour de David, mon serviteur
  rationale: Le texte énonce deux motifs, Dieu lui-même et David son serviteur. La traduction les maintient côte à côte sans expliquer ni résoudre leur portée théologique ou leur arrière-plan d’alliance.
translation_notes:
  register: Français international moderne, simple et digne. « Protéger » est immédiatement compréhensible; « sauver » conserve la portée large de ישׁע. Le waw initial n’est pas rendu séparément, puisque le verset fonctionne naturellement comme la continuation directe de la déclaration précédente.
