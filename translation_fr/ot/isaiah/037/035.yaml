  source_fidelity: 'Le sens global est fidèle. Toutefois, « à cause de moi-même » est moins précis et moins naturel ici que « pour moi-même » / « pour l''amour de moi-même » : לְמַעַנִי exprime le motif ou l''intérêt (« pour mon propre bien / à cause de moi »), et le parallélisme est mieux rendu par « pour moi-même et pour David ». « Protéger » rend bien וְגַנּוֹתִי, et « pour la sauver » rend correctement le but de לְהוֹשִׁיעָהּ.'
