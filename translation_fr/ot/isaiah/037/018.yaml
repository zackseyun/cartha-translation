id: ISA.37.18
reference: Isaiah 37:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת כָּל הָ/אֲרָצ֖וֹת וְ/אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/018.yaml
  text: Truly[a], O Yahweh, the kings of Assyria have laid waste all the lands and their own land[b],
translation:
  language: fr
  text: Il est vrai, Yahweh, que les rois d’Assyrie ont dévasté tous les pays et leur territoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « leur terre » ou « leur pays ». Le singulier peut être compris collectivement ; le passage parallèle est souvent rendu au pluriel : « leurs territoires ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְנָם
  choice: Il est vrai
  rationale: Cette tournure introduit naturellement en français l’affirmation emphatique, avec une nuance concessive adaptée à la prière d’Ézéchias.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: הֶחֱרִיבוּ
  choice: ont dévasté
  rationale: Le hiphil de חרב exprime ici le fait de réduire des territoires à la désolation dans un contexte militaire.
- source_word: מַלְכֵי אַשּׁוּר
  choice: les rois d’Assyrie
  rationale: Rend directement et naturellement l’état construit hébreu.
- source_word: אֶת כָּל הָאֲרָצוֹת
  choice: tous les pays
  rationale: אֲרָצוֹת peut désigner des terres, des territoires ou des pays ; le contexte politique et militaire favorise ici « pays ».
- source_word: וְאֶת אַרְצָם
  choice: et leur territoire
  rationale: Le singulier hébreu avec suffixe pluriel est conservé sous une forme française intelligible, sans le transformer silencieusement en pluriel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération préserve ce nom au lieu de lui substituer un titre.
- issue: Nombre de אַרְצָם
  choice: leur territoire
  alternative: leurs territoires
  rationale: Le texte massorétique fourni porte un nom au singulier avec un suffixe de troisième personne du pluriel. Le singulier collectif est donc maintenu, tandis que la possibilité d’un sens distributif est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Il est vrai… que » évite une formulation raide tout en gardant l’insistance de l’hébreu. « Territoire » dans le second membre limite la répétition maladroite de « pays » sans masquer le singulier du texte source.
