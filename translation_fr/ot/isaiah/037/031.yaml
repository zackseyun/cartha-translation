  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/031.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: fr
  text: Le reste rescapé de la maison de Juda prendra de nouveau racine vers le bas et portera du fruit vers le haut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָסְפָה
  choice: recommencera à
  rationale: Le verbe יסף exprime ici l’idée de faire de nouveau ou de poursuivre une action; « recommencera à » introduit naturellement les deux images coordonnées.
- source_word: פְּלֵיטַת … הַנִּשְׁאָרָה
  choice: le reste rescapé
  rationale: פְּלֵיטָה désigne collectivement ceux qui ont échappé au désastre, tandis que הַנִּשְׁאָרָה précise qu’ils subsistent encore. « Le reste rescapé » conserve les deux nuances sans lourde répétition.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Cette formulation garde l’expression collective et historico-nationale de l’hébreu.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: prendre racine en bas
  rationale: Le nom « racine » fonctionne dans une construction qui appelle en français l’expression verbale « prendre racine »; « en bas » préserve l’opposition verticale avec « en haut ».
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: et portera du fruit en haut
  rationale: « Porter du fruit » est l’équivalent idiomatique de עשה פרי et maintient l’image agricole concrète ainsi que son contraste directionnel.
theological_decisions:
- issue: Image métaphorique du rétablissement
  choice: Conserver l’image agricole de racines en bas et de fruit en haut.
  alternative: Expliciter abstraitement par « s’établira solidement et prospérera ».
  rationale: Le texte hébreu présente une image concrète de stabilité et de fécondité; la conserver évite de réduire sa richesse ou d’imposer une interprétation particulière.
translation_notes:
  register: Français moderne, digne et accessible. La construction poétique et le parallélisme vertical sont conservés. « Rescapé » rend la survie après le désastre sans introduire de précision doctrinale.
