revisions:
- from: Leurs habitants, privés de force[a], furent terrifiés et couverts de honte. Ils devinrent comme l’herbe des champs, comme la tendre verdure, comme l’herbe des toits et comme un champ desséché avant que les céréales ne se dressent[b].
  to: Leurs habitants, privés de force[a], furent abattus et couverts de honte. Ils furent comme l’herbe des champs, comme la tendre verdure, comme l’herbe des toits et comme un champ avant que les céréales ne soient sur pied[b].
  rationale: La révision évite de limiter חַתּוּ à la terreur et rend le terme difficile שְׁדֵמָה sans ajouter l’idée de dessèchement. Elle conserve le rythme des quatre comparaisons, l’ambiguïté du dernier membre et les deux ancres de notes.
