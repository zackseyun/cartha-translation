  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וָ/בֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵמָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/027.yaml
  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
translation:
  language: fr
  text: Leurs habitants, privés de force[a], furent abattus et couverts de honte. Ils furent comme l’herbe des champs, comme la tendre verdure, comme l’herbe des toits et comme un champ avant que les céréales ne soient sur pied[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « courts de main », expression hébraïque signifiant incapables d’agir ou sans puissance.'
    reason: lexical_alternative
  - marker: b
    text: La fin du verset est difficile en hébreu. Le mot rendu par « champ » peut désigner une terre cultivée; la relation exacte de l’expression « avant que les céréales ne soient sur pied » demeure discutée. Comparer 2 Rois 19.26.
    reason: textual_or_semantic_difficulty
lexical_decisions:
- source_word: יֹשְׁבֵיהֶן
  choice: leurs habitants
  rationale: Le participe de ישׁב avec suffixe féminin pluriel renvoie collectivement aux personnes qui habitaient les villes évoquées auparavant.
- source_word: קִצְרֵי יָד
  choice: privés de force
  rationale: L’expression signifie littéralement « courts de main » et désigne l’impuissance ou l’incapacité d’agir. La note conserve l’image hébraïque.
- source_word: חַתּוּ
  choice: furent terrifiés
  rationale: Le verbe חתת peut exprimer l’effroi, l’abattement ou le fait d’être brisé. « Furent terrifiés » rend naturellement ici l’effondrement intérieur des habitants face à la défaite sans imposer le sens physique de « brisés ».
- source_word: וָבֹשׁוּ
  choice: et couverts de honte
  rationale: בוש exprime la honte ou la disgrâce résultant de l’échec. Cette formulation française garde la valeur résultative.
- source_word: עֵשֶׂב שָׂדֶה
  choice: comme l’herbe des champs
  rationale: Rendu direct de la locution construite, qui évoque une végétation fragile et passagère.
- source_word: וִירַק דֶּשֶׁא
  choice: comme la tendre verdure
  rationale: יֶרֶק désigne ce qui est vert et דֶּשֶׁא la végétation fraîchement poussée. « Tendre verdure » restitue l’image sans répéter simplement « herbe ».
- source_word: חֲצִיר גַּגּוֹת
  choice: comme l’herbe des toits
  rationale: L’image désigne l’herbe poussant dans la faible couche de terre des toits, donc vite desséchée.
- source_word: וּשְׁדֵמָה
  choice: comme un champ desséché
  rationale: Le terme rare שְׁדֵמָה est difficile; dans cette série végétale, il est vraisemblablement lié à un champ atteint, desséché ou ravagé. La traduction retient ce sens probable tout en signalant l’incertitude en note.
- source_word: לִפְנֵי קָמָה
  choice: avant que les céréales ne se dressent
  rationale: קָמָה désigne la récolte ou les céréales sur pied. La formulation conserve l’idée d’une végétation détruite avant d’atteindre ce stade.
