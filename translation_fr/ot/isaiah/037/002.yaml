id: ISA.37.2
reference: Isaiah 37:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/אֵ֣ת שֶׁבְנָ֣א הַ/סּוֹפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/002.yaml
  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
translation:
  language: fr
  text: Il envoya alors Éliakim, l’intendant du palais[a], Shebna le secrétaire et les anciens parmi les prêtres, tous revêtus de toile de sac[b], auprès du prophète Ésaïe, fils d’Amots.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui était préposé à la maison ». Il s’agit du fonctionnaire chargé de la maison royale.'
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « couverts de toile de sac » ou « portant des vêtements de toile de sac ». Cette tenue exprimait le deuil ou l’humiliation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya alors
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative sans ajouter de lien causal explicite.
- source_word: אֶלְיָקִים
  choice: Éliakim
  rationale: Translittération française usuelle du nom propre.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: l’intendant du palais
  rationale: Cette expression désigne un haut fonctionnaire chargé de la maison royale. « Intendant du palais » communique clairement la fonction en français actuel, tandis que la note conserve la forme plus littérale.
- source_word: שֶׁבְנָא הַסּוֹפֵר
  choice: Shebna le secrétaire
  rationale: Dans ce contexte administratif royal, סֹפֵר désigne vraisemblablement un secrétaire officiel plutôt qu’un simple copiste.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: les anciens parmi les prêtres
  rationale: Cette formulation conserve le rapport syntaxique du groupe construit et laisse ouverte la nuance institutionnelle exacte, tout en restant compréhensible.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: tous revêtus de toile de sac
  rationale: Le participe décrit l’état collectif des hommes envoyés. « Revêtus de toile de sac » rend naturellement le signe visible de deuil ou d’humiliation; « tous » explicite uniquement la portée grammaticale du pluriel.
- source_word: אֶל יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: auprès du prophète Ésaïe, fils d’Amots
  rationale: « Auprès de » convient à l’envoi d’une délégation vers une personne. Le titre, le nom et le patronyme sont rendus sans modifier leur relation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les titres administratifs sont rendus de façon intelligible, avec une note pour l’idiome hébreu. La formulation « les anciens parmi les prêtres » préserve l’imprécision institutionnelle du texte source.
