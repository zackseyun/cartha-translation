  text: וַ/יִּסַּ֣ע וַ/יֵּ֔לֶךְ וַ/יָּ֖שָׁב סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יֵּ֖שֶׁב בְּ/נִֽינְוֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/037.yaml
  text: So Sennacherib king of Assyria departed and went and returned[a], and dwelt in Nineveh.
translation:
  language: fr
  text: Alors Sennachérib, roi d’Assyrie, leva le camp, partit et s’en retourna. Il resta à Ninive.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: leva le camp
  rationale: Le verbe נסע désigne souvent le fait de lever le camp ou de se mettre en route. « Leva le camp » rend ici distinctement le premier mouvement de la séquence.
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: הלך est le verbe courant « aller ». Dans cette succession de verbes de déplacement, « partit » donne une formulation française naturelle sans supprimer l’étape narrative.
- source_word: וַיָּשָׁב
  choice: s’en retourna
  rationale: שׁוב signifie ici retourner ou revenir. La forme « s’en retourna » indique le retrait vers son pays sans préciser dans le texte ce qui demeure implicite.
- source_word: סַנְחֵרִיב
  choice: Sennachérib
  rationale: Translittération française traditionnelle et courante du nom du roi assyrien.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: Rend directement la chaîne construite qui indique la fonction et le royaume de Sennachérib.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: ישׁב peut signifier s’asseoir, demeurer, habiter ou rester. Après le retour à Ninive, « resta » préserve la latitude entre séjour et résidence sans employer le littéraire « demeura ».
- source_word: בְּנִינְוֵה
  choice: à Ninive
  rationale: En français, la préposition idiomatique devant le nom de cette ville est « à » ; « Ninive » est la forme française consacrée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La succession des trois verbes hébreux de déplacement est conservée, tout en étant ponctuée naturellement en deux phrases. Aucun marqueur de note n’est requis.
