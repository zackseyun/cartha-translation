base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
translation:
  language: fr
  text: 'Et voici pour toi le signe : cette année, mange ce qui pousse de soi-même ; la deuxième année, ce qui repoussera[a]. Mais la troisième année, semez et moissonnez, plantez des vignes et mangez-en le fruit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu est rare et son sens précis est incertain. On pourrait aussi traduire : « la seconde pousse » ou « le regain » ; il semble désigner une production de seconde année, venue sans semailles ordinaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְךָ הָאוֹת
  choice: Et voici pour toi le signe
  rationale: La formulation conserve le singulier « pour toi », adressé à Ézéchias, ainsi que l’article défini de הָאוֹת. « Voici » rend naturellement la proposition nominale hébraïque qui introduit le signe.
- source_word: אָכוֹל
  choice: mangez
  rationale: L’infinitif absolu a ici une valeur injonctive ou prédictive. L’impératif français s’accorde avec la suite des impératifs pluriels et conserve la concision du texte.
- source_word: סָפִיחַ
  choice: ce qui pousse de soi-même
  rationale: Le terme désigne une production spontanée, sans semailles ordinaires. Cette expression est claire et garde l’image agricole.
- source_word: שָׁחִיס
  choice: ce qui repoussera
  rationale: Ce terme agricole rare semble désigner la pousse spontanée de la deuxième année. La traduction reste compréhensible sans lui attribuer une précision botanique incertaine.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: semez et moissonnez
  rationale: Les deux impératifs pluriels et leur parallélisme agricole sont reproduits directement.
- source_word: וְנִטְעוּ כְרָמִים
  choice: plantez des vignes
  rationale: Formulation française naturelle pour l’action d’établir des vignobles, tout en restant proche de l’hébreu.
- source_word: וְאִכְלוּ פִרְיָם
  choice: mangez-en le fruit
  rationale: Le pronom « en » renvoie naturellement aux vignes et rend le suffixe hébreu sans lourdeur.
