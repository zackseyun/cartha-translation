  terminology: « Ézékias », « détresse », « réprimande » et « mépris » sont des choix recevables. La note a doit toutefois présenter l’alternative pour la triade entière; la note b gagne à identifier plus précisément, sans surinterpréter, le terme imagé rendu par « moment de naître ».
