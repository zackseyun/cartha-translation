  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
translation:
  language: fr
  text: 'Ils lui dirent : « Voici ce que dit Ézékias : Ce jour est un jour de détresse, de réprimande et de mépris[a], car les enfants sont arrivés au moment de naître[b], et il n’y a pas de force pour les mettre au monde. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jour de détresse, de reproche et d’outrage »; les termes hébreux peuvent aussi évoquer une correction humiliante et le déshonneur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les enfants sont arrivés jusqu’au siège d’accouchement ». L’hébreu emploie une métaphore de l’accouchement parvenu au moment décisif, alors que la force manque pour donner naissance.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Ils lui dirent
  rationale: Rend directement le wayyiqtol narratif et son complément indirect, dans un français naturel et digne.
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: Voici ce que dit Ézékias
  rationale: Équivalent français courant de la formule de messager כֹּה אָמַר, avec sa valeur présente dans l’introduction d’un discours rapporté.
- source_word: יוֹם צָרָה
  choice: un jour de détresse
  rationale: צָרָה évoque une situation de détresse, d’adversité ou d’angoisse; « détresse » convient à la gravité de la crise nationale.
- source_word: וְתוֹכֵחָה
  choice: de réprimande
  rationale: תוֹכֵחָה peut désigner une réprimande, un reproche ou une correction. « Réprimande » conserve l’idée d’une correction humiliante sans préciser abusivement son auteur.
- source_word: וּנְאָצָה
  choice: de mépris
  rationale: נְאָצָה désigne le mépris, l’outrage ou la profanation. « Mépris » préserve ici l’ambiguïté quant à la cible et à la forme de l’outrage.
- source_word: הַיּוֹם הַזֶּה
  choice: Ce jour
  rationale: Conserve la mise en relief solennelle du syntagme démonstratif placé en tête.
- source_word: כִּי בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: Les enfants sont arrivés au moment de naître
  rationale: Restitue clairement la métaphore de l’accouchement. בָנִים désigne ici les enfants à naître, et מַשְׁבֵּר le point critique de l’enfantement.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: mais il n’y a pas de force pour les mettre au monde
  rationale: Achève naturellement en français la métaphore de l’accouchement tout en conservant l’absence de force exprimée par le texte.
theological_decisions:
- issue: Métaphore de l’accouchement appliquée à la crise nationale
  choice: Conserver explicitement l’image des enfants arrivés au moment de naître alors que la force manque pour les mettre au monde.
  alternative: 'Paraphraser : « Nous sommes arrivés au point critique et nous n’avons plus aucune force. »'
  rationale: Le texte hébreu décrit la détresse de Juda au moyen d’une image vive d’accouchement impossible. La maintenir préserve sa force rhétorique sans imposer une interprétation supplémentaire.
- issue: Sens de נְאָצָה dans la triade
  choice: mépris
  alternative: blasphème
  rationale: Le terme peut évoquer l’outrage ou, selon le contexte, le blasphème. « Mépris » garde l’étendue sémantique du mot et évite de déterminer sans nécessité que l’offense est exclusivement dirigée contre Dieu.
translation_notes:
  register: Français international moderne, naturel et solennel. La formule de messager est rendue idiomatiquement; la triade demeure concise, et la métaphore obstétricale est conservée sans être aplatie en simple déclaration d’impuissance.
