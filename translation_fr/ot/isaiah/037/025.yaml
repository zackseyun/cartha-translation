id: ISA.37.25
reference: Isaiah 37:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֥י קַ֖רְתִּי וְ/שָׁתִ֣יתִי מָ֑יִם וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
translation:
  language: fr
  text: Moi, j’ai creusé et bu de l’eau ; avec la plante de mes pieds, j’ai asséché tous les canaux[a] de l’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les bras du Nil » ou « tous les cours d’eau ». Le terme hébreu peut désigner le Nil ainsi que ses bras ou ses canaux.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : Mazor, probablement ici un nom poétique ou une autre forme du nom de l’Égypte, plutôt que « siège » ou « fortification ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, j’ai
  rationale: Le pronom indépendant אֲנִי est bien présent et met en relief l’arrogante affirmation du locuteur. La dislocation « Moi, j’ai » rend naturellement cette insistance en français.
- source_word: קַרְתִּי
  choice: j’ai creusé
  rationale: Dans ce contexte d’accès à l’eau, le verbe évoque le creusement d’un puits ou d’un conduit. « Creusé » reste concis et conserve l’objet implicite de l’hébreu.
- source_word: וְשָׁתִיתִי מָיִם
  choice: et bu de l’eau
  rationale: Cette formulation française naturelle rend directement l’action, מָיִם se traduisant ici comme un nom massif singulier.
- source_word: וְאַחְרִב
  choice: j’ai asséché
  rationale: Le hifil de חרב, appliqué à des cours ou conduits d’eau, signifie les rendre secs. « Asséché » restitue précisément l’image.
- source_word: בְּכַף פְּעָמַי
  choice: avec la plante de mes pieds
  rationale: כַּף, associé aux pieds, désigne leur dessous ou leur plante. Le pluriel « mes pieds » suit l’hébreu et préserve l’hyperbole.
- source_word: כֹּל
  choice: tous les
  rationale: « Tous les » convient naturellement au pluriel collectif qui suit.
- source_word: יְאֹרֵי
  choice: canaux
  rationale: יְאֹר désigne fréquemment le Nil ou ses canaux et bras dans un cadre égyptien. « Canaux » garde ici la coloration géographique, tandis qu’une note signale les autres rendus possibles.
- source_word: מָצוֹר
  choice: l’Égypte
  rationale: Dans l’expression יְאֹרֵי מָצוֹר, מָצוֹר est vraisemblablement un nom poétique ou une forme alternative désignant l’Égypte. La traduction géographique est claire, et la forme hébraïque est conservée en note.
