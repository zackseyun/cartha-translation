  text: בָּ/עֵ֣ת הַ/הִ֡וא שָׁלַ֡ח מְרֹדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ וַ/יִּשְׁמַ֕ע כִּ֥י חָלָ֖ה וַֽ/יֶּחֱזָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/001.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, for he heard that he had been sick and had recovered.
translation:
  language: fr
  text: À cette époque, Mérodak-Baladan, fils de Baladan, roi de Babylone, envoya des lettres et un cadeau à Ézéchias, car il avait appris qu’Ézéchias avait été malade et s’était rétabli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « était redevenu fort ». L’expression hébraïque désigne ici le rétablissement après une maladie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: À cette époque
  rationale: Formule temporelle naturelle en français moderne qui introduit le cadre narratif sans lourdeur.
- source_word: מְרֹדַךְ בַּלְאֲדָן
  choice: Merodak-Baladan
  rationale: Translittération proche de la forme hébraïque, avec une graphie claire pour le lectorat francophone.
- source_word: סְפָרִים
  choice: des lettres
  rationale: Dans ce contexte diplomatique royal, le mot désigne vraisemblablement de la correspondance écrite.
- source_word: וּמִנְחָה
  choice: et un cadeau
  rationale: Ici, מִנְחָה désigne un présent diplomatique, et non une offrande cultuelle.
- source_word: וַיִּשְׁמַע כִּי
  choice: car il avait appris que
  rationale: Le français explicite naturellement la valeur explicative du récit et rend כִּי comme introduisant le contenu de ce qui a été appris.
- source_word: חָלָה
  choice: avait été malade
  rationale: Le plus-que-parfait marque correctement que la maladie précédait l’envoi.
- source_word: וַיֶּחֱזָק
  choice: s’était rétabli
  rationale: Dans le contexte d’une maladie, le verbe « devenir fort » exprime idiomatiquement le rétablissement.
