id: ISA.39.6
reference: Isaiah 39:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑ל לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
translation:
  language: fr
  text: Voici que des jours viennent où tout ce qui est dans ta maison, ainsi que ce que tes pères ont amassé jusqu’à ce jour, sera emporté à Babylone. Il n’en restera rien, dit Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Introduit solennellement l’annonce prophétique tout en restant naturel et digne en français moderne.
- source_word: יָמִים בָּאִים
  choice: des jours viennent
  rationale: Reproduit de près l’idiome prophétique et la construction participiale hébraïque.
- source_word: וְנִשָּׂא
  choice: sera emporté
  rationale: Rend le niphal passif de נשׂא et le déplacement forcé des biens vers Babylone.
- source_word: כָּל אֲשֶׁר בְּבֵיתֶךָ
  choice: tout ce qui est dans ta maison
  rationale: Conserve le terme concret « maison » sans l’interpréter comme « palais » ou « biens ».
- source_word: וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ
  choice: ainsi que ce que tes pères ont amassé
  rationale: « Amassé » exprime l’accumulation et la mise en réserve impliquées par אָצַר; « tes pères » conserve le masculin historique explicite.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Rend directement l’idiome temporel qui présente l’accumulation comme se poursuivant jusqu’au présent.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française conventionnelle du nom de lieu.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Il n’en restera rien
  rationale: Expression française naturelle et énergique qui conserve la négation absolue de l’hébreu.
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: Le présent français convient à la formule prophétique; le nom divin est translittéré afin de représenter directement le tétragramme.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Terme historique genré אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: Le substantif hébreu est un masculin pluriel signifiant littéralement « tes pères »; le contexte n’impose pas sa neutralisation.
translation_notes:
  register: Français international moderne, solennel mais accessible. Tutoiement conservé parce que la parole s’adresse directement à Ézéchias. La syntaxe garde le rythme de l’annonce prophétique sans archaïsmes inutiles.
