  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יִקָּ֑חוּ וְ/הָיוּ֙ סָרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: fr
  text: Certains de tes fils, issus de toi, que tu engendreras, seront emmenés et seront eunuques[a] dans le palais du roi de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fonctionnaires de la cour ». Le terme hébreu peut désigner des eunuques au sens propre ou, dans certains contextes, des fonctionnaires royaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Certains de tes fils
  rationale: Le מִן partitif indique naturellement qu’il s’agit de quelques-uns parmi les fils d’Ézéchias. « Fils » conserve le terme hébreu sans l’élargir d’emblée à « descendants ».
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: issus de toi
  rationale: Cette expression généalogique concise rend l’idée de personnes qui procéderont d’Ézéchias lui-même, dans un français naturel et digne.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: que tu engendreras
  rationale: Le hifil de ילד avec un sujet masculin signifie « engendrer ». Ce choix garde la précision généalogique et la répétition du texte source.
- source_word: יִקָּחוּ
  choice: seront emmenés
  rationale: Le verbe actif à sujet indéfini se rend naturellement par un passif en français. « Emmenés » exprime ici la prise et le déplacement vers Babylone sans ajouter la violence explicite de « saisis ».
- source_word: וְהָיוּ
  choice: deviendront
  rationale: Avec un nom attribut, היה peut exprimer l’entrée dans un nouvel état. Le contexte de leur capture puis de leur statut au palais favorise « deviendront ».
- source_word: סָרִיסִים
  choice: eunuques
  rationale: C’est le sens premier et traditionnel du terme. Comme celui-ci peut aussi désigner des fonctionnaires royaux, cette autre possibilité est signalée en note.
- source_word: בְּהֵיכַל
  choice: dans le palais
  rationale: En relation avec le roi de Babylone, הֵיכָל désigne ici le palais royal et non un temple.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Cette formulation rend directement et naturellement la relation construite de l’hébreu.
theological_decisions:
- issue: Sens de סָרִיסִים dans la prophétie concernant la cour royale
  choice: eunuques dans le texte principal
  alternative: fonctionnaires de la cour
  rationale: Le mot peut désigner des eunuques au sens propre ou, par extension, des fonctionnaires royaux. Le sens premier est retenu dans le texte, tandis que la note préserve l’ambiguïté lexicale sans imposer une certitude excessive.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les deux expressions généalogiques successives du texte hébreu tout en évitant une syntaxe trop lourde.
