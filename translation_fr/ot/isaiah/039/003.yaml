base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: fr
  text: 'Alors le prophète Ésaïe vint trouver le roi Ézéchias et lui demanda : « Qu’ont dit ces hommes, et d’où sont-ils venus chez toi ? » Ézéchias répondit : « Ils sont venus chez moi d’un pays lointain, de Babylone. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל
  choice: vint trouver
  rationale: Exprime naturellement en français le mouvement d’Ésaïe vers le roi, sans ajouter d’idée absente du texte.
- source_word: מֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: d’où sont-ils venus chez toi ?
  rationale: Conserve la question sur le lieu d’origine ainsi que l’idée qu’ils sont venus auprès d’Ézéchias.
- source_word: אֶרֶץ רְחוֹקָה
  choice: un pays lointain
  rationale: Rend directement l’expression hébraïque et garde l’accent mis par Ézéchias sur l’éloignement.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française courante du nom géographique biblique.
