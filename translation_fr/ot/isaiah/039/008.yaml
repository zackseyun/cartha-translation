base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: fr
  text: 'Ézékias dit alors à Ésaïe : « La parole de l’Éternel que tu as prononcée est bonne. » Il dit encore : « Car il y aura paix et stabilité de mon temps. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: la parole de l’Éternel
  rationale: Rend naturellement l’expression prophétique hébraïque et représente le tétragramme selon une convention française largement reconnue.
- source_word: טוֹב
  choice: bonne
  rationale: Équivalent direct, qui conserve la brièveté et la tension de l’approbation d’Ézékias.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Correspond au sens central du terme dans ce contexte de sécurité et d’absence de calamité.
- source_word: אֱמֶת
  choice: stabilité
  rationale: Dans la paire « paix et ʾemet », le mot évoque ici ce qui est ferme, durable et sûr plutôt que la vérité propositionnelle.
- source_word: בְּיָמָי
  choice: pendant ma vie
  rationale: Expression française naturelle pour « dans mes jours », désignant la durée de la vie ou du règne d’Ézékias.
theological_decisions:
- issue: Statut de la seconde parole d’Ézékias
  choice: 'Puis il ajouta : « En effet… »'
  alternative: 'Car il se disait : « … »'
  rationale: Le texte massorétique emploie explicitement וַיֹּאמֶר, « et il dit »; la traduction conserve donc une parole prononcée sans la transformer en pensée intérieure, tout en laissant ouverte la portée morale de sa réaction.
- issue: Appréciation de la parole divine
  choice: « … est bonne »
  alternative: « … est juste »
  rationale: La formulation littérale préserve l’ambiguïté entre reconnaissance de la justice du jugement et soulagement personnel, sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Syntaxe fluide, avec maintien de la répétition hébraïque de l’acte de parole sous la forme naturelle « Puis il ajouta ». Aucun marqueur de note n’est requis.
