  text: וַ/יִּשְׂמַ֣ח עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת בֵּ֣ית נכת/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת הַ/שֶּׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ כָּל בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֹֽצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
translation:
  language: fr
  text: 'Ézéchias se réjouit à cause d’eux[a] et leur montra la salle de ses trésors[b] : l’argent, l’or, les aromates, l’huile précieuse, tout son arsenal[c] et tout ce qui se trouvait dans ses réserves[d]. Il n’y eut rien, dans sa maison ni dans tout son domaine[e], qu’Ézéchias ne leur montrât.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se réjouit à leur sujet » ou « fut content d’eux ». L’expression hébraïque peut désigner une joie causée par les envoyés, leurs présents ou leur venue, ou une satisfaction dirigée vers eux.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la maison de ses biens précieux » ; l’expression est traditionnellement comprise comme désignant sa salle du trésor.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « toute la maison de ses objets » ou « de ses équipements » ; le contexte et le récit parallèle de 2 Rois 20.13 conduisent souvent à comprendre « tout son arsenal ».
    reason: alternative_reading
  - marker: d
    text: Ou « ses trésoreries » ou « ses entrepôts ».
    reason: lexical_alternative
  - marker: e
    text: Ou « dans toute sa domination » ou « dans tout son royaume ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  choice: se réjouit à cause d’eux
  rationale: La construction שׂמח avec עַל peut exprimer une joie causée par les envoyés, leurs présents ou leur venue, ou une satisfaction dirigée vers eux. Cette formulation garde la nuance causale sans préciser davantage l’objet exact de la joie.
- source_word: וַיַּרְאֵם
  choice: leur montra
  rationale: Le hifil de ראה signifie couramment « faire voir », donc « montrer ».
- source_word: בֵּית נכתה
  choice: la salle de ses trésors
  rationale: L’expression désigne le lieu où sont conservés des biens précieux. « Salle de ses trésors » est naturel en français et la distingue des réserves mentionnées ensuite.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: l’argent, l’or
  rationale: Dans cet inventaire royal, les mots désignent les métaux précieux plutôt que la monnaie au sens générique.
- source_word: הַבְּשָׂמִים
  choice: les aromates
  rationale: Le terme désigne largement des substances aromatiques; « aromates » convient à des produits précieux sans imposer l’idée moderne d’épices culinaires.
- source_word: הַשֶּׁמֶן הַטּוֹב
  choice: l’huile précieuse
  rationale: Littéralement « la bonne huile »; dans cette liste de richesses, l’adjectif indique vraisemblablement une huile de qualité et de valeur.
- source_word: כָּל בֵּית כֵּלָיו
  choice: tout son arsenal
  rationale: Littéralement, la formulation évoque la « maison de ses objets ou équipements ». Le contexte royal et le parallèle de 2 Rois 20.13 soutiennent le sens d’arsenal, tout en justifiant une note.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: tout ce qui se trouvait dans ses réserves
  rationale: אֹצָר peut désigner un trésor, un dépôt ou une réserve. « Réserves » évite de répéter « trésors » et conserve la portée générale du terme.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Il n’y eut rien ... qu’Ézéchias ne leur montrât
  rationale: Cette construction française rend naturellement et avec emphase la double négation hébraïque.
- source_word: בְּבֵיתוֹ
  choice: dans sa maison
  rationale: Le mot hébreu signifie littéralement « maison »; dans le cadre royal, il peut inclure le palais, mais la traduction ne réduit pas explicitement ce sens.
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  choice: dans tout le territoire sous son autorité
  rationale: מֶמְשָׁלָה peut désigner la domination, la sphère de gouvernement ou le royaume. Cette expression française concrète conserve l’idée de tout ce qui relevait de son pouvoir.
