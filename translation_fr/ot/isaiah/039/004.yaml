base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/004.yaml
  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
translation:
  language: fr
  text: 'Il demanda : « Qu’ont-ils vu dans ta maison[a] ? » Ézékias répondit : « Ils ont vu tout ce qui est dans ma maison. Il n’y avait rien dans mes trésors que je ne leur aie montré. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ton palais ». L’hébreu dit littéralement « dans ta maison » ; dans un contexte royal, ce mot peut désigner le palais.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: Qu’ont-ils vu
  rationale: L’interrogatif מָה et le parfait רָאוּ sont rendus naturellement en français par une question au passé composé, qui présente l’action accomplie comme pertinente dans l’échange présent.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: dans ta maison / dans ma maison
  rationale: בַּיִת signifie littéralement « maison » et peut, dans un contexte royal, désigner le palais. Le texte principal conserve le terme concret et répété de l’hébreu, tandis qu’une note signale la nuance contextuelle.
- source_word: חִזְקִיָּהוּ
  choice: Ézékias
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: tout ce qui est dans ma maison
  rationale: Cette formulation conserve la totalité exprimée par כָּל אֲשֶׁר tout en restant naturelle en français.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הִרְאִיתִים
  choice: Il n’y a rien … que je ne leur aie montré
  rationale: La double négation hébraïque est reproduite par une construction française idiomatique et emphatique. Le subjonctif passé convient après « rien que… ne ».
- source_word: בְּאוֹצְרֹתָי
  choice: dans mes trésors
  rationale: אוֹצָר peut désigner un trésor, un dépôt ou une réserve. Au pluriel et dans ce contexte royal, « trésors » conserve l’ambiguïté entre les richesses et les lieux où elles sont gardées.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le dialogue reste direct, la répétition de « maison » est conservée, et le passé composé rend naturellement les parfaits hébreux dans cet échange.
