id: ISA.39.5
reference: Isaiah 39:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/005.yaml
  text: Then Isaiah said to Hezekiah[b][a], “Hear the word of Yahweh of Hosts.”
translation:
  language: fr
  text: 'Alors Ésaïe dit à Ézéchias : « Écoute la parole de Yahvé[a] des armées[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: 'Le titre « Yahvé des armées » présente Yahvé comme le souverain des armées ou puissances célestes et terrestres. On peut aussi traduire : « Yahvé des puissances ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors … dit » exprime naturellement la succession en français moderne.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française courante du nom du prophète.
- source_word: אֶל חִזְקִיָּהוּ
  choice: à Ézéchias
  rationale: La préposition אֶל introduit ici le destinataire de la parole; « Ézéchias » est la forme française courante du nom du roi.
- source_word: שְׁמַע
  choice: Écoute
  rationale: Impératif masculin singulier de שׁמע. « Écoute » rend clairement l’ordre d’accueillir avec attention le message prophétique.
- source_word: דְּבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne le message prononcé par Dieu. « La parole » conserve l’expression biblique établie tout en restant intelligible.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, choisie plutôt que son remplacement silencieux par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, le pluriel désigne les puissances ou armées placées sous l’autorité de Dieu, célestes comme terrestres. Cette formulation est naturelle et transparente en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre YHWH. Le conserver sous la forme française « Yahvé » distingue le nom divin du titre אֲדֹנָי, tout en signalant en note la tradition de traduction.
- issue: Sens du titre יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: Yahvé des puissances
  rationale: « Des armées » rend directement צְבָאוֹת sans limiter nécessairement le titre aux seules forces humaines; une note explicite sa portée céleste et terrestre.
translation_notes:
  register: Français international moderne, digne et direct. « Écoute » convient mieux que le plus littéral mais moins naturel « Entends » dans une adresse prophétique. La ponctuation française place une espace avant les deux-points et encadre la citation de guillemets français.
