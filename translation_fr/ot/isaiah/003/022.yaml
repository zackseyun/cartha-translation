  text: the festal robes[a], and the cloaks, and the shawls[d][c][b], and the purses.
translation:
  language: fr
  text: les robes de fête[a], les manteaux[b], les châles[c] et les bourses[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « robes raffinées ». Le terme hébreu désigne probablement des vêtements spéciaux et coûteux plutôt que des habits ordinaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « vêtements enveloppants ».
    reason: lexical_alternative
  - marker: c
    text: Ou « foulards » ou « voiles ». Le type exact d’accessoire en tissu est incertain.
    reason: lexical_alternative
  - marker: d
    text: Ou « sacs » ou « pochettes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַּחֲלָצוֹת
  choice: robes de fête
  rationale: Le nom désigne vraisemblablement des vêtements spéciaux et coûteux, portés lors d’occasions festives ou solennelles. « Robes de fête » exprime naturellement cette distinction sans reprendre une formulation traditionnelle obscure.
- source_word: מַּעֲטָפוֹת
  choice: manteaux
  rationale: Dérivé d’une racine évoquant l’action d’envelopper, le terme désigne un vêtement extérieur. « Manteaux » est clair et naturel, tout en conservant l’idée d’un vêtement enveloppant.
- source_word: מִּטְפָּחוֹת
  choice: châles
  rationale: Le terme désigne une pièce d’étoffe servant à couvrir ou à envelopper. « Châles » convient à cette liste d’accessoires vestimentaires sans préciser à tort qu’il s’agit nécessairement de voiles couvrant le visage.
- source_word: חֲרִיטִים
  choice: bourses
  rationale: Le nom désigne des sacs ou pochettes destinés notamment à transporter de l’argent ou des objets précieux. « Bourses » est précis dans ce contexte d’objets de luxe.
