  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
translation:
  language: fr
  text: 'Yahweh dit : « Parce que les filles de Sion sont hautaines, marchent le cou tendu, lançant des œillades[a], avancent à petits pas affectés et font tinter leurs pas[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est rare. Elle peut désigner des regards aguicheurs ou trompeurs.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « font tinter leurs anneaux de cheville ». Le verbe hébreu évoque probablement un tintement produit par des ornements portés aux chevilles, mais ceux-ci ne sont pas explicitement nommés dans ce verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: יַעַן כִּי
  choice: Parce que
  rationale: Introduit naturellement en français la cause du jugement annoncé dans la suite du passage.
- source_word: גָבְהוּ בְּנוֹת צִיּוֹן
  choice: les filles de Sion sont hautaines
  rationale: Conserve l’expression « filles de Sion » et rend la hauteur métaphorique par l’orgueil visé dans le contexte.
- source_word: נטוות גָּרוֹן
  choice: le cou tendu
  rationale: Préserve l’image d’une posture ostensiblement fière dans une formulation française naturelle.
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  choice: lançant des œillades
  rationale: Rend le mouvement affecté des yeux sans imposer dans le texte l’interprétation plus précise de regards séducteurs ou trompeurs.
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  choice: elles avancent à petits pas affectés
  rationale: Exprime la démarche à pas courts suggérée par טפף ainsi que son caractère recherché dans ce contexte.
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  choice: font entendre un tintement à chacun de leurs pas
  rationale: Conserve l’effet sonore probable sans introduire explicitement des anneaux de cheville, qui ne sont pas nommés dans le verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom personnel est conservé sous une translittération française courante, au lieu d’être remplacé par un titre.
