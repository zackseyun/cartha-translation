source:
  edition: WLC
  text: וְ/הָיָה֩ תַ֨חַת בֹּ֜שֶׂם מַ֣ק יִֽהְיֶ֗ה וְ/תַ֨חַת חֲגוֹרָ֤ה נִקְפָּה֙ וְ/תַ֨חַת מַעֲשֶׂ֤ה מִקְשֶׁה֙ קָרְחָ֔ה וְ/תַ֥חַת פְּתִיגִ֖יל מַחֲגֹ֣רֶת שָׂ֑ק כִּי תַ֖חַת יֹֽפִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
translation:
  language: fr
  text: Alors, au lieu du parfum, il y aura la pourriture ; au lieu d’une ceinture, une corde[a] ; au lieu d’une coiffure élaborée, la calvitie[b] ; au lieu d’un vêtement somptueux, une ceinture de toile de sac ; une marque de brûlure au lieu de la beauté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cordon ». Le mot hébreu est rare et pourrait aussi évoquer la trace laissée par une corde, signe d’humiliation.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile et pourrait désigner plus largement une parure travaillée ou un vêtement finement ouvragé ; son opposition à « la calvitie » favorise ici le sens de coiffure élaborée.
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition est très difficile en hébreu : le texte massorétique se termine littéralement par « car/au lieu de beauté », sans nom explicite pour ce qui la remplace. On comprend souvent « une marque de brûlure au lieu de la beauté » ; d’autres traductions donnent un sens plus général, comme « la honte au lieu de la beauté ».'
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  choice: parfum
  rationale: Le nom désigne un parfum aromatique ou un baume ; « parfum » est naturel en français moderne et forme un contraste net avec la pourriture.
- source_word: מַק
  choice: pourriture
  rationale: Le terme exprime la décomposition ou la putréfaction. « Pourriture » conserve l’image concrète plutôt que de n’en rendre que l’effet olfactif.
- source_word: חֲגוֹרָה
  choice: ceinture
  rationale: Terme général désignant ce qui se porte autour de la taille ; « ceinture » est clair et actuel.
- source_word: נִקְפָּה
  choice: corde
  rationale: Ce nom rare est généralement compris comme une corde ou un cordon grossier remplaçant la ceinture d’apparat ; son incertitude est signalée en note.
- source_word: מַעֲשֶׂה מִקְשֶׁה
  choice: coiffure élaborée
  rationale: L’expression est difficile, mais son opposition à la calvitie et le contexte des parures favorisent une coiffure soigneusement travaillée.
- source_word: קָרְחָה
  choice: un crâne chauve
  rationale: Le nom signifie la calvitie. Cette formulation française donne une image concrète et s’intègre naturellement à la série.
- source_word: פְּתִיגִיל
  choice: vêtement somptueux
  rationale: Ce terme rare paraît désigner un vêtement précieux ou d’apparat ; la traduction garde cette idée sans préciser indûment sa coupe.
- source_word: מַחֲגֹרֶת שָׂק
  choice: un sac noué autour de la taille
  rationale: Littéralement, il s’agit d’une façon de se ceindre de toile de sac. La formulation explicite en français l’habit de deuil et d’humiliation.
- source_word: כִּי תַחַת יֹפִי
  choice: une marque au fer au lieu de la beauté
  rationale: La finale hébraïque est elliptique et difficile. « Marque au fer » rend l’interprétation contextuelle traditionnelle d’une flétrissure remplaçant la beauté, tout en signalant l’incertitude en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et concret. La structure répétitive « au lieu de » conserve la cadence des renversements du texte hébreu. Les termes rares ou incertains ne sont pas surinterprétés et font l’objet de notes.
