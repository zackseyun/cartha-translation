- source_word: הַטַּבָּעוֹת
  choice: les bagues
  rationale: טַבָּעוֹת désigne des anneaux ou bagues. Dans cette liste de parures féminines, « bagues » est naturel en français et évite de préciser sans certitude qu’il s’agit de chevalières.
- source_word: וְנִזְמֵי הָאָף
  choice: et les anneaux de nez
  rationale: נִזְמֵי désigne ici des anneaux ou ornements, et le complément הָאָף précise qu’ils sont portés au nez. « Anneaux de nez » rend concrètement et clairement cette parure en français moderne.
- source_word: הָאָף
  choice: nez
  rationale: אָף a ici son sens anatomique ordinaire, « nez ». « Narine » serait plus précis que ne l’exige le texte.
