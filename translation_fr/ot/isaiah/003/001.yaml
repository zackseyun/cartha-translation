source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה הָ/אָד֜וֹן יְהוָ֣ה צְבָא֗וֹת מֵסִ֤יר מִ/ירוּשָׁלִַ֨ם֙ וּ/מִ֣/יהוּדָ֔ה מַשְׁעֵ֖ן וּ/מַשְׁעֵנָ֑ה כֹּ֚ל מִשְׁעַן לֶ֔חֶם וְ/כֹ֖ל מִשְׁעַן מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: fr
  text: 'Car voici que le Seigneur, l’Éternel des armées, va retirer de Jérusalem et de Juda tout appui et toute ressource : toute ressource en pain et toute ressource en eau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici que
  rationale: Conserve à la fois le lien explicatif de כִּי et la force présentative de הִנֵּה dans un français naturel et solennel.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: le Seigneur, l’Éternel, le maître des armées
  rationale: Distingue le titre הָאָדוֹן du nom divin יהוה et rend צְבָאוֹת selon son sens militaire, sans limiter explicitement les armées à une seule sphère.
- source_word: מֵסִיר
  choice: va retirer
  rationale: Le participe hébreu présente l’action comme imminente ou en cours; le futur proche exprime ici naturellement l’annonce prophétique.
- source_word: מַשְׁעֵן וּמַשְׁעֵנָה
  choice: tout appui et toute ressource
  rationale: Le couple masculin-féminin forme probablement une expression englobante. « Appui et ressource » préserve le parallélisme sans reproduire artificiellement deux quasi-synonymes de même racine.
- source_word: כֹּל מִשְׁעַן לֶחֶם וְכֹל מִשְׁעַן מָיִם
  choice: toute réserve de pain et toute réserve d’eau
  rationale: Dans ce contexte de privation matérielle, מִשְׁעַן désigne ce sur quoi la population compte pour subsister; « réserve » rend clairement cette idée en français.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: l’Éternel
  alternative: YHWH / Yahvé
  rationale: « L’Éternel » est une forme française reconnue et dignifiée qui distingue le nom divin du titre « Seigneur », sans imposer une vocalisation reconstruite.
- issue: Référent de צְבָאוֹת
  choice: le maître des armées
  alternative: le Seigneur des armées célestes
  rationale: Le texte ne précise pas ici « célestes »; la formulation retenue conserve l’étendue possible du titre et évite de résoudre cette ambiguïté.
translation_notes:
  register: Français moderne international, clair et digne. La structure accumulative du verset et la distinction entre le titre divin et le nom propre sont conservées.
