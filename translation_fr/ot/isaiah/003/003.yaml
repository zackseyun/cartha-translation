id: ISA.3.3
reference: Isaiah 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שַׂר חֲמִשִּׁ֖ים וּ/נְשׂ֣וּא פָנִ֑ים וְ/יוֹעֵ֛ץ וַ/חֲכַ֥ם חֲרָשִׁ֖ים וּ/נְב֥וֹן לָֽחַשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/003.yaml
  text: the captain of fifty[a], and the man of rank, and the counselor, and the skillful craftsman, and the expert enchanter.
translation:
  language: fr
  text: le chef de cinquante, le dignitaire, le conseiller, l’artisan habile et l’expert en incantations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui sait murmurer des formules ». L’hébreu désigne littéralement une personne avisée ou experte dans le murmure, probablement celui d’incantations.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  choice: le chef de cinquante
  rationale: שַׂר désigne un chef ou un officier et חֲמִשִּׁים, « cinquante ». Cette formulation conserve la structure numérique et le probable sens militaire ou administratif sans préciser davantage que l’hébreu.
- source_word: נְשׂוּא פָנִים
  choice: le dignitaire
  rationale: L’expression signifie littéralement « élevé de visage » et désigne une personne honorée ou de haut rang. « Dignitaire » rend naturellement ce statut social en français moderne.
- source_word: יוֹעֵץ
  choice: le conseiller
  rationale: Le participe désigne celui qui donne des conseils. « Conseiller » est direct et convient à cette énumération de figures influentes.
- source_word: חֲכַם חֲרָשִׁים
  choice: l’artisan habile
  rationale: חֲכַם peut exprimer la sagesse ou l’habileté, tandis que חֲרָשִׁים renvoie aux artisans. Dans ce contexte technique, « habile » exprime mieux la compétence pratique que « sage ».
- source_word: נְבוֹן לָחַשׁ
  choice: l’expert en incantations
  rationale: נְבוֹן exprime le discernement ou l’expertise, et לָחַשׁ peut désigner un murmure, une formule murmurée ou une incantation. La traduction retient le sens rituel ou magique probable tout en signalant l’ambiguïté lexicale en note.
theological_decisions:
- issue: Terme associé à une pratique magique
  choice: l’expert en incantations
  alternative: celui qui sait murmurer des formules
  rationale: Le texte paraît désigner une personne experte en formules murmurées ou en charmes. La traduction ne banalise pas cette pratique, mais n’ajoute non plus aucun jugement moral qui ne soit pas formulé dans ce verset.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération nominale et le singulier représentatif de chaque fonction sont conservés. La note est placée après le syntagme qu’elle explique.
