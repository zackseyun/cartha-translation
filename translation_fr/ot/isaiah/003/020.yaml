  text: the headdresses[a], the ankle chains, the sashes, the perfume boxes[b], and the amulets.
translation:
  language: fr
  text: les coiffures d’apparat, les chaînettes de cheville, les ceintures, les boîtes à parfum[a] et les amulettes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « maisons de la vie » ou « maisons de l’âme »; il s’agit probablement de petits récipients à parfum ou à substances odorantes.
    reason: lexical_alternative
  - marker: b
    text: Ou « charmes ». Le mot hébreu est lié au murmure ou à l’incantation et peut désigner des objets associés à des formules magiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  choice: les coiffures d’apparat
  rationale: Le terme désigne ici des parures, vraisemblablement portées sur la tête. « Coiffures d’apparat » est naturel en français moderne et conserve l’idée d’ornement sans imposer la forme plus précise d’un turban.
- source_word: הַצְּעָדוֹת
  choice: les chaînettes de cheville
  rationale: Dérivé d’une racine liée au pas, le mot désigne probablement des bijoux portés aux chevilles. « Chaînettes de cheville » exprime concrètement leur forme probable.
- source_word: הַקִּשֻּׁרִים
  choice: les ceintures
  rationale: Le mot vient d’une racine signifiant « attacher, nouer ». Dans cette liste vestimentaire, « ceintures » rend naturellement un accessoire servant à nouer ou serrer, sans employer un terme archaïque.
- source_word: בָּתֵּי הַנֶּפֶשׁ
  choice: les boîtes à parfum
  rationale: L’expression signifie littéralement « maisons de la vie/de l’âme ». Dans cette liste de parures, elle désigne probablement de petits récipients contenant du parfum ou des substances odorantes; l’expression littérale est conservée en note.
- source_word: הַלְּחָשִׁים
  choice: les amulettes
  rationale: Le terme est lié au murmure ou à l’incantation. Dans une liste d’objets portés, « amulettes » désigne vraisemblablement des objets associés à des formules magiques, tout en laissant l’arrière-plan lexical en note.
theological_decisions:
- issue: Connotation occulte possible de הַלְּחָשִׁים
  choice: « amulettes » dans le texte principal, avec mention de l’incantation en note
  alternative: « charmes » ou « incantations murmurées »
  rationale: Le contexte énumère des objets de parure retirés lors du jugement; un objet concret convient donc mieux qu’un acte verbal. La note préserve cependant le lien du mot hébreu avec le murmure et l’incantation, sans neutraliser ni exagérer sa portée religieuse.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit le rythme d’une énumération nominale et emploie des termes concrets. Les deux expressions hébraïques les plus obscures sont explicitées par des notes, dont les marqueurs figurent dans le texte.
