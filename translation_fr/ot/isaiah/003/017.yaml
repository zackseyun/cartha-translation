id: ISA.3.17
reference: Isaiah 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שִׂפַּ֣ח אֲדֹנָ֔/י קָדְקֹ֖ד בְּנ֣וֹת צִיּ֑וֹן וַ/יהוָ֖ה פָּתְ/הֵ֥ן יְעָרֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
translation:
  language: fr
  text: Alors le Seigneur couvrira de croûtes le sommet de la tête des filles de Sion, et Yahweh mettra à nu leurs parties intimes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leur nudité ». Le terme hébreu est difficile : certains y voient plus précisément un euphémisme désignant les parties intimes, tandis que d’autres le comprennent comme « leur front ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׂפַּח
  choice: couvrira de croûtes
  rationale: Le verbe exprime ici l’infliction d’une affection croûteuse ou analogue à la gale. Cette tournure française est claire, concrète et conserve la force punitive du passage.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Ce titre divin désigne Dieu comme souverain maître et reste distinct du nom divin יהוה employé dans la proposition suivante.
- source_word: קָדְקֹד
  choice: le sommet de la tête
  rationale: Le nom désigne le haut ou le sommet de la tête. Cette formulation évite l’ambiguïté que pourrait créer « couronne » en français.
- source_word: בְּנוֹת צִיּוֹן
  choice: les filles de Sion
  rationale: La traduction littérale préserve l’expression poétique et collective du texte prophétique sans la réduire d’emblée à « les femmes de Sion ».
- source_word: וַיהוָה
  choice: et Yahweh
  rationale: Le nom divin est translittéré afin de préserver sa distinction formelle avec אֲדֹנָי, rendu juste auparavant par « le Seigneur ».
- source_word: פָּתְהֵן
  choice: leurs parties intimes
  rationale: Dans ce contexte d’humiliation et avec le verbe « mettre à nu », le terme difficile paraît désigner par euphémisme les parties intimes. L’incertitude lexicale est signalée en note.
- source_word: יְעָרֶה
  choice: mettra à nu
  rationale: Le verbe signifie découvrir ou dénuder. « Mettre à nu » est naturel en français et convient au contexte d’exposition honteuse.
theological_decisions:
- issue: Distinction entre אֲדֹנָי et יהוה dans le même verset
  choice: Rendre אֲדֹנָי par « le Seigneur » et יהוה par « Yahweh »
  alternative: Rendre les deux désignations par « le Seigneur »
  rationale: Le texte hébreu emploie intentionnellement deux désignations divines différentes en parallèle; les distinguer en français préserve cette forme sans imposer une interprétation supplémentaire.
- issue: Sens de פָּתְהֵן dans l’oracle de jugement et d’humiliation
  choice: Comprendre le terme comme une allusion euphémique aux parties intimes
  alternative: « leur nudité » de manière plus générale, ou, selon une autre interprétation, « leur front »
  rationale: Le verbe « mettre à nu » et le contexte d’humiliation favorisent l’idée d’une exposition corporelle intime, mais le mot demeure difficile; les autres compréhensions sont donc conservées en note.
translation_notes:
  register: Français moderne, courant et digne, avec conservation du parallélisme prophétique. « Alors » rend idiomatiquement la progression logique du contexte; « couvrir de croûtes » reste concret sans archaïsme. La translittération « Yahweh » distingue le nom divin du titre « le Seigneur ».
