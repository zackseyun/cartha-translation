  text: In that day the Lord will take away the beauty of the anklets[a], the headbands[c][b], and the crescent ornaments.
translation:
  language: fr
  text: En ce jour-là, le Seigneur ôtera la parure des bracelets de cheville, des bandeaux[a] et des ornements en forme de croissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens précis du mot hébreu est incertain ; il pourrait aussi désigner des coiffes ou des résilles.
    reason: lexical_alternative
  - marker: b
    text: Ou « les colliers en forme de croissant » ; l’hébreu désigne des ornements en forme de croissant sans préciser comment ils étaient portés.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Expression temporelle prophétique courante. Cette formulation naturelle en français conserve le registre solennel et situe le jugement annoncé.
- source_word: יָסִיר
  choice: ôtera
  rationale: Le hifil de סור exprime ici l’action de faire disparaître ou d’enlever. « Ôtera » est concis, digne et adapté à la dépossession judiciaire décrite.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin Adonaï, et non du tétragramme. « Le Seigneur » en donne l’équivalent français usuel.
- source_word: תִּפְאֶרֶת
  choice: toute leur splendeur
  rationale: Le nom peut désigner la beauté, l’éclat ou la parure. Le contexte énumère les objets qui constituent cette splendeur. L’ajout idiomatique de « leur » renvoie aux femmes décrites dans le contexte, tandis que « toute » rend naturellement la portée collective de l’énumération sans modifier le sens.
- source_word: הָעֲכָסִים
  choice: les bracelets de cheville
  rationale: Le terme désigne des parures portées aux chevilles. « Bracelets de cheville » est plus immédiatement compréhensible en français international que « chevillières ».
- source_word: הַשְּׁבִיסִים
  choice: les bandeaux
  rationale: L’identification précise de cet objet est incertaine, mais il s’agit vraisemblablement d’une coiffure ou d’une parure de tête. « Bandeaux » reste lisible et prudemment général; l’incertitude est signalée en note.
- source_word: הַשַּׂהֲרֹנִים
  choice: les ornements en forme de croissant
  rationale: Le mot est associé à la lune ou au croissant et désigne des bijoux de cette forme. La traduction conserve l’image sans préciser arbitrairement qu’il s’agissait de colliers.
