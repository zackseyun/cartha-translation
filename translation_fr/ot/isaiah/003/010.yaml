id: ISA.3.10
reference: Isaiah 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִמְר֥וּ צַדִּ֖יק כִּי ט֑וֹב כִּֽי פְרִ֥י מַעַלְלֵי/הֶ֖ם יֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/010.yaml
  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
translation:
  language: fr
  text: 'Dites du juste : « Tout ira bien[a], car ils mangeront le fruit de leurs actes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Dites du juste : “C’est bon”, car ils mangeront le fruit de leurs actes. » L’hébreu passe du singulier représentatif (« le juste ») à des formes plurielles dans la dernière proposition.'
    reason: Alternative lexicale pour טוֹב et indication du changement de nombre dans l’hébreu.
lexical_decisions:
- source_word: אִמְרוּ
  choice: Dites
  rationale: L’impératif pluriel appelle directement les destinataires à prononcer ou annoncer ce qui suit; « Dites » en conserve la brièveté.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé est au singulier et désigne ici une figure représentative; « le juste » garde ce singulier et le sens moral du terme.
- source_word: כִּי (première occurrence)
  choice: que
  rationale: Cette conjonction introduit le contenu de ce qui doit être dit.
- source_word: טוֹב
  choice: tout ira bien
  rationale: Littéralement « bon », le mot exprime ici, dans son contexte, une issue favorable. Cette tournure française est naturelle sans préciser davantage la nature de ce bien.
- source_word: כִּי (seconde occurrence)
  choice: car
  rationale: La seconde conjonction donne la raison de l’affirmation précédente.
- source_word: פְרִי
  choice: le fruit
  rationale: Le choix conserve l’image concrète et sa portée métaphorique de résultat ou de rétribution.
- source_word: מַעַלְלֵיהֶם
  choice: leurs actes
  rationale: « Actes » rend naturellement les actions ou les agissements évoqués, tout en s’accordant bien avec l’image du fruit.
- source_word: יֹאכֵלוּ
  choice: ils mangeront
  rationale: La traduction littérale maintient au pluriel l’image agricole et la métaphore de la rétribution.
theological_decisions:
- issue: Singulier représentatif et passage au pluriel
  choice: Conserver « le juste » au singulier, puis « ils… leurs » au pluriel.
  alternative: Uniformiser le nombre, soit au singulier (« il mangera le fruit de ses actes »), soit au pluriel (« les justes… leurs actes »).
  rationale: Le texte hébreu passe réellement d’un adjectif substantivé singulier à un verbe et à un suffixe pluriels. Le maintien de cette tension évite de trancher silencieusement entre une personne représentative et l’ensemble des justes.
- issue: Portée de טוֹב
  choice: « tout ira bien »
  alternative: « c’est bon » ou « il est heureux »
  rationale: La formulation retenue exprime l’issue favorable suggérée par la proposition causale qui suit, sans réduire le terme à un état émotionnel ni imposer un référent absent du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « À propos du juste » explicite naturellement le rapport syntaxique sans transformer l’énoncé en adresse directe au juste. Le changement inhabituel du singulier au pluriel est volontairement conservé et signalé en note.
