revisions:
- from: Malheur au méchant ! Tout ira mal pour lui[a], car il subira ce que ses mains ont fait.
  to: Malheur au méchant ! Tout ira mal pour lui[a], car il lui sera fait selon l’œuvre de ses mains.
  rationale: La révision corrige la confusion entre les œuvres du méchant et la rétribution qui lui revient. Elle maintient le singulier représentatif, l’image des mains et le caractère mesuré, sans imposer de formulation doctrinale extérieure au texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:52Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement l’oracle de malheur et le singulier représentatif. En revanche, « il subira ce que ses mains ont fait » assimile גְּמוּל (« retour », « rétribution », « traitement correspondant ») aux actes eux-mêmes. Le texte hébreu annonce plutôt qu’il recevra un traitement correspondant à l’œuvre de ses mains. La formulation révisée conserve cette relation rétributive et la voix passive de יֵעָשֶׂה לוֹ.
  naturalness: « Malheur au méchant ! Tout ira mal pour lui » est naturel dans un français moderne et conserve la force de l’annonce. « Car il lui sera fait selon l’œuvre de ses mains » est une formulation française digne et intelligible, d’un registre biblique modéré, sans calquer artificiellement l’hébreu.
  terminology: « Méchant » convient à רָשָׁע dans une sentence prophétique. « Œuvre de ses mains » préserve l’image hébraïque des mains pour les actes, tandis que « selon » rend explicitement et sobrement la valeur de rétribution portée par גְּמוּל. La note est ajustée afin de ne plus présenter « la rétribution de ses mains lui sera faite », expression française ambiguë et peu naturelle.
  issues:
  - severity: medium
    issue: Le complément « ce que ses mains ont fait » ne rend pas explicitement גְּמוּל.
    rationale: גְּמוּל désigne le retour ou la rétribution correspondant aux actes, non les actes eux-mêmes. La version initiale transforme ainsi l’annonce de rétribution en simple répétition des œuvres du méchant.
  revised_text: Malheur au méchant ! Tout ira mal pour lui[a], car il lui sera fait selon l’œuvre de ses mains.
  revised_footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Malheur au méchant ! Le mal est sur lui, car la rétribution correspondant à l’œuvre de ses mains lui sera appliquée. »'
    reason: Alternative plus formelle qui conserve la formulation prédicative concise de l’hébreu et exprime explicitement la valeur rétributive de גְּמוּל.
  revision_rationale: La révision corrige la confusion entre les œuvres du méchant et la rétribution qui lui revient. Elle maintient le singulier représentatif, l’image des mains et le caractère mesuré, sans imposer de formulation doctrinale extérieure au texte.
