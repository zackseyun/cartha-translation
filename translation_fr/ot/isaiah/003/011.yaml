source:
  edition: WLC
  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
translation:
  language: fr
  text: Malheur au méchant ! Tout ira mal pour lui[a], car il lui sera fait selon l’œuvre de ses mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Malheur au méchant ! Le mal est sur lui, car la rétribution correspondant à l’œuvre de ses mains lui sera appliquée. »'
    reason: Alternative plus formelle qui conserve la formulation prédicative concise de l’hébreu et exprime explicitement la valeur rétributive de גְּמוּל.
lexical_decisions:
- source_word: א֖וֹי
  choice: Malheur
  rationale: Cette interjection conserve la formule prophétique de lamentation et de menace dans un français biblique actuel.
- source_word: לְ/רָשָׁ֣ע
  choice: au méchant
  rationale: La préposition désigne celui que vise l’annonce de malheur; le singulier représentatif de l’hébreu est conservé sans ajouter « homme ».
- source_word: רָ֑ע
  choice: Tout ira mal pour lui
  rationale: Dans cette construction, רַע annonce une issue funeste plutôt que le mal moral abstrait; cette tournure rend naturellement sa valeur prédicative.
- source_word: כִּֽי
  choice: car
  rationale: La conjonction introduit la raison du malheur annoncé.
- source_word: גְמ֥וּל יָדָ֖י/ו
  choice: ce que ses mains ont fait
  rationale: גְּמוּל évoque ici ce qui revient à quelqu’un en contrepartie de ses actes. La formulation garde l’image concrète des mains et le rapport entre l’acte et ses conséquences.
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  choice: il subira
  rationale: Le nifal exprime ce qui sera fait au méchant. « Il subira » rend clairement en français la conséquence rétributive, tandis que la proposition complémentaire conserve le lien avec ses propres actes.
theological_decisions:
- issue: Singulier masculin représentatif dans une sentence de jugement
  choice: Conserver « au méchant » et « lui » au singulier.
  alternative: Employer un pluriel générique, ou préciser « l’homme méchant ».
  rationale: L’hébreu présente grammaticalement un cas représentatif singulier; le conserver évite aussi bien la pluralisation que l’ajout d’une désignation masculine absente du nom substantivé.
- issue: Formulation de la justice rétributive
  choice: « il subira ce que ses mains ont fait »
  alternative: « la rétribution de ses mains lui sera faite »
  rationale: La traduction exprime la réciprocité du jugement sans lui imposer une formulation doctrinale technique, tout en gardant l’image hébraïque des mains comme métonymie des actes.
translation_notes:
  register: Français moderne, international et digne. « Malheur » maintient la force de l’oracle prophétique; la formulation principale privilégie une équivalence optimale et lisible, tandis que la note conserve une possibilité plus formelle.
