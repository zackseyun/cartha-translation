source:
  edition: WLC
  text: וְ/אָנ֥וּ וְ/אָבְל֖וּ פְּתָחֶ֑י/הָ וְ/נִקָּ֖תָה לָ/אָ֥רֶץ תֵּשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/026.yaml
  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
translation:
  language: fr
  text: Ses portes se lamenteront et seront en deuil ; dépouillée[a], elle s’assiéra à même le sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vidée » ou « laissée nue ». Le verbe hébreu peut évoquer le fait d’être vidée ou entièrement dépouillée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  choice: se lamenteront
  rationale: Le verbe אנה exprime ici une lamentation audible. Le réfléchi français est naturel et maintient la personnification poétique des portes.
- source_word: וְאָבְל֖וּ
  choice: et seront en deuil
  rationale: אבל désigne le deuil ou l’affliction. Cette formulation garde la distinction avec la lamentation exprimée par le premier verbe.
- source_word: פְּתָחֶ֑י/הָ
  choice: Ses portes
  rationale: Dans le cadre urbain et la personnification de Jérusalem, « portes » rend naturellement les ouvertures ou entrées de la ville.
- source_word: וְנִקָּ֖תָה
  choice: dépouillée[a]
  rationale: Le nifal de נקה peut évoquer ce qui a été vidé, débarrassé ou laissé nu. « Dépouillée » convient à l’image de la ville privée de ses biens et de sa population, sans préciser excessivement la nature de sa perte.
- source_word: לָ/אָ֥רֶץ
  choice: par terre
  rationale: Avec ישב, l’expression indique concrètement la posture humiliante de quelqu’un assis sur le sol. « Par terre » est idiomatique en français moderne.
- source_word: תֵּשֵֽׁב
  choice: elle s’assiéra
  rationale: Bien que ישב puisse aussi signifier habiter ou demeurer, son association avec « par terre » privilégie ici le sens concret de s’asseoir.
theological_decisions:
- issue: Référent du sujet féminin singulier
  choice: Le pronom « elle » conserve la personnification féminine de Sion/Jérusalem suggérée par le contexte.
  alternative: Une figure féminine générique représentant la ville.
  rationale: Le passage environnant concerne les filles de Sion et le jugement de Jérusalem. Le pronom préserve ce lien sans ajouter explicitement un nom absent du verset.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux verbes de deuil est conservé, ainsi que la personnification de la ville. Le point-virgule distingue les portes personnifiées du sujet féminin singulier de la dernière proposition.
