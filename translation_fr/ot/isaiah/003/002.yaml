id: ISA.3.2
reference: Isaiah 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גִּבּ֖וֹר וְ/אִ֣ישׁ מִלְחָמָ֑ה שׁוֹפֵ֥ט וְ/נָבִ֖יא וְ/קֹסֵ֥ם וְ/זָקֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/002.yaml
  text: the mighty man and the man of war[a], the judge and the prophet, the diviner and the elder.
translation:
  language: fr
  text: le vaillant et l’homme de guerre, le juge et le prophète, le devin[a] et l’ancien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne celui qui pratique la divination.
    reason: Précision lexicale sur la nature de l’activité du devin.
lexical_decisions:
- source_word: גִּבּוֹר
  choice: le vaillant
  rationale: Le terme désigne ici un homme fort ou valeureux. « Le vaillant » conserve la forme masculine singulière et évite de confondre cette figure avec la fonction militaire explicitement nommée ensuite.
- source_word: אִישׁ מִלְחָמָה
  choice: l’homme de guerre
  rationale: Cette expression proche de l’idiome hébreu reste naturelle en français soutenu et maintient la distinction avec גִּבּוֹר.
- source_word: שׁוֹפֵט
  choice: le juge
  rationale: Dans cette liste de figures de la société, le mot désigne directement celui qui exerce le jugement dans la sphère publique ou juridique.
- source_word: נָבִיא
  choice: le prophète
  rationale: C’est l’équivalent français courant et précis du titre hébreu.
- source_word: קֹסֵם
  choice: le devin
  rationale: Le mot désigne celui qui pratique la divination. « Devin » est précis, actuel et descriptif, sans suggérer que cette pratique est approuvée.
- source_word: זָקֵן
  choice: l’ancien
  rationale: Dans le contexte d’une liste de fonctions et de soutiens sociaux, « l’ancien » exprime mieux le statut reconnu de responsable que le simple âge biologique.
- source_word: וְ
  choice: et
  rationale: Les conjonctions sont conservées entre les paires, tandis que les virgules rendent la série naturelle en français sans effacer sa cadence formelle.
theological_decisions:
- issue: Sens de קֹסֵם dans une annonce de jugement
  choice: le devin
  alternative: celui qui pratique la divination
  rationale: La traduction nomme simplement une catégorie présente dans la société de Juda. Elle ne neutralise pas le terme pour des raisons doctrinales et n’implique aucune approbation de la divination.
translation_notes:
  register: Français moderne, digne et lisible. La structure en trois paires coordonnées reproduit la cadence de l’énumération hébraïque. Les désignations masculines singulières sont maintenues parce que le texte présente des figures sociales masculines représentatives.
