  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
translation:
  language: fr
  text: 'Yahweh vient en jugement avec les anciens de son peuple et ses chefs : « C’est vous qui avez dévasté la vigne[a] ; ce que vous avez volé au pauvre se trouve dans vos maisons[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consumé la vigne », « brûlé la vigne » ou « fait disparaître la vigne en la broutant ». Le verbe hébreu évoque une destruction par consommation ou élimination. La vigne peut avoir une portée métaphorique, désignant le peuple ou la communauté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le bien volé au pauvre est dans vos maisons » ; autre traduction possible : « le butin pris aux pauvres est dans vos maisons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre, conformément au texte hébreu.
- source_word: בְּמִשְׁפָּט יָבוֹא
  choice: entre en jugement
  rationale: Rend naturellement l’entrée dans une procédure judiciaire et conserve le présent prophétique saisissant.
- source_word: עִם
  choice: avec
  rationale: Préserve la préposition hébraïque, tandis que l’accusation qui suit indique clairement que les dirigeants sont mis en cause.
- source_word: זִקְנֵי עַמּוֹ וְשָׂרָיו
  choice: les anciens de son peuple et ses chefs
  rationale: « Anciens » désigne les responsables reconnus ; « chefs » exprime ici שׂרים en français courant et digne sans supposer nécessairement un rang princier héréditaire. Le possessif « ses » se rapporte naturellement au peuple.
- source_word: וְאַתֶּם
  choice: C’est vous qui
  rationale: Reproduit l’insistance accusatrice du pronom indépendant.
- source_word: בִּעַרְתֶּם
  choice: avez dévasté
  rationale: Le verbe peut évoquer le fait de brûler, consumer ou faire disparaître en broutant. Dans l’image de la vigne, « dévaster » conserve l’idée générale de destruction sans imposer un seul mécanisme.
- source_word: הַכֶּרֶם
  choice: la vigne
  rationale: Terme français naturel qui maintient l’image agricole et sa possible portée métaphorique.
- source_word: גְּזֵלַת הֶעָנִי
  choice: ce que vous avez volé au pauvre
  rationale: Explicite naturellement que גְּזֵלַת désigne le bien obtenu par spoliation ; le singulier collectif « le pauvre » suit l’hébreu et désigne la personne vulnérable.
- source_word: בְּבָתֵּיכֶם
  choice: se trouve dans vos maisons
  rationale: Conserve le pluriel hébreu et présente les demeures des dirigeants comme les lieux où se trouvent les biens injustement acquis.
theological_decisions:
- issue: Portée métaphorique de « la vigne »
  choice: Conserver l’image de la vigne dans le texte principal.
  alternative: Traduire explicitement par « mon peuple » ou « la communauté ».
  rationale: Le référent probable ne doit pas remplacer l’image prophétique elle-même ; cette formulation préserve les échos internes au livre d’Ésaïe.
- issue: Valeur judiciaire de עִם
  choice: Traduire par « avec ».
  alternative: Traduire par « contre ».
  rationale: « Contre » rendrait explicite la relation adversative suggérée par le contexte, mais « avec » respecte mieux la formulation hébraïque tout en laissant l’accusation établir la confrontation.
- issue: Sujet implicite de la vigne
  choice: Ne pas ajouter « ma vigne ».
  alternative: « ma vigne », en comprenant la vigne comme le peuple de Yahweh.
  rationale: L’hébreu porte l’article défini, non un suffixe possessif ; l’identification théologique reste donc implicite.
translation_notes:
  register: Français international moderne, digne et directement accusateur. Le présent « entre » donne à la scène judiciaire sa vivacité prophétique. « Dévasté » évite une image française potentiellement trompeuse comme « dévoré la vigne », tout en conservant dans une note l’éventail sémantique du verbe hébreu.
