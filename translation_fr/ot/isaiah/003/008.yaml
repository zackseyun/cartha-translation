source:
  edition: WLC
  text: כִּ֤י כָשְׁלָה֙ יְר֣וּשָׁלִַ֔ם וִ/יהוּדָ֖ה נָפָ֑ל כִּֽי לְשׁוֹנָ֤/ם וּ/מַֽעַלְלֵי/הֶם֙ אֶל יְהוָ֔ה לַ/מְר֖וֹת עֵנֵ֥י כְבוֹדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
translation:
  language: fr
  text: 'Car Jérusalem a trébuché,

    et Juda est tombé,

    car leur langue et leurs actes sont contre Yahweh,

    pour défier les yeux de sa gloire.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour défier les yeux de sa gloire ». L’expression hébraïque, très imagée, évoque une rébellion ouverte contre Yahweh, devant sa présence glorieuse.'
    reason: Préserve l’image littérale inhabituelle tout en en indiquant le sens dans un français naturel.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La première occurrence introduit l’explication du jugement annoncé auparavant ; « Car » en conserve naturellement la valeur explicative.
- source_word: כָשְׁלָה
  choice: a trébuché
  rationale: Le verbe évoque le fait de trébucher ou de chanceler. Cette formulation garde l’image sans transformer le verbe en affirmation explicite d’une destruction totale.
- source_word: וִיהוּדָה נָפָל
  choice: et Juda est tombé
  rationale: Traduction directe qui maintient le parallélisme poétique avec Jérusalem.
- source_word: לְשׁוֹנָם
  choice: leur langue
  rationale: Le singulier collectif hébreu désigne leur parole, mais conserver « langue » maintient l’image concrète du texte source.
- source_word: וּמַעַלְלֵיהֶם
  choice: et leurs actes
  rationale: « Actes » rend de façon courante et moralement significative leurs agissements ou leurs œuvres.
- source_word: אֶל יְהוָה
  choice: s’opposent à Yahweh
  rationale: Dans ce contexte hostile, אֶל indique que leurs paroles et leurs actes sont dirigés contre Yahweh. « S’opposent à » exprime cette orientation adversative en français naturel.
- source_word: לַמְרוֹת
  choice: bravant
  rationale: Le verbe מרה exprime la rébellion et la défiance. « Bravant » s’intègre à la syntaxe française et conserve l’idée de défi ouvert.
- source_word: עֵנֵי כְבוֹדוֹ
  choice: son regard glorieux
  rationale: La formulation rend naturellement l’expression hébraïque frappante, littéralement « les yeux de sa gloire », tout en gardant le lien entre le regard divin et sa gloire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. La translittération « Yahweh » le distingue d’un simple titre.
- issue: Rapport de לַמְרוֹת avec עֵנֵי כְבוֹדוֹ
  choice: bravant son regard glorieux
  alternative: se révoltant contre les yeux de sa gloire
  rationale: La traduction retenue exprime la défiance dirigée contre Dieu sous son regard sans imposer en français la tournure littérale et difficile « contre les yeux ». La note conserve l’image exacte du texte hébreu.
translation_notes:
  register: Français moderne, digne et accessible. La disposition en lignes fait ressortir le parallélisme poétique. Les passés composés rendent les accomplis hébreux sans préciser au-delà du contexte s’il s’agit d’un effondrement déjà réalisé ou présenté comme certain.
