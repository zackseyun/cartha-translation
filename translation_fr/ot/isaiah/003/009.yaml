  terminology: « L’expression de leur visage », « témoigne contre eux », « proclament leur péché » et « se sont attiré le mal » sont justes, compréhensibles et d’un registre biblique moderne. La note sur Sodome est resserrée afin de ne pas définir de façon excessive le péché auquel l’allusion renvoie.
