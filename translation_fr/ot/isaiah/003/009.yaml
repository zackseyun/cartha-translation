  text: הַכָּרַ֤ת פְּנֵי/הֶם֙ עָ֣נְתָה בָּ֔/ם וְ/חַטָּאתָ֛/ם כִּ/סְדֹ֥ם הִגִּ֖ידוּ לֹ֣א כִחֵ֑דוּ א֣וֹי לְ/נַפְשָׁ֔/ם כִּֽי גָמְל֥וּ לָ/הֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
translation:
  language: fr
  text: L’expression de leur visage témoigne contre eux[a] ; comme Sodome, ils proclament leur péché[b] ; ils ne le cachent pas. Malheur à eux[c], car ils se sont attiré le mal !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « L’aspect de leur visage témoigne contre eux ». L’hébreu peut désigner leur mine ou leur expression visible comme preuve de leur culpabilité.
    reason: lexical_alternative
  - marker: b
    text: L’allusion à Sodome souligne ici la publicité et l’absence de dissimulation ; voir Genèse 13.13 et 19.5.
    reason: cross_reference
  - marker: c
    text: Littéralement « Malheur à leur personne ! » Le mot hébreu peut désigner la personne elle-même, la vie ou l’âme selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  choice: L’expression de leur visage
  rationale: La tournure désigne probablement ce qui se reconnaît sur leur visage, donc leur mine ou leur expression visible. Cette formulation française convient à l’image d’un visage qui fournit lui-même une preuve, tout en laissant en note l’autre nuance possible, « l’aspect de leur visage ».
- source_word: עָנְתָה בָּם
  choice: témoigne contre eux
  rationale: ענה construit avec ב peut exprimer ici un témoignage à charge. « Témoigne contre eux » restitue clairement la portée quasi judiciaire de l’expression.
- source_word: וְחַטָּאתָם ... הִגִּידוּ
  choice: ils proclament leur péché
  rationale: חַטָּאתָם est l’objet du verbe au hifil הִגִּידוּ, « faire connaître, déclarer ». « Proclament » rend le caractère public et éhonté de leur conduite, tout en conservant le singulier collectif « péché ».
- source_word: כִּסְדֹם
  choice: comme Sodome
  rationale: La comparaison directe et concise conserve l’allusion biblique sans expliciter dans le corps du texte la nature exacte de la faute évoquée.
- source_word: לֹא כִחֵדוּ
  choice: ils ne le cachent pas
  rationale: כחד signifie cacher ou dissimuler. Le pronom « le » reprend naturellement « leur péché » en français.
- source_word: אוֹי לְנַפְשָׁם
  choice: Malheur à eux-mêmes
  rationale: נפש désigne ici vraisemblablement leur propre personne plutôt qu’une âme immatérielle au sens technique. La formulation réflexive garde l’idée que le malheur les atteint eux-mêmes.
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  choice: car ils se sont attiré le mal
  rationale: גמל peut signifier traiter, rendre ou faire retomber quelque chose sur quelqu’un. La formulation exprime naturellement que leur conduite mauvaise se retourne contre eux, sans préciser davantage le mécanisme de cette conséquence.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans לְנַפְשָׁם
  choice: eux-mêmes, au sens de leur propre personne
  alternative: leur âme ; leur vie ; eux
  rationale: Dans ce contexte, נֶפֶשׁ peut désigner la personne entière. La traduction évite d’introduire une anthropologie technique qui réduirait le terme à une composante immatérielle.
- issue: Portée de la proposition finale
  choice: un mal que leur conduite fait retomber sur eux-mêmes
  alternative: une rétribution divine explicitement formulée ; une simple conséquence sociale
  rationale: L’hébreu affirme qu’ils ont fait venir ou rendu le mal à eux-mêmes, mais n’explicite pas ici le mécanisme. La traduction maintient cette tension sans surinterprétation.
- issue: Portée de la comparaison avec Sodome
  choice: conserver l’allusion générale à une méchanceté publique et éhontée
  alternative: identifier dans la traduction un péché particulier de Sodome
  rationale: Le verset ne précise pas quel aspect du péché de Sodome est visé. Il convient donc de préserver l’allusion sans imposer une interprétation confessionnelle ou doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation souligne la progression de l’accusation vers l’annonce du malheur. « Malheur à eux-mêmes » est volontairement plus marqué que le simple « Malheur à eux », afin de conserver la force réflexive de l’hébreu ; la note en précise le sens.
