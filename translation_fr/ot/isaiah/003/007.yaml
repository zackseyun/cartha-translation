  text: יִשָּׂא֩ בַ/יּ֨וֹם הַ/ה֤וּא לֵ/אמֹר֙ לֹא אֶהְיֶ֣ה חֹבֵ֔שׁ וּ/בְ/בֵיתִ֕/י אֵ֥ין לֶ֖חֶם וְ/אֵ֣ין שִׂמְלָ֑ה לֹ֥א תְשִׂימֻ֖/נִי קְצִ֥ין עָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
translation:
  language: fr
  text: 'Ce jour-là, il élèvera la voix en disant : « Je ne serai pas celui qui panse les plaies[a] : chez moi, il n’y a pas de pain et il n’y a pas de manteau. Ne faites pas de moi un chef du peuple[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un guérisseur ». Littéralement, le mot désigne quelqu’un qui bande ou panse les blessures.
    reason: lexical_alternative
  - marker: b
    text: Ou « un dirigeant du peuple » ou « un responsable du peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: il élèvera la voix
  rationale: Le verbe signifie littéralement « lever, porter ». Avec l’introduction d’une parole, l’expression française « élever la voix » restitue naturellement l’idée d’une déclaration publique et appuyée, sans réduire le propos à un simple cri.
- source_word: חֹבֵשׁ
  choice: celui qui panse les plaies
  rationale: Le participe désigne littéralement quelqu’un qui bande ou panse, notamment des blessures. Cette formulation conserve l’image concrète de celui qui réparerait les blessures de la communauté, là où « chef » serait trop interprétatif.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens premier est « pain », même si le mot peut désigner plus largement la nourriture. L’image concrète des biens indispensables est ici conservée.
- source_word: שִׂמְלָה
  choice: manteau
  rationale: Le terme désigne un vêtement, souvent un vêtement extérieur. « Manteau » garde une image concrète et s’accorde avec le « pain » comme autre nécessité élémentaire.
- source_word: תְשִׂימֻנִי
  choice: Ne faites pas de moi
  rationale: Le verbe signifie « mettre, placer, établir ». Dans ce refus d’une fonction, cette tournure est idiomatique en français et conserve l’adresse directe au groupe.
- source_word: קְצִין עָם
  choice: un chef du peuple
  rationale: קְצִין peut désigner un chef, un dirigeant ou un responsable. « Chef du peuple » reste proche de la formulation hébraïque sans lui imposer une nuance exclusivement militaire.
theological_decisions:
- issue: Portée métaphorique de חֹבֵשׁ
  choice: Conserver dans le texte l’image de celui qui panse les plaies.
  alternative: Traduire directement par « guérisseur » ou, de manière interprétative, par « dirigeant ».
  rationale: L’image relie la fonction proposée à la réparation de la société en crise. La conserver évite de trancher entre guérison concrète, restauration sociale et aptitude à gouverner.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « il n’y a pas » reproduit celle de l’hébreu et souligne le dénuement. « Il élèvera la voix » garde l’image du verbe source tout en restant idiomatique.
