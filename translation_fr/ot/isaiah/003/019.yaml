lexical_decisions:
- source_word: הַנְּטִיפוֹת
  choice: les pendentifs
  rationale: Le terme désigne vraisemblablement des ornements suspendus, peut-être en forme de goutte. « Pendentifs » rend naturellement cette idée sans préciser indûment qu’il s’agit de boucles d’oreilles.
- source_word: הַשֵּׁירוֹת
  choice: les bracelets
  rationale: Ce terme rare désigne un objet de parure dont l’identification exacte reste incertaine. « Bracelets » convient à l’énumération, tandis que d’autres possibilités sont signalées en note.
- source_word: הָרְעָלוֹת
  choice: les voiles
  rationale: Le mot désigne une pièce couvrante, probablement un voile. « Voiles » est ici clair, naturel et suffisamment général.
