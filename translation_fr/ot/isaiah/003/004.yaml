  yaml_path: translation/ot/isaiah/003/004.yaml
  text: And I will make youths their princes[a], and capricious children will rule over them.
translation:
  language: fr
  text: Je leur donnerai de jeunes garçons pour chefs[a], et des enfants capricieux[b] régneront sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de jeunes gens » ou « des enfants » ; le terme hébreu souligne leur jeunesse et peut, dans ce contexte, suggérer aussi leur inexpérience.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est difficile ; il peut aussi évoquer des « enfants », des « nourrissons » ou des personnes puériles et capricieuses.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je leur donnerai pour chefs
  rationale: Le verbe נתן signifie d’abord « donner », mais la construction exprime ici l’établissement de personnes dans une fonction dirigeante. Cette tournure française reste proche de l’hébreu tout en étant naturelle.
- source_word: נְעָרִים
  choice: de jeunes garçons
  rationale: נְעָרִים désigne des jeunes de sexe masculin et souligne ici leur jeunesse et leur inexpérience. « De jeunes garçons » rend cette image plus nettement que le seul mot « jeunes ».
- source_word: שָׂרֵיהֶם
  choice: pour chefs
  rationale: שַׂר peut désigner un prince, un haut responsable ou un chef. Dans ce contexte politique, « chefs » exprime clairement la fonction sans supposer nécessairement un titre dynastique.
- source_word: וְתַעֲלוּלִים
  choice: des êtres capricieux
  rationale: Le terme rare תַעֲלוּלִים évoque probablement l’immaturité, les caprices ou une conduite puérile. La formulation conserve la nuance comportementale sans imposer comme certaine une référence littérale à l’âge.
- source_word: יִמְשְׁלוּ בָם
  choice: domineront sur eux
  rationale: משל avec ב signifie exercer le pouvoir sur quelqu’un. « Domineront sur eux » conserve ici la force potentiellement oppressive de la formule hébraïque.
theological_decisions:
- issue: Nature de l’image du jugement
  choice: Le texte présente le jugement divin sous la forme de dirigeants jeunes, inexpérimentés et capricieux, sans décider si toutes les expressions doivent être comprises littéralement.
  alternative: Comprendre soit uniquement de très jeunes dirigeants au sens littéral, soit uniquement des dirigeants adultes mais puérils et instables.
  rationale: Les deux termes hébreux mobilisent le champ de la jeunesse ou de l’immaturité, et le langage prophétique peut avoir simultanément une portée concrète et figurée. La traduction préserve cette tension.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme de l’hébreu est conservé. « Chefs » évite le caractère parfois trop dynastique de « princes », tandis que « êtres capricieux » maintient l’ambiguïté du terme rare sans ajouter explicitement « enfants » dans le second membre.
