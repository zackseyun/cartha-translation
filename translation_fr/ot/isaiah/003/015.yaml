id: ISA.3.15
reference: Isaiah 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מ/ל/כם תְּדַכְּא֣וּ עַמִּ֔/י וּ/פְנֵ֥י עֲנִיִּ֖ים תִּטְחָ֑נוּ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
translation:
  language: fr
  text: Que vous prend-il d’écraser mon peuple[a] et de broyer le visage des pauvres[b] ? — déclaration du Seigneur Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qu’avez-vous à écraser mon peuple ? » L’expression hébraïque est une réprimande indignée.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « broyer les visages des pauvres ». L’hébreu emploie une image saisissante pour décrire une oppression impitoyable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מ/ל/כם
  choice: Que vous prend-il de
  rationale: L’expression elliptique מָה־לָכֶם introduit ici un reproche indigné. « Que vous prend-il de… ? » en restitue naturellement la force en français sans la réduire à une simple demande de motif.
- source_word: תְּדַכְּאוּ
  choice: écraser
  rationale: Le piel de דכא évoque l’action d’écraser ou d’accabler. « Écraser » conserve la violence concrète de l’image.
- source_word: עַמִּי
  choice: mon peuple
  rationale: La construction possessive est directe et maintient l’identification de Yahweh avec le peuple maltraité.
- source_word: וּפְנֵי עֲנִיִּים
  choice: et le visage des pauvres
  rationale: פנים est morphologiquement pluriel mais s’emploie couramment pour le visage. Le singulier collectif français produit une image naturelle tout en gardant les pauvres au pluriel.
- source_word: תִּטְחָנוּ
  choice: broyer
  rationale: טחן signifie littéralement « moudre, broyer ». « Broyer » préserve la métaphore brutale et la distingue du verbe précédent.
- source_word: נְאֻם
  choice: déclaration
  rationale: Ce terme introduit solennellement une parole divine. La formule nominale « déclaration du… » reste proche de la construction hébraïque.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, sans produire le peu naturel « Seigneur SEIGNEUR ».
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Le terme désigne des armées ou des troupes et forme ici le titre divin traditionnel. « Des armées » est clair en français moderne et conserve sa dimension militaire.
theological_decisions:
- issue: Représentation du nom divin יהוה dans le titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois אֲדֹנָי et le tétragramme. Rendre celui-ci par « Yahweh » distingue les deux éléments et préserve le nom divin présent dans l’hébreu.
- issue: Portée sociale de עֲנִיִּים
  choice: les pauvres
  alternative: les affligés
  rationale: Le contexte immédiat dénonce l’exploitation sociale par les dirigeants. « Pauvres » convient à cette situation tout en laissant intacte la dimension d’affliction.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. La question conserve le ton accusateur de l’hébreu, et les deux verbes concrets maintiennent la violence de ses images.
