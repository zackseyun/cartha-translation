  text: and the mirrors[a], and the linen garments, and the turbans[b], and the veils.
translation:
  language: fr
  text: les miroirs[a], les vêtements de lin, les turbans et les voiles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plaques polies ». Le terme hébreu peut désigner plus largement des objets lisses et polis ; dans cette liste d’objets de luxe, « miroirs » paraît le mieux convenir.
    reason: lexical_alternative
  - marker: b
    text: Ou « châles » ou « étoffes drapées ». La forme exacte de ce vêtement est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְיֹנִים
  choice: miroirs
  rationale: Dans cette liste d’objets de luxe et de parure, le terme désigne probablement des objets lisses et polis servant de miroirs. « Miroirs » est naturel en français, tandis que « plaques » reste lexicalement possible.
- source_word: סְּדִינִים
  choice: vêtements de lin
  rationale: Le mot désigne des pièces d’habillement en lin fin sans permettre d’en déterminer sûrement la coupe ou l’usage précis. Cette traduction conserve l’indication de matière sans surinterpréter.
- source_word: צְּנִיפוֹת
  choice: turbans
  rationale: Le terme évoque une étoffe enroulée autour de la tête. « Turbans » constitue un équivalent français courant et suffisamment précis.
- source_word: רְדִידִים
  choice: voiles
  rationale: Dans cette liste de vêtements féminins, le terme paraît désigner une légère pièce d’étoffe portée par-dessus. « Voiles » convient au sens probable, même si la forme exacte du vêtement demeure incertaine.
