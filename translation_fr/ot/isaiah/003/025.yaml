source:
  edition: WLC
  text: מְתַ֖יִ/ךְ בַּ/חֶ֣רֶב יִפֹּ֑לוּ וּ/גְבוּרָתֵ֖/ךְ בַּ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
translation:
  language: fr
  text: Tes hommes tomberont par l’épée, et tes héros[a] au combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta force » ou « ta puissance »; le terme peut aussi désigner tes guerriers.'
    reason: Le nom hébreu désigne d’abord la force ou la vaillance; dans ce contexte, il peut par métonymie renvoyer aux hommes valeureux de la ville.
lexical_decisions:
- source_word: מְתַיִךְ
  choice: tes hommes
  rationale: Dans cet emploi poétique, le nom désigne des hommes ou des personnes, non des cadavres. Le féminin singulier du suffixe renvoie à la ville personnifiée.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: La préposition exprime ici le moyen par lequel ils tomberont; cette formulation conserve aussi l’image martiale du texte hébreu.
- source_word: יִפֹּלוּ
  choice: tomberont
  rationale: L’imparfait hébreu annonce l’issue à venir; « tomber » garde l’expression poétique courante pour mourir au combat.
- source_word: וּגְבוּרָתֵךְ
  choice: et tes vaillants
  rationale: Le nom signifie d’abord « force, vaillance », mais le parallélisme avec « tes hommes » permet une lecture métonymique désignant les hommes forts ou valeureux de la ville. « Tes vaillants » conserve ce lien lexical sans préciser indûment « soldats ».
- source_word: בַּמִּלְחָמָה
  choice: au combat
  rationale: Le nom peut désigner la guerre ou le combat; « au combat » s’accorde naturellement avec l’idée de tomber par l’épée.
theological_decisions:
- issue: Référent des suffixes féminins de la deuxième personne
  choice: L’adresse vise Sion/Jérusalem personnifiée au féminin singulier, sans l’expliciter dans le verset.
  alternative: Les filles de Sion envisagées collectivement.
  rationale: Le contexte immédiat soutient l’apostrophe à la ville personnifiée; le possessif français « tes » préserve l’adresse sans imposer un référent dans le corps du texte.
- issue: Sens de וּגְבוּרָתֵךְ
  choice: 'Lecture métonymique personnelle : « tes vaillants ».'
  alternative: 'Lecture abstraite : « ta force » ou « ta puissance ».'
  rationale: Le parallélisme avec « tes hommes » et le cadre du combat favorisent la référence aux hommes valeureux, tout en laissant la lecture abstraite possible en note.
translation_notes:
  register: Français moderne, sobre et poétique. L’ellipse du verbe dans le second membre reproduit le parallélisme concis de l’hébreu tout en restant naturelle.
