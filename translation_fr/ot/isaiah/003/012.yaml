base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
translation:
  language: fr
  text: 'Mon peuple : ses oppresseurs sont des enfants,

    et des femmes le dominent.


    Mon peuple, ceux qui te guident[a] t’égarent

    et engloutissent la voie de tes sentiers[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui te déclarent heureux ». La forme hébraïque peut avoir ce sens, mais le contexte évoque probablement des dirigeants ou des guides qui égarent le peuple.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la voie de tes sentiers, ils l’ont engloutie » ; image frappante de l’engloutissement de la voie du peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשָׂיו
  choice: ses oppresseurs
  rationale: Le terme désigne ceux qui pressurent, imposent des exigences ou oppriment. « Oppresseurs » convient à la dénonciation sociale et politique et conserve le suffixe masculin singulier renvoyant collectivement au peuple.
- source_word: מְעוֹלֵל
  choice: sont des enfants
  rationale: La forme et la syntaxe sont difficiles. Dans le contexte, le mot caractérise vraisemblablement les oppresseurs comme des enfants, donc comme des dirigeants immatures et inaptes, sans remplacer l’image par une interprétation abstraite.
- source_word: וְנָשִׁים מָשְׁלוּ בוֹ
  choice: et des femmes dominent sur lui
  rationale: Traduction directe de נָשִׁים et de משל avec ב. Le pronom singulier « lui » reprend « mon peuple » comme nom collectif.
- source_word: מְאַשְּׁרֶיךָ
  choice: ceux qui te guident
  rationale: Dans ce contexte, le parallélisme avec « t’égarent » favorise le sens de guides ou dirigeants. L’autre sens lexical possible, « ceux qui te déclarent heureux », est signalé en note.
- source_word: מַתְעִים
  choice: t’égarent
  rationale: Le causatif de תעה exprime l’action de faire errer. « T’égarent » est naturel en français et maintient l’image d’une mauvaise orientation.
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ
  choice: le chemin tracé par tes sentiers
  rationale: Cette formulation conserve autant que possible le double vocabulaire hébreu de la voie et des sentiers, malgré son caractère intensif et inhabituel.
- source_word: בִּלֵּעוּ
  choice: engloutissent
  rationale: Le verbe signifie littéralement avaler ou engloutir. « Engloutissent » garde la force de la métaphore au lieu de la réduire à « détruisent » ou « brouillent ».
theological_decisions:
- issue: Référence potentiellement péjorative au gouvernement des femmes
  choice: Conserver « des femmes dominent sur lui » comme image prophétique du désordre social dans ce contexte.
  alternative: Généraliser en « les faibles dominent sur lui » ou adopter une conjecture telle que « ses créanciers » dominent sur lui.
  rationale: Le texte massorétique porte explicitement « femmes ». La traduction ne doit ni neutraliser ce terme ni en tirer une affirmation doctrinale générale sur les femmes au-delà de la rhétorique immédiate d’Ésaïe.
- issue: Nombre du pronom renvoyant à « mon peuple »
  choice: 'Employer le singulier collectif : « ses oppresseurs » et « sur lui ».'
  alternative: 'Employer le pluriel sémantique : « leurs oppresseurs » et « sur eux ».'
  rationale: Le suffixe hébreu est masculin singulier et reprend עַמִּי, « mon peuple », comme unité collective. Le français permet aussi cette reprise au singulier.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique est conservée. Le singulier collectif reprend fidèlement les suffixes hébreux; les images concrètes d’égarement et d’engloutissement restent visibles. Tous les marqueurs de note figurent dans le texte.
