id: ISA.3.13
reference: Isaiah 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִצָּ֥ב לָ/רִ֖יב יְהוָ֑ה וְ/עֹמֵ֖ד לָ/דִ֥ין עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/013.yaml
  text: Yahweh takes his stand to contend[b][a], and stands to judge the peoples.
translation:
  language: fr
  text: Yahweh se tient debout pour plaider[a], et il se tient debout pour juger les peuples[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « engager un procès » ou « contester » ; le verbe hébreu appartient au vocabulaire du litige judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « les nations » ; le pluriel hébreu peut désigner largement plusieurs peuples.
    reason: alternative_reading
lexical_decisions:
- source_word: נִצָּב
  choice: se tient prêt
  rationale: Le participe niphal décrit une prise de position ferme et résolue. « Se tient prêt » rend naturellement cette posture judiciaire sans réduire le terme à un simple état statique.
- source_word: לָרִיב
  choice: à plaider
  rationale: Dans ce contexte judiciaire, ריב évoque l'action de soutenir ou d'engager une cause. « Plaider » conserve l'image du procès, tandis qu'une note signale les autres nuances possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וְעֹמֵד
  choice: il se lève
  rationale: Le participe עמד signifie littéralement « se tenir debout ». Dans le parallélisme, « il se lève » exprime en français une entrée solennelle dans l'action judiciaire, sans préciser davantage le geste.
- source_word: לָדִין
  choice: pour juger
  rationale: 'דין a ici son sens judiciaire le plus direct : rendre un jugement.'
- source_word: עַמִּים
  choice: les peuples
  rationale: 'Le pluriel hébreu est conservé et laisse ouverte la portée exacte : divers peuples ou, selon le contexte, les nations.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin ; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de עַמִּים
  choice: les peuples
  alternative: les nations
  rationale: « Les peuples » préserve le pluriel et l'indétermination du référent, sans limiter d'emblée la scène aux nations non israélites.
- issue: Fonction judiciaire de ריב
  choice: plaider
  alternative: engager un procès ; contester
  rationale: « Plaider » maintient l'imagerie judiciaire tout en laissant ouverte la question de savoir si Yahweh accuse, défend une cause ou entre en litige.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme hébreu est rendu par deux propositions judiciaires coordonnées ; les notes préservent les ambiguïtés lexicales et la portée ouverte du pluriel.
