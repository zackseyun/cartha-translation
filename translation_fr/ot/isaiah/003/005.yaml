  text: וְ/נִגַּ֣שׂ הָ/עָ֔ם אִ֥ישׁ בְּ/אִ֖ישׁ וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ יִרְהֲב֗וּ הַ/נַּ֨עַר֙ בַּ/זָּקֵ֔ן וְ/הַ/נִּקְלֶ֖ה בַּ/נִּכְבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/005.yaml
  text: And the people will oppress one another—man against man[a], and each against his neighbor; the youth will act arrogantly toward the elder[c][b], and the despised toward the honored.
translation:
  language: fr
  text: 'Les membres du peuple s’opprimeront les uns les autres : chacun contre son prochain[a]. Le jeune se montrera insolent envers l’ancien[b], et le méprisé envers l’honoré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète deux expressions distributives, littéralement « un homme contre un homme, et un homme contre son prochain », pour souligner l’hostilité généralisée.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « l’ancien » peut désigner soit une personne âgée, soit une personne revêtue d’une certaine autorité sociale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגַּשׂ
  choice: s’opprimera mutuellement
  rationale: Le niphal de נגשׂ décrit ici une oppression réciproque au sein du peuple. La tournure pronominale rend naturellement en français cette désagrégation sociale généralisée.
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  choice: chacun contre chacun, chacun contre son prochain
  rationale: Cette formulation conserve les deux expressions distributives parallèles et le sens conflictuel de la préposition בְּ, sans imposer en français un masculin générique inutile.
- source_word: יִרְהֲבוּ
  choice: se montrera insolent envers
  rationale: Le verbe exprime une conduite présomptueuse et provocante. « Se montrer insolent envers » convient au renversement des rapports sociaux décrit ici.
- source_word: הַנַּעַר
  choice: le jeune
  rationale: Le terme désigne ici un jeune homme ou une personne jeune, en contraste avec זָקֵן, plutôt qu’un enfant précisément.
- source_word: בַּזָּקֵן
  choice: envers l’ancien
  rationale: « L’ancien » préserve la possible double référence à l’âge avancé et au rang social, là où « le vieillard » ne retiendrait que l’âge.
- source_word: הַנִּקְלֶה
  choice: l’homme méprisé
  rationale: Le participe désigne celui qui est tenu pour peu de chose ou socialement déconsidéré. L’ajout de « homme » rend le contraste concret et naturel en français.
- source_word: בַּנִּכְבָּד
  choice: envers l’homme honoré
  rationale: Le terme qualifie celui qui jouit de poids, d’honneur ou de considération dans la société; « honoré » maintient le contraste lexical avec « méprisé ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est maintenu dans une forme idiomatique; les contrastes d’âge et de statut restent nets, tandis que la note préserve l’ambiguïté réelle de זָקֵן.
