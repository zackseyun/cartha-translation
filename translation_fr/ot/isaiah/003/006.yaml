id: ISA.3.6
reference: Isaiah 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יִתְפֹּ֨שׂ אִ֤ישׁ בְּ/אָחִי/ו֙ בֵּ֣ית אָבִ֔י/ו שִׂמְלָ֣ה לְ/כָ֔ה קָצִ֖ין תִּֽהְיֶה לָּ֑/נוּ וְ/הַ/מַּכְשֵׁלָ֥ה הַ/זֹּ֖את תַּ֥חַת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
translation:
  language: fr
  text: 'Car un homme saisira son frère dans la maison de son père : « Tu as un manteau ; tu seras notre chef, et ce désastre[a] sera sous ta main[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet effondrement » ; plus littéralement, « cette pierre d’achoppement » ou « cette cause de chute ».
    reason: lexical_alternative
  - marker: b
    text: « Sous ta main » est une expression hébraïque qui signifie « sous ton autorité » ou « sous ta responsabilité ».
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit une scène qui explique et illustre l’effondrement social décrit dans le contexte précédent.
- source_word: יִתְפֹּשׂ
  choice: saisira
  rationale: 'Rend la force de l’action : l’homme agrippe son frère pour lui imposer une responsabilité.'
- source_word: אִישׁ
  choice: un homme
  rationale: Respecte la forme masculine singulière et le caractère concret de la scène.
- source_word: בְּאָחִיו
  choice: son frère
  rationale: Le sens ordinaire de אָח convient particulièrement au cadre explicite de la maison paternelle.
- source_word: בֵּית אָבִיו
  choice: dans la maison de son père
  rationale: Conserve le cadre familial ou domestique exprimé par l’hébreu.
- source_word: שִׂמְלָה
  choice: un manteau
  rationale: Désigne ici un vêtement extérieur ; sa possession devient le signe dérisoire d’une aptitude supposée à diriger.
- source_word: לְכָה
  choice: Tu as
  rationale: Rend naturellement en français la construction hébraïque qui exprime la possession.
- source_word: קָצִין
  choice: chef
  rationale: Terme courant pour une personne investie d’autorité, sans imposer un sens exclusivement militaire.
- source_word: תִּהְיֶה לָּנוּ
  choice: tu seras notre chef
  rationale: Conserve la forme verbale et sa valeur d’injonction ou de désignation insistante.
- source_word: הַמַּכְשֵׁלָה הַזֹּאת
  choice: ce désastre
  rationale: Exprime naturellement la débâcle collective visée dans le contexte, tout en signalant en note le sens imagé plus littéral.
- source_word: תַּחַת יָדֶךָ
  choice: sera sous ta main
  rationale: Préserve l’image concrète de l’idiome hébreu, dont le sens est précisé en note.
theological_decisions: []
translation_notes:
  register: 'Français moderne, clair et digne. La formulation conserve l’ironie tragique de la scène : la simple possession d’un manteau suffit à faire désigner quelqu’un comme chef. Les images hébraïques sont maintenues lorsque leur sens peut être explicité brièvement en note.'
