  variant: modern international French
source:
  edition: WLC
  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ חַי אָ֣נִי נְאֻם יְהוָ֗ה כִּ֤י כֻלָּ/ם֙ כָּ/עֲדִ֣י תִלְבָּ֔שִׁי וּֽ/תְקַשְּׁרִ֖י/ם כַּ/כַּלָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
translation:
  language: fr
  text: 'Lève les yeux et regarde tout autour : tous se sont rassemblés, ils viennent vers toi. Aussi vrai que je suis vivant — déclaration de Yahweh —, tu les porteras tous comme une parure[a] et tu te les attacheras comme une mariée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des bijoux » ; le terme hébreu peut désigner une parure, un ornement ou des bijoux.'
    reason: Alternative lexicale pour עֲדִי, nom singulier pouvant avoir un sens collectif.
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Lève les yeux tout autour et regarde
  rationale: Les impératifs féminins singuliers s’adressent à Sion personnifiée. Cette formulation naturelle conserve l’appel à regarder dans toutes les directions.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: ils se sont tous rassemblés, ils viennent vers toi
  rationale: Le parfait de נִקְבְּצוּ présente le rassemblement comme accompli, tandis que le présent de « viennent » restitue l’immédiateté de la vision prophétique sans effacer la succession des deux verbes.
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Équivalent français idiomatique de la formule divine de serment, plus naturel ici que le calque « Je suis vivant ».
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: « Déclaration » garde le caractère solennel de la formule prophétique, et « Yahweh » rend directement le nom divin.
- source_word: כָּעֲדִי תִלְבָּשִׁי
  choice: tu te revêtiras d’eux tous comme d’une parure
  rationale: Le verbe לבש exprime l’action de se vêtir ou de porter, tandis que עֲדִי désigne une parure, un ornement ou des bijoux. La tournure française préserve l’image où les personnes rassemblées deviennent la parure de Sion.
- source_word: וּתְקַשְּׁרִים כַּכַּלָּה
  choice: tu te les attacheras comme une mariée
  rationale: Le suffixe masculin pluriel renvoie aux personnes rassemblées. La comparaison avec la mariée conserve l’image de parures attachées sur elle sans préciser davantage que l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Valeur de כִּי après la formule de serment
  choice: La force affirmative est exprimée par la construction « Aussi vrai que… » suivie de la promesse
  alternative: car / assurément
  rationale: Dans ce contexte, כִּי introduit le contenu solennel du serment. Le français n’exige pas un connecteur distinct, et la construction retenue transmet l’assurance sans imposer une valeur causale.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le féminin de « mariée » et les formes verbales adressées à une femme reflètent Sion personnifiée. Les temps verbaux associent accomplissement prophétique et vision rendue présente.
