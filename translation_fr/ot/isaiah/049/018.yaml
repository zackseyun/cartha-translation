review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement les impératifs féminins adressés à Sion, le rassemblement et la venue de « tous », la formule de serment divine, ainsi que la double image de la parure nuptiale. « Tu les porteras tous comme une parure » restitue plus directement le complément pluriel de l’hébreu que « tu te revêtiras d’eux tous ».
  naturalness: « Lève les yeux tout autour » est peu idiomatique en français moderne. « Lève les yeux et regarde tout autour » est naturel tout en conservant les deux impératifs. « Tu les porteras tous comme une parure » est également plus fluide et plus clair.
  terminology: « Yahweh » correspond au choix rédactionnel pour le Tétragramme. « Déclaration de Yahweh » convient au registre prophétique. « Parure » est un équivalent précis et naturel de עֲדִי; la note conserve l’alternative collective « bijoux ».
  issues:
  - severity: low
    issue: Formulation initiale peu naturelle
    rationale: 'En français, « lever les yeux tout autour » associe maladroitement le mouvement des yeux à l’indication spatiale. L’indication « tout autour » se rattache naturellement à « regarde ». '
  - severity: low
    issue: Image de la parure formulée de façon lourde
    rationale: « Se revêtir d’eux tous comme d’une parure » est compréhensible, mais « les porter tous comme une parure » suit plus clairement la construction hébraïque, où « tous » est l’objet porté comme un ornement.
