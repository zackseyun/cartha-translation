- from: 'Lève les yeux tout autour et regarde : ils se sont tous rassemblés, ils viennent vers toi. Aussi vrai que je suis vivant — déclaration de Yahweh —, tu te revêtiras d’eux tous comme d’une parure[a] et tu te les attacheras comme une mariée.'
  to: 'Lève les yeux et regarde tout autour : tous se sont rassemblés, ils viennent vers toi. Aussi vrai que je suis vivant — déclaration de Yahweh —, tu les porteras tous comme une parure[a] et tu te les attacheras comme une mariée.'
  rationale: La révision améliore l’idiomaticité française et rend plus transparente l’image selon laquelle les personnes rassemblées deviennent la parure de Sion. Elle conserve les temps de la vision prophétique, l’adresse féminine, l’ambiguïté sobre de l’image nuptiale et l’ancrage de note existant.
