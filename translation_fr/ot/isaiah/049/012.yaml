  text: הִנֵּה אֵ֕לֶּה מֵ/רָח֖וֹק יָבֹ֑אוּ וְ/הִֽנֵּה אֵ֨לֶּה֙ מִ/צָּפ֣וֹן וּ/מִ/יָּ֔ם וְ/אֵ֖לֶּה מֵ/אֶ֥רֶץ סִינִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/012.yaml
  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
translation:
  language: fr
  text: 'Voici : ceux-ci viendront de loin ; voici : ceux-ci viendront du nord et de la mer[a] ; et ceux-ci, du pays de Sinim[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « de l’ouest », car, dans l’usage géographique hébreu, « la mer » peut désigner l’ouest.
    reason: lexical_alternative
  - marker: b
    text: « Sinim » est un nom de lieu dont l’identification est incertaine. On a notamment proposé Syène, l’actuelle Assouan, dans le sud de l’Égypte ; d’autres ont suggéré une région orientale plus lointaine, mais sa localisation reste inconnue.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Regardez
  rationale: Interjection destinée à attirer l’attention. « Regardez » est naturel en français moderne et sa répétition reproduit celle de l’hébreu.
- source_word: אֵלֶּה
  choice: ceux-ci / ceux-là / d’autres
  rationale: Le démonstratif pluriel désigne successivement des groupes distincts. La variation française évite une répétition peu naturelle tout en conservant la structure déictique.
- source_word: מֵרָחוֹק
  choice: de loin
  rationale: Équivalent français idiomatique exprimant clairement l’éloignement spatial.
- source_word: יָבֹאוּ
  choice: viendront
  rationale: L’imparfait hébreu a ici une valeur future dans le contexte.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Traduction directe et naturelle de l’indication géographique.
- source_word: וּמִיָּם
  choice: et de la mer
  rationale: Rend le sens lexical immédiat de יָם sans résoudre l’éventuelle valeur géographique « ouest » ; cette possibilité est signalée en note.
- source_word: מֵאֶרֶץ
  choice: du pays de
  rationale: Dans cette construction avec un nom de lieu, « pays de » est plus naturel en français courant que « terre de ».
- source_word: סִינִים
  choice: Sinim
  rationale: Le lieu demeure incertain ; la translittération évite d’imposer une identification conjecturale.
