source:
  edition: WLC
  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
translation:
  language: fr
  text: 'Et maintenant, Yahweh, lui qui m’a façonné dès le ventre maternel pour être son serviteur, pour ramener Jacob vers lui et pour qu’Israël soit rassemblé vers lui[a], dit : « Je suis honoré aux yeux de Yahweh, et mon Dieu est devenu ma force. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte consonantique hébreu porte : « et Israël ne sera pas rassemblé » ; on peut aussi comprendre : « bien qu’Israël ne soit pas rassemblé ». Plusieurs versions et traditions anciennes comprennent plutôt : « et Israël sera rassemblé vers lui », en parallèle avec « ramener Jacob vers lui ».'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa valeur d’alliance.
- source_word: יֹצְרִי מִבֶּטֶן
  choice: lui qui m’a façonné dès le ventre maternel
  rationale: « Façonner » rend l’idée de formation intentionnelle portée par יצר ; « dès le ventre maternel » exprime naturellement l’appel remontant à la vie prénatale.
- source_word: לְעֶבֶד לוֹ
  choice: pour que je sois son serviteur
  rationale: « Serviteur » convient au contexte vocationnel du chant sans imposer ici l’accent social de « esclave ».
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  choice: pour ramener Jacob à lui
  rationale: Rend le sens causatif de שוב et conserve le mouvement de retour vers Dieu.
- source_word: וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: et pour qu’Israël soit rassemblé auprès de lui
  rationale: Le texte principal suit la lecture לוֹ, soutenue par le parallélisme et d’anciennes versions ; la lecture négative du texte massorétique écrit est signalée en note.
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  choice: je suis honoré aux yeux de Yahweh
  rationale: Le niphal de כבד exprime ici l’honneur ou la considération ; le présent français convient à l’état affirmé dans le contexte.
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  choice: et mon Dieu est ma force
  rationale: Cette formulation française naturelle rend la réalité résultante exprimée par היה et conserve le sens direct de עֹז, « force ».
theological_decisions:
- issue: Lecture de וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: « et pour qu’Israël soit rassemblé auprès de lui » dans le texte principal
  alternative: « bien qu’Israël ne soit pas rassemblé » ou « et Israël ne sera pas rassemblé »
  rationale: La lecture positive s’accorde étroitement avec « ramener Jacob à lui » et bénéficie de l’appui d’anciennes traditions textuelles. La lecture négative attestée par le texte massorétique écrit demeure toutefois authentiquement possible et est donc conservée explicitement en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’ampleur poétique de l’hébreu, tandis que les infinitifs de mission sont explicités naturellement. Le deux-points clôt l’incise longue et introduit clairement la déclaration principale.
