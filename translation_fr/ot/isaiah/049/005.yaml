  rationale: La révision clarifie la syntaxe française de la parole prophétique, préserve les infinitifs de mission et rend plus nettement la valeur résultative du parfait « mon Dieu est devenu ma force ». La variante textuelle demeure explicitement signalée à l’ancre appropriée, sans effacer l’ambiguïté du texte consonantique.
