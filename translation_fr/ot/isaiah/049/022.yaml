review_pass:
  verdict: revise
  source_fidelity: 'Le verset est globalement fidèle au texte massorétique : le titre divin, le geste de la main, le parallélisme « nations/peuples », l’étendard et le passif final sont bien rendus. Toutefois, « ramèneront » explicite un retour que le verbe הֵבִיאוּ (« amèneront/apporteront ») ne porte pas à lui seul. « Amèneront » conserve le mouvement vers Sion sans ajouter cette nuance. « Dans le pli de leur vêtement » est défendable, mais une formulation plus naturelle peut rendre l’image tout en laissant la précision lexicale à la note.'
  naturalness: Le registre est solennel et accessible. « Dans le pli de leur vêtement » reste un peu raide dans le corps du texte ; « contre leur poitrine » est plus idiomatique en français moderne pour des enfants portés près du corps. La note conserve la référence au « sein » et au pli du vêtement.
  terminology: « Le Seigneur Yahweh » distingue correctement אַדֹנָי de יהוה conformément au choix fourni. « Étendard », « nations » et « peuples » conviennent au contexte prophétique et à la variation lexicale hébraïque.
  issues:
  - severity: low
    issue: « ramèneront » est plus interprétatif que le verbe hébreu.
    rationale: הֵבִיאוּ signifie fondamentalement « ils amèneront/feront venir ». Le contexte implique certes la restauration des enfants de Sion, mais « amèneront » préserve plus exactement la formulation sans perdre l’orientation vers la destinataire.
  - severity: low
    issue: La formulation corporelle principale est peu idiomatique.
    rationale: Le sens de בְּחֹצֶן est celui d’un enfant porté au sein, dans le giron ou le pli du vêtement. « Contre leur poitrine » communique naturellement ce portage rapproché ; la note transmet la portée littérale et matérielle du terme.
