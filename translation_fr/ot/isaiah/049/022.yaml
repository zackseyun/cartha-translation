  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Voici, je lèverai la main vers les nations, je dresserai mon étendard[a] vers les peuples. Ils amèneront tes fils contre leur poitrine[b], et tes filles seront portées sur l’épaule. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon signal » ou « mon enseigne ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans le sein » ; le terme peut aussi désigner le pli ample du vêtement, où l’on portait un enfant tout contre le corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יְהוִה, sans produire l’expression française maladroite « le Seigneur SEIGNEUR ».
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force déictique et solennelle de l’interjection prophétique dans un français actuel.
- source_word: אֶשָּׂא ... יָדִי
  choice: je lèverai la main
  rationale: Préserve l’image hébraïque d’un geste public servant ici de signal ou de convocation.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Désigne largement les nations étrangères, sans introduire le sens technique plus tardif de « païens ».
- source_word: אָרִים נִסִּי
  choice: je dresserai mon étendard
  rationale: נֵס peut désigner un signal, une enseigne ou un étendard dressé bien en vue; « étendard » conserve l’image de ralliement.
- source_word: עַמִּים
  choice: les peuples
  rationale: Reproduit la variation lexicale et le parallélisme avec גּוֹיִם sans exagérer la différence entre les deux termes.
- source_word: וְהֵבִיאוּ
  choice: ils ramèneront
  rationale: Dans le contexte du retour des enfants de Sion, « ramèneront » exprime naturellement le mouvement vers elle tout en restant fidèle au causatif « faire venir/apporter ».
- source_word: בָנַיִךְ
  choice: tes fils
  rationale: Respecte le terme masculin, mis intentionnellement en parallèle avec « tes filles ».
- source_word: בְּחֹצֶן
  choice: dans le pli de leur vêtement
  rationale: Rend concrètement le sein ou pli du vêtement dans lequel on pouvait porter un enfant contre soi, plutôt que de généraliser en « dans leurs bras ».
- source_word: בְנֹתַיִךְ
  choice: tes filles
  rationale: Traduction directe et sexuée du pluriel hébreu.
- source_word: עַל כָּתֵף תִּנָּשֶׂאנָה
  choice: seront portées sur l’épaule
  rationale: Conserve le passif du nifal et le singulier collectif du terme « épaule ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin יהוה. « Yahweh » le distingue du titre אֲדֹנָי et évite d’effacer le nom d’alliance derrière un substitut typographique.
- issue: Identité des agents qui ramènent les enfants de Sion
  choice: maintien du pronom « ils » sans explicitation
  alternative: « les nations ramèneront »
  rationale: Le sujet grammatical est implicite et se comprend à partir des nations et des peuples du premier membre; ne pas le préciser davantage préserve la formulation du texte.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes inutiles. Le futur prophétique, le parallélisme « nations/peuples » et les images corporelles du texte hébreu sont conservés. Les guillemets français délimitent la parole divine.
