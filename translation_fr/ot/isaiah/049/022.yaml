revisions:
- from: 'Ainsi parle le Seigneur Yahweh : « Voici, je lèverai la main vers les nations, je dresserai mon étendard[a] vers les peuples. Ils ramèneront tes fils dans le pli de leur vêtement[b], et tes filles seront portées sur l’épaule. »'
  to: 'Ainsi parle le Seigneur Yahweh : « Voici, je lèverai la main vers les nations, je dresserai mon étendard[a] vers les peuples. Ils amèneront tes fils contre leur poitrine[b], et tes filles seront portées sur l’épaule. »'
  rationale: La révision remplace « ramèneront » par « amèneront » afin de ne pas introduire dans le verbe lui-même la notion de retour, bien que celle-ci soit compatible avec le contexte. Elle adopte une expression française plus fluide pour le portage des fils, tout en préservant l’image lexicale précise dans la note. Les ancres et les deux notes demeurent correctement associées à leurs termes respectifs.
