source:
  edition: WLC
  text: מִֽהֲר֖וּ בָּנָ֑יִ/ךְ מְהָֽרְסַ֥יִ/ךְ וּ/מַחֲרִבַ֖יִ/ךְ מִמֵּ֥/ךְ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/017.yaml
  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
translation:
  language: fr
  text: Tes enfants reviennent en hâte[a] ; ceux qui t’ont démolie et dévastée s’éloigneront de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tes bâtisseurs se hâtent. » Certains témoins anciens reflètent « bâtisseurs » au lieu de « enfants ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  choice: reviennent en hâte
  rationale: Le verbe מהר signifie « se hâter ». Dans le contexte, avec « tes enfants » et en contraste avec les dévastateurs qui s’en vont, le retour est implicite ; « reviennent en hâte » l’exprime naturellement sans alourdir le texte.
- source_word: בָּנָיִךְ
  choice: tes enfants
  rationale: Le texte massorétique vocalisé porte « tes fils », au sens des enfants ou habitants de Sion. « Tes enfants » est naturel en français moderne et convient à Sion personnifiée. La lecture ancienne « tes bâtisseurs » est signalée en note.
- source_word: מְהָרְסַיִךְ
  choice: ceux qui t’ont démolie
  rationale: Le participe de הרס signifie « démolir, abattre ». La proposition relative est idiomatique en français et maintient l’image de la ville détruite ; le féminin s’accorde avec Sion personnifiée.
- source_word: וּמַחֲרִבַיִךְ
  choice: et dévastée
  rationale: Le participe désigne ceux qui rendent un lieu désert ou le ravagent. Coordonné à « démolie », « dévastée » rend la gravité de la ruine tout en évitant une répétition lourde du sujet.
- source_word: מִמֵּךְ
  choice: de toi
  rationale: La préposition מן avec suffixe féminin singulier marque directement l’éloignement à partir de Sion.
- source_word: יֵצֵאוּ
  choice: s’éloigneront
  rationale: יצא signifie « sortir, partir ». Avec מִמֵּךְ et pour sujet les destructeurs, « s’éloigneront de toi » est idiomatique et exprime clairement leur départ.
theological_decisions:
- issue: Lecture de בָּנָיִךְ
  choice: tes enfants
  alternative: tes bâtisseurs
  rationale: La vocalisation massorétique donne « tes fils/enfants » et s’accorde avec le thème du retour des enfants de Sion, tandis que ses destructeurs partent. Certains témoins anciens reflètent « tes bâtisseurs » ; cette variante pertinente est conservée en note plutôt qu’intégrée au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement féminin reprend Sion personnifiée. Le parallélisme oppose nettement le retour rapide de ses enfants au départ de ceux qui l’ont détruite.
