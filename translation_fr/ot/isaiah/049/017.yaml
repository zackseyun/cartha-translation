  source_fidelity: 'Le texte principal suit correctement le texte massorétique : בָּנָיִךְ est rendu par « tes enfants », et l’opposition entre leur arrivée rapide et le départ des agents de destruction est bien conservée. « Reviennent en hâte » explicite de façon contextuellement défendable le mouvement de retour implicite dans l’oracle de restauration, en accord avec l’audit anglais, sans modifier l’affirmation essentielle. Les deux participes destructeurs sont rendus avec justesse par « ceux qui t’ont démolie et dévastée », tandis que le futur de יֵצֵאוּ est conservé dans « s’éloigneront ».'
