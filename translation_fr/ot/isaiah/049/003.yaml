  yaml_path: translation/ot/isaiah/049/003.yaml
  text: And he said to me[a], “You are my servant, Israel, in whom I will be glorified.”
translation:
  language: fr
  text: 'Il m’a dit : « Tu es mon serviteur, Israël, en qui je me glorifierai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en toi je manifesterai ma gloire » ou « en toi je serai glorifié ». Le verbe hébreu exprime que Dieu se glorifie ou se montre glorieux en son serviteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Il m’a dit
  rationale: Le wayyiqtol de אמר poursuit la séquence, et לִי désigne naturellement la personne à qui Dieu parle. En français, « Il m’a dit » est plus idiomatique que « Et il a dit à moi », sans perdre la progression du discours.
- source_word: עַבְדִּי אָתָּה
  choice: Tu es mon serviteur
  rationale: עֶבֶד désigne ici celui qui est au service de Dieu et chargé d’une mission. « Serviteur » convient au contexte d’Ésaïe sans accentuer indûment l’idée de condition servile. Le pronom indépendant אָתָּה est rendu explicitement par « tu ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé en apostrophe/apposition à « mon serviteur », sans décider s’il désigne la nation, un reste fidèle ou un serviteur individuel représentant Israël.
- source_word: אֲשֶׁר בְּךָ
  choice: en qui
  rationale: אֲשֶׁר introduit une relative et בְּךָ signifie littéralement « en toi ». Après le nom personnel « Israël », « en qui » préserve naturellement en français la relation syntaxique et la valeur fondamentale de la préposition.
- source_word: אֶתְפָּאָר
  choice: je manifesterai ma gloire
  rationale: Le hitpael de פאר exprime le fait de se montrer glorieux ou de manifester sa splendeur. « Je manifesterai ma gloire » rend cette nuance réflexive de manière claire et digne, tandis que la note conserve l’alternative plus formelle « je serai glorifié ».
theological_decisions:
- issue: Identité du serviteur appelé « Israël »
  choice: Conserver l’adresse directe « Tu es mon serviteur, Israël » sans préciser davantage l’identité du serviteur.
  alternative: Identifier explicitement le serviteur à la nation entière, au reste fidèle ou au Messie représentant Israël.
  rationale: Le verset nomme le serviteur « Israël », mais le contexte plus large entretient une tension entre identification, distinction et représentation. La traduction ne doit pas trancher cette question interprétative.
- issue: Mode de manifestation de la gloire divine
  choice: « en qui je manifesterai ma gloire »
  alternative: « par qui je manifesterai ma gloire »
  rationale: « En qui » suit plus directement בְּךָ et laisse ouverte la manière exacte dont Dieu sera glorifié dans ou par son serviteur, alors que « par qui » imposerait plus nettement une valeur instrumentale.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation française et l’apostrophe « Israël » rendent clairement l’adresse directe. Le relatif « en qui » maintient un registre soutenu mais accessible.
