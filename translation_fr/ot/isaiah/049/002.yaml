source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם פִּ/י֙ כְּ/חֶ֣רֶב חַדָּ֔ה בְּ/צֵ֥ל יָד֖/וֹ הֶחְבִּיאָ֑/נִי וַ/יְשִׂימֵ֨/נִי֙ לְ/חֵ֣ץ בָּר֔וּר בְּ/אַשְׁפָּת֖/וֹ הִסְתִּירָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
translation:
  language: fr
  text: Il a fait de ma bouche une épée tranchante ; à l’ombre de sa main, il m’a caché. Il a fait de moi une flèche polie[a] ; dans son carquois, il m’a dissimulé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une flèche choisie », « une flèche aiguisée » ou « une flèche purifiée ». L’adjectif hébreu désigne ce qui est purifié ou affiné et, dans ce contexte, évoque probablement une flèche soigneusement préparée pour l’usage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי
  choice: Il a rendu ma bouche
  rationale: Avec un complément comparatif, שׂוּם exprime ici le fait de donner à la bouche une certaine qualité. « Rendre » est naturel en français et conserve explicitement l’image corporelle de la bouche.
- source_word: כְּחֶרֶב חַדָּה
  choice: semblable à une épée tranchante
  rationale: La comparaison et l’image concrète sont maintenues. « Épée tranchante » rend naturellement חֶרֶב חַדָּה en français moderne.
- source_word: בְּצֵל יָדוֹ
  choice: à l’ombre de sa main
  rationale: Cette formulation reproduit l’image hébraïque sans préciser si elle évoque surtout la protection, la dissimulation ou la mise en réserve.
- source_word: הֶחְבִּיאָנִי
  choice: il m’a caché
  rationale: Le hiphil de חבא signifie cacher ou dissimuler. « Caché » est direct et idiomatique.
- source_word: וַיְשִׂימֵנִי לְחֵץ
  choice: Il a fait de moi une flèche
  rationale: « Faire de moi » exprime naturellement en français le résultat ou la fonction introduite par לְ, sans réduire l’expression à une simple mise en place.
- source_word: בָּרוּר
  choice: polie
  rationale: L’adjectif peut évoquer ce qui est purifié, affiné, choisi ou soigneusement préparé. Dans l’image d’une flèche, « polie » fournit un sens concret plausible tout en laissant les autres nuances en note.
- source_word: בְּאַשְׁפָּתוֹ
  choice: dans son carquois
  rationale: « Carquois » est l’équivalent français précis et usuel de אַשְׁפָּה dans ce contexte.
- source_word: הִסְתִּירָנִי
  choice: il m’a dissimulé
  rationale: Le hiphil de סתר signifie cacher ou dissimuler. Le choix de « dissimulé » distingue légèrement la formulation du premier verbe sans introduire de différence théologique.
theological_decisions:
- issue: Images guerrières appliquées à la bouche et à la vocation du serviteur
  choice: Conserver les métaphores concrètes de l’épée tranchante et de la flèche polie sans les expliquer dans le corps du verset.
  alternative: Les expliciter comme une référence à une parole puissante, à la prophétie ou à une mission messianique.
  rationale: Le verset présente ces images sans en déterminer ici toute la portée théologique. Leur maintien préserve la force poétique, l’ambiguïté légitime et l’ouverture du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux images et celui des deux verbes de dissimulation sont conservés, avec une légère variation lexicale naturelle en français.
