  source_fidelity: 'Le projet rend fidèlement les éléments essentiels du texte massorétique : le hifil causatif (« je ferai manger »), les oppresseurs, l’image volontairement violente de leur propre chair et de leur propre sang, l’ivresse, « toute chair », ainsi que les titres divins « ton Sauveur », « ton Rédempteur » et « le Puissant de Jacob ». « Yahweh » reproduit de manière cohérente le tétragramme. La nuance de comparaison associée à עָסִיס est préservée.'
  naturalness: 'La formulation « Je ferai manger à ceux qui t’oppriment leur propre chair » est compréhensible, mais son ordre des compléments est moins naturel en français courant. Placer le complément direct avant le complément introduit par « à » rend la causation plus nette et la phrase plus fluide. La note doit aussi distinguer clairement les possibilités lexicales : le terme peut désigner du vin doux/nouveau ou du jus fraîchement pressé, plutôt qu’un « vin [...] fraîchement pressé ».'
  terminology: « Toute chair », « Sauveur », « Rédempteur » et « le Puissant de Jacob » sont des choix exacts, littéraux là où cela est pertinent, et d’un registre prophétique naturel. Aucune précision doctrinale indue n’est introduite.
