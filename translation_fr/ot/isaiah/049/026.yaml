source:
  edition: WLC
  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: fr
  text: Je ferai manger leur propre chair à ceux qui t’oppriment, et ils s’enivreront de leur propre sang comme de vin doux[a]. Alors toute chair saura que moi, Yahweh, je suis ton Sauveur et ton Rédempteur, le Puissant de Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vin nouveau ». Le mot hébreu עָסִיס peut désigner du vin doux, du vin nouveau ou du jus fraîchement pressé.'
    reason: Variante lexicale permettant de conserver l’étendue de sens du terme hébreu.
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  choice: Je ferai manger
  rationale: Le hifil de אכל a une valeur causative. Cette formulation française exprime directement l’action imposée par Yahweh.
- source_word: מוֹנַיִךְ
  choice: ceux qui t’oppriment
  rationale: Le terme désigne ceux qui maltraitent ou oppriment Sion. La tournure est claire, actuelle et conserve l’adresse féminine singulière.
- source_word: בְּשָׂרָם
  choice: leur propre chair
  rationale: Le suffixe possessif renvoie aux oppresseurs eux-mêmes. « Leur propre chair » rend explicite en français l’image de leur autodestruction.
- source_word: וְכֶעָסִיס
  choice: comme de vin doux
  rationale: עָסִיס peut désigner du vin doux ou nouveau, ou encore le jus fraîchement pressé. Dans ce contexte d’ivresse, « vin doux » restitue naturellement la boisson enivrante tout en laissant l’autre nuance en note.
- source_word: דָּמָם
  choice: leur propre sang
  rationale: Le possessif est rendu avec « propre » pour souligner le parallélisme avec « leur propre chair ».
- source_word: יִשְׁכָּרוּן
  choice: ils s’enivreront
  rationale: Le verbe exprime le fait de devenir ivre. La forme pronominale française est concise, vive et naturelle.
- source_word: כָל בָּשָׂר
  choice: toute chair
  rationale: La traduction littérale conserve le registre prophétique, la portée universelle et les échos bibliques de cette expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: מוֹשִׁיעֵךְ
  choice: ton Sauveur
  rationale: Cette formulation concise exprime l’identité et l’action salvatrice attribuées à Yahweh.
- source_word: וְגֹאֲלֵךְ
  choice: ton Rédempteur
  rationale: « Rédempteur » préserve le terme majeur de la théologie d’Ésaïe sans préciser indûment la notion de proche parent.
- source_word: אֲבִיר יַעֲקֹב
  choice: le Puissant de Jacob
  rationale: Le titre rend la force exprimée par אֲבִיר et conserve « Jacob », conformément au texte hébreu.
theological_decisions:
- issue: Conserver ou atténuer les images violentes du jugement
  choice: Maintenir explicitement l’image des oppresseurs mangeant leur propre chair et s’enivrant de leur propre sang
  alternative: Paraphraser le passage comme une annonce générale de l’autodestruction des ennemis
  rationale: La violence saisissante appartient à la rhétorique prophétique du texte et décrit le renversement du sort des oppresseurs. L’atténuer ferait perdre une dimension essentielle de l’oracle.
- issue: Traduction de כָל בָּשָׂר
  choice: toute chair
  alternative: tous les humains
  rationale: « Toute chair » préserve l’expression hébraïque, son registre prophétique, sa portée universelle et sa résonance intertextuelle sans la réduire à une explication.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier respecte l’adresse faite à Sion. Les images poétiques et judiciaires sont conservées sans euphémisation. Le marqueur de note est placé après « vin doux », expression à laquelle la variante se rapporte.
