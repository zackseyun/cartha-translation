  to: 'Ainsi parle Yahweh :


    « Au temps de la faveur, je t’ai répondu ;

    au jour du salut, je t’ai secouru.

    Je te garderai et je te donnerai

    comme alliance pour le peuple,[a]

    afin de relever le pays[b]

    et d’attribuer en héritage les patrimoines dévastés. »'
  rationale: La révision conserve le sens, le registre et la structure poétique du projet, mais rend explicitement « je te donnerai » et remplace une formulation finale qui risquait d’ajouter une restitution implicite par une expression française fidèle au sens d’attribuer en héritage.
