  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה בְּ/עֵ֤ת רָצוֹן֙ עֲנִיתִ֔י/ךָ וּ/בְ/י֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑י/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֙ לִ/בְרִ֣ית עָ֔ם לְ/הָקִ֣ים אֶ֔רֶץ לְ/הַנְחִ֖יל נְחָל֥וֹת שֹׁמֵמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
translation:
  language: fr
  text: 'Ainsi parle Yahweh :


    « Au temps de la faveur, je t’ai répondu ;

    au jour du salut, je t’ai secouru.

    Je te garderai et je te donnerai

    comme alliance pour le peuple,[a]

    afin de relever le pays[b]

    et d’attribuer en héritage les patrimoines dévastés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme alliance destinée au peuple ». Littéralement, « comme alliance pour le peuple » ; la relation exacte exprimée par cette formule concise demeure ouverte.
    reason: La formule לִבְרִית עָם présente le serviteur lui-même comme alliance, sans préciser davantage la relation exprimée par « pour le peuple ».
  - marker: b
    text: Ou « afin de rétablir le pays » ou « d’établir le pays ».
    reason: Le hiphil de קום peut évoquer l’action de relever, de rétablir ou d’établir.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel sous une forme largement reconnue en français et conforme au choix éditorial du projet.
- source_word: בְּעֵת רָצוֹן
  choice: Au temps de la faveur
  rationale: רָצוֹן exprime ici la faveur ou l’accueil favorable. Cette formulation reste proche de l’hébreu tout en étant naturelle et digne en français.
- source_word: עֲנִיתִיךָ
  choice: je t’ai répondu
  rationale: Rend directement le sens courant de ענה, sans ajouter « favorablement », déjà suggéré par le contexte.
- source_word: וּבְיוֹם יְשׁוּעָה
  choice: au jour du salut
  rationale: « Salut » préserve à la fois l’idée de délivrance concrète et la portée rédemptrice possible du terme יְשׁוּעָה. Le français idiomatique préfère ici l’article défini sans imposer que l’hébreu marque lui-même la détermination.
- source_word: עֲזַרְתִּיךָ
  choice: je t’ai secouru
  rationale: « Secourir » rend clairement עזר et s’accorde naturellement avec un contexte de salut, sans élargir le sens.
- source_word: וְאֶצָּרְךָ
  choice: Je te garderai
  rationale: נצר désigne l’action de garder, protéger ou préserver. « Garder » conserve cette amplitude avec concision.
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  choice: je ferai de toi une alliance pour le peuple
  rationale: Cette tournure française exprime naturellement l’hébreu littéral « je te donnerai comme alliance », tout en conservant l’affirmation dense selon laquelle le serviteur lui-même est donné dans un rôle d’alliance.
- source_word: לְהָקִים אֶרֶץ
  choice: afin de relever le pays
  rationale: Le hiphil de קום peut signifier relever, rétablir ou restaurer. « Relever » préserve l’image verbale et convient à un pays dévasté, tandis qu’une note signale l’autre possibilité majeure.
- source_word: לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  choice: rendre en héritage les domaines dévastés
  rationale: Le hiphil de נחל signifie faire hériter ou attribuer en héritage. « Rendre en héritage » est intelligible en français et suggère la restitution de possessions devenues dévastées; « domaines » évite la répétition peu naturelle d’« héritages » tout en désignant les parts patrimoniales.
theological_decisions:
- issue: Identité et fonction du destinataire comme « alliance pour le peuple »
  choice: Conserver l’énoncé selon lequel le serviteur est lui-même fait « alliance pour le peuple ».
  alternative: Présenter le serviteur comme médiateur d’une alliance ou comme celui qui établit l’alliance.
  rationale: La construction לִבְרִית עָם attribue directement au destinataire un rôle ou une réalité d’alliance. La traduction ne réduit pas cette densité théologique à une fonction plus étroitement définie.
- issue: Portée de יְשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: « Salut » garde ensemble la délivrance historique et une possible portée rédemptrice plus large, sans exclure le sens concret de secours.
- issue: Référent de עָם
  choice: le peuple
  alternative: un peuple
  rationale: Le contexte favorise le peuple de l’alliance, mais le texte ne précise pas davantage son identité; la traduction conserve donc la formulation simple sans explicitation doctrinale.
translation_notes:
  register: 'Français international moderne, solennel sans archaïsmes. Le parallélisme poétique est marqué par les retours à la ligne. Les temps verbaux suivent l’hébreu : actions passées de réponse et de secours, puis promesses futures de protection et de don. Les notes sont limitées aux ambiguïtés substantielles que le français principal ne peut pleinement conserver.'
