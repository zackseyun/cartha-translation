  variant: modern international French
source:
  edition: WLC
  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
translation:
  language: fr
  text: Des rois seront tes pères nourriciers[a], et leurs princesses, tes nourrices. Face contre terre, ils se prosterneront devant toi et lécheront la poussière de tes pieds. Alors tu sauras que je suis Yahweh ; ceux qui espèrent en moi ne seront pas couverts de honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes protecteurs ». Le terme hébreu désigne des hommes qui élèvent, soutiennent ou protègent quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui m’attendent ». Le verbe hébreu associe l’attente à une espérance confiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  choice: tes pères nourriciers
  rationale: Le terme masculin, mis en parallèle avec « tes nourrices », désigne des hommes chargés d’élever, de soutenir ou de protéger. « Pères nourriciers » conserve à la fois le genre, l’image familiale et la fonction protectrice.
- source_word: שָׂרוֹתֵיהֶם
  choice: leurs princesses
  rationale: Le féminin pluriel de שׂר peut désigner des princesses, des femmes nobles ou des dirigeantes. « Princesses » forme ici un parallèle naturel avec « rois ».
- source_word: מֵינִיקֹתַיִךְ
  choice: tes nourrices
  rationale: Le participe féminin désigne celles qui allaitent. « Nourrices » est naturel et préserve l’image concrète sans la périphrase plus lourde « mères qui t’allaitent ».
- source_word: אַפַּיִם אֶרֶץ
  choice: face contre terre
  rationale: L’expression littérale évoque le visage ou les narines contre la terre et décrit une prosternation complète. La formulation française est vive et idiomatique.
- source_word: יִשְׁתַּחֲווּ לָךְ
  choice: ils se prosterneront devant toi
  rationale: Le verbe exprime ici un geste d’hommage et de soumission. « Se prosterner devant » conserve le geste sans imposer le sens cultuel de « adorer ».
- source_word: וַעֲפַר רַגְלַיִךְ יְלַחֵכוּ
  choice: lécheront la poussière de tes pieds
  rationale: La traduction maintient l’image volontairement forte d’abaissement et de soumission totale.
- source_word: וְיָדַעַתְּ
  choice: Alors tu sauras
  rationale: Le féminin singulier s’adresse à Sion. « Alors » rend naturellement la portée consécutive de la proposition dans ce contexte prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֹא יֵבֹשׁוּ
  choice: ne seront pas couverts de honte
  rationale: Cette expression française rend l’idée d’une attente qui n’aboutit ni à la disgrâce ni à la déception publique.
- source_word: קוָֹי
  choice: ceux qui espèrent en moi
  rationale: Le participe de קוה associe attente confiante et espérance. « Espèrent en moi » exprime clairement cette confiance, tandis que la nuance temporelle est signalée en note.
theological_decisions:
- issue: Nature de l’hommage rendu à Sion
  choice: « ils se prosterneront devant toi »
  alternative: « ils t’adoreront »
  rationale: Le contexte décrit la soumission de rois et de princesses à Sion restaurée. Le geste peut ailleurs être cultuel, mais rien n’oblige ici à attribuer à Sion une adoration divine.
- issue: Rendu du tétragramme
  choice: « Yahweh »
  alternative: « le Seigneur » ou « l’Éternel »
  rationale: « Yahweh » conserve dans le corps du texte le caractère de nom propre de יהוה et évite de le remplacer silencieusement par un titre.
- issue: Nuance de קוה
  choice: « ceux qui espèrent en moi »
  alternative: « ceux qui m’attendent »
  rationale: Le verbe porte à la fois l’idée d’attendre et celle d’espérer avec confiance. Le texte principal privilégie un français naturel tout en maintenant l’autre nuance dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier est maintenu parce que le verset s’adresse à Sion personnifiée. Les images concrètes de la prosternation et de la poussière sont conservées.
