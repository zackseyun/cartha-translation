base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
translation:
  language: fr
  text: Écoutez-moi, îles[a] ; prêtez attention, peuples lointains ! Yahweh m’a appelé dès le ventre maternel ; depuis les entrailles de ma mère, il a fait mention de mon nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « régions côtières ». Le terme hébreu peut désigner des îles, des régions côtières ou, plus largement, des terres maritimes éloignées.
    reason: lexical_alternative
  - marker: b
    text: Ou « il a prononcé mon nom » ou « il m’a nommé ». L’expression hébraïque signifie littéralement qu’il a fait mention de son nom et peut évoquer le fait de nommer, de désigner ou d’appeler quelqu’un par son nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: L’impératif pluriel introduit un appel solennel à prêter l’oreille ; « Écoutez-moi » est direct et naturel en français moderne.
- source_word: אִיִּים
  choice: terres lointaines au-delà des mers
  rationale: Dans Ésaïe, le terme peut désigner des îles, des régions côtières ou, plus largement, les terres maritimes éloignées. Cette formulation naturelle garde cette portée sans limiter le référent aux seules îles.
- source_word: וְהַקְשִׁיבוּ
  choice: soyez attentifs
  rationale: L’impératif hiphil de קשׁב renforce l’appel à écouter et se rend dignement par « soyez attentifs ».
- source_word: לְאֻמִּים מֵרָחוֹק
  choice: peuples éloignés
  rationale: « Peuples » conserve la portée collective de לְאֻמִּים sans suggérer uniquement des États politiques ; « éloignés » exprime la distance géographique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִבֶּטֶן קְרָאָנִי
  choice: m’a appelé dès le ventre maternel
  rationale: « Appelé » conserve à la fois le sens simple de קרא et sa possible nuance de vocation ; « dès » exprime ici naturellement le point de départ prénatal indiqué par מִן.
- source_word: מִמְּעֵי אִמִּי
  choice: dès le sein de ma mère
  rationale: L’expression signifie littéralement « depuis les entrailles de ma mère ». « Le sein de ma mère » est idiomatique, digne et légèrement distinct de « ventre maternel » dans le premier membre.
- source_word: הִזְכִּיר שְׁמִי
  choice: il a prononcé mon nom
  rationale: Le hiphil de זכר signifie ici faire mention ou évoquer le nom. « Prononcer mon nom » reste naturel tout en évitant de trancher entièrement entre mention, désignation et nomination.
theological_decisions:
- issue: Identité et portée de l’appel prénatal du locuteur
  choice: Conserver la première personne et la formulation ouverte « m’a appelé »
  alternative: Expliciter une nomination, une consécration ou une mission messianique
  rationale: Le verset affirme un appel dès le ventre maternel sans définir à lui seul toute sa nature ni résoudre explicitement l’identité du serviteur.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le Tétragramme comme nom propre ; la translittération le rend visible sans lui substituer un titre.
- issue: Sens de הִזְכִּיר שְׁמִי
  choice: il a prononcé mon nom
  alternative: il m’a nommé / il a fait mention de mon nom
  rationale: La formulation choisie conserve la tension entre mention du nom, désignation personnelle et possible nomination, sans imposer une interprétation théologique plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le parallélisme poétique est marqué par deux impératifs puis par deux expressions prénatales. Les points d’exclamation rendent la force de l’adresse prophétique sans alourdir la syntaxe.
