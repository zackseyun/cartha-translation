base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/009.yaml
  text: saying to the prisoners[a], “Come out,” to those in darkness, “Show yourselves.” They will graze along the roads[b], and on all the bare heights will be their pasture.
translation:
  language: fr
  text: 'pour dire aux prisonniers : « Sortez ! » et à ceux qui sont dans les ténèbres : « Montrez-vous ! »[a] Ils paîtront le long des chemins, et leur pâturage sera sur toutes les hauteurs dénudées[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Paraissez ! » ou « Soyez révélés ! »'
    reason: lexical_alternative
  - marker: b
    text: 'Les « hauteurs dénudées » sont des sommets exposés ou dépourvus d’arbres ; autre traduction possible : « collines dénudées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: pour dire
  rationale: L’infinitif construit introduit le contenu de la mission évoquée au verset précédent et conserve le lien syntaxique avec celui-ci.
- source_word: לַאֲסוּרִים
  choice: aux prisonniers
  rationale: Le participe passif désigne des personnes liées ou détenues ; « prisonniers » est naturel et convient au contexte de libération.
- source_word: צֵאוּ
  choice: Sortez !
  rationale: L’impératif pluriel de יצא exprime directement l’ordre de quitter l’enfermement, sans préciser davantage le mouvement.
- source_word: לַאֲשֶׁר בַּחֹשֶׁךְ
  choice: à ceux qui sont dans les ténèbres
  rationale: Cette formulation préserve aussi bien la portée concrète que métaphorique de l’image.
- source_word: הִגָּלוּ
  choice: Montrez-vous !
  rationale: L’impératif nifal de גלה appelle ceux qui sont cachés à devenir visibles ; « Montrez-vous » est idiomatique tout en laissant possibles « paraissez » et « soyez révélés ».
- source_word: עַל דְּרָכִים
  choice: le long des chemins
  rationale: La préposition על avec « chemins » désigne ici les lieux où le troupeau trouve à paître ; « le long de » rend naturellement cette répartition spatiale.
- source_word: יִרְעוּ
  choice: Ils trouveront leur pâture
  rationale: Le verbe רעה évoque l’action de paître. Cette tournure conserve l’image pastorale et s’accorde naturellement avec des personnes figurées comme un troupeau.
- source_word: שְׁפָיִם
  choice: hauteurs dénudées
  rationale: Le terme désigne des hauteurs exposées ou dépourvues d’arbres ; « dénudées » évite les connotations cultuelles possibles de « hauts lieux ».
- source_word: מַרְעִיתָם
  choice: leur pâturage
  rationale: Le nom singulier à valeur collective désigne leur lieu de pâture ; « pâturage » est concis et naturel.
theological_decisions:
- issue: Sens littéral ou métaphorique des prisonniers et des ténèbres
  choice: Conserver les images concrètes de prison et de ténèbres sans les expliquer.
  alternative: Identifier explicitement les personnes soit aux exilés, soit à celles qui connaissent une servitude spirituelle.
  rationale: Le texte peut évoquer la délivrance historique tout en portant une signification salvatrice plus large ; la traduction ne doit pas réduire cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs restent vifs, l’imagerie pastorale est conservée, et les termes susceptibles d’une portée littérale ou figurée ne sont pas explicités.
