  source_fidelity: 'La structure et les images du texte hébreu sont bien rendues : l''infinitif « pour dire », les deux impératifs pluriels, l''indétermination de « ténèbres », les chemins, les hauteurs dénudées et le pâturage sont conservés. Toutefois, « Ils trouveront leur pâture » ajoute légèrement l''idée de trouver, alors que יִרְעוּ signifie directement « ils paîtront / se nourriront ».'
