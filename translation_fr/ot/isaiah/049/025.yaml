source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé :


    « Même les captifs de l’homme puissant lui seront arrachés,


    et ce dont l’homme violent s’est emparé lui échappera[a].


    Et je lutterai moi-même contre celui qui lutte contre toi,


    et je sauverai moi-même tes enfants[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le butin de l’homme violent sera délivré ».
    reason: Le nom מַלְקוֹחַ peut désigner ce qui a été pris comme butin, y compris des personnes, et יִמָּלֵט peut signifier « échappera » ou « sera délivré ».
  - marker: b
    text: Littéralement « tes fils ».
    reason: Le texte hébreu emploie le masculin pluriel, qui peut désigner ici collectivement les enfants ou descendants de Sion.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme, qui conserve le nom divin plutôt que de le remplacer par un titre.
- source_word: שְׁבִי גִבּוֹר
  choice: les captifs de l’homme puissant
  rationale: שְׁבִי désigne ici collectivement des personnes retenues captives; גִבּוֹר caractérise leur puissant détenteur sans imposer une lecture exclusivement militaire.
- source_word: יֻקָּח
  choice: lui seront arrachés
  rationale: Le passif de לקח exprime ici le retrait des captifs au pouvoir de leur détenteur. « Arrachés » rend clairement cette délivrance dans le contexte, tandis que « lui » explicite seulement la relation déjà portée par le groupe nominal.
- source_word: מַלְקוֹחַ עָרִיץ
  choice: ce dont l’homme violent s’est emparé
  rationale: Cette formulation naturelle conserve l’étendue sémantique de מַלְקוֹחַ, qui peut désigner une prise, un butin ou des captifs, et rend עָרִיץ par un oppresseur caractérisé par la violence.
- source_word: יִמָּלֵט
  choice: lui échappera
  rationale: Le niphal de מלט peut exprimer l’évasion ou la délivrance; « échappera » maintient ici l’image vive d’une prise qui sort du pouvoir de l’oppresseur.
- source_word: יְרִיבֵךְ … אָרִיב
  choice: celui qui lutte contre toi … je lutterai
  rationale: La répétition du même verbe français reflète le jeu lexical de ריב. « Lutter » reste assez large pour ne pas trancher entièrement entre différend judiciaire et opposition active.
- source_word: אָנֹכִי
  choice: moi-même
  rationale: Le pronom indépendant, présent dans les deux propositions, souligne l’intervention personnelle de Yahvé.
- source_word: בָּנַיִךְ
  choice: tes enfants
  rationale: Dans l’adresse à Sion, le masculin pluriel « fils » peut désigner collectivement sa descendance; « enfants » exprime naturellement cette portée, avec le sens littéral signalé en note.
- source_word: אוֹשִׁיעַ
  choice: je sauverai
  rationale: Le hiphil de ישׁע signifie directement sauver ou délivrer; « sauver » conserve aussi la portée théologique usuelle du terme.
theological_decisions:
- issue: Portée de בָּנַיִךְ dans l’adresse féminine singulière à Sion
  choice: tes enfants
  alternative: tes fils
  rationale: Sion/Jérusalem est personnifiée comme une mère, et le nom masculin pluriel peut englober sa descendance. Le texte principal rend cette portée collective sans effacer la forme littérale, indiquée en note.
- issue: Nuance de ריב dans l’intervention divine
  choice: lutter contre
  alternative: plaider contre / prendre à partie
  rationale: ריב peut relever aussi bien du procès et de la contestation que d’une opposition active. « Lutter » préserve une certaine ouverture et évite d’imposer exclusivement une scène judiciaire ou militaire.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme poétique est conservé sur quatre lignes; la répétition de « moi-même » reproduit l’insistance hébraïque, et les formulations évitent aussi bien l’archaïsme que la surinterprétation confessionnelle.
