source:
  edition: WLC
  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
translation:
  language: fr
  text: Peut-on enlever à un homme puissant le butin[a], ou les captifs d’un juste[b] peuvent-ils être délivrés ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la proie ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les captifs d’un juste ». L’expression est difficile dans ce contexte. Certains la comprennent autrement, et quelques versions anciennes reflètent une lecture plus proche de « les captifs d’un tyran » ou « d’un homme redoutable ».
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֻקַּח
  choice: Peut-on enlever
  rationale: La particule interrogative avec l’imparfait passif de לקח introduit une question rhétorique. Cette formulation française conserve naturellement la valeur modale et passive.
- source_word: מִגִּבּוֹר
  choice: à un homme puissant
  rationale: גִּבּוֹר désigne un homme fort ou puissant, souvent un guerrier. « Homme puissant » maintient le sens large sans imposer exclusivement la nuance militaire.
- source_word: מַלְקוֹחַ
  choice: le butin
  rationale: Le nom désigne ce qui a été saisi, notamment des dépouilles ou du butin. « Butin » est naturel en français et convient au parallélisme avec les captifs.
- source_word: וְאִם
  choice: ou
  rationale: Dans ce parallélisme interrogatif, וְאִם introduit le second membre plutôt qu’une véritable condition. Le français peut naturellement mettre en facteur « peut-on ».
- source_word: שְׁבִי
  choice: les captifs
  rationale: Le terme peut désigner la captivité ou les personnes emmenées captives. Ici, les personnes délivrées sont visées, en parallèle avec le butin enlevé.
- source_word: צַדִּיק
  choice: d’un juste
  rationale: Le sens lexical direct est « juste ». Cette traduction conserve la difficulté du texte massorétique sans la résoudre par une conjecture contextuelle.
- source_word: יִמָּלֵט
  choice: délivrer
  rationale: Le niphal de מלט exprime le fait d’échapper ou d’être délivré. Après « peut-on », l’infinitif actif français « délivrer » rend idiomatiquement le résultat passif subi par les captifs.
theological_decisions:
- issue: Sens de צַדִּיק appliqué au détenteur de captifs
  choice: Conserver « un juste » dans le texte principal.
  alternative: « un tyran », « un homme redoutable » ou une autre lecture contextuelle ou textuelle.
  rationale: Le texte massorétique porte צַדִּיק, « juste ». Malgré la tension créée dans ce contexte, cette lecture doit rester visible dans le texte principal; les autres compréhensions sont signalées en note sans être adoptées silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux questions rhétoriques parallèles est conservée; « peut-on » est mis en facteur dans le second membre pour éviter une lourdeur, tandis que les notes préservent les principales ambiguïtés lexicale et textuelle.
