review_pass:
  verdict: revise
  source_fidelity: La première partie rend fidèlement la mission de relever les tribus de Jacob et de ramener les préservés d’Israël. En revanche, « afin que mon salut parvienne » transforme l’infinitif לִהְיוֹת (« être ») et efface la prédication explicite qui relie le serviteur à « mon salut ».
  naturalness: Le français est moderne, clair et d’un registre approprié. « Pour être mon salut jusqu’à l’extrémité de la terre » est également naturel dans ce style biblique et reflète plus directement la syntaxe condensée de l’hébreu.
  terminology: « Serviteur », « relever », « tribus de Jacob », « ceux d’Israël qui ont été préservés », « lumière pour les nations » et « mon salut » sont des choix justes. « Nations » maintient utilement la portée du terme גּוֹיִם.
  issues:
  - severity: medium
    issue: La proposition finale reformule « pour être mon salut » en « afin que mon salut parvienne ».
    rationale: לִהְיוֹת יְשׁוּעָתִי signifie littéralement « pour être mon salut ». La reformulation française ajoute l’idée de la progression du salut et retire le lien prédicatif, volontairement dense et interprétativement disputé, entre le serviteur et le salut de Dieu. Une traduction ne doit pas résoudre cette tension par paraphrase.
  revised_text: 'Il a dit : « C’est trop peu que tu sois mon serviteur pour relever les tribus de Jacob et ramener ceux d’Israël qui ont été préservés[a]. Je ferai aussi de toi une lumière pour les nations[b], pour être mon salut jusqu’à l’extrémité de la terre[c]. »'
