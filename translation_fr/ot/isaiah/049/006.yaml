source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
translation:
  language: fr
  text: 'Il a dit : « C’est trop peu que tu sois mon serviteur pour relever les tribus de Jacob et ramener ceux d’Israël qui ont été préservés[a]. Je ferai aussi de toi une lumière pour les nations[b], pour être mon salut jusqu’à l’extrémité de la terre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les survivants d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une lumière destinée aux nations » ; le terme traduit par « nations » peut aussi désigner les non-Juifs.
    reason: lexical_alternative
  - marker: c
    text: Ou « jusqu’aux extrémités de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: C’est trop peu
  rationale: L’adjectif désigne ce qui est léger, peu important ou insuffisant. Dans cette tournure, « C’est trop peu » exprime naturellement que la mission envers Israël ne suffit pas à épuiser le dessein divin.
- source_word: עֶבֶד
  choice: serviteur
  rationale: Dans les chants du serviteur d’Ésaïe, le terme exprime avant tout une fonction et une mission reçues de Dieu. « Serviteur » convient mieux ici que « esclave ».
- source_word: לְהָקִים
  choice: relever
  rationale: Le causatif de קום évoque l’action de remettre debout ou de rétablir. « Relever » conserve cette image concrète tout en suggérant la restauration.
- source_word: שִׁבְטֵי יַעֲקֹב
  choice: les tribus de Jacob
  rationale: Le nom « Jacob » est conservé afin de respecter le texte hébreu et son parallélisme avec « Israël ».
- source_word: נְצִירֵי יִשְׂרָאֵל
  choice: ceux d’Israël qui ont été préservés
  rationale: Le terme dérivé de נצר désigne ceux qui ont été gardés ou préservés. Cette formulation française rend ce sens sans limiter d’emblée le groupe aux seuls survivants d’un désastre.
- source_word: לְהָשִׁיב
  choice: ramener
  rationale: Le causatif de שוב signifie couramment « faire revenir ». « Ramener » garde l’idée de retour tout en restant naturel en français.
- source_word: וּנְתַתִּיךָ
  choice: Je ferai aussi de toi
  rationale: La formulation signifie littéralement « je te donnerai », mais, avec le complément de fonction, « faire de toi » est idiomatique en français. « Aussi » marque l’élargissement de la mission d’Israël aux nations.
- source_word: לְאוֹר גּוֹיִם
  choice: une lumière pour les nations
  rationale: « Nations » conserve la portée universelle de גּוֹיִם sans imposer le terme plus marqué de « non-Juifs ». La préposition « pour » exprime naturellement la fonction attribuée au serviteur.
- source_word: יְשׁוּעָתִי
  choice: mon salut
  rationale: Le nom peut désigner le salut ou la délivrance. « Mon salut » garde toute l’ampleur de l’action salvatrice attribuée à Dieu.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: jusqu’à l’extrémité de la terre
  rationale: L’hébreu emploie le singulier, littéralement « jusqu’à l’extrémité de la terre ». Le texte principal le conserve, tandis qu’une note indique l’expression française usuelle au pluriel.
theological_decisions:
- issue: Identité du serviteur et étendue de sa mission
  choice: 'La traduction conserve la double mission énoncée : relever et ramener Israël, puis porter la lumière et le salut de Dieu aux nations.'
  alternative: Rendre explicitement le serviteur comme une figure exclusivement collective ou exclusivement messianique.
  rationale: Le verset ne tranche pas à lui seul la question débattue de l’identité du serviteur. La traduction évite donc d’insérer une identification doctrinale et maintient la tension du texte.
- issue: Rapport grammatical entre le serviteur et « mon salut »
  choice: afin que mon salut parvienne
  alternative: pour être mon salut
  rationale: L’infinitif hébreu peut se rattacher à la mission confiée au serviteur de manière condensée. La formulation choisie reste naturelle en français, présente le salut comme appartenant à Dieu et évite de définir ontologiquement le serviteur comme étant lui-même le salut, sans exclure son rôle personnel dans sa diffusion.
- issue: Sens de גּוֹיִם
  choice: nations
  alternative: non-Juifs
  rationale: « Nations » préserve l’horizon universel du passage et l’ambivalence contextuelle du terme sans réduire celui-ci à une opposition ethnique explicitée.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible, tout en conservant le parallélisme entre Jacob et Israël ainsi que l’élargissement progressif de la mission vers les nations. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
