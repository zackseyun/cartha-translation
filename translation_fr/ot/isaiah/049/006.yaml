revisions:
- from: 'Il a dit : « C’est trop peu que tu sois mon serviteur pour relever les tribus de Jacob et ramener ceux d’Israël qui ont été préservés[a]. Je ferai aussi de toi une lumière pour les nations[b], afin que mon salut parvienne jusqu’à l’extrémité de la terre[c]. »'
  to: 'Il a dit : « C’est trop peu que tu sois mon serviteur pour relever les tribus de Jacob et ramener ceux d’Israël qui ont été préservés[a]. Je ferai aussi de toi une lumière pour les nations[b], pour être mon salut jusqu’à l’extrémité de la terre[c]. »'
  rationale: La révision se limite à restituer « pour être mon salut », qui correspond à l’infinitif hébreu et conserve sa formulation théologiquement ouverte. Elle ne tranche pas l’identité du serviteur ni la manière dont il est lié au salut de Dieu.
