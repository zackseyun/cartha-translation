source:
  edition: WLC
  text: וְ/אָמַ֣רְתְּ בִּ/לְבָבֵ֗/ךְ מִ֤י יָֽלַד לִ/י֙ אֶת אֵ֔לֶּה וַ/אֲנִ֥י שְׁכוּלָ֖ה וְ/גַלְמוּדָ֑ה גֹּלָ֣ה וְ/סוּרָ֗ה וְ/אֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י אֵ֖לֶּה אֵיפֹ֥ה הֵֽם־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: fr
  text: 'Alors tu te diras en toi-même : « Qui a mis au monde tous ceux-ci pour moi ? J’étais privée de mes enfants et stérile, exilée et rejetée. Tous ceux-ci, qui les a élevés ? Moi, j’étais restée seule : ceux-ci, où étaient-ils donc ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתְּ בִּלְבָבֵךְ
  choice: Alors tu te diras en toi-même
  rationale: L’expression hébraïque signifie littéralement « dire dans son cœur » et désigne ici une réflexion intérieure ; cette formulation est naturelle en français tout en conservant le sens.
- source_word: מִי יָלַד לִי אֶת אֵלֶּה
  choice: Qui m’a enfanté tous ceux-ci ?
  rationale: Le verbe ילד est employé au masculin singulier, ce qui soutient la question « qui les a engendrés/enfantés pour moi ? » plutôt que « qui me les a enfantés ? ». « Enfanter » maintient l’image surprenante de la naissance sans préciser l’identité ni le sexe de l’agent.
- source_word: שְׁכוּלָה וְגַלְמוּדָה
  choice: privée de mes enfants et stérile
  rationale: שְׁכוּלָה évoque la perte des enfants, tandis que גַלְמוּדָה décrit ici une femme sans descendance, isolée ou stérile. La traduction distingue les deux malheurs sans les confondre.
- source_word: גֹּלָה וְסוּרָה
  choice: exilée et rejetée
  rationale: גֹּלָה indique clairement l’exil. סוּרָה peut évoquer celle qui est écartée, mise à l’écart ou rejetée ; « rejetée » conserve cette amplitude dans le contexte.
- source_word: מִי גִדֵּל
  choice: qui les a élevés ?
  rationale: Le piel de גדל signifie ici faire grandir, élever des enfants.
- source_word: אֵלֶּה אֵיפֹה הֵם
  choice: ceux-ci, où étaient-ils donc ?
  rationale: La question hébraïque porte littéralement sur le lieu où ils se trouvaient. Cette formulation préserve cette perspective rétrospective et l’étonnement de la locutrice, sans transformer explicitement la question en « d’où viennent-ils ? ».
theological_decisions:
- issue: Identité de la locutrice et de celui qui enfante
  choice: Conserver les référents implicites et l’image paradoxale
  alternative: Identifier explicitement Sion comme locutrice ou attribuer la naissance à Dieu
  rationale: Le contexte désigne Sion, mais le verset lui-même emploie la deuxième personne féminine et ne nomme pas l’agent de ילד. La traduction ne doit pas résoudre ce que le texte laisse implicite.
- issue: Sens de גַלְמוּדָה
  choice: stérile
  alternative: abandonnée / solitaire
  rationale: Dans la série liée aux enfants et à leur croissance, « stérile » exprime bien l’absence de descendance, tout en laissant « restée seule » rendre ensuite explicitement l’isolement.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct garde la succession émotive des questions et la répétition démonstrative « tous ceux-ci / ceux-ci », caractéristique de l’hébreu.
