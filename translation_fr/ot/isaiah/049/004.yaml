source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
translation:
  language: fr
  text: 'Mais moi, j’ai dit : « C’est en vain que je me suis donné du mal ; c’est pour le néant et pour du vent que j’ai épuisé ma force. Pourtant, mon droit[a] est auprès de Yahweh, et ma récompense[b] auprès de mon Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma cause », « ma justification » ou « mon jugement » est auprès de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma rétribution » ou « mon salaire » est auprès de mon Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק
  choice: en vain
  rationale: L’expression rend naturellement l’idée d’un effort apparemment sans résultat.
- source_word: יָגַעְתִּי
  choice: je me suis donné du mal
  rationale: Cette tournure française courante exprime un travail pénible et soutenu, sans archaïsme.
- source_word: לְתֹהוּ וְהֶבֶל
  choice: pour le néant et pour du vent
  rationale: « Néant » rend תֹהוּ, tandis que « du vent » conserve l’image concrète et fugace de הֶבֶל ; la distinction entre les deux termes hébreux est ainsi préservée.
- source_word: כֹּחִי כִלֵּיתִי
  choice: j’ai épuisé ma force
  rationale: Le piel de כלה indique ici que la force a été consommée ou menée à son terme.
- source_word: אָכֵן
  choice: pourtant
  rationale: Le terme marque le retournement entre la plainte sur l’échec apparent et la confiance placée en Dieu.
- source_word: מִשְׁפָּטִי
  choice: mon droit
  rationale: « Mon droit » conserve la dimension de justice et de juste cause sans imposer l’idée que la justification a déjà été prononcée.
- source_word: אֶת יְהוָה
  choice: auprès de Yahweh
  rationale: אֶת exprime ici que le droit du serviteur se trouve auprès de Dieu, entre ses mains ; le nom divin est translittéré « Yahweh ».
- source_word: וּפְעֻלָּתִי
  choice: et ma récompense
  rationale: Dans ce parallélisme, פְעֻלָּה désigne vraisemblablement le salaire ou la rétribution du travail accompli.
- source_word: אֶת אֱלֹהָי
  choice: auprès de mon Dieu
  rationale: Cette formulation préserve le parallélisme avec « auprès de Yahweh » et n’ajoute aucune nuance directionnelle absente de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente directement le nom propre divin présent dans le texte hébreu.
- issue: Sens de מִשְׁפָּטִי dans la parole du serviteur
  choice: mon droit
  alternative: ma cause ; ma justification ; mon jugement
  rationale: « Mon droit » maintient l’ouverture entre la juste cause du serviteur, le jugement qui lui revient et son éventuelle justification, sans résoudre prématurément cette tension.
- issue: Sens de וּפְעֻלָּתִי
  choice: ma récompense
  alternative: ma rétribution ; mon salaire ; mon œuvre
  rationale: Le contexte du labeur apparemment infructueux favorise la rémunération ou le résultat attendu, tout en laissant les autres valeurs lexicales en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Je me suis donné du mal » communique l’effort pénible de façon naturelle ; « le néant et du vent » garde deux images distinctes et évite le sens moderne ambigu de « vanité ». Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
