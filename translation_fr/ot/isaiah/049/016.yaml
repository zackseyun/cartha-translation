id: ISA.49.16
reference: Isaiah 49:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֥ן עַל כַּפַּ֖יִם חַקֹּתִ֑י/ךְ חוֹמֹתַ֥יִ/ךְ נֶגְדִּ֖/י תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/016.yaml
  text: Look[a], I have engraved you on the palms of my hands; your walls are continually before me.
translation:
  language: fr
  text: Voici, je t’ai gravée[a] sur les paumes de mes mains ; tes murailles sont constamment devant moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « inscrite ». Le verbe hébreu évoque une inscription gravée, image qui en souligne le caractère durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Interjection déictique qui attire fortement l’attention. « Voici » conserve cette mise en relief dans un registre actuel et digne.
- source_word: עַל
  choice: sur
  rationale: Préposition spatiale simple, naturelle avec l’image d’une gravure sur les mains.
- source_word: כַּפַּיִם
  choice: les paumes de mes mains
  rationale: Le duel désigne les paumes ou les mains. Cette formulation explicite préserve l’image corporelle concrète.
- source_word: חַקֹּתִיךְ
  choice: je t’ai gravée
  rationale: Le verbe désigne l’action de graver ou d’inscrire. « Gravée » souligne le caractère durable de l’image; l’accord féminin rend le suffixe féminin singulier qui renvoie contextuellement à Sion.
- source_word: חוֹמֹתַיִךְ
  choice: tes murailles
  rationale: Le terme désigne les murs défensifs de la ville. « Murailles » convient naturellement au contexte de Jérusalem sans ajouter son nom au verset.
- source_word: נֶגְדִּי
  choice: devant moi
  rationale: Expression indiquant ce qui demeure sous le regard ou dans la présence de quelqu’un.
- source_word: תָּמִיד
  choice: constamment
  rationale: Adverbe exprimant une continuité durable. « Constamment » est naturel et conserve l’insistance du texte.
theological_decisions:
- issue: Représentation métaphorique des mains divines et de la gravure
  choice: 'Conserver directement l’anthropomorphisme : « je t’ai gravée sur les paumes de mes mains »'
  alternative: 'Expliciter seulement le sens, par exemple : « je ne t’oublie jamais »'
  rationale: L’hébreu emploie une image corporelle saisissante pour exprimer le souvenir et l’engagement durables de Dieu envers Sion. La traduction conserve cette image plutôt que de la remplacer par son interprétation.
- issue: Référent des suffixes féminins singuliers
  choice: Employer « te/tes » et marquer le féminin dans « gravée », sans insérer le nom de Sion ou de Jérusalem
  alternative: Ajouter explicitement « Sion » ou « Jérusalem » dans le verset
  rationale: Les suffixes hébreux sont féminins singuliers et renvoient, d’après le contexte, à Sion personnifiée. Le texte du verset maintient toutefois l’adresse directe à la deuxième personne.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient l’emphase de l’interjection; « murailles » convient au cadre urbain de Sion. La métaphore et l’adresse féminine sont conservées.
