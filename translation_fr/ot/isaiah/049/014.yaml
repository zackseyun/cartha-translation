source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר צִיּ֖וֹן עֲזָבַ֣/נִי יְהוָ֑ה וַ/אדֹנָ֖/י שְׁכֵחָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/014.yaml
  text: But Zion said, “The LORD has forsaken me; my Lord has forgotten me.”
translation:
  language: fr
  text: 'Mais Sion a dit : « Le SEIGNEUR m’a abandonnée, mon Seigneur m’a oubliée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיּוֹן
  choice: Sion
  rationale: Conserve le nom biblique traditionnel de la ville personnifiée ; le féminin des participes passés s’accorde naturellement avec la ville de Sion.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme par la convention française courante en petites capitales, tout en le distinguant de אֲדֹנָי.
- source_word: עֲזָבַנִי
  choice: m’a abandonnée
  rationale: Exprime directement le sentiment de délaissement formulé par Sion, avec l’accord féminin exigé par la personnification.
- source_word: וַאדֹנָי
  choice: mon Seigneur
  rationale: Le suffixe de première personne attaché à אֲדֹנָי est rendu explicitement par « mon », et « Seigneur » maintient la distinction avec le nom divin précédent.
- source_word: שְׁכֵחָנִי
  choice: m’a oubliée
  rationale: Traduction directe et naturelle, avec accord féminin renvoyant à Sion.
theological_decisions:
- issue: Distinction entre יְהוָה et אֲדֹנָי
  choice: « le SEIGNEUR » puis « mon Seigneur »
  alternative: « Yahvé » puis « le Seigneur »
  rationale: Cette formulation préserve la différence lexicale des deux désignations et rend le suffixe possessif de אֲדֹנָי sans identifier graphiquement les deux termes.
- issue: Portée de la plainte de Sion
  choice: Conserver l’affirmation directe « m’a abandonnée… m’a oubliée »
  alternative: Atténuer par « semble m’avoir abandonnée »
  rationale: L’hébreu rapporte sans atténuation la perception douloureuse de Sion ; la réponse divine du contexte apportera elle-même la correction.
translation_notes:
  register: Français moderne, sobre et digne. La conjonction initiale « Mais » marque le contraste avec la promesse précédente. La ponctuation française et les accords féminins rendent clairement la personnification de Sion.
