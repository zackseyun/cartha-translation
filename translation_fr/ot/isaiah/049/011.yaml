source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י כָל הָרַ֖/י לַ/דָּ֑רֶךְ וּ/מְסִלֹּתַ֖/י יְרֻמֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
translation:
  language: fr
  text: Je ferai de toutes mes montagnes une route[a], et mes routes seront élevées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je destinerai toutes mes montagnes à servir de route ». L’hébreu peut souligner soit le résultat (« faire de ... une route »), soit le but.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes chaussées seront élevées ». Le terme hébreu peut désigner une route aménagée, notamment une chaussée remblayée ou surélevée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je ferai de
  rationale: Le verbe שׂים signifie ici « placer, établir, faire ». Avec לַדָּרֶךְ, « faire de… une route » exprime naturellement en français le résultat envisagé.
- source_word: כָל הָרַי
  choice: toutes mes montagnes
  rationale: Traduction directe qui conserve l’image concrète du relief appartenant à Dieu, sans décider si elle est littérale ou métaphorique.
- source_word: לַדָּרֶךְ
  choice: une route
  rationale: Après « faire de », cette formulation rend la valeur de résultat ou de destination du לְ. « Route » maintient l’image concrète du déplacement.
- source_word: וּמְסִלֹּתַי
  choice: et mes voies surélevées
  rationale: מְסִלָּה désigne souvent une voie aménagée, remblayée ou surélevée. Cette traduction distingue le terme de דֶּרֶךְ tout en gardant l’imagerie routière.
- source_word: יְרֻמוּן
  choice: seront rehaussées
  rationale: La forme issue de רום indique ici que les voies seront élevées. « Rehaussées » convient à des chaussées aménagées et évite le sens abstrait d’« exaltées ».
theological_decisions:
- issue: Portée de l’image du voyage et de la restauration
  choice: Conserver l’image concrète de Dieu transformant le relief et préparant des voies.
  alternative: Expliciter soit un itinéraire matériel pour le retour des exilés, soit la suppression spirituelle ou providentielle des obstacles.
  rationale: L’hébreu laisse coexister la topographie concrète et sa portée de restauration. La traduction ne tranche pas entre lecture littérale, métaphorique ou conjointe.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste concrète et accessible; « voies surélevées » rend la nuance de מְסִלָּה sans introduire d’interprétation doctrinale.
