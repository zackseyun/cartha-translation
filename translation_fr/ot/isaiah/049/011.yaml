review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Dieu transforme ses montagnes en voie de passage et ses voies sont élevées. Toutefois, « voies surélevées seront rehaussées » redouble de manière inutile la notion d’élévation, alors que l’élévation explicite relève du verbe יְרֻמוּן et que מְסִלָּה désigne d’abord une voie aménagée.'
  naturalness: La première proposition est naturelle et poétique. La seconde est stylistiquement lourde et redondante. « Mes routes seront élevées » est plus idiomatique tout en préservant l’image concrète.
  terminology: « Route » rend bien דֶּרֶךְ. Pour מְסִלּוֹתַי, « routes » est acceptable; une note peut signaler la nuance possible de chaussée ou de voie aménagée. « Élevées » rend directement יְרֻמוּן sans imposer un sens abstrait.
  issues:
  - severity: medium
    issue: Redondance entre « voies surélevées » et « seront rehaussées ».
    rationale: Le nom מְסִלָּה peut impliquer une route construite ou remblayée, mais n’exige pas que l’idée d’élévation soit déjà lexicalisée dans le texte français. Le verbe יְרֻמוּן exprime lui-même que ces voies seront élevées; la formulation actuelle répète donc l’image et alourdit le style.
  - severity: low
    issue: La note a formule l’alternative de façon peu naturelle.
    rationale: « Disposer toutes mes montagnes pour en faire une route » est maladroit en français. Une formulation avec « destiner ... à servir de route » exprime plus clairement la possible nuance de but du préfixe לְ.
  revised_text: Je ferai de toutes mes montagnes une route[a], et mes routes seront élevées[b].
  revised_footnotes:
  - marker: a
    text: Ou « Je destinerai toutes mes montagnes à servir de route ». L’hébreu peut souligner soit le résultat (« faire de ... une route »), soit le but.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes chaussées seront élevées ». Le terme hébreu peut désigner une route aménagée, notamment une chaussée remblayée ou surélevée.
    reason: lexical_alternative
  revision_rationale: La révision supprime le double marquage de l’élévation, tout en conservant le parallélisme, l’imagerie topographique et l’ambiguïté entre voie concrète et image de restauration. Les notes sont reformulées dans un français plus naturel et restent ancrées aux termes pertinents.
