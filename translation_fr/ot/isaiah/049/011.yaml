- from: Je ferai de toutes mes montagnes une route[a], et mes voies surélevées seront rehaussées[b].
  to: Je ferai de toutes mes montagnes une route[a], et mes routes seront élevées[b].
  rationale: La révision supprime le double marquage de l’élévation, tout en conservant le parallélisme, l’imagerie topographique et l’ambiguïté entre voie concrète et image de restauration. Les notes sont reformulées dans un français plus naturel et restent ancrées aux termes pertinents.
