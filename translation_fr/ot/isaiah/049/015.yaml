  - severity: low
    issue: « Même celles-là » est lourd dans ce contexte.
    rationale: Le démonstratif français paraît inutilement distant. « Même elles » garde le renvoi aux femmes mentionnées et l’emphase de גַּם אֵלֶּה avec une formulation plus naturelle.
