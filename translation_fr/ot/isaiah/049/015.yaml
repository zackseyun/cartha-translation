  to: Une femme peut-elle oublier l’enfant qu’elle allaite, ne plus avoir de compassion pour le fils de son ventre ? Même elles peuvent oublier, mais moi, je ne t’oublierai pas.
  rationale: La révision conserve la question rhétorique, la possibilité concessive et le contraste emphatique. Elle restaure l’image explicite du « fils de son ventre » et améliore la reprise de « ces femmes » en français moderne, sans ajouter d’interprétation doctrinale.
