  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
translation:
  language: fr
  text: Une femme peut-elle oublier l’enfant qu’elle allaite, ne plus avoir de compassion pour le fils de son ventre ? Même elles peuvent oublier, mais moi, je ne t’oublierai pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: peut-elle oublier
  rationale: L’interrogatif הֲ et l’imparfait introduisent une question rhétorique présentant cet oubli comme presque inconcevable. « Peut-elle oublier » en restitue naturellement la force.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le nom désigne une femme ou une épouse. Le contexte maternel est explicité par les expressions suivantes, sans remplacer le terme hébreu par « mère ».
- source_word: עוּלָהּ
  choice: l’enfant qu’elle allaite
  rationale: Le nom désigne un nourrisson, un enfant encore allaité. Cette formulation moderne conserve clairement l’image de dépendance maternelle.
- source_word: מֵרַחֵם
  choice: ne pas avoir compassion
  rationale: Le verbe רחם exprime la compassion et la tendresse. Après la première proposition, cette tournure française rend naturellement l’idée de s’abstenir d’éprouver de la compassion.
- source_word: בֶּן בִּטְנָהּ
  choice: du fils qu’elle a porté
  rationale: « Fils » conserve le masculin explicite de בֶּן, tandis que « qu’elle a porté » rend idiomatiquement l’image hébraïque du ventre maternel sans obscurité en français.
- source_word: גַּם אֵלֶּה
  choice: Même celles-là
  rationale: Le démonstratif renvoie avec insistance aux femmes qui viennent d’être évoquées. Le féminin pluriel français explicite correctement ce référent.
- source_word: תִשְׁכַּחְנָה
  choice: peuvent oublier
  rationale: L’imparfait féminin pluriel exprime ici la possibilité dans une concession, plutôt qu’une prédiction certaine.
- source_word: וְאָנֹכִי
  choice: mais moi
  rationale: Le pronom אָנֹכִי est emphatique et la conjonction marque ici un contraste fort. « Mais moi » restitue les deux éléments avec naturel.
- source_word: לֹא אֶשְׁכָּחֵךְ
  choice: je ne t’oublierai pas
  rationale: Le futur négatif exprime directement et fermement l’assurance divine. Le suffixe de deuxième personne féminin singulier renvoie à Sion, tutoyée dans le contexte.
theological_decisions:
- issue: Langage genré dans בֶּן בִּטְנָהּ
  choice: du fils qu’elle a porté
  alternative: de l’enfant qu’elle a porté
  rationale: Le texte hébreu emploie explicitement בֶּן, « fils ». Le terme masculin est donc conservé, sans neutralisation, tout en formulant l’image maternelle dans un français naturel.
- issue: Force de la comparaison rhétorique
  choice: Même celles-là peuvent oublier, mais moi, je ne t’oublierai pas
  alternative: Même si celles-là oubliaient, moi, je ne t’oublierais pas
  rationale: L’hébreu énonce une concession suivie d’un contraste divin emphatique. Le futur « je ne t’oublierai pas » préserve la certitude de la promesse, tandis que « peuvent oublier » n’exagère pas la probabilité de la défaillance maternelle.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le tutoiement singulier est maintenu parce que le suffixe hébreu féminin singulier s’adresse à Sion dans le contexte. Aucune note n’est nécessaire : « l’enfant qu’elle allaite » rend directement עוּלָהּ, et « fils » conserve בֶּן.'
