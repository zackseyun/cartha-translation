  source_fidelity: La première interrogation et l’assurance finale sont bien rendues. Toutefois, « du fils qu’elle a porté » atténue l’image corporelle explicite de « fils de son ventre ». « Même celles-là » est grammaticalement possible, mais peu naturel et trop démonstratif en français moderne ; « Même elles » reprend clairement les femmes évoquées tout en conservant l’emphase concessive.
  naturalness: « Une femme peut-elle oublier l’enfant qu’elle allaite » est naturel. La révision rend la seconde proposition plus idiomatique et maintient le parallélisme rhétorique. « Même elles peuvent oublier » est plus fluide que « Même celles-là peuvent oublier ».
  terminology: « Enfant qu’elle allaite » rend correctement עוּלָהּ, et « fils » conserve le masculin de בֶּן. « Fils de son ventre » préserve l’image hébraïque sans employer un registre archaïque ou confessionnel. Le tutoiement reste approprié au féminin singulier adressé à Sion dans le contexte.
