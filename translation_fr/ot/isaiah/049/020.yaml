  text: ע֚וֹד יֹאמְר֣וּ בְ/אָזְנַ֔יִ/ךְ בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ צַר לִ֥/י הַ/מָּק֖וֹם גְּשָׁ/ה לִּ֥/י וְ/אֵשֵֽׁבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
translation:
  language: fr
  text: 'Les enfants de ton deuil te diront encore, à tes propres oreilles : « L’endroit est trop étroit pour moi ; fais-moi de la place pour que je puisse m’y installer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֚וֹד
  choice: encore
  rationale: Marque la continuation ou l’ajout dans ce contexte et s’intègre naturellement au futur prophétique.
- source_word: יֹאמְר֣וּ
  choice: te diront
  rationale: L’imparfait hébreu a ici une valeur future dans le discours prophétique ; le complément indirect explicite naturellement l’adresse à Sion.
- source_word: בְ/אָזְנַ֔יִ/ךְ
  choice: à l’oreille
  rationale: Expression française naturelle qui conserve l’image concrète de paroles dites directement aux oreilles de Sion.
- source_word: בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ
  choice: les enfants nés pendant ton deuil
  rationale: Littéralement « les fils de ton deuil/perte d’enfants ». Dans le contexte de la multiplication de la population après la privation, cette formulation française rend l’association des enfants à la période de deuil sans suggérer qu’ils sont eux-mêmes endeuillés.
- source_word: צַר לִ֥י הַ/מָּק֖וֹם
  choice: L’endroit est trop étroit pour moi
  rationale: Rend directement la contrainte spatiale exprimée par צַר et convient à l’image d’un lieu devenu surpeuplé.
- source_word: גְּשָׁ/ה לִּ֥י
  choice: fais-moi de la place
  rationale: Le sens littéral est « approche-toi pour moi », mais, dans ce contexte d’exiguïté, l’impératif fonctionne vraisemblablement comme une demande de se déplacer afin de libérer de l’espace.
- source_word: וְ/אֵשֵֽׁבָה
  choice: pour que je puisse m’y installer
  rationale: ישׁב désigne ici le fait de s’établir ou d’habiter plutôt que le simple fait de s’asseoir ; la tournure finale exprime naturellement le rapport avec la demande précédente.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement maintient l’adresse personnifiée à Sion. « S’installer » traduit naturellement l’idée d’occuper durablement le lieu.
