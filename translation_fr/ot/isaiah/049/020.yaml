  source_fidelity: La formulation « nés pendant ton deuil » ajoute une précision temporelle absente de בני שכליך. Le génitif hébreu associe les enfants à la condition de deuil/privation de Sion sans dire explicitement quand ils sont nés. « À l’oreille » peut aussi évoquer un chuchotement, tandis que l’hébreu signifie qu’ils parleront de manière à être entendus par Sion.
  naturalness: Le français est globalement clair et naturel. « Les enfants de ton deuil » conserve l’image compacte et poétique de l’original tout en restant intelligible dans ce contexte. « À tes propres oreilles » rend naturellement l’idée d’« en tes oreilles » sans suggérer qu’ils chuchotent.
  terminology: « Enfants » convient pour בני dans ce sens collectif. « Fais-moi de la place » rend bien la force contextuelle de l’impératif גשה, et « je puisse m’y installer » exprime adéquatement l’idée de demeurer/s’établir.
  issues:
