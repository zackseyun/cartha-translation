    rationale: L’expression hébraïque signifie « dans tes oreilles », c’est-à-dire à l’audition de Sion, et non nécessairement à voix basse.
  revised_text: 'Les enfants de ton deuil te diront encore, à tes propres oreilles : « L’endroit est trop étroit pour moi ; fais-moi de la place pour que je puisse m’y installer. »'
