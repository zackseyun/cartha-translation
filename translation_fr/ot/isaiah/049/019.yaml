  text: כִּ֤י חָרְבֹתַ֨יִ/ךְ֙ וְ/שֹׁ֣מְמֹתַ֔יִ/ךְ וְ/אֶ֖רֶץ הֲרִֽסֻתֵ֑י/ךְ כִּ֤י עַתָּה֙ תֵּצְרִ֣י מִ/יּוֹשֵׁ֔ב וְ/רָחֲק֖וּ מְבַלְּעָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
translation:
  language: fr
  text: Car tes ruines, tes lieux désolés et ton pays dévasté — oui, désormais tu seras trop à l’étroit pour tes habitants[a], et ceux qui t’engloutissent[b] seront loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu deviendras trop étroite à cause de tes habitants ». L’expression hébraïque est concise et peut indiquer soit pour qui l’espace manque, soit ce qui provoque ce manque de place.
    reason: lexical_alternative
  - marker: b
    text: Ou « te dévorent ». L’hébreu emploie l’image forte de personnes qui avalent ou dévorent Sion.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  choice: tes ruines
  rationale: Le nom חָרְבָּה désigne des lieux ruinés ou dévastés. « Ruines » est naturel en français et reste distinct des « lieux désolés » du membre parallèle.
- source_word: שֹׁמְמֹתַיִךְ
  choice: tes lieux désolés
  rationale: La forme issue de שׁמם évoque des endroits laissés dans la désolation. Cette formulation claire conserve la valeur concrète du pluriel.
- source_word: אֶרֶץ הֲרִסֻתֵיךְ
  choice: ton pays dévasté
  rationale: L’expression décrit le territoire marqué par la destruction. « Pays dévasté » rend naturellement le résultat de cette destruction.
- source_word: כִּי
  choice: Car
  rationale: Le premier כִּי introduit le fondement de la promesse précédente et assure le lien argumentatif avec le contexte.
- source_word: כִּי עַתָּה
  choice: oui, désormais
  rationale: Le second כִּי a ici une force d’insistance plutôt que de cause. « Oui, désormais » marque à la fois l’affirmation et le renversement annoncé.
- source_word: תֵּצְרִי
  choice: tu seras trop à l’étroit
  rationale: Le verbe exprime l’étroitesse ou le manque de place. Cette tournure française convient à l’image d’une ville devenue trop peuplée.
- source_word: מִיּוֹשֵׁב
  choice: pour tes habitants
  rationale: Le syntagme compact désigne ceux qui occupent le pays comme cause ou point de référence de son étroitesse. Le possessif est explicité naturellement d’après l’adresse à Sion.
- source_word: וְרָחֲקוּ
  choice: seront loin
  rationale: Le parfait peut porter une valeur future dans cet oracle prophétique. Le futur français l’accorde au rétablissement annoncé.
- source_word: מְבַלְּעָיִךְ
  choice: ceux qui t’engloutissaient
  rationale: Le participe substantivé issu de בלע désigne ceux qui engloutissent ou dévorent Sion. « Engloutissaient » conserve l’image vive et présente ces oppresseurs comme désormais éloignés.
theological_decisions:
- issue: Valeur temporelle du parfait prophétique dans וְרָחֲקוּ
  choice: 'Le rendre au futur : « seront loin »'
  alternative: « se sont éloignés » ou « étaient loin »
  rationale: Dans cet oracle de salut, la proposition annonce le renversement lié au rétablissement de Sion. Le futur exprime clairement cette portée prophétique sans transformer l’annonce en événement déjà accompli.
- issue: Identification de מְבַלְּעָיִךְ
  choice: 'Conserver la métaphore : « ceux qui t’engloutissaient »'
  alternative: Employer le terme interprétatif « tes destructeurs »
  rationale: Le texte hébreu caractérise les ennemis par l’image de l’engloutissement. La conserver évite de réduire la force poétique et ne précise pas davantage leur identité.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation initiale (« tes ruines… ») garde la structure emphatique de l’hébreu tout en restant intelligible. Le féminin singulier de « tu » maintient l’adresse personnifiée à Sion. Les métaphores spatiale et alimentaire sont conservées.
