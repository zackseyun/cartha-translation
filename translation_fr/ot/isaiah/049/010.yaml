id: ISA.49.10
reference: Isaiah 49:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֤א יִרְעָ֨בוּ֙ וְ/לֹ֣א יִצְמָ֔אוּ וְ/לֹא יַכֵּ֥/ם שָׁרָ֖ב וָ/שָׁ֑מֶשׁ כִּי מְרַחֲמָ֣/ם יְנַהֲגֵ֔/ם וְ/עַל מַבּ֥וּעֵי מַ֖יִם יְנַהֲלֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
translation:
  language: fr
  text: Ils n’auront ni faim ni soif, et ni la chaleur brûlante ni le soleil ne les frapperont ; car celui qui a compassion d’eux les conduira et les guidera vers des sources d’eau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les guidera près de sources d’eau » ou « au bord de sources d’eau ».'
    reason: La préposition עַל peut ici exprimer la direction vers un lieu ou la proximité auprès de celui-ci.
lexical_decisions:
- source_word: יִרְעָבוּ
  choice: auront faim
  rationale: Le qal inaccompli de רָעֵב exprime le fait d’avoir faim. Avec la négation, « ils n’auront pas faim » serait possible, mais la coordination française « ni faim ni soif » rend naturellement le parallélisme verbal.
- source_word: יִצְמָאוּ
  choice: auront soif
  rationale: Le qal inaccompli de צָמֵא signifie « avoir soif ». La formulation s’accorde avec « auront faim » dans le parallélisme poétique.
- source_word: שָׁרָב
  choice: chaleur brûlante
  rationale: Le nom désigne une chaleur ardente ou desséchante, notamment celle du désert. « Chaleur brûlante » est clair et conserve l’intensité de l’image.
- source_word: יַכֵּם
  choice: ne les frapperont
  rationale: Le hiphil de נכה signifie couramment « frapper ». Le pluriel français s’impose puisque « la chaleur brûlante » et « le soleil » forment un sujet coordonné.
- source_word: מְרַחֲמָם
  choice: celui qui a compassion d’eux
  rationale: Le participe de רָחַם avec suffixe de troisième personne masculine plurielle décrit littéralement celui qui leur témoigne de la compassion. Cette formulation conserve la désignation descriptive sans ajouter explicitement « Dieu ».
- source_word: יְנַהֲגֵם
  choice: les conduira
  rationale: Le piel de נָהַג signifie conduire ou mener. « Conduira » convient au contexte pastoral et permet de distinguer ce verbe du suivant.
- source_word: מַבּוּעֵי מַיִם
  choice: des sources d’eau
  rationale: מַבּוּעַ désigne une source ou un jaillissement naturel. « Sources d’eau » conserve l’image concrète et reste idiomatique.
- source_word: יְנַהֲלֵם
  choice: les guidera
  rationale: Le piel de נהל peut désigner une conduite attentive ou douce. « Guidera » rend cette nuance et évite une répétition avec « conduira ».
- source_word: וְעַל
  choice: vers
  rationale: Dans ce contexte de mouvement dirigé, עַל peut marquer la direction ou la relation à un lieu. « Vers » préserve cette orientation tout en laissant ouverte la possibilité contextuelle d’une arrivée près des sources.
theological_decisions:
- issue: Référent de celui qui fait preuve de compassion
  choice: Conserver la désignation descriptive « celui qui a compassion d’eux »
  alternative: Nommer explicitement Dieu comme leur guide compatissant
  rationale: Le contexte renvoie vraisemblablement à Dieu, mais l’hébreu le décrit sans le nommer dans ce verset. La traduction ne rend donc pas explicite ce que le texte laisse implicite.
- issue: Relation spatiale avec les sources d’eau
  choice: « vers des sources d’eau »
  alternative: « près des sources d’eau » ou « au bord de sources d’eau »
  rationale: 'La préposition עַל possède ici une certaine souplesse : elle peut évoquer la direction vers les sources ou la conduite auprès d’elles. Le texte principal retient le mouvement vers elles, tandis que la note conserve l’autre lecture.'
translation_notes:
  register: Français international moderne, clair et digne. Le rythme poétique repose sur « ni faim ni soif » et « ni la chaleur brûlante ni le soleil ». La désignation divine reste implicite comme dans l’hébreu.
