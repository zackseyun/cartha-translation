id: ISA.49.13
reference: Isaiah 49:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָנּ֤וּ שָׁמַ֨יִם֙ וְ/גִ֣ילִי אָ֔רֶץ יפצחו הָרִ֖ים רִנָּ֑ה כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ וַ/עֲנִיָּ֖/ו יְרַחֵֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
translation:
  language: fr
  text: Poussez des cris de joie, cieux, et réjouis-toi, terre ! Que les montagnes éclatent en chants de joie, car Yahweh a consolé son peuple et il aura compassion de ses affligés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ses pauvres » ou « de ses humbles ». Le terme hébreu peut désigner des personnes affligées, pauvres ou humbles.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנּוּ
  choice: Poussez des cris de joie
  rationale: L’impératif pluriel de רנן exprime une joie proclamée à haute voix; cette tournure est naturelle en français et convient à l’appel cosmique.
- source_word: שָׁמַיִם
  choice: cieux
  rationale: Dans ce parallélisme cosmique avec la terre et les montagnes, « cieux » conserve le sens et le registre poétique du pluriel hébreu.
- source_word: וְגִילִי
  choice: et réjouis-toi
  rationale: L’impératif féminin singulier s’adresse directement à la terre; le singulier est donc conservé.
- source_word: אָרֶץ
  choice: terre
  rationale: Le parallèle avec les cieux et les montagnes indique ici la terre dans son ensemble plutôt qu’un pays particulier.
- source_word: יפצחו
  choice: Que ... éclatent
  rationale: L’imparfait à valeur exhortative est rendu par « Que »; « éclater en chants » restitue l’idée d’une manifestation soudaine et intense.
- source_word: רִנָּה
  choice: chants de joie
  rationale: Le nom désigne une clameur ou un chant joyeux; cette formulation française garde à la fois la dimension vocale et la joie.
- source_word: נִחַם
  choice: a consolé
  rationale: Dans ce contexte de salut, le piel de נחם signifie apporter consolation et réconfort au peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme présent dans le texte hébreu.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: « Peuple » exprime naturellement le collectif et sa relation d’appartenance à Yahweh.
- source_word: וַעֲנִיָּו
  choice: ses affligés
  rationale: עני peut désigner les personnes affligées, pauvres ou humbles; « affligés » convient au contexte de consolation sans réduire le terme à la pauvreté matérielle.
- source_word: יְרַחֵם
  choice: il aura compassion
  rationale: L’imparfait hébreu est conservé avec une valeur prospective, en contraste avec l’action accomplie exprimée par « a consolé ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Portée de וַעֲנִיָּו
  choice: ses affligés
  alternative: ses pauvres / ses humbles
  rationale: Le terme hébreu possède ces différentes nuances. Le texte principal retient le sens contextuel d’affliction, tandis qu’une note préserve les autres possibilités.
translation_notes:
  register: Français international actuel, digne et poétique. Les apostrophes cosmiques et le parallélisme sont conservés, avec un tutoiement singulier pour la terre conformément à la grammaire hébraïque.
