source:
  edition: WLC
  text: כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh[a], le rédempteur d’Israël, son Saint, à celui qui est profondément méprisé[b], que la nation a en horreur[c], au serviteur de dirigeants : Les rois te verront et se lèveront ; les princes se prosterneront[d], à cause de Yahweh, qui est fidèle, le Saint d’Israël, qui t’a choisi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin YHWH, transcrit ici « Yahweh » ; beaucoup de traductions le rendent par « le Seigneur » ou « l’Éternel ».
    reason: divine_name
  - marker: b
    text: Littéralement, l’expression hébraïque associe « méprisé » à « âme » ou « personne ». Elle peut aussi se comprendre comme « méprisé de tous » ou simplement « celui que l’on méprise ».
    reason: lexical_alternative
  - marker: c
    text: Ou « que des nations ont en horreur ». Le nom hébreu est au singulier, mais il peut avoir une valeur collective.
    reason: lexical_alternative
  - marker: d
    text: L’objet de la prosternation n’est pas exprimé. Dans le contexte, le geste peut se rapporter au personnage auquel Yahweh s’adresse, tandis que Yahweh en est la raison ultime.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le nom personnel présent dans l’hébreu, plutôt que de le remplacer par le titre « le Seigneur ».
- source_word: גֹּאֵל
  choice: le rédempteur
  rationale: « Rédempteur » conserve à la fois l’idée de délivrance et la portée relationnelle et juridique du participe hébreu, sans imposer ici le sens plus étroit de « proche parent ayant droit de rachat ».
- source_word: קְדוֹשׁוֹ
  choice: son Saint
  rationale: 'Le suffixe masculin singulier est rendu explicitement. Dans la suite « le rédempteur d’Israël, son Saint », le référent naturel du possessif est Israël : Yahweh est le Saint d’Israël. La formulation française conserve toutefois la forme pronominale concise de l’hébreu.'
- source_word: לִבְזֹה נֶפֶשׁ
  choice: à celui qui est profondément méprisé
  rationale: L’expression hébraïque est condensée et difficile. Ici נֶפֶשׁ intensifie vraisemblablement le mépris ou désigne la personne elle-même ; une traduction littérale comme « méprisé d’âme » serait obscure en français moderne.
- source_word: לִמְתָעֵב גּוֹי
  choice: que la nation a en horreur
  rationale: Cette formulation rend le participe passif et maintient le singulier גּוֹי, tout en restant naturelle en français.
- source_word: לְעֶבֶד מֹשְׁלִים
  choice: à l’esclave de ceux qui dominent
  rationale: « Esclave » exprime ici la condition d’assujettissement et d’humiliation suggérée par le contexte ; « ceux qui dominent » rend le participe pluriel sans limiter indûment le groupe à une fonction politique précise.
- source_word: מְלָכִים יִרְאוּ וָקָמוּ
  choice: Des rois te verront et se lèveront
  rationale: L’objet sous-entendu de « verront » est explicité en français par « te ». Se lever constitue ici un geste public d’honneur.
- source_word: שָׂרִים וְיִשְׁתַּחֲווּ
  choice: des princes se prosterneront
  rationale: « Princes » convient au rang élevé désigné par שָׂרִים, et « se prosterner » rend clairement le geste d’hommage sans décider qu’il s’agit nécessairement d’adoration divine.
- source_word: לְמַעַן יְהוָה
  choice: à cause de Yahweh
  rationale: La locution indique la raison fondamentale de l’honneur rendu et non nécessairement son objet direct.
- source_word: אֲשֶׁר נֶאֱמָן
  choice: qui est fidèle
  rationale: Cette traduction conserve la structure relative et exprime la fiabilité constante de Yahweh.
- source_word: קְדֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Il s’agit d’un titre divin caractéristique d’Ésaïe, rendu de manière concise et cohérente.
- source_word: וַיִּבְחָרֶךָּ
  choice: qui t’a choisi
  rationale: Le français rattache naturellement cette dernière proposition à Yahweh, le Saint d’Israël, et présente son choix comme accompli.
theological_decisions:
- issue: Référent de « son Saint » (קְדוֹשׁוֹ)
  choice: 'Le possessif renvoie naturellement à Israël : Yahweh est le Saint d’Israël.'
  alternative: Comprendre l’expression comme désignant le serviteur auquel Yahweh s’adresse.
  rationale: Dans la chaîne de titres « Yahweh, rédempteur d’Israël, son Saint », la syntaxe appositionnelle et le titre isaïen repris à la fin du verset favorisent nettement l’identification de Yahweh comme Saint d’Israël. La traduction garde néanmoins la concision pronominale du texte.
- issue: Objet du geste exprimé par וְיִשְׁתַּחֲווּ
  choice: Ne pas préciser explicitement l’objet de la prosternation.
  alternative: Ajouter « devant toi » pour désigner le serviteur, ou « devant Yahweh » pour désigner Dieu.
  rationale: Le contexte associe le geste à l’élévation du serviteur, tandis que « à cause de Yahweh » en donne le fondement ultime. L’hébreu ne formule pas d’objet explicite ; la traduction préserve cette tension.
- issue: Portée de עֶבֶד dans la condition d’humiliation
  choice: Employer « esclave ».
  alternative: Employer « serviteur ».
  rationale: L’association avec « ceux qui dominent » met l’accent sur l’assujettissement plutôt que sur un service volontaire ou honorifique. « Esclave » conserve cette force sans tirer de conclusion doctrinale sur l’identité du personnage.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours direct met en relief l’adresse divine. Les deux-points et le parallélisme conservent la progression de l’humiliation vers l’honneur. « Profondément méprisé » évite le calque obscur « méprisé d’âme », tandis que « esclave » maintient la dureté sociale du contexte.
