- from: 'Ainsi parle Yahweh[a], le rédempteur d’Israël, son Saint : « À celui qui est profondément méprisé[b], que la nation a en horreur[c], à l’esclave de ceux qui dominent : Des rois te verront et se lèveront ; des princes se prosterneront[d], à cause de Yahweh, qui est fidèle, lui, le Saint d’Israël, qui t’a choisi. »'
  to: 'Ainsi parle Yahweh[a], le rédempteur d’Israël, son Saint, à celui qui est profondément méprisé[b], que la nation a en horreur[c], au serviteur de dirigeants : Les rois te verront et se lèveront ; les princes se prosterneront[d], à cause de Yahweh, qui est fidèle, le Saint d’Israël, qui t’a choisi.'
  rationale: La révision conserve les ambiguïtés du texte hébreu et les choix terminologiques principaux, tout en corrigeant la structure française de l’énoncé. Elle remplace « esclave » par « serviteur », terme plus englobant pour עֶבֶד, et ajoute la précision correspondante en note. Les ancres sont réordonnées pour correspondre aux termes annotés.
