  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֖י/ךָ יוֹשֵׁ֥ב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/017.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of the earth.
translation:
  language: fr
  text: La terreur, la fosse et le piège sont sur toi, habitant de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La peur, la fosse et le piège sont sur toi, toi qui habites la terre. »'
    reason: 'Alternative lexicale et syntaxique : פַּחַד peut se rendre par « peur », et le vocatif participial par une proposition relative.'
lexical_decisions:
- source_word: פַּחַד
  choice: la terreur
  rationale: Dans cette formule de jugement, le nom désigne une épouvante menaçante; « terreur » convient mieux que « peur » et contribue à restituer l'effet sonore de la triade hébraïque.
- source_word: פַחַת
  choice: la fosse
  rationale: Le terme désigne une fosse servant à prendre au piège. « Fosse » reste direct, concis et distinct du piège mentionné ensuite.
- source_word: פָח
  choice: le piège
  rationale: Le nom désigne un piège ou un lacet employé pour capturer. « Piège » est naturel en français moderne et maintient la progression de la triade.
- source_word: עָלֶיךָ
  choice: sont sur toi
  rationale: La préposition signifie littéralement « sur toi ». L'ajout de « sont » rend en français l'immédiateté de la proposition nominale hébraïque sans lui imposer explicitement une valeur future.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: habitant de la terre
  rationale: Le participe singulier fonctionne comme un vocatif. Cette formulation conserve l'adresse au singulier et la portée universelle du contexte.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte d'Ésaïe 24 présente un jugement d'ampleur universelle. « Terre » respecte cette portée tout en évitant d'ajouter une précision absente de l'hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition des articles et la coordination ternaire reflètent le rythme solennel de l'hébreu; l'écho sonore parfait entre les trois noms hébreux ne peut être entièrement reproduit.
