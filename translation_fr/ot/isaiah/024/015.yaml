  text: עַל כֵּ֥ן בָּ/אֻרִ֖ים כַּבְּד֣וּ יְהוָ֑ה בְּ/אִיֵּ֣י הַ/יָּ֔ם שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
translation:
  language: fr
  text: C’est pourquoi, à l’orient, rendez gloire à Yahweh ; dans les contrées maritimes[a], glorifiez le nom de Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les régions de lumière » ; le mot hébreu est difficile et a aussi été compris comme signifiant « dans les feux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Rend naturellement la locution conclusive qui présente la conséquence du contexte précédent.
- source_word: בָּאֻרִים
  choice: à l’orient
  rationale: Le terme est difficile. Le parallélisme avec les régions maritimes favorise un sens géographique, probablement l’est ou les régions de lumière, sans rendre cette interprétation certaine.
- source_word: כַּבְּדוּ
  choice: rendez gloire
  rationale: L’impératif pluriel de כבד invite à reconnaître et à proclamer la gloire de Dieu ; cette tournure est naturelle et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: בְּאִיֵּי הַיָּם
  choice: dans les régions côtières de la mer
  rationale: אִיִּים peut désigner des îles ou des territoires côtiers lointains ; « régions côtières » garde ici la portée géographique large.
- source_word: שֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: Conserve l’expression hébraïque centrée sur le nom révélé de Dieu et complète naturellement l’impératif répété implicitement.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction qui identifie Yahweh comme le Dieu d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme ; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Interprétation de בָּאֻרִים
  choice: 'sens géographique : « à l’orient »'
  alternative: « dans les régions de lumière » ; « dans les feux »
  rationale: Le parallélisme avec les territoires maritimes suggère une indication géographique, mais la difficulté lexicale demeure et les autres lectures sont signalées en note.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel est conservé. La ponctuation fait entendre le parallélisme poétique, et la note maintient l’incertitude du terme בָּאֻרִים.
