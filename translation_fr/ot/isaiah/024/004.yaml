  terminology: Les choix « terre », « monde », « deuil », « se flétrir » et « dépérir » sont cohérents et distincts. La note préserve correctement l’ambiguïté lexicale et syntaxique de מְרוֹם, tout en signalant « les nobles de la terre » comme possibilité interprétative plutôt que comme sens imposé.
