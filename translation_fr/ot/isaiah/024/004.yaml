  source_fidelity: 'Le texte rend fidèlement les quatre membres poétiques : אבל est bien conservé par « est en deuil », נבל par « se flétrit », et אמל par « dépérit/dépérissent ». La distinction entre « la terre » (הָאָרֶץ) et « le monde » (תֵּבֵל) est justifiée par le parallélisme et la portée universelle du contexte. « Les plus haut placés parmi le peuple de la terre » exprime de manière prudente מְרוֹם עַם הָאָרֶץ, sans imposer le sens plus étroit de « nobles ».'
