id: ISA.24.4
reference: Isaiah 24:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָבְלָ֤ה נָֽבְלָה֙ הָ/אָ֔רֶץ אֻמְלְלָ֥ה נָבְלָ֖ה תֵּבֵ֑ל אֻמְלָ֖לוּ מְר֥וֹם עַם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
translation:
  language: fr
  text: La terre est en deuil et se flétrit ; le monde dépérit et se flétrit ; les plus haut placés parmi le peuple de la terre[a] dépérissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « la hauteur » ou « l’élévation du peuple de la terre » ; on peut aussi comprendre : « les nobles de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבְלָה
  choice: est en deuil
  rationale: Le verbe אבל exprime le deuil ou la lamentation. Cette formulation conserve la personnification de la terre et la dimension affective du jugement.
- source_word: נָבְלָה
  choice: se flétrit
  rationale: Le verbe נבל évoque ce qui se fane, se flétrit ou perd sa vigueur. La même traduction est maintenue aux deux occurrences.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Bien que אֶרֶץ puisse désigner un pays, son parallélisme avec תֵּבֵל et la portée du contexte favorisent ici le sens global de « terre ».
- source_word: אֻמְלְלָה / אֻמְלָלוּ
  choice: dépérit / dépérissent
  rationale: La racine אמל décrit l'affaiblissement et le dépérissement. « Dépérir » reste distinct de « se flétrir » tout en respectant le parallélisme poétique.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne le monde, souvent envisagé comme monde habité ou ordonné. « Le monde » est naturel en français et correspond au parallèle avec « la terre ».
- source_word: מְרוֹם עַם הָאָרֶץ
  choice: les plus haut placés parmi le peuple de la terre
  rationale: מְרוֹם signifie littéralement « hauteur » ou « élévation ». Dans cette construction, l'expression paraît viser ceux qui occupent une position élevée parmi les habitants de la terre, sans préciser s'il s'agit exclusivement de nobles, de dirigeants ou d'une autre élite.
theological_decisions:
- issue: Portée du jugement dans הָאָרֶץ / תֵּבֵל
  choice: 'Portée universelle : « la terre » et « le monde »'
  alternative: 'Portée locale : « le pays »'
  rationale: Le rapprochement de הָאָרֶץ avec תֵּבֵל et l'horizon universel du passage favorisent une portée cosmique, sans qu'il soit nécessaire d'y importer une construction théologique ultérieure.
- issue: Identité de מְרוֹם עַם הָאָרֶץ
  choice: « les plus haut placés parmi le peuple de la terre »
  alternative: « les nobles de la terre » ou, plus littéralement, « la hauteur du peuple de la terre »
  rationale: Le texte évoque l'élévation sans définir précisément le rang ou la fonction de ces personnes. La traduction conserve cette image sociale tout en évitant de restreindre le groupe aux seuls nobles.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme ternaire et les répétitions du texte hébreu sont conservés. « Est en deuil » maintient la personnification, tandis que « se flétrit » et « dépérit » rendent les deux racines distinctes de déclin.
