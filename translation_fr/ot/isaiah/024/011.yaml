source:
  edition: WLC
  text: צְוָחָ֥ה עַל הַ/יַּ֖יִן בַּֽ/חוּצ֑וֹת עָֽרְבָה֙ כָּל שִׂמְחָ֔ה גָּלָ֖ה מְשׂ֥וֹשׂ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
translation:
  language: fr
  text: Une clameur s’élève au sujet du vin dans les rues ; toute joie s’est assombrie, l’allégresse de la terre s’en est allée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’allégresse du pays s’en est allée ».",
    reason: alternative_reading
lexical_decisions:
- source_word: צְוָחָה
  choice: on crie
  rationale: Le nom désigne un cri de détresse. La tournure impersonnelle est naturelle en français et conserve l’idée d’une clameur publique.
- source_word: עַל הַיַּיִן
  choice: à cause du vin
  rationale: La préposition peut présenter le vin comme objet ou cause de la lamentation. Cette formulation française indique le motif sans expliciter davantage s’il manque ou s’il est perdu.
- source_word: בַּחוּצוֹת
  choice: dans les rues
  rationale: Le terme désigne les espaces ouverts et publics d’une ville, notamment les rues ou les places.
- source_word: עָרְבָה כָּל שִׂמְחָה
  choice: toute joie s’est assombrie
  rationale: Le verbe évoque l’obscurcissement ou la venue du soir. « S’est assombrie » préserve cette image appliquée métaphoriquement à la joie.
- source_word: גָּלָה מְשׂוֹשׂ
  choice: l’allégresse … s’en est allée
  rationale: Avec l’allégresse pour sujet, le verbe exprime ici l’éloignement ou la disparition. La traduction reste imagée sans imposer le sens technique d’exil.
- source_word: הָאָרֶץ
  choice: de la terre
  rationale: Dans le contexte universel d’Ésaïe 24, « terre » convient mieux que le sens territorial plus restreint de « pays ».
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: terre
  alternative: pays
  rationale: Le langage de jugement du chapitre embrasse largement le monde ; « terre » respecte cette portée sans limiter l’oracle à un territoire particulier.
translation_notes:
  register: Français international moderne, sobre et digne. L’image hébraïque de la joie qui s’assombrit est conservée ; la différence de nuance entre שִׂמְחָה et מְשׂוֹשׂ est rendue par « joie » et « allégresse ».
