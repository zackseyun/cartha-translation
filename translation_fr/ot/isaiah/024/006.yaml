  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
translation:
  language: fr
  text: C’est pourquoi une malédiction a dévoré la terre[a], et ceux qui l’habitent portent leur culpabilité. C’est pourquoi les habitants de la terre ont été brûlés, et il ne reste que très peu d’êtres humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un serment a dévoré la terre ». Le mot hébreu peut signifier « serment » ou « malédiction »; dans ce contexte d’alliance violée et de jugement, « malédiction » paraît préférable. « La terre » peut aussi se traduire par « le pays ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie un nom collectif désignant l’être humain mortel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien de conséquence avec l’accusation du verset précédent.
- source_word: אָלָה
  choice: une malédiction
  rationale: Dans ce contexte de lois transgressées et d’alliance rompue, le terme désigne vraisemblablement la malédiction judiciaire qui en résulte, tout en pouvant aussi signifier « serment ».
- source_word: אָכְלָה
  choice: a dévoré
  rationale: Conserve l’image forte et concrète du verbe « manger, dévorer ».
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le cadre d’Ésaïe 24 paraît universel; « terre » convient donc mieux ici que le sens local possible « pays ».
- source_word: וַיֶּאְשְׁמוּ
  choice: portent leur culpabilité
  rationale: Préserve à la fois l’idée qu’ils sont coupables et celle qu’ils en subissent les conséquences, sans réduire le verbe au seul châtiment.
- source_word: חָרוּ
  choice: ont été consumés
  rationale: Rend le jugement destructeur exprimé par le verbe, qui peut évoquer le fait d’être brûlé ou desséché.
- source_word: אֱנוֹשׁ מִזְעָר
  choice: très peu d’êtres humains
  rationale: אֱנוֹשׁ est ici collectif et désigne l’humanité mortelle; cette formulation inclusive est naturelle en français et מִזְעָר souligne leur très petit nombre.
theological_decisions:
- issue: Sens de אָלָה dans le contexte du jugement
  choice: malédiction
  alternative: serment, ou serment imprécatoire
  rationale: Le verset précédent parle de la violation des lois et de l’alliance; « malédiction » exprime donc au mieux la conséquence judiciaire, sans nier l’autre sens lexical.
- issue: Portée de אֶרֶץ
  choice: terre
  alternative: pays
  rationale: La rhétorique du chapitre est de portée universelle, même si le mot hébreu peut aussi désigner un pays.
- issue: Valeur de וַיֶּאְשְׁמוּ
  choice: portent leur culpabilité
  alternative: sont reconnus coupables; subissent leur peine
  rationale: La traduction retenue maintient la tension entre culpabilité et conséquence pénale.
- issue: Référent collectif de אֱנוֹשׁ
  choice: êtres humains
  alternative: hommes; humanité
  rationale: Le substantif masculin singulier est employé collectivement pour les humains mortels, et non nécessairement pour les seuls hommes de sexe masculin.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « a dévoré » est conservée; la répétition de « C’est pourquoi » reproduit la structure hébraïque. « Ont été consumés » évite une image française involontairement limitée aux brûlures superficielles tout en gardant la force du jugement.
