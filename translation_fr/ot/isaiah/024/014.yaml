id: ISA.24.14
reference: Isaiah 24:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֛מָּה יִשְׂא֥וּ קוֹלָ֖/ם יָרֹ֑נּוּ בִּ/גְא֣וֹן יְהוָ֔ה צָהֲל֖וּ מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/014.yaml
  text: They lift up their voice; they shout for joy. At the majesty of Yahweh[a], they cry aloud from the sea.
translation:
  language: fr
  text: Eux, ils élèvent la voix, ils poussent des cris de joie ; devant la majesté de Yahweh, ils lancent des acclamations depuis la mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’ouest » ou « depuis les régions côtières » ; en poésie prophétique, l’hébreu « depuis la mer » peut avoir un sens géographique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eux, ils
  rationale: Le pronom indépendant placé en tête a une valeur emphatique. La dislocation « Eux, ils » la rend naturellement en français.
- source_word: יִשְׂאוּ קוֹלָם
  choice: élèvent la voix
  rationale: Expression idiomatique française correspondant directement à l’idée d’élever ou de faire entendre sa voix.
- source_word: יָרֹנּוּ
  choice: poussent des cris de joie
  rationale: Le verbe exprime une manifestation vocale et jubilatoire sans imposer nécessairement l’idée d’un chant.
- source_word: בִּגְאוֹן
  choice: devant la majesté de
  rationale: « Devant » conserve la souplesse poétique de la préposition ב sans trancher en faveur d’une relation strictement causale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: צָהֲלוּ
  choice: lancent des acclamations
  rationale: Rend l’éclat sonore et l’exultation du verbe tout en évitant de répéter exactement « cris de joie ».
- source_word: מִיָּם
  choice: depuis la mer
  rationale: Conserve le sens lexical direct de ים et laisse en note ses possibles valeurs géographiques.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; le recours au nom propre le distingue d’un simple titre.
- issue: Rapport exprimé par ב dans בִּגְאוֹן יְהוָה
  choice: devant la majesté de Yahweh
  alternative: à cause de la majesté de Yahweh
  rationale: La préposition peut indiquer le cadre, le motif ou l’objet de l’exultation. « Devant » préserve cette tension plutôt que d’expliciter une causalité certaine.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme vocal est maintenu, avec une variation lexicale naturelle entre « cris de joie » et « acclamations ».
