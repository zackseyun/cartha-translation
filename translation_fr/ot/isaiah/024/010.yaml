  text: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
translation:
  language: fr
  text: La cité du chaos est en ruine[a] ; chaque maison est fermée à toute entrée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La cité du vide est en ruine » ou « La cité de la désolation est en ruine ». Le mot hébreu תֹּהוּ peut évoquer le chaos, le vide ou la désolation. Le verbe נִשְׁבְּרָה signifie littéralement « a été brisée » ou « a été fracassée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chaque maison est fermée d’entrer ». La construction hébraïque exprime que l’entrée est empêchée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: est détruite
  rationale: Le niphal accompli de שׁבר exprime ici l’état résultant d’une cité brisée ou mise en ruine. « Est détruite » rend naturellement l’image urbaine en français sans la réduire à une simple fissure.
- source_word: קִרְיַת
  choice: la cité du
  rationale: Le construit de קִרְיָה signifie « cité/ville de ». « Cité » convient au registre prophétique tout en restant intelligible.
- source_word: תֹּהוּ
  choice: chaos
  rationale: תֹּהוּ peut désigner le chaos, le vide ou la désolation. « Chaos » conserve ici la force abstraite et l’écho d’un ordre défait.
- source_word: סֻגַּר
  choice: est fermée
  rationale: 'Le pual accompli de סגר a un sens passif : « être fermé ». L’accord au singulier avec « chaque maison » respecte la construction hébraïque.'
- source_word: כָּל בַּיִת
  choice: chaque maison
  rationale: כָּל suivi d’un nom singulier a une valeur distributive. « Chaque maison » est idiomatique et garde l’accent sur les bâtiments individuels.
- source_word: מִבּוֹא
  choice: interdisant toute entrée
  rationale: La tournure signifie littéralement « [fermée] quant au fait d’entrer/de l’entrée ». Cette formulation française exprime l’accès empêché sans préciser indûment qui voudrait entrer.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et prophétique. « Cité » maintient une certaine dignité littéraire ; « interdisant toute entrée » restitue l’hébreu elliptique tout en préservant son caractère impersonnel.
