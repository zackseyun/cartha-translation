base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the servant, so with his master; as with the female servant, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
translation:
  language: fr
  text: Il en sera du peuple comme du prêtre, de l’esclave comme de son maître, de la femme esclave comme de sa maîtresse, de l’acheteur comme du vendeur, du prêteur comme de l’emprunteur, du créancier comme de son débiteur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « comme celui qui réclame [une dette], comme celui de qui il réclame » ; c’est-à-dire, le créancier et le débiteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Il en sera
  rationale: Rend naturellement en français la formule hébraïque annonçant l’état de choses à venir, tout en maintenant le registre prophétique.
- source_word: כָעָם כַּכֹּהֵן
  choice: du peuple comme du prêtre
  rationale: La construction française concise conserve la comparaison et l’égalité de sort entre les deux groupes.
- source_word: כַעֶבֶד כַּאדֹנָיו
  choice: de l’esclave comme de son maître
  rationale: « Esclave » préserve le statut de dépendance exprimé par עֶבֶד dans cette série de rapports sociaux; « maître » désigne ici le supérieur humain.
- source_word: כַשִּׁפְחָה כַּגְּבִרְתָּהּ
  choice: de la servante esclave comme de sa maîtresse
  rationale: « Servante esclave » exprime à la fois le sexe féminin et la condition servile de שִׁפְחָה, tandis que « maîtresse » est le pendant social naturel de גְּבִרָה.
- source_word: כַקּוֹנֶה כַּמּוֹכֵר
  choice: de l’acheteur comme du vendeur
  rationale: Équivalents français directs et idiomatiques des participes substantivés.
- source_word: כַמַּלְוֶה כַּלֹּוֶה
  choice: du prêteur comme de l’emprunteur
  rationale: Conserve clairement l’opposition économique entre celui qui prête et celui qui emprunte.
- source_word: כַנֹּשֶׁה כַּאֲשֶׁר נֹשֶׁא בוֹ
  choice: du créancier comme de son débiteur
  rationale: Rend idiomatiquement les deux parties du rapport de dette. La formulation hébraïque de la seconde partie est plus littérale et légèrement difficile; cette nuance est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et rythmé. La répétition de « comme » maintient la structure martelée de l’hébreu, tandis que l’ellipse française évite une succession lourde de propositions complètes. Le vocabulaire explicite les statuts sociaux et économiques sans archaïsme.
