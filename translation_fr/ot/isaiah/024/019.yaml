source:
  edition: WLC
  text: רֹ֥עָה הִֽתְרֹעֲעָ֖ה הָ/אָ֑רֶץ פּ֤וֹר הִֽתְפּוֹרְרָה֙ אֶ֔רֶץ מ֥וֹט הִֽתְמוֹטְטָ֖ה אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/019.yaml
  text: The earth is utterly shattered[a]; the earth is completely broken apart; the earth is violently shaken.
translation:
  language: fr
  text: La terre est totalement fracassée[a] ; la terre se disloque complètement ; la terre est violemment ébranlée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le pays est totalement fracassé… le pays se disloque complètement… le pays est violemment ébranlé. »
    reason: 'Alternative lexicale : אֶרֶץ peut signifier « terre » ou « pays ».'
lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  choice: est totalement fracassée
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action. « Totalement fracassée » rend avec naturel la force destructive de רעע tout en préservant cette intensification.
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner « le pays » ou « la terre ». Le contexte cosmique d’Ésaïe 24 favorise ici « la terre ». La répétition est conservée dans chaque proposition pour reproduire l’insistance rythmique de l’hébreu.
- source_word: פּוֹר הִתְפּוֹרְרָה
  choice: se disloque complètement
  rationale: La construction intensive exprime ici une désagrégation complète. « Se disloque » distingue cette image de celle du premier membre et rend l’idée de fragmentation portée par פרר/פור.
- source_word: מוֹט הִתְמוֹטְטָה
  choice: est violemment ébranlée
  rationale: Le radical מוט évoque le fait de chanceler, vaciller ou être ébranlé. Dans cette scène de bouleversement catastrophique, « violemment ébranlée » rend clairement le mouvement et l’intensification.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme ternaire, la répétition de « la terre » et l’intensité croissante des trois verbes sont préservés.
