id: ISA.24.3
reference: Isaiah 24:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
translation:
  language: fr
  text: La terre sera entièrement vidée et complètement pillée[a], car Yahweh a prononcé cette parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le pays sera entièrement vidé et complètement pillé ». Le mot hébreu אֶרֶץ peut désigner le pays ou la terre; le contexte général favorise ici le sens universel de « terre ».
    reason: alternative lexicale
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  choice: sera entièrement vidée
  rationale: La construction avec infinitif absolu et verbe conjugué intensifie l’action. Le passif « sera vidée » et l’adverbe « entièrement » rendent à la fois la voix et l’emphase de l’hébreu.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner le pays ou la terre. La portée universelle d’Ésaïe 24 favorise ici « la terre », sans effacer l’autre possibilité.
- source_word: וְהִבּוֹז תִּבּוֹז
  choice: et complètement pillée
  rationale: La seconde construction intensive parallèle souligne l’ampleur du pillage. « Complètement pillée » est naturel en français et conserve le sens passif et emphatique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le fondement de l’annonce du jugement et convient au registre prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: דִּבֶּר
  choice: a prononcé
  rationale: Le parfait présente la déclaration comme acquise et certaine. « A prononcé » exprime naturellement en français le caractère solennel et effectif de l’oracle.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: cette parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la déclaration divine; « cette parole » en conserve le caractère verbal et solennel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom divin sous une forme de translittération courante sans le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le contexte élargi du chapitre décrit un jugement d’ampleur universelle; la variante lexicale réelle est toutefois signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme intensif hébreu est conservé par « entièrement » et « complètement », tout en évitant une répétition lourde. La formulation garde le ton solennel de l’annonce prophétique.
