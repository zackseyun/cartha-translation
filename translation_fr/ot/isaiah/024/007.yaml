  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
translation:
  language: fr
  text: Le vin nouveau est en deuil, la vigne dépérit ; tous ceux dont le cœur est joyeux gémissent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבַל
  choice: est en deuil
  rationale: Conserve la personnification poétique du vin et le sens habituel de deuil ou d’affliction, sans réduire l’image à un simple dessèchement.
- source_word: תִּירוֹשׁ
  choice: le vin nouveau
  rationale: Rend la désignation du vin frais ou nouveau et maintient sa distinction lexicale avec le terme général pour le vin.
- source_word: אֻמְלְלָה
  choice: dépérit
  rationale: Exprime l’affaiblissement et le flétrissement progressifs de la vigne dans un français naturel.
- source_word: גָפֶן
  choice: la vigne
  rationale: Équivalent français direct et naturel dans ce contexte agricole et poétique.
- source_word: נֶאֶנְחוּ
  choice: gémissent
  rationale: Restitue l’expression audible de la douleur avec une intensité adaptée au tableau de désolation.
- source_word: כָּל
  choice: tous
  rationale: Préserve la portée collective du terme hébreu.
- source_word: שִׂמְחֵי לֵב
  choice: ceux dont le cœur était joyeux
  rationale: Rend explicitement l’expression hébraïque « joyeux de cœur » dans un français courant. L’imparfait indique naturellement que leur joie antérieure a fait place aux gémissements, sans modifier le contraste implicite du texte.
