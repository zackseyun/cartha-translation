source:
  edition: WLC
  text: כִּ֣י כֹ֥ה יִהְיֶ֛ה בְּ/קֶ֥רֶב הָ/אָ֖רֶץ בְּ/ת֣וֹךְ הָֽ/עַמִּ֑ים כְּ/נֹ֣קֶף זַ֔יִת כְּ/עוֹלֵלֹ֖ת אִם כָּלָ֥ה בָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
translation:
  language: fr
  text: 'Car il en sera ainsi au milieu de la terre[a], parmi les peuples : comme lorsqu’on frappe un olivier pour en faire tomber les olives[b], comme les grappes laissées quand la vendange est finie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu du pays ». Le mot hébreu peut désigner soit la terre, soit un pays.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme lorsqu’on secoue un olivier ». L’image est celle de la récolte des olives en frappant ou en secouant l’arbre, après quoi il ne reste que peu de fruits.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה יִהְיֶה
  choice: Car il en sera ainsi
  rationale: כִּי relie le verset à ce qui précède en apportant une explication, tandis que כֹה יִהְיֶה exprime simplement la manière dont les choses se présenteront.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au milieu de la terre
  rationale: קֶרֶב désigne l’intérieur ou le milieu. Dans ce contexte mondial et en parallèle avec « parmi les peuples », הָאָרֶץ est rendu par « la terre », tout en signalant en note le sens possible « le pays ».
- source_word: בְּתוֹךְ הָעַמִּים
  choice: parmi les peuples
  rationale: Cette formulation naturelle conserve le pluriel de עַמִּים sans réduire le terme à des États-nations.
- source_word: כְּנֹקֶף זַיִת
  choice: comme lorsqu’on frappe un olivier pour en faire tomber les fruits
  rationale: נֹקֶף évoque ici l’action de battre ou de secouer l’olivier afin d’en détacher les olives. La formulation explicite l’image agricole sans employer le terme moins courant « gaulage ».
- source_word: כְּעוֹלֵלֹת
  choice: comme les grappes laissées
  rationale: עוֹלֵלֹת désigne les grappes ou raisins qui restent après la récolte principale et peuvent être grappillés.
- source_word: אִם כָּלָה בָצִיר
  choice: quand la vendange est finie
  rationale: Dans ce contexte, אִם a une valeur temporelle plutôt que conditionnelle, et בָצִיר désigne spécifiquement la vendange.
theological_decisions: []
