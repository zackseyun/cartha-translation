  naturalness: « L’armée des hauteurs dans les hauteurs » est lourd et peu idiomatique en français moderne. « L’armée d’en haut, en haut » est concis, naturel dans un registre biblique sobre, et conserve la répétition intentionnelle.
  terminology: « SEIGNEUR » rend de manière cohérente le tétragramme. « Armée d’en haut » ne tranche pas l’identité disputée du groupe (êtres célestes, astres ou puissances) et évite de l’interpréter comme des anges.
