  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: fr
  text: En ce jour-là, le SEIGNEUR punira l’armée d’en haut, en haut, et les rois de la terre, sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִפְקֹד
  choice: interviendra contre
  rationale: Le verbe פקד exprime ici une intervention divine hostile pouvant impliquer inspection, jugement ou châtiment. « Interviendra contre » conserve cette amplitude sans imposer trop tôt le seul sens de « punir ».
- source_word: צְבָא הַמָּרוֹם
  choice: l’armée des hauteurs
  rationale: Traduction proche de la formulation hébraïque, qui maintient l’ambiguïté sur l’identité de cette armée et évite de préciser sans nécessité « armée céleste » ou « astres ».
- source_word: בַּמָּרוֹם
  choice: dans les hauteurs
  rationale: Le pluriel français idiomatique évoque le domaine élevé ou céleste tout en reproduisant le jeu lexical entre מָרוֹם et הַמָּרוֹם.
- source_word: מַלְכֵי הָאֲדָמָה
  choice: les rois de la terre
  rationale: Rendu direct et naturel, avec conservation de la répétition de « terre » dans le second complément.
theological_decisions:
- issue: Identité de « l’armée des hauteurs »
  choice: Ne pas identifier explicitement cette armée à des anges, à des puissances spirituelles ou aux astres.
  alternative: « l’armée céleste » ou « les puissances célestes »
  rationale: Le texte évoque une armée située dans les hauteurs, mais le référent précis demeure ouvert. La traduction préserve cette tension.
- issue: Nature de l’action divine exprimée par פקד
  choice: Employer « interviendra contre » afin de communiquer une visitation hostile sans en réduire la portée.
  alternative: « punira »
  rationale: Dans ce contexte judiciaire, « punira » est plausible, mais פקד peut couvrir plus largement le fait de demander compte, visiter ou sévir contre.
translation_notes:
  register: Français moderne, sobre et solennel. La structure parallèle et les répétitions « hauteurs/hauteurs » et « terre/terre » sont conservées autant que le permet un français naturel. « SEIGNEUR » représente le tétragramme divin.
