base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
translation:
  language: fr
  text: 'Alors la lune sera couverte de honte,

    et le soleil rougira de honte,

    car Yahweh des armées régnera

    sur le mont Sion et à Jérusalem ;

    devant ses anciens, il y aura la gloire.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très concis : littéralement, « devant ses anciens, gloire ». Le suffixe de « ses anciens » peut renvoyer à Yahweh ou, selon une autre analyse, à Sion ou à Jérusalem, au sens des anciens de la ville.'
    reason: 'Préserve l’ambiguïté du référent du suffixe et la construction nominale finale sans ajouter de possessif au mot « gloire ». '
lexical_decisions:
- source_word: וְחָפְרָה
  choice: sera couverte de honte
  rationale: Le verbe חפר exprime ici la honte ou l’humiliation. Cette formulation française naturelle convient à la personnification de la lune.
- source_word: הַלְּבָנָה
  choice: la lune
  rationale: Il s’agit du terme usuel désignant la lune dans ce parallélisme avec le soleil.
- source_word: וּבוֹשָׁה
  choice: sera confondu
  rationale: בוש exprime également la honte. « Sera confondu » distingue les deux verbes parallèles sans leur attribuer des sens trop éloignés.
- source_word: הַחַמָּה
  choice: le soleil
  rationale: Dans le parallélisme avec la lune, le nom désigne clairement le soleil.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit naturellement la raison de l’humiliation des astres.
- source_word: מָלַךְ
  choice: régnera
  rationale: Dans ce contexte prophétique, l’accompli hébreu présente avec certitude le règne à venir de Yahweh. Le futur français s’accorde avec les verbes précédents.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, et צְבָאוֹת est rendu par « des armées », expression actuelle qui conserve l’image des forces placées sous son autorité.
- source_word: בְּהַר צִיּוֹן
  choice: sur le mont Sion
  rationale: « Sur » est la préposition française naturelle avec une montagne.
- source_word: וּבִירוּשָׁלִַם
  choice: et à Jérusalem
  rationale: « À » est l’usage français normal devant un nom de ville.
- source_word: וְנֶגֶד זְקֵנָיו
  choice: devant ses anciens
  rationale: נֶגֶד marque ici la présence. Le suffixe masculin singulier est rendu par « ses » et renvoie le plus naturellement à Yahweh, tout en laissant l’autre possibilité en note.
- source_word: כָּבוֹד
  choice: il y aura la gloire
  rationale: Le nom final est isolé dans une proposition sans verbe. L’ajout idiomatique de « il y aura » en français exprime la portée prophétique sans préciser indûment à qui appartient la gloire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Référent du suffixe dans זְקֵנָיו
  choice: « ses anciens », rapporté à Yahweh
  alternative: « les anciens de Sion/Jérusalem »
  rationale: Le sujet masculin singulier Yahweh constitue le référent le plus naturel. Toutefois, la syntaxe concise permet de rattacher le suffixe à Sion/Jérusalem comme entité collective ; cette ambiguïté est signalée en note.
- issue: Rapport syntaxique du mot final כָּבוֹד
  choice: « il y aura la gloire »
  alternative: '« sa gloire sera devant ses anciens » ou « devant ses anciens : gloire ! »'
  rationale: L’hébreu se termine abruptement par le nom « gloire », sans verbe ni suffixe possessif. La traduction garde cette sobriété et la note préserve les principales analyses possibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est disposé en lignes. « Couverte de honte » et « confondu » rendent les deux verbes proches sans répétition mécanique. « Yahweh des armées » privilégie une expression intelligible aujourd’hui tout en conservant l’image hébraïque.
