  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
translation:
  language: fr
  text: On ne boit pas de vin au son des chants[a] ; la boisson forte est amère à ceux qui la boivent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « On ne boira pas de vin en chantant. » L’imparfait hébreu peut avoir une valeur future, et בַּשִּׁיר peut aussi se traduire par « en chantant » ou « accompagné de chants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשִּׁיר
  choice: au son des chants
  rationale: 'La préposition בְּ avec שִׁיר exprime ici naturellement l’accompagnement ou la manière : dans la ville dévastée, le vin n’est plus bu dans une ambiance de chants. Cette formulation est naturelle en français et conserve l’image poétique.'
- source_word: לֹא יִשְׁתּוּ
  choice: on ne boit plus
  rationale: L’imparfait hébreu peut décrire vivement la situation présente ou avoir une portée future. Le tour impersonnel français convient au sujet indéfini et « plus » rend le contraste contextuel avec les réjouissances disparues, sans fixer explicitement le temps au futur.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent français courant et précis de יַיִן.
- source_word: יֵמַר
  choice: est amère
  rationale: Le verbe מרר signifie « être amer ». Le présent maintient la description vive et concise, tandis que l’accord au féminin suit « boisson ».
- source_word: שֵׁכָר
  choice: boisson forte
  rationale: שֵׁכָר désigne une boisson enivrante distincte du vin. « Boisson forte » maintient cette distinction lexicale dans un registre biblique compréhensible, sans la réduire nécessairement à la bière.
- source_word: לְשֹׁתָיו
  choice: à ceux qui la boivent
  rationale: La forme désigne ceux qui boivent cette boisson. Le pronom « la » explicite naturellement en français le référent féminin « boisson forte ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que l’ambiguïté temporelle de l’imparfait hébreu grâce à une note. « Au son des chants » évite le peu naturel « avec un chant » tout en exprimant l’accompagnement festif.
