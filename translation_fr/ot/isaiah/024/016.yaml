  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
translation:
  language: fr
  text: 'Du bout de la terre, nous entendons des chants : « Gloire au juste ! »[a] Mais moi, je dis : « Je dépéris, je dépéris ! Malheur à moi ! »[b] Les traîtres agissent traîtreusement ; avec traîtrise, les traîtres agissent traîtreusement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « De l’aile de la terre » ou « des extrémités de la terre ». « Splendeur au juste ! » est également possible. Le singulier hébreu peut aussi être compris dans un sens collectif : « Honneur aux justes ! »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est difficile. Selon une autre compréhension : « Mon secret est à moi, mon secret est à moi ! » ou « Quel mystère pour moi ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  choice: Du bout de la terre
  rationale: כָּנָף signifie littéralement « aile », mais désigne ici l’extrémité ou le bord d’un territoire. « Du bout de la terre » conserve le singulier hébreu et rend naturellement l’image géographique.
- source_word: זְמִרֹת שָׁמַעְנוּ
  choice: nous entendons des chants
  rationale: זְמִרֹת désigne des chants ou mélodies, sans préciser explicitement qu’il s’agit de louanges. Le présent donne à la scène prophétique son caractère immédiat.
- source_word: צְבִי לַצַּדִּיק
  choice: Gloire au juste !
  rationale: צְבִי peut exprimer la beauté, la splendeur, l’honneur ou la gloire. Dans cette acclamation, « gloire » restitue bien la valeur laudative ; « au juste » garde la forme singulière sans préciser son identité.
- source_word: וָאֹמַר
  choice: Mais moi, je dis
  rationale: La conjonction marque ici un contraste abrupt entre les chants entendus et la lamentation du locuteur. « Mais » explicite ce rapport contextuel, tandis que « moi » souligne le changement de voix.
- source_word: רָזִי לִי רָזִי לִי
  choice: Je dépéris, je dépéris !
  rationale: L’expression difficile est traditionnellement rattachée à רזה, « maigrir, dépérir ». Cette formulation française rend naturellement la détresse et conserve la répétition emphatique.
- source_word: אוֹי לִי
  choice: Malheur à moi !
  rationale: Formule française courante de lamentation, correspondant directement à l’interjection hébraïque.
- source_word: בֹּגְדִים בָּגָדוּ
  choice: Les traîtres trahissent
  rationale: Le couple « traîtres/trahissent » reproduit avec concision la répétition de la racine בגד et son effet rhétorique.
- source_word: וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  choice: les traîtres commettent trahison sur trahison
  rationale: Cette formulation conserve l’accumulation de la racine liée à la trahison tout en restant intelligible en français. « Sur trahison » rend la force intensive du substantif בֶּגֶד.
theological_decisions:
- issue: Référent de לַצַּדִּיק
  choice: au juste
  alternative: aux justes / à celui qui est juste
  rationale: L’hébreu est grammaticalement singulier et défini, mais ne précise pas l’identité du référent. Le texte principal préserve ce singulier sans lui imposer une identification théologique ; la note signale la lecture collective possible.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de la racine בגד est partiellement reproduite par « traîtres », « trahissent » et « trahison », sans rendre la phrase artificiellement obscure. Les deux notes portent sur les ambiguïtés réelles du texte hébreu ; tous leurs marqueurs figurent dans le texte principal.
