  text: נִשְׁאַ֥ר בָּ/עִ֖יר שַׁמָּ֑ה וּ/שְׁאִיָּ֖ה יֻכַּת שָֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/012.yaml
  text: Desolation is left in the city[a], and the gate is battered into ruins.
translation:
  language: fr
  text: Dans la ville, il reste la désolation[a] ; la porte est fracassée, réduite en ruines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La désolation demeure dans la ville, et la porte est mise en pièces, réduite à l’état de ruine. »'
    reason: La syntaxe hébraïque peut faire de « la désolation » le sujet explicite de « demeure ». La seconde proposition exprime le résultat de destruction associé à שְׁאִיָּה.
lexical_decisions:
- source_word: נִשְׁאַר
  choice: il ne reste que
  rationale: Le nifal exprime ce qui subsiste après la dévastation. La tournure existentielle française est naturelle et fait de שַׁמָּה ce qui demeure, sans changer le tableau de destruction.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: עִיר désigne normalement une ville ; la préposition et l’article sont rendus directement.
- source_word: שַׁמָּה
  choice: la désolation
  rationale: Le nom évoque un état de dévastation, un lieu laissé désert et ravagé. « Désolation » convient au registre prophétique tout en restant compréhensible.
- source_word: וּשְׁאִיָּה
  choice: réduite en ruine
  rationale: Ce nom proche de « dévastation » ou « ruine » est rendu de manière résultative en français, ce qui évite une répétition lourde tout en conservant l’aboutissement destructeur.
- source_word: יֻכַּת
  choice: est abattue
  rationale: Le hofal de כתת exprime l’action passive d’être frappé, broyé ou abattu. « Est abattue » garde la force destructrice et s’applique naturellement à une porte.
- source_word: שָׁעַר
  choice: la porte
  rationale: Le terme désigne ici la porte de la ville, évidente dans le contexte immédiat ; il n’est donc pas nécessaire de répéter « de la ville ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et prophétique. Le point-virgule maintient le parallélisme entre l’intérieur dévasté de la ville et sa porte détruite.
