  source_fidelity: 'La proposition principale conserve correctement les deux images du texte hébreu : la désolation qui demeure dans la ville et la porte passivement brisée. Toutefois, « ne reste que » introduit une restriction (« seulement ») qui n’est pas exprimée par נִשְׁאַר. « Réduite en ruine » n’est pas une collocation française idiomatique ; « réduite en ruines » rend naturellement le résultat destructeur de שְׁאִיָּה.'
  naturalness: La révision supprime l’ajout restrictif et remplace une formulation maladroite par une expression française courante. « Fracassée, réduite en ruines » garde un registre prophétique sobre sans affaiblir la violence de יֻכַּת.
