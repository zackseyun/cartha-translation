source:
  edition: WLC
  text: נ֣וֹעַ תָּנ֤וּעַ אֶ֨רֶץ֙ כַּ/שִּׁכּ֔וֹר וְ/הִֽתְנוֹדְדָ֖ה כַּ/מְּלוּנָ֑ה וְ/כָבַ֤ד עָלֶ֨י/הָ֙ פִּשְׁעָ֔/הּ וְ/נָפְלָ֖ה וְ/לֹא תֹסִ֥יף קֽוּם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
translation:
  language: fr
  text: La terre titubera comme un homme ivre et oscillera comme une cabane[a]. Sa révolte pèsera lourd sur elle ; elle tombera et ne se relèvera plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une cabane de gardien » ou « comme un abri temporaire » ; le terme hébreu désigne un logement provisoire et fragile.
    reason: alternative lexicale
lexical_decisions:
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  choice: titubera
  rationale: La construction infinitif absolu + imparfait intensifie le mouvement. « Titubera » rend naturellement cette insistance en français et prépare la comparaison avec l’homme ivre.
- source_word: אֶ֨רֶץ֙
  choice: la terre
  rationale: Le contexte universel d’Ésaïe 24 favorise « la terre » plutôt que « le pays ».
- source_word: כַּ/שִּׁכּ֔וֹר
  choice: comme un homme ivre
  rationale: Le substantif désigne une personne ivre. Cette formulation française est claire et naturelle sans suggérer nécessairement une habitude durable, comme pourrait le faire « ivrogne ».
- source_word: וְ/הִֽתְנוֹדְדָ֖ה
  choice: et oscillera
  rationale: La forme verbale exprime un mouvement instable et répété. « Oscillera » convient aussi à l’image de l’abri fragile.
- source_word: כַּ/מְּלוּנָ֑ה
  choice: comme une cabane
  rationale: Le terme désigne un logement ou abri temporaire et fragile. « Cabane » conserve l’image concrète, tandis que les précisions possibles sont données en note.
- source_word: וְ/כָבַ֤ד עָלֶ֨י/הָ֙
  choice: pèsera lourd sur elle
  rationale: Cette expression préserve la métaphore hébraïque d’un poids accablant.
- source_word: פִּשְׁעָ֔/הּ
  choice: sa révolte
  rationale: פשע désigne une transgression envisagée comme rébellion. « Révolte » conserve cette force morale sans préciser davantage l’objet de la rébellion.
- source_word: וְ/נָפְלָ֖ה
  choice: elle tombera
  rationale: Dans cette suite prophétique, le parfait coordonné se rend naturellement par un futur.
- source_word: וְ/לֹא תֹסִ֥יף קֽוּם
  choice: et ne se relèvera plus
  rationale: L’idiome יסף + infinitif signifie ne pas recommencer à faire l’action ; « ne se relèvera plus » est son équivalent français naturel.
theological_decisions:
- issue: Portée de אֶרֶץ dans le contexte du jugement d’Ésaïe 24
  choice: la terre
  alternative: le pays
  rationale: Le contexte immédiat présente un bouleversement de portée universelle. « La terre » respecte cette perspective sans introduire de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les verbes concrets « titubera » et « oscillera » maintiennent les deux images de forte instabilité. Le point avant la seconde proposition évite une phrase excessivement chargée tout en conservant la progression poétique.
