source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
translation:
  language: fr
  text: La terre est souillée sous ses habitants, car ils ont transgressé les lois, enfreint la prescription[a] et rompu l’alliance éternelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « modifié la prescription ». Le verbe hébreu peut évoquer soit la violation ou le dépassement d’une règle établie, soit sa modification.
    reason: lexical_alternative
  - marker: b
    text: Le texte ne précise pas quelle est cette « alliance éternelle ». Elle est diversement comprise comme l’alliance avec Noé ou comme l’ordre moral durable établi par Dieu pour l’humanité.
    reason: alternative_reading
lexical_decisions:
- source_word: חָנְפָה
  choice: est profanée
  rationale: Le verbe exprime ici une souillure morale et religieuse de la terre. « Profanée » conserve cette portée sans la réduire à l’impureté rituelle.
- source_word: תַּחַת יֹשְׁבֶיהָ
  choice: sous les pas de ses habitants
  rationale: תַּחַת signifie littéralement « sous ». L’expression française rend naturelle l’image de la terre située sous ceux qui l’habitent, sans la remplacer par une relation causale explicite.
- source_word: עָבְרוּ תוֹרֹת
  choice: ont transgressé les lois
  rationale: Dans ce contexte juridique et moral, עבר signifie franchir les limites fixées, donc transgresser; le pluriel תוֹרֹת désigne des enseignements ayant force normative.
- source_word: חָלְפוּ חֹק
  choice: enfreint la prescription
  rationale: חָלַף peut signifier dépasser, enfreindre ou changer. Dans le parallélisme des violations, « enfreint » convient au texte principal; « prescription » rend le caractère établi de חֹק sans désigner une ordonnance particulière.
- source_word: הֵפֵרוּ בְּרִית עוֹלָם
  choice: rompu l’alliance éternelle
  rationale: הפר est un terme usuel pour la rupture d’une alliance. « Alliance éternelle » traduit la durée exprimée par עוֹלָם sans préciser quel pacte est visé.
theological_decisions:
- issue: Référent de « l’alliance éternelle »
  choice: Conserver la formulation générale « l’alliance éternelle ».
  alternative: Préciser qu’il s’agit de l’alliance avec Noé, de l’ordre moral de la création ou d’une alliance universelle avec l’humanité.
  rationale: Le verset n’identifie pas explicitement cette alliance. La traduction préserve donc l’ambiguïté et évite d’imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme juridique du texte hébreu est conservé. « Sous les pas de » explicite légèrement l’image spatiale sans transformer תַּחַת en « à cause de ».
