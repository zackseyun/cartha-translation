id: ISA.24.8
reference: Isaiah 24:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁבַת֙ מְשׂ֣וֹשׂ תֻּפִּ֔ים חָדַ֖ל שְׁא֣וֹן עַלִּיזִ֑ים שָׁבַ֖ת מְשׂ֥וֹשׂ כִּנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
translation:
  language: fr
  text: L’allégresse des tambourins a cessé[a] ; le tumulte des gens en liesse a pris fin ; l’allégresse de la lyre a cessé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la joie » ; le mot hébreu évoque ici une joie particulièrement vive et festive.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement « harpe » ; l’instrument hébreu était plus probablement une lyre.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַת
  choice: a cessé
  rationale: Le qal accompli exprime ici la cessation avec un état résultant. « A cessé » convient aux deux occurrences et préserve leur répétition.
- source_word: מְשׂוֹשׂ
  choice: allégresse
  rationale: Le nom désigne une joie vive et festive. « Allégresse » rend cette nuance dans un registre actuel et digne, tout en conservant l’image poétique de l’allégresse associée aux instruments.
- source_word: תֻּפִּים
  choice: tambourins
  rationale: Le terme désigne vraisemblablement des instruments à percussion tenus à la main. « Tambourins » est précis et immédiatement compréhensible.
- source_word: חָדַל
  choice: a pris fin
  rationale: Le verbe signifie cesser. Avec « tumulte », « a pris fin » est naturel en français et évite une répétition française inutile sans effacer le parallélisme des trois cessations.
- source_word: שְׁאוֹן
  choice: tumulte
  rationale: Le nom peut évoquer bruit, vacarme ou agitation sonore. « Tumulte » communique la clameur collective des réjouissances sans la réduire au simple volume sonore.
- source_word: עַלִּיזִים
  choice: les gens en liesse
  rationale: La forme désigne ceux qui exultent ou se réjouissent. « Les gens en liesse » est idiomatique et n’ajoute pas la connotation d’excès que pourrait suggérer « fêtards ».
- source_word: כִּנּוֹר
  choice: lyre
  rationale: L’instrument antique est généralement identifié comme une lyre plutôt que comme une harpe. « Lyre » est donc le terme français le plus précis.
theological_decisions: []
