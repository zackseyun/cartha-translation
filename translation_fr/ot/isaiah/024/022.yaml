review_pass:
  verdict: revise
  source_fidelity: Le passif pluriel, le rassemblement intensif, l’image de la fosse et de la réclusion, ainsi que le délai (« après de nombreux jours »), sont bien rendus. Dans ce contexte judiciaire, « ils seront punis » est une interprétation contextuellement solide de יִפָּקֵדוּ, mais le verbe hébreu reste plus large et doit être reflété par une note formulée plus directement.
  naturalness: Le français est fluide et de registre moderne. « Punis » est plus courant et moins connoté d’un châtiment correctif ou archaïsant que « châtiés ». « Après de nombreux jours » est idiomatique tout en restant proche de l’hébreu.
  terminology: « Fosse » et « prison » maintiennent volontairement les deux images de détention du texte. La note proposée remplace la paraphrase imprécise « feront l’objet d’une intervention » par l’alternative lexicale directe « seront visités », puis explique sans imposer un sens doctrinal.
