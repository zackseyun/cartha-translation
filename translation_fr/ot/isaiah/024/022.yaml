    rationale: « Ils feront l’objet d’une intervention » est une paraphrase vague et ne permet pas au lecteur de voir le sens plus général de « être visité / pris en compte ». Une note avec « ils seront visités » préserve mieux l’ambiguïté du niphal de פקד.
  - severity: low
    issue: « Châtiés » est plus marqué que nécessaire en français moderne.
    rationale: Le terme peut suggérer une correction disciplinaire et possède une coloration plus littéraire ou religieuse. « Punis » exprime clairement la lecture judiciaire probable sans ajouter cette nuance.
