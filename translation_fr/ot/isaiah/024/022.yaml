  text: וְ/אֻסְּפ֨וּ אֲסֵפָ֤ה אַסִּיר֙ עַל בּ֔וֹר וְ/סֻגְּר֖וּ עַל מַסְגֵּ֑ר וּ/מֵ/רֹ֥ב יָמִ֖ים יִפָּקֵֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
translation:
  language: fr
  text: Ils seront rassemblés comme des prisonniers dans une fosse, puis enfermés dans une prison ; après de nombreux jours, ils seront punis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils seront visités ». Le verbe hébreu peut désigner le fait d’être visité, pris en compte ou appelé à rendre des comptes ; dans ce contexte de jugement, le sens « punis » est le plus probable.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  choice: Ils seront rassemblés
  rationale: Le passif pluriel et la construction intensive avec le nom apparenté expriment un rassemblement collectif ; le français naturel porte cette intensité par « rassemblés ».
- source_word: אַסִּיר
  choice: comme des prisonniers
  rationale: Le singulier morphologique a ici une valeur collective après le verbe pluriel ; « comme des prisonniers » conserve la comparaison sans imposer une identité plus précise.
- source_word: עַל בּוֹר
  choice: dans une fosse
  rationale: Dans ce contexte d’enfermement, עַל indique la mise ou le maintien dans la fosse. « Dans une fosse » restitue clairement l’image sans surtraduire le mouvement.
- source_word: וְסֻגְּרוּ עַל מַסְגֵּר
  choice: puis enfermés dans une prison
  rationale: Le passif de סגר décrit la réclusion, et מַסְגֵּר un lieu de détention. « Puis » rend naturellement la progression des deux propositions coordonnées.
- source_word: וּמֵרֹב יָמִים
  choice: après bien des jours
  rationale: L’expression idiomatique marque l’écoulement d’une longue période ; cette formulation reste proche de l’image hébraïque tout en étant naturelle en français.
- source_word: יִפָּקֵדוּ
  choice: ils seront châtiés
  rationale: Le niphal de פקד peut désigner le fait d’être l’objet d’une intervention ou d’une reddition de comptes. Dans cet oracle de jugement, « châtiés » exprime la valeur punitive probable, tandis que l’ambiguïté lexicale est signalée en note.
theological_decisions:
- issue: Sens de יִפָּקֵדוּ dans le contexte du jugement
  choice: ils seront châtiés
  alternative: ils feront l’objet d’une intervention / on s’occupera d’eux
  rationale: L’enchaînement rassemblement, emprisonnement, puis intervention ultérieure favorise un sens punitif. Comme פקד demeure plus large en hébreu, la note préserve cette indétermination au lieu de la dissimuler.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme carcéral et évite aussi bien l’archaïsme « cachot » qu’une précision doctrinale absente du texte.
