  variant: modern international French
source:
  edition: WLC
  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
translation:
  language: fr
  text: Et il arrivera que celui qui fuira le bruit de l’épouvante tombera dans la fosse, et que celui qui remontera du fond de la fosse sera pris au piège. En effet, les fenêtres d’en haut[a] s’ouvrent, et les fondations de la terre tremblent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les écluses du ciel ». L’hébreu dit plus littéralement : « les fenêtres d’en haut ».'
    reason: Variante lexicale et explicitation de l’image hébraïque.
lexical_decisions:
- source_word: וְהָיָה
  choice: Et il arrivera que
  rationale: Cette tournure française actuelle conserve la valeur introductive et prospective de la formule hébraïque.
- source_word: הַנָּס מִקּוֹל הַפַּחַד
  choice: celui qui fuira le bruit de l’épouvante
  rationale: Le participe substantivé est rendu par « celui qui », tandis que « bruit » conserve le sens auditif de קוֹל et « épouvante » la force de פַּחַד.
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: tombera dans la fosse
  rationale: « Fosse » exprime le piège creusé désigné par פַּחַת et reste distinct du piège de la proposition suivante.
- source_word: וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת
  choice: et que celui qui remontera du fond de la fosse
  rationale: « Remontera » rend naturellement le mouvement ascendant de עלה; « du fond de » restitue idiomatiquement מִתּוֹךְ dans ce contexte.
- source_word: יִלָּכֵד בַּפָּח
  choice: sera pris au piège
  rationale: Cette expression française claire conserve l’image concrète de פַּח et le jeu sonore hébreu entre פַּחַת et פַּח.
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  choice: les fenêtres d’en haut
  rationale: Ce choix suit de près l’image hébraïque, sans préciser « ciel » dans le corps du texte; la formulation plus traditionnelle figure en note.
- source_word: נִפְתָּחוּ
  choice: s’ouvrent
  rationale: Le présent de narration prophétique donne à la scène sa vivacité et exprime naturellement en français l’ouverture des fenêtres.
- source_word: וַיִּרְעֲשׁוּ
  choice: tremblent
  rationale: Le présent s’accorde à la représentation vive de la proposition précédente et rend le mouvement sismique du verbe.
- source_word: מוֹסְדֵי אָרֶץ
  choice: les fondations de la terre
  rationale: « Fondations » conserve la métaphore architecturale; « terre » convient au cadre cosmique du passage.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: terre
  alternative: pays
  rationale: Le contexte d’Ésaïe 24 présente un jugement d’ampleur cosmique; « terre » convient donc mieux, sans imposer une lecture confessionnelle.
- issue: Image de אֲרֻבּוֹת מִמָּרוֹם
  choice: les fenêtres d’en haut
  alternative: les écluses du ciel
  rationale: La traduction principale préserve la formulation imagée et l’indétermination de l’hébreu; la lecture traditionnelle, évocatrice du déluge, est signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et la succession inéluctable de la fosse et du piège sont conservés. Le marqueur de note est placé sur l’expression qu’il explique.
