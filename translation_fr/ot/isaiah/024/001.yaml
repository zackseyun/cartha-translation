source:
  edition: WLC
  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
translation:
  language: fr
  text: Voici que Yahweh vide la terre[a] et la dévaste ; il en déforme la surface[b] et en disperse les habitants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ». Le mot hébreu peut avoir les deux sens, mais le contexte élargi favorise ici « la terre ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son visage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire solennellement l’attention sur l’annonce prophétique tout en restant naturelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בּוֹקֵק
  choice: vide
  rationale: Le participe décrit une action imminente présentée comme en cours et conserve l’image concrète d’une terre vidée.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre ou un pays ; le cadre élargi d’Ésaïe 24 favorise ici la portée universelle, sans supprimer l’autre possibilité.
- source_word: וּבֹלְקָהּ
  choice: et la dévaste
  rationale: Le verbe rare forme avec בּוֹקֵק un jeu sonore difficile à reproduire ; « dévaste » rend clairement l’intensification et le résultat destructeur.
- source_word: וְעִוָּה
  choice: bouleverse
  rationale: Le verbe évoque le fait de tordre, déformer ou renverser. « Bouleverse » s’applique naturellement à la surface terrestre sans préciser indûment la forme exacte de l’altération.
- source_word: פָנֶיהָ
  choice: sa surface
  rationale: Littéralement « son visage » ; appliqué à la terre, l’expression désigne idiomatiquement sa surface.
- source_word: וְהֵפִיץ
  choice: disperse
  rationale: Le terme exprime la dissémination des personnes ; « disperse » est idiomatique et conserve la force du jugement.
- source_word: יֹשְׁבֶיהָ
  choice: ses habitants
  rationale: Le participe substantivé désigne collectivement ceux qui habitent la terre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le mot autorise les deux sens. Le contexte du chapitre favorise une portée universelle, mais l’ambiguïté lexicale authentique est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent prophétique conserve l’aspect vif des formes hébraïques. La répétition des pronoms « la / en » maintient la terre comme référent sans lourdeur excessive ; le jeu sonore hébreu entre בּוֹקֵק et בֹלְקָהּ ne peut être reproduit naturellement.
