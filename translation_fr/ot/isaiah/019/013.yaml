id: ISA.19.13
reference: Isaiah 19:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
translation:
  language: fr
  text: Les princes de Tsoan sont devenus insensés ; les princes de Nof[a] ont été trompés. Ils ont égaré l’Égypte, eux qui sont la pierre angulaire de ses tribus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof est le nom hébreu de Memphis.
    reason: Identification du nom de lieu pour les lecteurs modernes.
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  choice: sont devenus insensés
  rationale: Le niphal de יאל exprime ici l’entrée dans un état de folie ou le fait de se révéler insensé. Cette formulation conserve la valeur résultative du verbe.
- source_word: שָׂרֵי
  choice: les princes
  rationale: שַׂר désigne des dirigeants ou hauts responsables. « Princes » convient au registre politique et prophétique du passage.
- source_word: צֹעַן
  choice: Tsoan
  rationale: Transcription française usuelle du nom hébreu de cette ville égyptienne.
- source_word: נִשְּׁאוּ
  choice: ont été trompés
  rationale: Le niphal de נשׁא est compris ici au sens d’être trompé ou abusé, en parallèle avec la folie des dirigeants et avec l’égarement qu’ils causent ensuite.
- source_word: נֹף
  choice: Nof
  rationale: Transcription proche de la forme hébraïque ; l’identification traditionnelle à Memphis est indiquée en note.
- source_word: הִתְעוּ
  choice: ont égaré
  rationale: 'Le hiphil de תעה a une valeur causative : ces dirigeants ont fait dévier l’Égypte. « Ont égaré » rend cette force avec concision en français.'
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Désignation française courante du pays.
- source_word: פִּנַּת
  choice: la pierre angulaire
  rationale: Le mot signifie littéralement « angle » et peut désigner métaphoriquement la pierre principale qui soutient l’ensemble ; l’image caractérise ici l’élite dirigeante.
- source_word: שְׁבָטֶיהָ
  choice: ses tribus
  rationale: שֵׁבֶט peut désigner une tribu ou un groupe constitutif. Le suffixe féminin renvoie à l’Égypte ; « ses tribus » conserve directement la formulation hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec maintien du parallélisme prophétique. Le nom hébreu Nof est conservé dans le texte et expliqué en note. L’apposition finale garde la métaphore architecturale et la tension du singulier collectif appliqué aux dirigeants.
