source:
  edition: WLC
  text: וּ/בֹ֛שׁוּ עֹבְדֵ֥י פִשְׁתִּ֖ים שְׂרִיק֑וֹת וְ/אֹרְגִ֖ים חוֹרָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
translation:
  language: fr
  text: Ceux qui travaillent le lin peigné[a] seront couverts de honte, ainsi que ceux qui tissent des étoffes blanches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lin fin ». Le terme hébreu désigne probablement du lin de qualité, spécialement préparé.
    reason: lexical_alternative
  - marker: b
    text: Ou « du lin blanc » ou « des étoffes blanchies ». Le terme hébreu est rare et son sens précis reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: seront couverts de honte
  rationale: Le verbe בוש exprime la honte ou l’humiliation causée par l’échec et la ruine. Cette tournure française en conserve la force dans le contexte du désastre économique annoncé.
- source_word: עֹבְדֵי
  choice: ceux qui travaillent
  rationale: Le participe désigne les personnes qui exercent ce métier ou transforment cette matière; la formulation est naturelle et maintient le parallélisme professionnel.
- source_word: פִשְׁתִּים
  choice: le lin
  rationale: Le nom désigne directement le lin, plante ou matière première dont on fabrique la toile, plutôt que le produit fini.
- source_word: שְׂרִיקוֹת
  choice: peigné
  rationale: Ce terme rare et difficile semble qualifier un lin spécialement préparé, probablement peigné ou de qualité supérieure. « Peigné » conserve le contexte de la transformation textile sans réduire le mot à une simple appréciation de qualité.
- source_word: וְאֹרְגִים
  choice: ainsi que ceux qui tissent
  rationale: Le participe de ארג désigne les tisserands. La proposition relative reproduit naturellement en français le parallélisme avec le premier groupe de travailleurs.
- source_word: חוֹרָי
  choice: des étoffes blanches
  rationale: Le terme est traditionnellement associé à la blancheur et paraît désigner une matière textile blanche ou blanchie. « Étoffes blanches » reste clair sans préciser indûment qu’il s’agit nécessairement de lin.
theological_decisions: []
