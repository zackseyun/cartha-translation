  source_fidelity: La traduction rend fidèlement la construction causative de וְסִכְסַכְתִּי et son sens de conflit interne. « les Égyptiens les uns contre les autres » explicite de façon justifiée le collectif מִצְרַיִם, tandis que la note conserve la formulation littérale « l’Égypte contre l’Égypte ». La série distributive « chacun contre son frère, chacun contre son prochain » correspond à אִישׁ… וְאִישׁ, et le parallélisme final « ville contre ville, royaume contre royaume » est préservé.
