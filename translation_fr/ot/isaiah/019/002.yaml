id: ISA.19.2
reference: Isaiah 19:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/סִכְסַכְתִּ֤י מִצְרַ֨יִם֙ בְּ/מִצְרַ֔יִם וְ/נִלְחֲמ֥וּ אִישׁ בְּ/אָחִ֖י/ו וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ עִ֣יר בְּ/עִ֔יר מַמְלָכָ֖ה בְּ/מַמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
translation:
  language: fr
  text: Je dresserai les Égyptiens les uns contre les autres[a] ; ils se battront, chacun contre son frère, chacun contre son prochain, ville contre ville, royaume contre royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Je dresserai l’Égypte contre l’Égypte » ; le nom du pays désigne ici collectivement les Égyptiens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִכְסַכְתִּי
  choice: Je dresserai … les uns contre les autres
  rationale: Le verbe exprime l’action de provoquer un conflit interne ou de jeter des parties les unes contre les autres. Cette tournure française conserve clairement la valeur causative.
- source_word: מִצְרַיִם בְּמִצְרַיִם
  choice: les Égyptiens les uns contre les autres
  rationale: Le texte répète littéralement le nom « Égypte », employé collectivement. Le contexte de lutte entre personnes et groupes montre qu’il s’agit d’un conflit interne entre Égyptiens.
- source_word: וְנִלְחֲמוּ
  choice: ils se battront
  rationale: Le pluriel hébreu décrit un affrontement réciproque. « Se battront » est naturel en français moderne et reste assez large pour couvrir le conflit civil évoqué.
- source_word: אִישׁ … וְאִישׁ
  choice: chacun … chacun
  rationale: אִישׁ a ici une valeur distributive ; il ne met pas spécialement l’accent sur le sexe masculin. La répétition de « chacun » rend cette distribution avec naturel.
- source_word: בְּאָחִיו
  choice: contre son frère
  rationale: « Frère » conserve l’image familiale forte du texte et souligne la désagrégation des liens les plus proches.
- source_word: בְּרֵעֵהוּ
  choice: contre son prochain
  rationale: רֵעַ peut désigner un ami, un compagnon ou un proche. « Prochain » préserve une certaine largeur de sens et marque l’élargissement du conflit au-delà de la famille.
- source_word: עִיר בְּעִיר
  choice: ville contre ville
  rationale: La formulation concise reproduit le parallélisme et le passage des individus aux collectivités urbaines.
- source_word: מַמְלָכָה בְּמַמְלָכָה
  choice: royaume contre royaume
  rationale: « Royaume » est l’équivalent courant de מַמְלָכָה et maintient l’escalade politique qui clôt le verset.
theological_decisions:
- issue: Valeur collective du nom מִצְרַיִם dans un contexte de guerre civile
  choice: les Égyptiens les uns contre les autres
  alternative: l’Égypte contre l’Égypte
  rationale: La traduction explicite les acteurs humains que le nom national désigne collectivement, tandis qu’une note conserve la forme littérale et son effet rhétorique.
- issue: Valeur distributive de אִישׁ
  choice: chacun … chacun
  alternative: un homme … un homme
  rationale: Dans cette construction, אִישׁ répartit l’action entre les individus plutôt qu’il ne souligne leur masculinité. « Chacun » rend cette fonction sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme bref de la seconde moitié est conservé, ainsi que la progression du conflit depuis la famille et le voisinage jusqu’aux villes et aux royaumes.
