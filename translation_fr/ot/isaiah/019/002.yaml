  terminology: « Égyptiens », « frère », « prochain », « ville » et « royaume » sont exacts et cohérents. « Prochain » rend bien la largeur possible de רֵעַ dans ce contexte, sans restreindre indûment le terme à « ami » ou lui imposer un sens théologique technique.
