id: ISA.19.17
reference: Isaiah 19:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הָיְתָה אַדְמַ֨ת יְהוּדָ֤ה לְ/מִצְרַ֨יִם֙ לְ/חָגָּ֔א כֹּל֩ אֲשֶׁ֨ר יַזְכִּ֥יר אֹתָ֛/הּ אֵלָ֖י/ו יִפְחָ֑ד מִ/פְּנֵ֗י עֲצַת֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא יוֹעֵ֥ץ עָלָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
translation:
  language: fr
  text: Le pays de Juda deviendra un sujet d’effroi pour l’Égypte[a]. Quiconque en entendra parler prendra peur à cause du projet que Yahvé des armées forme contre elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « une terreur », « un objet d’horreur » ou, selon une autre interprétation, « une cause de vertige ». Le terme hébreu est rare et difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  choice: le pays de Juda
  rationale: Dans ce contexte géopolitique, אַדְמָה désigne naturellement le territoire de Juda plutôt que son sol au sens matériel.
- source_word: לְמִצְרַיִם לְחָגָּא
  choice: un sujet d’effroi pour l’Égypte
  rationale: Le nom rare חַגָּא est éclairé par le verbe « prendre peur » dans la proposition suivante. « Sujet d’effroi » exprime naturellement ce que Juda deviendra pour l’Égypte sans masquer la difficulté lexicale, signalée en note.
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  choice: quiconque en entendra parler
  rationale: 'La construction hébraïque est condensée et distributive : toute personne à qui Juda sera mentionné aura peur. Cette formulation française restitue ce sens sans lourdeur.'
- source_word: יִפְחָד
  choice: prendra peur
  rationale: Rend directement פחד et évite la répétition stylistique d’« effroi » tout en conservant le lien sémantique.
- source_word: מִפְּנֵי עֲצַת
  choice: à cause du projet
  rationale: מִפְּנֵי exprime ici la cause, et עֵצָה la résolution ou le dessein divin; « projet » est clair et actuel.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Le nom divin est rendu explicitement par « Yahvé », tandis que צְבָאוֹת est traduit par « des armées », expression transparente en français moderne.
- source_word: אֲשֶׁר הוּא יוֹעֵץ עָלָיו
  choice: que … forme contre elle
  rationale: Le participe יוֹעֵץ présente le projet en cours de conception ou comme intention arrêtée. Le pronom final renvoie à l’Égypte, féminin en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: « Yahvé » représente directement le tétragramme et suit l’orientation fournie, sans remplacer le nom propre par un titre.
- issue: Traduction du titre צְבָאוֹת
  choice: des armées
  alternative: de l’univers / des puissances
  rationale: « Des armées » conserve l’image concrète et la force du titre hébreu sans imposer une interprétation limitée aux armées terrestres.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe condensée de l’hébreu est légèrement explicitée, tandis que l’incertitude du terme חַגָּא est conservée en note.
