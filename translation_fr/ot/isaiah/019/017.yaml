  source_fidelity: 'Le texte rend fidèlement les relations essentielles du verset : le pays de Juda devient pour l’Égypte un objet de peur, toute personne qui en entend parler éprouve de la crainte, et cette crainte est motivée par le dessein de Yahvé des armées contre l’Égypte. « Quiconque en entendra parler » restitue de manière idiomatique la construction distributive hébraïque condensée, sans prétendre résoudre au-delà du nécessaire sa formulation exacte.'
