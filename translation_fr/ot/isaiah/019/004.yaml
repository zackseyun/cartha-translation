  text: וְ/סִכַּרְתִּי֙ אֶת מִצְרַ֔יִם בְּ/יַ֖ד אֲדֹנִ֣ים קָשֶׁ֑ה וּ/מֶ֤לֶךְ עַז֙ יִמְשָׁל בָּ֔/ם נְאֻ֥ם הָ/אָד֖וֹן יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
translation:
  language: fr
  text: Je livrerai l’Égypte au pouvoir d’un maître dur[a], et un roi puissant régnera sur eux, — déclaration du Seigneur, Yahweh des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu traduit par « maître » est de forme plurielle, mais l’adjectif qui l’accompagne est au singulier. Il désigne vraisemblablement ici un seul souverain, en parallèle avec « un roi » dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « le Seigneur, l’Éternel des armées » ou « le Seigneur, l’Éternel des puissances ». Le texte hébreu emploie le nom divin Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  choice: Je livrerai
  rationale: Dans ce contexte, le verbe exprime la remise de l’Égypte au pouvoir d’un autre. « Livrer » rend directement cette idée en français naturel.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: Littéralement « dans la main de » ; l’expression hébraïque désigne ici l’autorité ou la domination exercée sur quelqu’un. Le français idiomatique « au pouvoir de » en restitue clairement le sens.
- source_word: אֲדֹנִים קָשֶׁה
  choice: un maître impitoyable
  rationale: אֲדֹנִים est morphologiquement pluriel, mais le contexte, notamment le roi et le verbe au singulier dans la proposition suivante, favorise une référence singulière. « Impitoyable » exprime ici la dureté oppressive de קָשֶׁה.
- source_word: וּמֶלֶךְ עַז
  choice: et un roi redoutable
  rationale: עַז peut évoquer la force, la puissance ou la violence. Dans ce contexte de jugement et en parallèle avec un maître impitoyable, « redoutable » préserve cette amplitude sans réduire le terme à la seule cruauté.
- source_word: יִמְשָׁל בָּם
  choice: dominera sur eux
  rationale: Le verbe משל avec ב exprime l’exercice du pouvoir sur des personnes. « Dominera sur eux » convient au contexte oppressif tout en maintenant le pronom pluriel hébreu, qui renvoie aux Égyptiens.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Cette formule prophétique introduit solennellement l’auteur divin de l’oracle. « Déclaration de » conserve son caractère nominal et autoritatif.
- source_word: הָאָדוֹן
  choice: le Seigneur
  rationale: Le titre divin avec article est naturellement rendu par « le Seigneur » et reste distinct du maître humain mentionné auparavant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin du texte hébreu au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: le Dieu des armées
  rationale: Dans la formule divine, « le Dieu des armées » est un français clair et digne qui explicite la relation implicite du titre hébreu tout en conservant son imagerie militaire.
theological_decisions:
- issue: Séquence du titre divin הָאָדוֹן יְהוָה צְבָאוֹת
  choice: le Seigneur, Yahweh, le Dieu des armées
  alternative: le Seigneur, Yahweh des armées
  rationale: La formulation distingue le titre הָאָדוֹן du nom propre יְהוָה et rend צְבָאוֹת intelligible en français. La solution retenue évite l’expression peu naturelle « Yahweh des armées » sans substituer un titre au nom divin.
- issue: Nombre grammatical de אֲדֹנִים
  choice: 'singulier : « un maître »'
  alternative: 'pluriel : « des maîtres »'
  rationale: Bien que le substantif ait une forme plurielle, l’adjectif קָשֶׁה est singulier et le parallélisme avec « un roi redoutable » suivi d’un verbe singulier indique qu’un seul dominateur est visé. Une note conserve l’information morphologique.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Livrer au pouvoir de » restitue naturellement l’idiome hébreu ; « dominera sur eux » conserve le passage de l’Égypte collective aux Égyptiens désignés au pluriel. La ponctuation détache la formule prophétique finale.
