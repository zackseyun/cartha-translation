  text: בַּ/יּ֣וֹם הַ/ה֗וּא תִּהְיֶ֨ה מְסִלָּ֤ה מִ/מִּצְרַ֨יִם֙ אַשּׁ֔וּרָ/ה וּ/בָֽא אַשּׁ֥וּר בְּ/מִצְרַ֖יִם וּ/מִצְרַ֣יִם בְּ/אַשּׁ֑וּר וְ/עָבְד֥וּ מִצְרַ֖יִם אֶת אַשּֽׁוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
translation:
  language: fr
  text: En ce jour-là, il y aura une grande route reliant l’Égypte à l’Assyrie. Les Assyriens iront en Égypte, et les Égyptiens iront en Assyrie[a] ; les Égyptiens serviront les Assyriens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu sous-entend le verbe dans la seconde proposition : « et les Égyptiens [iront] en Assyrie ».'
    reason: ellipse_explicitée
  - marker: b
    text: 'Ou, selon une compréhension du contexte : « les Égyptiens serviront avec les Assyriens », c’est-à-dire dans un service commun, vraisemblablement rendu à Dieu. L’hébreu porte littéralement : « les Égyptiens serviront les Assyriens ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מְסִלָּה
  choice: grande route
  rationale: Le nom désigne une voie aménagée, souvent surélevée. « Grande route » est naturel en français moderne et conserve l’image d’une liaison ouverte entre les nations.
- source_word: מִמִּצְרַיִם אַשּׁוּרָה
  choice: reliant l’Égypte à l’Assyrie
  rationale: Le texte indique un trajet depuis l’Égypte en direction de l’Assyrie. Cette formulation française exprime clairement la liaison entre les deux pays sans alourdir la phrase.
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  choice: Les Assyriens iront en Égypte
  rationale: Le verbe בוא suivi de ב exprime ici l’entrée ou le déplacement dans un territoire. Le nom collectif du pays est rendu par ses habitants, sens requis par l’action d’aller.
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  choice: et les Égyptiens en Assyrie
  rationale: L’hébreu omet le verbe dans cette proposition parallèle. L’ellipse est naturelle en français et conserve le rythme du texte.
- source_word: וְעָבְדוּ
  choice: serviront
  rationale: עבד peut désigner le service en général ou le culte. « Serviront » préserve cette amplitude sémantique sans limiter explicitement le sens à l’adoration.
- source_word: מִצְרַיִם אֶת־אַשּׁוּר
  choice: les Égyptiens serviront avec les Assyriens
  rationale: Bien que אֵת marque normalement un complément d’objet direct, le contexte des versets 24-25 présente les deux peuples unis et bénis. Le texte principal exprime donc leur service commun, tandis qu’une note conserve la lecture syntaxiquement plus directe.
theological_decisions:
- issue: Sens de וְעָבְדוּ מִצְרַיִם אֶת־אַשּׁוּר
  choice: les Égyptiens serviront avec les Assyriens
  alternative: les Égyptiens serviront les Assyriens
  rationale: La syntaxe immédiate permet de comprendre l’Assyrie comme objet du service. Cependant, le contexte proche décrit la réconciliation de l’Égypte et de l’Assyrie sous la bénédiction de l’Éternel, ce qui favorise l’idée d’un service commun. Le choix de « servir » maintient ouverte la dimension cultuelle possible, et la note préserve la tension grammaticale réelle.
translation_notes:
  register: Français international moderne, clair et digne. Les noms de pays sont rendus par les noms de peuples lorsqu’ils accomplissent une action humaine. L’ellipse parallèle est conservée, et l’ambiguïté de la dernière proposition est signalée plutôt que résolue silencieusement.
