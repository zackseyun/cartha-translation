source:
  edition: WLC
  text: וְ/אָנוּ֙ הַ/דַּיָּגִ֔ים וְ/אָ֣בְל֔וּ כָּל מַשְׁלִיכֵ֥י בַ/יְא֖וֹר חַכָּ֑ה וּ/פֹרְשֵׂ֥י מִכְמֹ֛רֶת עַל פְּנֵי מַ֖יִם אֻמְלָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/008.yaml
  text: And the fishermen will lament[a], and all who cast a hook into the Nile will mourn[b]; those who spread a net over the waters will waste away.
translation:
  language: fr
  text: Les pêcheurs se lamenteront, tous ceux qui jettent l’hameçon dans le Nil[a] seront dans le deuil, et ceux qui déploient des filets à la surface des eaux dépériront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le fleuve » ; dans ce contexte égyptien, le terme hébreu désigne généralement le Nil.
    reason: lexical_alternative
  - marker: b
    text: Ou « languiront ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנוּ
  choice: se lamenteront
  rationale: Le verbe exprime les gémissements ou la lamentation causés par le chagrin. Le futur convient au contexte prophétique.
- source_word: הַדַּיָּגִים
  choice: les pêcheurs
  rationale: Ce nom désigne les personnes dont l’activité est la pêche; « pêcheurs » est le terme français courant.
- source_word: וְאָבְלוּ
  choice: seront dans le deuil
  rationale: Le verbe אבל exprime le deuil et l’affliction. Cette formulation préserve la distinction avec le verbe précédent sans alourdir le parallélisme.
- source_word: כָּל מַשְׁלִיכֵי
  choice: tous ceux qui jettent
  rationale: Le participe désigne une catégorie de personnes par leur activité habituelle; cette tournure est naturelle en français.
- source_word: בַיְאֹר
  choice: dans le Nil
  rationale: Dans cet oracle concernant l’Égypte, יְאֹר désigne le Nil ou ses bras et canaux. « Le Nil » rend le référent immédiatement clair, tandis qu’une note conserve l’alternative plus générale.
- source_word: חַכָּה
  choice: l’hameçon
  rationale: Le nom désigne précisément un crochet employé pour pêcher; « hameçon » est idiomatique et explicite en français.
- source_word: וּפֹרְשֵׂי
  choice: ceux qui déploient
  rationale: Le participe décrit l’action d’étendre du matériel de pêche. « Déploient » convient naturellement à des filets.
- source_word: מִכְמֹרֶת
  choice: des filets
  rationale: Le terme désigne un filet de pêche. Le pluriel générique est naturel en français pour décrire l’activité de ces pêcheurs.
- source_word: עַל פְּנֵי מַיִם
  choice: à la surface des eaux
  rationale: La formulation conserve l’image hébraïque de la « face des eaux » dans un français actuel et digne.
- source_word: אֻמְלָלוּ
  choice: dépériront
  rationale: La forme verbale évoque l’affaiblissement, le flétrissement ou le fait de languir. « Dépériront » exprime avec concision leur déclin profond.
theological_decisions: []
