id: ISA.19.6
reference: Isaiah 19:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֶאֶזְנִ֣יחוּ נְהָר֔וֹת דָּלֲל֥וּ וְ/חָרְב֖וּ יְאֹרֵ֣י מָצ֑וֹר קָנֶ֥ה וָ/ס֖וּף קָמֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
translation:
  language: fr
  text: Les cours d’eau deviendront infects[a] ; les canaux d’Égypte[b] baisseront et s’assécheront ; roseaux et joncs[c] se flétriront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mettront à puer ». Le verbe hébreu est rare et indique que les eaux deviennent nauséabondes ou putrides.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les canaux de Matsor » ; « Matsor » est ici vraisemblablement une désignation poétique de l’Égypte.'
    reason: lexical_alternative
  - marker: c
    text: Ou « papyrus ». Le terme hébreu désigne une végétation des marais associée aux rives.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִיחוּ
  choice: deviendront infects
  rationale: Le verbe rare évoque vraisemblablement des eaux devenues nauséabondes ou putrides. Cette formulation naturelle conserve l’idée sans imposer exclusivement celle d’une odeur.
- source_word: נְהָרוֹת
  choice: les cours d’eau
  rationale: Le terme désigne des rivières ou des cours d’eau. Ici, « cours d’eau » convient à la pluralité du réseau hydraulique et se distingue des canaux mentionnés ensuite.
- source_word: דָּלֲלוּ
  choice: baisseront
  rationale: Le verbe exprime l’amoindrissement. Appliqué aux eaux des canaux, « baisseront » rend naturellement la diminution de leur niveau ou de leur débit.
- source_word: וְחָרְבוּ
  choice: s’assécheront
  rationale: Le verbe désigne le dessèchement ; la forme pronominale est idiomatique en français pour des cours d’eau.
- source_word: יְאֹרֵי
  choice: les canaux
  rationale: Dans un contexte égyptien, le mot renvoie aux bras ou canaux liés au Nil. « Canaux » est clair et précis sans ajouter explicitement le Nil.
- source_word: מָצוֹר
  choice: d’Égypte
  rationale: Dans ce contexte, le terme est le mieux compris comme une désignation poétique de l’Égypte plutôt que comme le nom commun « siège ».
- source_word: קָנֶה
  choice: roseaux
  rationale: Le mot désigne les roseaux ou cannes poussant au bord de l’eau ; « roseaux » est le terme français courant et adapté.
- source_word: וָסוּף
  choice: joncs
  rationale: Le mot désigne une végétation de marais. « Joncs » maintient la distinction avec les roseaux, tandis que « papyrus » serait une identification plus précise mais moins certaine.
- source_word: קָמֵלוּ
  choice: se flétriront
  rationale: Le verbe décrit le dépérissement de végétaux. « Se flétriront » évite de répéter « s’assécheront » et convient aux plantes.
