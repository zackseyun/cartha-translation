source:
  edition: WLC
  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
translation:
  language: fr
  text: Où sont donc tes sages ? Qu’ils te le disent donc ! Qu’ils sachent ce que Yahweh des armées a décidé contre l’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיָּם אֵפוֹא חֲכָמֶיךָ
  choice: Où sont-ils donc, tes sages ?
  rationale: La tournure française avec reprise pronominale rend naturellement l’interrogation de lieu et conserve la force railleuse de אֵפוֹא (« donc »).
- source_word: וְיַגִּידוּ נָא לָךְ
  choice: Qu’ils te disent, je te prie
  rationale: Le subjonctif restitue la valeur jussive; « je te prie » rend נָא comme une invitation insistante et ironique plutôt que comme une demande réellement courtoise.
- source_word: וְיֵדְעוּ
  choice: qu’ils sachent
  rationale: 'Traduction directe du jussif de ידע, maintenue malgré sa tension avec « qu’ils te disent » : les sages sont sommés à la fois de connaître et d’exposer le dessein divin.'
- source_word: מַה יָּעַץ
  choice: ce que … a décidé
  rationale: יעץ désigne ici un dessein arrêté après délibération. « A décidé » est actuel, clair et conserve le caractère déterminé du projet.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, tandis que צְבָאוֹת est traduit par le titre français intelligible « des armées », qui préserve sa dimension militaire.
- source_word: עַל מִצְרָיִם
  choice: contre l’Égypte
  rationale: Dans ce contexte de jugement, עַל exprime la visée hostile du dessein, plutôt que le sens plus neutre « au sujet de ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; sa translittération le distingue d’un simple titre.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées / le SEIGNEUR de l’univers
  rationale: « Des armées » traduit concrètement צְבָאוֹת sans élargir le titre en « univers », notion qui n’est pas exprimée lexicalement ici.
- issue: Force de עַל avec יָעַץ
  choice: contre l’Égypte
  alternative: au sujet de l’Égypte
  rationale: Le contexte judiciaire favorise une décision dirigée contre l’Égypte, tout en reconnaissant que la préposition peut ailleurs être plus neutre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement singulier reflète les suffixes de deuxième personne masculine singulière, qui apostrophent probablement l’Égypte personnifiée ou son dirigeant. La légère rudesse de « qu’ils sachent » est conservée afin de ne pas effacer le parallélisme et la tension rhétorique de l’hébreu.
