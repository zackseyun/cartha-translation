revisions:
- from: Où sont-ils donc, tes sages ? Qu’ils te disent, je te prie, qu’ils sachent ce que Yahweh des armées a décidé contre l’Égypte.
  to: Où sont donc tes sages ? Qu’ils te le disent donc ! Qu’ils sachent ce que Yahweh des armées a décidé contre l’Égypte.
  rationale: La révision conserve le sens et les choix terminologiques du projet, tout en distinguant explicitement les deux jussifs hébreux. Le pronom cataphorique « le » renvoie au dessein divin précisé immédiatement après; il permet à « te dire » de rester naturel en français sans transformer « qu’ils sachent » en proposition subordonnée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le premier membre rend correctement l’interrogation railleuse « Où donc sont tes sages ? ». Le titre « Yahweh des armées », le parfait de dessein arrêté (« a décidé ») et « contre l’Égypte » sont des rendus défendables dans le contexte de jugement. En revanche, la ponctuation actuelle subordonne facilement « qu’ils sachent » à « qu’ils te disent » (« qu’ils te disent [...] qu’ils sachent »), alors que l’hébreu coordonne deux jussifs : qu’ils parlent, puis qu’ils sachent/discernent le dessein de Yahweh.'
  naturalness: « Où sont-ils donc, tes sages ? » est grammatical, mais « Où sont donc tes sages ? » est plus direct et idiomatique en français moderne. « Je te prie » est peu naturel dans cette apostrophe ironique et peut faire entendre une politesse réelle du locuteur; « donc » restitue mieux l’insistance rhétorique de נא. Deux phrases jussives rendent clairement la coordination sans alourdir le verset.
  terminology: « Sages », « Yahweh des armées », « décidé » et « contre l’Égypte » conviennent à un français international moderne et respectent les choix lexicaux sans introduire d’interprétation confessionnelle.
  issues:
  - severity: medium
    issue: Ambiguïté syntaxique entre les deux jussifs
    rationale: Dans « Qu’ils te disent, je te prie, qu’ils sachent... », le second subjonctif se lit naturellement comme le contenu de ce qu’ils doivent dire. Le texte source coordonne plutôt deux injonctions rhétoriques distinctes.
  - severity: low
    issue: Rendu de נא par « je te prie »
    rationale: Cette formule est plus archaïsante et suggère que le locuteur prie l’interlocuteur. Dans la raillerie du contexte, « donc » exprime plus naturellement l’invite insistante.
  revised_text: Où sont donc tes sages ? Qu’ils te le disent donc ! Qu’ils sachent ce que Yahweh des armées a décidé contre l’Égypte.
