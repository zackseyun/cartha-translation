  text: עָר֥וֹת עַל יְא֖וֹר עַל פִּ֣י יְא֑וֹר וְ/כֹל֙ מִזְרַ֣ע יְא֔וֹר יִיבַ֥שׁ נִדַּ֖ף וְ/אֵינֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/007.yaml
  text: The reeds along the Nile[a], along the bank of the Nile, and every sown field of the Nile will dry up, be driven away[c][b], and be no more.
translation:
  language: fr
  text: Les plantes[a] le long du Nil, sur les rives du Nil, et tout ce qui est semé près du Nil[b] se dessécheront, seront emportés et disparaîtront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du mot hébreu est incertain : il pourrait aussi désigner les prairies, les pâturages ou les espaces découverts qui bordent le Nil.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « toutes les cultures semées au bord du Nil » ou « toutes les terres ensemencées du Nil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹת
  choice: les plantes
  rationale: Le terme hébreu est incertain. Dans ce contexte de dessèchement du Nil, il désigne vraisemblablement la végétation riveraine. « Les plantes » reste naturel sans préciser indûment qu’il s’agit de roseaux.
- source_word: יְאֹר
  choice: le Nil
  rationale: Dans cet oracle concernant l’Égypte, le mot renvoie au Nil ou à son réseau fluvial; « le Nil » explicite naturellement le référent.
- source_word: עַל פִּי יְאֹר
  choice: sur les rives du Nil
  rationale: Littéralement « à la bouche du fleuve »; dans cet emploi spatial, פֶּה désigne le bord ou la rive d’un cours d’eau.
- source_word: מִזְרַע יְאֹר
  choice: tout ce qui est semé près du Nil
  rationale: La construction peut désigner les semences, les cultures ou ce qui est semé en rapport avec le Nil. Cette formulation conserve l’ambiguïté entre produits cultivés et terres ensemencées.
- source_word: יִיבַשׁ
  choice: se dessécheront
  rationale: Le verbe exprime le fait de devenir sec et convient à la fois à la végétation et aux cultures.
- source_word: נִדַּף
  choice: seront emportés
  rationale: La forme passive évoque ce qui est chassé ou emporté, probablement par le vent après s’être desséché.
- source_word: וְאֵינֶנּוּ
  choice: disparaîtront
  rationale: L’expression hébraïque marque l’absence ou la disparition complète. « Disparaîtront » rend cette finalité en français courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression du texte hébreu — dessèchement, emportement, disparition — tout en employant un accord au pluriel naturel avec les éléments énumérés.
