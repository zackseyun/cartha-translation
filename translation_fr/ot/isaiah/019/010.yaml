source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁתֹתֶ֖י/הָ מְדֻכָּאִ֑ים כָּל עֹ֥שֵׂי שֶׂ֖כֶר אַגְמֵי נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/010.yaml
  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
translation:
  language: fr
  text: Ses fondements seront écrasés[a] ; tous ceux qui travaillent pour un salaire auront l’âme abattue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu est difficile. « Ses fondements » peut aussi se comprendre comme « ses piliers » ou « ses soutiens » ; certains proposent « ses tisserands ».
    reason: alternative_reading
  - marker: b
    text: La dernière expression est obscure en hébreu. Littéralement, elle évoque des « étangs de l’âme » ou des « marais du désir vital » ; elle est souvent comprise comme désignant un profond abattement intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁתֹתֶיהָ
  choice: ses fondements
  rationale: Le nom rare et discuté peut désigner ce qui est posé comme base ou soutien. « Ses fondements » convient à l’image de l’effondrement de la structure socio-économique de l’Égypte, tout en conservant les autres possibilités en note.
- source_word: מְדֻכָּאִים
  choice: seront écrasés
  rationale: Le participe passif de דכא exprime l’idée d’être écrasé ou brisé. Le futur français rend ici la portée prophétique de וְהָיוּ suivi du prédicat.
- source_word: כָּל
  choice: tous
  rationale: Le sens distributif inclut l’ensemble de la catégorie qui suit.
- source_word: עֹשֵׂי שֶׂכֶר
  choice: ceux qui travaillent pour un salaire
  rationale: Littéralement « ceux qui font un salaire » ; la formulation française exprime naturellement le travail rémunéré sans préciser indûment le métier.
- source_word: אַגְמֵי נָפֶשׁ
  choice: auront l’âme abattue
  rationale: Le texte consonantique donne une expression obscure, littéralement proche de « étangs/marais d’âme ». Le contexte suggère l’accablement intérieur ; la note préserve l’obscurité et les autres valeurs possibles.
theological_decisions: []
