  text: וְ/נָבְקָ֤ה רֽוּחַ מִצְרַ֨יִם֙ בְּ/קִרְבּ֔/וֹ וַ/עֲצָת֖/וֹ אֲבַלֵּ֑עַ וְ/דָרְשׁ֤וּ אֶל הָֽ/אֱלִילִים֙ וְ/אֶל הָ֣/אִטִּ֔ים וְ/אֶל הָ/אֹב֖וֹת וְ/אֶל הַ/יִּדְּעֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
translation:
  language: fr
  text: L’esprit de l’Égypte se videra au-dedans d’elle, et j’engloutirai ses projets ; les Égyptiens consulteront les idoles, ceux qui murmurent[a], les médiums et les spirites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « les charmeurs » ou « les esprits des morts » ; le terme hébreu est rare et son sens demeure incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבְקָה
  choice: se videra
  rationale: Le verbe évoque le fait d’être vidé ou épuisé. « Se videra » conserve l’image concrète de l’effondrement intérieur, sans la réduire à la seule perte de courage.
- source_word: רוּחַ מִצְרַיִם בְּקִרְבּוֹ
  choice: L’esprit de l’Égypte… en son sein
  rationale: « Esprit » préserve l’étendue métaphorique de רוּחַ, tandis que « en son sein » exprime naturellement en français la désagrégation interne de l’Égypte considérée comme une collectivité.
- source_word: עֲצָתוֹ אֲבַלֵּעַ
  choice: j’engloutirai ses projets
  rationale: « Engloutirai » maintient la métaphore concrète de בלע. Dans ce contexte national, « projets » rend עֵצָה plus naturellement que le singulier français « conseil », tout en gardant l’idée de délibération et de stratégie.
- source_word: וְדָרְשׁוּ אֶל
  choice: consulteront
  rationale: Avec les objets occultes qui suivent, דרשׁ אל désigne ici le recours à des puissances ou praticiens pour obtenir une réponse. « Consulteront » rend cette valeur divinatoire plus clairement que « chercheront ».
- source_word: הָאֱלִילִים
  choice: les idoles
  rationale: Traduction directe et courante du terme péjoratif désignant des divinités représentées ou tenues pour sans valeur.
- source_word: הָאִטִּים
  choice: ceux qui murmurent
  rationale: Le terme est rare et incertain. Cette formulation suit son association probable avec des paroles murmurées dans un cadre occulte, sans décider s’il désigne précisément des charmeurs, des évocateurs ou des esprits.
- source_word: הָאֹבוֹת
  choice: les médiums
  rationale: אוֹבוֹת peut désigner les esprits invoqués ou, par métonymie, les personnes qui les évoquent. « Médiums » est clair et actuel dans cette liste de consultations occultes.
- source_word: הַיִּדְּעֹנִים
  choice: les spirites
  rationale: Le terme désigne des personnes associées à une connaissance obtenue par les esprits. « Spirites » est moderne et compréhensible, sans recourir à l’archaïsme « magiciens » ou à une paraphrase doctrinale.
theological_decisions:
- issue: Nature exacte des êtres ou praticiens occultes énumérés
  choice: Employer des termes modernes et directs, tout en signalant l’incertitude du rare הָאִטִּים
  alternative: Uniformiser toute la liste comme des praticiens humains, ou comme des entités spirituelles
  rationale: L’hébreu peut osciller entre les esprits consultés et ceux qui servent d’intermédiaires. La traduction ne doit pas imposer une identification plus précise que le texte, mais elle doit conserver la portée polémique du recours de l’Égypte aux pratiques occultes.
- issue: Sujet implicite du verbe וְדָרְשׁוּ
  choice: Expliciter par « les Égyptiens »
  alternative: Employer simplement « ils »
  rationale: Le pluriel hébreu passe de l’Égypte collective aux membres de son peuple. L’explicitation française évite un pronom sans antécédent pluriel clair, sans modifier le référent.
translation_notes:
  register: Français international moderne, digne et accessible. Les images fortes de l’hébreu (« se videra », « j’engloutirai ») sont conservées, tandis que la syntaxe est rendue naturelle. Le marqueur [a] est placé immédiatement après le terme rare auquel la note se rapporte.
