language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
translation:
  language: fr
  text: Il servira de signe et de témoin pour Yahweh des armées dans le pays d’Égypte. Car ils crieront vers Yahweh à cause de ceux qui les oppriment, et il leur enverra un sauveur et un défenseur[a], puis il les délivrera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un sauveur et un champion », ou, plus littéralement, « un sauveur et un grand personnage ». Le sens du second terme hébreu est difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Il servira
  rationale: Dans le contexte de l’autel et de la stèle du verset précédent, le sujet est singulier et la tournure exprime leur fonction future. « Il servira » est plus naturel en français que le calque « il sera pour ».
- source_word: לְאוֹת וּלְעֵד
  choice: de signe et de témoin
  rationale: « Signe » rend directement אוֹת. « Témoin » conserve la nuance concrète et quasi juridique de עֵד plutôt que de l’abstraire en « témoignage ».
- source_word: לַיהוָה צְבָאוֹת
  choice: pour Yahweh des armées
  rationale: La préposition ל est rendue par « pour ». Le nom divin est translittéré « Yahweh », et צְבָאוֹת est traduit de manière transparente par « des armées ».
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation conserve l’expression géographique complète de l’hébreu.
- source_word: כִּי יִצְעֲקוּ אֶל־יְהוָה
  choice: Car ils crieront vers Yahweh
  rationale: כִּי introduit ici l’explication de la fonction du signe et du témoin. « Crier vers » exprime l’appel pressant adressé à Yahweh.
- source_word: מִפְּנֵי לֹחֲצִים
  choice: à cause de ceux qui les oppriment
  rationale: La locution exprime la cause de leur cri, et le participe substantivé désigne leurs oppresseurs. La formulation développée est claire et naturelle en français.
- source_word: מוֹשִׁיעַ
  choice: un sauveur
  rationale: Le participe hiphil de ישׁע désigne celui qui sauve ou délivre. « Sauveur » garde le lien lexical et thématique avec la délivrance finale.
- source_word: וָרָב
  choice: et un défenseur[a]
  rationale: Le terme est difficile. Dans ce contexte, « défenseur » rend la compréhension fonctionnelle d’un personnage puissant qui prend parti pour les opprimés, sans masquer dans la note la possibilité plus littérale « un grand personnage ».
- source_word: וְהִצִּילָם
  choice: puis il les délivrera
  rationale: Le hiphil de נצל signifie délivrer ou arracher au danger. « Puis » rend naturellement la progression de la phrase sans attribuer plus explicitement que l’hébreu le sujet du verbe.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Rendu de צְבָאוֹת
  choice: des armées
  alternative: de l’univers / des puissances
  rationale: « Des armées » communique directement le sens concret du nom hébreu et évite une expression traditionnelle devenue peu transparente.
- issue: Identification du sujet de וְהִצִּילָם
  choice: maintien du pronom « il »
  alternative: « Yahweh les délivrera » ou « celui-ci les délivrera »
  rationale: L’hébreu ne répète pas le sujet nominal. Le pronom français conserve une certaine ouverture grammaticale au lieu de décider explicitement si l’action est attribuée directement à Yahweh ou au sauveur envoyé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tout en évitant les calques raides. Le marqueur de note est placé après l’expression réellement concernée.
