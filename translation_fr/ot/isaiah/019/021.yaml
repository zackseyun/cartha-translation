source:
  edition: WLC
  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
translation:
  language: fr
  text: Yahweh se fera connaître de l’Égypte[a], et l’Égypte connaîtra Yahweh, en ce jour-là ; les Égyptiens lui rendront un culte par des sacrifices et des offrandes[b], ils feront des vœux à Yahweh et les accompliront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh sera connu de l’Égypte ».'
    reason: Le verbe hébreu peut être compris plus passivement ; le texte principal met en relief le fait que Yahweh se révèle.
  - marker: b
    text: 'Littéralement : « ils serviront par un sacrifice et une offrande ».'
    reason: Le verbe hébreu signifie « servir », mais il désigne ici le culte, comme l’indiquent le sacrifice et l’offrande.
lexical_decisions:
- source_word: וְנוֹדַע
  choice: se fera connaître
  rationale: Le niphal de ידע peut signifier « être connu » ou exprimer ici l’idée de se faire connaître. Cette formulation française naturelle laisse entendre la manifestation divine sans expliciter davantage que l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לְמִצְרַיִם
  choice: de l’Égypte
  rationale: Avec « se faire connaître », le français idiomatique emploie « de » pour désigner ceux à qui Yahweh se révèle ; « à l’Égypte » serait moins naturel dans cette construction.
- source_word: וְיָדְעוּ מִצְרַיִם אֶת־יְהוָה
  choice: et l’Égypte connaîtra Yahweh
  rationale: Le nom du pays représente collectivement ses habitants, comme dans l’hébreu, et la répétition de « connaître » est conservée.
- source_word: בַּיּוֹם הַהוּא
  choice: en ce jour-là
  rationale: Formule prophétique française courante qui restitue précisément l’expression temporelle hébraïque.
- source_word: וְעָבְדוּ
  choice: elle lui rendra un culte
  rationale: עבד signifie servir, mais l’association immédiate aux sacrifices et aux offrandes indique ici le service cultuel. Le pronom « lui » explicite en français le bénéficiaire déjà établi par le contexte.
- source_word: זֶבַח וּמִנְחָה
  choice: par des sacrifices et des offrandes
  rationale: Les termes sont rendus largement sans limiter מנחה à l’offrande végétale, précision que le contexte immédiat n’impose pas.
- source_word: וְנָדְרוּ נֵדֶר
  choice: elle fera des vœux
  rationale: Le cognat accusatif hébreu renforce l’action. Une reproduction littérale comme « vouer des vœux » serait maladroite en français ; le pluriel garde une part de l’insistance.
- source_word: וְשִׁלֵּמוּ
  choice: et les accomplira
  rationale: Avec des vœux, שלם signifie les acquitter ou les accomplir. « Accomplir ses vœux » est clair et idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même ; sa translittération préserve cette donnée sans le remplacer par un titre.
- issue: Valeur cultuelle de עבד
  choice: lui rendra un culte
  alternative: le servira
  rationale: Les sacrifices, les offrandes et les vœux montrent que le service est religieux. « Rendre un culte » rend cette valeur contextuelle tout en évitant d’introduire une forme confessionnelle particulière.
- issue: Agentivité dans וְנוֹדַע
  choice: se fera connaître
  alternative: sera connu
  rationale: Le niphal permet les deux compréhensions. Le texte principal exprime la manifestation de Yahweh, tandis que la note conserve explicitement la lecture passive.
translation_notes:
  register: Français international actuel, digne et accessible. La structure en deux phrases allège la longue coordination hébraïque. Le féminin singulier reprend « l’Égypte » comme entité collective. Tous les marqueurs de notes figurent dans le texte principal.
