  to: Yahweh se fera connaître de l’Égypte[a], et l’Égypte connaîtra Yahweh, en ce jour-là ; les Égyptiens lui rendront un culte par des sacrifices et des offrandes[b], ils feront des vœux à Yahweh et les accompliront.
  rationale: La révision remplace les pronoms féminins singuliers par « les Égyptiens » et des verbes pluriels afin de refléter le pluriel hébreu à partir de « ils serviront ». Le rendu de la révélation divine, du nom Yahweh, des termes cultuels et de l’accomplissement des vœux est conservé. Les notes restent correctement ancrées et rendent compte de l’alternative passive ainsi que du sens de « servir » dans le contexte cultuel.
