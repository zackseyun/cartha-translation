revisions:
- from: 'Proclamation concernant l’Égypte[a].


    Voici Yahweh, monté sur un nuage rapide : il vient en Égypte. Les idoles de l’Égypte trembleront devant lui[b], et le cœur de l’Égypte fondra en elle-même.'
  to: 'Proclamation[a] concernant l’Égypte.


    Voici, Yahweh, chevauchant un nuage rapide, vient en Égypte. Les idoles de l’Égypte trembleront devant lui[b], et le cœur de l’Égypte fondra au-dedans d’elle.'
  rationale: La révision corrige la note qui donnait à מִפָּנָיו un sens erroné, rend le participe רֹכֵב par « chevauchant », et améliore le placement de l’ancre a. Elle conserve la personnification nationale et l’ambiguïté inhérente au suffixe singulier de בְּקִרְבּוֹ en l’accordant naturellement avec « l’Égypte » en français.
  reviewer_model: gpt-5.6-terra
