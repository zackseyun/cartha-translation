  variant: modern international French
source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
translation:
  language: fr
  text: 'Proclamation[a] concernant l’Égypte.


    Voici, Yahweh, chevauchant un nuage rapide, vient en Égypte. Les idoles de l’Égypte trembleront devant lui[b], et le cœur de l’Égypte fondra au-dedans d’elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Oracle concernant l’Égypte ». Le mot hébreu peut aussi signifier littéralement « fardeau ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant sa face », c’est-à-dire devant lui ou sous l’effet de sa présence.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans le titre d’un oracle prophétique, le terme introduit une parole solennelle, souvent dirigée contre une nation. « Proclamation » est actuel et digne; une note conserve les sens possibles « oracle » et, plus littéralement, « fardeau ».
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: l’Égypte / en Égypte
  rationale: Forme française usuelle du nom du pays, avec la préposition idiomatique requise par le contexte.
- source_word: הִנֵּה
  choice: Voici
  rationale: Rend l’appel à l’attention et l’immédiateté de la vision prophétique dans un français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: רֹכֵב עַל עָב קַל
  choice: monté sur un nuage rapide
  rationale: Conserve l’image théophanique de Yahweh porté sur un nuage ainsi que la notion de vitesse exprimée par קַל, sans réduire l’image à une simple arrivée rapide.
- source_word: וּבָא
  choice: il vient
  rationale: Le participe coordonné présente l’action comme vive et imminente; le présent français convient à cette scène prophétique.
- source_word: וְנָעוּ
  choice: trembleront
  rationale: Le verbe évoque le vacillement ou l’ébranlement. « Trembleront » rend naturellement leur déstabilisation devant Yahweh.
- source_word: אֱלִילֵי
  choice: les idoles de
  rationale: Rend directement le référent. Le possible mépris inhérent au mot hébreu ne nécessite pas l’ajout explicite de « vaines ».
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: Formulation française naturelle pour l’expression littérale « de devant sa face », qui désigne ici la réaction provoquée par sa présence.
- source_word: וּלְבַב מִצְרַיִם
  choice: et le cœur de l’Égypte
  rationale: Préserve la personnification nationale et la métaphore du cœur comme siège du courage et de la résolution.
- source_word: יִמַּס
  choice: fondra
  rationale: Conserve l’image hébraïque de la fonte pour exprimer l’effondrement du courage.
- source_word: בְּקִרְבּוֹ
  choice: en elle-même
  rationale: Le suffixe renvoie à l’Égypte envisagée comme une entité singulière. Le féminin français s’accorde naturellement avec « l’Égypte », tandis que « elle-même » maintient la personnification.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le nom divin. Sa transcription préserve cette donnée du texte sans remplacer le nom par un titre.
- issue: Image théophanique de Yahweh sur un nuage
  choice: 'Conserver l’image directe : « monté sur un nuage rapide »'
  alternative: 'Paraphraser : « Yahweh arrive rapidement »'
  rationale: L’hébreu décrit une venue divine au moyen d’une image de théophanie. La traduction la maintient sans la rationaliser ni l’aplatir.
- issue: Personnification de l’Égypte
  choice: « le cœur de l’Égypte fondra en elle-même »
  alternative: « l’Égypte perdra courage »
  rationale: La formulation retenue conserve la métaphore et la personnification de l’original plutôt que d’en expliciter seulement le sens.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La ponctuation met en relief l’irruption de la vision introduite par « Voici ». Les métaphores prophétiques et la personnification nationale sont conservées.
