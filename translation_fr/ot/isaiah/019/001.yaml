review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement le titre prophétique, le nom divin, l’image théophanique, l’arrivée en Égypte, le tremblement des idoles et la métaphore du cœur qui fond. Toutefois, « monté » exprime moins directement le participe hébreu רֹכֵב (« chevauchant »), et la note b traduit fautivement מִפָּנָיו par « loin de sa face » : l’expression signifie « de devant sa face / devant lui », avec l’idée de sa présence.'
  naturalness: Le registre est globalement moderne et solennel. « Yahweh, chevauchant un nuage rapide » est plus fidèle au mouvement en cours et demeure naturel dans une prose prophétique. « au-dedans d’elle » rend plus clairement la localisation interne que « en elle-même ».
  terminology: « Proclamation » est un choix recevable pour מַשָּׂא, avec « oracle » en variante. « Yahweh », « idoles », « cœur » et « fondra » sont appropriés. La note sur מִפָּנָיו doit être corrigée pour ne pas inverser le sens spatial de l’hébreu.
  issues:
  - severity: medium
    issue: La note b dit « loin de sa face ».
    rationale: מִפָּנָיו signifie littéralement « de devant sa face » et, dans ce contexte, « devant lui / à cause de sa présence »; « loin de » introduit un sens absent du texte.
  - severity: low
    issue: « monté sur un nuage » peut suggérer l’action achevée de monter.
    rationale: רֹכֵב est un participe décrivant Yahweh en train de chevaucher; « chevauchant » conserve plus précisément l’aspect imagé et dynamique.
  - severity: low
    issue: L’ancre de la note lexicale sur מַשָּׂא est placée après « l’Égypte » plutôt qu’après le terme qu’elle explique.
    rationale: Placer l’ancre après « Proclamation » rend le rattachement de la note immédiat et non ambigu.
