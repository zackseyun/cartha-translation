  text: יְהוָ֛ה מָסַ֥ךְ בְּ/קִרְבָּ֖/הּ ר֣וּחַ עִוְעִ֑ים וְ/הִתְע֤וּ אֶת מִצְרַ֨יִם֙ בְּ/כָֽל מַעֲשֵׂ֔/הוּ כְּ/הִתָּע֥וֹת שִׁכּ֖וֹר בְּ/קִיאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
translation:
  language: fr
  text: Yahweh a mêlé en elle un esprit de confusion[a], et ils ont égaré l’Égypte dans toutes ses activités[b], comme un homme ivre titube dans son vomi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de dérèglement », « un esprit de perversion » ou « un esprit de vertige ». L’expression hébraïque évoque une influence qui désoriente et fait dévier.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est au pluriel : « ils ont égaré l’Égypte ». Le sujet n’est pas explicitement nommé ici ; il peut s’agir des influences désorientantes ou des dirigeants de l’Égypte soumis à cette influence.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: מָסַךְ
  choice: a mêlé
  rationale: Le verbe évoque concrètement le mélange de liquides. « A mêlé » conserve cette image appliquée ici à l’influence désorientante placée au cœur de l’Égypte.
- source_word: בְּקִרְבָּהּ
  choice: en elle
  rationale: Le suffixe féminin renvoie à l’Égypte. Le français peut naturellement reprendre le nom du pays au féminin par « elle ».
- source_word: רוּחַ עִוְעִים
  choice: un esprit de confusion
  rationale: רוּחַ désigne ici une influence ou disposition agissante, tandis que עִוְעִים appartient au champ de la torsion, du dérèglement et de la désorientation. « Confusion » rend clairement l’effet sans imposer exclusivement une nuance morale ou physique.
- source_word: וְהִתְעוּ
  choice: et ils ont égaré
  rationale: La forme verbale est au pluriel et causative. La traduction maintient ce pluriel, même si son sujet exact demeure implicite ou dépend du contexte.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: dans tout ce qu’elle entreprend
  rationale: L’expression vise l’ensemble des actions et entreprises de l’Égypte. Cette formulation est plus naturelle en français que le calque « dans toute son œuvre ».
- source_word: כְּהִתָּעוֹת שִׁכּוֹר
  choice: comme un homme ivre titube
  rationale: L’infinitif décrit le mouvement erratique d’une personne ivre. « Titube » restitue naturellement en français la perte de direction et de maîtrise.
- source_word: בְּקִיאוֹ
  choice: dans son vomi
  rationale: Le terme hébreu désigne explicitement le vomi. L’image dégradante et saisissante est conservée sans atténuation.
theological_decisions:
- issue: Action divine dans le jugement exprimé par l’« esprit de confusion »
  choice: Yahweh est présenté comme mêlant activement cet esprit au sein de l’Égypte.
  alternative: Yahweh permet seulement que la confusion surgisse en Égypte.
  rationale: Le sujet explicite du verbe מָסַךְ est Yahweh. La traduction conserve cette attribution forte sans préciser davantage la relation entre causalité, permission et agents secondaires.
- issue: Sujet du verbe pluriel וְהִתְעוּ
  choice: Le pluriel est conservé par « ils ont égaré », sans identifier explicitement ses référents.
  alternative: Employer le singulier « il a égaré » ou le passif « l’Égypte a été égarée ».
  rationale: Le texte massorétique porte un verbe à la troisième personne du pluriel. Son sujet peut renvoyer aux influences désorientantes ou, selon le contexte, aux dirigeants de l’Égypte. Préserver le pluriel maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste lisible tout en conservant le pluriel inhabituel du verbe et l’image crue du vomi. « Tout ce qu’elle entreprend » rend idiomatiquement la portée globale de מַעֲשֵׂהוּ.
