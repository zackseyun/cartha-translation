id: ISA.19.19
reference: Isaiah 19:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶ֤ה מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה בְּ/ת֖וֹךְ אֶ֣רֶץ מִצְרָ֑יִם וּ/מַצֵּבָ֥ה אֵֽצֶל גְּבוּלָ֖/הּ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
translation:
  language: fr
  text: En ce jour-là, il y aura un autel pour Yahweh au milieu du pays d’Égypte, et une stèle[a] pour Yahweh près de sa frontière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pierre dressée ». Le mot hébreu מַצֵּבָה désigne une pierre érigée ou une stèle.
    reason: Alternative lexicale permettant de conserver toute l’étendue du terme hébreu.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette formule temporelle prophétique courante conserve le registre solennel de l’hébreu tout en restant naturelle en français moderne.
- source_word: יִהְיֶה
  choice: il y aura
  rationale: Le verbe est employé ici dans un sens existentiel, introduisant la présence future d’un autel et d’une stèle.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: Il s’agit du terme hébreu habituel pour un autel sacrificiel; aucun sens métaphorique n’est indiqué ici.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל exprime ici la destination ou la consécration. « Pour Yahweh » est idiomatique en français et convient aux deux objets mentionnés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La traduction conserve le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression indique que l’autel se trouve à l’intérieur du pays d’Égypte, et non simplement à proximité de celui-ci.
- source_word: אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: Cette formulation rend explicitement le mot אֶרֶץ tout en étant naturelle en français.
- source_word: וּמַצֵּבָה
  choice: et une stèle
  rationale: מַצֵּבָה désigne une pierre érigée ou un monument vertical. « Stèle » est précis, concis et naturel dans ce contexte, sans effacer la dimension cultuelle potentiellement sensible du terme.
- source_word: אֵצֶל
  choice: près de
  rationale: La préposition exprime la proximité; « près de » rend cette relation sans imposer un contact immédiat avec la frontière.
- source_word: גְּבוּלָהּ
  choice: sa frontière
  rationale: Le suffixe féminin renvoie au pays d’Égypte. « Sa frontière » est la formulation française la plus directe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom divin. Le conserver respecte la distinction entre un nom propre et un titre.
- issue: Sens de מַצֵּבָה dans un contexte prophétique positif
  choice: stèle
  alternative: pierre dressée
  rationale: Le terme peut désigner ailleurs un objet cultuel condamné, mais il est présenté ici comme consacré à Yahweh. « Stèle » préserve le sens concret et la tension théologique sans l’atténuer en « monument » générique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la structure parallèle de l’hébreu et répète « pour Yahweh » afin de préserver l’accent porté sur la consécration des deux objets.
