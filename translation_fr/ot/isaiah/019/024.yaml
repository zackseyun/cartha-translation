  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֤ה יִשְׂרָאֵל֙ שְׁלִ֣ישִׁיָּ֔ה לְ/מִצְרַ֖יִם וּ/לְ/אַשּׁ֑וּר בְּרָכָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/024.yaml
  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
translation:
  language: fr
  text: En ce jour-là, Israël sera le troisième, avec l’Égypte et l’Assyrie, une bénédiction au milieu de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu du pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays.
    reason: Alternative lexicale authentique pour הָאָרֶץ.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique consacrée, naturelle en français et fidèle au registre du texte.
- source_word: יִהְיֶה
  choice: sera
  rationale: Le futur simple rend directement la forme verbale et convient à l’annonce prophétique.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre conservé selon l’usage français standard.
- source_word: שְׁלִישִׁיָּה
  choice: le troisième
  rationale: L’ordinal féminin est employé substantivement; dans ce contexte, Israël constitue le troisième membre du groupe formé avec l’Égypte et l’Assyrie.
- source_word: לְמִצְרַיִם וּלְאַשּׁוּר
  choice: avec l’Égypte et l’Assyrie
  rationale: 'Ici, la préposition ל marque vraisemblablement l’association: Israël se joint aux deux autres nations comme troisième membre.'
- source_word: בְּרָכָה
  choice: une bénédiction
  rationale: Rendu direct du nom, sans expliciter davantage sa fonction ni atténuer sa résonance théologique.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au milieu de la terre
  rationale: La portée internationale du contexte favorise « terre » au sens du monde; « au milieu de » reflète étroitement בְּקֶרֶב.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: La réunion d’Israël, de l’Égypte et de l’Assyrie suggère un horizon international, mais le sens plus local « pays » demeure lexicalement possible et est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la formulation concise et la tension prophétique de l’hébreu; « le troisième avec » reste légèrement marqué, mais exprime sans paraphrase excessive l’appartenance à un groupe de trois.
