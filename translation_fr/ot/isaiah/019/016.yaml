  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
translation:
  language: fr
  text: 'En ce jour-là, l’Égypte sera comme des femmes[a] : elle tremblera et aura peur à cause du mouvement de la main de Yahvé des armées[b], qu’il brandit contre elle.


    [a] Cette comparaison reprend une image guerrière ancienne associant les femmes à la vulnérabilité et à la peur ; l’hébreu dit explicitement « comme des femmes ».


    [b] Ou « le brandissement de la main ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette comparaison reprend une image guerrière ancienne associant les femmes à la vulnérabilité et à la peur ; l’hébreu dit explicitement « comme des femmes ».
    reason: cultural_note
  - marker: b
    text: Ou « le brandissement de la main ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Conserve la formule prophétique temporelle dans un français naturel et solennel.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le pays est personnifié comme une entité singulière, ce que reprend le pronom « elle ».
- source_word: כַּנָּשִׁים
  choice: comme des femmes
  rationale: Rend explicitement le féminin pluriel de l’hébreu sans neutraliser la comparaison culturellement située.
- source_word: וְחָרַד וּפָחַד
  choice: elle tremblera et sera saisie de peur
  rationale: Préserve les deux verbes coordonnés et leur intensification tout en restant idiomatique en français.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Exprime ici clairement la cause de l’effroi.
- source_word: תְּנוּפַת יַד
  choice: du geste menaçant de la main
  rationale: Le nom évoque un mouvement de la main brandie ; « geste menaçant » communique sa valeur hostile sans effacer l’image concrète de la main.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת de façon transparente ; la formulation française indique que les armées sont sous son commandement.
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  choice: qu’il brandira contre elle
  rationale: Reprend le mouvement menaçant avec un verbe naturel ; « contre » convient au contexte de jugement, tandis que « elle » renvoie à l’Égypte personnifiée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le tétragramme comme nom propre. « Yahvé » le rend directement sans substituer un titre, tout en employant la forme française courante.
- issue: Sens du titre צְבָאוֹת
  choice: le maître des armées
  alternative: des armées / des puissances
  rationale: Ce rendu conserve la dimension militaire particulièrement pertinente dans cet oracle de jugement, tout en donnant au titre une syntaxe française claire.
- issue: Comparaison genrée כַּנָּשִׁים
  choice: comme des femmes
  alternative: comme des êtres sans défense
  rationale: La traduction maintient l’expression explicite et la tension culturelle du texte ancien plutôt que de l’atténuer ; une note en précise le cadre imagé.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est conservée. La comparaison ancienne demeure dans le texte avec une explication culturelle en note ; le geste de la main est formulé de manière concrète et menaçante.
