id: ISA.19.22
reference: Isaiah 19:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
translation:
  language: fr
  text: Yahweh frappera l’Égypte — il frappera et il guérira. Ils reviendront à Yahweh[a] ; il se laissera fléchir par leurs supplications[b] et les guérira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils se tourneront vers Yahweh ». Le verbe hébreu peut exprimer le fait de se tourner ou de revenir, souvent avec une nuance de repentance dans les textes prophétiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « il exaucera leurs supplications ». L’expression hébraïque signifie que Yahweh accueille favorablement leur appel et y répond.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָגַף
  choice: frappera
  rationale: Le verbe נָגַף exprime ici l’action de porter un coup, éventuellement sous la forme d’un fléau. « Frappera » conserve la force du jugement divin dans un français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Forme française usuelle du nom du pays ; le genre grammatical permet ensuite de comprendre naturellement l’objet des actions de frapper et de guérir.
- source_word: נָגֹף וְרָפוֹא
  choice: il frappera et il guérira
  rationale: Les deux infinitifs absolus juxtaposent avec insistance jugement et guérison. La reprise verbale rend cette construction de manière naturelle en français sans imposer une chronologie ni atténuer la tension.
- source_word: וְשָׁבוּ עַד יְהוָה
  choice: Ils reviendront à Yahweh
  rationale: שׁוב avec עַד décrit un mouvement de retour ou de conversion vers Yahweh. « Reviendront » conserve la nuance prophétique de repentance et de restauration sans la développer au-delà du texte.
- source_word: וְנֶעְתַּר לָהֶם
  choice: il se laissera fléchir par leurs supplications
  rationale: Le nifal de עתר indique que Yahweh accueille favorablement leur appel et consent à y répondre. Cette formulation conserve la tournure réceptive de l’hébreu tout en restant intelligible.
- source_word: וּרְפָאָם
  choice: et les guérira
  rationale: רפא signifie « guérir ». Ce choix maintient le lien lexical avec la première mention de la guérison et laisse ouverte sa portée à la fois collective, physique et spirituelle.
theological_decisions:
- issue: Rapport entre jugement divin et restauration
  choice: Yahweh est présenté comme celui qui frappe l’Égypte et qui la guérit.
  alternative: Comprendre la guérison comme une simple reprise politique sans dimension de retour vers Dieu.
  rationale: Le texte attribue explicitement les deux actions à Yahweh et associe la guérison au retour des Égyptiens vers lui ainsi qu’à sa réponse favorable. La traduction maintient cette tension.
- issue: Nuance de repentance dans שׁוב
  choice: reviendront à Yahweh
  alternative: se tourneront vers Yahweh
  rationale: « Reviendront » préserve la nuance religieuse et prophétique d’un retour vers Dieu, tout en évitant de transformer l’expression en formule doctrinale plus précise que l’hébreu.
- issue: Réponse favorable de Yahweh aux supplications
  choice: il se laissera fléchir par leurs supplications
  alternative: il exaucera leurs supplications
  rationale: La formulation retenue reflète la valeur réceptive du nifal et l’idée d’une réponse favorable, sans suggérer que la volonté divine serait contrainte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tiret met en relief la reprise emphatique « frappera… frappera et guérira » et conserve la juxtaposition abrupte du jugement et de la restauration. Les pronoms pluriels renvoient naturellement aux Égyptiens, tandis que l’Égypte demeure l’objet collectif implicite des premiers verbes.
