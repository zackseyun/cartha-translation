revisions:
- from: Ce jour-là, cinq villes du pays d’Égypte parleront la langue de Canaan et prêteront serment à l’Éternel, le maître des armées. L’une d’elles sera appelée « Ville de la Destruction ».[a]
  to: Ce jour-là, cinq villes du pays d’Égypte parleront la langue de Canaan et prêteront serment à l’Éternel des armées. L’une d’elles sera appelée « la ville de la Destruction ».[a]
  rationale: Révision limitée du titre divin pour une équivalence lexicale et un usage français biblique naturel, ainsi que resserrement de la note afin de présenter sobrement la variante textuelle. Le reste du texte est conservé, notamment « prêter serment à », qui ne surinterprète pas la nature du serment.
