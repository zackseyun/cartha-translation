  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִהְיוּ֩ חָמֵ֨שׁ עָרִ֜ים בְּ/אֶ֣רֶץ מִצְרַ֗יִם מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת עִ֣יר הַ/הֶ֔רֶס יֵאָמֵ֖ר לְ/אֶחָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: fr
  text: Ce jour-là, cinq villes du pays d’Égypte parleront la langue de Canaan et prêteront serment à l’Éternel des armées. L’une d’elles sera appelée « la ville de la Destruction ».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins anciens lisent : « la ville du Soleil ». Le texte hébreu massorétique porte : « la ville de la Destruction ».'
    reason: La lecture « Soleil » (הַחֶרֶס) est une variante ancienne importante en regard de la lecture massorétique « Destruction » (הַהֶרֶס) et doit être signalée sans remplacer le texte de base.
lexical_decisions:
- source_word: שְׂפַת כְּנַעַן
  choice: la langue de Canaan
  rationale: Littéralement « la lèvre de Canaan » ; en français naturel, l’expression désigne la langue parlée.
- source_word: וְנִשְׁבָּעוֹת לַיהוָה
  choice: prêteront serment à l’Éternel
  rationale: Préserve le sens formel du verbe « jurer/prêter serment » et le destinataire marqué par ל, sans préciser davantage la nature de l’engagement.
- source_word: יְהוָה צְבָאוֹת
  choice: l’Éternel, le maître des armées
  rationale: Rend le nom divin selon l’usage français biblique courant et צְבָאוֹת par une formulation intelligible exprimant son autorité sur les armées célestes ou terrestres.
- source_word: עִיר הַהֶרֶס
  choice: Ville de la Destruction
  rationale: Suit le texte consonantique massorétique et sa vocalisation, où הֶרֶס signifie « destruction ».
theological_decisions:
- issue: Nature du serment adressé à YHWH
  choice: prêteront serment à l’Éternel
  alternative: jureront fidélité à l’Éternel
  rationale: Le texte dit qu’elles jurent à/par YHWH, mais n’explicite pas directement un serment d’allégeance ; la traduction conserve cette ouverture.
- issue: Nom de la ville dans une tradition textuelle disputée
  choice: Ville de la Destruction
  alternative: Ville du Soleil
  rationale: Le WLC porte הַהֶרֶס (« la destruction »). Une variante ancienne et certains témoins soutiennent « du Soleil » ; elle est signalée en note sans remplacer le texte source demandé.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle. Les futurs rendent l’imparfait hébreu à valeur prophétique dans le cadre de « ce jour-là ».
