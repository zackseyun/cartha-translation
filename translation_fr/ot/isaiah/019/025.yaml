  text: אֲשֶׁ֧ר בֵּרֲכ֛/וֹ יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר בָּר֨וּךְ עַמִּ֜/י מִצְרַ֗יִם וּ/מַעֲשֵׂ֤ה יָדַ/י֙ אַשּׁ֔וּר וְ/נַחֲלָתִ֖/י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/025.yaml
  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
translation:
  language: fr
  text: 'que Yahvé des armées[a] a béni en disant : « Bénis soient l’Égypte, mon peuple, l’Assyrie, l’œuvre de mes mains[b], et Israël, mon héritage ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le SEIGNEUR des armées ».'
    reason: lexical_alternative
  - marker: b
    text: Les titres « mon peuple » et « l’œuvre de mes mains », souvent associés à Israël, sont ici appliqués respectivement à l’Égypte et à l’Assyrie.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif rattache la bénédiction aux trois peuples mentionnés dans le contexte précédent, sans alourdir la phrase française.
- source_word: בֵּרֲכוֹ
  choice: a bénis
  rationale: Le parfait exprime l’action accomplie de Dieu. L’accord pluriel en français explicite le renvoi contextuel à l’Égypte, à l’Assyrie et à Israël, même si le suffixe hébreu est formellement au masculin singulier et peut envisager l’ensemble collectivement.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » représente le nom divin יהוה, tandis que « des armées » rend de façon transparente le pluriel צְבָאוֹת dans ce titre.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formulation française naturelle pour introduire les paroles directes qui donnent le contenu de la bénédiction.
- source_word: בָּרוּךְ
  choice: Bénis soient
  rationale: Le pluriel français applique la formule de bénédiction aux trois membres de l’énumération tout en conservant sa force solennelle.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Traduction directe qui maintient l’application saisissante à l’Égypte d’un titre étroitement associé à Israël.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Nom français courant du pays; l’article est requis dans cette construction appositive.
- source_word: וּמַעֲשֵׂה יָדַי
  choice: l’Assyrie, œuvre de mes mains
  rationale: L’apposition restitue naturellement le groupe construit hébreu « œuvre de mes mains » et son application directe à l’Assyrie.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Nom français courant du peuple et de l’empire dans ce contexte.
- source_word: וְנַחֲלָתִי
  choice: et Israël, mon héritage
  rationale: « Héritage » exprime directement la possession reçue ou attribuée que désigne נַחֲלָה, sans atténuer sa portée théologique.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française établie du nom du peuple.
theological_decisions:
- issue: Titre divin יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: le SEIGNEUR des armées
  rationale: Le texte porte le nom divin יהוה; sa transcription préserve le caractère personnel du nom, tandis que la note signale l’usage traditionnel de substitution.
- issue: Application de désignations liées à Israël à l’Égypte et à l’Assyrie
  choice: Conserver directement « l’Égypte, mon peuple » et « l’Assyrie, œuvre de mes mains »
  alternative: Ajouter une explication telle que « l’Égypte, devenue mon peuple »
  rationale: L’hébreu applique ces titres sans transition explicative. La traduction maintient donc la surprise et la tension théologiques du texte.
- issue: Nombre grammatical de la bénédiction
  choice: Employer le pluriel français « a bénis » et « Bénis soient »
  alternative: Conserver un singulier formel calqué sur le suffixe hébreu
  rationale: Le contexte énumère trois peuples auxquels les paroles de bénédiction sont appliquées. Le pluriel est naturel en français et rend cette portée collective, sans transformer les titres distincts attribués à chacun.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure appositive resserrée conserve le rythme de la triple bénédiction et la mise en parallèle de l’Égypte, de l’Assyrie et d’Israël.
