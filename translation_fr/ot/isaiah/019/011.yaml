id: ISA.19.11
reference: Isaiah 19:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ אֱוִלִים֙ שָׂ֣רֵי צֹ֔עַן חַכְמֵי֙ יֹעֲצֵ֣י פַרְעֹ֔ה עֵצָ֖ה נִבְעָרָ֑ה אֵ֚יךְ תֹּאמְר֣וּ אֶל פַּרְעֹ֔ה בֶּן חֲכָמִ֥ים אֲנִ֖י בֶּן מַלְכֵי קֶֽדֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
translation:
  language: fr
  text: 'Certes, les chefs de Tsoân sont des insensés ; les sages conseillers de Pharaon donnent des conseils stupides[a]. Comment pouvez-vous dire à Pharaon : « Je suis fils de sages[b], fils de rois d’autrefois » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le conseil est stupide » ou « abruti ».'
    reason: lexical_alternative
  - marker: b
    text: Les expressions « fils de sages » et « fils de rois d’autrefois » évoquent ici une ascendance ou une lignée prestigieuse, sans désigner nécessairement une filiation immédiate.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Certes
  rationale: La particule introduit ici une affirmation appuyée plutôt qu’une restriction ; « Certes » en restitue la force dans un registre digne.
- source_word: אֱוִלִים
  choice: des insensés
  rationale: Le terme porte un jugement tranchant sur les chefs de Tsoân. « Insensés » conserve cette vigueur sans tomber dans un registre familier.
- source_word: שָׂרֵי צֹעַן
  choice: les chefs de Tsoân
  rationale: שָׂרִים peut désigner des princes, des dirigeants ou de hauts responsables. « Chefs » convient au contexte politique sans imposer une filiation royale ; le toponyme est translittéré « Tsoân ».
- source_word: חַכְמֵי יֹעֲצֵי פַרְעֹה
  choice: les sages conseillers de Pharaon
  rationale: La formulation conserve à la fois leur réputation de sagesse et leur fonction de conseillers auprès de Pharaon, tout en faisant ressortir l’ironie du verset.
- source_word: עֵצָה נִבְעָרָה
  choice: donnent des conseils stupides
  rationale: L’hébreu est condensé et peut se rendre littéralement par « le conseil est stupide/abruti ». La formulation verbale est naturelle en français et garde la forte valeur péjorative de נִבְעָרָה.
- source_word: אֵיךְ תֹּאמְרוּ אֶל־פַּרְעֹה
  choice: Comment pouvez-vous dire à Pharaon
  rationale: La deuxième personne du pluriel est maintenue, et « pouvez-vous » exprime l’incrédulité de la question rhétorique.
- source_word: בֶּן חֲכָמִים אֲנִי
  choice: Je suis fils de sages
  rationale: La traduction conserve l’image hébraïque du fils, qui peut exprimer l’ascendance ou l’appartenance à une lignée, sans la réduire à une filiation immédiate.
- source_word: בֶּן מַלְכֵי קֶדֶם
  choice: fils de rois d’autrefois
  rationale: קֶדֶם renvoie ici aux temps anciens. « Rois d’autrefois » est naturel en français moderne et préserve la revendication d’un ancien prestige dynastique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le contraste ironique entre la sagesse revendiquée et la stupidité des conseils est conservé, ainsi que les images de filiation du texte hébreu.
