  yaml_path: translation/ot/isaiah/019/015.yaml
  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
translation:
  language: fr
  text: Et il n’y aura pour l’Égypte aucune action que puissent accomplir la tête ou la queue[a], la palme ou le roseau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « tête et queue, palme et roseau ». Cette expression figurée englobe tous les niveaux de la société, du plus élevé au plus humble ; voir l’image semblable en Ésaïe 9.13.
    reason: cross_reference
  - marker: b
    text: 'On pourrait traduire : « la tête et la queue, la palme et le roseau ». Les termes de chaque paire sont reliés par « et » en hébreu, mais le sens est qu’aucune composante de l’Égypte, élevée ou humble, ne pourra agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֶׂה
  choice: œuvre
  rationale: Le nom désigne une action, une œuvre ou une entreprise. « Œuvre » convient à la tournure existentielle et garde un registre digne sans préciser indûment le type d’activité.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: que puissent accomplir
  rationale: Dans ce contexte d’incapacité générale, l’imparfait prend naturellement une valeur potentielle. « Puissent accomplir » exprime cette modalité et évite la répétition de « œuvre » et « faire ».
- source_word: רֹאשׁ וְזָנָב
  choice: la tête ou la queue
  rationale: L’image désigne les extrêmes sociaux. Le français distributif « ou » fait comprendre qu’aucun des deux, du plus élevé au plus humble, ne pourra agir, tout en signalant en note le coordonnant hébreu.
- source_word: כִּפָּה
  choice: la palme
  rationale: Le terme évoque probablement la haute frondaison ou branche du palmier. « Palme » conserve l’image végétale et son contraste vertical avec le roseau.
- source_word: אַגְמוֹן
  choice: le roseau
  rationale: Le mot désigne une plante des marais, roseau ou jonc. « Roseau » est courant et maintient clairement le contraste figuré avec la palme.
- source_word: לְמִצְרַיִם
  choice: pour l’Égypte
  rationale: 'La préposition marque ici la relation ou l’attribution : aucune œuvre ne sera à la disposition ou à la portée de l’Égypte.'
- source_word: וְלֹא יִהְיֶה
  choice: Et il n’y aura… aucune
  rationale: Cette formulation restitue naturellement en français moderne la proposition existentielle négative au futur.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure imagée du texte hébreu est conservée plutôt que remplacée dans le corps du verset par son interprétation sociale. « Palme » est employé au sens de branche ou frondaison de palmier.
