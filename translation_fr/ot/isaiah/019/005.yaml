  text: וְ/נִשְּׁתוּ מַ֖יִם מֵֽ/הַ/יָּ֑ם וְ/נָהָ֖ר יֶחֱרַ֥ב וְ/יָבֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/005.yaml
  text: And the waters of the sea will dry up[b][a], and the river will be parched and dry.
translation:
  language: fr
  text: Les eaux de la mer se tariront[a], et le fleuve[b] tarira et sera à sec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les eaux seront retirées de la mer ». Le verbe hébreu peut évoquer des eaux épuisées ou taries.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « le fleuve » désigne probablement le Nil, mais le texte hébreu emploie le nom commun et non le nom propre.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְּׁתוּ
  choice: se tariront
  rationale: Le nifal exprime ici l’épuisement ou l’assèchement des eaux. « Se tariront » rend naturellement ce résultat en français sans conserver le sens littéral inadapté de « boire ».
- source_word: מַיִם מֵהַיָּם
  choice: les eaux de la mer
  rationale: Cette formulation française naturelle conserve « les eaux » et « la mer », tout en exprimant le rapport de provenance marqué par מִן.
- source_word: נָהָר
  choice: le fleuve
  rationale: Dans le contexte égyptien, il s’agit très probablement du Nil. Cependant, l’hébreu emploie le nom commun « fleuve » et non le nom propre ; la traduction maintient cette distinction.
- source_word: יֶחֱרַב וְיָבֵשׁ
  choice: sera aride et desséché
  rationale: Les deux termes hébreux forment une paire intensive évoquant l’état sec puis l’assèchement. La formulation française conserve les deux éléments sans les réduire à un seul verbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Se tariront » et « sera aride et desséché » rendent l’image du jugement tout en préservant le parallélisme et la paire verbale de l’hébreu.
