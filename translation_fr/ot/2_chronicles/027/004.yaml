  text: וְ/עָרִ֥ים בָּנָ֖ה בְּ/הַר יְהוּדָ֑ה וּ/בֶ/חֳרָשִׁ֣ים בָּנָ֔ה בִּֽירָנִיּ֖וֹת וּ/מִגְדָּלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/004.yaml
  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: fr
  text: Il bâtit des villes dans la région montagneuse de Juda et, dans les forêts[a], il bâtit des forteresses[b] et des tours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les régions boisées » ou « les fourrés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des citadelles » ou « des places fortes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: villes
  rationale: Le pluriel désigne ici des agglomérations aménagées dans le cadre des travaux royaux. « Villes » est le terme français courant et direct.
- source_word: בָּנָה
  choice: bâtit
  rationale: Le verbe signifie simplement « bâtir, construire ». La répétition de « bâtit » conserve la structure concise et parallèle de l’hébreu.
- source_word: בְּהַר יְהוּדָה
  choice: dans la région montagneuse de Juda
  rationale: Dans cette expression géographique, הַר désigne le relief montagneux de Juda plutôt qu’une montagne isolée. Cette formulation est précise et naturelle en français.
- source_word: חֳרָשִׁים
  choice: les forêts
  rationale: Le nom désigne des espaces boisés, éventuellement des fourrés. « Forêts » offre une formulation concise, tandis qu’une note préserve les autres nuances possibles.
- source_word: בִּירָנִיּוֹת
  choice: forteresses
  rationale: Le terme désigne des ouvrages fortifiés. « Forteresses » convient au contexte défensif sans introduire l’image potentiellement anachronique de châteaux.
- source_word: מִגְדָּלִים
  choice: tours
  rationale: C’est le sens habituel du nom; associé aux forteresses, il évoque vraisemblablement des ouvrages défensifs.
