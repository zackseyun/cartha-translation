  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: fr
  text: Il construisit la porte supérieure de la maison de Yahweh et réalisa de nombreux travaux[a] sur la muraille de l’Ophel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. « il construisit beaucoup »; ou : « il construisit en abondance ».'
    reason: L’hébreu לָרֹב exprime l’abondance ou l’ampleur des travaux sans préciser leur nature.
lexical_decisions:
- source_word: בָּנָה
  choice: construisit / réalisa des travaux
  rationale: Le verbe signifie normalement « construire ». Dans la seconde proposition, où aucun objet précis n’est exprimé, « réalisa de nombreux travaux » restitue naturellement en français l’idée d’une activité de construction importante.
- source_word: שַׁעַר
  choice: porte
  rationale: Le terme désigne ici une porte monumentale de l’enceinte ou du complexe du temple.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’expression hébraïque « maison de YHWH » plutôt que de l’expliciter par « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: הָעֶלְיוֹן
  choice: supérieure
  rationale: L’adjectif qualifie la porte en indiquant sa position élevée; « porte supérieure » est naturel dans ce contexte architectural.
- source_word: וּבְחוֹמַת
  choice: sur la muraille
  rationale: La préposition בְּ peut désigner ici l’endroit où s’effectuent les travaux. « Sur la muraille » convient à des travaux de construction ou de fortification.
- source_word: הָעֹפֶל
  choice: l’Ophel
  rationale: Ophel est conservé comme nom propre désignant le secteur surélevé et fortifié de Jérusalem.
- source_word: לָרֹב
  choice: de nombreux travaux
  rationale: L’expression indique une grande quantité ou ampleur. La formulation française rend le sens dans le contexte tout en signalant en note la construction hébraïque plus littérale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La première occurrence de בָּנָה reste formelle, tandis que la seconde est rendue idiomatiquement sans effacer la formulation littérale, donnée en note.
