  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: fr
  text: Yotam avait vingt-cinq ans lorsqu’il devint roi, et il régna seize ans à Jérusalem. Le nom de sa mère était Yerousha, fille de Tsadok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: avait vingt-cinq ans
  rationale: La formule hébraïque d’âge se rend naturellement ainsi en français moderne.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge de Yotam au moment de son accession à la royauté.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » convient naturellement avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette formulation française courante conserve le sens de la notice généalogique.
- source_word: יְרוּשָׁה
  choice: Yerousha
  rationale: Le nom propre est translittéré d’après sa forme hébraïque, dans une graphie accessible au lectorat francophone.
- source_word: בַּת צָדוֹק
  choice: elle était fille de Tsadok
  rationale: La reprise pronominale évite une construction française lourde tout en préservant explicitement la filiation maternelle.
