  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: fr
  text: Ainsi, Jotam devint puissant, parce qu’il avait réglé sa conduite devant l’Éternel, son Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: devint puissant
  rationale: Le verbe חזק à la forme réfléchie/intensive indique ici que Jotam s’affermit ou acquit de la puissance; « devint puissant » exprime naturellement le résultat dans ce contexte royal.
- source_word: הֵכִין דְּרָכָיו
  choice: réglait sa conduite
  rationale: Littéralement, il « établit/affermit ses voies ». En français, « régler sa conduite » conserve l’idée d’une orientation délibérée et constante de sa manière de vivre.
- source_word: לִפְנֵי יְהוָה
  choice: devant l’Éternel
  rationale: « Devant » rend directement לִפְנֵי, qui présente la conduite de Jotam comme vécue sous le regard de Dieu. « l’Éternel » suit l’usage français traditionnel pour le tétragramme.
theological_decisions:
- issue: Lien entre la puissance de Jotam et sa conduite devant Dieu
  choice: parce qu’il réglait sa conduite
  alternative: car il avait affermi ses voies
  rationale: La proposition causale introduite par כִּי est conservée sans atténuer le rapport affirmé par le texte. L’imparfait français présente cette conduite comme une disposition durable, sans définir plus précisément le mécanisme de la bénédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque peu naturel « ordonna ses voies » tout en maintenant l’image éthique des « voies » sous la forme idiomatique « conduite ».
