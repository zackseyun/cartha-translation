- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: seize ans
  rationale: Traduction directe du nombre cardinal accompagné de «années».
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne spécifiquement l’exercice de la royauté; «régna» en est l’équivalent français direct et conventionnel.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition indique ici le lieu; en français, l’usage idiomatique devant un nom de ville exige «à».
