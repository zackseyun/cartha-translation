base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: fr
  text: Yotam se coucha avec ses pères[a], et on l’enterra dans la cité de David. Ahaz, son fils, régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens de la formule : « mourut ». L’hébreu dit littéralement « se coucha avec ses pères », une formule royale traditionnelle de décès.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Dans cette formule royale de décès, le verbe évoque la mort. « Se coucha » conserve l’image hébraïque au lieu de l’expliciter directement par « mourut ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formulation préserve l’expression dynastique hébraïque traditionnelle; « avec ses ancêtres » serait plus explicite, mais moins proche de la forme du texte source.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: on l’enterra
  rationale: Le verbe hébreu est actif et pluriel avec un sujet non exprimé. En français moderne, le pronom indéfini « on » restitue naturellement cet agent non précisé.
- source_word: בְּעִיר דָּוִיד
  choice: dans la cité de David
  rationale: « La cité de David » est une désignation géographique traditionnelle et transparente, correspondant directement à la construction hébraïque.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe מלך désigne l’exercice de la royauté. « Régna » convient à la formule concise de succession.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans ce contexte de succession, l’expression indique qu’Ahaz remplaça Yotam sur le trône.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Translittération française courante du nom hébreu.
- source_word: אָחָז
  choice: Ahaz
  rationale: Forme française courante du nom propre biblique.
- source_word: בְּנוֹ
  choice: son fils
  rationale: La relation filiale est exprimée explicitement afin de préserver la formule dynastique de succession.
theological_decisions:
- issue: La formule de décès « se coucha avec ses pères »
  choice: Conserver l’image hébraïque dans le texte principal
  alternative: « mourut et rejoignit ses ancêtres »
  rationale: La formulation littérale maintient l’euphémisme royal et son éventuelle portée funéraire sans trancher davantage que l’hébreu; une note en donne le sens idiomatique.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste concise comme l’avis de décès et de succession hébreu. Les noms suivent les formes françaises Yotam et Ahaz; « cité de David » conserve la désignation traditionnelle du lieu.
