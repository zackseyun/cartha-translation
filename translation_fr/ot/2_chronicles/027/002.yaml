source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, suivant tout ce qu’avait fait son père Ozias — sauf qu’il n’entra pas dans le temple de Yahweh[a]. Mais le peuple continuait à agir de manière corrompue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette précision oppose probablement Jotam à Ozias, qui était entré illégitimement dans le temple (voir 2 Chroniques 26.16-21). On peut aussi traduire : « il n’alla pas dans le temple de Yahweh ».'
    reason: Référence croisée et autre traduction possible du verbe בוא.
  - marker: b
    text: 'Autres traductions possibles : « continuait à se corrompre » ou « continuait à avoir une conduite corrompue ».'
    reason: La forme hébraïque permet plusieurs formulations proches et ne précise pas expressément l’objet de la corruption.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Il fit ce qui est droit
  rationale: La forme narrative fait avancer le récit, et l’adjectif substantivé désigne « ce qui est droit ». Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation conserve l’image de l’expression évaluative hébraïque et demeure naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: suivant tout ce qu’avait fait son père Ozias
  rationale: « Suivant tout ce que » exprime la conformité à l’exemple antérieur, tandis que le plus-que-parfait marque naturellement l’antériorité de l’action du père.
- source_word: רַק
  choice: sauf que
  rationale: La locution introduit clairement la restriction apportée à la comparaison avec Ozias.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: il n’entra pas dans le temple de Yahweh
  rationale: Dans ce contexte, בוא אֶל indique l’entrée dans un lieu, et הֵיכָל désigne le temple ou sanctuaire.
- source_word: וְעוֹד
  choice: Mais ... continuait à
  rationale: Cette tournure rend à la fois le contraste avec la conduite du roi et la persistance de l’état décrit.
- source_word: הָעָם מַשְׁחִיתִים
  choice: le peuple continuait à agir de manière corrompue
  rationale: Le participe hiphil de שׁחת décrit ici une conduite durablement corrompue sans préciser explicitement un objet ou un résultat.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans remplacer le nom par un titre.
- issue: Portée de l’exception concernant l’entrée dans le temple
  choice: Conserver une formulation factuelle, éclairée seulement en note
  alternative: Expliciter dans le texte que Jotam ne commit pas la faute d’Ozias
  rationale: Le verset évoque vraisemblablement l’entrée illégitime d’Ozias racontée en 2 Chroniques 26.16-21, mais il ne qualifie pas lui-même cette entrée; l’explication reste donc en note.
- issue: Valeur de מַשְׁחִיתִים
  choice: agir de manière corrompue
  alternative: se corrompre / causer la ruine
  rationale: La forme peut évoquer la corruption ou une action destructrice. Le contexte moral et religieux favorise « agir de manière corrompue », tout en signalant les autres nuances en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple porte la narration historique; l’imparfait traduit la conduite persistante du peuple. Le nom Ozias suit sa forme française traditionnelle. Les notes sont rattachées aux propositions qu’elles expliquent, en corrigeant le décalage apparent des marqueurs dans la couche anglaise de consultation.
