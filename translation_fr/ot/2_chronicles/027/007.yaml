  text: וְ/יֶתֶר֙ דִּבְרֵ֣י יוֹתָ֔ם וְ/כָל מִלְחֲמֹתָ֖י/ו וּ/דְרָכָ֑י/ו הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: fr
  text: Le reste des actes de Yotam[a], toutes ses guerres et sa conduite[b], tout cela est écrit dans le livre des rois d’Israël et de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des faits concernant Yotam »; l’expression hébraïque désigne ici ce qui a été fait ou rapporté à son sujet.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses voies »; l’expression peut désigner sa manière d’agir ou de vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Le reste des actes de Yotam
  rationale: Dans cette formule récapitulative royale, דִּבְרֵי désigne les actes ou les affaires du roi plutôt que ses seules paroles. « Le reste des actes » rend naturellement l’idiome en français.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: toutes ses guerres
  rationale: מִלְחָמוֹת désigne directement les guerres ou conflits; « guerres » conserve le sens général sans préciser indûment des batailles ou des campagnes.
- source_word: וּדְרָכָיו
  choice: sa conduite
  rationale: Le pluriel hébreu « ses voies » évoque ici la manière d’agir ou de vivre. « Sa conduite » exprime clairement ce sens en français moderne, tandis que la note conserve la métaphore possible.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: הִנָּם reprend avec emphase les éléments précédents. « Tout cela » en restitue la force démonstrative de façon naturelle; « est écrit » demeure proche du participe passif hébreu.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que la préposition signifie littéralement « sur », le français dit naturellement qu’un contenu est écrit « dans » un livre ou un registre.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: des rois d’Israël et de Juda
  rationale: Cette formulation rend directement la chaîne construite hébraïque et présente le document comme un registre concernant les rois des deux royaumes.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et historiographique. La reprise « tout cela » rend l’emphase de הִנָּם sans recourir à l’archaïsme « voici ». Les minuscules dans « livre des rois » évitent d’identifier automatiquement ce registre cité aux livres bibliques canoniques portant le titre des Rois.
