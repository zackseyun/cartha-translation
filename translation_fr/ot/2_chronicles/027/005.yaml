review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : combat contre le roi ammonite, victoire sur les Ammonites, puis livraison annuelle d’argent, de blé et d’orge durant trois ans. L’explicitation de « kors » devant « orge » est légitime, puisque l’unité est ellipsée mais clairement régie par le premier membre.'
  naturalness: 'La formulation est globalement naturelle et d’un registre narratif approprié. Toutefois, « lui versèrent encore la même chose » est peu idiomatique, surtout parce que la prestation comprend aussi des céréales : « verser » s’emploie normalement pour une somme d’argent.'
  terminology: « Ammonites », « talents », « kors », « blé » et « orge » sont appropriés. « L’emporta sur eux » rend bien la valeur militaire de וַיֶּחֱזַק עֲלֵיהֶם sans surinterprétation.
  issues:
  - severity: medium
    issue: « lui versèrent encore la même chose »
    rationale: Le verbe français « verser » convient mal à une redevance composée à la fois d’argent et de denrées. Le texte emploie הֵשִׁיבוּ, littéralement « rendirent / apportèrent de nouveau » ; dans ce contexte, « remirent aussi la même chose » exprime la répétition de la prestation sans la réduire à un paiement monétaire.
  revised_text: Il fit la guerre au roi des Ammonites et l’emporta sur eux. Cette année-là, les Ammonites lui donnèrent cent talents d’argent, dix mille kors de blé et dix mille kors d’orge[a]. Les Ammonites lui remirent aussi la même chose la deuxième année et la troisième.
