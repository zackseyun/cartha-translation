  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: fr
  text: Il fit la guerre au roi des Ammonites et l’emporta sur eux. Cette année-là, les Ammonites lui donnèrent cent talents d’argent, dix mille kors de blé et dix mille kors d’orge[a]. Les Ammonites lui remirent aussi la même chose la deuxième année et la troisième.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « dix mille kors de blé et dix mille d’orge » ; l’unité « kors » est sous-entendue devant « orge ».'
    reason: ellipse_lexicale
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: fit la guerre au
  rationale: Dans ce contexte militaire, le niphal de לחם avec עִם désigne le fait de combattre un adversaire. « Fit la guerre au » exprime clairement l’hostilité et convient au registre narratif.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: roi des Ammonites
  rationale: בְּנֵי עַמּוֹן est la désignation habituelle du peuple ammonite ; « Ammonites » est la forme française naturelle.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: l’emporta sur eux
  rationale: En contexte militaire, חזק avec עַל indique qu’on prend le dessus ou qu’on triomphe, plutôt qu’une simple manifestation de force.
- source_word: וַיִּתְּנוּ לוֹ
  choice: lui donnèrent
  rationale: Le sens premier de נתן, « donner », est conservé, même si le contexte montre qu’il s’agit d’un tribut.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: cent talents d’argent
  rationale: כִּכָּר est une unité de poids ancienne traditionnellement rendue par « talent », ce qui préserve la spécificité de la mesure.
- source_word: כֹּרִים
  choice: kors
  rationale: Le kor est une mesure de capacité pour les matières sèches. La translittération conserve l’unité ancienne sans lui attribuer une équivalence moderne incertaine.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: et dix mille kors d’orge
  rationale: L’hébreu ne répète pas le mot « kors » devant « orge », mais la mesure est naturellement sous-entendue. Elle est explicitée en français pour éviter une formulation obscure.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: lui versèrent encore la même chose
  rationale: הֵשִׁיבוּ signifie littéralement « firent revenir » ou « rendirent » ; dans ce contexte de tribut répété, « versèrent encore » communique naturellement le sens économique, tandis que « la même chose » reprend le démonstratif זֹאת.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: la deuxième année et la troisième
  rationale: La formulation indique que le même versement fut répété pendant chacune des deux années suivantes.
