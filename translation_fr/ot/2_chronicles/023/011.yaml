base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: fr
  text: 'Puis ils firent sortir le fils du roi, placèrent sur lui la couronne et le témoignage[a], et l’établirent roi. Jehoïada et ses fils l’oignirent et s’écrièrent : « Vive le roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Loi » ou « le document de l’alliance ». Le terme hébreu désigne probablement le témoignage écrit de l’alliance associé à l’exercice de la royauté.
    reason: Alternative lexicale et clarification de la référence possible de הָעֵדוּת.
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: ils firent sortir
  rationale: Le hiphil de יצא exprime ici l’action de faire sortir ou d’amener au-dehors; « firent sortir » rend précisément la forme causative dans un français naturel.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: le fils du roi
  rationale: Cette formulation naturelle conserve l’identification dynastique essentielle à la scène.
- source_word: הַנֵּזֶר
  choice: la couronne
  rationale: Dans ce contexte d’intronisation, נֵזֶר désigne l’insigne royal; « couronne » est clair et accessible, tandis que « diadème » serait possible mais plus soutenu.
- source_word: הָעֵדוּת
  choice: le témoignage
  rationale: Le sens premier de עֵדוּת est « témoignage » ou « attestation ». Ce choix préserve la résonance d’alliance du terme sans préciser indûment la nature exacte de l’objet ou du document.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: l’établirent roi
  rationale: Le hiphil de מלך signifie faire régner ou établir comme roi. Cette traduction distingue l’accession à la royauté de la pose préalable de la couronne.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: lui donnèrent l’onction
  rationale: Cette expression courante en contexte biblique conserve la portée cérémonielle et théologique de משׁח tout en restant compréhensible.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: Jehoïada et ses fils
  rationale: Le groupe nominal, placé après le verbe hébreu, désigne explicitement ceux qui donnent l’onction et constitue naturellement le sujet de l’acclamation qui suit.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Vive le roi !
  rationale: C’est l’équivalent français idiomatique de cette acclamation royale au jussif.
theological_decisions:
- issue: Sens de הָעֵדוּת dans le rite d’intronisation
  choice: le témoignage
  alternative: la Loi; le document de l’alliance; la charte
  rationale: Le mot hébreu peut renvoyer au témoignage écrit lié à l’alliance et aux obligations royales, mais sa référence précise demeure incertaine. Le texte principal conserve donc son sens formel et la note signale les interprétations contextuelles possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La succession narrative hébraïque est conservée sans lourdeur. La phrase est divisée avant le sujet explicite « Jehoïada et ses fils » afin d’éviter de lui attribuer rétroactivement toutes les actions précédentes, tout en indiquant clairement qu’il accomplit l’onction avec ses fils.
