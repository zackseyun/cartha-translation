source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: fr
  text: Que personne n’entre dans la maison de Yahweh[a], sauf les prêtres et les Lévites qui assurent le service ; eux seuls peuvent y entrer, car ils sont saints. Que tout le peuple s’acquitte de la charge de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le temple de Yahweh ». Littéralement : « la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « monte la garde pour Yahweh » ou « observe le service prescrit par Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: Que personne n’entre
  rationale: אַל avec le jussif exprime une interdiction. Cette tournure française en conserve clairement la force directive.
- source_word: בֵית יְהוָה
  choice: la maison de Yahweh
  rationale: Rend littéralement l’expression hébraïque tout en restant intelligible; dans ce contexte, elle désigne le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: כִּי אִם
  choice: sauf
  rationale: Introduit naturellement en français l’exception à l’interdiction précédente.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: les prêtres et les Lévites qui assurent le service
  rationale: Le participe מְשָׁרְתִים qualifie les Lévites dans leur fonction cultuelle. La formulation retenue est naturelle et évite l’expression ambiguë «Lévites officiants».
- source_word: הֵמָּה יָבֹאוּ
  choice: Eux peuvent entrer
  rationale: Dans le contexte de l’exception, la proposition énonce leur autorisation d’entrer; le pronom détaché conserve l’emphase de הֵמָּה.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: car ils sont saints
  rationale: Préserve le vocabulaire biblique de la sainteté sans réduire explicitement le sens à «consacrés».
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: s’acquitte de la charge confiée par Yahweh
  rationale: La construction apparentée שׁמר משׁמרת désigne l’accomplissement fidèle d’une charge, possiblement aussi une garde. «Confiée par» explicite ici la relation probable entre Yahweh et la charge sans la limiter à une veille militaire.
theological_decisions:
- issue: Sainteté cultuelle des prêtres et des Lévites
  choice: «ils sont saints»
  alternative: «ils sont consacrés» ou «mis à part»
  rationale: Le contexte concerne leur qualité sacrée leur permettant d’entrer dans le sanctuaire. «Saints» préserve la catégorie théologique du texte sans impliquer ici une perfection morale.
- issue: Relation exprimée par מִשְׁמֶרֶת יְהוָה
  choice: «la charge confiée par Yahweh»
  alternative: «la garde de Yahweh», «le service prescrit par Yahweh» ou «les prescriptions de Yahweh»
  rationale: Le génitif peut désigner une charge appartenant à Yahweh ou prescrite par lui. Le choix retient le sens général de devoir assigné tout en signalant en note les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directive est nette; «assurent le service» conserve la fonction cultuelle dans une formulation courante. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
