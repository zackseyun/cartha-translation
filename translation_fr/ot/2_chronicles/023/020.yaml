source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: fr
  text: Puis il prit avec lui les chefs de centaines, les notables[a], les dirigeants du peuple et tout le peuple du pays[b]. Il fit descendre le roi de la maison de Yahweh. Ils entrèrent dans le palais royal[c] par la porte supérieure et firent asseoir le roi sur le trône du royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les puissants ». Le terme hébreu peut désigner des personnes éminentes ou puissantes.
    reason: lexical_alternative
  - marker: b
    text: L’expression « peuple du pays » désigne souvent, dans les récits royaux, la population considérée comme un corps sociopolitique.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « la maison du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: il prit avec lui
  rationale: Le verbe signifie littéralement « prendre » ; dans ce contexte, « prendre avec lui » exprime naturellement que Yehoyada conduit ces groupes sans réduire le verbe à « rassembler ».
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: les chefs de centaines
  rationale: Cette formulation conserve la structure du titre militaire hébreu et évite l’anachronisme possible de « centurions ».
- source_word: הָאַדִּירִים
  choice: les notables
  rationale: Le terme désigne des personnes puissantes ou éminentes. « Notables » convient au cadre politique et social tout en laissant ouverte la nature exacte de leur prééminence.
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: les dirigeants du peuple
  rationale: Rendu clair et proche de l’hébreu pour ceux qui exercent une autorité au sein du peuple.
- source_word: כָּל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: La traduction préserve l’expression sociopolitique caractéristique des récits royaux sans la réduire aux seules classes populaires.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: Il fit descendre le roi
  rationale: Le hifil de ירד exprime le fait de faire descendre. La formulation conserve explicitement la direction du déplacement.
- source_word: מִבֵּית יְהוָה
  choice: de la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque בית יהוה, tandis que « Yahweh » représente directement le nom divin.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: par la porte supérieure
  rationale: Dans un récit de déplacement, « par » rend naturellement l’idée de passer au milieu ou à travers la porte.
- source_word: בֵּית הַמֶּלֶךְ
  choice: le palais royal
  rationale: Dans ce contexte, la « maison du roi » est sa résidence officielle ; « palais royal » est naturel en français et évite une compréhension domestique trop étroite.
- source_word: וַיּוֹשִׁיבוּ
  choice: firent asseoir
  rationale: Le causatif pluriel est conservé explicitement et convient au geste cérémoniel de l’intronisation.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: le trône du royaume
  rationale: Cette traduction formellement transparente maintient le substantif « royaume » plutôt que de le fondre dans l’adjectif « royal ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe narrative reste proche de l’hébreu, avec des équivalents idiomatiques lorsque le calque serait peu naturel. Les répétitions de « roi » et le mouvement descendant ont été conservés en raison de leur fonction dans la scène d’intronisation.
