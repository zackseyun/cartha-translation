base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: fr
  text: Il plaça tout le peuple, chacun son arme à la main, depuis le côté sud du Temple jusqu’au côté nord, près de l’autel et du Temple, tout autour du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il plaça
  rationale: Le hiphil de עמד exprime ici le fait de faire prendre position ou de poster des personnes; « plaça » est naturel dans ce contexte de dispositif de protection.
- source_word: כָּל־הָעָם
  choice: tout le peuple
  rationale: Rendu direct du syntagme hébreu, qui désigne ici l’ensemble des personnes mobilisées dans la scène.
- source_word: וְאִישׁ שִׁלְחוֹ בְיָדוֹ
  choice: chacun son arme à la main
  rationale: שֶׁלַח désigne ici une arme; la tournure distributive וְאִישׁ est rendue idiomatiquement par « chacun ».
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית עַד כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: depuis le côté sud du Temple jusqu’au côté nord
  rationale: Dans une orientation ancienne tournée vers l’est, « droite » correspond au sud et « gauche » au nord. Le rendu directionnel clarifie la disposition spatiale conformément au contexte et à la consultation anglaise.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: près de l’autel et du Temple
  rationale: La préposition ל marque ici la localisation dans le dispositif. « Près de » restitue naturellement cette relation spatiale.
- source_word: עַל־הַמֶּלֶךְ סָבִיב
  choice: tout autour du roi
  rationale: עַל avec סָבִיב indique une disposition protectrice entourant le roi; « tout autour de » est idiomatique et fidèle.
