  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: fr
  text: Alors ils lui ouvrirent le passage[a], et elle arriva à l’entrée de la porte des Chevaux, au palais royal[b] ; là, ils la mirent à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ils la saisirent ». Littéralement, l’hébreu dit : « ils mirent pour elle des mains » ; le sens de cette expression est discuté.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: ils la saisirent
  rationale: L’expression signifie littéralement « ils posèrent les mains sur elle ». Dans ce contexte d’arrestation suivie d’une mise à mort, « saisir » exprime naturellement l’action sans ajouter de précision juridique.
- source_word: מְבוֹא
  choice: l’entrée
  rationale: Le nom désigne l’entrée ou le lieu par lequel on entre; « l’entrée » est direct et naturel en français.
- source_word: שַׁעַר הַסּוּסִים
  choice: la porte des Chevaux
  rationale: La construction désigne vraisemblablement une porte portant ce nom. La majuscule signale ce statut de toponyme.
- source_word: בֵּית הַמֶּלֶךְ
  choice: près du palais royal
  rationale: Littéralement « maison du roi », l’expression désigne ici le palais et situe la porte par rapport à celui-ci. « Près du palais royal » rend naturellement le rapport géographique implicite, tout en signalant en note la formulation plus littérale.
- source_word: וַיְמִיתוּהָ
  choice: ils la mirent à mort
  rationale: Le hiphil de מות signifie « faire mourir, mettre à mort ». Cette formulation digne et précise n’impose pas la nuance juridique plus spécifique d’« exécuter ».
- source_word: שָׁם
  choice: là
  rationale: Adverbe de lieu simple, repris naturellement avant le verbe en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La ponctuation en deux phrases évite une coordination lourde. « Elle se rendit » conserve la forme active du verbe hébreu sans préciser si elle fut conduite de force; le contexte immédiat demeure celui de sa saisie.
