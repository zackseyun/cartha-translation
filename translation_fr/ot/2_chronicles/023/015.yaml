  verdict: revise
  source_fidelity: La tournure וַיָּשִׂימוּ לָהּ יָדַיִם est idiomatique et discutée. Dans ce contexte, « ils lui ouvrirent le passage » rend bien le sens contextuel probable (« ils lui firent place »), sans imposer l’interprétation concurrente « ils la saisirent ». « Près du palais royal » ajoute une relation spatiale que le texte ne formule pas explicitement. Le repérage doit rester attaché à la « maison du roi » / au palais royal.
  naturalness: Le français révisé est moderne, clair et conserve une narration digne. « Elle arriva à » correspond plus directement à וַתָּבוֹא que « elle se rendit à », tout en évitant de préciser si elle était libre ou contrainte.
  terminology: « Porte des Chevaux » peut être conservé comme désignation de lieu. « Palais royal » est une explicitation française acceptable de « maison du roi », à condition de ne pas lui ajouter « près de ». « Mirent à mort » rend exactement, sans surdéterminer juridiquement, le hiphil de מות.
  issues:
