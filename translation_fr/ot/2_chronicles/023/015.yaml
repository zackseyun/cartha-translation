    issue: « ils la saisirent » tranche une expression hébraïque disputée.
    rationale: L’idiome peut aussi signifier « ils lui firent place / lui ouvrirent le passage », lecture particulièrement cohérente avec le déplacement qui suit. La traduction doit préserver cette ambiguïté par une note.
  - severity: medium
    issue: « près du palais royal » introduit une relation géographique absente du texte.
    rationale: La mention de la maison du roi qualifie ou localise la porte; elle ne dit pas explicitement que celle-ci se trouvait « près » du palais.
  revised_text: Alors ils lui ouvrirent le passage[a], et elle arriva à l’entrée de la porte des Chevaux, au palais royal[b] ; là, ils la mirent à mort.
