source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: fr
  text: Ils parcoururent Juda et rassemblèrent les Lévites de toutes les villes de Juda, ainsi que les chefs de famille[a] d’Israël ; puis ils vinrent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « les chefs des maisons des pères » ; c’est-à-dire les responsables des groupes familiaux ou claniques.
    reason: Éclaire l’idiome hébreu de parenté et d’organisation sociale sans imposer une interprétation plus étroite.
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: Ils parcoururent
  rationale: Dans ce contexte narratif, סבב décrit un déplacement à travers une région pour accomplir une mission. « Parcoururent » exprime naturellement cette circulation dans tout Juda.
- source_word: בִּיהוּדָה
  choice: Juda
  rationale: Nom géographique rendu selon la forme française traditionnelle.
- source_word: וַיִּקְבְּצוּ
  choice: rassemblèrent
  rationale: קבץ signifie réunir des personnes dispersées ; « rassemblèrent » convient directement aux Lévites et aux chefs mentionnés.
- source_word: אֶת־הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation tribale et cultuelle rendue par son équivalent français établi.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: de toutes les villes de Juda
  rationale: La préposition מִן indique ici la provenance, et כָּל étend celle-ci à l’ensemble des villes de Juda.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: ainsi que les chefs des maisons ancestrales
  rationale: L’expression désigne les responsables des unités familiales ou claniques. « Maisons ancestrales » conserve la texture institutionnelle de l’hébreu tout en restant compréhensible ; « ainsi que » rend clairement la coordination des deux groupes rassemblés.
- source_word: לְיִשְׂרָאֵל
  choice: d’Israël
  rationale: Le לְ marque ici l’appartenance ou la relation. « D’Israël » conserve sans la restreindre la désignation explicitement employée par le texte.
- source_word: וַיָּבֹאוּ אֶל יְרוּשָׁלִָם
  choice: puis ils vinrent à Jérusalem
  rationale: בוא avec אֶל signifie normalement « venir à ». « Puis » exprime la progression narrative portée par le waw consécutif sans modifier le contenu de l’action.
theological_decisions:
- issue: Portée du nom « Israël » dans un récit centré sur Juda
  choice: Conserver « Israël » sans le remplacer par « Juda » ni par une paraphrase.
  alternative: « Juda » ou « le peuple d’Israël »
  rationale: L’hébreu porte explicitement יִשְׂרָאֵל. Dans les Chroniques, ce nom peut viser le peuple de l’alliance dans son ensemble, même dans un cadre lié au royaume du Sud. Le conserver maintient la terminologie et l’ambiguïté théologique du texte.
- issue: Interprétation de l’expression de parenté רָאשֵׁי הָאָבוֹת
  choice: « chefs des maisons ancestrales » dans le texte, avec une note explicative
  alternative: « chefs de famille » ou, plus littéralement, « chefs des pères »
  rationale: La formule renvoie à des unités familiales ou claniques et à leurs responsables. Le choix retenu préserve sa dimension institutionnelle sans imposer une définition trop étroite.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre historique biblique sans être archaïque. La syntaxe demeure fluide, tandis que « maisons ancestrales » conserve la portée administrative et généalogique de l’expression hébraïque.
