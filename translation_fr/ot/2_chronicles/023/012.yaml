  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֗הוּ אֶת ק֤וֹל הָ/עָם֙ הָֽ/רָצִ֔ים וְ/הַֽ/מְהַֽלְלִ֖ים אֶת הַ/מֶּ֑לֶךְ וַ/תָּב֥וֹא אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: fr
  text: Lorsqu’Athalie entendit le bruit du peuple qui accourait et acclamait le roi, elle se rendit auprès du peuple dans la maison de l’Éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל
  choice: le bruit
  rationale: Dans ce contexte de foule en mouvement et en acclamation, « bruit » rend naturellement le son collectif perceptible par Athalie.
- source_word: הָֽרָצִ֔ים
  choice: qui accourait
  rationale: Le participe décrit le peuple en train de courir; « accourait » exprime en français naturel un déplacement rapide vers le lieu de rassemblement.
- source_word: הַֽמְהַֽלְלִ֖ים
  choice: acclamait
  rationale: Le verbe signifie littéralement « louer », mais avec le roi comme objet, il désigne ici l’éloge public ou l’acclamation du roi.
- source_word: בֵּ֥ית יְהוָֽה
  choice: la maison de l’Éternel
  rationale: « Maison » conserve l’expression hébraïque usuelle pour le temple; « l’Éternel » est une représentation française traditionnelle et immédiatement reconnaissable du tétragramme.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: l’Éternel
  alternative: Yahvé / le SEIGNEUR
  rationale: « L’Éternel » offre une formulation française digne et courante sans imposer dans le corps du texte une vocalisation reconstruite du nom divin.
- issue: Sens de הלל appliqué au roi
  choice: acclamait le roi
  alternative: louait le roi
  rationale: « Acclamer » convient au cadre d’intronisation et évite que « louer » soit compris ici exclusivement comme un acte cultuel, tout en gardant l’idée d’éloge public.
translation_notes:
  register: Français international moderne, narratif et digne. Le singulier collectif « le peuple » commande ici les verbes au singulier. La phrase reste proche de la structure hébraïque tout en évitant une formulation raide.
