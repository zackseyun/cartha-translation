  text: וַ/יִּשְׂמְח֥וּ כָל עַם הָ/אָ֖רֶץ וְ/הָ/עִ֣יר שָׁקָ֑טָה וְ/אֶת עֲתַלְיָ֖הוּ הֵמִ֥יתוּ בֶ/חָֽרֶב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: fr
  text: Tout le peuple du pays se réjouit, et la ville fut calme. Ils mirent Athalie à mort par l’épée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se réjouit
  rationale: Le verbe שׂמח exprime la joie. Le singulier français s’accorde naturellement avec le collectif « tout le peuple ».
- source_word: כָל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Cette formulation conserve l’expression hébraïque et désigne l’ensemble de la population du pays sans préciser davantage son statut.
- source_word: וְהָעִיר שָׁקָטָה
  choice: et la ville retrouva le calme
  rationale: שׁקט décrit un état de tranquillité ou d’apaisement. « Retrouva le calme » exprime naturellement en français le retour à la tranquillité après les troubles du contexte, tout en gardant « la ville » sans expliciter Jérusalem.
- source_word: וְאֶת־עֲתַלְיָהוּ הֵמִיתוּ
  choice: Ils mirent Athalie à mort
  rationale: Le hifil de מות signifie « faire mourir », donc idiomatiquement « mettre à mort ». Une phrase distincte reproduit sobrement la coordination hébraïque sans imposer un lien causal.
- source_word: בֶחָרֶב
  choice: par l’épée
  rationale: La préposition ב marque ici le moyen. « Par l’épée » conserve l’image concrète et convient au registre narratif.
