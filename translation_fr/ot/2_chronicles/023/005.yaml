  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: fr
  text: un tiers à la maison du roi, un tiers à la porte de la Fondation[a], et tout le peuple dans les cours de la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la porte de la fondation ». L’hébreu peut conserver le nom d’une porte particulière, ici rendu par « porte de la Fondation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: un tiers
  rationale: L’ordinal féminin substantivé exprime ici la répartition du groupe en tiers. « Un tiers » est naturel en français moderne.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: à la maison du roi
  rationale: בֵּית désigne littéralement la « maison » et, dans ce contexte, la résidence royale. « À » convient à l’affectation des postes sans préciser indûment si le groupe se trouve à l’intérieur.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: à la porte de la Fondation
  rationale: שַׁעַר signifie « porte » et יְסוֹד « fondation ». La majuscule présente l’expression comme le nom propre probable d’une porte tout en conservant son sens lexical.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: Traduction directe et naturelle de עָם dans ce récit.
- source_word: בְּחַצְרוֹת
  choice: dans les cours
  rationale: Le pluriel de חָצֵר désigne les espaces ouverts et clos du complexe du sanctuaire; « cours » est précis et usuel en contexte cultuel.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La formulation conserve l’image hébraïque de la « maison » et rend explicitement le nom divin יהוה par « Yahvé ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahvé » représente en français le nom personnel divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe fragmentaire est conservée, car le verset poursuit la répartition commencée au verset précédent. « Maison du roi » reste proche de l’hébreu; « palais royal » serait plus explicatif. Aucun appel de note n’est nécessaire ici.
