  text: וַ/יָּבֹ֨אוּ כָל הָ/עָ֤ם בֵּית הַ/בַּ֨עַל֙ וַֽ/יִּתְּצֻ֔/הוּ וְ/אֶת מִזְבְּחֹתָ֥י/ו וְ/אֶת צְלָמָ֖י/ו שִׁבֵּ֑רוּ וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֥י הַֽ/מִּזְבְּחֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: fr
  text: Alors tout le peuple se rendit au temple de Baal et le démolit. Ils brisèrent ses autels et ses images, et tuèrent Mattân, le prêtre de Baal, devant les autels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: le temple de Baal
  rationale: Dans ce contexte cultuel, בֵּית désigne l’édifice consacré à Baal; « temple » est plus naturel et précis en français que le calque « maison ».
- source_word: וַיִּתְּצֻהוּ
  choice: le démolit
  rationale: Le verbe exprime ici la destruction de l’édifice; « démolir » rend clairement l’action sans ajout explicatif.
- source_word: מִזְבְּחֹתָיו
  choice: ses autels
  rationale: Le suffixe masculin singulier renvoie naturellement à Baal, comme dans « ses statues ».
- source_word: צְלָמָיו
  choice: ses statues
  rationale: צֶלֶם désigne des représentations matérielles; « statues » convient au contexte cultuel et reste accessible en français moderne.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: devant les autels
  rationale: Traduction directe de la relation spatiale exprimée par לִפְנֵי, sans préciser davantage lequel ou lesquels.
theological_decisions:
- issue: Référent des suffixes dans « ses autels et ses statues »
  choice: Baal
  alternative: le temple de Baal
  rationale: 'La morphologie permet grammaticalement un antécédent masculin singulier, mais le sens cultuel favorise Baal: ce sont les autels et représentations qui lui appartiennent ou lui sont consacrés.'
- issue: Nature des צְלָמִים
  choice: statues
  alternative: images
  rationale: « Statues » exprime concrètement les objets cultuels détruits, sans introduire une terminologie confessionnelle comme « idoles ».
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque répétitive est légèrement allégée pour une lecture naturelle, tout en conservant l’ordre des actions et tous les éléments du verset.
