  verdict: revise
  source_fidelity: 'Le sens directif de l’hébreu est bien rendu : les Lévites doivent entourer le roi, armés, l’intrus qui entre dans la maison est mis à mort, et ils doivent accompagner le roi à ses entrées et sorties. « Maison » avec majuscule introduit toutefois une interprétation cultuelle dans le texte principal, alors que הַבַּיִת signifie littéralement « la maison » ; le renvoi permet précisément de signaler le sens contextuel de temple.'
  naturalness: Le français est globalement naturel et de registre convenable. « Chacun ses armes à la main » est compréhensible, mais « chacun, les armes à la main » est plus idiomatique et évite l’ellipse possessive un peu heurtée.
  terminology: « Lévites », « roi », « armes », « sera mis à mort » et « auprès du roi » sont appropriés. Il convient de mettre « maison » en minuscule afin de ne pas présenter comme explicite dans le texte ce que la note donne comme alternative contextuelle.
