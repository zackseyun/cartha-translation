base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: fr
  text: Les Lévites entoureront le roi de tous côtés, chacun, les armes à la main. Quiconque entrera dans la maison[a] sera mis à mort. Restez auprès du roi quand il entrera et quand il sortira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Temple » ; littéralement « la maison », désignation courante du Temple dans les Chroniques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת־הַמֶּלֶךְ סָבִיב
  choice: Les Lévites entoureront le roi de tous côtés
  rationale: Le hiphil exprime ici une consigne dans les instructions de Yehoyada. Le futur français convient à cette valeur directive, tandis que « de tous côtés » rend l’idée d’un encerclement complet.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: chacun ses armes à la main
  rationale: אִישׁ a une valeur distributive. Dans ce contexte de garde armée, כֵלָיו désigne des armes plutôt que des objets ou ustensiles.
- source_word: וְהַבָּא אֶל־הַבַּיִת
  choice: Quiconque entrera dans la Maison
  rationale: Le participe avec article a une portée générale. La majuscule à « Maison » conserve le terme hébreu tout en signalant son emploi comme désignation du sanctuaire dans les Chroniques.
- source_word: יוּמָת
  choice: sera mis à mort
  rationale: Le hophal exprime une mise à mort subie, et non simplement le fait de mourir.
- source_word: וִהְיוּ אֶת־הַמֶּלֶךְ
  choice: Restez auprès du roi
  rationale: La tournure exprime la présence attentive des gardes auprès du roi. « Restez auprès de » est naturel en français et convient au contexte de protection.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: quand il entrera et quand il sortira
  rationale: La formulation reproduit clairement le parallélisme hébreu décrivant les déplacements du roi.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le futur garde la force des consignes, et « la Maison » préserve la formulation hébraïque sans masquer son sens contextuel.
