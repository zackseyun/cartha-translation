  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: fr
  text: 'Alors le prêtre Yehoyada fit sortir les chefs de centaines, responsables de l’armée, et leur dit : « Faites-la sortir entre les rangs[a]. Si quelqu’un la suit, qu’il soit mis à mort par l’épée. » En effet, le prêtre avait dit : « Ne la mettez pas à mort dans la maison de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’extérieur des rangées ». L’expression hébraïque est difficile ; elle évoque probablement la sortie d’Athalie à travers ou entre des rangs disposés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: fit venir
  rationale: Le hiphil de יצא signifie faire sortir ou amener. Dans ce contexte, Yehoyada fait comparaître les officiers afin de leur donner ses ordres ; « fit venir » est naturel en français et n’implique pas qu’il les expulse.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: les chefs de centaines
  rationale: Cette désignation militaire suit de près la structure hébraïque sans introduire les connotations romaines de « centurions ».
- source_word: פְּקוּדֵי הַחַיִל
  choice: responsables de l’armée
  rationale: Le participe de פקד désigne ici des hommes chargés d’une fonction à l’égard de la force militaire. Cette formulation rend leur responsabilité officielle sans préciser excessivement la nature exacte de leur nomination.
- source_word: הוֹצִיאוּהָ
  choice: Faites-la sortir
  rationale: L’impératif hiphil pluriel avec suffixe féminin singulier ordonne de faire sortir Athalie.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: entre les rangs
  rationale: La tournure hébraïque est difficile. Dans ce cadre militaire et cultuel, שׂדרות désigne vraisemblablement des rangées ou des rangs disposés ; la note conserve l’incertitude.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: Si quelqu’un la suit
  rationale: Le participe avec אחריה vise toute personne venant à sa suite, probablement pour la soutenir. La formulation française reste ouverte quant au motif exact.
- source_word: יוּמַת בֶּחָרֶב
  choice: qu’il soit mis à mort par l’épée
  rationale: Le passif à valeur injonctive exprime un ordre d’exécution et garde ici un registre formel.
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: En effet, le prêtre avait dit
  rationale: כי introduit l’explication de l’ordre précédent, et le plus-que-parfait marque naturellement en français l’instruction donnée auparavant.
- source_word: לֹא תְמִיתוּהָ
  choice: Ne la mettez pas à mort
  rationale: Le hiphil de מות est causatif. « Mettre à mort » préserve le ton formel de l’interdiction.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque בית יהוה, tandis que le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre et suit la convention indiquée dans la couche de consultation, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et direct. Les titres militaires sont rendus sans archaïsme ni connotation romaine. La difficulté de l’expression relative aux rangées est signalée plutôt que résolue silencieusement.
