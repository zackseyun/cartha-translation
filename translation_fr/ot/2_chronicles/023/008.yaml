  text: וַ/יַּעֲשׂ֨וּ הַ/לְוִיִּ֜ם וְ/כָל יְהוּדָ֗ה כְּ/כֹ֣ל אֲשֶׁר צִוָּה֮ יְהוֹיָדָ֣ע הַ/כֹּהֵן֒ וַ/יִּקְחוּ֙ אִ֣ישׁ אֶת אֲנָשָׁ֔י/ו בָּאֵ֣י הַ/שַּׁבָּ֔ת עִ֖ם יוֹצְאֵ֣י הַ/שַּׁבָּ֑ת כִּ֣י לֹ֥א פָטַ֛ר יְהוֹיָדָ֥ע הַ/כֹּהֵ֖ן אֶת הַֽ/מַּחְלְקֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: fr
  text: Les Lévites et tout Juda exécutèrent tout ce que le prêtre Yehoyada avait ordonné. Chacun prit ses hommes, aussi bien ceux qui entraient en service le jour du sabbat que ceux qui en sortaient, car le prêtre Yehoyada n’avait pas renvoyé les groupes de service[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les classes » ou « les équipes de service » : il s’agit des groupes de prêtres et de Lévites qui servaient à tour de rôle selon un calendrier établi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כְּכֹל אֲשֶׁר צִוָּה
  choice: exécutèrent tout ce que ... avait ordonné
  rationale: Cette formulation française naturelle exprime l’obéissance complète indiquée par כְּכֹל אֲשֶׁר, tout en respectant l’antériorité de l’ordre donné.
- source_word: הַלְוִיִּם וְכָל יְהוּדָה
  choice: Les Lévites et tout Juda
  rationale: « Les Lévites » est la désignation usuelle du groupe cultuel. « Tout Juda » conserve l’expression collective et métonymique de l’hébreu sans l’expliciter indûment.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: le prêtre Yehoyada
  rationale: Le titre est rendu dans l’ordre français naturel et le nom hébreu est translittéré directement.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: Chacun prit ses hommes
  rationale: אִישׁ a ici une valeur distributive. « Ses hommes » reste proche du texte et évite de préciser s’il s’agit de soldats ou de personnel cultuel.
- source_word: בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת
  choice: aussi bien ceux qui entraient en service le jour du sabbat que ceux qui en sortaient
  rationale: La tournure rend le contraste entre les équipes entrantes et sortantes. L’ajout contextuel « en service » explicite sobrement le changement de rotation impliqué par les participes.
- source_word: כִּי לֹא פָטַר
  choice: car ... n’avait pas renvoyé
  rationale: כִּי introduit la raison de la présence simultanée des deux groupes. Dans ce contexte, פטר signifie laisser partir ou relever de son service.
- source_word: הַמַּחְלְקוֹת
  choice: les groupes de service
  rationale: Le terme désigne des unités organisées selon une rotation sacerdotale ou lévitique. « Groupes de service » est plus immédiatement compréhensible que « classes » et moins ambigu que « divisions » en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve « tout Juda » et « ses hommes », qui reflètent les formulations collectives et relativement ouvertes de l’hébreu, tandis que « entraient en service » et « groupes de service » rendent clairement le système de rotations.
