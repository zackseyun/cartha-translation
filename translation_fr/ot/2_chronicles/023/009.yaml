  text: וַ/יִּתֵּן֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י הַ/מֵּא֗וֹת אֶת הַֽ/חֲנִיתִים֙ וְ/אֶת הַ/מָּגִנּוֹת֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑יד אֲשֶׁ֖ר בֵּ֥ית הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: fr
  text: Le prêtre Joïada remit aux chefs de centaines[a] les lances, les boucliers et les grands boucliers[b] qui appartenaient au roi David et qui se trouvaient dans la maison de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les chefs des centaines »; il s’agit d’officiers placés à la tête d’unités de cent hommes.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici deux termes distincts pour désigner les boucliers; le second est rendu par « grands boucliers ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le temple de Dieu ». Littéralement : « la maison de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: remit
  rationale: Dans ce contexte, נָתַן décrit la remise d’armes aux responsables militaires. « Remit » exprime naturellement ce transfert sans suggérer nécessairement un don.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: le prêtre Joïada
  rationale: Le nom propre suit sa forme française traditionnelle et le titre apposé est rendu dans un ordre naturel en français.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: aux chefs de centaines
  rationale: L’expression désigne des officiers placés à la tête d’unités de cent hommes. Cette formulation conserve la structure militaire hébraïque sans évoquer le grade romain de centurion.
- source_word: הַחֲנִיתִים
  choice: les lances
  rationale: « Lances » est un équivalent français courant et clair du nom d’arme חֲנִיתִים.
- source_word: הַמָּגִנּוֹת
  choice: les boucliers
  rationale: מָגֵן est le terme général désignant un bouclier.
- source_word: הַשְּׁלָטִים
  choice: les grands boucliers
  rationale: Le terme désigne vraisemblablement une autre catégorie de boucliers, probablement plus grands, distincte des מָגִנּוֹת mentionnés juste avant.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: qui appartenaient au roi David
  rationale: La proposition relative exprime simplement la possession; l’imparfait convient au cadre narratif sans ajouter la nuance d’un plus-que-parfait.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction littérale préserve la manière dont le Chroniste désigne ici le temple.
theological_decisions: []
