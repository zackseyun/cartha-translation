  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עוֹמֵ֨ד עַֽל עַמּוּד֜/וֹ בַּ/מָּב֗וֹא וְ/הַ/שָּׂרִ֣ים וְ/הַ/חֲצֹצְרוֹת֮ עַל הַ/מֶּלֶךְ֒ וְ/כָל עַ֨ם הָ/אָ֜רֶץ שָׂמֵ֗חַ וְ/תוֹקֵ֨עַ֙ בַּ/חֲצֹ֣צְר֔וֹת וְ/הַ/מְשֽׁוֹרֲרִים֙ בִּ/כְלֵ֣י הַ/שִּׁ֔יר וּ/מוֹדִיעִ֖ים לְ/הַלֵּ֑ל וַ/תִּקְרַ֤ע עֲתַלְיָ֨הוּ֙ אֶת בְּגָדֶ֔י/הָ וַ/תֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: fr
  text: 'Elle regarda, et voici : le roi se tenait près de sa colonne, à l’entrée. Les chefs et les sonneurs de trompettes étaient auprès du roi[a]. Tout le peuple du pays était dans la joie et sonnait des trompettes, tandis que les chanteurs, avec les instruments de musique, conduisaient la louange[b]. Alors Athalie déchira ses vêtements et dit : « Complot ! Complot ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les chefs et les trompettes auprès du roi ». « Trompettes » peut désigner ici, par métonymie, ceux qui en jouent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dirigeaient la louange » ou « donnaient le signal pour louer ». L’expression hébraïque est inhabituelle dans ce contexte musical.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Elle regarda, et voici
  rationale: « Regarda » introduit naturellement la perception soudaine, tandis que « et voici » conserve la force vive et déictique de הִנֵּה.
- source_word: הַמֶּלֶךְ עוֹמֵד עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: le roi se tenait près de sa colonne, à l’entrée
  rationale: Le verbe français « se tenait » rend la valeur descriptive du participe עוֹמֵד. « Près de sa colonne » exprime ici l’association locative probable de עַל sans suggérer que le roi se trouvait dessus.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: Les chefs et les trompettes étaient auprès du roi
  rationale: La formulation conserve le texte massorétique, qui mentionne littéralement les « trompettes », probablement par métonymie pour ceux qui en jouent. שָׂרִים est rendu par « chefs », terme assez large pour des responsables civils ou militaires.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: Tout le peuple du pays était dans la joie et sonnait des trompettes
  rationale: Cette formulation restitue les prédicats participiaux/adjectivaux comme une scène en cours et garde l’expression caractéristique « peuple du pays ».
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: les chanteurs, avec les instruments de musique
  rationale: מְשׁוֹרֲרִים désigne précisément les chanteurs. « Instruments de musique » est plus naturel en français actuel que le calque « instruments de chant ».
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: conduisaient la louange
  rationale: Dans ce cadre musical et liturgique, le hiphil de ידע paraît indiquer que les chanteurs dirigeaient ou donnaient le signal de la louange; « conduisaient » reste naturel tout en laissant ouverte la nuance exacte.
- source_word: וַתֹּאמֶר
  choice: cria
  rationale: Bien que le verbe signifie littéralement « dit », le contexte de la déchirure des vêtements et la double exclamation justifie en français narratif le verbe de parole « cria ».
- source_word: קֶשֶׁר קָשֶׁר
  choice: Complot ! Complot !
  rationale: « Complot » rend directement l’accusation de conspiration politique et préserve sa répétition emphatique.
