base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: fr
  text: 'Voici ce que vous ferez : un tiers d’entre vous, parmi les prêtres et les lévites qui prennent leur service le jour du sabbat, sera chargé de garder les seuils.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sera portier des seuils »; autrement : « gardera les entrées » . L’expression hébraïque associe les portiers aux seuils et souligne la surveillance des accès.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Voici ce que vous ferez
  rationale: Formule introductive naturelle en français moderne, qui conserve la force directive du futur hébreu.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: un tiers d’entre vous
  rationale: 'Rend clairement la relation partitive : un tiers est choisi au sein du groupe auquel Yehoyada s’adresse.'
- source_word: בָּאֵי הַשַּׁבָּת
  choice: qui prennent leur service le jour du sabbat
  rationale: Dans ce contexte d’organisation des gardes, le participe « ceux qui entrent le sabbat » désigne ceux qui arrivent pour assurer leur tour de service; cette formulation transmet naturellement cette valeur contextuelle.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: parmi les prêtres et les lévites
  rationale: Exprime l’identification partitive du groupe concerné sans alourdir la phrase française.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: sera chargé de garder les seuils
  rationale: Rend la fonction des portiers et leur affectation aux seuils dans un français idiomatique, tout en conservant l’image concrète des entrées gardées.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour éviter que « parmi les prêtres et les lévites » ne paraisse modifier « sabbat ». Le vocabulaire du service et de la garde explicite sobrement le contexte cultuel sans ajouter de précision confessionnelle.
