  text: וַ/יִּכְרֹ֤ת יְהוֹיָדָע֙ בְּרִ֔ית בֵּינ֕/וֹ וּ/בֵ֥ין כָּל הָ/עָ֖ם וּ/בֵ֣ין הַ/מֶּ֑לֶךְ לִ/הְי֥וֹת לְ/עָ֖ם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: fr
  text: Puis Joïada conclut une alliance[a] entre lui-même, tout le peuple et le roi, afin qu’ils soient le peuple de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupa une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « afin d’être un peuple pour Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת בְּרִית
  choice: conclut une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». « Conclure une alliance » en donne le sens idiomatique dans un français naturel et soutenu, tandis que « Puis » rend la progression narrative du waw consécutif.
- source_word: יְהוֹיָדָע
  choice: Joad
  rationale: Forme française traditionnelle et courante du nom hébreu Yehoyada dans le contexte biblique.
- source_word: בֵּינוֹ וּבֵין כָּל הָעָם וּבֵין הַמֶּלֶךְ
  choice: entre lui-même, tout le peuple et le roi
  rationale: 'La formulation conserve les trois parties explicitement énumérées dans l’hébreu : Joad, tout le peuple et le roi. « Lui-même » clarifie que le pronom renvoie à Joad sans ajouter Yahweh parmi les parties contractantes.'
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: afin qu’ils soient le peuple de Yahweh
  rationale: L’infinitif exprime ici le but de l’alliance. « Le peuple de Yahweh » rend naturellement en français l’appartenance et la vocation liées à l’alliance, tout en laissant la tournure hébraïque plus littérale en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa fonction de nom propre dans le texte hébreu.
theological_decisions:
- issue: Identité des parties à l’alliance
  choice: Joad, tout le peuple et le roi sont les parties énumérées
  alternative: Comprendre Yahweh comme une partie explicitement nommée à l’alliance
  rationale: La syntaxe hébraïque place après « entre » Joad lui-même, tout le peuple et le roi. Yahweh apparaît dans la proposition de but comme celui auquel le peuple doit appartenir, et non comme une quatrième partie explicitement coordonnée.
- issue: Portée de la proposition de but
  choice: « afin qu’ils soient le peuple de Yahweh »
  alternative: « afin d’être un peuple pour Yahweh »
  rationale: Le rendu principal exprime en français courant la relation d’appartenance propre à la formule d’alliance. La note conserve la structure plus littérale, qui peut aussi souligner la vocation du peuple envers Yahweh.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l’ordre des participants dans l’hébreu et emploie le vocabulaire biblique courant « conclure une alliance » sans archaïsme inutile.
