source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: fr
  text: 'La septième année, Jehoïada s’affermit et conclut une alliance avec les chefs de centaines[a] : Azaria, fils de Jéroham, Ismaël, fils de Jehohanân, Azaria, fils d’Obed, Maaséya, fils d’Adaya, et Élishaphat, fils de Zikri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « prit les chefs de centaines avec lui dans l’alliance ». La formulation exprime que Jehoïada les rallia à un pacte avec lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: La septième année
  rationale: Le syntagme situe l’action dans le temps. Le « et » initial n’est pas exprimé, conformément à l’usage narratif naturel en français.
- source_word: הִתְחַזַּק
  choice: s’affermit
  rationale: 'Le hitpael de חזק porte ici une nuance réfléchie : Jehoïada se rend fort, prend courage et se résout à agir. « S’affermit » conserve cette nuance sans réduire le sens à la seule émotion.'
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: engagea avec lui dans une alliance
  rationale: La construction hébraïque associe « prendre » à « avec lui » et « dans l’alliance ». En français courant, « engager avec lui dans une alliance » communique que Jehoïada rallie ces officiers à un pacte, tout en maintenant la relation syntaxique entre les hommes pris et l’alliance.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: les chefs de centaines
  rationale: Titre militaire désignant des responsables d’unités de cent hommes. Cette formulation reste transparente et évite l’association romaine que pourrait susciter « centurions ».
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Azaria… Ismaël… Azaria… Maaséya… et Élishaphat
  rationale: Les noms sont translittérés sous des formes lisibles en français, et la répétition du nom Azaria est conservée.
- source_word: בֶן
  choice: fils de
  rationale: Formule patronymique française habituelle.
theological_decisions:
- issue: Nature de la בְּרִית
  choice: une alliance
  alternative: l’alliance
  rationale: L’article hébreu peut renvoyer à un pacte déterminé par la situation, mais le contexte immédiat introduit cet accord. L’indéfini français exprime naturellement l’établissement de ce pacte sans lui attribuer une identité théologique plus précise que ne le fait le verset.
translation_notes:
  register: Français moderne, digne et accessible. « S’affermit » préserve la forme réfléchie de l’hébreu; « engagea avec lui dans une alliance » explicite sobrement une construction hébraïque difficile à reproduire littéralement. Les patronymes sont ponctués pour une lecture fluide.
