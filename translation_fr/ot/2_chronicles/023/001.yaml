    issue: Construction française de « engagea avec lui dans une alliance »
    rationale: Cette construction n’est pas naturelle et ne rend pas nettement l’acte de conclure une alliance. « Conclut une alliance avec » exprime idiomatiquement le sens contextuel de la construction hébraïque, sans ajout doctrinal.
  - severity: low
