review_pass:
  verdict: revise
  source_fidelity: Le verset hébreu dit que Jehoïada « s’affermit » puis prit les chefs de centaines avec lui « dans l’alliance ». Dans ce contexte, et en accord avec le parallèle de 2 Rois 11:4, le sens est qu’il conclut un pacte avec ces officiers. La liste des cinq hommes et leurs patronymes est correctement conservée.
  naturalness: « S’affermit » convient à un registre biblique moderne et garde la nuance réflexive. En revanche, « engagea avec lui dans une alliance les chefs de centaines » est syntaxiquement lourd et peu idiomatique en français; il peut aussi suggérer qu’il les engagea à son service plutôt qu’il ne fit alliance avec eux.
  terminology: « Chefs de centaines » rend clairement le titre militaire sans anachronisme romain. « Alliance » est un bon rendu de בְּרִית sans imposer une identification théologique du pacte. Les formes des noms sont conservées telles qu’employées dans le projet.
