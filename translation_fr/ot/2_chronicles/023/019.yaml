  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: fr
  text: Il plaça les gardiens aux portes de la maison de Yahvé, afin qu’aucune personne impure à quelque titre que ce soit[a] n’y entre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’aucun impur, en quoi que ce soit, n’entre ». L’expression est large et peut viser toute forme d’impureté ou toute cause d’impureté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il plaça
  rationale: Le hiphil de עמד exprime ici l’action de faire prendre position. « Il plaça » est naturel en français et convient à l’affectation de gardiens à leur poste.
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens
  rationale: Dans le contexte des portes du temple, le terme désigne les préposés chargés d’en surveiller l’accès. « Gardiens » est courant et précis en français moderne.
- source_word: עַל שַׁעֲרֵי
  choice: aux portes de
  rationale: Avec un verbe de placement, עַל indique ici le lieu où les gardiens prennent position. « Aux portes de » rend idiomatiquement cette relation spatiale.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: « Maison » conserve l’image hébraïque de בַּיִת, tandis que « Yahvé » représente directement le nom divin יהוה.
- source_word: וְלֹא יָבֹא
  choice: afin que… ne puisse y entrer
  rationale: Le waw suivi de l’imparfait négatif exprime naturellement ici le but recherché par le placement des gardiens. Le pronom « y » explicite en français l’entrée dans la maison de Yahvé sans ajouter de contenu substantiel.
- source_word: טָמֵא
  choice: personne impure
  rationale: טָמֵא désigne une personne en état d’impureté, notamment rituelle, dans ce contexte d’accès au sanctuaire. « Impure » est le terme français usuel.
- source_word: לְכָל דָּבָר
  choice: à quelque titre que ce soit
  rationale: L’expression littérale est large et quelque peu elliptique. Cette formulation française préserve sa portée générale sans limiter explicitement la cause ou la forme de l’impureté.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » conserve le nom propre dans le corps du texte, tandis que « le Seigneur » refléterait la tradition de substitution à la lecture.
- issue: Nature de l’impureté désignée par טָמֵא
  choice: Ne pas préciser « rituellement » dans le texte
  alternative: personne rituellement impure
  rationale: Le contexte du temple suggère fortement l’impureté rituelle, mais l’hébreu emploie simplement טָמֵא. La traduction garde donc la formulation non qualifiée et évite de résoudre plus explicitement que la source.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est rendue fluide sans effacer l’image de la « maison » ni la portée générale de l’expression hébraïque finale.
