base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: fr
  text: 'Toute l’assemblée conclut une alliance avec le roi dans la maison de Dieu. Puis Yehoyada leur dit : « Voici le fils du roi ! C’est lui qui régnera, comme l’Éternel l’a déclaré au sujet des descendants de David. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַקָּהָל
  choice: Toute l’assemblée
  rationale: Rend naturellement le groupe réuni dans son ensemble.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: conclut une alliance
  rationale: Équivalent français idiomatique de l’expression hébraïque littérale « couper une alliance ».
- source_word: עִם הַמֶּלֶךְ
  choice: avec le roi
  rationale: Conserve la désignation royale de Joas, bien qu’il soit encore enfant.
- source_word: הִנֵּה בֶן הַמֶּלֶךְ
  choice: Voici le fils du roi !
  rationale: « Voici » restitue la particule de présentation et l’exclamation rend la vigueur de l’annonce.
- source_word: יִמְלֹךְ
  choice: C’est lui qui régnera
  rationale: Exprime l’emphase contextuelle de la proclamation sans ajouter une modalité étrangère au texte.
- source_word: עַל בְּנֵי דָוִיד
  choice: au sujet des descendants de David
  rationale: Dans ce contexte dynastique, בנים vise la lignée de David plutôt que ses seuls fils immédiats.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Forme française traditionnelle et intelligible représentant le nom divin.
theological_decisions:
- issue: Référent du sujet de וַיֹּאמֶר (« il dit »)
  choice: Yehoyada
  alternative: il
  rationale: Le sujet grammatical est implicite, mais Yehoyada est clairement l’orateur dans le contexte immédiat (v. 1-2) ; le nom évite en français une ambiguïté artificielle avec « le roi ».
- issue: Portée de la promesse davidique
  choice: comme l’Éternel l’a déclaré au sujet des descendants de David
  alternative: comme l’Éternel l’a déclaré aux descendants de David
  rationale: La préposition עַל signifie ici « au sujet de / concernant » ; cette traduction préserve la référence générale à la dynastie sans préciser indûment une promesse adressée directement à chacun de ses membres.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour éviter que le pronom « il » ne semble renvoyer au roi. Aucun marqueur de note n’est nécessaire.
