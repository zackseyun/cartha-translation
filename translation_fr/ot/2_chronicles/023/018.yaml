source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: fr
  text: Yehoyada confia les responsabilités de la maison de Yahweh[a] aux prêtres, les Lévites[b], que David avait répartis pour le service de la maison de Yahweh, afin qu’ils offrent à Yahweh des holocaustes, comme il est écrit dans la loi de Moïse, dans la joie et avec des chants, selon les directives de David[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « plaça les responsabilités de la maison de Yahweh dans la main des… » ; l’expression signifie qu’il leur en confia la responsabilité.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « les prêtres lévitiques » ou « les prêtres et les Lévites ». La construction hébraïque est ambiguë.'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « par la main de David ». L’expression peut désigner l’intervention de David ou les dispositions qu’il avait établies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: confia les fonctions
  rationale: Le verbe שׂים signifie littéralement « placer, établir » et פְּקֻדּוֹת désigne ici des charges ou fonctions cultuelles. « Confia les fonctions » exprime naturellement l’établissement de responsabilités administratives.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation conserve l’image hébraïque de la « maison » sans expliciter par « temple » ce que le texte laisse sous sa forme traditionnelle.
- source_word: בְּיַד
  choice: confia ... aux
  rationale: Littéralement « dans la main de », cet idiome marque la remise d’une responsabilité à quelqu’un. Le français idiomatique « confier à » en restitue la portée.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres, les Lévites
  rationale: La formulation appositionnelle reproduit au plus près la construction hébraïque et évite de trancher entre « les prêtres lévitiques » et « les prêtres et les Lévites ».
- source_word: חָלַק
  choice: avait répartis
  rationale: Le verbe signifie fondamentalement « diviser, répartir ». Il évoque ici l’organisation par David des personnels du culte en groupes de service.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: afin qu’ils offrent ... des holocaustes
  rationale: Dans le vocabulaire sacrificiel, le hiphil de עלה avec עֹלוֹת désigne l’offrande de sacrifices entièrement consumés, traditionnellement appelés « holocaustes » en français biblique.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: comme il est écrit dans la loi de Moïse
  rationale: Cette traduction conserve la formule de référence à l’instruction écrite mosaïque dans un français clair et solennel.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: dans la joie et par des chants
  rationale: Les deux noms décrivent la manière dont le service cultuel devait être accompli. Cette tournure est naturelle en français tout en préservant les deux éléments.
- source_word: עַל יְדֵי דָוִיד
  choice: selon les directives de David
  rationale: L’expression signifie littéralement « par la main de David » et peut exprimer son intervention ou l’organisation prescrite par lui. Dans ce contexte liturgique, les directives de David constituent le sens le plus probable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » rend le nom divin יהוה comme nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve sa fonction de nom propre.
- issue: Rapport entre « les prêtres » et « les Lévites »
  choice: les prêtres, les Lévites
  alternative: les prêtres lévitiques ; les prêtres et les Lévites
  rationale: La construction hébraïque admet plusieurs analyses. La formulation retenue conserve cette tension institutionnelle sans imposer une interprétation.
- issue: Portée de עַל יְדֵי דָוִיד
  choice: selon les directives de David
  alternative: par l’intermédiaire de David ; de la main de David
  rationale: Le contexte évoque vraisemblablement l’organisation davidique du culte, mais l’expression hébraïque peut aussi indiquer plus directement l’agent ou l’intermédiaire; une note garde cette possibilité visible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement fluidifiée pour éviter un calque lourd, tout en conservant « maison de Yahweh », l’ambiguïté de « les prêtres, les Lévites » et la nuance administrative de la dernière expression.
