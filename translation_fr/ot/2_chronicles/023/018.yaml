  source_fidelity: 'Le sens général est fidèle : Yehoyada confie l’administration du sanctuaire au personnel sacerdotal/lévitique, conformément à la Torah de Moïse et à l’organisation davidique. Cependant, « que David avait répartis pour la maison » est peu idiomatique en français et ne rend pas clairement la répartition des personnes en vue du service de la maison.'
