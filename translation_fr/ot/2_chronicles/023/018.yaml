  terminology: « Yahweh », « maison de Yahweh », « holocaustes », « loi de Moïse » et le maintien prudent de « les prêtres, les Lévites » conviennent. « Responsabilités » rend פְּקֻדּוֹת plus naturellement que « fonctions » dans cette construction administrative.
