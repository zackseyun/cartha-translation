  text: He began to build in the second month[a], on the second day, in the fourth year of his reign.
translation:
  language: fr
  text: Il commença à bâtir au deuxième mois, le deuxième jour[a], dans la quatrième année de son règne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « au deuxième mois, au deuxième » ; la dernière expression est habituellement comprise comme « le deuxième jour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Il commença
  rationale: Le hifil narratif de חלל exprime ici le commencement de l’action. Le pronom renvoie naturellement à Salomon dans le contexte, et la conjonction narrative n’a pas besoin d’être rendue en français.
- source_word: לִבְנוֹת
  choice: à bâtir
  rationale: L’infinitif de בנה désigne l’action de construire. « Bâtir » convient au registre digne du récit et à la construction du Temple.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: du deuxième mois
  rationale: Dans la formulation française complète « le deuxième jour du deuxième mois », cette expression indique clairement le mois concerné tout en restant proche de l’hébreu.
- source_word: בַּשֵּׁנִי
  choice: le deuxième jour
  rationale: L’ordinal répété est elliptique en hébreu et se comprend couramment comme une indication du jour du mois. Le nom « jour » est explicité pour obtenir un français naturel.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: dans la quatrième année
  rationale: Il s’agit de la formule habituelle de datation selon les années de règne.
- source_word: לְמַלְכוּתוֹ
  choice: de son règne
  rationale: L’expression situe la date par rapport à l’exercice du pouvoir royal de Salomon. « Règne » est le terme français naturel dans cette formule chronologique.
