  text: וַ/יַּ֜עַשׂ בְּ/בֵֽית קֹ֤דֶשׁ הַ/קֳּדָשִׁים֙ כְּרוּבִ֣ים שְׁנַ֔יִם מַעֲשֵׂ֖ה צַעֲצֻעִ֑ים וַ/יְצַפּ֥וּ אֹתָ֖/ם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/010.yaml
  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: fr
  text: Dans le lieu très saint, il fit deux chérubins, ouvrage de sculpture[a], et ils les recouvrirent d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du mot hébreu rare traduit par « sculpture » est incertain. Autres traductions possibles : « ouvrage sculpté », « ouvrage taillé » ou « travail artistique ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Dans le lieu très saint
  rationale: Cette formulation française naturelle rend l’expression superlative hébraïque désignant la partie la plus sacrée et la plus intérieure du Temple, sans reproduire lourdement l’expression littérale « maison du Saint des saints ».
- source_word: כְּרוּבִים שְׁנַיִם
  choice: deux chérubins
  rationale: « Chérubins » est le terme français consacré pour ces êtres associés au sanctuaire et traduit directement le pluriel hébreu.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: ouvrage de sculpture[a]
  rationale: Le mot rare צַעֲצֻעִים paraît qualifier le genre d’ouvrage plutôt que désigner l’artisan. « Ouvrage de sculpture » rend cette apposition de façon intelligible tout en signalant l’incertitude lexicale dans une note.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: et ils les recouvrirent d’or
  rationale: Le verbe est explicitement au pluriel en hébreu, bien que les exécutants ne soient pas nommés. « Recouvrir d’or » exprime naturellement l’application d’un revêtement d’or.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « ils les recouvrirent » conserve le pluriel du texte hébreu et laisse les artisans non identifiés, tandis que la note maintient l’incertitude réelle du terme rare.
