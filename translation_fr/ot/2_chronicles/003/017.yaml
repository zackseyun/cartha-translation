  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: fr
  text: Il dressa les colonnes devant la grande salle du Temple[a], l’une à droite et l’autre à gauche. Il appela celle de droite Yakin, et celle de gauche Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la salle du Temple ». Ici, le mot hébreu hékal désigne la salle principale de l’édifice du Temple, et non nécessairement tout le complexe du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Il dressa
  rationale: Le hiphil de קום signifie ici faire tenir debout, donc mettre en place les colonnes. « Dresser » est naturel et précis dans ce contexte architectural.
- source_word: הָעַמּוּדִים
  choice: les colonnes
  rationale: עַמּוּדִים désigne des piliers ou des colonnes. « Colonnes » convient particulièrement à ces deux éléments architecturaux monumentaux placés devant le Temple.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: devant la grande salle du Temple[a]
  rationale: עַל־פְּנֵי exprime la position devant, tandis que הֵיכָל désigne ici la salle principale de l’édifice, et non nécessairement l’ensemble du complexe du Temple.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: l’une à droite et l’autre à gauche
  rationale: La traduction conserve les indications relatives du texte hébreu sans les convertir en points cardinaux, puisque l’orientation n’y est pas explicitée.
- source_word: וַיִּקְרָא שֵׁם
  choice: Il appela
  rationale: Dans ce contexte, l’idiome hébreu « appeler le nom » signifie attribuer un nom. « Il appela » reste proche de la formulation source tout en étant idiomatique en français.
- source_word: הַיְמִינִי
  choice: celle de droite
  rationale: L’adjectif désigne la colonne située du côté droit. Le féminin reprend naturellement « colonne ».
- source_word: יָכִין
  choice: Yakin
  rationale: Le nom propre est translittéré selon sa prononciation hébraïque et selon une graphie française moderne transparente.
- source_word: הַשְּׂמָאלִי
  choice: celle de gauche
  rationale: L’adjectif désigne la colonne située du côté gauche et forme un parallèle clair avec « celle de droite ».
- source_word: בֹּעַז
  choice: Boaz
  rationale: Cette forme traditionnelle française transmet clairement le nom propre hébreu בֹּעַז.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est légèrement resserrée pour éviter la tournure peu naturelle « appeler le nom de », tout en conservant le parallélisme des deux colonnes et les repères droite-gauche du texte hébreu.
