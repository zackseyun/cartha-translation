  text: וְ/אֵ֨לֶּה֙ הוּסַ֣ד שְׁלֹמֹ֔ה לִ/בְנ֖וֹת אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים הָ/אֹ֡רֶךְ אַמּ֞וֹת בַּ/מִּדָּ֤ה הָ/רִֽאשׁוֹנָה֙ אַמּ֣וֹת שִׁשִּׁ֔ים וְ/רֹ֖חַב אַמּ֥וֹת עֶשְׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: fr
  text: 'Voici les fondements que Salomon établit pour construire la maison de Dieu[a] : sa longueur, en coudées selon l’ancienne mesure[b], était de soixante coudées, et sa largeur de vingt coudées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici ce sur quoi Salomon se fonda pour construire la maison de Dieu. » L’hébreu rendu par « fondements ... établit » est difficile; il peut aussi désigner plus généralement les dispositions ou le plan de construction.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « selon l’ancienne mesure » peut désigner un ancien étalon de la coudée.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: les fondations que Salomon posa
  rationale: La forme issue de יסד est difficile dans cette construction. Cette traduction conserve l’idée de fondation et rend la phrase naturelle en français, sans la réduire à un simple « plan ».
- source_word: לִבְנוֹת
  choice: pour construire
  rationale: L’infinitif avec ל exprime ici le but.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette formulation conserve l’image hébraïque du temple comme maison de Dieu.
- source_word: הָאֹרֶךְ
  choice: sa longueur
  rationale: Terme architectural usuel; le possessif explicite naturellement en français qu’il s’agit de la maison.
- source_word: אַמּוֹת
  choice: coudées
  rationale: L’unité ancienne est conservée plutôt que convertie, conformément au texte source.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: selon l’ancienne mesure
  rationale: Rend littéralement l’idée d’une mesure antérieure tout en laissant ouverte la nature exacte de cet étalon.
- source_word: שִׁשִּׁים
  choice: soixante
  rationale: Nombre cardinal indiquant la longueur.
- source_word: וְרֹחַב
  choice: et sa largeur
  rationale: Le possessif sous-entendu est explicité pour obtenir un parallélisme naturel en français.
- source_word: עֶשְׂרִים
  choice: vingt
  rationale: Nombre cardinal indiquant la largeur.
