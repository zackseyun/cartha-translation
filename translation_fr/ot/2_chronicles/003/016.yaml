  text: וַ/יַּ֤עַשׂ שַׁרְשְׁרוֹת֙ בַּ/דְּבִ֔יר וַ/יִּתֵּ֖ן עַל רֹ֣אשׁ הָ/עַמֻּדִ֑ים וַ/יַּ֤עַשׂ רִמּוֹנִים֙ מֵאָ֔ה וַ/יִּתֵּ֖ן בַּֽ/שַּׁרְשְׁרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: fr
  text: Il fit des chaînes[a] dans le sanctuaire intérieur[b] et les plaça au sommet des colonnes. Il fit aussi cent grenades et les plaça sur les chaînes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des chaînettes », « des ouvrages en chaînes » ou « des guirlandes », selon la forme exacte de cette décoration.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la salle intérieure »; traditionnellement, « dans le lieu très saint ». Le terme hébreu désigne le sanctuaire intérieur du temple, mais la portée exacte de l’expression dans cette description décorative est discutée.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: chaînes
  rationale: Le nom désigne un ouvrage ornemental en forme de chaînes. « Chaînes » conserve le sens concret et convient aux deux occurrences du verset; « chaînettes » ou « guirlandes » restent possibles selon la nature précise du décor.
- source_word: בַּדְּבִיר
  choice: dans le sanctuaire intérieur
  rationale: דְּבִיר désigne habituellement la partie la plus intérieure du temple. Cette formulation moderne et architecturale préserve le sens sans imposer le titre liturgique traditionnel « lieu très saint ».
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: au sommet des colonnes
  rationale: Littéralement « sur la tête des colonnes »; « au sommet » est l’équivalent idiomatique naturel en français dans un contexte architectural.
- source_word: רִמּוֹנִים
  choice: grenades
  rationale: Le terme désigne ici des ornements en forme de grenades; la traduction concrète est traditionnelle et claire dans ce contexte décoratif.
- source_word: מֵאָה
  choice: cent
  rationale: Traduction directe du nombre cardinal, naturelle en français.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: les plaça sur les chaînes
  rationale: La préposition ב avec le nom répété indique vraisemblablement que les grenades étaient fixées aux chaînes. « Sur » rend directement cette relation tout en laissant ouverte la disposition décorative exacte.
