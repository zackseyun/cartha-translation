base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: fr
  text: Il fit le lieu très saint[a]. Sa longueur, correspondant à la largeur du Temple[b], était de vingt coudées, et sa largeur de vingt coudées. Il le revêtit d’or fin, pour un total de six cents talents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Saint des saints ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur la face de la largeur du Temple » ; l’expression décrit la relation entre la longueur de cette salle et la largeur du Temple.'
    reason: source_ambiguity
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  rationale: L’expression désigne la salle la plus intérieure du Temple. « Le lieu très saint » restitue naturellement en français la valeur superlative de la tournure hébraïque, sans conserver le mot « maison » de façon artificielle.
- source_word: אָרְכּוֹ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: Sa longueur, correspondant à la largeur du Temple
  rationale: Dans ce contexte architectural, עַל־פְּנֵי exprime vraisemblablement l’alignement ou la correspondance avec toute la largeur de l’édifice. La formulation française garde cette relation spatiale sans la préciser au-delà du texte.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: vingt coudées
  rationale: La coudée est conservée comme unité ancienne afin de respecter la précision propre au texte source.
- source_word: וַיְחַפֵּהוּ
  choice: Il le revêtit
  rationale: Le verbe חפה désigne ici l’application d’un revêtement d’or sur la construction. « Revêtir » est précis et naturel dans un contexte architectural.
- source_word: זָהָב טוֹב
  choice: or fin
  rationale: טוֹב qualifie ici la qualité de l’or. « Or fin » est idiomatique sans affirmer nécessairement une pureté métallurgique absolue.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: pour un poids de six cents talents
  rationale: La préposition ל introduit ici la quantité totale. Comme le talent est une unité de poids, cette formulation rend clairement la fonction de l’expression sans convertir la mesure ancienne.
