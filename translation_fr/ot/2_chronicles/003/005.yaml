  text: וְ/אֵ֣ת הַ/בַּ֣יִת הַ/גָּד֗וֹל חִפָּה֙ עֵ֣ץ בְּרוֹשִׁ֔ים וַ/יְחַפֵּ֖/הוּ זָהָ֣ב ט֑וֹב וַ/יַּ֧עַל עָלָ֛י/ו תִּמֹרִ֖ים וְ/שַׁרְשְׁרֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: fr
  text: Il revêtit la grande salle de bois de cyprès[a], la couvrit d’or fin et y appliqua des palmiers et des chaînes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de genévrier » ou « de sapin ». L’identification de l’arbre désigné par le mot hébreu est discutée.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « des palmiers et des chaînes »; il s’agit vraisemblablement de motifs ou d’ornements appliqués à la salle.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: la grande salle
  rationale: Dans le contexte de la construction du Temple, בַּיִת désigne ici l’espace principal de l’édifice. « Grande salle » conserve l’idée de grandeur tout en évitant le sens trompeur que pourrait prendre « grande maison » en français.
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: revêtit ... de bois de cyprès
  rationale: חפה exprime l’action de couvrir une surface. « Revêtir de bois » rend naturellement en français le lambrissage de la salle, sans restreindre indûment l’action au plafond.
- source_word: עֵץ בְּרוֹשִׁים
  choice: bois de cyprès
  rationale: « Cyprès » est une identification traditionnelle et courante de בְּרוֹשׁ, mais l’espèce exacte demeure discutée; les autres possibilités sont signalées en note.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: la couvrit d’or fin
  rationale: Le verbe répété signifie couvrir ou plaquer, et זָהָב טוֹב désigne littéralement un « bon or », c’est-à-dire un or de qualité. « Or fin » est une formulation française naturelle sans imposer explicitement l’idée d’or pur.
- source_word: וַיַּעַל עָלָיו
  choice: y appliqua
  rationale: À la forme causative, עלה décrit ici la pose d’éléments sur une surface. « Appliqua » convient au contexte décoratif et reste sobre.
- source_word: תִּמֹרִים
  choice: des palmiers
  rationale: Le terme désigne des palmiers ou leurs représentations. Le texte principal conserve l’expression concrète du texte hébreu, tandis que la note précise qu’il s’agit vraisemblablement de motifs décoratifs.
- source_word: שַׁרְשְׁרוֹת
  choice: des chaînes
  rationale: Le mot désigne des chaînes ou un décor en forme de chaînes. « Chaînes » est la traduction la plus directe; la fonction ornementale est précisée en note.
