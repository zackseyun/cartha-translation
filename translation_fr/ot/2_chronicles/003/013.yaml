  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: fr
  text: Les ailes de ces chérubins s’étendaient sur vingt coudées. Ils se tenaient debout sur leurs pieds, et leurs visages étaient tournés vers la Maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vers le Temple ». Littéralement : « vers la Maison », désignation courante de l’édifice du temple.'
    reason: Alternative lexicale et explicitation du référent de בַּיִת.
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: Les ailes de ces chérubins
  rationale: Le construit hébreu exprime l’appartenance des ailes aux chérubins. « Chérubins » conserve le terme biblique établi, et le démonstratif « ces » rend הָאֵלֶּה.
- source_word: פֹּרְשִׂים
  choice: s’étendaient
  rationale: Le participe décrit ici la disposition déployée des ailes. L’imparfait français exprime naturellement cet état descriptif sans imposer une action momentanée.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: sur vingt coudées
  rationale: La mesure ancienne est conservée littéralement. La préposition « sur » rend clairement l’étendue indiquée sans ajouter un nom de dimension absent de l’hébreu.
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: Ils se tenaient debout sur leurs pieds
  rationale: Le pronom explicite marque le passage des ailes aux chérubins eux-mêmes. La formulation garde la mention concrète des pieds tout en restant idiomatique en français.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: et leurs visages étaient tournés vers la Maison
  rationale: Le pluriel « leurs visages » suit l’hébreu. « La Maison » conserve le terme בַּיִת employé comme désignation de l’édifice du temple; la note explicite le référent.
theological_decisions:
- issue: Traduction de בַּיִת dans le contexte de la construction du temple
  choice: la Maison
  alternative: le Temple
  rationale: L’hébreu emploie le mot ordinaire « maison », couramment utilisé pour désigner le temple. Le conserver maintient la texture du texte source sans effacer son emploi cultuel, tandis que la note indique clairement le référent.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait convient à la description architecturale. Deux phrases évitent une coordination lourde, tandis que « sur leurs pieds » et « leurs visages » préservent les détails concrets de l’hébreu.
