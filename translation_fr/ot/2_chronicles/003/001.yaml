id: 2CH.3.1
reference: 2 Chronicles 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: fr
  text: Salomon commença alors à construire la maison de Yahweh à Jérusalem, sur le mont Moria[a], où Yahweh était apparu à David, son père, à l’endroit que David avait préparé, sur l’aire de battage d’Ornan le Jébusien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « où il était apparu à David, son père » ; le sujet est alors implicite et désigne Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Les Chroniques emploient la forme « Ornan » ; comparer « Arauna » en 2 Samuel 24.16, 18.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל שְׁלֹמֹה לִבְנוֹת
  choice: Salomon commença alors à construire
  rationale: « Commença à construire » rend directement la construction verbale; « alors » exprime naturellement la progression narrative du wayyiqtol.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque plutôt que de l’expliciter par « temple »; le nom divin est translittéré « Yahweh ».
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: sur le mont Moria
  rationale: Rend le lieu comme une montagne déterminée et emploie la forme française courante du nom.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: où Yahweh était apparu à David, son père
  rationale: Le nifal de ראה exprime normalement une apparition dans ce contexte. Le sujet implicite est explicité pour éviter qu’un pronom français ne paraisse renvoyer à Salomon.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: à l’endroit que David avait préparé
  rationale: La formulation hébraïque est condensée; cette traduction rattache naturellement la préparation du site à David sans ajouter de détail étranger au texte.
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  choice: sur l’aire de battage d’Ornân le Jébusien
  rationale: « Sur » convient à la surface ouverte d’une aire de battage; « Ornân » suit la forme du nom propre employée dans les Chroniques.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération conserve le caractère propre du nom divin présent dans le texte hébreu.
- issue: Sujet et sens de נִרְאָה
  choice: où Yahweh était apparu à David
  alternative: qui avait été montré à David
  rationale: Le contexte favorise une apparition de Yahweh, mais la morphologie et la construction relative permettent une lecture plus passive; celle-ci est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant une ambiguïté pronominale artificielle en français. « Maison de Yahweh » conserve l’image du texte source, et « aire de battage » emploie le terme biblique usuel et compréhensible.
