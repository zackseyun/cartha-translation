id: 2CH.3.14
reference: 2 Chronicles 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/כַרְמִ֣יל וּ/ב֑וּץ וַ/יַּ֥עַל עָלָ֖י/ו כְּרוּבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: fr
  text: Il confectionna le rideau[a] avec des fils bleus, pourpres et cramoisis[b], ainsi qu’avec du fin lin, et il l’orna de chérubins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le voile ».
    reason: lexical_alternative
  - marker: b
    text: Ou « écarlates » au lieu de « cramoisis ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il fit monter sur lui des chérubins »; autrement dit, il le décora de figures de chérubins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: le rideau
  rationale: Le terme désigne la tenture intérieure qui formait une séparation dans le sanctuaire. « Rideau » est clair en français moderne, tandis que « voile » demeure une possibilité traditionnelle signalée en note.
- source_word: תְּכֵלֶת
  choice: des fils bleus
  rationale: Le mot désigne une matière textile teinte en bleu ou bleu-violet. L’ajout contextuel de « fils » rend naturelle en français l’énumération des matériaux sans prétendre préciser davantage la nuance.
- source_word: אַרְגָּמָן
  choice: pourpres
  rationale: Cette couleur prestigieuse, tirant vers le violet, est traditionnellement et justement rendue par « pourpre ».
- source_word: כַרְמִיל
  choice: cramoisis
  rationale: Le terme désigne une matière teinte d’un rouge intense. « Cramoisi » convient à la nuance probable; « écarlate » reste une autre traduction possible.
- source_word: בּוּץ
  choice: du fin lin
  rationale: Le terme désigne un lin de qualité fine, et non le lin en général.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: il l’orna de chérubins
  rationale: L’expression signifie littéralement qu’il « fit monter » des chérubins sur le rideau. Dans ce contexte artisanal, elle indique qu’il y réalisa des figures de chérubins, sans permettre de déterminer avec certitude la technique employée.
- source_word: כְּרוּבִים
  choice: chérubins
  rationale: « Chérubins » conserve le terme biblique conventionnel associé au mobilier et au décor du sanctuaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Confectionna » convient au travail textile; « orna » restitue l’effet de l’expression hébraïque sans imposer une technique précise comme la broderie.
