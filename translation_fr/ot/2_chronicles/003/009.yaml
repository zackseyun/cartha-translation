  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: fr
  text: Et le poids des clous était de cinquante sicles d’or, et il recouvrit d’or les chambres hautes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pièces supérieures » ; le terme hébreu peut désigner plus généralement des pièces ou des structures situées dans la partie supérieure du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל
  choice: Le poids
  rationale: מִשְׁקָל désigne le poids ou la pesée. La conjonction וּ est rendue naturellement par la coordination qui relie l’ensemble du verset au contexte, sans alourdir l’ouverture française par « Et ».
- source_word: לְמִסְמְרוֹת
  choice: des clous
  rationale: מִסְמְרוֹת peut désigner des clous ou des chevilles. Avec מִשְׁקָל et dans le contexte de la construction du temple, « le poids des clous » est l’expression française la plus naturelle.
- source_word: לִשְׁקָלִים חֲמִשִּׁים
  choice: était de cinquante sicles
  rationale: La tournure exprime la quantité pesée. « Était de » restitue clairement en français la relation entre le poids et sa mesure.
- source_word: זָהָב
  choice: d’or
  rationale: 'Le premier emploi de זָהָב précise la matière correspondant au poids indiqué : cinquante sicles d’or.'
- source_word: וְהָעֲלִיּוֹת
  choice: les pièces de l’étage
  rationale: עֲלִיּוֹת désigne généralement des pièces ou chambres situées en hauteur. Cette formulation française conserve l’idée spatiale tout en évitant de préciser excessivement une architecture incertaine.
- source_word: חִפָּה
  choice: il recouvrit
  rationale: חפה signifie couvrir ou revêtir une surface d’un matériau. « Recouvrir d’or » est naturel en français dans un contexte architectural.
- source_word: זָהָב
  choice: d’or
  rationale: Après חִפָּה, זָהָב indique le matériau du revêtement; la construction française idiomatique est « recouvrir d’or ».
