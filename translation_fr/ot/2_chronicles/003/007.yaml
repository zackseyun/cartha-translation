  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: fr
  text: Il revêtit d’or la Maison[a] — les poutres[b], les seuils[c], ses murs et ses portes — et il grava des chérubins sur les murs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la maison » ; dans ce contexte, il s’agit du Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « chevrons ». Le terme hébreu désigne des pièces de bois structurelles sans en préciser ici la fonction exacte.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi désigner des montants de porte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: il revêtit d’or
  rationale: Le verbe désigne ici l’action de couvrir une structure d’une couche de matériau. « Revêtir d’or » est naturel et précis dans ce contexte architectural.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: Le mot signifie littéralement « la maison » et désigne ici le Temple. La majuscule permet de conserver cette désignation hébraïque tout en la distinguant d’une habitation ordinaire.
- source_word: הַקֹּרוֹת
  choice: ses poutres
  rationale: Le nom désigne des pièces de bois structurelles. « Poutres » reste suffisamment général, contrairement à « chevrons », plus précis.
- source_word: הַסִּפִּים
  choice: ses seuils
  rationale: Le terme peut désigner les seuils ou d’autres éléments de l’encadrement des ouvertures. « Seuils » convient probablement le mieux ici sans exclure l’incertitude signalée en note.
- source_word: קִירוֹתָיו
  choice: ses murs
  rationale: Traduction directe du pluriel muni du suffixe possessif renvoyant à la Maison.
- source_word: דַלְתוֹתָיו
  choice: ses portes
  rationale: Le terme désigne les portes ou leurs battants; « portes » est la formulation moderne la plus claire.
- source_word: זָהָב
  choice: d’or
  rationale: L’hébreu place « or » après l’énumération; le français l’intègre naturellement au verbe « revêtir ».
- source_word: וּפִתַּח
  choice: et il grava
  rationale: Le verbe exprime l’exécution d’un décor par gravure ou sculpture. « Grava » convient à des figures réalisées sur la surface des murs tout en gardant une formulation concise.
- source_word: כְּרוּבִים
  choice: des chérubins
  rationale: « Chérubins » conserve le terme biblique et cultuel traditionnel sans l’assimiler aux représentations populaires de petits anges.
- source_word: עַל הַקִּירוֹת
  choice: sur les murs
  rationale: La préposition indique le plus naturellement l’emplacement du décor.
