language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/אוּלָ֡ם אֲשֶׁר֩ עַל פְּנֵ֨י הָ/אֹ֜רֶךְ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/הַ/גֹּ֖בַהּ מֵאָ֣ה וְ/עֶשְׂרִ֑ים וַ/יְצַפֵּ֥/הוּ מִ/פְּנִ֖ימָה זָהָ֥ב טָהֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: fr
  text: Le portique situé devant le Temple avait vingt coudées de longueur, correspondant à la largeur du Temple, et cent vingt coudées de hauteur[a]. Salomon en revêtit l’intérieur d’or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu indique que le portique avait « cent vingt » coudées de hauteur. La description parallèle de 1 Rois 6.3 donne sa longueur et sa largeur, mais ne mentionne pas cette hauteur. Certains interprètes soupçonnent donc ici une difficulté de transmission du texte; la traduction suit le texte massorétique tel qu’il a été conservé.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: le portique
  rationale: Le terme désigne l’espace architectural d’entrée placé devant le bâtiment principal; « portique » est précis, actuel et adapté au contexte du Temple.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: situé devant
  rationale: Cette formulation rend naturellement la position du portique par rapport au Temple sans préciser indûment son orientation.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: avait vingt coudées de longueur, correspondant à la largeur du Temple
  rationale: L’hébreu condensé met la longueur du portique en rapport avec la largeur du bâtiment; « correspondant à » explicite sobrement cette relation.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: vingt coudées
  rationale: La coudée est conservée comme unité ancienne plutôt que convertie approximativement.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: et cent vingt coudées de hauteur
  rationale: La traduction suit le texte massorétique et rétablit naturellement l’unité de mesure sous-entendue dans cette proposition.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Salomon en revêtit l’intérieur
  rationale: Le verbe signifie couvrir ou plaquer d’un matériau. Le nom « Salomon », sujet donné par le contexte, évite en français un pronom potentiellement ambigu, tandis que « en » reprend le portique.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: Rendu direct, idiomatique et précis de l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Temple » traduit ici הַבַּיִת selon son référent contextuel et évite l’ambiguïté que pourrait créer « maison ». La syntaxe reste proche de la structure hébraïque tout en étant naturelle en français.
