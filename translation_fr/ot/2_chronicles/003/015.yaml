id: 2CH.3.15
reference: 2 Chronicles 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ לִ/פְנֵ֤י הַ/בַּ֨יִת֙ עַמּוּדִ֣ים שְׁנַ֔יִם אַמּ֕וֹת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ אֹ֑רֶךְ וְ/הַ/צֶּ֥פֶת אֲשֶׁר עַל רֹאשׁ֖/וֹ אַמּ֥וֹת חָמֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: fr
  text: Devant le Temple, il fit deux colonnes de trente-cinq coudées de long[a]. Le chapiteau qui se trouvait au sommet de chacune[b] mesurait cinq coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « trente-cinq coudées de long ». En 1 Rois 7.15, la hauteur de chaque colonne est de dix-huit coudées. Certains comprennent donc que les Chroniques donnent ici une mesure totale ; d’autres y voient une difficulté textuelle.
    reason: cross_reference
  - marker: b
    text: L’hébreu porte « à son sommet », avec un suffixe au singulier, probablement employé ici dans un sens distributif pour chacune des deux colonnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: Devant le Temple
  rationale: לִפְנֵי indique une position « devant ». Dans ce contexte de construction, הַבַּיִת désigne le Temple ; la majuscule rend cette référence claire en français courant.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: deux colonnes
  rationale: עַמּוּדִים désigne ici des éléments architecturaux verticaux ; « colonnes » est naturel et précis en français.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: trente-cinq coudées de long
  rationale: Le texte massorétique emploie explicitement אֹרֶךְ, « longueur ». La traduction conserve donc cette formulation et l’unité ancienne sans transformer silencieusement la mesure en hauteur.
- source_word: הַצֶּפֶת
  choice: le chapiteau
  rationale: Dans ce contexte architectural, le terme désigne la partie supérieure ornementale d’une colonne ; « chapiteau » est le terme français précis.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: qui se trouvait au sommet de chacune
  rationale: רֹאשׁ signifie littéralement « tête », mais « sommet » convient à une colonne. Le suffixe singulier est compris distributivement, tout en signalant cette particularité en note.
- source_word: אַמּוֹת חָמֵשׁ
  choice: mesurait cinq coudées
  rationale: La tournure verbale ajoutée rend la mesure naturelle en français sans préciser une dimension que l’hébreu ne nomme pas ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Temple » clarifie le référent contextuel de « maison » ; « colonnes » et « chapiteau » emploient un vocabulaire architectural courant. La formulation conserve la donnée littérale et difficile du texte hébreu concernant les trente-cinq coudées.
