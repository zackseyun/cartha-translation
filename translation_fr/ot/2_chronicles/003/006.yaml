  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: fr
  text: Il revêtit la Maison[a] de pierres précieuses pour l’embellir, et l’or était de l’or de Parvaïm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « la maison », appellation courante du temple dans les Chroniques.
    reason: lexical_alternative
  - marker: b
    text: Parvaïm est un nom de lieu dont l’identification demeure incertaine. L’expression peut signifier « or de Parvaïm » ou « or provenant de Parvaïm ».
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: Il revêtit
  rationale: Le verbe צפה désigne ici l’action de couvrir un édifice d’un matériau décoratif. « Revêtir » convient au contexte architectural et reste naturel en français.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: L’hébreu dit littéralement « la maison », désignation courante du temple dans les Chroniques. La majuscule aide à signaler ce référent sans remplacer le mot source par « temple ».
- source_word: אֶבֶן יְקָרָה
  choice: de pierres précieuses
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel français exprime naturellement les matériaux décoratifs employés.
- source_word: לְתִפְאָרֶת
  choice: pour l’embellir
  rationale: La préposition לְ exprime le but, et תִּפְאֶרֶת évoque la beauté ou la splendeur. Cette formulation française rend clairement la fonction ornementale des pierres.
- source_word: וְהַזָּהָב
  choice: et l’or était
  rationale: La proposition précise ensuite la nature ou l’origine de l’or. La copule, implicite en hébreu, est nécessaire en français.
- source_word: זְהַב פַּרְוָיִם
  choice: de l’or de Parvaïm
  rationale: L’état construit indique une provenance ou une association. « Or de Parvaïm » préserve cette légère ambiguïté mieux que « provenant de Parvaïm ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « La Maison » conserve l’image hébraïque tout en indiquant le temple dans ce contexte; « pour l’embellir » privilégie une expression naturelle du but ornemental.
