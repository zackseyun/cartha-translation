base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: fr
  text: L’aile de l’un des chérubins, longue de cinq coudées, atteignait le mur de la Maison[a] ; l’autre aile, longue de cinq coudées, touchait[b] l’aile de l’autre chérubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Maison » désigne ici l’édifice du temple.
    reason: cultural_note
  - marker: b
    text: 'Ou : était jointe à l’aile de l’autre chérubin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַף
  choice: aile
  rationale: Dans la description des chérubins du temple, le sens concret « aile » est clairement requis.
- source_word: כְּרוּב
  choice: chérubin
  rationale: Le nom hébreu est au singulier et désigne ici chacune des deux figures séparément.
- source_word: אַמּוֹת חָמֵשׁ
  choice: cinq coudées
  rationale: La conservation de l’unité ancienne respecte la précision architecturale du texte sans imposer une conversion moderne approximative.
- source_word: מַגִּיעַ
  choice: atteignait
  rationale: Ce verbe exprime naturellement l’extension de l’aile jusqu’au mur, avec l’idée qu’elle y arrivait.
- source_word: קִיר הַבָּיִת
  choice: le mur de la Maison
  rationale: « Maison » conserve le terme hébreu tout en désignant, dans ce contexte, l’édifice du temple ; la majuscule aide à signaler cet emploi particulier.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: l’autre aile
  rationale: Cette formulation française rend directement l’adjectif hébreu et décrit naturellement la seconde aile du même chérubin.
- source_word: דְּבֵקָה
  choice: touchait
  rationale: Le mot décrit le contact étroit entre les ailes. « Touchait » est clair et n’ajoute pas nécessairement l’idée d’une fixation matérielle.
- source_word: הַכְּרוּב הָאַחֵר
  choice: l’autre chérubin
  rationale: Cette traduction préserve la relation entre les deux figures sans remplacer « autre » par un ordinal absent du texte.
