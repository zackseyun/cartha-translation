base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: fr
  text: Les ailes des chérubins avaient une longueur de vingt coudées. Une aile, longue de cinq coudées, touchait[a] le mur de la Maison[b], et l’autre aile, longue de cinq coudées, touchait l’aile de l’autre chérubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « atteignait ». Le verbe hébreu peut exprimer le fait d’arriver jusqu’à un point ou d’entrer effectivement en contact avec lui ; il en va de même dans la seconde occurrence du verset.
    reason: lexical_alternative
  - marker: b
    text: La « Maison » désigne ici le bâtiment du Temple.
    reason: cultural_note
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: Les ailes des chérubins
  rationale: Le pluriel construit est rendu directement. « Chérubins » conserve le terme traditionnel désignant ces êtres célestes; la conjonction initiale n’est pas reproduite, car le français moderne n’en a pas besoin ici.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: avaient une longueur totale de vingt coudées
  rationale: La formulation française explicite naturellement le nom « leur longueur ». « Totale » indique que les vingt coudées correspondent à l’envergure combinée décrite par les deux ailes de cinq coudées de chacun des deux chérubins, sans convertir l’unité ancienne.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: Une aile, longue de cinq coudées
  rationale: L’expression hébraïque de mesure est elliptique; « longue de » en restitue clairement le sens en français.
- source_word: מַגַּעַת ... מַגִּיעַ
  choice: touchait ... touchait
  rationale: Les deux participes de la racine נגע évoquent ici le fait d’arriver jusqu’à un point avec contact. La répétition française reflète la construction symétrique du verset.
- source_word: לְקִיר הַבַּיִת
  choice: le mur de la Maison
  rationale: בַּיִת signifie littéralement « maison », mais désigne ici l’édifice du Temple. La majuscule permet de conserver l’image biblique de la Maison tout en signalant cet emploi particulier.
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: et l’autre aile
  rationale: « Autre » correspond directement à אַחֶרֶת et convient mieux que l’interprétation « deuxième ».
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: l’aile de l’autre chérubin
  rationale: Le singulier « chérubin » et la répétition de « l’autre » reproduisent précisément la relation spatiale exprimée par l’hébreu.
