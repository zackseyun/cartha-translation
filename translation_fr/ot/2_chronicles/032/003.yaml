base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: fr
  text: Il consulta ses responsables et ses hommes de guerre au sujet du blocage des eaux des sources situées à l’extérieur de la ville[a], et ils lui apportèrent leur aide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il tint conseil avec ses responsables et ses hommes de guerre pour bloquer les eaux des sources à l’extérieur de la ville. »'
    reason: L’infinitif hébreu peut présenter le blocage soit comme l’objet de la consultation, soit comme son but.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Il consulta
  rationale: Le niphal de יעץ exprime ici le fait de prendre conseil avec d’autres. « Il consulta » est naturel en français moderne et conserve la dimension collective.
- source_word: שָׂרָיו
  choice: ses responsables
  rationale: שַׂר peut désigner un prince, un chef, un commandant ou un haut fonctionnaire. « Responsables » convient au cadre politico-militaire sans suggérer nécessairement une ascendance royale.
- source_word: גִבֹּרָיו
  choice: ses hommes de guerre
  rationale: Dans ce contexte de préparation militaire, גִּבּוֹר désigne vraisemblablement des guerriers ou hommes vaillants. « Hommes de guerre » rend clairement cette nuance sans archaïsme excessif.
- source_word: לִסְתּוֹם
  choice: au sujet du blocage
  rationale: סתם signifie boucher, obstruer ou bloquer. La tournure nominale s’accorde naturellement avec « consulta » tout en laissant la note signaler que l’infinitif peut aussi exprimer directement le but.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: des eaux des sources
  rationale: Cette formulation reproduit le groupe construit hébreu et identifie les sources naturelles, plutôt que des fontaines aménagées.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: situées à l’extérieur de la ville
  rationale: Le relatif localise les sources, ou leurs eaux, au-delà du périmètre urbain. L’accord avec « sources » donne une formulation française claire sans modifier le référent géographique essentiel.
- source_word: וַיַּעְזְרֻהוּ
  choice: et ils lui apportèrent leur aide
  rationale: עזר avec le suffixe masculin singulier indique que les responsables et les hommes de guerre aidèrent Ézéchias. Cette expression est naturelle et conserve explicitement l’idée d’aide.
