id: 2CH.32.18
reference: 2 Chronicles 32:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְרְא֨וּ בְ/קוֹל גָּד֜וֹל יְהוּדִ֗ית עַל עַ֤ם יְרוּשָׁלִַ֨ם֙ אֲשֶׁ֣ר עַל הַֽ/חוֹמָ֔ה לְ/יָֽרְאָ֖/ם וּֽ/לְ/בַהֲלָ֑/ם לְמַ֖עַן יִלְכְּד֥וּ אֶת הָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: fr
  text: Ils crièrent d’une voix forte, en judéen, aux habitants de Jérusalem qui se trouvaient sur la muraille, afin de leur faire peur et de les épouvanter, pour pouvoir s’emparer de la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: en judéen
  rationale: Le terme désigne ici la langue locale de Juda, comme en 2 Chroniques 32. Il est préférable de nommer cette langue plutôt que d’employer « en hébreu », qui serait moins précis historiquement.
- source_word: עַל עַם יְרוּשָׁלִַם
  choice: aux habitants de Jérusalem
  rationale: Dans ce contexte, עַל marque les personnes auxquelles les cris sont adressés; « habitants » rend naturellement le collectif עַם sans suggérer que toute la population se trouvait sur la muraille.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: afin de leur faire peur et de les épouvanter
  rationale: 'Les deux infinitifs expriment le but et conservent l’intensification du texte: susciter la peur, puis un profond effroi ou désarroi.'
- source_word: לְמַעַן יִלְכְּדוּ
  choice: pour pouvoir s’emparer
  rationale: לְמַעַן exprime le but poursuivi; le français « pour pouvoir » relie naturellement l’intimidation à la prise projetée de la ville, sans présenter sa capture comme déjà réalisée.
theological_decisions:
- issue: Sujet implicite du verbe יִלְכְּדוּ
  choice: le conserver sous la forme « ils » implicite dans « s’emparer »
  alternative: identifier explicitement les Assyriens
  rationale: Le contexte identifie les assaillants, mais le verset lui-même ne les nomme pas; la traduction évite donc d’ajouter une identification absente de la proposition.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Crièrent d’une voix forte » préserve l’image hébraïque tout en restant idiomatique; « muraille » convient à l’enceinte défensive d’une ville.
