base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: fr
  text: 'Après cela, Sennachérib, roi d’Assyrie, envoya ses serviteurs à Jérusalem — alors qu’il se trouvait devant Lakish[a], avec toute sa puissance[b] — contre Ézéchias, roi de Juda, et contre tous les Judéens qui se trouvaient à Jérusalem, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « face à Lakish » ou « en train d’assiéger Lakish ». L’hébreu dit littéralement « sur/contre Lakish », expression qui prend ici un sens militaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec toutes ses forces ». L’expression hébraïque peut désigner son pouvoir, son autorité ou son empire, mais aussi, dans ce contexte, toute la puissance placée sous ses ordres.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: Après cela
  rationale: Transition temporelle courante, naturelle en français moderne, qui conserve l’enchaînement du récit.
- source_word: שָׁלַח
  choice: envoya
  rationale: Correspond au sens fondamental du verbe et convient aussi bien à une mission diplomatique qu’à une mission hostile.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans un contexte royal, le terme peut désigner des serviteurs ou des agents du roi. « Serviteurs » reste proche de l’hébreu sans préciser indûment leur fonction.
- source_word: יְרוּשָׁלַיְמָה
  choice: à Jérusalem
  rationale: Le hé directionnel exprime un mouvement vers la ville ; « à Jérusalem » est la formulation française naturelle.
- source_word: וְהוּא עַל לָכִישׁ
  choice: alors qu’il se trouvait devant Lakish
  rationale: Avec une ville, עַל peut marquer ici une position militaire hostile. « Devant Lakish » conserve cette nuance sans transformer explicitement la situation en siège.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: avec toute la puissance de son empire
  rationale: מֶמְשָׁלָה désigne le pouvoir, la domination ou le domaine gouverné. Dans ce contexte militaire, la formule peut aussi évoquer les forces placées sous son autorité ; la traduction maintient le lien entre puissance impériale et présence militaire.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: contre Ézéchias ... et contre tous les Judéens
  rationale: La répétition de עַל et le contexte menaçant favorisent « contre », qui garde l’orientation hostile du message. « Tous les Judéens » rend naturellement en français le collectif « tout Juda » qualifié par le relatif pluriel.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: qui se trouvaient à Jérusalem
  rationale: La proposition précise qu’il s’agit des Judéens alors présents dans la ville.
- source_word: לֵאמֹר
  choice: 'pour leur dire :'
  rationale: Formule française naturelle pour introduire les paroles rapportées au verset suivant.
