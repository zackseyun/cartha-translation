base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: fr
  text: 'Un grand nombre de personnes se rassemblèrent et bouchèrent toutes les sources ainsi que le cours d’eau qui coulait à travers le pays[b], en disant : « Pourquoi les rois d’Assyrie[a] viendraient-ils trouver de l’eau en abondance ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les rois d’Assyrie ». Le pluriel peut désigner le pouvoir royal ou la dynastie assyrienne ; certaines traductions mettent le singulier « le roi d’Assyrie » en raison du contexte immédiat.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le torrent qui coulait à travers le pays » ou « l’oued qui coulait à travers le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: Une foule nombreuse se rassembla
  rationale: Le niphal exprime le rassemblement, et עַם רָב désigne ici un grand nombre de personnes. « Une foule nombreuse » est naturel et évite de donner à עַם un sens ethnique technique.
- source_word: וַיִּסְתְּמוּ
  choice: ils bouchèrent
  rationale: Dans le contexte de sources et d’un cours d’eau, le verbe signifie les obstruer afin d’empêcher l’accès à l’eau.
- source_word: כָּל הַמַּעְיָנוֹת
  choice: toutes les sources
  rationale: מַעְיָן désigne une source ou un point où l’eau jaillit; « sources » est le terme français courant et précis.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: le cours d’eau qui traversait
  rationale: נַחַל peut désigner un torrent, un ruisseau ou un oued, tandis que le participe הַשּׁוֹטֵף présente l’eau comme s’écoulant. « Cours d’eau » conserve la généralité du terme sans imposer un régime hydrologique précis.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: le pays
  rationale: Avec le verbe de mouvement « traversait », cette expression indique que le cours d’eau passait à l’intérieur du territoire.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend explicitement le marqueur hébreu qui introduit les paroles motivant l’action.
- source_word: לָמָּה יָבֹאוּ
  choice: Pourquoi … viendraient-ils
  rationale: Le conditionnel français traduit naturellement la force délibérative et rhétorique de la question.
- source_word: מַלְכֵי אַשּׁוּר
  choice: les rois d’Assyrie
  rationale: Le pluriel du texte hébreu est maintenu, sans le réduire au singulier en fonction du seul contexte immédiat.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: trouver de l’eau en abondance
  rationale: La tournure exprime clairement une réserve d’eau importante et convient au registre narratif.
theological_decisions:
- issue: Pluriel « les rois d’Assyrie » dans un contexte centré sur Sennachérib
  choice: Conserver le pluriel du texte hébreu
  alternative: « le roi d’Assyrie »
  rationale: Le pluriel peut évoquer le pouvoir royal assyrien, la dynastie ou le roi accompagné de ses chefs. Le réduire au singulier résoudrait une tension historique que l’hébreu laisse subsister.
translation_notes:
  register: Français international moderne, narratif et digne. « Une foule nombreuse » est plus idiomatique que « un peuple nombreux » dans ce contexte; « cours d’eau » évite le régionalisme technique « oued » tout en préservant l’étendue sémantique de נַחַל. Les appels de notes sont placés immédiatement après les expressions qu’ils expliquent.
