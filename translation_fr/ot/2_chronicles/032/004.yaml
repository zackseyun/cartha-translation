    rationale: Le français attend normalement la reprise d’un nom collectif singulier par « elle », ou bien un sujet pluriel explicite. « Un grand nombre de personnes se rassemblèrent et bouchèrent » évite cette rupture sans changer le sens.
  - severity: medium
    issue: Le participe הַשּׁוֹטֵף n’est pas rendu explicitement dans « le cours d’eau qui traversait le pays ».
    rationale: « Traversait » exprime convenablement la relation spatiale de בְּתוֹךְ הָאָרֶץ, mais ne dit pas que le cours d’eau coulait. « Le cours d’eau qui coulait à travers le pays » rend les deux éléments.
