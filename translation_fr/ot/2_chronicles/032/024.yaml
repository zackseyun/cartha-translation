  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: fr
  text: En ce temps-là, Ézéchias tomba malade, au point de mourir. Il pria Yahweh, qui lui répondit[a] et lui donna un signe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il lui dit ». Le verbe hébreu signifie « dire », mais il exprime ici la réponse de Yahweh à la prière d’Ézéchias.'
    reason: lexical_alternative
  - marker: b
    text: Ou « un prodige » ou « un présage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Cette tournure française naturelle rend l’expression temporelle hébraïque sans archaïsme.
- source_word: חָלָה
  choice: tomba malade
  rationale: Le verbe décrit l’entrée dans la maladie plutôt qu’un simple état.
- source_word: עַד לָמוּת
  choice: au point de mourir
  rationale: Cette expression restitue clairement la gravité extrême indiquée par l’idiome hébreu.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: Il pria Yahweh
  rationale: Le verbe est le terme courant pour prier, et le nom divin יהוה est rendu par « Yahweh ».
- source_word: וַיֹּאמֶר לוֹ
  choice: qui lui répondit
  rationale: Le verbe signifie formellement « dit », mais il exprime ici la réponse de Yahweh à la prière d’Ézéchias; la note conserve la formulation littérale.
- source_word: מוֹפֵת
  choice: signe
  rationale: Dans ce récit, le mot désigne le signe miraculeux confirmant la réponse divine, tout en pouvant aussi signifier « prodige » ou « présage ».
- source_word: נָתַן לוֹ
  choice: lui donna
  rationale: Rendu direct et naturel du verbe נתן accompagné du pronom objet indirect.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Sens de וַיֹּאמֶר לוֹ dans le contexte de la prière
  choice: qui lui répondit
  alternative: et il lui dit
  rationale: Le contexte présente la parole divine comme une réponse à la prière. La traduction explicite cette fonction discursive, tandis que la note maintient accessible le sens formel du verbe.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase est scindée après la maladie pour rester fluide; la relative « qui lui répondit » maintient clairement Yahweh comme sujet. Les marqueurs de notes sont placés immédiatement après les termes concernés.
