source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: fr
  text: Et maintenant, ne vous laissez pas tromper par Ézéchias, et ne vous laissez pas entraîner ainsi par lui[a] ! Ne le croyez pas, car aucun dieu d’aucune nation ni d’aucun royaume n’a pu délivrer son peuple de ma main et de la main de mes pères[b]. Votre Dieu vous délivrera donc encore moins de ma main[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour « ne vous laissez pas entraîner ainsi par lui » : « qu’il ne vous pousse pas ainsi » ou « qu’il ne vous persuade pas ainsi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ma main et de la main de mes pères ». Dans cet idiome, la « main » représente le pouvoir ou la domination ; les « pères » peuvent être les ancêtres ou les prédécesseurs royaux.'
    reason: cultural_note
  - marker: c
    text: Ou « à coup sûr, votre Dieu ne vous délivrera pas de ma main ! » L’expression hébraïque introduit ici une conclusion négative renforcée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Marque naturellement en français la transition vers l’exhortation immédiate, tout en conservant la valeur discursive de la conjonction.
- source_word: יַשִּׁיא
  choice: trompe
  rationale: Le verbe exprime l’idée d’égarer par la tromperie. « Tromper » est direct, courant et distinct du verbe suivant.
- source_word: יַסִּית
  choice: entraîne
  rationale: Dans ce contexte de discours persuasif, « entraîner » rend l’idée d’amener quelqu’un à adopter une conduite ou une position, sans ajouter nécessairement la notion de rébellion.
- source_word: כָּזֹאת
  choice: ainsi
  rationale: 'Conserve avec concision la valeur démonstrative de l’hébreu : de cette manière ou par de tels propos.'
- source_word: תַּאֲמִינוּ לוֹ
  choice: Ne le croyez pas
  rationale: Il s’agit de ne pas tenir pour vraies les affirmations d’Ézéchias ; « croire quelqu’un » est l’expression française naturelle ici.
- source_word: לֹא יוּכַל
  choice: n’a pu
  rationale: 'Le passé composé exprime l’appel du locuteur aux précédents historiques : aucun dieu n’a jusqu’ici réussi à délivrer son peuple.'
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: aucun dieu d’aucune nation ni d’aucun royaume
  rationale: Cette formulation française claire préserve la portée universelle de la prétention assyrienne.
- source_word: לְהַצִּיל
  choice: délivrer
  rationale: « Délivrer » convient au contexte militaire et exprime le fait d’arracher un peuple au pouvoir d’un ennemi.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: de ma main et de la main de mes pères
  rationale: Le maintien de « main » conserve l’image hébraïque du pouvoir. « Mes pères » peut désigner les ancêtres ou prédécesseurs royaux du locuteur.
- source_word: אַף כִּי
  choice: donc encore moins
  rationale: Cette tournure rend naturellement en français la conclusion négative renforcée de l’argument provocateur.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le terme désigne ici le Dieu unique de Juda, cible explicite de la provocation assyrienne.
theological_decisions:
- issue: Référence de אֱלֹהֵיכֶם
  choice: Le singulier « votre Dieu », désignant le Dieu de Juda et d’Israël
  alternative: Le pluriel formel « vos dieux »
  rationale: Dans ce contexte, אֱלֹהִים est la forme habituelle employée pour le Dieu d’Israël. Un pluriel en français déformerait la cible de la provocation et le cadre narratif.
- issue: Statut de l’affirmation sur l’impuissance de Dieu
  choice: Conserver sans atténuation la provocation dans la bouche du porte-parole assyrien
  alternative: Reformuler pour signaler explicitement que l’affirmation est fausse
  rationale: Le verset rapporte les paroles du locuteur ; la narration environnante permet de les évaluer. Ajouter ici un correctif théologique modifierait la force rhétorique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’intensité de la harangue assyrienne, ainsi que la répétition rhétorique de « ma main ». « Ézéchias » suit la forme française biblique bien établie.
