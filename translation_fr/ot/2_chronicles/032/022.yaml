source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: fr
  text: Ainsi, Yahweh sauva Ézéchias et les habitants de Jérusalem de la main de Sennachérib, roi d’Assyrie, et de la main de tous les autres[a]. Il les guida de tous côtés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et de la main de tous ». Le complément de « tous » n’est pas exprimé en hébreu; il s’agit probablement de tous les autres ennemis ou de toutes les autres puissances hostiles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Il les conduisit tout autour ». Certains comprennent plus largement que Yahweh leur accorda la sécurité de tous côtés.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: sauva
  rationale: Le verbe ישׁע exprime ici la délivrance d’un danger. « Sauva » est clair, naturel et conserve la portée théologique de l’action divine sans la réduire à une simple victoire militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Cette expression rend directement et dans un registre courant le participe substantivé désignant ceux qui habitent Jérusalem.
- source_word: מִיַּד
  choice: de la main de
  rationale: L’image hébraïque de la « main » désigne le pouvoir ou l’emprise. Elle demeure compréhensible en français et sa répétition respecte la formulation du texte source.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Sennachérib, roi d’Assyrie
  rationale: La forme française usuelle du nom propre est suivie du titre apposé, conformément à l’hébreu.
- source_word: וּמִיַּד כֹּל
  choice: et de la main de tous les autres
  rationale: כֹּל est employé sans complément exprimé. « Tous les autres » conserve cette ellipse tout en permettant une lecture française naturelle; la note signale la formulation plus littérale.
- source_word: וַיְנַהֲלֵם
  choice: Il les guida
  rationale: Le verbe נהל signifie principalement conduire ou guider. « Guida » préserve ce sens lexical sans expliciter la sécurité ou le repos qui peuvent être impliqués par le contexte.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: Cette locution rend l’idée d’une action exercée tout autour, sans préciser davantage si le texte décrit une conduite concrète ou une protection générale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme. La translittération maintient le nom divin et évite de le remplacer par un titre.
- issue: Sens de וַיְנַהֲלֵם מִסָּבִיב
  choice: Il les guida de tous côtés
  alternative: Il leur accorda la sécurité de tous côtés
  rationale: Le choix principal suit le sens lexical de נהל et conserve l’ambiguïté de la construction. La compréhension plus contextuelle en termes de sécurité est indiquée en note plutôt qu’intégrée silencieusement au texte.
- issue: Complément implicite de כֹּל
  choice: tous les autres
  alternative: tous leurs autres ennemis
  rationale: Le contexte suggère des ennemis ou des puissances hostiles, mais le nom correspondant n’est pas exprimé en hébreu. La traduction évite donc de l’ajouter dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La tournure biblique « de la main de » est conservée parce qu’elle reste intelligible et préserve l’image du texte source. Les ambiguïtés concernant « tous » et l’action de guider sont maintenues dans le texte et précisées en notes.
