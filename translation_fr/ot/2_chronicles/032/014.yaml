  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: fr
  text: Qui, parmi tous les dieux de ces nations que mes ancêtres ont vouées à la destruction[a], a pu délivrer son peuple de ma main, pour que votre Dieu puisse, lui, vous délivrer de ma main ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que mes ancêtres ont frappées d’interdit ». Le verbe hébreu évoque le fait de vouer à la destruction. Le relatif peut aussi, grammaticalement, se rapporter aux « dieux ».'
    reason: Alternative lexicale et ambiguïté syntaxique du texte hébreu.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Qui, parmi tous les dieux de ces nations
  rationale: « Parmi » rend naturellement la valeur partitive de בְּכָל, tandis que « dieux » et « nations » traduisent les termes hébreux sans commentaire éditorial.
- source_word: אֲשֶׁר הֶחֱרִימוּ
  choice: que … ont vouées à la destruction
  rationale: 'Le verbe חרם ne désigne pas une simple défaite : il évoque une mise à part ayant pour aboutissement la destruction. La formulation retenue en conserve la force particulière dans un français clair.'
- source_word: אֲבוֹתַי
  choice: mes ancêtres
  rationale: Dans cette parole royale, le terme désigne les pères ou prédécesseurs du locuteur. « Mes ancêtres » est naturel en français moderne et évite de suggérer uniquement ses pères immédiats.
- source_word: יָכוֹל לְהַצִּיל
  choice: a pu délivrer
  rationale: La tournure exprime, dans une question rhétorique portant sur le passé, la capacité de soustraire un peuple au pouvoir assyrien. « Délivrer » convient au contexte militaire et politique.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Le singulier hébreu présente chaque dieu comme associé à son propre peuple; le pronom singulier français préserve cette formulation.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: L’image hébraïque de la main comme pouvoir ou domination reste transparente en français et mérite d’être conservée.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: pour que votre Dieu puisse, lui
  rationale: La construction poursuit la comparaison sous forme de défi incrédule. « Pour que … puisse » maintient le lien avec la question précédente, et « lui » fait ressortir le contraste rhétorique sans ajouter de contenu.
theological_decisions:
- issue: Référence aux divinités des nations
  choice: dieux
  alternative: prétendus dieux / idoles
  rationale: Le discours du roi emploie directement אֱלֹהֵי. La traduction reproduit sa rhétorique sans nier ni affirmer explicitement le statut ontologique de ces divinités par un ajout éditorial.
- issue: Portée de חרם dans la vantardise assyrienne
  choice: vouées à la destruction
  alternative: détruites / frappées d’interdit
  rationale: Cette traduction conserve l’idée particulière de consécration ou de mise à part en vue de la destruction, sans réduire le verbe à une destruction ordinaire ni imposer un jargon religieux peu accessible.
- issue: Antécédent du relatif אֲשֶׁר
  choice: les nations
  alternative: les dieux
  rationale: Les deux noms hébreux sont masculins pluriels, de sorte que la forme grammaticale seule ne tranche pas entièrement. Le sens historique et la proximité immédiate favorisent les nations comme objet de la destruction; la note signale l’autre rattachement possible afin de ne pas masquer l’ambiguïté de la source.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La phrase unique conserve la progression du défi rhétorique. « Délivrer » et « de ma main » maintiennent le relief biblique sans archaïsme marqué.
