source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: fr
  text: Ils parlèrent contre le Dieu de Jérusalem[a] comme contre les dieux des peuples de la terre, qui sont l’œuvre des mains humaines[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Dieu de Jérusalem, comme contre les dieux des peuples de la terre ». La préposition hébraïque peut se traduire plus littéralement par « à », mais le contexte indique des paroles hostiles.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’œuvre des mains de l’être humain » ou « l’œuvre des mains de l’homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Ils parlèrent
  rationale: Le piel de דבר signifie couramment « parler ». L’hostilité ressort de la préposition rendue par « contre » et du contexte, sans qu’il soit nécessaire de surcharger le verbe.
- source_word: אֶל
  choice: contre
  rationale: אֶל signifie habituellement « à » ou « vers », mais le contexte immédiat décrit des paroles hostiles et méprisantes. « Contre » en restitue ici naturellement la portée.
- source_word: אֱלֹהֵי יְרוּשָׁלָם
  choice: le Dieu de Jérusalem
  rationale: Bien que la forme אֱלֹהֵי puisse être morphologiquement plurielle, elle désigne ici au singulier le Dieu d’Israël, mis en contraste avec les dieux fabriqués des autres peuples.
- source_word: כְּעַל
  choice: comme contre
  rationale: Cette expression établit une comparaison entre la manière dont ils parlent du Dieu de Jérusalem et celle dont ils parlent des autres dieux. « Comme contre » conserve à la fois la comparaison et la valeur hostile indiquée par le contexte.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: les dieux des peuples de la terre
  rationale: Ici, אֱלֹהֵי est clairement pluriel. « Peuples de la terre » conserve l’expression hébraïque tout en restant naturelle en français.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: l’œuvre de mains humaines
  rationale: L’expression désigne les dieux comme des objets fabriqués par des êtres humains. La relative « qui sont » clarifie en français le lien d’apposition avec les dieux, tandis que « mains humaines » rend le sens générique de הָאָדָם.
theological_decisions:
- issue: Faut-il présenter les paroles comme adressées « au » Dieu de Jérusalem ou prononcées « contre » lui ?
  choice: contre le Dieu de Jérusalem
  alternative: au Dieu de Jérusalem
  rationale: La préposition אֶל peut se traduire littéralement par « à », mais le contexte est celui de propos blasphématoires et méprisants tenus par les serviteurs de Sennachérib. « Contre » exprime cette valeur hostile sans ajouter de contenu doctrinal.
- issue: אֱלֹהֵי יְרוּשָׁלָם doit-il être compris au singulier ou au pluriel ?
  choice: le Dieu de Jérusalem
  alternative: les dieux de Jérusalem
  rationale: אֱלֹהִים et sa forme construite peuvent désigner au singulier le Dieu d’Israël. Le contraste avec les dieux des peuples, explicitement présentés comme fabriqués par des mains humaines, confirme le singulier dans ce passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La formulation conserve la comparaison polémique du texte sans assimiler le Dieu de Jérusalem aux divinités fabriquées ; la relative explicite seulement le rapport syntaxique naturel en français.
