translation:
  language: fr
  text: 'des entrepôts[a] pour les produits agricoles : céréales, vin nouveau[b] et huile ; des abris pour toutes sortes de bétail, et des enclos[c] pour les troupeaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « villes-entrepôts » : le terme peut désigner de grands centres de stockage plutôt que de simples bâtiments.'
    reason: lexical_alternative
  - marker: b
    text: « Vin nouveau » traduit un terme hébreu employé couramment dans les listes de produits agricoles et distingué des mots plus généraux pour le vin.
    reason: lexical_alternative
  - marker: c
    text: Ou « bergeries » ou « parcs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: entrepôts
  rationale: Dans ce contexte d’approvisionnement agricole, le terme désigne des installations de stockage. « Entrepôts » est naturel en français et n’impose pas l’idée plus précise de villes entières.
- source_word: תְבוּאַת
  choice: produits
  rationale: Le nom construit désigne ce que produit la terre. « Produits » convient à l’ensemble coordonné des céréales, du vin nouveau et de l’huile.
- source_word: דָּגָן
  choice: céréales
  rationale: Le terme désigne globalement les céréales plutôt qu’une espèce précise. Le pluriel collectif est idiomatique en français moderne.
- source_word: תִירוֹשׁ
  choice: vin nouveau
  rationale: Cette expression conserve la distinction lexicale habituelle entre תִירוֹשׁ, produit récent de la vigne dans les listes agricoles, et les termes plus généraux désignant le vin.
- source_word: יִצְהָר
  choice: huile
  rationale: Dans la triade agricole, le terme désigne l’huile, généralement l’huile d’olive. Le contexte suffit sans explicitation dans le texte principal.
- source_word: אֻרָוֹת
  choice: étables
  rationale: Le mot désigne des lieux où l’on abrite ou nourrit des animaux domestiques. « Étables » rend clairement cette fonction sans la réduire à des mangeoires.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: pour toutes sortes de bêtes
  rationale: La répétition hébraïque « toute bête et bête » a une valeur distributive et signifie chaque sorte d’animal domestique. Cette formulation française en restitue naturellement le sens.
- source_word: עֲדָרִים
  choice: troupeaux
  rationale: Le terme peut viser des troupeaux de petit bétail. « Troupeaux » reste suffisamment large et naturel.
- source_word: אֲוֵרוֹת
  choice: enclos
  rationale: Le mot désigne des espaces clos destinés aux troupeaux. « Enclos » est clair en français moderne et préserve la distinction avec les étables mentionnées auparavant.
