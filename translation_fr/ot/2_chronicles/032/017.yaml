source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: fr
  text: 'Il écrivit aussi des lettres pour insulter Yahweh[a], le Dieu d’Israël, et parler contre lui en ces termes : « De même que les dieux des nations des pays n’ont pas délivré leur peuple de ma main, de même le Dieu d’Ézéchias ne délivrera pas son peuple de ma main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « outrager » ou « défier ». Le verbe hébreu évoque une injure méprisante dirigée contre Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Il écrivit aussi des lettres
  rationale: סְפָרִים désigne ici des lettres écrites dans le cadre de la campagne d’intimidation; וּ poursuit le récit, rendu naturellement par « aussi ».
- source_word: לְחָרֵף
  choice: pour insulter
  rationale: Le verbe חרף exprime l’outrage, l’injure ou le défi méprisant. « Insulter » est actuel, clair et conserve la force hostile du terme.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette chaîne construite identifie directement Yahweh comme le Dieu d’Israël.
- source_word: וְלֵאמֹר עָלָיו
  choice: et parler contre lui en ces termes
  rationale: Dans ce contexte hostile, עָלָיו a une valeur adversative, tandis que la formule avec לֵאמֹר introduit le contenu des propos.
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: De même que les dieux des nations de ces pays
  rationale: La formulation conserve la comparaison et les pluriels du texte hébreu, tout en évitant en français la tournure peu naturelle « nations des terres ».
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: n’ont pas délivré leur peuple
  rationale: Le hiphil de נצל signifie délivrer ou arracher à un pouvoir; « délivrer » convient au contexte militaire et permet de préserver le parallélisme.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: La métaphore hébraïque de la main comme pouvoir ou domination est intelligible et traditionnellement naturelle en français biblique.
- source_word: כֵּן לֹא יַצִּיל
  choice: de même ... ne délivrera pas
  rationale: כֵּן introduit le second membre parallèle. La répétition de « délivrer » maintient la structure rhétorique de la provocation.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: le Dieu d’Ézéchias
  rationale: Cette traduction littérale du construit préserve la manière méprisante dont l’auteur de la lettre réduit Yahweh au dieu associé à Ézéchias.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Le suffixe renvoie au peuple du Dieu d’Ézéchias; le français conserve cette référence sans l’expliciter davantage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » le présente comme le nom propre du Dieu d’Israël sans le remplacer par un titre.
- issue: Statut des « dieux des nations » dans la parole citée
  choice: Conserver « les dieux » sans commentaire explicatif
  alternative: les prétendus dieux
  rationale: Le verset rapporte la provocation de l’ennemi et n’explicite pas ici le statut ontologique de ces dieux. Ajouter « prétendus » résoudrait une tension que la formulation source laisse intacte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « de même » et de « délivrer » conserve le parallélisme appuyé de la menace. « De ma main » maintient l’image hébraïque du pouvoir sans nuire à la compréhension.
