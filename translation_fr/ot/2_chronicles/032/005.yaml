base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: fr
  text: Il prit courage, rebâtit toute la muraille qui avait des brèches et la rehaussa jusqu’aux tours. À l’extérieur, il construisit une autre muraille. Il renforça aussi le Millo de la cité de David[a] et fabriqua quantité d’armes[b] et de boucliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Millo » était probablement un remblai en terrasses ou un ouvrage de soutènement fortifié de Jérusalem; le sens exact du terme est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « armes de jet », « traits » ou « javelots ». Le terme hébreu ne désigne pas nécessairement une seule catégorie d’armes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Il prit courage
  rationale: Le hitpael de חזק exprime ici le fait de s’affermir ou de se montrer résolu. « Il prit courage » rend naturellement cette valeur réflexive dans le contexte des préparatifs défensifs.
- source_word: וַיִּבֶן אֶת כָּל הַחוֹמָה הַפְּרוּצָה
  choice: rebâtit toute la muraille qui avait des brèches
  rationale: בנה désigne ici la remise en état de la muraille, tandis que פְּרוּצָה indique qu’elle était ouverte par des brèches. La formulation reste claire sans perdre la précision militaire.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: la rehaussa jusqu’aux tours
  rationale: La construction hébraïque est condensée et difficile. La traduction reprend « la muraille » comme objet implicite et conserve la relation aux tours sans adopter la reconstruction plus précise « éleva des tours sur elle ».
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: À l’extérieur, il construisit une autre muraille
  rationale: Le verbe « construisit » est repris du contexte, comme l’exige le français, et לַחוּצָה situe cette seconde muraille à l’extérieur.
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: Il renforça aussi le Millo de la cité de David
  rationale: מִלּוֹא est un terme historique dont le référent exact reste discuté. Sa translittération évite une précision artificielle; « renforça » convient au contexte de fortification.
- source_word: שֶׁלַח
  choice: armes
  rationale: Le terme peut désigner des armes, notamment des projectiles ou armes de jet. Le terme générique « armes » préserve son étendue sémantique.
- source_word: לָרֹב וּמָגִנִּים
  choice: quantité d’armes et de boucliers
  rationale: לָרֹב indique une grande quantité, et מָגִנִּים est le terme courant pour des boucliers. La tournure française est naturelle et conserve cette abondance.
theological_decisions: []
