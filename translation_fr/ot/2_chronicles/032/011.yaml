  text: הֲ/לֹ֤א יְחִזְקִיָּ֨הוּ֙ מַסִּ֣ית אֶתְ/כֶ֔ם לָ/תֵ֣ת אֶתְ/כֶ֔ם לָ/מ֛וּת בְּ/רָעָ֥ב וּ/בְ/צָמָ֖א לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵ֔י/נוּ יַצִּילֵ֕/נוּ מִ/כַּ֖ף מֶ֥לֶךְ אַשּֽׁוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: fr
  text: 'Ézéchias ne vous égare-t-il pas[a] pour vous livrer à la mort par la famine et par la soif, en disant : « Yahweh, notre Dieu, nous délivrera de la main du roi d’Assyrie » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne vous trompe-t-il pas » ou « ne vous entraîne-t-il pas dans l’erreur ». Le verbe hébreu peut évoquer le fait d’égarer quelqu’un ou de le persuader à tort.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ne…-t-il pas
  rationale: Introduit une question rhétorique qui appelle l’assentiment et conserve le ton accusateur.
- source_word: מַסִּית
  choice: égare
  rationale: Le hiphil de סות exprime ici l’action d’amener quelqu’un à se tromper ou à suivre une mauvaise voie; « égarer » reste naturel et préserve l’étendue du sens.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: pour vous livrer à la mort
  rationale: Rend l’idée de vouer les auditeurs à une issue mortelle, avec une tournure française naturelle et proche de la construction hébraïque.
- source_word: בְּרָעָב וּבְצָמָא
  choice: par la famine et par la soif
  rationale: Dans le contexte du siège, רָעָב désigne la famine; la répétition de « par » reflète les deux prépositions hébraïques.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule introductive usuelle du discours rapporté; elle rattache explicitement l’accusation aux paroles d’Ézéchias.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement la construction possessive et conserve la revendication formulée dans la citation.
- source_word: יַצִּילֵנוּ
  choice: nous délivrera
  rationale: Le hiphil de נצל signifie délivrer ou arracher à un pouvoir; « délivrera » convient au contexte militaire sans réduire la portée du verbe.
- source_word: מִכַּף
  choice: de la main de
  rationale: Conserve l’image hébraïque courante de la main comme symbole de pouvoir ou d’emprise, intelligible en français.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: du roi d’Assyrie
  rationale: Rendu français standard et clair de la chaîne construite hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom personnel tout en distinguant celui-ci d’un simple titre.
- issue: Portée de la promesse citée
  choice: nous délivrera
  alternative: nous sauvera
  rationale: « Délivrera » garde au verbe נצל son sens immédiat de libération de l’emprise assyrienne sans lui imposer une portée sotériologique plus large.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La question rhétorique et le ton de propagande accusatrice sont conservés; le nom « Yahweh » est maintenu, et l’ambiguïté lexicale de מַסִּית est signalée en note.
