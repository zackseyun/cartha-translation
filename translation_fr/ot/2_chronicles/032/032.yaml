source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: fr
  text: Le reste des actes d’Ézéchias et ses œuvres de fidélité, tout cela est écrit dans la vision du prophète Ésaïe, fils d’Amots, dans le Livre des rois de Juda et d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le rapport exact entre « la vision du prophète Ésaïe » et « le Livre des rois de Juda et d’Israël » n’est pas entièrement clair en hébreu. Il peut s’agir d’un écrit intégré à ce livre ou rattaché à lui.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule récapitulative royale, דִּבְרֵי désigne les actes ou les affaires du roi plutôt que ses seules paroles. Le וְ initial assure une transition que le français n’a pas besoin d’expliciter par « Et ».
- source_word: יְחִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom du roi.
- source_word: וַחֲסָדָיו
  choice: ainsi que ses œuvres de fidélité
  rationale: חֶסֶד évoque ici la loyauté et la fidélité manifestées par des actes. « Œuvres de fidélité » conserve cette portée concrète et relationnelle sans imposer un sens covenantal technique.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: הִנָּם attire l’attention sur l’ensemble qui précède. « Tout cela » rend naturellement cette valeur présentative en français moderne, tandis que le singulier collectif s’accorde avec cette formulation.
- source_word: בַּחֲזוֹן
  choice: dans la vision
  rationale: חָזוֹן signifie normalement « vision ». Ce sens premier est maintenu plutôt que de l’aplanir en « récit » ou « chronique ».
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: du prophète Ésaïe, fils d’Amots
  rationale: Ordre naturel en français, préservant le nom, la filiation et la fonction prophétique.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: dans le Livre des rois de Juda et d’Israël
  rationale: Dans cette formule bibliographique, עַל relie la vision au livre-source. « Dans » exprime naturellement cette relation, tout en laissant ouverte sa nature exacte; « Livre » signale le titre d’un ouvrage cité.
theological_decisions:
- issue: Portée de חֶסֶד appliqué aux actes d’Ézéchias
  choice: œuvres de fidélité
  alternative: actes de loyauté; œuvres de bonté; actes de fidélité à l’alliance
  rationale: Le terme possède des nuances de fidélité, de loyauté et de bonté relationnelle. Le choix principal préserve cette richesse sans affirmer plus précisément que le contexte qu’il s’agit d’actes techniques de fidélité à l’alliance.
- issue: Rapport entre la vision d’Ésaïe et le Livre des rois
  choice: dans le Livre des rois de Juda et d’Israël
  alternative: rattachée au Livre des rois de Juda et d’Israël; sur le Livre des rois de Juda et d’Israël
  rationale: La préposition עַל est susceptible de plusieurs analyses dans cette formule. Le texte principal adopte le français bibliographique le plus naturel, tandis que la note conserve l’ambiguïté du rapport exact entre les deux désignations.
translation_notes:
  register: Français international moderne, digne et accessible. « Tout cela est écrit » remplace un littéral « voici, ils sont écrits », peu naturel en français, tout en conservant la mise en relief de הִנָּם. La ponctuation maintient la fluidité de la formule historiographique.
