source:
  edition: WLC
  text: וְ/עוֹד֙ דִּבְּר֣וּ עֲבָדָ֔י/ו עַל יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/עַ֖ל יְחִזְקִיָּ֥הוּ עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: fr
  text: Ses serviteurs parlèrent encore contre Yahweh Dieu et contre Ézéchias, son serviteur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parlèrent encore au sujet de Yahweh Dieu et de son serviteur Ézéchias » ; la préposition hébraïque peut avoir un sens plus neutre, mais le contexte favorise ici le sens hostile « contre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: encore
  rationale: L’adverbe poursuit le récit en indiquant que les envoyés ajoutèrent d’autres paroles à leurs propos hostiles.
- source_word: דִּבְּרוּ
  choice: parlèrent
  rationale: Le piel de דבר signifie couramment « parler »; le passé simple convient au registre narratif français.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme désigne ici les agents du roi assyrien. « Serviteurs » conserve l’étendue du mot hébreu sans imposer le statut plus précis d’« esclaves » ou de « fonctionnaires ».
- source_word: עַל
  choice: contre
  rationale: Avec דבר, la préposition peut être neutre (« au sujet de ») ou hostile (« contre »). Le contexte de blasphème et de défi favorise nettement le sens hostile.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin plutôt que de lui substituer un titre.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans l’expression appositive יְהוָה הָאֱלֹהִים, « Yahweh Dieu » est une formulation française concise qui conserve les deux désignations.
- source_word: יְחִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et couramment reconnue du nom hébreu.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Le terme présente Ézéchias dans son rapport de service envers Yahweh; « serviteur » convient mieux ici qu’« esclave » et préserve la portée royale et théologique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le caractère personnel du nom divin.
- issue: Valeur de עבד appliqué à Ézéchias
  choice: son serviteur
  alternative: son esclave
  rationale: Dans ce contexte royal et théologique, le mot exprime le service et l’appartenance à Yahweh sans mettre au premier plan un statut social d’esclave.
- issue: Portée de la préposition עַל après דבר
  choice: contre
  alternative: au sujet de
  rationale: La construction peut être plus neutre, mais le contexte immédiat décrit des paroles hostiles et blasphématoires; « contre » rend cette force sans supprimer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. Le déplacement de « son serviteur » après « Ézéchias » évite l’ambiguïté possible de « son serviteur Ézéchias » après « ses serviteurs » et rattache naturellement le possessif à Yahweh.
