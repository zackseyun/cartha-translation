base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: fr
  text: Soyez forts et courageux ! N’ayez pas peur et ne vous laissez pas abattre devant le roi d’Assyrie ni devant toute la multitude qui est avec lui[a], car ceux qui sont avec nous sont plus nombreux que ceux qui sont avec lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’armée qui est avec lui ». Le mot hébreu peut désigner une multitude ou, dans ce contexte, une masse de soldats.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car avec nous [il y a] plus qu’avec lui ». Cette comparaison elliptique est éclairée par le verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Soyez forts et courageux
  rationale: Les deux impératifs forment une exhortation traditionnelle. Cette formulation française naturelle conserve à la fois l’idée de force et celle de courage.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: N’ayez pas peur et ne vous laissez pas terrifier
  rationale: ירא exprime la peur, tandis que חתת au nifal évoque le fait d’être brisé, consterné ou terrifié. La tournure choisie distingue les deux verbes dans un français actuel.
- source_word: מִפְּנֵי … וּמִלִּפְנֵי
  choice: devant … ni devant
  rationale: Dans cette construction liée à la peur, la locution signifie « face à » ou « en présence de ». « Devant » reste proche de l’image hébraïque et convient au registre.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: toute la multitude qui est avec lui
  rationale: הָמוֹן peut désigner une multitude, une masse de gens ou, ici, une troupe nombreuse. « Multitude » préserve cette amplitude lexicale sans préciser davantage que le texte.
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: ceux qui sont avec nous sont plus nombreux que ceux qui sont avec lui
  rationale: L’hébreu est elliptique, littéralement « avec nous [est] plus qu’avec lui ». Le contexte militaire favorise une comparaison quantitative, explicitée en français sans importer dans ce verset l’explication théologique du verset suivant.
theological_decisions:
- issue: Nature de la comparaison elliptique finale
  choice: 'Comparaison quantitative : « ceux qui sont avec nous sont plus nombreux »'
  alternative: 'Lecture personnelle au singulier : « celui qui est avec nous est plus grand que celui qui est avec lui »'
  rationale: רַב est formellement singulier, mais la construction est elliptique et le contexte oppose la multitude assyrienne aux forces ou soutiens du côté de Juda. Le verset suivant précise la nature de cet appui. La traduction conserve ici la comparaison contextuelle sans introduire une formule venue d’un autre passage.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. L’exclamation rend la vigueur de la double exhortation initiale. Les deux notes sont signalées dans le texte principal.
