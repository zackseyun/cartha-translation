revisions:
- from: Mais Ézéchias ne répondit pas au bienfait qu’il avait reçu[a], car son cœur s’enorgueillit. La colère s’abattit donc sur lui, ainsi que sur Juda et Jérusalem.
  to: Mais Ézéchias ne rendit pas en retour à la mesure du bienfait qui lui avait été fait[a], car son cœur s’enorgueillit. La colère s’abattit donc sur lui, ainsi que sur Juda et Jérusalem.
  rationale: La révision explicite le rapport de proportion exprimé par כ (« à la mesure de ») et le retour exprimé par הֵשִׁיב (« rendit en retour »). Elle maintient l’ambiguïté quant à la nature exacte du retour attendu et quant à l’agent de la colère.
