  text: וְ/לֹא כִ/גְמֻ֤ל עָלָי/ו֙ הֵשִׁ֣יב יְחִזְקִיָּ֔הוּ כִּ֥י גָבַ֖הּ לִבּ֑/וֹ וַ/יְהִ֤י עָלָי/ו֙ קֶ֔צֶף וְ/עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: fr
  text: Mais Ézéchias ne rendit pas en retour à la mesure du bienfait qui lui avait été fait[a], car son cœur s’enorgueillit. La colère s’abattit donc sur lui, ainsi que sur Juda et Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne répondit pas selon le bienfait qu’il avait reçu ». L’expression hébraïque évoque de manière générale un retour approprié au bien reçu.
    reason: Alternative lexicale préservant la valeur comparative de כ et l’étendue de sens de גְּמוּל.
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: au bienfait qu’il avait reçu
  rationale: גְּמוּל peut désigner ce qui est accordé à quelqu’un, notamment un bienfait. Dans ce contexte de guérison et de délivrance, « le bienfait qu’il avait reçu » exprime naturellement le bien fait à Ézéchias, tandis que la construction avec כ est rendue par le rapport implicite entre sa réponse et le bienfait.
- source_word: הֵשִׁיב
  choice: ne répondit pas
  rationale: Le hifil de שוב signifie fondamentalement « faire revenir, rendre ». Associé à גְּמוּל, il évoque ici la réponse ou le retour approprié à un bienfait. « Ne répondit pas » reste assez large pour ne pas limiter la faute à l’absence de remerciements ni suggérer qu’un bienfait divin pourrait être remboursé au sens strict.
- source_word: גָבַהּ לִבּוֹ
  choice: son cœur s’enorgueillit
  rationale: L’expression hébraïque dit littéralement que son cœur s’éleva. Le verbe pronominal « s’enorgueillit » en communique clairement le sens moral tout en conservant le cœur comme siège intérieur de l’attitude.
- source_word: קֶצֶף
  choice: la colère
  rationale: קֶצֶף désigne une vive colère, ici comprise dans le contexte comme un jugement divin. « La colère » est une formulation française digne et naturelle, sans expliciter un agent que cette proposition ne nomme pas.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: La colère s’abattit donc sur lui
  rationale: La tournure existentielle hébraïque indique que la colère atteignit Ézéchias. « S’abattit sur lui » exprime naturellement la venue du jugement, et « donc » rend le lien consécutif avec l’orgueil mentionné auparavant.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Juda et Jérusalem
  rationale: Formes françaises usuelles des noms géographiques bibliques.
theological_decisions:
- issue: Nature de la faute d’Ézéchias face à la faveur reçue
  choice: Ézéchias n’a pas apporté une réponse à la mesure du bienfait reçu, sans préciser qu’il s’agissait uniquement d’un manque de remerciement verbal.
  alternative: Ézéchias n’a pas rendu grâce pour le bienfait reçu.
  rationale: L’hébreu décrit largement l’absence de retour approprié au bien reçu. La traduction préserve cette portée morale sans réduire la faute à un acte dévotionnel particulier.
- issue: Origine de la colère
  choice: L’agent de la colère demeure implicite.
  alternative: La colère de l’Éternel s’abattit sur lui.
  rationale: Le contexte permet de comprendre qu’il s’agit de la colère divine, mais cette proposition ne nomme pas explicitement Dieu. La traduction n’ajoute donc pas de sujet absent de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « S’enorgueillit » restitue l’idiome du cœur élevé sans lourdeur littérale. La formulation conserve l’implicite du texte concernant l’auteur de la colère.
