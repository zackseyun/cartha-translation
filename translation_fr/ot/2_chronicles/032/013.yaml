source:
  edition: WLC
  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: fr
  text: Ne savez-vous pas ce que mes pères[a] et moi avons fait à tous les peuples des différents pays ? Les dieux des nations de ces pays ont-ils jamais pu délivrer leur pays de ma main ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes ancêtres ». L’hébreu emploie ici un langage familial à portée dynastique.
    reason: Alternative lexicale précisant le sens contextuel de « pères ».
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Ne savez-vous pas
  rationale: Cette tournure conserve la question rhétorique qui appelle une réponse affirmative, tout en restant naturelle en français moderne.
- source_word: מֶה עָשִׂיתִי
  choice: ce que ... avons fait
  rationale: Le passé composé exprime des actes accomplis dont le résultat demeure pertinent dans cette provocation.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: mes pères et moi
  rationale: « Pères » préserve le langage familial et dynastique de l’hébreu; l’ordre est adapté à l’usage idiomatique français sans modifier les participants.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: à tous les peuples des différents pays
  rationale: « Différents pays » rend explicite et naturellement le pluriel concret הָאֲרָצוֹת, tandis que « à » convient à la construction française « faire quelque chose à quelqu’un ».
- source_word: הֲיָכוֹל יָכְלוּ
  choice: ont-ils vraiment pu
  rationale: « Vraiment » restitue l’intensification produite par l’infinitif absolu associé au verbe conjugué.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: les dieux des nations de ces pays
  rationale: La chaîne de compléments est conservée dans une formulation française intelligible, désignant les divinités des nations établies dans ces pays.
- source_word: לְהַצִּיל
  choice: délivrer
  rationale: Dans ce contexte de menace militaire, « délivrer » exprime le fait de soustraire un territoire à la puissance d’un conquérant.
- source_word: אֶת אַרְצָם
  choice: leur pays
  rationale: 'Le singulier collectif avec suffixe pluriel est conservé: il s’agit du pays appartenant à chacune des nations évoquées.'
- source_word: מִיָדִי
  choice: de ma main
  rationale: Cette traduction préserve la métaphore hébraïque de la main comme image du pouvoir ou de la domination, tout en demeurant compréhensible en français.
theological_decisions:
- issue: Portée du mot « dieux » dans la vantardise du roi païen
  choice: Traduire אֱלֹהֵי directement par « les dieux », sans qualification.
  alternative: Employer « les prétendus dieux » ou une autre formule qui nie explicitement leur divinité.
  rationale: Le propos rapporte la provocation de Sennachérib, qui compare les divinités des nations vaincues au Dieu de Juda. La traduction doit préserver sa rhétorique sans ajouter au texte un commentaire théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve la vigueur de la double question rhétorique, l’emphase de l’hébreu et la métaphore de la « main », sans rendre la syntaxe artificiellement littérale.
