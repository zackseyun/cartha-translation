  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: fr
  text: Avec lui, il y a un bras de chair[a] ; mais avec nous, il y a Yahweh, notre Dieu, pour nous aider et livrer nos batailles. Ils s’appuyèrent sur les paroles d’Ézéchias, roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la force humaine ». L’hébreu conserve l’image du « bras de chair », qui désigne une puissance seulement humaine, par contraste avec l’aide de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Préserve le parallélisme direct avec וְעִמָּנוּ, « mais avec nous », sans expliciter davantage l’idée de soutien.
- source_word: זְרוֹעַ בָּשָׂר
  choice: un bras de chair
  rationale: Conserve la métaphore hébraïque de la puissance purement humaine, opposée à l’aide de Yahweh. La tournure « il n’y a que » rend en français la limitation rhétorique impliquée par le contraste.
- source_word: וְעִמָּנוּ
  choice: mais avec nous
  rationale: Le waw porte ici un contraste marqué entre la force humaine de l’ennemi et la présence secourable de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend simplement l’expression relationnelle et confessionnelle du texte.
- source_word: לְעָזְרֵנוּ
  choice: pour nous aider
  rationale: L’infinitif précédé de לְ exprime ici la finalité de la présence de Yahweh.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: et mener nos combats
  rationale: Rend naturellement en français l’infinitif suivi de son complément de même racine, tout en conservant l’idée d’une action guerrière accomplie par Dieu.
- source_word: וַיִּסָּמְכוּ
  choice: s’appuya
  rationale: Conserve l’image fondamentale du verbe, employé figurativement pour exprimer la confiance suscitée par les paroles du roi.
- source_word: עַל דִּבְרֵי
  choice: sur les paroles de
  rationale: S’accorde avec « s’appuyer sur » et maintient le pluriel hébreu דִּבְרֵי.
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Ézéchias, roi de Juda
  rationale: Emploie la forme française traditionnelle du nom et reproduit pleinement le titre royal et le territoire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Contraste entre la puissance humaine et l’aide divine
  choice: « il n’y a qu’un bras de chair ; mais avec nous… »
  alternative: « avec lui est un bras de chair, et avec nous… »
  rationale: Cette formulation explicite avec mesure la valeur restrictive et adversative du parallélisme, sans nier la réalité de la puissance militaire humaine ni ajouter une promesse étrangère au texte.
- issue: Rôle de Yahweh dans les combats
  choice: « mener nos combats »
  alternative: « combattre nos combats »
  rationale: La formulation française naturelle maintient que Yahweh agit dans les combats appartenant à Juda, sans préciser au-delà de l’hébreu la modalité de cette action.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « bras de chair » est maintenue et expliquée en note. Le passé simple convient au registre narratif soutenu du livre, tandis que la syntaxe du discours reste claire et actuelle.
