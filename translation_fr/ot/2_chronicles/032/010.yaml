base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: fr
  text: 'Voici ce que dit Sennachérib, roi d’Assyrie : « En quoi mettez-vous votre confiance, vous qui demeurez assiégés à Jérusalem ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française naturelle et digne qui rend l’introduction solennelle « Ainsi a dit » sans archaïsme inutile.
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  choice: En quoi mettez-vous votre confiance
  rationale: Rend directement l’objet interrogatif de la confiance et conserve la mise en cause rhétorique de Sennachérib.
- source_word: וְיֹשְׁבִים בְּמָצוֹר
  choice: pour rester assiégés
  rationale: Le waw peut ici introduire la conséquence ou le résultat pratique de cette confiance. « Rester assiégés » exprime naturellement la situation prolongée des habitants.
- source_word: בִּירוּשָׁלִָם
  choice: dans Jérusalem
  rationale: La préposition ב est rendue littéralement par « dans »; la formulation souligne que les destinataires demeurent à l’intérieur de la ville assiégée.
