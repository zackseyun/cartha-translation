review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Sennachérib interroge les habitants sur le fondement de leur confiance alors qu’ils sont enfermés dans Jérusalem sous siège. Toutefois, « pour rester assiégés » attribue trop nettement une valeur finale au waw et peut suggérer que leur confiance a pour but de demeurer assiégés. Le participe וְיֹשְׁבִים décrit plus naturellement leur situation concomitante : ils demeurent/en sont réduits à être sous siège.'
  naturalness: « Dans Jérusalem » est peu idiomatique en français moderne pour situer des personnes dans une ville ; « à Jérusalem » est la formulation normale. « Vous qui demeurez assiégés » est plus fluide et plus exact que « pour rester assiégés ».
  terminology: « Sennachérib, roi d’Assyrie » et « mettre sa confiance en » conviennent au registre et à l’usage biblique français moderne. Aucun terme théologique spécialisé ni aucune note ne sont requis.
  issues:
  - severity: medium
    issue: Valeur de « pour rester assiégés »
    rationale: Cette tournure présente la situation de siège comme un objectif ou une finalité. Le texte hébreu coordonne la question sur leur confiance avec leur fait de demeurer sous siège ; une relative descriptive préserve mieux cette relation sans la surinterpréter.
  - severity: low
    issue: « dans Jérusalem »
    rationale: Bien que calqué sur la préposition hébraïque, cet emploi est peu naturel en français courant. « à Jérusalem » rend correctement le repérage spatial sans perte de sens.
