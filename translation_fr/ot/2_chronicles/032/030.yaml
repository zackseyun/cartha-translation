base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: fr
  text: C’est Ézéchias qui boucha l’ouverture supérieure d’où sortent les eaux de Guihon[a] et les dirigea[b] vers le bas, vers l’ouest, jusqu’à la cité de David. Ézéchias réussit dans toutes ses entreprises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la source supérieure de Guihon ». Le terme hébreu peut désigner l’endroit d’où l’eau sort ou, plus largement, la source ou son écoulement.
    reason: lexical_alternative
  - marker: b
    text: Ou « les canalisa » ou « les fit couler en ligne droite ». Le verbe hébreu suggère que les eaux ont été orientées selon un tracé direct.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: C’est Ézéchias qui
  rationale: La tournure clivée rend naturellement en français l’insistance produite par le pronom suivi du nom propre.
- source_word: סָתַם
  choice: boucha
  rationale: Le verbe désigne l’action de fermer ou d’obstruer une ouverture; « boucha » convient au contexte hydraulique.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: l’issue supérieure des eaux de Guihon
  rationale: Cette formulation conserve la chaîne nominale hébraïque et la distinction topographique exprimée par « supérieure », sans identifier trop précisément l’aménagement concerné.
- source_word: וַיַּישְּׁרֵם
  choice: les dirigea
  rationale: Le causatif de ישר évoque ici l’orientation des eaux selon un parcours déterminé; « dirigea » reste clair sans ajouter explicitement l’idée d’un canal.
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: vers le bas, à l’ouest de la cité de David
  rationale: La traduction garde à la fois le mouvement descendant et l’indication occidentale, tout en rattachant naturellement cette dernière à la cité de David.
- source_word: וַיַּצְלַח יְחִזְקִיָּהוּ בְּכָל מַעֲשֵׂהוּ
  choice: Ézéchias réussit dans toutes ses entreprises
  rationale: « Réussit » exprime le succès indiqué par צלח; le singulier collectif מַעֲשֵׂהוּ est rendu idiomatiquement par « toutes ses entreprises ».
