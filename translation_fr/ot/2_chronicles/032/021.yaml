  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: fr
  text: Le SEIGNEUR envoya un ange, qui extermina tous les vaillants guerriers, les chefs et les officiers dans le camp du roi d’Assyrie. Celui-ci retourna alors dans son pays, le visage couvert de honte. Il entra dans le temple de son dieu, et ceux qui étaient issus de son propre corps[a] l’y tuèrent par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « issus de ses entrailles » ; il s’agit de ses descendants directs.'
    reason: La note explique l’image hébraïque inhabituelle sans remplacer silencieusement par le terme plus précis « fils ».
lexical_decisions:
- source_word: וַיַּכְחֵד
  choice: extermina
  rationale: Le verbe exprime ici l’élimination complète des forces visées; « extermina » restitue sa force dans un français naturel.
- source_word: גִּבּוֹר חַיִל
  choice: vaillants guerriers
  rationale: L’expression désigne des combattants puissants et aguerris, et non simplement des hommes courageux.
- source_word: נָגִיד וְשָׂר
  choice: les chefs et les officiers
  rationale: Ces deux titres distincts désignent des responsables ou commandants; la formulation française maintient la distinction sans imposer des grades modernes trop précis.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: le visage couvert de honte
  rationale: Cette tournure idiomatique rend naturellement l’image hébraïque de la honte visible sur le visage.
- source_word: בֵּית אֱלֹהָיו
  choice: le temple de son dieu
  rationale: Dans ce contexte cultuel, « maison » désigne le sanctuaire du dieu assyrien; « temple » est clair et idiomatique.
- source_word: מֵעָיו
  choice: son propre corps
  rationale: Littéralement « ses entrailles »; l’expression désigne ses descendants directs tout en conservant l’image corporelle du texte.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: le tuèrent par l’épée
  rationale: La locution signifie le faire tomber sous les coups de l’épée, donc le tuer; cette formulation est exacte et naturelle.
theological_decisions:
- issue: Représentation du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé / l’Éternel
  rationale: « le SEIGNEUR » signale le nom divin par les petites capitales selon une convention française largement intelligible, sans imposer une vocalisation débattue.
- issue: Identité des meurtriers du roi d’Assyrie
  choice: certains de ceux qui étaient issus de son propre corps
  alternative: certains de ses fils
  rationale: Le texte hébreu emploie une expression corporelle désignant sa descendance sans utiliser explicitement le mot « fils »; la traduction conserve cette formulation et son degré de précision.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases restent accessibles, avec un vocabulaire militaire courant et une seule note pour éclairer l’expression généalogique littérale.
