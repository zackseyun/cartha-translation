revisions:
- from: Le SEIGNEUR envoya un ange, qui extermina tous les vaillants guerriers, les chefs et les officiers dans le camp du roi d’Assyrie. Celui-ci retourna donc dans son pays, le visage couvert de honte. Puis il entra dans le temple de son dieu, et certains de ceux qui étaient issus de son propre corps[a] l’y tuèrent par l’épée.
  to: Le SEIGNEUR envoya un ange, qui extermina tous les vaillants guerriers, les chefs et les officiers dans le camp du roi d’Assyrie. Celui-ci retourna alors dans son pays, le visage couvert de honte. Il entra dans le temple de son dieu, et ceux qui étaient issus de son propre corps[a] l’y tuèrent par l’épée.
  rationale: La révision supprime l’ajout interprétatif « certains de » afin de préserver la portée non quantifiée du sujet hébreu. Elle remplace aussi « donc » par « alors », qui restitue la succession narrative sans suggérer une relation logique plus forte. Le reste du texte et la note sont conservés, car ils sont fidèles et naturels.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement la séquence et les termes essentiels du texte hébreu : l’envoi de l’ange, la destruction des combattants et responsables assyriens, le retour honteux du roi et sa mise à mort dans le sanctuaire de son dieu. Toutefois, « certains de ceux » ajoute une restriction absente de l’hébreu, qui désigne simplement « ceux qui étaient issus de ses entrailles ».'
  naturalness: Le français est moderne, clair et d’un registre narratif approprié. « Retourna donc » peut être resserré en « retourna alors », plus proche de la simple progression narrative du waw consécutif, sans effet causal indu.
  terminology: « Le SEIGNEUR » rend correctement le tétragramme selon la convention des petites capitales. « Temple de son dieu », « chefs et officiers » et « par l’épée » conviennent au contexte. La note maintient utilement l’image corporelle de l’hébreu tout en indiquant son sens généalogique.
  issues:
  - severity: medium
    issue: Ajout de « certains de »
    rationale: Le syntagme hébreu וּמִיצִיאֵי מֵעָיו signifie « ceux qui étaient issus de ses entrailles / de son corps ». Il ne comporte pas de quantificateur équivalant à « certains ». Même si l’histoire parallèle identifie des fils précis, le verset ne formule pas ici cette restriction.
  revised_text: Le SEIGNEUR envoya un ange, qui extermina tous les vaillants guerriers, les chefs et les officiers dans le camp du roi d’Assyrie. Celui-ci retourna alors dans son pays, le visage couvert de honte. Il entra dans le temple de son dieu, et ceux qui étaient issus de son propre corps[a] l’y tuèrent par l’épée.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « issus de ses entrailles » ; il s’agit de ses descendants directs.'
    reason: La note explique l’image hébraïque inhabituelle sans remplacer silencieusement par le terme plus précis « fils ».
  revision_rationale: La révision supprime l’ajout interprétatif « certains de » afin de préserver la portée non quantifiée du sujet hébreu. Elle remplace aussi « donc » par « alors », qui restitue la succession narrative sans suggérer une relation logique plus forte. Le reste du texte et la note sont conservés, car ils sont fidèles et naturels.
