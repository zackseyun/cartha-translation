source:
  edition: WLC
  text: וַ/יִּתֵּ֛ן שָׂרֵ֥י מִלְחָמ֖וֹת עַל הָ/עָ֑ם וַ/יִּקְבְּצֵ֣/ם אֵלָ֗י/ו אֶל רְחוֹב֙ שַׁ֣עַר הָ/עִ֔יר וַ/יְדַבֵּ֥ר עַל לְבָבָ֖/ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: fr
  text: 'Il établit des chefs militaires à la tête du peuple, les rassembla auprès de lui sur la place de la porte de la ville et leur parla au cœur[a] en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « parla sur leur cœur » : expression qui désigne ici des paroles destinées à les encourager et à les affermir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il établit
  rationale: Dans cette construction, le verbe signifie placer quelqu’un dans une fonction d’autorité. « Établir » exprime naturellement cette nomination tout en restant proche de l’image hébraïque.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: des chefs militaires
  rationale: L’expression désigne des responsables chargés de la conduite des forces armées. « Chefs militaires » est clair, actuel et non archaïque.
- source_word: עַל הָעָם
  choice: à la tête du peuple
  rationale: La préposition marque ici l’autorité exercée sur le peuple. Cette tournure française rend cette relation plus naturellement que le calque « sur le peuple ».
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: les rassembla auprès de lui
  rationale: La traduction conserve à la fois l’idée de rassemblement et le fait qu’Ézéchias les convoque personnellement auprès de lui.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: sur la place de la porte de la ville
  rationale: רְחוֹב désigne un espace public dégagé, ici associé à la porte urbaine. « La place de la porte de la ville » conserve ce cadre civique.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: leur parla au cœur
  rationale: Cette expression française conserve l’image du cœur et suggère une parole destinée à toucher intérieurement, encourager et affermir les auditeurs.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Cette formule introduit directement les paroles rapportées au verset suivant.
theological_decisions: []
