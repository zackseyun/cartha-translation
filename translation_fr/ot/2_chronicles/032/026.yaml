source:
  edition: WLC
  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: fr
  text: Ézéchias s’humilia à cause de l’orgueil de son cœur[a], lui et les habitants de Jérusalem, et la colère de Yahweh ne vint pas sur eux du temps d’Ézéchias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet de l’orgueil de son cœur ». L’hébreu dit littéralement « dans/pour la hauteur de son cœur », une expression qui désigne l’orgueil intérieur.
    reason: alternative lexicale et ambiguïté de la préposition hébraïque
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: s’humilia
  rationale: 'Le niphal de כנע a ici une valeur réfléchie ou moyenne dans ce contexte de repentance : Ézéchias s’abaisse lui-même plutôt qu’il ne subit simplement une humiliation.'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: à cause de l’orgueil de son cœur
  rationale: גֹבַהּ signifie littéralement « hauteur » ou « élévation » ; associé au cœur, le terme désigne l’orgueil intérieur. La préposition ב peut ici exprimer la cause, tout en conservant une certaine souplesse sémantique signalée en note.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: lui ainsi que les habitants de Jérusalem
  rationale: Le pronom הוּא met Ézéchias en relief et l’associe explicitement aux habitants de la ville. Cette formulation est naturelle en français et garde cette inclusion emphatique.
- source_word: קֶצֶף יְהוָה
  choice: la colère de Yahweh
  rationale: קֶצֶף désigne une colère intense se manifestant dans le jugement. « Colère » est actuel et digne en français ; le nom divin est rendu directement par « Yahweh ».
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: ne vint pas sur eux
  rationale: La formulation conserve assez directement l’image hébraïque d’un jugement qui vient sur des personnes.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: pendant la vie d’Ézéchias
  rationale: L’expression signifie littéralement « aux jours d’Ézéchias ». Dans ce contexte, elle indique que le jugement ne survint pas de son vivant ; cette formulation française est claire sans préciser davantage s’il s’agit strictement de son règne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Rapport entre l’humiliation et le délai du jugement
  choice: Aussi, la colère de Yahweh ne vint pas sur eux
  alternative: et la colère de Yahweh ne vint pas sur eux
  rationale: Le contexte et l’enchaînement narratif présentent l’absence de jugement pendant la vie d’Ézéchias comme liée à son humiliation et à celle des habitants. « Aussi » exprime ce rapport sans développer une doctrine causale au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Pendant la vie d’Ézéchias » communique naturellement la portée temporelle de l’expression hébraïque.
