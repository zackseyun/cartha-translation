revisions:
- from: Ézéchias s’humilia à cause de l’orgueil de son cœur[a], lui ainsi que les habitants de Jérusalem. Aussi, la colère de Yahweh ne vint pas sur eux pendant la vie d’Ézéchias.
  to: Ézéchias s’humilia à cause de l’orgueil de son cœur[a], lui et les habitants de Jérusalem, et la colère de Yahweh ne vint pas sur eux du temps d’Ézéchias.
  rationale: La révision remplace la formulation temporelle trop spécifique par « du temps d’Ézéchias », qui reflète mieux « aux jours d’Ézéchias ». Elle conserve le lien narratif exprimé par le waw sans renforcer inutilement la causalité par « Aussi ».
