    issue: « pendant la vie d’Ézéchias » restreint la portée de בִּימֵי יְחִזְקִיָּהוּ.
    rationale: L’expression hébraïque signifie littéralement « aux jours d’Ézéchias » et peut viser son époque ou son règne. « Du temps d’Ézéchias » garde cette amplitude sans imposer la notion de durée de vie.
  revised_text: Ézéchias s’humilia à cause de l’orgueil de son cœur[a], lui et les habitants de Jérusalem, et la colère de Yahweh ne vint pas sur eux du temps d’Ézéchias.
