language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: fr
  text: Beaucoup apportaient une offrande à Yahvé à Jérusalem[a], ainsi que des présents de choix à Ézéchias, roi de Juda[b]. Après cela, il fut tenu en grand honneur aux yeux de toutes les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers Jérusalem »; la préposition hébraïque peut indiquer ici la destination ou le lieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « des présents précieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Beaucoup
  rationale: L’adjectif est employé comme substantif et désigne un grand nombre de personnes, sans qu’il soit nécessaire d’ajouter « de gens ».
- source_word: מְבִיאִים
  choice: apportaient
  rationale: Le participe exprime ici une action en cours ou répétée dans un récit au passé; l’imparfait français en rend naturellement la durée.
- source_word: מִנְחָה
  choice: une offrande
  rationale: Le terme peut désigner un don, un tribut ou une offrande; avec Yahvé comme destinataire, « offrande » convient au contexte religieux sans préciser indûment sa nature.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La préposition indique le destinataire, et le nom divin est rendu directement par « Yahvé ».
- source_word: לִירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition ל peut marquer la destination (« vers/à ») ou, dans ce contexte, le lieu où l’offrande est présentée; le français « à Jérusalem » conserve naturellement cette latitude.
- source_word: מִגְדָּנוֹת
  choice: des présents de choix
  rationale: Le nom désigne des choses précieuses ou choisies offertes en cadeau, sans imposer le sens plus étroit de friandises.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: à Ézéchias, roi de Juda
  rationale: La formulation indique clairement Ézéchias comme destinataire et « roi de Juda » comme apposition.
- source_word: וַיִּנַּשֵּׂא
  choice: il fut tenu en grand honneur
  rationale: Le niphal exprime l’élévation d’Ézéchias dans l’estime publique; cette tournure française rend le statut acquis sans suggérer nécessairement une action divine explicite.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: aux yeux de toutes les nations
  rationale: Cette expression idiomatique évoque l’estime ou la considération publique; le calque est naturel en français.
- source_word: מֵאַחֲרֵי כֵן
  choice: Après cela
  rationale: L’expression marque la succession temporelle par rapport aux événements précédents.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte le tétragramme; « Yahvé » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens de l’élévation d’Ézéchias
  choice: tenu en grand honneur
  alternative: élevé
  rationale: Le contexte et la mention « aux yeux de toutes les nations » orientent vers le prestige et la considération publics, tout en conservant la valeur passive du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait rend l’aspect duratif du participe hébreu; la seconde proposition devient une phrase distincte pour une lecture fluide sans modifier le rapport temporel.
