  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: fr
  text: 'N’est-ce pas Ézéchias lui-même qui a supprimé ses hauts lieux et ses autels, et qui a dit à Juda et à Jérusalem : « Vous vous prosternerez devant un seul autel et, sur lui, vous ferez brûler de l’encens[a] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous vous prosternerez devant un autel unique et, sur lui, vous ferez monter les offrandes en fumée. »'
    reason: Le verbe תַּקְטִירוּ peut désigner plus largement l’action de faire monter une offrande en fumée, et אֶחָד peut être rendu par « unique » aussi bien que par « un seul ».
lexical_decisions:
- source_word: הֲלֹא הוּא יְחִזְקִיָּהוּ
  choice: N’est-ce pas Ézéchias lui-même
  rationale: La question rhétorique attend l’assentiment, et « lui-même » rend l’insistance produite par le pronom suivi du nom propre.
- source_word: הֵסִיר
  choice: a supprimé
  rationale: Ce verbe rend naturellement l’action d’éliminer les lieux de culte visés, sans ajouter l’idée d’une destruction matérielle.
- source_word: בָּמֹתָיו וְאֶת מִזְבְּחֹתָיו
  choice: ses hauts lieux et ses autels
  rationale: « Hauts lieux » est le terme traditionnel et précis pour les sanctuaires locaux. Les possessifs explicites de l’hébreu sont conservés afin de respecter la présentation polémique du locuteur.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: et qui a dit à Juda et à Jérusalem
  rationale: La formule hébraïque introduisant les paroles est rendue sans le pléonasme peu naturel « a dit… en disant » ; les deux destinataires sont maintenus.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: devant un seul autel
  rationale: « Devant » conserve le sens spatial de לִפְנֵי, tandis que « un seul » souligne la centralisation du culte impliquée par אֶחָד.
- source_word: תִּשְׁתַּחֲווּ
  choice: vous vous prosternerez
  rationale: Le choix conserve le geste concret d’abaissement cultuel plutôt que de le généraliser en simple « adoration ».
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: et, sur lui, vous ferez brûler de l’encens
  rationale: Cette formulation rend le sens cultuel courant de la forme causative de קטר et reprend explicitement l’autel par « sur lui ». Le sens plus général de faire monter une offrande en fumée est signalé en note.
theological_decisions:
- issue: Point de vue du locuteur dans les possessifs « ses hauts lieux » et « ses autels »
  choice: Conserver les possessifs tels quels dans le texte principal.
  alternative: Expliciter « les hauts lieux et les autels de votre Dieu » ou neutraliser par des articles définis.
  rationale: Les suffixes possessifs sont explicites en hébreu et appartiennent à l’argument polémique assyrien. Le texte ne doit ni corriger la manière dont le locuteur présente la réforme, ni transformer son accusation en appréciation du narrateur.
- issue: Centralisation du culte autour d’un seul autel
  choice: Traduire directement l’ordre relatif à « un seul autel », sans expliquer la réforme d’Ézéchias.
  alternative: Paraphraser en parlant exclusivement de l’autel du temple de Jérusalem.
  rationale: Le verset rapporte une accusation et n’en fournit pas ici l’évaluation théologique. L’absence d’explication préserve la tension entre la présentation du locuteur et le contexte biblique plus large.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe de la question rhétorique et le discours direct sont conservés, tandis que la formule hébraïque redondante « dire… en disant » est allégée pour rester naturelle en français.
