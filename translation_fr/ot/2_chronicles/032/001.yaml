  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: fr
  text: Après ces événements et ces actes de fidélité[a], Sennachérib, roi d’Assyrie, vint en Juda. Il établit son camp contre les villes fortifiées, avec l’intention d’y ouvrir une brèche pour s’en emparer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et cette fidélité » ou « et ces actes fidèles ». Le mot hébreu peut signifier « vérité » ou « fidélité » et renvoie probablement ici à la conduite fidèle d’Ézéchias rapportée précédemment.
    reason: lexical_alternative
  - marker: b
    text: La tournure hébraïque exprime l’intention ou la résolution d’ouvrir les villes, c’est-à-dire d’y faire une brèche, afin de les prendre pour lui-même.
    reason: idiom_clarification
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: Après ces événements
  rationale: Dans ce récit, דְּבָרִים renvoie aux faits précédemment rapportés. « Événements » exprime naturellement cette valeur narrative en français moderne.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: et ces actes de fidélité
  rationale: אֱמֶת peut désigner la vérité ou la fidélité. Ici, le contexte récapitule vraisemblablement la conduite fidèle d’Ézéchias; le pluriel explicite aussi l’accord contextuel avec le démonstratif הָאֵלֶּה sans reproduire une tournure hébraïque peu naturelle en français.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Sennachérib, roi d’Assyrie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom, suivie du titre royal rendu directement.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: vint en Juda
  rationale: Rend simplement le mouvement vers le territoire de Juda, sans ajouter explicitement l’idée d’invasion, déjà manifeste dans la suite.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: Il établit son camp contre les villes fortifiées
  rationale: חנה avec עַל décrit l’installation d’un camp face à une cible hostile. Cette formulation conserve l’image militaire sans remplacer le texte par l’idée plus interprétative d’un siège formel.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: avec l’intention d’y ouvrir une brèche pour s’en emparer
  rationale: La tournure exprime une résolution ou une intention. בקע évoque l’ouverture forcée d’une brèche, tandis que אֵלָיו indique ici que les villes doivent être prises à son profit. La formulation française explicite prudemment cet idiome.
