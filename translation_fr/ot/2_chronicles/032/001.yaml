    issue: La note b présente « et il résolut de les ouvrir pour lui » comme une formulation littérale.
    rationale: Le verbe וַיֹּאמֶר signifie littéralement « et il dit », même si, dans cette construction, il peut exprimer une intention ou une résolution. La note doit distinguer la forme littérale de l’interprétation idiomatique.
