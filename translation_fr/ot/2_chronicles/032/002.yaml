  text: וַ/יַּרְא֙ יְחִזְקִיָּ֔הוּ כִּי בָ֖א סַנְחֵרִ֑יב וּ/פָנָ֕י/ו לַ/מִּלְחָמָ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/002.yaml
  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
translation:
  language: fr
  text: Quand Ézéchias vit que Sennachérib était venu et qu’il avait l’intention de faire la guerre à Jérusalem,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son visage [était] pour la guerre contre Jérusalem »; cette expression signifie qu’il était résolu à l’attaquer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה, dans la suite narrative, signifie naturellement « vit »; le contexte permet aussi d’entendre une prise de conscience sans devoir l’expliciter.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’Ézéchias constata.
- source_word: בָא
  choice: était venu
  rationale: L’accompli décrit la venue de Sennachérib comme déjà réalisée au moment où Ézéchias en prend acte.
- source_word: סַנְחֵרִיב
  choice: Sennachérib
  rationale: Forme française usuelle du nom propre.
- source_word: וּפָנָיו
  choice: il avait l’intention
  rationale: Littéralement « son visage »; avec לַמִּלְחָמָה, cette tournure exprime l’orientation résolue de Sennachérib vers la guerre. Une note conserve l’image hébraïque.
- source_word: לַמִּלְחָמָה
  choice: de faire la guerre
  rationale: Cette formulation française naturelle restitue la visée militaire exprimée par « pour la guerre ».
- source_word: עַל
  choice: à
  rationale: Après « faire la guerre », le français idiomatique emploie « à » devant la ville visée; la valeur hostile de la préposition hébraïque reste claire.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
