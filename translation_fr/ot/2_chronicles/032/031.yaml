source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: fr
  text: Ainsi, en ce qui concerne les émissaires des chefs de Babylone, que ceux-ci avaient envoyés auprès de lui pour s’informer du signe[a] qui s’était produit dans le pays, Dieu le laissa, afin de le mettre à l’épreuve et de connaître[b] tout ce qui était dans son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du prodige » ou « du présage ».
    reason: lexical_alternative
  - marker: b
    text: 'Le texte dit littéralement « connaître ». Certains comprennent ici : « révéler » ou « mettre au jour » ce qui était dans son cœur.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Et de même
  rationale: Cette expression relie l’épisode à ce qui précède et introduit une autre circonstance dans laquelle Ézéchias fut mis à l’épreuve.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: dans l’affaire des émissaires des chefs de Babylone
  rationale: מְלִיצִים désigne ici des intermédiaires ou représentants diplomatiques. « Émissaires » est naturel en français actuel, tandis que la préposition בְּ introduit la circonstance concernée.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: que ceux-ci avaient envoyés auprès de lui
  rationale: 'Le participe hébreu est morphologiquement actif et renvoie le plus naturellement aux chefs de Babylone : ils avaient envoyé leurs émissaires auprès d’Ézéchias. La restructuration française explicite seulement l’objet déjà fourni par le contexte.'
- source_word: לִדְרֹשׁ
  choice: pour s’informer de
  rationale: Le verbe signifie ici chercher à obtenir des renseignements ou enquêter au sujet d’un événement, dans un contexte diplomatique.
- source_word: הַמּוֹפֵת
  choice: le signe
  rationale: מוֹפֵת peut désigner un signe, un prodige ou un présage. « Signe » conserve sa portée large sans préciser d’avance la nature exacte du phénomène.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: qui s’était produit dans le pays
  rationale: Le verbe היה décrit ici la survenue d’un événement remarquable. Le plus-que-parfait situe naturellement cet événement avant l’enquête babylonienne.
- source_word: עֲזָבוֹ
  choice: Dieu le laissa
  rationale: Le verbe עזב signifie laisser, délaisser ou abandonner. « Le laissa » reste proche du texte sans accentuer indûment l’idée d’un abandon définitif.
- source_word: לְנַסּוֹתוֹ
  choice: afin de le mettre à l’épreuve
  rationale: נסה exprime l’action d’éprouver ou de tester. Cette formulation est claire et dignifiée en français moderne.
- source_word: לָדַעַת
  choice: et de connaître
  rationale: Le sens direct de l’infinitif est « connaître » ou « savoir ». Ce choix maintient délibérément la tension du langage narratif.
- source_word: כָּל בִּלְבָבוֹ
  choice: tout ce qui était dans son cœur
  rationale: Le cœur représente ici l’intériorité d’Ézéchias, notamment ses pensées, ses dispositions et ses motivations. L’expression française conserve l’image hébraïque.
theological_decisions:
- issue: L’épreuve divine et la connaissance de Dieu
  choice: Dieu le laissa, afin de le mettre à l’épreuve et de connaître tout ce qui était dans son cœur
  alternative: Dieu le laissa afin de révéler ou de mettre au jour tout ce qui était dans son cœur
  rationale: Le texte hébreu emploie directement le verbe « connaître ». La traduction conserve cette formulation et la tension qu’elle suscite, sans la reformuler pour résoudre la question de la connaissance divine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe diplomatique a été légèrement restructurée pour rendre clair que les chefs de Babylone avaient envoyé les émissaires, tout en respectant la forme active de l’hébreu. Les expressions « mettre à l’épreuve » et « dans son cœur » conservent le langage biblique sans archaïsme.
