revisions:
- from: Ézéchias eut une très grande richesse et beaucoup d’honneur. Il se fit des réserves[a] pour l’argent, l’or, les pierres précieuses, les aromates, les boucliers et toutes sortes d’objets de valeur[b].
  to: Ézéchias eut une très grande richesse et un très grand honneur, et il se fit construire des entrepôts pour l’argent, l’or, les pierres précieuses, les aromates, les boucliers et tous les objets précieux[b].[a]
  rationale: La correction remplace « réserves », qui vise les contenus stockés, par « entrepôts », qui désigne les lieux de stockage exigés par le contexte. Elle rend aussi l’intensité de la richesse et de l’honneur de manière symétrique et resserre la dernière expression sur la portée inclusive du texte hébreu. L’ancre [a] est placée après « entrepôts », mot auquel elle se rapporte; l’ancre [b] reste après l’expression finale correspondante.
