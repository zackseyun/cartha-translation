  source_fidelity: La liste des biens et les termes principaux sont globalement fidèles. Toutefois, « réserves » désigne normalement les biens accumulés plutôt que les lieux de stockage (אֹצָרוֹת). « Entrepôts » rend mieux les installations ou dépôts destinés à conserver les objets énumérés. L’intensif hébreu porte sur la richesse et l’honneur; « une très grande richesse et un très grand honneur » le reflète plus explicitement.
  naturalness: Le français est clair et de registre biblique moderne. « Il se fit des réserves » est toutefois sémantiquement moins naturel dans le sens requis. « Il se fit construire des entrepôts » est idiomatique et exprime de façon naturelle l’établissement de lieux de stockage.
  terminology: « Ézéchias », « richesse », « honneur », « aromates » et « boucliers » conviennent. « Tous les objets précieux » conserve la portée générale de כְּלֵי חֶמְדָּה sans la restreindre à des ustensiles ou à des récipients. Les notes sont conservées avec une formulation française plus précise.
