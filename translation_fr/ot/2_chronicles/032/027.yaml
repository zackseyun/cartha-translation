base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: fr
  text: Ézéchias eut une très grande richesse et un très grand honneur, et il se fit construire des entrepôts pour l’argent, l’or, les pierres précieuses, les aromates, les boucliers et tous les objets précieux[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des trésoreries ». Le terme hébreu peut désigner des lieux de stockage en général ou, plus précisément, des chambres du trésor royal.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tout objet désirable »; autre traduction possible : « toutes sortes d’ustensiles précieux ». L’expression hébraïque est large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: Ézéchias eut
  rationale: La tournure hébraïque de possession se rend naturellement par « eut »; le passé simple convient à la narration historique et évite un calque.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: une très grande richesse et beaucoup d’honneur
  rationale: « Richesse » exprime la prospérité matérielle; « honneur » rend le statut et le prestige royaux. La formulation française répartit naturellement l’intensification hébraïque sans atténuer son emphase.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: Il se fit des réserves
  rationale: « Réserves » conserve l’idée générale de lieux ou dépôts destinés aux biens énumérés; « se fit » rend עשה לו sans préciser indûment qu’il les bâtit personnellement.
- source_word: לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה
  choice: pour l’argent, l’or, les pierres précieuses
  rationale: La préposition initiale porte naturellement sur toute l’énumération en français. Le singulier collectif hébreu « pierre précieuse » est rendu par le pluriel idiomatique.
- source_word: וְלִבְשָׂמִים
  choice: les aromates
  rationale: « Aromates » couvre les substances odoriférantes sans les limiter aux parfums ni aux épices culinaires.
- source_word: וּלְמָגִנִּים
  choice: les boucliers
  rationale: Le terme hébreu désigne précisément des boucliers.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: toutes sortes d’objets de valeur
  rationale: « Objets » préserve l’étendue de כְּלֵי, tandis que « de valeur » rend ici la qualité précieuse ou désirable de חֶמְדָּה; « toutes sortes » donne un français naturel pour l’ensemble inclusif.
