  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: fr
  text: Alors le roi Ézéchias et le prophète Ésaïe, fils d’Amots, prièrent à ce sujet et crièrent vers le ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers les cieux ». Le nom hébreu est de forme plurielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: prièrent
  rationale: Le hitpael de פלל signifie couramment « prier ». Bien que le premier verbe hébreu soit au singulier devant un sujet composé, le verbe suivant est au pluriel ; le français emploie naturellement le pluriel pour les deux hommes.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: le roi Ézéchias
  rationale: La forme française traditionnelle « Ézéchias » est retenue, avec son titre explicite dans le texte source.
- source_word: וִישַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: le prophète Ésaïe, fils d’Amots
  rationale: Les formes françaises usuelles des noms sont employées. Le titre et la filiation sont intégralement conservés, dans un ordre naturel en français.
- source_word: עַל זֹאת
  choice: à ce sujet
  rationale: La préposition על avec le démonstratif désigne ici l’affaire qui fait l’objet ou motive la prière. « À ce sujet » préserve ce rapport sans trancher plus fortement en faveur d’un sens causal.
- source_word: וַיִּזְעֲקוּ
  choice: crièrent
  rationale: זעק exprime un appel pressant, souvent lancé dans la détresse. « Crièrent » en conserve l’intensité.
- source_word: הַשָּׁמָיִם
  choice: vers le ciel
  rationale: Après « crièrent », « vers » rend naturellement la direction de l’appel. Le singulier collectif « le ciel » est idiomatique en français, tandis que la forme plurielle de l’hébreu est signalée en note.
theological_decisions:
- issue: Sens de הַשָּׁמָיִם dans le contexte de la prière
  choice: vers le ciel
  alternative: vers les cieux
  rationale: L’expression indique la direction céleste de l’appel sans formuler une doctrine cosmologique particulière. Le français courant préfère ici « le ciel », tout en permettant de signaler le pluriel morphologique hébreu.
- issue: Rapport exprimé par עַל זֹאת
  choice: à ce sujet
  alternative: à cause de cela
  rationale: L’hébreu peut présenter la situation comme objet ou motif de la prière. « À ce sujet » conserve cette légère ouverture sémantique et évite de rendre exclusivement causal ce qui ne l’est pas nécessairement.
translation_notes:
  register: Français international moderne, digne et direct. Les titres sont placés avant les noms selon l’usage naturel, et la structure coordonnée de l’hébreu est conservée sans lourdeur.
