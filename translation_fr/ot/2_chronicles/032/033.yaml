  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: fr
  text: Ézéchias se coucha avec ses pères, et on l’enterra dans la partie haute des tombeaux des fils de David[a]. À sa mort, tout Juda et les habitants de Jérusalem lui rendirent hommage. Son fils Manassé régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des descendants de David » : l’expression « fils de David » désigne ici la lignée royale issue de David.'
    reason: Précision du sens dynastique de l’expression hébraïque.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: se coucha avec ses pères
  rationale: Cette formule funéraire royale est conservée plutôt que réduite à « mourut ». En français biblique, elle reste intelligible et préserve l’image ainsi que la continuité littéraire de l’hébreu.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: Le verbe hébreu est actif au pluriel avec un sujet non exprimé. Le pronom indéfini « on » le rend naturellement en français sans transformer la proposition en passif.
- source_word: בְּמַעֲלֵה
  choice: dans la partie haute de
  rationale: מַעֲלֵה peut désigner une hauteur ou une montée. Dans ce contexte funéraire, « la partie haute » exprime prudemment le sens topographique probable sans imposer une reconstruction architecturale précise.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: les tombeaux des fils de David
  rationale: La formulation littérale conserve l’expression dynastique de l’hébreu. Une note précise que « fils » désigne ici plus largement les descendants appartenant à la lignée royale de David.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: lui rendirent hommage
  rationale: Cette expression française naturelle restitue l’idiome hébreu « faire honneur à quelqu’un » et convient au caractère public de l’hommage funèbre.
- source_word: בְּמוֹתוֹ
  choice: À sa mort
  rationale: Formulation concise et naturelle qui conserve la valeur temporelle de l’expression hébraïque.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: tout Juda et les habitants de Jérusalem
  rationale: Cette traduction garde l’ampleur collective et publique de l’hébreu dans un français courant et digne.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: régna à sa place
  rationale: Formule française concise qui correspond à l’expression hébraïque habituelle de succession dynastique.
theological_decisions:
- issue: Euphémisme de la mort dans la formule royale
  choice: Conserver « se coucha avec ses pères ».
  alternative: « mourut » ou « s’endormit avec ses ancêtres »
  rationale: La formule évoque la mort sans l’énoncer directement et relie Ézéchias à ses prédécesseurs. La conserver respecte la tension et la couleur littéraire du texte sans lui attribuer une précision doctrinale supplémentaire.
- issue: Portée de l’expression « fils de David »
  choice: Garder « fils de David » dans le texte et expliquer son sens dynastique en note.
  alternative: Traduire directement par « descendants de David » ou « rois de la lignée de David ».
  rationale: Le rendu littéral préserve l’expression hébraïque, tandis que la note évite qu’elle soit comprise comme une référence aux seuls enfants immédiats de David.
translation_notes:
  register: Français international moderne, digne et fluide. La formule funéraire « se coucha avec ses pères » est volontairement plus biblique que la langue quotidienne afin de préserver l’idiome hébreu; le reste de la phrase emploie des tournures actuelles. Le marqueur de note est placé après « fils de David », expression qu’il explique.
