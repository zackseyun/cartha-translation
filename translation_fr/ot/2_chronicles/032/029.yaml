source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: fr
  text: Il se construisit aussi des villes et eut du petit et du gros bétail en abondance, car Dieu lui avait donné de très grandes richesses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de très grands biens » ou « de très grandes possessions ».
    reason: Alternative lexicale pour רְכוּשׁ, qui peut désigner les biens matériels ou les possessions plutôt que la richesse au sens abstrait.
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Il se construisit aussi des villes
  rationale: 'Le waw a une valeur additive dans le contexte. עָשָׂה signifie littéralement « faire », mais avec des villes comme complément, « construire » est l’expression naturelle en français. Le pronom réfléchi rend לֹו dans son sens bénéficiaire : ces villes étaient destinées à Ézéchias.'
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: et eut du petit et du gros bétail
  rationale: מִקְנֶה désigne le bétail possédé, tandis que צֹאן et בָּקָר distinguent respectivement les ovins-caprins et les bovins. « Petit et gros bétail » restitue cette distinction de façon concise et idiomatique.
- source_word: לָרֹב
  choice: en abondance
  rationale: L’expression indique une quantité considérable et se rattache naturellement au bétail mentionné.
- source_word: כִּי נָתַן לוֹ אֱלֹהִים
  choice: car Dieu lui avait donné
  rationale: כִּי introduit la cause de cette prospérité. Le plus-que-parfait français exprime naturellement le don divin antérieur qui explique la situation décrite.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: de très grandes richesses
  rationale: רְכוּשׁ désigne l’ensemble des biens matériels ou possessions. « Richesses » convient au contexte de prospérité, et « très grandes » conserve l’intensification de רַב מְאֹד.
theological_decisions:
- issue: Origine de la prospérité d’Ézéchias
  choice: Le texte attribue explicitement ses très grandes richesses au don de Dieu.
  alternative: Présenter cette prospérité comme le seul résultat de l’activité ou de la sagesse d’Ézéchias.
  rationale: La proposition כִּי נָתַן לוֹ אֱלֹהִים affirme directement l’action divine. La traduction conserve cette attribution sans en tirer une doctrine générale de la prospérité.
translation_notes:
  register: Français international moderne, clair et digne. « Petit et gros bétail » est une formulation courante qui préserve les deux catégories animales du texte hébreu. Le marqueur de note est placé après « richesses », le mot auquel l’alternative lexicale se rapporte.
