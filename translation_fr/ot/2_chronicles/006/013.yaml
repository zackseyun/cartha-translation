  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: fr
  text: Car Salomon avait fait une estrade de bronze[a] et l’avait placée au milieu de la cour. Elle mesurait cinq coudées de long, cinq coudées de large et trois coudées de haut. Il se tint dessus, puis se mit à genoux devant toute l’assemblée d’Israël et étendit ses mains vers le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « estrade » désigne habituellement un bassin ou une cuve. Ici, les dimensions de l’objet et le fait que Salomon se tienne dessus indiquent une structure surélevée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici une explication concernant la position et l’emplacement de Salomon; « Car » conserve naturellement cette valeur explicative.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: une estrade de bronze
  rationale: כִּיּוֹר désigne habituellement un bassin ou une cuve, mais les dimensions données et le fait que Salomon se tienne dessus indiquent ici une structure surélevée. « Estrade » exprime clairement cette fonction tout en signalant l’anomalie lexicale dans une note.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: au milieu de la cour
  rationale: עֲזָרָה désigne la cour du temple et בְּתוֹךְ en précise la position intérieure ou centrale; cette formulation est claire et idiomatique.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: cinq coudées de long, cinq coudées de large et trois coudées de haut
  rationale: Conserve l’unité ancienne « coudée » tout en présentant les dimensions dans un français naturel.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Il se tint dessus
  rationale: Rend directement la posture de Salomon sur l’estrade sans ajouter une action absente du texte.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: puis se mit à genoux
  rationale: Dans ce contexte, ברך signifie s’agenouiller, non bénir. La formulation française rend naturellement le changement de posture; « puis » explicite la succession narrative.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: devant toute l’assemblée d’Israël
  rationale: « Assemblée » convient au rassemblement public d’Israël, et « devant » rend naturellement נֶגֶד.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: et étendit les mains
  rationale: Décrit avec naturel le geste de prière exprimé littéralement par le déploiement des paumes.
- source_word: הַשָּׁמָיְמָה
  choice: vers le ciel
  rationale: La terminaison directionnelle indique une orientation vers le ciel; « vers » en conserve précisément la nuance.
theological_decisions:
- issue: Sens de כִּיּוֹר dans ce contexte
  choice: estrade
  alternative: bassin, cuve ou support de bronze
  rationale: Le sens lexical ordinaire est « bassin » ou « cuve », mais le contexte présente une structure sur laquelle Salomon peut se tenir et dont les dimensions sont celles d’une plateforme. « Estrade » rend la scène intelligible sans cacher le sens inhabituel, lequel est conservé en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide; l’unité ancienne « coudée » est conservée et la difficulté lexicale de כִּיּוֹר est explicitée en note.
