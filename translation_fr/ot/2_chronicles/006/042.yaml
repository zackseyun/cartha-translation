base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: fr
  text: Ô Yahweh Dieu, ne repousse pas ton oint[a] ; souviens-toi des bontés fidèles que tu as accordées à David, ton serviteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne détourne pas le visage de ton oint ». « Ton oint » peut aussi se traduire, selon la nuance retenue, par « ton Messie » ou, dans ce contexte, par « ton roi ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se traduire : « souviens-toi des bontés accordées à David, ton serviteur » ou « souviens-toi de ta fidélité à l’alliance envers David, ton serviteur ». La formulation hébraïque condensée peut aussi être comprise comme une référence aux actes de fidélité de David.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le nom divin יהוה est translittéré « Yahweh », tandis que אֱלֹהִים, employé comme titre dans cette apostrophe, est rendu naturellement par « Dieu ».
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: ne repousse pas
  rationale: L’expression hébraïque signifie littéralement « ne détourne pas le visage de ». En français courant, « ne repousse pas » en exprime clairement le sens contextuel, tandis qu’une note conserve l’image originale.
- source_word: מְשִׁיחֶךָ
  choice: ton oint
  rationale: « Oint » conserve le sens royal du terme hébreu et sa possible résonance messianique sans identifier explicitement ici le personnage au Messie ni remplacer le terme par l’interprétation contextuelle « roi ».
- source_word: זָכְרָה
  choice: souviens-toi
  rationale: L’impératif hébreu est rendu par la formule française naturelle de la prière d’alliance.
- source_word: לְחַסְדֵי דָּוִיד
  choice: de l’amour fidèle que tu as témoigné à David
  rationale: Le pluriel חַסְדֵי évoque les manifestations de l’amour loyal et fidèle de Dieu. La formulation explicite David comme bénéficiaire, lecture la plus naturelle dans le contexte, sans masquer complètement l’ambiguïté de la construction.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Rendu par l’équivalent français habituel du statut de David devant Dieu.
theological_decisions:
- issue: Portée royale et messianique de מְשִׁיחֶךָ
  choice: ton oint
  alternative: ton Messie ; ton roi
  rationale: Dans le contexte immédiat, il s’agit du roi davidique consacré. « Ton oint » préserve à la fois ce sens historique et l’éventuelle portée messianique canonique, sans imposer une identification plus précise que l’hébreu.
- issue: Sujet implicite de חַסְדֵי דָּוִיד
  choice: l’amour fidèle que tu as témoigné à David
  alternative: les bontés de David ; les actes de fidélité de David
  rationale: La demande adressée à Dieu et le contexte de l’alliance davidique favorisent l’idée des bontés fidèles de Dieu envers David. Une note signale toutefois la formulation condensée de l’hébreu et les autres traductions possibles.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « Ô Yahweh Dieu » maintient le registre solennel de la prière. La traduction privilégie une expression idiomatique dans le texte principal, tout en conservant dans les notes l’image hébraïque et les ambiguïtés lexicales réelles.
