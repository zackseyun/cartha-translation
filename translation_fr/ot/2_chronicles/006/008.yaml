base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: fr
  text: 'Mais Yahweh dit à David, mon père : « Puisque tu as eu à cœur de bâtir une maison pour mon nom[a], tu as bien fait d’avoir cela à cœur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de bâtir un temple pour mon nom ». L’hébreu dit littéralement « de bâtir une maison pour mon nom ».
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « tu as bien fait, car cela était dans ton cœur ».'
    reason: formal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Rendu narratif naturel du verbe אמר en français.
- source_word: אָבִי
  choice: David, mon père
  rationale: Conserve la référence filiale explicite dans le discours de Salomon.
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Introduit naturellement la proposition causale tout en reliant l’intention à l’approbation divine.
- source_word: הָיָה עִם לְבָבְךָ
  choice: tu as eu à cœur
  rationale: Expression française courante qui conserve la métaphore du cœur et exprime l’intention résolue.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: bâtir une maison pour mon nom
  rationale: Préserve le sens littéral de בַּיִת et l’expression théologiquement significative « pour mon nom ».
- source_word: הֱטִיבוֹתָ
  choice: tu as bien fait
  rationale: Exprime directement l’approbation indiquée par le hifil de יטב.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: d’avoir cela à cœur
  rationale: Restitue la répétition de l’intention intérieure dans un français fluide; « cela » reprend le projet de bâtir.
theological_decisions:
- issue: Expression du temple בַּיִת לִשְׁמִי
  choice: une maison pour mon nom
  alternative: un temple pour mon nom
  rationale: « Maison » suit le lexème hébreu et maintient la portée de la théologie du nom sans suggérer que Dieu serait contenu dans l’édifice.
- issue: Répétition de הָיָה עִם לְבָבְךָ
  choice: tu as eu à cœur… d’avoir cela à cœur
  alternative: cela était dans ton cœur… que cela ait été dans ton cœur
  rationale: La formulation choisie garde la répétition et l’accent mis sur l’intention de David, tout en évitant un calque peu naturel en français.
translation_notes:
  register: Français international moderne, digne et accessible. « Avoir à cœur » conserve l’image biblique du cœur tout en étant idiomatique; « bâtir » convient au registre d’un édifice cultuel.
