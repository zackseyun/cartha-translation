base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: fr
  text: Quand les cieux sont fermés et qu’il n’y a pas de pluie parce qu’ils ont péché contre toi, et qu’ils prient en direction de ce lieu, célèbrent ton nom et se détournent de leur péché parce que tu leur réponds[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que tu les affliges » ou « parce que tu les humilies ». Le verbe hébreu a aussi été compris dans ces sens selon l’analyse retenue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: Quand les cieux sont fermés
  rationale: L’infinitif construit au niphal précédé de בְּ introduit une proposition temporelle. « Les cieux sont fermés » conserve l’image concrète de la pluie retenue et le pluriel hébreu.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: et qu’il n’y a pas de pluie
  rationale: Cette formulation française naturelle rend simplement la construction existentielle hébraïque.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: parce qu’ils ont péché contre toi
  rationale: כִּי est causal ici, et לָךְ désigne Dieu comme celui contre qui le péché est commis.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: s’ils prient en direction de ce lieu
  rationale: Dans le contexte de la prière de consécration du temple, אֶל indique l’orientation de la prière, non son destinataire. « S’ils » exprime naturellement en français la condition introduite par « quand » dans cette longue protase.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: reconnaissent ton nom
  rationale: Le hiphil de ידה peut exprimer la reconnaissance, la confession, la louange ou l’action de grâce. Dans cette suite liée au retour du péché, « reconnaissent ton nom » garde une portée assez large sans imposer exclusivement l’idée de remerciement.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: se détournent de leur péché
  rationale: שׁוב suivi de מִן décrit un mouvement d’éloignement. Cette traduction préserve l’image hébraïque plutôt que de la remplacer par le terme plus interprétatif « se repentent ».
- source_word: כִּי תַעֲנֵם
  choice: parce que tu leur réponds
  rationale: La vocalisation massorétique et le contexte de prière favorisent le sens « répondre ». L’autre analyse traditionnelle, « affliger » ou « humilier », est signalée en note.
theological_decisions:
- issue: Sens de ענה dans la proposition finale
  choice: parce que tu leur réponds
  alternative: parce que tu les affliges ; parce que tu les humilies
  rationale: La vocalisation du WLC et l’enchaînement prière-réponse soutiennent « répondre ». Comme la forme consonantique et l’usage du lexème ont aussi donné lieu à une lecture liée à l’affliction ou à l’humiliation qui conduit au retour, cette tension est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste ouverte par une virgule, car le verset constitue la protase dont la demande principale se poursuit au verset 27.
