review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle, l’orientation de la prière (« en direction de ce lieu »), le retour « de leur péché » et la lecture massorétique « tu leur réponds » rendent fidèlement l’hébreu. La note conserve à juste titre l’autre interprétation lexicale de la clause finale. En revanche, le subjonctif conditionnel introduit par « s’ils » n’est pas exprimé distinctement dans la succession verbale hébraïque et alourdit inutilement la protase.
  naturalness: La phrase est claire, mais « Quand …, s’ils prient » superpose deux cadres conditionnels. Une coordination sous « quand » est plus naturelle et plus proche du mouvement de la phrase source. « Reconnaissent ton nom » demeure possible, mais « célèbrent ton nom » est plus idiomatique en français biblique moderne pour ידה + « nom », sans réduire le verbe à l’action de grâce.
  terminology: « Les cieux », « péché contre toi », « ce lieu », « se détournent » et « réponds » conviennent au registre et aux termes du passage. « Célèbrent ton nom » rend la reconnaissance publique et laudative impliquée par le hiphil de ידה; il évite aussi de faire de « reconnaître ton nom » une simple admission intellectuelle.
  issues:
  - severity: low
    issue: « s’ils prient » ajoute une subordination conditionnelle distincte après « Quand ».
    rationale: Les verbes hébreux sont coordonnés dans la même protase temporelle-conditionnelle. En français, « et qu’ils prient, célèbrent … et se détournent … » préserve plus directement cette relation et améliore la fluidité.
  - severity: low
    issue: « reconnaissent ton nom » est moins idiomatique et un peu trop faible pour הוֹדוּ אֶת־שְׁמֶךָ.
    rationale: Dans cette construction, le verbe exprime couramment la louange, la célébration ou l’aveu reconnaissant du nom divin. « Célèbrent ton nom » est naturel, garde une portée cultuelle large et ne tranche pas indûment entre confession et action de grâce.
