revisions:
- from: Quand les cieux sont fermés et qu’il n’y a pas de pluie parce qu’ils ont péché contre toi, s’ils prient en direction de ce lieu, reconnaissent ton nom et se détournent de leur péché parce que tu leur réponds[a],
  to: Quand les cieux sont fermés et qu’il n’y a pas de pluie parce qu’ils ont péché contre toi, et qu’ils prient en direction de ce lieu, célèbrent ton nom et se détournent de leur péché parce que tu leur réponds[a],
  rationale: Révision limitée de la syntaxe de la protase et du rendu de הוֹדוּ אֶת־שְׁמֶךָ. La phrase demeure volontairement ouverte, puisque la demande principale se poursuit au verset 27. La lecture « tu leur réponds » et sa note d’alternative sont maintenues.
