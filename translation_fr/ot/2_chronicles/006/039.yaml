base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: fr
  text: Alors, du ciel, du lieu où tu demeures, écoute leur prière et leurs supplications, rends-leur justice[a] et pardonne à ton peuple qui a péché contre toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « défends leur cause » ou « prends en charge leur cause ». L’hébreu dit littéralement : « fais leur jugement/leur cause ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: alors… écoute
  rationale: Dans cette prière, le parfait qal à la 2e personne du masculin singulier exprime une demande adressée à Dieu. « Alors » marque naturellement la suite de la situation conditionnelle exposée auparavant.
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתְּךָ
  choice: du ciel, du lieu où tu demeures
  rationale: « Ciel » est l’équivalent français naturel du pluriel hébreu dans cette formule. La seconde expression précise le lieu établi de la demeure divine sans recourir à une tournure archaïque.
- source_word: תְּפִלָּתָם וְאֶת תְּחִנֹּתֵיהֶם
  choice: leur prière et leurs supplications
  rationale: Le singulier collectif de תְּפִלָּה est conservé. « Supplications » distingue les appels insistants à la faveur divine de la prière au sens général, dans un registre digne et courant.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: défends leur cause
  rationale: L’expression signifie littéralement « fais leur jugement/leur cause » et possède une portée judiciaire. « Défends leur cause » exprime une intervention juste en leur faveur tout en restant naturelle en français; la note conserve les autres possibilités.
- source_word: וְסָלַחְתָּ לְעַמְּךָ
  choice: et pardonne à ton peuple
  rationale: « Pardonner à » est la construction française idiomatique correspondant au verbe סלח et à son complément introduit par לְ.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: qui a péché contre toi
  rationale: Le relatif a pour antécédent le collectif singulier « ton peuple »; l’accord au singulier est donc naturel en français. La préposition לְ après חטא indique ici que l’offense est dirigée contre Dieu.
theological_decisions:
- issue: Portée judiciaire de מִשְׁפָּטָם
  choice: défends leur cause
  alternative: accorde-leur justice; rends justice en leur faveur; prends en charge leur cause
  rationale: Le texte associe l’écoute, l’action judiciaire et le pardon. La traduction garde la dimension légale et l’idée d’une intervention en faveur du peuple, sans effacer l’ambiguïté de l’idiome ni suggérer que Dieu approuve leur péché.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre « du ciel… écoute » préserve l’accent locatif hébreu sans produire une phrase artificielle. Le marqueur [a] est placé immédiatement après l’expression judiciaire concernée.
