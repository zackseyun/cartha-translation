  text: לִ/הְיוֹת֩ עֵינֶ֨י/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ לָ/שׂ֥וּם שִׁמְ/ךָ֖ שָׁ֑ם לִ/שְׁמ֨וֹעַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: fr
  text: Que tes yeux soient ouverts sur cette maison jour et nuit[a], sur le lieu où tu as dit que tu mettrais ton nom[b], afin que tu entendes la prière que ton serviteur fera en direction de ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient attentifs à cette maison ». L’hébreu dit littéralement « que tes yeux soient ouverts », image exprimant une attention vigilante.
    reason: lexical_alternative
  - marker: b
    text: '« Mettre ton nom » est une expression liée au temple : elle indique que Dieu a choisi d’associer son nom à ce lieu, sans signifier qu’il y serait matériellement enfermé.'
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: Que tes yeux soient ouverts
  rationale: La tournure française rend la valeur de souhait ou de requête de l’infinitif dans cette prière, tout en conservant littéralement l’image anthropomorphique hébraïque.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: sur cette maison
  rationale: Avec « les yeux ouverts », le français emploie naturellement « sur » pour indiquer l’objet de l’attention, sans perdre l’orientation exprimée par אֶל.
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Cette expression naturelle conserve le mérisme hébraïque qui évoque une attention continuelle.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: où tu as dit que tu mettrais ton nom
  rationale: La formulation garde l’idiome cultuel et théologique du texte sans le remplacer par une interprétation de la présence divine.
- source_word: לִשְׁמֹעַ
  choice: afin d’entendre
  rationale: « Afin de » explicite naturellement en français la relation de but portée par l’infinitif.
- source_word: הַתְּפִלָּה אֲשֶׁר יִתְפַּלֵּל
  choice: la prière que … adresse
  rationale: Le verbe « adresser » évite la répétition peu élégante « la prière que … prie » et exprime naturellement l’acte de prier, sans ajouter d’objet absent du texte.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans l’adresse priante à Dieu, « serviteur » rend le terme de soumission et de service avec le registre contextuel approprié.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en se tournant vers ce lieu
  rationale: Dans ce contexte de prière orientée vers le sanctuaire, cette formulation française rend clairement la direction exprimée par אֶל sans suggérer que la prière est adressée au bâtiment.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « tes yeux soient ouverts »
  alternative: Paraphraser par « sois attentif » ou « veille sur »
  rationale: L’image concrète appartient à la rhétorique du texte et exprime l’attention vigilante de Dieu sans qu’il soit nécessaire de la résoudre dans le corps du verset.
- issue: Théologie du temple dans « mettre ton nom »
  choice: Maintenir l’idiome « mettre ton nom »
  alternative: Expliciter par « faire demeurer ta présence » ou « manifester ta présence »
  rationale: L’hébreu associe Dieu au lieu choisi au moyen de son « nom » sans affirmer qu’il y serait contenu. Une paraphrase imposerait une interprétation plus précise que le texte.
- issue: Orientation de la prière vers le temple
  choice: Traduire « en se tournant vers ce lieu »
  alternative: Traduire littéralement « vers ce lieu » après « adresse »
  rationale: Cette formulation distingue l’orientation physique ou cultuelle de la prière de son destinataire divin et évite de faire du lieu l’objet auquel la prière serait adressée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. Les deux idiomes théologiquement marqués de l’hébreu sont conservés dans le texte, tandis que les notes en éclairent le sens sans supprimer leur tension.
