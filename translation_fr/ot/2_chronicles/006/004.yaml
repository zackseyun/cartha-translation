source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: fr
  text: 'Il dit : « Béni soit Yahweh, le Dieu d’Israël, lui qui a parlé par sa bouche à David, mon père, et qui, par sa main, a accompli ce qu’il avait dit[a], en disant : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui a parlé par sa bouche à David, mon père, et qui, par sa main, a accompli ». Le complément de « a accompli » est implicite en hébreu. Le texte maintient un parallélisme intentionnel entre la parole de Dieu et son action.'
    reason: Le complément de « a accompli » est implicite en hébreu, tandis que les expressions « par sa bouche » et « par sa main » font ressortir le parallélisme entre la parole de Dieu et son action.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit le récit et introduit le discours de Salomon. Le français n’a pas besoin d’ajouter systématiquement « et ».
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule de bénédiction adressée à Dieu conserve le caractère solennel de l’exclamation hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la chaîne construite qui désigne Yahweh dans sa relation avec Israël.
- source_word: דִּבֶּר בְּפִיו
  choice: a parlé de sa bouche
  rationale: La mention explicite de la bouche est conservée malgré son caractère inhabituel en français, afin de maintenir le parallélisme intentionnel avec la main.
- source_word: אֵת דָּוִיד אָבִי
  choice: à David, mon père
  rationale: Dans ce contexte, David est le destinataire de la parole divine; l’apposition est ponctuée conformément à l’usage français.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: et qui, de sa main, a accompli ce qu’il avait dit
  rationale: « De sa main » préserve le contraste anthropomorphique entre parole et action. Le complément implicite de מִלֵּא est explicité naturellement par « ce qu’il avait dit ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif quotatif annonce les paroles divines rapportées au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin personnel; « Yahweh » le conserve sans le remplacer par un titre.
- issue: Anthropomorphisme de la bouche et de la main de Dieu
  choice: Conserver les deux images
  alternative: qui a promis et accompli sa promesse
  rationale: Le parallélisme entre la bouche qui parle et la main qui accomplit exprime délibérément le rapport entre la parole de Dieu et son action; il ne doit pas être effacé.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure inhabituelle « de sa bouche » est volontairement maintenue pour préserver l’image et le parallélisme hébraïques; « ce qu’il avait dit » explicite seulement le complément requis par le français.
