  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: fr
  text: Mais moi, je t’ai construit une demeure majestueuse, un lieu pour que tu y demeures à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית זְבֻל
  choice: une demeure majestueuse
  rationale: L’expression désigne une demeure élevée, noble ou prestigieuse. « Demeure majestueuse » conserve cette idée tout en restant naturelle en français.
- source_word: מָכוֹן
  choice: un lieu
  rationale: Le terme évoque un emplacement établi ou préparé. Dans ce parallélisme, « un lieu » rend clairement le sens sans alourdir la phrase.
- source_word: לְשִׁבְתְּךָ
  choice: où tu résideras
  rationale: L’infinitif construit exprime ici la résidence ou l’habitation de Dieu; « résider » convient au registre solennel du temple.
- source_word: עוֹלָמִים
  choice: pour toujours
  rationale: Le pluriel intensif exprime une durée indéfinie ou perpétuelle; la formule française usuelle est « pour toujours ».
theological_decisions:
- issue: La demeure permanente de Dieu dans le temple
  choice: où tu résideras pour toujours
  alternative: pour que tu y habites à jamais
  rationale: La traduction conserve sans l’atténuer l’affirmation théologique directe de Salomon selon laquelle Dieu résidera dans ce lieu pour toujours, tout en laissant le contexte élargir ou nuancer cette affirmation.
translation_notes:
  register: Français international moderne, digne et accessible. Le redoublement emphatique וַאֲנִי est rendu naturellement par « Mais moi, je », et le parallélisme hébreu est préservé.
