  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: fr
  text: 'Alors Salomon dit : « Yahweh a dit qu’il habiterait dans l’obscurité profonde[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nuée sombre ». Le terme hébreu peut désigner une nuée dense, une profonde obscurité ou des ténèbres, notamment lors d’une manifestation divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la progression du récit et introduit naturellement la déclaration de Salomon.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: Salomon dit
  rationale: Rend directement la formule narrative hébraïque sans ajouter de nuance interprétative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אָמַר
  choice: a dit
  rationale: Le passé composé convient au français moderne et présente cette parole antérieure de Yahweh comme pertinente dans la situation présente.
- source_word: לִשְׁכּוֹן
  choice: qu’il habiterait
  rationale: Exprime naturellement en discours indirect le contenu de la parole divine, tout en conservant l’idée de demeure.
- source_word: בָּעֲרָפֶל
  choice: dans l’obscurité profonde
  rationale: Conserve l’idée d’opacité intense et la portée théophanique du terme sans le réduire à un phénomène météorologique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin; sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Nature de עֲרָפֶל dans la manifestation divine
  choice: l’obscurité profonde
  alternative: la nuée sombre
  rationale: Ce choix maintient la tension entre la présence proche de Dieu et son caractère caché, sans décider si le terme désigne avant tout une nuée matérielle ou une profonde obscurité.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en suivant de près la formulation hébraïque; le nom Yahweh et l’ambiguïté de l’image théophanique sont conservés.
