  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: fr
  text: Et maintenant, lève-toi, ô Yahweh Dieu, vers ton lieu de repos, toi et l’arche de ta puissance[a]. Que tes prêtres, ô Yahweh Dieu, soient revêtus du salut, et que ceux qui te sont fidèles[b] se réjouissent de ce qui est bon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arche de ta force » ou « l’arche de ta vigueur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tes fidèles », « ceux qui te sont attachés »; traditionnellement, « tes saints ».
    reason: lexical_alternative
  - marker: c
    text: Ou « se réjouissent de ta bonté ». L’hébreu dit simplement « du bien/de ce qui est bon », sans possessif explicite.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la valeur temporelle du marqueur qui introduit la demande culminante.
- source_word: קוּמָה
  choice: lève-toi
  rationale: Impératif naturel et digne en français, qui préserve le langage liturgique de la prière adressée à Dieu.
- source_word: יְהוָה אֱלֹהִים
  choice: ô Yahweh Dieu
  rationale: Rend directement le nom divin et le titre « Dieu »; « ô » marque clairement l’apostrophe sans transformer le nom en titre.
- source_word: לְנוּחֶךָ
  choice: pour rejoindre ton lieu de repos
  rationale: Le substantif peut désigner le repos ou le lieu où l’on demeure établi. Dans le contexte de l’arche et du Temple, « lieu de repos » exprime la destination; « rejoindre » donne en français naturel la valeur directionnelle de לְ.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: toi et l’arche de ta puissance
  rationale: Préserve l’association solennelle entre Dieu et l’arche. עֹז désigne la force, la puissance ou la majesté agissante; « puissance » est idiomatique ici sans identifier l’arche à Dieu lui-même.
- source_word: כֹּהֲנֶיךָ
  choice: tes prêtres
  rationale: Rendu direct du pluriel avec suffixe possessif.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: soient revêtus du salut
  rationale: Conserve la métaphore vestimentaire et la portée large de תְּשׁוּעָה, qui peut évoquer salut, délivrance ou victoire.
- source_word: חֲסִידֶיךָ
  choice: ceux qui te sont fidèles
  rationale: Exprime la loyauté et la piété relationnelles de חָסִיד dans un français actuel, sans les connotations ecclésiastiques que « saints » pourrait importer.
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: se réjouissent de ce qui est bon
  rationale: Rend naturellement l’expression littérale « dans le bon/bien » sans ajouter le possessif « ta », absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » le présente comme un nom propre et préserve sa fonction d’alliance, sans le remplacer par un titre.
- issue: Sens de בַטּוֹב
  choice: de ce qui est bon
  alternative: de ta bonté
  rationale: Le contexte permet de comprendre la bonté de Dieu, mais l’hébreu ne porte aucun suffixe possessif. Le texte principal conserve donc l’indétermination, tandis que la lecture explicitement centrée sur la bonté divine est signalée en note.
- issue: Portée de תְּשׁוּעָה
  choice: salut
  alternative: délivrance / victoire
  rationale: « Salut » maintient l’ampleur du terme sans décider si la demande vise surtout la délivrance concrète, la victoire ou une réalité salvatrice plus générale.
translation_notes:
  register: Français international moderne, digne et adapté à une lecture liturgique. La syntaxe parallèle et les métaphores du texte hébreu sont conservées, tout en évitant les tournures inutilement archaïques. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
