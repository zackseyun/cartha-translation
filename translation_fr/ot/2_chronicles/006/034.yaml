review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : départ en guerre, mission divine, prière orientée vers la ville choisie et la maison bâtie pour le nom de Dieu. Toutefois, « et si ses membres te prient » transforme inutilement la coordination hébraïque en une seconde condition et ajoute « ses membres », absent du texte. Le pluriel du verbe hébreu peut être rendu naturellement par « ils » avec « ton peuple » comme antécédent collectif.'
  naturalness: La formulation révisée est fluide en français international moderne et maintient la phrase suspendue, dont l'apodose se trouve au verset suivant. « Ils te prient » est plus naturel et moins explicatif que « ses membres te prient ».
  terminology: « Maison » préserve בית, tandis que la note identifie correctement le Temple. « Pour ton nom » rend directement la formule cultuelle לשמך. Le nom divin dans la note est convenablement rendu par « le SEIGNEUR ».
  issues:
  - severity: medium
    issue: Double condition et ajout de « ses membres »
    rationale: Le texte hébreu enchaîne « et ils prient » à la condition initiale ; il ne contient ni une seconde particule conditionnelle ni le substantif « membres ». Employer « et qu’ils te prient » conserve la dépendance syntaxique française sans ajouter de référent.
  - severity: low
    issue: Pronom singulier dans « tu l’enverras »
    rationale: Bien que « peuple » puisse être traité comme un collectif singulier, le texte hébreu emploie un suffixe pluriel pour ceux que Dieu envoie, et la suite française les reprend par « ils ». « Tu les enverras » assure une référence cohérente et plus proche de la forme source.
  revised_text: Si ton peuple part combattre ses ennemis par le chemin où tu les enverras et qu’ils te prient en direction de cette ville que tu as choisie[a] et de la maison que j’ai bâtie pour ton nom[b],
  revised_footnotes:
