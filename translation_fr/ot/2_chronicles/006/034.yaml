source:
  edition: WLC
  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: fr
  text: Si ton peuple part combattre ses ennemis par le chemin où tu les enverras et qu’ils te prient en direction de cette ville que tu as choisie[a] et de la maison que j’ai bâtie pour ton nom[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement un terme signifiant « chemin » ou « direction » : la prière est orientée vers Jérusalem.'
    reason: lexical_alternative
  - marker: b
    text: La « maison » désigne le Temple bâti par Salomon pour le nom du SEIGNEUR.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette série de cas envisagés par la prière de Salomon, כִּי introduit une situation éventuelle. « Si » rend clairement la proposition conditionnelle, dont la demande se poursuit au verset suivant.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: ton peuple part combattre
  rationale: Cette formulation française naturelle restitue l’expression militaire « sortir pour la guerre », sans ajouter de précision absente de l’hébreu.
- source_word: עַל אֹיְבָיו
  choice: ses ennemis
  rationale: Le suffixe singulier s’accorde avec le collectif עַם, « peuple ». Le français conserve naturellement cet accord collectif.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: par le chemin où tu l’enverras
  rationale: « Chemin » maintient l’image concrète de דֶּרֶךְ, tandis que « tu l’enverras » conserve l’idée que Dieu dirige ou mandate son peuple. Le singulier collectif est naturel en français.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: et si ses membres te prient
  rationale: Le verbe hébreu est au pluriel alors que « ton peuple » est un nom collectif. « Ses membres » permet de respecter ce pluriel sans créer un changement de référent maladroit en français.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: en direction de cette ville
  rationale: Après un verbe de prière, דֶּרֶךְ exprime ici l’orientation spatiale. Cette traduction explicite sobrement le sens sans ajouter le geste de tourner le visage.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: que tu as choisie
  rationale: Le passé composé exprime un choix accompli dont la portée demeure; le féminin s’accorde avec « ville ».
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי
  choice: et de la maison que j’ai bâtie
  rationale: « Maison » conserve le terme hébreu et sa portée théologique, tandis qu’une note précise qu’il s’agit du Temple.
- source_word: לִשְׁמֶךָ
  choice: pour ton nom
  rationale: Traduction directe de la formule de dédicace du sanctuaire, qui préserve le langage biblique du « nom » sans l’interpréter comme une simple réputation.
theological_decisions:
- issue: Orientation de la prière vers Jérusalem et le Temple
  choice: 'Conserver l’orientation spatiale concrète : « en direction de cette ville […] et de la maison »'
  alternative: 'Interpréter plus abstraitement : « en pensant à cette ville et à ce Temple »'
  rationale: Le texte situe réellement la prière en direction de la ville choisie et du sanctuaire. Cette donnée historique et théologique doit être conservée sans en tirer de conclusion doctrinale ultérieure.
- issue: La « maison » bâtie pour le nom de Dieu
  choice: Garder « maison » dans le texte et identifier le Temple en note
  alternative: Traduire directement par « Temple »
  rationale: « Maison » reflète le lexème hébreu et son image théologique; la note donne au lecteur le référent culturel nécessaire sans remplacer l’expression source.
- issue: Valeur conditionnelle de כִּי
  choice: « Si »
  alternative: « Quand » ou « Lorsque »
  rationale: La prière présente un cas éventuel avant la requête du verset suivant. « Si » fait ressortir cette structure sans nier que la situation puisse effectivement se produire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément à la syntaxe de la prière, dont la requête principale arrive au verset 35. Le collectif « ton peuple » est repris par « ses membres » afin de rendre naturellement le pluriel du verbe hébreu.
