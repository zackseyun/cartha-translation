source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: fr
  text: Yahweh a accompli la parole qu’il avait prononcée[a]. J’ai succédé à David, mon père, et je siège sur le trône d’Israël, comme Yahweh l’avait annoncé. J’ai construit la maison pour le nom de Yahweh[b], le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « a confirmé sa parole » ou « a mis sa parole à exécution ». Littéralement, le verbe hébreu signifie qu’il a « fait tenir » sa parole.'
    reason: lexical_alternative
  - marker: b
    text: La « maison » désigne ici le temple. L’hébreu conserve l’expression « maison pour le nom de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: a accompli
  rationale: Le hiphil de קום signifie ici faire tenir ou réaliser une parole. « Accomplir » exprime naturellement en français l’exécution effective de ce qui avait été annoncé, tandis que la note conserve l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: la parole qu’il avait prononcée
  rationale: « Parole » préserve le substantif דָּבָר; le plus-que-parfait situe clairement cette déclaration avant son accomplissement. « Prononcée » évite en français la répétition peu naturelle de « parole qu’il avait dite ».
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: J’ai succédé à David, mon père
  rationale: Dans ce contexte dynastique, תַּחַת indique que Salomon prend la place de David. « Succéder à » rend ce sens avec naturel, sans suggérer une opposition hostile.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: je siège sur le trône d’Israël
  rationale: Le présent français exprime l’état royal résultant de l’accession au trône et correspond bien au contexte du discours de dédicace.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait annoncé
  rationale: « Annoncé » rend ici le contenu promissoire de דִּבֶּר dans un français naturel; le pronom « l’ » renvoie à la succession et à l’intronisation qui viennent d’être mentionnées.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: J’ai construit la maison
  rationale: Le passé composé présente l’action achevée avec sa pertinence actuelle. « Maison » conserve l’expression hébraïque, tout en étant explicitée en note comme désignant le temple.
- source_word: לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  rationale: La formulation littérale préserve l’expression théologique selon laquelle la maison est destinée au nom de Yahweh, sans reformuler celle-ci comme si Dieu y était contenu.
theological_decisions:
- issue: Désignation de l’édifice
  choice: la maison
  alternative: le temple
  rationale: « Maison » correspond directement à הַבַּיִת et conserve l’expression biblique « maison pour le nom de Yahweh ». Une note précise le référent pour le lecteur moderne.
- issue: Expression לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  alternative: en l’honneur de Yahweh
  rationale: La traduction retenue conserve la notion du « nom », importante dans le contexte de la présence divine, sans résoudre ni paraphraser sa portée théologique.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le tétragramme; « Yahweh » en préserve le caractère de nom personnel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement segmentée pour éviter une longue coordination lourde. « Siéger sur le trône » maintient le registre royal; « maison » et « pour le nom » préservent les formulations théologiquement marquées du texte hébreu.
