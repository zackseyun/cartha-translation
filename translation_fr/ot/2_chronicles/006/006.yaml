source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: fr
  text: Mais j’ai choisi Jérusalem pour que mon nom y soit[a], et j’ai choisi David pour qu’il soit à la tête de mon peuple Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais j’ai choisi Jérusalem pour que mon nom soit là. »'
    reason: La tournure avec « y » est plus naturelle en français, tandis que « soit là » reproduit plus explicitement l’adverbe hébreu שָׁם.
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: j’ai choisi
  rationale: Le verbe בחר exprime le choix ou l’élection. Le passé composé est naturel en français et présente ici le choix établi de Dieu comme toujours pertinent dans le contexte.
- source_word: בִּירוּשָׁלִַם
  choice: Jérusalem
  rationale: Nom propre rendu selon sa forme française conventionnelle.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: pour que mon nom y soit
  rationale: L’infinitif לִהְיוֹת exprime ici le but ou le résultat. « Y » rend naturellement שָׁם tout en conservant l’expression théologique « mon nom ».
- source_word: בְּדָוִיד
  choice: David
  rationale: Après בחר, la préposition בְּ marque la personne choisie; le français dit simplement « choisir David ».
- source_word: לִהְיוֹת עַל
  choice: pour qu’il soit à la tête de
  rationale: עַל exprime une position d’autorité. « Être à la tête de » est naturel en français et préserve le caractère général de la formulation sans ajouter explicitement « roi ».
- source_word: עַמִּי יִשְׂרָאֵל
  choice: mon peuple Israël
  rationale: Cette formulation conserve à la fois le langage d’alliance « mon peuple » et le nom apposé « Israël ».
- source_word: וָ־
  choice: Mais
  rationale: Dans le contexte, la conjonction introduit le contraste entre les choix que Dieu n’avait pas faits auparavant et les choix positifs énoncés ici.
theological_decisions:
- issue: Théologie du temple dans « mon nom y soit »
  choice: Conserver l’expression « mon nom y soit » sans la remplacer par une paraphrase sur la présence de Dieu.
  alternative: « pour que ma présence y demeure » ou « comme lieu où l’on m’adore »
  rationale: L’hébreu parle expressément du « nom » de Dieu, formule importante de la théologie biblique du temple. La conserver évite de réduire ou de développer indûment sa portée.
- issue: Rôle de David dans לִהְיוֹת עַל עַמִּי
  choice: « pour qu’il soit à la tête de mon peuple Israël »
  alternative: « pour qu’il soit roi sur mon peuple Israël » ou « pour qu’il gouverne mon peuple Israël »
  rationale: Le contexte concerne bien la royauté, mais le texte hébreu dit littéralement que David doit être « sur » le peuple. La traduction choisie exprime l’autorité sans ajouter le titre de roi.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une formulation artificielle; le passé composé convient naturellement au discours divin et à la portée durable des choix mentionnés.
