base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: fr
  text: Alors, écoute depuis le ciel[a], pardonne le péché de ton peuple Israël et ramène-les vers le pays que tu leur as donné, à eux et à leurs pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les verbes hébreux, à la forme inaccomplie, peuvent aussi être rendus au futur : « tu écouteras… tu pardonneras… tu les ramèneras ».'
    reason: ambiguïté grammaticale
  - marker: b
    text: 'Ou : « leurs ancêtres ». L’hébreu dit littéralement : « leurs pères ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: écoute
  rationale: Dans cette prière, le verbe désigne une écoute attentive qui appelle implicitement une réponse. « Écoute » convient mieux que le simple constat « entends » et conserve la force de la demande.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: Le nom hébreu a une forme plurielle, mais le singulier collectif « le ciel » est naturel en français pour désigner la demeure céleste de Dieu. « Depuis » rend la préposition marquant l’origine.
- source_word: סָלַחְתָּ
  choice: pardonne
  rationale: סלח est le verbe courant du pardon accordé par Dieu. « Pardonne » est clair, actuel et adapté à la forme de la prière.
- source_word: לְחַטַּאת
  choice: le péché
  rationale: Le singulier hébreu désigne ici collectivement la faute d’Israël. La traduction garde ce singulier sans le préciser davantage.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: Cette formulation naturelle en français conserve à la fois la désignation d’alliance « ton peuple » et le nom Israël.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: ramène-les
  rationale: La forme causative de שוב indique que Dieu fait revenir les Israélites. « Ramène-les » exprime directement ce sens.
- source_word: אֶל הָאֲדָמָה
  choice: dans le pays
  rationale: Dans ce contexte d’alliance et de retour national, אֲדָמָה désigne le territoire donné à Israël plutôt que le sol ou la terre cultivable.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: que tu leur as donné, à eux et à leurs pères
  rationale: La formulation garde les deux bénéficiaires explicitement marqués en hébreu et souligne la continuité entre la génération présente et les pères.
theological_decisions:
- issue: Valeur des formes verbales dans la prière
  choice: 'des demandes directes : « écoute… pardonne… ramène »'
  alternative: 'une formulation au futur : « tu écouteras… tu pardonneras… tu les ramèneras »'
  rationale: Dans le cadre de la prière de Salomon, les formes verbales peuvent naturellement être comprises comme des requêtes adressées à Dieu. La note conserve l’autre lecture grammaticale possible sans transformer la demande en certitude doctrinale explicite.
- issue: Traduction de אֲבֹתֵיהֶם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le texte hébreu dit littéralement « leurs pères ». Cette expression maintient le lien générationnel et traditionnel du texte, tandis que « ancêtres » constitue une explicitation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La présence de « toi » fait ressortir le pronom hébreu emphatique. Les impératifs suivent le mouvement naturel d’une prière, tandis qu’une note préserve la lecture au futur. La reprise « à eux » évite d’effacer la double construction hébraïque, malgré sa légère solennité.
