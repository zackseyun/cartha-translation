  source_fidelity: 'Le sens des propositions hébraïques est bien rendu : pécher contre Dieu, sa colère, la livraison à un ennemi et l’emmenement en captivité vers un pays lointain ou proche. Toutefois, la succession verbale dépendante de « Quand » n’est pas grammaticalement naturelle en français.'
  naturalness: La construction « Quand ils pécheront ..., que tu te mettras ..., que tu les livreras ... » est fautive ou, au minimum, très heurtée. Une série de protases introduites par « si » rend naturellement la structure conditionnelle inachevée de la prière, qui se poursuit au verset suivant.
  terminology: « Pécher », « se mettre en colère », « livrer à un ennemi » et « ravisseurs » sont justes et de registre moderne, digne et accessible. « être humain » rend correctement la portée générique de אָדָם sans imposer d’interprétation doctrinale.
