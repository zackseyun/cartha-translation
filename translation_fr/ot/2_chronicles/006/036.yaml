  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: fr
  text: S’ils pèchent contre toi — car il n’y a pas d’être humain qui ne pèche —, si tu te mets en colère contre eux et les livres à un ennemi, et si leurs ravisseurs les emmènent dans un pays lointain ou proche,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Quand ils pécheront contre toi
  rationale: Dans cette partie conditionnelle de la prière, כִּי introduit une éventualité tenue pour certaine en raison de la faiblesse humaine. « Quand » rend naturellement cette nuance, et חטא avec ל désigne ici une faute commise contre Dieu.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: car il n’y a aucun être humain qui ne pèche
  rationale: Le second כִּי est causal. אָדָם désigne ici l’être humain au sens générique ; « être humain » conserve explicitement la portée universelle sans limiter l’énoncé aux hommes.
- source_word: וְאָנַפְתָּ בָם
  choice: que tu te mettras en colère contre eux
  rationale: Le verbe אנף exprime la colère. La tournure française s’insère dans la série de propositions dépendant de « quand » sans exagérer l’intensité du terme.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: que tu les livreras à un ennemi
  rationale: נתן avec לִפְנֵי אוֹיֵב signifie remettre des personnes au pouvoir d’un ennemi. L’indéfini « un ennemi » correspond au singulier hébreu non déterminé.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: et que leurs ravisseurs les emmèneront
  rationale: L’hébreu associe le verbe « capturer/emmener captif » au participe apparenté « leurs ravisseurs ». La formulation française évite une répétition pesante tout en conservant l’idée de déportation par ceux qui les ont capturés.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: dans un pays lointain ou proche
  rationale: Cette formulation garde le contraste concis entre éloignement et proximité, sans ajouter un point de référence absent de l’hébreu.
theological_decisions:
- issue: Portée générique de אָדָם dans l’affirmation de l’universalité du péché humain
  choice: aucun être humain qui ne pèche
  alternative: personne qui ne pèche
  rationale: אָדָם est un singulier générique qui vise ici toute l’humanité. « Être humain » rend explicitement cette portée tout en conservant le caractère proverbial et théologiquement tendu de l’affirmation.
translation_notes:
  register: Français international actuel, digne et accessible. La longue structure conditionnelle ainsi que la succession des actions ont été conservées, puisque le verset se poursuit dans les suivants. Les tirets isolent clairement la motivation parenthétique sur l’universalité du péché.
