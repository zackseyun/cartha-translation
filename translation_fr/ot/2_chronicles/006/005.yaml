source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: fr
  text: Depuis le jour où j’ai fait sortir mon peuple du pays d’Égypte, je n’ai choisi aucune ville parmi toutes les tribus d’Israël pour y bâtir une maison[a], afin que mon nom y soit, et je n’ai choisi aucun homme pour être chef[b] de mon peuple Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » désigne le sanctuaire, c’est-à-dire le temple; l’hébreu emploie toutefois le mot « maison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dirigeant »; le terme hébreu peut aussi être rendu par « prince ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: Depuis le jour où
  rationale: Cette tournure française naturelle marque un point de départ dans le passé dont la portée se prolonge jusqu’au moment évoqué.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: j’ai fait sortir mon peuple du pays d’Égypte
  rationale: Le factitif du verbe יצא est rendu explicitement par « faire sortir »; « mon peuple » et « le pays d’Égypte » conservent les désignations du texte.
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: je n’ai choisi aucune ville parmi toutes les tribus d’Israël
  rationale: Sous la négation, « aucune ville » exprime clairement la portée distributive de l’hébreu tout en gardant le lien entre la ville choisie et les tribus d’Israël.
- source_word: לִבְנוֹת בַּיִת
  choice: pour y bâtir une maison
  rationale: « Maison » traduit directement בַּיִת sans remplacer le terme hébreu par l’interprétation « temple »; « y » rattache naturellement la construction à la ville.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: afin que mon nom y soit
  rationale: La formulation conserve le verbe « être » et la théologie du nom sans introduire « habiter » ou une paraphrase sur la présence divine.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: et je n’ai choisi aucun homme
  rationale: « Homme » maintient le masculin singulier אִישׁ, pertinent ici pour la fonction historique de dirigeant.
- source_word: נָגִיד עַל עַמִּי יִשְׂרָאֵל
  choice: chef de mon peuple Israël
  rationale: « Chef » désigne clairement une personne investie d’autorité, sans imposer le sens dynastique que pourrait suggérer « prince ».
theological_decisions:
- issue: Terminologie du sanctuaire et présence du nom divin
  choice: Conserver « maison » et « afin que mon nom y soit ».
  alternative: « temple où ma présence habiterait »
  rationale: Le texte emploie le nom ordinaire « maison » et le verbe « être » à propos du nom de Dieu. La traduction retenue préserve ces catégories et leur tension théologique sans les expliciter abusivement.
- issue: Genre du terme אִישׁ
  choice: Traduire par « homme ».
  alternative: « personne » ou « quelqu’un »
  rationale: Le mot hébreu est masculin singulier et vise ici un dirigeant masculin dans l’histoire d’Israël; la formulation n’est donc pas neutralisée.
- issue: Nature de l’autorité exprimée par נָגִיד
  choice: Employer « chef ».
  alternative: « dirigeant », « souverain » ou « prince »
  rationale: « Chef » garde le sens général d’une autorité établie sur le peuple sans préciser prématurément la forme exacte de cette autorité.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme des deux négations et la formulation sobre du texte hébreu, tout en employant une syntaxe française naturelle.
