  variant: modern international French
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: fr
  text: Cependant, ce n’est pas toi qui bâtiras la maison[a] ; c’est ton fils, celui qui naîtra de toi[b], qui bâtira la maison pour mon nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple » ; l’hébreu dit littéralement « la maison », désignation courante du temple.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui sortira de tes reins », expression désignant un descendant biologique direct.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: La particule introduit ici une restriction qui contraste avec l’approbation divine exprimée auparavant. « Cependant » rend naturellement cette nuance adversative en français.
- source_word: תִבְנֶה הַבָּיִת / יִבְנֶה הַבַּיִת
  choice: bâtiras / bâtira la maison
  rationale: « La maison » suit le terme hébreu défini et conserve son emploi biblique pour désigner le temple. La répétition présente dans la source est maintenue.
- source_word: כִּי
  choice: c’est… qui
  rationale: Après la négation, כִּי introduit ici le contraste positif. La construction française « ce n’est pas toi… c’est ton fils… qui » exprime clairement cette opposition sans lui attribuer artificiellement une valeur causale.
- source_word: בִנְךָ
  choice: ton fils
  rationale: Rendu direct et naturel du nom avec suffixe possessif de deuxième personne du singulier.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: celui qui naîtra de toi
  rationale: L’expression hébraïque signifie littéralement qu’il sortira des reins de David et désigne donc un descendant biologique direct. La formulation choisie communique ce sens dans un français moderne et digne.
- source_word: הוּא
  choice: qui bâtira
  rationale: Le pronom indépendant hébreu met le fils en relief. En français, la tournure contrastive « c’est ton fils… qui » porte naturellement cette insistance sans ajouter un pronom redondant.
- source_word: לִשְׁמִי
  choice: pour mon nom
  rationale: Cette formulation conserve l’expression biblique indiquant que la maison sera consacrée au nom de Dieu et le représentera.
theological_decisions:
- issue: Désignation du temple
  choice: la maison
  alternative: le temple
  rationale: L’hébreu dit littéralement « la maison », désignation courante du temple. La conserver maintient la texture de la source et ses échos internes, tandis qu’une note explicite le référent.
- issue: Expression de la filiation biologique
  choice: qui naîtra de toi
  alternative: qui sortira de tes reins
  rationale: L’expression désigne un fils directement issu de David. Le choix retenu en préserve le sens sans recourir à une tournure anatomique devenue archaïque ou susceptible d’être mal comprise.
translation_notes:
  register: Français international moderne, clair et digne. La structure contrastive « ce n’est pas toi… c’est ton fils… qui » restitue à la fois l’opposition et l’accent porté par le pronom hébreu. « Bâtir » et « pour mon nom » conservent le registre biblique sans être obscurs.
