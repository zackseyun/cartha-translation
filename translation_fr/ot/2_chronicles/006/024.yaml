source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: fr
  text: Si les Israélites, ton peuple, sont vaincus face à un ennemi parce qu’ils ont péché contre toi, puis reviennent[a], célèbrent ton nom[b], te prient et implorent ta faveur[c] devant toi dans cette maison,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retournent » ; dans ce contexte d’alliance, le verbe hébreu peut aussi évoquer la repentance.
    reason: lexical_alternative
  - marker: b
    text: Ou « reconnaissent ton nom », « confessent ton nom » ou « rendent grâce à ton nom ».
    reason: lexical_alternative
  - marker: c
    text: Ou « te supplient » ou « implorent ta miséricorde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף לִפְנֵי אוֹיֵב
  choice: sont vaincus face à un ennemi
  rationale: Le nifal de נגף exprime ici une défaite militaire. « Face à un ennemi » conserve l’image de לִפְנֵי sans laisser entendre que l’ennemi n’est que le complément d’agent.
- source_word: כִּי יֶחְטְאוּ לָךְ
  choice: parce qu’ils ont péché contre toi
  rationale: כִּי indique vraisemblablement la cause de la défaite, et לָךְ se rend naturellement par « contre toi » dans ce contexte.
- source_word: וְשָׁבוּ
  choice: puis reviennent
  rationale: « Reviennent » garde l’image générale de שׁוב et laisse entendre, sans l’imposer comme terme technique, le retour à Dieu et la repentance propres au contexte d’alliance.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: célèbrent ton nom
  rationale: Le hifil de ידה peut exprimer l’aveu, la louange ou l’action de grâce. « Célèbrent ton nom » convient à l’acte public de reconnaître Dieu tout en maintenant une partie de cette amplitude sémantique.
- source_word: וְהִתְפַּלְלוּ
  choice: te prient
  rationale: Rend directement et naturellement le hitpael de פלל; le complément « te » explicite en français le destinataire déjà clair dans le contexte.
- source_word: וְהִתְחַנְּנוּ
  choice: implorent ta faveur
  rationale: Le hitpael de חנן désigne une supplication visant à obtenir grâce ou faveur. Cette formulation est actuelle et conserve cette nuance.
- source_word: לְפָנֶיךָ בַּבַּיִת הַזֶּה
  choice: devant toi dans cette maison
  rationale: La traduction conserve les deux expressions spatiales et relationnelles de l’hébreu, ainsi que « maison », terme propre au cadre de la prière de dédicace.
theological_decisions:
- issue: Portée pénitentielle de וְשָׁבוּ
  choice: reviennent
  alternative: se repentent
  rationale: Le contexte implique un retour à Dieu après le péché, mais שׁוב demeure plus large qu’un terme technique désignant la repentance. Le choix retenu préserve cette tension.
- issue: Sens de וְהוֹדוּ אֶת שְׁמֶךָ
  choice: célèbrent ton nom
  alternative: confessent ton nom
  rationale: 'ידה au hifil couvre ici plusieurs idées proches : reconnaître, louer, rendre grâce. « Célèbrent » est idiomatique en français, tandis qu’une note conserve les autres lectures possibles sans trancher excessivement.'
translation_notes:
  register: Français international moderne, digne et accessible. « Les Israélites, ton peuple » permet de conserver naturellement les verbes au pluriel de l’hébreu. La phrase reste ouverte par une virgule, puisqu’elle constitue la protase dont la réponse divine vient au verset suivant.
