language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: fr
  text: Écoute les supplications de ton serviteur et de ton peuple Israël quand ils prieront en direction de ce lieu. Toi, écoute depuis le lieu où tu habites, depuis le ciel ; écoute et pardonne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: Écoute / écoute / écoute
  rationale: La répétition du verbe שׁמע structure le verset. « Écoute » conserve cette insistance et convient à la forme de supplication adressée à Dieu.
- source_word: תַּחֲנוּנֵי
  choice: les supplications
  rationale: Le terme désigne des demandes pressantes de faveur ou de compassion. « Supplications » en restitue la force tout en gardant un registre digne et compréhensible.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans la prière royale de Salomon, « serviteur » exprime naturellement sa relation de soumission et d’honneur envers Dieu.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: et de ton peuple Israël
  rationale: La répétition de « de » indique clairement que les supplications sont celles du serviteur comme celles du peuple.
- source_word: יִתְפַּלְלוּ
  choice: ils prieront
  rationale: L’imparfait hébreu envisage ici les prières à venir du peuple dans le cadre de la demande de Salomon.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en direction de ce lieu
  rationale: La préposition marque l’orientation de la prière vers le Temple, sans suggérer que Dieu y serait localisé.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: depuis le lieu où tu habites
  rationale: Cette formulation française naturelle traduit explicitement le lieu de résidence de Dieu.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: Bien que le mot hébreu ait une forme plurielle, le singulier « le ciel » est ici l’équivalent idiomatique naturel en français.
- source_word: וְסָלָחְתָּ
  choice: et pardonne
  rationale: « Pardonner » exprime directement la remise de la faute demandée à Dieu.
theological_decisions:
- issue: Transcendance divine et théologie du Temple
  choice: Le peuple prie en direction du Temple, tandis que Dieu écoute depuis sa demeure céleste.
  alternative: Présenter le Temple comme la demeure où Dieu serait pleinement localisé, ou réduire sa mention à un symbole sans portée directionnelle.
  rationale: Le texte hébreu maintient ensemble l’orientation de la prière vers « ce lieu » et l’affirmation que Dieu écoute depuis le ciel. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et directement accessible. La triple répétition d’« écoute » reproduit l’insistance du texte hébreu. « Toi » met en relief le changement de sujet exprimé en hébreu sans alourdir la phrase.
