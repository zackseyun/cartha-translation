source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: fr
  text: 'Et maintenant, SEIGNEUR, Dieu d’Israël, tiens envers ton serviteur David, mon père, la promesse que tu lui as faite en disant : « Tu ne manqueras jamais devant moi d’un descendant qui siège sur le trône d’Israël, pourvu seulement que tes fils veillent sur leur conduite en marchant selon ma loi, comme tu as marché devant moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמֹר
  choice: tiens envers… la promesse
  rationale: Dans ce contexte, le verbe « garder » porte sur la parole donnée à David; la formulation française naturelle « tenir la promesse » exprime fidèlement cette idée.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: tu ne manqueras jamais… d’un descendant
  rationale: Littéralement, « un homme ne sera pas retranché pour toi ». L’expression idiomatique garantit la continuité dynastique; « descendant » rend clairement le sens sans suggérer que le même homme vivrait toujours.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: qui siège sur le trône d’Israël
  rationale: Le participe peut désigner celui qui est assis ou règne sur le trône; « siège » conserve l’image royale du texte.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: tes fils veillent sur leur conduite
  rationale: « Garder leur chemin » est un idiome décrivant une conduite attentive et fidèle. Cette traduction reste proche de l’image tout en étant naturelle en français.
- source_word: בְּתוֹרָתִי
  choice: selon ma loi
  rationale: Torah désigne ici l’instruction ou loi divine. « Ma loi » convient au contexte de l’alliance davidique et correspond au sens usuel dans les Chroniques.
- source_word: לְפָנָי
  choice: devant moi
  rationale: La locution exprime la vie et la conduite sous le regard de Dieu; elle est conservée afin de ne pas réduire sa portée théologique.
theological_decisions:
- issue: Condition attachée à la continuité dynastique
  choice: pourvu seulement que tes fils veillent sur leur conduite
  alternative: si seulement tes fils gardent leur voie
  rationale: La condition explicite du texte hébreu est maintenue, sans tenter de la résoudre par rapport aux formulations inconditionnelles de la promesse davidique ailleurs.
- issue: Identité du successeur royal
  choice: un descendant qui siège sur le trône
  alternative: un homme assis sur le trône
  rationale: Le texte évoque la continuité de la lignée de David sans identifier ici un accomplissement historique ou messianique particulier.
translation_notes:
  register: Français international moderne, digne et accessible. Le nom divin יהוה est rendu par « SEIGNEUR », conformément à l’usage biblique français courant. Les formulations idiomatiques hébraïques sont clarifiées sans effacer la condition de fidélité ni l’image de marcher devant Dieu.
