  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: fr
  text: Puis le roi se retourna[a] et bénit toute l’assemblée d’Israël[b], tandis que toute l’assemblée d’Israël se tenait debout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tourna son visage ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute la communauté d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: se retourna
  rationale: L’expression hébraïque signifie littéralement que le roi « tourna son visage ». En français actuel, « se retourna » exprime naturellement le mouvement physique sans en modifier le sens.
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le verbe ברך signifie couramment « bénir ». Ici, il indique que le roi adresse une bénédiction au peuple rassemblé.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: קהל désigne ici la communauté convoquée et réunie. « Assemblée » convient au cadre public et cultuel tout en restant clair en français moderne.
- source_word: עוֹמֵד
  choice: se tenait debout
  rationale: Le participe décrit la posture continue de l’assemblée au moment où le roi la bénit. Le singulier français respecte le caractère collectif du nom « assemblée ».
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: tandis que toute l’assemblée d’Israël se tenait debout
  rationale: La proposition décrit la circonstance dans laquelle le roi bénit l’assemblée. « Tandis que » rend clairement ce rapport sans supprimer la répétition emphatique du texte hébreu.
