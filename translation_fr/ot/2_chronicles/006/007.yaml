  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: fr
  text: David, mon père, avait à cœur de construire une maison pour le nom de Yahweh[a], le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une maison pour le nom de Yahweh », expression courante désignant le temple comme le lieu associé au nom de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: avait à cœur
  rationale: L’expression hébraïque décrit une intention intérieure. « Avait à cœur » est idiomatique en français moderne tout en conservant l’image du cœur.
- source_word: דָּוִיד אָבִי
  choice: David, mon père
  rationale: Cette formulation suit l’ordre hébreu et demeure naturelle en français ; les virgules marquent l’apposition.
- source_word: לִבְנוֹת בַּיִת
  choice: construire une maison
  rationale: « Construire » rend directement le verbe בנה, et « maison » conserve le terme concret du texte au lieu de l’expliciter par « temple ».
- source_word: לְשֵׁם
  choice: pour le nom de
  rationale: La formulation préserve l’expression théologiquement significative qui associe le sanctuaire au nom divin, sans la réduire à « en l’honneur de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette traduction directe et usuelle conserve le titre d’alliance.
theological_decisions:
- issue: Sens de בַּיִת לְשֵׁם יְהוָה
  choice: une maison pour le nom de Yahweh
  alternative: un temple pour Yahweh ; une maison en l’honneur de Yahweh
  rationale: Le texte distingue la maison du nom auquel elle est destinée. Garder « maison » et « nom » préserve la tension propre à la théologie du sanctuaire dans les Chroniques sans identifier simplement l’édifice à la présence divine.
translation_notes:
  register: Français international moderne, digne et accessible. « Avait à cœur » restitue naturellement l’intention exprimée par l’idiome hébreu, tandis que « maison pour le nom » conserve la formulation biblique distinctive.
