source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: fr
  text: Pourtant, tourne-toi vers la prière de ton serviteur et vers sa supplication[a], Yahweh, mon Dieu, pour entendre le cri[b] et la prière que ton serviteur t’adresse en ta présence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa demande de faveur ». Le terme hébreu désigne une demande pressante de faveur ou de miséricorde.
    reason: lexical_alternative
  - marker: b
    text: Ou « le cri retentissant ». Ici, le mot désigne probablement un cri appelant au secours dans la prière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Pourtant, tourne-toi vers
  rationale: Le verbe פנה conserve l’image de se tourner vers quelqu’un ou quelque chose. Dans cette prière, l’impératif français exprime naturellement la demande adressée à Dieu, tandis que « Pourtant » rend la transition suppliante du ו contextuel.
- source_word: תְּפִלַּת
  choice: la prière
  rationale: Équivalent courant de תְּפִלָּה, maintenu aussi lors de la répétition afin de préserver le parallélisme hébreu.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans le langage royal de la prière, « serviteur » est naturel et respecte la posture de soumission du locuteur devant Dieu.
- source_word: תְּחִנָּתוֹ
  choice: sa demande de grâce
  rationale: תְּחִנָּה désigne une supplication pressante qui sollicite faveur ou miséricorde. Cette formulation rend explicitement cette nuance en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, conservé comme nom propre plutôt que remplacé par un titre.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Rend directement la forme possessive et l’apostrophe adressée à Dieu.
- source_word: לִשְׁמֹעַ
  choice: afin d’entendre
  rationale: L’infinitif exprime ici le but de la demande. « Entendre » convient à la fois au cri et à la prière.
- source_word: הָרִנָּה
  choice: le cri
  rationale: רִנָּה peut désigner un cri retentissant; dans ce contexte de supplication, il s’agit vraisemblablement d’un cri appelant au secours.
- source_word: מִתְפַּלֵּל לְפָנֶיךָ
  choice: que ton serviteur t’adresse
  rationale: Cette tournure française naturelle rend l’acte de prier en présence de Dieu et son orientation vers lui, sans la répétition peu idiomatique « prie la prière ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Nature de תְּחִנָּה
  choice: demande de grâce
  alternative: supplication
  rationale: Le choix principal explicite la recherche de faveur ou de miséricorde sans déterminer davantage la manière dont Dieu y répond; l’autre rendu demeure possible.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’image hébraïque de Dieu qui se tourne vers la prière, tout en évitant la répétition non idiomatique « prier une prière » dans la proposition finale.
