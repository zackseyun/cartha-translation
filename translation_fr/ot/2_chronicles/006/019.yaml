review_pass:
  verdict: revise
  source_fidelity: La proposition finale doit rendre explicitement לְפָנֶיךָ (« devant toi / en ta présence »). Le brouillon traduit bien la plupart des éléments, mais « que ton serviteur t’adresse » n’exprime pas clairement cette précision spatiale ou cultuelle.
  naturalness: Le français est globalement naturel et digne. « Sa supplication » est plus idiomatique et plus directement équivalent à תְּחִנָּתוֹ que « sa demande de grâce », tout en laissant la nuance de faveur dans la note. « En ta présence » rend naturellement « devant toi » sans calque.
  terminology: « Yahweh », « ton serviteur », « prière », « supplication » et « cri » sont appropriés et cohérents avec le texte hébreu. La note sur le cri retentissant préserve utilement la nuance possible de רִנָּה.
  issues:
  - severity: medium
    issue: La mention « devant toi » est absente de la traduction principale.
    rationale: Le texte hébreu se termine par לְפָנֶיךָ. « Que ton serviteur t’adresse » indique le destinataire, mais non explicitement la prière faite en présence de Dieu. Il convient d’ajouter « en ta présence ».
  - severity: low
    issue: « Sa demande de grâce » explicite davantage que nécessaire le terme תְּחִנָּה.
    rationale: Le mot désigne une supplication ou requête de faveur, mais « supplication » est un équivalent français direct et naturel; la note peut fournir la nuance de faveur ou de miséricorde.
  revised_text: Pourtant, tourne-toi vers la prière de ton serviteur et vers sa supplication[a], Yahweh, mon Dieu, pour entendre le cri[b] et la prière que ton serviteur t’adresse en ta présence.
  revised_footnotes:
