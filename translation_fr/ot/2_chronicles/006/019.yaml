revisions:
- from: Pourtant, tourne-toi vers la prière de ton serviteur et vers sa demande de grâce[a], Yahweh, mon Dieu, afin d’entendre le cri[b] et la prière que ton serviteur t’adresse.
  to: Pourtant, tourne-toi vers la prière de ton serviteur et vers sa supplication[a], Yahweh, mon Dieu, pour entendre le cri[b] et la prière que ton serviteur t’adresse en ta présence.
  rationale: La révision rétablit explicitement le sens de לְפָנֶיךָ par « en ta présence » et emploie « supplication », équivalent plus direct et plus naturel de תְּחִנָּה. Elle conserve le parallélisme entre le cri et la prière, le nom divin Yahweh, ainsi que l’aspect actuel du participe par le présent « t’adresse ».
  reviewer_model: gpt-5.6-terra
