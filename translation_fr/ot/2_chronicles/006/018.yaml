id: 2CH.6.18
reference: 2 Chronicles 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: fr
  text: Mais Dieu habitera-t-il vraiment avec l’être humain sur la terre ? Voici, le ciel et le plus haut des cieux ne peuvent te contenir, combien moins cette maison que j’ai bâtie !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: vraiment
  rationale: Introduit une question rhétorique empreinte d’étonnement; « vraiment » est naturel en français moderne sans affaiblir la solennité.
- source_word: יֵשֵׁב
  choice: habitera
  rationale: Dans le contexte de la présence divine et du temple, le verbe désigne le fait de demeurer plutôt que la posture physique de s’asseoir.
- source_word: אֶת הָאָדָם
  choice: avec l’être humain
  rationale: Le singulier אָדָם a ici une valeur représentative et désigne l’humanité; cette formulation conserve le singulier tout en rendant clairement le sens générique.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Équivalent locatif direct et idiomatique.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la fonction d’appel à l’attention et le registre élevé du texte hébreu.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: le ciel et le plus haut des cieux
  rationale: Rend naturellement l’expression hébraïque intensive « les cieux des cieux » comme un superlatif, tout en gardant son amplification cosmologique.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: ne peuvent te contenir
  rationale: Exprime l’incapacité de tout espace créé à renfermer Dieu.
- source_word: אַף כִּי
  choice: combien moins
  rationale: Préserve explicitement le raisonnement a fortiori et convient au registre solennel de la prière.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Suit le terme hébreu « maison » et préserve le motif de la maison de Dieu sans expliciter par « temple ».
- source_word: אֲשֶׁר בָּנִיתִי
  choice: que j’ai bâtie
  rationale: Le passé composé exprime naturellement en français une construction achevée dont le résultat est présent; « bâtie » s’accorde avec l’antécédent féminin « maison ».
theological_decisions:
- issue: Valeur générique de אָדָם
  choice: l’être humain
  alternative: l’homme; l’humanité
  rationale: Le passage oppose Dieu à l’humanité en employant un singulier représentatif. « L’être humain » maintient ce singulier et son caractère inclusif sans introduire une distinction de sexe absente du contexte.
- issue: Transcendance divine et demeure terrestre
  choice: ne peuvent te contenir
  alternative: ne peuvent t’accueillir; ne peuvent te soutenir
  rationale: La formulation maintient la tension entre la présence réelle de Dieu auprès des humains et le fait qu’aucun espace créé, pas même le temple, ne peut l’enfermer.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique, l’appel solennel « Voici » et l’argument a fortiori « combien moins » préservent l’élévation de la prière sans archaïsme excessif.
