source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: fr
  text: Et maintenant, Yahweh, Dieu d’Israël, que soit confirmée la parole que tu as adressée à ton serviteur David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que s’accomplisse la promesse que tu as faite » ; ou : « que ta parole se révèle vraie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Le marqueur temporel et discursif introduit la requête suivante de Salomon; « Et maintenant » rend à la fois la conjonction et la transition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Cette formulation naturelle et transparente reproduit l’expression construite qui identifie Yahweh comme le Dieu d’Israël.
- source_word: יֵאָמֵן
  choice: que se confirme
  rationale: Le niphal de אמן exprime ici le souhait que la parole prononcée soit reconnue ferme et trouve son accomplissement. La tournure française conserve la valeur passive et la force de la requête.
- source_word: דְּבָרְךָ
  choice: la parole
  rationale: « Parole » conserve le sens lexical sans expliciter d’emblée « promesse », bien que le contexte indique bien une promesse divine.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: que tu as adressée
  rationale: En français, « la parole que tu as adressée à » est plus idiomatique que « la parole que tu as parlée à », tout en gardant l’idée d’une parole prononcée.
- source_word: לְעַבְדְּךָ לְדָוִיד
  choice: à ton serviteur David
  rationale: La préposition marque le destinataire de la parole; « serviteur » convient au contexte royal et relationnel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Interprétation de דְּבָרְךָ
  choice: la parole
  alternative: la promesse
  rationale: Le contexte permet « promesse », mais « parole » reste plus proche du lexème hébreu et préserve la manière dont le texte relie la parole de Dieu à sa confirmation.
- issue: Portée de יֵאָמֵן
  choice: que se confirme
  alternative: qu’elle s’accomplisse; qu’elle se révèle vraie; qu’elle soit établie
  rationale: « Se confirme » maintient la tension entre fermeté, véracité démontrée et accomplissement, sans réduire le verbe à une seule de ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de prière reste solennelle sans archaïsme. Le marqueur [a] est placé après la proposition entière, puisqu’il porte sur la traduction conjointe de « parole » et de « se confirme ».
