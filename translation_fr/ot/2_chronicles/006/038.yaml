  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: fr
  text: s’ils reviennent à toi de tout leur cœur et de toute leur âme, dans le pays de leur captivité[a], où ils ont été emmenés captifs, et s’ils prient en direction de leur pays, que tu as donné à leurs ancêtres, de la ville que tu as choisie et de la maison que j’ai bâtie pour ton nom,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le pays de leur captivité ».'
    reason: La note explicite l’expression construite hébraïque, dont la formulation française conserve ici la forme proche.
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: s’ils reviennent à toi
  rationale: Le verbe שׁוּב suivi de אֶל exprime le retour vers quelqu’un et peut, dans ce contexte d’alliance, impliquer la repentance. « Reviennent à toi » conserve l’image concrète sans expliciter excessivement cette implication.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: de tout leur cœur et de toute leur âme
  rationale: Cette formulation française naturelle conserve l’expression hébraïque de l’engagement total de la personne.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: dans le pays où ils sont captifs
  rationale: Cette tournure rend clairement le sens du groupe construit, littéralement lié au « pays de leur captivité », tout en évitant une formulation française lourde.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: où on les aura emmenés en captivité
  rationale: Le verbe actif hébreu désigne l’action de ravisseurs non nommés. Le pronom indéfini « on » maintient cet agent non exprimé et le futur antérieur convient à la séquence conditionnelle.
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: et s’ils prient en direction de leur pays
  rationale: Dans ce contexte d’orientation de la prière, דֶּרֶךְ signifie « en direction de ». La répétition de « s’ils » clarifie naturellement la construction conditionnelle française.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: que tu as donné à leurs ancêtres
  rationale: « Ancêtres » transmet ici le sens collectif de אָבוֹת en français moderne plus naturellement que « pères ».
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: de la ville que tu as choisie
  rationale: La préposition française « de » dépend de « en direction » et coordonne les trois orientations. Le passé composé exprime le choix accompli dont la portée demeure.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: et de la maison que j’ai bâtie pour ton nom
  rationale: « Maison » conserve le terme hébreu et sa portée théologique, tandis que « pour ton nom » maintient sans paraphrase l’expression de consécration.
theological_decisions:
- issue: Portée de שׁוּב אֵלֶיךָ dans un contexte d’alliance
  choice: « reviennent à toi »
  alternative: « se tournent de nouveau vers toi » ou « se repentent devant toi »
  rationale: Le sens fondamental est celui d’un retour ou d’un changement de direction. Le contexte implique la repentance, mais traduire directement par « se repentent » résoudrait une nuance que l’hébreu laisse portée par l’image du retour.
- issue: La « maison » désigne le temple
  choice: Conserver « maison »
  alternative: Employer « temple »
  rationale: Le référent est bien le temple, mais בַּיִת signifie « maison » et cette désignation possède ici une résonance propre qu’il convient de préserver.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase reste ouverte par une virgule parce que le verset appartient à une longue proposition conditionnelle poursuivie au verset suivant. La coordination « en direction de leur pays, de la ville… et de la maison… » évite de répéter lourdement la locution tout en gardant les trois orientations.
