  verdict: revise
  source_fidelity: La traduction rend correctement le retour vers Dieu, l’engagement total (« de tout leur cœur et de toute leur âme »), l’orientation de la prière, le pays donné aux ancêtres, la ville choisie et la maison bâtie pour le nom de Dieu. Toutefois, « où on les aura emmenés en captivité » introduit un futur antérieur non requis et affaiblit la relation avec le passé de la captivité exprimée dans l’hébreu.
  naturalness: L’ensemble est fluide et de registre approprié. « Où ils ont été emmenés captifs » est plus direct, plus idiomatique dans cette séquence conditionnelle et évite la périphrase lourde « on les aura emmenés en captivité ».
  terminology: « Reviennent à toi », « cœur », « âme », « ancêtres », « maison » et « pour ton nom » sont des choix justes et cohérents. « Maison » préserve utilement le terme source sans imposer « temple ».
