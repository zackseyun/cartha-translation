    rationale: Le futur antérieur dans « où on les aura emmenés en captivité » n’est pas motivé par אֲשֶׁר שָׁבוּ אֹתָם, qui évoque l’action passée par laquelle ils ont été faits captifs. Une forme passive au passé composé rend fidèlement l’agent non précisé tout en restant naturelle.
