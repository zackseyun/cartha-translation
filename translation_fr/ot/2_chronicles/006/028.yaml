source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: fr
  text: S’il y a une famine dans le pays, s’il y a une épidémie, s’il y a dessèchement ou jaunissement des cultures, s’il y a des criquets ou des insectes ravageurs[a], si ses ennemis l’assiègent dans le pays de ses villes[b], quel que soit le fléau ou la maladie —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne un insecte ravageur qui dévore les cultures. L’espèce exacte est incertaine; il peut s’agir d’un autre type de criquet ou d’un autre insecte dévastateur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans le pays de ses portes »; les « portes » représentent ici les villes ou les localités fortifiées du pays.'
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: famine
  rationale: Dans cette liste de calamités frappant le pays, le terme désigne une famine plutôt que la faim ordinaire.
- source_word: דֶּבֶר
  choice: épidémie
  rationale: Le mot désigne une maladie contagieuse meurtrière; « épidémie » est actuel et évite le sens moderne plus étroit que peut avoir « peste ».
- source_word: שִׁדָּפוֹן וְיֵרָקוֹן
  choice: si les cultures se dessèchent ou jaunissent
  rationale: Ces termes décrivent des atteintes agricoles causant respectivement dessèchement ou brûlure et jaunissement. La formulation verbale est claire en français moderne sans prétendre identifier précisément les maladies végétales.
- source_word: אַרְבֶּה
  choice: criquets
  rationale: Dans ce contexte de destruction agricole, il s’agit de criquets ravageurs en essaim.
- source_word: חָסִיל
  choice: insectes dévastateurs
  rationale: L’espèce exacte est incertaine; le terme souligne surtout un insecte qui dévore les cultures. Une note conserve les principales identifications possibles.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: si les ennemis de ton peuple l’assiègent
  rationale: La forme verbale exprime l’action de serrer, cerner ou assiéger. L’explicitation « de ton peuple » clarifie le référent du pronom singulier dans l’adresse à Dieu sans changer le sens.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: dans le pays, jusque dans ses villes
  rationale: Les « portes » représentent par métonymie les villes fortifiées. La traduction exprime ce sens en français naturel, tandis que la note signale l’image hébraïque.
- source_word: כָּל נֶגַע וְכָל מַחֲלָה
  choice: quel que soit le fléau ou la maladie
  rationale: Cette formulation maintient la portée générale des deux termes et leur parallélisme, tout en préparant la suite syntaxique de la prière.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La série nominale hébraïque est partiellement verbalisée pour rendre clairement les dommages agricoles. Le tiret final conserve le caractère inachevé du verset, dont la construction se poursuit au verset suivant.
