id: 2CH.6.12
reference: 2 Chronicles 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: fr
  text: Il se tint alors devant l’autel de Yahweh, face à toute l’assemblée d’Israël, et étendit les mains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étendit ses paumes »; cette expression décrit le geste d’étendre les mains dans la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Il se tint alors
  rationale: Le wayyiqtol de עמד fait avancer le récit. « Il se tint alors » exprime naturellement en français la prise de position debout, sans ajouter un sujet nominal absent de l’hébreu.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition situe l’homme par rapport à l’autel; « devant » en rend clairement le sens spatial.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahweh
  rationale: La chaîne construite est rendue directement, et le nom divin personnel est transcrit « Yahweh ».
- source_word: נֶגֶד
  choice: face à
  rationale: Cette expression marque sa position vis-à-vis de l’assemblée et évite de répéter « devant », déjà employé pour לִפְנֵי.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: קהל désigne la communauté réunie; « assemblée » est courant et conserve le sens collectif, tandis que כָּל se rend naturellement par « toute ».
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: et étendit les mains
  rationale: L’expression décrit le geste d’étendre les mains, notamment dans la prière. « Les mains » est idiomatique en français, tandis que le sens plus littéral de כַּפָּיו est signalé en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom divin personnel. La translittération « Yahweh » le préserve au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve les deux repères spatiaux distincts du texte hébreu et rend le geste final de manière naturelle, avec sa forme littérale en note.
