  text: לְמַ֣עַן יִֽירָא֗וּ/ךָ לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: fr
  text: afin qu’ils te craignent[a] et marchent dans tes voies tous les jours qu’ils vivront dans le pays que tu as donné à nos ancêtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te révèrent ». La « crainte » de Dieu inclut ici un profond respect qui s’exprime par l’obéissance.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « aussi longtemps qu’ils vivront dans le pays que tu as donné à nos ancêtres ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit naturellement en français le but recherché, tout en conservant la valeur finale de la tournure hébraïque.
- source_word: יִירָאוּךָ
  choice: qu’ils te craignent
  rationale: Conserve l’expression biblique et la portée de ירא, qui désigne ici une crainte révérencielle se traduisant par l’obéissance.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: et marchent dans tes voies
  rationale: Rend naturellement l’infinitif hébreu coordonné en français et préserve l’image biblique de la conduite conforme aux voies de Dieu.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: tous les jours qu’ils vivront
  rationale: Garde l’expression concrète « tous les jours » et indique que cette conduite doit durer aussi longtemps qu’ils vivront.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sur la terre
  rationale: En français, « sur la terre » exprime naturellement l’hébraïsme « sur la face de la terre/du sol »; le contexte précise qu’il s’agit du territoire donné aux ancêtres.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: que tu as donnée à nos ancêtres
  rationale: Le passé composé convient à un don accompli dont les effets demeurent; « ancêtres » est plus naturel et inclusif en français moderne que « pères » pour désigner les générations fondatrices.
theological_decisions:
- issue: Sens de la crainte de Dieu en lien avec l’obéissance
  choice: Conserver « te craignent » dans le texte principal.
  alternative: « te révèrent » ou « te respectent profondément »
  rationale: Le verbe hébreu porte ici le sens théologique d’une crainte révérencielle; la mention de la marche dans les voies de Dieu montre qu’elle s’exprime par l’obéissance, sans la réduire à la terreur.
- issue: Portée de הָאֲדָמָה
  choice: Traduire par « la terre » en laissant la proposition relative l’identifier comme celle donnée aux ancêtres.
  alternative: « le pays » ou « le sol »
  rationale: Le contexte désigne la terre promise à Israël. « La terre que tu as donnée à nos ancêtres » est naturel en français et évite que « le pays » suggère trop directement un État moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images bibliques « craindre Dieu » et « marcher dans ses voies », tout en employant « ancêtres » plutôt que « pères » pour une compréhension immédiate.
