revisions:
- from: Si un homme pèche contre son prochain, qu’on lui impose un serment pour le faire jurer, et que le serment soit prononcé devant ton autel, dans cette maison,[a]
  to: Si un homme pèche contre son prochain et qu’on lui impose un serment[a] pour le faire jurer, qu’il vienne prêter serment devant ton autel dans cette maison,
  rationale: La révision remplace une explicitation passive peu fidèle (« que le serment soit prononcé ») par l’expression juridique française usuelle « prêter serment », liée à la venue devant l’autel. Elle maintient la distinction source entre l’imposition d’un serment et l’obligation de faire jurer, et conserve « cette maison » pour בַּבַּיִת הַזֶּה. La virgule finale est conservée, car le verset est syntaxiquement suivi par la requête du verset suivant.
