review_pass:
  verdict: revise
  source_fidelity: La première partie rend correctement la condition, la faute contre le prochain et la double construction juridique « imposer une אָלָה / faire jurer ». En revanche, « que le serment soit prononcé » ne rend pas de façon suffisamment directe וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ. Dans ce contexte, la formulation s’entend naturellement de la venue de l’homme pour prêter le serment devant l’autel. La révision rend cette relation sans prétendre résoudre au-delà du nécessaire les particularités elliptiques de la syntaxe hébraïque.
  naturalness: La phrase révisée est idiomatique en français moderne international et conserve le caractère conditionnel et juridique de la prière. « Prêter serment » est plus naturel que « le serment soit prononcé », tout en restant formel sans être archaïque.
  terminology: « Pécher », « prochain », « serment », « prêter serment », « autel » et « cette maison » sont appropriés. La note conserve la valeur possible de serment assorti d’une malédiction de אָלָה. L’ancre est déplacée auprès de « serment » afin que son référent soit immédiatement identifiable.
  issues:
  - severity: medium
    issue: Le dernier membre est rendu par « que le serment soit prononcé devant ton autel ».
    rationale: Cette formulation introduit l’acte de « prononcer » et fait du serment le sujet d’une tournure passive qui ne correspond pas aussi directement à la construction hébraïque. Dans le cadre judiciaire du verset, « qu’il vienne prêter serment devant ton autel » rend clairement la venue requise et l’acte de serment.
  - severity: low
    issue: L’appel de note est placé après « cette maison ».
    rationale: La note porte sur אָלָה, traduit par « serment », et non sur « maison ». Le placer après le premier emploi de « serment » améliore la précision de l’ancrage.
  revised_text: Si un homme pèche contre son prochain et qu’on lui impose un serment[a] pour le faire jurer, qu’il vienne prêter serment devant ton autel dans cette maison,
  revised_footnotes:
  - marker: a
    text: Le terme hébreu peut désigner un serment assorti d’une malédiction contre celui qui le violerait, ou une imprécation imposée à quelqu’un.
    reason: Préserver la nuance judiciaire et la sanction de אָלָה sans alourdir le texte principal.
  revision_rationale: La révision remplace une explicitation passive peu fidèle (« que le serment soit prononcé ») par l’expression juridique française usuelle « prêter serment », liée à la venue devant l’autel. Elle maintient la distinction source entre l’imposition d’un serment et l’obligation de faire jurer, et conserve « cette maison » pour בַּבַּיִת הַזֶּה. La virgule finale est conservée, car le verset est syntaxiquement suivi par la requête du verset suivant.
