  text: אִם יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: fr
  text: Si un homme pèche contre son prochain et qu’on lui impose un serment[a] pour le faire jurer, qu’il vienne prêter serment devant ton autel dans cette maison,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner un serment assorti d’une malédiction contre celui qui le violerait, ou une imprécation imposée à quelqu’un.
    reason: Préserver la nuance judiciaire et la sanction de אָלָה sans alourdir le texte principal.
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ לְרֵעֵהוּ
  choice: Si un homme pèche contre son prochain
  rationale: Conserve la condition, le masculin singulier représentatif et la portée morale de חטא; « prochain » rend naturellement רֵעַ dans ce contexte social.
- source_word: וְנָשָׁא בוֹ אָלָה לְהַאֲלֹתוֹ
  choice: qu’on lui impose un serment pour le faire jurer
  rationale: Rend séparément l’imposition de l’אָלָה et la valeur causative de l’infinitif hiphil לְהַאֲלֹתוֹ, sans effacer la construction en deux temps.
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: et que le serment soit prononcé devant ton autel
  rationale: Dans ce cadre judiciaire, l’idée est que le serment vient devant l’autel; « soit prononcé » explicite naturellement en français l’acte qui s’y déroule sans changer son agent implicite.
- source_word: בַּבַּיִת הַזֶּה
  choice: dans cette maison
  rationale: « Maison » conserve le sens littéral et la résonance théologique de בַּיִת pour le Temple.
theological_decisions:
- issue: Sens judiciaire de אָלָה
  choice: serment dans le texte, avec la nuance de malédiction indiquée en note
  alternative: serment assorti d’une malédiction / imprécation
  rationale: Le terme désigne ici un serment judiciaire pouvant appeler une malédiction sur celui qui jure faussement. « Serment » garde le cadre juridique, tandis que la note préserve la sanction implicite.
- issue: Sujet et syntaxe de וּבָא אָלָה
  choice: que le serment soit prononcé devant ton autel
  alternative: qu’il vienne prêter serment devant ton autel
  rationale: Le texte hébreu place formellement אָלָה, « le serment », après וּבָא. La formulation française choisie demeure naturelle tout en évitant de faire explicitement de l’homme le sujet, ce que l’hébreu ne dit pas sans ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme juridique de l’hébreu et « cette maison » plutôt que l’explicitation « ce temple ». Le verset reste syntaxiquement ouvert sur la suite de la prière.
