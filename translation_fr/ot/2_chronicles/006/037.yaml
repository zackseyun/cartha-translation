source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: fr
  text: 'si, dans le pays où ils auront été emmenés captifs, ils rentrent en eux-mêmes[a], reviennent[b] et te supplient dans le pays de leur captivité, en disant : « Nous avons péché, nous avons agi de manière perverse et nous avons agi avec méchanceté »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ramènent à leur cœur » ; expression évoquant une réflexion intérieure qui conduit à reconnaître sa situation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se retournent ». Le verbe hébreu peut évoquer à la fois un retour et un changement intérieur.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: ils rentrent en eux-mêmes
  rationale: Cette expression française naturelle rend l’idée d’un retour intérieur à la réflexion et à la lucidité. Une note conserve l’image hébraïque du retour vers le cœur.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: dans le pays où ils auront été emmenés captifs
  rationale: Le nifal de שׁבה indique qu’ils ont été faits ou emmenés captifs. Le futur antérieur convient à la perspective de la prière de Salomon.
- source_word: וְשָׁבוּ
  choice: reviennent
  rationale: Le verbe שׁוב peut désigner un retour concret ou un retournement intérieur. « Reviennent » maintient cette amplitude sans imposer le terme doctrinal « se repentent ».
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: te supplient
  rationale: Le hitpael de חנן exprime une demande instante de faveur. « Te supplient » est direct, actuel et suffisamment solennel.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: dans le pays de leur captivité
  rationale: Cette formulation proche de l’hébreu conserve la réalité concrète de leur condition de captifs.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule française normale pour introduire le contenu de la confession.
- source_word: חָטָאנוּ
  choice: Nous avons péché
  rationale: Rend directement la formule de confession et le vocabulaire moral de חטא.
- source_word: הֶעֱוִינוּ
  choice: nous avons agi de manière perverse
  rationale: Le verbe issu de עוה évoque une conduite moralement tordue ou pervertie. Cette traduction en garde la force sans employer le terme moins transparent « iniquité ».
- source_word: וְרָשָׁעְנוּ
  choice: nous avons agi avec méchanceté
  rationale: Cette formulation conserve la force verbale de רשע et distingue ce dernier aveu de celui qui précède.
theological_decisions:
- issue: Valeur de שׁוב dans le contexte de la captivité et de la repentance
  choice: reviennent
  alternative: se repentent ; retournent ; reviennent à toi
  rationale: Le contexte associe prise de conscience, retour, supplication et confession, mais le verbe lui-même peut évoquer aussi bien un retour qu’un changement intérieur. La traduction retenue préserve cette tension, explicitée en note, sans ajouter un complément absent de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Rentrer en eux-mêmes » rend naturellement l’idiome du cœur, tandis que la triple confession conserve sa progression et sa gravité. La phrase commence en minuscule et se termine par une virgule afin de respecter son insertion dans la longue proposition conditionnelle des versets environnants.
