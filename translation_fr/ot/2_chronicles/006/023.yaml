  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הָשִׁ֣יב לְ/רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: fr
  text: 'alors, écoute depuis le ciel, agis et juge tes serviteurs : fais payer le méchant en faisant retomber sa conduite sur sa tête[a], et donne raison au juste[b] en le traitant selon sa droiture.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donner sa conduite sur sa tête ». Cette image hébraïque signifie que les conséquences des actes d’une personne retombent sur elle.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « reconnais le juste comme étant dans son droit ». Le verbe hébreu est un terme judiciaire qui signifie reconnaître ou traiter quelqu’un comme étant dans son droit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: écoute depuis le ciel
  rationale: Dans cette prière adressée à Dieu, שׁמע implique une écoute attentive suivie d’une réponse. « Depuis le ciel » conserve directement le point d’origine exprimé par מִן.
- source_word: וְעָשִׂיתָ
  choice: agis
  rationale: Le verbe עשה est très large, mais le contexte demande une intervention divine concrète; « agis » est naturel et fidèle.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: juge tes serviteurs
  rationale: Les deux propositions qui suivent décrivent le traitement judiciaire du méchant et du juste; « juge » préserve donc la portée juridique de שׁפט.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: fais payer le méchant
  rationale: Le verbe שוב exprime ici le retour, sur le coupable, des conséquences de ses actes. Cette formulation française rend clairement l’idée de rétribution, tandis que l’image hébraïque est conservée dans la proposition suivante.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: en faisant retomber sa conduite sur sa propre tête
  rationale: « Conduite » rend le sens moral fréquent de דֶּרֶךְ, et « sur sa propre tête » conserve l’image hébraïque des conséquences qui reviennent sur leur auteur.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: et donne raison au juste
  rationale: 'Le hifil de צדק a ici un sens judiciaire : reconnaître ou déclarer quelqu’un dans son droit. « Donner raison » est idiomatique en français et évite les connotations doctrinales que pourrait porter « justifier ».'
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: en le traitant selon sa justice
  rationale: La formulation exprime un traitement conforme à la droiture du juste. Elle reste proche de l’hébreu sans ajouter explicitement la notion de récompense.
theological_decisions:
- issue: Portée judiciaire du jugement divin
  choice: Employer le vocabulaire du jugement, de la rétribution et de la reconnaissance du juste.
  alternative: Comprendre שׁפט au sens plus général de gouverner ou d’intervenir.
  rationale: Le parallélisme entre le méchant et le juste, ainsi que les verbes שׁפט et הצדיק, établit nettement une scène judiciaire sans exiger l’importation de catégories doctrinales ultérieures.
- issue: Sens de הצדיק
  choice: donne raison au juste
  alternative: justifie le juste
  rationale: Les deux formulations peuvent rendre le sens juridique, mais « donne raison » communique plus immédiatement en français moderne le fait de reconnaître quelqu’un comme étant dans son droit, sans ambiguïté théologique superflue.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle du jugement du méchant et du juste est maintenue, ainsi que l’image concrète des actes qui retombent sur la tête de leur auteur.
