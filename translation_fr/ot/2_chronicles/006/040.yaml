source:
  edition: WLC
  text: עַתָּ֣ה אֱלֹהַ֗/י יִֽהְיוּ נָ֤א עֵינֶ֨י/ךָ֙ פְּתֻח֔וֹת וְ/אָזְנֶ֖י/ךָ קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: fr
  text: Maintenant, mon Dieu, je t’en prie, que tes yeux soient ouverts et tes oreilles attentives à la prière de ce lieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à la prière faite dans ce lieu » ou « à la prière venant de ce lieu ». L’hébreu dit plus littéralement : « à la prière de ce lieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque le passage à la requête finale de Salomon. « Maintenant » conserve simplement la valeur temporelle et discursive de l’hébreu.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne exprime une adresse directe et personnelle. « Mon Dieu » est naturel en français moderne sans qu’il soit nécessaire d’ajouter une interjection.
- source_word: יִהְיוּ נָא
  choice: je t’en prie, que … soient
  rationale: Le jussif accompagné de נָא exprime une demande respectueuse. Cette tournure française rend à la fois la valeur volitive et le ton suppliant.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: que tes yeux soient ouverts
  rationale: La traduction conserve l’image anthropomorphique concrète de l’attention vigilante de Dieu sans la remplacer par une interprétation.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: et tes oreilles attentives
  rationale: קַשֻּׁבוֹת indique l’attention et la disposition à écouter. L’ellipse de « soient » devant le second membre est naturelle en français et respecte le parallélisme.
- source_word: לִתְפִלַּת
  choice: à la prière
  rationale: La préposition לְ désigne ici ce vers quoi l’attention se porte, et le nom singulier est rendu directement par « la prière ».
- source_word: הַמָּקוֹם הַזֶּה
  choice: de ce lieu
  rationale: Cette formulation reste proche de la relation génitive littérale de l’hébreu et préserve son ambiguïté quant au rapport exact entre la prière et le lieu.
theological_decisions:
- issue: Le langage anthropomorphique appliqué aux yeux et aux oreilles de Dieu
  choice: 'Conserver les images concrètes : « tes yeux soient ouverts » et « tes oreilles attentives »'
  alternative: Expliciter par une paraphrase telle que « veille et écoute »
  rationale: L’hébreu présente l’attention divine au moyen d’images corporelles. Les conserver respecte la texture littéraire et théologique du texte sans imposer une compréhension grossièrement corporelle.
- issue: Le rapport entre la prière et « ce lieu »
  choice: Maintenir la formulation « la prière de ce lieu »
  alternative: Préciser « la prière faite dans ce lieu » ou « la prière venant de ce lieu »
  rationale: La construction hébraïque ne précise pas explicitement si la prière est offerte dans ce lieu, orientée vers lui ou issue de lui. Le texte principal préserve donc cette indétermination, tandis que la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Le tutoiement correspond à l’adresse personnelle à Dieu et s’accorde avec les suffixes hébreux de deuxième personne du singulier. La syntaxe conserve le parallélisme des yeux et des oreilles ainsi que le ton de supplication.
