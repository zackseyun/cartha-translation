  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: fr
  text: toute prière, toute supplication qui sera faite par quiconque ou par tout ton peuple Israël, chacun connaissant son affliction et sa douleur, et étendant ses mains vers cette maison —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: toute prière, toute supplication
  rationale: La répétition de כָּל est conservée. « Supplication » exprime une demande pressante de faveur ou de compassion et demeure naturelle dans un registre biblique moderne.
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: que fera une personne quelconque ou tout ton peuple, Israël
  rationale: Dans ce contexte, היה introduit la prière qui surgit ou est formulée; « fera » rend idiomatiquement l'acte de prier sans ajouter l'idée d'une prière exaucée. Le ל rattache la prière à l'individu ou au peuple, et « ou » fait ressortir l'alternative distributive.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: chacun connaissant
  rationale: 'אִישׁ a ici une valeur distributive: chaque personne connaît personnellement ce qui l''atteint.'
- source_word: נִגְעוֹ
  choice: son propre mal
  rationale: נֶגַע peut désigner une plaie, un coup ou une affliction. « Mal » garde ici une portée assez large, tandis que « propre » explicite le suffixe personnel et le caractère individuellement reconnu de l'épreuve.
- source_word: וּמַכְאֹבוֹ
  choice: et sa propre douleur
  rationale: מַכְאוֹב désigne la douleur ou la souffrance. « Douleur » préserve sa dimension vécue et reste distinct du terme précédent.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: et étendant les mains
  rationale: L'expression décrit le geste traditionnel de la prière. En français, « étendre les mains » est naturel et restitue le sens de déployer les paumes.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: vers cette maison
  rationale: אֶל marque ici l'orientation de la prière en direction du temple; « vers » exprime clairement cette direction.
theological_decisions:
- issue: Valeur générique de הָאָדָם
  choice: une personne quelconque
  alternative: tout homme
  rationale: אָדָם désigne ici n'importe quel membre du peuple, sans opposition entre hommes et femmes. « Personne » rend naturellement en français moderne cette portée générique sans modifier le référent.
- issue: Rapport entre l'individu et l'ensemble d'Israël
  choice: ou tout ton peuple, Israël
  alternative: et tout ton peuple Israël
  rationale: Le texte envisage la prière d'un individu comme celle de l'ensemble du peuple. « Ou » rend cette distribution contextuelle, tandis que l'apposition « Israël » identifie clairement le peuple sans transformer Israël en vocatif.
- issue: Portée de נֶגַע
  choice: mal
  alternative: plaie
  rationale: Le terme peut évoquer une plaie précise, mais son association à la douleur personnelle autorise ici un sens plus général. La traduction conserve cette amplitude plutôt que de limiter le verset à une maladie ou à un fléau déterminé.
translation_notes:
  register: Français international moderne, digne et fluide. La structure cumulative de l'hébreu est conservée, ainsi que le tiret final signalant que la phrase et sa conséquence se poursuivent au verset suivant.
