  naturalness: La révision emploie une syntaxe française plus fluide tout en conservant la construction cumulative et le tiret qui relie la proposition à la suite au verset 30.
  terminology: « Prière » et « supplication » maintiennent la répétition et la nuance d'une demande pressante. « Quiconque » rend la portée générique de הָאָדָם sans introduire de restriction de genre. « Ton peuple Israël » correspond à l'expression hébraïque sans ponctuation appositive susceptible de brouiller la relation syntaxique.
