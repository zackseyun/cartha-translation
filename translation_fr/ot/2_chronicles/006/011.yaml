id: 2CH.6.11
reference: 2 Chronicles 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: fr
  text: J’y ai placé l’arche, où se trouve l’alliance de Yahweh, qu’il a conclue avec les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les descendants d’Israël » ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression collective qui désigne le peuple d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים שָׁם
  choice: J’y ai placé
  rationale: Le passé composé exprime une action accomplie dont le résultat demeure présent. Le pronom adverbial « y » rend naturellement שָׁם, « là », en renvoyant au lieu mentionné auparavant.
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: « Arche » est le terme français consacré et exact dans ce contexte cultuel pour le coffre de l’alliance.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: où se trouve l’alliance de Yahweh
  rationale: Cette formulation conserve l’affirmation selon laquelle l’alliance se trouve dans l’arche, probablement par référence à son témoignage matériel, sans expliciter davantage que l’hébreu.
- source_word: אֲשֶׁר כָּרַת
  choice: qu’il a conclue
  rationale: L’expression hébraïque littérale « couper une alliance » correspond en français actuel à « conclure une alliance ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation reproduit directement l’expression hébraïque masculine plurielle tout en gardant son caractère de nom collectif traditionnel du peuple d’Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: La translittération « Yahweh » conserve le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les descendants d’Israël ; les Israélites
  rationale: Le choix maintient la forme masculine de l’hébreu. Dans ce contexte d’alliance, l’expression désigne collectivement le peuple d’Israël, et non uniquement les hommes.
- issue: L’alliance située dans l’arche
  choice: où se trouve l’alliance de Yahweh
  alternative: qui contient l’alliance de Yahweh
  rationale: La traduction préserve la formulation du texte et sa possible métonymie, sans préciser de façon interprétative que « l’alliance » désigne les tables qui en portent le témoignage.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide sans effacer les formulations théologiquement significatives de l’hébreu.
