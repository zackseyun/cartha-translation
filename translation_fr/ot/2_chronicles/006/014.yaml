  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : l’incomparabilité de Yahweh, le mérisme « dans le ciel ni sur la terre », l’alliance, le ḥésed envers les serviteurs et la marche entière devant Dieu. « Yahweh », « Dieu d’Israël », « alliance », « serviteurs » et « de tout leur cœur » sont bien rendus.'
