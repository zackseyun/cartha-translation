source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: fr
  text: 'Il dit : « Yahweh, Dieu d’Israël, il n’y a pas de Dieu comme toi dans le ciel ni sur la terre, toi qui gardes l’alliance et qui manifestes un amour fidèle[a] envers tes serviteurs qui marchent devant toi de tout leur cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité ».
    reason: חֶסֶד peut désigner la loyauté ou la fidélité constante, particulièrement lorsqu’il est associé à l’alliance.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Le wayyiqtol poursuit le récit et introduit la prière de Salomon. Le passé simple convient au registre narratif français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Cette construction désigne Yahweh comme le Dieu d’Israël dans le cadre de l’alliance.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: il n’y a pas de Dieu comme toi
  rationale: Cette formulation naturelle conserve l’affirmation hébraïque de l’incomparabilité de Yahweh sans transformer explicitement אֱלֹהִים en pluriel.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: dans le ciel ni sur la terre
  rationale: Après une proposition négative, « ni » exprime naturellement en français la totalité visée par ce mérisme.
- source_word: שֹׁמֵר
  choice: toi qui gardes
  rationale: Le participe décrit l’action caractéristique de Dieu. La reprise par « toi qui » clarifie le lien syntaxique en français.
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: « Alliance » est l’équivalent français établi de בְּרִית et conserve sa portée relationnelle et théologique.
- source_word: וְהַחֶסֶד
  choice: et l’amour fidèle
  rationale: חֶסֶד associe ici bienveillance, constance et loyauté dans le cadre de l’alliance. « Amour fidèle » rend ces dimensions sans réduire le terme à la seule miséricorde.
- source_word: לַעֲבָדֶיךָ
  choice: envers tes serviteurs
  rationale: La préposition désigne les bénéficiaires ou destinataires de la fidélité divine ; « envers » est idiomatique avec « amour fidèle ».
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: qui marchent devant toi
  rationale: La traduction conserve la métaphore hébraïque d’une conduite vécue dans la présence de Dieu.
- source_word: בְּכָל לִבָּם
  choice: de tout leur cœur
  rationale: Cette expression française naturelle rend l’engagement entier et sans partage exprimé par l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom propre divin. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Nuance de חֶסֶד associé à l’alliance
  choice: l’amour fidèle
  alternative: la fidélité
  rationale: « Amour fidèle » maintient ensemble la bienveillance et la loyauté durable du terme. La note signale la traduction « fidélité », particulièrement plausible dans ce contexte d’alliance.
- issue: Portée de אֱלֹהִים dans l’affirmation d’incomparabilité
  choice: il n’y a pas de Dieu comme toi
  alternative: il n’y en a aucun comme toi parmi les dieux
  rationale: Le singulier français exprime naturellement l’incomparabilité divine et suit la lecture contextuelle, tout en évitant de développer dans le texte une référence explicite à d’autres dieux que l’hébreu peut grammaticalement permettre.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve les expressions bibliques structurantes « garder l’alliance » et « marcher devant toi », tout en employant une syntaxe française naturelle.
