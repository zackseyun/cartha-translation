    issue: « Accorde à l’étranger tout ce pour quoi il fait appel à toi » surinterprète ועשית.
    rationale: עשה signifie littéralement « faire/agir » et ne précise pas que Dieu doive nécessairement « accorder » chaque demande. « Agis conformément à... » conserve la largeur du verbe tout en restant idiomatique dans le contexte de prière.
  - severity: low
    issue: Les futurs « connaîtront », « te craindront » et « sauront » affaiblissent le rapport explicite de finalité.
    rationale: למען, suivi des infinitifs לדעת וליראה, exprime le but. « Afin que ... connaissent, te craignent ... et sachent » le rend clairement en français.
