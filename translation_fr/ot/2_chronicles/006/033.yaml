source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: fr
  text: Alors, entends depuis le ciel, depuis le lieu où tu demeures, et agis conformément à tout ce pour quoi l’étranger fera appel à toi, afin que tous les peuples de la terre connaissent ton nom, te craignent comme ton peuple Israël, et sachent que ton nom est invoqué sur cette maison que j’ai construite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « cette maison porte ton nom ». Littéralement : « ton nom est invoqué sur cette maison ».'
    reason: L’idiome hébreu peut exprimer que la maison est placée sous le nom, l’autorité ou l’appartenance de Dieu ; la traduction littérale en conserve l’ambiguïté.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: écoute
  rationale: Dans un contexte de prière, שׁמע exprime une écoute attentive qui appelle une réponse. « Écoute » est naturel en français et convient à l’impératif de supplication.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: Le pluriel morphologique hébreu se rend naturellement par le collectif singulier « le ciel » en français lorsqu’il désigne la demeure divine.
- source_word: מִמְּכוֹן שִׁבְתֶּךָ
  choice: depuis le lieu où tu demeures
  rationale: מכון désigne un lieu établi. Cette formulation actuelle conserve le sens locatif et le lien avec la demeure de Dieu sans lourdeur.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: accorde à l’étranger tout ce pour quoi il fait appel à toi
  rationale: Le sens large de עשה est ici celui d’une action divine répondant à une requête. « Accorde » explicite naturellement ce rapport en français, tandis que « fait appel à toi » préserve la valeur de קרא אל.
- source_word: הַנָּכְרִי
  choice: l’étranger
  rationale: נכרי désigne une personne appartenant à un autre peuple, par opposition à Israël. « L’étranger » est le terme français moderne approprié.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: tous les peuples de la terre
  rationale: Le contexte est universel; הארץ désigne donc ici la terre entière, et le pluriel « peuples » maintient la diversité des nations.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: te craindront
  rationale: ירא appliqué à Dieu associe crainte et révérence. « Craindre » conserve la force et l’expression biblique sans l’atténuer par une paraphrase.
- source_word: כְּעַמְּךָ יִשְׂרָאֵל
  choice: comme ton peuple Israël
  rationale: Le français permet de conserver directement la comparaison elliptique de l’hébreu sans ajouter un verbe.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: que ton nom est invoqué sur cette maison
  rationale: Cette traduction garde l’idiome hébreu et son ambiguïté entre invocation, appartenance et désignation, plutôt que de le réduire dans le texte principal à l’idée que la maison porte le nom de Dieu.
theological_decisions:
- issue: Le rapport entre la demeure céleste de Dieu et le temple terrestre
  choice: Conserver « depuis le ciel, depuis le lieu où tu demeures » et parler séparément de « cette maison »
  alternative: Paraphraser par « depuis ta présence céleste »
  rationale: La formulation maintient la distinction interne au verset entre la demeure céleste de Dieu et la maison terrestre associée à son nom, sans imposer une explication systématique.
- issue: La crainte de Dieu parmi les peuples
  choice: Employer « te craindront »
  alternative: Employer « te révéreront »
  rationale: « Craindre » préserve à la fois la portée lexicale de ירא et la tension biblique entre crainte et révérence.
- issue: L’expression du nom divin sur la maison
  choice: Conserver dans le texte « ton nom est invoqué sur cette maison »
  alternative: Traduire directement « cette maison porte ton nom »
  rationale: La formulation littérale préserve la richesse de l’idiome hébreu; l’équivalent interprétatif est indiqué en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de prière reste solennelle sans archaïsmes. « Accorde » évite la tournure peu naturelle « fais selon tout ce que… » tout en exprimant l’action divine demandée dans ce contexte.
