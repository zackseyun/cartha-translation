source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: fr
  text: Tu as tenu envers ton serviteur David, mon père, ce que tu lui avais dit[a] ; tu as parlé de ta bouche, et de ta main tu l’as accompli[b], comme on le voit aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que tu lui avais promis ». L’hébreu dit littéralement « ce que tu lui avais dit » ; l’idée de promesse ressort du contexte d’accomplissement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « de ta bouche… et de ta main » : cette expression hébraïque met en parallèle la parole de Dieu et l’action par laquelle il la réalise.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: tu as tenu
  rationale: Dans ce contexte de parole promise puis accomplie, שׁמר exprime la fidélité à un engagement. En français, « tenir ce que l’on a dit » est naturel et conserve le lien avec la proposition suivante.
- source_word: לְעַבְדְּךָ
  choice: envers ton serviteur
  rationale: Avec « tenir » au sens de respecter un engagement, ל désigne ici la personne envers qui Dieu s’est engagé. « Serviteur » convient au registre de la prière royale.
- source_word: דָּוִיד אָבִי
  choice: David, mon père
  rationale: Cette formulation respecte l’ordre hébreu tout en employant une apposition naturelle en français.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: ce que tu lui avais dit
  rationale: Le texte parle littéralement de ce que Dieu avait dit à David. Le plus-que-parfait marque naturellement en français l’antériorité de cette parole par rapport à son accomplissement, sans expliciter dans le corps du texte qu’il s’agissait d’une promesse.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: tu l’avais annoncé de ta bouche
  rationale: « Annoncé » évite la répétition maladroite de « dit » tout en conservant l’acte de parole; « de ta bouche » maintient l’image concrète et le parallélisme avec la main.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: et de ta main tu l’as accompli
  rationale: מלא signifie ici mener à son plein accomplissement. « De ta main » préserve l’image hébraïque de l’action efficace de Dieu en parallèle avec sa bouche.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: L’idiome renvoie à la réalité présente qui atteste l’accomplissement. Cette formulation actuelle en exprime clairement la portée sans lourdeur littérale.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu (« bouche » et « main »)
  choice: Conserver explicitement les images de la bouche et de la main
  alternative: 'Traduire de manière abstraite : « tu l’avais déclaré et tu l’as réalisé »'
  rationale: Le verset oppose intentionnellement la parole prononcée et l’action qui l’accomplit. Garder les deux images préserve sa rhétorique sans aller au-delà de l’anthropomorphisme propre au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du parallélisme hébreu, tandis que les temps verbaux et l’expression finale sont adaptés à l’usage français naturel.
