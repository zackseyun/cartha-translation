- from: alors, écoute depuis le ciel leur prière et leur supplication, et défends leur cause.[a]
  to: alors, écoute du haut du ciel leur prière et leur supplication, et fais droit à leur cause[a].
  rationale: La révision améliore la précision de la dernière proposition en choisissant l’expression juridique française « fais droit à leur cause », qui correspond naturellement à l’idée hébraïque de faire leur droit ou leur jugement. Elle améliore également l’idiomaticité de la formule céleste et corrige le placement de l’appel de note. Les autres termes sont conservés.
