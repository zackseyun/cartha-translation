  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: fr
  text: alors, écoute du haut du ciel leur prière et leur supplication, et fais droit à leur cause[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « fais leur jugement » ; ou : « rends-leur justice », « défends leur cause ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: alors, écoute
  rationale: Le qal accompli à la 2e personne du masculin singulier a ici, dans la prière de Salomon, une valeur de requête adressée à Dieu. « Alors » exprime naturellement le lien avec la situation conditionnelle décrite auparavant.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: Bien que שָׁמַיִם ait une forme plurielle en hébreu, le singulier « le ciel » est l’équivalent idiomatique courant en français dans cette formule de prière.
- source_word: תְּפִלָּתָם
  choice: leur prière
  rationale: תְּפִלָּה est le terme général désignant la prière; le singulier muni du suffixe pluriel se rend naturellement par « leur prière ».
- source_word: תְּחִנָּתָם
  choice: leur supplication
  rationale: תְּחִנָּה désigne une demande instante de grâce ou de faveur. « Supplication » conserve cette intensité dans un registre digne et reste intelligible en français moderne.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: et défends leur cause
  rationale: L’expression signifie littéralement « fais leur jugement/justice ». Dans ce contexte judiciaire, « défends leur cause » indique que Dieu intervient en leur faveur sans effacer la portée légale de מִשְׁפָּט.
theological_decisions:
- issue: La réponse judiciaire de Dieu à la prière
  choice: défends leur cause
  alternative: rends-leur justice; fais droit à leur cause; exécute leur jugement
  rationale: מִשְׁפָּט peut désigner le jugement, la justice, le droit ou la cause judiciaire. La formulation retenue préserve l’idée que Dieu agit en faveur de son peuple, tout en laissant la note signaler la littéralité et les autres nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. « Supplication » convient au registre solennel d’une prière publique; « défends leur cause » conserve l’image judiciaire sans employer une tournure française artificielle.
