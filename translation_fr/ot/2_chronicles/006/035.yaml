review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la requête est bien rendu : entendre la prière depuis le ciel et intervenir judiciairement en faveur des suppliants. Toutefois, « défends leur cause » peut suggérer plus précisément le rôle d’un avocat ou d’un défenseur. « Fais droit à leur cause » reproduit mieux l’idiome judiciaire de וְעָשִׂיתָ מִשְׁפָּטָם, tout en restant naturel en français.'
  naturalness: « Écoute du haut du ciel » est une formulation française plus idiomatique et solennelle que « écoute depuis le ciel » dans une prière adressée à Dieu. « Fais droit à leur cause » est une expression juridique française claire, digne et actuelle. L’appel de note est placé immédiatement après le segment annoté, avant le point final.
  terminology: « Prière » et « supplication » rendent adéquatement תְּפִלָּה et תְּחִנָּה. « Fais droit à leur cause » conserve la portée de משפט — jugement, droit ou justice — sans imposer une interprétation doctrinale ni réduire le terme à un seul équivalent.
  issues:
  - severity: medium
    issue: « défends leur cause » est légèrement trop spécifique.
    rationale: Cette expression peut évoquer la défense juridique exercée par un représentant. Le verbe hébreu « faire » avec משפט demande plutôt que Dieu rende ou accomplisse le droit/jugement qui leur est dû. « Fais droit à leur cause » conserve mieux cette nuance.
  - severity: low
    issue: Formulation spatiale et position de l’appel de note.
    rationale: « Du haut du ciel » est plus naturel dans ce registre. En typographie biblique française, l’appel de note doit suivre le mot ou groupe concerné avant la ponctuation finale.
  revised_text: alors, écoute du haut du ciel leur prière et leur supplication, et fais droit à leur cause[a].
  revised_footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « fais leur jugement » ; ou : « rends-leur justice », « défends leur cause ».'
    reason: lexical_alternative
  revision_rationale: La révision améliore la précision de la dernière proposition en choisissant l’expression juridique française « fais droit à leur cause », qui correspond naturellement à l’idée hébraïque de faire leur droit ou leur jugement. Elle améliore également l’idiomaticité de la formule céleste et corrige le placement de l’appel de note. Les autres termes sont conservés.
