  to: Alors, écoute depuis le ciel, le lieu où tu demeures ; pardonne et rends à chacun selon toutes ses voies, toi qui connais son cœur — car toi seul connais le cœur des êtres humains[a].
  rationale: La révision conserve le sens judiciaire de « rends », la formulation priante et le vocabulaire biblique de « cœur », tout en rétablissant la fonction relative de « dont tu connais le cœur » par « toi qui connais son cœur ». Elle conserve également le pluriel imagé de « voies » et une note littérale non doctrinale.
