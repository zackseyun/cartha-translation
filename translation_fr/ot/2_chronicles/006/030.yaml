  verdict: revise
  source_fidelity: La demande adressée à Dieu, l’écoute depuis le ciel, le pardon, la rétribution selon les voies de chacun et la connaissance divine exclusive du cœur humain sont correctement rendus. Toutefois, « puisque tu connais son cœur » transforme la relative hébraïque (« dont tu connais le cœur ») en une proposition causale et affaiblit son rattachement direct à « chacun ».
  naturalness: Le français est globalement moderne et digne, mais « alors, toi, écoute » est inutilement heurté. Une apposition plus fluide pour le ciel comme lieu de la demeure divine, ainsi qu’une relative explicite, améliorent la lecture.
  terminology: « Cœur », « rends à chacun » et « êtres humains » conviennent au contexte. « Toutes ses voies » conserve mieux le pluriel et l’image de כָּל־דְּרָכָיו que le singulier abstrait « toute sa conduite ». La note explique adéquatement la portée collective de « fils de l’homme ».
