  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: fr
  text: Alors, écoute depuis le ciel, le lieu où tu demeures ; pardonne et rends à chacun selon toutes ses voies, toi qui connais son cœur — car toi seul connais le cœur des êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’homme » ; cette expression hébraïque désigne l’ensemble des êtres humains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: écoute
  rationale: Dans le contexte de la prière de Salomon, l’imparfait hébreu a une valeur de demande. L’impératif français exprime naturellement cette supplication.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: Le pluriel morphologique hébreu se rend idiomatiquement au singulier en français dans ce contexte.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: le lieu de ta demeure
  rationale: Cette formulation conserve l’idée d’un lieu établi où Dieu réside et s’insère naturellement en apposition à « le ciel ».
- source_word: וְסָלַחְתָּ
  choice: Pardonne
  rationale: Le parfait avec waw poursuit ici la série des actions demandées à Dieu; l’impératif rend clairement cette valeur de pétition.
- source_word: וְנָתַתָּה לָאִישׁ
  choice: rends à chacun
  rationale: Le verbe נתן signifie littéralement « donner », mais, avec « selon sa conduite », il prend ici un sens judiciaire. « Rends à chacun » transmet ce sens sans surinterprétation.
- source_word: כְּכָל דְּרָכָיו
  choice: selon toute sa conduite
  rationale: Les « voies » désignent idiomatiquement la manière de vivre. « Conduite » est clair en français moderne et garde la portée globale de כָּל.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: puisque tu connais son cœur
  rationale: La proposition relie la juste rétribution à la connaissance divine du cœur. « Puisque » rend naturellement cette relation contextuelle, tout en conservant « cœur ».
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: car toi seul connais
  rationale: La tournure préserve à la fois la valeur explicative de כִּי et l’exclusivité fortement marquée par לְבַדְּךָ.
- source_word: לְבָב
  choice: cœur
  rationale: Le terme désigne l’être intérieur, notamment la pensée et la volonté. « Cœur » demeure l’équivalent français biblique naturel et théologiquement non réducteur.
- source_word: בְּנֵי הָאָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque signifie littéralement « les fils de l’homme/de l’humanité », mais désigne collectivement tous les humains. La traduction principale exprime clairement cette portée; la note conserve la forme littérale.
theological_decisions:
- issue: Portée anthropologique de בְּנֵי הָאָדָם
  choice: les êtres humains
  alternative: les fils de l’homme
  rationale: Dans cette expression collective, אָדָם renvoie à l’humanité entière. « Les êtres humains » évite en français une possible confusion avec le titre singulier « Fils de l’homme », tandis que la note signale la forme masculine représentative de l’hébreu.
- issue: Connaissance divine du cœur
  choice: car toi seul connais le cœur
  alternative: car toi seul as connu le cœur
  rationale: Le parfait hébreu exprime ici un fait établi et permanent, non une connaissance limitée au passé. Le présent français préserve l’affirmation que Dieu seul connaît l’intériorité humaine.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse directe à Dieu. Le tiret maintient l’emphase de la justification finale, et le vocabulaire évite aussi bien l’archaïsme que l’explication doctrinale ajoutée.
