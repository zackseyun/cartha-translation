  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: fr
  text: De même, en ce qui concerne l’étranger qui ne fait pas partie de ton peuple Israël et qui vient d’un pays lointain à cause de ton grand nom, de ta main puissante et de ton bras étendu, lorsqu’ils viendront prier vers cette maison[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu parle d’abord de « l’étranger » au singulier, puis passe au pluriel : « ils viendront et prieront ». L’étranger est vraisemblablement présenté comme un cas représentatif.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: l’étranger
  rationale: Le terme désigne ici une personne appartenant à un autre peuple qu’Israël. « L’étranger » exprime clairement cette distinction sans suggérer simplement une personne inconnue.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: qui ne fait pas partie de ton peuple Israël
  rationale: Cette formulation française naturelle conserve l’exclusion explicite de l’étranger du peuple d’Israël et la désignation d’Israël comme peuple de Dieu.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: mais qui vient d’un pays lointain
  rationale: « Mais » rend naturellement la relation avec la proposition négative précédente; « pays lointain » traduit clairement אֶרֶץ רְחוֹקָה.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: à cause de ton grand nom
  rationale: Dans ce contexte, לְמַעַן indique le motif de la venue. « Grand nom » maintient l’idiome biblique qui évoque la renommée et l’identité révélée de Dieu.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: de ta main puissante
  rationale: La formulation conserve l’image concrète de l’action souveraine de Dieu et s’accorde naturellement avec « bras étendu ».
- source_word: וּזְרֹעֲךָ הַנְּטוּיָה
  choice: de ton bras étendu
  rationale: Cette traduction fidèle préserve l’anthropomorphisme biblique traditionnel qui exprime la puissance divine en action.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: lorsqu’il viendra prier
  rationale: Le français reprend au singulier le sujet représentatif « l’étranger » afin d’éviter une rupture grammaticale obscure; une note signale que l’hébreu passe ici au pluriel.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: en direction de cette maison
  rationale: Dans le contexte de la prière de Salomon, אֶל exprime l’orientation de la prière vers le sanctuaire. « Maison » conserve le terme hébreu et sa portée théologique.
theological_decisions:
- issue: Passage du singulier au pluriel dans le texte hébreu
  choice: Employer un singulier représentatif dans le texte français et signaler le pluriel hébreu en note
  alternative: l’étranger… lorsqu’ils viendront prier
  rationale: L’hébreu présente d’abord l’étranger au singulier, puis emploie deux verbes au pluriel, probablement pour généraliser ce cas représentatif. Le singulier donne une phrase française claire sans cacher la variation du texte source, laquelle est explicitement conservée en note.
- issue: Langage anthropomorphique décrivant la puissance de Dieu
  choice: Conserver « ta main puissante et ton bras étendu »
  alternative: ta grande puissance
  rationale: Les images concrètes appartiennent au langage biblique de l’action divine, notamment à celui de l’Exode. Les réduire à une abstraction ferait perdre cette résonance théologique.
- issue: Orientation de la prière par rapport à la maison
  choice: en direction de cette maison
  alternative: vers cette maison; à cette maison
  rationale: Le contexte indique une prière orientée vers le temple plutôt qu’une prière adressée au bâtiment. La traduction conserve ainsi la distinction entre Dieu, destinataire de la prière, et sa maison, point d’orientation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure suspendue du verset, qui se poursuit au verset suivant, ainsi que les images bibliques de la main et du bras de Dieu. Les marqueurs de note sont placés sur les éléments qu’ils expliquent.
