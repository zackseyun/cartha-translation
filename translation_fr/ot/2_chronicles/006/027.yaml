  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: fr
  text: Alors, écoute depuis le ciel[a] et pardonne le péché de tes serviteurs et de ton peuple Israël, lorsque tu leur enseigneras[b] le bon chemin qu’ils doivent suivre. Fais tomber la pluie sur ton pays, que tu as donné en héritage à ton peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « écoute dans le ciel ». L’hébreu dit littéralement « écoute les cieux/le ciel », formule qui désigne l’écoute de Dieu depuis sa demeure céleste.
    reason: lexical_alternative
  - marker: b
    text: Ou « car tu leur enseignes » ; le mot hébreu rendu par « lorsque » peut aussi exprimer la cause.
    reason: ambiguity
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: écoute dans le ciel
  rationale: L’hébreu emploie « les cieux/le ciel » sans préposition explicite. « Dans le ciel » conserve la localisation de l’écoute divine tout en restant intelligible; la note signale l’autre compréhension idiomatique possible.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: et pardonne le péché
  rationale: חַטָּאת désigne ici le péché ou la faute. Cette formulation directe convient au contexte de prière.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: de tes serviteurs et de ton peuple Israël
  rationale: « Serviteurs » rend עֲבָדִים dans le cadre de la relation entre Dieu et ceux qui lui appartiennent, sans accentuer artificiellement le statut servile.
- source_word: כִּי תוֹרֵם
  choice: lorsque tu leur enseigneras
  rationale: כִּי peut introduire ici une circonstance temporelle, tandis que l’imparfait תוֹרֵם se prête dans cette prière à une action attendue de Dieu. Une note préserve la lecture causale possible.
- source_word: אֶל הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: le bon chemin qu’ils doivent suivre
  rationale: Le mouvement « vers le chemin » est naturellement exprimé en français avec « enseigner le chemin ». « Suivre » communique clairement la métaphore hébraïque de la marche comme conduite.
- source_word: וְנָתַתָּה מָטָר עַל אַרְצְךָ
  choice: Donne de la pluie à ton pays
  rationale: « Donne » conserve le sens ordinaire de נָתַן. « À ton pays » est une formulation française naturelle qui maintient le possessif explicite.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: que tu as donné en héritage à ton peuple
  rationale: « En héritage » rend la portée foncière et relationnelle de נַחֲלָה sans ajouter d’interprétation confessionnelle.
theological_decisions:
- issue: Rapport entre le pardon, l’enseignement divin et le retour de la pluie
  choice: 'La proposition introduite par כִּי est rendue temporellement: « lorsque tu leur enseigneras ».'
  alternative: « car tu leur enseignes » ou « puisque tu leur enseignes »
  rationale: La valeur temporelle convient à l’enchaînement de la requête, mais la valeur causale de כִּי demeure réellement possible et est donc signalée en note plutôt que supprimée.
- issue: Lieu ou provenance de l’écoute divine
  choice: « écoute dans le ciel »
  alternative: « écoute depuis le ciel »
  rationale: Le texte hébreu nomme « le ciel/les cieux » sans préposition. Le choix principal conserve l’idée de la demeure céleste où Dieu entend; la variante idiomatique de provenance est donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. « Bon chemin » et « héritage » maintiennent les images bibliques sans archaïsme; la ponctuation divise la longue phrase pour en faciliter la lecture.
