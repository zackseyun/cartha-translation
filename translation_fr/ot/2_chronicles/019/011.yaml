source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: fr
  text: 'Et voici : Amaria, le prêtre en chef[a], a autorité sur vous pour toute affaire concernant Yahweh, et Zebadia, fils d’Ismaël, chef de la maison de Juda, pour toute affaire concernant le roi. Les Lévites sont à votre disposition comme officiers. Soyez forts et agissez, et que Yahweh soit avec celui qui est bon[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand prêtre ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec le bon » ; l’expression peut aussi être rendue par « avec les bons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la fonction de mise en relief et de transition du marqueur discursif hébreu dans une formulation française naturelle et solennelle.
- source_word: כֹהֵן הָרֹאשׁ
  choice: le prêtre en chef
  rationale: Rend littéralement l’idée du prêtre placé à la tête, sans imposer le titre institutionnel plus technique de « grand prêtre », qui demeure possible.
- source_word: עֲלֵיכֶם
  choice: aura autorité sur vous
  rationale: Exprime la responsabilité de supervision dans ce cadre judiciaire. Le futur français s’accorde avec les fonctions assignées pour l’exercice de la charge.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: pour toute affaire concernant Yahweh
  rationale: Préserve la valeur de référence de לְ et le sens large de דָּבָר, sans limiter indûment le propos aux seuls litiges.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: chef de la maison de Juda
  rationale: « Chef » rend naturellement נָגִיד dans ce contexte administratif, tandis que « maison de Juda » conserve l’expression hébraïque.
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: pour toute affaire concernant le roi
  rationale: Maintient le parallélisme avec les affaires concernant Yahweh et distingue clairement les deux domaines de responsabilité.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: Les Lévites seront à votre service comme officiers
  rationale: Rend la proposition nominale de façon idiomatique. « À votre service » explicite la présence fonctionnelle exprimée par לִפְנֵיכֶם, et « officiers » conserve le rôle administratif de שֹׁטְרִים.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Soyez forts et agissez
  rationale: Reproduit l’exhortation brève et énergique, עשה désignant ici l’accomplissement concret de la mission confiée.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: et que Yahweh soit avec celui qui fait le bien
  rationale: Rend la valeur jussive de וִיהִי. Le substantif adjectival הַטּוֹב peut désigner « le bon », « celui qui est bon » ou, dans ce contexte d’action judiciaire, « celui qui fait le bien ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Statut exprimé par כֹהֵן הָרֹאשׁ
  choice: prêtre en chef
  alternative: grand prêtre
  rationale: L’hébreu signifie littéralement le prêtre de tête ou principal. « Prêtre en chef » préserve ce sens sans décider que l’expression constitue nécessairement le titre technique de grand prêtre.
- issue: Référent de הַטּוֹב dans la bénédiction finale
  choice: celui qui fait le bien
  alternative: le bon / celui qui est bon
  rationale: La forme hébraïque reste concise et peut être personnelle ou générique. Dans l’exhortation à agir, la formulation choisie est naturelle en français, tandis qu’une note conserve l’autre compréhension possible.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase conserve le parallélisme entre les affaires concernant Yahweh et celles concernant le roi. Les noms propres suivent les formes françaises usuelles : Amaria, Zebadia et Ismaël.'
