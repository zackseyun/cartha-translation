  to: 'Et voici : Amaria, le prêtre en chef[a], a autorité sur vous pour toute affaire concernant Yahweh, et Zebadia, fils d’Ismaël, chef de la maison de Juda, pour toute affaire concernant le roi. Les Lévites sont à votre disposition comme officiers. Soyez forts et agissez, et que Yahweh soit avec celui qui est bon[b] !'
