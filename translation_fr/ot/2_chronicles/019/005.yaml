  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: fr
  text: Il nomma des juges dans le pays[a], dans toutes les villes fortifiées de Juda, ville par ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans tout le pays ».'
    reason: Alternative lexicale possible donnant à la préposition une portée distributive.
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il établit
  rationale: Le hifil de עמד désigne ici l’établissement de personnes dans une fonction officielle. « Établit » exprime naturellement cette nomination administrative tout en restant proche de l’image verbale hébraïque.
- source_word: שֹׁפְטִים
  choice: des juges
  rationale: Le nom désigne clairement des responsables chargés de rendre la justice; « juges » est le terme français courant et précis.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Cette traduction conserve la valeur locative de la préposition. La possibilité d’un sens distributif, « dans tout le pays », est signalée en note.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: dans toutes les villes de Juda
  rationale: La formulation reproduit l’étendue totale exprimée par כָל et conserve clairement Juda comme désignation territoriale.
- source_word: הַבְּצֻרוֹת
  choice: fortifiées
  rationale: L’adjectif décrit des villes protégées par des ouvrages défensifs; « villes fortifiées » est précis et idiomatique en français.
- source_word: לְעִיר וָעִיר
  choice: ville par ville
  rationale: Cette tournure restitue brièvement l’idiome distributif hébreu et souligne que les juges furent établis dans chaque ville individuellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure répétitive « dans le pays, dans toutes les villes… ville par ville » est conservée, car elle reflète la progression et l’insistance distributive de l’hébreu.
