source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: fr
  text: Maintenant donc, que la crainte de Yahweh soit sur vous. Veillez à agir, car auprès de Yahweh notre Dieu, il n’y a ni injustice, ni favoritisme[a], ni acceptation d’un pot-de-vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « élévation du visage », expression hébraïque qui désigne le fait de traiter quelqu’un avec favoritisme ou partialité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit l’exhortation qui découle des instructions précédentes; le français naturel n’exige pas de rendre séparément la conjonction.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: que la crainte de Yahweh soit sur vous
  rationale: Le jussif est rendu par une exhortation. « Crainte » conserve l’idée biblique de respect profond mêlé de révérence sans la réduire à la terreur.
- source_word: שִׁמְרוּ
  choice: Soyez vigilants
  rationale: Dans ce contexte judiciaire, l’impératif appelle à une attention scrupuleuse dans l’exercice de la fonction.
- source_word: וַעֲשׂוּ
  choice: et agissez
  rationale: Rend le verbe général « faire » comme un appel concret à mettre les instructions en pratique, sans ajouter d’objet absent de l’hébreu.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: car auprès de Yahweh notre Dieu, il n’y a
  rationale: « Auprès de » préserve la construction avec עִם et exprime ce qui n’a aucune place dans le caractère ou l’action de Dieu.
- source_word: עַוְלָה
  choice: injustice
  rationale: Le contexte des juges donne au terme une portée à la fois morale et judiciaire.
- source_word: מַשֹּׂא פָנִים
  choice: favoritisme
  rationale: Expression idiomatique signifiant accorder un traitement de faveur en fonction de la personne; « favoritisme » est clair en français courant.
- source_word: מִקַּח שֹׁחַד
  choice: acceptation de pot-de-vin
  rationale: La construction nominale désigne le fait de recevoir un présent corrupteur; cette formulation conserve le parallélisme de la série.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme; « Yahweh » en conserve la fonction de nom personnel sans introduire une lecture confessionnelle particulière.
- issue: Sens de פַחַד יְהוָה
  choice: la crainte de Yahweh
  alternative: la terreur de Yahweh; le respect de Yahweh
  rationale: « Crainte » préserve la tension entre révérence, conscience de l’autorité divine et peur de lui déplaire; « respect » serait trop faible et « terreur » trop restrictif.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs restent nets, le parallélisme final est conservé, et le vocabulaire judiciaire demeure accessible.
