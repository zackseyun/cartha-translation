  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: fr
  text: Toutefois, on a trouvé de bonnes choses en toi, car tu as fait disparaître du pays les objets cultuels d’Ashéra[a] et tu as préparé ton cœur[b] à rechercher Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les ashéras » ; il s’agit d’objets cultuels associés à la déesse Ashéra, souvent compris comme des poteaux sacrés.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « disposé ton cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Toutefois
  rationale: Marque avec dignité le contraste concessif avec le reproche précédent, sans lourdeur archaïque.
- source_word: דְּבָרִים טוֹבִים
  choice: de bonnes choses
  rationale: Conserve la portée générale de l’expression hébraïque sans la limiter aux seules actions ou qualités.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: on a trouvé … en toi
  rationale: La tournure française naturelle garde le caractère évaluatif et la valeur passive de la formulation hébraïque.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement les motifs de l’appréciation positive.
- source_word: בִעַרְתָּ
  choice: tu as fait disparaître
  rationale: Exprime une élimination résolue sans préciser indûment si les objets ont été brûlés ou retirés d’une autre manière.
- source_word: הָאֲשֵׁרוֹת
  choice: les objets cultuels d’Ashéra
  rationale: Le pluriel désigne des objets associés au culte d’Ashéra; cette formulation reste intelligible sans imposer une forme matérielle unique.
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Rend naturellement l’idée de leur élimination hors du territoire concerné.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: tu as disposé ton cœur
  rationale: Préserve l’image hébraïque du cœur rendu ferme ou prêt, ainsi que l’idée d’une résolution intérieure.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: à rechercher Dieu
  rationale: Dans les Chroniques, l’expression évoque une orientation fidèle vers Dieu, et non la seule demande d’un renseignement ou d’un oracle.
theological_decisions:
- issue: Nature des אֲשֵׁרוֹת
  choice: objets cultuels d’Ashéra
  alternative: poteaux sacrés d’Ashéra
  rationale: Le terme renvoie à des objets liés au culte d’Ashéra, mais leur forme exacte n’est pas certaine dans chaque occurrence; la traduction retenue évite de trancher au-delà du texte.
- issue: Portée de לִדְרֹשׁ הָאֱלֹהִים
  choice: rechercher Dieu
  alternative: consulter Dieu
  rationale: Le motif récurrent des Chroniques comprend une démarche de fidélité et d’orientation vers Dieu, plus large qu’une simple consultation.
- issue: Image du cœur dans וַהֲכִינוֹתָ לְבָבְךָ
  choice: disposé ton cœur
  alternative: préparé ton cœur
  rationale: La formulation conserve l’anthropologie du texte et l’idée de résolution intérieure sans la réduire à une décision purement intellectuelle.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque « ont été trouvées avec toi ». Les notes sont placées sur les expressions qu’elles expliquent.
