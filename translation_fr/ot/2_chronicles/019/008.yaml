source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: fr
  text: À Jérusalem aussi, Josaphat nomma certains des lévites, des prêtres et des chefs des maisons ancestrales d’Israël pour le jugement de Yahvé[a] et pour les litiges. Puis ils retournèrent à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le jugement relevant de Yahvé », c’est-à-dire pour les affaires régies par sa loi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, selon le texte hébreu reçu : « et ils retournèrent à Jérusalem ». Cette formulation est assez abrupte après la mention initiale de Jérusalem. Certains comprennent plutôt : « et ils siégèrent à Jérusalem » ou « et ils habitèrent à Jérusalem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בִּירוּשָׁלִַם
  choice: À Jérusalem aussi
  rationale: Cette formulation française naturelle conserve à la fois la valeur additive de וְגַם et le complément de lieu placé en tête.
- source_word: הֶעֱמִיד
  choice: nomma
  rationale: Dans ce contexte d’organisation judiciaire, le hiphil de עמד indique que Josaphat établit des personnes dans une fonction; « nomma » exprime clairement cette désignation officielle.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: certains des lévites, des prêtres et des chefs des maisons ancestrales d’Israël
  rationale: « Certains des » rend la valeur partitive de מִן/מֵ. « Maisons ancestrales » transmet la structure familiale et clanique de רָאשֵׁי הָאָבוֹת sans employer l’expression française vieillie « maisons paternelles ».
- source_word: לְמִשְׁפַּט יְהוָה
  choice: pour le jugement de Yahvé
  rationale: 'La formulation conserve l’ambiguïté du génitif hébreu: il peut s’agir du jugement appartenant à Yahvé, exercé en son nom ou régi par sa loi.'
- source_word: וְלָרִיב
  choice: et pour les litiges
  rationale: רִיב désigne ici des différends ou affaires judiciaires; « litiges » est précis, actuel et adapté au contexte.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Puis ils retournèrent à Jérusalem
  rationale: Le texte massorétique vocalisé porte le verbe שוב, « retourner ». « Puis » rend l’enchaînement narratif, tandis qu’une note signale la difficulté contextuelle et l’autre compréhension possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: « Yahvé » représente directement le nom propre divin du texte hébreu et correspond à sa forme usuelle en français biblique, sans le remplacer par un titre.
- issue: Portée de לְמִשְׁפַּט יְהוָה
  choice: le jugement de Yahvé
  alternative: les jugements rendus au nom de Yahvé
  rationale: Le choix principal préserve la latitude grammaticale et théologique de l’hébreu plutôt que de limiter le syntagme aux seules décisions rendues au nom de Dieu.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de la structure judiciaire de l’hébreu, tout en évitant les calques vieillissants. Les marqueurs de notes sont placés après les expressions auxquelles les notes se rapportent.
