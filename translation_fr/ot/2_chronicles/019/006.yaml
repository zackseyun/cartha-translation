  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: fr
  text: 'Il dit aux juges : « Considérez ce que vous faites, car ce n’est pas pour des êtres humains[a] que vous rendez la justice, mais pour Yahvé ; il est avec vous dans les affaires de justice[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie אָדָם au singulier dans un sens générique : « l’homme », « l’être humain » ou « l’humanité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans l’affaire du jugement ». L’expression hébraïque peut désigner l’acte de juger ou, plus largement, les affaires judiciaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: les juges
  rationale: Le participe substantivé désigne ici les personnes établies pour exercer une fonction judiciaire; « les juges » est précis et naturel en français.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: Faites attention à ce que vous faites
  rationale: L’impératif appelle les juges à examiner soigneusement leur conduite. Cette formulation française restitue l’exhortation avec naturel sans l’affaiblir.
- source_word: לְאָדָם
  choice: pour un être humain
  rationale: אָדָם est un singulier générique opposant ici l’être humain à Yahvé. « Un être humain » conserve le singulier et évite de faire croire qu’il s’agit exclusivement d’un homme de sexe masculin.
- source_word: תִּשְׁפְּטוּ
  choice: vous jugez
  rationale: Le verbe שׁפט désigne directement l’exercice du jugement judiciaire; le présent convient à l’exhortation portant sur leur fonction.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition indique que les juges exercent leur charge pour le compte de Yahvé et sous son autorité. « Yahvé » est la forme française courante du nom divin יהוה.
- source_word: וְעִמָּכֶם
  choice: et il est avec vous
  rationale: La phrase nominale hébraïque exprime la présence de Yahvé auprès des juges. Le pronom et le verbe doivent être explicités en français.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: dans l’exercice du jugement
  rationale: דבר désigne ici la matière ou l’affaire concernée, tandis que משפט appartient au domaine du jugement et de la justice. La formulation retenue est naturelle tout en gardant le cadre judiciaire.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Employer le nom propre préserve le contraste entre le service d’un être humain et le service de Dieu, sans remplacer ce nom par un titre.
- issue: Sens de la présence divine dans וְעִמָּכֶם
  choice: Yahvé est avec les juges dans l’exercice de leur charge
  alternative: Yahvé est avec eux pour rendre le jugement
  rationale: L’hébreu affirme sa présence sans préciser davantage s’il accompagne, dirige ou participe au jugement. La traduction conserve cette tension sans définir le mode de son action.
- issue: Portée générique de אָדָם
  choice: un être humain
  alternative: l’homme
  rationale: Le terme est générique et contraste l’autorité humaine avec Yahvé. La formulation choisie garde le singulier sans introduire une restriction au sexe masculin.
translation_notes:
  register: Français international actuel, digne et accessible. Le discours direct reste ferme sans archaïsme. Le point-virgule met en relief l’affirmation finale de la présence divine.
