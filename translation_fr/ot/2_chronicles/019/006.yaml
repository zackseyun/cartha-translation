  rationale: La révision conserve le sens et le registre de l’original, tout en évitant de transformer la dernière expression en une affirmation plus étroite sur l’exercice de la fonction judiciaire. Elle rend aussi plus naturellement en français la valeur générique de אָדָם, explicitée par la note.
