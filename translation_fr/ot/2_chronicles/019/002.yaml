    issue: Interrogation française trop lourde
    rationale: La double construction clivée (« Est-ce ... que tu dois ..., et ... que tu dois ... ? ») ne correspond pas à un usage français moderne fluide. Une question directe conserve mieux la réprimande de l'hébreu.
