    rationale: L'hébreu ne dit pas littéralement « une colère venant de devant Yahweh est sur toi » dans cet ordre ; la note doit présenter l'expression pertinente comme « de devant/de la présence de Yahweh » plutôt que comme une pseudo-citation complète.
