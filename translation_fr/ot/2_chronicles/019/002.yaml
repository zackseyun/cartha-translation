  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: fr
  text: 'Jéhu, fils de Hanani, le voyant, sortit à sa rencontre[a] et dit au roi Josaphat : « Dois-tu venir en aide au méchant et aimer ceux qui détestent Yahweh ? À cause de cela, une colère venue de la présence de Yahweh est contre toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sortit vers sa face/sa présence » ou « sortit devant lui ». L’expression hébraïque signifie ici qu’il sortit à sa rencontre.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de devant Yahweh ». Cette expression peut aussi être rendue par « de la présence de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: sortit à sa rencontre
  rationale: L’expression signifie littéralement aller vers la face ou la présence de quelqu’un, mais elle désigne ici le fait de sortir à sa rencontre. Cette tournure est naturelle en français et conserve le mouvement narratif.
- source_word: הַחֹזֶה
  choice: le voyant
  rationale: חֹזֶה est un titre prophétique précis. « Voyant » en conserve la nuance au lieu de le généraliser en « prophète ».
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Est-ce le méchant que tu dois secourir
  rationale: L’interrogation exprime un reproche. L’adjectif substantivé avec l’article est rendu au singulier, sans identifier explicitement Achab, ce qui conserve à la fois le référent contextuel et la formulation morale du texte.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: et ceux qui détestent Yahweh que tu dois aimer
  rationale: 'Le participe garde sa force verbale : il s’agit de ceux qui détestent Yahweh, plutôt que d’une paraphrase plus interprétative comme « ses ennemis ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וּבָזֹאת
  choice: À cause de cela
  rationale: La formule renvoie à la conduite qui vient d’être reprochée et introduit clairement sa conséquence.
- source_word: עָלֶיךָ קֶּצֶף מִלִּפְנֵי יְהוָה
  choice: la colère de Yahweh est sur toi
  rationale: Cette formulation française naturelle conserve l’image de la colère qui est « sur » Josaphat. La note signale que l’hébreu indique plus littéralement qu’elle vient de devant ou de la présence de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de הָרָשָׁע, « le méchant »
  choice: Conserver la désignation morale au singulier sans nommer Achab
  alternative: les méchants / Achab, le méchant
  rationale: Le contexte vise Achab, mais le texte ne le nomme pas dans cette phrase. Le singulier français respecte la forme hébraïque tout en laissant subsister la portée morale de la réprimande.
- issue: Origine de la colère exprimée par מִלִּפְנֵי יְהוָה
  choice: la colère de Yahweh, avec précision littérale en note
  alternative: la colère venue de la présence de Yahweh
  rationale: Le français courant exprime naturellement la source par « de Yahweh ». La note conserve l’image hébraïque de ce qui vient de devant sa présence sans imposer une formulation obscure au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle de la réprimande est conservée, ainsi que le titre « voyant », le nom Yahweh et l’image de la colère « sur » Josaphat.
