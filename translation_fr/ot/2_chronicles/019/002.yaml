  to: 'Jéhu, fils de Hanani, le voyant, sortit à sa rencontre[a] et dit au roi Josaphat : « Dois-tu venir en aide au méchant et aimer ceux qui détestent Yahweh ? À cause de cela, une colère venue de la présence de Yahweh est contre toi[b]. »'
  rationale: La révision remplace une interrogation française artificielle par une question directe, tout en gardant le singulier moral « le méchant » et le parallèle des deux infinitifs. Elle rend dans le texte principal la provenance de la colère, explicitement exprimée par מִלִּפְנֵי יהוה, et corrige la note afin qu’elle décrive précisément cette expression. Les noms, le titre « voyant », le nom divin « Yahweh » et le sens non paraphrastique du verset sont conservés.
