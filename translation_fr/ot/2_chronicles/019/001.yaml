  text: וַ֠/יָּשָׁב יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֧ה אֶל בֵּית֛/וֹ בְּ/שָׁל֖וֹם לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: fr
  text: Josaphat, roi de Juda, revint en paix chez lui, à Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rentra sain et sauf chez lui, à Jérusalem ». L’expression hébraïque traduite par « en paix » peut aussi souligner qu’il est revenu sans dommage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici le retour. « Revint » est naturel dans un récit et rend clairement le déplacement vers le lieu de résidence du personnage.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Cette forme française traditionnelle et courante du nom biblique est immédiatement reconnaissable.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le groupe construit désigne la fonction royale de Josaphat; l’apposition sans article est naturelle en français.
- source_word: אֶל בֵּיתוֹ
  choice: chez lui
  rationale: Dans ce contexte de retour, « chez lui » rend naturellement la destination personnelle exprimée par « vers sa maison », sans imposer que בַּיִת désigne seulement un bâtiment.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: Cette formulation conserve l’expression hébraïque et sa latitude sémantique, qui peut évoquer à la fois la paix, le bien-être et un retour sans dommage.
- source_word: לִירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Le לְ indique la destination ou l’orientation vers Jérusalem. Après « chez lui », « à Jérusalem » situe naturellement son domicile tout en conservant l’idée du terme du voyage.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Chez lui » évite la raideur de « vers sa maison », tandis que « en paix » préserve l’ambiguïté réelle de l’hébreu; la note explicite le sens possible de retour en sécurité.
