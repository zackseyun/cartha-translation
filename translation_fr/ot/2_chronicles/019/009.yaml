source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: fr
  text: 'Il leur donna cet ordre : « Voici comment vous agirez : dans la crainte de Yahweh[a], avec fidélité[b] et d’un cœur entier[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La crainte de Yahweh » peut aussi être comprise comme « la révérence envers Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec intégrité » ou « fidèlement ».
    reason: lexical_alternative
  - marker: c
    text: Ou « d’un cœur sans partage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: 'Il leur donna cet ordre :'
  rationale: Cette formulation française naturelle rend le verbe צוה, son complément indirect et l’introduction de la parole directe, sans conserver le lourd calque « il leur ordonna en disant ».
- source_word: כֹּה תַעֲשׂוּן
  choice: Voici comment vous agirez
  rationale: כֹּה indique la manière prescrite, et עשה a ici, dans le cadre judiciaire, le sens de se conduire ou d’agir. Le futur français garde la valeur directive de la forme hébraïque.
- source_word: בְּיִרְאַת יְהוָה
  choice: dans la crainte de Yahweh
  rationale: « Crainte » conserve à la fois la révérence et la gravité exprimées par יראה. Le nom propre Yahweh représente directement le tétragramme.
- source_word: בֶּאֱמוּנָה
  choice: avec fidélité
  rationale: Dans cette exhortation adressée à des juges, אֱמוּנָה désigne une conduite fiable, loyale et intègre plutôt que la foi comprise comme croyance intérieure.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: et d’un cœur entier
  rationale: Cette expression préserve l’image hébraïque du cœur et la notion de totalité, qui peut évoquer une disposition entière, sincère et sans partage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même et non un titre. « Yahweh » le rend comme nom propre sans lui substituer « le Seigneur ».
- issue: Portée de אֱמוּנָה dans une instruction judiciaire
  choice: avec fidélité
  alternative: avec intégrité
  rationale: « Fidélité » maintient l’idée de constance et de fiabilité, tandis qu’« intégrité » est une possibilité contextuelle plus ciblée. Le choix évite aussi de réduire le terme à la croyance religieuse.
- issue: Portée de לֵבָב שָׁלֵם
  choice: d’un cœur entier
  alternative: d’un cœur sans partage
  rationale: La formulation retenue conserve la métaphore et l’ambiguïté entre plénitude, sincérité et dévouement indivisé, sans limiter le sens à une seule de ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe évite un hébraïsme pesant, tandis que « crainte de Yahweh », « fidélité » et « cœur entier » conservent les images et tensions essentielles du texte source.
