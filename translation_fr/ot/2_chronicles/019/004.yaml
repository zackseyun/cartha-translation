  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: fr
  text: Josaphat demeura à Jérusalem. Puis il repartit parmi le peuple, depuis Beer-Shéba jusqu’à la région montagneuse d’Éphraïm, et les ramena à Yahweh, le Dieu de leurs pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: demeura
  rationale: Le verbe ישׁב indique ici que Josaphat réside à Jérusalem; « demeura » convient au registre narratif biblique sans suggérer le simple fait de s’asseoir.
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: Puis il repartit
  rationale: La répétition de שוב avant יצא marque vraisemblablement une nouvelle sortie après son retour; « repartit » rend naturellement cette reprise d’activité.
- source_word: וַיֵּצֵא בָעָם
  choice: il repartit parmi le peuple
  rationale: La préposition ב suggère un déplacement au milieu du peuple ou à travers celui-ci, plutôt qu’un simple mouvement dans sa direction.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: depuis Beer-Shéba jusqu’à la région montagneuse d’Éphraïm
  rationale: הַר אֶפְרַיִם désigne la zone montagneuse d’Éphraïm; cette formulation géographique est claire en français moderne.
- source_word: וַיְשִׁיבֵם
  choice: le ramena
  rationale: Le hifil de שוב signifie « faire revenir ». Le suffixe masculin pluriel renvoie collectivement au peuple, traité en français comme un nom singulier.
- source_word: אֶל יְהוָה
  choice: à Yahweh
  rationale: La préposition exprime le retour vers Dieu, et le nom divin יהוה est translittéré « Yahweh » afin de conserver sa valeur de nom propre.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de ses ancêtres
  rationale: Le suffixe pluriel hébreu se rapporte aux membres du peuple; avec le collectif singulier français « peuple », « ses ancêtres » assure un accord naturel tout en conservant le lien ancestral.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le présente comme un nom propre sans le remplacer par un titre.
- issue: Nature de l’action exprimée par וַיְשִׁיבֵם אֶל יְהוָה
  choice: le ramena à Yahweh
  alternative: le convertit / l’amena à se repentir
  rationale: La traduction conserve l’image source du retour et n’explicite pas davantage la nature religieuse de ce retour que ne le fait l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. « Josaphat », « Beer-Shéba » et « Éphraïm » suivent les formes françaises bibliques usuelles. La syntaxe reste fluide tout en préservant la progression du texte hébreu.
