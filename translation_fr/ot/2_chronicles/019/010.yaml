revisions:
- from: Chaque litige qui vous sera soumis par vos frères habitant dans leurs villes — qu’il s’agisse de sang et de sang[a], de loi et de commandement, de prescriptions et de décisions de justice —, vous les avertirez, afin qu’ils ne se rendent pas coupables envers Yahweh et que la colère ne s’abatte pas sur vous et sur vos frères. Agissez ainsi, et vous ne vous rendrez pas coupables.
  to: Tout litige qui vous parviendra de la part de vos frères habitant dans leurs villes — qu’il s’agisse d’une affaire entre sang et sang[a], entre loi et commandement, entre prescriptions et règles de droit —, vous les avertirez, afin qu’ils ne se rendent pas coupables envers Yahweh; sinon, la colère viendra sur vous et sur vos frères. Agissez ainsi, et vous ne vous rendrez pas coupables.
  rationale: La révision rétablit la préposition comparative « entre » dans la formule technique, distingue clairement la finalité de l’avertissement de la conséquence de la culpabilité, et emploie un terme plus générique pour la dernière catégorie juridique. Elle conserve le nom Yahweh, le langage de parenté et l’ambiguïté historique de « sang et sang ».
