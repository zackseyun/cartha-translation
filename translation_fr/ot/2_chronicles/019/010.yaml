  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: fr
  text: Tout litige qui vous parviendra de la part de vos frères habitant dans leurs villes — qu’il s’agisse d’une affaire entre sang et sang[a], entre loi et commandement, entre prescriptions et règles de droit —, vous les avertirez, afin qu’ils ne se rendent pas coupables envers Yahweh; sinon, la colère viendra sur vous et sur vos frères. Agissez ainsi, et vous ne vous rendrez pas coupables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre sang et sang »; l’expression désigne probablement différentes affaires d’effusion de sang ou d’homicide.'
    reason: La formule hébraïque est technique et ambiguë; la note fournit son sens probable sans effacer sa forme dans le texte.
lexical_decisions:
- source_word: רִיב
  choice: litige
  rationale: Dans ce contexte judiciaire, le terme désigne un différend porté devant des juges. « Litige » est précis et naturel sans imposer l’idée d’un procès formel.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: vous sera soumis
  rationale: L’expression indique ici qu’une affaire est portée devant l’autorité judiciaire; cette formulation idiomatique en français explicite correctement ce cadre.
- source_word: מֵאֲחֵיכֶם
  choice: par vos frères
  rationale: Le terme de parenté est conservé; il désigne ici les membres de la communauté d’Israël sans être neutralisé.
- source_word: בֵּין דָּם לְדָם
  choice: de sang et de sang
  rationale: La formulation hébraïque, concise et technique, est volontairement préservée afin de ne pas trancher entre les diverses sortes d’affaires de sang possibles; une note en explique le sens probable.
- source_word: תּוֹרָה ... מִצְוָה ... חֻקִּים ... מִשְׁפָּטִים
  choice: loi ... commandement ... prescriptions ... décisions de justice
  rationale: Ces équivalents maintiennent les différentes catégories d’instruction juridique. « Décisions de justice » rend ici la dimension judiciaire de מִשְׁפָּטִים.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: vous les avertirez
  rationale: Le hiphil de זהר exprime une mise en garde destinée à empêcher une faute; le futur normatif convient aux instructions données aux juges.
- source_word: אשׁם
  choice: se rendre coupable
  rationale: Cette expression française rend l’entrée dans un état de culpabilité et fonctionne naturellement aux deux occurrences du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: קֶצֶף
  choice: la colère
  rationale: Le mot désigne ici la colère divine et la menace de jugement; « colère » est actuel et suffisamment solennel.
- source_word: כֹּה תַעֲשׂוּן
  choice: Agissez ainsi
  rationale: Cette formulation concise et naturelle renvoie à la conduite judiciaire qui vient d’être prescrite.
theological_decisions:
- issue: Portée de la proposition négative et relation avec la colère divine
  choice: « afin qu’ils ne se rendent pas coupables envers Yahweh et que la colère ne s’abatte pas »
  alternative: « afin qu’ils ne se rendent pas coupables envers Yahweh; sinon, la colère s’abattra »
  rationale: La syntaxe hébraïque coordonne la culpabilité et la venue de la colère dans le prolongement de l’avertissement. La traduction française rend les deux comme des conséquences à prévenir, sans transformer explicitement la seconde en condition, tout en respectant le sens contextuel.
- issue: Langage communautaire אֲחֵיכֶם
  choice: « vos frères »
  alternative: « les membres de votre peuple »
  rationale: Le texte emploie un terme de parenté pour la communauté de l’alliance; le conserver préserve cette image et son ancrage historique.
- issue: Nom divin יְהוָה
  choice: « Yahweh »
  alternative: « le Seigneur »
  rationale: La translittération préserve le nom divin propre du texte source plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire judiciaire reste précis sans devenir spécialisé. Les séries juridiques et la formule inhabituelle « de sang et de sang » conservent la tension et la densité du texte hébreu.
