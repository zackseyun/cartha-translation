  to: 'Quand tout Israël vit que le roi ne les avait pas écoutés, le peuple répondit au roi : « Quelle part avons-nous avec David ? Nous n’avons aucun héritage avec le fils de Jessé ! Chacun à ses tentes, Israël[a] ! Maintenant, occupe-toi de ta propre maison, David ! » Alors tout Israël alla à ses tentes[b].'
  rationale: La révision remplace « retourna » par « alla », conformément au verbe hébreu. Elle emploie aussi « avec » dans la formule de désaveu, formulation française plus naturelle qui préserve les termes concrets « part » et « héritage » ainsi que l’ambiguïté relationnelle de l’hébreu. Les deux notes restent ancrées aux expressions qu’elles expliquent et sont ajustées au texte révisé.
