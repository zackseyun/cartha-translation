  naturalness: Le français est globalement clair et de registre biblique moderne. « Avec David / avec le fils de Jessé » est plus idiomatique en français que « en / dans », tout en gardant les métaphores de part et d’héritage.
  terminology: « Part », « héritage », « Jessé », « maison » et « tentes » sont appropriés. « Maison » conserve sans la trancher l’ambiguïté entre maisonnée et dynastie. La note sur l’adresse collective Israël et le distributif est utile.
