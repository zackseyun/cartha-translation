  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: fr
  text: 'Quand tout Israël vit que le roi ne les avait pas écoutés, le peuple répondit au roi : « Quelle part avons-nous avec David ? Nous n’avons aucun héritage avec le fils de Jessé ! Chacun à ses tentes, Israël[a] ! Maintenant, occupe-toi de ta propre maison, David ! » Alors tout Israël alla à ses tentes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Chacun à tes tentes, Israël ! » Le singulier « chacun » a une valeur distributive, tandis qu’Israël est interpellé comme un tout.'
    reason: cultural_note
  - marker: b
    text: L’expression « aller à ses tentes » évoque ici la dispersion de chacun vers son propre lieu de vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: écouter
  rationale: Dans ce contexte, le verbe signifie prêter attention à la demande et y donner suite, plutôt que simplement entendre.
- source_word: וַיָּשִׁיבוּ
  choice: répondit
  rationale: La forme issue de שוב appartient ici à l’expression idiomatique signifiant donner une réponse; le singulier français s’accorde naturellement avec le sujet collectif « le peuple ».
- source_word: חֵלֶק
  choice: part
  rationale: « Part » conserve l’image d’une participation ou d’un intérêt commun dans la dynastie de David.
- source_word: נַחֲלָה
  choice: héritage
  rationale: Le terme préserve la dimension familiale, dynastique et patrimoniale de l’hébreu.
- source_word: בְּבֶן יִשַׁי
  choice: dans le fils de Jessé
  rationale: Cette formulation conserve la préposition et la métaphore hébraïque d’un héritage que l’on aurait dans la lignée de Jessé.
- source_word: אִישׁ
  choice: Chacun
  rationale: Le nom masculin singulier est employé distributivement. « Chacun » en restitue la force sans suggérer que seuls les hommes sont appelés à repartir.
- source_word: לְאֹהָלֶיךָ
  choice: à ses tentes
  rationale: Le français emploie naturellement le possessif singulier après « chacun », tout en conservant l’image historique et l’idiome hébreu.
- source_word: רְאֵה בֵיתְךָ
  choice: occupe-toi de ta propre maison
  rationale: Cette expression française rend clairement l’injonction adressée à David de prendre désormais soin de sa propre maison, avec le double sens possible de maisonnée et de dynastie.
- source_word: לְאֹהָלָיו
  choice: à ses tentes
  rationale: Le texte hébreu porte littéralement le possessif singulier après le collectif « tout Israël »; le français peut conserver cette concordance collective.
theological_decisions:
- issue: Formule de rupture politique avec la dynastie davidique
  choice: Quelle part avons-nous en David ? Nous n’avons aucun héritage dans le fils de Jessé !
  alternative: Nous n’avons rien à voir avec David, ni avec le fils de Jessé.
  rationale: La formulation retenue préserve les métaphores de la part et de l’héritage ainsi que leur portée familiale, politique et potentiellement covenantale, sans les réduire à une paraphrase moderne.
- issue: Genre du distributif אִישׁ
  choice: Chacun
  alternative: Chaque homme
  rationale: En hébreu, אִישׁ fonctionne ici distributivement dans un appel adressé à tout Israël. « Chacun » rend cette fonction naturelle en français sans effacer la construction singulière.
- issue: Sens de בֵיתְךָ appliqué à David
  choice: maison
  alternative: dynastie
  rationale: « Maison » maintient l’ambiguïté féconde entre les affaires propres de David, sa maisonnée et sa dynastie, au lieu de fixer un seul sens.
translation_notes:
  register: Français international moderne, soutenu mais direct. La structure poétique et provocatrice de la réponse populaire est conservée. « Jessé » suit la forme française biblique usuelle; « maison » préserve le jeu entre maisonnée et dynastie.
