  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: fr
  text: 'Il leur dit : « Revenez me voir dans trois jours[a]. » Et le peuple s’en alla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Encore trois jours, et revenez vers moi. »'
    reason: L’hébreu emploie une formule temporelle elliptique, rendue idiomatiquement par « dans trois jours ».
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur dit
  rationale: Rend naturellement la formule narrative hébraïque et le complément « à eux », sans alourdir le français par un « Et » initial peu nécessaire.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: Attendez encore trois jours
  rationale: L’hébreu est elliptique, littéralement « encore trois jours »; l’ajout de « Attendez » explicite en français l’idée de délai impliquée par le contexte, tout en la signalant par une note.
- source_word: וְשׁוּבוּ אֵלָי
  choice: puis revenez me voir
  rationale: L’impératif pluriel de שוב exprime le retour vers le locuteur. « Revenez me voir » est une formulation française courante et restitue אֵלַי, « vers moi ».
- source_word: וַיֵּלֶךְ הָעָם
  choice: Et le peuple s’en alla
  rationale: Conserve la progression narrative du wayyiqtol. Le singulier français convient au nom collectif « le peuple », comme l’accord singulier en hébreu.
