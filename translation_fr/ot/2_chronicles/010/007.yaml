revisions:
- from: 'Ils lui répondirent : « Si tu te montres bon envers ce peuple, si tu lui témoignes ta faveur[a] et si tu lui adresses des paroles bienveillantes, alors il sera à ton service tous les jours[b]. »'
  to: 'Ils lui dirent : « Si tu te montres bon envers ce peuple, si tu lui témoignes ta faveur[a] et si tu lui adresses des paroles bienveillantes, alors ils seront tes serviteurs tous tes jours[b]. »'
  rationale: La révision rétablit le pluriel du sujet et du prédicat final, emploie un verbe de parole non interprétatif, et corrige la note sur l’expression temporelle afin de ne pas renforcer le texte en « pour toujours ». Les autres choix conservent fidèlement le conseil de bienveillance et de conciliation adressé au roi.
