base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: fr
  text: 'Ils lui dirent : « Si tu te montres bon envers ce peuple, si tu lui témoignes ta faveur[a] et si tu lui adresses des paroles bienveillantes, alors ils seront tes serviteurs tous tes jours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si tu lui plais ». Le verbe hébreu peut évoquer le fait de plaire à quelqu’un ou de lui témoigner de la faveur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « durant toute ta vie ». Littéralement : « tous les jours » ; l’expression évoque un service durable.'
    reason: idiom_clarification
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: tu te montres bon envers ce peuple
  rationale: Cette formulation rend l’idiome היה + לְ + טוֹב comme une attitude et une conduite bienfaisantes envers le peuple. « Te montres bon » est naturel en français et évite de réduire le sens à la seule gentillesse.
- source_word: וּרְצִיתָם
  choice: tu lui témoignes ta faveur
  rationale: Le verbe רצה peut ici exprimer une disposition favorable ou l’action de gagner la satisfaction du peuple. Le choix principal convient au contexte d’un roi invité à traiter favorablement ses sujets, tandis que la note conserve l’autre lecture possible.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: tu lui adresses des paroles bienveillantes
  rationale: Cette traduction conserve le nom « paroles » et exprime naturellement la valeur contextuelle de טוֹבִים. Elle est plus idiomatique en français que « parler de bonnes paroles ».
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: il sera à ton service
  rationale: Dans ce contexte politique, עֲבָדִים désigne la soumission loyale de sujets à leur roi plutôt que l’esclavage mobilier. Le singulier collectif « il » reprend naturellement « ce peuple ».
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Cette expression proche de la forme hébraïque indique une durée continue. Elle n’ajoute pas un possessif absent de l’expression source et laisse la note expliciter la valeur idiomatique.
theological_decisions: []
