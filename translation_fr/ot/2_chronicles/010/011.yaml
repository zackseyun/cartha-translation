base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: fr
  text: Et maintenant, mon père vous a imposé un lourd joug, mais moi, j’ajouterai à votre joug. Mon père vous a corrigés à coups de fouet, mais moi, avec des scorpions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec des fouets à pointes », c’est-à-dire des fouets munis de pointes ou de crochets acérés. Le texte hébreu dit littéralement : « avec des scorpions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד
  choice: a rendu votre joug pesant
  rationale: Cette formulation conserve l’image concrète du joug et exprime naturellement en français l’idée causative d’une charge rendue lourde.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: j’ajouterai encore à votre joug
  rationale: Le rendu suit de près l’expression hébraïque « ajouter à votre joug »; « encore » rend explicite la valeur d’accroissement portée par le verbe dans ce contexte sans remplacer la métaphore.
- source_word: יִסַּר אֶתְכֶם
  choice: vous a corrigés
  rationale: Le verbe désigne ici une correction punitive. « Corriger » conserve cette nuance en français moderne sans le caractère vieilli de « châtier ».
- source_word: בַּשּׁוֹטִים
  choice: à coups de fouet
  rationale: Cette expression française naturelle rend clairement le moyen de la punition indiqué par le pluriel hébreu « fouets ».
- source_word: בָּעֲקְרַבִּים
  choice: à coups de scorpions
  rationale: Le texte hébreu dit littéralement « avec des scorpions ». Le texte principal préserve cette image frappante, tandis que la note signale le sens instrumental possible.
