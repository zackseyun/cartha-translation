  text: וַ/יֵּ֥לֶךְ רְחַבְעָ֖ם שְׁכֶ֑מָ/ה כִּ֥י שְׁכֶ֛ם בָּ֥אוּ כָל יִשְׂרָאֵ֖ל לְ/הַמְלִ֥יךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/001.yaml
  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: fr
  text: Roboam se rendit à Sichem, parce que tout Israël était venu à Sichem pour le faire roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Exprime naturellement en français le déplacement de Roboam vers Sichem, sans ajouter de nuance absente de l’hébreu.
- source_word: כִּי
  choice: parce que
  rationale: Rend ici la relation causale entre le déplacement de Roboam et la venue de tout Israël.
- source_word: כָל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Conserve l’expression collective et son ampleur rhétorique sans préciser artificiellement sa composition.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: pour le faire roi
  rationale: Restitue la construction causative de מלך et le but de l’assemblée dans un français courant et digne.
theological_decisions:
- issue: Rôle de l’assemblée dans l’accession de Roboam
  choice: pour le faire roi
  alternative: pour le proclamer roi
  rationale: La forme causative hébraïque indique que le peuple vient établir Roboam comme roi; « faire roi » préserve cette formulation sans réduire l’acte à une simple proclamation cérémonielle.
translation_notes:
  register: Français moderne international, narratif et dignifié. Le nom שְׁכֶם est rendu par sa forme biblique française usuelle « Sichem »; רְחַבְעָם par « Roboam ».
