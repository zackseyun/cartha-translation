base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: fr
  text: Mais Roboam régna sur les Israélites qui habitaient dans les villes de Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël qui habitaient dans les villes de Juda ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Mais les Israélites
  rationale: בְּנֵי יִשְׂרָאֵל est ici une désignation ethnique courante. « Les Israélites » est naturel en français moderne, tandis que « Mais » exprime le contraste avec la révolte évoquée au verset précédent.
- source_word: הַיֹּשְׁבִים
  choice: qui habitaient
  rationale: Le participe de ישׁב indique ici une résidence continue; l’imparfait français en rend naturellement la valeur durative.
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: Cette formulation conserve clairement le rapport géographique et le pluriel du texte hébreu.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le passé simple convient au récit historique et exprime l’exercice de la royauté, plutôt qu’une simple accession au trône.
- source_word: עֲלֵיהֶם
  choice: sur
  rationale: La préposition על marque ici l’autorité exercée sur un peuple; le pronom est naturellement représenté en français par le complément « les Israélites » placé après le verbe.
- source_word: רְחַבְעָם
  choice: Roboam
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
