  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: fr
  text: 'Il leur dit : « Que conseillez-vous afin que nous répondions à ce peuple qui m’a parlé en ces termes : “Allège le joug que ton père nous a imposé” ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֽוֹעָצִים
  choice: Que me conseillez-vous
  rationale: Le verbe יעץ exprime ici l’action de donner un conseil. La tournure française est naturelle et explicite le bénéficiaire déjà évident dans le contexte.
- source_word: וְנָשִׁיב דָּבָר
  choice: de répondre
  rationale: L’expression signifie littéralement « rendre une parole », c’est-à-dire donner une réponse. L’infinitif français s’intègre naturellement après « conseillez-vous » et conserve la visée de la consultation.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette formulation conserve le collectif singulier de l’hébreu et convient au registre narratif.
- source_word: דִּבְּרוּ אֵלַי לֵאמֹר
  choice: qui m’a demandé
  rationale: Dans ce contexte, la parole citée est une requête. « M’a demandé » rend naturellement en français la fonction de דִּבְּרוּ אֵלַי לֵאמֹר sans reproduire lourdement « m’a parlé en disant ».
- source_word: הָקֵל
  choice: Allège
  rationale: L’impératif hiphil demande de rendre moins lourd. « Allège » est concis et maintient le lien avec l’image du joug.
- source_word: מִן הָעֹל
  choice: le joug
  rationale: עֹל désigne littéralement un joug et fonctionne ici comme image de la charge imposée ou d’une domination pesante. L’image concrète est conservée.
- source_word: נָתַן ... עָלֵינוּ
  choice: nous a imposé
  rationale: Bien que le sens littéral soit « a mis sur nous », « imposé » est idiomatique en français pour une charge ou un joug et restitue la contrainte exprimée.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Le singulier familier convient à l’adresse directe au roi dans la citation et traduit exactement le suffixe possessif.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur dit
  rationale: Cette tournure rend simplement le wayyiqtol narratif. L’absence de « et » en tête de verset est plus naturelle en français sans perdre la continuité du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été légèrement restructurée pour éviter le calque pesant « Que conseillez-vous, afin que nous répondions… ». Le discours direct et l’image biblique du joug sont préservés.
