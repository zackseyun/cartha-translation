  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: fr
  text: Ainsi, Israël est resté en révolte contre la maison de David jusqu’à ce jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ainsi, Israël se révolta contre la maison de David jusqu’à ce jour. » La forme verbale hébraïque peut désigner simplement la révolte passée ou, avec « jusqu’à ce jour », mettre en relief la situation qui en a résulté et qui se prolonge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: est resté en révolte
  rationale: Le verbe פשע exprime ici une révolte contre une autorité. Cette formulation française rend à la fois l’acte de rébellion et la situation qui se prolonge, mise en relief par « jusqu’à aujourd’hui ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne ici collectivement les tribus du Nord, par opposition à la dynastie davidique. Le texte principal conserve simplement le nom propre.
- source_word: בְּבֵית דָּוִיד
  choice: contre la maison de David
  rationale: Avec פשע, la préposition בְּ peut désigner l’autorité contre laquelle on se révolte. « Maison de David » conserve le sens dynastique de l’hébreu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Cette expression idiomatique indique que la situation durait encore au moment où le récit a été formulé.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Est resté en révolte » évite le calque moins idiomatique « a été en rébellion » tout en préservant la durée suggérée par la dernière proposition. La note maintient l’ambiguïté aspectuelle de l’hébreu.
