  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: fr
  text: Ainsi, le roi n’écouta pas le peuple, car cette tournure des événements venait de Dieu, afin que Yahweh accomplisse la parole qu’il avait prononcée par l’intermédiaire d’Ahija de Silo à Jéroboam, fils de Nebath.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַע
  choice: écouta
  rationale: Avec אֶל הָעָם, le verbe signifie ici prêter attention à la demande du peuple, et non simplement entendre; « écouter » conserve ce sens sans aller jusqu’à expliciter « obéir ».
- source_word: נְסִבָּה
  choice: tournure des événements
  rationale: Le nom peut désigner un retournement, une circonstance ou un développement causal. Cette formulation naturelle garde le caractère providentiel du déroulement narratif.
- source_word: מֵעִם הָאֱלֹהִים
  choice: venait de Dieu
  rationale: La préposition exprime l’origine ou la source; cette formulation française est directe et idiomatique.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution hébraïque marque ici le but; « afin que » en conserve clairement la valeur finale.
- source_word: הָקִים
  choice: accomplisse
  rationale: Le hiphil de קום signifie littéralement faire tenir, donc établir ou confirmer. Avec une parole prophétique comme complément, « accomplir » est naturel en français et exprime sa réalisation sans ajouter de contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: דְּבָרוֹ
  choice: la parole
  rationale: « Parole » conserve l’étendue du terme hébreu et permet au contexte de montrer qu’il s’agit de la déclaration prophétique.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression idiomatique marque l’agent par lequel la parole a été transmise; cette traduction est claire en français moderne.
- source_word: הַשִּׁלוֹנִי
  choice: de Silo
  rationale: L’adjectif gentilique désigne Ahijah comme originaire de Silo; « de Silo » est plus immédiatement compréhensible que le rare « Silonite ».
- source_word: בֶּן נְבָט
  choice: fils de Nebath
  rationale: Rendu patronymique français conventionnel, avec une translittération usuelle du nom.
theological_decisions:
- issue: Causalité divine et action humaine
  choice: le roi n’écouta pas le peuple, car cette tournure des événements venait de Dieu
  alternative: le roi n’écouta pas le peuple, car la cause venait de Dieu
  rationale: Le texte attribue explicitement à Dieu l’origine du déroulement tout en présentant le refus comme l’action réelle du roi. La formulation maintient cette tension sans faire de Dieu le sujet grammatical direct du refus.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et préserve la forme nominale de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression hébraïque tout en évitant les calques lourds. Aucun appel de note n’est nécessaire, car « tournure des événements » conserve suffisamment l’amplitude de נְסִבָּה dans le corps du texte.
