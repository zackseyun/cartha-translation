  text: וַ/יַּעֲנֵ֥/ם הַ/מֶּ֖לֶךְ קָשָׁ֑ה וַֽ/יַּעֲזֹב֙ הַ/מֶּ֣לֶךְ רְחַבְעָ֔ם אֵ֖ת עֲצַ֥ת הַ/זְּקֵנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: fr
  text: Le roi leur répondit durement, et le roi Roboam abandonna le conseil des anciens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: leur répondit
  rationale: Le verbe ענה exprime ici une réponse, et le suffixe de troisième personne du masculin pluriel est rendu explicitement par « leur ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini; elle convient au déroulement naturel du récit.
- source_word: קָשָׁה
  choice: avec dureté
  rationale: L’adjectif hébreu « dur » fonctionne ici adverbialement. « Avec dureté » conserve cette nuance tout en restant naturel et digne en français.
- source_word: וַיַּעֲזֹב
  choice: rejeta
  rationale: Dans ce contexte, עזב indique que Roboam écarte délibérément l’avis reçu. « Rejeta » exprime clairement cet abandon sans archaïsme.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: le roi Roboam
  rationale: La construction identifie le roi par son nom; « le roi Roboam » est la formulation française naturelle.
- source_word: עֲצַת
  choice: le conseil
  rationale: עצה désigne ici l’avis ou la recommandation donnée par les anciens. « Conseil » conserve le sens consultatif du terme.
- source_word: הַזְּקֵנִים
  choice: des anciens
  rationale: Le terme désigne des hommes âgés exerçant un rôle reconnu de conseillers, et non simplement des hommes vieux.
