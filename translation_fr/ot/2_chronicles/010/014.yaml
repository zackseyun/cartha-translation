base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: fr
  text: 'Il leur parla en suivant le conseil des jeunes gens : « Je rendrai votre joug plus lourd et j’y ajouterai encore. Mon père vous a corrigés avec des fouets, mais moi, je vous corrigerai avec des scorpions[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec des fouets à pointes », c’est-à-dire des fouets munis de pointes ou de crochets acérés. L’hébreu dit littéralement : « avec des scorpions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: Il leur parla
  rationale: דבר est le verbe courant pour « parler ». Le contexte est celui d’une réponse, mais cette formulation reste proche de l’hébreu sans expliciter davantage.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: en suivant le conseil des jeunes gens
  rationale: עֵצָה désigne un conseil, et כ marque ici la conformité. « En suivant » exprime naturellement en français que Roboam se conforme à leur avis.
- source_word: הַיְלָדִים
  choice: les jeunes gens
  rationale: Dans ce récit, le mot désigne les conseillers plus jeunes qui ont grandi avec Roboam, et non de petits enfants.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: Je rendrai votre joug plus lourd
  rationale: Le hifil de כבד est causatif. Le comparatif « plus lourd » rend l’aggravation d’un joug déjà imposé tout en conservant la métaphore.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: et j’y ajouterai encore
  rationale: יסף avec על exprime l’idée d’ajouter ou d’accroître. Le pronom renvoie naturellement au joug; « encore » fait ressortir l’escalade sans remplacer l’image par une explication.
- source_word: יִסַּר אֶתְכֶם
  choice: vous a corrigés / je vous corrigerai
  rationale: יסר couvre la correction et la discipline, ici exercées de manière punitive. « Corriger » conserve cette gamme de sens et convient à la construction parallèle.
- source_word: בַּשּׁוֹטִים
  choice: avec des fouets
  rationale: שׁוֹט désigne clairement un fouet; ce terme est courant et précis en français moderne.
- source_word: בָּעֲקְרַבִּים
  choice: avec des scorpions
  rationale: Le nom signifie littéralement « scorpions ». L’image forte et l’ambiguïté sont conservées dans le texte, tandis que le sens instrumental probable est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore du joug ainsi que l’image volontairement saisissante des « scorpions » sont maintenues. Le parallélisme de la menace royale est rendu explicitement par la répétition de « corrigerai », sous-entendue dans le second membre hébreu.
