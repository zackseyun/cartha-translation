base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: fr
  text: Ton père a rendu notre joug pénible[a]. Maintenant, allège le service pénible et le lourd joug que ton père nous a imposés[b], et nous te servirons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a rendu notre joug dur » ou « rigoureux ».
    reason: lexical_alternative
  - marker: b
    text: Le « service » désigne ici le travail ou les obligations imposés sous l’autorité royale.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: a rendu notre joug pénible
  rationale: Le hiphil de קשׁה exprime ici l’action de rendre le joug dur ou pénible. « Pénible » est naturel en français et conserve la métaphore du joug sans anticiper l’adjectif « lourd » employé ensuite pour כָּבֵד.
- source_word: עֻלֵּנוּ
  choice: notre joug
  rationale: « Joug » conserve l’image concrète de עֹל et sa portée métaphorique de domination ou de charge oppressive.
- source_word: הָקֵל
  choice: allège
  rationale: L’impératif demande une réduction de la charge. « Allège » est idiomatique et maintient l’image du poids associée au joug.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: le service pénible que ton père exigeait de nous
  rationale: עֲבֹדָה peut désigner le service, le travail ou les obligations imposées sous l’autorité royale. La proposition relative explicite en français moderne la relation exprimée par le génitif hébreu sans réduire le terme aux seuls travaux manuels.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: ainsi que le lourd joug
  rationale: La répétition de « joug » préserve la métaphore du texte, tandis que « lourd » rend directement כָּבֵד et marque sa distinction avec קָשֶׁה, rendu par « pénible ».
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: qu’il nous a imposé
  rationale: Dans le contexte d’un joug royal, « imposer un joug à quelqu’un » est une expression française naturelle qui restitue le sens de נָתַן עַל.
- source_word: וְנַעַבְדֶךָּ
  choice: et nous te servirons
  rationale: Le verbe exprime l’engagement du peuple à servir Roboam en réponse à l’allègement demandé.
