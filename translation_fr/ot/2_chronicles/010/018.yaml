id: 2CH.10.18
reference: 2 Chronicles 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: fr
  text: Le roi Roboam envoya alors Hadoram[a], responsable des travaux forcés. Mais les fils d’Israël[b] le lapidèrent à coups de pierres, et il mourut. Le roi Roboam rassembla ses forces[c] pour monter sur son char et s’enfuir à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Hadoram »; le récit parallèle de 1 Rois 12.18 porte « Adoram ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les Israélites ». « Les fils d’Israël » est une désignation nationale idiomatique en hébreu.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit plus littéralement : « se fortifia pour monter sur le char ». Dans ce contexte, certains comprennent : « se hâta de monter sur le char ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya alors
  rationale: Le verbe שלח signifie couramment « envoyer » dans le récit. « Alors » rend ici l’enchaînement narratif porté par וַ.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: le roi Roboam
  rationale: Formulation française naturelle qui conserve le titre royal et le nom propre.
- source_word: הֲדֹרָם
  choice: Hadoram
  rationale: Cette forme translittère directement le nom donné par le texte hébreu des Chroniques; la forme parallèle « Adoram » est signalée en note.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: responsable des travaux forcés
  rationale: מַס désigne ici une prestation de travail imposée plutôt qu’un simple impôt. La formulation exprime clairement la fonction administrative de Hadoram.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: le lapidèrent à coups de pierres
  rationale: Cette expression française naturelle conserve à la fois le verbe de lapidation et la mention explicite de la pierre dans l’hébreu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le rendu formel préserve l’expression hébraïque et sa coloration nationale; une note précise qu’elle désigne idiomatiquement les Israélites.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: Rend directement la succession narrative sans préciser une relation logique que le texte laisse implicite.
- source_word: הִתְאַמֵּץ
  choice: rassembla ses forces
  rationale: Le hitpael de אמץ exprime le fait de s’affermir ou de mobiliser ses forces. Ce choix reste naturel en français et n’introduit pas explicitement l’idée de vitesse.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: pour monter sur son char
  rationale: עלה exprime le mouvement de monter; « monter sur son char » est idiomatique en français.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: et s’enfuir à Jérusalem
  rationale: נוס signifie fuir ou prendre la fuite. L’infinitif coordonné en français exprime clairement le but de l’action.
