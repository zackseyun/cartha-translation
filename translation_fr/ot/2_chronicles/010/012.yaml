  text: וַ/יָּבֹ֨א יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִשִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: fr
  text: 'Jéroboam et tout le peuple vinrent donc trouver Roboam le troisième jour, comme le roi l’avait dit : « Revenez auprès de moi le troisième jour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vinrent trouver
  rationale: Le verbe בוא exprime ici le déplacement vers Roboam. « Vinrent trouver » est naturel en français et rend explicitement le complément personnel introduit par אֶל.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: עָם désigne ici l’ensemble du peuple accompagnant Jéroboam, sans impliquer nécessairement une assemblée institutionnelle.
- source_word: אֶל רְחַבְעָם
  choice: trouver Roboam
  rationale: אֶל marque le mouvement en direction de Roboam ; la tournure française « venir trouver quelqu’un » exprime naturellement cette relation.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Cette expression temporelle se rend directement et idiomatiquement ainsi en français, sans ajout explicatif.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction établit la conformité entre la venue du peuple et les paroles antérieures du roi.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: le roi l’avait dit
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la parole du roi ; « dit » conserve la valeur ordinaire de דבר sans en faire explicitement un ordre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu de la parole. En français moderne, les deux-points remplissent cette fonction plus naturellement qu’un participe tel que « disant ».
- source_word: שׁוּבוּ אֵלַי
  choice: Revenez auprès de moi
  rationale: שׁוב indique un retour, et אֵלַי en précise le terme personnel. Cette formulation conserve les deux éléments sans surinterprétation.
