  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ וַ/יָּבֹ֥א יָרָבְעָ֖ם וְ/כָל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: fr
  text: 'Ils envoyèrent et le firent appeler[a]. Jéroboam et tout Israël vinrent parler à Roboam en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils envoyèrent le chercher et l’appelèrent. » Le texte hébreu ne précise pas ce qui fut envoyé; il peut s’agir de messagers ou d’un message.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: Ils envoyèrent donc quelqu’un le chercher
  rationale: La première proposition laisse le complément de « envoyèrent » implicite, tandis que קרא ל exprime ici l’idée de faire venir quelqu’un. Cette formulation française rend naturellement les deux actions sans préciser indûment qu’il s’agissait de messagers.
- source_word: וַיָּבֹא
  choice: vinrent
  rationale: Bien que le verbe hébreu soit au singulier, accordé selon toute vraisemblance avec Jéroboam comme premier sujet, le français exige ici le pluriel avec le sujet composé « Jéroboam et tout Israël ».
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jéroboam et tout Israël
  rationale: La formulation conserve l’expression nationale et collective « tout Israël » plutôt que de la réduire à « tous les Israélites ».
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם לֵאמֹר
  choice: 'parler à Roboam en ces termes :'
  rationale: Cette tournure naturelle en français conserve l’acte de parler et signale que le discours direct commence au verset suivant, sans reproduire le lourd calque « disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « En ces termes » assure une transition naturelle vers la citation du verset suivant. Le connecteur « donc » rend la progression narrative de וַ sans alourdir la phrase.
