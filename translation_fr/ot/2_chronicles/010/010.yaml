  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: fr
  text: 'Les jeunes hommes qui avaient grandi avec lui lui dirent : « Voici ce que tu diras au peuple qui t’a dit : “Ton père a rendu notre joug pesant ; toi, allège-le pour nous.” Voici ce que tu leur diras : “Mon petit doigt[a] est plus gros que la taille[b] de mon père.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ma petitesse » ; l’expression est généralement comprise comme désignant le petit doigt.
    reason: lexical_alternative
  - marker: b
    text: Ou « les reins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: les jeunes hommes
  rationale: Dans ce contexte de cour, le terme désigne les jeunes contemporains de Roboam, et non de petits enfants.
- source_word: גָּדְלוּ אִתּוֹ
  choice: qui avaient grandi avec lui
  rationale: Cette formulation rend naturellement l’idée d’une éducation ou d’une maturation partagée.
- source_word: כֹּה תֹאמַר
  choice: Voici ce que tu diras
  rationale: Cette formule française actuelle conserve la valeur directive de la formule hébraïque d’introduction du discours.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: Ton père a rendu notre joug pesant
  rationale: Le choix conserve l’image concrète du joug ainsi que l’idée de l’avoir rendu lourd ou accablant.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: rends-le plus léger pour nous
  rationale: Le pronom reprend naturellement le joug et exprime clairement la demande d’allègement.
- source_word: קָטָנִּי
  choice: mon petit doigt
  rationale: L’expression elliptique est comprise idiomatiquement comme désignant le petit doigt, comme le confirme le parallèle de 1 Rois 12.10.
- source_word: עָבָה
  choice: est plus gros que
  rationale: Le terme exprime l’épaisseur ou la grosseur dans une comparaison corporelle et provocatrice.
- source_word: מִמָּתְנֵי אָבִי
  choice: que la taille de mon père
  rationale: Le mot désigne la région des reins ou de la taille ; « la taille » est clair en français moderne et préserve la force de la comparaison.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La métaphore du joug et la vantardise corporelle sont conservées, tandis que l’ellipse hébraïque concernant le petit doigt est rendue idiomatiquement et signalée en note.
