base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: fr
  text: 'Le roi Roboam consulta alors les anciens qui servaient auprès de Salomon, son père, de son vivant[a]. Il leur demanda : « Que me conseillez-vous de répondre à ce peuple[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui se tenaient devant Salomon, son père, lorsqu’il était vivant ». « Se tenir devant » peut désigner le fait d’assister ou de servir officiellement un souverain.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Comment conseillez-vous de rendre une parole à ce peuple ? » Cette expression hébraïque signifie donner une réponse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consulta
  rationale: Le nifal de יעץ exprime ici le fait de solliciter l’avis d’autrui. « Consulta » est naturel et précis en français.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Le terme désigne ici des hommes âgés exerçant vraisemblablement une fonction de conseil; « les anciens » conserve cette portée sociale et officielle.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: qui s’étaient tenus au service de
  rationale: L’expression signifie littéralement « qui se tenaient devant », mais peut désigner le service officiel auprès d’un souverain. La formulation retenue restitue ce sens sans rendre la phrase obscure.
- source_word: שְׁלֹמֹה אָבִיו
  choice: son père Salomon
  rationale: Cet ordre est idiomatique en français et rend clairement le lien familial exprimé par l’hébreu.
- source_word: בִּהְיוֹתוֹ חַי
  choice: de son vivant
  rationale: Cette locution française concise et naturelle rend la valeur temporelle de l’infinitif construit avec חַי.
- source_word: לֵאמֹר
  choice: Il leur demanda
  rationale: 'Le fréquent introducteur hébreu de discours, littéralement « en disant », est rendu selon sa fonction contextuelle: Roboam pose une question aux anciens.'
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Que me conseillez-vous
  rationale: La question sollicite leur recommandation. « Que me conseillez-vous » est plus naturel en français que le calque « Comment conseillez-vous » et explicite sans excès le bénéficiaire implicite.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: de répondre à ce peuple
  rationale: Littéralement, il s’agit de « retourner une parole à ce peuple », idiome hébreu signifiant donner une réponse. La traduction française en restitue directement le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple « consulta » convient au récit écrit; la parole directe demeure naturelle. La tournure « ce peuple » conserve le collectif singulier de עָם.
