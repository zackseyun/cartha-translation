  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: fr
  text: Lorsque Jéroboam, fils de Nebath, l’apprit[a] — il était alors en Égypte, où il avait fui pour échapper au roi Salomon[b] —, Jéroboam revint d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas ce que Jéroboam apprit; le contexte permet de le comprendre. On peut aussi traduire : « en entendit parler ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « où il avait fui de devant le roi Salomon », c’est-à-dire loin de sa présence ou de son pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … l’apprit
  rationale: La construction avec וַיְהִי et l’infinitif construit introduit une proposition temporelle. « Lorsque » rend naturellement la progression narrative sans conserver le tour hébraïque plus lourd « il arriva que ». Le pronom « l’ » fournit en français un complément implicite déterminé par le contexte.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les noms suivent leur forme française biblique usuelle, et le patronyme hébreu est rendu directement par « fils de ».
- source_word: וְהוּא בְמִצְרַיִם
  choice: il était alors en Égypte
  rationale: Cette proposition donne une information d’arrière-plan. « Alors » exprime sa valeur circonstancielle sans lui imposer un lien causal absent de l’hébreu.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: où il avait fui pour échapper au roi Salomon
  rationale: Le plus-que-parfait situe la fuite avant la scène racontée. « Pour échapper au roi Salomon » rend idiomatiquement מִפְּנֵי dans ce contexte, tandis qu’une note conserve l’image littérale de la fuite « de devant » sa présence.
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Dans ce récit, שוב désigne un retour géographique, sans connotation de repentance.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: La préposition מן indique ici le lieu d’origine du retour.
- source_word: יָרָבְעָם … וַיָּשָׁב יָרָבְעָם
  choice: Jéroboam … Jéroboam revint
  rationale: La répétition du nom propre, présente dans l’hébreu après la parenthèse, est conservée pour clarifier la reprise de la proposition principale.
theological_decisions: []
