  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: fr
  text: Mais il rejeta le conseil que les anciens lui avaient donné et consulta les jeunes gens qui avaient grandi avec lui et qui se tenaient devant lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui étaient à son service »; « se tenir devant » peut être une expression de cour désignant ceux qui assistent ou servent un souverain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: il rejeta
  rationale: Dans ce contexte, עזב exprime l’abandon du conseil des anciens au profit d’un autre. « Rejeta » rend clairement cette décision en français courant, sans suggérer une simple mise de côté provisoire.
- source_word: עֲצַת הַזְּקֵנִים
  choice: le conseil que les anciens lui avaient donné
  rationale: « Conseil » convient naturellement à עֵצָה, tandis que « les anciens » rend זְקֵנִים en conservant à la fois l’idée d’âge et leur rôle de conseillers expérimentés.
- source_word: וַיִּוָּעַץ אֶת
  choice: consulta
  rationale: Le niphal de יעץ suivi de אֶת décrit ici une consultation avec ces hommes. « Consulta » est idiomatique et évite une formulation française lourde.
- source_word: הַיְלָדִים
  choice: les jeunes gens
  rationale: Bien que יְלָדִים puisse désigner des enfants ou des garçons, il s’agit ici des contemporains adultes du roi ayant grandi avec lui; « jeunes gens » convient donc mieux au contexte.
- source_word: גָּדְלוּ אִתּוֹ
  choice: qui avaient grandi avec lui
  rationale: Cette formulation restitue directement leur éducation ou leur jeunesse commune, antérieure à la consultation racontée.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: qui se tenaient devant lui
  rationale: La traduction conserve l’image concrète de l’hébreu tout en signalant en note la valeur possible de cette expression dans le cadre de la cour royale.
