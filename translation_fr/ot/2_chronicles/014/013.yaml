revisions:
- from: Ils frappèrent toutes les villes des environs de Guérar, car la terreur de Yahweh pesait sur elles. Ils pillèrent toutes ces villes, car elles renfermaient un butin considérable.
  to: Ils frappèrent toutes les villes des environs de Guérar, car la terreur de Yahweh avait saisi leurs habitants. Ils pillèrent toutes les villes, car elles renfermaient un butin considérable.
  rationale: La révision se limite à expliciter, dans la première proposition, le référent humain le plus probable du suffixe masculin « sur eux ». Elle préserve le sens militaire, la répétition de « toutes les villes », le nom divin et l’ambiguïté du génitif « terreur de Yahweh ».
  reviewer_model: gpt-5.6-terra
