  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: fr
  text: Ils frappèrent toutes les villes des environs de Guérar, car la terreur de Yahweh avait saisi leurs habitants. Ils pillèrent toutes les villes, car elles renfermaient un butin considérable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: ils frappèrent
  rationale: Le verbe נכה, dans ce contexte militaire, exprime une action violente contre les villes. « Frappèrent » conserve cette force sans préciser au-delà de l’hébreu si elles furent attaquées, vaincues ou détruites.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: toutes les villes des environs de Guérar
  rationale: Cette formulation rend naturellement l’idée des villes situées autour de Guérar.
- source_word: פַחַד יְהוָה
  choice: la terreur de Yahweh
  rationale: פחד désigne ici l’effroi plutôt qu’une crainte révérencielle. Le génitif est conservé sans trancher explicitement entre une terreur causée par Yahweh et une terreur associée à sa manifestation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: עֲלֵיהֶם
  choice: pesait sur elles
  rationale: « Pesait sur elles » exprime en français naturel une terreur accablante présente sur les villes et leur population.
- source_word: וַיָּבֹזּוּ
  choice: ils pillèrent
  rationale: בזז désigne l’action de prendre les biens d’un lieu vaincu comme butin de guerre.
- source_word: בִּזָּה רַבָּה
  choice: un butin considérable
  rationale: Cette expression rend l’abondance du butin dans un français actuel et soutenu.
- source_word: בָהֶם
  choice: elles renfermaient
  rationale: Le pronom renvoie aux villes; la reformulation est idiomatique et maintient ce référent explicite.
theological_decisions:
- issue: Sens de « la terreur de Yahweh »
  choice: Conserver le génitif sans l’expliciter
  alternative: la terreur envoyée par Yahweh
  rationale: L’hébreu associe directement la terreur à Yahweh, mais ne formule pas ici le rapport avec une précision causale; la traduction préserve cette tension.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La transcription préserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « toutes les villes » est maintenue, comme dans l’hébreu. « Frappèrent » conserve l’image militaire et évite d’ajouter explicitement la destruction des villes ou la mise à mort de leurs habitants.
