source:
  edition: WLC
  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: fr
  text: Zérah le Koushite[b] sortit contre eux avec une armée de mille milliers[a] d’hommes et trois cents chars, et il s’avança jusqu’à Marésha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un million ». L’hébreu dit littéralement « mille milliers ».
    reason: lexical_alternative
  - marker: b
    text: '« Koushite » reprend le terme ethnogéographique hébreu; traduction traditionnelle : « Éthiopien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: sortit contre eux
  rationale: Dans ce récit militaire, יצא décrit une sortie ou une marche au combat, tandis que אֲלֵיהֶם prend ici un sens hostile. Cette formulation reste proche de l’hébreu tout en étant claire en français.
- source_word: זֶרַח הַכּוּשִׁי
  choice: Zérah le Koushite
  rationale: « Koushite » conserve le terme ethnogéographique hébreu כּוּשִׁי sans l’identifier de façon réductrice à l’Éthiopie moderne.
- source_word: בְּחַיִל
  choice: avec une armée
  rationale: Dans ce contexte, חַיִל désigne une force militaire. « Armée » est naturel et immédiatement compréhensible.
- source_word: אֶלֶף אֲלָפִים
  choice: mille milliers d’hommes
  rationale: La formulation reproduit l’expression numérique inhabituelle de l’hébreu et évite de trancher silencieusement entre un calcul strict (« un million ») et une expression conventionnelle de très grand nombre. « D’hommes » explicite naturellement le contenu de l’armée, implicite dans le contexte.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: et trois cents chars
  rationale: Traduction directe et idiomatique de la donnée numérique et militaire.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: et il s’avança jusqu’à Marésha
  rationale: Le verbe de mouvement et עַד indiquent une progression atteignant Marésha. « S’avança jusqu’à » rend naturellement cette nuance dans le contexte militaire.
