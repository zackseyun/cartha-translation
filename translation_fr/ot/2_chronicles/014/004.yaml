id: 2CH.14.4
reference: 2 Chronicles 14:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: fr
  text: Il fit disparaître de toutes les villes de Juda les hauts lieux et les autels à encens[a], et le royaume connut le repos sous son règne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « piliers solaires ». Le terme hébreu désigne des objets cultuels et peut, dans certains contextes, être associé au culte solaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Il fit disparaître
  rationale: Le hifil de סור exprime ici l’action de faire enlever. « Fit disparaître » rend naturellement cette élimination concrète sans lui donner le sens plus institutionnel d’une abolition.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: de toutes les villes de Juda
  rationale: Cette formulation rend directement l’étendue géographique de la réforme indiquée par מן, כל et la chaîne construite.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: במות désigne couramment des lieux de culte, souvent aménagés sur des hauteurs. « Hauts lieux » conserve le terme historique traditionnel sans le réduire au sens plus général de « sanctuaires ».
- source_word: הַחַמָּנִים
  choice: les autels à encens
  rationale: Le terme désigne des objets cultuels dont la nature exacte reste discutée, parfois mis en rapport avec l’encens ou avec un culte solaire. « Autels à encens » fournit un sens plausible et lisible, tandis qu’une autre possibilité est signalée en note.
- source_word: וַתִּשְׁקֹט
  choice: connut le repos
  rationale: שקט évoque une situation calme, paisible et sans troubles. « Connût le repos » convient au royaume comme sujet et préserve le thème récurrent, dans les Chroniques, du repos accordé au pays.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: « Le royaume » est l’équivalent direct et naturel de ממלכה dans ce contexte royal.
- source_word: לְפָנָיו
  choice: sous son règne
  rationale: Littéralement « devant lui », l’expression indique ici de manière idiomatique que ce repos caractérisa la période où Asa gouvernait. « Sous son règne » communique ce sens clairement en français moderne.
theological_decisions:
- issue: Nature des installations cultuelles supprimées par Asa
  choice: Présenter les hauts lieux et les חמנים comme des installations cultuelles concrètes, sans préciser davantage leur fonction religieuse.
  alternative: Interpréter les חמנים de façon spécifique comme des piliers ou emblèmes solaires.
  rationale: Le verset décrit clairement une réforme visant des lieux et objets cultuels, mais le sens précis de חמנים est incertain. Le texte principal reste lisible et la note conserve l’autre interprétation sans imposer une polémique cultuelle plus précise que l’hébreu ne le permet.
- issue: Sens de לְפָנָיו appliqué au repos du royaume
  choice: Rendre l’expression par « sous son règne ».
  alternative: Traduire formellement par « devant lui » ou « en sa présence ».
  rationale: Dans ce contexte narratif, l’expression situe vraisemblablement le repos pendant le gouvernement d’Asa. Une traduction strictement littérale serait obscure en français et pourrait suggérer à tort une proximité spatiale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire historique « hauts lieux » et le motif biblique du « repos », tout en rendant idiomatiquement la dernière expression hébraïque.
