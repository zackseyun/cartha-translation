  source_fidelity: 'Le rendu du butin animalier est fidèle : צֹאן est bien rendu par « petit bétail », ce qui préserve son sens collectif, et לָרֹב porte naturellement sur ce groupe. « Emmenèrent comme butin » rend de façon idiomatique la saisie des animaux. Pour אָהֳלֵי מִקְנֶה, « des éleveurs » spécifie des personnes que l’hébreu ne nomme pas explicitement ; « campements pastoraux » conserve mieux le caractère concret et l’ambiguïté de l’expression.'
