  text: וְ/גַם אָהֳלֵ֥י מִקְנֶ֖ה הִכּ֑וּ וַ/יִּשְׁבּ֨וּ צֹ֤אן לָ/רֹב֙ וּ/גְמַלִּ֔ים וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: fr
  text: Ils attaquèrent aussi les campements pastoraux[a] et emmenèrent comme butin du petit bétail en très grand nombre[b], ainsi que des chameaux. Puis ils retournèrent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les tentes du bétail ». L’expression peut désigner des campements pastoraux ou des camps d’éleveurs.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne collectivement le petit bétail, notamment les moutons et les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Rend la valeur additive qui rattache cette action aux événements précédents.
- source_word: אָהֳלֵי מִקְנֶה
  choice: les campements des éleveurs
  rationale: Littéralement « les tentes du bétail »; l’expression désigne vraisemblablement des campements pastoraux liés aux troupeaux. Cette formulation naturelle en français conserve ce référent sans laisser entendre que les animaux eux-mêmes habitaient des tentes.
- source_word: הִכּוּ
  choice: frappèrent
  rationale: Le verbe נכה signifie couramment « frapper » et peut, dans un contexte militaire, évoquer une attaque. « Frappèrent » conserve ici la vigueur et la relative indétermination de l’hébreu.
- source_word: וַיִּשְׁבּוּ
  choice: emmenèrent comme butin
  rationale: Le verbe שבה signifie normalement « faire captif ». Puisque son objet est ici constitué d’animaux, cette expression française transmet naturellement l’idée de leur capture et de leur saisie comme butin.
- source_word: צֹאן
  choice: du petit bétail
  rationale: צֹאן est un collectif pouvant englober les moutons et les chèvres. « Petit bétail » préserve mieux cette étendue sémantique que le seul mot « moutons ».
- source_word: לָרֹב
  choice: en très grand nombre
  rationale: Expression française naturelle qui souligne l’abondance des animaux saisis.
- source_word: וּגְמַלִּים
  choice: ainsi que des chameaux
  rationale: Rend clairement le second type d’animaux coordonné au petit bétail.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Puis ils retournèrent à Jérusalem
  rationale: « Puis » marque naturellement la progression narrative portée par le wayyiqtol.
