  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: fr
  text: Il dit aux Judéens de rechercher le Seigneur, le Dieu de leurs ancêtres, et de mettre en pratique la Loi et le commandement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Il ordonna aux Judéens
  rationale: Dans ce contexte royal, אָמַר suivi de ל peut exprimer un ordre. « Les Judéens » désigne naturellement les habitants de Juda et évite de présenter le territoire comme un interlocuteur.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה
  choice: de rechercher le Seigneur
  rationale: דָּרַשׁ signifie ici se tourner activement vers Dieu pour le connaître, l'adorer et suivre sa volonté. « Rechercher » conserve cette richesse. Le tétragramme est rendu selon la convention française courante « le Seigneur ».
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs ancêtres
  rationale: « Ancêtres » communique naturellement le sens collectif de אָבוֹת en français moderne sans restreindre la référence aux pères immédiats.
- source_word: וְלַעֲשׂוֹת הַתּוֹרָה וְהַמִּצְוָה
  choice: et de mettre en pratique la Loi et le commandement
  rationale: עָשָׂה appliqué à des prescriptions signifie les accomplir ou les mettre en pratique. La coordination singulière « la Loi et le commandement » est conservée.
theological_decisions:
- issue: Portée de « rechercher le Seigneur »
  choice: Conserver le verbe « rechercher » sans explicitation doctrinale
  alternative: « se tourner vers le Seigneur » ou « adorer le Seigneur »
  rationale: Le terme hébreu englobe plusieurs dimensions de la fidélité à Dieu; une paraphrase plus précise réduirait indûment sa portée.
- issue: Relation entre la Loi et le commandement
  choice: Maintenir les deux noms coordonnés au singulier
  alternative: « ses lois et ses commandements »
  rationale: Le texte hébreu porte littéralement « la torah et le commandement »; le pluriel et le possessif constitueraient une harmonisation interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Ordonna » rend la force contextuelle du discours royal; « mettre en pratique » est idiomatique tout en restant proche de l'hébreu.
