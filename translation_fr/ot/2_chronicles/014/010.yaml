  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: fr
  text: 'Asa cria vers Yahweh, son Dieu, et dit : « Yahweh, nul autre que toi ne peut secourir le puissant comme celui qui est sans force[a]. Secours-nous, Yahweh, notre Dieu, car nous nous appuyons sur toi, et c’est en ton nom que nous sommes venus affronter cette multitude. Yahweh, notre Dieu, toi, ne permets pas qu’un mortel l’emporte sur toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Pour toi, il n’y a pas de différence quand il s’agit de secourir, qu’on soit nombreux ou sans force. » L’hébreu de cette proposition est condensé et peut mettre l’accent soit sur le nombre, soit sur la puissance.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Ne permets pas à un mortel de te résister » ; le sens du verbe hébreu est incertain ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: cria vers
  rationale: Dans le contexte d’une prière pressante, קרא אל exprime un appel fervent adressé à Dieu. « Cria vers » conserve cette intensité sans ajouter de contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, plutôt que substitution par un titre.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: nul autre que toi ne peut secourir
  rationale: Cette tournure française naturelle exprime l’exclusivité du secours divin suggérée par l’expression hébraïque compacte, tout en laissant la note signaler une autre analyse possible.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: le puissant comme celui qui est sans force
  rationale: La formulation conserve le contraste entre רַב et l’absence de force sans décider explicitement si רַב désigne avant tout la puissance ou le grand nombre.
- source_word: עָזְרֵנוּ
  choice: Secours-nous
  rationale: Impératif direct et digne, naturel dans une prière.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: car nous nous appuyons sur toi
  rationale: « S’appuyer sur » conserve la métaphore de נשען tout en exprimant clairement la confiance.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: c’est en ton nom que nous sommes venus
  rationale: « En ton nom » rend l’idée d’agir sous l’autorité de Dieu et dans la dépendance envers lui; la tournure emphatique correspond à l’ordre hébreu.
- source_word: הֶהָמוֹן הַזֶּה
  choice: cette multitude
  rationale: Rend le grand rassemblement ennemi sans ajouter un terme militaire absent du lexème lui-même.
- source_word: אַתָּה
  choice: c’est toi qui es notre Dieu
  rationale: Le pronom indépendant est compris comme emphatique après « Yahweh, notre Dieu »; la reformulation française rend l’identification sans ajouter un nouvel attribut.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: Ne permets pas à l’homme mortel de l’emporter sur toi
  rationale: Dans ce contexte de bataille, עצר est compris au sens de tenir tête ou prévaloir. « Homme mortel » fait entendre la fragilité contenue dans אֱנוֹשׁ.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; sa translittération préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Relation entre la force humaine et le secours divin
  choice: nul autre que toi ne peut secourir le puissant comme celui qui est sans force
  alternative: pour toi, il n’y a pas de différence quand il s’agit de secourir, qu’on soit nombreux ou sans force
  rationale: L’hébreu est très condensé et permet plusieurs articulations. Le texte principal souligne l’unicité du secours divin, tandis que la note préserve la lecture portant sur l’indifférence du nombre ou de la force.
- issue: Portée de אֱנוֹשׁ
  choice: l’homme mortel
  alternative: un mortel / l’être humain
  rationale: Le singulier générique est conservé et sa nuance de faiblesse mortelle est rendue explicitement, sans en faire un individu déterminé.
- issue: Emphase de אַתָּה après le vocatif
  choice: Yahweh, c’est toi qui es notre Dieu
  alternative: Yahweh, notre Dieu, toi, ne permets pas…
  rationale: La tournure française explicite l’emphase du pronom indépendant sans résoudre la phrase par l’ajout d’un attribut théologique absent.
translation_notes:
  register: Français international moderne, naturel et soutenu. Le tutoiement convient à la prière biblique. « Yahweh » conserve le nom divin; « multitude » et « homme mortel » gardent la solennité sans archaïsme excessif. Les ambiguïtés des deux propositions difficiles sont signalées en notes plutôt que résolues silencieusement.
