  to: 'Asa cria vers Yahweh, son Dieu, et dit : « Yahweh, nul autre que toi ne peut secourir le puissant comme celui qui est sans force[a]. Secours-nous, Yahweh, notre Dieu, car nous nous appuyons sur toi, et c’est en ton nom que nous sommes venus affronter cette multitude. Yahweh, notre Dieu, toi, ne permets pas qu’un mortel l’emporte sur toi[b]. »'
