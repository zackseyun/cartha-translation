  terminology: « Yahweh », « notre Dieu », « secours-nous », « nous nous appuyons sur toi » et « en ton nom » conviennent au registre et aux termes sources. La reprise emphatique « toi » doit être conservée sans lui attribuer une copule absente du texte.
