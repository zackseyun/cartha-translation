source:
  edition: WLC
  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: fr
  text: Il enleva les autels étrangers et les hauts lieux, brisa les pierres dressées et abattit les ashéras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les poteaux sacrés d’Ashéra ». Le terme hébreu désigne des objets cultuels associés au culte d’Ashéra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Il enleva
  rationale: La forme causative de סור exprime ici l’action concrète d’ôter ou de faire disparaître. « Enleva » est naturel et n’ajoute pas l’idée juridique d’une abolition.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: les autels étrangers
  rationale: נֵכָר qualifie ici des autels liés à un culte étranger ou non légitime, plutôt que des autels appartenant simplement à des étrangers.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: בָּמוֹת désigne des lieux de culte, souvent aménagés sur une hauteur. « Hauts lieux » est le terme français établi dans ce contexte cultuel.
- source_word: וַיְשַׁבֵּר
  choice: brisa
  rationale: שׁבר indique une destruction énergique par bris. « Brisa » restitue sobrement cette action décisive.
- source_word: הַמַּצֵּבוֹת
  choice: les pierres dressées
  rationale: מַצֵּבוֹת désigne des pierres ou piliers érigés ayant ici une fonction cultuelle. « Pierres dressées » décrit concrètement ces objets sans leur attribuer une sainteté reconnue par le narrateur.
- source_word: וַיְגַדַּע
  choice: abattit
  rationale: גדע signifie couper ou abattre, notamment un objet de bois. « Abattit » convient aux objets cultuels probablement ligneux et évite une formulation pesante.
- source_word: הָאֲשֵׁרִים
  choice: les ashéras
  rationale: Le pluriel hébreu désigne des objets cultuels associés à Ashéra, sans permettre de déterminer dans tous les cas s’il s’agit précisément de poteaux, d’arbres stylisés ou d’autres symboles. La translittération francisée préserve cette indétermination.
theological_decisions:
- issue: Sens précis de הָאֲשֵׁרִים dans le contexte de la réforme cultuelle
  choice: les ashéras
  alternative: les poteaux sacrés d’Ashéra
  rationale: Le texte condamne clairement ces objets cultuels, mais leur forme exacte reste discutée. « Ashéras » conserve la spécificité historique et religieuse du terme sans trancher indûment la nature matérielle des objets; la note fournit l’interprétation courante.
translation_notes:
  register: Français moderne, sobre et digne. La succession de verbes au passé simple conserve le rythme narratif et la fermeté des mesures prises. Le marqueur de note est placé après « ashéras », terme auquel la note se rapporte.
