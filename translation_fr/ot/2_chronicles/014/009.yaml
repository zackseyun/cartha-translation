  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: fr
  text: Asa sortit à sa rencontre[a], et ils se rangèrent en ordre de bataille[b] dans la vallée de Tsephata, à Marésha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant lui » ; on peut aussi comprendre : « pour l’affronter » ou « contre lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « ils disposèrent leurs troupes pour le combat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא décrit ici le mouvement d’Asa qui sort avec ses forces face à l’armée adverse. « Sortit » reste proche de l’hébreu sans expliciter excessivement la nuance militaire.
- source_word: לְפָנָיו
  choice: à sa rencontre
  rationale: Littéralement « devant lui » ou « en sa présence » ; dans ce contexte militaire, l’expression indique qu’Asa avance pour faire face à l’adversaire. « À sa rencontre » est naturel en français et conserve la possibilité d’une confrontation, signalée en note.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: ils se rangèrent en ordre de bataille
  rationale: ערך associé à מלחמה désigne la disposition des troupes en vue du combat. Cette formulation française exprime clairement la mise en formation militaire.
- source_word: בְּגֵיא
  choice: dans la vallée de
  rationale: גיא désigne une vallée ou un ravin. « Vallée » est le terme géographique courant et accessible ici.
- source_word: צְפַתָה
  choice: Tsephata
  rationale: Nom de lieu translittéré en français moderne, avec « Ts » pour représenter la consonne initiale צ.
- source_word: לְמָרֵשָׁה
  choice: près de Marésha
  rationale: La préposition לְ devant le nom de lieu situe vraisemblablement la vallée par rapport à Marésha. « Près de » rend clairement ce rapport géographique sans faire de la vallée une partie de la ville.
