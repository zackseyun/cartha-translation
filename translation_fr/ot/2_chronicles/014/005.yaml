id: 2CH.14.5
reference: 2 Chronicles 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: fr
  text: Il bâtit des villes fortifiées en Juda, car le pays était tranquille et il ne connut aucune guerre[a] durant ces années-là, parce que Yahweh lui avait accordé le repos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait pas de guerre avec lui ». L’expression hébraïque peut désigner plus généralement l’absence de guerre impliquant Asa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le wayyiqtol de בנה poursuit le récit par une action passée d’Asa. L’omission de la conjonction initiale donne un récit naturel en français.
- source_word: עָרֵי מְצוּרָה
  choice: des villes fortifiées
  rationale: Cette construction désigne des villes pourvues de fortifications; « villes fortifiées » est l’expression française courante et précise.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition est locative et « en Juda » est la tournure française idiomatique pour ce territoire.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: le pays était tranquille
  rationale: שקט exprime le calme et l’absence de troubles. « Tranquille » conserve cette image sans réduire le sens à un traité de paix.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: il ne connut aucune guerre[a]
  rationale: Cette formulation française naturelle exprime l’absence de guerre impliquant Asa, tout en signalant par une note l’ambiguïté de l’expression avec עִם.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: durant ces années-là
  rationale: La formule situe l’absence de guerre dans la période évoquée par le récit; « ces années-là » convient au recul narratif français.
- source_word: הֵנִיחַ
  choice: avait accordé le repos
  rationale: Le hiphil de נוח signifie ici faire bénéficier quelqu’un du repos, notamment à l’abri des conflits. Le plus-que-parfait rend clairement ce don divin comme la cause de la situation décrite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom est le complément indirect de הֵנִיחַ et renvoie à Asa.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Le repos comme action divine
  choice: Yahweh lui avait accordé le repos
  alternative: Yahweh lui avait donné la tranquillité
  rationale: « Repos » conserve le motif biblique de נוח et attribue sans ambiguïté à Yahweh la sécurité dont Asa bénéficie, sans préciser au-delà du texte la nature exacte de ce repos.
translation_notes:
  register: Français international moderne, naturel et digne. « Bâtit » convient au registre historique sans être obscur; « pays » rend הָאָרֶץ dans son sens territorial. La répétition causale de כִּי est conservée par « car » puis « parce que », avec une légère variation idiomatique.
