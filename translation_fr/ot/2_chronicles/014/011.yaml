id: 2CH.14.11
reference: 2 Chronicles 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: fr
  text: Yahweh frappa les Koushites devant Asa et devant Juda[a], et les Koushites s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Éthiopiens ». L’hébreu emploie l’ethnonyme « Koushites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: frappa
  rationale: Dans ce contexte militaire, נָגַף exprime l’action de frapper et, par là, de mettre l’ennemi en déroute. « Frappa » conserve la vigueur et l’action divine du verbe sans réduire le sens au seul résultat « vainquit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: הַכּוּשִׁים
  choice: les Koushites
  rationale: « Koushites » reproduit directement l’ethnonyme hébreu et évite de l’identifier trop rapidement aux Éthiopiens au sens géographique moderne.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition signifie ici « devant », avec la nuance militaire de céder face à l’avancée d’Asa et de Juda. La répétition hébraïque est conservée.
- source_word: אָסָא
  choice: Asa
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle; dans ce contexte, le nom désigne collectivement le royaume ou les hommes de Juda.
- source_word: וַיָּנֻסוּ
  choice: s’enfuirent
  rationale: Le verbe נוּס signifie fuir. « S’enfuirent » rend clairement et naturellement cette déroute dans un récit au passé simple.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et ne le remplace pas par un titre.
- issue: Portée de l’action exprimée par נָגַף
  choice: frappa
  alternative: vainquit
  rationale: « Frappa » maintient l’image concrète et l’attribution directe de l’action à Yahweh; « vainquit » expliciterait davantage le résultat militaire, mais atténuerait cette image.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit historique. La structure répétée « devant Asa et devant Juda » suit volontairement l’hébreu et laisse à « Juda » son sens collectif.
