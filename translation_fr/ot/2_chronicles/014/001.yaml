source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: fr
  text: Asa fit ce qui est bon et juste aux yeux de Yahweh, son Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux yeux de Yahweh »; expression hébraïque signifiant « selon le regard ou le jugement de Yahweh ».'
    reason: explication_d_un_idiotisme
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Dans cette formule d’évaluation de la conduite, עשה signifie « faire »; le passé simple convient au registre narratif français.
- source_word: אָסָא
  choice: Asa
  rationale: Translittération française usuelle du nom propre.
- source_word: הַטּוֹב
  choice: ce qui est bon
  rationale: La tournure substantivée désigne une conduite jugée bonne; cette formulation est naturelle et conserve la valeur morale du terme.
- source_word: וְהַיָּשָׁר
  choice: et juste
  rationale: Dans ce contexte éthique, יָשָׁר qualifie ce qui est droit ou juste; « juste » s’intègre naturellement au binôme « bon et juste ».
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression conserve l’image de l’idiome hébreu tout en restant courante en français; elle exprime le point de vue ou le jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel plutôt que remplacé par un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Malgré la forme morphologiquement plurielle d’אֱלֹהִים, l’accord et le référent exigent ici le singulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; l’idiome « aux yeux de » est conservé et expliqué en note.
