  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: fr
  text: 'Il dit à Juda : « Bâtissons ces villes, entourons-les d’une muraille et de tours, et munissons-les de portes et de barres, tant que le pays est encore devant nous[a], car nous avons cherché Yahweh, notre Dieu. Nous l’avons cherché, et il nous a donné du repos de tous côtés. » Ils bâtirent donc et connurent le succès.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car le pays est encore devant nous ». L’expression peut indiquer que l’occasion reste ouverte ou que le territoire demeure libre de toute menace.'
    reason: La relation logique de la proposition et la portée de l’expression hébraïque permettent une lecture causale aussi bien qu’une nuance temporelle.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Il dit à Juda
  rationale: « Juda » désigne ici, par métonymie, le peuple ou le royaume. La formulation conserve la forme concise de l’hébreu et reste intelligible en français.
- source_word: נִבְנֶה
  choice: Bâtissons
  rationale: La forme cohortative exprime une exhortation ou une résolution commune. « Bâtissons » en restitue directement la force sans suggérer une reconstruction.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ces villes
  rationale: Le terme désigne des agglomérations urbaines et le contexte de fortification favorise « villes ».
- source_word: וְנָסֵב
  choice: entourons-les
  rationale: Le hiphil de סבב signifie ici entourer ou ceindre. Le pronom reprend naturellement les villes en français.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: d’une muraille, de tours, de portes et de barres
  rationale: La liste décrit les ouvrages défensifs. Le singulier « muraille » suit l’hébreu; « portes » convient aux accès d’une ville et « barres » désigne leurs dispositifs de fermeture.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: tant que le pays est encore devant nous
  rationale: Cette traduction conserve l’idée temporelle de « encore » ainsi que l’image du pays placé devant eux, sans préciser excessivement s’il est disponible, libre ou à l’abri des menaces.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: car nous avons cherché Yahweh, notre Dieu
  rationale: דרשׁ appliqué à Dieu exprime ici une démarche de recherche, de fidélité et de dépendance, et non une simple demande d’information.
- source_word: דָּרַשְׁנוּ
  choice: Nous l’avons cherché
  rationale: La répétition emphatique de l’hébreu est maintenue; le pronom reprend naturellement Yahweh.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: il nous a accordé le repos de tous côtés
  rationale: La formulation rend l’idée d’un repos ou d’un répit accordé tout autour, sans ajouter explicitement des ennemis que le texte ne nomme pas.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: Ils bâtirent donc et connurent le succès
  rationale: La proposition finale rapporte le résultat. « Connurent le succès » restitue l’aboutissement favorable exprimé par צלח et reste naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom propre plutôt que de lui substituer un titre.
- issue: Sens de la recherche de Dieu exprimée par דרשׁ
  choice: chercher Yahweh
  alternative: consulter Yahweh
  rationale: Dans ce contexte, le verbe peut englober une orientation fidèle et dépendante envers Dieu. « Chercher » conserve cette portée plus large sans la réduire à une demande d’oracle.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la répétition emphatique de « chercher » et l’image volontairement ouverte du pays « devant nous ». Le passé simple convient au registre narratif biblique sans archaïsme excessif.
