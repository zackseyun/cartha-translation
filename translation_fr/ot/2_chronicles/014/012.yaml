  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: fr
  text: Asa et le peuple qui était avec lui les poursuivirent jusqu’à Guérar. Les Koushites[a] tombèrent, sans qu’aucun d’eux ne reste en vie, car ils furent brisés devant Yahweh et devant son armée[b]. Puis ils emportèrent un très grand butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Éthiopiens ». L’hébreu dit « Koushites », c’est-à-dire les gens de Koush.
    reason: lexical_alternative
  - marker: b
    text: Ou « son camp ». Le mot hébreu peut désigner un camp ou une armée. Le pronom peut renvoyer à l’armée d’Asa, mais certains comprennent ici l’armée de Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: les poursuivirent
  rationale: Le verbe רדף désigne normalement une poursuite, notamment militaire. Le pluriel français s’accorde naturellement avec le sujet composé « Asa et le peuple ».
- source_word: עַד לִגְרָר
  choice: jusqu’à Guérar
  rationale: עַד suivi d’un lieu indique ici le point atteint par la poursuite.
- source_word: מִכּוּשִׁים
  choice: les Koushites
  rationale: Le terme désigne les gens de Koush. « Koushites » conserve la référence ethnogéographique sans l’identifier de façon anachronique à l’Éthiopie moderne.
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: sans qu’aucun d’eux reste en vie
  rationale: Cette formulation française naturelle exprime l’absence totale de survivants indiquée par l’hébreu.
- source_word: נִשְׁבְּרוּ
  choice: furent brisés
  rationale: Le passif de שבר dépeint une défaite militaire complète tout en conservant l’image forte du texte hébreu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » préserve l’expression spatiale et théologique hébraïque, tandis que « Yahweh » rend directement le nom divin.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: et devant son armée
  rationale: מַחֲנֶה peut désigner un camp ou une armée. Dans ce contexte de bataille et de poursuite, « armée » exprime naturellement la force combattante, sans éliminer l’autre sens, signalé en note.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: Puis ils emportèrent un très grand butin
  rationale: נשא avec שׁלל exprime l’action d’emporter les biens pris à l’ennemi, et הַרְבֵּה מְאֹד en souligne fortement l’abondance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » conserve le caractère de nom propre sans substituer un titre.
- issue: Référent du suffixe dans מַחֲנֵהוּ
  choice: « son armée », probablement celle d’Asa
  alternative: « son camp » ou l’armée de Yahweh
  rationale: Le contexte peut naturellement rattacher le suffixe à Asa et distinguer l’action de Yahweh de celle de la force humaine. Cependant, l’hébreu ne fixe pas entièrement le référent, et la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement narratif hébreu; les termes techniques ou potentiellement ambigus sont expliqués en notes plutôt que résolus silencieusement.
