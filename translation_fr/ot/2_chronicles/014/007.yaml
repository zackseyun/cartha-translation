  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: fr
  text: Asa avait une armée de 300 000 hommes de Juda, équipés de grands boucliers et de lances, et de 280 000 hommes de Benjamin, équipés de boucliers et maniant l’arc. Tous étaient de vaillants guerriers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes forts et vaillants ». L’expression hébraïque désigne couramment des combattants reconnus pour leur force et leur courage.
    reason: alternative lexicale
lexical_decisions:
- source_word: חַיִל
  choice: armée
  rationale: Dans ce dénombrement militaire, le mot désigne l’ensemble des forces dont Asa disposait, et non la richesse ou la valeur abstraite.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: équipés de grands boucliers et de lances
  rationale: Le participe décrit l’armement des soldats. « Grands boucliers » rend צִנָּה et le distingue de מָגֵן dans la seconde partie du verset.
- source_word: מִיהוּדָה / מִבִּנְיָמִן
  choice: hommes de Juda / hommes de Benjamin
  rationale: La préposition indique l’origine tribale. L’ajout explicite de « hommes » produit une formulation française naturelle dans ce dénombrement de soldats.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: maniant l’arc
  rationale: L’expression évoque littéralement l’action de tendre ou de bander l’arc et désigne des archers. « Maniant l’arc » reste naturel sans réduire l’expression au seul geste de décocher une flèche.
- source_word: גִּבּוֹרֵי חָיִל
  choice: de vaillants guerriers
  rationale: Cette expression militaire courante désigne des combattants forts et courageux. La formulation française est actuelle, digne et conserve à la fois l’idée guerrière et celle de vaillance.
theological_decisions:
- issue: Expression masculine et militaire גִּבּוֹרֵי חָיִל
  choice: de vaillants guerriers
  alternative: des hommes forts et vaillants
  rationale: Le contexte est celui d’un dénombrement militaire masculin. « Guerriers » rend clairement cette réalité sans introduire de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Les nombres sont présentés selon l’usage typographique français. Le marqueur de note est placé après l’expression qu’il explique.
