base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: fr
  text: Salomon décida[a] de bâtir une maison pour le nom de Yahweh, et une maison pour son royaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dit ». Avec l’infinitif « bâtir », l’expression peut aussi signifier qu’il résolut ou ordonna de bâtir.'
    reason: ambiguïté lexicale et syntaxique
  - marker: b
    text: 'On peut aussi traduire : « un temple pour le nom de Yahweh et un palais pour sa royauté ». L’hébreu répète littéralement « maison » dans les deux propositions.'
    reason: précision contextuelle et répétition lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: décida
  rationale: Le verbe signifie littéralement « dire », mais, suivi ici de l’infinitif « bâtir », il exprime naturellement une décision ou une résolution. « Décida » donne en français courant le sens probable de la construction sans exclure les autres nuances, signalées en note.
- source_word: לִבְנוֹת
  choice: de bâtir
  rationale: L’infinitif construit de בנה signifie directement « bâtir ». « Bâtir » convient au registre solennel sans être archaïque.
- source_word: בַּיִת ... וּבַיִת
  choice: une maison ... et une maison
  rationale: La répétition du même nom hébreu est conservée. Le contexte permet de comprendre qu’il s’agit respectivement du temple et du palais, possibilités explicitées en note.
- source_word: לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  rationale: Cette formulation préserve l’expression théologique hébraïque qui associe le sanctuaire au nom divin sans suggérer que Dieu y serait contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לְמַלְכוּתוֹ
  choice: pour son royaume
  rationale: מַלְכוּת peut désigner le royaume, la royauté ou le règne. « Pour son royaume » reste proche de l’hébreu et conserve une certaine amplitude de sens.
theological_decisions:
- issue: Formule du temple liée au nom divin
  choice: pour le nom de Yahweh
  alternative: pour le nom du Seigneur
  rationale: Le texte porte explicitement le tétragramme et présente la maison comme bâtie pour son nom. La formulation choisie conserve à la fois le nom personnel et l’idiome théologique.
- issue: Interprétation des deux occurrences de בַּיִת
  choice: une maison ... et une maison
  alternative: un temple ... et un palais
  rationale: La répétition lexicale du texte hébreu est théologiquement et littérairement pertinente. Les fonctions distinctes des deux bâtiments sont indiquées par leurs compléments et précisées en note.
translation_notes:
  register: Français international moderne, clair et digne. « Décida de bâtir » évite le tour peu naturel « dit de bâtir », tandis que les notes préservent l’ambiguïté du verbe hébreu et les lectures contextuelles « temple » et « palais ».
