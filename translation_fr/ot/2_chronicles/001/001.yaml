id: 2CH.1.1
reference: 2 Chronicles 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: fr
  text: Salomon, fils de David, s’affermit à la tête de son royaume[a]. Yahweh[b], son Dieu, était avec lui et le rendit extrêmement grand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devint puissant sur son royaume » ou « fut établi sur son royaume ».
    reason: lexical_alternative
  - marker: b
    text: Nom divin représenté en hébreu par les quatre consonnes YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: s’affermit
  rationale: Le hitpael de חזק peut exprimer le fait de devenir fort ou de s’affermir. « S’affermit » conserve la nuance réflexive ou intransitive sans transformer la proposition en passif.
- source_word: עַל מַלְכוּתוֹ
  choice: à la tête de son royaume
  rationale: עַל marque ici la position d’autorité de Salomon par rapport au royaume. Cette formulation rend naturellement en français l’idée de domination, tout en conservant « royaume » pour מַלְכוּת.
- source_word: בֶן דָּוִיד
  choice: fils de David
  rationale: Traduction directe qui préserve l’accent dynastique du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin YHWH, plutôt que substitution par un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: La construction possessive est rendue directement et conserve la relation personnelle exprimée en hébreu.
- source_word: עִמּוֹ
  choice: était avec lui
  rationale: Expression française naturelle correspondant à la présence et à la faveur divines.
- source_word: וַיְגַדְּלֵהוּ
  choice: le rendit … grand
  rationale: 'Le piel de גדל avec suffixe objet a un sens causatif : rendre quelqu’un grand, l’élever ou l’exalter.'
- source_word: לְמָעְלָה
  choice: extrêmement
  rationale: Employé adverbialement, לְמָעְלָה intensifie ici l’action de rendre grand.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Rôle respectif de Salomon et de Dieu dans son élévation
  choice: Conserver à la fois l’affermissement de Salomon et l’action de Dieu qui le rend grand
  alternative: Présenter uniquement Salomon comme bénéficiaire passif, ou attribuer son élévation uniquement à ses propres efforts
  rationale: L’hébreu juxtapose l’affermissement de Salomon dans l’exercice du pouvoir et l’action de Yahweh qui est avec lui et le rend grand. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « S’affermit à la tête de son royaume » évite le calque peu naturel « se fortifia sur son royaume », tandis que « le rendit extrêmement grand » conserve le causatif et l’intensité de l’hébreu.
