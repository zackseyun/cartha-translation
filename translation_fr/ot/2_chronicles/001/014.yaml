review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la succession des actions, les nombres et la répartition des chars et des cavaliers. Toutefois, « auprès du roi » atténue la formulation hébraïque « avec le roi » et peut évoquer seulement la proximité; « avec le roi à Jérusalem » est plus direct et plus fidèle.
  naturalness: Le français est globalement naturel et de registre sobre. « Cantonna » est possible, mais son complément « dans les villes de chars » peut laisser croire que seuls les cavaliers sont concernés; « les y affecta » conserve l’antécédent collectif et exprime naturellement l’idée de placement/affectation.
  terminology: '« Chars » et « cavaliers » sont des équivalents justes. La note a doit être corrigée: les פָּרָשִׁים ne sont pas seulement des « hommes montés », mais des cavaliers, c’est-à-dire des hommes à cheval; l’alternative « hommes montés » est peu naturelle. « Villes de chars » reste une formulation acceptable, éclairée par la note culturelle.'
  issues:
  - severity: low
    issue: Rendu de וְעִם הַמֶּלֶךְ
    rationale: « Auprès du roi » est légèrement plus interprétatif que « avec le roi » et ne reproduit pas aussi clairement la relation exprimée par עִם.
  - severity: low
    issue: Formulation de la note a
    rationale: « Hommes montés » est inhabituel en français moderne et la définition « des hommes qui montent des chevaux » est lourde. Une note peut simplement signaler « cavalerie » comme autre rendu possible.
  revised_text: Salomon rassembla des chars et des cavaliers[a] ; il avait 1 400 chars et 12 000 cavaliers. Il les affecta dans les villes de chars[b] et avec le roi à Jérusalem.
  revised_footnotes:
