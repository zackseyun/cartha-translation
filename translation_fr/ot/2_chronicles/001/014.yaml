revisions:
- from: Salomon rassembla des chars et des cavaliers[a]. Il avait 1 400 chars et 12 000 cavaliers. Il les cantonna dans les villes de chars[b] et auprès du roi, à Jérusalem.
  to: Salomon rassembla des chars et des cavaliers[a] ; il avait 1 400 chars et 12 000 cavaliers. Il les affecta dans les villes de chars[b] et avec le roi à Jérusalem.
  rationale: La révision conserve intégralement le sens et les chiffres du texte hébreu. Elle remplace « auprès du roi » par « avec le roi » pour suivre plus exactement la préposition hébraïque, et clarifie la note lexicale sur « cavaliers ». « Affecta » rend de façon neutre et moderne le placement des forces et du matériel dans des lieux désignés.
