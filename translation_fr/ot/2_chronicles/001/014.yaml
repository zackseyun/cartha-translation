  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: fr
  text: Salomon rassembla des chars et des cavaliers[a] ; il avait 1 400 chars et 12 000 cavaliers. Il les affecta dans les villes de chars[b] et avec le roi à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cavalerie ». Le terme hébreu désigne des cavaliers, c’est-à-dire des hommes à cheval.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire des villes réservées au stationnement ou à l’entreposage des chars.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Le verbe אסף signifie « rassembler, recueillir ». Dans ce contexte, « rassembla » exprime naturellement la constitution de ressources militaires sans préciser indûment comment elles furent acquises.
- source_word: רֶכֶב
  choice: chars
  rationale: רֶכֶב peut désigner collectivement les chars ou les unités de chars. Puisque le texte en donne le nombre exact, le pluriel concret « chars » convient le mieux.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le terme désigne normalement des hommes montés plutôt que les chevaux eux-mêmes. « Cavaliers » est à la fois précis, naturel et moins marqué par le vocabulaire militaire moderne que « cavalerie ».
- source_word: וַיְהִי לוֹ
  choice: Il avait
  rationale: Littéralement, la tournure signifie « il y eut pour lui ». « Il avait » rend idiomatiquement la possession en français.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1 400 chars
  rationale: La quantité exacte est conservée et présentée selon les conventions typographiques françaises.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12 000 cavaliers
  rationale: La quantité exacte est conservée et présentée selon les conventions typographiques françaises.
- source_word: וַיַּנִּיחֵם
  choice: Il les cantonna
  rationale: La forme causative du verbe נוח exprime ici l’affectation de forces et de matériel à des lieux déterminés. « Cantonna » convient au contexte militaire tout en restant intelligible.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: dans les villes de chars
  rationale: Cette formulation concise garde l’expression hébraïque, qui désigne des villes servant au stockage ou au stationnement des chars. Une note en explicite la fonction.
- source_word: וְעִם הַמֶּלֶךְ
  choice: et auprès du roi
  rationale: L’hébreu dit simplement « et avec le roi ». « Auprès du roi » rend clairement la présence d’une partie de ces forces là où se trouvait le roi, sans ajouter explicitement « une partie ».
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Forme française usuelle du nom propre et préposition naturelle avec une ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les phrases courtes suivent la progression narrative de l’hébreu. « Cantonna » maintient la nuance militaire, tandis que les notes éclairent les termes susceptibles de ne pas être immédiatement transparents.
