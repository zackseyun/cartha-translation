    reason: cultural_note
  revision_rationale: La révision conserve intégralement le sens et les chiffres du texte hébreu. Elle remplace « auprès du roi » par « avec le roi » pour suivre plus exactement la préposition hébraïque, et clarifie la note lexicale sur « cavaliers ». « Affecta » rend de façon neutre et moderne le placement des forces et du matériel dans des lieux désignés.
