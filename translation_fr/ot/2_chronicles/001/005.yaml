    issue: « demeure de Yahvé » pour מִשְׁכַּן יְהוָה
    rationale: « Demeure » traduit une composante sémantique possible de מִשְׁכָּן, mais ne désigne pas assez explicitement le tabernacle/sanctuaire cultuel concret. « Tabernacle de Yahvé » préserve mieux le référent du texte.
  - severity: low
    issue: « fils d’Ouri et petit-fils de Hour »
    rationale: Cette reformulation explicite un rapport généalogique probable, mais le texte hébreu répète volontairement « fils de ». Le conserver évite d’aplanir la formulation source.
  - severity: medium
    issue: La note propose « ils s’y rendirent » comme lecture du suffixe.
    rationale: Cette formulation ne correspond pas directement au verbe דרשׁ avec suffixe objet. La note doit limiter les possibilités aux référents Yahvé ou l’autel, sans introduire cette paraphrase.
