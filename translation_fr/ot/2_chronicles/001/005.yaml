  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris l’ambiguïté du suffixe de וַיִּדְרְשֵׁהוּ. Toutefois, « demeure » affaiblit le référent cultuel précis de מִשְׁכָּן, et la paraphrase généalogique « petit-fils » interprète une construction que l’hébreu formule explicitement « fils de …, fils de … ».
  naturalness: Le français est fluide. « Tabernacle » est à la fois usuel et plus précis dans ce contexte. « Le recherchèrent » reste recevable et conserve l’ambiguïté voulue.
  terminology: « Autel de bronze », « Yahvé », « assemblée » et les noms propres sont appropriés. Le terme « tabernacle » convient mieux que « demeure » pour le sanctuaire mobile désigné par מִשְׁכָּן.
  issues:
