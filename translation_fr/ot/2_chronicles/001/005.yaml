revisions:
- from: L’autel de bronze que Betsaléel, fils d’Ouri et petit-fils de Hour, avait fabriqué se trouvait là, devant la demeure de Yahvé. Salomon et l’assemblée le recherchèrent[a].
  to: L’autel de bronze que Betsaléel, fils d’Ouri, fils de Hour, avait fabriqué se trouvait devant le tabernacle de Yahvé, et Salomon et l’assemblée le recherchèrent[a].
  rationale: La révision emploie le terme cultuel précis « tabernacle », conserve la chaîne de filiation telle qu’elle est exprimée en hébreu et corrige la note afin qu’elle expose l’ambiguïté réelle du suffixe sans ajouter une lecture non directement portée par le verbe.
