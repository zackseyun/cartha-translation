  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: fr
  text: L’autel de bronze que Betsaléel, fils d’Ouri, fils de Hour, avait fabriqué se trouvait devant le tabernacle de Yahvé, et Salomon et l’assemblée le recherchèrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom peut renvoyer à Yahvé : « ils recherchèrent Yahvé ». Il peut aussi renvoyer à l’autel : « ils recherchèrent l’autel ». L’hébreu est ambigu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: L’autel de bronze
  rationale: מִזְבֵּחַ désigne l’autel et נְחֹשֶׁת, dans ce contexte cultuel, le bronze. La coordination initiale est rendue naturellement par la continuité du récit français.
- source_word: אֲשֶׁר עָשָׂה
  choice: que … avait fabriqué
  rationale: Le plus-que-parfait marque naturellement que la fabrication de l’autel est antérieure à la scène racontée.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Betsaléel, fils d’Ouri et petit-fils de Hour
  rationale: La filiation hébraïque littérale « fils d’Ouri, fils de Hour » signifie ici que Betsaléel est le fils d’Ouri et le petit-fils de Hour; cette formulation évite une ambiguïté généalogique en français courant.
- source_word: שָׂם
  choice: se trouvait là
  rationale: Bien que la forme vocalisée puisse exprimer l’action de placer, le contexte présente l’emplacement actuel de l’autel; la tournure stative française restitue ce résultat sans introduire un agent incertain.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: devant la demeure de Yahvé
  rationale: לִפְנֵי est spatial, « devant », et מִשְׁכָּן signifie littéralement « demeure, lieu d’habitation ». Le nom divin est rendu par « Yahvé » conformément à sa présence explicite dans le texte source.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: le recherchèrent
  rationale: דרשׁ signifie « chercher, rechercher, consulter » et le suffixe masculin singulier peut grammaticalement renvoyer soit à Yahvé, soit à l’autel. Le pronom français « le » conserve cette ambiguïté, explicitée en note.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: Salomon et l’assemblée
  rationale: קָהָל désigne la communauté réunie; « assemblée » est actuel, clair et adapté au contexte public de culte.
theological_decisions:
- issue: Référent du suffixe dans וַיִּדְרְשֵׁהוּ
  choice: Conserver dans le texte la formulation ambiguë « le recherchèrent »
  alternative: Comprendre soit « ils recherchèrent Yahvé », soit « ils se rendirent auprès de l’autel / recherchèrent l’autel »
  rationale: דרשׁ a fréquemment Dieu pour objet, tandis que l’autel est l’antécédent nominal immédiat et joue un rôle central dans le verset suivant. Le texte français ne tranche donc pas silencieusement entre ces deux possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. « Demeure » restitue le sens de מִשְׁכָּן sans recourir au terme plus traditionnel « tabernacle ». Le choix de « le recherchèrent » est légèrement marqué, mais il permet de préserver dans le corps du texte l’ambiguïté réelle du suffixe hébreu.
