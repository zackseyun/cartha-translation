base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: fr
  text: Maintenant, donne-moi la sagesse et la connaissance, afin que je puisse sortir et entrer devant ce peuple[a]. Car qui est capable de juger ce grand peuple qui est le tien[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « sortir et entrer devant ce peuple » : expression décrivant l’exercice public du commandement.'
    reason: cultural_note
  - marker: b
    text: Ou « ton grand peuple ». Ici, « grand » peut aussi signifier « nombreux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque la transition vers la demande de Salomon; « Maintenant » en rend directement la valeur temporelle et discursive.
- source_word: חָכְמָה וּמַדָּע
  choice: la sagesse et la connaissance
  rationale: Maintient la distinction entre la capacité avisée de gouverner et la connaissance, sans fondre les deux termes en une seule notion.
- source_word: תֶּן לִי
  choice: donne-moi
  rationale: Rend simplement et directement l’impératif hébreu; « accorde-moi » serait possible, mais plus soutenu.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: afin que je puisse sortir et rentrer
  rationale: Les formes verbales expriment ici le but de la demande. Cette formulation conserve les deux mouvements de l’expression hébraïque, employée à propos de l’exercice public du commandement.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: devant ce peuple
  rationale: Rend le sens spatial de לִפְנֵי tout en laissant percevoir, dans ce contexte royal, la notion de direction du peuple.
- source_word: מִי יִשְׁפֹּט
  choice: qui est capable de juger
  rationale: Le verbe signifie « juger » et peut inclure ici l’exercice du gouvernement et de la justice. La tournure interrogative exprime une incapacité rhétorique, explicitée naturellement en français par « est capable de ».
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: ce grand peuple qui est le tien
  rationale: Préserve à la fois le démonstratif, l’adresse à Dieu et l’adjectif « grand », qui peut évoquer aussi bien l’importance du peuple que son grand nombre.
theological_decisions:
- issue: Expression royale « sortir et rentrer devant le peuple »
  choice: Conserver l’image hébraïque dans le texte et en expliquer la portée dans une note.
  alternative: « diriger ce peuple » ou « gouverner ce peuple »
  rationale: L’explicitation communiquerait clairement la fonction visée, mais supprimerait l’image choisie par le texte. La note permet de préserver à la fois la forme et le sens.
- issue: Portée du verbe שׁפט dans le contexte royal
  choice: Employer « juger » sans le réduire à « gouverner ».
  alternative: « gouverner »
  rationale: Le jugement royal comprend l’administration de la justice et peut s’étendre au gouvernement; « juger » conserve le lien lexical et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve volontairement l’image hébraïque de la conduite royale, avec une note pour éviter qu’elle soit comprise comme un simple déplacement physique.
