  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: fr
  text: 'Dieu dit à Salomon : « Puisque tu avais cela à cœur et que tu n’as demandé ni richesse, ni biens, ni honneur, ni la vie de ceux qui te haïssent, ni même une longue vie[a], mais que tu as demandé pour toi sagesse et connaissance afin de juger mon peuple sur lequel je t’ai établi roi, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de nombreux jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Introduit naturellement en français la cause de la réponse divine.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: telle était l’intention de ton cœur
  rationale: Conserve l’image biblique du cœur tout en exprimant clairement la disposition intérieure visée par l’idiome hébreu.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: richesse, biens, ni honneur
  rationale: Distingue la richesse des possessions concrètes et rend כָבוֹד par le statut et l’estime propres au contexte royal.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: la vie de ceux qui te haïssent
  rationale: Suit de près le singulier collectif et le participe hébreux sans les réduire au terme plus général « ennemis ».
- source_word: יָמִים רַבִּים
  choice: de nombreux jours
  rationale: Préserve l’expression hébraïque, avec une note signalant le sens idiomatique possible.
- source_word: חָכְמָה וּמַדָּע
  choice: sagesse et connaissance
  rationale: Maintient la distinction entre les deux termes hébreux.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: afin de juger
  rationale: Rend la finalité de la demande et conserve le sens judiciaire du verbe plutôt que de le généraliser en « gouverner ».
- source_word: הִמְלַכְתִּיךָ עָלָיו
  choice: sur lequel je t’ai établi roi
  rationale: Exprime clairement l’action divine d’investir Salomon de la royauté sur le peuple.
theological_decisions:
- issue: Désignation du locuteur divin אֱלֹהִים
  choice: Dieu
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte אֱלֹהִים et non le nom divin YHWH.
- issue: Portée de שׁפט dans la fonction royale
  choice: juger
  alternative: gouverner
  rationale: « Juger » respecte le verbe hébreu et laisse subsister le lien entre justice et gouvernement royal sans l’expliciter excessivement.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase et sa fin ouverte sont conservées, car le verset se poursuit syntaxiquement au verset 12. L’expression « l’intention de ton cœur » évite le calque peu naturel « cela était avec ton cœur » tout en gardant l’image du cœur.
