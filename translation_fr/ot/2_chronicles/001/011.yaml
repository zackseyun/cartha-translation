  terminology: « Dieu », « richesse », « biens », « honneur », « la vie de ceux qui te haïssent », « sagesse », « connaissance » et « juger » sont appropriés. « Ni même » rend naturellement וְגַם dans la série négative sans ajouter de sens doctrinal.
