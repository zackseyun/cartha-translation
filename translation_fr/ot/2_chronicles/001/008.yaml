reference: 2 Chronicles 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: fr
  text: 'Salomon dit à Dieu : « Tu as manifesté un grand amour fidèle[a] envers David, mon père, et tu m’as établi roi à sa place. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande bonté » ou « une grande fidélité ». Le mot hébreu חֶסֶד peut désigner un amour loyal et durable, notamment dans le cadre d’une alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Salomon dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « Et ».
- source_word: לֵאלֹהִים
  choice: à Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne clairement le Dieu auquel Salomon s’adresse.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: tu as manifesté un grand amour fidèle envers
  rationale: L’expression décrit une action empreinte de חֶסֶד envers quelqu’un. « Amour fidèle » conserve à la fois les dimensions relationnelle, loyale et durable du terme, sans rendre explicite dans le corps du texte une notion d’alliance qui demeure contextuelle.
- source_word: דָּוִיד אָבִי
  choice: David, mon père
  rationale: Cette formulation suit l’ordre hébreu et reste naturelle en français ; la virgule marque l’apposition.
- source_word: וְהִמְלַכְתַּנִי
  choice: et tu m’as établi roi
  rationale: Le hifil de מלך exprime ici le fait de faire régner quelqu’un. « Établi roi » restitue clairement la valeur causative et l’action divine.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession royale, תחת signifie que Salomon règne à la place de David, sans suggérer nécessairement une éviction violente.
theological_decisions:
- issue: Traduction de חֶסֶד dans le contexte des rapports de Dieu avec David
  choice: un grand amour fidèle
  alternative: une grande fidélité à l’alliance ; une grande bonté
  rationale: Le contexte davidique peut évoquer l’alliance, mais חֶסֶד réunit ici amour, bonté et loyauté sans que le mot « alliance » figure dans le verset. « Amour fidèle » préserve cette richesse et la tension interprétative ; la note signale les autres traductions légitimes.
- issue: Formulation de la succession royale
  choice: tu m’as établi roi à sa place
  alternative: tu m’as fait régner après lui
  rationale: La formulation retenue maintient l’action directe de Dieu exprimée par la forme causative, tout en rendant naturellement la succession de Salomon à David.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Amour fidèle » est naturel, théologiquement sobre et suffisamment ample pour rendre la polysémie de חֶסֶד.
