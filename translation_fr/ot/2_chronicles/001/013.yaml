  text: וַ/יָּבֹ֨א שְׁלֹמֹ֜ה לַ/בָּמָ֤ה אֲשֶׁר בְּ/גִבְעוֹן֙ יְר֣וּשָׁלִַ֔ם מִ/לִּ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַ/יִּמְלֹ֖ךְ עַל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: fr
  text: Puis Salomon revint[a] à Jérusalem depuis le haut lieu qui se trouvait à Gabaon, après avoir quitté l’espace devant la tente de la rencontre[b], et il régna sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « vint » ou « alla », selon le point de vue adopté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de devant la tente de la rencontre » ; cette expression spatiale désigne le départ de l’espace du sanctuaire situé devant la tente.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: revint
  rationale: Le verbe בוא peut signifier « venir », « aller » ou « entrer » selon le point de vue. Le contexte indique ici le retour de Salomon à Jérusalem après son séjour à Gabaon ; « revint » exprime naturellement ce mouvement en français.
- source_word: לַבָּמָה
  choice: le haut lieu
  rationale: במה désigne un lieu de culte situé sur une hauteur. « Haut lieu » est le terme français traditionnel et précis, sans ajouter ici de jugement négatif absent du verset.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: qui se trouvait à Gabaon
  rationale: Cette proposition relative situe simplement le haut lieu. « Se trouvait » évite une tournure française pesante tout en conservant l'information.
- source_word: יְרוּשָׁלִַם
  choice: à Jérusalem
  rationale: Malgré l'ordre très resserré de l'hébreu, Jérusalem est la destination du déplacement, conformément à la syntaxe comprise dans son contexte immédiat.
- source_word: מִלִּפְנֵי
  choice: quittant … devant
  rationale: Littéralement « de devant ». La formulation « quittant … devant la tente » rend en français le départ depuis l'espace situé devant le sanctuaire, sans assimiler le haut lieu à la tente elle-même.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression transparente conserve l'idée d'une tente associée à la rencontre fixée avec Dieu. Elle évite le terme plus interprétatif « tabernacle ».
- source_word: וַיִּמְלֹךְ
  choice: il régna
  rationale: Le qal de מלך signifie « régner » ou parfois « devenir roi ». Salomon étant déjà roi dans le contexte, « régna » convient à la continuation du récit.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: « Régner sur » est l'équivalent français naturel de la construction מלך על.
theological_decisions:
- issue: Rapport syntaxique de « Jérusalem » dans une phrase hébraïque à l'ordre très resserré
  choice: Salomon revient à Jérusalem depuis le haut lieu de Gabaon
  alternative: Reproduire l'ordre des mots de façon à laisser « Jérusalem » apposé de manière obscure après « Gabaon »
  rationale: Le contexte précédent place Salomon à Gabaon et soutient nettement son retour à Jérusalem. La traduction explicite ce mouvement sans ajouter un nouvel événement.
- issue: Caractère cultuel du haut lieu de Gabaon
  choice: Traduire lexicalement « le haut lieu » sans connotation polémique ajoutée
  alternative: « Le sanctuaire du haut lieu » ou une formulation explicitement négative
  rationale: Le verset associe ce lieu à la tente de la rencontre et ne le condamne pas ici. Il convient de préserver cette présentation sans importer une évaluation issue d'autres contextes.
- issue: Relation spatiale entre le haut lieu et la tente de la rencontre
  choice: Présenter Salomon comme quittant l'espace situé devant la tente
  alternative: Identifier directement le haut lieu à la tente de la rencontre
  rationale: מִלִּפְנֵי est une expression spatiale signifiant « de devant ». La traduction maintient la proximité cultuelle sans affirmer une identité que la formulation hébraïque ne formule pas explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. « Revint » clarifie le mouvement contextuel ; « quittant … devant » rend idiomatiquement l'expression spatiale hébraïque tout en préservant sa nuance. La seconde proposition demeure distincte afin de conserver le rythme narratif.
