  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕א סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ מִ/קְוֵ֥א יִקְח֖וּ בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: fr
  text: Les chevaux de Salomon provenaient d’Égypte et de Qoué[a] ; les marchands du roi les achetaient à Qoué[b] pour un prix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et d’un dépôt ». Le terme hébreu est difficile et peut désigner soit Qoué, probablement une région de Cilicie, soit un lieu de rassemblement ou un dépôt.'
    reason: alternative_reading
  - marker: b
    text: 'Selon l’autre compréhension du terme hébreu : « les marchands du roi les achetaient à un dépôt pour un prix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: Les chevaux de Salomon provenaient
  rationale: Dans ce contexte commercial, מוֹצָא indique la provenance ou la source. Cette formulation française rend naturellement la relation possessive exprimée par אֲשֶׁר לִשְׁלֹמֹה.
- source_word: מִמִּצְרָיִם וּמִקְוֵא
  choice: d’Égypte et de Qoué
  rationale: מִצְרָיִם est le nom usuel de l’Égypte. Le terme difficile מִקְוֵא est compris ici comme un toponyme, probablement Qoué en Cilicie, tout en signalant l’autre analyse en note.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: les marchands du roi
  rationale: Le participe substantivé désigne des commerçants ou marchands ; « marchands » convient au contexte d’acquisition de chevaux.
- source_word: יִקְחוּ
  choice: les achetaient
  rationale: Le verbe signifie littéralement « prendre, acquérir ». La présence de בִּמְחִיר rend explicite une transaction commerciale, ce qui justifie « achetaient » en français.
- source_word: בִּמְחִיר
  choice: pour un prix fixé
  rationale: L’expression signifie « à un prix, contre paiement ». « Pour un prix fixé » rend le sens commercial et correspond à l’usage parallèle de 1 Rois 10.28, sans préciser qui fixait le prix.
