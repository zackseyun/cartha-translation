  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: fr
  text: Salomon et toute l’assemblée qui était avec lui se rendirent au haut lieu de Gabaon, car c’est là que se trouvait la tente de la Rencontre de Dieu, celle que Moïse, serviteur de Yahweh, avait faite dans le désert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: se rendirent
  rationale: Le wayyiqtol de הלך fait avancer le récit. « Se rendirent » exprime naturellement le déplacement vers le lieu indiqué sans ajouter une montée absente du verbe.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קהל désigne ici la communauté rassemblée; « assemblée » en conserve le sens collectif dans un français actuel.
- source_word: לַבָּמָה
  choice: au haut lieu
  rationale: במה désigne un lieu cultuel situé sur une hauteur. « Haut lieu » est le terme français établi et ne lui impose pas ici une valeur péjorative.
- source_word: בְּגִבְעוֹן
  choice: de Gabaon
  rationale: La préposition est rendue idiomatiquement avec le nom du lieu; « Gabaon » est la forme française traditionnelle et intelligible du toponyme.
- source_word: כִּי שָׁם הָיָה
  choice: car c’est là que se trouvait
  rationale: כִּי introduit la raison du déplacement, et cette tournure française restitue clairement l’accent locatif porté par שָׁם.
- source_word: אֹהֶל מוֹעֵד הָאֱלֹהִים
  choice: la tente de la rencontre avec Dieu
  rationale: מועד évoque la rencontre fixée ou assignée. Cette formulation conserve le lien syntaxique avec « Dieu » et rend la fonction du sanctuaire plus transparente que le seul terme traditionnel « tabernacle ».
- source_word: עָשָׂה
  choice: avait faite
  rationale: Le plus-que-parfait situe correctement la fabrication de la tente avant l’action principale du récit.
- source_word: עֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: « Serviteur » convient à ce titre honorifique de Moïse; le nom divin est conservé comme nom propre.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne la région non cultivée où se déroule le séjour d’Israël; « désert » est naturel et exact en français moderne.
theological_decisions:
- issue: Valeur de במה dans un contexte de culte antérieur à la construction du Temple
  choice: haut lieu
  alternative: sanctuaire sur la hauteur
  rationale: Le terme est traduit sans ajouter de condamnation, puisque le verset explique que la tente de la rencontre se trouvait alors à Gabaon.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le tétragramme comme nom personnel; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Relation de הָאֱלֹהִים avec אֹהֶל מוֹעֵד
  choice: la tente de la rencontre avec Dieu
  alternative: la tente de la rencontre de Dieu
  rationale: L’hébreu permet une relation génitivale concise. Le français choisi explicite naturellement Dieu comme celui avec qui a lieu la rencontre sans développer davantage la fonction théologique du sanctuaire.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase garde l’enchaînement causal de l’hébreu, emploie le passé simple pour l’action principale et le plus-que-parfait pour l’action antérieure. Aucun marqueur de note n’est nécessaire.
