revisions:
- from: 'Cette nuit-là, Dieu apparut à Salomon et lui dit : « Demande-moi ce que je dois te donner[a]. »'
  to: 'Cette nuit-là, Dieu apparut à Salomon et lui dit : « Demande ce que je te donnerai[a]. »'
