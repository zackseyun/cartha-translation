  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: fr
  text: 'Cette nuit-là, Dieu apparut à Salomon et lui dit : « Demande ce que je te donnerai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Demande ce que je devrais te donner. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Cette nuit-là
  rationale: Expression temporelle naturelle en français moderne, qui rend exactement la référence à cette nuit précise.
- source_word: נִרְאָה
  choice: apparut
  rationale: Le nifal de ראה désigne ici une apparition divine. « Apparut » reste direct sans ajouter l’idée explicative de révélation de soi.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le verbe au singulier et le contexte désignent le Dieu unique; le singulier français convient.
- source_word: לִשְׁלֹמֹה
  choice: à Salomon
  rationale: La préposition ל marque ici la personne à qui Dieu apparaît.
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Formulation française idiomatique et fidèle à אמר accompagné du pronom indirect.
- source_word: שְׁאַל
  choice: Demande-moi
  rationale: En français, « demander » requiert normalement l’indication du destinataire ou de la chose demandée. L’ajout de « moi », implicite dans la parole directe de Dieu, rend l’invitation naturelle sans la restreindre.
- source_word: מָה אֶתֶּן לָךְ
  choice: ce que je dois te donner
  rationale: Cette tournure naturelle comprend מָה comme l’objet de l’impératif « Demande » et exprime la nuance délibérative de l’inaccompli אֶתֶּן. Une traduction plus littérale est signalée en note.
theological_decisions:
- issue: Sens de אֱלֹהִים dans le récit d’une apparition divine
  choice: Dieu
  alternative: des dieux
  rationale: L’accord verbal au singulier et le contexte narratif imposent un référent singulier, sans qu’il soit nécessaire d’ajouter une précision doctrinale.
- issue: Nuance de מָה אֶתֶּן לָךְ après l’impératif
  choice: ce que je dois te donner
  alternative: ce que je te donnerai
  rationale: L’hébreu permet une nuance délibérative ou future. Le texte principal privilégie une formulation française naturelle, tandis que la note conserve l’autre possibilité sans trancher davantage.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La ponctuation française et le dialogue direct assurent une lecture fluide.
