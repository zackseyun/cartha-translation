review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la référence temporelle, l’apparition divine, Salomon et l’invitation à demander sont fidèles. Toutefois, « Demande-moi » ajoute explicitement un complément absent de l’hébreu, et « ce que je dois te donner » peut suggérer une obligation plus marquée que l’inaccompli délibératif/futur אֶתֶּן. Une formulation plus directe préserve mieux l’ouverture de l’original.'
  naturalness: « Cette nuit-là », « Dieu apparut à Salomon » et « lui dit » sont naturels dans un français biblique moderne et sobre. « Demande ce que je te donnerai » est clair dans ce contexte et évite l’ajout de « moi ».
  terminology: « Dieu » pour אֱלֹהִים et « Salomon » sont corrects. Le passé simple « apparut » convient au registre narratif biblique écrit international.
  issues:
  - severity: medium
    issue: Ajout de « moi » dans « Demande-moi »
    rationale: L’impératif hébreu שְׁאַל n’exprime pas ici le destinataire de la demande. Celui-ci est certes évident dans le discours direct, mais l’ajout n’est pas nécessaire et réduit légèrement la concision ouverte de l’invitation.
  - severity: medium
    issue: « je dois te donner » marque une obligation possible
    rationale: L’inaccompli אֶתֶּן peut être compris comme futur ou délibératif (« que te donnerai-je ? »). « Je dois » peut évoquer une nécessité ou un devoir qui n’est pas explicitement posé par le texte. « Je te donnerai » rend le futur sans imposer cette nuance.
  revised_text: 'Cette nuit-là, Dieu apparut à Salomon et lui dit : « Demande ce que je te donnerai[a]. »'
  revised_footnotes:
  - marker: a
    text: 'Ou : « Demande ce que je devrais te donner. »'
    reason: lexical_alternative
  revision_rationale: La révision retire l’objet implicite ajouté à l’impératif et remplace « je dois » par le futur, qui correspond plus directement à l’inaccompli hébreu. La note maintient la possibilité d’une lecture délibérative sans la présenter comme la seule interprétation.
