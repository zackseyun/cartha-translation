base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: fr
  text: Ils importaient d’Égypte un char pour six cents sicles d’argent[a], et un cheval pour cent cinquante sicles. De même, ils les exportaient, par leur intermédiaire[b], à tous les rois des Hittites et des rois d’Aram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ils faisaient monter et sortir d’Égypte. » Les verbes hébreux ordinaires de mouvement ont ici un sens commercial.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par leur main », expression qui désigne l’intermédiaire ou les agents par lesquels l’opération était effectuée.'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « Aram » ; traduction traditionnelle : « Syrie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Ils importaient d’Égypte
  rationale: Les deux verbes signifient littéralement « faire monter » et « faire sortir ». Dans ce contexte de commerce et de prix, « importaient » exprime naturellement le mouvement des marchandises depuis l’Égypte, tandis que la note conserve la formulation concrète de l’hébreu.
- source_word: מֶרְכָּבָה
  choice: un char
  rationale: Le singulier désigne ici une unité commerciale dont le prix est indiqué.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: pour six cents sicles d’argent
  rationale: L’hébreu donne littéralement une somme de « six cents [unités] d’argent » ; « sicles » explicite l’unité de poids monétaire sous-entendue.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: et un cheval pour cent cinquante sicles
  rationale: סוּס est le terme ordinaire pour « cheval ». L’unité « sicles », sous-entendue après le premier prix, est répétée en français pour éviter toute ambiguïté.
- source_word: וְכֵן
  choice: De même
  rationale: Cette expression relie la seconde opération commerciale à la première et indique que le même procédé s’appliquait aux autres rois.
- source_word: בְּיָדָם
  choice: par leur intermédiaire
  rationale: L’expression signifie littéralement « par leur main » et marque ici l’agence. « Par leur intermédiaire » rend clairement l’idiome sans préciser davantage l’identité des agents que ne le fait le texte.
- source_word: יוֹצִיאוּ
  choice: on en exportait
  rationale: Le verbe signifie « faire sortir ». Dans ce contexte commercial, « exportait » en restitue le sens, tandis que le pronom indéfini évite d’attribuer à tort l’action à un sujet explicitement nommé.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: à destination de tous les rois des Hittites et des rois d’Aram
  rationale: La préposition לְ indique ici les destinataires de l’exportation. « Aram » conserve le nom hébreu plutôt que son équivalent traditionnel « Syrie ».
