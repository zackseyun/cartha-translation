  register: Français international moderne, clair et digne. L’imparfait présente la pratique commerciale habituelle décrite dans le contexte. « Char », « sicle » et les noms historiques conservent la précision du cadre ancien ; les verbes commerciaux rendent idiomatiquement le mouvement des biens.
