source:
  edition: WLC
  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: fr
  text: La sagesse et la connaissance te sont accordées. Je te donnerai aussi des richesses, des biens et de l’honneur, comme aucun des rois qui t’ont précédé n’en a eu et comme aucun de ceux qui viendront après toi n’en aura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "Plus littéralement : « cela n’a pas été ainsi pour les rois qui étaient avant toi, et après toi cela ne sera pas ainsi »\uFEFF."
    reason: La note conserve le tour comparatif peu explicite de l’hébreu, tandis que le texte principal en donne une formulation française naturelle.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: la sagesse
  rationale: « Sagesse » est l’équivalent courant de חָכְמָה. L’article défini hébreu est conservé naturellement en français.
- source_word: הַמַּדָּע
  choice: la connaissance
  rationale: מַדָּע désigne la connaissance ou le savoir. « Connaissance » forme avec « sagesse » un couple clair sans préciser excessivement la nature de ce savoir.
- source_word: נָתוּן לָךְ
  choice: te sont accordées
  rationale: Le participe passif exprime un don désormais octroyé. « Sont accordées » convient au contexte d’une réponse divine et respecte l’accord avec les deux noms coordonnés.
- source_word: עֹשֶׁר
  choice: des richesses
  rationale: עֹשֶׁר désigne la richesse matérielle. Le pluriel français « richesses » est idiomatique dans cette énumération royale.
- source_word: נְכָסִים
  choice: des biens
  rationale: נְכָסִים renvoie aux possessions ou aux propriétés. « Biens » est actuel, précis et distinct de « richesses ».
- source_word: כָבוֹד
  choice: de l’honneur
  rationale: Dans ce contexte royal, כָבוֹד désigne l’honneur ou le prestige accordé au roi. « Honneur » évite de suggérer ici la gloire proprement divine.
- source_word: אֶתֶּן לָךְ
  choice: Je te donnerai aussi
  rationale: L’imparfait hébreu a une valeur future de promesse. « Aussi » rend la coordination avec le don déjà accordé de la sagesse et de la connaissance.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: comme aucun des rois qui t’ont précédé n’en a eu
  rationale: Cette formulation française exprime naturellement la comparaison hébraïque, dont le tour littéral est « cela n’a pas été ainsi pour les rois qui étaient avant toi ». Le pronom « en » renvoie aux bienfaits énumérés.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: et comme aucun de ceux qui viendront après toi n’en aura
  rationale: Le contexte royal permet de reprendre implicitement « rois ». La formulation conserve la comparaison future sans transformer le verset en affirmation générale sur toute la personne de Salomon.
theological_decisions:
- issue: Portée de la comparaison avec les autres rois
  choice: La supériorité annoncée porte sur les dons énumérés dans le verset.
  alternative: Comprendre que Salomon lui-même sera sans égal à tous égards parmi les rois.
  rationale: La proposition comparative suit immédiatement la liste de la sagesse, de la connaissance, des richesses, des biens et de l’honneur. Le pronom français « en » maintient ce lien et évite d’élargir la promesse au-delà de ce qu’énonce le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de Dieu à Salomon. La répétition comparative est maintenue pour refléter l’équilibre entre les rois antérieurs et postérieurs.
