source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: fr
  text: 'Salomon s’adressa[a] à tout Israël : aux chefs de milliers et de centaines[b], aux juges et à tous les dirigeants de tout Israël, les chefs des maisons paternelles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dit à ».'
    reason: lexical_alternative
  - marker: b
    text: Les « milliers » et les « centaines » désignent probablement des unités militaires ou administratives.
    reason: cultural_note
  - marker: c
    text: Les « maisons paternelles » étaient des groupes familiaux organisés selon l’ascendance paternelle.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: s’adressa
  rationale: Le verbe signifie formellement « dit », mais, devant une série de destinataires introduits par לְ, « s’adressa à » exprime naturellement en français une prise de parole publique.
- source_word: לְכָל יִשְׂרָאֵל
  choice: à tout Israël
  rationale: Cette formulation conserve la désignation collective et nationale du texte hébreu.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: aux chefs de milliers et de centaines
  rationale: « Chefs » rend le terme large שָׂרִים sans imposer une fonction exclusivement militaire. La formulation conserve les nombres et l’ambiguïté entre unités militaires et administratives.
- source_word: וְלַשֹּׁפְטִים
  choice: aux juges
  rationale: Le terme désigne ici la fonction reconnue de ceux qui jugent et exercent une autorité en Israël.
- source_word: וּלְכֹל נָשִׂיא לְכָל יִשְׂרָאֵל
  choice: et à tous les dirigeants de tout Israël
  rationale: נָשִׂיא peut désigner un chef, un prince ou un dirigeant. « Dirigeants » convient au contexte administratif sans suggérer à tort qu’ils appartiennent à une dynastie royale. Le singulier distributif hébreu est rendu naturellement par un pluriel français.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: les chefs des maisons paternelles
  rationale: Cette expression conserve l’organisation familiale patrilinéaire évoquée par l’hébreu. Elle est laissée en apposition aux « dirigeants », conformément à la syntaxe du verset.
theological_decisions:
- issue: Expression familiale et administrative הָאָבוֹת
  choice: maisons paternelles
  alternative: maisons ancestrales ; familles
  rationale: Le choix préserve le caractère masculin de l’expression sociale hébraïque et sa texture historique, sans transformer ces groupes de parenté en simples familles nucléaires modernes.
- issue: Rapport entre les dirigeants et les chefs des maisons paternelles
  choice: 'apposition : « les chefs des maisons paternelles » précise qui sont les dirigeants'
  alternative: comprendre les chefs des maisons paternelles comme un groupe supplémentaire
  rationale: L’absence d’une nouvelle préposition devant רָאשֵׁי favorise l’apposition, mais la formulation française reste assez proche de l’hébreu pour ne pas surdéterminer le rapport syntaxique.
translation_notes:
  register: Français international actuel, digne et accessible. « S’adressa » convient à une proclamation publique ; « chefs » et « dirigeants » évitent des titres modernes trop précis. La ponctuation rend lisible l’énumération tout en maintenant l’apposition finale.
