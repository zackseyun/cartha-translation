base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: fr
  text: Le roi fit que l’argent et l’or soient aussi abondants à Jérusalem que les pierres[a], et que les cèdres soient aussi abondants que les sycomores du Bas-Pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut traduire plus littéralement : « comme les pierres » et « comme les sycomores… en abondance ». L’hébreu exprime ici une abondance extraordinaire au moyen de comparaisons.'
    reason: lexical_alternative
  - marker: b
    text: Le « Bas-Pays », ou Shéphéla, est la région de collines basses située entre les montagnes de Judée et la plaine côtière.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: rendit… aussi abondants
  rationale: 'Dans cette construction avec un objet direct et une comparaison, נתן a une valeur causative ou résultative : le roi fit en sorte que ces biens deviennent extrêmement abondants. Cette tournure restitue naturellement l’idiome hébreu.'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: l’argent et l’or
  rationale: Les deux noms désignent ici les métaux précieux comme richesses ou matières disponibles. Les articles français conviennent à la construction définie de l’hébreu.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition française « à » exprime naturellement la localisation dans une ville.
- source_word: כָּאֲבָנִים
  choice: aussi abondants… que les pierres
  rationale: Littéralement « comme les pierres ». La formulation explicite la valeur quantitative de la comparaison sans suggérer que les métaux auraient été transformés en pierres.
- source_word: הָאֲרָזִים
  choice: les cèdres
  rationale: Ce choix conserve le pluriel concret de l’hébreu, tout en laissant ouverte la possibilité contextuelle qu’il s’agisse des arbres ou du bois de cèdre disponible.
- source_word: כַּשִּׁקְמִים
  choice: aussi abondants que les sycomores
  rationale: שִׁקְמִים désigne les sycomores-figuiers répandus dans cette région. « Sycomores » est le terme biblique français usuel et précis.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: du Bas-Pays
  rationale: שְׁפֵלָה est ici un nom régional désignant la zone de collines basses entre les montagnes de Judée et la plaine côtière. « Bas-Pays » conserve le sens du nom hébreu, avec une note géographique.
- source_word: לָרֹב
  choice: aussi abondants
  rationale: L’expression signifie « en abondance ». Elle est intégrée à la comparaison en français afin d’éviter une finale lourde tout en conservant l’idée d’une quantité extraordinaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « aussi abondants » explicite l’idiome quantitatif hébreu, tandis que « les cèdres » préserve la formulation concrète et sa possible référence aux arbres ou au bois.
