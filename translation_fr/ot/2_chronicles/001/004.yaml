source:
  edition: WLC
  text: אֲבָ֗ל אֲר֤וֹן הָ/אֱלֹהִים֙ הֶעֱלָ֤ה דָוִיד֙ מִ/קִּרְיַ֣ת יְעָרִ֔ים בַּֽ/הֵכִ֥ין ל֖/וֹ דָּוִ֑יד כִּ֧י נָֽטָה ל֛/וֹ אֹ֖הֶל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: fr
  text: Mais David avait fait monter l’arche de Dieu de Qiryath-Yéarim jusqu’au lieu qu’il lui avait préparé[a], car il avait dressé pour elle une tente à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « vers ce que David avait préparé pour elle ». L’expression hébraïque est condensée; le sens est que David avait fait monter l’arche au lieu qu’il avait aménagé pour elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Mais
  rationale: Marque le contraste avec l’autel de bronze mentionné au verset précédent, qui se trouvait à Gabaon, tandis que l’arche était à Jérusalem.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: l’arche de Dieu
  rationale: Rend directement la construction hébraïque et correspond à l’expression française biblique usuelle.
- source_word: הֶעֱלָה
  choice: avait fait monter
  rationale: Le hifil de עלה exprime ici l’action de faire monter ou d’apporter l’arche; le plus-que-parfait rend l’antériorité explicative dans le récit.
- source_word: מִקִּרְיַת יְעָרִים
  choice: depuis Qiryath-Yéarim
  rationale: Translittération française du nom de lieu; «depuis» indique clairement le point de départ du déplacement.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: jusqu’au lieu qu’il lui avait préparé
  rationale: L’expression hébraïque est condensée. «Au lieu» explicite naturellement la destination sous-entendue, tandis que le pronom renvoie à l’arche.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication de la préparation du lieu.
- source_word: נָטָה לוֹ אֹהֶל
  choice: il avait dressé pour elle une tente
  rationale: נטה avec אהל signifie dresser ou déployer une tente. «Dresser une tente» est naturel et précis en français.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française «à» est l’usage idiomatique avec un nom de ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste initial et l’image concrète de la tente, tout en explicitant avec mesure la destination sous-entendue par l’hébreu.
