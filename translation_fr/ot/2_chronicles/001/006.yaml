source:
  edition: WLC
  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: fr
  text: Salomon monta là, vers l’autel de bronze qui se trouvait devant Yahweh, à la tente de la Rencontre, et il y offrit mille holocaustes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: monta là
  rationale: Le verbe עלה exprime un mouvement ascendant, et שָׁם renvoie au lieu mentionné dans le contexte. « Monta là » conserve ce sens directionnel sans alourdir la phrase.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: Dans ce contexte cultuel, « bronze » est le terme français traditionnel et naturel pour נְחֹשֶׁת, même si le mot hébreu peut aussi désigner le cuivre ou un alliage cuivreux.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי peut exprimer la position ou la présence. La formulation concise « devant Yahweh » conserve cette amplitude.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle en français, conformément au principe du projet qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: celui de la tente de la rencontre
  rationale: Le ל peut marquer l’association ou l’appartenance de l’autel à la tente. Cette formulation française reste concise; la valeur locative possible est signalée en note.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: il y offrit ... holocaustes
  rationale: Dans ce second emploi, עלה appartient au langage sacrificiel et désigne l’action de faire monter l’offrande sur l’autel. « Offrit » en restitue naturellement le sens.
- source_word: עֹלוֹת אָלֶף
  choice: mille holocaustes
  rationale: « Holocaustes » est le terme français établi pour les sacrifices entièrement brûlés, et אָלֶף indique littéralement le nombre mille.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahweh » préserve le caractère de nom propre sans importer une substitution confessionnelle traditionnelle.
- issue: Relation de l’autel avec la tente de la rencontre
  choice: celui de la tente de la rencontre
  alternative: qui se trouvait à la tente de la rencontre
  rationale: La préposition ל permet une lecture associative aussi bien que locative. Le texte principal retient l’association, tandis que la note maintient visible l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. « Tente de la rencontre » rend אֹהֶל מוֹעֵד de manière transparente. La répétition française est évitée par « il y offrit », tandis que la distinction entre les deux emplois du verbe עלה est conservée.
