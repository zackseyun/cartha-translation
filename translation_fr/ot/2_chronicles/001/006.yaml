revisions:
- from: Salomon monta là jusqu’à l’autel de bronze devant Yahweh, celui de la tente de la rencontre[a], et il y offrit mille holocaustes.
  to: Salomon monta là, vers l’autel de bronze qui se trouvait devant Yahweh, à la tente de la Rencontre, et il y offrit mille holocaustes.
