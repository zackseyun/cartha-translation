  variant: modern international French
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: fr
  text: Maintenant, Yahweh Dieu, que ta parole donnée à David, mon père, soit confirmée[a], car tu m’as établi roi sur un peuple aussi nombreux que la poussière de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « soit établie ». Dans ce contexte, on peut aussi comprendre : « que ta promesse donnée à David, mon père, se réalise ».'
    reason: Le niphal de אמן peut évoquer la confirmation ou l’établissement; « parole » peut avoir ici le sens contextuel de promesse.
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marque temporelle et discursive qui introduit la demande de Salomon, sans ajouter de conjonction absente de l’hébreu.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Rend directement le nom divin יהוה par « Yahweh » et conserve אֱלֹהִים comme désignation apposée.
- source_word: יֵאָמֵן
  choice: que … s’accomplisse
  rationale: Le niphal de אמן exprime ici le souhait que la parole divine soit confirmée, établie dans sa vérité et menée à réalisation. « S’accomplisse » est naturel dans cette prière et convient au contexte de la promesse dynastique.
- source_word: דְּבָרְךָ
  choice: ta parole
  rationale: Conserve le terme hébreu דבר sans expliciter exclusivement « promesse », tout en laissant apparaître son sens promissoire par la tournure « parole donnée ».
- source_word: עִם דָּוִיד אָבִי
  choice: donnée à David, mon père
  rationale: Dans cette construction, עִם indique la personne envers qui la parole a été engagée. Cette formulation est idiomatique en français et évite le calque obscur « avec David ».
- source_word: כִּי
  choice: car
  rationale: Introduit le motif sur lequel Salomon fonde sa demande.
- source_word: הִמְלַכְתַּנִי
  choice: tu m’as établi roi
  rationale: Restitue la valeur causative du hiphil de מלך dans un français naturel et digne.
- source_word: עַל עַם רַב
  choice: sur un peuple aussi nombreux
  rationale: רב signifie ici « nombreux », comme le montre la comparaison quantitative qui suit.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: que la poussière de la terre
  rationale: Conserve l’image hébraïque conventionnelle de l’innombrable, intégrée à la construction française « aussi… que ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom d’alliance sans le remplacer par un titre.
- issue: Degré d’explicitation de דְּבָרְךָ
  choice: ta parole donnée
  alternative: ta promesse
  rationale: « Parole » maintient le lexème hébreu et son amplitude, tandis que « donnée à » rend naturellement le caractère promissoire du contexte sans réduire le terme à une seule glose.
- issue: Portée de יֵאָמֵן
  choice: s’accomplisse
  alternative: soit confirmée / soit établie
  rationale: Le verbe peut évoquer la confirmation, la solidité ou la réalisation effective de la parole. Le texte principal retient une formulation française naturelle, et la note préserve les autres nuances authentiques.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à la prière biblique et assure la cohérence des formes possessives. La formulation conserve l’image concrète de la poussière de la terre et l’ambiguïté mesurée entre « parole » et « promesse ».
