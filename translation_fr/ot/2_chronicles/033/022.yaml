id: 2CH.33.22
reference: 2 Chronicles 33:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, comme l’avait fait son père Manassé. Amon offrit des sacrifices à toutes les statues sculptées que son père Manassé avait faites, et il les servit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il leur rendit un culte ». Le verbe hébreu signifie littéralement « servir » et désigne souvent ici un service religieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Cette formulation française naturelle conserve l’évaluation morale de l’expression hébraïque עשה הרע.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: L’expression garde l’image de l’idiome hébreu tout en étant claire en français; le nom divin est translittéré.
- source_word: כַּאֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו
  choice: comme l’avait fait son père Manassé
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la conduite de Manassé, et l’ordre des mots est idiomatique en français.
- source_word: הַפְּסִילִים
  choice: les statues sculptées
  rationale: Le terme désigne concrètement des représentations taillées ou sculptées; ce choix conserve cette précision sans recourir au terme général « idoles ».
- source_word: זִבַּח
  choice: offrit des sacrifices à
  rationale: Dans ce contexte cultuel, le verbe désigne l’acte d’offrir des sacrifices; cette tournure est naturelle et explicite en français.
- source_word: וַיַּעַבְדֵם
  choice: il les servit
  rationale: « Servir » préserve le sens lexical de עבד, tandis que le contexte sacrificiel indique clairement qu’il s’agit d’un service religieux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le nom propre divin; sa translittération permet de le distinguer d’un titre.
- issue: Sens religieux de עבד appliqué aux images
  choice: il les servit
  alternative: il les adora
  rationale: Le verbe signifie fondamentalement « servir ». Le contexte implique le culte, mais la formulation retenue évite de réduire la portée du terme et préserve la tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Statues sculptées » rend le caractère concret des objets sans archaïsme; « servit » conserve la formulation hébraïque, éclairée par une note.
