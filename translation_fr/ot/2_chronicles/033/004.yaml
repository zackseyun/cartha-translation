source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: fr
  text: 'Il bâtit des autels dans la maison de Yahweh[a], dont Yahweh avait dit : « À Jérusalem, mon nom sera pour toujours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le temple de Yahweh ». Littéralement : « dans la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mon nom sera pour toujours ». Comparer la formule biblique fréquente : « mon nom sera là pour toujours ».'
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: Il bâtit
  rationale: Le qatal qal, troisième personne du masculin singulier de בנה, exprime l’action de bâtir. La conjonction וּ est laissée implicite, conformément au récit français moderne, sans perdre l’enchaînement narratif.
- source_word: מִזְבְּחוֹת
  choice: des autels
  rationale: Le pluriel de מִזְבֵּחַ désigne directement des autels destinés au culte ou aux sacrifices.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: בַּיִת signifie littéralement « maison » et désigne ici le temple. Le choix conserve l’expression hébraïque, tandis qu’une note donne l’équivalent contextuel « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: au sujet de laquelle Yahweh avait dit
  rationale: La relative est rattachée à « la maison » et le plus-que-parfait indique naturellement en français que cette parole divine était antérieure à l’action racontée.
- source_word: בִּירוּשָׁלִַם
  choice: À Jérusalem
  rationale: La préposition בְּ et le nom de lieu sont rendus directement, en conservant leur mise en tête dans la parole citée.
- source_word: יִהְיֶה שְּׁמִי
  choice: mon nom sera
  rationale: La formulation suit littéralement le texte hébreu, sans ajouter l’adverbe « là », absent de ce verset.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend naturellement en français moderne l’idée d’une durée sans fin portée par לְעוֹלָם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même. « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Faut-il compléter « mon nom sera » par « mon nom sera là » ?
  choice: mon nom sera pour toujours
  alternative: mon nom sera là pour toujours
  rationale: Le mot « là » n’apparaît pas dans le texte hébreu de ce verset. La traduction conserve donc sa formulation resserrée et sa tension idiomatique, sans l’harmoniser avec des passages parallèles.
translation_notes:
  register: Français international moderne, sobre et digne. « Bâtit » convient au registre biblique sans être archaïque. La syntaxe « au sujet de laquelle » maintient clairement le lien de la relative avec la maison, tandis que les notes signalent l’équivalent contextuel et l’expression parallèle sans les introduire dans le texte.
