    rationale: La conjonction כִּי relie la dernière proposition comme explication ou caractérisation de l’absence d’humiliation d’Amon. Le contraste avec Manassé est déjà porté par la comparaison ; « au contraire » ajoute une relation que l’hébreu n’énonce pas explicitement. « Car » maintient le lien sans surinterprétation.
