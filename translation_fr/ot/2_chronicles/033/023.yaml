source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: fr
  text: Mais il ne s’humilia pas devant Yahweh comme son père Manassé s’était humilié[a] ; car lui, Amon, se rendit de plus en plus coupable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme son père Manassé s’était humilié devant Yahweh ».'
    reason: La construction hébraïque permet aussi de rattacher « devant Yahweh » à l’humiliation de Manassé.
lexical_decisions:
- source_word: נִכְנַע
  choice: ne s’humilia pas
  rationale: Le niphal de כנע a ici une valeur réfléchie et décrit le refus d’Amon de s’abaisser devant Dieu. « S’humilier » est naturel dans ce contexte de repentance et conserve le lien lexical avec l’action de Manassé.
- source_word: מִלִּפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La locution exprime la position ou l’attitude en présence de Dieu. « Devant » est concis et idiomatique, et le nom divin est translittéré « Yahweh ».
- source_word: כְּהִכָּנַע
  choice: comme … s’était humilié
  rationale: La préposition comparative כְ suivie de l’infinitif établit l’humiliation antérieure de Manassé comme point de comparaison. Le plus-que-parfait rend clairement cette antériorité en français.
- source_word: מְנַשֶּׁה אָבִיו
  choice: son père Manassé
  rationale: Cette formulation française naturelle identifie sans ambiguïté Manassé comme le père d’Amon.
- source_word: כִּי
  choice: au contraire
  rationale: Dans le contexte, כִּי introduit une précision qui accentue le contraste entre l’humiliation de Manassé et la culpabilité croissante d’Amon. La relation exacte peut aussi être comprise comme explicative, d’où la note.
- source_word: הוּא אָמוֹן
  choice: lui, Amon
  rationale: Le pronom accompagné du nom propre porte une insistance. La tournure appositive « lui, Amon » conserve cet effet marqué.
- source_word: הִרְבָּה אַשְׁמָה
  choice: se rendit de plus en plus coupable
  rationale: Le hiphil de רבה exprime l’accroissement, tandis que אַשְׁמָה désigne ici la culpabilité. Cette expression rend l’idée d’une culpabilité aggravée dans un français actuel, sans suggérer une offrande de culpabilité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; YHWH
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Nature de l’humiliation d’Amon
  choice: 'action réfléchie : « ne s’humilia pas »'
  alternative: 'état passif : « ne fut pas humilié »'
  rationale: Le parallèle explicite avec l’humiliation volontaire de Manassé dans le récit favorise ici le sens réfléchi, tout en reconnaissant que la forme niphal peut ailleurs être passive.
- issue: Relation introduite par כִּי
  choice: 'contraste renforcé : « au contraire »'
  alternative: 'explication : « car »'
  rationale: La culpabilité croissante d’Amon s’oppose rhétoriquement à l’humiliation de son père. Toutefois, כִּי peut être compris comme introduisant une explication, possibilité conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition du verbe « s’humilier » préserve le contraste rhétorique de l’hébreu. Le point-virgule et « au contraire » rendent lisible l’opposition, tandis que la note maintient l’ambiguïté syntaxique concernant « devant Yahweh ».
