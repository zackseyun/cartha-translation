  naturalness: Le français est moderne, digne et fluide. Le plus-que-parfait pour l’humiliation antérieure de Manassé est naturel dans le contexte narratif. « Car lui, Amon » conserve l’insistance du sujet sans lourdeur excessive.
  terminology: « Yahweh », « Manassé » et « Amon » sont cohérents. « S’humilier devant Yahweh » rend naturellement le registre pénitentiel du texte. La note préserve de façon appropriée la possible portée de « devant Yahweh ».
  issues:
