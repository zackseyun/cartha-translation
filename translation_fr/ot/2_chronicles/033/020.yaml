  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בֵּית֑/וֹ וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: fr
  text: Manassé se coucha avec ses pères, et on l’enterra dans sa maison[a]. Son fils Amon régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son palais »; l’hébreu dit littéralement « dans sa maison », expression qui, dans un contexte royal, peut désigner l’ensemble du palais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Conserve l’image de l’expression hébraïque traditionnelle désignant la mort, plutôt que de l’aplanir en « mourut ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Reproduit de près la formule royale hébraïque et son lien familial; « avec ses ancêtres » serait plus immédiatement idiomatique, mais moins formellement proche.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: Rend naturellement en français le verbe actif au pluriel indéfini avec Manassé pour objet.
- source_word: בֵּיתוֹ
  choice: dans sa maison
  rationale: Préserve le sens lexical direct de בַּיִת tout en signalant en note la valeur possible de palais dans le contexte royal.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Formulation concise et traditionnelle de la succession royale.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Exprime directement le remplacement dynastique indiqué par תַּחַת dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formule « se coucha avec ses pères » conserve volontairement l’image et la tournure funéraire de l’hébreu; « on l’enterra » évite un sujet pluriel artificiel en français tout en gardant la voix active.
