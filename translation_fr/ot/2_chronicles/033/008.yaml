  to: 'Et je ne ferai plus quitter à Israël le pays que j’ai attribué à vos ancêtres, à condition seulement qu’ils veillent à mettre en pratique tout ce que je leur ai commandé : toute la Loi, les prescriptions et les ordonnances transmises par l’intermédiaire de Moïse.[a]'
  rationale: La révision évite l’ambiguïté de « disparaître », qui pourrait excéder le sens de retrait du pays, et affine le dernier terme de la triade juridique. La condition demeure réelle et non interprétée au-delà du verset. La note est correctement ancrée à la médiation mosaïque.
