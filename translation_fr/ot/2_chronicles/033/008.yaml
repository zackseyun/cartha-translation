source:
  edition: WLC
  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: fr
  text: 'Et je ne ferai plus quitter à Israël le pays que j’ai attribué à vos ancêtres, à condition seulement qu’ils veillent à mettre en pratique tout ce que je leur ai commandé : toute la Loi, les prescriptions et les ordonnances transmises par l’intermédiaire de Moïse.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: je ne ferai plus disparaître
  rationale: La combinaison de יסף avec הסיר exprime le fait de ne plus recommencer ou continuer à écarter. Cette formulation française rend naturellement la valeur causative et future.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: Israël
  rationale: Littéralement « le pied d’Israël », expression concrète désignant ici la présence d’Israël dans le pays. Traduire simplement « Israël » restitue clairement le sens idiomatique en français courant.
- source_word: מֵעַל הָאֲדָמָה
  choice: du pays
  rationale: Dans ce contexte d’établissement ancestral et d’alliance, אֲדָמָה désigne le territoire où Israël demeure; « pays » est plus naturel que « de dessus la terre ».
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: que j’ai attribué à vos ancêtres
  rationale: Le hiphil de עמד évoque ici le fait d’établir ou d’assigner. « Attribué » exprime la désignation divine du pays, tandis que « ancêtres » est clair et inclusif en français moderne.
- source_word: רַק אִם
  choice: pourvu seulement que
  rationale: Cette tournure conserve la force restrictive et conditionnelle du texte hébreu.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: ils veillent à mettre en pratique
  rationale: La construction exprime une observance attentive et effective, et non une simple connaissance des commandements.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: tout ce que je leur ai commandé
  rationale: La totalité du commandement et le suffixe pronominal « leur » sont explicitement conservés.
- source_word: לְכָל הַתּוֹרָה
  choice: toute la Loi
  rationale: Dans cette série juridique, תּוֹרָה désigne l’ensemble de l’instruction légale; « la Loi » est transparent et convient au contexte.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: « Prescriptions » rend le caractère normatif de חֻקִּים tout en restant naturel en français contemporain.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles
  rationale: « Règles » communique clairement la portée juridique de מִשְׁפָּטִים sans l’ambiguïté moderne de « jugements ».
- source_word: בְּיַד מֹשֶׁה
  choice: transmises par l’intermédiaire de Moïse
  rationale: L’expression littérale « par la main de Moïse » indique son rôle de médiateur. La formulation choisie rend cette fonction explicitement et naturellement.
theological_decisions:
- issue: Caractère conditionnel du maintien d’Israël dans le pays
  choice: Présenter le maintien dans le pays comme réellement conditionné par l’obéissance
  alternative: Lire la déclaration comme une garantie inconditionnelle ou la condition comme purement rhétorique
  rationale: רַק אִם introduit explicitement une condition restrictive. La traduction la maintient sans tirer de conclusion doctrinale plus large sur la permanence de l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité de la parole divine sans calquer les idiomes hébreux. Le deux-points présente naturellement la Loi, les prescriptions et les règles comme le contenu de ce qui a été commandé.
