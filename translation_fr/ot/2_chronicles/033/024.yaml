  text: And his servants conspired against him and put him to death in his own house.
translation:
  language: fr
  text: Ses serviteurs conspirèrent contre lui et le mirent à mort dans sa propre maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: conspirèrent
  rationale: L’expression קָשַׁר עַל désigne une conspiration dirigée contre quelqu’un, ici dans un contexte d’assassinat royal. « Conspirèrent » est précis, concis et naturel.
- source_word: עָלָיו
  choice: contre lui
  rationale: Avec קָשַׁר, la préposition עַל indique la personne visée par la conspiration; « contre lui » est l’équivalent idiomatique en français.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans le cadre de la cour royale, עֶבֶד peut désigner des serviteurs ou des agents du roi. « Ses serviteurs » reste proche du texte sans préciser indûment leur rang ni leur statut juridique.
- source_word: וַיְמִיתֻהוּ
  choice: le mirent à mort
  rationale: La forme causative du verbe מוּת signifie littéralement faire mourir. « Le mirent à mort » en restitue la force causative et convient au contexte d’un assassinat.
- source_word: בְּבֵיתוֹ
  choice: dans sa propre maison
  rationale: La préposition בְּ marque ici le lieu, et le suffixe possessif indique « sa maison ». « Sa propre maison » souligne naturellement en français que le meurtre eut lieu chez lui, sans modifier le référent.
