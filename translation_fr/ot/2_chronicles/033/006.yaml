revisions:
- from: Il fit passer ses fils par le feu dans la vallée du fils de Hinnom[a]. Il pratiqua l’astrologie, la divination et la sorcellerie, et recourut aux médiums et aux spirites[b]. Il multiplia les actes mauvais aux yeux de Yahweh, provoquant ainsi sa colère.
  to: Il fit passer ses fils par le feu dans la vallée du fils de Hinnom[a]. Il pratiqua l’observation des présages, la divination et la sorcellerie, et recourut aux médiums et aux spirites[b]. Il multiplia les actes mauvais aux yeux de Yahweh, provoquant ainsi sa colère.
