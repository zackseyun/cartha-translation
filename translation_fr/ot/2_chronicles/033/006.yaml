source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: fr
  text: Il fit passer ses fils par le feu dans la vallée du fils de Hinnom[a]. Il pratiqua l’observation des présages, la divination et la sorcellerie, et recourut aux médiums et aux spirites[b]. Il multiplia les actes mauvais aux yeux de Yahweh, provoquant ainsi sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « sacrifia ses fils dans le feu ». L’expression hébraïque signifie littéralement « fit passer ses fils par le feu ».'
    reason: lexical_alternative
  - marker: b
    text: Les mots hébreux traduits par « médiums » et « spirites » désignent des personnes ou des pratiques associées à la consultation des morts ou des esprits.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: fit passer ses fils par le feu
  rationale: Conserve l’image littérale de l’idiome hébreu, qui désigne fortement un rite sacrificiel, sans rendre cette interprétation plus explicite que le texte.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: dans la vallée du fils de Hinnom
  rationale: Traduit le toponyme de façon transparente tout en conservant le nom propre Hinnom.
- source_word: וְעוֹנֵן
  choice: pratiqua l’astrologie
  rationale: Le verbe désigne l’observation divinatoire des temps ou des signes; « astrologie » le distingue en français courant du terme divinatoire suivant, sans prétendre définir précisément la technique.
- source_word: וְנִחֵשׁ
  choice: la divination
  rationale: Rend une pratique liée à l’interprétation des présages et reste distinct de la sorcellerie.
- source_word: וְכִשֵּׁף
  choice: la sorcellerie
  rationale: Expression française naturelle pour la pratique de la magie ou des sortilèges.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: recourut aux médiums et aux spirites
  rationale: Rend naturellement l’implication dans des pratiques ou auprès de praticiens censés consulter les morts ou les esprits, sans préciser indûment s’il les employa ou les consulta.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: multiplia les actes
  rationale: Préserve l’idée d’abondance et d’intensification exprimée par רבה avec l’infinitif, dans une formulation française digne et intelligible.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: les actes mauvais aux yeux de Yahweh
  rationale: Conserve l’idiome évaluatif « aux yeux de » et rend directement le nom divin.
- source_word: לְהַכְעִיסוֹ
  choice: provoquant ainsi sa colère
  rationale: Exprime naturellement la nuance causative ainsi que le rapport de résultat ou de visée avec les actes précédents.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Explicitation du sacrifice d’enfants
  choice: Conserver « fit passer ses fils par le feu » dans le texte principal
  alternative: sacrifia ses fils dans le feu
  rationale: L’idiome implique fortement un rite sacrificiel, mais sa formulation imagée est conservée afin de ne pas éliminer la distinction entre le libellé et son interprétation.
- issue: Nature précise de עונן
  choice: astrologie
  alternative: observation des présages
  rationale: Le terme peut viser l’observation divinatoire des temps, des nuages ou des signes. Le choix français reste général et la note signale l’incertitude.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les verbes au passé simple conviennent au récit historique. La coordination est légèrement restructurée pour éviter une série verbale pesante, tout en maintenant les distinctions entre les pratiques mentionnées.
