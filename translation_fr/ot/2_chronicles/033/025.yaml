translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque de « peuple du pays » est allégée par le pronom « il » dans la seconde proposition, sans ambiguïté référentielle. Les marqueurs sont placés immédiatement après les expressions qu’ils expliquent.
