base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: fr
  text: Mais le peuple du pays[b] mit à mort tous ceux qui avaient conspiré[a] contre le roi Amon, puis le peuple du pays établit Josias, fils d’Amon, comme roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les conspirateurs ».'
    reason: lexical_alternative
  - marker: b
    text: « Le peuple du pays » est une expression hébraïque qui peut désigner la population du pays, avec de possibles nuances sociopolitiques.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: mit à mort
  rationale: Le verbe נכה désigne ici une action violente manifestement létale contre les conspirateurs. « Mit à mort » rend clairement l’issue sans archaïsme.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette expression transparente conserve la formulation hébraïque et laisse ouverte sa nuance sociopolitique exacte, expliquée en note.
- source_word: כָּל הַקֹּשְׁרִים
  choice: tous ceux qui avaient conspiré
  rationale: Le participe de קשר désigne les personnes unies dans un complot; cette formulation est naturelle en français et conserve la valeur verbale.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: contre le roi Amon
  rationale: Avec קשר, la préposition עַל indique que le complot était dirigé contre Amon.
- source_word: וַיַּמְלִיכוּ
  choice: établit comme roi
  rationale: Le hifil de מלך signifie faire de quelqu’un un roi ou le faire régner. Cette traduction n’ajoute pas l’idée d’une cérémonie de couronnement.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: son fils Josias
  rationale: L’apposition identifie Josias comme le fils d’Amon; l’ordre retenu est idiomatique en français.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression marque le remplacement et la succession royale.
- source_word: וַ
  choice: Mais … puis
  rationale: « Mais » marque le contraste avec l’assassinat d’Amon rapporté au verset précédent; « puis » fait progresser naturellement le récit.
