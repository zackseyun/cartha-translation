  rationale: La révision déplace la note a sur « avaient conspiré », qu’elle commente effectivement, et explicite la relation filiale de Josias afin d’éviter une ambiguïté créée par le pronom français. La répétition de « le peuple du pays » reflète en outre la répétition présente dans l’hébreu. Le sens du passage demeure inchangé.
