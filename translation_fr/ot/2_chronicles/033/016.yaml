    issue: « Il ordonna à Juda » dépasse la force explicite du verbe hébreu.
    rationale: וַיֹּאמֶר signifie « il dit »; le contexte peut suggérer l’autorité royale, mais le texte ne marque pas un verbe de commandement. « Il dit à Juda de servir » préserve cette nuance.
  - severity: low
    issue: La formulation principale « sacrifices de communion et de reconnaissance » est moins précise sur le caractère d’offrandes de תוֹדָה.
    rationale: « Sacrifices de paix et d’action de grâce » est idiomatique en français biblique et identifie plus nettement les deux désignations cultuelles, sans imposer une interprétation.
