  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: fr
  text: Puis il remit en état l’autel de Yahweh et y offrit des sacrifices de paix et d’action de grâce[a]. Il dit à Juda de servir Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion et de reconnaissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֵן
  choice: remit en état
  rationale: Le hiphil de כון peut signifier préparer, établir ou mettre en ordre. Dans le contexte de la profanation et de la restauration du sanctuaire, « remit en état » exprime naturellement l’action accomplie sur l’autel sans aller au-delà du contexte.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahweh
  rationale: Le syntagme construit est rendu directement, et le nom divin est translittéré « Yahweh ».
- source_word: וַיִּזְבַּח עָלָיו
  choice: y offrit
  rationale: Le verbe זבח désigne l’action de sacrifier ou d’offrir un sacrifice. « Y offrit » évite une répétition lourde devant les catégories de sacrifices et reprend clairement l’autel.
- source_word: זִבְחֵי שְׁלָמִים
  choice: des sacrifices de communion
  rationale: שְׁלָמִים désigne une catégorie sacrificielle souvent rendue par « sacrifices de paix » ou « sacrifices de communion ». « Communion » met en valeur le repas partagé associé à ces sacrifices, tout en conservant en note l’autre traduction traditionnelle.
- source_word: וְתוֹדָה
  choice: et de reconnaissance
  rationale: Dans ce contexte sacrificiel, תוֹדָה désigne la reconnaissance exprimée par une offrande. La coordination avec « sacrifices » permet la formulation concise « sacrifices de communion et de reconnaissance ».
- source_word: וַיֹּאמֶר לִיהוּדָה לַעֲבוֹד
  choice: Il ordonna à Juda de servir
  rationale: Littéralement, Manassé « dit à Juda de servir ». Dans ce contexte royal, la construction exprime une directive; « ordonna » la rend clairement, tandis que « servir » conserve le sens large et covenantal de עבד sans le limiter au culte rituel.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu français direct et usuel du syntagme construit, qui maintient l’identification covenantale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de עבד appliqué à Dieu
  choice: servir
  alternative: adorer
  rationale: « Servir » préserve l’étendue du terme hébreu, qui inclut le culte mais ne s’y limite pas nécessairement.
translation_notes:
  register: Français moderne, digne et accessible. « Remit en état » explicite sobrement le contexte de restauration; « sacrifices de communion » emploie un terme biblique compréhensible, accompagné d’une variante en note.
