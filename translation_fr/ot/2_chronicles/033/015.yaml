id: 2CH.33.15
reference: 2 Chronicles 33:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: fr
  text: Il retira de la maison de Yahweh les dieux étrangers et l’idole[a], ainsi que tous les autels qu’il avait construits sur le mont de la maison de Yahweh[b] et à Jérusalem, puis il les jeta hors de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la représentation ». Le mot hébreu סֶמֶל peut désigner une idole ou une représentation cultuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur la colline de la maison de Yahweh », c’est-à-dire sur le mont du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Il retira
  rationale: Le hifil de סוּר exprime ici le fait d’enlever ou de faire disparaître quelque chose. « Retira » est naturel en français et convient au contexte de réforme religieuse.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: les dieux étrangers
  rationale: Cette expression désigne des divinités étrangères au culte de Yahweh. « Dieux étrangers » rend clairement et directement le syntagme hébreu.
- source_word: הַסֶּמֶל
  choice: l’idole
  rationale: סֶמֶל désigne une représentation cultuelle, ici condamnée. « Idole » exprime bien sa fonction religieuse, tout en signalant en note l’alternative plus neutre.
- source_word: מִבֵּית יְהוָה
  choice: de la maison de Yahweh
  rationale: « Maison de Yahweh » conserve l’expression hébraïque tout en étant compréhensible comme une désignation du temple.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: ainsi que tous les autels
  rationale: « Ainsi que » relie naturellement ce second complément au verbe « retira », sans modifier le sens de l’hébreu.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il avait construits
  rationale: Le plus-que-parfait marque naturellement en français que la construction des autels précédait leur enlèvement.
- source_word: בְּהַר בֵּית יְהוָה
  choice: sur le mont de la maison de Yahweh
  rationale: Cette formulation conserve le lien explicite entre le mont et la maison de Yahweh. Une formulation plus idiomatique et interprétative est indiquée en note.
- source_word: וּבִירוּשָׁלָם
  choice: et à Jérusalem
  rationale: En français moderne, « à Jérusalem » est la manière idiomatique d’indiquer le lieu désigné par la préposition hébraïque.
- source_word: וַיַּשְׁלֵךְ
  choice: puis il les jeta
  rationale: שׁלך évoque une élimination énergique. « Jeta » en conserve la force; « les » reprend les objets et les autels mentionnés, et « puis » rend clairement la progression narrative.
- source_word: חוּצָה לָעִיר
  choice: hors de la ville
  rationale: L’expression indique un déplacement vers l’extérieur des limites de la ville. « Hors de la ville » est précis et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par le titre « Seigneur ».
- issue: Nature de הַסֶּמֶל
  choice: l’idole
  alternative: la représentation
  rationale: Dans ce récit de réforme cultuelle, l’objet est présenté comme illégitime. « Idole » convient au contexte, tandis que la note maintient la possibilité lexicale d’un terme descriptif plus neutre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’expression biblique « maison de Yahweh » et la structure géographique du texte, tout en employant une syntaxe française fluide.
