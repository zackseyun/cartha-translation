  text: Amon avait vingt-deux ans lorsqu’il devint roi, et il régna deux ans à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: avait vingt-deux ans
  rationale: L’expression hébraïque de l’âge signifie littéralement « fils de vingt-deux ans ». Le français courant et naturel exprime cet âge par « avait vingt-deux ans ».
- source_word: אָמ֣וֹן
  choice: Amon
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition ב suivie de l’infinitif construit de מלך situe l’âge d’Amon au moment de son accession à la royauté.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: deux ans
  rationale: Le groupe numérique indique directement la durée du règne.
- source_word: מָלַךְ
  choice: il régna
  rationale: Dans ce contexte royal, le verbe מלך désigne l’exercice de la royauté pendant une période donnée.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition locative et le nom de lieu indiquent la ville où s’exerçait le règne; en français, l’usage naturel est « à Jérusalem ».
