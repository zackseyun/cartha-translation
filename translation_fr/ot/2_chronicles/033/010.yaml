source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: fr
  text: Yahvé parla à Manassé et à son peuple, mais ils ne prêtèrent pas attention[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils n’écoutèrent pas » ou « ils n’en tinrent pas compte ». Le verbe hébreu évoque une écoute attentive qui appelle une réaction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le piel de דבר signifie couramment « parler »; avec אֶל, « parla à » rend naturellement la construction hébraïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici le peuple ou les sujets de Manassé; le suffixe masculin singulier est rendu par « son ».
- source_word: וְלֹא
  choice: mais… ne… pas
  rationale: La conjonction introduit dans ce contexte un contraste entre la parole de Yahvé et l'absence de réaction des destinataires.
- source_word: הִקְשִׁיבוּ
  choice: prêtèrent attention
  rationale: Le hiphil de קשב exprime une écoute attentive impliquant une réaction. « Prêter attention » rend cette nuance sans expliciter une obéissance que le verbe ne formule pas nécessairement à lui seul.
theological_decisions:
- issue: Référent du sujet pluriel de הִקְשִׁיבוּ
  choice: Le pronom « ils » renvoie naturellement à Manassé et à son peuple ensemble.
  alternative: Le pluriel pourrait être compris comme visant seulement le peuple, Manassé étant mentionné séparément parmi les destinataires.
  rationale: Les deux destinataires coordonnés, « Manassé et son peuple », sont suivis d'un verbe au pluriel. La traduction conserve ce pluriel sans préciser davantage son référent.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste proche de la structure hébraïque tout en employant une expression idiomatique; elle préserve aussi le sujet pluriel et sa légère ambiguïté référentielle.
