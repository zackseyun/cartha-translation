- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe מלך désigne ici l’exercice de la royauté; « régna » est l’équivalent français concis et usuel dans une notice royale.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition ב indique ici le lieu. En français, on dit naturellement « à Jérusalem ».
