source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: fr
  text: Le reste des actes de Manassé, sa prière adressée à son Dieu et les paroles des voyants qui lui parlèrent au nom de Yahweh, le Dieu d’Israël, tout cela est consigné dans les annales des rois d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se traduire : « dans le livre des rois d’Israël » ou « dans les chroniques des rois d’Israël ». Elle désigne une source royale écrite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Le reste des actes de Manassé
  rationale: Dans cette formule historiographique, דִּבְרֵי désigne l’ensemble des faits et gestes plutôt que de simples paroles; « actes » est naturel et précis en français.
- source_word: וּתְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: sa prière adressée à son Dieu
  rationale: Conserve les deux possessifs et rend explicitement la direction exprimée par אֶל dans un français fluide.
- source_word: הַחֹזִים
  choice: les voyants
  rationale: Préserve le titre prophétique spécifique חֹזִים sans le niveler en « prophètes ».
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: qui lui parlèrent
  rationale: Le passé simple convient au registre narratif et rend le participe attributif comme une action passée récapitulée.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: Rendu direct de l’expression d’autorité prophétique, avec transcription du nom divin.
- source_word: הִנָּם
  choice: tout cela est
  rationale: Le démonstratif récapitulatif restitue en français actuel la force déictique de הִנָּם sans l’archaïsme de « voici » au milieu de la phrase.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: consigné dans les annales des rois d’Israël
  rationale: La formule renvoie à une source royale écrite; « annales » exprime clairement sa nature, tandis que « consigné » rend l’écriture implicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette donnée plutôt que de lui substituer un titre.
- issue: Identité des rois mentionnés dans la source
  choice: les rois d’Israël
  alternative: les rois de Juda
  rationale: Le texte massorétique dit explicitement « Israël »; la traduction n’harmonise pas cette lecture avec le contexte du règne de Manassé.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination hébraïque est allégée sans supprimer ses éléments. « Annales » garde la couleur historiographique; la note signale les autres formulations possibles de la citation de source.
