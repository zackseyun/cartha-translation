id: 2CH.33.17
reference: 2 Chronicles 33:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: fr
  text: Cependant, le peuple continuait à offrir des sacrifices sur les hauts lieux, mais uniquement à Yahweh, leur Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: Cependant
  rationale: Marque naturellement le contraste concessif avec les réformes évoquées auparavant.
- source_word: עוֹד
  choice: continuait à
  rationale: Exprime la persistance de la pratique dans le contexte narratif.
- source_word: הָעָם
  choice: le peuple
  rationale: Équivalent collectif courant et précis dans ce récit.
- source_word: זֹבְחִים
  choice: offrir des sacrifices
  rationale: Rend clairement le participe hébreu et sa valeur durative avec « continuait à ».
- source_word: בַּבָּמוֹת
  choice: sur les hauts lieux
  rationale: « Hauts lieux » est le terme biblique établi pour les sanctuaires cultuels locaux; « sur » reflète la préposition sans suggérer que tout sacrifice n'avait lieu que là.
- source_word: רַק
  choice: mais uniquement
  rationale: La restriction porte sur le destinataire des sacrifices, tout en maintenant la tension avec l'emploi persistant des hauts lieux.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition désigne le destinataire du sacrifice, et le nom divin est transcrit comme nom propre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Rend naturellement le nom avec son suffixe possessif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: La transcription « Yahweh » préserve le nom d'alliance présent explicitement dans l'hébreu.
- issue: Portée de la restriction introduite par רַק
  choice: Les sacrifices étaient adressés uniquement à Yahweh, bien qu'ils soient encore offerts sur les hauts lieux.
  alternative: Le peuple ne sacrifiait que sur des hauts lieux consacrés à Yahweh.
  rationale: L'ordre syntaxique rattache la restriction au destinataire (« à Yahweh, leur Dieu »), non au lieu. Le texte conserve ainsi la tension d'une réforme incomplète.
translation_notes:
  register: Français international moderne, clair et digne. La tournure durative « continuait à offrir » restitue la persistance exprimée par עוֹד avec le participe; aucune note n'est nécessaire, car « cependant » rend sans perte notable l'adversatif אֲבָל.
