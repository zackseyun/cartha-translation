  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר נִתַּ֖ץ יְחִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּח֤וֹת לַ/בְּעָלִים֙ וַ/יַּ֣עַשׂ אֲשֵׁר֔וֹת וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: fr
  text: Il rebâtit les hauts lieux qu’Ézéchias, son père, avait démolis[a]. Il dressa des autels aux Baals[b], fabriqua des poteaux sacrés d’Ashéra[c], puis se prosterna devant toute l’armée du ciel[d] et leur rendit un culte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il revint et bâtit »; les deux verbes indiquent qu’il reconstruisit ce qui avait été détruit.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte le pluriel « les Baals », qui peut évoquer différentes manifestations locales ou représentations de Baal.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des ashères ». Le terme hébreu désigne des objets cultuels associés à la déesse Ashéra, sans que leur forme exacte soit certaine.'
    reason: lexical_alternative
  - marker: d
    text: Dans ce contexte, « l’armée du ciel » désigne les corps célestes adorés, notamment le soleil, la lune et les étoiles. Voir 2 Rois 21.3.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: Il rebâtit
  rationale: La succession de שׁוב et בנה exprime ici la répétition ou le rétablissement d’une construction détruite. « Rebâtit » restitue naturellement cette valeur en français.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Expression consacrée pour désigner les sites cultuels appelés במות, souvent situés sur des hauteurs, sans les réduire à de simples autels.
- source_word: נִתַּץ
  choice: avait démolis
  rationale: Le verbe désigne l’action d’abattre ou de démolir. Le plus-que-parfait marque clairement que cette destruction par Ézéchias était antérieure.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: Ézéchias, son père
  rationale: Cette apposition suit de près l’ordre hébreu tout en restant naturelle en français.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: Il dressa des autels aux Baals
  rationale: « Dressa » rend הקים dans le contexte de l’installation d’autels, et le pluriel « Baals » conserve celui du texte hébreu.
- source_word: אֲשֵׁרוֹת
  choice: des poteaux sacrés d’Ashéra
  rationale: Le terme peut désigner des objets cultuels associés à la déesse Ashéra. Cette formulation accessible indique leur fonction sans prétendre déterminer avec certitude leur forme exacte.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna devant
  rationale: Le choix conserve le geste physique exprimé par le verbe plutôt que de le fondre immédiatement dans le sens général d’adorer.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: devant toute l’armée du ciel
  rationale: La traduction garde l’image collective de צבא et, dans ce contexte cultuel, renvoie aux corps célestes; une note prévient une lecture exclusivement angélique.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: lui rendit un culte
  rationale: Dans ce contexte, עבד désigne le service cultuel. Le pronom collectif singulier reprend naturellement « toute l’armée » en français, tandis que l’hébreu emploie un pronom pluriel.
theological_decisions:
- issue: Désignation précise des cultes étrangers
  choice: Conserver « hauts lieux », « Baals » et « poteaux sacrés d’Ashéra »
  alternative: Employer des termes généraux comme « sanctuaires », « idoles » ou « faux dieux »
  rationale: Le verset énumère des pratiques et objets cultuels précis. Les généraliser effacerait des données historiques et religieuses présentes dans l’hébreu.
- issue: Référent de « l’armée du ciel »
  choice: Conserver l’expression imagée en précisant en note qu’elle désigne ici les astres vénérés
  alternative: Traduire directement par « tous les astres du ciel » ou comprendre l’expression comme désignant des anges
  rationale: L’expression hébraïque est préservée, tandis que le contexte de culte illicite indique une référence aux corps célestes sans qu’il soit nécessaire d’introduire des êtres angéliques.
translation_notes:
  register: Français international moderne, naturel et digne. Les termes cultuels précis sont conservés et brièvement expliqués. La coordination hébraïque répétitive est légèrement fluidifiée par la ponctuation et « puis », sans modifier la progression des actes.
