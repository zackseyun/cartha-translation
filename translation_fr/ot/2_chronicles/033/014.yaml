  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: fr
  text: Après cela, il construisit une muraille extérieure pour la cité de David, à l’ouest de Guihôn, dans la vallée, jusqu’à l’entrée de la porte des Poissons[a]. Il entoura l’Ophel[b][c] et éleva la muraille très haut. Il plaça aussi des chefs militaires dans toutes les villes fortifiées de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et vers l’entrée de la porte des Poissons ». L’expression hébraïque peut indiquer la direction ou l’étendue de la muraille vers cette porte.
    reason: lexical_alternative
  - marker: b
    text: L’Ophel est un lieu de Jérusalem, probablement la hauteur située au sud du mont du Temple.
    reason: cultural_note
  - marker: c
    text: Ou « il contourna l’Ophel ». Le verbe hébreu peut exprimer le fait d’entourer complètement ou simplement de passer autour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque naturellement la succession temporelle du récit sans ajouter de nuance causale.
- source_word: בָּנָה
  choice: construisit
  rationale: Rend le sens simple de « bâtir, construire » sans supposer une reconstruction que le verbe n’exprime pas à lui seul.
- source_word: חוֹמָה חִיצוֹנָה
  choice: une muraille extérieure
  rationale: « Muraille » convient à une fortification urbaine, et « extérieure » traduit directement la position externe indiquée par l’adjectif.
- source_word: לְעִיר דָּוִיד
  choice: pour la cité de David
  rationale: 'La préposition peut exprimer la destination ou l’intérêt : la muraille est construite pour la cité de David.'
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: à l’ouest de Guihôn, dans le ravin
  rationale: Conserve les indications topographiques; « ravin » restitue ici le relief associé à נחל plus précisément que le terme général « vallée ».
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: jusqu’à l’entrée de la porte des Poissons
  rationale: L’infinitif spatial marque vraisemblablement l’étendue de la muraille jusqu’à l’accès de cette porte.
- source_word: וְסָבַב לָעֹפֶל
  choice: Il entoura l’Ophel
  rationale: Le verbe masculin singulier a pour sujet grammatical le roi et peut signifier « entourer » ou « contourner »; dans ce contexte de fortification, « entoura » est naturel sans effacer l’autre possibilité, signalée en note.
- source_word: הָעֹפֶל
  choice: l’Ophel
  rationale: Conserve le nom topographique traditionnel de ce secteur de Jérusalem; l’article français reflète l’article hébreu.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: éleva considérablement la muraille
  rationale: Le suffixe féminin renvoie à la muraille. La répétition explicite du nom évite une ambiguïté française avec l’Ophel, tandis que « considérablement » rend l’intensif מְאֹד.
- source_word: שָׂרֵי חַיִל
  choice: des chefs militaires
  rationale: Expression moderne et claire pour des responsables ou commandants des forces armées.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: dans toutes les villes fortifiées
  rationale: Rend la distribution dans l’ensemble des centres urbains défendus de Juda.
