  text: וּ/תְפִלָּת֣/וֹ וְ/הֵֽעָתֶר ל/וֹ֮ וְ/כָל חַטָּאת֣/וֹ וּ/מַעְל/וֹ֒ וְ/הַ/מְּקֹמ֗וֹת אֲשֶׁר֩ בָּנָ֨ה בָ/הֶ֤ם בָּמוֹת֙ וְ/הֶעֱמִיד֙ הָ/אֲשֵׁרִ֣ים וְ/הַ/פְּסִלִ֔ים לִ/פְנֵ֖י הִכָּנְע֑/וֹ הִנָּ֣/ם כְּתוּבִ֔ים עַ֖ל דִּבְרֵ֥י חוֹזָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: fr
  text: Sa prière, la manière dont il fut exaucé, tous ses péchés et son infidélité, ainsi que les endroits où il bâtit des hauts lieux et dressa les ashéras[a] et les statues sculptées avant de s’humilier, tout cela est écrit dans les récits de Hozaï[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les poteaux sacrés d’Ashéra ». Le terme hébreu désigne des objets cultuels associés à la déesse Ashéra, sans en préciser sûrement la forme.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les récits des voyants ». Le dernier mot hébreu peut être compris comme un nom propre, Hozaï, ou comme une désignation des voyants.
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: sa prière
  rationale: Traduction courante et directe de תְּפִלָּה, qui garde ici son sens général sans le réduire à une supplication particulière.
- source_word: הֵעָתֶר לוֹ
  choice: la manière dont il fut exaucé
  rationale: La tournure française exprime la réponse favorable à sa prière tout en conservant le passif et sans introduire explicitement un sujet absent de la proposition hébraïque.
- source_word: כָל חַטָּאתוֹ
  choice: tous ses péchés
  rationale: Le singulier hébreu a une valeur collective; le pluriel est plus naturel en français dans cette construction.
- source_word: מַעְלוֹ
  choice: son infidélité
  rationale: מעל désigne une rupture de fidélité, souvent à portée religieuse ou relationnelle; « infidélité » en conserve la force sans recourir à un terme juridique.
- source_word: הַמְּקֹמוֹת
  choice: les endroits
  rationale: Rendu concret et naturel de מקום au pluriel; la proposition qui suit précise la fonction cultuelle de ces lieux.
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Expression française consacrée pour les sanctuaires cultuels locaux désignés par בָּמוֹת.
- source_word: הֶעֱמִיד
  choice: dressa
  rationale: Verbe naturel pour l’installation verticale d’objets cultuels, qui garde l’image concrète de la racine עמד.
- source_word: הָאֲשֵׁרִים
  choice: les ashéras
  rationale: La translittération évite de préciser à tort la forme exacte de ces objets cultuels associés à Ashéra; une explication est donnée en note.
- source_word: הַפְּסִלִים
  choice: les statues sculptées
  rationale: Le choix conserve le sens concret d’images taillées ou sculptées, plutôt que de ne rendre que leur fonction idolâtre.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: avant de s’humilier
  rationale: La formulation rend le rapport temporel et le sens réfléchi ou intransitif naturel de la forme hébraïque.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: Le démonstratif récapitulatif français rend la particule présentative הִנָּם de façon claire et digne, sans l’archaïsme de « voici » dans cette syntaxe.
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: dans les récits de Hozaï
  rationale: La vocalisation fournie par le WLC permet de lire חוֹזָי comme le nom propre Hozaï; « récits » rend דִּבְרֵי dans le contexte d’une source écrite.
theological_decisions:
- issue: Nature de l’abaissement de Manassé dans הִכָּנְעוֹ
  choice: avant de s’humilier
  alternative: avant d’être humilié
  rationale: La forme hébraïque soutient naturellement un sens réfléchi ou intransitif et rejoint le contexte immédiat, sans développer au-delà du texte une doctrine particulière de la repentance.
- issue: Identification de חוֹזָי
  choice: Hozaï, comme nom propre
  alternative: les voyants
  rationale: La vocalisation du texte source fourni favorise le nom propre, mais l’analyse comme désignation de voyants reste une possibilité ancienne et réelle, conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure cumulative du texte hébreu, tout en utilisant « tout cela » pour reprendre naturellement l’énumération. Les termes cultuels établis « hauts lieux » et « ashéras » sont maintenus, avec note explicative pour le second.
