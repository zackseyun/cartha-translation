source:
  edition: WLC
  text: וַ/יָּבֵ֨א יְהוָ֜ה עֲלֵי/הֶ֗ם אֶת שָׂרֵ֤י הַ/צָּבָא֙ אֲשֶׁר֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וַ/יִּלְכְּד֥וּ אֶת מְנַשֶּׁ֖ה בַּ/חֹחִ֑ים וַ/יַּֽאַסְרֻ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יּוֹלִיכֻ֖/הוּ בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: fr
  text: Alors Yahweh fit venir contre eux les chefs de l’armée du roi d’Assyrie. Ils capturèrent Manassé avec des crochets[a], l’attachèrent avec des entraves de bronze et l’emmenèrent à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner des crochets ou des épines; certains comprennent ici « avec un crochet » ou, plus généralement, une entrave imposée à un captif.
    reason: Alternative lexicale liée au sens incertain de חֹחִים dans ce contexte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: fit venir contre eux
  rationale: Le hiphil de בוא exprime ici une action causative, et עַל prend dans ce contexte militaire le sens hostile de « contre ».
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: les chefs de l’armée du roi d’Assyrie
  rationale: Cette formulation française naturelle rend les responsables militaires associés au roi d’Assyrie sans préciser indûment leur grade.
- source_word: וַיִּלְכְּדוּ
  choice: capturèrent
  rationale: Dans un contexte militaire, לכד désigne le fait de saisir ou de faire prisonnier.
- source_word: בַּחֹחִים
  choice: avec des crochets
  rationale: Le pluriel hébreu peut désigner des crochets, image concrète d’un dispositif employé pour maîtriser un captif; l’incertitude lexicale est conservée en note.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: l’attachèrent avec des entraves de bronze
  rationale: אסר signifie « attacher, lier », tandis que נְחֻשְׁתַּיִם désigne des entraves métalliques, probablement appariées; « entraves de bronze » reste précis sans supposer qu’il s’agissait nécessairement de chaînes.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: l’emmenèrent à Babylone
  rationale: Le hiphil de הלך indique qu’on conduit quelqu’un, et le hé directionnel marque clairement la destination.
theological_decisions:
- issue: L’action divine dans l’attaque assyrienne
  choice: Yahweh « fit venir » les chefs militaires contre eux.
  alternative: Yahweh aurait seulement « permis » leur venue.
  rationale: La construction causative attribue directement l’action à Yahweh. La traduction ne l’atténue donc pas en simple permission.
translation_notes:
  register: Français international moderne, clair et digne. La narration reste concise; le passé simple convient au registre narratif biblique écrit. La note conserve l’ambiguïté concrète du terme hébreu sans imposer une reconstitution précise du traitement du captif.
