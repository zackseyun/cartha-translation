  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: fr
  text: Il pria Dieu, et Dieu se laissa fléchir par lui[a] ; il entendit sa supplication et le ramena à Jérusalem, le rétablissant dans sa royauté[b]. Alors Manassé reconnut que Yahweh est Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu accueillit favorablement sa prière » ou « se laissa supplier par lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à son royaume »; l’expression peut désigner son rétablissement dans sa royauté, c’est-à-dire dans l’exercice du pouvoir royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Il le pria
  rationale: Le hitpael de פלל signifie couramment « prier ». Le pronom complément conserve l’adresse personnelle à Dieu, dont l’identité ressort du contexte.
- source_word: וַיֵּעָתֶר לוֹ
  choice: Dieu se laissa fléchir par lui
  rationale: Le niphal de עתר exprime le fait de se laisser supplier ou de répondre favorablement à une supplication. La mention explicite de Dieu clarifie le changement de sujet en français sans ajouter une nouvelle idée.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: il entendit sa supplication
  rationale: תחנה désigne une demande instante de grâce. « Supplication » en garde la gravité et le cadre de prière.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: il le ramena à Jérusalem, dans son royaume
  rationale: Le hiphil de שוב signifie « faire revenir, ramener ». מלכותו peut désigner son royaume ou l’exercice de sa royauté; le texte principal reste proche de la formulation hébraïque, avec une note pour préciser cette nuance.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Alors Manassé reconnut
  rationale: ידע signifie « savoir, connaître »; dans ce contexte de prise de conscience consécutive aux événements, « reconnut » est naturel et exprime l’acquisition de cette connaissance sans la surinterpréter.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: que Yahweh est Dieu
  rationale: La formulation conserve le nom divin et l’affirmation directe du texte. Le pronom emphatique הוא est rendu par la tournure française naturelle, sans ajouter « seul », absent de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve ici le nom divin personnel conformément à la couche de consultation fournie.
- issue: Portée de כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: que Yahweh est Dieu
  alternative: que Yahweh seul est Dieu
  rationale: L’hébreu affirme avec emphase que Yahweh est Dieu, mais ne contient pas explicitement le mot « seul ». L’ajouter résoudrait au-delà du texte la portée de la confession.
- issue: Réponse divine exprimée par וַיֵּעָתֶר לוֹ
  choice: Dieu se laissa fléchir par lui
  alternative: Dieu lui répondit favorablement
  rationale: Le choix principal garde l’image et la voix du niphal tout en indiquant une réponse favorable. La note signale l’autre formulation possible sans trancher excessivement la nuance lexicale.
translation_notes:
  register: Français international actuel, digne et accessible. La coordination hébraïque est légèrement structurée par deux-points pour rendre clairement la réponse divine. « Se laissa fléchir » maintient un registre biblique compréhensible; « supplication » conserve la solennité du contexte.
