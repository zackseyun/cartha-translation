  edition: WLC
  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: fr
  text: Alors qu’il était dans la détresse, il implora[a] Yahweh, son Dieu, et s’humilia profondément devant le Dieu de ses pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chercha à obtenir la faveur de Yahweh, son Dieu » ou « supplia Yahweh, son Dieu ». L’expression hébraïque signifie littéralement « adoucir/apaiser le visage de quelqu’un ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le Dieu de ses ancêtres ». L’hébreu porte littéralement « le Dieu de ses pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Lorsqu’il fut dans la détresse
  rationale: La construction introduit la circonstance temporelle et décrit l’état pénible dans lequel se trouve Manassé. « Dans la détresse » est naturel en français et conserve la force du texte sans préciser indûment la nature de l’épreuve.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: il implora
  rationale: Cette expression idiomatique signifie supplier quelqu’un ou chercher à obtenir sa faveur. « Implora » restitue clairement l’attitude suppliante; une note conserve l’image et les autres nuances possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: 'Le suffixe pronominal exprime simplement la relation possessive : Yahweh est désigné comme le Dieu de Manassé.'
- source_word: וַיִּכָּנַע מְאֹד
  choice: et s’humilia profondément
  rationale: Dans ce contexte pénitentiel, le nifal de כנע a une valeur réfléchie. « Profondément » rend avec naturel l’intensification portée par מְאֹד.
- source_word: מִלִּפְנֵי
  choice: devant
  rationale: La locution signifie ici « devant » ou « en présence de ». Le choix retenu est direct, digne et idiomatique.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: le Dieu de ses pères
  rationale: La traduction conserve la formulation masculine et l’expression historico-religieuse du texte hébreu. « Ancêtres » demeure une possibilité française plus englobante, signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Portée de l’expression אֱלֹהֵי אֲבֹתָיו
  choice: le Dieu de ses pères
  alternative: le Dieu de ses ancêtres
  rationale: « Pères » suit formellement le masculin hébreu et préserve la formule traditionnelle, tandis que « ancêtres » exprime correctement la portée généalogique plus générale.
- issue: Valeur de חִלָּה אֶת־פְּנֵי
  choice: il implora
  alternative: il chercha à obtenir la faveur de; il supplia
  rationale: L’expression associe supplication et recherche de faveur. Le verbe « implorer » transmet l’essentiel sans décider que Manassé aurait effectivement apaisé Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure hébraïque tout en évitant un calque obscur de l’expression concernant le visage. « S’humilia profondément » rend naturellement l’intensité de מְאֹד.
