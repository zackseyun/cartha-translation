  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: fr
  text: Il bâtit des autels pour toute l’armée des cieux[a], dans les deux cours de la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’armée céleste ». L’expression hébraïque désigne ici les astres ou puissances célestes auxquels un culte était rendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le wayyiqtol qal de בנה poursuit le récit par une action passée de Manassé. Le passé simple convient au registre narratif soutenu et naturel du passage.
- source_word: מִזְבְּחוֹת
  choice: des autels
  rationale: מזבח désigne couramment un autel destiné aux sacrifices ou à l’encens; le pluriel hébreu est conservé directement.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: pour toute l’armée des cieux
  rationale: L’expression désigne l’ensemble des astres ou puissances célestes objets d’un culte. « Pour » rend naturellement לְ dans la construction d’autels en leur honneur, tandis que « armée des cieux » préserve l’image biblique sans préciser abusivement le référent.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: dans les deux cours
  rationale: Le numéral indique explicitement deux cours. « Cours » est le terme architectural naturel pour les espaces clos du sanctuaire.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque « maison de YHWH » et rend directement le nom divin, sans remplacer בית par l’interprétation « temple ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre divin et évite de le remplacer par un titre.
- issue: Nature de צְבָא הַשָּׁמַיִם
  choice: armée des cieux
  alternative: armée céleste / astres
  rationale: La formulation retenue maintient l’expression imagée et sa portée potentiellement large — corps célestes ou puissances célestes — tout en laissant le contexte signaler qu’ils font l’objet d’un culte.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le récit historique; le vocabulaire architectural et cultuel reste sobre. La virgule avant le complément de lieu facilite la lecture sans modifier le rapport syntaxique.
