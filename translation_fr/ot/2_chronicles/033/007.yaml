  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: fr
  text: 'Il plaça dans la maison de Dieu l’image sculptée[a], l’idole qu’il avait faite, au sujet de laquelle Dieu avait dit à David et à Salomon, son fils : « Dans cette maison et à Jérusalem, que j’ai choisie parmi toutes les tribus d’Israël, je placerai mon nom pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’image sculptée de l’idole » ; l’hébreu emploie deux termes étroitement apparentés pour désigner une statue idolâtre.'
    reason: Variante lexicale préservant l’ambiguïté du rapport entre les deux substantifs hébreux.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂים exprime ici l’action d’installer un objet; « plaça » convient au récit et fait écho au même verbe dans la parole divine.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: la statue sculptée, l’idole
  rationale: Les deux substantifs hébreux proches sont maintenus en apposition afin de rendre à la fois le caractère façonné de l’objet et sa fonction idolâtre, sans les réduire à un seul terme.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait faite
  rationale: Le plus-que-parfait marque naturellement en français que la fabrication précède l’installation.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: dans la maison de Dieu
  rationale: Cette formulation conserve l’image concrète de בַּיִת et la répétition de « maison » dans la citation, plutôt que de l’interpréter directement par « temple ».
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: Or Dieu avait dit
  rationale: Cette construction rattache naturellement la déclaration divine à la maison mentionnée tout en évitant une relative française lourde ou ambiguë.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: à David et à son fils Salomon
  rationale: La filiation de Salomon est explicitement préservée dans un ordre naturel en français.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלַם
  choice: Dans cette maison et dans Jérusalem
  rationale: La traduction garde les deux lieux coordonnés et la répétition lexicale de « maison ».
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: que j’ai choisie parmi toutes les tribus d’Israël
  rationale: Le féminin de « choisie » rattache la relative à Jérusalem, conformément à l’accord naturel du français; « parmi » rend idiomatiquement מִכֹּל.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: je placerai mon nom
  rationale: La formulation préserve l’idiome concret selon lequel Dieu place son nom, sans le développer en paraphrase théologique.
- source_word: לְעֵילֹום
  choice: pour toujours
  rationale: Expression française courante et digne pour la durée indéfinie ou perpétuelle exprimée par לְעוֹלָם.
theological_decisions:
- issue: Titre divin
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie אֱלֹהִים et non le tétragramme יהוה; « Dieu » respecte donc la désignation présente dans la source.
- issue: Idiome théologique du nom divin
  choice: je placerai mon nom pour toujours
  alternative: j’y ferai demeurer mon nom pour toujours
  rationale: Le texte dit littéralement que Dieu « placera » son nom. Conserver cet idiome évite de trancher ou d’expliciter davantage la nature de la présence divine.
- issue: Référent de la relative « que j’ai choisie »
  choice: Jérusalem
  alternative: cette maison et Jérusalem
  rationale: Le singulier féminin hébreu אֲשֶׁר בָּחַרְתִּי peut formellement introduire une relative dont le référent immédiat est Jérusalem; l’accord français rend cette lecture naturelle sans ajouter d’explication théologique.
translation_notes:
  register: Français international moderne, narratif et digne. « Maison de Dieu » conserve le motif lexical hébreu, tandis que « statue sculptée » est plus actuel que « image taillée » ou « image gravée ». La phrase est divisée avant la citation pour éviter une accumulation de relatives et assurer une lecture claire.
