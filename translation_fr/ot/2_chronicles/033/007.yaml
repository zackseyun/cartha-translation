  to: 'Il plaça dans la maison de Dieu l’image sculptée[a], l’idole qu’il avait faite, au sujet de laquelle Dieu avait dit à David et à Salomon, son fils : « Dans cette maison et à Jérusalem, que j’ai choisie parmi toutes les tribus d’Israël, je placerai mon nom pour toujours. »'
