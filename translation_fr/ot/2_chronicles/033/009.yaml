  variant: modern international French
source:
  edition: WLC
  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: fr
  text: Ainsi, Manassé égara Juda et les habitants de Jérusalem, les amenant à faire plus de mal que les nations que Yahweh avait détruites devant les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites » ou « le peuple d’Israël ». Littéralement : « les fils d’Israël ».'
    reason: Précise la valeur collective de l’expression hébraïque tout en conservant sa forme littérale dans le texte.
lexical_decisions:
- source_word: וַיֶּתַע
  choice: égara
  rationale: Le hiphil de תעה exprime le fait de faire errer ou de conduire dans l’égarement. « Égara » conserve directement cette valeur causative en français.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Juda et les habitants de Jérusalem
  rationale: Cette formulation maintient les deux objets collectifs explicitement nommés dans l’hébreu et reste naturelle en français.
- source_word: לַעֲשׂוֹת רָע
  choice: les amenant à faire plus de mal
  rationale: La tournure explicite le lien entre l’égarement causé par Manassé et l’action mauvaise exprimée par l’infinitif, tout en intégrant naturellement la comparaison introduite par מִן.
- source_word: מִן הַגּוֹיִם
  choice: plus de mal que les nations
  rationale: Dans ce contexte, מִן a une valeur comparative. La formulation française rend cette comparaison sans atténuer le jugement moral du texte.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: « Nations » convient au contexte historique et évite d’introduire la connotation religieuse plus tardive de « païens » ou de « Gentils ».
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: que Yahweh avait détruites
  rationale: Le plus-que-parfait situe la destruction avant l’égarement sous Manassé. « Détruites » rend la force de השמיד de manière ferme et usuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: מִפְּנֵי
  choice: devant
  rationale: « Devant » préserve l’image spatiale de l’expression hébraïque employée dans le contexte de la conquête, sans développer l’expression dans le corps du texte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction formelle conserve l’expression généalogique et collective de l’hébreu. Une formulation collective plus idiomatique est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le choix conserve le nom propre présent dans le texte source, sans le remplacer par un titre traditionnel.
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte principal garde la forme masculine généalogique de l’hébreu, tandis que la note indique son sens collectif possible sans imposer une interprétation différente.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la forte comparaison morale ainsi que l’image hébraïque « devant les fils d’Israël », tout en rendant explicitement et naturellement le lien causatif entre l’égarement et le mal commis.
