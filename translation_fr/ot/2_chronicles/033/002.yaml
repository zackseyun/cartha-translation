  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, imitant les pratiques abominables des nations que Yahweh avait chassées de devant les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Le wayyiqtol exprime l’action narrative passée. L’adjectif substantivé הָרַע est rendu naturellement par « ce qui est mal ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation conserve la métaphore évaluative hébraïque tout en étant idiomatique en français moderne; le tétragramme est transcrit « Yahweh ».
- source_word: כְּתוֹעֲבוֹת הַגּוֹיִם
  choice: imitant les pratiques abominables des nations
  rationale: כְּ exprime ici la comparaison ou la conformité. « Pratiques abominables » explicite le sens concret de תוֹעֲבוֹת sans en atténuer la forte portée cultuelle et morale.
- source_word: הוֹרִישׁ
  choice: avait chassées
  rationale: Le hiphil de ירשׁ désigne ici l’expulsion des peuples qui occupaient le pays. Le plus-que-parfait marque naturellement l’antériorité de cette action.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: devant les fils d’Israël
  rationale: « Devant » conserve l’image spatiale de מִפְּנֵי, et « les fils d’Israël » reproduit l’expression familiale masculine du texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin personnel; sa transcription préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée cultuelle et morale de תוֹעֲבוֹת
  choice: pratiques abominables
  alternative: abominations; pratiques détestables
  rationale: Ce choix garde la condamnation forte du terme tout en indiquant qu’il s’agit des actes et coutumes imités, sans limiter indûment leur portée au seul domaine cultuel.
- issue: Expression genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le rendu principal conserve la forme familiale et masculine de l’hébreu; la note signale l’équivalent collectif courant sans l’imposer au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « imitant les pratiques abominables » évite le tour peu naturel « selon les abominations ».
