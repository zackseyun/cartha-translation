  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: fr
  text: Le reste des actes de Josaphat, des premiers aux derniers, le voici consigné dans les écrits de Jéhu, fils de Hanani[a], qu’il a fait figurer dans le livre des rois d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le récit de Jéhu, fils de Hanani » ; littéralement : « dans les paroles de Jéhu, fils de Hanani ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la proposition hébraïque dit : « qu’il a fait monter sur le livre des rois d’Israël ». Le sens est probablement que les écrits de Jéhu ont été intégrés ou ajoutés à cette source royale plus vaste.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Le reste des actes de Josaphat
  rationale: Dans cette formule récapitulative royale, דִּבְרֵי désigne les actes ou les affaires du roi, et non seulement ses paroles. Le וְ initial assure la transition sans exiger l’ajout français « Maintenant ».
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: des premiers aux derniers
  rationale: Cette tournure française naturelle conserve le mérisme hébreu, qui embrasse l’ensemble du règne.
- source_word: הִנָּם כְּתוּבִים
  choice: le voici consigné
  rationale: « Le voici » maintient la force déictique et emphatique de הִנָּם. Le singulier français reprend collectivement « le reste », tandis que « consigné » convient au contexte documentaire de כְּתוּבִים.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: dans les écrits de Jéhu, fils de Hanani
  rationale: Ici, דִּבְרֵי renvoie à une source écrite attribuée à Jéhu. « Écrits » reste assez large pour ne pas imposer le genre technique d’annales.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: qu’il a fait figurer dans le livre des rois d’Israël
  rationale: La formulation rend le hiphil actif הֹעֲלָה et l’idée probable d’une insertion dans une source plus vaste, tout en signalant en note la difficulté syntaxique et le caractère imagé de l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure « le voici consigné » conserve l’emphase historiographique de l’hébreu sans l’archaïsme plus marqué de « voici, ils sont écrits ». La minuscule à « livre » évite de confondre cette source ancienne avec un livre biblique portant un titre canonique moderne.
