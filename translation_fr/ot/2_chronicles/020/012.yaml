  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: fr
  text: Notre Dieu, ne les jugeras-tu pas ? Car nous n’avons aucune force face à cette foule immense qui s’avance contre nous. Nous ne savons pas quoi faire, mais nos yeux sont tournés vers toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « car nos yeux sont tournés vers toi ».'
    reason: La conjonction hébraïque כִּי est normalement causale (« car »), tandis que le texte principal rend naturellement le contraste implicite entre l’impuissance humaine et la confiance en Dieu.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Notre Dieu
  rationale: Le groupe nominal est employé comme apostrophe dans la prière. « Notre Dieu » est naturel en français moderne et conserve l’appel communautaire sans ajouter le solennel « ô ».
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: ne les jugeras-tu pas ?
  rationale: La tournure interrogative הֲלֹא attend une intervention affirmative de Dieu. « Juger » conserve la portée judiciaire de שׁפט sans la réduire au seul châtiment.
- source_word: כִּי אֵין בָּנוּ כֹּחַ
  choice: Nous n’avons aucune force
  rationale: כֹּחַ désigne ici la force ou la capacité d’affronter la menace. « Aucune force » exprime clairement l’impuissance totale du peuple. La relation explicative portée par כִּי ressort suffisamment de l’enchaînement en français, sans qu’un « car » soit indispensable.
- source_word: לִפְנֵי
  choice: face à
  rationale: La préposition signifie littéralement « devant » ou « en face de ». Dans ce contexte d’affrontement, « face à » préserve l’image et convient naturellement en français.
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: cette foule immense
  rationale: הָמוֹן désigne une multitude nombreuse. « Foule immense » garde le terme général du texte sans préciser davantage qu’il s’agit d’une armée.
- source_word: הַבָּא עָלֵינוּ
  choice: qui vient nous attaquer
  rationale: Le participe exprime une menace en cours d’approche, et עַל prend ici une valeur hostile. « Nous attaquer » rend cette hostilité explicitement et idiomatiquement.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Nous ne savons pas quoi faire
  rationale: Cette formulation simple et courante restitue directement l’aveu d’impuissance exprimé par l’hébreu.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: mais nos yeux sont tournés vers toi
  rationale: L’expression décrit une attente confiante et dépendante. « Nos yeux sont tournés vers toi » conserve la métaphore tout en étant naturelle en français ; « mais » marque le contraste pragmatique avec l’ignorance qui précède.
theological_decisions:
- issue: Rapport de la dernière proposition introduite par כִּי avec l’aveu d’impuissance précédent
  choice: mais nos yeux sont tournés vers toi
  alternative: car nos yeux sont sur toi
  rationale: כִּי peut normalement introduire une raison, mais la progression de la prière oppose ici l’absence de solution humaine à l’attente placée en Dieu. Le texte principal rend ce contraste naturel en français, tandis que la note conserve la possibilité d’une liaison plus formelle et causale.
- issue: Portée de שׁפט à l’égard des peuples hostiles
  choice: juger
  alternative: faire justice contre eux / les punir
  rationale: « Juger » maintient la dimension judiciaire de l’intervention divine et ne décide pas à la place du texte si l’accent porte surtout sur la condamnation des ennemis, leur châtiment ou la justification du peuple qui prie.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la sobriété pressante de la prière, évite les archaïsmes et conserve la métaphore des yeux dirigés vers Dieu.
