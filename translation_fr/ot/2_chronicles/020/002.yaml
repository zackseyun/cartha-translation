    issue: Accord singulier dans « La voici »
    rationale: Le texte hébreu emploie le présentatif avec un suffixe pluriel (וְהִנָּם), même si l’antécédent « grande multitude » est collectif. « Et les voilà » conserve ce pluriel et la vivacité du rapport.
