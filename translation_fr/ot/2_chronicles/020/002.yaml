base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: fr
  text: 'On vint informer Josaphat : « Une grande multitude arrive contre toi depuis l’autre côté de la mer, depuis Aram[a] ; et les voilà à Hatsatsôn-Tamar, c’est-à-dire En-Guédi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram est le nom hébreu de la région souvent appelée « Syrie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: On vint en informer
  rationale: Les deux formes narratives expriment l’arrivée de personnes non identifiées qui transmettent un rapport. Le pronom indéfini « on » est naturel en français sans préciser leur identité, et « informer » convient à une nouvelle urgente adressée au roi.
- source_word: בָּא
  choice: arrive
  rationale: Le qatal décrit ici une menace en cours d’approche. Le présent français rend naturellement son caractère imminent.
- source_word: הָמוֹן רָב
  choice: une grande foule
  rationale: הָמוֹן désigne une masse nombreuse ou une multitude. « Foule » conserve cette largeur sémantique sans expliciter indûment une armée, que le contexte laisse néanmoins entendre.
- source_word: עָלֶיךָ
  choice: contre toi
  rationale: Dans ce contexte hostile, על marque un mouvement dirigé contre Josaphat.
- source_word: מֵעֵבֶר לַיָּם
  choice: depuis l’autre côté de la mer
  rationale: Cette formulation rend directement l’idée spatiale de provenance depuis le côté opposé de la mer et reste idiomatique en français.
- source_word: מֵאֲרָם
  choice: depuis Aram
  rationale: Le nom hébreu est conservé plutôt que remplacé dans le texte par l’appellation historique « Syrie ».
- source_word: וְהִנָּם
  choice: La voici
  rationale: La particule présentative attire vivement l’attention sur la présence actuelle de la multitude. Le collectif singulier « foule » commande naturellement « voici » au singulier.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: à Hatsatsôn-Tamar
  rationale: La préposition est rendue par le locatif français naturel « à » devant un nom de lieu; le toponyme est translittéré.
- source_word: הִיא עֵין גֶּדִי
  choice: c’est-à-dire En-Guédi
  rationale: La proposition identifie explicitement Hatsatsôn-Tamar à En-Guédi et fonctionne comme une précision géographique.
theological_decisions: []
