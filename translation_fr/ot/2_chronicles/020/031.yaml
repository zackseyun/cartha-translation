source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: fr
  text: Josaphat régna sur Juda. Il avait trente-cinq ans lorsqu’il devint roi, et il régna vingt-cinq ans à Jérusalem. Sa mère s’appelait Azouba ; elle était fille de Shilhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le wayyiqtol de מלך introduit la notice royale. « Régna » restitue directement et dignement la formule hébraïque.
- source_word: עַל יְהוּדָה
  choice: sur Juda
  rationale: Avec מלך, עַל désigne le territoire ou le peuple gouverné ; « régner sur Juda » est naturel en français.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: Il avait trente-cinq ans
  rationale: La formule hébraïque d’âge, littéralement « fils de trente-cinq ans », se rend idiomatiquement ainsi en français.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition ב avec l’infinitif construit et son suffixe situe l’âge de Josaphat au moment de son accession au trône.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: et il régna vingt-cinq ans
  rationale: Cette formulation conserve la durée explicite du règne et l’ordre logique de la notice royale.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: En français, on règne normalement « à » une ville lorsqu’elle est présentée comme siège royal.
- source_word: וְשֵׁם אִמּוֹ עֲזוּבָה
  choice: Sa mère s’appelait Azouba
  rationale: Cette tournure française actuelle restitue naturellement la formule hébraïque « le nom de sa mère était Azouba ».
- source_word: בַּת שִׁלְחִי
  choice: elle était fille de Shilhi
  rationale: בַּת indique la filiation. La reprise par une proposition évite que « fille de Shilhi » soit momentanément rattaché à un autre nom.
