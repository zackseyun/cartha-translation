  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: fr
  text: Josaphat se tint dans l’assemblée de Juda et de Jérusalem, dans la maison de Yahvé, devant la nouvelle cour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le nouveau parvis ».'
    reason: Alternative lexicale pour חָצֵר dans le cadre du temple.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se tint debout
  rationale: Le verbe עמד décrit ici l’action de se tenir debout pour prendre la parole. « Se tint debout » est naturel en français narratif et reste moins interprétatif que « prit place » ou « se présenta ».
- source_word: בִּקְהַל
  choice: au milieu de l’assemblée
  rationale: קהל désigne la communauté réunie. La préposition ב indique que Josaphat se trouve dans cette assemblée; « au milieu de » exprime clairement cette situation en français.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: de Juda et de Jérusalem
  rationale: La coordination hébraïque est conservée sans préciser davantage si les noms désignent les lieux ou leurs habitants, ce que le contexte permet de comprendre.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahvé
  rationale: La traduction garde l’image hébraïque de la « maison » de Yahvé plutôt que de la remplacer par « temple », qui serait juste dans le contexte mais moins formellement proche du texte.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme YHWH; elle préserve le nom propre au lieu de lui substituer le titre « le Seigneur ».
- source_word: לִפְנֵי
  choice: devant
  rationale: Dans ce contexte spatial, לִפְנֵי indique la position de Josaphat par rapport à la cour du temple. « Devant » est direct et idiomatique.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: la nouvelle cour
  rationale: חצר désigne une cour ou un espace découvert de l’enceinte du temple. « Cour » est clair et concis; « parvis » constitue une autre traduction possible dans le vocabulaire cultuel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme, nom propre du Dieu d’Israël. La forme française « Yahvé » le représente explicitement, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image de la « maison de Yahvé » et la légère ambiguïté de « Juda et Jérusalem », tout en rendant clairement la scène publique.
