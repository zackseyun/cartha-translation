  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: fr
  text: Et tout Juda se tenait devant Yahweh, même leurs tout-petits, leurs épouses et leurs enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs fils ». Le terme hébreu peut désigner précisément les fils ou, selon le contexte, les enfants au sens large.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יְהוּדָה
  choice: Et tout Juda
  rationale: La conjonction relie le verset au récit précédent, tandis que « tout Juda » conserve la désignation collective et exhaustive de la population de Juda.
- source_word: עֹמְדִים
  choice: se tenait
  rationale: Le participe décrit une posture qui dure. En français, le singulier s’accorde naturellement avec le nom collectif « tout Juda ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » exprime ici la présence solennelle devant Dieu, et « Yahweh » rend directement le nom divin יהוה.
- source_word: גַּם טַפָּם
  choice: même leurs tout-petits
  rationale: גַּם souligne que les plus jeunes étaient eux aussi présents. « Tout-petits » rend naturellement le sens de jeunes enfants dépendants porté par טַף.
- source_word: נְשֵׁיהֶם
  choice: leurs femmes
  rationale: Dans cette liste familiale, le terme désigne les épouses; « leurs femmes » est courant, digne et fidèle au contexte.
- source_word: וּבְנֵיהֶם
  choice: et leurs enfants[a]
  rationale: בנים peut désigner spécifiquement les fils ou, plus largement, les enfants et descendants. « Enfants » convient à l’énumération du foyer, tout en signalant l’autre lecture en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte hébreu emploie le tétragramme comme nom propre; sa translittération préserve ce nom au lieu de le remplacer par un titre.
- issue: Portée de בְנֵיהֶם
  choice: leurs enfants
  alternative: leurs fils
  rationale: Le nom peut être générique ou désigner les fils en particulier. Le contexte familial permet le sens plus large, mais l’ambiguïté lexicale est conservée dans la note.
translation_notes:
  register: Français international moderne, simple et solennel. « Tout Juda » garde la formulation collective du texte source; « tout-petits » évite une répétition lourde avec « enfants » tout en distinguant les plus jeunes membres du foyer.
