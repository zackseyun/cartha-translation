  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: fr
  text: Et maintenant, voici les Ammonites, les Moabites et les habitants de la région montagneuse de Séir[a], auxquels tu n’as pas permis à Israël de les attaquer[b] quand il est venu du pays d’Égypte ; car il s’est détourné d’eux et ne les a pas détruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Ammon, Moab et la montagne de Séir ». Les noms désignent ici les peuples concernés, y compris les habitants de la région montagneuse de Séir.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « auxquels tu n’as pas donné à Israël d’entrer contre eux » ; dans ce contexte, il s’agit de ne pas engager d’action militaire contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: Et maintenant, voici
  rationale: « Et maintenant » conserve le lien avec la prière précédente, tandis que « voici » rend la force déictique et emphatique de הִנֵּה dans un registre français digne et naturel.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: les Ammonites, les Moabites et les habitants de la région montagneuse de Séir
  rationale: « Ammonites » et « Moabites » rendent naturellement les peuples visés. Dans cette coordination, « la région montagneuse de Séir » désigne par métonymie ses habitants; ceux-ci sont explicités en français pour éviter de présenter un territoire comme un assaillant.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: tu n’as pas permis à Israël de les attaquer
  rationale: La tournure littérale « donner à Israël d’entrer contre eux » exprime ici l’interdiction d’une action militaire. « Attaquer » en communique clairement le sens sans imposer la notion plus précise d’une occupation durable qu’évoquerait « envahir ».
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: quand il venait du pays d’Égypte
  rationale: Le sujet du suffixe pluriel hébreu est le collectif Israël. Le singulier français reprend naturellement « Israël » et l’imparfait situe l’interdiction pendant son trajet depuis l’Égypte.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: Israël s’est donc détourné d’eux
  rationale: 'כִּי introduit ici l’action conforme à l’interdiction rappelée : Israël a modifié son itinéraire pour éviter ces peuples. La répétition explicite d’« Israël » lève une ambiguïté pronominale qui serait gênante en français.'
- source_word: וְלֹא הִשְׁמִידוּם
  choice: et ne les a pas détruits
  rationale: « Détruire » conserve la forte portée militaire du hifil de שׁמד sans l’intensification supplémentaire que pourrait suggérer « exterminer ».
theological_decisions:
- issue: Maintien de l’adresse directe à Dieu
  choice: tu n’as pas permis
  alternative: le Seigneur n’a pas permis
  rationale: Le verset appartient à une prière adressée directement à Dieu. La deuxième personne de l’hébreu est donc conservée sans introduire un titre divin absent du texte.
- issue: Portée de l’interdiction divine
  choice: de les attaquer
  alternative: d’entrer chez eux / de les envahir
  rationale: Le contexte est militaire, mais l’expression hébraïque reste idiomatique. « Attaquer » rend l’hostilité interdite sans préciser au-delà du texte s’il s’agissait uniquement de traverser un territoire ou de l’occuper.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient le relief rhétorique de la prière. Les gentilés et l’explicitation des habitants de Séir rendent la coordination naturelle. La ponctuation évite le tiret suspensif anglais et présente le verset comme une phrase française complète, tout en gardant son rôle dans l’argumentation de la prière.
