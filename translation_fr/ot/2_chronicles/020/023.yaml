  to: Alors les Ammonites et les Moabites se dressèrent contre les habitants de la région montagneuse de Séïr pour les vouer à la destruction[a] et les exterminer. Quand ils en eurent fini avec les habitants de Séïr, ils s’aidèrent mutuellement à se détruire.
