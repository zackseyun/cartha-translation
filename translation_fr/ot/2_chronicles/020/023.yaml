  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: fr
  text: Alors les Ammonites et les Moabites se dressèrent contre les habitants de la région montagneuse de Séïr pour les vouer à la destruction[a] et les exterminer. Quand ils en eurent fini avec les habitants de Séïr, ils s’aidèrent mutuellement à se détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frapper d’interdit », c’est-à-dire les vouer entièrement à la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: se dressèrent contre
  rationale: Avec עַל dans ce contexte militaire, le verbe exprime une action hostile. « Se dressèrent contre » reste proche de l’image hébraïque tout en étant naturel en français.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: les Ammonites et les Moabites
  rationale: Les gentilés français rendent naturellement les désignations collectives « fils d’Ammon » et « Moab ».
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: les habitants de la région montagneuse de Séïr
  rationale: יֹשְׁבֵי désigne les habitants, et הַר peut ici évoquer le territoire montagneux de Séïr plutôt qu’un sommet isolé.
- source_word: לְהַחֲרִים
  choice: les vouer à la destruction
  rationale: Le hiphil de חרם désigne la mise à l’interdit avec destruction; cette formulation conserve sa portée cultuelle et guerrière sans employer un jargon obscur.
- source_word: וּלְהַשְׁמִיד
  choice: les exterminer
  rationale: « Exterminer » exprime l’anéantissement total et distingue ce second verbe du חרם qui précède.
- source_word: וּכְכַלּוֹתָם
  choice: Quand ils en eurent fini
  rationale: La construction כ + infinitif construit a ici une valeur temporelle; le passé antérieur marque clairement l’antériorité dans le récit.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  choice: ils s’entraidèrent
  rationale: L’expression distributive « chacun avec son compagnon » a un sens réciproque, rendu de façon concise et idiomatique.
- source_word: לְמַשְׁחִית
  choice: pour se détruire les uns les autres
  rationale: L’infinitif indique le but ou le résultat de leur action réciproque; le pronom et « les uns les autres » explicitent l’objet sous-entendu par le contexte.
theological_decisions:
- issue: Rendu du vocabulaire de חרם dans un contexte de guerre
  choice: les vouer à la destruction
  alternative: les frapper d’interdit
  rationale: Le verbe porte une dimension cultuelle qui dépasse l’idée générale de tuer. Le texte principal conserve cette portée en français accessible, tandis que la note donne le terme plus formel.
translation_notes:
  register: Français international moderne, narratif et digne. « Région montagneuse de Séïr » évite de faire de הַר שֵׂעִיר un sommet unique. La répétition du vocabulaire de destruction est maintenue, ainsi que l’ironie tragique de l’entraide tournée vers l’anéantissement mutuel.
