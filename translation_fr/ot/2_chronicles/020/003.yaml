base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: fr
  text: Josaphat eut peur[a] et se tourna résolument vers Yahweh pour le chercher[b]. Il proclama un jeûne dans tout Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut saisi de peur ». Le verbe hébreu peut marquer ici le moment où la peur apparaît dans le récit.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il plaça sa face pour chercher Yahweh ». Cette expression hébraïque indique une orientation ou une intention ferme et délibérée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: eut peur
  rationale: Le verbe ירא exprime ici une réaction de peur dans la suite du récit. Le passé simple « eut peur » rend naturellement l’événement, tout en pouvant suggérer l’apparition de la peur.
- source_word: וַיִּתֵּן יְהוֹשָׁפָט אֶת־פָּנָיו
  choice: Il décida
  rationale: Littéralement, Josaphat « mit son visage » à faire quelque chose. En français actuel, « décida » transmet clairement l’intention ferme exprimée par cet idiome.
- source_word: לִדְרוֹשׁ
  choice: de chercher
  rationale: דרש appliqué à Dieu signifie se tourner vers lui afin de rechercher sa présence, son aide ou sa direction. « Chercher » en conserve la portée large.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה et le distingue d’un titre comme « le Seigneur ».
- source_word: וַיִּקְרָא צוֹם
  choice: proclama un jeûne
  rationale: Cette expression désigne l’annonce publique et officielle d’un jeûne; « proclama » convient au contexte royal et collectif.
- source_word: עַל כָּל־יְהוּדָה
  choice: dans tout Juda
  rationale: La préposition עַל indique ici l’étendue de la proclamation, qui concerne tout le territoire ou toute la population de Juda.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Nature de la recherche de Dieu
  choice: chercher Yahweh
  alternative: consulter Yahweh
  rationale: « Chercher » maintient l’ampleur sémantique de דרש, qui peut inclure la prière, le recours à Dieu et la recherche de sa direction, sans limiter le geste à une demande d’oracle.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à la narration historique écrite. L’idiome hébreu relatif au visage est rendu de manière naturelle dans le texte et conservé littéralement en note.
