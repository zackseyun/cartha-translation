  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: fr
  text: 'Si un malheur nous atteint — épée, jugement, épidémie ou famine —, nous nous tiendrons devant cette maison et devant toi, car ton nom est dans cette maison[a], et nous crierons vers toi dans notre détresse : tu nous entendras et tu nous sauveras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton nom est sur cette maison », c’est-à-dire : cette maison porte ton nom.'
    reason: Variante lexicale explicitant l’expression hébraïque sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: רָעָה
  choice: malheur
  rationale: Dans ce contexte, le terme désigne une calamité qui atteint le peuple, et non le mal moral. « Malheur » introduit naturellement les fléaux qui suivent.
- source_word: חֶרֶב
  choice: épée
  rationale: Le terme concret est conservé plutôt que remplacé par « guerre », afin de respecter l’énumération concise de l’hébreu.
- source_word: שְׁפוֹט
  choice: jugement
  rationale: Le mot est compris comme un nom appartenant à la liste des calamités. « Jugement » conserve l’idée d’une sanction sans en préciser excessivement la forme.
- source_word: דֶבֶר
  choice: épidémie
  rationale: Le terme évoque une maladie collective dévastatrice. « Épidémie » est clair en français moderne et convient au contexte des fléaux.
- source_word: רָעָב
  choice: famine
  rationale: Il s’agit d’une pénurie générale de nourriture, et non de la simple faim individuelle.
- source_word: נַעַמְדָה
  choice: nous nous tiendrons
  rationale: Le cohortatif reçoit ici une valeur d’engagement futur dans la proposition conditionnelle.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: devant cette maison
  rationale: « Maison » rend directement le terme hébreu et préserve la manière dont le sanctuaire est désigné, sans expliciter par « temple ».
- source_word: וּלְפָנֶיךָ
  choice: et devant toi
  rationale: Cette formulation maintient le parallélisme entre la maison et Dieu, tout en indiquant que la prière s’adresse à Dieu lui-même.
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: car ton nom est dans cette maison
  rationale: La formulation conserve l’expression hébraïque et son ouverture théologique concernant le lien entre le nom de Dieu et le sanctuaire.
- source_word: וְנִזְעַק
  choice: nous crierons vers toi
  rationale: Le verbe exprime un appel pressant dans la détresse, plus fort qu’une simple mention de la prière.
- source_word: מִצָּרָתֵנוּ
  choice: du sein de notre détresse
  rationale: Cette tournure française exprime l’origine circonstancielle de l’appel tout en restant naturelle et digne.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: et tu entendras et tu sauveras
  rationale: Les deux verbes restent distincts. « Sauver » conserve la portée large et théologique du second sans préciser indûment le mode de délivrance.
theological_decisions:
- issue: La théologie du nom divin liée au sanctuaire
  choice: 'Conserver dans le texte : « ton nom est dans cette maison »'
  alternative: « ton nom est sur cette maison » ou « cette maison porte ton nom »
  rationale: L’expression maintient le lien d’alliance, d’appartenance et de présence entre Dieu et le sanctuaire sans le réduire à une seule explication.
translation_notes:
  register: Français international moderne, clair et digne. La structure solennelle de la prière et l’énumération brève des calamités sont préservées. Le marqueur de note a été placé après l’expression qu’il explique.
