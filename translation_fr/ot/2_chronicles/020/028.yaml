  naturalness: La coordination de deux destinations avec un seul « vinrent » est très condensée en français. Employer « se rendirent » pour la destination finale rend la phrase nettement plus idiomatique sans ajouter de contenu substantiel.
  terminology: « Lyres », « trompettes », « maison de Yahweh » et « Yahweh » sont appropriés. La note sur נְבָלִים doit présenter « luths » comme une alternative au choix principal, non comme une expression ambiguë combinant les deux termes.
