  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: fr
  text: Ils arrivèrent à Jérusalem avec des harpes[a], des lyres et des trompettes, et se rendirent à la maison de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des luths » ; la forme exacte de l’instrument ancien désigné par נְבָלִים est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple de Yahweh » ; littéralement, « la maison de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils vinrent
  rationale: Le verbe בוא, dans la chaîne narrative, exprime ici le déplacement vers Jérusalem. « Vinrent » reste proche de l’hébreu sans préciser indûment qu’ils entrèrent ou qu’ils arrivèrent.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: בִּנְבָלִים
  choice: avec des harpes
  rationale: נֵבֶל désigne un instrument ancien à cordes, probablement de type harpe ou luth. « Harpes » est clair et traditionnel, tandis que l’incertitude organologique est signalée en note.
- source_word: וּבְכִנֹּרוֹת
  choice: des lyres
  rationale: כִּנּוֹר est généralement identifié comme une lyre. Ce choix distingue les deux instruments à cordes nommés en hébreu.
- source_word: וּבַחֲצֹצְרוֹת
  choice: des trompettes
  rationale: חֲצֹצְרָה désigne une trompette cérémonielle. Le métal n’étant pas précisé dans ce verset, « d’argent » n’est pas ajouté.
- source_word: אֶל בֵּית יְהוָה
  choice: jusqu’à la maison de Yahweh
  rationale: La préposition אֶל marque la destination, et בֵּית signifie littéralement « maison ». « Jusqu’à » rend clairement la maison de Yahweh comme terme du déplacement, sans remplacer dans le texte l’image hébraïque par « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre par « Yahweh », plutôt que remplacé par le titre « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve sa fonction de nom personnel et constitue une translittération française largement intelligible, sans lui substituer un titre.
- issue: Sens de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: « Maison » préserve l’expression concrète de l’hébreu. Dans ce contexte, elle désigne bien le temple, mais cette explicitation est laissée à la note afin de ne pas effacer l’image source.
translation_notes:
  register: Français moderne, sobre et narratif. La formulation conserve les trois catégories d’instruments et l’expression hébraïque « maison de Yahweh ». « Avec » évite d’affirmer explicitement que les instruments jouaient, même si le contexte processionnel le suggère.
