  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: fr
  text: Alors, au milieu de l’assemblée, l’Esprit de Yahweh vint sur Yahaziel, fils de Zacharie, fils de Benaya, fils de Yeïel, fils de Mattania, le Lévite, issu des fils d’Asaph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: Alors … Yahaziel
  rationale: La conjonction וְ assure ici la progression du récit. « Alors » rend naturellement cette transition en français. Le nom est translittéré sous la forme « Yahaziel ».
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: fils de Zacharie, fils de Benaya, fils de Yeïel, fils de Mattania
  rationale: La répétition de בֶּן est conservée, car le texte énonce explicitement une lignée. Les noms suivent des formes françaises claires et reconnaissables.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: L’article hébreu est conservé, et l’expression sert d’identification en apposition.
- source_word: מִן בְּנֵי אָסָף
  choice: qui appartenait aux descendants d’Asaph
  rationale: Dans ce contexte généalogique et corporatif, בְּנֵי désigne les membres de la lignée ou du groupe d’Asaph. Cette formulation est plus naturelle en français que le calque « parmi les fils d’Asaph ».
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: l’Esprit de Yahweh vint sur Yahaziel
  rationale: La tournure hébraïque exprime ici la venue de l’Esprit qui rend possible la proclamation prophétique. « Vint sur » conserve le caractère événementiel de l’expression; la reprise du nom évite en français toute ambiguïté liée à un pronom éloigné.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: בְּתוֹךְ הַקָּהָל
  choice: au milieu de l’assemblée
  rationale: La traduction conserve à la fois la valeur spatiale de בְּתוֹךְ et le sens de rassemblement public porté par קָהָל.
theological_decisions:
- issue: Référent de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: l’esprit de Yahweh
  rationale: Le contexte présente l’action divine qui saisit Yahaziel en vue d’une parole prophétique. La majuscule indique le référent divin sans préciser davantage la manière d’être de l’Esprit que ne le fait l’hébreu.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin; « Yahweh » le représente directement au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et accessible. L’ordre des constituants est légèrement réorganisé afin d’éviter une longue dislocation peu naturelle, tout en conservant l’ensemble des informations, la généalogie répétitive et la localisation au sein de l’assemblée.
