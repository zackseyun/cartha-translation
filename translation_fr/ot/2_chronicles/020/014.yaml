  source_fidelity: 'La totalité des éléments du texte hébreu est présente : lien narratif, généalogie répétée, identification comme Lévite, rattachement aux fils d’Asaph, venue de l’Esprit de Yahweh et cadre de l’assemblée. Toutefois, « qui appartenait aux descendants d’Asaph » explicite et reformule davantage que nécessaire la relation מן־בני אסף, tandis que « issu des fils d’Asaph » conserve plus directement la formulation lignagère/corporative sans trancher sa nuance exacte.'
