id: 2CH.20.22
reference: 2 Chronicles 20:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: fr
  text: Au moment où ils commencèrent à chanter avec joie et à louer, Yahweh tendit des embuscades[a] contre les Ammonites, les Moabites et les gens du mont Séir, qui marchaient contre Juda[b], et ils furent frappés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « posta des hommes en embuscade ». Le terme hébreu peut désigner des personnes embusquées aussi bien que, collectivement, des embuscades.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui venaient vers Juda ». Le contexte montre qu’il s’agit d’une avancée hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: Au moment où ils commencèrent
  rationale: La tournure temporelle situe précisément l’intervention qui suit au commencement des chants; le passé simple convient au récit soutenu en français.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: les chants de joie et les louanges
  rationale: רִנָּה peut désigner un cri joyeux ou un chant retentissant; dans ce contexte cultuel, «chants de joie» garde à la fois la dimension vocale et la joie, tandis que תְהִלָּה est rendu par «louanges».
- source_word: נָתַן יְהוָה מְאָרְבִים
  choice: Yahweh tendit des embuscades
  rationale: L’expression française rend idiomatiquement l’hébreu «donner/placer des embusqués». Elle laisse ouverte l’identité des agents, que le texte ne précise pas.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: les Ammonites, les Moabites et les gens du mont Séir
  rationale: Les désignations françaises naturelles des peuples remplacent l’expression littérale «fils d’Ammon» et explicitent la valeur collective de «Moab» et du «mont Séir» sans préciser davantage l’identité de ses habitants.
- source_word: הַבָּאִים לִיהוּדָה
  choice: qui marchaient contre Juda
  rationale: La préposition ל marque littéralement la direction vers Juda, mais le contexte militaire indique une avancée hostile; «marchaient contre» exprime naturellement les deux dimensions.
- source_word: וַיִּנָּגֵפוּ
  choice: et ils furent battus
  rationale: Le niphal de נגף exprime ici le fait d’être frappé et vaincu. «Furent battus» conserve le passif et convient à l’issue militaire sans préciser le mécanisme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; «Yahweh» conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Nature des מְאָרְבִים placés par Yahweh
  choice: des embuscades
  alternative: des hommes embusqués
  rationale: Le participe substantivé peut désigner des personnes en embuscade, mais le texte n’identifie pas ces agents. Le rendu principal évite de trancher une ambiguïté susceptible d’avoir une portée théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. Les marqueurs [a] et [b] sont placés immédiatement après les expressions auxquelles leurs notes se rapportent.
