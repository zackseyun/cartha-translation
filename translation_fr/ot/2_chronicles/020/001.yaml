  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: fr
  text: Après cela, les Moabites, les Ammonites et, avec eux, quelques Ammonites[a], vinrent faire la guerre à Josaphat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « quelques Ammonites ». D’après le contexte et des versions anciennes, beaucoup comprennent qu’il s’agit ici des Méounites, ou d’un autre peuple allié, plutôt que d’une nouvelle mention des Ammonites.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formule introduit la suite du récit. « Après cela » exprime naturellement la succession temporelle sans reproduire lourdement l’idiome « et il arriva ».
- source_word: בָּאוּ
  choice: vinrent
  rationale: Le verbe courant de mouvement garde ici sa valeur simple; l’intention hostile est précisée par la fin de la phrase.
- source_word: בְנֵי מוֹאָב
  choice: les Moabites
  rationale: Il s’agit d’une désignation ethnique; « les Moabites » est l’équivalent français naturel de l’expression littérale « les fils de Moab ».
- source_word: בְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Cette désignation ethnique se rend naturellement par « les Ammonites », plutôt que littéralement par « les fils d’Ammon ».
- source_word: וְעִמָּהֶם
  choice: accompagnés de
  rationale: Cette tournure française fluide conserve l’idée qu’un autre groupe se joignait aux Moabites et aux Ammonites.
- source_word: מֵהָעַמּוֹנִים
  choice: certains Méounites[a]
  rationale: Le texte massorétique vocalisé désigne littéralement « des Ammonites », mais le contexte et des témoins anciens conduisent souvent à reconnaître ici un autre peuple allié, généralement identifié aux Méounites. « Certains » rend la nuance partitive de מִן, tandis que la note préserve la leçon hébraïque reçue.
- source_word: עַל יְהוֹשָׁפָט
  choice: à Josaphat
  rationale: Dans l’expression française complète « faire la guerre à Josaphat », la préposition « à » rend naturellement la valeur hostile de עַל.
- source_word: לַמִּלְחָמָה
  choice: faire la guerre
  rationale: Cette expression rend clairement le but militaire marqué par לְ et le nom מִלְחָמָה, sans préciser indûment la forme exacte des hostilités.
