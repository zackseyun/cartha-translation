  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: fr
  text: 'Après avoir consulté le peuple, il désigna des chanteurs pour Yahweh, qui le louaient dans une sainte parure[a], lorsqu’ils s’avançaient devant l’avant-garde[b], en disant : « Rendez grâce à Yahweh, car son amour fidèle dure pour toujours[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la splendeur de la sainteté », « dans la beauté de la sainteté » ou « dans une parure sainte ». L’expression hébraïque peut désigner une sainte parure, la splendeur propre à la sainteté, ou la manière sainte dont la louange est offerte.
    reason: lexical_alternative
  - marker: b
    text: Ou « devant les troupes de tête » ou « devant les hommes armés ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sa bonté dure pour toujours » ou « sa compassion dure pour toujours ». Le mot hébreu évoque un amour constant et fidèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל הָעָם
  choice: Après avoir consulté le peuple
  rationale: Le nifal de יעץ exprime ici l’action de prendre conseil ou de consulter. Cette formulation française restitue naturellement la séquence narrative.
- source_word: וַיַּעֲמֵד מְשֹׁרֲרִים
  choice: il désigna des chanteurs
  rationale: Le hifil de עמד peut signifier établir, placer ou désigner; dans ce contexte d’attribution d’un rôle cultuel, « désigna » convient mieux que la simple idée de position physique. מְשֹׁרֲרִים désigne précisément des chanteurs.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל peut indiquer ici que les chanteurs sont affectés au service ou à la louange de Yahweh.
- source_word: וּמְהַלְלִים לְהַדְרַת קֹדֶשׁ
  choice: afin qu’ils célèbrent la splendeur de la sainteté
  rationale: Le participe מהללים décrit leur fonction de louange. La construction française explicite cette fonction sans déterminer si la « splendeur » qualifie Dieu, le culte ou la sainteté elle-même; une note conserve les autres lectures possibles.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: Ils marchaient devant les troupes d’avant-garde
  rationale: בְּצֵאת marque l’action concomitante de la sortie. הֶחָלוּץ désigne la force équipée qui ouvre la marche, non nécessairement l’armée entière.
- source_word: הוֹדוּ לַיהוָה
  choice: Célébrez Yahweh
  rationale: Le hifil de ידה peut exprimer l’action de rendre grâce, louer ou célébrer. « Célébrez » convient au refrain liturgique et reste naturel en français.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: car son amour fidèle dure pour toujours
  rationale: חֶסֶד associe amour, fidélité et bienveillance durable. « Amour fidèle » en préserve la profondeur relationnelle sans imposer exclusivement une lecture juridique de l’alliance. Le verbe « dure » explicite naturellement la proposition nominale hébraïque.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Référent de לְהַדְרַת קֹדֶשׁ
  choice: la splendeur de la sainteté
  alternative: la parure sainte / la sainte splendeur
  rationale: 'La construction hébraïque demeure ouverte: elle peut évoquer la majesté propre à la sainteté, une splendeur sainte ou une parure cultuelle. Le texte principal reste formellement proche, et la note signale l’ambiguïté.'
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: bonté / compassion / fidélité d’alliance
  rationale: Le terme réunit plusieurs nuances que nul équivalent français unique ne couvre entièrement. « Amour fidèle » maintient ensemble la dimension affective et la constance relationnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour éviter une longue accumulation participiale. « Troupes d’avant-garde » est plus transparent que « avant-garde » seul; « amour fidèle » rend חֶסֶד sans archaïsme.
