  to: 'Après avoir consulté le peuple, il désigna des chanteurs pour Yahweh, qui le louaient dans une sainte parure[a], lorsqu’ils s’avançaient devant l’avant-garde[b], en disant : « Rendez grâce à Yahweh, car son amour fidèle dure pour toujours[c]. »'
  rationale: La révision rend le sens de reconnaissance de הוֹדוּ par « Rendez grâce », et elle reformule la locution ambiguë לְהַדְרַת קֹדֶשׁ comme une circonstance de la louange, lecture contextuellement naturelle sans supprimer les autres possibilités dans la note. « Lorsqu’ils s’avançaient » conserve la valeur concomitante de בְּצֵאת et le lien avec le déplacement devant l’avant-garde.
  reviewer_model: gpt-5.6-terra
