source:
  edition: WLC
  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: fr
  text: Ainsi, le royaume de Josaphat connut la paix[a], et son Dieu lui accorda le repos de tous côtés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « resta tranquille ».'
    reason: Le verbe hébreu peut décrire le calme et l’absence de trouble aussi bien que la paix.
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: connut la paix
  rationale: Le verbe שׁקט exprime le calme, l’absence de trouble ou la paix. Avec « royaume » pour sujet, « connut la paix » est naturel en français moderne tout en conservant l’idée d’une situation paisible.
- source_word: מַלְכוּת
  choice: royaume
  rationale: Dans ce récit historique, le nom désigne le royaume ou le territoire soumis à Josaphat ; « royaume » est la formulation française la plus courante.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Cette forme française traditionnelle et courante du nom hébreu est immédiatement reconnaissable.
- source_word: וַיָּנַח
  choice: lui accorda le repos
  rationale: La forme causative de נוח indique que Dieu fit bénéficier Josaphat du repos. « Lui accorda le repos » rend clairement cette action divine dans un registre digne et naturel.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe possessif renvoie à Josaphat ; malgré la morphologie du nom אֱלֹהִים, le sens est ici singulier.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: L’expression évoque l’absence de menaces dans toutes les directions. « De tous côtés » restitue naturellement cette portée spatiale globale.
- source_word: וַ
  choice: et
  rationale: La coordination hébraïque est maintenue entre les deux propositions, sans transformer explicitement leur rapport en lien causal.
theological_decisions:
- issue: Rôle de Dieu dans la paix du royaume
  choice: La seconde proposition attribue explicitement à Dieu le repos accordé à Josaphat, tout en conservant la coordination « et ».
  alternative: Employer « car » afin de présenter l’action de Dieu comme l’explication explicite de la paix du royaume.
  rationale: L’action divine est clairement affirmée par le texte, mais l’hébreu coordonne les propositions. Garder « et » préserve cette relation sans résoudre davantage la nuance logique.
translation_notes:
  register: Français international moderne, clair et digne. « Connût la paix » a été évité au profit de « connut la paix », conformément à l’indicatif du récit. La formulation conserve le parallélisme des deux propositions et place bien le marqueur [a] dans le texte principal.
