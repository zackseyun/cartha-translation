  to: Vous n’aurez pas à combattre dans cette bataille. Prenez position, tenez-vous fermes et voyez le salut de Yahweh en votre faveur[a], Juda et Jérusalem ! N’ayez pas peur et ne vous laissez pas abattre. Demain, sortez à leur rencontre, et Yahweh est avec vous[b].
