  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: fr
  text: Vous n’aurez pas à combattre dans cette bataille. Prenez position, tenez-vous fermes et voyez le salut de Yahweh en votre faveur[a], Juda et Jérusalem ! N’ayez pas peur et ne vous laissez pas abattre. Demain, sortez à leur rencontre, et Yahweh est avec vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le salut de Yahweh avec vous ». Dans ce contexte, « salut » désigne notamment la délivrance accordée dans la bataille.'
    reason: Alternative lexicale et indication de la formulation hébraïque.
  - marker: b
    text: 'On peut aussi traduire : « Yahweh sera avec vous ». La phrase hébraïque n’a pas de verbe exprimé et peut être comprise au présent ou au futur.'
    reason: Ambiguïté temporelle de la proposition nominale hébraïque.
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Vous n’aurez pas à combattre dans cette bataille
  rationale: La tournure hébraïque signifie littéralement « ce n’est pas à vous de combattre dans celle-ci ». La formulation française exprime naturellement que Juda ne devra pas livrer lui-même le combat.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: Prenez position, tenez-vous fermes
  rationale: Le premier impératif demande de se placer résolument, et le second de rester debout. Cette combinaison conserve la progression et convient au contexte militaire sans suggérer une passivité relâchée.
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה עִמָּכֶם
  choice: et voyez le salut que Yahweh accomplit en votre faveur
  rationale: יְשׁוּעָה peut désigner le salut ou la délivrance, notamment militaire. « Salut » garde l’ampleur du terme, tandis que « en votre faveur » rend naturellement עִמָּכֶם dans ce contexte. La note préserve la formulation littérale et son ambiguïté syntaxique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: Juda et Jérusalem !
  rationale: Les noms sont employés comme apostrophe. En français, la ponctuation marque naturellement cette adresse sans recourir au « ô » littéraire.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: N’ayez pas peur et ne vous laissez pas abattre
  rationale: La première défense concerne la peur ; חתת évoque le fait d’être brisé, consterné ou découragé. « Ne vous laissez pas abattre » est actuel, digne et conserve cette force.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Demain, sortez à leur rencontre
  rationale: לִפְנֵיהֶם signifie littéralement « devant eux » et, dans ce cadre militaire, décrit le fait d’avancer pour leur faire face. « À leur rencontre » communique ce sens sans affirmer qu’ils doivent combattre.
- source_word: וַיהוָה עִמָּכֶם
  choice: et Yahweh est avec vous
  rationale: La proposition hébraïque est sans verbe explicite. Le présent exprime l’assurance d’une présence déjà réelle, tandis que la note signale la lecture future possible dans le contexte du lendemain.
theological_decisions:
- issue: Portée de יְשׁוּעַת יְהוָה
  choice: le salut que Yahweh accomplit en votre faveur
  alternative: la délivrance de Yahweh en votre faveur
  rationale: Le contexte immédiat est celui d’un secours militaire, mais « salut » préserve la portée plus large du substantif hébreu sans effacer son sens historique.
- issue: Valeur temporelle de וַיהוָה עִמָּכֶם
  choice: Yahweh est avec vous
  alternative: Yahweh sera avec vous
  rationale: L’hébreu ne comporte pas de copule exprimée. Le présent souligne la présence divine actuelle ; le futur est également possible puisque l’ordre concerne le lendemain.
- issue: Relation syntaxique de עִמָּכֶם avec יְשׁוּעַת יְהוָה
  choice: en votre faveur
  alternative: Yahweh, qui est avec vous
  rationale: La séquence hébraïque permet de comprendre « avec vous » comme précisant le salut accordé au peuple ou comme une assurance de la présence de Yahweh. Le texte adopte le premier sens et la note conserve l’autre.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme impératif du discours est conservé. « Yahweh » rend le nom divin ; « ne vous laissez pas abattre » évite à la fois l’archaïsme et un registre trop familier.
