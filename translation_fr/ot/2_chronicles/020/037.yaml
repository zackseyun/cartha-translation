    issue: Réduction de « tes œuvres » au singulier « ton entreprise ».
    rationale: מַעֲשֶׂיךָ est un pluriel. Même si l’entreprise navale est visée dans le contexte, « tes réalisations » conserve mieux la forme et l’étendue du terme source; la note peut ensuite préciser le référent contextuel.
  - severity: low
    issue: Formulation verbale initiale un peu lourde.
    rationale: « Prophétisa contre Josaphat » rend directement וַיִּתְנַבֵּא ... עַל et est plus fluide que « prononça une prophétie contre Josaphat ».
  - severity: low
    issue: Ancrage de la note b trop éloigné de l’expression commentée.
    rationale: La note porte sur « ne purent partir », non sur le toponyme Tarsis; son marqueur doit suivre cette expression.
