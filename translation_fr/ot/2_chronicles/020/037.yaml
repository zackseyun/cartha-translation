  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: fr
  text: 'Alors Éliézer, fils de Dodavahou, de Marésha, prophétisa contre Josaphat : « Parce que tu t’es associé à Ahazia, Yahvé a ruiné tes réalisations[a]. » Les navires furent donc brisés et ne purent partir[b] pour Tarsis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a brisé tes œuvres ». Dans ce contexte, l’expression renvoie aux réalisations de Josaphat, notamment à son projet de construction navale.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « ne furent pas en mesure de partir » ou « furent empêchés de partir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: prononça une prophétie
  rationale: Le hitpael de נבא désigne ici une parole prophétique. Cette formulation est naturelle en français et maintient explicitement la nature prophétique de la déclaration.
- source_word: עַל
  choice: contre
  rationale: Dans le contexte d’un oracle de jugement adressé à Josaphat, la préposition exprime une parole dirigée contre lui plutôt qu’une simple parole à son sujet.
- source_word: מִמָּרֵשָׁה
  choice: de Marésha
  rationale: La préposition מִן indique ici l’origine d’Éliézer. « De Marésha » est la formulation française naturelle.
- source_word: כְּהִתְחַבֶּרְךָ עִם
  choice: Parce que tu t’es associé à
  rationale: 'Le hitpael de חבר garde une nuance réfléchie : Josaphat s’est joint à Ahazia. « S’associer à » convient à l’entreprise commune sans imposer l’idée plus précise d’un traité officiel.'
- source_word: פָּרַץ ... אֶת מַעֲשֶׂיךָ
  choice: a fait échouer ton entreprise
  rationale: Le verbe פרץ évoque une rupture ou une destruction, et מַעֲשֶׂיךָ signifie littéralement « tes œuvres ». Dans ce contexte, l’ensemble désigne l’anéantissement par Yahvé du projet maritime de Josaphat. La note conserve l’image plus littérale.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: Les navires furent donc brisés
  rationale: La forme passive indique que les navires ont été cassés ou détruits. « Furent brisés » conserve le lien lexical avec le jugement annoncé tout en restant clair.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: et ne purent partir
  rationale: Dans cette construction, עצר peut exprimer l’incapacité ou l’empêchement. « Ne purent partir » rend naturellement la conséquence pratique de la destruction des navires sans trancher entièrement entre incapacité et empêchement.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: La forme française traditionnelle et largement reconnue du toponyme hébreu est « Tarsis ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française usuelle du nom divin, plutôt que par un titre substitutif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve sa fonction de nom propre dans un français moderne et courant.
- issue: Lien entre l’association avec Ahazia et la destruction du projet
  choice: La parole prophétique présente explicitement l’association comme la raison du jugement de Yahvé.
  alternative: 'Atténuer le lien en simple succession temporelle : « Quand tu t’es associé »'
  rationale: La construction כְּהִתְחַבֶּרְךָ est ici causale dans le contexte de l’oracle de reproche. Le français « Parce que » maintient cette relation sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres suivent leurs formes françaises usuelles. La formulation garde le ton judiciaire de l’oracle et place les marqueurs de notes auprès des expressions auxquelles les notes se rapportent.
