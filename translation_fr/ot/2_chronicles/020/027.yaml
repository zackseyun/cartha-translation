    rationale: « Repartirent ... et regagnèrent » coordonne deux actions finies, alors que לָשׁוּב est un infinitif introduisant la destination ou le but. « Reprirent le chemin du retour pour rentrer à Jérusalem » conserve ce rapport tout en reproduisant l’insistance du double emploi sans lourdeur artificielle.
  - severity: low
    issue: Note de bas de page interprétative et trop expansive
    rationale: Les propositions « de la défaite » et « en les délivrant » explicitent le contexte, mais ajoutent des notions absentes de la formulation du verset. Une note doit signaler l’alternative sémantique de la préposition sans transformer ces développements contextuels en lectures textuelles.
