  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: fr
  text: Puis tous les hommes de Juda et de Jérusalem, Josaphat à leur tête, reprirent le chemin du retour pour rentrer à Jérusalem dans la joie, car Yahweh les avait réjouis en triomphant de leurs ennemis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les avait réjouis à cause de leurs ennemis ». La préposition hébraïque peut présenter les ennemis comme l’occasion ou l’objet de cette joie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: repartirent ... et regagnèrent
  rationale: Les deux formes de שוב sont rendues sans le pléonasme peu naturel « retournèrent pour retourner ». « Repartirent » exprime le mouvement de retour depuis le champ de bataille, et « regagnèrent » sa destination, tout en reflétant la répétition hébraïque.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלִַם
  choice: tous les hommes de Juda et de Jérusalem
  rationale: אִישׁ est un nom masculin singulier employé distributivement pour l'ensemble du groupe. Le pluriel français est naturel et conserve la référence masculine explicite.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: Josaphat à leur tête
  rationale: Rend directement l'image spatiale devenue une expression de direction et de conduite du groupe.
- source_word: בְּשִׂמְחָה
  choice: dans la joie
  rationale: Expression française naturelle qui conserve la forme nominale de שִׂמְחָה.
- source_word: שִׂמְּחָם
  choice: les avait réjouis
  rationale: 'Le piel de שׂמח est causatif : Yahweh est celui qui leur a donné de se réjouir.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מֵאוֹיְבֵיהֶם
  choice: au sujet de leurs ennemis
  rationale: La préposition מִן après le verbe de joie peut désigner l'objet ou l'occasion de la joie. Cette formulation préserve mieux cette latitude que « de la victoire sur leurs ennemis », qui expliciterait davantage le contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription le distingue d'un titre et suit directement la donnée hébraïque.
- issue: Rapport entre la joie et les ennemis dans מֵאוֹיְבֵיהֶם
  choice: au sujet de leurs ennemis
  alternative: à cause de la victoire sur leurs ennemis
  rationale: Le contexte implique le triomphe, mais le texte ne contient pas ici le mot « victoire ». Le rendu retenu conserve la tension sémantique de מִן, qui peut marquer l'occasion ou l'objet de la joie sans ajouter cette notion.
translation_notes:
  register: Français international moderne, digne et accessible. La construction hébraïque répétant שוב est rendue par deux verbes complémentaires afin de préserver l'insistance sans produire une lourdeur artificielle. Le nom traditionnel français « Josaphat » est retenu.
