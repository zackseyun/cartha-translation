source:
  edition: WLC
  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: fr
  text: 'Quand les gens de Juda arrivèrent au poste d’observation qui donne sur le désert, ils se tournèrent vers la multitude. Et voici : il n’y avait que des cadavres étendus à terre[a] ; aucun rescapé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des cadavres tombés à terre ».'
    reason: La traduction principale exprime naturellement l’état des corps ; la note conserve la formulation plus concrète du participe hébreu.
lexical_decisions:
- source_word: וִיהוּדָה
  choice: les gens de Juda
  rationale: Le nom propre désigne ici collectivement les forces de Juda, comme le confirme le verbe suivant au pluriel. Cette formulation rend ce sens collectif clairement et naturellement en français.
- source_word: בָּא
  choice: arrivèrent
  rationale: Le qal accompli de בוא exprime l’arrivée au lieu indiqué. Le pluriel français s’accorde avec le sens collectif de Juda et avec וַיִּפְנוּ.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: au poste d’observation qui donne sur le désert
  rationale: מִצְפֶּה désigne un point d’où l’on observe, et לַמִּדְבָּר en indique ici l’orientation. La formulation conserve le relief topographique sans imposer l’idée d’une tour construite.
- source_word: וַיִּפְנוּ
  choice: ils se tournèrent
  rationale: Le verbe פנה décrit d’abord le fait de se tourner, ici vers la masse ennemie. Le rendu conserve ce mouvement concret plutôt que de le réduire au seul regard.
- source_word: אֶל הֶהָמוֹן
  choice: vers la multitude
  rationale: הָמוֹן peut désigner une foule, une masse ou une multitude. « La multitude » préserve l’ampleur du groupe sans ajouter explicitement « ennemis », fourni par le contexte.
- source_word: וְהִנָּם
  choice: Et voici
  rationale: La particule déictique signale la découverte soudaine de la scène. « Et voici » en conserve la vivacité narrative dans un registre biblique compréhensible.
- source_word: פְּגָרִים
  choice: des cadavres
  rationale: פֶּגֶר désigne des corps morts. « Cadavres » est précis et convient à cette scène de bataille.
- source_word: נֹפְלִים אַרְצָה
  choice: étendus à terre
  rationale: L’expression décrit littéralement des cadavres « tombés à terre ». « Étendus à terre » rend naturellement en français leur état résultant, tandis que la note conserve la forme plus littérale.
- source_word: וְאֵין פְּלֵיטָה
  choice: aucun rescapé
  rationale: פְּלֵיטָה désigne ici celui qui a échappé au désastre. « Aucun rescapé » exprime de façon concise qu’il ne restait personne ayant survécu en s’échappant.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. « Et voici » garde la soudaineté du texte hébreu, tandis que « les gens de Juda » rend explicitement la valeur collective du nom propre et permet de respecter le passage immédiat au pluriel.
