base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: fr
  text: Alors Josaphat et son peuple vinrent s’emparer de leur butin. Ils trouvèrent parmi eux, en abondance, des biens, des cadavres[a] et des objets précieux, et ils en prirent pour eux plus qu’ils ne pouvaient en porter. Ils passèrent trois jours à piller le butin, tant il était abondant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte massorétique porte « cadavres ». Certains témoins anciens et certaines traductions reflètent une leçon telle que « vêtements », ou omettent ce mot, ce qui rend l’énumération plus fluide.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: s’emparer de leur butin
  rationale: L’expression indique le but de leur venue et concerne le butin de guerre. « S’emparer de leur butin » est naturel en français et conserve le suffixe possessif hébreu.
- source_word: בָהֶם לָרֹב
  choice: parmi eux quantité de
  rationale: « Parmi eux » garde le référent humain vraisemblable du pronom, à savoir les ennemis tombés, tandis que « quantité de » exprime clairement l’abondance.
- source_word: רְכוּשׁ
  choice: biens
  rationale: Le nom désigne des possessions ou des biens mobiliers; « biens » convient à cette énumération sans réduire le sens à la seule richesse monétaire.
- source_word: פְגָרִים
  choice: cadavres
  rationale: Le texte massorétique porte le terme ordinaire pour des cadavres ou des corps morts. Cette leçon difficile est maintenue dans le texte principal plutôt que corrigée silencieusement.
- source_word: כְלֵי חֲמֻדוֹת
  choice: objets précieux
  rationale: Cette expression désigne largement des objets recherchés ou de valeur; « objets précieux » est clair et n’impose pas le sens plus étroit de récipients.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: ils en prirent pour eux
  rationale: Le piel de נצל évoque ici l’action d’enlever ou de dépouiller, et לָהֶם indique que les vainqueurs prennent ces choses pour eux-mêmes. La formulation française reste naturelle dans le contexte.
- source_word: לְאֵין מַשָּׂא
  choice: plus qu’ils ne pouvaient en porter
  rationale: Cette formulation idiomatique rend l’idée que la quantité dépassait leur capacité de transport.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Ils passèrent trois jours à piller
  rationale: La construction exprime une activité continue durant trois jours; cette tournure française en restitue naturellement la durée.
- source_word: כִּי רַב הוּא
  choice: tant il était abondant
  rationale: La proposition explique la durée du pillage par la quantité exceptionnelle du butin.
