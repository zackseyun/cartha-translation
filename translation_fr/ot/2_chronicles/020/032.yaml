source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: fr
  text: Il suivit la voie de son père Asa et ne s’en écarta pas, faisant ce qui est droit aux yeux de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Il suivit la voie
  rationale: L’expression décrit la conduite du roi. « Suivre la voie » conserve la métaphore hébraïque tout en étant plus naturelle en français que « marcher dans la voie ».
- source_word: אָבִיו אָסָא
  choice: de son père Asa
  rationale: Cette formulation identifie naturellement Asa comme le père de Josaphat et respecte le rapport syntaxique du texte hébreu.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: et ne s’en écarta pas
  rationale: Le verbe סור avec מִן exprime l’idée de s’écarter. Le pronom « en » reprend « la voie » et maintient l’image du chemin.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: faisant ce qui est droit
  rationale: L’infinitif précise ici la conduite qui caractérise cette voie. « Ce qui est droit » rend l’évaluation morale exprimée par יָשָׁר.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve l’image hébraïque de l’évaluation divine et rend directement le nom propre יְהוָה par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le rend comme nom propre, sans le remplacer par un titre.
- issue: Portée de l’évaluation morale
  choice: faisant ce qui est droit aux yeux de Yahweh
  alternative: pour faire ce qui est droit aux yeux de Yahweh
  rationale: Le participe français présente l’action droite comme la manifestation de la conduite décrite, sans imposer une nuance exclusive de but que l’infinitif hébreu ne tranche pas nécessairement.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore de la voie est préservée, mais l’expression « suivre la voie » évite une tournure artificiellement littérale.
