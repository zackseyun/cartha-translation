  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: fr
  text: La crainte de Dieu s’empara de tous les royaumes des pays lorsqu’ils apprirent que Yahweh avait combattu contre les ennemis d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une terreur venant de Dieu ». L’expression hébraïque peut désigner une crainte liée à la présence ou à l’action de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: s’empara
  rationale: La construction narrative introduit l’apparition d’un état. « S’empara de » exprime naturellement en français la peur qui gagne soudainement les royaumes.
- source_word: פַּחַד אֱלֹהִים
  choice: la crainte de Dieu
  rationale: Cette formulation conserve le lien explicite avec Dieu sans trancher entre la crainte éprouvée devant lui et la terreur provoquée par son intervention.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: de tous les royaumes des différents pays
  rationale: Le pluriel הָאֲרָצוֹת désigne ici les pays ou territoires environnants plutôt que nécessairement toute la terre. La construction avec « s’empara » exige naturellement « de ».
- source_word: בְּשָׁמְעָם
  choice: lorsqu’ils apprirent
  rationale: L’infinitif construit avec préposition marque la circonstance temporelle. Dans ce contexte, entendre la nouvelle équivaut naturellement à l’apprendre.
- source_word: כִּי
  choice: que
  rationale: Après « apprirent », la conjonction introduit le contenu de la nouvelle reçue.
- source_word: נִלְחַם
  choice: avait combattu
  rationale: L’accompli décrit une intervention achevée, antérieure à la nouvelle qui parvient aux royaumes; le plus-que-parfait français rend clairement ce rapport temporel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du tétragramme préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עִם
  choice: contre
  rationale: Avec le verbe « combattre », עִם désigne ici la partie adverse; « contre » rend sans ambiguïté le rapport hostile.
- source_word: אוֹיְבֵי יִשְׂרָאֵל
  choice: les ennemis d’Israël
  rationale: La chaîne construite désigne directement les ennemis appartenant au camp opposé à Israël.
theological_decisions:
- issue: Sens de פַּחַד אֱלֹהִים
  choice: la crainte de Dieu
  alternative: une terreur venant de Dieu
  rationale: Le syntagme hébreu peut évoquer la crainte inspirée par la présence ou l’action de Dieu, voire une terreur envoyée par lui. Le texte principal maintient la formulation relationnelle et la note conserve l’autre nuance possible.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom propre divin. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. « S’empara de » restitue avec naturel l’irruption de la crainte; « des différents pays » évite de suggérer sans nécessité une portée mondiale tout en respectant le pluriel hébreu.
