    issue: « des différents pays »
    rationale: « Différents » n’est pas exprimé dans l’hébreu et introduit une nuance inutile. « des pays » rend le pluriel de הָאֲרָצוֹת plus directement.
  - severity: medium
    issue: Absence de « contre » après « avait combattu »
    rationale: Le français « combattre les ennemis » est ambigu quant aux camps en présence. Le contexte et la construction נלחם עם exigent que Yahweh soit présenté comme combattant contre les ennemis d’Israël.
  revised_text: La crainte de Dieu s’empara de tous les royaumes des pays lorsqu’ils apprirent que Yahweh avait combattu contre les ennemis d’Israël.[a]
