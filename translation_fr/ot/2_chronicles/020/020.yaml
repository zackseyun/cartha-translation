  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: fr
  text: 'Ils se levèrent de bon matin et partirent pour le désert de Tekoé. Alors qu’ils partaient, Josaphat se tint debout et dit : « Écoutez-moi, Juda, et vous, habitants de Jérusalem ! Croyez en Yahweh[a] votre Dieu, et vous serez affermis[b] ; croyez ses prophètes[c], et vous réussirez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yahweh » transcrit le nom divin YHWH.
    reason: divine_name
  - marker: b
    text: 'L’hébreu fait un jeu de mots avec deux formes de la même racine : « croyez » et « soyez affermis ». On peut aussi traduire : « faites confiance à Yahweh votre Dieu, et vous tiendrez ferme ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « faites confiance à ses prophètes ». Le même verbe hébreu traduit par « croyez » est répété pour produire un effet rhétorique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Ils se levèrent de bon matin
  rationale: Le hiphil de שׁכם exprime le fait de se lever ou de partir tôt. « De bon matin » est naturel en français et conserve l’insistance temporelle.
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: pour le désert de Tekoa
  rationale: מִדְבָּר désigne une région aride ou peu habitée, sans impliquer nécessairement un désert de sable. « Désert de Tekoa » est la désignation géographique traditionnelle et intelligible.
- source_word: וּבְצֵאתָם
  choice: Au moment où ils partaient
  rationale: La préposition suivie de l’infinitif construit forme une proposition temporelle. Cette formulation française rend la simultanéité du départ et de la prise de parole.
- source_word: עָמַד
  choice: se tint debout
  rationale: Le verbe עמד signifie ici que Josaphat se tient debout pour prendre la parole. Cette formulation reste sobre tout en étant plus naturelle que le simple « se tint ».
- source_word: שְׁמָעוּנִי
  choice: Écoutez-moi
  rationale: L’impératif de שמע avec suffixe objet constitue un appel direct à prêter attention. « Écoutez-moi » est courant et exact en français moderne.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: et habitants de Jérusalem
  rationale: Le participe substantivé de ישׁב désigne ceux qui résident dans la ville. « Habitants » convient au registre d’une proclamation publique.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Croyez en Yahweh votre Dieu
  rationale: Le hiphil de אמן avec ב exprime la foi ou la confiance placée en quelqu’un. « Croyez en » préserve le parallélisme avec l’exhortation suivante.
- source_word: וְתֵאָמֵנוּ
  choice: et vous serez affermis
  rationale: Le niphal de אמן évoque le fait d’être établi, ferme ou assuré. « Serez affermis » conserve l’idée de solidité et laisse percevoir l’écho rhétorique avec « croyez ».
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: croyez ses prophètes
  rationale: La répétition du hiphil de אמן poursuit le parallélisme. En français, « croire ses prophètes » signifie tenir leur parole pour vraie et convient mieux ici que « croire en ses prophètes », qui pourrait suggérer qu’ils sont eux-mêmes l’objet ultime de la foi.
- source_word: וְהַצְלִיחוּ
  choice: et vous réussirez
  rationale: Le hiphil de צלח exprime ici le fait de réussir ou de prospérer dans l’entreprise. « Réussirez » est direct, naturel et adapté au contexte militaire.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin יהוה. La translittération « Yahweh » préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Portée de אמן dans les deux exhortations
  choice: « Croyez en Yahweh » puis « croyez ses prophètes »
  alternative: « Faites confiance à Yahweh » puis « faites confiance à ses prophètes »
  rationale: La répétition de « croyez » rend celle du verbe hébreu et maintient le lien avec « vous serez affermis ». La différence de construction française distingue la foi placée en Dieu de l’accueil confiant de la parole transmise par ses prophètes, sans imposer une élaboration doctrinale ultérieure.
- issue: Lien entre croire et être affermi
  choice: vous serez affermis
  alternative: vous tiendrez ferme
  rationale: « Affermis » rend la forme passive et la notion d’établissement ou de solidité contenue dans le niphal תֵאָמֵנוּ, tout en conservant autant que possible l’écho entre les deux formes de la racine אמן.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le rythme solennel d’une proclamation publique, avec un vocabulaire courant. Le parallélisme hébreu et sa tension entre foi, fermeté et réussite sont préservés sans surinterprétation confessionnelle.
