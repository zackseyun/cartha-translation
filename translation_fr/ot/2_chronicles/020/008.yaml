  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: fr
  text: 'Ils y habitèrent[a] et y construisirent pour toi un sanctuaire pour ton nom[b], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils s’y établirent » ou « ils y résidèrent ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « un sanctuaire pour ton nom » désigne un lieu saint consacré au nom de Dieu, c’est-à-dire à sa présence révélée et à son honneur.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: ils s’y établirent
  rationale: Le verbe ישׁב désigne ici le fait de prendre résidence dans le pays. « S’établirent » exprime naturellement en français à la fois l’installation et l’occupation durable, sans le ton archaïque de « demeurèrent ».
- source_word: בָהּ
  choice: y
  rationale: Le suffixe féminin singulier renvoie au pays mentionné dans le contexte. Le pronom adverbial « y » est la formulation française la plus naturelle.
- source_word: וַיִּבְנוּ
  choice: construisirent
  rationale: Rendu courant et précis de בנה dans le contexte de l’édification d’un sanctuaire.
- source_word: לְךָ
  choice: pour toi
  rationale: 'La préposition ל exprime ici le bénéficiaire et la dédicace : le sanctuaire est construit à l’intention de Dieu.'
- source_word: מִקְדָּשׁ
  choice: un sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu saint. « Sanctuaire » conserve cette valeur sacrée sans remplacer le terme par « temple », plus institutionnel et plus spécifique.
- source_word: לְשִׁמְךָ
  choice: pour ton nom
  rationale: Ce rendu direct préserve la formule biblique et son association avec la présence révélée, l’honneur et la renommée de Dieu, sans la réduire à une simple expression de but ou d’autorité.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: La formule introduit les paroles rapportées au verset suivant. Les deux-points conviennent à cette fonction en français moderne.
theological_decisions:
- issue: Sens de « un sanctuaire pour ton nom »
  choice: Un sanctuaire consacré au nom de Dieu, associé à sa présence révélée et à son honneur
  alternative: Un temple pour ton honneur, ou un lieu saint portant ton nom
  rationale: 'La traduction littérale « pour ton nom » maintient la tension biblique : le sanctuaire est lié au nom et à la présence de Dieu sans laisser entendre que Dieu y serait spatialement contenu.'
translation_notes:
  register: Français international moderne, clair et digne. « S’y établirent » rend le contexte de l’installation dans le pays; « pour ton nom » conserve volontairement la formulation et la portée théologique de l’hébreu.
