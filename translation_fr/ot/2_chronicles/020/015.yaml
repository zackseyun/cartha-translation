  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: fr
  text: 'Il dit : « Écoutez, vous tous de Juda, habitants de Jérusalem, et toi, roi Josaphat ! Voici ce que Yahweh vous dit : “N’ayez pas peur et ne vous laissez pas abattre devant cette grande multitude, car ce combat n’est pas le vôtre, mais celui de Dieu[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car le combat n’est pas à vous, mais à Dieu ».'
    reason: La note signale la construction hébraïque avec ל, rendue dans le texte par une possession idiomatique en français.
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle à une écoute attentive; « Écoutez » est direct, naturel et conserve la solennité de l’exhortation.
- source_word: כָל יְהוּדָה
  choice: vous tous de Juda
  rationale: La forme explicite les personnes interpellées tout en conservant la désignation collective « Juda ».
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: habitants de Jérusalem
  rationale: Le participe désigne les personnes qui résident à Jérusalem; cette formulation est claire et idiomatique.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: et toi, roi Josaphat
  rationale: Le pronom « toi » rend explicite l’adresse directe au singulier après les groupes collectifs, sans modifier le référent hébreu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que Yahweh vous dit
  rationale: Cette formulation française naturelle conserve la fonction solennelle de la formule prophétique de messager.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: N’ayez pas peur et ne soyez pas terrifiés
  rationale: Deux interdictions distinctes sont maintenues, reliées par « et »; « terrifiés » exprime ici l’idée d’être abattu ou saisi d’effroi sans employer un français désuet.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: devant cette grande multitude
  rationale: « Devant » conserve l’image relationnelle de מִפְּנֵי et convient à la confrontation avec une force nombreuse.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: car ce combat n’est pas le vôtre, mais celui de Dieu
  rationale: Le français exprime naturellement la construction possessive elliptique et son contraste, tout en limitant l’affirmation au conflit présent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » représente le nom propre plutôt que de le remplacer par un titre.
- issue: Appartenance du combat
  choice: ce combat n’est pas le vôtre, mais celui de Dieu
  alternative: ce n’est pas à vous de combattre, mais à Dieu
  rationale: Le choix préserve la construction d’appartenance et l’accent sur la maîtrise divine du conflit, sans transformer explicitement la phrase en consigne d’inaction.
translation_notes:
  register: Français international actuel, digne et accessible. La parole prophétique garde un ton solennel sans archaïsmes; les deux prohibitions hébraïques restent distinctes.
