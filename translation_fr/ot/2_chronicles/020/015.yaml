  source_fidelity: 'Le sens général est fidèlement rendu : l’appel à Juda, aux habitants de Jérusalem et au roi Josaphat, les deux interdictions et l’affirmation que le combat appartient à Dieu sont conservés. Toutefois, « ne soyez pas terrifiés » est plus fort et plus étroit que תֵּחַתּוּ, qui évoque le fait d’être abattu, consterné ou découragé.'
