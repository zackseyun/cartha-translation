  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: fr
  text: Alors les lévites issus des Qehatites et des Coréites se levèrent pour louer Yahweh, le Dieu d’Israël, à très haute voix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ajoute un terme qui peut avoir un sens spatial (« en haut », « vers le haut »), mais qui est généralement compris ici comme intensifiant l’expression « à haute voix » : « très hautement » ou « extrêmement fort ».'
    reason: Précise la valeur probablement intensive de לְמָעְלָה dans le contexte tout en signalant sa valeur spatiale possible dans d’autres emplois.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le qatal narratif de קום décrit l’action concrète de se mettre debout; « se levèrent » convient au registre narratif et public de la scène.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française courante du groupe tribal et cultuel, avec l’article défini conservé.
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: issus des Qehatites et des Coréites
  rationale: Cette formulation naturelle conserve l’idée d’appartenance généalogique exprimée par מִן בְּנֵי sans reproduire en français la tournure lourde « des fils des… ».
- source_word: לְהַלֵּל
  choice: pour louer
  rationale: L’infinitif avec לְ exprime ici le but. « Louer » reste général et n’ajoute pas explicitement l’idée de chanter, absente du verbe hébreu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme יהוה, qui garde dans le texte le nom divin employé par la source.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de l’expression construite, placée en apposition à « Yahweh ».
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: d’une voix très forte
  rationale: La locution décrit le volume de la louange; לְמָעְלָה renforce vraisemblablement בְּקוֹל גָּדוֹל. « Très forte » restitue cet effet dans un français naturel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve la présence du nom propre sans remplacer celui-ci par un titre.
- issue: Nature vocale de la louange
  choice: louer… d’une voix très forte
  alternative: chanter les louanges
  rationale: Le verbe הלל indique la louange, et la mention de la voix en précise le caractère sonore; le texte ne contient toutefois aucun verbe signifiant explicitement « chanter ».
translation_notes:
  register: Français moderne, clair et digne. La formulation généalogique est légèrement allégée pour rester naturelle, tandis que le nom divin et l’ambiguïté de l’expression finale sont préservés.
