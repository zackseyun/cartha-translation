  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: fr
  text: 'et dit : « Yahweh, Dieu de nos pères[a], n’est-ce pas toi qui es Dieu dans les cieux ? Tu domines sur tous les royaumes des nations. Dans ta main sont la force et la puissance, et nul ne peut te résister[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu de nos ancêtres ». L’hébreu dit littéralement « Dieu de nos pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nul ne peut se dresser contre toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: La forme narrative poursuit directement l’action du verset précédent; le sujet reste identifiable dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de préserver le nom propre présent dans le texte hébreu.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Dieu de nos pères
  rationale: Cette formulation conserve le masculin pluriel de l’hébreu ainsi que la résonance traditionnelle et relationnelle de l’expression.
- source_word: הֲלֹא אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: n’est-ce pas toi qui es Dieu dans les cieux ?
  rationale: La question rhétorique, qui appelle une réponse affirmative, est conservée dans une formulation française naturelle; le pluriel « les cieux » reflète la forme hébraïque.
- source_word: מוֹשֵׁל
  choice: domines
  rationale: Le participe exprime l’exercice continu de la souveraineté; « dominer sur » convient au registre royal et à l’objet que sont les royaumes.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: les royaumes des nations
  rationale: La traduction garde les deux substantifs et l’étendue universelle indiquée par כֹל.
- source_word: וּבְיָדְךָ
  choice: Dans ta main
  rationale: L’image hébraïque de la main comme siège de la capacité d’agir est préservée plutôt que remplacée par une abstraction.
- source_word: כֹּחַ וּגְבוּרָה
  choice: la force et la puissance
  rationale: Le binôme exprime à la fois la capacité et la puissance victorieuse, dans une tournure claire et solennelle en français.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: nul ne peut te résister
  rationale: Dans ce contexte, התיצב désigne le fait de se dresser en opposition; « résister » rend ce sens de façon concise et idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Langage masculin dans אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » reproduit le masculin pluriel du texte et son expression traditionnelle, tandis que « nos ancêtres » demeure une possibilité sémantique plus inclusive.
- issue: Portée de la question rhétorique
  choice: deux questions rhétoriques successives
  alternative: une seule question englobant l’affirmation de la domination
  rationale: L’hébreu n’emploie הֲלֹא qu’au début, mais la coordination permet de comprendre l’affirmation suivante dans la même portée rhétorique. Deux questions donnent en français une progression claire sans changer la réponse affirmative attendue.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de la prière. La structure rhétorique et l’image de la main sont conservées; les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
