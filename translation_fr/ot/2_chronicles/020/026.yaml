source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: fr
  text: Le quatrième jour, ils se rassemblèrent dans la vallée de Beraka[a], car c’est là qu’ils bénirent Yahvé. C’est pourquoi ils donnèrent à cet endroit le nom de « vallée de Beraka », qu’il porte encore aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beraka signifie « bénédiction ».
    reason: Le sens du nom hébreu explique le jeu de mots avec « ils bénirent Yahvé ».
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: ils se rassemblèrent
  rationale: 'Le niphal de קהל a ici un sens intransitif ou réfléchi : les gens se réunissent. « Se rassemblèrent » exprime clairement ce mouvement collectif en français naturel.'
- source_word: עֵמֶק
  choice: vallée
  rationale: Le nom désigne une vallée et entre ici dans la formation d’un nom de lieu.
- source_word: בְּרָכָה
  choice: Beraka
  rationale: Dans le nom de lieu עֵמֶק בְּרָכָה, le terme est translittéré. La note en donne le sens afin de préserver le jeu de mots avec le verbe « bénirent ».
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: car c’est là qu’ils bénirent Yahvé
  rationale: כִּי introduit la raison de cette appellation. La tournure française met naturellement en relief le lieu tout en maintenant le lien lexical entre בֵּרֲכוּ et בְּרָכָה.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin plutôt que par le titre substitutif « le Seigneur ».
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: ils donnèrent à cet endroit le nom de
  rationale: Cette formulation rend idiomatiquement en français la formule hébraïque littérale « ils appelèrent le nom de cet endroit », sans perdre l’acte explicite de nomination.
- source_word: עַד הַיּוֹם
  choice: encore aujourd’hui
  rationale: Cette expression française naturelle rend l’idiome hébreu indiquant que le nom demeurait en usage à l’époque du narrateur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » conserve en français sa fonction de nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe de la formule de nomination est légèrement lissée pour rester naturelle.
