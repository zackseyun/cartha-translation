source:
  edition: WLC
  text: מָחָר֙ רְד֣וּ עֲלֵי/הֶ֔ם הִנָּ֥/ם עֹלִ֖ים בְּ/מַעֲלֵ֣ה הַ/צִּ֑יץ וּ/מְצָאתֶ֤ם אֹתָ/ם֙ בְּ/ס֣וֹף הַ/נַּ֔חַל פְּנֵ֖י מִדְבַּ֥ר יְרוּאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: fr
  text: Demain, descendez contre eux. Voici qu’ils montent par la montée de Tsits. Vous les trouverez au bout de l’oued[a], en face du désert de Yerouel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ravin », « vallée » ou « torrent »; le mot hébreu נחל peut désigner une vallée encaissée ou un cours d’eau saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Demain
  rationale: Rend directement l’adverbe temporel sans ajouter l’idée de matin, absente de l’hébreu.
- source_word: רְדוּ עֲלֵיהֶם
  choice: descendez contre eux
  rationale: Conserve le mouvement descendant exprimé par ירד et la valeur hostile de על dans ce contexte militaire.
- source_word: הִנָּם עֹלִים
  choice: Voici qu’ils montent
  rationale: « Voici » restitue la fonction déictique de הִנָּם, tandis que le présent rend naturellement le participe עֹלִים et son mouvement en cours ou imminent.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: par la montée de Tsits
  rationale: Maintient le sens topographique de מַעֲלֶה sans préciser indûment qu’il s’agit d’un col; le nom de lieu est translittéré selon une forme lisible en français.
- source_word: וּמְצָאתֶם אֹתָם
  choice: Vous les trouverez
  rationale: Rend simplement le résultat futur annoncé après l’ordre, sans transformer « trouver » en un terme militaire plus interprétatif.
- source_word: בְּסוֹף הַנַּחַל
  choice: au bout de l’oued
  rationale: סוֹף désigne l’extrémité ou le bout; « oued » rend נחל comme vallée servant de cours d’eau, souvent saisonnier, et évite de suggérer nécessairement un ruisseau permanent.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: en face du désert de Yerouel
  rationale: « En face de » conserve la relation spatiale de פְּנֵי; « désert » est naturel ici pour מִדְבָּר sans imposer une description géographique plus précise que le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Voici qu’ils montent » garde la vivacité de l’annonce sans archaïsme marqué. Les noms Tsits et Yerouel sont translittérés pour une lecture française. Le marqueur de note est placé après « oued », terme auquel la note se rapporte.
