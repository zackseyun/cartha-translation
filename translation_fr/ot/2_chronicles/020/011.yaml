source:
  edition: WLC
  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: fr
  text: 'Et voici comment ils nous le rendent : ils viennent nous chasser de ton domaine[a], que tu nous as donné en héritage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ton héritage, dont tu nous as donné la possession » (les deux expressions hébraïques sont apparentées).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici comment
  rationale: Cette tournure actuelle conserve la force de l’appel emphatique et introduit naturellement la conduite que Josaphat dénonce.
- source_word: הֵם
  choice: ils
  rationale: Le pronom désigne avec insistance les peuples qui rendent le mal pour le bien reçu; en français, cette mise en relief ressort de la construction « voici comment ils ».
- source_word: גֹּמְלִים עָלֵינוּ
  choice: ils nous le rendent
  rationale: 'Le verbe exprime ici la rétribution. Cette expression idiomatique conserve l’ironie du contexte : voilà ce qu’ils donnent en retour à Israël, qui les avait épargnés.'
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: ils viennent nous chasser
  rationale: La formulation rend clairement le moyen ou la manifestation de cette rétribution et traduit גרשׁ par le verbe courant « chasser » dans ce contexte territorial.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: de ton domaine
  rationale: « Domaine » désigne ici le territoire relevant de Dieu et évite de répéter « héritage » dans la proposition suivante, tout en laissant entendre que la terre lui appartient.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: que tu nous as donné en héritage
  rationale: Le hiphil de ירשׁ indique que Dieu a fait entrer Israël en possession du pays. Cette formulation française claire conserve l’idée d’un héritage accordé par Dieu.
theological_decisions:
- issue: La terre comme domaine de Dieu et héritage accordé à Israël
  choice: de ton domaine, que tu nous as donné en héritage
  alternative: de ton héritage, dont tu nous as donné la possession
  rationale: Le texte peut employer deux formes de la même racine pour parler à la fois de ce qui appartient à Dieu et de ce qu’il fait posséder à Israël. Le texte principal distingue naturellement ces deux aspects sans nier leur lien lexical; la note conserve une traduction plus formellement concordante.
translation_notes:
  register: Français international moderne, digne et oralement naturel. « Et voici comment ils nous le rendent » garde l’intensité de la plainte sans recourir à l’archaïsme « voici qu’ils nous rétribuent ».
