  text: וַ/יִּקָּבְצ֣וּ יְהוּדָ֔ה לְ/בַקֵּ֖שׁ מֵֽ/יְהוָ֑ה גַּ֚ם מִ/כָּל עָרֵ֣י יְהוּדָ֔ה בָּ֖אוּ לְ/בַקֵּ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: fr
  text: Les gens de Juda se rassemblèrent pour demander à Yahvé[a] ; de toutes les villes de Juda, ils vinrent même chercher Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « chercher auprès de Yahvé ». L’objet de la demande n’est pas exprimé en hébreu; dans le contexte, il peut s’agir d’aide ou de délivrance.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit ici directement « chercher Yahvé » et emploie une construction différente de celle de la première proposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Juda se rassembla
  rationale: Le nom propre désigne collectivement le peuple ou le royaume de Juda. Le singulier collectif français rend naturellement le nifal pluriel « ils se rassemblèrent » sans réduire Juda à un simple territoire.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: pour rechercher auprès de Yahvé
  rationale: La construction בקשׁ avec מן indique que ce qui est recherché doit venir de Yahvé, sans nommer explicitement l’objet de la demande. « Rechercher auprès de » conserve cette ellipse et suggère, dans le contexte, le recours à son aide.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » translittère le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: גַּם
  choice: même
  rationale: 'L’adverbe souligne l’ampleur de la mobilisation : les participants vinrent jusque de toutes les villes de Juda.'
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: de toutes les villes de Juda
  rationale: Cette formulation claire et proche de l’hébreu exprime l’étendue de la participation dans tout Juda.
- source_word: בָּאוּ
  choice: on vint
  rationale: Le pronom indéfini reprend naturellement en français les membres du collectif « Juda » tout en conservant le simple mouvement exprimé par le verbe hébreu.
- source_word: לְבַקֵּשׁ אֶת יְהוָה
  choice: pour chercher Yahvé
  rationale: Avec la marque de l’objet direct אֶת, Yahvé est explicitement l’objet de la recherche. Cette traduction préserve la différence avec la construction de la première proposition.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte principal conserve le nom personnel divin sous sa forme française usuelle, sans le remplacer par un titre.
- issue: Faut-il harmoniser les deux constructions de בקשׁ ?
  choice: « rechercher auprès de Yahvé » puis « chercher Yahvé »
  alternative: Traduire les deux occurrences par « chercher Yahvé » ou par « rechercher l’aide de Yahvé »
  rationale: L’hébreu emploie d’abord בקשׁ avec מן, puis בקשׁ avec אֶת. Le maintien de cette variation évite aussi bien d’effacer la différence que d’ajouter explicitement « aide » ou « délivrance », mots laissés sous-entendus dans la première proposition.
translation_notes:
  register: Français international moderne, sobre et digne. « Juda » est traité comme un collectif. La répétition du nom « Yahvé » et la variation entre les deux constructions sont volontairement conservées.
