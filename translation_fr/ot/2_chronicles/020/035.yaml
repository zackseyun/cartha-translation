source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: fr
  text: Après cela, Josaphat, roi de Juda, s’associa[a] à Ahazia, roi d’Israël[b], qui agissait méchamment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conclut une alliance avec » ou « se joignit à ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lui, il agissait méchamment en faisant ». Le pronom désigne le plus naturellement Ahazia.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette expression marque simplement la succession des événements. « Après cela » est naturel en français moderne et reste proche de l’hébreu.
- source_word: אֶתְחַבַּר
  choice: s’associa
  rationale: Le hitpael de חבר exprime ici le fait d’entrer dans une association avec quelqu’un. « S’associa » convient au contexte royal et au projet commun développé au verset suivant, sans préciser plus que le texte la forme juridique ou politique du lien.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu direct et idiomatique du titre royal.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: à Ahazia, roi d’Israël
  rationale: La préposition requise par « s’associer » est « à » en français. L’apposition rend directement le titre royal.
- source_word: הוּא
  choice: Il
  rationale: Le pronom indépendant hébreu est conservé comme pronom personnel afin de ne pas trancher silencieusement l’identité de son référent.
- source_word: הִרְשִׁיעַ
  choice: agit avec méchanceté
  rationale: Le hiphil de רשע porte un jugement moral fort sur la conduite. Cette formulation est claire, actuelle et plus proche de la valeur verbale que « était méchant ».
- source_word: לַעֲשׂוֹת
  choice: en faisant cela
  rationale: L’infinitif introduit par ל est très concis. « En faisant cela » relie le jugement à l’action qui vient d’être rapportée sans ajouter de détail absent de l’hébreu.
theological_decisions:
- issue: Référent du pronom הוּא
  choice: Conserver l’ambiguïté par « Il » et l’expliquer en note.
  alternative: 'Faire de la proposition une relative visant explicitement Ahazia : « qui agit avec méchanceté » ; ou rapporter explicitement le jugement à Josaphat.'
  rationale: Ahazia est l’antécédent nominal le plus proche, mais Josaphat demeure le sujet principal de la phrase et l’expression « en faisant cela » peut juger son association. La syntaxe hébraïque ne permet pas d’écarter entièrement l’une des lectures ; le texte français ne doit donc pas résoudre cette tension sans avertissement.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms suivent les formes françaises bibliques usuelles. La phrase finale conserve volontairement l’ambiguïté du pronom hébreu, tandis que la note en expose les deux référents possibles.
