source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: fr
  text: Cependant, les hauts lieux ne furent pas supprimés, et le peuple n’avait pas encore orienté leurs cœurs vers le Dieu de leurs pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’avait pas encore préparé leurs cœurs en vue du Dieu de leurs pères ».'
    reason: Le verbe hébreu peut signifier préparer, établir fermement ou orienter; avec la préposition qui suit, il peut exprimer une préparation en vue de Dieu ou une orientation vers lui.
lexical_decisions:
- source_word: אַךְ
  choice: Cependant
  rationale: Marque naturellement en français le contraste entre l’évaluation positive précédente et la réserve introduite ici.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Terme historique consacré pour les sites cultuels appelés בָּמוֹת, sans préciser davantage leur statut ni la nature exacte du culte qui y était pratiqué.
- source_word: לֹא סָרוּ
  choice: ne disparurent pas
  rationale: Rend le sens contextuel du verbe actif « ne s’écartèrent pas / ne cessèrent pas d’exister » sans introduire explicitement un agent chargé de les supprimer.
- source_word: וְעוֹד
  choice: toujours pas
  rationale: Exprime la persistance d’une situation non résolue et s’intègre naturellement à la négation française.
- source_word: הָעָם
  choice: le peuple
  rationale: Équivalent collectif direct désignant la population.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: n’avait pas orienté son cœur
  rationale: Le hiphil de כון associé au cœur peut évoquer l’action de préparer, d’établir fermement ou de diriger intérieurement. « Orienter son cœur » exprime ici une disposition volontaire dirigée vers Dieu sans la réduire à une simple émotion.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: vers le Dieu de ses ancêtres
  rationale: « Vers » explicite l’orientation exprimée par ל, tandis que « le Dieu de ses ancêtres » conserve la portée historique et collective de l’expression dans un français moderne.
theological_decisions:
- issue: Nature de la défaillance du peuple
  choice: Le texte associe une réforme cultuelle inachevée à l’absence persistante d’une orientation intérieure du peuple vers le Dieu de ses ancêtres.
  alternative: Comprendre uniquement que le peuple ne s’était pas préparé émotionnellement au culte, ou qu’il ne s’était pas établi fermement dans un culte exclusif.
  rationale: La formulation maintient ensemble la situation extérieure des hauts lieux et la disposition du cœur, sans réduire cette dernière à l’émotion ni lui imposer une catégorie doctrinale plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Hauts lieux » conserve le vocabulaire historique biblique; « ancêtres » communique naturellement la référence collective aux pères d’Israël. Le singulier collectif « son cœur » suit le peuple considéré comme un ensemble.
