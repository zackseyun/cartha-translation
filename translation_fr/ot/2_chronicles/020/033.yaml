revisions:
- from: Cependant, les hauts lieux ne disparurent pas, et le peuple n’avait toujours pas orienté son cœur vers le Dieu de ses ancêtres[a].
  to: Cependant, les hauts lieux ne furent pas supprimés, et le peuple n’avait pas encore orienté leurs cœurs vers le Dieu de leurs pères[a].
  rationale: La révision remplace « ne disparurent pas » par une expression contextuellement plus fidèle à l’idée que les hauts lieux n’avaient pas été ôtés. Elle maintient l’ambiguïté lexicale de כון dans la note et améliore la cohérence formelle par le pluriel correspondant au texte source.
