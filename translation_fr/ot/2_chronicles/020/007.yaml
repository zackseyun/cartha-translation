  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: fr
  text: N’est-ce pas toi, notre Dieu, qui as chassé devant ton peuple Israël les habitants de ce pays et qui l’as donné pour toujours à la descendance d’Abraham, ton ami[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « celui qui t’aimait » ; le participe hébreu peut aussi se comprendre comme « celui qui t’aime ».'
    reason: Préserve le sens verbal actif de l’hébreu derrière le titre relationnel « ton ami ».
lexical_decisions:
- source_word: הֲלֹא אַתָּה
  choice: N’est-ce pas toi
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative. La tournure française met naturellement en relief le sujet divin.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Conserve l’adresse directe et l’expression d’appartenance collective, sans ajouter d’interjection absente de l’hébreu.
- source_word: הוֹרַשְׁתָּ
  choice: as chassé
  rationale: Le hifil de ירשׁ exprime ici l’expulsion des occupants antérieurs. « Chasser » est clair en français courant et maintient le contexte de conquête.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: les habitants de ce pays
  rationale: Rend directement l’expression « ceux qui habitent ce territoire ». « Pays » convient au territoire en question et reste naturel en français moderne.
- source_word: מִלִּפְנֵי עַמְּךָ יִשְׂרָאֵל
  choice: devant ton peuple Israël
  rationale: Conserve l’image hébraïque de l’expulsion devant l’avancée ou la présence d’Israël, ainsi que la désignation d’alliance « ton peuple Israël ».
- source_word: וַתִּתְּנָהּ
  choice: et qui l’as donné
  rationale: Le pronom féminin hébreu renvoie au pays. La reprise par « l’ » est naturelle en français, et le second « qui » clarifie la coordination avec la question initiale.
- source_word: לְזֶרַע אַבְרָהָם
  choice: à la descendance d’Abraham
  rationale: זֶרַע est un collectif. « Descendance » en restitue bien le sens sans employer le calque moins naturel « semence ».
- source_word: אֹהַבְךָ
  choice: ton ami
  rationale: Dans ce contexte, le participe sert d’épithète relationnelle pour Abraham. « Ton ami » est idiomatique et correspond à l’usage biblique associé, tandis que le sens verbal plus littéral est signalé en note.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française courante qui rend la durée durable ou perpétuelle de la donation.
theological_decisions:
- issue: Sens de l’épithète אֹהַבְךָ appliquée à Abraham
  choice: ton ami
  alternative: celui qui t’aimait
  rationale: « Ton ami » transmet naturellement le titre relationnel reconnu dans l’usage biblique. Toutefois, le participe hébreu signifie littéralement « celui qui t’aime/aimait » et peut mettre l’accent sur l’amour d’Abraham envers Dieu ; cette nuance est conservée dans la note.
translation_notes:
  register: Français moderne, digne et accessible. La structure rhétorique de la prière est conservée, ainsi que l’image de l’expulsion « devant » Israël. Le marqueur de note [a] est placé immédiatement après l’expression qu’il explique.
