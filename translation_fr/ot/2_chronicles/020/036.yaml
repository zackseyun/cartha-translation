base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: fr
  text: Il s’associa à lui pour construire des navires afin d’aller à Tarsis[a], et ils construisirent des navires à Etsion-Guéber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de naviguer vers Tarsis ». Dans ce contexte maritime, certains comprennent l’expression plus librement, mais l’hébreu indique le plus naturellement une destination.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: Il s’associa avec lui
  rationale: Le hiphil de חבר exprime ici l’entrée dans une association ou un partenariat. « S’associa avec lui » est naturel en français et conserve la portée commerciale ou politique sans la préciser excessivement.
- source_word: לַעֲשׂוֹת / וַיַּעֲשׂוּ
  choice: construire / construisirent
  rationale: Bien que עשה signifie largement « faire », avec des navires le français idiomatique demande « construire ». La répétition du même verbe français maintient le lien lexical entre les deux propositions.
- source_word: אֳנִיּוֹת
  choice: navires
  rationale: Le terme désigne ici des bâtiments destinés à un voyage maritime commercial ; « navires » est précis et digne en français courant.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: destinés à aller à Tarsis
  rationale: La construction exprime le plus naturellement une destination. « Destinés à » rend clairement la finalité liée à la construction, tandis que « aller » préserve le sens général de הלך.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Forme française biblique usuelle du nom de lieu.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: à Etsion-Guéber
  rationale: La préposition ב indique ici le lieu de construction ; « à » convient naturellement devant ce toponyme. La graphie retenue est une translittération française claire.
