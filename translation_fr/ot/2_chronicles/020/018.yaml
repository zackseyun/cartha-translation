  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: fr
  text: Alors Josaphat s’inclina, le visage contre terre, et tout Juda ainsi que les habitants de Jérusalem se jetèrent à terre devant Yahweh pour adorer Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pour se prosterner devant Yahweh » : littéralement, « pour se prosterner à Yahweh ».'
    reason: 'Alternative lexicale : le verbe hébreu désigne concrètement l’acte de se prosterner, avec une portée d’adoration dans ce contexte.'
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: s’inclina
  rationale: Le verbe קָדַד décrit le fait de courber profondément le corps en signe de respect. « S’inclina » rend le geste sans préciser à tort qu’il s’est agenouillé.
- source_word: אַפַּיִם אָרְצָה
  choice: le visage contre terre
  rationale: Cette expression idiomatique indique une profonde prosternation. La formulation française est concrète, naturelle et fidèle au geste décrit.
- source_word: וְכָל יְהוּדָה
  choice: tout Juda
  rationale: « Juda » désigne ici collectivement la population du royaume. La formulation concise conserve cette métonymie de l’hébreu.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Le participe désigne ceux qui résident à Jérusalem ; « les habitants » est l’équivalent français courant.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: tombèrent devant Yahweh
  rationale: La traduction conserve l’action concrète exprimée par נפל et laisse la proposition finale préciser qu’il s’agit d’un acte d’adoration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle en français afin de préserver le nom propre présent deux fois dans le texte hébreu.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: pour adorer
  rationale: La forme réfléchie de שׁחה signifie se prosterner et, dans ce contexte, accomplir cet acte en adoration. Comme la posture physique vient déjà d’être décrite, « adorer » exprime clairement la finalité sans lourde répétition.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La répétition du nom divin dans le texte source est conservée plutôt que remplacée par un pronom.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme à deux reprises. « Yahweh » préserve ici le caractère de nom propre plutôt que de lui substituer un titre.
- issue: Sens cultuel de לְהִשְׁתַּחֲוֺת
  choice: pour adorer
  alternative: pour se prosterner devant
  rationale: Le contexte établit déjà sans ambiguïté la posture corporelle. « Adorer » fait ressortir la portée cultuelle du geste, tandis que la note conserve son sens physique plus littéral.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique écrit. La répétition de « Yahweh » reproduit volontairement celle de l’hébreu.
