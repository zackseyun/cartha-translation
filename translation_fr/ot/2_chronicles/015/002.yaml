base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: fr
  text: 'Il sortit à la rencontre d’Asa et lui dit : « Écoutez-moi, Asa, ainsi que tout Juda et Benjamin : Yahweh est avec vous quand vous êtes avec lui. Si vous le cherchez, il se laissera trouver par vous[a] ; mais si vous l’abandonnez, il vous abandonnera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il sera trouvé par vous ».'
    reason: Alternative lexicale reflétant directement la forme passive du niphal hébreu.
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Il sortit à la rencontre d’Asa
  rationale: Le verbe יצא fait progresser le récit, et לִפְנֵי après un verbe de mouvement indique ici qu’il va au-devant d’Asa. Cette formulation est naturelle en français tout en conservant le mouvement exprimé par l’hébreu.
- source_word: שְׁמָעוּנִי
  choice: Écoutez-moi
  rationale: L’impératif est au pluriel, puisqu’il s’adresse à Asa ainsi qu’à Juda et Benjamin. « Écoutez-moi » rend directement l’appel prophétique dans un français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: est avec vous ... vous êtes avec lui
  rationale: La répétition de « avec » préserve la symétrie et la réciprocité rhétorique de la construction hébraïque.
- source_word: בִּהְיוֹתְכֶם
  choice: quand vous êtes
  rationale: L’infinitif construit précédé de בְּ exprime ici la circonstance temporelle à valeur conditionnelle. « Quand » reste direct et naturel sans effacer cette relation.
- source_word: תִּדְרְשֻׁהוּ
  choice: vous le cherchez
  rationale: Dans ce contexte religieux et relationnel, דרש désigne le fait de chercher Dieu, non simplement de l’interroger.
- source_word: יִמָּצֵא לָכֶם
  choice: il se laissera trouver par vous
  rationale: Le niphal de מצא signifie littéralement « être trouvé ». La tournure pronominale française exprime naturellement la disponibilité accordée par Dieu, tandis que la note conserve la formulation passive plus formelle.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: si vous l’abandonnez, il vous abandonnera
  rationale: La répétition du même verbe français reproduit la réciprocité et le jeu verbal de עזב. « Abandonner » est clair, digne et actuel.
theological_decisions:
- issue: Réciprocité conditionnelle dans le langage d’alliance
  choice: La présence de Yahweh est formulée en relation avec le fait que le peuple demeure avec lui, et chercher ou abandonner Dieu entraîne les résultats correspondants.
  alternative: Atténuer ces affirmations en les présentant comme une simple expérience subjective de la présence divine.
  rationale: Les propositions conditionnelles et les formulations réciproques sont explicites dans l’hébreu. La traduction les conserve sans les intégrer de force à un système doctrinal concernant la persévérance ou l’apostasie.
- issue: Nuance du niphal יִמָּצֵא
  choice: il se laissera trouver par vous
  alternative: il sera trouvé par vous
  rationale: La formulation choisie rend idiomatiquement en français l’accessibilité divine exprimée par le passif hébreu, sans transformer la phrase en « vous le trouverez », qui déplacerait l’accent vers l’action humaine. La lecture plus formelle figure en note.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse plurielle est rendue par « Écoutez-moi ». Le parallélisme « avec vous… avec lui » et la répétition d’« abandonner » maintiennent la force prophétique et la structure réciproque de l’hébreu.
