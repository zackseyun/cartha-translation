  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: fr
  text: Tout Juda se réjouit du serment, car ils avaient juré de tout leur cœur et l’avaient cherché de toute leur volonté. Il se laissa trouver par eux[a], et Yahweh leur accorda le repos de tous côtés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Il fut trouvé par eux. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se réjouit
  rationale: Le verbe שׂמח exprime la joie. Le singulier s’accorde naturellement en français avec le collectif « tout Juda », même si l’hébreu emploie un verbe pluriel.
- source_word: כָל יְהוּדָה
  choice: tout Juda
  rationale: Désigne collectivement le peuple ou le royaume de Juda. Cette formulation concise évite l’anachronisme de « Judée ».
- source_word: עַל הַשְּׁבוּעָה
  choice: du serment
  rationale: Avec un verbe de joie, עַל indique ici l’objet ou la cause de la réjouissance. « Se réjouir du serment » est naturel en français.
- source_word: בְכָל לְבָבָם
  choice: de tout leur cœur
  rationale: Expression française courante qui rend l’engagement sans réserve exprimé par l’hébreu.
- source_word: נִשְׁבָּעוּ
  choice: avaient juré
  rationale: Le plus-que-parfait marque que le serment précède la réjouissance et en fournit la raison.
- source_word: וּבְכָל רְצוֹנָם
  choice: de toute leur volonté
  rationale: Préserve le substantif רָצוֹן et le parallélisme avec « de tout leur cœur », sans réduire l’expression à un simple adverbe.
- source_word: בִּקְשֻׁהוּ
  choice: l’avaient cherché
  rationale: Le pronom renvoie à Yahweh dans le contexte. La traduction conserve ce pronom plutôt que de répéter explicitement le nom divin.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Il se laissa trouver par eux
  rationale: Rend la nuance relationnelle possible du niphal de מצא dans un contexte où Dieu répond à ceux qui le cherchent, tout en signalant en note la formulation plus littérale.
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: Yahweh leur accorda le repos
  rationale: Le hiphil de נוח signifie ici faire reposer ou donner du repos. « Accorder le repos » est naturel et conserve le thème théologique du repos.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: Expression française idiomatique indiquant que le repos s’étend à l’ensemble des alentours.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Nuance du niphal וַיִּמָּצֵא
  choice: Il se laissa trouver par eux
  alternative: Il fut trouvé par eux
  rationale: La traduction principale exprime la réponse favorable de Dieu sans nier l’initiative des chercheurs; la note conserve l’ambiguïté grammaticale grâce au rendu passif plus formel.
translation_notes:
  register: Français international moderne, digne et accessible. Le collectif « tout Juda » est suivi d’un verbe au singulier, puis repris par le pluriel « ils », conformément à l’usage français qui peut passer du collectif aux personnes qu’il désigne. Le parallélisme « de tout leur cœur / de toute leur volonté » est conservé.
