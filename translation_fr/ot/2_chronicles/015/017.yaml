  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: fr
  text: Cependant, les hauts lieux ne furent pas supprimés d’Israël ; le cœur d’Asa resta néanmoins sans partage tout au long de sa vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Terme biblique établi qui désigne des lieux de culte surélevés ou sanctuaires locaux, ici laissés en place.
- source_word: לֹא סָרוּ
  choice: ne disparurent pas
  rationale: Préserve le sens littéral de « ne furent pas écartés/ôtés » tout en restant naturel avec des lieux de culte comme sujet.
- source_word: לְבַב ... שָׁלֵם
  choice: le cœur ... fut entier
  rationale: Rend directement l’idée hébraïque d’un cœur intact, sans la réduire explicitement à la seule notion de dévouement; conserve ainsi la portée morale et théologique du texte.
- source_word: כָּל יָמָיו
  choice: durant toute sa vie
  rationale: Expression française naturelle pour l’hébreu littéral « tous ses jours ».
theological_decisions:
- issue: Tension entre le maintien des hauts lieux et l’évaluation positive d’Asa
  choice: Conserver la juxtaposition sans l’expliquer ni l’atténuer
  alternative: Préciser qu’Asa était « pleinement consacré à Dieu » malgré une réforme incomplète
  rationale: Le texte affirme simultanément les deux faits et ne précise ni l’objet de l’intégrité du cœur ni la manière de résoudre cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Hauts lieux » conserve la terminologie biblique usuelle; « cœur entier » maintient la formulation anthropologique et théologique de l’hébreu.
