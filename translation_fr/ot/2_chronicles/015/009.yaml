revisions:
- from: Il rassembla tout Juda et Benjamin, ainsi que ceux qui séjournaient parmi eux et qui venaient d’Éphraïm, de Manassé et de Siméon. En effet, beaucoup de gens d’Israël étaient passés de son côté[a] en voyant que Yahweh, son Dieu, était avec lui.
  to: Il rassembla tout Juda et Benjamin, ainsi que les résidents étrangers qui vivaient avec eux, originaires d’Éphraïm, de Manassé et de Siméon. En effet, nombreux étaient ceux d’Israël qui s’étaient ralliés à Asa[a], en voyant que Yahweh, son Dieu, était avec lui.
  rationale: La révision précise le statut des גָּרִים comme résidents étrangers, rend עִמָּהֶם par « avec eux », et nomme Asa afin que l’idiome d’allégeance soit clair. La division en deux phrases, la temporalité du plus-que-parfait et la formulation « en voyant » sont conservées.
