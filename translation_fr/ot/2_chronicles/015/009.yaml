  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: fr
  text: Il rassembla tout Juda et Benjamin, ainsi que les résidents étrangers qui vivaient avec eux, originaires d’Éphraïm, de Manassé et de Siméon. En effet, nombreux étaient ceux d’Israël qui s’étaient ralliés à Asa[a], en voyant que Yahweh, son Dieu, était avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étaient tombés sur lui ». Dans ce contexte, l’expression hébraïque désigne des personnes qui se rallient à Asa, en changeant d’allégeance.'
    reason: La note conserve l’image de l’expression נפל על tout en explicitant son sens idiomatique politique.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Il rassembla
  rationale: Le qal narratif de קבץ désigne l’action de réunir des personnes. « Rassembla » est direct, naturel et n’impose pas l’idée plus formelle d’une convocation.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: tout Juda et Benjamin
  rationale: Les noms des tribus et territoires désignent ici leurs populations par métonymie. La formulation conserve la concision de l’hébreu tout en restant claire en français.
- source_word: הַגָּרִים עִמָּהֶם
  choice: ceux qui séjournaient parmi eux
  rationale: גרים peut désigner des personnes établies hors de leur lieu d’origine. Cette formulation contextuelle préserve cette nuance sans les qualifier nécessairement d’étrangers au sens moderne.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: qui venaient d’Éphraïm, de Manassé et de Siméon
  rationale: La préposition מן indique leur provenance. La proposition relative relie naturellement ces lieux d’origine aux personnes qui séjournaient en Juda et Benjamin.
- source_word: נָפְלוּ עָלָיו
  choice: étaient passés de son côté
  rationale: Dans ce contexte politique, l’expression idiomatique signifie abandonner une allégeance pour se rallier à une autre personne. Le choix français communique ce mouvement sans effacer le sens littéral, signalé en note.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: beaucoup de gens d’Israël
  rationale: לרב exprime ici le grand nombre. « Gens d’Israël » évite de faire de « beaucoup d’Israël » une tournure artificielle et maintient la distinction narrative entre Israël et Juda.
- source_word: בִּרְאֹתָם
  choice: en voyant
  rationale: L’infinitif construit précédé de ב exprime la circonstance qui motive leur ralliement. « En voyant » garde le lien temporel et causal sans le préciser excessivement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: son Dieu, était avec lui
  rationale: La formulation rend directement la présence et le soutien divins sans développer davantage leur portée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le distingue du titre אֲדֹנָי et conserve sa fonction nominale.
- issue: Portée de l’affirmation אֱלֹהָיו עִמּוֹ
  choice: son Dieu était avec lui
  alternative: son Dieu était de son côté
  rationale: La traduction littérale préserve la richesse théologique de la présence divine et n’en réduit pas le sens à un simple appui politique ou militaire.
translation_notes:
  register: Français international actuel, clair et digne. La phrase est divisée en deux pour alléger une longue coordination hébraïque. « Ceux qui séjournaient parmi eux » maintient l’ambiguïté sur le statut exact de ces personnes, tandis que « étaient passés de son côté » rend naturellement l’idiome d’allégeance.
