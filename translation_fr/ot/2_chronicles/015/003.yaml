  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: fr
  text: Pendant longtemps, Israël a été sans le vrai Dieu[a], sans prêtre qui enseigne et sans instruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu de vérité »; littéralement, « Dieu de vérité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « loi » ou « enseignement »; le mot hébreu torah peut désigner l’instruction, l’enseignement ou la loi selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Pendant longtemps
  rationale: L’expression signifie littéralement « de nombreux jours », mais désigne idiomatiquement une longue période; le וְ initial s’intègre au fil du discours.
- source_word: לְיִשְׂרָאֵל
  choice: Israël a été
  rationale: Le לְ marque ici l’état ou la situation d’Israël; le français exige une formulation verbale explicite.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: sans le vrai Dieu
  rationale: La construction répétée לְלֹא signifie « sans ». אֱלֹהֵי אֱמֶת peut désigner le Dieu véritable ou fidèle; « le vrai Dieu » est naturel et convient au contexte d’Israël.
- source_word: וּלְלֹא כֹּהֵן מוֹרֶה
  choice: sans prêtre pour enseigner
  rationale: מוֹרֶה est un participe de ירה, « enseigner, instruire ». Cette formulation exprime clairement en français la fonction exercée par le prêtre.
- source_word: וּלְלֹא תוֹרָה
  choice: sans instruction
  rationale: תּוֹרָה désigne ici l’instruction ou l’enseignement, sans devoir être limité au sens de code légal; l’absence d’article en hébreu favorise une formulation non définie.
theological_decisions:
- issue: Sens de אֱלֹהֵי אֱמֶת
  choice: le vrai Dieu
  alternative: le Dieu de vérité; un Dieu véritable; le Dieu fidèle
  rationale: Le contexte d’Israël rend vraisemblable une référence au Dieu véritable, mais la note conserve la valeur littérale et la nuance possible de fidélité.
- issue: Portée de תּוֹרָה
  choice: instruction
  alternative: loi; enseignement
  rationale: Le terme hébreu possède une portée plus large que la seule législation et s’accorde ici avec le rôle enseignant du prêtre. La note préserve les autres rendus possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Pendant longtemps » évite le calque « pendant de nombreux jours »; « prêtre pour enseigner » est plus naturel que « prêtre enseignant » tout en préservant la fonction du participe hébreu.
