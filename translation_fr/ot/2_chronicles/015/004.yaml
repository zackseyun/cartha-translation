source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: fr
  text: Mais, dans leur détresse[a], ils sont revenus vers Yahvé, le Dieu d’Israël; ils l’ont cherché, et il a été trouvé par eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « dans sa détresse »; le singulier désigne collectivement Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de manière plus idiomatique : « il s’est laissé trouver par eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: ils sont revenus
  rationale: Le verbe שׁוּב exprime ici un retour vers Dieu après un éloignement. Bien que la forme hébraïque soit au singulier, le contexte collectif et les verbes pluriels qui suivent justifient le pluriel en français courant.
- source_word: בַּצַּר לוֹ
  choice: dans leur détresse
  rationale: צַר désigne ici la détresse ou l’adversité. Le suffixe singulier renvoie collectivement à Israël; le pluriel rend ce sens naturellement en français, tandis qu’une note conserve la forme plus littérale.
- source_word: עַל יְהוָה
  choice: à Yahvé
  rationale: Avec שׁוּב, la préposition עַל marque ici la personne vers laquelle on revient. « À Yahvé » rend naturellement l’expression et conserve le nom divin.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la chaîne construite, qui maintient l’identification de Yahvé comme Dieu d’Israël.
- source_word: וַיְבַקְשֻׁהוּ
  choice: ils l’ont cherché
  rationale: בקשׁ avec Dieu pour objet signifie le chercher en se tournant vers lui. « Chercher » est simple, actuel et fidèle.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: il s’est laissé trouver par eux
  rationale: Le nifal de מצא signifie littéralement « être trouvé » et peut, dans ce contexte relationnel, se rendre idiomatiquement par « se laisser trouver ». La formulation française évite de suggérer une découverte fortuite, tandis que la note préserve le passif formel.
theological_decisions:
- issue: Référence collective au singulier dans la première proposition
  choice: Employer le pluriel pour désigner collectivement les Israélites
  alternative: « dans sa détresse, il est revenu », le singulier désignant collectivement Israël
  rationale: Le suffixe et le premier verbe sont singuliers, mais les deux verbes suivants sont pluriels et le contexte concerne Israël comme peuple. Le pluriel est plus clair en français sans effacer la donnée formelle, signalée en note.
- issue: Nuance de l’action divine dans וַיִּמָּצֵא לָהֶם
  choice: « il s’est laissé trouver par eux »
  alternative: « il a été trouvé par eux »
  rationale: Le texte emploie un passif qui permet la traduction formelle, mais l’expression française choisie rend plus naturellement le fait que Dieu répond à ceux qui le cherchent. La note maintient l’ambiguïté grammaticale et évite de présenter cette explicitation comme la seule lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. « Yahvé » conserve le nom divin; la ponctuation en deux phrases allège la coordination hébraïque sans modifier sa progression.
