  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: fr
  text: En ces temps-là, il n’y avait pas de paix pour celui qui sortait ou pour celui qui entrait[a], car de nombreux troubles pesaient sur tous les habitants des pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sortir et entrer » désigne les déplacements et les activités ordinaires de la vie quotidienne, notamment les voyages et la vie publique.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « des terres » ou « des territoires ».'
    reason: translation_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: En ces temps-là
  rationale: Rend naturellement la locution temporelle tout en conservant le démonstratif et l’idée de la période évoquée.
- source_word: אֵין שָׁלוֹם
  choice: il n’y avait de paix
  rationale: « Paix » conserve l’étendue sémantique de שָׁלוֹם; le contexte précise qu’il s’agit notamment de sécurité dans les déplacements.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: ni pour celui qui sortait ni pour celui qui rentrait
  rationale: Les participes singuliers ont une valeur générique. La tournure française avec « ni… ni… » convient à la négation et préserve l’expression hébraïque du mouvement ordinaire.
- source_word: כִּי
  choice: car
  rationale: Introduit clairement la cause de l’absence de paix dans un registre narratif digne et courant.
- source_word: מְהוּמֹת רַבּוֹת
  choice: de nombreux troubles
  rationale: מְהוּמָה peut désigner l’agitation, la confusion ou la panique. « Troubles » convient ici au désordre collectif sans en préciser excessivement la forme.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: pesaient sur tous les habitants des différents pays
  rationale: « Pesaient sur » conserve l’image portée par עַל dans un français naturel. « Différents pays » rend explicite le pluriel הָאֲרָצוֹת sans le réduire au seul pays d’Israël.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’expression hébraïque « sortir et rentrer », tout en l’adaptant à la négation française. « Troubles » maintient l’ambiguïté entre agitation, confusion et panique.
