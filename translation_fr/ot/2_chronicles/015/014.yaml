  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: fr
  text: Ils prêtèrent serment à Yahweh d’une voix forte, avec des acclamations, au son des trompettes et des cors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cornes de bélier », ou « shofars ». Le texte distingue ces instruments des trompettes mentionnées juste avant.'
    reason: alternative lexicale et distinction entre deux types d’instruments
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: Ils prêtèrent serment
  rationale: Le niphal de שׁבע désigne ici l’action de prêter serment. Cette formulation française est naturelle et conserve la portée formelle de l’engagement.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition désigne celui envers qui le serment est prêté; le nom divin יהוה est translittéré « Yahweh ».
- source_word: בְּקוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: L’expression idiomatique signifie une expression vocale puissante ou sonore; « d’une voix forte » est clair et naturel en français.
- source_word: וּבִתְרוּעָה
  choice: avec des acclamations
  rationale: תְּרוּעָה peut désigner une clameur, un cri ou une acclamation. Le pluriel collectif français convient à la scène communautaire sans lui donner un caractère guerrier.
- source_word: וּבַחֲצֹצְרוֹת
  choice: au son des trompettes
  rationale: חֲצֹצְרוֹת désigne les trompettes droites, notamment métalliques, employées dans le culte et les assemblées d’Israël.
- source_word: וּבְשׁוֹפָרוֹת
  choice: et des cors
  rationale: שׁוֹפָרוֹת désigne des instruments faits de corne, distincts des חֲצֹצְרוֹת. « Cors » maintient cette distinction dans un français accessible.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et aisément compréhensible. La formulation « au son de » évite la répétition pesante de « avec » tout en conservant l’accompagnement sonore. Le mot « acclamations » garde le caractère collectif de תְּרוּעָה sans préciser indûment s’il s’agit de joie, de culte ou d’un cri de ralliement.
