revisions:
- from: Ils s’engagèrent dans l’alliance[a] à rechercher Yahweh, le Dieu de leurs pères[b], de tout leur cœur et de toute leur âme.
  to: Ils entrèrent dans l’alliance[a] afin de rechercher Yahweh, le Dieu de leurs pères[b], de tout leur cœur et de toute leur âme.
  rationale: La révision remplace une formulation légèrement moins idiomatique par « entrèrent dans l’alliance », qui reflète de près l’expression hébraïque tout en restant naturelle dans le registre biblique moderne. La note a conserve une alternative française courante. La note b est ajustée pour ne pas effacer le masculin pluriel explicite de l’expression source.
