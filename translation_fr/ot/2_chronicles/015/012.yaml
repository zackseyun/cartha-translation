source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: fr
  text: Ils entrèrent dans l’alliance[a] afin de rechercher Yahweh, le Dieu de leurs pères[b], de tout leur cœur et de toute leur âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils s’engagèrent par alliance ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le Dieu de l’alliance adoré par leurs pères.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: Ils s’engagèrent dans l’alliance
  rationale: Littéralement, le tour associe « entrer » à « l’alliance ». En français actuel, « s’engager dans l’alliance » exprime naturellement l’acte d’adhésion solennelle tout en conservant l’article défini de l’hébreu.
- source_word: לִדְרוֹשׁ
  choice: à rechercher
  rationale: Dans ce contexte religieux et relationnel, דרש désigne une orientation active vers Dieu, et non une simple demande de renseignements. « Rechercher » rend cette démarche suivie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Cette formulation conserve le masculin pluriel et la structure de la chaîne construite hébraïque, ainsi que sa résonance ancestrale et liée à l’alliance.
- source_word: בְּכָל לְבָבָם
  choice: de tout leur cœur
  rationale: Cette expression française courante rend le cœur comme centre de la volonté, de l’intention et de l’engagement intérieur.
- source_word: וּבְכָל נַפְשָׁם
  choice: et de toute leur âme
  rationale: נפש peut désigner l’âme, la vie ou la personne entière. Dans cette formule d’engagement total, « âme » préserve le parallélisme traditionnel avec « cœur » sans exclure l’idée de tout l’être.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Langage ancestral masculin dans אֲבוֹתֵיהֶם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: « Leurs pères » correspond directement au masculin pluriel hébreu et conserve la formulation traditionnelle de l’identité d’Israël liée à l’alliance, tandis que la note en précise la portée ancestrale.
- issue: Portée de נַפְשָׁם dans la formule d’engagement
  choice: leur âme
  alternative: tout leur être ; leur vie
  rationale: « Âme » respecte le parallélisme hébreu reçu entre cœur et âme, tout en laissant subsister l’étendue sémantique de נפש; la totalité de l’engagement ressort de la répétition de « tout/toute ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme solennel de la formule d’alliance. Le marqueur [a] est placé après « l’alliance », puisque la variante porte sur l’expression hébraïque « entrer dans l’alliance ».
