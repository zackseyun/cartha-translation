id: 2CH.15.1
reference: 2 Chronicles 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨הוּ֙ בֶּן עוֹדֵ֔ד הָיְתָ֥ה עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: fr
  text: L’Esprit de Dieu vint sur Azaria, fils d’Oded[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’Esprit de Dieu était sur Azaria, fils d’Oded. »'
    reason: La tournure hébraïque הָיְתָה עָלָיו peut se comprendre de façon événementielle (« vint sur ») ou plus statique (« était sur »).
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: Azaria
  rationale: Le nom propre est translittéré selon l’usage français courant. Le ו préfixé assure ici la continuité narrative sans exiger un « et » explicite en français.
- source_word: בֶּן
  choice: fils de
  rationale: Dans ce contexte généalogique immédiat, בֶּן désigne naturellement la filiation directe plutôt qu’un descendant plus éloigné.
- source_word: עוֹדֵד
  choice: Oded
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: הָיְתָה עָלָיו
  choice: vint sur
  rationale: Littéralement « fut sur lui ». Avec רוּחַ dans ce cadre prophétique, la tournure peut présenter l’irruption de l’Esprit qui rend possible la parole inspirée; « vint sur » exprime naturellement cette valeur événementielle tout en conservant l’image hébraïque.
- source_word: רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: Dans ce contexte d’inspiration prophétique, l’expression désigne le souffle ou l’Esprit venant de Dieu. Le défini français convient au sens contextuel de la construction, malgré l’absence d’article devant רוּחַ en hébreu.
theological_decisions:
- issue: Faut-il comprendre רוּחַ אֱלֹהִים comme une réalité impersonnelle, « un esprit de Dieu », ou comme « l’Esprit de Dieu » ?
  choice: l’Esprit de Dieu
  alternative: un esprit de Dieu / un souffle divin
  rationale: La formule introduit ici l’inspiration prophétique d’Azaria. « L’Esprit de Dieu » rend le mieux le sens probable de l’expression sans préciser au-delà du texte la nature de cette action divine.
- issue: La formule הָיְתָה עָלָיו décrit-elle un état ou un événement ?
  choice: vint sur
  alternative: était sur
  rationale: La forme de היה peut être rendue de manière statique, mais, dans la progression narrative et avec l’Esprit comme sujet, une lecture événementielle est naturelle. La variante en note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Vint sur » conserve une tonalité biblique intelligible sans archaïsme marqué; la variante littérale est donnée en note.
