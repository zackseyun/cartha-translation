  language: fr
  text: Ils se rassemblèrent donc à Jérusalem, le troisième mois de la quinzième année du règne d’Asa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Ils se rassemblèrent donc
  rationale: Le niphal narratif de קבץ exprime ici le rassemblement collectif, avec une nuance réfléchie ou moyenne que rend naturellement « se rassemblèrent ». « Donc » marque le lien de conséquence avec le contexte précédent sans alourdir la narration.
- source_word: יְרוּשָׁלִַם
  choice: à Jérusalem
  rationale: Forme française usuelle du nom de lieu; la préposition « à » rend la destination implicite dans cette construction hébraïque.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: le troisième mois
  rationale: Dans cette indication de date, le français emploie naturellement « le troisième mois » après la virgule, là où l’hébreu utilise la préposition ב.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: de la quinzième année
  rationale: 'Cette formulation française idiomatique s’intègre à la datation royale complète: « le troisième mois de la quinzième année ».'
- source_word: לְמַלְכוּת אָסָא
  choice: du règne d’Asa
  rationale: מַלְכוּת désigne ici la période pendant laquelle Asa exerce la royauté; « règne » convient précisément à la formule chronologique.
