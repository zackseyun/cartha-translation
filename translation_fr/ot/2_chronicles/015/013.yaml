id: 2CH.15.13
reference: 2 Chronicles 15:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יִדְרֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל יוּמָ֑ת לְ/מִן קָטֹן֙ וְ/עַד גָּד֔וֹל לְ/מֵ/אִ֖ישׁ וְ/עַד אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: fr
  text: Tous ceux qui ne chercheraient pas le SEIGNEUR, le Dieu d’Israël, seraient mis à mort, du plus petit au plus grand[a], hommes et femmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du moindre au plus important ». L’expression hébraïque indique que toute la communauté est concernée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Tous ceux qui
  rationale: Cette tournure française naturelle conserve la portée générale de כֹל אֲשֶׁר.
- source_word: לֹא יִדְרֹשׁ
  choice: ne chercheraient pas
  rationale: Dans le langage religieux des Chroniques, דרשׁ signifie couramment « chercher » Dieu. Le conditionnel rend ici la stipulation rapportée dans le cadre du serment.
- source_word: לַיהוָה
  choice: le SEIGNEUR
  rationale: La forme en petites capitales suit l’usage français courant pour représenter le nom divin יהוה sans le confondre avec le titre ordinaire « Seigneur ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la chaîne construite qui identifie le Dieu recherché.
- source_word: יוּמָת
  choice: seraient mis à mort
  rationale: 'Le hophal de מות est passif et causatif : il désigne le fait d’être mis à mort, non simplement de mourir. Le conditionnel s’accorde avec la stipulation du serment rapportée au verset précédent.'
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  rationale: Cette formule conserve l’image hébraïque tout en restant idiomatique en français; elle peut renvoyer au rang ou à l’importance, et pas seulement à l’âge.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: hommes et femmes
  rationale: Le français idiomatique exprime ainsi la totalité des deux groupes visés; le sens distributif de la paire hébraïque est préservé sans la tournure peu naturelle « de l’homme à la femme ».
theological_decisions:
- issue: Rendre sans l’atténuer la peine prévue par le serment d’alliance
  choice: « seraient mis à mort »
  alternative: « mourraient » ou une paraphrase évoquant l’exclusion de la communauté
  rationale: יוּמָת énonce explicitement une mise à mort. La traduction conserve la sévérité du texte sans l’expliquer, l’adoucir ni l’étendre.
translation_notes:
  register: Français moderne, digne et direct. La phrase garde le caractère juridique du serment rapporté. « Tous ceux » et « hommes et femmes » offrent une formulation collective naturelle, tandis que « du plus petit au plus grand » préserve l’idiome hébraïque et son ambiguïté entre rang, importance et éventuellement âge.
