  text: וּ/מִלְחָמָ֖ה לֹ֣א הָיָ֑תָה עַ֛ד שְׁנַת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ לְ/מַלְכ֥וּת אָסָֽא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/019.yaml
  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: fr
  text: Et il n’y eut pas de guerre jusqu’à la trente-cinquième année du règne d’Asa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à l’an trente-cinq du règne d’Asa ». Certains interprètes comprennent ce nombre selon un système chronologique plus large, plutôt que comme un décompte strict des années du règne d’Asa, afin de l’accorder avec des passages apparentés.'
    reason: Signaler une autre manière d’exprimer la formule et la difficulté chronologique, sans modifier ni harmoniser le texte hébreu.
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: Et il n’y eut pas de guerre
  rationale: La conjonction וּ maintient le lien avec ce qui précède. La forme de היה est ici existentielle, et la tournure française « il n’y eut pas de guerre » rend naturellement l’ensemble avec la négation לֹא.
- source_word: עַד
  choice: jusqu’à
  rationale: La préposition marque le terme de la période sans guerre; « jusqu’à » en est l’équivalent temporel direct et naturel.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: la trente-cinquième année
  rationale: Le nom en construction suivi du nombre forme une indication d’année royale. Le français l’exprime naturellement par un ordinal.
- source_word: לְמַלְכוּת
  choice: du règne
  rationale: Dans cette formule chronologique, מַלְכוּת désigne la période pendant laquelle le roi exerce le pouvoir; « règne » est le terme français idiomatique.
- source_word: אָסָא
  choice: Asa
  rationale: Transcription française courante du nom propre hébreu.
theological_decisions:
- issue: Rapport de cette indication chronologique avec les autres récits concernant Asa
  choice: Traduire directement la formule hébraïque par « la trente-cinquième année du règne d’Asa » sans harmonisation ni correction.
  alternative: Comprendre le nombre selon un système chronologique plus large, par exemple à partir de la division du royaume, ou modifier le nombre pour l’accorder avec les passages parallèles.
  rationale: Le texte hébreu rattache explicitement la trente-cinquième année au règne d’Asa. La traduction conserve cette formulation et laisse subsister la tension chronologique au lieu d’imposer une solution interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure au passé simple convient à la narration historique; la syntaxe reste claire pour un lectorat général.
