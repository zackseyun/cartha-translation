  text: וַ/יָּבֵ֞א אֶת קָדְשֵׁ֥י אָבִ֛י/ו וְ/קָֽדָשָׁ֖י/ו בֵּ֣ית הָ/אֱלֹהִ֑ים כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: fr
  text: 'Il apporta dans la maison de Dieu les dons sacrés de son père et les siens : de l’argent, de l’or et des objets.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו
  choice: les offrandes consacrées par son père
  rationale: Le nom substantivé désigne ici des biens mis à part comme sacrés. « Offrandes consacrées » exprime naturellement leur destination cultuelle sans les réduire à une catégorie rituelle plus précise que l’hébreu.
- source_word: וְקָדָשָׁיו
  choice: et celles qu’il avait lui-même consacrées
  rationale: Le pronom renvoie aux biens consacrés appartenant au sujet. La formulation évite la répétition pesante tout en gardant la distinction entre les consécrations du père et les siennes.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: de l’argent, de l’or et des objets
  rationale: « Argent » et « or » rendent directement les métaux; כֵּלִים est volontairement général et peut désigner des objets, ustensiles ou récipients. « Objets » préserve cette étendue sémantique.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde clairement les deux provenances des biens consacrés et l’énumération finale de leur nature.
