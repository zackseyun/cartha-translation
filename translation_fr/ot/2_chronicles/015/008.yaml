id: 2CH.15.8
reference: 2 Chronicles 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: fr
  text: Quand Asa entendit ces paroles et la prophétie d’Oded le prophète[a], il prit courage, fit disparaître les objets abominables de tout le territoire de Juda et de Benjamin ainsi que des villes qu’il avait conquises dans la région montagneuse d’Éphraïm, et restaura l’autel de Yahweh qui se trouvait devant le vestibule de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici « la prophétie d’Oded le prophète ». Certains rapprochent cette formulation d’Azaria, fils d’Oded, mentionné dans le contexte.
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ אָסָא
  choice: Quand Asa entendit
  rationale: La construction avec infinitif introduit une proposition temporelle; cette formulation française est naturelle et conserve la succession du récit.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans le contexte immédiat d’un discours prophétique entendu par Asa, « paroles » convient mieux que le plus général « choses ».
- source_word: וְהַנְּבוּאָה עֹדֵד הַנָּבִיא
  choice: et la prophétie d’Oded le prophète
  rationale: La formulation suit le texte massorétique fourni sans l’harmoniser avec la mention d’Azaria, fils d’Oded, dans le contexte.
- source_word: הִתְחַזַּק
  choice: il prit courage
  rationale: 'Cette tournure idiomatique rend la valeur réflexive du hitpael: Asa s’affermit et agit avec résolution.'
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: fit disparaître les objets abominables
  rationale: Le verbe exprime ici leur élimination, et שִׁקּוּצִים désigne probablement des objets cultuels idolâtres; « objets » explicite sobrement le référent sans le définir davantage.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: de tout le territoire de Juda et de Benjamin
  rationale: Dans ce contexte géopolitique, « territoire » exprime clairement le sens spatial de אֶרֶץ.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: ainsi que des villes qu’il avait conquises dans la région montagneuse d’Éphraïm
  rationale: « Conquises » rend לכד, tandis que « dans la région montagneuse » donne en français naturel la localisation exprimée par la construction hébraïque.
- source_word: וַיְחַדֵּשׁ
  choice: restaura
  rationale: Le piel de חדשׁ signifie renouveler ou remettre en état; pour un autel déjà existant, « restaura » est précis et idiomatique.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahweh
  rationale: Le construit est rendu directement et le tétragramme par le nom personnel « Yahweh ».
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: qui se trouvait devant le vestibule de Yahweh
  rationale: אוּלָם désigne le vestibule ou portique du temple; « devant » conserve exactement la relation spatiale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme; « Yahweh » préserve le nom divin plutôt que de lui substituer un titre.
- issue: Tension textuelle autour d’Oded le prophète
  choice: Oded le prophète dans le texte principal
  alternative: Azaria, fils d’Oded le prophète, par harmonisation avec le contexte
  rationale: Le texte hébreu fourni nomme Oded. La traduction respecte cette leçon et signale en note la difficulté contextuelle au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit le déroulement hébreu tout en évitant les calques. « Vestibule » conserve le vocabulaire architectural du temple; « objets abominables » indique le caractère concret et cultuel probable des שִׁקּוּצִים.
