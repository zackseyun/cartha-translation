id: 2CH.15.6
reference: 2 Chronicles 15:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: fr
  text: Une nation était écrasée par une autre, et une ville par une autre, car Dieu les plongeait dans le désarroi par toutes sortes de détresses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les jetait dans la confusion par toutes sortes d’épreuves » ou « de malheurs ».'
    reason: Le verbe המם peut évoquer plus précisément la confusion ou la panique, et צָרָה couvre les notions de détresse, d’épreuve et de malheur.
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: était écrasée
  rationale: Le pual de כתת exprime le fait d’être brisé ou écrasé. L’imparfait français présente naturellement la situation répétée décrite dans ce contexte.
- source_word: גוֹי בְּגוֹי
  choice: une nation… par une autre
  rationale: La préposition ב marque ici l’affrontement et l’agent de la destruction. Cette formulation française explicite sobrement la relation hostile tout en conservant la structure distributive.
- source_word: וְעִיר בְּעִיר
  choice: et une ville par une autre
  rationale: Cette expression parallèle reprend avec concision le même schéma de conflits destructeurs entre collectivités.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de la dévastation précédente.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne ici le Dieu unique et commande un verbe au singulier.
- source_word: הֲמָמָם
  choice: les plongeait dans le désarroi
  rationale: Le verbe המם évoque le trouble profond, la confusion ou la panique. « Plongeait dans le désarroi » en restitue la force dans un français actuel, et « les » traduit le suffixe objet.
- source_word: בְּכָל צָרָה
  choice: par toutes sortes de détresses
  rationale: La préposition peut avoir une valeur instrumentale, tandis que כָּל donne une portée globale. Cette expression est idiomatique en français et conserve l’idée de détresses multiples.
theological_decisions:
- issue: Rôle de Dieu dans les calamités
  choice: « car Dieu les plongeait dans le désarroi »
  alternative: « car Dieu permettait qu’ils connaissent le désarroi »
  rationale: L’hébreu présente Dieu comme le sujet direct d’un verbe actif. La traduction maintient cette attribution explicite sans la réduire à une simple permission ni ajouter d’explication théologique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « une… par une autre » conserve le parallélisme hébreu sans produire le calque peu naturel « nation par nation ». L’imparfait rend l’état de conflit généralisé décrit dans le passage.
