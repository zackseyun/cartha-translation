source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: fr
  text: Asa destitua même Maaka, la mère du roi Asa[a], de son rang de reine mère, parce qu’elle avait fabriqué pour Ashéra[b] un objet répugnant[c]. Asa abattit cet objet, le broya et le brûla dans la vallée du Cédron[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mère ». Dans les généalogies, le terme hébreu peut aussi désigner une aïeule.
    reason: textual_or_genealogical_ambiguity
  - marker: b
    text: « Ashéra » peut désigner la déesse ou le symbole cultuel qui lui était associé.
    reason: cultural_note
  - marker: c
    text: Ou « un objet effrayant », « une chose abominable ». Le terme hébreu rare évoque un objet cultuel inspirant l’horreur ou la répulsion.
    reason: lexical_alternative
  - marker: d
    text: Ou « dans l’oued du Cédron », voire « dans le torrent du Cédron ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: même
  rationale: Marque l’ajout avec emphase et souligne que la réforme d’Asa s’étend jusqu’à un membre éminent de sa propre famille.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Translittération française usuelle du nom hébreu.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: la mère du roi Asa
  rationale: Rend directement la chaîne construite hébraïque, tout en signalant en note que le terme de parenté peut avoir un sens plus large.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: destitua … de son rang de reine mère
  rationale: Le verbe exprime le retrait, et גְּבִירָה désigne ici le statut officiel de la grande dame de la cour, normalement la reine mère. « Destitua » explicite naturellement la perte de cette dignité sans ajouter de procédure particulière.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: parce qu’elle avait fabriqué pour Ashéra
  rationale: La proposition indique le motif de la destitution. « Pour Ashéra » conserve le lien cultuel sans imposer que le mot désigne ici exclusivement la déesse ou son symbole.
- source_word: מִפְלָצֶת
  choice: un objet répugnant
  rationale: Ce nom rare évoque quelque chose d’horrible, d’effrayant ou de repoussant. « Objet » est précisé par le contexte matériel, puisque celui-ci est ensuite abattu, broyé et brûlé.
- source_word: וַיִּכְרֹת
  choice: abattit
  rationale: Le verbe signifie couper ou abattre et convient à un objet cultuel susceptible d’être mis à bas.
- source_word: וַיָּדֶק
  choice: le réduisit en morceaux
  rationale: Le verbe décrit la réduction en petits fragments ou en poussière. Cette formulation française reste naturelle sans préciser indûment le degré de pulvérisation.
- source_word: וַיִּשְׂרֹף
  choice: le brûla
  rationale: Rend directement l’action de brûler l’objet.
- source_word: בְּנַחַל קִדְרוֹן
  choice: dans le ravin du Cédron
  rationale: נַחַל peut désigner un ravin, un oued ou le cours d’eau saisonnier qui s’y trouve. « Ravin du Cédron » convient au relief et reste clair en français moderne.
theological_decisions:
- issue: Sens de אֲשֵׁרָה
  choice: Ashéra, avec une note conservant l’ambiguïté entre la divinité et son symbole cultuel
  alternative: poteau sacré d’Ashéra ; bosquet sacré
  rationale: Le contexte mentionne un objet fabriqué, mais le terme hébreu peut renvoyer à la déesse ou à l’objet cultuel qui lui est associé. Garder le nom propre évite de trancher plus précisément que le texte.
- issue: Titre royal גְּבִירָה
  choice: reine mère
  alternative: grande dame ; maîtresse
  rationale: Dans le contexte monarchique judéen, le terme désigne le rang institutionnel de la principale femme de la cour, habituellement la mère ou l’aïeule du roi. « Reine mère » communique clairement cette fonction.
- issue: Lien familial exprimé par אֵם
  choice: mère, avec une note sur l’extension possible du terme
  alternative: aïeule
  rationale: Le texte hébreu dit littéralement « mère ». La traduction conserve cette formulation au lieu d’harmoniser silencieusement les données généalogiques, tout en indiquant que le mot peut parfois désigner une ancêtre féminine.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation privilégie une syntaxe fluide tout en maintenant l’emphase de וְגַם, le titre royal et les ambiguïtés réelles concernant Ashéra, l’objet cultuel et le terme géographique.
