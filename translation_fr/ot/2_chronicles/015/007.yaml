id: 2CH.15.7
reference: 2 Chronicles 15:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: fr
  text: Mais vous, soyez forts et ne laissez pas vos mains faiblir[a], car il y a une récompense pour votre travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne laissez pas vos mains se relâcher ». L’expression hébraïque évoque la perte de force, de détermination ou de courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mais vous
  rationale: La conjonction suivie du pronom indépendant marque ici une insistance contrastive. « Mais vous » exprime naturellement cette mise en relief dans le contexte de l’exhortation.
- source_word: חִזְקוּ
  choice: soyez forts
  rationale: L’impératif pluriel de חזק appelle à la force et à la fermeté. « Soyez forts » en conserve la forme directe sans préciser indûment s’il s’agit surtout de force ou de courage.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: et ne laissez pas vos mains faiblir
  rationale: Littéralement, les « mains » ne doivent pas devenir faibles ou relâchées. La formulation française conserve l’image hébraïque tout en rendant clairement l’exhortation à ne pas perdre sa force ou sa détermination.
- source_word: כִּי יֵשׁ
  choice: car il y a
  rationale: כִּי introduit le motif de l’exhortation, tandis que יֵשׁ affirme l’existence de la récompense sans employer explicitement un temps futur.
- source_word: שָׂכָר
  choice: une récompense
  rationale: Le nom peut désigner un salaire, une rétribution ou une récompense. « Récompense » convient au contexte exhortatif sans réduire le propos à un paiement contractuel.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: pour votre travail
  rationale: פְעֻלָּה désigne le travail, l’action ou l’œuvre accomplie. « Votre travail » est naturel en français et garde le caractère concret de l’activité concernée.
theological_decisions:
- issue: Nature de la rétribution promise
  choice: car il y a une récompense pour votre travail
  alternative: car votre travail sera récompensé
  rationale: Le texte motive la fidélité par l’assurance d’une rétribution, sans élaborer une doctrine du mérite. La tournure existentielle suit יֵשׁ et évite d’ajouter des précisions sur le moment ou la nature de cette récompense.
translation_notes:
  register: Français international moderne, direct et digne. L’image concrète des mains est conservée parce qu’elle reste compréhensible, tandis que la note en explicite la portée idiomatique.
