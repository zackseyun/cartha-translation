    rationale: מן הַשָּׁלָל signifie « du/parmi le butin ». En français, l’ajout de « prélevés » évite une lecture spatiale ou instrumentale de « sur ».
  - severity: low
    issue: La note sur le petit bétail est redondante avec le texte principal.
    rationale: Puisque « petit bétail » rend déjà l’étendue collective de צאן, une note expliquant que le terme comprend moutons et chèvres n’est pas nécessaire.
  revised_text: Ce jour-là, ils sacrifièrent à Yahweh sept cents bovins et sept mille têtes de petit bétail, prélevés sur le butin qu’ils avaient rapporté.
