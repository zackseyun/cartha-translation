  text: וַ/יִּזְבְּח֤וּ לַ/יהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִן הַ/שָּׁלָ֖ל הֵבִ֑יאוּ בָּקָר֙ שְׁבַ֣ע מֵא֔וֹת וְ/צֹ֖אן שִׁבְעַ֥ת אֲלָפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: fr
  text: Ce jour-là, ils sacrifièrent à Yahweh sept cents bovins et sept mille têtes de petit bétail, prélevés sur le butin qu’ils avaient rapporté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: ils sacrifièrent
  rationale: Dans ce contexte cultuel, זבח désigne l’action d’offrir des animaux en sacrifice. Cette formulation est concise et naturelle en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire du sacrifice, et le nom divin יהוה est rendu par « Yahweh ».
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Équivalent temporel idiomatique en français moderne.
- source_word: מִן הַשָּׁלָל
  choice: sur le butin
  rationale: שָׁלָל désigne les biens pris à la guerre. Avec « sacrifier », le français emploie naturellement « sur » pour indiquer que les victimes sont prélevées sur cet ensemble.
- source_word: הֵבִיאוּ
  choice: qu’ils avaient rapporté
  rationale: Le plus-que-parfait exprime clairement l’antériorité de l’arrivée du butin par rapport au sacrifice; « rapporté » convient à un butin ramené d’une expédition.
- source_word: בָּקָר
  choice: bovins
  rationale: בָּקָר est un collectif désignant le gros bétail bovin; « bovins » évite de limiter le sens aux bœufs mâles.
- source_word: וְצֹאן
  choice: et sept mille bêtes du petit bétail
  rationale: צֹאן est un collectif qui peut comprendre les moutons et les chèvres. « Petit bétail » conserve cette étendue sémantique sans la réduire aux seuls moutons.
- source_word: שְׁבַע מֵאוֹת / שִׁבְעַת אֲלָפִים
  choice: sept cents / sept mille
  rationale: Rendu direct des nombres cardinaux hébreux.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La phrase suit l’ordre narratif de l’hébreu tout en employant une syntaxe française naturelle. « Butin », « bovins » et « petit bétail » maintiennent la précision du vocabulaire sans archaïsme inutile.
