  rationale: La révision explicite que les animaux sacrifiés étaient prélevés sur le butin, tout en conservant le plus-que-parfait de הֵבִיאוּ et la portée collective de צאן. La note est supprimée parce que cette portée est déjà conservée dans « petit bétail ».
