source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: fr
  text: 'La part du roi[a], prise sur ses propres biens, était destinée aux offrandes brûlées : les offrandes brûlées du matin et du soir, ainsi que les offrandes brûlées pour les sabbats, les nouvelles lunes[b] et les fêtes fixées[c], comme il est écrit dans la Loi[d] de Yahweh[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’allocation du roi » ou « la part assignée au roi ».
    reason: lexical_alternative
  - marker: b
    text: Les « nouvelles lunes » étaient les célébrations mensuelles marquant le début de chaque mois dans le calendrier cultuel d’Israël.
    reason: cultural_note
  - marker: c
    text: Ou « temps fixés » ou « fêtes établies ».
    reason: lexical_alternative
  - marker: d
    text: 'Ou « l’instruction » ; autre traduction possible : « la Torah ».'
    reason: lexical_alternative
  - marker: e
    text: « Yahweh » transcrit le nom divin יהוה, traditionnellement rendu par « le Seigneur ».
    reason: translation_note
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: La part du roi
  rationale: מְנָה désigne une part assignée ou une allocation. « La part du roi » reste proche de l’hébreu et s’intègre naturellement à la phrase.
- source_word: מִן רְכוּשׁוֹ
  choice: prélevée sur ses propres biens
  rationale: רְכוּשׁ désigne les biens, les possessions ou les richesses. Cette formulation précise naturellement que le financement provenait des biens personnels du roi.
- source_word: לָעֹלוֹת
  choice: destinée aux holocaustes
  rationale: עֹלָה est le terme cultuel usuel pour l’offrande entièrement brûlée. « Holocaustes » est le terme biblique français établi et le contexte exige ici le pluriel.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: les holocaustes du matin et du soir
  rationale: La formulation conserve la répétition explicative de עֹלוֹת et rend directement les compléments « du matin et du soir ».
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: ainsi que les holocaustes des sabbats, des nouvelles lunes et des fêtes fixées
  rationale: Dans ce contexte cultuel, חֳדָשִׁים renvoie aux célébrations mensuelles de la nouvelle lune, tandis que מוֹעֲדִים désigne les temps ou fêtes établis du calendrier sacré.
- source_word: כַּכָּתוּב
  choice: comme il est écrit
  rationale: Cette formule française naturelle conserve la référence à une prescription écrite.
- source_word: בְּתוֹרַת יְהוָה
  choice: dans la loi de Yahweh
  rationale: Dans ce contexte de prescriptions cultuelles écrites, תּוֹרָה peut être rendu par « loi », tout en signalant en note les possibilités « instruction » et « Torah ». Le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » transcrit le nom divin au lieu de le remplacer par un titre.
- issue: Portée de תּוֹרָה
  choice: loi
  alternative: instruction ; Torah
  rationale: La référence à des prescriptions cultuelles écrites favorise « loi », sans effacer la portée lexicale plus large du mot hébreu, conservée en note.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de « holocaustes » conserve la structure explicative de l’hébreu sans la tournure française maladroite « pour les holocaustes : pour les holocaustes ». Le vocabulaire cultuel demeure précis, avec de brèves notes pour les réalités calendaires et les principales ambiguïtés lexicales.'
