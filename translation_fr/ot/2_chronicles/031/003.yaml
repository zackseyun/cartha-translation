  terminology: « Yahweh » respecte la décision de rendre le tétragramme. « Loi » convient ici à תּוֹרָה dans son contexte prescriptif; les alternatives sont conservées en note. « Fêtes fixées » conserve la notion de מועדים sans imposer une interprétation plus étroite.
