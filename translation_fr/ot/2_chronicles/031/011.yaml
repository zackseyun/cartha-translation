  text: וַ/יֹּ֣אמֶר יְחִזְקִיָּ֗הוּ לְ/הָכִ֧ין לְשָׁכ֛וֹת בְּ/בֵ֥ית יְהוָ֖ה וַ/יָּכִֽינוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: fr
  text: Alors Ézéchias ordonna de préparer des pièces[a] dans la maison de Yahweh[b], et ils les préparèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chambres ». Le terme désigne des pièces ou des locaux du complexe du Temple ; le contexte indique qu’ils servaient au stockage.
    reason: lexical_alternative
  - marker: b
    text: Le nom divin יהוה est transcrit ici « Yahweh » ; il est traditionnellement rendu par « le SEIGNEUR ».
    reason: textual-cultural_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ordonna
  rationale: Le verbe signifie littéralement « dit », mais l’infinitif qui suit exprime ici le contenu d’une directive royale. « Ordonna » en restitue naturellement la valeur contextuelle.
- source_word: יְחִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לְהָכִין
  choice: de préparer
  rationale: Le hiphil de כון signifie ici rendre prêt ou aménager en vue d’un usage.
- source_word: לְשָׁכוֹת
  choice: des salles
  rationale: Le nom désigne des pièces du complexe du Temple. « Salles » reste architecturalement neutre; leur fonction de stockage ressort du contexte, sans être exprimée directement par le mot.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Cette traduction conserve l’expression hébraïque « maison de Yahweh » plutôt que de l’expliciter par « Temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération moderne du nom divin, qui préserve son caractère de nom propre.
- source_word: וַיָּכִינוּ
  choice: et on les prépara
  rationale: Le verbe est au pluriel sans sujet exprimé; le français impersonnel « on » évite d’ajouter un référent absent du texte. « Les » reprend naturellement les salles.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Sujet implicite de וַיָּכִינוּ
  choice: on les prépara
  alternative: ils les préparèrent
  rationale: L’hébreu indique un sujet pluriel non nommé. Le tour français impersonnel préserve cette indétermination plutôt que d’identifier silencieusement les exécutants.
translation_notes:
  register: Français moderne, digne et accessible. « Maison » maintient l’image hébraïque, tandis que « salles » évite le caractère vieilli de « chambres » dans ce contexte architectural.
