  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: fr
  text: Outre l’inscription généalogique des hommes âgés de trois ans et plus[a], pour tous ceux qui entraient dans la maison de Yahweh, selon les besoins de chaque jour[b], pour leur service dans leurs fonctions assignées[c], selon leurs divisions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « outre ceux qui étaient inscrits d’après leur généalogie parmi les hommes âgés de trois ans et plus » .'
    reason: La forme nominale hébraïque peut être rendue soit par « l’inscription généalogique », soit par une proposition relative explicitant les personnes inscrites.
  - marker: b
    text: 'L’hébreu dit littéralement : « pour l’affaire d’un jour en son jour », c’est-à-dire selon ce qui était requis chaque jour.'
    reason: La note conserve la forme de l’idiome hébreu derrière sa traduction française naturelle.
  - marker: c
    text: 'Ou : « dans leurs gardes », « dans leurs fonctions » ou « selon leurs roulements de service » .'
    reason: מִשְׁמְרוֹת peut désigner des gardes, des fonctions assignées ou des tours de service.
lexical_decisions:
- source_word: מִלְּבַד
  choice: sans compter
  rationale: Cette expression conserve le sens séparatif tout en introduisant naturellement en français une catégorie distincte ou supplémentaire.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: ceux qui étaient inscrits dans les registres généalogiques parmi les hommes
  rationale: Le hitpael de יחס désigne l’enregistrement selon la généalogie; la formulation garde aussi la référence explicite aux personnes de sexe masculin.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: âgés de trois ans et plus
  rationale: Formulation française courante et précise pour le seuil d’âge indiqué par l’hébreu.
- source_word: לְכָל הַבָּא
  choice: tous ceux qui entraient
  rationale: Le participe hébreu a une valeur collective et générale; l’imparfait convient au cadre descriptif du passage.
- source_word: לְבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » préserve l’expression hébraïque sans expliciter « temple », tandis que le nom divin est translittéré.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: selon les besoins de chaque jour
  rationale: Rend lisiblement l’idiome administratif relatif à ce que chaque journée exige, sans en durcir le sens.
- source_word: לַעֲבוֹדָתָם
  choice: pour accomplir leur service
  rationale: Dans ce contexte cultuel, עֲבוֹדָה désigne le service assigné; « service » reste assez large et n’importe pas de terminologie ecclésiastique ultérieure.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: dans leurs tours de garde
  rationale: מִשְׁמֶרֶת peut désigner une garde, une fonction assignée ou un roulement de service; cette traduction maintient l’idée d’organisation par tours.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: suivant leurs divisions
  rationale: Le terme renvoie aux groupes organisés de prêtres ou de lévites; « divisions » demeure clair et formel.
theological_decisions:
- issue: Langage sexué concernant les personnes recensées
  choice: parmi les hommes
  alternative: parmi les personnes
  rationale: Le substantif hébreu זְכָרִים désigne explicitement les personnes de sexe masculin; le neutraliser effacerait une donnée du texte.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération conserve ici le nom propre divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Très jeune seuil d’âge dans le contexte du service du temple
  choice: conserver « trois ans et plus » sans harmonisation explicative
  alternative: comprendre le seuil comme visant seulement les familles ou les bénéficiaires
  rationale: Le texte associe un seuil de trois ans au recensement, puis mentionne ceux qui entrent dans la maison de Yahweh. La traduction préserve cette tension syntaxique et contextuelle au lieu d’imposer une solution interprétative.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure administrative du verset et son ambiguïté concernant le lien entre le recensement, l’âge minimal et l’entrée dans la maison de Yahweh.
