  - severity: low
    issue: « Tours de garde » est trop spécifique dans le texte principal
    rationale: מִשְׁמָרוֹת désigne des responsabilités, fonctions ou rotations assignées. « Tours de garde » ne couvre pas naturellement l’ensemble du service cultuel organisé; « fonctions assignées » conserve une formulation générale.
  - severity: low
