  verdict: revise
  source_fidelity: Le sens administratif est globalement bien rendu, ainsi que le seuil d’âge, l’entrée dans la maison de Yahweh, le service et les divisions. Toutefois, « sans compter ceux qui étaient inscrits ... parmi les hommes ..., tous ceux qui entraient » crée en français une construction syntaxiquement défectueuse et transforme de façon peu justifiée le nom abstrait hébreu « leur enregistrement généalogique » en un groupe personnel distinct.
  naturalness: Le registre est approprié, mais la succession de deux groupes introduits sans articulation (« ceux qui... , tous ceux qui... ») nuit à la lisibilité. « Dans leurs tours de garde » restreint aussi indûment le sens, qui peut désigner les fonctions ou services assignés, et non seulement une garde.
  terminology: « Yahweh », « maison », « service » et « divisions » conviennent. « Hommes » maintient à juste titre la référence masculine explicite. « Fonctions assignées » rend mieux la portée de מִשְׁמְרוֹתָם tout en laissant l’alternative des roulements de service en note.
