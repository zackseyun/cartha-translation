source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְחִזְקִיָּ֣הוּ וְ/הַ/שָּׂרִ֔ים וַ/יִּרְא֖וּ אֶת הָ/עֲרֵמ֑וֹת וַֽ/יְבָרֲכוּ֙ אֶת יְהוָ֔ה וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: fr
  text: Ézéchias et les responsables vinrent et virent les tas[a]. Alors ils bénirent Yahweh et son peuple, Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les amas ». Il s’agit vraisemblablement des produits et offrandes apportés en abondance.
    reason: lexical_alternative
  - marker: b
    text: Le mot « son » renvoie très probablement à Yahweh. Il pourrait toutefois renvoyer à Ézéchias, Israël étant alors appelé son peuple au sens du peuple placé sous son autorité.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le verbe בוא, dans cette suite narrative, se rend naturellement par un passé simple. Avec l’infinitif « voir », la formulation française exprime idiomatiquement leur venue sur les lieux sans ajouter de contenu.
- source_word: יְחִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: וְהַשָּׂרִים
  choice: les responsables
  rationale: שׂרים désigne ici les dirigeants ou hauts responsables du royaume. « Responsables » est actuel, clair et adapté au cadre administratif.
- source_word: וַיִּרְאוּ
  choice: voir
  rationale: ראה exprime directement la perception visuelle. La construction « vinrent voir » est naturelle en français et conserve la coordination narrative sans lourdeur.
- source_word: הָעֲרֵמוֹת
  choice: les tas
  rationale: עֲרֵמוֹת désigne des amas de produits accumulés. « Tas » garde l’image concrète et convient au contexte des contributions rassemblées.
- source_word: וַיְבָרֲכוּ
  choice: ils bénirent
  rationale: ברך avec Dieu pour complément signifie le bénir, c’est-à-dire proclamer sa grandeur ou le louer. « Bénirent » préserve le terme biblique et permet aussi son emploi inhabituel mais intelligible envers le peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: son peuple, Israël
  rationale: Le suffixe singulier signifie « son peuple ». Le référent le plus probable est Yahweh, tandis que l’apposition « Israël » identifie ce peuple. La formulation française laisse toutefois subsister la possibilité grammaticale d’un renvoi à Ézéchias, signalée en note.
theological_decisions:
- issue: Référent du suffixe possessif dans עַמּוֹ (« son peuple »)
  choice: 'Le texte principal rattache « son » à Yahweh : « son peuple, Israël ».'
  alternative: 'Le suffixe peut grammaticalement renvoyer à Ézéchias : « son peuple, Israël » au sens du peuple placé sous son autorité royale.'
  rationale: La proximité de Yahweh et l’expression biblique courante d’Israël comme peuple de Yahweh favorisent le premier sens. Comme le sujet masculin singulier Ézéchias demeure un antécédent grammatical possible, la note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Responsables » évite l’archaïsme de « princes ». La ponctuation autour d’« Israël » rend explicite l’apposition sans effacer l’ambiguïté du possessif, conservée en note.
