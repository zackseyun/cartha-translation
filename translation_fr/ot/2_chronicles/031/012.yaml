  naturalness: « Les choses saintes » est compréhensible mais peu naturel en français moderne dans ce contexte de biens déposés. « Les biens consacrés » est plus fluide et conserve le sens concret. La construction « à leur tête se trouvait …, avec … comme second » est claire et naturelle.
