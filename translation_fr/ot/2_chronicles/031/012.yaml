base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: fr
  text: Ils apportèrent fidèlement la contribution, la dîme et les biens consacrés[a]. À leur tête se trouvait Konania, le Lévite, avec son frère Shiméi comme second[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses saintes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme son adjoint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Ils apportèrent
  rationale: Le hiphil de בוא signifie ici « apporter » ou « faire entrer ». Le contexte des réserves du Temple implique la remise des biens sans qu’il soit nécessaire d’ajouter explicitement « dans les entrepôts ».
- source_word: הַתְּרוּמָה
  choice: la contribution
  rationale: תְּרוּמָה désigne ce qui est prélevé et offert pour un usage sacré. « Contribution » est actuel et précis, sans introduire le terme rituel plus technique d’« offrande élevée ».
- source_word: הַמַּעֲשֵׂר
  choice: la dîme
  rationale: מַעֲשֵׂר est le terme habituel désignant le dixième remis à Dieu ; « dîme » en est l’équivalent français établi.
- source_word: הַקֳּדָשִׁים
  choice: les choses saintes
  rationale: Le pluriel de קֹדֶשׁ désigne ici des biens mis à part pour un usage sacré. La formulation conserve le caractère concret et large de l’hébreu.
- source_word: בֶּאֱמוּנָה
  choice: fidèlement
  rationale: Dans ce contexte administratif, אֱמוּנָה exprime la fidélité, la fiabilité ou la probité. L’adverbe rend naturellement la manière dont les biens furent apportés.
- source_word: נָגִיד
  choice: responsable en chef
  rationale: נָגִיד désigne une personne placée à la tête d’une charge. « Responsable en chef » exprime l’autorité administrative de Konania sans lui attribuer une fonction royale.
- source_word: כונניהו
  choice: Konania
  rationale: Forme française lisible du nom hébreu, conforme aux usages courants de translittération biblique.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: L’article hébreu est conservé et la désignation identifie Konania par son statut lévitique.
- source_word: אָחִיהוּ
  choice: son frère
  rationale: אָח désigne normalement un frère au sens propre ; rien dans le contexte n’impose le sens plus large de « parent ».
- source_word: מִשְׁנֶה
  choice: le second
  rationale: מִשְׁנֶה indique ici le titulaire du rang immédiatement inférieur, c’est-à-dire le second ou l’adjoint. « Le second » reste proche de la concision de l’hébreu.
