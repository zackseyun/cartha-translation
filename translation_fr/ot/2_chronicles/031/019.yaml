base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: fr
  text: Quant aux descendants d’Aaron, les prêtres, dans les terres de pâture autour de leurs villes, dans chaque ville, il y avait des hommes nommément désignés[a] pour attribuer des parts à tout homme parmi les prêtres et à toute personne inscrite dans les registres généalogiques parmi les lévites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « recensés nominativement ». L’hébreu indique que ces hommes étaient officiellement identifiés par leur nom.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire toute personne reconnue comme lévite d’après les registres généalogiques.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Quant aux descendants d’Aaron, les prêtres
  rationale: בני signifie littéralement « fils », mais désigne ici les descendants d’Aaron appartenant à la lignée sacerdotale. « Descendants » rend clairement la portée généalogique en français moderne.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: qui vivaient dans les terres de pâture autour de leurs villes
  rationale: מגרש désigne les terrains ouverts entourant les villes, notamment destinés au pâturage. L’ajout relationnel « qui vivaient » explicite naturellement en français la construction elliptique du verset dans son contexte distributif.
- source_word: בְּכָל עִיר וָעִיר
  choice: dans chaque ville
  rationale: La répétition distributive hébraïque « ville et ville » signifie chacune des villes concernées. « Dans chaque ville » en restitue la portée sans lourdeur.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: des hommes désignés par leur nom
  rationale: La formule indique une identification officielle et nominative, sans permettre de trancher absolument entre nomination et inscription sur une liste.
- source_word: לָתֵת מָנוֹת
  choice: pour attribuer des parts
  rationale: מנות désigne des parts de provisions distribuées. « Attribuer des parts » convient au cadre administratif du passage.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: à tout homme parmi les prêtres
  rationale: זכר désigne expressément une personne de sexe masculin. Dans ce contexte humain, « tout homme » est naturel et précis en français.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: et à toute personne inscrite dans les registres généalogiques parmi les lévites
  rationale: Le hitpael de יחס renvoie à l’enregistrement ou au recensement selon la généalogie. Cette formulation rend explicitement le caractère administratif de l’expression.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure administrative du texte tout en explicitant son ellipse pour éviter de faire des terres elles-mêmes le lieu d’action des responsables. « Lévites » prend une minuscule conformément à l’usage français courant pour les noms de membres d’un groupe.
