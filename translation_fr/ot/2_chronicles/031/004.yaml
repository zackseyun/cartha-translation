  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: fr
  text: Il ordonna aussi au peuple, c’est-à-dire aux habitants de Jérusalem, de donner aux prêtres et aux lévites la part qui leur revenait, afin qu’ils puissent se consacrer à la loi de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’ils s’affermissent dans la loi de Yahweh » ou « afin qu’ils restent fermement attachés à la loi de Yahweh ».'
    reason: Alternative lexicale pour le sens de חזק avec la préposition ב.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il ordonna aussi
  rationale: Le verbe signifie littéralement « il dit », mais l’infinitif qui suit exprime ici une directive royale. « Il ordonna » en rend naturellement la force en français; « aussi » marque la continuité narrative portée par le waw consécutif.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: au peuple, c’est-à-dire aux habitants de Jérusalem
  rationale: Le second groupe précise ici qui est visé par « le peuple ». Cette formulation conserve l’apposition tout en évitant de suggérer deux groupes distincts.
- source_word: לָתֵת מְנָת הַכֹּהֲנִים וְהַלְוִיִּם
  choice: de donner aux prêtres et aux lévites la part qui leur revenait
  rationale: מְנָה désigne une part attribuée. « La part qui leur revenait » exprime son caractère dû sans alourdir la phrase.
- source_word: לְמַעַן
  choice: afin que
  rationale: La conjonction introduit le but de la mesure ordonnée.
- source_word: יֶחֶזְקוּ
  choice: ils puissent se consacrer à
  rationale: חזק peut signifier être fort, s’affermir ou tenir fermement. Dans le contexte du soutien matériel des prêtres et des lévites, « se consacrer à » rend bien l’effet pratique recherché, tandis qu’une note préserve les autres lectures possibles.
- source_word: בְּתוֹרַת יְהוָה
  choice: à la loi de Yahweh
  rationale: תּוֹרָה désigne ici la loi ou l’instruction divine dans son cadre cultuel et covenantal. Avec « se consacrer », la préposition ב est rendue idiomatiquement par « à ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Sens de יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: afin qu’ils puissent se consacrer à la loi de Yahweh
  alternative: afin qu’ils s’affermissent dans la loi de Yahweh; afin qu’ils restent fermement attachés à la loi de Yahweh
  rationale: Le contexte favorise l’idée que le soutien matériel permet aux prêtres et aux lévites de s’appliquer durablement à leurs devoirs, mais la construction hébraïque conserve une nuance de force ou de ferme attachement. La note maintient cette ambiguïté réelle.
- issue: Rendu de יְהוָה
  choice: Yahweh
  alternative: l’Éternel; le Seigneur
  rationale: Le texte porte le nom divin YHWH. La translittération « Yahweh » le distingue des titres divins et suit directement la donnée hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. « Lévites » reste en minuscule conformément à l’usage français pour les noms de fonctions ou de groupes religieux; « c’est-à-dire » explicite sobrement l’apposition hébraïque.
