base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: fr
  text: Yehiel, Azazia, Nahath, Asaël, Yerimoth, Yozabad, Éliel, Yismakia, Mahath et Benaya étaient responsables sous l’autorité de Konania et de son frère Shimeï[a], par mandat[b] du roi Ézéchias et d’Azaria, chef de la maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de Konania et de son frère Shimeï ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur ordre du roi Ézéchias et d’Azaria » ou « sous la supervision du roi Ézéchias et d’Azaria ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: responsables
  rationale: Le terme désigne des personnes établies dans une fonction administrative. « Responsables » est naturel en français moderne et n’exagère ni leur rang ni le caractère sacerdotal de leur charge.
- source_word: מִיַּד
  choice: sous l’autorité de
  rationale: L’expression signifie littéralement « de/sous la main de » et indique ici une relation d’autorité ou de supervision. La formulation française rend clairement cette chaîne de responsabilité.
- source_word: אָחִיו
  choice: son frère
  rationale: Le syntagme désigne simplement Shimeï comme le frère de Konania.
- source_word: בְּמִפְקַד
  choice: sur mandat de
  rationale: Le nom peut évoquer un ordre, une désignation ou une mission de supervision. « Sur mandat de » conserve l’idée d’une autorisation officielle sans trancher trop étroitement entre ces nuances.
- source_word: נְגִיד
  choice: chef
  rationale: Dans ce cadre administratif, « chef » exprime une fonction dirigeante sans introduire le titre dynastique ou social que pourrait suggérer « prince ».
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction formellement proche de l’hébreu demeure claire en français et conserve la désignation biblique du temple.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: Yehiel, Azazia, Nahath, Asaël, Yerimoth, Yozabad, Éliel, Yismakia, Mahath, Benaya, Konania, Shimeï, Ézéchias, Azaria
  rationale: Les noms sont translittérés sous des formes françaises bibliques reconnaissables, avec des graphies qui restent proches de l’hébreu.
theological_decisions:
- issue: Portée des titres administratifs du temple
  choice: Employer des termes institutionnels ordinaires (« responsables », « chef »).
  alternative: Employer des titres plus élevés comme « princes », « gouverneurs » ou « chefs suprêmes ».
  rationale: Le verset décrit avant tout une organisation administrative et une chaîne d’autorité. Il ne faut pas lui faire affirmer une hiérarchie sacerdotale ou politique plus précise que celle qu’indique l’hébreu.
- issue: Sens de בְּמִפְקַד
  choice: Conserver l’idée ouverte d’un mandat officiel.
  alternative: Préciser exclusivement « sur ordre de », « nommés par » ou « sous la supervision de ».
  rationale: Le mot permet plusieurs nuances connexes — ordre, charge, mandat ou supervision — que le contexte ne départage pas entièrement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la liste nominale et la structure hiérarchique de l’hébreu, tout en évitant des titres archaïques ou excessivement techniques.
