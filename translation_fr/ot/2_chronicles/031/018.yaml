  rationale: La révision corrige uniquement une tournure française maladroite et précise le terme de parenté. Elle préserve la syntaxe dépendante du verset, le caractère généalogique de l’inscription, l’énumération explicite, ainsi que le sens de fiabilité cultuelle de אֱמוּנָה. La formulation finale ne tranche pas entre une consécration ponctuelle et le maintien d’un état de sainteté.
