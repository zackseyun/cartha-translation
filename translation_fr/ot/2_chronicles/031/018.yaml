base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: fr
  text: ainsi que pour l’inscription généalogique de tous leurs jeunes enfants[a], de leurs épouses, de leurs fils et de leurs filles, pour toute l’assemblée ; car, dans leur fidélité[b], ils se consacraient à la sainteté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tous leurs enfants inscrits dans les généalogies ». Le verbe hébreu évoque l’inscription dans des registres familiaux ou généalogiques.
    reason: lexical_alternative
  - marker: b
    text: Ici, la « fidélité » désigne probablement leur fiabilité et leur constance dans l’accomplissement de leurs devoirs sacrés, plutôt qu’une foi comprise avant tout comme conviction intérieure.
    reason: lexical_alternative
  - marker: c
    text: Ou « ils se consacraient dans la sainteté » ou « ils se maintenaient dans la sainteté ». L’hébreu emploie un verbe et un nom de la même famille pour insister sur la sainteté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: ainsi que pour l’inscription généalogique
  rationale: Le hitpael de יחס désigne dans les Chroniques l’inscription dans des registres de famille ou des listes généalogiques. « Inscription généalogique » explicite ce sens administratif tout en maintenant le lien syntaxique avec le verset précédent.
- source_word: בְּכָל טַפָּם
  choice: de tous leurs jeunes enfants
  rationale: טַף désigne les petits enfants. « Jeunes enfants » évite l’ambiguïté française de « petits-enfants », qui peut signifier les descendants de la deuxième génération.
- source_word: נְשֵׁיהֶם
  choice: leurs femmes
  rationale: Dans cette énumération familiale, le terme désigne les épouses ; « leurs femmes » est idiomatique en français international.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: La traduction conserve la distinction explicite entre descendants masculins et féminins.
- source_word: לְכָל קָהָל
  choice: pour toute l’assemblée
  rationale: La formulation conserve la préposition לְ et rend קָהָל par « assemblée », terme qui désigne ici l’ensemble de la communauté concernée.
- source_word: בֶאֱמוּנָתָם
  choice: dans leur fidélité
  rationale: Dans ce contexte cultuel et administratif, אֱמוּנָה évoque surtout la fidélité, la fiabilité ou la conscience avec laquelle les intéressés accomplissaient leurs devoirs, plutôt qu’une croyance intérieure.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: ils se consacraient comme saints
  rationale: Le verbe réfléchi exprime le fait de se consacrer ou de se tenir consacré, et le nom קֹדֶשׁ répète l’idée de sainteté avec insistance. La formulation française conserve les deux éléments sans réduire l’expression à la seule observance de prescriptions.
theological_decisions:
- issue: Sens de אֱמוּנָה dans un contexte cultuel et administratif
  choice: fidélité dans l’accomplissement des devoirs sacrés
  alternative: foi au sens intérieur ou dévotionnel
  rationale: Le contexte de la distribution aux prêtres et aux lévites favorise la fidélité ou la fiabilité pratique. Cette lecture évite d’introduire dans le passage une catégorie doctrinale plus tardive.
- issue: Portée de יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: ils se consacraient comme saints
  alternative: ils se maintenaient dans la sainteté / ils observaient fidèlement les règles relatives aux choses saintes
  rationale: L’hébreu associe un verbe de même racine à un nom exprimant la sainteté. La traduction retenue préserve cette insistance et la dimension réflexive, sans préciser au-delà du texte si elle désigne une consécration ponctuelle ou le maintien d’un état saint.
translation_notes:
  register: Français moderne, international et digne. Le vocabulaire administratif (« inscription généalogique ») reflète le contexte des registres, tandis que « jeunes enfants » évite une ambiguïté propre au français. La dernière proposition reste légèrement formelle afin de préserver la répétition hébraïque de l’idée de sainteté.
