review_pass:
  verdict: revise
  source_fidelity: Le sens administratif de l’infinitif « s’inscrire par généalogie » est bien rendu. L’énumération familiale est conservée sans la lisser, et « fidélité » convient à אֱמוּנָתָם dans ce contexte. La dernière expression doit toutefois être rendue plus naturellement tout en gardant l’insistance sur la racine de la sainteté.
  naturalness: « Ils se consacraient comme saints » n’est pas idiomatique en français et sonne comme une comparaison ou une attribution de statut. « Ils se consacraient à la sainteté » est plus naturel et maintient la construction réflexive ainsi que la répétition sémantique de קדש / קֹדֶשׁ. « Épouses » est plus précis et plus soutenu que « femmes » dans cette liste familiale.
  terminology: « Inscription généalogique », « assemblée », « fidélité » et « sainteté » sont appropriés. « Épouses » élimine l’ambiguïté possible de « femmes » (women) tout en restant d’un registre moderne et international.
  issues:
