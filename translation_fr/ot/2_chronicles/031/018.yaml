    issue: 'Formulation finale peu naturelle : « ils se consacraient comme saints ».'
    rationale: Le français « comme saints » suggère une comparaison ou une qualité qui leur serait attribuée, plutôt que l’acte réflexif de se consacrer. « À la sainteté » rend de façon idiomatique la portée de יִתְקַדְּשׁוּ קֹדֶשׁ et conserve l’écho lexical de la sainteté.
  - severity: low
