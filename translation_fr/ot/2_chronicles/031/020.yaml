source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ כָּ/זֹ֛את יְחִזְקִיָּ֖הוּ בְּ/כָל יְהוּדָ֑ה וַ/יַּ֨עַשׂ הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ וְ/הָ֣/אֱמֶ֔ת לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: fr
  text: Ézéchias fit ainsi dans tout Juda, et il fit ce qui est bon, droit et vrai[a] devant Yahweh, son Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidèle » ou « digne de confiance ». Le mot hébreu אֱמֶת peut désigner la vérité, la fiabilité ou la fidélité ; ici, il peut qualifier une conduite intègre et fidèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: agit ainsi
  rationale: Cette expression récapitule les réformes et les dispositions précédemment décrites. « Agit ainsi » en conserve la fonction récapitulative dans un français naturel.
- source_word: בְּכָל יְהוּדָה
  choice: dans tout Juda
  rationale: La préposition avec כָּל et le nom de lieu exprime une étendue englobant l’ensemble du territoire.
- source_word: הַטּוֹב
  choice: ce qui est bon
  rationale: L’adjectif défini est employé substantivement et désigne ce qui est moralement bon.
- source_word: הַיָּשָׁר
  choice: droit
  rationale: Dans ce contexte moral, יָשָׁר désigne ce qui est juste ou droit; « droit » s’intègre naturellement à la série.
- source_word: הָאֱמֶת
  choice: vrai
  rationale: Le choix « vrai » rend directement אֱמֶת tout en laissant la note signaler ses nuances possibles de fidélité, de fiabilité et d’intégrité.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime ici la présence et l’évaluation divines; « devant » préserve ces deux dimensions.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe masculin singulier renvoie à Ézéchias et exprime sa relation personnelle avec Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » conserve le nom personnel dans la traduction.
- issue: Portée morale de הָאֱמֶת
  choice: vrai
  alternative: fidèle
  rationale: « Vrai » reflète au plus près le terme hébreu et préserve la tension entre vérité et fidélité, dont les autres nuances sont indiquées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La première proposition récapitule naturellement le contexte antérieur; la seconde conserve la série morale ternaire et le nom divin.
