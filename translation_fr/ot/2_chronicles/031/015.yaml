  to: Sous sa responsabilité[a] se trouvaient Éden, Minyamin, Yéchoua, Shemaya, Amaria et Shekania, dans les villes des prêtres, pour donner fidèlement à leurs frères[b], selon les divisions[c], tant aux grands qu’aux petits.
