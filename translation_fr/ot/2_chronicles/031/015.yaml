base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: fr
  text: Sous sa responsabilité[a] se trouvaient Éden, Minyamin, Yéchoua, Shemaya, Amaria et Shekania, dans les villes des prêtres, pour donner fidèlement à leurs frères[b], selon les divisions[c], tant aux grands qu’aux petits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses côtés » ou « sous son autorité ». L’expression hébraïque peut indiquer l’assistance, la supervision ou l’autorité.
    reason: lexical_alternative
  - marker: b
    text: Ici, « leurs frères » désigne les autres membres de la communauté sacerdotale.
    reason: cultural_note
  - marker: c
    text: Ou « par divisions ». Il s’agit vraisemblablement de groupes organisés pour le service.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Sous son autorité
  rationale: Dans ce contexte administratif, l’expression idiomatique peut indiquer l’autorité, la supervision ou le fait d’agir aux côtés de quelqu’un. « Sous son autorité » exprime clairement le rapport avec le responsable nommé au verset précédent, tout en signalant l’ambiguïté en note.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Éden, Miniamin, Yéchoua, Shemaya, Amaria et Shekania
  rationale: Les noms propres sont translittérés sous des formes lisibles en français moderne, sans les traduire.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: Dans les villes des prêtres
  rationale: Rend directement la construction génitive hébraïque et situe la mission des hommes nommés.
- source_word: בֶּאֱמוּנָה
  choice: fidèlement
  rationale: Le nom désigne ici la fidélité ou la fiabilité avec laquelle la distribution est accomplie.
- source_word: לָתֵת
  choice: distribuaient les parts
  rationale: Le verbe signifie littéralement « donner », mais le contexte porte sur l’attribution organisée de portions. « Distribuaient les parts » explicite naturellement en français l’objet sous-entendu par le contexte.
- source_word: לַאֲחֵיהֶם
  choice: à leurs frères
  rationale: Conserve le terme de parenté du texte hébreu; dans le contexte, il désigne leurs confrères de la communauté sacerdotale.
- source_word: בְּמַחְלְקוֹת
  choice: selon leurs groupes de service
  rationale: מַחְלְקוֹת désigne ici les divisions ou classes organisées du personnel cultuel. « Groupes de service » rend la fonction institutionnelle plus clairement que le calque « divisions ».
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: aux grands comme aux petits
  rationale: Conserve l’expression polaire et son idée d’inclusion impartiale, sans trancher entre différences d’âge, de rang ou d’importance.
theological_decisions:
- issue: Portée de כַּגָּדוֹל כַּקָּטָן
  choice: aux grands comme aux petits
  alternative: aux plus âgés comme aux plus jeunes
  rationale: L’hébreu peut évoquer l’âge, le rang ou l’importance. La formulation retenue préserve cette amplitude au lieu de la réduire à l’âge.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été scindée en deux pour éviter une longue chaîne de compléments et préciser naturellement que les hommes nommés accomplissaient la distribution. Les termes « frères » et « grands comme petits » maintiennent les formulations du texte source et leurs tensions sémantiques.
