  naturalness: La phrase révisée demeure fluide en français international moderne. « Pour donner fidèlement » rend naturellement l’infinitif de but sans transformer l’action en proposition indépendante.
  terminology: « Sous sa responsabilité », « frères », « divisions » et « grands… petits » conservent respectivement l’ambiguïté administrative de l’idiome, le terme de parenté, le vocabulaire institutionnel et l’amplitude de l’expression polaire. La note sur les divisions explique le sens contextuel sans l’introduire dans le texte comme une paraphrase.
