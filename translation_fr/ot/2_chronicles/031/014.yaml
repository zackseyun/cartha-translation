source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: fr
  text: Koré, fils de Yimna, le lévite, gardien de porte à l’est, était chargé des offrandes volontaires destinées à Dieu, afin de distribuer[a] la contribution de Yahweh et les choses très saintes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donner »; dans ce contexte administratif, il s’agit de remettre aux bénéficiaires ce qui avait été consacré.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les offrandes très saintes ». L’expression désigne ce qui possède un degré particulier de sainteté, et non le sanctuaire intérieur appelé le « Saint des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: Koré, fils de Yimna
  rationale: Les noms propres sont translittérés selon des formes françaises simples et reconnaissables. La conjonction initiale n’est pas exprimée, car elle n’est pas nécessaire dans la syntaxe française de ce verset.
- source_word: הַלֵּוִי
  choice: le lévite
  rationale: L’article défini hébreu est conservé et la désignation cultuelle est rendue par le terme français courant.
- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: qui gardait la porte orientale
  rationale: שׁוֹעֵר désigne un gardien de porte, tandis que לַמִּזְרָחָה précise son poste à l’est. La formulation française réunit naturellement ces deux éléments sans modifier sa fonction.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: était chargé des offrandes volontaires destinées à Dieu
  rationale: Dans ce cadre administratif, עַל indique la responsabilité. נִדְבוֹת désigne des dons librement consentis; « destinées à Dieu » explicite en français la relation cultuelle sans laisser entendre que Dieu en serait la source.
- source_word: לָתֵת
  choice: afin de distribuer
  rationale: Le sens premier est « donner », mais le contexte de gestion des offrandes indique leur remise aux bénéficiaires. « Distribuer » exprime naturellement cette fonction, tandis qu’une note conserve le sens littéral.
- source_word: תְּרוּמַת יְהוָה
  choice: la contribution de Yahweh
  rationale: « Contribution » rend une part prélevée et mise à part. La construction avec le nom divin est maintenue de près, sans la réduire à une catégorie rituelle plus étroite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: et les choses très saintes
  rationale: La tournure hébraïque exprime ici le degré suprême de sainteté. « Choses » préserve la portée générale et évite de confondre l’expression avec le lieu appelé le Saint des saints.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le caractère de nom propre sans lui substituer un titre.
- issue: Référent de קָדְשֵׁי הַקֳּדָשִׁים
  choice: les choses très saintes
  alternative: les offrandes très saintes
  rationale: Le contexte peut viser des offrandes consacrées, mais le substantif « offrandes » n’est pas répété dans cette expression. La traduction principale conserve donc sa généralité, et la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation évite le vocabulaire rituel devenu opaque, tout en conservant le nom divin, la fonction lévitique et la portée générale de l’expression finale.
