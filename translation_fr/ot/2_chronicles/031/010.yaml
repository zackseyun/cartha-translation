base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: fr
  text: 'Azaria, le prêtre en chef de la maison de Tsadok, lui répondit : « Depuis qu’on a commencé à apporter la contribution[a] dans la maison de Yahweh, nous avons mangé et nous avons été rassasiés, et il en est resté en abondance. Car Yahweh a béni son peuple, et ce qui reste, c’est cette grande abondance. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’offrande » ; le terme hébreu désigne une contribution mise à part pour un usage sacré.
    reason: Alternative lexicale pertinente pour הַתְּרוּמָה.
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: le prêtre en chef
  rationale: Rend littéralement et naturellement l’idée du prêtre occupant la fonction dirigeante, sans employer le titre technique « grand prêtre », que l’hébreu n’utilise pas ici.
- source_word: לְבֵית צָדוֹק
  choice: de la maison de Tsadok
  rationale: Le lamed marque ici l’appartenance à la lignée ou maison sacerdotale de Tsadok.
- source_word: מֵהָחֵל
  choice: Depuis qu’on a commencé
  rationale: La construction avec מן indique le point de départ temporel de l’action; le sujet indéfini français correspond au sujet non exprimé de l’infinitif hébreu.
- source_word: הַתְּרוּמָה
  choice: la contribution
  rationale: Le terme désigne un prélèvement ou don mis à part pour un usage sacré; « contribution » est clair et adapté au contexte des denrées apportées.
- source_word: לָבִיא בֵית יְהוָה
  choice: apporter la contribution dans la maison de Yahweh
  rationale: בוא à l’infinitif avec le complément de lieu exprime ici l’entrée des dons dans l’enceinte du temple.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: nous avons mangé à satiété
  rationale: Cette formulation française naturelle conserve à la fois l’action de manger et l’idée d’être pleinement rassasié.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: il en est resté en grande quantité
  rationale: יתר exprime le surplus et עד לרב son ampleur; la tournure impersonnelle rend clairement le résultat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: a béni son peuple
  rationale: Le parfait énonce la bénédiction comme cause de l’abondance constatée.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: et ce qui reste, c’est toute cette abondance
  rationale: הנותר est substantivé, « ce qui reste »; dans le contexte des provisions, המון désigne une grande quantité plutôt qu’une foule.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Prêtre en chef » préserve la formulation hébraïque sans introduire le titre technique « grand prêtre ». La syntaxe directe du discours est maintenue, avec une légère explicitation idiomatique des formes verbales hébraïques.
