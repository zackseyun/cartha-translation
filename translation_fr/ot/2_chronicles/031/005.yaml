source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: fr
  text: Dès que la nouvelle se répandit[a], les fils d’Israël[b] apportèrent en abondance les prémices des céréales, du vin nouveau, de l’huile, du miel[c] et de tous les produits des champs ; ils apportèrent aussi en grande quantité la dîme de tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « nouvelle » est général ; il peut désigner l’ordre ou la nouvelle de cet ordre.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « les fils d’Israël » désigne ici collectivement les Israélites, c’est-à-dire le peuple d’Israël.
    reason: cultural_note
  - marker: c
    text: Selon le contexte, le mot traduit par « miel » peut aussi désigner un sirop sucré, par exemple du sirop de dattes.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: Dès que la parole se répandit
  rationale: La construction a un sens temporel, « quand/dès que », tandis que פרץ évoque ce qui se propage avec force. « La parole » conserve l’étendue sémantique de דָּבָר sans décider silencieusement s’il s’agit de l’ordre lui-même ou de la nouvelle qui le fait connaître.
- source_word: הִרְבּוּ
  choice: apportèrent en abondance
  rationale: Le hiphil de רבה exprime ici la grande quantité des contributions. Le verbe « apporter », explicite à la fin du verset, est naturellement sous-entendu dans cette première proposition.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction garde la forme de l’expression collective hébraïque; une note précise qu’elle désigne ici l’ensemble des Israélites.
- source_word: רֵאשִׁית
  choice: les prémices
  rationale: Dans le contexte des offrandes, le terme désigne la première part de la récolte consacrée.
- source_word: דָּגָן
  choice: blé
  rationale: Le terme désigne les céréales ou le grain en général. « Blé » est ici employé dans son sens collectif agricole traditionnel, naturel dans l’énumération française.
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: Le terme renvoie habituellement au produit récent de la vigne, d’où « vin nouveau » plutôt que le simple « vin ».
- source_word: יִצְהָר
  choice: huile
  rationale: Le mot désigne généralement l’huile fraîche, notamment l’huile d’olive; « huile » évite une précision non explicitée dans le texte.
- source_word: דְבַשׁ
  choice: miel
  rationale: Le mot peut désigner le miel d’abeilles ou un sirop sucré. Le terme traditionnel « miel » est conservé, avec l’ambiguïté signalée en note.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: et de tous les produits des champs
  rationale: תבואה désigne la production ou le rendement agricole. Le pluriel français « des champs » exprime naturellement la catégorie générale.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: la dîme de tout
  rationale: מַעֲשֵׂר est le terme technique pour la dîme, et הַכֹּל en indique l’étendue totale.
- source_word: לָ/רֹב
  choice: en grande quantité
  rationale: L’expression souligne l’abondance de la dîme apportée et évite une répétition stylistiquement lourde de « en abondance ».
theological_decisions:
- issue: Portée de הַדָּבָר
  choice: la parole
  alternative: l’ordre / la nouvelle
  rationale: Le contexte permet de comprendre soit l’ordre précédemment donné, soit sa diffusion parmi le peuple. Le texte principal garde un terme large et la note expose les lectures possibles.
- issue: Expression collective genrée בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: La forme hébraïque est maintenue sans lui donner un sens exclusivement masculin; la note explicite sa valeur collective.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tout en conservant les termes cultuels établis « prémices » et « dîme ». Les répétitions quantitatives de l’hébreu sont maintenues sous deux formulations françaises naturelles.
