  text: וְ/אֵ֨ת הִתְיַחֵ֤שׂ הַ/כֹּהֲנִים֙ לְ/בֵ֣ית אֲבוֹתֵי/הֶ֔ם וְ/הַ֨/לְוִיִּ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑עְלָ/ה בְּ/מִשְׁמְרוֹתֵי/הֶ֖ם בְּ/מַחְלְקוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: fr
  text: L’inscription généalogique des prêtres[a] se faisait selon leurs familles ancestrales[b], et celle des lévites à partir de vingt ans, selon leurs fonctions et leurs groupes de service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé et elliptique; on peut aussi comprendre : « les prêtres inscrits dans les registres généalogiques […] et les lévites » .'
    reason: lexical_alternative
  - marker: b
    text: Les « familles ancestrales » étaient les groupes de parenté selon lesquels l’inscription officielle et le service étaient organisés.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: l’inscription généalogique
  rationale: Le terme désigne l’enregistrement officiel fondé sur l’ascendance. La formulation nominale respecte la construction hébraïque elliptique tout en donnant une phrase française naturelle.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: selon leurs familles ancestrales
  rationale: L’expression désigne les unités familiales patrilinéaires qui servaient de cadre au recensement et à l’organisation du service. « Familles ancestrales » est plus immédiatement compréhensible en français moderne que le calque « maisons de leurs pères ».
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: à partir de vingt ans
  rationale: Cette tournure française exprime naturellement le seuil d’âge inclusif indiqué par la formule hébraïque « depuis l’âge de vingt ans et au-dessus ».
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: selon leurs fonctions
  rationale: Le nom peut désigner une charge, une responsabilité ou une affectation de service. Dans ce contexte, « fonctions » conserve cette portée plus large qu’un simple tour de garde.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: leurs groupes de service
  rationale: Le mot désigne ici les divisions organisées dans lesquelles les lévites accomplissaient leur service. Cette expression évite l’ambiguïté courante de « divisions » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase explicite seulement le lien syntaxique nécessaire (« se faisait », « celle »), sans transformer l’énoncé administratif en récit. Le parallélisme entre prêtres et lévites ainsi que l’ellipse de l’hébreu sont signalés en note.
