  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: fr
  text: Dans toute œuvre qu’il entreprit, dans le service de la maison de Dieu, dans la Loi[a] et dans le commandement, afin de rechercher[b] son Dieu, il agit de tout son cœur et réussit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’instruction » (hébreu : torah).'
    reason: lexical_alternative
  - marker: b
    text: Ou « consulter son Dieu ». Le verbe hébreu peut exprimer aussi bien la recherche de Dieu que le fait de le consulter.
    reason: lexical_alternative
  - marker: c
    text: Ou « prospéra ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: Dans toute œuvre qu’il entreprit
  rationale: מַעֲשֶׂה désigne une œuvre, une action ou une activité. « Œuvre » garde cette ampleur, tandis que « entreprit » rend naturellement l’idée de commencer une activité dans ce contexte.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: pour le service de la maison de Dieu
  rationale: עֲבוֹדָה peut désigner le travail ou le service cultuel. « Service » préserve ici la dimension du culte sans la limiter aux seuls rites sacerdotaux; « pour » exprime naturellement en français le domaine auquel l’œuvre était consacrée.
- source_word: וּבַתּוֹרָה
  choice: pour la loi
  rationale: תּוֹרָה peut signifier « loi » ou « instruction ». Dans le contexte des réformes d’Ézéchias, « la loi » convient au corpus normatif de l’alliance, tout en laissant l’autre nuance en note.
- source_word: וּבַמִּצְוָה
  choice: et pour le commandement
  rationale: Le singulier hébreu מִצְוָה est conservé. Il peut avoir une valeur collective, mais le singulier français reste compréhensible et proche de la forme source.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: afin de rechercher son Dieu
  rationale: דרשׁ appliqué à Dieu peut exprimer le fait de le rechercher ou de le consulter. « Rechercher » maintient le motif important des Chroniques d’une orientation active vers Dieu, sans exclure la nuance de consultation.
- source_word: בְּכָל לְבָבוֹ עָשָׂה
  choice: il agit de tout son cœur
  rationale: L’accentuation massorétique place une césure après « son Dieu » et favorise le rattachement de « de tout son cœur » à עָשָׂה. « Il agit de tout son cœur » respecte cette structure tout en restant idiomatique.
- source_word: וְהִצְלִיחַ
  choice: et réussit
  rationale: Le hiphil de צלח peut signifier réussir ou prospérer. En conclusion d’activités entreprises, « réussit » est direct et naturel; « prospéra » demeure une possibilité légitime signalée en note.
theological_decisions:
- issue: Portée de תּוֹרָה dans le contexte de la réforme
  choice: la loi
  alternative: l’instruction
  rationale: Le contexte concerne l’obéissance cultuelle et royale liée aux prescriptions reçues par Israël. « Loi » convient dans le texte principal, sans effacer le sens plus large d’« instruction », conservé en note.
- issue: Sens de la recherche de Dieu
  choice: rechercher son Dieu
  alternative: consulter son Dieu
  rationale: Dans les Chroniques, cette expression désigne fréquemment une orientation fidèle vers Dieu, mais le verbe peut aussi évoquer le fait de le consulter. Le choix principal préserve le motif théologique dominant, et la note maintient l’ambiguïté lexicale.
- issue: Rattachement de « de tout son cœur »
  choice: 'à l’action d’Ézéchias : « il agit de tout son cœur »'
  alternative: 'à la recherche de Dieu : « rechercher son Dieu de tout son cœur »'
  rationale: La césure massorétique après « son Dieu » appuie le rattachement au verbe « il agit ». L’autre lecture reste syntaxiquement et contextuellement concevable, mais n’est pas imposée au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « pour » clarifie les trois domaines coordonnés en hébreu. Le vocabulaire cultuel reste général afin de ne pas réduire le « service » à une fonction sacerdotale particulière.
