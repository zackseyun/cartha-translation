source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: fr
  text: 'Ézéchias établit les classes des prêtres et des lévites selon leurs classes[a], chacun selon son service : les prêtres comme les lévites, pour les holocaustes et les sacrifices de paix[b], afin d’assurer le service, de rendre grâce et de louer aux portes des camps de Yahweh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « groupes », pour les unités organisées de prêtres et de lévites qui assuraient le service à tour de rôle.
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifices de communion ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les camps de Yahweh »; certains comprennent ici, de manière plus interprétative, « les parvis de Yahweh ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: établit
  rationale: Dans ce contexte administratif, le verbe décrit la mise en place officielle des groupes dans leurs fonctions, et non le simple fait de les faire se tenir debout.
- source_word: מַחְלְקוֹת
  choice: classes
  rationale: Le terme désigne les groupes organisés de prêtres et de lévites affectés au service à tour de rôle. « Classes » est un terme français clair dans ce contexte cultuel; la répétition de l’hébreu est conservée.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: chacun selon son service
  rationale: Cette formulation restitue la valeur distributive du singulier hébreu sans alourdir le français; le contexte identifie déjà les personnes concernées.
- source_word: לְעֹלָה
  choice: pour les holocaustes
  rationale: « Holocaustes » est le terme français traditionnel et précis pour les offrandes entièrement brûlées; le pluriel exprime naturellement ici une catégorie de sacrifices récurrents.
- source_word: וְלִשְׁלָמִים
  choice: et les sacrifices de paix
  rationale: Cette traduction demeure proche du nom hébreu de la catégorie sacrificielle et évite de privilégier une interprétation particulière de sa portée.
- source_word: לְשָׁרֵת
  choice: afin d’accomplir le service
  rationale: Dans ce cadre cultuel, l’expression désigne l’exercice du service sacré. Cette formulation est naturelle en français et garde le lien lexical avec עֲבֹדָה.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: de rendre grâce et de louer
  rationale: L’association des deux verbes indique clairement la reconnaissance et la louange liturgiques.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: aux portes des camps de Yahweh
  rationale: « Camps » respecte le pluriel hébreu inhabituel; « aux portes » rend naturellement la localisation sans remplacer l’image du texte par celle des parvis.
theological_decisions:
- issue: Sens du nom sacrificiel שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: « Sacrifices de paix » représente plus directement la désignation hébraïque, tandis que « communion » explicite une fonction possible du sacrifice.
- issue: Image de מַחֲנוֹת יְהוָה dans un contexte lié au Temple
  choice: les camps de Yahweh
  alternative: les parvis de Yahweh
  rationale: Le texte emploie sans ambiguïté le pluriel « camps ». Le conserver préserve l’image et son caractère inhabituel au lieu de résoudre l’expression par une interprétation architecturale.
- issue: Expression distributive masculine אִישׁ
  choice: chacun selon son service
  alternative: chaque homme selon son service
  rationale: « Chacun » garde la distribution individuelle et le référent masculin fourni par les prêtres et les lévites, tout en étant plus naturel en français contemporain.
translation_notes:
  register: Français international contemporain, digne et lisible. La structure administrative et les répétitions significatives de l’hébreu sont maintenues, tandis que les infinitifs sont liés par « afin de » pour rendre clairement leur fonction. Le nom divin est translittéré « Yahweh » conformément à la couche de consultation fournie.
