  to: 'Ézéchias établit les classes des prêtres et des lévites selon leurs classes[a], chacun selon son service : les prêtres comme les lévites, pour les holocaustes et les sacrifices de paix[b], afin d’assurer le service, de rendre grâce et de louer aux portes des camps de Yahweh[c].'
