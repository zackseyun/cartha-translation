  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: fr
  text: Les gens d’Israël et de Juda qui habitaient dans les villes de Juda apportèrent, eux aussi, la dîme du gros et du petit bétail, ainsi que la dîme des choses saintes[a] consacrées à Yahweh, leur Dieu. Ils les déposèrent en tas, tas sur tas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des biens consacrés » ou « des dons sacrés ». Le terme hébreu désigne des choses mises à part comme saintes, sans en préciser ici la nature.
    reason: alternative lexicale
  - marker: b
    text: L’hébreu répète le mot « tas » pour souligner leur grand nombre.
    reason: explication de l’expression hébraïque
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Les gens d’Israël et de Juda
  rationale: בני a ici un sens collectif et ne désigne pas seulement les hommes. « Les gens d’Israël et de Juda » distingue naturellement les deux groupes sans imposer une terminologie politique plus précise que l’hébreu.
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: qui habitaient dans les villes de Juda
  rationale: Le participe de ישב exprime ici la résidence; cette formulation est claire et naturelle en français moderne.
- source_word: גַּם הֵם
  choice: eux aussi
  rationale: Cette expression souligne que ces habitants participèrent également à l’apport des dîmes.
- source_word: מַעְשַׂר בָּקָר וָצֹאן
  choice: la dîme du gros et du petit bétail
  rationale: בקר désigne le gros bétail et צאן le petit bétail, catégorie pouvant comprendre moutons et chèvres. Cette traduction conserve mieux l’étendue du second terme que « moutons » seul.
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: ainsi que la dîme des choses saintes
  rationale: קדשים désigne ici des biens mis à part comme saints. « Choses saintes » reste transparent et préserve l’imprécision de la catégorie exacte.
- source_word: הַמְקֻדָּשִׁים
  choice: consacrées
  rationale: Le participe passif de קדש indique que ces choses avaient été mises à part pour Dieu.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: à Yahweh, leur Dieu
  rationale: La préposition ל marque ici le destinataire de la consécration, et le nom divin יהוה est rendu directement par « Yahweh ».
- source_word: הֵבִיאוּ
  choice: apportèrent
  rationale: Le hiphil de בוא signifie couramment « faire venir, apporter »; le passé simple convient au registre narratif historique.
- source_word: וַיִּתְּנוּ
  choice: Ils les déposèrent
  rationale: נתן peut signifier mettre ou placer. « Déposèrent » exprime naturellement l’action de disposer les apports en tas.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  choice: en tas, tas après tas
  rationale: La répétition du nom exprime la multiplicité et l’accumulation. La formulation française conserve à la fois l’image concrète et l’insistance de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre d’alliance au lieu de le remplacer par un titre.
- issue: Nature exacte des קָדָשִׁים
  choice: choses saintes
  alternative: offrandes consacrées
  rationale: Le terme peut viser divers biens ou dons sacrés. La traduction retenue n’identifie pas plus précisément leur nature que ne le fait le texte hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre historique sans archaïsme marqué. « Gros et petit bétail » rend les catégories pastorales avec précision; la répétition finale conserve l’effet d’accumulation du texte source.
