revisions:
- from: Quand tout cela fut terminé, tous ceux d’Israël qui étaient présents partirent vers les villes de Juda. Ils brisèrent les pierres dressées, abattirent les ashéras[a] et démolirent les lieux de culte et les autels dans tout Juda et Benjamin, ainsi qu’en Éphraïm et en Manassé, jusqu’à les avoir entièrement détruits. Puis tous les fils d’Israël retournèrent chacun dans sa propriété, dans leurs villes.
  to: Quand tout cela fut terminé, tous les Israélites qui étaient présents se rendirent dans les villes de Juda. Ils brisèrent les pierres dressées, abattirent les ashérim[a] et démolirent les hauts lieux et les autels dans tout Juda et Benjamin, ainsi qu’en Éphraïm et en Manassé, jusqu’à les avoir entièrement détruits. Puis tous les fils d’Israël retournèrent chacun vers son domaine, dans sa ville.
  rationale: La révision remplace le terme générique « lieux de culte » par « hauts lieux », qui rend la désignation cultuelle spécifique du texte hébreu. Elle adopte « ashérim », translittération du pluriel hébreu, et lisse la formulation finale au moyen du singulier distributif français, sans modifier le sens du passage.
