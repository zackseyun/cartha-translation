source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: fr
  text: Quand tout cela fut terminé, tous les Israélites qui étaient présents se rendirent dans les villes de Juda. Ils brisèrent les pierres dressées, abattirent les ashérim[a] et démolirent les hauts lieux et les autels dans tout Juda et Benjamin, ainsi qu’en Éphraïm et en Manassé, jusqu’à les avoir entièrement détruits. Puis tous les fils d’Israël retournèrent chacun vers son domaine, dans sa ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les poteaux sacrés d’Ashéra ». Le terme hébreu peut désigner des objets cultuels associés à la déesse Ashéra, souvent compris comme des poteaux ou des arbres sacrés.'
    reason: Alternative lexicale préservant l’incertitude sur la forme exacte des objets.
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Quand tout cela fut terminé
  rationale: La construction temporelle כ + infinitif construit signifie « quand/lorsque tout cela fut achevé ». Le passif français reste naturel et n’ajoute pas de sujet absent de l’hébreu.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: tous ceux d’Israël qui étaient présents
  rationale: Le participe הנמצאים désigne ceux qui se trouvaient là. Cette formulation rend le sens contextuel sans laisser croire que l’ensemble de la population était nécessairement présent.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: ils brisèrent les pierres dressées
  rationale: מַצֵּבוֹת désigne ici des pierres ou stèles cultuelles dressées. « Pierres dressées » est plus précis en français courant que le seul mot « colonnes ».
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: abattirent les ashéras
  rationale: Le pluriel אֲשֵׁרִים peut désigner des objets cultuels liés à Ashéra, probablement en bois, sans que leur forme exacte soit certaine. La translittération préserve cette ambiguïté.
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת וְאֶת הַמִּזְבְּחֹת
  choice: démolirent les lieux de culte et les autels
  rationale: בָּמוֹת désigne des sites cultuels souvent situés en hauteur, mais pas nécessairement. « Lieux de culte » transmet clairement leur fonction, tandis que נָתַץ exprime leur démolition.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: dans tout Juda et Benjamin, ainsi qu’en Éphraïm et en Manassé
  rationale: La tournure française exprime l’étendue géographique de l’élimination tout en reflétant la variation des prépositions hébraïques.
- source_word: עַד לְכַלֵּה
  choice: jusqu’à les avoir entièrement détruits
  rationale: L’expression marque l’achèvement complet de l’action. Le pronom renvoie aux installations cultuelles énumérées.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ
  choice: Puis tous les fils d’Israël retournèrent chacun dans sa propriété
  rationale: « Fils d’Israël » conserve la forme ethnonymique masculine du texte, et « chacun dans sa propriété » rend la construction distributive ainsi que la possession foncière désignée par אֲחֻזָּה.
- source_word: לְעָרֵיהֶם
  choice: dans leurs villes
  rationale: Le pluriel collectif hébreu est conservé après le singulier distributif « chacun ».
theological_decisions:
- issue: Désignation genrée d’Israël et singulier distributif
  choice: tous les fils d’Israël retournèrent chacun dans sa propriété
  alternative: tous les Israélites retournèrent chacun dans sa propriété
  rationale: La formulation retenue conserve explicitement בְּנֵי (« fils de ») et la distribution masculine אִישׁ, sans en tirer une affirmation sur l’exclusion des femmes de la communauté.
- issue: Nature exacte des אֲשֵׁרִים
  choice: ashéras
  alternative: poteaux sacrés d’Ashéra
  rationale: Le terme hébreu peut renvoyer à divers objets cultuels associés à Ashéra. La translittération évite de fixer leur forme matérielle au-delà des données du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les verbes d’action sont concrets et la structure narrative demeure proche de l’hébreu. « Ashéras » nécessite une note, tandis que « lieux de culte » évite l’expression française potentiellement obscure « hauts lieux ».
