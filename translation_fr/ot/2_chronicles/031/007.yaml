    issue: 'Formulation française lourde : « en en posant la base »'
    rationale: La répétition de « en » produit une tournure maladroite en français moderne. Le possessif « leur » permet d’exprimer le renvoi aux tas sans lourdeur.
  - severity: low
    issue: Objet implicite de « ils eurent terminé »
    rationale: L’hébreu laisse l’objet implicite, mais le français gagne en clarté à reprendre « les tas »; cela ne modifie pas le sens.
  - severity: low
    issue: Note b trop affirmative sur une littéralité française
    rationale: « Ils commencèrent les tas pour les fonder » ne reflète pas naturellement l’ellipse syntaxique et risque de surinterpréter le rapport exact entre les verbes. Une note plus sobre conserve l’ambiguïté de la construction.
