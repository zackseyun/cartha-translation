  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: fr
  text: Au troisième mois, ils commencèrent à former les tas[a] en posant leur base[b], et au septième mois, ils les eurent terminés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les amoncellements ». Il s’agit des produits apportés en contribution et accumulés.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’hébreu associe « commencèrent », « les tas » et « fonder/établir une base ». La formulation est elliptique et décrit le commencement de la formation des tas par leur base.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: Au troisième mois
  rationale: חֹדֶשׁ désigne ici un mois dans une indication chronologique; « au troisième mois » est la tournure française naturelle.
- source_word: הֵחֵלּוּ
  choice: ils commencèrent
  rationale: Le verbe exprime le commencement de l'action; le passé simple convient au registre narratif biblique soutenu sans être archaïque.
- source_word: הָעֲרֵמוֹת
  choice: les tas
  rationale: עֲרֵמוֹת désigne des amoncellements, ici ceux des produits apportés. « Tas » conserve l'image concrète et reste naturel en français.
- source_word: לְיִסּוֹד
  choice: à constituer les tas en en posant la base
  rationale: L'infinitif de יסד évoque l'établissement de la base ou le commencement des tas. Cette formulation restitue l'expression hébraïque inhabituelle sans suggérer des fondations architecturales.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: et au septième mois
  rationale: La conjonction et le complément temporel marquent simplement la suite chronologique.
- source_word: כִּלּוּ
  choice: ils eurent terminé
  rationale: Le piel de כלה signifie « achever, terminer ». En français, le plus-que-parfait antérieur narratif souligne qu'au septième mois l'opération était achevée, tandis que l'objet demeure implicite comme en hébreu.
