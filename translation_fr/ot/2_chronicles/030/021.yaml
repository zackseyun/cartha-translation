source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: fr
  text: Les Israélites qui se trouvaient à Jérusalem célébrèrent la fête des Pains sans levain pendant sept jours, dans une grande joie. Jour après jour, les lévites et les prêtres louaient Yahweh avec de puissants instruments[a], en l’honneur de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec des instruments de force »; on peut aussi comprendre : « avec des instruments puissants » ou « avec des instruments retentissants ».'
    reason: L’expression hébraïque בִּכְלֵי עֹז est inhabituelle et peut évoquer la puissance des instruments ou la force de leur son.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: célébrèrent
  rationale: Avec חַג (« fête »), le verbe עשה signifie idiomatiquement célébrer ou observer une fête. « Célébrèrent » est naturel en français moderne.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce récit, l’expression désigne collectivement les membres du peuple d’Israël; « les Israélites » restitue ce sens sans le calque peu naturel « les fils d’Israël ».
- source_word: הַנִּמְצְאִים
  choice: qui se trouvaient
  rationale: Le participe de מצא signifie littéralement « trouvés », mais indique ici les personnes présentes à Jérusalem. « Qui se trouvaient » conserve le lien avec le verbe source tout en étant idiomatique.
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: Dénomination française claire et traditionnelle de cette fête biblique; la majuscule marque ici le nom établi de la célébration.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: dans une grande joie
  rationale: Rend directement l’intensité de la joie et s’intègre naturellement à la phrase française.
- source_word: וּמְהַלְלִים
  choice: louaient
  rationale: Le participe exprime une action qui se prolonge pendant la célébration; l’imparfait français en restitue l’aspect continu.
- source_word: יוֹם בְּיוֹם
  choice: jour après jour
  rationale: Expression française naturelle qui conserve la valeur distributive et répétée de l’hébreu.
- source_word: בִּכְלֵי עֹז
  choice: avec de puissants instruments
  rationale: La formulation hébraïque, littéralement « avec des instruments de force/puissance », est difficile. « Puissants instruments » en conserve l’image sans trancher entièrement entre puissance et volume sonore; une note expose l’ambiguïté.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La seconde occurrence de לַיהוָה indique vraisemblablement la destination ou la finalité de l’accompagnement instrumental. « En l’honneur de » l’exprime naturellement tout en maintenant la répétition du nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; conserver « Yahweh » distingue le nom personnel divin du titre אֲדֹנָי.
- issue: Rapport de la seconde expression לַיהוָה avec les instruments
  choice: en l’honneur de Yahweh
  alternative: pour Yahweh
  rationale: Le לְ peut exprimer la destination, l’intérêt ou la finalité. « En l’honneur de » convient au contexte cultuel sans faire des instruments eux-mêmes des objets consacrés; la valeur exacte reste ouverte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte l’action principale, tandis que l’imparfait exprime la louange répétée pendant les sept jours. La répétition de « Yahweh » est maintenue comme dans l’hébreu, malgré sa légère lourdeur stylistique.
