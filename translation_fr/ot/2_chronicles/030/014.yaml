base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: fr
  text: Ils se levèrent et enlevèrent les autels qui se trouvaient à Jérusalem. Ils enlevèrent tous les lieux où l’on brûlait de l’encens[a] et les jetèrent dans la vallée du Cédron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les brûle-parfums » ou « toutes les installations pour brûler de l’encens ». Le terme hébreu désigne des installations cultuelles associées à la combustion d’encens.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « le nahal du Cédron » : le terme hébreu peut désigner un ravin, une vallée ou le torrent qui y coule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Ils se levèrent
  rationale: Le verbe קום introduit ici, dans le récit, le passage à une action décidée. « Ils se levèrent » conserve ce mouvement narratif dans un français digne et naturel.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: enlevèrent
  rationale: La forme causative de סור signifie ici « enlever, ôter ». « Enlevèrent » convient aux deux occurrences et permet de conserver leur répétition.
- source_word: הַמִּזְבְּחוֹת
  choice: les autels
  rationale: מִזְבֵּחַ est le terme courant pour un autel. Le contexte indique qu’il s’agit d’installations cultuelles présentes à Jérusalem, sans qu’il soit nécessaire d’en préciser davantage la nature dans le texte.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: qui se trouvaient à Jérusalem
  rationale: Cette formulation restitue explicitement la proposition relative hébraïque tout en restant idiomatique en français.
- source_word: הַמְקַטְּרוֹת
  choice: les autels à encens
  rationale: Le nom, apparenté à la racine קטר (« faire brûler de l’encens »), désigne des installations cultuelles servant à brûler de l’encens. « Autels à encens » est clair dans ce contexte, tandis qu’une note préserve l’étendue possible du terme.
- source_word: וַיַּשְׁלִיכוּ
  choice: les jetèrent
  rationale: שׁלך exprime l’action de jeter. Le français moderne « les jetèrent » conserve le caractère énergique de leur élimination.
- source_word: לְנַחַל קִדְרוֹן
  choice: dans la vallée du Cédron
  rationale: נחל peut désigner une vallée encaissée, un ravin ou le cours d’eau souvent saisonnier qui s’y trouve. « Vallée du Cédron » est ici une désignation géographique claire, et la note signale les autres nuances possibles.
