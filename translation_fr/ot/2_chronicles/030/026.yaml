  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: fr
  text: Il y eut donc une grande joie à Jérusalem, car depuis les jours de Salomon, fils de David et roi d’Israël, on n’avait rien vu de pareil à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: Il y eut donc
  rationale: Le wayyiqtol de היה fait progresser le récit et présente la joie comme l’aboutissement des événements précédents. « Il y eut donc » est naturel et conserve cette nuance consécutive.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: une grande joie
  rationale: Cette traduction directe rend l’intensité de la joie ainsi que sa dimension collective, sans réduire l’expression à la seule célébration extérieure.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: En français moderne, la préposition locative habituelle devant un nom de ville est « à ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente. « Car » convient au registre narratif digne du passage.
- source_word: מִימֵי
  choice: depuis les jours de
  rationale: L’expression établit une comparaison temporelle remontant à l’époque de Salomon; la formulation conserve l’image hébraïque des « jours ».
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomon, fils de David
  rationale: La relation de filiation est rendue directement, avec la ponctuation requise par l’apposition française.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Le titre apposé identifie Salomon. La coordination « et roi d’Israël » rend clairement en français que les deux appositions se rapportent à lui.
- source_word: לֹא כָזֹאת
  choice: on n’avait rien vu de pareil
  rationale: Littéralement, l’expression signifie « rien de tel » ou « pas comme cela ». La tournure française restitue naturellement la comparaison sans préciser indûment la nature de l’événement.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: La seconde occurrence est maintenue afin de préserver l’encadrement et l’insistance rhétorique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « à Jérusalem » est volontairement conservée. « Depuis les jours de » maintient la couleur de l’expression hébraïque tout en restant immédiatement compréhensible.
