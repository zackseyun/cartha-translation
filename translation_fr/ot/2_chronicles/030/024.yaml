  text: כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְ֠הוּדָה הֵרִ֨ים לַ/קָּהָ֜ל אֶ֣לֶף פָּרִים֮ וְ/שִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒ וְ/הַ/שָּׂרִ֞ים הֵרִ֤ימוּ לַ/קָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְ/צֹ֖אן עֲשֶׂ֣רֶת אֲלָפִ֑ים וַ/יִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָ/רֹֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: fr
  text: Car Ézéchias, roi de Juda, donna à l’assemblée[a] mille taureaux et sept mille têtes de petit bétail[b], et les responsables donnèrent à l’assemblée mille taureaux et dix mille têtes de petit bétail. Un grand nombre de prêtres se consacrèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’assemblée »; dans ce contexte, la préposition hébraïque peut indiquer soit le destinataire, soit le bénéficiaire des animaux fournis pour le culte communautaire.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne collectivement le petit bétail et peut comprendre aussi bien des moutons que des chèvres.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de la célébration et de la joie mentionnées dans le contexte précédent.
- source_word: הֵרִים / הֵרִימוּ
  choice: donna / donnèrent
  rationale: À la forme causative, le verbe désigne ici l’apport d’une contribution destinée au rassemblement cultuel. « Donner » est naturel et n’impose pas un geste littéral consistant à « élever ».
- source_word: לַקָּהָל
  choice: à l’assemblée
  rationale: קָהָל désigne la communauté rassemblée. La préposition ל peut marquer ici le destinataire ou le bénéficiaire; le texte retient « à » tout en signalant l’autre possibilité en note.
- source_word: פָּרִים
  choice: taureaux
  rationale: Le terme désigne des bovins mâles, ici fournis pour les sacrifices de la fête.
- source_word: צֹאן
  choice: têtes de petit bétail
  rationale: Le nom collectif peut englober les moutons et les chèvres. Cette formulation française conserve mieux cette étendue que le seul mot « moutons ».
- source_word: הַשָּׂרִים
  choice: les responsables
  rationale: Le terme désigne les hauts dirigeants du peuple. « Responsables » est clair en français actuel et évite de suggérer nécessairement des princes héréditaires.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים לָרֹב
  choice: Un grand nombre de prêtres se consacrèrent
  rationale: La forme réfléchie de קדשׁ exprime la mise à part rituelle des prêtres, et לָרֹב souligne leur grand nombre.
theological_decisions:
- issue: Nature de la préparation des prêtres
  choice: se consacrèrent
  alternative: se purifièrent
  rationale: Le verbe קדשׁ met directement l’accent sur la consécration ou mise à part rituelle. « Se purifièrent » pourrait décrire un aspect de cette préparation, mais préciserait davantage que le texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement hébreu, tandis que la dernière proposition est reformulée naturellement pour rendre לָרֹב sans lourdeur.
