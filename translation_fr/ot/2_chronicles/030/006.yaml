    issue: « remises par le roi et ses hauts fonctionnaires »
    rationale: L’expression hébraïque signifie littéralement « de la main du roi et de ses chefs » et exprime surtout provenance ou autorisation. « Remises par » peut évoquer une remise physique, tandis que « hauts » ajoute une nuance absente du texte.
  - severity: low
    issue: « après avoir échappé au pouvoir des rois d’Assyrie »
    rationale: Cette tournure impose un enchaînement temporel. L’hébreu qualifie le groupe comme les rescapés qui demeurent pour les destinataires, échappés à la main/pouvoir des rois d’Assyrie.
