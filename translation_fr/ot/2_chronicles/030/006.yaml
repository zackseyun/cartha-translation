- from: 'Les courriers parcoururent donc tout Israël et Juda avec les lettres remises par le roi et ses hauts fonctionnaires, conformément à l’ordre du roi. Ils proclamaient : « Fils d’Israël, revenez à Yahweh, le Dieu d’Abraham, d’Isaac et d’Israël[a], afin qu’il revienne vers les rescapés qui vous restent après avoir échappé au pouvoir des rois d’Assyrie[b]. »'
  to: 'Les courriers parcoururent donc tout Israël et Juda avec les lettres envoyées par le roi et ses chefs, conformément à l’ordre du roi. Ils proclamaient : « Fils d’Israël, revenez à Yahweh, le Dieu d’Abraham, d’Isaac et d’Israël[a], afin qu’il revienne vers les rescapés qui vous restent, ayant échappé au pouvoir des rois d’Assyrie[b]. »'
  rationale: 'La révision reste minimale. Elle rend la provenance royale des lettres sans surinterpréter l’idiome « de la main de », et elle conserve dans la dernière proposition les deux aspects du syntagme hébreu : des rescapés et un reste encore présent pour les destinataires, échappé au pouvoir assyrien. Les ancres de notes sont correctement placées et sont maintenues.'
