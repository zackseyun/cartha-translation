source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: fr
  text: 'Les courriers parcoururent donc tout Israël et Juda avec les lettres envoyées par le roi et ses chefs, conformément à l’ordre du roi. Ils proclamaient : « Fils d’Israël, revenez à Yahweh, le Dieu d’Abraham, d’Isaac et d’Israël[a], afin qu’il revienne vers les rescapés qui vous restent, ayant échappé au pouvoir des rois d’Assyrie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « Israël », et non la formule plus courante « Jacob ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « les rescapés qui vous restent, de la main des rois d’Assyrie ».'
    reason: literal_rendering
lexical_decisions:
- source_word: הָרָצִים
  choice: les courriers
  rationale: Le terme désigne littéralement des coureurs, mais, dans ce contexte administratif où ils transportent des lettres royales, « courriers » exprime naturellement leur fonction officielle.
- source_word: בָּאִגְּרוֹת מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: avec les lettres remises par le roi et ses hauts fonctionnaires
  rationale: אִגְּרוֹת désigne des lettres ou dépêches. L’expression מִיַּד marque leur provenance et leur autorisation; « remises par » rend l’idiome naturellement, tandis que שָׂרָיו désigne ici les hauts responsables du roi.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: tout Israël et Juda
  rationale: Avec le verbe de mouvement « parcoururent », cette formulation exprime clairement l’étendue de la mission.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: conformément à l’ordre du roi
  rationale: מִצְוָה désigne ici une directive royale; « ordre » convient mieux que « commandement », souvent associé en français à un contexte religieux.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Fils d’Israël
  rationale: La traduction conserve la forme masculine explicite du texte hébreu et l’adresse solennelle, sans la généraliser en « peuple d’Israël ».
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: revenez à Yahweh
  rationale: Le verbe שׁוב exprime le retour, notamment relationnel et cultuel, et prépare la reprise du même verbe pour la réponse divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre « le Seigneur », afin de préserver le nom personnel présent dans le texte.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: le Dieu d’Abraham, d’Isaac et d’Israël
  rationale: Le texte hébreu porte explicitement « Israël » et non « Jacob »; la formule n’est donc pas harmonisée avec sa forme plus familière.
- source_word: וְיָשֹׁב אֶל
  choice: afin qu’il revienne vers
  rationale: La proposition qui suit l’impératif peut exprimer la finalité ou le résultat attendu. « Afin que » préserve ce rapport sans transformer la réponse divine en promesse catégorique.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: les rescapés qui vous restent
  rationale: פְּלֵיטָה désigne collectivement ceux qui ont échappé au désastre, tandis que הַנִּשְׁאֶרֶת לָכֶם précise qu’ils demeurent au sein ou à la disposition de la communauté. Cette formulation est concise et naturelle.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: après avoir échappé au pouvoir des rois d’Assyrie
  rationale: Littéralement « de la main des rois d’Assyrie »; dans ce contexte, « pouvoir » restitue clairement l’idée de domination dont les rescapés ont été préservés.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La traduction conserve le nom propre divin attesté par le texte plutôt que de lui substituer un titre.
- issue: Nom du troisième patriarche dans la formule
  choice: Israël
  alternative: Jacob
  rationale: Bien que « Abraham, Isaac et Jacob » soit la formule habituelle, le texte massorétique lit ici יִשְׂרָאֵל; cette particularité est maintenue.
- issue: Valeur de וְיָשֹׁב après l’impératif
  choice: afin qu’il revienne
  alternative: et il reviendra
  rationale: La forme peut présenter la réponse espérée de Dieu comme finalité ou conséquence de l’appel au retour. Le subjonctif français conserve cette nuance et évite d’en faire une promesse inconditionnelle.
- issue: Destinataires du retour de Dieu
  choice: il revienne vers les rescapés
  alternative: il ramène les rescapés
  rationale: Le sujet grammatical demeure Yahweh et אֶל introduit ceux vers qui il revient. La traduction ne transforme donc pas le verbe en causatif.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme de la proclamation royale est conservé. « Courriers », « hauts fonctionnaires » et « ordre » rendent naturellement le cadre administratif; « Fils d’Israël » maintient la forme solennelle de l’adresse hébraïque.
