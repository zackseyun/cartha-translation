  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: fr
  text: À présent, ne raidissez pas votre nuque comme vos ancêtres. Donnez votre main à Yahvé[a], venez à son sanctuaire, qu’il a consacré pour toujours, et servez Yahvé, votre Dieu, afin que sa colère ardente se détourne de vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnez votre main à Yahvé ». Cet idiome peut aussi signifier : « soumettez-vous à Yahvé » ou « engagez-vous envers Yahvé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et sa colère ardente se détournera de vous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: À présent
  rationale: Le terme hébreu est un adverbe temporel explicite. « À présent » le rend naturellement tout en reliant l’exhortation à son contexte.
- source_word: אַל תַּקְשׁוּ עָרְפְּכֶם
  choice: ne raidissez pas votre nuque
  rationale: Cette formulation conserve l’image hébraïque de la nuque rendue raide, qui exprime une résistance obstinée.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: comme vos ancêtres
  rationale: Dans ce contexte générationnel, « ancêtres » communique naturellement le sens des pères des générations précédentes sans modifier la portée du texte.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Donnez la main à Yahvé
  rationale: Le texte principal préserve l’image concrète de l’idiome hébreu, tandis que la note en explicite les sens possibles de soumission ou d’engagement.
- source_word: מִקְדָּשׁוֹ
  choice: son sanctuaire
  rationale: « Sanctuaire » rend le lieu saint sans réduire prématurément le terme au seul bâtiment du Temple.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: qu’il a consacré pour toujours
  rationale: « Consacré » garde le sens cultuel du verbe, et « pour toujours » rend directement לְעוֹלָם.
- source_word: וְעִבְדוּ
  choice: servez
  rationale: Le verbe עבד désigne ici le service rendu à Dieu, qui comprend le culte sans s’y limiter explicitement.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: Cette expression française conserve l’image de la chaleur intense associée à la colère divine, sans reproduire littéralement l’idiome anatomique hébreu.
theological_decisions:
- issue: Sens de l’idiome תְּנוּ יָד לַיהוָה
  choice: Donnez la main à Yahvé
  alternative: Soumettez-vous à Yahvé ; engagez-vous envers Yahvé
  rationale: L’idiome peut exprimer la soumission ou un engagement de fidélité. Conserver l’image dans le texte et en donner les sens possibles en note évite de trancher indûment.
- issue: Force de וְיָשֹׁב après la série d’impératifs
  choice: afin que son ardente colère se détourne de vous
  alternative: et son ardente colère se détournera de vous
  rationale: La proposition peut présenter le résultat recherché des exhortations plutôt qu’une simple prédiction catégorique. « Afin que » préserve cette nuance finale, tandis que l’autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Les images fortes de l’hébreu sont conservées lorsqu’elles restent intelligibles. Le nom divin יהוה est transcrit « Yahvé ». L’adverbe initial עַתָּה est rendu explicitement, puisqu’il figure bien dans le texte hébreu.
