  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: fr
  text: 'En effet, un grand nombre de personnes du peuple, notamment d’Éphraïm, de Manassé, d’Issacar et de Zabulon, ne s’étaient pas purifiées. Ils mangèrent pourtant la Pâque sans se conformer à ce qui est écrit[a]. Mais Ézéchias pria pour eux en disant : « Que Yahweh, qui est bon, fasse expiation en faveur de—[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pas conformément à ce qui est écrit » ou « non selon l’écrit ».'
    reason: lexical_alternative
  - marker: b
    text: La prière se poursuit au verset 19; en hébreu, la phrase reste inachevée à la fin de ce verset.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: un grand nombre de gens — beaucoup
  rationale: Cette formulation conserve l’idée d’une grande portion du peuple ainsi que l’insistance produite par רַבַּת, sans affirmer qu’il s’agissait nécessairement de la majorité absolue.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: d’Éphraïm et de Manassé, d’Issacar et de Zabulon
  rationale: Les noms tribaux et leur ordre sont conservés; la répétition de « d’ » rend clairement en français l’origine des personnes mentionnées.
- source_word: לֹא הִטֶּהָרוּ
  choice: ne s’étaient pas purifiés
  rationale: Le verbe à valeur réfléchie désigne ici la purification rituelle préalable à la célébration.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: mangèrent la Pâque
  rationale: La formulation garde l’objet explicite « la Pâque », qui peut désigner le repas ou la victime pascale, sans ajouter « agneau » au texte.
- source_word: בְּלֹא כַכָּתוּב
  choice: sans se conformer à ce qui est écrit
  rationale: Rend naturellement la non-conformité à la prescription écrite tout en maintenant la référence explicite à l’écrit.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: pria pour eux
  rationale: Exprime directement la prière faite en faveur des personnes qui ne s’étaient pas purifiées.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: הַטּוֹב
  choice: lui qui est bon
  rationale: L’adjectif qualifie Yahweh; cette tournure française conserve son relief tout en restant naturelle.
- source_word: יְכַפֵּר
  choice: accomplisse l’expiation
  rationale: Préserve la portée cultuelle de כפר dans ce contexte de Pâque et de pureté, contrairement à « pardonne », qui en réduirait la nuance.
- source_word: בְּעַד
  choice: en faveur de—
  rationale: La préposition introduit le bénéficiaire, mais son complément n’apparaît qu’au verset suivant. Le tiret conserve cette suspension syntaxique au lieu d’ajouter un pronom absent.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Portée cultuelle de כפר
  choice: accomplisse l’expiation
  alternative: pardonne
  rationale: Le cadre de purification et de Pâque favorise le maintien du vocabulaire d’expiation, sans préciser davantage le mécanisme théologique.
- issue: Phrase inachevée à la fin du verset
  choice: en faveur de—
  alternative: en faveur d’eux
  rationale: Le complément de בְּעַד est reporté au verset 19. Ne pas l’anticiper respecte la syntaxe hébraïque et la portée exacte de la prière.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit biblique écrit, tandis que le plus-que-parfait marque l’absence de purification préalable. Les tirets isolent la précision tribale et le dernier tiret signale volontairement la phrase hébraïque suspendue.
