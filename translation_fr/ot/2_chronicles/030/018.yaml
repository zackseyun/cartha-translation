  to: 'En effet, un grand nombre de personnes du peuple, notamment d’Éphraïm, de Manassé, d’Issacar et de Zabulon, ne s’étaient pas purifiées. Ils mangèrent pourtant la Pâque sans se conformer à ce qui est écrit[a]. Mais Ézéchias pria pour eux en disant : « Que Yahweh, qui est bon, fasse expiation en faveur de—[b] »'
