source:
  edition: WLC
  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: fr
  text: En Juda aussi, la main de Dieu fut à l’œuvre pour leur donner un seul cœur[a], afin qu’ils exécutent l’ordre du roi et des dirigeants, conformément à la parole de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cœur uni ».
    reason: Alternative lexicale explicitant le sens collectif de l’expression littérale « un seul cœur ».
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: En Juda aussi
  rationale: Cette formulation conserve la valeur additive de גַּם et le sens locatif naturel de la préposition ב.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: la main de Dieu fut à l’œuvre
  rationale: La traduction garde l’image hébraïque de la « main de Dieu » tout en exprimant naturellement en français son action effective, sans préciser un mécanisme théologique absent du texte.
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: pour leur donner un seul cœur
  rationale: « Un seul cœur » suit de près la métaphore hébraïque et évoque une volonté commune sans la réduire à la seule idée d’opinion ou d’intelligence.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: afin qu’ils exécutent l’ordre
  rationale: Dans ce contexte royal et administratif, « exécuter l’ordre » rend clairement l’idée d’une obéissance mise en pratique.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: du roi et des dirigeants
  rationale: « Dirigeants » restitue la fonction d’autorité des שָּׂרִים dans un français moderne, sans leur attribuer nécessairement le titre héréditaire de princes.
- source_word: בִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: La tournure indique que l’ordre royal s’accordait avec la parole divine; elle évite de trancher en faveur d’un sens purement instrumental de la préposition ב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
theological_decisions:
- issue: Nature de l’action divine exprimée par « la main de Dieu »
  choice: Présenter Dieu comme agissant effectivement pour donner au peuple une volonté commune.
  alternative: Affaiblir l’expression en « Dieu les aida », ou l’expliciter de manière déterministe.
  rationale: Le texte attribue clairement l’unité du peuple à l’action de Dieu, mais ne définit pas le mécanisme de cette action. La formulation conserve à la fois cette affirmation et sa réserve.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu, tandis que « fut à l’œuvre » et « exécutent l’ordre » assurent une lecture naturelle.
