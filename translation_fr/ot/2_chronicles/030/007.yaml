  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: fr
  text: Ne soyez pas comme vos pères ni comme vos frères, qui ont été infidèles à Yahweh, le Dieu de leurs pères. Il les a livrés à la désolation[a], comme vous le voyez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « livrés à l’horreur » ou « donnés en spectacle » ; le terme hébreu peut évoquer à la fois la dévastation et l’effroi qu’elle provoque chez ceux qui la contemplent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Ne soyez pas
  rationale: אַל suivi de l’inaccompli exprime ici une interdiction. « Ne soyez pas » rend naturellement la valeur stative de היה dans cette comparaison.
- source_word: כַאֲבוֹתֵיכֶם
  choice: comme vos pères
  rationale: אָבוֹת peut désigner les pères ou les ancêtres. « Vos pères » conserve l’écho avec « leurs pères » et le langage familial du passage.
- source_word: וְכַאֲחֵיכֶם
  choice: ni comme vos frères
  rationale: אָח peut désigner des frères au sens strict ou plus largement des membres du même peuple. « Vos frères » préserve la rhétorique familiale; « ni » coordonne naturellement en français les deux termes sous la négation.
- source_word: מָעֲלוּ בַּיהוָה
  choice: ont été infidèles à Yahweh
  rationale: מעל désigne une rupture de fidélité, notamment envers Dieu. Cette formulation exprime clairement la portée relationnelle et religieuse de la faute.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Cette formulation conserve l’expression d’alliance et reprend le vocabulaire familial du début du verset.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: Il les a livrés à la désolation
  rationale: נתן avec לְשַׁמָּה exprime le fait de placer ou livrer quelqu’un à un état de dévastation. Cette tournure française garde l’action divine et le résultat sans introduire une idée de but.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים
  choice: comme vous le voyez
  rationale: La formule renvoie à une réalité constatable par les destinataires; la traduction est directe et idiomatique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Lien entre l’infidélité et l’action divine
  choice: 'Deux phrases successives : « … leurs pères. Il les a livrés… »'
  alternative: « … leurs pères, si bien qu’il les a livrés… »
  rationale: Le waw narratif présente la succession sans marquer explicitement un but. La ponctuation française évite de préciser davantage le rapport logique tout en conservant l’action de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le langage familial (« pères », « frères ») et le nom divin sont conservés; la formulation évite les archaïsmes tout en gardant la solennité de l’exhortation.
