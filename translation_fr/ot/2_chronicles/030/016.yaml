  rationale: La révision resserre le rendu de מִשְׁפָּט pour conserver sa valeur de règle cultuelle prescrite sans paraphrase, clarifie la transmission du sang en français, et retire de la note le complément « contre l’autel », qui n’est pas formulé dans le verset. Le choix « aspergeaient » est maintenu avec une alternative lexicale sobre.
