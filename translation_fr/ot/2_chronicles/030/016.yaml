base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: fr
  text: Ils se tinrent à leur poste, conformément à leur règle prescrite, selon la loi de Moïse, l’homme de Dieu. Les prêtres aspergeaient[a] le sang que les lévites leur remettaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : projetaient le sang.'
    reason: Le verbe hébreu peut désigner une projection; « aspergeaient » en rend l’emploi rituel dans ce contexte.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: Ils se tinrent à leur poste
  rationale: La formulation exprime naturellement la prise ou le maintien de la position assignée dans le service du sanctuaire.
- source_word: כְּמִשְׁפָּטָם
  choice: conformément aux prescriptions qui les concernaient
  rationale: Dans ce contexte cultuel, מִשְׁפָּט désigne la procédure prescrite plutôt qu’une simple coutume ou un jugement judiciaire.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: selon la loi de Moïse
  rationale: Formulation française consacrée et claire pour l’instruction mosaïque régissant le rite.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Conserve le titre biblique solennel appliqué ici à Moïse.
- source_word: זֹרְקִים אֶת־הַדָּם
  choice: aspergeaient le sang
  rationale: Dans le vocabulaire sacrificiel, זרק décrit l’application rituelle du sang; « asperger » en rend clairement la fonction, tandis qu’une note conserve la nuance concrète possible de projection.
- source_word: מִיַּד הַלְוִיִּם
  choice: que leur remettaient les lévites
  rationale: Rend en français naturel l’expression littérale « de la main des lévites » et explicite seulement le transfert impliqué par le contexte.
theological_decisions:
- issue: Nature de la règle cultuelle exprimée par מִשְׁפָּט
  choice: prescriptions qui les concernaient
  alternative: coutume
  rationale: Le contexte de conformité à la loi mosaïque favorise une procédure normative et prescrite, sans ajouter de précision confessionnelle.
- issue: Application rituelle du sang
  choice: aspergeaient le sang
  alternative: projetaient le sang
  rationale: « Aspergeaient » correspond à l’usage sacrificiel courant et évite une image fortuite ou désordonnée; la variante est signalée afin de préserver la portée concrète du verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « À leur poste » et « remettaient » évitent un calque maladroit tout en conservant le cadre cultuel et le transfert du sang des lévites aux prêtres.
