  source_fidelity: 'Le sens rituel est globalement fidèle : les prêtres appliquent le sang que les lévites leur transmettent. « À leur poste » rend bien l’expression de position assignée. Toutefois, « prescriptions qui les concernaient » est plus explicatif que le possessif hébreu et peut être resserré en « leur règle prescrite », qui conserve le caractère normatif de מִשְׁפָּט sans ajouter un référent interprétatif. La note actuelle ajoute « contre l’autel », détail contextuellement plausible mais non exprimé dans ce verset.'
  naturalness: Le français est clair et de registre biblique moderne. « Selon leur règle prescrite » est plus direct et naturel que « conformément aux prescriptions qui les concernaient ». « Les lévites leur remettaient » place clairement les destinataires avant le verbe et facilite la lecture.
  terminology: « La loi de Moïse, l’homme de Dieu » conserve correctement le titre biblique. « Aspergeaient le sang » est un rendu rituel français recevable pour זֹרְקִים; l’alternative « projetaient » doit rester limitée au verbe, sans préciser un lieu ou une cible absents du texte.
