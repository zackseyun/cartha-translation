  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: fr
  text: Ils décidèrent donc de faire proclamer dans tout Israël, de Beer-Shéba jusqu’à Dan, que l’on vienne à Jérusalem célébrer la Pâque en l’honneur de Yahweh, le Dieu d’Israël, car on ne l’avait pas célébrée en grand nombre, conformément à ce qui est écrit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la dernière proposition est concis et peut aussi se comprendre : « car peu de gens l’avaient célébrée conformément à ce qui est écrit ». Il peut mettre l’accent soit sur le petit nombre de participants, soit sur le défaut de conformité aux prescriptions écrites.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: Ils décidèrent
  rationale: L’expression signifie littéralement « faire tenir une parole/affaire » et désigne ici une décision officielle. « Ils décidèrent » est naturel en français et conserve la force administrative du contexte.
- source_word: לְהַעֲבִיר קוֹל
  choice: de faire proclamer
  rationale: Littéralement « faire passer une voix ». Dans ce contexte, il s’agit de diffuser publiquement une annonce officielle.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: dans tout Israël
  rationale: Cette formulation exprime clairement l’étendue nationale de la proclamation.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: de Beer-Shéba jusqu’à Dan
  rationale: Le mérisme géographique, du sud au nord, est conservé tel quel.
- source_word: לָבוֹא
  choice: que l’on vienne
  rationale: L’infinitif exprime le contenu ou le but de la proclamation. La tournure impersonnelle convient à l’appel adressé à l’ensemble du peuple.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: célébrer la Pâque
  rationale: Littéralement « faire la Pâque » ; « célébrer la Pâque » est l’expression française naturelle pour l’observance de cette fête.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition marque l’orientation cultuelle de la célébration. « En l’honneur de » est idiomatique sans réduire la Pâque au seul sacrifice.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct et conventionnel de la construction hébraïque.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » exprime naturellement le lieu et la destination du rassemblement.
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: car on ne l’avait pas célébrée en grand nombre conformément à ce qui est écrit
  rationale: לָרֹב est pris dans son sens quantitatif, « en grand nombre », plutôt que dans le sens traditionnel mais lexicalement moins direct de « depuis longtemps ». La formulation conserve aussi le lien possible entre כַּכָּתוּב et la manière prescrite de célébrer.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre divin est translittéré afin de préserver sa fonction de nom d’alliance dans le texte hébreu.
- issue: Portée de לָרֹב et de כַּכָּתוּב dans la proposition finale
  choice: faible participation, avec référence à la prescription écrite
  alternative: ils ne l’avaient pas célébrée conformément à l’Écriture depuis longtemps
  rationale: Le sens quantitatif de לָרֹב est lexicalement préférable. La syntaxe hébraïque reste toutefois resserrée et permet de mettre davantage l’accent soit sur le nombre des participants, soit sur la conformité de l’observance ; cette tension est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Beer-Shéba » suit une translittération française courante. L’ambiguïté de la proposition finale est maintenue dans le texte et explicitée en note.
