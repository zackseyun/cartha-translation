  to: Ils décidèrent donc de faire proclamer dans tout Israël, de Beer-Shéba jusqu’à Dan, que l’on vienne à Jérusalem célébrer la Pâque en l’honneur de Yahweh, le Dieu d’Israël, car on ne l’avait pas célébrée en grand nombre, conformément à ce qui est écrit.[a]
  rationale: Révision limitée à la ponctuation de la proposition finale. Elle améliore le français et signale la relation possible de « conformément à ce qui est écrit » avec l’observance, sans résoudre artificiellement l’ambiguïté du texte hébreu ni modifier le choix quantitatif pour לָרֹב.
