  text: כִּ֣י לֹ֧א יָכְל֛וּ לַ/עֲשֹׂת֖/וֹ בָּ/עֵ֣ת הַ/הִ֑יא כִּ֤י הַ/כֹּהֲנִים֙ לֹֽא הִתְקַדְּשׁ֣וּ לְ/מַ דַּ֔י וְ/הָ/עָ֖ם לֹא נֶאֶסְפ֥וּ לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: fr
  text: En effet, ils ne pouvaient pas la célébrer à ce moment-là, parce que les prêtres ne s’étaient pas suffisamment consacrés[a] et que le peuple ne s’était pas rassemblé à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les prêtres qui s’étaient consacrés n’étaient pas assez nombreux ». L’expression hébraïque peut indiquer soit une consécration insuffisante, soit un nombre insuffisant de prêtres consacrés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: pouvaient
  rationale: Le verbe exprime la capacité. « Ne pouvaient pas » rend naturellement l’impossibilité dans cette explication au passé.
- source_word: לַעֲשֹׂתוֹ
  choice: la célébrer
  rationale: Le pronom renvoie à la Pâque mentionnée dans le contexte. En français, « la célébrer » est plus clair et naturel que le littéral « la faire ».
- source_word: בָּעֵת הַהִיא
  choice: à ce moment-là
  rationale: Cette expression désigne le moment où la Pâque devait normalement être célébrée, sans ajouter explicitement l’idée de date fixée.
- source_word: הִתְקַדְּשׁוּ
  choice: s’étaient consacrés
  rationale: Dans ce contexte cultuel, la forme réfléchie désigne la préparation rituelle des prêtres. « Se consacrer » est digne et compréhensible en français moderne.
- source_word: לְמַדַּי
  choice: suffisamment
  rationale: L’adverbe indique une mesure ou une quantité insuffisante. « Suffisamment » conserve la formulation compacte de l’hébreu, tandis qu’une note signale la possible lecture numérique.
- source_word: נֶאֶסְפוּ
  choice: s’était rassemblé
  rationale: Le nifal peut décrire le fait de se réunir. L’accord au singulier avec le collectif « le peuple » est naturel en français.
- source_word: לִירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition לְ peut marquer la direction ou le lieu d’aboutissement. Avec « se rassembler », « à Jérusalem » exprime naturellement le lieu où devait avoir lieu le rassemblement.
theological_decisions:
- issue: Portée de לְמַדַּי
  choice: les prêtres ne s’étaient pas suffisamment consacrés
  alternative: les prêtres consacrés n’étaient pas assez nombreux
  rationale: L’hébreu est compact et peut viser soit le degré de préparation rituelle, soit le nombre de prêtres préparés. Le texte principal garde une formulation adverbiale proche de l’original, et la note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » rend la valeur explicative du premier כִּי. La répétition causale de l’hébreu est allégée par « parce que… et que… », sans modifier le rapport logique.
