base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: fr
  text: Toute l’assemblée de Juda se réjouit, ainsi que les prêtres et les lévites, toute l’assemblée venue d’Israël, les étrangers établis[a] venus du pays d’Israël et ceux qui habitaient en Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les résidents étrangers ». Le terme hébreu גֵּרִים désigne des personnes non originaires du pays qui résidaient au sein d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se réjouit
  rationale: Le verbe שׂמח exprime la joie. Le singulier convient en français avec le sujet collectif « toute l’assemblée », sans préciser davantage la forme prise par cette joie.
- source_word: כָּל קְהַל יְהוּדָה
  choice: toute l’assemblée de Juda
  rationale: קהל désigne ici la communauté rassemblée. « Assemblée » évite une connotation ecclésiale plus tardive et rend naturellement la totalité exprimée par כָּל.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis de כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française habituelle du groupe lévitique, distingué ici des prêtres.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: toute l’assemblée venue d’Israël
  rationale: La tournure participiale française est fluide et conserve l’idée de personnes arrivées d’Israël dans le contexte narratif.
- source_word: הַגֵּרִים
  choice: les étrangers établis
  rationale: גֵּרִים désigne des non-autochtones résidant au sein de la population. « Étrangers établis » rend à la fois leur origine étrangère et leur statut de résidents, dans un français actuel.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: venus du pays d’Israël
  rationale: La formulation rend directement l’origine géographique indiquée par אֶרֶץ יִשְׂרָאֵל et s’intègre naturellement à la phrase.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: ceux qui habitaient en Juda
  rationale: Le verbe ישׁב indique le fait d’habiter ou de résider. L’imparfait convient au cadre narratif et conserve la formulation distincte de ce dernier groupe.
