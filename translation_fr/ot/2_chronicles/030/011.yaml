source:
  edition: WLC
  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: fr
  text: Cependant, quelques hommes d’Aser, de Manassé et de Zabulon s’humilièrent et vinrent à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Cependant
  rationale: Dans ce contexte, la particule marque le contraste avec les moqueries et le rejet rapportés au verset précédent. « Cependant » exprime naturellement cette opposition sans lui donner un sens restrictif.
- source_word: אֲנָשִׁים
  choice: quelques hommes
  rationale: Le nom masculin pluriel désigne ici un nombre indéterminé d’hommes appartenant aux tribus citées. « Quelques hommes » rend à la fois cette valeur partitive contextuelle et la forme genrée de l’hébreu.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: d’Aser, de Manassé et de Zabulon
  rationale: Les prépositions indiquent l’origine tribale ou territoriale. Les formes françaises traditionnelles et courantes des noms propres sont conservées.
- source_word: נִכְנְעוּ
  choice: s’humilièrent
  rationale: Le niphal de כנע peut exprimer le fait de s’abaisser ou de s’humilier. Ici, la venue volontaire à Jérusalem favorise une formulation pronominale qui décrit leur réponse humble sans préciser davantage sa nature.
- source_word: וַיָּבֹאוּ
  choice: et vinrent
  rationale: La forme narrative fait progresser le récit. « Vinrent » rend directement בוא avec Jérusalem comme destination et s’accorde au registre narratif biblique dignifié.
- source_word: לִירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition directionnelle ל est rendue naturellement par « à » devant le nom de la ville.
theological_decisions:
- issue: Valeur de נִכְנְעוּ
  choice: s’humilièrent
  alternative: furent humiliés / se soumirent
  rationale: La forme hébraïque permet une nuance d’état ou une nuance réfléchie. Le contexte, où ces hommes répondent à l’appel en venant à Jérusalem, soutient « s’humilièrent », tout en évitant d’ajouter un objet explicite à leur soumission.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration historique écrite. Aucun marqueur de note n’est nécessaire.
