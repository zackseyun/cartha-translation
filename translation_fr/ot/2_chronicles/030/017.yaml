source:
  edition: WLC
  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: fr
  text: Car un grand nombre de personnes dans l’assemblée ne s’étaient pas sanctifiées[a], et les Lévites étaient chargés d’immoler les animaux de la Pâque[b] pour tous ceux qui n’étaient pas purs[c], afin de les consacrer à Yahweh[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’étaient pas consacrés ». Le verbe hébreu appartient au vocabulaire de la sanctification, même si la pureté rituelle est directement en cause ici.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les Pâques », c’est-à-dire les animaux offerts en sacrifice pour la Pâque.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire rituellement purs.
    reason: contextual_clarification
  - marker: d
    text: L’hébreu n’indique pas explicitement l’objet de « consacrer ». Il s’agit probablement des animaux de la Pâque immolés au nom des personnes impures.
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: beaucoup de gens dans l’assemblée
  rationale: Cette formulation rend naturellement l’idée d’un grand nombre de personnes au sein de la communauté réunie.
- source_word: הִתְקַדָּשׁוּ
  choice: ne s’étaient pas sanctifiés
  rationale: Le verbe issu de קדשׁ relève de la sanctification ou de la consécration cultuelle. « Sanctifiés » préserve ce champ sémantique sans le réduire à la seule purification rituelle.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française habituelle de ce groupe tribal et cultuel.
- source_word: עַל שְׁחִיטַת
  choice: se chargèrent d’immoler
  rationale: Dans ce contexte, עַל indique la responsabilité exercée par les Lévites, tandis que « immoler » exprime clairement l’abattage sacrificiel.
- source_word: הַפְּסָחִים
  choice: les animaux de la Pâque
  rationale: Le pluriel signifie littéralement « les Pâques », mais désigne ici les animaux offerts pour la Pâque. « Animaux » évite de préciser indûment qu’il s’agissait exclusivement d’agneaux.
- source_word: לְכֹל לֹא טָהוֹר
  choice: pour tous ceux qui n’étaient pas purs
  rationale: La pureté en question est cultuelle ou rituelle, mais la formulation simple conserve le vocabulaire biblique de pureté sans ajouter une précision absente du texte.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: afin de les consacrer à Yahweh
  rationale: « Consacrer » rend la finalité cultuelle exprimée par קדשׁ. Le pronom conserve dans le texte l’absence d’objet nominal explicite en hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui le rend comme nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rapport entre sanctification et pureté rituelle
  choice: Conserver « sanctifiés » pour הִתְקַדָּשׁוּ et « purs » pour טָהוֹר.
  alternative: Rendre le premier terme par « purifiés » et fondre ainsi les deux notions.
  rationale: Le contexte concerne bien l’aptitude rituelle, mais le texte emploie deux racines distinctes. La traduction maintient la tension entre sainteté consacrée et pureté cultuelle.
- issue: Objet implicite de לְהַקְדִּישׁ
  choice: Employer le pronom « les » dans le texte et signaler en note qu’il renvoie probablement aux animaux offerts.
  alternative: Expliciter dans le texte « afin de consacrer ces animaux » ou comprendre que les personnes impures sont consacrées.
  rationale: L’hébreu n’énonce pas l’objet. Les animaux sacrificiels constituent le référent contextuel le plus probable, mais une note permet de ne pas dissimuler l’ellipse syntaxique.
- issue: Valeur du lien entre l’absence de sanctification et le service des Lévites
  choice: Employer « donc » pour rendre la conséquence contextuelle.
  alternative: Coordonner simplement par « et ».
  rationale: Le וְ hébreu coordonne les propositions, mais le contexte montre que les Lévites immolaient les victimes parce que de nombreux participants n’étaient pas rituellement aptes à le faire. « Donc » explicite cette relation sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. « Se sanctifier » et « immoler » maintiennent le registre cultuel du passage, tandis que la syntaxe reste accessible. Le nom divin est rendu par « Yahweh ».
