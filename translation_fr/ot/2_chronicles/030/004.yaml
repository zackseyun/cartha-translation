  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: fr
  text: La chose parut bonne aux yeux du roi et de toute l’assemblée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La chose fut bonne aux yeux du roi et de toute l’assemblée. »'
    reason: Alternative pour la valeur de וַיִּישַׁר, qui peut présenter la chose comme étant bonne plutôt que comme paraissant bonne.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: parut juste
  rationale: Le verbe ישר exprime ici une appréciation favorable de la décision. « Parut juste » conserve la nuance évaluative et s’accorde naturellement avec l’expression « aux yeux de ».
- source_word: הַדָּבָר
  choice: la décision
  rationale: דבר est un terme large (« chose, affaire, parole »). Dans le contexte, il renvoie à ce qui vient d’être décidé au sujet de la célébration de la Pâque; « décision » rend clairement ce référent sans développer le texte.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française conserve l’image de l’idiome hébreu tout en restant naturelle et immédiatement compréhensible.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini.
- source_word: וּבְעֵינֵי
  choice: et de
  rationale: En français, le complément de « aux yeux de » peut naturellement être coordonné sans répéter toute l’expression; le parallélisme sémantique demeure intact.
- source_word: כָּל
  choice: toute
  rationale: Rend la totalité de l’assemblée et s’accorde avec le nom féminin singulier français.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קהל désigne la communauté réunie. « Assemblée » est clair, digne et moins marqué ecclésiastiquement que « congrégation ».
