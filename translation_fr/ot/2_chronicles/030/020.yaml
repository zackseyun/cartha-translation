  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶל יְחִזְקִיָּ֔הוּ וַ/יִּרְפָּ֖א אֶת הָ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: fr
  text: Yahvé écouta Ézéchias et guérit le peuple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entendit Ézéchias ». Dans cette construction, le verbe hébreu peut signifier « entendre » ou « écouter et répondre favorablement ».
    reason: lexical_alternative
  - marker: b
    text: « Guérit » peut désigner la suppression par Yahvé d’une affliction ou d’un jugement lié à l’état rituel irrégulier du peuple, et ne renvoie pas nécessairement à une guérison exclusivement physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écouta
  rationale: 'Avec la préposition אֶל et dans le contexte de la prière d’intercession d’Ézéchias, le verbe exprime ici plus qu’une simple perception auditive : Yahvé prête attention et répond favorablement.'
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante translittère le nom divin יהוה plutôt que de le remplacer par un titre.
- source_word: יְחִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: וַיִּרְפָּא
  choice: guérit
  rationale: Le verbe רפא signifie normalement « guérir ». Ce choix conserve l’image hébraïque sans préciser indûment s’il s’agit d’une maladie physique ou de la levée d’une affliction ou d’un jugement.
- source_word: הָעָם
  choice: le peuple
  rationale: Dans ce contexte, עם désigne la communauté d’Israélites rassemblée ; « le peuple » est l’équivalent français naturel.
theological_decisions:
- issue: Nature de la guérison du peuple
  choice: Conserver « guérit » sans limiter l’expression à une guérison physique.
  alternative: « pardonna au peuple », « épargna le peuple » ou « rétablit le peuple »
  rationale: Le contexte concerne des personnes ayant mangé la Pâque sans être pleinement purifiées rituellement, ainsi que la prière d’Ézéchias en leur faveur. Toutefois, le texte emploie רפא, « guérir » ; la traduction garde donc cette formulation et sa tension, qui peut inclure la suppression d’une affliction ou d’un jugement.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase brève suit la coordination narrative hébraïque tout en employant le passé simple, adapté au registre narratif biblique écrit.
