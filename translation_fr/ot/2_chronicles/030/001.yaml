source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: fr
  text: Ézéchias envoya un message à tout Israël et à Juda[a]. Il écrivit aussi des lettres à Éphraïm et à Manassé, pour qu’ils viennent à la maison de Yahweh, à Jérusalem, afin de célébrer la Pâque en l’honneur de Yahweh[b], le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tout Israël et Juda »; la préposition hébraïque peut désigner les destinataires aussi bien que l’étendue géographique de l’envoi.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut se rendre plus littéralement par « célébrer la Pâque pour Yahweh » ou « faire la Pâque pour Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya un message
  rationale: Le verbe signifie littéralement « envoya »; dans ce contexte, l’objet implicite est une communication ou une convocation. « Envoya un message » reste naturel sans préciser indûment le recours à des messagers.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: à tout Israël et à Juda
  rationale: La préposition עַל indique ici vraisemblablement les destinataires ou l’étendue de l’envoi. La traduction retenue exprime directement la convocation adressée aux deux ensembles.
- source_word: אִגְּרוֹת כָּתַב
  choice: écrivit aussi des lettres
  rationale: Traduction directe et idiomatique de la correspondance écrite; la place de « aussi » rend וְגַם.
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: à Éphraïm et à Manassé
  rationale: Avec כתב, עַל désigne ici les destinataires ou les territoires visés par les lettres.
- source_word: לָבוֹא
  choice: pour les inviter à venir
  rationale: L’infinitif exprime le but de l’envoi. L’ajout explicatif « les inviter » rend en français naturel la fonction des lettres sans modifier le contenu de l’appel.
- source_word: לְבֵית יְהוָה
  choice: à la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque « maison de Yahweh » plutôt que de l’interpréter directement par « temple ».
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: afin de célébrer la Pâque
  rationale: Littéralement « faire la Pâque », tournure idiomatique désignant l’observance de la fête. « Célébrer » est courant, clair et digne en français moderne.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: Le לְ marque la destination ou la dédicace de la célébration. « En l’honneur de » communique naturellement ce rapport tout en évitant l’étrange « célébrer la Pâque à Yahweh ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement le syntagme construit et maintient l’identification covenantielle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Valeur de לְ dans לַיהוָה
  choice: en l’honneur de Yahweh
  alternative: pour Yahweh
  rationale: La formulation retenue conserve l’idée de célébration vouée à Yahweh, sans trancher au-delà de la valeur de destination ou d’intérêt exprimée par la préposition.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été divisée en deux phrases pour alléger la longue coordination hébraïque. « Maison de Yahweh » conserve l’image source; « célébrer la Pâque » rend l’idiome hébreu de manière naturelle.
