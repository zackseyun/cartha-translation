- from: toute personne dont le cœur était résolu à chercher Dieu, Yahweh, le Dieu de ses ancêtres, même sans s’être purifiée comme l’exigeait le lieu saint.[a]
  to: toute personne dont le cœur était disposé à chercher Dieu, Yahweh, le Dieu de ses ancêtres, bien qu’elle ne soit pas purifiée conformément aux exigences du lieu saint.[a]
  rationale: La révision conserve la portée distributive et la concession du texte, tout en formulant plus naturellement l’idiome du cœur préparé et en présentant le défaut de purification comme un état de non-conformité rituelle plutôt que comme une action réflexive explicitement accomplie. La note maintient l’alternative lexicale sans trancher le référent cultuel.
