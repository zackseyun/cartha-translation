source:
  edition: WLC
  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: fr
  text: toute personne dont le cœur était disposé à chercher Dieu, Yahweh, le Dieu de ses ancêtres, bien qu’elle ne soit pas purifiée conformément aux exigences du lieu saint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire ». Ici, le mot hébreu peut désigner le lieu saint ou le sanctuaire dans son ensemble.
    reason: Alternative lexicale pour הַקֹּדֶשׁ, dont le référent cultuel exact demeure ouvert.
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: toute personne dont le cœur
  rationale: La construction singulière a ici une valeur distributive. Cette formulation conserve l’individualisation du texte hébreu tout en restant naturelle en français.
- source_word: הֵכִין
  choice: était résolu
  rationale: Le hiphil de כון décrit un cœur fermement disposé ou orienté. « Était résolu » exprime ici une disposition volontaire et stable, sans réduire le verbe à une simple préparation préalable.
- source_word: לִדְרוֹשׁ
  choice: à chercher
  rationale: Avec Dieu pour objet, דרש peut désigner le fait de le rechercher dans la dévotion, le culte ou la consultation. « Chercher » en garde la portée sans la restreindre.
- source_word: הָאֱלֹהִים יְהוָה
  choice: Dieu, Yahweh
  rationale: L’apposition identifie explicitement le Dieu recherché par son nom propre, Yahweh.
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: le Dieu de ses ancêtres
  rationale: Le suffixe singulier s’accorde avec la valeur distributive de « toute personne ». « Ancêtres » rend naturellement אָבוֹת en français moderne et conserve la dimension historique et covenantale.
- source_word: וְלֹא
  choice: même sans
  rationale: 'Dans ce contexte, la conjonction introduit une concession : la recherche sincère de Dieu est affirmée malgré une purification non conforme.'
- source_word: כְּטָהֳרַת
  choice: s’être purifiée comme l’exigeait
  rationale: טָהֳרָה renvoie à la purification rituelle et כְּ marque la conformité à une norme. La tournure verbale française explicite naturellement que la personne ne satisfaisait pas à cette exigence, sans effacer la tension du texte.
- source_word: הַקֹּדֶשׁ
  choice: le lieu saint
  rationale: Dans ce cadre cultuel, קֹדֶשׁ peut désigner le sanctuaire ou la sphère sainte. « Lieu saint » reste transparent et préserve l’ambiguïté lexicale signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin distinct de אֱלֹהִים.
- issue: Sincérité du cœur et défaut de purification rituelle
  choice: Maintenir ensemble la résolution à chercher Dieu et la non-conformité rituelle
  alternative: Atténuer soit la sincérité, soit le défaut de purification
  rationale: L’hébreu juxtapose ces deux réalités sans en résoudre ici la tension théologique; la traduction les conserve toutes deux.
- issue: Référent de הַקֹּדֶשׁ
  choice: le lieu saint
  alternative: le sanctuaire
  rationale: Le contexte est cultuel, mais le terme peut viser le lieu saint ou, plus largement, le sanctuaire. Le texte principal retient le rendu transparent et la note présente l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le caractère fragmentaire du verset dans son contexte immédiat, tout en formulant naturellement la concession rituelle. Le marqueur [a] figure dans le texte principal.
