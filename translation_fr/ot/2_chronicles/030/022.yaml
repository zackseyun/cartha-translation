  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: fr
  text: Ézéchias adressa des paroles encourageantes[a] à tous les lévites qui faisaient preuve d’un bon discernement dans le service de Yahweh[b]. Ils prirent part aux repas de la fête pendant sept jours, offrant des sacrifices de communion[c] et rendant grâce[d] à Yahweh, le Dieu de leurs ancêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parla au cœur de tous les lévites ». L’expression peut aussi signifier qu’il leur parla avec bienveillance ou de manière réconfortante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui avaient un bon discernement à l’égard de Yahweh » ou « qui se montraient compétents dans ce qui concernait Yahweh ».'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « sacrifices de paix »; on peut aussi traduire « sacrifices de bien-être ». Il s’agit d’une catégorie de sacrifices dont une partie pouvait être consommée lors d’un repas partagé.'
    reason: lexical_alternative
  - marker: d
    text: Le verbe peut aussi signifier « confesser » ou « célébrer »; dans ce contexte cultuel, il exprime vraisemblablement l’action de grâce ou la louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: adressa des paroles encourageantes
  rationale: L’expression signifie littéralement « parler au cœur de », mais désigne ici une parole qui encourage ou fortifie. La formulation retenue en transmet naturellement la portée en français.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française habituelle de ce groupe cultuel d’Israël.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב לַיהוָה
  choice: qui faisaient preuve d’un bon discernement dans le service de Yahweh
  rationale: La construction associant le participe et le nom de même racine souligne un discernement ou un savoir-faire manifeste. Le contexte cultuel favorise l’idée d’une compétence exercée au service de Yahweh, sans exclure le sens plus général « à l’égard de Yahweh ».
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: Ils prirent part aux repas de la fête
  rationale: Littéralement, le texte dit qu’ils « mangèrent la fête ». Cette expression peu naturelle en français renvoie à la participation aux repas de la fête fixée; la traduction conserve explicitement l’acte de manger sans reproduire une tournure obscure.
- source_word: שִׁבְעַת הַיָּמִים
  choice: pendant sept jours
  rationale: Expression française naturelle de la durée.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: offrant des sacrifices de communion
  rationale: שְׁלָמִים désigne une catégorie sacrificielle liée à la paix, au bien-être et au repas partagé. « Sacrifices de communion » est une appellation française claire, tout en signalant les autres rendus possibles en note.
- source_word: וּמִתְוַדִּים
  choice: rendant grâce
  rationale: La forme de ידה peut exprimer la confession, la louange ou l’action de grâce. Dans ce cadre festif et cultuel, « rendant grâce » convient bien, tout en maintenant l’ambiguïté lexicale dans une note.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs ancêtres
  rationale: « Ancêtres » rend naturellement le pluriel אָבוֹת dans cette formule d’appartenance historique et d’alliance, sans limiter artificiellement la référence aux pères immédiats.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifices de communion
  alternative: sacrifices de paix / sacrifices de bien-être
  rationale: Aucun équivalent français unique ne couvre toutes les connotations de cette catégorie sacrificielle. Le texte retient l’appellation compréhensible « sacrifices de communion » et la note préserve les autres possibilités.
- issue: Valeur de וּמִתְוַדִּים
  choice: rendant grâce
  alternative: confessant / célébrant
  rationale: Le contexte de fête et de sacrifices favorise l’action de grâce, mais la polysémie cultuelle du verbe est explicitement conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque obscur « manger la fête », explicite sobrement la participation aux repas festifs et conserve en notes les principales ambiguïtés lexicales et cultuelles.
