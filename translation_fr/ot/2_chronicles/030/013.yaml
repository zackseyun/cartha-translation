base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: fr
  text: 'Un grand nombre de personnes se rassemblèrent à Jérusalem pour célébrer la fête des Pains sans levain[a] au deuxième mois : une très grande assemblée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « observer la fête des Pains sans levain » ; littéralement « faire la fête », au sens de tenir ou de célébrer la fête.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: se rassembla
  rationale: Le niphal de אסף exprime ici le fait de se réunir. Le singulier s’accorde naturellement en français avec le sujet collectif « un peuple nombreux ».
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: עַם רָב
  choice: un peuple nombreux
  rationale: Rend directement le nom collectif עַם et l’idée quantitative de רָב, sans réduire l’expression à une simple foule.
- source_word: לַעֲשׂוֹת
  choice: pour célébrer
  rationale: Avec une fête pour complément, עשה signifie idiomatiquement la célébrer ou l’observer. « Célébrer » est naturel en français moderne et convient au contexte festif et cultuel.
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: « Fête » rend naturellement חַג, tandis que « Pains sans levain » est l’appellation française claire et traditionnelle de מַצּוֹת.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: au deuxième mois
  rationale: Traduction directe de l’indication chronologique, importante dans le contexte de la célébration différée.
- source_word: קָהָל לָרֹב מְאֹד
  choice: ce fut une très grande assemblée
  rationale: La proposition explicite la valeur appositive de l’hébreu et conserve la forte insistance sur le nombre. « Assemblée » reste neutre et convient au rassemblement cultuel.
