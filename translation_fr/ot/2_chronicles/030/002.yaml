  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: fr
  text: Le roi, ses hauts fonctionnaires et toute l’assemblée de Jérusalem décidèrent de célébrer la Pâque au deuxième mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: décidèrent
  rationale: Le niphal de יעץ exprime ici une délibération commune aboutissant à une décision. Le pluriel français s’accorde naturellement avec les sujets coordonnés.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini; le texte emploie le titre plutôt que le nom d’Ézéchias.
- source_word: וְשָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: שָׂרִים désigne ici les principaux responsables du royaume. « Hauts fonctionnaires » est moderne et évite que « princes » soit compris comme « fils du roi ».
- source_word: וְכָל הַקָּהָל בִּירוּשָׁלִָם
  choice: et toute l’assemblée réunie à Jérusalem
  rationale: קָהָל désigne la communauté assemblée. « Réunie » explicite naturellement en français la valeur collective du terme sans ajouter de contenu doctrinal.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: de célébrer la Pâque
  rationale: Littéralement « faire la Pâque »; dans ce contexte, l’expression signifie accomplir ou célébrer l’observance pascale. « Célébrer » est idiomatique et digne en français contemporain.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: au deuxième mois
  rationale: Rendu temporel direct. La formulation conserve le système de datation du texte sans ajouter le nom d’un mois.
theological_decisions:
- issue: Rendu de l’expression idiomatique relative à la Pâque
  choice: célébrer la Pâque
  alternative: observer la Pâque; faire la Pâque
  rationale: « Célébrer » exprime naturellement l’accomplissement de la fête en français, sans développer les rites ni imposer une interprétation confessionnelle. Le littéralisme « faire la Pâque » serait moins clair.
translation_notes:
  register: Français international moderne, clair et digne. La coordination hébraïque est conservée, avec un verbe au pluriel naturel en français. Aucun appel de note n’est nécessaire, car l’idiome est rendu directement sans perte significative exigeant une variante.
