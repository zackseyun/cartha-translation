source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: fr
  text: Alors les prêtres, les Lévites[a], se levèrent et bénirent le peuple. Leur voix fut entendue[b], et leur prière parvint jusqu’à sa demeure sainte, jusqu’au ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les prêtres lévitiques ». L’hébreu peut présenter « les Lévites » comme une apposition qui précise l’identité des prêtres.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur voix fut écoutée »; la forme passive laisse entendre que Dieu les entendit sans le nommer explicitement.
    reason: alternative_reading
  - marker: c
    text: Ou « jusqu’à sa demeure sainte, jusqu’aux cieux »; le mot hébreu traduit par « ciel » a une forme plurielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le qal de קום exprime ici le fait de se lever avant de prononcer la bénédiction; « se levèrent » est naturel et concret en français.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres, les Lévites
  rationale: La juxtaposition est conservée comme une apposition probable, qui précise que ces prêtres sont des Lévites sans introduire explicitement deux groupes distincts.
- source_word: וַיְבָרֲכוּ
  choice: bénirent
  rationale: ברך désigne ici l’action de prononcer une bénédiction sur le peuple; le verbe français usuel convient directement.
- source_word: הָעָם
  choice: le peuple
  rationale: « Le peuple » rend le sens courant de עָם sans préciser davantage l’assemblée réunie.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: leur voix fut entendue
  rationale: Cette formulation garde la tournure passive du nifal de שמע et n’ajoute pas explicitement Dieu comme agent, même si le contexte le laisse entendre.
- source_word: תְפִלָּתָם
  choice: leur prière
  rationale: Le substantif singulier muni du suffixe pluriel est rendu collectivement par « leur prière ».
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: jusqu’à sa demeure sainte
  rationale: מָעוֹן désigne une demeure ou un lieu d’habitation; « demeure sainte » préserve l’image spatiale et sacrée.
- source_word: לַשָּׁמָיִם
  choice: jusqu’au ciel
  rationale: La répétition de « jusqu’à » rend la seconde préposition directionnelle et conserve la mise en apposition avec « sa demeure sainte »; le singulier collectif « ciel » est idiomatique en français.
theological_decisions:
- issue: Faut-il nommer Dieu comme celui qui entend la voix ?
  choice: Conserver le passif « leur voix fut entendue ».
  alternative: « Dieu entendit leur voix » ou « leur voix fut entendue par le Seigneur ».
  rationale: L’hébreu emploie une forme passive sans nommer l’agent. Le contexte implique l’écoute divine, mais la traduction ne doit pas rendre explicite ce que la proposition laisse implicite.
- issue: Rapport entre « les prêtres » et « les Lévites »
  choice: 'Lire les deux expressions en apposition : « les prêtres, les Lévites » avec une note explicative.'
  alternative: « les prêtres lévitiques » ou « les prêtres et les Lévites ».
  rationale: L’apposition identifie vraisemblablement les prêtres comme Lévites et évite de créer deux groupes au moyen d’une conjonction absente du texte.
- issue: Rapport entre la demeure sainte et le ciel
  choice: 'Préserver les deux compléments : « jusqu’à sa demeure sainte, jusqu’au ciel ».'
  alternative: « jusqu’à sa demeure sainte dans le ciel ».
  rationale: La traduction retenue maintient le parallélisme directionnel et l’apposition du texte hébreu, sans transformer explicitement le second élément en simple indication de lieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La ponctuation allège la longue coordination hébraïque tout en conservant l’enchaînement des actions et les ambiguïtés importantes.
