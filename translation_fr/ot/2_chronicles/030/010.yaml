  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: fr
  text: Ainsi, les courriers[a] allaient de ville en ville dans le pays d’Éphraïm et de Manassé, jusqu’à Zabulon ; mais on se moquait d’eux et on les raillait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coureurs » ou « messagers ». Le terme hébreu désigne des porteurs officiels d’un message, qui se déplaçaient vraisemblablement avec rapidité.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie deux verbes exprimant le mépris : on se moquait des courriers et on les raillait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: les courriers
  rationale: Le participe substantivé de רוץ (« courir ») désigne ici des porteurs officiels chargés de transmettre rapidement un message. « Courriers » exprime naturellement en français leur fonction et leur déplacement rapide.
- source_word: עֹבְרִים
  choice: allaient
  rationale: Le participe évoque leur progression de lieu en lieu. L’imparfait « allaient » convient au mouvement continu et répété dans ce récit.
- source_word: מֵעִיר לָעִיר
  choice: de ville en ville
  rationale: Cette tournure française restitue directement la valeur distributive de l’expression hébraïque.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: dans le pays d’Éphraïm et de Manassé, jusqu’à Zabulon
  rationale: La formulation conserve l’étendue géographique de l’itinéraire, tandis que « jusqu’à » rend clairement וְעַד.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: on se moquait d’eux
  rationale: Le hiphil de שׂחק exprime ici un rire méprisant dirigé contre les courriers. « Se moquer de » est naturel et conserve cette force.
- source_word: וּמַלְעִגִים בָּם
  choice: on les raillait
  rationale: Le verbe לעג désigne une moquerie dédaigneuse. « Railler » préserve le second terme de mépris sans fusionner les deux verbes hébreux.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: Ainsi, ... mais on ...-ait
  rationale: « Ainsi » assure la continuité narrative, et « mais » rend sensible le contraste contextuel entre la mission des courriers et l’accueil hostile. Les imparfaits préservent l’aspect duratif des participes associés à היה.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend l’action continue ou répétée. Le pronom indéfini « on » évite d’identifier plus précisément que l’hébreu le sujet pluriel qui accueille les courriers avec mépris.
