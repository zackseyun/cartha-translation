  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: fr
  text: Car si vous revenez à Yahweh, vos frères et vos fils[a] trouveront compassion auprès de ceux qui les ont emmenés captifs[b] et reviendront dans ce pays. En effet, Yahweh, votre Dieu, est bienveillant et compatissant ; il ne détournera pas son visage de vous[c], si vous revenez à lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « vos frères et vos fils » ; les termes sont masculins.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « seront objets de compassion devant ceux qui les ont emmenés captifs ».'
    reason: literal_rendering
  - marker: c
    text: 'Littéralement : « il ne détournera pas son visage de vous ».'
    reason: idiom
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: si vous revenez à Yahweh
  rationale: Le verbe שׁוּב exprime ici le retour à la fidélité envers Dieu. « Revenez » conserve à la fois l’idée relationnelle, l’appel à la repentance et la reprise du même verbe à la fin du verset. Dans ce contexte conditionnel, « si » rend naturellement la portée de la construction hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: vos frères et vos fils
  rationale: L’hébreu emploie explicitement deux termes masculins de parenté. La traduction les conserve sans élargir silencieusement « fils » en « enfants ».
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: trouveront compassion auprès de ceux qui les ont emmenés captifs
  rationale: La tournure hébraïque indique qu’ils deviendront objets de compassion devant leurs ravisseurs. Cette formulation française reste naturelle tout en gardant la nuance relationnelle et l’identité précise des personnes concernées.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: et reviendront dans ce pays
  rationale: L’infinitif peut exprimer le résultat ou le but de la compassion reçue. La coordination française préserve cette relation sans préciser une agence que l’hébreu laisse implicite.
- source_word: חַנּוּן וְרַחוּם
  choice: fait grâce et il est plein de compassion
  rationale: « Fait grâce » rend la disposition active exprimée par חַנּוּן, tandis que « plein de compassion » traduit רַחוּם avec une expression française actuelle et digne.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: il ne détournera pas de vous son visage
  rationale: Cette formulation conserve l’image concrète du visage, importante pour la présence et la faveur divines, tout en restant idiomatique en français.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: si vous revenez à lui
  rationale: La répétition de « revenez » reproduit celle de la racine שׁוּב et souligne le mouvement de retour qui encadre le verset.
theological_decisions:
- issue: Portée de שׁוּב comme langage de repentance
  choice: revenez à Yahweh / revenez à lui
  alternative: retournez-vous vers Yahweh / tournez-vous de nouveau vers lui
  rationale: « Revenir » préserve le motif biblique du rétablissement de la relation d’alliance sans introduire un vocabulaire doctrinal absent du texte.
- issue: Lien entre le retour du peuple et la compassion accordée aux captifs
  choice: conserver la relation conditionnelle exprimée par « si » sans en préciser le mécanisme
  alternative: présenter le retour des captifs comme une récompense automatique
  rationale: Le verset relie le retour à Yahweh à la compassion reçue par les captifs, mais n’expose pas une théorie détaillée de causalité ou de mérite. La traduction maintient cette tension.
- issue: Termes familiaux genrés
  choice: vos frères et vos fils
  alternative: vos frères et vos enfants
  rationale: Les formes hébraïques sont masculines. Les conserver évite de neutraliser une précision du texte, tout en signalant cette caractéristique en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la répétition de « revenir », l’image du visage divin et les termes familiaux précis. « Ceux qui les ont emmenés captifs » est préféré au plus ambigu « ravisseurs » afin de rendre clairement le participe hébreu.
