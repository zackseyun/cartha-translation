  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: fr
  text: Ils immolèrent la victime de la Pâque[a] le quatorzième jour du deuxième mois. Les prêtres et les lévites eurent honte, se consacrèrent et apportèrent des holocaustes à la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la Pâque »; ici, le terme désigne l’animal offert pour la Pâque.'
    reason: L’hébreu emploie le nom de la fête par métonymie pour la victime pascale.
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: ils immolèrent
  rationale: Dans ce contexte sacrificiel, « immoler » exprime naturellement la mise à mort rituelle d’un animal, sans réduire l’action à une simple mise à mort profane.
- source_word: הַפֶּסַח
  choice: la victime de la Pâque
  rationale: Le terme désigne ici concrètement l’animal pascal que l’on immole. « Victime de la Pâque » est précis et n’impose pas « agneau », puisque la prescription pouvait aussi concerner un chevreau.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: le quatorzième jour du deuxième mois
  rationale: Formulation calendaire claire et idiomatique en français moderne; « jour » explicite ce qui est sous-entendu dans l’hébreu.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres et les lévites
  rationale: Termes usuels qui maintiennent la distinction entre les deux groupes du personnel cultuel.
- source_word: נִכְלְמוּ
  choice: eurent honte
  rationale: Le niphal de כלם exprime ici la honte éprouvée. Cette traduction directe laisse au contexte le soin d’en indiquer la cause.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: se consacrèrent
  rationale: La forme réfléchie renvoie à la préparation ou purification rituelle nécessaire au service du temple; « se consacrèrent » est digne et courant.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: apportèrent des holocaustes
  rationale: « Holocaustes » est le terme français traditionnel et précis pour les sacrifices entièrement consumés désignés par עֹלוֹת.
- source_word: בֵּית יְהוָה
  choice: à la maison de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque « maison de YHWH » plutôt que de l’interpréter simplement comme « temple ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit la progression narrative de l’hébreu sans lourdeur. « Maison de Yahweh » maintient l’image cultuelle du texte source; « victime de la Pâque » préserve la référence animale sans la limiter indûment à un agneau.
