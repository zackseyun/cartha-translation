  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: fr
  text: Alors les Lévites prirent place avec les instruments de David[a], et les prêtres avec les trompettes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les instruments appartenant à David ». L’expression hébraïque peut désigner des instruments qui lui appartenaient, qu’il avait fait fabriquer ou qui étaient associés à lui.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des trompettes utilisées par les prêtres dans le culte. D’autres passages précisent qu’elles étaient en argent, mais ce détail ne figure pas dans ce verset.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Alors … prirent place
  rationale: Le waw consécutif fait progresser le récit. « Prirent place » rend naturellement עמד dans ce contexte de mise en position pour le service, sans ajouter l’idée qu’ils commencèrent déjà à jouer.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française courante du groupe lévitique, avec maintien de l’article défini.
- source_word: בִּכְלֵי דָוִיד
  choice: avec les instruments de David
  rationale: 'Dans ce contexte musical du temple, כְּלִי désigne des instruments. La construction avec « de David » conserve la latitude du génitif hébreu : appartenance, commande ou association.'
- source_word: וְהַכֹּהֲנִים
  choice: et les prêtres
  rationale: Traduction directe qui maintient la coordination et l’article défini.
- source_word: בַּחֲצֹצְרוֹת
  choice: avec les trompettes
  rationale: חֲצֹצְרוֹת désigne les trompettes cultuelles des prêtres. Le texte ne précisant pas ici qu’elles sont en argent, ce détail n’est pas ajouté au verset.
