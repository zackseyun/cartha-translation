id: 2CH.29.35
reference: 2 Chronicles 29:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: fr
  text: Les holocaustes étaient aussi en grand nombre, avec les graisses des sacrifices de paix[a] et les libations destinées aux holocaustes. Ainsi fut établi le service de la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ».
    reason: Alternative lexicale possible pour שְׁלָמִים, terme qui peut évoquer la paix, l’intégrité et la communion liée au repas sacrificiel.
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Rend la valeur additive de l’expression hébraïque tout en l’intégrant naturellement à la phrase française.
- source_word: עֹלָה
  choice: les holocaustes
  rationale: Bien que le nom hébreu soit au singulier, il a ici un sens collectif, confirmé par לָרֹב; le pluriel français exprime clairement cette valeur.
- source_word: לָרֹב
  choice: en grand nombre
  rationale: Expression française naturelle indiquant la grande quantité des sacrifices.
- source_word: בְּחֶלְבֵי
  choice: avec les graisses
  rationale: Dans le contexte sacrificiel, חֵלֶב désigne les parties grasses offertes sur l’autel; le pluriel hébreu est conservé.
- source_word: הַשְּׁלָמִים
  choice: les sacrifices de paix
  rationale: Conserve la catégorie sacrificielle traditionnelle sans réduire le terme à une seule dimension interprétative; l’alternative « sacrifices de communion » est signalée en note.
- source_word: וּבַנְּסָכִים
  choice: et les libations
  rationale: « Libations » désigne précisément les offrandes liquides versées et appartient au registre cultuel courant en français.
- source_word: לָעֹלָה
  choice: destinées aux holocaustes
  rationale: Exprime clairement le rapport d’association ou de destination marqué par לְ, sans prétendre le définir plus étroitement.
- source_word: וַתִּכּוֹן
  choice: fut établi
  rationale: 'Rend le sens résultatif du verbe כון: le service fut fermement mis en place ou remis en ordre, sans expliciter davantage que l’hébreu l’idée de restauration.'
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: le service de la maison de Yahweh
  rationale: Préserve la chaîne construite hébraïque et le sens cultuel de עֲבוֹדָה, tout en restant intelligible en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: « Sacrifices de paix » maintient une désignation traditionnelle assez large; la note conserve l’autre traduction importante sans imposer une interprétation théologique plus étroite.
- issue: Portée de וַתִּכּוֹן après l’interruption du culte
  choice: fut établi
  alternative: fut rétabli
  rationale: « Fut établi » suit directement le sens résultatif de כון et évite d’ajouter explicitement la notion de restauration, même si le contexte peut la suggérer.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel « holocaustes », « sacrifices de paix » et « libations » est conservé pour sa précision biblique; la syntaxe reste fluide et non archaïsante.
