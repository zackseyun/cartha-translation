source:
  edition: WLC
  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: fr
  text: Ils commencèrent à consacrer le premier jour du premier mois. Le huitième jour du mois, ils arrivèrent au vestibule[a] de Yahweh. Ils consacrèrent alors la maison de Yahweh durant huit jours et, le seizième jour du premier mois, ils terminèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portique » ou « porche ».
    reason: Le terme hébreu אוּלָם désigne le hall ou l’espace couvert à l’avant du Temple; plusieurs équivalents architecturaux français sont possibles.
lexical_decisions:
- source_word: וַיָּחֵלּוּ לְקַדֵּשׁ
  choice: Ils commencèrent à consacrer
  rationale: Reproduit l’expression hébraïque sans ajouter un complément absent du texte. « Consacrer » convient à la mise à part et à la purification rituelle du sanctuaire.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: le premier jour du premier mois
  rationale: Rend en français naturel la formule hébraïque de datation, littéralement « à un du premier mois ».
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: ils arrivèrent au vestibule de Yahweh
  rationale: « Arrivèrent à » conserve la valeur directionnelle de בוא avec ל sans affirmer davantage qu’ils entrèrent dans le sanctuaire. אוּלָם désigne l’espace couvert situé à l’avant du Temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin du texte hébreu au lieu de lui substituer un titre.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’expression hébraïque traditionnelle qui désigne ici le Temple.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: durant huit jours
  rationale: Exprime la durée de cette étape tout en évitant de faire de la préposition une indication trop précise sur la manière de compter les jours.
- source_word: כִּלּוּ
  choice: ils terminèrent
  rationale: Rend simplement le piel de כלה, « achever, terminer », dans le déroulement narratif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Nature de la consécration du sanctuaire
  choice: consacrer
  alternative: purifier / sanctifier
  rationale: Le verbe קדשׁ met l’accent sur la mise à part pour un usage saint; le contexte comprend une purification rituelle, mais traduire uniquement par « purifier » réduirait son champ de sens.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsmes lexicaux. La répétition de « Yahweh » et de « premier mois » suit la structure du texte hébreu.
