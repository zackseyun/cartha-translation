source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: fr
  text: Il plaça les Lévites dans la maison de Yahweh, avec des cymbales, des harpes[a] et des lyres, conformément à l’ordre de David, de Gad, le voyant du roi[b], et du prophète Nathan. En effet, cet ordre venait de Yahweh par l’intermédiaire de ses prophètes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots hébreux rendus par « harpes » et « lyres » désignent deux instruments à cordes distincts, mais leur identification exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le titre « voyant » traduit un mot hébreu distinct de celui qui est rendu par « prophète », bien que les deux fonctions soient étroitement apparentées.
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « car l’ordre était par la main de Yahweh, par la main de ses prophètes ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il plaça
  rationale: Le hifil de עמד exprime ici le fait de faire prendre place aux Lévites pour leur service. « Il plaça » est naturel en français et convient au contexte d’une disposition liturgique officielle.
- source_word: בֵּית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Cette traduction conserve l’image hébraïque de la « maison » plutôt que de la remplacer par « temple », tout en rendant le nom divin יְהוָה par « Yahweh ».
- source_word: בִּמְצִלְתַּיִם
  choice: avec des cymbales
  rationale: Le beth a une valeur instrumentale et מְצִלְתַּיִם désigne couramment des cymbales.
- source_word: בִּנְבָלִים
  choice: des harpes
  rationale: נבל désigne un instrument à cordes dont l’identification exacte reste incertaine. « Harpes » est une désignation traditionnelle et compréhensible, sans prétendre à une équivalence organologique exacte.
- source_word: וּבְכִנֹּרוֹת
  choice: et des lyres
  rationale: כִּנּוֹר est généralement identifié à une lyre. Un terme distinct de « harpes » préserve la distinction entre les deux instruments hébreux.
- source_word: בְּמִצְוַת דָּוִיד
  choice: conformément à l’ordre de David
  rationale: La préposition indique la conformité à une directive faisant autorité. Le singulier « ordre » correspond à מִצְוַת.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: Gad, le voyant du roi
  rationale: « Voyant » rend חֹזֶה et maintient sa distinction lexicale avec נָבִיא, « prophète ». Le complément « du roi » reflète la relation construite en hébreu.
- source_word: נָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: Cette formulation appositionnelle est idiomatique en français et rend directement le titre נָבִיא.
- source_word: כִּי
  choice: En effet
  rationale: כִּי introduit ici l’explication qui fonde l’autorité de l’ordre attribué à David, Gad et Nathan.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: venait de Yahweh par l’intermédiaire de ses prophètes
  rationale: La formulation française exprime à la fois la source divine et la médiation prophétique indiquées par la répétition de בְיַד, tout en évitant le calque peu naturel « par la main de ».
theological_decisions:
- issue: Rapport entre l’ordre liturgique davidique et l’autorité divine
  choice: L’ordre est attribué à David, Gad et Nathan, mais présenté comme venant ultimement de Yahweh par la médiation de ses prophètes.
  alternative: Comprendre cet ordre comme une simple politique royale de David à laquelle une autorité divine aurait été ajoutée ultérieurement.
  rationale: La proposition כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו rattache explicitement l’ordre à Yahweh tout en indiquant sa transmission par les prophètes. La traduction conserve ces deux niveaux d’action sans les confondre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de la phrase reste proche de l’hébreu, tandis que « par l’intermédiaire de » rend naturellement l’idiome de la « main ». Les titres « voyant » et « prophète » demeurent distincts, et l’incertitude concernant les instruments anciens est signalée en note.
