source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: fr
  text: Car nos ancêtres ont été infidèles[a] et ont fait ce qui est mal aux yeux de Yahweh, notre Dieu. Ils l’ont abandonné, ont détourné leur visage de la demeure de Yahweh[b] et ont tourné le dos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont commis une infidélité » ou « ont agi avec perfidie ». Le verbe hébreu évoque une rupture de fidélité, souvent envers Dieu dans le cadre de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de l’habitation de Yahweh ». Le mot hébreu peut aussi désigner le tabernacle, mais il renvoie ici au temple considéré comme la demeure de Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ont donné la nuque ». Cette expression évoque un refus délibéré ou un rejet.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: ont été infidèles
  rationale: Le verbe מעל exprime une rupture de fidélité, souvent dans un cadre d’alliance ou de culte. « Ont été infidèles » en restitue clairement la portée morale et religieuse en français actuel.
- source_word: אֲבֹתֵינוּ
  choice: nos ancêtres
  rationale: Dans ce rappel historique, אבות désigne les générations antérieures. « Nos ancêtres » est plus naturel et moins susceptible d’être compris comme une référence aux seuls pères immédiats.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: Avec עשה, l’expression signifie idiomatiquement « faire ce qui est mal » et formule l’évaluation morale sans l’atténuer.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation française conserve la métaphore hébraïque courante tout en restant immédiatement compréhensible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּעַזְבֻהוּ
  choice: Ils l’ont abandonné
  rationale: עזב indique ici l’abandon relationnel et religieux de Dieu. « Abandonner » conserve cette force en français moderne.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: ont détourné leur visage
  rationale: La traduction préserve l’image concrète du visage délibérément détourné, signe de rejet.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: de la demeure de Yahweh
  rationale: מִשְׁכָּן désigne littéralement un lieu d’habitation. Dans ce contexte lié au temple, « demeure » évite de faire croire qu’il s’agit nécessairement du tabernacle du désert.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: lui ont tourné le dos
  rationale: Littéralement, l’hébreu évoque le fait de « donner la nuque ». L’expression française « tourner le dos » rend naturellement l’idée de refus et de rejet tout en conservant l’image corporelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » le représente directement, sans le remplacer par un titre.
- issue: Sens cultuel de מִשְׁכָּן dans le contexte du temple
  choice: la demeure de Yahweh
  alternative: le tabernacle de Yahweh / le sanctuaire de Yahweh
  rationale: « Demeure » conserve le sens lexical et théologique du lieu où Yahweh habite, sans identifier à tort l’édifice au tabernacle mosaïque ni remplacer le terme par un autre mot cultuel.
translation_notes:
  register: Français international actuel, clair et digne. La formulation conserve les images parallèles du visage détourné et du dos tourné, tout en rendant l’idiome final de manière naturelle.
