source:
  edition: WLC
  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: fr
  text: Le nombre des holocaustes apportés par l’assemblée fut de soixante-dix bovins, cent béliers et deux cents agneaux. Tous furent offerts en holocauste à l’Éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: holocaustes / en holocauste
  rationale: Dans le vocabulaire sacrificiel biblique français, « holocauste » désigne précisément l’offrande entièrement consumée et conserve ici la répétition hébraïque sous une forme naturelle.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: Rend le groupe réuni pour le culte sans lui attribuer une structure institutionnelle plus précise que ne le fait l’hébreu.
- source_word: בָּקָר
  choice: bovins
  rationale: Le nom collectif désigne le gros bétail et ne précise pas le sexe; « bovins » préserve cette portée, contrairement à « taureaux ».
- source_word: אֵילִים
  choice: béliers
  rationale: Équivalent précis du terme hébreu désignant des moutons mâles adultes.
- source_word: כְּבָשִׂים
  choice: agneaux
  rationale: Équivalent sacrificiel courant et naturel pour le terme hébreu.
- source_word: יהוה
  choice: l’Éternel
  rationale: Suit la convention française traditionnelle qui signale le nom divin YHWH par « l’Éternel » plutôt que de le confondre avec le titre « Seigneur ».
theological_decisions:
- issue: Nature des soixante-dix animaux
  choice: bovins
  alternative: taureaux
  rationale: Le texte porte le collectif בָּקָר, qui ne spécifie pas ici le sexe; la traduction ne doit donc pas ajouter cette précision.
- issue: Rendu du tétragramme
  choice: l’Éternel
  alternative: YHWH / Yahvé / le Seigneur
  rationale: « L’Éternel » est une convention française digne et largement intelligible qui distingue le nom divin du titre אֲדֹנָי, sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La seconde phrase évite une construction lourde tout en gardant la valeur récapitulative de כָּל אֵלֶּה. Aucun marqueur de note n’est requis.
