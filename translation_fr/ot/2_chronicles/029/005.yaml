  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: fr
  text: 'Il leur dit : « Écoutez-moi, Lévites ! Maintenant, consacrez-vous et consacrez la maison de Yahweh, le Dieu de vos pères. Enlevez l’impureté[a] du lieu saint[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la souillure » ou « les immondices » ; le terme hébreu désigne ce qui rend le sanctuaire impur.'
    reason: Alternative lexicale préservant l’étendue sémantique de הַנִּדָּה.
  - marker: b
    text: 'Ou : « du sanctuaire ».'
    reason: Autre rendu possible de מִן הַקֹּדֶשׁ dans ce contexte cultuel.
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Écoutez-moi
  rationale: L’impératif de שׁמע avec suffixe de première personne appelle non seulement à entendre, mais à prêter attention ; « Écoutez-moi » est direct et naturel en français moderne.
- source_word: הַלְוִיִּם
  choice: Lévites
  rationale: Il s’agit d’une apostrophe directe adressée aux membres de la tribu chargés du service cultuel.
- source_word: עַתָּה
  choice: Maintenant
  rationale: L’adverbe marque le moment présent et renforce l’appel à agir sans qu’il soit nécessaire d’ajouter explicitement « immédiatement ».
- source_word: הִתְקַדְּשׁוּ
  choice: consacrez-vous
  rationale: La forme hitpael a un sens réfléchi et, dans ce contexte cultuel, désigne la préparation des Lévites pour le service sacré.
- source_word: וְקַדְּשׁוּ
  choice: et consacrez
  rationale: La reprise de « consacrer » conserve le parallélisme fondé sur la même racine hébraïque קדשׁ.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » reproduit l’expression hébraïque sans la remplacer par l’interprétation plus explicite « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Cette formulation conserve l’expression historique et d’alliance du texte hébreu.
- source_word: וְהוֹצִיאוּ
  choice: Enlevez
  rationale: Le hiphil de יצא exprime ici l’action de faire sortir, donc d’ôter du lieu saint ce qui le rend impur ; « Enlevez » est idiomatique et précis.
- source_word: הַנִּדָּה
  choice: l’impureté
  rationale: Le terme désigne ici ce qui provoque une souillure cultuelle dans le temple ; « impureté » en conserve la portée sans supposer uniquement des déchets matériels.
- source_word: מִן הַקֹּדֶשׁ
  choice: du lieu saint
  rationale: קֹדֶשׁ désigne ici l’espace sacré. « Lieu saint » reste proche du lexique de la sainteté, tandis que « sanctuaire » demeure une traduction possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin ; « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Nature de הַנִּדָּה dans le temple
  choice: l’impureté
  alternative: la souillure / les immondices
  rationale: Le mot peut viser l’état ou la chose qui souille. « Impureté » préserve cette amplitude cultuelle sans décider s’il s’agit exclusivement d’objets sales ou idolâtres.
translation_notes:
  register: Français international moderne, direct et digne. L’apostrophe « Lévites ! » restitue la vigueur de l’ordre. La répétition de « consacrez » conserve le jeu sur la racine קדשׁ, et « maison de Yahweh » maintient l’image hébraïque sans explicitation inutile.
