  naturalness: Le français est moderne, clair et d’un registre approprié. « Enlevez l’impureté du lieu saint » est naturel et fidèle au mouvement de retrait exprimé par le verbe hébreu.
  terminology: « Lévites », « consacrez », « Yahweh », « Dieu de vos pères » et « lieu saint » sont cohérents avec le texte source et le registre cultuel. Les notes doivent toutefois être rattachées aux mots qu’elles expliquent.
