source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: fr
  text: Mes fils, maintenant, ne soyez pas négligents[a], car Yahweh vous a choisis pour vous tenir devant lui[b], pour le servir, pour être à son service et brûler de l’encens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne vous relâchez pas » ou « ne soyez pas insouciants ».'
    reason: lexical_alternative
  - marker: b
    text: « Se tenir devant lui » est ici une expression liée au service accompli dans la présence de Dieu.
    reason: cultural_note
  - marker: c
    text: 'On pourrait aussi traduire : « offrir de l’encens ». Le verbe hébreu évoque ce que l’on fait monter en fumée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Mes fils
  rationale: Le vocatif hébreu désigne littéralement les « fils » et convient à l’adresse faite ici aux hommes chargés du service du temple.
- source_word: עַתָּה אַל תִּשָּׁלוּ
  choice: maintenant, ne vous montrez pas négligents
  rationale: L’expression exhorte les destinataires à ne pas se relâcher ni manquer à leurs devoirs. Cette formulation garde la portée pratique de l’avertissement dans un français naturel.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: Yahweh vous a choisis
  rationale: Le complément placé en tête en hébreu souligne que ce sont eux que Yahweh a choisis. Le passé composé convient au résultat présent de ce choix.
- source_word: לַעֲמֹד לְפָנָיו
  choice: pour vous tenir devant lui
  rationale: La traduction conserve l’image hébraïque, qui désigne ici le fait de prendre place en présence de Dieu pour accomplir un service cultuel.
- source_word: לְשָׁרְתוֹ
  choice: pour le servir
  rationale: Le verbe שׁרת désigne le service accompli auprès d’un supérieur et prend ici un sens cultuel ou sacerdotal.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: pour être à son service et faire brûler de l’encens
  rationale: Cette formulation française exprime naturellement les deux fonctions coordonnées tout en gardant la répétition de l’idée de service et l’activité cultuelle liée à l’encens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le caractère personnel du nom sans lui substituer un titre.
- issue: Portée de l’expression לַעֲמֹד לְפָנָיו
  choice: Conserver « vous tenir devant lui » et expliquer sa portée cultuelle en note
  alternative: vous présenter devant lui pour le servir
  rationale: L’image peut exprimer à la fois la présence devant Dieu et la fonction cultuelle. La conserver évite de réduire silencieusement sa portée.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition de l’idée de service reflète celle de la racine שׁרת dans le texte hébreu, tandis que « être à son service » évite le sens politique moderne que pourrait suggérer « être ses ministres ».
