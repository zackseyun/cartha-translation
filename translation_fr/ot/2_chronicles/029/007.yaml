id: 2CH.29.7
reference: 2 Chronicles 29:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: fr
  text: Ils fermèrent aussi les portes du vestibule[a], éteignirent les lampes, ne firent pas brûler d’encens et n’offrirent aucun holocauste dans le sanctuaire[b] au Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du portique » ou « du hall d’entrée » ; le mot hébreu désigne le hall situé à l’entrée du Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le lieu saint » ; le terme hébreu peut désigner l’espace sacré du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Le terme ajoute ces manquements à ceux qui viennent d’être énumérés et conserve la progression cumulative du discours.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: les portes du vestibule
  rationale: אוּלָם désigne le hall d’entrée du Temple. « Vestibule » est précis et compréhensible, tandis qu’une note signale d’autres rendus possibles.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: éteignirent les lampes
  rationale: Le verbe exprime concrètement l’extinction des lampes cultuelles; cette formulation française est naturelle et fidèle.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: ne firent pas brûler d’encens
  rationale: Le hiphil de קטר avec קְטֹרֶת désigne l’action rituelle de faire brûler l’encens; ce rendu conserve à la fois le geste concret et sa fonction cultuelle.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: n’offrirent aucun holocauste
  rationale: עֹלָה est le terme technique désignant une offrande entièrement consumée. « Aucun » rend naturellement en français la négation portant sur le nom singulier collectif ou indéfini.
- source_word: בַקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Le terme désigne ici l’espace sacré du Temple sans permettre de préciser avec certitude une subdivision architecturale particulière.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: au Dieu d’Israël
  rationale: La préposition ל marque le destinataire et l’orientation cultuelle de l’offrande; « au Dieu d’Israël » l’exprime directement.
theological_decisions:
- issue: Terminologie du culte du Temple
  choice: Conserver les termes concrets « encens », « holocauste » et « sanctuaire ».
  alternative: Généraliser en parlant simplement de culte ou d’offrandes.
  rationale: Le verset énumère des négligences précises du service du Temple. La terminologie cultuelle préserve cette portée historique et théologique sans l’élargir à une accusation générale.
- issue: Portée de בַקֹּדֶשׁ
  choice: Traduire par « dans le sanctuaire » sans identifier plus précisément l’espace.
  alternative: Traduire par « dans le lieu saint », ce qui pourrait suggérer une subdivision technique déterminée du Temple.
  rationale: L’hébreu désigne l’espace sacré, mais le contexte immédiat ne contraint pas suffisamment une localisation architecturale plus étroite; la note conserve l’autre possibilité.
translation_notes:
  register: Français international actuel, sobre et digne. La phrase conserve l’accumulation des manquements cultuels tout en évitant une syntaxe artificiellement calquée sur l’hébreu. « Holocauste » est maintenu comme terme biblique technique, et les notes explicitent les ambiguïtés architecturales réelles.
