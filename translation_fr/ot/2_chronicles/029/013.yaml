  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: fr
  text: et parmi les fils[a] d’Élitsaphân, Shimri et Yeouel[b] ; et parmi les fils d’Asaph, Zacharie et Mattania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « fils de » peut désigner plus largement les descendants ou les membres d’une lignée, et non seulement les fils directs.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte ici la forme « Yeouel » ; un nom semblable est écrit « Jeïel » ailleurs.
    reason: textual_name_clarification
lexical_decisions:
- source_word: וּ/מִן
  choice: et, parmi
  rationale: Le waw maintient le lien avec la liste précédente, tandis que מִן introduit les représentants issus de chaque groupe familial ; « parmi » est naturel en français.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Cette formulation conserve l’expression généalogique hébraïque, qui peut aussi désigner des descendants ou les membres d’une lignée.
- source_word: אֱלִיצָפָן
  choice: Élisaphân
  rationale: Transcription française usuelle du nom hébreu, avec indication de la voyelle longue finale.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: Transcription directe et lisible du nom propre hébreu.
- source_word: ו/יעואל
  choice: et Yeouel
  rationale: La forme consonantique du texte fourni, יעואל, soutient Yeouel plutôt que Jeïel ; la conjonction est conservée.
- source_word: וּ/מִן בְּנֵי אָסָף
  choice: parmi les fils d’Asaph
  rationale: La reprise de « parmi » rend le parallélisme de la liste ; le second « et » peut être omis en français après le point-virgule sans effacer la structure.
- source_word: זְכַרְיָהוּ
  choice: Zacharie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: וּ/מַתַּנְיָהוּ
  choice: et Mattania
  rationale: Transcription française courante du nom, avec maintien de la conjonction hébraïque.
