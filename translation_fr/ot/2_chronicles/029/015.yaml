source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: fr
  text: Ils rassemblèrent leurs frères, se consacrèrent et vinrent, sur l’ordre du roi et conformément aux paroles de Yahvé[a], afin de purifier la maison de Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon l’ordre du roi, par/dans les paroles de Yahvé ». Le rapport exact entre l’ordre du roi et les paroles de Yahvé peut se comprendre de plusieurs manières.'
    reason: ambiguïté syntaxique et prépositionnelle
  - marker: b
    text: C’est-à-dire le temple.
    reason: explicitation du référent
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת אֲחֵיהֶם
  choice: Ils rassemblèrent leurs frères
  rationale: « Rassemblèrent » rend directement אסף, et « leurs frères » conserve le terme de parenté masculin employé dans le texte, qui désigne ici les autres lévites.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: se consacrèrent
  rationale: La forme réfléchie exprime leur préparation rituelle personnelle au service sacré; « se consacrèrent » est naturel et précis en français actuel.
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le verbe signifie simplement « venir »; la traduction n’ajoute pas un lieu ou une entrée que cette forme verbale n’explicite pas.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: sur l’ordre du roi
  rationale: Cette formulation française idiomatique exprime qu’ils agissent conformément au commandement royal.
- source_word: בְּדִבְרֵי יְהוָה
  choice: conformément aux paroles de Yahvé
  rationale: La traduction conserve le pluriel « paroles » et présente les paroles divines comme la norme à laquelle l’ordre royal se conforme, tout en signalant en note l’ambiguïté du lien syntaxique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente le nom divin plutôt que de le remplacer par un titre.
- source_word: לְטַהֵר
  choice: afin de purifier
  rationale: Dans ce contexte cultuel, טהר désigne la purification rituelle du sanctuaire; « purifier » convient mieux que le sens seulement matériel de « nettoyer ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction garde l’expression hébraïque « maison de Yahvé » plutôt que de l’expliciter directement par « temple ».
theological_decisions:
- issue: Rapport entre l’ordre royal et les paroles de Yahvé
  choice: sur l’ordre du roi et conformément aux paroles de Yahvé
  alternative: selon l’ordre du roi, par les paroles de Yahvé
  rationale: La préposition ב permet plusieurs nuances, et la syntaxe peut rattacher les paroles divines à l’ordre royal ou à l’action des lévites. Le texte principal donne une formulation française claire sans présenter l’ordre du roi comme indépendant de la parole divine; la note conserve l’ambiguïté.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Le conserver évite de le remplacer par un titre et maintient sa fonction dans le passage.
- issue: Terme masculin אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs compagnons lévites
  rationale: Le contexte concerne des hommes lévites et l’hébreu emploie explicitement le terme masculin de parenté; la traduction en préserve la forme sans ajouter « lévites » au texte principal.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé simple convient au registre narratif biblique écrit. La formulation conserve les termes concrets « frères » et « maison », tout en explicitant seulement en note leur portée contextuelle.
