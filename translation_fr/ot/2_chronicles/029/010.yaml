id: 2CH.29.10
reference: 2 Chronicles 29:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: fr
  text: Maintenant, j’ai à cœur de conclure une alliance avec Yahweh, le Dieu d’Israël, afin que son ardente colère se détourne de nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: L’adverbe marque l’actualité et l’immédiateté de la résolution d’Ézéchias.
- source_word: עִם לְבָבִי
  choice: j’ai à cœur
  rationale: Cette tournure française naturelle conserve l’image du cœur tout en exprimant clairement une intention résolue.
- source_word: לִכְרֹת בְּרִית
  choice: conclure une alliance
  rationale: « Conclure une alliance » est l’expression française idiomatique correspondant à l’hébreu littéral « couper une alliance ».
- source_word: לַיהוָה
  choice: avec Yahweh
  rationale: La préposition « avec » désigne naturellement en français le partenaire de l’alliance; le nom divin est translittéré Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement le titre construit qui identifie le Dieu avec qui l’alliance doit être conclue.
- source_word: וְיָשֹׁב
  choice: afin que … se détourne
  rationale: Dans le contexte, la coordination exprime le résultat recherché ou le but de la démarche d’Ézéchias, sans garantir explicitement son accomplissement.
- source_word: מִמֶּנּוּ
  choice: de nous
  rationale: Rend directement le suffixe pronominal de première personne du pluriel.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: Cette expression française conserve l’intensité et la métaphore de chaleur présentes dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve ici le nom personnel et d’alliance plutôt que de le remplacer par un titre.
- issue: Valeur de וְיָשֹׁב après la résolution de conclure l’alliance
  choice: afin que … se détourne
  alternative: et elle se détournera; pour qu’il détourne
  rationale: La formulation retenue exprime la finalité espérée sans transformer la proposition en promesse certaine ni faire de Yahweh, plutôt que de sa colère, le sujet explicite en français.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « j’ai à cœur » garde l’image hébraïque sans raideur; « conclure une alliance » évite le calque non idiomatique « couper une alliance ». Aucun appel de note n’est nécessaire, puisque le calque littéral apporterait peu au lecteur français dans ce verset.
