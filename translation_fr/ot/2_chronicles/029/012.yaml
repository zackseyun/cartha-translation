source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: fr
  text: 'Alors les Lévites se levèrent : Mahath, fils d’Amasaï, et Joël, fils d’Azaria[a], parmi les descendants de Qehath ; parmi les descendants de Merari, Qish, fils d’Abdi, et Azaria, fils de Yehalléléel ; et parmi les Guershonites[b], Joah, fils de Zimma, et Éden, fils de Joah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « parmi les fils du Qehatite […] parmi les fils de Merari ». Cette formulation généalogique présente les hommes nommés comme membres de ces clans lévitiques.
    reason: cultural_note
  - marker: b
    text: Ou « parmi les descendants de Guershon ». Ici, l’hébreu emploie un nom de clan plutôt que de reprendre exactement la formule précédente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le verbe קום marque ici le commencement de l’action en réponse à l’ordre royal. « Se levèrent » en conserve le sens formel et narratif sans ajouter explicitement « se mirent à l’œuvre ».
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation française courante du groupe lévitique ; l’article défini de l’hébreu est conservé.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: parmi les descendants de Qehath
  rationale: Cette formulation française naturelle restitue l’expression généalogique et indique que les hommes nommés appartiennent au clan qehatite.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: parmi les descendants de Merari
  rationale: Le parallélisme avec le groupe précédent est maintenu, tout en rendant naturellement l’appartenance au clan de Merari.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: et parmi les Guershonites
  rationale: Le gentilé hébreu singulier avec article a une valeur collective ; « les Guershonites » exprime clairement le clan en français.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette liste généalogique, le sens direct « fils de » convient et rien dans le contexte n’impose de l’élargir à « descendant de ».
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Mahath ; Amasaï ; Joël ; Azaria ; Qish ; Abdi ; Yehalléléel ; Joah ; Zimma ; Éden
  rationale: Les noms propres sont translittérés selon des formes françaises lisibles, avec les accents nécessaires à leur prononciation en français.
theological_decisions: []
