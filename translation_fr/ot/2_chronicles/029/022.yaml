base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: fr
  text: Ils égorgèrent les bovins[a] ; les prêtres recueillirent le sang et le projetèrent contre l’autel[b]. Ils égorgèrent les béliers et projetèrent le sang contre l’autel. Ils égorgèrent les agneaux et projetèrent le sang contre l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est collectif et désigne des bovins ; certaines traductions précisent « taureaux » en raison du contexte sacrificiel.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « répandirent le sang sur l’autel » ou « lancèrent le sang contre l’autel ». Le verbe hébreu évoque une application rituelle énergique du sang, et non une légère aspersion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: ils égorgèrent
  rationale: Dans un contexte sacrificiel, שׁחט désigne l’abattage rituel par égorgement. « Égorgèrent » exprime ce geste plus précisément que le général « tuèrent ».
- source_word: הַבָּקָר
  choice: les bovins
  rationale: בקר est un collectif désignant le gros bétail bovin sans préciser ici le sexe des animaux. « Bovins » conserve cette portée.
- source_word: וַיְקַבְּלוּ
  choice: recueillirent
  rationale: קבל signifie littéralement « recevoir ». Dans cette procédure sacrificielle, les prêtres reçoivent le sang qui s’écoule afin de l’appliquer à l’autel ; « recueillirent » rend naturellement ce geste en français.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et exact de כהנים.
- source_word: הַדָּם
  choice: le sang
  rationale: Traduction directe du terme sacrificiel דם.
- source_word: וַיִּזְרְקוּ
  choice: projetèrent
  rationale: Dans les rites sacrificiels, זרק désigne une application énergique du sang par projection, et non une légère aspersion. « Projetèrent » préserve la force du geste sans préciser davantage que l’hébreu sa technique exacte.
- source_word: הַמִּזְבֵּחָה
  choice: contre l’autel
  rationale: La terminaison directive exprime un mouvement vers l’autel ; dans ce rite, le sang atteint sa surface. « Contre l’autel » rend à la fois la direction et l’application physique.
- source_word: הָאֵלִים
  choice: les béliers
  rationale: אילים désigne précisément des béliers.
- source_word: הַכְּבָשִׂים
  choice: les agneaux
  rationale: כבשים désigne couramment des agneaux ou de jeunes moutons dans les listes sacrificielles ; « agneaux » convient ici.
