id: 2CH.29.19
reference: 2 Chronicles 29:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: fr
  text: Tous les objets que le roi Ahaz avait rejetés[a] pendant son règne, dans son infidélité[b], nous les avons préparés et consacrés ; les voici devant l’autel de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait mis de côté » ou « avait délaissés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa faute » ou « lorsqu’il s’est montré infidèle ». L’hébreu souligne une rupture de fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: les objets
  rationale: Dans le contexte du temple, כֵּלִים désigne les divers objets ou ustensiles du culte. « Objets » reste naturel et suffisamment large sans préciser davantage que l’hébreu.
- source_word: הִזְנִיחַ
  choice: avait rejetés
  rationale: Le verbe exprime ici l’action de mettre de côté ou de traiter comme abandonnés. « Avait rejetés » rend cette action plus nettement que le simple « avait négligés ».
- source_word: בְּמַלְכוּתוֹ
  choice: pendant son règne
  rationale: La préposition a ici une valeur temporelle ; cette formulation est idiomatique en français moderne.
- source_word: בְּמַעֲלוֹ
  choice: dans son infidélité
  rationale: מַעַל évoque une rupture de fidélité, particulièrement dans le domaine religieux. « Infidélité » conserve cette portée morale et cultuelle.
- source_word: הֵכַנּוּ
  choice: nous les avons préparés
  rationale: Le hiphil de כון signifie rendre prêt ou préparer. La reprise pronominale est nécessaire pour une syntaxe française naturelle.
- source_word: וְהִקְדָּשְׁנוּ
  choice: et consacrés
  rationale: Le hiphil de קדשׁ signifie mettre à part comme saint ; « consacrés » convient au contexte du temple.
- source_word: וְהִנָּם
  choice: les voici
  rationale: « Les voici » restitue de façon concise et naturelle la force présentative de הִנָּם.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: devant l’autel de Yahweh
  rationale: לִפְנֵי indique ici la position devant l’autel, et le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de מַעַל appliqué à Ahaz
  choice: infidélité
  alternative: faute
  rationale: « Infidélité » garde l’idée d’une rupture de fidélité envers Dieu, sans préciser au-delà de ce que dit le texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure du témoignage des prêtres tout en employant la tournure présentative naturelle « les voici ».
