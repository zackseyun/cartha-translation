  source_fidelity: 'Le texte rend correctement l’ensemble des éléments hébreux : « objets » conserve l’extension de כֵּלִים dans ce contexte cultuel ; « avait rejetés » exprime l’abandon actif de הִזְנִיחַ ; les deux compléments « pendant son règne » et « dans son infidélité » correspondent à בְּמַלְכוּתוֹ et בְּמַעֲלוֹ. « Nous les avons préparés et consacrés » reproduit fidèlement les deux verbes à la première personne du pluriel. « Les voici devant l’autel de Yahweh » rend naturellement la présentation emphatique וְהִנָּם et la localisation לִפְנֵי.'
