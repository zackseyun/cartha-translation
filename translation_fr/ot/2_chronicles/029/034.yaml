source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: fr
  text: Mais les prêtres étaient trop peu nombreux et ne pouvaient pas dépouiller toutes les offrandes entièrement brûlées. Leurs frères, les lévites, leur prêtèrent donc main-forte[a] jusqu’à l’achèvement du travail et jusqu’à ce que les prêtres se soient consacrés. En effet, les lévites avaient plus de droiture de cœur[b] que les prêtres pour se consacrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fortifièrent » ou « les rendirent forts ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « avaient le cœur plus droit ». L’hébreu souligne la sincérité ou la rectitude intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Mais
  rationale: La particule introduit ici une restriction à valeur contrastive. « Mais » rend naturellement en français la difficulté qui limite l’action décrite dans le contexte.
- source_word: לִמְעָט
  choice: trop peu nombreux
  rationale: Avec le verbe « être », l’expression indique une insuffisance numérique, et non un simple petit nombre.
- source_word: לְהַפְשִׁיט
  choice: dépouiller
  rationale: Dans le contexte sacrificiel, le verbe désigne l’action d’enlever la peau des animaux. « Dépouiller » est précis et idiomatique dans ce registre.
- source_word: הָעֹלוֹת
  choice: les offrandes entièrement brûlées
  rationale: Cette formulation explicite la nature de l’offrande consumée tout entière et évite l’ambiguïté moderne du mot « holocauste ».
- source_word: וַיְחַזְּקוּם
  choice: leur prêtèrent main-forte
  rationale: Le sens littéral est « les fortifièrent », mais, dans ce contexte de travail concret, le verbe exprime une aide active. La note conserve le sens littéral.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le terme familial est maintenu; il désigne ici les lévites comme frères et compagnons de service des prêtres.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: jusqu’à l’achèvement du travail
  rationale: La construction marque la durée jusqu’à la complète réalisation de la tâche.
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: se soient consacrés / se consacrer
  rationale: Dans ce cadre cultuel, la forme réfléchie désigne la préparation ou consécration rituelle en vue du service sacré.
- source_word: יִשְׁרֵי לֵבָב
  choice: plus de droiture de cœur
  rationale: Cette expression préserve l’accent hébreu sur la rectitude ou la sincérité intérieure, ainsi que la force comparative de la phrase.
theological_decisions:
- issue: Nature de la comparaison entre les lévites et les prêtres
  choice: Les lévites ont manifesté davantage de droiture intérieure que les prêtres dans leur consécration.
  alternative: Les lévites ont été plus empressés ou mieux préparés que les prêtres pour se consacrer.
  rationale: L’expression hébraïque יִשְׁרֵי לֵבָב porte directement sur la droiture du cœur. La traduction maintient cette tension sans étendre le reproche au-delà de la situation précise évoquée.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel reste compréhensible sans employer « holocauste », devenu fortement ambigu en français contemporain. La comparaison délicate entre lévites et prêtres est conservée sans l’atténuer ni la généraliser.
