review_pass:
  verdict: revise
  source_fidelity: Le sens directeur de וַיֹּאמֶר ... לְהַעֲלוֹת est bien rendu par un ordre d’offrir l’holocauste. La répétition de הֵחֵל est conservée. La construction שִׁיר יְהוָה demeure volontairement non résolue dans le texte, et le nom divin est correctement rendu par « Yahweh ».
  naturalness: '« L’holocauste commença » est un calque peu idiomatique en français : c’est l’accomplissement de l’offrande qui commence. De même, « avec les trompettes et au moyen des instruments » coordonne de façon inégale deux compléments instrumentaux. Une légère reformulation rend la phrase naturelle sans modifier son sens.'
  terminology: « Holocauste », « autel », « trompettes », « instruments de David » et « roi d’Israël » conviennent au registre biblique moderne. La note est correctement ancrée sur « Yahweh » et présente l’alternative directionnelle sans la privilégier dans le texte.
  issues:
  - severity: medium
    issue: Formulation « Au moment où l’holocauste commença »
    rationale: Le substantif désigne le sacrifice, mais le français moderne ne dit pas naturellement qu’un holocauste « commence ». « Quand on commença à offrir l’holocauste » exprime le même événement cultuel et conserve la répétition de « commença ».
  - severity: low
    issue: Coordination instrumentale hétérogène
    rationale: « Avec les trompettes et au moyen des instruments » associe deux constructions différentes pour des éléments parallèles. « Avec les trompettes et les instruments » est plus fluide tout en gardant l’ellipse instrumentale du texte hébreu.
  revised_text: Alors Ézéchias ordonna qu’on offre l’holocauste sur l’autel. Au moment où l’on commença à offrir l’holocauste, le chant de Yahweh[a] commença lui aussi, avec les trompettes et les instruments de David, roi d’Israël.
  revised_footnotes:
