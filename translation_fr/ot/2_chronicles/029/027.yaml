revisions:
- from: Alors Ézéchias ordonna d’offrir l’holocauste sur l’autel. Au moment où l’holocauste commença, le chant de Yahweh[a] commença lui aussi, avec les trompettes et au moyen des instruments de David, roi d’Israël.
  to: Alors Ézéchias ordonna qu’on offre l’holocauste sur l’autel. Au moment où l’on commença à offrir l’holocauste, le chant de Yahweh[a] commença lui aussi, avec les trompettes et les instruments de David, roi d’Israël.
  rationale: La révision élimine un calque français tout en préservant la simultanéité et la répétition rhétorique du verbe « commencer ». Elle clarifie aussi la coordination des moyens musicaux sans ajouter de précision historique ou théologique.
