  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: fr
  text: Alors Ézéchias ordonna qu’on offre l’holocauste sur l’autel. Au moment où l’on commença à offrir l’holocauste, le chant de Yahweh[a] commença lui aussi, avec les trompettes et les instruments de David, roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le chant adressé à Yahweh ». L’hébreu dit littéralement « le chant de Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: ordonna d’offrir
  rationale: Le verbe אמר signifie normalement « dire », mais suivi ici de l’infinitif introduit par ל dans un contexte royal, l’ensemble exprime une directive. « Ordonna d’offrir » rend naturellement cette force sans introduire un agent absent de l’hébreu.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Terme français biblique établi pour עֹלָה, le sacrifice entièrement consumé sur l’autel.
- source_word: לַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Rend directement le lieu cultuel indiqué par la préposition et le nom.
- source_word: וּבְעֵת הֵחֵל ... הֵחֵל
  choice: Au moment où ... commença, ... commença lui aussi
  rationale: Conserve la répétition délibérée du verbe חלל et la simultanéité des deux commencements.
- source_word: שִׁיר יְהוָה
  choice: le chant de Yahweh
  rationale: Reproduit la construction hébraïque, qui peut exprimer l’appartenance ou la destination du chant, sans ajouter explicitement l’idée de louange.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הַחֲצֹצְרוֹת
  choice: les trompettes
  rationale: Équivalent direct; le texte ne précise pas ici leur matériau.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: et au moyen des instruments de David
  rationale: Rend la valeur instrumentale de l’expression עַל־יְדֵי et le contexte musical de כְּלֵי, tout en conservant l’association des instruments avec David.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Rend simplement le titre royal placé en apposition à David.
theological_decisions:
- issue: Sens de שִׁיר יְהוָה
  choice: le chant de Yahweh
  alternative: le chant adressé à Yahweh
  rationale: Le génitif hébreu demeure ouvert à plusieurs relations sémantiques. Le texte principal conserve cette ambiguïté, tandis que la note signale le sens directionnel probable dans le contexte cultuel.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin; sa transcription permet de le distinguer d’un titre.
translation_notes:
  register: Français international moderne, narratif et digne. « Holocauste » conserve le terme cultuel biblique usuel. La répétition de « commença » est volontaire afin de refléter la coordination rhétorique de l’hébreu.
