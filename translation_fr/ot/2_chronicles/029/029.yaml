base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: fr
  text: Lorsqu’on eut fini d’offrir l’offrande, le roi et tous ceux qui étaient avec lui s’agenouillèrent et se prosternèrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adorèrent ». Le verbe hébreu désigne le fait de se prosterner en signe de révérence et peut, dans ce contexte cultuel, exprimer l’adoration.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: Quand on eut achevé
  rationale: La conjonction, la préposition temporelle et l’infinitif construit de כלה introduisent l’action antérieure; cette tournure française en préserve clairement la succession.
- source_word: לְ/הַעֲלֹות
  choice: d’offrir le sacrifice
  rationale: Le hiphil de עלה signifie littéralement « faire monter » et, dans ce contexte cultuel, désigne l’action de présenter le sacrifice consumé. « Le sacrifice » explicite sobrement l’objet implicite sans répéter un terme absent de ce verset.
- source_word: כָּרְעוּ
  choice: se mirent à genoux
  rationale: כרע décrit le fait de fléchir les genoux ou de s’agenouiller; la formulation distingue cette posture du geste exprimé par le verbe suivant.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini.
- source_word: וְכָל־הַנִּמְצְאִים אִתּוֹ
  choice: et tous ceux qui étaient avec lui
  rationale: Le participe niphal de מצא désigne idiomatiquement les personnes présentes; la formulation française est naturelle et fidèle.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosternèrent
  rationale: Le verbe שחה exprime ici un geste corporel de révérence cultuelle. « Se prosternèrent » préserve ce geste concret et sa portée religieuse sans réduire le mot à une notion abstraite.
theological_decisions:
- issue: Portée cultuelle de שחה
  choice: se prosternèrent
  alternative: adorèrent
  rationale: Dans le cadre du temple, le geste constitue bien un acte d’adoration; toutefois, le sens physique de שחה demeure saillant après כרע. « Se prosternèrent » conserve à la fois le geste et sa révérence, tandis qu’une note signale explicitement la valeur cultuelle.
- issue: Objet implicite de לְהַעֲלוֹת
  choice: le sacrifice
  alternative: l’holocauste
  rationale: Le contexte immédiat concerne l’holocauste, mais le nom עֹלָה n’est pas répété dans ce membre de phrase. Le rendu retenu explicite le cadre sacrificiel sans introduire dans le corps du verset une précision lexicale seulement contextuelle.
translation_notes:
  register: Français international moderne, digne et fluide. Le passé antérieur marque naturellement l’achèvement préalable du sacrifice. La paire « se mirent à genoux et se prosternèrent » conserve les deux gestes successifs de l’hébreu.
