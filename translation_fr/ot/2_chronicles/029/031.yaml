  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: fr
  text: 'Alors Ézéchias prit la parole et dit : « Maintenant, vous vous êtes consacrés à Yahvé[a]. Approchez-vous et apportez des sacrifices et des offrandes de reconnaissance à la maison de Yahvé. » L’assemblée apporta des sacrifices et des offrandes de reconnaissance, et tous ceux dont le cœur était disposé apportèrent des holocaustes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous avez rempli votre main pour Yahvé », expression hébraïque désignant la consécration ou l’installation en vue d’un service sacré.'
    reason: La note préserve l’idiome hébreu sous-jacent, qui ne serait pas intelligible s’il était reproduit tel quel dans le corps du texte.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: prit la parole et dit
  rationale: Cette tournure française naturelle restitue l’idiome narratif hébreu « répondit et dit » sans suggérer nécessairement qu’Ézéchias répond à une question explicite.
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: vous vous êtes consacrés à Yahvé
  rationale: L’expression signifie littéralement « vous avez rempli votre main pour Yahvé » et constitue ici un idiome de consécration au service sacré. Le sens est donné dans le texte, tandis que la forme hébraïque est conservée en note.
- source_word: גֹּשׁוּ
  choice: Approchez-vous
  rationale: Le verbe exprime l’action de s’approcher, avec ici une portée cultuelle appropriée au contexte du temple.
- source_word: זְבָחִים
  choice: sacrifices
  rationale: Terme général et exact pour des animaux offerts en sacrifice.
- source_word: תוֹדוֹת
  choice: offrandes de reconnaissance
  rationale: Le nom désigne des sacrifices exprimant la reconnaissance ou l’action de grâce. Cette formulation française distingue clairement cette catégorie cultuelle.
- source_word: לְבֵית יְהוָה
  choice: à la maison de Yahvé
  rationale: La traduction conserve l’image hébraïque de la « maison » plutôt que de la remplacer par « temple ».
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: Désigne la communauté réunie et convient au contexte public du culte.
- source_word: כָל נְדִיב לֵב
  choice: tous ceux dont le cœur était disposé
  rationale: La formulation préserve l’idée hébraïque d’une disposition intérieure volontaire, sans la réduire à la seule générosité matérielle.
- source_word: עֹלוֹת
  choice: holocaustes
  rationale: Terme cultuel français usuel pour les sacrifices entièrement consumés sur l’autel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahvé » présente le nom divin personnel plutôt qu’un titre de substitution.
- issue: Sens de l’idiome מִלֵּאתֶם יֶדְכֶם
  choice: vous vous êtes consacrés
  alternative: vous avez rempli votre main
  rationale: Le calque littéral serait opaque en français moderne. La traduction exprime le sens cultuel attesté, et la note permet au lecteur de voir l’image originale sans imposer une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative est naturelle, les termes cultuels nécessaires sont conservés, et l’image anthropologique du « cœur disposé » reste visible.
