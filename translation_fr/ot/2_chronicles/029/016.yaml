base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: fr
  text: Les prêtres entrèrent à l’intérieur de la maison de l’Éternel pour la purifier. Ils emportèrent dans la cour de la maison de l’Éternel toute l’impureté qu’ils avaient trouvée dans le sanctuaire de l’Éternel. Les lévites la reçurent pour l’emporter dehors, au torrent du Cédron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: dans la partie intérieure de la maison de l’Éternel
  rationale: « À l’intérieur » ou « dans la partie intérieure » rend l’adverbe לִפְנִימָה sans préciser davantage une zone architecturale que le texte ne nomme pas.
- source_word: לְטַהֵר
  choice: pour la purifier
  rationale: Le pronom reprend naturellement la maison; « purifier » conserve la dimension cultuelle du verbe.
- source_word: כָּל הַטֻּמְאָה
  choice: tout ce qui était impur
  rationale: Cette formulation française naturelle conserve l’idée d’impureté cultuelle tout en désignant concrètement les éléments retirés.
- source_word: בְּהֵיכַל יְהוָה
  choice: dans le sanctuaire de l’Éternel
  rationale: הֵיכָל désigne ici l’édifice ou sanctuaire du temple; « sanctuaire » évite le faux ami moderne « palais ».
- source_word: וַיְקַבְּלוּ הַלְוִיִּם
  choice: Les lévites le prirent
  rationale: קבל signifie ici recevoir ou prendre en charge ce que les prêtres apportaient dans la cour.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: au-dehors, jusqu’au ravin du Cédron
  rationale: « Ravin » correspond au נַחַל topographique; חוּצָה souligne que l’évacuation se fait hors de l’enceinte.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel, lisible et digne, qui représente le nom divin sans le confondre avec le titre « Seigneur ».
theological_decisions:
- issue: Nature de l’impureté retirée
  choice: tout ce qui était impur
  alternative: toutes les impuretés
  rationale: Le texte peut viser des objets ou matières impurs trouvés dans le sanctuaire; la formulation retenue préserve cette portée concrète sans définir leur nature.
- issue: Étendue de la zone intérieure
  choice: la partie intérieure de la maison
  alternative: l’intérieur de la maison
  rationale: La formulation garde la nuance directionnelle de לִפְנִימָה sans identifier explicitement le Saint ou le Très-Saint.
translation_notes:
  register: Français moderne, international et digne. Les phrases ont été légèrement segmentées pour la clarté, sans modifier la succession des actions. « Maison », « sanctuaire » et « ravin » maintiennent les distinctions lexicales du texte hébreu.
