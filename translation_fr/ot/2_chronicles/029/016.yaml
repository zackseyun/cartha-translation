- from: Les prêtres entrèrent dans la partie intérieure de la maison de l’Éternel pour la purifier. Ils firent sortir dans la cour de la maison de l’Éternel tout ce qui était impur et qu’ils avaient trouvé dans le sanctuaire de l’Éternel. Les lévites le prirent pour l’emporter au-dehors, jusqu’au ravin du Cédron.
  to: Les prêtres entrèrent à l’intérieur de la maison de l’Éternel pour la purifier. Ils emportèrent dans la cour de la maison de l’Éternel toute l’impureté qu’ils avaient trouvée dans le sanctuaire de l’Éternel. Les lévites la reçurent pour l’emporter dehors, au torrent du Cédron.
  rationale: 'La révision allège la syntaxe française tout en conservant l’enchaînement du texte : entrée des prêtres, évacuation de l’impureté vers la cour, puis prise en charge par les lévites pour son transport hors de l’enceinte jusqu’au Cédron. Elle ne précise pas la nature des éléments impurs ni la zone intérieure exacte.'
