  source_fidelity: Le sens général est juste. Une légère révision rend plus directement כָּל הַטֻּמְאָה (« toute l’impureté »), conserve le mouvement de sortie vers la cour et rend נַחַל de façon plus usuelle pour le Cédron (« torrent »).
  naturalness: « Dans la partie intérieure » et « tout ce qui était impur et qu’ils avaient trouvé » sont compréhensibles, mais plus lourds et moins naturels que « à l’intérieur » et « toute l’impureté qu’ils avaient trouvée ».
  terminology: « Maison », « sanctuaire », « prêtres » et « lévites » maintiennent correctement les distinctions du texte. « L’Éternel » est conservé pour la cohérence du projet. « Torrent du Cédron » est une désignation topographique française plus idiomatique que « ravin ».
