source:
  edition: WLC
  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: fr
  text: Ils firent alors approcher les boucs du sacrifice pour le péché devant le roi et l’assemblée[a], et ils[b] posèrent leurs mains sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « présentèrent les boucs du sacrifice pour le péché devant le roi et l’assemblée ».'
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « ils posèrent leurs mains » renvoie le plus naturellement au roi et à l’assemblée, qui ont peut-être accompli ce geste par l’intermédiaire de représentants.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: ils firent alors approcher
  rationale: Le hifil de נגשׁ exprime ici le fait de faire approcher ou de présenter. Cette formulation conserve le mouvement concret propre au cadre sacrificiel tout en restant naturelle en français.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: les boucs destinés au sacrifice pour le péché
  rationale: שְׂעִירֵי désigne des boucs, et חַטָּאת désigne ici l’offrande sacrificielle liée au péché, non le péché abstrait. « Destinés au sacrifice pour le péché » rend clairement la relation sans introduire une interprétation confessionnelle particulière.
- source_word: לִפְנֵי
  choice: devant
  rationale: Dans cette scène cérémonielle, לִפְנֵי indique que les animaux sont amenés en présence du roi et de l’assemblée. « Devant » est direct et idiomatique.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: le roi et l’assemblée
  rationale: קָהָל désigne ici la communauté réunie. « Assemblée » convient au contexte public et cultuel sans coloration ecclésiastique excessive.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: puis ils posèrent leurs mains
  rationale: סמך associé aux mains désigne le geste rituel consistant à poser les mains sur l’animal. Le pronom « ils » maintient l’ambiguïté formelle du sujet hébreu, explicitée en note.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: Le pronom renvoie aux boucs. « Sur eux » reproduit clairement cette référence au masculin pluriel.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel
  choice: sacrifice pour le péché
  alternative: péché
  rationale: La présence de boucs amenés pour un rite et l’imposition des mains montrent que חַטָּאת désigne ici une offrande sacrificielle, et non simplement la faute abstraite.
- issue: Référent du sujet de « ils posèrent leurs mains »
  choice: maintenir le pronom « ils », avec une note indiquant que le roi et l’assemblée sont le référent contextuel le plus naturel
  alternative: identifier explicitement les prêtres comme sujet
  rationale: L’hébreu n’exprime pas de nouveau sujet nominal. Le roi et l’assemblée sont les antécédents contextuels les plus proches, éventuellement représentés par certains de leurs membres, mais le texte ne précise pas les modalités du geste. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel reste explicite sans employer un terme théologiquement plus interprétatif comme « sacrifice d’expiation ». Les pronoms et la note préservent l’ambiguïté du sujet dans l’hébreu.
