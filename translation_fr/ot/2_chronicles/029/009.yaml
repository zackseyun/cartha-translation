  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: fr
  text: 'Et voici[a] : nos pères sont tombés par l’épée, et nos fils, nos filles et nos épouses sont en captivité[b] à cause de cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et voyez ». Le terme hébreu attire avec insistance l’attention sur ce qui suit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans la captivité »; on pourrait aussi traduire : « sont captifs » ou « ont été emmenés captifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: « Voici » restitue naturellement en français moderne la valeur emphatique du marqueur qui attire l’attention, tandis que « et » conserve le lien avec ce qui précède.
- source_word: נָפְלוּ
  choice: sont tombés
  rationale: Le verbe signifie littéralement « tomber » et, dans ce contexte, évoque solennellement la mort violente sans explicitation excessive.
- source_word: אֲבוֹתֵינוּ
  choice: nos pères
  rationale: Le terme désigne ici les pères ou les hommes de la génération précédente; « nos pères » préserve la formulation genrée et le registre du texte.
- source_word: בֶּחָרֶב
  choice: sous l’épée
  rationale: Expression française digne et intelligible pour la mort causée par l’épée, qui conserve l’image hébraïque.
- source_word: וּבָנֵינוּ וּבְנוֹתֵינוּ
  choice: nos fils, nos filles
  rationale: La traduction maintient la distinction explicite entre les descendants masculins et féminins.
- source_word: וְנָשֵׁינוּ
  choice: nos femmes
  rationale: Dans cette énumération familiale avec suffixe possessif, « nos femmes » désigne naturellement les épouses tout en conservant la formulation du texte.
- source_word: בַּשְּׁבִי
  choice: sont en captivité
  rationale: Le substantif précédé de la préposition décrit leur état présent de captifs; cette expression française en rend directement le sens.
- source_word: עַל זֹאת
  choice: à cause de cela
  rationale: La locution exprime ici la cause et renvoie aux fautes exposées dans le contexte précédent.
theological_decisions:
- issue: Termes familiaux genrés dans l’annonce du jugement
  choice: nos pères… nos fils, nos filles et nos femmes
  alternative: nos ancêtres… nos enfants et nos proches
  rationale: L’hébreu énumère délibérément des groupes familiaux distincts. La traduction conserve ces distinctions sans les neutraliser ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Voici » et « sont tombés sous l’épée » conservent le relief rhétorique et l’image du texte sans archaïsme excessif.
