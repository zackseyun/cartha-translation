  text: וַ/יְהִי֙ קֶ֣צֶף יְהוָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם וַ/יִּתְּנֵ֤/ם ל/זועה לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה כַּ/אֲשֶׁ֛ר אַתֶּ֥ם רֹאִ֖ים בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: fr
  text: Ainsi, la colère de Yahvé s’est abattue sur Juda et Jérusalem, et il a fait d’eux un objet d’épouvante[a], une désolation et un sujet de sifflement[b], comme vous le voyez de vos propres yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet d’horreur » ; le terme hébreu désigne ce qui provoque un frémissement d’épouvante.
    reason: lexical_alternative
  - marker: b
    text: Ou « un sujet de sifflements [moqueurs] » ; le terme désigne le sifflement ou le coup de sifflet suscité chez les témoins devant la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: colère
  rationale: « Colère » exprime naturellement en français l’intense réaction divine de jugement, sans l’atténuer ni ajouter une nuance étrangère au contexte.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme.
- source_word: וַיְהִי ... עַל
  choice: s’est abattue sur
  rationale: Cette tournure française rend l’irruption et le poids de la colère dirigée contre Juda et Jérusalem.
- source_word: וַיִּתְּנֵם
  choice: il a fait d’eux
  rationale: Avec les compléments introduits par ל, le verbe indique ici le résultat auquel Dieu les a réduits ou livrés; « il a fait d’eux » conserve clairement cette valeur résultative.
- source_word: לְזוֹעָה
  choice: un objet d’épouvante
  rationale: Le nom rare évoque le frémissement ou l’horreur provoqués par ce que l’on voit; cette formulation conserve l’idée d’un spectacle qui épouvante autrui.
- source_word: לְשַׁמָּה
  choice: de désolation
  rationale: « Désolation » rend le dévastement visible associé à cette formule de jugement tout en restant digne et courant.
- source_word: וְלִשְׁרֵקָה
  choice: de sifflets moqueurs
  rationale: Le terme désigne les sifflements suscités chez les témoins de la ruine; l’adjectif « moqueurs » explicite en français leur valeur de dérision sans remplacer l’image concrète.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: comme vous le voyez de vos propres yeux
  rationale: Cette expression idiomatique garde l’insistance de l’hébreu sur le témoignage visuel direct des auditeurs.
theological_decisions:
- issue: Maintien de la force du langage du jugement divin
  choice: la colère de Yahvé s’est abattue sur Juda et Jérusalem, et il a fait d’eux un objet d’épouvante, de désolation et de sifflets moqueurs
  alternative: Yahvé s’est irrité contre Juda et Jérusalem et les a livrés à la ruine et au mépris
  rationale: Le texte hébreu attribue directement à la colère de Yahvé la situation terrible et publiquement humiliante de Juda et de Jérusalem. La traduction en conserve la sévérité sans l’expliquer ni l’atténuer.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le parallélisme des trois conséquences du jugement et l’image concrète des sifflets, tout en employant une syntaxe française naturelle.
