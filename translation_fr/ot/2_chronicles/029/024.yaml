  text: וַ/יִּשְׁחָטוּ/ם֙ הַ/כֹּ֣הֲנִ֔ים וַֽ/יְחַטְּא֤וּ אֶת דָּמָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה לְ/כַפֵּ֖ר עַל כָּל יִשְׂרָאֵ֑ל כִּ֤י לְ/כָל יִשְׂרָאֵל֙ אָמַ֣ר הַ/מֶּ֔לֶךְ הָ/עוֹלָ֖ה וְ/הַ/חַטָּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: fr
  text: Les prêtres les égorgèrent, puis appliquèrent leur sang sur l’autel[a], pour faire expiation pour tout Israël. En effet, le roi avait dit que l’holocauste et le sacrifice pour le péché[b] étaient destinés à tout Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « purifièrent l’autel avec leur sang » ; le verbe hébreu peut désigner l’accomplissement d’un rite de purification ou de sacrifice pour le péché.
    reason: lexical_alternative
  - marker: b
    text: Ou « le sacrifice de purification ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: les égorgèrent
  rationale: Dans un contexte sacrificiel, שׁחט désigne l’égorgement rituel des animaux. Le suffixe renvoie aux boucs mentionnés au verset précédent.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: mirent leur sang sur l’autel selon le rite du sacrifice pour le péché
  rationale: Le hiphil de חטא peut désigner l’accomplissement d’un rite de purification ou de sacrifice pour le péché. La formulation rend à la fois l’application concrète du sang et sa fonction rituelle, sans faire du sang lui-même un sacrifice.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: Dans ce contexte sacrificiel, כפר exprime l’acte rituel d’expiation; cette formulation française conserve sa portée cultuelle et théologique.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: pour tout Israël
  rationale: La préposition עַל indique ici les bénéficiaires de l’expiation.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit l’explication de la portée nationale des sacrifices.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: le roi avait dit que … devaient être offerts pour tout Israël
  rationale: Cette reformulation naturelle restitue l’ordre des mots hébreu et la valeur directive de la parole royale dans le contexte, tout en conservant le verbe « dire ».
- source_word: הָעוֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme français biblique courant pour l’offrande entièrement consumée désignée par עוֹלָה.
- source_word: וְהַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne l’offrande sacrificielle plutôt que le péché lui-même. L’autre nuance possible, celle de purification, est signalée en note.
theological_decisions:
- issue: Sens rituel de חטא et חַטָּאת
  choice: Employer « sacrifice pour le péché » dans le texte, tout en explicitant pour le verbe l’application rituelle du sang.
  alternative: Employer « rite/sacrifice de purification ».
  rationale: Le rendu traditionnel reste clair pour le lectorat francophone, mais la note préserve la nuance de purification que ces termes peuvent porter dans le langage sacrificiel.
translation_notes:
  register: Français international moderne, digne et accessible. « Égorgèrent », « autel », « expiation » et « holocauste » conservent la précision du registre sacrificiel biblique; la syntaxe est légèrement explicitée pour être naturelle en français.
