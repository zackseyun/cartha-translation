revisions:
- from: Les prêtres les égorgèrent, puis mirent leur sang sur l’autel selon le rite du sacrifice pour le péché[a], afin de faire l’expiation pour tout Israël. En effet, le roi avait dit que l’holocauste et le sacrifice pour le péché[b] devaient être offerts pour tout Israël.
  to: Les prêtres les égorgèrent, puis appliquèrent leur sang sur l’autel[a], pour faire expiation pour tout Israël. En effet, le roi avait dit que l’holocauste et le sacrifice pour le péché[b] étaient destinés à tout Israël.
  rationale: La révision supprime une explicitation interprétative du rite tout en conservant, dans une note ancrée sur l'action concernée, la gamme sémantique cultuelle du verbe hébreu. Elle rend également la dernière proposition sans transformer la destination des offrandes en commandement explicite.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:22Z'
review_pass:
  verdict: revise
  source_fidelity: La mention explicite « selon le rite du sacrifice pour le péché » interprète et amplifie le hiphil de חטא. Le texte hébreu décrit l'application rituelle du sang à l'autel; sa nuance de purification/offrande pour le péché doit être conservée en note plutôt qu'intégrée à la formulation principale. La finale exprime que les deux offrandes étaient destinées à tout Israël, non explicitement qu'elles « devaient être offertes ».
  naturalness: « Appliquèrent leur sang sur l’autel » est naturel dans un registre biblique moderne et rend l'action rituelle sans lourdeur. « Étaient destinés à tout Israël » restitue naturellement la portée de la déclaration royale.
  terminology: « Holocauste », « sacrifice pour le péché » et « faire expiation » conviennent au registre sacrificiel. La variante « sacrifice de purification » reste utile en note.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « selon le rite du sacrifice pour le péché »
    rationale: Cette expression n'est pas formulée ainsi dans l'hébreu et rattache plus étroitement l'action au sacrifice pour le péché que ne le fait la syntaxe du verset. L'application du sang est à traduire dans le texte; la valeur rituelle possible de חטא relève de la note.
  - severity: low
    issue: « devaient être offerts » reformule la déclaration royale comme une obligation explicite
    rationale: אָמַר suivi de la désignation des offrandes et de לְכָל־יִשְׂרָאֵל indique qu'elles étaient pour/destinées à tout Israël. Le verbe « offrir » et la modalité « devaient » sont des explicitations non nécessaires.
