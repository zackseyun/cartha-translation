base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: fr
  text: Toute l’assemblée se prosternait, tandis que le chant se faisait entendre[a] et que les trompettes sonnaient. Tout cela continua jusqu’à ce que l’holocauste soit achevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le chant chantait » ou « retentissait » ; l’hébreu emploie « le chant » avec un participe, tournure rendue ici plus naturellement par « le chant se faisait entendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָּהָל
  choice: assemblée
  rationale: Désigne ici la communauté réunie pour le culte. « Assemblée » conserve le sens collectif sans connotation ecclésiale ajoutée.
- source_word: מִשְׁתַּחֲוִים
  choice: se prosternait
  rationale: Le verbe exprime un geste corporel d’abaissement ou de prosternation. Cette formulation garde la dimension physique plutôt que de généraliser en « adorait ».
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: le chant se faisait entendre
  rationale: L’hébreu dit littéralement quelque chose comme « le chant chantait ». La formulation française restitue naturellement l’idée que le chant retentissait, tout en signalant l’idiome dans une note.
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: les trompettes sonnaient
  rationale: Il s’agit des trompettes cultuelles que l’on faisait retentir. « Sonnaient » est naturel en français avec les instruments comme sujet.
- source_word: הַכֹּל
  choice: tout cela
  rationale: L’expression récapitule l’ensemble des actions cultuelles qui viennent d’être décrites.
- source_word: עַד לִכְלוֹת
  choice: jusqu’à ce que … soit achevé
  rationale: La construction marque le terme auquel se poursuivent les actions; une proposition verbale est naturelle en français.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Terme français consacré pour l’offrande entièrement brûlée désignée par עֹלָה dans le système sacrificiel israélite.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. L’imparfait rend les actions simultanées et continues; « se prosternait » préserve leur dimension corporelle, et « holocauste » maintient le vocabulaire sacrificiel traditionnel.
