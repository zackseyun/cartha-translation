  yaml_path: translation/ot/2_chronicles/029/004.yaml
  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: fr
  text: Puis il fit venir les prêtres et les lévites et les rassembla sur la place orientale[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les rassembla sur la place située à l’est ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Puis il fit venir
  rationale: Le hifil narratif de בוא exprime le fait de faire venir ou d’amener. « Puis » rend naturellement la progression du récit, tandis que « fit venir » conserve la valeur causative sans préciser un mouvement « à l’intérieur » que le verset hébreu ne formule pas explicitement.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis de כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française habituelle des membres de la tribu de Lévi affectés au service cultuel, ici distingués des prêtres.
- source_word: וַיַּאַסְפֵם
  choice: les rassembla
  rationale: Le verbe אסף avec suffixe pronominal signifie « les rassembler ». Cette formulation convient à une convocation collective et publique.
- source_word: לִרְחוֹב
  choice: sur la place
  rationale: רְחוֹב désigne ici un espace large et dégagé, une place, plutôt qu’une rue au sens français moderne. La préposition ל peut marquer la destination ou le lieu résultant du rassemblement.
- source_word: הַמִּזְרָח
  choice: orientale
  rationale: מִזְרָח indique l’est. « La place orientale » rend avec concision le lien entre l’espace ouvert et son emplacement ou son orientation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase suit la progression narrative hébraïque et maintient l’ambiguïté légère entre une place appelée « orientale » et une place située du côté est.
