source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: fr
  text: Ils amenèrent sept taureaux, sept béliers, sept agneaux et sept boucs en sacrifice pour le péché, pour le royaume, pour le sanctuaire et pour Juda. Puis il ordonna aux fils d’Aaron, les prêtres, de les offrir sur l’autel de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Ils amenèrent
  rationale: Le verbe בוא décrit ici l’action d’amener les animaux destinés au sacrifice. « Amenèrent » est naturel en français et reste proche du récit hébreu.
- source_word: פָרִים
  choice: taureaux
  rationale: Dans cette liste sacrificielle, le terme désigne des bovins mâles offerts en sacrifice, sans que le verset précise explicitement leur âge.
- source_word: אֵילִים
  choice: béliers
  rationale: Équivalent français courant du terme désignant les moutons mâles dans un contexte sacrificiel.
- source_word: כְבָשִׂים
  choice: agneaux
  rationale: Le mot désigne ici des agneaux destinés au sacrifice. Le français n’a pas besoin d’en expliciter le sexe dans cette énumération.
- source_word: צְפִירֵי עִזִּים
  choice: boucs
  rationale: La locution hébraïque désigne spécifiquement des caprins mâles ; « boucs » l’exprime avec concision et naturel.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne une catégorie de sacrifice liée au péché, et non simplement le péché abstrait. Cette formulation reste claire sans préciser davantage le mécanisme théologique du rite.
- source_word: עַל הַמַּמְלָכָה
  choice: pour le royaume
  rationale: Avec le sacrifice, עַל a ici une valeur représentative, « pour » ou « en faveur de ». La formulation concise conserve cette portée.
- source_word: הַמִּקְדָּשׁ
  choice: le sanctuaire
  rationale: « Sanctuaire » garde la valeur cultuelle de מִקְדָּשׁ plus précisément que le terme général « Temple ».
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: aux fils d’Aaron, les prêtres
  rationale: La traduction maintient la désignation familiale suivie de l’apposition sacerdotale.
- source_word: לְהַעֲלוֹת
  choice: de les offrir
  rationale: À la forme causative et dans un contexte sacrificiel, עלה signifie faire monter l’offrande, donc l’offrir sur l’autel. Le pronom « les » explicite naturellement en français l’objet fourni par le contexte.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahweh
  rationale: La chaîne construite est rendue directement, et le nom divin יהוה est transcrit « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice d’expiation
  rationale: Le terme désigne ici le sacrifice rituel. « Pour le péché » préserve cette catégorie tout en évitant d’imposer au mot seul une explication particulière de l’effet du rite.
- issue: Référent du sujet singulier dans וַיֹּאמֶר
  choice: il ordonna
  alternative: Ézéchias ordonna
  rationale: L’hébreu emploie seulement un sujet pronominal implicite. La traduction conserve cette manière de renvoyer au personnage déjà identifié dans le contexte, sans ajouter son nom dans ce verset.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération sacrificielle et les trois bénéficiaires introduits par « pour » sont conservés. « Puis » rend la progression narrative sans alourdir la seconde phrase.
