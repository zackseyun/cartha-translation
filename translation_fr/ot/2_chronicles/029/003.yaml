source:
  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: fr
  text: La première année de son règne, au premier mois, il ouvrit les portes de la maison de Yahweh et les répara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les renforça », c’est-à-dire qu’il les rendit de nouveau solides et sûres.
    reason: 'Alternative lexicale : le verbe חזק signifie fondamentalement « fortifier, rendre fort », tandis que « réparer » exprime son effet probable sur des portes.'
lexical_decisions:
- source_word: הוּא
  choice: il
  rationale: Le pronom indépendant reprend clairement le sujet du récit. En français, « il » suffit ici sans ajouter une insistance absente du contexte immédiat.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: La première année de son règne
  rationale: Cette formulation française naturelle rend fidèlement l’indication de la première année royale.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: au premier mois
  rationale: Rendu temporel direct et idiomatique de חֹדֶשׁ dans ce contexte.
- source_word: פָּתַח
  choice: ouvrit
  rationale: Le verbe désigne simplement l’action d’ouvrir les portes.
- source_word: דַּלְתוֹת
  choice: les portes
  rationale: דֶּלֶת désigne ici les portes ou leurs battants, plutôt que les portes monumentales d’une ville.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression concrète de l’hébreu tout en restant claire dans le contexte du temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme explicite du texte source.
- source_word: וַיְחַזְּקֵם
  choice: et les répara
  rationale: Le piel de חזק signifie littéralement rendre fort ou solide. Appliqué aux portes dans ce contexte de restauration, « répara » exprime naturellement l’action concrète probable, tandis que le sens plus littéral est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le nom propre divin. « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’ordre narratif hébreu sans lourdeur. Le passé simple convient au registre biblique soutenu tout en demeurant immédiatement compréhensible.
