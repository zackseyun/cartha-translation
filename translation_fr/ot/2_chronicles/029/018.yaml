base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: fr
  text: 'Puis ils entrèrent chez le roi Ézéchias et lui dirent : « Nous avons purifié toute la maison de Yahweh, l’autel des holocaustes avec tous ses ustensiles, ainsi que la table des pains disposés en rangées[a] avec tous ses ustensiles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « la table des pains de proposition », c’est-à-dire la table où les pains étaient disposés devant Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: ils entrèrent auprès de
  rationale: L’adverbe indique un mouvement vers l’intérieur. Dans ce contexte, le français naturel exprime l’entrée auprès du roi sans alourdir la phrase par « à l’intérieur ».
- source_word: טִהַרְנוּ
  choice: nous avons purifié
  rationale: Dans le contexte du sanctuaire, le verbe désigne une purification rituelle; « purifié » en conserve clairement la portée cultuelle.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation garde l’image hébraïque de la « maison » tout en rendant directement le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom propre divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִזְבַּח הָעוֹלָה
  choice: l’autel des holocaustes
  rationale: « Holocauste » est le terme français établi pour le sacrifice entièrement consumé; le pluriel convient à la fonction habituelle de l’autel.
- source_word: כֵּלָיו
  choice: tous ses ustensiles
  rationale: Dans le cadre du culte, כֵּלִים désigne les objets et instruments affectés au service; « ustensiles » est précis et compréhensible.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: la table des pains disposés en rangées
  rationale: Le complément hébreu évoque ce qui est disposé ou ordonné. La formulation explicite naturellement les pains concernés tout en conservant l’idée de leur disposition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement et évite de le remplacer silencieusement par un titre.
- issue: Identification de שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: la table des pains disposés en rangées
  alternative: la table des pains de proposition
  rationale: Le choix principal rend le sens concret de l’expression hébraïque dans un français transparent; la note conserve le terme traditionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du rapport solennel des prêtres, tandis que les termes cultuels sont rendus clairement. Le marqueur [a] figure immédiatement après l’expression qu’il explique.
