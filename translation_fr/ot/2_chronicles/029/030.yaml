  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: fr
  text: Alors le roi Ézéchias et les responsables dirent aux Lévites de louer Yahweh avec les paroles de David et d’Asaph le voyant[a]. Ils louèrent Yahweh avec joie[b], et ils s’inclinèrent et se prosternèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon les paroles de David et d’Asaph le voyant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à la joie » ou « vers la joie » ; l’expression indique que leur louange était marquée par la réjouissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dirent … de
  rationale: Le verbe signifie littéralement « dire »; avec l’infinitif, la tournure française « dirent aux Lévites de » exprime naturellement la directive sans la renforcer en ordre formel.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: le roi … et les responsables
  rationale: שׂרים désigne ici les dirigeants ou dignitaires associés au roi; « responsables » est actuel et n’implique pas qu’ils soient des princes de sang.
- source_word: לְהַלֵּל לַיהוָה
  choice: louer Yahweh
  rationale: הלל exprime la louange dans ce contexte liturgique, et le nom divin יהוה est transcrit « Yahweh ».
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: avec les paroles de David et d’Asaph le voyant
  rationale: « Paroles » reste proche de דִּבְרֵי sans préciser qu’il s’agit de chants; la préposition בְּ est rendue par « avec », tout en signalant en note la possibilité « selon ».
- source_word: הַחֹזֶה
  choice: le voyant
  rationale: « Voyant » est le titre prophétique français traditionnel et précis pour חֹזֶה.
- source_word: עַד לְשִׂמְחָה
  choice: dans la joie
  rationale: La locution hébraïque, littéralement « jusqu’à/pour la joie », est inhabituelle; « dans la joie » transmet naturellement que la louange était accompagnée de réjouissance, tandis que la note conserve la difficulté formelle.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: ils s’inclinèrent et se prosternèrent
  rationale: 'Les deux verbes corporels sont conservés séparément: le premier décrit l’inclination et le second la prosternation révérencielle.'
theological_decisions:
- issue: Le rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Le rapport entre les deux gestes finaux
  choice: 'deux actions coordonnées: « s’inclinèrent et se prosternèrent »'
  alternative: « se prosternèrent en adoration »
  rationale: L’hébreu emploie deux verbes distincts. Les conserver évite de les fondre en une seule action et restitue la progression corporelle sans ajouter une formulation interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant idiomatique; les répétitions utiles et les deux gestes de révérence sont maintenus.
