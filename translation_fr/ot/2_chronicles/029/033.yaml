translation:
  language: fr
  text: Les offrandes consacrées comprenaient six cents bovins et trois mille têtes de petit bétail[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne collectivement les animaux du petit bétail, notamment les moutons et les chèvres.
