lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: Les offrandes consacrées
  rationale: Le pluriel désigne ici les biens mis à part pour un usage sacré; l’énumération qui suit montre qu’il s’agit d’animaux destinés à être offerts. Cette formulation est naturelle et explicite sans s’éloigner du contexte cultuel.
- source_word: בָּקָר
  choice: bovins
  rationale: Le nom collectif désigne les animaux de l’espèce bovine sans préciser leur sexe ni leur fonction; « bovins » conserve cette étendue de sens.
- source_word: שֵׁשׁ מֵאוֹת
  choice: six cents
  rationale: Traduction directe du nombre cardinal.
- source_word: וְצֹאן
  choice: et trois mille bêtes de petit bétail
  rationale: Le collectif צֹאן peut comprendre les moutons comme les chèvres. « Petit bétail » préserve mieux cette portée que le seul mot « moutons ».
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: trois mille
  rationale: Traduction directe du nombre cardinal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Comprenaient » relie naturellement la catégorie des offrandes consacrées à l’inventaire qui suit. « Bovins » et « bêtes de petit bétail » rendent les deux noms collectifs hébreux sans les restreindre indûment.
