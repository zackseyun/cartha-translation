source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: fr
  text: Le roi Ézéchias se leva de bon matin, rassembla les responsables de la ville et monta à la maison de Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se leva de bon matin
  rationale: Le hifil de שׁכם exprime ici le fait de se lever ou de commencer tôt. « Se leva de bon matin » restitue naturellement cette nuance temporelle en français.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: Le roi Ézékias
  rationale: Cette tournure française naturelle conserve le titre et suit la forme française traditionnelle du nom.
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Dans ce contexte, אָסַף désigne l'action de réunir des personnes.
- source_word: אֵת שָׂרֵי הָעִיר
  choice: les responsables de la ville
  rationale: שָׂרֵי désigne ici les dirigeants ou hauts responsables civils, sans impliquer nécessairement des princes héréditaires.
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עָלָה décrit littéralement une montée et conserve l'image traditionnelle de l'ascension vers le sanctuaire.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: Cette traduction conserve l'expression concrète « maison » ainsi que le nom divin présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » est la forme française courante du nom propre et évite de le remplacer silencieusement par un titre.
- issue: Désignation du sanctuaire par בֵּית
  choice: maison
  alternative: Temple
  rationale: « Maison » préserve la formulation hébraïque et sa portée théologique, tandis que « Temple » expliciterait le référent au prix de l'image originale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative est fluide, tout en conservant la montée vers la maison de Yahvé et la désignation administrative des dirigeants urbains.
