base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: fr
  text: Ézéchias devint roi à l’âge de vingt-cinq ans et régna vingt-neuf ans à Jérusalem. Sa mère s’appelait Abija, fille de Zacharie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: מָלַךְ
  choice: devint roi
  rationale: La première occurrence introduit l’accession au trône; cette formulation rend naturellement la valeur ingressive du verbe dans ce contexte.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: à l’âge de vingt-cinq ans
  rationale: Rendu idiomatique français de la tournure hébraïque exprimant l’âge.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: régna vingt-neuf ans
  rationale: La seconde occurrence de מָלַךְ décrit la durée du règne.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: La préposition locative désigne ici le siège du règne; « à » est la tournure française naturelle avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ אֲבִיָּה
  choice: Sa mère s’appelait Abiya
  rationale: Formulation française courante qui conserve toute l’information de la formule biographique hébraïque.
- source_word: בַּת זְכַרְיָהוּ
  choice: fille de Zacharie
  rationale: Rend directement la relation généalogique et emploie la forme française usuelle du nom.
