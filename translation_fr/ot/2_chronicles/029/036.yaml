  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: fr
  text: Ézéchias et tout le peuple se réjouirent de ce que Dieu avait préparé pour le peuple[a], car cela s’était produit soudainement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ce que Dieu avait préparé le peuple » ou « de ce que Dieu avait établi cela pour le peuple ».
    reason: Le verbe hébreu peut signifier « préparer » ou « établir », et l’absence d’objet direct explicite permet plusieurs analyses de la relation avec « le peuple ».
lexical_decisions:
- source_word: וַיִּשְׂמַח יְחִזְקִיָּהוּ וְכָל הָעָם
  choice: Ézéchias et tout le peuple se réjouirent
  rationale: Le singulier hébreu s’accorde d’abord avec Ézéchias, avant l’ajout de « tout le peuple ». En français, le pluriel coordonné est plus naturel. « Se réjouirent » rend la joie exprimée par שׂמח dans un registre narratif digne.
- source_word: עַל
  choice: de ce que
  rationale: Après « se réjouir », עַל introduit ici le motif ou l’occasion de la joie. « De ce que » exprime naturellement cette relation causale en français.
- source_word: הֵכִין הָאֱלֹהִים לָעָם
  choice: Dieu avait préparé pour le peuple
  rationale: Le hiphil de כון peut signifier « préparer », « disposer » ou « établir ». Aucun complément d’objet explicite ne suit le verbe, tandis que לָעָם indique le bénéficiaire. La formulation garde ouvert ce que Dieu avait préparé, sans transformer « le peuple » en objet direct.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit l’explication de la joie. « Car » convient au registre narratif et marque clairement ce lien.
- source_word: בְּפִתְאֹם
  choice: soudainement
  rationale: L’adverbe exprime le caractère brusque ou inattendu de l’accomplissement.
- source_word: הָיָה הַדָּבָר
  choice: cela s’était fait
  rationale: דָּבָר désigne largement la chose, l’affaire ou l’événement. « Cela s’était fait » reste naturel en français et renvoie sans précision excessive à l’ensemble de la restauration du culte.
theological_decisions:
- issue: L’action de Dieu et l’objet de sa préparation
  choice: Dieu avait préparé pour le peuple
  alternative: Dieu avait préparé le peuple ; Dieu avait établi cela pour le peuple
  rationale: L’hébreu ne donne pas d’objet direct explicite à הֵכִין, et לָעָם signifie normalement « pour le peuple ». Le texte principal conserve donc l’indétermination de ce que Dieu a préparé et son action en faveur du peuple, tandis que la note signale les autres analyses possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple porte l’action narrative principale, tandis que le plus-que-parfait exprime ce que Dieu avait déjà accompli. La formulation évite de préciser indûment l’objet non exprimé du verbe hébreu.
