id: 2CH.29.2
reference: 2 Chronicles 29:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, conformément à tout ce qu’avait fait David, son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « David, son ancêtre » ou « David, son aïeul » ; ici, « père » exprime l’appartenance à la lignée dynastique, et non une paternité immédiate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol qal de עשה est la forme narrative habituelle signifiant « et il fit ». En français, la coordination peut rester implicite, et le passé simple convient au récit.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: 'L’adjectif défini ישר est employé comme substantif : « ce qui est droit ». Cette formulation conserve la valeur morale et évaluative de l’expression.'
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression garde l’image hébraïque tout en étant idiomatique en français ; elle indique le point de vue selon lequel l’action est jugée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: La formulation exprime à la fois la conformité au modèle de David et la portée globale indiquée par כֹל.
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait rend clairement l’antériorité des actes de David, pris ici comme modèle.
- source_word: דָּוִיד
  choice: David
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אָבִיו
  choice: son père
  rationale: Le sens lexical premier est conservé dans le texte. Dans cette formule royale, le mot désigne toutefois un père dynastique, donc un ancêtre, nuance signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. La transcription « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Sens de « David, son père » pour Ézéchias
  choice: Conserver la formule dynastique « David, son père » dans le texte
  alternative: David, son ancêtre ; David, son aïeul
  rationale: אָב peut désigner un père immédiat ou un ancêtre. Ici, David n’est pas le père immédiat d’Ézéchias, mais son père dynastique. Le texte conserve la formulation source et la note explicite son sens.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « ce qui est droit aux yeux de » conserve l’idiome biblique sans archaïsme marqué ; « conformément à tout ce que » maintient explicitement la totalité exprimée en hébreu.
