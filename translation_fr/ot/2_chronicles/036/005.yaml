  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: fr
  text: Joïaqim avait vingt-cinq ans lorsqu’il devint roi, et il régna onze ans à Jérusalem. Il fit ce qui est mal aux yeux de Yahweh, son Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: avait vingt-cinq ans
  rationale: L’expression hébraïque est l’idiome habituel indiquant l’âge. Cette formulation en restitue naturellement le sens en français moderne.
- source_word: יְהוֹיָקִים
  choice: Joïakim
  rationale: Forme française usuelle du nom personnel biblique.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction avec בְּ situe l’âge au moment de l’accession au trône. La formulation choisie est naturelle et précise.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: et il régna onze ans
  rationale: מָלַךְ signifie « régner, être roi » ; « régna » convient au registre historique et à la formule royale.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » est la tournure locative idiomatique avec un nom de ville.
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Cette traduction conserve l’action exprimée par le verbe ainsi que l’évaluation morale de l’expression hébraïque.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française claire conserve l’image et le point de vue évaluatif de l’idiome hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe masculin singulier renvoie à Joïakim et indique sa relation de responsabilité envers Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la notice royale hébraïque tout en évitant les calques peu naturels.
