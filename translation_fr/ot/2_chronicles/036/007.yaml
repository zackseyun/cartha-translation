  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: fr
  text: Nabuchodonosor emporta aussi à Babylone une partie des objets de la maison de Yahweh et les déposa dans son temple[a] à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son palais » : selon le contexte, le mot hébreu peut désigner un temple ou un palais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכְּלֵי
  choice: aussi […] une partie des objets
  rationale: La conjonction וּ relie cette action au récit précédent, tandis que מִן a ici une valeur partitive. « Une partie des objets » exprime clairement que tous ne sont pas nécessairement visés.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque « maison de YHWH » sans la remplacer par l’interprétation plus explicite « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa forme française usuelle translittérée, plutôt que remplacé par un titre.
- source_word: הֵבִיא
  choice: emporta
  rationale: Le hiphil de בוא signifie « faire venir, apporter ». Dans ce contexte de transfert forcé d’objets vers Babylone, « emporta » est naturel en français et indique clairement le déplacement.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: La forme traditionnelle française du nom est immédiatement reconnaissable et convient au registre biblique moderne.
- source_word: וַיִּתְּנֵם
  choice: et les déposa
  rationale: נתן désigne ici le fait de placer ou déposer les objets dans un lieu. « Déposa » est précis, naturel et d’un registre digne.
- source_word: בְּהֵיכָלוֹ
  choice: dans son temple
  rationale: הֵיכָל peut désigner un temple ou un palais. Le contexte d’objets sacrés transférés depuis la maison de Yahweh favorise « temple », tout en maintenant l’autre possibilité en note.
- source_word: בְּבָבֶל
  choice: à Babylone
  rationale: La préposition בְּ a ici une valeur locative ; « à Babylone » est l’expression française idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Sens de הֵיכָל pour l’édifice de Nabuchodonosor
  choice: son temple
  alternative: son palais
  rationale: Le contexte cultuel rend « temple » probable, mais le terme hébreu reste lexicalement ambigu ; cette ambiguïté est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement réorganisée pour exprimer naturellement la valeur partitive de מִן. « Maison de Yahweh » préserve l’image hébraïque, tandis que « son temple » retient le sens contextuellement le plus probable sans masquer l’alternative.
