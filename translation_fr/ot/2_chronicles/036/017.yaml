review_pass:
  verdict: revise
  source_fidelity: 'Le sens d’ensemble est fidèle : Dieu fait venir le roi chaldéen, celui-ci tue dans le lieu saint, n’épargne aucune catégorie d’âge ou de sexe, et Dieu les remet à son pouvoir. Toutefois, « fit monter » est un calque peu naturel du hiphil militaire, et « maison de leur sanctuaire » ne fonctionne pas naturellement en français pour בְּבֵית מִקְדָּשָׁם. Le terme בְּתוּלָה peut recouvrir « jeune fille » et « vierge » selon le contexte ; la traduction principale ne devrait pas trancher plus que nécessaire.'
  naturalness: « Il fit venir contre eux » et « dans leur sanctuaire » sont modernes, naturels et conservent la force narrative. « Il n’eut pitié ni… » est idiomatique tout en rendant la compassion impliquée par חמל. « Entre ses mains » est l’expression française usuelle pour la remise au pouvoir du roi, malgré le singulier idiomatique de l’hébreu.
  terminology: « Chaldéens » est conservé, avec « Babyloniens » en alternative. « Sanctuaire » convient au registre sacré sans le calque français maladroit « maison de leur sanctuaire ». « Jeune fille » conserve l’ambiguïté lexicale de בְּתוּלָה ; la possibilité de « vierge » est signalée en note. La note sur « n’épargna » doit être ancrée à l’expression correspondante, non à la catégorie « homme très âgé ».
  issues:
  - severity: medium
    issue: « Il fit monter contre eux » est un calque peu idiomatique.
    rationale: Le hiphil de עלה exprime bien la causation, mais, dans ce contexte militaire, « fit venir contre eux » rend naturellement et fidèlement l’action sans imposer une élévation spatiale en français.
  - severity: medium
    issue: « Dans la maison de leur sanctuaire » est lourd et sémantiquement peu naturel en français.
    rationale: La construction hébraïque désigne le lieu sacré, le temple/sanctuaire. « Dans leur sanctuaire » transmet le référent et le caractère sacré sans créer l’image ambiguë d’une maison située à l’intérieur d’un sanctuaire.
  - severity: low
    issue: « Jeune fille vierge » tranche inutilement une nuance discutée de בְּתוּלָה.
    rationale: Dans cet emploi, בְּתוּלָה peut être rendu naturellement par « jeune fille », tandis que « vierge » demeure une possibilité lexicale à noter. Cette solution préserve l’ambiguïté sans supprimer l’alternative.
  - severity: low
    issue: La note donnant « n’épargna » est ancrée à « homme très âgé ».
    rationale: Cette alternative concerne וְלֹא חָמַל, rendu par « n’eut pitié », et doit donc être placée immédiatement après cette expression.
  revised_text: Alors il fit venir contre eux le roi des Chaldéens[a], qui tua leurs jeunes hommes par l’épée dans leur sanctuaire. Il n’eut pitié[c] ni du jeune homme ni de la jeune fille[b], ni du vieillard ni de l’homme très âgé. Il les livra tous entre ses mains.
  revised_footnotes:
