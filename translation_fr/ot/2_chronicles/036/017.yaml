    text: 'Ou « le roi des Babyloniens » ; hébreu : « des Chaldéens ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « vierge ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il n’épargna ni le jeune homme ni la jeune fille, ni le vieillard ni l’homme très âgé ».
    reason: lexical_alternative
