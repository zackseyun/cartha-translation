  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: fr
  text: Alors il fit venir contre eux le roi des Chaldéens[a], qui tua leurs jeunes hommes par l’épée dans leur sanctuaire. Il n’eut pitié[c] ni du jeune homme ni de la jeune fille[b], ni du vieillard ni de l’homme très âgé. Il les livra tous entre ses mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le roi des Babyloniens » ; hébreu : « des Chaldéens ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « vierge ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il n’épargna ni le jeune homme ni la jeune fille, ni le vieillard ni l’homme très âgé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: il fit monter contre eux
  rationale: Le hiphil de עלה conserve ici sa nuance causative dans un contexte militaire. Le sujet implicite, repris du contexte précédent, est Dieu.
- source_word: מֶלֶךְ כשדיים
  choice: le roi des Chaldéens
  rationale: « Chaldéens » représente directement le terme hébreu, même s’il peut désigner plus largement les Babyloniens.
- source_word: וַיַּהֲרֹג
  choice: qui tua
  rationale: La proposition relative rattache naturellement l’action au roi des Chaldéens sans modifier le sens du verbe.
- source_word: בַּחוּרֵיהֶם
  choice: leurs jeunes hommes
  rationale: בחור désigne couramment des hommes jeunes, dans la force de l’âge.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Cette formulation française naturelle exprime le moyen de mise à mort tout en gardant l’image concrète de l’hébreu.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: dans la maison de leur sanctuaire
  rationale: La formulation préserve les deux éléments de l’expression hébraïque et souligne la profanation du lieu sacré.
- source_word: וְלֹא חָמַל
  choice: il n’eut compassion
  rationale: חמל exprime le fait d’épargner par pitié ou compassion. La traduction retient sa dimension affective et morale.
- source_word: בָּחוּר וּבְתוּלָה
  choice: du jeune homme ni de la jeune fille vierge
  rationale: בתולה désigne spécifiquement une jeune femme vierge; l’ajout de « jeune fille » rend l’expression idiomatique en français sans effacer cette précision.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: du vieillard ni de l’homme très âgé
  rationale: La traduction distingue les deux termes proches et conserve l’intensification rhétorique liée à l’âge.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: Il les livra tous entre ses mains
  rationale: L’expression signifie remettre des personnes au pouvoir de quelqu’un. « Les livra tous » explicite le référent humain immédiat, tandis que « entre ses mains » conserve l’image hébraïque.
theological_decisions:
- issue: Sujet des verbes d’ouverture et de conclusion
  choice: Le pronom « il » renvoie à Dieu, conformément au contexte précédent; Dieu fait venir le roi chaldéen et lui livre tous les habitants concernés.
  alternative: Laisser le sujet impersonnel ou indéterminé.
  rationale: Les verbes hébreux sont au masculin singulier et leur sujet se déduit du verset précédent, où l’action judiciaire de l’Éternel est explicite. Le pronom maintient cette continuité sans ajouter d’interprétation confessionnelle.
- issue: Agent du meurtre et bénéficiaire de la remise
  choice: Le roi des Chaldéens est l’antécédent de « qui » et de « ses mains ».
  alternative: Comprendre que Dieu tue directement ou que le dernier pronom renvoie à un autre agent.
  rationale: La syntaxe et le déroulement narratif présentent le roi envahisseur comme l’agent humain de la tuerie et celui au pouvoir duquel tous sont livrés.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en trois phrases pour éviter une période excessivement lourde, tout en maintenant les enchaînements de l’hébreu. « Maison de leur sanctuaire » est volontairement plus formel que « temple » afin de préserver l’expression source.
