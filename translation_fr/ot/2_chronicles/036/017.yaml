revisions:
- from: Alors il fit monter contre eux le roi des Chaldéens[a], qui tua leurs jeunes hommes par l’épée dans la maison de leur sanctuaire. Il n’eut compassion ni du jeune homme ni de la jeune fille vierge[b], ni du vieillard ni de l’homme très âgé[c]. Il les livra tous entre ses mains.
  to: Alors il fit venir contre eux le roi des Chaldéens[a], qui tua leurs jeunes hommes par l’épée dans leur sanctuaire. Il n’eut pitié[c] ni du jeune homme ni de la jeune fille[b], ni du vieillard ni de l’homme très âgé. Il les livra tous entre ses mains.
  rationale: La révision remplace deux calques par des formulations françaises courantes tout en maintenant les rapports causatifs et narratifs du texte hébreu. Elle rend également בְּתוּלָה sans surdéterminer une nuance lexicale discutée et replace l’ancre de la note sur l’expression qu’elle explique.
