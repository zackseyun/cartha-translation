source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: fr
  text: Tous les objets de la maison de Dieu, grands et petits, les trésors[a] de la maison de Yahweh, ainsi que les trésors du roi et de ses hauts fonctionnaires[b] — il emporta tout à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner les salles du trésor ou les réserves.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de ses princes » ou « de ses dignitaires ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי
  choice: Tous les objets
  rationale: כְּלֵי désigne ici l’ensemble des objets ou instruments du temple. « Objets » est naturel en français moderne et reste assez large pour ne pas en préciser indûment la nature.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette formulation conserve l’image hébraïque de la « maison » tout en restant immédiatement compréhensible.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: grands et petits
  rationale: La paire coordonnée est conservée avec son rythme et peut évoquer aussi bien la taille que l’importance des objets.
- source_word: וְאֹצְרוֹת
  choice: les trésors
  rationale: Le nom peut désigner les réserves ou les locaux qui les contiennent. Puisque le passage décrit ce qui est emporté, « trésors » convient le mieux au contexte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » préserve l’expression hébraïque, et « Yahweh » représente directement le nom divin יְהוָה.
- source_word: וְאֹצְרוֹת הַמֶּלֶךְ וְשָׂרָיו
  choice: ainsi que les trésors du roi et de ses hauts fonctionnaires
  rationale: שָׂרָיו désigne les principaux dirigeants ou responsables du roi. « Hauts fonctionnaires » est clair et actuel, sans imposer le sens plus étroit de « princes ».
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: il emporta tout à Babylone
  rationale: « Tout » reprend la liste, comme הַכֹּל en hébreu. Le contexte de pillage justifie « emporta », tandis que le sujet singulier implicite renvoie à Nabuchodonosor dans le contexte précédent.
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » distingue le nom propre divin du titre אֲדֹנָי et suit ici l’orientation donnée par la couche de consultation révisée.
- issue: Relation entre « maison de Dieu » et « maison de Yahweh »
  choice: Conserver les deux désignations distinctes
  alternative: Uniformiser en « temple de Dieu » ou « temple de Yahweh »
  rationale: Le verset emploie d’abord אֱלֹהִים puis יְהוָה. Maintenir cette variation respecte la formulation du texte sans lui attribuer une distinction théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La longue énumération et la reprise finale par « tout » reproduisent la structure cumulative de l’hébreu; le tiret rend cette reprise claire sans alourdir la phrase.
