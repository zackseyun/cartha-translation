source:
  edition: WLC
  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: fr
  text: afin que s’accomplisse la parole de Yahweh transmise par Jérémie[a], jusqu’à ce que le pays ait joui de ses sabbats[b][c]. Durant tous les jours de sa dévastation, il se reposa[d], afin que soient accomplies soixante-dix années.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par l’intermédiaire de Jérémie ». Littéralement : « par la bouche de Jérémie ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut évoquer le fait de recevoir ou d’obtenir satisfaction. Le sens est que le pays reçut le repos sabbatique qui lui avait été refusé.
    reason: lexical_alternative
  - marker: c
    text: Cette formulation fait écho aux avertissements de l’alliance selon lesquels le pays jouirait de ses sabbats pendant l’exil (voir Lévitique 26.34-35).
    reason: cross_reference
  - marker: d
    text: Ou « il cessa ». L’hébreu conserve un jeu de mots entre « ses sabbats » et le verbe de même famille rendu ici par « se reposa ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: afin que s’accomplisse
  rationale: L’infinitif construit avec ל exprime ici le résultat ou le dessein. « S’accomplisse » convient naturellement à une parole prophétique devenue réalité.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: דבר désigne ici la parole prophétique. Le nom divin יהוה est rendu par « Yahweh », et non remplacé par un titre.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: transmise par Jérémie
  rationale: Littéralement « par la bouche de Jérémie ». La formulation retenue restitue en français courant l’idée que Jérémie est le porte-parole, tandis que la note conserve l’image hébraïque.
- source_word: רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ
  choice: le pays ait joui de ses sabbats
  rationale: Le pays est le sujet de רצה et reçoit enfin les repos sabbatiques dont il avait été privé. « Jouir de » maintient l’écho de Lévitique 26 sans imposer une interprétation plus précise que l’hébreu.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: Durant tous les jours de sa dévastation
  rationale: La formulation conserve l’étendue temporelle de כָּל יְמֵי et rapporte clairement la dévastation au pays.
- source_word: שָׁבָתָה
  choice: il observa le sabbat
  rationale: Le verbe peut signifier « cesser » ou « se reposer », mais cette traduction préserve son lien lexical intentionnel avec « ses sabbats ».
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: jusqu’à ce que soixante-dix années soient accomplies
  rationale: Cette tournure française exprime naturellement l’achèvement de la période annoncée et fait écho au premier « s’accomplisse ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Lien entre שַׁבְּתוֹתֶיהָ et שָׁבָתָה
  choice: « ses sabbats… observa le sabbat »
  alternative: « ses repos… se reposa »
  rationale: La répétition de la famille lexicale du sabbat relie explicitement la dévastation du pays à son repos sabbatique. La traduction conserve ce motif sans développer davantage sa portée théologique.
- issue: Portée de רָצְתָה
  choice: « ait joui de »
  alternative: « se soit acquitté de » ou « ait compensé »
  rationale: Le verbe permet plusieurs nuances dans ce contexte. Le texte principal retient une formulation idiomatique, et la note signale les autres compréhensions possibles sans trancher abusivement.
translation_notes:
  register: Français international moderne, digne et accessible. « Pays » est repris par le pronom masculin « il ». Le nom « Jérémie » suit sa forme française usuelle. La structure garde le caractère explicatif du verset et la répétition de l’idée d’accomplissement.
