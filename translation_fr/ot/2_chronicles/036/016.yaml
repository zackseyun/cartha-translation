source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: fr
  text: Mais ils ne cessaient de se moquer des messagers de Dieu[a], de mépriser ses paroles et de tourner ses prophètes en dérision, jusqu’à ce que la colère de Yahweh monte contre son peuple, jusqu’à ce qu’il n’y ait plus de remède[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des anges de Dieu ». Ici, le contexte favorise fortement « messagers », c’est-à-dire les envoyés humains de Dieu, puisque la proposition suivante parle de « ses prophètes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à ce qu’il n’y ait plus de guérison » ou « jusqu’à ce que ce soit incurable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ils ne cessaient de
  rationale: Associé aux participes qui suivent, le verbe forme une tournure périphrastique exprimant une conduite continue ou répétée dans le passé.
- source_word: מַלְעִבִים
  choice: se moquer de
  rationale: Le participe décrit une attitude de dérision méprisante. Cette formulation est naturelle en français moderne et conserve la force du terme.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: des messagers de Dieu
  rationale: מַלְאָךְ peut désigner un messager humain ou un ange. Le parallèle immédiat avec « ses prophètes » favorise ici les envoyés humains de Dieu, sans effacer l’autre sens possible, signalé en note.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: de mépriser ses paroles
  rationale: בזה exprime le mépris et le rejet dédaigneux; le pluriel דְּבָרָיו est rendu directement par « ses paroles ».
- source_word: וּמִתַּעְתְּעִים בִּנְבִיאָיו
  choice: de tourner ses prophètes en dérision
  rationale: Le verbe évoque les railleries et la dérision. Cette expression distingue ce troisième membre du premier tout en conservant la progression rhétorique.
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: jusqu’à ce que la fureur de Yahweh monte
  rationale: Après עַד, l’infinitif de עלה marque le point culminant de la situation. « Monte » conserve l’image du texte, tandis que « fureur » exprime l’intensité de חֵמָה.
- source_word: בְּעַמּוֹ
  choice: contre son peuple
  rationale: Avec la fureur divine, la préposition בְּ désigne ici naturellement l’objet contre lequel s’exerce le jugement.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: jusqu’à ce qu’il n’y ait plus de remède
  rationale: מַרְפֵּא peut signifier guérison ou remède. « Plus de remède » exprime naturellement en français le caractère désormais irréversible du jugement sans développer le texte.
theological_decisions:
- issue: Identité des « messagers de Dieu »
  choice: Des envoyés humains, en particulier prophétiques
  alternative: Les anges de Dieu
  rationale: Le nom hébreu permet les deux sens, mais la mention parallèle de « ses prophètes » et le contexte historique favorisent des représentants humains de Dieu. La note conserve l’ambiguïté lexicale réelle.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’absence de מַרְפֵּא
  choice: Il n’y avait plus de remède au jugement imminent
  alternative: Il n’y avait plus de guérison
  rationale: La formulation conserve la métaphore médicale et sa portée de jugement irréversible sans préciser au-delà du texte la nature exacte du remède.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait avec « ne cessaient de » rend la conduite persistante; la série de trois infinitifs préserve le rythme accusateur du texte hébreu. Le nom divin est translittéré « Yahweh ».
