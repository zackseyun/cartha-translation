  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: fr
  text: De plus, tous les chefs des prêtres et du peuple multiplièrent leurs infidélités[a], à l’exemple de toutes les pratiques abominables des nations, et ils souillèrent la maison de Yahweh[b], qu’il avait consacrée à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « multiplièrent leurs actes de trahison »; l’expression hébraïque souligne fortement leur déloyauté envers Dieu.'
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH.
    reason: divine_name
lexical_decisions:
- source_word: גַּם
  choice: De plus
  rationale: Marque la continuité et l’aggravation par rapport au contexte précédent, dans un français naturel.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: tous les chefs des prêtres et le peuple
  rationale: 'Respecte la construction hébraïque : שָׂרֵי désigne les chefs ou responsables des prêtres, tandis que וְהָעָם coordonne le peuple comme second sujet.'
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: multiplièrent leurs infidélités
  rationale: Rend l’intensification produite par le verbe רבה et l’expression de même racine מָעַל, tout en conservant la portée relationnelle et cultuelle de la déloyauté envers Dieu.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: se conformant à toutes les pratiques abominables des nations
  rationale: כְּכֹל exprime ici une conformité ou une comparaison. « Pratiques abominables » explicite naturellement que תּוֹעֵבוֹת désigne les actes religieux et moraux réprouvés.
- source_word: וַיְטַמְּאוּ
  choice: ils profanèrent
  rationale: Dans le contexte du sanctuaire, טמא signifie rendre impur ou souiller. « Profanèrent » exprime clairement en français l’atteinte à la sainteté du temple.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque du temple, et « Yahweh » représente directement le nom divin יהוה.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: qu’il avait consacrée à Jérusalem
  rationale: Le relatif renvoie naturellement à la maison; le plus-que-parfait indique que sa consécration précédait sa profanation.
theological_decisions:
- issue: Portée de מָעַל
  choice: infidélités
  alternative: trahisons; fautes sacrilèges
  rationale: « Infidélités » préserve la dimension de déloyauté envers Dieu sans réduire le terme à une infraction juridique ni exclure sa portée cultuelle.
- issue: Relation exprimée par כְּכֹל
  choice: se conformant à
  alternative: comme toutes les pratiques abominables; selon toutes les pratiques abominables
  rationale: La préposition כ permet une lecture comparative ou normative. « Se conformant à » restitue la correspondance de leur conduite avec celle des nations sans préciser indûment le mécanisme.
- issue: Traduction de יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Multiplièrent leurs infidélités » conserve l’intensité de l’hébreu; « maison » maintient l’expression traditionnelle sans empêcher de comprendre qu’il s’agit du temple.
