source:
  edition: WLC
  text: בֶּן שְׁמוֹנֶ֤ה שָׁנִים֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֤ה חֳדָשִׁים֙ וַ/עֲשֶׂ֣רֶת יָמִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: fr
  text: Jojakin avait huit ans[a] lorsqu’il devint roi, et il régna trois mois et dix jours à Jérusalem. Il fit ce qui est mal aux yeux de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En 2 Rois 24.8, on lit « dix-huit ans » au lieu de « huit ans ».
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: avait huit ans
  rationale: L’expression hébraïque de l’âge signifie littéralement « fils de huit ans » ; « avait huit ans » est son équivalent idiomatique en français.
- source_word: יְהוֹיָכִין
  choice: Jojakin
  rationale: Forme française courante du nom personnel hébreu.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge au moment de l’accession au trône ; cette formulation est naturelle en français.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: trois mois et dix jours
  rationale: Traduction directe et naturelle de la durée indiquée.
- source_word: מָלַךְ
  choice: il régna
  rationale: Équivalent français usuel du verbe מלך dans une notice royale.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, une ville se construit naturellement avec la préposition « à ».
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Cette formulation restitue l’idiome hébreu d’évaluation morale tout en restant claire et actuelle.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve la métaphore hébraïque de l’évaluation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française intelligible du nom divin, plutôt que substitution par un titre.
theological_decisions:
- issue: Tension chronologique avec 2 Rois 24.8, où Jojakin a dix-huit ans lors de son accession au trône
  choice: Conserver « huit ans » dans le texte principal
  alternative: « dix-huit ans »
  rationale: Le texte massorétique fourni porte « huit ans ». La traduction suit donc le texte source sans l’harmoniser avec le passage parallèle, tandis qu’une note signale la variante significative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’ordre général de la notice royale et l’expression imagée « aux yeux de Yahweh ».
