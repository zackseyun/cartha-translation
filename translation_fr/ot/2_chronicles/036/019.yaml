  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: fr
  text: Ils brûlèrent la maison de Dieu[a], démolirent la muraille de Jérusalem, livrèrent au feu tous ses palais et détruisirent tous ses objets précieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple de Dieu ». L’hébreu dit littéralement « la maison de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tous ses ustensiles précieux », « tous ses objets de valeur ». Le terme hébreu traduit par « objets » a un sens large.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: Ils brûlèrent
  rationale: Le qal narratif de שׂרף signifie simplement « brûler ». Le passé simple convient au registre narratif biblique français et le pronom « ils » explicite le sujet contenu dans la forme verbale à la troisième personne du pluriel.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Traduction directe de l’expression hébraïque. Elle désigne ici le temple, mais « maison de Dieu » conserve l’image et la formulation du texte source.
- source_word: וַיְנַתְּצוּ
  choice: démolirent
  rationale: נתץ exprime l’action d’abattre ou de démolir une construction. « Démolirent » est naturel avec « la muraille » et rend clairement la destruction structurelle.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: la muraille de Jérusalem
  rationale: Le singulier hébreu désigne l’enceinte urbaine dans son ensemble. « Muraille » est plus précis que le terme général « mur » dans ce contexte.
- source_word: אַרְמְנוֹתֶיהָ
  choice: tous ses palais
  rationale: אַרְמוֹן peut désigner un palais, une citadelle ou une grande demeure fortifiée. « Palais » est le sens courant ici; le possessif renvoie à Jérusalem.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: livrèrent au feu
  rationale: Cette formulation française naturelle conserve la mention explicite du feu et la répétition de l’idée de brûler présente dans l’hébreu, sans produire le tour lourd « brûlèrent avec le feu ».
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: tous ses objets précieux
  rationale: כְּלִי est un terme large pouvant désigner des objets, récipients, ustensiles ou instruments, tandis que מַחֲמַד exprime ce qui est précieux ou désirable. « Objets précieux » préserve cette généralité sans limiter indûment le référent aux seuls ustensiles cultuels.
- source_word: לְהַשְׁחִית
  choice: détruisirent
  rationale: L’infinitif hébreu exprime ici l’aboutissement ou le but destructeur de l’action. Une forme verbale coordonnée rend la séquence de manière idiomatique en français.
theological_decisions: []
