  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif soutenu sans archaïsme marqué. La répétition de la destruction par le feu est conservée, tandis que la dernière proposition est légèrement restructurée pour produire une coordination naturelle en français.
