id: 2CH.36.1
reference: 2 Chronicles 36:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: fr
  text: Alors les gens du pays prirent Joachaz, fils de Josias, et le firent roi à Jérusalem à la place de son père.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple du pays ». L’expression hébraïque peut désigner la population du pays et, dans certains contextes, un groupe social particulier en son sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: prirent
  rationale: Le verbe לקח signifie ici que les gens du pays choisirent ou prirent Joachaz pour l'établir roi. « S'emparèrent de » suggérerait une contrainte que le texte ne précise pas.
- source_word: עַם הָאָרֶץ
  choice: les gens du pays
  rationale: Cette formulation naturelle conserve l'expression hébraïque sans la réduire d'emblée à une classe sociale particulière; selon le contexte, elle peut désigner la population du pays ou un groupe déterminé en son sein.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Forme française biblique usuelle du nom propre hébreu.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: fils de Josias
  rationale: Traduction généalogique directe et idiomatique; « Josias » est la forme française usuelle.
- source_word: וַיַּמְלִיכֻהוּ
  choice: le firent roi
  rationale: Le hifil de מלך exprime le fait d'établir quelqu'un comme roi. Cette traduction garde le sens causatif sans ajouter l'idée d'une cérémonie de couronnement.
- source_word: תַּחַת אָבִיו
  choice: à la place de son père
  rationale: תחת marque ici le remplacement dans la succession royale, et non une position spatiale ou une subordination.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Avec un verbe exprimant l'établissement dans une fonction, le français idiomatique emploie « à Jérusalem ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Les gens du pays » est plus naturel en français courant que le calque « le peuple du pays », tandis que la note préserve l'expression plus formelle et son ambiguïté sociale.
