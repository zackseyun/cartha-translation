source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: fr
  text: Yahvé, le Dieu de leurs ancêtres, leur adressa sans relâche[a] des messages par l’intermédiaire de ses messagers, car il avait compassion de son peuple et de sa demeure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « se levant tôt et envoyant » : idiome hébreu exprimant un envoi répété, empressé et persistant.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple, considéré comme le lieu où Dieu demeure au milieu de son peuple.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, plutôt qu’un remplacement par un titre.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs ancêtres
  rationale: « Ancêtres » rend naturellement le sens historique et collectif de אָבוֹת en français moderne.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: leur adressa des messages
  rationale: Le verbe signifie « envoyer »; l’objet implicite est ici le message transmis par les messagers. Cette formulation française rend clairement l’acte de communication sans ajouter le contenu des messages.
- source_word: בְּיַד מַלְאָכָיו
  choice: par l’intermédiaire de ses messagers
  rationale: L’expression hébraïque « par la main de » marque ici l’intermédiaire ou l’agent. Une traduction idiomatique évite un calque obscur en français.
- source_word: מַלְאָכָיו
  choice: ses messagers
  rationale: Dans le contexte, il s’agit des envoyés humains, notamment prophétiques; « anges » orienterait indûment vers des êtres célestes.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: sans relâche
  rationale: La construction idiomatique, littéralement liée au fait de se lever tôt et d’envoyer, exprime l’empressement et la répétition persistante. Le sens est donné dans le texte et l’image hébraïque en note.
- source_word: כִּי חָמַל
  choice: car il avait compassion
  rationale: חמל désigne une compassion qui pousse à épargner. Cette traduction conserve ici le motif explicitement causal.
- source_word: עַל עַמּוֹ
  choice: de son peuple
  rationale: Après « avoir compassion », la préposition française « de » est la construction naturelle correspondant à עַל.
- source_word: מְעוֹנוֹ
  choice: sa demeure
  rationale: Le terme désigne un lieu d’habitation et renvoie ici au temple comme lieu de la présence de Dieu, sans substituer directement l’interprétation au mot hébreu.
theological_decisions:
- issue: Identité des « messagers »
  choice: Des envoyés humains, notamment prophétiques
  alternative: Des anges célestes
  rationale: Le contexte immédiat porte sur les avertissements répétés adressés à Juda avant le jugement. « Messagers » garde le sens lexical sans introduire une lecture angélique.
- issue: Référent de « sa demeure »
  choice: Conserver l’expression « sa demeure »
  alternative: Traduire explicitement par « son temple »
  rationale: Le temple de Jérusalem est bien le référent contextuel, mais le texte hébreu met en avant la notion de demeure divine. La traduction préserve ainsi le lien théologique entre le sanctuaire et la présence de Dieu.
- issue: Compassion de Dieu envers le peuple et le sanctuaire
  choice: Maintenir les deux objets de la compassion
  alternative: Reformuler la compassion comme un simple délai du jugement
  rationale: Le texte attribue explicitement à Dieu de la compassion envers son peuple et sa demeure; il ne faut ni réduire ni expliquer cette affirmation en fonction de la destruction qui suit.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase évite le calque « par la main de » tout en conservant « messagers » et « demeure », qui portent les nuances du texte hébreu. La répétition « messages / messagers » reste intelligible et reflète le lien sémantique du passage.
