id: 2CH.36.13
reference: 2 Chronicles 36:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: fr
  text: Il se révolta aussi contre le roi Nabuchodonosor, qui lui avait fait prêter serment par Dieu[a] ; il raidit sa nuque[b] et endurcit son cœur, refusant de revenir à Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui l’avait lié par un serment devant Dieu ». L’hébreu peut mettre l’accent soit sur le fait de lui faire prêter serment, soit sur le caractère solennel du serment en relation avec Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant une résistance obstinée.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Il… aussi
  rationale: Rend la valeur additive de l’expression tout en donnant à la phrase une tournure française naturelle.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: se révolta contre le roi Nabuchodonosor
  rationale: Avec מָרַד, la préposition ב désigne l’autorité contre laquelle la révolte est dirigée. « Se révolta contre » exprime clairement cette opposition politique.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵאלֹהִים
  choice: qui lui avait fait prêter serment par Dieu
  rationale: Le causatif de שׁבע signifie faire jurer ou faire prêter serment. « Par Dieu » rend directement בֵאלֹהִים sans exclure la nuance d’un serment contracté devant Dieu.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: il raidit sa nuque
  rationale: La traduction conserve l’image hébraïque de la nuque raide, qui évoque une résistance obstinée, et l’accompagne d’une note explicative.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: endurcit son cœur
  rationale: Bien que אמץ puisse signifier « fortifier », le contexte de refus obstiné justifie ici « endurcit », expression française claire qui conserve l’image du cœur.
- source_word: מִשּׁוּב אֶל
  choice: refusant de revenir à
  rationale: 'Le מִן joint à l’infinitif exprime ici l’éloignement ou l’empêchement : l’endurcissement se manifeste par le refus de revenir. Cette formulation naturelle évite de surdéterminer le rapport syntaxique.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque et préserve l’identification covenantale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Rapport entre l’endurcissement du cœur et le retour à Dieu
  choice: endurcit son cœur, refusant de revenir
  alternative: endurcit son cœur pour ne pas revenir
  rationale: Le syntagme מִשּׁוּב indique que son obstination l’écarte du retour à Yahweh. Le participe « refusant » exprime ce lien sans imposer une nuance finale plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les deux images corporelles du texte hébreu — la nuque raidie et le cœur endurci — tout en explicitant discrètement leur portée par le contexte et la note.
