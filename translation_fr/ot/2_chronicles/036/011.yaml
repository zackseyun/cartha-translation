lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: avait vingt et un ans
  rationale: Dans cette formule d’âge, בֶּן suivi d’un nombre indique idiomatiquement l’âge. « Avait vingt et un ans » est l’équivalent naturel en français moderne.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et couramment reconnue du nom royal.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction avec בְ marque ici le moment de l’accession au trône. Cette formulation rend clairement et naturellement le sens temporel.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: onze ans
  rationale: Le groupe nominal indique directement la durée du règne.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté; « régner » en est l’équivalent français précis et concis.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition idiomatique devant un nom de ville est « à ».
