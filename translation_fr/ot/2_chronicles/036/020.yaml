base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: fr
  text: Il déporta à Babylone le reste de ceux que l’épée avait épargnés. Ils devinrent les esclaves du roi et de ses fils, jusqu’à l’avènement de la royauté perse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Il déporta
  rationale: La forme causative de גלה décrit ici le transfert forcé des survivants en exil. « Déporta » exprime clairement cette contrainte en français actuel.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: le reste de ceux que l’épée avait épargnés
  rationale: Cette formulation conserve l’idée d’un reste tout en rendant naturellement l’expression littérale « le reste [provenant] de l’épée », c’est-à-dire les survivants du massacre.
- source_word: אֶל בָּבֶל
  choice: à Babylone
  rationale: Rend directement et naturellement la destination indiquée par la préposition אֶל.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: Ils devinrent ses esclaves, ainsi que ceux de ses fils
  rationale: עֲבָדִים peut désigner des serviteurs ou des esclaves. Le contexte de conquête, de déportation et d’assujettissement forcé favorise « esclaves ». La tournure française évite la construction peu naturelle « esclaves pour lui ».
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: jusqu’à l’avènement du royaume de Perse
  rationale: L’infinitif מְלֹךְ marque ici l’entrée en exercice du pouvoir perse. « Avènement » exprime de façon concise et idiomatique le commencement de cette domination.
theological_decisions:
- issue: Statut des déportés désignés par עֲבָדִים
  choice: esclaves
  alternative: serviteurs
  rationale: Le terme hébreu couvre les deux sens, mais ces survivants ont été déportés et soumis à une dynastie conquérante. « Esclaves » rend mieux le caractère coercitif de leur condition sans effacer l’ambiguïté lexicale, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme est réparti en deux phrases pour éviter une période trop lourde, tandis que « le reste » préserve l’écho biblique de la notion de survivants.
