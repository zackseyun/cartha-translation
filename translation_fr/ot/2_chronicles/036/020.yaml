revisions:
- from: Il déporta à Babylone le reste de ceux que l’épée avait épargnés. Ils devinrent ses esclaves[a], ainsi que ceux de ses fils, jusqu’à l’avènement du royaume de Perse.
  to: Il déporta à Babylone le reste de ceux que l’épée avait épargnés. Ils devinrent les esclaves du roi et de ses fils, jusqu’à l’avènement de la royauté perse.
  rationale: 'La révision explicite le lien de dépendance des déportés envers le roi babylonien et ses fils, sans ajouter d''identification absente du texte : « le roi » reprend naturellement le sujet du contexte immédiat. Elle rend également מַלְכוּת פָּרָס par « royauté perse », tout en préservant le sens temporel de l''accession au pouvoir perse. La note maintient l''ambiguïté lexicale de עֲבָדִים.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : déportation à Babylone des survivants de l''épée, mise au service du roi babylonien et de ses fils, puis limite temporelle à l''établissement de la domination perse. Toutefois, « ceux de ses fils » est structurellement ambigu en français et ne rend pas explicitement que les déportés devinrent aussi les esclaves des fils. « Jusqu’à l’avènement du royaume de Perse » est acceptable, mais « jusqu’à l’avènement de la royauté perse » reflète plus directement מַלְכוּת פָּרָס et évite de présenter nécessairement la Perse comme un royaume territorial au sens moderne.'
  naturalness: Le français est globalement naturel et de registre biblique moderne. La reprise elliptique « ainsi que ceux de ses fils » est néanmoins maladroite et peut se comprendre comme si les fils avaient leurs propres esclaves, sans relier clairement les mêmes déportés à eux. Une formulation parallèle est plus nette.
  terminology: « Déporta », « le reste », « l’épée » et « esclaves » conviennent. Dans ce contexte de conquête et de déportation, « esclaves » est défendable pour עֲבָדִים, tandis que la note conserve l’alternative lexicale « serviteurs ». « Royauté perse » est un équivalent précis et naturel de מַלְכוּת פָּרָס.
  issues:
  - severity: medium
    issue: Ambiguïté de « Ils devinrent ses esclaves, ainsi que ceux de ses fils »
    rationale: La coordination elliptique ne dit pas avec assez de clarté que les mêmes personnes devinrent les esclaves du roi et de ses fils. Le datif possessif hébreu לו ולבניו appelle une formulation explicite en français.
  - severity: low
    issue: « Royaume de Perse » pour מַלְכוּת פָּרָס
    rationale: La formule est possible, mais « royauté perse » rend plus directement le nom abstrait מַלְכוּת, qui désigne ici l'exercice du pouvoir perse.
  revised_text: Il déporta à Babylone le reste de ceux que l’épée avait épargnés. Ils devinrent les esclaves du roi et de ses fils, jusqu’à l’avènement de la royauté perse.
  revised_footnotes:
  - marker: a
    text: Ou « serviteurs ». Le terme hébreu peut désigner des serviteurs ou des esclaves ; dans ce contexte de conquête et de déportation, « esclaves » paraît préférable.
    reason: alternative lexicale
  revision_rationale: 'La révision explicite le lien de dépendance des déportés envers le roi babylonien et ses fils, sans ajouter d''identification absente du texte : « le roi » reprend naturellement le sujet du contexte immédiat. Elle rend également מַלְכוּת פָּרָס par « royauté perse », tout en préservant le sens temporel de l''accession au pouvoir perse. La note maintient l''ambiguïté lexicale de עֲבָדִים.'
