  text: עָלָ֣י/ו עָלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יַּֽאַסְרֵ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם לְ/הֹלִיכ֖/וֹ בָּבֶֽלָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/006.yaml
  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: fr
  text: Nabuchodonosor, roi de Babylone, monta contre lui et l’attacha avec des entraves de bronze pour l’emmener à Babylone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des chaînes de bronze » ou « avec des fers de bronze ». Le terme hébreu désigne des liens de bronze servant à le maintenir prisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: monta contre lui
  rationale: L’expression militaire עָלָה עַל désigne une avancée hostile contre quelqu’un. « Monta contre lui » conserve l’image directionnelle et le caractère hostile sans préciser davantage la nature de l’affrontement.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du roi babylonien.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Le groupe construit indique le titre royal de Nabuchodonosor; l’apposition sans article est naturelle en français.
- source_word: וַיַּאַסְרֵהוּ
  choice: l’attacha
  rationale: Le verbe אָסַר signifie attacher ou lier, notamment un prisonnier. « L’attacha » rend directement l’action, que précise ensuite la mention des entraves.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: avec des entraves de bronze
  rationale: Le terme désigne des liens ou instruments de contention en bronze, vraisemblablement appariés. « Entraves » reste naturel et laisse ouverte leur forme exacte.
- source_word: לְהֹלִיכוֹ
  choice: pour l’emmener
  rationale: Le hifil de הלך exprime ici le fait de faire aller quelqu’un; dans ce contexte de captivité, « emmener » rend naturellement le déplacement imposé.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le hé directionnel marque le mouvement vers Babylone; « à Babylone » en donne l’équivalent français idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’idiome militaire « monta contre lui » et évite de préciser indûment la forme exacte des liens de bronze.
