  text: וַ/יְסִירֵ֥/הוּ מֶֽלֶךְ מִצְרַ֖יִם בִּֽ/ירוּשָׁלִָ֑ם וַֽ/יַּעֲנֹשׁ֙ אֶת הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: fr
  text: Le roi d’Égypte le destitua à Jérusalem[a] et imposa au pays une amende de cent talents d’argent et d’un talent d’or[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier qu’il l’écarta ou l’emmena.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « exigea du pays une contribution de » ; le verbe désigne l’imposition d’une sanction financière.'
    reason: lexical_alternative
  - marker: c
    text: Le talent était une importante unité de poids de l’Antiquité ; l’ancienne mesure est conservée plutôt que convertie.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: le destitua
  rationale: La forme causative de סוּר signifie « écarter, enlever ». Dans ce contexte royal, « destituer » exprime naturellement le retrait de Joachaz de sa fonction, tandis que la note conserve la possibilité plus large d’un éloignement physique.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: Rendu direct et naturel de la construction hébraïque, sans ajouter le nom du pharaon absent de ce verset.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: La préposition ב marque ici le lieu. En français, « à Jérusalem » est la tournure idiomatique.
- source_word: וַיַּעֲנֹשׁ
  choice: imposa … une amende
  rationale: Le verbe עָנַשׁ désigne ici l’imposition d’une sanction financière, comme le montrent les sommes précisées. « Amende » est plus exact que « tribut », qui pourrait suggérer un prélèvement régulier plutôt qu’une pénalité.
- source_word: הָאָרֶץ
  choice: au pays
  rationale: אָרֶץ désigne ici le territoire ou royaume de Juda. « Le pays » est clair et naturel dans le récit historique.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: cent talents d’argent
  rationale: כִּכָּר est une ancienne unité de poids traditionnellement appelée « talent ». La conserver évite une conversion moderne incertaine.
- source_word: וְכִכַּר זָהָב
  choice: et d’un talent d’or
  rationale: Le texte emploie la même unité au singulier pour l’or; la coordination avec « une amende de » exige naturellement « et d’un » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Destitua » convient au contexte politique, « imposa au pays une amende » rend explicitement la sanction financière, et les anciennes unités sont maintenues dans le texte.
