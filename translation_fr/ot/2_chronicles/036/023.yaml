source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: fr
  text: 'Voici ce que dit Cyrus, roi de Perse : « Yahvé, le Dieu du ciel, m’a donné tous les royaumes de la terre et m’a chargé de lui bâtir une maison à Jérusalem, qui se trouve en Juda. Quiconque parmi vous fait partie de son peuple, que Yahvé, son Dieu, soit avec lui, et qu’il monte[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: C’est-à-dire qu’il monte à Jérusalem. Dans la langue biblique, on « monte » traditionnellement vers la ville sainte.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française naturelle et digne pour introduire une proclamation royale, tout en conservant la valeur déclarative de l’hébreu.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Cyrus, roi de Perse
  rationale: Emploie la forme française consacrée du nom et rend directement le titre royal en apposition.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: tous les royaumes de la terre
  rationale: Conserve la portée géopolitique étendue de אֶרֶץ sans la préciser davantage par « monde ».
- source_word: נָתַן לִי
  choice: m’a donné
  rationale: Le passé composé exprime naturellement en français une action passée dont le résultat demeure présent.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française usuelle du nom divin, qui représente directement le tétragramme.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: le Dieu du ciel
  rationale: Expression française consacrée et fidèle à la construction hébraïque.
- source_word: וְהוּא פָקַד עָלַי
  choice: et m’a chargé
  rationale: פָקַד désigne ici l’attribution autorisée d’une mission; « charger de » restitue à la fois l’ordre et la responsabilité confiée.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: de lui bâtir une maison
  rationale: « Maison » conserve le mot hébreu בַיִת et sa résonance théologique, sans expliciter prématurément « temple ».
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: à Jérusalem, qui se trouve en Juda
  rationale: Reproduit explicitement la proposition relative tout en restant naturel en français.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Qui parmi vous fait partie de son peuple ?
  rationale: Rend la formulation hébraïque comprimée comme une invitation interrogative intelligible; la valeur partitive de מִן est exprimée par l’appartenance au peuple.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: Que Yahvé, son Dieu, soit avec lui
  rationale: Le contexte favorise une bénédiction ou un souhait; le subjonctif français en rend naturellement la force, tout en signalant en note la lecture indicative possible.
- source_word: וְיָעַל
  choice: et qu’il monte
  rationale: Conserve l’idiome biblique de la montée vers Jérusalem ainsi que la nuance jussive de l’invitation.
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahvé » le représente explicitement dans la forme française courante sans le remplacer par un titre.
- issue: Sens de בַיִת dans la mission donnée à Cyrus
  choice: maison
  alternative: temple
  rationale: Le mot hébreu signifie littéralement « maison » et désigne ici la maison de Dieu. Le garder préserve le vocabulaire et sa portée théologique, tandis que le contexte permet d’identifier le temple.
- issue: Force de יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'bénédiction : « Que Yahvé, son Dieu, soit avec lui »'
  alternative: 'affirmation : « Yahvé, son Dieu, est avec lui »'
  rationale: Dans la formule finale d’invitation, une bénédiction accompagne naturellement l’appel à monter. L’hébreu nominal permet néanmoins aussi une lecture indicative, conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La proclamation royale demeure solennelle sans archaïsmes. « Bâtir » convient au registre biblique tout en restant courant; la syntaxe finale préserve l’invitation et la bénédiction du texte hébreu.
