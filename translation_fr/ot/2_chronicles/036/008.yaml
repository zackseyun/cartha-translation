base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: fr
  text: Le reste des actes de Jojakim, ses abominations, qu’il commit, et ce qui fut trouvé à sa charge[a], les voici consignés dans le Livre des rois d’Israël et de Juda. Son fils Jojakin régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui fut trouvé à son sujet ». L’expression hébraïque peut désigner, de façon générale, ce qui fut découvert concernant Jojakim, bien que « à sa charge » convienne mieux au contexte négatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans la formule récapitulative royale, דִּבְרֵי désigne les faits ou actes du règne plutôt que de simples « paroles ». Le préfixe וְ n’exige pas ici l’ajout d’un marqueur temporel comme « maintenant ».
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: les abominations qu’il commit
  rationale: תֹּועֵבָה porte un jugement moral ou cultuel très fort, que « abominations » conserve. En français, « commettre » s’emploie naturellement avec de tels actes et rend le verbe עָשָׂה sans lourdeur.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: et ce qui fut trouvé à sa charge[a]
  rationale: Le participe passif de מצא avec עַל peut désigner ce qui fut découvert contre Jojakim, sans nécessairement évoquer une procédure judiciaire formelle. « À sa charge » garde la nuance défavorable tout en laissant l’expression assez générale.
- source_word: הִנָּם כְּתוּבִים
  choice: voilà, tout cela est écrit
  rationale: « Voilà » conserve la valeur déictique et emphatique de הִנָּם. « Tout cela » rassemble naturellement en français les éléments précédents, tandis que « est écrit » traduit directement le participe passif.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: le Livre des rois d’Israël et de Juda
  rationale: La majuscule à « Livre » signale une référence à un ouvrage déterminé, tout en conservant littéralement le titre hébreu.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: Son fils Jojakin régna à sa place
  rationale: 'Cette formulation française concise reproduit la notice de succession royale : Jojakin succède à son père comme roi.'
theological_decisions:
- issue: Portée de וְהַנִּמְצָא עָלָיו
  choice: ce qui fut trouvé à sa charge
  alternative: ce qui fut trouvé à son sujet
  rationale: Le contexte immédiatement négatif favorise une lecture défavorable, mais l’hébreu peut être compris plus généralement. La note conserve donc cette ambiguïté au lieu de la supprimer.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Les noms « Jojakim » et « Jojakin » suivent une graphie biblique française courante. « Voilà » maintient l’emphase du texte hébreu sans recourir à l’archaïsme « voici ».
