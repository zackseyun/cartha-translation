  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: fr
  text: Joachaz avait vingt-trois ans lorsqu’il devint roi[a], et il régna trois mois à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « était fils de vingt-trois ans », tournure hébraïque courante pour indiquer l’âge.'
