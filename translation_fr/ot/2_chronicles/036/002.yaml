lexical_decisions:
- source_word: בֶּן שָׁלֹושׁ וְעֶשְׂרִים שָׁנָה
  choice: avait vingt-trois ans
  rationale: L’expression hébraïque, littéralement « fils de vingt-trois ans », est une tournure idiomatique indiquant l’âge. La formulation française naturelle en transmet exactement le sens.
- source_word: יוֹאָחָז
  choice: Joachaz
  rationale: « Joachaz » est la forme française biblique traditionnelle et reconnaissable du nom hébreu.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition avec la forme verbale situe l’âge au moment de l’accession au trône. Cette formulation est claire et naturelle en français moderne.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: et il régna trois mois
  rationale: Le waw coordonne cette donnée à la proposition précédente; le français conserve naturellement la coordination dans la phrase.
- source_word: מָלַךְ
  choice: il régna
  rationale: Dans une notice royale, « régner » est l’équivalent français précis et concis du verbe hébreu.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, on emploie naturellement la préposition « à » devant un nom de ville pour indiquer le lieu.
