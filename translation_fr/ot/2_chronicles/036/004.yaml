base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: fr
  text: Le roi d’Égypte établit Éliakim, frère de Joachaz, comme roi de Juda et de Jérusalem, et changea son nom en Joakim. Néko prit Joachaz, frère d’Éliakim, et l’emmena en Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: établit … comme roi
  rationale: 'Le hifil de מלך a ici un sens causatif : le roi d’Égypte installe Éliakim sur le trône.'
- source_word: אֶלְיָקִים אָחִיו
  choice: Éliakim, frère de Joachaz
  rationale: Le pronom « son » renvoie contextuellement à Joachaz. Répéter son nom en français lève une ambiguïté grammaticale artificielle sans modifier le lien familial exprimé par l’hébreu.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: roi de Juda et de Jérusalem
  rationale: Avec l’établissement royal, עַל désigne le territoire placé sous l’autorité d’Éliakim. La tournure choisie est naturelle en français et conserve les deux lieux.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ יְהוֹיָקִים
  choice: changea son nom en Joakim
  rationale: L’expression signifie qu’il lui imposa un nouveau nom. Cette formulation française reste proche de l’idiome hébreu.
- source_word: נְכוֹ
  choice: Néko
  rationale: Translittération française directe de la forme hébraïque, avec accent pour guider la prononciation.
- source_word: לָקַח
  choice: prit
  rationale: Le verbe signifie simplement « prendre » ici. Une traduction comme « captura » ou « déporta » préciserait davantage que le texte.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: et l’emmena en Égypte
  rationale: Le hé directionnel indique un mouvement vers l’Égypte. « Emmena » convient à une personne conduite vers un autre lieu.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. Les noms propres suivent des formes françaises bibliques courantes lorsque celles-ci sont bien établies : Éliakim, Joachaz et Joakim. La coordination hébraïque est conservée sans introduire un contraste explicite par « mais ».'
