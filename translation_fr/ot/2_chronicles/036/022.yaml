  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: fr
  text: 'La première année de Cyrus, roi de Perse, afin que s’accomplisse la parole de Yahweh prononcée par Jérémie[a], Yahweh éveilla l’esprit de Cyrus, roi de Perse. Celui-ci fit publier dans tout son royaume, oralement et par écrit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la bouche de Jérémie »; autre traduction possible : « transmise par Jérémie ».'
    reason: L’expression hébraïque souligne la médiation orale du prophète; le texte principal emploie une formulation française plus naturelle.
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: La première année
  rationale: Formule chronologique naturelle en français; le waw assure la continuité narrative sans exiger un « et » initial.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: afin que s’accomplisse la parole de Yahweh
  rationale: Dans ce contexte prophétique, l’infinitif exprime l’aboutissement ou l’accomplissement de la parole divine.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: prononcée par Jérémie
  rationale: Rend naturellement l’idée de médiation orale portée par l’expression littérale « par la bouche de Jérémie ».
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כוֹרֶשׁ
  choice: Yahweh éveilla l’esprit de Cyrus
  rationale: « Éveilla » conserve l’image du verbe hébreu, et « esprit » maintient la portée volontaire et intérieure de רוּחַ sans la réduire à la seule pensée.
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: Celui-ci fit publier dans tout son royaume
  rationale: L’idiome désigne la diffusion publique d’une proclamation dans l’ensemble du royaume.
- source_word: וְגַם בְּמִכְתָּב
  choice: oralement et par écrit
  rationale: Le texte associe la proclamation diffusée et sa forme écrite; cette formulation française rend clairement les deux modes de communication.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français le contenu direct de l’édit qui suit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Sens de רוּחַ appliqué à Cyrus
  choice: l’esprit de Cyrus
  alternative: les dispositions de Cyrus
  rationale: « Esprit » préserve la formulation et l’amplitude sémantique de l’hébreu, sans décider s’il s’agit surtout de volonté, d’élan intérieur ou de disposition.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement segmentée pour éviter une longue période lourde. « Celui-ci » désambiguïse le sujet de la proclamation. Le marqueur [a] figure dans le texte principal.
