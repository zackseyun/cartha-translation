source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, son Dieu, et il ne s’humilia pas devant le prophète Jérémie, qui parlait de la part de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la bouche de Yahweh ».'
    reason: La note préserve l’image hébraïque concrète derrière l’expression française idiomatique « de la part de Yahweh ».
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: La formule hébraïque signifie naturellement « faire ce qui est mal ». Le passé simple convient au registre narratif biblique français sans alourdir la phrase avec le waw initial.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française conserve fidèlement l’image hébraïque et indique que l’acte est évalué du point de vue de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe possessif est conservé, car il souligne la relation de Sédécias avec Dieu et sa responsabilité envers lui.
- source_word: לֹא נִכְנַע
  choice: il ne s’humilia pas
  rationale: 'Le niphal de כנע a ici une valeur réfléchie ou moyenne : Sédécias refusa de s’abaisser. Cette formulation rend le sens moral et religieux du contexte.'
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: devant le prophète Jérémie
  rationale: « Devant » exprime simplement la relation marquée par la préposition, tandis que l’ordre français naturel place le titre avant le nom.
- source_word: מִפִּי יְהוָה
  choice: qui parlait de la part de Yahweh
  rationale: L’hébreu signifie littéralement « de la bouche de Yahweh » et caractérise Jérémie comme transmettant la parole divine. La proposition relative explicite naturellement cette relation implicite, tandis que la note conserve l’image originale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel divin. Sa translittération préserve cette donnée sans lui substituer un titre.
- issue: Relation de מִפִּי יְהוָה avec Jérémie
  choice: Jérémie parlait de la part de Yahweh
  alternative: Sédécias ne s’humilia pas sur l’ordre de Yahweh
  rationale: La proximité syntaxique avec « le prophète Jérémie » favorise l’idée que Jérémie transmet la parole venant de Yahweh. La formulation maintient son rôle prophétique sans ajouter le contenu de son message.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif; les expressions « aux yeux de » et « s’humilia » restent naturelles tout en étant proches de l’hébreu.
