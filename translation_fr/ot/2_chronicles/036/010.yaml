  text: וְ/לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֗ה שָׁלַח֙ הַ/מֶּ֣לֶךְ נְבֽוּכַדְנֶאצַּ֔ר וַ/יְבִאֵ֣/הוּ בָבֶ֔לָ/ה עִם כְּלֵ֖י חֶמְדַּ֣ת בֵּית יְהוָ֑ה וַ/יַּמְלֵךְ֙ אֶת צִדְקִיָּ֣הוּ אָחִ֔י/ו עַל יְהוּדָ֖ה וִֽ/ירוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: fr
  text: Au retour de l’année[a], le roi Nabuchodonosor envoya chercher Joachin et le fit amener à Babylone avec les objets précieux de la maison de Yahweh[b]. Puis il établit Sédécias, son frère[c], comme roi sur Juda et Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au retour de l’année », expression évoquant le moment où le cycle de l’année revient.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les ustensiles de valeur du temple de Yahweh ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « son frère ». Sédécias était un proche parent de Joachin, plus précisément son oncle.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: Au retour de l’année
  rationale: Cette formulation conserve l’image de l’hébreu, qui évoque le retour ou le renouvellement du cycle annuel, sans préciser qu’il s’agit du printemps.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: envoya chercher Joachin et le fit amener
  rationale: Le sujet implicite du pronom est explicité d’après le verset précédent pour éviter toute confusion. Cette tournure française exprime naturellement l’ordre donné par le roi et la valeur causative de « faire venir/amener ».
- source_word: בָבֶלָה
  choice: à Babylone
  rationale: Le hé directionnel indique un mouvement vers Babylone.
- source_word: כְּלֵי חֶמְדַּת
  choice: les objets précieux
  rationale: כְּלִי peut désigner divers objets ou ustensiles, tandis que חֶמְדָּה souligne leur caractère précieux ou désirable. « Objets » évite de limiter indûment le sens à des récipients.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque désignant le temple, et « Yahweh » représente directement le nom divin.
- source_word: וַיַּמְלֵךְ
  choice: il établit ... comme roi
  rationale: Le hiphil signifie faire régner ou instituer comme roi. La formulation choisie est naturelle et précise en français.
- source_word: אָחִיו
  choice: son frère
  rationale: La traduction maintient le terme de parenté présent dans le texte hébreu, sans résoudre dans le corps du texte la tension avec les données généalogiques.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: sur Juda et Jérusalem
  rationale: La préposition עַל indique ici le territoire sur lequel Sédécias reçoit l’autorité royale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Lien de parenté entre Sédécias et Joachin
  choice: son frère
  alternative: son proche parent / son oncle
  rationale: L’hébreu dit littéralement « son frère ». La traduction préserve cette formulation et place la précision généalogique en note, afin de ne pas effacer une tension réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase explicite Joachin, antécédent du pronom hébreu situé au verset précédent. Elle conserve l’idiome temporel, l’expression « maison de Yahweh » et le terme de parenté littéral, avec les éclaircissements nécessaires en notes.
