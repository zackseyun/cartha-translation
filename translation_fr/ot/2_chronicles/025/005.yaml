  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: fr
  text: Amasias rassembla les hommes de Juda et les organisa par clans, sous les chefs de milliers et de centaines, pour l’ensemble de Juda et de Benjamin. Il recensa ceux qui avaient vingt ans ou plus et trouva trois cent mille hommes choisis[a], aptes au service militaire[b], portant la lance et le grand bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeunes hommes ». Le mot hébreu peut désigner de jeunes hommes, mais, dans ce recensement militaire, il peut aussi évoquer des hommes choisis et valides.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sortant pour l’armée » ou « sortant pour la guerre », expression hébraïque désignant ceux qui sont en état d’accomplir le service militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ אֶת־יְהוּדָה
  choice: rassembla les hommes de Juda
  rationale: Le verbe קבץ signifie rassembler. L’ajout explicatif « les hommes de » évite en français de donner l’impression que le roi rassemble un territoire, alors que le contexte est celui d’un recensement militaire.
- source_word: וַיַּעֲמִידֵם לְבֵית אָבוֹת
  choice: les répartit selon leurs familles ancestrales
  rationale: Le hiphil de עמד exprime ici la mise en place ou l’organisation des hommes. בית אבות désigne leurs subdivisions lignagères ou maisons paternelles ; « familles ancestrales » en communique naturellement la fonction sociale.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: sous les chefs de milliers et les chefs de centaines
  rationale: שׂרים désigne des responsables ou chefs. La formulation conserve les unités hiérarchiques du texte sans supposer qu’elles comptaient toujours exactement mille ou cent hommes.
- source_word: וַיִּפְקְדֵם
  choice: Il recensa
  rationale: Dans ce contexte militaire, פקד désigne le dénombrement ou la revue des hommes mobilisables. « Recensa » exprime clairement le résultat numérique qui suit.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ceux qui avaient vingt ans ou plus
  rationale: Formulation française actuelle et naturelle de l’âge minimal indiqué par l’hébreu.
- source_word: בָּחוּר
  choice: hommes d’élite
  rationale: בחור peut désigner de jeunes hommes ou, dans un cadre militaire, des hommes choisis et valides. Le choix principal suit le contexte tout en conservant l’autre possibilité en note.
- source_word: יוֹצֵא צָבָא
  choice: aptes au service militaire
  rationale: L’expression signifie littéralement « sortant pour l’armée/la guerre » et fonctionne comme une désignation des hommes en état de servir. La traduction restitue ce sens idiomatique sans évoquer à tort un départ ponctuel au combat.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: portant la lance et le grand bouclier
  rationale: אחז signifie tenir ou porter. צִנָּה désigne plus précisément un grand bouclier ; cette précision est intégrée au texte principal.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe militaire et administrative demeure visible, mais les expressions idiomatiques hébraïques sont rendues naturellement. « Chefs de milliers » et « chefs de centaines » conserve la structure ancienne sans employer de grades modernes trop précis.
