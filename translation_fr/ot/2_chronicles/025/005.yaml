  to: Amasias rassembla les hommes de Juda et les organisa par clans, sous les chefs de milliers et de centaines, pour l’ensemble de Juda et de Benjamin. Il recensa ceux qui avaient vingt ans ou plus et trouva trois cent mille hommes choisis[a], aptes au service militaire[b], portant la lance et le grand bouclier.
