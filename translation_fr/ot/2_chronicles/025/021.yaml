base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: fr
  text: Alors Joas, roi d’Israël, monta[a], et Joas et Amatsia, roi de Juda, se firent face à Beth-Shémesh, qui appartient à Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « monta ». Dans ce contexte, le verbe peut évoquer une avancée militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter » dans le récit. Ici, il décrit le déplacement de Joas vers le lieu de l’affrontement, sans qu’il soit nécessaire d’expliciter davantage la nuance militaire.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: s’affrontèrent
  rationale: L’expression, littéralement liée au fait de « voir les visages », désigne ici une rencontre face à face dans un contexte de bataille. « S’affrontèrent » restitue naturellement sa portée confrontative.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: lui et Amatsia
  rationale: Le pronom explicite הוּא met en relief les deux protagonistes. « Lui et Amatsia » conserve cette structure et demeure clair puisque Joas est le sujet immédiatement précédent.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: à Beth-Shémesh
  rationale: La préposition situe l’affrontement dans cette localité. « À » est l’emploi français naturel devant un nom de ville.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: qui appartient à Juda
  rationale: Le ל exprime ici l’appartenance territoriale. Cette formulation conserve cette nuance plus précisément que le simple « en Juda ».
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: roi d’Israël / roi de Juda
  rationale: Les titres royaux sont rendus directement et conformément à l’usage français courant.
