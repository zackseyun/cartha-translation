  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: fr
  text: Ils le transportèrent sur les chevaux et l’enterrèrent avec ses pères dans la ville de Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les chevaux ». L’hébreu mentionne explicitement les chevaux au pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Ils le transportèrent
  rationale: Le verbe נשׂא, ici avec un sujet pluriel et un suffixe objet masculin singulier, exprime le transport du corps. « Transportèrent » est naturel en français moderne et convient au contexte funéraire.
- source_word: עַל הַסּוּסִים
  choice: sur des chevaux
  rationale: La formulation conserve explicitement l’image des chevaux et leur pluriel, sans introduire un brancard ni un char que l’hébreu ne mentionne pas.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: et l’enterrèrent
  rationale: Rendu direct et idiomatique de קבר avec son complément d’objet.
- source_word: עִם אֲבֹתָיו
  choice: auprès de ses pères
  rationale: « Ses pères » préserve la formule familiale et dynastique de l’hébreu. « Auprès de » exprime naturellement en français l’inhumation en leur compagnie sans suggérer nécessairement une même tombe.
- source_word: בְּעִיר יְהוּדָה
  choice: dans la ville de Juda
  rationale: Suit directement le texte massorétique fourni, « ville de Juda », sans harmonisation avec la formule plus familière « ville de David ».
theological_decisions:
- issue: Formule funéraire et désignation du lieu
  choice: Conserver « auprès de ses pères dans la ville de Juda » conformément au texte massorétique.
  alternative: Harmoniser avec « dans la ville de David » ou généraliser en « en Juda ».
  rationale: Même si « ville de Juda » est une formulation inhabituelle, le texte hébreu fourni porte explicitement cette leçon. La traduction préserve cette particularité plutôt que de la normaliser.
translation_notes:
  register: Français moderne, digne et accessible. « Transportèrent » convient au déplacement d’un corps ; « auprès de ses pères » conserve l’expression biblique tout en restant naturelle. La note signale l’article défini de l’hébreu et son pluriel explicite.
