revisions:
- from: Alors Amatsia renvoya[a] les hommes de la troupe qui étaient venus auprès de lui depuis Éphraïm, afin qu’ils rentrent chez eux. Ils se mirent dans une grande colère contre Juda et retournèrent chez eux dans une colère ardente.
  to: Alors Amatsia renvoya[a] la troupe venue auprès de lui d’Éphraïm, afin qu’elle rentre chez elle. Elle se mit dans une grande colère contre Juda et retourna chez elle dans une colère ardente.
  rationale: 'Révision stylistique et lexicale limitée : le collectif « la troupe » rend directement הַגְּדוּד, « d’Éphraïm » rend naturellement la provenance, et l’apposition allège la phrase. Les pronoms singuliers reprennent le collectif hébreu sans exclure les soldats concernés. Le sens, la progression narrative et l’intensité de la colère sont conservés.'
