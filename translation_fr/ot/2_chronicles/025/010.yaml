base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: fr
  text: Alors Amatsia renvoya[a] la troupe venue auprès de lui d’Éphraïm, afin qu’elle rentre chez elle. Elle se mit dans une grande colère contre Juda et retourna chez elle dans une colère ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les sépara ».'
    reason: La note conserve le sens premier de בדל, tandis que le texte principal en exprime la valeur contextuelle militaire.
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: renvoya
  rationale: Le verbe בדל signifie fondamentalement « séparer, mettre à part ». Ici, dans un contexte militaire, Amatsia détache de son armée les soldats éphraïmites et les renvoie ; « renvoya » exprime naturellement cette valeur contextuelle en français.
- source_word: לְהַגְּדוּד
  choice: les hommes de la troupe
  rationale: גְּדוּד désigne une troupe ou une unité armée. Cette formulation permet aussi de rendre naturellement les suffixes masculins pluriels qui renvoient aux soldats composant la troupe.
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: qui étaient venus auprès de lui depuis Éphraïm
  rationale: Le plus-que-parfait situe leur arrivée avant leur renvoi. « Depuis Éphraïm » rend la provenance géographique exprimée par מִן.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: afin qu’ils rentrent chez eux
  rationale: La tournure finale rend le but du renvoi. Littéralement, le texte dit « aller à leur lieu » ; en français actuel, « rentrer chez eux » en communique clairement le sens.
- source_word: וַיִּחַר אַפָּם מְאֹד
  choice: Ils se mirent dans une grande colère
  rationale: L’expression hébraïque décrit littéralement la colère qui s’enflamme. Cette formulation idiomatique conserve l’entrée dans un état de colère ainsi que l’intensif מְאֹד.
- source_word: בִּיהוּדָה
  choice: contre Juda
  rationale: La préposition ב marque ici la cible de la colère. « Contre Juda » est naturel et garde clairement la portée hostile de l’expression.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: retournèrent chez eux
  rationale: שׁוב signifie « revenir, retourner ». « Chez eux » rend idiomatiquement לִמְקוֹמָם, littéralement « à leur lieu ».
- source_word: בָּחֳרִי אָף
  choice: dans une colère ardente
  rationale: L’expression évoque la chaleur de la colère. « Colère ardente » conserve cette image et l’intensité de l’hébreu dans un registre français digne et compréhensible.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction privilégie une équivalence optimale : formulation idiomatique pour les expressions « aller à leur lieu » et « la colère brûla », tout en préservant l’image finale de la colère ardente et la répétition du retour chez eux.'
