- from: 'Mais un homme de Dieu vint le trouver et lui dit : « Ô roi, ne laisse pas l’armée d’Israël venir avec toi, car Yahvé n’est pas avec Israël, avec tous les fils d’Éphraïm[a]. »'
  to: 'Mais un homme de Dieu vint le trouver et lui dit : « Ô roi, ne laisse pas l’armée d’Israël venir avec toi, car Yahvé n’est pas avec Israël, c’est-à-dire avec tous les fils d’Éphraïm[a]. »'
  rationale: 'La précision « c’est-à-dire » rend en français le groupe final apposé à « Israël » et supprime la seconde préposition ajoutée dans le projet. Elle ne limite pas théologiquement l’affirmation : elle indique seulement que, dans ce contexte, Israël est désigné comme les fils d’Éphraïm.'
