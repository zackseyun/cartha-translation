    rationale: 'Le texte source porte עִם une seule fois : « Yahvé n’est pas avec Israël, tous les fils d’Éphraïm ». La seconde occurrence française n’a pas de correspondant hébreu, obscurcit le lien appositif final et n’est pas idiomatique.'
