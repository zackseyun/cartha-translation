  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: fr
  text: 'Mais un homme de Dieu vint le trouver et lui dit : « Ô roi, ne laisse pas l’armée d’Israël venir avec toi, car Yahvé n’est pas avec Israël, c’est-à-dire avec tous les fils d’Éphraïm[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les Éphraïmites ». L’hébreu dit littéralement « tous les fils d’Éphraïm ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: un homme de Dieu
  rationale: Cette expression désigne un messager mandaté par Dieu. L’indéfini convient à la première apparition de ce personnage dans le récit.
- source_word: בָּא אֵלָיו
  choice: vint le trouver
  rationale: בוא avec אֶל exprime ici un déplacement vers une personne. « Vint le trouver » est naturel en français narratif sans ajouter l’idée d’hostilité.
- source_word: לֵאמֹר
  choice: et lui dit
  rationale: La formule hébraïque introduit les paroles qui suivent. Cette formulation rend la fonction du participe de manière idiomatique en français.
- source_word: הַמֶּלֶךְ
  choice: Ô roi
  rationale: L’article hébreu a ici une valeur vocative. « Ô roi » conserve l’adresse solennelle du messager.
- source_word: אַל יָבֹא עִמְּךָ
  choice: ne laisse pas … venir avec toi
  rationale: La défense porte sur la venue de l’armée aux côtés du roi. Cette formulation conserve le verbe « venir » tout en exprimant naturellement l’exhortation adressée au souverain.
- source_word: צְבָא יִשְׂרָאֵל
  choice: l’armée d’Israël
  rationale: צָבָא désigne ici une force militaire organisée.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: car Yahvé n’est pas avec Israël
  rationale: La proposition donne la raison de l’interdiction et conserve le langage biblique de la présence divine auprès d’un peuple.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: tous les fils d’Éphraïm
  rationale: La traduction garde l’expression familiale masculine de l’hébreu et son identification d’Israël au royaume du Nord représenté par Éphraïm; une note fournit l’équivalent ethnique courant.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahvé » représente en français moderne le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de l’affirmation selon laquelle Yahvé n’est pas avec Israël
  choice: conserver l’affirmation sans l’atténuer ni l’expliciter
  alternative: préciser qu’il s’agit seulement d’un refus de soutenir cette campagne
  rationale: Le verset formule une déclaration forte sur l’absence de Yahvé auprès d’Israël et des fils d’Éphraïm. La traduction préserve cette tension théologique sans en limiter la portée au-delà de ce que dit le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « Ô roi » maintient la solennité de l’adresse, tandis que « vint le trouver et lui dit » évite un calque lourd de la formule narrative hébraïque. La répétition « avec Israël, avec tous les fils d’Éphraïm » est conservée afin de ne pas réduire silencieusement le dernier groupe à une simple reformulation explicative.
