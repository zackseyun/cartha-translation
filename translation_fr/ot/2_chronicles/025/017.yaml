  text: וַ/יִּוָּעַ֗ץ אֲמַצְיָ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וַ֠/יִּשְׁלַח אֶל יוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לך נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: fr
  text: 'Amasias, roi de Juda, tint conseil, puis envoya ce message à Joas, fils de Joachaz, fils de Jéhu, roi d’Israël : « Viens, affrontons-nous face à face[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rencontrons-nous face à face ». L’expression hébraïque parle littéralement du fait de se voir le visage ; dans ce contexte, elle indique probablement une confrontation directe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: tint conseil
  rationale: Le nifal de יעץ exprime ici une délibération préalable. « Tint conseil » conserve cette nuance tout en restant naturel dans un récit historique.
- source_word: וַיִּשְׁלַח אֶל
  choice: envoya ce message à
  rationale: Le texte dit littéralement qu’Amasias « envoya à » Joas. En français, « envoya ce message à » rend naturellement l’acte de transmission sans préciser que des messagers, implicites mais non mentionnés, furent envoyés.
- source_word: יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: Joas, fils de Joachaz, fils de Jéhu, roi d’Israël
  rationale: Les formes françaises usuelles des noms bibliques sont retenues. La filiation répétée et le titre royal, tous deux explicites dans l’hébreu, sont conservés.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français narratif moderne, les deux-points introduisent directement et naturellement les paroles qui suivent, sans le calque lourd « en disant ».
- source_word: לְךָ
  choice: Viens
  rationale: L’impératif sert ici à lancer un défi. « Viens » en restitue la brièveté et la force.
- source_word: נִתְרָאֶה פָנִים
  choice: affrontons-nous face à face
  rationale: L’expression évoque littéralement le fait de se voir le visage, mais elle constitue dans ce contexte un défi à une confrontation directe. Cette formulation française conserve l’image du face-à-face et le sens conflictuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide sans effacer la généalogie ni la vigueur du défi. Le marqueur [a] est placé sur l’expression qu’il explique.
