base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: fr
  text: Il prit tout l’or et tout l’argent, ainsi que tous les objets qui se trouvaient dans la maison de Dieu auprès d’Obed-Édom[a], les trésors du palais royal et des otages[b]. Puis il retourna à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec Obed-Édom » ; l’expression peut signifier qu’ils étaient sous sa garde.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils des gages », expression qui désigne probablement des personnes prises comme garantie, c’est-à-dire des otages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: tout l’or et tout l’argent
  rationale: Cette formulation naturelle en français conserve l’idée de totalité et distingue clairement les deux métaux précieux.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: tous les objets qui se trouvaient
  rationale: כֵּלִים est un terme large désignant des objets, récipients ou ustensiles. « Objets » évite de préciser indûment leur nature, tandis que « qui se trouvaient » rend naturellement le participe הַנִּמְצְאִים.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Rendu formellement proche de l’expression hébraïque, compréhensible ici comme une désignation du temple.
- source_word: עִם עֹבֵד אֱדוֹם
  choice: auprès d’Obed-Édom
  rationale: עִם signifie littéralement « avec ». « Auprès de » préserve cette relation sans affirmer dans le texte principal qu’Obed-Édom en avait officiellement la garde.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: les trésors du palais royal
  rationale: Dans ce contexte de pillage, אֹצְרוֹת désigne vraisemblablement les richesses plutôt que les locaux où elles étaient gardées. « Palais royal » exprime naturellement le sens contextuel de « maison du roi ».
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: des otages
  rationale: L’expression difficile, littéralement « les fils des gages », paraît désigner des personnes remises ou retenues comme garantie. « Otages » communique ce sens probable sans reproduire un calque obscur.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: Puis il retourna à Samarie
  rationale: Le verbe fait progresser le récit et Samarie en est la destination. « Puis » marque naturellement la succession des actions.
theological_decisions: []
