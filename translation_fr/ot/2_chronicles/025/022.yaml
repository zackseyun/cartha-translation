  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: fr
  text: Juda fut vaincu devant Israël, et chacun s’enfuit vers sa tente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: fut vaincu
  rationale: Le nifal de נָגַף désigne ici une défaite militaire. « Fut vaincu » est clair, naturel et adapté au récit.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Nom traditionnel en français du royaume du Sud.
- source_word: לִפְנֵי
  choice: devant
  rationale: Dans ce contexte militaire, לִפְנֵי présente Israël comme l’adversaire devant lequel Juda subit la défaite. « Devant » conserve l’expression hébraïque sans exclure le sens idiomatique de « par ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom traditionnel en français du royaume du Nord.
- source_word: וַיָּנֻסוּ
  choice: s’enfuit
  rationale: נוּס signifie fuir. Le singulier français s’accorde naturellement avec le sujet distributif « chacun ».
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif אִישׁ signifie que les combattants fuient individuellement. « Chacun » rend ce sens avec naturel, sans devoir ajouter un nom absent de l’hébreu.
- source_word: לְאֹהָלָיו
  choice: vers sa tente
  rationale: L’expression signifie littéralement que chacun fuit vers sa propre tente; elle évoque ici la dispersion et le repli. Le singulier collectif français conserve l’image hébraïque.
