source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: fr
  text: 'Alors la colère de Yahvé s’enflamma contre Amatsia. Il lui envoya un prophète, qui lui dit : « Pourquoi as-tu recherché[a] les dieux de ce peuple, eux qui n’ont pas délivré leur peuple de ta main ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « consulté » ou « interrogé » les dieux de ce peuple.'
    reason: Alternative lexicale pour דרש, qui peut désigner le fait de rechercher une divinité, de la consulter ou de l’interroger.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: la colère de Yahvé s’enflamma
  rationale: Cette formulation conserve l’image vive de l’idiome hébreu exprimant une colère qui brûle, tout en restant naturelle et digne en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française « Yahvé » rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: בַּאֲמַצְיָהוּ
  choice: contre Amatsia
  rationale: Avec un verbe de colère, la préposition indique la personne visée.
- source_word: נָבִיא
  choice: un prophète
  rationale: Équivalent français courant du terme désignant un messager prophétique.
- source_word: דָרַשְׁתָּ
  choice: as-tu recherché
  rationale: '« Rechercher » conserve le sens assez large de דרש : se tourner vers une divinité pour la chercher, la consulter ou l’interroger, sans réduire le terme au seul culte.'
- source_word: אֱלֹהֵי הָעָם
  choice: les dieux de ce peuple
  rationale: Le démonstratif français explicite naturellement qu’il s’agit du peuple vaincu mentionné dans le contexte, sans le nommer dans le verset.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: eux qui n’ont pas délivré
  rationale: Le texte affirme qu’ils n’ont pas délivré leur peuple; il ne dit pas explicitement qu’ils en étaient incapables. « Eux » rend claire l’antécédence personnelle des dieux.
- source_word: עַמָּם
  choice: leur peuple
  rationale: Traduction directe du possessif, sans ajouter « propre », absent de l’hébreu.
- source_word: מִיָּדֶךָ
  choice: de ta main
  rationale: La formulation conserve l’image hébraïque de la main comme expression du pouvoir ou de la domination, image intelligible en contexte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. Le rendre par le nom « Yahvé » préserve sa fonction de nom personnel plutôt que de lui substituer un titre.
- issue: Portée religieuse de דרש
  choice: rechercher
  alternative: consulter
  rationale: « Rechercher » maintient l’ambiguïté entre le fait de chercher l’aide de ces dieux et celui de les consulter; « consulter » préciserait davantage que ne le fait nécessairement le verbe hébreu.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La ponctuation scinde la longue coordination hébraïque en deux phrases pour une lecture naturelle, tout en préservant sa progression. Le nom Amatsia suit une translittération française usuelle.
