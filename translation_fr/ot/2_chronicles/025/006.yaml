  text: וַ/יִּשְׂכֹּ֣ר מִ/יִּשְׂרָאֵ֗ל מֵ֥אָה אֶ֛לֶף גִּבּ֥וֹר חָ֖יִל בְּ/מֵאָ֥ה כִכַּר כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: fr
  text: Il engagea cent mille vaillants guerriers d’Israël[a] pour cent talents d’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « puissants hommes de guerre ». L’expression hébraïque désigne des combattants forts et capables.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: Il engagea
  rationale: Le verbe שׂכר signifie ici prendre à son service contre rémunération. « Engagea » exprime naturellement cette idée sans ajouter explicitement la notion, plausible mais interprétative, de mercenaires.
- source_word: מִיִּשְׂרָאֵל
  choice: en Israël
  rationale: La préposition מן indique la provenance. Dans ce contexte, « engagea en Israël » rend naturellement en français le recrutement de soldats originaires du royaume du Nord.
- source_word: מֵאָה אֶלֶף
  choice: cent mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: גִּבּוֹר חָיִל
  choice: vaillants guerriers
  rationale: Cette expression désigne des hommes reconnus pour leur force et leur aptitude au combat. « Vaillants guerriers » conserve à la fois le sens militaire et la valeur élogieuse de l’hébreu dans un français actuel.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: pour cent talents d’argent
  rationale: La préposition בְּ exprime ici le prix payé. Le talent, unité ancienne du texte, est conservé sans conversion conjecturale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation demeure proche de la structure hébraïque tout en évitant le calque archaïque « hommes vaillants et forts ».
