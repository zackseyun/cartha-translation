revisions:
- from: Mais les hommes de la troupe qu’Amatsia avait renvoyés, les empêchant ainsi de partir avec lui au combat, firent des incursions dans les villes de Juda, depuis Samarie jusqu’à Beth-Horôn. Ils abattirent trois mille de leurs habitants[a] et emportèrent un butin considérable.
  to: Mais les hommes de la troupe qu’Amatsia avait renvoyés au lieu de les emmener avec lui à la guerre firent des incursions dans les villes de Juda, depuis Samarie jusqu’à Beth-Horôn. Ils en abattirent trois mille[a] et emportèrent un butin considérable.
  rationale: La révision retire l’identification non exprimée des victimes comme « habitants » et rend plus directement le fait qu’Amatsia avait renvoyé ces hommes au lieu de partir en guerre avec eux. Le reste de la traduction conserve les choix fidèles et naturels du projet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:13Z'
review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement l’unité militaire, le renvoi par Amatsia, l’incursion, l’étendue géographique et le pillage. Toutefois, « de leurs habitants » précise indûment le référent de מֵהֶם (« d’entre eux »), que l’hébreu ne définit pas explicitement. La reformulation du renvoi évite aussi l’explicitation interprétative « les empêchant ainsi ».
  naturalness: La version révisée est fluide en français moderne et conserve un registre narratif sobre. « Au lieu de les emmener avec lui à la guerre » exprime naturellement la construction hébraïque sans suggérer une contrainte supplémentaire.
  terminology: « Hommes de la troupe », « villes de Juda », « Samarie », « Beth-Horôn » et « butin considérable » conviennent. « Abattirent » conserve la force martiale de נכה sans imposer dans le texte principal le sens plus explicite « tuèrent ».
  issues:
  - severity: medium
    issue: Le syntagme « de leurs habitants » explicite le référent de מֵהֶם.
    rationale: Le pronom hébreu signifie simplement « d’entre eux »; dans le contexte il vise vraisemblablement des personnes touchées lors des raids, mais il ne les identifie pas lexicalement comme les habitants des villes. Cette précision réduit une ambiguïté que le texte source laisse ouverte.
  - severity: low
    issue: « Les empêchant ainsi de partir » introduit une formulation causative plus interprétative que nécessaire.
    rationale: Le texte dit qu’Amatsia les avait fait revenir plutôt que de les laisser aller avec lui à la guerre. « Empêcher » est possible contextuellement, mais une formulation fondée sur le renvoi est plus proche et plus sobre.
  revised_text: Mais les hommes de la troupe qu’Amatsia avait renvoyés au lieu de les emmener avec lui à la guerre firent des incursions dans les villes de Juda, depuis Samarie jusqu’à Beth-Horôn. Ils en abattirent trois mille[a] et emportèrent un butin considérable.
  revised_footnotes:
  - marker: a
    text: Ou « tuèrent trois mille d’entre eux ». Le verbe hébreu signifie littéralement « frapper » et, dans ce contexte militaire, peut désigner une mise à mort.
    reason: lexical_alternative
  revision_rationale: La révision retire l’identification non exprimée des victimes comme « habitants » et rend plus directement le fait qu’Amatsia avait renvoyé ces hommes au lieu de partir en guerre avec eux. Le reste de la traduction conserve les choix fidèles et naturels du projet.
