  text: וּ/בְנֵ֣י הַ/גְּד֗וּד אֲשֶׁ֨ר הֵשִׁ֤יב אֲמַצְיָ֨הוּ֙ מִ/לֶּ֤כֶת עִמּ/וֹ֙ לַ/מִּלְחָמָ֔ה וַֽ/יִּפְשְׁטוּ֙ בְּ/עָרֵ֣י יְהוּדָ֔ה מִ/שֹּׁמְר֖וֹן וְ/עַד בֵּ֣ית חוֹר֑וֹן וַ/יַּכּ֤וּ מֵ/הֶם֙ שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/יָּבֹ֖זּוּ בִּזָּ֥ה רַבָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: fr
  text: Mais les hommes de la troupe qu’Amatsia avait renvoyés au lieu de les emmener avec lui à la guerre firent des incursions dans les villes de Juda, depuis Samarie jusqu’à Beth-Horôn. Ils en abattirent trois mille[a] et emportèrent un butin considérable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tuèrent trois mille d’entre eux ». Le verbe hébreu signifie littéralement « frapper » et, dans ce contexte militaire, peut désigner une mise à mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: les hommes de la troupe
  rationale: L’expression signifie littéralement « les fils de la troupe », mais désigne idiomatiquement les membres de cette unité militaire. « Les hommes de la troupe » rend ce sens sans conserver un sémitisme obscur.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: qu’Amatsia avait renvoyés, les empêchant ainsi de partir avec lui au combat
  rationale: Le hifil de שוב indique qu’Amatsia les a fait repartir, tandis que la construction avec l’infinitif exprime qu’ils n’ont pas été autorisés à l’accompagner. La formulation française explicite naturellement ce rapport.
- source_word: וַיִּפְשְׁטוּ
  choice: firent des incursions
  rationale: Dans un contexte militaire, פשט désigne une incursion ou un raid. Cette expression traduit l’action hostile sans la confondre avec le pillage mentionné ensuite.
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: עָרִים peut désigner des villes ou des localités. « Villes » convient au registre biblique courant et à la portée collective du passage.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: depuis Samarie jusqu’à Beth-Horôn
  rationale: La construction מן… ועד marque l’étendue géographique de l’incursion. Les noms propres sont translittérés selon un usage français clair.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: Ils abattirent trois mille de leurs habitants
  rationale: נכה signifie « frapper » et implique souvent une mise à mort dans un récit militaire. « Abattirent » conserve cette coloration martiale; « de leurs habitants » explicite en français le référent humain implicite de מֵהֶם.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: emportèrent un butin considérable
  rationale: La construction fondée sur la même racine souligne l’importance du pillage. Cette formulation naturelle restitue l’intensité sans répétition artificielle.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’enchaînement narratif et la délimitation géographique de l’hébreu, tout en explicitant avec mesure les rapports syntaxiques qui seraient autrement peu naturels en français.
