  text: וַ/אֲמַצְיָ֨הוּ֙ הִתְחַזַּ֔ק וַ/יִּנְהַג֙ אֶת עַמּ֔/וֹ וַ/יֵּ֖לֶךְ גֵּ֣יא הַמֶּ֑לַח וַ/יַּ֥ךְ אֶת בְּנֵי שֵׂעִ֖יר עֲשֶׂ֥רֶת אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: fr
  text: Alors Amatsia s’affermit, conduisit son peuple et se rendit dans la vallée du Sel, où il abattit dix mille fils de Séir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « membres du peuple de Séir » ou « descendants de Séir ». L’hébreu dit littéralement « fils de Séir », expression à valeur ethnique et généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: s’affermit
  rationale: Le hitpael de חזק exprime ici le fait de se rendre fort ou de prendre courage. « S’affermit » conserve la nuance réfléchie sans limiter le sens au seul courage intérieur.
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  choice: conduisit son peuple
  rationale: נהג peut signifier conduire, mener ou pousser. Dans ce contexte militaire, « conduisit son peuple » reste naturel et ne précise pas indûment la tactique employée.
- source_word: גֵּיא הַמֶּלַח
  choice: la vallée du Sel
  rationale: Traduction transparente du nom de lieu; la majuscule à « Sel » indique qu’il s’agit d’un toponyme reconnu.
- source_word: וַיַּךְ
  choice: abattit
  rationale: 'נכה a une portée assez large: frapper, vaincre ou tuer. Avec le nombre de victimes donné ici, « abattit » convient au contexte militaire tout en restant proche de l’image verbale.'
- source_word: בְּנֵי שֵׂעִיר
  choice: fils de Séir
  rationale: L’hébreu emploie littéralement une expression ethnique et généalogique, « fils de Séir ». La conserver maintient la formulation de la source tout en restant compréhensible en français.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: dix mille
  rationale: Rendu direct et usuel de l’expression numérique hébraïque.
- source_word: וַאֲמַצְיָהוּ
  choice: Alors Amatsia
  rationale: Le waw poursuit la narration. « Alors » exprime naturellement la succession des événements en français moderne.
