  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: fr
  text: Joas, roi d’Israël, captura à Beth-Shémesh Amatsia, roi de Juda, fils de Joas, lui-même fils de Joachaz, et l’emmena à Jérusalem. Puis il ouvrit une brèche dans la muraille de Jérusalem, depuis la porte d’Éphraïm jusqu’à la porte de l’Angle[a], sur quatre cents coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la porte qui tourne » ou « la porte qui fait face ». « Porte de l’Angle » suit l’identification probable donnée par le récit parallèle en 2 Rois 14.13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: captura
  rationale: Le verbe exprime ici la prise d’une personne par l’ennemi dans un contexte militaire ; « captura » est précis et naturel.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: à Beth-Shémesh
  rationale: La préposition situe le lieu de la capture ; « à » convient naturellement devant ce nom de ville.
- source_word: וַיְבִיאֵהוּ
  choice: l’emmena
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dans le contexte d’un roi capturé conduit à Jérusalem, « l’emmena » rend naturellement le déplacement sans préciser indûment ses modalités.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: il ouvrit une brèche dans la muraille de Jérusalem
  rationale: פרץ appliqué à une muraille indique qu’on la force ou qu’on y pratique une brèche. Cette formulation conserve l’image hébraïque avec clarté.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: depuis la porte d’Éphraïm jusqu’à la porte de l’Angle[a]
  rationale: « Porte d’Éphraïm » est un nom propre transparent. Pour הַפּוֹנֶה, « porte de l’Angle » suit l’identification probable fournie par le récit parallèle de 2 Rois 14.13, tandis qu’une note conserve le sens plus littéral et son incertitude.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: sur quatre cents coudées
  rationale: L’hébreu donne directement la mesure. L’ajout idiomatique de « sur » indique en français qu’il s’agit de l’étendue de la brèche sans convertir l’unité ancienne.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: fils de Joas, lui-même fils de Joachaz
  rationale: Cette formulation conserve les deux générations de la généalogie tout en indiquant clairement en français que Joachaz est le père de Joas.
theological_decisions: []
