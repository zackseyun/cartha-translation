- from: Lorsque le royaume fut solidement affermi sous son autorité[a], il tua ceux de ses serviteurs qui avaient frappé à mort le roi, son père.
  to: Lorsque le pouvoir royal fut solidement établi entre ses mains[a], il tua ses serviteurs qui avaient frappé à mort le roi, son père.
  rationale: La révision précise que le terme hébreu vise ici le pouvoir ou la royauté consolidée, tout en préservant l’image de contrôle personnel au moyen de l’idiome français « entre ses mains ». Elle simplifie également le groupe nominal des serviteurs sans modifier son caractère restrictif ni le sens du passage.
