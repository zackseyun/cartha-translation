base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: fr
  text: Lorsque le pouvoir royal fut solidement établi entre ses mains[a], il tua ses serviteurs qui avaient frappé à mort le roi, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus dynamique : « lorsque le pouvoir royal fut fermement établi sous son contrôle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative introduit le moment où l’événement suivant se produit. « Lorsque » rend naturellement la relation temporelle sans ajouter un marqueur comme « alors » ou « or ».
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: le royaume fut solidement affermi sous son autorité
  rationale: Dans ce contexte, חזק désigne l’affermissement du pouvoir royal, et עָלָיו indique que ce pouvoir est désormais assuré sous son contrôle. Cette formulation française exprime clairement l’idée sans reproduire maladroitement le littéral « sur lui ».
- source_word: וַיַּהֲרֹג
  choice: il tua
  rationale: Traduction directe, sobre et moderne de הרג.
- source_word: עֲבָדָיו
  choice: ceux de ses serviteurs
  rationale: Dans le cadre de la cour royale, עבד désigne des hommes au service du roi. L’ajout de « ceux de » indique sans ambiguïté qu’il ne tua que les serviteurs responsables.
- source_word: הַמַּכִּים
  choice: qui avaient frappé à mort
  rationale: Le participe de נכה identifie les auteurs du meurtre. « Avaient frappé à mort » conserve l’image violente du verbe et évite la répétition immédiate de « tuer ».
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: le roi, son père
  rationale: Cette apposition respecte l’ordre et la solennité de l’hébreu tout en restant naturelle en français.
