source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲמַצְיָ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הֲ/לֹא֙ הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: fr
  text: Quant au reste des actes d’Amatsia[a], des premiers aux derniers, n’est-il pas consigné dans le Livre des rois de Juda et d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des paroles — ou des affaires — d’Amatsia ». Dans cette formule historique, le terme désigne les actes ou les événements de son règne.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur le Livre des rois de Juda et d’Israël ». En français, on dit normalement « dans le Livre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Quant au reste des actes
  rationale: La tournure introduit la matière restante concernant le règne. « Actes » rend ici le sens historiographique de דִּבְרֵי, littéralement « paroles/choses », tandis que « Quant au » restitue naturellement la fonction de transition du וְ initial sans lui attribuer un sens temporel.
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: des premiers aux derniers
  rationale: Cette expression embrasse l’ensemble des actes du roi, du commencement à la fin, tout en conservant les deux pôles du texte hébreu.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: n’est-il pas consigné
  rationale: La question rhétorique attend une réponse affirmative. Le singulier s’accorde en français avec « le reste » ; « consigné » exprime naturellement une mise par écrit dans des annales.
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Même si עַל signifie littéralement « sur », le français dit normalement qu’un fait est consigné « dans » un livre. La majuscule signale le titre de la source citée.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: des rois de Juda et d’Israël
  rationale: La formulation conserve l’ordre des deux royaumes dans l’hébreu et présente l’expression comme le titre du document cité.
