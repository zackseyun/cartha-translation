  text: וּ/מֵ/עֵ֗ת אֲשֶׁר סָ֤ר אֲמַצְיָ֨הוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִיתֻ֖/הוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: fr
  text: À partir du moment où Amasias cessa de suivre Yahvé[a], ils complotèrent contre lui à Jérusalem. Il s’enfuit à Lakish, mais ils envoyèrent des hommes à sa poursuite à Lakish et l’y mirent à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se détourna de derrière Yahvé », expression hébraïque signifiant qu’il cessa de suivre Yahvé.'
    reason: La note signale la forme concrète de l’idiome hébreu derrière la formulation française naturelle.
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: À partir du moment où
  rationale: Rend clairement le point de départ temporel indiqué par l’hébreu, sans ajouter un marqueur discursif absent du texte.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: cessa de suivre Yahvé
  rationale: Expression française naturelle qui restitue l’idiome hébreu désignant l’abandon de la fidélité à Yahvé; la note conserve sa forme littérale inhabituelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, plutôt qu’un remplacement par un titre.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: on complota contre lui
  rationale: Le tour verbe-nom hébreu exprime la formation d’un complot; le pronom indéfini garde l’identité non précisée des conspirateurs.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Il s’enfuit à Lakish
  rationale: Rend le mouvement de fuite et la direction indiquée par la terminaison hébraïque.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: mais on envoya des hommes à sa poursuite jusque-là
  rationale: Explicite en français l’objet humain sous-entendu du verbe « envoyer » tout en conservant l’idée d’agents dépêchés à sa poursuite jusqu’à Lakish.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: et ils le mirent à mort sur place
  rationale: « Mirent à mort » restitue la forme causative et le caractère délibéré de l’acte; « sur place » renvoie à Lakish.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahvé » en conserve la fonction de nom propre dans une forme française largement reconnue.
- issue: Nature de l’abandon d’Amasias
  choice: cessa de suivre Yahvé
  alternative: se détourna de derrière Yahvé
  rationale: La formulation retenue communique l’abandon religieux sans préciser davantage ses motivations ni atténuer la relation temporelle établie avec le complot.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit conserve l’identité indéterminée des conspirateurs au moyen de « on ». La division en deux phrases allège une longue chaîne narrative hébraïque sans modifier l’enchaînement des événements.
