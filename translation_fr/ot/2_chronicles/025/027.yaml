  - severity: low
    issue: « jusque-là » remplace la répétition de Lakish.
    rationale: Le démonstratif reste compréhensible, mais le texte hébreu répète Lakish. La répéter en français conserve plus nettement la destination de l’envoi et le référent de « là ».
