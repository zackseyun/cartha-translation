  text: וַ/יִּשְׁלַ֞ח יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: fr
  text: 'Joas, roi d’Israël, envoya dire à Amatsia, roi de Juda : « Le buisson épineux[a] qui était au Liban envoya dire au cèdre qui était au Liban : “Donne ta fille pour femme à mon fils.” Puis une bête sauvage des champs qui était au Liban passa et piétina le buisson épineux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chardon » ou « la ronce ». Le mot hébreu désigne une plante épineuse dont l’espèce exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: le buisson épineux
  rationale: Le nom hébreu désigne une plante épineuse dont l’espèce exacte reste incertaine. « Buisson épineux » est naturel en français et maintient le contraste entre une plante basse et le cèdre imposant.
- source_word: הָאֶרֶז
  choice: le cèdre
  rationale: Le terme désigne directement le cèdre, symbole de hauteur et de force dans l’image employée.
- source_word: בַּלְּבָנוֹן
  choice: au Liban
  rationale: Cette formulation française idiomatique situe le buisson, le cèdre et la bête dans la région du Liban.
- source_word: שָׁלַח ... לֵאמֹר
  choice: envoya dire
  rationale: Cette tournure rend naturellement la formule hébraïque tout en conservant, dans le récit-cadre comme dans la fable, l’idée d’un message envoyé.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Donne ta fille pour femme à mon fils
  rationale: Cette formulation claire et digne conserve la demande d’alliance matrimoniale exprimée par l’hébreu.
- source_word: חַיַּת הַשָּׂדֶה
  choice: une bête sauvage
  rationale: Le syntagme désigne un animal terrestre non domestique. « Bête sauvage » garde le caractère générique et le registre imagé du texte.
- source_word: וַתַּעֲבֹר
  choice: passa
  rationale: Le verbe décrit simplement le passage de l’animal, sans préciser davantage sa trajectoire.
- source_word: וַתִּרְמֹס
  choice: piétina
  rationale: Ce verbe restitue de façon concise et vive l’action de fouler et d’écraser sous les pieds.
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: envoya dire à
  rationale: La tournure rend explicitement en français l’envoi d’un message, implicite dans la construction hébraïque, sans ajouter de contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « qui était au Liban » est conservée afin de respecter la structure insistante de l’hébreu. « Puis » rend la simple succession narrative du waw sans introduire une opposition absente du texte.
