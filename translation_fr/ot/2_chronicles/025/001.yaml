source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ אֲמַצְיָ֔הוּ וְ/עֶשְׂרִ֣ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְהוֹעַדָּ֖ן מִ/ירוּשָׁלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: fr
  text: Amatsia avait vingt-cinq ans lorsqu’il devint roi[a], et il régna vingt-neuf ans à Jérusalem. Sa mère s’appelait Yehoaddân et elle était originaire de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « fils de vingt-cinq ans ». Le verbe peut aussi se traduire par « commença à régner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: avait vingt-cinq ans
  rationale: Il s’agit de l’expression hébraïque habituelle indiquant l’âge, littéralement « fils de vingt-cinq ans ». La formulation française exprime naturellement le même sens.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans sa première occurrence, le verbe marque l’accession d’Amatsia à la royauté au sein de la formule chronologique.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: il régna vingt-neuf ans
  rationale: La seconde occurrence de מָלַךְ indique la durée du règne ; « régna » convient au registre de la chronologie royale.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition locative se rend idiomatiquement par « à » devant un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette tournure naturelle en français moderne transmet fidèlement l’hébreu « le nom de sa mère était ».
- source_word: יְהוֹעַדָּן
  choice: Yehoaddân
  rationale: Translittération française du nom hébreu, avec l’accent circonflexe signalant la voyelle longue finale.
- source_word: מִירוּשָׁלָיִם
  choice: elle était originaire de Jérusalem
  rationale: La préposition מִן exprime ici la provenance. L’ajout explicite du sujet évite en français que « de Jérusalem » paraisse qualifier seulement le nom propre.
