  text: אָמַ֗רְתָּ הִנֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּ/נְשָׂאֲ/ךָ֥ לִבְּ/ךָ֖ לְ/הַכְבִּ֑יד עַתָּה֙ שְׁבָ֣/ה בְּ/בֵיתֶ֔/ךָ לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: fr
  text: 'Tu as dit[a] : « Voici, tu as battu Édom », et ton cœur t’a exalté pour te glorifier. Maintenant, reste chez toi. Pourquoi provoquerais-tu le malheur et tomberais-tu, toi et Juda avec toi ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu as dit : “Regarde, tu as battu Édom.” » La particule hébraïque attire vivement l’attention sur la victoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Tu t’es dit
  rationale: Le qal accompli à la 2e personne peut signifier « tu as dit » ; dans cette réprimande, le réfléchi rend naturellement en français la pensée présomptueuse attribuée au roi, sans exclure qu’elle ait été exprimée.
- source_word: הִנֵּה
  choice: Regarde
  rationale: La particule déictique attire l’attention avec emphase ; « Regarde » est actuel et conserve mieux sa force que l’archaïque « Voici » dans cette parole rapportée.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: tu as battu Édom
  rationale: Le hiphil de נכה désigne ici une victoire militaire. « Battu » est naturel en français et plus clair dans ce contexte que le littéral « frappé ».
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: ton cœur t’a poussé
  rationale: L’hébreu dit littéralement que le cœur a élevé le roi. La formulation française conserve le cœur comme agent intérieur tout en exprimant naturellement le mouvement vers l’orgueil.
- source_word: לְהַכְבִּיד
  choice: à te glorifier
  rationale: Dans ce contexte de victoire suivie de présomption, l’infinitif renvoie au fait de rechercher sa propre gloire ou de se faire valoir. « Te glorifier » garde la dimension d’honneur personnel sans réduire le sens à de simples paroles vantardes.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Maintenant, reste chez toi
  rationale: L’impératif de ישב avec « dans ta maison » invite le roi à rester sur place plutôt qu’à partir en guerre. « Reste chez toi » restitue clairement cet idiome.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Pourquoi provoquerais-tu le malheur
  rationale: Le hitpael de גרה évoque le fait de susciter ou d’engager un conflit ; רעה désigne ici la calamité qui en résulterait. Le conditionnel convient à la mise en garde rhétorique en français.
- source_word: וְנָפַלְתָּ
  choice: au risque de tomber
  rationale: L’accompli coordonné présente la chute comme conséquence du défi imprudent. « Au risque de » rend le lien de conséquence dans la question d’avertissement sans transformer celle-ci en prédiction catégorique.
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: toi et Juda avec toi
  rationale: 'La formulation garde l’insistance sur la responsabilité du roi : sa chute entraînerait également Juda.'
theological_decisions: []
