  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse singulière entre rois dans ce discours. La métaphore du cœur est partiellement conservée, tandis que les expressions militaires et idiomatiques sont rendues dans un français immédiatement compréhensible.
