revisions:
- from: 'Tu t’es dit[a] : « Regarde, tu as battu Édom », et ton cœur t’a poussé à te glorifier. Maintenant, reste chez toi. Pourquoi provoquerais-tu le malheur, au risque de tomber, toi et Juda avec toi ?'
  to: 'Tu as dit[a] : « Voici, tu as battu Édom », et ton cœur t’a exalté pour te glorifier. Maintenant, reste chez toi. Pourquoi provoquerais-tu le malheur et tomberais-tu, toi et Juda avec toi ?'
  rationale: La révision remplace le réfléchi interprétatif « Tu t’es dit » par le sens direct de l’accompli hébreu, et restitue l’image du cœur qui « élève » le roi. La conséquence est formulée par « et tomberais-tu », qui correspond naturellement à la coordination de l’avertissement rhétorique sans introduire l’atténuation supplémentaire de « au risque de ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement la victoire sur Édom, l’ordre de demeurer chez soi, l’avertissement contre le malheur et la chute entraînant Juda. Toutefois, « ton cœur t’a poussé » atténue l’image et le sens plus précis de l’hébreu : le cœur « t’a élevé/exalté ».'
  naturalness: Le français est globalement fluide et d’un registre moderne. « Ton cœur t’a exalté pour te glorifier » reste compréhensible, tout en conservant mieux la métaphore de l’original que « t’a poussé ». « Voici » est ici une interjection française naturelle et soutenue sans être archaïque.
  terminology: Édom et Juda sont correctement rendus. « Le malheur » convient à רָעָה dans ce contexte de calamité. « Te glorifier » rend de manière acceptable l’idée de gloire ou de vantardise attachée à לְהַכְבִּיד, sans imposer une interprétation confessionnelle.
  issues:
  - severity: medium
    issue: L’expression « ton cœur t’a poussé » ne traduit pas suffisamment l’image de l’élévation du cœur.
    rationale: וּנְשָׂאֲךָ לִבְּךָ signifie littéralement que le cœur a élevé/exalté le destinataire. « Poussé » exprime une impulsion, mais efface l’idée centrale d’orgueil et d’auto-élévation après la victoire.
  - severity: low
    issue: La note sur « Tu t’es dit » présente une lecture intérieure possible comme si elle était spécialement indiquée par l’hébreu.
    rationale: אָמַרְתָּ signifie directement « tu as dit ». Le contexte permet certes une parole présomptueuse rapportée, mais ne justifie pas de privilégier le réfléchi ni d’en faire une alternative textuelle notable.
  revised_text: 'Tu as dit[a] : « Voici, tu as battu Édom », et ton cœur t’a exalté pour te glorifier. Maintenant, reste chez toi. Pourquoi provoquerais-tu le malheur et tomberais-tu, toi et Juda avec toi ?'
  revised_footnotes:
