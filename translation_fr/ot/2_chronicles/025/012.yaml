  text: וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים חַיִּ֗ים שָׁבוּ֙ בְּנֵ֣י יְהוּדָ֔ה וַ/יְבִיא֖וּ/ם לְ/רֹ֣אשׁ הַ/סָּ֑לַע וַ/יַּשְׁלִיכ֛וּ/ם מֵֽ/רֹאשׁ הַ/סֶּ֖לַע וְ/כֻלָּ֥/ם נִבְקָֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: fr
  text: Les fils de Juda capturèrent vivants dix mille hommes, les conduisirent au sommet de l’escarpement[a] et les précipitèrent du haut de l’escarpement ; tous furent mis en pièces[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du rocher » ou « du roc » (hébreu sélaʿ).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous furent fendus » ; ou « furent brisés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: capturèrent
  rationale: Dans ce contexte militaire, avec חַיִּים (« vivants »), le verbe signifie faire prisonniers plutôt que revenir.
- source_word: חַיִּים
  choice: vivants
  rationale: 'L’adjectif a ici une valeur prédicative : ces dix mille hommes furent pris en vie.'
- source_word: וַיְבִיאוּם
  choice: les conduisirent
  rationale: Le hiphil de בוא signifie normalement « faire venir, amener ». Pour des prisonniers emmenés jusqu’à un lieu, « conduire » est idiomatique en français sans changer le sens.
- source_word: לְרֹאשׁ
  choice: au sommet de
  rationale: Avec un relief, רֹאשׁ (« tête ») désigne idiomatiquement le sommet ou le haut.
- source_word: הַסָּלַע / הַסֶּלַע
  choice: l’escarpement
  rationale: סֶלַע peut désigner un rocher, un roc ou un escarpement. L’action de précipiter des hommes depuis son sommet favorise ici « escarpement », tout en conservant les autres possibilités en note.
- source_word: וַיַּשְׁלִיכוּם
  choice: les précipitèrent
  rationale: שלך signifie « jeter ». Dans le contexte d’une chute imposée depuis une hauteur, « précipiter » rend naturellement le mouvement vers le bas.
- source_word: וְכֻלָּם
  choice: tous
  rationale: Le suffixe pronominal renvoie explicitement à l’ensemble des dix mille captifs ; « tous » en conserve la totalité.
- source_word: נִבְקָעוּ
  choice: furent éventrés
  rationale: Le niphal de בקע signifie être fendu, ouvert ou disloqué. « Furent éventrés » restitue concrètement l’ouverture violente des corps sans atténuer le texte ; une formulation plus littérale figure en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Les fils de Juda » conserve la désignation collective du texte hébreu. Le point-virgule maintient la coordination entre les actes et leur issue sans introduire explicitement une relation de but ou de conséquence.
