translation_notes:
  register: Français international moderne, clair et digne. La formulation « vécut encore quinze ans après » préserve la structure chronologique de l’hébreu et rend explicite, sans surinterprétation, qu’Amatsia a vécu quinze années de plus que Joas d’Israël.
