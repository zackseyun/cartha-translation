base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: fr
  text: Amatsia, fils de Joas, roi de Juda, vécut encore quinze ans après la mort de Joas, fils de Joachaz, roi d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette notice chronologique, le verbe חיה indique qu’Amatsia continua de vivre pendant la période précisée. « Vécut encore » exprime naturellement ce sens sans rendre explicitement le verbe par l’interprétation plus marquée « survécut ».
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Forme française courante du nom propre hébreu.
- source_word: בֶן
  choice: fils de
  rationale: Formulation généalogique naturelle et précise en français.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Forme française traditionnelle et largement reconnue. Les deux hommes portant ce nom sont distingués dans le verset par leur père et leur royaume.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend directement la relation construite désignant la fonction royale exercée sur Juda.
- source_word: אַחֲרֵי מוֹת
  choice: après la mort de
  rationale: Conserve la construction nominale de l’hébreu tout en étant naturelle en français.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Forme française biblique usuelle du nom propre hébreu.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Rend directement la relation construite désignant la fonction royale exercée sur Israël.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: quinze ans
  rationale: Équivalent français direct de l’expression numérique hébraïque, placé après « vécut encore » conformément à l’ordre et au sens de la proposition.
