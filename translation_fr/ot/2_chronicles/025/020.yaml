base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: fr
  text: Mais Amatsia n’écouta pas, car cela venait de Dieu, afin qu’il les livre au pouvoir de leurs ennemis[a], parce qu’ils avaient recherché les dieux d’Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les livrer dans la main » ; expression hébraïque signifiant les livrer au pouvoir d’un autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: n’écouta pas
  rationale: Dans ce contexte, le verbe exprime le refus de tenir compte d’un avertissement, et non une simple incapacité à entendre.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: cela venait de Dieu
  rationale: Le pronom féminin renvoie vraisemblablement à la situation ou à la décision qui vient d’être décrite. Cette formulation naturelle préserve l’affirmation de la causalité divine sans préciser davantage son référent.
- source_word: לְמַעַן
  choice: il voulait ainsi
  rationale: Cette tournure exprime clairement la finalité indiquée par l’hébreu tout en reliant naturellement la proposition à l’action de Dieu.
- source_word: תִּתָּם
  choice: les livrer
  rationale: Avec l’expression suivante « dans la main », נתן signifie remettre des personnes au pouvoir d’un adversaire. « Livrer » rend cet idiome naturellement.
- source_word: בְּיָד
  choice: au pouvoir de leurs ennemis
  rationale: L’expression hébraïque « dans la main » signifie être placé sous le pouvoir de quelqu’un. Les ennemis sont explicités d’après le contexte immédiat; la forme littérale est signalée en note.
- source_word: דָרְשׁוּ
  choice: avaient recherché
  rationale: Le verbe peut désigner le fait de rechercher une divinité et de recourir à elle. « Rechercher » conserve cette portée religieuse sans la réduire à la seule consultation.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: les dieux d’Édom
  rationale: Cette expression rend directement la chaîne construite désignant les divinités adorées par les Édomites.
theological_decisions:
- issue: Causalité divine dans le refus d’Amatsia et sa défaite
  choice: Le refus d’Amatsia vient de Dieu et sert le dessein de livrer le peuple à ses ennemis en raison de son idolâtrie.
  alternative: Présenter l’action divine comme une simple permission providentielle.
  rationale: L’hébreu affirme explicitement que la situation « venait de Dieu » et emploie לְמַעַן pour en indiquer la finalité. La traduction maintient cette tension sans atténuer l’action divine ni fournir une explication théologique absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la causalité divine et le lien de finalité du texte hébreu. Le marqueur de note est placé sur l’expression qu’il explique, plutôt qu’après « n’écouta pas » comme dans la couche anglaise fournie.
