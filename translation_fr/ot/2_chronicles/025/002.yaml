  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, mais il ne le fit pas d’un cœur entier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pas avec un cœur parfait » ou « pas de tout son cœur ». L’hébreu dit littéralement « pas avec un cœur entier/complet » ; il indique que son cœur n’était pas entier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le waw consécutif avec l’imparfait poursuit le récit au passé. En français, « il fit » est naturel ici sans rendre nécessairement le waw initial.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: L’adjectif défini est employé comme substantif et désigne ce qui est moralement droit. Cette formulation française reste idiomatique tout en conservant l’évaluation du texte.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La formulation conserve la métaphore de l’expression évaluative hébraïque et rend directement le nom divin.
- source_word: רַק
  choice: mais
  rationale: Dans ce contexte, רַק apporte une restriction qui contraste avec l’évaluation positive précédente. « Mais » exprime clairement cette réserve en français courant.
- source_word: לֹא
  choice: pas
  rationale: Négation simple, associée en français au « ne » implicite dans cette construction elliptique après « mais ».
- source_word: בְּלֵבָב שָׁלֵם
  choice: d’un cœur entier
  rationale: Cette expression préserve la métaphore hébraïque du cœur complet ou entier et indique une consécration incomplète sans introduire l’idée plus forte de perfection morale absolue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Nature de la réserve concernant la fidélité d’Amatsia
  choice: pas d’un cœur entier
  alternative: pas d’un cœur parfait ; pas de tout son cœur
  rationale: Le rendu conserve la tension entre des actes jugés droits et une disposition intérieure qui n’est pas entière, sans préciser davantage que l’hébreu la nature de cette insuffisance.
translation_notes:
  register: Français international moderne, sobre et digne. « Ce qui est droit aux yeux de » conserve l’idiome biblique de façon intelligible. « D’un cœur entier » maintient la métaphore et l’ambiguïté du texte source.
