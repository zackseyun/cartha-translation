source:
  edition: WLC
  text: כִּ֚י אִם בֹּ֣א אַתָּ֔ה עֲשֵׂ֖ה חֲזַ֣ק לַ/מִּלְחָמָ֑ה יַכְשִֽׁילְ/ךָ֤ הָֽ/אֱלֹהִים֙ לִ/פְנֵ֣י אוֹיֵ֔ב כִּ֥י יֶשׁ כֹּ֛חַ בֵּ/אלֹהִ֖ים לַ/עְז֥וֹר וּ/לְ/הַכְשִֽׁיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: fr
  text: 'Mais si tu y vas, fais preuve de force pour le combat[a] : Dieu te fera trébucher devant l’ennemi[b], car Dieu a le pouvoir d’aider et de faire trébucher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « montre-toi fort pour le combat » ou « agis avec force pour le combat ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu reprend ensuite le même verbe : Dieu a le pouvoir aussi bien « d’aider » que de « faire trébucher ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais si
  rationale: Cette tournure introduit une hypothèse qui contraste avec l’ordre donné précédemment.
- source_word: בֹּא אַתָּה
  choice: tu y vas
  rationale: Le pronom explicite souligne le choix personnel d’Amatsia. Le pronom adverbial « y » rend naturellement en français le mouvement vers le combat, implicite dans le contexte.
- source_word: עֲשֵׂה חֲזַק
  choice: montre-toi fort
  rationale: Cette formulation restitue l’expression exhortative associant l’action et la force sans lui donner un sens militaire plus précis que l’hébreu.
- source_word: לַמִּלְחָמָה
  choice: dans le combat
  rationale: La préposition peut marquer le but ou la sphère; « dans le combat » est naturel en français et convient au contexte immédiat.
- source_word: יַכְשִׁילְךָ
  choice: te fera trébucher
  rationale: Le causatif du verbe כשל est rendu littéralement afin de conserver son image et sa reprise à la fin du verset.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article en hébreu, le nom propre divin s’emploie normalement sans article en français.
- source_word: לִפְנֵי אוֹיֵב
  choice: devant l’ennemi
  rationale: La traduction garde l’idée d’une chute en présence de l’adversaire, avec une formulation concise et proche de l’hébreu.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: Dieu a le pouvoir
  rationale: Cette tournure française naturelle exprime fidèlement que la puissance d’aider ou de faire tomber appartient à Dieu.
- source_word: לַעְזֹר
  choice: d’aider
  rationale: Traduction directe et courante de l’infinitif hébreu.
- source_word: וּלְהַכְשִׁיל
  choice: comme de faire trébucher
  rationale: La reprise de « faire trébucher » préserve la répétition du même verbe hébreu. « Comme » met clairement en parallèle les deux capacités divines sans atténuer la seconde.
theological_decisions:
- issue: Action divine dans la défaite militaire
  choice: Dieu te fera trébucher
  alternative: Dieu permettra que tu tombes
  rationale: L’hébreu attribue directement à Dieu l’action causative. La traduction conserve cette affirmation et la tension théologique du texte au lieu de la transformer en simple permission.
translation_notes:
  register: Français international actuel, digne et accessible. « Montre-toi fort » conserve la vigueur de l’exhortation; « faire trébucher » maintient à la fois l’image hébraïque, la répétition lexicale et l’action divine explicitement affirmée.
