base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: fr
  text: 'Pendant qu’il lui parlait, le roi lui dit : « T’avons-nous nommé conseiller du roi[a] ? Arrête ! Pourquoi te frapperait-on[b] ? » Le prophète s’arrêta et dit : « Je sais que Dieu a décidé[c] de te détruire, puisque tu as fait cela et que tu n’as pas écouté mon conseil. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « T’avons-nous établi comme conseiller du roi ? »'
    reason: Variante naturelle pour rendre le verbe נתן, littéralement « donner, placer », dans le contexte d’une fonction royale.
  - marker: b
    text: 'L’hébreu emploie un sujet pluriel non précisé : « Pourquoi te frapperaient-ils ? » Il s’agit vraisemblablement de personnes qui exécuteraient l’ordre du roi.'
    reason: La note signale l’indétermination grammaticale que le français rend par « on ».
  - marker: c
    text: 'Ou : « Dieu a projeté de te détruire. » Le verbe hébreu se rapporte au conseil, au dessein ou au projet.'
    reason: La note préserve le champ lexical du verbe יעץ et une autre traduction possible.
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: T’avons-nous nommé conseiller du roi ?
  rationale: La particule interrogative et la forme verbale à la première personne du pluriel expriment une question rhétorique. « Nommé conseiller du roi » rend naturellement en français l’idée d’avoir établi quelqu’un dans cette fonction.
- source_word: חֲדַל
  choice: Arrête !
  rationale: L’impératif ordonne abruptement au prophète de cesser de parler ; cette formulation est directe et actuelle.
- source_word: לָמָּה יַכּוּךָ
  choice: Pourquoi te frapperait-on ?
  rationale: Le verbe porte un sujet pluriel non précisé. Le pronom indéfini « on » conserve cette indétermination sans identifier les exécutants de la menace.
- source_word: יָעַץ אֱלֹהִים
  choice: Dieu a décidé
  rationale: Le verbe יעץ appartient au champ du conseil et du projet ; avec Dieu pour sujet et l’infinitif qui suit, il désigne ici une résolution arrêtée.
- source_word: לְהַשְׁחִיתֶךָ
  choice: de te détruire
  rationale: L’infinitif causatif de שׁחת indique que Dieu fera venir la destruction sur le roi ; « te détruire » en donne le sens direct.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: et que tu n’as pas écouté mon conseil
  rationale: שׁמע peut inclure l’idée d’écouter et de tenir compte de ce qui est dit. La formulation française conserve cette nuance sans la réduire explicitement à l’obéissance.
theological_decisions:
- issue: L’intention divine exprimée par יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: Dieu a décidé de te détruire
  alternative: Dieu a projeté de te détruire
  rationale: Le texte présente la destruction comme une décision divine en réponse à l’acte du roi et à son refus d’écouter. La traduction maintient directement cette affirmation et sa tension théologique, sans l’atténuer ni l’expliquer par un système doctrinal.
translation_notes:
  register: Français international moderne, direct et digne. Le récit évite le tour archaïsant « il arriva que ». La menace royale reste concise, et les répétitions autour du « conseil » sont conservées autant que le permet un français naturel.
