base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: fr
  text: 'Amasias dit à l’homme de Dieu : « Mais que faire des cent talents[a] que j’ai donnés aux troupes d’Israël ? » L’homme de Dieu répondit : « Yahweh a de quoi te donner bien plus que cela[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset précédent précise qu’il s’agit de talents d’argent.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction possible : « Yahweh peut te donner bien plus que cela. » La tournure hébraïque souligne qu’il dispose des ressources nécessaires pour donner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Titre hébreu courant désignant un messager mandaté par Dieu. Cette traduction préserve la forme du texte sans préciser davantage sa fonction en disant « prophète ».
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Mais que faire
  rationale: Formulation française naturelle qui exprime la question pratique d’Amasias et la valeur adversative du contexte.
- source_word: מְאַת הַכִּכָּר
  choice: des cent talents
  rationale: Le talent est ici une unité de poids. Le mot « argent » figure au verset précédent, mais pas dans celui-ci; il est donc indiqué en note plutôt qu’ajouté au texte.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: aux troupes d’Israël
  rationale: Dans le contexte de soldats engagés, « troupes » rend naturellement le sens militaire de גְדוּד.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Yahweh a de quoi te donner
  rationale: La construction existentielle souligne que Yahweh possède les ressources ou la capacité nécessaires pour donner davantage. « A de quoi » conserve cette nuance plus directement que la seule formule « peut te donner ».
- source_word: הַרְבֵּה מִזֶּה
  choice: bien plus que cela
  rationale: Rend clairement l’idée comparative d’une quantité largement supérieure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Sens de יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Yahweh a de quoi te donner
  alternative: Yahweh peut te donner
  rationale: L’hébreu peut être rendu comme une affirmation de capacité, mais sa tournure met aussi en avant les ressources disponibles auprès de Yahweh. Le texte retient cette dernière nuance sans nier sa puissance.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie explicitement le tétragramme; le nom propre est donc conservé plutôt que remplacé par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La question concise « que faire des… » évite une tournure passive lourde. « A de quoi » reste accessible tout en reflétant l’expression hébraïque de disponibilité ou de capacité.
