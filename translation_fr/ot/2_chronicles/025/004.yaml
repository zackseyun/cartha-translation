  source_fidelity: La formulation principale rend correctement le contraste, l’exécution judiciaire des fils des coupables, l’appel à la Loi et le principe de responsabilité individuelle. Toutefois, dans la dernière proposition, l’hébreu porte le verbe actif « mourront » (avec une valeur distributive), comme le conserve aussi la piste d’audit anglaise. « Chacun sera mis à mort » introduit une voix passive qui n’est pas présente dans cette dernière clause.
  naturalness: Le français est globalement naturel, moderne et d’un registre approprié. « Ne fit pas mettre à mort » convient dans ce cadre narratif et juridique. « Pour leurs fils / pour leurs pères » est plus direct et plus symétrique dans l’énoncé légal que « à cause de », tout en restant naturel.
  terminology: « Loi », « livre de Moïse », « Yahweh », « pères », « fils » et « péché » sont cohérents avec le texte source et le registre retenu. La note doit continuer à signaler que « mourir » est la formulation plus littérale, tandis que « être mis à mort » explicite l’usage judiciaire dans les deux premières propositions.
