base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: fr
  text: 'Mais il ne fit pas mettre à mort leurs fils, conformément à ce qui est écrit dans la Loi, dans le livre de Moïse, où Yahweh a donné ce commandement : « Les pères ne seront pas mis à mort pour leurs fils, et les fils ne seront pas mis à mort pour leurs pères ; chacun mourra pour son propre péché. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Les pères ne mourront pas pour leurs fils, et les fils ne mourront pas pour leurs pères ; chacun mourra pour son propre péché. » Dans ce contexte juridique, « être mis à mort » exprime le sens de la formule hébraïque dans les deux premières propositions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם לֹא הֵמִית
  choice: Mais il ne fit pas mettre à mort leurs fils
  rationale: Le waw marque ici le contraste avec l’exécution des meurtriers au verset précédent. Le hifil de מות est causatif et reçoit une formulation judiciaire. בנים est conservé par « fils » plutôt qu’élargi à « enfants ».
- source_word: כִּי כַכָּתוּב
  choice: conformément à ce qui est écrit
  rationale: La formule exprime à la fois le motif de l’action et sa conformité au texte écrit ; cette tournure est naturelle en français et garde la valeur comparative de כַּ.
- source_word: בַּ/תּוֹרָה בְּ/סֵפֶר מֹשֶׁה
  choice: dans la Loi, dans le livre de Moïse
  rationale: « Loi » rend תורה de manière accessible dans cette formule de citation scripturaire, tandis que « livre de Moïse » suit étroitement l’hébreu.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: où Yahweh a donné ce commandement
  rationale: La formulation française introduit naturellement la citation et rattache le commandement au livre mentionné, sans ajouter d’interprétation.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: Les pères ne seront pas mis à mort à cause de leurs fils, et les fils ne seront pas mis à mort à cause de leurs pères
  rationale: Dans ce contexte juridique, « être mis à mort » explicite l’usage judiciaire de מות. עַל indique ici que la peine ne doit pas être infligée à cause de la faute d’un membre de la famille.
- source_word: כִּי אִישׁ בְּ/חֶטְא/וֹ יָמוּתוּ
  choice: chacun sera mis à mort pour son propre péché
  rationale: איש a une valeur distributive, bien que le verbe final soit morphologiquement pluriel. « Chacun » restitue cette distribution en français ; « son propre péché » rend le suffixe personnel et la responsabilité individuelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Nature de la mort dans le commandement cité
  choice: être mis à mort
  alternative: mourir
  rationale: Le contexte est celui d’une sanction judiciaire et de la responsabilité pénale familiale. La traduction principale rend ce sens, tandis que la note conserve la possibilité d’une correspondance plus littérale avec le verbe « mourir ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde la solennité d’une citation légale sans archaïsmes. Le parallélisme familial et la tension entre la formulation littérale « mourir » et son sens judiciaire sont préservés par le texte et la note.
