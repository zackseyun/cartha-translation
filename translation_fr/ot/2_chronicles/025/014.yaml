revisions:
- from: Après qu’Amazias fut revenu de sa victoire sur les Édomites, il rapporta les dieux des fils de Séir[a] et les érigea pour en faire ses propres dieux. Il se prosterna devant eux[b] et leur brûla de l’encens.
  to: À son retour après avoir vaincu les Édomites, Amazias rapporta les dieux des fils de Séir[a] et les érigea comme ses dieux. Il se prosterna devant eux[b] et leur brûla de l’encens.
  rationale: 'Révision limitée à deux formulations : l’action contre les Édomites est rendue par « après avoir vaincu », et l’installation des divinités est formulée comme leur adoption « comme ses dieux ». Les ambiguïtés et les termes cultuels du texte source sont préservés.'
