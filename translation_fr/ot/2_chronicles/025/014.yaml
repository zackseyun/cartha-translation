  text: וַ/יְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽ/הַכּ֣וֹת אֶת אֲדוֹמִ֔ים וַ/יָּבֵ֗א אֶת אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַ/יַּֽעֲמִידֵ֥/ם ל֖/וֹ לֵ/אלֹהִ֑ים וְ/לִ/פְנֵי/הֶ֥ם יִֽשְׁתַּחֲוֶ֖ה וְ/לָ/הֶ֥ם יְקַטֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: fr
  text: À son retour après avoir vaincu les Édomites, Amazias rapporta les dieux des fils de Séir[a] et les érigea comme ses dieux. Il se prosterna devant eux[b] et leur brûla de l’encens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dieux du peuple de Séir ». L’hébreu dit littéralement « les dieux des fils de Séir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « s’inclina profondément devant eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: Après qu’Amazias fut revenu
  rationale: La formule narrative introduit ce qui se produisit après l’arrivée d’Amazias. « Fut revenu » exprime naturellement en français le retour impliqué par le contexte, sans ajouter un marqueur discursif tel que « Or ».
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: de sa victoire sur les Édomites
  rationale: Le verbe נכה signifie littéralement frapper ou abattre. Dans cette construction avec בוא מן, le français idiomatique demande une reformulation; « de sa victoire sur » rend l’issue militaire indiquée par le contexte sans suggérer que tous les Édomites furent tués.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: les dieux des fils de Séir
  rationale: Le pluriel désigne ici les divinités païennes. « Fils de Séir » conserve l’expression de parenté hébraïque; une formulation idiomatique est donnée en note.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: les érigea pour en faire ses propres dieux
  rationale: Le hiphil de עמד évoque leur installation ou leur établissement. « Érigea » conserve la dimension concrète, tandis que « pour en faire ses propres dieux » exprime la fonction indiquée par לוֹ לֵאלֹהִים.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: Il se prosterna devant eux
  rationale: השתחוה désigne l’action de s’incliner profondément ou de se prosterner, ici manifestement dans un acte cultuel.
- source_word: וְלָהֶם יְקַטֵּר
  choice: leur brûla de l’encens
  rationale: Le piel de קטר désigne couramment l’action de faire brûler de l’encens ou une offrande produisant de la fumée. Cette formulation reste concrète et naturelle.
theological_decisions:
- issue: Sens d’אֱלֹהִים lorsqu’il désigne les divinités de Séir
  choice: dieux
  alternative: êtres divins
  rationale: Le contexte parle des divinités qu’Amazias installe et vénère. « Dieux » préserve directement le caractère idolâtre et l’ironie théologique du récit.
- issue: Nature de l’acte exprimé par השתחוה
  choice: se prosterna
  alternative: adora
  rationale: « Se prosterna » conserve l’acte corporel explicitement nommé sans remplacer celui-ci par une interprétation abstraite, même si le contexte en montre clairement la portée cultuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase hébraïque est divisée en deux phrases françaises pour plus de clarté. Le récit reste sobre et conserve les actes concrets d’installation, de prosternation et d’encensement.
