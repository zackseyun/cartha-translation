review_pass:
  verdict: revise
  source_fidelity: La formulation « de sa victoire sur les Édomites » explicite une issue militaire et atténue l’action exprimée par נכה (« frapper », par extension « vaincre »). « Après avoir vaincu les Édomites » restitue plus directement la séquence et l’action sans suggérer une extermination. Le reste rend correctement l’apport des dieux, leur installation comme dieux personnels, la prosternation et l’encensement.
  naturalness: Le texte est globalement naturel et de registre soutenu accessible. « À son retour après avoir vaincu... » est plus fluide que « Après qu’Amazias fut revenu de sa victoire... ». « Les érigea comme ses dieux » évite la tournure finalisée « pour en faire », tout en conservant le sens d’installation et d’adoption cultuelle.
  terminology: « Dieux », « fils de Séir », « se prosterna » et « brûla de l’encens » sont justes et cohérents. La note sur « peuple de Séir » conserve utilement l’alternative idiomatique.
  issues:
  - severity: medium
    issue: « de sa victoire sur les Édomites »
    rationale: Cette expression remplace l’acte verbal « frapper » par un nom qui met l’accent sur le résultat. « Vaincu » est à la fois naturel en contexte militaire et plus proche de la portée du verbe hébreu.
  - severity: low
    issue: « les érigea pour en faire ses propres dieux »
    rationale: « Pour en faire » peut présenter l’adoption comme un but plutôt que comme le statut exprimé par לֵאלֹהִים. « Comme ses dieux » rend plus directement cette valeur.
  revised_text: À son retour après avoir vaincu les Édomites, Amazias rapporta les dieux des fils de Séir[a] et les érigea comme ses dieux. Il se prosterna devant eux[b] et leur brûla de l’encens.
  revised_footnotes:
  - marker: a
    text: Ou « les dieux du peuple de Séir ». L’hébreu dit littéralement « les dieux des fils de Séir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « s’inclina profondément devant eux ».
    reason: lexical_alternative
  revision_rationale: 'Révision limitée à deux formulations : l’action contre les Édomites est rendue par « après avoir vaincu », et l’installation des divinités est formulée comme leur adoption « comme ses dieux ». Les ambiguïtés et les termes cultuels du texte source sont préservés.'
