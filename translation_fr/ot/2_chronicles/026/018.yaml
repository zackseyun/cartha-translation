base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: fr
  text: 'Ils s’opposèrent au roi Ozias[a] et lui dirent : « Ce n’est pas à toi, Ozias, de brûler de l’encens pour le SEIGNEUR, mais aux prêtres, fils d’Aaron, qui ont été consacrés pour brûler de l’encens. Sors du sanctuaire, car tu as agi infidèlement[b] ; tu n’en recevras aucun honneur de la part du SEIGNEUR Dieu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils tinrent tête au roi Ozias » ou « Ils affrontèrent le roi Ozias ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu as commis un sacrilège ». Le verbe hébreu évoque une infidélité grave, particulièrement dans un contexte sacré.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et non pour toi comme honneur de la part du SEIGNEUR Dieu ». La proposition hébraïque est elliptique : cet acte ne vaudra à Ozias aucun honneur venant de Dieu.'
    reason: textual_clarification
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: Ils s’opposèrent à
  rationale: Dans ce contexte, l’expression décrit une prise de position contre le roi, et non le simple fait de se tenir près de lui.
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: le roi Ozias
  rationale: L’ordre titre-nom est naturel en français et « Ozias » est la forme française traditionnelle du nom.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: Ce n’est pas à toi ... de brûler de l’encens
  rationale: Cette formulation rend l’idée de prérogative légitime sans ajouter le vocabulaire moderne d’une autorisation administrative.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: Le tétragramme est rendu par « le SEIGNEUR », convention française qui signale le nom divin tout en maintenant une lecture naturelle.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: mais aux prêtres, fils d’Aaron
  rationale: La formulation conserve la désignation formelle de la lignée sacerdotale et l’opposition exclusive exprimée par le contexte.
- source_word: הַמְקֻדָּשִׁים
  choice: qui ont été consacrés
  rationale: Le participe passif désigne ceux qui ont été mis à part pour un service sacré ; « consacrés » convient au contexte sacerdotal.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Sors du sanctuaire
  rationale: L’impératif direct et le terme « sanctuaire » rendent naturellement l’ordre et évitent de limiter indûment le lieu à une salle précise.
- source_word: מָעַלְתָּ
  choice: tu as commis une infidélité
  rationale: Le verbe מעל exprime ici une faute grave contre l’ordre sacré, et non une simple erreur de procédure.
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: tu n’en recevras aucun honneur de la part du SEIGNEUR Dieu
  rationale: La proposition hébraïque est elliptique. Cette formulation française explicite sobrement que l’acte d’Ozias ne lui vaudra aucun honneur venant de Dieu, sans préciser davantage la nature de cet honneur.
theological_decisions:
- issue: Exclusivité sacerdotale de l’offrande d’encens
  choice: Le droit de brûler l’encens dans le sanctuaire appartient aux prêtres descendants d’Aaron qui ont été consacrés à cette fonction.
  alternative: Une affirmation générale sur la direction du culte opposant royauté et sacerdoce.
  rationale: Le verset vise concrètement l’offrande d’encens et l’attribue aux prêtres aaroniques consacrés ; la traduction ne généralise pas au-delà de cette affirmation.
- issue: Portée de מָעַלְתָּ
  choice: Ozias a commis une infidélité grave dans le domaine sacré.
  alternative: Ozias a seulement enfreint une règle de procédure.
  rationale: Dans ce contexte cultuel, le verbe désigne une rupture de fidélité ou une profanation, avec une gravité supérieure à celle d’une irrégularité mineure.
- issue: Sens de la proposition finale elliptique
  choice: L’acte d’Ozias ne lui procurera aucun honneur venant de Dieu.
  alternative: 'La proposition pourrait être conservée mot à mot : « et non pour toi comme honneur de la part du SEIGNEUR Dieu ».'
  rationale: L’hébreu ne fournit pas de verbe explicite dans cette proposition. La traduction rétablit le rapport de conséquence nécessaire en français tout en signalant l’ellipse dans une note.
translation_notes:
  register: Français international moderne, digne et direct. Le discours conserve la fermeté de la confrontation et le vocabulaire cultuel précis, sans archaïsmes inutiles. Les répétitions de « brûler de l’encens » et « Ozias » sont maintenues parce qu’elles structurent l’insistance du texte hébreu.
