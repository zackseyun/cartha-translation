lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefs de familles
  rationale: Dans ce contexte généalogique et militaire, l’expression désigne les responsables des groupes familiaux ou maisons ancestrales. « Chefs de familles » est naturel en français moderne sans suggérer qu’il s’agit de tous les pères.
- source_word: לְגִבּוֹרֵי חָיִל
  choice: parmi ces vaillants guerriers
  rationale: גִּבּוֹרֵי חַיִל désigne ici des hommes reconnus pour leur valeur militaire. La préposition לְ rattache les chefs à cet ensemble; « parmi » exprime clairement cette relation dans la phrase française.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: deux mille six cents
  rationale: Rendu direct et idiomatique du nombre hébreu.
