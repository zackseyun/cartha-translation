source:
  edition: WLC
  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ עֻזִּיָּ֣הוּ בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יכיליה מִן יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: fr
  text: Ozias avait seize ans lorsqu’il devint roi[a], et il régna cinquante-deux ans à Jérusalem. Sa mère s’appelait Yekolia[b] et elle était originaire de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand il commença à régner » ou « lors de son accession à la royauté ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom hébreu est aussi transcrit Jekolia ou Yekolya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: avait seize ans
  rationale: Cette formulation rend naturellement en français l’expression hébraïque idiomatique indiquant l’âge.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction avec בְּ situe l’âge d’Ozias au moment de son accession à la royauté.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne ici l’exercice de la royauté pendant une durée déterminée.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: cinquante-deux ans
  rationale: Forme usuelle du nombre en français contemporain.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » exprime naturellement le lieu où s’exerce le règne.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Rendu français naturel de la formule hébraïque « le nom de sa mère était ».
- source_word: יכיליה
  choice: Yekolia
  rationale: Translittération française lisible, proche des consonnes et de la vocalisation massorétique du nom hébreu.
- source_word: מִן יְרוּשָׁלִָם
  choice: elle était originaire de Jérusalem
  rationale: מִן indique ici vraisemblablement l’origine; l’explicitation évite en français une tournure nominale maladroite.
