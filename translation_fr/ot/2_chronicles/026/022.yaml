  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: fr
  text: Le prophète Ésaïe, fils d’Amots, a écrit le reste des actes[a] d’Ozias, les premiers comme les derniers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des paroles d’Ozias ». Dans les sommaires royaux hébreux, « paroles » désigne les événements ou les actes d’un règne.'
    reason: Préciser le sens historiographique de l’expression hébraïque rendue par « actes ».
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Le reste de
  rationale: יֶתֶר désigne ce qui demeure ou ce qui reste. « Le reste de » convient naturellement à la formule récapitulative employée ici.
- source_word: דִּבְרֵי
  choice: des actes
  rationale: Bien que דְּבָרִים signifie littéralement « paroles » ou « choses », dans les sommaires royaux ce terme désigne les faits et gestes, ou les événements, d’un règne.
- source_word: עֻזִּיָּהוּ
  choice: Ozias
  rationale: « Ozias » est la forme française traditionnelle et courante du nom עֻזִּיָּהוּ présent dans ce verset.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: les premiers comme les derniers
  rationale: Cette formulation garde les deux adjectifs coordonnés de l’hébreu tout en exprimant naturellement en français l’ensemble du règne.
- source_word: כָּתַב
  choice: a été mis par écrit
  rationale: Le verbe signifie « écrire ». La tournure passive produit une phrase française naturelle sans modifier l’identité de l’auteur indiquée dans le texte.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: le prophète Ésaïe, fils d’Amots
  rationale: Les formes françaises usuelles des noms sont retenues, et le titre défini « le prophète » est traduit explicitement.
theological_decisions:
- issue: Sens de דִּבְרֵי dans la formule des annales royales
  choice: actes
  alternative: paroles ; faits concernant Ozias
  rationale: Dans ce contexte historiographique, le terme renvoie aux événements et aux actions du règne, non aux seules paroles du roi. Une note conserve toutefois le sens lexical plus littéral.
- issue: Portée de הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: les premiers comme les derniers
  alternative: du début à la fin ; les premiers et les derniers
  rationale: La traduction maintient la paire hébraïque et son idée d’étendue complète, sans préciser davantage la nature ou l’organisation de l’écrit attribué à Ésaïe.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe passive évite une inversion lourde tout en conservant Ésaïe comme auteur explicite. Le connecteur initial וְ n’est pas surtraduit par un marqueur temporel absent de l’hébreu.
