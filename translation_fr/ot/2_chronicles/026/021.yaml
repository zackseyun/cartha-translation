source:
  edition: WLC
  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: fr
  text: Le roi Ozias resta atteint de la lèpre[a] jusqu’au jour de sa mort. Il habita dans une maison à l’écart[b], atteint de la lèpre, car il était retranché de la maison de Yahweh. Son fils Yotam avait la responsabilité de la maison du roi et jugeait le peuple du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traditionnellement traduit par «lèpre» désigne diverses affections de la peau et ne correspond pas nécessairement à la lèpre au sens médical moderne.
    reason: lexical_clarification
  - marker: b
    text: L’expression hébraïque est obscure; littéralement, elle pourrait se rendre par «une maison de liberté». Elle désigne probablement une demeure séparée où Ozias vivait à l’écart en raison de son état.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצֹרָע
  choice: atteint de la lèpre
  rationale: Cette formulation conserve le terme biblique traditionnel sans identifier nécessairement l’affection à la maladie moderne appelée lèpre; une note explicite la portée plus large du mot hébreu.
- source_word: בֵּית הַחפשות
  choice: une maison à l’écart
  rationale: L’expression hébraïque est difficile. Le contexte indique vraisemblablement une demeure séparée où Ozias vivait isolé; cette traduction naturelle communique ce sens sans effacer l’incertitude, signalée en note.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: il était retranché de la maison de Yahweh
  rationale: «Retranché» rend la force de גזר et exprime son exclusion du sanctuaire sans préciser davantage la nature juridique ou rituelle de cette séparation.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction garde l’image hébraïque de la «maison», qui désigne ici le temple, et rend directement le nom divin.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: avait la responsabilité de la maison du roi
  rationale: Cette expression française naturelle communique la fonction de supervision exercée par Yotam sur la maison ou l’administration royale sans définir trop précisément son titre.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: jugeait le peuple du pays
  rationale: «Jugeait» conserve le sens lexical direct tout en laissant ouverte la dimension plus large de gouvernement que le verbe peut porter ici.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette traduction proche de l’hébreu évite d’imposer un sens sociopolitique plus étroit tel que «le petit peuple».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; «Yahweh» préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Nature de la צרעת d’Ozias
  choice: atteint de la lèpre, avec une note de portée lexicale
  alternative: atteint d’une maladie de peau
  rationale: Le choix maintient la désignation biblique traditionnelle tout en évitant, grâce à la note, d’assimiler avec certitude cette affection à un diagnostic médical moderne.
translation_notes:
  register: Français international moderne, sobre et digne. Les formulations «maison de Yahweh», «maison du roi» et «peuple du pays» conservent les images et les ambiguïtés du texte hébreu, tandis que «avait la responsabilité de» évite un calque administratif peu naturel.
