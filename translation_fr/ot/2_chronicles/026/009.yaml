  text: וַ/יִּ֨בֶן עֻזִּיָּ֤הוּ מִגְדָּלִים֙ בִּ/יר֣וּשָׁלִַ֔ם עַל שַׁ֧עַר הַ/פִּנָּ֛ה וְ/עַל שַׁ֥עַר הַ/גַּ֖יְא וְ/עַל הַ/מִּקְצ֑וֹעַ וַֽ/יְחַזְּקֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: fr
  text: Ozias construisit des tours à Jérusalem, à la porte de l’Angle, à la porte de la Vallée et à l’Angle[a], et il les fortifia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au tournant » ou « au coin » ; le terme hébreu désigne un angle, un coin ou un changement de direction dans une fortification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le verbe בנה signifie simplement « bâtir, construire ». « Construisit » convient naturellement à des ouvrages défensifs.
- source_word: עֻזִּיָּהוּ
  choice: Ozias
  rationale: Forme française traditionnelle et couramment reconnue du nom royal.
- source_word: מִגְדָּלִים
  choice: des tours
  rationale: Le nom מגדלים désigne des tours; l’idée de fortification est exprimée séparément par le dernier verbe.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition ב marque ici le lieu; « à Jérusalem » est la formulation française idiomatique.
- source_word: עַל
  choice: près de
  rationale: Dans cette description topographique, עַל situe les tours aux différents points des remparts sans imposer l’idée qu’elles étaient littéralement posées sur les portes.
- source_word: שַׁעַר הַפִּנָּה
  choice: la porte de l’Angle
  rationale: Le syntagme construit nomme une porte de la ville. « Porte de l’Angle » rend פנה et conserve son caractère toponymique.
- source_word: שַׁעַר הַגַּיְא
  choice: la porte de la Vallée
  rationale: גיא signifie « vallée »; la majuscule signale ici le nom d’une porte.
- source_word: הַמִּקְצוֹעַ
  choice: le Tournant
  rationale: Le terme désigne l’angle ou le tournant d’une fortification. « Tournant » préserve le sens topographique tout en le distinguant de la porte de l’Angle déjà mentionnée.
- source_word: וַיְחַזְּקֵם
  choice: et il les fortifia
  rationale: Au piel, חזק signifie ici renforcer ou fortifier. Le suffixe masculin pluriel renvoie le plus naturellement aux tours.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les noms topographiques sont rendus comme des désignations propres; la répétition de « porte » est légèrement allégée sans modifier la structure du verset.
