  text: ה֚וּא בָּנָ֣ה אֶת אֵיל֔וֹת וַ/יְשִׁיבֶ֖/הָ לִֽ/יהוּדָ֑ה אַחֲרֵ֥י שְׁכַֽב הַ/מֶּ֖לֶךְ עִם אֲבֹתָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: fr
  text: Il bâtit Éloth et la rendit à Juda[a], après que le roi se fut couché avec ses ancêtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ramena à Juda ».
    reason: lexical_alternative
  - marker: b
    text: « Se coucher avec ses ancêtres » est une expression hébraïque qui signifie mourir.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: bâtit
  rationale: Le verbe signifie normalement « bâtir ». « Rebâtit » est possible dans le contexte, mais ajouterait une nuance qui n’est pas exprimée explicitement.
- source_word: אֵילוֹת
  choice: Éloth
  rationale: Translittération française du nom de lieu sous sa forme biblique.
- source_word: וַיְשִׁיבֶהָ
  choice: la rendit
  rationale: Le hiphil de שוב exprime ici le fait de faire revenir Éloth sous l’autorité de Juda. « La rendit à Juda » communique naturellement cette restitution politique.
- source_word: לִיהוּדָה
  choice: à Juda
  rationale: La préposition ל indique ici le destinataire ou le terme de la restitution.
- source_word: אַחֲרֵי שְׁכַב
  choice: après que… se fut couché
  rationale: Cette formulation conserve l’euphémisme hébreu de la formule royale de décès, sans le remplacer directement par « après la mort de ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu porte « le roi » plutôt que son nom propre, même si le contexte permet de l’identifier.
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: « Ancêtres » rend le sens collectif de אבות en français moderne tout en conservant la structure de l’expression idiomatique.
theological_decisions:
- issue: Formule euphémique désignant la mort
  choice: Conserver « se fut couché avec ses ancêtres » dans le texte et en expliquer le sens en note.
  alternative: Traduire directement « après la mort du roi ».
  rationale: La formulation retenue préserve l’image et la tension propres à l’hébreu, tandis que la note évite toute ambiguïté pour le lecteur moderne.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique; le plus-que-parfait du subjonctif « se fut couché » marque naturellement l’antériorité après « après que », tout en conservant l’euphémisme hébreu.
