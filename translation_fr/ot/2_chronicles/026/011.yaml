  source_fidelity: 'Le sens militaire et administratif du verset est bien rendu : une force apte à la guerre, organisée en unités, dénombrée, puis placée sous deux responsables eux-mêmes sous la supervision d’un chef royal. « Ses hommes » explicite correctement le pluriel participial hébreu après le collectif « armée ». Toutefois, « selon les effectifs de leur recensement » est lourd et brouille légèrement le rapport entre le nombre et l’opération de dénombrement.'
