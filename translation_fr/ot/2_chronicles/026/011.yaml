source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/עֻזִּיָּ֡הוּ חַיִל֩ עֹשֵׂ֨ה מִלְחָמָ֜ה יוֹצְאֵ֧י צָבָ֣א לִ/גְד֗וּד בְּ/מִסְפַּר֙ פְּקֻדָּתָ֔/ם בְּ/יַד֙ יעואל הַ/סּוֹפֵ֔ר וּ/מַעֲשֵׂיָ֖הוּ הַ/שּׁוֹטֵ֑ר עַ֚ל יַד חֲנַנְיָ֔הוּ מִ/שָּׂרֵ֖י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: fr
  text: Ozias avait une armée prête au combat. Ses hommes partaient en campagne par unités, selon le dénombrement de leurs effectifs[a], sous la direction de Jeïel[b], le secrétaire, et de Maaséya, l’officier, sous l’autorité de Hanania, l’un des chefs du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon le nombre établi lors de leur mobilisation ». Le terme hébreu désigne ici un dénombrement ou un enregistrement officiel des soldats.
    reason: lexical_alternative
  - marker: b
    text: Le nom est écrit יעואל dans le texte hébreu de ce verset; il peut aussi être transcrit « Yiel » ou « Yeouel ».
    reason: textual_name_form
lexical_decisions:
- source_word: חַיִל
  choice: armée
  rationale: Dans ce contexte de mobilisation et d’organisation militaires, le terme désigne une force armée plutôt que la richesse, la puissance ou la vaillance abstraite.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: prête au combat
  rationale: Cette expression participiale caractérise l’armée comme apte à faire la guerre; la formulation française est naturelle et conserve cette valeur militaire.
- source_word: יוֹצְאֵי צָבָא
  choice: ses hommes partaient en campagne
  rationale: L’expression désigne ceux qui sortent pour le service militaire ou la guerre. La reprise par « ses hommes » rend naturellement en français le passage du collectif singulier « armée » au pluriel hébreu.
- source_word: לִגְדוּד
  choice: par unités
  rationale: Dans ce cadre d’organisation et de dénombrement, גְּדוּד désigne des groupes militaires constitués; « unités » évite de préciser sans nécessité leur taille.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: selon les effectifs de leur recensement
  rationale: פְּקֻדָּה renvoie ici au dénombrement ou à la mobilisation officielle des soldats. « Effectifs » et « recensement » expriment ensemble la dimension numérique et administrative.
- source_word: בְּיַד
  choice: sous la direction de
  rationale: Littéralement « par la main de », cet idiome indique ici la responsabilité administrative exercée par Yéiel et Maaséya.
- source_word: הַסּוֹפֵר
  choice: le secrétaire
  rationale: סֹפֵר peut désigner un scribe ou un secrétaire officiel. Dans cette structure administrative, « secrétaire » rend clairement la fonction sans suggérer seulement le travail de copiste.
- source_word: הַשּׁוֹטֵר
  choice: l’officier
  rationale: שֹׁטֵר désigne un agent investi d’une fonction administrative ou militaire; « officier » convient au contexte tout en restant assez large.
- source_word: עַל יַד
  choice: sous l’autorité de
  rationale: L’expression marque ici le niveau supérieur de supervision exercé par Hanania sur les deux responsables nommés auparavant.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: l’un des chefs du roi
  rationale: שַׂר peut signifier chef, commandant, prince ou haut fonctionnaire. « Chef » préserve cette largeur sémantique tout en convenant au contexte militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase hébraïque très dense est divisée en deux phrases afin d’éviter une rupture d’accord entre le collectif singulier « armée » et le participe pluriel désignant ceux qui partent en campagne. Les titres administratifs restent fonctionnels sans leur imposer une précision institutionnelle absente du texte.
