source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: fr
  text: Mais lorsqu’il devint puissant, son cœur s’éleva jusqu’à sa perte[a]. Il se montra infidèle envers Yahweh, son Dieu, et entra dans le temple de Yahweh pour brûler de l’encens sur l’autel de l’encens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à se corrompre ». L’expression hébraïque peut désigner soit la ruine qui résulta de son orgueil, soit la corruption à laquelle cet orgueil le conduisit.'
    reason: Préserve l’ambiguïté grammaticale et sémantique de עַד לְהַשְׁחִית sans imposer une seule analyse.
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Mais lorsqu’il devint puissant
  rationale: La préposition כְּ a ici une valeur temporelle (« lorsque »), tandis que חֶזְקָתוֹ évoque l’accession à la force ou à la puissance. Cette formulation française conserve l’enchaînement narratif sans expliciter abusivement un rapport causal.
- source_word: גָּבַהּ לִבּוֹ
  choice: son cœur s’éleva
  rationale: La traduction garde l’image hébraïque du cœur qui devient haut, image exprimant l’orgueil, sans remplacer directement la métaphore par son interprétation.
- source_word: עַד לְהַשְׁחִית
  choice: jusqu’à causer sa perte[a]
  rationale: 'Le contexte favorise une valeur résultative : l’élévation de son cœur aboutit à sa ruine. La note conserve l’autre analyse possible, selon laquelle la tournure vise sa corruption morale.'
- source_word: וַיִּמְעַל
  choice: Il se montra infidèle
  rationale: Le verbe מעל désigne une infidélité grave ou une rupture de fidélité, notamment envers Dieu. « Se montrer infidèle » est naturel en français et garde la portée relationnelle et cultuelle du terme.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: envers Yahweh, son Dieu
  rationale: Avec מעל, la préposition ב marque la personne envers laquelle l’infidélité est commise. « Envers » est idiomatique en français, et le nom divin est rendu par « Yahweh ».
- source_word: הֵיכַל יְהוָה
  choice: le temple de Yahweh
  rationale: Dans ce contexte, הֵיכָל désigne le bâtiment sacré du temple. « Temple » est précis, courant et naturel.
- source_word: לְהַקְטִיר
  choice: pour faire brûler de l’encens
  rationale: Le hiphil de קטר désigne ici l’action cultuelle de faire fumer ou brûler l’encens. Cette formulation reste proche de la forme causative hébraïque.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel de l’encens
  rationale: Cette expression cultuelle désigne l’autel réservé à l’encens. La tournure retenue est transparente et consacrée en français biblique moderne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » représente le nom divin comme nom propre et le distingue du titre אֲדֹנָי.
- issue: Nature de l’infidélité exprimée par מעל
  choice: se montra infidèle envers Yahweh
  alternative: commit une faute contre Yahweh ; trahit Yahweh
  rationale: Le choix conserve la dimension de rupture de fidélité sans introduire une terminologie confessionnelle particulière ni réduire l’acte à une faute générique.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore hébraïque du cœur qui s’élève est maintenue, tandis que la syntaxe est rendue assez naturelle pour une lecture publique. Le vocabulaire cultuel reste précis sans archaïsme.
