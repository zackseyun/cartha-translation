  source_fidelity: Le projet conserve correctement l’opposition entre אֱלֹהִים (« Dieu ») et יהוה (« Yahweh »), le sens dévotionnel de « chercher », la durée de la seconde proposition et la causalité divine de « le fit prospérer ». La formulation de Zacharie doit toutefois rendre plus clairement son discernement relatif aux « visions de Dieu », sans effacer le caractère difficile de l’expression hébraïque.
  naturalness: « Il persévéra à chercher » suggère une persévérance après une action antérieure et sonne moins naturel ici. « Avait de l’intelligence dans les visions » est un calque peu idiomatique en français moderne. « Chercha » après « tant qu’ » est possible dans un style littéraire, mais « recherchait » rend plus naturellement la durée exprimée par l’hébreu.
  terminology: « Zacharie », « Dieu » et « Yahweh » conviennent. « Discernement au sujet des visions de Dieu » est plus naturel tout en conservant le lien avec les visions et sans imposer la lecture alternative de la crainte de Dieu.
