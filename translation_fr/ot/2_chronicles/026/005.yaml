  - severity: medium
    issue: « qui avait de l’intelligence dans les visions de Dieu » est peu idiomatique et obscur en français.
    rationale: Le participe hébreu décrit un discernement ou une compréhension en rapport avec les visions de Dieu. « Qui avait du discernement au sujet des visions de Dieu » conserve cette relation et la difficulté relative de l’expression.
