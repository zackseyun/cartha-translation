base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: fr
  text: Il chercha Dieu du temps de Zacharie[a], qui avait du discernement au sujet des visions de Dieu. Aussi longtemps qu’il recherchait Yahweh[b], Dieu le fit prospérer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre lecture : « qui instruisait dans la crainte de Dieu ». L’expression hébraïque est difficile ; le texte massorétique dit plus littéralement : « qui avait du discernement dans les visions de Dieu ».'
    reason: Lecture alternative d’une expression hébraïque difficile.
  - marker: b
    text: 'Ou : « et aux jours où il cherchait Yahweh ».'
    reason: Rendu plus formel de l’expression temporelle hébraïque.
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Il persévéra à chercher Dieu
  rationale: La construction périphrastique היה + infinitif exprime ici une pratique continue. « Persévéra à chercher » rend cette durée en français naturel, tandis que « chercher Dieu » conserve le sens religieux de דרש dans les Chroniques.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: du temps de Zacharie
  rationale: Expression temporelle française naturelle correspondant à « aux jours de Zacharie », sans archaïsme inutile.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: qui avait de l’intelligence dans les visions de Dieu
  rationale: Cette formulation reste proche du texte massorétique, qui associe le discernement de Zacharie à une expression dérivée de « voir ». Elle préserve aussi la difficulté de l’hébreu au lieu de la résoudre silencieusement.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: Et tant qu’il chercha Yahweh
  rationale: « Tant que » exprime naturellement la période continue caractérisée par la recherche de Yahweh et son lien avec la prospérité qui suit, sans transformer explicitement la proposition en condition formelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, distinguée du titre « Seigneur ».
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: Dieu le fit prospérer
  rationale: 'Le hiphil de צלח exprime la causation : Dieu lui accorde la réussite ou la prospérité.'
theological_decisions:
- issue: Sens de בִּרְאֹת הָאֱלֹהִים
  choice: Zacharie avait de l’intelligence dans les visions de Dieu
  alternative: Zacharie enseignait la crainte de Dieu
  rationale: Le texte massorétique vocalisé renvoie à la vue ou aux visions, tandis qu’une autre lecture ancienne ou conjecturale comprend « crainte » et parfois une activité d’enseignement. Le texte principal suit les données massorétiques et la note conserve l’autre interprétation.
- issue: Portée temporelle de וּבִימֵי דָּרְשׁוֹ
  choice: tant qu’il chercha Yahweh
  alternative: aux jours où il cherchait Yahweh
  rationale: Le choix retenu exprime la continuité et le rapport avec la réussite accordée par Dieu, tout en laissant subsister la tension entre simple indication temporelle et nuance conditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Du temps de » évite la raideur de « aux jours de ». Le tour « avait de l’intelligence dans les visions » demeure volontairement légèrement inhabituel afin de ne pas masquer la difficulté du texte hébreu.
