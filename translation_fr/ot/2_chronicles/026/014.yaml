base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: fr
  text: Ozias prépara pour eux, pour toute l’armée, des boucliers, des lances, des casques, des cuirasses, des arcs et des pierres de fronde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּכֶן
  choice: prépara
  rationale: Le hifil de כון exprime ici le fait de tenir du matériel prêt ou de le mettre à disposition; « prépara » conserve cette nuance sans affirmer qu’Ozias l’a fabriqué.
- source_word: לָהֶם
  choice: pour eux
  rationale: Le pronom renvoie aux soldats mentionnés dans le contexte; la proposition suivante en précise le référent.
- source_word: לְכָל הַצָּבָא
  choice: pour toute l’armée
  rationale: צָבָא désigne ici les forces militaires; cette formulation française est naturelle et rend la portée globale de לְכָל.
- source_word: מָגִנִּים
  choice: boucliers
  rationale: Terme militaire courant et direct.
- source_word: רְמָחִים
  choice: lances
  rationale: « Lances » rend clairement ce terme générique désignant une arme d’hast.
- source_word: כּוֹבָעִים
  choice: casques
  rationale: Dans cette liste d’équipement militaire, le mot désigne une protection de la tête.
- source_word: שִׁרְיֹנוֹת
  choice: cuirasses
  rationale: Le terme désigne une armure protégeant le torse; « cuirasses » est précis, digne et courant dans un contexte militaire ancien, sans spécifier indûment une cotte de mailles.
- source_word: קְשָׁתוֹת
  choice: arcs
  rationale: Équivalent français direct du nom pluriel.
- source_word: אַבְנֵי קְלָעִים
  choice: pierres de fronde
  rationale: Cette expression suit de près le littéral hébreu « pierres de frondes » tout en étant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne international, clair et soutenu. La répétition « pour eux, pour toute l’armée » est conservée afin de refléter la structure emphatique de l’hébreu. Aucune note n’est nécessaire, puisque « pierres de fronde » rend directement l’expression hébraïque sans ambiguïté notable.
