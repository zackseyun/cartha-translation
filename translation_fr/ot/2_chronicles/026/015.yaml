source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: fr
  text: À Jérusalem, il fit fabriquer des dispositifs[a], conçus par des artisans habiles, pour les placer sur les tours et aux angles des remparts, afin de lancer des flèches et de grosses pierres. Sa renommée se répandit au loin[b], car il fut merveilleusement aidé[c], jusqu’à ce qu’il devienne puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « machines » ou « mécanismes » : il s’agit de dispositifs militaires destinés aux fortifications.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son nom sortit jusqu’au loin ».'
    reason: lexical_alternative
  - marker: c
    text: Le texte ne précise pas ici qui lui apporta cette aide, bien que le contexte suggère une aide divine.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: dispositifs
  rationale: Le nom désigne des inventions ou mécanismes conçus dans un but précis. « Dispositifs » reste naturel en français moderne et évite de préciser abusivement leur technologie.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: conçus par des artisans habiles
  rationale: La construction paronymique souligne à la fois la conception réfléchie et le savoir-faire du concepteur. Cette formulation rend ces deux aspects sans lourdeur.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: sur les tours et aux angles des remparts
  rationale: « Tours » traduit directement מגדלים. Dans ce contexte de fortifications, פנות désigne les angles; l’ajout de « des remparts » explicite naturellement leur cadre sans les transformer nécessairement en tours d’angle.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: afin de lancer des flèches et de grosses pierres
  rationale: L’infinitif exprime le but et ירה peut désigner l’action de tirer ou de lancer. « Lancer » convient aux deux projectiles gouvernés par le même verbe hébreu.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: sa renommée se répandit au loin
  rationale: L’expression littérale « son nom sortit » est un idiome relatif à la réputation. La formulation française en restitue clairement le sens tout en conservant l’idée d’une vaste diffusion.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: il fut merveilleusement aidé
  rationale: Le tour hébreu exprime une aide remarquable ou extraordinaire et maintient l’auteur de cette aide implicite. Le passif français préserve ces deux traits.
- source_word: עַד כִּי חָזָק
  choice: jusqu’à ce qu’il devienne puissant
  rationale: La proposition indique le point atteint grâce à cette aide. « Devienne puissant » convient au développement de la puissance royale et militaire décrit par le contexte.
theological_decisions:
- issue: Identité de celui qui aide le roi
  choice: 'L’auteur de l’aide reste implicite dans le texte principal : « il fut merveilleusement aidé ».'
  alternative: 'Expliciter l’aide divine : « l’Éternel l’aida merveilleusement ».'
  rationale: Le contexte général suggère fortement une aide divine, mais cette proposition hébraïque n’en nomme pas explicitement l’auteur. Le passif conserve donc la tension du texte sans ajouter un référent.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’arrière-plan militaire sans employer de termes techniques anachroniques. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal et suivent l’ordre d’apparition.
