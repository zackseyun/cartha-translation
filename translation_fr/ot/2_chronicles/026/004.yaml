source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahvé[a], selon tout ce qu’avait fait Amatsia, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux yeux du SEIGNEUR ».
    reason: Variante lexicale et convention traditionnelle pour rendre le nom divin יהוה, tout en conservant l’idiome « aux yeux de ».
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait avancer le récit. En français, le passé simple convient au registre narratif historique, sans qu’il soit nécessaire de rendre explicitement le waw par « Et ».
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: Avec עשה, l’adjectif substantivé יָשָׁר exprime l’idée de faire ce qui est juste ou droit. « Ce qui est droit » est naturel, digne et proche de l’image hébraïque.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression idiomatique indique une appréciation ou un jugement du point de vue de quelqu’un. « Aux yeux de » conserve naturellement la métaphore en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par le titre substitutif « le SEIGNEUR ».
- source_word: כְּכֹל אֲשֶׁר
  choice: exactement comme
  rationale: La construction marque la conformité au modèle antérieur, tandis que כֹל en souligne l’étendue. « Exactement comme » exprime cette conformité complète sans lourdeur.
- source_word: עָשָׂה
  choice: l’avait fait
  rationale: Le plus-que-parfait indique naturellement en français que l’action d’Amatsia est antérieure à celle qui vient d’être rapportée.
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Cette forme suit la translittération française biblique courante du nom hébreu.
- source_word: אָבִיו
  choice: son père
  rationale: Dans le contexte historique immédiat, Amatsia est bien le père d’Ozias; le sens plus large d’« ancêtre » n’est donc pas requis.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. La traduction principale le conserve sous sa forme française usuelle; la note signale la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton du récit historique. La formulation conserve l’idiome hébreu « aux yeux de » tout en restant naturelle.
