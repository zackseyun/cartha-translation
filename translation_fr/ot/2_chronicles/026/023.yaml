base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: fr
  text: 'Ozias se coucha avec ses pères, et on l’enterra avec ses pères dans le champ funéraire des rois, car on disait : « Il est atteint d’une maladie de peau[a]. » Son fils Yotam régna à sa place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est lépreux. » Le terme hébreu désigne une personne atteinte de צָרַעַת, une catégorie d’affections cutanées qui ne correspond pas nécessairement à la lèpre au sens médical moderne.'
    reason: Préciser l’étendue sémantique du terme hébreu et conserver le rendu traditionnel comme variante.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עֻזִּיָּהוּ עִם אֲבֹתָיו
  choice: Ozias se coucha avec ses pères
  rationale: La formule royale emploie l’euphémisme שׁכב « se coucher » pour la mort. La traduction conserve cette image et la formule dynastique, tout en restant intelligible en français biblique moderne.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: on l’enterra
  rationale: Le verbe hébreu est actif au pluriel avec des agents non précisés. Le pronom indéfini « on » rend naturellement cette indétermination en français.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: La répétition de la formule hébraïque est conservée. Dans le contexte funéraire, elle exprime l’association avec ses prédécesseurs royaux sans imposer qu’il ait été placé dans le même tombeau.
- source_word: בִּשְׂדֵה הַקְּבוּרָה אֲשֶׁר לַמְּלָכִים
  choice: dans le champ funéraire réservé aux rois
  rationale: « Champ funéraire » préserve l’image concrète de שׂדה, tandis que « réservé aux rois » exprime naturellement le rapport d’affectation marqué par ל sans trancher strictement entre possession et destination.
- source_word: כִּי אָמְרוּ
  choice: car on disait
  rationale: כִּי introduit le motif de ce lieu d’inhumation. L’imparfait français convient à une parole collective rapportée comme justification, et « on » garde les locuteurs indéterminés.
- source_word: מְצוֹרָע
  choice: atteint d’une maladie de peau
  rationale: מְצוֹרָע désigne une personne touchée par צָרַעַת, catégorie biblique qui ne correspond pas nécessairement à la lèpre moderne. Cette formulation évite un diagnostic médical anachronique.
- source_word: וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו
  choice: Son fils Yotam régna à sa place
  rationale: « Régna à sa place » rend la formule de succession dynastique et conserve la valeur de remplacement de תַּחְתָּיו.
theological_decisions:
- issue: Portée médicale et rituelle de מְצוֹרָע
  choice: Il est atteint d’une maladie de peau
  alternative: Il est lépreux
  rationale: Le terme hébreu renvoie à la catégorie biblique de צָרַעַת, plus large et différente d’un diagnostic certain de maladie de Hansen. Le texte principal privilégie donc une formulation exacte et compréhensible; la note conserve le rendu traditionnel.
- issue: Euphémisme funéraire « se coucher avec ses pères »
  choice: se coucha avec ses pères
  alternative: mourut et rejoignit ses ancêtres
  rationale: La formulation retenue préserve l’image et la tension de l’idiome hébreu sans l’expliciter davantage que le texte source.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms suivent les formes françaises usuelles « Ozias » et « Yotam ». La répétition « avec ses pères » reproduit volontairement celle de l’hébreu; « champ funéraire » conserve l’image du champ tout en restant naturel.
