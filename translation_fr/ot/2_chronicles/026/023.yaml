  terminology: « Ozias » et « Yotam » sont des formes françaises recevables. « Atteint d’une maladie de peau » évite d’assimiler sans nuance מְצֹרָע à la lèpre clinique moderne; la note conserve utilement le rendu traditionnel « lépreux ».
