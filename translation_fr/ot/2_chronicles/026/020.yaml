  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: fr
  text: 'Azaria, le prêtre en chef, se tourna vers lui, ainsi que tous les prêtres : voici qu’il était lépreux sur le front[c]. Ils le firent sortir précipitamment de là[a], et lui-même se hâta aussi de sortir[b], car Yahweh l’avait frappé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils le chassèrent de là ». Le verbe hébreu peut évoquer une évacuation urgente, voire énergique, ou mettre surtout l’accent sur la précipitation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « lui-même fut poussé à sortir ». La forme hébraïque peut indiquer qu’il fut entraîné ou contraint vers la sortie, même si le contexte peut aussi décrire son propre empressement.'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu rendu par « lépreux » désigne, dans les lois sacerdotales sur l’impureté, une affection de la peau; il ne correspond pas nécessairement à la lèpre au sens médical moderne, c’est-à-dire à la maladie de Hansen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: se tournèrent vers lui
  rationale: פנה avec אֶל exprime le fait de se tourner ou de faire face à quelqu’un. Le pluriel français rend naturellement le sujet composé, Azaria et tous les prêtres.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: Azaria, le prêtre en chef
  rationale: כֹהֵן הָרֹאשׁ signifie littéralement « le prêtre de tête ». « Prêtre en chef » est clair et évite d’imposer le titre technique « grand prêtre ».
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette formule conserve l’effet de découverte soudaine et la vivacité narrative de הִנֵּה.
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: lépreux au front
  rationale: Le terme appartient au vocabulaire des lois sacerdotales sur les affections cutanées rendant impur. La formulation concise conserve le terme traditionnel, avec une note qui prévient son identification automatique à la maladie de Hansen.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: ils le firent sortir précipitamment de là
  rationale: Le hiphil de בהל indique qu’on fait agir quelqu’un dans l’urgence ou l’affolement. La traduction exprime l’évacuation urgente sans affirmer avec certitude qu’elle fut violente.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: et lui-même se hâta aussi de sortir
  rationale: Le texte souligne qu’Ozias participa lui aussi à ce départ urgent. Le niphal de דחף peut toutefois évoquer le fait d’être poussé, possibilité conservée en note.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: car Yahweh l’avait frappé
  rationale: Dans ce contexte, נגע désigne une atteinte infligée par Dieu plutôt qu’un simple contact. Le plus-que-parfait marque que cette atteinte avait déjà eu lieu et motivait la sortie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu porte explicitement le tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Statut exprimé par כֹהֵן הָרֹאשׁ
  choice: le prêtre en chef
  alternative: le grand prêtre
  rationale: La formulation hébraïque dit « le prêtre de tête/en chef ». Le choix retenu évite de préciser davantage le titre institutionnel que ne le fait ce verset.
- issue: Agentivité d’Ozias dans נִדְחַף לָצֵאת
  choice: lui-même se hâta aussi de sortir
  alternative: lui-même fut poussé à sortir
  rationale: Le contexte présente Ozias comme quittant lui aussi rapidement les lieux, mais la forme passive du verbe permet de comprendre qu’il y fut poussé; cette tension est signalée en note.
translation_notes:
  register: Français international moderne, digne et narratif. « Voici que » maintient la soudaineté du récit; « prêtre en chef » reste accessible sans introduire un titre plus technique. Les notes conservent les ambiguïtés des deux verbes décrivant la sortie.
