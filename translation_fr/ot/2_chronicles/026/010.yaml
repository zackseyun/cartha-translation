source:
  edition: WLC
  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: fr
  text: Il construisit des tours dans le désert et creusa de nombreuses citernes, car il avait beaucoup de bétail dans les basses terres[a] et dans la plaine, ainsi que des cultivateurs et des vignerons dans les collines et sur les terres fertiles[b], car il aimait la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la Shéphéla », région de basses collines située entre les montagnes de Juda et la plaine côtière.
    reason: cultural_note
  - marker: b
    text: Ou « au Carmel », si le mot est compris comme un nom de lieu plutôt que comme une désignation des terres fertiles.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: tours
  rationale: Le nom désigne des tours. « Tours de garde » conviendrait au contexte, mais préciserait une fonction que l’hébreu n’exprime pas explicitement.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר peut désigner une région désertique, une steppe ou une zone de pâturage peu habitée. « Désert » est ici naturel en français sans impliquer nécessairement une étendue de sable.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: creusa de nombreuses citernes
  rationale: Le verbe évoque une excavation, souvent dans la roche, et בֹּרוֹת désigne ici vraisemblablement des réservoirs destinés à recueillir l’eau plutôt que des puits alimentés par une source.
- source_word: מִקְנֶה רַב
  choice: beaucoup de bétail
  rationale: מִקְנֶה est un collectif désignant les animaux d’élevage; « bétail » conserve cette portée sans la limiter aux bovins.
- source_word: שְׁפֵלָה
  choice: le Bas-Pays
  rationale: Le terme désigne la région de basses collines située entre les montagnes de Juda et la plaine côtière. « Bas-Pays » traduit le nom géographique tout en restant compréhensible, avec une note explicative.
- source_word: מִישׁוֹר
  choice: la plaine
  rationale: Le nom désigne un terrain plat ou un plateau; « plaine » est l’équivalent français le plus direct dans cette énumération géographique.
- source_word: אִכָּרִים
  choice: cultivateurs
  rationale: Le mot désigne ceux qui travaillent la terre, particulièrement les laboureurs. « Cultivateurs » est actuel et convient mieux que le terme plus général « agriculteurs » dans le parallélisme avec les vignerons.
- source_word: כֹרְמִים
  choice: vignerons
  rationale: Le terme désigne les personnes qui cultivent les vignes; « vignerons » est précis et idiomatique en français.
- source_word: בֶּהָרִים
  choice: dans les collines
  rationale: הָרִים peut signifier « montagnes » ou « collines ». Le relief agricole de Juda et le français naturel favorisent ici « collines ».
- source_word: בַּכַּרְמֶל
  choice: sur les terres fertiles
  rationale: כַּרְמֶל peut être compris ici comme un nom commun désignant une terre fertile ou cultivée. Cette lecture s’accorde avec l’énumération des types de terrain, tout en laissant en note la possibilité du nom propre Carmel.
- source_word: אֹהֵב אֲדָמָה
  choice: il aimait la terre
  rationale: La formulation conserve l’image concrète de l’hébreu, où אֲדָמָה désigne le sol ou la terre cultivable, sans paraphraser par « il aimait l’agriculture ».
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe distingue les cultivateurs des vignerons conformément à l’ordre hébreu, tout en rendant explicite par « Il avait aussi » la construction nominale elliptique. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
