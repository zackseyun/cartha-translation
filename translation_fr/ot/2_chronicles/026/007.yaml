  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: fr
  text: Dieu l’aida contre les Philistins, contre les Arabes qui habitaient à Gour-Baal et contre les Méounites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Maonites ». L’ethnonyme hébreu peut désigner un groupe apparenté ou refléter une variante de son nom.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: l’aida
  rationale: Le verbe עזר, avec le suffixe masculin singulier, signifie directement « il l’aida ». Cette formulation naturelle conserve Dieu comme sujet de l’action.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article en hébreu, le terme désigne ici le Dieu d’Israël selon l’usage narratif habituel ; en français, « Dieu » est la forme idiomatique.
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte militaire, la préposition indique les adversaires face auxquels Dieu aide Ozias.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Ethnonyme français traditionnel et courant correspondant à פְּלִשְׁתִּים.
- source_word: הערביים
  choice: les Arabes
  rationale: « Arabes » est l’ethnonyme moderne, clair et naturel pour ces populations d’Arabie, sans imposer une identification politique contemporaine.
- source_word: הַיֹּשְׁבִים
  choice: qui habitaient
  rationale: Le participe de ישב exprime ici la résidence ; l’imparfait convient à cette situation de fond dans le récit.
- source_word: בְּגוּר בָּעַל
  choice: à Gour-Baal
  rationale: Le nom de lieu est translittéré, et la préposition ב est rendue idiomatiquement par « à » devant une localité.
- source_word: הַמְּעוּנִים
  choice: les Méounites
  rationale: Cette translittération suit la forme consonantique hébraïque מעונים tout en laissant ouverte l’identification exacte du groupe.
