source:
  edition: WLC
  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: fr
  text: Le prêtre Azaria entra à sa suite, accompagné de quatre-vingts prêtres de Yahweh, des hommes vaillants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes de valeur ». L’expression hébraïque peut désigner des hommes caractérisés par la force, le courage ou la vaillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: entra à sa suite
  rationale: Le verbe בוא peut signifier venir, aller ou entrer, et אַחֲרָיו indique qu’Azaria suit le roi. « Entra à sa suite » rend naturellement le mouvement dans ce contexte sans préciser davantage le lieu que ne le fait l’hébreu.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: le prêtre Azaria
  rationale: Cette formulation française identifie clairement la fonction d’Azaria tout en conservant la forme usuelle de son nom.
- source_word: וְעִמּוֹ
  choice: accompagné de
  rationale: La tournure hébraïque indique que les prêtres sont avec Azaria. « Accompagné de » exprime cette relation de manière fluide et concise.
- source_word: כֹּהֲנִים לַיהוָה
  choice: prêtres de Yahweh
  rationale: 'Le lamed exprime ici la relation ou le service : ce sont des prêtres attachés au service de Yahweh.'
- source_word: שְׁמוֹנִים
  choice: quatre-vingts
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: בְּנֵי חָיִל
  choice: des hommes vaillants
  rationale: L’expression idiomatique désigne des hommes caractérisés par la force, le courage ou la vaillance. Dans ce contexte, elle souligne leur détermination à affronter le roi.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel divin plutôt que de le remplacer par un titre.
- issue: Portée de l’expression בְּנֵי חָיִל
  choice: des hommes vaillants
  alternative: des hommes de valeur
  rationale: L’expression masculine qualifie ici les prêtres, qui sont des hommes dans ce contexte. Le rendu retenu conserve à la fois cette référence et l’idée de courage, sans réduire חַיִל à la seule force physique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure hébraïque, tandis que « à sa suite » et « accompagné de » assurent une lecture naturelle.
