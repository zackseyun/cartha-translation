id: 2CH.26.6
reference: 2 Chronicles 26:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֔ים וַ/יִּפְרֹ֞ץ אֶת ח֣וֹמַת גַּ֗ת וְ/אֵת֙ חוֹמַ֣ת יַבְנֵ֔ה וְ/אֵ֖ת חוֹמַ֣ת אַשְׁדּ֑וֹד וַ/יִּבְנֶ֣ה עָרִ֔ים בְּ/אַשְׁדּ֖וֹד וּ/בַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: fr
  text: Il partit combattre les Philistins et fit une brèche[a] dans la muraille de Gath, dans celle de Yabné et dans celle d’Ashdod. Puis il bâtit des villes dans la région d’Ashdod[b] et parmi les Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abattit » ou « ouvrit une brèche dans » les murailles.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à Ashdod et parmi les Philistins ». « Ashdod » peut désigner ici la ville ou le territoire qui l’entourait.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא וַיִּלָּחֶם
  choice: Il partit combattre
  rationale: Cette formulation française naturelle conserve l’idée de sortir ou partir, suivie du combat, sans ajouter la nuance plus précise d’une marche militaire.
- source_word: בַּפְּלִשְׁתִּים
  choice: les Philistins
  rationale: L’hébreu désigne ici le peuple, et non le territoire de la Philistie.
- source_word: וַיִּפְרֹץ
  choice: fit une brèche
  rationale: Avec une muraille comme complément, פרץ évoque l’ouverture d’une brèche ou la démolition d’une partie de l’enceinte. « Fit une brèche » rend clairement l’action militaire sans imposer une destruction totale.
- source_word: חוֹמַת
  choice: la muraille de … celle de
  rationale: Le singulier est conservé pour chacune des trois villes. La reprise par « celle de » évite une répétition lourde tout en gardant la structure distributive du texte.
- source_word: גַּת
  choice: Gath
  rationale: Translittération française courante du nom de cette ville philistine.
- source_word: יַבְנֶה
  choice: Yabné
  rationale: Translittération directement fondée sur la forme hébraïque, adaptée à l’usage et à la prononciation du français.
- source_word: אַשְׁדּוֹד
  choice: Ashdod
  rationale: Translittération française courante du nom de la ville.
- source_word: וַיִּבְנֶה עָרִים
  choice: il bâtit des villes
  rationale: Le verbe בנה signifie « bâtir » et le contexte immédiat ne permet pas d’ajouter explicitement l’idée de reconstruction.
- source_word: בְּאַשְׁדּוֹד
  choice: dans la région d’Ashdod
  rationale: Puisqu’il est question de plusieurs villes, la mention d’Ashdod peut désigner le territoire dépendant de la ville. « Région » rend cette possibilité dans un français intelligible, tandis que la note conserve le sens plus littéral.
- source_word: וּבַפְּלִשְׁתִּים
  choice: parmi les Philistins
  rationale: Cette traduction respecte la désignation du peuple dans l’hébreu au lieu de la remplacer par le nom territorial « Philistie ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique écrit. La formulation reste accessible, évite le jargon militaire et conserve l’ambiguïté géographique d’Ashdod au moyen d’une note.
