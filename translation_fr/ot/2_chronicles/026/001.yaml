  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: fr
  text: Tout le peuple de Juda choisit[a] Ozias, qui avait seize ans[b], et le fit roi à la place de son père Amatsia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prit ». Ici, le verbe désigne l’action par laquelle le peuple choisit Ozias pour l’établir comme roi.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et lui [était] fils de seize ans », expression hébraïque signifiant « il avait seize ans ». La conjonction peut être simplement connective, comme dans le texte, ou recevoir une nuance concessive selon le contexte : « bien qu’il eût seize ans ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: choisit
  rationale: Le verbe signifie littéralement « prendre », mais, dans ce contexte d’accession au trône, « choisir » exprime naturellement en français l’action du peuple envers Ozias sans suggérer une saisie physique.
- source_word: כָּל עַם יְהוּדָה
  choice: tout le peuple de Juda
  rationale: Cette traduction conserve à la fois la totalité exprimée par כָּל et la dimension collective de עַם.
- source_word: עֻזִּיָּהוּ
  choice: Ozias
  rationale: Ozias est la forme française traditionnelle et courante correspondant au nom hébreu עֻזִּיָּהוּ présent dans ce verset; Azaria n’est pas la forme employée ici.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: qui avait seize ans
  rationale: Cette formulation idiomatique et neutre rend l’âge d’Ozias sans imposer au simple וְ une valeur concessive qui n’est pas explicite.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: le fit roi
  rationale: Le hiphil de מלך indique que le peuple établit Ozias comme roi. « Le fit roi » reste proche de la construction hébraïque sans ajouter l’idée d’une cérémonie de couronnement.
- source_word: תַּחַת אָבִיו אֲמַצְיָהוּ
  choice: à la place de son père Amatsia
  rationale: Dans un contexte de succession, תַּחַת signifie « à la place de ». « Amatsia » est la forme française usuelle du nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Choisit » évite le tour peu naturel « prit Ozias », tandis que « le fit roi » conserve la sobriété de l’hébreu. La proposition relative maintient la neutralité du lien syntaxique au lieu d’imposer une nuance concessive.
