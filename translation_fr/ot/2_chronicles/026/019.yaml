base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: fr
  text: Alors Ozias se mit en colère. Il tenait à la main un encensoir pour brûler de l’encens. Pendant qu’il était en colère contre les prêtres, la lèpre[a] se déclara sur son front, sous les yeux des prêtres, dans la maison de Yahweh, près de l’autel de l’encens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner plus largement une affection cutanée grave ou entraînant une impureté rituelle, et pas nécessairement la lèpre au sens médical moderne.
    reason: Précision lexicale sur le champ sémantique de צָרַעַת.
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: se mit en colère
  rationale: Le verbe exprime la colère ou l’indignation; cette tournure française rend naturellement l’entrée dans cet état sans en exagérer l’intensité.
- source_word: עֻזִּיָּהוּ
  choice: Ozias
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: מִקְטֶרֶת
  choice: encensoir
  rationale: Désigne le récipient cultuel servant à faire brûler ou à offrir l’encens.
- source_word: לְהַקְטִיר
  choice: pour brûler de l’encens
  rationale: L’infinitif exprime ici le but de l’action.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: Pendant qu’il était en colère contre les prêtres
  rationale: Rend la valeur circonstancielle et temporelle de la construction tout en conservant les prêtres comme objet de sa colère.
- source_word: הַצָּרַעַת
  choice: la lèpre
  rationale: Équivalent biblique traditionnel concis, accompagné d’une note afin de ne pas l’identifier à tort exclusivement à la maladie de Hansen moderne.
- source_word: זָרְחָה
  choice: se déclara
  rationale: Le verbe signifie littéralement « brilla » ou « jaillit »; dans ce contexte, il décrit l’apparition soudaine et visible de l’affection.
- source_word: בְמִצְחוֹ
  choice: sur son front
  rationale: Rendu anatomique direct et naturel en français.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: sous les yeux des prêtres
  rationale: Exprime clairement que les prêtres furent témoins de l’apparition.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Préserve l’expression hébraïque « maison » et rend le nom divin personnel par « Yahweh ».
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: près de l’autel de l’encens
  rationale: La combinaison prépositionnelle situe Ozias ou l’événement à proximité de l’autel; « près de » conserve ce sens spatial sans imposer une précision absente du contexte.
theological_decisions:
- issue: Portée de צָרַעַת
  choice: la lèpre, avec note explicative
  alternative: une affection cutanée
  rationale: « Lèpre » maintient le terme biblique traditionnel et sa gravité narrative, tandis que la note préserve l’étendue sémantique de l’hébreu et évite un diagnostic médical moderne trop précis.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; sa translittération conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international actuel, digne et accessible. Les phrases ont été légèrement segmentées pour éviter une période lourde, tout en maintenant la progression narrative et les répétitions significatives du texte hébreu.
