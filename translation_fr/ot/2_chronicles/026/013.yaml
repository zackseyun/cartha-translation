  text: וְ/עַל יָדָ/ם֩ חֵ֨יל צָבָ֜א שְׁלֹ֧שׁ מֵא֣וֹת אֶ֗לֶף וְ/שִׁבְעַ֤ת אֲלָפִים֙ וַ/חֲמֵ֣שׁ מֵא֔וֹת עוֹשֵׂ֥י מִלְחָמָ֖ה בְּ/כֹ֣חַ חָ֑יִל לַ/עְזֹ֥ר לַ/מֶּ֖לֶךְ עַל הָ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: fr
  text: Sous leurs ordres se trouvait une force militaire de 307 500 hommes[a], prête à combattre avec une grande force, pour aider le roi contre l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Sous leur autorité se trouvait une force militaire de 307 500 hommes, faisant la guerre avec force. » Le texte principal rend les expressions militaires hébraïques dans un français naturel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Sous leurs ordres
  rationale: L’expression idiomatique עַל־יָד avec suffixe indique ici l’autorité ou la responsabilité exercée par les chefs mentionnés au verset précédent, et non une action accomplie littéralement « par leur main ».
- source_word: חֵיל צָבָא
  choice: une armée
  rationale: La combinaison désigne une force militaire. « Une armée » restitue naturellement le sens sans reproduire lourdement les deux substantifs hébreux.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 307 500
  rationale: Le total des nombres hébreux est rendu selon la présentation numérique usuelle en français moderne.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: aptes à combattre
  rationale: Littéralement « faisant la guerre », cette expression militaire désigne ici les hommes en état de participer au combat dans le cadre d’un recensement administratif. « Aptes à combattre » évite de suggérer qu’ils étaient déjà engagés dans une bataille.
- source_word: בְּכֹחַ חָיִל
  choice: avec une grande puissance
  rationale: La formulation conserve l’intensification produite par כֹּחַ et חַיִל, qui évoquent ensemble force, vaillance et puissance militaire.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: afin d’aider le roi
  rationale: Le verbe עזר signifie directement « aider, assister » ; la tournure finale exprime clairement la fonction de l’armée.
- source_word: עַל הָאוֹיֵב
  choice: contre l’ennemi
  rationale: Dans ce contexte militaire, עַל marque l’opposition à l’ennemi.
