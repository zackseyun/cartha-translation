base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: fr
  text: Les Ammonites apportèrent un tribut à Ozias. Sa renommée[a] se répandit jusqu’à l’entrée de l’Égypte[b], car il était devenu extrêmement puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son nom ». En hébreu, le « nom » peut désigner la réputation ou la renommée d’une personne.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut désigner l’accès à l’Égypte ou sa région frontalière.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: Les Ammonites
  rationale: Désignation ethnique courante et immédiatement compréhensible en français.
- source_word: מִנְחָה
  choice: un tribut
  rationale: Dans ce contexte politique, le terme désigne vraisemblablement un paiement marquant la soumission à un roi plutôt qu’un simple don ou une offrande cultuelle.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: Sa renommée se répandit
  rationale: L’expression hébraïque dit littéralement que son « nom » alla au loin; « renommée » en rend naturellement le sens de réputation largement diffusée.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: jusqu’aux abords de l’Égypte
  rationale: Cette formulation française conserve l’idée d’approche ou de zone d’entrée sans identifier trop précisément un lieu frontalier incertain.
- source_word: הֶחֱזִיק
  choice: il était devenu puissant
  rationale: La forme verbale exprime ici l’acquisition ou la manifestation d’une grande force, dans une proposition donnant la cause de sa renommée.
- source_word: עַד לְמַעְלָה
  choice: extrêmement
  rationale: L’expression fonctionne comme un intensif indiquant un très haut degré.
