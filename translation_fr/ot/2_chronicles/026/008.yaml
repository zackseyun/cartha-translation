  source_fidelity: 'Le sens général est fidèle : les Ammonites remettent une minḥah à Ozias, sa renommée s’étend, et sa grande puissance en est la cause. « Aux abords de l’Égypte » interprète toutefois davantage que l’hébreu לְבוֹא מִצְרַיִם, qui conserve l’image d’une « entrée » ou d’un accès à l’Égypte. Il est préférable de garder cette formulation dans le texte et d’expliquer l’incertitude en note.'
  naturalness: « Versèrent un tribut » n’est pas une collocation française naturelle pour un paiement politique. « Apportèrent un tribut » est idiomatique, clair et conserve la nuance de tribut sans suggérer un simple don.
  terminology: « Les Ammonites », « Ozias », « tribut », « renommée » et « extrêmement puissant » conviennent au registre biblique moderne et au contexte. La forme traditionnelle française « Ozias » est recevable pour Uzziah.
