    rationale: Le verbe « verser » s’emploie plus naturellement avec une somme, une indemnité ou un impôt. Avec « tribut », il produit une formulation peu idiomatique et inutilement marquée.
  - severity: low
    issue: « jusqu’aux abords de l’Égypte »
    rationale: Cette expression aplanit l’image lexicale de « l’entrée/l’accès de l’Égypte » et oriente déjà vers une région périphérique. Le référent géographique demeurant incertain, le texte devrait conserver l’expression plus proche de l’hébreu, avec une note explicative.
