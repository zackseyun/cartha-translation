base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: fr
  text: 'Une lettre du prophète Élie lui parvint alors. Elle disait : « Voici ce que dit Yahweh, le Dieu de David, ton père : Puisque tu n’as pas marché dans les voies de Josaphat, ton père, ni[a] dans celles d’Asa, roi de Juda,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « et dans les voies d’Asa ». Après une négation, le français emploie naturellement « ni » pour exprimer qu’aucun des deux exemples n’a été suivi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: Une lettre … lui parvint alors
  rationale: Le verbe a pour sujet מִכְתָּב (« lettre »). « Parvint » rend naturellement le mouvement vers le destinataire, tandis que « alors » reflète le waw narratif.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: du prophète Élie
  rationale: La provenance de la lettre est exprimée clairement; le titre apposé est conservé dans un ordre naturel en français.
- source_word: לֵאמֹר
  choice: Elle disait
  rationale: Cette formulation rattache sans ambiguïté l’introduction de la citation à la lettre et rend naturellement la formule hébraïque.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formule française actuelle et solennelle qui restitue la formule prophétique du messager et conserve le nom divin.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: le Dieu de David, ton père
  rationale: L’ordre hébreu est conservé sans obscurcir le sens; « père » peut désigner ici un ancêtre dynastique.
- source_word: תַּחַת אֲשֶׁר
  choice: Puisque
  rationale: Dans ce contexte, l’expression introduit le motif du jugement annoncé; « puisque » en restitue clairement la valeur causale.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: tu n’as pas marché dans les voies
  rationale: La métaphore hébraïque de la marche comme conduite morale est conservée dans une expression biblique intelligible en français moderne.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: Josaphat, ton père
  rationale: Le nom est donné sous sa forme française conventionnelle et la relation paternelle explicite du texte est maintenue.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: ni dans celles d’Asa, roi de Juda
  rationale: Après une négation, « ni » coordonne naturellement en français les deux modèles de conduite rejetés. « Celles » évite une répétition lourde tout en renvoyant clairement aux voies.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre.
- issue: Sens de אָבִיךָ appliqué à David
  choice: ton père
  alternative: ton ancêtre
  rationale: « Père » préserve le vocabulaire dynastique du texte et son possible champ sémantique ancestral, sans expliciter davantage que l’hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore traditionnelle « marcher dans les voies » est maintenue parce qu’elle demeure compréhensible et porte la dimension morale du texte. La phrase reste ouverte par une virgule, puisque la citation et la sentence se poursuivent au verset suivant.
