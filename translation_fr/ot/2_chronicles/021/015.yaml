  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: fr
  text: Et toi, tu souffriras de nombreuses maladies, avec une maladie de tes entrailles[a], jusqu’à ce que tes entrailles sortent à cause de la maladie, jour après jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des intestins » ; le mot hébreu désigne les organes internes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des jours sur des jours » ; cette expression indique ici une évolution qui se prolonge au fil des jours.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאַתָּה
  choice: Et toi
  rationale: Le pronom indépendant marque une transition emphatique vers Yoram personnellement. « Et toi » rend naturellement cette insistance en français.
- source_word: בָּחֳלָיִים רַבִּים
  choice: tu souffriras de nombreuses maladies
  rationale: La préposition ב introduit ici l’état pénible que subira Yoram. Cette formulation française naturelle conserve le pluriel et l’ampleur des maux annoncés.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: notamment d’une maladie des entrailles
  rationale: La seconde expression précise l’affliction annoncée de manière générale. « Notamment » explicite sobrement ce rapport sans donner à ב une valeur séparative. « Entrailles » garde l’étendue sémantique du terme hébreu désignant les organes internes.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: jusqu’à ce que tes entrailles sortent
  rationale: La traduction conserve sans l’atténuer l’issue terrible exprimée directement par le verbe יצא, « sortir ».
- source_word: מִן הַחֹלִי
  choice: sous l’effet de la maladie
  rationale: 'La préposition מן a ici une valeur causale : la sortie des entrailles résulte de la maladie. Cette expression rend clairement ce lien en français.'
- source_word: יָמִים עַל יָמִים
  choice: jour après jour
  rationale: L’expression littérale « des jours sur des jours » décrit une progression prolongée au fil des jours. « Jour après jour » en restitue naturellement la valeur durative.
