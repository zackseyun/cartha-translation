id: 2CH.21.10
reference: 2 Chronicles 21:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: fr
  text: Édom se révolta contre l’autorité de Juda, et il en est ainsi jusqu’à ce jour. À ce moment-là, Libna se révolta elle aussi contre l’autorité de Joram[b], parce qu’il avait abandonné Yahvé, le Dieu de ses ancêtres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’hébreu dit littéralement « de dessous la main de Juda » et « de dessous sa main », expressions qui évoquent le fait d’échapper à une domination ou à un pouvoir.
    reason: cultural_note
  - marker: c
    text: Cette explication peut se rapporter plus particulièrement à la révolte de Libna ou, plus largement, aux revers que Joram subit.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: se révolta
  rationale: Dans ce contexte politique, le verbe désigne une rébellion contre une autorité établie. « Se révolta » convient aux deux sujets et conserve la force du terme hébreu.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: contre la domination de / contre son autorité
  rationale: L’expression signifie littéralement « de dessous la main de » et désigne la sortie d’un état de sujétion. Le français proposé restitue clairement l’idée de domination sans conserver une image peu naturelle ici.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom du royaume.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Cette formule temporelle indique que l’affranchissement d’Édom durait encore au moment envisagé par le narrateur.
- source_word: אָז
  choice: À cette époque
  rationale: Cette expression marque naturellement en français la concomitance avec la révolte d’Édom.
- source_word: לִבְנָה
  choice: Libna
  rationale: Forme française usuelle du nom de lieu.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici une explication causale; « parce que » l’exprime clairement en français contemporain.
- source_word: עָזַב
  choice: avait abandonné
  rationale: Le plus-que-parfait situe l’abandon antérieurement aux troubles rapportés. « Abandonner » garde la gravité relationnelle et religieuse du verbe tout en restant courant.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve le nom propre plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: le Dieu de ses ancêtres
  rationale: « Ancêtres » rend le pluriel אבות dans un français naturel et inclusif quant aux générations précédentes, sans modifier la référence au Dieu ancestral d’Israël.
theological_decisions:
- issue: Portée de l’explication causale finale
  choice: Laisser la proposition « parce qu’il avait abandonné Yahvé » dans sa position d’origine, sans préciser davantage sa portée.
  alternative: La rattacher explicitement à la seule révolte de Libna, ou aux troubles politiques dans leur ensemble.
  rationale: La proximité syntaxique favorise un lien avec la révolte de Libna, tandis que la théologie narrative du Chroniste permet de comprendre plus largement les revers de Joram comme conséquence de son infidélité. La traduction ne tranche pas cette tension.
- issue: Référent du sujet de « avait abandonné »
  choice: Conserver le pronom « il ».
  alternative: Expliciter « Joram avait abandonné ».
  rationale: Le contexte identifie Joram, mais l’hébreu emploie un suffixe pronominal. Le maintien du pronom évite d’ajouter un nom absent du verset tout en restant intelligible dans son contexte littéraire.
translation_notes:
  register: 'Français international contemporain, digne et accessible. La formulation privilégie une équivalence optimale : elle conserve la révolte politique et la causalité théologique, tout en rendant idiomatiquement l’image hébraïque de la « main » comme pouvoir. Le nom divin est rendu par « Yahvé ».'
