revisions:
- from: Édom se révolta[a] contre la domination de Juda et s’en affranchit jusqu’à ce jour. À cette époque, Libna se révolta aussi contre son autorité[b], parce qu’il avait abandonné Yahvé, le Dieu de ses ancêtres[c].
  to: Édom se révolta contre l’autorité de Juda, et il en est ainsi jusqu’à ce jour. À ce moment-là, Libna se révolta elle aussi contre l’autorité de Joram[b], parce qu’il avait abandonné Yahvé, le Dieu de ses ancêtres[c].
  rationale: La révision supprime le dédoublement non nécessaire de la première action, conserve l’idée de sujétion exprimée par l’idiome hébreu, et clarifie le référent contextuel de « sa main » dans la seconde proposition. La portée exacte de la proposition causale demeure volontairement non tranchée dans la note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'La première formulation dédouble inutilement le verbe hébreu : « se révolta » et « s’en affranchit » présentent comme deux actions ce que l’hébreu exprime en une seule révolte décrite par rapport à la sujétion de Juda. La révision rend la durée de la situation par la formule narrative « il en est ainsi jusqu’à ce jour ». Le second « sa main » renvoie à Joram dans le contexte; l’expliciter évite que « son autorité » soit compris comme renvoyant à Juda.'
  naturalness: La révision est naturelle en français international contemporain, sans perdre le registre narratif sobre du texte. « À ce moment-là » et « elle aussi » rendent clairement la succession et l’addition marquées par אָז et גַּם implicite dans la coordination.
  terminology: « Se révolta », « Juda », « Libna », « Joram » et « Yahvé » sont appropriés. « Le Dieu de ses ancêtres » rend naturellement אֱלֹהֵי אֲבֹתָיו sans imposer une lecture théologique supplémentaire.
  issues:
  - severity: medium
    issue: Dédoublement de l’action dans la première proposition
    rationale: « Édom se révolta ... et s’en affranchit » transforme la révolte unique, qualifiée par l’idiome « de dessous la main de Juda », en deux actions coordonnées. Cela alourdit et risque de modifier légèrement la structure du texte source.
  - severity: low
    issue: Antécédent potentiellement ambigu de « son autorité »
    rationale: Après « Juda », le possessif français peut être compris comme renvoyant à Juda, tandis que le suffixe hébreu final renvoie à Joram d’après le contexte. Nommer Joram clarifie sans modifier le sens.
  revised_text: Édom se révolta contre l’autorité de Juda, et il en est ainsi jusqu’à ce jour. À ce moment-là, Libna se révolta elle aussi contre l’autorité de Joram[b], parce qu’il avait abandonné Yahvé, le Dieu de ses ancêtres[c].
  revised_footnotes:
