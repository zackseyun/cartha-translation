source:
  edition: WLC
  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: fr
  text: Pourtant, Yahweh ne voulut pas détruire la maison de David, à cause de l’alliance qu’il avait conclue avec David, et comme il avait dit qu’il donnerait à David et à ses fils une lampe[a] pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lumière ». Dans ce contexte, cette image désigne vraisemblablement la continuité de la lignée ou du règne de David.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tous les jours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Pourtant, ... ne voulut pas
  rationale: Le verbe אָבָה exprime ici la volonté ou le consentement. « Ne voulut pas » est naturel en français et « Pourtant » rend la valeur adversative du contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu.
- source_word: לְהַשְׁחִית
  choice: détruire
  rationale: Dans ce contexte dynastique, le hiphil de שׁחת désigne l’anéantissement de la maison de David.
- source_word: בֵּית דָּוִיד
  choice: la maison de David
  rationale: Cette formulation conserve l’expression dynastique et sa résonance biblique, sans l’expliciter par « dynastie ».
- source_word: לְמַעַן הַבְּרִית
  choice: à cause de l’alliance
  rationale: לְמַעַן indique ici le motif ou la raison de l’action divine.
- source_word: כָּרַת ... לְדָוִיד
  choice: avait conclue avec David
  rationale: « Conclure une alliance avec » est l’équivalent idiomatique français de l’expression hébraïque « couper une alliance ».
- source_word: וְכַאֲשֶׁר אָמַר
  choice: et conformément à ce qu’il avait dit
  rationale: Cette formulation rend le rapport entre l’action de Yahweh et sa parole antérieure, sans remplacer « dit » par l’interprétation « promis ».
- source_word: לָתֵת לוֹ נִיר וּלְבָנָיו
  choice: il lui donnerait, ainsi qu’à ses fils, une lampe
  rationale: La tournure française relie clairement David et ses fils comme bénéficiaires, tout en conservant la métaphore de la lampe.
- source_word: כָּל הַיָּמִים
  choice: pour toujours
  rationale: L’expression hébraïque signifie littéralement « tous les jours » et, dans ce contexte d’alliance dynastique, a naturellement une valeur de permanence. Une note conserve la forme littérale.
theological_decisions:
- issue: Métaphore dynastique de נִיר dans le cadre de l’alliance davidique
  choice: lampe
  alternative: lumière ; lignée ; dynastie
  rationale: « Lampe » préserve l’image biblique de la continuité de la lignée et du règne de David sans résoudre explicitement la métaphore dans le corps du texte.
- issue: Portée temporelle de כָּל הַיָּמִים
  choice: pour toujours
  alternative: tous les jours ; à jamais
  rationale: « Pour toujours » exprime naturellement en français la permanence impliquée ici, tandis que la note signale la formulation hébraïque littérale afin de ne pas masquer sa texture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque lourd tout en conservant « maison de David », le nom Yahweh et la métaphore de la lampe. Les deux marqueurs de note figurent dans le texte principal.
