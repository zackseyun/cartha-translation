  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: fr
  text: Yoram passa avec ses commandants et tous les chars qui étaient avec lui. Au cours de la nuit, il se leva et frappa Édom, qui l’encerclait, ainsi que les commandants des chars[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les officiers de la force de chars ». L’expression hébraïque peut désigner les responsables du corps de chars.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passa
  rationale: Le verbe עבר exprime ici un déplacement ou un passage. « Passa » reste proche de l’hébreu sans préciser une destination ou une manœuvre que le texte ne nomme pas.
- source_word: שָׂרָיו
  choice: ses commandants
  rationale: שַׂר peut désigner un chef, un haut responsable ou un officier. Le contexte militaire favorise « commandants ».
- source_word: וְכָל־הָרֶכֶב עִמּוֹ
  choice: et tous les chars qui étaient avec lui
  rationale: רֶכֶב désigne collectivement les chars ou la force de chars. La formulation française conserve aussi la précision עִמּוֹ, « avec lui ».
- source_word: וַיְהִי קָם לַיְלָה
  choice: Au cours de la nuit, il se leva
  rationale: Cette formulation rend l’action nocturne et la progression narrative sans reproduire lourdement la tournure hébraïque וַיְהִי suivie d’un participe.
- source_word: וַיַּךְ
  choice: frappa
  rationale: נכה signifie largement « frapper ». Ce choix ne transforme pas implicitement l’action en victoire complète.
- source_word: אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: Édom, qui l’encerclait
  rationale: Le nom du peuple est conservé sous sa forme collective, et le participe de סבב décrit Édom disposé autour de Yoram.
- source_word: שָׂרֵי הָרֶכֶב
  choice: les commandants des chars
  rationale: La traduction suit directement la construction hébraïque et laisse ouverte l’identité précise de ces commandants.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La traduction conserve « Édom » comme collectif, évite d’ajouter l’appartenance des commandants des chars et ne présente pas l’attaque comme une victoire totale.
