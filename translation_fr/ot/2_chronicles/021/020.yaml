source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: fr
  text: Il avait trente-deux ans lorsqu’il devint roi et il régna huit ans à Jérusalem. Il s’en alla sans être regretté[a]. On l’enterra dans la cité de David, mais pas dans les tombeaux des rois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans désir » ; on peut aussi comprendre : « sans être désiré » ou « sans susciter de regret ».'
    reason: 'L’expression hébraïque בְּלֹא חֶמְדָּה est concise et ambiguë : חֶמְדָּה peut désigner le désir, l’attachement ou l’estime accordée à ce qui est précieux.'
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: Il avait trente-deux ans
  rationale: Cette tournure rend naturellement en français l’expression hébraïque idiomatique de l’âge, littéralement « fils de trente-deux ans ».
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: Dans la formule d’âge royal, cette construction indique le moment de l’accession au trône. « Devint roi » est naturel et précis en français moderne.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: il régna huit ans
  rationale: מָלַךְ signifie « régner, être roi » ; « régna » convient à la formule royale et au registre narratif.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » est la formulation locative normale avec un nom de ville.
- source_word: וַיֵּלֶךְ
  choice: Il s’en alla
  rationale: Le verbe signifie littéralement « aller, s’en aller » et fonctionne ici comme une évocation euphémistique de la mort. La traduction conserve cet euphémisme sans expliciter « il mourut ».
- source_word: בְּלֹא חֶמְדָּה
  choice: sans être regretté
  rationale: חֶמְדָּה peut évoquer le désir, l’attachement ou ce qui est précieux. Dans cette notice funèbre, l’expression indique vraisemblablement que sa disparition ne suscita ni attachement ni sentiment de perte, tout en nécessitant une note pour conserver l’ambiguïté lexicale.
- source_word: וַיִּקְבְּרֻהוּ
  choice: On l’enterra
  rationale: Le sujet pluriel indéfini de l’hébreu se rend naturellement en français par « on », avec le pronom objet « l’ ».
- source_word: בְּעִיר דָּוִיד
  choice: dans la cité de David
  rationale: « Cité de David » est une désignation géographique consacrée et convient au contexte historique de Jérusalem.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: mais pas dans les tombeaux des rois
  rationale: Le contraste marqué par וְלֹא est rendu naturellement par « mais pas ». « Tombeaux » convient mieux que « tombes » au contexte des sépultures royales.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’euphémisme hébreu « il s’en alla » et place la note sur l’expression ambiguë, sans transformer explicitement le verbe en « mourir » ni effacer le manque d’affection exprimé par le contexte.
