  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם אֲ֠בִי/הֶם מַתָּנ֨וֹת רַבּ֜וֹת לְ/כֶ֤סֶף וּ/לְ/זָהָב֙ וּ/לְ/מִגְדָּנ֔וֹת עִם עָרֵ֥י מְצֻר֖וֹת בִּֽ/יהוּדָ֑ה וְ/אֶת הַ/מַּמְלָכָ֛ה נָתַ֥ן לִֽ/יהוֹרָ֖ם כִּי ה֥וּא הַ/בְּכֽוֹר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: fr
  text: 'Leur père leur donna de nombreux présents : de l’argent, de l’or et des objets précieux[a], ainsi que des villes fortifiées en Juda. Mais il donna le royaume à Joram, parce qu’il était le premier-né.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des biens de choix » ou « des présents de grande valeur ». Le terme hébreu peut désigner de manière générale des choses précieuses ou choisies.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le wayyiqtol de נתן poursuit le récit au passé ; le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: de nombreux présents
  rationale: Cette formulation exprime naturellement l’abondance indiquée par רַבּוֹת et garde un registre digne.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: de l’argent, de l’or
  rationale: Les prépositions introduisent ici les catégories de biens donnés ; l’énumération française après les deux-points les rend sans imposer qu’il s’agisse uniquement d’objets fabriqués dans ces matières.
- source_word: וּלְמִגְדָּנוֹת
  choice: et des objets précieux
  rationale: מִגְדָּנוֹת désigne largement des biens précieux ou de choix. « Objets précieux » convient au contexte de présents royaux sans réduire le sens à des mets délicats.
- source_word: עִם עָרֵי מְצֻרוֹת
  choice: ainsi que des villes fortifiées
  rationale: עִם ajoute les villes aux biens déjà énumérés ; « ainsi que » exprime clairement cette addition en français.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La locution rend simplement la localisation des villes fortifiées.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: Mais il donna le royaume à Joram
  rationale: Bien que וְ soit formellement une coordination, « mais » rend le contraste discursif entre les présents accordés aux autres fils et le royaume réservé à Joram.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: parce qu’il était le premier-né
  rationale: כִּי introduit le motif de l’attribution du royaume ; « premier-né » conserve le statut familial exprimé par הַבְּכוֹר.
