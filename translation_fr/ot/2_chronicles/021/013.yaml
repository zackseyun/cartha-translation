source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: fr
  text: mais tu as suivi la voie des rois d’Israël, tu as poussé Juda et les habitants de Jérusalem à se prostituer[a], comme la maison d’Achab[b] les a poussés à se prostituer ; et tu as aussi tué tes frères de la maison de ton père, qui valaient mieux que toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « faire se prostituer ». Dans le langage prophétique, cette image désigne l’infidélité envers Dieu, souvent manifestée par l’idolâtrie.
    reason: lexical_alternative
  - marker: b
    text: La « maison d’Achab » désigne la dynastie régnante issue d’Achab.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: tu as suivi la voie
  rationale: Cette formulation conserve l’image hébraïque de la « voie » comme conduite adoptée, tout en étant plus naturelle en français moderne que « tu as marché dans la voie ».
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: les rois d’Israël
  rationale: Le génitif est rendu directement afin de préserver le contraste historique entre les royaumes d’Israël et de Juda.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: tu as poussé Juda et les habitants de Jérusalem à se prostituer
  rationale: La forme causative et la métaphore forte de זנה sont conservées. Dans ce contexte, la prostitution évoque l’infidélité religieuse et l’idolâtrie, sans que la traduction réduise explicitement le terme à une seule interprétation.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: comme la maison d’Achab les a poussés à se prostituer
  rationale: La répétition du verbe français reproduit le parallélisme et la valeur causative du texte hébreu.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: « Maison » conserve l’expression dynastique biblique, expliquée en note pour les lecteurs modernes.
- source_word: וְגַם
  choice: et tu as aussi
  rationale: 'L’élément additif est exprimé clairement : au grief d’infidélité religieuse s’ajoute celui du meurtre.'
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: tes frères de la maison de ton père
  rationale: Cette formulation rattache les frères à la famille royale paternelle sans ajouter une identification absente du texte.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: qui valaient mieux que toi
  rationale: Cette comparaison exprime naturellement en français le jugement de valeur porté par טוֹבִים מִמְּךָ, sans préciser indûment sa portée morale ou politique.
- source_word: הָרָגְתָּ
  choice: tu as tué
  rationale: « Tuer » est l’équivalent direct et évite de renforcer le texte par le terme juridiquement plus chargé « assassiner ».
theological_decisions:
- issue: Portée métaphorique de זנה dans un contexte d’apostasie royale
  choice: Conserver l’image de la prostitution dans le texte et expliquer en note qu’elle désigne ici l’infidélité envers Dieu, notamment par l’idolâtrie.
  alternative: Traduire directement par « entraîner dans l’idolâtrie » ou « rendre infidèles ».
  rationale: Le choix retenu maintient la vigueur et l’étendue de la métaphore prophétique sans la réduire silencieusement à une seule manifestation de l’infidélité à l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme accusatoire est conservé par l’enchaînement des propositions. La métaphore biblique de la prostitution demeure dans le corps du texte, tandis que sa portée religieuse est explicitée sans être réduite dans la note.
