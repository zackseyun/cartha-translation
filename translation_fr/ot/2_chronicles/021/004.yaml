id: 2CH.21.4
reference: 2 Chronicles 21:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: fr
  text: Lorsque Joram eut pris le pouvoir sur le royaume de son père et affermi sa position, il tua par l’épée tous ses frères, ainsi que certains des chefs[a] d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hauts responsables » ou « princes ».
    reason: Le mot hébreu peut désigner des dirigeants, des administrateurs de haut rang ou des princes.
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכֶת אָבִיו
  choice: Lorsque Joram eut pris le pouvoir sur le royaume de son père
  rationale: Dans ce contexte royal, קום avec עַל exprime l’accession à l’autorité. « Prendre le pouvoir sur » rend naturellement cette idée en français sans réduire עַל à une simple destination.
- source_word: וַיִּתְחַזַּק
  choice: et affermi sa position
  rationale: Le hitpael de חזק indique que Joram se rendit fort ou consolida son autorité. « Affermir sa position » en exprime le sens contextuel sans préciser indûment les moyens politiques ou militaires employés.
- source_word: וַיַּהֲרֹג
  choice: il tua
  rationale: « Tuer » est l’équivalent moderne, direct et non archaïque du verbe hébreu.
- source_word: אֶת כָּל אֶחָיו
  choice: tous ses frères
  rationale: Le terme hébreu désigne ici explicitement les frères masculins de Joram; il ne convient donc pas de l’élargir à l’ensemble de sa parenté.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: Cette tournure conserve l’image et la valeur instrumentale de l’expression hébraïque traditionnelle.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: ainsi que certains des chefs d’Israël
  rationale: Le מִן préfixé est partitif et exige « certains des ». שָׂרִים peut désigner des chefs, des hauts responsables ou des princes; « chefs » est naturel et suffisamment large dans ce contexte.
theological_decisions:
- issue: Référent d’« Israël » dans l’expression « chefs d’Israël »
  choice: Conserver « Israël » sans en préciser davantage le référent
  alternative: chefs de Juda; dirigeants de la nation
  rationale: Le livre des Chroniques peut employer « Israël » dans un sens plus large que le seul royaume du Nord. La traduction maintient donc le terme du texte et laisse subsister sa nuance historique et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La subordination temporelle restitue naturellement la succession des actions hébraïques. « Affermi sa position » évite l’expression peu idiomatique « se fortifia » tout en conservant l’idée de consolidation personnelle du pouvoir.
