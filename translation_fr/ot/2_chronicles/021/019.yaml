  to: Au fil du temps, quand arriva le terme de deux ans, ses entrailles[a] sortirent sous l’effet de sa maladie. Il mourut, atteint de maladies terribles. Son peuple ne fit pas pour lui de feu, comme pour ses ancêtres[b].
  rationale: La révision conserve le texte et les notes, mais rétablit dans la dernière proposition la comparaison concise entre le feu qui fut refusé à Joram et celui associé à ses ancêtres. Elle supprime l’attribution interprétative « il l’avait fait », tout en préservant l’ambiguïté lexicale de שְׂרֵפָה, expliquée avec prudence dans la note.
