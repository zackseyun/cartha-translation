base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: fr
  text: Au fil du temps, quand arriva le terme de deux ans, ses entrailles[a] sortirent sous l’effet de sa maladie. Il mourut, atteint de maladies terribles. Son peuple ne fit pas pour lui de feu, comme pour ses ancêtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses intestins ». Le mot hébreu désigne ses organes internes.
    reason: lexical_alternative
  - marker: b
    text: Ce feu était probablement un honneur funéraire, par exemple une combustion d’aromates, et non la crémation de son corps. Comparer les usages funéraires royaux mentionnés ailleurs dans les Chroniques.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: Au fil du temps
  rationale: Cette expression idiomatique marque l’écoulement d’une période indéfinie. La formulation française reste naturelle sans reproduire littéralement l’obscur « de jours en jours ».
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: quand arriva le terme de deux ans
  rationale: Cette formulation conserve à la fois l’idée de l’arrivée du terme et la durée précise de deux ans.
- source_word: מֵעָיו
  choice: ses entrailles
  rationale: Le nom désigne les organes internes, particulièrement les intestins. « Entrailles » garde l’étendue et la force graphique du terme hébreu, tandis qu’une note signale l’équivalent plus anatomique.
- source_word: יָצְאוּ מֵעָיו
  choice: ses entrailles sortirent
  rationale: Le verbe est rendu dans son sens ordinaire de « sortir »; la violence physique de la scène n’est pas atténuée.
- source_word: עִם חָלְיוֹ
  choice: sous l’effet de sa maladie
  rationale: עִם signifie normalement « avec », mais exprime ici vraisemblablement une circonstance concomitante à valeur causale. La traduction française rend cette relation sans suggérer que les entrailles et la maladie seraient simplement sorties ensemble.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: atteint de maladies terribles
  rationale: La formulation conserve le pluriel hébreu et la gravité exprimée par רָעִים, tout en évitant le tour français peu naturel « mourir dans des maladies ».
- source_word: שְׂרֵפָה
  choice: du feu en son honneur
  rationale: Le nom désigne littéralement une combustion ou un feu. Dans ce contexte royal, il s’agit vraisemblablement d’un honneur funéraire; la formulation reste lisible et la note explique la pratique sans l’inscrire entièrement dans le texte.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: comme il l’avait fait pour ses ancêtres
  rationale: La comparaison porte sur l’honneur accordé aux rois précédents. « Ancêtres » est ici plus naturel que « pères » et n’implique pas que leurs corps aient été brûlés.
theological_decisions:
- issue: Nature de שְׂרֵפָה dans le contexte des funérailles royales
  choice: Un feu cérémoniel en l’honneur du défunt, probablement distinct de la crémation du corps
  alternative: La crémation du corps, ou un rite de combustion non précisé
  rationale: Le contexte du Chroniste oppose les honneurs rendus aux rois antérieurs à ceux refusés à Joram. Le texte principal garde le terme concret « feu », tandis que la note présente avec prudence l’explication funéraire probable sans transformer celle-ci en certitude.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe évite les calques hébraïques obscurs, tout en conservant la chronologie, le caractère graphique de la maladie et le pluriel de « maladies ». Les deux marqueurs de note figurent exactement aux expressions qu’ils éclairent.
