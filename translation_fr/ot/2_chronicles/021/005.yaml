  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: fr
  text: Joram avait trente-deux ans lorsqu’il devint roi, et il régna huit ans à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: avait trente-deux ans
  rationale: Dans cette formule d’âge, בֶּן suivi d’un nombre et de שָׁנָה est un idiome indiquant l’âge. « Avait trente-deux ans » en est l’équivalent français naturel et exact.
- source_word: יְהוֹרָם
  choice: Joram
  rationale: « Joram » est la forme française biblique courante du nom hébreu יְהוֹרָם dans ce contexte.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition בְּ devant l’infinitif construit muni du suffixe marque ici le moment de l’accession au trône. Cette formulation française exprime clairement cette valeur temporelle.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: huit ans
  rationale: Le groupe formé du nombre et du nom indique directement la durée du règne.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe signifie « régner » ou « être roi » ; avec une indication de durée, « il régna » convient naturellement à la formule royale.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition locative et le nom de lieu indiquent la ville depuis laquelle le roi exerça son règne ; en français, l’usage idiomatique est « à Jérusalem ».
