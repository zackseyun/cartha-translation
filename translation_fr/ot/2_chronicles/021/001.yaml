base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: fr
  text: Josaphat mourut[a] et fut enterré avec ses ancêtres dans la ville de David, et son fils Joram régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses ancêtres ». Cette expression hébraïque est une formule conventionnelle pour dire qu’il mourut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Conserve l’image de l’idiome funéraire royal hébreu, tout en l’accompagnant d’une note qui en explicite le sens.
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: « Ancêtres » exprime naturellement en français moderne la lignée dynastique désignée par אָבוֹת, sans suggérer uniquement le père immédiat.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Rend directement la forme passive du verbe קבר dans la suite narrative.
- source_word: בְּעִיר דָּוִיד
  choice: dans la cité de David
  rationale: Rend l’appellation géographique traditionnelle dans un registre biblique digne et courant.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Respecte la formule conventionnelle des notices royales et la valeur du verbe מלך.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Exprime directement la succession au trône sans ajouter une nuance de contraste.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Suit la forme française biblique traditionnelle et largement reconnue du nom.
- source_word: יְהוֹרָם
  choice: Joram
  rationale: Suit la forme française biblique courante correspondant ici à יְהוֹרָם.
