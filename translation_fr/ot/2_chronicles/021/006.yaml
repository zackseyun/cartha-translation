source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: fr
  text: Il suivit la voie des rois d’Israël, comme l’avait fait la maison d’Achab, car il avait pour femme la fille d’Achab. Il fit ce qui est mal aux yeux de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Il suivit la voie
  rationale: L’expression désigne la conduite. « Suivre la voie » conserve la métaphore hébraïque tout en étant naturelle en français moderne.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: La formulation désigne directement les souverains du royaume du Nord comme modèle de conduite.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: comme l’avait fait la maison d’Achab
  rationale: Le singulier français accorde le verbe avec « maison », tandis que l’hébreu emploie un pluriel collectif. Le plus-que-parfait exprime naturellement l’antériorité de cette conduite.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: Dans ce contexte royal, « maison » peut désigner la famille ou la dynastie et préserve la portée de l’expression hébraïque sans la préciser excessivement.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication du lien de Joram avec la maison d’Achab.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ אִשָּׁה
  choice: il avait pour femme une fille d’Achab
  rationale: Cette tournure idiomatique exprime une relation conjugale déjà établie. L’absence d’article devant בַּת permet naturellement « une fille ».
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Le substantif adjectival défini הָרַע est rendu par « ce qui est mal », formulation proche du sens et naturelle.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette traduction conserve la formule évaluative et l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Portée de בֵּית אַחְאָב
  choice: la maison d’Achab
  alternative: la dynastie d’Achab
  rationale: « Maison » maintient l’ambivalence possible entre famille royale, maisonnée et dynastie, sans imposer un sens plus étroit.
translation_notes:
  register: Français international moderne, digne et narratif. La métaphore morale de la « voie » et l’expression « aux yeux de » sont conservées, sans produire une syntaxe artificiellement calquée sur l’hébreu.
