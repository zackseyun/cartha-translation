source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: fr
  text: Yahvé éveilla contre Joram l’esprit des Philistins et des Arabes qui étaient près des Koushites[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « esprit » peut aussi désigner la disposition ou l’impulsion qui anime ces peuples.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aux côtés des Koushites ». L’expression hébraïque indique une proximité géographique ; la relative peut se rapporter aux Arabes ou à l’ensemble du groupe mentionné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: éveilla
  rationale: Le verbe signifie susciter ou réveiller une disposition conduisant ici à une action hostile. « Éveilla » conserve la causalité divine et s’accorde naturellement avec le complément explicité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve le nom propre plutôt que de lui substituer un titre.
- source_word: עַל יְהוֹרָם
  choice: contre Joram
  rationale: Dans ce contexte hostile, עַל exprime l’opposition.
- source_word: רוּחַ
  choice: l’ardeur hostile
  rationale: רוּחַ désigne ici l’impulsion ou la disposition qui anime ces peuples. Cette formulation française rend le sens contextuel sans suggérer qu’un être spirituel distinct serait en vue; une note conserve la métaphore littérale.
- source_word: הַפְּלִשְׁתִּים וְהָעַרְבִים
  choice: des Philistins et des Arabes
  rationale: Désignations ethniques usuelles en français moderne; le même complément dépend de « l’ardeur hostile ».
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: qui habitaient près des Koushites
  rationale: עַל יַד a naturellement ici un sens géographique de proximité. « Habitaient » rend explicite la relation locative requise en français, sans affirmer une subordination politique.
theological_decisions:
- issue: Causalité divine dans le soulèvement de peuples hostiles contre Joram
  choice: Yahvé éveille directement leur ardeur hostile
  alternative: Yahvé permet seulement qu’une hostilité préexistante se manifeste
  rationale: Le verbe hébreu attribue directement l’action à Yahvé. La traduction maintient cette tension théologique sans la réduire à une simple permission ni développer une explication absente du verset.
- issue: Sens de רוּחַ
  choice: Disposition ou impulsion hostile
  alternative: « esprit » au sens littéral, éventuellement compris comme une réalité spirituelle distincte
  rationale: Dans cette construction, le mot désigne le ressort intérieur qui pousse les peuples à agir. La note signale toutefois la formulation littérale afin de préserver l’image et l’ambiguïté lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. « Joram », « Philistins », « Arabes » et « Koushites » suivent les formes françaises bibliques usuelles. La phrase garde en tête la causalité divine et évite une tournure trop littérale qui serait obscure en français.
