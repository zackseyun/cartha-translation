  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: fr
  text: Ils montèrent en Juda et l’envahirent. Ils emportèrent tous les biens qui se trouvaient dans le palais royal et emmenèrent aussi les fils et les épouses du roi. Il ne lui resta aucun fils, sauf Joachaz[a], le plus jeune de ses fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joachaz est probablement le même personnage qu’Ochozias, nom sous lequel il est désigné ailleurs (voir 2 Rois 8.24-26 ; 2 Chroniques 22.1).
    reason: Identification alternative du nom dans les passages parallèles.
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Ils montèrent en Juda
  rationale: Le verbe עלה exprime une montée vers un territoire; avec ב et dans ce contexte militaire, « monter en Juda » conserve l’image géographique et laisse la suite préciser l’attaque.
- source_word: וַיִּבְקָעוּהָ
  choice: et l’envahirent
  rationale: בקע signifie littéralement fendre ou ouvrir une brèche. Appliqué à un pays attaqué, « envahirent » rend naturellement en français l’entrée forcée qu’implique le contexte, sans suggérer que le territoire lui-même aurait été matériellement fendu.
- source_word: וַיִּשְׁבּוּ
  choice: Ils emportèrent… et emmenèrent
  rationale: שבה couvre ici à la fois la saisie des biens et la capture de personnes. La variation verbale française rend naturellement ces deux objets tout en conservant l’idée commune de prise et de déportation.
- source_word: כָּל הָרְכוּשׁ
  choice: tous les biens
  rationale: רכוש désigne les possessions ou richesses matérielles; « biens » est large, naturel et adapté au contexte royal.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: qui se trouvaient dans le palais royal
  rationale: נמצא signifie « se trouver, être présent ». בית המלך désigne ici la résidence du roi; « palais royal » communique clairement ce sens institutionnel en français moderne.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: et emmenèrent aussi les fils et les femmes du roi
  rationale: גם garde sa valeur additive avec « aussi ». La répétition explicite « du roi » évite en français une ambiguïté de référent sans modifier le sens.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: Il ne lui resta aucun fils
  rationale: Le niphal de שׁאר exprime ce qui demeure. Cette formulation française est directe et conserve la construction avec le bénéficiaire « lui ».
- source_word: כִּי אִם
  choice: sauf
  rationale: כִּי אִם introduit ici l’unique exception; « sauf » en rend exactement la fonction.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Le texte massorétique porte יְהוֹאָחָז. « Joachaz » est la forme française biblique usuelle correspondant à ce nom; l’identification possible avec Ochozias est signalée en note.
- source_word: קְטֹן בָּנָיו
  choice: le plus jeune de ses fils
  rationale: Dans ce contexte familial, קטן indique le plus jeune, non le plus petit par la taille.
theological_decisions:
- issue: Nom du fils survivant de Joram
  choice: Conserver « Joachaz », conformément au texte massorétique
  alternative: Employer « Ochozias » d’après les passages parallèles
  rationale: Il s’agit d’une question d’identification textuelle et narrative. La priorité donnée au texte hébreu exige « Joachaz » dans le corps du verset, tandis qu’une note informe le lecteur de l’autre forme connue sans harmoniser silencieusement les passages.
translation_notes:
  register: Français international moderne, digne et accessible. Deux phrases allègent une longue coordination hébraïque. « Palais royal » explicite le sens contextuel de « maison du roi », et la distinction « emportèrent/emmenèrent » respecte l’usage français pour les biens et les personnes.
