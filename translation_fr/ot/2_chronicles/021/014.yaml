id: 2CH.21.14
reference: 2 Chronicles 21:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: fr
  text: 'Voici[a] : Yahweh va frapper ton peuple, tes fils, tes épouses et tous tes biens d’un terrible fléau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Voici : Yahweh frappe — ou frappera — ton peuple […] d’une grande plaie », ou « d’un coup terrible ». Le participe hébreu peut présenter l’action comme en cours, imminente ou future, et le nom employé peut désigner une peste, un fléau ou un coup sévère.'
    reason: Préserver l’ambiguïté temporelle du participe נֹגֵף et l’étendue de sens de מַגֵּפָה.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit solennellement l’annonce prophétique et attire l’attention, dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin exprimé par le tétragramme.
- source_word: נֹגֵף
  choice: va frapper
  rationale: Avec הִנֵּה, le participe présente ici le jugement comme imminent. Le futur proche en restitue naturellement l’urgence, sans exclure la valeur de présent ou de futur simple signalée en note.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: d’un terrible fléau
  rationale: מַגֵּפָה peut désigner une peste, un fléau ou un coup infligé, tandis que גְדוֹלָה en souligne la gravité. Cette formulation française convient au contexte de jugement tout en laissant la note exposer les autres nuances.
- source_word: בְּעַמְּךָ
  choice: ton peuple
  rationale: La préposition introduit ici l’objet atteint par le coup; la formulation directe est naturelle en français.
- source_word: וּבְבָנֶיךָ
  choice: tes fils
  rationale: Le nom hébreu est masculin pluriel et désigne explicitement les fils dans cette énumération familiale.
- source_word: וּבְנָשֶׁיךָ
  choice: tes épouses
  rationale: Dans ce contexte possessif, נָשִׁים désigne les épouses; « épouses » évite l’ambiguïté possible de « femmes » en français.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: et tous tes biens
  rationale: רְכוּשׁ désigne l’ensemble des possessions ou des richesses; « biens » est concis, large et naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le nom propre sans lui substituer un titre.
- issue: Valeur temporelle du participe נֹגֵף dans l’annonce prophétique
  choice: imminence (« va frapper »)
  alternative: présent (« frappe ») ou futur simple (« frappera »)
  rationale: La construction הִנֵּה suivie du participe peut présenter l’action comme actuelle ou imminente. Le futur proche exprime bien l’imminence contextuelle, tandis que la note maintient l’ambiguïté grammaticale.
- issue: Portée de מַגֵּפָה
  choice: fléau
  alternative: peste, coup ou calamité
  rationale: Le terme peut évoquer aussi bien une épidémie qu’un coup sévère infligé par Dieu. « Fléau » garde une certaine amplitude sémantique, complétée par la note.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Voici » conserve la force de l’annonce prophétique; « va frapper » rend son urgence; « épouses » et « biens » assurent précision et naturel.
