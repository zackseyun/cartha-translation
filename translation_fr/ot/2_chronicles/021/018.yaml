source:
  edition: WLC
  text: וְ/אַחֲרֵ֖י כָּל זֹ֑את נְגָפ֨/וֹ יְהוָ֧ה בְּ/מֵעָ֛י/ו לָ/חֳלִ֖י לְ/אֵ֥ין מַרְפֵּֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: fr
  text: Après tout cela, Yahweh le frappa d’une maladie intestinale incurable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans guérison »; autre traduction : « sans remède ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  choice: Après tout cela
  rationale: Cette formulation naturelle en français marque la succession temporelle et récapitule les événements précédents. La coordination hébraïque est convenablement rendue par l’enchaînement narratif français sans « Et » initial.
- source_word: נְגָפוֹ
  choice: le frappa
  rationale: Le verbe exprime ici une atteinte directe infligée par Dieu. « Le frappa » en conserve la force sans préciser indûment le mécanisme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּמֵעָיו לָחֳלִי
  choice: d’une maladie intestinale
  rationale: מֵעִים désigne ici les intestins ou les organes internes. En français courant, « maladie intestinale » exprime clairement le siège de l’affection et évite le tour lourd « dans ses intestins ».
- source_word: לְאֵין מַרְפֵּא
  choice: incurable
  rationale: Cette formulation concise rend naturellement l’idée littérale d’une maladie pour laquelle il n’existe ni guérison ni remède.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom personnel sans lui substituer un titre.
- issue: Caractère direct de l’action divine
  choice: Yahweh le frappa
  alternative: Yahweh l’affligea
  rationale: Le choix conserve la vigueur du verbe et l’attribution explicite de l’affection à Yahweh, sans atténuer la tension théologique du passage.
translation_notes:
  register: Français international moderne, digne et direct. « Maladie intestinale » est plus naturel que « maladie dans ses intestins », tandis que la note préserve la formulation hébraïque de לְאֵין מַרְפֵּא.
