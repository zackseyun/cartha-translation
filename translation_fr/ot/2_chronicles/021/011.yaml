  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: fr
  text: Il établit lui aussi des hauts lieux dans les montagnes de Juda. Il poussa les habitants de Jérusalem à se prostituer[a] et égara Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « faire se prostituer ». Dans ce contexte, cette image évoque l’infidélité religieuse, sans exclure des résonances sexuelles.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « détourna Juda »; le contexte implique qu’il le détourna de la fidélité à l’Éternel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: Cette tournure naturelle en français conserve à la fois la valeur additive de גַּם et l’emphase portée par le pronom indépendant.
- source_word: עָשָׂה
  choice: établit
  rationale: Avec des lieux de culte pour complément, « établir » exprime naturellement l’action de les aménager ou de les instituer, sans imposer l’idée plus précise de construction matérielle.
- source_word: בָמוֹת
  choice: hauts lieux
  rationale: « Hauts lieux » est le terme français traditionnel et précis pour ces sites cultuels, souvent associés dans ce contexte à un culte illégitime.
- source_word: בְּהָרֵי יְהוּדָה
  choice: dans les montagnes de Juda
  rationale: Le pluriel הָרִים désigne les montagnes ou la région montagneuse. « Dans les montagnes de Juda » reste proche de la forme hébraïque et demeure naturel en français.
- source_word: וַיֶּזֶן
  choice: poussa … à se prostituer
  rationale: La forme causative du verbe זנה signifie faire se prostituer ou entraîner dans la prostitution. Dans ce contexte cultuel, cette image peut désigner l’infidélité religieuse tout en gardant ses résonances sexuelles; la traduction conserve donc volontairement cette tension.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Traduction directe, précise et courante du participe substantivé.
- source_word: וַיַּדַּח
  choice: égara
  rationale: À la forme causative, נדח peut signifier pousser à s’écarter ou égarer. « Égara » rend ici de façon concise le fait que le roi détourna Juda de la fidélité attendue, sans expliciter un complément absent de l’hébreu.
- source_word: אֶת יְהוּדָה
  choice: Juda
  rationale: Le nom désigne collectivement le peuple ou le royaume de Juda; conserver simplement « Juda » respecte cette métonymie.
theological_decisions:
- issue: Portée de l’image de la prostitution
  choice: Conserver dans le texte l’expression « se prostituer »
  alternative: « se livrer à l’infidélité religieuse » ou « tomber dans l’immoralité sexuelle »
  rationale: Dans un contexte de hauts lieux, le verbe évoque fortement l’apostasie, décrite comme une prostitution, mais sa formulation garde aussi une portée sexuelle. Une paraphrase exclusivement religieuse ou sexuelle supprimerait une ambiguïté réelle du texte.
- issue: Complément implicite de l’égarement de Juda
  choice: « égara Juda » sans ajouter « loin de l’Éternel »
  alternative: « détourna Juda de l’Éternel »
  rationale: Le contexte implique une rupture de fidélité envers l’Éternel, mais le texte hébreu ne nomme pas ici ce dont Juda est détourné. La formulation retenue préserve cette concision.
translation_notes:
  register: Français international moderne, sobre et digne. « Hauts lieux » conserve le vocabulaire historique et cultuel établi; « se prostituer » maintient l’image forte de l’hébreu, tandis que les notes en explicitent l’ambivalence sans la résoudre dans le corps du texte.
