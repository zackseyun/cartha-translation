base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: fr
  text: 'Il avait des frères, fils de Josaphat : Azaria, Yehiel, Zacharie, Azariahou[a], Mikaël et Shephatia. Tous ceux-là étaient fils de Josaphat, roi d’Israël[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le quatrième nom, « Azariahou », présente en hébreu une forme différente de celle du premier « Azaria » ; la traduction maintient cette distinction.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « roi d’Israël ». Josaphat est habituellement désigné comme roi de Juda ; les Chroniques peuvent employer ici « Israël » dans un sens plus large, pour le peuple de l’alliance.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: Il avait pour frères
  rationale: La tournure hébraïque « et à lui [étaient] des frères » exprime la possession. « Il avait pour frères » est naturel en français et introduit clairement la liste des frères.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: les fils de Josaphat
  rationale: La formule généalogique est conservée, avec le nom français traditionnel « Josaphat ».
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Transcription française courante du nom, sans la terminaison hébraïque longue présente dans le quatrième nom.
- source_word: וִֽ/יחִיאֵל
  choice: Yehiel
  rationale: Transcription lisible qui représente le nom hébreu et évite une prononciation française trompeuse de la consonne initiale.
- source_word: וּ/זְכַרְיָהוּ
  choice: Zacharie
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable.
- source_word: וַ/עֲזַרְיָהוּ
  choice: Azariahou
  rationale: La terminaison « -hou » préserve la différence graphique avec le premier Azaria, distinction réelle dans le texte hébreu.
- source_word: וּ/מִיכָאֵל
  choice: Mikaël
  rationale: Cette transcription distingue le nom de la forme française moderne « Michel » tout en restant naturelle et proche de l’hébreu.
- source_word: וּ/שְׁפַטְיָהוּ
  choice: Shephatia
  rationale: Transcription française intelligible du nom propre, sans imposer une traduction de sa signification.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Formulation française naturelle qui conserve la reprise récapitulative de la liste.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Le texte massorétique porte explicitement « roi d’Israël » ; la traduction ne l’harmonise donc pas avec « roi de Juda ».
theological_decisions:
- issue: 'Le titre de Josaphat : מֶלֶךְ יִשְׂרָאֵל'
  choice: roi d’Israël
  alternative: roi de Juda
  rationale: Bien que Josaphat soit généralement présenté comme roi de Juda dans le cadre de la monarchie divisée, le texte hébreu dit ici « roi d’Israël ». Conserver cette formulation respecte la source et laisse ouverte la portée plus large que les Chroniques peuvent donner au nom « Israël ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste légèrement généalogique pour refléter le style du passage. Les noms suivent des formes françaises reconnaissables tout en maintenant, lorsque le texte l’exige, la distinction entre deux graphies hébraïques.
