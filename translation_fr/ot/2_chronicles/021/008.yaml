source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥יכוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: fr
  text: À son époque, Édom se révolta contre l’autorité de Juda[a] et se donna un roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se révolta de dessous la main de Juda ».'
    reason: La note conserve l’image concrète de l’expression hébraïque derrière la formulation idiomatique « contre l’autorité de Juda ».
lexical_decisions:
- source_word: בְּיָמָיו
  choice: À son époque
  rationale: Cette expression temporelle désigne la période du règne de Joram. « À son époque » est naturel en français moderne tout en restant proche de l’hébreu.
- source_word: פָּשַׁע
  choice: se révolta
  rationale: Dans ce contexte politique, le verbe désigne la rébellion d’un peuple qui rejette une domination, et non une transgression morale abstraite.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française traditionnelle du nom de ce peuple et de son territoire.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: contre l’autorité de Juda
  rationale: L’expression hébraïque signifie littéralement « de dessous la main de Juda » et décrit ici la domination politique exercée par Juda. La formulation choisie en communique naturellement le sens en français.
- source_word: וַיַּמְלִיכוּ עֲלֵיהֶם מֶלֶךְ
  choice: se donna un roi
  rationale: Le hiphil de מלך signifie ici faire régner ou établir quelqu’un comme roi. La tournure française « se donna un roi » exprime de façon concise qu’Édom établit un roi sur lui-même.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation évite un calque obscur tout en conservant l’image hébraïque en note.
