  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: fr
  text: Roboam plaça Abiya, fils de Maaka, au premier rang, comme chef parmi ses frères[a], car il voulait le faire roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses frères » ; la préposition hébraïque peut indiquer sa prééminence par rapport à eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: établit
  rationale: Le hifil de עמד signifie ici placer quelqu’un dans une fonction ou une position. « Établit » convient au contexte de désignation officielle tout en restant naturel en français.
- source_word: לָרֹאשׁ
  choice: à la première place
  rationale: רֹאשׁ signifie littéralement « tête » et marque ici la prééminence. Cette formulation française exprime clairement le rang supérieur sans effacer la distinction avec נָגִיד.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: Abiya, fils de Maaka
  rationale: Les noms sont translittérés d’après l’hébreu, et la construction filiale est rendue directement.
- source_word: לְנָגִיד
  choice: comme chef
  rationale: נָגִיד désigne une personne investie d’une autorité dirigeante. « Chef » exprime ici la fonction sans suggérer à tort que le mot signifie simplement « fils de roi ».
- source_word: בְּאֶחָיו
  choice: parmi ses frères
  rationale: La préposition ב peut situer Abiya au sein du groupe de ses frères tout en indiquant sa prééminence par rapport à eux. L’autre lecture possible, « sur ses frères », est signalée en note.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de cette désignation. « Car » relie naturellement l’acte de Roboam à son intention.
- source_word: לְהַמְלִיכוֹ
  choice: il avait l’intention de le faire roi
  rationale: L’infinitif avec ל exprime ici le but ou l’intention. Cette traduction explicite la valeur contextuelle sans présenter le couronnement comme déjà accompli.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les deux expressions hébraïques de rang, לָרֹאשׁ (« à la première place ») et לְנָגִיד (« comme chef »), sans les réduire à une seule.
