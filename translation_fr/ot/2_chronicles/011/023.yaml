  text: וַ/יָּבֶן֩ וַ/יִּפְרֹ֨ץ מִ/כָּל בָּנָ֜י/ו לְֽ/כָל אַרְצ֧וֹת יְהוּדָ֣ה וּ/בִנְיָמִ֗ן לְ/כֹל֙ עָרֵ֣י הַ/מְּצֻר֔וֹת וַ/יִּתֵּ֥ן לָ/הֶ֛ם הַ/מָּז֖וֹן לָ/רֹ֑ב וַ/יִּשְׁאַ֖ל הֲמ֥וֹן נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: fr
  text: Il agit avec discernement[a] et répartit certains de ses fils[b] dans toutes les régions de Juda et de Benjamin, dans toutes les villes fortifiées. Il leur fournit des vivres en abondance et chercha un grand nombre de femmes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il fit preuve d’intelligence » ou « Il se montra avisé ».
    reason: lexical_alternative
  - marker: b
    text: La tournure hébraïque indique vraisemblablement qu’il dispersa ou plaça certains de ses fils dans les villes fortifiées ; elle ne signifie pas que chacun de ses fils fut envoyé dans chaque lieu.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « il chercha une multitude de femmes », sans préciser pour qui. Dans le contexte, il peut s’agir de mariages organisés pour ses fils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Il agit avec discernement
  rationale: Le hifil de בין exprime ici la manifestation d’intelligence ou de discernement dans la conduite des affaires. Cette formulation convient au contexte administratif sans réduire le verbe au simple fait de comprendre.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: répartit certains de ses fils
  rationale: פרץ peut évoquer l’action de répandre ou de disperser. Avec מן et les indications géographiques qui suivent, il s’agit vraisemblablement d’une répartition territoriale délibérée de fils choisis parmi l’ensemble des fils de Roboam.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: dans toutes les régions de Juda et de Benjamin
  rationale: Le pluriel אַרְצוֹת désigne ici les territoires ou régions relevant de Juda et de Benjamin, et non des pays indépendants.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: dans toutes les villes fortifiées
  rationale: מְצֻרוֹת qualifie des villes défendues par des fortifications. « Dans » exprime naturellement en français le placement des fils à l’intérieur de ces villes.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: Il leur fournit des vivres en abondance
  rationale: מָזוֹן désigne la nourriture ou les provisions, tandis que לָרֹב marque l’abondance. « Fournit » rend bien l’idée d’un approvisionnement organisé.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: leur procura de nombreuses femmes
  rationale: שׁאל signifie normalement demander, rechercher ou solliciter. Dans ce contexte familial, la formule évoque vraisemblablement des femmes obtenues en mariage pour les fils; le pronom « leur » est tiré du contexte immédiat.
theological_decisions:
- issue: Nature exacte de l’action exprimée par וַיִּפְרֹץ
  choice: Une répartition administrative des fils
  alternative: Une dispersion non volontaire ou une action énergique contre eux
  rationale: Les destinations territoriales et les villes fortifiées favorisent l’idée d’un placement stratégique, tout en laissant la note signaler la difficulté de la tournure hébraïque.
- issue: Destinataires implicites des nombreuses femmes
  choice: Les femmes sont procurées aux fils
  alternative: Roboam recherche de nombreuses femmes sans bénéficiaire explicitement indiqué
  rationale: Le pronom pluriel de la proposition précédente fournit l’antécédent contextuel le plus naturel, mais l’hébreu n’exprime pas explicitement « pour eux » dans la dernière proposition.
translation_notes:
  register: Français international moderne, clair et digne. « Agit avec discernement », « répartit » et « fournit » donnent au verset une tonalité administrative adaptée au contexte royal. Les notes conservent les ambiguïtés lexicales de l’hébreu concernant la répartition des fils et la recherche de femmes.
