source:
  edition: WLC
  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: fr
  text: 'Lorsque Roboam arriva à Jérusalem, il rassembla la maison de Juda et de Benjamin[a] : 180 000 hommes d’élite aptes au combat[b], afin de combattre Israël et de rendre le royaume à Roboam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de Juda et de Benjamin » ; l’hébreu dit littéralement « la maison de Juda et de Benjamin », désignation collective du royaume du Sud.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « 180 000 hommes choisis capables de faire la guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le qal narratif de בוא indique ici l’arrivée de Roboam à Jérusalem. « Arriva » est naturel en français et évite l’ambiguïté de perspective entre « vint » et « alla ».
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וַיַּקְהֵל
  choice: rassembla
  rationale: Le hiphil de קהל signifie faire se réunir ou mobiliser un groupe ; « rassembla » convient au contexte militaire.
- source_word: אֶת־בֵּית יְהוּדָה וּבִנְיָמִן
  choice: la maison de Juda et de Benjamin
  rationale: La traduction conserve l’image collective de בֵּית, qui désigne ici les tribus ou l’entité politique du royaume du Sud.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180 000
  rationale: Rendu direct du nombre selon la typographie française contemporaine.
- source_word: בָּחוּר
  choice: hommes d’élite
  rationale: Dans ce contexte militaire, בָּחוּר désigne vraisemblablement des hommes choisis ou de premier rang plutôt que simplement de jeunes hommes.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: aptes au combat
  rationale: L’expression littérale « faisant la guerre » caractérise ces hommes comme des combattants en état de servir ; cette formulation française reste claire sans redoubler « combattre ».
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: afin de combattre Israël
  rationale: Dans ce contexte hostile, עִם introduit l’adversaire. La construction française sans « contre » est naturelle et conserve clairement le sens.
- source_word: לְהָשִׁיב
  choice: rendre
  rationale: Le hiphil de שוב exprime le fait de faire revenir ou de restituer. « Rendre » marque naturellement le rétablissement du royaume sous l’autorité de Roboam.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: מַמְלָכָה désigne ici le royaume ou le pouvoir royal ; « royaume » conserve l’étendue sémantique du terme.
- source_word: לִרְחַבְעָם
  choice: à Roboam
  rationale: La préposition ל indique ici celui à qui le royaume devait être rendu.
theological_decisions:
- issue: Référent d’« Israël » après la division du royaume
  choice: Conserver « Israël » sans ajout explicatif dans le texte principal.
  alternative: les tribus du Nord
  rationale: Le texte hébreu nomme lui-même « Israël » l’entité opposée à Roboam. Garder ce terme respecte la terminologie du Chroniste et évite d’introduire une qualification interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide, tandis que « la maison de Juda et de Benjamin » préserve l’expression collective hébraïque ; une note en explicite le sens. La répétition finale du nom « Roboam » est maintenue conformément au texte source.
