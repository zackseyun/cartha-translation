base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Ne montez pas et ne combattez pas vos frères[a]. Que chacun retourne chez lui, car cela vient de moi[b]. » Ils écoutèrent donc les paroles de Yahweh et rebroussèrent chemin, au lieu de marcher contre Jéroboam[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec vos frères » ; il s’agit ici des autres Israélites, contre lesquels ils s’apprêtaient à combattre.'
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « car cette affaire est de mon fait ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils retournèrent d’aller vers Jéroboam » ; le contexte indique une marche militaire contre lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formulation française, solennelle mais naturelle, conserve la formule hébraïque du messager prophétique et rend explicitement le nom divin.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Ne montez pas et ne combattez pas
  rationale: « Monter » préserve l’image du déplacement militaire exprimée par עלה; la coordination répétée rend directement les deux interdictions hébraïques.
- source_word: עִם אֲחֵיכֶם
  choice: vos frères
  rationale: Dans ce contexte, « combattre vos frères » exprime naturellement l’opposition tout en conservant l’accent du texte sur la fraternité entre Israélites.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Que chacun retourne chez lui
  rationale: Cette tournure actuelle restitue la valeur distributive de אִישׁ sans alourdir la phrase par un masculin générique explicite.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: car cela vient de moi
  rationale: La formulation conserve l’attribution à Dieu tout en laissant ouverte la nuance exacte entre origine, décision et causalité.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: Ils écoutèrent donc les paroles de Yahweh
  rationale: « Écouter » garde ensemble l’audition et l’obéissance possibles dans שׁמע; leur conduite subséquente manifeste qu’ils ont tenu compte des paroles.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: renoncèrent à marcher contre Jéroboam
  rationale: Le contexte est celui d’une expédition militaire. « Marcher contre » explicite cette orientation hostile, tandis que la note conserve la construction plus littérale avec « vers ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le nom propre est translittéré selon l’usage du projet, sans le remplacer par un titre.
- issue: Causalité divine dans מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: car cela vient de moi
  alternative: car cette affaire est de mon fait
  rationale: Le français retenu affirme l’origine divine indiquée par l’hébreu sans préciser davantage le mode de causalité ou développer une doctrine de la providence étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est ponctué pour clarifier le changement de locuteur. « Ainsi parle » conserve la solennité de la formule prophétique; « chez lui » et « renoncèrent à marcher » assurent une lecture naturelle sans effacer les nuances signalées en notes.
