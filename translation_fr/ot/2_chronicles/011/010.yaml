  text: וְ/אֶת צָרְעָה֙ וְ/אֶת אַיָּל֔וֹן וְ/אֶת חֶבְר֔וֹן אֲשֶׁ֥ר בִּ/יהוּדָ֖ה וּ/בְ/בִנְיָמִ֑ן עָרֵ֖י מְצֻרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/010.yaml
  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: fr
  text: ainsi que Tsorea, Ayalôn et Hébron, qui se trouvent en Juda et en Benjamin, villes fortifiées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: Tsorea
  rationale: Nom de lieu rendu selon une forme française biblique usuelle, sans le traduire.
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: Translittération française claire du nom de lieu hébreu.
- source_word: חֶבְרוֹן
  choice: Hébron
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: אֲשֶׁר
  choice: qui se trouvent
  rationale: Le relatif hébreu exige ici un verbe explicite en français; cette formulation exprime naturellement la localisation géographique sans introduire une idée de possession.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: en Juda et en Benjamin
  rationale: La répétition des prépositions marque la localisation dans les deux territoires; le français naturel peut coordonner les deux compléments avec un seul « en » répété implicitement.
- source_word: עָרֵי מְצֻרוֹת
  choice: villes fortifiées
  rationale: Rend directement le syntagme construit désignant des villes dotées de fortifications.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: ainsi que ... , ... et ...
  rationale: Le verset poursuit l’énumération commencée précédemment; « ainsi que » signale cette continuité, tandis que la coordination française évite une répétition lourde.
theological_decisions:
- issue: Portée de l’apposition « villes fortifiées »
  choice: Maintien en fin de phrase comme apposition
  alternative: La rattacher explicitement aux seules trois villes de ce verset ou à toute la liste des versets 6 à 10
  rationale: L’hébreu place l’expression à la fin sans préciser explicitement sa portée. La formulation française conserve cette légère ambiguïté au lieu de la résoudre.
translation_notes:
  register: Français moderne, digne et lisible. La phrase reste un fragment coordonné parce que le verset poursuit directement la liste du contexte précédent.
