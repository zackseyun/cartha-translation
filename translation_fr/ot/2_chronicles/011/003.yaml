  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: fr
  text: 'Parle à Roboam, fils de Salomon, roi de Juda, ainsi qu’à tout Israël en Juda et en Benjamin :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: Parle à
  rationale: L’impératif de אמר suivi de אֶל ordonne de transmettre un message à des destinataires précis. « Parle à » est naturel en français et garde distincte la formule introductive לֵאמֹר rendue à la fin du verset.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Roboam, fils de Salomon
  rationale: Forme française traditionnelle et courante du nom, suivie de la filiation exprimée par la chaîne construite hébraïque.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Titre royal en apposition à Roboam, rendu sans article conformément à l’usage français.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: ainsi qu’à tout Israël
  rationale: Conserve la désignation collective et nationale « Israël » plutôt que de la remplacer par « tous les Israélites ».
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: qui se trouve en Juda et en Benjamin
  rationale: La préposition בְּ a ici une valeur locale. La relative explicite naturellement en français que l’expression désigne Israël présent dans ces territoires, sans la réduire à une simple appartenance tribale.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit le contenu du message qui suit. « En ces termes : » remplit naturellement cette fonction en français sans produire la répétition maladroite « parle… en disant ».'
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Ainsi qu’à » évite une coordination lourde, tandis que « tout Israël » maintient la désignation collective du texte hébreu. La ponctuation finale signale que le discours commence au verset suivant.
