  source_fidelity: 'Le sens fondamental est fidèle : l’impératif s’adresse à Roboam puis à l’ensemble désigné comme Israël, situé en Juda et en Benjamin. « Qui se trouve » explicite de manière acceptable la valeur locale de בְּ, mais cette relative n’est pas nécessaire et alourdit légèrement la phrase.'
  naturalness: La phrase est globalement naturelle, mais les guillemets ouvrants et fermants encadrant une formule qui introduit seulement les paroles du verset suivant sont inadaptés en français. Le deux-points suffit ici ; les guillemets, si l’édition les emploie, doivent s’ouvrir au début du discours au verset 4. « À tout Israël en Juda et en Benjamin » est plus direct et conserve l’ellipse du texte source.
  terminology: « Roboam », « Salomon », « roi de Juda » et « Israël » sont appropriés au français biblique moderne. Aucun terme théologique disputé n’est en jeu.
