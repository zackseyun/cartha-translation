  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: fr
  text: Car les Lévites abandonnèrent leurs terres de pâturage[a] et leurs propriétés foncières, et partirent pour Juda et Jérusalem, parce que Jéroboam et ses fils les avaient exclus de l’exercice du sacerdoce pour Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs terrains communaux » ou « les espaces ouverts attenants à leurs villes ». Le mot hébreu désigne les terres non bâties rattachées aux villes, souvent utilisées pour faire paître le bétail.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « les avaient écartés du service sacerdotal de Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: leurs terres de pâture
  rationale: Le terme désigne les espaces ouverts attenants aux villes lévitiques, notamment destinés au bétail. « Terres de pâture » exprime naturellement cet usage sans suggérer de simples champs isolés.
- source_word: אֲחֻזָּתָם
  choice: leurs domaines
  rationale: אֲחֻזָּה désigne ici des biens fonciers ou des possessions durables. « Domaines » conserve cette dimension territoriale mieux que le terme très général « biens ».
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: et partirent pour Juda et Jérusalem
  rationale: Le verbe הלך suivi de ל indique un déplacement vers ces destinations. « Partirent pour » convient au point de vue narratif et au fait qu’ils quittent leurs terres.
- source_word: הִזְנִיחָם
  choice: les avaient exclus
  rationale: Le hiphil de זנח exprime ici le rejet ou la mise à l’écart; le complément מִכַּהֵן précise qu’il s’agit de leur exclusion de la fonction sacerdotale.
- source_word: מִכַּהֵן לַיהוָה
  choice: du service sacerdotal de Yahweh
  rationale: La construction מן avec l’infinitif de כהן indique qu’ils ont été écartés de l’exercice du sacerdoce. Cette formulation française est concise et naturelle; une traduction verbale plus proche de la forme hébraïque est signalée en note.
- source_word: כִּי ... כִּי
  choice: Car ... parce que
  rationale: Le premier כִּי rattache le verset comme explication de ce qui précède; le second introduit la cause du départ des Lévites.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Portée de l’exclusion des Lévites
  choice: les avaient exclus du service sacerdotal
  alternative: les avaient rejetés, les empêchant d’exercer le sacerdoce
  rationale: Le contexte institutionnel est rendu clairement, tout en évitant d’ajouter une affirmation sur la validité théologique de leur sacerdoce. La note conserve une formulation plus verbale de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. « Terres de pâture » et « domaines » rendent concrètement les deux catégories foncières; « service sacerdotal » reste accessible tout en conservant la précision cultuelle du passage.
