id: 2CH.11.17
reference: 2 Chronicles 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: fr
  text: Ainsi, ils affermirent le royaume de Juda[a] et donnèrent de la force à Roboam, fils de Salomon, pendant trois ans, car pendant trois ans ils suivirent la voie de David et de Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la royauté de Juda ».
    reason: Le nom hébreu מַלְכוּת peut désigner soit le royaume comme entité politique, soit la royauté ou le pouvoir royal.
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: ils affermirent
  rationale: Le piel de חזק exprime ici l’action de rendre ferme ou fort. « Affermirent » convient au royaume sans limiter le sens à une fortification militaire.
- source_word: מַלְכוּת יְהוּדָה
  choice: le royaume de Juda
  rationale: מַלְכוּת peut désigner la royauté ou le royaume. Dans ce contexte politique, « le royaume de Juda » est la formulation française la plus naturelle, tout en signalant l’autre possibilité en note.
- source_word: וַיְאַמְּצוּ
  choice: donnèrent de la force à
  rationale: Le piel de אמץ signifie rendre fort, fortifier ou soutenir. Cette tournure garde Roboam comme objet direct sur le plan du sens et évite de répéter « affermirent ».
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Roboam, fils de Salomon
  rationale: Les noms suivent leur forme française traditionnelle, et la filiation est rendue directement.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: pendant trois ans
  rationale: Cette expression de durée se rend naturellement ainsi en français. Sa répétition dans le verset est conservée.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’affermissement décrit dans la première proposition.
- source_word: הָלְכוּ בְּדֶרֶךְ
  choice: ils suivirent la voie
  rationale: Littéralement, ils « marchèrent dans la voie ». « Suivirent la voie » restitue naturellement en français la métaphore hébraïque de la conduite sans la développer en paraphrase.
- source_word: דָּוִיד וּשְׁלֹמֹה
  choice: David et Salomon
  rationale: La voie au singulier présente ici le modèle de conduite associé aux deux rois; le singulier est donc conservé.
theological_decisions:
- issue: Portée de l’évaluation positive de « la voie de David et de Salomon »
  choice: Conserver l’expression sans l’expliciter et limiter temporellement l’affirmation aux trois années indiquées.
  alternative: Paraphraser par « ils restèrent fidèles à l’Éternel comme David et Salomon » ou en faire une appréciation globale de leur vie.
  rationale: Le texte évalue positivement leur conduite durant une période précise, mais il ne définit pas ici cette voie ni ne présente David et Salomon comme irréprochables en tout temps.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « pendant trois ans » est maintenue parce qu’elle appartient à la structure emphatique de l’hébreu. « Suivirent la voie » conserve l’image biblique sous une forme idiomatique en français.
