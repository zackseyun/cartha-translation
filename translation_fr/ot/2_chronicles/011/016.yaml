id: 2CH.11.16
reference: 2 Chronicles 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: fr
  text: À leur suite, des gens de toutes les tribus d’Israël qui avaient à cœur[a] de rechercher Yahweh, le Dieu d’Israël, vinrent[b] à Jérusalem pour offrir des sacrifices à Yahweh, le Dieu de leurs pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui donnaient leur cœur »; cette expression signifie qu’ils orientaient résolument leur volonté vers la recherche de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « allèrent ». Le verbe hébreu peut signifier « venir » ou « aller » selon le point de vue adopté dans le récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: À leur suite
  rationale: Rend à la fois le lien avec le verset précédent et l’idée de succession, dans un français naturel.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: des gens de toutes les tribus d’Israël
  rationale: Le complément introduit par מִן indique l’origine; l’ajout de « des gens » explicite sans surinterpréter les personnes désignées par le participe qui suit.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: qui avaient à cœur
  rationale: Cette expression française naturelle communique l’orientation volontaire et profonde de la personne entière exprimée par l’idiome hébreu, littéralement « qui donnaient leur cœur ».
- source_word: לְבַקֵּשׁ
  choice: de rechercher
  rationale: Dans ce contexte religieux, בקש désigne une démarche volontaire pour se tourner vers Dieu; « rechercher » conserve cette portée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la construction hébraïque qui identifie Yahweh comme le Dieu d’Israël.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: vinrent à Jérusalem
  rationale: Le verbe בוא peut se traduire par « venir » ou « aller » selon le point de vue narratif; « vinrent » adopte ici Jérusalem comme point de référence.
- source_word: לִזְבּוֹחַ
  choice: pour offrir des sacrifices
  rationale: L’infinitif exprime le but. Cette formulation française indique clairement l’acte cultuel visé.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Conserve le masculin explicite et la résonance de cette formule d’alliance, plutôt que de le neutraliser par « ancêtres ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu sans le remplacer par un titre.
- issue: Formule אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  alternative: le Dieu de leurs ancêtres
  rationale: L’hébreu dit explicitement « pères » dans une formule traditionnelle liée à l’alliance; la traduction conserve cette forme genrée.
translation_notes:
  register: Français international moderne, digne et accessible. « À leur suite » assure la continuité narrative; « avaient à cœur » rend naturellement l’idiome hébreu, tandis que les notes conservent sa forme littérale et l’ambiguïté de בוא.
