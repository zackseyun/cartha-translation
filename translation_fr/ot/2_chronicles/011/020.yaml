  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: fr
  text: 'Après elle, il prit Maaka, fille d’Absalom[a], et elle lui donna quatre enfants : Abiya, Attaï, Ziza et Shelomith.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fille d’Absalom ». Le terme peut parfois désigner une descendante plus éloignée; certains comprennent donc : « petite-fille d’Absalom ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: Après elle
  rationale: La préposition « après » suivie du suffixe féminin singulier renvoie à l’épouse mentionnée auparavant. « Après elle » conserve cette référence explicite.
- source_word: לָקַח
  choice: il prit
  rationale: Le verbe signifie littéralement « prendre » et, dans ce contexte, désigne le fait de prendre une femme pour épouse. La formulation retenue préserve l’expression hébraïque sans expliciter davantage.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Translittération française du nom propre hébreu.
- source_word: בַּת אַבְשָׁלוֹם
  choice: fille d’Absalom
  rationale: Le texte hébreu emploie explicitement « fille de ». Le sens généalogique éventuellement plus large est signalé en note plutôt que substitué au texte.
- source_word: וַתֵּלֶד לוֹ
  choice: elle lui donna pour fils
  rationale: Formulation française naturelle exprimant qu’elle mit au monde pour lui les fils énumérés, tout en rendant le complément לוֹ.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: Abiya, Attaï, Ziza et Shelomith
  rationale: Les noms propres sont translittérés selon des formes françaises lisibles; les marqueurs répétés de l’objet direct ne sont pas rendus séparément.
theological_decisions:
- issue: Désignation généalogique de Maaka comme « fille d’Absalom »
  choice: Conserver « fille d’Absalom » dans le texte principal
  alternative: « petite-fille d’Absalom » ou « descendante d’Absalom »
  rationale: L’hébreu dit explicitement « fille ». Comme le terme peut parfois désigner une descendante plus éloignée, cette possibilité est conservée en note sans résoudre l’ambiguïté dans le texte principal.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; les noms sont translittérés dans des formes adaptées au français.
