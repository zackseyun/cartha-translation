lexical_decisions:
- source_word: וְ/אֶת
  choice: ainsi que
  rationale: La conjonction וְ avec le marqueur d’objet אֶת poursuit l’énumération commencée au verset précédent. En français, אֶת n’est pas rendu directement ; « ainsi que » marque naturellement la continuité de la liste.
- source_word: בֵּית צ֥וּר
  choice: Beth-Tsour
  rationale: Nom de lieu transcrit selon un usage français courant, plutôt que traduit littéralement.
- source_word: שׂוֹכ֖וֹ
  choice: Soko
  rationale: Nom de lieu transcrit au plus près de la forme hébraïque ; les graphies françaises varient.
- source_word: עֲדֻלָּֽם
  choice: Adoullam
  rationale: Transcription française traditionnelle et intelligible de ce nom de lieu judéen.
