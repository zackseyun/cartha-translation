  text: וַ/יֵּ֥שֶׁב רְחַבְעָ֖ם בִּ/ירוּשָׁלִָ֑ם וַ/יִּ֧בֶן עָרִ֛ים לְ/מָצ֖וֹר בִּ/יהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: fr
  text: Roboam habita à Jérusalem et construisit des villes fortifiées[a] en Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des villes pour la fortification » ; on pourrait aussi traduire « des villes servant de forteresses » ou « des villes destinées à la défense ».
    reason: L’hébreu לְמָצוֹר exprime la destination défensive des villes sans employer directement un adjectif signifiant « fortifiées ».
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: Le verbe יָשַׁב peut signifier « s’asseoir », « demeurer » ou « habiter ». Dans ce récit, « habita » exprime naturellement le fait que Roboam résidait à Jérusalem, sans suggérer nécessairement une nouvelle installation.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition בְּ marque ici le lieu. En français idiomatique, on dit « à Jérusalem ».
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le verbe בָּנָה signifie proprement « construire » ou « bâtir ». « Construisit » conserve ce sens plutôt que de lui substituer directement « fortifia ».
- source_word: עָרִים לְמָצוֹר
  choice: des villes fortifiées[a]
  rationale: L’expression signifie littéralement « des villes pour la fortification/défense ». « Villes fortifiées » est naturel en français et rend clairement la fonction défensive, tandis que la note conserve la forme et les autres nuances possibles de l’hébreu.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition indique le territoire où se trouvaient les villes. « En Juda » est la tournure française traditionnelle et naturelle pour la région.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Roboam » et « Juda » suivent les formes françaises usuelles des noms bibliques.
