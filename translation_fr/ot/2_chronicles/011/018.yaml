  text: וַ/יִּֽקַּֽח ל֤/וֹ רְחַבְעָם֙ אִשָּׁ֔ה אֶת מָ֣חֲלַ֔ת בן יְרִימ֖וֹת בֶּן דָּוִ֑יד אֲבִיהַ֕יִל בַּת אֱלִיאָ֖ב בֶּן יִשָֽׁי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: fr
  text: Roboam prit pour femme Mahalath, fille de Yerimoth, fils de David, et d’Abihaïl, fille d’Éliab, fils de Jessé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La généalogie hébraïque est très condensée et sa formulation est inhabituelle. Elle porte littéralement : « Mahalath, fils de Yerimoth, fils de David, Abihaïl, fille d’Éliab, fils de Jessé »; « fils » appliqué à Mahalath est donc anormal. Le sens le plus probable est que Mahalath était la fille de Yerimoth et d’Abihaïl. Certains comprennent autrement le rattachement d’Abihaïl; moins probablement, certains y voient une seconde épouse.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: prit pour femme
  rationale: Cette tournure rend directement l’idiome hébreu « prendre pour soi une femme » dans son sens matrimonial, tout en restant naturelle et digne en français.
- source_word: מָחֲלַת
  choice: Mahalath
  rationale: Translittération du nom propre selon son usage biblique français courant.
- source_word: בן יְרִימוֹת
  choice: fille de Yerimoth
  rationale: Le texte consonantique porte littéralement « fils de Yerimoth », mais la forme est en discordance avec Mahalath, nom féminin. Dans cette généalogie condensée, le sens contextuel le plus probable est « fille de Yerimoth »; l’anomalie est signalée en note.
- source_word: יְרִימוֹת בֶּן דָּוִיד
  choice: Yerimoth, fils de David
  rationale: Rend explicitement et naturellement le lien généalogique exprimé en hébreu.
- source_word: אֲבִיהַיִל
  choice: Abihaïl
  rationale: Nom propre translittéré. La syntaxe retenue comprend Abihaïl comme la mère de Mahalath plutôt que comme une seconde épouse, sans masquer les autres analyses possibles, indiquées en note.
- source_word: אֱלִיאָב בֶּן יִשָׁי
  choice: Éliab, fils de Jessé
  rationale: Préserve les relations généalogiques de l’hébreu dans un français idiomatique.
theological_decisions:
- issue: Rapport syntaxique entre Mahalath, Yerimoth et Abihaïl dans cette généalogie condensée
  choice: Mahalath est présentée comme la fille de Yerimoth, fils de David, et d’Abihaïl, fille d’Éliab, fils de Jessé.
  alternative: On peut lire Abihaïl comme un second nom dans la notice familiale ou, moins probablement, comprendre que Roboam prit Mahalath et Abihaïl pour femmes; la formulation hébraïque appelle aussi littéralement Mahalath « fils de Yerimoth ».
  rationale: Le singulier « une femme » et la structure généalogique favorisent l’identification d’une seule épouse, Mahalath, dont les lignées paternelle et maternelle sont précisées. Comme l’hébreu reste inhabituellement condensé et présente une discordance de genre, la note conserve les autres possibilités au lieu de les exclure silencieusement.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Prit pour femme » conserve la couleur de l’idiome hébreu tout en étant immédiatement compréhensible. Les virgules rendent lisible la généalogie, et la note signale sans la résoudre abusivement l’ambiguïté réelle du texte source.
