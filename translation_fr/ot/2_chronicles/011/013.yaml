  text: וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֖ר בְּ/כָל יִשְׂרָאֵ֑ל הִֽתְיַצְּב֥וּ עָלָ֖י/ו מִ/כָּל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: fr
  text: Les prêtres et les lévites qui se trouvaient dans tout Israël se rallièrent à lui, venant de tous leurs territoires[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se présentèrent devant lui » ou « prirent position auprès de lui ». L’expression hébraïque peut désigner soit le fait de paraître physiquement devant Roboam, soit celui de prendre son parti; le contexte favorise l’idée d’un ralliement loyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: Les prêtres et les lévites
  rationale: La coordination et les articles définis sont rendus naturellement en français. « Lévites » est le terme français courant pour ce groupe.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: qui se trouvaient dans tout Israël
  rationale: La proposition relative indique que ces prêtres et lévites étaient répartis dans l’ensemble d’Israël.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: se rallièrent à lui
  rationale: Dans ce contexte, l’expression évoque une prise de position volontaire en faveur de Roboam. Cette formulation française exprime clairement l’alignement loyal tout en signalant en note les lectures plus concrètes possibles.
- source_word: מִכָּל גְּבוּלָם
  choice: venant de tous leurs territoires
  rationale: גְּבוּל désigne ici les territoires ou régions où ils habitaient. L’ajout participial « venant » explicite en français le mouvement exprimé par מִן sans modifier le sens.
theological_decisions:
- issue: Nature de la démarche des prêtres et des lévites envers Roboam
  choice: se rallièrent à lui
  alternative: se présentèrent devant lui / prirent position auprès de lui
  rationale: Le contexte favorise l’idée d’un soutien loyal, mais l’idiome hébreu peut aussi décrire le fait de venir se tenir devant quelqu’un; cette ambiguïté est conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. « Se rallièrent » est naturel dans un récit politique et traduit la valeur contextuelle de l’idiome sans effacer ses autres possibilités, données en note.
