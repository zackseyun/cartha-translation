  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמַֽעְיָ֥הוּ אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Shemaya, l’homme de Dieu :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement en français la succession narrative sans alourdir la phrase par « et il arriva ».
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formule prophétique reconnue conserve le rapport construit de l’hébreu et le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du tétragramme, qui préserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: fut adressée à
  rationale: Dans la formule française « la parole fut adressée à », cette tournure rend idiomatiquement la préposition qui désigne le destinataire.
- source_word: שְׁמַעְיָהוּ
  choice: Shemaya
  rationale: Translittération lisible en français du nom hébreu, dont la finale théophore est ici représentée sous la forme usuelle « -ya ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: L’article hébreu et l’usage établi de l’expression indiquent un titre reconnu désignant une figure prophétique.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles directes annoncées par l’infinitif hébreu, sans calque pesant tel que « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel et ne remplace pas celui-ci par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule prophétique reste reconnaissable, tandis que les deux-points évitent le calque peu naturel « en disant ».
