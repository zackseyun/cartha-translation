  text: וַ/יְחַזֵּ֖ק אֶת הַ/מְּצֻר֑וֹת וַ/יִּתֵּ֤ן בָּ/הֶם֙ נְגִידִ֔ים וְ/אֹצְר֥וֹת מַאֲכָ֖ל וְ/שֶׁ֥מֶן וָ/יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: fr
  text: Il consolida les places fortifiées et y établit des commandants, ainsi que des entrepôts de vivres, d’huile et de vin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: Il consolida
  rationale: Le piel de חזק exprime ici l’action de rendre plus fort ou plus sûr. « Consolida » évite la répétition de « fortifia les places fortifiées » tout en conservant l’action causative.
- source_word: הַמְּצֻרוֹת
  choice: les places fortifiées
  rationale: Le nom désigne des sites fortifiés ou des places fortes. Cette formulation reste assez large pour ne pas préciser indûment la taille ou la fonction exacte de chaque site.
- source_word: וַיִּתֵּן בָּהֶם
  choice: et y établit
  rationale: נתן avec ב indique que les responsables furent placés dans ces sites. En français, « y établit » rend naturellement cette affectation sans transformer explicitement le complément locatif en autorité exercée « sur » les places.
- source_word: נְגִידִים
  choice: des commandants
  rationale: נָגִיד peut désigner un chef, un dirigeant ou un haut responsable. Dans ce contexte de places fortifiées, « commandants » exprime au mieux la fonction militaire probable sans suggérer un rang royal.
- source_word: וְאֹצְרוֹת
  choice: ainsi que des réserves de
  rationale: אֹצָרוֹת peut désigner des dépôts, des entrepôts ou ce qui y est accumulé. Avec nourriture, huile et vin, « réserves de » rend clairement des provisions stockées.
- source_word: מַאֲכָל
  choice: nourriture
  rationale: Le terme désigne de façon générale ce qui se mange. « Nourriture » est naturel et précis dans ce contexte d’approvisionnement.
- source_word: שֶׁמֶן
  choice: huile
  rationale: Traduction habituelle de שֶׁמֶן. Il s’agit vraisemblablement d’huile d’olive, mais le texte hébreu dit simplement « huile ».
- source_word: יָיִן
  choice: vin
  rationale: Traduction directe et usuelle de יָיִן, sans raison contextuelle de l’élargir à une boisson indéterminée.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit la coordination hébraïque tout en employant une syntaxe française fluide. Aucun complément explicatif n’est ajouté, et l’ambiguïté d’אֹצָרוֹת est rendue contextuellement par « réserves ».
