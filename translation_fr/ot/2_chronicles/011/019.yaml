  yaml_path: translation/ot/2_chronicles/011/019.yaml
  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: fr
  text: 'Elle lui enfanta des fils : Yeoush, Shemaria et Zaham.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Elle donna
  rationale: Le wayyiqtol de ילד poursuit le récit. Avec « des fils » et le complément indirect « lui », la tournure française idiomatique est « elle lui donna des fils »; elle conserve clairement le sujet féminin.
- source_word: לוֹ
  choice: lui
  rationale: La préposition ל avec suffixe désigne ici le père dans une formule de naissance; le français naturel l'exprime par le complément indirect « lui ».
- source_word: בָּנִים
  choice: des fils
  rationale: L'hébreu désigne précisément des fils, et les trois descendants nommés sont de sexe masculin.
- source_word: יְעוּשׁ
  choice: Yeouch
  rationale: Translittération française moderne du nom hébreu, avec « ch » pour la consonne ש.
- source_word: שְׁמַרְיָה
  choice: Chemaria
  rationale: Translittération adaptée aux conventions françaises, représentant ש par « ch » et la forme théophore finale יָה par « ia ».
- source_word: זָהַם
  choice: Zaham
  rationale: Translittération directe du nom hébreu, conforme à sa vocalisation massorétique.
