base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: fr
  text: Dans chacune des villes[a], il plaça des boucliers et des lances, et il les renforça considérablement. Juda et Benjamin étaient sous son autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « ville » de manière distributive, littéralement : « dans chaque ville et ville », pour insister sur chacune d’elles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר
  choice: Dans chacune des villes
  rationale: La répétition distributive hébraïque, littéralement « dans chaque ville et ville », souligne que cela se fit dans chaque ville prise individuellement. « Dans chacune des villes » rend naturellement cette insistance en français moderne.
- source_word: צִנּוֹת
  choice: boucliers
  rationale: Le terme désigne des boucliers, probablement de grande taille dans ce contexte militaire. Le mot générique « boucliers » reste précis sans ajouter une dimension que le verset n’explicite pas.
- source_word: וּרְמָחִים
  choice: lances
  rationale: « Lances » est l’équivalent français courant et naturel pour cette arme d’hast.
- source_word: וַיְחַזְּקֵם
  choice: il les renforça
  rationale: Le suffixe masculin pluriel renvoie naturellement aux villes fortifiées mentionnées dans le contexte. « Renforça » conserve le sens du verbe חזק sans répéter exactement le vocabulaire de la fortification.
- source_word: לְהַרְבֵּה מְאֹד
  choice: considérablement
  rationale: Cette formulation française exprime clairement le haut degré d’intensité indiqué par la construction hébraïque, sans la lourdeur de « très grandement ».
- source_word: וַיְהִי לוֹ יְהוּדָה וּבִנְיָמִן
  choice: Ainsi, Juda et Benjamin furent sous son autorité
  rationale: L’idiome hébraïque exprime ici la possession politique ou l’allégeance. « Sous son autorité » est naturel en français et évite de suggérer que les territoires ou leurs habitants lui appartenaient comme des biens.
theological_decisions:
- issue: Portée de l’expression וַיְהִי לוֹ appliquée à Juda et Benjamin
  choice: furent sous son autorité
  alternative: lui appartinrent
  rationale: Dans le contexte du règne de Roboam, la formule concerne la domination politique et l’allégeance. La traduction retenue transmet ce rapport sans introduire une notion indue de propriété absolue.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’enchaînement hébraïque tout en évitant les tournures peu naturelles. Le pronom « les » conserve comme antécédent les villes du contexte.
