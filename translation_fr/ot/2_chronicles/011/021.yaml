source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: fr
  text: Roboam aimait Maaka, fille d’Absalom[a], plus que toutes ses femmes et concubines, car il avait pris dix-huit femmes et soixante concubines, et il engendra vingt-huit fils et soixante filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « descendante d’Absalom » ; dans certains contextes généalogiques, le mot hébreu traduit par « fille » peut avoir un sens plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: aimait
  rationale: Le verbe אהב exprime directement l’amour ou l’affection; la comparaison est portée par מִכָּל, rendu ensuite par « plus que ».
- source_word: בַת אַבְשָׁלוֹם
  choice: fille d’Absalom
  rationale: בַּת signifie normalement « fille ». Le sens généalogique éventuellement plus large est conservé en note plutôt que substitué au texte.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: plus que toutes ses femmes et concubines
  rationale: מִכָּל marque ici la comparaison. « Femmes » convient au contexte matrimonial, tandis que « concubines » maintient la catégorie sociale distincte exprimée par פִּילַגְשִׁים.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit une explication contextuelle de l’affirmation précédente.
- source_word: נָשִׁים ... נָשָׂא
  choice: il avait pris dix-huit femmes
  rationale: נשא avec נָשִׁים désigne le fait de prendre des femmes pour épouses. « Avait pris » reste proche de l’expression hébraïque et convient au récit explicatif.
- source_word: וַיּוֹלֶד
  choice: il engendra
  rationale: La forme verbale présente Roboam comme le père des enfants. « Engendra » est précis, digne et plus directement correspondant que le simple « eut ».
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים וְשִׁשִּׁים בָּנוֹת
  choice: vingt-huit fils et soixante filles
  rationale: Rendu direct des nombres et des termes de parenté hébreux.
theological_decisions:
- issue: Désignation généalogique de Maaka comme « fille d’Absalom »
  choice: Conserver « fille d’Absalom » dans le texte principal
  alternative: Comprendre בַּת au sens plus large de « descendante », éventuellement « petite-fille »
  rationale: Le sens ordinaire du mot hébreu doit rester prioritaire, sans trancher silencieusement la question généalogique; la possibilité d’un emploi plus large est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres suivent les formes françaises bibliques usuelles « Roboam », « Maaka » et « Absalom ». La formulation conserve la distinction entre femmes et concubines sans ajouter d’évaluation morale absente du verset.
