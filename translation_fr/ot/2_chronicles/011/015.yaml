  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: fr
  text: Il nomma pour lui-même des prêtres pour les hauts lieux, pour les démons-boucs[a] et pour les veaux qu’il avait fabriqués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « boucs » ou « satyres ». Le terme hébreu peut désigner des êtres caprins associés à un culte illicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: il établit
  rationale: Dans cette construction causative où les prêtres sont l’objet, le verbe exprime leur mise en fonction; « établit » restitue ce sens sans suggérer une simple posture physique.
- source_word: לּוֹ
  choice: pour lui-même
  rationale: Le datif indique que Jéroboam agit pour son propre compte; la tournure française conserve cette nuance réflexive.
- source_word: כֹּהֲנִים
  choice: des prêtres
  rationale: C’est le terme français courant pour cette fonction cultuelle.
- source_word: לַבָּמוֹת
  choice: pour les hauts lieux
  rationale: « Hauts lieux » est l’expression biblique établie pour des sites cultuels, souvent situés sur une hauteur, et préserve le caractère concret du terme hébreu.
- source_word: לַשְּׂעִירִים
  choice: pour les démons en forme de boucs
  rationale: Dans cette énumération cultuelle, שְׂעִירִים désigne vraisemblablement des êtres ou représentations démoniaques d’apparence caprine plutôt que de simples boucs. Cette formulation rend l’image hébraïque intelligible sans la réduire au terme mythologique « satyres ».
- source_word: וְלָעֲגָלִים
  choice: et pour les veaux
  rationale: Le nom désigne littéralement des veaux; le contexte indique qu’il s’agit d’images cultuelles, sans qu’il soit nécessaire d’ajouter « idoles » dans le texte.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait fabriqués
  rationale: Le relatif se rattache naturellement aux veaux, objets confectionnés avant l’établissement des prêtres. « Fabriqués » rend ici le caractère matériel des images cultuelles plus clairement que le général « faits ».
theological_decisions:
- issue: Sens de שְׂעִירִים dans un contexte de culte illicite
  choice: démons en forme de boucs
  alternative: boucs; satyres
  rationale: Le contexte cultuel favorise un référent démoniaque ou idolâtrique, mais l’image caprine propre au mot hébreu est conservée. Une note signale les autres rendus possibles afin de ne pas masquer l’incertitude lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « pour » suit la structure hébraïque et distingue les lieux de culte, les êtres ou images caprines et les veaux. Le marqueur de note est placé immédiatement après l’expression qu’il précise.
