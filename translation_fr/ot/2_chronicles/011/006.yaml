  text: Il bâtit Bethléem, Étam et Teqoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le qal wayyiqtol de בנה signifie normalement « bâtir ». Le contexte concerne le renforcement de villes, mais le verset lui-même n’emploie pas explicitement le verbe « fortifier » ; « bâtit » conserve donc la formulation hébraïque sans ajouter de précision.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marque de l’objet direct, sans équivalent lexical autonome en français.
- source_word: בֵּית לֶחֶם
  choice: Bethléem
  rationale: Forme française moderne et bien établie de ce nom de lieu.
- source_word: עֵיטָם
  choice: Étam
  rationale: Translittération française claire du nom de lieu, avec accent pour guider naturellement la prononciation.
- source_word: תְּקוֹעַ
  choice: Teqoa
  rationale: Translittération française qui distingue la consonne qoph par « q » et représente simplement le nom hébreu.
- source_word: וְ...וְ...וְ
  choice: virgule, puis « et » devant le dernier élément
  rationale: Cette structure rend naturellement en français moderne l’énumération hébraïque avec waw répété.
theological_decisions: []
translation_notes:
  register: Phrase brève, sobre et digne. Le passé simple convient au registre narratif biblique en français écrit moderne. Aucun détail de fortification n’est ajouté au verbe hébreu.
