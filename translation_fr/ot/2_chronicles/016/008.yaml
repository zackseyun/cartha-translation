  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: fr
  text: Les Koushites et les Loubites[a] ne formaient-ils pas une armée immense, avec des chars et des cavaliers en très grand nombre ? Pourtant, lorsque tu t’es appuyé sur Yahweh, il les a livrés entre tes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Éthiopiens et les Libyens ». Les noms hébreux sont rendus ici par « Koushites » et « Loubites » afin de rester proches des ethnonymes du texte source.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative ; cette tournure en conserve la force en français naturel.
- source_word: הַכּוּשִׁים וְהַלּוּבִים
  choice: les Koushites et les Loubites
  rationale: La translittération des ethnonymes reste proche de l’hébreu et évite de les identifier trop catégoriquement à des peuples ou États modernes.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: formaient… une armée immense
  rationale: חַיִל désigne ici une force militaire, tandis que לָרֹב en souligne la taille considérable. « Formaien­t une armée » est idiomatique en français.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: avec des chars et des cavaliers en très grand nombre
  rationale: La formulation conserve les deux composantes militaires concrètes et l’intensification très marquée de leur nombre.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Pourtant, lorsque tu t’es appuyé sur
  rationale: « S’appuyer sur » préserve la métaphore hébraïque de la confiance et de la dépendance. « Pourtant » explicite sobrement le contraste argumentatif du contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: il les a livrés entre tes mains
  rationale: Cette expression française conserve l’image de l’idiome hébraïque tout en communiquant clairement l’idée d’une victoire accordée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Rapport entre la confiance en Yahweh et la victoire
  choice: lorsque tu t’es appuyé sur Yahweh, il les a livrés entre tes mains
  alternative: parce que tu t’es appuyé sur Yahweh
  rationale: La construction hébraïque exprime directement la circonstance temporelle de la victoire et peut aussi suggérer sa raison. « Lorsque » conserve cette formulation sans transformer explicitement le rapport en causalité.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et le contraste sont maintenus ; la métaphore « s’appuyer sur » ainsi que l’image « entre tes mains » restent perceptibles sans rendre la phrase artificielle.
