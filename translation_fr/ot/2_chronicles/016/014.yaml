  to: Ils l’enterrèrent dans le tombeau[a] qu’il s’était creusé dans la Cité de David. Ils le déposèrent sur un lit funéraire garni d’aromates et de diverses préparations parfumées[b], composées selon l’art du parfumeur. Puis ils procédèrent pour lui à un très grand brûlement[c].
  rationale: La révision remplace « un feu d’une ampleur extraordinaire » par une expression qui reflète plus directement le nom verbal hébreu et n’identifie pas le brûlement à un feu particulier. Elle remplace aussi « couchèrent » par « déposèrent », plus naturel pour le placement du corps. Les notes conservent le pluriel hébreu, l’incertitude lexicale et l’ambiguïté historique sans imposer une lecture confessionnelle ou matérielle.
