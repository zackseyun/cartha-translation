base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: fr
  text: Ils l’enterrèrent dans le tombeau[a] qu’il s’était creusé dans la Cité de David. Ils le déposèrent sur un lit funéraire garni d’aromates et de diverses préparations parfumées[b], composées selon l’art du parfumeur. Puis ils procédèrent pour lui à un très grand brûlement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ses tombeaux ». Le pluriel peut désigner un ensemble funéraire ou une tombe royale comprenant plusieurs espaces.'
    reason: forme_du_texte_source
  - marker: b
    text: Le mot hébreu correspondant est rare; il semble désigner diverses sortes de substances ou de préparations parfumées.
    reason: incertitude_lexicale
  - marker: c
    text: 'Littéralement : « ils brûlèrent pour lui un très grand brûlement ». Le texte ne précise pas ce qui fut brûlé; il peut s’agir d’un brûlement funéraire honorifique, notamment d’aromates, sans que cela signifie nécessairement que le corps fut incinéré.'
    reason: note_culturelle_et_ambiguite
lexical_decisions:
- source_word: בְקִבְרֹתָיו
  choice: dans le tombeau[a]
  rationale: La forme hébraïque est plurielle (« dans ses tombeaux »), mais elle peut désigner l’ensemble funéraire ou la tombe royale. Le singulier est naturel en français dans ce contexte, tandis que la note conserve la forme du texte source.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: qu’il s’était creusé
  rationale: כּרה signifie creuser ou excaver. Le pronom réfléchi rend explicitement le bénéficiaire indiqué par לוֹ sans préciser indûment si la tombe était taillée dans le roc.
- source_word: בְּעִיר דָּוִיד
  choice: dans la Cité de David
  rationale: Forme française établie du nom de lieu, avec la majuscule signalant le toponyme.
- source_word: בַּמִּשְׁכָּב
  choice: sur un lit funéraire
  rationale: מִשְׁכָּב désigne un lieu où l’on se couche, notamment un lit ou une couche. « Lit funéraire » rend ici la fonction contextuelle sans suggérer que le corps a été incinéré.
- source_word: אֲשֶׁר מִלֵּא
  choice: garni
  rationale: L’hébreu porte littéralement « qu’il avait rempli », avec un sujet masculin singulier dont l’identité n’est pas certaine. La tournure française centrée sur le résultat évite d’identifier arbitrairement ce sujet.
- source_word: בְּשָׂמִים
  choice: d’aromates
  rationale: Le terme désigne des substances odoriférantes employées notamment dans les préparations parfumées et les rites funéraires.
- source_word: וּזְנִים
  choice: et de diverses préparations parfumées[b]
  rationale: Ce mot rare est généralement compris comme des espèces ou variétés de produits aromatiques. La traduction conserve l’idée de diversité tout en signalant l’incertitude en note.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: composées selon l’art du parfumeur
  rationale: La racine רקח concerne le mélange spécialisé de parfums ou d’onguents. Cette formulation française restitue à la fois la composition et le savoir-faire artisanal.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: ils firent en son honneur un feu d’une ampleur extraordinaire[c]
  rationale: La construction intensive signifie littéralement qu’ils brûlèrent pour lui un très grand brûlement. La formulation française reste idiomatique, marque la fonction honorifique de לוֹ et ne précise pas ce qui fut brûlé.
theological_decisions:
- issue: Nature du grand brûlement funéraire
  choice: Un grand feu allumé en l’honneur d’Asa, sans préciser dans le texte principal ce qui fut brûlé.
  alternative: La crémation du corps, ou explicitement la combustion d’aromates.
  rationale: Le verset affirme d’abord qu’Asa fut enterré, puis mentionne un « brûlement » fait pour lui. Le contexte peut évoquer la combustion honorifique d’aromates, mais l’objet brûlé n’est pas exprimé. La traduction et la note préservent cette réserve au lieu d’imposer soit la crémation, soit une identification certaine des matières brûlées.
translation_notes:
  register: Français international moderne, digne et lisible. « Lit funéraire » et « selon l’art du parfumeur » gardent la couleur cérémonielle du passage sans archaïsme excessif. Les trois notes rendent visibles le pluriel hébreu, l’incertitude d’un terme rare et l’ambiguïté du brûlement.
