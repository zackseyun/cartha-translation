  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: fr
  text: Voici les actes d’Asa, les premiers et les derniers[a] ; les voici consignés dans le Livre des rois de Juda et d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « les paroles ou les affaires d’Asa, les premières et les dernières ». Dans cette formule historique, il s’agit des actes et des événements de l’ensemble de son règne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Voici
  rationale: Rend naturellement en français la particule présentative et son appel à l’attention, sans lui ajouter une valeur temporelle absente de l’hébreu.
- source_word: דִּבְרֵי אָסָא
  choice: les actes d’Asa
  rationale: Dans cette formule de conclusion royale, דְּבָרִים désigne largement les faits, affaires ou actions du roi, et non seulement ses paroles.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: les premiers et les derniers
  rationale: Conserve la formulation bipolaire de l’hébreu, qui embrasse l’ensemble du règne, tout en préservant sa légère ambiguïté formelle.
- source_word: הִנָּם כְּתוּבִים
  choice: les voici consignés
  rationale: Le pronom présentatif הִנָּם est explicitement rendu par « les voici », tandis que « consignés » exprime idiomatiquement leur mise par écrit dans des archives.
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Dans une formule de référence bibliographique ou archivistique, le français emploie naturellement « dans » plutôt que le littéral « sur ».
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: des rois de Juda et d’Israël
  rationale: Rend avec transparence le titre ou la désignation de la source écrite, sans développer « rois » en « annales royales », formulation plus interprétative.
