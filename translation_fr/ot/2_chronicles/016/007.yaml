  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: fr
  text: 'À cette époque, Hanani le voyant vint trouver Asa, roi de Juda, et lui dit : « Parce que tu t’es appuyé sur le roi d’Aram[a] et que tu ne t’es pas appuyé sur Yahweh ton Dieu, c’est pourquoi l’armée du roi d’Aram t’a échappé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le roi de Syrie ». Le texte hébreu porte « Aram ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: À ce moment-là
  rationale: Introduit naturellement en français le cadre temporel du récit; le waw narratif n’a pas besoin d’être rendu séparément.
- source_word: הָרֹאֶה
  choice: le voyant
  rationale: Conserve le titre prophétique précis רֹאֶה, apparenté à « prophète » mais distinct dans sa forme.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: Parce que tu t’es appuyé ... au lieu de t’appuyer
  rationale: « S’appuyer sur » est naturel en français et préserve la répétition ainsi que l’image de dépendance politique et spirituelle.
- source_word: מֶלֶךְ אֲרָם
  choice: le roi d’Aram
  rationale: Reproduit le nom géographique du texte hébreu plutôt que son équivalent historique conventionnel « Syrie ».
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh ton Dieu
  rationale: Rend directement le nom divin יהוה et conserve la formule relationnelle du texte.
- source_word: עַל כֵּן
  choice: au lieu de ... , ...
  rationale: La relation de cause à conséquence est exprimée naturellement par la construction française complète, sans alourdir la phrase par « c’est pourquoi ».
- source_word: נִמְלַט
  choice: t’a échappé
  rationale: Exprime clairement le résultat accompli de la faute reprochée à Asa.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: l’armée du roi d’Aram
  rationale: Dans ce contexte militaire, חֵיל désigne les forces armées.
- source_word: מִיָּדֶךָ
  choice: t’a échappé
  rationale: Transpose idiomatiquement « s’est échappée de ta main » en français courant tout en conservant l’idée de perte de prise ou de contrôle.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom propre divin sans le remplacer par un titre.
- issue: Nature du reproche adressé à Asa
  choice: Conserver l’opposition entre l’appui sur le roi d’Aram et l’appui sur Yahweh
  alternative: Expliciter comme une condamnation générale de toute alliance politique
  rationale: Le verset condamne précisément la dépendance d’Asa envers le roi d’Aram à la place de Yahweh; il ne formule pas à lui seul une règle générale sur toute alliance politique.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond au singulier hébreu adressé directement au roi. « Voyant » conserve le titre technique, tandis que « t’a échappé » rend naturellement l’idiome hébreu « s’est échappée de ta main ».
