revisions:
- from: 'À ce moment-là, Hanani le voyant vint trouver Asa, roi de Juda, et lui dit : « Parce que tu t’es appuyé sur le roi d’Aram[a] au lieu de t’appuyer sur Yahweh ton Dieu, l’armée du roi d’Aram t’a échappé. »'
  to: 'À cette époque, Hanani le voyant vint trouver Asa, roi de Juda, et lui dit : « Parce que tu t’es appuyé sur le roi d’Aram[a] et que tu ne t’es pas appuyé sur Yahweh ton Dieu, c’est pourquoi l’armée du roi d’Aram t’a échappé. »'
  rationale: La révision rétablit explicitement la double opposition verbale du texte hébreu et son connecteur conséquentiel, tout en conservant une syntaxe française naturelle, le registre du récit et la note lexicale existante.
