  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: fr
  text: 'Alors Asa retira de l’argent et de l’or des réserves de la maison de Yahweh et de la maison du roi, puis il les envoya à Ben-Hadad, roi d’Aram[a], qui résidait à Damas, avec ce message :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « roi d’Aram » ; traditionnellement : « roi de Syrie ».'
    reason: Cette note signale l’équivalent traditionnel de « Aram » sans le substituer au nom hébreu dans le texte.
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: retira
  rationale: Le hifil de יצא exprime ici le fait de faire sortir des biens de leurs réserves. « Retira » est naturel en français dans ce contexte et conserve l’idée d’un prélèvement concret.
- source_word: כֶּסֶף וְזָהָב
  choice: de l’argent et de l’or
  rationale: Le français « argent » désigne ici le métal précieux, comme l’indique son association avec l’or; la traduction conserve les deux matières nommées dans l’hébreu.
- source_word: מֵאֹצְרוֹת
  choice: des trésors
  rationale: Le pluriel hébreu désigne les réserves où étaient conservées les richesses du temple et du roi. « Trésors » est une formulation biblique claire et actuelle.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve le terme hébreu et son parallèle avec la maison du roi. Le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: וּבֵית הַמֶּלֶךְ
  choice: et de la maison du roi
  rationale: Cette traduction directe préserve la répétition intentionnelle de בֵּית et le parallélisme entre le sanctuaire et la résidence royale.
- source_word: וַיִּשְׁלַח
  choice: puis il les envoya
  rationale: Le pronom « les », implicite en hébreu, reprend clairement l’argent et l’or en français. « Puis » rend naturellement la progression narrative du waw consécutif.
- source_word: אֶל בֶּן הֲדַד
  choice: à Ben-Hadad
  rationale: Le nom personnel est translittéré sous une forme française claire et usuelle.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: « Aram » reproduit le nom géographique hébreu sans lui substituer l’équivalent traditionnel et historiquement approximatif « Syrie ».
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: qui résidait à Damas
  rationale: Le participe de ישׁב décrit la résidence durable de Ben-Hadad. « Résidait » rend ce sens avec naturel et dignité.
- source_word: לֵאמֹר
  choice: 'avec ce message :'
  rationale: Cette tournure française introduit naturellement les paroles directes qui suivent, tout en rendant la fonction narrative de לֵאמֹר.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom divin personnel. « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Identification géographique dאֲרָם
  choice: Aram
  alternative: Syrie
  rationale: La traduction conserve le nom du peuple et du royaume dans le texte hébreu, sans imposer une identification géopolitique plus tardive.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme entre « la maison de Yahweh » et « la maison du roi », tout en employant une transition naturelle vers le discours direct. Le marqueur [a] est placé immédiatement après le terme qu’il explique.
