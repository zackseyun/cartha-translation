  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָ/רָמָ֑ה וַ/יַּשְׁבֵּ֖ת אֶת מְלַאכְתּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/005.yaml
  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: fr
  text: Quand Baasha l’apprit, il cessa de bâtir Rama[a] et interrompit ses travaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de fortifier Rama »; l’hébreu évoque l’arrêt des travaux de construction ou de fortification entrepris à Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quand … l’apprit
  rationale: La tournure hébraïque introduit une proposition temporelle. En français naturel, « Quand » restitue la succession sans reproduire lourdement « il arriva que ». Le pronom « l’ » reprend les événements précédents, car le verbe « apprendre » demande ici un complément.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Le nom propre est translittéré selon une forme française qui garde distinctes les consonnes hébraïques.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: il cessa de bâtir
  rationale: חדל suivi de מן et de l’infinitif exprime l’arrêt d’une activité. « Cesser de bâtir » est précis, naturel et d’un registre digne.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: Il s’agit du nom de la ville. Dans ce contexte, bâtir la ville peut désigner sa construction ou sa fortification; cette latitude est signalée en note.
- source_word: וַיַּשְׁבֵּת
  choice: et interrompit
  rationale: Le hifil de שבת signifie faire cesser ou mettre fin à. « Interrompit » rend le sens causatif avec « ses travaux » sans répétition maladroite de « cessa ».
- source_word: מְלַאכְתּוֹ
  choice: ses travaux
  rationale: מלאכה désigne ici l’activité ou le chantier de construction. Le pluriel français « travaux » convient naturellement à ce contexte tout en restant assez large.
theological_decisions: []
