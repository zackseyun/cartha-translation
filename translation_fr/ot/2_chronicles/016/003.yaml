  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/בֵ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּֽי לְ/ךָ֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֞ךְ הָפֵ֣ר בְּרִֽיתְ/ךָ֗ אֶת בַּעְשָׁא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: fr
  text: « Il y a une alliance entre moi et toi[a], ainsi qu’entre mon père et ton père. Voici, je t’ai envoyé de l’argent et de l’or. Va, romps ton alliance avec Baasha, roi d’Israël, afin qu’il se retire de moi[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pacte » ou « un traité » (hébreu בְּרִית) ; le contexte est celui d’un accord politique entre rois.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et qu’il monte de dessus moi » ; dans ce contexte, l’expression signifie probablement que Baasha cesse sa pression ou son action militaire contre Asa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: alliance
  rationale: Dans ce contexte diplomatique entre rois, « alliance » exprime naturellement un pacte politique tout en permettant de conserver le même terme aux deux occurrences.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: entre moi et toi, ainsi qu’entre mon père et ton père
  rationale: La formulation garde le parallélisme et la répétition de la relation exprimée par בֵּין, dans un français fluide.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » attire l’attention sur l’envoi annoncé, avec un registre actuel et digne.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: je t’envoie de l’argent et de l’or
  rationale: Dans une lettre accompagnant vraisemblablement le présent, le parfait hébreu se rend naturellement en français par un présent à valeur performative; « argent » conserve aussi ici le sens du métal précieux.
- source_word: לֵךְ הָפֵר
  choice: Va, romps
  rationale: Les deux impératifs sont conservés; « rompre une alliance » est idiomatique et traduit la force causative de הָפֵר.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: ton alliance avec Baasha
  rationale: Le français exprime naturellement cette relation diplomatique au moyen de « avec ».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Traduction directe du titre royal.
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: afin qu’il se retire de moi
  rationale: L’expression littérale « monter de dessus moi » désigne ici la cessation de la pression ou de l’action militaire exercée contre Asa.
