  text: וְ/אָסָ֣א הַ/מֶּ֗לֶךְ לָקַח֙ אֶת כָּל יְהוּדָ֔ה וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֣בֶן בָּ/הֶ֔ם אֶת גֶּ֖בַע וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: fr
  text: Le roi Asa mobilisa tout Juda[a], et ils emportèrent les pierres et le bois de Rama, dont Baasha s’était servi pour bâtir[b] ; Asa les utilisa pour bâtir Guéba et Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prit tout Juda » ; on peut aussi comprendre : « convoqua tout Juda ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les pierres et le bois que Baasha avait employés pour construire Rama.
    reason: clarification
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: mobilisa tout Juda
  rationale: Littéralement « prit tout Juda ». Dans ce contexte, l’expression indique qu’Asa mobilisa la population pour effectuer les travaux; une note conserve le sens littéral et l’alternative « convoqua ».
- source_word: וַיִּשְׂאוּ
  choice: ils emportèrent
  rationale: Le verbe נשׂא exprime ici le transport des matériaux retirés de Rama.
- source_word: אַבְנֵי הָרָמָה וְאֶת עֵצֶיהָ
  choice: les pierres et les bois de Rama
  rationale: Le suffixe de עֵצֶיהָ renvoie à Rama. « Bois » désigne naturellement les matériaux de construction sans imposer la précision « poutres ».
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: dont Baasha s’était servi pour bâtir
  rationale: La relative se rapporte naturellement aux pierres et aux bois employés par Baasha dans ses travaux; cette formulation française rend explicite le rapport instrumental sans préciser dans le corps du texte ce qu’il bâtissait.
- source_word: וַיִּבֶן בָּהֶם
  choice: Asa les utilisa pour bâtir
  rationale: Le singulier renvoie à Asa et le pluriel aux matériaux. La répétition du nom clarifie le changement de sujet après « ils », tandis que « utilisa pour bâtir » rend naturellement l’instrumental בָּהֶם.
- source_word: גֶּבַע
  choice: Guéba
  rationale: Transcription française courante du nom de lieu.
- source_word: הַמִּצְפָּה
  choice: Mitspa
  rationale: Transcription française courante du nom de lieu; l’article hébreu n’est pas reproduit devant le toponyme.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Mobilisa » explicite l’idiome hébreu selon le contexte, tandis que la note en préserve la forme littérale. Les toponymes suivent des graphies françaises usuelles.
