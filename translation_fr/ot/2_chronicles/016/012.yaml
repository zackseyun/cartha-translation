base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: fr
  text: La trente-neuvième année de son règne, Asa tomba malade des pieds, et sa maladie devint extrêmement grave.[a] Pourtant, même dans sa maladie, il ne chercha pas Yahweh, mais s’adressa aux médecins.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa maladie [alla] jusqu’en haut ». L’expression peut marquer son extrême gravité et pourrait aussi évoquer sa progression vers le haut du corps.'
    reason: ambiguïté_de_l’expression_hébraïque
  - marker: b
    text: 'L’hébreu est elliptique : littéralement, « il ne chercha pas Yahweh, car [il se tourna] vers les médecins ». La construction oppose la recherche de Yahweh au recours aux médecins, sans énoncer une condamnation générale des soins médicaux.'
    reason: ellipse_lexicale_et_portée_théologique
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: tomba malade
  rationale: Le verbe חלה exprime le fait de devenir faible ou malade. « Tomba malade » est naturel en français moderne et introduit clairement l’affection décrite.
- source_word: בְּרַגְלָיו
  choice: des pieds
  rationale: רֶגֶל peut désigner le pied ou la jambe. Dans cette indication corporelle au pluriel, « des pieds » rend directement le sens le plus courant sans préciser une pathologie absente du texte.
- source_word: עַד לְמַעְלָה חָלְיוֹ
  choice: sa maladie devint extrêmement grave
  rationale: L’expression inhabituelle, littéralement liée à l’idée d’aller « jusqu’en haut », fonctionne vraisemblablement comme une intensification. La traduction principale exprime donc l’extrême gravité, tandis qu’une note conserve la formulation concrète et son ambiguïté possible.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: sa maladie / dans sa maladie
  rationale: La répétition de « maladie » reproduit le lien lexical de l’hébreu. « Même dans sa maladie » reste proche de la formulation source tout en étant intelligible.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: ne rechercha pas Yahweh
  rationale: דרשׁ peut signifier chercher, consulter ou s’enquérir auprès de Dieu. « Rechercher Yahweh » conserve la portée relationnelle et religieuse du verbe, au-delà d’une simple demande de guérison.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: כִּי בָּרֹפְאִים
  choice: mais s’adressa aux médecins
  rationale: La proposition hébraïque est elliptique, littéralement « mais/car auprès des médecins ». L’ajout contextuel de « s’adressa » rend le contraste compréhensible en français sans affirmer que le recours aux médecins serait mauvais en soi.
theological_decisions:
- issue: Le texte condamne-t-il les soins médicaux eux-mêmes ou le fait qu’Asa n’ait pas recherché Yahweh ?
  choice: La traduction maintient le contraste entre l’absence de recherche de Yahweh et le recours d’Asa aux médecins, sans condamner en général la médecine.
  alternative: Comprendre le verset comme une interdiction ou une condamnation absolue de tout recours aux médecins.
  rationale: L’hébreu critique explicitement le fait qu’Asa n’a pas recherché Yahweh et lui oppose les médecins. Il ne formule toutefois aucune règle générale sur la légitimité des soins médicaux.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition de « maladie » et le contraste abrupt du texte hébreu, tout en explicitant juste assez la proposition elliptique finale pour qu’elle soit naturelle en français.
