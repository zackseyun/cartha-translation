source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: fr
  text: Ben-Hadad écouta le roi Asa et envoya les chefs de ses armées contre les villes d’Israël. Ils frappèrent Iyôn, Dan, Abel-Maïm[a], ainsi que toutes les villes-entrepôts de Nephtali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « Abel-Maïm »; certains identifient cette ville à Abel-Beth-Maaka, connue par les passages parallèles.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écouta
  rationale: Dans ce contexte, le verbe exprime une écoute suivie d’effet. « Écouta » conserve cette nuance sans aller jusqu’au sens plus fort d’« obéit ».
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: les chefs de ses armées
  rationale: שָׂרֵי désigne des chefs militaires, tandis que הַחֲיָלִים renvoie aux forces armées; אֲשֶׁר לוֹ marque leur appartenance à Ben-Hadad.
- source_word: עָרֵי יִשְׂרָאֵל
  choice: les villes d’Israël
  rationale: Traduction directe de la désignation géographique et politique des villes du royaume du Nord.
- source_word: וַיַּכּוּ
  choice: ils frappèrent
  rationale: Le verbe נכה, fréquent dans les récits militaires, peut signifier frapper, attaquer ou vaincre. « Frappèrent » en préserve la force et une certaine largeur sémantique.
- source_word: עִיּוֹן
  choice: Iyôn
  rationale: Translittération française du nom de lieu hébreu.
- source_word: אָבֵל מָיִם
  choice: Abel-Maïm
  rationale: La traduction suit directement le texte hébreu massorétique sans l’harmoniser avec le nom rencontré dans les passages parallèles.
- source_word: מִסְכְּנוֹת
  choice: villes-entrepôts
  rationale: Le terme désigne des lieux urbains servant au stockage de provisions ou de ressources. « Villes-entrepôts » est clair, concis et adapté au contexte.
- source_word: עָרֵי נַפְתָּלִי
  choice: de Nephtali
  rationale: La chaîne construite indique que ces villes-entrepôts appartiennent au territoire de Nephtali.
