  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: fr
  text: Car les yeux de Yahweh parcourent toute la terre afin de se montrer puissants en faveur de ceux dont le cœur est tout entier tourné vers lui[a]. En cela, tu as agi de façon insensée ; désormais, tu connaîtras des guerres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin de soutenir puissamment ceux dont le cœur est tout entier tourné vers lui ». Litt. : « dont le cœur est entier envers lui » ; aussi : « irréprochable envers lui ».'
    reason: La construction peut exprimer soit la manifestation de la force de Yahweh en faveur de ces personnes, soit son soutien puissant. « Entier » évoque une fidélité sans partage, sans nécessairement affirmer une perfection morale.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et préserve sa valeur d’alliance.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: les yeux de Yahweh parcourent
  rationale: Conserve l’image anthropomorphique et exprime naturellement le mouvement actif du participe hébreu.
- source_word: בְּכָל הָאָרֶץ
  choice: toute la terre
  rationale: Le propos a ici une portée générale et universelle plutôt qu’une référence limitée au pays de Juda.
- source_word: לְהִתְחַזֵּק עִם
  choice: afin de soutenir puissamment
  rationale: Rend la finalité de l’action et la force du verbe réfléchi, tout en explicitant sa valeur favorable envers les personnes visées.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: ceux dont le cœur est tout entier tourné vers lui
  rationale: Exprime une loyauté entière et sans partage, sans suggérer une perfection morale absolue.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: En cela, tu as agi de façon insensée
  rationale: Formulation française actuelle qui conserve la vigueur de la réprimande prophétique.
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: désormais, tu connaîtras des guerres
  rationale: Rend idiomatiquement la construction existentielle hébraïque et sa portée future introduite par « désormais ».
theological_decisions:
- issue: Sens de שָׁלֵם appliqué au cœur
  choice: une loyauté entière et sans partage envers Yahweh
  alternative: un cœur irréprochable ou parfait devant lui
  rationale: Dans le contexte, le contraste porte sur la confiance et la fidélité envers Yahweh, non sur une absence absolue de péché.
- issue: Sujet bénéficiaire ou manifestation de force dans לְהִתְחַזֵּק עִם
  choice: Yahweh soutient puissamment les personnes concernées
  alternative: Yahweh se montre puissant en leur faveur
  rationale: La construction permet les deux nuances. Le texte principal privilégie un français naturel à valeur bénéficiaire, tandis que la note conserve la lecture plus réflexive.
- issue: Portée de הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: La formulation présente une maxime de portée universelle sur le regard de Yahweh.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement conserve l’adresse personnelle au roi Asa. La formulation garde l’image concrète des yeux divins et évite aussi bien l’archaïsme que l’idée d’une perfection sans péché.
