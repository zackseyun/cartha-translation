  text: וַ/יִּשְׁכַּ֥ב אָסָ֖א עִם אֲבֹתָ֑י/ו וַ/יָּ֕מָת בִּ/שְׁנַ֛ת אַרְבָּעִ֥ים וְ/אַחַ֖ת לְ/מָלְכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: fr
  text: Asa se coucha avec ses pères[a] et mourut dans la quarante et unième année de son règne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères ». Formule hébraïque traditionnelle désignant la mort et le fait de rejoindre ses ancêtres.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Conserve l’image concrète de l’hébreu et la formule funéraire traditionnelle, sans supprimer la répétition voulue avec « mourut ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: Dans cette formule royale, אבות désigne les pères au sens de la lignée ancestrale. « Ancêtres » est clair en français moderne et évite de limiter le sens aux seuls parents immédiats.
- source_word: וַיָּמָת
  choice: mourut
  rationale: Rend explicitement le verbe מות. La déclaration directe est maintenue après l’expression idiomatique, comme en hébreu.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: dans la quarante et unième année
  rationale: Formulation française naturelle de la date de règne exprimée en hébreu par les nombres quarante et un.
- source_word: לְמָלְכוֹ
  choice: de son règne
  rationale: Équivalent idiomatique français de la période pendant laquelle Asa exerçait la royauté.
- source_word: אָסָא
  choice: Asa
  rationale: Transcription française courante du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. L’expression imagée de l’hébreu est conservée dans le texte, tandis que « ancêtres » communique plus clairement qu’il s’agit de la lignée familiale. La répétition entre la formule idiomatique et « mourut » est volontairement maintenue.
