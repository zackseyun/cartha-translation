source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: fr
  text: La trente-sixième année du règne d’Asa[a], Baasha, roi d’Israël, monta contre Juda et bâtit Rama, afin d’empêcher quiconque de sortir ou d’entrer auprès d’Asa, roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « la trente-sixième année du règne d’Asa ». Cette indication crée une tension chronologique avec la datation du règne de Baasha dans 1 Rois. Certains comptent les années depuis la division du royaume ; d’autres proposent une correction du texte visant à harmoniser la chronologie.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ
  choice: La trente-sixième année
  rationale: Le syntagme temporel introduit par ב se rend naturellement en français par « La trente-sixième année ».
- source_word: לְמַלְכוּת אָסָא
  choice: du règne d’Asa
  rationale: מַלְכוּת désigne ici la période du règne ou de l’exercice de la royauté.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: monta contre Juda
  rationale: Cette formulation conserve l’image hébraïque de la montée tout en exprimant clairement une action hostile.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: et bâtit Rama
  rationale: בנה signifie d’abord « bâtir ». Le contexte peut évoquer des travaux de fortification, mais le texte ne l’explicite pas.
- source_word: לְבִלְתִּי תֵּת
  choice: afin d’empêcher quiconque
  rationale: La construction exprime un but négatif. En français actuel, « afin d’empêcher » en restitue clairement la valeur.
- source_word: יוֹצֵא וָבָא
  choice: de sortir ... ou d’y entrer
  rationale: Le couple verbal désigne les mouvements de sortie et d’entrée; la formulation française en conserve les deux pôles.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: de chez Asa, roi de Juda, ou d’y entrer
  rationale: Le ל marque ici la relation ou la direction. « De chez ... ou d’y entrer » rend explicitement l’accès à Asa dans les deux sens, implicite dans le couple « sortir et entrer ».
theological_decisions:
- issue: Tension chronologique avec la durée du règne de Baasha selon 1 Rois
  choice: Conserver dans le texte « la trente-sixième année du règne d’Asa »
  alternative: Compter depuis la division du royaume, ou lire « la vingt-sixième année » par correction harmonisante
  rationale: Le texte massorétique porte sans ambiguïté « la trente-sixième année ... du règne d’Asa ». La difficulté chronologique doit être signalée plutôt que corrigée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms suivent les formes bibliques françaises usuelles « Baasha » et « Rama ». La syntaxe évite un calque obscur tout en conservant l’image de la montée militaire et la tension chronologique du texte hébreu.
