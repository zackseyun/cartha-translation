  to: La trente-sixième année du règne d’Asa[a], Baasha, roi d’Israël, monta contre Juda et bâtit Rama, afin d’empêcher quiconque de sortir ou d’entrer auprès d’Asa, roi de Juda.
  rationale: La révision remplace l’expression interprétative « de chez Asa ... d’y entrer » par « sortir ou entrer auprès d’Asa ». Elle conserve ainsi le couple verbal hébreu, maintient la relation à Asa indiquée par לְ, et ne suppose pas que Rama visait exclusivement l’accès à la résidence du roi. La note est conservée, avec une ponctuation française harmonisée.
