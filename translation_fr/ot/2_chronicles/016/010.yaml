revisions:
- from: Alors Asa se mit en colère contre le voyant et le fit mettre dans la maison des entraves[a], car il était furieux contre lui à cause de cela. À cette même époque, Asa écrasa aussi certains membres du peuple[b].
  to: Alors Asa se mit en colère contre le voyant et le fit mettre en prison[a], car il était furieux contre lui à cause de cela. À cette époque-là, Asa opprima certains membres du peuple[b].
  rationale: La révision supprime les ajouts sémantiques (« même », « aussi »), emploie une désignation française naturelle du lieu de détention tout en conservant l’ambiguïté lexicale en note, et rend le verbe violent רצץ par « opprima », avec ses alternatives plus imagées ou explicites en note.
