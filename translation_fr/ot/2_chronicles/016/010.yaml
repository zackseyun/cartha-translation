base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: fr
  text: Alors Asa se mit en colère contre le voyant et le fit mettre en prison[a], car il était furieux contre lui à cause de cela. À cette époque-là, Asa opprima certains membres du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la maison des entraves » ou « dans la maison du carcan » ; l’expression hébraïque, difficile, semble désigner un lieu de détention associé à des entraves.
    reason: lexical_alternative
  - marker: b
    text: Ou « écrasa » ou « maltraita violemment » ; le verbe hébreu signifie littéralement « écraser » et peut évoquer de violents sévices.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: se mit en colère
  rationale: Le verbe כעס exprime ici l’entrée d’Asa dans un état de colère; cette tournure française rend naturellement la progression narrative.
- source_word: הָרֹאֶה
  choice: le voyant
  rationale: רֹאֶה est l’ancienne désignation précise d’un homme qui reçoit des révélations; « voyant » conserve cette distinction sans généraliser en « prophète ».
- source_word: וַיִּתְּנֵהוּ
  choice: le fit mettre
  rationale: Avec un lieu de destination, נתן signifie placer ou mettre quelqu’un quelque part. La formulation française convient à l’ordre donné par un roi sans ajouter de détail absent du texte.
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: la maison des entraves
  rationale: L’expression difficile désigne vraisemblablement un lieu de détention associé à un dispositif de contrainte. Ce choix garde l’image de בֵּית et la spécificité probable de מַהְפֶּכֶת.
- source_word: בְזַעַף עִמּוֹ
  choice: il était furieux contre lui
  rationale: זַעַף indique une vive colère ou fureur dirigée ici contre le voyant; la formulation est forte, naturelle et digne.
- source_word: עַל זֹאת
  choice: à cause de cela
  rationale: La locution renvoie causalement au reproche prophétique qui vient d’être formulé.
- source_word: וַיְרַצֵּץ
  choice: écrasa
  rationale: Le piel de רצץ porte une image violente de broyage ou d’écrasement. « Écrasa » préserve cette force et laisse ouverte la forme exacte des sévices, explicitée en note.
- source_word: מִן הָעָם
  choice: certains membres du peuple
  rationale: 'Le מִן est partitif: Asa ne maltraite pas nécessairement tout le peuple, mais certaines personnes parmi lui.'
- source_word: בָּעֵת הַהִיא
  choice: à cette même époque
  rationale: Cette expression temporelle rattache les sévices à la période de l’affrontement avec le voyant.
