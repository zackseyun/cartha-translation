base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: fr
  text: 'Alors le roi d’Israël dit : « Prenez Michée et ramenez-le à Amon, le gouverneur de la ville[a], et à Joas, fils du roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le commandant de la ville ». Le titre hébreu peut désigner un responsable civil ou militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Traduction directe du groupe nominal hébreu. Le contexte permet d’identifier Achab, mais le texte emploie ici son titre.
- source_word: קְחוּ
  choice: Prenez
  rationale: L’impératif de לקח signifie couramment « prendre ». « Saisissez » renforcerait indûment l’idée de contrainte.
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et largement reconnue de ce nom biblique.
- source_word: וַהֲשִׁיבֻהוּ
  choice: ramenez-le
  rationale: Le hiphil de שוב exprime ici l’action de faire revenir quelqu’un. « Ramenez-le » est idiomatique et conserve l’idée de retour.
- source_word: אָמ֣וֹן
  choice: Amôn
  rationale: Transcription française du nom propre hébreu, avec accent circonflexe pour distinguer la voyelle longue dans la forme usuelle.
- source_word: שַׂר הָעִיר
  choice: le gouverneur de la ville
  rationale: שַׂר peut désigner un dirigeant civil, un haut fonctionnaire ou un commandant. Dans ce contexte urbain, « gouverneur » rend clairement la fonction sans exclure totalement une autorité militaire.
- source_word: וְאֶל יוֹאָשׁ
  choice: et à Joas
  rationale: La répétition de אֶל présente Joas comme le second responsable auquel Michée doit être ramené.
- source_word: בֶּן הַמֶּלֶךְ
  choice: fils du roi
  rationale: Cette traduction conserve la formulation relationnelle explicite de l’hébreu sans la remplacer par le terme plus interprétatif « prince ».
