base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: fr
  text: 'Achab, roi d’Israël, dit à Josaphat, roi de Juda : « Iras-tu avec moi à Ramoth en Galaad ? » Josaphat lui répondit : « Je suis comme toi, et mon peuple comme ton peuple[a], et avec toi au combat[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus idiomatiquement : « ton peuple est mon peuple ». L’hébreu emploie littéralement une comparaison : « et comme ton peuple, mon peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est elliptique en hébreu, littéralement : « et avec toi dans la guerre ». Le sujet et le verbe restent sous-entendus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Iras-tu avec moi
  rationale: La tournure interrogative avec הלך et עִם demande directement si Josaphat accompagnera Achab. « Iras-tu avec moi » conserve le verbe de mouvement et convient au registre narratif.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française usuelle identifie Ramoth comme une localité située en Galaad, tout en translittérant le nom propre.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Je suis comme toi
  rationale: La formule comparative exprime la solidarité et la parité. Cette traduction reste proche de la structure hébraïque sans surinterpréter l’engagement.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: et mon peuple comme ton peuple
  rationale: La proposition hébraïque est nominale et compacte. Le français conserve le parallélisme ainsi que la comparaison, plutôt que de la transformer en identification absolue.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: et avec toi dans la guerre
  rationale: L’hébreu ne comporte ici ni verbe ni sujet exprimé. Une ellipse compréhensible en français préserve cette indétermination au lieu d’ajouter « je suis », « nous sommes » ou un futur.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: dit ... répondit
  rationale: Le premier אמר est rendu littéralement. Dans la seconde occurrence, « répondit » explicite naturellement la fonction du discours dans l’échange, sans modifier son contenu.
theological_decisions:
- issue: Portée de l’engagement final
  choice: 'Maintenir l’ellipse : « et avec toi dans la guerre »'
  alternative: « et je suis avec toi dans la guerre » ou « et nous serons avec toi dans la guerre »
  rationale: Le texte hébreu ne précise ni le sujet ni le temps verbal. Garder l’ellipse évite de décider si Josaphat parle de lui seul, de son peuple avec lui, ou de leur engagement futur.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent les formes françaises courantes « Achab », « Josaphat », « Juda » et « Galaad ». L’ellipse finale, inhabituelle mais intelligible, est conservée afin de respecter l’ambiguïté grammaticale du texte source.
