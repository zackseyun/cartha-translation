base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: fr
  text: Ce jour-là, la bataille s’intensifia. Le roi d’Israël se tenait debout dans son char, face aux Araméens, jusqu’au soir. Il mourut au moment du coucher du soleil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque le soleil se couchait ».'
    reason: Variante plus verbale de l’expression temporelle hébraïque.
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: la bataille s’intensifia
  rationale: Le verbe עלה signifie littéralement « monter », mais, avec « la bataille » pour sujet, il décrit ici l’intensification du combat. Cette formulation restitue naturellement l’expression idiomatique hébraïque.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle courante, rendue en français moderne sans alourdir la phrase.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Traduction directe de la construction hébraïque.
- source_word: הָיָה מַעֲמִיד
  choice: resta debout
  rationale: La construction avec היה et un participe exprime une situation continue. Le hiphil de עמד peut évoquer le fait de maintenir quelqu’un ou de se maintenir debout ; « resta debout » conserve l’idée centrale sans préciser au-delà du texte comment le roi fut maintenu dans cette position.
- source_word: בַּמֶּרְכָּבָה
  choice: sur son char
  rationale: En français, on se tient naturellement « sur » un char. Le possessif, implicite dans le contexte, évite la tournure moins naturelle « sur le char ».
- source_word: נֹכַח אֲרָם
  choice: face aux Araméens
  rationale: נֹכַח indique une position en face de l’adversaire. Dans ce contexte militaire, אֲרָם désigne les forces d’Aram ; « les Araméens » est plus clair en français que « face à Aram » tout en conservant le nom historique.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Rendu direct et idiomatique de la limite temporelle.
- source_word: וַיָּמָת
  choice: Il mourut
  rationale: Le verbe fait progresser le récit de manière sobre et directe. Une nouvelle phrase donne une ponctuation française naturelle sans modifier le lien narratif.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: au moment où le soleil se couchait
  rationale: La formulation conserve l’indication temporelle explicite et l’image verbale de la venue du soleil à son coucher, dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le récit reste direct, avec un vocabulaire accessible. La traduction préserve la durée de la posture du roi et l’expression imagée du coucher du soleil sans ajouter de détail sur sa blessure ou sur la manière dont il fut maintenu debout.
