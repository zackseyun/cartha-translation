source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּב֛וֹא חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: fr
  text: 'Michée répondit : « Tu le verras bien, le jour où tu iras de pièce en pièce[a] pour te cacher. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une pièce dans une pièce ». L’expression peut aussi désigner une pièce intérieure, très retirée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Le verbe signifie littéralement « dit », mais il introduit ici la réponse directe de Michée à la question précédente ; « répondit » explicite naturellement ce lien en français.
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française courante du nom biblique.
- source_word: הִנְּךָ רֹאֶה
  choice: Tu le verras bien
  rationale: La construction avec הִנֵּה et le participe attire l’attention et annonce avec assurance ce que l’interlocuteur constatera. « bien » restitue cette insistance sans employer l’archaïsant « voici ».
- source_word: בַּיּוֹם הַהוּא אֲשֶׁר
  choice: le jour où
  rationale: Rend de façon concise et idiomatique l’expression temporelle « en ce jour-là, lorsque ».
- source_word: תָּבוֹא
  choice: tu iras
  rationale: Le verbe de mouvement introduit ici l’entrée ou le déplacement vers les pièces où l’homme cherchera refuge.
- source_word: חֶדֶר בְּחֶדֶר
  choice: de pièce en pièce
  rationale: Cette formulation française conserve la répétition et l’idée possible d’un déplacement à travers plusieurs pièces, tout en signalant en note l’autre compréhension, celle d’une pièce intérieure ou très retirée.
- source_word: לְהֵחָבֵא
  choice: pour te cacher
  rationale: L’infinitif nifal exprime le but et a ici un sens réfléchi, naturellement rendu par « te cacher ».
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. L’insistance prophétique est rendue par « Tu le verras bien », tandis que la tournure hébraïque ambiguë concernant les pièces est conservée dans le texte et explicitée en note.
