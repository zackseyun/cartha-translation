  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: fr
  text: 'Le roi d’Israël rassembla donc les prophètes, quatre cents hommes, et leur demanda : « Devons-nous aller à Ramoth en Galaad pour combattre, ou dois-je y renoncer ? » Ils répondirent : « Monte, et Dieu la livrera entre les mains du roi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main du roi ». L’hébreu dit « du roi » sans préciser davantage de quel roi il s’agit.'
    reason: La note signale l’idiome hébraïque et l’indétermination authentique du référent.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: Le verbe קבץ signifie couramment « rassembler » ; ce choix est naturel en français et exprime clairement la convocation du groupe.
- source_word: הַנְּבִאִים
  choice: les prophètes
  rationale: C’est le terme français usuel et direct pour נביאים, sans paraphrase interprétative.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: quatre cents hommes
  rationale: Le nom אִישׁ est explicitement présent après le nombre ; « hommes » en conserve la formulation.
- source_word: הֲנֵלֵךְ
  choice: Devons-nous aller
  rationale: La forme interrogative est à la première personne du pluriel ; cette tournure actuelle rend la consultation du roi.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française traditionnelle et intelligible rend le toponyme composé sans le confondre avec une expression commune.
- source_word: לַמִּלְחָמָה
  choice: combattre
  rationale: L’infinitif français rend naturellement l’idée de but militaire exprimée par la préposition et le nom « guerre/bataille ».
- source_word: אִם אֶחְדָּל
  choice: ou dois-je y renoncer
  rationale: Le passage du pluriel dans la première question au singulier dans la seconde est conservé. « Y » reprend l’expédition envisagée.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה signifie littéralement « monte » et peut désigner une marche militaire ; le choix conserve cette image sans expliciter davantage.
- source_word: וְיִתֵּן
  choice: la livrera
  rationale: Le verbe נתן signifie « donner » et, dans ce contexte militaire, « livrer ». Le pronom féminin reprend naturellement la ville de Ramoth.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le verbe au singulier indique ici un référent singulier ; « Dieu » convient au contexte.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: au pouvoir du roi
  rationale: L’expression hébraïque « dans la main de » est un idiome de domination ou de contrôle. Cette formulation française en communique clairement le sens.
theological_decisions:
- issue: Référent de « le roi » dans la réponse des prophètes
  choice: Conserver l’expression indéterminée « du roi »
  alternative: Préciser « en ton pouvoir » ou « au pouvoir du roi d’Israël »
  rationale: L’hébreu porte simplement הַמֶּלֶךְ, « le roi », contrairement à une formulation qui désignerait explicitement l’interlocuteur. La traduction ne tranche donc pas plus que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le changement de personne entre « devons-nous » et « dois-je », ainsi que l’impératif imagé « Monte ». Le marqueur [a] figure dans le texte principal.
