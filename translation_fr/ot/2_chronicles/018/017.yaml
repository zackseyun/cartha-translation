source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: fr
  text: 'Alors le roi d’Israël dit à Josaphat : « Ne t’avais-je pas dit qu’il ne prophétiserait à mon sujet rien de bon, mais seulement du mal[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais seulement le malheur » ; le terme hébreu peut désigner ici ce qui est mauvais, nuisible ou funeste.'
    reason: Précision lexicale sur רָע, qui conserve une portée plus large que le seul mal moral.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession des événements en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Cette formulation directe rend fidèlement la chaîne construite et correspond à la désignation narrative habituelle.
- source_word: אֶל יְהוֹשָׁפָט
  choice: à Josaphat
  rationale: La préposition désigne le destinataire des paroles. Le texte hébreu emploie le nom sans ajouter de titre.
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: Ne t’avais-je pas dit
  rationale: הֲלֹא introduit une question rhétorique qui appelle l’assentiment. Le plus-que-parfait français convient puisque le roi rappelle une parole antérieure à la scène présente.
- source_word: לֹא יִתְנַבֵּא
  choice: qu’il ne prophétiserait
  rationale: Après le verbe de parole au passé, le conditionnel exprime naturellement en français le futur envisagé depuis ce moment passé.
- source_word: עָלַי
  choice: à mon sujet
  rationale: La préposition עַל indique ici ce sur quoi porte la prophétie, sans suggérer que celle-ci serait prononcée en faveur du roi.
- source_word: טוֹב
  choice: rien de bon
  rationale: L’adjectif substantivé désigne ici une annonce favorable. « Rien de bon » est idiomatique en français et maintient le contraste avec « du mal ».
- source_word: כִּי אִם
  choice: mais seulement
  rationale: 'L’expression marque une restriction fortement contrastive : rien de bon, uniquement son contraire.'
- source_word: לְרָע
  choice: du mal
  rationale: Ce choix conserve l’antithèse concise entre טוֹב et רָע, tout en laissant le contexte montrer qu’il s’agit d’annonces défavorables ou funestes.
theological_decisions:
- issue: Nature du message prophétique annoncé
  choice: « rien de bon, mais seulement du mal »
  alternative: « rien de favorable, mais seulement le malheur »
  rationale: Le roi se plaint du caractère constamment défavorable des prophéties de Michée à son égard ; il ne formule pas ici une thèse sur le mal moral. La traduction retenue préserve néanmoins l’antithèse ouverte du texte hébreu sans la réduire à une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe entre les deux rois dans ce cadre narratif. La formulation garde la force de la question rhétorique et l’opposition concise de l’hébreu.
