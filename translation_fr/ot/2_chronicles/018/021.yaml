  naturalness: Le français est moderne, clair et d’un registre narratif soutenu sans archaïsme excessif. « Il répondit » est justifié par le contexte dialogique immédiat, et l’explicitation de « L’Éternel » au second énoncé évite une ambiguïté française sans changer le sens contextuel.
