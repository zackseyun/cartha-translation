source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: fr
  text: 'Il répondit : « Je sortirai et je deviendrai un esprit de mensonge dans la bouche de tous ses prophètes[a]. » L’Éternel lui dit : « Tu le séduiras, et tu réussiras aussi[b]. Sors et fais ainsi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit trompeur dans la bouche de tous ses prophètes ».'
    reason: Alternative lexicale pour רוּחַ שֶׁקֶר, qui peut désigner un esprit caractérisé par le mensonge ou la tromperie.
  - marker: b
    text: 'Ou : « tu en seras capable ».'
    reason: יכל peut exprimer la capacité; dans ce contexte, cette capacité implique que l’entreprise aboutira.
lexical_decisions:
- source_word: אֵצֵא
  choice: Je sortirai
  rationale: Le qal à la première personne exprime l’action projetée et conserve le mouvement de יצא, repris ensuite par l’impératif.
- source_word: וְהָיִיתִי לְרוּחַ שֶׁקֶר
  choice: et je deviendrai un esprit de mensonge
  rationale: « Deviendrai » rend naturellement la prise d’un nouveau rôle suggérée par היה avec le prédicat introduit par לְ; « esprit de mensonge » conserve la construction hébraïque et son caractère.
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: dans la bouche de tous ses prophètes
  rationale: Cette formulation préserve l’image concrète de la bouche comme lieu de la parole et le caractère exhaustif de כָּל.
- source_word: תְּפַתֶּה
  choice: Tu le séduiras
  rationale: Le piel de פתה désigne ici une action persuasive à visée trompeuse. Le complément « le » est implicite en hébreu et nécessaire en français.
- source_word: וְגַם תּוּכָל
  choice: et tu réussiras aussi
  rationale: יכל exprime ici non une simple capacité, mais l’efficacité attendue de la mission; « réussiras » évite l’idée indue d’un adversaire à vaincre.
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: Sors et fais ainsi
  rationale: Les impératifs conservent l’écho de יצא et rendent directement l’ordre d’agir de cette manière.
theological_decisions:
- issue: L’autorisation divine d’une mission trompeuse dans la vision
  choice: Rendre directement l’ordre qui approuve la mission, sans atténuer le mensonge ni la réussite annoncée.
  alternative: Employer une paraphrase plus faible qui réduirait l’implication divine.
  rationale: L’hébreu présente sans détour le projet de l’esprit puis son autorisation. La traduction doit conserver cette tension théologique plutôt que la résoudre.
- issue: Identification du second locuteur
  choice: L’Éternel lui dit
  alternative: Il dit
  rationale: Le sujet est identifiable dans le contexte immédiat de la vision; l’explicitation évite en français une ambiguïté artificielle entre l’esprit et le Seigneur, sans modifier le rôle narratif.
translation_notes:
  register: Français international moderne, digne et lisible. Le discours direct garde la répétition et la force sobre de la scène. « L’Éternel » explicite le locuteur divin indiqué par le contexte; les images hébraïques de la sortie et de la bouche sont conservées.
