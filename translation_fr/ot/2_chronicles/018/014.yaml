base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: fr
  text: 'Il arriva auprès du roi, et le roi lui dit : « Michée, devons-nous aller combattre à Ramoth en Galaad, ou dois-je y renoncer ? » Il répondit : « Montez, et vous réussirez ! Ils seront livrés entre vos mains. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: D’après le contexte, la réponse de Michée est probablement ironique ou sarcastique ; toutefois, l’hébreu ne signale pas explicitement cette ironie.
    reason: Préciser une nuance contextuelle sans l’introduire directement dans le texte traduit.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il arriva
  rationale: Le wayyiqtol de בוא fait progresser le récit. « Il arriva » rend naturellement cette succession narrative sans alourdir la phrase.
- source_word: מִיכָה
  choice: Michée
  rationale: « Michée » est la forme française traditionnelle et bien établie du nom du prophète, fils de Yimla, dans ce récit.
- source_word: הֲנֵלֵךְ
  choice: devons-nous aller
  rationale: La forme interrogative à la première personne du pluriel exprime une délibération. « Devons-nous aller » est naturel en français et conserve cette nuance.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française usuelle identifie clairement la ville située en Galaad.
- source_word: לַמִּלְחָמָה
  choice: combattre
  rationale: La préposition ל exprime ici le but. L’infinitif « combattre » rend en français courant l’idée d’aller à la guerre.
- source_word: אִם אֶחְדָּל
  choice: ou dois-je y renoncer
  rationale: חדל signifie cesser, s’abstenir ou renoncer. La première personne du singulier est conservée après le pluriel « devons-nous », sans harmoniser le changement de nombre.
- source_word: עֲלוּ
  choice: Montez
  rationale: L’impératif pluriel de עלה désigne le mouvement vers le lieu de la campagne. « Montez » conserve l’image spatiale et militaire de l’hébreu.
- source_word: וְהַצְלִיחוּ
  choice: et vous réussirez
  rationale: Le hifil de צלח exprime la réussite. Cette formulation française est naturelle tout en maintenant le sens positif apparent de la réponse.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: Ils seront livrés entre vos mains
  rationale: Le nifal pluriel de נתן est rendu au passif, sans expliciter son sujet implicite. « Entre vos mains » transmet l’idiome hébreu qui signifie être placé au pouvoir de quelqu’un, et le pluriel « vos » correspond à l’adresse aux deux rois.
theological_decisions:
- issue: Le caractère ironique ou sarcastique de la première réponse de Michée
  choice: Conserver dans le texte principal la formulation positive de surface
  alternative: Signaler explicitement l’ironie par un adverbe ou une reformulation sarcastique
  rationale: Le contexte montre que cette réponse n’est probablement pas une approbation sincère, mais l’hébreu ne marque pas grammaticalement l’ironie. Le texte principal préserve donc l’ambiguïté, tandis que la note en informe le lecteur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le passage notable du « nous » au « je » dans la question du roi. La réponse garde son sens littéralement favorable afin que l’ironie ressorte du contexte plutôt que d’une interprétation ajoutée.
