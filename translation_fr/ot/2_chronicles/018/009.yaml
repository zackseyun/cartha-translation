    rationale: « Siéger » peut évoquer une fonction officielle ou délibérative non explicitée. « Étaient installés » conserve la localisation et la répétition scénique sans ajouter cette nuance.
  - severity: low
    issue: « tandis que tous les prophètes »
    rationale: La conjonction ו coordonne la proposition relative aux prophètes; « et » reflète cette coordination sans faire de l’activité prophétique un simple arrière-plan subordonné.
