translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée en deux phrases pour éviter l’accumulation de participes et de coordinations de l’hébreu, sans retrancher les éléments de la scène. Aucun marqueur de note n’est nécessaire.
