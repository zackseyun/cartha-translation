  to: Le roi d’Israël et Josaphat, roi de Juda, étaient assis, chacun sur son trône, vêtus d’habits, et installés sur l’aire de battage, à l’entrée de la porte de Samarie; tous les prophètes prophétisaient devant eux.
  rationale: Révision limitée pour éviter une nuance institutionnelle ajoutée par « siégeaient » et conserver la coordination de la dernière proposition. Aucun problème d’ancrage de note ne se pose.
