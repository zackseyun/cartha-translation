  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: fr
  text: Le roi d’Israël et Josaphat, roi de Juda, étaient assis, chacun sur son trône, vêtus d’habits, et installés sur l’aire de battage, à l’entrée de la porte de Samarie; tous les prophètes prophétisaient devant eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Le roi d’Israël
  rationale: Le waw coordonne cette scène au récit précédent; en français, la continuité narrative peut rester implicite sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: et Josaphat, roi de Juda
  rationale: La coordination et l’apposition royale sont conservées dans une formulation française naturelle.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: étaient assis ... Ils siégeaient
  rationale: La répétition hébraïque de ישׁב est conservée quant au sens, mais le second emploi est rendu par « siégeaient » afin d’éviter une lourdeur tout en évoquant la séance officielle des deux rois.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: chacun sur son trône
  rationale: אִישׁ a ici une valeur distributive, et כִּסֵּא désigne naturellement un trône dans ce contexte royal.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: revêtus de leurs habits
  rationale: Cette formulation garde l’expression générale de l’hébreu sans préciser, comme le ferait « habits royaux » ou « robes d’apparat », une qualité que le texte ne nomme pas.
- source_word: בְּגֹרֶן
  choice: sur l’aire de battage
  rationale: Une aire de battage est une surface sur laquelle on se tient; « sur » est donc la préposition locative idiomatique en français.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: à l’entrée de la porte de Samarie
  rationale: La chaîne construite est rendue étroitement, sans identifier abusivement la porte par un nom particulier.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: tandis que tous les prophètes prophétisaient devant eux
  rationale: « Prophétisaient » rend directement l’activité exprimée par le hitpael de נבא; « devant eux » préserve la valeur spatiale et relationnelle de לִפְנֵיהֶם. « Tandis que » exprime la simultanéité naturelle de la scène.
