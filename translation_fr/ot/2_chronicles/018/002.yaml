base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: fr
  text: Au bout de quelques années, il descendit vers Achab, à Samarie. Achab sacrifia pour lui et pour ceux qui l’accompagnaient des moutons et des bovins en abondance, puis il le poussa[a] à monter contre Ramoth-en-Galaad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’incita », « l’entraîna » ou « le séduisit ».
    reason: Le verbe hébreu סות peut exprimer une incitation énergique, voire une séduction ; « poussa » n’en épuise pas toute la nuance.
  - marker: b
    text: Littéralement « vers Ramoth-en-Galaad » ; le contexte indique une expédition militaire contre la ville.
    reason: La préposition hébraïque marque littéralement la direction, tandis que la visée hostile ressort du contexte.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: il descendit
  rationale: Conserve le sens directionnel et topographique de ירד, de Juda vers Samarie, dans un français naturel.
- source_word: לְקֵץ שָׁנִים
  choice: Au bout de quelques années
  rationale: Rend naturellement l’idiome temporel « à la fin d’années » sans préciser un nombre absent de l’hébreu.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: rendre visite à Achab, à Samarie
  rationale: Explicite sobrement la nature de ce déplacement vers Achab et conserve Samarie comme lieu de destination.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Achab fit abattre pour lui
  rationale: זבח désigne ici vraisemblablement l’abattage d’animaux dans le cadre de l’hospitalité royale; « fit abattre » évite d’imposer un sacrifice cultuel explicite.
- source_word: צֹאן וּבָקָר
  choice: des moutons et des bovins
  rationale: Rend les deux catégories animales sans réduire צֹאן aux seules brebis ni בָקָר aux seuls bœufs.
- source_word: לָרֹב
  choice: en abondance
  rationale: Conserve directement l’idée de grande quantité.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: et pour ceux qui l’accompagnaient
  rationale: Formulation française naturelle qui garde עָם assez large, sans identifier nécessairement ces personnes à des soldats.
- source_word: וַיְסִיתֵהוּ
  choice: il le poussa
  rationale: Exprime une forte incitation sans trancher entièrement entre exhortation, séduction et instigation; l’ambiguïté est signalée en note.
- source_word: לַעֲלוֹת
  choice: à monter
  rationale: Préserve le verbe de mouvement עלה et sa valeur directionnelle, tout en laissant le contexte militaire apparaître avec « contre ».
- source_word: אֶל רָמוֹת גִּלְעָד
  choice: contre Ramoth-en-Galaad
  rationale: Dans ce contexte militaire, « contre » communique la visée hostile implicite de la montée; la valeur plus littérale est conservée en note.
