  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: fr
  text: 'Il dit : « Écoutez donc la parole de Yahweh : j’ai vu Yahweh assis sur son trône, et toute l’armée du ciel[a] se tenait à sa droite et à sa gauche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute l’armée céleste » ; plus littéralement : « toute l’armée des cieux ».'
    reason: L’expression hébraïque désigne collectivement la cour céleste tout en conservant l’image d’une armée organisée, sans en identifier explicitement les membres.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Cette expression marque clairement la conséquence tirée de l’échange précédent tout en conservant la force de la transition prophétique.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif est au pluriel et appelle directement l’ensemble des auditeurs à prêter attention à la parole prophétique.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » conserve la formulation prophétique traditionnelle et sa portée canonique, tandis que le nom divin est rendu explicitement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom propre plutôt que remplacé par un titre, conformément à la donnée hébraïque et à la convention indiquée pour ce projet.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé est la manière naturelle, en français moderne, de rapporter la vision reçue par Michée.
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: assis sur son trône
  rationale: La tournure rend directement la posture royale décrite par le participe hébreu, sans expliciter davantage la scène.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: toute l’armée des cieux
  rationale: « Armée » préserve le sens collectif et organisé de צָבָא, tandis que « des cieux » maintient l’expression hébraïque sans identifier explicitement ses membres.
- source_word: עֹמְדִים
  choice: se tenait
  rationale: Le singulier s’accorde naturellement en français avec le collectif « armée » et exprime la posture debout ou en présence devant le trône.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: à sa droite et à sa gauche
  rationale: Cette formulation française naturelle conserve la symétrie spatiale de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans le récit de la vision
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve ici le nom propre conformément à la convention fournie, sans le remplacer par un titre.
- issue: Identification de צְבָא הַשָּׁמַיִם dans la cour céleste
  choice: toute l’armée des cieux
  alternative: toute l’armée céleste ; tous les êtres célestes
  rationale: La traduction retenue conserve l’image militaire ou collective et l’ambiguïté référentielle du texte, sans préciser qu’il s’agit d’anges ou d’autres êtres.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le ton solennel d’une proclamation prophétique sans archaïsmes. Le passé composé convient au récit oral de la vision, et « se tenait » évite une formulation lourde tout en respectant le collectif singulier « armée ».
