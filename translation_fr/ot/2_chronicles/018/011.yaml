  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: fr
  text: 'Et tous les prophètes prophétisaient ainsi, en disant : « Monte à Ramoth en Galaad et remporte la victoire ! Yahweh la livrera[a] entre les mains du roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh l’a livrée entre les mains du roi. » La forme hébraïque peut présenter comme déjà accomplie une victoire future tenue pour certaine.'
    reason: La forme verbale permet soit un futur assuré, soit une formulation dite d’accompli prophétique.
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: Et tous les prophètes
  rationale: Rend la coordination et le sujet collectif sans ajouter de nuance discursive étrangère au texte.
- source_word: נִבְּאִים כֵּן
  choice: prophétisaient de même
  rationale: Le participe exprime une action en cours, tandis que כֵּן indique que tous tenaient le même discours.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule française naturelle pour introduire les paroles rapportées.
- source_word: עֲלֵה רָמֹת גִּלְעָד
  choice: Monte à Ramoth en Galaad
  rationale: Conserve le sens premier de עלה, « monter », et emploie une forme française claire du toponyme.
- source_word: וְהַצְלַח
  choice: et tu remporteras la victoire
  rationale: Dans ce contexte militaire, le verbe signifie réussir; cette formulation française exprime naturellement le succès promis sans rendre l’impératif hébreu par l’étrange « réussis ».
- source_word: וְנָתַן יְהוָה
  choice: Yahweh la livrera
  rationale: Le qatal dans cette déclaration prophétique peut annoncer comme certaine une action à venir. « Livrer » explicite naturellement l’idée de remettre la ville au pouvoir du roi.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: entre les mains du roi
  rationale: Rend l’image idiomatique hébraïque de la remise au pouvoir ou au contrôle de quelqu’un.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Valeur aspectuelle de וְנָתַן dans l’oracle
  choice: la livrera
  alternative: l’a livrée
  rationale: Le contexte vise l’issue future de l’expédition, mais la forme accomplie peut présenter cette issue comme déjà assurée. La traduction principale privilégie le futur naturel en français, et la note conserve l’autre possibilité.
translation_notes:
  register: Français international actuel, clair et digne. « Remporteras la victoire » restitue idiomatiquement le succès militaire; « entre les mains » conserve l’image hébraïque tout en restant naturelle.
