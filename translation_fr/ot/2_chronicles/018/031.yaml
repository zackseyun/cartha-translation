  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: fr
  text: 'Lorsque les chefs des chars virent Josaphat, ils se dirent : « C’est le roi d’Israël[a] ! » Ils se tournèrent contre lui pour combattre. Mais Josaphat poussa un cri, et Yahweh lui vint en aide ; Dieu les détourna de lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lui, c’est le roi d’Israël ! »'
    reason: La phrase nominale hébraïque peut être rendue par une tournure présentative ou par une formulation qui fait ressortir le pronom sujet.
  - marker: b
    text: 'Ou : « Dieu les éloigna de lui. » Le verbe hébreu peut désigner le fait de détourner ou d’écarter quelqu’un d’une cible.'
    reason: Le verbe סות possède ici une nuance de déplacement ou de diversion dont plusieurs formulations françaises rendent le sens.
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Lorsque … virent
  rationale: La formule narrative hébraïque introduit ici la circonstance temporelle. « Lorsque » restitue naturellement sa fonction en français sans l’alourdir par « il arriva que ».
- source_word: שָׂרֵי הָרֶכֶב
  choice: les chefs des chars
  rationale: שָׂרֵי désigne les responsables militaires, et הָרֶכֶב la force de chars. « Chefs des chars » est concis, actuel et garde la référence militaire.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: C’est le roi d’Israël
  rationale: Cette phrase nominale identifie Josaphat comme la cible présumée. La tournure présentative « C’est… » est la plus naturelle dans cette scène, tandis que « Lui, c’est… » reste possible.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: Ils se tournèrent donc contre lui
  rationale: סבב peut exprimer un mouvement vers quelqu’un, voire un encerclement. Le contexte indique une réorientation hostile, sans imposer qu’ils l’aient effectivement encerclé.
- source_word: לְהִלָּחֵם
  choice: pour combattre
  rationale: L’infinitif exprime le but de leur mouvement. « Pour combattre » reste proche de la formulation hébraïque sans ajouter un objet explicite.
- source_word: וַיִּזְעַק
  choice: poussa un cri
  rationale: זעק évoque un cri intense, souvent lancé dans la détresse. Cette traduction conserve l’intensité sans préciser à qui le cri est adressé.
- source_word: וַיהוָה עֲזָרוֹ
  choice: Yahweh lui vint en aide
  rationale: עזר signifie aider ou secourir. « Vint en aide » est naturel en français, et « Yahweh » rend explicitement le nom divin יְהוָה.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Dieu les détourna de lui
  rationale: Le hifil de סות exprime ici le fait de détourner ou d’éloigner les combattants de leur cible. « Détourna » préserve l’action divine et le mouvement loin de Josaphat sans introduire l’idée morale d’une séduction.
theological_decisions:
- issue: Rendu de יְהוָה et אֱלֹהִים dans le même verset
  choice: Yahweh … Dieu
  alternative: le Seigneur … Dieu
  rationale: Le texte emploie successivement le nom propre divin יְהוָה et le titre אֱלֹהִים. Les rendre distinctement respecte cette variation délibérée.
- issue: Destinataire du cri de Josaphat
  choice: Josaphat poussa un cri
  alternative: Josaphat cria vers Yahweh
  rationale: Le texte de ce verset ne précise pas le destinataire du cri. La traduction évite donc de transformer explicitement celui-ci en prière, tout en conservant immédiatement après l’intervention secourable de Yahweh.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent directes et accessibles ; la coordination hébraïque est légèrement structurée par « donc », « mais » et un point-virgule afin de clarifier l’enchaînement sans effacer sa progression.
