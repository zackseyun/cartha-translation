  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: fr
  text: 'Mais Michée répondit : « Aussi vrai que Yahweh est vivant[a], ce que mon Dieu dira, je le dirai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh est vivant : ce que mon Dieu dira, je le dirai. »'
    reason: La note conserve la forme syntaxique de la formule hébraïque de serment et la reprise explicite de son objet.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Michée répondit
  rationale: Le waw consécutif fait progresser le récit, tandis que le contexte marque l’opposition entre l’incitation du messager et la réponse de Michée. « Répondit » est naturel en français dans cet échange.
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et aisément reconnaissable du nom du prophète.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formulation française restitue clairement la force de la formule hébraïque de serment tout en conservant l’affirmation que Yahweh est vivant.
- source_word: כִּי אֵת אֲשֶׁר
  choice: ce que
  rationale: Dans cette construction, כִּי introduit le contenu du serment et אֵת אֲשֶׁר désigne l’objet des deux verbes. « Ce que » en donne une expression française naturelle.
- source_word: יֹאמַר אֱלֹהַי
  choice: mon Dieu me dira
  rationale: Le suffixe de première personne est rendu par « mon ». Le futur français convient à la parole que Dieu donnera dans la situation immédiate; « me » explicite naturellement le destinataire impliqué par le contexte prophétique sans modifier le contenu de la parole.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: je dirai
  rationale: Le pronom objet reprend en hébreu « ce que mon Dieu dira ». En français, cette reprise est déjà portée naturellement par la proposition « ce que »; la répéter alourdirait inutilement la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans la formule de serment
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom personnel tout en laissant intacte la force solennelle du serment.
- issue: Force de חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  alternative: Yahweh est vivant
  rationale: Le contexte et l’usage hébreu indiquent une formule de serment. Le texte principal en exprime la valeur pragmatique, tandis que la note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formulation garde la solennité du serment prophétique sans archaïsme; le contraste avec les paroles du messager au verset précédent est rendu par « Mais ».
