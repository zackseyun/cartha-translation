id: 2CH.18.22
reference: 2 Chronicles 18:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: fr
  text: 'Et maintenant, voici : l’Éternel a mis un esprit de mensonge dans la bouche de tes prophètes que voici, et l’Éternel a annoncé le malheur contre toi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: vois
  rationale: Conserve l’appel direct à l’attention du roi, dans une formulation française brève et naturelle.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rend le tétragramme selon l’usage français biblique traditionnel, tout en le distinguant d’un simple titre.
- source_word: ר֣וּחַ שֶׁ֔קֶר
  choice: un esprit de mensonge
  rationale: Reproduit directement la construction hébraïque sans préciser davantage la nature ou l’identité de l’esprit.
- source_word: נְבִיאֶ֣י/ךָ אֵ֑לֶּה
  choice: tes prophètes que voici
  rationale: Exprime à la fois le possessif adressé au roi et le démonstratif qui désigne les prophètes présents.
- source_word: דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה
  choice: a annoncé le malheur contre toi
  rationale: Dans ce contexte prophétique, « annoncé » restitue naturellement דִּבֶּר, tandis que « le malheur » garde la portée calamiteuse de רָעָה sans suggérer que Dieu commet un mal moral.
theological_decisions:
- issue: L’action divine concernant l’esprit de mensonge
  choice: « l’Éternel a mis un esprit de mensonge »
  alternative: « l’Éternel a permis qu’un esprit de mensonge soit mis »
  rationale: Le texte attribue directement l’action à YHWH avec נָתַן. La traduction ne l’atténue pas en simple permission et préserve ainsi la tension théologique du passage.
- issue: Sens de רָעָה appliqué à l’annonce divine
  choice: « le malheur »
  alternative: « le mal »
  rationale: Ici, רָעָה désigne la calamité annoncée contre le roi. « Malheur » communique ce sens sans trancher la question théologique par une formulation moralement chargée.
translation_notes:
  register: Français moderne, direct et solennel. La syntaxe conserve les deux affirmations coordonnées du texte hébreu et son adresse personnelle au roi.
