base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: fr
  text: 'Le roi d’Israël dit alors à Josaphat : « Je vais me déguiser[a] et aller au combat ; mais toi, porte tes vêtements royaux. » Le roi d’Israël se déguisa donc, puis ils allèrent au combat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une tournure très concise, littéralement « se déguiser et aller ». La suite de la phrase et du récit indique que le roi d’Israël parle de lui-même. La forme peut toutefois aussi se lire comme un impératif : « Déguise-toi » — lecture qui rendrait la phrase difficile dans son contexte immédiat.'
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Je vais me déguiser
  rationale: La forme hébraïque, identique en apparence à un impératif mais employée ici dans une tournure infinitive très concise, est comprise à la première personne à la lumière de la proposition contrastive qui suit et du récit, où c’est le roi d’Israël qui se déguise.
- source_word: וָב֣וֹא בַמִּלְחָמָה
  choice: et aller au combat
  rationale: Cette formulation française exprime naturellement le mouvement vers la bataille indiqué par בוא avec la préposition ב.
- source_word: וְאַתָּה
  choice: mais toi
  rationale: 'Le pronom est fortement contrastif : contrairement au roi d’Israël déguisé, Josaphat doit conserver une tenue qui l’identifie.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: porte tes vêtements royaux
  rationale: 'בגדים signifie littéralement « vêtements ». L’adjectif « royaux » explicite sobrement le contexte : Josaphat doit porter sa tenue habituelle de roi, visible et reconnaissable, par contraste avec le déguisement de l’autre roi.'
- source_word: וַיָּבֹאוּ בַּמִּלְחָמָה
  choice: ils allèrent au combat
  rationale: Le pluriel désigne les deux rois qui se rendent à la bataille ; « allèrent au combat » est une tournure narrative naturelle en français.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et courante du nom biblique.
