  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: fr
  text: 'Il dit : « J’ai vu tout Israël dispersé sur les montagnes, comme des brebis qui n’ont pas de berger. Et Yahweh a dit : “Ces hommes n’ont pas de maîtres[a]. Que chacun retourne chez lui en paix.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci n’ont pas de maîtres ». Le pluriel peut désigner l’absence de toute autorité dirigeante ; on peut aussi le rendre par le singulier collectif : « ils n’ont pas de maître » ou « de chef ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: dispersé
  rationale: Le participe passif décrit Israël éparpillé après la défaite; « dispersé » est naturel en français et conserve l’image collective.
- source_word: עַל הֶהָרִים
  choice: sur les montagnes
  rationale: Rendu locatif direct de l’hébreu, sans atténuer le relief en « collines ».
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: comme des brebis qui n’ont pas de berger
  rationale: Conserve la comparaison et la proposition relative de l’hébreu dans un français courant et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: Ces gens n’ont plus de maîtres
  rationale: « Maîtres » préserve le pluriel אֲדֹנִים; « ces gens » explicite naturellement le référent humain de אֵלֶּה, et « plus » rend en contexte la perte de la direction royale sans préciser davantage sa nature.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Que chacun retourne chez lui
  rationale: Rend la valeur jussive de l’imparfait et la distribution exprimée par אִישׁ, dans une tournure française idiomatique.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: Correspondance traditionnelle et directe qui maintient l’idée d’un retour sans nouveau combat ou dommage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Nombre et portée de אֲדֹנִים
  choice: maîtres
  alternative: maître
  rationale: Le pluriel morphologique est maintenu, malgré la possibilité de comprendre collectivement l’absence d’un chef; une note signale le singulier idiomatique possible.
translation_notes:
  register: Français international moderne, sobre et narratif. « Brebis » convient au féminin grammatical de צֹאן dans la proposition hébraïque et à l’usage pastoral français. La répétition de « Il dit » puis « Yahweh a dit » est conservée pour respecter la structure du discours rapporté.
