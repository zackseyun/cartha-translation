  text: וַ/יְהִ֧י לִֽ/יהוֹשָׁפָ֛ט עֹ֥שֶׁר וְ/כָב֖וֹד לָ/רֹ֑ב וַ/יִּתְחַתֵּ֖ן לְ/אַחְאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: fr
  text: Josaphat avait de grandes richesses et un grand prestige, et il s’allia par mariage avec Achab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il devint parent d’Achab par mariage » ou « il conclut une alliance matrimoniale avec Achab ».
    reason: Alternative lexicale pour rendre le sens familial et dynastique du verbe hébreu.
lexical_decisions:
- source_word: וַיְהִי לִיהוֹשָׁפָט
  choice: Josaphat possédait
  rationale: La construction hébraïque exprime ici la possession. « Possédait » est naturel en français moderne et évite un calque lourd tel que « il y avait pour Josaphat ».
- source_word: עֹשֶׁר
  choice: richesses
  rationale: Le nom désigne l’abondance des biens matériels. Le pluriel « richesses » convient naturellement à ce contexte royal.
- source_word: וְכָבוֹד
  choice: et honneur
  rationale: Dans ce contexte social et royal, כָבוֹד renvoie au prestige et à la considération plutôt qu’à une manifestation visible de gloire.
- source_word: לָרֹב
  choice: en abondance
  rationale: Cette expression indique le haut degré des richesses et de l’honneur. La formulation française conserve explicitement cette idée d’abondance.
- source_word: וַיִּתְחַתֵּן
  choice: et il s’allia par mariage
  rationale: La forme hitpael de חתן désigne l’établissement d’un lien entre familles par mariage, sans affirmer que Josaphat lui-même épousa quelqu’un de la maison d’Achab.
- source_word: לְאַחְאָב
  choice: avec Achab
  rationale: Après « s’allier », la préposition « avec » exprime naturellement en français le rapport établi avec Achab.
theological_decisions:
- issue: Nature du lien exprimé par וַיִּתְחַתֵּן לְאַחְאָב
  choice: il s’allia par mariage avec Achab
  alternative: il devint parent d’Achab par mariage ; il conclut une alliance matrimoniale avec Achab
  rationale: Le texte évoque un rapprochement dynastique ou familial par mariage. La traduction n’attribue pas à Josaphat un mariage personnel et ne précise pas davantage que l’hébreu les membres de la famille concernés.
translation_notes:
  register: Français international moderne, clair et digne. Les formes françaises traditionnelles des noms bibliques « Josaphat » et « Achab » sont retenues. La coordination simple respecte le déroulement narratif sans ajouter de marqueur temporel absent du texte source.
