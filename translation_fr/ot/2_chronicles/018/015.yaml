source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: fr
  text: 'Alors le roi lui dit : « Combien de fois faudra-t-il que je te fasse jurer de ne me dire que la vérité au nom de Yahweh ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » marque naturellement la succession narrative en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini est rendu directement, sans ajouter le nom du roi que l’hébreu n’emploie pas ici.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Combien de fois
  rationale: Cette tournure idiomatique exprime l’exaspération devant une situation qui se répète.
- source_word: מַשְׁבִּיעֶךָ
  choice: faudra-t-il que je te fasse jurer
  rationale: La forme causative de שבע signifie faire prêter serment ou placer sous serment. Le futur « faudra-t-il » restitue en français la force impatiente de la question.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: de ne me dire que la vérité
  rationale: Après le verbe d’adjuration, la négation suivie de רַק exprime une restriction. La construction française « ne… que » en conserve à la fois la forme négative et le sens exclusif.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: La préposition avec « nom » indique ici l’autorité ou le cadre solennel de la parole exigée ; le tétragramme est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le caractère propre du nom divin sans le remplacer par un titre.
- issue: Portée de la négation dans אֲשֶׁר לֹא… רַק
  choice: ne me dire que la vérité
  alternative: ne pas me parler, sinon pour dire la vérité
  rationale: 'La négation associée à רַק forme ici une restriction : le roi exige que toute parole qui lui est adressée soit vraie. La formulation retenue préserve cette structure sans suggérer que le prophète devrait garder le silence.'
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à la deuxième personne masculine singulière de l’hébreu et à la parole autoritaire du roi. La tournure « faire jurer » reste accessible tout en conservant le contexte solennel de l’adjuration.
