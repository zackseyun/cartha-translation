base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: fr
  text: 'Mais un homme tira une flèche au hasard et atteignit le roi d’Israël entre les pièces de l’armure et la cuirasse[a]. Le roi dit alors au conducteur de son char : « Fais demi-tour[b] et emmène-moi hors du camp[c], car je suis blessé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les jointures de l’armure et la cuirasse ». Le sens précis des termes hébreux désignant les éléments de l’armure est incertain ; la flèche a atteint un interstice dans la protection du roi.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « Tourne ta main ». L’expression demande probablement au conducteur de faire tourner ou de manœuvrer le char pour s’éloigner.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « hors du camp ». Dans ce contexte, le mot peut désigner les troupes ou la zone occupée par l’armée au combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mais un homme
  rationale: Le waw poursuit le récit tout en introduisant un retournement contrasté; אִישׁ reste indéfini.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: tira de l’arc
  rationale: Expression française naturelle pour l’action de bander puis décocher avec un arc dans ce contexte.
- source_word: לְתֻמּוֹ
  choice: au hasard
  rationale: Dans le contexte de la bataille, l’expression indique vraisemblablement un tir sans viser une personne précise, tout en laissant la nuance lexicale alternative en note.
- source_word: וַיַּךְ
  choice: atteignit
  rationale: Rend l’impact de la flèche sans anticiper la déclaration ultérieure de blessure.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: entre les pièces assemblées de l’armure et la cuirasse
  rationale: דְּבָקִים évoque des éléments joints ou attachés, tandis que שִׁרְיָן désigne une protection corporelle; la terminologie exacte de l’armure demeure incertaine.
- source_word: לָרַכָּב
  choice: au conducteur de son char
  rationale: Désigne ici celui qui conduit le char; cette formulation est immédiatement claire en français moderne.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Fais demi-tour
  rationale: Traduit idiomatiquement l’ordre littéral « tourne ta main », qui demande au conducteur de manœuvrer le char pour repartir en sens inverse.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: emmène-moi hors du combat
  rationale: מַחֲנֶה peut désigner le camp ou les forces rangées; ici, la scène exige vraisemblablement l’évacuation hors de la zone de combat.
- source_word: כִּי הָחֳלֵיתִי
  choice: car je suis blessé
  rationale: Dans le contexte immédiat d’une flèche ayant atteint le roi, le verbe exprime son état de blessé ou d’affaibli; aucun adverbe d’intensité n’est ajouté.
