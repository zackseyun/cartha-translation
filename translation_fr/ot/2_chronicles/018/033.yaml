  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « Tira une flèche au hasard » est plus idiomatique et plus précis en français que « tira de l’arc au hasard » pour l’action ponctuelle décrite.
  terminology: « Cuirasse », « conducteur de son char » et « blessé » conviennent. La formulation révisée conserve l’incertitude relative aux composants de l’armure sans imposer une reconstruction technique particulière.
