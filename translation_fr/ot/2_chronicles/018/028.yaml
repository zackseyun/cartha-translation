  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: fr
  text: Le roi d’Israël et Josaphat, roi de Juda, montèrent à Ramoth en Galaad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: montèrent
  rationale: Le verbe עלה signifie littéralement « monter ». Le pluriel français est exigé par le sujet composé. Dans ce déplacement vers Ramoth, « montèrent » préserve l’image spatiale de l’hébreu sans ajouter une nuance militaire absente du verbe.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Cette formulation rend naturellement le titre royal hébreu et désigne le roi déjà connu dans le contexte.
- source_word: וִיהוֹשָׁפָט
  choice: et Josaphat
  rationale: La conjonction est additive. « Josaphat » est la forme française traditionnelle et largement reconnue du nom יהושפט.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: 'Le titre en apposition suit naturellement le nom propre en français : « Josaphat, roi de Juda ».'
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici la destination du déplacement ; après « monter », « à » est l’équivalent français naturel.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française traditionnelle exprime clairement que Ramoth se trouve dans la région de Galaad et évite un composé calqué sur l’anglais.
- source_word: וַ־
  choice: donc
  rationale: Le waw narratif relie l’action à la décision et aux événements précédents. Placé après le sujet composé, « donc » rend cette continuité de manière naturelle en français.
