source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: fr
  text: 'Josaphat dit au roi d’Israël : « Je t’en prie, consulte aujourd’hui la parole de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « demande aujourd’hui une parole de Yahweh ».'
    reason: 'Alternative lexicale et syntaxique : dans ce contexte de consultation prophétique, l’expression peut désigner soit la parole de Yahweh comme formule établie, soit la demande d’un oracle venant de lui.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif poursuit le récit. En français moderne, le passé simple suffit naturellement à marquer cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: au roi d’Israël
  rationale: Rend directement la préposition et le titre royal dans un français naturel.
- source_word: דְּרָשׁ
  choice: cherche … à connaître
  rationale: Dans ce contexte de consultation prophétique, le verbe signifie rechercher auprès de Dieu une révélation ou une directive. Cette formulation française reste proche de l’objet hébreu « la parole » tout en évitant l’expression peu naturelle « consulter une parole ».
- source_word: נָא
  choice: Je t’en prie
  rationale: La particule adoucit l’impératif et exprime une demande pressante mais courtoise.
- source_word: כַיּוֹם
  choice: aujourd’hui
  rationale: L’expression a ici une valeur adverbiale et souligne que la consultation doit avoir lieu sans attendre.
- source_word: אֶת דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formulation prophétique et le caractère défini de l’expression hébraïque, tout en signalant en note une autre analyse française possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Statut de דְּבַר יְהוָה
  choice: la parole de Yahweh
  alternative: une parole venant de Yahweh
  rationale: Le groupe hébreu peut être compris comme la formule établie « la parole de Yahweh », mais le contexte de demande d’un oracle permet aussi un sens indéfini. Le texte principal conserve la forme hébraïque, et la note maintient l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. « Je t’en prie » restitue la politesse de נָא, tandis que « cherche … à connaître » exprime naturellement en français l’idée d’une consultation prophétique sans effacer l’objet hébreu « la parole de Yahweh ».
