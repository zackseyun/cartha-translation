  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: fr
  text: 'Michée dit : « Si vraiment tu reviens en paix, Yahweh n’a pas parlé par moi[a]. » Puis il dit : « Écoutez, tous les peuples[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Yahweh n’a pas parlé à travers moi. »'
    reason: La préposition בְּ peut ici exprimer le moyen ou l’intermédiaire.
  - marker: b
    text: L’hébreu emploie « peuples » au pluriel, dans une formule solennelle d’appel prophétique.
    reason: Le pluriel élargit l’adresse au-delà du seul auditoire présent.
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et courante du nom hébreu Mikhayhou dans ce récit.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Si vraiment tu reviens
  rationale: L’infinitif absolu suivi de l’imparfait renforce le verbe ; « vraiment » rend cette insistance sans alourdir le français.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: Rend directement l’expression hébraïque, qui signifie ici revenir sans dommage, sain et sauf.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahweh n’a pas parlé par moi
  rationale: Conserve la tournure instrumentale de בִּי et le caractère conditionnel de l’authentification prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel naturel en français moderne, tout en gardant la solennité de l’appel prophétique.
- source_word: עַמִּים כֻּלָּם
  choice: tous les peuples
  rationale: Préserve le pluriel עַמִּים et rend naturellement en français l’appel universel renforcé par כֻּלָּם.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; la translittération préserve le nom personnel présent dans la source.
- issue: Locuteur de la dernière déclaration
  choice: Michée demeure le locuteur implicite
  alternative: Attribuer la déclaration à un autre locuteur
  rationale: Le sujet de « puis il dit » n’est pas répété en hébreu ; l’antécédent explicite le plus proche est Michée. La traduction conserve cette continuité sans ajouter son nom.
- issue: Portée de l’adresse finale
  choice: tous les peuples
  alternative: tout le peuple
  rationale: Le nom hébreu est au pluriel et formule un vaste appel prophétique ; le réduire au seul auditoire immédiat effacerait cette portée.
translation_notes:
  register: Français international moderne, digne et direct. La répétition emphatique hébraïque est rendue par « vraiment », et l’appel final garde une tonalité prophétique sans archaïsme.
