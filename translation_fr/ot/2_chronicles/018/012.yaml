  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: fr
  text: 'Le messager qui était allé chercher Michée lui dit : « Voici, les paroles des prophètes sont, d’une seule voix[a], favorables au roi. Je t’en prie, que ta parole soit comme celle de l’un d’eux, et annonce du bien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une seule bouche », expression signifiant « d’un commun accord » ou « unanimement ».'
    reason: L’expression hébraïque imagée פֶּה אֶחָד est rendue par son équivalent idiomatique français, tandis que la note en conserve la forme littérale.
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce contexte, il s’agit de l’envoyé humain chargé d’aller chercher Michée, et non d’un ange.
- source_word: לִקְרֹא
  choice: aller chercher
  rationale: Dans la scène, le messager est envoyé afin de faire venir Michée devant le roi. Cette formulation est naturelle en français et exprime la convocation sans lourdeur administrative.
- source_word: לְמִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom biblique.
- source_word: דִּבֶּר אֵלָיו לֵאמֹר
  choice: lui dit
  rationale: Rend naturellement en français la formule narrative hébraïque « parla avec lui en disant », sans calque pesant.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la valeur présentative et l’appel à l’attention dans un registre digne mais actuel.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: les paroles des prophètes
  rationale: Préserve le pluriel concret de l’hébreu plutôt que de le réduire à un unique « message ».
- source_word: פֶּה אֶחָד
  choice: d’une seule voix
  rationale: Expression idiomatique française qui conserve l’image d’une expression commune et signifie que les prophètes sont unanimes. La note signale l’image hébraïque littérale de la bouche.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: favorables au roi
  rationale: Dans ce contexte, le « bien » qualifie des paroles qui soutiennent le roi ou lui annoncent une issue avantageuse.
- source_word: וִיהִי נָא
  choice: Je t’en prie, que … soit
  rationale: Reproduit la demande pressante mais polie exprimée par le jussif accompagné de נָא.
- source_word: דְבָרְךָ
  choice: ta parole
  rationale: Maintient le singulier hébreu, qui désigne la déclaration prophétique de Michée comme un tout.
- source_word: כְּאַחַד מֵהֶם
  choice: comme celle de l’un d’eux
  rationale: En français, le pronom « celle » rattache clairement la comparaison à la parole de chacun des prophètes.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: et annonce du bien
  rationale: Conserve la répétition de טוֹב et la teneur prophétique de la parole, sans préciser indûment si le bien est simplement favorable ou effectivement bénéfique.
theological_decisions: []
