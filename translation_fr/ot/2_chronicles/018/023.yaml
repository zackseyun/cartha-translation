base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: fr
  text: 'Alors Sédécias, fils de Kenaana, s’approcha et frappa Michée sur la joue. Il dit : « Par quel chemin l’Esprit de Yahweh est-il passé en partant de moi pour te parler ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le verbe נגשׁ exprime ici un mouvement vers Michée. « S’approcha » est naturel en français et convient au caractère menaçant de la scène.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Sédécias, fils de Kenaana
  rationale: Les formes françaises courantes des noms bibliques sont retenues. « Fils de » reproduit simplement la filiation indiquée par l’hébreu.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: frappa Michée à la joue
  rationale: נכה est un verbe général signifiant frapper, tandis que לֶחִי désigne la joue ou la mâchoire. « Frapper à la joue » conserve le geste sans préciser indûment qu’il s’agit d’une gifle.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Par où
  rationale: La formule constitue une question sarcastique sur le trajet qu’aurait suivi l’Esprit. « Par où » est idiomatique en français tout en maintenant l’image spatiale; la formulation plus littérale figure en note.
- source_word: עָבַר
  choice: est-il passé
  rationale: עבר signifie passer ou traverser. Ce choix préserve l’image provocatrice d’un Esprit qui serait passé d’un prophète à l’autre.
- source_word: רֽוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans ce contexte prophétique, רוּחַ renvoie à l’Esprit divin. Le nom יהוה est rendu par « Yahweh » conformément à la ligne éditoriale fournie.
- source_word: מֵאִתִּי
  choice: de moi
  rationale: La préposition marque ici le point de départ. La tournure volontairement saisissante conserve l’idée du sarcasme de Sédécias, qui prétendait parler sous l’action de l’Esprit.
- source_word: לְדַבֵּר אֹתָךְ
  choice: pour te parler
  rationale: Malgré la construction hébraïque inhabituelle avec אֵת, le sens contextuel est que l’Esprit parlerait à Michée. « Pour te parler » est clair et naturel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance et suit l’orientation doctrinale fournie sans remplacer celui-ci par un titre.
- issue: Référent de רוּחַ יהוה
  choice: l’Esprit de Yahweh
  alternative: l’esprit de Yahweh
  rationale: Le cadre est celui de l’inspiration et de la parole prophétiques. La majuscule indique le référent divin, sans trancher davantage les questions théologiques sur le mode précis de son action.
translation_notes:
  register: Français moderne, international et digne. Le rythme narratif est allégé en deux phrases. La question conserve son sarcasme ainsi que l’étrange image spatiale d’un Esprit qui serait passé de Sédécias à Michée.
