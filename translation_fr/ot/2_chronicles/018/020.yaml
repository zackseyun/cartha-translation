base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: fr
  text: 'Alors l’esprit s’avança, se tint devant Yahweh et dit : « Moi, je le séduirai[a]. » Yahweh lui dit : « Par quel moyen ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je le tromperai » ou « je le persuaderai ». Selon le contexte, le verbe hébreu peut exprimer l’idée de séduire, de persuader ou de tromper.
    reason: alternative lexicale
lexical_decisions:
- source_word: הָרוּחַ
  choice: l’esprit
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Ici, les actions personnelles — s’avancer, se tenir devant Yahweh et parler — indiquent un être spirituel personnel.
- source_word: וַיֵּצֵא
  choice: s’avança
  rationale: יצא signifie littéralement « sortir ». Dans cette scène de conseil céleste, « s’avança » exprime naturellement le mouvement de celui qui se présente pour prendre la parole.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: se tint devant
  rationale: L’expression désigne le fait de prendre place devant quelqu’un, notamment dans un cadre d’audience ou de service. Cette formulation conserve le caractère solennel de la scène.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: אֲפַתֶּנּוּ
  choice: je le séduirai
  rationale: Au piel, פתה peut signifier séduire, persuader ou tromper selon le contexte. « Séduire » conserve ici l’idée d’amener Akab à suivre une voie fatale sans préciser avant le verset suivant le procédé employé.
- source_word: בַּמָּה
  choice: Par quel moyen ?
  rationale: L’interrogatif porte sur la manière ou le moyen par lequel l’esprit accomplira son projet. Cette formulation est claire et naturelle en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: La translittération préserve le nom divin personnel du texte source au lieu de lui substituer un titre.
- issue: Portée morale et théologique de פתה dans la scène du conseil céleste
  choice: je le séduirai
  alternative: je le tromperai ; je le persuaderai
  rationale: Le verset présente la proposition de l’esprit sans encore en exposer le procédé, précisé au verset suivant. « Séduire » maintient la tension et l’ambiguïté du terme hébreu sans les résoudre prématurément.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit conserve la cadence solennelle de la scène céleste. Le pronom tonique « Moi » met en relief l’offre de l’esprit, comme le fait l’hébreu אֲנִי.
