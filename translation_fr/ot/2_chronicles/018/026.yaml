base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: fr
  text: 'et dites : « Voici ce que dit le roi : Mettez cet homme en prison et nourrissez-le de pain de détresse et d’eau de détresse[a], jusqu’à ce que je revienne sain et sauf. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pain de privation et eau de privation ». L’expression désigne probablement une nourriture et une boisson misérables, associées à l’emprisonnement et aux privations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: et dites
  rationale: Le wayyiqtol à la deuxième personne du pluriel poursuit ici l’ordre du roi avec une valeur proche de l’impératif.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Voici ce que dit le roi
  rationale: Formule de messager officielle, rendue dans un français actuel et naturel.
- source_word: שִׂימוּ זֶה
  choice: Mettez cet homme
  rationale: Le démonstratif désigne Michée de manière déictique; « cet homme » explicite naturellement le référent sans accentuer artificiellement le mépris.
- source_word: בֵּית הַכֶּלֶא
  choice: en prison
  rationale: Équivalent idiomatique de l’expression littérale « maison de détention ».
- source_word: וְהַאֲכִלֻהוּ
  choice: ne lui donnez que
  rationale: Le causatif signifie qu’on doit lui donner à manger; associé aux deux expressions לַחַץ, il exprime ici l’attribution de rations pénitentiaires restreintes.
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: du pain et de l’eau en quantité réduite
  rationale: לַחַץ évoque la détresse, la privation ou l’oppression. Dans ce contexte carcéral, l’expression désigne vraisemblablement des rations réduites; la note conserve la formulation plus littérale.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: jusqu’à ce que je revienne sain et sauf
  rationale: בְשָׁלוֹם indique ici un retour sans dommage après la bataille, tout en préservant l’ironie narrative.
