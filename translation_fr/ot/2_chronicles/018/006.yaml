source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: fr
  text: 'Mais Josaphat demanda : « N’y a-t-il pas encore ici un prophète de Yahvé que nous puissions consulter ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Josaphat demanda
  rationale: Le waw narratif fait progresser le récit, tandis que « mais » rend le contraste avec le consensus prophétique précédent. Dans ce contexte interrogatif, « demanda » est plus naturel en français que le calque « dit ».
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et couramment reconnue du nom royal.
- source_word: הַאֵין
  choice: N’y a-t-il pas
  rationale: La particule interrogative jointe à la négation introduit une question qui recherche une confirmation; cette formulation en conserve naturellement la force.
- source_word: פֹּה
  choice: ici
  rationale: Équivalent direct et idiomatique de l’adverbe de lieu.
- source_word: נָבִיא לַיהוָה
  choice: un prophète de Yahvé
  rationale: נָבִיא désigne un prophète, et le lamed marque ici sa relation à Yahvé, comme personne parlant en son nom ou lui appartenant.
- source_word: עוֹד
  choice: encore
  rationale: Le mot demande s’il reste disponible un prophète supplémentaire, sans rendre explicitement « un autre », qui serait plus interprétatif.
- source_word: וְנִדְרְשָׁה
  choice: que nous puissions consulter
  rationale: Le cohortatif à la première personne du pluriel propose une démarche commune. Dans ce contexte, דרשׁ signifie chercher une réponse divine en consultant le prophète.
- source_word: מֵאֹתוֹ
  choice: consulter
  rationale: Le complément pronominal désigne celui auprès de qui l’on cherche une réponse. En français, « consulter quelqu’un » exprime naturellement cette relation sans préposition séparée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahvé » rend le nom propre dans une forme française largement reconnue, plutôt que de le remplacer par un titre.
- issue: Médiation du prophète dans la consultation
  choice: consulter le prophète
  alternative: consulter Yahvé par son intermédiaire
  rationale: La formulation française conserve le référent grammatical de מֵאֹתוֹ, le prophète, sans expliciter davantage le mécanisme de médiation que ne le fait le verset.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase conserve la question rhétorique et l’ambiguïté de עוֹד entre « encore disponible » et « un autre », tout en évitant un calque hébraïque peu naturel.
