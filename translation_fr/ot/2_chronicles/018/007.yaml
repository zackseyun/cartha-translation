  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: fr
  text: 'Le roi d’Israël dit à Josaphat : « Il reste encore un homme par l’intermédiaire de qui nous pouvons consulter Yahweh[a]. Mais moi, je le déteste, car il ne prophétise jamais rien de bon à mon sujet, mais toujours du mal. C’est Michée, fils de Yimla. » Josaphat répondit : « Que le roi ne parle pas ainsi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par qui nous pouvons consulter Yahweh ».'
    reason: Cette alternative rend de façon plus concise le rôle médiateur indiqué par מֵאֹתוֹ, sans surinterpréter la construction.
lexical_decisions:
- source_word: עוֹד אִישׁ אֶחָד
  choice: Il reste encore un homme
  rationale: Cette formulation naturelle rend l’idée qu’un homme demeure disponible, tout en conservant l’insistance de עוֹד et אֶחָד.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: par l’intermédiaire de qui nous pouvons consulter Yahweh
  rationale: Dans ce contexte prophétique, דרשׁ signifie consulter ou rechercher une réponse de Yahweh. מֵאֹתוֹ présente le prophète comme intermédiaire.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: Mais moi, je le déteste
  rationale: Le parfait exprime ici une attitude établie et persistante. Le présent français la rend naturellement, tandis que « mais » explicite le contraste contextuel.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: car il ne prophétise jamais rien de bon à mon sujet
  rationale: Le participe nié décrit une conduite habituelle. « Jamais » en restitue la portée caractéristique, et « à mon sujet » rend עָלַי sans déterminer si les annonces concernent la personne ou le règne du roi.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: mais seulement du mal, tous les jours de sa vie
  rationale: La formulation conserve l’opposition entre le bien et le mal ainsi que l’expression temporelle כָל־יָמָיו, comprise comme une accusation de constance.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Michée, fils de Yimla
  rationale: « Michée » est la forme française usuelle du nom du prophète; « fils de » conserve explicitement le patronyme, et « Yimla » représente la consonne initiale hébraïque.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Que le roi ne parle pas ainsi !
  rationale: La tournure jussive française préserve la correction indirecte et respectueuse adressée au roi, dans une langue actuelle et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Nature des prophéties dites « bonnes » ou « mauvaises »
  choice: rien de bon… seulement du mal
  alternative: des choses favorables… des choses défavorables
  rationale: Le choix conserve le vocabulaire moral et évaluatif du texte sans décider si le roi parle de vérité morale, d’issue favorable ou simplement de messages qui lui plaisent.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms Josaphat et Michée suivent l’usage biblique français courant; Yimla conserve plus directement la forme hébraïque. La répétition emphatique « Mais moi, je » traduit l’insistance du pronom hébreu.
