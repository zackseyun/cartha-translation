    issue: « mais seulement du mal, tous les jours de sa vie »
    rationale: Cette formulation est compréhensible, mais « tous les jours de sa vie » sonne comme une précision biographique en français. Le contexte et la construction hébraïque expriment l’idée que ses prophéties sont toujours mauvaises aux yeux du roi. « mais toujours du mal » est plus naturel sans perte de sens.
  - severity: low
    issue: 'Formulation de la note : « Littéralement : consulter Yahweh auprès de lui »'
    rationale: La formulation n’est pas strictement littérale et « auprès de lui » peut ambiguïser le rapport entre Yahweh et le prophète. Une note d’alternative concise rend mieux le rôle médiateur de מֵאֹתוֹ.
