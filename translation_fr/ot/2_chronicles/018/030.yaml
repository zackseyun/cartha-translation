  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: fr
  text: 'Le roi d’Aram avait donné cet ordre aux chefs de ses troupes de chars : « Ne vous attaquez à personne, petit ou grand[a], mais seulement au roi d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ni petit ni grand » ; formule qui désigne toute personne, quel que soit son rang.
    reason: L’hébreu emploie une expression polaire (« petit » / « grand ») pour exclure toute autre cible.
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Le roi d’Aram
  rationale: Le waw assure ici la continuité narrative sans devoir être rendu par un connecteur explicite en français. Le nom propre אֲרָם est translittéré « Aram ».
- source_word: צִוָּה
  choice: avait donné cet ordre
  rationale: Le verbe signifie « ordonner, donner un ordre ». Le plus-que-parfait situe naturellement l’ordre avant les événements du combat racontés ensuite.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: aux chefs de ses chars
  rationale: שָׂרֵי désigne les chefs ou commandants, tandis que הָרֶכֶב peut désigner les chars ou la force de chars. Le possessif « ses » restitue sobrement אֲשֶׁר לוֹ et évite une lourde relative.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement le contenu de l’ordre sans qu’il soit nécessaire de traduire mécaniquement « en disant ».
- source_word: לֹא תִּלָּחֲמוּ
  choice: Ne combattez
  rationale: La forme verbale exprime ici une interdiction adressée aux chefs militaires.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: ni petit ni grand
  rationale: Cette formule polaire englobe toute personne, quel que soit son rang. La traduction conserve l’image concise de l’hébreu plutôt que d’en donner uniquement le sens explicité.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: La construction introduit une restriction exclusive.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: le roi d’Israël, lui seul
  rationale: Le roi d’Israël est l’unique cible. « Lui seul » garde l’insistance de לְבַדּוֹ, même si « seulement » exprime déjà la restriction.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire militaire reste accessible; la formule hébraïque « petit ni grand » est conservée dans le texte, avec son sens idiomatique précisé en note.
