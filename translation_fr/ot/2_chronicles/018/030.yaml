review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le roi d’Aram a donné auparavant un ordre aux commandants de ses chars de ne combattre personne d’autre que le roi d’Israël. Toutefois, la construction française « Ne combattez ni petit ni grand » est elliptique au point d’être peu naturelle et peut laisser ambigu l’objet du combat. Le tour hébreu polaire vise des personnes de tout rang.'
  naturalness: « Aux chefs de ses chars » est compréhensible, mais « aux chefs de ses troupes de chars » rend plus clairement la fonction militaire de רכב. Une légère explicitation de l’idiome est préférable dans le texte, sans perdre la concision ni la force de l’ordre.
  terminology: « Aram », « roi d’Israël » et le registre militaire sont appropriés. « Lui seul » rend l’insistance de לְבַדּוֹ, mais devient redondant après « seulement » ; « ne vous attaquez qu’au roi d’Israël » exprime naturellement l’exclusivité de la consigne.
  issues:
  - severity: medium
    issue: Formulation française elliptique de l’idiome « ni petit ni grand »
    rationale: En français moderne, « Ne combattez ni petit ni grand » n’emploie pas naturellement « combattre » avec des personnes ainsi coordonnées. L’hébreu signifie ne combattre personne, sans égard au rang ; cette portée doit être rendue clairement.
  - severity: low
    issue: « ses chars » peut désigner les véhicules plutôt que la force de chars
    rationale: רכב peut désigner les chars ou le corps de chariots. « Ses troupes de chars » conserve la référence militaire collective et clarifie que les destinataires sont des officiers.
  revised_text: 'Le roi d’Aram avait donné cet ordre aux chefs de ses troupes de chars : « Ne vous attaquez à personne, petit ou grand[a], mais seulement au roi d’Israël. »'
