source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: fr
  text: Quand les chefs des chars virent que ce n’était pas le roi d’Israël, ils cessèrent de le poursuivre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quand … virent
  rationale: La construction narrative avec l’infinitif précédé de כִּ exprime ici le moment où survient l’action; une proposition temporelle simple est naturelle en français.
- source_word: שָׂרֵי הָרֶכֶב
  choice: les chefs des chars
  rationale: שָׂרֵי désigne des responsables militaires, et הָרֶכֶב les chars ou le corps de chars. « Chefs des chars » reste proche de la forme hébraïque et convient au récit militaire.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: que ce n’était pas le roi d’Israël
  rationale: L’hébreu ne formule pas de sujet explicite. Le démonstratif neutre « ce » permet au français d’identifier la personne aperçue sans introduire inutilement un pronom masculin absent de la proposition source.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: ils cessèrent de le poursuivre
  rationale: Littéralement, les hommes « revinrent de derrière lui ». Dans ce contexte de combat, l’expression signifie qu’ils renoncèrent à poursuivre l’homme qu’ils avaient pris pour le roi d’Israël.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La formulation privilégie la clarté immédiate tout en conservant l’identification indirecte du personnage présente dans l’hébreu.
