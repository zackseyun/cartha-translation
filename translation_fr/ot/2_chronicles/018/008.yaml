source:
  edition: WLC
  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: fr
  text: 'Alors le roi d’Israël appela un fonctionnaire de la cour[a] et lui dit : « Fais vite venir Michée, fils de Yimla. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un eunuque » ou « un haut fonctionnaire »; le terme hébreu peut désigner soit un eunuque au sens propre, soit, plus généralement, un fonctionnaire royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le verbe קרא introduit ici l’appel adressé à un membre de la cour; « appela » restitue simplement la progression narrative.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Cette expression construite identifie directement le souverain qui parle.
- source_word: אֶל סָרִיס אֶחָד
  choice: un fonctionnaire de la cour[a]
  rationale: סָרִיס peut désigner un eunuque au sens propre ou, par extension, un haut fonctionnaire royal. Le contexte met surtout en avant sa fonction de serviteur mandaté par le roi; la note conserve l’autre possibilité.
- source_word: וַיֹּאמֶר
  choice: lui dit
  rationale: Le pronom « lui » rend explicite en français naturel que les paroles sont adressées au fonctionnaire qui vient d’être appelé.
- source_word: מַהֵר
  choice: Fais vite venir
  rationale: L’impératif exprime l’urgence. « Fais vite venir » transmet naturellement en français l’ordre de faire venir Michée sans délai.
- source_word: מיכהו
  choice: Michée
  rationale: « Michée » est la forme française traditionnelle et immédiatement reconnaissable de ce nom biblique.
- source_word: בֶן יִמְלָא
  choice: fils de Yimla
  rationale: La formule patronymique est rendue directement; « Yimla » suit de près la forme hébraïque.
theological_decisions: []
