source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: fr
  text: 'Yahweh dit : « Qui séduira[a] Achab, roi d’Israël, afin qu’il monte et tombe à Ramoth en Galaad ? » L’un disait une chose, et l’autre une autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trompera » ou « persuadera », au lieu de « séduira ».
    reason: Alternative lexicale pour פתה, dont le sens peut aller de la persuasion à la tromperie selon le contexte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle du tétragramme dans le texte hébreu.
- source_word: יְפַתֶּה
  choice: séduira
  rationale: Le piel de פתה peut exprimer l’idée de séduire, persuader ou tromper. « Séduira » conserve à la fois l’incitation et la nuance moralement troublante du contexte sans réduire d’emblée le verbe à la tromperie explicite.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Achab, roi d’Israël
  rationale: L’apposition française naturelle conserve directement le nom et le titre royal de l’hébreu.
- source_word: וְיַעַל וְיִפֹּל
  choice: afin qu’il monte et tombe
  rationale: « Afin que » rend la valeur de but ou de résultat des imparfaits coordonnés; « tombe » conserve l’image hébraïque, dont le contexte militaire suggère la défaite et la mort.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: à Ramoth en Galaad
  rationale: Cette formulation traite Ramoth comme une ville située dans la région de Galaad et emploie une tournure géographique française naturelle.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: L’un disait une chose, et l’autre une autre
  rationale: Cette tournure française rend clairement les propositions divergentes au sein du conseil céleste, tout en conservant le parallélisme des deux membres.
theological_decisions:
- issue: L’intervention divine dans la chute d’Achab
  choice: Conserver la représentation directe de Yahweh demandant qui séduira Achab.
  alternative: Atténuer l’initiative divine par une formule comme « permettra qu’Achab soit séduit ».
  rationale: L’hébreu présente Yahweh comme celui qui ouvre cette délibération. La traduction maintient cette tension théologique sans la résoudre par une paraphrase.
- issue: La nuance morale de פתה
  choice: Employer « séduira » dans le texte principal.
  alternative: Employer « persuadera » ou « trompera ».
  rationale: Le contexte conduit à une issue fatale par l’intermédiaire d’un message mensonger, mais le verbe lui-même admet plusieurs nuances. Le texte principal et la note préservent ensemble cette amplitude.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans devenir artificielle; l’imparfait dans la dernière phrase présente les diverses propositions formulées au cours de la délibération.
