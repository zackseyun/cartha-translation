base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: fr
  text: 'Alors Sédécias, fils de Kenaana, se fit des cornes de fer et déclara : « Voici ce que dit Yahweh : Avec celles-ci, tu encorneras Aram[a] jusqu’à ce qu’ils soient anéantis[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Aram » peut aussi désigner ici « les Araméens » ; le terme « Syrie », courant dans certaines traductions, est une désignation géographique plus tardive.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire « tu repousseras ». Le verbe hébreu décrit le coup porté par un animal avec ses cornes. La dernière expression emploie un pluriel et peut se comprendre : « jusqu’à ce qu’ils soient anéantis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: se fit
  rationale: Le datif לוֹ renvoie naturellement au sujet dans ce geste symbolique. « Se fit » exprime avec concision qu’il fabriqua les objets pour lui-même.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Sédécias, fils de Kenaana
  rationale: Les noms sont transcrits selon l’usage français biblique moderne, tandis que la construction patronymique hébraïque est conservée.
- source_word: קַרְנֵי בַרְזֶל
  choice: des cornes de fer
  rationale: Cette formulation conserve directement l’image concrète et la relation de matière exprimées par l’état construit hébreu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation française naturelle et digne de la formule prophétique du messager, avec maintien du nom divin.
- source_word: בְּאֵלֶּה
  choice: Avec celles-ci
  rationale: La préposition a ici un sens instrumental et le démonstratif pluriel renvoie aux cornes.
- source_word: תְּנַגַּח
  choice: tu encorneras
  rationale: Le verbe נגח décrit l’action de frapper ou de transpercer avec les cornes. « Encorner » maintient cette image dans un français précis.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Le nom historique du royaume ou du peuple est conservé plutôt que remplacé par le terme géographique plus tardif « Syrie ».
- source_word: עַד כַּלּוֹתָם
  choice: jusqu’à son anéantissement
  rationale: Le nom collectif « Aram » motive le singulier en français. La tournure exprime l’achèvement destructeur sans préciser davantage que l’hébreu l’agent de cet anéantissement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel divin. La translittération « Yahweh » le distingue d’un simple titre.
- issue: Statut de la déclaration de Sédécias
  choice: La formule prophétique est traduite sans valider explicitement la véracité de la prophétie
  alternative: Ajouter une qualification telle que « prétendit parler au nom de Yahweh »
  rationale: Le verset rapporte ses paroles directement. Le contexte narratif en permet l’évaluation, mais cette phrase ne contient elle-même aucune qualification explicite.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici ce que dit » rend naturellement la formule prophétique ; « encorneras » conserve le geste concret associé aux cornes sans l’affaiblir en un verbe générique. La ponctuation française et les espaces insécables avant les deux-points sont représentées selon l’usage typographique.
