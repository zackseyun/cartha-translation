  to: 'Alors Sédécias, fils de Kenaana, se fit des cornes de fer et déclara : « Voici ce que dit Yahweh : Avec celles-ci, tu encorneras Aram[a] jusqu’à ce qu’ils soient anéantis[b]. »'
  rationale: La révision corrige uniquement la représentation du pluriel hébreu dans la dernière proposition et replace l’appel de note correspondant. Elle maintient le sens destructeur de כלה sans imposer qui accomplit l’anéantissement, et conserve tous les choix lexicaux et terminologiques par ailleurs solides.
