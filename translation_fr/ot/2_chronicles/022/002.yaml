  variant: modern international French
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: fr
  text: Ahazia avait quarante-deux ans lorsqu’il devint roi[a], et il régna un an à Jérusalem. Sa mère s’appelait Athalie[b] ; elle était fille d’Omri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « quarante-deux ans ». Le récit parallèle de 2 Rois 8.26 porte « vingt-deux ans » ; certains y voient donc un problème de transmission du texte ou proposent une autre manière de comprendre ce nombre.
    reason: textual_variant
  - marker: b
    text: 'Ou : « descendante d’Omri ». En hébreu, le mot « fille » peut parfois désigner plus largement une descendante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: avait quarante-deux ans
  rationale: Expression hébraïque idiomatique indiquant l’âge ; cette formulation est naturelle en français moderne tout en conservant le nombre du texte massorétique.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction avec בְּ situe l’âge au moment de l’accession au trône.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: et il régna un an
  rationale: Rend directement la durée du règne et conserve le numéral hébreu.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: En français, la préposition naturelle devant le nom de cette ville est « à ».
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Formulation française courante et digne correspondant à la notice royale hébraïque « le nom de sa mère était ».
- source_word: עֲתַלְיָהוּ
  choice: Athalie
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: בַּת עָמְרִי
  choice: elle était fille d’Omri
  rationale: Conserve le sens lexical direct de בַּת sans trancher dans le texte principal la question d’une éventuelle descendance plus éloignée.
theological_decisions:
- issue: Tension chronologique concernant l’âge d’Ahazia lors de son accession
  choice: Conserver « quarante-deux ans » dans le texte principal
  alternative: « vingt-deux ans », selon le récit parallèle de 2 Rois 8.26, ou une autre manière de rapporter le nombre
  rationale: Le texte hébreu fourni porte « quarante-deux ». La traduction ne corrige ni n’harmonise silencieusement cette donnée, mais signale la difficulté en note.
- issue: Portée généalogique de « fille d’Omri »
  choice: Traduire par « fille d’Omri »
  alternative: « descendante d’Omri »
  rationale: Le terme hébreu ordinaire signifie « fille », mais les termes de parenté peuvent parfois exprimer une filiation plus large ; l’ambiguïté est donc signalée sans être résolue dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de la notice royale reste concise ; les formes françaises usuelles « Ahazia », « Athalie », « Omri » et « Jérusalem » sont employées.
