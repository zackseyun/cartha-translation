  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: fr
  text: Il suivit lui aussi leurs conseils[a] et partit avec Yehoram, fils d’Achab et roi d’Israël, faire la guerre à Hazaël, roi d’Aram[b], à Ramoth-Galaad. Les Araméens blessèrent Yoram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « marcha selon leurs conseils » ; cette expression signifie qu’il régla sa conduite sur leurs avis.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « Aram » ; la traduction traditionnelle est « Syrie ». De même, « Araméens » est traditionnellement rendu par « Syriens ».
    reason: alternative_reading
  - marker: c
    text: 'L’hébreu emploie deux formes apparentées du même nom : « Yehoram » plus haut dans le verset et « Yoram » ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: lui aussi
  rationale: Marque la continuité avec le contexte précédent et souligne que le roi adopta, lui aussi, la conduite conseillée par son entourage.
- source_word: בַּעֲצָתָם הָלַךְ
  choice: suivit leurs conseils
  rationale: Rend naturellement en français l’expression hébraïque littérale « marcher selon leurs conseils », qui signifie régler sa conduite sur les avis reçus.
- source_word: וַיֵּלֶךְ אֶת
  choice: partit avec
  rationale: Exprime simplement l’accompagnement indiqué par la construction hébraïque.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Yehoram ... Yoram
  rationale: Conserve les deux formes apparentées mais distinctes du nom employées dans le texte hébreu au début et à la fin du verset.
- source_word: לַמִּלְחָמָה עַל
  choice: faire la guerre à
  rationale: Formulation française naturelle qui exprime le but militaire et l’orientation hostile du déplacement.
- source_word: אֲרָם
  choice: Aram
  rationale: Reproduit la désignation historique hébraïque plutôt que le nom traditionnel plus tardif « Syrie ».
- source_word: בְּרָמוֹת גִּלְעָד
  choice: à Ramoth en Galaad
  rationale: Forme française claire du toponyme et emploi naturel de la préposition pour situer le combat.
- source_word: וַיַּכּוּ
  choice: blessèrent
  rationale: Dans ce contexte, le verbe « frapper » désigne la blessure subie par le roi, comme le précise la suite du récit.
- source_word: הָרַמִּים
  choice: les Araméens
  rationale: Correspond au gentilé dérivé d’Aram et assure la cohérence avec le nom du royaume.
theological_decisions:
- issue: Désignation du royaume אֲרָם et de ses habitants הָרַמִּים
  choice: Aram / Araméens
  alternative: Syrie / Syriens
  rationale: Le choix suit la désignation historique du texte hébreu sans lui substituer un nom géopolitique plus tardif.
- issue: Deux formes du nom du roi d’Israël
  choice: Yehoram ... Yoram
  alternative: Uniformiser les deux occurrences en « Joram » ou en « Yoram »
  rationale: Le texte massorétique emploie réellement deux formes apparentées. Les conserver évite d’effacer cette variation, sans lui attribuer de portée doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure idiomatique « suivit leurs conseils » évite un calque obscur, tandis que la note conserve l’image hébraïque. Les noms Aram et Araméens privilégient la terminologie historique de la source.
