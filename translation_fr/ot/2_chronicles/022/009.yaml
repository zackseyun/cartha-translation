  source_fidelity: 'Le sens narratif est globalement fidèle : recherche, capture pendant qu’Ahazia se cache à Samarie, conduite devant Jéhu, mise à mort, sépulture motivée par son lien avec Josaphat, puis incapacité dynastique. Le sujet du premier verbe reste implicite et la tournure « on » préserve correctement cette indétermination.'
