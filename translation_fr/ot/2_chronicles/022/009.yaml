  - severity: low
    issue: Temps de « qui a recherché Yahweh ».
    rationale: Dans ce discours rapporté au sein d’un récit passé, le plus-que-parfait français rend plus naturellement l’antériorité de la recherche de Yahweh par Josaphat.
  - severity: low
