  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: fr
  text: 'On rechercha Ahazia[a]. On le captura alors qu’il se cachait à Samarie, puis on l’amena à Jéhu et on le mit à mort. Ensuite, on l’enterra, car on disait : « C’est le fils de Josaphat, qui avait recherché Yahweh de tout son cœur. » Et la maison d’Ahazia n’avait pas la force de conserver le royaume[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet du premier verbe hébreu est implicite ; il peut s’agir de Jéhu ou de ses hommes agissant sous son autorité.
    reason: ambiguïté grammaticale
  - marker: b
    text: 'Ou : « La maison d’Ahazia n’avait pas la force de maintenir le pouvoir royal. »'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: On rechercha Ahazia
  rationale: Le singulier hébreu a un sujet implicite, probablement Jéhu agissant par l’intermédiaire de ses hommes. La tournure française impersonnelle évite de préciser indûment l’agent tout en exprimant la recherche active.
- source_word: וַיִּלְכְּדֻהוּ
  choice: On le captura
  rationale: Le verbe לכד exprime ici la capture. L’hébreu passe au pluriel; le français impersonnel rend naturellement l’action des hommes chargés de la recherche.
- source_word: מִתְחַבֵּא
  choice: alors qu’il se cachait
  rationale: Le participe hitpael décrit l’état ou l’action en cours d’Ahazia au moment de sa capture.
- source_word: בְשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition ב marque ici le lieu; « à Samarie » est la formulation française courante pour une ville.
- source_word: וַיְבִאֻהוּ אֶל־יֵהוּא
  choice: on l’amena à Jéhu
  rationale: Le hiphil de בוא signifie faire venir ou amener quelqu’un auprès d’une personne.
- source_word: וַיְמִתֻהוּ
  choice: on le mit à mort
  rationale: La forme causative de מות signifie littéralement faire mourir; « mettre à mort » en conserve la valeur sans imposer le cadre juridique plus précis d’une exécution.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: Traduction directe et naturelle du verbe קבר dans ce récit.
- source_word: כִּי אָמְרוּ
  choice: car on disait
  rationale: כִּי introduit la raison donnée pour l’ensevelissement. L’imparfait français présente naturellement la parole collective qui motivait cet acte.
- source_word: בֶּן־יְהוֹשָׁפָט הוּא
  choice: C’est le fils de Josaphat
  rationale: La proposition nominale hébraïque est rendue au présent afin de préserver l’immédiateté du discours direct.
- source_word: אֲשֶׁר דָּרַשׁ אֶת־יְהוָה
  choice: qui a recherché Yahweh
  rationale: Dans ce contexte religieux, דרש exprime une recherche dévouée et résolue de Dieu. « Rechercher » maintient aussi le lien lexical avec בקש sans les confondre entièrement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu.
- source_word: בְּכָל־לְבָבוֹ
  choice: de tout son cœur
  rationale: Cette expression française courante rend fidèlement l’idiome hébreu de l’engagement entier.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: Mais personne dans la maison d’Ahazia n’avait la force de conserver le royaume
  rationale: La formulation rend l’absence, au sein de la dynastie d’Ahazia, de la capacité nécessaire pour maintenir le pouvoir royal. « Maison » conserve le langage dynastique de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Sujet implicite de וַיְבַקֵּשׁ
  choice: 'tournure impersonnelle : « On rechercha »'
  alternative: « Jéhu rechercha » ou « Il rechercha »
  rationale: Le contexte désigne vraisemblablement Jéhu ou ses agents, mais l’hébreu de ce verset ne nomme pas le sujet. La traduction évite de lever cette ambiguïté.
- issue: Portée de la dernière proposition
  choice: incapacité de la maison d’Ahazia à conserver le royaume
  alternative: absence de force pour régner, ou absence d’un héritier capable de régner
  rationale: L’expression associe la maison dynastique, la force et le royaume sans préciser s’il s’agit surtout de puissance politique ou d’une personne apte à régner. Le texte principal garde l’idée générale et la note signale une traduction plus littérale.
translation_notes:
  register: Français international moderne, narratif et digne. Les formes « Ahazia », « Jéhu » et « Josaphat » suivent l’usage biblique français courant. Les tournures impersonnelles reproduisent sans lourdeur les changements de nombre et l’indétermination des agents en hébreu.
