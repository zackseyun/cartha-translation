  terminology: Les formes Ahazia, Jéhu et Josaphat sont cohérentes avec l’usage biblique français. « Yahweh » respecte le choix de rendre le tétragramme par le nom divin. « Mettre à mort » restitue sobrement le causatif sans imposer l’idée juridique d’exécution.
