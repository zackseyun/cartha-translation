source:
  edition: WLC
  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: fr
  text: Lui aussi suivit les voies de la maison d’Achab, car sa mère était sa conseillère pour le conduire au mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car sa mère lui conseillait de faire le mal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Lui aussi
  rationale: 'Cette tournure conserve la valeur additive et emphatique de גַּם avec le pronom indépendant : ce roi adopta, lui aussi, la même conduite.'
- source_word: הָלַךְ בְּדַרְכֵי
  choice: suivit les voies de
  rationale: Dans ce contexte moral, הלך décrit la conduite plutôt qu’un déplacement. « Suivre les voies de » garde l’image hébraïque tout en étant naturel en français.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: « Maison » préserve le sens à la fois familial et dynastique de בֵּית sans le réduire explicitement à la seule notion de dynastie.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la cause de sa conduite. « Car » relie clairement les deux propositions dans un registre narratif digne.
- source_word: אִמּוֹ הָיְתָה יוֹעַצְתּוֹ
  choice: sa mère lui conseillait
  rationale: La construction avec היה et le participe féminin présente le conseil comme une influence suivie. L’imparfait français rend naturellement cet aspect, tandis que le pronom « lui » identifie le bénéficiaire du conseil.
- source_word: לְהַרְשִׁיעַ
  choice: de faire le mal
  rationale: L’infinitif hifil de רשע exprime ici l’orientation mauvaise du conseil. « Faire le mal » transmet clairement le jugement moral du texte sans ajouter de motivation psychologique.
theological_decisions:
- issue: Responsabilité morale du roi et influence de sa mère
  choice: Dire explicitement que sa mère lui conseillait de faire le mal
  alternative: « sa mère l’incitait au mal »
  rationale: Le texte attribue à la mère une influence mauvaise réelle, mais « incitait » pourrait suggérer une pression psychologique plus forte que le verbe « conseiller ». La formulation retenue conserve à la fois son rôle de conseillère et le jugement moral explicite.
translation_notes:
  register: Français international moderne, narratif et digne. L’expression biblique « les voies de la maison d’Achab » est conservée, tandis que la seconde proposition est formulée de façon idiomatique et immédiatement compréhensible.
