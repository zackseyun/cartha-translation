- from: Lui aussi suivit les voies de la maison d’Achab, car sa mère lui conseillait de faire le mal[a].
  to: Lui aussi suivit les voies de la maison d’Achab, car sa mère était sa conseillère pour le conduire au mal[a].
  rationale: La révision rétablit la construction nominale correspondant à « était sa conseillère », tout en exprimant en français la portée causative de l’infinitif hifil par « le conduire au mal ». La note offre l’alternative verbale idiomatique sans créer d’ambiguïté quant au sujet de l’action mauvaise.
