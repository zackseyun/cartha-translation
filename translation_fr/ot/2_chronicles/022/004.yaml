source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, à l’exemple de la maison d’Achab, car les membres de cette maison étaient ses conseillers après la mort de son père, pour sa ruine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui entraîna sa ruine » ou « afin de le détruire ». L’expression hébraïque peut désigner soit l’issue de leurs conseils, soit leur intention destructrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: La tournure rend naturellement en français la formule hébraïque d’évaluation morale, tout en conservant le verbe « faire ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: « Aux yeux de » conserve l’image hébraïque et exprime clairement l’évaluation divine; le nom propre יהוה est translittéré « Yahweh ».
- source_word: כְּבֵית אַחְאָב
  choice: à l’exemple de la maison d’Achab
  rationale: La préposition כְּ marque ici la comparaison. « Maison » désigne la famille ou dynastie d’Achab, et non un bâtiment.
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: les membres de cette maison furent ses conseillers
  rationale: Le pronom pluriel renvoie collectivement à la maison d’Achab. L’explicitation légère de son antécédent évite en français un « ils » obscur sans modifier le référent.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: après la mort de son père
  rationale: Cette formulation française claire et digne correspond directement à la construction hébraïque.
- source_word: לְמַשְׁחִית לוֹ
  choice: pour sa ruine
  rationale: Cette formulation compacte préserve l’ambiguïté de la construction, qui peut exprimer le résultat destructeur de leurs conseils ou leur intention.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Intention ou résultat dans לְמַשְׁחִית לוֹ
  choice: pour sa ruine
  alternative: afin de le détruire; ce qui entraîna sa ruine
  rationale: L’hébreu permet de comprendre la formule comme un but destructeur ou comme l’issue des conseils reçus. Le texte principal ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Maison d’Achab » conserve le langage dynastique biblique; « les membres de cette maison » clarifie seulement l’antécédent du pluriel hébreu. Le marqueur [a] est placé sur la proposition qu’il explique.
