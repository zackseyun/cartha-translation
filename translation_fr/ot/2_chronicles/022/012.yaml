  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: fr
  text: Il resta avec eux dans la maison de Dieu[a], se tenant caché[b] pendant six ans, tandis qu’Athalie régnait sur le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire dans l’enceinte du temple; littéralement « dans la maison de Dieu ».
    reason: cultural_note
  - marker: b
    text: Ou « caché ». Le participe hébreu peut être compris dans un sens réfléchi (« se cachant ») ou comme décrivant son état de personne tenue cachée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִתָּם
  choice: Il resta avec eux
  rationale: Dans ce contexte narratif, וַיְהִי exprime la présence continue de Joas auprès de ceux qui le cachaient. « Il resta » rend cette continuité plus naturellement en français que le calque « il fut ».
- source_word: בְּבֵית הָאֱלֹהִים
  choice: dans la maison de Dieu
  rationale: Cette traduction conserve l’expression hébraïque littérale tout en restant claire; le contexte désigne le temple et ses dépendances.
- source_word: מִתְחַבֵּא
  choice: se tenant caché
  rationale: Le participe hitpael présente une situation continue et peut avoir une valeur réfléchie ou moyenne. « Se tenant caché » rend l’état prolongé sans exclure le fait que d’autres assuraient sa dissimulation.
- source_word: שֵׁשׁ שָׁנִים
  choice: pendant six ans
  rationale: « Pendant » exprime naturellement en français la durée indiquée directement en hébreu.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: tandis qu’Athalie régnait
  rationale: Le participe féminin décrit une action en cours, contemporaine des six années durant lesquelles Joas demeura caché.
- source_word: עַל הָאָרֶץ
  choice: sur le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire gouverné, c’est-à-dire le pays de Juda, sans que « royaume » soit explicitement présent dans l’hébreu.
theological_decisions: []
