  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: fr
  text: Il retourna donc à Jizréel pour se rétablir des blessures qu’on lui avait infligées à Rama, alors qu’il combattait Hazaël, roi d’Aram. Azaria[a], fils de Yehoram, roi de Juda, descendit à Jizréel pour voir[b] Yehoram, fils d’Achab, parce que celui-ci était malade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte des Chroniques porte ici « Azaria » ; le même roi est appelé « Ahazia » ailleurs.
    reason: alternative_reading
  - marker: b
    text: Ou « pour rendre visite à ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Il retourna donc
  rationale: Le verbe שׁוב exprime le retour, et la forme narrative marque la suite du récit. « Donc » assure ici un enchaînement naturel sans ajouter de lien causal fort.
- source_word: לְהִתְרַפֵּא
  choice: pour se rétablir
  rationale: La forme hitpael de רפא désigne ici le rétablissement à la suite de blessures. « Se rétablir » est naturel en français moderne et convient à une période de convalescence.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: des blessures qu’on lui avait infligées
  rationale: Le nom peut désigner des coups ou les blessures qui en résultent. La tournure impersonnelle « on » conserve l’indétermination du sujet pluriel hébreu tout en restant idiomatique.
- source_word: בָרָמָה
  choice: à Rama
  rationale: Le texte massorétique porte Rama; cette forme est conservée sans harmonisation avec le récit parallèle.
- source_word: בְּהִלָּחֲמוֹ אֶת
  choice: lorsqu’il avait combattu
  rationale: L’infinitif construit avec בְּ exprime la circonstance temporelle; le verbe « combattre » permet en français l’objet direct et restitue clairement le contexte hostile.
- source_word: וַעֲזַרְיָהוּ
  choice: Azaria
  rationale: Le texte des Chroniques donne ici la forme Azariahou, rendue selon la forme française usuelle « Azaria », sans l’harmoniser avec « Ahazia » employé ailleurs pour ce roi.
- source_word: יָרַד
  choice: descendit
  rationale: La traduction conserve la nuance directionnelle explicite de ירד, courante dans le récit géographique hébreu.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: « Voir » correspond au sens lexical direct, tout en pouvant désigner contextuellement une visite; cette valeur idiomatique est signalée en note.
- source_word: יְהוֹרָם בֶּן אַחְאָב
  choice: Yehoram, fils d’Achab
  rationale: « Yehoram » reflète la forme pleine du nom hébreu plutôt que sa forme abrégée « Joram ».
- source_word: כִּי חֹלֶה הוּא
  choice: parce que celui-ci était malade
  rationale: « Celui-ci » lève seulement l’ambiguïté grammaticale que créerait le pronom français « il » entre les deux hommes nommés, sans préciser davantage la nature de l’état exprimé par חֹלֶה.
theological_decisions:
- issue: Variation du nom royal dans le récit du Chroniste
  choice: Conserver « Azaria » dans le texte principal
  alternative: Ahazia
  rationale: Le texte hébreu de ce verset porte le nom Azariahou. Le conserver respecte la priorité de la source sans harmoniser silencieusement avec les autres occurrences où ce même roi est appelé Ahazia.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms « Jizréel », « Hazaël », « Aram », « Azaria », « Yehoram » et « Achab » suivent des formes françaises lisibles tout en restant proches de l’hébreu. Les deux appels de note sont placés immédiatement après les mots qu’ils expliquent.
