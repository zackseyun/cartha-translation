source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: fr
  text: Mais Yehoshabath, fille du roi, prit Joas, fils d’Ahazia, et le déroba du milieu des fils du roi que l’on mettait à mort[a]. Elle le plaça avec sa nourrice dans une chambre à coucher[b]. Yehoshabath, fille du roi Joram et femme du prêtre Yehoyada — car elle était la sœur d’Ahazia —, le cacha loin d’Athalie, et celle-ci ne le mit pas à mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui devaient être mis à mort »; le participe hébreu peut présenter les princes comme en cours d’exécution ou destinés à l’être.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la chambre des lits ».'
    reason: lexical_alternative
  - marker: c
    text: Le sujet féminin du dernier verbe n’est pas exprimé en hébreu. Il s’agit très probablement d’Athalie; grammaticalement, il pourrait aussi s’agir de Yehoshabath.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: prit
  rationale: Le verbe לקח exprime ici l’action simple de prendre. « Sauva » expliciterait le résultat sans rendre directement la valeur lexicale du verbe.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: le déroba
  rationale: גנב signifie littéralement voler ou dérober. « Le déroba » conserve l’idée d’un enlèvement clandestin sans suggérer un rapt malveillant.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: du milieu des fils du roi que l’on mettait à mort
  rationale: Le participe passif הַמּוּמָתִים peut décrire ceux qui étaient en train d’être exécutés ou voués à l’exécution. Le texte principal retient l’aspect en cours et la note signale l’autre nuance possible.
- source_word: מֵינִקְתּוֹ
  choice: sa nourrice
  rationale: Le nom désigne la femme qui allaitait l’enfant. « Nourrice » est naturel en français et convient au contexte, même si « nourrice qui l’allaitait » serait plus explicite.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: dans une chambre à coucher
  rationale: L’expression signifie littéralement « dans la chambre des lits ». « Chambre à coucher » en donne le sens dans un français actuel, tandis que la forme littérale est conservée en note.
- source_word: וַתַּסְתִּירֵהוּ
  choice: le cacha
  rationale: סתר signifie cacher ou dissimuler. « Le cacha » est direct, naturel et fidèle.
- source_word: אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן
  choice: femme du prêtre Yehoyada
  rationale: Cette formulation conserve l’identification de Yehoshabath et rattache clairement le titre de prêtre à Yehoyada.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: elle était la sœur d’Ahazia
  rationale: La proposition explicative est gardée sous forme d’incise afin de préserver l’information familiale sans alourdir le fil de l’action. כִּי introduit ici l’explication de l’identité et du motif de Yehoshabath.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: loin d’Athalie
  rationale: מִפְּנֵי signifie littéralement « de devant » ou « hors de la présence de ». Dans ce contexte, « loin d’Athalie » exprime qu’il fut soustrait à sa vue et à son pouvoir.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: et celle-ci ne le mit pas à mort
  rationale: Le sujet féminin n’est pas exprimé en hébreu. Le contexte favorise Athalie; « celle-ci » rend cette lecture claire dans le texte principal, tandis qu’une note conserve l’ambiguïté grammaticale.
theological_decisions:
- issue: Sujet implicite de וְלֹא הֱמִיתָתְהוּ
  choice: Athalie est comprise comme sujet de « ne le mit pas à mort ».
  alternative: Yehoshabath pourrait grammaticalement être le sujet du dernier verbe.
  rationale: Après « le cacha loin d’Athalie », le sens contextuel le plus naturel est qu’Athalie ne réussit pas à tuer Joas. Toutefois, comme le verbe hébreu ne nomme pas son sujet et que plusieurs femmes sont mentionnées, l’autre analyse est signalée en note plutôt que supprimée.
translation_notes:
  register: 'Français moderne, narratif et digne. Les noms propres suivent des formes françaises/translittérées aisément reconnaissables : Yehoshabath, Joas, Ahazia, Joram, Yehoyada et Athalie. La répétition du nom et des liens familiaux est conservée parce qu’elle appartient à la structure explicative du verset. Les tirets isolent l’incise généalogique sans effacer le lien causal porté par כִּי.'
