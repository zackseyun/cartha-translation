  to: Mais Yehoshabath, fille du roi, prit Joas, fils d’Ahazia, et le déroba du milieu des fils du roi que l’on mettait à mort[a]. Elle le plaça avec sa nourrice dans une chambre à coucher[b]. Yehoshabath, fille du roi Joram et femme du prêtre Yehoyada — car elle était la sœur d’Ahazia —, le cacha loin d’Athalie, et celle-ci ne le mit pas à mort[c].
