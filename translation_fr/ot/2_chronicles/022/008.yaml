source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: fr
  text: Il arriva que, pendant que Jéhu exerçait le jugement[a] contre la maison d’Achab, il trouva les hauts responsables de Juda et les fils des frères d’Achazia[b], qui étaient au service d’Achazia, et il les tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jugeait la maison d’Achab ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les neveux d’Achazia.
    reason: lexical_clarification
lexical_decisions:
- source_word: כְּהִשָּׁפֵט ... עִם
  choice: pendant que Jéhu exerçait le jugement contre
  rationale: La tournure temporelle כְּ avec l’infinitif est rendue naturellement par « pendant que ». « Exerçait le jugement » conserve la portée judiciaire de שׁפט, tandis que « contre » exprime ici le caractère hostile de l’action sans ajouter une approbation divine explicite.
- source_word: בֵּית אַחְאָב
  choice: la maison d’Achab
  rationale: Cette expression française conserve l’image biblique de la maison comme famille et lignée, sans la réduire au seul sens de « dynastie ».
- source_word: שָׂרֵי יְהוּדָה
  choice: les hauts responsables de Juda
  rationale: שָׂרִים désigne ici des personnages de rang élevé. « Hauts responsables » est actuel et suffisamment large, sans laisser entendre qu’ils étaient nécessairement des princes de sang royal.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: les fils des frères d’Ahazia
  rationale: La formulation relationnelle explicite de l’hébreu est conservée dans le texte; la note précise qu’il s’agit des neveux d’Ahazia.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: qui étaient au service d’Ahazia
  rationale: Cette formulation rend le participe comme une fonction en cours et reste ouverte quant à la nature exacte de leur service, sans lui donner une coloration cultuelle.
- source_word: וַיַּהַרְגֵם
  choice: et il les tua
  rationale: Rendu direct et sobre du verbe הרג, sans atténuation ni dramatisation supplémentaire.
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule garde la fonction narrative de l’hébreu dans un français digne et intelligible.
theological_decisions:
- issue: Nature de l’action de Jéhu envers la maison d’Achab
  choice: exerçait le jugement contre la maison d’Achab
  alternative: jugeait la maison d’Achab
  rationale: Le rendu maintient la force judiciaire de שׁפט et le contexte punitif, mais ne transforme pas cette formulation en déclaration explicite selon laquelle chaque mise à mort mentionnée aurait reçu l’approbation divine.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte conserve les idiomes bibliques porteurs de sens (« maison d’Achab », « fils des frères »), tout en employant une désignation actuelle et claire pour les שָׂרִים.
