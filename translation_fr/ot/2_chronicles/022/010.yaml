source:
  edition: WLC
  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: fr
  text: Athalie, mère d’Ahazia, vit que son fils était mort. Elle se leva et fit périr[a] toute la descendance royale de la maison de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme verbale hébraïque est difficile et signifie littéralement « parla ». Cependant, le contexte et le récit parallèle de 2 Rois 11.1 appuient le sens « fit périr » ou « mit à mort ».
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Athalie
  rationale: Le nom propre est rendu selon sa forme française biblique usuelle. Le waw narratif n’exige pas ici l’ajout d’un marqueur temporel explicite.
- source_word: אֵם אֲחַזְיָהוּ
  choice: mère d’Ahazia
  rationale: Cette formulation appositive rend clairement et naturellement la relation exprimée par l’état construit hébreu.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: vit que son fils était mort
  rationale: Le verbe ראה suivi de כי introduit la constatation d’un fait; l’imparfait d’état « était mort » correspond étroitement à la proposition hébraïque.
- source_word: וַתָּקָם
  choice: elle se leva
  rationale: Cette tournure conserve la force narrative et le caractère résolu de l’action, sans adopter le registre plus familier de « elle se mit debout ».
- source_word: וַתְּדַבֵּר
  choice: fit périr
  rationale: Bien que la forme consonantique soit celle du verbe « parler », le complément d’objet, le contexte et le parallèle de 2 Rois 11.1 indiquent ici une mise à mort. « Fit périr » exprime le résultat sans préciser indûment le procédé ni l’exécution personnelle.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: toute la descendance royale
  rationale: זרע signifie littéralement « semence, descendance »; dans ce contexte dynastique, « descendance royale » est à la fois fidèle et idiomatique.
- source_word: לְבֵית יְהוּדָה
  choice: de la maison de Juda
  rationale: La préposition marque ici l’appartenance à la maison dynastique de Juda; le complément français en « de » la rend naturellement.
theological_decisions:
- issue: Sens du verbe difficile וַתְּדַבֵּר
  choice: Rendre le sens contextuel par « fit périr »
  alternative: « parla », ou « parla contre »
  rationale: Une traduction mécanique par « parla » s’accorde mal avec le complément direct « toute la descendance royale ». Le récit parallèle de 2 Rois 11.1 confirme une action d’extermination. La difficulté de la forme hébraïque reste signalée en note au lieu d’être dissimulée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste sobre et narrative. « Maison de Juda » conserve le langage dynastique du texte, tandis que « descendance royale » évite le calque obscur « semence du royaume ». Le marqueur de note est placé sur le verbe concerné.
