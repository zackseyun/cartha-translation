base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: fr
  text: Les habitants de Jérusalem établirent Ahazia, le plus jeune fils de Joram, roi à sa place, car la bande de pillards qui était venue avec les Arabes[a] au camp avait tué tous ses fils aînés. Ainsi, Ahazia, fils de Joram, roi de Juda, devint roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Arabes ». La préposition hébraïque employée avec « Arabes » peut exprimer l’accompagnement ou la présence au milieu d’un groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: établirent comme roi
  rationale: Le hiphil de מלך exprime ici l’installation d’une personne comme roi; cette tournure française conserve clairement le sens causatif.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Rend naturellement et avec dignité le participe construit désignant ceux qui habitent Jérusalem.
- source_word: בְנוֹ הַקָּטֹן
  choice: son plus jeune fils
  rationale: קטן signifie littéralement « petit » ou « jeune », mais le contraste avec les fils plus âgés indique ici le benjamin.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: La locution exprime la substitution et la succession royale.
- source_word: כָל הָרִאשֹׁנִים
  choice: tous les fils plus âgés
  rationale: L’expression signifie littéralement « tous les premiers/précédents »; le contexte immédiat permet d’expliciter qu’il s’agit des fils de Joram plus âgés qu’Ahazia.
- source_word: הַגְּדוּד
  choice: la bande de pillards
  rationale: גדוד désigne souvent une troupe ou une bande armée effectuant une incursion; « bande de pillards » communique cette nuance militaire et prédatrice.
- source_word: הַבָּא בָעַרְבִים
  choice: qui était venue avec les Arabes
  rationale: La préposition ב est comprise dans son sens associatif, tout en signalant en note la possibilité de la comprendre autrement.
- source_word: לַמַּחֲנֶה
  choice: dans le camp
  rationale: Le contexte d’une incursion favorise l’idée d’une entrée dans le camp plutôt que d’un simple mouvement vers celui-ci.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule d’accession, le qal a une valeur ingressive; « devint roi » exprime l’avènement plutôt que la durée du règne.
- source_word: אֲחַזְיָהוּ בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: Ahazia, fils de Joram, roi de Juda
  rationale: La ponctuation française indique clairement que « roi de Juda » qualifie Joram.
