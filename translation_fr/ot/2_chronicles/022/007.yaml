source:
  edition: WLC
  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: fr
  text: La ruine d’Ahazia, lorsqu’il se rendit auprès de Yoram, venait de Dieu. Lorsqu’il arriva, il sortit avec Yehoram vers Jéhu[a], fils de Nimshi, que Yahweh avait oint pour retrancher la maison d’Achab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre Jéhu » ou « à la rencontre de Jéhu ». L’hébreu dit littéralement « vers Jéhu », bien que le contexte évoque une rencontre hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: venait de Dieu
  rationale: La préposition מִן exprime ici la source ou l’origine. Cette formulation attribue clairement la ruine à Dieu sans préciser s’il s’agit d’une action directe, d’un jugement providentiel ou d’une permission.
- source_word: תְּבוּסַת
  choice: la ruine
  rationale: Le nom peut évoquer l’écrasement, la défaite ou la ruine. « Ruine » convient au sort désastreux d’Ahazia sans limiter le sens à une seule défaite militaire.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: liée à sa venue auprès de Yoram
  rationale: L’infinitif avec ל rattache la venue auprès de Yoram à la ruine d’Ahazia. « Liée à » préserve ce rapport tout en évitant de définir trop précisément sa valeur comme cause mécanique, moyen ou simple circonstance.
- source_word: וּבְבֹאוֹ
  choice: Lorsqu’il arriva
  rationale: La construction בְּ suivi de l’infinitif avec suffixe a ici une valeur temporelle.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: il sortit avec Yehoram en direction de Jéhu
  rationale: Le verbe יָצָא signifie « sortir », souvent dans un contexte militaire, tandis que אֶל indique littéralement la direction. Le texte principal ne transforme donc pas explicitement cette préposition en « contre ».
- source_word: יוֹרָם / יְהוֹרָם
  choice: Yoram / Yehoram
  rationale: Les deux formes distinctes du même nom présentes dans l’hébreu sont conservées plutôt qu’harmonisées.
- source_word: מְשָׁחוֹ
  choice: avait oint
  rationale: Le plus-que-parfait indique naturellement que l’onction de Jéhu avait précédé la rencontre racontée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: pour retrancher la maison d’Achab
  rationale: « Retrancher » conserve l’image et la portée judiciaire de הכרית, tandis que « maison » désigne ici la dynastie ou la famille d’Achab.
- source_word: בֶן נִמְשִׁי
  choice: fils de Nimshi
  rationale: La filiation est rendue directement, conformément à la formulation hébraïque.
theological_decisions:
- issue: Causalité divine dans la ruine d’Ahazia
  choice: La ruine « venait de Dieu »
  alternative: Dieu avait décrété la ruine d’Ahazia / Dieu avait permis sa ruine
  rationale: Le texte attribue à Dieu l’origine de la ruine, mais ne précise pas le mode de cette causalité. La traduction conserve cette tension.
- issue: Finalité de l’onction de Jéhu
  choice: « pour retrancher la maison d’Achab »
  alternative: pour détruire la maison d’Achab
  rationale: La formulation conserve l’idée de jugement et d’élimination dynastique sans l’élargir au-delà de l’expression hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. Les noms Yoram et Yehoram reproduisent la variation de l’hébreu. La formulation « liée à sa venue » maintient le lien syntaxique avec la ruine sans imposer une analyse causale plus précise que le texte source.
