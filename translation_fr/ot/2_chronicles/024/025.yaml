  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: fr
  text: Quand ils s’éloignèrent de lui — car ils le laissèrent atteint de nombreuses maladies —, ses serviteurs conspirèrent contre lui à cause du sang des fils de Jehoïada, le prêtre[a]. Ils le tuèrent sur son lit, et il mourut. On l’enterra dans la cité de David, mais pas dans les tombeaux des rois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « le sang des fils de Jehoïada, le prêtre ». D’après le contexte, il pourrait s’agir plus précisément du « fils de Jehoïada », c’est-à-dire Zacharie (24.20-22).
    reason: Lecture alternative suggérée par le contexte immédiat, tout en conservant le pluriel du texte massorétique dans le corps du verset.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Quand ils se retirèrent loin de lui
  rationale: La construction ב avec l’infinitif construit a une valeur temporelle (« quand »), et מן exprime l’éloignement. « Se retirèrent » convient au départ des Araméens dans le contexte.
- source_word: כִּי עָזְבוּ אֹתוֹ בְמחליים רַבִּים
  choice: car ils le laissèrent atteint de nombreuses maladies
  rationale: כִּי introduit ici l’explication. Le pluriel מַחֳלָיִם est conservé par « maladies », tandis que « atteint de » produit un français naturel sans réduire le terme à de simples blessures.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: ses serviteurs conspirèrent contre lui
  rationale: Le hitpael de קשר désigne une conspiration; עֲבָדָיו est rendu directement par « ses serviteurs », terme approprié au cadre de la cour royale.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: à cause du sang des fils du prêtre Jehoïada
  rationale: La préposition ב est comprise comme causale. « À cause du sang » conserve l’expression hébraïque de responsabilité liée au sang versé, et le pluriel massorétique בְּנֵי est maintenu.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Ils le tuèrent sur son lit, et il mourut
  rationale: הרג signifie normalement « tuer ». La reprise explicite « et il mourut » respecte la séquence narrative du texte hébreu.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: On l’enterra dans la cité de David, mais pas dans les tombeaux des rois
  rationale: Le pronom indéfini « on » évite d’attribuer nécessairement l’ensevelissement aux assassins. La formulation française resserrée conserve le contraste entre l’inhumation dans la cité de David et l’exclusion des tombeaux royaux.
theological_decisions:
- issue: Pluriel massorétique « fils de Jehoïada » face au singulier attendu d’après le contexte
  choice: Maintenir dans le texte principal « les fils du prêtre Jehoïada »
  alternative: « le fils du prêtre Jehoïada », c’est-à-dire Zacharie
  rationale: Le texte hébreu fourni porte le pluriel בְּנֵי. Le contexte de 24.20-22 vise cependant explicitement Zacharie, fils de Jehoïada. La traduction conserve donc la tension textuelle plutôt que de l’harmoniser silencieusement, et signale le singulier en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Cité de David » conserve l’appellation traditionnelle et toponymique; « tombeaux » convient au complexe funéraire royal.
