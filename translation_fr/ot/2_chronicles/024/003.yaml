  text: וַ/יִּשָּׂא ל֥/וֹ יְהוֹיָדָ֖ע נָשִׁ֣ים שְׁתָּ֑יִם וַ/יּ֖וֹלֶד בָּנִ֥ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Jehoïada prit pour lui deux épouses[a], et il eut des fils et des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, moins probable : « Jehoïada prit deux épouses et eut des fils et des filles », si Jehoïada est compris comme le sujet de tout le verset.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: choisit
  rationale: Avec « pour lui » et dans ce contexte matrimonial, le verbe indique que Jehoïada prit ou procura des femmes pour Joas. « Choisit » exprime naturellement en français le rôle actif de Jehoïada sans faire de lui l’époux.
- source_word: לּוֹ
  choice: lui
  rationale: Le pronom désigne le bénéficiaire de l’action, très probablement Joas d’après le contexte immédiat du récit.
- source_word: יְהוֹיָדָע
  choice: Jehoïada
  rationale: Transcription française usuelle du nom hébreu.
- source_word: נָשִׁים שְׁתָּיִם
  choice: deux femmes
  rationale: Dans ce contexte, « femmes » signifie épouses et conserve une formulation française naturelle et digne.
- source_word: וַיּוֹלֶד
  choice: il eut
  rationale: Le hiphil de ילד avec un sujet masculin signifie engendrer. « Il eut des fils et des filles » est une expression naturelle en français moderne, tout en laissant l’antécédent du sujet implicite comme en hébreu.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La traduction maintient la distinction explicite entre les enfants de sexe masculin et féminin.
theological_decisions:
- issue: Référent du pronom et du sujet du second verbe
  choice: Jehoïada choisit deux femmes pour Joas, puis Joas eut des fils et des filles.
  alternative: Jehoïada prit lui-même deux femmes et engendra des fils et des filles.
  rationale: Le contexte narratif centré sur Joas et le bénéficiaire exprimé par לּוֹ favorisent nettement Joas comme époux et père. Toutefois, puisque Jehoïada est le dernier sujet explicitement nommé, la lecture qui en fait le sujet de tout le verset reste grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le changement implicite de sujet et la note rend compte de l’ambiguïté syntaxique réelle.
