  text: וְ/אֵ֖לֶּה הַ/מִּתְקַשְּׁרִ֣ים עָלָ֑י/ו זָבָ֗ד בֶּן שִׁמְעָת֙ הָֽ/עַמּוֹנִ֔ית וִ/יה֣וֹזָבָ֔ד בֶּן שִׁמְרִ֖ית הַ/מּוֹאָבִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: fr
  text: 'Et voici ceux qui conspirèrent contre lui : Zabad, fils de Shiméath l’Ammonite, et Yehozabad, fils de Shimrith la Moabite.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Et voici
  rationale: Cette formule introduit naturellement en français l’identification des conspirateurs tout en conservant le lien narratif marqué par la conjonction.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  choice: ceux qui conspirèrent contre lui
  rationale: Le participe hitpael de קשר exprime ici l’action de former une conspiration, et עָלָיו en désigne la cible. Le passé simple convient au registre narratif et évite de réduire l’expression au seul substantif « conspirateurs ».
- source_word: זָבָד בֶּן שִׁמְעָת
  choice: Zabad, fils de Shiméath
  rationale: Les noms propres sont translittérés sous des formes françaises lisibles, et בֶּן reçoit son équivalent généalogique habituel.
- source_word: הָעַמּוֹנִית
  choice: l’Ammonite
  rationale: La forme hébraïque féminine qualifie Shiméath et indique qu’elle est une femme ammonite. En français, l’article et le contexte rendent le féminin sans formulation lourde.
- source_word: וִיהוֹזָבָד בֶּן שִׁמְרִית
  choice: et Yehozabad, fils de Shimrith
  rationale: La conjonction est conservée, les noms sont translittérés, et la relation filiale est exprimée selon l’usage français.
- source_word: הַמּוֹאָבִית
  choice: la Moabite
  rationale: La forme féminine désigne Shimrith comme femme moabite; « la Moabite » est précis, naturel et non archaïque.
