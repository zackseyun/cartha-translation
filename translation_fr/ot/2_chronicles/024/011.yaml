source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: fr
  text: Chaque fois que les lévites apportaient le coffre[a] pour l’inspection royale, et qu’ils constataient qu’il y avait beaucoup d’argent[b], le secrétaire du roi et le fonctionnaire du grand prêtre venaient vider le coffre. Puis ils l’emportaient et le remettaient à sa place. Ils faisaient ainsi jour après jour et recueillaient de l’argent en abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi être traduit par « arche » ; ici, il désigne le coffre destiné à la collecte, et non l’arche de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « argent métal » ; dans ce contexte administratif, il désigne l’argent recueilli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: le coffre
  rationale: Dans ce contexte, le terme désigne le coffre destiné à recueillir les offrandes, et non l’arche de l’alliance. « Coffre » est naturel et évite cette confusion.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: le contrôle du roi
  rationale: Le nom évoque ici une inspection ou une supervision officielle. « Contrôle » convient au cadre administratif sans préciser excessivement la procédure.
- source_word: בְּיַד הַלְוִיִּם
  choice: les lévites apportaient
  rationale: L’expression idiomatique marque ici l’agent. La formulation française rend directement le rôle des lévites dans le transport du coffre.
- source_word: וְכִרְאוֹתָם
  choice: lorsqu’ils voyaient
  rationale: Cette traduction conserve le sujet pluriel implicite du texte hébreu et sa légère ambiguïté quant à l’identité exacte des personnes qui constatent le montant recueilli.
- source_word: רַב הַכֶּסֶף
  choice: qu’il contenait beaucoup d’argent
  rationale: כֶּסֶף peut désigner l’argent métal ou la monnaie. Ici, le contexte d’une collecte favorise « argent »; l’ajout de « contenait » explicite naturellement le rapport au coffre.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: le secrétaire du roi
  rationale: Dans ce cadre administratif, סוֹפֵר désigne un scribe exerçant une fonction de secrétaire. Le choix français communique clairement cette charge historique.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: le fonctionnaire du grand prêtre
  rationale: פְקִיד désigne un responsable ou agent officiel. « Fonctionnaire » garde la portée administrative sans lui attribuer un rang plus précis que le texte.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: vider le coffre
  rationale: Le verbe décrit ici le retrait du contenu du coffre. « Vider » est l’expression française directe et idiomatique.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: ils l’emportaient et le remettaient à sa place
  rationale: נשא exprime l’action de soulever ou d’emporter, puis le hifil de שוב celle de remettre l’objet à son emplacement. La séquence reste explicitement rendue.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: Ils faisaient ainsi jour après jour
  rationale: « Jour après jour » restitue le caractère habituel et répété de l’expression hébraïque.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: recueillirent de l’argent en abondance
  rationale: La formulation rend à la fois l’action de rassembler les dons et la grande quantité obtenue.
