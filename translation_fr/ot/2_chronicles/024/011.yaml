revisions:
- from: Chaque fois que les lévites apportaient le coffre[a] pour le contrôle du roi, lorsqu’ils voyaient qu’il contenait beaucoup d’argent[b], le secrétaire du roi et le fonctionnaire du grand prêtre venaient vider le coffre. Puis ils l’emportaient et le remettaient à sa place. Ils faisaient ainsi jour après jour et recueillirent de l’argent en abondance.
  to: Chaque fois que les lévites apportaient le coffre[a] pour l’inspection royale, et qu’ils constataient qu’il y avait beaucoup d’argent[b], le secrétaire du roi et le fonctionnaire du grand prêtre venaient vider le coffre. Puis ils l’emportaient et le remettaient à sa place. Ils faisaient ainsi jour après jour et recueillaient de l’argent en abondance.
  rationale: La révision rend plus naturelle l’expression de la supervision royale, évite l’ajout « il contenait » en conservant l’énoncé plus direct « il y avait beaucoup d’argent », unifie l’aspect itératif de la procédure et précise la note lexicale sur אַרוֹן.
  reviewer_model: gpt-5.6-terra
