id: 2CH.24.18
reference: 2 Chronicles 24:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: fr
  text: Ils abandonnèrent la maison de Yahvé, le Dieu de leurs pères, et servirent les ashérim[a] et les idoles. La colère s’abattit donc sur Juda et Jérusalem à cause de cette faute qu’ils avaient commise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les poteaux sacrés d’Ashéra ». Le terme hébreu désigne des objets cultuels associés à Ashéra et peut aussi évoquer la déesse Ashéra.
    reason: Alternative lexicale préservant l’ambiguïté culturelle et référentielle du terme hébreu.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonnèrent
  rationale: Le verbe עזב signifie quitter ou délaisser. « Abandonnèrent » exprime naturellement ici la rupture et l’infidélité, sans archaïsme.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction conserve l’expression hébraïque « maison de YHWH », qui désigne le temple dans ce contexte, sans remplacer l’image par une explicitation.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » rend le nom divin de manière reconnaissable en français moderne tout en le distinguant d’un titre comme « le Seigneur ».
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Cette formulation préserve l’expression familiale et son écho d’alliance; « ancêtres » serait plus immédiatement courant, mais moins proche de la tournure source.
- source_word: וַיַּעַבְדוּ
  choice: servirent
  rationale: עבד peut signifier servir ou rendre un culte. « Servirent » reste proche de l’hébreu et laisse le contexte cultuel déterminer le sens.
- source_word: הָאֲשֵׁרִים
  choice: les ashérim
  rationale: La translittération préserve l’ambiguïté entre des objets cultuels associés à Ashéra et l’évocation de la déesse; une note fournit l’explication nécessaire.
- source_word: הָעֲצַבִּים
  choice: les idoles
  rationale: Le terme désigne des images cultuelles avec une connotation polémique; « idoles » transmet clairement cette valeur religieuse.
- source_word: וַיְהִי קֶצֶף
  choice: La colère s’abattit donc
  rationale: La formulation exprime naturellement en français la venue de la colère comme conséquence, sans ajouter explicitement qu’elle vient de Dieu.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: sur Juda et Jérusalem
  rationale: « Sur » correspond à עַל et s’intègre naturellement à l’expression « la colère s’abattit sur ».
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: à cause de cette faute qu’ils avaient commise
  rationale: Le préfixe ב est causal, אַשְׁמָה exprime une faute entraînant culpabilité, et זֹאת est rendu par « cette ». La relative produit un français naturel tout en maintenant leur responsabilité.
theological_decisions:
- issue: Référent de « la colère »
  choice: Laisser la source divine implicite
  alternative: « La colère de Dieu » ou « la colère de Yahvé s’abattit »
  rationale: Le contexte indique une colère divine, mais l’hébreu dit seulement qu’il y eut de la colère. Ne pas ajouter le nom de Dieu préserve la formulation et la retenue du texte source.
- issue: Sens de אֲשֵׁרִים
  choice: Conserver le terme hébraïque francisé « ashérim »
  alternative: « poteaux sacrés d’Ashéra » ou « ashéras »
  rationale: Le mot peut viser des objets cultuels tout en évoquant la déesse Ashéra. La translittération évite de réduire indûment cette ambiguïté; la note présente l’interprétation matérielle courante.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; le vocabulaire demeure accessible. L’expression traditionnelle « le Dieu de leurs pères » est conservée pour sa portée familiale et liée à l’alliance.
