  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: fr
  text: Joas fit ce qui est droit aux yeux de Yahweh pendant toute la vie de Joïada, le prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire ». Avec הַיָּשָׁר, la tournure française naturelle est « faire ce qui est droit ».
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: L’adjectif יָשָׁר exprime ce qui est droit, juste ou conforme à la norme. « Ce qui est droit » convient à la formule d’évaluation royale tout en restant proche de l’hébreu.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression conserve la métaphore hébraïque qui présente l’évaluation du point de vue de Yahweh et demeure idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre substitutif.
- source_word: כָּל יְמֵי
  choice: pendant toute la vie de
  rationale: Littéralement « tous les jours de », cette expression désigne ici toute la durée de la vie de Yehoyada. La formulation choisie est naturelle en français et ne change pas la portée temporelle.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Translittération française qui reflète plus directement la forme hébraïque du nom.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le titre apposé indique explicitement la fonction de Yehoyada.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR, Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre divin au lieu de lui substituer un titre.
- issue: Portée temporelle de l’évaluation positive de Joas
  choice: pendant toute la vie du prêtre Yehoyada
  alternative: tous les jours du prêtre Yehoyada
  rationale: La restriction temporelle est maintenue sans extrapoler sur la conduite de Joas après la mort de Yehoyada; elle exprime seulement ce qu’affirme ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « ce qui est droit aux yeux de Yahweh » conserve l’image et la structure évaluative de l’hébreu, tandis que « pendant toute la vie » rend naturellement l’expression temporelle.
