base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: fr
  text: 'Mais le roi Joas ne se souvint pas de la bonté[a] que Jehoïada, son père[b], lui avait témoignée, et il tua son fils. Au moment de mourir, celui-ci dit : « Que Yahweh voie et en demande compte[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la loyauté » ou « de la fidélité » que Jehoïada lui avait témoignée.
    reason: lexical_alternative
  - marker: b
    text: Jehoïada n'était pas le père biologique de Joas. « Son père » évoque probablement le rôle paternel qu'il avait joué auprès de lui.
    reason: cultural_note
  - marker: c
    text: Ou « que Yahweh exige réparation » ou « qu'il recherche cette affaire ». Le verbe hébreu peut évoquer la recherche d'une faute ou d'un tort afin d'en demander compte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  choice: la bonté
  rationale: חֶסֶד peut désigner la bonté, la loyauté ou la fidélité. Dans cette relation humaine, « bonté » exprime naturellement le bienfait moralement obligeant de Jehoïada sans réduire le terme à une alliance formelle.
- source_word: זָכַר
  choice: ne se souvint pas
  rationale: Cette formulation conserve le sens direct de « se souvenir », tout en laissant le contexte faire comprendre l'ingratitude et l'absence de réponse fidèle.
- source_word: אָבִיו
  choice: son père
  rationale: Le texte hébreu dit littéralement « son père ». Jehoïada n'étant pas le père biologique de Joas, le terme évoque vraisemblablement son rôle paternel de protecteur et de bienfaiteur; cette tension est conservée dans le texte et expliquée en note.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: et il tua son fils
  rationale: Formulation directe qui rend le fait que Joas causa la mort du fils de Jehoïada, sans préciser davantage le cadre judiciaire ou politique.
- source_word: וּכְמוֹתוֹ
  choice: Au moment de mourir
  rationale: La construction temporelle situe les paroles dans le moment de la mort de la victime. « Celui-ci » clarifie sobrement que le locuteur est le fils de Jehoïada.
- source_word: יֵרֶא יְהוָה
  choice: Que Yahweh voie
  rationale: Le jussif exprime un souhait ou un appel adressé à Dieu, et non une simple affirmation au futur.
- source_word: וְיִדְרֹשׁ
  choice: et demande des comptes
  rationale: דרש peut évoquer la recherche d'une faute et l'exigence d'une reddition de comptes. Cette expression française actuelle garde la portée judiciaire sans imposer le sens plus étroit de vengeance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Portée de l'appel final du fils de Jehoïada
  choice: Un appel à Yahweh pour qu'il voie l'injustice et en demande compte
  alternative: Une demande explicite de vengeance immédiate, ou une simple déclaration selon laquelle Yahweh voit
  rationale: Les formes jussives présentent une supplication judiciaire. La traduction conserve sa gravité et sa tension sans préciser la forme que prendra le jugement divin.
- issue: Désignation de Jehoïada comme père de Joas
  choice: Conserver « son père » dans le texte
  alternative: Expliciter « celui qui avait été comme un père pour lui »
  rationale: Le sens paternel ou honorifique est probable d'après le contexte, mais l'expliciter dans le corps du verset supprimerait la formulation et l'ambiguïté authentiques de l'hébreu.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Celui-ci » évite de faire croire que Joas prononce les paroles tout en maintenant une formulation concise. Les noms sont rendus sous les formes françaises Joas et Jehoïada; le nom divin est translittéré Yahweh.
