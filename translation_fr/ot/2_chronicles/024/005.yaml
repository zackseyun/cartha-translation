  source_fidelity: 'Le texte français rend fidèlement les éléments essentiels du verset hébreu : rassemblement des prêtres et des Lévites, envoi dans les villes de Juda, collecte d’argent auprès de tout Israël, réparation de la maison de Dieu, récurrence annuelle, injonction pressante et contraste final avec le manque d’empressement des Lévites. « Auprès de tout Israël » préserve sans la résoudre la portée de מִכָּל־יִשְׂרָאֵל.'
