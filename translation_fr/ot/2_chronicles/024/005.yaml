  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: fr
  text: 'Il rassembla les prêtres et les Lévites et leur dit : « Allez dans les villes de Juda et recueillez, auprès de tout Israël, de l’argent afin de réparer la maison de votre Dieu, d’année en année[a]. Et vous, empressez-vous de le faire. » Mais les Lévites ne s’empressèrent pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque année ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Il rassembla
  rationale: Le qal de קבץ signifie ici réunir des personnes; « rassembler » convient naturellement aux prêtres et aux Lévites.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: Allez dans les villes de Juda
  rationale: L’impératif de יצא comporte l’idée de partir; en français, « allez dans » exprime naturellement le déplacement vers les villes.
- source_word: וְקִבְצוּ ... כֶּסֶף
  choice: recueillez ... de l’argent
  rationale: Avec un objet monétaire, « recueillir de l’argent » est idiomatique. כֶּסֶף désigne littéralement l’argent métal, mais sert couramment à désigner la monnaie.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: auprès de tout Israël
  rationale: Cette formulation conserve la portée collective et covenantale d’« Israël » sans la réduire à Juda ni la paraphraser comme un territoire.
- source_word: לְחַזֵּק אֶת בֵּית אֱלֹהֵיכֶם
  choice: afin de réparer la maison de votre Dieu
  rationale: חזק signifie fondamentalement fortifier ou rendre solide; appliqué à un bâtiment, il désigne sa remise en état. « Maison » maintient l’expression hébraïque plutôt que de l’expliciter par « temple ».
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: d’année en année
  rationale: L’expression rend l’idée d’une action annuelle récurrente tout en restant proche de l’idiome hébreu.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר ... וְלֹא מִהֲרוּ
  choice: Et vous, empressez-vous de le faire ... ne s’empressèrent pas
  rationale: La répétition de מהר est conservée afin de faire ressortir le contraste entre l’ordre pressant et l’inaction des Lévites.
theological_decisions:
- issue: Portée de « tout Israël »
  choice: Conserver « auprès de tout Israël »
  alternative: auprès de tous les Israélites; auprès de tout le peuple de Juda
  rationale: Le texte hébreu dit explicitement « tout Israël ». Cette désignation peut dépasser le seul royaume de Juda; la traduction en préserve donc la portée historique et théologique sans la préciser davantage.
- issue: Sens de « maison de votre Dieu »
  choice: Conserver « maison » dans le texte
  alternative: temple de votre Dieu
  rationale: Le contexte identifie bien le temple, mais « maison » traduit formellement בֵּית et préserve l’expression théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme lexical autour de « s’empresser » est volontairement maintenu. « Argent » est choisi sans note, car le français emploie le même mot pour le métal et la monnaie, ce qui préserve adéquatement la polysémie de כֶּסֶף.
