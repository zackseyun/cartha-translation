base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: fr
  text: Ils conspirèrent contre lui[a] et, sur l’ordre du roi, le lapidèrent[b] dans la cour de la maison de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils complotèrent contre lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils le lapidèrent avec une pierre » ; dans cette expression hébraïque, le singulier ne signifie pas qu’une seule pierre fut employée, mais désigne une exécution par lapidation.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « du temple de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: ils conspirèrent contre lui
  rationale: 'Avec עַל, le verbe קשר exprime ici une action collective hostile : conspirer ou comploter contre quelqu’un. « Conspirèrent contre lui » est naturel et précis en français.'
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: le lapidèrent
  rationale: רגם désigne la lapidation. Le complément singulier אֶבֶן, littéralement « avec une pierre/de la pierre », appartient à l’expression hébraïque et n’exige pas en français la formulation redondante « le lapidèrent à coups de pierres ».
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: sur l’ordre du roi
  rationale: מִצְוָה désigne ici un ordre revêtu d’autorité. « Sur l’ordre du roi » rend clairement la responsabilité directe du roi.
- source_word: בַּחֲצַר
  choice: dans la cour
  rationale: חָצֵר désigne la cour ou l’espace extérieur clos du sanctuaire. « Dans la cour » convient naturellement au contexte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la « maison » et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de lui substituer un titre.
- issue: Responsabilité du roi dans l’exécution
  choice: sur l’ordre du roi
  alternative: conformément au commandement du roi
  rationale: La formulation maintient sans atténuation l’affirmation du texte selon laquelle la lapidation fut accomplie sur l’ordre royal.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique écrit. La syntaxe reste fluide tout en conservant l’image de la « maison de Yahweh » et l’enchaînement causal du texte hébreu.
