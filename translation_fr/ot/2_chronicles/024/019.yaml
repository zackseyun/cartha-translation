source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: fr
  text: Pourtant, il envoya parmi eux des prophètes afin de les ramener à Yahweh. Ceux-ci témoignèrent contre eux[a], mais ils ne voulurent pas écouter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les avertirent ». Le verbe hébreu peut désigner un avertissement solennel; ici, il peut aussi évoquer un témoignage porté contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם
  choice: il envoya parmi eux
  rationale: « Envoya » rend naturellement le verbe narratif שׁלח. Avec des personnes, בָּהֶם peut décrire l’envoi au milieu du groupe; « parmi eux » conserve cette nuance.
- source_word: נְבִאִים
  choice: des prophètes
  rationale: Équivalent français direct et usuel de נְבִיאִים.
- source_word: לַהֲשִׁיבָם
  choice: afin de les ramener
  rationale: La forme causative de שׁוב signifie faire revenir. « Les ramener » exprime à la fois la causalité et le retour relationnel vers Dieu.
- source_word: אֶל יְהוָה
  choice: à Yahweh
  rationale: Le nom divin est translittéré conformément à la convention du projet; la préposition marque le retour vers Yahweh.
- source_word: וַיָּעִידוּ בָם
  choice: Ceux-ci témoignèrent contre eux
  rationale: Le hiphil de עוד peut signifier avertir solennellement ou porter témoignage. « Témoignèrent contre eux » préserve ici la nuance judiciaire de l’intervention prophétique; « ceux-ci » lève naturellement en français l’ambiguïté du sujet sans modifier son référent.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: mais ils ne voulurent pas écouter
  rationale: Le verbe exprime une écoute attentive. Dans ce contexte de refus persistant, cette formulation française rend la portée volontaire du manque d’écoute.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom propre divin présent dans l’hébreu et suit la convention indiquée pour le projet.
- issue: Portée de וַיָּעִידוּ בָם
  choice: témoignèrent contre eux
  alternative: les avertirent
  rationale: Le contexte de réprimande prophétique permet une nuance judiciaire de témoignage à charge, tout en laissant en note l’autre valeur lexicale réelle d’avertissement solennel.
translation_notes:
  register: Français international moderne, digne et accessible. « Pourtant » marque le contraste contextuel; la division en deux phrases évite une coordination lourde. Le marqueur de note est placé immédiatement après l’expression qu’il explique.
