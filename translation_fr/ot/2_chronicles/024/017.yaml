source:
  edition: WLC
  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: fr
  text: Après la mort de Yehoïada, les dignitaires de Juda[a] vinrent se prosterner devant le roi. Alors le roi les écouta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes de Juda » ou « les dirigeants de Juda ».
    reason: lexical_alternative
  - marker: b
    text: « Les écouta » peut aussi avoir le sens de « leur prêta attention » ou « suivit leur avis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת
  choice: Après la mort de
  rationale: Cette formulation française naturelle rend la relation temporelle et la construction nominale hébraïque, sans alourdir la phrase par le « et » initial.
- source_word: יְהוֹיָדָע
  choice: Yehoïada
  rationale: Translittération française lisible du nom hébreu, avec le tréma indiquant que les voyelles se prononcent séparément.
- source_word: בָּאוּ
  choice: vinrent
  rationale: Le passé simple convient au récit historique et rend simplement le mouvement vers le roi.
- source_word: שָׂרֵי יְהוּדָה
  choice: les dignitaires de Juda
  rationale: « Dignitaires » exprime le rang dirigeant des שָׂרִים dans une langue actuelle, sans les présenter nécessairement comme des princes de sang.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: se prosterner devant le roi
  rationale: Cette expression conserve le geste physique de soumission ou d'hommage sans le qualifier de culte rendu au roi.
- source_word: אָז
  choice: Alors
  rationale: Marque naturellement l'étape suivante et sa relation avec la démarche des dignitaires.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: le roi les écouta
  rationale: Rend l'idiome hébreu sans expliciter à l'excès s'il s'agit seulement d'écouter ou aussi de suivre leur avis.
theological_decisions:
- issue: Nature du geste des dignitaires envers le roi
  choice: se prosterner devant le roi
  alternative: lui rendre hommage ; se courber devant lui ; l'adorer
  rationale: Le verbe hébreu peut désigner une prosternation exprimant le respect, la soumission ou le culte selon le contexte. Puisque l'objet est ici un roi humain, « adorer » introduirait une interprétation théologique excessive ; « se prosterner » préserve la portée du geste et son ambiguïté.
- issue: Portée de l'écoute du roi
  choice: le roi les écouta
  alternative: le roi les entendit ; le roi suivit leur avis
  rationale: שׁמע אל peut aller de l'écoute attentive à l'acquiescement. La traduction principale conserve cette amplitude, tandis que la note signale le sens plus fort possible.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le registre biblique littéraire tout en restant courant à l'écrit. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
