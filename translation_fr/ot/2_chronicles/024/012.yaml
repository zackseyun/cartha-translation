source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: fr
  text: Le roi et Joïada le remirent[a] à ceux qui effectuaient les travaux du service de la maison de Yahweh[b], et ils engagèrent des tailleurs de pierre et des artisans pour restaurer la maison de Yahweh, ainsi que des artisans travaillant le fer et le bronze[c] pour consolider la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom renvoie à l’argent recueilli dans le contexte. On pourrait aussi traduire : « le donnèrent » ou « le confièrent ».'
    reason: lexical_alternative
  - marker: b
    text: La « maison de Yahweh » désigne ici le temple.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des forgerons travaillant le fer et le bronze ». Le mot hébreu désigne plus largement des artisans qualifiés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: le remirent
  rationale: Le verbe נתן accompagné du suffixe masculin singulier renvoie, dans le contexte, à l’argent recueilli. « Remettre » exprime naturellement ici le transfert des fonds sans remplacer le pronom du texte par un nom explicite.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: à ceux qui exécutaient les travaux pour le service de la maison de Yahweh
  rationale: Cette formulation conserve les éléments imbriqués de l’hébreu — travail, service et maison — tout en restant intelligible en français. Elle n’ajoute pas l’idée de surveillance, absente du verset.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » correspond directement à בֵּית et préserve l’expression hébraïque, tout en désignant ici le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: Ceux-ci engagèrent
  rationale: La construction היה suivie d’un participe décrit ici l’action d’employer des ouvriers. « Engagèrent » est idiomatique; « ceux-ci » rend explicite que le sujet est le groupe qui vient d’être mentionné, sans introduire un nouvel acteur.
- source_word: חֹצְבִים
  choice: des tailleurs de pierre
  rationale: Dans le contexte de la restauration d’un édifice, le terme désigne naturellement des ouvriers qui taillent la pierre.
- source_word: חָרָשִׁים
  choice: des artisans
  rationale: חָרָשִׁים désigne des ouvriers qualifiés sans imposer ici une spécialité plus étroite telle que la menuiserie.
- source_word: לְחַדֵּשׁ
  choice: pour restaurer
  rationale: Le piel de חדש signifie remettre à neuf. « Restaurer » réunit les idées de réparation et de renouvellement adaptées au bâtiment.
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: des artisans travaillant le fer et le bronze
  rationale: La formulation indique clairement leur spécialité tout en évitant de réduire nécessairement ces artisans à la seule activité de forge.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans ce contexte de matériaux de construction et d’artisanat, « bronze » est le rendu usuel et vraisemblable, bien que le mot puisse aussi désigner le cuivre.
- source_word: לְחַזֵּק
  choice: pour la consolider
  rationale: חזק signifie rendre fort. Pour un édifice, « consolider » est plus naturel que « fortifier » ou « renforcer » et le pronom féminin renvoie clairement à la maison.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. La translittération « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Identification de la « maison de Yahweh »
  choice: Conserver « maison de Yahweh » dans le texte et préciser en note qu’il s’agit du temple
  alternative: le temple de Yahweh
  rationale: Le rendu formel conserve l’image et le vocabulaire hébraïques sans nuire à la compréhension grâce à la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsmes. La répétition hébraïque de « maison de Yahweh » est partiellement allégée à la fin par « la », tout en conservant les deux premières occurrences qui structurent le verset.
