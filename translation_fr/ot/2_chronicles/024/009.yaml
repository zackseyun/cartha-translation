source:
  edition: WLC
  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: fr
  text: Ils firent proclamer en Juda et à Jérusalem qu’il fallait apporter à Yahweh la contribution que Moïse, serviteur de Dieu, avait imposée à Israël dans le désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prélèvement » ou « la taxe de Moïse, serviteur de Dieu, pour Israël dans le désert ». Le terme hébreu désigne une contribution fixée ou exigée ; la préposition peut signifier « imposée à » ou « pour ».
    reason: Ambiguïtés lexicales de מַשְׂאַת et syntaxiques de עַל יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: Ils firent proclamer
  rationale: L’expression idiomatique signifie littéralement « donner de la voix / un son » et désigne ici une annonce publique officielle. « Firent proclamer » est naturel en français et conserve cette portée.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִַם
  choice: en Juda et à Jérusalem
  rationale: Cette formulation idiomatique distingue naturellement le territoire de Juda de la ville de Jérusalem.
- source_word: לְהָבִיא
  choice: qu’il fallait apporter
  rationale: L’infinitif exprime le but ou le contenu pratique de la proclamation. Cette tournure française restitue l’obligation sans alourdir la phrase.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte directement le nom divin יהוה ; la translittération « Yahweh » préserve le nom d’alliance.
- source_word: מַשְׂאַת
  choice: la contribution
  rationale: Le nom désigne ici une contribution exigée ou fixée. « Contribution » reste compréhensible et suffisamment large, tandis que la note signale les nuances possibles de prélèvement et de taxe.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: que Moïse, serviteur de Dieu
  rationale: La formulation conserve le titre traditionnel « serviteur de Dieu » et rend explicitement en français le lien entre Moïse et la contribution.
- source_word: עַל יִשְׂרָאֵל
  choice: avait imposée à Israël
  rationale: Avec מַשְׂאַת, la préposition עַל peut indiquer qu’une contribution a été mise à la charge d’Israël. Cette traduction exprime ce rapport de manière idiomatique.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme courant en français biblique moderne pour le lieu du séjour d’Israël sous Moïse, sans exiger un paysage entièrement aride.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le verset emploie le tétragramme. « Yahweh » le rend comme un nom propre et évite de le remplacer par un titre.
- issue: Rapport entre la contribution mosaïque et Israël
  choice: que Moïse […] avait imposée à Israël
  alternative: la contribution de Moïse […] pour Israël
  rationale: La construction avec עַל peut exprimer une charge imposée à Israël, mais « pour Israël » demeure grammaticalement possible. Le texte principal retient le sens d’une contribution obligatoire, cohérent avec le contexte, tandis que la note conserve l’alternative.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « firent proclamer » garde le caractère public et officiel de l’annonce ; « contribution » évite les connotations administratives trop étroites de « impôt » tout en restant accessible.
