  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: fr
  text: Alors le roi donna l’ordre, et ils fabriquèrent un coffre[a] et le placèrent à l’extérieur, à la porte de la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie le numéral « un » ; il peut souligner qu’il s’agissait d’un unique coffre destiné à la collecte.
    reason: La présence de אֶחָד est explicitée sans imposer comme certaine sa valeur emphatique ni présenter une paraphrase française comme une citation littérale.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: donna l’ordre
  rationale: Le verbe signifie littéralement « dit », mais l’exécution immédiate de ses paroles indique ici un ordre royal. « Donna l’ordre » exprime naturellement cette valeur contextuelle sans surtraduire par un verbe plus autoritaire.
- source_word: וַיַּעֲשׂוּ
  choice: ils fabriquèrent
  rationale: Le verbe עשה désigne ici la confection d’un objet matériel. Le sujet pluriel demeure indéterminé, comme en hébreu.
- source_word: אֲרוֹן אֶחָד
  choice: un seul coffre
  rationale: אֲרוֹן désigne un coffre ou une caisse, et non ici l’arche de l’alliance. Le numéral אֶחָד est rendu explicitement par « un seul », ce qui peut souligner qu’un unique coffre était affecté à la collecte.
- source_word: וַיִּתְּנֻהוּ
  choice: qu’ils placèrent
  rationale: Dans ce contexte spatial, נתן a le sens de mettre ou placer. La proposition relative produit une phrase française fluide tout en conservant l’action et son sujet pluriel.
- source_word: בְּשַׁעַר
  choice: à la porte
  rationale: La préposition בְּ indique ici l’emplacement du coffre. « À la porte » est idiomatique en français et ne précise pas indûment s’il se trouvait dans l’ouverture même ou juste à côté.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’image hébraïque de la « maison » tout en laissant le contexte désigner le temple.
- source_word: חוּצָה
  choice: à l’extérieur
  rationale: L’adverbe indique que le coffre fut installé dehors, par rapport à la maison de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. « Maison de Yahweh » préserve l’expression concrète de l’hébreu ; « un seul coffre » maintient le numéral du texte source sans lourdeur excessive.
