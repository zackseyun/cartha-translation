    rationale: אֲרוֹן אֶחָד signifie littéralement « un coffre » / « un coffre, un [= un seul] » selon l’ordre nominal hébreu, mais la formulation française donnée paraît être une citation mot à mot et est maladroite. Une note doit expliquer la présence du numéral sans lui attribuer une formulation française artificielle.
  - severity: low
    issue: « Un seul coffre » fixe comme certaine une valeur emphatique seulement possible.
    rationale: אֶחָד doit être rendu, mais son emploi peut être simplement numéral/indéfini dans ce contexte. « Un coffre », accompagné d’une note signalant la possible insistance sur l’unicité, préserve mieux l’ambiguïté.
