base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: fr
  text: Jehoïada vieillit et fut rassasié de jours[a], puis il mourut. Il avait cent trente ans à sa mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « il avait vécu une vie bien remplie ». L’hébreu dit littéralement « fut rassasié de jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: devint vieux
  rationale: Le verbe זקן dans la suite narrative indique l’avancée en âge. « Devint vieux » préserve cette nuance dynamique en français naturel.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Translittération française qui représente les consonnes du nom hébreu et distingue les deux éléments théophores et verbaux de manière lisible.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: rassasié de jours
  rationale: Cette expression conserve l’image de l’idiome hébreu, qui évoque une longue vie menée à son plein accomplissement, sans en réduire le sens à la seule longévité.
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Mourut » rend le verbe מות dans le récit; « puis » marque naturellement la progression de la suite narrative sans répéter plusieurs « et ».
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: Il avait cent trente ans
  rationale: La formule hébraïque dit littéralement « fils de cent trente ans », mais l’expression française normale de l’âge est « avoir cent trente ans ».
- source_word: בְּמוֹתוֹ
  choice: à sa mort
  rationale: La préposition ב avec « mort » et le suffixe pronominal exprime ici le moment auquel se rapporte l’âge indiqué.
