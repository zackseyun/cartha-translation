  source_fidelity: 'Le sens de la séquence hébraïque est globalement bien rendu : Jehoïada avance en âge, est « rassasié de jours », meurt, et son âge au moment de sa mort est indiqué. Toutefois, le second verbe de la séquence (« fut rassasié ») doit être exprimé en français.'
