base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: fr
  text: Au tournant de l’année[a], l’armée d’Aram[b] monta contre lui. Elle entra en Juda et à Jérusalem, fit périr tous les chefs du peuple parmi le peuple et envoya tout son butin[c] au roi de Damas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À la fin de l’année » ; l’expression hébraïque évoque le tournant de l’année ou le cycle des saisons.
    reason: lexical_alternative
  - marker: b
    text: « Aram » est le nom hébreu du territoire souvent appelé « Syrie » dans les traductions.
    reason: cultural_note
  - marker: c
    text: Ou « tout ce qu’elle avait pillé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: Au tournant de l’année
  rationale: תְּקוּפָה évoque un cycle ou un tournant. Cette formulation conserve l’image hébraïque tout en désignant naturellement le changement de saison où reprenaient les campagnes militaires.
- source_word: עָלָה עָלָיו
  choice: monta contre lui
  rationale: Dans un contexte militaire, עָלָה עַל signifie monter ou marcher contre quelqu’un. La formulation garde l’idiome du texte sans ajouter explicitement l’idée d’attaque.
- source_word: חֵיל אֲרָם
  choice: l’armée d’Aram
  rationale: חֵיל désigne ici une force militaire. « Aram » conserve le nom hébreu ancien plutôt que de lui substituer le terme géopolitique plus tardif « Syrie ».
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Elle se rendit en Juda et à Jérusalem
  rationale: בוא signifie couramment venir, entrer ou se rendre quelque part. Le contexte exprime déjà le caractère militaire de ce déplacement; le verbe n’est donc pas renforcé en « envahit ».
- source_word: וַיַּשְׁחִיתוּ
  choice: extermina
  rationale: Le hiphil de שׁחת exprime ici la destruction de personnes. « Extermina » rend clairement cette issue mortelle dans un registre narratif digne.
- source_word: כָּל שָׂרֵי הָעָם מֵעָם
  choice: tous les chefs qui se trouvaient parmi le peuple
  rationale: שָׂרִים désigne des chefs, dirigeants ou hauts responsables. La relative rend en français naturel la précision מֵעָם, littéralement « d’entre le peuple », sans reproduire une répétition obscure.
- source_word: וְכָל שְׁלָלָם
  choice: tout son butin
  rationale: שָׁלָל est le butin ou le produit du pillage de guerre. En français, le collectif singulier « tout son butin » convient naturellement, et le possessif renvoie à l’armée prise comme collectif.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: envoya … au roi de Damas
  rationale: La construction désigne naturellement le souverain araméen dont le siège était à Damas; « roi de Damas » est la formulation historique usuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. Le récit conserve l’idiome militaire « monta contre lui », tandis que la répétition hébraïque de « peuple » est rendue par une relative naturelle. Les noms historiques « Aram » et « Damas » sont maintenus.
