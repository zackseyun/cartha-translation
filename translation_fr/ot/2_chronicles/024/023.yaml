revisions:
- from: Au tournant de l’année[a], l’armée d’Aram[b] monta contre lui. Elle se rendit en Juda et à Jérusalem, extermina tous les chefs qui se trouvaient parmi le peuple et envoya tout son butin[c] au roi de Damas.
  to: Au tournant de l’année[a], l’armée d’Aram[b] monta contre lui. Elle entra en Juda et à Jérusalem, fit périr tous les chefs du peuple parmi le peuple et envoya tout son butin[c] au roi de Damas.
  rationale: La révision atténue une surcharge sémantique de « extermina » et emploie un verbe de mouvement plus directement aligné sur le texte hébreu. Elle maintient le sens, les noms historiques, le registre et les trois ancres de notes.
