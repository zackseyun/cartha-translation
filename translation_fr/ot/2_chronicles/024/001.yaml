  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: fr
  text: Joas avait sept ans lorsqu’il devint roi, et il régna quarante ans à Jérusalem. Sa mère s’appelait Tsibia et elle était originaire de Beer-Shéba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: avait sept ans
  rationale: La formule hébraïque d’âge signifie littéralement « fils de sept ans » ; la tournure française idiomatique en restitue exactement le sens.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition ב avec la forme verbale marque ici le moment de l’accession au trône. Cette formulation est naturelle en français et convient à un enfant de sept ans.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe signifie « régner, être roi » ; « régna » conserve sa force verbale et la formule du bilan royal.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » exprime naturellement la localisation avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette formulation française courante transmet fidèlement la formule hébraïque « le nom de sa mère était ».
- source_word: צִבְיָה
  choice: Tsibia
  rationale: Translittération française claire du nom hébreu צִבְיָה, avec « Ts » pour la consonne initiale tsadé.
- source_word: מִבְּאֵר שָׁבַע
  choice: elle était originaire de Beer-Shéba
  rationale: Le préfixe מ indique l’origine. L’explicitation du sujet féminin évite que « de Beer-Shéba » soit compris comme qualifiant le nom plutôt que la mère.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux phrases conserve les éléments du bilan royal tout en évitant les calques de la syntaxe hébraïque.
