base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: fr
  text: 'Ses fils[a], les nombreux oracles contre lui et la fondation de la maison de Dieu : voici, tout cela est écrit dans le Midrash du livre des Rois[b]. Son fils Amatsia régna à sa place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le syntagme hébreu rendu par « les nombreux oracles contre lui » est difficile. On pourrait aussi le comprendre comme « l’importance du fardeau qui pesait sur lui », « l’abondance des proclamations contre lui », ou même « le lourd tribut qui lui fut imposé ». Le mot hébreu peut désigner un fardeau, un oracle ou, dans certains contextes, une charge imposée.
    reason: lexical_alternative
  - marker: b
    text: Ici, « Midrash » désigne probablement un document interprétatif, un exposé ou un commentaire associé au livre des Rois.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: Ses fils
  rationale: Rend directement le pluriel avec suffixe possessif; la conjonction ouvre ici une notice récapitulative et n’exige pas nécessairement un « et » en tête de phrase en français.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: les nombreux oracles prononcés contre lui
  rationale: מַשָּׂא peut désigner un fardeau ou une proclamation, notamment un oracle; עָלָיו prend ici naturellement le sens hostile de « contre lui ». La difficulté lexicale est signalée en note.
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: la fondation de la maison de Dieu
  rationale: « Fondation » conserve le lien formel avec יסד sans préciser indûment s’il s’agit de travaux de fondation, d’établissement ou, dans le contexte, de restauration.
- source_word: הִנָּם כְתוּבִים
  choice: tout cela est écrit
  rationale: La tournure française rassemble naturellement les éléments coordonnés et restitue l’emphase déictique de הִנָּם sans recourir à l’archaïsant « voici ».
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: dans le Midrash du livre des Rois
  rationale: La translittération « Midrash » évite de fixer trop précisément la nature de cet écrit; une note en explique les sens possibles.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַּחְתָּיו
  choice: Son fils Amatsia régna à sa place
  rationale: Formulation française naturelle de la formule hébraïque standard de succession royale.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Maison de Dieu » conserve l’image hébraïque; « Midrash » est maintenu comme terme culturel expliqué en note. La syntaxe évite un calque lourd tout en préservant l’énumération et l’incertitude du passage.
