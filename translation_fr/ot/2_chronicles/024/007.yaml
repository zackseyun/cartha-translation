    issue: Le texte principal fait d’Athalie et de ses fils un sujet collectif.
    rationale: Dans l’hébreu, בניה (« ses fils ») est le nom pluriel qui commande les verbes pluriels פרצו et עשו. Athalie est désignée par le groupe précédent (« Athalie, la femme méchante »). La note a présente une lecture secondaire comme possible alors que c’est la construction à retenir dans le texte.
  - severity: low
    issue: La note a maintient une ambiguïté grammaticale qui n’a pas besoin d’être imposée au lecteur.
    rationale: Elle peut être supprimée une fois le sujet correctement rendu; aucune ambiguïté textuellement disputée ne requiert ici une note.
