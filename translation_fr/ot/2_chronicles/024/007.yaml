revisions:
- from: En effet, Athalie, cette femme méchante, et ses fils[a] avaient forcé l’entrée de la maison de Dieu. Ils avaient aussi utilisé tous les objets sacrés de la maison de Yahweh pour les Baals[b].
  to: En effet, les fils d’Athalie, cette femme méchante, avaient forcé l’entrée de la maison de Dieu et avaient aussi employé tous les objets sacrés de la maison de Yahweh pour les Baals[a].
  rationale: La correction principale rétablit les fils d’Athalie comme sujet des deux verbes pluriels, conformément à la syntaxe hébraïque. La note de sujet est donc supprimée. La note lexicale est conservée, avec un ancrage unique, afin de signaler sans surinterprétation la valeur plus littérale de « faire ».
