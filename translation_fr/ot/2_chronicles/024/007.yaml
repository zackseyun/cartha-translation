  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: fr
  text: En effet, les fils d’Athalie, cette femme méchante, avaient forcé l’entrée de la maison de Dieu et avaient aussi employé tous les objets sacrés de la maison de Yahweh pour les Baals[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avaient fait tous les objets sacrés de la maison de Yahweh pour les Baals ». Dans ce contexte, le verbe « faire » peut désigner l’emploi ou l’affectation de ces objets au culte des Baals.'
    reason: La note préserve la formulation lexicale plus littérale de עשו tout en expliquant le sens contextuel retenu.
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication de ce qui précède avec une tournure naturelle en français.
- source_word: עֲתַלְיָהוּ
  choice: Athalie
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַמִּרְשַׁעַת
  choice: cette femme méchante
  rationale: Rend explicitement le féminin et la valeur caractérisante de l’article dans l’apposition.
- source_word: בָּנֶיהָ
  choice: ses fils
  rationale: Conserve le masculin pluriel explicite de l’hébreu.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: avaient forcé l’entrée de la maison de Dieu
  rationale: פרץ évoque ici une effraction ou une violation violente du sanctuaire; cette formulation est claire et idiomatique en français.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: tous les objets sacrés de la maison de Yahweh
  rationale: Dans ce contexte, קָדְשֵׁי désigne les biens ou objets consacrés du sanctuaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: avaient aussi utilisé ... pour les Baals
  rationale: Le sens littéral de עשה est « faire », mais avec les objets sacrés comme complément et לַבְּעָלִים comme destination, l’idée contextuelle est leur affectation ou leur emploi au service des Baals.
theological_decisions:
- issue: Sujet de פָרְצוּ et עָשׂוּ
  choice: Athalie ... et ses fils
  alternative: les fils d’Athalie, cette femme méchante
  rationale: La juxtaposition hébraïque permet de comprendre Athalie et ses fils comme sujet collectif du verbe pluriel, mais elle peut aussi être analysée comme une construction détachée où seuls ses fils sont le sujet; une note conserve cette ambiguïté.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom propre.
- issue: Pluriel בְּעָלִים
  choice: les Baals
  alternative: Baal
  rationale: Le pluriel hébreu est conservé sans le ramener à une divinité singulière.
- issue: Sens de עָשׂוּ לַבְּעָלִים
  choice: utilisé ... pour les Baals
  alternative: fait ... pour les Baals
  rationale: La traduction retenue exprime l’emploi idolâtre des objets du temple, tandis que la note signale le rendu plus littéral et moins déterminé.
translation_notes:
  register: Français international moderne, digne et accessible. « Maison de Dieu » et « maison de Yahweh » maintiennent le parallélisme lexical du texte source; « objets sacrés » explicite naturellement la référence aux biens consacrés.
