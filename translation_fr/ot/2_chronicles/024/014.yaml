  text: וּֽ/כְ/כַלּוֹתָ֡/ם הֵבִ֣יאוּ לִ/פְנֵי֩ הַ/מֶּ֨לֶךְ וִֽ/יהוֹיָדָ֜ע אֶת שְׁאָ֣ר הַ/כֶּ֗סֶף וַ/יַּעֲשֵׂ֨/הוּ כֵלִ֤ים לְ/בֵית יְהוָה֙ כְּלֵ֣י שָׁרֵ֔ת וְ/הַעֲל֣וֹת וְ/כַפּ֔וֹת וּ/כְלֵ֥י זָהָ֖ב וָ/כָ֑סֶף וַ֠/יִּֽהְיוּ מַעֲלִ֨ים עֹל֤וֹת בְּ/בֵית יְהוָה֙ תָּמִ֔יד כֹּ֖ל יְמֵ֥י יְהוֹיָדָֽע־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: fr
  text: 'Quand ils eurent terminé, ils apportèrent le reste de l’argent devant le roi et Joïada. On en fit[a] des ustensiles pour la maison de Yahweh : des ustensiles pour le service et l’offrande[b], des coupes[c], ainsi que des ustensiles en or et en argent. On offrait continuellement des holocaustes dans la maison de Yahweh durant toute la vie de Joïada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte un verbe au singulier, avec un suffixe objet singulier qui renvoie au reste de l’argent. Le sujet n’est pas précisé; on pourrait aussi traduire : « il le transforma en ustensiles ».'
    reason: ambiguïté grammaticale et possibilité de traduction plus littérale
  - marker: b
    text: 'Littéralement : « et à faire monter »; l’objet de l’action n’est pas précisé ici. Les holocaustes sont nommés explicitement plus loin dans le verset.'
    reason: ellipse dans le texte hébreu
  - marker: c
    text: 'Ou : « des récipients »; la forme exacte de ces objets cultuels est incertaine.'
    reason: incertitude lexicale
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Quand ils eurent terminé
  rationale: L’infinitif construit avec suffixe pluriel introduit une circonstance temporelle. Le complément de « terminer » demeure implicite, comme en hébreu.
- source_word: שְׁאָר הַכֶּסֶף
  choice: le reste de l’argent
  rationale: כֶּסֶף peut désigner l’argent comme métal ou comme moyen de paiement. Dans ce contexte de collecte puis de fabrication d’objets, « argent » conserve heureusement les deux nuances en français.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Celui-ci en fit
  rationale: Le verbe et son suffixe objet sont au singulier. « Celui-ci » renvoie naturellement à Joad, le référent masculin singulier le plus proche, tandis que « en » reprend l’argent restant sans alourdir la phrase.
- source_word: כֵלִים / כְּלֵי שָׁרֵת
  choice: des objets / des objets destinés au service
  rationale: כֵלִים est un terme large désignant des objets ou ustensiles. « Destinés au service » exprime clairement leur fonction cultuelle sans employer un vocabulaire ecclésiastique plus tardif.
- source_word: וְהַעֲלוֹת
  choice: à faire monter les offrandes
  rationale: L’infinitif de עלה exprime l’action de faire monter ou d’offrir, mais son objet n’est pas formulé. Le texte français garde l’image verbale tout en ajoutant « les offrandes » comme complément générique requis par l’idiome français, signalé en note.
- source_word: וְכַפּוֹת
  choice: des coupes
  rationale: כַּפּוֹת désigne ici une catégorie de récipients cultuels dont la forme exacte n’est pas certaine. « Coupes » convient au contexte tout en restant assez général.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: On offrit constamment des holocaustes
  rationale: La construction périphrastique, renforcée par תָּמִיד, décrit une pratique durable et répétée. « Constamment » conserve cette continuité; le pronom « on » évite d’identifier des agents que l’hébreu ne nomme pas explicitement.
- source_word: כֹּל יְמֵי יְהוֹיָדָע
  choice: durant toute la vie de Joad
  rationale: Cette formulation française naturelle rend l’idiome hébreu « tous les jours de Joad » sans en modifier le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et ne le remplace pas par un titre.
- issue: Portée de וְהַעֲלוֹת
  choice: à faire monter les offrandes
  alternative: pour offrir des holocaustes
  rationale: L’objet du verbe n’est pas exprimé dans cette première occurrence. La traduction évite de l’identifier précisément aux holocaustes, lesquels ne sont nommés explicitement que dans la proposition suivante.
- issue: Aspect de l’offrande des holocaustes
  choice: pratique continue et habituelle pendant la vie de Joad
  alternative: événement ponctuel au passé
  rationale: La tournure וַיִּהְיוּ מַעֲלִים, associée à תָּמִיד, présente une activité répétée ou durable plutôt qu’un acte unique.
translation_notes:
  register: Français international moderne, digne et lisible. « Maison de Yahweh » conserve l’expression hébraïque plutôt que de la remplacer par « temple ». Le nom יְהוֹיָדָע est rendu selon sa forme française traditionnelle « Joad ». La ponctuation avec deux-points clarifie l’inventaire sans modifier sa structure.
