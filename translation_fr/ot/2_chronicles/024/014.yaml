revisions:
- from: 'Quand ils eurent terminé, ils apportèrent le reste de l’argent devant le roi et Joad. Celui-ci en fit[a] des objets pour la maison de Yahweh : des objets destinés au service et à faire monter les offrandes[b], des coupes[c], ainsi que des objets en or et en argent. On offrit constamment des holocaustes dans la maison de Yahweh durant toute la vie de Joad.'
  to: 'Quand ils eurent terminé, ils apportèrent le reste de l’argent devant le roi et Joïada. On en fit[a] des ustensiles pour la maison de Yahweh : des ustensiles pour le service et l’offrande[b], des coupes[c], ainsi que des ustensiles en or et en argent. On offrait continuellement des holocaustes dans la maison de Yahweh durant toute la vie de Joïada.'
  rationale: La révision élimine l’attribution injustifiée de l’action à Joïada, adopte la forme française usuelle « Joïada » et reformule l’infinitif hébreu de manière naturelle sans expliciter l’objet absent. « On offrait continuellement » rend mieux la construction durative avec תָּמִיד que le passé ponctuel « On offrit ».
