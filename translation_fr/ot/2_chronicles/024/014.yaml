    issue: Le sujet de « Celui-ci en fit » est surinterprété.
    rationale: Le singulier hébreu ne désigne pas expressément Joïada plutôt que le roi; le démonstratif français impose Joïada comme agent. Une tournure impersonnelle permet de conserver l’ambiguïté.
  - severity: medium
    issue: « Joad » n’est pas une forme française standard de Jehoiada/יְהוֹיָדָע.
    rationale: « Joïada » est la forme française traditionnelle, claire et couramment employée dans les traductions bibliques françaises; le nom doit aussi correspondre à la note de contexte.
  - severity: low
    issue: « à faire monter les offrandes » ajoute un objet générique à l’infinitif dont l’objet n’est pas exprimé.
    rationale: Même si la note signale l’ajout, « pour l’offrande » rend naturellement la fonction sans préciser l’objet ni anticiper « holocaustes ».
