  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: fr
  text: On l’enterra dans la cité de David, parmi les rois[a], parce qu’il avait fait du bien en Israël, à l’égard de Dieu et de sa maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les rois ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec Dieu et sa maison ». Dans ce contexte, « sa maison » désigne vraisemblablement la maison de Dieu, c’est-à-dire le temple.
    reason: translation_clarity
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: On l’enterra
  rationale: Le verbe hébreu est actif au pluriel avec un complément masculin singulier, mais le sujet reste indéterminé. En français, « on » rend naturellement cet agent humain non précisé.
- source_word: בְעִיר דָּוִיד
  choice: dans la cité de David
  rationale: Cette formulation conserve le nom géographique traditionnel tout en restant naturelle et digne en français moderne.
- source_word: עִם הַמְּלָכִים
  choice: parmi les rois
  rationale: Littéralement « avec les rois » ; dans un contexte funéraire, « parmi » exprime naturellement qu’il fut enseveli dans leur compagnie ou leur lieu de sépulture.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la raison de l’honneur funéraire accordé à Yehoyada.
- source_word: עָשָׂה טוֹבָה
  choice: il avait fait du bien
  rationale: La tournure exprime des actes bons ou bénéfiques. Le plus-que-parfait convient à l’explication rétrospective de son ensevelissement.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition désigne naturellement la sphère dans laquelle il avait fait du bien.
- source_word: וְעִם הָאֱלֹהִים
  choice: pour Dieu
  rationale: Bien que עִם signifie ordinairement « avec », la coordination avec עָשָׂה טוֹבָה indique ici le bénéficiaire ou l’orientation de son action. « Pour Dieu » évite l’idée trompeuse d’une simple compagnie.
- source_word: וּבֵיתוֹ
  choice: et pour son temple
  rationale: Le suffixe renvoie le plus naturellement à Dieu, antécédent immédiat, et « maison » désigne ici son sanctuaire. « Temple » rend explicitement ce sens contextuel en français courant.
theological_decisions:
- issue: Référent de וּבֵיתוֹ (« sa maison »)
  choice: Le temple de Dieu
  alternative: La maison ou famille de Yehoyada
  rationale: Dieu est l’antécédent immédiat du suffixe, et le contexte narratif souligne l’action fidèle de Yehoyada en faveur du temple. La note conserve toutefois la formulation littérale et signale cette interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « On l’enterra » préserve l’actif et le sujet indéterminé de l’hébreu. « Cité de David » maintient l’appellation biblique usuelle. La seconde occurrence implicite de « pour » est explicitée devant « son temple » afin de rendre clairement la coordination hébraïque.
