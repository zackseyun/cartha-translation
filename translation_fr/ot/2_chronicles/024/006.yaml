revisions:
- from: 'Alors le roi convoqua le grand prêtre Yehoyada et lui dit : « Pourquoi n’as-tu pas exigé des Lévites qu’ils apportent de Juda et de Jérusalem la contribution prescrite par Moïse, serviteur de l’Éternel, et par l’assemblée d’Israël pour la tente du Témoignage ? »'
  to: 'Alors le roi convoqua Yehoyada, le chef, et lui dit : « Pourquoi n’as-tu pas demandé aux Lévites d’apporter de Juda et de Jérusalem la contribution que Moïse, serviteur de l’Éternel, avait exigée de l’assemblée d’Israël pour la tente du Témoignage ? »'
  rationale: La révision restitue le titre explicitement attesté pour Yehoyada et exprime de façon fluide le rapport de la contribution mosaïque à l’assemblée d’Israël, sans introduire un rôle normatif conjoint non exprimé pour cette dernière.
