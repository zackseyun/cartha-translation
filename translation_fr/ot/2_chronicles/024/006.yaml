base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: fr
  text: 'Alors le roi convoqua Yehoyada, le chef, et lui dit : « Pourquoi n’as-tu pas demandé aux Lévites d’apporter de Juda et de Jérusalem la contribution que Moïse, serviteur de l’Éternel, avait exigée de l’assemblée d’Israël pour la tente du Témoignage ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹיָדָע הָרֹאשׁ
  choice: le grand prêtre Yehoyada
  rationale: הָרֹאשׁ signifie littéralement « le chef », mais le contexte immédiat identifie Yehoyada comme prêtre et responsable principal; « grand prêtre » exprime naturellement sa fonction en français.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: tu n’as pas exigé des Lévites
  rationale: La construction דרשׁ על désigne ici le fait de demander avec autorité ou d’imposer une responsabilité.
- source_word: מַשְׂאַת מֹשֶׁה
  choice: la contribution prescrite par Moïse
  rationale: מַשְׂאַת désigne ici un prélèvement ou une contribution destinée au sanctuaire; « contribution » évite la connotation fiscale moderne trop étroite de « taxe », tandis que « prescrite par » rend le rapport à Moïse dans ce contexte.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et intelligible du tétragramme, distingué typographiquement comme nom divin.
- source_word: אֹהֶל הָעֵדוּת
  choice: la tente du Témoignage
  rationale: Traduction formelle de l’expression cultuelle, qui conserve son lien avec le témoignage de l’alliance.
theological_decisions:
- issue: Rapport de la contribution à Moïse et à l’assemblée d’Israël
  choice: « prescrite par Moïse […] et par l’assemblée d’Israël »
  alternative: « la contribution de Moïse […] et de l’assemblée d’Israël »
  rationale: Le texte hébreu coordonne Moïse et l’assemblée de manière condensée. La formulation française explicite leur rapport normatif à la contribution sans attribuer celle-ci à Dieu ni résoudre davantage la syntaxe.
- issue: Titre de Yehoyada
  choice: « le grand prêtre »
  alternative: « Yehoyada, le chef »
  rationale: Le contexte sacerdotal justifie le titre fonctionnel courant, sans introduire de distinction doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la question de reproche du roi et la terminologie cultuelle du texte hébreu.
