  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: fr
  text: 'Alors l’Esprit de Dieu revêtit[a] Zacharie, fils du prêtre Yehojada. Il se tint au-dessus du peuple et leur dit : « Ainsi parle Dieu : Pourquoi transgressez-vous les commandements de Yahweh, sans que vous réussissiez[b] ? Puisque vous avez abandonné Yahweh, lui aussi vous a abandonnés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vint sur Zacharie » ; littéralement, « revêtit Zacharie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et vous ne réussirez pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: Dans ce contexte d’inspiration prophétique, l’expression désigne naturellement l’Esprit de Dieu comme agent de l’action.
- source_word: לָבְשָׁה אֶת
  choice: revêtit
  rationale: Le verbe לבשׁ évoque littéralement le fait de vêtir. « Revêtit » conserve cette image frappante de l’habilitation divine, tandis qu’une note donne le sens idiomatique possible.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: Zacharie, fils de Yehojada, le prêtre
  rationale: La formulation suit l’ordre de l’hébreu et rattache naturellement « le prêtre » à Yehojada, son antécédent immédiat.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: Il se tint au-dessus du peuple
  rationale: Cette traduction préserve la nuance spatiale de מֵעַל, qui suggère que Zacharie parlait depuis une position élevée.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: Voici ce que Dieu dit
  rationale: Formulation prophétique solennelle, mais naturelle et immédiatement compréhensible en français moderne.
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֺת יְהוָה
  choice: Pourquoi transgressez-vous les commandements de Yahweh
  rationale: Dans ce contexte, עבר signifie enfreindre ou transgresser. « Transgresser » conserve la portée morale et relationnelle de la réprimande.
- source_word: וְלֹא תַצְלִיחוּ
  choice: de sorte que vous ne réussissez pas
  rationale: La tournure exprime naturellement le résultat de leur transgression tout en laissant en note la lecture coordonnée ou prospective.
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: Puisque vous avez abandonné Yahweh, lui aussi vous a abandonnés
  rationale: La répétition d’« abandonner » reproduit la réciprocité voulue entre l’action du peuple et la réponse divine.
theological_decisions:
- issue: Traduction de יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom d’alliance.
- issue: Nature de רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  alternative: l’esprit de Dieu
  rationale: Le contexte présente l’Esprit comme l’agent de l’habilitation prophétique. La majuscule rend cette agence divine sans développer davantage la théologie du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore concrète du vêtement est conservée malgré son caractère inhabituel en français, avec une explication en note. Le parallélisme du verbe « abandonner » est maintenu, ainsi que la position élevée de Zacharie.
