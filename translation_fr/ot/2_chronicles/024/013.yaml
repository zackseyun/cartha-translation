  text: וַֽ/יַּעֲשׂוּ֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה וַ/תַּ֧עַל אֲרוּכָ֛ה לַ/מְּלָאכָ֖ה בְּ/יָדָ֑/ם וַֽ/יַּעֲמִ֜ידוּ אֶת בֵּ֧ית הָֽ/אֱלֹהִ֛ים עַל מַתְכֻּנְתּ֖/וֹ וַֽ/יְאַמְּצֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: fr
  text: Les ouvriers travaillèrent, et les travaux de réparation progressèrent grâce à eux[a]. Ils rétablirent la maison de Dieu conformément à sa disposition[b] et la consolidèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se rendre par « la restauration de l’ouvrage avança grâce à eux ». Le mot traduit ici par « réparation » peut désigner une guérison ou une restauration.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa forme initiale » ; littéralement, l’expression peut évoquer sa disposition ou sa structure établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: Les ouvriers travaillèrent
  rationale: Cette formulation rend naturellement l’expression hébraïque littéralement répétitive (« ceux qui faisaient le travail firent »), sans ajouter l’idée d’un commencement.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: les réparations progressèrent
  rationale: אֲרוּכָה évoque la guérison ou la restauration; appliqué ici au bâtiment, le terme désigne sa remise en état. Avec עלה, l’expression indique que les travaux avançaient.
- source_word: בְּיָדָם
  choice: grâce à eux
  rationale: Littéralement « par leur main », cet idiome exprime ici l’action des ouvriers comme moyen par lequel les réparations progressaient. La formulation française reste naturelle tout en conservant cette relation d’agence.
- source_word: וַיַּעֲמִידוּ
  choice: Ils rétablirent
  rationale: Le hiphil de עמד signifie littéralement « faire tenir debout »; dans le contexte de la rénovation d’un édifice, « rétablir » exprime la remise en état de la structure.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: La traduction littérale reste claire en français et conserve la désignation hébraïque traditionnelle du temple.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: dans son état normal
  rationale: מַתְכֻּנֶת peut désigner la disposition, la forme ou l’état fixé d’une chose. Ici, l’expression indique que le temple a été rendu à l’état structurel qui devait être le sien, sans préciser explicitement s’il s’agit exactement de sa forme originelle.
- source_word: וַיְאַמְּצֻהוּ
  choice: et la consolidèrent
  rationale: Le piel de אמץ signifie rendre fort ou ferme. « Consolider » convient précisément à un bâtiment réparé et reprend sans ambiguïté « la maison de Dieu ».
theological_decisions: []
