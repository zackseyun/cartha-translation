    issue: « dans son état normal » pour עַל מַתְכֻּנְתּוֹ
    rationale: « Normal » évoque en français un état habituel ou non anormal. Le terme hébreu désigne plutôt une disposition établie, une forme ou un plan déterminé. Une formulation centrée sur la disposition préserve mieux l’ambiguïté du texte source.
  - severity: low
    issue: « les réparations progressèrent »
    rationale: La formulation est compréhensible, mais « les travaux de réparation progressèrent » identifie plus naturellement en français le processus de chantier évoqué par le contexte et par אֲרוּכָה appliqué à l’ouvrage.
