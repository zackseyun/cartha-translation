revisions:
- from: Les ouvriers travaillèrent, et les réparations progressèrent grâce à eux[a]. Ils rétablirent la maison de Dieu dans son état normal[b] et la consolidèrent.
  to: Les ouvriers travaillèrent, et les travaux de réparation progressèrent grâce à eux[a]. Ils rétablirent la maison de Dieu conformément à sa disposition[b] et la consolidèrent.
  rationale: La révision remplace « état normal », qui est trop général et peut introduire une nuance absente de l’hébreu, par une expression qui reflète la disposition ou le plan établi sans trancher entre « forme initiale », « arrangement fixé » et « condition prescrite ». Elle explicite également que le progrès concerne des travaux de réparation, tout en conservant l’agence exprimée par « grâce à eux ».
