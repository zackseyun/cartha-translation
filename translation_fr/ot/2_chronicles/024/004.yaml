  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: fr
  text: Après cela, Joas eut à cœur de restaurer[a] la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renouveler » ou « réparer ». La maison de Yahweh désigne ici le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formule marque une nouvelle étape du récit. « Après cela » est naturel en français moderne et conserve la transition temporelle sans reproduire lourdement le verbe narratif וַיְהִי.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: Joas eut à cœur
  rationale: L’expression hébraïque décrit une intention intérieure de Joas. « Eut à cœur » conserve l’image du cœur dans un français idiomatique, sans renforcer indûment le propos en résolution solennelle.
- source_word: לְחַדֵּשׁ
  choice: restaurer
  rationale: Le verbe signifie rendre neuf de nouveau, renouveler ou remettre en état. Pour un édifice existant, « restaurer » exprime mieux l’ensemble des travaux que « réparer », plus étroit, tandis que « renouveler » est moins naturel ici.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression concrète « maison de Yahweh » et sa résonance biblique; dans ce contexte, elle désigne le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de rendre explicitement le tétragramme présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » en préserve le caractère personnel, tandis que « le Seigneur » substituerait un titre au nom.
- issue: Force de l’intention attribuée à Joas
  choice: eut à cœur
  alternative: décida fermement
  rationale: L’hébreu situe le projet dans le cœur de Joas, mais ne formule pas explicitement une décision ferme; le choix retenu préserve cette nuance.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « eut à cœur » conserve l’image hébraïque sans paraître artificielle; « maison de Yahweh » maintient la formulation source, avec une note clarifiant à la fois le référent et les nuances de לְחַדֵּשׁ.
