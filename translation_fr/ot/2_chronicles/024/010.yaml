source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כָל הַ/שָּׂרִ֖ים וְ/כָל הָ/עָ֑ם וַ/יָּבִ֛יאוּ וַ/יַּשְׁלִ֥יכוּ לָ/אָר֖וֹן עַד לְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: fr
  text: Alors, tous les responsables et tout le peuple se réjouirent. Ils apportèrent leurs dons et les jetèrent dans le coffre jusqu’à ce qu’ils aient fini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à ce que le coffre soit plein ». L’expression hébraïque peut plus généralement signifier « jusqu’à l’achèvement » ou « jusqu’au terme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se réjouirent
  rationale: Le verbe שׂמח exprime la joie; « se réjouirent » conserve son caractère actif et convient à un récit digne en français moderne.
- source_word: כָל הַשָּׂרִים
  choice: tous les responsables
  rationale: שׂרים désigne ici les autorités dirigeantes. « Responsables » est clair et évite que « princes » soit compris comme désignant nécessairement des fils de roi.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: Traduction directe qui maintient la portée collective de l’hébreu.
- source_word: וַיָּבִיאוּ
  choice: Ils apportèrent leurs dons
  rationale: Le complément est implicite en hébreu; le contexte immédiat de la collecte permet de l’expliciter naturellement par « leurs dons » sans introduire une idée étrangère.
- source_word: וַיַּשְׁלִיכוּ
  choice: les jetèrent
  rationale: Le verbe שלך signifie concrètement « jeter ». Cette formulation préserve davantage sa force que « les mirent » ou « les déposèrent ».
- source_word: לָאָרוֹן
  choice: dans le coffre
  rationale: אָרוֹן désigne ici le récipient destiné à la collecte, et non l’arche de l’alliance; « coffre » est donc le terme contextuellement le plus clair.
- source_word: עַד לְכַלֵּה
  choice: jusqu’à ce qu’ils aient fini
  rationale: L’expression indique l’achèvement ou l’arrivée à son terme. Avec les donateurs comme sujet des verbes précédents, « jusqu’à ce qu’ils aient fini » suit naturellement la syntaxe, tout en signalant en note l’autre lecture contextuelle possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Responsables » évite l’ambiguïté dynastique de « princes ». Le pronom « les » reprend explicitement « leurs dons » et rend la séquence idiomatique. La note est placée sur l’expression réellement ambiguë.
