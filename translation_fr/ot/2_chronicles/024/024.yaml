  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: fr
  text: En effet, l’armée d’Aram vint avec peu d’hommes[a], mais Yahweh livra entre leurs mains[b] une armée extrêmement nombreuse, parce que les Judéens avaient abandonné Yahweh, le Dieu de leurs pères. Les Araméens exercèrent des jugements contre Joas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec un petit nombre d’hommes » ou « avec une poignée d’hommes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « donna entre leurs mains », expression qui signifie « livra en leur pouvoir ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « exercèrent le jugement contre Joas ». Le texte hébreu emploie le pluriel « jugements ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְמִצְעַר אֲנָשִׁים
  choice: avec peu d’hommes
  rationale: L’expression indique un faible nombre d’hommes et met celui-ci en contraste avec l’armée extrêmement nombreuse de Juda.
- source_word: חֵיל אֲרָם
  choice: l’armée d’Aram
  rationale: Dans ce contexte, חֵיל désigne une force militaire. « Aram » reproduit le nom hébreu plutôt que de le remplacer par « Syrie ».
- source_word: נָתַן בְּיָדָם
  choice: livra entre leurs mains
  rationale: Cette tournure conserve l’image de l’idiome hébreu tout en exprimant naturellement le fait de remettre l’adversaire au pouvoir des Araméens.
- source_word: חַיִל לָרֹב מְאֹד
  choice: une armée extrêmement nombreuse
  rationale: חַיִל a ici son sens militaire, tandis que לָרֹב מְאֹד souligne fortement la supériorité numérique.
- source_word: עָזְבוּ
  choice: avaient abandonné
  rationale: Le verbe exprime ici l’abandon grave de Yahweh dans un contexte d’infidélité religieuse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Cette formulation préserve le langage généalogique et l’écho de l’alliance présents dans l’hébreu.
- source_word: עָשׂוּ שְׁפָטִים
  choice: exécutèrent des jugements
  rationale: Le pluriel hébreu désigne des mesures punitives à portée judiciaire. La formulation française en conserve le nombre et la gravité sans préciser davantage leur nature.
theological_decisions:
- issue: Référent du sujet de עָזְבוּ (« avaient abandonné »)
  choice: les Judéens avaient abandonné Yahweh
  alternative: ils avaient abandonné Yahweh
  rationale: Dans le contexte, le sujet est le peuple ou l’armée de Juda, non les Araméens. Le nom explicite évite qu’en français le pronom soit rattaché par erreur au dernier groupe mentionné.
- issue: Les actes exercés contre Joas comme jugements
  choice: Les Araméens exécutèrent des jugements contre Joas
  alternative: Les Araméens exercèrent le jugement contre Joas
  rationale: Le pluriel שְׁפָטִים est conservé, ainsi que la portée judiciaire des actes, sans ajouter explicitement qu’ils sont les instruments de Dieu, même si le contexte établit ce lien.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme numérique est rendu clairement. Les sujets « les Judéens » et « les Araméens » sont explicités afin d’éviter des antécédents trompeurs en français, sans modifier les acteurs indiqués par le contexte.
