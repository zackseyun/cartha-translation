id: 2CH.28.1
reference: 2 Chronicles 28:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: fr
  text: Ahaz avait vingt ans lorsqu’il devint roi, et il régna seize ans à Jérusalem. Il ne fit pas ce qui est droit aux yeux de Yahweh, comme l’avait fait David, son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « père » signifie ancêtre royal, et non père immédiat.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: avait vingt ans
  rationale: Formule hébraïque habituelle indiquant l’âge; la tournure idiomatique française en restitue exactement le sens.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge d’Ahaz au moment de son accession au trône; cette formulation est naturelle en français moderne.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté; « régna » est la formulation précise et usuelle dans une notice royale.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, le complément de lieu associé au verbe « régner » se formule naturellement avec « à » devant un nom de ville.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: Il ne fit pas ce qui est droit
  rationale: Cette formulation conserve l’évaluation morale du texte hébreu tout en restant claire et naturelle.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction préserve l’image hébraïque des « yeux », qui exprime ici le jugement ou l’évaluation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: כְּדָוִיד אָבִיו
  choice: comme l’avait fait David, son père
  rationale: Le verbe « faire » est repris implicitement de la proposition précédente et explicité en français. « Père » conserve l’expression dynastique hébraïque, tandis qu’une note précise qu’il s’agit ici d’un ancêtre royal.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre, sans lui substituer un titre.
- issue: Sens de אָבִיו appliqué à David
  choice: son père, avec une note explicative
  alternative: son ancêtre
  rationale: Dans ce contexte royal, « père » désigne le fondateur ancestral de la dynastie et non le père immédiat. Garder le terme dans le texte préserve l’idiome biblique, tandis que la note évite toute méprise généalogique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la forme brève d’une notice royale et l’expression biblique « aux yeux de Yahweh », sans archaïsmes inutiles.
