  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: fr
  text: Il offrit des sacrifices et brûla de l’encens sur les hauts lieux[a], sur les collines et sous tout arbre verdoyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il offrit des sacrifices et fit fumer des offrandes sur les hauts lieux, sur les collines et sous tout arbre feuillu. »'
    reason: Alternative lexicale préservant le sens plus large possible de קטר et une autre nuance de רענן.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Il offrait des sacrifices
  rationale: Le piel de זבח désigne l’accomplissement d’un sacrifice. « Offrait des sacrifices » est naturel en français et exprime clairement l’acte cultuel.
- source_word: וַיְקַטֵּר
  choice: et faisait brûler de l’encens
  rationale: Le piel de קטר peut désigner l’action de brûler de l’encens ou de faire monter la fumée d’une offrande. Dans ce contexte cultuel, « faisait brûler de l’encens » est idiomatique, tout en signalant l’autre possibilité en note.
- source_word: בַּבָּמוֹת
  choice: sur les hauts lieux
  rationale: במות est un terme cultuel désignant des sanctuaires locaux, souvent situés en hauteur. « Hauts lieux » conserve le terme biblique technique et ses échos intertextuels.
- source_word: וְעַל הַגְּבָעוֹת
  choice: sur les collines
  rationale: גבעות est le terme ordinaire pour les collines. La traduction littérale distingue ces lieux des « hauts lieux » cultuels.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: et sous tout arbre verdoyant
  rationale: רענן évoque une végétation verte, fraîche et luxuriante. « Arbre verdoyant » préserve l’image et la formule cultuelle traditionnelle dans un français actuel et digne.
theological_decisions:
- issue: Expression cultuelle associée à un culte illicite
  choice: Conserver « hauts lieux » et « sous tout arbre verdoyant »
  alternative: Expliciter par « sanctuaires païens » ou rendre « sous tout arbre feuillu »
  rationale: Le texte décrit les lieux et les actes sans les qualifier explicitement dans ce verset. La traduction conserve donc la terminologie cultuelle et les résonances bibliques sans ajouter une interprétation confessionnelle.
- issue: Objet de l’action exprimée par וַיְקַטֵּר
  choice: « faisait brûler de l’encens » dans le texte, avec une alternative en note
  alternative: « faisait fumer des offrandes »
  rationale: Le verbe peut viser l’encens ou, plus largement, la fumée sacrificielle. Le choix principal est le plus naturel dans ce contexte, mais la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend naturellement la série d’actions habituelles décrites dans le contexte narratif. La formulation conserve les expressions cultuelles bibliques sans les paraphraser excessivement.
