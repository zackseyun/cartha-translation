    rationale: Les formes verbales hébraïques sont des wayyiqtol narratifs, qui relatent ici les actes du roi. Le passé simple français rend plus directement cette séquence que « offrait » / « faisait brûler », lequel peut suggérer une habitude non explicitement marquée par ce verset seul.
