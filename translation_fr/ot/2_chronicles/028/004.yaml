    rationale: Le verbe קטר signifie accomplir l’acte de brûler de l’encens ou de faire monter une offrande en fumée ; « faisait brûler » peut laisser entendre qu’il chargeait quelqu’un d’agir. « Brûla de l’encens » évite cet ajout tout en conservant le sens contextuel.
