  terminology: « Hauts lieux » préserve le terme cultuel technique במות sans ajouter l’interprétation « païens ». « Brûla de l’encens » est un rendu contextuellement approprié de קטר ; la note conserve sobrement la possibilité plus large d’offrandes consumées en fumée.
