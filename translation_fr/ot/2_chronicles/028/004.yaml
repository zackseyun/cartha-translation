  source_fidelity: 'Le texte hébreu emploie deux wayyiqtol narratifs successifs : « il offrit des sacrifices et brûla de l’encens ». Le rendu principal conserve correctement les lieux cultuels et l’expression « sous tout arbre verdoyant », mais l’imparfait ne rend pas au mieux la progression narrative, et « faisait brûler » introduit une nuance causative qui n’est pas exprimée par le piel de קטר.'
