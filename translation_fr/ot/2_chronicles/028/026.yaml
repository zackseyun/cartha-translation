  text: וְ/יֶ֤תֶר דְּבָרָי/ו֙ וְ/כָל דְּרָכָ֔י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: fr
  text: Le reste de ses actes et toute sa conduite, des premiers aux derniers, tout cela est écrit dans le Livre des rois de Juda et d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Le reste de ses actes
  rationale: Dans cette formule de conclusion royale, דְּבָרִים désigne les affaires ou les actions du roi plutôt que ses paroles. « Actes » convient au registre historiographique.
- source_word: וְכָל דְּרָכָיו
  choice: et toute sa conduite
  rationale: Le pluriel דְּרָכָיו évoque littéralement ses « voies », mais désigne ici l’ensemble de sa manière d’agir. « Toute sa conduite » est naturel en français et évite l’expression moins idiomatique « toutes ses voies ».
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: des premiers aux derniers
  rationale: Ces adjectifs s’accordent avec les actes et les comportements évoqués. La tournure exprime clairement le mérisme chronologique, du début à la fin.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: הִנָּם reprend avec insistance les éléments précédents. « Tout cela » conserve cette valeur démonstrative, tandis que le singulier collectif est idiomatique en français.
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Bien que עַל signifie souvent « sur », le français emploie naturellement « écrit dans » pour renvoyer au contenu d’un ouvrage.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: des rois de Juda et d’Israël
  rationale: L’expression identifie le document source cité par le Chroniste. La majuscule à « Livre » signale le titre, sans imposer inutilement une majuscule à « rois » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure de la notice historiographique tout en remplaçant l’hébraïsme « ses voies » et l’interjection archaïsante « voici » par des équivalents français naturels. Aucun marqueur de note n’est requis.
