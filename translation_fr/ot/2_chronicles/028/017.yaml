  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: fr
  text: Les Édomites étaient aussi venus attaquer Juda et avaient emmené des captifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Édomites étaient venus frapper Juda et avaient fait des captifs. » L’hébreu emploie le verbe militaire courant « frapper » et une expression formée de mots apparentés pour la prise de captifs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: encore
  rationale: Dans la suite du récit, l’expression ajoute une nouvelle attaque aux malheurs déjà rapportés. « Encore » conserve aussi la nuance possible de répétition.
- source_word: אֲדוֹמִים
  choice: les Édomites
  rationale: Le pluriel désigne les membres du peuple d’Édom, et non simplement son territoire.
- source_word: בָּאוּ
  choice: étaient venus
  rationale: Le plus-que-parfait situe naturellement cette incursion parmi les événements antérieurs qui expliquent la détresse évoquée dans le contexte.
- source_word: וַיַּכּוּ בִיהוּדָה
  choice: attaquer Juda
  rationale: Le verbe נכה signifie littéralement « frapper », mais désigne couramment une action militaire. « Attaquer » est naturel en français et n’affirme pas une défaite totale que le texte n’explicite pas.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: avaient emmené des captifs
  rationale: Le verbe et le nom apparentés expriment la prise de personnes en captivité. Cette formulation française claire évite une répétition artificielle tout en conservant le sens militaire.
