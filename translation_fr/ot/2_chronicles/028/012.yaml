base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: fr
  text: 'Alors des hommes parmi les chefs des Éphraïmites se dressèrent contre ceux qui revenaient de l’armée : Azaria, fils de Yohanân, Bérékia, fils de Meshillémoth, Ézéchias, fils de Shalloum, et Amasa, fils de Hadlaï.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se dressèrent
  rationale: Le verbe קום marque ici une action résolue et, avec עַל, une opposition. « Se dressèrent contre » restitue naturellement les deux nuances.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: quelques-uns des chefs des Éphraïmites
  rationale: Cette formulation française exprime le groupe indéfini issu des dirigeants d’Éphraïm. « Éphraïmites » rend naturellement l’expression hébraïque littérale « fils d’Éphraïm » dans son sens collectif.
- source_word: עַל הַבָּאִים
  choice: contre ceux qui revenaient
  rationale: עַל avec קום indique ici la confrontation. Le participe de בוא désigne les soldats en train de revenir, comme le confirme le contexte immédiat.
- source_word: מִן הַצָּבָא
  choice: de l’armée
  rationale: צָבָא désigne ici la force militaire partie en campagne; « armée » est clair et idiomatique en français moderne.
- source_word: עֲזַרְיָהוּ ... יְהוֹחָנָן ... בֶּרֶכְיָהוּ ... מְשִׁלֵּמוֹת ... יְחִזְקִיָּהוּ ... שַׁלֻּם ... עֲמָשָׂא ... חַדְלָי
  choice: Azaria ... Yohanân ... Bérékia ... Meshillémoth ... Ézéchias ... Shalloum ... Amasa ... Hadlaï
  rationale: Les noms propres sont translittérés sous des formes françaises reconnaissables et cohérentes; la forme française traditionnelle « Ézéchias » est retenue pour יְחִזְקִיָּהוּ.
- source_word: בֶן
  choice: fils de
  rationale: Rendu patronymique standard et transparent.
