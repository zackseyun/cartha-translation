    issue: « quelques-uns des chefs des Éphraïmites »
    rationale: Cette expression présente les personnes nommées comme un sous-groupe des chefs. L’hébreu dit plus précisément « des hommes parmi/provenant des chefs des fils d’Éphraïm » (אֲנָשִׁים מֵרָאשֵׁי), et conserve donc le nom générique « hommes » en relation avec le groupe dirigeant. Une formulation qui maintient les deux éléments est préférable.
