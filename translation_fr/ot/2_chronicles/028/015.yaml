  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: fr
  text: Alors les hommes qui avaient été désignés par leur nom se levèrent et prirent en charge les captifs. Avec le butin, ils habillèrent tous ceux d’entre eux qui étaient nus. Ils les vêtirent, leur mirent des sandales, leur donnèrent à manger et à boire, et les enduisirent d’huile. Ils transportèrent à dos d’âne tous ceux qui faiblissaient et les amenèrent à Jéricho, la ville des palmiers, auprès de leurs frères[a]. Ensuite, ils retournèrent à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs proches » ou « leurs compatriotes israélites ».
    reason: Alternative lexicale pour אֲחֵיהֶם, dont le sens collectif dépasse ici la seule fraternité biologique.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: avaient été désignés par leur nom
  rationale: Le niphal de נקב avec « par des noms » indique que ces hommes avaient été expressément identifiés; cette formulation française en conserve le caractère précis.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: prirent en charge les captifs
  rationale: Dans ce contexte de compassion, החזיק ב exprime la prise en charge plutôt qu’une saisie hostile.
- source_word: מַעֲרֻמֵּיהֶם
  choice: tous ceux d’entre eux qui étaient nus
  rationale: Cette tournure naturelle rend le groupe des captifs dépouillés ou dévêtus sans recourir à l’expression peu idiomatique « leurs nus ».
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: Avec le butin, ils habillèrent
  rationale: La formulation indique clairement que les vêtements provenaient du butin tout en conservant ce terme historique.
- source_word: וַיַּלְבִּשׁוּם
  choice: Ils leur donnèrent des vêtements
  rationale: La variation légère évite en français une répétition maladroite tout en conservant l’insistance hébraïque sur l’action de vêtir.
- source_word: וַיַּנְעִלוּם
  choice: des sandales
  rationale: Le verbe désigne le fait de chausser; « sandales » est clair et adapté au cadre ancien.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: les firent manger et boire
  rationale: Rend naturellement en français les deux formes causatives sans préciser une boisson absente de l’hébreu.
- source_word: וַיְסֻכוּם
  choice: les enduisirent d’huile
  rationale: סוך décrit ici vraisemblablement un soin corporel réparateur; cette traduction évite la possible connotation exclusivement rituelle de « oindre ».
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: ils conduisirent sur des ânes tous ceux qui étaient épuisés
  rationale: נהל évoque une conduite attentive, tandis que כושל désigne ceux qui chancellent ou faiblissent; « épuisés » convient à l’état des captifs.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Jéricho, la ville des palmiers
  rationale: Rendu transparent et traditionnel de l’épithète de Jéricho.
theological_decisions:
- issue: Sens de אֲחֵיהֶם dans le contexte de parenté collective
  choice: leurs frères
  alternative: leurs proches; leurs compatriotes israélites
  rationale: Le nom masculin pluriel signifie littéralement « leurs frères » et désigne ici les membres apparentés du peuple du royaume du Sud. Le texte principal garde cette image de parenté, tandis que la note en explicite la portée collective.
translation_notes:
  register: Français international moderne, digne et accessible. La succession rapide des soins est maintenue, avec de légers ajustements syntaxiques pour la fluidité. Le sens concret et réparateur de l’application d’huile est explicité.
