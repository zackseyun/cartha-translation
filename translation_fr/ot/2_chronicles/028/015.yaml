  naturalness: Le français est moderne et fluide. « Firent manger et boire » est grammatical, mais « donnèrent à manger et à boire » est plus idiomatique. « Conduisirent sur des ânes » peut suggérer que les accompagnateurs étaient eux-mêmes montés ; « transportèrent à dos d’âne » est plus clair dans ce contexte.
