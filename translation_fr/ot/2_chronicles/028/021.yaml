  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: fr
  text: En effet, Ahaz dépouilla[a] le temple de Yahweh, le palais royal et les hauts responsables[b], puis en donna au roi d’Assyrie. Mais cela ne lui fut d’aucun secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « partagea » ou « répartit ». Ici, le contexte indique qu’Ahaz enleva des biens au temple, au palais et aux hauts responsables.
    reason: lexical_alternative
  - marker: b
    text: Ou « les chefs », « les dignitaires » ou « les hauts fonctionnaires ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit ici l’explication de l’affirmation précédente; cette locution conserve la valeur explicative du connecteur hébreu dans un récit français naturel.
- source_word: חָלַק
  choice: dépouilla
  rationale: Le verbe signifie littéralement « partager » ou « répartir », mais le contexte indique qu’Ahaz retire des biens de ces lieux et à ces personnes pour les remettre au roi d’Assyrie. « Dépouilla » exprime ce sens contextuel sans préciser indûment la nature des biens.
- source_word: בֵּית יְהוָה
  choice: le temple de Yahweh
  rationale: Littéralement « la maison de Yahweh »; dans ce contexte historique, le référent est le temple. La formulation choisie est claire et naturelle en français moderne.
- source_word: בֵּית הַמֶּלֶךְ
  choice: le palais royal
  rationale: Littéralement « la maison du roi ». « Le palais royal » rend clairement le référent institutionnel et maintient le parallélisme des trois sources dépouillées.
- source_word: הַשָּׂרִים
  choice: les hauts responsables
  rationale: Désigne les dirigeants, dignitaires ou fonctionnaires de haut rang. Cette expression moderne évite de suggérer nécessairement des fils de roi.
- source_word: וַיִּתֵּן
  choice: puis donna le tout
  rationale: Le verbe narratif est rendu au passé simple; « le tout » reprend collectivement les biens retirés aux trois groupes ou lieux sans ajouter un objet absent du texte.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: au roi d’Assyrie
  rationale: Rendu direct et idiomatique du destinataire.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: Mais cela ne lui fut d’aucun secours
  rationale: Conserve la négation et l’idée d’aide ou de secours, tout en laissant « cela » reprendre globalement le tribut remis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le caractère de nom propre sans remplacer celui-ci par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. « Temple » et « palais royal » rendent naturellement les deux expressions hébraïques littéralement formées avec « maison ». La liste est présentée comme trois objets distincts du verbe, conformément à la syntaxe hébraïque.
