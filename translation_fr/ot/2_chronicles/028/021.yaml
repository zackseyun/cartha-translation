    issue: « le tout » explicite une totalité non formulée dans l’hébreu.
    rationale: Le texte dit qu’Ahaz donna, au roi d’Assyrie, ce qu’il avait pris, sans préciser explicitement que tous les biens furent remis. Le pronom adverbial « en » reprend les biens sans renforcer le sens.
  - severity: low
