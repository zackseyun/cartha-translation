- from: En effet, Ahaz dépouilla[a] le temple de Yahweh, le palais royal et les hauts responsables[b], puis donna le tout au roi d’Assyrie. Mais cela ne lui fut d’aucun secours.
  to: En effet, Ahaz dépouilla[a] le temple de Yahweh, le palais royal et les hauts responsables[b], puis en donna au roi d’Assyrie. Mais cela ne lui fut d’aucun secours.
  rationale: La révision limite l’explicitation de l’objet donné en remplaçant « donna le tout » par « en donna » et corrige la syntaxe de la note lexicale. Aucun changement de sens, de registre ou de terminologie théologique n’est introduit.
