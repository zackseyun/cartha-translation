  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: fr
  text: C’est pourquoi Yahvé, son Dieu, le livra entre les mains du roi d’Aram[a]. Les Araméens le battirent, lui prirent un grand nombre de captifs[b] et les emmenèrent à Damas. Il fut aussi livré entre les mains du roi d’Israël, qui lui infligea une lourde défaite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « du roi de Syrie » ; hébreu : « Aram ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « lui firent de nombreux prisonniers » ; le terme hébreu peut aussi désigner la captivité.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le frappa d’un grand coup ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ / נִתָּן
  choice: le livra / fut livré
  rationale: Avec בְּיַד, נתן exprime la remise au pouvoir d’un adversaire. « Livrer entre les mains de » conserve l’image hébraïque et, par la reprise active-passive, l’unité théologique du verset.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le possessif est conservé, y compris dans ce contexte de jugement.
- source_word: מֶלֶךְ אֲרָם
  choice: le roi d’Aram
  rationale: Aram est le nom propre hébreu; « Syrie » est signalé comme équivalent traditionnel en note.
- source_word: וַיַּכּוּ בוֹ
  choice: Les Araméens le battirent
  rationale: Le sujet pluriel implicite renvoie aux forces du roi d’Aram. « Battirent » convient au contexte militaire sans préciser davantage la nature de l’action.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: lui prirent un grand nombre de captifs
  rationale: שִׁבְיָה peut désigner la captivité ou l’ensemble des captifs; la formulation française exprime naturellement ici le sens concret tout en laissant l’autre possibilité en note.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: et les emmenèrent à Damas
  rationale: Le complément implicite est fourni d’après l’antécédent « captifs », comme l’exige un français naturel.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: qui lui infligea une lourde défaite
  rationale: Dans ce récit militaire, מַכָּה גְדוֹלָה désigne naturellement un coup dévastateur ou une grande défaite; la traduction idiomatique est accompagnée d’une note conservant l’image littérale.
theological_decisions:
- issue: L’action divine dans la défaite
  choice: Yahvé est explicitement présenté comme celui qui livre le roi au pouvoir de ses ennemis.
  alternative: Présenter les événements comme une défaite purement politique ou militaire.
  rationale: Les deux formes de נתן, d’abord active puis passive, encadrent les défaites comme un jugement divin; la traduction préserve cette causalité sans l’amplifier.
- issue: Référent des pronoms masculins singuliers
  choice: Conserver le singulier renvoyant au roi mentionné dans le contexte, sans remplacer les pronoms par « Juda ».
  alternative: Expliciter collectivement « Juda » ou « son peuple ».
  rationale: Le texte hébreu emploie des suffixes masculins singuliers. Même si les captifs viennent nécessairement de son royaume, la traduction ne résout pas silencieusement cette tension entre le roi et le peuple qu’il représente.
- issue: Rendu du nom divin
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; un nom propre français préserve cette donnée plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre historique biblique. « Entre les mains de » maintient une image hébraïque encore naturelle en français; les formulations militaires sont idiomatiques sans effacer les alternatives littérales, données en notes.
