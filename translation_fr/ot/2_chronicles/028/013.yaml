  text: וַ/יֹּאמְר֣וּ לָ/הֶ֗ם לֹא תָבִ֤יאוּ אֶת הַ/שִּׁבְיָה֙ הֵ֔נָּה כִּי֩ לְ/אַשְׁמַ֨ת יְהוָ֤ה עָלֵ֨י/נוּ֙ אַתֶּ֣ם אֹמְרִ֔ים לְ/הֹסִ֥יף עַל חַטֹּאתֵ֖י/נוּ וְ/עַל אַשְׁמָתֵ֑י/נוּ כִּֽי רַבָּ֤ה אַשְׁמָה֙ לָ֔/נוּ וַ/חֲר֥וֹן אָ֖ף עַל יִשְׂרָאֵֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: fr
  text: 'Ils leur dirent : « N’amenez pas ici les captifs, car vous voulez ajouter à nos péchés et à notre culpabilité, de sorte qu’une culpabilité envers Yahweh[a] pèserait sur nous. Notre culpabilité est déjà grande, et une colère ardente[b] pèse sur Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque est concise et peut aussi se comprendre : « une culpabilité venant de Yahweh sur nous », c’est-à-dire une culpabilité entraînant son jugement.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une brûlure de colère », expression qui désigne une colère intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: les captifs
  rationale: Le nom peut désigner l’état de captivité ou l’ensemble des personnes capturées. Avec le verbe « faire entrer », le sens concret « les captifs » convient au contexte.
- source_word: הֵנָּה
  choice: ici
  rationale: Cet adverbe indique un mouvement vers le lieu où se trouvent les locuteurs ; « faire entrer ici » est naturel en français.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: faire peser sur nous une culpabilité devant Yahweh
  rationale: La formule hébraïque est compacte et difficile. Cette traduction exprime la culpabilité qui retomberait sur le peuple dans sa relation à Yahweh, sans effacer l’ambiguïté, signalée en note.
- source_word: אַתֶּם אֹמְרִים
  choice: vous voulez
  rationale: Littéralement « vous dites », mais la formule exprime ici une intention. « Vous voulez » communique cette valeur délibérative dans un français courant.
- source_word: לְהֹסִיף עַל
  choice: ajouter à
  rationale: Rend directement l’idée d’accroître une culpabilité déjà existante.
- source_word: חַטֹּאתֵינוּ
  choice: nos péchés
  rationale: Le pluriel désigne les actes fautifs et reste distinct du terme exprimant la culpabilité.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: notre culpabilité
  rationale: « Culpabilité » exprime l’état de faute ou la responsabilité encourue, par contraste avec les « péchés » eux-mêmes.
- source_word: רַבָּה
  choice: déjà grande
  rationale: « Grande » traduit le sens lexical ; « déjà » explicite sobrement l’argument contextuel selon lequel une nouvelle faute aggraverait une culpabilité existante.
- source_word: וַחֲרוֹן אָף
  choice: une ardente colère
  rationale: L’expression signifie littéralement une « brûlure de colère » et décrit une colère intense. « Ardente colère » conserve l’image et demeure intelligible.
- source_word: עַל יִשְׂרָאֵל
  choice: pèse sur Israël
  rationale: Avec la colère, la préposition עַל indique ici que celle-ci repose sur Israël. « Pèse sur » s’accorde aussi naturellement avec le parallélisme de la phrase.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Sens de לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: une culpabilité devant Yahweh pesant sur nous
  alternative: une culpabilité venant de Yahweh sur nous
  rationale: Le rapport entre la culpabilité, Yahweh et le peuple est syntaxiquement compact. Le texte principal retient la responsabilité devant Yahweh, tandis que la note maintient possible l’idée de culpabilité ou de condamnation venant de son jugement.
- issue: Référent d’Israël
  choice: Israël
  alternative: Éphraïm / le royaume du Nord
  rationale: L’hébreu dit « Israël ». Le nom canonique est conservé sans réduire son sens au référent politique immédiat.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste ferme et naturel. Les termes « péchés » et « culpabilité » sont distingués, et l’ambiguïté de la formule relative à Yahweh est conservée au moyen d’une note.
