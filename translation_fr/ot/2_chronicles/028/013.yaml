revisions:
- from: 'Ils leur dirent : « Ne faites pas entrer ici les captifs, car vous voulez ajouter à nos péchés et à notre culpabilité, et ainsi faire peser sur nous une culpabilité devant Yahweh[a]. Notre culpabilité est déjà grande, et une ardente colère[b] pèse sur Israël. »'
  to: 'Ils leur dirent : « N’amenez pas ici les captifs, car vous voulez ajouter à nos péchés et à notre culpabilité, de sorte qu’une culpabilité envers Yahweh[a] pèserait sur nous. Notre culpabilité est déjà grande, et une colère ardente[b] pèse sur Israël. »'
  rationale: La révision corrige une construction française maladroite et replace la relation entre la culpabilité, Yahweh et le peuple dans une formulation idiomatique. « De sorte que » rend explicitement la conséquence implicite entre le projet d’ajouter aux fautes et la culpabilité encourue. La note conserve l’autre compréhension possible de la formule hébraïque. « N’amenez pas » est le verbe français direct et naturel pour l’injonction de ne pas apporter les captifs au lieu des locuteurs.
