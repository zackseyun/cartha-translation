source:
  edition: WLC
  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: fr
  text: 'Car Yahweh avait abaissé Juda à cause d’Ahaz, roi d’Israël[a] : celui-ci avait agi sans retenue en Juda[b] et s’était montré très infidèle envers Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ahaz, roi d’Israël ». Ahaz était roi de Juda ; la formulation du texte hébreu est conservée plutôt qu’harmonisée.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « avait agi de manière effrénée en Juda » ; autre compréhension possible : « avait semé le désordre en Juda ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: avait abaissé
  rationale: Le hiphil de כנע exprime ici l’action de faire descendre Juda de sa position et de l’humilier. « Avait abaissé » garde la valeur causative sans limiter le propos à une soumission militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin conserve le nom propre présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בַּעֲבוּר
  choice: à cause de
  rationale: Dans ce contexte, la locution introduit la cause de l’abaissement de Juda.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Le texte massorétique désigne explicitement Ahaz ainsi. Cette formulation est conservée, sans harmonisation historique avec « roi de Juda ».
- source_word: הִפְרִיעַ
  choice: avait agi sans retenue
  rationale: Le hiphil de פרע peut évoquer le fait de se débrider, de laisser aller ou de provoquer le désordre. Cette formulation française naturelle conserve l’idée de dérèglement moral sans en préciser excessivement le mécanisme.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition indique ici la sphère dans laquelle l’action d’Ahaz s’est exercée.
- source_word: וּמָעוֹל מַעַל
  choice: s’était rendu gravement infidèle
  rationale: L’association de l’infinitif absolu et de la forme verbale de même racine intensifie מעל, qui désigne une infidélité ou une trahison, notamment dans le cadre de l’alliance.
- source_word: בַּיהוָה
  choice: envers Yahweh
  rationale: Avec מעל, « envers » indique naturellement celui que vise l’infidélité, tout en évitant une tournure française pesante.
theological_decisions:
- issue: Ahaz est appelé « roi d’Israël »
  choice: Conserver « Ahaz, roi d’Israël » dans le texte principal.
  alternative: Harmoniser avec les données historiques en écrivant « Ahaz, roi de Juda ».
  rationale: Même si Ahaz régnait historiquement sur Juda, l’hébreu porte « roi d’Israël ». La formulation peut avoir une portée rhétorique ou théologique dans les Chroniques; la traduction ne doit pas supprimer cette tension.
- issue: Portée de הִפְרִיעַ
  choice: Traduire par « avait agi sans retenue » et signaler les autres nuances en note.
  alternative: Traduire directement par « avait semé le désordre » ou « avait livré Juda au dérèglement ».
  rationale: Le verbe admet des nuances liées au relâchement, à l’action effrénée et au désordre. Le texte principal garde une formulation ouverte, tandis que la note rend visibles les principales possibilités.
translation_notes:
  register: Français international moderne, courant et digne. La phrase garde le rapport causal répété de l’hébreu tout en remplaçant le second « car » par les deux-points pour éviter une lourdeur. Les notes conservent l’anomalie historique apparente et l’étendue sémantique du verbe הִפְרִיעַ.
