  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: fr
  text: Il brûla aussi de l’encens dans la vallée de Ben-Hinnom et brûla ses fils dans le feu[a], suivant les pratiques abominables des nations que Yahweh avait chassées de devant les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit passer ses fils par le feu ». L’hébreu dit ici plus directement : « brûla ses fils dans le feu ».'
    reason: Signaler une autre formulation traditionnelle possible sans atténuer dans le texte principal la force du verbe hébreu.
lexical_decisions:
- source_word: הִקְטִיר
  choice: brûla de l’encens
  rationale: Le hifil de קטר désigne le fait de faire monter la fumée d’une offrande, souvent celle de l’encens. Cette formulation est naturelle en français et convient au contexte cultuel sans préciser davantage l’objet brûlé.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: dans la vallée de Ben-Hinnom
  rationale: Il s’agit d’un nom de lieu. La translittération « Ben-Hinnom » préserve le cadre historique sans introduire les associations plus tardives de « géhenne ».
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: brûla ses fils dans le feu
  rationale: Le hifil de בער, accompagné de « dans le feu », exprime directement l’action de brûler. « Fils » rend précisément le masculin pluriel בָּנָיו, et la formulation conserve la dureté du texte.
- source_word: כְּתוֹעֲבוֹת
  choice: suivant les pratiques abominables
  rationale: Cette expression rend la comparaison ou la conformité indiquée par כ tout en explicitant naturellement en français que תועבות désigne ici des actes cultuels jugés abominables.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte historique, le terme désigne les peuples antérieurement établis dans le pays. « Nations » reste proche de l’hébreu et évite la charge religieuse possible de « païens ».
- source_word: הֹרִישׁ
  choice: avait chassées
  rationale: Le hifil de ירש évoque ici l’expulsion ou la dépossession des anciens habitants. Le plus-que-parfait marque clairement l’antériorité de cette action.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: devant les fils d’Israël
  rationale: La formulation conserve l’image spatiale de l’hébreu et rend littéralement l’expression généalogique « fils d’Israël ».
theological_decisions:
- issue: Faut-il atténuer la description du sacrifice des fils en employant la formule « faire passer par le feu » ?
  choice: 'Le texte principal dit : « brûla ses fils dans le feu »'
  alternative: « fit passer ses fils par le feu »
  rationale: Le verset emploie בער, « brûler », et non la formule habituelle signifiant explicitement « faire passer par le feu ». La traduction principale conserve donc la force particulière de l’hébreu, tandis que l’autre compréhension est signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe demeure proche de l’hébreu tout en évitant les tournures inutilement archaïques. Le marqueur de note [a] est placé immédiatement après l’expression qu’il commente.
