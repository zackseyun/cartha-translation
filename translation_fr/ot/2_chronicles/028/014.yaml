  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: fr
  text: Alors les hommes armés laissèrent les captifs et le butin devant les chefs et toute l’assemblée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: laissèrent
  rationale: Le verbe עזב signifie couramment « laisser » ou « abandonner ». Ici, il décrit le fait de remettre les captifs et le butin à la disposition des responsables; « laissèrent » conserve simplement l’action exprimée sans ajouter l’idée explicite d’une libération.
- source_word: הֶחָלוּץ
  choice: les hommes armés
  rationale: Le terme désigne ici collectivement ceux qui sont équipés pour le combat. « Les hommes armés » est naturel en français et convient au contexte militaire.
- source_word: הַשִּׁבְיָה
  choice: les captifs
  rationale: Bien que le nom puisse désigner abstraitement la captivité, il renvoie ici concrètement aux personnes emmenées à la guerre.
- source_word: הַבִּזָּה
  choice: le butin
  rationale: Le nom désigne les biens pris à la guerre. « Butin » est le terme français courant et précis.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition peut indiquer à la fois une position en face de quelqu’un et une action accomplie en sa présence. « Devant » préserve cette latitude.
- source_word: הַשָּׂרִים
  choice: les chefs
  rationale: שׂרים désigne des personnes investies d’autorité. Dans ce contexte, « chefs » est plus naturel et moins administratif que « fonctionnaires », sans les identifier nécessairement comme des commandants militaires ou des princes royaux.
- source_word: כָל הַקָּהָל
  choice: toute l’assemblée
  rationale: קהל désigne la communauté rassemblée. « Toute l’assemblée » restitue naturellement la totalité exprimée par כָל et demeure neutre quant au caractère civil ou cultuel du rassemblement.
