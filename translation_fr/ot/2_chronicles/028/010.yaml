  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: fr
  text: Et maintenant, vous dites que vous allez réduire les habitants de Juda et de Jérusalem[a] en esclavage, hommes et femmes, pour vous-mêmes[b]. Mais vous-mêmes, n’êtes-vous pas coupables devant Yahweh, votre Dieu[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les fils de Juda et de Jérusalem ». L’hébreu emploie une expression masculine plurielle pour désigner collectivement la population.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « soumettre comme esclaves, hommes et femmes, pour vous-mêmes ».'
    reason: lexical_alternative
  - marker: c
    text: 'La dernière question est très condensée en hébreu ; on pourrait la rendre plus littéralement : « N’y a-t-il pas, justement chez vous, des actes coupables envers Yahweh, votre Dieu ? »'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Ce marqueur de discours conserve à la fois la coordination exprimée par וְ et l’introduction de la réprimande présente par עַתָּה.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: les habitants de Juda et de Jérusalem
  rationale: Littéralement « les fils de Juda et de Jérusalem », l’expression masculine plurielle désigne ici collectivement la population. « Habitants » rend ce sens sans suggérer que seuls des hommes sont concernés.
- source_word: אַתֶּם אֹמְרִים
  choice: vous dites
  rationale: Le pronom explicite et le participe présentent leur projet comme l’affirmation actuelle que le prophète leur reproche.
- source_word: לִכְבֹּשׁ
  choice: réduire … en esclavage
  rationale: Le verbe כּבש signifie soumettre ou assujettir. Avec les compléments « esclaves hommes et femmes », le français idiomatique « réduire en esclavage » exprime clairement la contrainte et le résultat visé.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: en esclavage, hommes et femmes
  rationale: Les deux substantifs distinguent les esclaves masculins et féminins. Cette formulation actuelle maintient cette inclusion tout en évitant une coordination française pesante.
- source_word: לָכֶם
  choice: pour votre propre compte
  rationale: Le datif exprime ici l’avantage et la possession recherchés par les vainqueurs; cette expression fait ressortir qu’ils veulent acquérir ces personnes pour eux-mêmes.
- source_word: הֲלֹא רַק אַתֶּם … עִמָּכֶם אֲשָׁמוֹת
  choice: Mais n’êtes-vous pas, vous aussi, coupables
  rationale: La question hébraïque est fortement condensée. Cette formulation conserve sa force rhétorique, l’insistance sur « vous » et l’idée que les accusateurs portent eux aussi une culpabilité.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: envers Yahweh, votre Dieu
  rationale: La préposition marque ici la relation de culpabilité à l’égard de Dieu. Le nom divin יהוה est transcrit « Yahweh » afin de préserver le nom propre du texte source.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Statut exprimé par עֲבָדִים et שְׁפָחוֹת
  choice: en esclavage, hommes et femmes
  alternative: comme serviteurs et servantes
  rationale: Le contexte est celui de captifs de guerre soumis de force. « Esclavage » rend sans atténuation le statut coercitif envisagé.
- issue: Sens de la question finale condensée
  choice: n’êtes-vous pas, vous aussi, coupables envers Yahweh
  alternative: n’y a-t-il pas seulement chez vous des actes coupables envers Yahweh
  rationale: La traduction retenue exprime naturellement la réprimande et l’emphase sur la culpabilité des destinataires, tandis qu’une note conserve la forme plus littérale et l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, direct et digne. « Réduire en esclavage » nomme clairement la violence du projet; « habitants » rend la valeur collective de « fils »; la question finale reste rhétorique, tandis que la note signale sa syntaxe hébraïque comprimée.
