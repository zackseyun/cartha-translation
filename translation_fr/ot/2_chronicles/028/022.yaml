  text: וּ/בְ/עֵת֙ הָצֵ֣ר ל֔/וֹ וַ/יּ֖וֹסֶף לִ/מְע֣וֹל בַּ/יהוָ֑ה ה֖וּא הַ/מֶּ֥לֶךְ אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: fr
  text: Au temps de sa détresse, il continua[a] à se montrer infidèle envers Yahweh — lui, le roi Ahaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ajouta à agir infidèlement »; l’expression peut signifier qu’il persista dans son infidélité ou qu’il alla encore plus loin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: Au temps de sa détresse
  rationale: La tournure conserve le cadre temporel et exprime naturellement en français la situation où Ahaz se trouvait accablé ou sous pression.
- source_word: וַיּוֹסֶף
  choice: il continua
  rationale: Avec l’infinitif qui suit, יסף signifie couramment continuer une action ou la pousser plus loin. « Continua » rend clairement l’idiome sans imposer l’idée plus précise d’une intensification.
- source_word: לִמְעוֹל
  choice: à se montrer infidèle
  rationale: מעל désigne une rupture de fidélité, notamment envers Dieu. Cette formulation actuelle préserve sa portée morale et religieuse.
- source_word: בַּיהוָה
  choice: envers Yahweh
  rationale: Avec מעל, la préposition indique celui à l’égard de qui l’infidélité est commise. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: — lui, le roi Ahaz
  rationale: Le pronom indépendant הוּא met fortement en relief l’identité du coupable. Le tiret et « lui » reproduisent cette insistance inhabituelle, tandis que « le roi Ahaz » reste idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme; « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Portée de מעל
  choice: se montrer infidèle envers Yahweh
  alternative: commettre un sacrilège contre Yahweh
  rationale: Le terme peut avoir une coloration cultuelle ou liée à l’alliance, mais le contexte immédiat ne justifie pas de restreindre son sens à un acte sacrilège précis. La traduction conserve donc la notion générale de rupture de fidélité.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en étant naturelle; l’incise finale conserve l’accent accusateur porté sur l’identité royale d’Ahaz.
