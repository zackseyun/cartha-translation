  text: וּ/בְ/כָל עִ֨יר וָ/עִ֤יר לִֽ/יהוּדָה֙ עָשָׂ֣ה בָמ֔וֹת לְ/קַטֵּ֖ר לֵֽ/אלֹהִ֣ים אֲחֵרִ֑ים וַ/יַּכְעֵ֕ס אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: fr
  text: Dans chaque ville de Juda[a], il établit des hauts lieux pour y brûler de l’encens à d’autres dieux, et il provoqua la colère de Yahweh, le Dieu de ses pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans toute ville et ville de Juda » ; cette répétition est une tournure distributive qui signifie « dans chaque ville de Juda ».'
    reason: La note rend visible l’insistance de la construction hébraïque, que le français idiomatique ne reproduit pas mot à mot.
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: Dans chaque ville de Juda
  rationale: La répétition distributive hébraïque עִיר וָעִיר souligne que toutes les villes sont concernées. « Dans chaque ville de Juda » en restitue naturellement la portée exhaustive en français.
- source_word: עָשָׂה בָמוֹת
  choice: il établit des hauts lieux
  rationale: Le verbe עשה est général (« faire »), mais « établir » convient naturellement à la création de lieux de culte. « Hauts lieux » conserve le terme biblique usuel pour les sites cultuels désignés par בָּמוֹת.
- source_word: לְקַטֵּר לֵאלֹהִים אֲחֵרִים
  choice: pour faire brûler de l’encens en l’honneur d’autres dieux
  rationale: Le piel de קטר désigne ici l’action de faire monter la fumée de l’encens. « En l’honneur de » exprime idiomatiquement la destination cultuelle marquée par ל sans qualifier ces dieux d’« étrangers », nuance absente du texte.
- source_word: וַיַּכְעֵס אֶת יְהוָה
  choice: et il provoqua la colère de Yahweh
  rationale: Le hiphil de כעס signifie causer l’irritation ou provoquer à la colère. Cette formulation explicite en français le complément de sens inhérent à la forme causative.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: le Dieu de ses pères
  rationale: « Ses pères » conserve la formulation historique et l’écho biblique de l’expression hébraïque, qui renvoie aux ancêtres d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom propre divin au lieu de lui substituer un titre.
- issue: Statut des אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  alternative: des dieux étrangers
  rationale: Le texte les présente comme des divinités autres que Yahweh, sans ajouter explicitement la notion d’origine étrangère. La traduction conserve cette formulation sans statuer sur leur réalité ontologique.
translation_notes:
  register: Français international actuel, naturel et digne. Le passé simple convient au récit historique. « Hauts lieux » et « Dieu de ses pères » maintiennent la résonance biblique sans rendre la phrase obscure.
