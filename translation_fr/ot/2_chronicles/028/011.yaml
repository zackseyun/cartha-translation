review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèlement rendu : l’exhortation urgente, le renvoi des personnes capturées, le langage de parenté, la colère ardente et le nom Yahweh sont conservés. Toutefois, « les captifs que vous avez faits parmi vos frères » est ambigu en français : « parmi vos frères » peut se rattacher à l’action de faire des captifs plutôt qu’indiquer clairement que les captifs ont été pris au sein de leurs frères. « Capturés parmi vos frères » rend plus nettement la relation de מֵאֲחֵיכֶם.'
  naturalness: Le registre est moderne, direct et approprié. La formulation révisée est plus idiomatique et évite l’ambiguïté syntaxique de « que vous avez faits parmi vos frères ». « La colère ardente de Yahweh est sur vous » demeure une expression française compréhensible qui préserve volontairement l’image du texte hébreu.
  terminology: « Yahweh » correspond au tétragramme. « Frères » conserve le terme de parenté אָח sans imposer une lecture restrictive, et la note explicite sobrement son emploi collectif. La note doit dire « compatriotes israélites », non « autres Israélites », car « autres » n’est pas exprimé dans l’hébreu.
  issues:
  - severity: medium
    issue: Ambiguïté dans « les captifs que vous avez faits parmi vos frères »
    rationale: La construction française ne rattache pas avec assez de netteté « parmi vos frères » aux personnes capturées. Le texte hébreu indique que les captifs ont été pris d’entre leurs frères.
  - severity: low
    issue: La note ajoute « autres » dans « les autres Israélites »
    rationale: Le terme « autres » n’a pas de correspondant explicite en hébreu. « Compatriotes israélites » explique la portée collective sans ajout inutile.
  revised_text: Maintenant, écoutez-moi et renvoyez les captifs que vous avez capturés parmi vos frères[a], car la colère ardente de Yahweh est sur vous.
