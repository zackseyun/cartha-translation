base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: fr
  text: Maintenant, écoutez-moi et renvoyez les captifs que vous avez capturés parmi vos frères[a], car la colère ardente de Yahweh est sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi vos compatriotes israélites ». L’hébreu dit « parmi vos frères » et emploie un terme de parenté pour désigner des membres du même peuple de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit une transition urgente dans le discours direct. Le français peut naturellement omettre la conjonction initiale.
- source_word: שְׁמָעוּנִי
  choice: écoutez-moi
  rationale: L’impératif appelle une écoute attentive et obéissante; « écoutez-moi » en exprime naturellement la force exhortative.
- source_word: וְהָשִׁיבוּ
  choice: renvoyez
  rationale: Le hifil de שוב signifie ici faire retourner les captifs. « Renvoyez » est direct et naturel, sans préciser dans le texte une destination que l’hébreu laisse implicite.
- source_word: הַשִּׁבְיָה
  choice: les captifs
  rationale: Le nom collectif désigne concrètement les personnes emmenées à la guerre; « les captifs » conserve cette référence humaine.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: que vous avez faits
  rationale: Avec « captifs », l’expression française « faire des captifs » rend sans lourde répétition l’action de capturer.
- source_word: מֵאֲחֵיכֶם
  choice: parmi vos frères
  rationale: « Frères » préserve le langage de parenté de l’hébreu, tandis que « parmi » indique qu’ils ont été pris au sein du peuple apparenté sans suggérer qu’ils auraient été enlevés à des tiers.
- source_word: חֲרוֹן אַף
  choice: la colère ardente
  rationale: Cette formulation conserve l’image hébraïque de la chaleur brûlante de la colère ainsi que son intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: עֲלֵיכֶם
  choice: est sur vous
  rationale: La formulation garde l’image spatiale de la préposition על et exprime que cette colère repose sur les destinataires.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » en conserve la fonction de nom personnel sans lui substituer un titre.
- issue: Portée du terme « frères »
  choice: vos frères
  alternative: vos compatriotes israélites
  rationale: Le texte emploie un terme de parenté qui présente les captifs comme membres du même peuple. Le texte principal garde cette image, et la note en explicite la portée collective.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif pluriel conserve l’urgence du discours. Le léger relief sémitique de « la colère ardente de Yahweh est sur vous » est maintenu afin de préserver l’image et l’intensité de l’original.
