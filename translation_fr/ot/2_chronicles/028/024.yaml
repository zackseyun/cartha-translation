base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: fr
  text: Ahaz rassembla les objets de la maison de Dieu et les mit en pièces. Il ferma les portes de la maison de l’Éternel et se fit des autels à chaque coin de Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי
  choice: objets
  rationale: Dans le contexte du sanctuaire, le terme désigne les objets ou ustensiles servant au culte. « Objets » est naturel et suffisamment large en français moderne.
- source_word: וַיְקַצֵּץ
  choice: les mit en pièces
  rationale: Le verbe exprime l’action de couper ou de briser en morceaux. Cette formulation rend clairement la destruction sans imposer une technique précise.
- source_word: בְּכָל־פִּנָּה
  choice: à tous les coins
  rationale: Rend directement l’expression distributive hébraïque, qui évoque les différents coins de la ville.
- source_word: בֵית יְהוָה
  choice: maison de l’Éternel
  rationale: « Maison » conserve le motif hébraïque, tandis que « l’Éternel » suit une convention française établie pour le tétragramme.
theological_decisions:
- issue: Répétition de « les objets de la maison de Dieu »
  choice: Employer un pronom dans la seconde proposition
  alternative: Répéter intégralement « les objets de la maison de Dieu »
  rationale: Le pronom conserve sans ambiguïté le même référent tout en produisant un français naturel; aucune portée théologique de la répétition n’est perdue.
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: YHWH ou Yahvé
  rationale: Cette convention française distingue יהוה de אֱלֹהִים dans le même verset et demeure digne et largement compréhensible, sans prétendre trancher la vocalisation du nom.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme des actions d’Ahaz est conservé, avec une légère réduction de la répétition lexicale pour la fluidité.
