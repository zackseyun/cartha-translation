  source_fidelity: 'Le texte rend fidèlement la succession des quatre actions d’Achaz : il rassemble les objets cultuels, les met en pièces, ferme les portes du temple de YHWH, puis fait ériger des autels dans toute Jérusalem. Le pronom « les » reprend sans ambiguïté « les objets de la maison de Dieu ».'
