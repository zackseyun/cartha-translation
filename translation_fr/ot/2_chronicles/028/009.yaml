  text: וְ֠/שָׁם הָיָ֨ה נָבִ֥יא לַֽ/יהוָה֮ עֹדֵ֣ד שְׁמ/וֹ֒ וַ/יֵּצֵ֗א לִ/פְנֵ֤י הַ/צָּבָא֙ הַ/בָּ֣א לְ/שֹׁמְר֔וֹן וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִ֠נֵּה בַּ/חֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי אֲבוֹתֵי/כֶ֛ם עַל יְהוּדָ֖ה נְתָנָ֣/ם בְּ/יֶדְ/כֶ֑ם וַ/תַּֽהַרְגוּ בָ֣/ם בְ/זַ֔עַף עַ֥ד לַ/שָּׁמַ֖יִם הִגִּֽיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: fr
  text: 'Il y avait là un prophète du SEIGNEUR nommé Oded. Il sortit à la rencontre de l’armée qui arrivait à Samarie et leur dit : « Écoutez ! Parce que le SEIGNEUR, le Dieu de vos ancêtres, était en colère contre Juda, il les a livrés entre vos mains. Mais vous les avez tués avec une fureur qui est montée jusqu’au ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיהוָה
  choice: du SEIGNEUR
  rationale: Rend l’appartenance du prophète à YHWH et suit la convention française courante qui représente le tétragramme par « SEIGNEUR ».
- source_word: לִפְנֵי הַצָּבָא
  choice: à la rencontre de l’armée
  rationale: Dans ce contexte de déplacement, l’expression indique qu’Oded sort au-devant de l’armée, formulation plus naturelle en français que « devant l’armée ».
- source_word: הִנֵּה
  choice: Écoutez !
  rationale: Marque avec naturel l’appel solennel à l’attention au début du discours prophétique.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: le Dieu de vos ancêtres
  rationale: « Ancêtres » communique en français moderne le sens collectif de « pères » sans le limiter aux pères immédiats.
- source_word: בְזַעַף עַד לַשָּׁמַיִם הִגִּיעַ
  choice: avec une fureur qui est montée jusqu’au ciel
  rationale: Conserve l’image hyperbolique selon laquelle leur fureur atteint le ciel, c’est-à-dire qu’elle appelle l’attention et le jugement divins.
theological_decisions:
- issue: Rapport entre la colère divine et la violence d’Israël
  choice: « il les a livrés entre vos mains. Mais vous les avez tués »
  alternative: « il les a livrés entre vos mains, et vous les avez tués »
  rationale: '« Mais » explicite le contraste pragmatique du reproche : la victoire accordée par Dieu n’excusait pas la violence furieuse des vainqueurs, sans nier que Dieu avait livré Juda entre leurs mains.'
- issue: Désignation du Dieu d’Israël
  choice: SEIGNEUR
  alternative: Yahvé
  rationale: La petite capitale respecte la convention biblique française traditionnelle pour le tétragramme tout en distinguant le nom divin du titre ordinaire « Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques lourds; le discours prophétique garde sa vigueur et la tension entre l’action souveraine de Dieu et la culpabilité humaine.
