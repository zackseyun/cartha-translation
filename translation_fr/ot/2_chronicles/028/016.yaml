source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא שָׁלַ֞ח הַ/מֶּ֧לֶךְ אָחָ֛ז עַל מַלְכֵ֥י אַשּׁ֖וּר לַ/עְזֹ֥ר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: fr
  text: À cette époque, le roi Ahaz envoya demander de l’aide aux rois d’Assyrie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « rois d’Assyrie »; certaines traductions mettent « roi d’Assyrie » pour harmoniser le texte avec la situation historique.
    reason: Signaler le pluriel inattendu du texte massorétique et l’autre traduction courante.
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Expression temporelle naturelle en français moderne, qui situe clairement l’épisode dans le récit.
- source_word: שָׁלַח
  choice: envoya demander
  rationale: Le verbe signifie littéralement « envoya »; puisque son objet reste implicite, cette formulation française exprime naturellement l’envoi d’une demande sans ajouter explicitement des messagers.
- source_word: הַמֶּלֶךְ אָחָז
  choice: le roi Ahaz
  rationale: Cette tournure rend naturellement en français le titre suivi du nom propre.
- source_word: עַל
  choice: aux
  rationale: Avec שׁלח dans ce contexte, la préposition indique les destinataires auxquels Ahaz adresse sa demande.
- source_word: מַלְכֵי אַשּׁוּר
  choice: rois d’Assyrie
  rationale: Le texte massorétique porte sans ambiguïté morphologique le pluriel « rois »; celui-ci est donc conservé malgré la difficulté historique.
- source_word: לַעְזֹר לוֹ
  choice: demander de l’aide
  rationale: L’infinitif exprime le but de l’envoi. Cette formulation idiomatique évite de suggérer plus précisément que le texte la manière dont l’aide serait apportée; le bénéficiaire, Ahaz, ressort du contexte.
theological_decisions:
- issue: Faut-il harmoniser le pluriel « rois d’Assyrie » avec le singulier historiquement attendu?
  choice: Conserver « rois d’Assyrie » dans le texte principal.
  alternative: « roi d’Assyrie »
  rationale: Même si le singulier correspond mieux à la situation historique généralement comprise et apparaît dans diverses traductions, le texte hébreu massorétique est au pluriel. La traduction conserve cette difficulté textuelle au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, simple et digne. « Envoya demander de l’aide » est plus idiomatique que le calque « envoya aux rois… pour l’aider », tout en maintenant l’acte d’envoyer explicitement exprimé en hébreu. Le nom Ahaz est conservé sous cette forme.
