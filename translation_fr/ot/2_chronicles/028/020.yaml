  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: fr
  text: Alors Téglath-Phalasar, roi d’Assyrie, vint l’attaquer, le mit en détresse[a], mais ne le soutint pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le harcela » ; le verbe hébreu peut évoquer le fait de serrer de près, d’accabler ou de traiter en adversaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: vint l’attaquer
  rationale: Dans ce contexte militaire et politique, בוא על a un sens hostile. « Vint l’attaquer » l’exprime naturellement en français, sans le réduire à une simple venue auprès d’Ahaz.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Téglath-Phalasar
  rationale: Forme française traditionnelle et largement reconnue du nom du roi assyrien.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: Traduction directe et idiomatique de la construction hébraïque.
- source_word: וַיָּצַר לוֹ
  choice: le mit en détresse
  rationale: Le verbe exprime l’idée de serrer, harceler ou accabler. Cette formulation conserve une portée assez large sans imposer le sens plus étroit de « l’assiéger ».
- source_word: וְלֹא חֲזָקוֹ
  choice: sans lui apporter de soutien
  rationale: חזק peut ici signifier fortifier ou soutenir. La formulation française rend le contraste contextuel avec l’aide qu’Ahaz attendait, tout en restant proche du sens de la clause négative.
theological_decisions:
- issue: Nature du contraste entre les deux dernières propositions
  choice: Rendre וְלֹא par « sans » afin d’exprimer que l’intervention assyrienne n’a fourni aucun soutien à Ahaz.
  alternative: « et ne le fortifia pas » ou « mais ne lui apporta aucun soutien »
  rationale: L’hébreu juxtapose le tort causé et l’absence de renforcement. « Sans » fait entendre leur contraste naturel en français sans transformer explicitement la seconde proposition en « au lieu de », formulation plus interprétative.
translation_notes:
  register: Français moderne, digne et accessible. Le nom royal suit l’usage biblique français courant. La syntaxe demeure concise et conserve la tension entre l’action hostile du roi d’Assyrie et le soutien qu’Ahaz espérait de lui.
