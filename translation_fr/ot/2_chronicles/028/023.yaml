  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: fr
  text: 'Il offrit des sacrifices aux dieux de Damas qui l’avaient frappé[a], et il dit : « Puisque les dieux des rois d’Aram leur viennent en aide, je leur offrirai des sacrifices afin qu’ils me viennent en aide. » Mais ce sont eux qui causèrent sa chute et celle de tout Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui étaient en train de le vaincre ». Le participe hébreu peut décrire une action en cours ou caractéristique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Il offrit des sacrifices
  rationale: Le verbe זבח désigne l’action cultuelle de sacrifier. Cette tournure est naturelle en français et garde le sens rituel.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: aux dieux de Damas
  rationale: אֱלֹהֵי est ici un pluriel construit dans un contexte d’idolâtrie; « Damas » est la forme française usuelle du toponyme.
- source_word: הַמַּכִּים בּוֹ
  choice: qui l’avaient frappé
  rationale: Le participe attributif présente ces dieux, selon la compréhension d’Ahaz, comme ceux qui l’avaient frappé. Le plus-que-parfait convient à la séquence narrative, tandis qu’une note conserve la valeur éventuellement durative.
- source_word: כִּי
  choice: Puisque
  rationale: La conjonction introduit le raisonnement causal d’Ahaz. « Puisque » rend bien la prémisse qu’il tient pour acquise.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: les dieux des rois d’Aram
  rationale: La traduction conserve explicitement le pluriel מַלְכֵי, « rois », sans le ramener au singulier.
- source_word: מַעְזְרִים אוֹתָם
  choice: leur viennent en aide
  rationale: Le participe exprime une action tenue pour habituelle ou actuelle. Cette expression est idiomatique et reproduit le lien avec וְיַעְזְרוּנִי.
- source_word: לָהֶם אֲזַבֵּחַ
  choice: je leur offrirai des sacrifices
  rationale: Le futur français exprime l’intention portée par l’imparfait hébreu et maintient le destinataire explicite.
- source_word: וְיַעְזְרוּנִי
  choice: afin qu’ils me viennent en aide
  rationale: Dans le raisonnement d’Ahaz, la proposition exprime naturellement le but recherché, sans exclure la nuance de résultat espéré.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ
  choice: Mais ce sont eux qui causèrent sa chute
  rationale: Le hiphil de כשׁל signifie faire trébucher ou mener à la ruine. « Causèrent sa chute » est clair, vigoureux et conserve l’ironie; « mais » explicite l’opposition contextuelle portée par le waw.
- source_word: וּלְכָל יִשְׂרָאֵל
  choice: et celle de tout Israël
  rationale: La coordination rattache Israël à la même idée de chute et se rend naturellement en français par la reprise pronominale « celle ».
theological_decisions:
- issue: Statut des dieux de Damas présentés comme ayant frappé Ahaz
  choice: Conserver l’énoncé comme l’interprétation païenne d’Ahaz, signalée par « il se disait », sans affirmer que le narrateur reconnaît à ces dieux une véritable puissance divine.
  alternative: Traduire littéralement sans marque explicite de perspective et laisser le lecteur déduire l’ironie du contexte.
  rationale: Le raisonnement rapporté appartient à Ahaz; la conclusion du verset le condamne comme funeste. La formulation préserve son point de vue sans importer une explication doctrinale dans le texte.
- issue: Valeur de וְיַעְזְרוּנִי
  choice: Exprimer le but par « afin qu’ils me viennent en aide ».
  alternative: 'Rendre une simple prédiction : « et ils me viendront en aide ».'
  rationale: Après la résolution « je leur offrirai des sacrifices », la coordination exprime le secours recherché. La traduction de but rend cette logique tout en conservant l’attente d’Ahaz.
- issue: Force de לְהַכְשִׁילוֹ
  choice: Rendre le résultat funeste par « causèrent sa chute ».
  alternative: 'Conserver l’image plus formelle : « furent pour le faire trébucher ».'
  rationale: Le contexte de jugement autorise le sens étendu de ruine ou de chute. La formulation française reste sobre et ne précise pas au-delà de l’hébreu la nature de cette chute.
translation_notes:
  register: Français international moderne, digne et narratif. Le discours d’Ahaz reste intelligible et causal; le contraste final est marqué sans surcharge explicative. Le nom « Aram » est conservé plutôt que remplacé par « Syrie », afin de rester proche du cadre historique et de l’hébreu.
