  to: 'Il offrit des sacrifices aux dieux de Damas qui l’avaient frappé[a], et il dit : « Puisque les dieux des rois d’Aram leur viennent en aide, je leur offrirai des sacrifices afin qu’ils me viennent en aide. » Mais ce sont eux qui causèrent sa chute et celle de tout Israël.'
  rationale: La révision se limite à remplacer « car il se disait » par « et il dit », afin de reproduire la coordination narrative et l’introduction explicite d’une parole directe dans le texte hébreu. Le reste du texte et la note conservent adéquatement les nuances du participe et du raisonnement attribué à Ahaz.
