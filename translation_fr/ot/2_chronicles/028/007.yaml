  text: וַֽ/יַּהֲרֹ֞ג זִכְרִ֣י גִּבּ֣וֹר אֶפְרַ֗יִם אֶת מַעֲשֵׂיָ֨הוּ֙ בֶּן הַ/מֶּ֔לֶךְ וְ/אֶת עַזְרִיקָ֖ם נְגִ֣יד הַ/בָּ֑יִת וְ/אֶת אֶלְקָנָ֖ה מִשְׁנֵ֥ה הַ/מֶּֽלֶךְ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: fr
  text: Zikri, un vaillant guerrier d’Éphraïm, tua Maaséya, fils du roi, Azrikam, responsable de la maison[a], et Elqana, le second du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison » désigne probablement le palais ou la maison royale.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’adjoint du roi » ou « le second personnage après le roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: tua
  rationale: Le verbe הרג désigne directement l’action de tuer; « tua » convient au récit et reste sobre.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Nom propre translittéré sous une forme française proche de l’hébreu.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: un vaillant guerrier d’Éphraïm
  rationale: גִּבּוֹר peut désigner un homme vaillant, un guerrier ou un héros. Cette formulation naturelle conserve à la fois la valeur guerrière et l’idée de vaillance.
- source_word: מַעֲשֵׂיָהוּ
  choice: Maaséya
  rationale: Translittération française du nom propre hébreu.
- source_word: בֶּן הַמֶּלֶךְ
  choice: fils du roi
  rationale: Rendu idiomatique du groupe construit; le français permet de préserver l’absence d’article devant « fils » dans l’énumération.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Nom propre translittéré.
- source_word: נְגִיד הַבָּיִת
  choice: responsable du palais
  rationale: נְגִיד désigne ici un dirigeant ou haut responsable, tandis que הַבַּיִת, dans ce contexte royal, renvoie vraisemblablement au palais ou à la maison royale.
- source_word: אֶלְקָנָה
  choice: Elqana
  rationale: Translittération française qui représente le qoph par « q » et évite une forme inutilement anglicisée.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: le second du roi
  rationale: Rendu proche de l’hébreu qui indique le deuxième rang dans la hiérarchie sans imposer un titre administratif plus précis.
