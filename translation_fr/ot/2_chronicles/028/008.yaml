  source_fidelity: 'Le sens fondamental est bien rendu : les Israélites capturent des membres de leur propre groupe, prennent un important butin et le transportent à Samarie. « Parmi leurs frères » exprime plus naturellement en français la provenance collective indiquée par מֵאֲחֵיהֶם, sans effacer le terme de parenté. « Firent prisonniers » rend explicitement la captivité guerrière de שבה. Dans cette énumération, « garçons et filles » est l’équivalent français naturel de « fils et filles » lorsqu’il s’agit des personnes capturées.'
  naturalness: La formulation révisée évite « emmenèrent en captivité, d’entre leurs frères », dont l’enchaînement est lourd et peu idiomatique. Elle évite également l’effet inhabituel de « femmes, fils et filles » en français contemporain, tout en conservant les trois catégories du texte.
  terminology: « Les fils d’Israël », « frères », « butin » et « Samarie » sont conservés. La note maintient la littéralité de « frères » et signale les équivalents collectifs possibles, sans imposer une interprétation confessionnelle.
