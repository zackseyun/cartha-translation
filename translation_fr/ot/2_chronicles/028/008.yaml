  - severity: low
    issue: « femmes, fils et filles » est peu idiomatique dans une énumération française de captifs.
    rationale: En français moderne, « garçons et filles » désigne naturellement les personnes mineures correspondantes. Le contraste ternaire נשים / בנים / בנות demeure conservé.
