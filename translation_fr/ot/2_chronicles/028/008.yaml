base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: fr
  text: Les fils d’Israël firent prisonniers, parmi leurs frères[a], deux cent mille femmes, garçons et filles. Ils leur prirent aussi un butin considérable et apportèrent ce butin à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi leurs proches » ou « parmi les autres Israélites ». L’hébreu dit littéralement « d’entre leurs frères », soulignant leur parenté commune.
    reason: Alternative lexicale et explicitation de la portée collective de אָח.
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: emmenèrent en captivité
  rationale: Le verbe שבה désigne la capture de personnes à la guerre. Cette formulation française exprime clairement qu’elles furent faites captives, et non simplement saisies.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le rendu formel conserve l’expression de parenté du texte et renforce son contraste avec « leurs frères » dans ce conflit interne au peuple.
- source_word: מֵאֲחֵיהֶם
  choice: d’entre leurs frères
  rationale: « Frères » préserve l’image familiale et la portée morale du texte; la préposition indique que les captifs furent pris au sein de leur propre parenté collective.
- source_word: מָאתַיִם אֶלֶף
  choice: deux cent mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: femmes, fils et filles
  rationale: Le français conserve les trois groupes explicitement énumérés, sans réduire « fils et filles » au terme interprétatif « enfants ».
- source_word: שָׁלָל רָב
  choice: un butin considérable
  rationale: שָׁלָל désigne le butin de guerre; « considérable » rend naturellement l’importance exprimée par רָב.
- source_word: בָּזְזוּ מֵהֶם
  choice: ils leur prirent
  rationale: Cette formulation naturelle rend l’action de prendre comme butin ainsi que la provenance marquée par מֵהֶם, sans employer une tournure française archaïque.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: et apportèrent ce butin à Samarie
  rationale: Rendu direct de la destination et reprise explicite de « butin », conformément à la répétition du nom hébreu.
theological_decisions:
- issue: Langage de parenté dans un conflit entre Israélites
  choice: d’entre leurs frères
  alternative: parmi leurs proches / parmi les autres Israélites
  rationale: Le texte souligne que les captifs n’étaient pas des ennemis étrangers, mais des membres du même peuple. « Frères » maintient cette tension éthique et théologique sans l’expliquer à la place du lecteur.
translation_notes:
  register: Français international moderne, digne et lisible. La structure garde le parallélisme narratif et les termes de parenté du texte hébreu, tout en évitant les tournures bibliques devenues archaïques.
