  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: fr
  text: Les Philistins avaient lancé des raids dans les villes de la plaine et du Néguev de Juda. Ils s’emparèrent de Beth-Shémesh, d’Ayalôn, de Guedéroth, de Soko et des localités qui en dépendaient, de Timna et des localités qui en dépendaient, ainsi que de Guimzo et des localités qui en dépendaient. Puis ils s’y installèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Les Philistins
  rationale: Ethnonyme consacré en français; la coordination initiale hébraïque n’a pas besoin d’être reproduite isolément en français moderne.
- source_word: פָּשְׁטוּ
  choice: avaient lancé des raids
  rationale: Dans ce contexte militaire, le verbe désigne des incursions ou des raids. Le plus-que-parfait présente cette action comme le cadre des prises de villes ensuite énumérées.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: contre les villes du Bas-Pays et du Néguev de Juda
  rationale: La Shéphéla est ici rendue par le terme géographique intelligible « Bas-Pays »; « Néguev » conserve le nom de la région plutôt que de le réduire au simple « sud ».
- source_word: וַיִּלְכְּדוּ
  choice: Ils s’emparèrent de
  rationale: Expression française naturelle et précise pour la prise militaire de villes.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Translittération française usuelle et transparente du toponyme.
- source_word: אַיָּלוֹן
  choice: Ayalôn
  rationale: Translittération adaptée aux conventions phonétiques françaises.
- source_word: הַגְּדֵרוֹת
  choice: Guedéroth
  rationale: Translittération française du nom de lieu, sans le traduire.
- source_word: שׂוֹכוֹ
  choice: Soko
  rationale: Translittération simple du toponyme hébreu; aucune variante n’est nécessaire dans le texte français.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: et des localités qui en dépendaient
  rationale: Littéralement « ses filles », idiome désignant les agglomérations satellites dépendant d’une ville principale. Cette formulation garde explicitement le rapport de dépendance.
- source_word: תִּמְנָה
  choice: Timna
  rationale: Translittération française concise du toponyme.
- source_word: גִּמְזוֹ
  choice: Guimzo
  rationale: Translittération adaptée à la lecture française.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Puis ils s’y installèrent
  rationale: Le verbe indique ici qu’ils prirent résidence dans les lieux conquis; « s’installèrent » exprime naturellement l’occupation durable.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La longue coordination hébraïque est répartie en trois phrases pour la lisibilité, sans supprimer d’information. Les toponymes sont translittérés selon des usages français cohérents; l’idiome « villes filles » est explicité dans le corps du texte.
