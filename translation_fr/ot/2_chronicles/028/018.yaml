revisions:
- from: Les Philistins avaient lancé des raids contre les villes du Bas-Pays et du Néguev de Juda. Ils s’emparèrent de Beth-Shémesh, d’Ayalôn, de Guedéroth, de Soko et des localités qui en dépendaient, de Timna et des localités qui en dépendaient, ainsi que de Guimzo et des localités qui en dépendaient. Puis ils s’y installèrent.
  to: Les Philistins avaient lancé des raids dans les villes de la plaine et du Néguev de Juda. Ils s’emparèrent de Beth-Shémesh, d’Ayalôn, de Guedéroth, de Soko et des localités qui en dépendaient, de Timna et des localités qui en dépendaient, ainsi que de Guimzo et des localités qui en dépendaient. Puis ils s’y installèrent.
  rationale: La révision remplace « contre les villes du Bas-Pays » par « dans les villes de la plaine ». Elle rend ainsi la préposition hébraïque, évite une nuance militaire ajoutée et emploie une désignation française plus naturelle de la Shéphéla. Le reste du texte préserve l’énumération, la relation de dépendance des localités et l’établissement des Philistins.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les Philistins font des incursions, prennent les villes nommées avec leurs localités dépendantes et s’y établissent. Toutefois, « raids contre les villes » déplace légèrement l’action : l’hébreu situe les incursions dans les villes ou régions concernées, plutôt que de les présenter explicitement comme dirigées « contre » elles.'
  naturalness: Le français est globalement clair et de bon registre. « Bas-Pays » est cependant peu idiomatique et peut évoquer les Pays-Bas plutôt que la Shéphéla judéenne. « La plaine » est plus naturel et conserve la valeur géographique du terme.
  terminology: Les ethnonymes et toponymes sont cohérents avec une translittération française. « Localités qui en dépendaient » rend adéquatement l’idiome hébreu des « filles » d’une ville. Aucune note n’est nécessaire ; la variante anglaise « Soco » ne requiert pas d’ancrage dans le texte français retenu.
  issues:
  - severity: medium
    issue: « contre les villes du Bas-Pays »
    rationale: La préposition « contre » suggère une attaque dirigée contre les villes, tandis que בְּ introduit le lieu ou domaine des incursions. De plus, « Bas-Pays » n’est pas une désignation géographique naturelle ici en français moderne.
  revised_text: Les Philistins avaient lancé des raids dans les villes de la plaine et du Néguev de Juda. Ils s’emparèrent de Beth-Shémesh, d’Ayalôn, de Guedéroth, de Soko et des localités qui en dépendaient, de Timna et des localités qui en dépendaient, ainsi que de Guimzo et des localités qui en dépendaient. Puis ils s’y installèrent.
  revised_footnotes: []
  revision_rationale: La révision remplace « contre les villes du Bas-Pays » par « dans les villes de la plaine ». Elle rend ainsi la préposition hébraïque, évite une nuance militaire ajoutée et emploie une désignation française plus naturelle de la Shéphéla. Le reste du texte préserve l’énumération, la relation de dépendance des localités et l’établissement des Philistins.
