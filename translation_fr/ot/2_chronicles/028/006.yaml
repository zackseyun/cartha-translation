language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: fr
  text: Péqah, fils de Remalia, tua en Juda cent vingt mille hommes en un seul jour[a], tous des hommes valeureux[b], parce qu’ils avaient abandonné[c] Yahweh, le Dieu de leurs pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en un jour ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des fils de valeur » ; c’est-à-dire des hommes vaillants, aptes au combat.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « lorsqu’ils abandonnèrent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: tua
  rationale: Le verbe הרג signifie directement « tuer ». « Tua » est clair, sobre et fidèle, sans l’archaïsme de « occit » ni l’interprétation légèrement plus indirecte de « abattit ».
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition ב indique ici le lieu. « Juda » est le nom usuel du royaume ou territoire dans ce contexte historique.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: cent vingt mille hommes
  rationale: Le nombre est rendu directement. L’ajout de « hommes » explicite naturellement en français les personnes comptées, que la suite décrit comme des hommes valeureux.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: Cette formulation naturelle conserve le sens littéral « en un jour » et souligne l’ampleur du massacre.
- source_word: הַכֹּל
  choice: tous
  rationale: Le terme récapitule l’ensemble des victimes mentionnées. « Tous » relie clairement le nombre à la caractérisation qui suit.
- source_word: בְּנֵי חָיִל
  choice: des hommes valeureux
  rationale: L’expression signifie littéralement « fils de valeur/force » et désigne ici des hommes courageux et aptes au combat. « Hommes valeureux » préserve la référence masculine et la notion de vaillance sans réduire nécessairement l’expression à la seule fonction de soldat.
- source_word: בְּעָזְבָם
  choice: parce qu’ils avaient abandonné
  rationale: La préposition ב avec l’infinitif construit peut exprimer la circonstance ou la cause. Le contexte du Chroniste favorise ici une explication causale, tandis qu’une note conserve la lecture temporelle possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: le Dieu de leurs pères
  rationale: Cette formulation conserve l’expression historique et familiale de l’hébreu ainsi que sa résonance d’alliance.
theological_decisions:
- issue: Valeur de בְּעָזְבָם par rapport au massacre
  choice: 'Lecture causale : « parce qu’ils avaient abandonné »'
  alternative: 'Lecture temporelle ou circonstancielle : « lorsqu’ils abandonnèrent »'
  rationale: Le Chroniste présente régulièrement les désastres militaires comme les conséquences de l’abandon de Yahweh. La traduction causale convient donc au contexte, mais la construction hébraïque permet également une nuance temporelle, signalée en note.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit historique écrit. Les noms propres suivent des formes françaises reconnaissables, tandis que le nom divin est translittéré « Yahweh ». La syntaxe reste proche de l’hébreu sans devenir artificielle.
