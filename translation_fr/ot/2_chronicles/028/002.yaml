source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דַרְכֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֧ם מַסֵּכ֛וֹת עָשָׂ֖ה לַ/בְּעָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: fr
  text: Il suivit les voies des rois d’Israël et fit aussi des images en métal fondu[a] pour les Baals[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des images coulées ». Le terme hébreu désigne précisément des images fabriquées par fonte et moulage.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le pluriel « les Baals » ; celui-ci peut désigner diverses manifestations locales ou représentations liées au culte de Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: Il suivit les voies
  rationale: L’expression hébraïque signifie littéralement « marcher dans les voies » et décrit la conduite. « Suivre les voies » conserve l’image du chemin tout en étant naturel en français moderne.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Cette traduction directe préserve la référence historique aux rois du royaume d’Israël.
- source_word: וְגַם
  choice: et fit aussi
  rationale: « Aussi » présente la fabrication des images comme une faute supplémentaire.
- source_word: מַסֵּכוֹת
  choice: des images en métal fondu
  rationale: Le nom désigne des représentations fabriquées par la fonte et le moulage. Cette formulation garde le procédé de fabrication sans employer un terme archaïque.
- source_word: עָשָׂה
  choice: fit
  rationale: Le verbe courant « faire » correspond directement au verbe hébreu et convient à la fabrication d’images.
- source_word: לַבְּעָלִים
  choice: pour les Baals
  rationale: Le pluriel explicite de l’hébreu est conservé au lieu d’être ramené au singulier « Baal ».
theological_decisions:
- issue: Le pluriel בְּעָלִים
  choice: les Baals
  alternative: Baal ; les idoles de Baal
  rationale: Le pluriel peut évoquer plusieurs formes, manifestations locales ou représentations cultuelles de Baal. Le conserver évite d’effacer un détail réel du texte sans imposer une seule explication.
- issue: La métaphore de la conduite comme chemin
  choice: Il suivit les voies des rois d’Israël
  alternative: Il marcha dans les voies des rois d’Israël ; il imita la conduite des rois d’Israël
  rationale: « Suivre les voies » maintient l’image hébraïque tout en restant compréhensible et idiomatique en français actuel.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image des « voies » ainsi que le pluriel inhabituel « les Baals », tout en explicitant naturellement la technique évoquée par מַסֵּכוֹת.
