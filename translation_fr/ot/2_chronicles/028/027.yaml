  rationale: La seule révision remplace une tournure française qui ajoute une causation implicite par « on ne le porta pas », formulation naturelle pour un défunt et fidèle au verbe hébreu « amener/faire venir ». Le reste du texte et la note conservent avec justesse les éléments formels et l’ambiguïté historique du texte massorétique.
