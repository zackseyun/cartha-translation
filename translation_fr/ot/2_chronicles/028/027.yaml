base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: fr
  text: Ahaz se coucha avec ses pères, et on l’enterra dans la ville, à Jérusalem, car on ne le porta pas dans les tombeaux des rois d’Israël.[a] Son fils Ézéchias régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les rois d’Israël ». Ahaz étant roi de Juda, certains comprennent cette expression comme une référence aux tombeaux royaux des rois de la lignée de David, ou s’attendraient à lire « les rois de Juda ».'
    reason: Signaler la formulation exacte de l’hébreu et l’attente contextuelle sans corriger le texte principal.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: se coucha avec ses pères
  rationale: La formule hébraïque est un avis de décès royal. Cette traduction conserve l’image et la formule dynastique sans la réduire explicitement à « mourut »; « ses pères » maintient aussi l’expression généalogique récurrente.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: Le verbe hébreu est actif à la troisième personne du pluriel. En français narratif, le pronom « on » rend naturellement ce sujet indéfini tout en préservant la voix active.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: dans la ville, à Jérusalem
  rationale: Le rendu conserve les deux indications locatives distinctes de l’hébreu et souligne qu’il fut enseveli dans la ville, mais non dans les tombeaux royaux.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du lieu d’ensevelissement.
- source_word: לֹא הֱבִיאֻהוּ לְקִבְרֵי
  choice: on ne le fit pas entrer dans les tombeaux
  rationale: Cette formulation conserve le sens concret du hiphil de בוא, « faire entrer, amener », sans le remplacer par le verbe interprétatif « enterrer ».
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Le texte massorétique porte explicitement « Israël ». Le traduire ainsi respecte le texte reçu malgré l’attente contextuelle possible de « Juda ».
- source_word: וַיִּמְלֹךְ יְחִזְקִיָּהוּ בְנוֹ תַּחְתָּיו
  choice: Son fils Ézéchias régna à sa place
  rationale: « Régna » rend la formule d’accession royale, et « à sa place » exprime directement la succession indiquée par תַּחְתָּיו.
theological_decisions:
- issue: Faut-il normaliser « rois d’Israël » en « rois de Juda » pour correspondre au royaume d’Ahaz ?
  choice: Conserver « rois d’Israël » dans le texte principal.
  alternative: « rois de Juda » ou une explication par les tombeaux des rois davidiques.
  rationale: Le texte hébreu massorétique dit « Israël ». La traduction préserve cette donnée et la tension historique apparente au lieu de l’harmoniser; la note signale l’explication ou la lecture attendue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste narrative et fluide, tout en conservant la formule funéraire hébraïque et la répétition locative significative.
