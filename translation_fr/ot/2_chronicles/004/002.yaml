  text: וַ/יַּ֥עַשׂ אֶת הַ/יָּ֖ם מוּצָ֑ק עֶ֣שֶׂר בָּֽ֠/אַמָּה מִ/שְּׂפָת֨/וֹ אֶל שְׂפָת֜/וֹ עָג֣וֹל סָבִ֗יב וְ/חָמֵ֤שׁ בָּֽ/אַמָּה֙ קֽוֹמָת֔/וֹ וְ/קָו֙ שְׁלֹשִׁ֣ים בָּֽ/אַמָּ֔ה יָסֹ֥ב אֹת֖/וֹ סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: fr
  text: Il fit la Mer en métal coulé[a]. Elle avait dix coudées d’un bord à l’autre et était ronde sur tout son pourtour. Sa hauteur était de cinq coudées, et un cordeau de trente coudées[b] en faisait tout le tour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Mer de métal fondu ». En hébreu, « Mer » est le nom donné au grand bassin faisant partie du mobilier du Temple.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu parle littéralement d’« un cordeau de trente coudées » et décrit ainsi la circonférence du bassin selon la manière habituelle de l’Antiquité.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: la Mer
  rationale: Le mot signifie littéralement « mer », mais désigne ici le grand bassin du mobilier du Temple. La majuscule indique qu’il s’agit du nom de cet objet.
- source_word: מוּצָק
  choice: en métal coulé
  rationale: Le participe décrit un objet fabriqué par coulage du métal. Cette formulation française est naturelle et conserve le procédé de fabrication sans laisser entendre que le métal était encore en fusion.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dix coudées
  rationale: L’unité de mesure ancienne est conservée plutôt que convertie; la proposition suivante précise qu’il s’agit de la largeur d’un bord à l’autre.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: d’un bord à l’autre
  rationale: שָׂפָה peut désigner la lèvre ou le rebord d’un récipient. « D’un bord à l’autre » exprime clairement et naturellement le diamètre mesuré.
- source_word: עָגוֹל סָבִיב
  choice: ronde sur tout son pourtour
  rationale: La traduction rend à la fois la forme circulaire indiquée par עָגוֹל et l’idée enveloppante de סָבִיב, sans tournure archaïque.
- source_word: וְקָו
  choice: un cordeau
  rationale: קַו désigne ici une ligne ou une corde servant à mesurer. « Cordeau » préserve l’image concrète de l’instrument de mesure au lieu de la remplacer directement par le terme abstrait « circonférence ».
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: en faisait tout le tour
  rationale: Cette tournure française rend le mouvement autour de l’objet et la répétition emphatique de l’idée de pourtour.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « La Mer » conserve le nom traditionnel de l’objet tout en évitant de le confondre avec une mer ordinaire. La syntaxe a été légèrement segmentée pour rendre clairement les trois dimensions, tout en préservant l’image concrète du cordeau de mesure.
