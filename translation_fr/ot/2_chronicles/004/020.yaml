  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: fr
  text: les lampadaires en or pur, avec leurs lampes, pour les faire brûler comme cela est prescrit devant le sanctuaire intérieur[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le lieu très saint ». Le terme hébreu debir désigne le sanctuaire intérieur du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: les porte-lampes
  rationale: מְנוֹרָה désigne ici le support portant les lampes. « Porte-lampes » est clair en français moderne et évite une translittération inutile.
- source_word: וְנֵרֹתֵיהֶם
  choice: et leurs lampes
  rationale: נֵר désigne couramment une lampe ou sa flamme ; dans cette liste de mobilier, « lampes » convient naturellement.
- source_word: לְבַעֲרָם
  choice: qu’on devait faire brûler
  rationale: L’infinitif avec suffixe exprime le but et présente les lampes comme objet de l’action causative. Cette formulation française rend explicitement ce rapport sans identifier un agent absent du texte.
- source_word: כַּמִּשְׁפָּט
  choice: selon la règle
  rationale: מִשְׁפָּט renvoie ici à la manière prescrite pour le service cultuel. « Selon la règle » garde ce sens normatif dans une langue actuelle.
- source_word: לִפְנֵי הַדְּבִיר
  choice: devant le sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce la plus intérieure du Temple. « Sanctuaire intérieur » reste précis sans imposer dans le texte principal l’appellation traditionnelle « lieu très saint ».
- source_word: זָהָב סָגוּר
  choice: en or pur
  rationale: L’expression désigne un or de grande qualité, purifié ou raffiné. « Or pur » est la formulation française la plus naturelle, tandis que la variante est signalée en note.
- source_word: וְאֶת
  choice: les
  rationale: La conjonction et le marqueur d’objet introduisent un nouvel élément de la liste commencée au verset précédent ; la syntaxe française n’exige pas de rendre séparément ces éléments.
