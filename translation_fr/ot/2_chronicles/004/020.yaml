  source_fidelity: 'Révision nécessaire : « le tout en or pur » élargit sans nécessité l’attribution de זָהָב סָגוּר aux lampes elles-mêmes. Dans la syntaxe hébraïque, la qualification suit immédiatement « les lampadaires » et se rend plus fidèlement par « les lampadaires en or pur, avec leurs lampes ». « Qu’on devait » introduit en outre une modalité de devoir absente du texte ; l’infinitif exprime le but ou la fonction prescrite.'
  naturalness: « Lampadaires » est plus naturel et usuel que « porte-lampes » pour le mobilier cultuel. La formulation révisée conserve le caractère de liste tout en restant fluide en français moderne.
  terminology: « Sanctuaire intérieur » rend correctement דְּבִיר sans imposer l’appellation confessionnelle « lieu très saint ». « Comme cela est prescrit » rend le sens cultuel normatif de כַּמִּשְׁפָּט avec plus d’idiomaticité que « selon la règle ». « Or pur » convient à זָהָב סָגוּר; la note conserve « or raffiné » comme alternative.
