    rationale: Cette tournure attribue explicitement l’or pur à la fois aux lampadaires et aux lampes. La construction hébraïque est plus directement liée aux lampadaires; une formulation qui place « en or pur » auprès de ceux-ci respecte mieux la syntaxe sans surinterpréter.
  - severity: low
    issue: Modalité ajoutée par « qu’on devait faire brûler »
    rationale: Le texte exprime la destination des lampes (« pour les faire brûler »), en accord avec la prescription; « devait » ajoute une obligation finie que l’hébreu n’énonce pas sous cette forme.
  - severity: low
    issue: « Porte-lampes » est moins idiomatique
    rationale: « Lampadaires » est le terme français courant pour des מְנוֹרוֹת et distingue clairement les supports de leurs lampes.
