base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: fr
  text: Les pinces à mèches, les bassins, les coupes et les pelles à braises étaient en or fin ; l’entrée du Temple, ses portes intérieures donnant sur le lieu très saint, et les portes du Temple donnant sur la grande salle[a] étaient en or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la salle principale du Temple ». Le mot hébreu désigne ici la pièce principale du Temple, distincte du lieu très saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: pinces à mèches
  rationale: Dans l’inventaire du Temple, le terme désigne vraisemblablement des instruments servant à entretenir ou couper les mèches des lampes. Cette expression est plus transparente en français moderne que le terme technique et vieilli « mouchettes ».
- source_word: מִּזְרָקוֹת
  choice: bassins
  rationale: Le mot désigne des récipients cultuels, notamment employés pour recueillir ou asperger le sang; « bassins » les distingue des coupes mentionnées ensuite.
- source_word: כַּפּוֹת
  choice: coupes
  rationale: Le terme peut désigner de petits récipients. « Coupes » convient à l’inventaire et évite de le confondre avec les bassins précédents.
- source_word: מַּחְתּוֹת
  choice: pelles à braises
  rationale: Ces ustensiles servaient à prendre ou transporter des braises. Ce choix conserve cette fonction sans imposer l’usage plus précis d’un encensoir.
- source_word: זָהָב סָגוּר
  choice: or fin
  rationale: L’expression désigne un or de haute qualité, purifié ou raffiné; « or fin » est naturel et traditionnel en français.
- source_word: פֶּתַח הַבַּיִת
  choice: l’entrée du Temple
  rationale: פֶּתַח désigne l’ouverture ou l’entrée; dans ce contexte, « Temple » rend clairement le référent de « maison » sans suggérer une habitation ordinaire.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: ses portes intérieures
  rationale: Le pluriel peut viser les portes ou leurs battants. La formulation française conserve le contraste avec l’autre ensemble de portes.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: donnant sur le lieu très saint
  rationale: La construction indique la destination des portes. « Lieu très saint » rend le superlatif hébreu de manière claire et digne.
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: les portes du Temple donnant sur la grande salle
  rationale: הֵיכָל désigne ici la pièce principale du Temple, distincte du lieu très saint. « Grande salle » est intelligible sans importer le sens architectural chrétien de « nef ».
- source_word: זָהָב
  choice: étaient en or
  rationale: Le nom final fonctionne comme prédicat de matière; le verbe est ajouté conformément à la syntaxe naturelle du français.
theological_decisions:
- issue: Distinction entre קֹדֶשׁ הַקֳּדָשִׁים et הֵיכָל
  choice: « lieu très saint » pour la pièce intérieure et « grande salle » pour la pièce principale
  alternative: Employer « sanctuaire » pour הֵיכָל
  rationale: La traduction maintient la distinction spatiale explicite du texte et évite que « sanctuaire » ne soit compris comme désignant soit tout le Temple, soit le lieu très saint lui-même.
translation_notes:
  register: Français international moderne, formel et lisible. Les termes techniques ont été rendus par des expressions fonctionnelles compréhensibles. La structure de l’inventaire est conservée, avec une ponctuation qui distingue les ustensiles en or fin des portes en or.
