  text: וְ/אֶת הַ/מְּכֹנ֖וֹת עָשָׂ֑ה וְ/אֶת הַ/כִּיֹּר֥וֹת עָשָׂ֖ה עַל הַ/מְּכֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: fr
  text: Il fit les supports[a], et il fit les bassins sur les supports.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « socles »; le terme hébreu désigne les structures qui soutenaient les bassins.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: les supports
  rationale: Dans le contexte du mobilier du Temple, מְכוֹנוֹת désigne les structures ouvragées qui portaient les bassins. « Supports » exprime clairement leur fonction en français moderne; « socles » reste possible, mais évoque plus facilement une base fixe.
- source_word: עָשָׂה
  choice: fit
  rationale: Le verbe courant עשה signifie simplement « faire ». « Fit » conserve ce sens direct sans ajouter la nuance artisanale plus marquée de « façonna ».
- source_word: הַכִּיֹּרוֹת
  choice: les bassins
  rationale: כִּיּוֹר désigne ici un récipient destiné aux ablutions. « Bassins » est naturel et actuel; « cuves » pourrait suggérer des récipients de plus grande capacité.
- source_word: עַל
  choice: qu’il plaça sur
  rationale: La préposition עַל indique que les bassins se trouvaient sur les supports. L’ajout idiomatique de « qu’il plaça » rend en français la relation exprimée par l’hébreu sans suggérer que les bassins eux-mêmes auraient été fabriqués directement sur place.
- source_word: וְאֶת ... וְאֶת
  choice: et ... et
  rationale: Les conjonctions coordonnent les deux objets fabriqués. La répétition de « et » respecte la structure simple et cumulative de l’hébreu.
