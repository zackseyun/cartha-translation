  text: וַ֠/יַּעַשׂ אֶת מְנֹר֧וֹת הַ/זָּהָ֛ב עֶ֖שֶׂר כְּ/מִשְׁפָּטָ֑/ם וַ/יִּתֵּן֙ בַּֽ/הֵיכָ֔ל חָמֵ֥שׁ מִ/יָּמִ֖ין וְ/חָמֵ֥שׁ מִ/שְּׂמֹֽאול־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: fr
  text: Il fit dix chandeliers en or selon la règle qui leur était prescrite[a], et il les plaça dans le sanctuaire[b], cinq à droite et cinq à gauche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leur règle » ou « selon leur modèle ». Le terme hébreu peut désigner une règle, une disposition ou un modèle prescrit.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la grande salle » ou « dans le Temple ». Le terme hébreu désigne ici l’édifice du Temple proprement dit plutôt que l’ensemble de son enceinte.
    reason: lexical_alternative
  - marker: c
    text: Selon l’orientation du Temple, ces côtés peuvent correspondre respectivement au sud et au nord.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le qal wayyiqtol de עשה est le verbe narratif courant pour « faire ». « Il fit » convient au contexte de fabrication.
- source_word: מְנֹרוֹת הַזָּהָב
  choice: chandeliers en or
  rationale: מְנוֹרָה désigne le support destiné aux lampes, traditionnellement appelé « chandelier » dans ce contexte biblique ; הַזָּהָב précise la matière.
- source_word: עֶשֶׂר
  choice: dix
  rationale: Nombre cardinal qualifiant les chandeliers.
- source_word: כְּמִשְׁפָּטָם
  choice: selon les prescriptions qui les concernaient
  rationale: מִשְׁפָּט peut désigner une règle, une ordonnance ou une disposition prescrite. Cette formulation conserve l'idée d'une norme établie sans imposer le sens plus précis de « modèle ».
- source_word: וַיִּתֵּן
  choice: et il les plaça
  rationale: Dans ce contexte spatial, נתן signifie mettre ou placer ; le pronom explicite reprend naturellement les chandeliers en français.
- source_word: בַּהֵיכָל
  choice: dans le sanctuaire
  rationale: הֵיכָל désigne ici l'édifice sacré proprement dit, ou sa salle principale, plutôt que l'ensemble du complexe du Temple.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: cinq à droite et cinq à gauche
  rationale: La traduction conserve les indications relatives littérales du texte hébreu sans les convertir en points cardinaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Chandeliers » maintient le vocabulaire biblique français usuel tout en désignant des supports de lampes. La formulation de כמשפטם reste volontairement générale afin de préserver son éventail sémantique.
