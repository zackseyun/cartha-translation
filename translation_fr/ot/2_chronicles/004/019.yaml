id: 2CH.4.19
reference: 2 Chronicles 4:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: fr
  text: 'Salomon fabriqua tous les objets destinés à la maison de Dieu : l’autel d’or, les tables et, sur celles-ci, le pain de la Présence[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Appelé traditionnellement « les pains de proposition ». L’hébreu signifie littéralement « le pain de la Face », c’est-à-dire le pain placé devant Dieu.
    reason: Signaler le terme traditionnel et expliciter l’expression cultuelle hébraïque.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fabriqua
  rationale: Dans cet inventaire d’objets cultuels, « fabriqua » rend naturellement l’action concrète de עשה sans introduire l’idée explicite, absente de l’hébreu, qu’il les aurait seulement fait fabriquer.
- source_word: כָּל הַכֵּלִים
  choice: tous les objets
  rationale: כֵּלִים désigne ici l’ensemble des objets ou ustensiles du culte. « Objets » est clair en français courant et convient mieux à cette liste que le terme plus étroit « récipients ».
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: destinés à la maison de Dieu
  rationale: La construction hébraïque elliptique indique l’appartenance ou la destination de ces objets. « Destinés à » évite de les présenter comme simplement situés dans l’édifice, tandis que « maison de Dieu » conserve l’expression hébraïque.
- source_word: מִזְבַּח הַזָּהָב
  choice: l’autel d’or
  rationale: Cette formulation française naturelle conserve explicitement le matériau indiqué par l’hébreu.
- source_word: הַשֻּׁלְחָנוֹת
  choice: les tables
  rationale: Le pluriel hébreu désigne directement les tables du sanctuaire associées au pain placé devant Dieu.
- source_word: וַעֲלֵיהֶם
  choice: et, sur celles-ci
  rationale: La tournure maintient la coordination et la relation spatiale du texte hébreu tout en rattachant sans ambiguïté le pronom aux tables.
- source_word: לֶחֶם הַפָּנִים
  choice: le pain de la Présence
  rationale: Cette expression rend de façon transparente le terme cultuel hébreu, littéralement lié à la « face » ou à la présence, sans privilégier d’emblée l’appellation française traditionnelle.
theological_decisions:
- issue: Désignation du sanctuaire par בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  alternative: le temple de Dieu
  rationale: « Maison de Dieu » préserve l’image et la désignation propres à l’hébreu tout en restant intelligible en français; aucun enjeu doctrinal n’exige de remplacer cette expression par « temple ».
- issue: Traduction de לֶחֶם הַפָּנִים
  choice: le pain de la Présence
  alternative: les pains de proposition
  rationale: Le choix principal garde le lien du terme hébreu avec la présence ou la face de Dieu. La note signale l’appellation traditionnelle sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation conserve la forme d’inventaire du verset; « sur celles-ci » évite l’ambiguïté pronominale sans ajouter un verbe absent de l’hébreu.
