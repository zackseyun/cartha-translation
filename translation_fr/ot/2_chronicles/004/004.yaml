source:
  edition: WLC
  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: fr
  text: 'Elle reposait sur douze bœufs : trois tournés vers le nord[a], trois tournés vers l’ouest, trois tournés vers le sud et trois tournés vers l’est. La Mer était au-dessus d’eux, et tout leur arrière-train était tourné vers l’intérieur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « trois faisant face vers le nord […] trois faisant face vers la mer ». Ici, « vers l’ouest » traduit l’emploi directionnel idiomatique de « vers la mer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: Elle reposait
  rationale: Le participe qal décrit la position de la Mer sur ses supports. « Reposait » rend naturellement cette relation architecturale en français, sans suggérer que le bassin se tenait lui-même debout.
- source_word: בָּקָר
  choice: bœufs
  rationale: Le terme désigne ici les douze figures bovines qui soutenaient la Mer. « Bœufs » est le terme traditionnel et courant dans ce contexte sans imposer « taureaux ».
- source_word: פֹנִים
  choice: tournés vers
  rationale: Littéralement lié aux « faces », ce participe décrit ici l’orientation des figures. « Tournés vers » est clair et naturel pour des statues.
- source_word: צָפוֹנָה
  choice: le nord
  rationale: La terminaison directionnelle exprime l’orientation vers le nord; la tournure française « vers le nord » en restitue directement le sens.
- source_word: יָמָּה
  choice: l’ouest
  rationale: Bien que formé sur « mer », le mot sert idiomatiquement à désigner l’ouest dans cette liste de points cardinaux.
- source_word: נֶגְבָּה
  choice: le sud
  rationale: Dans l’énumération directionnelle, le terme indique le sud plutôt que la région particulière du Néguev.
- source_word: מִזְרָחָה
  choice: l’est
  rationale: Le mot est ici le terme directionnel ordinaire pour l’est.
- source_word: הַיָּם
  choice: la Mer
  rationale: Il s’agit du nom donné au grand bassin du temple. La majuscule permet de le distinguer de la mer géographique tout en conservant l’image hébraïque.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: était au-dessus d’eux
  rationale: Cette formulation conserve l’indication spatiale explicite du texte hébreu et reste fluide après « reposait sur douze bœufs ».
- source_word: אֲחֹרֵיהֶם
  choice: leur arrière-train
  rationale: Le mot désigne les parties arrière des figures bovines. « Arrière-train » est précis, digne et idiomatique en français.
- source_word: בָּיְתָה
  choice: vers l’intérieur
  rationale: La forme directionnelle signifie « vers le dedans », c’est-à-dire vers le centre sous le bassin.
