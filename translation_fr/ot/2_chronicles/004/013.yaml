source:
  edition: WLC
  text: וְ/אֶת הָֽ/רִמּוֹנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנַ֨יִם טוּרִ֤ים רִמּוֹנִים֙ לַ/שְּׂבָכָ֣ה הָ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: fr
  text: et les quatre cents grenades destinées aux deux treillis[a], deux rangées de grenades pour chaque treillis, afin de couvrir les deux vasques des chapiteaux[b] qui se trouvaient au sommet des colonnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réseaux ». Le terme hébreu désigne un ouvrage ornemental en forme de filet autour des chapiteaux.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les deux vasques des chapiteaux »; cette image désigne leurs parties supérieures arrondies.
    reason: lexical_clarification
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: grenades
  rationale: Le nom désigne littéralement des grenades; dans ce contexte, il s’agit d’ornements ayant cette forme, mais le terme concret peut être conservé naturellement en français.
- source_word: אַרְבַּע מֵאוֹת
  choice: quatre cents
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: שְּׂבָכוֹת
  choice: treillis
  rationale: Le mot désigne un ouvrage ornemental en réseau entourant les chapiteaux. « Treillis » est précis, courant et adapté à l’architecture.
- source_word: שְׁנַיִם טוּרִים
  choice: deux rangées
  rationale: טוּרִים désigne des éléments disposés en lignes ou rangées; « deux rangées » convient clairement à cet inventaire architectural.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: pour chaque treillis
  rationale: La formulation hébraïque est littéralement singulière, « pour le treillis unique/l’un des treillis », mais elle a ici une valeur distributive portant sur les deux treillis.
- source_word: לְכַסּוֹת
  choice: afin de couvrir
  rationale: L’infinitif exprime le but; « afin de couvrir » rend explicitement et naturellement cette relation.
- source_word: גֻּלּוֹת
  choice: vasques
  rationale: Le terme évoque des formes arrondies semblables à des coupes ou à des vasques. « Vasques » conserve cette image architecturale sans la réduire à une simple forme abstraite.
- source_word: כֹּתָרוֹת
  choice: chapiteaux
  rationale: Dans ce contexte architectural, le mot désigne les éléments couronnant les colonnes; « chapiteaux » est le terme français précis.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: au sommet des colonnes
  rationale: L’expression signifie littéralement « sur la face/surface des colonnes »; la présence des chapiteaux montre que leur position au sommet est visée.
