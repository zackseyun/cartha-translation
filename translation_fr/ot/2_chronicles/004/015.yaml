  text: the one Sea[a], and the twelve oxen under it.
translation:
  language: fr
  text: la Mer, une[a], et les douze bœufs sous elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le bassin appelé la Mer, et les douze bœufs sous elle »'
    reason: Alternative lexicale explicitant que « la Mer » est le nom du grand bassin du Temple.
lexical_decisions:
- source_word: הַיָּם
  choice: la Mer
  rationale: Le nom יָם signifie littéralement « mer », mais désigne ici le grand bassin de bronze du Temple appelé « la Mer ». La majuscule signale ce nom d’objet tout en restant proche de l’hébreu.
- source_word: אֶחָד
  choice: unique
  rationale: Le numéral indique qu’il n’y avait qu’une seule Mer. « unique » restitue naturellement cette précision dans le style d’une liste.
- source_word: הַבָּקָר
  choice: les bœufs
  rationale: בָּקָר est un collectif désignant des bovins. Dans ce contexte, il s’agit des douze figures bovines qui soutenaient la Mer ; « bœufs » est précis, idiomatique et traditionnel sans imposer le sexe que le terme collectif ne précise pas strictement.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Traduction directe du numéral composé.
- source_word: תַּחְתָּיו
  choice: placés sous elle
  rationale: La préposition avec suffixe masculin singulier renvoie à יָם, grammaticalement masculin en hébreu. En français, le pronom féminin « elle » s’accorde avec « la Mer » ; « placés » explicite sobrement la relation spatiale dans cette liste d’ouvrages.
- source_word: אֶת ... וְאֶת
  choice: non traduit séparément
  rationale: אֶת marque les compléments d’objet directs et n’a pas d’équivalent lexical autonome en français ; sa fonction est rendue par la syntaxe.
