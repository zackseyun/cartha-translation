  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: fr
  text: Son épaisseur était d’une largeur de main[a], et son bord était travaillé comme le bord d’une coupe, en forme de fleur de lis. Il pouvait contenir trois mille baths[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La largeur de main était une petite unité de longueur, d’environ 7 à 8 centimètres.
    reason: cultural_note
  - marker: b
    text: Le bath était une ancienne unité hébraïque de capacité pour les liquides.
    reason: cultural_note
  - marker: c
    text: Selon 1 Rois 7.26, la cuve contenait deux mille baths. La différence peut concerner la capacité maximale par rapport au volume habituel, ou provenir d’une différence dans la transmission du texte.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: son épaisseur
  rationale: Le nom désigne ici l’épaisseur de la paroi en métal coulé de la grande cuve.
- source_word: טֶפַח
  choice: une largeur de main
  rationale: Cette expression française claire rend la petite unité fondée sur la largeur de la main sans la confondre avec l’empan.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: son bord / le bord d’une coupe
  rationale: Pour un récipient, שָׂפָה désigne le bord ou la lèvre. La répétition de « bord » reflète celle de l’hébreu tout en restant naturelle.
- source_word: כְּמַעֲשֵׂה
  choice: était travaillé comme
  rationale: La formule évoque la façon ou le travail artisanal donné au bord, et non seulement une ressemblance générale.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: en forme de fleur de lis
  rationale: La formule décrit la forme florale du bord comparé à celui d’une coupe. « Fleur de lis » est ici descriptif et non héraldique.
- source_word: מַחֲזִיק ... יָכִיל
  choice: il pouvait contenir
  rationale: Le participe et le verbe expriment ensemble la capacité de la cuve; une seule formulation évite une répétition lourde en français.
- source_word: בַּתִּים
  choice: baths
  rationale: Le terme désigne l’unité hébraïque de capacité appelée bath; la translittération préserve l’unité ancienne sans imposer une conversion incertaine.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: trois mille
  rationale: Rendu direct du nombre donné par le texte massorétique des Chroniques.
theological_decisions:
- issue: Différence de capacité entre 2 Chroniques 4.5 et 1 Rois 7.26
  choice: Conserver « trois mille » dans le texte et signaler la différence en note
  alternative: Harmoniser avec « deux mille » d’après 1 Rois 7.26
  rationale: Le texte massorétique de 2 Chroniques porte clairement « trois mille ». La traduction ne doit ni corriger ni résoudre silencieusement la tension entre les deux passages.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image artisanale du bord de coupe et de la fleur, ainsi que le nombre du texte hébreu, sans harmonisation implicite.
