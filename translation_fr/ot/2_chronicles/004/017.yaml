base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: fr
  text: Dans la plaine du Jourdain, le roi les fit couler dans une terre argileuse[a], entre Soukkoth et Tseréda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle de 1 Rois 7.46, ce lieu est appelé « Tsartân ». Ici, le texte des Chroniques porte « Tseréda », probablement une autre forme du même nom de lieu.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: dans la plaine du Jourdain
  rationale: כִּכָּר peut désigner un district de forme arrondie ou une plaine. Dans ce contexte géographique, « plaine du Jourdain » est naturel en français et conserve le sens topographique.
- source_word: יְצָקָם
  choice: les fit couler
  rationale: יצק désigne ici la fonte d’objets métalliques. La tournure causative française « fit couler » exprime naturellement que le roi fit fabriquer ces objets par coulage, sans suggérer nécessairement qu’il accomplit lui-même le travail.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini renvoie à Salomon dans le contexte; « le roi » le rend directement.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: dans une terre argileuse
  rationale: עֲבִי évoque l’épaisseur ou la densité; associé à אֲדָמָה, il désigne vraisemblablement un sol dense et argileux adapté à la confection de moules. « Terre argileuse » restitue ce sens probable sans ajouter explicitement les moules.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: entre Soukkoth et Tseréda
  rationale: Les deux toponymes sont translittérés d’après la forme du texte hébreu des Chroniques. La forme différente du passage parallèle des Rois est signalée en note.
