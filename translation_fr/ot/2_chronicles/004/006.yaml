revisions:
- from: 'Il fit dix bassins et en plaça cinq à droite et cinq à gauche. Ils servaient aux ablutions : on y rinçait ce qui était destiné à l’holocauste[a]. Quant à la Mer[b], elle servait aux prêtres pour leurs ablutions.'
  to: Il fit dix bassins et en plaça cinq à droite et cinq à gauche, pour y laver ; ils y rinçaient ce qui se rapportait à l’holocauste[a]. Quant à la Mer[b], elle servait à ce que les prêtres s’y lavent.
  rationale: La révision restitue explicitement le double emploi de « en eux » et distingue le lavage général du rinçage. Elle remplace « ablutions » par « laver / se laver », termes plus directement calqués sur le champ sémantique hébreu sans imposer une qualification rituelle supplémentaire. « Ce qui se rapportait à l’holocauste » maintient l’ellipse de l’expression hébraïque tout en restant intelligible.
