  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: fr
  text: Il fit dix bassins et en plaça cinq à droite et cinq à gauche, pour y laver ; ils y rinçaient ce qui se rapportait à l’holocauste[a]. Quant à la Mer[b], elle servait à ce que les prêtres s’y lavent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’œuvre de l’holocauste » ; l’expression peut désigner les objets ou les éléments employés dans sa préparation.'
    reason: lexical_alternative
  - marker: b
    text: La « Mer » était le grand réservoir de bronze destiné ici au lavage des prêtres.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: bassins
  rationale: Le terme désigne de grands récipients destinés aux ablutions du service du Temple. « Bassins » est clair et naturel en français moderne.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: à droite / à gauche
  rationale: Cette formulation rend simplement et naturellement la disposition spatiale indiquée par l’hébreu.
- source_word: לְרָחְצָה
  choice: servaient aux ablutions
  rationale: L’infinitif exprime ici la destination. « Ablutions » convient au contexte rituel tout en évitant la répétition de « laver » et « rincer ».
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: ce qui était destiné à l’holocauste
  rationale: L’expression hébraïque, littéralement « l’ouvrage de l’holocauste », est elliptique. Cette traduction conserve une certaine généralité sans préciser abusivement quels objets ou éléments étaient rincés.
- source_word: יָדִיחוּ
  choice: on y rinçait
  rationale: Le hiphil exprime l’action de rincer ou de laver en ôtant ce qui adhère. L’imparfait français rend naturellement la valeur habituelle de l’inaccompli hébreu.
- source_word: וְהַיָּם
  choice: Quant à la Mer
  rationale: « La Mer » conserve le nom distinctif du grand réservoir de bronze et marque clairement le contraste avec les dix bassins.
- source_word: לַכֹּהֲנִים
  choice: aux prêtres
  rationale: Le datif indique ici la destination ou l’usage réservé aux prêtres.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase distingue les bassins utilisés pour ce qui concernait l’holocauste de la « Mer » réservée aux ablutions sacerdotales. Le pronom indéfini « on » rend l’usage habituel sans identifier des agents que l’hébreu ne nomme pas.
