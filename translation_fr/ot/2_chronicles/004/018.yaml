base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: fr
  text: Salomon fabriqua tous ces objets en très grande abondance, car le poids du bronze ne put être déterminé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poids du bronze ne fut pas établi ». Le verbe hébreu peut signifier « rechercher », « examiner » ou « déterminer » ; il peut donc aussi indiquer que le poids n’a pas été établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fabriqua
  rationale: Dans ce contexte d’objets destinés au Temple, « fabriquer » exprime naturellement l’action concrète de faire ou de produire.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: tous ces objets
  rationale: כֵּלִים est un terme large désignant des objets, instruments ou ustensiles. « Objets » convient à l’ensemble varié décrit dans le contexte et reste clair en français moderne.
- source_word: לָרֹב מְאֹד
  choice: en très grande quantité
  rationale: La tournure rend l’idée d’abondance de רֹב ainsi que l’intensification exprimée par מְאֹד.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici une explication. « Car » conserve ce rapport logique dans un registre narratif digne et naturel.
- source_word: לֹא נֶחְקַר
  choice: ne fut pas déterminé
  rationale: Le niphal de חקר peut signifier qu’une chose n’a pas été recherchée, vérifiée ou établie. Avec le poids comme sujet, « ne fut pas déterminé » exprime clairement le sens sans ajouter explicitement une impossibilité absente de la forme hébraïque.
- source_word: מִשְׁקַל
  choice: le poids
  rationale: Le terme désigne concrètement le poids ou la mesure pondérale.
- source_word: הַנְּחֹשֶׁת
  choice: du bronze
  rationale: Dans le contexte du mobilier du Temple, נְחֹשֶׁת désigne conventionnellement le bronze, même si le mot peut aussi couvrir le cuivre ou un alliage cuivreux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Objets » évite l’archaïsme possible de « ustensiles » ou de « vases » tout en couvrant les divers éléments du mobilier du Temple. La formulation principale suit de près l’hébreu et la note signale l’interprétation modale suggérée par le contexte.
