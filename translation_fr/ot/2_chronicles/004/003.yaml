base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: fr
  text: Sous elle, des représentations de bœufs l’entouraient de tous côtés[a], à raison de dix par coudée[b], faisant tout le tour de la Mer. Les bœufs formaient deux rangées ; ils étaient coulés d’une seule pièce avec elle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des formes de bœufs » ; l’hébreu désigne des représentations bovines décoratives, et non des animaux vivants.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dix par coudée », probablement dix figures pour chaque coudée de la circonférence.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « coulés lors de sa coulée », c’est-à-dire façonnés dans la même fonte que la Mer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: des représentations de bœufs
  rationale: דְמוּת désigne ici une forme ou une représentation, non des animaux vivants. « Représentations de bœufs » rend clairement le caractère décoratif des figures bovines.
- source_word: תַּחַת לוֹ
  choice: Sous elle
  rationale: La préposition indique que les ornements se trouvaient sous la Mer, vraisemblablement sous sa cuve ou son rebord.
- source_word: סָבִיב סָבִיב סוֹבְבִים אֹתוֹ
  choice: en faisaient tout le tour
  rationale: Cette formulation française naturelle conserve l’insistance produite par la répétition de סָבִיב et l’idée d’un décor circulaire.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: à raison de dix par coudée
  rationale: La locution exprime vraisemblablement la densité des figures le long de la circonférence. « À raison de » explicite naturellement le rapport de mesure sans en préciser davantage la disposition.
- source_word: הַיָּם
  choice: la Mer
  rationale: La majuscule signale qu’il s’agit du nom traditionnel de la grande cuve du Temple, et non de la mer au sens géographique.
- source_word: שְׁנַיִם טוּרִים
  choice: sur deux rangées
  rationale: טוּרִים désigne des rangées ; la préposition « sur » convient idiomatiquement à leur disposition autour de la cuve.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: avaient été coulés d’une seule pièce avec elle
  rationale: Dans ce contexte de travail du métal, יצק désigne la coulée. La formulation indique que les figures furent intégrées à la même fonte que la Mer plutôt qu’ajoutées ensuite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Bœufs » conserve le vocabulaire concret du texte ; « représentations » évite de faire croire à des animaux vivants. La répétition circulaire de l’hébreu est rendue sans lourdeur par « tout le tour » et « entouraient ».
