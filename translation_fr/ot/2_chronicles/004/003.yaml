  to: Sous elle, des représentations de bœufs l’entouraient de tous côtés[a], à raison de dix par coudée[b], faisant tout le tour de la Mer. Les bœufs formaient deux rangées ; ils étaient coulés d’une seule pièce avec elle[c].
  rationale: La révision sépare la description du parcours circulaire de l’énoncé concernant les deux rangées, conformément à la structure de l’hébreu. Elle remplace aussi un temps verbal inutilement antérieur par un imparfait descriptif, sans modifier le sens ni résoudre au-delà du nécessaire les détails techniques de la coulée.
