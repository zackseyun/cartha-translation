    rationale: שְׁנַיִם טוּרִים הַבָּקָר (« les bœufs [étaient] en deux rangées ») constitue une assertion distincte. Une formulation séparée préserve mieux la syntaxe et la portée de l’hébreu.
  - severity: low
    issue: Le plus-que-parfait « avaient été coulés » introduit une antériorité absente du texte source.
    rationale: יְצוּקִים est un participe passif descriptif. L’imparfait passif français (« étaient coulés ») rend plus directement l’état ou la caractéristique décrite.
