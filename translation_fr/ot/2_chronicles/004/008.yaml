  text: וַ/יַּ֣עַשׂ שֻׁלְחָנוֹת֮ עֲשָׂרָה֒ וַ/יַּנַּח֙ בַּֽ/הֵיכָ֔ל חֲמִשָּׁ֥ה מִ/יָּמִ֖ין וַ/חֲמִשָּׁ֣ה מִ/שְּׂמֹ֑אול וַ/יַּ֛עַשׂ מִזְרְקֵ֥י זָהָ֖ב מֵאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: fr
  text: Il fit dix tables et les plaça dans le Temple, cinq à droite et cinq à gauche. Il fit aussi cent coupes d’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bassins d’or » ou « coupes d’aspersion d’or » ; le terme hébreu désigne des récipients rituels employés pour le service du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: tables
  rationale: Le nom désigne couramment des tables. Ce sens simple convient au contexte du mobilier du Temple sans préciser indûment leur fonction.
- source_word: וַיַּנַּח
  choice: les plaça
  rationale: Le verbe exprime ici l’action de poser ou de disposer les tables à un endroit déterminé. « Les plaça » est naturel et précis en français moderne.
- source_word: בַּהֵיכָל
  choice: dans le Temple
  rationale: Dans ce contexte cultuel, הֵיכָל désigne l’édifice du Temple plutôt qu’un palais. La majuscule identifie clairement le Temple de Jérusalem.
- source_word: מִיָּמִין
  choice: à droite
  rationale: Cette traduction conserve l’indication spatiale explicite sans lui substituer une orientation cardinale implicite.
- source_word: מִשְּׂמֹאול
  choice: à gauche
  rationale: « À gauche » répond naturellement à « à droite » et reste proche de l’expression hébraïque.
- source_word: מִזְרְקֵי זָהָב
  choice: coupes en or
  rationale: מִזְרָק désigne un récipient de type coupe ou bassin employé dans le service rituel. « Coupes en or » est clair et idiomatique, tandis qu’une note conserve les autres possibilités lexicales.
- source_word: מֵאָה
  choice: cent
  rationale: Le nombre cardinal est rendu directement, conformément au style d’inventaire du passage.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’inventaire hébreu, avec deux phrases pour éviter un point-virgule pesant. Le marqueur de note est placé après « coupes en or », expression à laquelle la note se rapporte.
