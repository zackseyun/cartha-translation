base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: fr
  text: les deux colonnes, les deux vasques[a] et les deux chapiteaux au sommet des colonnes, ainsi que les deux treillis[b] destinés à couvrir les deux vasques des chapiteaux qui étaient au sommet des colonnes ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « globes » ou « formes arrondies » ; la forme architecturale exacte désignée par le mot hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « réseaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: colonnes
  rationale: Dans ce contexte architectural, « colonnes » est le terme français courant et précis pour les deux éléments dressés du temple.
- source_word: גֻּלּוֹת
  choice: vasques
  rationale: Le mot désigne ici des éléments arrondis associés aux chapiteaux. « Vasques » rend naturellement la forme probable, tout en signalant en note l’incertitude architecturale.
- source_word: כֹּתָרוֹת
  choice: chapiteaux
  rationale: Terme architectural français exact pour la partie supérieure ornée d’une colonne.
- source_word: רֹאשׁ
  choice: sommet
  rationale: Le sens littéral est « tête », mais « sommet » convient naturellement à l’emploi architectural.
- source_word: שְּׂבָכוֹת
  choice: treillis
  rationale: Le terme évoque un ouvrage décoratif entrelacé ou en forme de filet. « Treillis » est concret et idiomatique en français.
- source_word: לְכַסּוֹת
  choice: destinés à couvrir
  rationale: L’infinitif exprime le but ou la fonction des treillis ; cette formulation le rend clairement en français.
- source_word: אֲשֶׁר
  choice: qui étaient
  rationale: Introduit une relative rattachant les chapiteaux à leur emplacement au sommet des colonnes, sans ajouter d’interprétation.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: deux
  rationale: Les nombres répétés sont conservés pour respecter le caractère inventorial de l’hébreu.
