  text: וַ/יַּ֨עַשׂ֙ חֲצַ֣ר הַ/כֹּהֲנִ֔ים וְ/הָ/עֲזָרָ֖ה הַ/גְּדוֹלָ֑ה וּ/דְלָת֧וֹת לָ/עֲזָרָ֛ה וְ/דַלְתוֹתֵי/הֶ֖ם צִפָּ֥ה נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: fr
  text: Il construisit le parvis des prêtres et le grand parvis, ainsi que des portes pour le parvis[a] ; il recouvrit leurs portes[b] de bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des battants pour le parvis ». Le nom hébreu désigne plus couramment une porte ou un battant qu''un portail monumental.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leurs portes ». L''antécédent du pluriel n''est pas explicite ; on pourrait aussi comprendre collectivement : « les portes de celui-ci », c''est-à-dire du parvis.'
    reason: textual_ambiguity
  - marker: c
    text: 'Ou : « cuivre ». Le terme hébreu peut désigner le cuivre ou le bronze ; « bronze » convient au contexte des ouvrages du temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il construisit
  rationale: Le verbe עשה signifie largement « faire ». Dans ce contexte architectural, « construisit » est naturel en français sans préciser indûment le procédé de fabrication.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: le parvis des prêtres
  rationale: חָצֵר désigne ici une cour du complexe du temple. « Parvis » appartient au vocabulaire architectural religieux courant et conserve clairement le lien avec les prêtres.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: et le grand parvis
  rationale: Dans le contexte du temple, עֲזָרָה désigne une cour ou une enceinte. « Grand parvis » rend directement l'expression tout en restant naturel et digne.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: ainsi que des portes pour le parvis
  rationale: דֶּלֶת désigne normalement une porte ou un battant plutôt qu'une porte monumentale au sens de portail. « Portes » maintient aussi la répétition lexicale de la proposition suivante.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: leurs portes
  rationale: Le suffixe hébreu est morphologiquement à la troisième personne du masculin pluriel. La traduction conserve ce pluriel et l'ambiguïté de son antécédent au lieu de le remplacer silencieusement par un singulier collectif.
- source_word: צִפָּה
  choice: il recouvrit
  rationale: Dans une construction avec un métal, צפה signifie couvrir ou plaquer. « Recouvrit de bronze » est idiomatique en français et décrit clairement l'opération.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » convient au contexte des éléments et du mobilier du temple, tout en signalant l'autre possibilité en note.
