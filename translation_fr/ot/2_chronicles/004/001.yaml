  text: וַ/יַּ֨עַשׂ֙ מִזְבַּ֣ח נְחֹ֔שֶׁת עֶשְׂרִ֤ים אַמָּה֙ אָרְכּ֔/וֹ וְ/עֶשְׂרִ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: fr
  text: Il fit un autel de bronze[a], long de vingt coudées, large de vingt coudées et haut de dix coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de cuivre » ou, selon le terme traditionnel, « d’airain ». Le mot hébreu נְחֹשֶׁת peut désigner le cuivre ou un alliage à base de cuivre; « bronze » est couramment employé pour le mobilier du sanctuaire.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait avancer le récit. Le passé simple convient au registre narratif biblique français et le ו initial peut rester implicite sans perte de sens.
- source_word: מִזְבַּח
  choice: un autel
  rationale: « Autel » est l’équivalent français usuel de מזבח pour une structure destinée aux sacrifices.
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: Dans le contexte du mobilier cultuel, « bronze » est le rendu français moderne conventionnel; le terme hébreu peut aussi désigner le cuivre ou, traditionnellement, l’airain.
- source_word: עֶשְׂרִים אַמָּה אָרְכּוֹ
  choice: long de vingt coudées
  rationale: Cette formulation française naturelle conserve l’unité ancienne et exprime clairement la dimension indiquée par le nom אָרְכּוֹ, « sa longueur ».
- source_word: וְעֶשְׂרִים אַמָּה רָחְבּוֹ
  choice: large de vingt coudées
  rationale: « Large de » rend naturellement la largeur architecturale exprimée par רָחְבּוֹ tout en maintenant le parallélisme des mesures.
- source_word: וְעֶשֶׂר אַמּוֹת קוֹמָתוֹ
  choice: et haut de dix coudées
  rationale: Dans ce contexte architectural, קוֹמָתוֹ désigne la hauteur; la tournure adjectivale est idiomatique en français.
