  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: fr
  text: Houram-Abi[a] fit les marmites, les pelles, les fourchettes et tous les autres ustensiles pour le roi Salomon, pour la maison de Yahweh, en bronze poli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Houram-Abi »; autre traduction possible : « Houram, son père ». Il s’agit probablement ici du nom ou du titre de l’artisan.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « en bronze brillant » ou « en bronze bruni ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: les marmites
  rationale: Le terme désigne des récipients de type pot ou marmite; « marmites » convient à cette liste d’ustensiles du sanctuaire.
- source_word: הַיָּעִים
  choice: les pelles
  rationale: Il s’agit d’outils servant notamment à enlever les cendres ou à manipuler les braises; « pelles » est clair et usuel.
- source_word: הַמִּזְלָגוֹת
  choice: les fourchettes
  rationale: Le mot désigne des instruments à plusieurs dents. « Fourchettes » conserve cette image sans préciser une fonction que le contexte immédiat ne donne pas.
- source_word: כָּל כְּלֵיהֶם
  choice: tous leurs ustensiles
  rationale: Cette formulation rend directement le suffixe possessif hébreu et le sens large de כְּלִי, tout en conservant le caractère récapitulatif de l’expression.
- source_word: חוּרָם אָבִיו
  choice: Houram-Abi
  rationale: Dans ce contexte, l’expression fonctionne vraisemblablement comme le nom ou le titre composé de l’artisan. La forme composée évite de présenter comme certaine la lecture littérale « Houram, son père ».
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: pour le roi Salomon
  rationale: La préposition indique ici le bénéficiaire ou le commanditaire du travail.
- source_word: לְבֵית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque traditionnelle, tandis que « Yahweh » rend directement le nom divin.
- source_word: נְחֹשֶׁת מָרוּק
  choice: en bronze poli
  rationale: Dans ce contexte de mobilier monumental, נְחֹשֶׁת se rend naturellement par « bronze »; מָרוּק décrit un métal poli ou rendu brillant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Interprétation de חוּרָם אָבִיו
  choice: Houram-Abi, comme nom ou titre composé
  alternative: Houram, son père
  rationale: L’usage du Chroniste favorise ici une désignation de l’artisan, mais la lecture syntaxique littérale demeure possible et est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La structure de l’inventaire et la répétition de « pour » reflètent étroitement l’hébreu, sans alourdir excessivement la phrase.
