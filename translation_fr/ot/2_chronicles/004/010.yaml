  text: וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֧תֶף הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: fr
  text: Il plaça la Mer du côté sud-est[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « du côté droit, vers l’est, en face du sud ». Dans les indications spatiales hébraïques, on se représente généralement tourné vers l’est ; le côté droit correspond alors au sud. L’ensemble de l’expression indique donc le côté sud-est.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וְאֶת
  choice: Il
  rationale: La conjonction relie cette indication de placement à ce qui précède; le marqueur de l’objet direct אֵת ne se traduit pas séparément en français. Le sujet implicite est exprimé par « Il ».
- source_word: הַיָּם
  choice: la Mer
  rationale: Le terme désigne le grand bassin de bronze du Temple. « Mer » conserve l’appellation imagée de l’hébreu, et la majuscule signale qu’il s’agit de cet objet cultuel précis.
- source_word: נָתַן
  choice: plaça
  rationale: Dans ce contexte d’aménagement, « plaça » exprime naturellement le fait de mettre un objet à un endroit déterminé.
- source_word: מִכֶּתֶף
  choice: du côté
  rationale: כָּתֵף signifie littéralement « épaule », mais désigne ici un côté ou un flanc dans une indication spatiale.
- source_word: הַיְמָנִית קֵדְמָה
  choice: sud-est
  rationale: Dans l’orientation hébraïque habituelle, où l’on se représente tourné vers l’est, le côté droit correspond au sud; l’ajout de « vers l’est » situe donc l’objet au sud-est. La traduction rend directement cette indication composite, tandis que la note conserve la formulation littérale.
- source_word: מִמּוּל נֶגְבָּה
  choice: face au sud
  rationale: מִמּוּל exprime une position ou une orientation en vis-à-vis, et נֶגְבָּה indique le sud ou la direction du sud. « Face au sud » reste concise et préserve cette relation spatiale.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « La Mer » reprend l’appellation traditionnelle du grand bassin du Temple. La formulation principale privilégie une indication géographique immédiatement compréhensible, avec la traduction plus littérale en note.
