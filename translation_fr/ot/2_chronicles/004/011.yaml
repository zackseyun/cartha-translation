  text: וַ/יַּ֣עַשׂ חוּרָ֔ם אֶת הַ֨/סִּיר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חירם לַ/עֲשׂוֹת֙ אֶת הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בְּ/בֵ֥ית הָ/אֱלֹהִֽים־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: fr
  text: 'Houram[a] fit les pots, les pelles et les coupes. Ainsi, Houram acheva le travail qu’il avait entrepris pour le roi Salomon dans la maison de Dieu :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom est aussi écrit « Hiram » dans des passages apparentés et dans certaines traditions de traduction.
    reason: 'Variante de graphie du nom : le verset présente Houram au début et une graphie consonantique apparentée dans la seconde proposition.'
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Houram
  rationale: « Houram » transcrit naturellement en français la forme vocalisée חוּרָם présente au début du verset; la graphie défective חירם dans la seconde proposition ne nécessite pas de changer le nom en français.
- source_word: הַסִּירוֹת
  choice: les pots
  rationale: סִירוֹת désigne des récipients ou pots; « pots » reste concret et n’en précise pas indûment la fonction.
- source_word: הַיָּעִים
  choice: les pelles
  rationale: יָעִים désigne les instruments servant notamment à enlever ou déplacer les matières liées à l’autel; « pelles » est l’équivalent français courant.
- source_word: הַמִּזְרָקוֹת
  choice: les coupes
  rationale: מִזְרָקוֹת désigne des récipients cultuels; « coupes » est clair et préserve leur fonction exacte sans la surinterpréter.
- source_word: וַיְכַל
  choice: acheva
  rationale: Le verbe כלה exprime ici l’achèvement de l’ouvrage; « acheva » convient au registre narratif et artisanal.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה אֲשֶׁר עָשָׂה
  choice: le travail qu’il faisait
  rationale: Cette formulation française naturelle rend les deux emplois de עשה sans reproduire une répétition maladroite; l’imparfait présente le travail commandé dans son déroulement avant son achèvement.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: pour le roi Salomon
  rationale: Le ל marque ici le bénéficiaire ou commanditaire du travail; « pour » en rend clairement le rapport.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: dans la maison de Dieu
  rationale: La traduction conserve le sens ordinaire de בְּ et l’expression concrète « maison de Dieu », plutôt que de substituer « temple ».
theological_decisions:
- issue: Portée de בְּ dans בְּבֵית הָאֱלֹהִים
  choice: dans la maison de Dieu
  alternative: pour la maison de Dieu
  rationale: « Dans » suit le sens premier de la préposition et préserve l’indication de lieu. « Pour » est contextuellement possible, mais résoudrait une nuance que l’hébreu n’explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination simple de la liste et les deux phrases suivent le mouvement de l’hébreu. Les deux-points finaux sont conservés, car le verset introduit l’énumération qui suit.
