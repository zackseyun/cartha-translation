    issue: 'Temps verbal de la relative : « qu’il faisait »'
    rationale: Le participe narratif hébreu וַיְכַל (« il acheva ») est suivi de l’infinitif « faire/exécuter » et d’une relative au parfait (« qu’il fit/avait fait »). L’imparfait français isolé présente l’action comme non achevée et crée une tension avec « acheva ». « qu’il avait entrepris » exprime naturellement en français le travail mené à son terme, sans imposer une fonction plus précise aux objets.
