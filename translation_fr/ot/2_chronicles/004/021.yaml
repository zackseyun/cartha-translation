  text: the flowers[a], the lamps[b], and the tongs of gold—pure gold.
translation:
  language: fr
  text: les fleurs, les lampes et les pinces[a] en or — en or pur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mouchettes » ou « pinces à mèches ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement quelque chose comme « or — c’était l’achèvement de l’or » ; l’expression peut évoquer un or entièrement affiné ou parfaitement travaillé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: les fleurs
  rationale: פֶּרַח désigne littéralement une fleur ou une floraison. Ici, le singulier hébreu peut avoir une valeur collective et renvoyer aux éléments décoratifs floraux des porte-lampes.
- source_word: וְהַנֵּרוֹת
  choice: les lampes
  rationale: נֵרוֹת est le terme courant pour les lampes; ce choix convient directement au mobilier du Temple.
- source_word: וְהַמֶּלְקַחַיִם
  choice: les pinces
  rationale: מֶלְקַחַיִם désigne un instrument servant à saisir, vraisemblablement les mèches. « Pinces » reste clair et assez large, tandis que la fonction plus précise est signalée en note.
- source_word: זָהָב
  choice: en or
  rationale: Le premier זָהָב indique la matière dont sont faits les objets énumérés; « en or » est la formulation française naturelle.
- source_word: הוּא
  choice: —
  rationale: Dans cette proposition sans verbe exprimé, le pronom souligne la qualité de l’or. Le tiret restitue naturellement cette mise en relief sans imposer un référent singulier artificiel en français.
- source_word: מִכְלוֹת זָהָב
  choice: un or d’une qualité parfaite
  rationale: L’expression rare évoque un or porté à son plein degré d’achèvement ou de qualité. Cette formulation conserve l’idée de perfection sans trancher abusivement entre pureté du métal et perfection du travail.
theological_decisions: []
