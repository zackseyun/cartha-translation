  register: Français international moderne, sobre et adapté à une liste d’objets cultuels. Le pluriel « fleurs » rend naturellement la valeur probablement collective du singulier hébreu. Les deux notes maintiennent les incertitudes lexicales réelles sans alourdir le texte principal.
