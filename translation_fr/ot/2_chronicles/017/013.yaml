  yaml_path: translation/ot/2_chronicles/017/013.yaml
  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: fr
  text: Il avait de nombreux travaux[a] dans les villes de Juda et, à Jérusalem, des hommes de guerre, de vaillants combattants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner une activité, un ouvrage ou des biens.
    reason: Signaler l’étendue sémantique de מְלָאכָה, que le contexte ne permet pas de réduire avec une certitude absolue à des travaux de construction ou à des possessions.
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: de nombreux travaux
  rationale: מְלָאכָה désigne couramment un travail, une activité ou un ouvrage. Le pluriel français donne ici une formulation naturelle tout en restant proche du sens premier et du contexte administratif du règne.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: des hommes de guerre
  rationale: Rendu direct de l’expression hébraïque, qui désigne des hommes destinés ou entraînés au combat.
- source_word: גִּבּוֹרֵי חַיִל
  choice: de vaillants combattants
  rationale: L’expression qualifie des guerriers remarquables par leur force, leur courage et leur aptitude militaire. « Combattants » évite la répétition immédiate de « hommes de guerre » tout en conservant le cadre militaire.
