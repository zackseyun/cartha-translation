  text: וּ/מְלָאכָ֥ה רַבָּ֛ה הָ֥יָה ל֖/וֹ בְּ/עָרֵ֣י יְהוּדָ֑ה וְ/אַנְשֵׁ֧י מִלְחָמָ֛ה גִּבּ֥וֹרֵי חַ֖יִל בִּ/ירוּשָׁלִָֽם׃
base_translation:
