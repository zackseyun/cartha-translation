base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: fr
  text: 'Avec eux se trouvaient les lévites suivants : Shemaya, Netanya, Zebadya, Asaël, Shemiramoth, Yehonatan, Adoniya, Toviya et Tov-Adoniya[a]. Avec eux se trouvaient aussi les prêtres Élishama et Yehoram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu écrit « Tov Adoniya » en deux éléments; il s’agit probablement d’un seul nom composé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Avec eux se trouvaient
  rationale: La préposition exprime l’accompagnement. Le verbe « se trouvaient », sous-entendu en hébreu, donne une phrase française naturelle sans ajouter d’action au texte.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: L’article défini hébreu est conservé, et le terme désigne ici les membres du groupe lévitique.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Cette translittération française reflète la forme hébraïque longue du nom, plutôt que la forme abrégée Yonatan.
- source_word: טוֹבִיָּהוּ
  choice: Toviya
  rationale: La forme française translittérée garde de manière reconnaissable la finale théophore hébraïque -yahu.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Tov-Adoniya
  rationale: Le trait d’union présente les deux éléments massorétiques comme un seul nom personnel probable, sans masquer leur séparation graphique dans l’hébreu.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Le terme désigne explicitement la fonction sacerdotale d’Élishama et de Yehoram et doit rester distinct de la première liste de lévites.
theological_decisions:
- issue: Distinction entre les lévites et les prêtres
  choice: Présenter les premiers noms comme ceux des lévites, puis Élishama et Yehoram comme les prêtres qui les accompagnent.
  alternative: Comprendre tous les hommes nommés comme un seul groupe de lévites.
  rationale: La syntaxe hébraïque reprend « avec eux » et qualifie explicitement les deux derniers hommes de « prêtres »; la distinction institutionnelle du texte doit donc être préservée.
translation_notes:
  register: Français moderne, clair et digne. Les noms sont translittérés directement de l’hébreu selon des formes lisibles en français. « Les lévites suivants » encadre naturellement la liste et rend la reprise hébraïque de « les lévites » après les noms sans lourdeur. Le second « avec eux » est conservé pour marquer le passage au groupe des prêtres.
