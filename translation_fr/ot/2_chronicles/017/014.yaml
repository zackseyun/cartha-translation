base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: fr
  text: 'Voici leur dénombrement[a], selon leurs maisons ancestrales : pour Juda, les chefs de milliers : Adna, le chef, et avec lui trois cent mille vaillants guerriers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs effectifs » ou « leur recensement ». Le terme hébreu peut désigner un dénombrement militaire, les hommes dénombrés ou leur organisation en unités.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: leurs unités recensées
  rationale: Dans ce contexte militaire, le terme peut désigner le recensement des hommes, les effectifs ainsi dénombrés ou leur organisation. « Unités recensées » rend à la fois l’idée de rassemblement militaire et celle de répartition, sans réduire le mot à un simple total.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: selon leurs familles ancestrales
  rationale: L’expression désigne les groupes familiaux fondés sur la lignée paternelle. Cette formulation est naturelle en français moderne tout en conservant la dimension généalogique et administrative.
- source_word: לִיהוּדָה
  choice: Pour Juda
  rationale: La formule introduit ici le contingent de Juda dans l’énumération militaire.
- source_word: שָׂרֵי אֲלָפִים
  choice: les chefs de milliers
  rationale: Titre militaire désignant des responsables d’unités comptées par milliers. La traduction reste proche de la structure hébraïque sans imposer un grade militaire moderne précis.
- source_word: עַדְנָה הַשָּׂר
  choice: Adna, le chef
  rationale: Le titre est rendu de la même manière que le terme apparenté dans « chefs de milliers », ce qui préserve la cohérence lexicale.
- source_word: גִּבּוֹרֵי חַיִל
  choice: vaillants guerriers
  rationale: L’expression hébraïque caractérise des combattants puissants, capables et courageux. « Vaillants guerriers » en restitue clairement la portée militaire en français actuel.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: 300 000
  rationale: Rendu direct du nombre cardinal hébreu, selon l’usage typographique français.
