  rationale: La révision remplace « premières » par « antérieures », qui rend plus idiomatiquement la qualification temporelle de הָרִאשֹׁנִים et préserve l'ambiguïté quant à la période précise visée. Elle rétablit « père » dans le texte, conformément à l'hébreu, tout en conservant l'explication dynastique en note.
