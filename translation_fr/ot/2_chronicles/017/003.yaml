  text: וַ/יְהִ֥י יְהוָ֖ה עִם יְהוֹשָׁפָ֑ט כִּ֣י הָלַ֗ךְ בְּ/דַרְכֵ֞י דָּוִ֤יד אָבִי/ו֙ הָ/רִ֣אשֹׁנִ֔ים וְ/לֹ֥א דָרַ֖שׁ לַ/בְּעָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: fr
  text: Yahweh fut avec Josaphat, parce que celui-ci suivit les voies antérieures de David, son père[a], et ne rechercha pas les Baals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « David, son père ». Dans cette expression dynastique, « père » désigne un ancêtre dans la lignée royale.'
    reason: clarification culturelle et généalogique
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיְהִי ... עִם
  choice: fut avec
  rationale: Rend directement l’idiome exprimant la présence favorable et le soutien de Yahweh.
- source_word: כִּי
  choice: parce que
  rationale: Exprime clairement la relation causale introduite ici par כִּי.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: suivit les … voies
  rationale: Conserve l’image hébraïque de la conduite morale tout en étant plus naturelle en français que « marcha dans les voies ».
- source_word: דָּוִיד אָבִיו
  choice: David, son ancêtre
  rationale: Dans ce contexte dynastique, אָב désigne David comme père ancestral de Josaphat, non comme son père immédiat.
- source_word: הָרִאשֹׁנִים
  choice: les premières
  rationale: Préserve la qualification explicite des voies de David sans déterminer au-delà du texte la nature exacte du contraste temporel.
- source_word: דָרַשׁ
  choice: rechercha
  rationale: 'Garde la portée religieuse assez large du verbe : se tourner vers une divinité pour la consulter, obtenir son aide ou lui rendre un culte.'
- source_word: לַבְּעָלִים
  choice: les Baals
  rationale: Respecte le pluriel hébreu, qui peut viser les diverses manifestations locales ou cultes de Baal.
theological_decisions:
- issue: David donné comme modèle malgré ses défaillances ultérieures
  choice: les premières voies de David
  alternative: les voies anciennes de David / les voies de David au début
  rationale: Le pluriel הָרִאשֹׁנִים qualifie explicitement les voies de David. « Premières » conserve cette limitation et la tension du texte, sans préciser avec certitude qu’elle vise ses fautes tardives.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Suivit les voies » maintient la métaphore éthique sans produire la tournure plus lourde « marcha dans les voies ».
