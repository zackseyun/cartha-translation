base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: fr
  text: Tels étaient ceux qui servaient le roi, sans compter ceux que le roi avait affectés aux villes fortifiées de tout Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels étaient ceux
  rationale: Cette tournure reprend naturellement en français la liste qui précède et conserve la fonction récapitulative du démonstratif hébreu.
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: qui servaient le roi
  rationale: Le participe de שׁרת désigne ici des personnes au service du roi, vraisemblablement dans un cadre officiel et militaire. « Servaient » reste clair et évite la connotation religieuse que pourrait avoir « exerçaient un ministère ».
- source_word: מִלְּבַד
  choice: sans compter
  rationale: L’expression distingue les hommes énumérés de ceux qui étaient répartis ailleurs, tout en indiquant que ces derniers s’ajoutaient à eux. « Sans compter » exprime naturellement cette relation en français.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: ceux que le roi avait affectés
  rationale: Le verbe נתן signifie littéralement « donner, mettre, placer ». Dans ce contexte militaire, il décrit l’affectation d’hommes à des postes dans des villes fortifiées.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: aux villes fortifiées
  rationale: Le groupe nominal désigne des villes aménagées pour la défense. Avec « affectés », la préposition « aux » rend idiomatiquement l’idée d’une assignation à ces villes.
- source_word: בְּכָל יְהוּדָה
  choice: de tout Juda
  rationale: Cette formulation conserve l’étendue territoriale exprimée par כל et se rattache naturellement aux villes fortifiées réparties dans le royaume.
