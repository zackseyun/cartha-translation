  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: fr
  text: Son cœur s’enhardit dans les voies de Yahvé[a]. De plus, il fit disparaître de Juda les hauts lieux et les ashéras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son cœur s’éleva dans les voies de Yahvé ». L’expression peut évoquer un cœur élevé ou devenu hardi ; ici, le contexte lui donne un sens favorable, non celui de l’orgueil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les poteaux sacrés » ou « les poteaux d’Ashéra ». Le terme hébreu désigne des objets cultuels associés au culte d’Ashéra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: Son cœur s’enhardit
  rationale: Littéralement, le cœur « s’éleva » ou « devint haut ». Dans ce contexte favorable, l’expression désigne une assurance ou une résolution accrue plutôt que l’orgueil. « S’enhardit » restitue naturellement cette valeur tout en conservant le cœur comme siège de la volonté.
- source_word: בְּדַרְכֵי יְהוָה
  choice: dans les voies de Yahvé
  rationale: Le pluriel « voies » désigne ici la conduite conforme à Dieu. Cette formulation conserve l’image et rend le tétragramme par le nom personnel « Yahvé ».
- source_word: וְעוֹד
  choice: De plus
  rationale: L’expression introduit une action supplémentaire. « De plus » est clair et naturel en français moderne.
- source_word: הֵסִיר
  choice: fit disparaître
  rationale: Le hifil de סור signifie faire ôter ou enlever. Cette traduction exprime l’action réformatrice sans préciser au-delà du texte le procédé employé.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Terme français traditionnel et encore intelligible pour les lieux de culte, souvent aménagés sur des hauteurs.
- source_word: הָאֲשֵׁרִים
  choice: les ashéras
  rationale: Le pluriel hébreu désigne des objets cultuels liés à Ashéra, dont la forme exacte n’est pas toujours certaine. La translittération francisée évite de les définir systématiquement comme des poteaux.
- source_word: מִיהוּדָה
  choice: de Juda
  rationale: La préposition indique le territoire duquel ces objets et lieux furent supprimés.
theological_decisions:
- issue: Valeur positive ou négative de l’élévation du cœur
  choice: Une assurance et une résolution accrues dans les voies de Yahvé
  alternative: Son cœur s’éleva / devint orgueilleux dans les voies de Yahvé
  rationale: L’idiome peut ailleurs évoquer l’orgueil, mais le complément « dans les voies de Yahvé » et l’élimination des lieux de culte illicites donnent ici une orientation favorable. La note maintient visible l’image hébraïque et son amplitude lexicale.
- issue: Identification précise des אֲשֵׁרִים
  choice: ashéras
  alternative: poteaux sacrés / poteaux d’Ashéra
  rationale: Le mot renvoie à des objets cultuels associés à la déesse Ashéra, mais leur forme matérielle exacte ne doit pas être imposée dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « s’enhardit » rend l’idiome hébreu de façon naturelle, tandis que la note en conserve la métaphore et l’ambiguïté potentielle. « Ashéras » évite une précision matérielle incertaine, expliquée en note.
