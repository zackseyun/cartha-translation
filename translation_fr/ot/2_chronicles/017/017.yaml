  text: וּ/מִ֨ן בִּנְיָמִ֔ן גִּבּ֥וֹר חַ֖יִל אֶלְיָדָ֑ע וְ/עִמּ֛/וֹ נֹֽשְׁקֵי קֶ֥שֶׁת וּ/מָגֵ֖ן מָאתַ֥יִם אָֽלֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: fr
  text: 'Et de Benjamin : Éliada, un vaillant guerrier, et avec lui 200 000 hommes équipés[a] d’arcs et de boucliers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portant des arcs et des boucliers » ou « armés d’arcs et de boucliers ». Le participe hébreu désigne des hommes pourvus de ces armes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: De
  rationale: La préposition introduit le contingent issu de Benjamin. En français, « De Benjamin » s’intègre naturellement à la structure énumérative du contexte; la continuité additive demeure perceptible dans la liste.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Nom traditionnel de la tribu en français.
- source_word: גִּבּוֹר חַיִל
  choice: un vaillant guerrier
  rationale: Cette expression désigne ici un homme fort et courageux dans un cadre militaire. « Vaillant guerrier » restitue clairement ses deux dimensions en français actuel.
- source_word: אֶלְיָדָע
  choice: Éliada
  rationale: Translittération française usuelle du nom propre hébreu, avec accent pour guider la prononciation.
- source_word: וְעִמּוֹ
  choice: et avec lui
  rationale: La conjonction et la locution prépositionnelle rattachent explicitement les troupes au chef nommé et conservent la progression de l’énumération.
- source_word: נֹשְׁקֵי
  choice: hommes équipés
  rationale: Le participe désigne des hommes pourvus d’armes. L’ajout explicite de « hommes » rend naturel en français le lien entre le nombre et la qualification militaire.
- source_word: קֶשֶׁת
  choice: d’arcs
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel français convient à l’équipement individuel d’un grand nombre d’hommes.
- source_word: וּמָגֵן
  choice: et de boucliers
  rationale: Comme pour « arcs », le pluriel français exprime naturellement la valeur collective du singulier hébreu.
- source_word: מָאתַיִם אָלֶף
  choice: 200 000
  rationale: Rendu direct du nombre; l’écriture chiffrée avec espace insécable suit l’usage typographique français et facilite la lecture d’un recensement militaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la structure de la liste militaire tout en évitant l’expression vieillie « homme de valeur ». Le marqueur de note est placé après « équipés », terme auquel porte l’alternative lexicale.
