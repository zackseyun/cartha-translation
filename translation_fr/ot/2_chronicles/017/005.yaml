  naturalness: Le registre est moderne, sobre et naturel. « Sous l'autorité de Josaphat » est une formulation idiomatique qui rend explicitement et sans ambiguïté la fonction de l'expression hébraïque « dans sa main ».
  terminology: « Yahweh », « Juda », « Josaphat », « tribut », « richesse » et « honneur » conviennent. La note sur minḥah préserve correctement les principales possibilités lexicales, tout en signalant que le contexte royal favorise « tribut ».
  issues:
