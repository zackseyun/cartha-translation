  rationale: La révision remplace le possessif français ambigu par « sous l’autorité de Josaphat ». Elle rend le sens politique de l'idiome hébreu (« dans sa main », c'est-à-dire sous son contrôle) et identifie correctement son référent, sans ajouter d'interprétation doctrinale. La note et les autres choix de vocabulaire sont conservés.
