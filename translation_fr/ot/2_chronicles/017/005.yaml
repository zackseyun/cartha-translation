source:
  edition: WLC
  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: fr
  text: Ainsi, Yahweh affermit le royaume sous l’autorité de Josaphat, et tout Juda apporta un tribut[a] à Josaphat. Celui-ci eut richesse et honneur en abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « don », « présent » ou « offrande » (hébreu minḥah) ; ici, le contexte royal favorise « tribut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: affermit
  rationale: Le hiphil de כון exprime ici l’action de rendre stable ou solidement établi. « Affermit » convient à la consolidation du pouvoir royal sans la limiter au domaine militaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הַמַּמְלָכָה בְּיָדוֹ
  choice: le royaume entre ses mains
  rationale: מַמְלָכָה désigne le royaume ou la royauté, et l’image de la « main » évoque l’autorité et la maîtrise. La tournure française naturelle « entre ses mains » conserve cette image.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: tout Juda apporta
  rationale: « Tout Juda » est un sujet collectif désignant la population du royaume. Avec un tribut remis au roi, « apporta » est plus naturel en français que le calque « donna ».
- source_word: מִנְחָה
  choice: tribut
  rationale: Le terme peut désigner un don, un présent ou une offrande, mais le contexte royal de l’affermissement du pouvoir de Josaphat favorise « tribut ».
- source_word: לִיהוֹשָׁפָט
  choice: à Josaphat
  rationale: « Josaphat » est la forme française traditionnelle et immédiatement reconnaissable de ce nom biblique.
- source_word: וַיְהִי לוֹ
  choice: Celui-ci eut
  rationale: L’expression hébraïque marque la possession. « Celui-ci » lève naturellement en français toute ambiguïté possible avec « Juda ».
- source_word: עֹשֶׁר וְכָבוֹד
  choice: richesse et honneur
  rationale: Dans ce contexte de cour royale, עֹשֶׁר évoque la richesse matérielle et כָבוֹד le prestige ou l’honneur public.
- source_word: לָרֹב
  choice: en abondance
  rationale: Cette expression indique une très grande quantité; « en abondance » en rend le sens avec naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve sous une forme translittérée courante sans le remplacer par un titre.
- issue: Nature de la מִנְחָה remise à Josaphat
  choice: tribut
  alternative: don / présent / offrande
  rationale: Le contexte politique favorise un tribut rendu au roi, mais la note maintient l’étendue sémantique réelle du mot hébreu sans imposer une précision excessive.
translation_notes:
  register: Français international moderne, digne et lisible. La structure narrative reste concise; l’image du royaume placé « entre ses mains » est conservée, tandis que « Celui-ci » assure une référence claire à Josaphat. Le marqueur de note est placé après « tribut », le mot auquel la note se rapporte.
