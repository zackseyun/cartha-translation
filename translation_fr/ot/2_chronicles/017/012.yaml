  text: וַ/יְהִ֧י יְהוֹשָׁפָ֛ט הֹלֵ֥ךְ וְ/גָדֵ֖ל עַד לְ/מָ֑עְלָ/ה וַ/יִּ֧בֶן בִּֽ/יהוּדָ֛ה בִּירָנִיּ֖וֹת וְ/עָרֵ֥י מִסְכְּנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: fr
  text: Josaphat devint de plus en plus puissant, et il construisit en Juda des forteresses[a] et des villes-entrepôts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « citadelles ». Le terme hébreu désigne des places fortes.
    reason: lexical_alternative
  - marker: b
    text: Ou « villes de stockage » ou « villes de ravitaillement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: devint de plus en plus puissant
  rationale: L’ensemble de la construction hébraïque exprime une progression continue vers une grandeur élevée. En contexte royal, « puissant » rend naturellement l’accroissement de la stature et de la force de Josaphat sans reproduire maladroitement l’image littérale du mouvement ascendant.
- source_word: וַיִּבֶן
  choice: il construisit
  rationale: Le verbe בנה désigne ici l’action de bâtir ou d’édifier. « Construisit » convient naturellement aux deux compléments qui suivent.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition marque le lieu où Josaphat fit réaliser ces constructions.
- source_word: בִּירָנִיּוֹת
  choice: forteresses
  rationale: Le terme désigne des ouvrages ou places fortifiés. « Forteresses » est clair en français moderne et évite les connotations médiévales de « châteaux ».
- source_word: עָרֵי מִסְכְּנוֹת
  choice: villes-entrepôts
  rationale: Cette expression désigne des villes affectées au stockage de provisions ou de matériel. « Villes-entrepôts » exprime clairement cette fonction administrative et logistique.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La progression idiomatique de l’hébreu est rendue naturellement, tandis que les deux termes architecturaux et administratifs gardent leurs nuances au moyen de notes lexicales.
