  text: וּ/מִן פְּלִשְׁתִּ֗ים מְבִיאִ֧ים לִֽ/יהוֹשָׁפָ֛ט מִנְחָ֖ה וְ/כֶ֣סֶף מַשָּׂ֑א גַּ֣ם הָֽ/עַרְבִיאִ֗ים מְבִיאִ֥ים ל/וֹ֙ צֹ֕אן אֵילִ֔ים שִׁבְעַ֤ת אֲלָפִים֙ וּ/שְׁבַ֣ע מֵא֔וֹת וּ/תְיָשִׁ֕ים שִׁבְעַ֥ת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: fr
  text: 'Des Philistins apportaient à Josaphat un tribut et une charge d’argent[a]. Les Arabes aussi lui amenaient du petit bétail : 7 700 béliers et 7 700 boucs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’argent, une charge » ; c’est-à-dire une charge d’argent apportée comme tribut.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: Des Philistins
  rationale: La préposition מִן peut exprimer la provenance (« de la part des Philistins ») ou une nuance partitive (« certains Philistins »). La tournure française conserve naturellement cette ambiguïté.
- source_word: מְבִיאִים
  choice: apportaient / amenaient
  rationale: Le participe décrit une action habituelle ou répétée. « Apportaient » convient au tribut et « amenaient » au bétail vivant.
- source_word: מִנְחָה
  choice: un tribut
  rationale: Dans ce contexte politique, le mot désigne vraisemblablement un tribut remis à un roi plutôt qu’une offrande cultuelle.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: et de l’argent, comme charge
  rationale: « Argent » rend כֶסֶף, qui peut désigner le métal précieux ou la monnaie, tandis que « comme charge » maintient l’image concrète et l’apposition de מַשָּׂא.
- source_word: גַּם הָעַרְבִיאִים
  choice: Les Arabes aussi
  rationale: Cette formulation moderne rend le nom du peuple et la valeur additive de גַּם.
- source_word: ל/וֹ צֹאן
  choice: lui amenaient du petit bétail
  rationale: צֹאן est un collectif désignant le petit bétail, notamment ovins et caprins, ensuite détaillés dans le verset.
- source_word: אֵילִים
  choice: béliers
  rationale: Équivalent français précis et courant pour les moutons mâles adultes.
- source_word: וּ/תְיָשִׁים
  choice: boucs
  rationale: Le terme hébreu désigne spécifiquement des chèvres mâles.
- source_word: שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: 7 700
  rationale: Les chiffres et l’espacement typographique français facilitent la lecture sans modifier le sens.
theological_decisions: []
