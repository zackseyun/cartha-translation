  text: וַֽ/יְלַמְּדוּ֙ בִּֽ/יהוּדָ֔ה וְ/עִ֨מָּ/הֶ֔ם סֵ֖פֶר תּוֹרַ֣ת יְהוָ֑ה וַ/יָּסֹ֨בּוּ֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה וַֽ/יְלַמְּד֖וּ בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: fr
  text: Ils enseignèrent en Juda, et le livre de la loi de Yahweh était avec eux[a]. Ils parcoururent toutes les villes de Juda et enseignèrent parmi le peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rouleau de l’instruction de Yahweh ». Le mot hébreu traduit par « livre » peut désigner un document écrit sous forme de rouleau, et celui qui est traduit par « loi » peut aussi signifier « instruction ».
    reason: lexical_alternative
  - marker: b
    text: Ou « enseignèrent le peuple ». L’hébreu dit plus littéralement qu’ils enseignèrent « parmi le peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: Ils enseignèrent
  rationale: Le piel de למד signifie ici « enseigner, instruire ». « Enseignèrent » est direct, naturel et permet de rendre de la même manière la répétition du verbe à la fin du verset.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition ב marque simplement le lieu. L’étendue du déplacement est précisée ensuite par la mention de toutes les villes de Juda.
- source_word: וְעִמָּהֶם סֵפֶר תּוֹרַת יְהוָה
  choice: et avaient avec eux le livre de la loi de Yahweh
  rationale: La proposition hébraïque est nominale, littéralement « et avec eux [était] le livre… ». La tournure française « avaient avec eux » exprime naturellement cet accompagnement sans modifier le sens. סֵפֶר peut désigner un livre ou, matériellement, un rouleau; תּוֹרָה désigne ici la loi ou instruction donnée par Yahweh.
- source_word: וַיָּסֹבּוּ בְּכָל עָרֵי יְהוּדָה
  choice: Ils parcoururent toutes les villes de Juda
  rationale: סבב évoque un déplacement de lieu en lieu, en circuit. « Parcoururent » rend ce mouvement de manière concise et idiomatique en français.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: et enseignèrent au milieu du peuple
  rationale: La préposition ב devant עָם situe l’activité d’enseignement parmi le peuple plutôt que de marquer explicitement un complément d’objet direct. Cette formulation conserve cette nuance.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre, tout en évitant d’ajouter une interprétation confessionnelle.
- issue: Sens de תּוֹרָה dans l’expression סֵפֶר תּוֹרַת יְהוָה
  choice: la loi
  alternative: l’instruction
  rationale: Dans ce contexte, תּוֹרָה renvoie à l’enseignement normatif de Yahweh consigné par écrit. « Loi » est la désignation française la plus claire et reconnue, tandis qu’une note conserve la possibilité lexicale « instruction ».
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique écrit. La coordination reste proche de l’hébreu, tandis que « avaient avec eux » et « parcoururent » assurent une lecture naturelle.
