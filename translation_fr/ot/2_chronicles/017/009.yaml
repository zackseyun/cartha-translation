- from: Ils enseignèrent en Juda et avaient avec eux le livre de la loi de Yahweh[a]. Ils parcoururent toutes les villes de Juda et enseignèrent au milieu du peuple[b].
  to: Ils enseignèrent en Juda, et le livre de la loi de Yahweh était avec eux[a]. Ils parcoururent toutes les villes de Juda et enseignèrent parmi le peuple[b].
  rationale: La révision remplace la construction française aspectuellement discordante par une proposition stative qui correspond à la clause nominale hébraïque et au sens attesté dans l’audit anglais. Elle améliore également la fluidité de la dernière expression sans effacer la nuance de localisation portée par la préposition hébraïque.
