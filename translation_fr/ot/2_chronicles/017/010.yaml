  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: fr
  text: La crainte de Yahweh[a] s’empara de tous les royaumes des pays qui entouraient Juda, et ils ne firent pas la guerre à Josaphat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terreur venant de Yahweh » ou « l’effroi de Yahweh ». L’expression hébraïque peut désigner une peur liée à Yahweh; ici, elle évoque probablement une terreur envoyée par Yahweh sur les royaumes voisins.
    reason: alternative lexicale et ambiguïté de la construction hébraïque
lexical_decisions:
- source_word: וַיְהִי
  choice: s’empara
  rationale: Avec un nom exprimant la peur et la préposition עַל, cette tournure rend naturellement en français l’apparition d’un état qui atteint un groupe, sans se limiter au calque « il y eut ».
- source_word: פַּחַד יְהוָה
  choice: la crainte de Yahweh
  rationale: פַּחַד désigne la crainte, l’effroi ou la terreur. Le groupe construit peut évoquer une peur de Yahweh ou une terreur envoyée par lui. La formulation retenue reste directe et préserve cette tension, explicitée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le rendre comme nom propre plutôt que de lui substituer un titre.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: tous les royaumes des pays
  rationale: Cette formulation conserve les deux substantifs hébreux, « royaumes » et « pays », tout en restant compréhensible en français actuel.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: qui entouraient Juda
  rationale: Le relatif et la valeur géographique de סְבִיבוֹת sont rendus par une proposition naturelle et concise.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: et ils ne firent pas la guerre à
  rationale: Le verbe נלחם dans ce contexte politique et militaire désigne l’action de combattre ou de faire la guerre; cette expression française en restitue clairement la portée.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: La forme française traditionnelle et courante du nom biblique est retenue.
theological_decisions:
- issue: Sens de « la crainte de Yahweh » dans ce contexte
  choice: Conserver dans le texte la construction génitive « la crainte de Yahweh », tout en signalant qu’il s’agit vraisemblablement ici d’un effroi suscité par Yahweh.
  alternative: Traduire directement « une terreur venant de Yahweh » ou comprendre une crainte révérencielle éprouvée envers Yahweh.
  rationale: Le contexte militaire indique probablement une terreur d’origine divine qui dissuade les royaumes voisins d’attaquer. Toutefois, la construction hébraïque ne précise pas explicitement la relation exacte; le texte et la note préservent donc cette ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. « S’empara de » exprime avec naturel l’irruption de la peur, tandis que « firent la guerre » conserve la portée politique et militaire du passage.
