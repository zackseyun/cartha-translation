  text: וְ/עַל יָד֖/וֹ יְהוֹזָבָ֑ד וְ/עִמּ֛/וֹ מֵאָֽה וּ/שְׁמוֹנִ֥ים אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/018.yaml
  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: fr
  text: À ses côtés se tenait Yehozabad[a], accompagné de 180 000 hommes équipés pour la guerre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à sa main » ; cette expression peut aussi signifier qu’il était sous sa direction ou placé près de lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « 180 000 soldats armés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: À ses côtés se tenait
  rationale: L’expression signifie littéralement « à sa main » et peut indiquer une position aux côtés de quelqu’un ou sous sa direction. « À ses côtés » conserve ici l’image et l’ambiguïté relationnelle sans imposer une hiérarchie stricte.
- source_word: יְהוֹזָבָד
  choice: Yehozabad
  rationale: Le nom propre hébreu est translittéré sous une forme qui en reflète clairement la prononciation en français.
- source_word: וְעִמּוֹ
  choice: accompagné de
  rationale: La préposition עִם exprime l’accompagnement ou l’association. Cette formulation est naturelle en français dans une liste de chefs militaires et de leurs hommes.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180 000
  rationale: Le nombre cardinal est direct; l’écriture en chiffres avec une espace suit l’usage typographique français moderne.
- source_word: חֲלוּצֵי צָבָא
  choice: hommes équipés pour la guerre
  rationale: חֲלוּצֵי désigne des hommes équipés, armés ou prêts à servir, tandis que צָבָא précise le contexte militaire. La formulation rend les deux éléments sans réduire nécessairement l’expression au seul substantif « soldats ».
