base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: fr
  text: La troisième année de son règne, il envoya ses responsables[a] — Ben-Haïl, Abdias, Zacharie, Netanéel et Michée — enseigner dans les villes de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses princes » ou « ses chefs » ; le terme hébreu peut désigner des dignitaires royaux ou des responsables administratifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: La troisième année de son règne
  rationale: Cette formulation française naturelle rend l’indication temporelle et le sens royal de מָלְכוֹ. La conjonction narrative initiale n’a pas besoin d’être représentée par « et » dans ce verset autonome.
- source_word: שָׁלַח
  choice: il envoya
  rationale: Rend directement le verbe courant « envoyer » sans lui ajouter de nuance technique.
- source_word: לְשָׂרָיו
  choice: ses responsables
  rationale: שַׂר peut désigner des princes, des chefs ou des dignitaires exerçant une fonction officielle. « Responsables » convient au contexte administratif sans suggérer à tort qu’ils appartenaient à la famille royale.
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: Ben-Haïl, Abdias, Zacharie, Netanéel et Michée
  rationale: Les noms propres suivent des formes françaises bibliques établies et aisément reconnaissables, tout en distinguant Netanéel de Nathanaël.
- source_word: לְלַמֵּד
  choice: enseigner
  rationale: L’infinitif piel de למד signifie couramment « enseigner »; l’infinitif français exprime naturellement le but de l’envoi.
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: La préposition ב indique ici le lieu. La traduction conserve le sens simple sans expliciter une nuance distributive seulement implicite.
