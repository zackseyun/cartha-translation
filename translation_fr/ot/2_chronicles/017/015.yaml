  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: fr
  text: Sous ses ordres[a] se trouvait le chef Yehohanân, et avec lui se trouvaient deux cent quatre-vingt mille hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « sur sa main » ; dans ce contexte, elle peut aussi se rendre par « sous son autorité » ou « à ses côtés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Sous ses ordres
  rationale: Dans cette liste militaire, l’expression idiomatique עַל יָדֹו indique que Yehohanân relève de l’autorité du chef précédemment nommé. Cette formulation française est naturelle tout en conservant le rapport hiérarchique.
- source_word: יְהוֹחָנָן
  choice: Yehohanân
  rationale: Le nom propre est translittéré d’après sa forme hébraïque, avec une graphie lisible en français.
- source_word: הַשַּׂר
  choice: le chef
  rationale: שַׂר peut désigner un prince, un haut responsable ou un commandant. Dans ce contexte militaire, « chef » exprime sa fonction sans préciser un grade que l’hébreu ne donne pas.
- source_word: וְעִמּוֹ
  choice: qui avait avec lui
  rationale: Cette tournure relie clairement au chef Yehohanân l’effectif mentionné ensuite et fournit en français le verbe sous-entendu en hébreu.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: deux cent quatre-vingt mille hommes
  rationale: La quantité exacte est conservée. « Hommes » est explicité d’après le contexte de recensement militaire, où le nom compté est sous-entendu.
