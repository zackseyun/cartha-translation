  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: fr
  text: Sous ses ordres se trouvait Amasia, fils de Zikri, qui s’était offert volontairement à Yahweh[a] ; il avait avec lui deux cent mille vaillants guerriers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui s’était porté volontaire pour Yahweh ». Le participe hébreu souligne une démarche libre et peut désigner l’offrande volontaire de soi ou l’engagement volontaire au service de Yahweh.
    reason: Alternative lexicale et préservation de l’ambiguïté de הַמִּתְנַדֵּב לַיהוָה.
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Sous ses ordres se trouvait
  rationale: Dans cette liste militaire, l’expression idiomatique עַל יָד avec suffixe indique qu’Amasia est placé sous l’autorité du chef précédemment nommé. Cette formulation est naturelle et claire en français moderne.
- source_word: עֲמַסְיָה
  choice: Amasia
  rationale: Translittération française usuelle du nom hébreu, adaptée à la phonologie et à l’orthographe françaises.
- source_word: בֶן זִכְרִי
  choice: fils de Zikri
  rationale: La construction généalogique hébraïque est rendue directement, avec translittération du nom propre.
- source_word: הַמִּתְנַדֵּב
  choice: qui s’était offert volontairement
  rationale: Le participe hitpael de נדב exprime une démarche volontaire engageant la personne elle-même. Le plus-que-parfait situe naturellement cet engagement par rapport au dénombrement narré.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל peut marquer ici la destination ou la consécration. « à Yahweh » conserve le sens d’un don volontaire de soi et rend directement le nom divin יהוה.
- source_word: וְעִמּוֹ
  choice: il avait avec lui
  rationale: Cette tournure française idiomatique introduit les troupes rattachées à Amasia sans ajouter de rapport hiérarchique absent de l’expression.
- source_word: מָאתַיִם אֶלֶף
  choice: deux cent mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: גִּבּוֹר חָיִל
  choice: vaillants guerriers
  rationale: Dans ce contexte militaire, l’expression désigne des combattants forts, capables et courageux. « Vaillants guerriers » restitue les deux composantes sans archaïsme excessif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre plutôt que de le remplacer par un titre.
- issue: Portée de la consécration volontaire d’Amasia
  choice: qui s’était offert volontairement à Yahweh
  alternative: qui s’était porté volontaire pour Yahweh
  rationale: Le hitpael de נדב peut évoquer soit l’offrande volontaire de soi, soit le fait de se porter volontaire au service de Yahweh. Le texte principal retient la nuance réflexive de consécration, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le caractère de liste militaire du contexte, tandis que « vaillants guerriers » évite à la fois le calque archaïque et l’aplatissement du registre héroïque.
