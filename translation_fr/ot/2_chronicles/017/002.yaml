source:
  edition: WLC
  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: fr
  text: Il stationna des troupes dans toutes les villes fortifiées de Juda et établit des garnisons[a] dans le pays de Juda ainsi que dans les villes d’Éphraïm qu’Asa, son père, avait conquises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gouverneurs », « des représentants » ou « des préfets ». Le terme hébreu נְצִיבִים peut désigner des responsables nommés aussi bien que des postes militaires; le contexte favorise ici « des garnisons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: Il stationna des troupes
  rationale: Le verbe נתן signifie littéralement « mettre » ou « placer », tandis que חַיִל désigne ici une force militaire. Dans le contexte des villes fortifiées, « stationner des troupes » exprime naturellement et précisément l’affectation de soldats à ces lieux.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: dans toutes les villes fortifiées de Juda
  rationale: Cette formulation conserve la portée de כָּל et rend הַבְּצֻרוֹת par le terme français courant et précis « fortifiées ».
- source_word: וַיִּתֵּן נְצִיבִים
  choice: établit des garnisons[a]
  rationale: נְצִיבִים peut désigner des représentants ou responsables nommés, mais aussi des postes ou garnisons. Le contexte militaire immédiat favorise « garnisons »; la note préserve l’autre interprétation possible.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: « Pays » rend ici le territoire de Juda, plus vaste que les seules villes déjà mentionnées.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: ainsi que dans les villes d’Éphraïm
  rationale: La formulation restitue clairement l’ajout d’un second ensemble géographique tout en conservant la désignation tribale.
- source_word: אֲשֶׁר לָכַד
  choice: qu’… avait conquises
  rationale: לכד désigne couramment la prise militaire de villes. Le plus-que-parfait situe naturellement cette conquête antérieure à l’action de Josaphat.
- source_word: אָסָא אָבִיו
  choice: Asa, son père
  rationale: L’apposition française identifie clairement Asa comme le père de Josaphat sans ajouter d’interprétation.
