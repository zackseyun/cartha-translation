reference: 2 Chronicles 17:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: fr
  text: Mais[a] il rechercha le Dieu de son père, marcha selon ses commandements et non selon les pratiques d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Car il rechercha le Dieu de son père ». La conjonction hébraïque peut aussi signifier « car » ou « parce que » ; « mais » met en relief le contraste avec le verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Ici, « Israël » désigne probablement le royaume du Nord, par contraste avec Juda.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: Dans le contexte, la proposition oppose la conduite de Josaphat à celle évoquée au verset précédent. « Mais » exprime naturellement ce contraste en français, tout en signalant en note les valeurs causales possibles de la conjonction.
- source_word: לֵאלֹהֵי אָבִיו
  choice: le Dieu de son père
  rationale: Avec דָּרַשׁ, la préposition לְ introduit l’objet de la recherche. Le français n’exige pas de préposition ici, et le singulier « son père » respecte אָבִיו.
- source_word: דָּרָשׁ
  choice: rechercha
  rationale: Dans ce contexte, le verbe désigne le fait de se tourner vers Dieu et de le rechercher avec fidélité, non une simple demande de renseignements. « Rechercher » conserve cette portée religieuse sans l’expliciter excessivement.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: marcha selon ses commandements
  rationale: Cette formulation garde la métaphore hébraïque de la marche comme manière de vivre. « Selon » rend idiomatiquement en français la norme exprimée par בְּ.
- source_word: וְלֹא כְּמַעֲשֵׂה
  choice: et non selon les pratiques de
  rationale: « Et non » suit la coordination négative, tandis que « pratiques » rend ici מַעֲשֶׂה comme conduite habituelle plutôt que comme œuvre isolée.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu dit simplement « Israël ». La traduction conserve cette désignation sans intégrer au corps du texte l’interprétation contextuelle probable du royaume du Nord.
theological_decisions:
- issue: Référent d’« Israël »
  choice: Conserver « Israël » dans le texte principal.
  alternative: « le royaume d’Israël » ou « le royaume du Nord »
  rationale: Dans les Chroniques, « Israël » peut ici viser le royaume du Nord par opposition à Juda, mais le texte ne le précise pas. Une note fournit le contexte probable sans supprimer l’ambiguïté de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « marcher selon des commandements » est conservée parce qu’elle reste compréhensible et porte l’idée d’une manière de vivre. Les marqueurs de notes sont placés immédiatement après les éléments qu’ils expliquent.
