  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: fr
  text: Josaphat, son d’Asa, devint roi à sa place et se fortifia contre Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Rend naturellement en français l’accession au trône exprimée par le verbe hébreu dans ce contexte narratif.
- source_word: בְּנוֹ
  choice: son d’Asa
  rationale: Le possessif renvoie à Asa, nommé dans le contexte précédent; expliciter l’antécédent évite une ambiguïté artificielle en français.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Reproduit directement l’idée de succession.
- source_word: וַיִּתְחַזֵּק
  choice: affermit sa position
  rationale: Le hitpael exprime ici le fait de se rendre fort ou de consolider son pouvoir; cette formulation française est naturelle sans préciser indûment les moyens employés.
- source_word: עַל יִשְׂרָאֵל
  choice: face à Israël
  rationale: Dans ce contexte de consolidation défensive contre le royaume du Nord, עַל a une valeur hostile; «face à» préserve cette opposition sans suraccentuer une attaque active.
theological_decisions:
- issue: Sens de עַל devant «Israël»
  choice: face à Israël
  alternative: contre Israël
  rationale: Les deux lectures expriment l’opposition. «Face à» conserve la tension du texte et convient à la consolidation militaire décrite immédiatement après, sans faire de Josaphat l’initiateur explicite d’une offensive.
translation_notes:
  register: Français international moderne, narratif et digne. Le nom traditionnel français «Josaphat» est retenu. Aucun marqueur de note n’est requis.
