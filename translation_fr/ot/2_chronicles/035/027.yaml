  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: fr
  text: Ses actes[a], des premiers aux derniers, les voici consignés dans le Livre des rois d’Israël et de Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses paroles », « ses affaires » ou « ses actions » ; le terme hébreu peut avoir chacun de ces sens. Ici, « actes » convient à la formule récapitulative d’un règne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur le livre des rois d’Israël et de Juda » ; « dans » est plus naturel en français pour indiquer qu’un fait est consigné dans un document. Le mot traduit par « Livre » peut aussi désigner un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: Ses actes
  rationale: דָּבָר peut désigner des paroles, des faits, des affaires ou des actes. Dans cette formule récapitulative royale, « actes » exprime naturellement les faits du règne qui ont été consignés.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: des premiers aux derniers
  rationale: Cette tournure rend l’idée de l’ensemble des actes, du début à la fin, dans un français naturel tout en conservant la formule de Chroniques.
- source_word: הִנָּם כְּתוּבִים
  choice: les voici consignés
  rationale: « Les voici » restitue la valeur présentative et emphatique de הִנָּם; « consignés » rend idiomatiquement le participe passif כְּתוּבִים dans le contexte d’archives écrites.
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: La préposition עַל signifie littéralement « sur », mais le français emploie naturellement « dans » lorsqu’il s’agit d’un document où des faits sont enregistrés. « Livre » est la désignation conventionnelle du document cité.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: des rois d’Israël et de Juda
  rationale: La formulation française traite l’expression comme le titre du document source mentionné par le Chroniste, sans ajouter une seconde préposition absente de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « les voici consignés » conserve l’emphase de l’hébreu sans recourir à l’archaïsme « voici, ils sont écrits ». La majuscule à « Livre » signale un titre documentaire.
