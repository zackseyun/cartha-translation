  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: fr
  text: Ainsi, tout le service de Yahweh fut préparé ce jour-là, afin de célébrer la Pâque et d’offrir des holocaustes sur l’autel de Yahweh, conformément à l’ordre du roi Josias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: fut organisé
  rationale: Le niphal de כון exprime ici la mise en ordre et la préparation effective de l’ensemble du service cultuel. « Fut organisé » rend naturellement en français cette nuance passive et résultative.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: tout le service de Yahweh
  rationale: Dans ce contexte cultuel, עֲבוֹדָה désigne le service lié au culte et au sanctuaire. « Service » conserve cette portée sans le réduire au seul travail des prêtres.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette formulation française courante restitue avec précision l’expression temporelle et sa valeur démonstrative.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: afin de célébrer la Pâque
  rationale: Littéralement « faire la Pâque », l’expression hébraïque signifie accomplir ou observer la célébration pascale. « Célébrer » est ici clair, naturel et fidèle à son sens rituel.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: et d’offrir des holocaustes
  rationale: Le hiphil de עלה associé à עֹלוֹת est la tournure sacrificielle usuelle pour offrir des sacrifices entièrement consumés. « Holocaustes » est le terme français biblique précis et courant dans ce contexte.
- source_word: עַל מִזְבַּח יְהוָה
  choice: sur l’autel de Yahweh
  rationale: La préposition indique directement le lieu où les holocaustes sont offerts; la formulation française est simple et exacte.
- source_word: כְּמִצְוַת
  choice: conformément à l’ordre
  rationale: מִצְוָה désigne ici la directive particulière donnée par le roi. « Ordre » convient mieux que « commandement », qui pourrait suggérer dans ce contexte une prescription divine générale.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: du roi Josias
  rationale: L’ordre français naturel place le titre devant le nom, tout en conservant exactement l’identité du donneur d’ordre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel du Dieu d’Israël sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure logique du texte hébreu tout en employant des tournures naturelles; le vocabulaire cultuel « service », « Pâque », « holocaustes » et « autel » reste précis sans devenir inutilement technique.
