id: 2CH.35.22
reference: 2 Chronicles 35:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: fr
  text: Mais Josias ne se détourna pas de lui[a] ; au contraire, il se déguisa pour combattre contre lui. Il n’écouta pas les paroles de Néko, qui venaient de la bouche de Dieu[b], et il vint combattre dans la vallée de Meguiddo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne détourna pas son visage loin de lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la bouche de Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans la plaine de Meguiddo ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: ne se détourna pas de lui
  rationale: Cette tournure française rend naturellement l’idée de ne pas tourner son visage loin de quelqu’un, sans imposer une expression littérale moins idiomatique.
- source_word: כִּי
  choice: au contraire
  rationale: 'Dans ce contexte, la particule oppose ce que Josias fit au fait de se détourner : il se déguisa pour combattre.'
- source_word: לְהִלָּחֵם בּוֹ
  choice: pour combattre contre lui
  rationale: L’infinitif exprime le but, et la préposition marque ici l’opposition militaire à Néko.
- source_word: הִתְחַפֵּשׂ
  choice: il se déguisa
  rationale: Le hitpael exprime directement l’action réflexive de se déguiser.
- source_word: שָׁמַע אֶל
  choice: il n’écouta pas
  rationale: « Écouter » conserve l’étendue du verbe, qui peut aussi impliquer le fait de tenir compte ou d’obéir.
- source_word: דִּבְרֵי נְכוֹ
  choice: les paroles de Néko
  rationale: Rendu proche du texte, sans transformer les « paroles » en un message plus explicitement défini.
- source_word: מִפִּי אֱלֹהִים
  choice: qui venaient de la bouche de Dieu
  rationale: La relative clarifie en français que ces paroles ont Dieu pour source, tout en préservant l’image hébraïque de la bouche de Dieu.
- source_word: וַיָּבֹא
  choice: il vint
  rationale: Rendu direct du verbe בוא dans la progression narrative.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: dans la vallée de Meguiddo
  rationale: בִּקְעָה désigne une large vallée ou une plaine encaissée ; « vallée » est clair et géographiquement naturel.
theological_decisions:
- issue: Les paroles de Néko sont-elles présentées comme venant réellement de Dieu ?
  choice: Le texte principal affirme qu’elles venaient « de la bouche de Dieu ».
  alternative: On pourrait rendre plus simplement « qui venaient de Dieu » ; certains lecteurs peuvent aussi mettre en doute la prétention de Néko.
  rationale: Le narrateur présente ces paroles comme ayant une origine divine. La traduction conserve cette affirmation et la tension théologique du passage sans la minimiser ni la commenter.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule met en relief l’opposition narrative. L’image théologique « de la bouche de Dieu » est maintenue, tandis qu’une relative évite en français de rattacher maladroitement ce complément à l’action d’écouter.
