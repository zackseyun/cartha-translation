  text: וַ/יַּֽעֲבִירֻ֨/הוּ עֲבָדָ֜י/ו מִן הַ/מֶּרְכָּבָ֗ה וַֽ/יַּרְכִּיבֻ/הוּ֮ עַ֣ל רֶ֣כֶב הַ/מִּשְׁנֶה֮ אֲשֶׁר ל/וֹ֒ וַ/יּוֹלִיכֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קִבְר֣וֹת אֲבֹתָ֑י/ו וְ/כָל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִֽתְאַבְּלִ֖ים עַל יֹאשִׁיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: fr
  text: Ses serviteurs le retirèrent du char et le placèrent sur le second char qui lui appartenait[a], puis ils l’emmenèrent à Jérusalem. Il mourut et fut enseveli dans les tombeaux de ses ancêtres. Tout Juda et Jérusalem étaient en deuil pour Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le char du second ». Il s’agit probablement d’un char secondaire ou de réserve appartenant à Josias.'
    reason: La construction hébraïque רֶכֶב הַמִּשְׁנֶה est inhabituelle et laisse implicite le nom qualifié par « second »; la note préserve cette particularité sans fixer indûment son sens précis.
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: le retirèrent
  rationale: Le hiphil de עבר exprime ici le transfert de Josias hors du char; « retirèrent » est naturel et précis dans ce contexte.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד peut désigner des serviteurs, des officiers ou des gens de la suite; « serviteurs » conserve la portée générale du terme sans préciser indûment leur rang.
- source_word: הַמֶּרְכָּבָה
  choice: du char
  rationale: Le nom désigne le char déjà identifié par le contexte immédiat.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: le placèrent sur
  rationale: Le hiphil de רכב signifie faire monter ou faire chevaucher; puisque Josias est blessé, « placèrent sur » rend clairement l’aide physique qui lui est apportée.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: le second char
  rationale: Cette traduction reste proche de la formulation hébraïque, littéralement « le char du second », sans imposer dans le texte l’interprétation probable de char de réserve.
- source_word: אֲשֶׁר לוֹ
  choice: qui lui appartenait
  rationale: La proposition relative indique que ce second char était à Josias.
- source_word: וַיּוֹלִיכֻהוּ
  choice: ils l’emmenèrent
  rationale: Le hiphil de הלך exprime ici le transport de Josias vers Jérusalem; « emmener » convient au déplacement depuis le champ de bataille vers cette destination.
- source_word: וַיָּמָת
  choice: Il mourut
  rationale: Traduction directe du verbe מות dans la chaîne narrative.
- source_word: וַיִּקָּבֵר
  choice: fut enseveli
  rationale: Le niphal de קבר a un sens passif; « fut enseveli » convient au registre narratif et funéraire.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: dans les tombeaux de ses ancêtres
  rationale: « Ancêtres » rend ici naturellement אבות et évite que le français moderne comprenne seulement les pères immédiats, tout en conservant le sens familial et dynastique.
- source_word: וְכָל יְהוּדָה וִירוּשָׁלִַם
  choice: Tout Juda et Jérusalem
  rationale: La formulation conserve la personnification du royaume et de la capitale comme communautés en deuil.
- source_word: מִתְאַבְּלִים
  choice: prirent le deuil
  rationale: Le participe hitpael exprime l’état ou la pratique du deuil; cette tournure française est naturelle dans le récit et plus précise que la seule expression d’une tristesse.
