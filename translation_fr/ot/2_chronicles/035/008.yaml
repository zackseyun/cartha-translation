source:
  edition: WLC
  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: fr
  text: Ses hauts fonctionnaires apportèrent aussi une contribution volontaire en faveur du peuple, des prêtres et des lévites. Hilqiya, Zacharie et Yehiel, responsables du temple de Dieu, donnèrent aux prêtres 2 600 animaux pour les sacrifices de la Pâque[a], ainsi que 300 bovins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le pluriel de « Pâque »; il désigne probablement les animaux destinés aux sacrifices de la Pâque.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: Ses hauts fonctionnaires
  rationale: שָׂרִים désigne ici des personnages investis d’une autorité officielle. « Hauts fonctionnaires » exprime leur rang administratif sans la connotation dynastique que pourrait avoir « princes ».
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: apportèrent aussi une contribution volontaire
  rationale: Le nom נְדָבָה désigne un don librement consenti, tandis que le hiphil de רום exprime ici l’action de fournir cette contribution. La formulation française conserve à la fois le caractère concret et volontaire du don.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: en faveur du peuple, des prêtres et des lévites
  rationale: Les prépositions ל indiquent les bénéficiaires de la contribution. « En faveur de » convient naturellement aux trois groupes.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Hilqiya, Zacharie et Yehiel
  rationale: Les noms sont rendus selon des formes françaises lisibles, avec translittération pour Hilqiya et Yehiel et la forme française bien établie Zacharie.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: responsables du temple de Dieu
  rationale: נְגִידֵי évoque des dirigeants ou responsables. Dans ce contexte cultuel, בֵּית הָאֱלֹהִים désigne le temple; cette formulation est claire en français moderne.
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2 600 animaux pour les sacrifices de la Pâque
  rationale: Le pluriel פְּסָחִים désigne vraisemblablement les victimes destinées aux sacrifices pascals. « Animaux » explicite ce que compte le nombre sans préciser indûment leur espèce.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: ainsi que 300 bovins
  rationale: בָּקָר est un collectif désignant le gros bétail. « Bovins » est précis, naturel et n’impose pas le sens plus étroit de « bœufs ».
theological_decisions:
- issue: Sens cultuel du pluriel לַפְּסָחִים
  choice: animaux pour les sacrifices de la Pâque
  alternative: offrandes de la Pâque
  rationale: Le contexte oppose ces 2 600 unités aux 300 bovins et indique qu’il s’agit d’animaux sacrificiels. La traduction évite toutefois d’identifier leur espèce, que ce verset ne nomme pas.
translation_notes:
  register: Français international actuel, digne et accessible. « Temple de Dieu » explicite l’expression idiomatique « maison de Dieu ». Les nombres sont écrits en chiffres pour faciliter la lecture, et le connecteur « ainsi que » distingue clairement les 300 bovins des 2 600 autres animaux.
