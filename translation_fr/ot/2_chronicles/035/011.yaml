    rationale: Le verbe וַיִּזְרְקוּ est coordonné à « ils immolèrent » sous forme narrative accomplie. « Projetèrent » est requis ; seul le participe מַפְשִׁיטִים justifie l’imparfait de simultanéité.
  - severity: medium
