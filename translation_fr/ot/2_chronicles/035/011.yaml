  verdict: revise
  source_fidelity: 'Le sens cultuel est bien compris : le פֶּסַח désigne ici les victimes pascales, les prêtres accomplissent le geste rituel concernant le sang, et les lévites enlèvent les peaux. Toutefois, וַיִּזְרְקוּ est un wayyiqtol narratif et appelle en français un passé simple, non l’imparfait « projetaient ». La relation exacte exprimée par מִיָּדָם reste syntaxiquement et référentiellement délicate ; « qu’on leur remettait » est une explicitation acceptable, à condition que la note ne la présente pas comme la formulation littérale.'
  naturalness: « Victimes pascales » est plus idiomatique et plus précis dans un registre biblique français actuel que « animaux de la Pâque ». « Dépouillaient les animaux » est naturel dans ce contexte, et l’imparfait rend convenablement le participe hébreu d’action concomitante.
  terminology: « Immolèrent » convient au contexte sacrificiel sans surinterprétation. « Aspergeaient » est le terme rituel français le plus naturel pour זרק dans ce contexte ; une note conserve l’idée concrète de projection ou de jet du sang. Les notes sont réordonnées afin que chaque ancre corresponde au segment commenté.
