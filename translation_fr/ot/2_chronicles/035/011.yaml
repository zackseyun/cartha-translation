    rationale: 'La note actuelle affirme : « les prêtres projetaient [le sang] de leur main », alors que le suffixe pluriel de מִיָּדָם signifie « de leurs mains » et que l’identification de ce pluriel n’est pas explicitement résolue par le verset. La note doit signaler cette ambiguïté sans attribuer les mains aux prêtres.'
  - severity: low
