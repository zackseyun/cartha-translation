base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: fr
  text: Ils immolèrent les victimes pascales[a], et les prêtres aspergèrent le sang qu’on leur remettait[b], tandis que les lévites dépouillaient les animaux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sacrifice de la Pâque ». L’hébreu désigne ici collectivement les victimes pascales que l’on immolait.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, les prêtres « jetaient/aspergeaient de leurs mains » ; le sang est implicite. L’expression « de leurs mains » renvoie vraisemblablement à ceux qui avaient immolé les victimes, sans que le verset les identifie explicitement. Le verbe désigne l’application rituelle du sang et peut aussi être traduit par « projeter ».
    reason: textual_clarity
  - marker: c
    text: C’est-à-dire qu’ils retiraient la peau des animaux immolés.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Ils égorgèrent
  rationale: שׁחט désigne l’abattage d’animaux, particulièrement dans un cadre sacrificiel. « Égorgèrent » exprime naturellement en français le geste rituel sans employer le terme plus général « tuèrent ».
- source_word: הַפָּסַח
  choice: les animaux de la Pâque
  rationale: Dans ce contexte, פֶּסַח désigne collectivement les victimes destinées au repas sacrificiel de la Pâque. « Les animaux de la Pâque » évite de limiter indûment le référent aux seuls agneaux.
- source_word: וַיִּזְרְקוּ
  choice: projetaient le sang
  rationale: Dans le rituel sacrificiel, זרק désigne l’application du sang en le lançant ou en le projetant. « Projetaient » rend mieux ce geste que « répandaient », tandis qu’une note signale le traditionnel « aspergeaient ».
- source_word: הַכֹּהֲנִים
  choice: Les prêtres
  rationale: Équivalent courant de כֹּהֲנִים dans le contexte du service du sanctuaire.
- source_word: מִיָּדָם
  choice: qu’on leur remettait
  rationale: Littéralement « de leur main ». Dans la scène, le sang passe de la main de ceux qui égorgent les victimes à celle des prêtres. La tournure impersonnelle est naturelle et ne précise pas dans le corps du texte un antécédent que l’hébreu ne nomme pas ici.
- source_word: וְהַלְוִיִּם מַפְשִׁיטִים
  choice: tandis que les lévites dépouillaient les animaux
  rationale: Le participe exprime une action concomitante. Dans ce contexte, פשט signifie retirer la peau des victimes; « dépouillaient les animaux » est idiomatique, précis et digne.
theological_decisions:
- issue: Nature du référent de הַפָּסַח
  choice: les animaux de la Pâque
  alternative: l’agneau pascal / le sacrifice de la Pâque
  rationale: Le nom peut désigner la victime pascale de manière collective. Le contexte de 2 Chroniques inclut plusieurs animaux; la traduction retenue conserve cette portée sans imposer une espèce unique.
- issue: Identification de ceux dont les prêtres recevaient le sang
  choice: qu’on leur remettait
  alternative: que les lévites leur remettaient
  rationale: Le suffixe pluriel de מִיָּדָם renvoie à ceux qui accomplissent l’action précédente, mais leur identité n’est pas explicitée dans ce verset. La formulation impersonnelle préserve cette légère ambiguïté au lieu de la résoudre dans le texte principal.
translation_notes:
  register: Français international actuel, clair et soutenu sans archaïsmes. Le rythme en deux phrases évite une longue coordination, et l’imparfait rend les deux actions de service concomitantes décrites après l’égorgement. Tous les marqueurs de notes figurent dans le texte.
