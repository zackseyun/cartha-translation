base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: fr
  text: Jérémie prononça une lamentation sur Josias. Et jusqu’à ce jour, tous les chanteurs et toutes les chanteuses évoquent Josias dans leurs chants funèbres. Ils établirent ces lamentations comme une pratique en Israël ; et les voici consignées dans les Lamentations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les chants funèbres », si l’expression désigne des lamentations en général plutôt qu’un recueil particulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: prononça un chant funèbre
  rationale: Le verbe קונן désigne l’action de faire entendre une lamentation, notamment pour un mort. Cette formulation conserve l’acte de lamentation sans préciser si Jérémie en fut le compositeur.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: sur Josias
  rationale: Avec un chant funèbre, « sur Josias » exprime naturellement en français la personne qui fait l’objet de la lamentation.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: tous les chanteurs et toutes les chanteuses
  rationale: Les deux participes de שׁיר désignent explicitement les chanteurs de sexe masculin et féminin; la traduction préserve cette distinction.
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: jusqu’à ce jour ... évoquent
  rationale: Le présent français rend la pratique encore en vigueur au moment du narrateur, signalée par « jusqu’à ce jour »; « évoquent » convient au contexte de chants consacrés à Josias.
- source_word: בְּקִינוֹתֵיהֶם
  choice: dans leurs chants funèbres
  rationale: קִינוֹת désigne ici des lamentations rituelles ou des complaintes funèbres; « chants funèbres » est précis et compréhensible en français moderne.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Ils en firent une règle établie en Israël
  rationale: חֹק peut désigner une règle, une prescription ou une coutume fixée. La tournure française indique que ces chants devinrent une pratique établie en Israël sans lui donner nécessairement le sens d’une loi civile.
- source_word: וְהִנָּם
  choice: Les voici
  rationale: Cette tournure restitue de manière naturelle la valeur déictique de הִנֵּה, qui attire l’attention sur l’existence du document écrit.
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: écrits dans le recueil des Lamentations
  rationale: La traduction principale comprend l’expression comme la désignation d’un recueil connu de chants funèbres. La possibilité d’un sens générique est conservée en note.
theological_decisions:
- issue: Identification de הַקִּינוֹת
  choice: un recueil intitulé ou désigné « les Lamentations »
  alternative: les chants funèbres en général
  rationale: L’article défini peut renvoyer à une collection connue, mais l’hébreu ne permet pas de l’identifier avec certitude ni de conclure qu’il s’agit du livre biblique des Lamentations. La note préserve donc la lecture générique.
translation_notes:
  register: Français international moderne, digne et narratif. « Chant funèbre » est préféré à « complainte », plus littéraire ou vieilli. La répétition de « chants funèbres » rend clairement le lien lexical avec le recueil final; la majuscule de « Lamentations » signale un titre possible sans identifier ce recueil au livre canonique portant aujourd’hui ce nom.
