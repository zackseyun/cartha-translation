    reason: alternative_reading
  revision_rationale: La révision explicite que les éléments établis comme pratique et consignés sont les lamentations, corrigeant ainsi l’ambiguïté référentielle de la dernière phrase. Elle maintient le présent duratif avec « jusqu’à ce jour », la distinction entre chanteurs et chanteuses, ainsi que l’incertitude sur la nature précise des « Lamentations » au moyen de la note.
