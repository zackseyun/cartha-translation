revisions:
- from: Jérémie prononça un chant funèbre sur Josias. Et jusqu’à ce jour, tous les chanteurs et toutes les chanteuses évoquent Josias dans leurs chants funèbres. Ils en firent une règle établie en Israël. Les voici écrits dans le recueil des Lamentations[a].
  to: Jérémie prononça une lamentation sur Josias. Et jusqu’à ce jour, tous les chanteurs et toutes les chanteuses évoquent Josias dans leurs chants funèbres. Ils établirent ces lamentations comme une pratique en Israël ; et les voici consignées dans les Lamentations[a].
  rationale: La révision explicite que les éléments établis comme pratique et consignés sont les lamentations, corrigeant ainsi l’ambiguïté référentielle de la dernière phrase. Elle maintient le présent duratif avec « jusqu’à ce jour », la distinction entre chanteurs et chanteuses, ainsi que l’incertitude sur la nature précise des « Lamentations » au moyen de la note.
