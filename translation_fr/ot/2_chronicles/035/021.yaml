source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: fr
  text: 'Mais il lui envoya des messagers pour lui dire : « Qu’ai-je à faire avec toi, roi de Juda ? Ce n’est pas contre toi que je marche aujourd’hui, mais contre la maison avec laquelle je suis en guerre[a]. Dieu m’a dit de me hâter. Cesse de t’opposer à Dieu, qui est avec moi, de peur qu’il ne te détruise. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre le lieu où je dois combattre », ou « contre la maison, c’est-à-dire le royaume, avec laquelle je suis en guerre ». L’expression hébraïque est difficile.
    reason: Alternative lexicale rendue nécessaire par l’ambiguïté de בֵּית מִלְחַמְתִּי.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte narratif, le terme désigne des représentants humains envoyés par Néko, et non des êtres célestes.
- source_word: מַה לִּי וָלָךְ
  choice: Qu’ai-je à faire avec toi ?
  rationale: Cette tournure française actuelle rend l’idiome hébreu de désengagement sans lui donner artificiellement le sens d’une hostilité personnelle.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Ce n’est pas contre toi que je marche aujourd’hui
  rationale: L’hébreu est elliptique. Le verbe « marcher » explicite naturellement le déplacement militaire de Néko sans changer la cible ni la portée temporelle de sa déclaration.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: contre la maison avec laquelle je suis en guerre
  rationale: L’expression hébraïque est difficile. « Maison » conserve son image, tandis que la formulation française indique le rapport hostile suggéré par le contexte; les autres interprétations plausibles figurent en note.
- source_word: וֵאלֹהִים
  choice: Dieu
  rationale: Le verbe singulier אָמַר favorise un référent singulier; le contexte narratif du verset suivant présente en outre ces paroles comme venant de Dieu.
- source_word: לְבַהֲלֵנִי
  choice: de me hâter
  rationale: Le verbe exprime ici une mise en mouvement urgente. « Me hâter » est concis, digne et naturel dans ce discours royal.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Cesse de t’opposer à Dieu
  rationale: L’idiome appelle Josias à ne plus entraver ni contrarier l’action de Dieu; cette formulation en communique clairement la force.
- source_word: אֲשֶׁר עִמִּי
  choice: qui est avec moi
  rationale: La traduction littérale préserve l’affirmation de Néko sans préciser indûment la nature du soutien divin.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: de peur qu’il ne te détruise
  rationale: Après l’impératif d’avertissement, la proposition exprime le danger à éviter. Cette tournure française conserve la gravité et la relation logique de l’hébreu.
theological_decisions:
- issue: Référence de אֱלֹהִים dans les paroles de Néko
  choice: Dieu, au singulier et avec majuscule
  alternative: « un dieu » ou « les dieux », pour refléter soit la perspective païenne possible de Néko, soit la forme morphologiquement plurielle
  rationale: Le verbe singulier אָמַר impose pratiquement un sens singulier. En 35.22, le narrateur qualifie les paroles de Néko de paroles venues de la bouche de Dieu; « Dieu » respecte donc la présentation du Chroniste sans ajouter de précision confessionnelle.
- issue: Sens de בֵּית מִלְחַמְתִּי
  choice: Conserver l’image de la « maison » dans le texte principal
  alternative: « le lieu où je dois combattre » ou « le royaume contre lequel je suis en guerre »
  rationale: L’expression est inhabituelle et son référent exact demeure incertain. Le texte principal garde l’image source, tandis que la note signale les principales lectures possibles sans trancher abusivement.
- issue: Portée de אֲשֶׁר עִמִּי
  choice: « qui est avec moi »
  alternative: « qui est de mon côté » ou « qui m’accompagne dans cette affaire »
  rationale: 'La formulation retenue préserve la tension théologique du récit: elle rapporte l’affirmation de présence divine sans la transformer en approbation générale de Néko.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement correspond au discours direct entre souverains et aux formes hébraïques singulières. « Se hâter » et « de peur que » donnent une dignité narrative sans archaïsme excessif; l’image opaque de la « maison » est volontairement conservée et expliquée en note.
