  text: ו/כונניהו וּ/שְׁמַֽעְיָ֨הוּ וּ/נְתַנְאֵ֜ל אֶחָ֗י/ו וַ/חֲשַׁבְיָ֧הוּ וִ/יעִיאֵ֛ל וְ/יוֹזָבָ֖ד שָׂרֵ֣י הַ/לְוִיִּ֑ם הֵרִ֨ימוּ לַ/לְוִיִּ֤ם לַ/פְּסָחִים֙ חֲמֵ֣שֶׁת אֲלָפִ֔ים וּ/בָקָ֖ר חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: fr
  text: Konania, Shemaya et Netanel, ses frères, ainsi que Hashabya, Yeïel et Yozabad, chefs des lévites, fournirent aux lévites, pour les sacrifices de la Pâque, cinq mille moutons et chèvres[a], et cinq cents bovins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu ne précise pas ici l’espèce des cinq mille premiers animaux. Le contexte des versets 7 et 8 indique qu’il s’agit de moutons et de chèvres destinés aux sacrifices de la Pâque.
    reason: Clarification d’une ellipse du texte hébreu et justification contextuelle de son explicitation en français.
lexical_decisions:
- source_word: כונניהו
  choice: Konania
  rationale: Transcription française moderne du nom hébreu, avec la forme usuelle en -ia pour l’élément théophore final.
- source_word: שְׁמַעְיָהוּ
  choice: Shemaya
  rationale: Transcription française lisible et proche de la forme hébraïque.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Transcription directe de l’hébreu, distinguée de la forme néotestamentaire Nathanaël.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Conserve le terme familial masculin du texte hébreu; il peut contextuellement désigner des proches parents, sans qu’il soit nécessaire de l’élargir dans le corps du texte.
- source_word: חֲשַׁבְיָהוּ
  choice: Hashabya
  rationale: Transcription française moderne du nom hébreu.
- source_word: יעיאל
  choice: Yeïel
  rationale: Transcription permettant de faire entendre les voyelles séparément et de représenter l’initiale hébraïque.
- source_word: יוֹזָבָד
  choice: Yozabad
  rationale: Transcription proche de l’hébreu et naturelle en français.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: chefs des lévites
  rationale: Rend la fonction officielle de direction sans l’archaïsme ni les connotations monarchiques de « princes ».
- source_word: הֵרִימוּ
  choice: fournirent
  rationale: Dans ce contexte de dons matériels destinés à la célébration, le hiphil de רום désigne une contribution; « fournirent » exprime naturellement la mise à disposition des animaux.
- source_word: לַלְוִיִּם
  choice: aux lévites
  rationale: Le préfixe ל marque ici les bénéficiaires de la contribution.
- source_word: לַפְּסָחִים
  choice: pour les sacrifices de la Pâque
  rationale: Le pluriel hébreu désigne vraisemblablement les victimes ou sacrifices pascals, plutôt que plusieurs fêtes; cette formulation conserve la portée cultuelle sans la limiter aux seuls agneaux.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: cinq mille moutons et chèvres, et cinq cents bovins
  rationale: Le nom explicite des cinq mille animaux est sous-entendu par le contexte parallèle immédiat de 2 Ch 35.7-8; « moutons et chèvres » restitue l’ellipse nécessaire en français, tandis que בָּקָר est rendu par « bovins ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. Les noms propres sont transcrits de façon cohérente à partir de l’hébreu. La coordination, allégée par « ainsi que », reste fidèle à l’énumération. L’ellipse concernant les cinq mille animaux est explicitée d’après le contexte immédiat et signalée en note.
