  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: fr
  text: Les chanteurs, fils d’Asaph, étaient à leur poste, conformément au commandement de David, d’Asaph, d’Héman et de Yedoutoun, le voyant du roi[a]. Les portiers étaient à chaque porte. Ils n’avaient pas besoin de quitter leur service[b], car leurs frères, les Lévites, préparaient pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le voyant du roi » se rapporte le plus naturellement à Yedoutoun.
    reason: précision_syntaxique
  - marker: b
    text: 'Autre traduction possible : « Ils ne devaient pas quitter leur service. » L’hébreu peut recevoir ce sens plus fort, mais la suite favorise l’idée qu’ils n’avaient pas besoin de partir, puisque les Lévites préparaient pour eux.'
    reason: lecture_alternative
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: les chanteurs
  rationale: Le participe substantivé de שׁיר désigne ceux qui chantent. « Chanteurs » est précis dans ce contexte de service au temple, tandis que « musiciens » serait plus large.
- source_word: בְּנֵי אָסָף
  choice: fils d’Asaph
  rationale: L’expression signifie formellement « fils d’Asaph » et désigne ici sa lignée ou la corporation qui lui est associée. La formulation traditionnelle reste claire en français.
- source_word: עַל מַעֲמָדָם
  choice: étaient à leur poste
  rationale: מַעֲמָד désigne ici la place ou la fonction assignée. « À leur poste » rend naturellement l’organisation du service cultuel.
- source_word: כְּמִצְוַת
  choice: conformément au commandement de
  rationale: מִצְוָה exprime une directive faisant autorité. Cette formulation en conserve la force sans suggérer ici une ordonnance législative générale.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: le voyant du roi
  rationale: חוֹזֶה est un titre technique désignant un voyant. « Voyant » en préserve la nuance historique et se rattache le plus naturellement au nom singulier immédiatement précédent, Yedoutoun.
- source_word: הַשֹּׁעֲרִים
  choice: les portiers
  rationale: Dans le contexte du temple, שֹׁעֲרִים désigne les responsables affectés aux portes. « Portiers » est idiomatique et précis en français biblique moderne.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: à chaque porte
  rationale: La tournure distributive hébraïque indique une affectation porte par porte.
- source_word: אֵין לָהֶם לָסוּר
  choice: ils n’avaient pas besoin de quitter
  rationale: La construction אֵין + ל suivi de l’infinitif exprime ici l’absence de nécessité. La proposition causale suivante explique pourquoi ils n’avaient pas à s’éloigner de leur service.
- source_word: מֵעַל עֲבֹדָתָם
  choice: leur service
  rationale: עֲבֹדָה désigne ici le service cultuel ou la tâche assignée, plutôt qu’un simple travail générique.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: leurs frères, les Lévites
  rationale: La traduction conserve l’expression explicite « leurs frères », suivie de l’apposition « les Lévites ».
- source_word: הֵכִינוּ לָהֶם
  choice: préparaient ce qu’il leur fallait
  rationale: Le verbe הכין signifie « préparer, apprêter ». Comme l’objet reste implicite en hébreu, cette formulation française naturelle évite de préciser indûment ce qui était préparé.
theological_decisions:
- issue: Rattachement syntaxique de « le voyant du roi »
  choice: 'Le titre qualifie Yedoutoun : « Yedoutoun, le voyant du roi »'
  alternative: Le titre pourrait être compris plus largement en rapport avec la liste des personnages précédents.
  rationale: Le groupe nominal singulier חוֹזֵה הַמֶּלֶךְ se rattache le plus naturellement au nom propre singulier qui le précède immédiatement. Il s’agit d’une décision grammaticale et historique, non doctrinale.
- issue: Valeur de אֵין לָהֶם לָסוּר
  choice: 'La proposition exprime l’absence de nécessité : « ils n’avaient pas besoin de quitter »'
  alternative: 'On peut comprendre plus fortement : « ils ne devaient pas quitter leur service »'
  rationale: 'La construction peut exprimer l’absence d’occasion ou de nécessité, et la proposition suivante en donne la raison : les autres Lévites préparaient pour eux. Le texte principal retient donc la lecture contextuellement la plus probable tout en signalant l’autre possibilité.'
translation_notes:
  register: Français international moderne, naturel et digne. Les termes cultuels traditionnels mais intelligibles (« chanteurs », « portiers », « voyant », « service ») sont conservés. La syntaxe a été légèrement explicitée là où l’objet de « préparer » reste sous-entendu en hébreu, sans en préciser la nature.
