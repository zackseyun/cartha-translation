source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: fr
  text: Josias célébra à Jérusalem la Pâque en l’honneur de Yahweh, et ils immolèrent la victime pascale[a] le quatorzième jour du premier mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la Pâque » ; ici, le terme désigne la victime offerte pour la Pâque.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: célébra
  rationale: Avec « la Pâque » pour complément, le verbe « faire » signifie idiomatiquement célébrer ou observer cette fête. « Célébra » est naturel en français et conserve l’idée d’un accomplissement rituel.
- source_word: פֶּסַח
  choice: la Pâque
  rationale: Dans sa première occurrence, le nom désigne la célébration de la Pâque dans son ensemble; « la Pâque » est l’expression française consacrée.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition ל indique ici la destination ou la consécration du rite. « En l’honneur de » rend cette relation en français naturel sans réduire la Pâque à un simple acte fait au bénéfice de Dieu.
- source_word: בִירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Le préfixe ב a une valeur locative; devant un nom de ville, le français emploie naturellement « à ».
- source_word: וַיִּשְׁחֲטוּ
  choice: ils immolèrent
  rationale: Dans ce contexte sacrificiel, « immoler » exprime plus précisément שחט que le terme général « tuer », sans ajouter une interprétation étrangère au rite.
- source_word: הַפֶּסַח
  choice: la victime pascale
  rationale: Dans la seconde occurrence, « la Pâque » désigne par métonymie l’animal immolé. « La victime pascale » explicite le référent sans préciser indûment qu’il s’agissait nécessairement d’un agneau.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: le quatorzième jour
  rationale: La formulation française explicite naturellement « jour », sous-entendu dans l’expression calendaire hébraïque.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: du premier mois
  rationale: Cette expression précise le mois auquel appartient le quatorzième jour; « du premier mois » est la construction calendaire française naturelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Référent de la seconde occurrence de פֶּסַח
  choice: la victime pascale
  alternative: la Pâque
  rationale: Le verbe « immoler » montre que le nom désigne ici concrètement l’animal du sacrifice. Le rendu explicite la métonymie tout en évitant d’imposer « agneau », puisque l’animal pouvait aussi être pris parmi les chèvres.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase reste concise; « immolèrent » conserve la coloration cultuelle du passage, tandis que « victime pascale » rend intelligible la métonymie hébraïque.
