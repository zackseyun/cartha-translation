  text: וַ/יַּעֲשׂ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל הַֽ/נִּמְצְאִ֛ים אֶת הַ/פֶּ֖סַח בָּ/עֵ֣ת הַ/הִ֑יא וְ/אֶת חַ֥ג הַ/מַּצּ֖וֹת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: fr
  text: Les Israélites qui étaient présents célébrèrent la Pâque en ce temps-là, ainsi que la fête des Pains sans levain pendant sept jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: célébrèrent
  rationale: Avec une fête comme complément, le verbe « faire » signifie ici accomplir ou célébrer l’observance. « Célébrèrent » est naturel en français et convient à la Pâque comme à la fête mentionnée ensuite.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: Cette expression collective désigne le peuple d’Israël; « les Israélites » est la formulation moderne et idiomatique.
- source_word: הַנִּמְצְאִים
  choice: qui étaient présents
  rationale: Le participe désigne ici les personnes qui se trouvaient sur place, plutôt que des personnes littéralement « trouvées ».
- source_word: הַפֶּסַח
  choice: la Pâque
  rationale: Dans ce contexte, le terme désigne la célébration pascale dans son ensemble, et non uniquement l’animal sacrifié.
- source_word: בָּעֵת הַהִיא
  choice: à cette époque-là
  rationale: La locution est temporelle. Cette formulation rend le démonstratif sans ajouter l’idée d’un temps fixé, qui n’est pas explicite ici.
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: Il s’agit du nom reconnaissable de la fête; la majuscule à « Pains » marque l’appellation traditionnelle sans obscurcir le sens.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette tournure française exprime clairement la durée de la fête.
- source_word: וְאֶת
  choice: puis
  rationale: La coordination hébraïque relie deux observances successives. « Puis » rend naturellement leur enchaînement chronologique dans le contexte, sans en modifier le contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la distinction entre la Pâque et la fête des Pains sans levain ainsi que leur succession, tout en évitant un calque du verbe hébreu « faire ».
