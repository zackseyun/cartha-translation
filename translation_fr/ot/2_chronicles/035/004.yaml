source:
  edition: WLC
  text: וְ/הָכִ֥ונוּ לְ/בֵית אֲבוֹתֵי/כֶ֖ם כְּ/מַחְלְקוֹתֵי/כֶ֑ם בִּ/כְתָ֗ב דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וּ/בְ/מִכְתַּ֖ב שְׁלֹמֹ֥ה בְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: fr
  text: Préparez-vous par familles ancestrales[a], selon vos divisions[b], conformément à l’écrit de David, roi d’Israël, et à celui de son fils Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque désigne les familles ou groupes de parenté rattachés à un ancêtre paternel. Littéralement : « maisons des pères ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme peut aussi être traduit par « classes », notamment pour les groupes de service des prêtres ou des lévites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Préparez-vous
  rationale: L’impératif hiphil pluriel de כון appelle à se préparer et à se mettre en ordre. « Préparez-vous » reste proche de l’hébreu tout en convenant au contexte d’organisation cultuelle.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: par familles ancestrales
  rationale: בֵית אָבוֹת désigne les unités familiales issues d’un même ancêtre. « Familles ancestrales » exprime cette réalité sociale en français courant, tandis que « par » marque la répartition en groupes.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: selon vos divisions
  rationale: מַחְלְקוֹת désigne ici les groupes organisés ou classes de service. « Divisions » conserve la notion de répartition sans imposer un terme technique peu courant.
- source_word: בִּכְתָב דָּוִיד
  choice: conformément à l’écrit de David
  rationale: La préposition ב indique ici que l’organisation suit une instruction écrite faisant autorité. « Conformément à l’écrit » rend cette relation sans ajouter explicitement l’idée de prescription.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: David, roi d’Israël
  rationale: Cette formulation rend directement le nom et le titre royal, avec la ponctuation naturelle du français.
- source_word: וּבְמִכְתַּב שְׁלֹמֹה בְנוֹ
  choice: et à celui de son fils Salomon
  rationale: מִכְתָּב désigne également un document écrit. Le pronom « celui » évite une répétition lourde, et « son fils » conserve explicitement le lien entre Salomon et David.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’impératif et la structure organisationnelle du texte, tout en remplaçant le calque peu transparent « maisons des pères » par une expression compréhensible, expliquée en note.
