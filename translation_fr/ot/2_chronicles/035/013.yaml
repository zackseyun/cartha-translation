  to: Ils firent cuire la Pâque au feu, selon la prescription[a]. Ils firent bouillir les offrandes consacrées dans des marmites, des chaudrons et des plats, puis les apportèrent rapidement à tout le peuple.
  rationale: La révision retire l’ajout interprétatif « agneau » tout en gardant le sens sacrificiel concret de « la Pâque ». Elle améliore aussi légèrement l’idiomaticité des expressions rituelles françaises, sans résoudre au-delà du texte l’ambiguïté lexicale du premier verbe.
