  source_fidelity: « L’agneau de la Pâque » rend bien le référent rituel probable, mais « agneau » n’est pas exprimé par הַפֶּסַח dans ce verset et restreint inutilement le terme. « La Pâque » peut désigner ici la victime/le sacrifice pascal en français biblique, tout en préservant la formulation du texte source. La distinction entre la Pâque cuite au feu et les autres offrandes bouillies est bien maintenue.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Selon la prescription » est un peu plus idiomatique et précis que « conformément à la règle » dans ce contexte rituel. « Offrandes consacrées » est plus naturel en français moderne que « offrandes saintes », sans modifier le sens cultuel.
  terminology: « La Pâque », « offrandes consacrées » et « firent bouillir » rendent adéquatement les termes rituels hébreux. « Marmites, chaudrons et plats » conserve prudemment l’incertitude concernant les trois récipients.
