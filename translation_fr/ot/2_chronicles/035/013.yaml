source:
  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: fr
  text: Ils firent cuire la Pâque au feu, selon la prescription[a]. Ils firent bouillir les offrandes consacrées dans des marmites, des chaudrons et des plats, puis les apportèrent rapidement à tout le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément : « ils firent rôtir la Pâque au feu ». Le verbe hébreu peut désigner la cuisson en général, mais la loi de la Pâque prescrivait de rôtir la victime plutôt que de la faire bouillir (voir Exode 12.8-9).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: firent cuire
  rationale: Le verbe בשׁל peut désigner largement la cuisson. Ici, « au feu » et la prescription pascale précisent qu’il s’agit d’une cuisson rôtie, sans imposer au verbe lui-même un sens plus étroit.
- source_word: הַפֶּסַח
  choice: l’agneau de la Pâque
  rationale: Dans ce contexte de préparation alimentaire, « la Pâque » désigne concrètement la victime pascale. L’explicitation par « agneau » rend ce référent naturel et clair en français.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: Expression française naturelle qui indique le mode de cuisson sans préciser davantage la disposition par rapport au feu.
- source_word: כַּמִּשְׁפָּט
  choice: conformément à la règle
  rationale: מִשְׁפָּט désigne ici la procédure prescrite. « Conformément à la règle » est actuel, clair et conserve la valeur normative.
- source_word: וְהַקֳּדָשִׁים
  choice: les offrandes saintes
  rationale: Le pluriel désigne les autres éléments sacrificiels consacrés, mis en contraste avec la victime pascale.
- source_word: בִּשְּׁלוּ
  choice: firent bouillir
  rationale: Les récipients énumérés favorisent ici le sens culinaire plus précis de cuisson à l’eau et marquent le contraste avec la Pâque cuite au feu.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: dans des marmites, des chaudrons et des plats
  rationale: Cette série distingue trois types de récipients, même si leur forme exacte demeure incertaine. Ces termes sont usuels et dignes en français moderne.
- source_word: וַיָּרִיצוּ
  choice: les apportèrent rapidement
  rationale: La formulation exprime à la fois le déplacement et la hâte portée par le verbe.
- source_word: לְכָל בְּנֵי הָעָם
  choice: à tout le peuple
  rationale: Littéralement « à tous les fils du peuple », l’expression désigne idiomatiquement l’ensemble des participants du peuple.
theological_decisions:
- issue: Tension possible entre בשׁל et la prescription de rôtir la Pâque
  choice: Employer le verbe général « faire cuire » et laisser « au feu, conformément à la règle » préciser la méthode prescrite.
  alternative: Traduire directement « firent rôtir », ou rendre les deux occurrences par le même verbe général.
  rationale: Le verset oppose lui-même la Pâque préparée au feu selon la prescription aux autres offrandes bouillies dans des récipients. Cette solution conserve à la fois l’étendue lexicale du verbe et la distinction rituelle.
- issue: Référent des « offrandes saintes »
  choice: Les comprendre comme des portions sacrificielles autres que la victime pascale.
  alternative: Y voir une désignation générale de toute nourriture consacrée, y compris la Pâque.
  rationale: La syntaxe et les deux modes de cuisson opposent la Pâque aux offrandes saintes.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour alléger l’énumération. « Marmites, chaudrons et plats » maintient la diversité des récipients sans prétendre en déterminer précisément la forme.
