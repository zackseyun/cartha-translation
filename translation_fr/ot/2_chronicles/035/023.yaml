  text: וַ/יֹּרוּ֙ הַ/יֹּרִ֔ים לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ לַ/עֲבָדָי/ו֙ הַעֲבִיר֔וּ/נִי כִּ֥י הָחֳלֵ֖יתִי מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: fr
  text: 'Les archers tirèrent sur le roi Josias, et le roi dit à ses serviteurs : « Emmenez-moi, car je suis grièvement blessé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi exprimer le fait d’être très affaibli ou gravement atteint ; dans ce contexte de bataille, « blessé » est le sens le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ
  choice: tirèrent
  rationale: Le hiphil de ירה désigne ici l’action de tirer dans un contexte militaire.
- source_word: הַיֹּרִים
  choice: les archers
  rationale: Le participe signifie littéralement « ceux qui tirent » ; dans cette scène de bataille, « les archers » est l’expression française naturelle.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: sur le roi Josias
  rationale: Avec le verbe « tirer », la préposition ל marque ici la cible. « Tirer sur » conserve cette nuance sans affirmer plus précisément où les flèches l’ont atteint.
- source_word: הַעֲבִירוּנִי
  choice: Emmenez-moi
  rationale: Le causatif de עבר demande qu’on le fasse quitter les lieux. « Emmenez-moi » est naturel et n’impose pas l’idée plus précise de le porter.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’ordre donné et convient au registre direct et digne du récit.
- source_word: הָחֳלֵיתִי
  choice: je suis blessé
  rationale: חלה peut exprimer la faiblesse ou la maladie, mais le contexte immédiat d’une attaque d’archers favorise ici le sens de blessure.
- source_word: מְאֹד
  choice: grièvement
  rationale: L’intensif מְאֹד est rendu idiomatiquement par « grièvement » avec « blessé ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation « tirèrent sur » préserve la valeur de cible marquée par ל, tandis que « grièvement blessé » rend naturellement l’intensité de מְאֹד dans le contexte militaire.
