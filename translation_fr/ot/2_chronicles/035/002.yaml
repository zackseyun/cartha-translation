source:
  edition: WLC
  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: fr
  text: Il établit les prêtres dans leurs fonctions[a] et les fortifia[b] pour le service de la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à leurs postes », « selon leurs divisions » ou, plus littéralement, « à leurs tours de service ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les encouragea » ou « les affermit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il établit
  rationale: Le hifil de עמד exprime ici le fait de placer des personnes dans la position qui leur est assignée. « Établit » rend naturellement cette action d’organisation sans la réduire à une simple nomination.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant de כֹּהֲנִים, avec conservation de l’article défini.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: dans leurs fonctions
  rationale: מִשְׁמְרוֹת peut désigner les postes, les tours de service ou les divisions assignées. « Dans leurs fonctions » exprime clairement le sens fonctionnel dans le contexte du service du temple, tandis que la note conserve les autres nuances possibles.
- source_word: וַיְחַזְּקֵם
  choice: et les fortifia
  rationale: Au piel, חזק peut signifier fortifier, affermir ou encourager. « Fortifia » conserve le noyau lexical et laisse ouverte la nature concrète ou morale du soutien.
- source_word: לַעֲבוֹדַת
  choice: pour le service
  rationale: עֲבוֹדָה désigne le travail ou le service, notamment le service cultuel. « Service » est ici précis, naturel et suffisamment large.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: Cette formulation préserve l’image hébraïque de la « maison » tout en rendant directement le nom divin יהוה sous la forme française courante « Yahvé ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente directement le nom propre divin en français et le distingue du titre « Seigneur », sans prétendre restituer avec certitude absolue la vocalisation ancienne.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant idiomatique; les notes signalent les principales nuances lexicales réelles sans surinterpréter le soutien apporté aux prêtres.
