source:
  edition: WLC
  text: וַ/תִּכּ֖וֹן הָ/עֲבוֹדָ֑ה וַ/יַּֽעַמְד֨וּ הַ/כֹּהֲנִ֧ים עַל עָמְדָ֛/ם וְ/הַ/לְוִיִּ֥ם עַל מַחְלְקוֹתָ֖/ם כְּ/מִצְוַ֥ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: fr
  text: Ainsi, le service fut préparé[a]. Les prêtres se tinrent à leur poste[b], et les lévites selon leurs divisions[c], conformément à l’ordre du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut organisé » ou « fut établi ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à leur position » ; c’est-à-dire à la place qui leur était assignée.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans leurs divisions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: fut préparé
  rationale: Le verbe כון exprime ici la mise en place ou en état de préparation du service. « Fut préparé » convient naturellement au contexte de la Pâque tout en laissant en note les nuances « organisé » et « établi ».
- source_word: הָעֲבוֹדָה
  choice: le service
  rationale: Dans ce contexte cultuel, עֲבוֹדָה désigne le service lié au culte plutôt qu’un travail quelconque. « Le service » est clair et digne sans introduire un vocabulaire liturgique plus tardif.
- source_word: וַיַּעַמְדוּ
  choice: se tinrent
  rationale: עמד signifie se tenir debout ou prendre position. Avec les compléments qui suivent, « se tinrent » rend sobrement l’action et la disposition assignée.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant de כֹּהֲנִים dans un contexte cultuel.
- source_word: עַל עָמְדָם
  choice: à leur poste
  rationale: L’expression désigne littéralement leur lieu ou position où se tenir. « À leur poste » communique en français moderne l’idée d’une place assignée.
- source_word: הַלְוִיִּם
  choice: les lévites
  rationale: Désignation française usuelle du groupe tribal et cultuel.
- source_word: עַל מַחְלְקוֹתָם
  choice: selon leurs divisions
  rationale: מַחְלְקוֹת désigne les groupes ou classes organisés. « Selon leurs divisions » conserve la structure de l’hébreu et souligne leur répartition ordonnée.
- source_word: כְּמִצְוַת
  choice: conformément à l’ordre
  rationale: מִצְוָה désigne ici une directive royale précise. « L’ordre » est plus naturel que « le commandement » dans ce contexte.
- source_word: הַמֶּלֶךְ
  choice: du roi
  rationale: Traduction directe de la référence définie au roi régnant dans le contexte.
theological_decisions:
- issue: Terminologie cultuelle de עֲבוֹדָה
  choice: le service
  alternative: le service rituel ; le travail
  rationale: Le contexte décrit les procédures cultuelles de la Pâque. « Le service » préserve cette portée sacrée sans importer une terminologie confessionnelle ou liturgique ultérieure.
- issue: Idiomes d’organisation concernant les prêtres et les lévites
  choice: à leur poste ... selon leurs divisions
  alternative: à leur place ... dans leurs divisions
  rationale: Cette formulation rend lisible l’organisation structurée du service tout en restant proche des expressions hébraïques, sans préciser davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire cultuel et l’organisation parallèle des prêtres et des lévites, avec des notes pour les principales nuances lexicales de l’hébreu.
