  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: fr
  text: Après cela, ils préparèrent ce qu’il fallait pour eux-mêmes et pour les prêtres[a], car les prêtres, descendants d’Aaron, furent occupés à offrir l’holocauste et les parties grasses jusqu’à la nuit. Les lévites préparèrent donc ce qu’il fallait pour eux-mêmes et pour les prêtres, descendants d’Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour eux » dans les deux occurrences de « pour eux-mêmes » ; le pronom hébreu n’est pas explicitement réfléchi, mais le contexte suggère fortement que les lévites préparèrent aussi ce qui leur était destiné.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Après cela
  rationale: Marque naturellement en français la succession temporelle avec les actions du verset précédent.
- source_word: הֵכִינוּ
  choice: firent les préparatifs
  rationale: Le hiphil de כון signifie ici préparer ou mettre en état. Cette formulation reste assez large pour ne pas préciser indûment qu’il s’agit uniquement d’un repas.
- source_word: לָהֶם
  choice: pour eux-mêmes
  rationale: Le pronom n’est pas formellement réfléchi, mais le sujet implicite puis explicite étant les lévites, le contexte indique très probablement qu’ils préparent aussi ce qui leur est destiné.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: les prêtres, descendants d’Aaron
  rationale: « Descendants » exprime ici avec naturel la filiation corporative et généalogique de בְּנֵי, sans suggérer que tous seraient les fils immédiats d’Aaron.
- source_word: בְּהַעֲלוֹת
  choice: furent occupés … à offrir
  rationale: Dans ce contexte sacrificiel, עלה désigne l’action de faire monter l’offrande sur l’autel; la tournure souligne que cette activité prolongée empêchait les prêtres de faire leurs propres préparatifs.
- source_word: הָעוֹלָה
  choice: les holocaustes
  rationale: Terme sacrificiel français usuel pour עֹלָה, offrande entièrement brûlée. Le pluriel contextuel est naturel, puisque le service se prolonge jusqu’à la nuit et concerne de multiples sacrifices.
- source_word: וְהַחֲלָבִים
  choice: et les graisses
  rationale: Désigne les parties grasses sacrificielles brûlées sur l’autel. « Graisses » est concis et reçoit son sens rituel du contexte.
- source_word: עַד לָיְלָה
  choice: jusqu’à la nuit
  rationale: Rend directement la limite temporelle exprimée par le texte hébreu, sans la réduire au soir.
- source_word: וְהַלְוִיִּם
  choice: Les lévites firent donc
  rationale: Le waw reprend la proposition principale après l’explication causale; « donc » rend clairement en français le rapport logique avec l’occupation des prêtres.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’explication causale et la reprise finale du texte hébreu. « Descendants d’Aaron » évite l’ambiguïté moderne de « fils d’Aaron », tandis que « holocaustes » maintient le vocabulaire sacrificiel traditionnel et précis.
