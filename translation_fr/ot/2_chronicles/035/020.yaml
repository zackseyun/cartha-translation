base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: fr
  text: Après tout cela, lorsque Josias eut préparé le Temple[a], Néko, roi d’Égypte, monta combattre à Karkemish, sur l’Euphrate, et Josias sortit à sa rencontre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la maison », c’est-à-dire le Temple.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte militaire, « sortit à sa rencontre » peut aussi signifier « sortit contre lui » ou « sortit l’affronter ».
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: eut préparé
  rationale: Le hifil de כון exprime ici l’action de préparer, d’établir ou de mettre en ordre. « Eut préparé » reste proche du verbe hébreu tout en indiquant que cette action était achevée avant la campagne de Néko.
- source_word: הַבַּיִת
  choice: le Temple
  rationale: Le terme signifie littéralement « la maison », mais, dans ce contexte des Chroniques, il désigne clairement le Temple. L’explicitation est naturelle en français moderne, tandis qu’une note conserve la forme littérale.
- source_word: עָלָה
  choice: monta
  rationale: Traduction directe du verbe עלה, sans préciser davantage le mode de déplacement militaire.
- source_word: לְהִלָּחֵם
  choice: combattre
  rationale: Le verbe désigne l’engagement dans un combat ou une guerre. « Combattre » est concis et naturel.
- source_word: בְּכַרְכְּמִישׁ
  choice: à Karkemish
  rationale: 'La préposition בְּ est comprise ici comme locative : la campagne vise un combat à Karkemish.'
- source_word: עַל פְּרָת
  choice: sur l’Euphrate
  rationale: L’expression situe Karkemish au bord de l’Euphrate ; « sur l’Euphrate » est l’usage géographique français courant.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: sortit à sa rencontre
  rationale: Cette formulation préserve l’ambiguïté de לִקְרָאתוֹ, qui peut désigner une rencontre sans préciser à elle seule si elle est pacifique ou hostile, même si le contexte est militaire.
