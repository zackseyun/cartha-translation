base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: fr
  text: Immolez le sacrifice pascal[a], consacrez-vous et faites les préparatifs pour vos frères, afin qu’ils agissent conformément à la parole de Yahweh transmise par l’intermédiaire de Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « immolez la Pâque ». Le terme hébreu peut désigner la Pâque ou le sacrifice pascal ; il renvoie ici concrètement à ce qui doit être immolé.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Moïse ».'
    reason: hebrew_idiom
lexical_decisions:
- source_word: וְשַׁחֲטוּ הַפָּסַח
  choice: Immolez les victimes de la Pâque
  rationale: שׁחט désigne ici l’abattage rituel des animaux pascals. « Immoler » exprime naturellement le contexte sacrificiel, et le pluriel « les victimes » explicite le référent concret de הַפָּסַח sans le limiter aux seuls agneaux.
- source_word: וְהִתְקַדְּשׁוּ
  choice: consacrez-vous
  rationale: La forme réfléchie de קדשׁ évoque la préparation rituelle requise pour un service sacré. « Consacrez-vous » en conserve la portée cultuelle dans un français actuel.
- source_word: וְהָכִינוּ לַאֲחֵיכֶם
  choice: faites les préparatifs pour vos frères
  rationale: כון au hiphil signifie préparer ou tenir prêt, tandis que l’objet demeure implicite. Cette formulation française garde cette relative indétermination et rend littéralement le masculin pluriel אֲחֵיכֶם.
- source_word: לַעֲשׂוֹת כִּדְבַר יְהוָה
  choice: afin d’accomplir la parole de Yahweh
  rationale: L’infinitif לַעֲשׂוֹת relie les préparatifs à l’exécution de l’instruction divine. « Accomplir la parole » conserve l’expression hébraïque et sa force prescriptive sans réduire דָּבָר au seul sens de « commandement ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu qui emploie ici le tétragramme.
- source_word: בְּיַד מֹשֶׁה
  choice: transmise par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse », cet idiome indique que Moïse est le médiateur de la parole divine. La formulation choisie en donne le sens en français naturel.
theological_decisions:
- issue: Portée du terme הַפָּסַח
  choice: les victimes de la Pâque
  alternative: la Pâque ; l’agneau pascal
  rationale: Dans ce contexte, le terme désigne les animaux immolés pour la Pâque. Le pluriel évite de laisser entendre qu’un seul animal est concerné ou que toutes les victimes sont nécessairement des agneaux.
- issue: Référent de לַאֲחֵיכֶם
  choice: pour vos frères
  alternative: pour les autres Israélites ; pour vos compatriotes
  rationale: L’hébreu porte explicitement le masculin pluriel « frères ». Le texte principal le conserve, tout en reconnaissant qu’il désigne ici les membres du peuple auxquels les lévites rendent ce service.
- issue: Lien syntaxique de לַעֲשׂוֹת
  choice: afin d’accomplir
  alternative: afin qu’ils accomplissent
  rationale: L’hébreu ne précise pas formellement le sujet de l’infinitif. La tournure française sans pronom explicite évite autant que possible de décider si l’accomplissement est attribué aux destinataires seuls ou à l’ensemble des participants.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération préserve le nom personnel présent dans la source au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Immoler », « consacrez-vous » et « parole » maintiennent le registre rituel et scripturaire sans archaïsme excessif. La phrase suit le mouvement des trois impératifs hébreux, tandis que « transmise par l’intermédiaire de » restitue clairement l’idiome de médiation.
