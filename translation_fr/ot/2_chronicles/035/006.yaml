revisions:
- from: Immolez les victimes de la Pâque[a], consacrez-vous et faites les préparatifs pour vos frères, afin d’accomplir la parole de Yahweh transmise par l’intermédiaire de Moïse[b].
  to: Immolez le sacrifice pascal[a], consacrez-vous et faites les préparatifs pour vos frères, afin qu’ils agissent conformément à la parole de Yahweh transmise par l’intermédiaire de Moïse[b].
  rationale: La révision rétablit le singulier du terme hébreu par « le sacrifice pascal », expression française idiomatique qui ne suppose pas qu’il s’agit exclusivement d’un agneau. Elle rend aussi la finalité des préparatifs par une proposition dont « vos frères » est le sujet, conformément à la syntaxe et au sens contextuel, tout en gardant le registre rituel et le nom Yahweh.
