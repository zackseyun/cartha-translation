source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: fr
  text: Tenez-vous dans le lieu saint, selon les divisions des maisons ancestrales de vos frères, les membres du peuple[a], et selon la division d’une maison ancestrale pour les lévites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fils du peuple » — littéralement « les fils du peuple »; l’expression désigne ici les Israélites non lévites, par opposition aux lévites.
    reason: Alternative lexicale et clarification contextuelle.
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: Tenez-vous
  rationale: L’impératif pluriel de עמד ordonne aux lévites de prendre et de garder leur place. « Tenez-vous » convient au contexte d’une disposition organisée.
- source_word: בַקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: La préposition locale et l’article désignent ici l’espace sacré. « Lieu saint » en conserve le sens concret sans préciser davantage la zone du sanctuaire.
- source_word: לִפְלֻגּוֹת
  choice: selon les groupes
  rationale: Le nom désigne des divisions ou groupements organisés; « selon les groupes » exprime naturellement la disposition demandée.
- source_word: בֵּית הָאָבוֹת
  choice: maisons ancestrales
  rationale: L’expression désigne les unités familiales patrilinéaires d’Israël. « Maisons ancestrales » reste proche de l’image hébraïque tout en étant plus clair en français actuel que « maisons des pères ».
- source_word: לַאֲחֵיכֶם
  choice: de vos frères
  rationale: La formulation conserve le langage de parenté employé pour les autres Israélites et son lien avec leurs groupements familiaux.
- source_word: בְּנֵי הָעָם
  choice: les fils du peuple
  rationale: La traduction littérale préserve la terminologie sociale masculine et l’apposition hébraïque; une note indique qu’elle désigne ici les Israélites non lévites.
- source_word: וַחֲלֻקַּת
  choice: et selon la répartition
  rationale: Le nom singulier présente la répartition correspondante des lévites. La répétition de « selon » rend explicite le parallélisme syntaxique sans déterminer plus précisément la relation entre les deux classements.
- source_word: בֵּית אָב
  choice: d’une maison ancestrale
  rationale: Le singulier est conservé comme unité représentative du classement familial.
- source_word: לַלְוִיִּם
  choice: pour les lévites
  rationale: « Pour » maintient la valeur relationnelle de la préposition et laisse intacte la légère tension de la construction hébraïque.
theological_decisions:
- issue: Terminologie de parenté et distinction entre lévites et autres Israélites
  choice: Conserver « vos frères, les fils du peuple » dans le texte
  alternative: vos compatriotes israélites / les membres du peuple
  rationale: L’hébreu emploie des termes masculins de parenté liés à l’organisation familiale d’Israël. Les conserver évite d’effacer cette structure, tandis que la note explique la distinction contextuelle sans lui donner une portée doctrinale supplémentaire.
translation_notes:
  register: Français international actuel, digne et accessible. « Maisons ancestrales » rend l’institution généalogique sans l’archaïsme de « maisons paternelles ». La coordination et le singulier de la dernière proposition restent volontairement proches de l’hébreu afin de ne pas supprimer son ambiguïté syntaxique.
