revisions:
- from: Tenez-vous dans le lieu saint, selon les groupes de maisons ancestrales de vos frères, les fils du peuple[a], et selon la répartition d’une maison ancestrale pour les lévites.
  to: Tenez-vous dans le lieu saint, selon les divisions des maisons ancestrales de vos frères, les membres du peuple[a], et selon la division d’une maison ancestrale pour les lévites.
  rationale: La révision distingue avec davantage de précision les divisions organisationnelles des maisons ancestrales, rétablit le parallélisme entre les deux membres de la phrase et emploie une expression française naturelle pour בני העם. La note maintient la possibilité de la traduction littérale et explique uniquement la distinction sociale requise par le contexte.
