review_pass:
  verdict: revise
  source_fidelity: Le sens de l’injonction, le lieu sacré et la double organisation par groupes familiaux sont globalement bien rendus. Toutefois, « groupes de maisons ancestrales » affaiblit la distinction entre les « divisions » (פּלֻגּוֹת) et les unités familiales (בֵּית אָבוֹת). La seconde occurrence est également mieux rendue par « division » que par « répartition », afin de préserver le parallèle sans résoudre une syntaxe concise et quelque peu ambiguë.
  naturalness: « Selon les divisions des maisons ancestrales » est plus idiomatique et plus précis en français que « selon les groupes de maisons ancestrales ». Pour un français actuel, « les membres du peuple » dans le texte est naturel; la note conserve explicitement la formulation littérale « les fils du peuple ».
  terminology: « Lieu saint », « maisons ancestrales » et « lévites » conviennent au registre et au contexte cultuel. « Membres du peuple » traduit ici l’expression sociale בני העם, qui désigne les Israélites non lévites; la note préserve l’expression littérale et la distinction contextuelle.
  issues:
  - severity: medium
    issue: Conflation de « divisions » et de « maisons ancestrales »
    rationale: « Selon les groupes de maisons ancestrales » peut faire des maisons elles-mêmes les groupes. L’hébreu demande plutôt une disposition « selon les divisions des maisons ancestrales ».
  - severity: low
    issue: « Répartition » ne maintient pas nettement le parallélisme lexical
    rationale: Le nom חלוקה correspond à la même sphère sémantique organisationnelle que פּלֻגּוֹת. « Division » maintient plus clairement le parallèle sans imposer une interprétation supplémentaire.
  - severity: low
    issue: « Les fils du peuple » est peu naturel dans le corps du texte français
    rationale: L’expression est littérale mais opaque en français moderne. « Les membres du peuple » restitue son référent contextuel, tandis que la note donne la formulation littérale.
  revised_text: Tenez-vous dans le lieu saint, selon les divisions des maisons ancestrales de vos frères, les membres du peuple[a], et selon la division d’une maison ancestrale pour les lévites.
  revised_footnotes:
  - marker: a
    text: Ou « les fils du peuple » — littéralement « les fils du peuple »; l’expression désigne ici les Israélites non lévites, par opposition aux lévites.
    reason: Alternative lexicale et clarification contextuelle.
  revision_rationale: La révision distingue avec davantage de précision les divisions organisationnelles des maisons ancestrales, rétablit le parallélisme entre les deux membres de la phrase et emploie une expression française naturelle pour בני העם. La note maintient la possibilité de la traduction littérale et explique uniquement la distinction sociale requise par le contexte.
