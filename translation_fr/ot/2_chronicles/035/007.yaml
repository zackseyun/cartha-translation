reference: 2 Chronicles 35:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: fr
  text: Josias fournit aux gens du peuple[a] du petit bétail — des agneaux et des chevreaux —, en tout trente mille bêtes destinées aux sacrifices de la Pâque[b] pour tous ceux qui étaient présents, ainsi que trois mille bovins. Tout cela provenait des biens du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils du peuple » ; on peut aussi traduire : « au peuple » ou « aux gens ordinaires ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le pluriel « Pâques », qui désigne probablement ici collectivement les victimes ou les sacrifices de la Pâque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: fournit
  rationale: Le hiphil de רום désigne ici une contribution prélevée sur les biens du roi et mise à disposition du peuple. « Fournit » exprime naturellement cet approvisionnement sans laisser entendre que Josias accomplit lui-même tous les sacrifices.
- source_word: לִבְנֵי הָעָם
  choice: aux gens du peuple
  rationale: L’expression signifie littéralement « aux fils du peuple ». Dans ce contexte, « aux gens du peuple » conserve la distinction probable avec les prêtres et les lévites, tout en restant naturel et inclusif en français moderne.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: du petit bétail — des agneaux et des chevreaux —
  rationale: צֹאן est un collectif désignant le petit bétail, précisé ensuite par « agneaux » et « chevreaux ». La construction avec tirets rend clairement cette apposition.
- source_word: הַכֹּל לַפְּסָחִים
  choice: bêtes destinées aux sacrifices de la Pâque
  rationale: Le pluriel פְּסָחִים désigne vraisemblablement ici l’ensemble des victimes ou sacrifices pascals. La formulation française explicite le référent sans réduire le terme à la fête elle-même.
- source_word: לְכָל הַנִּמְצָא
  choice: pour tous ceux qui étaient présents
  rationale: Le participe niphal de מצא renvoie ici aux personnes présentes ou rassemblées pour la célébration.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: en tout trente mille bêtes
  rationale: Cette formulation française naturelle rattache sans ambiguïté le nombre au petit bétail mentionné auparavant.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: ainsi que trois mille bovins
  rationale: בָּקָר est un collectif désignant le gros bétail sans préciser le sexe des animaux. « Bovins » préserve cette portée.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Tout cela provenait des biens du roi
  rationale: רְכוּשׁ désigne les biens ou possessions. La phrase indique que l’ensemble des animaux venait des ressources propres du roi.
theological_decisions:
- issue: Portée de « tout » dans הַכֹּל לַפְּסָחִים
  choice: Le terme est rattaché aux trente mille têtes de petit bétail.
  alternative: Comprendre que les bovins aussi étaient tous directement destinés aux sacrifices de la Pâque.
  rationale: L’ordre syntaxique associe הַכֹּל לַפְּסָחִים au petit bétail avant son dénombrement, puis mentionne séparément les trois mille bovins. La traduction évite donc d’imposer aux bovins une fonction sacrificielle que le verset ne précise pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. « Gens du peuple » conserve la nuance sociale probable de l’hébreu sans recourir au calque peu naturel « fils du peuple ». Les tirets signalent que les agneaux et les chevreaux précisent la catégorie du petit bétail.
