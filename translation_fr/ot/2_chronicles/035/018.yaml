  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: fr
  text: Aucune Pâque semblable n’avait été célébrée en Israël depuis l’époque du prophète Samuel[a]. Aucun des rois d’Israël n’avait célébré une Pâque comme celle que célébrèrent Josias, les prêtres, les lévites, tout Juda, les Israélites qui étaient présents[b] et les habitants de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Une Pâque comme celle-ci n’avait pas été célébrée en Israël depuis l’époque du prophète Samuel. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Israël qui se trouvait là »; c’est-à-dire les membres d’Israël présents pour la célébration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה avec פֶסַח
  choice: avait été célébrée / avait célébré / célébrèrent
  rationale: Avec פֶסַח, עשה désigne idiomatiquement l’observance ou la célébration de la Pâque. « Célébrer la Pâque » est naturel en français et convient tant à la forme passive qu’aux formes actives du verset.
- source_word: פֶסַח
  choice: Pâque
  rationale: Le terme désigne ici l’ensemble de la célébration pascale, et non seulement la victime sacrifiée. « La Pâque » est l’expression française biblique usuelle.
- source_word: כָּמֹהוּ / כַּפֶּסַח
  choice: semblable / comme celle
  rationale: Le suffixe renvoie à la Pâque célébrée. Ces formulations rendent clairement les deux comparaisons sans leur imposer une explication.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition a ici une portée locative ou collective; « en Israël » conserve naturellement l’étendue nationale.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: depuis l’époque du prophète Samuel
  rationale: מִן avec « jours » indique le point de départ de la comparaison rétrospective. « Depuis l’époque de » est idiomatique en français moderne.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא עָשׂוּ
  choice: Aucun des rois d’Israël n’avait célébré
  rationale: La construction hébraïque « tous… ne pas » exprime ici une négation universelle, naturellement rendue par « aucun des ».
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: celle que célébrèrent Josias, les prêtres, les lévites
  rationale: La coordination hébraïque présente Josias et les groupes suivants comme participants à la célébration. Garder la coordination évite d’ajouter au texte une relation instrumentale ou subordonnée.
- source_word: וְכָל יְהוּדָה
  choice: tout Juda
  rationale: Cette formulation concise conserve la désignation collective du territoire et de sa population.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: les Israélites qui étaient présents
  rationale: Le singulier collectif « Israël » accompagné du participe signifie les membres d’Israël présents à cette occasion. Le pluriel français est plus naturel tout en gardant ce sens.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: les habitants de Jérusalem
  rationale: Rendu français courant de l’expression participiale désignant les résidents de la ville.
theological_decisions:
- issue: Portée historique de la comparaison avec les Pâques antérieures
  choice: Conserver l’affirmation selon laquelle aucune Pâque semblable n’avait été célébrée depuis l’époque de Samuel.
  alternative: Comprendre cette déclaration soit comme une comparaison qualitative, soit comme une affirmation historique absolue excluant toute célébration comparable durant cet intervalle.
  rationale: L’hébreu affirme le caractère sans pareil de cette Pâque puis précise qu’aucun des rois d’Israël n’en avait célébré une semblable. La traduction préserve cette tension sans harmoniser explicitement le verset avec le récit d’autres Pâques importantes.
translation_notes:
  register: Français international moderne, clair et digne. « Célébrer la Pâque » rend l’idiome hébreu de manière accessible. Le passé antérieur « célébrèrent » marque élégamment l’événement passé dans une comparaison rétrospective, sans archaïsme excessif.
