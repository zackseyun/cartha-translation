  source_fidelity: 'Le texte rend fidèlement les deux affirmations comparatives de l’hébreu : aucune Pâque semblable depuis les jours de Samuel, puis aucune célébrée par les rois d’Israël comme celle de Josias et de l’ensemble des participants énumérés. « Célébrer la Pâque » restitue correctement l’idiome עשה + פסח. La portée collective de « Israël qui se trouvait là » est bien rendue par « les Israélites qui étaient présents ».'
