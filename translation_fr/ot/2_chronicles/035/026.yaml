source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: fr
  text: 'Le reste des actes de Josias, ainsi que ses œuvres de fidélité[a], conformément à ce qui est écrit dans la loi de Yahweh :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses actes de loyauté », « ses bienfaits » ou « ses bontés ». Le terme hébreu peut exprimer la bonté, la loyauté ou la fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule récapitulative royale, דִּבְרֵי désigne les faits et gestes du roi plutôt que ses seules paroles. « Le reste des actes » est naturel en français et conserve le sens historiographique.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַחֲסָדָיו
  choice: ainsi que ses œuvres de fidélité
  rationale: Le pluriel de חֶסֶד peut évoquer des manifestations de bonté, de loyauté ou de fidélité. « Œuvres de fidélité » garde ici la portée religieuse du terme sans préciser abusivement qu’il s’agit explicitement de la fidélité à l’alliance.
- source_word: כַּכָּתוּב
  choice: conformément à ce qui est écrit
  rationale: Cette formulation française rend le sens de « selon ce qui est écrit » et relie naturellement l’évaluation de Josias au texte de la loi.
- source_word: בְּתוֹרַת
  choice: dans la loi de
  rationale: Dans ce contexte, תּוֹרָה renvoie à l’enseignement normatif écrit de Yahweh. « Loi » est la désignation française la plus immédiatement intelligible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, conformément à l’orientation du projet, plutôt que substitution par un titre.
theological_decisions:
- issue: Portée de חֶסֶד appliqué à Josias
  choice: ses œuvres de fidélité
  alternative: ses actes de loyauté ; ses bontés ; ses bienfaits
  rationale: Le contexte met en rapport la conduite de Josias et la loi de Yahweh. « Fidélité » maintient cette résonance théologique tout en laissant la note signaler l’étendue sémantique du terme hébreu.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le nom propre est conservé sous une forme translittérée au lieu d’être remplacé par un titre.
translation_notes:
  register: Français international moderne, digne et lisible. « Ainsi que » évite une coordination lourde, et le deux-points final est conservé puisque la phrase se poursuit au verset suivant.
