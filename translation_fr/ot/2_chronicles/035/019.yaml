  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: fr
  text: La dix-huitième année du règne de Josias, cette Pâque fut célébrée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette Pâque fut observée » ; plus littéralement, « cette Pâque fut faite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: La dix-huitième année
  rationale: La préposition בְּ suivie de l’expression numérique et de שָׁנָה introduit une indication temporelle. Cette formulation est naturelle en français et conserve la datation du texte hébreu.
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: du règne de Josias
  rationale: La construction désigne la période durant laquelle Josias exerçait la royauté. « Du règne de Josias » correspond à la formule française usuelle de datation royale.
- source_word: נַעֲשָׂה
  choice: fut célébrée
  rationale: Le verbe signifie littéralement « fut faite », mais, appliqué à la Pâque, il désigne son accomplissement rituel. « Fut célébrée » est clair et idiomatique, tandis que la note conserve le sens plus formel.
- source_word: הַפֶּסַח
  choice: cette Pâque
  rationale: פֶּסַח est le terme usuel pour la Pâque. Avec le démonstratif הַזֶּה, « cette Pâque » renvoie précisément à la célébration décrite dans le contexte.
- source_word: הַזֶּה
  choice: cette
  rationale: Le démonstratif renvoie à la Pâque particulière dont il vient d’être question; « cette » maintient directement ce lien discursif.
