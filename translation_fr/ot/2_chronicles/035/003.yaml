  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: fr
  text: 'Il dit aux Lévites qui instruisaient tout Israël[a] et qui étaient consacrés à Yahweh : « Placez l’arche sainte dans la maison[b] qu’a bâtie Salomon, fils de David et roi d’Israël. Vous n’avez plus à la porter sur vos épaules[c]. Maintenant, servez Yahweh, votre Dieu, et Israël, son peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Lévites qui avaient du discernement pour tout Israël ». Le participe hébreu peut désigner des personnes compétentes ou perspicaces, ou, dans ce contexte, des personnes qui instruisent.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire dans le temple bâti par Salomon. L’hébreu dit littéralement « dans la maison ».
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « Il n’y a pas pour vous de charge sur l’épaule. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  choice: qui instruisaient
  rationale: Le participe de בין peut exprimer le fait d’être instruit ou de donner de l’intelligence. Dans le contexte des fonctions lévitiques, « qui instruisaient » rend naturellement le sens fonctionnel probable, tout en signalant l’ambiguïté en note.
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  choice: qui étaient consacrés à Yahweh
  rationale: « Consacrés à » exprime ici le statut cultuel d’appartenance à Yahweh plus naturellement en français que le calque « saints pour Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin dans cette édition, plutôt que substitution par un titre.
- source_word: תְּנוּ אֶת אֲרוֹן הַ/קֹּדֶשׁ בַּ/בַּיִת
  choice: Placez l’arche sainte dans la maison
  rationale: « Placez » rend נתן dans son sens contextuel; « maison » conserve בית, dont le référent est le temple bâti par Salomon.
- source_word: אֵין לָ/כֶם מַשָּׂא בַּ/כָּתֵף
  choice: Vous n’avez plus à la porter sur vos épaules
  rationale: Formulation française claire du sens idiomatique, avec l’arche comme objet implicite; la tournure littérale est conservée en note.
- source_word: עַתָּה עִבְדוּ
  choice: Maintenant, servez
  rationale: « Servez » garde l’étendue sémantique de עבד, qui peut englober le service cultuel et le ministère accompli pour le peuple.
- source_word: וְ/אֵת עַמּ/וֹ יִשְׂרָאֵל
  choice: et Israël, son peuple
  rationale: Cette apposition française identifie clairement Israël comme le peuple de Yahweh et préserve le second objet du verbe « servir ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Fonction des Lévites dans ה/מבונים
  choice: qui instruisaient tout Israël
  alternative: qui étaient instruits pour tout Israël; qui donnaient de l’intelligence à tout Israël
  rationale: Le contexte du Chroniste favorise vraisemblablement la fonction d’enseignement des Lévites, mais la note préserve l’ambiguïté grammaticale et lexicale.
- issue: Portée de « servir » avec Yahweh et Israël comme objets
  choice: servez Yahweh, votre Dieu, et Israël, son peuple
  alternative: assurez le service de Yahweh, votre Dieu, et de son peuple Israël
  rationale: La coordination surprenante du texte hébreu est maintenue plutôt que résolue en limitant le service au culte ou en paraphrasant la relation au peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du discours direct reste fluide; « maison » conserve l’image hébraïque du temple, tandis que les notes documentent les principales ambiguïtés sans surcharger le texte.
