source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: fr
  text: Ils mirent à part les holocaustes afin de les remettre, selon les groupes des familles ancestrales, aux membres du peuple[a], pour qu’ils les offrent à Yahweh, comme il est écrit dans le livre de Moïse. Ils firent de même pour les bovins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « aux fils du peuple » : expression collective désignant ici les gens du peuple, par contraste avec les prêtres et les lévites.'
    reason: Précision sur la forme littérale et la portée sociale de l’expression hébraïque.
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: Ils mirent à part
  rationale: Le hiphil de סור indique ici qu’on retire des portions de l’ensemble ou qu’on les met à part en vue de leur remise. Cette formulation rend naturellement l’opération sans en préciser davantage le geste.
- source_word: הָעֹלָה
  choice: les holocaustes
  rationale: Le singulier hébreu peut avoir un sens collectif. « Holocaustes » est le terme sacrificiel français usuel et convient au contexte où plusieurs animaux sont préparés.
- source_word: לְתִתָּם
  choice: afin de les remettre
  rationale: L’infinitif exprime le but de la mise à part. « Remettre » conserve l’idée de donner à des destinataires tout en s’accordant au contexte de distribution.
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: selon les groupes des familles ancestrales
  rationale: מִפְלַגּוֹת désigne des divisions ou groupes, et בֵּית אָבוֹת l’unité familiale ou lignagère traditionnelle. La formulation évite le calque peu naturel « maisons des pères ».
- source_word: לִבְנֵי הָעָם
  choice: aux membres du peuple
  rationale: Littéralement « aux fils du peuple », l’expression désigne ici les gens du peuple par contraste avec les prêtres et les lévites. Le français idiomatique « membres du peuple » conserve la portée collective sans laisser croire qu’il ne s’agit que des fils au sens familial.
- source_word: לְהַקְרִיב לַיהוָה
  choice: pour qu’ils les offrent à Yahweh
  rationale: Dans le contexte sacrificiel, הקריב signifie présenter ou offrir. La construction française explicite naturellement que les destinataires doivent accomplir l’offrande, ambiguïté syntaxique limitée mais réelle dans l’enchaînement hébreu.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: comme il est écrit dans le livre de Moïse
  rationale: La formule renvoie à une prescription mosaïque écrite. La minuscule à « livre » suit l’usage typographique français courant.
- source_word: וְכֵן לַבָּקָר
  choice: Ils firent de même pour les bovins
  rationale: La proposition hébraïque est elliptique et étend aux bovins la procédure qui vient d’être décrite. L’explicitation verbale est nécessaire à un français fluide.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Portée de לִבְנֵי הָעָם
  choice: aux membres du peuple
  alternative: aux fils du peuple / aux laïcs
  rationale: L’expression masculine hébraïque est collective et distingue ici la population générale des responsables cultuels. « Membres du peuple » en restitue le référent sans introduire le terme moderne et potentiellement confessionnel « laïcs »; la forme littérale est signalée en note.
- issue: Agent de l’offrande dans לְהַקְרִיב
  choice: pour qu’ils les offrent
  alternative: afin de les offrir
  rationale: Le contexte et la chaîne des compléments favorisent les membres du peuple comme agents de l’offrande, après réception des portions. La traduction retient cette lecture tout en évitant d’ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement explicitée pour rendre l’enchaînement procédural naturel; le vocabulaire sacrificiel traditionnel « holocaustes » est conservé.
