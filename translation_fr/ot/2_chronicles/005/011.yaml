source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: fr
  text: Lorsque les prêtres sortirent du lieu saint — car tous les prêtres présents s’étaient consacrés, sans tenir compte des divisions de service[a] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans observer les divisions ». Il s’agit des divisions de service sacerdotales habituelles.
    reason: Alternative lexicale et éclaircissement prudent du sens institutionnel de מַחְלְקוֹת.
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Lorsque … sortirent
  rationale: La construction narrative avec וַיְהִי et l’infinitif précédé de בְּ introduit une proposition temporelle. « Lorsque » rend naturellement ce cadre en français; la phrase demeure ouverte, comme en hébreu, sur la suite du verset 12.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis de כֹּהֲנִים.
- source_word: מִן הַקֹּדֶשׁ
  choice: du lieu saint
  rationale: Dans le contexte du temple, הַקֹּדֶשׁ désigne l’espace sacré dont sortent les prêtres. « Lieu saint » conserve ce sens cultuel sans le confondre nécessairement avec l’ensemble du sanctuaire.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici une explication circonstancielle; « car » en préserve clairement la valeur.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: tous les prêtres présents
  rationale: Le participe de מצא désigne ici ceux qui se trouvaient sur place. Cette formulation est idiomatique et conserve la portée de כָּל.
- source_word: הִתְקַדָּשׁוּ
  choice: s’étaient consacrés
  rationale: Le hitpael de קדש évoque la préparation ou consécration rituelle des prêtres pour le service du temple. Le plus-que-parfait marque son antériorité par rapport à leur sortie.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: sans respecter la répartition en groupes de service
  rationale: L’expression signifie littéralement qu’il n’y avait pas d’observation selon les divisions. « Groupes de service » explicite le sens institutionnel de מַחְלְקוֹת tout en maintenant l’idée que l’organisation habituelle n’a pas été suivie.
theological_decisions:
- issue: Sens cultuel de la préparation sacerdotale
  choice: s’étaient consacrés
  alternative: s’étaient sanctifiés
  rationale: Le contexte concerne la préparation rituelle au service du temple. « Consacrés » transmet ce sens sans orienter le lecteur vers une conception doctrinale ultérieure de la sanctification morale.
- issue: Rapport aux divisions sacerdotales
  choice: sans respecter la répartition en groupes de service
  alternative: sans tenir compte de leurs divisions
  rationale: Le texte indique que les divisions ou rotations sacerdotales ordinaires n’étaient pas observées à cette occasion. La formulation choisie reste institutionnelle et n’ajoute aucune explication théologique.
translation_notes:
  register: Français international moderne, digne et lisible. Les tirets signalent la remarque explicative introduite par כִּי. La virgule finale conserve le caractère syntaxiquement inachevé du verset, qui se poursuit au verset 12.
