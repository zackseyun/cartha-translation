source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֧ת יִשְׂרָאֵ֛ל הַ/נּוֹעָדִ֥ים עָלָ֖י/ו לִ/פְנֵ֣י הָ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: fr
  text: Le roi Salomon et toute l’assemblée d’Israël, réunie avec lui[a] devant l’arche, sacrifiaient du petit bétail[b] et des bovins, en si grand nombre qu’on ne pouvait ni les compter ni les dénombrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réunie auprès de lui ». L’expression hébraïque peut désigner l’assemblée réunie avec Salomon ou en sa présence.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne le petit bétail et peut comprendre aussi bien les moutons que les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: « Assemblée » exprime naturellement la communauté réunie, sans connotation ecclésiastique ajoutée; « toute » rend כָל.
- source_word: הַנּוֹעָדִים
  choice: qui s’était réunie
  rationale: Le participe niphal décrit l’assemblée convoquée ou rassemblée; le plus-que-parfait situe naturellement ce rassemblement avant les sacrifices en cours.
- source_word: עָלָיו
  choice: auprès de lui
  rationale: Cette formulation conserve le rapport spatial avec Salomon sans trancher excessivement entre les sens possibles « auprès de lui », « avec lui » et « autour de lui ».
- source_word: לִפְנֵי הָאָרוֹן
  choice: devant l’arche
  rationale: Rendu spatial direct, idiomatique et clair en français moderne.
- source_word: מְזַבְּחִים
  choice: sacrifiaient
  rationale: L’imparfait rend l’action en cours exprimée par le participe hébreu.
- source_word: צֹאן וּבָקָר
  choice: du petit bétail et des bovins
  rationale: « Petit bétail » conserve l’étendue de צֹאן, qui peut comprendre moutons et chèvres, tandis que « bovins » rend précisément בָּקָר.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: qu’on ne pouvait ni les compter ni les dénombrer
  rationale: Les deux verbes quasi synonymes sont maintenus afin de préserver l’insistance de l’hébreu.
- source_word: מֵרֹב
  choice: en si grand nombre
  rationale: Cette tournure française exprime clairement que leur multitude rendait le dénombrement impossible.
theological_decisions:
- issue: Rapport de l’assemblée à Salomon dans עָלָיו
  choice: réunie auprès de lui
  alternative: réunie avec lui / autour de lui / devant lui
  rationale: Le contexte permet plusieurs nuances spatiales ou associatives. Le texte principal adopte une expression française souple, et la note conserve explicitement l’ambiguïté sans lui donner une portée doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement narratif de l’hébreu, l’aspect continu des sacrifices et le doublet emphatique « compter… dénombrer », tout en évitant les tournures vieillies comme « menu et gros bétail ».
