  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: fr
  text: 'Il arriva que, lorsque les trompettistes et les chanteurs, à l’unisson[a], firent entendre une seule voix pour louer Yahweh et lui rendre grâce, et qu’ils élevèrent la voix avec les trompettes, les cymbales et les instruments de musique, en louant Yahweh[b] : « Car il est bon, car son amour fidèle[c] dure pour toujours », la maison, la maison de Yahweh, fut remplie d’une nuée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un seul ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu n’emploie pas ici de verbe signifiant « dire » ; la formule qui suit est directement rattachée à l’action de louer.
    reason: source_ambiguity
  - marker: c
    text: L’hébreu ḥésed désigne un amour constant et loyal ; on le traduit aussi par « bonté » ou « miséricorde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֶחָד
  choice: unis comme un seul homme
  rationale: Conserve l’image de l’unité collective et prépare la mention d’« une seule voix »; la note signale l’alternative idiomatique.
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: firent entendre une seule voix
  rationale: Rend concrètement l’unité sonore. « Voix » convient ici au son conjoint des chanteurs et des instrumentistes, tout en faisant écho à l’expression suivante.
- source_word: לְהַלֵּל וּלְהֹדוֹת
  choice: pour louer Yahweh et lui rendre grâce
  rationale: Distingue les deux actions, la louange et l’action de grâce, dans un français courant et digne.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: au son des trompettes, des cymbales et des instruments de musique
  rationale: Expression française naturelle qui conserve les trois catégories d’accompagnement musical.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: Exprime à la fois l’amour, la loyauté et la constance de חֶסֶד sans recourir à un terme archaïque ni réduire le mot à la seule compassion.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: la maison, la maison de Yahweh, fut remplie d’une nuée
  rationale: Maintient la reprise appositionnelle de « maison » et l’indétermination de « nuée » dans l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de חֶסֶד dans la formule liturgique
  choice: amour fidèle
  alternative: bonté / miséricorde
  rationale: « Amour fidèle » garde ensemble la bienveillance durable et la loyauté relationnelle du terme, sans imposer une définition confessionnelle plus étroite.
- issue: Introduction de la citation liturgique
  choice: ponctuation après « en louant Yahweh », sans ajouter « ils disaient » au texte
  alternative: en louant Yahweh et en disant
  rationale: L’hébreu juxtapose directement la formule à l’action de louer sans verbe explicite de parole; la ponctuation rend la citation intelligible tout en préservant cette particularité.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La longue période conserve le mouvement syntaxique solennel de l’hébreu, tandis que « au son de » et « lui rendre grâce » assurent une lecture naturelle. La répétition « la maison, la maison de Yahweh » est volontairement maintenue pour refléter l’emphase de la source.
