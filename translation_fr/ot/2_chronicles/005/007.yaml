  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: fr
  text: Alors les prêtres apportèrent l’arche de l’alliance de Yahweh à sa place, dans le sanctuaire intérieur du Temple, dans le lieu très saint[a], sous les ailes des chérubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Saint des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: apportèrent
  rationale: Le hifil de בוא signifie couramment « faire venir, apporter ». Le passé simple convient au récit suivi et n’ajoute aucune précision absente du verbe.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Traduction directe du nom défini au pluriel.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: 'Cette formulation conserve explicitement la chaîne de relation : l’arche, l’alliance et le nom divin.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française intelligible du nom divin, plutôt que son remplacement par un titre.
- source_word: מְקוֹמוֹ
  choice: à sa place
  rationale: Le suffixe renvoie naturellement à l’arche ; la formulation reste concise et ne précise pas davantage la nature de cet emplacement.
- source_word: דְּבִיר הַבַּיִת
  choice: dans le sanctuaire intérieur du Temple
  rationale: דְּבִיר désigne la chambre la plus intérieure du sanctuaire. Dans ce contexte, הַבַּיִת désigne le Temple ; le rendre ainsi évite l’ambiguïté peu naturelle de « la maison » en français moderne.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: dans le lieu très saint
  rationale: La construction hébraïque exprime le degré suprême de sainteté. « Le lieu très saint » est clair en français moderne, tandis que la formulation traditionnelle est signalée en note.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: sous les ailes des chérubins
  rationale: Rendu direct de la préposition, du pluriel construit « ailes de » et du terme traditionnel désignant les chérubins.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le nom propre divin. « Yahweh » le conserve comme nom, sans lui substituer un titre.
- issue: Désignation de la chambre la plus sainte
  choice: le lieu très saint
  alternative: le Saint des saints
  rationale: Les deux rendent le superlatif hébraïque קֹדֶשׁ הַקְּדָשִׁים. Le texte principal privilégie une expression transparente, et la note conserve la tournure traditionnelle sans modifier la portée cultuelle.
translation_notes:
  register: Français international actuel, narratif et digne. Le passé simple maintient le registre biblique sans archaïsme marqué. « Temple » explicite le référent contextuel de הַבַּיִת, tandis que les répétitions locatives de l’hébreu sont largement conservées.
