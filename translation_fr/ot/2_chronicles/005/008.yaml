source:
  edition: WLC
  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: fr
  text: Les chérubins déployaient leurs ailes au-dessus de l’emplacement de l’arche[a], et ils couvraient d’en haut l’arche et ses barres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étendaient leurs ailes au-dessus de la place de l’arche ».'
    reason: Alternative lexicale conservant plus littéralement la tournure hébraïque.
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים כְּנָפַיִם
  choice: déployaient leurs ailes
  rationale: La construction avec היה et le participe décrit une posture ou une action continue. « Déployaient leurs ailes » est naturel en français et conserve l’idée d’extension.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: « Chérubins » est le terme français traditionnel et précis pour ces êtres associés au sanctuaire, sans la nuance familière que peut avoir « angelots ».
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: au-dessus de l’emplacement de l’arche
  rationale: מָקוֹם signifie « lieu, emplacement ». Cette formulation maintient la distinction du texte entre l’emplacement de l’arche et l’arche elle-même, mentionnée ensuite.
- source_word: וַיְכַסּוּ
  choice: couvraient
  rationale: Le verbe כסה signifie couramment « couvrir ». L’imparfait s’accorde naturellement avec la description de la disposition permanente des chérubins.
- source_word: עַל הָאָרוֹן וְעַל בַּדָּיו
  choice: l’arche et ses barres
  rationale: Les בַּדִּים sont les barres servant au transport de l’arche. « Barres » est le terme courant et clair dans ce contexte cultuel.
- source_word: מִלְמָעְלָה
  choice: d’en haut
  rationale: 'Cette expression rend directement l’orientation indiquée par l’hébreu : l’arche et ses barres étaient couvertes par-dessus.'
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « les chérubins » est légèrement allégée par « ils » dans la seconde proposition, sans perte de référent. « Arche » est conservé comme terme biblique établi.
