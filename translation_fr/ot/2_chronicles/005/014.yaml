revisions:
- from: Les prêtres ne pouvaient pas rester debout pour accomplir leur service à cause de la nuée, car la gloire de Yahweh remplissait la maison de Dieu[a].
  to: Les prêtres ne pouvaient se tenir debout pour assurer le service, à cause de la nuée, car la gloire de Yahweh avait rempli la maison de Dieu[a].
  rationale: La révision remplace l’imparfait par le plus-que-parfait afin de refléter le remplissement accompli exprimé par l’hébreu et son rôle causal dans la scène. Elle allège aussi la formulation française du service sacerdotal, sans modifier le sens ni expliciter la nature de la gloire ou de la nuée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition principale rend fidèlement l’incapacité des prêtres, leur position debout, le service cultuel, la nuée et la gloire de Yahweh. Toutefois, « remplissait » (imparfait) affaiblit la forme accomplie de מָלֵא et présente le remplissement comme un procès en cours plutôt que comme le fait qui fonde l’incapacité décrite.
  naturalness: Le français est clair et d’un registre approprié. « Assurer le service » est légèrement plus idiomatique et plus concis que « accomplir leur service », tout en gardant le sens cultuel.
  terminology: « Nuée », « gloire de Yahweh » et « maison de Dieu » sont des choix exacts et convenables. La note conserve correctement « temple de Dieu » comme équivalent contextuel sans remplacer la formulation littérale dans le texte.
  issues:
  - severity: medium
    issue: Aspect de « remplissait »
    rationale: Le qatal מָלֵא exprime un remplissement accompli. Dans cette relation causale, « avait rempli » rend naturellement en français l’état résultant déjà établi, sans introduire l’idée d’une action encore en cours que suggère l’imparfait.
  - severity: low
    issue: Formulation du service sacerdotal
    rationale: « Accomplir leur service » est compréhensible, mais « assurer le service » est plus idiomatique en français moderne et conserve la référence au service cultuel sans ajouter d’interprétation.
  revised_text: Les prêtres ne pouvaient se tenir debout pour assurer le service, à cause de la nuée, car la gloire de Yahweh avait rempli la maison de Dieu[a].
  revised_footnotes:
  - marker: a
    text: Ou « le temple de Dieu ». Littéralement, « la maison de Dieu ».
    reason: lexical_alternative
  revision_rationale: La révision remplace l’imparfait par le plus-que-parfait afin de refléter le remplissement accompli exprimé par l’hébreu et son rôle causal dans la scène. Elle allège aussi la formulation française du service sacerdotal, sans modifier le sens ni expliciter la nature de la gloire ou de la nuée.
