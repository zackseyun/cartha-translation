  text: וְ/לֹא יָֽכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמ֥וֹד לְ/שָׁרֵ֖ת מִ/פְּנֵ֣י הֶ/עָנָ֑ן כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית הָ/אֱלֹהִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: fr
  text: Les prêtres ne pouvaient se tenir debout pour assurer le service, à cause de la nuée, car la gloire de Yahweh avait rempli la maison de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple de Dieu ». Littéralement, « la maison de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: pouvaient
  rationale: Le verbe exprime la capacité. « Ne pouvaient pas » rend directement l’incapacité des prêtres dans un français naturel.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Traduction directe du nom défini au pluriel désignant les prêtres affectés au service du sanctuaire.
- source_word: לַעֲמוֹד
  choice: rester debout
  rationale: עמד signifie littéralement « se tenir debout ». Dans ce contexte, « rester debout » exprime naturellement l’impossibilité de demeurer à leur poste sans perdre l’image concrète de l’hébreu.
- source_word: לְשָׁרֵת
  choice: pour accomplir leur service
  rationale: שרת désigne ici le service cultuel des prêtres. Cette formulation est claire en français moderne et conserve la portée liturgique du terme.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition exprime ici la cause de l’incapacité des prêtres.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français naturel et dignifié dans ce contexte de manifestation divine; il rend le nom défini sans explicitation supplémentaire.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de ce qui précède; « car » préserve clairement ce rapport logique.
- source_word: מָלֵא
  choice: remplissait
  rationale: L’imparfait décrit naturellement l’état qui explique pourquoi les prêtres ne pouvaient demeurer debout, sans imposer une antériorité absente de la forme hébraïque.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: La construction nominale est rendue directement, en conservant le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Rendu littéralement et naturellement. « Temple de Dieu » explicite correctement le référent contextuel, mais traduit de manière moins formelle l’image de la « maison ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Nature de la gloire divine remplissant le sanctuaire
  choice: la gloire de Yahweh remplissait la maison de Dieu
  alternative: la présence glorieuse de Yahweh remplissait le temple
  rationale: La traduction conserve l’expression concrète et théologiquement dense de l’hébreu sans l’expliquer ni identifier davantage la gloire à une notion interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Accomplir leur service » indique le contexte sacerdotal sans recourir au calque moins naturel « exercer un ministère ». La note est placée après « maison de Dieu », expression qu’elle explique.
