revisions:
- from: Alors Salomon rassembla à Jérusalem les anciens d’Israël, tous les chefs des tribus et les responsables des maisons ancestrales des Israélites, afin de faire monter l’arche de l’alliance de Yahweh depuis la Cité de David, c’est-à-dire Sion.
  to: Alors Salomon rassembla à Jérusalem les anciens d’Israël et tous les chefs des tribus, les responsables des maisons ancestrales des fils d’Israël, afin de faire monter l’arche de l’alliance de Yahweh depuis la Cité de David, c’est-à-dire Sion.
  rationale: La révision remplace la coordination indue par une apposition, afin de préserver la structure syntaxique et institutionnelle de l’hébreu. Elle rétablit aussi « fils d’Israël », expression généalogique explicitement présente dans le texte source, tout en gardant « maisons ancestrales », formulation française claire pour les maisons paternelles.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:21:25Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction restitue correctement la séquence narrative, la convocation à Jérusalem, le déplacement ascendant de l’arche, le nom Yahweh et l’identification de la Cité de David à Sion. Toutefois, la coordination française présente les « responsables des maisons ancestrales » comme un groupe supplémentaire, alors que נְשִׂיאֵי הָאָבוֹת est apposé aux « chefs des tribus » et les précise.
  naturalness: Le français est moderne, lisible et d’un registre approprié. La ponctuation appositive rendra à la fois plus nettement la syntaxe source et plus naturellement la hiérarchie institutionnelle.
  terminology: « Anciens d’Israël », « chefs des tribus », « arche de l’alliance de Yahweh », « Cité de David » et « Sion » sont appropriés. « Maisons ancestrales des fils d’Israël » conserve la structure de parenté et l’expression généalogique du texte, sans le calque opaque « maisons des pères ».
  issues:
  - severity: medium
    issue: La relation appositive entre « chefs des tribus » et « responsables des maisons ancestrales » n’est pas rendue.
    rationale: 'Le texte hébreu enchaîne « tous les chefs des tribus, les dirigeants des maisons paternelles des fils d’Israël » : le second syntagme précise le premier. La conjonction « et » dans le brouillon peut faire comprendre qu’il s’agit de deux corps distincts, en plus des anciens.'
  revised_text: Alors Salomon rassembla à Jérusalem les anciens d’Israël et tous les chefs des tribus, les responsables des maisons ancestrales des fils d’Israël, afin de faire monter l’arche de l’alliance de Yahweh depuis la Cité de David, c’est-à-dire Sion.
  revised_footnotes: []
