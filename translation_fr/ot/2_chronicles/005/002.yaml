source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: fr
  text: Alors Salomon rassembla à Jérusalem les anciens d’Israël et tous les chefs des tribus, les responsables des maisons ancestrales des fils d’Israël, afin de faire monter l’arche de l’alliance de Yahweh depuis la Cité de David, c’est-à-dire Sion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque naturellement en français la succession narrative introduite par l’adverbe temporel hébreu.
- source_word: יַקְהֵיל
  choice: rassembla
  rationale: Le hiphil de קהל signifie faire assembler; « rassembla » est direct, naturel et adapté à une convocation officielle.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Expression française consacrée qui désigne sans paraphrase le corps reconnu des dirigeants.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: tous les chefs des tribus
  rationale: Dans ce contexte institutionnel, מַטּוֹת désigne les tribus; « chefs » restitue la fonction de רָאשֵׁי.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: les responsables des maisons ancestrales
  rationale: Restitue les dirigeants des unités familiales patrilinéaires sans employer le calque français peu naturel « maisons des pères ».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: Dans cette construction institutionnelle, l’expression désigne le peuple d’Israël; « des Israélites » est moderne et évite l’ambiguïté française de « fils d’Israël », qui pourrait sembler exclure les femmes du peuple.
- source_word: אֶל יְרוּשָׁלָם
  choice: à Jérusalem
  rationale: Avec « rassembler », la préposition française « à » exprime naturellement le lieu vers lequel les responsables sont convoqués.
- source_word: לְהַעֲלוֹת
  choice: afin de faire monter
  rationale: Préserve la valeur causative et le mouvement ascendant de עלה vers le site de Jérusalem.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Reproduit clairement la chaîne construite hébraïque et sa portée covenantale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: מֵעִיר דָּוִיד
  choice: depuis la Cité de David
  rationale: « Depuis » indique nettement le point de départ du transfert; la majuscule marque le toponyme établi.
- source_word: הִיא צִיּוֹן
  choice: c’est-à-dire Sion
  rationale: Rend l’identification appositionnelle entre la Cité de David et Sion de façon idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; sa transcription conserve le nom personnel et l’enjeu d’alliance.
- issue: Représentation de la structure de parenté d’Israël
  choice: « maisons ancestrales des Israélites »
  alternative: « maisons des pères des fils d’Israël »
  rationale: Le choix conserve l’organisation ancestrale et tribale visée par le texte tout en évitant, en français actuel, un calque opaque ou une restriction involontaire aux seuls hommes.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit l’ordre narratif hébreu sans lourdeur; le vocabulaire institutionnel demeure précis et l’expression « faire monter » conserve la dimension spatiale du transfert de l’arche.
