base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: fr
  text: Il n’y avait rien dans l’arche, sauf les deux tablettes que Moïse avait déposées à l’Horeb[a], où Yahweh avait conclu une alliance avec les Israélites[b] lors de leur sortie d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les deux tablettes que Moïse avait données à l’Horeb ». Dans ce contexte, le verbe hébreu, littéralement « donner », est compris comme désignant le fait de placer les tablettes dans l’arche.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Il n’y avait rien dans l’arche, sauf
  rationale: La tournure existentielle négative suivie de « sauf » rend naturellement en français la construction hébraïque אֵין… רַק, qui affirme qu’aucun autre objet ne se trouvait dans l’arche.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: les deux tablettes
  rationale: « Tablettes » rend לֻחוֹת dans un français actuel sans ajouter « de pierre », précision absente de ce verset.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: que Moïse y avait déposées
  rationale: Le verbe נָתַן signifie couramment « donner », mais peut exprimer ici l’action de mettre ou déposer les tablettes dans l’arche. « y » explicite sobrement le lieu déjà mentionné.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: Le nom hébreu Horeb est conservé plutôt que remplacé par Sinaï; l’article correspond à l’usage français traditionnel pour ce massif ou lieu.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: lorsque Yahweh avait conclu une alliance avec
  rationale: כָּרַת, littéralement « couper », appartient à l’expression idiomatique de conclusion d’une alliance. Le nom « alliance », sous-entendu dans l’hébreu, doit être exprimé en français. « lorsque » relie naturellement l’événement à l’Horeb sans forcer le relatif hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective moderne rend idiomatiquement « les fils d’Israël » sans limiter le groupe aux hommes.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: à leur sortie d’Égypte
  rationale: La construction prépositionnelle avec infinitif est rendue par une expression temporelle concise qui conserve la référence à l’exode.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom divin au lieu de le remplacer par un titre.
- issue: Alliance sous-entendue après כָּרַת
  choice: avait conclu une alliance
  alternative: avait conclu avec / avait coupé avec
  rationale: L’hébreu omet ici le nom בְּרִית, mais l’expression renvoie clairement à l’alliance conclue avec Israël. L’expliciter est nécessaire pour produire une phrase française intelligible sans modifier la portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le nom Horeb et le nom divin Yahweh, évite d’ajouter que les tablettes étaient en pierre et garde l’allusion à l’alliance explicitement requise par l’idiome hébreu.
