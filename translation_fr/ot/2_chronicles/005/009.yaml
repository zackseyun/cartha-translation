base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: fr
  text: On allongea les barres, de sorte que leurs extrémités dépassaient de l’arche, devant le sanctuaire intérieur[a], mais elles ne se voyaient pas de l’extérieur. Elles y sont encore aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le lieu très saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: On avait allongé
  rationale: Le hiphil de ארך exprime ici une action causative. Le plus-que-parfait situe naturellement cette action avant le constat de visibilité dans le récit.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: Dans le contexte de l’arche, בַּדִּים désigne les longues pièces servant à son transport. « Barres » est courant, clair et moins susceptible que « perches » d’évoquer des objets légers.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: leurs extrémités
  rationale: רָאשֵׁי signifie littéralement « têtes », mais désigne ici les bouts des barres. « Leurs extrémités » rend naturellement l’image physique en français.
- source_word: מִן הָאָרוֹן
  choice: depuis l’arche
  rationale: מִן indique le point à partir duquel les extrémités étaient visibles. « Depuis l’arche » conserve cette relation spatiale sans préciser davantage le mécanisme.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: devant le sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce la plus intérieure du Temple, et עַל־פְּנֵי exprime ici une position en avant ou en face. Cette formulation reste architecturale et transparente.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: mais elles ne se voyaient pas de l’extérieur
  rationale: La tournure pronominale française rend naturellement le niphal de ראה et maintient le contraste entre visibilité intérieure et invisibilité depuis l’extérieur.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: Elles sont restées là jusqu’à ce jour
  rationale: Le singulier hébreu est une tournure existentielle dont le référent contextuel est pluriel. Le passé composé avec « jusqu’à ce jour » exprime la continuité jusqu’au temps du narrateur.
theological_decisions:
- issue: Sens de הַדְּבִיר
  choice: le sanctuaire intérieur
  alternative: le lieu très saint
  rationale: Le terme architectural « sanctuaire intérieur » traduit directement la pièce concernée sans imposer une appellation cultuelle particulière; l’autre rendu traditionnel est signalé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche de la progression hébraïque tout en évitant les calques peu naturels. Le référent exact de certaines indications spatiales n’est pas explicité au-delà du texte source.
