revisions:
- from: On avait allongé les barres, de sorte que leurs extrémités étaient visibles depuis l’arche, devant le sanctuaire intérieur[a], mais elles ne se voyaient pas de l’extérieur. Elles sont restées là jusqu’à ce jour.
  to: On allongea les barres, de sorte que leurs extrémités dépassaient de l’arche, devant le sanctuaire intérieur[a], mais elles ne se voyaient pas de l’extérieur. Elles y sont encore aujourd’hui.
  rationale: La révision élimine l’ambiguïté de « depuis l’arche » en exprimant directement que les extrémités des barres en dépassaient. Elle adopte une narration française plus directe et rend l’idiome final par un présent qui maintient la situation au temps du rédacteur, sans changer le sens du passage ni résoudre davantage ses détails spatiaux.
