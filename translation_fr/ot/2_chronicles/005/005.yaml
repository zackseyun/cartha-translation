source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: fr
  text: Ils firent monter l’arche, la tente de la rencontre et tous les objets sacrés qui se trouvaient dans la tente ; les prêtres lévites[a] les firent monter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « les prêtres, les lévites ».'
    reason: La syntaxe hébraïque juxtapose les deux groupes nominaux et peut être rendue de façon appositionnelle.
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: firent monter
  rationale: Le hifil de עלה exprime ici le fait de faire monter ou de transporter vers un lieu plus élevé. La répétition de « firent monter » reproduit celle de l’hébreu et conserve son insistance.
- source_word: הָאָרוֹן
  choice: l’arche
  rationale: Le texte porte simplement « l’arche », sans l’ajout « de l’alliance ».
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression rend directement les deux éléments du syntagme hébreu tout en restant claire et usuelle en français biblique moderne.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: tous les objets sacrés
  rationale: כְּלִים désigne largement des objets, récipients ou accessoires. « Objets sacrés » convient au contexte sans restreindre indûment le sens.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: qui se trouvaient dans la tente
  rationale: Cette formulation française naturelle indique l’emplacement des objets et reprend « tente » de manière cohérente.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  rationale: Cette formulation française concise identifie les prêtres comme lévites sans suggérer que tous les lévites étaient prêtres. Une note conserve la construction appositionnelle plus littérale.
theological_decisions:
- issue: Rapport entre « les prêtres » et « les lévites » dans הַכֹּהֲנִים הַלְוִיִּם
  choice: les prêtres lévites
  alternative: les prêtres, les lévites
  rationale: Le choix principal se lit naturellement comme une désignation des prêtres appartenant à la tribu de Lévi, tandis que la note préserve la forme appositionnelle de l’hébreu et son éventuelle ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule maintient la reprise insistante du verbe dans la seconde proposition. Le vocabulaire évite aussi bien l’archaïsme « ustensiles saints » qu’une explicitation absente du texte source.
