  verdict: revise
  source_fidelity: Le texte rend fidèlement la progression du verset, l’achèvement des travaux, les biens sacrés associés à David, ainsi que la variation entre « maison de Yahweh » et « maison de Dieu ». « Y apporta » exprime bien le mouvement impliqué par le hiphil de בוא.
  naturalness: Le français est fluide, moderne et d’un registre narratif digne. Le passé simple est approprié. Il convient toutefois de remplacer « trésors », qui désigne habituellement les biens précieux eux-mêmes, par une expression désignant les lieux de dépôt.
  terminology: « Yahweh », « maison », « objets sacrés » et « ustensiles » conviennent au contexte et préservent les distinctions du texte hébreu. « Salles du trésor » rend plus précisément אֹצְרוֹת, des locaux ou dépôts, au pluriel.
