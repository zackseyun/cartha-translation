source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: fr
  text: 'Ainsi fut achevé tout le travail que Salomon avait fait pour la maison de Yahweh. Puis Salomon y apporta les objets sacrés de David, son père[a] : l’argent, l’or et tous les ustensiles. Il les plaça dans les salles du trésor de la maison de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les objets que David, son père, avait consacrés », ou « les objets consacrés de David, son père ».'
    reason: La construction קָדְשֵׁי דָּוִיד peut désigner les biens sacrés associés à David ou ceux qu’il avait lui-même voués au sanctuaire.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: fut achevé
  rationale: Le verbe שלם exprime ici l’achèvement de l’ensemble des travaux. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: כָּל הַמְּלָאכָה
  choice: tout le travail
  rationale: מְלָאכָה désigne ici l’ensemble de l’entreprise de construction et d’aménagement du sanctuaire ; « tout le travail » en conserve l’ampleur sans préciser excessivement.
- source_word: לְבֵית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » préserve l’image hébraïque plutôt que de la remplacer par « temple », et la préposition « pour » rend naturellement le lamed de destination ou de référence.
- source_word: וַיָּבֵא
  choice: y apporta
  rationale: Le hiphil de בוא signifie faire venir ou apporter. Le pronom adverbial « y » explicite naturellement en français la destination déjà mentionnée, sans ajouter un nouveau référent.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: les objets sacrés de David, son père
  rationale: 'Le pluriel construit קָדְשֵׁי désigne des biens sacrés ou consacrés. « Objets sacrés » reste proche du sens lexical, tandis qu’une note conserve l’autre lecture naturelle : des objets consacrés par David.'
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: l’argent, l’or
  rationale: La reprise des articles et des marqueurs d’objet donne une énumération appuyée ; la formulation française en liste en reproduit la cadence.
- source_word: כָּל הַכֵּלִים
  choice: tous les ustensiles
  rationale: כֵּלִים est un terme large pour des objets ou instruments. Dans le contexte cultuel, « ustensiles » est naturel, précis et moins archaïque que « vases ».
- source_word: נָתַן
  choice: Il les plaça
  rationale: נתן peut signifier mettre ou placer. « Placer » rend clairement le rangement des biens dans les réserves et le pronom reprend l’ensemble de l’énumération.
- source_word: בְּאֹצְרוֹת
  choice: dans les trésors
  rationale: Le pluriel אֹצְרוֹת peut désigner plusieurs réserves ou chambres où étaient conservés les biens précieux. « Trésors » maintient ce pluriel et le registre du sanctuaire.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction préserve à la fois l’image de la « maison » et la variation du texte hébreu entre Yahweh au début du verset et Dieu à la fin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre et le distingue de אֱלֹהִים, traduit plus loin par « Dieu ».
- issue: Variation entre בֵּית יְהוָה et בֵּית הָאֱלֹהִים
  choice: maison de Yahweh / maison de Dieu
  alternative: uniformiser les deux en « temple »
  rationale: Conserver les deux formulations respecte la variation lexicale et théologique de l’hébreu sans supposer qu’elle soit dépourvue de portée.
- issue: Relation exprimée par קָדְשֵׁי דָּוִיד
  choice: objets sacrés de David
  alternative: objets consacrés par David
  rationale: La construction génitive permet de comprendre qu’il s’agit de biens sacrés appartenant à David, provenant de lui ou consacrés par lui. Le texte principal garde la formulation la moins explicative et la note signale l’interprétation active.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le récit historique. Les répétitions « maison de Yahweh » et « maison de Dieu » sont volontairement conservées ; le vocabulaire évite à la fois l’archaïsme inutile et la paraphrase explicative.
