  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: fr
  text: Tous les hommes d’Israël se rassemblèrent auprès du roi lors de la fête, au septième mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: L’expression hébraïque emploie « homme » au singulier dans un sens distributif et collectif ; le pluriel français restitue naturellement l’ensemble des hommes d’Israël.
- source_word: אֶל הַמֶּלֶךְ
  choice: auprès du roi
  rationale: La préposition אֶל indique ici le mouvement et le rassemblement en direction du roi ; « auprès du roi » exprime idiomatiquement leur réunion autour de lui.
- source_word: בֶּחָג
  choice: pour la fête
  rationale: חַג désigne une fête religieuse ou un pèlerinage festif. Le texte ne précise pas ici son nom ; « la fête » préserve cette formulation sans ajouter « des Tentes » depuis le contexte.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: c’est-à-dire au septième mois
  rationale: La proposition identifie ou précise le moment de la fête. « C’est-à-dire » rend clairement sa valeur explicative en français, tandis que « au » explicite la relation temporelle requise par l’usage français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit historique écrit. Aucun ajout confessionnel ni aucune identification contextuelle de la fête n’ont été introduits.
