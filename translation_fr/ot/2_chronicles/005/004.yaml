  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/לְוִיִּ֖ם אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: fr
  text: Tous les anciens d’Israël arrivèrent, et les Lévites portèrent l’arche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’arche de l’alliance, comme l’indique clairement le contexte environnant.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: arrivèrent
  rationale: Le wayyiqtol de בוא fait progresser le récit. « Arrivèrent » exprime naturellement en français leur venue au lieu indiqué par le contexte.
- source_word: כֹּל
  choice: tous
  rationale: Le terme englobe l’ensemble des anciens d’Israël et conserve la portée exhaustive de l’hébreu.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Cette formulation idiomatique désigne les responsables reconnus du peuple tout en reproduisant clairement la relation construite en hébreu.
- source_word: וַיִּשְׂאוּ
  choice: portèrent
  rationale: Dans ce contexte, נשׂא décrit le transport de l’arche. « Portèrent » est précis, naturel et digne en français moderne.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: C’est la désignation française conventionnelle et exacte de ce groupe tribal et cultuel.
- source_word: אֶת הָאָרוֹן
  choice: l’arche
  rationale: Le texte hébreu dit simplement « l’arche ». Le contexte l’identifie comme l’arche de l’alliance, mais cette précision n’est pas ajoutée au texte principal.
theological_decisions:
- issue: Identité de « l’arche »
  choice: Traduire simplement par « l’arche » dans le texte principal.
  alternative: « l’arche de l’alliance »
  rationale: L’hébreu porte seulement הָאָרוֹן (« l’arche »). La traduction préserve cette formulation, tandis qu’une note explicite le référent rendu évident par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration historique écrite. Le marqueur de note est placé après « l’arche », terme qu’il explicite.
