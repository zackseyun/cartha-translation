translation_notes:
  register: Français international moderne, digne et lisible. La phrase hébraïque très chargée est répartie en trois phrases afin de clarifier les groupes et les actions sans retrancher d’information. Les tirets encadrent l’apposition énumérative. Le marqueur [a] est placé après « harpes », conformément au contenu réel de la note lexicale.
