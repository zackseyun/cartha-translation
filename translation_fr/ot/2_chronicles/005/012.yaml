base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: fr
  text: 'Les lévites qui étaient les chanteurs — tous : Asaph, Héman, Yedoutoun, leurs fils et leurs frères — étaient vêtus de lin fin. Munis de cymbales, de harpes[a] et de lyres, ils se tenaient à l’est de l’autel[b]. Avec eux se trouvaient cent vingt prêtres qui jouaient des trompettes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’instruments semblables à des harpes » ; la distinction précise entre les anciens instruments à cordes mentionnés ici est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « du côté est de l’autel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: les lévites qui étaient chantres
  rationale: Le participe avec l’article définit les lévites par leur fonction. « Chantres » est actuel dans un contexte cultuel et plus précis que le simple « chanteurs ».
- source_word: לְכֻלָּם
  choice: tous autant qu’ils étaient
  rationale: Cette tournure française souligne que l’ensemble du groupe est inclus, tout en permettant l’apposition qui suit.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Asaph, Héman, Yedoutoun
  rationale: Translittération française courante des noms propres hébreux.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: leurs fils et leurs frères
  rationale: Conserve les termes familiaux du texte, sans les élargir interprétativement à « parents » ou « membres de leur clan ».
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: étaient vêtus de fin lin
  rationale: Rend le participe passif et la qualité de l’étoffe associée aux cadres sacrés ou royaux.
- source_word: בִּמְצִלְתַּיִם וּבִנְבָלִים וְכִנֹּרוֹת
  choice: Munis de cymbales, de harpes et de lyres
  rationale: « Munis de » exprime naturellement la valeur instrumentale de la préposition. Les équivalents conventionnels distinguent les deux types anciens d’instruments à cordes, dont l’identification précise reste incertaine.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: ils se tenaient à l’est de l’autel
  rationale: Rend clairement la position du groupe sans décider si מִזְרָח désigne strictement un côté ou une orientation relative.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: Avec eux se trouvaient cent vingt prêtres
  rationale: Explicite en français la copule sous-entendue et conserve le nombre exact.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: qui sonnaient de la trompette
  rationale: Rend idiomatiquement le participe dénominatif et son complément instrumental, tout en conservant l’action musicale continue.
