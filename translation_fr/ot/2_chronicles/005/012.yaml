    rationale: Le texte hébreu porte בַּחֲצֹצְרוֹת, « avec/des trompettes », au pluriel. Le français doit le refléter.
  - severity: low
    issue: « chantres » et « tous autant qu’ils étaient » donnent un style plus daté ou lourd que nécessaire.
    rationale: Pour un français international moderne, « chanteurs » et « tous » sont plus naturels sans perte de sens.
