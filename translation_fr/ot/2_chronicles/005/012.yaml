revisions:
- from: Les lévites qui étaient chantres — tous autant qu’ils étaient, Asaph, Héman, Yedoutoun, leurs fils et leurs frères — étaient vêtus de fin lin. Munis de cymbales, de harpes[a] et de lyres, ils se tenaient à l’est de l’autel[b]. Avec eux se trouvaient cent vingt prêtres qui sonnaient de la trompette.
  to: 'Les lévites qui étaient les chanteurs — tous : Asaph, Héman, Yedoutoun, leurs fils et leurs frères — étaient vêtus de lin fin. Munis de cymbales, de harpes[a] et de lyres, ils se tenaient à l’est de l’autel[b]. Avec eux se trouvaient cent vingt prêtres qui jouaient des trompettes.'
  rationale: La révision modernise légèrement le registre, conserve l’énumération inclusive et la structure du verset, et corrige le pluriel des trompettes conformément au texte hébreu. Les deux ancres de notes restent placées sur les expressions auxquelles elles se rapportent.
