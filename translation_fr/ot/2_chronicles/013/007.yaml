source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: fr
  text: Des hommes sans valeur, des fils de Bélial[a], se rassemblèrent autour de lui et prirent le dessus sur Roboam, fils de Salomon. Roboam était alors jeune et manquait de courage, et il ne sut pas leur tenir tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vauriens » ou « des hommes pervers »; littéralement « des fils de Bélial ».
    reason: Préserver l’ambiguïté entre la locution hébraïque descriptive et l’éventuel emploi de Bélial comme nom personnifié.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: se rassemblèrent autour de lui
  rationale: Le verbe קבץ avec עַל peut évoquer un rassemblement autour de quelqu’un ou contre lui. Ici, ces hommes se rallient à Jéroboam tout en s’opposant à Roboam; « autour de lui » conserve cette image et l’ambiguïté relationnelle.
- source_word: אֲנָשִׁים רֵקִים
  choice: des hommes sans valeur
  rationale: רֵקִים signifie littéralement « vides », mais qualifie ici des hommes jugés dépourvus de valeur morale ou sociale. « Sans valeur » garde cette appréciation péjorative dans un français actuel.
- source_word: בְּנֵי בְלִיַּעַל
  choice: des fils de Bélial
  rationale: La traduction littérale conserve l’ambiguïté entre un nom propre personnifié et une expression désignant la perversité ou la vauriennerie. La note fournit le sens idiomatique.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: prirent le dessus sur
  rationale: La forme réfléchie de אמץ exprime ici le fait de se montrer fort face à Roboam et de l’emporter sur lui. « Prirent le dessus sur » rend naturellement cette force comparative sans nier l’idée de fermeté.
- source_word: נַעַר
  choice: jeune
  rationale: נַעַר peut désigner un garçon ou un jeune homme, mais Roboam n’était pas littéralement un enfant. Dans le discours d’Abiya, le terme souligne plutôt sa jeunesse ou son inexpérience relative.
- source_word: רַךְ לֵבָב
  choice: manquait de courage
  rationale: L’expression signifie littéralement « tendre/faible de cœur ». Dans ce contexte politique, elle indique un manque de résolution plutôt que de la compassion.
- source_word: לֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: il ne sut pas leur tenir tête
  rationale: Littéralement, Roboam « ne se fortifia pas devant eux ». L’expression française choisie communique son incapacité à s’affermir et à leur résister, tout en laissant entendre un défaut de résolution.
theological_decisions:
- issue: Interprétation de בְּנֵי בְלִיַּעַל
  choice: des fils de Bélial
  alternative: des vauriens / des hommes pervers
  rationale: Le maintien de la tournure littérale évite de trancher si Bélial est ici un nom personnifié ou un terme abstrait qualifiant la perversité. Une note donne l’équivalent idiomatique.
- issue: Portée de וַיִּתְאַמְּצוּ עַל
  choice: prirent le dessus sur
  alternative: s’affermirent contre
  rationale: Le contexte présente les partisans de Jéroboam comme plus forts que Roboam. Cette formulation française exprime l’issue de leur opposition sans transformer le verset en jugement doctrinal sur la légitimité des protagonistes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour la lisibilité. « Roboam » et « Bélial » suivent les formes françaises bibliques usuelles; la répétition hébraïque de la racine אמץ est rendue par deux expressions naturelles distinctes.
