base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: fr
  text: Abiya s’endormit avec ses ancêtres, et on l’enterra dans la Cité de David. Son fils Asa régna à sa place. De son temps, le pays connut dix années de repos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : resta tranquille pendant dix ans.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: s’endormit avec ses ancêtres
  rationale: Cette formulation conserve l’image de l’expression funéraire hébraïque tout en employant « ancêtres », plus naturel et immédiatement compréhensible en français moderne que « pères » dans ce contexte.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: on l’enterra
  rationale: Le pronom indéfini « on » rend naturellement en français le pluriel actif hébreu dont le sujet n’est pas précisé.
- source_word: בְּעִיר דָּוִיד
  choice: dans la Cité de David
  rationale: « Cité de David » est la désignation française traditionnelle de ce lieu et reflète directement la construction hébraïque.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe exprime l’exercice de la royauté. « Régna » est concis et n’ajoute pas de nuance initiale absente de l’hébreu.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression rend directement l’idée de succession dynastique.
- source_word: בְּיָמָיו
  choice: De son temps
  rationale: Cette tournure française naturelle reste proche du sens littéral « en ses jours », sans réduire explicitement la période à son seul règne.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: le pays connut […] le repos
  rationale: Le verbe évoque la tranquillité et l’absence de troubles. « Connaître le repos » conserve la tonalité biblique tout en restant intelligible; « pays » désigne naturellement le territoire concerné sans l’interpréter explicitement comme royaume.
- source_word: עֶשֶׂר שָׁנִים
  choice: dix années
  rationale: La durée est exprimée clairement et naturellement en français dans la construction « connut dix années de repos ».
