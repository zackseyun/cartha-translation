  text: וַ/יַּכּ֥וּ בָ/הֶ֛ם אֲבִיָּ֥ה וְ/עַמּ֖/וֹ מַכָּ֣ה רַבָּ֑ה וַ/יִּפְּל֤וּ חֲלָלִים֙ מִ/יִּשְׂרָאֵ֔ל חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִ֥ישׁ בָּחֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: fr
  text: Abiya et son peuple leur portèrent un rude coup[a], et cinq cent mille hommes d’élite[b] d’Israël tombèrent, tués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un grand coup ». Autres traductions possibles : « un coup sévère » ou « un grand massacre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « hommes choisis ». Le terme peut désigner des hommes sélectionnés, dans la force de l’âge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: leur infligèrent
  rationale: Dans ce contexte militaire, נכה avec ב exprime l’action de frapper l’adversaire. Avec מַכָּה comme complément interne, « infliger une défaite » rend naturellement la tournure en français sans anticiper le détail des morts donné ensuite.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: Abiya et son peuple
  rationale: עַם signifie littéralement « peuple ». Même s’il désigne ici les hommes qui accompagnent Abiya au combat, conserver « peuple » évite de réduire explicitement le groupe à l’armée.
- source_word: מַכָּה רַבָּה
  choice: une lourde défaite
  rationale: La locution signifie littéralement « un grand coup » et peut désigner une sévère défaite ou un grand massacre. « Lourde défaite » est idiomatique en français et préserve la progression vers le bilan humain de la proposition suivante.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: tombèrent, tués au combat
  rationale: נפל signifie « tomber », tandis que חֲלָלִים désigne des personnes tuées, particulièrement à la guerre. La formulation garde les deux éléments hébreux et précise naturellement le contexte militaire.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מן indique ici le groupe auquel appartenaient les victimes; « d’Israël » est concis et naturel.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: cinq cent mille
  rationale: Le nombre est rendu directement, sans réduction ni interprétation symbolique absente du texte.
- source_word: אִישׁ בָּחוּר
  choice: hommes d’élite
  rationale: בָּחוּר désigne ici des hommes choisis, dans la force de l’âge, employés comme combattants sélectionnés. « Hommes d’élite » exprime cette valeur militaire sans imposer l’idée distincte de bravoure.
theological_decisions:
- issue: Nombre très élevé de victimes dans le récit de bataille
  choice: Conserver « cinq cent mille » tel que l’indique le texte hébreu.
  alternative: Comprendre le nombre comme une hyperbole, modifier le chiffre ou interpréter אֶלֶף comme une unité sociale ou militaire.
  rationale: Le verset énonce directement ce nombre et ne fournit aucun indice interne exigeant une réduction ou une lecture symbolique. La traduction ne doit pas trancher implicitement les débats historiques ou textuels.
translation_notes:
  register: Français moderne, international et digne. « Leur infligèrent une lourde défaite » évite le calque peu naturel « les frappèrent d’un grand coup », tandis que « tombèrent, tués au combat » conserve la séquence et l’intensité du récit hébreu. Les marqueurs [a] et [b] figurent dans le texte principal.
