  text: וַ/יָּרִ֖יעוּ אִ֣ישׁ יְהוּדָ֑ה וַ/יְהִ֗י בְּ/הָרִ֨יעַ֙ אִ֣ישׁ יְהוּדָ֔ה וְ/הָ/אֱלֹהִ֗ים נָגַ֤ף אֶת יָֽרָבְעָם֙ וְ/כָל יִשְׂרָאֵ֔ל לִ/פְנֵ֥י אֲבִיָּ֖ה וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: fr
  text: Les hommes de Juda poussèrent un cri de guerre. Au moment où ils poussèrent ce cri, Dieu frappa Jéroboam et tout Israël devant Abiya et Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: poussèrent un cri de guerre / poussèrent ce cri
  rationale: Le verbe רוע, dans ce contexte militaire, désigne un grand cri collectif, vraisemblablement un cri de guerre. La reprise française conserve l’insistance de l’hébreu sans lourdeur excessive.
- source_word: נָגַף
  choice: frappa
  rationale: « Frapper » conserve la portée assez large du verbe hébreu, qui peut évoquer ici une défaite infligée par Dieu, sans préciser davantage que le texte source la manière dont elle survient.
- source_word: לִפְנֵי
  choice: devant
  rationale: La traduction littérale « devant » maintient la formulation relationnelle du texte hébreu et l’idée que Jéroboam et Israël furent frappés face à Abiya et Juda.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Cette translittération française reflète plus directement la forme hébraïque du nom et reste facile à lire.
theological_decisions:
- issue: Lien entre le cri de Juda et l’intervention divine
  choice: Au moment où ils poussèrent ce cri, Dieu frappa
  alternative: Parce qu’ils poussèrent ce cri, Dieu frappa
  rationale: La construction hébraïque marque clairement la simultanéité, mais n’explicite pas à elle seule un rapport causal. La traduction préserve cette retenue.
- issue: Agent de la défaite
  choice: Dieu frappa
  alternative: Juda vainquit avec l’aide de Dieu
  rationale: Le texte attribue directement l’action à Dieu; la traduction conserve cette affirmation sans la reformuler en simple assistance divine.
translation_notes:
  register: Français moderne, digne et accessible. « Cri de guerre » explicite naturellement le cadre militaire; la seconde occurrence est allégée par « ce cri » tout en conservant la répétition rhétorique du texte.
