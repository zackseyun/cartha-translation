source:
  edition: WLC
  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: fr
  text: Jéroboam ne conserva plus sa puissance du temps d’Abiya. Yahweh le frappa[a], et il mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’accabla » ou « le frappa d’un fléau ». L’hébreu dit seulement que Yahweh « frappa » Jéroboam, sans préciser de quelle manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: conserva sa puissance
  rationale: L’expression associe le verbe « retenir, conserver » au nom « force, puissance ». Cette formulation garde les deux éléments sans limiter le sens à une victoire militaire.
- source_word: לֹא … עוֹד
  choice: ne… plus
  rationale: Dans cette construction négative, עוֹד signifie naturellement « plus, désormais plus ».
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: du temps d’Abiya
  rationale: Expression temporelle courante désignant l’époque ou le règne d’Abiya, rendue ici dans un français naturel.
- source_word: וַיִּגְּפֵהוּ
  choice: le frappa
  rationale: Le verbe נגף peut désigner un coup, une atteinte, un fléau ou une défaite. « Frapper » préserve la portée générale du terme sans préciser le moyen employé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: La proposition narrative indique simplement l’événement suivant, sans imposer plus explicitement que l’hébreu un rapport causal immédiat.
theological_decisions:
- issue: Nature de l’action divine dans וַיִּגְּפֵהוּ יְהוָה
  choice: Le texte affirme que Yahweh frappa Jéroboam, puis que celui-ci mourut, sans préciser par quel moyen.
  alternative: Yahweh lui infligea une maladie, un fléau ou un coup mortel immédiat.
  rationale: L’hébreu attribue directement l’atteinte à Yahweh, mais ne permet pas d’en déterminer la forme exacte. La traduction maintient cette indétermination et conserve la simple succession narrative entre le coup et la mort.
translation_notes:
  register: Français moderne, sobre et digne. « Du temps d’Abiya » rend naturellement l’expression temporelle hébraïque. Le marqueur de note est placé après « frappa », terme auquel la note se rapporte.
