source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: fr
  text: Et maintenant, vous dites vouloir vous montrer forts face au royaume de Yahweh, qui est entre les mains des fils de David[a][b]. Vous êtes une foule immense, et vous avez avec vous les veaux d’or que Jéroboam a fabriqués pour vous comme dieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous dites vouloir vous fortifier devant le royaume de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la main des fils de David ». Ici, « fils » désigne les descendants de David, et l’image de la main évoque l’exercice du pouvoir par sa lignée.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « pour dieux »; l’hébreu emploie le pluriel à propos des veaux d’or de Jéroboam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: vous dites vouloir
  rationale: Le participe exprime ici une déclaration ou une intention présente. Cette formulation conserve le verbe « dire » tout en reliant naturellement en français l’infinitif qui suit.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: vous montrer forts face à
  rationale: Le hitpael de חזק évoque le fait de se rendre fort ou de faire preuve de force; לִפְנֵי signifie littéralement « devant, face à » et prend ici une valeur de confrontation. La traduction garde à la fois l’image de la force et celle du face-à-face.
- source_word: מַמְלֶכֶת יְהוָה
  choice: le royaume de Yahweh
  rationale: La formulation reste proche de l’hébreu et maintient l’affirmation théologique propre aux Chroniques selon laquelle le royaume appartient à Yahweh.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: entre les mains des fils de David
  rationale: Cette traduction conserve l’image hébraïque de la main, qui exprime ici l’exercice du pouvoir ou l’administration, sans réduire la tension entre le règne de Yahweh et sa mise en œuvre par la lignée davidique.
- source_word: הָמוֹן רָב
  choice: une foule immense
  rationale: L’expression souligne la supériorité numérique. « Une foule immense » est actuelle, claire et adaptée à la tonalité oratoire du passage.
- source_word: עֶגְלֵי זָהָב
  choice: les veaux d’or
  rationale: Expression française naturelle désignant clairement les objets cultuels bien connus établis par Jéroboam.
- source_word: לֵאלֹהִים
  choice: comme dieux
  rationale: 'Le pluriel hébreu est maintenu et la formulation conserve la portée polémique du discours: ces idoles ont été fabriquées afin d’occuper la place de dieux.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Rapport entre le royaume de Yahweh et la dynastie davidique
  choice: le royaume de Yahweh, qui est entre les mains des fils de David
  alternative: le royaume de Yahweh gouverné par les descendants de David
  rationale: 'La formulation retenue préserve l’image et la tension du texte: le royaume est celui de Yahweh, tout en étant administré par la lignée de David.'
- issue: Statut des veaux d’or
  choice: comme dieux
  alternative: pour servir de dieux
  rationale: La traduction garde le pluriel et la qualification polémique sans expliquer à la place du texte la nature exacte de la prétention cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la force rhétorique de l’adresse d’Abiya, ainsi que les images hébraïques de la confrontation et de la main, tout en explicitant leur sens dans les notes.
