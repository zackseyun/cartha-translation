source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: fr
  text: Nous offrons à Yahweh des holocaustes, matin après matin et soir après soir, ainsi que de l’encens aromatique ; nous disposons les pains[a] sur la table pure et allumons soir après soir les lampes du chandelier d’or. En effet, nous observons les prescriptions de Yahweh notre Dieu, tandis que vous, vous l’avez abandonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la disposition des pains ». On les appelle aussi « pains de proposition » ou « pains de la Présence ».'
    reason: Alternative lexicale et précision sur la formulation cultuelle hébraïque.
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: nous offrons
  rationale: Dans ce contexte sacrificiel, le hiphil de קטר désigne l’action de faire monter l’offrande en fumée. « Offrons » exprime naturellement l’acte cultuel, précisé par son objet, les holocaustes.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », conformément à sa fonction de nom propre dans le texte.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: « Holocaustes » est le terme français traditionnel et précis pour les sacrifices entièrement consumés désignés par עֹלָה.
- source_word: בַּבֹּקֶר בַּבֹּקֶר וּבָעֶרֶב בָּעֶרֶב
  choice: chaque matin et chaque soir
  rationale: La répétition hébraïque a une valeur distributive et exprime la régularité quotidienne. Cette formulation la restitue dans un français naturel.
- source_word: וּקְטֹרֶת סַמִּים
  choice: ainsi que de l’encens aromatique
  rationale: סַמִּים évoque les substances odoriférantes entrant dans la composition de l’encens. « Encens aromatique » est clair et idiomatique.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: nous disposons les pains
  rationale: Le nom מַעֲרֶכֶת évoque la disposition ordonnée des pains. La tournure verbale française conserve cette image sans imposer dans le texte principal une terminologie traditionnelle plus interprétative.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: sur la table pure
  rationale: Dans ce contexte cultuel, טָהוֹר renvoie à la pureté rituelle plutôt qu’à la simple propreté.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: nous allumons les lampes du chandelier d’or
  rationale: Cette formulation française explicite naturellement la fonction exprimée par l’infinitif לְבָעֵר, tout en conservant les lampes et le chandelier d’or comme éléments distincts.
- source_word: כִּי שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה אֱלֹהֵינוּ
  choice: Car nous assurons le service prescrit par Yahweh notre Dieu
  rationale: La combinaison de שׁמר et מִשְׁמֶרֶת signifie observer ou assurer une charge confiée. « Service prescrit » rend ici sa dimension cultuelle et obligatoire.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: tandis que vous, vous l’avez abandonné
  rationale: Le pronom indépendant אַתֶּם marque un contraste appuyé. La dislocation « vous, vous » le conserve naturellement en français.
theological_decisions:
- issue: Terminologie des pains du sanctuaire
  choice: les pains, avec une note indiquant littéralement leur disposition
  alternative: les pains de proposition ; les pains de la Présence
  rationale: Le texte hébreu parle de la « disposition des pains » et ne donne pas ici directement les appellations traditionnelles. Le texte principal reste naturel et proche de l’image hébraïque, tandis que la note conserve les équivalents cultuels reconnus.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; l’Éternel
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » préserve cette fonction et évite de le remplacer par un titre.
- issue: Nature de la מִשְׁמֶרֶת de Yahweh
  choice: le service prescrit par Yahweh
  alternative: la charge de Yahweh ; les observances de Yahweh
  rationale: Dans le contexte du service du temple, le terme désigne une responsabilité cultuelle à observer. La traduction garde à la fois l’idée de service et celle d’obligation sans l’identifier à une formulation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque très coordonnée est légèrement restructurée en trois phrases pour plus de clarté, sans supprimer les actes cultuels ni le contraste final. Les répétitions distributives sont rendues par « chaque matin » et « chaque soir ».
