  text: וַ/יִּתְחַזֵּ֣ק אֲבִיָּ֔הוּ וַ/יִּ֨שָּׂא ל֔/וֹ נָשִׁ֖ים אַרְבַּ֣ע עֶשְׂרֵ֑ה וַ/יּ֗וֹלֶד עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ בָּנִ֔ים וְ/שֵׁ֥שׁ עֶשְׂרֵ֖ה בָּנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: fr
  text: Abiya devint puissant[a]. Il prit quatorze femmes pour épouses[b] et engendra vingt-deux fils et seize filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devint fort » ou « se fortifia ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « prit pour lui quatorze femmes » ; il s’agit d’une expression désignant le fait de les épouser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: devint puissant
  rationale: Le hitpael de חזק exprime ici le fait de devenir fort, puissant ou bien établi. « Devint puissant » reste naturel en français et ne précise pas indûment s’il s’agit surtout de puissance militaire, politique ou personnelle.
- source_word: אֲבִיָּהוּ
  choice: Abiya
  rationale: « Abiya » est la forme française traditionnelle et aisément reconnaissable de ce nom propre hébreu.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: Il prit quatorze femmes pour épouses
  rationale: Avec נָשִׁים, le verbe נשׂא désigne ici le fait de prendre des femmes comme épouses. Cette formulation française exprime clairement l’idiome matrimonial tout en restant proche de l’hébreu.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: À cette forme, ילד, avec un homme pour sujet, signifie qu’il devint père ou engendra des enfants. « Engendra » conserve cette précision et convient au registre narratif.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: vingt-deux fils
  rationale: Rendu direct du nombre et du nom masculin précis employés dans le texte.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: et seize filles
  rationale: Rendu direct du nombre et du nom féminin précis employés dans le texte.
theological_decisions:
- issue: Description d’un mariage polygynique
  choice: Rapporter sans commentaire qu’Abiya prit quatorze femmes pour épouses.
  alternative: Employer une formulation comportant une approbation ou une condamnation implicite de cette pratique.
  rationale: Le verset rapporte le fait sans formuler ici de jugement moral explicite. La traduction ne doit donc ni approuver ni condamner ce que le texte se contente de raconter.
translation_notes:
  register: Français international moderne, clair et digne. « Devint puissant » préserve l’étendue de sens du verbe hébreu, tandis que « prit… pour épouses » explicite naturellement l’idiome sans ajouter de jugement.
