- from: Mais Jéroboam avait fait contourner l’embuscade pour qu’elle arrive derrière eux. Ainsi, les troupes de Jéroboam étaient devant Juda, et l’embuscade derrière lui.
  to: Mais Jéroboam avait fait passer l’embuscade par un détour pour qu’elle arrive derrière eux. Ainsi, les troupes de Jéroboam étaient devant Juda, et l’embuscade derrière eux.
