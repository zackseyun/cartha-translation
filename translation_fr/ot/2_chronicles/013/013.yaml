    rationale: Le texte hébreu porte מֵאַחֲרֵיהֶם, « derrière eux », en parallèle avec le premier « derrière eux ». Le pluriel renvoie collectivement aux forces de Juda ; il doit être conservé.
  - severity: low
    issue: « avait fait contourner l’embuscade » est légèrement lourd en français.
    rationale: La construction est possible, mais « avait fait passer l’embuscade par un détour » rend plus idiomatiquement l’idée causative de la manœuvre, sans ajouter de détail interprétatif.
  revised_text: Mais Jéroboam avait fait passer l’embuscade par un détour pour qu’elle arrive derrière eux. Ainsi, les troupes de Jéroboam étaient devant Juda, et l’embuscade derrière eux.
