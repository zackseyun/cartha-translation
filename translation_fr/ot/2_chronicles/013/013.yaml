  yaml_path: translation/ot/2_chronicles/013/013.yaml
  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: fr
  text: Mais Jéroboam avait fait passer l’embuscade par un détour pour qu’elle arrive derrière eux. Ainsi, les troupes de Jéroboam étaient devant Juda, et l’embuscade derrière eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu Yarov‘am.
- source_word: הֵסֵב אֶת־הַמַּאְרָב
  choice: avait fait contourner l’embuscade
  rationale: Le verbe causatif exprime la manœuvre par laquelle Jéroboam fait passer le détachement embusqué autour des Judéens afin de les prendre à revers.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: pour qu’elle arrive derrière eux
  rationale: Rend explicitement le but de la manœuvre tout en conservant l’image spatiale du texte hébreu.
- source_word: וַיִּהְיוּ לִפְנֵי יְהוּדָה
  choice: les troupes de Jéroboam étaient devant Juda
  rationale: Le sujet pluriel implicite renvoie naturellement aux forces principales de Jéroboam; l’explicitation évite en français de faire de « l’embuscade », singulier, l’antécédent du pluriel.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Dans ce contexte militaire collectif, « Juda » désigne l’armée ou les hommes du royaume de Juda.
theological_decisions: []
