base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: fr
  text: 'Abiya poursuivit Jéroboam et lui prit des villes : Béthel et les localités qui en dépendaient, Yeshana et les localités qui en dépendaient, ainsi qu’Éfrôn et les localités qui en dépendaient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: poursuivit
  rationale: Rend directement l’action de poursuivre quelqu’un, dans un français naturel et soutenu.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ עָרִים
  choice: lui prit plusieurs villes
  rationale: Exprime la capture de villes jusque-là détenues par Jéroboam; « plusieurs » restitue naturellement le pluriel indéfini sans suggérer la totalité.
- source_word: בְּנוֹתֶיהָ
  choice: les localités qui en dépendaient
  rationale: Littéralement « ses filles »; dans ce contexte territorial, l’expression désigne les localités rattachées à la ville principale. Cette formulation évite l’étrangeté du calque « villes-filles ».
- source_word: עפרון
  choice: Éfrôn
  rationale: Translittération du nom tel qu’il figure dans le texte massorétique, avec accent indiquant la syllabe finale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les toponymes sont translittérés; la relation administrative exprimée par l’hébreu « filles » est explicitée sans ajout doctrinal.
