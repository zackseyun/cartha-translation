  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: fr
  text: Les Israélites[a] s’enfuirent devant Juda, et Dieu les livra entre les mains de Juda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans leur main », expression hébraïque signifiant « en leur pouvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: s’enfuirent
  rationale: Le verbe נוּס désigne ici la fuite ou la retraite face à l’ennemi. « S’enfuirent » est naturel et précis dans ce contexte militaire.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais elle fonctionne couramment comme un nom collectif désignant les Israélites. La formulation retenue évite en français moderne l’idée trompeuse de fils directs.
- source_word: מִפְּנֵי יְהוּדָה
  choice: devant Juda
  rationale: מִפְּנֵי exprime ici la fuite face à l’adversaire. « Devant Juda » conserve la désignation collective et territoriale du texte hébreu sans ajouter explicitement « les hommes de ».
- source_word: וַיִּתְּנֵם
  choice: les livra
  rationale: Avec Dieu pour sujet et dans un récit de bataille, נתן suivi de « dans la main de » signifie remettre les adversaires au pouvoir de quelqu’un. « Livra » rend clairement cette portée sans atténuer l’action divine.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le texte emploie אֱלֹהִים et non le nom divin YHWH ; « Dieu » respecte cette distinction.
- source_word: בְּיָדָם
  choice: entre les mains de Juda
  rationale: Littéralement « dans leur main », cette expression idiomatique indique le pouvoir ou la domination. La reprise de « Juda » clarifie en français l’antécédent du suffixe pluriel, tandis que « entre les mains de » conserve l’image hébraïque.
theological_decisions:
- issue: Action divine dans l’issue de la bataille
  choice: Dieu les livra
  alternative: Dieu permit qu’ils tombent entre les mains de Juda
  rationale: Le verbe נתן attribue directement à Dieu l’issue militaire. La traduction conserve cette action directe au lieu de la réduire à une simple permission.
- issue: Désignation du peuple du royaume du Nord
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce contexte, בְנֵי יִשְׂרָאֵל désigne collectivement les combattants d’Israël. Le choix idiomatique français ne modifie pas leur identité historique et la forme littérale est signalée en note.
translation_notes:
  register: Français moderne, sobre et narratif. « Les Israélites » privilégie la compréhension immédiate ; « entre les mains de Juda » maintient l’image sémitique tout en supprimant une ambiguïté pronominale peu naturelle en français.
