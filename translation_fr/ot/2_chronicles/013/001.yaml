  text: בִּ/שְׁנַ֛ת שְׁמוֹנֶ֥ה עֶשְׂרֵ֖ה לַ/מֶּ֣לֶךְ יָרָבְעָ֑ם וַ/יִּמְלֹ֥ךְ אֲבִיָּ֖ה עַל יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/001.yaml
  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: fr
  text: La dix-huitième année du règne de Jéroboam[a], Abiya devint roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le récit parallèle de 1 Rois 15.1, Abiya est appelé « Abiyam » ; le texte des Chroniques porte ici « Abiya ».
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: La dix-huitième année du règne de
  rationale: La formule hébraïque date l'événement d'après l'année de règne du souverain. Cette tournure française est naturelle et explicite la valeur régnale de l'expression sans en modifier le sens.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: de Jéroboam
  rationale: Dans cette formule chronologique, la préposition ל indique le roi dont on compte les années de règne. Le titre est déjà exprimé par « du règne »; répéter « roi » serait inutile en français.
- source_word: וַ/יִּמְלֹךְ
  choice: devint roi
  rationale: La forme narrative de מלך marque ici l'accession à la royauté. « Devint roi » restitue clairement cette valeur ingressive en français moderne.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Translittération française usuelle de la forme אֲבִיָּה propre aux Chroniques, distincte de la variante Abiyam attestée dans le récit parallèle des Rois.
- source_word: עַל יְהוּדָה
  choice: de Juda
  rationale: Avec le verbe « devenir roi », le français idiomatique dit « roi de » pour désigner le territoire gouverné, là où l'hébreu emploie עַל, littéralement « sur ».
