  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: fr
  text: Ne savez-vous pas que Yahvé, le Dieu d’Israël, a donné pour toujours à David la royauté sur Israël, à lui et à ses fils[a], par une alliance de sel[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « ses fils » désigne la lignée royale de David, c’est-à-dire sa dynastie.
    reason: cultural_note
  - marker: b
    text: Ou « avec une alliance de sel ». Cette expression semble désigner une alliance contraignante et durable; voir Nombres 18.19.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: Ne savez-vous pas
  rationale: Cette question rhétorique attend une réponse affirmative et garde ici sa force d’interpellation en français naturel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque et l’identification de Yahvé comme Dieu d’Israël.
- source_word: נָתַן מַמְלָכָה לְדָוִיד עַל יִשְׂרָאֵל
  choice: a donné […] à David la royauté sur Israël
  rationale: Dans ce contexte dynastique, מַמְלָכָה désigne surtout la dignité et l’autorité royales accordées à David; « royauté » exprime cette nuance plus précisément que le seul territoire d’un royaume.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle qui conserve l’affirmation de durée indéfinie ou perpétuelle du texte.
- source_word: לוֹ וּלְבָנָיו
  choice: à lui et à ses fils
  rationale: Conserve le sens littéral de « fils », tandis qu’une note indique sa portée dynastique dans ce contexte.
- source_word: בְּרִית מֶלַח
  choice: par une alliance de sel
  rationale: La traduction littérale préserve l’image culturelle et théologique hébraïque sans réduire silencieusement l’expression à une seule interprétation.
theological_decisions:
- issue: Permanence de l’octroi davidique
  choice: Conserver à la fois « pour toujours » et « alliance de sel »
  alternative: Traduire interprétativement par « une alliance permanente »
  rationale: L’hébreu juxtapose explicitement לְעוֹלָם et בְּרִית מֶלַח. Garder les deux formulations respecte leur poids propre sans tirer dans la traduction des conclusions théologiques ultérieures.
- issue: Portée de « ses fils »
  choice: Traduire littéralement « ses fils » et préciser en note la portée dynastique
  alternative: Traduire directement « ses descendants » ou « sa dynastie »
  rationale: Le contexte concerne la succession royale, mais le texte emploie bien le mot « fils »; la note permet de rendre la portée sans effacer la forme du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant un tour artificiel. « Royauté » souligne le droit dynastique de régner; l’image inhabituelle de l’« alliance de sel » est volontairement conservée et expliquée en note.
