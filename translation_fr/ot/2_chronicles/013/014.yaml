reference: 2 Chronicles 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: fr
  text: Quand les hommes de Juda se retournèrent, voici que le combat était devant eux et derrière eux. Ils crièrent vers Yahweh, et les prêtres sonnaient des trompettes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: se retournèrent
  rationale: Le verbe פנה décrit ici le mouvement par lequel les combattants de Juda découvrent l’attaque venant aussi de l’arrière. « Se retournèrent » rend clairement cette action sans expliciter davantage que le texte.
- source_word: יְהוּדָה
  choice: les hommes de Juda
  rationale: Le nom collectif désigne ici l’armée ou les combattants de Juda. Cette formulation est naturelle en français et évite de faire du territoire lui-même le sujet de l’action.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve la fonction du marqueur hébreu, qui attire brusquement l’attention sur la situation découverte.
- source_word: הַמִּלְחָמָה
  choice: le combat
  rationale: Dans ce contexte, le mot désigne l’affrontement immédiat plutôt qu’une guerre prolongée.
- source_word: פָּנִים וְאָחוֹר
  choice: devant eux et derrière eux
  rationale: Rendu proche de l’expression hébraïque, qui indique que les hommes de Juda sont attaqués des deux côtés.
- source_word: וַיִּצְעֲקוּ
  choice: crièrent
  rationale: Le verbe exprime un appel pressant adressé à Dieu; « crier vers » garde à la fois son intensité et sa direction.
- source_word: לַיהוָה
  choice: vers Yahweh
  rationale: Le nom divin est translittéré conformément à l’usage du projet; la préposition « vers » convient à un cri d’appel ou de prière.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français direct et courant.
- source_word: מחצצרים
  choice: sonnaient
  rationale: La forme participiale présente l’action des prêtres comme en cours. L’imparfait français rend naturellement cette valeur durative.
- source_word: בַּחֲצֹצְרוֹת
  choice: des trompettes
  rationale: Le terme désigne les trompettes droites employées dans le culte et à la guerre. Le matériau n’étant pas précisé dans ce verset, il n’est pas ajouté.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom propre divin et suit la convention indiquée pour ce projet, sans introduire ici un titre de substitution.
translation_notes:
  register: Français international actuel, clair et digne. « Voici que » conserve la vivacité narrative de l’hébreu, tandis que l’imparfait « sonnaient » reflète l’action concomitante exprimée par le participe. La coordination par « et » est maintenue sans réduire l’action des prêtres à un simple arrière-plan.
