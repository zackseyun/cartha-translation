language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: fr
  text: Les Israélites furent donc soumis en ce temps-là, tandis que les gens de Juda l’emportèrent, parce qu’ils s’étaient appuyés sur Yahweh[a], le Dieu de leurs pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh représente le nom divin écrit YHWH en hébreu.
    reason: Informer le lecteur que « Yahweh » rend le nom propre de Dieu dans le texte source.
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: furent soumis
  rationale: Le niphal de כנע exprime ici le fait d’être abaissé ou placé sous domination. Dans ce contexte militaire, « furent soumis » conserve cette valeur passive sans préciser au-delà du texte l’ampleur de la défaite.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte collectif, l’expression hébraïque désigne les membres du royaume du Nord. « Les Israélites » est l’équivalent français naturel de l’idiome « fils d’Israël ».
- source_word: בָּעֵת הַהִיא
  choice: en ce temps-là
  rationale: Rendu idiomatique et précis de l’expression temporelle hébraïque.
- source_word: וַיֶּאֶמְצוּ
  choice: l’emportèrent
  rationale: Le verbe אמץ évoque la force ou le fait de devenir fort. En contexte de bataille, « l’emportèrent » exprime naturellement la supériorité qui en résulte, sans ajouter l’idée d’une destruction totale.
- source_word: בְנֵי יְהוּדָה
  choice: les gens de Juda
  rationale: L’expression désigne collectivement ceux qui appartiennent à Juda. « Les gens de Juda » reste naturel en français et évite de réduire explicitement le groupe aux seuls hommes, ce que le contexte permet mais que l’expression hébraïque n’impose pas à elle seule.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici clairement la raison pour laquelle Juda l’a emporté.
- source_word: נִשְׁעֲנוּ עַל
  choice: s’étaient appuyés sur
  rationale: שען avec על signifie littéralement « s’appuyer sur » et, par métaphore, compter sur quelqu’un. Le français conserve naturellement cette image. Le plus-que-parfait marque que cet appui explique l’issue déjà rapportée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin YHWH présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: Cette formulation conserve la référence masculine explicite aux pères ancestraux et la résonance historique et communautaire de l’expression.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin YHWH. « Yahweh » le rend directement et ne lui substitue pas le titre traditionnel « le SEIGNEUR ».
- issue: Rapport entre l’appui sur Dieu et la victoire de Juda
  choice: lien causal explicite avec « parce que »
  alternative: simple juxtaposition explicative avec « car »
  rationale: כִּי présente l’appui sur Yahweh comme la raison de l’issue favorable. La traduction conserve ce lien causal sans développer une doctrine générale sur la victoire militaire.
translation_notes:
  register: Français international actuel, digne et accessible. « Les Israélites » et « les gens de Juda » rendent naturellement les deux groupes collectifs; « s’étaient appuyés sur » conserve l’image hébraïque tout en exprimant clairement la confiance concrète placée en Dieu.
