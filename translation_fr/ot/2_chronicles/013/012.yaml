  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: fr
  text: 'Voici : Dieu est avec nous, à notre tête, et ses prêtres sont avec les trompettes du signal de guerre, afin de faire retentir ce signal contre vous. Fils d’Israël[a], ne combattez pas contre Yahweh, le Dieu de vos pères, car vous ne réussirez pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Israélites ». L’hébreu dit littéralement « fils d’Israël », formule masculine plurielle qui s’adresse ici collectivement au peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Voici
  rationale: Marqueur discursif emphatique qui attire l’attention sur ce qui suit; « Voici » conserve la force rhétorique dans un registre digne.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: Dieu est avec nous, à notre tête
  rationale: Conserve à la fois la présence divine exprimée par עִמָּנוּ et la métaphore de la position directrice ou d’avant-garde exprimée par בָרֹאשׁ.
- source_word: וְכֹהֲנָיו
  choice: ainsi que ses prêtres
  rationale: Le suffixe renvoie à Dieu; cette formulation rattache clairement les prêtres à Dieu tout en s’intégrant naturellement à la phrase française.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: munis des trompettes d’acclamation
  rationale: חֲצֹצְרוֹת désigne des trompettes cultuelles, et תְּרוּעָה un cri ou signal sonore puissant, ici en contexte militaire. « Acclamation » préserve l’étendue du terme sans le réduire exclusivement à une alarme.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: pour sonner contre vous
  rationale: L’infinitif hiphil exprime le fait de produire le signal sonore, tandis que עֲלֵיכֶם lui donne ici une orientation hostile. La formulation garde distincts l’instrument et l’action.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Fils d’Israël
  rationale: Rend directement la forme masculine plurielle de l’hébreu dans cette apostrophe collective; une formulation française plus inclusive est signalée en note.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: ne combattez pas contre Yahweh
  rationale: Après le verbe לחם, עִם marque l’adversaire. « Contre » explicite donc le sens idiomatique, et le nom divin est translittéré.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Rend l’expression d’appartenance ancestrale et d’alliance dans une formulation française claire et traditionnelle.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: car vous ne réussirez pas
  rationale: Le hiphil de צלח signifie ici réussir ou connaître le succès; « réussirez » conserve une portée assez large pour le contexte militaire sans ajouter explicitement « vaincre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de l’adresse בְּנֵי יִשְׂרָאֵל
  choice: Fils d’Israël
  alternative: Israélites
  rationale: Le choix principal suit la forme masculine de l’hébreu et sa fonction d’adresse collective, tandis que la note précise sa portée ethnique englobante.
- issue: Valeur de תְּרוּעָה
  choice: acclamation
  alternative: signal d’alarme
  rationale: Le nom peut désigner un cri, une clameur ou un signal retentissant. Le contexte est guerrier, mais le lexème ne signifie pas uniquement « alarme »; le choix maintient cette amplitude.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe distingue les « trompettes d’acclamation » de leur fonction, « sonner contre vous », et conserve la métaphore de Dieu placé « à notre tête ».
