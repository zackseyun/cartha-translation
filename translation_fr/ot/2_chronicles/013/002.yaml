  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: fr
  text: Il régna trois ans à Jérusalem[a]. Sa mère s’appelait Micaïa ; elle était fille d’Uriel, qui était de Guibea. Il y eut une guerre entre Abiya et Jéroboam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage parallèle de 1 Rois 15.2 appelle la mère d’Abiya « Maaca ». En hébreu, le mot traduit par « fille » peut aussi désigner plus largement une descendante ; les deux récits peuvent donc refléter des usages différents des noms ou des généalogies.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: Il régna
  rationale: Le verbe désigne l’exercice de la royauté. « Il régna » est la formulation française naturelle des notices royales.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette tournure rend naturellement en français moderne la formule hébraïque « le nom de sa mère était ».
- source_word: מִיכָיָהוּ
  choice: Michaya
  rationale: Transcription française usuelle et lisible de la forme hébraïque du nom.
- source_word: בַת אוּרִיאֵל
  choice: elle était fille d’Ouriel
  rationale: Le texte identifie directement la filiation maternelle. La traduction conserve « fille » sans imposer une généalogie plus précise ou plus éloignée.
- source_word: מִן גִּבְעָה
  choice: de Guibéa
  rationale: Dans cette notice généalogique, la préposition indique l’origine géographique d’Ouriel ; « de Guibéa » est idiomatique en français.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Il y eut une guerre
  rationale: Cette formulation rend simplement la proposition existentielle sans préciser une durée ou un commencement que l’hébreu n’explicite pas.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et ...
  rationale: Équivalent français direct de la construction hébraïque exprimant l’opposition entre deux parties.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Transcription française de la forme employée dans les Chroniques, sans importer la forme distincte de la tradition des Rois.
theological_decisions:
- issue: Différence entre les Chroniques et 1 Rois concernant le nom de la mère d’Abiya
  choice: Conserver dans le texte principal « Michaya » et « fille d’Ouriel », conformément au texte hébreu des Chroniques.
  alternative: Harmoniser avec « Maaka » en 1 Rois 15.2, ou traduire explicitement « descendante » plutôt que « fille ».
  rationale: La traduction doit préserver le témoignage propre du texte source et la tension généalogique, sans harmonisation silencieuse. La portée éventuellement plus large de בַת est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La notice royale reste concise ; les noms propres suivent des formes françaises courantes. Le point-virgule clarifie que « de Guibéa » se rapporte à Ouriel.
