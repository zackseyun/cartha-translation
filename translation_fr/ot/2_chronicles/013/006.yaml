id: 2CH.13.6
reference: 2 Chronicles 13:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: fr
  text: Jéroboam, fils de Nebath, serviteur de Salomon, fils de David, se souleva et se révolta contre son maître.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se souleva
  rationale: Dans ce contexte, le verbe introduit l’opposition de Jéroboam à l’autorité royale. « Se souleva » conserve l’élan narratif et politique sans limiter l’action à un geste physique.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les noms suivent les formes françaises bibliques usuelles, et le patronyme est rendu littéralement.
- source_word: עֶבֶד
  choice: serviteur
  rationale: Dans ce cadre royal et administratif, le terme désigne la position subordonnée de Jéroboam auprès de Salomon. « Serviteur » convient mieux que « esclave », qui suggérerait ici un statut plus précis que ne l’impose le contexte.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomon, fils de David
  rationale: La filiation est conservée afin de maintenir l’accent dynastique du texte hébreu.
- source_word: וַיִּמְרֹד
  choice: se révolta
  rationale: Le verbe exprime une rébellion contre une autorité établie. « Se révolta » est naturel en français moderne et convient au contexte politique.
- source_word: עַל אֲדֹנָיו
  choice: contre son maître
  rationale: Le nom désigne ici Salomon comme supérieur humain de Jéroboam. « Maître » exprime clairement ce rapport d’autorité sans suggérer une référence divine.
theological_decisions:
- issue: Traduction du titre humain אֲדֹנָיו
  choice: son maître
  alternative: son seigneur
  rationale: Le référent est Salomon, non Dieu. « Son maître » marque naturellement l’autorité humaine en français actuel, tandis que « son seigneur » pourrait paraître archaïque ou prêter à confusion avec un titre divin.
translation_notes:
  register: Français moderne, digne et narratif. La répétition « fils de » est maintenue pour préserver la structure généalogique et l’accent dynastique. Aucun ajout interprétatif n’est introduit.
