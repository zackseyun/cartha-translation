source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: fr
  text: N’avez-vous pas chassé les prêtres de Yahweh, les fils d’Aaron et les Lévites, et ne vous êtes-vous pas fait des prêtres comme les peuples des pays ? Quiconque vient avec un jeune taureau et sept béliers pour recevoir l’investiture[a] devient prêtre de ce qui n’est pas Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « remplir sa main », expression technique désignant l’investiture ou l’installation dans la fonction sacerdotale.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « pour des non-dieux » ou « de faux dieux ». L’hébreu nie littéralement que ces objets de culte soient réellement des dieux.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: N’avez-vous pas
  rationale: Introduit une question rhétorique qui attend une réponse affirmative et conserve la force du reproche.
- source_word: הִדַּחְתֶּם
  choice: chassé
  rationale: Le hiphil de נדח exprime ici l’expulsion; « chassé » est direct, naturel et suffisamment énergique.
- source_word: כֹּהֲנֵי יְהוָה
  choice: les prêtres de Yahweh
  rationale: Rend directement le syntagme construit et conserve le nom divin יְהוָה sous la forme « Yahweh ».
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: Préserve l’expression de filiation et son importance pour désigner la lignée sacerdotale légitime.
- source_word: וְהַלְוִיִּם
  choice: et les Lévites
  rationale: Maintient la mention distincte des Lévites aux côtés des fils d’Aaron.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: et ne vous êtes-vous pas fait des prêtres
  rationale: Rend l’action d’établir des prêtres tout en conservant la nuance intéressée de לָכֶם, « pour vous-mêmes ».
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: comme les peuples des autres pays
  rationale: Expression française naturelle qui désigne les peuples environnants sans introduire le terme interprétatif « païens ».
- source_word: כָּל הַבָּא
  choice: Quiconque vient
  rationale: Rend naturellement la construction générique au singulier et souligne que l’accès est ouvert à n’importe qui.
- source_word: לְמַלֵּא יָדוֹ
  choice: pour recevoir l’investiture
  rationale: Traduit le sens technique de l’expression cultuelle « remplir sa main » sans reproduire dans le corps du texte un idiome français opaque.
- source_word: בְּפַר בֶּן בָּקָר
  choice: avec un jeune taureau
  rationale: Rend de façon idiomatique l’expression sacrificielle désignant un jeune taureau du gros bétail.
- source_word: וְאֵילִם שִׁבְעָה
  choice: et sept béliers
  rationale: Traduction directe des animaux apportés pour la procédure d’installation.
- source_word: וְהָיָה כֹהֵן
  choice: devient prêtre
  rationale: Exprime clairement le résultat de cette procédure.
- source_word: לְלֹא אֱלֹהִים
  choice: de ce qui n’est pas Dieu
  rationale: Conserve la négation polémique de la divinité exprimée par l’hébreu, plutôt que de la réduire au qualificatif « faux ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom propre d’alliance.
- issue: Portée de לְלֹא אֱלֹהִים
  choice: de ce qui n’est pas Dieu
  alternative: de faux dieux / pour des non-dieux
  rationale: L’hébreu nie expressément que les objets de ce culte soient réellement des dieux. La formulation retenue garde cette pointe théologique sans préciser davantage leur identité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique conserve le ton accusateur du discours. « Recevoir l’investiture » explicite un idiome cultuel ancien, tandis que la note en préserve la forme littérale. Les marqueurs [a] et [b] sont placés précisément après les expressions qu’ils expliquent.
