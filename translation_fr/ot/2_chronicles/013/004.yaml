  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: fr
  text: 'Abiya se leva sur le mont Tsemaraïm[a], situé dans la région montagneuse d’Éphraïm, et dit : « Écoutez-moi, Jéroboam et tout Israël ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les montagnes d’Éphraïm ». L’expression hébraïque peut désigner une région de collines ou une région montagneuse d’Éphraïm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se tint
  rationale: Dans ce contexte de discours public, קום indique qu’Abiya se lève ou prend position pour parler. « Se tint » exprime naturellement sa posture sans ajouter explicitement une nuance militaire.
- source_word: מֵעַל לְהַר צְמָרַיִם
  choice: sur le mont Tsemaraïm
  rationale: La combinaison prépositionnelle hébraïque situe idiomatiquement Abiya sur la hauteur. « Sur le mont » rend clairement ce sens locatif en français courant.
- source_word: צְמָרַיִם
  choice: Tsemaraïm
  rationale: Le nom propre est translittéré sous une forme adaptée aux conventions phonétiques françaises.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: situé dans la région montagneuse d’Éphraïm
  rationale: הַר peut désigner non seulement une montagne précise, mais aussi une région de relief. Cette formulation transmet le sens géographique régional de manière naturelle.
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: Formule narrative ordinaire introduisant les paroles d’Abiya; le sujet reste clair en français.
- source_word: שְׁמָעוּנִי
  choice: Écoutez-moi
  rationale: L’impératif de שמע avec suffixe de première personne appelle directement les destinataires à prêter attention. « Écoutez-moi » est ferme, naturel et actuel.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jéroboam et tout Israël
  rationale: La désignation nationale est conservée littéralement afin de préserver la portée rhétorique du texte dans le contexte du royaume divisé.
theological_decisions:
- issue: Sens d’יִשְׂרָאֵל dans le contexte de la monarchie divisée
  choice: tout Israël
  alternative: tous les Israélites
  rationale: Le texte emploie directement le nom national et lié à l’alliance. « Tout Israël » conserve la tension politique et théologique du récit sans réduire l’expression à une simple désignation ethnique.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve une force publique et solennelle sans archaïsme. Les noms propres suivent des formes françaises usuelles ou une translittération adaptée au français.
