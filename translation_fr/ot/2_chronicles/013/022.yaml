  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: fr
  text: Le reste des actes d’Abiya, de sa conduite et de ses paroles est consigné dans le midrash[a] du prophète Iddo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commentaire », « exposé » ou, plus généralement, « ouvrage ». Ici, le mot hébreu midrash désigne un écrit d’interprétation ou de recherche, sans renvoyer nécessairement au genre rabbinique qui s’est développé plus tard.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Les autres actes
  rationale: Dans cette formule récapitulative royale, דִּבְרֵי désigne les faits ou les actes, et יֶתֶר ce qui en reste à rapporter. « Les autres actes » rend l’ensemble naturellement en français.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Translittération française courante du nom propre hébreu.
- source_word: וּדְרָכָיו
  choice: sa conduite
  rationale: Le pluriel de דֶּרֶךְ peut désigner la manière de vivre ou d’agir. « Sa conduite » exprime ce sens moral et biographique sans imposer d’évaluation.
- source_word: וּדְבָרָיו
  choice: et ses paroles
  rationale: Dans cette énumération, דְּבָרָיו se distingue des actes déjà mentionnés et renvoie vraisemblablement aux paroles ou déclarations d’Abiya.
- source_word: כְּתוּבִים
  choice: sont consignés
  rationale: Le participe passif de כתב indique que ces éléments ont été mis par écrit. « Sont consignés » est idiomatique dans une formule historiographique française.
- source_word: בְּמִדְרַשׁ
  choice: dans le midrash
  rationale: Le terme hébreu désigne ici un ouvrage écrit issu d’une recherche, d’une interprétation ou d’une exposition. Le conserver évite de réduire indûment son sens, tandis qu’une note prévient son assimilation automatique au genre rabbinique plus tardif.
- source_word: הַנָּבִיא עִדּוֹ
  choice: du prophète Iddo
  rationale: La construction rattache l’ouvrage au prophète Iddo, comme auteur ou détenteur de cette source.
theological_decisions:
- issue: Nature du מִדְרָשׁ attribué à Iddo
  choice: Conserver « midrash » et expliquer le terme en note
  alternative: « commentaire », « exposé » ou, plus généralement, « ouvrage »
  rationale: Le mot peut désigner un écrit d’interprétation ou de recherche, mais le texte ne permet pas d’en préciser exactement le genre. Le terme ne doit pas être identifié sans nuance au midrash rabbinique dans sa forme ultérieure.
translation_notes:
  register: Français international moderne, sobre et historiographique. « Sa conduite » est plus naturel que le calque « ses voies », tandis que « ses paroles » préserve la distinction probable entre les actes et les déclarations du roi. Le marqueur de note est placé après « midrash », le terme qu’il explique.
