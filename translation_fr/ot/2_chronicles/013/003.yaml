base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: fr
  text: Abiya engagea le combat[a] avec une armée de quatre cent mille hommes d’élite, de vaillants guerriers. Jéroboam se rangea en ordre de bataille contre lui avec huit cent mille hommes d’élite, de vaillants soldats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lia la bataille » ; cette expression hébraïque signifie ici « engagea le combat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: engagea le combat
  rationale: Le verbe אָסַר signifie normalement « lier », mais, associé à מִלְחָמָה dans cette expression militaire, il désigne l’action d’engager le combat. La formulation française est naturelle, tandis que la note conserve l’image hébraïque.
- source_word: בְּחַיִל
  choice: avec une armée
  rationale: חַיִל peut désigner la force, la valeur ou une force militaire. L’énumération des soldats montre qu’il s’agit ici d’une armée.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: de vaillants guerriers
  rationale: L’expression désigne des combattants puissants et aguerris. « Vaillants guerriers » en restitue la force dans un français actuel et digne.
- source_word: בָּחוּר
  choice: hommes d’élite
  rationale: Dans ce contexte militaire, בָּחוּר qualifie des hommes choisis, c’est-à-dire des troupes sélectionnées. « Hommes d’élite » exprime clairement cette valeur.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: se rangea en ordre de bataille contre lui
  rationale: Dans un contexte militaire, עָרַךְ évoque la disposition organisée des troupes. La traduction garde cette dimension tactique et rend explicitement l’opposition indiquée par le contexte.
- source_word: גִּבּוֹר חָיִל
  choice: de vaillants soldats
  rationale: Cette expression militaire courante désigne des combattants courageux et capables. Le pluriel français s’accorde naturellement avec les huit cent mille hommes, malgré la formulation distributive au singulier en hébreu.
