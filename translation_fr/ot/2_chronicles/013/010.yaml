source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: fr
  text: Quant à nous, Yahweh est notre Dieu, et nous ne l’avons pas abandonné. Les prêtres qui assurent le service de Yahweh sont les fils d’Aaron, et les lévites sont à leur tâche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Quant à nous
  rationale: Le pronom indépendant, précédé de la conjonction, marque ici le contraste entre Juda et le royaume du Nord. « Quant à nous » restitue naturellement cette mise en relief.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Avec Yahweh pour référent singulier, אֱלֹהִים désigne ici le Dieu d’Israël et appelle le singulier en français.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: et nous ne l’avons pas abandonné
  rationale: עזב signifie « abandonner, délaisser ». Le passé composé exprime une action passée dont le résultat demeure pertinent dans la déclaration présente d’Abiya.
- source_word: וְכֹהֲנִים מְשָׁרְתִים לַיהוָה
  choice: Les prêtres qui assurent le service de Yahweh
  rationale: Le participe מְשָׁרְתִים évoque un service cultuel continu. « Assurer le service de » est clair et naturel en français dans ce contexte sacerdotal.
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: La formulation conserve l’expression hébraïque et sa référence à la lignée sacerdotale, sans la remplacer par l’explicitation « descendants ».
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: et les lévites accomplissent leur tâche
  rationale: La proposition hébraïque est elliptique, littéralement « et les lévites dans la tâche ». Le verbe « accomplissent » rend en français leur engagement effectif dans le service assigné, sans préciser davantage la nature de celui-ci.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; le rendre par « Yahweh » préserve son statut de nom propre plutôt que de lui substituer un titre.
- issue: Portée temporelle de עֲזַבְנֻהוּ
  choice: nous ne l’avons pas abandonné
  alternative: nous ne l’abandonnons pas
  rationale: La forme accomplie affirme que Juda n’a pas abandonné Yahweh, avec une pertinence qui se prolonge au moment du discours. Le passé composé français maintient ce lien sans transformer explicitement la forme en présent.
- issue: Nature du service lévitique
  choice: les lévites accomplissent leur tâche
  alternative: les lévites sont à leur tâche
  rationale: L’hébreu est elliptique et ne détaille pas le travail en question. Le choix retenu indique l’exercice de la tâche assignée sans importer une fonction plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque a été divisée en deux phrases françaises pour éviter une coordination pesante. « Prêtres », « service » et « lévites » conservent le cadre cultuel; « tâche » reste assez large pour respecter מְלָאכָה.
