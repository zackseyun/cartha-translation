base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: fr
  text: Il fit s’engager tous ceux qui se trouvaient à Jérusalem et sur le territoire de Benjamin[a]. Les habitants de Jérusalem agirent conformément à l’alliance de Dieu, le Dieu de leurs ancêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Il fit se tenir debout tous ceux qui se trouvaient à Jérusalem et en Benjamin. » Dans ce contexte, l’expression peut indiquer qu’il leur fit prendre position à l’égard de l’alliance ou s’y engager.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il fit s’engager
  rationale: Le hifil de עמד signifie littéralement « faire tenir » ou « faire se tenir debout ». Dans ce renouvellement d’alliance, l’action exprime vraisemblablement l’adhésion imposée ou suscitée par Josias. « Fit s’engager » rend ce sens contextuel en français naturel, tandis que la note conserve l’image et l’ambiguïté de l’hébreu.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: tous ceux qui se trouvaient
  rationale: Cette formulation rend la totalité désignée par le participe passif נמצא et correspond à un français courant, sans réduire explicitement le groupe aux seules personnes déjà assemblées.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: à Jérusalem et sur le territoire de Benjamin
  rationale: « Benjamin » désigne ici vraisemblablement le territoire tribal. L’explicitation minimale « territoire de » évite en français moderne une tournure géographique obscure.
- source_word: וַיַּעֲשׂוּ
  choice: agirent
  rationale: Avec la préposition כ et « alliance », עשה indique que les habitants conformèrent leur conduite à l’alliance. « Agirent » reste proche du verbe hébreu sans introduire le sens plus spécifique de « respecter ».
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: Les habitants de Jérusalem
  rationale: Rendu direct et naturel du participe substantivé désignant ceux qui résident à Jérusalem.
- source_word: כִּבְרִית
  choice: conformément à l’alliance
  rationale: Le כ marque ici la conformité à une norme. Cette tournure exprime clairement que leur conduite correspondait aux exigences de l’alliance.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: de Dieu, le Dieu de leurs ancêtres
  rationale: La répétition de « Dieu » préserve l’apposition emphatique de l’hébreu. « Ancêtres » communique naturellement la portée collective de אבות en français moderne.
theological_decisions:
- issue: Portée de l’action de Josias lors du renouvellement de l’alliance
  choice: Josias amène ou oblige les personnes présentes à s’engager dans l’alliance
  alternative: Josias les fait simplement se tenir debout ou prendre position
  rationale: Le contexte immédiat favorise une portée d’engagement envers l’alliance, mais le verbe hébreu conserve l’image concrète de l’action de se tenir debout et n’énonce pas explicitement son complément. La note signale donc l’autre lecture sans trancher au-delà du contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation principale privilégie le sens covenantal contextuel; la note conserve la métaphore concrète et l’ambiguïté syntaxique du verbe hébreu. « Ancêtres » est préféré à « pères » pour éviter une lecture limitée aux ascendants masculins immédiats.
