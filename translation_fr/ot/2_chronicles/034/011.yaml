  text: וַֽ/יִּתְּנ֗וּ לֶ/חָֽרָשִׁים֙ וְ/לַ/בֹּנִ֔ים לִ/קְנוֹת֙ אַבְנֵ֣י מַחְצֵ֔ב וְ/עֵצִ֖ים לַֽ/מְחַבְּר֑וֹת וּ/לְ/קָרוֹת֙ אֶת הַ/בָּ֣תִּ֔ים אֲשֶׁ֥ר הִשְׁחִ֖יתוּ מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: fr
  text: Ils le donnèrent aux artisans et aux bâtisseurs afin d’acheter des pierres de carrière[a] et du bois pour les assemblages[b] et pour couvrir les bâtiments au moyen de poutres[c], que les rois de Juda avaient détériorés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pierres taillées ». L’expression hébraïque désigne des pierres extraites d’une carrière pour servir à la construction.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est incertain ; il peut désigner des travaux d’assemblage, des pièces de liaison ou des éléments de charpente.
    reason: lexical_alternative
  - marker: c
    text: Ou « pour couvrir » ou « pour poser des poutres sur les bâtiments ». Le verbe hébreu peut désigner la couverture d’un bâtiment au moyen de poutres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils le donnèrent
  rationale: Le verbe signifie « donner ». Le pronom « le », absent mais implicite en hébreu, reprend naturellement en français l’argent mentionné dans le contexte précédent.
- source_word: חָרָשִׁים
  choice: artisans
  rationale: Le terme désigne largement des ouvriers qualifiés, sans limiter leur activité à un métier particulier.
- source_word: בֹּנִים
  choice: bâtisseurs
  rationale: Le participe substantivé issu de בנה désigne ceux qui construisent; « bâtisseurs » le distingue clairement des artisans déjà mentionnés.
- source_word: לִקְנוֹת
  choice: afin d’acheter
  rationale: Traduction directe de l’infinitif de קנה, avec une tournure française exprimant clairement le but.
- source_word: אַבְנֵי מַחְצֵב
  choice: pierres de carrière
  rationale: L’expression désigne des pierres extraites d’une carrière pour la construction, sans préciser indûment leur degré de taille ou de finition.
- source_word: עֵצִים
  choice: bois
  rationale: Dans ce contexte, il s’agit de bois destiné aux travaux de construction; le français « bois » est naturel et suffisamment précis.
- source_word: לַמְחַבְּרוֹת
  choice: pour les assemblages
  rationale: Ce terme rare et incertain semble renvoyer à des éléments ou à des travaux servant à joindre des parties de la structure. « Assemblages » conserve cette idée sans imposer un détail architectural précis.
- source_word: וּלְקָרוֹת
  choice: pour couvrir de poutres
  rationale: Le verbe קרה, dans un contexte de construction, signifie couvrir ou poser une toiture au moyen de poutres. La formulation conserve à la fois l’action et le moyen architectural probable.
- source_word: הַבָּתִּים
  choice: les bâtiments
  rationale: Dans le contexte de la restauration du temple, le pluriel renvoie vraisemblablement aux bâtiments ou structures du complexe plutôt qu’à des habitations ordinaires.
- source_word: הִשְׁחִיתוּ
  choice: avaient détériorés
  rationale: Le hiphil de שחת peut signifier ruiner, détruire ou abîmer. « Détériorés » exprime les dommages causés sans suggérer nécessairement une destruction totale.
- source_word: מַלְכֵי יְהוּדָה
  choice: les rois de Juda
  rationale: Traduction directe de l’expression hébraïque.
theological_decisions: []
