  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: fr
  text: Lorsque le roi entendit les paroles de la loi[a], il déchira ses vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’instruction ». Le mot hébreu torah peut désigner plus largement un enseignement ou une instruction ; ici, il renvoie à la loi de l’alliance lue devant le roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque… entendit
  rationale: La construction narrative וַיְהִי suivie de כ avec l’infinitif construit exprime ici la circonstance temporelle. « Lorsque » rend naturellement la séquence en français moderne sans reproduire une formule archaïque comme « il arriva que ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le titre défini. Le contexte identifie Josias, mais il n’est pas nécessaire d’ajouter son nom.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Le pluriel construit de דָּבָר désigne ici le contenu entendu lors de la lecture. « Paroles » conserve l’expression concrète de l’hébreu.
- source_word: הַתּוֹרָה
  choice: la loi
  rationale: תּוֹרָה peut désigner plus largement un enseignement ou une instruction, mais le contexte concerne le corpus d’alliance lu devant le roi. « La loi » est ici clair, naturel et traditionnel, tout en signalant l’autre possibilité en note.
- source_word: וַיִּקְרַע
  choice: il déchira
  rationale: קָרַע désigne l’action de déchirer des vêtements, geste conventionnel de détresse, de deuil ou de repentance. « Déchira » est précis et digne.
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: בֶּגֶד est un terme général pour les habits. « Ses vêtements » est naturel et ne précise pas indûment qu’il s’agissait de vêtements royaux.
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte de la réforme de Josias
  choice: la loi
  alternative: l’instruction ; la Torah
  rationale: Le livre découvert contient les exigences de l’alliance et provoque la réaction du roi. « La loi » communique cette portée juridique et covenantale sans réduire le mot hébreu à un sens exclusivement législatif ; la note conserve son amplitude lexicale.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la brièveté narrative de l’hébreu. « Vêtements » est préféré à « habits » ou « robes », et « paroles » maintient la formulation concrète du texte source.
