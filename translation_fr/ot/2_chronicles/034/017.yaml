  naturalness: « Ils ont versé l’argent » et « l’ont remis entre les mains » sont naturels dans un contexte administratif. « Ceux qui faisaient les travaux » est plus idiomatique et plus neutre que « ceux qui exécutaient les travaux », tout en rendant le participe hébreu.
  terminology: « Argent », « maison de Yahweh », « responsables » et « travaux » conviennent. La note sur le verbe initial préserve utilement l’alternative contextuelle sans imposer le sens de « faire fondre ».
