source:
  edition: WLC
  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: fr
  text: Ils ont versé l’argent qui a été trouvé dans la maison de Yahweh et l’ont remis entre les mains des responsables et de ceux qui faisaient les travaux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « ont vidé »; dans ce contexte, il peut désigner le décaissement de l’argent plutôt que sa fonte au sens littéral.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Yahweh » désigne ici le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: ils ont versé
  rationale: Le verbe évoque littéralement l’action de verser ou de vider. Dans ce contexte financier, il désigne vraisemblablement la sortie ou le décaissement des fonds, sans imposer l’idée d’une fonte du métal.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: 'Le français « argent » conserve naturellement les deux valeurs de כֶּסֶף : le métal précieux et, par extension, les fonds monétaires.'
- source_word: הַנִּמְצָא
  choice: qui se trouvait
  rationale: Cette formulation française naturelle rend le participe nifal, littéralement « qui avait été trouvé », sans suggérer nécessairement une découverte fortuite.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » conserve l’image et la désignation hébraïques du temple, tandis que le nom divin est translittéré.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé directement dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיִּתְּנוּהוּ
  choice: l’ont remis
  rationale: Dans ce contexte administratif, « remettre » exprime clairement le transfert des fonds tout en restant proche du sens fondamental « donner ».
- source_word: עַל יַד
  choice: entre les mains de
  rationale: Cette expression française garde l’image de l’idiome hébreu et communique l’idée de confier quelque chose à la responsabilité de quelqu’un.
- source_word: הַמֻּפְקָדִים
  choice: les responsables
  rationale: Le participe passif désigne les personnes établies ou préposées à une charge. « Responsables » rend leur fonction sans préciser excessivement leur titre.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: ceux qui exécutaient les travaux
  rationale: La formulation englobe toutes les personnes occupées à l’ouvrage sans les réduire à une catégorie professionnelle particulière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » en préserve la fonction de nom personnel, sans remplacer celui-ci par un titre.
- issue: Sens concret ou financier de וַיַּתִּיכוּ
  choice: ont versé
  alternative: ont vidé / ont décaissé / ont fait fondre
  rationale: Le contexte du transfert aux responsables des travaux favorise le versement ou le décaissement des fonds plutôt que la fonte du métal, mais la note conserve l’étendue sémantique du verbe.
translation_notes:
  register: Français international moderne, sobre et digne. « Verser l’argent » est idiomatique dans un contexte financier tout en conservant l’image du verbe hébreu. « Responsables » évite l’archaïsme de « préposés », et « exécutaient les travaux » demeure assez large pour rendre l’expression hébraïque.
