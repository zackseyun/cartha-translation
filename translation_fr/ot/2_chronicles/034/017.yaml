  rationale: La révision restitue explicitement le sens passif de « trouvé » sans modifier le choix contextuel prudent de « versé » pour וַיַּתִּיכוּ. Elle améliore aussi légèrement la fluidité de la désignation des ouvriers, tout en maintenant le registre moderne, la structure du verset et les deux ancres de note.
