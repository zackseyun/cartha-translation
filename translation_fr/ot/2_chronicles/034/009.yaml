  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: fr
  text: Ils vinrent trouver Hilqiya, le grand prêtre, et lui remirent l’argent apporté dans la maison de Dieu, que les lévites, gardiens du seuil[a], avaient recueilli de Manassé, d’Éphraïm, de tout le reste d’Israël, de tout Juda et de Benjamin, ainsi que des habitants de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les portiers » ou « les gardiens des portes » ; littéralement « les gardiens du seuil ».
    reason: Alternative lexicale et sens fonctionnel possible de שֹׁמְרֵי הַסַּף.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils vinrent trouver
  rationale: Le wayyiqtol fait avancer le récit. « Vinrent trouver » exprime naturellement en français le déplacement vers Hilqiya sans alourdir la phrase.
- source_word: חִלְקִיָּהוּ
  choice: Hilqiya
  rationale: Translittération française moderne qui représente le qoph par « q » et conserve une forme lisible du nom hébreu.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Titre français établi pour le principal office sacerdotal; une traduction littérale mot à mot donnerait également « le grand prêtre ».
- source_word: וַיִּתְּנוּ
  choice: lui remirent
  rationale: Dans le contexte de fonds confiés au grand prêtre, « remettre » rend plus précisément l’idée de transmission que le simple « donner »; le pronom explicite naturellement le destinataire en français.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: Le nom peut désigner le métal argent ou de l’argent monétaire. Le contexte d’une collecte destinée au temple favorise « l’argent », qui conserve en français la même proximité sémantique.
- source_word: הַמּוּבָא בֵית אֱלֹהִים
  choice: qui avait été apporté à la maison de Dieu
  rationale: Le participe passif désigne une action antérieure à la remise. « Maison de Dieu » préserve l’expression hébraïque plutôt que de l’expliciter par « temple ».
- source_word: אֲשֶׁר אָסְפוּ הַלְוִיִּם
  choice: Cet argent avait été recueilli par les lévites
  rationale: La reprise par « cet argent » lève une lourdeur syntaxique en français tout en conservant clairement l’antécédent du relatif hébreu et la séquence temporelle.
- source_word: שֹׁמְרֵי הַסַּף
  choice: qui gardaient le seuil
  rationale: Cette formulation conserve l’image littérale du seuil et décrit naturellement la fonction exercée; les équivalents fonctionnels figurent en note.
- source_word: מִיַּד
  choice: auprès de
  rationale: L’expression signifie littéralement « de la main de ». Dans le contexte d’une collecte, « auprès de » indique avec naturel les personnes ou régions dont les fonds ont été recueillis.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: le reste d’Israël
  rationale: « Reste » conserve la possibilité d’un sens collectif historique ou d’une résonance théologique sans imposer l’expression plus marquée « le petit reste ».
- source_word: וישבי יְרוּשָׁלִָם
  choice: des habitants de Jérusalem
  rationale: La traduction suit ici la lecture consonantique (ketiv), « les habitants de Jérusalem », qui s’intègre à l’énumération des provenances de la collecte; la lecture massorétique marginale est signalée en note.
theological_decisions:
- issue: Portée de שְׁאֵרִית (« reste ») appliqué à Israël
  choice: le reste d’Israël
  alternative: ce qui restait d’Israël
  rationale: « Le reste d’Israël » préserve à la fois le sens historique des survivants des tribus du Nord et une éventuelle résonance d’alliance, sans transformer celle-ci en affirmation doctrinale explicite.
- issue: Variante textuelle finale entre le ketiv et le qeré
  choice: ainsi que des habitants de Jérusalem
  alternative: puis ils retournèrent à Jérusalem
  rationale: Le ketiv וישבי se comprend comme « les habitants de », tandis que le qeré וַיָּשׁוּבוּ donne « ils retournèrent ». Le texte principal retient la lecture qui poursuit la liste des sources de la collecte, mais la variante ancienne et significative demeure visible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque longue est divisée en deux pour assurer la clarté, sans modifier les relations logiques. « Maison de Dieu », « grand prêtre » et « lévites » maintiennent le registre biblique courant; les notes conservent l’image du seuil et la véritable ambiguïté textuelle de la fin du verset.
