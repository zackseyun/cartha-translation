review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement la séquence narrative, Hilqiya, le titre de grand prêtre, l’argent, la maison de Dieu et les groupes énumérés. Toutefois, la note b affirme à tort une opposition ketiv/qeré finale et une lecture « puis ils retournèrent à Jérusalem » : le texte fourni porte וישבי ירושלים, « les habitants de Jérusalem », sans que cette variante ne soit attestée ici dans les données source.'
  naturalness: Le français est clair et de registre biblique moderne. Une phrase unique avec une relative permet de conserver plus directement le lien syntaxique entre l’argent remis et l’argent collecté, tout en restant naturelle.
  terminology: « Hilqiya », « grand prêtre », « maison de Dieu », « lévites » et « reste d’Israël » conviennent. « Gardiens du seuil » est une expression française plus idiomatique que « ceux qui gardaient le seuil » dans le corps du texte et préserve le terme source; les rendus fonctionnels sont utilement signalés en note.
  issues:
  - severity: high
    issue: La note b invente une variante ketiv/qeré (« puis ils retournèrent à Jérusalem »).
    rationale: Elle ne correspond ni au texte hébreu fourni, qui se termine par וישבי ירושלים (« les habitants de Jérusalem »), ni à la piste d’audit anglaise. Elle doit être supprimée afin de ne pas attribuer au texte une lecture non justifiée.
  - severity: low
    issue: « auprès de Manassé » peut affaiblir le rapport de provenance exprimé par מִיַּד.
    rationale: Dans cette énumération de contributeurs ou de régions, « de Manassé, d’Éphraïm… » est plus direct et conserve mieux la construction source.
  revised_text: Ils vinrent trouver Hilqiya, le grand prêtre, et lui remirent l’argent apporté dans la maison de Dieu, que les lévites, gardiens du seuil[a], avaient recueilli de Manassé, d’Éphraïm, de tout le reste d’Israël, de tout Juda et de Benjamin, ainsi que des habitants de Jérusalem.
  revised_footnotes:
  - marker: a
    text: Ou « les portiers » ou « les gardiens des portes » ; littéralement « les gardiens du seuil ».
    reason: Alternative lexicale et sens fonctionnel possible de שֹׁמְרֵי הַסַּף.
  revision_rationale: La révision supprime la note textuelle erronée et son ancre, sans modifier le sens du passage. Elle resserre aussi la syntaxe française autour de la relative qui décrit l’argent et rend plus explicitement la provenance des fonds. La lecture « habitants de Jérusalem » est maintenue conformément au texte source fourni.
