revisions:
- from: Ils vinrent trouver Hilqiya, le grand prêtre, et lui remirent l’argent qui avait été apporté à la maison de Dieu. Cet argent avait été recueilli par les lévites qui gardaient le seuil[a], auprès de Manassé et d’Éphraïm, de tout le reste d’Israël, de tout Juda et Benjamin, ainsi que des habitants de Jérusalem[b].
  to: Ils vinrent trouver Hilqiya, le grand prêtre, et lui remirent l’argent apporté dans la maison de Dieu, que les lévites, gardiens du seuil[a], avaient recueilli de Manassé, d’Éphraïm, de tout le reste d’Israël, de tout Juda et de Benjamin, ainsi que des habitants de Jérusalem.
  rationale: La révision supprime la note textuelle erronée et son ancre, sans modifier le sens du passage. Elle resserre aussi la syntaxe française autour de la relative qui décrit l’argent et rend plus explicitement la provenance des fonds. La lecture « habitants de Jérusalem » est maintenue conformément au texte source fourni.
