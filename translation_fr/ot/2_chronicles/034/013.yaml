  text: וְ/עַ֣ל הַ/סַּבָּלִ֗ים וּֽ/מְנַצְּחִים֙ לְ/כֹל֙ עֹשֵׂ֣ה מְלָאכָ֔ה לַ/עֲבוֹדָ֖ה וַ/עֲבוֹדָ֑ה וּ/מֵֽ/הַ/לְוִיִּ֔ם סוֹפְרִ֥ים וְ/שֹׁטְרִ֖ים וְ/שׁוֹעֲרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: fr
  text: Ils étaient responsables des porteurs de charges et dirigeaient tous les ouvriers, service par service[a]. Parmi les lévites, certains étaient scribes, officiers ou portiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour chaque type de service ». L’hébreu répète le mot « service » (littéralement « pour service et service »), probablement avec un sens distributif entre les différentes tâches.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: Ils étaient responsables des porteurs de charges
  rationale: Dans ce contexte administratif, עַל marque l’autorité ou la surveillance. « Responsables de » est naturel en français, tandis que « porteurs de charges » conserve le sens précis de סַבָּלִים.
- source_word: וּמְנַצְּחִים לְכֹל עֹשֵׂה מְלָאכָה
  choice: et dirigeaient tous ceux qui exécutaient les travaux
  rationale: Le participe מְנַצְּחִים désigne ici une fonction de direction ou de supervision. La formulation française garde la portée générale de לְכֹל et la valeur active de עֹשֵׂה.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: service par service
  rationale: Cette tournure conserve de façon idiomatique le redoublement hébreu et sa probable valeur distributive, sans le réduire silencieusement à une seule catégorie générique.
- source_word: וּמֵהַלְוִיִּם
  choice: Parmi les lévites, certains étaient
  rationale: 'La préposition מִן a ici une valeur partitive : une partie des lévites remplissait les fonctions énumérées.'
- source_word: סוֹפְרִים
  choice: scribes
  rationale: Équivalent traditionnel et précis pour des hommes chargés de l’écriture ou des documents.
- source_word: וְשֹׁטְרִים
  choice: officiers
  rationale: Le terme désigne des agents investis d’une fonction administrative ou d’autorité. « Officiers » reste concis et institutionnel sans préciser indûment leurs tâches.
- source_word: וְשׁוֹעֲרִים
  choice: portiers
  rationale: Dans le contexte du temple, « portiers » est l’équivalent français établi pour ceux qui gardent les accès.
theological_decisions: []
