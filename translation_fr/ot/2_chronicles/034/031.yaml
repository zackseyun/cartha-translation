  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: fr
  text: Alors le roi se tint à sa place et conclut l’alliance devant Yahweh, en s’engageant à marcher à la suite de Yahweh, à garder ses commandements, ses témoignages et ses prescriptions de tout son cœur et de toute son âme, et à mettre en pratique les paroles de l’alliance écrites dans ce livre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus concrètement : « sur ce rouleau ». Le mot hébreu peut désigner un document écrit sous forme de rouleau.'
    reason: Alternative lexicale liée à la forme ancienne du document.
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: le roi se tint à sa place
  rationale: Cette formulation rend à la fois l’action de se tenir debout et l’idée de la place ou position assignée au roi, sans préciser indûment un élément architectural.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: conclut l’alliance
  rationale: L’expression hébraïque signifie littéralement « couper l’alliance », idiome que le français actuel rend naturellement par « conclure l’alliance ». L’article défini de l’hébreu est conservé.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » exprime sobrement que cet engagement solennel est pris en présence de Yahweh.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: marcher à la suite de Yahweh
  rationale: Cette traduction conserve la métaphore de la marche et sa portée d’attachement fidèle, tout en restant naturelle en français.
- source_word: לִשְׁמוֹר
  choice: garder
  rationale: Dans ce contexte d’alliance, le verbe désigne l’observation fidèle des exigences divines. « Garder » conserve la formulation biblique sans être archaïque.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: ses commandements, ses témoignages et ses prescriptions
  rationale: Les trois termes juridiques sont maintenus distincts. « Témoignages » conserve le vocabulaire propre à עֵדוֹת, tandis que « prescriptions » exprime le caractère établi de חֻקִּים.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: de tout son cœur et de toute son âme
  rationale: La formule traditionnelle et intelligible préserve l’écho au langage de l’alliance dans le Deutéronome ainsi que ses deux termes anthropologiques.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: mettre en pratique les paroles de l’alliance
  rationale: « Mettre en pratique » exprime ici l’accomplissement concret demandé par עשה, tandis que « paroles de l’alliance » reste proche de l’expression hébraïque.
- source_word: הַסֵּפֶר
  choice: ce livre
  rationale: « Livre » est le terme courant et naturel, mais le mot hébreu peut désigner matériellement un rouleau, possibilité signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le nom divin. « Yahweh » le représente comme nom propre et évite de le remplacer par un titre.
- issue: Maintien de la métaphore d’alliance dans לָלֶכֶת אַחֲרֵי יְהוָה
  choice: marcher à la suite de Yahweh
  alternative: suivre Yahweh
  rationale: La formulation choisie préserve la métaphore hébraïque et ses résonances deutéronomiques sans sacrifier l’intelligibilité.
- issue: Rapport syntaxique des infinitifs avec la conclusion de l’alliance
  choice: une série explicative après deux-points
  alternative: « en s’engageant à… » ou « afin de… »
  rationale: L’hébreu enchaîne des infinitifs indiquant le contenu ou le but de l’alliance. Les deux-points préservent ce rapport sans imposer une seule analyse plus précise que le texte.
translation_notes:
  register: Français international actuel, digne et accessible. La structure conserve le rythme solennel de l’engagement royal ainsi que les distinctions du vocabulaire de l’alliance. Le marqueur de note est placé après « livre », le terme auquel la note se rapporte.
