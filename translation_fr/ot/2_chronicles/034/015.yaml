  text: וַ/יַּ֣עַן חִלְקִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ אֶל שָׁפָ֣ן הַ/סּוֹפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֧ן חִלְקִיָּ֛הוּ אֶת הַ/סֵּ֖פֶר אֶל שָׁפָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: fr
  text: 'Alors Hilqiya prit la parole et dit au secrétaire Shafân : « J’ai trouvé le livre de la Loi[a] dans la maison de Yahweh. » Puis Hilqiya donna le livre à Shafân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rouleau de la Loi »; le mot hébreu séfer peut désigner un livre, un document ou un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: prit la parole et dit
  rationale: La formule hébraïque associe « répondre » et « dire », même sans question explicite. « Prit la parole et dit » en conserve la fonction discursive dans un français naturel.
- source_word: הַסּוֹפֵר
  choice: le secrétaire
  rationale: Dans ce contexte royal et administratif, סֹפֵר désigne vraisemblablement un haut fonctionnaire lettré; « secrétaire » communique mieux cette fonction en français moderne que le seul terme « scribe ».
- source_word: סֵפֶר הַתּוֹרָה
  choice: le livre de la Loi
  rationale: סֵפֶר peut désigner un livre, un document ou un rouleau, tandis que תּוֹרָה renvoie ici au corpus normatif de l’alliance. La formulation retenue est claire et traditionnelle sans trancher matériellement la forme du document.
- source_word: מָצָאתִי
  choice: J’ai trouvé
  rationale: Le passé composé exprime naturellement en français une découverte achevée dont la portée demeure immédiate.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » préserve l’expression hébraïque qui désigne ici le temple, et le nom divin est translittéré directement.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: donna le livre à Shafân
  rationale: Traduction directe et idiomatique du verbe courant נתן et de son complément.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre sans recourir à la substitution liturgique.
- issue: Sens de תּוֹרָה
  choice: Loi
  alternative: Instruction
  rationale: « Loi » convient au contexte du document d’alliance découvert dans le temple, tout en maintenant le poids normatif du terme; « instruction » reste lexicalement possible.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms hébreux sont translittérés sous les formes « Hilqiya » et « Shafân ». « Secrétaire » souligne la fonction administrative sans nier l’activité de scribe.
