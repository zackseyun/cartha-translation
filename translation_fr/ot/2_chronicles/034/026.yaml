  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: fr
  text: 'Mais au roi de Juda, qui vous a envoyés consulter Yahweh[a], vous direz ceci : « Ainsi parle Yahweh, le Dieu d’Israël : Quant aux paroles que tu as entendues — »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chercher Yahweh » ou « interroger Yahweh ». Le verbe hébreu peut exprimer aussi bien la recherche de Dieu que la consultation en vue d’obtenir une réponse prophétique.'
    reason: Alternative lexicale reflétant l’étendue sémantique de דרשׁ avec ב.
lexical_decisions:
- source_word: וְאֶל מֶלֶךְ יְהוּדָה
  choice: Mais au roi de Juda
  rationale: La conjonction וְ introduit ici une nouvelle adresse qui contraste avec le message précédent, tandis que אֶל garde son sens directionnel. « Mais au » rend naturellement cet enchaînement en français.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: qui vous a envoyés
  rationale: Le participe défini identifie le roi comme celui qui a envoyé la délégation. La proposition relative est naturelle en français, et « envoyés » s’accorde avec le complément direct pluriel antéposé.
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: consulter Yahweh
  rationale: Dans ce contexte prophétique, דרשׁ avec ב désigne une démarche visant à obtenir une parole divine. « Consulter » exprime clairement cette demande sans réduire le verbe à une recherche spirituelle générale.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: vous direz ceci
  rationale: Cette formulation conserve la valeur directive du futur hébreu et introduit naturellement en français le message destiné au roi.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formule française, digne et consacrée par l’usage biblique, correspond étroitement à la formule hébraïque du messager prophétique.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la relation construite qui identifie Yahweh comme le Dieu d’Israël.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Quant aux paroles que tu as entendues —
  rationale: « Quant aux » reproduit la topicalisation hébraïque. Le tiret maintient la suspension syntaxique, puisque la pensée se poursuit au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve ici le nom divin personnel sans le remplacer par un titre.
- issue: Sens de דרשׁ dans une démarche auprès de Dieu
  choice: consulter Yahweh
  alternative: chercher Yahweh
  rationale: Le contexte immédiat est celui d’une délégation envoyée pour recevoir une réponse prophétique. « Consulter » exprime ce cadre, tandis que la note préserve l’étendue sémantique du verbe.
translation_notes:
  register: 'Français international moderne, clair et digne. « Ainsi parle » préserve la solennité de la formule prophétique sans archaïsme excessif. Le passage du « vous » pluriel au « tu » singulier suit l’hébreu : la délégation est d’abord interpellée, puis le message vise personnellement le roi. Le tiret final signale que la phrase demeure inachevée jusqu’au verset suivant.'
