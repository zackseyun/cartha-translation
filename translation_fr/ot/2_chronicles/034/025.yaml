source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: fr
  text: Parce qu’ils m’ont abandonné et ont brûlé de l’encens à d’autres dieux[a], pour m’irriter par toutes les œuvres de leurs mains[b], ma colère se déversera sur ce lieu et ne s’éteindra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des dieux étrangers ». L’hébreu dit plus littéralement « d’autres dieux ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « les œuvres de leurs mains » peut désigner largement ce qu’ils ont fabriqué ou accompli, notamment les idoles qu’ils ont fabriquées et les pratiques qui leur sont liées.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: Parce que
  rationale: Cette locution introduit le motif du jugement annoncé. « Parce que » en rend naturellement la valeur causale.
- source_word: עֲזָבוּנִי
  choice: ils m’ont abandonné
  rationale: Le verbe עזב signifie abandonner ou délaisser. « Abandonné » exprime clairement ici la rupture de fidélité envers Dieu.
- source_word: וַיַּקְטִירוּ
  choice: et ont brûlé de l’encens
  rationale: À la forme causative, קטר désigne couramment l’action de faire fumer une offrande, en particulier de brûler de l’encens. Cette formulation convient au contexte idolâtre sans élargir indûment le sens à tout sacrifice.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: pour d’autres dieux
  rationale: אֲחֵרִים signifie littéralement « autres ». La préposition « pour » désigne naturellement en français les destinataires du culte.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: afin de provoquer ma colère
  rationale: La construction peut exprimer le but ou le résultat visé. Cette traduction conserve cette nuance sans décider si les adorateurs recherchaient consciemment la colère divine.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: par toutes les œuvres de leurs mains
  rationale: Le calque intelligible « œuvres de leurs mains » préserve une expression qui peut englober aussi bien les objets fabriqués, notamment les idoles, que les actes associés.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: ma fureur se déversera
  rationale: נתך évoque ce qui est versé ou déversé, tandis que חֵמָה désigne une colère intense. « Fureur » maintient la force du jugement et l’image du déversement.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sur ce lieu
  rationale: « Sur » s’accorde avec l’image de la fureur déversée et présente ce lieu comme la cible du jugement.
- source_word: וְלֹא תִכְבֶּה
  choice: et ne s’éteindra pas
  rationale: כבה signifie éteindre ou s’éteindre, généralement à propos d’un feu. La traduction conserve l’image vive du texte, même après celle du déversement.
theological_decisions:
- issue: Langage du jugement divin
  choice: ma fureur se déversera sur ce lieu et ne s’éteindra pas
  alternative: ma colère sera répandue sur ce lieu et ne pourra être apaisée
  rationale: Le choix retenu conserve à la fois l’intensité de חֵמָה et les deux images successives du texte hébreu — le déversement et le feu qu’on n’éteint pas — sans les harmoniser ni les réduire à une explication doctrinale.
- issue: Valeur de לְמַעַן dans l’action qui provoque Dieu
  choice: afin de provoquer ma colère
  alternative: de sorte qu’ils ont provoqué ma colère
  rationale: לְמַעַן peut marquer le but ou le résultat. La formulation retenue maintient la tension du texte et n’ajoute aucune explication sur l’intention psychologique des acteurs.
- issue: Référence à Dieu dans le discours à la première personne
  choice: m’, ma
  alternative: le SEIGNEUR, sa
  rationale: Les suffixes hébreux sont à la première personne. Les conserver rend directement la parole divine sans remplacer les pronoms par un nom qui ne figure pas dans ce verset.
translation_notes:
  register: Français international moderne, clair et digne. La structure causale du verset et son caractère de parole divine sont conservés. « Œuvres de leurs mains » maintient l’image hébraïque tout en étant éclairé par une note; la succession des métaphores de la fureur déversée puis inextinguible est volontairement préservée.
