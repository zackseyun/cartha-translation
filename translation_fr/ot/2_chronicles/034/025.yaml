  terminology: « Colère » rend bien חֵמָה dans ce contexte de jugement; « se déversera » préserve l’image de נתך, et « ne s’éteindra pas » maintient l’image du feu. « Œuvres de leurs mains » est conservé et la note en explique la portée.
