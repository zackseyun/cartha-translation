base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: fr
  text: La huitième année de son règne, alors qu’il était encore jeune, il commença à chercher le Dieu de David, son père[a]. La douzième année de son règne, il commença à purifier Juda et Jérusalem des hauts lieux, des ashéras[b], des images sculptées et des images de métal fondu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ancêtre ». Dans le langage dynastique biblique, « père » peut désigner un ancêtre, ici David.
    reason: lexical_alternative
  - marker: b
    text: Ou « poteaux d’Ashéra ». Le terme hébreu peut désigner des symboles cultuels associés à Ashéra, souvent des poteaux ou des arbres sacrés.
    reason: lexical_alternative
  - marker: c
    text: Ou « images coulées » ou « images fondues ». Il s’agit de représentations fabriquées en coulant du métal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: La huitième année de son règne
  rationale: L’expression temporelle situe l’action dans la huitième année du règne de Josias. Cette formulation est précise et naturelle en français.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: alors qu’il était encore jeune
  rationale: נַעַר peut désigner un garçon, un adolescent ou un jeune homme. « encore jeune » conserve cette amplitude sans présenter Josias comme un petit enfant.
- source_word: הֵחֵל לִדְרֹשׁ
  choice: il commença à rechercher
  rationale: Dans ce contexte religieux, דרשׁ exprime une démarche personnelle et délibérée vers Dieu, et non une simple demande de renseignements.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: le Dieu de David, son père
  rationale: « père » reproduit le langage dynastique hébreu reliant Josias à David. La note précise qu’il s’agit ici d’un ancêtre.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: La douzième année
  rationale: Le cadre des années de règne reste implicite mais clair par continuité avec la première proposition.
- source_word: הֵחֵל לְטַהֵר
  choice: il commença à purifier
  rationale: טהר évoque ici l’élimination de la souillure cultuelle. « purifier » restitue cette dimension religieuse plus exactement que le simple verbe « nettoyer ».
- source_word: אֶת יְהוּדָה וִירוּשָׁלַם
  choice: Juda et Jérusalem
  rationale: Les noms propres usuels sont conservés, ainsi que l’association du royaume et de sa capitale.
- source_word: מִן הַבָּמוֹת
  choice: des hauts lieux
  rationale: « hauts lieux » est le terme français établi pour les sites cultuels désignés par בָּמוֹת.
- source_word: וְהָאֲשֵׁרִים
  choice: des ashéras
  rationale: La translittération adaptée au français évite de trancher entre des poteaux, des arbres sacrés et d’autres symboles cultuels associés à la déesse Ashéra.
- source_word: וְהַפְּסִלִים
  choice: des statues sculptées
  rationale: פְּסִלִים désigne des représentations façonnées par la taille ou la sculpture. « statues sculptées » est actuel et plus précis que le terme général « idoles ».
- source_word: וְהַמַּסֵּכוֹת
  choice: des statues en métal fondu
  rationale: מַסֵּכוֹת désigne des représentations fabriquées par coulage du métal. La formulation française indique clairement à la fois la matière et le procédé.
theological_decisions:
- issue: Sens dynastique de « David, son père »
  choice: Conserver « père » dans le texte principal
  alternative: « ancêtre »
  rationale: L’hébreu emploie le vocabulaire normal de la filiation dynastique. Garder « père » maintient le lien littéraire avec la royauté davidique, tandis que la note prévient une lecture limitée au père immédiat.
- issue: Identification matérielle des אֲשֵׁרִים
  choice: Employer « ashéras » sans préciser leur forme dans le texte principal
  alternative: « poteaux sacrés » ou « poteaux d’Ashéra »
  rationale: Le mot peut désigner différents symboles cultuels associés à Ashéra. Une traduction plus concrète résoudrait une ambiguïté que le texte hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la progression temporelle de l’hébreu sans lourdeur. Les termes cultuels établis (« hauts lieux ») sont conservés, tandis que les réalités incertaines (« ashéras ») sont expliquées en note plutôt que précisées arbitrairement.
