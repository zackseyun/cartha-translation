  text: וּ/בְ/עָרֵ֨י מְנַשֶּׁ֧ה וְ/אֶפְרַ֛יִם וְ/שִׁמְע֖וֹן וְ/עַד נַפְתָּלִ֑י ב/הר בתי/הם סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: fr
  text: et dans les villes de Manassé, d’Éphraïm et de Siméon, jusqu’en Nephtali, dans leurs ruines alentour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du texte hébreu est difficile. Le texte consonantique peut évoquer littéralement « leurs maisons », mais le contexte favorise le sens de « leurs ruines » ou « leurs lieux dévastés alentour ».
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: ainsi que dans les villes de
  rationale: Le contexte appelle la poursuite de l’énumération. « Villes » rend naturellement עָרֵי dans un récit historique, tandis que « ainsi que » exprime la coordination avec ce qui précède.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Manassé, d’Éphraïm et de Siméon
  rationale: Les noms propres sont rendus selon leurs formes françaises bibliques usuelles; les prépositions répétées en français rendent clairement leur relation avec « villes ».
- source_word: וְ/עַד נַפְתָּלִי
  choice: jusqu’en Nephtali
  rationale: עַד indique la limite géographique atteinte. « Jusqu’en » convient ici puisque Nephtali désigne le territoire tribal.
- source_word: ב/הר בתי/הם
  choice: au milieu de leurs ruines
  rationale: La forme transmise est difficile et paraît textuellement ou orthographiquement irrégulière. Dans le contexte de la dévastation des lieux de culte, « ruines » donne le sens contextuel le plus vraisemblable sans dissimuler l’incertitude, laquelle est signalée en note.
- source_word: סָבִיב
  choice: alentour
  rationale: סָבִיב exprime ce qui se trouve tout autour. « Alentour » est concis, naturel et conserve la portée spatiale du terme.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la forme de continuation du verset hébreu et signale en note l’incertitude textuelle de sa dernière expression.
