  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: fr
  text: Il démolit les autels et les ashéras[a], réduisit en poudre les statues sculptées et abattit tous les piliers consacrés au soleil[b] dans tout le pays d’Israël. Puis il retourna à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poteaux d’Ashéra ». Le terme hébreu désigne des objets cultuels associés à la déesse Ashéra; leur forme exacte pouvait varier selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Le terme hébreu désigne un type d’objet cultuel dont l’identification exacte est discutée. Autres traductions possibles : « autels à encens » ou « brûle-parfums ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: Il démolit
  rationale: Le verbe נתץ désigne la destruction ou la démolition de structures; « démolit » convient naturellement aux autels.
- source_word: הַמִּזְבְּחוֹת
  choice: les autels
  rationale: Équivalent français courant et précis de מִזְבְּחוֹת dans ce contexte cultuel.
- source_word: הָאֲשֵׁרִים
  choice: les ashéras
  rationale: La translittération préserve la désignation particulière d’objets cultuels liés à Ashéra sans imposer une forme physique unique.
- source_word: הַפְּסִלִים
  choice: les statues sculptées
  rationale: Le terme désigne des représentations cultuelles taillées; « statues sculptées » en exprime concrètement la nature sans recourir au terme générique « idoles ».
- source_word: כִּתַּת לְהֵדַק
  choice: réduisit en poudre
  rationale: L’expression décrit un broyage poussé jusqu’à l’obtention de particules fines.
- source_word: הַחַמָּנִים
  choice: les piliers consacrés au soleil
  rationale: חַמָּנִים désigne vraisemblablement des objets cultuels associés au soleil, souvent compris comme des piliers; l’identification demeure toutefois discutée et fait l’objet d’une note.
- source_word: גִּדַּע
  choice: abattit
  rationale: גדע exprime l’action de couper ou d’abattre des objets dressés.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: dans tout le pays d’Israël
  rationale: Formulation française naturelle qui conserve l’étendue géographique de l’action.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Puis il retourna à Jérusalem
  rationale: « Puis » restitue clairement la progression narrative du wayyiqtol.
theological_decisions:
- issue: Désignation des objets liés aux cultes idolâtres
  choice: 'Conserver des catégories concrètes et distinctes : « ashéras », « statues sculptées » et « piliers consacrés au soleil ».'
  alternative: Uniformiser par des termes génériques comme « idoles » ou « objets idolâtres ».
  rationale: La formulation retenue respecte la diversité lexicale de l’hébreu et la portée concrète de la réforme de Josias, sans ajouter d’interprétation confessionnelle.
- issue: Identification de הַחַמָּנִים
  choice: « piliers consacrés au soleil » dans le texte, avec signalement de l’incertitude en note.
  alternative: « autels à encens » ou « brûle-parfums ».
  rationale: Le lien étymologique et plusieurs emplois bibliques favorisent une association solaire, mais la nature exacte de ces objets cultuels reste incertaine; la note maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. Les termes cultuels spécifiques sont conservés et brièvement expliqués en notes.
