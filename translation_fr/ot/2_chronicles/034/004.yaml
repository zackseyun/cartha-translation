source:
  edition: WLC
  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: fr
  text: Ils démolirent devant lui les autels des Baals. Il abattit les autels à encens[a] qui se trouvaient au-dessus d’eux. Il brisa et réduisit en poussière les ashérim[b], les statues sculptées et les statues en métal fondu, puis en dispersa les débris sur les tombes de ceux qui leur avaient offert des sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les piliers solaires ». Le terme hébreu est incertain et peut désigner des piliers cultuels associés au culte du soleil.
    reason: lexical_alternative
  - marker: b
    text: Ou « les poteaux d’Ashéra ». Il s’agit d’objets cultuels associés à la déesse Ashéra, dont la forme exacte n’est pas certaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: Ils démolirent
  rationale: Le verbe נתץ désigne la démolition d’ouvrages ou de structures. Le sujet pluriel explicite respecte la forme hébraïque.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Expression française naturelle qui conserve l’idée que l’action se déroule en présence de Josias.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: les autels des Baals
  rationale: Le pluriel « Baals » rend בְּעָלִים et peut évoquer diverses manifestations locales du culte de Baal.
- source_word: הַחַמָּנִים
  choice: les autels à encens
  rationale: Ce terme cultuel difficile peut désigner des autels à encens ou des piliers liés au culte solaire. Le choix contextuel est accompagné d’une note qui maintient l’incertitude.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: qui se trouvaient au-dessus d’eux
  rationale: La proposition relative est rattachée aux חַמָּנִים et décrit leur position par rapport aux autels des Baals.
- source_word: גִּדֵּעַ
  choice: Il abattit
  rationale: גדע exprime l’action de couper ou d’abattre; « abattit » convient à la destruction d’objets cultuels dressés ou surélevés.
- source_word: הָאֲשֵׁרִים
  choice: les ashérim
  rationale: La translittération préserve l’ambiguïté entre des objets cultuels et des poteaux associés à la déesse Ashéra.
- source_word: הַפְּסִלִים
  choice: les statues sculptées
  rationale: Le terme désigne des représentations cultuelles taillées ou sculptées; cette traduction reste plus précise que le terme général « idoles ».
- source_word: הַמַּסֵּכוֹת
  choice: les statues en métal fondu
  rationale: מסכות désigne des représentations fabriquées par fonte du métal.
- source_word: שִׁבַּר וְהֵדַק
  choice: Il brisa et réduisit en poussière
  rationale: La combinaison des deux verbes décrit une destruction suivie d’un broyage poussé; « réduisit en poussière » exprime clairement l’intensité de הדק.
- source_word: וַיִּזְרֹק
  choice: puis en dispersa les débris
  rationale: Le verbe signifie jeter ou disperser. Le complément « les débris » explicite naturellement en français ce qui reste des objets détruits.
- source_word: הַקְּבָרִים הַזֹּבְחִים לָהֶם
  choice: les tombes de ceux qui leur avaient offert des sacrifices
  rationale: La construction est comprise comme désignant les tombes des personnes qui avaient sacrifié à ces objets ou divinités cultuels.
theological_decisions:
- issue: Rendu de הָאֲשֵׁרִים
  choice: les ashérim
  alternative: les poteaux d’Ashéra
  rationale: La translittération ne tranche pas entre plusieurs types possibles d’objets cultuels associés à Ashéra; la note fournit le rendu interprétatif courant.
- issue: Rendu de הַחַמָּנִים
  choice: les autels à encens
  alternative: les piliers solaires
  rationale: Le sens exact du terme est discuté. Le texte principal retient une interprétation possible dans le contexte des réformes cultuelles, tandis que la note conserve l’autre analyse importante.
- issue: Référent de לָהֶם (« leur »)
  choice: pronom pluriel maintenu
  alternative: à ces idoles / à ces divinités
  rationale: Le pronom hébreu laisse son référent dans le contexte. Le conserver évite de préciser indûment s’il renvoie aux objets cultuels, aux Baals ou aux divinités représentées.
translation_notes:
  register: Français international moderne, clair et digne. L’alternance entre le sujet pluriel initial (« Ils démolirent ») et Josias comme sujet singulier des verbes suivants respecte la syntaxe hébraïque. Les termes cultuels incertains sont conservés ou expliqués sans imposer une reconstruction confessionnelle.
