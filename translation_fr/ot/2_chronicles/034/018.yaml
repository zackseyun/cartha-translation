source:
  edition: WLC
  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סּוֹפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖הוּ הַ/כֹּהֵ֑ן וַ/יִּקְרָא ב֥/וֹ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: fr
  text: 'Puis Shaphân, le scribe, informa le roi : « Le prêtre Hilqiya m’a donné un livre[a]. » Et Shaphân en fit la lecture devant le roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un rouleau ». Le mot hébreu peut désigner de manière générale un écrit ou un livre ; à cette époque, celui-ci se présentait souvent sous la forme d’un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informa
  rationale: Le hiphil de נגד signifie ici « informer, rapporter ». « Informa » convient à une communication officielle adressée au roi, sans alourdir la phrase.
- source_word: הַסּוֹפֵר
  choice: le scribe
  rationale: סֹפֵר peut désigner un scribe ou secrétaire royal. « Scribe » conserve le terme historique et reste compréhensible en français moderne.
- source_word: סֵפֶר
  choice: un livre
  rationale: סֵפֶר désigne largement un écrit, un document ou un livre. « Livre » rend ce sens général sans imposer une forme matérielle précise.
- source_word: נָתַן לִי
  choice: m’a donné
  rationale: 'Le passé composé exprime naturellement en français une action achevée dont le résultat demeure pertinent : Shaphân possède maintenant le livre.'
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: le prêtre Hilqiya
  rationale: Le titre est traduit et le nom propre translittéré. L’ordre français « le prêtre Hilqiya » est naturel tout en conservant les deux éléments de l’hébreu.
- source_word: וַיִּקְרָא בוֹ
  choice: en fit la lecture
  rationale: Le pronom « en » rend la préposition בּוֹ et indique que Shaphân lut à partir du livre. La tournure convient à une lecture à voix haute dans un cadre royal.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: « Devant le roi » exprime avec concision la présence de Shaphân auprès du roi pendant la lecture.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le deux-points rend naturellement לֵאמֹר sans calquer la formule hébraïque « en disant ». La répétition du nom de Shaphân est conservée pour suivre la progression explicite du récit.
