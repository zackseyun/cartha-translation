source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: fr
  text: Josias supprima toutes les abominations de tous les territoires appartenant aux Israélites[a], et il obligea tous ceux qui se trouvaient en Israël à servir Yahweh, leur Dieu[b]. Pendant toute sa vie, ils ne se détournèrent pas de Yahweh, le Dieu de leurs pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de toutes les terres qui appartenaient aux fils d’Israël ».'
    reason: La note conserve la forme familiale et la construction possessive plus littérales de l’hébreu.
  - marker: b
    text: 'Autre traduction : « il fit en sorte que tous ceux qui se trouvaient en Israël servent Yahweh, leur Dieu ».'
    reason: Cette variante rend plus formellement le causatif hébreu sans expliciter le degré de contrainte.
  - marker: c
    text: L’expression « leurs pères » désigne les générations antérieures d’Israël.
    reason: La note éclaire la formule ancestrale sans remplacer son vocabulaire dans le texte principal.
lexical_decisions:
- source_word: וַיָּסַר
  choice: supprima
  rationale: Le hiphil de סור signifie ici enlever ou faire disparaître. « Supprima » convient au contexte des réformes de Josias.
- source_word: הַתּוֹעֵבוֹת
  choice: les abominations
  rationale: Le terme désigne des objets ou pratiques particulièrement odieux, notamment dans le domaine idolâtre; « abominations » en conserve la forte portée cultuelle.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: de tous les territoires appartenant aux Israélites
  rationale: Le pluriel אֲרָצוֹת désigne ici des terres ou territoires. Cette formulation restitue naturellement en français la construction avec ל et l’association de ces territoires aux fils d’Israël.
- source_word: וַיַּעֲבֵד
  choice: il obligea … à servir
  rationale: Le hiphil de עבד est causatif. « Obligea … à servir » préserve l’action imposée par le roi sans préciser une forme de coercition que le texte ne donne pas.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: tous ceux qui se trouvaient en Israël
  rationale: Le participe niphal signifie littéralement « ceux qui étaient trouvés », mais l’expression idiomatique française « ceux qui se trouvaient » exprime naturellement leur présence en Israël.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: servir Yahweh, leur Dieu
  rationale: « Servir » conserve le sens large de עבד, qui inclut le culte sans se limiter aux actes liturgiques.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כָּל יָמָיו
  choice: Pendant toute sa vie
  rationale: Le suffixe singulier renvoie naturellement à Josias; l’expression indique la durée de sa vie ou de son règne.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: ils ne cessèrent pas de suivre Yahweh
  rationale: La construction exprime le fait de ne pas se détourner de la suite de Yahweh. Cette formulation française est claire et conserve l’idée de fidélité continue.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  rationale: La traduction maintient la formule générationnelle et patriarcale explicite du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; sa translittération préserve le nom personnel au lieu de lui substituer un titre.
- issue: Force causative de וַיַּעֲבֵד
  choice: il obligea tous ceux qui se trouvaient en Israël à servir
  alternative: il amena tous ceux qui se trouvaient en Israël à servir
  rationale: Le hiphil présente Josias comme faisant activement servir le peuple. « Obligea » conserve cette force sans ajouter de moyen coercitif particulier.
- issue: Référent de כָּל יָמָיו et sujet de לֹא סָרוּ
  choice: Pendant toute sa vie, ils ne cessèrent pas
  alternative: Tous ceux qui se trouvaient en Israël ne cessèrent pas, pendant toute sa vie
  rationale: Le suffixe singulier de « ses jours » renvoie à Josias, tandis que le verbe pluriel « ils ne se détournèrent pas » renvoie au groupe présent en Israël. La traduction conserve cette transition grammaticale et la tension entre la réforme royale et la fidélité collective.
- issue: Formule אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: le Dieu de leurs pères
  alternative: le Dieu de leurs ancêtres
  rationale: « Pères » reproduit la formulation masculine et la formule d’alliance du texte sans la généraliser silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe suit le mouvement du verset hébreu tout en évitant les calques peu naturels. « Israélites » est préféré à « fils d’Israël » dans le corps du texte, la forme littérale étant conservée en note.
