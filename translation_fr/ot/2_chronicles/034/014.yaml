base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: fr
  text: Lorsqu’ils sortirent l’argent qui avait été apporté dans la maison de Yahweh, le prêtre Hilqiya trouva le livre de la loi de Yahweh transmise par l’intermédiaire de Moïse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse »; cette expression peut aussi se traduire par « par Moïse » ou « par l’intermédiaire de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: Lorsqu’ils sortirent
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe de 3e personne du pluriel forme une proposition temporelle. « Lorsqu’ils sortirent » est naturel en français et conserve le sujet pluriel du texte hébreu.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne littéralement l’argent métal, mais aussi l’argent comme fonds. Dans le contexte des sommes recueillies pour la restauration du temple, « l’argent » rend naturellement les deux dimensions.
- source_word: הַמּוּבָא
  choice: qui avait été apporté
  rationale: Le participe hofal de בוא exprime une action passive. Le plus-que-parfait français marque clairement que l’argent avait déjà été apporté avant d’être sorti.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » traduit formellement בַּיִת tout en restant intelligible comme désignation du temple; le nom divin est rendu par « Yahweh ».
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: le prêtre Hilqiya
  rationale: Cette apposition est idiomatique en français. « Hilqiya » représente directement la forme hébraïque du nom.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: le livre de la loi de Yahweh
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un document; « livre » convient au contexte. תּוֹרָה signifie instruction ou loi; « loi » est ici la désignation contextuelle la plus naturelle sans exclure la notion d’enseignement.
- source_word: בְּיַד מֹשֶׁה
  choice: transmise par l’intermédiaire de Moïse
  rationale: L’expression signifie littéralement « par la main de Moïse » et marque couramment l’agence ou la médiation. La formulation française explicite sobrement cette médiation sans trancher la question précise de la rédaction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de בְּיַד מֹשֶׁה
  choice: transmise par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: L’expression affirme le rôle médiateur de Moïse, mais ne précise pas à elle seule les modalités exactes de composition du livre. Le rendu choisi préserve cette réserve.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche de l’hébreu sans reproduire son idiome de manière obscure. Le nom divin est translittéré « Yahweh » et le marqueur de note [a] est placé après l’expression qu’il explique.
