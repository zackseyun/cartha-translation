  text: וְ/הָ/אֲנָשִׁים֩ עֹשִׂ֨ים בֶּ/אֱמוּנָ֜ה בַּ/מְּלָאכָ֗ה וַ/עֲלֵי/הֶ֣ם מֻ֠פְקָדִים יַ֣חַת וְ/עֹבַדְיָ֤הוּ הַ/לְוִיִּם֙ מִן בְּנֵ֣י מְרָרִ֔י וּ/זְכַרְיָ֧ה וּ/מְשֻׁלָּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים לְ/נַצֵּ֑חַ וְ/הַ֨/לְוִיִּ֔ם כָּל מֵבִ֖ין בִּ/כְלֵי שִֽׁיר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: fr
  text: Les hommes travaillaient fidèlement à leur travail. Yahath et Abdias, des lévites descendants de Merari, ainsi que Zacharie et Meshoullam, descendants des Qehatites, étaient préposés à leur surveillance[a] ; et les lévites étaient tous habiles à jouer des instruments de musique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour diriger le travail » ; le verbe hébreu peut désigner une fonction de direction ou de surveillance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tous ceux qui comprenaient les instruments de chant », c’est-à-dire tous ceux qui savaient en jouer.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: fidèlement
  rationale: Le nom אֱמוּנָה a ici une valeur adverbiale et décrit la fiabilité et l’intégrité avec lesquelles les hommes accomplissaient leur tâche.
- source_word: בַּמְּלָאכָה
  choice: leur travail
  rationale: מְלָאכָה désigne ici les travaux de réparation du temple. Le possessif rend la tournure naturelle en français sans changer le référent.
- source_word: מֻפְקָדִים
  choice: avaient été placés à leur tête
  rationale: Le participe hophal de פקד exprime une désignation à une fonction de responsabilité; cette formulation conserve la valeur passive et s’accorde avec וַעֲלֵיהֶם.
- source_word: יַחַת
  choice: Yahath
  rationale: Transcription française du nom propre hébreu.
- source_word: עֹבַדְיָהוּ
  choice: Abdias
  rationale: Forme française biblique courante de ce nom propre.
- source_word: מִן בְּנֵי מְרָרִי
  choice: descendants de Merari
  rationale: La formule généalogique «fils de» désigne ici l’appartenance au clan; «descendants» est clair et naturel en français moderne.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française courante du nom propre.
- source_word: מְשֻׁלָּם
  choice: Meshoullam
  rationale: Transcription française transparente du nom propre.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: descendants des Qehatites
  rationale: La formulation conserve à la fois l’idée généalogique de בְּנֵי et la désignation clanique הַקְּהָתִים.
- source_word: לְנַצֵּחַ
  choice: pour les superviser
  rationale: Dans le contexte administratif des travaux du temple, נצח indique la direction ou la surveillance du travail.
- source_word: כָּל מֵבִין
  choice: tous ... qui savaient jouer
  rationale: Le participe מֵבִין exprime ici une compétence pratique; la relative française évite de laisser entendre que tous les lévites sans exception possédaient cette compétence.
- source_word: בִּכְלֵי שִׁיר
  choice: des instruments de musique
  rationale: La locution signifie littéralement «instruments de chant» et désigne idiomatiquement des instruments servant à la musique.
theological_decisions:
- issue: Lien syntaxique de la dernière proposition concernant les lévites musiciens
  choice: La présenter comme un groupe supplémentaire au moyen de «Il y avait aussi»
  alternative: Rattacher directement ces lévites aux responsables chargés de superviser les ouvriers
  rationale: L’hébreu coordonne abruptement וְהַלְוִיִּם après לְנַצֵּחַ et la fonction précise de ce dernier groupe n’est pas explicitée dans le verset. La traduction évite donc de leur attribuer avec certitude une fonction administrative, tout en maintenant leur présence dans l’organisation des travaux.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque très coordonnée a été répartie en trois phrases pour assurer la lisibilité. Les noms suivent les formes françaises courantes lorsqu’elles sont bien établies; les autres sont transcrits.
