  text: וַ/תֹּ֣אמֶר לָ/הֶ֔ם כֹּה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: fr
  text: 'Elle leur dit : « Voici ce que dit Yahweh, le Dieu d’Israël : Dites à l’homme qui vous a envoyés vers moi : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: Elle leur dit
  rationale: Le wayyiqtol poursuit le récit; en français, le passé simple rend naturellement cette succession sans qu’il soit nécessaire d’ajouter « et ».
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule de messager prophétique rendue dans un français actuel et solennel; le présent « dit » fait entendre la parole transmise comme directement valable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin YHWH, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la construction hébraïque et identifie Yahweh comme le Dieu d’Israël.
- source_word: אִמְרוּ לָאִישׁ
  choice: Dites à l’homme
  rationale: L’impératif est au pluriel et אִישׁ est un nom masculin singulier désignant l’homme qui a envoyé la délégation.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: qui vous a envoyés vers moi
  rationale: La relative identifie l’homme par son action; « vers moi » conserve explicitement la direction exprimée par אֵלַי. L’accord « envoyés » correspond au groupe masculin pluriel auquel la prophétesse s’adresse.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » préserve le nom propre tout en évitant de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste solennelle sans calque raide. Les deux-points finaux sont conservés, car la parole à transmettre se poursuit au verset suivant.
