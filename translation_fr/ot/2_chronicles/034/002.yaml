source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: fr
  text: Il fit ce qui est juste aux yeux de Yahvé[a] et suivit les voies de David, son père[b] ; il ne s’en écarta ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Yahvé ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « père » signifie « ancêtre » au sens dynastique.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Il fit ce qui est juste
  rationale: Dans cette formule d’évaluation royale, עשה avec l’adjectif substantivé הַיָּשָׁר signifie naturellement « faire ce qui est juste ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahvé
  rationale: Cette formulation conserve l’image hébraïque de l’évaluation divine tout en étant naturelle en français.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: suivit les voies de
  rationale: Littéralement « marcha dans les voies de ». « Suivit les voies de » exprime clairement la conduite conforme à un modèle sans produire une tournure française pesante.
- source_word: דָּוִיד אָבִיו
  choice: David, son père
  rationale: Le français conserve le terme relationnel « père », employé ici au sens dynastique d’ancêtre.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: il ne s’en écarta ni à droite ni à gauche
  rationale: Cette formulation garde la métaphore du chemin et l’idiome hébraïque de l’absence totale de déviation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » rend le nom propre divin en français courant, tandis qu’une note signale la convention traditionnelle « le SEIGNEUR ».
translation_notes:
  register: Français moderne, digne et accessible. La traduction conserve l’image des « yeux » et celle du chemin, tout en rendant וַיֵּלֶךְ בְּדַרְכֵי par l’expression française naturelle « suivit les voies de ».
