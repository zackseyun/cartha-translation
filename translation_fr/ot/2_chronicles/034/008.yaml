base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: fr
  text: La dix-huitième année de son règne, après avoir purifié le pays et la maison[a], il envoya Shaphân, fils d’Atsalia, Maaséya, chef de la ville, et Yoah, fils de Yoahaz, l’archiviste, pour réparer[b] la maison de Yahvé, son Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays et la maison »; ici, la « maison » désigne le Temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « consolider »; dans le contexte d’un bâtiment, il s’agit de le réparer ou de le restaurer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: La dix-huitième année de son règne
  rationale: Formule chronologique naturelle en français; la coordination initiale hébraïque assure la continuité narrative sans exiger « et » en tête de phrase.
- source_word: לְטַהֵר הָאָרֶץ וְהַבָּיִת
  choice: après avoir purifié le pays et la Maison
  rationale: Le contexte antérieur présente la purification comme déjà engagée puis accomplie avant les travaux. « Maison », avec une majuscule contextuelle, conserve le lien lexical avec la maison de Yahvé tout en signalant le Temple.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ
  choice: Shaphân, fils d’Atsalia
  rationale: Translittération adaptée aux usages et à la prononciation du français.
- source_word: מַעֲשֵׂיָהוּ שַׂר הָעִיר
  choice: Maaséya, chef de la ville
  rationale: שַׂר désigne ici un haut responsable municipal; « chef » reste précis sans imposer le titre moderne de gouverneur.
- source_word: יוֹאָח בֶּן יוֹאָחָז הַמַּזְכִּיר
  choice: Yoah, fils de Yoahaz, le secrétaire-archiviste
  rationale: Le titre désigne un officier royal chargé de la mémoire administrative et des documents; le double terme français rend plus clairement cette fonction qu’« archiviste » ou « secrétaire » seul.
- source_word: לְחַזֵּק אֶת בֵּית
  choice: pour réparer la maison
  rationale: Le sens premier est « fortifier, consolider »; appliqué à un bâtiment, le verbe désigne sa remise en état.
- source_word: יְהוָה אֱלֹהָיו
  choice: Yahvé, son Dieu
  rationale: Le nom divin est rendu comme nom propre, tandis que le possessif personnel est conservé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahvé » le rend comme nom propre dans une forme française largement intelligible, sans le remplacer par un titre.
- issue: Rapport temporel ou final de לְטַהֵר
  choice: après avoir purifié
  alternative: afin de purifier
  rationale: La forme hébraïque permet formellement une lecture finale, mais la progression du récit situe la mission de réparation après la campagne de purification. Le choix suit ce contexte sans assimiler purification et travaux.
translation_notes:
  register: Français international actuel, narratif et digne. Les noms propres suivent une translittération lisible en français. « Maison » maintient l’écho lexical hébreu avec « la maison de Yahvé », tandis que « secrétaire-archiviste » explicite sobrement une fonction administrative ancienne.
