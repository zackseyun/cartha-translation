base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: fr
  text: « Voici, je vais te réunir à tes pères[a], et tu seras recueilli dans ton tombeau[b], en paix[c]. Tes yeux ne verront pas tout le malheur que je vais faire venir sur ce lieu et sur ses habitants. » Ils rapportèrent la réponse au roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tes ancêtres ». L’hébreu dit littéralement « à tes pères », expression courante évoquant le fait de rejoindre ses ancêtres dans la mort.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le pluriel, littéralement « tes tombeaux ». Il peut désigner les sépultures familiales ou ancestrales; le singulier est plus idiomatique en français.
    reason: source_form
  - marker: c
    text: Ici, « en paix » renvoie vraisemblablement au fait que Josias mourra avant de voir le malheur annoncé, comme l’explique la proposition suivante; l’expression n’implique pas nécessairement que sa mort elle-même sera sans violence.
    reason: theological_tension
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici, je vais
  rationale: « Voici » conserve le marqueur solennel de discours, tandis que « je vais » rend la valeur imminente de la construction.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: te réunir à tes pères
  rationale: Conserve la métaphore funéraire hébraïque et son expression traditionnelle, tout en signalant en note le sens d’« ancêtres ».
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: tu seras recueilli dans tes tombeaux
  rationale: Le passif reprend le verbe précédent et le pluriel « tombeaux » reflète קִבְרֹתֶיךָ, qui peut désigner les sépultures familiales ou ancestrales.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: Formulation large et traditionnelle qui préserve la tension avec la mort ultérieure de Josias au combat.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Tes yeux ne verront pas
  rationale: Conserve l’expression corporelle explicite et emphatique de l’hébreu.
- source_word: בְּכֹל הָרָעָה
  choice: tout le malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne le désastre annoncé plutôt que le mal moral; « malheur » est naturel et garde une certaine amplitude sémantique.
- source_word: אֲנִי מֵבִיא
  choice: je vais faire venir
  rationale: Rend la causalité divine portée par le hiphil de בוא et le caractère imminent de la forme participiale.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: sur ce lieu et sur ses habitants
  rationale: Traduction directe, claire et idiomatique des destinataires du jugement.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Ils rapportèrent cette réponse au roi
  rationale: Rend naturellement l’idiome d’un message ramené au roi après consultation.
theological_decisions:
- issue: Sens de « en paix » malgré la mort ultérieure de Josias au combat
  choice: Conserver « en paix » sans préciser dans le texte la nature de cette paix.
  alternative: Interpréter explicitement la formule comme une mort non violente ou seulement comme des funérailles paisibles.
  rationale: La proposition suivante associe cette paix au fait que Josias ne verra pas le malheur annoncé. La note préserve cette relation sans supprimer la tension narrative.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les parallélismes et images funéraires de l’hébreu sont conservés, avec des notes pour les expressions susceptibles d’être mal comprises.
