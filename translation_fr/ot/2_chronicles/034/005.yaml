  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: fr
  text: Il brûla les ossements des prêtres sur leurs autels[a] et purifia Juda et Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les autels ». La forme hébraïque est inhabituelle; le sens paraît être que Josias brûla les ossements des prêtres sur les autels auxquels ils étaient associés.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: les ossements des prêtres
  rationale: Le pluriel construit עַצְמוֹת désigne ici des os humains. « Ossements » convient naturellement à des restes humains dans un récit digne. Le texte dit seulement « prêtres »; il n’est donc pas nécessaire d’ajouter « idolâtres ».
- source_word: שָׂרַף
  choice: il brûla
  rationale: Le qal accompli 3ms signifie « brûler ». Le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: עַל
  choice: sur
  rationale: La préposition indique directement que les ossements furent brûlés sur les autels.
- source_word: מזבחותים
  choice: leurs autels
  rationale: La forme massorétique est inhabituelle, mais paraît porter un suffixe de troisième personne du pluriel. « Leurs autels » conserve cette lecture probable, avec une note signalant l’incertitude.
- source_word: וַ/יְטַהֵר
  choice: et purifia
  rationale: Le piel de טהר exprime ici l’élimination de la souillure cultuelle liée au culte illicite. « Purifier » préserve cette portée rituelle et morale mieux que le simple verbe « nettoyer ».
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: Juda et Jérusalem
  rationale: Les deux noms sont les objets directs de « purifia » et désignent le territoire ainsi que sa capitale, selon leurs formes françaises usuelles.
theological_decisions:
- issue: Nature de la purification
  choice: purification cultuelle et morale de Juda et de Jérusalem, souillés par le culte illicite
  alternative: purification uniquement cérémonielle, ou simple nettoyage matériel
  rationale: Dans le contexte de la réforme de Josias, טהר dépasse une opération matérielle sans pour autant exiger l’ajout d’une formulation doctrinale absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif écrit. « Ossements » et « purifia » rendent précisément le contexte funéraire et cultuel sans explicitation confessionnelle.
