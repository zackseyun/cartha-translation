source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: fr
  text: Ils le remirent aux ouvriers préposés à la maison de Yahweh[a]. Les ouvriers qui travaillaient dans la maison de Yahweh le donnèrent pour réparer[b] et consolider la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Yahweh » désigne ici le temple.
    reason: cultural_note
  - marker: b
    text: Ou « remettre en état ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ils le remirent / le donnèrent
  rationale: Le verbe נתן signifie largement « donner, remettre, confier ». « Remettre » convient au premier transfert vers les responsables, tandis que « donner » rend naturellement le second transfert, tout en reflétant la répétition du même verbe hébreu.
- source_word: עַל יַד
  choice: aux
  rationale: L’expression signifie ici confier quelque chose à la responsabilité ou au contrôle de quelqu’un. Le français idiomatique « remettre à » exprime clairement cette relation sans calquer lourdement l’image de la main.
- source_word: עֹשֵׂה הַמְּלָאכָה הַמֻּפְקָדִים
  choice: aux ouvriers qui avaient été chargés
  rationale: Le participe passif de פקד indique que ces ouvriers avaient reçu une responsabilité. Cette formulation conserve l’idée d’une charge officiellement confiée sans préciser davantage la nature exacte de leur fonction.
- source_word: בְּבֵית יְהוָה
  choice: de / dans la maison de Yahweh
  rationale: La première préposition se comprend avec l’idée d’être chargé de la maison; dans la seconde occurrence, elle situe les travaux dans celle-ci. « Maison » conserve l’expression hébraïque, explicitée en note comme désignant le temple.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom renvoie à l’argent mentionné dans le contexte précédent. Le maintien d’un pronom respecte la formulation du verset sans ajouter explicitement « l’argent ».
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: les ouvriers qui travaillaient
  rationale: Cette formulation française naturelle conserve la répétition sémantique de עשה et présente l’action comme en cours.
- source_word: לִבְדּוֹק
  choice: pour réparer
  rationale: Dans les récits de travaux au temple, בדק désigne la réparation ou la remise en état des parties défectueuses, plutôt qu’une simple inspection.
- source_word: וּלְחַזֵּק
  choice: et consolider
  rationale: La forme intensive de חזק exprime l’action de rendre le bâtiment solide. « Consolider » est précis et naturel dans un contexte architectural.
- source_word: הַבָּיִת
  choice: la maison
  rationale: Le nom désigne ici le temple. Sa traduction littérale maintient la cohérence avec « la maison de Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le tétragramme; « Yahweh » le représente comme nom propre et évite de le remplacer par un titre.
- issue: Sens de « maison » dans l’expression « maison de Yahweh »
  choice: conserver « maison » dans le texte et préciser « temple » en note
  alternative: traduire directement par « temple »
  rationale: La traduction conserve l’image et la répétition hébraïques tout en donnant au lecteur l’information culturelle nécessaire.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe distingue les ouvriers investis d’une responsabilité de ceux qui exécutaient les travaux, tout en évitant un vocabulaire administratif trop technique.
