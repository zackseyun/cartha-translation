  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: fr
  text: 'Le roi donna alors cet ordre à Hilqiya, à Ahiqam, fils de Shafân, à Abdôn, fils de Mika[a], à Shafân, le secrétaire, et à Asaïa, serviteur du roi[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte massorétique porte « Abdôn, fils de Mika ». Le passage parallèle de 2 Rois 22.12 porte « Akbor, fils de Mikaya ».
    reason: textual_variant
  - marker: b
    text: Ou « Asaïa, fonctionnaire du roi ». L’hébreu dit littéralement « serviteur du roi », expression qui peut désigner un fonctionnaire de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Le roi donna alors cet ordre
  rationale: Cette formulation française naturelle conserve la force autoritative de צוה et la progression narrative marquée par וַ. Le deux-points introduit les paroles qui suivent au verset suivant.
- source_word: חִלְקִיָּהוּ
  choice: Hilqiya
  rationale: Translittération française moderne du nom hébreu.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahiqam, fils de Shafân
  rationale: Les noms sont translittérés et בן est rendu par la formule française claire « fils de ».
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Abdôn, fils de Mika
  rationale: Cette traduction suit le texte massorétique des Chroniques tout en signalant en note la leçon parallèle de 2 Rois 22.12.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: Shafân, le secrétaire
  rationale: Dans le cadre de la cour royale, סֹפֵר désigne ici vraisemblablement un secrétaire chargé de fonctions administratives; « secrétaire » est plus immédiatement compréhensible que « scribe » en français moderne.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaïa, serviteur du roi
  rationale: « Serviteur » conserve le sens direct de עֶבֶד, sans effacer le fait que le terme peut désigner un fonctionnaire de la cour.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français narratif moderne, le deux-points introduit naturellement le discours à venir et évite le calque pesant « en disant ».
