base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: fr
  text: 'Alors Hilqiya et ceux que le roi avait envoyés allèrent trouver la prophétesse Hulda, femme de Shalloum, fils de Toqath, fils de Hasra et gardien des vêtements[a]. Elle habitait à Jérusalem, dans le deuxième quartier[b]. Ils lui parlèrent en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsable de la garde-robe ». L’hébreu dit littéralement « gardien des vêtements ».
    reason: lexical_alternative
  - marker: b
    text: Hébreu mishné, probablement la désignation d’un quartier de Jérusalem; traditionnellement traduit par « le second quartier ».
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: allèrent trouver
  rationale: Le verbe הלך signifie « aller »; avec un complément personnel introduit par אֶל, « aller trouver » est naturel en français et exprime clairement le déplacement vers Hulda.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: et ceux que le roi avait envoyés
  rationale: L’expression hébraïque est elliptique. Le contexte du verset précédent identifie ces personnes comme les membres de la délégation envoyée par le roi; le plus-que-parfait explicite sobrement ce rapport.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: la prophétesse Hulda
  rationale: Le substantif hébreu est explicitement féminin. « Prophétesse » en conserve le genre et reste courant en français moderne.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: femme de Shalloum
  rationale: La construction indique directement la relation conjugale; « femme de » convient au registre généalogique du passage.
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: fils de Toqath et petit-fils de Hasra
  rationale: Le second בֶּן rattache Hasra à l’ascendance de Shalloum. « Petit-fils » rend la relation sans ambiguïté en français tout en conservant la chaîne généalogique.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: gardien des vêtements
  rationale: Traduction proche du sens littéral, qui évite de préciser sans certitude s’il s’agit d’une charge officielle liée à la garde-robe.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: Elle habitait
  rationale: Le participe fournit une information d’arrière-plan sur le lieu de résidence; l’imparfait est idiomatique en français narratif.
- source_word: בַּמִּשְׁנֶה
  choice: dans le Second Quartier
  rationale: מִשְׁנֶה désigne vraisemblablement un quartier déterminé de Jérusalem. La traduction garde l’idée de « second » tout en signalant par les majuscules qu’il s’agit probablement d’un toponyme.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'Ils lui parlèrent en ces termes :'
  rationale: Cette formule française actuelle et digne introduit naturellement le discours qui suit et conserve la fonction démonstrative de כָּזֹאת.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide, les titres et relations familiales sont explicites, et les deux réalités incertaines — la fonction de Shalloum et le nom du quartier — sont conservées sans surinterprétation grâce aux notes.
