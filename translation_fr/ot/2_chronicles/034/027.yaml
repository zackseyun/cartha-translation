revisions:
- from: Parce que ton cœur s’est attendri[a] et que tu t’es humilié devant Dieu lorsque tu as entendu ses paroles contre ce lieu et contre ses habitants, parce que tu t’es humilié devant moi, que tu as déchiré tes vêtements et pleuré devant moi, moi aussi, je t’ai entendu — déclaration de Yahweh.
  to: Puisque ton cœur était sensible[a] et que tu t’es humilié devant Dieu lorsque tu as entendu ses paroles contre ce lieu et contre ses habitants, que tu t’es humilié devant moi, que tu as déchiré tes vêtements et pleuré devant moi, moi aussi, je t’ai entendu — déclaration de Yahweh.
  rationale: La révision remplace une formulation qui présentait la tendresse du cœur comme un changement d’état par un état conforme à l’adjectif hébreu. Elle rétablit également une seule structure causale, tout en conservant les répétitions significatives de l’humiliation et de la présence divine.
