source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: fr
  text: Puisque ton cœur était sensible[a] et que tu t’es humilié devant Dieu lorsque tu as entendu ses paroles contre ce lieu et contre ses habitants, que tu t’es humilié devant moi, que tu as déchiré tes vêtements et pleuré devant moi, moi aussi, je t’ai entendu — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton cœur était tendre ». L’expression hébraïque décrit une disposition intérieure réceptive et humble.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit explicitement la cause de la réponse divine et convient naturellement à la longue proposition française.
- source_word: רַךְ לְבָבְךָ
  choice: ton cœur s’est attendri
  rationale: Préserve l’image hébraïque d’un cœur devenu tendre, c’est-à-dire réceptif et humble, sans la réduire à une simple émotion.
- source_word: וַתִּכָּנַע
  choice: tu t’es humilié
  rationale: Rend la valeur réfléchie du niphal de כנע; la même formulation est conservée aux deux occurrences pour respecter la répétition.
- source_word: מִלִּפְנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: Expression française concise qui traduit la disposition humble en présence de Dieu.
- source_word: בְּשָׁמְעֲךָ
  choice: lorsque tu as entendu
  rationale: Rend clairement la valeur temporelle de la préposition ב avec l’infinitif construit.
- source_word: דְּבָרָיו
  choice: ses paroles
  rationale: Conserve le pluriel et le renvoi contextuel à Dieu sans paraphraser par « message ».
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: contre ce lieu et contre ses habitants
  rationale: Dans ce contexte de jugement, עַל a une portée hostile; la répétition de « contre » reproduit l’insistance hébraïque.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: tu as déchiré tes vêtements
  rationale: Formulation actuelle et transparente qui conserve le geste conventionnel de deuil et de repentance.
- source_word: וַתֵּבְךְּ
  choice: pleuré
  rationale: Exprime directement la douleur solennelle indiquée par בכה.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: moi aussi, je t’ai entendu
  rationale: Le pronom tonique rend l’emphase de גַם אֲנִי; le complément « t’ » est implicite dans l’hébreu mais requis pour une expression française naturelle.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Conserve la forme nominale solennelle de la formule prophétique et rend directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre plutôt que de lui substituer un titre.
- issue: Nature de la disposition intérieure exprimée par רַךְ לְבָבְךָ
  choice: ton cœur s’est attendri
  alternative: ton cœur était sensible
  rationale: Le choix maintient la métaphore hébraïque et son mouvement d’humilité réceptive, sans préciser davantage la psychologie de Josias.
- issue: Portée de עַל dans les paroles divines
  choice: contre ce lieu et contre ses habitants
  alternative: au sujet de ce lieu et de ses habitants
  rationale: Le contexte immédiat est celui d’un jugement annoncé, ce qui favorise le sens adversatif, tout en laissant l’autre valeur lexicalement possible en note implicite de traduction.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct adressé à Josias. Les répétitions de « tu t’es humilié » et « devant moi » sont maintenues pour préserver la force rhétorique du texte hébreu.
