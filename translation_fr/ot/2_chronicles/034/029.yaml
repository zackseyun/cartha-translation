  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: fr
  text: Alors le roi envoya chercher tous les anciens de Juda et de Jérusalem, puis les réunit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya convoquer
  rationale: Le verbe signifie littéralement « envoya ». Comme aucun objet exprimé ne suit et que les anciens sont ensuite rassemblés, « envoya convoquer » rend naturellement en français l’envoi implicite de messagers ou d’un ordre, sans préciser le moyen.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini est rendu directement. Le contexte identifie Josias, mais le texte emploie ici son titre.
- source_word: וַיֶּאֱסֹף
  choice: convoquer
  rationale: Le verbe signifie « rassembler, réunir ». Dans cette construction coordonnée après « envoya », le français idiomatique « envoya convoquer » exprime le résultat visé, à savoir la réunion des anciens.
- source_word: אֶת כָּל
  choice: tous
  rationale: La marque de l’objet direct n’est pas traduite; כָּל est rendu par « tous » afin de conserver l’idée d’intégralité.
- source_word: זִקְנֵי
  choice: les anciens
  rationale: Le terme désigne les anciens reconnus comme responsables de la communauté, et non simplement des hommes âgés.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: de Juda et de Jérusalem
  rationale: Cette formulation naturelle conserve la portée géographique et politique des deux groupes d’anciens.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La coordination hébraïque littérale « envoya et rassembla » est rendue par l’expression française naturelle « envoya convoquer », qui évite de faire croire que le roi les rassembla personnellement tout en n’ajoutant aucun moyen précis de convocation.
