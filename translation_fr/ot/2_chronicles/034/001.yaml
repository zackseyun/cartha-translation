  text: Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.
translation:
  language: fr
  text: Josias avait huit ans lorsqu’il devint roi, et il régna trente et un ans à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: avait huit ans
  rationale: L’expression hébraïque, littéralement « fils de huit ans », est une tournure courante indiquant l’âge. « Avait huit ans » en restitue naturellement le sens en français moderne.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: La forme française traditionnelle et courante du nom biblique est retenue.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction indique l’âge de Josias au moment de son accession à la royauté. Cette formulation est claire et naturelle en français.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: trente et un ans
  rationale: La durée du règne est exprimée selon l’ordre normal des nombres en français contemporain.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe hébreu désigne l’exercice de la royauté ; « régna » en est ici l’équivalent direct et idiomatique.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Pour un règne exercé dans une ville siège du pouvoir, le français emploie naturellement la préposition « à ».
