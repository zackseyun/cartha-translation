source:
  edition: WLC
  text: וַ/יָּבֵ֨א שָׁפָ֤ן אֶת הַ/סֵּ֨פֶר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֨שֶׁב ע֧וֹד אֶת הַ/מֶּ֛לֶךְ דָּבָ֖ר לֵ/אמֹ֑ר כֹּ֛ל אֲשֶׁר נִתַּ֥ן בְּ/יַד עֲבָדֶ֖י/ךָ הֵ֥ם עֹשִֽׂים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: fr
  text: 'Shaphân apporta alors le livre au roi et lui rendit également compte en ces termes : « Tes serviteurs exécutent tout ce qui leur a été confié[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui a été mis entre les mains de tes serviteurs, ils le font »; autrement : « ils accomplissent tout ce qui a été remis à la responsabilité de tes serviteurs ».'
    reason: La note préserve l’image concrète de l’idiome hébreu נתן ביד et la construction emphatique הֵם עֹשִׂים, que le corps du texte rend en français naturel.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: apporta
  rationale: Le hifil de בוא indique que Shaphân apporte le livre au roi, et non qu’il vient simplement avec lui.
- source_word: הַסֵּפֶר
  choice: le livre
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un document. « Le livre » est naturel en français et reprend sans surinterprétation l’objet découvert dans le récit.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: lui rendit également compte
  rationale: La tournure avec שוב et דָּבָר exprime l’idée de faire un rapport en retour; עוֹד ajoute « également » ou « encore ». Cette formulation française transmet naturellement l’idiome.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Formule introductive du discours direct, rendue idiomatiquement plutôt que par le participe lourd « disant ».
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: tout ce qui leur a été confié
  rationale: נתן ביד est un idiome signifiant remettre quelque chose à la responsabilité de quelqu’un. La formulation choisie exprime clairement ce sens; la note conserve l’image hébraïque de la main.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans ce contexte royal, עֶבֶד désigne les serviteurs du roi, possiblement ses fonctionnaires. « Serviteurs » préserve le terme relationnel sans imposer « esclaves » ni l’interprétation plus précise « fonctionnaires ».
- source_word: הֵם עֹשִׂים
  choice: exécutent
  rationale: Le pronom explicite et le participe décrivent l’accomplissement en cours de la mission. « Exécutent » fournit en français un complément implicite naturel renvoyant à « tout ce qui leur a été confié ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. « Rendre compte » convient à un rapport présenté au roi; « exécuter » exprime l’accomplissement d’une mission sans coloration confessionnelle. La répétition hébraïque de « au roi » est allégée par le pronom « lui ».
