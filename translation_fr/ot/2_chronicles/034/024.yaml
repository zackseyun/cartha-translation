  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Voici, je vais faire venir le malheur sur ce lieu et sur ses habitants : toutes les malédictions[a] écrites dans le livre[b] qu’ils ont lu devant le roi de Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « malédictions de serment », c’est-à-dire les sanctions invoquées dans le cadre de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel sous une forme largement reconnue en français, conformément à l’orientation du projet.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, concise et digne, qui restitue naturellement la formule de messager hébraïque.
- source_word: הִנְנִי
  choice: Voici, je vais
  rationale: « Voici » maintient la force d’annonce solennelle, tandis que « je vais » exprime naturellement en français l’action imminente portée par la construction hébraïque.
- source_word: מֵבִיא רָעָה
  choice: faire venir le malheur
  rationale: Dans ce contexte, רָעָה désigne un malheur infligé comme jugement, non le mal moral. La tournure causative reflète מֵבִיא.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ce lieu
  rationale: Rendu direct qui préserve l’absence de précision géographique explicite dans le verset.
- source_word: יוֹשְׁבָיו
  choice: ses habitants
  rationale: Expression française courante correspondant au participe substantivé avec suffixe possessif.
- source_word: אֵת כָּל הָאָלוֹת
  choice: toutes les malédictions
  rationale: Rend clairement les sanctions formulées dans le cadre de l’alliance; une note conserve la nuance plus technique de malédictions liées à un serment.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: écrites dans le livre
  rationale: « Dans » est idiomatique en français pour le contenu d’un document; סֵפֶר peut désigner un livre ou un rouleau, nuance signalée en note.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: qu’on a lu devant
  rationale: Le verbe hébreu est actif et pluriel, mais son sujet n’est pas exprimé. Le pronom indéfini français évite d’introduire un référent absent tout en conservant l’actif; « devant » peut signifier en présence de.
- source_word: מֶלֶךְ יְהוּדָה
  choice: le roi de Juda
  rationale: Rendu direct et naturel de la chaîne construite.
theological_decisions:
- issue: Sens de רָעָה lorsque Yahweh annonce son jugement
  choice: le malheur
  alternative: le mal; le désastre; la calamité
  rationale: Le contexte concerne les sanctions de l’alliance. « Malheur » exprime le dommage et le jugement annoncés sans faire de רָעָה une qualification morale de l’action divine.
- issue: Portée de אָלוֹת
  choice: malédictions
  alternative: malédictions de serment
  rationale: Le terme évoque ici les sanctions associées à l’alliance. Le texte principal reste accessible, tandis que la note préserve la dimension de serment sans imposer une formulation technique.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule « Ainsi parle Yahweh » conserve le registre prophétique. « Voici » est légèrement soutenu, mais reste intelligible et rend la force déictique de l’hébreu. Les marqueurs de notes suivent l’expression qu’ils expliquent.
