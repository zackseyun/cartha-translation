  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: fr
  text: Le roi monta alors à la maison de Yahweh, avec tous les hommes de Juda, les habitants de Jérusalem, les prêtres, les Lévites et tout le peuple, du plus grand au plus petit. Il leur lut toutes les paroles du livre de l’alliance qui avait été trouvé dans la maison de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime une montée; « monta » conserve cette nuance directionnelle naturelle pour se rendre au sanctuaire.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction garde l’expression hébraïque « maison de YHWH » plutôt que de l’expliciter par « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: כָל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  rationale: Le singulier distributif אִישׁ avec כָל désigne collectivement les hommes de Juda; cette formulation est idiomatique en français et maintient le marquage masculin du texte.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Le participe désigne ceux qui résident à Jérusalem; « habitants » est naturel et précis.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: du plus grand au plus petit
  rationale: Cette tournure française rend l’expression mérismatique qui englobe tous les rangs de la population.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: Il lut devant eux
  rationale: Avec un livre pour objet, קרא signifie lire à haute voix; « devant eux » communique naturellement la lecture publique exprimée littéralement par « à leurs oreilles ».
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: toutes les paroles du livre de l’alliance
  rationale: « Paroles » conserve l’accent textuel de דִּבְרֵי, tandis que « livre de l’alliance » rend directement le syntagme hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre YHWH; « Yahweh » le représente comme nom personnel plutôt que de le remplacer par un titre traditionnel.
- issue: Portée de כָל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  alternative: tous les Judéens
  rationale: Le nom אִישׁ est explicitement masculin. La traduction le maintient sans pour autant limiter « tout le peuple », mentionné ensuite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’énumération solennelle de l’hébreu, tout en employant une syntaxe française fluide. Aucun appel de note n’est requis.
