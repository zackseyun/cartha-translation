  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: fr
  text: Allez consulter Yahweh pour moi et pour ceux qui restent en Israël et en Juda au sujet des paroles du livre qui a été trouvé[a]. Car grande est la colère de Yahweh qui s’est déversée sur nous, parce que nos pères[b] n’ont pas observé la parole de Yahweh en mettant en pratique tout ce qui est écrit dans ce livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du rouleau qui a été trouvé ». Le mot hébreu peut désigner un livre ou un rouleau.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « nos ancêtres ». Littéralement : « nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: consulter Yahweh
  rationale: Dans ce contexte royal, le verbe désigne une démarche visant à recevoir une réponse ou une directive divine. « Consulter » exprime naturellement cette demande précise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui conserve le nom divin présent dans le texte hébreu.
- source_word: וּבְעַד הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: et pour ceux qui restent en Israël et en Juda
  rationale: Cette formulation rend concrètement le participe substantivé sans imposer au texte français le terme théologique plus spécialisé « reste ».
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: au sujet des paroles du livre
  rationale: Rend le sujet de la consultation tout en conservant la référence aux paroles du document.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: du livre qui a été trouvé
  rationale: « Livre » est naturel en français moderne; le mot hébreu peut aussi désigner un rouleau, signalé en note.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: grande est la colère de Yahweh
  rationale: La construction antéposée conserve l’accent emphatique de l’hébreu, tandis que « colère » rend dignement חֵמָה.
- source_word: נִתְּכָה בָנוּ
  choice: s’est déversée sur nous
  rationale: L’image de l’effusion est conservée et convient idiomatiquement à la colère.
- source_word: אֲבוֹתֵינוּ
  choice: nos pères
  rationale: Rend directement le masculin pluriel hébreu; « nos ancêtres » reste une possibilité contextuelle signalée en note.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: n’ont pas observé la parole de Yahweh
  rationale: « Observer » exprime à la fois la garde attentive et l’obéissance pratique impliquées par שׁמר.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: en mettant en pratique tout ce qui est écrit
  rationale: Formulation française naturelle qui explicite la mise en œuvre demandée sans réduire la portée de « tout ».
- source_word: עַל־הַסֵּפֶר הַזֶּה
  choice: dans ce livre
  rationale: Le français emploie naturellement « dans » pour désigner le contenu écrit d’un ouvrage.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de הַנִּשְׁאָר
  choice: ceux qui restent
  alternative: le reste
  rationale: Le choix principal conserve le sens collectif concret et évite de déterminer davantage la portée théologique du terme.
- issue: Rendu de אֲבוֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le choix conserve la forme masculine du texte source, tandis que l’alternative explicite sa portée généalogique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe emphatique « grande est la colère » conserve la mise en relief hébraïque; le reste de la phrase est légèrement restructuré pour une lecture française fluide.
