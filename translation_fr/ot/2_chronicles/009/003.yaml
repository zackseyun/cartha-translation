  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/003.yaml
  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: fr
  text: Quand la reine de Saba vit la sagesse de Salomon et la maison qu’il avait construite,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le palais qu’il avait construit ». L’hébreu dit « la maison »; dans ce contexte royal, il peut s’agir plus précisément de l’ensemble palatial de Salomon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quand … vit
  rationale: Le wayyiqtol fait progresser le récit; dans cette phrase qui se poursuit au verset suivant, « Quand » exprime naturellement la relation temporelle sans perdre la valeur narrative.
- source_word: מַלְכַּת שְׁבָא
  choice: la reine de Saba
  rationale: La chaîne construite désigne la souveraine par le nom de son royaume ou territoire; « reine de Saba » est la formulation française traditionnelle et naturelle.
- source_word: אֵת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: la sagesse de Salomon
  rationale: La chaîne construite est rendue naturellement en français; « sagesse » désigne ici son discernement et son intelligence reconnus.
- source_word: וְהַבַּיִת
  choice: et la maison
  rationale: בַּיִת signifie littéralement « maison ». Dans ce contexte royal, le mot peut désigner le palais ou l’ensemble palatial, mais le texte principal conserve le terme plus large afin de ne pas préciser au-delà de l’hébreu.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il avait construite
  rationale: La proposition relative qualifie « maison »; le plus-que-parfait indique naturellement que la construction était achevée avant la visite de la reine.
