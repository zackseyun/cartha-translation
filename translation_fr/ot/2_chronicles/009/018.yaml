base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: fr
  text: Le trône avait six marches et un marchepied en or ; les unes et l’autre étaient fixés au trône. De chaque côté du siège se trouvait un accoudoir, et deux lions se tenaient à côté des accoudoirs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: marches
  rationale: Dans la description architecturale d’un trône, le terme désigne les degrés permettant d’y monter. « Marches » est précis et naturel en français moderne.
- source_word: כֶּבֶשׁ
  choice: marchepied
  rationale: Dans ce contexte de mobilier royal, « marchepied » désigne naturellement un support placé devant le trône. Le mot hébreu reste toutefois rare et peut aussi évoquer une rampe ou un escalier, possibilité signalée en note.
- source_word: מָאֳחָזִים
  choice: qui lui étaient fixés
  rationale: Le participe passif pluriel indique que les éléments précédemment mentionnés étaient attachés au trône. Le pluriel français respecte la forme hébraïque plutôt que de rattacher l’expression au seul marchepied.
- source_word: יָדוֹת
  choice: accoudoir
  rationale: Littéralement « mains », le mot désigne ici les parties latérales du siège sur lesquelles reposent les bras. « Accoudoir » est le terme courant pour ce meuble.
- source_word: מִזֶּה וּמִזֶּה
  choice: de chaque côté
  rationale: Cette expression indique une disposition symétrique, d’un côté et de l’autre. « De chaque côté » est idiomatique et concis.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: du siège
  rationale: L’expression signifie littéralement « l’endroit où l’on s’assoit ». Dans cette description, « siège » rend clairement et naturellement la partie concernée du trône.
- source_word: אֲרָיוֹת
  choice: lions
  rationale: Le pluriel est direct. Le contexte suggère des figures sculptées, mais le texte hébreu ne le précise pas, de sorte que la traduction conserve simplement « lions ».
- source_word: עֹמְדִים
  choice: se tenaient
  rationale: Le participe décrit la position des lions. « Se tenaient » exprime naturellement leur présence dressée ou placée à cet endroit sans préciser davantage leur fabrication.
- source_word: אֵצֶל
  choice: près de
  rationale: La préposition indique la proximité immédiate. « Près de » convient à la disposition décrite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La première phrase conserve le pluriel du participe hébreu en rattachant la fixation au trône aux six marches et au marchepied. La seconde reformule la disposition bilatérale des accoudoirs de manière naturelle, sans ajouter que les lions étaient sculptés.
