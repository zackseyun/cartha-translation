  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: fr
  text: 'Mais je n’ai pas cru leurs paroles jusqu’à ce que je vienne et que je le voie de mes propres yeux. Or, on ne m’avait pas même raconté la moitié de l’étendue de ta sagesse[a] : tu dépasses ce que j’avais entendu dire[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’abondance de ta sagesse ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tu as dépassé la nouvelle que j’avais entendue ».
    reason: literal_rendering
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: je n’ai pas cru
  rationale: Le hiphil de אמן signifie ici tenir les propos entendus pour vrais ou crédibles. « Croire » convient mieux que « faire confiance », qui suggérerait une relation personnelle.
- source_word: לְדִבְרֵיהֶם
  choice: leurs paroles
  rationale: דברים désigne ici les paroles ou propos rapportés. Cette traduction reste proche de l’hébreu tout en étant naturelle en français.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: que je le voie de mes propres yeux
  rationale: L’hébreu dit littéralement « mes yeux ont vu ». La tournure française souligne naturellement la vérification directe et personnelle.
- source_word: וְהִנֵּה
  choice: Or
  rationale: הנה attire l’attention sur une constatation frappante. Dans ce contexte, « Or » conserve la mise en relief sans recourir à l’archaïsme « voici ».
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: l’étendue de ta sagesse
  rationale: מַרְבִּית exprime l’abondance, l’ampleur ou la grandeur. « L’étendue » rend idiomatiquement l’ampleur de la sagesse, tandis que la note conserve l’alternative plus quantitative.
- source_word: הֻגַּד לִי
  choice: on ne m’avait pas même raconté
  rationale: Le hophal de נגד exprime ce qui a été dit ou rapporté à la reine. Le plus-que-parfait situe ce récit avant sa venue; la construction impersonnelle est naturelle en français.
- source_word: יָסַפְתָּ עַל
  choice: tu dépasses
  rationale: יסף avec על exprime ici le fait d’aller au-delà de la nouvelle reçue. « Dépasser » restitue clairement la comparaison.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: ce que j’avais entendu dire
  rationale: שְׁמוּעָה désigne une nouvelle ou un rapport entendu. Cette formulation française évite la répétition maladroite de « rapport entendu » tout en conservant l’idée de ouï-dire.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé puisqu’il correspond à la deuxième personne masculine singulière de l’hébreu et au discours direct adressé au roi. « Or » rend la surprise signalée par וְהִנֵּה sans coloration archaïque.
