base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: fr
  text: Salomon se coucha avec ses pères[a], et on l’enterra dans la cité de David, son père. Son fils Roboam régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères », expression traditionnelle désignant la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Dans la formule « se coucher avec ses pères », le verbe est un euphémisme traditionnel de la mort. Le conserver préserve l’expression hébraïque et ses échos dans les récits royaux.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formulation rend littéralement la formule dynastique hébraïque. Une note explique qu’elle désigne la mort et le fait de rejoindre ses ancêtres.
- source_word: וַיִּקְבְּרֻהוּ
  choice: on l’enterra
  rationale: Le verbe hébreu est actif au pluriel avec un sujet non précisé. Le pronom indéfini « on » restitue naturellement en français cette agentivité indéterminée.
- source_word: בְּעִיר דָּוִיד
  choice: dans la cité de David
  rationale: « Cité de David » est le nom géographique biblique conventionnel et distingue clairement le lieu nommé.
- source_word: אָבִיו
  choice: son père
  rationale: David est ici présenté dans sa relation généalogique directe avec Salomon; « père » correspond au sens simple du texte.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Ce verbe rend de façon concise la formule royale de succession sans expliciter davantage que l’hébreu le moment de l’accession.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression marque à la fois le remplacement et la succession royale, au plus près de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formule funéraire hébraïque est maintenue dans le texte afin de préserver son caractère conventionnel et ses résonances bibliques, puis expliquée en note. « On l’enterra » évite un passif lourd tout en conservant l’indétermination des personnes qui procédèrent à l’ensevelissement.
