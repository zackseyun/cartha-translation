  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: fr
  text: Les serviteurs de Hiram et ceux de Salomon, qui avaient apporté de l’or d’Ophir, apportèrent aussi du bois d’algoummim[a] et des pierres précieuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’espèce de bois désignée par le terme hébreu « algoummim » n’est pas connue avec certitude.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « pierre précieuse » au singulier, probablement dans un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: L’adverbe « aussi » conserve la valeur additive de גַם; son placement avec le second verbe produit une phrase française naturelle tout en reliant l’apport supplémentaire à celui de l’or.
- source_word: עַבְדֵי חירם וְעַבְדֵי שְׁלֹמֹה
  choice: Les serviteurs de Hiram et ceux de Salomon
  rationale: « Serviteurs » convient au cadre royal et administratif sans préciser indûment leur statut; « ceux de Salomon » évite une répétition lourde tout en maintenant le parallélisme.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: qui avaient apporté de l’or d’Ophir
  rationale: Le plus-que-parfait distingue naturellement en français l’apport antérieur de l’or de l’apport ensuite mentionné, sans modifier le contenu de la proposition relative.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: du bois d’algoummim
  rationale: La translittération prudente garde le terme botanique hébreu dont l’identification exacte demeure incertaine; le singulier massif « bois » rend naturellement עֲצֵי dans ce contexte.
- source_word: וְאֶבֶן יְקָרָה
  choice: et des pierres précieuses
  rationale: Bien que אֶבֶן soit morphologiquement au singulier, il peut avoir ici un sens collectif; le pluriel est idiomatique dans une liste de marchandises.
