translation:
  language: fr
  text: On faisait venir pour Salomon des chevaux d’Égypte et de tous les pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « On faisait sortir des chevaux d’Égypte pour Salomon, et de tous les pays. » Le verbe hébreu signifie « faire sortir », mais il désigne ici l’acheminement de chevaux destinés à Salomon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: On faisait venir
  rationale: Le participe hiphil de יצא signifie littéralement « faire sortir ». Dans ce contexte d’approvisionnement, « faire venir » exprime naturellement en français le transport des chevaux jusqu’à Salomon, tandis que le pronom indéfini « on » rend le sujet pluriel non précisé.
- source_word: סוּסִים
  choice: des chevaux
  rationale: Traduction directe du nom pluriel « chevaux » ; l’article partitif convient après « faire venir ».
- source_word: מִ/מִּצְרַיִם
  choice: d’Égypte
  rationale: La préposition מן indique ici la provenance.
- source_word: לִ/שְׁלֹמֹה
  choice: pour Salomon
  rationale: La préposition ל peut indiquer la destination ou le bénéficiaire ; « pour Salomon » convient au contexte d’approvisionnement sans exclure l’idée de destination.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: et de tous les pays
  rationale: כָּל avec le pluriel de אֶרֶץ désigne l’ensemble des territoires ou pays concernés. « Tous les pays » est naturel en français moderne et conserve la portée générale de l’hébreu.
