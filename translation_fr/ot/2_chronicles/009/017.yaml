  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: fr
  text: Le roi fit un grand trône d’ivoire et le recouvrit d’or pur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « un trône de dent » ; l’expression désigne un trône d’ivoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie ici simplement « faire » ou « fabriquer ». « Fit » convient au récit et n’ajoute aucune précision absente de l’hébreu.
- source_word: הַמֶּלֶךְ
  choice: Le roi
  rationale: Le nom défini est rendu directement. Bien que le contexte désigne Salomon, le texte hébreu emploie le titre et non son nom.
- source_word: כִּסֵּא
  choice: trône
  rationale: Dans ce contexte royal, כִּסֵּא désigne le siège du roi, donc un trône.
- source_word: שֵׁן
  choice: d’ivoire
  rationale: Le mot signifie littéralement « dent », mais il désigne idiomatiquement l’ivoire lorsqu’il est question d’un matériau.
- source_word: גָּדוֹל
  choice: grand
  rationale: « Grand » conserve à la fois l’idée possible de dimensions imposantes et celle de magnificence.
- source_word: וַיְצַפֵּהוּ
  choice: le recouvrit
  rationale: La forme piel de צפה désigne l’action de couvrir ou de plaquer un objet avec un matériau. « Recouvrit » est naturel en français et laisse ouverte la nature exacte du placage.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: Traduction directe et idiomatique de l’expression désignant un or sans mélange ou de haute pureté.
