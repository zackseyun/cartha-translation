  text: וַ/יְהִ֥י מוֹשֵׁ֖ל בְּ/כָל הַ/מְּלָכִ֑ים מִן הַ/נָּהָר֙ וְ/עַד אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֥וּל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: fr
  text: Il régnait sur tous les rois, du Fleuve[a] jusqu’au pays des Philistins et jusqu’à la frontière de l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Fleuve » désigne probablement l’Euphrate, selon un usage géographique courant dans la Bible hébraïque.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: Il dominait
  rationale: La construction avec היה suivi du participe מוֹשֵׁל décrit une situation durable dans le passé. L’imparfait français rend naturellement cet aspect, tandis que « dominer sur » exprime ici l’exercice de l’autorité politique.
- source_word: בְּכָל הַמְּלָכִים
  choice: sur tous les rois
  rationale: Avec משל, la préposition ב introduit les personnes soumises à l’autorité du souverain. « Sur tous les rois » conserve l’idée de suzeraineté.
- source_word: מִן הַנָּהָר
  choice: depuis le Fleuve
  rationale: L’expression hébraïque emploie le nom commun défini comme désignation géographique. La traduction conserve cette forme sans expliciter le référent dans le texte principal.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: jusqu’au pays des Philistins
  rationale: Cette formulation proche de l’hébreu reste claire en français et marque l’étendue géographique sans remplacer le syntagme par le nom plus interprétatif « Philistie ».
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: et jusqu’à la frontière de l’Égypte
  rationale: גְּבוּל désigne une frontière ou une limite territoriale. La répétition de « jusqu’à » reflète les deux occurrences de עַד et clarifie la construction.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait présente la domination de Salomon comme une situation établie. La désignation traditionnelle « le Fleuve » est conservée dans le texte et explicitée avec prudence en note.
