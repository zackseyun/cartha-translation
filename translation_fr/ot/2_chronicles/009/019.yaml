source:
  edition: WLC
  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָי֗וֹת עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: fr
  text: Douze lions se tenaient là, sur les six marches[a], de part et d’autre. Rien de pareil n’avait été fait pour aucun royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Douze lions se tenaient là sur les six marches, un de chaque côté de chacune d’elles. »'
    reason: La construction hébraïque décrit les lions en relation avec les six marches et « de ce côté-ci et de ce côté-là ». Le total de douze permet de comprendre qu’il y avait un lion de chaque côté de chaque marche.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר
  choice: Douze
  rationale: Le nombre cardinal introduit un nouvel élément dans la description du trône. En français, ne pas rendre explicitement la conjonction initiale donne une transition descriptive plus naturelle sans rien retrancher au sens.
- source_word: אֲרָיוֹת
  choice: lions
  rationale: Le nom pluriel désigne sans ambiguïté les figures de lions disposées près du trône.
- source_word: עֹמְדִים שָׁם
  choice: se tenaient là
  rationale: Le participe décrit la position stable des lions dans la scène; « se tenaient là » est naturel et conserve cette valeur descriptive.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: sur les six marches
  rationale: Dans ce contexte, מַעֲלוֹת désigne les marches qui conduisent au trône, et עַל indique leur emplacement par rapport à celles-ci.
- source_word: מִזֶּה וּמִזֶּה
  choice: d’un côté et de l’autre
  rationale: Cette expression spatiale distributive indique une disposition symétrique des lions des deux côtés des marches.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Rien de pareil n’avait été fait
  rationale: La tournure passive exprime le caractère sans équivalent de cet ouvrage; cette formulation française en conserve naturellement la force comparative.
- source_word: לְכָל מַמְלָכָה
  choice: pour aucun royaume
  rationale: 'Avec la négation précédente, לְכָל prend ici une valeur indéfinie: aucun royaume ne s’était vu réaliser un ouvrage comparable.'
