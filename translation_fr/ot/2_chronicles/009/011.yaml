  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: fr
  text: Le roi fit avec le bois d’algoum[b] des voies d’accès pour la maison de Yahweh et pour la maison du roi[a], ainsi que des lyres et des harpes pour les chanteurs. On n’avait jamais rien vu de pareil auparavant dans le pays de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des escaliers pour la maison de Yahweh et pour la maison du roi »; le terme hébreu peut désigner des voies d’accès aménagées ou des escaliers.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « algoum ». Dans le passage parallèle (1 Rois 10.12), ce bois est appelé « almoug ». L’espèce exacte est inconnue.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: le bois d’algoum
  rationale: Ce terme rare désigne un bois précieux importé dont l’espèce exacte est inconnue. La translittération conserve la forme propre aux Chroniques sans proposer une identification botanique incertaine.
- source_word: מְסִלּוֹת
  choice: des voies d’accès
  rationale: Le nom désigne habituellement des voies aménagées ou surélevées. Dans ce contexte architectural, « voies d’accès » reste naturel tout en évitant de trancher indûment en faveur d’escaliers.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: pour la maison de Yahweh et pour la maison du roi
  rationale: « Maison » rend directement בַּיִת et préserve le parallélisme hébreu; « temple » et « palais » seraient plus interprétatifs.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre, conformément au texte hébreu.
- source_word: כִנֹּרוֹת
  choice: lyres
  rationale: La lyre constitue l’équivalent moderne le plus proche de cet instrument à cordes, distinct du נֵבֶל.
- source_word: נְבָלִים
  choice: harpes
  rationale: « Harpes » rend clairement ce second type d’instrument à cordes, même si sa forme exacte demeure incertaine.
- source_word: לַשָּׁרִים
  choice: pour les chanteurs
  rationale: La forme issue de la racine שׁיר désigne directement ceux qui chantent.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: On n’avait jamais rien vu de pareil auparavant
  rationale: Cette formulation française naturelle conserve l’idée que de tels ouvrages et instruments étaient sans précédent.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: « Pays » rend explicitement אֶרֶץ et convient au registre géographique du passage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme comme nom divin; « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu sans être lourde; « voies d’accès » préserve l’incertitude architecturale, explicitée en note.
