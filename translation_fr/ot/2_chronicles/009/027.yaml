source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: fr
  text: Le roi rendit l’argent aussi commun que les pierres à Jérusalem, et les cèdres aussi abondants que les sycomores des basses terres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la Shéphéla », région des basses terres de Juda, à l’ouest des hautes terres centrales.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: rendit
  rationale: 'Le verbe signifie littéralement « donna, plaça », mais les comparaisons expriment ici le résultat produit par le roi : l’argent et les cèdres devinrent extrêmement abondants. « Rendit » restitue naturellement cette valeur causative.'
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: Le nom désigne ici l’argent en tant que métal précieux, non spécifiquement de la monnaie. En français, « l’argent » convient au contexte tout en conservant la formulation concise de l’hébreu.
- source_word: כָּאֲבָנִים
  choice: aussi commun que les pierres
  rationale: La comparaison porte sur l’abondance et le caractère ordinaire de l’argent, plutôt que sur une simple ressemblance visuelle. Cette formulation explicite naturellement l’implication de l’image.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Traduction locative directe et idiomatique en français.
- source_word: הָאֲרָזִים
  choice: les cèdres
  rationale: Le pluriel peut évoquer les arbres ou le bois de cèdre considéré comme ressource. « Les cèdres » préserve l’image et l’ambiguïté concrète du texte.
- source_word: כַּשִּׁקְמִים
  choice: aussi abondants que les sycomores
  rationale: La comparaison concerne la quantité. « Sycomores » désigne ici les figuiers-sycomores du Proche-Orient et correspond au terme biblique français traditionnel sans le confondre avec le sycamore nord-américain.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: dans le bas pays
  rationale: שְׁפֵלָה peut être compris comme un nom régional, la Shéphéla, ou comme une désignation géographique descriptive. « Le bas pays » reste intelligible dans le texte, tandis que le nom précis de la région est donné en note.
- source_word: לָרֹב
  choice: abondants
  rationale: L’expression souligne la grande quantité des cèdres. Son sens est intégré à la comparaison par l’adjectif « abondants ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Les comparaisons sont formulées explicitement pour communiquer l’abondance impliquée par l’idiome hébreu, sans alourdir la phrase. Le marqueur de note est placé après « bas pays », expression directement expliquée par la note.
