id: 2CH.9.25
reference: 2 Chronicles 9:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֨י לִ/שְׁלֹמֹ֜ה אַרְבַּעַת֩ אֲלָפִ֨ים אֻֽרְי֤וֹת סוּסִים֙ וּ/מַרְכָּב֔וֹת וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: fr
  text: Salomon avait quatre mille stalles pour les chevaux et les chars[a][b], ainsi que douze mille cavaliers. Il les plaça dans les villes de chars et auprès du roi, à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « écuries ». Le terme hébreu désigne des emplacements où l’on loge les chevaux.
    reason: lexical_alternative
  - marker: b
    text: Le passage parallèle de 1 Rois 4.26 porte « quarante mille stalles », tandis que le texte des Chroniques donne ici « quatre mille ».
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomon avait
  rationale: La construction היה + ל exprime ici la possession ; « Salomon avait » est son équivalent français naturel.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: quatre mille
  rationale: Traduction directe du nombre transmis par le texte massorétique des Chroniques.
- source_word: אֻרְיוֹת
  choice: stalles
  rationale: Le nom désigne des emplacements servant à loger les chevaux ; « stalles » préserve cette précision sans élargir nécessairement le sens à des bâtiments entiers.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: pour les chevaux et les chars
  rationale: La préposition « pour » explicite naturellement en français la destination des stalles tout en conservant les deux noms du texte hébreu.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: ainsi que douze mille cavaliers
  rationale: « Cavaliers » rend directement les hommes montés, dans un registre naturel et historique, sans imposer une organisation militaire plus tardive.
- source_word: וַיַּנִּיחֵם
  choice: Il les plaça
  rationale: Le verbe signifie mettre ou établir à un endroit. « Plaça » conserve sa portée assez large sans préciser davantage le mode de déploiement.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: dans les villes de chars
  rationale: Cette formulation concise conserve le rapport de construction hébreu et désigne des villes associées aux unités de chars.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלִָם
  choice: et auprès du roi, à Jérusalem
  rationale: « Auprès du roi » exprime naturellement la proximité ou l'affectation au roi ; la virgule rattache clairement Jérusalem à cette seconde localisation.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Stalles » garde la précision concrète du terme hébreu ; « villes de chars » conserve l’expression institutionnelle ancienne sans la moderniser abusivement.
