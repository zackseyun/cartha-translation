  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: fr
  text: Tous les récipients destinés aux boissons du roi Salomon étaient en or, et tous les récipients de la Maison de la Forêt du Liban[a] étaient en or pur[b]. À l’époque de Salomon, l’argent ne comptait pour rien[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du palais de la Forêt du Liban » ; il s’agit du nom d’un bâtiment royal.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « or fermé », expression hébraïque généralement comprise comme désignant de l’or pur ou raffiné.
    reason: lexical_alternative
  - marker: c
    text: Ou « l’argent n’était considéré comme n’ayant aucune valeur à l’époque de Salomon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: récipients destinés aux boissons
  rationale: כְּלֵי désigne largement des objets ou récipients, tandis que מַשְׁקֵה précise leur usage lié aux boissons. Cette formulation naturelle évite de réduire le sens aux seules coupes.
- source_word: זָהָב
  choice: or
  rationale: Terme direct désignant le matériau; sa répétition dans le verset est conservée.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: la Maison de la Forêt du Liban
  rationale: Il s’agit du nom d’un bâtiment royal précis. « Maison » rend directement בֵּית et conserve la forme du nom propre, sans imposer l’interprétation « palais ».
- source_word: זָהָב סָגוּר
  choice: or pur
  rationale: L’expression hébraïque, littéralement « or fermé », est un idiome désignant un or de grande qualité, généralement compris comme pur ou raffiné. « Or pur » est clair et idiomatique en français.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: l’argent n’était considéré comme rien
  rationale: La formulation reste proche de l’hébreu et exprime l’insignifiance attribuée à l’argent, sans expliciter davantage qu’il était dépourvu de valeur.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: à l’époque de Salomon
  rationale: Cette tournure rend naturellement l’idiome hébreu « aux jours de Salomon » sans préciser au-delà du texte qu’il s’agit formellement de son règne.
