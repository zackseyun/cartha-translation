base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: fr
  text: Elle donna au roi cent vingt talents d’or, des aromates en très grande quantité et des pierres précieuses. Il n’y avait jamais eu d’aromates comparables à ceux que la reine de Saba donna au roi Salomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y eut jamais d’aromates comparables à ceux que la reine de Saba donna au roi Salomon. » L’hébreu peut exprimer soit une qualité sans égale jusqu’à ce moment-là, soit, plus largement, le caractère sans pareil de ce présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Elle donna
  rationale: Le wayyiqtol de נתן fait progresser le récit. Le passé simple convient au registre narratif français.
- source_word: לַמֶּלֶךְ
  choice: au roi
  rationale: Le complément indirect est exprimé naturellement après « donna ».
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: cent vingt talents d’or
  rationale: כִּכָּר désigne ici une unité de poids traditionnellement rendue par « talent ».
- source_word: וּבְשָׂמִים
  choice: des aromates
  rationale: בְּשָׂמִים désigne des substances parfumées ou épices aromatiques ; « aromates » conserve cette portée sans évoquer seulement un usage culinaire.
- source_word: לָרֹב מְאֹד
  choice: en très grande quantité
  rationale: La formulation rend explicitement l’intensification quantitative de l’hébreu.
- source_word: וְאֶבֶן יְקָרָה
  choice: et des pierres précieuses
  rationale: Le singulier hébreu a une valeur collective ; le pluriel est idiomatique en français dans cette liste de présents.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: On n’avait jamais vu d’aromates comparables
  rationale: Cette tournure française naturelle exprime l’absence, jusqu’à ce moment du récit, d’aromates semblables, tout en conservant la force comparative de כְּ.
- source_word: אֲשֶׁר נָתְנָה מַלְכַּת שְׁבָא
  choice: à ceux que la reine de Saba donna
  rationale: La proposition relative identifie les aromates servant de terme de comparaison.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: au roi Salomon
  rationale: Cette construction du titre suivi du nom est naturelle en français.
