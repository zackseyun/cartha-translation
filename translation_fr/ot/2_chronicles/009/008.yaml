revisions:
- from: Béni soit Yahvé, ton Dieu[a], qui a pris plaisir en toi et t’a placé sur son trône comme roi pour Yahvé, ton Dieu. Parce que ton Dieu aime Israël et veut l’établir pour toujours[b], il t’a établi roi sur lui afin que tu exerces le droit et la justice.
  to: Béni soit Yahvé, ton Dieu[a], qui s’est plu en toi et t’a placé sur son trône comme roi pour Yahvé, ton Dieu. Parce que ton Dieu aime Israël et veut l’établir pour toujours[b], il t’a établi roi sur eux afin que tu exerces le droit et la justice.
  rationale: La révision corrige le pluriel explicite de עֲלֵיהֶם par « sur eux » et améliore légèrement l’idiome français avec « s’est plu en toi ». Le reste est conservé, notamment la solution lisible qui rattache l’établissement durable d’Israël à l’amour de Dieu, tandis que la note préserve la formulation infinitive plus proche de la syntaxe hébraïque.
