  variant: modern international French
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: fr
  text: Béni soit Yahvé, ton Dieu[a], qui s’est plu en toi et t’a placé sur son trône comme roi pour Yahvé, ton Dieu. Parce que ton Dieu aime Israël et veut l’établir pour toujours[b], il t’a établi roi sur eux afin que tu exerces le droit et la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que Yahvé, ton Dieu, soit béni. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se rendre plus littéralement : « Parce que ton Dieu aime Israël, pour l’établir pour toujours, il t’a établi roi sur eux. »'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Béni soit
  rationale: La tournure française conserve la formule hébraïque de bénédiction et la valeur jussive, tout en restant naturelle et solennelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve son caractère de nom propre.
- source_word: חָפֵץ בְּךָ
  choice: a pris plaisir en toi
  rationale: Rend le sens de plaisir et de faveur du verbe sans l’aplatir en simple approbation.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: t’a placé sur son trône
  rationale: Exprime naturellement l’installation royale tout en conservant le possessif théologiquement significatif « son trône ».
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: comme roi pour Yahvé, ton Dieu
  rationale: Préserve la relation de service et de représentation marquée par la préposition ל sans la préciser excessivement.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Parce que ton Dieu aime Israël
  rationale: Le syntagme nominal avec בְּ peut ici être rendu causalement; le présent français convient à l’amour durable de Dieu dans ce propos.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: et veut l’établir pour toujours
  rationale: En français, cette coordination rend clairement le but lié à l’amour de Dieu. Le pronom singulier « l’ » respecte le suffixe hébreu et traite Israël comme un peuple collectif.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: il t’a établi roi sur lui
  rationale: Dans ce contexte d’intronisation, נתן signifie confier ou établir comme roi. Le singulier collectif renvoie naturellement au peuple d’Israël en français.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: afin que tu exerces le droit et la justice
  rationale: La formule royale désigne l’exercice d’un gouvernement conforme au droit et à la justice; la formulation française distingue les deux noms sans lourdeur.
theological_decisions:
- issue: Le référent de כִּסְאוֹ (« son trône »)
  choice: Conserver « son trône », avec Dieu comme référent naturel.
  alternative: « le trône royal » ou « ton trône »
  rationale: Le Chroniste présente la royauté de Salomon comme exercée sur le trône de Dieu et sous son autorité; le possessif doit donc être maintenu.
- issue: Le rapport syntaxique de לְהַעֲמִידוֹ לְעוֹלָם à l’amour de Dieu et à l’établissement du roi
  choice: 'Le rattacher à l’amour de Dieu : « aime Israël et veut l’établir pour toujours ».'
  alternative: « Parce que ton Dieu aime Israël, pour l’établir pour toujours, il t’a établi roi… »
  rationale: L’hébreu permet une formulation compacte dont le rattachement exact demeure légèrement ouvert. La version retenue donne un français intelligible et suit le lien étroit entre l’amour de Dieu et la pérennité d’Israël, sans ajouter une motivation doctrinale étrangère.
- issue: La paire מִשְׁפָּט וּצְדָקָה
  choice: « le droit et la justice »
  alternative: « la justice et la droiture »
  rationale: Il s’agit d’une formule royale exprimant à la fois le jugement conforme au droit et la conduite juste. Les deux termes français maintiennent la paire conceptuelle sans les fusionner.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé puisque la reine de Saba s’adresse directement à Salomon. « Yahvé » rend le nom divin; la répétition de « ton Dieu » et l’expression frappante « son trône » sont maintenues.
