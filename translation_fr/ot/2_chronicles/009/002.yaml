base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: fr
  text: Salomon répondit à toutes ses questions[a] ; il n’y eut rien qui fût caché à Salomon et qu’il ne lui expliqua pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui exposa tout ce qu’elle avait à dire » ; littéralement : « lui dit toutes ses paroles » ou « toutes ses affaires ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « Il n’y eut rien de caché à Salomon qu’il ne lui dit. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: répondit
  rationale: Le verbe signifie littéralement « dire, faire connaître », mais, dans le contexte où la reine éprouve Salomon par des questions difficiles, « répondit » exprime naturellement la fonction de son discours.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: à toutes ses questions
  rationale: דָּבָר peut désigner une parole, une affaire ou une chose. Ici, le contexte immédiat indique les questions ou sujets soumis par la reine.
- source_word: נֶעְלַם
  choice: resta caché
  rationale: Cette formulation conserve l’image du texte hébreu selon laquelle aucune affaire n’était cachée à Salomon.
- source_word: דָּבָר
  choice: rien
  rationale: Avec la négation, le singulier דָּבָר a naturellement le sens idiomatique de « rien ».
- source_word: מִשְּׁלֹמֹה
  choice: à Salomon
  rationale: Avec le passif de « cacher », le français emploie naturellement « caché à quelqu’un », là où l’hébreu dit littéralement « caché de Salomon ».
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: rien qu’il ne lui expliquât
  rationale: La proposition indique que Salomon fit connaître à la reine tout ce qui lui était soumis. « Expliquer » convient au contexte des questions difficiles, tandis que la note conserve le sens plus formel de « dire ».
