base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: fr
  text: Tous les rois de la terre cherchaient à obtenir une audience auprès de Salomon[a], afin d’entendre sa sagesse que Dieu avait mise dans son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cherchaient la face de Salomon », expression qui signifie qu’ils cherchaient à être admis en sa présence ou à obtenir une audience auprès de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: Tous les rois de la terre
  rationale: Le français peut omettre la conjonction initiale dans la continuité narrative. « Terre » convient à ce contexte international et conserve la portée de l’expression hébraïque, sans prétendre préciser l’étendue géographique.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: cherchaient à rencontrer Salomon[a]
  rationale: Le participe exprime une démarche répétée ou continue. L’expression idiomatique « chercher la face de » désigne ici le fait de chercher à accéder à quelqu’un ou à obtenir une audience; « rencontrer » est naturel en français moderne, tandis que la note conserve l’image hébraïque.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: afin d’entendre la sagesse
  rationale: L’infinitif indique le but. « Entendre » reste proche du verbe hébreu et « la sagesse » conserve l’objet abstrait du texte, dont le possesseur est déjà clairement Salomon.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: que Dieu avait mise dans son cœur
  rationale: Bien que נָתַן signifie d’abord « donner », « mettre dans le cœur » rend naturellement la construction hébraïque en français. Le plus-que-parfait présente ce don comme antérieur à la venue des rois, et « cœur » préserve l’anthropologie biblique.
theological_decisions:
- issue: Origine divine de la sagesse de Salomon
  choice: que Dieu avait mise dans son cœur
  alternative: que Dieu lui avait donnée
  rationale: Le texte attribue explicitement cette sagesse à l’action de Dieu et précise qu’elle se trouve dans le cœur de Salomon. La formulation retenue maintient à la fois l’origine divine et la localisation dans la personne intérieure.
translation_notes:
  register: Français international actuel, digne et accessible. « Rencontrer Salomon » évite le calque peu naturel « chercher la face de Salomon », tandis que la note permet au lecteur d’accéder à l’image originale.
