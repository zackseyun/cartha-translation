lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe מלך, dans cette forme narrative, décrit le règne passé de Salomon. « Régna » est précis, naturel et propre au contexte royal.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: בִירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition ב indique ici le lieu. En français moderne, on dit naturellement « à Jérusalem ».
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: Avec le verbe מלך, עַל exprime l’étendue de l’autorité royale. « Tout Israël » conserve le sens collectif et national de l’hébreu.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarante ans
  rationale: Traduction idiomatique directe de la durée exprimée par le nombre cardinal et le nom hébreu au singulier.
