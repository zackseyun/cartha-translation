  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: fr
  text: Sans compter ce qu’apportaient les commerçants itinérants et les marchands, tous les rois d’Arabie et les gouverneurs du pays apportaient de l’or et de l’argent à Salomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: les commerçants itinérants
  rationale: L’expression désigne littéralement les hommes qui vont de lieu en lieu; dans ce contexte économique, elle renvoie à des commerçants itinérants et permet de les distinguer des marchands mentionnés ensuite.
- source_word: הַסֹּחֲרִים
  choice: les marchands
  rationale: Rendu courant et précis du participe substantivé issu de la racine סחר, «faire du commerce».
- source_word: מַלְכֵי עֲרַב
  choice: les rois d’Arabie
  rationale: עֲרַב est compris ici comme un nom géographique, conformément au contexte et au passage parallèle de 1 Rois 10.15.
- source_word: פַחוֹת הָאָרֶץ
  choice: les gouverneurs du pays
  rationale: פחות désigne des gouverneurs ou hauts responsables provinciaux; «du pays» conserve la formulation générale de הָאָרֶץ sans préciser artificiellement le territoire.
- source_word: מְבִיאִים
  choice: apportaient
  rationale: Le participe hébreu exprime ici une activité habituelle ou répétée; l’imparfait français restitue naturellement cet aspect.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La première proposition, elliptique en hébreu, est rattachée au total des revenus indiqué au verset précédent. «Aussi» explicite sobrement l’addition entre les deux groupes sans modifier le sens.
