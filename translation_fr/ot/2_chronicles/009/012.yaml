revisions:
- from: Le roi Salomon donna à la reine de Saba tout ce qu’elle désirait, tout ce qu’elle demanda, en plus de ce qu’elle avait apporté au roi. Puis elle repartit pour son pays, elle et ses serviteurs.
  to: Le roi Salomon donna à la reine de Saba tout ce qu’elle désirait et qu’elle avait demandé[a], en plus de ce qu’elle avait apporté au roi. Puis elle s’en retourna dans son pays, elle et ses serviteurs.
  rationale: La relative est intégrée à son antécédent afin de rendre la syntaxe hébraïque avec naturel. La note signale l’ambiguïté de מִלְּבַד, tandis que « en plus de » demeure une traduction contextuellement plausible. La conclusion conserve la reine et ses serviteurs comme sujets du retour.
