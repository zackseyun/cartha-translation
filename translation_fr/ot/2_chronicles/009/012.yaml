base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: fr
  text: Le roi Salomon donna à la reine de Saba tout ce qu’elle désirait et qu’elle avait demandé[a], en plus de ce qu’elle avait apporté au roi. Puis elle s’en retourna dans son pays, elle et ses serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à part de ce qu’elle avait apporté au roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: donna
  rationale: Le verbe courant « donner » convient à ce transfert de présents et garde la sobriété de l’hébreu.
- source_word: מַלְכַּת שְׁבָא
  choice: la reine de Saba
  rationale: Forme traditionnelle et largement reconnue en français moderne pour le titre et le nom géographique.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: tout ce qu’elle désirait, tout ce qu’elle demanda
  rationale: Cette formulation rend à la fois le désir exprimé par חפץ et la demande indiquée par שאל, sans les réduire à une seule idée.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: en plus de ce qu’elle avait apporté au roi
  rationale: מִלְּבַד peut marquer l’addition ou l’exclusion; dans ce contexte d’échange de présents, « en plus de » exprime naturellement le sens probable.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: Puis elle repartit pour son pays
  rationale: « Repartit » rend idiomatiquement le mouvement de retour exprimé par « elle se tourna et alla vers son pays », sans lourdeur en français.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: elle et ses serviteurs
  rationale: « Serviteurs » reste assez large pour désigner les membres de sa suite, sans préciser un statut que le contexte ne permet pas d’établir.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « tout ce qu’elle désirait, tout ce qu’elle demanda » conserve le parallélisme explicatif de l’hébreu. Aucune note n’est nécessaire, car les choix retenus communiquent clairement le sens dans le corps du texte.
