base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: fr
  text: 'Elle dit alors au roi : « La nouvelle que j’avais entendue dans mon pays au sujet de tes paroles[a] et de ta sagesse était vraie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de tes affaires » : le terme hébreu peut désigner les paroles, les affaires ou les actes du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit alors
  rationale: Le wayyiqtol fait progresser le récit. « Alors » rend naturellement cette succession en français moderne.
- source_word: אֶל־הַמֶּלֶךְ
  choice: au roi
  rationale: Le groupe prépositionnel désigne directement le destinataire de ses paroles.
- source_word: אֱמֶת הַדָּבָר
  choice: La nouvelle … était vraie
  rationale: L’expression hébraïque affirme la véracité de ce qui avait été entendu. « La nouvelle » convient ici à une information rapportée et permet une formulation française naturelle.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: que j’avais entendue
  rationale: Le plus-que-parfait situe naturellement l’information reçue avant la présente déclaration de la reine.
- source_word: בְּאַרְצִי
  choice: dans mon pays
  rationale: Cette formulation conserve le suffixe de première personne et rend אֶרֶץ de manière idiomatique dans ce contexte.
- source_word: עַל־דְּבָרֶיךָ
  choice: au sujet de tes paroles
  rationale: דְּבָרֶיךָ peut désigner les paroles, les affaires ou les actes du roi. « Tes paroles » est la traduction la plus directe, tandis qu’une note préserve l’autre sens contextuellement possible.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: et de ta sagesse
  rationale: Traduction directe du nom avec suffixe de deuxième personne ; la sagesse est un thème central du passage.
