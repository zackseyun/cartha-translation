source:
  edition: WLC
  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ וְ/אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד וְ/שֹׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: fr
  text: Heureux[a] tes hommes, et heureux tes serviteurs que voici, eux qui se tiennent constamment devant toi[b] et entendent ta sagesse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’ils sont favorisés, tes hommes ! » Le terme hébreu peut désigner une condition heureuse, enviable ou favorisée.'
    reason: lexical_alternative
  - marker: b
    text: « Se tenir devant » un roi est une expression de cour qui signifie être présent auprès de lui pour le servir.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule proclame la condition enviable, favorisée ou heureuse de quelqu’un. « Heureux » est naturel en français biblique moderne et conserve la solennité de l’éloge.
- source_word: אֲנָשֶׁיךָ
  choice: tes hommes
  rationale: Le nom désigne littéralement les hommes de Salomon, vraisemblablement les hommes de sa cour. Cette formulation préserve le sens masculin du terme sans préciser indûment leur fonction.
- source_word: עֲבָדֶיךָ אֵלֶּה
  choice: tes serviteurs que voici
  rationale: Dans le cadre de la cour royale, עֲבָדִים désigne adéquatement des serviteurs plutôt que de souligner un statut d’esclaves. « Que voici » restitue la valeur déictique de אֵלֶּה.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: qui se tiennent constamment devant toi
  rationale: La traduction conserve l’image littérale d’hommes se tenant devant le roi, tout en signalant par une note qu’il s’agit d’une expression de cour indiquant le service dans sa présence.
- source_word: תָּמִיד
  choice: constamment
  rationale: Le mot exprime ici une présence régulière et continue. « Constamment » convient au registre soutenu sans imposer l’idée d’une présence absolument ininterrompue.
- source_word: וְשֹׁמְעִים
  choice: et entendent
  rationale: Le participe de שׁמע signifie entendre ou écouter. « Entendent ta sagesse » reste proche de l’hébreu et exprime l’accès privilégié des serviteurs aux paroles sages du roi.
- source_word: חָכְמָתֶךָ
  choice: ta sagesse
  rationale: Le nom désigne directement la sagesse possédée et exprimée par Salomon; la formulation française est claire et fidèle.
theological_decisions: []
