revisions:
- from: 'la nourriture de sa table, la disposition des sièges de ses serviteurs, la manière dont ses ministres se tenaient à son service et leurs vêtements, ses échansons et leurs vêtements, ainsi que l’escalier par lequel il montait à la maison de Yahweh[a] : il ne resta plus de souffle en elle[b].'
  to: 'la nourriture de sa table, la place de ses serviteurs, la façon dont ses serviteurs chargés du service se tenaient et leurs vêtements, ses échansons et leurs vêtements, ainsi que l’escalier[a] par lequel il montait à la maison de Yahweh : elle n’avait plus de souffle[b].'
  rationale: La révision conserve la lecture du texte hébreu et sa structure cumulative, tout en corrigeant une tournure française peu naturelle à la fin du verset. Elle rattache également chaque note au segment concerné et remplace « ministres » par une désignation de service royal moins susceptible d’être comprise dans un sens institutionnel moderne.
