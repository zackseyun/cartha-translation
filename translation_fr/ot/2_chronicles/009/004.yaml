review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement l’énumération du texte massorétique : nourriture, disposition des serviteurs, service des ministres, vêtements, échansons, montée vers la maison de Yahweh, puis la réaction de la reine. « Escalier » est une interprétation recevable de עֲלִיָּתוֹ, tout en préservant l’alternative textuelle en note. La formulation finale actuelle, « il ne resta plus de souffle en elle », est toutefois peu idiomatique en français et son pronom impersonnel est mal rattaché.'
  naturalness: Le registre est globalement clair et digne. « Échansons » convient au contexte de cour. « La disposition des sièges de ses serviteurs » est compréhensible, mais « la place de ses serviteurs » est plus naturel et plus direct. La correction de la dernière proposition améliore nettement la fluidité sans abandonner l’image du souffle.
  terminology: « Yahweh » reproduit de façon cohérente le tétragramme. « Maison de Yahweh » conserve l’expression hébraïque. Pour éviter la connotation moderne, gouvernementale ou ecclésiastique de « ministres », « serviteurs chargés du service » rend mieux מְשָׁרְתָיו dans ce contexte royal, tout en maintenant une distinction fonctionnelle avec עֲבָדָיו.
  issues:
  - severity: medium
    issue: La phrase finale « il ne resta plus de souffle en elle » est grammaticalement et idiomatiquement maladroite.
    rationale: Le sujet impersonnel « il » ne correspond pas naturellement à la construction hébraïque. « Elle n’avait plus de souffle » conserve l’image de וְלֹא־הָיָה עוֹד בָּהּ רוּחַ et se lit naturellement en français.
  - severity: low
    issue: L’ancre de la note sur la lecture alternative est placée après « Yahweh » plutôt qu’après le mot ou groupe de mots concerné.
    rationale: La note porte sur « l’escalier / la montée », non sur le nom divin. La déplacer après « escalier » rend son rattachement précis.
  - severity: low
    issue: « Ministres » peut évoquer des fonctions gouvernementales ou religieuses modernes.
    rationale: Le terme hébreu vise ici les personnes qui assurent le service à la cour. Une expression fonctionnelle plus explicite évite cette ambiguïté.
  revised_text: 'la nourriture de sa table, la place de ses serviteurs, la façon dont ses serviteurs chargés du service se tenaient et leurs vêtements, ses échansons et leurs vêtements, ainsi que l’escalier[a] par lequel il montait à la maison de Yahweh : elle n’avait plus de souffle[b].'
