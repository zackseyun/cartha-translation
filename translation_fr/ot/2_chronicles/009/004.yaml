  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: fr
  text: 'la nourriture de sa table, la place de ses serviteurs, la façon dont ses serviteurs chargés du service se tenaient et leurs vêtements, ses échansons et leurs vêtements, ainsi que l’escalier[a] par lequel il montait à la maison de Yahweh : elle n’avait plus de souffle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, d’après le passage parallèle de 1 Rois 10.5 : « l’holocauste qu’il offrait dans la maison de Yahweh ». Ici, le texte hébreu se lit le plus naturellement : « l’escalier — ou la montée — par lequel il montait ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « il n’y avait plus de souffle en elle » ; cette expression traduit son profond étonnement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: la nourriture de sa table
  rationale: מַאֲכַל désigne ce qui se mange, la nourriture ou les provisions. Cette formulation conserve l’image concrète et reste naturelle en français.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: la disposition des sièges de ses serviteurs
  rationale: מוֹשָׁב peut désigner le siège, la place occupée ou l’organisation des places. Dans cette description de la cour, la traduction fait ressortir l’ordonnance visible des serviteurs sans donner à עֲבָדָיו le sens moderne trop étroit d’esclaves.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: la manière dont ses ministres se tenaient à son service
  rationale: מַעֲמַד évoque le fait de se tenir debout, la position ou la station, et מְשָׁרְתָיו ceux qui assurent le service du roi. La formulation conserve ce détail visuel tout en distinguant ces ministres des serviteurs mentionnés auparavant.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: leurs vêtements
  rationale: Le terme désigne concrètement les habits ou vêtements. « Vêtements » est clair, actuel et non archaïque.
- source_word: מַשְׁקָיו
  choice: ses échansons
  rationale: Dans une cour royale, le mot désigne ceux qui servent les boissons. « Échansons » est le terme français précis, encore intelligible dans un registre historique et biblique.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: l’escalier par lequel il montait à la maison de Yahweh
  rationale: Le texte massorétique se lit le plus naturellement comme une montée ou un escalier emprunté pour aller à la maison de Yahweh. Le parallèle de 1 Rois 10.5 soutient une autre lecture, conservée en note.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » traduit directement בֵּית et préserve l’expression hébraïque; le nom divin יהוה est rendu par « Yahweh ».
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: il ne resta plus de souffle en elle
  rationale: רוּחַ peut signifier souffle, esprit ou vent. Ici, la tournure exprime un saisissement extrême; la traduction conserve néanmoins l’image hébraïque et son ambiguïté plutôt que de la réduire à une explication psychologique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme יהוה. « Yahweh » représente le nom divin dans le corps du texte plutôt que de le remplacer par un titre.
- issue: Portée de רוּחַ dans la réaction de la reine
  choice: souffle
  alternative: esprit
  rationale: Le contexte décrit l’effet saisissant de ce qu’elle voit. « Souffle » préserve l’image corporelle et idiomatique sans exclure entièrement la richesse sémantique de רוּחַ.
translation_notes:
  register: Français international moderne, digne et lisible. La structure cumulative de l’énumération hébraïque est conservée. « Échansons » maintient la précision du contexte royal; les formulations relatives aux serviteurs et aux ministres rendent visible l’organisation cérémonielle de la cour sans archaïsme excessif.
