  text: וַ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת וְ/שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכְּרֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: fr
  text: Le poids de l’or qui arrivait à Salomon en une année était de six cent soixante-six talents d’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui était apporté à Salomon » ; l’hébreu dit littéralement « qui venait à Salomon », sans préciser qui apportait l’or.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: La forme narrative de היה introduit ici l’énoncé sans exiger en français un marqueur temporel comme « maintenant ». La tournure avec « était » s’intègre naturellement à la phrase.
- source_word: מִשְׁקַל הַזָּהָב
  choice: Le poids de l’or
  rationale: מִשְׁקַל désigne précisément le poids, et l’article hébreu sur « or » est naturellement rendu par « l’or ».
- source_word: אֲשֶׁר בָּא
  choice: qui arrivait
  rationale: Le verbe signifie littéralement « venir/arriver » et ne précise pas qui apportait l’or. L’imparfait français convient à un montant reçu sur la période annuelle indiquée sans ajouter d’agent.
- source_word: לִשְׁלֹמֹה
  choice: à Salomon
  rationale: La préposition ל exprime ici la destination ou le bénéficiaire de ce qui arrivait.
- source_word: בְּשָׁנָה אֶחָת
  choice: en une année
  rationale: La formulation conserve la période explicite d’une année et reste idiomatique en français.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: six cent soixante-six
  rationale: Rendu direct du nombre cardinal exact, conformément à l’orthographe française moderne où « cent » reste invariable lorsqu’il est suivi d’un autre nombre.
- source_word: כִּכְּרֵי זָהָב
  choice: talents d’or
  rationale: Le talent est l’unité ancienne de poids traditionnellement reconnue dans les traductions bibliques françaises.
theological_decisions:
- issue: Portée symbolique éventuelle du nombre 666
  choice: Présenter simplement le nombre comme une quantité historique
  alternative: Signaler dans la traduction une résonance symbolique avec d’autres emplois bibliques de 666
  rationale: Le texte hébreu indique ici un poids annuel d’or et ne donne aucune interprétation symbolique. La traduction ne doit pas importer une association théologique ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. « Talent » est conservé comme unité ancienne plutôt que converti en mesure moderne incertaine. La formulation préserve l’absence d’agent dans le texte hébreu.
