  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: fr
  text: 'Et chacun apportait son tribut[a] : des objets d’argent et des objets d’or, des vêtements[b], des armes[c], des aromates, des chevaux et des mulets, année après année.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son présent » ou « son don ». Le mot hébreu peut désigner un don ou une offrande, mais, dans ce contexte royal, « tribut » est probablement le sens visé.
    reason: lexical_alternative
  - marker: b
    text: Ou « des robes ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de l’équipement militaire » ou « des armures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: apportait
  rationale: Le participe exprime ici une action habituelle et répétée; avec « chacun », l’imparfait français rend naturellement cette valeur.
- source_word: אִישׁ מִנְחָתוֹ
  choice: chacun son tribut
  rationale: אִישׁ a une valeur distributive, et מִנְחָה désigne dans ce contexte royal un présent régulièrement remis au roi; « tribut » convient au contexte sans exclure entièrement la notion de don.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: des objets en argent et en or
  rationale: כְּלִי est un terme général pouvant désigner divers objets, récipients ou articles; « objets » préserve cette généralité.
- source_word: וּשְׂלָמוֹת
  choice: des vêtements
  rationale: Le terme désigne des pièces d’habillement, probablement précieuses; « vêtements » reste volontairement général.
- source_word: נֵשֶׁק
  choice: des armes
  rationale: Le nom peut désigner les armes ou, plus largement, l’équipement militaire; « armes » est clair et naturel.
- source_word: וּבְשָׂמִים
  choice: des aromates
  rationale: Le terme couvre des substances odoriférantes et des épices de prix; « aromates » convient bien à une liste de présents royaux.
- source_word: סוּסִים וּפְרָדִים
  choice: des chevaux et des mulets
  rationale: Équivalents lexicaux directs et naturels en français.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: année après année
  rationale: Cette expression idiomatique marque la récurrence annuelle; la formulation française conserve son caractère itératif.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La coordination de « des objets en argent et en or » allège la répétition tout en conservant les deux catégories du texte hébreu. L’imparfait et « année après année » rendent ensemble l’action coutumière.
