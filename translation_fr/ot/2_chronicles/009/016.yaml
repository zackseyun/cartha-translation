  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שׁ מֵאוֹת֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בְּ/בֵ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: fr
  text: Il fit aussi trois cents boucliers en or battu[a] ; trois cents sicles d’or[b] furent appliqués à chaque bouclier. Le roi les plaça dans la Maison de la Forêt du Liban[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en or martelé ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « trois cents d’or » pour chaque bouclier, sans préciser l’unité de poids. « Sicles » est ajouté pour rendre le sens explicite, probablement d’après le passage parallèle de 1 Rois 10.17.
    reason: lexical_alternative
  - marker: c
    text: 'La Maison de la Forêt du Liban était un édifice royal portant ce nom ; autre traduction possible : « le palais de la Forêt du Liban ».'
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: boucliers
  rationale: מָגֵן désigne un bouclier. « Boucliers » est précis, naturel et n’impose pas une taille particulière.
- source_word: זָהָב שָׁחוּט
  choice: or battu
  rationale: שָׁחוּט décrit ici de l’or travaillé au marteau, probablement aminci en plaques. « Or battu » est l’expression française courante et concise.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: trois cents sicles d’or
  rationale: L’hébreu dit littéralement « trois cents d’or » sans nommer l’unité. Le parallèle de 1 Rois 10.17 permet de comprendre qu’il s’agit vraisemblablement de sicles ; l’unité est explicitée dans le texte pour que la phrase soit intelligible, avec une note signalant l’ellipse.
- source_word: יַעֲלֶה עַל
  choice: furent appliqués à
  rationale: La tournure exprime la quantité d’or mise sur chaque bouclier. « Furent appliqués à » restitue naturellement l’idée concrète sans conclure que l’or couvrait nécessairement toute la surface.
- source_word: הַמָּגֵן הָאֶחָת
  choice: chaque bouclier
  rationale: 'Le singulier, littéralement « le bouclier unique », a ici une valeur distributive : la quantité indiquée concernait chacun des trois cents boucliers.'
- source_word: וַיִּתְּנֵם
  choice: les plaça
  rationale: Dans un contexte locatif, נתן signifie mettre ou placer. « Les plaça » convient au registre narratif et demeure naturel.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: la Maison de la Forêt du Liban
  rationale: La formulation préserve le caractère de nom propre de cet édifice royal et suit de près la construction hébraïque.
