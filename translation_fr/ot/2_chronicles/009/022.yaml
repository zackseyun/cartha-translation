  yaml_path: translation/ot/2_chronicles/009/022.yaml
  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: fr
  text: Le roi Salomon surpassa tous les rois de la terre en richesse et en sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: surpassa
  rationale: Dans cette construction comparative avec מִן, le verbe גדל exprime la supériorité par rapport à d’autres. « Surpassa » rend ce sens clairement et naturellement en français.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Le roi Salomon
  rationale: Cette formulation française naturelle conserve à la fois le titre royal et le nom propre.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: tous les rois de la terre
  rationale: אָרֶץ peut désigner le pays ou la terre. Ici, la portée internationale du contexte et la comparaison générale entre souverains favorisent « la terre ».
- source_word: לְעֹשֶׁר
  choice: en richesse
  rationale: Le לְ indique ici le domaine dans lequel Salomon surpassait les autres. « En richesse » est idiomatique et précis.
- source_word: וְחָכְמָה
  choice: et en sagesse
  rationale: חָכְמָה signifie « sagesse ». La répétition de « en » est naturelle en français et explicite les deux domaines de comparaison.
