  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: fr
  text: La reine de Saba entendit parler de la renommée de Salomon[a]. Elle vint à Jérusalem pour mettre Salomon à l’épreuve par des énigmes[b], avec une suite très imposante et des chameaux chargés d’aromates, d’or en abondance et de pierres précieuses. Lorsqu’elle arriva auprès de Salomon, elle lui parla de tout ce qui était dans son cœur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entendit le récit concernant Salomon ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par des questions difficiles ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « de tout ce qui était avec son cœur » : une expression qui désigne l’ensemble de ses pensées et de ses préoccupations.'
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: renommée
  rationale: Dans l’expression « entendre le שֵׁמַע de Salomon », le nom désigne ce qui se disait de lui et la réputation ainsi répandue. « Renommée » rend naturellement cette portée en français, tandis qu’une note conserve l’alternative plus littérale « récit/rapport ».
- source_word: לְנַסּוֹת
  choice: mettre à l’épreuve
  rationale: Le verbe נסה exprime ici l’intention de tester les capacités de Salomon; « mettre à l’épreuve » est clair et idiomatique.
- source_word: בְחִידוֹת
  choice: par des énigmes
  rationale: חִידוֹת désigne des énigmes, paroles obscures ou questions difficiles. « Énigmes » préserve l’image concrète sans réduire le sens à de simples questions.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Avec le verbe de mouvement « venir », le français emploie naturellement « à Jérusalem » pour exprimer la destination.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: accompagnée d’une suite extrêmement nombreuse
  rationale: חַיִל peut évoquer une force, une armée, des ressources ou un groupe important. Le contexte d’un voyage royal avec des chameaux et des présents favorise ici l’idée d’une imposante suite plutôt que d’une armée.
- source_word: בְּשָׂמִים
  choice: aromates
  rationale: Le pluriel désigne des substances odorantes et précieuses. « Aromates » convient au registre du commerce et des présents royaux tout en restant intelligible.
- source_word: לָרֹב
  choice: en abondance
  rationale: L’expression indique une très grande quantité d’or; « en abondance » en restitue naturellement l’intensité.
- source_word: אֶבֶן יְקָרָה
  choice: pierres précieuses
  rationale: Le singulier hébreu a ici une valeur collective dans une liste de marchandises; le pluriel français est naturel.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: elle lui parla
  rationale: דבר avec עִם implique une interaction avec Salomon. « Elle lui parla » est fluide en français et le complément qui suit en précise le contenu.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: de tout ce qu’elle avait à cœur
  rationale: Cette tournure française conserve la référence au cœur tout en exprimant naturellement l’ensemble de ses pensées, préoccupations et questions.
