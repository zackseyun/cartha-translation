  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: fr
  text: Le roi Salomon fit deux cents grands boucliers en or battu ; six cents sicles[a] d’or battu furent employés pour chaque bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « six cents d’or battu montaient sur un bouclier ». L’hébreu sous-entend une unité de poids ; « sicles » est ajouté dans la traduction pour plus de clarté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire » ; au passé simple, « fit » convient au registre narratif et à l’énumération.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: le roi Salomon
  rationale: Cette tournure rend naturellement en français le titre royal suivi du nom propre.
- source_word: מָאתַיִם
  choice: deux cents
  rationale: Rendu direct du nombre cardinal.
- source_word: צִנָּה
  choice: grands boucliers
  rationale: צִנָּה désigne vraisemblablement un grand bouclier couvrant le corps, par contraste avec le bouclier plus petit.
- source_word: זָהָב שָׁחוּט
  choice: or battu
  rationale: שָׁחוּט décrit ici de l’or travaillé et aminci par martelage ; « or battu » est précis, concis et idiomatique.
- source_word: שֵׁשׁ מֵאוֹת
  choice: six cents
  rationale: Rendu direct du nombre cardinal.
- source_word: יַעֲלֶה עַל
  choice: furent employés pour
  rationale: L’expression indique littéralement que la quantité d’or « montait sur » le bouclier, c’est-à-dire qu’elle servait à sa fabrication ou à son revêtement. Cette formulation française transmet le sens sans affirmer que l’or le recouvrait entièrement.
- source_word: הַצִּנָּה הָאֶחָת
  choice: chaque bouclier
  rationale: Littéralement « le bouclier unique » ou « un bouclier » ; dans ce contexte numérique distributif, le français naturel dit « chaque bouclier ».
- source_word: '[unité sous-entendue après שֵׁשׁ מֵאוֹת]'
  choice: sicles
  rationale: L’hébreu ne nomme pas l’unité de poids, mais la construction implique une mesure d’or. « Sicles » explicite l’unité traditionnellement comprise, tandis que la note signale qu’elle est sous-entendue.
