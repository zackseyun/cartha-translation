  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: fr
  text: Le reste des actes de Salomon, du début à la fin, n’est-il pas consigné dans les annales de Nathan le prophète[a], dans la prophétie d’Ahija de Silo et dans les visions d’Iddo le voyant au sujet de Jéroboam, fils de Nebath[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les paroles de Nathan le prophète » ou « dans le récit de Nathan le prophète ». Le terme hébreu peut désigner des paroles ou un document écrit ; ici, le contexte favorise le sens d’un écrit consigné.
    reason: lexical_alternative
  - marker: b
    text: Ou « contre Jéroboam, fils de Nebath ». La préposition hébraïque peut indiquer soit le sujet des visions, soit leur orientation hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: Quant au reste des actes de Salomon
  rationale: Dans cette formule de conclusion royale, דִּבְרֵי désigne les faits et gestes ou les actes du roi plutôt que ses seules paroles. « Quant au reste » rend naturellement le passage à la notice finale tout en conservant la valeur connective de וּ.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: des premiers aux derniers
  rationale: Cette formulation conserve les deux adjectifs hébreux et exprime l’ensemble de la carrière de Salomon.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: n’est-il pas consigné
  rationale: Le singulier français reprend collectivement « le reste »; la tournure interrogative rhétorique de l’hébreu est préservée. « Consigné » convient à une référence documentaire.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: dans les récits de Nathan le prophète
  rationale: Dans ce contexte de sources écrites, דִּבְרֵי peut désigner des récits ou annales, tout en gardant une ambiguïté lexicale signalée en note.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: la prophétie d’Ahija de Silo
  rationale: נְבוּאָה signifie directement « prophétie ». Le gentilé hébreu est rendu en français naturel par « de Silo ».
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: et dans les visions de Yédo le voyant
  rationale: חֲזוֹת est rendu par « visions » et חֹזֶה par « voyant », ce qui préserve la distinction avec נָבִיא, « prophète ». La forme consonantique inhabituelle du nom est reflétée par la forme française traditionnelle « Yédo ».
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: au sujet de Jéroboam, fils de Nebath
  rationale: עַל indique le plus naturellement ici le sujet des visions, mais une nuance hostile demeure possible et est signalée en note.
theological_decisions:
- issue: Portée de la préposition עַל devant Jéroboam
  choice: au sujet de
  alternative: contre
  rationale: Dans une liste de sources documentaires, la référence au sujet traité est la lecture la plus naturelle. La traduction ne doit toutefois pas effacer la possibilité que les visions aient été dirigées contre Jéroboam; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique et la distinction entre « prophète » et « voyant » sont conservées. Les noms propres suivent des formes françaises bibliques usuelles; la syntaxe reste fluide malgré l’énumération des sources.
