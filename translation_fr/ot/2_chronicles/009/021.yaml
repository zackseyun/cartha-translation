  verdict: revise
  source_fidelity: La traduction rend fidèlement la structure générale, les marchandises et la périodicité. Toutefois, « revenaient » introduit l’idée d’un retour, qui n’est pas exprimée par תָּבֹאנָה (« venaient/arrivaient ») et ne doit pas être déduite du contexte.
  naturalness: Le français est naturel, clair et d’un registre approprié. « Arrivaient » est idiomatique dans ce contexte maritime et conserve l’aspect habituel de l’imparfait sans ajouter l’idée de retour.
  terminology: « Tarsis », « Houram », « ivoire », « singes » et « paons » sont appropriés. La note sur « perroquets » préserve correctement l’incertitude lexicale de תּוּכִּיִּים. Le contraste entre « qui se rendaient à Tarsis » et « les navires de Tarsis » respecte les deux formulations hébraïques.
  issues:
  - severity: medium
    issue: « revenaient » ajoute une notion de retour.
    rationale: Le verbe hébreu תָּבֹאנָה signifie ici que les navires « venaient » ou « arrivaient » de façon régulière. Il ne spécifie pas qu’ils revenaient; cette précision narrative excède le texte source.
