base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: fr
  text: Car le roi avait des navires qui se rendaient à Tarsis avec les serviteurs de Houram. Une fois tous les trois ans, les navires de Tarsis arrivaient, chargés d’or, d’argent, d’ivoire, de singes et de paons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « perroquets » ; l’identification de cet animal en hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit une explication de la richesse de Salomon dans le contexte; « car » conserve clairement le lien discursif.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: le roi avait des navires
  rationale: La construction avec ל exprime ici naturellement la possession; cette formulation est idiomatique en français tout en conservant le pluriel.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: qui se rendaient à Tarsis
  rationale: Le participe de mouvement suivi de Tarsis se comprend le plus naturellement comme l’indication d’une destination ou d’une route, sans exclure les débats sur l’expression maritime liée à Tarsis.
- source_word: עִם עַבְדֵי חוּרָם
  choice: avec les serviteurs de Houram
  rationale: « Serviteurs » rend directement le personnel au service du roi Houram, sans préciser indûment leur statut social.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Une fois tous les trois ans
  rationale: Équivalent français naturel de l’expression distributive temporelle.
- source_word: תָּבֹאנָה
  choice: revenaient
  rationale: L’imparfait rend l’action habituelle et répétée; « revenaient » convient au point de vue du royaume qui reçoit leur cargaison.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: les navires de Tarsis
  rationale: Conserve la forme nominale traditionnelle, qui peut désigner des navires associés à Tarsis ou à son commerce sans imposer une explication technique.
- source_word: נֹשְׂאוֹת
  choice: chargés de
  rationale: Expression française naturelle pour des navires transportant régulièrement ces marchandises.
- source_word: זָהָב וָכֶסֶף
  choice: or, argent
  rationale: Équivalents directs des deux métaux précieux.
- source_word: שֶׁנְהַבִּים
  choice: ivoire
  rationale: Désignation usuelle de cette matière dans une liste de marchandises.
- source_word: וְקוֹפִים
  choice: singes
  rationale: Rendu moderne courant du nom animal, qui peut avoir une portée assez large.
- source_word: וְתוּכִּיִּים
  choice: paons
  rationale: Identification traditionnelle et plausible, mais le nom animal hébreu demeure incertain; une autre possibilité est signalée en note.
