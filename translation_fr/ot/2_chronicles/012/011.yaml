  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: fr
  text: Chaque fois que le roi entrait dans la maison de Yahweh, les gardes[a] venaient porter les boucliers[b], puis ils les rapportaient dans la salle des gardes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les coureurs »; il s’agit de la garde royale.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « les »; ce pronom renvoie aux boucliers de bronze mentionnés au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: Chaque fois que … entrait
  rationale: La tournure מִדֵּי suivie de l’infinitif exprime une action répétée. Cette formulation française en restitue naturellement la valeur itérative.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve la désignation hébraïque habituelle du temple, tandis que « Yahweh » transcrit le nom divin.
- source_word: הָרָצִים
  choice: les gardes
  rationale: Le mot signifie littéralement « coureurs », mais désigne ici les membres de la garde royale. « Gardes » exprime clairement leur fonction en français actuel.
- source_word: וּנְשָׂאוּם
  choice: venaient prendre les boucliers
  rationale: Le verbe signifie porter ou emporter. Le pronom suffixe renvoie aux boucliers de bronze du verset précédent; reprendre le nom en français évite une ambiguïté peu naturelle.
- source_word: וֶהֱשִׁיבוּם
  choice: ils les rapportaient
  rationale: Le hifil de שׁוב indique ici qu’on remet les objets dans leur lieu de rangement après leur utilisation.
- source_word: תָּא הָרָצִים
  choice: la salle des gardes
  rationale: תָּא désigne une pièce ou une chambre. « Salle des gardes » rend naturellement le lieu rattaché à cette unité royale sans le préciser davantage que le texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le caractère propre du nom divin sans le remplacer par un titre.
translation_notes:
  register: Français moderne, clair et digne. La répétition de l’action est explicitement conservée. Le nom « boucliers » remplace le pronom à sa première occurrence pour assurer une référence naturelle, puis le pronom est repris dans la seconde proposition.
