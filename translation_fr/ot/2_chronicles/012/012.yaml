  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: fr
  text: Quand il s’humilia, la colère de Yahweh se détourna de lui, de sorte qu’il ne le détruisit pas entièrement. Il y avait aussi de bonnes choses[a] en Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « bonnes choses » est générale ; elle peut désigner des dispositions, des actes, des réalités ou des circonstances favorables en Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Quand il s’humilia
  rationale: La préposition בְּ devant l’infinitif construit a ici une valeur temporelle. La forme hitpael de כנע exprime l’abaissement volontaire de Roboam.
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: la colère de Yahweh se détourna de lui
  rationale: אַף désigne idiomatiquement la colère, tandis que שׁוב avec מִן conserve l’idée directionnelle d’une colère qui se retire de quelqu’un, sans introduire l’interprétation plus marquée « Yahweh renonça ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: de sorte qu’il ne le détruisit pas entièrement
  rationale: Le lien de conséquence convient au contexte. לְכָלָה renforce l’idée de destruction jusqu’à son terme; « entièrement » la rend naturellement. Les pronoms explicitent en français le sujet divin et Roboam comme objet selon le contexte immédiat.
- source_word: וְגַם בִּיהוּדָה הָיָה דְּבָרִים טוֹבִים
  choice: Il y avait aussi de bonnes choses en Juda
  rationale: La formulation existentielle est naturelle en français et garde דְּבָרִים טוֹבִים volontairement général, sans le limiter à des actes, à une réforme morale ou à une situation prospère.
theological_decisions:
- issue: Expression du jugement divin et de son atténuation
  choice: la colère de Yahweh se détourna de lui, de sorte qu’il ne le détruisit pas entièrement
  alternative: Yahweh renonça à sa colère et ne le détruisit pas du tout
  rationale: Le texte affirme une réelle atténuation du jugement en réponse à l’humiliation de Roboam, sans dire que toute conséquence fut supprimée. La traduction conserve à la fois la colère divine et la portée limitée de la destruction.
- issue: Portée des « bonnes choses » présentes en Juda
  choice: de bonnes choses
  alternative: de bonnes actions / une situation favorable
  rationale: Le substantif דְּבָרִים est large. La traduction ne tranche pas entre qualités, actes, dispositions ou circonstances favorables.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La syntaxe reste proche de l’hébreu tout en explicitant les rapports nécessaires à une lecture naturelle.
