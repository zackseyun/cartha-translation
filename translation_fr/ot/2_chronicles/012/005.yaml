  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: fr
  text: 'Alors le prophète Shemaya vint trouver Roboam et les chefs de Juda qui s’étaient rassemblés à Jérusalem à cause de Shishaq[a]. Il leur dit : « Voici ce que dit Yahweh : Vous m’avez abandonné ; moi aussi, je vous ai abandonnés entre les mains de Shishaq. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « loin de la face de Shishaq » ; l’expression peut évoquer la fuite devant lui ou la crainte qu’il inspirait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: Alors le prophète Shemaya
  rationale: La conjonction fait progresser le récit ; « Alors » exprime naturellement la succession. Le titre défini est conservé et le nom hébreu est translittéré en français.
- source_word: בָּא אֶל רְחַבְעָם
  choice: vint trouver Roboam
  rationale: Cette formulation française rend naturellement l’arrivée de Shemaya auprès de Roboam sans imposer un point de vue spatial artificiel.
- source_word: וְשָׂרֵי יְהוּדָה
  choice: et les chefs de Juda
  rationale: שָׂרִים désigne ici les détenteurs d’une autorité politique. « Chefs » est courant, digne et moins restrictif que « princes ».
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלִַם
  choice: qui s’étaient rassemblés à Jérusalem
  rationale: Le plus-que-parfait situe le rassemblement avant l’arrivée du prophète ; « à Jérusalem » exprime idiomatiquement le lieu atteint.
- source_word: מִפְּנֵי שִׁישָׁק
  choice: à cause de Shishaq
  rationale: L’expression indique que l’avancée ou la menace de Shishaq motive leur rassemblement, tout en laissant au contexte la nuance possible de fuite ou de crainte.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation française actuelle de la formule prophétique, avec transcription explicite du nom divin.
- source_word: עֲזַבְתֶּם אֹתִי
  choice: Vous m’avez abandonné
  rationale: « Abandonner » garde la gravité relationnelle et théologique de עזב dans un français moderne.
- source_word: וְאַף אֲנִי עָזַבְתִּי אֶתְכֶם
  choice: moi aussi, je vous ai abandonnés
  rationale: La répétition du même verbe préserve la symétrie rhétorique et le caractère réciproque du jugement.
- source_word: בְּיַד שִׁישָׁק
  choice: aux mains de Shishaq
  rationale: L’expression française conserve l’image sémitique de la main comme pouvoir ou domination, tout en étant idiomatique au pluriel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Portée du double emploi de עזב
  choice: « abandonné » dans les deux propositions
  alternative: « délaissé » ou « livré » dans la seconde
  rationale: Employer le même verbe conserve la correspondance explicite entre l’abandon de Yahweh par le peuple et le jugement divin, sans atténuer la tension théologique du propos.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms sont rendus sous les formes Shemaya, Roboam et Shishaq. La citation prophétique reste solennelle sans archaïsme ; l’image des « mains » est conservée parce qu’elle demeure claire en français.
