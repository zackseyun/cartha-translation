  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: fr
  text: Car ils deviendront ses serviteurs[a], afin qu’ils apprennent ce que c’est que de me servir et de servir les royaumes des pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses esclaves ». En hébreu, les mots traduits par « serviteurs » et « servir » appartiennent à la même famille. Ils peuvent désigner le service, l’assujettissement ou l’esclavage et, lorsqu’il s’agit de Dieu, le service cultuel.
    reason: Préserver l’étendue sémantique et le jeu lexical de עבד / עבודה, qui associent ici service religieux et sujétion politique.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’action divine annoncée au verset précédent.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: ils deviendront ses serviteurs
  rationale: La construction avec היה exprime ici le fait de devenir. Dans ce contexte de soumission politique à Shishak, « serviteurs » évoque une condition imposée tout en restant naturel et digne en français; la note explicite la force possible de « esclaves ».
- source_word: וְיֵדְעוּ
  choice: afin qu’ils apprennent ce que signifie
  rationale: L’imparfait précédé de waw peut exprimer ici le but ou le résultat. « Apprennent » rend la dimension pédagogique de ידע dans ce contexte, tandis que « ce que signifie » permet un français idiomatique avec l’idée de servir.
- source_word: עֲבוֹדָתִי ... וַעֲבוֹדַת
  choice: me servir, moi, et servir
  rationale: La répétition du même verbe français maintient le contraste délibéré entre le service dû au Seigneur et l’assujettissement aux royaumes étrangers. La mise en relief « moi » rend le suffixe possessif et renforce le parallélisme sans en modifier le sens.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: les royaumes des autres pays
  rationale: « Royaumes » conserve la dimension politique; « des autres pays » exprime naturellement en français les multiples territoires étrangers visés dans le contexte, sans donner à אֲרָצוֹת le sens universel de « toute la terre ».
theological_decisions:
- issue: Faut-il rendre עֲבוֹדָה par « service », « culte » ou par le verbe « servir » ?
  choice: servir
  alternative: service; culte
  rationale: Le passage oppose l’allégeance au Seigneur à la soumission aux royaumes terrestres. « Servir » préserve ce double champ religieux et politique et maintient le parallèle entre les deux emplois, tandis que « culte » limiterait indûment le premier à l’activité cultuelle.
- issue: Faut-il rendre עֲבָדִים par « serviteurs » ou « esclaves » ?
  choice: serviteurs
  alternative: esclaves
  rationale: Le contexte implique bien une sujétion politique contraignante, mais le terme hébreu possède une gamme de sens plus large que le seul esclavage. « Serviteurs » maintient en outre le lien lexical avec « servir »; la note signale explicitement la nuance plus forte.
translation_notes:
  register: Français international actuel, clair et digne. La formulation verbale évite le tour peu idiomatique « connaître mon service » tout en conservant le contraste et la répétition du texte hébreu.
