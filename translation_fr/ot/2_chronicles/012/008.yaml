  source_fidelity: La traduction rend correctement la valeur explicative de כִּי, le devenir sous l’autorité de Shishak et la portée pédagogique de וְיֵדְעוּ. Toutefois, « des autres pays » ajoute l’idée d’altérité, absente de מַמְלְכוֹת הָאֲרָצוֹת (« les royaumes des pays/terres »). La reformulation actuelle développe aussi légèrement le double emploi parallèle de עֲבוֹדָה.
  naturalness: « Afin qu’ils apprennent ce que c’est que de… » est un tour actuel et naturel en français international. Il transmet bien, sans lourdeur, l’idée contextuelle selon laquelle ils apprendront par expérience ce que représente le service de Dieu par opposition à la soumission aux royaumes étrangers.
  terminology: « Serviteurs » est admissible pour עֲבָדִים, à condition que la note conserve clairement la possibilité contextuelle plus forte d’« esclaves ». Le verbe « servir » préserve utilement le parallélisme de עֲבוֹדָתִי et עֲבוֹדַת. « Royaumes des pays » est plus fidèle que « royaumes des autres pays » et demeure compréhensible.
