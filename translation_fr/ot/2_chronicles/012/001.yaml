source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: fr
  text: Lorsque la royauté de Roboam fut affermie et qu’il devint puissant, il abandonna la loi de Yahvé[a], et tout Israël avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction de Yahvé ». Le mot hébreu torah peut signifier « loi » ou « instruction », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: Lorsque … fut affermie
  rationale: La tournure introduit la circonstance temporelle du récit. « Lorsque » est naturel en français, et « fut affermie » rend le sens de consolidation exprimé par כון.
- source_word: מַלְכוּת רְחַבְעָם
  choice: la royauté de Roboam
  rationale: Dans ce contexte, מַלְכוּת désigne le pouvoir royal de Roboam en voie de consolidation. « Royauté » évite de faire du territoire lui-même le sujet d’un affermissement, tout en restant proche de l’hébreu.
- source_word: וּכְחֶזְקָתוֹ
  choice: et qu’il devint puissant
  rationale: La seconde proposition est elle aussi circonstancielle et décrit la puissance acquise par Roboam. Cette formulation française est claire sans ajouter l’idée plus précise de sécurité.
- source_word: עָזַב
  choice: abandonna
  rationale: « Abandonna » exprime nettement la défection à l’égard de la volonté divine, sans l’archaïsme de « délaissa » ou « déserta ».
- source_word: תּוֹרַת יְהוָה
  choice: la loi de Yahvé
  rationale: Dans ce cadre historique et lié à l’alliance, « loi » est la formulation la plus immédiatement compréhensible, tandis qu’une note conserve l’autre valeur possible de תּוֹרָה.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française usuelle du nom divin, employée ici plutôt qu’un titre substitutif.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: et tout Israël avec lui
  rationale: La formulation concise conserve l’ellipse hébraïque et indique que tout Israël participa à cet abandon avec Roboam.
theological_decisions:
- issue: Portée de « tout Israël » sous la monarchie divisée
  choice: Conserver « tout Israël » sans en préciser la portée.
  alternative: « tout Juda » ou « tout son peuple »
  rationale: Le texte hébreu dit Israël, même si le contexte politique peut soulever une question sur l’étendue exacte du groupe. La traduction préserve cette tension au lieu de la résoudre.
- issue: Sens de תּוֹרָה
  choice: Traduire par « loi » et signaler « instruction » en note.
  alternative: « instruction » ou « Torah »
  rationale: « Loi » convient au contexte d’infidélité collective envers Yahvé, mais תּוֹרָה possède une gamme sémantique plus large qu’il faut rendre visible.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique digne sans être obscur. La syntaxe reste fluide, et l’ellipse finale de l’hébreu est conservée naturellement.
