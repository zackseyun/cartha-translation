source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: fr
  text: Le roi Roboam affermit son pouvoir à Jérusalem et régna[a]. Roboam avait quarante et un ans lorsqu’il devint roi, et il régna dix-sept ans à Jérusalem, la ville que Yahweh avait choisie parmi toutes les tribus d’Israël pour y placer son nom. Sa mère s’appelait Naama l’Ammonite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devint puissant à Jérusalem et régna ». Le verbe hébreu peut exprimer le fait de devenir fort ou celui d’affermir sa position.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: affermit son pouvoir
  rationale: Le hitpael de חזק exprime ici le fait de devenir fort ou de consolider sa position. Dans ce contexte royal, « affermit son pouvoir » rend naturellement l’idée de consolidation sans suggérer seulement une force physique.
- source_word: וַיִּמְלֹךְ
  choice: et régna
  rationale: Le verbe poursuit le récit sans imposer l’idée d’un commencement, laquelle est exprimée ensuite dans la formule d’âge.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: L’infinitif construit précédé de בְּ situe l’âge de Roboam au moment de son accession au trône.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: pour y placer son nom
  rationale: Cette formulation conserve l’image concrète du texte et évite de la développer en une explication théologique sur la présence divine.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: parmi toutes les tribus d’Israël
  rationale: La préposition מִן marque ici le choix effectué au sein de l’ensemble des tribus.
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: Sa mère s’appelait Naama
  rationale: Cette tournure française actuelle et naturelle restitue fidèlement la formule nominale hébraïque.
- source_word: הָעַמֹּנִית
  choice: l’Ammonite
  rationale: Le gentilé féminin précise sobrement l’origine ethnique de Naama.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; conserver le nom propre évite de le remplacer par un titre.
- issue: Formule d’élection de Jérusalem
  choice: pour y placer son nom
  alternative: pour y établir sa présence
  rationale: Le choix retenu préserve l’expression concrète et sa tension théologique sans lui substituer une interprétation de ce que signifie la présence du nom.
translation_notes:
  register: Français international moderne, clair et digne. « Affermit son pouvoir » explicite sobrement la consolidation royale impliquée par le contexte; « plaça son nom » conserve l’idiome biblique sans paraphrase doctrinale.
