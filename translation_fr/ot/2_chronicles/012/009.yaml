id: 2CH.12.9
reference: 2 Chronicles 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: fr
  text: Shishak, roi d’Égypte, monta contre Jérusalem. Il prit les trésors de la maison de Yahweh[a] et ceux de la maison du roi[b]. Il prit tout. Il prit aussi les boucliers d’or que Salomon avait faits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du palais royal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: monta contre Jérusalem
  rationale: Le verbe עלה suivi de עַל, dans ce contexte militaire, décrit une marche contre une ville. « Monta contre » conserve l’image hébraïque tout en restant intelligible en français.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: Shishak, roi d’Égypte
  rationale: Le nom propre est translittéré, et l’apposition exprime directement le titre et le royaume du personnage.
- source_word: אֹצְרוֹת
  choice: les trésors
  rationale: Dans ce contexte de pillage, le terme peut désigner les richesses conservées dans les réserves du temple et du palais. « Trésors » est naturel et évite de réduire le sens aux seuls locaux du trésor.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’expression hébraïque et son parallèle avec « la maison du roi »; elle désigne ici le temple.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: La formulation littérale maintient le parallélisme du texte hébreu; dans le contexte, il s’agit du palais royal.
- source_word: אֶת הַכֹּל לָקָח
  choice: Il prit tout
  rationale: La brève reprise souligne l’ampleur totale du pillage et reproduit l’insistance de l’hébreu.
- source_word: מָגִנֵּי הַזָּהָב
  choice: les boucliers d’or
  rationale: Expression française naturelle qui rend précisément les boucliers faits en or.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: que Salomon avait faits
  rationale: Le plus-que-parfait situe naturellement leur fabrication avant leur saisie, sans modifier le rapport temporel du récit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français moderne, sobre et narratif. La répétition « Il prit » est conservée afin de rendre l’insistance du texte hébreu, tandis que les notes explicitent les deux emplois institutionnels de « maison ».
