  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: fr
  text: 'Il avait avec lui 1 200 chars et 60 000 cavaliers. Le peuple qui était venu avec lui d’Égypte était innombrable[a] : les Libyens, les Soukkites[b] et les Koushites[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait pas de nombre pour le peuple ».'
    reason: lexical_alternative
  - marker: b
    text: « Soukkites » transcrit le nom d’un peuple dont l’identification exacte est incertaine ; on trouve aussi la forme « Soukkiim ».
    reason: cultural_note
  - marker: c
    text: Ou « Éthiopiens » ; « Koushites » reflète plus directement le terme ethnogéographique hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: avec 1 200 chars
  rationale: La préposition ב introduit ici l’effectif accompagnant le roi. רֶכֶב peut désigner collectivement les chars ou la charrerie ; avec un nombre précis, « 1 200 chars » est naturel et fidèle.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: et 60 000 cavaliers
  rationale: פָּרָשִׁים désigne ici des combattants montés. « Cavaliers » convient au registre militaire et demeure courant en français.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: Le peuple … était innombrable
  rationale: Cette formulation française rend l’idiome hébreu « il n’y avait pas de nombre pour le peuple » sans remplacer עָם par un terme militaire plus précis que le texte.
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: venu d’Égypte avec lui
  rationale: Le participe français s’intègre naturellement à la phrase tout en conservant l’origine égyptienne et l’accompagnement exprimés en hébreu.
- source_word: לוּבִים
  choice: Libyens
  rationale: « Libyens » est l’équivalent français usuel de cet ethnonyme, plutôt qu’une simple translittération « Loubim ».
- source_word: סֻכִּיִּים
  choice: Soukkites
  rationale: L’identification exacte de ce peuple est incertaine. Une translittération francisée évite de lui attribuer une identité non assurée.
- source_word: כּוּשִׁים
  choice: Koushites
  rationale: « Koushites » reflète directement le terme ethnogéographique hébreu et évite l’identification potentiellement anachronique avec les Éthiopiens modernes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée après l’inventaire militaire pour éviter une coordination lourde. Les ethnonymes reçoivent des formes françaises usuelles ou transparentes, et l’incertitude historique est conservée en note.
