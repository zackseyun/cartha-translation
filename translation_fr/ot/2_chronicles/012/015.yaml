  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: fr
  text: Les actes de Roboam, les premiers comme les derniers, ne sont-ils pas écrits dans les récits du prophète Shemaïa et du voyant Iddo, pour l’enregistrement généalogique[a] ? Il y eut des guerres entre Roboam et Jéroboam tout au long de leurs règnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les registres généalogiques » ou « en vue d’une inscription généalogique ». L’expression hébraïque est difficile et peut indiquer la forme ou le but des documents associés à Iddo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: les actes de Roboam
  rationale: Dans cette formule récapitulative royale, דִבְרֵי désigne les faits et gestes du règne plutôt que de simples paroles. « Actes » convient au registre historiographique.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: les premiers comme les derniers
  rationale: Cette formulation française conserve les deux pôles de l’expression hébraïque tout en indiquant naturellement l’ensemble du règne.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: La question rhétorique de la formule hébraïque de renvoi aux sources est maintenue.
- source_word: בְּדִבְרֵי
  choice: dans les récits
  rationale: Ici, דִבְרֵי renvoie à des documents historiographiques. « Récits » est naturel en français sans imposer qu’il s’agisse d’annales officielles.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Équivalent français courant du titre נָבִיא.
- source_word: הַחֹזֶה
  choice: le voyant
  rationale: « Voyant » conserve la distinction lexicale entre חֹזֶה et נָבִיא.
- source_word: לְהִתְיַחֵשׂ
  choice: selon un classement généalogique
  rationale: Le verbe יחס au hitpael concerne l’inscription ou le classement par généalogie. La formulation garde le lien généalogique sans prétendre résoudre entièrement la syntaxe difficile.
- source_word: וּמִלְחֲמוֹת
  choice: Il y eut des guerres
  rationale: Le texte hébreu présente formellement un groupe nominal coordonné. L’ajout du verbe implicite produit une phrase française claire sans modifier le contenu.
- source_word: כָּל הַיָּמִים
  choice: durant toute leur vie
  rationale: Cette expression rend l’idiome hébreu « tous les jours » en l’appliquant naturellement aux deux rois, tout en évitant de préciser s’il s’agit strictement de leur vie ou de leur règne.
