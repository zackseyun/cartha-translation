    rationale: Cette expression française évoque la totalité de la vie des deux hommes, tandis que la formule, dans le cadre des règnes et des hostilités royales, désigne la durée de leurs règnes ou de leur conflit. « tout au long de leurs règnes » rend mieux l’usage contextuel.
  - severity: low
    issue: « selon un classement généalogique » pour לְהִתְיַחֵשׂ
    rationale: La tournure est possible, mais elle rend trop directement l’idée d’organisation documentaire. L’infinitif hébreu renvoie à l’enregistrement ou au dénombrement généalogique; une formulation de finalité, accompagnée de la note, préserve mieux l’ambiguïté.
