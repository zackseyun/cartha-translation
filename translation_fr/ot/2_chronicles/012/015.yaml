revisions:
- from: Les actes de Roboam, les premiers comme les derniers, ne sont-ils pas écrits dans les récits du prophète Shemaïa et du voyant Iddo, selon un classement généalogique[a] ? Il y eut des guerres entre Roboam et Jéroboam durant toute leur vie.
  to: Les actes de Roboam, les premiers comme les derniers, ne sont-ils pas écrits dans les récits du prophète Shemaïa et du voyant Iddo, pour l’enregistrement généalogique[a] ? Il y eut des guerres entre Roboam et Jéroboam tout au long de leurs règnes.
