  source_fidelity: Le sens causal et l’évaluation morale sont bien rendus. Toutefois, « disposé son cœur » traduit de façon interprétative le hiphil de כון; « préparé son cœur » est plus directement fidèle au lexique hébreu et conserve l’image du texte. « Chercher Yahweh » rend plus naturellement דרשׁ que « rechercher Yahweh » dans cet emploi biblique.
  naturalness: « Il fit ce qui est mal » est intelligible, mais le présent « est » dans un récit au passé est moins harmonieux. « Il fit le mal » est une formulation française sobre, idiomatique et bien établie, sans ajout de sens. « Préparer son cœur à chercher Yahweh » est naturel dans un registre biblique moderne.
