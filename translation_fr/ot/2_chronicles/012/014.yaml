  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: fr
  text: Il fit le mal, parce qu’il n’avait pas préparé son cœur à chercher Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: Il fit ce qui est mal
  rationale: Cette formulation naturelle rend directement l’action et l’évaluation morale exprimées par le verbe עשה et l’adjectif substantivé הָרָע.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la cause de la conduite mauvaise.
- source_word: לֹא הֵכִין לִבּוֹ
  choice: il n’avait pas disposé son cœur
  rationale: Le hiphil de כון évoque le fait de préparer, d’établir ou d’orienter fermement. « Disposer son cœur » conserve l’image hébraïque et exprime une résolution intérieure.
- source_word: לִדְרוֹשׁ
  choice: à rechercher
  rationale: דרשׁ avec Dieu pour objet désigne le fait de se tourner vers lui pour le chercher, notamment dans la dévotion ou la consultation.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה; sa translittération préserve le nom propre de l’hébreu.
theological_decisions:
- issue: Sens du cœur non disposé
  choice: il n’avait pas disposé son cœur à rechercher Yahweh
  alternative: il n’avait pas affermi son cœur pour rechercher Yahweh
  rationale: La traduction conserve la responsabilité de la disposition intérieure sans préciser au-delà du texte si celle-ci relève surtout de la préparation, de la fermeté ou de l’orientation.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre; « Yahweh » le représente directement sans substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « disposer son cœur » reste intelligible tout en conservant l’image anthropologique hébraïque et la nuance de préparation volontaire.
