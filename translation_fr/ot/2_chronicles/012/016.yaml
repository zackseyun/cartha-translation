base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: fr
  text: Roboam reposa avec ses ancêtres[a] et fut enseveli dans la cité de David. Son fils Abiya régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères » ; formule traditionnelle indiquant la mort et le rattachement à la lignée des ancêtres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: reposa avec ses ancêtres
  rationale: Cette formulation française naturelle conserve l’image du repos et le caractère traditionnel de la formule royale annonçant la mort, sans donner à penser que Roboam s’est simplement endormi.
- source_word: וַיִּקָּבֵר
  choice: fut enseveli
  rationale: Le passif rend directement la forme hébraïque et convient au registre digne d’un récit royal.
- source_word: בְּעִיר דָּוִיד
  choice: dans la cité de David
  rationale: « Cité de David » est la désignation biblique traditionnelle et clairement reconnaissable de ce lieu.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Ce verbe reproduit sobrement la formule de succession royale, sans ajouter explicitement l’idée de commencement.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Cette translittération française correspond à la forme hébraïque אֲבִיָּה employée ici.
- source_word: בְנוֹ
  choice: son fils
  rationale: Rend directement la désignation filiale et permet une phrase française claire.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression rend fidèlement l’idée de succession au trône contenue dans l’hébreu.
