  rationale: La révision conserve la causalité théologique et l’ambiguïté référentielle du pluriel « ils ». Elle améliore la clarté de la formule de règne, rend plus précisément la relation exprimée par מָעַל בְּ, et place l’appel de note sur l’expression effectivement commentée.
