  source_fidelity: 'Le sens essentiel est bien rendu : la date relève du règne de Roboam, l’avancée de Shishak est militaire et hostile, et כִּי introduit la cause donnée par le Chroniste. « Marcha contre » est une traduction sobre et fidèle de עָלָה ... עַל. Pour מָעֲלוּ בַּיהוָה, « avaient été infidèles envers l’Éternel » exprime plus explicitement la relation rompue et l’orientation de l’infidélité que « infidèles à l’Éternel ».'
  naturalness: Le français est globalement naturel et narratif. « La cinquième année du roi Roboam » est acceptable, mais « la cinquième année du règne du roi Roboam » lève toute ambiguïté et correspond à l’usage moderne pour une datation royale.
  terminology: « L’Éternel » est un rendu biblique français cohérent de יהוה. La note doit parler de « fidélité à l’alliance » plutôt que de « fidélité ... dans le cadre de l’alliance » et son ancre doit porter sur l’expression verbale expliquée, non sur le seul nom divin.
