  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: fr
  text: La cinquième année du règne du roi Roboam, Shishak, roi d’Égypte, marcha contre Jérusalem, parce qu’ils avaient été infidèles envers l’Éternel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avaient commis une infidélité envers l’Éternel ». Le verbe hébreu évoque une rupture de confiance ou de fidélité à l’alliance.'
    reason: Préciser la portée relationnelle et liée à l’alliance du verbe מָעַל sans alourdir le texte principal.
lexical_decisions:
- source_word: וַיְהִי
  choice: '[non rendu séparément]'
  rationale: Dans ce récit, la tournure introduit l’événement et s’intègre naturellement en français à l’indication temporelle initiale, sans qu’il soit nécessaire d’ajouter « il arriva que ».
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: La cinquième année du roi Roboam
  rationale: Formulation française naturelle pour une datation selon les années de règne, proche de la structure hébraïque.
- source_word: עָלָה ... עַל
  choice: marcha contre
  rationale: Dans ce contexte militaire, le verbe avec la préposition décrit une avancée hostile. « Marcha contre » l’exprime sans affirmer davantage que le texte qu’une attaque avait déjà commencé.
- source_word: שִׁישַׁק
  choice: Shishak
  rationale: Translittération traditionnelle et reconnaissable du nom hébreu.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: roi d’Égypte
  rationale: Traduction directe de la chaîne construite hébraïque.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction donne ici la cause théologique de l’avancée égyptienne.
- source_word: מָעֲלוּ
  choice: avaient été infidèles
  rationale: Le verbe exprime une rupture de fidélité, souvent dans le cadre de la relation d’alliance. Le plus-que-parfait marque que cette infidélité précède l’invasion.
- source_word: בַּיהוָה
  choice: à l’Éternel
  rationale: Avec le verbe מעל, la préposition désigne celui envers qui l’infidélité est commise. « L’Éternel » rend le nom divin יהוה selon l’usage biblique français retenu.
theological_decisions:
- issue: Explication de l’invasion par une rupture de fidélité envers יהוה
  choice: parce qu’ils avaient été infidèles à l’Éternel
  alternative: car ils avaient commis une faute contre l’Éternel
  rationale: La formulation conserve explicitement le lien causal établi par le Chroniste entre l’infidélité du peuple et l’avancée de Shishak, sans réduire l’événement à une simple causalité politique. Le pronom pluriel « ils » est maintenu comme dans l’hébreu et renvoie au contexte précédent.
translation_notes:
  register: Français international moderne, sobre et narratif. « Marcha contre » garde la valeur militaire de l’expression hébraïque, tandis que « avaient été infidèles » restitue clairement sa portée morale et relationnelle. Le marqueur de note est placé sur l’expression qu’il explique.
