source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: fr
  text: Le roi Roboam fit donc à leur place des boucliers de bronze[a] et les confia aux chefs des gardes[b], qui surveillaient l’entrée du palais royal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces boucliers de bronze remplaçaient les boucliers d’or emportés par Shishak (voir le verset précédent).
    reason: cross_reference
  - marker: b
    text: Littéralement « coureurs » ; le terme désigne probablement ici les membres de la garde royale, qui pouvaient aussi servir de messagers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie ici « faire, fabriquer ». Le passé simple convient au récit historique et garde une expression naturelle et digne.
- source_word: תַּחְתֵּיהֶם
  choice: à leur place
  rationale: 'תחת avec suffixe exprime ici la substitution : les boucliers de bronze remplacent ceux en or emportés au verset précédent.'
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: des boucliers de bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze ; dans le contexte d’armes et d’équipement militaire, « bronze » est le choix le plus probable et le plus idiomatique.
- source_word: וְהִפְקִיד עַל יַד
  choice: les confia aux
  rationale: Le hiphil de פקד associé à עַל יַד indique la remise à la garde ou à la responsabilité de quelqu’un. « Confier à » restitue clairement cette nuance sans calque pesant.
- source_word: שָׂרֵי
  choice: chefs
  rationale: שָׂרֵי désigne les responsables ou commandants du corps concerné. « Chefs » est naturel en français et n’impose pas un grade militaire précis absent du texte.
- source_word: הָרָצִים
  choice: gardes
  rationale: Le terme signifie littéralement « coureurs », mais désigne dans ce contexte royal un corps affecté au service et à la garde du palais. La traduction fonctionnelle est signalée en note.
- source_word: הַשֹּׁמְרִים
  choice: qui surveillaient
  rationale: Le participe exprime leur fonction continue de garde. L’imparfait français rend naturellement cette activité habituelle ou durable.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: l’entrée du palais royal
  rationale: Littéralement « l’entrée de la maison du roi » ; dans ce contexte, בֵּית הַמֶּלֶךְ désigne la résidence royale, soit le palais.
theological_decisions: []
