  text: וַ/יִּלְכֹּ֛ד אֶת עָרֵ֥י הַ/מְּצֻר֖וֹת אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יָּבֹ֖א עַד יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: fr
  text: Il s’empara des villes fortifiées qui appartenaient à Juda et parvint jusqu’à Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et avança jusqu’à Jérusalem ». Littéralement, l’hébreu dit « vint jusqu’à Jérusalem » : il indique qu’après avoir pris les villes fortifiées de Juda, il atteignit Jérusalem, sans préciser ici s’il entra dans la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Il s’empara
  rationale: Le verbe לכד désigne couramment la prise d’une ville dans un contexte militaire. « S’empara » exprime naturellement cette conquête en français moderne.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: des villes fortifiées
  rationale: L’expression désigne explicitement des villes munies de fortifications. Ce rendu est précis et évite le terme plus large « places fortes ».
- source_word: אֲשֶׁר לִיהוּדָה
  choice: qui appartenaient à Juda
  rationale: La préposition ל marque ici vraisemblablement l’appartenance ou le rattachement politique. Cette formulation conserve cette nuance sans réduire l’expression à une simple localisation géographique.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: et parvint jusqu’à Jérusalem
  rationale: La combinaison בוא avec עַד décrit l’arrivée jusqu’à une limite. « Parvint jusqu’à » indique qu’il atteignit Jérusalem sans affirmer explicitement qu’il entra dans la ville.
theological_decisions: []
