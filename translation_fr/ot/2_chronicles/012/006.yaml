id: 2CH.12.6
reference: 2 Chronicles 12:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: fr
  text: 'Alors les chefs d’Israël[a] et le roi s’humilièrent et dirent : « Yahweh est juste. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les chefs d’Israël ». Dans ce contexte, certains comprennent qu’il s’agit plus précisément des chefs de Juda sous Roboam, mais le texte lui-même dit « Israël ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: s’humilièrent
  rationale: Le nifal de כנע exprime ici le fait de s’abaisser et de se soumettre en réponse à la réprimande prophétique. « S’humilièrent » rend naturellement en français cette réaction volontaire et morale.
- source_word: שָׂרֵי
  choice: les chefs
  rationale: שָׂרִים désigne des personnages exerçant l’autorité, tels que des dirigeants, dignitaires ou princes. « Les chefs » est clair, actuel et adapté au contexte.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu porte explicitement « Israël ». Même si le contexte historique concerne le royaume de Juda sous Roboam, il convient de préserver la formulation du Chroniste plutôt que de l’harmoniser.
- source_word: וְהַמֶּלֶךְ
  choice: et le roi
  rationale: Traduction directe du groupe nominal coordonné, qui distingue le roi des chefs.
- source_word: וַיֹּאמְרוּ
  choice: et dirent
  rationale: Cette formulation conserve la succession narrative et le sujet pluriel commun aux chefs et au roi, dans un registre français digne et naturel.
- source_word: צַדִּיק
  choice: juste
  rationale: Employé comme prédicat de Yahweh, צַדִּיק affirme qu’il agit avec justice et qu’il est dans son droit. « Juste » conserve la portée morale et judiciaire du terme en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, « Yahweh », plutôt que par un titre de substitution.
theological_decisions:
- issue: Conserver le nom divin ou le remplacer par un titre
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme יְהוָה. La translittération « Yahweh » préserve le nom personnel présent dans la source.
- issue: Conserver « Israël » ou harmoniser avec le contexte historique de Juda
  choice: Israël
  alternative: Juda
  rationale: L’hébreu dit explicitement « Israël ». Remplacer ce nom par « Juda » résoudrait une tension historique par interprétation ; la traduction conserve donc la formulation du texte et signale la difficulté en note.
- issue: Portée de צַדִּיק appliqué à Yahweh
  choice: Yahweh est juste
  alternative: Yahweh est dans son droit
  rationale: « Juste » préserve la densité morale et théologique de צַדִּיק sans limiter l’énoncé au seul jugement présent, tandis que le contexte permet bien d’entendre une reconnaissance de la justice de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La structure brève de la confession finale est conservée.
