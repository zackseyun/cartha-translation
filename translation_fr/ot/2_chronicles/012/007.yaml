    issue: « Une certaine délivrance » affaiblit la valeur limitative de כִּמְעַט.
    rationale: En français, « une certaine » signifie souvent « une quelconque » ou « une forme particulière de », sans indiquer nécessairement une délivrance restreinte. « Un peu de délivrance » conserve la concision et la limitation du texte source.
  - severity: low
    issue: Formes des noms « Shemaeya » et « Shishaq ».
    rationale: « Shemaya » et « Shishak » correspondent mieux aux usages français bibliques courants et à la translittération internationale usuelle.
  - severity: low
