  to: 'Quand Yahweh vit qu’ils s’étaient humiliés, la parole de Yahweh parvint à Shemaya : « Ils se sont humiliés. Je ne les détruirai pas, mais je leur accorderai un peu de délivrance[a], et ma colère ne se déversera pas sur Jérusalem par la main de Shishak. »'
  rationale: La révision rend explicitement la portée limitée de כִּמְעַט sans trancher entre délivrance, échappée et survivants, possibilités conservées dans la note. Elle améliore aussi l’idiomaticité de la formule prophétique et normalise les noms propres en français.
