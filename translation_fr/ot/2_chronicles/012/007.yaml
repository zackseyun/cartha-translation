  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: fr
  text: 'Quand Yahweh vit qu’ils s’étaient humiliés, la parole de Yahweh parvint à Shemaya : « Ils se sont humiliés. Je ne les détruirai pas, mais je leur accorderai un peu de délivrance[a], et ma colère ne se déversera pas sur Jérusalem par la main de Shishak. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une possibilité limitée d’échapper » ou « quelques survivants ». L’expression hébraïque est concise et peut souligner un secours limité plutôt qu’une destruction totale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת יְהוָה
  choice: Quand Yahweh vit
  rationale: La préposition ב avec l’infinitif construit introduit ici une proposition temporelle. « Quand … vit » rend naturellement la succession des événements.
- source_word: נִכְנָעוּ
  choice: ils s’étaient humiliés / ils se sont humiliés
  rationale: Le niphal de כנע exprime ici l’abaissement volontaire ou la soumission en réponse à l’avertissement prophétique. Le plus-que-parfait convient au récit introductif, puis le passé composé à la parole directe.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: la parole de Yahweh fut adressée à
  rationale: Cette formulation française naturelle conserve la formule prophétique selon laquelle la parole divine vient au prophète, sans la réduire à un simple verbe de parole.
- source_word: לֹא אַשְׁחִיתֵם
  choice: Je ne les détruirai pas
  rationale: Le hiphil de שׁחת signifie couramment « détruire » dans un contexte de jugement.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: mais je leur accorderai une certaine délivrance
  rationale: L’expression hébraïque est compacte et peut évoquer une délivrance limitée, la possibilité d’échapper ou la préservation de survivants. « Une certaine délivrance » reste naturel tout en signalant que le salut ne sera pas total.
- source_word: תִתַּךְ חֲמָתִי
  choice: ma colère ne se déversera pas
  rationale: L’image de la colère versée est conservée; elle est intelligible et respecte la force du langage prophétique.
- source_word: בְּיַד שִׁישָׁק
  choice: par la main de Shishaq
  rationale: La locution garde l’expression hébraïque de l’agent ou de l’instrument sans être obscure en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. Sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de la délivrance annoncée
  choice: une certaine délivrance
  alternative: un peu de délivrance / quelques survivants
  rationale: Le texte oppose la non-destruction à un secours néanmoins limité. La traduction ne précise pas indûment si פְלֵיטָה désigne l’acte d’échapper, la délivrance elle-même ou ceux qui survivent; la note conserve ces possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique est conservée sans lourdeur excessive. Les noms sont translittérés sous les formes françaises Shemaeya et Shishaq; « par la main de » maintient délibérément l’image hébraïque de l’agent.
