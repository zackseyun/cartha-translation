  source_fidelity: 'Le sens global est fidèle au texte hébreu : Yahweh répond à l’humiliation du peuple en renonçant à le détruire entièrement et en retenant sa colère contre Jérusalem par l’intermédiaire de Shishak. Toutefois, « une certaine délivrance » ne rend pas nettement la limitation exprimée par כִּמְעַט et reste ambigu en français.'
