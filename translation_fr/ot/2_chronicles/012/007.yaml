  terminology: « Yahweh », « colère », « Jérusalem » et « détruire » sont appropriés. Les formes françaises usuelles des noms dans ce contexte sont « Shemaya » et « Shishak » plutôt que « Shemaeya » et « Shishaq ».
  issues:
