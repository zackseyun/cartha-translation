source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: fr
  text: Et maintenant, j’ai choisi et consacré[a] cette maison[b], afin que mon nom y soit pour toujours, et mes yeux et mon cœur y seront tous les jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctifiée », c’est-à-dire mise à part comme sainte.
    reason: lexical_alternative
  - marker: b
    text: Cette « maison » désigne le temple.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction et l’adverbe temporel marquent une transition dans la parole divine ; « Et maintenant » en conserve l’enchaînement.
- source_word: בָּחַרְתִּי
  choice: j’ai choisi
  rationale: Le parfait hébreu présente un acte divin accompli dont les effets demeurent ; le passé composé convient naturellement en français.
- source_word: וְהִקְדַּשְׁתִּי
  choice: et consacré
  rationale: Le hifil de קדשׁ signifie ici mettre à part comme saint. « Consacré » est clair et approprié au contexte du temple.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: La traduction conserve le terme concret « maison », tout en précisant en note qu’il désigne ici le temple.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: afin que mon nom y soit
  rationale: La construction infinitive exprime le but ou le résultat. Le pronom « y » rend naturellement le locatif hébreu sans effacer la notion théologique du nom de Dieu.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression rend simplement la durée continue indiquée par l’hébreu.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: mes yeux et mon cœur y seront
  rationale: Les images anthropomorphiques sont conservées, car elles expriment l’attention et l’attachement de Dieu sans les réduire à une paraphrase.
- source_word: כָּל הַיָּמִים
  choice: tous les jours
  rationale: Cette formulation garde l’image temporelle concrète de l’hébreu et demeure compréhensible en français, avec le sens continu de « toujours » dans ce contexte.
theological_decisions:
- issue: 'Le langage anthropomorphique appliqué à Dieu : « mes yeux et mon cœur »'
  choice: Conserver littéralement les images des yeux et du cœur
  alternative: Paraphraser par « mon attention et ma sollicitude »
  rationale: Le texte hébreu emploie intentionnellement ces images pour exprimer l’attention et l’engagement de Dieu. Les conserver respecte sa texture théologique sans imposer d’explication philosophique.
- issue: La théologie du temple dans « mon nom y soit »
  choice: Conserver « mon nom »
  alternative: Traduire par « ma présence y soit » ou « j’y sois »
  rationale: Le « nom » appartient au langage vétérotestamentaire du sanctuaire. Une explicitation en « présence » déterminerait davantage le sens que ne le fait le texte hébreu.
- issue: La portée temporelle de עַד עוֹלָם et כָּל הַיָּמִים
  choice: Traduire respectivement par « pour toujours » et « tous les jours »
  alternative: Uniformiser les deux expressions par « à jamais » et « toujours »
  rationale: La formulation retenue préserve la distinction entre les deux expressions hébraïques et leur tension dans le même verset, sans chercher à les harmoniser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de l’hébreu tout en étant naturelle. Le point-virgule clarifie les deux affirmations divines, et les métaphores bibliques du nom, des yeux et du cœur sont maintenues.
