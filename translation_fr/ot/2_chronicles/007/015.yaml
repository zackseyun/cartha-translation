  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: fr
  text: Maintenant, mes yeux seront ouverts et mes oreilles attentives à la prière faite en ce lieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «à la prière de ce lieu» ou «à la prière venant de ce lieu». L’hébreu dit plus littéralement: «à la prière de ce lieu».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Rend directement l’adverbe temporel qui présente le résultat actuel de la dédicace; «Désormais» serait possible, mais expliciterait davantage la durée.
- source_word: עֵינַי
  choice: mes yeux
  rationale: Conserve l’image anthropomorphique concrète et le possessif de première personne.
- source_word: יִהְיוּ פְתֻחוֹת
  choice: seront ouverts
  rationale: Reproduit naturellement en français la valeur d’état futur de היה avec le participe passif «ouverts».
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: et mes oreilles attentives
  rationale: Préserve le parallélisme et l’image corporelle; «attentives» exprime l’écoute soutenue indiquée par קַשֻּׁבוֹת.
- source_word: לִתְפִלַּת
  choice: à la prière
  rationale: Le ל marque l’orientation de l’attention vers la prière; le singulier défini est conservé.
- source_word: הַמָּקוֹם הַזֶּה
  choice: faite en ce lieu
  rationale: La construction hébraïque signifie littéralement «la prière de ce lieu». L’ajout minimal de «faite en» exprime naturellement en français l’association de la prière avec le lieu sans imposer qu’elle en provienne.
theological_decisions:
- issue: Langage anthropomorphique concernant la perception de Dieu
  choice: Conserver «mes yeux» et «mes oreilles»
  alternative: «Je regarderai et j’écouterai»
  rationale: Le texte hébreu emploie une image corporelle qui exprime l’attention divine. La conserver respecte sa force relationnelle sans l’aplatir en paraphrase.
- issue: Rapport entre la prière et le lieu
  choice: «la prière faite en ce lieu» avec note
  alternative: «la prière de ce lieu» ou «la prière venant de ce lieu»
  rationale: Le génitif hébreu demeure sémantiquement ouvert. Le texte principal donne une formulation française naturelle, tandis que la note préserve les autres possibilités sans trancher au-delà du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme du texte hébreu et son anthropomorphisme sont conservés; la relation ambiguë entre la prière et le lieu est signalée en note.
