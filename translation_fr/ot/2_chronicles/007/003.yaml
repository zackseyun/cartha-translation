source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: fr
  text: 'Tous les Israélites[a], voyant le feu descendre et la gloire de Yahweh sur la Maison[b], s’agenouillèrent, la face contre terre, sur le dallage. Ils se prosternèrent et rendirent grâce à Yahweh : « Car il est bon, car son amour fidèle[c] demeure pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tous les fils d’Israël », expression collective qui désigne ici l’ensemble des Israélites.
    reason: lexical_alternative
  - marker: b
    text: La « Maison » désigne ici le temple.
    reason: cultural_note
  - marker: c
    text: Ou « sa bonté », « sa fidélité » ou « sa miséricorde ». Le mot hébreu חֶסֶד évoque un amour bienveillant, loyal et durable, notamment dans le cadre de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Tous les Israélites
  rationale: Littéralement « tous les fils d’Israël ». Il s’agit d’une expression collective habituelle désignant l’ensemble du peuple d’Israël ; « tous les Israélites » en transmet naturellement le sens en français moderne.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: voyant le feu descendre
  rationale: Le participe et l’infinitif avec בְּ présentent la descente du feu comme la circonstance dont ils sont témoins. Cette formulation conserve la simultanéité et le mouvement descendant.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: et la gloire de Yahweh sur la Maison
  rationale: כָּבוֹד désigne ici la manifestation glorieuse de la présence divine. בַּיִת signifie « maison » et renvoie dans ce contexte au temple ; la majuscule signale cet emploi particulier sans remplacer le terme hébreu.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: s’inclinèrent, le visage contre terre, sur le dallage
  rationale: La formulation rend la posture d’abaissement profond indiquée par כרע et אַפַּיִם אַרְצָה, tandis que « dallage » correspond à la surface pavée désignée par רִצְפָה.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: Ils se prosternèrent
  rationale: Le verbe exprime une prosternation corporelle accomplie comme acte d’adoration. Le français conserve ici le geste concret ainsi que sa portée cultuelle.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: et rendirent grâce à Yahweh
  rationale: Dans cette acclamation liturgique, ידה au hiphil exprime l’action de remercier ou de célébrer. « Rendre grâce » convient au refrain qui suit.
- source_word: כִּי טוֹב
  choice: Car il est bon
  rationale: Le sujet pronominal, implicite en hébreu, est requis en français et renvoie à Yahweh. « Car » conserve la valeur explicative de כִּי dans l’acclamation.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: car son amour fidèle demeure pour toujours
  rationale: חֶסֶד associe bonté, attachement loyal et fidélité relationnelle, souvent dans un cadre d’alliance. « Amour fidèle » maintient cette richesse, et « demeure » explicite naturellement la durée exprimée par לְעוֹלָם.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Rendu de חַסְדּוֹ dans le refrain liturgique
  choice: son amour fidèle
  alternative: sa bonté / sa fidélité / sa miséricorde
  rationale: Le terme réunit bienveillance et loyauté durable. « Amour fidèle » préserve cette amplitude sans le réduire exclusivement à la compassion ni à une notion abstraite de fidélité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque tout en séparant les gestes en deux phrases pour éviter une accumulation lourde. « Maison » conserve l’image biblique tout en étant explicitée par une note.
