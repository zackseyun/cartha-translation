  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: fr
  text: Mais si vous vous détournez et abandonnez mes prescriptions et mes commandements que j’ai placés devant vous, et si vous allez servir d’autres dieux et vous prosterner devant eux,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: vous vous détournez
  rationale: Dans ce contexte conditionnel d’infidélité, le verbe שׁוב exprime le fait de se détourner de la voie prescrite.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: « Prescriptions » distingue naturellement חֻקִּים de מִצְוֹת tout en restant clair en français moderne.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: Équivalent direct et usuel de מִצְוֹת.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: j’ai placés devant vous
  rationale: Conserve l’image hébraïque d’instructions mises devant le peuple pour guider son choix et sa conduite.
- source_word: וַעֲבַדְתֶּם
  choice: servir
  rationale: Le verbe עבד peut désigner le service cultuel; « servir » préserve ici cette portée sans la réduire au seul acte d’adoration.
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: vous prosterner
  rationale: Rend le geste concret d’inclination ou de prosternation cultuelle.
theological_decisions:
- issue: Nature de l’infidélité envisagée
  choice: Conserver séparément le service d’autres dieux et la prosternation devant eux
  alternative: Fusionner les deux expressions en « les adorer »
  rationale: L’hébreu emploie deux verbes coordonnés; les maintenir préserve la force cumulative et la dimension à la fois cultuelle et corporelle de l’idolâtrie.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « si vous » clarifie la série de verbes relevant de la même condition, tandis que la virgule finale respecte le fait que la phrase se poursuit au verset suivant.
