source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: fr
  text: 'Et ils diront : « C’est parce qu’ils ont abandonné Yahweh, le Dieu de leurs ancêtres, qui les avait fait sortir du pays d’Égypte. Ils se sont attachés à d’autres dieux[a], se sont prosternés devant eux et les ont servis. Voilà pourquoi il a fait venir sur eux tout ce malheur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont cramponnés à d’autres dieux » ou « ont embrassé d’autres dieux ». Le verbe hébreu signifie littéralement « saisir, tenir fermement » et exprime ici un attachement délibéré à des dieux étrangers.
    reason: lexical_alternative
  - marker: b
    text: Ici, « malheur » désigne une calamité ou un jugement, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Et ils diront
  rationale: Le parfait précédé de la conjonction poursuit ici la prédiction du verset précédent. Le pluriel du texte hébreu est conservé.
- source_word: עַל אֲשֶׁר
  choice: C’est parce que
  rationale: Cette tournure française naturelle exprime clairement la cause de la dévastation.
- source_word: עָזְבוּ
  choice: ont abandonné
  rationale: Le verbe exprime un délaissement grave; « abandonné » est actuel et garde la portée relationnelle et religieuse du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans l’hébreu.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: le Dieu de leurs ancêtres
  rationale: « Ancêtres » rend naturellement אבות en français moderne et maintient l’idée de continuité historique et d’alliance.
- source_word: אֲשֶׁר הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: qui les avait fait sortir du pays d’Égypte
  rationale: Le plus-que-parfait situe naturellement l’exode avant l’abandon relaté; « faire sortir » rend la forme causative de יצא.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: Ils se sont attachés à d’autres dieux
  rationale: חזק avec ב exprime ici une prise ou un attachement volontaire. « Se sont attachés » conserve ce sens sans imposer l’image peu naturelle de saisir physiquement des dieux.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: se sont prosternés devant eux
  rationale: Cette formulation préserve le geste concret d’abaissement exprimé par le verbe, sans le confondre avec le service mentionné ensuite.
- source_word: וַיַּעַבְדוּם
  choice: les ont servis
  rationale: « Servir » maintient la distinction lexicale avec le fait de se prosterner et porte naturellement un sens cultuel dans ce contexte.
- source_word: עַל כֵּן
  choice: Voilà pourquoi
  rationale: Cette locution française actuelle marque nettement la conséquence.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: il a fait venir sur eux
  rationale: La formulation rend la valeur causative du hiphil de בוא et conserve l’image hébraïque d’un malheur amené sur les personnes.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: tout ce malheur
  rationale: Dans ce contexte de jugement et de dévastation, רעה désigne une calamité, non le mal moral.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: L’hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre; elle suit aussi la convention indiquée par la couche de consultation du projet.
- issue: Nature de רעה dans la conséquence du jugement
  choice: malheur
  alternative: mal
  rationale: Le contexte parle de la catastrophe infligée au pays. « Malheur » évite de suggérer que Dieu aurait produit le mal moral.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour la lisibilité, sans modifier les relations logiques du texte. « Yahweh » est conservé comme nom propre selon la convention du projet; « ancêtres » est préféré à « pères », plus ambigu en français courant.
