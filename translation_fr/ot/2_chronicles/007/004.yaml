lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Puis le roi
  rationale: La conjonction וְ poursuit le récit et marque ici naturellement la succession; « Puis » convient au français narratif.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: עָם désigne couramment le peuple; l’expression englobe ici la population rassemblée avec le roi.
- source_word: זֹבְחִים זֶבַח
  choice: offrirent des sacrifices
  rationale: Le participe prédicatif décrit l’action en cours dans la scène, tandis que la construction apparentée « sacrifier un sacrifice » est rendue par une expression française naturelle. Le passé simple convient à la narration historique et n’exclut pas la durée de l’action.
- source_word: לִפְנֵי
  choice: devant
  rationale: לִפְנֵי signifie « devant, en présence de »; « devant » conserve avec concision l’idée d’un acte accompli en présence de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, sans lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans lourdeur; la note conserve la particularité de la construction hébraïque.
