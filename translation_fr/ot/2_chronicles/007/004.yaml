  text: Puis le roi et tout le peuple offrirent des sacrifices devant Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « sacrifiaient un sacrifice », tournure construite sur deux mots de même racine et signifiant qu’ils offraient des sacrifices.'
