id: 2CH.7.2
reference: 2 Chronicles 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: fr
  text: Les prêtres ne pouvaient pas entrer dans la maison de Yahweh[a], car la gloire de Yahweh remplissait la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de Yahweh », c’est-à-dire le temple. La traduction conserve « maison » pour refléter la formulation hébraïque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: ne pouvaient pas
  rationale: Rend naturellement en français la négation et le verbe יכל exprimant l’incapacité, sans préciser la nature de l’empêchement.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis dans le contexte du culte au temple.
- source_word: לָבוֹא אֶל
  choice: entrer dans
  rationale: Dans ce contexte spatial, בוא avec אֶל exprime l’entrée dans un lieu; cette tournure est naturelle en français.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Préserve l’image hébraïque de la « maison » ainsi que le nom divin, plutôt que de remplacer l’expression par « temple ».
- source_word: כִּי
  choice: car
  rationale: Introduit clairement la cause de l’incapacité des prêtres dans un registre narratif digne et courant.
- source_word: מָלֵא
  choice: remplissait
  rationale: L’imparfait décrit l’état qui empêchait alors l’entrée des prêtres, sans imposer artificiellement une valeur aspectuelle plus précise.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: Reproduit clairement la relation construite de l’hébreu et conserve la terminologie biblique usuelle.
- source_word: אֶת בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Maintient la répétition intentionnelle de l’expression hébraïque au lieu de varier stylistiquement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël; « Yahweh » le distingue d’un simple titre et suit directement la donnée hébraïque.
- issue: Sens de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: « Maison » conserve la formulation et l’image théologique de l’hébreu, tandis que la note précise qu’il s’agit du temple.
translation_notes:
  register: Français international moderne, clair et digne. La coordination initiale וְ n’est pas rendue séparément, conformément au déroulement naturel du récit en français. La répétition de « la maison de Yahweh » est volontairement conservée.
