  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: fr
  text: Ainsi, Salomon acheva la maison de Yahweh et la maison du roi[a], et il mena à bien[c] tout ce qu’il avait à cœur[b] de faire dans la maison de Yahweh et dans sa propre maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le palais royal ». Littéralement : « la maison du roi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout ce qui vint sur le cœur de Salomon », expression qui désigne ses intentions ou ses désirs.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « il réussit » ou « il fit réussir ». Le verbe hébreu peut exprimer le fait de réussir ou de faire réussir quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: acheva
  rationale: Le verbe כלה, dans cette forme narrative, exprime l’achèvement des deux constructions. « Acheva » est naturel et soutenu en français.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve le terme concret בית, « maison », ainsi que le nom divin יהוה sous la forme « Yahweh ».
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Cette formulation littérale préserve la répétition de « maison » dans l’hébreu; le référent probable, le palais royal, est indiqué en note.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: tout ce qu’il avait à cœur
  rationale: Cette expression française idiomatique conserve l’image du cœur tout en exprimant naturellement les projets ou intentions de Salomon.
- source_word: לַעֲשׂוֹת
  choice: de faire
  rationale: Le verbe עשה a ici son sens large de faire ou réaliser les travaux projetés.
- source_word: וּבְבֵיתוֹ
  choice: dans sa propre maison
  rationale: « Sa propre maison » rend explicite que le suffixe renvoie à Salomon et distingue cette maison de celle de Yahweh.
- source_word: הִצְלִיחַ
  choice: Il mena à bien
  rationale: Le hiphil de צלח peut signifier réussir ou faire réussir. Dans le contexte de travaux achevés, « mener à bien » exprime leur réalisation réussie sans imposer le sens plus général de prospérité.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de הִצְלִיחַ
  choice: Il mena à bien tout ce qu’il avait à cœur de faire
  alternative: il réussit / il fit prospérer
  rationale: La syntaxe permet de comprendre le verbe comme la réussite de Salomon dans l’exécution de ses projets ou comme le fait de les faire réussir. La formulation retenue respecte cette idée de réussite pratique sans lui attribuer une prospérité générale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « maison » est conservée pour refléter le texte hébreu, tandis que l’idiome du cœur est rendu par l’expression française naturelle « avoir à cœur ». La seconde phrase allège la longue coordination hébraïque sans en modifier les rapports de sens.
