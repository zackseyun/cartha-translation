  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: fr
  text: 'alors j’affermirai le trône de ton royaume, comme j’ai conclu une alliance avec David, ton père, en disant : « Tu ne manqueras pas d’un homme pour gouverner Israël[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Un homme exerçant le pouvoir sur Israël ne te sera pas retranché. »'
    reason: Rend compte de l’image de « retranchement » dans l’expression hébraïque, dont le sens dynastique est formulé idiomatiquement dans le texte.
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: alors j’affermirai
  rationale: Le hifil de קום signifie ici faire tenir, établir ou affermir. « Alors » explicite naturellement l’apodose conditionnelle liée au verset précédent.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: le trône de ton royaume
  rationale: Cette formulation conserve les deux noms de la chaîne construite hébraïque, sans réduire l’expression à « ton trône royal ».
- source_word: כַּאֲשֶׁר כָּרַתִּי לְדָוִיד אָבִיךָ
  choice: comme je m’y suis engagé envers David, ton père
  rationale: כרת a ici sa valeur d’engagement d’alliance. Comme le nom « alliance » n’est pas exprimé dans ce verset, « je m’y suis engagé » rend cette force sans ajouter un complément nominal absent de l’hébreu.
- source_word: לֹא יִכָּרֵת לְךָ
  choice: ne sera retranché de ta lignée
  rationale: Le nifal de כרת conserve l’image d’être retranché. « De ta lignée » exprime en français le sens dynastique du datif לְךָ, qui serait obscur avec un calque tel que « retranché de toi ».
- source_word: אִישׁ מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: aucun homme exerçant le pouvoir sur Israël
  rationale: אִישׁ est masculin singulier et désigne un successeur dynastique. Le participe מוֹשֵׁל indique l’exercice du pouvoir; avec משל, בְּיִשְׂרָאֵל se rend naturellement par « sur Israël ».
theological_decisions:
- issue: Formulation de la promesse dynastique
  choice: « Aucun homme exerçant le pouvoir sur Israël ne sera retranché de ta lignée »
  alternative: « Tu ne manqueras jamais d’un homme pour gouverner Israël »
  rationale: Le texte principal préserve l’image hébraïque de la retranchement ainsi que la portée dynastique, sans préciser davantage la manière dont la promesse doit s’accomplir. La note fournit le sens idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse divine singulière à Salomon. « Père » est conservé dans son sens ancestral et dynastique.
