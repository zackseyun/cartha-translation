source:
  edition: WLC
  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: fr
  text: si mon peuple[a], qui porte mon nom, s’humilie, prie, cherche ma présence et se détourne de ses mauvaises voies, alors moi, j’entendrai depuis le ciel, je pardonnerai son péché et je guérirai son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur lequel mon nom est appelé ». Cet idiome hébreu désigne un peuple qui porte le nom de Dieu et lui appartient.'
    reason: Précise la forme littérale et le sens relationnel de l’idiome sans alourdir le texte courant.
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: s’humilie
  rationale: Le niphal de כנע exprime ici l’abaissement volontaire du peuple dans une série de conditions. Le singulier convient au nom collectif « peuple ».
- source_word: עַמִּי
  choice: mon peuple
  rationale: Désignation collective et relationnelle directe, conservée naturellement en français.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: sur lequel mon nom est invoqué
  rationale: Cette formulation reste proche de l’idiome hébreu et exprime que le peuple porte le nom de Dieu et lui appartient, sans le réduire au simple fait d’être nommé.
- source_word: וְיִתְפַּלְלוּ
  choice: prie
  rationale: Le hitpael de פלל signifie couramment « prier »; le destinataire est clair dans le contexte et n’a pas besoin d’être ajouté.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: recherche ma face
  rationale: Conserve la métaphore hébraïque de la face, qui évoque la présence et la faveur divines.
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: se détourne de ses mauvaises voies
  rationale: שׁוב marque ici un changement de direction morale. « Voies » préserve l’image du comportement habituel.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: alors moi, j’écouterai depuis le ciel
  rationale: « Alors » explicite l’apodose implicite dans l’enchaînement hébreu; « moi » rend le pronom emphatique וַאֲנִי, et « depuis le ciel » reflète מן.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: je pardonnerai son péché
  rationale: Le singulier hébreu est préservé comme collectif; les pronoms au singulier s’accordent avec « peuple » en français.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: je guérirai son pays
  rationale: « Guérir » maintient la métaphore explicite de רפא. « Pays » exprime ici la terre habitée du peuple plus naturellement que « sol ».
theological_decisions:
- issue: Structure conditionnelle de la réponse divine
  choice: Introduire la protase par « si » et l’apodose par « alors »
  alternative: Coordonner toutes les propositions par « et »
  rationale: Dans ce contexte, les imparfaits coordonnés forment clairement une condition suivie de la réponse divine. La structure française rend cette relation sans modifier sa portée.
- issue: Idiome du nom divin
  choice: « sur lequel mon nom est invoqué »
  alternative: « qui porte mon nom » ou « qui est appelé de mon nom »
  rationale: Le choix retient la forme passive et l’image de עַל tout en laissant entendre l’identification et l’appartenance à Dieu; une note explicite l’idiome.
- issue: Portée historique de « mon peuple » et « son pays »
  choice: Ne pas élargir ni restreindre explicitement les référents dans le corps du verset
  alternative: Actualiser directement en visant tout peuple croyant ou préciser « Israël »
  rationale: Le contexte de 2 Chroniques concerne le peuple de Dieu et son pays, mais le verset lui-même emploie les expressions générales données. La traduction conserve cette tension contextuelle sans imposer une application doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le rythme en trois mouvements est conservé : humiliation et prière, recherche et conversion, puis écoute, pardon et guérison de la part de Dieu. Le singulier grammatical est maintenu après le collectif « peuple ».'
