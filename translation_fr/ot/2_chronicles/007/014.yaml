review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle, les verbes de réponse humaine et la réponse divine sont globalement bien rendus. Une formulation plus idiomatique du syntagme « chercher ma face » est préférable en français courant, tout en préservant l’image en note. L’idiome du nom appelé sur le peuple est mieux rendu dans le texte par son sens d’identification et d’appartenance.
  naturalness: « Rechercher ma face » et « sur lequel mon nom est invoqué » sont des calques peu naturels en français international moderne. « Cherche ma présence » et « qui porte mon nom » sont fluides, dignes et fidèles au sens contextuel. « Entendrai depuis le ciel » convient mieux que « écouterai » dans le contexte d’une prière entendue.
  terminology: « Mon peuple », « s’humilie », « mauvaises voies », « pardonnerai son péché » et « guérirai son pays » conservent adéquatement le registre et les images du texte. « Porte mon nom » exprime sans surcharge doctrinale l’idiome hébreu; la note en donne la forme littérale.
  issues:
  - severity: medium
    issue: Calques peu naturels des idiomes « rechercher ma face » et « sur lequel mon nom est invoqué »
    rationale: Ces expressions sont compréhensibles, mais elles sonnent artificielles en français moderne. Le premier idiome désigne la recherche de la présence ou de la faveur divine; le second l’appartenance et l’identification au nom de Dieu.
  - severity: low
    issue: « J’écouterai depuis le ciel »
    rationale: Dans ce contexte, où Dieu répond à la prière, « entendre » est le verbe français plus naturel et correspond au sens de שמע sans suggérer seulement une écoute attentive.
