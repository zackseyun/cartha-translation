source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: fr
  text: Quant à toi, si tu marches devant moi comme ton père David a marché, en faisant tout ce que je t’ai commandé, et que tu observes mes prescriptions et mes décisions[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes ordonnances ».
    reason: Variante lexicale possible pour וּמִשְׁפָּטַי, avec une nuance davantage réglementaire que judiciaire.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quant à toi
  rationale: Le pronom placé en tête avec la conjonction marque une adresse directe et emphatique à Salomon ainsi qu’un déplacement du discours.
- source_word: תֵּלֵךְ לְפָנַי
  choice: tu marches devant moi
  rationale: Cette formulation conserve l’image biblique de la marche tout en exprimant une conduite vécue dans la présence de Dieu.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: comme ton père David a marché
  rationale: La répétition de « marcher » maintient le parallèle explicite du texte hébreu.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: en faisant tout ce que je t’ai commandé
  rationale: Le gérondif rend la valeur circonstancielle de l’infinitif construit et rattache l’obéissance à la manière de marcher devant Dieu.
- source_word: חֻקַּי
  choice: mes prescriptions
  rationale: « Prescriptions » convient au contexte légal et cultuel tout en restant distinct du terme suivant.
- source_word: וּמִשְׁפָּטַי
  choice: mes décisions
  rationale: Le mot conserve la nuance judiciaire de מִשְׁפָּטִים; « ordonnances » reste une autre traduction possible.
- source_word: תִּשְׁמֹר
  choice: tu observes
  rationale: Dans un contexte d’alliance, « observer » exprime naturellement le respect actif des prescriptions divines.
theological_decisions:
- issue: Rendre la condition d’obéissance liée à l’alliance sans introduire une théologie du mérite
  choice: 'Conserver explicitement la structure conditionnelle : « si tu marches… en faisant… et que tu observes… »'
  alternative: Paraphraser par une fidélité générale ou atténuer la condition
  rationale: Le verset adresse à Salomon une véritable condition d’alliance. La traduction la maintient sans l’expliquer ni la réduire selon un système théologique extérieur au texte.
translation_notes:
  register: Français international moderne, digne et accessible. L’image biblique de la marche est conservée; « et que » prolonge naturellement en français l’unique condition introduite par « si ». La virgule finale signale que la phrase se poursuit au verset suivant.
