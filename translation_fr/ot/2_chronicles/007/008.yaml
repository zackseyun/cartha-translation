  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: fr
  text: 'À cette époque, Salomon célébra la fête pendant sept jours avec tout Israël : une très grande assemblée, de Lebo-Hamath[a] jusqu’au torrent d’Égypte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’entrée de Hamath ». L’hébreu peut être compris soit comme un nom de lieu (« Lebo-Hamath »), soit comme une expression désignant la voie d’accès à Hamath.
    reason: alternative_reading
  - marker: b
    text: Ou « jusqu’au ouadi d’Égypte ». Le mot hébreu peut désigner un cours d’eau saisonnier ou son lit plutôt qu’un grand fleuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: célébra
  rationale: Avec חָג, le verbe « faire » prend naturellement le sens idiomatique de célébrer une fête.
- source_word: הֶחָג
  choice: la fête
  rationale: חָג désigne une fête, notamment une fête de pèlerinage. « La fête » est simple, digne et conserve l’article défini.
- source_word: בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Rend naturellement l’indication temporelle sans préciser indûment une saison.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Exprime clairement en français la durée de la célébration.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: et tout Israël avec lui
  rationale: Conserve le sens collectif d’Israël ainsi que l’idée d’accompagnement.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: une très grande assemblée
  rationale: « Assemblée » rend קָהָל sans connotation ecclésiastique excessive, et « très grande » conserve l’intensification de מְאֹד.
- source_word: מִלְּבוֹא חֲמָת
  choice: depuis Lebo-Hamath
  rationale: Traite l’expression comme un toponyme ou une désignation géographique fixe, tout en signalant l’autre compréhension possible en note.
- source_word: עַד נַחַל מִצְרַיִם
  choice: jusqu’au torrent d’Égypte
  rationale: נַחַל désigne souvent un cours d’eau temporaire ou un lit de torrent plutôt qu’un grand fleuve. « Torrent » reste naturel et géographiquement approprié en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « venue depuis… jusqu’à… » rattache naturellement les limites géographiques à l’assemblée sans modifier le sens. Les marqueurs de note sont placés sur les expressions géographiques auxquelles les notes se rapportent.
