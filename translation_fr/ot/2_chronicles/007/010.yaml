  text: וּ/בְ/י֨וֹם עֶשְׂרִ֤ים וּ/שְׁלֹשָׁה֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י שִׁלַּ֥ח אֶת הָ/עָ֖ם לְ/אָהֳלֵי/הֶ֑ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣יד וְ/לִ/שְׁלֹמֹ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: fr
  text: Le vingt-troisième jour du septième mois, il renvoya le peuple à ses tentes[a]. Tous partirent dans la joie et le cœur heureux à cause du bien que Yahweh avait fait à David, à Salomon et à Israël, son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez eux »; littéralement « à leurs tentes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Le vingt-troisième jour du septième mois
  rationale: Formulation française naturelle de la date; la conjonction narrative initiale n’a pas besoin d’être rendue mécaniquement.
- source_word: שִׁלַּח אֶת־הָעָם
  choice: il renvoya le peuple
  rationale: Dans le contexte de la fin de l’assemblée, le piel de שלח signifie que le roi congédia le peuple et le laissa repartir.
- source_word: לְאָהֳלֵיהֶם
  choice: à ses tentes
  rationale: Le texte hébreu conserve l’image concrète des « tentes »; le possessif singulier s’accorde naturellement en français avec le collectif « peuple ».
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: Tous partirent dans la joie et le cœur heureux
  rationale: La formulation restitue l’état du peuple au moment de son départ, tout en conservant l’image hébraïque du cœur.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: à cause du bien que … avait fait
  rationale: Cette traduction directe et idiomatique garde le substantif singulier « le bien » et le sens courant de עשה, « faire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: à David, à Salomon et à Israël, son peuple
  rationale: La répétition de « à » représente les bénéficiaires introduits par ל; la virgule marque l’apposition « son peuple ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Portée du bien accompli pour David, Salomon et Israël
  choice: Conserver les trois bénéficiaires coordonnés sans préciser davantage la nature du bien
  alternative: Expliciter des bénédictions particulières pour chacun
  rationale: Le verset laisse « le bien » global et ne répartit pas précisément ses manifestations; la traduction préserve cette latitude.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée en deux phrases pour éviter que des participes détachés ne semblent décrire le roi plutôt que le peuple. Le nom « Yahweh » est conservé.
