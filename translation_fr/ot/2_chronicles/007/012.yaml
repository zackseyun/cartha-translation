  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: fr
  text: 'Puis Yahvé apparut à Salomon de nuit[a] et lui dit : « J’ai entendu ta prière et j’ai choisi ce lieu pour moi comme maison de sacrifices[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nuit » ou « pendant la nuit ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour une maison de sacrifice » ; c’est-à-dire un lieu consacré au culte sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation à Salomon. « Apparut » est naturel en français et conserve la portée théophanique sans préciser indûment la manière de l’apparition.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre. « Yahvé » est la forme française courante du nom divin.
- source_word: בַּלָּיְלָה
  choice: pendant la nuit
  rationale: Cette expression situe l’apparition au cours de la nuit. Elle est naturelle en français et laisse aussi possible le sens plus général « de nuit ».
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le parfait hébreu présente l’action comme accomplie et pertinente pour la réponse qui suit. Le passé composé convient naturellement au discours direct français.
- source_word: תְּפִלָּתֶךָ
  choice: ta prière
  rationale: « Prière » rend directement le nom תְּפִלָּה, et le tutoiement correspond à l’adresse divine au singulier.
- source_word: וּבָחַרְתִּי
  choice: et j’ai choisi
  rationale: Le passé composé est parallèle à « J’ai entendu » et exprime une décision accomplie dont les effets demeurent.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ce lieu
  rationale: « Ce lieu » désigne sobrement l’emplacement du temple qui vient d’être consacré.
- source_word: לִי
  choice: pour moi
  rationale: Le datif exprime l’appartenance ou la destination divine. « Pour moi » reste proche de l’hébreu sans suraccentuer le pronom.
- source_word: לְבֵית זָבַח
  choice: comme maison de sacrifices
  rationale: La tournure conserve l’image littérale de la « maison » et indique sa destination cultuelle. Le pluriel français rend naturellement le nom singulier à valeur collective dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par un nom propre préserve la distinction entre le nom divin et un titre.
- issue: Fonction du lieu choisi
  choice: comme maison de sacrifices
  alternative: pour être une maison de sacrifices
  rationale: La préposition לְ peut marquer la destination ou la fonction. « Comme » exprime cette désignation sans transformer explicitement le lieu en un terme interprétatif tel que « temple ».
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé est privilégié dans la parole directe, tandis que le passé simple « apparut » maintient le registre narratif biblique sans archaïsme marqué. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
