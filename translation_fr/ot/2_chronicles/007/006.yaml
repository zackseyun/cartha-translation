  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: fr
  text: Les prêtres se tenaient à leurs postes, et les lévites, avec les instruments destinés au chant pour Yahweh, que le roi David avait fabriqués afin de rendre grâce à Yahweh, car son amour fidèle subsiste pour toujours, lorsque David louait par leur intermédiaire ; les prêtres sonnaient des trompettes en face d’eux, tandis que tout Israël se tenait debout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: à leurs postes
  rationale: Le nom désigne ici les places ou fonctions assignées aux prêtres dans le service ordonné du temple. « À leurs postes » exprime naturellement leur position de service.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: avec les instruments destinés au chant pour Yahweh
  rationale: Cette formulation garde le lien entre les instruments, le chant et Yahweh sans trancher entièrement entre des instruments appartenant au culte de Yahweh et des instruments servant à exécuter un chant qui lui est adressé.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: afin de rendre grâce à Yahweh
  rationale: Dans ce contexte, le hiphil de ידה introduit une action de grâce, confirmée par la formule cultuelle qui suit.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: car son amour fidèle subsiste pour toujours
  rationale: חֶסֶד associe bonté, attachement et fidélité durable. « Amour fidèle » en conserve l'étendue, tandis que « subsiste » explicite naturellement en français le verbe sous-entendu en hébreu.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: quand David faisait monter la louange par leur intermédiaire
  rationale: 'La construction hébraïque est condensée : David est lié à l''acte de louer, effectué « par leur main ». La traduction maintient son rôle tout en rendant compréhensible l''intervention des lévites comme agents ou exécutants.'
- source_word: מחצצרים
  choice: sonnaient des trompettes
  rationale: Le verbe désigne précisément l'action de faire retentir des trompettes ; cette expression est idiomatique en français.
- source_word: נֶגְדָּם
  choice: en face d’eux
  rationale: La préposition indique une position vis-à-vis d'eux, devant ou en face d'eux, sans exiger une nuance cérémonielle supplémentaire.
- source_word: עֹמְדִים
  choice: se tenaient / se tenait debout
  rationale: Les participes décrivent une posture continue au cours de la cérémonie. La variation française évite une répétition trop lourde tout en conservant cet aspect duratif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de lui substituer un titre.
- issue: Sens de חֶסֶד
  choice: amour fidèle
  alternative: bonté / miséricorde
  rationale: « Amour fidèle » garde ensemble la bienveillance et la constance relationnelle du terme sans le réduire à la seule compassion.
- issue: Rôle de David dans la louange
  choice: David faisait monter la louange par leur intermédiaire
  alternative: les lévites exécutaient la louange composée par David
  rationale: L'hébreu attribue grammaticalement l'action à David tout en indiquant l'intermédiaire des lévites. La traduction ne transforme donc pas explicitement la louange en composition, possibilité plausible mais non énoncée sans ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le déroulement cérémoniel de l'hébreu, avec une ponctuation qui clarifie les groupes syntaxiques sans transformer explicitement la formule d'action de grâce en citation directe.
