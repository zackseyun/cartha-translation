revisions:
- from: Les prêtres se tenaient à leurs postes, et les lévites se tenaient avec les instruments destinés au chant pour Yahweh[a], que le roi David avait fabriqués afin de rendre grâce à Yahweh, car son amour fidèle subsiste pour toujours[b], quand David faisait monter la louange par leur intermédiaire[c]. Les prêtres sonnaient des trompettes en face d’eux, tandis que tout Israël se tenait debout.
  to: Les prêtres se tenaient à leurs postes, et les lévites, avec les instruments destinés au chant pour Yahweh, que le roi David avait fabriqués afin de rendre grâce à Yahweh, car son amour fidèle subsiste pour toujours, lorsque David louait par leur intermédiaire ; les prêtres sonnaient des trompettes en face d’eux, tandis que tout Israël se tenait debout.
  rationale: La révision remplace une expression interprétative par « lorsque David louait par leur intermédiaire », qui rend le verbe « louer » et maintient l’ambiguïté quant au rôle précis des lévites. Elle rend aussi la mention des lévites appositionnelle, conformément à l’ellipse syntaxique de l’hébreu. Les ancres de notes sont à conserver après « Yahweh » (a), « toujours » (b) et « intermédiaire » (c).
  reviewer_model: gpt-5.6-terra
