  to: Salomon consacra le milieu de la cour devant la maison de Yahweh, car c’est là qu’il offrit les holocaustes et les parties grasses des sacrifices de paix. En effet, l’autel de bronze que Salomon avait fait ne pouvait contenir l’holocauste, l’offrande de céréales et les parties grasses.
