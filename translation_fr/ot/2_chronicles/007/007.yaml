  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: fr
  text: Salomon consacra le milieu de la cour devant la maison de Yahweh, car c’est là qu’il offrit les holocaustes et les parties grasses des sacrifices de paix. En effet, l’autel de bronze que Salomon avait fait ne pouvait contenir l’holocauste, l’offrande de céréales et les parties grasses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: consacra
  rationale: Le hiphil de קדשׁ indique ici qu’un espace est affecté à un usage sacré. « Consacra » est naturel et conserve la portée cultuelle.
- source_word: תּוֹךְ הֶחָצֵר
  choice: le milieu de la cour
  rationale: תּוֹךְ désigne le milieu ou la partie centrale. Le choix garde cette précision spatiale sans réduire l’expression à la cour entière.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: devant la maison de Yahweh
  rationale: לִפְנֵי est spatial ici. « Maison » reproduit l’image hébraïque usuelle du sanctuaire, et Yahweh transcrit le nom divin.
- source_word: עָשָׂה שָׁם
  choice: c’est là qu’il offrit
  rationale: Dans ce contexte sacrificiel, עשה signifie idiomatiquement accomplir ou offrir les sacrifices, plutôt que simplement « faire ».
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: les holocaustes / l’holocauste
  rationale: « Holocaustes » est le terme cultuel français établi pour les sacrifices entièrement brûlés. L’alternance pluriel-singulier de l’hébreu est conservée.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: les graisses des sacrifices de paix
  rationale: חלב désigne les parties grasses réservées au sacrifice. « Sacrifices de paix » conserve le terme cultuel traditionnel sans imposer une interprétation unique de שְׁלָמִים.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: Dans le contexte du mobilier cultuel, « bronze » est la désignation française moderne la plus naturelle pour נחשת.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: ne pouvait contenir
  rationale: הכיל exprime la capacité de recevoir ou de contenir; la formulation montre que l’autel était insuffisant pour le volume des offrandes.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans le vocabulaire sacrificiel, מִנְחָה désigne l’offrande végétale, généralement composée de farine ou de céréales.
- source_word: הַחֲלָבִים
  choice: les graisses
  rationale: Le pluriel vise les parties grasses sacrificielles. Dans cette liste cultuelle, « les graisses » est clair et concis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » préserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Le terme peut évoquer paix, bien-être ou communion. « Sacrifices de paix » garde une désignation cultuelle traditionnelle et laisse subsister cette richesse sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée en deux phrases pour éviter l’enchaînement pesant de deux causales, tout en maintenant leur rapport logique. Aucun marqueur de note n’est nécessaire puisque le texte ne comporte aucune note.
