source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: fr
  text: Le huitième jour, ils tinrent une assemblée solennelle[a], car ils avaient célébré[b] pendant sept jours la dédicace de l’autel, et pendant sept jours la fête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une assemblée » ou « une assemblée de clôture ». Le terme hébreu désigne un rassemblement particulier qui conclut une fête religieuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « observé » ; plus littéralement, « fait ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Rend directement l’expression temporelle sans préciser de quelle fête il s’agit, précision absente du verset hébreu.
- source_word: עֲצָרֶת
  choice: assemblée solennelle
  rationale: Le nom désigne ici un rassemblement sacré particulier qui clôt la période festive. « Assemblée solennelle » en conserve la portée religieuse tout en restant clair en français moderne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de la tenue de l’assemblée du huitième jour.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: la dédicace de l’autel
  rationale: Cette expression désigne la cérémonie inaugurale par laquelle l’autel est affecté au culte. « Dédicace » est précis et idiomatique dans ce contexte.
- source_word: עָשׂוּ
  choice: avaient célébré
  rationale: Le verbe signifie littéralement « faire », mais prend ici le sens d’accomplir ou de célébrer une observance religieuse. Le plus-que-parfait exprime naturellement en français que ces sept jours précèdent l’assemblée du huitième jour.
- source_word: וְהֶחָג
  choice: et … la fête
  rationale: « La fête » respecte l’article défini hébreu sans ajouter dans le texte le nom précis de la fête fourni par le contexte.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette formulation française exprime clairement la durée associée à chacune des deux célébrations.
theological_decisions: []
