source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: fr
  text: Si je ferme le ciel pour qu’il n’y ait pas de pluie[a], si j’ordonne aux criquets de dévorer le pays, ou si j’envoie une épidémie parmi mon peuple[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire le début ainsi : « Quand je ferme le ciel… » La particule hébraïque peut aussi être rendue, plus littéralement, par « voici, si » ou « si vraiment ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « une peste ». Le terme hébreu désigne une épidémie meurtrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Si
  rationale: Dans ce contexte, la particule introduit une situation éventuelle qui forme la première partie d’une construction conditionnelle poursuivie au verset suivant. « Si » est naturel en français et respecte cette fonction.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: je ferme le ciel
  rationale: Le verbe exprime littéralement l’action de retenir ou fermer. Avec « le ciel », il évoque concrètement l’arrêt de la pluie. Le singulier collectif « le ciel » est plus idiomatique en français moderne que « les cieux » dans ce contexte météorologique.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: pour qu’il ne pleuve plus
  rationale: Cette formulation rend clairement le résultat visé par la fermeture du ciel, dans un français courant, sans perdre le sens de l’absence de pluie.
- source_word: וְהֵן
  choice: si
  rationale: La particule introduit une deuxième situation éventuelle parallèle. La répétition de « si » clarifie en français la structure conditionnelle.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: j’ordonne aux criquets
  rationale: חָגָב est un singulier collectif. Le pluriel français « aux criquets » transmet naturellement l’idée d’une invasion tout en conservant l’action directe de Dieu.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: de dévorer le pays
  rationale: « Dévorer » exprime la consommation destructrice des cultures par les criquets. Ici, הָאָרֶץ désigne le territoire ou pays concerné, et non la terre entière.
- source_word: וְאִם
  choice: ou si
  rationale: Cette expression introduit la troisième possibilité et rend explicitement l’alternative présente dans la série.
- source_word: אֲשַׁלַּח דֶּבֶר
  choice: j’envoie une épidémie
  rationale: דֶּבֶר désigne une maladie épidémique meurtrière, souvent dans un contexte de jugement. « Une épidémie » est précis et immédiatement compréhensible en français moderne.
- source_word: בְּעַמִּי
  choice: parmi mon peuple
  rationale: La préposition situe le mal au sein du peuple. « Parmi » est l’équivalent français le plus naturel.
theological_decisions:
- issue: Présentation des jugements divins comme situations conditionnelles
  choice: Employer « Si… si… ou si… » en maintenant Dieu comme sujet direct de chaque action.
  alternative: Employer « Quand… ou… ou… », ou ouvrir par « Voici, si… ».
  rationale: Les particules hébraïques présentent plusieurs situations possibles, tandis que la réponse conditionnelle se poursuit au verset suivant. La formulation retenue préserve à la fois leur caractère conditionnel et l’affirmation explicite de l’action divine, sans atténuer la tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Le ciel » et « une épidémie » évitent des archaïsmes, tandis que « dévorer le pays » conserve la force imagée et le ton solennel du passage. La virgule finale signale que la phrase conditionnelle se poursuit au verset suivant.
