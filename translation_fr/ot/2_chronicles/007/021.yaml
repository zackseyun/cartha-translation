  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: fr
  text: 'Cette maison[a], qui était élevée : tous ceux qui passeront devant elle seront stupéfaits[b] et demanderont : « Pourquoi Yahweh a-t-il agi ainsi envers ce pays et cette maison ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « temple ». Littéralement, « maison »; il s’agit ici du temple.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut évoquer la stupeur horrifiée devant une dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Cette maison
  rationale: Le nom בַּיִת signifie littéralement « maison » et désigne ici le temple. Conserver « maison » maintient l’expression hébraïque et sa portée religieuse.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: qui était élevée
  rationale: עֶלְיוֹן exprime ici la hauteur, la prééminence ou la grandeur passée de la maison. « Élevée » préserve cette gamme de sens sans la réduire à la hauteur physique.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: frappera de stupeur tous ceux qui passeront près d’elle
  rationale: Dans cette construction, יִשֹּׁם évoque la stupeur horrifiée provoquée par la dévastation. La formulation française rend naturellement la réaction de chaque passant tout en gardant la maison comme point de départ syntaxique.
- source_word: וְאָמַר
  choice: Ils demanderont
  rationale: Le singulier hébreu se rapporte distributivement à « tous ceux qui passeront ». Le pluriel est naturel en français, et « demanderont » introduit clairement la question qui suit.
- source_word: בַּמֶּה עָשָׂה
  choice: Pourquoi … a-t-il traité ainsi
  rationale: בַּמֶּה signifie idiomatiquement « pourquoi ? ». Avec deux compléments introduits par ל, « traiter ainsi » rend plus naturellement en français l’action exercée contre le pays et la maison que le simple verbe « faire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme explicite du texte hébreu.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: ce pays et cette maison
  rationale: אֶרֶץ désigne ici le territoire concerné par le jugement; « pays » est naturel dans ce contexte. La répétition de « maison » maintient la cohérence lexicale du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom personnel divin. Sa translittération le distingue des titres et préserve sa fonction d’alliance.
- issue: Nature de la réaction exprimée par יִשֹּׁם
  choice: la maison frappera les passants de stupeur
  alternative: la maison deviendra un objet d’horreur / les passants seront horrifiés
  rationale: Le verbe associe dévastation et effroi. Le choix retenu conserve l’effet produit sur les passants sans limiter le terme à la seule ruine matérielle.
translation_notes:
  register: Français international moderne, digne et accessible. « Frapper de stupeur » garde la solennité du jugement sans archaïsme; « traiter ainsi » produit une question idiomatique tout en conservant l’ambiguïté quant aux formes précises du jugement.
