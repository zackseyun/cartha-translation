source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: fr
  text: Lorsque Salomon eut fini de prier, le feu descendit du ciel et consuma l’holocauste et les sacrifices, et la gloire de Yahweh remplit la maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le temple; hébreu « la maison ».
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: Lorsque Salomon eut fini de prier
  rationale: La construction temporelle avec כְּ et l’infinitif construit de כלה marque l’achèvement de la prière avant l’action principale. Le passé antérieur exprime naturellement cette antériorité dans un récit soutenu.
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  choice: le feu descendit du ciel
  rationale: L’article défini est conservé, et « descendit du ciel » rend directement le mouvement exprimé par ירד et l’origine céleste.
- source_word: וַתֹּאכַל
  choice: consuma
  rationale: Avec le feu comme sujet, « consumer » est l’équivalent français idiomatique du verbe signifiant littéralement « manger ».
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Dans le vocabulaire sacrificiel biblique, עֹלָה désigne l’offrande entièrement brûlée; « holocauste » est le terme français traditionnel et précis dans ce contexte.
- source_word: וְהַזְּבָחִים
  choice: et les sacrifices
  rationale: Le pluriel זְבָחִים désigne ici des sacrifices distincts de l’holocauste déjà mentionné.
- source_word: וּכְבוֹד יְהוָה
  choice: et la gloire de Yahweh
  rationale: כָּבוֹד désigne la gloire divine manifestée, tandis que le nom propre יהוה est translittéré « Yahweh ».
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: remplit la Maison
  rationale: Le sens littéral de בַּיִת, « maison », est conservé. La majuscule signale dans ce contexte qu’il s’agit de la demeure cultuelle de Yahweh sans remplacer le mot hébreu par « Temple ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre plutôt que de lui substituer un titre.
- issue: Référent de הַבָּיִת
  choice: la Maison
  alternative: le Temple; la maison
  rationale: L’hébreu dit littéralement « la maison », mais le contexte désigne le Temple. « la Maison », accompagnée d’une note, préserve à la fois la formulation source et la clarté référentielle.
translation_notes:
  register: Français moderne, digne et narratif. Le passé antérieur dans la subordonnée et le passé simple dans la principale conviennent au récit biblique écrit. La formulation reste proche de l’hébreu tout en étant naturelle.
