  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: fr
  text: alors je les arracherai de ma terre que je leur ai donnée, et cette maison[a], que j’ai consacrée à mon nom, je la rejetterai loin de moi[b] ; j’en ferai un proverbe et un sujet de raillerie[c] parmi tous les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ce Temple ». Littéralement : « cette maison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je la jetterai de devant ma face ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « une parole mordante » ; le terme hébreu peut désigner une formule de mépris ou ce qui devient l’objet de la moquerie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: alors je les arracherai
  rationale: Le verbe נתשׁ évoque l’action d’arracher, notamment une plante. « Arracher » conserve cette image tout en exprimant clairement l’expulsion du pays. Dans la suite conditionnelle du verset précédent, la conjonction est rendue naturellement par « alors ».
- source_word: מֵעַל אַדְמָתִי אֲשֶׁר נָתַתִּי לָהֶם
  choice: de la terre que je leur ai donnée
  rationale: אֲדָמָה désigne ici la terre accordée au peuple. Le français évite « ma terre », car le suffixe de première personne appartient à « donnée » dans le texte massorétique reçu, non à אֲדָמָה.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici le Temple. Le maintien de « maison » préserve l’expression biblique sans masquer son référent contextuel.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: que j’ai consacrée à mon nom
  rationale: Le hiphil de קדשׁ exprime la mise à part comme sainte. « Consacrée » garde cette portée cultuelle, tandis que « à mon nom » préserve la formulation théologique du texte.
- source_word: אַשְׁלִיךְ מֵעַל פָּנָי
  choice: je la rejetterai loin de moi
  rationale: L’expression signifie littéralement « je la jetterai de devant ma face ». « Rejeter loin de moi » communique en français courant l’exclusion et la désapprobation divines sans suggérer que Dieu ne pourrait plus voir le lieu.
- source_word: וְאֶתְּנֶנּוּ לְמָשָׁל
  choice: j’en ferai un proverbe
  rationale: Avec un complément prédicatif, נתן signifie ici « faire de ». מָשָׁל peut désigner un proverbe, une formule exemplaire ou une parole de dérision ; « proverbe » conserve sa valeur lexicale première et l’idée d’un sort devenu proverbial.
- source_word: וְלִשְׁנִינָה
  choice: et un sujet de raillerie
  rationale: שְׁנִינָה désigne une parole mordante ou l’objet de cette parole. « Sujet de raillerie » exprime clairement la honte publique, là où « dicton » ferait double emploi avec « proverbe ».
- source_word: בְּכָל הָעַמִּים
  choice: parmi tous les peuples
  rationale: Le pluriel עַמִּים est rendu par « peuples », plus proche du terme hébreu que le mot politique « nations ».
theological_decisions:
- issue: Désignation du Temple
  choice: cette maison
  alternative: ce Temple
  rationale: Le référent est bien le Temple, mais l’hébreu dit « maison ». Cette traduction préserve l’image théologique de la maison consacrée au nom de Dieu, avec une note qui explicite le référent.
- issue: Formule de la présence et du rejet divins
  choice: je la rejetterai loin de moi
  alternative: je la jetterai de devant ma face
  rationale: La traduction principale rend clairement le rejet divin, tandis que la note conserve l’image hébraïque de la face sans trancher davantage la relation entre « face », présence et regard de Dieu.
- issue: Nature de la honte publique annoncée
  choice: un proverbe et un sujet de raillerie
  alternative: une formule proverbiale et une parole mordante
  rationale: 'Les deux noms hébreux se recouvrent partiellement et admettent plusieurs nuances. La traduction garde deux éléments distincts : le caractère proverbial du jugement et la dérision publique qui en résulte.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de l’annonce divine sans archaïsmes. Le redoublement disloqué « cette maison…, je la… » reflète la mise en relief du complément en hébreu et reste naturel en français.
