base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: fr
  text: Le roi Salomon sacrifia vingt-deux mille bovins et cent vingt mille moutons[a], et le roi et tout le peuple dédièrent la maison de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « petit bétail », car le terme hébreu peut désigner collectivement les moutons et les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrifia
  rationale: Dans ce contexte cultuel, זבח désigne l’action d’immoler ou d’offrir en sacrifice. « Sacrifia » est concis, naturel et conserve explicitement le sens sacrificiel.
- source_word: זֶבַח הַבָּקָר
  choice: bovins
  rationale: בקר désigne collectivement le gros bétail. « Bovins » est précis en français moderne et convient à ce dénombrement, sans restreindre indûment le terme aux seuls bœufs mâles ou châtrés.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: vingt-deux mille
  rationale: Formulation française moderne et usuelle du nombre hébreu.
- source_word: וְצֹאן
  choice: moutons
  rationale: צאן peut désigner collectivement le petit bétail, notamment moutons et chèvres. « Moutons » constitue une formulation claire et naturelle dans le texte, tandis qu’une note préserve l’étendue sémantique du terme hébreu.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: cent vingt mille
  rationale: Formulation française moderne et usuelle du nombre hébreu.
- source_word: וַיַּחְנְכוּ
  choice: firent la dédicace
  rationale: חנך désigne ici l’acte inaugural par lequel le sanctuaire est officiellement dédié. « Firent la dédicace » rend naturellement le verbe tout en gardant le lien avec la dédicace du Temple.
- source_word: בֵּית הָאֱלֹהִים
  choice: la maison de Dieu
  rationale: Cette traduction conserve l’expression hébraïque littérale et intelligible, sans la remplacer par l’interprétation contextuellement juste mais moins formelle « temple de Dieu ».
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: le roi et tout le peuple
  rationale: Après avoir nommé Salomon, l’hébreu reprend son titre. La traduction conserve cette progression discursive et rend כל העם par le collectif français naturel « tout le peuple ».
