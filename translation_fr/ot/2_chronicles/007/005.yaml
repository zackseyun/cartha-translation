  to: Le roi Salomon sacrifia vingt-deux mille bovins et cent vingt mille moutons[a], et le roi et tout le peuple dédièrent la maison de Dieu.
  rationale: La révision supprime l’inférence ajoutée par « ainsi » et emploie « dédièrent », verbe français direct, naturel et fidèle à l’acte de dédicace exprimé par חנך. Les autres choix, y compris la note lexicale, sont conservés.
