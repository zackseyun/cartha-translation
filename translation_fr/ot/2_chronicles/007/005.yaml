  source_fidelity: Le sens général, les nombres, les catégories de bétail et la note sur צֹאן sont fidèles au texte hébreu. Toutefois, « ainsi » introduit une relation consécutive qui n’est pas exprimée par la simple coordination וְ du texte source.
  naturalness: « Firent la dédicace de » est compréhensible, mais moins idiomatique et plus lourd que le verbe français direct « dédièrent ». Une coordination par virgule et « et » reflète aussi plus naturellement la phrase hébraïque.
  terminology: « Sacrifia », « bovins », « moutons », « maison de Dieu » et « dédièrent » conviennent au registre biblique moderne. La note préserve utilement l’extension possible de צֹאן aux chèvres.
