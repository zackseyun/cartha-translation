source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: fr
  text: 'Salomon envoya un message à Houram, roi de Tyr[a], en ces termes : « Comme tu as agi envers David, mon père, et que tu lui as envoyé du bois de cèdre afin de lui bâtir une maison où il habiterait[b]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Houram est la forme du nom employée ici en hébreu; dans le passage parallèle des Rois, le nom apparaît généralement sous la forme Hiram.
    reason: alternative_reading
  - marker: b
    text: La phrase commencée par « Comme » se poursuit au verset suivant. L’hébreu n’ajoute pas ici « fais de même pour moi ».
    reason: source_structure
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya un message
  rationale: Le waw consécutif fait avancer le récit. En français, le contexte et le complément introduisant les paroles permettent de rendre naturellement l’idée d’envoyer une communication.
- source_word: חוּרָם
  choice: Houram
  rationale: Cette forme française représente la forme hébraïque חוּרָם propre aux Chroniques, plutôt que la forme plus connue Hiram des Rois.
- source_word: מֶלֶךְ צֹר
  choice: roi de Tyr
  rationale: Rendu français usuel de la construction indiquant le titre et le lieu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Formule française naturelle et digne pour introduire un discours direct.
- source_word: כַּאֲשֶׁר
  choice: Comme
  rationale: Conserve explicitement la comparaison qui ouvre la demande de Salomon et dont la phrase se poursuit au verset suivant.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: tu as agi envers David, mon père
  rationale: Préserve le sens large de l’idiome « agir envers », que la proposition suivante précise.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: tu lui as envoyé du bois de cèdre
  rationale: Dans ce contexte de construction, le pluriel « cèdres » désigne vraisemblablement le matériau de construction; « bois de cèdre » est clair sans préciser indûment la forme des pièces de bois.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: afin de lui bâtir une maison
  rationale: Conserve le but et le bénéficiaire exprimés par les deux prépositions ל, sans imposer que David soit lui-même le constructeur.
- source_word: לָשֶׁבֶת בּוֹ
  choice: où il habiterait
  rationale: Dans ce contexte, ישב signifie résider ou habiter; la proposition relative est naturelle en français et renvoie à la maison.
theological_decisions:
- issue: Proposition principale sous-entendue après la comparaison
  choice: Ne pas ajouter « fais de même pour moi »
  alternative: Ajouter « fais de même pour moi », comme dans la couche anglaise de consultation
  rationale: Le texte hébreu de ce verset s’arrête après « où il habiterait » et la phrase se poursuit au verset suivant. Ajouter une demande explicite importerait ici des mots absents du texte massorétique et dupliquerait en partie la suite.
translation_notes:
  register: Français international moderne, clair et digne. La tournure comparative inachevée et les points de suspension signalent que le discours se poursuit au verset suivant; ils évitent de compléter silencieusement le texte hébreu. Tous les marqueurs de notes figurent dans le texte.
