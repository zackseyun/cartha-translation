    rationale: Bien que grammaticalement possible avec « peuple » au singulier, « sur lui » est peu naturel après un nom collectif et rend moins immédiatement perceptible que Salomon est roi du peuple aimé de Yahvé. « Roi de son peuple » exprime idiomatiquement la même relation royale.
