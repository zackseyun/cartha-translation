  terminology: « Houram », « Tyr », « Salomon » et « Yahvé » sont appropriés. La note sur « Hiram » signale utilement la forme traditionnelle. « établi roi » rend bien נתנך dans ce contexte royal, sans surinterprétation doctrinale.
