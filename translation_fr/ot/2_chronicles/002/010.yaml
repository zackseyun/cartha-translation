  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: fr
  text: 'Alors Houram[a], roi de Tyr, répondit dans une lettre qu’il envoya à Salomon : « C’est parce que Yahvé aime son peuple[b] qu’il t’a établi roi de son peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Houram » ; forme traditionnelle : « Hiram ».'
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction : « C’est par amour pour son peuple que Yahvé t’a établi roi de son peuple. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans le contexte de la réponse de Houram à Salomon, « répondit » exprime naturellement la valeur contextuelle de « dit » tout en faisant avancer le récit.
- source_word: חוּרָם
  choice: Houram
  rationale: Cette forme transcrit le nom hébreu חוּרָם et convient à la phonologie française; la forme traditionnelle « Hiram » est signalée en note.
- source_word: מֶלֶךְ צֹר
  choice: roi de Tyr
  rationale: Le groupe construit désigne directement la fonction et le royaume de Houram.
- source_word: בִּכְתָב וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: dans une lettre qu’il envoya à Salomon
  rationale: Cette formulation française naturelle conserve à la fois le caractère écrit de la réponse et son envoi à Salomon, sans la lourdeur de deux propositions coordonnées.
- source_word: בְּאַהֲבַת יְהוָה אֶת עַמּוֹ
  choice: C’est parce que Yahvé aime son peuple
  rationale: La préposition בְּ avec le nom abstrait « amour » peut exprimer ici la cause. La tournure verbale rend clairement le rapport causal en français courant.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est transcrit sous sa forme française usuelle plutôt que remplacé par un titre.
- source_word: נְתָנְךָ
  choice: il t’a établi
  rationale: Dans cette construction avec la fonction royale, נתן signifie que Yahvé a placé ou institué Salomon comme roi; « établi » conserve cette idée sans réduire le verbe à un simple don.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: roi sur lui
  rationale: Le pronom hébreu pluriel renvoie collectivement au peuple. En français, « peuple » étant singulier, la reprise naturelle est « lui ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom propre divin; sa transcription préserve cette distinction au lieu de lui substituer un titre.
- issue: Rapport entre l’amour de Yahvé et l’établissement de Salomon
  choice: 'rapport causal explicite : « parce que »'
  alternative: « Dans son amour pour son peuple »
  rationale: La construction בְּאַהֲבַת permet une lecture causale. Le texte présente ainsi l’amour de Yahvé pour son peuple comme le motif de l’établissement de Salomon, sans préciser davantage la nature théologique de cet amour.
translation_notes:
  register: Français international moderne, naturel et digne. « Alors » assure la progression narrative; « répondit dans une lettre qu’il envoya » évite une coordination littérale et pesante. Le tutoiement correspond à l’adresse royale directe au singulier dans l’hébreu.
