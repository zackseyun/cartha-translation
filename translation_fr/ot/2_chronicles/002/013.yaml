source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: fr
  text: C’est le fils d’une femme d’entre les filles de Dan[a], et son père était un Tyrien. Il sait travailler l’or et l’argent, le bronze et le fer, la pierre et le bois, la pourpre, le bleu, le fin lin et le cramoisi[b]. Il sait exécuter toutes sortes de gravures et concevoir tout projet qui lui sera confié[c], avec tes artisans habiles et ceux de mon seigneur David, ton père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « filles de Dan » indique probablement que sa mère appartenait à la tribu de Dan.
    reason: cultural_note
  - marker: b
    text: 'Ou : « l’écarlate » au lieu de « le cramoisi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui lui sera donné » ; le sens peut être « qui lui sera assigné » ou « confié ».'
    reason: translation_clarity
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: fils d’une femme d’entre les filles de Dan
  rationale: La formulation conserve la filiation maternelle et l’expression hébraïque « filles de Dan », sans la remplacer dans le texte par l’interprétation plus explicite « tribu de Dan ».
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: et dont le père était un Tyrien
  rationale: « Tyrien » exprime naturellement en français l’origine géographique indiquée par צֹרִי, tout en reliant correctement la proposition au fils déjà mentionné.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: Il sait travailler
  rationale: Dans ce contexte artisanal, l’expression désigne un savoir-faire pratique plutôt qu’une simple connaissance intellectuelle.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: travailler l’or et l’argent, le bronze et le fer, la pierre et le bois
  rationale: Le verbe français « travailler » accepte directement ces noms de matières et restitue clairement les différents domaines de compétence.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: la pourpre, le bleu, le fin lin et le cramoisi
  rationale: Ces termes désignent des matières textiles ou des étoffes caractérisées par leur couleur. Les équivalents traditionnels restent compréhensibles, tandis qu’une note préserve l’alternative « écarlate » pour כַּרְמִיל.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: exécuter toutes sortes de gravures
  rationale: Cette formulation rend le travail de gravure exprimé par la paire étymologique hébraïque sans produire en français la lourdeur « graver toute gravure ».
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: concevoir tout projet
  rationale: Dans un contexte d’artisanat, חשׁב et מַחֲשָׁבֶת renvoient à la conception d’un ouvrage ou d’un motif. « Projet » conserve une certaine amplitude au lieu de limiter le sens aux seuls motifs décoratifs.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: qui lui sera confié
  rationale: Le passif indique ce qui sera donné ou assigné à l’artisan. « Confié » est naturel en français et maintient l’indétermination de l’agent.
- source_word: עִם חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: avec tes artisans habiles et ceux de mon seigneur David, ton père
  rationale: Le contexte donne à חֲכָמִים le sens de personnes expertes dans leur métier. « Mon seigneur » conserve l’adresse honorifique humaine אֲדֹנִי.
theological_decisions:
- issue: Portée de l’expression « filles de Dan »
  choice: Conserver « filles de Dan » dans le texte et expliquer la probable référence tribale en note
  alternative: Traduire directement « de la tribu de Dan »
  rationale: Le texte hébreu emploie une expression généalogique féminine susceptible d’indiquer l’appartenance de la mère à la tribu de Dan. La traduction ne remplace pas cette formulation par son interprétation.
- issue: Désignation des personnes qualifiées par חֲכָמִים
  choice: artisans habiles
  alternative: sages ; hommes habiles
  rationale: Dans cette liste de savoir-faire artistiques, le terme désigne l’expertise artisanale. « Artisans habiles » rend le contexte sans lui attribuer ici une portée religieuse ou sapientielle étrangère au passage.
- issue: Titre humain אֲדֹנִי
  choice: mon seigneur David
  alternative: mon maître David
  rationale: Le terme est ici un titre de respect adressé à David, non un titre divin. « Mon seigneur » conserve le registre de cour sans créer d’identification théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase commence comme la continuation syntaxique du verset précédent, conformément à l’hébreu. Les termes artisanaux sont rendus avec un vocabulaire courant, et les expressions généalogiques et honorifiques restent proches de la forme de la source.
