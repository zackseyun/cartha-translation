  text: וְ/הִנֵּ֣ה לַֽ/חֹטְבִ֣ים לְֽ/כֹרְתֵ֣י הָ/עֵצִ֡ים נָתַתִּי֩ חִטִּ֨ים מַכּ֜וֹת לַ/עֲבָדֶ֗י/ךָ כֹּרִים֙ עֶשְׂרִ֣ים אֶ֔לֶף וּ/שְׂעֹרִ֕ים כֹּרִ֖ים עֶשְׂרִ֣ים אָ֑לֶף וְ/יַ֗יִן בַּתִּים֙ עֶשְׂרִ֣ים אֶ֔לֶף וְ/שֶׁ֕מֶן בַּתִּ֖ים עֶשְׂרִ֥ים אָֽלֶף׀׀׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: fr
  text: 'Et voici : j’ai donné à tes serviteurs, aux bûcherons, à ceux qui coupent les arbres, 20 000 kors[b] de blé concassé[a], 20 000 kors d’orge, 20 000 baths[c] de vin et 20 000 baths d’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est inhabituelle. On pourrait aussi comprendre : « du blé pour leur nourriture » ou « du blé battu ».'
    reason: lexical_alternative
  - marker: b
    text: Le kor est une ancienne mesure de capacité pour les matières sèches.
    reason: cultural_note
  - marker: c
    text: Le bath est une ancienne mesure de capacité pour les liquides.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve à la fois le lien avec le contexte et la fonction de mise en relief de הִנֵּה, dans un français digne et intelligible.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: pour les bûcherons, ceux qui abattront les arbres
  rationale: Préserve les deux expressions participiales presque synonymes et leur relation d’apposition, tout en employant le terme français naturel « bûcherons ».
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Rend l’accompli hébreu comme un engagement déjà arrêté dans le cadre de la lettre, sans le transformer explicitement en futur.
- source_word: חִטִּים מַכּוֹת
  choice: blé concassé
  rationale: Rend l’expression hébraïque difficile comme du blé ayant subi une préparation, interprétation adaptée à cette liste de provisions, tout en signalant l’incertitude en note.
- source_word: לַעֲבָדֶיךָ
  choice: à tes serviteurs
  rationale: Reproduit directement la construction du verbe « donner » avec le destinataire et conserve le sens lexical de עֲבָדִים.
- source_word: כֹּרִים
  choice: kors
  rationale: Transcrit l’ancienne mesure de capacité pour matières sèches plutôt que de proposer une conversion moderne incertaine.
- source_word: בַּתִּים
  choice: baths
  rationale: Transcrit l’ancienne mesure de capacité pour liquides sans introduire de conversion spéculative.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent français direct et contextuellement approprié.
- source_word: שֶׁמֶן
  choice: huile
  rationale: Reste aussi général que l’hébreu, sans ajouter « d’olive », même si cette huile est vraisemblablement visée.
- source_word: עֶשְׂרִים אֶלֶף
  choice: 20 000
  rationale: Reproduit exactement la quantité répétée pour chacune des quatre denrées, selon la présentation numérique française courante.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la mise en relief de « voici », la double désignation des bûcherons et les unités anciennes. Les deux compléments introduits par ל sont maintenus distincts afin de ne pas identifier silencieusement « tes serviteurs » et « les bûcherons », même si le contexte peut suggérer qu’il s’agit du même groupe.
