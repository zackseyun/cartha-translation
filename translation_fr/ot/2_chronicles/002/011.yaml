source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: fr
  text: 'Alors Houram déclara[a] : « Béni soit Yahweh, le Dieu d’Israël, qui a fait le ciel et la terre, et qui a donné au roi David un fils sage, doué de discernement et d’intelligence[b], qui construira une maison pour Yahweh et une maison pour son royaume[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Houram est appelé « Hiram » dans le récit parallèle de 1 Rois ; les Chroniques emploient ici la forme hébraïque Houram.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « qui connaît la perspicacité et l’intelligence » ; on pourrait aussi traduire : « qui possède prudence et discernement ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression peut désigner une résidence au service de son pouvoir royal, peut-être le complexe palatial ; l’hébreu dit littéralement « une maison pour son royaume ».
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … déclara
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, tandis que « déclara » convient au caractère solennel des paroles rapportées.
- source_word: חוּרָם
  choice: Houram
  rationale: Cette translittération française suit la forme hébraïque חוּרָם propre aux Chroniques, sans l’harmoniser avec Hiram dans le récit parallèle des Rois.
- source_word: בָּרוּךְ יְהוָה
  choice: Béni soit Yahweh
  rationale: Cette formulation française naturelle et solennelle rend fidèlement la formule hébraïque de bénédiction et conserve le nom divin.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la construction génitivale, qui préserve l’identification du Dieu invoqué à Israël.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: qui a fait le ciel et la terre
  rationale: « Le ciel et la terre » est l’expression française biblique et idiomatique qui désigne l’ensemble de la création, bien que שָׁמַיִם ait une forme plurielle en hébreu.
- source_word: נָתַן לְדָוִיד הַמֶּלֶךְ בֵּן חָכָם
  choice: qui a donné au roi David un fils sage
  rationale: La structure et le sens de l’hébreu sont conservés dans un français fluide; le passé composé souligne la portée présente du don.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: doué de discernement et d’intelligence
  rationale: Le participe יוֹדֵעַ décrit ici une qualité possédée. « Doué de » est naturel en français, tandis que « discernement » et « intelligence » rendent les deux capacités apparentées sans les confondre.
- source_word: בַּיִת לַיהוָה
  choice: une maison pour Yahweh
  rationale: Même si le référent est le Temple, « maison » préserve le mot בַּיִת et l’image biblique originale.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: une maison pour son royaume
  rationale: Ce rendu formel préserve l’ambiguïté du texte entre une résidence liée à la royauté et un édifice destiné à l’exercice du pouvoir royal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Référent du suffixe dans לְמַלְכוּתוֹ (« son royaume »)
  choice: Conserver « son royaume »
  alternative: Expliciter « le royaume de Salomon » ou traduire « son palais royal »
  rationale: Le suffixe peut naturellement renvoyer au fils sage, mais le texte ne nomme pas explicitement son référent et emploie « royaume », non « palais ». La traduction maintient donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’enchaînement des propositions relatives de l’hébreu sans devenir pesante. « Maison » est maintenu pour préserver l’image source, avec une note sur la seconde occurrence.
