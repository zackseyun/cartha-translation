  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: fr
  text: Et maintenant, envoie-moi un homme habile pour travailler l’or, l’argent, le bronze, le fer, la pourpre, le carmin[a] et le bleu, qui sache graver des motifs[b] et travailler avec les artisans habiles qui sont auprès de moi en Juda et à Jérusalem, et que David, mon père, a préparés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’écarlate ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « graver des gravures » ; l’hébreu emploie deux mots de même racine pour désigner le travail de gravure.'
    reason: lexical_alternative
  - marker: c
    text: Ou « désignés » ou « rendus prêts » ; le verbe hébreu peut évoquer la préparation ou la mise en place de ces artisans.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה שְׁלַח
  choice: Et maintenant, envoie-moi
  rationale: וְעַתָּה contient bien un connecteur suivi de l’adverbe temporel « maintenant ». L’impératif שְׁלַח exprime directement la demande adressée au destinataire.
- source_word: אִישׁ חָכָם
  choice: un homme habile
  rationale: Dans ce contexte artisanal, חָכָם désigne la compétence technique plutôt que la sagesse abstraite. « Homme » conserve le masculin singulier du texte.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: pour travailler l’or, l’argent, le bronze, le fer
  rationale: L’infinitif et la préposition introduisent ici les matières que l’artisan doit savoir travailler. « Bronze » convient au contexte matériel ancien de נְחֹשֶׁת.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: la pourpre, le carmin et le bleu
  rationale: Les termes désignent des couleurs ou des matières teintes, sans substantif explicite signifiant « fil » ou « étoffe ». La formulation française conserve cette concision.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: qui sache graver des motifs
  rationale: L’hébreu emploie une construction de même racine, littéralement « graver des gravures ». Le français naturel exprime cette compétence par « graver des motifs », tandis que la tournure source est signalée en note.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: avec les artisans habiles qui sont auprès de moi
  rationale: Le contexte identifie ces חֲכָמִים comme des artisans qualifiés. « Auprès de moi » garde la relation exprimée sans introduire une hiérarchie absente de l’hébreu.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: que David, mon père, a préparés
  rationale: Le relatif renvoie naturellement aux artisans. הֵכִין garde le sens large de préparer ou rendre prêts, sans imposer l’idée plus précise d’une nomination.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe a été légèrement répartie en deux phrases pour éviter une longue accumulation, sans modifier les relations du texte. Les termes de couleur restent substantivés, puisque l’hébreu ne précise ni « fils » ni « étoffes ».
