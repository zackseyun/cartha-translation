  to: Et maintenant, envoie-moi un homme habile pour travailler l’or, l’argent, le bronze, le fer, la pourpre, le carmin[a] et le bleu, qui sache graver des motifs[b] et travailler avec les artisans habiles qui sont auprès de moi en Juda et à Jérusalem, et que David, mon père, a préparés[c].
