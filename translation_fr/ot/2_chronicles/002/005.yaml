source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: fr
  text: Mais qui est capable de lui construire une maison, puisque les cieux, même les cieux les plus élevés[a], ne peuvent le contenir ? Et qui suis-je pour lui construire une maison, sinon pour faire brûler de l’encens[b] devant lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « les cieux et les cieux des cieux », expression qui désigne les cieux les plus élevés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « faire monter des offrandes en fumée devant lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: aurait la force
  rationale: L’expression désigne la capacité suffisante pour accomplir la tâche. Le conditionnel français s’intègre naturellement à la question rhétorique sans réduire celle-ci à une simple possibilité matérielle.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: lui construire une maison
  rationale: « Maison » conserve le terme hébreu בַיִת et son lien avec la demeure de Dieu, tandis que « temple » expliciterait le contexte de manière interprétative.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: les cieux, même les cieux les plus élevés
  rationale: Cette formulation française naturelle rend l’intensification de l’expression hébraïque tout en maintenant sa structure en deux éléments.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: ne peuvent le contenir
  rationale: Dans ce contexte, le verbe exprime l’impossibilité, même pour les cieux, d’enfermer ou de contenir Dieu.
- source_word: וּמִי אֲנִי
  choice: Et qui suis-je
  rationale: La conjonction est conservée, et la question exprime l’humilité du locuteur face à la grandeur divine.
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: pour lui construire une maison
  rationale: Après « qui suis-je », l’infinitif introduit naturellement en français l’action que le locuteur se juge indigne d’entreprendre.
- source_word: כִּי אִם
  choice: si ce n’est
  rationale: 'Cette tournure marque la restriction : la maison n’est pas destinée à contenir Dieu, mais à servir au culte rendu devant lui.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: faire brûler de l’encens devant lui
  rationale: Dans le contexte cultuel, הקטיר peut désigner l’action de faire brûler de l’encens. « Devant lui » préserve la dimension relationnelle et spatiale de לְפָנָיו, tandis qu’une note signale la portée potentiellement plus large du verbe.
theological_decisions:
- issue: Transcendance divine et fonction de la maison
  choice: La maison ne contient pas Dieu ; elle sert de lieu où le culte lui est rendu.
  alternative: Comprendre la maison comme une demeure qui localiserait ou contiendrait Dieu.
  rationale: 'L’affirmation selon laquelle même les cieux ne peuvent contenir Dieu gouverne le passage. La proposition finale maintient la tension du texte : une maison lui est construite, mais sa fonction est cultuelle plutôt que contenante.'
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et le vocabulaire concret de la « maison » sont conservés. La répétition de « lui construire une maison » reflète celle du texte hébreu.
