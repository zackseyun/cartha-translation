  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: fr
  text: Quant à nous, nous couperons au Liban tout le bois dont tu as besoin. Nous te l’acheminerons par mer jusqu’à Jaffa sous forme de radeaux[a]. Tu le feras monter[b] à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en radeaux » ou « comme des trains de bois flottants ».'
    reason: lexical_alternative
  - marker: b
    text: « Monter » reflète l’altitude plus élevée de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Quant à nous, nous
  rationale: Le pronom indépendant, ajouté à la forme verbale qui marque déjà la première personne du pluriel, donne une valeur de mise en relief. « Quant à nous, nous » la conserve naturellement en français.
- source_word: נִכְרֹת עֵצִים
  choice: nous couperons […] tout le bois
  rationale: כרת signifie ici couper ou abattre des arbres, tandis que עֵצִים désigne, dans ce contexte de fourniture pour une construction, le bois destiné au chantier. Le collectif français « bois » convient au contexte.
- source_word: מִן הַלְּבָנוֹן
  choice: au Liban
  rationale: Dans ce contexte forestier, le français idiomatique dit que le bois est coupé « au Liban »; cette formulation exprime bien sa provenance sans calquer la préposition hébraïque.
- source_word: כְּכָל צָרְכֶּךָ
  choice: tout le bois dont tu as besoin
  rationale: La tournure exprime une quantité conforme à l’ensemble des besoins du destinataire. Cette formulation est claire et naturelle.
- source_word: וּנְבִיאֵם לְךָ
  choice: Nous te l’acheminerons
  rationale: Le verbe בוא au causatif signifie ici faire venir, apporter ou transporter. « Acheminer » convient à l’organisation du transport; le singulier reprend le nom collectif « bois », bien que l’hébreu emploie un suffixe pluriel.
- source_word: רַפְסֹדוֹת
  choice: sous forme de radeaux
  rationale: Le terme désigne vraisemblablement des assemblages flottants de pièces de bois. « Sous forme de radeaux » indique que le bois lui-même est lié pour le transport, tout en laissant en note les autres analyses possibles.
- source_word: עַל יָם יָפוֹ
  choice: par mer jusqu’à Jaffa
  rationale: La construction concise indique un transport maritime ayant Jaffa pour destination. « Jusqu’à » rend clairement le point d’arrivée.
- source_word: יָפוֹ
  choice: Jaffa
  rationale: « Jaffa » est le nom français moderne et largement reconnaissable de la ville portuaire appelée יָפוֹ en hébreu; « Joppé » est la forme biblique traditionnelle.
- source_word: תַּעֲלֶה אֹתָם יְרוּשָׁלִָם
  choice: De là, tu le feras monter à Jérusalem
  rationale: Le hifil de עלה signifie faire monter. Le mouvement ascendant vers Jérusalem, située en altitude, est explicitement conservé. « De là » explicite seulement le point de départ fourni par la proposition précédente.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La mise en relief du pronom hébreu est conservée par « Quant à nous, nous ». Le collectif « bois » évite une formulation technique ou archaïque; « acheminer » et « sous forme de radeaux » décrivent clairement le procédé de transport. Les marqueurs [a] et [b] figurent tous deux dans le texte à l’endroit pertinent.
