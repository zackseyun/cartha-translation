  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: fr
  text: Il désigna parmi eux 70 000 porteurs, 80 000 tailleurs de pierre dans la région montagneuse[a] et 3 600 surveillants chargés de faire travailler le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvriers de carrière dans la région montagneuse ». L’hébreu dit littéralement « ceux qui taillent dans la montagne », sans préciser l’objet taillé; le contexte indique qu’il s’agit de pierre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Il désigna parmi eux
  rationale: L’expression signifie ici qu’il choisit ou affecta des personnes prises dans le groupe recensé. « Désigna parmi eux » restitue naturellement en français cette idée de nomination.
- source_word: סַבָּל
  choice: porteurs
  rationale: Le nom désigne ceux qui transportent des charges. « Porteurs » est précis, courant et adapté au contexte des travaux de construction.
- source_word: חֹצֵב בָּהָר
  choice: tailleurs de pierre dans la région montagneuse
  rationale: Le participe חֹצֵב désigne ceux qui taillent ou extraient un matériau; la pierre, objet implicite, est indiquée par le contexte de construction. « Région montagneuse » rend naturellement בָּהָר sans imposer l’image d’une montagne unique.
- source_word: מְנַצְּחִים
  choice: surveillants
  rationale: Dans ce contexte administratif, le terme désigne des personnes qui dirigent et contrôlent le travail.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: chargés de faire travailler le peuple
  rationale: « Faire travailler » conserve la valeur causative de la forme verbale; « chargés de » exprime naturellement en français le lien entre les surveillants et leur fonction.
- source_word: הָעָם
  choice: le peuple
  rationale: La traduction garde le terme général de l’hébreu plutôt que de le réduire à « ouvriers » ou « main-d’œuvre », même si le contexte concerne les travailleurs.
