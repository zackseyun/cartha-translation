  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: fr
  text: 'Et maintenant, j’ai envoyé un homme habile, doué de discernement : Houram-Abi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, Houram-Abi. Le dernier élément signifie littéralement « mon père », mais il s’agit probablement ici d’un titre honorifique ou d’une partie de la désignation de l’artisan ; voir aussi « Houram, son père » en 2 Chroniques 4.16.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction et l’adverbe temporel marquent la progression de la réponse royale; « Et maintenant » en conserve naturellement l’enchaînement.
- source_word: שָׁלַחְתִּי
  choice: j’ai envoyé
  rationale: Le parfait hébreu présente l’envoi comme accompli et pertinent pour la situation présente; le passé composé français convient à cette valeur.
- source_word: אִישׁ חָכָם
  choice: un homme habile
  rationale: חָכָם signifie couramment « sage », mais, dans ce contexte consacré aux travaux artisanaux, il désigne aussi la compétence pratique. « Habile » exprime clairement cette nuance sans ajouter une spécialité absente de l’expression.
- source_word: יוֹדֵעַ בִּינָה
  choice: doué de discernement
  rationale: L’expression signifie littéralement « connaissant l’intelligence ». Cette formulation française conserve sa dimension intellectuelle et pratique sans être servile.
- source_word: לְחוּרָם אָבִי
  choice: Houram-Abi
  rationale: La construction difficile semble fonctionner ici comme le nom ou la désignation de l’artisan. La translittération évite d’imposer soit une parenté littérale, soit une fonction précise, tout en maintenant l’ambiguïté du texte.
theological_decisions:
- issue: Sens de אָבִי dans la désignation לְחוּרָם אָבִי
  choice: Traiter le terme comme une partie de la désignation « Houram-Abi »
  alternative: « Houram, mon père » ou « Houram, mon maître artisan »
  rationale: אָבִי signifie littéralement « mon père », mais « père » peut aussi être un titre honorifique désignant un maître, un conseiller ou un personnage éminent. La translittération préserve cette tension et évite d’affirmer une parenté biologique ou une fonction déterminée.
translation_notes:
  register: Français international moderne, naturel et digne. « Habile » fait entendre le contexte artisanal, tandis que « doué de discernement » conserve la portée cognitive du second membre. Le deux-points présente naturellement le nom de l’homme envoyé.
