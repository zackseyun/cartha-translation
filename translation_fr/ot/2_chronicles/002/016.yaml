  text: וַ/יִּסְפֹּ֣ר שְׁלֹמֹ֗ה כָּל הָ/אֲנָשִׁ֤ים הַ/גֵּירִים֙ אֲשֶׁר֙ בְּ/אֶ֣רֶץ יִשְׂרָאֵ֔ל אַחֲרֵ֣י הַ/סְּפָ֔ר אֲשֶׁ֥ר סְפָרָ֖/ם דָּוִ֣יד אָבִ֑י/ו וַ/יִּמָּצְא֗וּ מֵאָ֤ה וַ/חֲמִשִּׁים֙ אֶ֔לֶף וּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: fr
  text: Puis Salomon recensa tous les étrangers établis dans le pays d’Israël[a], après le recensement que David, son père, avait fait d’eux. On en trouva cent cinquante-trois mille six cents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les résidents étrangers » ou « les immigrés ». Le terme hébreu désigne des non-Israélites établis sur le territoire d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: recensa
  rationale: Le verbe ספר désigne ici le dénombrement de personnes. « Recensa » est naturel en français et prépare la mention du recensement antérieur.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: tous les étrangers résidant
  rationale: גֵּרִים désigne des étrangers établis parmi les Israélites, et non de simples voyageurs. Cette formulation exprime clairement leur résidence sans employer un terme administratif moderne.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: dans le pays d’Israël
  rationale: « Pays d’Israël » conserve la dimension territoriale de אֶרֶץ tout en restant idiomatique.
- source_word: אַחֲרֵי הַסְּפָר
  choice: après le recensement
  rationale: La locution renvoie au dénombrement antérieur effectué sous David. « Après le recensement » suit le sens temporel le plus direct, bien que l’idée d’un dénombrement fondé sur le relevé précédent soit contextuellement possible.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: que David, son père, avait fait d’eux
  rationale: Cette formulation française rattache explicitement le recensement aux mêmes personnes et rend l’antériorité de l’action de David.
- source_word: וַיִּמָּצְאוּ
  choice: On en trouva
  rationale: La tournure conserve le sens passif ou résultatif du niphal de מצא tout en évitant une formulation française lourde.
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: cent cinquante-trois mille six cents
  rationale: Le nombre exact, 153 600, est écrit en toutes lettres conformément au style narratif.
