  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: fr
  text: Et maintenant, que mon seigneur envoie à ses serviteurs le blé, l’orge, l’huile[a] et le vin dont il a parlé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte d’approvisionnement, il peut s’agir plus précisément d’huile d’olive.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il a évoqués » ; le verbe hébreu peut simplement signifier « dit » et n’exige pas le sens plus fort de « promis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque la transition vers la demande concrète tout en conservant la valeur connective de וְ et la valeur temporelle de עַתָּה.
- source_word: הַחִטִּים וְהַשְּׂעֹרִים
  choice: le blé, l’orge
  rationale: Ces noms de denrées se rendent naturellement comme des noms massifs en français. Les articles définis correspondent à la liste précise introduite par les articles hébreux.
- source_word: הַשֶּׁמֶן
  choice: l’huile
  rationale: Le terme désigne probablement de l’huile d’olive dans ce contexte d’approvisionnement, mais l’hébreu dit simplement « huile » ; le texte principal conserve cette généralité.
- source_word: וְהַיַּיִן
  choice: et le vin
  rationale: Équivalent direct et naturel du nom de denrée, avec l’article défini de l’hébreu.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Formule de déférence adressée ici à un souverain humain ; la minuscule évite toute confusion avec un titre divin.
- source_word: יִשְׁלַח
  choice: que … envoie
  rationale: Dans ce contexte, le yiqtol a une valeur jussive et exprime une requête, non une simple affirmation au futur.
- source_word: לַעֲבָדָיו
  choice: à ses serviteurs
  rationale: Rend directement la préposition לְ et le nom עֶבֶד avec son suffixe masculin singulier, tout en préservant la référence pronominale du texte source.
- source_word: אֲשֶׁר אָמַר
  choice: dont il a parlé
  rationale: Exprime idiomatiquement en français la mention antérieure des denrées sans renforcer אָמַר en « promis ».
