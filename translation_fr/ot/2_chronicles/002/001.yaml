  text: וַ/יִּסְפֹּ֨ר שְׁלֹמֹ֜ה שִׁבְעִ֥ים אֶ֨לֶף֙ אִ֣ישׁ סַבָּ֔ל וּ/שְׁמוֹנִ֥ים אֶ֛לֶף אִ֖ישׁ חֹצֵ֣ב בָּ/הָ֑ר וּ/מְנַצְּחִ֣ים עֲלֵי/הֶ֔ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: fr
  text: Salomon dénombra 70 000 hommes pour porter des charges, 80 000 hommes pour tailler dans la montagne[a], et 3 600 superviseurs au-dessus d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tailler dans la montagne ». L’hébreu ne précise pas ce qui est taillé; dans le contexte, on peut aussi comprendre : « extraire de la pierre dans les montagnes ».'
    reason: L’objet de « tailler » est implicite en hébreu, et « la montagne » au singulier peut avoir une valeur collective.
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: dénombra
  rationale: Le verbe ספר désigne ici le dénombrement de la main-d’œuvre royale. « Dénombrer » convient à ce registre administratif tout en restant clair.
- source_word: אִישׁ סַבָּל
  choice: hommes pour porter les charges
  rationale: סַבָּל désigne un porteur de fardeaux ou de charges. Cette formulation naturelle conserve à la fois la référence explicite aux hommes et leur fonction.
- source_word: חֹצֵב בָּהָר
  choice: hommes pour tailler la pierre dans la région montagneuse
  rationale: חצב signifie « tailler, extraire en creusant » ; dans le contexte des travaux de construction, la pierre est l’objet implicite. בָּהָר désigne ici le lieu montagneux, rendu idiomatiquement par « dans la région montagneuse ».
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: responsables chargés de les diriger
  rationale: Dans ce contexte administratif, le participe מְנַצְּחִים désigne ceux qui dirigent ou supervisent les ouvriers. La formulation exprime naturellement la relation marquée par עֲלֵיהֶם.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 3 600
  rationale: La notation chiffrée est claire et naturelle en français moderne pour les effectifs d’une liste administrative.
- source_word: אִישׁ
  choice: hommes
  rationale: Le nom hébreu est masculin et désigne ici les membres masculins d’une main-d’œuvre royale ; la traduction conserve cette précision.
theological_decisions: []
