source:
  edition: WLC
  text: וּ/לְ/הָכִ֥ין לִ֛/י עֵצִ֖ים לָ/רֹ֑ב כִּ֥י הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֥וֹל וְ/הַפְלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/008.yaml
  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: fr
  text: et de me préparer du bois en abondance, car la maison que je bâtis sera grande et extraordinaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « merveilleuse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: et de préparer
  rationale: L’infinitif construit avec la conjonction et la préposition poursuit la demande du verset précédent; « et de préparer » conserve ce lien syntaxique et la nuance de but.
- source_word: לִי
  choice: me
  rationale: Le pronom complément dans « me préparer » exprime naturellement en français le bénéficiaire de la préparation.
- source_word: עֵצִים
  choice: du bois
  rationale: Dans ce contexte de construction, « du bois » désigne naturellement le matériau destiné au bâtiment; « des arbres » serait trop littéral et « du bois de construction » plus explicatif.
- source_word: לָרֹב
  choice: en abondance
  rationale: Cette expression rend directement l’idée d’une très grande quantité tout en restant naturelle et digne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la demande; « car » convient au registre narratif soutenu.
- source_word: הַבַּיִת
  choice: la maison
  rationale: Le texte hébreu dit littéralement « la maison ». Le contexte indique le temple, mais conserver « maison » respecte l’expression source sans explicitation interprétative.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: que je bâtis
  rationale: Le participe présente l’entreprise comme actuelle ou engagée. Le présent français « je bâtis » préserve cette valeur tout en restant plus solennel que « je construis ».
- source_word: גָּדוֹל
  choice: grande
  rationale: « Grande » peut évoquer à la fois les dimensions et l’importance majestueuse de la maison.
- source_word: וְהַפְלֵא
  choice: et extraordinaire
  rationale: La forme issue de פלא exprime ce qui dépasse l’ordinaire et suscite l’émerveillement. « Extraordinaire » conserve cette force sans supposer nécessairement un miracle.
theological_decisions:
- issue: Référent de הַבַּיִת
  choice: Conserver « la maison » dans le texte principal.
  alternative: Traduire « le temple ».
  rationale: Le contexte identifie bien le temple, mais l’hébreu emploie le terme ordinaire « maison ». La traduction formelle préserve cette désignation biblique sans importer l’explicitation contextuelle dans le corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La structure reste proche de l’hébreu. « Bâtis » maintient un registre adapté à un édifice sacré, tandis que « extraordinaire » restitue la force de פלא sans archaïsme.
