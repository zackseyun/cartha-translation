  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: fr
  text: Envoie-moi du bois de cèdre, de cyprès[a] et d’algoum[b] provenant du Liban, car je sais que tes serviteurs savent abattre les arbres du Liban. Et voici, mes serviteurs seront avec tes serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « genévrier » ou « sapin » ; l’espèce désignée par le mot hébreu beroshim est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le terme « algoum » désigne un bois dont l’espèce exacte est incertaine ; certains l’identifient au bois de santal. On trouve aussi la forme « almoug ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Envoie-moi
  rationale: L’impératif est rendu directement; le ו initial assure la continuité du discours sans nécessiter un « maintenant » absent de l’hébreu.
- source_word: עֲצֵי אֲרָזִים
  choice: du bois de cèdre
  rationale: Dans cette demande de matériaux de construction, le collectif « bois de cèdre » exprime naturellement le syntagme hébreu.
- source_word: בְּרוֹשִׁים
  choice: de cyprès
  rationale: « Cyprès » est une identification traditionnelle et courante, mais l’espèce exacte reste incertaine; cette incertitude est signalée en note.
- source_word: וְאַלְגּוּמִּים
  choice: et d’algoum
  rationale: La translittération française « algoum » évite d’imposer une identification botanique spéculative; l’incertitude est conservée en note.
- source_word: מֵהַלְּבָנוֹן
  choice: du Liban
  rationale: Formulation géographique idiomatique en français moderne.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: car je sais
  rationale: Le parfait hébreu exprime ici un état présent de connaissance.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: que tes serviteurs savent abattre
  rationale: « Savent » avec l’infinitif rend naturellement la compétence exprimée; « abattre » convient précisément à la coupe d’arbres.
- source_word: עֲצֵי לְבָנוֹן
  choice: les arbres du Liban
  rationale: Cette traduction conserve le sens concret de עֵצִים et le lien d’origine ou de localisation avec le Liban.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: « Voici » conserve la fonction présentative et emphatique de הִנֵּה dans un registre français digne.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: mes serviteurs seront avec les tiens
  rationale: La proposition nominale ne précise pas le temps; le futur est fourni par le contexte de l’arrangement demandé. « Les tiens » évite une répétition lourde sans perdre le référent.
