  text: וְ/הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֑וֹל כִּֽי גָד֥וֹל אֱלֹהֵ֖י/נוּ מִ/כָּל הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: fr
  text: Et la maison que je construis est grande[a], car notre Dieu est plus grand que tous les dieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple que je construis est grand ». L’hébreu dit littéralement « la maison que je construis »; dans ce contexte, il s’agit du temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « notre Dieu est grand au-dessus de tous les dieux ». L’hébreu emploie « grand » avec une construction qui exprime la comparaison.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: Et la maison
  rationale: בַּיִת signifie littéralement « maison ». Dans ce contexte, il désigne le sanctuaire ou temple, mais « maison » conserve l’image hébraïque de la maison de Dieu.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: que je construis
  rationale: Le participe בוֹנֶה présente la construction comme une entreprise en cours ou engagée. « Que je construis » est naturel en français et garde cette valeur aspectuelle.
- source_word: גָּדוֹל
  choice: sera grande
  rationale: L’adjectif exprime à la fois les dimensions et l’importance. Le futur « sera » rend naturellement en français le caractère projeté de l’édifice dans ce contexte.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison de l’affirmation précédente. « Car » convient au registre digne du passage tout en restant courant.
- source_word: גָדוֹל ... מִכָּל
  choice: plus grand que tous
  rationale: Bien que גָדוֹל ne porte pas de forme comparative propre, la construction avec מִן exprime clairement la comparaison; « plus grand que » est la formulation française idiomatique.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Traduction directe de la forme אֱלֹהִים accompagnée du suffixe de première personne du pluriel lorsqu’elle désigne le Dieu d’Israël.
- source_word: הָאֱלֹהִים
  choice: les dieux
  rationale: Le terme désigne ici les autres dieux ou divinités auxquels le Dieu d’Israël est comparé. « Les dieux » préserve la rhétorique du texte sans préciser leur statut ontologique.
theological_decisions:
- issue: La comparaison entre le Dieu d’Israël et les autres dieux
  choice: notre Dieu est plus grand que tous les dieux
  alternative: notre Dieu est grand au-dessus de tous les dieux
  rationale: La construction hébraïque exprime la supériorité du Dieu d’Israël. La traduction conserve cette affirmation sans décider si les « dieux » sont des idoles, de faux dieux ou des êtres célestes.
translation_notes:
  register: Français international moderne, clair et digne. « Maison » maintient la formulation et la résonance théologique de l’hébreu, tandis que la note signale le sens contextuel « temple ». La comparaison demeure explicite et son ambiguïté théologique n’est pas résolue.
