  to: 'Voici : je construis une maison pour le nom de Yahweh, mon Dieu, afin de la lui consacrer, d’y faire brûler devant lui de l’encens aromatique, d’y présenter continuellement les pains[a] et d’y offrir des holocaustes matin et soir, aux sabbats, aux nouvelles lunes[b] et lors des fêtes fixées de Yahweh, notre Dieu. Pour toujours, cela incombe à Israël[c].'
