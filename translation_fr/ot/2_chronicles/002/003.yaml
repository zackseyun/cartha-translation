source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: fr
  text: 'Voici : je construis une maison pour le nom de Yahweh, mon Dieu, afin de la lui consacrer, d’y faire brûler devant lui de l’encens aromatique, d’y présenter continuellement les pains[a] et d’y offrir des holocaustes matin et soir, aux sabbats, aux nouvelles lunes[b] et lors des fêtes fixées de Yahweh, notre Dieu. Pour toujours, cela incombe à Israël[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’arrangement continuel ». Il désigne les pains disposés continuellement devant Yahweh, traditionnellement appelés « pains de proposition » ou « pains de présentation ».
    reason: lexical_alternative
  - marker: b
    text: Les « nouvelles lunes » marquent le début des mois dans le calendrier cultuel d’Israël.
    reason: cultural_clarification
  - marker: c
    text: 'L’hébreu est elliptique : « cela [est] pour toujours à la charge d’Israël ». Il indique que ces observances constituent une obligation durable pour Israël.'
    reason: translation_clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marqueur solennel attirant l’attention sur la déclaration; « Voici » convient au registre royal sans être familier.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: une maison pour le nom de Yahweh
  rationale: Conserve « maison » et l’expression théologiquement significative « pour le nom », plutôt que de les expliciter directement par « temple ».
- source_word: לְהַקְדִּישׁ לוֹ
  choice: afin de la lui consacrer
  rationale: Exprime la mise à part cultuelle de la maison pour Dieu; le pronom féminin reprend naturellement « maison ».
- source_word: קְטֹרֶת סַמִּים
  choice: de l’encens aromatique
  rationale: Rend la composition odoriférante de l’encens dans un français actuel et précis.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: d’y disposer régulièrement les pains
  rationale: Le texte évoque la disposition cultuelle régulière; « les pains » explicite sobrement le référent connu du mobilier du sanctuaire, indiqué en note.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: Terme français biblique établi pour les sacrifices entièrement consumés, encore intelligible dans ce contexte.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: C’est une obligation perpétuelle pour Israël
  rationale: Le tour hébreu elliptique indique que cette pratique incombe durablement à Israël; la formulation française rend cette portée sans l’appliquer au-delà du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu.
- issue: Sens de בַּיִת
  choice: maison
  alternative: temple
  rationale: « Maison » maintient l’expression source « une maison pour le nom de Yahweh »; le contexte permet de comprendre qu’il s’agit du temple.
- issue: Référent de מַעֲרֶכֶת תָּמִיד
  choice: disposer régulièrement les pains
  alternative: la présentation perpétuelle / les pains de proposition perpétuels
  rationale: Le référent cultuel est rendu clairement sans introduire dans le corps du texte un terme traditionnel peu transparent; la note conserve les formulations possibles.
- issue: Portée de לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: une obligation perpétuelle pour Israël
  alternative: Cela est pour toujours à la charge d’Israël
  rationale: Le texte présente ces observances comme une prescription durable pour Israël; la traduction garde explicitement ce destinataire.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme énumératif du texte cultuel est conservé, avec des reprises de « d’y » pour clarifier que les actes ont lieu dans la maison. « Voici » maintient la solennité de l’annonce.
