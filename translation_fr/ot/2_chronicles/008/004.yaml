source:
  edition: WLC
  text: וַ/יִּ֥בֶן אֶת תַּדְמֹ֖ר בַּ/מִּדְבָּ֑ר וְ/אֵת֙ כָּל עָרֵ֣י הַֽ/מִּסְכְּנ֔וֹת אֲשֶׁ֥ר בָּנָ֖ה בַּ/חֲמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: fr
  text: Il construisit Tadmor dans le désert[a], ainsi que toutes les villes-entrepôts qu’il construisit dans la région de Hamath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tadmor est traditionnellement identifiée à Palmyre.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il construisit
  rationale: Le wayyiqtol de בנה exprime ici une action passée dans la suite du récit. Le passé simple convient au registre narratif biblique soutenu en français sans imposer explicitement « puis » ou « et ».
- source_word: תַּדְמֹר
  choice: Tadmor
  rationale: Le nom propre hébreu est translittéré plutôt que remplacé par la forme gréco-latine postérieure « Palmyre ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région désertique ou peu habitée. « Désert » est ici naturel en français et correspond bien au cadre géographique, sans nécessairement évoquer uniquement des dunes de sable.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: toutes les villes-entrepôts
  rationale: Le syntagme désigne des villes servant au stockage de provisions ou de ressources. « Villes-entrepôts » exprime clairement cette fonction administrative en français moderne.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il construisit
  rationale: La proposition relative se rapporte directement aux villes-entrepôts et reprend simplement le verbe בנה.
- source_word: בַּחֲמָת
  choice: dans la région de Hamath
  rationale: La préposition ב peut indiquer ici la localisation dans le territoire dépendant de Hamath. L’ajout explicatif « la région de » donne un français naturel tout en évitant de suggérer que plusieurs villes se trouvaient à l’intérieur de la seule ville de Hamath.
