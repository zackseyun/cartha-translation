id: 2CH.8.12
reference: 2 Chronicles 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: fr
  text: Alors Salomon offrit des holocaustes à Yahweh sur l’autel de Yahweh qu’il avait construit devant le vestibule[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le portique » ou « le porche ». Le mot hébreu désigne le hall d’entrée du Temple.
    reason: Alternative lexicale pour אוּלָם, dont plusieurs équivalents architecturaux français sont possibles.
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: הֶעֱלָה
  choice: offrit
  rationale: Dans ce contexte sacrificiel, le hifil de עלה signifie offrir un sacrifice; « offrit » est idiomatique, tandis que l’idée de combustion est déjà portée par « holocaustes ».
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: עֹלוֹת
  choice: des holocaustes
  rationale: Terme français établi pour les sacrifices entièrement consumés; il rend précisément le sens cultuel de עֹלָה.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique ici le destinataire ou la dédicace du sacrifice; le nom divin est rendu explicitement par « Yahweh ».
- source_word: עַל מִזְבַּח יְהוָה
  choice: sur l’autel de Yahweh
  rationale: Rend directement la relation spatiale et la chaîne construite hébraïque.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il avait construit
  rationale: Le plus-que-parfait indique naturellement que la construction de l’autel précède l’offrande.
- source_word: לִפְנֵי הָאוּלָם
  choice: devant le vestibule
  rationale: Rend la position de l’autel par rapport au hall d’entrée du Temple; « vestibule » conserve la précision architecturale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque sans produire de tournure artificielle; le terme cultuel « holocaustes » est conservé en raison de sa précision biblique.
