  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: fr
  text: Quant aux villes que Houram avait données à Salomon, Salomon les reconstruisit[a] et y installa des Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les bâtit ». Le verbe hébreu peut signifier « bâtir » ou, dans ce contexte, « reconstruire, remettre en état ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: Quant aux villes
  rationale: La conjonction introduit ici un nouvel élément du résumé narratif. « Quant aux villes » rend naturellement cette transition et conserve la mise en relief du groupe nominal défini.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronom relatif introduisant la proposition qui précise quelles villes sont concernées.
- source_word: נָתַן
  choice: avait données
  rationale: Dans cette proposition rétrospective, le plus-que-parfait marque clairement que le don précède les travaux de Salomon. Le participe passé s’accorde avec l’objet direct féminin pluriel placé avant l’auxiliaire.
- source_word: חוּרָם
  choice: Houram
  rationale: Cette forme française translittère le nom hébreu חוּרָם, plutôt que de lui substituer la forme traditionnelle Hiram.
- source_word: לִשְׁלֹמֹה
  choice: à Salomon
  rationale: La préposition ל marque ici le destinataire du don.
- source_word: בָּנָה
  choice: reconstruisit
  rationale: Le sens fondamental est « bâtir », mais puisqu’il s’agit de villes déjà existantes et données à Salomon, « reconstruire » exprime naturellement une remise en état ou un réaménagement. Une note conserve le sens plus général possible.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux villes.
- source_word: וַיּוֹשֶׁב
  choice: y installa
  rationale: 'Le hiphil de ישׁב est causatif : Salomon fit habiter des personnes dans ces villes. « Y installa » rend ce sens de façon concise et idiomatique.'
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial renvoie naturellement aux villes en français.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais désigne ici des membres du peuple d’Israël. « Des Israélites » est naturel et évite de suggérer que seuls des hommes sont visés.
