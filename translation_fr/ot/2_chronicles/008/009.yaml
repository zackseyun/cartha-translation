source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: fr
  text: Mais, parmi les fils d’Israël, Salomon ne fit pas d’eux des esclaves pour ses travaux[a], car c’étaient des hommes de guerre, ses officiers[b], les chefs de ses chars et ses cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour son travail » ou « pour son service ». Il s’agit ici des travaux assignés par Salomon.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne probablement des officiers militaires d’élite ou des aides de haut rang ; sa fonction précise est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: Mais, parmi les fils d’Israël
  rationale: Le contexte crée un contraste avec les populations assujetties au travail forcé au verset précédent. « Parmi » rend naturellement la valeur partitive de מִן, tandis que « fils d’Israël » conserve l’expression hébraïque.
- source_word: לֹא נָתַן שְׁלֹמֹה לַעֲבָדִים
  choice: Salomon n’en fit pas des esclaves
  rationale: La construction signifie que Salomon ne plaça aucun Israélite dans la condition d’esclave ou dans le travail servile. Le pronom « en » reprend correctement le groupe partitif « parmi les fils d’Israël ».
- source_word: לִמְלַאכְתּוֹ
  choice: pour ses travaux
  rationale: Le pluriel français évoque naturellement les entreprises et travaux royaux auxquels la main-d’œuvre était affectée, sans limiter le terme à une tâche particulière.
- source_word: כִּי הֵמָּה
  choice: car c’étaient
  rationale: Cette formulation conserve la relation explicative et s’accorde naturellement avec l’énumération de fonctions militaires.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: des hommes de guerre
  rationale: Rendu proche de l’idiome hébreu, clair dans un récit historique et plus texturé que « soldats ».
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: ses officiers
  rationale: שָׁלִישׁ désigne vraisemblablement un officier militaire d’élite ou un aide de haut rang, mais sa fonction exacte demeure incertaine. « Officiers » évite une précision injustifiée.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: les chefs de ses chars
  rationale: La formule désigne les responsables du corps de chars. « Chefs » exprime l’autorité sans répéter « officiers ».
- source_word: וּפָרָשָׁיו
  choice: ses cavaliers
  rationale: Dans ce contexte militaire, « cavaliers » est le terme français moderne et précis pour les hommes combattant à cheval.
theological_decisions:
- issue: Statut imposé aux Israélites
  choice: des esclaves
  alternative: des serviteurs / des travailleurs forcés
  rationale: Le terme עֲבָדִים et le contraste avec le travail servile du contexte justifient « esclaves ». Cette traduction ne minimise pas la condition visée et n’ajoute aucune harmonisation théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe partitive française évite le calque maladroit « des fils d’Israël, Salomon ne fit pas… ». Le vocabulaire militaire reste précis sans donner au terme שָׁלִישׁ un sens plus déterminé que ne le permet l’hébreu.
