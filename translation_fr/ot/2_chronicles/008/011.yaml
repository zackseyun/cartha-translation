  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: fr
  text: 'Salomon fit monter la fille du pharaon de la Cité de David jusqu’à la maison qu’il avait bâtie pour elle. Il avait dit : « Ma femme n’habitera pas dans la maison de David, roi d’Israël, car les lieux[a] où l’arche de Yahweh est entrée sont saints. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement, avec un pronom pluriel sans antécédent nominal exprimé : « car ils sont saints, auxquels l’arche de Yahweh est entrée ». « Les lieux » explicite ce référent implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: fit monter
  rationale: Le hifil de עלה exprime le fait de faire monter ou d’amener vers le haut. « Fit monter » conserve clairement cette nuance directionnelle.
- source_word: מֵעִיר דָּוִיד
  choice: de la Cité de David
  rationale: Rendu géographique direct et consacré en français biblique moderne.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: jusqu’à la maison qu’il avait bâtie pour elle
  rationale: בַּיִת peut désigner une maison ou une résidence royale. « Maison » reste lexicalement transparent, et le plus-que-parfait marque naturellement l’antériorité de la construction.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Ma femme n’habitera pas
  rationale: אִשָּׁה signifie ici « femme » au sens d’épouse, puisque Salomon parle de la fille du pharaon et de sa propre situation conjugale. « Habiter » exprime le sens résidentiel de ישׁב.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: dans la maison de David, roi d’Israël
  rationale: « Maison » préserve le lexème בַּיִת sans imposer « palais »; les virgules rendent l’apposition naturelle en français.
- source_word: קֹדֶשׁ הֵמָּה
  choice: sont saints
  rationale: Le prédicat hébreu porte sur un référent pluriel implicite; l’accord masculin pluriel correspond aux « lieux » explicités en français.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: les lieux où l’arche de Yahweh est entrée
  rationale: Le pronom pluriel אֲלֵיהֶם appelle un antécédent pluriel implicite, explicité sobrement par « les lieux ». Le verbe au féminin singulier s’accorde avec « arche »; « est entrée » conserve le mouvement exprimé par בוא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre attesté par le tétragramme plutôt que de lui substituer un titre.
theological_decisions:
- issue: Référent pluriel implicite dans la justification liée à la sainteté
  choice: Expliciter le référent par « les lieux »
  alternative: Traduire plus littéralement « car ils sont saints, ceux où… », ou comprendre globalement la maison de David comme sainte
  rationale: L’hébreu emploie הֵמָּה et אֲלֵיהֶם au pluriel sans antécédent nominal exprimé. « Les lieux » rend l’ellipse intelligible sans préciser davantage leur étendue ni résoudre au-delà du texte la nature exacte de leur sainteté.
- issue: Sens de אִשָּׁה dans la parole de Salomon
  choice: « ma femme » au sens d’épouse
  alternative: « une femme à moi » ou simplement « une femme »
  rationale: Le contexte immédiat identifie la fille du pharaon, épouse de Salomon. « Ma femme » est idiomatique et conserve cette référence particulière sans transformer la déclaration en interdiction générale visant toutes les femmes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant une formulation obscure. « Cité de David » est retenu comme nom géographique traditionnel; « maison » maintient l’écho lexical entre les deux résidences.
