  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הַ/חִתִּ֜י וְ/הָ/אֱמֹרִ֤י וְ/הַ/פְּרִזִּי֙ וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹ֥א מִ/יִּשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: fr
  text: Quant à tous ceux qui restaient d’entre les Hittites, les Amorites, les Perizzites, les Hivvites et les Jébusites, et qui n’étaient pas d’Israël[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui n’étaient pas Israélites ». L’hébreu dit plus littéralement : « qui n’étaient pas d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: tous ceux
  rationale: Cette tournure rend naturellement en français la totalité de la population non israélite visée, sans employer le peu idiomatique « tout le peuple » dans ce contexte.
- source_word: הַנּוֹתָר
  choice: qui restaient
  rationale: Le participe niphal désigne ceux qui subsistaient ou demeuraient après les événements antérieurs; « qui restaient » est clair et naturel.
- source_word: מִן
  choice: parmi
  rationale: Avec l’énumération des peuples, « parmi » exprime idiomatiquement que les survivants provenaient de ces groupes, tout en évitant l’ambiguïté française de « restaient des Hittites ».
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: les Hittites, les Amorites, les Perizzites, les Hivvites et les Jébusites
  rationale: Les formes hébraïques singulières ont ici un sens collectif; les pluriels sont idiomatiques en français. Ces translittérations modernes permettent aussi de distinguer clairement les cinq peuples.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: qui n’étaient pas d’Israël
  rationale: La formulation conserve la préposition מִן et l’expression concise de l’hébreu, sans préciser davantage s’il s’agit d’origine ou d’appartenance.
theological_decisions:
- issue: Portée de « pas d’Israël »
  choice: Conserver la formulation « qui n’étaient pas d’Israël »
  alternative: « qui n’étaient pas Israélites »
  rationale: L’hébreu emploie une préposition plutôt qu’un gentilé. La traduction retenue préserve cette nuance et évite de trancher entre origine ethnique et appartenance au peuple.
translation_notes:
  register: Français international actuel, clair et digne. Le tiret final est maintenu parce que la phrase se poursuit au verset suivant.
