id: 2CH.8.16
reference: 2 Chronicles 8:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: fr
  text: Ainsi, tout le travail de Salomon fut mené à bien, depuis le jour où furent posées les fondations de la maison de Yahweh jusqu’à son achèvement[a]. La maison de Yahweh était donc achevée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à son achèvement ». Le suffixe peut renvoyer à la maison de Yahweh, son antécédent immédiat, ou plus largement au travail entrepris.'
    reason: ambiguïté_référentielle
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: fut mené à bien
  rationale: Le niphal de כון exprime ici un résultat établi ou préparé. Dans ce bilan des travaux, « fut mené à bien » rend naturellement leur mise en ordre et leur heureuse réalisation sans réduire le verbe au seul acte d’achever.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: tout le travail de Salomon
  rationale: מְלָאכָה désigne largement le travail ou l’entreprise; la formulation française englobe l’ensemble du projet royal.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: depuis le jour où furent posées les fondations de la maison de Yahweh jusqu’à son achèvement
  rationale: La tournure restitue la période comprise entre la fondation et l’achèvement. « Furent posées les fondations » explicite naturellement le nom מוּסַד, tandis que le possessif de כְּלֹתוֹ est rapporté à la maison.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque, même si le référent est le temple; Yahweh transcrit le nom divin personnel.
- source_word: שָׁלֵם בֵּית יְהוָה
  choice: La maison de Yahweh était donc achevée
  rationale: שָׁלֵם décrit l’état complet de l’édifice. « Était achevée » conserve cette valeur résultative; « donc » rend la portée récapitulative de la proposition française sans prétendre traduire un connecteur distinct.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Référent du suffixe dans כְּלֹתוֹ
  choice: l’achèvement de la maison de Yahweh
  alternative: l’achèvement du travail de Salomon
  rationale: L’antécédent masculin singulier immédiat est בֵּית, « maison », mais la syntaxe peut aussi être comprise dans le cadre plus large de l’ouvrage; la note signale cette légère ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « maison de Yahweh » est conservée pour refléter l’insistance du texte hébreu. « Temple » n’est pas substitué à l’image littérale de la maison.
