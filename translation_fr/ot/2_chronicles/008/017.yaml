source:
  edition: WLC
  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: fr
  text: Alors Salomon se rendit à Étsion-Guéber et à Éloth[a], au bord de la mer, dans le pays d’Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éloth est aussi appelé Élat ou Élath dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marqueur temporel qui fait progresser le récit; « Alors » est naturel et fidèle à la succession des événements.
- source_word: הָלַךְ
  choice: se rendit
  rationale: Dans ce contexte de déplacement vers des lieux précis, « se rendit » exprime naturellement le sens de « aller » sans suggérer qu’il voyagea à pied.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: à Étsion-Guéber
  rationale: Translittération française transparente du nom de lieu composé, avec la préposition indiquant la destination.
- source_word: וְאֶל אֵילוֹת
  choice: et à Éloth
  rationale: La conjonction et la préposition sont conservées; « Éloth » suit de près la forme hébraïque אֵילוֹת.
- source_word: עַל שְׂפַת הַיָּם
  choice: au bord de la mer
  rationale: Expression française idiomatique qui conserve l’image spatiale de la « lèvre » ou lisière de la mer.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: dans le pays d’Édom
  rationale: La traduction garde explicitement אֶרֶץ, « pays », plutôt que de réduire l’expression à « en Édom ».
