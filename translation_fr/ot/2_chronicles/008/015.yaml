    rationale: Dans « ni de ce qui concernait les trésors », le complément introduit par « ni de » paraît dépendre de « s’écartèrent », plutôt que de compléter clairement le domaine de l’ordre royal. Le texte hébreu ajoute les trésors comme domaine final pertinent, et une formulation parallèle plus explicite le restitue mieux.
