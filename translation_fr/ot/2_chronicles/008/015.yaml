    rationale: La formule « les biens mis en réserve » ne correspond pas de manière suffisamment précise à la nuance institutionnelle possible de אֹצָרוֹת, qui peut désigner des trésoreries ou des entrepôts/magasins. Une note plus sobre préserve mieux l’ambiguïté.
