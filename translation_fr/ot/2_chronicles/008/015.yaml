  text: וְ/לֹ֣א סָרוּ֩ מִצְוַ֨ת הַ/מֶּ֜לֶךְ עַל הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם לְ/כָל דָּבָ֖ר וְ/לָ/אֹצָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: fr
  text: Ils ne s’écartèrent pas de l’ordre du roi concernant les prêtres et les lévites, en aucune affaire ni au sujet des trésors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les réserves » ou « les magasins ». Le terme hébreu peut désigner des trésoreries ou des lieux d’entreposage.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: ne s’écartèrent
  rationale: Le verbe סור signifie « s’écarter », « se détourner » ou « dévier ». Cette formulation conserve l’image hébraïque tout en exprimant naturellement l’obéissance à un ordre.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: l’ordre du roi
  rationale: מִצְוָה désigne ici une prescription royale dans un contexte administratif. « Ordre » est plus naturel en français moderne que « commandement » dans ce cadre.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: concernant les prêtres et les lévites
  rationale: עַל introduit ici le domaine visé par l’ordre. La répétition de l’article hébreu distingue les deux groupes; le français « les prêtres et les lévites » maintient cette distinction.
- source_word: לְכָל דָּבָר
  choice: en rien
  rationale: Dans cette proposition négative, l’expression signifie qu’ils ne dévièrent dans aucun domaine. « En rien » est idiomatique, concis et fidèle à la portée globale de l’hébreu.
- source_word: וְלָאֹצָרוֹת
  choice: ni de ce qui concernait les trésors
  rationale: La coordination négative française avec « ni » rend naturellement le וְ hébreu après « ne… en rien ». אֹצָרוֹת peut désigner les trésors, les réserves ou leurs locaux; « trésors » convient au contexte administratif du temple sans éliminer l’autre possibilité, signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la distinction entre prêtres et lévites ainsi que l’étendue totale de leur obéissance, tout en évitant un calque maladroit de la syntaxe hébraïque.
