  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: fr
  text: Il bâtit Beth-Horôn-la-Haute et Beth-Horôn-la-Basse, villes fortifiées[a], avec des murailles, des portes[b] et des barres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « villes fortes ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne des portes ; il s’agit probablement des battants des portes donnant accès aux villes fortifiées.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des verrous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le verbe בנה désigne ici simplement l’action de bâtir. Le contexte précise ensuite qu’il s’agit de villes fortifiées, sans imposer le sens « rebâtir ».
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Beth-Horôn-la-Haute
  rationale: Le nom de lieu est translittéré, et l’adjectif indiquant l’altitude est rendu sous la forme française naturelle employée pour distinguer les deux localités.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Beth-Horôn-la-Basse
  rationale: Cette formulation parallèle distingue naturellement la localité située plus bas de Beth-Horôn-la-Haute.
- source_word: עָרֵי מָצוֹר
  choice: villes fortifiées
  rationale: L’expression désigne des villes pourvues de défenses. « Villes fortifiées » est clair, naturel et fidèle au sens militaire.
- source_word: חוֹמוֹת
  choice: avec des murailles
  rationale: Dans le contexte de fortifications urbaines, « murailles » rend plus précisément les murs défensifs que le terme général « murs ».
- source_word: דְּלָתַיִם
  choice: des portes
  rationale: Le mot hébreu signifie littéralement « portes » ou « battants », et non le terme habituel désignant une porte urbaine dans son ensemble. Il s’agit vraisemblablement des portes fermant les accès fortifiés.
- source_word: וּבְרִיחַ
  choice: et des barres
  rationale: Le nom désigne une barre servant à maintenir des portes fermées. « Barres » conserve l’image concrète et convient au contexte défensif.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms géographiques sont translittérés avec l’accent circonflexe et les qualificatifs d’altitude sont intégrés au nom. La structure appositionnelle de l’hébreu est conservée dans une formulation française fluide.
