  text: וְ/אֵ֨לֶּה שָׂרֵ֤י ה/נציבים אֲשֶׁר לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם הָ/רֹדִ֖ים בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: fr
  text: 'Voici les chefs des fonctionnaires du roi Salomon : deux cent cinquante, qui exerçaient leur autorité sur le peuple.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui dirigeaient le peuple » ou « qui supervisaient le peuple » ; le verbe hébreu désigne ici l’exercice d’une autorité, vraisemblablement administrative.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement, dans un récit historique, l’identification et le dénombrement du groupe.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: les chefs des fonctionnaires
  rationale: שָׂרֵי indique ici des responsables de rang supérieur, tandis que נְצִיבִים désigne des agents nommés sous l’autorité royale. Cette formulation conserve la hiérarchie administrative sans imposer un sens militaire.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: du roi Salomon
  rationale: Rend de manière concise et naturelle la relation d’appartenance ou de service exprimée par la construction hébraïque.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: deux cent cinquante
  rationale: Rendu français standard du nombre hébreu.
- source_word: הָרֹדִים בָּעָם
  choice: qui exerçaient leur autorité sur le peuple
  rationale: רדה exprime l’exercice d’un pouvoir ou d’une domination. Dans ce cadre administratif, cette formulation garde l’idée d’autorité sans suggérer nécessairement une oppression.
theological_decisions: []
