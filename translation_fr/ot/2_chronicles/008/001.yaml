  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: fr
  text: Au bout de vingt ans, pendant lesquels Salomon avait construit la maison de Yahweh et sa propre maison[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son palais ». L’hébreu dit littéralement « sa maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Au bout de
  rationale: La formule narrative וַיְהִי introduit le nouveau développement, tandis que מִקֵּץ situe celui-ci à l’achèvement de la période. En français, « Au bout de » exprime naturellement l’ensemble sans recourir au lourd « Il arriva qu’au bout de ».
- source_word: עֶשְׂרִים שָׁנָה
  choice: vingt ans
  rationale: Traduction directe et idiomatique de l’expression temporelle.
- source_word: אֲשֶׁר בָּנָה
  choice: pendant lesquels Salomon avait construit
  rationale: « Pendant lesquels » rattache clairement l’activité de construction à la période de vingt ans; le plus-que-parfait indique qu’elle est considérée comme accomplie au terme de cette période.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image et le terme hébreux, plutôt que de les expliciter par « temple »; le nom divin est translittéré « Yahweh ».
- source_word: בֵּיתוֹ
  choice: sa propre maison
  rationale: « Sa propre maison » rend le possessif et souligne naturellement le contraste avec la maison de Yahweh, tout en conservant le sens lexical de בַּיִת.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Désignation de la résidence de Salomon
  choice: sa propre maison
  alternative: son palais
  rationale: Le contexte permet de comprendre qu’il s’agit du palais royal, mais l’hébreu dit littéralement « sa maison ». Le texte principal conserve ce terme et la note signale l’interprétation contextuelle.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase reste ouverte par une virgule, conformément à la syntaxe du verset, qui se poursuit au verset suivant.
