  text: וַ/יִּֽשְׁלַֽח ל/וֹ֩ חוּרָ֨ם בְּ/יַד עֲבָדָ֜י/ו אוניות וַ/עֲבָדִים֮ י֣וֹדְעֵי יָם֒ וַ/יָּבֹ֜אוּ עִם עַבְדֵ֤י שְׁלֹמֹה֙ אוֹפִ֔ירָ/ה וַ/יִּקְח֣וּ מִ/שָּׁ֔ם אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים כִּכַּ֣ר זָהָ֑ב וַ/יָּבִ֖יאוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: fr
  text: Houram lui envoya, par l’intermédiaire de ses serviteurs[a], des navires ainsi que des serviteurs qui connaissaient bien la mer[b]. Ces serviteurs allèrent avec les serviteurs de Salomon à Ophir. Ils y prirent 450 talents d’or, qu’ils apportèrent au roi Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de ses serviteurs » ; cette expression hébraïque signifie ici « par l’intermédiaire de ses serviteurs ».'
    reason: cultural_note
  - marker: b
    text: 'Ou : « des serviteurs expérimentés dans la navigation », voire simplement « des marins ». L’hébreu dit littéralement : « des serviteurs connaissant la mer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּרָם
  choice: Houram
  rationale: Translittération française de la forme hébraïque employée ici, distincte de la variante traditionnelle « Hiram ».
- source_word: בְּיַד עֲבָדָיו
  choice: par l’intermédiaire de ses serviteurs
  rationale: Rend naturellement l’expression hébraïque d’agence, littéralement « par la main de ses serviteurs », sans donner à penser qu’ils portaient matériellement les navires.
- source_word: אוניות
  choice: des navires
  rationale: Le contexte d’une expédition maritime vers Ophir appelle des bâtiments de mer ; « navires » convient au registre historique et narratif.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: des serviteurs qui connaissaient bien la mer
  rationale: Préserve à la fois leur statut explicite de serviteurs et leur expérience maritime, au lieu de réduire l’expression au seul terme « marins ».
- source_word: אוֹפִירָה
  choice: à Ophir
  rationale: Le hé directionnel indique un mouvement vers Ophir, exprimé naturellement en français par « à Ophir » après le verbe aller.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: 450 talents d’or
  rationale: Conserve l’unité de poids ancienne sans imposer une conversion moderne approximative.
- source_word: וַיִּקְחוּ מִשָּׁם ... וַיָּבִיאוּ
  choice: Ils y prirent… qu’ils apportèrent
  rationale: Reproduit les deux actions successives du récit hébreu tout en évitant un pronom français ambigu pour l’or.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe et des distinctions lexicales de l’hébreu, tout en explicitant naturellement l’expression d’agence. Les chiffres arabes facilitent la lecture sans modifier le contenu.
