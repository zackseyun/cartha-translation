source:
  edition: WLC
  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: fr
  text: 'Il offrait ce qui était prescrit pour chaque jour[a], conformément au commandement de Moïse, pour les sabbats, les nouvelles lunes et les fêtes fixées, trois fois par an : à la fête des Pains sans levain, à la fête des Semaines[b] et à la fête des Huttes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon l’affaire de chaque jour en son jour ».'
    reason: lexical_alternative
  - marker: b
    text: La fête des Semaines a reçu plus tard, dans l’usage grec, le nom de « Pentecôte ».
    reason: cross_reference
  - marker: c
    text: On dit aussi « fête des Tabernacles »; le mot hébreu signifie « huttes » ou « abris ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: ce qui était prescrit pour chaque jour
  rationale: L’expression signifie littéralement « l’affaire d’un jour en son jour » et désigne ici ce qui devait être offert selon le calendrier quotidien. Cette formulation rend naturellement la prescription sans effacer l’idiome, signalé en note.
- source_word: לְהַעֲלוֹת
  choice: Il offrait
  rationale: Dans ce contexte cultuel, le hifil de עלה désigne l’action de faire monter une offrande, donc de l’offrir. Le verbe français « offrir » convient naturellement; l’objet est fourni par le contexte du verset précédent.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: conformément au commandement de Moïse
  rationale: Cette traduction conserve explicitement l’idée de prescription mosaïque et son autorité.
- source_word: לַשַּׁבָּתוֹת
  choice: pour les sabbats
  rationale: La préposition indique les occasions auxquelles les offrandes étaient destinées.
- source_word: וְלֶחֳדָשִׁים
  choice: les nouvelles lunes
  rationale: Dans le vocabulaire du calendrier cultuel, חֳדָשִׁים désigne ici les célébrations de la nouvelle lune, et non simplement les mois.
- source_word: וְלַמּוֹעֲדוֹת
  choice: les fêtes fixées
  rationale: מוֹעֲדִים désigne des temps déterminés; la suite précise qu’il s’agit des trois grandes fêtes annuelles. « Fêtes fixées » garde les deux dimensions.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: trois fois par an
  rationale: Formulation française directe et exacte de l’expression temporelle.
- source_word: בְּחַג הַמַּצּוֹת
  choice: à la fête des Pains sans levain
  rationale: Rend directement le nom hébreu de cette fête de pèlerinage.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: à la fête des Semaines
  rationale: Le texte hébreu nomme la fête d’après les semaines; « Pentecôte » est une appellation grecque plus tardive, indiquée en note.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: à la fête des Huttes
  rationale: סֻכּוֹת désigne concrètement des huttes ou abris temporaires. « Huttes » est transparent en français moderne; l’appellation traditionnelle est donnée en note.
theological_decisions:
- issue: Désignation des trois fêtes annuelles d’Israël
  choice: fête des Pains sans levain / fête des Semaines / fête des Huttes
  alternative: Pâque / Pentecôte / fête des Tabernacles
  rationale: Le texte hébreu nomme directement ces fêtes. La traduction principale conserve ces désignations plutôt que d’introduire des appellations grecques ou ecclésiastiques ultérieures; les équivalents traditionnels utiles figurent en notes.
translation_notes:
  register: Français international moderne, digne et accessible. Le début est formulé comme la continuation syntaxique du verset précédent; « offrait » explicite la valeur sacrificielle du verbe hébreu sans ajouter « sacrifices » lorsque le contexte immédiat fournit déjà l’objet. Les noms des fêtes restent transparents et proches de l’hébreu.
