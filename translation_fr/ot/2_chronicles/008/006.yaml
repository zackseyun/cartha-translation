  text: וְ/אֶֽת בַּעֲלָ֗ת וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ כָּל עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת כָּל חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירֽוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: fr
  text: ainsi que Baalath, toutes les villes-entrepôts[a] qui appartenaient à Salomon, toutes les villes de chars, les villes des cavaliers[b], et tout ce que Salomon avait désiré bâtir[c] à Jérusalem, au Liban et dans tout le territoire de sa domination.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « villes de stockage », « villes de ravitaillement » ou, peut-être, « villes du trésor ».
    reason: lexical_alternative
  - marker: b
    text: Ou « villes pour les chevaux » ; le terme hébreu désigne toutefois plus couramment des cavaliers ou la cavalerie.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tout le désir de Salomon qu’il désira bâtir » ; l’hébreu emploie un nom et un verbe de même racine pour souligner son désir ou son bon plaisir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Baalath
  rationale: Nom de lieu conservé par translittération, avec une forme aisément reconnaissable dans la tradition biblique française.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: villes-entrepôts
  rationale: Désigne des villes servant au stockage de provisions ou de ressources; cette formulation est concise et actuelle.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: qui appartenaient à Salomon
  rationale: Rend naturellement la construction hébraïque de possession sans préciser indûment la nature administrative de ce lien.
- source_word: עָרֵי הָרֶכֶב
  choice: villes de chars
  rationale: Conserve l’expression compacte de l’hébreu pour des villes associées aux chars et à leur infrastructure.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: villes des cavaliers
  rationale: פָּרָשִׁים désigne normalement des cavaliers; la formulation reste proche de la structure hébraïque.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: tout ce que Salomon désirait
  rationale: Rend idiomatiquement la construction hébraïque associant un nom et un verbe de même racine, sans répétition artificielle en français.
- source_word: לִבְנוֹת
  choice: bâtir
  rationale: Le verbe signifie simplement bâtir ou construire; le contexte immédiat n’impose pas le sens de rebâtir.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: dans tout le territoire soumis à sa domination
  rationale: Préserve à la fois le sens territorial de אֶרֶץ et celui d’autorité politique exprimé par מֶמְשָׁלָה.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve son caractère de continuation par « ainsi que ». Les termes administratifs et militaires restent proches de l’hébreu, tandis que la construction redondante exprimant le désir est rendue idiomatiquement et signalée en note.
