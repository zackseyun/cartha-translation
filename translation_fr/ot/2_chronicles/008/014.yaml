source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: fr
  text: Conformément à la règle de David, son père, il établit les classes des prêtres pour leur service, les lévites pour leurs fonctions — afin de louer et de servir devant les prêtres, selon ce qui était prescrit pour chaque jour[a] —, et les gardiens des portes selon leurs classes, porte par porte; car tel était le commandement de David, l’homme de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon l’affaire d’un jour en son jour », c’est-à-dire selon ce qui était fixé pour chaque journée.'
    reason: La note conserve la forme de l’expression idiomatique hébraïque derrière sa traduction naturelle.
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Il établit
  rationale: Le hifil de עמד exprime ici la mise en place de personnes dans une organisation cultuelle; « établit » garde cette valeur causative et administrative.
- source_word: כְּמִשְׁפַּט
  choice: conformément à la règle
  rationale: Dans ce contexte, מִשְׁפָּט désigne une disposition normative plutôt qu’un jugement judiciaire. « Règle » est clair et naturel en français moderne.
- source_word: מַחְלְקוֹת
  choice: les classes
  rationale: Le terme désigne les unités organisées auxquelles prêtres et gardiens étaient affectés à tour de rôle. « Classes » conserve le sens institutionnel traditionnel tout en restant compréhensible.
- source_word: עַל עֲבֹדָתָם
  choice: pour leur service
  rationale: Cette expression indique le domaine de service assigné aux prêtres et conserve la nuance cultuelle de עֲבֹדָה.
- source_word: מִשְׁמְרוֹתָם
  choice: dans leurs fonctions
  rationale: Le mot peut évoquer des charges, des postes ou des responsabilités assignées. « Fonctions » convient à l’organisation des lévites sans imposer l’idée plus étroite de tours de garde.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: afin qu’ils louent et servent
  rationale: La formulation rend les deux infinitifs de but. « Servent » reste suffisamment large pour conserver la portée cultuelle de שרת sans ajouter un objet absent de l’hébreu.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: devant les prêtres
  rationale: « Devant » rend directement la valeur spatiale et relationnelle de נֶגֶד, sans trancher davantage la nature exacte de la collaboration entre lévites et prêtres.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: selon ce qui était prescrit pour chaque jour
  rationale: Cette tournure française exprime naturellement l’exigence propre à chaque journée tout en reflétant le caractère réglé du service.
- source_word: הַשּׁוֹעֲרִים
  choice: les gardiens des portes
  rationale: Cette expression actuelle décrit clairement les personnes chargées de surveiller et de desservir les portes du temple.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: porte par porte
  rationale: Le redoublement distributif hébreu est bien rendu par cette expression française concise.
- source_word: מִצְוַת
  choice: le commandement
  rationale: Le terme désigne une prescription revêtue d’autorité; « commandement » en maintient la force formelle.
theological_decisions:
- issue: Désignation de David comme père de Salomon
  choice: David, son père
  alternative: David, son ancêtre
  rationale: Bien que אָב puisse parfois désigner un ancêtre, David est ici réellement le père de Salomon. Le sens direct convient donc sans qu’une expansion interprétative soit nécessaire.
- issue: Relation des lévites avec les prêtres
  choice: servir devant les prêtres
  alternative: servir aux côtés des prêtres
  rationale: נֶגֶד indique d’abord une position « devant » ou « en présence de ». La traduction retenue préserve cette formulation et n’explicite pas une relation hiérarchique ou collégiale que le verset ne définit pas entièrement.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe a été légèrement répartie en deux phrases pour éviter une période excessivement lourde, sans modifier la succession des dispositions. Le vocabulaire cultuel demeure précis, mais évite les archaïsmes tels que « portiers » ou « desservants ».
