base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: fr
  text: Parmi leurs descendants qui étaient restés après eux dans le pays — ceux que les Israélites n’avaient pas exterminés[a] —, Salomon les réquisitionna pour les travaux forcés[b], et il en est ainsi jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ne les avaient pas exterminés ». « Les fils d’Israël » est une désignation collective courante du peuple d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour la corvée ». Le terme hébreu désigne un service de travail obligatoire imposé par l’État.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: Parmi leurs descendants
  rationale: Dans ce contexte généalogique et collectif, בְּנֵיהֶם désigne leurs descendants plutôt que seulement leurs fils; « parmi » rend naturellement le מִן partitif.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: qui étaient restés après eux
  rationale: Cette formulation conserve le sens de survivance ou de reste exprimé par נותר ainsi que la relation temporelle marquée par אַחֲרֵיהֶם.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: « Le pays » est idiomatique en français dans ce cadre territorial et historique.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: ceux que les Israélites n’avaient pas exterminés
  rationale: Au piel, כלה peut signifier achever, anéantir ou exterminer. « Exterminés » convient au contexte tout en gardant la force du verbe; « les Israélites » rend naturellement la désignation nationale littérale « les fils d’Israël ».
- source_word: וַיַּעֲלֵם שְׁלֹמֹה לְמַס
  choice: Salomon en réquisitionna pour les travaux forcés
  rationale: Avec לְמַס, la forme causative de עלה exprime ici l’imposition d’un service obligatoire. « Réquisitionna » restitue l’acte administratif, et le pronom « en » reprend naturellement le groupe partitif initial.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: et il en est ainsi jusqu’à ce jour
  rationale: La formule indique que la situation se prolonge jusqu’au temps du narrateur; l’ajout explicite de la continuité donne en français une phrase complète et naturelle.
