  text: וַ/יֵּ֤לֶךְ שְׁלֹמֹה֙ חֲמָ֣ת צוֹבָ֔ה וַ/יֶּחֱזַ֖ק עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/003.yaml
  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: fr
  text: Puis Salomon se rendit à Hamath-Tsoba et en prit le contrôle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’emporta sur elle » ou « la soumit ». L’expression hébraïque signifie littéralement « fut fort sur elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit à
  rationale: Le verbe הלך signifie simplement « aller ». « Se rendit à » reste naturel en français et n’ajoute pas à lui seul une idée d’attaque, que le verbe suivant suffit à exprimer.
- source_word: חֲמָת צוֹבָה
  choice: Hamath-Tsoba
  rationale: Les deux noms sont traités ici comme un toponyme composé. La translittération « Tsoba » représente naturellement le צ initial en français moderne.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: en prit le contrôle
  rationale: L’expression חזק על signifie littéralement « être fort sur/contre » et peut décrire le fait de l’emporter ou d’établir sa domination. Dans ce contexte royal et territorial, « en prit le contrôle » exprime clairement le résultat sans préciser indûment les modalités de la campagne.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique. Le pronom adverbial « en » évite une reprise lourde du toponyme, tandis que la note conserve les autres nuances possibles de l’idiome hébreu.
