source:
  edition: WLC
  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
translation:
  language: fr
  text: Je mettrai loin de vous celui du nord[a] et je le repousserai dans une terre aride et désolée. Son avant vers la mer orientale, et son arrière vers la mer occidentale[b]. Sa puanteur montera, son odeur infecte s’élèvera, car il a fait de grandes choses[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’armée du nord ». L’hébreu dit littéralement « celui du nord », au singulier, sous une forme personnifiée.
    reason: lexical_alternative
  - marker: b
    text: La « mer orientale » désigne probablement la mer Morte, et la « mer occidentale », la mer Méditerranée.
    reason: cultural_note
  - marker: c
    text: Ou « car il a agi avec arrogance ». L’hébreu dit littéralement « car il a fait de grandes choses » ; dans ce contexte, l’expression a probablement un sens négatif.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  choice: celui qui vient du nord
  rationale: L’expression hébraïque signifie littéralement « celui du nord » et présente au singulier une force hostile personnifiée. Cette formulation française reste naturelle sans préciser qu’il s’agit nécessairement d’une armée.
- source_word: אַרְחִיק
  choice: J’éloignerai ... de vous
  rationale: Le hifil de רחק exprime le fait de mettre à distance. « Éloigner de vous » rend clairement la valeur causative et spatiale.
- source_word: וְהִדַּחְתִּיו
  choice: je le repousserai
  rationale: Le hifil de נדח évoque une expulsion forcée. « Repousser » convient au déplacement de cette force hostile vers une région désolée.
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  choice: une terre aride et désolée
  rationale: « Aride » rend צִיָּה et « désolée » rend שְׁמָמָה, en conservant les deux aspects du paysage.
- source_word: פָּנָיו
  choice: son avant
  rationale: Littéralement « sa face », le mot désigne ici la partie antérieure, en opposition à סֹפוֹ. « Son avant » conserve la métaphore spatiale sans imposer le vocabulaire militaire « avant-garde ».
- source_word: הַיָּם הַקַּדְמֹנִי
  choice: la mer orientale
  rationale: La désignation hébraïque est directionnelle. Le texte principal la conserve, tandis que son identification géographique probable figure en note.
- source_word: סֹפוֹ
  choice: son arrière
  rationale: Le nom signifie « fin, extrémité » ; opposé à « son avant », il désigne naturellement la partie arrière ou la queue de la force personnifiée.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: la mer occidentale
  rationale: Littéralement « la mer de derrière », il s’agit de l’appellation directionnelle de la mer située à l’ouest. « Occidentale » en transmet le sens idiomatique.
- source_word: בָאְשׁוֹ
  choice: sa puanteur
  rationale: Le terme désigne une mauvaise odeur prononcée ; « puanteur » en conserve la force négative.
- source_word: צַחֲנָתוֹ
  choice: son odeur infecte
  rationale: Cette expression parallèle désigne elle aussi une odeur répugnante. Une formulation distincte préserve le parallélisme sans répétition plate.
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  choice: car il a accompli de grandes choses
  rationale: La traduction garde l’idiome hébreu, qui peut évoquer ici des actes démesurés ou arrogants, sans supprimer son ambiguïté lexicale ni son écho avec les grandes œuvres de Dieu dans le contexte.
theological_decisions:
- issue: Identité de « celui qui vient du nord »
  choice: Une force hostile personnifiée, laissée indéterminée dans le texte
  alternative: L’armée du nord ; une nation historique précise ; les sauterelles personnifiées ; un vent du nord
  rationale: Le singulier et les images corporelles favorisent une personnification, mais le verset ne permet pas à lui seul d’identifier définitivement cette force. La traduction évite donc de la réduire à une armée, une nation ou un phénomène naturel précis.
- issue: Sens de « il a accompli de grandes choses »
  choice: Conserver l’idiome hébreu dans le texte principal
  alternative: « car il a agi avec arrogance » ou « car il a commis des actes démesurés »
  rationale: Dans ce contexte de jugement, la formule a probablement une valeur négative, liée à l’arrogance ou à la démesure. Toutefois, le même idiome peut désigner positivement de grands actes, notamment ceux de Dieu. Le maintien de la formulation préserve cette tension, et la note indique le sens contextuel possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en deux phrases préserve la progression de l’expulsion vers ses conséquences. Les pronoms masculins maintiennent la personnification singulière de l’hébreu. Les désignations géographiques restent littérales dans le texte et sont explicitées en note.
