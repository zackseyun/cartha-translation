  to: Je mettrai loin de vous celui du nord[a] et je le repousserai dans une terre aride et désolée. Son avant vers la mer orientale, et son arrière vers la mer occidentale[b]. Sa puanteur montera, son odeur infecte s’élèvera, car il a fait de grandes choses[c].
