  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִסְפוּ עָ֞ם קַדְּשׁ֤וּ קָהָל֙ קִבְצ֣וּ זְקֵנִ֔ים אִסְפוּ֙ עֽוֹלָלִ֔ים וְ/יֹנְקֵ֖י שָׁדָ֑יִם יֵצֵ֤א חָתָן֙ מֵֽ/חֶדְר֔/וֹ וְ/כַלָּ֖ה מֵ/חֻפָּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
translation:
  language: fr
  text: Rassemblez le peuple, consacrez l’assemblée, réunissez les anciens[a]. Rassemblez les enfants, même les nourrissons[b]. Que le marié sorte de sa chambre, et la mariée de son dais nuptial[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les personnes âgées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui tètent les seins ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de sa chambre nuptiale ». Le terme hébreu peut désigner un dais de noces ou l’espace nuptial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: Rassemblez
  rationale: L’impératif pluriel appelle directement à faire venir la communauté; « rassemblez » est naturel et permet de conserver la répétition du verbe hébreu.
- source_word: עָם
  choice: le peuple
  rationale: Dans ce contexte, le nom désigne la communauté tout entière convoquée à une assemblée solennelle.
- source_word: קַדְּשׁוּ
  choice: consacrez
  rationale: Le piel impératif exprime ici la mise à part à des fins sacrées; « consacrez » maintient la portée cultuelle sans préciser un rite absent du texte.
- source_word: קָהָל
  choice: l’assemblée
  rationale: Le terme désigne la communauté réunie, notamment dans un cadre religieux ou communautaire.
- source_word: קִבְצוּ
  choice: réunissez
  rationale: Cet impératif est proche de אִסְפוּ mais emploie un autre verbe; « réunissez » garde une légère variation lexicale en français.
- source_word: זְקֵנִים
  choice: les anciens
  rationale: Dans ce cadre communautaire, le terme peut désigner les personnes âgées ou des responsables reconnus; « anciens » préserve au mieux cette double possibilité.
- source_word: עוֹלָלִים
  choice: les enfants
  rationale: Le terme renvoie à de jeunes enfants; le choix les distingue des nourrissons explicitement mentionnés ensuite.
- source_word: יֹנְקֵי שָׁדָיִם
  choice: les nourrissons
  rationale: L’expression signifie littéralement « ceux qui tètent les seins »; « nourrissons » en rend naturellement le sens en français moderne.
- source_word: יֵצֵא
  choice: Que … sorte
  rationale: La forme exprime ici une exhortation; la tournure française au subjonctif en restitue la force.
- source_word: חָתָן
  choice: le jeune marié
  rationale: Dans le contexte des noces, le terme désigne l’époux au moment du mariage; « jeune marié » forme une paire naturelle avec « jeune mariée ».
- source_word: מֵחֶדְרוֹ
  choice: de sa chambre
  rationale: חדר désigne une pièce intérieure ou une chambre; la formulation reste directe et accessible.
- source_word: כַלָּה
  choice: la jeune mariée
  rationale: Le terme désigne clairement l’épouse dans le contexte nuptial.
- source_word: מֵחֻפָּתָהּ
  choice: de son pavillon nuptial
  rationale: חֻפָּה peut désigner un dais ou pavillon de noces, voire par extension l’espace nuptial; le rendu conserve l’image distincte de la chambre du marié.
theological_decisions:
- issue: Portée cultuelle de קַדְּשׁוּ קָהָל
  choice: « consacrez l’assemblée »
  alternative: « sanctifiez la communauté » ou « préparez une assemblée sacrée »
  rationale: Le contexte est celui d’une convocation solennelle à caractère religieux. Le rendu choisi conserve cette dimension sans ajouter de procédure rituelle.
- issue: Sens social de זְקֵנִים
  choice: « les anciens »
  alternative: « les vieillards » ou « les personnes âgées »
  rationale: L’hébreu peut viser l’âge ou le statut communautaire. « Anciens » garde cette tension mieux qu’un terme exclusivement lié à l’âge ou à une fonction institutionnelle.
- issue: Inclusion de tous malgré les obligations familiales et nuptiales
  choice: Conserver l’appel explicite aux enfants, aux nourrissons et aux nouveaux mariés
  alternative: Généraliser en parlant de « tout le monde »
  rationale: L’énumération concrète souligne l’urgence et l’universalité de la convocation; elle ne doit pas être aplatie par une paraphrase.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les impératifs brefs conservent le rythme pressant de la convocation. La répétition de « rassemblez » est maintenue là où le même verbe hébreu revient, tandis que « réunissez » reflète le verbe distinct קבץ. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
