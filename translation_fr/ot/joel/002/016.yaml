  terminology: « Consacrez l’assemblée », « les anciens », « nourrissons » et « chambre » sont appropriés. La note sur les anciens préserve correctement l’ambiguïté âge/statut. La note sur חֻפָּה doit correspondre avec précision au choix principal.
