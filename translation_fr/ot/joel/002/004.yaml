  text: כְּ/מַרְאֵ֥ה סוּסִ֖ים מַרְאֵ֑/הוּ וּ/כְ/פָרָשִׁ֖ים כֵּ֥ן יְרוּצֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/004.yaml
  text: Their appearance is like the appearance of horses[a], and like horsemen[b], so they run.
translation:
  language: fr
  text: Ils ont l’apparence de chevaux[a] ; ils courent comme des cavaliers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Son apparence est comme l’apparence de chevaux. » En hébreu, le suffixe est au singulier, mais il renvoie collectivement au groupe décrit dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des hommes à cheval » ; le mot peut aussi évoquer la cavalerie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְאֵה סוּסִים מַרְאֵהוּ
  choice: Ils ont l’aspect de chevaux
  rationale: La formulation française restitue le redoublement de מַרְאֶה de manière naturelle, tout en rendant collectivement le suffixe masculin singulier de מַרְאֵהוּ, dont le référent est le groupe envahisseur.
- source_word: וּכְפָרָשִׁים
  choice: tels des cavaliers
  rationale: פָרָשִׁים désigne des hommes montés, notamment dans un cadre militaire. « Cavaliers » conserve l’image équestre sans imposer le sens plus institutionnel de « cavalerie ».
- source_word: כֵּן יְרוּצוּן
  choice: ils courent
  rationale: רוץ signifie fondamentalement « courir ». La construction comparative avec כֵּן est rendue par la juxtaposition française « tels des cavaliers, ils courent », claire et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et imagé. « Ils ont l’aspect » évite une répétition pesante tout en conservant le sens du double emploi hébreu de מַרְאֶה. Le point-virgule maintient l’étroite relation entre apparence et mouvement.
