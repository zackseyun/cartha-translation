  rationale: La révision conserve la décision principale, solidement appuyée par le contexte agricole, et maintient explicitement les lectures alternatives en note. Elle restitue plus fidèlement לִצְדָקָה par « pour la justice » sans résoudre dans le texte une expression difficile, améliore l’idiomaticité de la proposition causative et retire de la note un terme théologique potentiellement trop spécialisé.
