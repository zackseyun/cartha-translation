  text: וּ/בְנֵ֣י צִיּ֗וֹן גִּ֤ילוּ וְ/שִׂמְחוּ֙ בַּ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם כִּֽי נָתַ֥ן לָ/כֶ֛ם אֶת הַ/מּוֹרֶ֖ה לִ/צְדָקָ֑ה וַ/יּ֣וֹרֶד לָ/כֶ֗ם גֶּ֛שֶׁם מוֹרֶ֥ה וּ/מַלְק֖וֹשׁ בָּ/רִאשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
translation:
  language: fr
  text: 'Et vous, enfants de Sion, exultez et réjouissez-vous en Yahvé, votre Dieu, car il vous a donné la pluie d’automne pour la justice[a] ; il fait tomber la pluie pour vous : la pluie d’automne et la pluie de printemps, comme autrefois[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il vous a donné l’enseignant pour la justice » ou « l’enseignant de justice ». Le mot hébreu peut désigner un enseignant ou la pluie d’automne ; la suite du verset favorise ici le sens de « pluie d’automne ». L’expression « pour la justice » peut aussi se comprendre comme « en juste mesure » ou « pour votre réhabilitation ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « au premier mois ». L’hébreu permet aussi une référence calendaire, mais « comme autrefois » s’accorde bien avec le contexte de restauration.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  choice: Et vous, enfants de Sion
  rationale: « Enfants de Sion » exprime l’adresse collective sans la limiter aux hommes ; וּ maintient le lien avec le discours précédent.
- source_word: גִּילוּ וְשִׂמְחוּ
  choice: exultez et réjouissez-vous
  rationale: Les deux impératifs sont conservés afin de rendre l’intensification de la joie.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: en Yahvé, votre Dieu
  rationale: La préposition ב marque ici l’objet ou la sphère de la joie. Le nom divin est translittéré « Yahvé » conformément à la couche anglaise fournie.
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  choice: la pluie d’automne selon la justice
  rationale: Dans ce contexte agricole, מוֹרֶה désigne très probablement la première pluie de la saison, qui tombe en automne. « Selon la justice » garde le lien lexical avec צְדָקָה tout en exprimant une action conforme à ce qui est juste, sans trancher en faveur de la seule idée de quantité ou de justification.
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  choice: il fait descendre pour vous la pluie
  rationale: La tournure causative du verbe ירד est rendue explicitement, dans un français naturel.
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  choice: la pluie d’automne et la pluie de printemps
  rationale: Ces expressions désignent les deux pluies saisonnières agricoles ; les saisons sont plus immédiatement compréhensibles en français moderne que « première » et « dernière pluie ».
- source_word: בָּרִאשׁוֹן
  choice: comme autrefois
  rationale: La valeur adverbiale « comme auparavant » convient au contexte de restauration, tout en laissant en note la lecture calendaire possible.
theological_decisions:
- issue: Sens de הַמּוֹרֶה, parfois compris comme désignant un enseignant de justice
  choice: pluie d’automne dans le texte principal
  alternative: l’enseignant pour la justice / l’enseignant de justice
  rationale: La répétition immédiate de מוֹרֶה avec גֶּשֶׁם et מַלְקוֹשׁ favorise fortement le sens météorologique. La note conserve néanmoins l’ambiguïté lexicale sans imposer une lecture messianique ou didactique.
- issue: Sens de לִצְדָקָה
  choice: selon la justice
  alternative: en juste mesure / pour votre justification
  rationale: Cette formulation préserve la portée morale et relationnelle de צְדָקָה sans réduire l’expression à une mesure quantitative ni décider qu’il s’agit nécessairement de la justification du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les deux impératifs, emploie les désignations saisonnières usuelles des pluies et maintient dans les notes les ambiguïtés de מוֹרֶה, לִצְדָקָה et בָּרִאשׁוֹן.
