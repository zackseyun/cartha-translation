source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֤י לָ/כֶם֙ אֶת הַ/שָּׁנִ֔ים אֲשֶׁר֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה הַ/יֶּ֖לֶק וְ/הֶ/חָסִ֣יל וְ/הַ/גָּזָ֑ם חֵילִ/י֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר שִׁלַּ֖חְתִּי בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
translation:
  language: fr
  text: Je vous rendrai les années qu’ont dévorées les sauterelles en essaim, les jeunes sauterelles, les sauterelles dévastatrices et les sauterelles rongeuses[a] — ma grande armée que j’ai envoyée parmi vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les quatre termes hébreux désignent probablement des sortes de sauterelles ou différents stades de leur développement. Leurs distinctions zoologiques exactes sont incertaines ; on peut aussi comprendre, entre autres, « sauterelles rampantes », « dévorantes » et « coupeuses ».
    reason: lexical_alternative
  - marker: b
    text: Ou « contre vous ». La préposition hébraïque peut ici se comprendre de plusieurs manières.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Je vous rendrai
  rationale: Le piel de שׁלם exprime ici l’idée de compenser une perte ou de rendre ce qui a été perdu. « Rendre » conserve l’image saisissante des années restituées sans réduire la promesse à un remboursement financier.
- source_word: הַשָּׁנִים
  choice: les années
  rationale: L’hébreu nomme littéralement « les années », par métonymie pour leurs récoltes et leurs bienfaits perdus. La traduction maintient cette formulation expressive.
- source_word: אֲשֶׁר אָכַל
  choice: qu’ont dévorées
  rationale: « Dévorer » convient naturellement aux ravages des sauterelles et rend la force du verbe אָכל dans ce contexte.
- source_word: הָאַרְבֶּה
  choice: les sauterelles en essaims
  rationale: אַרבה est le terme courant désignant la sauterelle migratrice ou grégaire. La formulation met en relief le comportement en essaim sans prétendre identifier une espèce précise.
- source_word: הַיֶּלֶק
  choice: les jeunes sauterelles
  rationale: Le terme désigne vraisemblablement un type ou un stade de développement de la sauterelle, mais sa valeur zoologique exacte demeure incertaine. « Jeunes sauterelles » est clair en français moderne tout en restant prudent.
- source_word: וְהֶחָסִיל
  choice: les sauterelles dévastatrices
  rationale: חָסִיל évoque ce qui consume ou détruit. L’adjectif « dévastatrices » traduit cette fonction sans donner une précision zoologique illusoire.
- source_word: וְהַגָּזָם
  choice: les sauterelles rongeuses
  rationale: גָּזָם est traditionnellement associé à l’action de couper ou de ronger. « Rongeuses » distingue ce terme des autres et restitue son image.
- source_word: חֵילִי הַגָּדוֹל
  choice: ma grande armée
  rationale: חַיִל peut désigner une armée ou une force. Ici, les insectes sont présentés sous une image militaire, que cette traduction conserve explicitement.
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  choice: que j’ai envoyée parmi vous
  rationale: La première personne maintient sans l’atténuer l’affirmation de l’action divine. La préposition ב peut indiquer une présence au milieu du peuple, tout en permettant aussi la nuance hostile « contre vous ».
theological_decisions:
- issue: Nature de la « grande armée »
  choice: Une invasion réelle de sauterelles décrite par une image militaire
  alternative: Une armée humaine entièrement symbolisée par les sauterelles
  rationale: Les quatre noms d’insectes suivis de l’apposition « ma grande armée » favorisent la lecture d’un fléau de sauterelles présenté sous des traits militaires. La traduction préserve les deux dimensions sans réduire l’une à l’autre.
- issue: Action divine dans le désastre
  choice: Dieu affirme avoir envoyé le fléau
  alternative: Dieu aurait seulement permis le fléau
  rationale: Le verbe à la première personne, « j’ai envoyé », attribue directement l’envoi à Dieu. La traduction ne transforme pas cette affirmation en simple permission.
- issue: Sens de la préposition בָּכֶם
  choice: parmi vous
  alternative: contre vous
  rationale: « Parmi vous » exprime l’irruption du fléau au milieu du peuple, mais la construction hébraïque peut aussi recevoir une nuance hostile. Cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « sauterelles » clarifie les quatre désignations collectives pour le lecteur ordinaire; le tiret conserve l’apposition forte qui identifie ces insectes à l’armée de Dieu.
