id: JOL.2.5
reference: Joel 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּ/ק֣וֹל מַרְכָּב֗וֹת עַל רָאשֵׁ֤י הֶֽ/הָרִים֙ יְרַקֵּד֔וּ/ן כְּ/קוֹל֙ לַ֣הַב אֵ֔שׁ אֹכְלָ֖ה קָ֑שׁ כְּ/עַ֣ם עָצ֔וּם עֱר֖וּךְ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/005.yaml
  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
translation:
  language: fr
  text: Comme le bruit des chars, ils bondissent[a] sur les sommets des montagnes ; comme le bruit d’une flamme qui dévore le chaume ; comme un peuple puissant rangé en ordre de bataille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils sautillent » ou « ils dansent » ; le verbe hébreu évoque un mouvement vif fait de sauts.
    reason: lexical_alternative
  - marker: b
    text: Ou « préparé pour la guerre » ; l’hébreu souligne que le peuple est disposé en formation militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל
  choice: comme le bruit de
  rationale: La préposition כְּ exprime la comparaison, et קוֹל désigne ici un bruit perceptible. « Comme le bruit de » rend naturellement la reprise de la même comparaison dans les deux premiers membres.
- source_word: מַרְכָּבוֹת
  choice: chars
  rationale: Le nom désigne des chars. Le contexte est militaire, mais préciser « chars de guerre » ajouterait un élément qui n’est pas exprimé dans le terme lui-même.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: sur les sommets des montagnes
  rationale: L’expression signifie littéralement « sur les têtes des montagnes ». « Sur les sommets des montagnes » en conserve l’image tout en étant idiomatique en français.
- source_word: יְרַקֵּדוּן
  choice: ils bondissent
  rationale: Le verbe רקד peut évoquer le fait de sautiller, bondir ou danser. « Ils bondissent » convient au mouvement vif de l’avancée décrite sans introduire l’idée d’une danse festive.
- source_word: לַהַב אֵשׁ
  choice: une flamme
  rationale: לַהַב désigne une flamme ou un flamboiement, tandis que אֵשׁ précise qu’il s’agit de feu. En français, « une flamme » suffit naturellement, sans la lourdeur de « une flamme de feu ».
- source_word: אֹכְלָה קָשׁ
  choice: qui dévore le chaume
  rationale: Le participe présente le feu en train de consumer des tiges sèches. « Dévore » conserve la personnification vigoureuse du verbe אכל, et « chaume » convient à קָשׁ dans cette image prophétique.
- source_word: כְּעַם עָצוּם
  choice: comme un peuple puissant
  rationale: עָצוּם peut exprimer la force, la puissance ou le grand nombre. « Puissant » préserve cette amplitude de sens tout en convenant au contexte martial.
- source_word: עֱרוּךְ מִלְחָמָה
  choice: rangé en ordre de bataille
  rationale: Le participe passif de ערך évoque une troupe disposée méthodiquement pour combattre. Cette formulation française met en valeur l’organisation militaire indiquée par l’hébreu.
