  text: לְ/פָנָי/ו֙ רָ֣גְזָה אֶ֔רֶץ רָעֲשׁ֖וּ שָׁמָ֑יִם שֶׁ֤מֶשׁ וְ/יָרֵ֨חַ֙ קָדָ֔רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/010.yaml
  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
translation:
  language: fr
  text: Devant lui, la terre tremble[a] et les cieux sont ébranlés. Le soleil et la lune s’obscurcissent, et les étoiles retirent leur éclat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En sa présence, la terre tremble. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les étoiles recueillent leur éclat », c’est-à-dire qu’elles retirent leur lumière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Devant lui
  rationale: L’expression signifie « devant lui » ou « en sa présence ». « Devant lui » conserve naturellement sa dimension spatiale et relationnelle.
- source_word: רָגְזָה
  choice: tremble
  rationale: Avec « la terre » pour sujet, ce verbe évoque une agitation ou une secousse; « tremble » est idiomatique et garde la force de l’image.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le contexte cosmique — cieux, soleil, lune et étoiles — favorise le sens global de « terre » plutôt que celui, plus local, de « pays ».
- source_word: רָעֲשׁוּ
  choice: sont ébranlés
  rationale: Le verbe exprime une violente secousse. Cette formulation évite de répéter « tremble » tout en maintenant le parallélisme cosmique.
- source_word: שָׁמָיִם
  choice: les cieux
  rationale: « Les cieux » respecte le pluriel hébreu et convient au registre prophétique élevé.
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: Le soleil et la lune
  rationale: Traduction directe qui conserve l’association des deux astres et l’ordre poétique du texte.
- source_word: קָדָרוּ
  choice: s’obscurcissent
  rationale: Le verbe indique qu’ils deviennent sombres. La forme pronominale exprime clairement ce changement sans ajouter d’agent absent du texte.
- source_word: וְכוֹכָבִים
  choice: et les étoiles
  rationale: Traduction directe qui maintient la progression de l’imagerie cosmique.
- source_word: אָסְפוּ
  choice: retirent
  rationale: Le sens premier est « rassembler » ou « recueillir »; avec « éclat », l’expression décrit les étoiles comme ramenant ou retirant leur lumière.
- source_word: נָגְהָם
  choice: leur éclat
  rationale: Le nom désigne la clarté ou la splendeur lumineuse. « Éclat » est concis, naturel et poétique en français.
theological_decisions:
- issue: Portée des bouleversements cosmiques
  choice: Présenter directement les bouleversements cosmiques sans en préciser le statut figuré, historique ou eschatologique.
  alternative: Réduire ces images à une simple métaphore de la terreur provoquée par une armée, ou les définir explicitement comme une prédiction de la fin des temps.
  rationale: La poésie prophétique laisse ouverte la portée exacte de ces signes. La traduction préserve cette grandeur et cette ambiguïté sans imposer un système interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé, avec une légère variation verbale pour éviter une répétition pesante. Les notes signalent les principales nuances lexicales sans résoudre l’ambiguïté poétique.
