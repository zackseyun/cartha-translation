  text: אַל תִּֽירְאוּ֙ בַּהֲמ֣וֹת שָׂדַ֔י כִּ֥י דָשְׁא֖וּ נְא֣וֹת מִדְבָּ֑ר כִּֽי עֵץ֙ נָשָׂ֣א פִרְי֔/וֹ תְּאֵנָ֥ה וָ/גֶ֖פֶן נָתְנ֥וּ חֵילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
translation:
  language: fr
  text: N’ayez pas peur, bêtes des champs, car les pâturages de la steppe ont reverdi ; car les arbres ont porté leurs fruits, le figuier et la vigne ont donné leur richesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont donné leur production » ou « ont donné leur plein rendement ». Le mot hébreu traduit par « richesse » signifie littéralement « force » et désigne probablement ici la capacité productive ou l’abondance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאוּ
  choice: N’ayez pas peur
  rationale: Rend naturellement en français moderne la défense directe exprimée par אַל suivi de l’inaccompli de ירא.
- source_word: בַּהֲמוֹת שָׂדַי
  choice: bêtes des champs
  rationale: Expression française courante dans un registre prophétique digne, qui conserve l’adresse aux animaux vivant dans les espaces ouverts.
- source_word: דָשְׁאוּ
  choice: ont reverdi
  rationale: Le verbe décrit la repousse de la végétation. « Reverdir » exprime avec concision le résultat accompli et, dans ce contexte de restauration, le retour de la verdure.
- source_word: נְאוֹת מִדְבָּר
  choice: les pâturages du désert
  rationale: נְאוֹת désigne des lieux de pâture. « Désert » rend מִדְבָּר dans son sens de région sauvage et non cultivée, sans exiger l’image d’une étendue de sable.
- source_word: עֵץ נָשָׂא פִרְיוֹ
  choice: les arbres portent leurs fruits
  rationale: Le singulier hébreu peut avoir une valeur collective. Le pluriel générique est plus naturel en français et s’accorde au passage des arbres en général aux espèces nommées ensuite.
- source_word: תְּאֵנָה וָגֶפֶן
  choice: le figuier et la vigne
  rationale: Conserve les deux espèces agricoles précises et leur valeur d’images concrètes de fécondité retrouvée.
- source_word: נָתְנוּ חֵילָם
  choice: donnent toute leur richesse
  rationale: Dans ce contexte végétal, חַיִל évoque la puissance productive, l’abondance ou le rendement. « Toute leur richesse » préserve la métaphore sans suggérer une force physique littérale.
