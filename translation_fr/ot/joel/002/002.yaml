  text: י֧וֹם חֹ֣שֶׁךְ וַ/אֲפֵלָ֗ה י֤וֹם עָנָן֙ וַ/עֲרָפֶ֔ל כְּ/שַׁ֖חַר פָּרֻ֣שׂ עַל הֶֽ/הָרִ֑ים עַ֚ם רַ֣ב וְ/עָצ֔וּם כָּמֹ֗/הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣/עוֹלָ֔ם וְ/אַֽחֲרָי/ו֙ לֹ֣א יוֹסֵ֔ף עַד שְׁנֵ֖י דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
translation:
  language: fr
  text: Jour de ténèbres et d’obscurité profonde, jour de nuages et de ténèbres épaisses ; comme l’aurore[a] étendue sur les montagnes, un peuple nombreux et puissant[b]. Il n’y en a jamais eu de pareil depuis les temps anciens, et il n’y en aura plus après lui, au fil des générations[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un sens plus rare de שַׁחַר : « comme la noirceur étendue sur les montagnes ». Le sens habituel est « aurore » et convient mieux à l’image de ce qui s’étend sur les collines.'
    reason: lexical_alternative
  - marker: b
    text: Ce « peuple » peut désigner une armée envahissante, une nuée de sauterelles présentée sous des traits militaires, ou une image prophétique qui associe délibérément les deux.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « jusqu’aux années de génération et génération », expression désignant une succession indéfiniment longue de générations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֧וֹם
  choice: jour
  rationale: Le nom temporel est repris deux fois afin de conserver le rythme poétique et la formule d’annonce prophétique.
- source_word: חֹשֶׁךְ וַאֲפֵלָה
  choice: ténèbres et obscurité
  rationale: Cette paire conserve l’intensification de deux termes proches tout en restant naturelle en français.
- source_word: עָנָן וַעֲרָפֶל
  choice: nuages et profonde obscurité
  rationale: « Nuages » convient à la description météorologique; « profonde obscurité » exprime la masse opaque et sombre désignée par עֲרָפֶל.
- source_word: כְּשַׁחַר
  choice: comme l’aurore
  rationale: Le sens habituel de שַׁחַר est « aurore »; l’image évoque quelque chose qui s’étend rapidement sur les montagnes.
- source_word: פָּרֻשׂ עַל הֶהָרִים
  choice: qui se déploie sur les montagnes
  rationale: Le participe passif décrit ce qui est étendu au-dessus ou sur les montagnes; la tournure française rend l’image avec fluidité.
- source_word: עַם רַב וְעָצוּם
  choice: un peuple nombreux et puissant
  rationale: « Peuple » maintient le terme générique du texte sans imposer « armée »; רַב souligne ici naturellement la multitude et עָצוּם la puissance.
- source_word: כָּמֹהוּ לֹא נִהְיָה מִן הָעוֹלָם
  choice: Il n’y en a jamais eu de pareil depuis les temps anciens
  rationale: Cette formulation rend l’absence de précédent dans le passé ancien sans surdéterminer la portée temporelle de עוֹלָם.
- source_word: עַד שְׁנֵי דּוֹר וָדוֹר
  choice: de génération en génération
  rationale: L’expression hébraïque désigne une succession indéfiniment longue de générations; l’idiome français en restitue le sens.
theological_decisions:
- issue: Identité du « peuple nombreux et puissant »
  choice: Conserver le terme générique « peuple » sans préciser son identité.
  alternative: Une nuée de sauterelles décrite militairement, une armée humaine, ou une image prophétique mêlant les deux.
  rationale: Le verset emploie עַם, « peuple », et ne tranche pas explicitement entre ces référents; la traduction préserve donc cette tension interprétative.
- issue: Antécédent de « après lui »
  choice: Employer le pronom masculin « lui », qui renvoie grammaticalement au peuple.
  alternative: « Après cela », qui ferait porter la comparaison sur l’événement dans son ensemble.
  rationale: Le suffixe hébreu est masculin singulier et son antécédent immédiat est עַם, également masculin singulier; garder « lui » respecte cette relation sans exclure la portée collective du phénomène.
translation_notes:
  register: Français international moderne, digne et poétique. Le rythme binaire du début est conservé. « Voici » marque naturellement l’apparition du peuple implicite dans la proposition hébraïque. Les ambiguïtés concernant l’identité du peuple et la portée collective du pronom sont maintenues.
