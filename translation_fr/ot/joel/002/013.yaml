id: JOL.2.13
reference: Joel 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קִרְע֤וּ לְבַבְ/כֶם֙ וְ/אַל בִּגְדֵי/כֶ֔ם וְ/שׁ֖וּבוּ אֶל יְהוָ֣ה אֱלֹֽהֵי/כֶ֑ם כִּֽי חַנּ֤וּן וְ/רַחוּם֙ ה֔וּא אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
translation:
  language: fr
  text: Déchirez votre cœur, et non vos vêtements[a], et revenez à Yahweh, votre Dieu, car il fait grâce et il est compatissant, lent à la colère et riche en amour fidèle ; il se ravise au sujet du malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était un geste extérieur de deuil ou de repentance ; le prophète appelle ici à une transformation intérieure.
    reason: cultural_explanation
  - marker: b
    text: 'Ou : « il renonce au malheur », c’est-à-dire au jugement annoncé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ לְבַבְכֶם
  choice: Déchirez votre cœur
  rationale: L’impératif conserve l’image forte d’une déchirure intérieure. Le nom hébreu est au singulier avec un suffixe pluriel ; le singulier collectif « votre cœur » est naturel en français dans cette adresse au peuple.
- source_word: וְאַל בִּגְדֵיכֶם
  choice: et non vos vêtements
  rationale: La formulation maintient le contraste avec le geste extérieur de déchirer ses vêtements en signe de deuil ou de repentance.
- source_word: וְשׁוּבוּ
  choice: et revenez
  rationale: Le verbe שׁוב exprime le retour vers Dieu ; « revenez » préserve cette orientation sans le réduire au seul concept abstrait de repentance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin propre représenté par le tétragramme.
- source_word: חַנּוּן וְרַחוּם
  choice: il fait grâce et il est compatissant
  rationale: 'Cette formulation distingue les deux adjectifs hébreux : la disposition à accorder sa grâce et la compassion.'
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Équivalent idiomatique français de l’expression hébraïque, littéralement liée à la longueur des narines.
- source_word: וְרַב חֶסֶד
  choice: et riche en amour fidèle
  rationale: « Amour fidèle » rend la loyauté et la constance de חֶסֶד, tandis que « riche en » exprime רַב dans un français naturel.
- source_word: וְנִחָם עַל הָרָעָה
  choice: il se ravise au sujet du malheur
  rationale: La formulation garde l’idée exprimée par נִחם d’un changement à l’égard du jugement, sans la transformer en simple émotion. Dans ce contexte, רָעָה désigne un malheur ou une calamité, non le mal moral.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom propre divin ; sa transcription le distingue du titre אֲדֹנָי.
- issue: Dieu « se ravise » au sujet du malheur
  choice: il se ravise au sujet du malheur
  alternative: il renonce au malheur
  rationale: « Se ravise » préserve la tension du langage hébreu concernant la réaction de Dieu à la repentance. L’alternative explicite davantage la non-exécution du jugement, mais atténue l’image d’un changement exprimée par le texte.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme de la formule décrivant Dieu est conservé, ainsi que la métaphore vive du cœur déchiré et l’ambiguïté théologique de נִחָם.
