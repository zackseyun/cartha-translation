  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אָכוֹל֙ וְ/שָׂב֔וֹעַ וְ/הִלַּלְתֶּ֗ם אֶת שֵׁ֤ם יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר עָשָׂ֥ה עִמָּ/כֶ֖ם לְ/הַפְלִ֑יא וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
translation:
  language: fr
  text: Vous mangerez à satiété et serez rassasiés[a] ; vous louerez le nom de Yahvé, votre Dieu, qui a agi merveilleusement envers vous[b]. Et mon peuple ne sera plus jamais couvert de honte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous mangerez abondamment et serez rassasiés. » L’hébreu emploie une tournure emphatique, littéralement : « manger, vous mangerez ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui a accompli des merveilles pour vous ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et mon peuple ne connaîtra pas la honte pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל
  choice: Vous mangerez vraiment
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’affirmation. « Vraiment » rend cette insistance sans introduire explicitement une idée d’abondance qui n’est pas portée par le verbe seul.
- source_word: וְשָׂבוֹעַ
  choice: et serez rassasiés
  rationale: Le terme exprime le fait d’avoir mangé jusqu’à satiété. « Être rassasié » est naturel, précis et adapté au registre biblique moderne.
- source_word: וְהִלַּלְתֶּם
  choice: vous louerez
  rationale: Au piel, הלל signifie ici louer ou célébrer. « Louer » est direct, courant et convient au contexte d’adoration.
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  choice: le nom de Yahvé, votre Dieu
  rationale: « Le nom » est conservé, car il renvoie à l’identité révélée et à la renommée de Dieu. Le tétragramme est translittéré « Yahvé », forme française courante du nom divin.
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  choice: qui a agi merveilleusement envers vous
  rationale: Cette formulation garde à la fois l’action divine, son caractère extraordinaire et la relation exprimée par עִם, sans imposer exclusivement le sens bénéficiaire « pour vous ».
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: Et mon peuple ne sera plus jamais couvert de honte
  rationale: בושׁ peut exprimer la honte publique autant que le sentiment intérieur. « Être couvert de honte » rend bien cette dimension, tandis que « plus jamais » exprime naturellement en français la permanence de la restauration promise.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération conserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée de לְעוֹלָם dans la promesse concernant la honte
  choice: ne sera plus jamais couvert de honte
  alternative: ne connaîtra pas la honte pour toujours
  rationale: L’hébreu nie durablement toute honte future. « Plus jamais » communique en français idiomatique le caractère permanent du renversement annoncé, sans réduire la honte à un sentiment purement intérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du verset hébreu, tout en évitant les calques peu naturels. Les trois marqueurs de note figurent dans le texte dans leur ordre d’apparition.
