id: JOL.2.1
reference: Joel 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
translation:
  language: fr
  text: Sonnez du cor à Sion et donnez l’alarme sur ma montagne sainte ! Que tous les habitants du pays[a] tremblent, car le jour de Yahweh arrive ; oui, il est proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Le mot hébreu peut désigner soit le pays, soit la terre entière, selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  choice: Sonnez du cor
  rationale: L’impératif תקע avec שׁוֹפָר désigne l’action de faire retentir un cor. « Cor » évite de suggérer nécessairement une trompette métallique, tandis que « sonnez » est idiomatique en français.
- source_word: בְּצִיּוֹן
  choice: à Sion
  rationale: La préposition locative est naturellement rendue par « à » avec le nom de lieu Sion.
- source_word: וְהָרִיעוּ
  choice: donnez l’alarme
  rationale: Le hifil de רוע exprime ici un signal sonore urgent. Dans le parallélisme avec le cor et face à l’imminence du jour de Yahweh, « donnez l’alarme » restitue clairement la fonction d’avertissement sans imposer l’idée plus précise d’un cri de guerre.
- source_word: בְּהַר קָדְשִׁי
  choice: sur ma montagne sainte
  rationale: « Sur » convient au relief désigné par הַר, et le suffixe de première personne est conservé dans « ma montagne sainte ».
- source_word: יִרְגְּזוּ
  choice: Que ... tremblent
  rationale: La forme verbale a ici une valeur volitive après les impératifs. « Trembler » conserve à la fois la réaction physique et l’effroi.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: tous les habitants du pays
  rationale: Dans le contexte immédiat de Sion et de la montagne sainte, « pays » paraît être le sens principal de אֶרֶץ. La portée plus large « terre » reste possible et est signalée en note.
- source_word: כִּי בָא יוֹם יְהוָה
  choice: car le jour de Yahweh arrive
  rationale: בָא présente l’arrivée comme imminente. Le nom divin est translittéré « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: כִּי קָרוֹב
  choice: oui, il est proche
  rationale: Le second כִּי peut être explicatif ou emphatique. « Oui » rend naturellement son renforcement en français sans trancher lourdement en faveur d’une relation strictement causale.
theological_decisions:
- issue: 'Portée de הָאָרֶץ : pays ou terre entière'
  choice: pays
  alternative: terre
  rationale: Les mentions de Sion et de la montagne sainte favorisent une référence locale au pays, mais le thème du jour de Yahweh permet aussi une portée universelle. La note préserve cette ambiguïté.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie explicitement le tétragramme. « Yahweh » préserve le nom propre dans le corps du texte, sans substituer un titre.
- issue: Force de כִּי קָרוֹב
  choice: oui, il est proche
  alternative: car il est proche
  rationale: La répétition de כִּי admet une nuance emphatique aussi bien qu’explicative. Le choix français met en valeur l’insistance sans éliminer complètement le lien logique.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les deux impératifs brefs maintiennent l’urgence du signal d’alarme ; la ponctuation sépare clairement l’appel initial de l’annonce prophétique.
