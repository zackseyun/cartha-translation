  text: וְ/אִ֤ישׁ אָחִי/ו֙ לֹ֣א יִדְחָק֔וּ/ן גֶּ֥בֶר בִּ/מְסִלָּת֖/וֹ יֵֽלֵכ֑וּ/ן וּ/בְעַ֥ד הַ/שֶּׁ֛לַח יִפֹּ֖לוּ לֹ֥א יִבְצָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/008.yaml
  text: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
translation:
  language: fr
  text: Ils ne se bousculent pas les uns les autres ; chacun avance dans sa voie. Ils tombent au milieu des armes, mais ne rompent pas les rangs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ils ne sont pas retranchés » ou « ils ne sont pas arrêtés ». Le sens du dernier verbe hébreu est difficile ; le texte principal l’interprète, d’après le contexte, comme l’image d’une armée dont la formation ne se disloque pas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אָחִיו לֹא יִדְחָקוּן
  choice: Ils ne se bousculent pas les uns les autres
  rationale: L’expression distributive אִישׁ אָחִיו décrit les membres du groupe dans leur relation mutuelle. « Les uns les autres » est idiomatique en français, tandis que « se bousculent » rend דחק, qui évoque le fait de presser ou de gêner son voisin.
- source_word: גֶּבֶר בִּמְסִלָּתוֹ יֵלֵכוּן
  choice: chacun avance dans sa voie
  rationale: גֶּבֶר a ici une valeur distributive, rendue par « chacun ». מְסִלָּה peut désigner une route ou une voie ; dans ce contexte, elle évoque la ligne de progression propre à chacun. « Avance » exprime le mouvement ordonné sans imposer le terme plus spécifiquement militaire « marche ».
- source_word: וּבְעַד הַשֶּׁלַח יִפֹּלוּ
  choice: Ils tombent au milieu des armes
  rationale: שֶׁלַח désigne une arme, souvent une arme de jet, sans permettre d’en préciser sûrement la nature. בְּעַד est difficile ici et peut évoquer un passage à travers ou au milieu de quelque chose. La traduction conserve l’image sans identifier une arme particulière.
- source_word: לֹא יִבְצָעוּ
  choice: mais ne rompent pas les rangs
  rationale: Le sens de בצע dans ce passage est incertain. Dans l’image d’une troupe disciplinée et irrésistible, la traduction contextuelle « ne rompent pas les rangs » exprime que leur formation ou leur progression n’est pas brisée, tout en signalant en note les autres analyses possibles.
