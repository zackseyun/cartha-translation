source:
  edition: WLC
  text: מִ֥י יוֹדֵ֖עַ יָשׁ֣וּב וְ/נִחָ֑ם וְ/הִשְׁאִ֤יר אַֽחֲרָי/ו֙ בְּרָכָ֔ה מִנְחָ֣ה וָ/נֶ֔סֶךְ לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
translation:
  language: fr
  text: 'Qui sait ? Peut-être reviendra-t-il sur sa décision et renoncera-t-il au châtiment, laissant après lui une bénédiction : une offrande de céréales et une libation pour le SEIGNEUR, votre Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Qui sait ? Peut-être
  rationale: La question rhétorique exprime une possibilité incertaine. « Peut-être » permet de rattacher naturellement en français les verbes qui suivent sans transformer l'espoir en certitude.
- source_word: יָשׁוּב
  choice: reviendra-t-il sur sa décision
  rationale: Dans ce contexte, שוב évoque le retournement de l'action divine annoncée plutôt qu'un déplacement spatial. Cette tournure française explicite naturellement ce sens, tout en maintenant la possibilité d'un changement d'action.
- source_word: וְנִחָם
  choice: renoncera-t-il au châtiment
  rationale: נחם, à propos d'un jugement annoncé, désigne ici le fait de renoncer à l'exécuter. La formulation évite de suggérer une faute divine tout en conservant le langage biblique d'un changement dans l'action de Dieu.
- source_word: וְהִשְׁאִיר
  choice: laissant
  rationale: Le hiphil de שׁאר signifie faire subsister ou laisser quelque chose. Le participe français enchaîne naturellement la conséquence possible.
- source_word: אַחֲרָיו
  choice: après lui
  rationale: Rend directement l'image spatiale ou métaphorique de ce qui demeure à sa suite, sans la remplacer par une interprétation.
- source_word: בְּרָכָה
  choice: une bénédiction
  rationale: Le singulier indéfini est conservé et désigne concrètement un bienfait laissé par Dieu.
- source_word: מִנְחָה
  choice: une offrande de céréales
  rationale: Associé à la libation dans ce contexte cultuel, מִנְחָה a très probablement son sens technique d'offrande végétale ou céréalière. Cette précision est claire en français moderne.
- source_word: וָנֶסֶךְ
  choice: une libation
  rationale: Terme cultuel français précis et courant dans le registre biblique pour une offrande liquide versée.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition indique ici que les produits préservés pourront servir d'offrandes destinées à YHWH. Le tétragramme est rendu selon la convention française « le SEIGNEUR ».
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: La construction possessive et l'adresse collective sont conservées.
theological_decisions:
- issue: Langage du changement de décision divine
  choice: Peut-être reviendra-t-il sur sa décision et renoncera-t-il au châtiment
  alternative: Peut-être fera-t-il demi-tour et éprouvera-t-il du regret
  rationale: Le texte présente une véritable incertitude du point de vue humain et décrit Dieu comme revenant sur le jugement annoncé. La traduction garde cette tension sans attribuer explicitement à Dieu erreur, faute ou acquisition d'une information nouvelle.
- issue: Sens cultuel de מִנְחָה
  choice: une offrande de céréales
  alternative: une offrande
  rationale: La coordination avec נֶסֶךְ, « libation », favorise nettement le sens sacrificiel technique. Le rendre dans le texte évite une généralisation inutile et reste intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative puis éventuelle préserve l'incertitude de l'hébreu. « Libation » relève du vocabulaire cultuel biblique mais demeure concis et précis.
