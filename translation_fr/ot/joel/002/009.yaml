source:
  edition: WLC
  text: בָּ/עִ֣יר יָשֹׁ֗קּוּ בַּֽ/חוֹמָה֙ יְרֻצ֔וּ/ן בַּ/בָּתִּ֖ים יַעֲל֑וּ בְּעַ֧ד הַ/חַלּוֹנִ֛ים יָבֹ֖אוּ כַּ/גַּנָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/009.yaml
  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
translation:
  language: fr
  text: Ils se précipitent dans la ville[a], courent sur la muraille, escaladent les maisons et entrent par les fenêtres comme un voleur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à travers la ville » ; la préposition hébraïque signifie littéralement « dans », mais le contexte décrit un mouvement à l’intérieur de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁקּוּ
  choice: se précipitent
  rationale: Le verbe exprime ici un mouvement rapide et impétueux. « Se précipitent » rend naturellement l’urgence de l’avancée sans préciser indûment la nature des envahisseurs.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: La préposition בְּ signifie normalement « dans ». Avec un verbe de mouvement, cette formulation décrit leur progression à l’intérieur de la ville; « à travers la ville » reste possible.
- source_word: יְרֻצוּן
  choice: courent
  rationale: Rend directement le verbe courant רוץ et maintient le rythme rapide de la série d’actions.
- source_word: בַּחוֹמָה
  choice: sur la muraille
  rationale: « Muraille » convient à la fortification urbaine évoquée par le contexte, et la préposition indique qu’ils avancent dessus.
- source_word: יַעֲלוּ
  choice: montent dans
  rationale: Le verbe signifie « monter ». La tournure préserve ce mouvement ascendant sans expliciter davantage la manière dont ils pénètrent dans les maisons.
- source_word: בַּבָּתִּים
  choice: les maisons
  rationale: L’article hébreu est conservé, ce qui donne à la scène son caractère concret.
- source_word: בְּעַד הַחַלּוֹנִים
  choice: par les fenêtres
  rationale: בְּעַד désigne ici le passage au travers d’une ouverture. « Par les fenêtres » est idiomatique et précis en français.
- source_word: יָבֹאוּ
  choice: entrent
  rationale: Dans ce contexte d’intrusion, « entrent » rend clairement le mouvement exprimé par בוא.
- source_word: כַּגַּנָּב
  choice: comme un voleur
  rationale: Conserve la comparaison hébraïque et son image d’intrusion furtive, sans lui ajouter d’association théologique ultérieure.
theological_decisions:
- issue: Identité de la force envahissante
  choice: Conserver le sujet implicite au moyen du pronom pluriel « ils », sans préciser s’il s’agit de criquets, de soldats ou d’une image prophétique mêlant les deux.
  alternative: Identifier explicitement le sujet comme des criquets ou comme une armée humaine.
  rationale: Les verbes hébreux sont à la troisième personne du pluriel sans nom explicite dans ce verset. Le contexte de Joël entretient le chevauchement entre invasion de criquets et invasion militaire; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination a été légèrement resserrée pour produire une phrase vive et naturelle, conforme à l’enchaînement rapide des verbes hébreux.
