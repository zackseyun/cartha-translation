  source_fidelity: Le texte conserve correctement le sujet pluriel non identifié, la succession des verbes de mouvement, « dans la ville » pour בָּעִיר, « sur la muraille » pour בַּחוֹמָה, l’entrée par les fenêtres et la comparaison singulière « comme un voleur ». « Montent dans les maisons » est trop peu idiomatique en français et peut évoquer le fait de monter à l’étage plutôt que l’escalade et l’intrusion décrites par le contexte.
