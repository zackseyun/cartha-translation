  text: וְ/גַם עַתָּה֙ נְאֻם יְהוָ֔ה שֻׁ֥בוּ עָדַ֖/י בְּ/כָל לְבַבְ/כֶ֑ם וּ/בְ/צ֥וֹם וּ/בְ/בְכִ֖י וּ/בְ/מִסְפֵּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
translation:
  language: fr
  text: « Pourtant, maintenant encore, déclare Yahweh, revenez à moi[a] de tout votre cœur, en jeûnant, en pleurant et dans le deuil. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « retournez-vous vers moi » ; dans ce contexte d’alliance, le verbe peut aussi exprimer l’idée de se repentir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם עַתָּה
  choice: Pourtant, maintenant encore
  rationale: La combinaison marque à la fois la transition concessive après l’annonce du jugement et l’insistance sur l’occasion qui demeure ouverte au présent.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formulation française naturelle conserve la solennité de la formule prophétique, tandis que « Yahweh » rend directement le nom divin.
- source_word: שֻׁבוּ עָדַי
  choice: revenez à moi
  rationale: Le verbe שׁוב exprime fondamentalement le retour ou le changement de direction. Avec « à moi », il décrit ici un retour relationnel vers Dieu, porteur d’une dimension de repentance sans la réduire à un terme doctrinal abstrait.
- source_word: בְּכָל לְבַבְכֶם
  choice: de tout votre cœur
  rationale: Expression française courante et digne qui représente le cœur comme le centre de la volonté, des dispositions et de la vie intérieure tout entière.
- source_word: וּבְצוֹם
  choice: en jeûnant
  rationale: La tournure verbale est naturelle en français et exprime clairement la pratique pénitentielle du jeûne.
- source_word: וּבְבְכִי
  choice: en pleurant
  rationale: Cette formulation actuelle conserve le caractère concret et solennel des pleurs.
- source_word: וּבְמִסְפֵּד
  choice: en prenant le deuil
  rationale: מִסְפֵּד désigne une manifestation de deuil ou une lamentation. « Prendre le deuil » maintient ici sa force concrète et évite de confondre le terme avec les simples pleurs déjà mentionnés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie le nom personnel divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Sens de שׁוּב dans l’appel prophétique
  choice: revenez à moi
  alternative: repentez-vous ; retournez-vous vers moi
  rationale: « Revenez » préserve l’image hébraïque d’un mouvement de retour vers Dieu et sa portée relationnelle d’alliance. Le contexte lui donne une dimension de repentance sans imposer ce sens comme unique équivalent lexical.
translation_notes:
  register: Français international moderne, accessible et digne. La répétition hébraïque des prépositions est rendue par une série parallèle en « en », plus idiomatique en français. La ponctuation met en relief l’urgence concessive de l’appel.
