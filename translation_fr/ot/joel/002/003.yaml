  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
translation:
  language: fr
  text: Devant lui, le feu dévore ; derrière lui, une flamme flamboie. Devant lui, le pays est comme le jardin d’Éden ; derrière lui, un désert désolé. Et rien ne lui échappe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne lui reste aucun rescapé » ou « il n’y a pour lui aucune échappée ». Le terme hébreu peut désigner l’échappée, ce qui échappe, ou un rescapé.'
    reason: Ambiguïté lexicale de פְּלֵיטָה et concision de la construction hébraïque.
lexical_decisions:
- source_word: לְפָנָיו / וְאַחֲרָיו
  choice: devant lui / derrière lui
  rationale: Les expressions sont spatiales et parallèles. Le pronom masculin singulier renvoie collectivement au peuple ou à l’envahisseur décrit dans le contexte.
- source_word: אָכְלָה אֵשׁ
  choice: le feu dévore
  rationale: Le parfait hébreu participe à une description prophétique saisissante ; le présent français en restitue la vivacité, tandis que « dévore » conserve l’image de consommation destructrice.
- source_word: תְּלַהֵט לֶהָבָה
  choice: une flamme flamboie
  rationale: Le piel exprime un embrasement intense. Cette formulation française naturelle maintient l’image et le parallélisme sans ajouter un complément absent de l’hébreu.
- source_word: כְּגַן עֵדֶן
  choice: comme le jardin d’Éden
  rationale: Cette tournure courante et transparente conserve l’allusion à la Genèse.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte de dévastation agricole et territoriale, « le pays » désigne plus naturellement la contrée concernée que la terre au sens cosmique.
- source_word: מִדְבַּר שְׁמָמָה
  choice: un désert dévasté
  rationale: La formulation exprime à la fois l’aridité et la désolation totale, dans un français actuel et concis.
- source_word: וְגַם פְּלֵיטָה לֹא הָיְתָה לוֹ
  choice: Même rien n’en réchappe
  rationale: La formulation rend de manière idiomatique l’issue destructrice absolue, tandis qu’une note conserve l’ambiguïté de פְּלֵיטָה entre l’idée d’échappée et celle de rescapé.
theological_decisions:
- issue: Référent des suffixes pronominaux masculins singuliers
  choice: « lui », renvoyant collectivement au peuple ou à l’envahisseur
  alternative: Employer « elle » en explicitant ou en sous-entendant « l’armée » ou « la nuée »
  rationale: L’hébreu maintient le masculin singulier et le contexte immédiat présente vraisemblablement l’envahisseur comme un peuple collectif. La traduction évite de transformer ce référent en individu déterminé.
- issue: Portée de פְּלֵיטָה dans la dernière proposition
  choice: Exprimer dans le texte que rien ne réchappe à la dévastation
  alternative: « il ne lui reste aucun rescapé » ou « il n’y a aucune échappée devant lui »
  rationale: Le nom hébreu peut désigner l’échappée, ce qui échappe, ou un rescapé. Le texte principal reste naturel et général, et la note signale les deux nuances sans imposer une lecture exclusivement humaine.
translation_notes:
  register: Français international moderne, digne et imagé. Le rythme en propositions parallèles reproduit la progression du texte hébreu. « Flamboie » maintient l’intensité poétique ; « désert dévasté » reste immédiatement compréhensible. Le marqueur [a] est placé sur la proposition qu’il explique.
