  - severity: low
    issue: « désert dévasté » est moins précis que l'expression hébraïque
    rationale: מִדְבַּר שְׁמָמָה décrit un désert caractérisé par la désolation. « Désert désolé » garde cette qualification sans laisser entendre qu'un désert aurait été secondairement dévasté.
