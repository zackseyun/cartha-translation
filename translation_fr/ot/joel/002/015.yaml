  source_fidelity: 'Le texte rend fidèlement les trois impératifs pluriels hébreux et leurs compléments : faire retentir le שׁוֹפָר à Sion, consacrer un jeûne et convoquer une עֲצָרָה. « Sonnez du cor » est une traduction contextuellement juste de תִּקְעוּ שׁוֹפָר ; « à Sion » rend naturellement בְּצִיּוֹן. Aucun ajout doctrinal ni effacement d’ambiguïté significative n’est relevé.'
