id: JOL.2.15
reference: Joel 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תִּקְע֥וּ שׁוֹפָ֖ר בְּ/צִיּ֑וֹן קַדְּשׁוּ צ֖וֹם קִרְא֥וּ עֲצָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/015.yaml
  text: Blow a trumpet in Zion[a]; consecrate a fast[c][b]; call a solemn assembly.
translation:
  language: fr
  text: Sonnez du cor à Sion[a] ! Consacrez un jeûne[b] ! Convoquez une assemblée solennelle[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la trompette ». Le mot hébreu désigne le cor employé pour donner l’alarme ou lancer une convocation sacrée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sanctifiez un jeûne », c’est-à-dire mettez-le à part pour un usage sacré.
    reason: lexical_alternative
  - marker: c
    text: Ou « une assemblée sacrée ». Le terme hébreu désigne une réunion religieuse formelle et solennelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Sonnez
  rationale: L’impératif pluriel de תקע, construit avec שׁוֹפָר, désigne l’action de faire retentir l’instrument. « Sonnez du cor » est naturel en français et conserve la force de l’ordre.
- source_word: שׁוֹפָר
  choice: cor
  rationale: שׁוֹפָר désigne un cor utilisé notamment pour donner l’alarme ou lancer une convocation sacrée. « Cor » préserve mieux la nature de l’instrument que le terme générique « trompette », sans imposer qu’il s’agisse nécessairement d’une corne de bélier.
- source_word: בְּצִיּוֹן
  choice: à Sion
  rationale: Dans ce contexte locatif, בְּ se rend naturellement par « à » devant le nom de lieu Sion.
- source_word: קַדְּשׁוּ
  choice: Consacrez
  rationale: Le piel impératif pluriel de קדשׁ signifie ici mettre à part pour un usage sacré. « Consacrez » exprime clairement cette désignation religieuse formelle.
- source_word: צוֹם
  choice: un jeûne
  rationale: Le nom désigne un jeûne déterminé comme observance communautaire, et non simplement l’action abstraite de jeûner.
- source_word: קִרְאוּ
  choice: Convoquez
  rationale: Dans cette construction, קרא signifie appeler les personnes à se réunir. « Convoquez » rend explicitement et naturellement cette valeur contextuelle.
- source_word: עֲצָרָה
  choice: une assemblée solennelle
  rationale: עֲצָרָה désigne une réunion religieuse formelle. « Assemblée solennelle » en conserve le caractère sacré et grave sans surinterpréter son étymologie discutée.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Les trois impératifs brefs et parallèles reproduisent le rythme pressant de l’hébreu. « Cor » évite l’image moderne d’une trompette métallique tout en maintenant en note l’alternative lexicale.
