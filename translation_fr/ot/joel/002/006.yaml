source:
  edition: WLC
  text: מִ/פָּנָ֖י/ו יָחִ֣ילוּ עַמִּ֑ים כָּל פָּנִ֖ים קִבְּצ֥וּ פָארֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/006.yaml
  text: Before him peoples writhe[b][a]; all faces grow pale.
translation:
  language: fr
  text: Devant lui, les peuples se tordent d’angoisse[a] ; tous les visages pâlissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tremblent » ou « sont saisis d’angoisse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous les visages rassemblent פָארוּר » ; le dernier mot est rare, et l’expression est généralement comprise comme indiquant que les visages perdent leur couleur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפָּנָיו
  choice: Devant lui
  rationale: La tournure מִן avec פָּנִים et le suffixe de troisième personne exprime ici la réaction provoquée par la présence ou l’approche de quelqu’un. « Devant lui » est naturel et conserve le référent masculin sans l’expliciter.
- source_word: יָחִילוּ
  choice: se tordent d’angoisse
  rationale: Le verbe חול au qal peut évoquer les convulsions, le tremblement ou les douleurs comparables à celles de l’enfantement. Cette formulation garde à la fois l’intensité physique et la détresse.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne collectivement des groupes humains sans imposer la notion politique plus étroite de « nations ».
- source_word: כָּל פָּנִים
  choice: tous les visages
  rationale: Cette traduction directe préserve l’expression collective hébraïque tout en restant idiomatique en français.
- source_word: קִבְּצוּ פָארוּר
  choice: pâlissent
  rationale: L’expression, littéralement difficile et comprenant un nom rare, est généralement comprise comme décrivant la perte de couleur des visages sous l’effet de la terreur. « Pâlissent » en restitue naturellement le sens contextuel.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans מִפָּנָיו
  choice: Conserver « lui » sans nommer explicitement le référent
  alternative: « Devant le SEIGNEUR » ou « devant elle » en référence à l’armée
  rationale: Le contexte peut orienter vers la force qui avance, personnifiée au masculin, tout en l’associant étroitement au jour du SEIGNEUR. La traduction ne tranche pas une ambiguïté que l’hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Se tordent d’angoisse » conserve la vigueur corporelle de l’hébreu ; « pâlissent » rend idiomatiquement une expression hébraïque obscure sans masquer la difficulté, signalée en note.
