  text: וּ/מָלְא֥וּ הַ/גֳּרָנ֖וֹת בָּ֑ר וְ/הֵשִׁ֥יקוּ הַ/יְקָבִ֖ים תִּיר֥וֹשׁ וְ/יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/024.yaml
  text: The threshing floors will be filled with grain[a], and the vats will overflow with new wine and oil.
translation:
  language: fr
  text: Les aires de battage seront pleines de grain, et les cuves déborderont de vin nouveau et d’huile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: seront pleines
  rationale: Dans ce contexte prophétique, le parfait avec waw exprime le résultat futur de la restauration. « Seront pleines » rend naturellement l’état d’abondance annoncé.
- source_word: הַגֳּרָנוֹת
  choice: les aires de battage
  rationale: גֹּרֶן désigne l’aire où l’on battait et vannait les céréales; le pluriel est conservé.
- source_word: בָּר
  choice: grain
  rationale: Le terme désigne ici les céréales battues de façon générale, sans imposer l’idée plus précise de blé.
- source_word: וְהֵשִׁיקוּ
  choice: déborderont
  rationale: Le verbe évoque des récipients dont le contenu surabonde; « déborderont » restitue clairement cette image.
- source_word: הַיְקָבִים
  choice: les cuves
  rationale: יֶקֶב désigne les cuves liées au pressage et à la collecte du jus de raisin ou de l’huile. Le contexte précise leur contenu.
- source_word: תִּירוֹשׁ
  choice: vin nouveau
  rationale: תִּירוֹשׁ désigne le produit récent de la vigne et conserve ici la nuance agricole et saisonnière.
- source_word: וְיִצְהָר
  choice: huile
  rationale: יִצְהָר désigne l’huile comme produit agricole, normalement l’huile d’olive; « huile » est direct et n’ajoute pas une précision absente de la formulation hébraïque.
