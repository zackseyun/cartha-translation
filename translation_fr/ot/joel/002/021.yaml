source:
  edition: WLC
  text: אַל תִּֽירְאִ֖י אֲדָמָ֑ה גִּ֣ילִי וּ/שְׂמָ֔חִי כִּֽי הִגְדִּ֥יל יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/021.yaml
  text: Do not fear[a], O land; rejoice and be glad, for Yahweh has done great things.
translation:
  language: fr
  text: Ne crains pas, ô terre ! Exulte et réjouis-toi, car Yahweh a fait de grandes choses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque pouvant aussi se rendre : « a agi grandement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Ne crains pas
  rationale: אַל suivi de l’inaccompli exprime ici une défense. Le féminin singulier correspond à l’adresse personnifiée à אֲדָמָה.
- source_word: אֲדָמָה
  choice: ô terre
  rationale: Dans ce contexte agricole, le terme désigne la terre personnifiée. « Terre » conserve à la fois la dimension du sol et celle du pays, tandis que « ô » marque clairement l’apostrophe poétique.
- source_word: גִּילִי
  choice: Exulte
  rationale: Le verbe exprime une joie vive et jubilante. « Exulte » rend cette intensité tout en restant compréhensible dans un registre prophétique digne.
- source_word: וּשְׂמָחִי
  choice: et réjouis-toi
  rationale: Cette formulation distingue le second impératif du premier et préserve l’intensification poétique produite par les deux verbes de joie.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation ; « car » exprime naturellement ce lien causal.
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: a fait de grandes choses
  rationale: Cette tournure hébraïque signifie littéralement « a agi grandement » et, de manière idiomatique, « a fait de grandes choses ». La traduction retenue est naturelle en français et conserve l’idée d’actions remarquables.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- issue: Auteur des grandes actions
  choice: Yahweh a fait de grandes choses
  alternative: Yahweh a agi avec grandeur
  rationale: La tournure attribue explicitement l’action à Yahweh sans préciser davantage sa nature. La traduction conserve cette affirmation et laisse le contexte définir les actions visées.
translation_notes:
  register: Français international moderne, clair et digne. L’apostrophe « ô terre » et le verbe « exulte » conservent la force poétique et prophétique sans archaïsme excessif. Le marqueur [a] est placé sur la tournure hébraïque qu’il explique.
