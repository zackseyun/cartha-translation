source:
  edition: WLC
  text: כְּ/גִבּוֹרִ֣ים יְרֻצ֔וּ/ן כְּ/אַנְשֵׁ֥י מִלְחָמָ֖ה יַעֲל֣וּ חוֹמָ֑ה וְ/אִ֤ישׁ בִּ/דְרָכָי/ו֙ יֵֽלֵכ֔וּ/ן וְ/לֹ֥א יְעַבְּט֖וּ/ן אֹרְחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
translation:
  language: fr
  text: Comme des guerriers, ils courent ; comme des hommes de guerre, ils escaladent la muraille. Chacun suit son chemin, et ils ne dévient pas de leurs sentiers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne rompent pas les rangs ». Le verbe hébreu est rare et peut désigner le fait de ne pas quitter une formation ou une trajectoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים
  choice: Comme des guerriers
  rationale: Dans ce contexte militaire, גִּבּוֹרִים désigne des hommes forts au combat. « Guerriers » restitue directement cette valeur sans employer l’archaïque « vaillants hommes ».
- source_word: יְרֻצוּן
  choice: ils courent
  rationale: Le verbe רוץ signifie simplement « courir ». Le présent français conserve la description vive de leur avancée.
- source_word: כְּאַנְשֵׁי מִלְחָמָה
  choice: comme des hommes de guerre
  rationale: La locution signifie littéralement « comme des hommes de guerre ». Cette formulation préserve l’expression masculine et militaire du texte, tout en distinguant ce groupe lexical de גִּבּוֹרִים, « guerriers ».
- source_word: יַעֲלוּ חוֹמָה
  choice: ils escaladent la muraille
  rationale: עלה exprime la montée ; avec חוֹמָה, « escalader la muraille » rend naturellement l’action sans réduire le mouvement à une simple ascension abstraite.
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  choice: Chacun avance dans sa voie
  rationale: אִישׁ a ici une valeur distributive, « chacun ». « Avance » convient au mouvement coordonné de la troupe, tandis que « dans sa voie » reste proche de la construction hébraïque sans suggérer nécessairement un choix individuel.
- source_word: וְלֹא יְעַבְּטוּן
  choice: ils ne dévient pas
  rationale: Ce verbe rare est difficile. Dans le parallélisme, il semble indiquer qu’ils ne quittent ni ne perturbent leur trajectoire. « Ne dévient pas » conserve cette idée sans imposer l’interprétation plus précise d’une rupture des rangs.
- source_word: אֹרְחוֹתָם
  choice: leurs sentiers
  rationale: אֹרַח désigne un sentier, une piste ou un parcours. « Sentiers » maintient le parallélisme avec « voie » tout en reflétant la variation lexicale de l’hébreu.
theological_decisions:
- issue: Expression militaire masculine
  choice: Conserver « hommes de guerre » et le distributif masculin « chacun »
  alternative: Employer « soldats » et une formulation collective épicène
  rationale: L’hébreu emploie explicitement אֲנָשִׁים, « hommes », ainsi que אִישׁ, « chacun / chaque homme ». La traduction conserve cette forme dans la comparaison militaire sans en tirer une affirmation doctrinale sur le genre.
- issue: Discipline de la troupe
  choice: Traduire le verbe rare par « ne dévient pas »
  alternative: « ne rompent pas les rangs »
  rationale: Le contexte peut évoquer une formation militaire disciplinée, mais le verbe ne permet pas d’imposer avec certitude l’image technique des rangs. La traduction principale garde le sens plus large de non-déviation, et la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme parallèle du verset est conservé, ainsi que la distinction entre « guerriers » et « hommes de guerre », puis entre « voie » et « sentiers ».
