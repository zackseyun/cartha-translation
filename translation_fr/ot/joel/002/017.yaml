  text: בֵּ֤ין הָ/אוּלָם֙ וְ/לַ/מִּזְבֵּ֔חַ יִבְכּוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָ֑ה וְֽ/יֹאמְר֞וּ ח֧וּסָ/ה יְהוָ֣ה עַל עַמֶּ֗/ךָ וְ/אַל תִּתֵּ֨ן נַחֲלָתְ/ךָ֤ לְ/חֶרְפָּה֙ לִ/מְשָׁל בָּ֣/ם גּוֹיִ֔ם לָ֚/מָּה יֹאמְר֣וּ בָֽ/עַמִּ֔ים אַיֵּ֖ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
translation:
  language: fr
  text: 'Qu’entre le portique[a] et l’autel,

    les prêtres qui sont au service de Yahweh pleurent et disent :


    « Épargne ton peuple, Yahweh !


    Ne fais pas de ton héritage un objet d’opprobre,

    un sujet de raillerie parmi les nations[b].


    Pourquoi les peuples diraient-ils :

    “ Où est leur Dieu ? ” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le vestibule », ou encore « le porche ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « pour que les nations dominent sur eux ». L’hébreu peut évoquer soit une formule de mépris, soit une domination étrangère ; le contexte de l’opprobre et de la question moqueuse qui suit favorise ici le sens de raillerie publique.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  choice: entre le portique et l’autel
  rationale: אוּלָם désigne l’espace d’entrée couvert du Temple. « Portique » est clair, digne et courant, tandis que la note conserve « vestibule » et « porche » comme équivalents possibles.
- source_word: יִבְכּוּ ... וְיֹאמְרוּ
  choice: pleurent et disent
  rationale: Dans cet appel liturgique, les formes verbales ont une valeur exhortative. La construction française introduite par « Qu’… » rend naturellement cette nuance.
- source_word: הַכֹּהֲנִים מְשָׁרְתֵי יְהוָה
  choice: les prêtres qui sont au service de Yahweh
  rationale: Le participe מְשָׁרְתֵי caractérise le service cultuel des prêtres. Cette formulation est naturelle en français et évite l’ambiguïté moderne de « ministres ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: חוּסָה ... עַל עַמֶּךָ
  choice: Épargne ton peuple
  rationale: L’impératif demande à Yahweh de retenir le jugement et d’agir avec compassion. « Épargne » exprime ce sens avec concision.
- source_word: נַחֲלָתְךָ
  choice: ton héritage
  rationale: « Héritage » maintient l’image d’Israël comme part attribuée à Yahweh et conserve sa portée d’alliance.
- source_word: לְחֶרְפָּה
  choice: à la honte
  rationale: חֶרְפָּה évoque le déshonneur public, l’opprobre et les insultes. « Honte » est immédiatement compréhensible tout en gardant cette dimension sociale.
- source_word: לִמְשָׁל בָּם גּוֹיִם
  choice: pour que les nations dominent sur lui
  rationale: La vocalisation massorétique לִמְשָׁל favorise l’infinitif « dominer ». Le pronom pluriel hébreu renvoie collectivement au peuple désigné comme « héritage » ; le français reprend grammaticalement ce dernier par « lui ». L’autre compréhension ancienne et contextuellement plausible, celle d’un dicton moqueur, est conservée en note.
- source_word: לָמָּה יֹאמְרוּ בָעַמִּים
  choice: Pourquoi dirait-on parmi les peuples
  rationale: Le conditionnel français exprime la conséquence redoutée dans cette question rhétorique. Le pronom indéfini « on » rend idiomatiquement le sujet pluriel dans ce discours rapporté parmi les peuples.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte porte explicitement le tétragramme. Sa transcription préserve le nom personnel de Dieu sans lui substituer un titre.
- issue: Sens de לִמְשָׁל בָּם גּוֹיִם
  choice: pour que les nations dominent sur lui
  alternative: pour qu’il devienne un objet de raillerie parmi les nations
  rationale: La vocalisation du texte massorétique soutient le verbe « dominer », tandis que le parallélisme avec « honte » et la question moqueuse « Où est leur Dieu ? » soutiennent une compréhension liée au proverbe ou à la raillerie. Le texte principal suit ici la vocalisation massorétique et la note préserve l’autre lecture sans effacer l’ambiguïté.
translation_notes:
  register: Français international actuel, sobre et liturgique. La structure poétique est conservée sans archaïsmes. Les deux marqueurs de note figurent dans le texte au point précis auquel leur note se rapporte.
