revisions:
- from: 'Qu’entre le portique[a] et l’autel, les prêtres qui sont au service de Yahweh pleurent et disent :

    « Épargne ton peuple, Yahweh !

    Ne livre pas ton héritage à la honte,

    pour que les nations dominent sur lui[b].

    Pourquoi dirait-on parmi les peuples :

    “Où est leur Dieu ?” »'
  to: 'Qu’entre le portique[a] et l’autel,

    les prêtres qui sont au service de Yahweh pleurent et disent :


    « Épargne ton peuple, Yahweh !


    Ne fais pas de ton héritage un objet d’opprobre,

    un sujet de raillerie parmi les nations[b].


    Pourquoi les peuples diraient-ils :

    “ Où est leur Dieu ? ” »'
  rationale: La révision rétablit dans le texte principal le sens de raillerie ou de dicton injurieux, le mieux soutenu par la formulation massorétique dans son contexte immédiat, tout en conservant en note l’interprétation concurrente de la domination étrangère. Elle améliore aussi la représentation du sujet pluriel dans la dernière question et précise le sens public de חֶרְפָּה par « opprobre ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:52:28Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction de לִמְשָׁל בָּם גּוֹיִם par « pour que les nations dominent sur lui » ne correspond pas au sens le plus directement indiqué par la forme massorétique telle qu’elle est transmise ici. Dans ce contexte, le substantif « dicton / objet de raillerie » convient mieux, en parallèle avec « opprobre » et avec la question moqueuse qui suit. La possibilité d’une domination étrangère doit être maintenue en note. « Pourquoi les peuples diraient-ils » rend plus explicitement le sujet pluriel de יֹאמְרוּ tout en conservant la valeur rhétorique redoutée.
  naturalness: Le français est globalement naturel et le registre liturgique est approprié. « Objet d’opprobre » et « sujet de raillerie » sont idiomatiques, compréhensibles et conservent la densité poétique du texte. La reprise explicite de « les peuples » est plus directe que le pronom indéfini « on ».
  terminology: « Portique », « autel », « prêtres », « Yahweh » et « héritage » sont appropriés. « Opprobre » est plus précis que « honte » pour חֶרְפָּה, qui désigne le déshonneur public et le reproche. Le nom divin est conservé sous la forme « Yahweh ».
  issues:
  - severity: high
    issue: Le texte principal choisit la domination des nations pour לִמְשָׁל בָּם גּוֹיִם.
    rationale: Cette lecture est possible et doit être signalée, mais le texte massorétique et le contexte de l’opprobre public et de la moquerie des peuples favorisent « dicton / raillerie parmi les nations ». Le choix principal actuel inverse indûment la priorité contextuelle et lexicale retenue par l’audit anglais.
  - severity: medium
    issue: « Pourquoi dirait-on parmi les peuples » obscurcit le sujet pluriel de la proposition hébraïque.
    rationale: Le français peut employer « on », mais « Pourquoi les peuples diraient-ils » représente plus clairement les peuples qui prononcent la moquerie et évite une lecture impersonnelle.
  - severity: low
    issue: « Honte » atténue la dimension de reproche public de חֶרְפָּה.
    rationale: « Opprobre » conserve mieux l’idée de déshonneur infligé et de blâme public, sans archaïsme excessif dans ce registre.
