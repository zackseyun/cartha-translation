- from: 'Alors le SEIGNEUR répondit à son peuple : « Voici, je vous envoie le blé, le vin nouveau et l’huile fraîche. Vous en serez rassasiés, et je ne ferai plus de vous un objet de honte parmi les nations. »'
  to: 'Alors le SEIGNEUR répondit à son peuple : « Voici, je vous envoie les céréales, le vin nouveau et l’huile. Vous en serez rassasiés, et je ne ferai plus de vous un objet d’opprobre parmi les nations. »'
  rationale: La révision corrige les deux restrictions lexicales ajoutées par « blé » et « fraîche », tout en conservant la structure claire et le ton solennel du projet. « Répondit à son peuple » introduit naturellement la parole divine en français et rend la fonction de la formule hébraïque « répondit et dit » sans lourdeur.
