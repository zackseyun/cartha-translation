  text: וַ/יַּ֨עַן יְהוָ֜ה וַ/יֹּ֣אמֶר לְ/עַמּ֗/וֹ הִנְ/נִ֨י שֹׁלֵ֤חַ לָ/כֶם֙ אֶת הַ/דָּגָן֙ וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר וּ/שְׂבַעְתֶּ֖ם אֹת֑/וֹ וְ/לֹא אֶתֵּ֨ן אֶתְ/כֶ֥ם ע֛וֹד חֶרְפָּ֖ה בַּ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: fr
  text: 'Alors le SEIGNEUR répondit à son peuple : « Voici, je vous envoie les céréales, le vin nouveau et l’huile. Vous en serez rassasiés, et je ne ferai plus de vous un objet d’opprobre parmi les nations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, avec les petites capitales représentées ici par des capitales.
- source_word: הִנְנִי
  choice: Voici, je
  rationale: Conserve la force présentative et emphatique de la formule hébraïque dans un français digne et naturel.
- source_word: הַדָּגָן
  choice: le blé
  rationale: Dans ce contexte de restauration agricole, « blé » constitue une désignation française naturelle de la production céréalière, sans alourdir la phrase.
- source_word: הַתִּירוֹשׁ
  choice: le vin nouveau
  rationale: Distingue le produit récent de la vigne du terme général désignant le vin et conserve la nuance agricole du mot hébreu.
- source_word: הַיִּצְהָר
  choice: l’huile fraîche
  rationale: Le terme désigne l’huile nouvellement produite, notamment l’huile d’olive; « fraîche » maintient le parallélisme avec « vin nouveau ».
- source_word: וּשְׂבַעְתֶּם אֹתוֹ
  choice: Vous en serez rassasiés
  rationale: Le pronom hébreu singulier peut reprendre collectivement les denrées promises; « en » conserve cette portée sans imposer un antécédent unique.
- source_word: חֶרְפָּה
  choice: un objet de honte
  rationale: Exprime la condition publique d’opprobre ou de déshonneur parmi les nations, plutôt qu’une simple parole insultante.
theological_decisions:
- issue: Valeur de וַיַּעַן au début de la réponse divine
  choice: répondit
  alternative: prit la parole
  rationale: Le contexte précédent contient l’appel du peuple et des prêtres; la valeur ordinaire « répondre » convient sans préciser de manière excessive la nature de la réponse.
- issue: Agent de l’opprobre dans וְלֹא אֶתֵּן אֶתְכֶם עוֹד חֶרְפָּה
  choice: je ne ferai plus de vous un objet de honte
  alternative: je ne vous livrerai plus à l’opprobre
  rationale: Cette formulation garde Dieu comme sujet de נָתַן tout en évitant d’ajouter un mécanisme précis par lequel l’opprobre surviendrait.
translation_notes:
  register: Français international moderne, solennel mais accessible. La coordination hébraïque est légèrement restructurée en deux phrases dans la citation afin d’assurer une lecture naturelle sans perdre les relations logiques du verset.
