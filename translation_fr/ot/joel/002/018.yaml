source:
  edition: WLC
  text: וַ/יְקַנֵּ֥א יְהוָ֖ה לְ/אַרְצ֑/וֹ וַ/יַּחְמֹ֖ל עַל עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/018.yaml
  text: Then Yahweh became jealous for his land and had compassion on his people[a].
translation:
  language: fr
  text: Alors Yahvé devint jaloux de son pays[a] et eut compassion de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se montra plein de zèle pour son pays ». Le verbe hébreu peut exprimer la jalousie ou le zèle ; il désigne ici l’attachement ardent de Yahvé à ce qui lui appartient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנֵּא
  choice: fut saisi de jalousie
  rationale: Le verbe קנא peut exprimer la jalousie ou le zèle. Cette formulation conserve ici la force affective et l'attachement exclusif de Yahvé à ce qui lui appartient, tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par un titre de substitution.
- source_word: לְאַרְצוֹ
  choice: pour son pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire d'Israël plutôt que la terre entière. Après קנא, לְ introduit l'objet de la jalousie ou du zèle protecteur.
- source_word: וַיַּחְמֹל
  choice: eut compassion
  rationale: חמל exprime la compassion, la pitié ou le fait d'épargner. « Eut compassion » convient au mouvement affectif et restaurateur du contexte sans réduire le sens au seul fait d'épargner.
- source_word: עַל עַמּוֹ
  choice: de son peuple
  rationale: En français, la construction idiomatique est « avoir compassion de ». עַם désigne ici la communauté qui appartient à Yahvé.
theological_decisions:
- issue: Jalousie ou zèle de Dieu
  choice: fut saisi de jalousie pour son pays
  alternative: déploya son zèle pour son pays
  rationale: Le terme hébreu permet les deux nuances. « Jalousie » préserve l'idée d'un attachement ardent et exclusif lié à l'alliance; la note maintient l'autre lecture possible sans effacer l'ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Pays » évite que « terre » soit compris comme la planète entière. La tournure « fut saisi de jalousie » rend la force du verbe tout en évitant l'ambiguïté française de « être jaloux de son pays », qui pourrait suggérer l'envie.
