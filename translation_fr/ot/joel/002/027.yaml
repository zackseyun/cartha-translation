source:
  edition: WLC
  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
translation:
  language: fr
  text: Alors vous saurez que je suis au milieu d’Israël, que moi, je suis Yahweh, votre Dieu, et qu’il n’y en a pas d’autre. Mon peuple ne sera plus jamais couvert de honte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon peuple ne sera jamais couvert de honte. »'
    reason: Cette variante conserve l’idée de négation durable portée par לֹא ... לְעוֹלָם sans l’ambiguïté française de « ne ... pas ... pour toujours ».
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait qal à valeur prophétique, précédé de la conjonction, exprime ici le résultat des promesses de rétablissement qui précèdent. « Alors » rend naturellement ce lien conséquentiel.
- source_word: בְקֶרֶב יִשְׂרָאֵל
  choice: au milieu d’Israël
  rationale: Cette formulation conserve l’idée d’une présence au sein du peuple, plus précisément que le simple « parmi Israël ».
- source_word: וַאֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: que moi, je suis Yahweh, votre Dieu
  rationale: Le pronom répété est emphatique. La dislocation « moi, je » en restitue l’insistance dans un français naturel, tandis que « votre Dieu » exprime directement le lien d’alliance.
- source_word: וְאֵין עוֹד
  choice: et qu’il n’y en a pas d’autre
  rationale: Cette tournure française idiomatique maintient l’affirmation d’exclusivité sans préciser artificiellement un référent absent de l’hébreu.
- source_word: וְלֹא יֵבֹשׁוּ
  choice: ne sera plus jamais couvert de honte
  rationale: Dans ce contexte de rétablissement et de justification publique, le verbe évoque la honte ou l’humiliation subie. Le singulier s’accorde naturellement avec le collectif « mon peuple ».
- source_word: לְעוֹלָם
  choice: plus jamais
  rationale: Avec la négation, cette expression rend idiomatiquement le caractère définitif de la promesse après une période de honte. La formulation plus littérale est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de וְאֵין עוֹד
  choice: il n’y en a pas d’autre
  alternative: il n’y en a plus ; nul autre n’existe
  rationale: Le choix préserve l’affirmation de l’unicité de Yahweh sans développer celle-ci au-delà de la formulation du verset.
- issue: Sens de la formule לֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: Mon peuple ne sera plus jamais couvert de honte
  alternative: Mon peuple ne sera pas couvert de honte pour toujours
  rationale: La traduction principale exprime en français courant la cessation définitive de la disgrâce. La note maintient visible la construction littérale, qui pourrait autrement sembler ambiguë en français.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux propositions introduites par « que » conserve le parallélisme hébreu; « moi, je » marque l’emphase du pronom. Le point avant la promesse finale évite une phrase excessivement chargée sans rompre la progression logique.
