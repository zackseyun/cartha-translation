source:
  edition: WLC
  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
translation:
  language: fr
  text: 'Yahweh fait entendre sa voix devant son armée[a], car son camp est extrêmement nombreux ; car puissant est celui qui accomplit sa parole[b]. Car le jour de Yahweh est grand, extrêmement redoutable : qui peut le supporter ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donne sa voix » ; on peut aussi traduire : « élève la voix ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui accomplit son ordre ». Le mot hébreu traduit par « parole » peut désigner ici un commandement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה נָתַן קוֹלוֹ
  choice: Yahweh fait entendre sa voix
  rationale: Le parfait prophétique peut être rendu au présent dans cette description vive. « Faire entendre sa voix » exprime naturellement l’hébreu littéral « donner sa voix », sans préciser s’il s’agit d’un cri, d’un ordre ou du tonnerre.
- source_word: לִפְנֵי חֵילוֹ
  choice: devant son armée
  rationale: חַיִל désigne ici une force organisée sous le commandement de Yahweh ; « armée » est clair et conserve l’imagerie militaire.
- source_word: כִּי רַב מְאֹד מַחֲנֵהוּ
  choice: car son camp est extrêmement nombreux
  rationale: מַחֲנֶה peut désigner le camp et, par métonymie, les troupes qui le composent. Avec רַב, « nombreux » convient mieux au contexte qu’une simple indication de superficie.
- source_word: כִּי עָצוּם עֹשֵׂה דְבָרוֹ
  choice: Oui, puissant est celui qui exécute sa parole
  rationale: La construction conserve le participe singulier et son possible sens collectif. « Exécuter sa parole » rend l’accomplissement effectif de ce que Yahweh a dit, tout en laissant à « parole » une portée plus large que « ordre ».
- source_word: כִּי גָדוֹל יוֹם יְהוָה וְנוֹרָא מְאֹד
  choice: Car le jour de Yahweh est grand et extrêmement redoutable
  rationale: « Redoutable » rend נוֹרָא comme ce qui inspire la crainte dans un contexte de jugement, sans l’affaiblissement positif que pourrait avoir « impressionnant ».
- source_word: וּמִי יְכִילֶנּוּ
  choice: qui pourra le supporter ?
  rationale: Le verbe יכל exprime ici la capacité de tenir face à ce jour ou de l’endurer ; « supporter » est idiomatique et le pronom renvoie naturellement au jour de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: La translittération « Yahweh » conserve la référence explicite au nom divin et suit la politique fournie, sans substituer un titre.
- issue: Nature de l’armée et du camp de Yahweh
  choice: Maintenir l’armée comme force appartenant à Yahweh et exécutant sa parole, sans en préciser davantage la nature
  alternative: Identifier explicitement la force à des sauterelles ou à une armée humaine
  rationale: Les suffixes possessifs et l’exécution de la parole de Yahweh présentent cette force comme placée sous son autorité, mais le verset ne tranche pas à lui seul entre essaim, armée humaine ou superposition des deux images.
- issue: Nombre du participe עֹשֵׂה
  choice: celui qui exécute
  alternative: ceux qui exécutent
  rationale: Le texte hébreu emploie un participe singulier, susceptible d’une portée collective. Le singulier français préserve cette forme et l’ambiguïté de son référent.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est conservé par les propositions brèves, l’inversion « puissant est celui » et la question finale. Les marqueurs [a] et [b] figurent dans le texte au point concerné.
