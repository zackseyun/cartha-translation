source:
  edition: WLC
  text: הָכְרַ֥ת מִנְחָ֛ה וָ/נֶ֖סֶךְ מִ/בֵּ֣ית יְהוָ֑ה אָֽבְלוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/009.yaml
  text: The grain offering and the drink offering are cut off from the house of Yahweh[a]; the priests mourn[c][b], the ministers of Yahweh.
translation:
  language: fr
  text: L’offrande de céréales et la libation ont été supprimées de la maison de Yahweh[a] ; les prêtres, ceux qui servent Yahweh, sont dans le deuil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Yahweh » désigne ici son temple, son sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכְרַת
  choice: ont disparu
  rationale: Le hophal de כרת exprime ici la suppression ou la cessation des offrandes. « Ont disparu de » rend naturellement en français le résultat présent de cette interruption sans préciser une cause que le texte ne formule pas.
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans ce contexte cultuel, le terme désigne l’offrande faite de produits céréaliers plutôt qu’une offrande générique.
- source_word: נֶסֶךְ
  choice: libation
  rationale: Terme français précis pour une offrande liquide versée dans le cadre du culte.
- source_word: מִבֵּית יְהוָה
  choice: de la maison de Yahweh
  rationale: Cette formulation conserve l’image hébraïque de la « maison » tout en indiquant en note qu’il s’agit du temple ou sanctuaire.
- source_word: אָבְלוּ
  choice: sont dans le deuil
  rationale: Le verbe exprime le deuil et la lamentation ; cette tournure française est naturelle et garde la force de la réaction des prêtres.
- source_word: מְשָׁרְתֵי יְהוָה
  choice: ceux qui servent Yahweh
  rationale: Le participe décrit la fonction cultuelle des prêtres. Cette formulation claire évite l’ambiguïté moderne de « ministres » tout en conservant l’apposition hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. La translittération « Yahweh » le distingue d’un simple titre et suit le choix éditorial fourni, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. « Libation » conserve la précision cultuelle ; l’apposition « ceux qui servent Yahweh » explicite naturellement la fonction des prêtres sans modifier le sens.
