id: JOL.1.14
reference: Joel 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
translation:
  language: fr
  text: Consacrez un jeûne, convoquez une assemblée solennelle. Rassemblez les anciens et tous les habitants du pays[a] dans la maison de Yahweh, votre Dieu, et criez vers Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Le mot hébreu peut désigner soit le pays, soit la terre entière ; ici, l’appel centré sur le temple favorise le sens local.
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Consacrez
  rationale: L’impératif exprime la mise à part officielle du jeûne pour un usage sacré. « Consacrez » conserve cette portée cultuelle tout en restant clair en français moderne.
- source_word: צוֹם
  choice: un jeûne
  rationale: Équivalent français courant de צוֹם ; l’article indéfini convient à l’institution d’une occasion de jeûne.
- source_word: קִרְאוּ עֲצָרָה
  choice: convoquez une assemblée solennelle
  rationale: קרא peut désigner l’action de convoquer, tandis que עֲצָרָה désigne ici une assemblée cultuelle tenue dans un contexte grave. La formulation rend à la fois le rassemblement et sa solennité.
- source_word: אִסְפוּ
  choice: Rassemblez
  rationale: L’impératif demande de réunir les personnes mentionnées ensuite ; « rassemblez » est direct et naturel.
- source_word: זְקֵנִים
  choice: les anciens
  rationale: Dans ce contexte communautaire, le terme désigne vraisemblablement les responsables reconnus du peuple, sans exclure sa valeur liée à l’âge.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: tous les habitants du pays
  rationale: הָאָרֶץ peut désigner le pays ou la terre entière. L’appel local centré sur le sanctuaire de Yahweh favorise ici « pays », tout en signalant l’autre possibilité en note.
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  choice: dans la maison de Yahweh, votre Dieu
  rationale: L’hébreu juxtapose « maison » à l’ordre de rassembler, sans préposition explicite. « Dans » exprime naturellement en français le lieu visé par le rassemblement et « maison » conserve la désignation du temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: וְזַעֲקוּ אֶל יְהוָה
  choice: et criez vers Yahweh
  rationale: זעק exprime un cri pressant lancé dans la détresse ou la supplication. « Criez vers » préserve son intensité et la direction marquée par אֶל.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat convoque la population autour de la maison de Yahweh et favorise donc un référent local. La polysémie réelle du terme est conservée dans la note.
- issue: Relation entre « les anciens » et « tous les habitants »
  choice: deux groupes coordonnés dans la traduction
  alternative: 'une apposition : « les anciens, tous les habitants du pays »'
  rationale: La syntaxe hébraïque juxtapose les groupes sans conjonction explicite. La coordination française rend clairement l’étendue de l’appel sans trancher lourdement la relation syntaxique.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs brefs conservent l’urgence de l’appel prophétique ; le vocabulaire cultuel reste accessible sans être banalisé.
