lexical_decisions:
- source_word: דְּבַר
  choice: Parole
  rationale: Le nom à l’état construit avec יְהוָה forme la formule prophétique habituelle. « Parole » en préserve le lien formel et la résonance biblique, tandis que « message » explicite davantage le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par une translittération usuelle du nom divin plutôt que par le titre substitutif « le Seigneur ».
- source_word: אֲשֶׁר הָיָה אֶל
  choice: adressée à
  rationale: Cette tournure idiomatique introduit la réception d’une révélation prophétique. « Adressée à » est naturel en français dans la formule « parole de… », sans reproduire littéralement « qui fut vers ».
- source_word: יוֹאֵל
  choice: Joël
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement le marqueur généalogique hébreu.
- source_word: פְּתוּאֵל
  choice: Petouël
  rationale: Translittération française lisible du nom hébreu, distinguant ses voyelles et conservant le hiatus final.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom divin. La translittération conserve le caractère de nom propre, tandis que « le Seigneur » représente la lecture substitutive traditionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La formulation nominale conserve le caractère de titre introductif du verset et la formule prophétique, tout en évitant un calque peu naturel de l’hébreu.
