  text: The word of Yahweh that came to Joel son of Pethuel[a][b].
translation:
  language: fr
  text: La parole[a] de Yahweh[b] qui fut adressée à Joël, fils de Petouël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Message de Yahweh qui fut adressé à Joël, fils de Petouël. »'
