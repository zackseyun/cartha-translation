  naturalness: La formulation est globalement naturelle et d’un registre digne. « Lamentez-vous » est plus concis, idiomatique et bibliquement naturel que « Poussez des cris de douleur », tout en conservant la force du cri de deuil.
  terminology: « Cultivateurs », « vignerons », « blé » et « orge » sont justes. « Soyez consternés » est recevable, mais la note doit présenter plus exactement les possibilités sémantiques de הֹבִישׁוּ, notamment la honte/la confusion, sans faire de « déconcertés » une équivalence privilégiée.
