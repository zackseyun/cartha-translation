  text: הֹבִ֣ישׁוּ אִכָּרִ֗ים הֵילִ֨ילוּ֙ כֹּֽרְמִ֔ים עַל חִטָּ֖ה וְ/עַל שְׂעֹרָ֑ה כִּ֥י אָבַ֖ד קְצִ֥יר שָׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
translation:
  language: fr
  text: Soyez consternés[a], cultivateurs ! Lamentez-vous[b], vignerons, au sujet du blé et de l’orge, car la moisson du champ est perdue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Soyez couverts de honte ». Le verbe hébreu peut exprimer la honte ou la confusion, et, dans ce contexte, la consternation.
    reason: lexical_alternative
  - marker: b
    text: Ou « Hurlez ». Le verbe hébreu désigne un cri de lamentation intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Soyez consternés
  rationale: Le hifil impératif pluriel de בוש peut exprimer la honte, la confusion ou la consternation. Dans ce contexte de désastre agricole et en parallèle avec l’appel à pousser des cris de douleur, « soyez consternés » rend naturellement la détresse sans exclure la nuance de honte, signalée en note.
- source_word: אִכָּרִים
  choice: cultivateurs
  rationale: Le terme désigne ceux qui travaillent la terre. « Cultivateurs » est précis, moderne et convient directement au contexte des céréales.
- source_word: הֵילִילוּ
  choice: Poussez des cris de douleur
  rationale: L’impératif de ילל évoque une lamentation forte et audible. Cette formulation française en conserve l’intensité mieux que le simple verbe « pleurez ».
- source_word: כֹּרְמִים
  choice: vignerons
  rationale: Le mot désigne ceux qui cultivent et entretiennent les vignes. « Vignerons » est le terme français courant et précis.
- source_word: עַל
  choice: à cause de
  rationale: Dans cette lamentation, עַל introduit ce qui motive la détresse. « À cause de » est idiomatique en français et explicite le rapport causal.
- source_word: חִטָּה
  choice: blé
  rationale: Équivalent français usuel du nom de cette céréale.
- source_word: שְׂעֹרָה
  choice: orge
  rationale: Équivalent français usuel du nom de cette céréale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison des impératifs précédents. « Car » maintient avec naturel le lien explicatif dans un registre biblique actuel et digne.
- source_word: אָבַד
  choice: est perdue
  rationale: Le qal accompli de אבד exprime ici la disparition ou la ruine complète de la récolte. « Est perdue » rend clairement l’état résultant sans introduire un agent destructeur non exprimé.
- source_word: קְצִיר שָׂדֶה
  choice: la moisson des champs
  rationale: Le syntagme construit désigne la récolte provenant du champ. Le pluriel français « des champs » est idiomatique pour l’ensemble de la production agricole tout en conservant l’image concrète.
