  - severity: low
    issue: Pluriel « des champs » pour שָׂדֶה au singulier
    rationale: Le singulier hébreu désigne le champ comme cadre concret de la récolte. Le singulier français conserve plus étroitement l’image source et reste pleinement naturel.
  - severity: low
    issue: 'Note a : « déconcertés »'
    rationale: « Déconcertés » est trop faible et trop psychologique pour la gamme de בוש dans ce contexte. Les options « honteux », « couverts de honte » ou « consternés » reflètent mieux l’alternative sans affaiblir le registre.
