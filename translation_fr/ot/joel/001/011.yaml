- from: Soyez consternés[a], cultivateurs ! Poussez des cris de douleur[b], vignerons, à cause du blé et de l’orge, car la moisson des champs est perdue.
  to: Soyez consternés[a], cultivateurs ! Lamentez-vous[b], vignerons, au sujet du blé et de l’orge, car la moisson du champ est perdue.
