  text: גַּם בַּהֲמ֥וֹת שָׂדֶ֖ה תַּעֲר֣וֹג אֵלֶ֑י/ךָ כִּ֤י יָֽבְשׁוּ֙ אֲפִ֣יקֵי מָ֔יִם וְ/אֵ֕שׁ אָכְלָ֖ה נְא֥וֹת הַ/מִּדְבָּֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
translation:
  language: fr
  text: Même les animaux des champs halètent vers toi[a], car les cours d’eau sont à sec[b] et le feu a dévoré les pâturages du désert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « halètent vers toi ». Le verbe peut aussi évoquer un désir ardent ou un cri de détresse; la préposition indique l’orientation vers Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les chenaux » ou « les lits des cours d’eau se sont asséchés ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les pâturages de la steppe » ou « les lieux de pâture du désert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: La particule placée en tête souligne que la détresse atteint jusqu’aux animaux.
- source_word: בַּהֲמוֹת שָׂדֶה
  choice: les animaux des champs
  rationale: L’expression désigne largement les animaux vivant dans les espaces ouverts, sans la limiter au bétail domestique.
- source_word: תַּעֲרוֹג אֵלֶיךָ
  choice: se tournent vers toi en haletant
  rationale: ערג évoque le halètement causé par une soif intense, tandis que אֵלֶיךָ indique une orientation vers Dieu. Cette formulation conserve les deux aspects dans un français naturel.
- source_word: יָבְשׁוּ אֲפִיקֵי מָיִם
  choice: les cours d’eau sont à sec
  rationale: אֲפִיקִים peut désigner des chenaux, des lits de cours d’eau ou les cours d’eau eux-mêmes; « sont à sec » exprime clairement le résultat présent de la sécheresse.
- source_word: וְאֵשׁ אָכְלָה
  choice: et le feu a dévoré
  rationale: Le verbe « dévorer » préserve l’image concrète de אָכַל appliqué au feu et exprime l’ampleur de la destruction.
- source_word: נְאוֹת הַמִּדְבָּר
  choice: les pâturages des terres sauvages
  rationale: נְאוֹת désigne ici des lieux de pâture, et מִדְבָּר l’espace ouvert, non cultivé ou steppique; « terres sauvages » évite de suggérer uniquement un désert de sable.
theological_decisions:
- issue: Référent du suffixe de deuxième personne dans אֵלֶיךָ
  choice: Une adresse à Dieu (« vers toi »)
  alternative: Une aspiration décrite sans portée théologique explicite
  rationale: Le verset prolonge la prière du verset précédent et le suffixe masculin singulier renvoie naturellement à Dieu, auquel même les animaux se tournent dans leur détresse.
translation_notes:
  register: Français international moderne, sobre et poétique. « Se tournent vers toi en haletant » rend à la fois la détresse physique et l’orientation vers Dieu sans réduire le verbe à une aspiration purement abstraite.
