review_pass:
  verdict: revise
  source_fidelity: La phrase conserve bien l’enchaînement causal et l’imagerie de sécheresse et d’incendie. Toutefois, « se tournent vers toi en haletant » fait de « se tournent » le verbe principal et transforme le halètement en simple circonstance. Le verbe hébreu ערג exprime lui-même le halètement/le désir ardent, avec une orientation vers le destinataire indiquée par אֵלֶיךָ.
  naturalness: « Même les animaux des champs halètent vers toi » est à la fois plus proche de la syntaxe et de l’image hébraïques, et reste naturel dans un registre biblique français moderne. « Les pâturages du désert » est plus direct et plus conventionnel que « les pâturages des terres sauvages », sans exiger un désert de sable.
  terminology: « Animaux des champs », « cours d’eau », « feu a dévoré » et « pâturages » sont appropriés. « Vers toi » préserve la force directionnelle de אֵלֶיךָ sans imposer l’idiome français « après toi », qui interpréterait plus explicitement la relation de désir.
  issues:
  - severity: medium
    issue: Le prédicat principal est déplacé de « halètent » à « se tournent ».
    rationale: Le texte source dit littéralement que les animaux « halètent/crient de désir vers » Dieu; il ne décrit pas séparément une action de se tourner. La formulation actuelle ajoute cette action et atténue le poids lexical du verbe.
  - severity: low
    issue: « Terres sauvages » est une explicitation moins précise de מִדְבָּר.
    rationale: Le terme désigne ici le désert, la steppe ou le pays inculte. « Du désert », avec une note proposant « de la steppe », conserve mieux l’expression source et demeure idiomatique.
  revised_text: Même les animaux des champs halètent vers toi[a], car les cours d’eau sont à sec[b] et le feu a dévoré les pâturages du désert[c].
