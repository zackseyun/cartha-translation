translation_notes:
  register: Français international moderne, clair et digne. La répétition de « vos enfants / leurs enfants » conserve la cadence intergénérationnelle de l’hébreu ; les verbes sous-entendus sont explicités juste assez pour assurer une lecture naturelle.
