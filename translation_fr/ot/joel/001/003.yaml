  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
translation:
  language: fr
  text: Racontez-le à vos enfants[a] ; que vos enfants le racontent à leurs enfants, et que leurs enfants le racontent à une autre génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement « fils » dans la chaîne « vos fils… leurs fils… leurs fils ». Ici, « enfants » est employé parce qu’il s’agit de transmettre la mémoire au fil des générations en général, et non aux seuls descendants masculins.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  choice: cela
  rationale: Le pronom féminin singulier renvoie au fléau évoqué dans le contexte. Dans « raconter cela à », le français reprend naturellement l’événement sans reproduire le genre grammatical hébreu.
- source_word: לִבְנֵיכֶם
  choice: à vos enfants
  rationale: בנים peut désigner les fils en particulier ou les enfants au sens large. Ici, l’instruction porte sur la transmission de la mémoire de génération en génération ; « enfants » exprime naturellement cette portée générale.
- source_word: סַפֵּרוּ
  choice: Racontez
  rationale: L’impératif piel pluriel demande un récit délibéré. « Racontez » rend mieux cette idée de transmission narrative que le plus général « dites ».
- source_word: וּבְנֵיכֶם
  choice: que vos enfants le racontent
  rationale: Dans les propositions suivantes, l’hébreu sous-entend le verbe. Le français le rétablit pour rendre clairement la chaîne de transmission et prolonger la valeur injonctive de l’impératif.
- source_word: לִבְנֵיהֶם
  choice: à leurs enfants
  rationale: Comme dans la première occurrence, בנים désigne ici la descendance de façon générale, et non nécessairement les seuls fils.
- source_word: וּבְנֵיהֶם
  choice: et leurs enfants
  rationale: Ce choix conserve la répétition qui structure la succession des générations tout en gardant le sens familial large de בנים.
- source_word: לְדוֹר אַחֵר
  choice: à une autre génération
  rationale: L’expression désigne une génération ultérieure. « Une autre génération » reste proche de l’hébreu et évite de limiter le sens à la seule génération immédiatement suivante.
