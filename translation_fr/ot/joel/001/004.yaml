base_translation:
  language: en
  yaml_path: translation/ot/joel/001/004.yaml
  text: What the cutting locust left[a], the swarming locust ate; and what the swarming locust left, the hopping locust ate; and what the hopping locust left, the devouring locust ate.
translation:
  language: fr
  text: Ce qu’a laissé la locuste qui ronge[a], la locuste en essaim l’a mangé ; et ce qu’a laissé la locuste en essaim, la jeune locuste l’a mangé ; et ce qu’a laissé la jeune locuste, la locuste dévastatrice l’a mangé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les quatre termes hébreux désignent probablement des espèces ou des stades de développement de locustes, mais leurs différences zoologiques exactes sont incertaines. On pourrait aussi les rendre par « locuste qui coupe », « locuste en essaim », « locuste bondissante » et « locuste dévorante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר
  choice: ce qu’a laissé
  rationale: Le nom désigne le reste, ce qui subsiste. Cette tournure idiomatique conserve l’idée d’une dévastation successive et la répétition structurante de l’hébreu.
- source_word: גָּזָם
  choice: la locuste qui ronge
  rationale: Le terme désigne probablement une sorte ou un stade de locuste, possiblement caractérisé par l’action de ronger ou de couper. La formulation reste évocatrice sans prétendre à une identification zoologique certaine.
- source_word: אָכַל
  choice: l’a mangé
  rationale: Le verbe décrit dans chaque membre une action accomplie. « L’a mangé » restitue simplement le sens et maintient la cadence répétitive.
- source_word: אַרְבֶּה
  choice: la locuste en essaim
  rationale: C’est le terme hébreu courant pour la locuste, souvent envisagée dans son comportement grégaire. Le complément permet ici de la distinguer des trois autres désignations.
- source_word: יָּלֶק / יֶּלֶק
  choice: la jeune locuste
  rationale: Le terme peut désigner un type ou un stade de développement de la locuste. « Jeune locuste » est une possibilité traditionnelle et intelligible, mais l’incertitude exacte est signalée en note.
- source_word: חָסִיל
  choice: la locuste dévastatrice
  rationale: Le mot évoque un insecte qui consume ou détruit. « Dévastatrice » rend la force destructrice sans imposer une espèce précise.
- source_word: וְ
  choice: et
  rationale: La conjonction relie les étapes cumulatives. Elle n’est exprimée explicitement qu’au dernier membre en français afin d’obtenir une coordination naturelle tout en conservant l’effet d’accumulation.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Locuste » est retenu plutôt que « sauterelle » afin de désigner plus précisément l’insecte migrateur ravageur. La triple reprise de « ce qu’a laissé… l’a mangé » reproduit le rythme et la progression implacable de l’hébreu.
