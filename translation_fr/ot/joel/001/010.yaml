source:
  edition: WLC
  text: שֻׁדַּ֣ד שָׂדֶ֔ה אָבְלָ֖ה אֲדָמָ֑ה כִּ֚י שֻׁדַּ֣ד דָּגָ֔ן הוֹבִ֥ישׁ תִּיר֖וֹשׁ אֻמְלַ֥ל יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
translation:
  language: fr
  text: Le champ est dévasté ; le sol est en deuil, car le grain est dévasté, le vin nouveau s’est desséché, l’huile vient à manquer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’huile fraîche dépérit » ou « l’huile d’olive vient à manquer ». Le mot hébreu désigne l’huile fraîchement produite, généralement l’huile d’olive, dans la triade des produits de base : « grain, vin nouveau et huile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: est dévasté
  rationale: Le passif de שׁדד exprime une ruine violente. « Est dévasté » en conserve la force sans réduire le sens à un pillage militaire.
- source_word: שָׂדֶה
  choice: le champ
  rationale: Le sens courant est « champ ». Le singulier hébreu est conservé et peut avoir une valeur collective.
- source_word: אָבְלָה
  choice: est en deuil
  rationale: Le verbe signifie normalement « être en deuil, se lamenter ». Cette formulation maintient la personnification poétique du sol.
- source_word: אֲדָמָה
  choice: le sol
  rationale: « Sol » distingue אֲדָמָה du champ déjà mentionné et convient à la personnification.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du deuil du sol.
- source_word: דָּגָן
  choice: le grain
  rationale: Le terme désigne globalement les céréales ou leur produit, sans préciser une espèce.
- source_word: הוֹבִישׁ
  choice: s’est desséché
  rationale: Dans ce contexte agricole, la forme issue de יבש indique le dessèchement et son résultat présent.
- source_word: תִּירוֹשׁ
  choice: le vin nouveau
  rationale: Le terme désigne le vin nouvellement produit, ou le moût, plutôt que le vin en général.
- source_word: אֻמְלַל
  choice: vient à manquer
  rationale: Le verbe évoque ce qui dépérit, s’épuise ou fait défaut. Appliqué à l’huile, « vient à manquer » est naturel tout en gardant l’idée de défaillance de la production.
- source_word: יִצְהָר
  choice: l’huile
  rationale: Le terme désigne l’huile fraîchement produite, habituellement l’huile d’olive, dans la triade agricole grain-vin-huile.
