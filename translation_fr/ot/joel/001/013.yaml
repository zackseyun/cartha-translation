  to: Ceignez-vous et prenez le deuil[a], prêtres ! Lamentez-vous, vous qui servez à l’autel ! Venez, passez la nuit revêtus de sacs, vous qui servez mon Dieu, car l’offrande de céréales et la libation ont disparu de la maison de votre Dieu[b].
  rationale: La révision conserve le sens cultuel et la rhétorique du verset, y compris l’alternance volontaire entre « mon Dieu » et « votre Dieu ». Elle rend explicitement la relation indiquée par « de la maison », sans attribuer la cessation des offrandes à un agent non précisé, et améliore légèrement l’idiome français des lamentations et du vêtement de deuil.
