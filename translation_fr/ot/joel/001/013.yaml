source:
  edition: WLC
  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
translation:
  language: fr
  text: Ceignez-vous et prenez le deuil[a], prêtres ! Lamentez-vous, vous qui servez à l’autel ! Venez, passez la nuit revêtus de sacs, vous qui servez mon Dieu, car l’offrande de céréales et la libation ont disparu de la maison de votre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceignez-vous ». Dans ce contexte de deuil, il s’agit de se revêtir d’un sac, comme la suite du verset l’indique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du temple de votre Dieu ». L’hébreu dit littéralement : « de la maison de votre Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  choice: Ceignez-vous
  rationale: Conserve l’image littérale du verbe hébreu sans ajouter dès le premier impératif le « sac », qui n’est explicitement mentionné que plus loin dans le verset. La note en précise le sens dans ce contexte de deuil.
- source_word: וְסִפְדוּ
  choice: et prenez le deuil
  rationale: Exprime la lamentation rituelle liée au deuil et se distingue du cri intense rendu dans l’impératif suivant.
- source_word: הֵילִילוּ
  choice: Poussez des cris
  rationale: Rend la force du verbe, qui désigne des cris aigus de détresse, dans un français actuel et digne.
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  choice: vous qui servez à l’autel
  rationale: Rend naturellement la fonction cultuelle indiquée par le groupe construit, sans employer le mot français ambigu « ministres ».
- source_word: לִינוּ בַשַּׂקִּים
  choice: passez la nuit vêtus de sacs
  rationale: לִינוּ indique le fait de rester pendant la nuit; le pluriel concret « sacs » évoque ici les vêtements rugueux portés en signe de deuil.
- source_word: מְשָׁרְתֵי אֱלֹהָי
  choice: vous qui servez mon Dieu
  rationale: Préserve le suffixe de première personne « mon Dieu » et reprend naturellement l’idée de service cultuel.
- source_word: נִמְנַע
  choice: font défaut
  rationale: Exprime la cessation ou l’absence imposée des offrandes sans suggérer qu’elles auraient été physiquement retirées du sanctuaire. Cette tournure française s’accorde naturellement avec les deux éléments coordonnés.
- source_word: מִנְחָה וָנָסֶךְ
  choice: l’offrande de céréales et la libation
  rationale: Dans le contexte cultuel, מִנְחָה désigne l’offrande végétale, principalement céréalière, et נֶסֶךְ une offrande liquide versée, donc une libation.
- source_word: מִבֵּית אֱלֹהֵיכֶם
  choice: dans la maison de votre Dieu
  rationale: Avec « font défaut », la préposition française « dans » rend idiomatiquement le lieu d’où les offrandes sont absentes. « Maison » conserve l’expression hébraïque, tout en laissant « temple » comme explicitation possible en note.
theological_decisions:
- issue: Distinction entre אֱלֹהָי et אֱלֹהֵיכֶם
  choice: Maintenir « mon Dieu » puis « votre Dieu »
  alternative: Uniformiser en « notre Dieu » ou supprimer les possessifs
  rationale: Le passage intentionnel de la première personne du prophète à la deuxième personne adressée aux prêtres appartient à la rhétorique du texte et ne doit pas être harmonisé.
- issue: Nature de la cessation des offrandes
  choice: Employer « font défaut »
  alternative: « sont retranchées », « sont retenues » ou « ne sont plus offertes »
  rationale: L’hébreu indique que les offrandes sont empêchées ou absentes, sans préciser ici l’agent ni résoudre exactement comment leur cessation se produit. « Font défaut » préserve cette réserve.
translation_notes:
  register: Français international moderne, direct et solennel. Les impératifs successifs gardent l’urgence du texte. « Vous qui servez » évite l’ambiguïté contemporaine de « ministres », tandis que « autel », « libation » et « maison de votre Dieu » conservent le cadre cultuel et la dignité poétique.
