id: JOL.1.2
reference: Joel 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְעוּ זֹאת֙ הַ/זְּקֵנִ֔ים וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל יוֹשְׁבֵ֣י הָ/אָ֑רֶץ הֶ/הָ֤יְתָה זֹּאת֙ בִּֽ/ימֵי/כֶ֔ם וְ/אִ֖ם בִּ/ימֵ֥י אֲבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
translation:
  language: fr
  text: Écoutez ceci, vous, les anciens ! Prêtez l’oreille, vous tous qui habitez le pays[a] ! Cela s’est-il produit de votre temps, ou du temps de vos pères[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ». Le mot hébreu peut désigner soit un pays, soit la terre; ici, « le pays » correspond mieux au contexte immédiat.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « du temps de vos ancêtres ». Littéralement : « dans les jours de vos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Écoutez ceci
  rationale: L’impératif pluriel et son objet démonstratif sont rendus directement; « écoutez » est plus naturel en français actuel que le littéral « entendez ».
- source_word: הַזְּקֵנִים
  choice: vous, les anciens
  rationale: « Anciens » conserve la possibilité qu’il s’agisse à la fois d’hommes âgés et de responsables de la communauté; le pronom souligne l’interpellation.
- source_word: וְהַאֲזִינוּ
  choice: Prêtez l’oreille
  rationale: Cette expression préserve le parallélisme avec שִׁמְעוּ tout en rendant la nuance d’attention soutenue du second impératif.
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  choice: vous tous qui habitez le pays
  rationale: La tournure verbale est naturelle en français et garde la portée collective. Dans le contexte immédiat, « pays » convient mieux que « terre », sans supprimer cette autre possibilité.
- source_word: הֶהָיְתָה זֹּאת
  choice: Cela s’est-il produit
  rationale: Le verbe היה signifie ici qu’un événement a eu lieu; « s’est-il produit » rend clairement la question en français.
- source_word: בִּימֵיכֶם
  choice: de votre temps
  rationale: Cette expression française naturelle restitue l’idiome hébreu littéral « dans vos jours ».
- source_word: וְאִם
  choice: ou
  rationale: Dans cette question à deux termes, la conjonction introduit une seconde possibilité plutôt qu’une véritable condition.
- source_word: בִּימֵי אֲבֹתֵיכֶם
  choice: du temps de vos pères
  rationale: La formulation maintient le parallèle temporel et conserve le terme masculin explicite אבות, tout en restant idiomatique en français.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le cadre de l’appel prophétique adressé aux anciens et aux habitants favorise une référence au pays concerné, vraisemblablement Juda. La portée plus large possible du mot hébreu est signalée en note.
- issue: Traduction de אֲבֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le texte hébreu emploie le pluriel masculin « pères ». Le texte principal le conserve, tandis que la note indique le sens générationnel possible de « ancêtres ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les deux impératifs sont distingués afin de préserver le parallélisme rhétorique. La ponctuation exclamative fait ressortir l’interpellation solennelle, et la question finale garde la comparaison entre les générations.
