source:
  edition: WLC
  text: כִּֽי גוֹי֙ עָלָ֣ה עַל אַרְצִ֔/י עָצ֖וּם וְ/אֵ֣ין מִסְפָּ֑ר שִׁנָּי/ו֙ שִׁנֵּ֣י אַרְיֵ֔ה וּֽ/מְתַלְּע֥וֹת לָבִ֖יא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
translation:
  language: fr
  text: Car un peuple[a] a envahi mon pays, puissant et innombrable. Ses dents sont des dents de lion, et il a les crocs d’un lion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nation ». Le mot hébreu désigne un peuple ou une nation; il décrit ici métaphoriquement le fléau envahisseur.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une lionne ». Le terme hébreu peut désigner un lion puissant ou adulte; son emploi précis quant au sexe est incertain ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’appel à la lamentation dans le contexte, en conservant la valeur causale ou explicative.
- source_word: גוֹי
  choice: un peuple
  rationale: Le nom peut signifier « nation » ou « peuple ». « Peuple » reste naturel en français pour cette collectivité métaphorique tout en maintenant l’image d’un envahisseur organisé.
- source_word: עָלָה עַל
  choice: a envahi
  rationale: L’expression décrit une montée hostile contre ou sur le pays. « A envahi » rend clairement cette valeur en français moderne, sans préciser davantage l’identité de l’envahisseur.
- source_word: אַרְצִי
  choice: mon pays
  rationale: Le suffixe de première personne est explicite. Dans le contexte d’une invasion, « mon pays » est plus naturel que « ma terre » tout en conservant le sens territorial.
- source_word: עָצוּם
  choice: puissant
  rationale: Exprime la force redoutable de l’envahisseur avec un terme actuel et digne.
- source_word: וְאֵין מִסְפָּר
  choice: et innombrable
  rationale: Rend idiomatiquement l’idée qu’il est impossible d’en compter les membres.
- source_word: שִׁנָּיו
  choice: ses dents
  rationale: Le suffixe masculin singulier renvoie au collectif גוי; le possessif français conserve cette personnification grammaticale.
- source_word: שִׁנֵּי אַרְיֵה
  choice: des dents de lion
  rationale: Préserve directement la comparaison prédatrice et le parallélisme poétique.
- source_word: מְתַלְּעוֹת
  choice: les crocs
  rationale: Le terme désigne les dents ou mâchoires servant à déchirer. « Crocs » communique nettement l’image prédatrice sans lourdeur anatomique.
- source_word: לָבִיא
  choice: un lion féroce
  rationale: Le mot désigne un lion puissant ou adulte et peut, selon les contextes et les traditions lexicales, être compris comme une lionne. Le choix principal évite de fixer un sexe incertain et exprime la vigueur suggérée par le terme.
- source_word: לוֹ
  choice: il a
  rationale: La préposition avec suffixe marque ici la possession; « il a » est sa formulation française la plus naturelle.
theological_decisions:
- issue: Identification métaphorique du גוי envahisseur
  choice: Maintenir « un peuple » dans le texte principal.
  alternative: Expliciter « une nuée de sauterelles » ou « un peuple de sauterelles ».
  rationale: L’hébreu emploie le mot ordinaire pour « peuple/nation » et présente le fléau sous les traits d’un envahisseur. Préserver cette métaphore évite de réduire dans le verset même la tension entre invasion militaire et invasion de sauterelles.
translation_notes:
  register: Français international moderne, prophétique et imagé. La formulation garde la personnification collective au masculin, ainsi que le parallélisme entre les dents et les crocs, sans expliciter l’envahisseur comme une nuée de sauterelles.
