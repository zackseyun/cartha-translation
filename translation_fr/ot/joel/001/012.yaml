source:
  edition: WLC
  text: הַ/גֶּ֣פֶן הוֹבִ֔ישָׁה וְ/הַ/תְּאֵנָ֖ה אֻמְלָ֑לָה רִמּ֞וֹן גַּם תָּמָ֣ר וְ/תַפּ֗וּחַ כָּל עֲצֵ֤י הַ/שָּׂדֶה֙ יָבֵ֔שׁוּ כִּֽי הֹבִ֥ישׁ שָׂשׂ֖וֹן מִן בְּנֵ֥י אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/012.yaml
  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
translation:
  language: fr
  text: La vigne s’est desséchée, et le figuier s’est flétri ; le grenadier, le palmier et le pommier[a], eux aussi — tous les arbres des champs — se sont desséchés. Oui, la joie s’est desséchée chez les humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « l’abricotier » ; l’espèce exacte désignée par le mot hébreu tappouaḥ est incertaine.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « des fils de l’homme ». Cette expression désigne collectivement les êtres humains.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: la vigne
  rationale: Désigne la vigne cultivée comme culture représentative ; c’est le terme français courant et précis.
- source_word: הוֹבִישָׁה
  choice: s’est desséchée
  rationale: Dans ce contexte agricole, le verbe décrit le dessèchement physique. Cette formulation conserve aussi le lien poétique avec הֹבִישׁ appliqué ensuite à la joie.
- source_word: הַתְּאֵנָה אֻמְלָלָה
  choice: le figuier s’est flétri
  rationale: « Figuier » désigne naturellement la plante, et « s’est flétri » exprime son dépérissement tout en variant légèrement le vocabulaire.
- source_word: רִמּוֹן
  choice: le grenadier
  rationale: Dans une liste d’arbres, le français nomme naturellement l’arbre plutôt que son fruit.
- source_word: תָּמָר
  choice: le palmier
  rationale: Le mot désigne vraisemblablement le palmier-dattier, mais « palmier » reste une traduction concise et traditionnelle.
- source_word: תַפּוּחַ
  choice: le pommier
  rationale: Traduction traditionnelle et immédiatement compréhensible ; l’identification botanique demeure incertaine et fait donc l’objet d’une note.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: tous les arbres des champs
  rationale: Rend l’expression collective et conserve l’image agricole ; le pluriel « des champs » est idiomatique en français.
- source_word: יָבֵשׁוּ
  choice: se sont desséchés
  rationale: Reprend le vocabulaire du premier membre et renforce l’effet cumulatif de la dévastation.
- source_word: כִּי
  choice: Oui
  rationale: Marque ici une affirmation explicative et emphatique sans imposer une relation causale plus précise que ne le permet le contexte.
- source_word: הֹבִישׁ שָׂשׂוֹן
  choice: la joie s’est desséchée
  rationale: Préserve la métaphore agricole saisissante et la répétition lexicale du texte hébreu.
- source_word: מִן בְּנֵי אָדָם
  choice: parmi les humains
  rationale: Exprime naturellement en français la disparition de la joie au sein de l’humanité, tout en signalant en note la forme hébraïque littérale.
theological_decisions:
- issue: Portée de בְּנֵי אָדָם dans une expression humaine générique
  choice: parmi les humains
  alternative: loin des fils de l’homme
  rationale: L’expression hébraïque désigne collectivement les êtres humains, sans limiter le propos aux hommes de sexe masculin. La traduction courante communique cette portée générique, tandis que la note conserve la forme littérale et la nuance possible de séparation.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de « s’est desséchée » est volontaire : elle transpose la même racine verbale employée pour la vigne, les arbres et, métaphoriquement, la joie. La ponctuation met en relief l’élargissement de la liste à tous les arbres.'
