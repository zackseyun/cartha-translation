revisions:
- from: La vigne s’est desséchée, et le figuier s’est flétri ; le grenadier, le palmier et le pommier[a], eux aussi — tous les arbres des champs se sont desséchés. Oui, la joie s’est desséchée parmi les humains[b].
  to: La vigne s’est desséchée, et le figuier s’est flétri ; le grenadier, le palmier et le pommier[a], eux aussi — tous les arbres des champs — se sont desséchés. Oui, la joie s’est desséchée chez les humains[b].
  rationale: La révision conserve la répétition volontaire de « s’est desséchée », qui reproduit le lien verbal du texte hébreu entre la végétation et la joie. « Chez les humains » rend plus justement la fonction contextuelle de מן, tandis que la note explicite la formulation hébraïque sans lui attribuer une portée masculine restrictive. La ponctuation de la liste est ajustée pour une lecture française plus fluide et une portée collective plus claire.
