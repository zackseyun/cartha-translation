id: JOL.1.19
reference: Joel 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
translation:
  language: fr
  text: C’est vers toi, Yahvé[a], que je crie, car le feu a dévoré les pâturages du désert[b], et la flamme a embrasé tous les arbres des champs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH; traditionnellement rendu par « le Seigneur » ou « l’Éternel ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les lieux de pâture de la steppe ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « a consumé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ … אֶקְרָא
  choice: C’est vers toi … que je crie
  rationale: La préposition אֶל marque l’orientation de l’appel, et קרא, dans cette lamentation adressée à Dieu, a la force de « crier » ou « appeler au secours ». La tournure clivée est naturelle en français et souligne « vers toi » comme en hébreu.
- source_word: אֵשׁ אָכְלָה
  choice: le feu a dévoré
  rationale: Le verbe אכל, littéralement « manger », décrit avec force l’action destructrice du feu. « A dévoré » conserve cette image poétique.
- source_word: נְאוֹת מִדְבָּר
  choice: les pâturages du désert
  rationale: נְאוֹת désigne ici des lieux où paissent les troupeaux, tandis que מִדְבָּר évoque une région non cultivée, désertique ou de steppe. Cette formulation reste concise et conforme au contexte agricole.
- source_word: לִהֲטָה
  choice: a embrasé
  rationale: Le verbe להט exprime l’ardeur brûlante de la flamme. « A embrasé » rend naturellement l’image tout en maintenant le parallélisme avec « a dévoré ».
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: tous les arbres des champs
  rationale: כָּל avec le pluriel se rend naturellement par « tous les arbres ». Le singulier collectif hébreu הַשָּׂדֶה désigne ici les terres ouvertes ou cultivées; le pluriel français « des champs » est idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme, nom propre du Dieu d’Israël. « Yahvé » en donne la forme française usuelle sans le remplacer silencieusement par un titre; une note signale la tradition de traduction.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le rythme en deux propositions parallèles et l’image vive du feu sont conservés; les termes agricoles restent concrets.
