id: JOL.1.5
reference: Joel 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָקִ֤יצוּ שִׁכּוֹרִים֙ וּ/בְכ֔וּ וְ/הֵילִ֖לוּ כָּל שֹׁ֣תֵי יָ֑יִן עַל עָסִ֕יס כִּ֥י נִכְרַ֖ת מִ/פִּי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
translation:
  language: fr
  text: Réveillez-vous, ivrognes, et pleurez ! Lamentez-vous, vous tous qui buvez du vin, à cause du vin doux[a], car il vous est retiré de la bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vin nouveau », « vin frais » ou « moût » pour le terme hébreu עָסִיס.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  choice: Réveillez-vous
  rationale: L’impératif pluriel exprime le réveil hors du sommeil ou de la torpeur; cette formulation naturelle conserve la vigueur de l’appel prophétique.
- source_word: שִׁכּוֹרִים
  choice: ivrognes
  rationale: Le pluriel employé comme vocatif caractérise directement les personnes adonnées à l’ivresse.
- source_word: וּבְכוּ
  choice: et pleurez
  rationale: Le verbe courant du pleur et du deuil convient au contexte de lamentation.
- source_word: וְהֵילִלוּ
  choice: Lamentez-vous
  rationale: Le verbe désigne un cri intense de lamentation; « lamentez-vous » est digne et intelligible, tout en le distinguant de « pleurez ».
- source_word: כָּל שֹׁתֵי יָיִן
  choice: vous tous qui buvez du vin
  rationale: Le participe décrit les personnes caractérisées par le fait de boire du vin; le vocatif est conservé explicitement.
- source_word: עַל
  choice: à cause du
  rationale: La préposition introduit ici le motif ou l’objet de la lamentation.
- source_word: עָסִיס
  choice: vin doux
  rationale: Le terme désigne le jus de raisin fraîchement pressé ou un vin frais et doux; « vin doux » communique clairement l’idée sans recourir au terme technique « moût ».
- source_word: נִכְרַת
  choice: il vous est retiré
  rationale: Le niphal de כרת signifie être retranché ou supprimé; cette tournure exprime naturellement la privation résultante tout en gardant l’image de quelque chose ôté.
- source_word: מִפִּיכֶם
  choice: de la bouche
  rationale: La traduction littérale conserve l’image concrète et frappante de la boisson désormais inaccessible.
