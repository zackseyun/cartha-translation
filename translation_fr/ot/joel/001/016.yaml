  text: הֲ/ל֛וֹא נֶ֥גֶד עֵינֵ֖י/נוּ אֹ֣כֶל נִכְרָ֑ת מִ/בֵּ֥ית אֱלֹהֵ֖י/נוּ שִׂמְחָ֥ה וָ/גִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
translation:
  language: fr
  text: La nourriture n’a-t-elle pas été retranchée sous nos yeux, et la joie et l’allégresse n’ont-elles pas été retranchées de la maison de notre Dieu[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple de notre Dieu ». L’hébreu dit littéralement « de la maison de notre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: n’est-elle pas
  rationale: Introduit une question rhétorique qui appelle l’assentiment, tout en conservant explicitement sa forme interrogative.
- source_word: נֶגֶד עֵינֵינוּ
  choice: sous nos yeux
  rationale: Expression française naturelle qui rend l’idée d’un événement visible, se déroulant ouvertement devant les témoins.
- source_word: אֹכֶל
  choice: la nourriture
  rationale: Terme général correspondant au sens large du mot hébreu dans le contexte de la dévastation agricole.
- source_word: נִכְרָת
  choice: retranchée
  rationale: Conserve l’image concrète de כרת et sa force, sans réduire le sens à une simple pénurie ou disparition.
- source_word: מִבֵּית אֱלֹהֵינוּ
  choice: de la maison de notre Dieu
  rationale: Reproduit l’expression hébraïque; le contexte désigne le temple, possibilité indiquée en note.
- source_word: שִׂמְחָה
  choice: la joie
  rationale: Équivalent courant et direct qui convient au premier terme du doublet poétique.
- source_word: וָגִיל
  choice: et l’allégresse
  rationale: Rend la nuance de joie vive ou exultante et maintient la distinction entre les deux quasi-synonymes.
theological_decisions:
- issue: Portée syntaxique de la question rhétorique sur les deux pertes coordonnées
  choice: La question porte à la fois sur la nourriture retranchée et, par ellipse du verbe, sur la joie et l’allégresse ôtées de la maison de Dieu.
  alternative: La seconde expression pourrait être comprise comme une apposition décrivant la conséquence de la perte de nourriture.
  rationale: La poésie hébraïque omet fréquemment dans le second membre un verbe déjà exprimé. La coordination française conserve cette ellipse et la tension entre la perte de subsistance et la cessation de la célébration cultuelle.
translation_notes:
  register: Français moderne, digne et accessible. « Retranchée » préserve l’image hébraïque tout en restant intelligible; « allégresse » restitue le registre poétique du second terme. Le marqueur de note est placé immédiatement après l’expression concernée.
