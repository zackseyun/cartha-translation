id: JOL.1.15
reference: Joel 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲהָ֖הּ לַ/יּ֑וֹם כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה וּ/כְ/שֹׁ֖ד מִ/שַׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/015.yaml
  text: Alas for the day! For the day of Yahweh is near[a], and it comes like destruction from the Almighty.
translation:
  language: fr
  text: Hélas, quel jour ! Car le jour de Yahweh est proche ; il vient comme une dévastation de la part du Tout-Puissant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu fait un jeu de sonorités entre « dévastation » (shod) et « Shaddaï » (le Tout-Puissant).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ לַיּוֹם
  choice: Hélas, quel jour !
  rationale: L’interjection exprime la lamentation et l’effroi. Cette tournure française naturelle rend l’exclamation idiomatique liée au jour sans transformer celle-ci en oracle explicite de malheur.
- source_word: כִּי קָרוֹב
  choice: Car … est proche
  rationale: כִּי introduit la raison de la lamentation, tandis que קָרוֹב affirme l’imminence.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: La formulation conserve l’expression prophétique et rend directement le nom divin יהוה par « Yahweh ».
- source_word: וּכְשֹׁד
  choice: il vient comme une dévastation
  rationale: שֹׁד désigne une ruine violente ou une dévastation. Le pronom « il » reprend naturellement « le jour », sujet implicite du verbe en hébreu, et כְ est conservé par « comme ».
- source_word: מִשַׁדַּי
  choice: de la part du Tout-Puissant
  rationale: La préposition מִן marque ici la provenance. « De la part de » évite que le français ne fasse du Tout-Puissant le lieu d’où vient la dévastation, tandis que « le Tout-Puissant » communique le sens traditionnel de שַׁדַּי.
- source_word: יָבוֹא
  choice: il vient
  rationale: Le présent prophétique exprime de manière vive et certaine la venue imminente annoncée par l’imparfait hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre plutôt que de lui substituer un titre.
- issue: Rapport entre שֹׁד et שַׁדַּי
  choice: dévastation … Tout-Puissant, avec note sur le jeu sonore
  alternative: dévastation … Shaddaï
  rationale: Le sens lexical reste clair dans le texte principal, tandis que la note préserve le jeu de mots ou de sonorités perceptible en hébreu sans fabriquer un calembour français.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation garde la force de la lamentation, et la formulation préserve la comparaison ainsi que l’imminence prophétique.
