source:
  edition: WLC
  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
translation:
  language: fr
  text: Comme les bêtes gémissent ! Les troupeaux de bovins sont désemparés[a], car ils n’ont pas de pâturage ; même les troupeaux de petit bétail souffrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont désorientés » ou « sont dans la confusion ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire par « sont tenus pour coupables » ou « portent leur culpabilité » ; le verbe peut avoir une portée judiciaire. Ici, il indique probablement que le petit bétail souffre des conséquences de la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Comme
  rationale: Employé ici comme particule exclamative de lamentation, et non comme pronom interrogatif.
- source_word: נֶּאֶנְחָה
  choice: gémissent
  rationale: Le verbe exprime de manière audible la détresse ; « gémir » convient naturellement aux bêtes dans ce contexte.
- source_word: בְהֵמָה
  choice: les bêtes
  rationale: Le singulier collectif désigne ici les animaux domestiques en général ; « bêtes » évite de le limiter aux bovins, mentionnés ensuite.
- source_word: נָבֹכוּ
  choice: sont désemparés
  rationale: Le verbe évoque la confusion et la désorientation. Cette formulation préserve ce sens sans ajouter explicitement l’idée de déplacement.
- source_word: עֶדְרֵי בָקָר
  choice: les troupeaux de bovins
  rationale: Rend précisément la construction hébraïque et distingue ces troupeaux du petit bétail de la dernière proposition.
- source_word: כִּי אֵין מִרְעֶה לָהֶם
  choice: car ils n’ont plus de pâturage
  rationale: « Car » conserve le rapport causal ; « n’ont plus » exprime naturellement, dans le contexte de dévastation, l’absence de pâturage disponible.
- source_word: גַּם
  choice: même
  rationale: Marque l’extension et l’intensification de la lamentation.
- source_word: עֶדְרֵי הַצֹּאן
  choice: les troupeaux de petit bétail
  rationale: צֹאן peut désigner collectivement les ovins et les caprins ; « petit bétail » conserve cette portée plus justement que « moutons » seul.
- source_word: נֶאְשָׁמוּ
  choice: en subissent les conséquences
  rationale: Le verbe issu de אשם peut évoquer la culpabilité ou le fait d’en supporter la peine. Dans ce contexte animal et écologique, la formulation indique que les troupeaux pâtissent du désastre sans leur attribuer explicitement une faute morale.
theological_decisions:
- issue: La portée judiciaire de נֶאְשָׁמוּ appliqué au petit bétail
  choice: « en subissent les conséquences », avec une note signalant la portée possible de culpabilité ou de peine
  alternative: « sont tenus pour coupables », « portent leur culpabilité » ou « sont dévastés »
  rationale: Le texte emploie un verbe susceptible de connotations judiciaires, mais l’applique à des animaux touchés par la dévastation. Le corps du texte évite de leur attribuer une culpabilité morale, tandis que la note préserve l’ambiguïté et la tension du terme hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique et l’exclamation initiale sont conservés. « Bovins » et « petit bétail » rendent les catégories animales avec précision sans archaïsme.
