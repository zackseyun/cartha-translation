revisions:
- from: Comme les bêtes gémissent ! Les troupeaux de bovins sont désemparés[a], car ils n’ont plus de pâturage ; même les troupeaux de petit bétail en subissent les conséquences[b].
  to: Comme les bêtes gémissent ! Les troupeaux de bovins sont désemparés[a], car ils n’ont pas de pâturage ; même les troupeaux de petit bétail souffrent[b].
  rationale: La révision retire l’ajout temporel « plus » et remplace une paraphrase interprétative par « souffrent », rendu sobre, naturel et fidèle au contexte. La note maintient les possibilités lexicales et la résonance judiciaire du terme hébreu sans trancher indûment son ambiguïté.
