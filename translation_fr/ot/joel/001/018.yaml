    rationale: L’hébreu dit simplement qu’il n’y a pas de pâturage pour eux. Le contexte suggère une perte causée par la dévastation, mais la particule temporelle « plus » n’est pas exprimée.
  - severity: low
    issue: Paraphrase interprétative dans « en subissent les conséquences »
    rationale: Le verbe נֶאְשָׁמוּ est concis et sémantiquement discuté. « Souffrent » rend directement l’effet de détresse sans créer un objet implicite ni résoudre la nuance judiciaire, laquelle est convenablement signalée en note.
