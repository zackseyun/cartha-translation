base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
translation:
  language: fr
  text: 'Il a dévasté ma vigne

    et réduit mon figuier en débris[a] ;

    il l’a entièrement dépouillé et jeté à terre ;

    ses rameaux ont blanchi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom hébreu est rare. On peut aussi comprendre : « en morceaux », « en échardes » ou « à l’état de souche ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « ses pousses » ou « ses sarments ont blanchi » ; il s’agit vraisemblablement du bois clair mis à nu après l’arrachement de l’écorce.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם גַּפְנִי לְשַׁמָּה
  choice: Il a dévasté ma vigne
  rationale: Littéralement, « il a fait de ma vigne une désolation ». Le verbe français « dévaster » rend naturellement la tournure résultative tout en conservant l’idée de ruine.
- source_word: גַּפְנִי
  choice: ma vigne
  rationale: גֶּפֶן désigne la vigne, non le vignoble. Le suffixe de première personne est conservé.
- source_word: וּתְאֵנָתִי
  choice: et réduit mon figuier
  rationale: תְּאֵנָה désigne ici le figuier. « Réduire en » exprime naturellement la construction parallèle avec לִקְצָפָה.
- source_word: לִקְצָפָה
  choice: en débris
  rationale: Ce nom rare évoque ce qui est brisé, arraché ou réduit à des restes. « Débris » convient au contexte de destruction sans imposer l’image plus précise et incertaine d’une souche ou d’échardes.
- source_word: חָשֹׂף חֲשָׂפָהּ
  choice: il l’a entièrement dépouillé
  rationale: L’infinitif absolu suivi du parfait de la même racine renforce l’action. « Entièrement » rend cette intensification ; « dépouillé » laisse au contexte l’idée de l’écorce arrachée.
- source_word: וְהִשְׁלִיךְ
  choice: et jeté à terre
  rationale: Le hiphil de שׁלך signifie jeter ou rejeter. « Jeté à terre » conserve la violence concrète de la scène sans préciser un objet que l’hébreu ne nomme pas explicitement.
- source_word: הִלְבִּינוּ שָׂרִיגֶיהָ
  choice: ses rameaux ont blanchi
  rationale: Le pluriel verbal s’accorde avec שָׂרִיגֶיהָ. « Rameaux » peut désigner les branches ou pousses, et leur blanchiment évoque naturellement le bois mis à nu.
