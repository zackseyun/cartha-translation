  text: עָבְשׁ֣וּ פְרֻד֗וֹת תַּ֚חַת מֶגְרְפֹ֣תֵי/הֶ֔ם נָשַׁ֨מּוּ֙ אֹֽצָר֔וֹת נֶהֶרְס֖וּ מַמְּגֻר֑וֹת כִּ֥י הֹבִ֖ישׁ דָּגָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
translation:
  language: fr
  text: Les semences se sont desséchées sous leurs mottes de terre[a] ; les entrepôts sont désolés, les greniers sont détruits, car les céréales ont séché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les mots hébreux traduits par « semences » et « mottes de terre » sont rares et leur sens est incertain. On peut aussi comprendre : « les grains sous leurs sillons » ; le second terme peut même désigner des houes ou des pelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ
  choice: se sont desséchées
  rationale: Le verbe décrit le dessèchement ou le flétrissement; cette formulation convient à des semences enfouies.
- source_word: פְרֻדוֹת
  choice: semences
  rationale: Ce nom rare et incertain désigne vraisemblablement, dans ce contexte, des graines ou des grains destinés à germer.
- source_word: תַּחַת
  choice: sous
  rationale: Équivalent spatial simple et naturel en français.
- source_word: מֶגְרְפֹתֵיהֶם
  choice: leurs mottes de terre
  rationale: Le terme est incertain. Le contexte et la préposition « sous » favorisent l'idée de terre recouvrant les semences plutôt que celle d'un outil agricole.
- source_word: נָשַׁמּוּ
  choice: sont dévastées
  rationale: Appliqué aux lieux de stockage, le verbe exprime leur état de désolation et d'abandon.
- source_word: אֹצָרוֹת
  choice: réserves
  rationale: Dans ce contexte agricole, le mot désigne des lieux ou dépôts où l'on conserve les récoltes.
- source_word: נֶהֶרְסוּ
  choice: sont démolis
  rationale: Le verbe signifie que les structures ont été abattues ou détruites.
- source_word: מַמְּגֻרוֹת
  choice: greniers
  rationale: Le terme désigne des bâtiments ou locaux destinés à entreposer le grain.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la cause de la désolation des lieux de stockage.
- source_word: הֹבִישׁ
  choice: a séché
  rationale: Dans ce cadre agricole, le verbe évoque l'échec de la récolte par dessèchement, tout en pouvant comporter une nuance de dépérissement.
- source_word: דָּגָן
  choice: blé
  rationale: « Blé » est naturel en français biblique courant pour désigner ici la céréale récoltée, bien que l'hébreu soit générique et puisse viser le grain ou les céréales.
