id: JOL.1.8
reference: Joel 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱלִ֕י כִּ/בְתוּלָ֥ה חֲגֻֽרַת שַׂ֖ק עַל בַּ֥עַל נְעוּרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/008.yaml
  text: Wail like a virgin clothed in sackcloth for the husband of her youth[a][b].
translation:
  language: fr
  text: Lamente-toi comme une vierge vêtue d’une toile de sac[a] pour l’époux de sa jeunesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceinte d’une toile de sac ».'
    reason: lexical_alternative
  - marker: b
    text: « Époux » peut aussi désigner ici l’homme auquel elle était promise, l’image poétique étant culturellement condensée.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִי
  choice: Lamente-toi
  rationale: Impératif féminin singulier exprimant une lamentation audible. « Lamente-toi » convient au registre prophétique et reste naturel en français.
- source_word: כִּבְתוּלָה
  choice: comme une vierge
  rationale: Le préfixe כ marque la comparaison, et בְּתוּלָה désigne normalement une vierge. L’image hébraïque est conservée sans l’atténuer en « jeune femme ».
- source_word: חֲגֻרַת שַׂק
  choice: vêtue d’une toile de sac
  rationale: L’expression signifie littéralement « ceinte d’une toile de sac » et décrit l’état de la femme en deuil. La formulation retenue est claire et idiomatique.
- source_word: שַׂק
  choice: toile de sac
  rationale: Équivalent français courant du tissu grossier porté en signe de deuil ou d’humiliation.
- source_word: עַל
  choice: pour
  rationale: Dans un contexte de deuil, la préposition introduit la personne dont on pleure la perte.
- source_word: בַּעַל
  choice: époux
  rationale: Dans ce contexte relationnel, le mot désigne le conjoint. « Époux » s’accorde au registre poétique et préserve mieux que « mari » la possibilité contextuelle d’un homme auquel la jeune femme était promise.
- source_word: נְעוּרֶיהָ
  choice: de sa jeunesse
  rationale: Le complément détermine « époux » et reproduit l’expression hébraïque sans la paraphraser.
theological_decisions:
- issue: Tension entre « vierge » et « époux de sa jeunesse »
  choice: Conserver l’image hébraïque comprimée sans préciser le statut exact de la relation.
  alternative: Traduire par « fiancé » ou paraphraser « une jeune mariée pleurant son époux ».
  rationale: Le texte associe délibérément une vierge et son בַּעַל. Il peut s’agir d’une jeune femme promise en mariage, mais le verset ne l’explicite pas. La traduction maintient donc cette tension poétique et culturelle.
translation_notes:
  register: Français international moderne, digne et poétique. L’impératif féminin et l’image traditionnelle du vêtement de deuil sont conservés. « Toile de sac » est plus immédiatement compréhensible que le substantif rare « sac » au sens de vêtement de deuil.
