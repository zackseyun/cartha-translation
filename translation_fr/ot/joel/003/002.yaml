source:
  edition: WLC
  text: וְ/גַ֥ם עַל הָֽ/עֲבָדִ֖ים וְ/עַל הַ/שְּׁפָח֑וֹת בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֶשְׁפּ֖וֹךְ אֶת רוּחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/002.yaml
  text: And even on the male servants and on the female servants[a], in those days I will pour out my Spirit.
translation:
  language: fr
  text: Et même sur les hommes esclaves et sur les femmes esclaves[a], en ces jours-là, je répandrai mon Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs et les servantes ». Les termes hébreux désignent ici des hommes et des femmes de condition servile ; « esclaves » en préserve explicitement la réalité sociale.
    reason: Alternative lexicale pour des termes dont le champ sémantique couvre le service et l’esclavage.
lexical_decisions:
- source_word: וְגַם
  choice: Même
  rationale: 'Dans la continuité du verset précédent, « Même » exprime naturellement la valeur additive et emphatique de la locution : l’effusion s’étendra jusque sur des personnes de condition servile.'
- source_word: עַל הָעֲבָדִים
  choice: sur les esclaves
  rationale: La préposition conserve l’image de l’effusion. עֶבֶד peut désigner un serviteur ou un esclave ; dans ce couple de termes marquant le statut social et le sexe, « esclaves » rend clairement la condition servile. Le masculin pluriel hébreu est laissé non marqué en français, puisque le terme féminin parallèle explicite ensuite la distinction.
- source_word: וְעַל הַשְּׁפָחוֹת
  choice: et sur les femmes esclaves
  rationale: שִׁפְחָה désigne spécifiquement une femme en condition servile. « Femmes esclaves » préserve à la fois le sexe et la réalité sociale, tout en évitant le terme vieilli « servantes » dans son sens domestique atténué.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: en ces jours-là
  rationale: Formule temporelle prophétique idiomatique en français, qui conserve la référence démonstrative du texte hébreu.
- source_word: אֶשְׁפֹּךְ
  choice: je répandrai
  rationale: « Répandre » est l’équivalent français naturel de שפך dans la métaphore d’un liquide versé abondamment et convient à l’effusion de l’Esprit.
- source_word: אֶת רוּחִי
  choice: mon Esprit
  rationale: Dans ce contexte, le locuteur divin promet de répandre son propre Esprit sur des personnes. La majuscule indique ce référent divin en français sans développer davantage sa nature.
theological_decisions:
- issue: Rendu des désignations sociales עֲבָדִים et שְׁפָחוֹת
  choice: les esclaves / les femmes esclaves
  alternative: les serviteurs / les servantes
  rationale: Le contexte souligne l’inclusion de personnes de condition servile. Le choix explicite « esclaves » préserve cette réalité sociale et la distinction sexuelle du couple hébreu, sans l’adoucir en simple service volontaire.
- issue: Référent de רוּחִי
  choice: mon Esprit
  alternative: mon esprit
  rationale: Le contexte présente Dieu répandant ce qui lui appartient sur des êtres humains ; il favorise donc le référent divin traditionnellement écrit avec une majuscule. La traduction ne précise pas davantage la personne ou le mode d’action de l’Esprit.
translation_notes:
  register: Français international moderne, sobre et prophétique. La répétition de « sur » reproduit le parallélisme hébreu. « Femmes esclaves » est retenu plutôt que « esclaves femmes », peu naturel, ou « servantes », qui peut masquer la condition servile.
