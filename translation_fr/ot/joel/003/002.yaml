review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement l’effusion future de l’Esprit, la répétition de « sur », le cadre temporel et la portée servile des deux termes. Toutefois, « les esclaves » est générique en français et ne maintient pas nettement l’opposition sexuée présente entre הָעֲבָדִים (masculin) et הַשְּׁפָחוֹת (féminin). La conjonction initiale וְ (« Et ») mérite aussi d’être conservée.
  naturalness: « Hommes esclaves » / « femmes esclaves » est clair, moderne et symétrique dans ce parallélisme, bien que la formulation soit volontairement marquée par le vocabulaire social du texte. « Et même » s’enchaîne naturellement au contexte précédent.
  terminology: « Esclaves » rend de façon appropriée la condition servile saillante dans ce couple lexical; « Esprit » avec majuscule est contextuellement justifié. La note propose avec justesse l’alternative plus large « serviteurs et servantes », sans la privilégier.
  issues:
  - severity: medium
    issue: La distinction masculin/féminin du couple hébreu n’est pas explicitement conservée dans « les esclaves et sur les femmes esclaves ».
    rationale: En français, « les esclaves » est normalement un pluriel générique pouvant inclure des femmes; l’ajout ultérieur de « femmes esclaves » devient donc moins contrastif. « Hommes esclaves » / « femmes esclaves » préserve explicitement le parallélisme et l’inclusion des deux groupes.
  - severity: low
    issue: La conjonction initiale וְגַם n’est rendue que partiellement par « Même ».
    rationale: « Même » rend l’emphase, mais « Et même » restitue également la liaison additive avec la promesse précédente, sans alourdir le français.
  revised_text: Et même sur les hommes esclaves et sur les femmes esclaves[a], en ces jours-là, je répandrai mon Esprit.
