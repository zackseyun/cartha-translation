revisions:
- from: Et il arrivera que quiconque invoquera le nom de Yahweh sera délivré[a]. Car, sur le mont Sion et à Jérusalem, il y aura délivrance[b], comme Yahweh l’a dit, parmi les survivants que Yahweh appelle[c].
  to: Et il arrivera que quiconque invoquera le nom de Yahweh sera délivré[a]. Car il y aura des rescapés sur le mont Sion et à Jérusalem, comme Yahweh l’a dit, ainsi que parmi les survivants que Yahweh appelle[b][c].
  rationale: Le texte principal adopte le sens concret « des rescapés », bien attesté pour פְּלֵיטָה dans ce contexte et naturellement relié à « les survivants ». L’ajout de « ainsi que » restitue la coordination du dernier membre hébreu et élimine une ambiguïté française, sans résoudre le rapport théologique entre l’invocation humaine et l’appel de Yahweh.
