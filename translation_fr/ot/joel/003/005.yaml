source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
translation:
  language: fr
  text: Et il arrivera que quiconque invoquera le nom de Yahweh sera délivré[a]. Car il y aura des rescapés sur le mont Sion et à Jérusalem, comme Yahweh l’a dit, ainsi que parmi les survivants que Yahweh appelle[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « échappera » ou « sera sauvé ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner l’échappée, la délivrance ou des rescapés ayant échappé au danger.
    reason: lexical_alternative
  - marker: c
    text: Le verset maintient ensemble l’invocation de Yahweh par les humains et l’appel des survivants par Yahweh.
    reason: theological_tension
lexical_decisions:
- source_word: וְהָיָה
  choice: Et il arrivera
  rationale: Cette tournure française actuelle conserve la fonction d’introduction d’un événement futur sans employer l’archaïque « il adviendra ».
- source_word: כֹּל אֲשֶׁר
  choice: quiconque
  rationale: Le pronom rend naturellement la portée distributive et universelle de la construction hébraïque.
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  choice: invoquera le nom de Yahweh
  rationale: « Invoquer le nom » exprime clairement l’appel religieux adressé à Dieu et conserve l’expression hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: יִמָּלֵט
  choice: sera délivré
  rationale: Le passif français couvre l’idée d’être soustrait au jugement ou au danger sans réduire le sens à une fuite physique ni imposer tout le poids doctrinal de « sera sauvé ».
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: sur le mont Sion et à Jérusalem
  rationale: Les prépositions correspondent à l’usage français naturel pour une montagne et une ville.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: il y aura délivrance
  rationale: Cette formulation reproduit la construction existentielle et le nom singulier, tout en laissant la note signaler ses sens concrets possibles de fuite ou de rescapés.
- source_word: כַּאֲשֶׁר אָמַר יְהוָה
  choice: comme Yahweh l’a dit
  rationale: Le passé composé exprime une parole divine déjà prononcée dont la validité demeure.
- source_word: וּבַשְּׂרִידִים
  choice: parmi les survivants
  rationale: « Survivants » est immédiatement compréhensible et rend ceux qui restent après le jugement, sans imposer le terme théologiquement chargé de « reste ».
- source_word: אֲשֶׁר יְהוָה קֹרֵא
  choice: que Yahweh appelle
  rationale: Le présent rend la valeur caractéristique ou continue du participe et maintient le parallèle entre l’invocation humaine et l’appel divin.
theological_decisions:
- issue: Rapport entre l’invocation humaine et l’appel divin
  choice: Le texte conserve à la fois « quiconque invoquera » et « les survivants que Yahweh appelle ».
  alternative: Interpréter explicitement le dernier membre soit comme une restriction du premier, soit comme une simple apposition non restrictive.
  rationale: L’hébreu juxtapose ces deux réalités sans expliquer leur articulation; la traduction ne résout donc pas cette tension théologique.
- issue: Portée de פְלֵיטָה
  choice: Employer « délivrance » dans le texte et exposer en note les sens possibles.
  alternative: « des rescapés », « une fuite » ou « la possibilité d’échapper »
  rationale: Le nom peut désigner l’action ou l’issue de l’évasion, la délivrance, voire ceux qui ont échappé. Le choix retenu garde une certaine largeur sémantique sans introduire un vocabulaire sotériologique plus systématique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque; « Yahweh » conserve le nom divin, et les notes rendent visibles les ambiguïtés lexicales sans alourdir le texte principal.
