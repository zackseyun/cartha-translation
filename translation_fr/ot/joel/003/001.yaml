source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
translation:
  language: fr
  text: Après cela, je répandrai mon Esprit sur toute chair[a]. Vos fils et vos filles prophétiseront, vos vieillards feront des rêves, et vos jeunes gens auront des visions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur toute chair ». L’expression peut aussi se traduire par « sur tous les êtres humains » ou « sur tous » ; elle ne précise pas à elle seule si l’ensemble de l’humanité est visé ou toutes les catégories de personnes dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אַחֲרֵי כֵן
  choice: Après cela
  rationale: La formule annonce un événement futur postérieur. En français, le futur du verbe principal suffit à porter cette valeur, sans calquer lourdement « et il arrivera ».
- source_word: אֶשְׁפּוֹךְ
  choice: je répandrai
  rationale: « Répandre » conserve la métaphore concrète de שפך et s’emploie naturellement en français avec l’Esprit.
- source_word: רוּחִי
  choice: mon Esprit
  rationale: Le contexte d’inspiration prophétique désigne très probablement l’Esprit de Dieu. La majuscule suit l’usage français tout en reconnaissant que l’hébreu ne distingue pas les capitales.
- source_word: עַל כָּל בָּשָׂר
  choice: sur tout être humain
  rationale: Littéralement « sur toute chair ». Ici, l’expression hébraïque désigne largement les humains; cette formulation actuelle transmet ce sens sans suggérer de la matière corporelle impersonnelle.
- source_word: וְנִבְּאוּ
  choice: prophétiseront
  rationale: Le niphal de נבא exprime ici la parole prophétique suscitée par l’Esprit.
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  choice: vos fils et vos filles
  rationale: La traduction conserve la mention explicite des descendants masculins et féminins.
- source_word: זִקְנֵיכֶם
  choice: vos vieillards
  rationale: Le contraste avec les jeunes gens indique l’âge plutôt qu’une fonction officielle d’ancien.
- source_word: חֲלֹמוֹת יַחֲלֹמוּן
  choice: feront des rêves
  rationale: Cette tournure française naturelle rend le complément de même racine hébreu sans l’étrangeté de « rêveront des rêves ».
- source_word: בַּחוּרֵיכֶם
  choice: vos jeunes gens
  rationale: Le terme désigne ici de jeunes hommes, mis en parallèle avec les vieillards.
- source_word: חֶזְיֹנוֹת יִרְאוּ
  choice: auront des visions
  rationale: La locution française usuelle rend fidèlement l’expérience visionnaire exprimée littéralement par « verront des visions ».
theological_decisions:
- issue: Sens de רוּחִי dans le contexte de l’effusion prophétique
  choice: mon Esprit
  alternative: mon esprit
  rationale: Les prophéties, rêves et visions qui en résultent favorisent la référence à l’Esprit divin, sans que la graphie hébraïque elle-même impose une majuscule.
- issue: Portée de כָּל בָּשָׂר
  choice: tout être humain
  alternative: toute chair
  rationale: Le choix exprime la portée humaine générale de l’idiome sans préciser davantage si le contexte vise l’humanité entière ou toutes les catégories de personnes au sein du peuple concerné; la note conserve la forme littérale et cette possible tension.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination initiale a été allégée pour éviter un calque hébraïque; le parallélisme entre fils et filles, vieillards et jeunes gens demeure explicite.
