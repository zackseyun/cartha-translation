source:
  edition: WLC
  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
translation:
  language: fr
  text: Le soleil se changera en ténèbres, et la lune en sang[a], avant que vienne le jour de Yahweh[b], jour grand et redoutable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en sang ». On peut aussi comprendre : « rouge comme le sang ».'
    reason: Précise l’expression hébraïque tout en préservant dans le texte principal son image prophétique non résolue.
  - marker: b
    text: « Yahweh » rend le nom divin YHWH, traditionnellement traduit par « le SEIGNEUR ».
    reason: Signale le choix de rendre le tétragramme comme nom personnel et donne l’usage traditionnel.
  - marker: c
    text: 'Ou : « terrible », c’est-à-dire inspirant l’effroi et la crainte.'
    reason: Indique l’étendue sémantique de נוֹרָא sans réduire sa force à une seule nuance.
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: le soleil
  rationale: Nom défini désignant l’astre; équivalent français direct et naturel.
- source_word: יֵהָפֵךְ
  choice: se changera
  rationale: Le niphal imperfectif de הפך exprime ici un changement d’état. La tournure pronominale française rend naturellement cette valeur sans effacer l’image de transformation.
- source_word: לְחֹשֶׁךְ
  choice: en ténèbres
  rationale: La préposition לְ introduit l’état résultant. « En ténèbres » conserve la force poétique et cosmique du texte.
- source_word: וְהַיָּרֵחַ לְדָם
  choice: et la lune en sang
  rationale: La seconde proposition, elliptique en hébreu, reprend le verbe de la première. « En sang » préserve l’image abrupte du texte au lieu de l’interpréter dans le corps du verset comme une simple couleur rouge sang.
- source_word: לִפְנֵי בּוֹא
  choice: avant que vienne
  rationale: לִפְנֵי a ici un sens temporel et בּוֹא désigne la venue. Cette proposition verbale est plus idiomatique en français que « avant la venue de » tout en restant proche de la syntaxe source.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: L’expression prophétique est conservée, et le tétragramme est rendu par le nom personnel « Yahweh » plutôt que remplacé par un titre.
- source_word: הַגָּדוֹל
  choice: grand
  rationale: Adjectif courant qui exprime l’importance et l’ampleur de ce jour sans précision interprétative ajoutée.
- source_word: וְהַנּוֹרָא
  choice: et redoutable
  rationale: Le terme dérivé de ירא décrit ce qui inspire crainte et effroi. « Redoutable » garde cette gravité en français moderne sans suggérer nécessairement une déficience morale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le tétragramme. « Yahweh » le rend comme nom personnel et évite de lui substituer silencieusement un titre; la tradition « le SEIGNEUR » est signalée en note.
- issue: Nature de l’image cosmique
  choice: Conserver « la lune en sang »
  alternative: la lune rouge comme le sang
  rationale: Le texte dit littéralement « en sang ». La formulation principale maintient l’ambiguïté entre transformation, apparence et langage prophétique, tandis que la note indique l’interprétation chromatique possible.
- issue: Portée de הַנּוֹרָא
  choice: redoutable
  alternative: terrible; impressionnant
  rationale: Le mot peut associer effroi et crainte révérencielle. « Redoutable » préserve cette tension mieux que « impressionnant », souvent affaibli en français contemporain, ou « terrible », qui peut être compris comme un jugement moral.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme prophétique est conservé par deux propositions parallèles et par la reprise explicite de « jour » devant les adjectifs, ce qui évite une construction française lourde tout en gardant leur portée sur le jour de Yahweh.
