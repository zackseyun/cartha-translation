  text: וְ/נָֽתַתִּי֙ מֽוֹפְתִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ דָּ֣ם וָ/אֵ֔שׁ וְ/תִֽימֲר֖וֹת עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/003.yaml
  text: 'And I will give wonders in the heavens and on the earth: blood and fire and columns of smoke[a].'
translation:
  language: fr
  text: 'Je ferai paraître des prodiges dans les cieux et sur la terre : du sang, du feu et des colonnes de fumée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des piliers de fumée ».
    reason: Alternative lexicale pour תִימֲרוֹת עָשָׁן, qui décrit des masses de fumée s’élevant verticalement.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je produirai
  rationale: Le verbe נתן signifie littéralement « donner, placer ». Avec מוֹפְתִים, le français « produire des prodiges » exprime naturellement le fait que Dieu les fait apparaître, sans recourir au peu idiomatique « donner des prodiges » ni à l'interprétatif « montrer ».
- source_word: מוֹפְתִים
  choice: des prodiges
  rationale: Le terme désigne des phénomènes extraordinaires qui servent de signes ou de présages. « Prodiges » conserve leur caractère saisissant sans préciser s'ils sont miraculeux, symboliques ou naturels.
- source_word: בַּשָּׁמַיִם
  choice: dans les cieux
  rationale: Le pluriel « les cieux » reflète la forme hébraïque et reste une expression biblique française claire; « dans le ciel » serait également possible, mais atténuerait ce trait formel.
- source_word: וּבָאָרֶץ
  choice: et sur la terre
  rationale: Dans le contraste cosmique avec les cieux, « la terre » est le correspondant naturel; « sur » convient à la manifestation de phénomènes dans le domaine terrestre.
- source_word: דָּם
  choice: du sang
  rationale: Le nom signifie directement « sang »; l'article partitif est naturel dans cette énumération française.
- source_word: וָאֵשׁ
  choice: du feu
  rationale: Le nom signifie directement « feu »; la coordination française de l'énumération est rendue naturellement.
- source_word: וְתִימֲרוֹת עָשָׁן
  choice: et des colonnes de fumée
  rationale: תִּימֲרוֹת évoque des formes ou masses qui s'élèvent verticalement. « Colonnes de fumée » restitue clairement cette image en français moderne; « piliers de fumée » demeure une possibilité plus littérale et traditionnelle, signalée en note.
theological_decisions:
- issue: Nature des phénomènes décrits
  choice: Des signes cosmiques de l'intervention ou du jugement divins, sans imposer de scénario eschatologique plus précis
  alternative: Des événements cosmiques strictement littéraux, ou une imagerie principalement symbolique du bouleversement
  rationale: Le texte énumère des phénomènes saisissants dans les cieux et sur la terre, mais ne tranche pas ici entre lecture littérale, symbolique ou mixte. La traduction préserve donc les images et leur gravité sans les expliquer.
translation_notes:
  register: Français international moderne, digne et accessible. « Je produirai des prodiges » privilégie une formulation française naturelle tout en restant proche de l'action causative exprimée par נתן. L'énumération conserve sa force sobre, et le pluriel « les cieux » maintient l'idiome hébraïque.
