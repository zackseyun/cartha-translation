id: JOL.4.13
reference: Joel 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁלְח֣וּ מַגָּ֔ל כִּ֥י בָשַׁ֖ל קָצִ֑יר בֹּ֤אֽוּ רְדוּ֙ כִּֽי מָ֣לְאָה גַּ֔ת הֵשִׁ֨יקוּ֙ הַ/יְקָבִ֔ים כִּ֥י רַבָּ֖ה רָעָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: fr
  text: Lancez la faucille, car la moisson est mûre. Venez, descendez, car le pressoir est plein ; les cuves débordent, car leur méchanceté est grande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מַגָּל
  choice: Lancez la faucille
  rationale: L’impératif שִׁלְחוּ signifie littéralement « envoyez » et, avec « faucille », forme une invitation énergique à commencer la récolte. « Lancez la faucille » conserve l’image et demeure idiomatique.
- source_word: בָשַׁל קָצִיר
  choice: la moisson est mûre
  rationale: בָשַׁל indique la maturité ; קָצִיר peut désigner la récolte ou la moisson. La formulation française restitue naturellement l’image agricole.
- source_word: בֹּאוּ רְדוּ
  choice: Venez, descendez
  rationale: רְדוּ est compris selon son sens courant « descendez », conformément au texte consonantique et à la vocalisation massorétique, sans le remplacer par la conjecture contextuelle « foulez ».
- source_word: גַּת
  choice: le pressoir
  rationale: Le terme désigne l’installation où l’on foule ou presse le raisin.
- source_word: הֵשִׁיקוּ הַיְקָבִים
  choice: les cuves débordent
  rationale: Le verbe exprime ici l’idée de ruisseler ou déborder, tandis que יְקָבִים désigne les cuves recevant le jus ; cette traduction rend clairement l’image d’une surabondance.
- source_word: רָעָתָם
  choice: leur méchanceté
  rationale: רָעָה peut évoquer le mal, la méchanceté ou le malheur. Dans ce contexte de jugement des nations, « méchanceté » exprime la faute morale qui motive le jugement.
theological_decisions:
- issue: Image de la récolte et du pressoir comme jugement
  choice: Conserver les deux métaphores sans explicitation ajoutée
  alternative: Paraphraser directement comme un appel au jugement divin
  rationale: Le verset communique le jugement par des images poétiques fortes ; une explicitation doctrinale dans le corps du texte réduirait leur portée et dépasserait la formulation hébraïque.
- issue: Sens de רְדוּ
  choice: « descendez »
  alternative: « foulez » ou « piétinez »
  rationale: « Descendez » suit directement le texte massorétique. « Foulez » s’accorde avec le pressoir et peut refléter une autre compréhension du verbe, mais ne doit pas être substitué silencieusement au sens attesté par la vocalisation reçue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme impératif et le parallélisme poétique sont conservés. Aucun marqueur de note n’est requis.
