  source_fidelity: Le texte rend fidèlement l’accusation au parfait (« Vous avez vendu »), les deux groupes parallèles (« les fils de Juda et les fils de Jérusalem »), le destinataire (« aux Grecs »), le but (« afin de ») et la valeur causative de הַרְחִיקָם (« les éloigner »). « De leur territoire » est une interprétation recevable de מֵעַל גְּבוּלָם, dont le champ couvre frontière, limites et territoire.
  naturalness: Le français est moderne, clair et d’un registre convenable pour un oracle prophétique. La répétition de « les fils de » conserve le parallélisme sans produire une tournure artificielle. « Aux Grecs » est nettement plus idiomatique que la formulation littérale en français.
