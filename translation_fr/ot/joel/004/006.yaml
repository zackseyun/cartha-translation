id: JOL.4.6
reference: Joel 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנֵ֤י יְהוּדָה֙ וּ/בְנֵ֣י יְרוּשָׁלִַ֔ם מְכַרְתֶּ֖ם לִ/בְנֵ֣י הַ/יְּוָנִ֑ים לְמַ֥עַן הַרְחִיקָ֖/ם מֵ/עַ֥ל גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
translation:
  language: fr
  text: Vous avez vendu les fils de Juda et les fils de Jérusalem aux Grecs[a], afin de les éloigner de leur territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils des Grecs »; on peut aussi comprendre : « aux Ioniens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « loin de leur frontière » ou « loin de leurs limites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה וּבְנֵי יְרוּשָׁלִַם
  choice: les fils de Juda et les fils de Jérusalem
  rationale: La traduction conserve l’image familiale et collective de בְּנֵי, tout en employant les formes françaises usuelles des noms propres. Le « et » hébreu initial relie ce complément au verset précédent, mais n’est pas nécessaire en français puisque la phrase commence naturellement par le verbe et son sujet implicite.
- source_word: מְכַרְתֶּם
  choice: Vous avez vendu
  rationale: Le qal accompli à la 2e personne du masculin pluriel exprime ici une accusation portant sur un acte accompli. Le passé composé est naturel en français moderne.
- source_word: לִבְנֵי הַיְּוָנִים
  choice: aux Grecs
  rationale: יְוָנִים désigne les Grecs, historiquement aussi les Ioniens. La tournure française idiomatique « aux Grecs » rend le sens collectif; la forme littérale est signalée en note.
- source_word: לְמַעַן
  choice: afin de
  rationale: Cette locution marque explicitement le but recherché, comme לְמַעַן.
- source_word: הַרְחִיקָם
  choice: les éloigner
  rationale: Le hiphil de רחק signifie faire devenir lointain, mettre à distance. « Éloigner » conserve cette valeur causative sans préciser indûment le moyen employé.
- source_word: מֵעַל גְּבוּלָם
  choice: de leur territoire
  rationale: גְּבוּל peut désigner une frontière, des limites ou le territoire qu’elles délimitent. Dans le contexte de personnes vendues et emmenées au loin, « territoire » est naturel, tandis que le sens plus concret est conservé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La répétition « les fils de » préserve le parallélisme hébreu pour Juda et Jérusalem, tandis que « aux Grecs » évite une tournure peu naturelle en français. Les notes maintiennent les principales possibilités lexicales de יְוָנִים et גְּבוּל.
