id: JOL.4.14
reference: Joel 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲמוֹנִ֣ים הֲמוֹנִ֔ים בְּ/עֵ֖מֶק הֶֽ/חָר֑וּץ כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה בְּ/עֵ֖מֶק הֶ/חָרֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
translation:
  language: fr
  text: Des foules, des foules dans la vallée de la Décision[a] ! Car le jour de Yahweh est proche dans la vallée de la Décision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vallée du Jugement » ou « la vallée du Dépiquage ». Le terme hébreu évoque un verdict décisif et peut aussi faire allusion au dépiquage.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמוֹנִים
  choice: Des foules
  rationale: Le pluriel désigne de grandes masses humaines. La répétition est conservée pour rendre l’ampleur et l’urgence de l’énoncé prophétique.
- source_word: בְּעֵמֶק
  choice: dans la vallée
  rationale: עֵמֶק désigne couramment une vallée. Cette traduction directe conserve l’image géographique et reste naturelle en français moderne.
- source_word: הֶחָרוּץ
  choice: la Décision
  rationale: חָרוּץ peut évoquer ce qui est décidé ou décrété, ainsi que la netteté d’un verdict et, possiblement, le dépiquage. « Décision » garde le lien avec une détermination décisive sans réduire le terme au seul « jugement ».
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de l’exclamation précédente. « Car » convient au registre prophétique tout en restant clair.
- source_word: קָרוֹב
  choice: est proche
  rationale: L’adjectif exprime directement la proximité. « Est proche » est une formulation française naturelle et fidèle.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Cette expression prophétique établie annonce l’intervention divine, notamment en jugement. La formulation conserve le nom divin personnel et la structure de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération française courante « Yahweh », afin de préserver le nom personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de עֵמֶק הֶחָרוּץ
  choice: la vallée de la Décision
  alternative: la vallée du Jugement ; la vallée du Dépiquage
  rationale: 'L’expression hébraïque est riche de plusieurs connotations : décision ou verdict arrêté, jugement, et peut-être imagerie du dépiquage. Le texte principal retient « Décision », tandis que la note préserve les autres possibilités sans résoudre artificiellement l’ambiguïté.'
translation_notes:
  register: Français international moderne, clair et digne. La répétition emphatique est maintenue. La majuscule à « Décision » signale ici la désignation de la vallée, sans en faire un nom propre indépendant.
