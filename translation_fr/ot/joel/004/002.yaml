  to: 'Je rassemblerai toutes les nations et je les ferai descendre dans la vallée de Josaphat[a]. Là, j’entrerai en jugement avec elles au sujet de[b] mon peuple et de mon héritage, Israël : elles l’ont dispersé parmi les nations et se sont partagé mon pays.'
