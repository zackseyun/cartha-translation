  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
translation:
  language: fr
  text: 'Je rassemblerai toutes les nations et je les ferai descendre dans la vallée de Josaphat[a]. Là, j’entrerai en jugement avec elles au sujet de[b] mon peuple et de mon héritage, Israël : elles l’ont dispersé parmi les nations et se sont partagé mon pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« La vallée de Josaphat » est un nom de lieu. Le nom « Josaphat » peut évoquer l’idée : « le SEIGNEUR juge ».'
    reason: cultural_note
  - marker: b
    text: Ou « à cause de mon peuple et de mon héritage, Israël » ou « en faveur de mon peuple et de mon héritage, Israël ». La préposition hébraïque peut prendre plusieurs sens judiciaires étroitement liés.
    reason: alternative_reading
lexical_decisions:
- source_word: וְקִבַּצְתִּי אֶת כָּל הַגּוֹיִם
  choice: Je rassemblerai toutes les nations
  rationale: « Rassembler » rend naturellement קבץ, tandis que « nations » désigne ici les peuples étrangers collectivement, sans lui donner un sens technique ultérieur.
- source_word: וְהוֹרַדְתִּים
  choice: je les ferai descendre
  rationale: La forme causative de ירד est conservée explicitement et convient au mouvement vers une vallée.
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: la vallée de Josaphat
  rationale: Le texte présente l’expression comme un nom de lieu. La forme française traditionnelle « Josaphat » est claire et naturelle; la portée possible du nom est signalée en note.
- source_word: וְנִשְׁפַּטְתִּי עִמָּם
  choice: j’entrerai en jugement avec elles
  rationale: Cette formulation conserve la nuance judiciaire et contentieuse du niphal de שפט construit avec עִם, au lieu de réduire l’expression à « je les jugerai ».
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  choice: au sujet de mon peuple et de mon héritage, Israël
  rationale: « Au sujet de » garde ouverte la valeur judiciaire de עַל. « Mon héritage » conserve les résonances d’appartenance et d’alliance de נַחֲלָה, et « Israël » identifie en apposition le peuple et l’héritage.
- source_word: אֲשֶׁר פִּזְּרוּ בַגּוֹיִם
  choice: qu’elles ont dispersé parmi les nations
  rationale: « Disperser » exprime clairement la dissémination d’Israël parmi les peuples et convient au registre prophétique.
- source_word: וְאֶת אַרְצִי חִלֵּקוּ
  choice: et elles ont partagé mon pays
  rationale: Le piel de חלק indique la division ou la répartition du territoire. « Partager mon pays » est naturel en français et exprime concrètement son morcellement.
theological_decisions:
- issue: Valeur de עַל dans la clause judiciaire
  choice: au sujet de mon peuple et de mon héritage, Israël
  alternative: à cause de mon peuple et de mon héritage, Israël; en faveur de mon peuple et de mon héritage, Israël
  rationale: La préposition peut indiquer l’objet du litige, sa cause ou le bénéficiaire de l’intervention judiciaire. Le texte principal retient une formulation non réductrice et la note préserve les autres nuances plausibles.
- issue: Portée de נַחֲלָתִי
  choice: mon héritage
  alternative: mon patrimoine; mon bien propre
  rationale: « Héritage » maintient la force biblique du terme, selon laquelle Israël appartient au Seigneur, sans expliciter davantage que le texte source.
- issue: Interprétation de « vallée de Josaphat »
  choice: nom de lieu translittéré
  alternative: vallée où le SEIGNEUR juge
  rationale: Le syntagme fonctionne comme un toponyme dans le verset. Son écho étymologique possible est pertinent, mais il ne doit pas remplacer le nom dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement solennel de l’annonce prophétique, tandis que les notes maintiennent l’ambiguïté réelle de la préposition hébraïque et l’écho possible du toponyme.
