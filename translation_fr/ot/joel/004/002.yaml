    issue: Construction syntaxique finale disjointe
    rationale: Après « Israël, qu’elles ont dispersé parmi les nations », l’ajout « et elles ont partagé mon pays » abandonne la relative sans marquer clairement la relation des deux accusations à la clause judiciaire. Le texte hébreu coordonne les deux actions des nations comme motifs du jugement. Une reprise explicite les maintient ensemble.
