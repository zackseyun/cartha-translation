source:
  edition: WLC
  text: וְ֠/גַם מָה אַתֶּ֥ם לִ/י֙ צֹ֣ר וְ/צִיד֔וֹן וְ/כֹ֖ל גְּלִיל֣וֹת פְּלָ֑שֶׁת הַ/גְּמ֗וּל אַתֶּם֙ מְשַׁלְּמִ֣ים עָלָ֔/י וְ/אִם גֹּמְלִ֤ים אַתֶּם֙ עָלַ֔/י קַ֣ל מְהֵרָ֔ה אָשִׁ֥יב גְּמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
translation:
  language: fr
  text: Et vous aussi, qu’avez-vous à faire avec moi[a], Tyr et Sidon, ainsi que toutes les régions[b] de la Philistie ? Me rendez-vous la pareille ? Si vous me rendez la pareille, très vite, sans tarder, je ferai retomber votre rétribution sur votre tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’êtes-vous pour moi ? » L’expression hébraïque constitue ici une interpellation hostile.'
    reason: lexical_alternative
  - marker: b
    text: Ou « districts » ou « territoires » de la Philistie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  choice: Et vous aussi, qu’avez-vous à faire avec moi
  rationale: « Et vous aussi » rend le connecteur emphatique וְגַם. L’expression hébraïque מָה אַתֶּם לִי est une interpellation hostile; la formulation française choisie en transmet naturellement la portée, tandis que la note conserve sa forme plus littérale.
- source_word: צֹר וְצִידוֹן
  choice: Tyr et Sidon
  rationale: Formes françaises usuelles de ces noms géographiques.
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  choice: ainsi que toutes les régions de la Philistie
  rationale: גְּלִילוֹת désigne des régions, districts ou territoires; פְּלָשֶׁת est ici rendu par le nom géographique traditionnel « Philistie ».
- source_word: הַגְּמוּל אַתֶּם מְשַׁלְּמִים עָלָי
  choice: Voulez-vous me rendre la pareille ?
  rationale: La tournure exprime une rétribution dirigée contre Dieu. « Rendre la pareille » est une expression française actuelle qui conserve l’idée de réponse ou de représailles sans alourdir la question.
- source_word: וְאִם גֹּמְלִים אַתֶּם עָלַי
  choice: Si vous me rendez la pareille
  rationale: La répétition de « rendre la pareille » reflète la reprise hébraïque de la famille גמל / גמול et maintient le motif de la rétribution.
- source_word: קַל מְהֵרָה
  choice: très vite, sans tarder
  rationale: Les deux expressions hébraïques s’intensifient mutuellement. Cette formulation française en conserve le redoublement et l’urgence.
- source_word: אָשִׁיב גְּמֻלְכֶם בְּרֹאשְׁכֶם
  choice: je ferai retomber sur votre tête ce que vous m’avez fait
  rationale: La formulation rend l’action de retourner leur conduite contre eux et conserve l’image hébraïque des conséquences qui retombent sur la tête des auteurs.
theological_decisions:
- issue: Nature de la réponse divine
  choice: Conserver la menace directe de rétribution divine
  alternative: Présenter seulement une conséquence générale et impersonnelle
  rationale: Les répétitions de גמל / גמול, le verbe אָשִׁיב et l’expression « sur votre tête » décrivent une intervention directe de Dieu qui retourne contre les coupables leurs propres actes. Le texte ne doit pas être adouci en simple principe impersonnel.
translation_notes:
  register: Français international moderne, clair et digne. L’interpellation reste vive sans devenir familière; le redoublement « très vite, sans tarder » conserve l’insistance de l’hébreu. Les marqueurs [a] et [b] sont placés exactement sur les expressions qu’ils expliquent.
