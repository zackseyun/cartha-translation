  yaml_path: translation/ot/joel/004/003.yaml
  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
translation:
  language: fr
  text: Ils ont tiré au sort pour se partager mon peuple[a] ; ils ont donné un garçon en échange d’une prostituée[b], vendu une fille pour du vin, puis ils l’ont bu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont réparti mon peuple par tirage au sort ». Il s’agit de partager des personnes comme butin en recourant au sort.'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « ils ont donné un garçon pour une prostituée ». La formulation hébraïque est elliptique ; la préposition exprime vraisemblablement une contrepartie, sans préciser davantage les modalités de l’échange.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל עַמִּי
  choice: mon peuple
  rationale: Avec l’expression « tirer au sort », la préposition introduit les personnes réparties comme butin. En français, « tirer au sort mon peuple » exprime naturellement l’idée sans surcharger la phrase.
- source_word: יַדּוּ גוֹרָל
  choice: ils ont tiré au sort
  rationale: Cette locution désigne l’action de jeter ou tirer le sort afin de procéder à une répartition. La formulation française est idiomatique et conserve la brutalité du partage implicite.
- source_word: וַיִּתְּנוּ
  choice: ils ont donné
  rationale: Le verbe signifie littéralement « donner ». Le contexte indique un échange infâme, explicité par « en échange de », sans remplacer le verbe hébreu par un terme plus interprétatif.
- source_word: הַיֶּלֶד
  choice: un garçon
  rationale: L’article hébreu peut avoir ici une valeur générique. « Un garçon » convient au parallélisme avec « une fille » et précise le sexe de la jeune victime.
- source_word: בַּזּוֹנָה
  choice: en échange d’une prostituée
  rationale: La préposition peut marquer ici la contrepartie. Cette formulation garde le sens transactionnel vraisemblable tout en signalant en note l’autre construction possible.
- source_word: וְהַיַּלְדָּה מָכְרוּ
  choice: vendu une fille
  rationale: Le verbe signifie directement « vendre » et le nom désigne une jeune personne de sexe féminin. L’emploi générique de l’article est rendu par l’indéfini français.
- source_word: בַיַּיִן
  choice: pour du vin
  rationale: La préposition indique le prix ou la contrepartie de la vente. « Pour du vin » est direct et naturel.
- source_word: וַיִּשְׁתּוּ
  choice: puis ils l’ont bu
  rationale: L’objet sous-entendu est le vin. Le pronom français l’explicite naturellement, tandis que « puis » rend la succession narrative sans ajouter de causalité.
