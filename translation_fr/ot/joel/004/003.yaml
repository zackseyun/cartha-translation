  - severity: medium
    issue: 'Note b : alternative « à une prostituée » insuffisamment fondée'
    rationale: Dans cette construction, la préposition hébraïque exprime plus naturellement la contrepartie ou le prix. Présenter le destinataire comme une alternative équivalente risque de donner une analyse syntaxique trompeuse. Une note sur l’ellipse transactionnelle préserve mieux la concision et l’incertitude du texte.
