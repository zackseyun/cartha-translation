id: JOL.4.11
reference: Joel 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
translation:
  language: fr
  text: Hâtez-vous et venez[a], vous toutes, nations de toutes parts, et rassemblez-vous là ! Fais descendre tes puissants[b], Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dépêchez-vous, venez… et réunissez-vous là. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Fais descendre tes guerriers, Yahweh ! » L’hébreu « tes puissants » peut désigner de puissants agents de Yahweh sans préciser s’ils sont humains ou célestes.'
    reason: alternative_reading
lexical_decisions:
- source_word: ע֣וּשׁוּ
  choice: Hâtez-vous
  rationale: Cette forme rare est comprise, dans ce contexte d’appel pressant, comme un impératif exprimant l’urgence. « Hâtez-vous » reste concis et convient au parallélisme avec « venez ».
- source_word: וָ/בֹ֧אוּ
  choice: et venez
  rationale: L’impératif de בוא est rendu directement, et la conjonction est conservée pour maintenir l’enchaînement rhétorique.
- source_word: כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב
  choice: vous toutes, nations des alentours
  rationale: Le contexte impératif donne à l’expression une valeur d’adresse directe. « Des alentours » exprime la provenance de toutes parts sans alourdir la phrase.
- source_word: וְ/נִקְבָּ֑צוּ
  choice: et rassemblez-vous
  rationale: Le niphal employé comme injonction appelle les nations à se réunir. La tournure pronominale française conserve mieux cette nuance qu’un simple « assemblez-vous ».
- source_word: שָׁ֕מָּ/ה
  choice: là
  rationale: L’adverbe désigne simplement le lieu fixé dans le contexte.
- source_word: הַֽנְחַ֥ת
  choice: Fais descendre
  rationale: L’impératif causatif exprime un mouvement vers le bas. « Fais descendre » le conserve explicitement et naturellement.
- source_word: יְהוָ֖ה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: גִּבּוֹרֶֽי/ךָ
  choice: tes puissants
  rationale: Le substantif désigne des êtres puissants, des vaillants ou des guerriers. « Tes puissants » préserve l’appartenance à Yahweh et évite de préciser s’il s’agit d’agents humains ou célestes.
theological_decisions:
- issue: Identité des גִּבּוֹרֶיךָ
  choice: tes puissants
  alternative: tes guerriers ; tes vaillants
  rationale: Le texte les présente comme les agents puissants de Yahweh sans indiquer explicitement s’ils sont humains ou célestes. La formulation retenue maintient cette ouverture.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; sa transcription préserve ici sa fonction de nom propre.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Les impératifs et l’exclamation rendent l’urgence de la convocation. L’adresse « vous toutes, nations des alentours » conserve la portée vocative de l’hébreu, tandis que « tes puissants » maintient l’ambiguïté voulue.
