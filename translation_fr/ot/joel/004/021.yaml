id: JOL.4.21
reference: Joel 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִקֵּ֖יתִי דָּמָ֣/ם לֹֽא נִקֵּ֑יתִי וַֽ/יהוָ֖ה שֹׁכֵ֥ן בְּ/צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
translation:
  language: fr
  text: Je vengerai leur sang, que je n’ai pas vengé[a], et Yahvé demeure à Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne laisserai pas leur sang impuni. » L’hébreu répète le même verbe avec une négation ; il peut évoquer soit la vengeance du sang versé, soit le fait de ne pas le laisser impuni.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקֵּיתִי
  choice: Je vengerai
  rationale: Avec « leur sang » et dans ce contexte de jugement, le piel de נקה exprime ici le fait de faire justice pour le sang versé. « Venger » rend naturellement cette portée judiciaire sans effacer la difficulté de l’hébreu.
- source_word: דָּמָם
  choice: leur sang
  rationale: Cette traduction littérale conserve l’image hébraïque du sang versé tout en laissant entendre la mise à mort qui appelle justice.
- source_word: לֹא נִקֵּיתִי
  choice: que je n’ai pas vengé
  rationale: La reprise négative du même verbe est rendue par une relative qui oppose l’intervention promise à l’absence antérieure de vengeance. Une autre compréhension idiomatique est signalée en note.
- source_word: וַיהוָה
  choice: et Yahvé
  rationale: Le nom divin est translittéré sous sa forme française usuelle, ce qui correspond au texte hébreu et à la couche de consultation fournie.
- source_word: שֹׁכֵן
  choice: demeure
  rationale: Le participe indique une présence durable. « Demeure » est actuel, digne et suffisamment duratif.
- source_word: בְּצִיּוֹן
  choice: à Sion
  rationale: En français, « demeurer à Sion » est plus idiomatique que « demeurer dans Sion » pour indiquer ce lieu de résidence.
theological_decisions:
- issue: Sens de נקה avec « sang » dans un contexte de jugement
  choice: Dieu vengera le sang versé, c’est-à-dire qu’il fera justice aux victimes.
  alternative: Dieu purifiera de la culpabilité du sang ou déclarera innocent.
  rationale: Le contexte immédiat concerne le jugement des nations hostiles et la réhabilitation de Juda et de Jérusalem. « Venger » exprime le mieux cette justice rétributive, sans introduire une lecture rituelle.
- issue: Rapport entre les deux occurrences de נקה
  choice: Une vengeance promise pour un sang qui n’avait pas encore été vengé.
  alternative: 'Une affirmation renforcée : « je ne laisserai pas leur sang impuni » ; ou une déclaration d’innocence.'
  rationale: La formulation hébraïque est brève et ambiguë. Le texte principal conserve la répétition et le contraste temporel possibles ; la note présente l’autre lecture idiomatique majeure.
- issue: Présence de Yahvé à Sion
  choice: « Yahvé demeure à Sion » exprime une présence durable.
  alternative: « Yahvé demeurera à Sion », avec une valeur plus explicitement future.
  rationale: Le participe hébreu décrit celui qui réside ou demeure. Le présent français conserve cette valeur durative et peut fonctionner comme proclamation conclusive.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition inhabituelle de « vengé » est maintenue afin de refléter la tension du texte hébreu ; la note offre la formulation idiomatique alternative.
