source:
  edition: WLC
  text: יֵע֨וֹרוּ֙ וְ/יַעֲל֣וּ הַ/גּוֹיִ֔ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט כִּ֣י שָׁ֗ם אֵשֵׁ֛ב לִ/שְׁפֹּ֥ט אֶת כָּל הַ/גּוֹיִ֖ם מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
translation:
  language: fr
  text: Que les nations se réveillent et montent vers la vallée de Josaphat[a] ! Car c’est là que je siégerai pour juger toutes les nations environnantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Josaphat » évoque probablement « le SEIGNEUR juge », ce qui renforce ici le thème du jugement divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעֹרוּ
  choice: Que les nations se réveillent
  rationale: Le jussif lance un appel à se mettre en mouvement. « Se réveillent » conserve l’image hébraïque du réveil ou de la mobilisation sans l’aplatir.
- source_word: וְיַעֲלוּ
  choice: et montent
  rationale: Le verbe עלה exprime une montée vers le lieu fixé. « Montent » est naturel en français et garde cette orientation spatiale.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte, le terme désigne les peuples étrangers convoqués pour le jugement ; « nations » est précis et évite les connotations plus tardives de « païens ».
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: la vallée de Josaphat
  rationale: Le nom propre est rendu selon sa forme française traditionnelle. Sa portée sémantique liée au jugement divin est signalée en note.
- source_word: כִּי שָׁם
  choice: Car c’est là
  rationale: Cette tournure rend clairement et naturellement la valeur causale de כִּי et l’insistance locale de שָׁם.
- source_word: אֵשֵׁב
  choice: je siégerai
  rationale: Avec « pour juger », ישב évoque la prise de siège du juge. « Siégerai » restitue cette image judiciaire plus nettement que le simple « m’assiérai ».
- source_word: לִשְׁפֹּט
  choice: pour juger
  rationale: Le verbe שפט désigne ici explicitement l’exercice du jugement divin.
- source_word: כָּל הַגּוֹיִם מִסָּבִיב
  choice: toutes les nations environnantes
  rationale: Cette formulation idiomatique conserve le sens spatial de מִסָּבִיב, qui caractérise les nations situées alentour.
theological_decisions:
- issue: Portée du nom יְהוֹשָׁפָט dans la scène de jugement
  choice: Conserver « Josaphat » dans le texte et expliquer en note l’écho possible avec « le SEIGNEUR juge ».
  alternative: Traduire directement le nom par « le SEIGNEUR juge ».
  rationale: Le maintien du nom propre respecte son statut dans le texte, tandis que la note préserve le jeu sémantique qui renforce le thème du jugement divin sans imposer cette interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le jussif est rendu par « Que… », et « je siégerai » maintient l’image solennelle du juge prenant place pour rendre son jugement.
