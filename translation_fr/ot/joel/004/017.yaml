id: JOL.4.17
reference: Joel 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם שֹׁכֵ֖ן בְּ/צִיּ֣וֹן הַר קָדְשִׁ֑/י וְ/הָיְתָ֤ה יְרוּשָׁלִַ֨ם֙ קֹ֔דֶשׁ וְ/זָרִ֥ים לֹא יַֽעַבְרוּ בָ֖/הּ עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
translation:
  language: fr
  text: Alors vous saurez que moi, je suis Yahweh, votre Dieu, qui demeure à Sion, ma montagne sainte. Jérusalem sera sainte, et les étrangers[a] n’y passeront plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de l’extérieur ». Le mot hébreu désigne ceux qui sont étrangers au lieu ou qui n’y ont pas leur place ; ici, il ne vise pas nécessairement toute personne non israélite sans distinction.
    reason: Alternative lexicale et préservation de la portée contextuelle de זָרִים.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le waw avec l’accompli peut exprimer ici la conséquence dans le discours prophétique. « Alors » rend cette progression, tandis que « vous saurez » conserve la valeur de reconnaissance vécue de ידע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: 'Le suffixe de deuxième personne du pluriel exprime directement la relation d’alliance : « votre Dieu ».'
- source_word: שֹׁכֵן בְּצִיּוֹן
  choice: qui demeure à Sion
  rationale: Le participe présente Yahweh comme celui qui réside à Sion. En français, « demeure à Sion » est naturel et dignifié.
- source_word: הַר קָדְשִׁי
  choice: ma montagne sainte
  rationale: Cette formulation idiomatique conserve à la fois le possessif et l’idée de sainteté.
- source_word: וְהָיְתָה יְרוּשָׁלִַם קֹדֶשׁ
  choice: Jérusalem sera sainte
  rationale: Le texte attribue directement la sainteté à Jérusalem, sans expliciter un processus qui imposerait « deviendra ».
- source_word: וְזָרִים
  choice: et les étrangers
  rationale: זָרִים désigne ceux qui sont extérieurs ou étrangers au lieu concerné. « Étrangers » préserve cette largeur de sens, précisée en note pour éviter une lecture exclusivement ethnique.
- source_word: לֹא יַעַבְרוּ בָהּ עוֹד
  choice: n’y passeront plus
  rationale: Cette traduction conserve l’image de traverser ou de passer dans Jérusalem et rend naturellement la négation avec עוֹד.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le Tétragramme comme nom personnel. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Référent de זָרִים dans le contexte de sainteté et de restauration
  choice: les étrangers, avec une note explicative
  alternative: les gens de l’extérieur
  rationale: Le terme peut désigner des étrangers ou, plus largement, des personnes qui n’ont pas leur place dans l’espace saint. La traduction garde le terme courant sans résoudre abusivement l’ambiguïté.
translation_notes:
  register: Français international moderne, courant et solennel. Le tour emphatique « moi, je suis Yahweh » rend la présence du pronom hébreu אֲנִי. « À Sion » est plus idiomatique en français que « dans Sion ». Le pronom adverbial « y » évite une personnification forcée de Jérusalem.
