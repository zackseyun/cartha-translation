id: JOL.4.5
reference: Joel 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁר כַּסְפִּ֥/י וּ/זְהָבִ֖/י לְקַחְתֶּ֑ם וּ/מַֽחֲמַדַּ/י֙ הַ/טֹּבִ֔ים הֲבֵאתֶ֖ם לְ/הֵיכְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/005.yaml
  text: because you took my silver and my gold[a], and brought my precious things into your temples.
translation:
  language: fr
  text: Parce que vous avez pris mon argent et mon or, et que vous avez apporté mes objets précieux dans vos temples[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos palais ». Le mot hébreu peut désigner aussi bien des temples que des palais. Ici, « temples » est retenu parce que le contexte peut évoquer l’appropriation cultuelle de ce qui appartient à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Parce que
  rationale: Dans le contexte, la particule introduit le motif du jugement annoncé précédemment. « Parce que » rend naturellement cette valeur causale tout en maintenant le lien syntaxique avec le verset précédent.
- source_word: כַּסְפִּי וּזְהָבִי
  choice: mon argent et mon or
  rationale: Traduction directe des deux noms avec suffixe possessif de première personne.
- source_word: לְקַחְתֶּם
  choice: vous avez pris
  rationale: Le qal accompli à la deuxième personne du masculin pluriel exprime ici l'action de prendre. « Pris » reste direct sans renforcer indûment le verbe par « saisi » ou « pillé ».
- source_word: וּמַחֲמַדַּי הַטֹּבִים
  choice: mes objets précieux
  rationale: L'expression désigne des choses désirables, de prix ou de choix. « Objets précieux » est idiomatique et concret, sans ajouter la notion plus spécifique de « trésors ».
- source_word: הֲבֵאתֶם
  choice: vous avez apporté
  rationale: Le hiphil accompli de בוא signifie faire venir ou apporter quelque chose dans un lieu.
- source_word: לְהֵיכְלֵיכֶם
  choice: dans vos temples
  rationale: הֵיכָל peut désigner un temple ou un palais. Dans ce contexte de biens appartenant à Dieu transférés chez les nations, « temples » rend vraisemblablement la dimension cultuelle; l'autre sens est conservé en note.
theological_decisions:
- issue: Sens de הֵיכְלֵיכֶם et nature de l'appropriation des biens appartenant à Dieu
  choice: vos temples
  alternative: vos palais
  rationale: Le contexte permet de comprendre que les nations ont placé les objets pris à Dieu dans leurs propres sanctuaires, ce qui souligne la profanation. Comme le terme hébreu peut aussi désigner des palais royaux, cette possibilité n'est pas exclue et figure en note.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise de « que » après la coordination rend la phrase causale naturelle. Le marqueur de note est placé immédiatement après le terme ambigu « temples ».
