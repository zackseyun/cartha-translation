reference: Joel 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֤תּוּ אִתֵּי/כֶם֙ לַֽ/חֲרָב֔וֹת וּ/מַזְמְרֹֽתֵי/כֶ֖ם לִ/רְמָחִ֑ים הַֽ/חַלָּ֔שׁ יֹאמַ֖ר גִּבּ֥וֹר אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
translation:
  language: fr
  text: 'Martelez vos socs de charrue pour en faire des épées[a], et vos serpes pour en faire des lances ! Que celui qui est faible dise[b] : « Je suis un guerrier ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette image inverse celle d’Ésaïe 2.4 et de Michée 4.3, où des armes sont transformées en outils agricoles.
    reason: cross_reference
  - marker: b
    text: Ou « Je suis puissant ! », « Je suis fort ! » Le mot hébreu גִּבּוֹר peut désigner un homme puissant, un homme fort ou un guerrier ; ici, le contexte militaire favorise « guerrier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ
  choice: Martelez
  rationale: L’impératif pluriel de כתת évoque l’action de battre ou de marteler un objet. « Martelez » conserve l’image concrète de la transformation des outils agricoles en armes.
- source_word: אִתֵּיכֶם
  choice: vos socs de charrue
  rationale: Le nom désigne des instruments servant à labourer. « Socs de charrue » est précis, intelligible et permet de reconnaître l’inversion de l’image d’Ésaïe 2.4 et de Michée 4.3.
- source_word: לַחֲרָבוֹת
  choice: pour en faire des épées
  rationale: La préposition ל exprime ici le résultat ou la destination. Cette tournure française rend clairement la transformation commandée.
- source_word: וּמַזְמְרֹתֵיכֶם
  choice: et vos serpes
  rationale: Le terme désigne des outils de taille employés en agriculture, notamment en viticulture. « Serpes » est concis et naturel en français.
- source_word: לִרְמָחִים
  choice: pour en faire des lances
  rationale: רמח désigne une lance ou une arme comparable. « Lances » est le terme courant qui convient au contexte militaire.
- source_word: הַחַלָּשׁ
  choice: celui qui est faible
  rationale: L’adjectif substantivé est au singulier et désigne de manière représentative la personne faible. Cette formulation préserve cette valeur sans généraliser au pluriel.
- source_word: יֹאמַר
  choice: Que … dise
  rationale: Dans la suite des impératifs, l’imparfait porte une nuance jussive ou exhortative, naturellement exprimée en français par « Que … dise ».
- source_word: גִּבּוֹר
  choice: un guerrier
  rationale: גִּבּוֹר peut désigner un homme puissant, vaillant ou un guerrier. Le contexte immédiat d’armement favorise « guerrier », tout en signalant les autres possibilités en note.
- source_word: אָנִי
  choice: Je suis
  rationale: Le pronom explicite souligne l’affirmation personnelle. La phrase nominale hébraïque exige ici la copule en français.
theological_decisions:
- issue: Inversion intertextuelle de l’oracle de paix
  choice: Conserver les éléments reconnaissables de l’appel à transformer les outils agricoles en armes.
  alternative: Employer des termes agricoles ou militaires plus généraux, qui rendraient l’écho moins visible.
  rationale: Le texte reprend en sens inverse l’image d’Ésaïe 2.4 et de Michée 4.3. Le maintien des « socs de charrue », des « épées », des « serpes » et des « lances » laisse percevoir cette tension sans l’expliquer dans le corps du verset.
- issue: Sens de גִּבּוֹר dans l’affirmation finale
  choice: « Je suis un guerrier ! »
  alternative: « Je suis puissant ! » ou « Je suis fort ! »
  rationale: Le mot conserve une certaine amplitude sémantique, mais l’ordre de fabriquer des armes donne ici une forte orientation militaire. La note préserve les autres sens possibles.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs gardent la vigueur de l’hébreu ; « serpes » et « socs de charrue » restent concrets et largement compréhensibles. Les points d’exclamation rendent l’élan exhortatif sans ajouter de contenu interprétatif.
