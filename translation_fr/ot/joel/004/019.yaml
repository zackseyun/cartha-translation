source:
  edition: WLC
  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
translation:
  language: fr
  text: 'L’Égypte deviendra une désolation, et Édom un désert dévasté, à cause de la violence faite aux fils de Juda[a] : l’Égypte et Édom ont versé du sang innocent[b] dans leur pays[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « les fils de Juda » peut désigner collectivement le peuple de Juda.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le sang des innocents ».'
    reason: lexical_alternative
  - marker: c
    text: Le pronom renvoie très probablement aux fils de Juda; l’hébreu dit simplement « dans leur pays ».
    reason: referent_ambiguity
lexical_decisions:
- source_word: מִצְרַיִם לִשְׁמָמָה תִהְיֶה
  choice: L’Égypte deviendra une terre dévastée
  rationale: La construction לְ + nom avec היה exprime ici un état résultant. « Une terre dévastée » garde la force nominale de שְׁמָמָה tout en restant naturelle en français.
- source_word: וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִהְיֶה
  choice: et Édom un désert dévasté
  rationale: מִדְבָּר désigne une région désertique ou sauvage, et שְׁמָמָה sa dévastation. L’ellipse française de « deviendra » évite une répétition lourde sans rien omettre du sens.
- source_word: מֵחֲמַס
  choice: à cause de la violence faite à
  rationale: La préposition מִן a une valeur causale dans ce contexte, tandis que חָמָס désigne la violence ou l’injustice brutale.
- source_word: בְּנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: Traduction formellement fidèle du syntagme hébreu, qui peut toutefois désigner collectivement le peuple de Juda; cette possibilité est signalée en note.
- source_word: אֲשֶׁר שָׁפְכוּ דָם נָקִיא
  choice: ils ont versé du sang innocent
  rationale: Le relatif hébreu introduit l’acte qui caractérise la violence dénoncée. Deux propositions reliées par deux-points rendent clairement ce rapport en français. דָם נָקִיא est l’expression usuelle pour le sang versé sans juste motif.
- source_word: בְּאַרְצָם
  choice: dans leur pays
  rationale: Le suffixe masculin pluriel est conservé. Son antécédent le plus naturel est « les fils de Juda », sans ajouter « propre », absent de l’hébreu.
theological_decisions:
- issue: Référent du suffixe pronominal dans בְּאַרְצָם
  choice: Le pays des fils de Juda (« leur pays »)
  alternative: Le pays de l’Égypte et d’Édom, ou un référent laissé indéterminé
  rationale: L’antécédent pluriel le plus proche et le contexte du jugement des nations favorisent les fils de Juda. La note signale néanmoins que le pronom hébreu ne nomme pas explicitement son référent.
- issue: Portée de בְּנֵי יְהוּדָה
  choice: « les fils de Juda », avec sens collectif possible en note
  alternative: « le peuple de Juda » directement dans le texte
  rationale: La formulation concrète de l’hébreu est préservée, sans exclure son emploi collectif courant.
- issue: Sens de דָם נָקִיא
  choice: « du sang innocent »
  alternative: « le sang des innocents »
  rationale: La première formulation reproduit directement l’expression hébraïque; la seconde explicite qu’il s’agit du sang de personnes innocentes et est donnée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « dévasté » reflète la répétition de שְׁמָמָה. Le deux-points rend le lien explicatif de la proposition relative de façon claire et naturelle.
