source:
  edition: WLC
  text: כִּ֗י הִנֵּ֛ה בַּ/יָּמִ֥ים הָ/הֵ֖מָּה וּ/בָ/עֵ֣ת הַ/הִ֑יא אֲשֶׁ֥ר אשוב אֶת שְׁב֥וּת יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/001.yaml
  text: For behold[a], in those days and at that time, when I restore the fortunes of Judah and Jerusalem,
translation:
  language: fr
  text: 'Car voici : en ces jours-là et en ce temps-là, lorsque je rétablirai la situation de Juda et de Jérusalem[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je mettrai fin à la captivité de Juda et de Jérusalem » ou « je ramènerai les captifs de Juda et de Jérusalem ». L’expression hébraïque désigne le rétablissement d’un peuple après la détresse, souvent dans un contexte d’exil.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif ou l’explication de ce qui précède et conserve explicitement le lien logique.
- source_word: הִנֵּה
  choice: voici
  rationale: Attire solennellement l’attention sur l’intervention annoncée, dans un français prophétique naturel.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: en ces jours-là
  rationale: Expression temporelle consacrée qui renvoie à la période future déjà annoncée.
- source_word: וּבָעֵת הַהִיא
  choice: et en ce temps-là
  rationale: Conserve le parallélisme et l’insistance temporelle de l’hébreu.
- source_word: אֲשֶׁר
  choice: lorsque
  rationale: La particule relative introduit ici la circonstance temporelle de l’action divine.
- source_word: אשוב אֶת שְׁבוּת
  choice: je rétablirai la situation
  rationale: Rend l’expression hébraïque idiomatique comme le renversement d’une situation de détresse, sans exclure l’arrière-plan de captivité et de retour.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle du nom du territoire et du peuple.
- source_word: וִירוּשָׁלִָם
  choice: et de Jérusalem
  rationale: Forme française usuelle du nom de la ville, coordonnée à Juda.
theological_decisions:
- issue: Sens de l’expression שׁוּב אֶת־שְׁבוּת
  choice: je rétablirai la situation de Juda et de Jérusalem
  alternative: je ramènerai les captifs de Juda et de Jérusalem ; je mettrai fin à la captivité de Juda et de Jérusalem
  rationale: L’expression peut évoquer concrètement le retour des exilés, mais elle sert aussi plus largement à annoncer le renversement de la détresse d’un peuple. La formulation principale garde cette portée sans effacer le contexte possible de l’exil ; les lectures plus littérales sont signalées en note.
translation_notes:
  register: Français moderne, international et digne. « Voici » maintient la solennité prophétique sans archaïsme marqué. Le redoublement temporel de l’hébreu est conservé, ainsi que la virgule finale puisque la phrase se poursuit au verset suivant.
