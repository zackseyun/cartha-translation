  text: וִ/יהוּדָ֖ה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וִ/ירוּשָׁלִַ֖ם לְ/ד֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
translation:
  language: fr
  text: Mais Juda sera habité pour toujours[a], et Jérusalem, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mais Juda demeurera pour toujours ». Le verbe hébreu signifie littéralement « habiter », « demeurer » ou « siéger »; avec un pays ou une ville comme sujet, il peut signifier « être habité » ou « rester habité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוּדָה
  choice: Mais Juda
  rationale: Le waw relie ce verset au jugement précédent en marquant ici un contraste naturel en français. « Juda » désigne le territoire.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression indique une continuité durable dans l’avenir; « pour toujours » est la formulation française courante et digne.
- source_word: תֵּשֵׁב
  choice: sera habité
  rationale: Avec Juda comme territoire, le verbe ישׁב signifie naturellement « être habité » ou « demeurer habité ». Le passif évite une personnification artificielle tout en conservant le sens contextuel.
- source_word: וִירוּשָׁלִַם
  choice: et Jérusalem
  rationale: Le waw est additif dans le parallélisme entre Juda et Jérusalem.
- source_word: לְדוֹר וָדוֹר
  choice: de génération en génération
  rationale: Cette tournure idiomatique française conserve l’idée hébraïque d’une continuité à travers les générations successives.
theological_decisions:
- issue: Nature de la promesse concernant l’avenir durable de Juda et de Jérusalem
  choice: Présenter simplement la promesse prophétique d’une habitation durable.
  alternative: Préciser qu’il s’agit exclusivement d’une permanence géopolitique littérale, ou au contraire d’un accomplissement symbolique, ecclésiologique ou eschatologique.
  rationale: Le texte hébreu affirme la continuité de Juda et de Jérusalem sans définir le mode ni l’horizon précis de son accomplissement; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme bref de l’hébreu est conservé; la virgule après « Jérusalem » marque l’ellipse du verbe sans l’alourdir.
