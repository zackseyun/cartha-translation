  text: שֶׁ֥מֶשׁ וְ/יָרֵ֖חַ קָדָ֑רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/015.yaml
  text: The sun and the moon grow dark[a], and the stars withdraw their brightness.
translation:
  language: fr
  text: Le soleil et la lune s’obscurcissent, et les étoiles retirent leur éclat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « recueillent leur éclat », c’est-à-dire qu’elles retiennent leur lumière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ
  choice: le soleil
  rationale: Désignation courante de l’astre; l’article défini convient naturellement en français dans cette scène cosmique.
- source_word: וְיָרֵחַ
  choice: et la lune
  rationale: Traduction directe du nom de l’astre lunaire, coordonné au soleil.
- source_word: קָדָרוּ
  choice: s’obscurcissent
  rationale: Le qal parfait pluriel de קדר exprime ici l’assombrissement; le présent français rend naturellement la vigueur de la description prophétique sans introduire de cause externe.
- source_word: וְכוֹכָבִים
  choice: et les étoiles
  rationale: Traduction directe du pluriel, avec l’article requis par l’usage français.
- source_word: אָסְפוּ
  choice: retirent
  rationale: אסף signifie fondamentalement «rassembler, recueillir»; avec «leur éclat», «retirent» exprime de manière concise l’image des étoiles qui ramènent ou retiennent leur lumière.
- source_word: נָגְהָם
  choice: leur éclat
  rationale: נֹגַהּ désigne la clarté ou la splendeur lumineuse; «éclat» est précis, naturel et adapté aux étoiles.
theological_decisions:
- issue: L’obscurcissement cosmique dans l’imagerie prophétique du jugement
  choice: Présenter directement les signes cosmiques sans décider s’ils sont littéraux, métaphoriques ou symboliques.
  alternative: Préciser qu’il s’agit soit d’un phénomène astronomique littéral, soit d’une image figurée du jugement divin.
  rationale: L’hébreu demeure bref et poétique; la traduction conserve donc sa tension interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme poétique et l’image concrète du texte hébreu.
