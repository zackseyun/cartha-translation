revisions:
- from: Voici que je les fais se lever[a] du lieu où vous les avez vendus, et je ferai retomber sur votre tête la rétribution qui vous revient[b].
  to: Voici que je vais les faire sortir du lieu où vous les avez vendus[a], et je ferai retomber votre rétribution sur votre tête[b].
  rationale: La révision remplace une tournure française peu fluide par « je vais les faire sortir », qui rend naturellement l’émergence depuis le lieu où ils ont été vendus dans le contexte immédiat. Elle rétablit aussi le possessif sobre de l’hébreu (« votre rétribution ») et conserve l’image concrète de la rétribution ramenée sur la tête des coupables. Les notes sont resserrées pour distinguer les alternatives lexicales des paraphrases interprétatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:52:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Dieu annonce qu’il fera émerger/relèvera les personnes vendues et que la rétribution des responsables reviendra sur eux. Toutefois, « la rétribution qui vous revient » transforme de façon inutile le possessif hébreu (« votre rétribution ») en une formulation pouvant suggérer ce qu’ils méritent, plutôt que la rétribution qui leur sera renvoyée.'
  naturalness: « Voici que je les fais se lever du lieu » est compréhensible, mais « faire se lever du lieu » est peu idiomatique en français moderne. « Je vais les faire sortir du lieu » exprime naturellement le mouvement impliqué par le contexte, sans imposer une interprétation militaire ou psychologique.
  terminology: « Rétribution » convient à גְמֻלְכֶם et maintient la portée de rétorsion. Il faut conserver l’image de son retour « sur votre tête » et éviter l’ajout explicatif « selon vos actes » dans une note présentée comme alternative de traduction.
  issues:
  - severity: medium
    issue: « la rétribution qui vous revient »
    rationale: Cette relative n’est pas dans l’hébreu et peut être comprise comme « la rétribution que vous méritez ». Le texte dit littéralement que Dieu fera revenir « votre rétribution » sur leur tête.
  - severity: low
    issue: « je les fais se lever du lieu »
    rationale: La construction est raide en français. Une formulation dynamique au futur proche est plus naturelle tout en rendant l’action imminente introduite par הִנְנִי et le déplacement depuis le lieu de vente.
  - severity: low
    issue: 'Note b : « je vous rendrai selon vos actes »'
    rationale: Cette paraphrase explicite la correspondance morale, mais ne constitue pas une alternative lexicale directe et ajoute « vos actes », absent du verset.
