source:
  edition: WLC
  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
translation:
  language: fr
  text: Voici que je vais les faire sortir du lieu où vous les avez vendus[a], et je ferai retomber votre rétribution sur votre tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vais les réveiller » ou « je vais les mettre en mouvement ». Le verbe hébreu peut exprimer l’idée d’éveiller, de faire lever ou de pousser à agir.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je ferai revenir votre rétribution sur votre tête ». Ou : « je vous rendrai votre rétribution ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici que je
  rationale: Cette tournure française actuelle conserve la force présentative et solennelle de la déclaration divine, sans recourir à l’archaïsme « voici, moi ».
- source_word: מְעִירָם
  choice: je les fais se lever
  rationale: Le hifil de עור signifie éveiller, faire lever ou mettre en mouvement. « Faire se lever » convient à la sortie du lieu où ils ont été vendus, tout en évitant de réduire l’image à un réveil physique ou à une mobilisation militaire.
- source_word: מִן הַמָּקוֹם
  choice: du lieu
  rationale: Rend directement l’expression spatiale hébraïque dans un français naturel et soutenu.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתָם שָׁמָּה
  choice: où vous les avez vendus
  rationale: Le relatif et l’adverbe directionnel désignent le lieu vers lequel ils ont été vendus. Cette formulation française exprime naturellement cette destination.
- source_word: וַהֲשִׁבֹתִי
  choice: je ferai retomber
  rationale: Le hifil de שוב exprime ici le fait de faire revenir la rétribution sur les coupables. « Faire retomber » conserve l’image du retour tout en rendant clairement l’idiome en français.
- source_word: גְמֻלְכֶם
  choice: la rétribution qui vous revient
  rationale: גמול peut désigner le traitement infligé ou la rétribution correspondante. Cette formulation garde la portée morale et judiciaire du terme sans la réduire à un simple paiement commercial.
- source_word: בְּרֹאשְׁכֶם
  choice: sur votre tête
  rationale: L’idiome concret de la rétribution revenant sur le coupable est conservé, et il demeure intelligible en français.
theological_decisions:
- issue: Nature de l’action divine exprimée par מְעִירָם
  choice: Dieu fait se lever les personnes dispersées afin qu’elles quittent le lieu où elles ont été vendues.
  alternative: Dieu les réveille intérieurement ou les mobilise militairement.
  rationale: Le verbe autorise plusieurs nuances d’éveil et de mise en mouvement. Le contexte spatial favorise l’idée d’une sortie effective, sans exiger une lecture psychologique ou militaire.
- issue: Portée de גְמֻלְכֶם בְּרֹאשְׁכֶם
  choice: La rétribution juste revient sur ceux qui ont commis le mal.
  alternative: Une simple annonce générale de punition, sans image de retour ni correspondance avec leurs actes.
  rationale: L’hébreu exprime la réciprocité morale au moyen d’une image concrète. La traduction maintient cette tension entre le traitement infligé et la rétribution reçue, sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » donne à l’annonce sa solennité ; « faire se lever » et « faire retomber sur votre tête » préservent les images hébraïques sans produire une formulation obscure ou archaïque.
