id: JOL.4.8
reference: Joel 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מָכַרְתִּ֞י אֶת בְּנֵי/כֶ֣ם וְ/אֶת בְּנֽוֹתֵי/כֶ֗ם בְּ/יַד֙ בְּנֵ֣י יְהוּדָ֔ה וּ/מְכָר֥וּ/ם לִ/שְׁבָאיִ֖ם אֶל גּ֣וֹי רָח֑וֹק כִּ֥י יְהוָ֖ה דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
translation:
  language: fr
  text: Je vendrai vos fils et vos filles entre les mains des fils de Juda, et ceux-ci les vendront aux Sabéens[a], à une nation lointaine[b], car Yahweh a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les Sabéens sont les habitants de Saba.
    reason: cultural_note
  - marker: b
    text: Ou « à un peuple lointain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָכַרְתִּי
  choice: Je vendrai
  rationale: Le qal de מכר signifie normalement « vendre ». Ce choix conserve l’image commerciale et le renversement judiciaire exprimés dans le passage, sans les atténuer.
- source_word: בְּנֵיכֶם ... בְּנוֹתֵיכֶם
  choice: vos fils et vos filles
  rationale: L’hébreu distingue explicitement les descendants masculins et féminins ; la traduction maintient cette distinction.
- source_word: בְּיַד
  choice: entre les mains de
  rationale: L’expression hébraïque signifie littéralement « dans la main de » et désigne le fait de placer quelqu’un au pouvoir d’un autre. « Entre les mains de » conserve l’image tout en étant idiomatique en français.
- source_word: בְּנֵי יְהוּדָה
  choice: les fils de Juda
  rationale: La formulation garde l’expression de parenté de l’hébreu. Dans ce contexte, elle désigne les membres du peuple de Juda.
- source_word: וּמְכָרוּם
  choice: et ceux-ci les vendront
  rationale: Le même verbe מכר est repris ; « vendront » maintient cette répétition. « Ceux-ci » indique clairement que le sujet est constitué des fils de Juda.
- source_word: לִשְׁבָאִים
  choice: aux Sabéens
  rationale: Le terme désigne les habitants de Saba. « Sabéens » est la désignation française précise de ce peuple.
- source_word: אֶל גּוֹי רָחוֹק
  choice: à une nation lointaine
  rationale: גּוֹי peut désigner une nation ou un peuple, et רָחוֹק signifie « lointain, éloigné ». La formulation retenue reste proche de l’hébreu et naturelle en français.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: car Yahweh a parlé
  rationale: La proposition fonde la certitude du jugement sur la parole divine. « A parlé » conserve la force solennelle de דִּבֵּר.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « vendre » et l’image des « mains » sont conservées afin de rendre le mouvement de rétribution du texte hébreu.
