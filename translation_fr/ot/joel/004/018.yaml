  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
translation:
  language: fr
  text: En ce jour-là, les montagnes distilleront du vin nouveau, les collines ruisselleront de lait, et l’eau coulera dans tous les lits de torrents de Juda. Une source jaillira de la maison de Yahweh et arrosera la vallée de Shittim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la vallée des Acacias » ou « l’oued des Acacias ».'
    reason: Le syntagme נַחַל הַשִּׁטִּים peut être compris comme un nom de lieu ou traduit selon son sens lexical lié aux acacias.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette formule française naturelle conserve l’introduction temporelle de la scène future sans reproduire lourdement l’hébraïsme « il arrivera en ce jour-là ».
- source_word: יִטְּפוּ
  choice: dégoutteront
  rationale: Le verbe évoque ce qui tombe goutte à goutte. « Dégoutteront » maintient l’image vive d’une abondance extraordinaire.
- source_word: עָסִיס
  choice: vin nouveau
  rationale: Le terme désigne le produit frais du raisin pressé, jus ou vin jeune. « Vin nouveau » préserve cette nuance sans trancher inutilement la question précise du degré de fermentation.
- source_word: תֵּלַכְנָה חָלָב
  choice: ruisselleront de lait
  rationale: Le verbe signifie littéralement « aller », mais décrit ici le mouvement abondant du lait. « Ruisselleront » convient aux collines et prolonge naturellement l’image poétique.
- source_word: אֲפִיקֵי יְהוּדָה
  choice: les lits des torrents de Juda
  rationale: אֲפִיקִים désigne des chenaux, ravins ou lits de cours d’eau, souvent temporairement secs. Cette expression est concrète et compréhensible en français international.
- source_word: יֵלְכוּ מָיִם
  choice: seront parcourus par les eaux
  rationale: L’hébreu dit littéralement que des eaux « iront » dans ces lits. La formulation française exprime clairement leur écoulement tout en conservant le pluriel מָיִם sous la forme idiomatique « les eaux ».
- source_word: מַעְיָן
  choice: une source
  rationale: Le nom désigne une source naturelle ou une fontaine jaillissante. « Source » est le terme moderne le plus direct.
- source_word: מִבֵּית יְהוָה
  choice: de la maison de Yahweh
  rationale: « Maison » conserve le terme hébreu et sa résonance cultuelle; traduire directement par « temple » rendrait explicite une identification seulement implicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וְהִשְׁקָה
  choice: arrosera
  rationale: Le hifil signifie « donner à boire » ou « irriguer ». « Arrosera » est concis, naturel et approprié au paysage décrit.
- source_word: נַחַל הַשִּׁטִּים
  choice: la vallée de Shittim
  rationale: נַחַל peut désigner une vallée torrentielle ou un oued, tandis que הַשִּׁטִּים peut être compris comme un toponyme lié aux acacias. Garder « Shittim » préserve cette identification probable et l’ambiguïté est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre, sans introduire une interprétation confessionnelle supplémentaire.
- issue: Interprétation de הַשִּׁטִּים comme toponyme ou nom commun
  choice: la vallée de Shittim
  alternative: la vallée des Acacias / l’oued des Acacias
  rationale: La forme peut renvoyer à un lieu connu, mais son rapport lexical avec les acacias reste perceptible. Le texte principal garde le toponyme probable et la note conserve l’autre lecture.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique accessible. Les images concrètes de l’hébreu sont conservées sans archaïsmes. Le marqueur [a] est placé après « Shittim », expression à laquelle la note se rapporte.
