  text: קִרְאוּ זֹאת֙ בַּ/גּוֹיִ֔ם קַדְּשׁ֖וּ מִלְחָמָ֑ה הָעִ֨ירוּ֙ הַ/גִּבּוֹרִ֔ים יִגְּשׁ֣וּ יַֽעֲל֔וּ כֹּ֖ל אַנְשֵׁ֥י הַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/009.yaml
  text: 'Proclaim this among the nations: Consecrate war; stir up the warriors[a]. Let all the men of war draw near; let them come up.'
translation:
  language: fr
  text: 'Proclamez ceci parmi les nations :


    « Consacrez la guerre[a] ! Réveillez les guerriers ! Qu’ils s’approchent, que tous les hommes de guerre montent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Préparez la guerre ». L’hébreu dit littéralement « Consacrez la guerre » et emploie le vocabulaire cultuel de la mise à part.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת בַּגּוֹיִם
  choice: Proclamez ceci parmi les nations
  rationale: קרא, à l’impératif pluriel, exprime ici une déclaration publique. « Proclamez » convient à la solennité de l’appel, tandis que « parmi les nations » rend naturellement la portée collective de בַּגּוֹיִם.
- source_word: קַדְּשׁוּ מִלְחָמָה
  choice: Consacrez la guerre
  rationale: La formulation conserve la force cultuelle de קדשׁ, « mettre à part, consacrer », sans réduire l’expression à la simple préparation militaire.
- source_word: הָעִירוּ הַגִּבּוֹרִים
  choice: Réveillez les guerriers
  rationale: Le hiphil de עור signifie faire se réveiller, éveiller ou pousser à l’action. « Réveillez » garde cette image, et « guerriers » exprime clairement le sens militaire de גִּבּוֹרִים.
- source_word: יִגְּשׁוּ
  choice: Que … s’approchent
  rationale: Le jussif appelle les combattants à venir au rassemblement. « S’approchent » restitue le mouvement vers le lieu convoqué sans ajouter de précision absente du texte.
- source_word: יַעֲלוּ
  choice: qu’ils montent
  rationale: La traduction maintient le sens directionnel de עלה, « monter », plutôt que de l’interpréter comme « avancer ».
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: tous les hommes de guerre
  rationale: Cette expression militaire est explicitement masculine en hébreu. La formulation française en préserve la teneur et le registre solennel.
theological_decisions:
- issue: Préserver la portée cultuelle de קדשׁ dans l’appel à la guerre
  choice: Consacrez la guerre
  alternative: Préparez-vous pour la guerre
  rationale: Dans ce contexte prophétique, קדשׁ peut fonctionner comme un appel à préparer la guerre, mais son vocabulaire de consécration demeure significatif. Le texte principal conserve cette tension, tandis que la note fournit le sens idiomatique possible.
translation_notes:
  register: Français moderne, solennel et directement compréhensible. Les impératifs brefs conservent le rythme martial de l’hébreu. Les guillemets signalent que le contenu de la proclamation suit immédiatement.
