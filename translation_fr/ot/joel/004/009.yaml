  terminology: « Proclamez », « nations », « guerriers », « hommes de guerre » et « monter » sont appropriés. « Consacrez la guerre » conserve volontairement la formulation cultuelle inhabituelle; la note doit proposer « Préparez la guerre » plutôt que la tournure réflexive « Préparez-vous », qui déplace l’objet de l’impératif.
