id: JOL.4.16
reference: Joel 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יהוָ֞ה מִ/צִּיּ֣וֹן יִשְׁאָ֗ג וּ/מִ/ירוּשָׁלִַ֨ם֙ יִתֵּ֣ן קוֹל֔/וֹ וְ/רָעֲשׁ֖וּ שָׁמַ֣יִם וָ/אָ֑רֶץ וַֽ/יהוָה֙ מַֽחֲסֶ֣ה לְ/עַמּ֔/וֹ וּ/מָע֖וֹז לִ/בְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
translation:
  language: fr
  text: 'Yahweh rugit depuis Sion,

    de Jérusalem il fait retentir sa voix[a] ;

    le ciel et la terre tremblent.

    Mais Yahweh est un refuge pour son peuple,

    une forteresse pour les fils d’Israël[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il donne sa voix » ; expression hébraïque désignant une voix puissante qui se fait entendre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, dans un français plus idiomatique : « les enfants d’Israël » ou « le peuple d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin, conformément à la forme du texte hébreu et à l’usage du projet.
- source_word: מִצִּיּוֹן
  choice: depuis Sion
  rationale: « Depuis » exprime naturellement en français le point d’où part le rugissement, tandis que « Sion » est la forme française consacrée du toponyme.
- source_word: יִשְׁאָג
  choice: rugit
  rationale: Le verbe שׁאג désigne le rugissement, notamment celui du lion ; « rugit » en conserve l’image vive.
- source_word: יִתֵּן קוֹלוֹ
  choice: fait retentir sa voix
  rationale: L’expression signifie littéralement « donne sa voix ». La formulation retenue restitue en français naturel l’idée d’une voix puissante qui se fait entendre, sans supprimer l’image de la voix.
- source_word: וְרָעֲשׁוּ
  choice: tremblent
  rationale: Le verbe exprime une violente secousse. « Tremblent » convient aux deux sujets cosmiques, le ciel et la terre.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: le ciel et la terre
  rationale: « Le ciel et la terre » est l’expression cosmique française naturelle ; le pluriel morphologique hébreu שׁמים ne requiert pas ici « les cieux ».
- source_word: מַחֲסֶה
  choice: un refuge
  rationale: Désigne un lieu où l’on se met à l’abri ; « refuge » conserve la nuance protectrice et le registre prophétique.
- source_word: לְעַמּוֹ
  choice: pour son peuple
  rationale: 'Le ל marque ici le bénéficiaire : Yahweh sert de refuge à son peuple.'
- source_word: מָעוֹז
  choice: une forteresse
  rationale: Le terme peut désigner un lieu fortifié ou une protection puissante. « Forteresse » forme un parallèle concret avec « refuge ».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: La traduction conserve la forme masculine בְּנֵי et l’expression nationale traditionnelle, tout en signalant en note sa portée collective.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. Sa transcription préserve le nom propre sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël / le peuple d’Israël
  rationale: « Fils » reproduit la forme hébraïque, tandis que la note indique que l’expression nationale peut collectivement désigner les Israélites.
translation_notes:
  register: Style poétique, actuel et digne. La disposition en lignes fait ressortir le parallélisme entre Sion et Jérusalem, puis entre refuge et forteresse. « Rugir » maintient la vigueur de l’image animale ; « fait retentir sa voix » évite le calque peu naturel « donne sa voix » tout en le documentant en note.
