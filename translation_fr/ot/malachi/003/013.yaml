source:
  edition: WLC
  text: חָזְק֥וּ עָלַ֛/י דִּבְרֵי/כֶ֖ם אָמַ֣ר יְהוָ֑ה וַ/אֲמַרְתֶּ֕ם מַה נִּדְבַּ֖רְנוּ עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
translation:
  language: fr
  text: 'Vos paroles ont été dures envers moi[a], dit Yahweh. Mais vous dites : « Qu’avons-nous dit contre toi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vos paroles ont été sévères envers moi ». L’hébreu dit littéralement qu’elles « ont été fortes » contre moi ; « fortes » qualifie ici des paroles vigoureuses, sévères ou hostiles.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזְקוּ
  choice: ont été dures
  rationale: Le verbe exprime littéralement la force; avec « paroles » pour sujet et עַל devant la personne visée, il qualifie ici des propos vigoureux, sévères ou hostiles. « Ont été dures » rend naturellement cet emploi idiomatique tout en conservant l’image.
- source_word: עָלַי / עָלֶיךָ
  choice: contre moi / contre toi
  rationale: Dans les deux propositions, עַל a une valeur adversative. La répétition de « contre » maintient le parallélisme accusatoire du texte hébreu.
- source_word: דִּבְרֵיכֶם
  choice: vos paroles
  rationale: Le pluriel construit avec suffixe de deuxième personne se rend directement et naturellement par « vos paroles ».
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: Le présent français convient à la formule prophétique et donne à l’énoncé son caractère actuel. Le nom divin est translittéré « Yahweh ».
- source_word: וַאֲמַרְתֶּם
  choice: Mais vous dites
  rationale: La conjonction introduit la réplique contradictoire du peuple; « mais » rend clairement le mouvement de la controverse.
- source_word: מַה נִּדְבַּרְנוּ
  choice: Qu’avons-nous dit
  rationale: Cette formulation idiomatique exprime la demande portant sur le contenu des propos reprochés, sans alourdir le français par « qu’avons-nous prononcé » ou « de quoi avons-nous parlé ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme de « contre moi / contre toi » ainsi que la dynamique de contestation propre au livre de Malachie.
