  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
translation:
  language: fr
  text: 'Un être humain peut-il voler Dieu ? Pourtant, vous me volez ! Mais vous dites : « En quoi t’avons-nous volé ? » Dans la dîme et la contribution sacrée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’offrande ». Le terme hébreu désigne une contribution mise à part pour un usage sacré.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  choice: voler / volez / volé
  rationale: Dans ce contexte, le verbe rare קבע désigne le fait de priver Dieu de ce qui lui revient. « Voler » conserve la force et le caractère saisissant de l’accusation, sans suggérer la violence de « piller ».
- source_word: אָדָם
  choice: un être humain
  rationale: 'אָדָם a ici une valeur générique : la question porte sur tout humain, non sur un homme en particulier. « Un être humain » exprime directement ce sens en français moderne.'
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le terme désigne ici le Dieu d’Israël et se rend naturellement par « Dieu ».
- source_word: כִּי
  choice: pourtant
  rationale: 'Dans l’enchaînement rhétorique, כִּי introduit le fait surprenant qui contraste avec la question précédente : malgré l’inconcevable, les destinataires volent effectivement Dieu.'
- source_word: בַּמֶּה
  choice: en quoi
  rationale: La formule demande sous quel rapport l’accusation est fondée. « En quoi » est idiomatique et permet à la réponse elliptique hébraïque de garder sa force.
- source_word: הַמַּעֲשֵׂר
  choice: la dîme
  rationale: מַעֲשֵׂר est le terme établi pour le dixième dû à Dieu. Le singulier défini hébreu peut avoir une valeur collective.
- source_word: הַתְּרוּמָה
  choice: la contribution sacrée
  rationale: תְּרוּמָה désigne une part prélevée et mise à part pour l’usage sacré. « Contribution sacrée » est plus précis que le terme général « offrande » et évite le technicisme historique « offrande élevée ».
theological_decisions:
- issue: Valeur générique de אָדָם
  choice: Un être humain peut-il voler Dieu ?
  alternative: Un homme peut-il voler Dieu ?
  rationale: Le nom singulier אָדָם est générique dans cette question proverbiale. « Un être humain » évite en français moderne une lecture exclusivement masculine sans élargir le sens du texte.
- issue: Force de כִּי après la question rhétorique
  choice: Pourtant, vous me volez !
  alternative: Car vous me volez.
  rationale: Le lien peut être rendu de manière explicative par « car », mais le contexte met surtout en relief le contraste saisissant entre la question et la conduite réelle du peuple. « Pourtant » préserve cette tension rhétorique.
translation_notes:
  register: Français international moderne, direct et solennel. Le dialogue accusatoire et la réponse elliptique finale sont conservés. Le tutoiement envers Dieu suit le passage du « vous » collectif adressé au peuple au « me/t’ » singulier dans les paroles rapportées.
