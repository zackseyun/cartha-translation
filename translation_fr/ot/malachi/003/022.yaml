  text: זִכְר֕וּ תּוֹרַ֖ת מֹשֶׁ֣ה עַבְדִּ֑/י אֲשֶׁר֩ צִוִּ֨יתִי אוֹת֤/וֹ בְ/חֹרֵב֙ עַל כָּל יִשְׂרָאֵ֔ל חֻקִּ֖ים וּ/מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
translation:
  language: fr
  text: 'Souvenez-vous de la loi[a] de Moïse, mon serviteur, que je lui ai prescrite à l’Horeb[b] pour tout Israël : des prescriptions et des règles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’enseignement de Moïse, mon serviteur ».
    reason: lexical_alternative
  - marker: b
    text: L’Horeb est un autre nom du Sinaï, la montagne où Dieu a donné à Israël la loi de l’alliance par l’intermédiaire de Moïse.
    reason: cultural_note
  - marker: c
    text: Ou « des décrets et des décisions de justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Souvenez-vous
  rationale: Impératif pluriel de זכר, qui appelle l’ensemble des destinataires à garder activement en mémoire les exigences de l’alliance.
- source_word: תּוֹרַת
  choice: la loi
  rationale: Bien que תּוֹרָה puisse signifier « enseignement » ou « instruction », la mention de Moïse, de l’Horeb et des prescriptions données à Israël indique ici la Loi mosaïque dans son cadre d’alliance.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce titre honorifique appliqué à Moïse, עבד souligne sa fonction au service de Dieu plutôt qu’une condition servile.
- source_word: אֲשֶׁר צִוִּיתִי אֹתוֹ
  choice: que je lui ai prescrite
  rationale: Le pronom suffixe désigne Moïse, destinataire et médiateur de la Torah. « Prescrire » rend la force normative de צוה tout en restant idiomatique avec « loi ».
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: La préposition ב est locative; « à l’Horeb » est la tournure française naturelle pour le lieu où la loi fut donnée.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: pour tout Israël
  rationale: 'עַל indique ici la portée ou les destinataires de la prescription : elle concerne l’ensemble d’Israël.'
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: des prescriptions et des règles
  rationale: 'Le couple conserve deux catégories juridiques distinctes : חֻקִּים désigne des dispositions prescrites, tandis que מִשְׁפָּטִים désigne des règles ou décisions de droit.'
theological_decisions:
- issue: Sens de תּוֹרָה dans le cadre de l’alliance
  choice: la loi
  alternative: l’enseignement
  rationale: Le contexte explicite de Moïse, de l’Horeb et des dispositions destinées à Israël justifie le sens juridico-alliantiel, sans nier la dimension pédagogique du terme.
- issue: Titre עבד appliqué à Moïse
  choice: mon serviteur
  alternative: mon esclave
  rationale: Il s’agit ici d’un titre honorifique exprimant le service mandaté de Moïse auprès de Dieu; « esclave » mettrait au premier plan une nuance sociale qui n’est pas déterminante dans ce contexte.
- issue: Relation de la loi à Israël
  choice: pour tout Israël
  alternative: concernant tout Israël
  rationale: La formulation retenue exprime naturellement que les prescriptions ont été données à l’ensemble du peuple, sans trancher plus étroitement la nuance possible de עַל.
translation_notes:
  register: Français international moderne, digne et accessible. « L’Horeb » suit l’usage biblique français courant. La ponctuation par deux-points présente « prescriptions et règles » comme une apposition explicative de la loi, conformément à la syntaxe hébraïque.
