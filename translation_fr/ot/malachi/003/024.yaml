  text: וְ/הֵשִׁ֤יב לֵב אָבוֹת֙ עַל בָּנִ֔ים וְ/לֵ֥ב בָּנִ֖ים עַל אֲבוֹתָ֑/ם פֶּן אָב֕וֹא וְ/הִכֵּיתִ֥י אֶת הָ/אָ֖רֶץ חֵֽרֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/024.yaml
  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
translation:
  language: fr
  text: Il ramènera le cœur des pères vers leurs enfants et le cœur des enfants vers leurs pères, de peur que je ne vienne frapper le pays en le vouant à la destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en le frappant d’interdit » ou « en le détruisant entièrement » ; traditionnellement : « en le frappant de malédiction ». Le terme hébreu désigne ce qui est placé sous interdit et voué à la destruction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: Il ramènera
  rationale: Le hiphil de שׁוב exprime ici le fait de ramener ou de réorienter. « Ramènera » conserve l’image d’un retour relationnel sans préciser indûment son mécanisme.
- source_word: לֵב
  choice: le cœur
  rationale: Le singulier collectif hébreu désigne l’être intérieur, notamment la volonté et les dispositions. Le français naturel garde ici le singulier dans « le cœur des pères ».
- source_word: אָבוֹת
  choice: les pères
  rationale: Le terme est un pluriel masculin précis. Dans le parallélisme avec les enfants, il évoque surtout les relations entre générations plutôt que les ancêtres au sens large.
- source_word: עַל
  choice: vers
  rationale: Dans cette construction relationnelle, la préposition indique l’orientation. « Vers » rend naturellement le mouvement du cœur sans effacer l’image hébraïque.
- source_word: בָּנִים
  choice: leurs enfants / les enfants
  rationale: בנים peut désigner les fils ou, de manière générique, les enfants. « Enfants » convient au rapport familial représentatif et n’en limite pas la portée aux seuls garçons.
- source_word: אֲבוֹתָם
  choice: leurs pères
  rationale: Le suffixe possessif impose « leurs ». Le parallèle avec le premier membre favorise « pères » plutôt que « ancêtres ».
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure introduit avec dignité et naturel la conséquence redoutée exprimée par l’hébreu.
- source_word: אָבוֹא
  choice: je ne vienne
  rationale: Après « de peur que », le subjonctif est requis en français. Le « ne » est explétif et ne nie pas la venue annoncée.
- source_word: וְהִכֵּיתִי
  choice: frapper
  rationale: Le verbe exprime l’action judiciaire menaçante. « Frapper » est clair, actuel et conserve la force de l’image.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte prophétique et communautaire, אֶרֶץ désigne vraisemblablement le territoire concerné par le jugement. « Le pays » est plus naturel ici que « la terre », qui pourrait suggérer le monde entier.
- source_word: חֵרֶם
  choice: en le vouant à la destruction
  rationale: חֵרֶם désigne ce qui est placé sous interdit et voué à la destruction. Cette formulation communique l’acte de consécration judiciaire destructrice plus clairement qu’un calque nominal, sans le réduire à une simple malédiction.
theological_decisions:
- issue: Sens de חֵרֶם à la conclusion du livre
  choice: en le vouant à la destruction
  alternative: en le frappant d’interdit ; en le détruisant entièrement ; en le frappant de malédiction
  rationale: 'Le terme hébreu n’est pas le mot ordinaire pour « malédiction » : il désigne ce qui est mis sous interdit et voué à la destruction dans le cadre du jugement divin. La traduction retenue garde cette portée tout en restant intelligible, et la note préserve les principaux équivalents traditionnels ou plus littéraux.'
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme hébreu est conservé. « De peur que je ne vienne » maintient le ton solennel ; le « ne » y est explétif. La note explicite le terme culturellement et théologiquement chargé חֵרֶם.
