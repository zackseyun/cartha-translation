  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הַ/יּוֹם֙ בָּ֔א בֹּעֵ֖ר כַּ/תַּנּ֑וּר וְ/הָי֨וּ כָל זֵדִ֜ים וְ/כָל עֹשֵׂ֤ה רִשְׁעָה֙ קַ֔שׁ וְ/לִהַ֨ט אֹתָ֜/ם הַ/יּ֣וֹם הַ/בָּ֗א אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֛ר לֹא יַעֲזֹ֥ב לָ/הֶ֖ם שֹׁ֥רֶשׁ וְ/עָנָֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
translation:
  language: fr
  text: 'Car voici : le jour vient, brûlant comme un four[a]. Tous les arrogants[b] et tous ceux qui commettent le mal seront du chaume. Le jour qui vient les embrasera, dit Yahweh des armées[c], et il ne leur laissera ni racine ni branche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fournaise ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les présomptueux ».
    reason: lexical_alternative
  - marker: c
    text: Le titre hébreu signifie littéralement « Yahweh des armées »; il est traditionnellement rendu par « le SEIGNEUR des armées » ou « le SEIGNEUR des puissances ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי relie l’annonce à ce qui précède, tandis que הִנֵּה attire solennellement l’attention sur son imminence. « Car voici » conserve ces deux fonctions dans un français soutenu mais accessible.
- source_word: הַיּוֹם בָּא
  choice: le jour vient
  rationale: Le participe בָּא présente le jour comme en approche. Le présent français rend directement cette imminence sans ajouter « bientôt », absent du texte.
- source_word: בֹּעֵר כַּתַּנּוּר
  choice: brûlant comme un four
  rationale: תַּנּוּר désigne d’abord un four. L’expression décrit le jour lui-même comme brûlant et maintient l’image concrète de la chaleur intense.
- source_word: זֵדִים
  choice: les arrogants
  rationale: Le terme vise des personnes orgueilleuses, insolentes ou présomptueuses. « Arrogants » exprime clairement cette attitude morale en français moderne.
- source_word: כָל עֹשֵׂה רִשְׁעָה
  choice: tous ceux qui commettent le mal
  rationale: Le participe singulier à valeur distributive désigne toute personne qui pratique la méchanceté. La formulation française conserve cette portée générale.
- source_word: קַשׁ
  choice: du chaume
  rationale: קַשׁ désigne les tiges sèches ou résidus de récolte, facilement inflammables. « Chaume » préserve cette image agricole plus précisément que « balle ».
- source_word: וְלִהַט אֹתָם
  choice: les embrasera
  rationale: Le verbe évoque l’action de mettre en flammes. « Embrasera » conserve l’image sans anticiper à lui seul l’anéantissement total exprimé ensuite.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » rend le nom divin יְהוָה, et « des armées » traduit de façon transparente צְבָאוֹת tout en conservant la force du titre.
- source_word: אֲשֶׁר לֹא יַעֲזֹב לָהֶם
  choice: et il ne leur laissera
  rationale: La proposition relative décrit le résultat produit par le jour qui vient. Le pronom « il » reprend naturellement « le jour » et la négation reste explicite.
- source_word: שֹׁרֶשׁ וְעָנָף
  choice: ni racine ni branche
  rationale: Cette paire forme une image englobante de suppression totale. La tournure « ni… ni… » est idiomatique et conserve les deux éléments de la métaphore.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le rend comme nom d’alliance sans le remplacer par un titre.
- issue: Degré d’interprétation de l’image du jugement
  choice: Conserver la progression « embrasera » puis « ne laissera ni racine ni branche »
  alternative: les consumera entièrement
  rationale: Le verset déploie successivement l’incendie puis son résultat total. Garder les deux étapes respecte l’imagerie et évite de la réduire à une paraphrase doctrinale.
- issue: Portée de « racine et branche »
  choice: Maintenir l’image sans en expliciter le référent
  alternative: ne laissera aucun survivant ni descendant
  rationale: La formule suggère une élimination complète, mais le texte ne précise pas lui-même si chaque élément représente des survivants, des descendants ou simplement la totalité. La traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et prophétique. La syntaxe reste directe et intelligible; « voici » garde la solennité de l’annonce, tandis que « chaume », « embrasera » et « ni racine ni branche » préservent les images concrètes de l’hébreu.
