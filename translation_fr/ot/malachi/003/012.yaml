id: MAL.3.12
reference: Malachi 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
translation:
  language: fr
  text: Alors toutes les nations vous diront heureux, car vous serez une terre désirable[a], dit Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une terre de délices » ou « une terre agréable ».
    reason: Alternative lexicale pour אֶרֶץ חֵפֶץ, qui peut désigner une terre plaisante ou désirable.
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  choice: vous diront heureux
  rationale: Le piel de אשר signifie déclarer ou considérer quelqu’un comme heureux. « Vous diront heureux » est naturel en français et conserve l’idée d’une reconnaissance publique.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici collectivement les nations environnantes, sans imposer le sens technique plus tardif de « païens ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle les nations déclareront le peuple heureux.
- source_word: תִהְיוּ אַתֶּם
  choice: vous serez
  rationale: Le futur de היה est rendu directement; le pronom explicite אַתֶּם souligne les destinataires, emphase que le pronom français exprime suffisamment dans ce contexte.
- source_word: אֶרֶץ חֵפֶץ
  choice: un pays de délices
  rationale: La construction signifie littéralement « pays de plaisir, de délice ou de désir ». Cette formulation concise préserve la possibilité que le pays soit à la fois agréable et désirable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Le pluriel צְבָאוֹת évoque les armées ou troupes placées sous l’autorité de Yahweh. « Des armées » est clair en français moderne et évite l’archaïsme « des armées célestes » lorsqu’il n’est pas explicité par le texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: des puissances célestes
  rationale: Le terme peut englober des troupes terrestres ou célestes. Le rendu retenu conserve cette ampleur sans limiter le référent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant naturelle; « pays de délices » conserve la densité poétique de l’expression source.
