id: MAL.3.23
reference: Malachi 3:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֤ה אָֽנֹכִי֙ שֹׁלֵ֣חַ לָ/כֶ֔ם אֵ֖ת אֵלִיָּ֣ה הַ/נָּבִ֑יא לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
translation:
  language: fr
  text: Voici que je vous envoie le prophète Élie[a] avant que ne vienne le grand et redoutable jour de Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit simplement « Élie le prophète ». Il peut être compris comme désignant Élie lui-même ou un précurseur semblable à lui.
    reason: cross_reference
  - marker: b
    text: 'Ou : « le grand et terrible jour de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Introduit avec emphase l’annonce divine dans un français actuel et digne, sans recourir à l’archaïque « Voici, moi ».
- source_word: אָֽנֹכִי שֹׁלֵחַ
  choice: je vous envoie
  rationale: Le pronom indépendant souligne le sujet divin et le participe présente l’action future avec vivacité. Le présent français rend naturellement cette imminence prophétique.
- source_word: לָכֶם
  choice: vous
  rationale: Le datif désigne les destinataires de l’envoi et s’intègre naturellement au verbe « envoyer ».
- source_word: אֵלִיָּה הַנָּבִיא
  choice: le prophète Élie
  rationale: Rend directement le nom et le titre apposé; cet ordre est idiomatique en français et n’ajoute aucune identification interprétative.
- source_word: לִפְנֵי בּוֹא
  choice: avant que vienne
  rationale: Exprime clairement l’antériorité temporelle et conserve la solennité de la formulation hébraïque dans une syntaxe française naturelle.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahvé
  rationale: Conserve l’expression prophétique et rend explicitement le nom divin יהוה par « Yahvé ».
- source_word: הַגָּדוֹל
  choice: grand
  rationale: Rend simplement l’ampleur et l’importance du jour annoncé.
- source_word: וְהַנּוֹרָא
  choice: redoutable
  rationale: Le terme désigne ce qui inspire crainte et effroi. « Redoutable » garde cette force menaçante sans l’ambiguïté positive que peut avoir « impressionnant ».
theological_decisions:
- issue: Référent d’Élie
  choice: Conserver simplement « le prophète Élie » dans le texte.
  alternative: Préciser qu’il s’agit d’un précurseur semblable à Élie ou agissant dans son esprit.
  rationale: L’hébreu nomme directement Élie sans expliquer comment la promesse doit s’accomplir. La traduction préserve cette ouverture interprétative.
- issue: Portée de הַגָּדוֹל וְהַנּוֹרָא
  choice: « ce jour grand et redoutable »
  alternative: « le jour grand et terrible » ou « le grand et impressionnant jour »
  rationale: La formulation retenue maintient ensemble la grandeur et la crainte liées au jour de Yahvé. « Redoutable » est naturel et garde la dimension de jugement.
- issue: Rapport entre « le jour de Yahvé » et les adjectifs
  choice: Reprise par « ce jour »
  alternative: « le grand et redoutable jour de Yahvé »
  rationale: La reprise produit un français fluide tout en rattachant sans ambiguïté les deux adjectifs au jour de Yahvé.
translation_notes:
  register: Français international moderne, accessible et solennel. « Voici que » marque l’annonce emphatique; « avant que vienne » maintient une cadence prophétique naturelle. Les notes conservent l’ambiguïté sur Élie et la gamme de sens de נורא.
