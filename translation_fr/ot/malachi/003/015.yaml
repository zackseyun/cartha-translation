source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֲנַ֖חְנוּ מְאַשְּׁרִ֣ים זֵדִ֑ים גַּם נִבְנוּ֙ עֹשֵׂ֣י רִשְׁעָ֔ה גַּ֧ם בָּחֲנ֛וּ אֱלֹהִ֖ים וַ/יִּמָּלֵֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
translation:
  language: fr
  text: « Et maintenant, nous déclarons heureux les arrogants[a] ; de plus, ceux qui font le mal prospèrent[b] ; ils mettent même Dieu à l’épreuve[c] et s’en tirent. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les orgueilleux » ou « les présomptueux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sont bâtis » ; c’est-à-dire qu’ils sont affermis, établis ou qu’ils prospèrent.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « testent Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit la conclusion présente tirée de la plainte précédente. En français, « Maintenant » exprime naturellement cette progression sans alourdir la phrase.
- source_word: מְאַשְּׁרִים
  choice: nous déclarons heureux
  rationale: Le verbe désigne ici le fait de proclamer ou de considérer quelqu’un comme heureux ou favorisé. « Déclarons heureux » conserve cet acte d’évaluation.
- source_word: זֵדִים
  choice: les arrogants
  rationale: Le terme vise des personnes orgueilleuses et présomptueuses. « Les arrogants » est actuel, clair et moralement précis.
- source_word: נִבְנוּ
  choice: prospèrent
  rationale: 'Le passif de « bâtir » fonctionne métaphoriquement : ces personnes sont affermies, établies ou rendues prospères. « Prospèrent » transmet clairement le sens contextuel, tandis qu’une note conserve l’image littérale.'
- source_word: עֹשֵׂי רִשְׁעָה
  choice: ceux qui font le mal
  rationale: Rend directement la construction participiale et souligne une pratique habituelle du mal sans employer une expression vieillie.
- source_word: גַּם
  choice: même
  rationale: 'Dans la dernière proposition, la particule ajoute un élément culminant à la plainte : malgré leur défi envers Dieu, ces gens échappent aux conséquences attendues. Le premier גַּם est rendu par la progression syntaxique après les deux-points, plutôt que par un « même » français peu naturel.'
- source_word: בָּחֲנוּ אֱלֹהִים
  choice: ils mettent Dieu à l’épreuve
  rationale: Exprime ici non une enquête neutre, mais un défi présomptueux lancé à Dieu, tout en restant proche du sens de « tester ».
- source_word: וַיִּמָּלֵטוּ
  choice: ils s’en tirent
  rationale: Le nifal signifie qu’ils échappent ou s’en sortent. Cette formulation idiomatique française laisse implicite, comme l’hébreu, ce à quoi ils échappent.
theological_decisions:
- issue: Sens de אֱלֹהִים dans ce contexte
  choice: Dieu
  alternative: dieu / les dieux
  rationale: Le contexte du livre et la plainte adressée au Dieu d’Israël indiquent ici le titre singulier « Dieu », non une référence générique ou plurielle.
- issue: Nature de la mise à l’épreuve de Dieu
  choice: mettent Dieu à l’épreuve
  alternative: testent Dieu
  rationale: Cette tournure conserve l’idée de בחן tout en faisant entendre le défi présomptueux du contexte, sans préciser davantage la forme de ce défi.
- issue: Objet implicite de l’évasion
  choice: ils s’en tirent
  alternative: ils échappent au châtiment
  rationale: L’hébreu ne nomme pas explicitement le châtiment. La traduction maintient cette ellipse et évite d’expliciter théologiquement ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le ton amer de la plainte rapportée. Le parallélisme hébreu est légèrement réorganisé pour une lecture française fluide, sans résoudre l’ellipse finale ni effacer la métaphore de « bâtir », conservée en note.
