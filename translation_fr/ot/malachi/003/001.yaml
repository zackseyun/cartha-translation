source:
  edition: WLC
  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
translation:
  language: fr
  text: Voici, j’envoie mon messager[a], et il préparera le chemin devant moi. Soudain, le Seigneur que vous cherchez viendra dans son temple, le messager de l’alliance en qui vous prenez plaisir. Voici, il vient, dit Yahvé des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon ange » ; le mot hébreu מַלְאָךְ peut signifier « messager » ou « ange ». Il en va de même pour « le messager de l’alliance » dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי שֹׁלֵחַ
  choice: Voici, j’envoie
  rationale: La particule déictique avec le pronom et le participe exprime une annonce solennelle ainsi qu’une action imminente ou certaine. « Voici, j’envoie » en conserve la vivacité prophétique.
- source_word: מַלְאָכִי
  choice: mon messager
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste. « Messager » conserve cette amplitude et convient à la fonction de celui qui prépare le chemin; « ange » est signalé en note.
- source_word: וּפִנָּה דֶרֶךְ לְפָנָי
  choice: et il préparera le chemin devant moi
  rationale: Dans cette forme, פנה évoque l’action de dégager ou de préparer une voie. La formulation française naturelle « préparer le chemin » garde l’image sans préciser indûment la manière.
- source_word: וּפִתְאֹם
  choice: Soudain
  rationale: L’adverbe marque le caractère brusque ou inattendu de la venue.
- source_word: יָבֹוא אֶל־הֵיכָלוֹ
  choice: viendra dans son temple
  rationale: Dans le contexte cultuel de Malachie, הֵיכָל désigne le temple. « Dans » rend naturellement en français le mouvement vers l’intérieur exprimé ici.
- source_word: הָאָדוֹן
  choice: le Seigneur
  rationale: Le nom avec l’article fonctionne comme un titre élevé. « Le Seigneur » en préserve la force, sans identifier plus explicitement le personnage que ne le fait l’hébreu.
- source_word: אֲשֶׁר אַתֶּם מְבַקְשִׁים
  choice: que vous cherchez
  rationale: Le participe décrit une recherche ou une attente persistante; le présent français l’exprime naturellement.
- source_word: וּמַלְאַךְ הַבְּרִית
  choice: Le messager de l’alliance
  rationale: La traduction reprend le même choix lexical pour מַלְאָךְ et maintient la détermination de « l’alliance ».
- source_word: אֲשֶׁר אַתֶּם חֲפֵצִים
  choice: celui en qui vous prenez plaisir
  rationale: חפץ exprime le plaisir, l’agrément ou le désir. Cette formulation conserve la nuance relationnelle et le complément personnel implicite.
- source_word: הִנֵּה בָא
  choice: voici qu’il vient
  rationale: La particule et le participe présentent la venue comme imminente et certaine. « Voici qu’il vient » garde la vigueur de l’annonce.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le Seigneur des armées
  rationale: Cette formulation rend le nom divin יהוה par « Yahvé » et explicite naturellement en français le titre צְבָאוֹת comme « le Seigneur des armées », tout en signalant la tournure traditionnelle en note.
theological_decisions:
- issue: Rapport d’identité entre « le Seigneur » et « le messager de l’alliance »
  choice: Présenter successivement les deux titres sans déclarer explicitement s’ils désignent un seul personnage ou deux.
  alternative: Comprendre les deux titres comme désignant la même figure, ou distinguer le messager du Seigneur.
  rationale: La syntaxe hébraïque permet une étroite identification, mais la traduction ne doit pas trancher une question que le verset laisse ouverte.
- issue: Portée du titre הָאָדוֹן dans un passage souvent lu de manière messianique
  choice: le Seigneur
  alternative: le maître
  rationale: « Le Seigneur » garde la dignité et la portée du titre hébreu sans introduire une identification christologique plus explicite que le texte source.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient le ton solennel de l’annonce prophétique. La ponctuation sépare les deux désignations de la figure attendue sans résoudre leur rapport syntaxique ou théologique.
