source:
  edition: WLC
  text: וְ/עָֽרְבָה֙ לַֽ/יהוָ֔ה מִנְחַ֥ת יְהוּדָ֖ה וִ/ירֽוּשָׁלִָ֑ם כִּ/ימֵ֣י עוֹלָ֔ם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/004.yaml
  text: Then the offering of Judah and Jerusalem will be pleasing to Yahweh[b][a], as in the days of old and as in former years.
translation:
  language: fr
  text: Alors, l’offrande[b] de Juda et de Jérusalem sera agréable[a] à Yahweh, comme aux jours anciens et comme aux années d’autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera acceptée ».
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « offrande » peut désigner plus précisément une offrande végétale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְבָה
  choice: Alors, … sera agréable
  rationale: Le verbe ערב signifie ici « être agréable, être accepté ». Le futur ressort du contexte prophétique, et « Alors » exprime la conséquence ou la succession marquée par וְ.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique la personne à qui l’offrande plaît; le nom divin יהוה est rendu par « Yahweh ».
- source_word: מִנְחַת
  choice: l’offrande
  rationale: מִנְחָה peut désigner plus précisément une offrande végétale, mais aussi une offrande ou un don cultuel; le terme général préserve ici cette latitude.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: de Juda et de Jérusalem
  rationale: Emploi des formes françaises usuelles de ces noms géographiques.
- source_word: כִּימֵי עוֹלָם
  choice: comme aux jours d’autrefois
  rationale: עוֹלָם renvoie ici à un passé ancien plutôt qu’à l’éternité; la formulation conserve l’image des « jours ».
- source_word: וּכְשָׁנִים קַדְמֹנִיּוֹת
  choice: comme dans les années anciennes
  rationale: Cette formulation garde le parallélisme temporel avec le membre précédent tout en restant naturelle en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » rend le nom propre sans le remplacer par un titre.
- issue: Degré de précision de מִנְחָה
  choice: offrande
  alternative: offrande végétale
  rationale: Le mot peut avoir le sens cultuel précis d’offrande végétale, mais le contexte immédiat permet le sens plus général; une note conserve l’autre possibilité sans surdéterminer le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique des deux indications temporelles est conservé sans archaïsme marqué.
