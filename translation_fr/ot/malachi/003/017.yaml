revisions:
- from: 'Ils seront à moi, dit Yahweh, le maître des armées[a], au jour que je prépare : ils seront mon bien précieux[b]. Je les épargnerai comme un homme épargne son fils qui le sert.'
  to: Ils seront à moi, dit Yahweh des armées, au jour où je ferai d’eux ma possession précieuse. Je les épargnerai comme un homme épargne son fils qui le sert.
  rationale: 'La révision corrige le rendu de עשה et restitue le titre divin dans sa construction hébraïque. Elle explicite « d’eux », sous-entendu par le contexte et adopté par la traduction anglaise auditée, afin d’obtenir une phrase française complète. Cette explicitation ne modifie pas le sens : les personnes qui craignent Yahweh sont sa possession précieuse au jour de son action. Les deux occurrences de חמל restent rendues par « épargner ».'
  reviewer_model: gpt-5.6-terra
