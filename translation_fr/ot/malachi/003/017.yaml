  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
translation:
  language: fr
  text: Ils seront à moi, dit Yahweh des armées, au jour où je ferai d’eux ma possession précieuse. Je les épargnerai comme un homme épargne son fils qui le sert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ לִי
  choice: Ils seront à moi
  rationale: Rend directement l’appartenance future et conserve la force relationnelle de l’hébreu.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  rationale: Conserve le nom divin et rend צְבָאוֹת de manière intelligible; la formulation française évite l’expression peu naturelle « Yahweh des armées ».
- source_word: לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: au jour que je prépare
  rationale: Littéralement, la construction évoque « le jour que je fais ». « Le jour que je prépare » exprime naturellement un jour déterminé et amené par l’action divine, sans ajouter comme objet « eux », absent du texte hébreu.
- source_word: סְגֻלָּה
  choice: mon bien précieux
  rationale: Désigne une possession particulièrement estimée, souvent associée au roi ou au maître; « mon » découle de « ils seront à moi », tandis que « bien précieux » reste naturel et digne en français.
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  choice: Je les épargnerai
  rationale: Dans ce contexte de jugement, חמל indique la retenue qui consiste à ne pas frapper, tout en gardant une nuance de compassion.
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ עַל בְּנוֹ
  choice: comme un homme épargne son fils
  rationale: Préserve la répétition de חמל ainsi que l’image explicitement masculine du père et du fils.
- source_word: הָעֹבֵד אֹתוֹ
  choice: qui le sert
  rationale: Rend simplement le participe et conserve la relation de service envers le père.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » conserve ici le nom d’alliance sans le remplacer par un titre.
- issue: Relation syntaxique de אֲנִי עֹשֶׂה et סְגֻלָּה
  choice: 'au jour que je prépare : ils seront mon bien précieux'
  alternative: au jour où je ferai d’eux mon bien précieux
  rationale: L’hébreu est elliptique et peut rattacher סְגֻלָּה soit à l’idée du jour que Dieu fait, soit à ce que Dieu constitue comme possession. Le deux-points garde l’enchaînement tout en évitant d’insérer explicitement « d’eux », absent du texte.
- issue: Sens de חמל
  choice: épargner
  alternative: avoir compassion de
  rationale: La scène suppose que Dieu retient le jugement; « épargner » convient aux deux occurrences et maintient leur correspondance, sans effacer la compassion sous-jacente.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation explicite l’ellipse hébraïque sans supprimer son ouverture syntaxique. L’image d’un homme et de son fils est conservée, de même que la répétition du verbe « épargner ».
