source:
  edition: WLC
  text: וְ/שַׁבְתֶּם֙ וּ/רְאִיתֶ֔ם בֵּ֥ין צַדִּ֖יק לְ/רָשָׁ֑ע בֵּ֚ין עֹבֵ֣ד אֱלֹהִ֔ים לַ/אֲשֶׁ֖ר לֹ֥א עֲבָדֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/018.yaml
  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
translation:
  language: fr
  text: Alors, vous verrez de nouveau la différence entre le juste et le méchant[a], entre celui qui sert Dieu et celui qui ne le sert pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Alors, vous reviendrez et vous verrez entre le juste et le méchant. » L’expression hébraïque signifie vraisemblablement qu’ils percevront de nouveau la distinction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  choice: Alors, vous verrez de nouveau
  rationale: Le verbe שׁוב signifie littéralement « revenir » ou « retourner ». Associé ici à « voir », il exprime vraisemblablement une perception renouvelée; « de nouveau » rend naturellement cette valeur en français.
- source_word: וּרְאִיתֶם
  choice: vous verrez
  rationale: ראה signifie couramment « voir ». Le futur français convient au contexte et conserve l'image concrète tout en permettant le sens de reconnaître une distinction.
- source_word: בֵּין ... לְ
  choice: la différence entre
  rationale: La répétition de בֵּין marque un contraste. « Voir la différence entre » explicite avec naturel en français la relation comparative impliquée par l'hébreu.
- source_word: צַדִּיק
  choice: le juste
  rationale: צַדִּיק désigne une personne juste ou droite. « Le juste » est une catégorie morale traditionnelle, claire et concise en français.
- source_word: רָשָׁע
  choice: le méchant
  rationale: רָשָׁע est l'antonyme courant de צַדִּיק dans les textes sapientiaux et prophétiques. « Le méchant » préserve ce contraste moral sans le réduire au seul sens juridique de « coupable ».
- source_word: עֹבֵד אֱלֹהִים
  choice: celui qui sert Dieu
  rationale: עבד employé avec Dieu désigne le service qui comprend fidélité, obéissance et culte. « Sert Dieu » conserve cette amplitude sémantique.
- source_word: לַאֲשֶׁר לֹא עֲבָדוֹ
  choice: celui qui ne le sert pas
  rationale: La proposition relative forme un contraste direct avec celui qui sert Dieu, et le suffixe renvoie à Dieu. Le présent français exprime naturellement l'opposition entre deux catégories, sans imposer à l'accompli hébreu une portée temporelle trop étroite.
theological_decisions:
- issue: Faut-il rendre le contraste explicitement eschatologique ou le laisser comme une perception renouvelée ?
  choice: Présenter une reconnaissance future de la différence entre le juste et le méchant, sans ajouter de mention explicite du jugement final.
  alternative: Ajouter une formulation telle que « lors du jugement, vous distinguerez de nouveau ».
  rationale: Le contexte immédiat évoque l'intervention et la justification opérées par Dieu, mais ce verset dit seulement que les destinataires verront de nouveau la différence. La traduction n'ajoute donc aucun détail doctrinal absent de l'hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les catégories morales et théologiques de l'hébreu, tout en rendant explicitement en français la différence impliquée par la construction répétée avec « entre ».
