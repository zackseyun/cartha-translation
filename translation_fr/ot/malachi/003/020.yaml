  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
translation:
  language: fr
  text: Mais pour vous qui craignez mon nom, le soleil de justice[a] se lèvera, apportant la guérison dans ses ailes[b]. Vous sortirez et bondirez[c] comme des veaux hors de l’étable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le soleil de la justice rendue ». Le mot hébreu peut exprimer la justice, la droiture ou la vindication.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ses rayons ». Le mot hébreu traduit par « ailes » peut désigner métaphoriquement les extrémités ou les rayons du soleil.
    reason: lexical_alternative
  - marker: c
    text: Ou « gambaderez »; selon une autre interprétation, « deviendrez gras ». Le verbe hébreu est rare et son sens est incertain; il peut décrire un mouvement exubérant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרְחָה
  choice: se lèvera
  rationale: Le verbe זרח désigne couramment le lever ou l’apparition lumineuse d’un astre. « Se lèvera » est naturel avec le soleil et conserve la valeur future.
- source_word: יִרְאֵי שְׁמִי
  choice: vous qui craignez mon nom
  rationale: Cette formulation conserve l’adresse à la deuxième personne marquée par לָכֶם et rend naturellement le participe hébreu.
- source_word: שֶׁמֶשׁ צְדָקָה
  choice: le soleil de justice
  rationale: La formulation maintient la métaphore hébraïque et la portée large de צְדָקָה, qui peut évoquer la justice, la droiture ou la justification de ceux auxquels Dieu rend justice.
- source_word: וּמַרְפֵּא
  choice: avec la guérison
  rationale: Le nom מַרְפֵּא désigne la guérison ou le remède. « Avec la guérison » préserve la construction nominale sans expliciter davantage le rapport à l’image solaire.
- source_word: בִּכְנָפֶיהָ
  choice: dans ses ailes
  rationale: Le sens concret de כָּנָף est « aile »; dans cette image solaire, le mot peut évoquer les extrémités ou les rayons. Le texte principal conserve la métaphore concrète.
- source_word: וִיצָאתֶם
  choice: vous sortirez
  rationale: Le verbe יָצָא signifie directement « sortir ». La traduction maintient l’image de la libération vers un espace ouvert.
- source_word: וּפִשְׁתֶּם
  choice: bondirez
  rationale: Ce verbe rare est incertain. Dans le contexte de veaux libérés de l’étable, « bondirez » exprime bien un mouvement exubérant, tout en signalant les autres possibilités en note.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: comme des veaux hors de l’étable
  rationale: מַרְבֵּק désigne une étable, un enclos ou un lieu d’engraissement. « Hors de l’étable » rend explicite en français l’image contextuelle de veaux sortis de leur lieu de confinement, sans alourdir la comparaison.
theological_decisions:
- issue: Interprétation messianique du « soleil de justice »
  choice: Conserver la métaphore sans identifier explicitement le soleil au Messie.
  alternative: Traduire ou annoter l’expression comme un titre messianique désignant directement le Messie ou le Christ.
  rationale: La tradition chrétienne a souvent lu cette image dans un sens messianique, mais le texte hébreu présente directement une image de délivrance à venir pour ceux qui craignent le nom de Dieu. La traduction ne doit pas imposer une identification doctrinale que le verset ne formule pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore des « ailes » est maintenue, tandis que l’ordre des mots est légèrement adapté au français. Les marqueurs de notes sont placés sur les expressions auxquelles leurs variantes se rapportent.
