source:
  edition: WLC
  text: כִּ֛י אֲנִ֥י יְהוָ֖ה לֹ֣א שָׁנִ֑יתִי וְ/אַתֶּ֥ם בְּנֵֽי יַעֲקֹ֖ב לֹ֥א כְלִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
translation:
  language: fr
  text: Car moi, Yahweh, je ne change pas ; et vous, fils de Jacob[a], vous n’avez pas disparu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « fils de Jacob » désigne les descendants de Jacob, c’est-à-dire Israël.
    reason: cultural_note
  - marker: b
    text: Ou « vous n’avez pas été consumés », « vous n’avez pas péri » ou « vous n’avez pas pris fin ». Le verbe hébreu peut exprimer l’idée de finir, de disparaître ou d’être consumé.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français le fondement explicatif de l’affirmation précédente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement par le tétragramme.
- source_word: לֹא שָׁנִיתִי
  choice: je ne change pas
  rationale: Le présent français exprime ici avec naturel la constance durable affirmée par l’accompli hébreu.
- source_word: וְ/אַתֶּם
  choice: et vous
  rationale: Conserve la coordination hébraïque sans expliciter davantage le rapport logique.
- source_word: בְּנֵי יַעֲקֹב
  choice: fils de Jacob
  rationale: Préserve l’expression masculine plurielle et sa portée d’appellation collective d’Israël.
- source_word: לֹא כְלִיתֶם
  choice: vous n’avez pas disparu
  rationale: Rend idiomatiquement le sens de ne pas être arrivé à sa fin, sans préciser indûment le mode du jugement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin ; sa transcription le distingue d’un titre.
- issue: Portée de לֹא שָׁנִיתִי
  choice: je ne change pas
  alternative: je n’ai pas changé
  rationale: Le présent communique la constance continue sans développer une formulation philosophique étrangère au verset.
- issue: Lien entre la constance de Yahweh et la survie d’Israël
  choice: et vous
  alternative: c’est pourquoi vous
  rationale: La conjonction peut laisser entendre une conséquence, mais le texte hébreu ne la marque pas explicitement ; la coordination conserve cette tension.
- issue: Désignation בְּנֵי יַעֲקֹב
  choice: fils de Jacob
  alternative: descendants de Jacob
  rationale: Le rendu formel garde l’appellation d’alliance tout en permettant à une note d’en préciser la référence collective.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « moi » et « vous » conserve l’insistance des pronoms hébreux. « Disparu » est plus naturel que « arrivé à votre fin », tandis que la note maintient l’étendue sémantique du verbe.
