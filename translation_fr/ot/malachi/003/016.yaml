id: MAL.3.16
reference: Malachi 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
translation:
  language: fr
  text: Alors, ceux qui craignaient Yahweh se parlèrent entre eux[a], et Yahweh prêta attention et entendit ; un livre de souvenir fut écrit devant lui pour ceux qui craignent Yahweh et qui tiennent son nom en haute estime[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme à son compagnon » ; l’expression hébraïque a ici un sens réciproque.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui pensent à son nom » ou « qui accordent de l’importance à son nom ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la réaction qui suit la situation décrite auparavant, dans un français narratif naturel.
- source_word: נִדְבְּרוּ … אִישׁ אֶת־רֵעֵהוּ
  choice: se parlèrent les uns aux autres
  rationale: Le nifal et l’expression distributive ont ici un sens réciproque; cette formulation française le restitue clairement.
- source_word: יִרְאֵי יְהוָה
  choice: ceux qui craignaient Yahweh
  rationale: « Craindre » conserve le poids biblique de ירא, qui associe crainte, respect et fidélité, tandis que « Yahweh » rend le nom divin.
- source_word: וַיַּקְשֵׁב … וַיִּשְׁמָע
  choice: prêta attention et entendit
  rationale: 'Préserve la succession de deux verbes: l’écoute attentive, puis le fait d’entendre.'
- source_word: וַיִּכָּתֵב סֵפֶר זִכָּרוֹן
  choice: un livre de souvenir fut écrit
  rationale: Rend directement le passif hébreu et la fonction mémorielle du registre, sans préciser un agent que le texte ne nomme pas.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: 'Conserve l’expression spatiale et relationnelle du texte hébreu: le registre demeure en présence de Dieu.'
- source_word: לְיִרְאֵי יְהוָה
  choice: pour ceux qui craignent Yahweh
  rationale: Le présent décrit cette catégorie de personnes par un trait durable; « pour » laisse ouverte la nuance de référence ou de bénéfice de לְ.
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  choice: et qui tiennent son nom en haute estime
  rationale: חשב avec « son nom » exprime ici une considération attentive et valorisante; cette tournure est claire en français moderne tout en conservant cette double nuance.
theological_decisions:
- issue: Sens de la crainte de Yahweh
  choice: ceux qui craignaient Yahweh / ceux qui craignent Yahweh
  alternative: ceux qui révéraient Yahweh
  rationale: La traduction maintient « craindre » afin de ne pas atténuer la tension biblique entre crainte, respect et loyauté envers Dieu.
- issue: Sens de וּלְחֹשְׁבֵי שְׁמוֹ
  choice: qui tiennent son nom en haute estime
  alternative: qui pensent à son nom / qui accordent de l’importance à son nom
  rationale: Le contexte permet à la fois l’idée de penser au nom et celle de l’estimer. Le texte principal exprime la considération révérencieuse, et la note préserve l’autre nuance possible.
- issue: Nature du livre de souvenir
  choice: un livre de souvenir fut écrit devant lui
  alternative: un registre commémoratif fut consigné en sa présence
  rationale: La formulation ne tranche ni l’identité du rédacteur ni le mode concret de l’inscription, éléments que l’hébreu laisse implicites.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement narratif et les répétitions significatives de l’hébreu, tout en employant des expressions françaises naturelles. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
