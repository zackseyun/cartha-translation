source:
  edition: WLC
  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
translation:
  language: fr
  text: 'Apportez toute la dîme[a] au dépôt, afin qu’il y ait de la nourriture dans ma maison. Mettez-moi à l’épreuve à ce sujet, je vous prie, dit Yahweh des armées : si je n’ouvre pas pour vous les fenêtres du ciel[b] et si je ne répands pas pour vous une bénédiction jusqu’à ce qu’il n’y ait plus aucun manque[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la dîme entière » ou « la totalité de la dîme ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les vannes du ciel ». L’hébreu dit littéralement « les fenêtres du ciel ».
    reason: lexical_alternative
  - marker: c
    text: 'L’expression hébraïque évoque une abondance qui dépasse tout ce qui est nécessaire ; traductions traditionnelles : « jusqu’à ce qu’il n’y ait plus de place » ou « au-delà de toute mesure ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  choice: Apportez
  rationale: L’impératif hiphil exprime ici l’action de faire venir ou d’apporter. « Apportez » restitue directement la force de l’ordre.
- source_word: כָּל הַמַּעֲשֵׂר
  choice: toute la dîme
  rationale: כָּל associé au singulier désigne la totalité de la dîme exigée. Cette formulation française conserve cette idée sans suggérer plusieurs dîmes.
- source_word: בֵּית הָאוֹצָר
  choice: la maison du trésor
  rationale: La traduction conserve l’image hébraïque d’une « maison » servant de dépôt. « Entrepôt » serait plus idiomatique, mais effacerait le lien lexical avec la « maison » de Yahweh dans la proposition suivante.
- source_word: וִיהִי
  choice: afin qu’il y ait
  rationale: La forme jussive indique ici le but ou le résultat attendu de l’ordre précédent.
- source_word: טֶרֶף
  choice: de la nourriture
  rationale: Bien que le terme puisse désigner une proie, le contexte des réserves du temple appelle le sens de nourriture ou de provisions.
- source_word: וּבְחָנוּנִי נָא בָּזֹאת
  choice: Mettez-moi donc à l’épreuve en cela
  rationale: בחן signifie éprouver ou examiner. « Donc » rend naturellement la particule נָא dans ce défi pressant, sans lui donner ici la tonalité polie de « s’il vous plaît ».
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente le nom divin explicite, tandis que « des armées » préserve la portée militaire et cosmique du titre צְבָאוֹת.
- source_word: אִם לֹא אֶפְתַּח
  choice: pour voir si je n’ouvrirai pas
  rationale: Après l’invitation à mettre Yahweh à l’épreuve, אִם לֹא introduit ce qui devra être constaté. La formulation française garde la structure rhétorique, dont le sens est fortement affirmatif.
- source_word: אֲרֻבּוֹת הַשָּׁמַיִם
  choice: les fenêtres du ciel
  rationale: אֲרֻבּוֹת désigne littéralement des ouvertures ou fenêtres. Cette traduction maintient l’image biblique et ses résonances intertextuelles.
- source_word: וַהֲרִיקֹתִי לָכֶם בְּרָכָה
  choice: et ne déverserai pas sur vous la bénédiction
  rationale: Le verbe évoque le fait de vider ou de répandre abondamment. Le singulier « la bénédiction » demeure général, sans réduire la promesse à une forme précise de prospérité.
- source_word: עַד בְּלִי דָי
  choice: jusqu’à ce qu’il n’y ait plus aucun manque
  rationale: L’expression idiomatique indique une abondance qui dépasse la suffisance. Cette formulation rend le résultat concret sans imposer l’image distincte d’un espace devenu insuffisant.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nature de la bénédiction promise
  choice: la bénédiction, sans précision supplémentaire
  alternative: une abondance matérielle ou agricole
  rationale: Le contexte concerne les récoltes et les ressources du temple, mais בְּרָכָה reste un terme général. La traduction évite donc d’en faire une formule doctrinale de prospérité exclusivement matérielle.
- issue: Force de l’invitation à éprouver Dieu
  choice: Mettez-moi donc à l’épreuve
  alternative: Essayez-moi, je vous prie
  rationale: Le verset formule exceptionnellement une invitation divine directe. La traduction en conserve la force sans généraliser cette invitation au-delà de la situation énoncée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du mouvement de l’hébreu, tout en rendant naturellement la construction rhétorique אִם לֹא. Les images de la maison du trésor et des fenêtres du ciel sont conservées.
