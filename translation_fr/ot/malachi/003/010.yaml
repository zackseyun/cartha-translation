revisions:
- from: Apportez toute la dîme[a] à la maison du trésor, afin qu’il y ait de la nourriture dans ma maison. Mettez-moi donc à l’épreuve en cela, dit Yahweh des armées, pour voir si je n’ouvrirai pas pour vous les fenêtres du ciel[b] et ne déverserai pas sur vous la bénédiction jusqu’à ce qu’il n’y ait plus aucun manque[c].
  to: 'Apportez toute la dîme[a] au dépôt, afin qu’il y ait de la nourriture dans ma maison. Mettez-moi à l’épreuve à ce sujet, je vous prie, dit Yahweh des armées : si je n’ouvre pas pour vous les fenêtres du ciel[b] et si je ne répands pas pour vous une bénédiction jusqu’à ce qu’il n’y ait plus aucun manque[c].'
  rationale: La révision remplace un calque peu idiomatique par « dépôt », ajuste la nuance de נא et rapproche la seconde occurrence de לכם de l’hébreu. Elle conserve la syntaxe rhétorique de אם לא sans la convertir en une affirmation doctrinalement amplifiée, et maintient une note qui signale l’incertitude idiomatique de עד בלי די.
