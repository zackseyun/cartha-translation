  terminology: « Yahweh des armées », « dîme », « dépôt », « maison », « fenêtres du ciel » et « bénédiction » sont cohérents avec le texte hébreu et avec un français international moderne. Le maintien de « fenêtres » préserve l’image textuelle; l’alternative « vannes » demeure correctement signalée.
