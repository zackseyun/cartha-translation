  text: וְ/יָשַׁ֨ב מְצָרֵ֤ף וּ/מְטַהֵר֙ כֶּ֔סֶף וְ/טִהַ֤ר אֶת בְּנֵֽי לֵוִי֙ וְ/זִקַּ֣ק אֹתָ֔/ם כַּ/זָּהָ֖ב וְ/כַ/כָּ֑סֶף וְ/הָיוּ֙ לַֽ/יהוָ֔ה מַגִּישֵׁ֥י מִנְחָ֖ה בִּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
translation:
  language: fr
  text: Il s’assiéra comme celui qui affine et purifie l’argent. Il purifiera les fils de Lévi et les affinera comme on affine l’or et l’argent. Ils appartiendront à Yahvé et lui présenteront une offrande[a] avec justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande de céréales ». Le terme hébreu minḥah désigne souvent ce type précis d’offrande, mais peut aussi désigner plus largement une offrande ou un don.
    reason: Alternative lexicale liée à la portée de מִנְחָה.
lexical_decisions:
- source_word: וְיָשַׁב
  choice: Il s’assiéra
  rationale: Le verbe signifie littéralement « s’asseoir, demeurer ». Le futur « s’assiéra » conserve l’image concrète de l’affineur assis, attentif à son travail.
- source_word: מְצָרֵף וּמְטַהֵר כֶּסֶף
  choice: comme celui qui affine et purifie l’argent
  rationale: Les participes désignent l’artisan qui affine et purifie le métal. Cette formulation naturelle en français préserve à la fois l’action métallurgique et le parallélisme hébreu.
- source_word: וְטִהַר אֶת־בְּנֵי לֵוִי
  choice: Il purifiera les fils de Lévi
  rationale: « Purifier » maintient les résonances à la fois métallurgiques, cultuelles et morales du verbe טהר. « Les fils de Lévi » conserve l’expression familiale et tribale du texte.
- source_word: וְזִקַּק אֹתָם
  choice: et les affinera
  rationale: Dans ce contexte, זקק décrit l’affinage du métal. « Affiner » prolonge clairement la métaphore sans employer un terme archaïque.
- source_word: כַּזָּהָב וְכַכָּסֶף
  choice: comme l’or et comme l’argent
  rationale: La répétition de « comme » reproduit les deux prépositions comparatives du texte hébreu et leur effet d’insistance.
- source_word: וְהָיוּ לַיהוָה
  choice: Ils appartiendront à Yahvé
  rationale: La tournure hébraïque « être pour YHWH » exprime ici une relation d’appartenance ou de consécration. La traduction choisie en rend le sens dans un français courant sans préciser davantage la nature de cette relation.
- source_word: מַגִּישֵׁי מִנְחָה
  choice: et lui présenteront une offrande
  rationale: Le participe indique ceux qui apportent ou présentent une offrande. La coordination française rend naturellement la fonction qu’ils exerceront pour Yahvé. מִנְחָה peut désigner une offrande en général ou, plus précisément, une offrande de céréales; cette dernière possibilité est signalée en note.
- source_word: בִּצְדָקָה
  choice: dans la justice
  rationale: Cette traduction conserve le substantif צְדָקָה et laisse subsister ses dimensions éthique et cultuelle, plutôt que de le réduire à un simple adverbe.
theological_decisions:
- issue: Portée de l’image de l’affinage
  choice: Le texte décrit directement la purification des fils de Lévi afin qu’ils présentent une offrande juste.
  alternative: Y voir explicitement la purification de tout Israël ou introduire une application messianique dans le corps du verset.
  rationale: Le texte hébreu nomme expressément les fils de Lévi. La traduction maintient cette portée immédiate sans exclure les lectures canoniques plus larges, mais sans les incorporer au verset.
- issue: Relation exprimée par וְהָיוּ לַיהוָה
  choice: « Ils appartiendront à Yahvé »
  alternative: « Ils seront pour Yahvé » ou « ils seront au service de Yahvé »
  rationale: « Appartiendront » rend la consécration ou l’appartenance impliquée par la construction hébraïque. « Seront pour » serait peu naturel en français, tandis que « au service de » préciserait davantage que le texte.
- issue: Sens précis de מִנְחָה
  choice: « offrande » dans le texte principal
  alternative: « offrande de céréales »
  rationale: Le terme désigne souvent une offrande de céréales dans un cadre cultuel, mais peut avoir un sens plus large. Le texte principal préserve cette latitude et la note fournit le sens technique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore métallurgique est conservée avec « affiner » et « purifier ». Le nom divin est rendu par « Yahvé ». La syntaxe finale est légèrement restructurée pour être idiomatique, tout en préservant l’appartenance à Yahvé, la présentation de l’offrande et l’expression « dans la justice ».
