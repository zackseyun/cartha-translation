review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement le mouvement judiciaire, la liste des personnes visées, le nom divin et le titre צְבָאוֹת. Toutefois, la construction hébraïque rattache naturellement « la veuve et l’orphelin » au même participe עֹשְׁקֵי que le salaire : elle désigne ceux qui abusent du salaire de l’ouvrier, de la veuve et de l’orphelin. La répartition française actuelle est interprétativement plausible, mais peut être rendue plus clairement sans perdre ce lien.'
  naturalness: « Témoin prompt » est compréhensible mais peu idiomatique en français international actuel. « Un témoin qui ne tarde pas » conserve l’image du témoin et exprime naturellement la promptitude. « Écartent l’étranger résident » reste trop vague en français ; « font dévier le droit de l’étranger résident » rend le sens juridique usuel de מַטֵּי dans ce contexte tout en signalant par une note que « droit » est implicite.
  terminology: « Sorciers », « adultères », « prêtent de faux serments », « ouvrier », « veuve », « orphelin », « craignent », « Yahweh » et « des armées » conviennent au registre et à la fidélité lexicale. « Ouvrier » est plus naturel que « salarié » ici et évite une coloration administrative.
  issues:
