  to: Alors je m’approcherai de vous pour le jugement, et je serai un témoin qui ne tarde pas contre les sorciers, contre les adultères, contre ceux qui prêtent de faux serments, contre ceux qui privent l’ouvrier de son salaire, qui oppriment la veuve et l’orphelin, qui font dévier le droit de l’étranger résident[a] et qui ne me craignent pas, dit Yahweh des armées[b].
