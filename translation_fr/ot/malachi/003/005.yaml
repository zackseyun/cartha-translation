  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
translation:
  language: fr
  text: Alors je m’approcherai de vous pour le jugement, et je serai un témoin qui ne tarde pas contre les sorciers, contre les adultères, contre ceux qui prêtent de faux serments, contre ceux qui privent l’ouvrier de son salaire, qui oppriment la veuve et l’orphelin, qui font dévier le droit de l’étranger résident[a] et qui ne me craignent pas, dit Yahweh des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger » ou « l’immigré ». Le mot hébreu désigne un non-Israélite établi parmi les Israélites et placé sous leur protection. Littéralement, le texte dit « ceux qui font dévier l’étranger résident » ; dans ce contexte judiciaire, il s’agit de détourner ou de lui refuser son droit.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « le SEIGNEUR des armées » ; dans l’usage liturgique français, aussi « le SEIGNEUR de l’univers ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט
  choice: Alors je m’approcherai de vous pour le jugement
  rationale: Le parfait avec waw prend ici une valeur future dans le discours prophétique. « De vous » conserve la direction exprimée par אֶל sans transformer prématurément l’approche en hostilité; « pour le jugement » maintient le cadre judiciaire.
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  choice: et je serai un témoin prompt
  rationale: Cette formulation conserve l’image judiciaire du témoin ainsi que l’idée de rapidité exprimée par מְמַהֵר, sans réduire la proposition au seul acte de témoigner.
- source_word: בַּמְכַשְּׁפִים
  choice: contre les sorciers
  rationale: Le participe désigne les personnes qui pratiquent la sorcellerie. « Sorciers » est direct et compréhensible en français actuel.
- source_word: וּבַמְנָאֲפִים
  choice: contre les adultères
  rationale: Le substantif français désigne directement ceux qui commettent l’adultère et conserve la forme personnelle du participe hébreu.
- source_word: וּבַנִּשְׁבָּעִים לַשָּׁקֶר
  choice: contre ceux qui prêtent de faux serments
  rationale: La traduction rend l’acte de jurer dans le mensonge sans le limiter au seul parjure prononcé devant un tribunal.
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר
  choice: contre ceux qui privent le salarié de son salaire
  rationale: Littéralement, le texte parle de ceux qui oppriment ou exploitent le salaire du travailleur. La formulation française explicite naturellement l’abus visé, probablement la retenue ou la spoliation du salaire.
- source_word: אַלְמָנָה וְיָתוֹם
  choice: qui oppriment la veuve et l’orphelin
  rationale: Le participe עֹשְׁקֵי peut régir ces deux groupes vulnérables en plus du salaire. La répétition de « qui oppriment » clarifie cette construction en français sans ajouter une catégorie morale étrangère au texte.
- source_word: וּמַטֵּי גֵר
  choice: qui écartent l’étranger résident
  rationale: Le participe causatif de נטה évoque le fait d’écarter, de détourner ou de faire dévier. La traduction ne fournit pas dans le corps du texte un complément comme « de la justice », absent de l’hébreu. « Étranger résident » exprime le statut social du גֵר, non-natif établi au sein d’Israël.
- source_word: וְלֹא יְרֵאוּנִי
  choice: et qui ne me craignent pas
  rationale: « Craindre » préserve à la fois la force du terme hébreu et sa dimension de respect religieux, au lieu de l’atténuer en « respecter » ou « révérer ».
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » rend explicitement le nom divin, tandis que « des armées » traduit le pluriel צְבָאוֹת de manière transparente et actuelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le distingue d’un simple titre tout en évitant de résoudre autrement la portée théologique du nom.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers / des puissances
  rationale: Le sens concret de « armées » est conservé. Les formulations plus générales pourraient élargir ou spiritualiser le titre au-delà de sa valeur lexicale immédiate.
- issue: Lien syntaxique de עֹשְׁקֵי avec la veuve et l’orphelin
  choice: répéter « qui oppriment »
  alternative: faire de « la veuve et l’orphelin » des compléments de la privation du salaire
  rationale: L’absence d’une nouvelle préposition avant אַלְמָנָה וְיָתוֹם permet de les rattacher au participe « ceux qui oppriment ». La répétition française rend cette lecture intelligible, sans suggérer contre toute vraisemblance que tous deux seraient nécessairement des salariés.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La série accusatoire conserve son rythme judiciaire. « Témoin prompt » garde la métaphore et l’accent sur la rapidité, tandis que les reformulations concernant le salaire et les personnes vulnérables évitent une littéralité obscure.
