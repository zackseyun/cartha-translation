    issue: Rendu de מַטֵּי גֵר
    rationale: '« Qui écartent l’étranger résident » peut suggérer une exclusion physique et ne fait pas clairement entendre l’emploi juridique de נטה : détourner ou fausser le droit de quelqu’un. Le terme « droit » est implicite dans l’hébreu et dans le cadre judiciaire, ce qui doit être indiqué en note.'
  - severity: low
    issue: Expression « témoin prompt »
    rationale: La formule est fidèle, mais son adjectif est peu naturel dans le français contemporain. Une formulation relative maintient l’image judiciaire et la notion de rapidité.
  - severity: low
    issue: Articulation des objets de עֹשְׁקֵי
    rationale: La version actuelle explicite correctement l’oppression de la veuve et de l’orphelin, mais une formulation parallèle rend plus nettement leur rattachement au même groupe d’oppresseurs que celui qui prive l’ouvrier de son salaire.
