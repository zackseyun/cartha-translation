id: MAL.3.7
reference: Malachi 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
translation:
  language: fr
  text: 'Depuis le temps de vos pères[a], vous vous êtes écartés de mes prescriptions et vous ne les avez pas observées. Revenez à moi, et je reviendrai à vous, dit Yahweh des armées. Mais vous dites : « Comment reviendrons-nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtres ». L’hébreu dit littéralement « pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  choice: Depuis le temps de vos pères
  rationale: La préposition marque une durée prenant son origine dans le passé. « Depuis le temps de » rend naturellement l’idiome hébreu « depuis les jours de », tandis que « pères » conserve la forme masculine du texte source.
- source_word: סַרְתֶּם מֵחֻקַּי
  choice: vous vous êtes écartés de mes prescriptions
  rationale: סור évoque le fait de quitter une voie ou une norme. « Vous vous êtes écartés » préserve cette image, et « prescriptions » exprime le caractère normatif de חֻקִּים en français actuel.
- source_word: וְלֹא שְׁמַרְתֶּם
  choice: et vous ne les avez pas observées
  rationale: Dans un contexte d’alliance et de loi, שׁמר signifie garder ou observer. Le pronom féminin pluriel reprend clairement « prescriptions ».
- source_word: שׁוּבוּ אֵלַי
  choice: Revenez à moi
  rationale: שׁוב exprime ici un retour relationnel et moral vers Dieu. « Revenez » garde sa concision et sa portée prophétique sans expliciter davantage la notion de repentance.
- source_word: וְאָשׁוּבָה אֲלֵיכֶם
  choice: et je reviendrai à vous
  rationale: La reprise du même verbe שׁוב est conservée afin de maintenir la réciprocité rhétorique de l’hébreu.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente directement le nom divin, et « des armées » conserve l’image concrète de צְבָאוֹת plutôt que de la remplacer par un titre interprétatif comme « Tout-Puissant ».
- source_word: בַּמֶּה נָשׁוּב
  choice: Comment reviendrons-nous ?
  rationale: בַּמֶּה interroge ici la manière ou le moyen. Le futur français rend naturellement l’imparfait hébreu dans cette question, sans trancher entre perplexité réelle et contestation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Réciprocité du retour entre le peuple et Dieu
  choice: « Revenez à moi, et je reviendrai à vous »
  alternative: « Tournez-vous vers moi, et je me tournerai vers vous »
  rationale: Répéter « revenir » pour les deux sujets reproduit le jeu sur שׁוב et laisse intacte la tension du langage relationnel, sans expliquer pourquoi Dieu doit « revenir ».
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme fondé sur « revenir » est maintenu, de même que la formulation directe de la réponse du peuple.
