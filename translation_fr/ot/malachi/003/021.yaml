source:
  edition: WLC
  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
translation:
  language: fr
  text: Vous piétinerez les méchants, car ils seront de la cendre sous la plante de vos pieds, le jour où j’agirai, dit Yahvé des armées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  choice: Vous piétinerez
  rationale: Le verbe exprime ici l’action de fouler aux pieds. « Piétinerez » conserve l’image concrète de la victoire et convient au français actuel.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé désigne les personnes caractérisées par leur méchanceté; « les méchants » est concis et naturel.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente.
- source_word: יִהְיוּ אֵפֶר
  choice: ils seront comme de la cendre
  rationale: Littéralement, « ils seront cendre ». En français, « comme de la cendre » restitue naturellement l’état résultant sans suggérer qu’ils constituent collectivement plusieurs cendres.
- source_word: תַּחַת כַּפּוֹת רַגְלֵיכֶם
  choice: sous la plante de vos pieds
  rationale: Avec רַגְלַיִם, כַּף désigne la plante du pied. Le singulier collectif « la plante » est idiomatique en français dans cette expression.
- source_word: בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: le jour où j’agirai
  rationale: La formulation hébraïque est elliptique, littéralement « le jour que je fais ». « Le jour où j’agirai » rend sobrement l’intervention décisive de Dieu sans préciser au-delà du contexte la nature de son action.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: « Yahvé » représente le nom divin; l’apposition « le maître des armées » rend le titre צְבָאוֹת de façon naturelle et intelligible, en exprimant l’autorité de Dieu sur ces armées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » conserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Rendu du titre צְבָאוֹת
  choice: le maître des armées
  alternative: des armées
  rationale: En français, « Yahvé des armées » est possible mais peut sembler désigner une appartenance. « Le maître des armées » explicite naturellement la souveraineté exprimée par le titre sans déterminer si les armées sont terrestres ou célestes.
- issue: Force de יִהְיוּ אֵפֶר
  choice: ils seront comme de la cendre
  alternative: ils seront de la cendre
  rationale: L’hébreu emploie une prédication directe, mais l’image décrit les méchants réduits à l’état de cendre sous les pieds. L’ajout idiomatique de « comme » évite une tournure française raide sans atténuer le jugement annoncé.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’image physique du piétinement, la causalité introduite par כִּי et l’ellipse mesurée de l’action divine. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
