source:
  edition: WLC
  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
translation:
  language: fr
  text: Je rabrouerai pour vous le dévoreur[a], afin qu’il ne détruise pas les produits de votre sol et que la vigne, dans le champ, ne perde pas ses fruits pour vous[b], dit Yahvé des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je réprimanderai pour vous le dévoreur. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la vigne, dans le champ, ne fera pas de fausse couche pour vous » ; image d’une vigne qui perd ses fruits avant leur maturité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָעַרְתִּי
  choice: Je menacerai
  rationale: Le verbe גָּעַר exprime une réprimande ou une menace autoritaire qui produit un effet. « Menacer » convient naturellement à un fléau destructeur et préserve la force de l’intervention divine.
- source_word: בָּאֹכֵל
  choice: celui qui dévore
  rationale: Le participe substantivé désigne ce qui consume les récoltes sans préciser s’il s’agit d’insectes, d’une maladie ou d’un autre fléau. Cette formulation conserve cette indétermination.
- source_word: יַשְׁחִת
  choice: détruise
  rationale: Dans ce contexte agricole, le hiphil de שׁחת signifie causer la destruction ou la ruine des produits du sol.
- source_word: פְּרִי הָאֲדָמָה
  choice: les produits de votre sol
  rationale: « Produits » rend ici le sens agricole collectif de פְּרִי, tandis que « sol » conserve l’image concrète de אֲדָמָה. Le possessif explicite le datif d’intérêt לָכֶם dans un français naturel.
- source_word: תְשַׁכֵּל
  choice: ne perde pas ses fruits
  rationale: Appliqué à la vigne, שׁכל évoque littéralement la perte prématurée de sa progéniture, donc de ses fruits. La formulation française transmet l’image agricole sans lui substituer la simple idée de stérilité.
- source_word: הַגֶּפֶן
  choice: la vigne
  rationale: Traduction directe du nom défini singulier, naturelle en français.
- source_word: בַּשָּׂדֶה
  choice: dans vos champs
  rationale: Le singulier collectif « le champ » désigne l’espace cultivé. Le pluriel avec possessif rend idiomatiquement le contexte et le לָכֶם associé au verbe.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Le nom divin est transcrit « Yahvé » et צְבָאוֹת est traduit par « armées », terme transparent en français moderne qui conserve la dimension souveraine et guerrière du titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente le nom propre plutôt que de le remplacer par un titre, tout en restant la forme française courante.
- issue: Rendu de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » traduit directement le pluriel hébreu et conserve l’imagerie du titre sans résoudre la question de savoir quelles armées sont visées.
- issue: Nature de « celui qui dévore »
  choice: agent destructeur non précisé
  alternative: les insectes ravageurs
  rationale: L’hébreu emploie un participe substantivé sans identifier précisément le fléau. La traduction ne l’assimile donc pas à une espèce ou à une cause particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme agricole du verset. « Celui qui dévore » évite de préciser indûment la nature du fléau, tandis que la note sur la vigne préserve la métaphore forte de l’hébreu.
