source:
  edition: WLC
  text: בַּ/מְּאֵרָה֙ אַתֶּ֣ם נֵֽאָרִ֔ים וְ/אֹתִ֖/י אַתֶּ֣ם קֹבְעִ֑ים הַ/גּ֖וֹי כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/009.yaml
  text: You are cursed with a curse[a], for you are robbing me—the whole nation of you.
translation:
  language: fr
  text: Vous êtes frappés par la malédiction[a], car vous me dépouillez, vous tous, la nation entière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Vous êtes maudits par la malédiction. » On peut aussi comprendre : « Vous êtes sous le coup d’une malédiction. » Le lien introduit par ו est rendu ici par « car », conformément au contexte ; il peut aussi être compris comme une simple coordination, ou avec une nuance adversative : « et pourtant vous me dépouillez ».'
    reason: Conserver l’expression hébraïque emphatique ainsi que les possibilités réelles de la conjonction, tout en signalant la valeur causale la plus probable dans le contexte.
lexical_decisions:
- source_word: בַּמְּאֵרָה
  choice: par la malédiction
  rationale: La préposition ב est comprise ici comme instrumentale, et l’article défini est conservé. Avec « frappés », cette formulation restitue en français naturel l’expression hébraïque emphatique sans l’aplatir en un simple adjectif.
- source_word: נֵאָרִים
  choice: vous êtes frappés
  rationale: Le participe passif de ארר décrit l’état présent et durable du peuple. « Être frappés par la malédiction » rend ce sens résultatif dans un français actuel et digne.
- source_word: וְאֹתִי
  choice: et pourtant vous me
  rationale: 'Le ו est rendu avec une nuance adversative adaptée au contexte : malgré la malédiction qui les frappe, les destinataires continuent à dépouiller Dieu. La note conserve la possibilité d’une simple coordination ou d’un rapport causal.'
- source_word: קֹבְעִים
  choice: dépouillez
  rationale: Dans ce contexte de redevances retenues, קבע signifie voler ou spolier. « Dépouiller » exprime clairement l’atteinte faite à Dieu sans registre familier.
- source_word: הַגּוֹי כֻּלּוֹ
  choice: vous, la nation tout entière
  rationale: Cette tournure conserve à la fois l’adresse à la deuxième personne et la portée collective de l’expression littérale « la nation, sa totalité ».
theological_decisions:
- issue: Portée collective du jugement
  choice: L’ensemble de la nation est explicitement impliqué dans la malédiction et dans l’acte de dépouiller Dieu.
  alternative: La formule finale peut être comprise surtout comme une apposition intensive équivalant à « vous tous ».
  rationale: הַגּוֹי כֻּלּוֹ désigne collectivement toute la communauté, tout en intensifiant l’adresse faite aux destinataires, sans introduire de catégorie théologique étrangère au texte.
- issue: Relation entre la malédiction et le dépouillement de Dieu
  choice: 'Le texte principal rend ו par une coordination à valeur adversative : « et pourtant ».'
  alternative: On peut comprendre une simple coordination (« et »), voire une nuance causale (« car »), selon la relation discursive retenue.
  rationale: Le ו hébreu ne précise pas à lui seul la relation logique. Le contexte favorise la tension adversative, mais la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et soutenu. « Frappés par la malédiction » évite le calque peu naturel « maudits par une malédiction », tandis que la note en conserve la forme rhétorique. La reprise « vous, la nation tout entière » maintient l’accent collectif de la clausule hébraïque.
