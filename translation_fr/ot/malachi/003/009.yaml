  verdict: revise
  source_fidelity: Le participe passif נֵאָרִים exprime que les destinataires sont « maudits »; « frappés par la malédiction » est interprétatif mais reste défendable. En revanche, dans le contexte immédiat, le ו introduit le motif de la malédiction et se rend le plus naturellement par « car ». La clausule finale maintient l’implication de la nation entière.
  naturalness: « Vous êtes frappés par la malédiction » est idiomatique en français moderne. « Vous, la nation tout entière » est compréhensible mais une peu lourde apposition après « dépouillez »; « vous tous, la nation entière » rend plus naturellement l’intensification collective.
  terminology: « Malédiction » et « dépouillez » conviennent au registre prophétique et au contexte de privation des offrandes. La note doit présenter l’adversatif comme une possibilité secondaire, non comme la lecture principale du lien logique.
