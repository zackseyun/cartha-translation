source:
  edition: WLC
  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
translation:
  language: fr
  text: Mais qui pourra supporter le jour de sa venue, et qui pourra tenir debout quand il paraîtra ? Car il est comme le feu du fondeur et comme la lessive des blanchisseurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le produit alcalin des foulons ». Le terme hébreu désigne un puissant agent nettoyant utilisé pour laver et traiter les étoffes.
    reason: alternative lexicale et précision historique
lexical_decisions:
- source_word: מְכַלְכֵּל
  choice: pourra supporter
  rationale: Dans ce contexte, le verbe exprime la capacité d’endurer ou de résister à une épreuve. « Pourra supporter » rend naturellement la question rhétorique et sa portée menaçante.
- source_word: יוֹם בּוֹאוֹ
  choice: le jour de sa venue
  rationale: Cette formulation conserve la construction nominale de l’hébreu ainsi que le poids prophétique de l’expression, tout en restant claire en français moderne.
- source_word: הָעֹמֵד
  choice: pourra tenir debout
  rationale: Le participe signifie littéralement « celui qui se tient debout ». L’ajout de « pourra », suggéré par le parallélisme avec la première question, exprime la capacité de subsister face à sa manifestation.
- source_word: בְּהֵרָאוֹתוֹ
  choice: quand il paraîtra
  rationale: L’infinitif nifal de ראה marque ici le moment où il devient visible. « Quand il paraîtra » est idiomatique et respecte cette valeur sans alourdir la phrase.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison qui explique la difficulté de supporter sa venue. « Car » préserve cette articulation explicative dans un registre digne.
- source_word: כְּאֵשׁ מְצָרֵף
  choice: comme le feu du fondeur
  rationale: L’expression désigne le feu employé par celui qui affine les métaux. « Le feu du fondeur » maintient concrètement l’image de purification sévère.
- source_word: וּכְבֹרִית מְכַבְּסִים
  choice: comme la lessive des blanchisseurs
  rationale: בֹּרִית désigne un produit alcalin puissant servant au nettoyage des étoffes. « Lessive des blanchisseurs » transmet l’image dans un français actuel, tandis que la note précise la nature du produit et l’équivalent traditionnel.
theological_decisions:
- issue: Nature de l’action du personnage qui vient
  choice: Conserver les images d’un feu qui affine et d’une lessive qui nettoie, sans réduire leur portée à une seule catégorie doctrinale.
  alternative: Interpréter l’action soit uniquement comme un jugement destructeur, soit uniquement comme une purification sanctifiante.
  rationale: Les deux comparaisons évoquent une action à la fois éprouvante, sévère et purificatrice. Le texte traduit maintient cette tension sans imposer un système théologique particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux questions est conservé par la répétition de « qui pourra ». « Fondeur » et « blanchisseurs » gardent les métiers concrets évoqués par les images hébraïques. Le marqueur de note est placé après « blanchisseurs », terme auquel la note se rapporte.
