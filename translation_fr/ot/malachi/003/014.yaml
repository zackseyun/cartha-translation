  variant: modern international French
source:
  edition: WLC
  text: אֲמַרְתֶּ֕ם שָׁ֖וְא עֲבֹ֣ד אֱלֹהִ֑ים וּ/מַה בֶּ֗צַע כִּ֤י שָׁמַ֨רְנוּ֙ מִשְׁמַרְתּ֔/וֹ וְ/כִ֤י הָלַ֨כְנוּ֙ קְדֹ֣רַנִּ֔ית מִ/פְּנֵ֖י יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
translation:
  language: fr
  text: 'Vous avez dit : « Il est inutile de servir Dieu. Quel profit avons-nous retiré d’avoir observé ses prescriptions[a] et d’avoir marché dans le deuil[b] devant Yahweh des armées ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’avoir gardé son obligation / sa charge ». Ou : « d’avoir observé ses exigences » ou « d’avoir accompli notre devoir envers lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’avoir marché d’un air sombre ». L’expression peut évoquer une attitude affligée ou des vêtements de deuil, probablement dans un contexte de pénitence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: inutile
  rationale: Dans cette phrase, le terme exprime la futilité et l’absence de résultat. « Il est inutile de » est naturel en français actuel tout en conservant le jugement cynique des locuteurs.
- source_word: עֲבֹד
  choice: servir
  rationale: Le verbe désigne ici le service rendu à Dieu au sens large, et non uniquement le culte rituel.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte désigne sans ambiguïté le Dieu d’Israël.
- source_word: בֶּצַע
  choice: profit
  rationale: « Profit » préserve la nuance intéressée de la plainte et convient à la question rhétorique.
- source_word: מִשְׁמַרְתּוֹ
  choice: ce qu’il nous a prescrit
  rationale: L’expression hébraïque désigne ce qui a été confié comme obligation à observer. Cette formulation est plus naturelle que « garder sa charge » en français moderne.
- source_word: קְדֹרַנִּית
  choice: dans le deuil
  rationale: L’adverbe évoque une conduite sombre, probablement associée au deuil ou à la pénitence; la note conserve les autres nuances possibles.
- source_word: מִפְּנֵי
  choice: devant
  rationale: La préposition situe leur conduite en présence de Yahweh sans imposer le sens causal « à cause de ».
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  rationale: « Yahweh » représente directement le nom divin; « le maître des armées » rend le titre צְבָאוֹת de façon intelligible tout en maintenant son image céleste et militaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » distingue le nom d’un titre et évite d’en masquer la présence.
- issue: Portée de la plainte concernant l’observance religieuse
  choice: Une plainte cynique englobant le service de Dieu, l’obéissance à ses prescriptions et une conduite de deuil
  alternative: Une plainte limitée aux seules pratiques rituelles de deuil
  rationale: La syntaxe coordonne ces comportements comme autant d’actes pieux que les locuteurs jugent sans profit, sans que le traducteur doive approuver leur jugement.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le discours rapporté conserve sa tonalité intéressée et contestataire. Les formulations idiomatiques évitent les calques opaques sans effacer les images du deuil et des armées.
