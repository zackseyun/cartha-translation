- from: 'Vous avez dit : « Il est inutile de servir Dieu. Quel profit avons-nous à respecter ce qu’il nous a prescrit[a] et à marcher dans le deuil[b] devant Yahweh, le maître des armées ? »'
  to: 'Vous avez dit : « Il est inutile de servir Dieu. Quel profit avons-nous retiré d’avoir observé ses prescriptions[a] et d’avoir marché dans le deuil[b] devant Yahweh des armées ? »'
  rationale: La révision rétablit le titre divin « Yahweh des armées », sans paraphrase théologique, et rend plus clairement le regard rétrospectif des actions accomplies. La note a est corrigée afin de ne pas introduire de détails absents du texte source. Les ambiguïtés de קדרנית sont maintenues en note.
