  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
translation:
  language: fr
  text: Car, du lever du soleil jusqu’à son coucher[a], mon nom est grand parmi les nations[b]. En tout lieu, de l’encens est offert à mon nom, et une offrande pure est présentée à mon nom[c][d]. Car mon nom est grand parmi les nations, dit Yahvé des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de l’est à l’ouest »; littéralement : « du lever du soleil jusqu’à son coucher ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les peuples non israélites »; le mot hébreu désigne les nations.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu peut décrire une réalité présente, employer un présent prophétique ou exprimer une certitude future; la traduction n’impose pas l’une de ces lectures.
    reason: alternative_reading
  - marker: d
    text: « Offrande » traduit l’hébreu minḥah, qui peut désigner une offrande en général et, dans les contextes sacrificiels, souvent une offrande végétale.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative du lien avec la réprimande précédente, sans exclure une nuance emphatique.
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  choice: du lever du soleil jusqu’à son coucher
  rationale: Rend naturellement l’expression hébraïque tout en conservant son image et sa portée universelle.
- source_word: גָּדוֹל שְׁמִי
  choice: mon nom est grand
  rationale: Garde le terme concret « nom », qui évoque aussi la renommée et l’honneur, sans le paraphraser.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: « Nations » convient au contexte prophétique et évite la coloration néotestamentaire que peut prendre « païens ».
- source_word: מֻקְטָר
  choice: de l’encens est offert
  rationale: Exprime clairement la valeur cultuelle du participe passif de קטר; le terme peut aussi évoquer ce que l’on fait fumer sur l’autel.
- source_word: מֻגָּשׁ לִשְׁמִי
  choice: lui est présentée
  rationale: Le pronom reprend « mon nom » et évite une répétition lourde en français; « présentée » rend le sens sacrificiel de נגשׁ sans confondre les deux participes.
- source_word: מִנְחָה טְהוֹרָה
  choice: une offrande pure
  rationale: מִנְחָה peut désigner une offrande au sens large et, dans les contextes cultuels, notamment une offrande végétale; la formulation ne réduit pas indûment le sens.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: dit Yahvé des armées
  rationale: Transcrit le nom divin selon la couche anglaise fournie et traduit directement צְבָאוֹת, en conservant la nuance cosmique et guerrière du titre.
theological_decisions:
- issue: Le verset décrit-il un culte actuel parmi les nations ou une réalité future et idéale ?
  choice: 'Conserver le présent : « est grand », « est offert », « est présentée ».'
  alternative: Employer le futur (« sera grand », « sera offert ») ou expliciter un présent prophétique.
  rationale: Les constructions nominales et participiales hébraïques n’indiquent pas explicitement le futur. Le présent français préserve l’ambiguïté entre réalité actuelle, présent prophétique et certitude future.
- issue: Comment comprendre le langage sacrificiel appliqué aux nations ?
  choice: Maintenir les termes cultuels « encens » et « offrande » sans explication doctrinale dans le corps du texte.
  alternative: Les interpréter comme des métaphores de la prière ou comme l’annonce précise d’un culte sacrificiel futur.
  rationale: Le texte emploie un vocabulaire cultuel explicite, mais ne précise pas ici la manière dont cette réalité s’accomplit.
- issue: Rapport syntaxique entre l’encens, l’offrande pure et « mon nom »
  choice: Faire porter « à mon nom » sur l’encens et reprendre ce complément par « lui » pour l’offrande.
  alternative: Lire « encens est offert, ainsi qu’une offrande pure, à mon nom » ou rattacher plus étroitement les deux participes.
  rationale: La formulation rend perceptibles les deux participes passifs et le complément לִשְׁמִי, tout en restant naturelle en français; l’hébreu compact autorise plusieurs analyses proches.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique et la répétition de « mon nom est grand parmi les nations » sont conservées. « En tout lieu » maintient le registre prophétique sans archaïsme marqué.
