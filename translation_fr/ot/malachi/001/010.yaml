    issue: La note b présente une paraphrase explicative comme une traduction littérale.
    rationale: L’hébreu dit littéralement, de manière elliptique, « vous ne ferez pas brûler/luire mon autel en vain »; il ne contient pas explicitement « le feu », ni la conjonction française « afin que ». La note doit distinguer la traduction principale clarifiée de l’alternative plus proche de la formulation hébraïque.
  - severity: low
    issue: « le feu de mon autel » est légèrement moins naturel que « le feu sur mon autel ».
    rationale: Le français cultuel décrit normalement l’allumage du feu sur l’autel. Cette légère adaptation conserve l’explicitation nécessaire pour ne pas suggérer qu’on met matériellement l’autel en feu.
  - severity: low
    issue: « Je ne prends aucun plaisir en vous » est un peu calqué.
    rationale: « Je ne prends pas plaisir en vous » est plus fluide en français international moderne et préserve le sens personnel de l’hébreu.
