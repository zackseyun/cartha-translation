id: MAL.1.10
reference: Malachi 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
translation:
  language: fr
  text: Ah ! Si seulement l’un de vous fermait les portes[a], afin que vous n’allumiez pas en vain le feu sur mon autel[b] ! Je ne prends pas plaisir en vous, dit Yahweh des armées, et je n’agréerai aucune offrande de votre main[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Qui donc parmi vous fermerait les portes ? » L’hébreu peut être lu comme une question rhétorique ou comme le souhait que quelqu’un ferme les portes du sanctuaire plutôt que de laisser se poursuivre un culte vain.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu dit littéralement : « afin que vous ne fassiez pas brûler mon autel en vain ». « Le feu sur mon autel » explicite en français l’action cultuelle visée.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu traduit par « offrande » peut désigner plus précisément une offrande végétale dans un contexte sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  choice: Ah ! Si seulement l’un de vous
  rationale: Dans ce contexte, la tournure peut exprimer le souhait indigné que quelqu’un mette fin au culte vain. La note conserve l’analyse interrogative également possible.
- source_word: וְיִסְגֹּר דְּלָתַיִם
  choice: fermait les portes
  rationale: Le pluriel désigne les portes du sanctuaire. L’imparfait s’intègre naturellement à la construction française « si seulement ».
- source_word: וְלֹא תָאִירוּ מִזְבְּחִי
  choice: afin que vous n’allumiez pas le feu de mon autel
  rationale: Le hiphil de אור signifie ici faire brûler ou allumer. L’ajout explicatif de « le feu de » évite en français l’image trompeuse consistant à incendier l’autel.
- source_word: חִנָּם
  choice: en vain
  rationale: Dans le contexte, l’adverbe souligne le caractère inutile et sans valeur du service cultuel accompli.
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  choice: Je ne prends aucun plaisir en vous
  rationale: La formulation garde la dimension personnelle de חֵפֶץ, qui exprime le plaisir, l’agrément ou une disposition favorable.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » représente directement le nom divin, tandis que « des armées » rend le sens courant et intelligible de צְבָאוֹת dans ce titre.
- source_word: וּמִנְחָה
  choice: aucune offrande
  rationale: מִנְחָה peut désigner plus précisément une offrande végétale dans le culte, mais « offrande » préserve ici la portée possible du terme sans la restreindre indûment.
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  choice: je n’agréerai aucune offrande de votre main
  rationale: Dans un contexte sacrificiel, רצה indique l’acceptation favorable. « Agréer » convient au registre cultuel, et « de votre main » conserve l’image collective de l’hébreu.
theological_decisions:
- issue: Valeur de מִי גַם בָּכֶם
  choice: 'Souhait indigné : « Ah ! Si seulement l’un de vous… »'
  alternative: 'Question rhétorique : « Qui donc parmi vous fermerait les portes ? »'
  rationale: La syntaxe permet une lecture interrogative, mais la dénonciation du culte vide favorise ici le souhait que le sanctuaire soit fermé. L’ambiguïté réelle est signalée en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; la translittération française usuelle préserve le nom personnel.
- issue: Portée cultuelle de מִנְחָה
  choice: offrande
  alternative: offrande végétale
  rationale: Le mot peut avoir le sens technique d’offrande végétale, mais peut aussi désigner plus largement un don ou une offrande. Le texte principal ne tranche pas plus étroitement que nécessaire.
translation_notes:
  register: Français international moderne, solennel sans archaïsme excessif. « Agréer » maintient la nuance cultuelle d’une offrande favorablement acceptée. Les images hébraïques sont conservées autant que possible, avec une légère explicitation pour éviter que « allumer l’autel » soit compris comme l’incendier.
