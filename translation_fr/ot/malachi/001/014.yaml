revisions:
- from: Mais maudit soit le trompeur qui a dans son troupeau un mâle, qui le voue, puis sacrifie au Seigneur une bête défectueuse ! Car je suis un grand roi, dit Yahweh, le maître des armées[a], et mon nom inspire la crainte parmi les nations[b].
  to: Mais maudit soit le trompeur qui a dans son troupeau un mâle, qui le voue, mais sacrifie au Seigneur un animal défectueux ! Car je suis un grand roi, dit Yahweh des armées[a], et mon nom inspire la crainte parmi les nations[b].
  rationale: La révision restitue sans ajout le titre divin, renforce l’opposition que porte l’accusation et limite les notes aux alternatives lexicales sûres. Elle conserve l’ambiguïté relative à l’objet implicite de « voue », exprimée naturellement par « le ».
