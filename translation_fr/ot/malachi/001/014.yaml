id: MAL.1.14
reference: Malachi 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
translation:
  language: fr
  text: Mais maudit soit le trompeur qui a dans son troupeau un mâle, qui le voue, mais sacrifie au Seigneur un animal défectueux ! Car je suis un grand roi, dit Yahweh des armées[a], et mon nom inspire la crainte parmi les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh des armées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon nom est redouté parmi les nations ». Le terme hébreu évoque la peur et la crainte révérencielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: maudit
  rationale: Adjectif prédicatif qui prononce un jugement divin; « maudit » est direct, courant et solennel.
- source_word: נוֹכֵל
  choice: le trompeur
  rationale: Désigne celui qui fraude dans le culte en substituant une offrande indigne à celle qu’il a vouée.
- source_word: יֵשׁ בְּעֶדְרוֹ זָכָר
  choice: qui a dans son troupeau un mâle
  rationale: 'Conserve explicitement le fait aggravant: l’homme possède bien un animal mâle susceptible d’être offert.'
- source_word: וְנֹדֵר
  choice: qui le voue
  rationale: Le pronom explicite naturellement l’objet sous-entendu, le mâle qui vient d’être mentionné.
- source_word: וְזֹבֵחַ
  choice: puis sacrifie
  rationale: « Puis » rend la progression des actes sans effacer le contraste implicite entre l’animal voué et celui qui est offert.
- source_word: מָשְׁחָת
  choice: une bête défectueuse
  rationale: Dans le contexte sacrificiel, le terme désigne un animal détérioré ou présentant un défaut, donc impropre à l’offrande.
- source_word: לַאדֹנָי
  choice: au Seigneur
  rationale: אֲדֹנָי est ici le titre divin exprimant l’autorité souveraine de Dieu.
- source_word: כִּי מֶלֶךְ גָּדוֹל אָנִי
  choice: Car je suis un grand roi
  rationale: Préserve la relation causale et l’affirmation divine de royauté; la minuscule suit l’usage typographique français pour les titres communs.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  rationale: Rend le nom divin par « Yahweh » et traduit צְבָאוֹת de façon intelligible, tout en formulant naturellement le titre en français.
- source_word: וּשְׁמִי נוֹרָא
  choice: et mon nom inspire la crainte
  rationale: Exprime la valeur active de נוֹרָא et maintient l’éventail sémantique allant de la peur à la crainte révérencielle.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Rendu naturel de גּוֹיִם dans le contexte prophétique, sans importer les connotations plus tardives de « païens ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme; « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Rendu de צְבָאוֹת
  choice: le maître des armées
  alternative: des armées; des puissances célestes
  rationale: Cette formulation française indique naturellement que Yahweh commande les armées, tout en laissant ouverte leur portée terrestre ou céleste.
- issue: Portée de נוֹרָא appliqué au nom divin
  choice: inspire la crainte
  alternative: est redouté; est révéré
  rationale: Le choix conserve ensemble la peur, l’effroi sacré et le respect révérenciel, sans réduire le terme à une seule nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La structure accusatrice et la forte opposition entre l’animal voué et la bête effectivement sacrifiée sont conservées. Les deux appels de note [a] et [b] figurent dans le texte.
