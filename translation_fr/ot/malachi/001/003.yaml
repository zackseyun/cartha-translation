  text: וְ/אֶת עֵשָׂ֖ו שָׂנֵ֑אתִי וָ/אָשִׂ֤ים אֶת הָרָי/ו֙ שְׁמָמָ֔ה וְ/אֶת נַחֲלָת֖/וֹ לְ/תַנּ֥וֹת מִדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/003.yaml
  text: but Esau I hated[c][b][a], and I made his mountains a desolation and his inheritance for the jackals of the wilderness.
translation:
  language: fr
  text: mais Ésaü, je l’ai haï[a]. J’ai fait de ses montagnes[b] une désolation et de son héritage un lieu destiné aux chacals du désert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je l’ai rejeté » ou « je l’ai moins aimé ». Le verbe hébreu signifie normalement « haïr » ; ces rendus cherchent à exprimer de façon interprétative un rejet ou une préférence dans le contexte de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa région montagneuse ».
    reason: lexical_alternative
  - marker: c
    text: Une traduction traditionnelle porte « les dragons du désert » ; le terme hébreu désigne probablement des chacals.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: je l’ai haï
  rationale: Le qal de שׂנא signifie normalement « haïr ». La formulation directe conserve la force et la tension théologique de l’hébreu, sans l’atténuer par une interprétation.
- source_word: וָאָשִׂים
  choice: J’ai fait de
  rationale: שׂים peut signifier « placer, établir, faire ». Avec les compléments qui décrivent le résultat, « faire de » est naturel en français.
- source_word: הָרָיו
  choice: ses montagnes
  rationale: Le pluriel de הַר désigne directement les montagnes; « sa région montagneuse » reste possible, mais explicite davantage le sens régional.
- source_word: שְׁמָמָה
  choice: un lieu dévasté
  rationale: Cette expression rend le substantif désignant la dévastation dans un français naturel et solennel.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: « Héritage » préserve l’idée d’une possession reçue en partage et sa possible portée territoriale ou liée à l’alliance.
- source_word: לְתַנּוֹת מִדְבָּר
  choice: le domaine des chacals du désert
  rationale: תַנּוֹת est généralement compris comme désignant des chacals. La tournure française exprime naturellement que le territoire dévasté leur est livré.
- source_word: וְאֶת
  choice: mais Ésaü
  rationale: La conjonction introduit ici le contraste avec Jacob au verset précédent; « mais » rend explicitement cette valeur adversative en français.
theological_decisions:
- issue: Force de la haine divine envers Ésaü
  choice: Conserver « je l’ai haï » dans le texte principal.
  alternative: « je l’ai rejeté » ou « je l’ai moins aimé »
  rationale: Le verbe hébreu exprime directement la haine. Les formulations plus douces interprètent cette parole en termes de rejet ou de préférence dans l’élection; elles ne doivent pas remplacer la tension du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe contrastive est conservée; « je l’ai haï » maintient volontairement la rudesse de l’énoncé hébreu. « Un lieu dévasté » évite le tour peu naturel « une désolation », tandis que « le domaine des chacals » rend idiomatiquement le résultat de la dévastation.
