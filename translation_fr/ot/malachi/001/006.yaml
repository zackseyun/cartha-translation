  text: בֵּ֛ן יְכַבֵּ֥ד אָ֖ב וְ/עֶ֣בֶד אֲדֹנָ֑י/ו וְ/אִם אָ֣ב אָ֣נִי אַיֵּ֣ה כְבוֹדִ֡/י וְ/אִם אֲדוֹנִ֣ים אָנִי֩ אַיֵּ֨ה מוֹרָאִ֜/י אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת לָ/כֶם֙ הַ/כֹּֽהֲנִים֙ בּוֹזֵ֣י שְׁמִ֔/י וַ/אֲמַרְתֶּ֕ם בַּ/מֶּ֥ה בָזִ֖ינוּ אֶת שְׁמֶֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a servant his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: fr
  text: 'Le SEIGNEUR des armées vous dit, à vous, prêtres qui méprisez mon nom : « Un fils honore son père, et un serviteur son maître. Si donc je suis père, où est l’honneur qui m’est dû ? Et si je suis maître, où est la crainte qui m’est due ? Mais vous dites : “En quoi avons-nous méprisé ton nom ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: serviteur
  rationale: Le terme peut désigner un esclave ou un serviteur. « Serviteur » convient naturellement à la relation avec un maître dans cette maxime tout en conservant l’idée de subordination.
- source_word: אֲדֹנִים / אֲדֹנָיו
  choice: maître / son maître
  rationale: Le pluriel morphologique אֲדֹנִים peut désigner un seul maître et s’accorde ici avec le singulier אָנִי ; le français emploie donc le singulier.
- source_word: מוֹרָאִי
  choice: la crainte qui m’est due
  rationale: מוֹרָא désigne ici la crainte révérencielle exigée par la position du maître ; l’explicitation idiomatique évite de suggérer seulement la peur.
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: Rend le nom divin selon la convention française en petites capitales et conserve le sens militaire/céleste de צְבָאוֹת.
- source_word: שְׁמִי
  choice: mon nom
  rationale: Conserve l’expression biblique, où le nom représente la personne, l’autorité et la réputation de Dieu, sans la réduire à un seul aspect.
- source_word: בַּמֶּה
  choice: En quoi
  rationale: Dans la question contestataire des prêtres, « En quoi » exprime naturellement le moyen ou le domaine visé par l’hébreu.
theological_decisions:
- issue: Nature de la crainte due à Dieu
  choice: « la crainte qui m’est due »
  alternative: « où me craint-on ? » ou « où est la peur de moi ? »
  rationale: La formulation maintient la notion de crainte révérencielle sans l’assimiler exclusivement à la terreur et suit le parallélisme avec l’honneur dû au père.
- issue: Portée du titre « père »
  choice: Conserver la déclaration conditionnelle « Si donc je suis père »
  alternative: Expliciter une paternité créatrice, nationale ou spirituelle
  rationale: Le verset ne précise pas ici la nature exacte de la paternité ; aucune interprétation confessionnelle n’est ajoutée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours divin est encadré par des guillemets, et l’apostrophe « à vous, prêtres » conserve l’insistance de l’hébreu לָכֶם הַכֹּהֲנִים. Le contraste est rendu par « Mais vous dites », sans ajouter de marqueurs explicatifs.
