  variant: modern international French
source:
  edition: WLC
  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
translation:
  language: fr
  text: 'Vous le verrez de vos propres yeux, et vous-mêmes, vous direz : « Yahweh est grand au-delà du territoire d’Israël ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Que Yahweh soit grand au-delà du territoire d’Israël ! » L’hébreu peut se lire comme une déclaration ou comme une acclamation.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֵינֵיכֶם תִּרְאֶינָה
  choice: Vous le verrez de vos propres yeux
  rationale: La tournure française naturelle « de vos propres yeux » conserve l’image concrète et l’insistance portée par le possessif. Le pronom « le » reprend sobrement ce qui vient d’être annoncé, sans préciser davantage son contenu.
- source_word: וְאַתֶּם תֹּאמְרוּ
  choice: et vous-mêmes, vous direz
  rationale: Le pronom indépendant אַתֶּם est emphatique ; la dislocation « vous-mêmes, vous » restitue cette insistance dans un français courant.
- source_word: יִגְדַּל
  choice: est grand
  rationale: Dans cette formule, l’inaccompli peut exprimer une proclamation ou une acclamation de la grandeur de Yahweh. « Est grand » reste naturel et évite d’introduire le passif non exprimé « soit magnifié ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מֵעַל לִגְבוּל יִשְׂרָאֵל
  choice: au-delà du territoire d’Israël
  rationale: מֵעַל marque ici l’extension au-delà d’une limite, tandis que גְבוּל peut désigner aussi bien la frontière que le territoire délimité. « Territoire » rend clairement la portée géographique en français.
theological_decisions:
- issue: Force de יִגְדַּל יְהוָה
  choice: Yahweh est grand
  alternative: Que Yahweh soit reconnu comme grand / Grand est Yahweh
  rationale: L’hébreu permet de comprendre la formule comme une déclaration ou comme une acclamation. Le texte principal adopte une déclaration française naturelle, tandis que la note préserve l’autre nuance sans imposer une lecture théologique particulière.
- issue: Portée de la grandeur de Yahweh
  choice: au-delà du territoire d’Israël
  alternative: au-dessus de la frontière d’Israël
  rationale: La formulation indique que la grandeur de Yahweh n’est pas confinée à Israël. Elle ne précise pas ici les modalités de cette reconnaissance universelle.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La ponctuation exclamative fait entendre le caractère proclamatoire de la parole, tandis que la note conserve l’ambiguïté grammaticale. Le nom « Yahweh » est maintenu conformément à la forme du texte source.
