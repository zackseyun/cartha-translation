source:
  edition: WLC
  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
translation:
  language: fr
  text: Quand vous présentez en sacrifice un animal aveugle, n’est-ce pas mal[a] ? Et quand vous en présentez un qui est boiteux ou malade, n’est-ce pas mal ? Présente-le donc à ton gouverneur ! T’acceptera-t-il[b] ou t’accordera-t-il sa faveur[c] ? dit Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y a pas de mal », ici et dans la proposition suivante. Le contexte donne à ces mots la force d’un reproche ironique.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Sera-t-il satisfait de toi ? »'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement, l’expression hébraïque dit : « lèvera-t-il ton visage ? » ; elle signifie accueillir favorablement quelqu’un ou lui accorder sa faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  choice: présentez
  rationale: Le hifil de נגשׁ désigne ici le fait d’amener ou de présenter une offrande. « Présenter » convient à la fois au cadre sacrificiel et au défi adressé ensuite aux prêtres.
- source_word: עִוֵּר
  choice: un animal aveugle
  rationale: L’adjectif substantivé désigne un animal sacrificiel atteint d’un défaut. L’ajout de « animal » explicite naturellement le référent donné par le contexte.
- source_word: לִזְבֹּחַ
  choice: pour le sacrifier
  rationale: L’infinitif exprime le but sacrificiel ; cette formulation est claire et idiomatique en français.
- source_word: אֵין רָע
  choice: n’est-ce pas mal ?
  rationale: Littéralement, l’expression dit « il n’y a pas de mal ». Dans ce contexte de reproche, la forme interrogative rend la force ironique de la contestation sans masquer le sens littéral, signalé en note.
- source_word: פִּסֵּחַ
  choice: boiteux
  rationale: Terme courant et précis pour un animal dont la démarche est affectée par un défaut.
- source_word: חֹלֶה
  choice: malade
  rationale: Rendu français courant qui ne donne pas au terme une précision médicale excessive.
- source_word: הַקְרִיבֵהוּ נָא
  choice: Présente-le donc
  rationale: L’impératif accompagné de נָא forme ici un défi ironique. « Donc » transmet cette pointe discursive plus naturellement que le littéral « s’il te plaît ».
- source_word: פֶחָה
  choice: gouverneur
  rationale: Désigne un responsable civil provincial de l’époque perse ; « gouverneur » est le terme français usuel et concis.
- source_word: הֲיִרְצְךָ
  choice: T’acceptera-t-il
  rationale: 'Le verbe רצה peut exprimer l’agrément, la satisfaction ou l’acceptation favorable. Le complément personnel est conservé : c’est la personne, et non seulement le présent, qui est en jeu.'
- source_word: הֲיִשָּׂא פָנֶיךָ
  choice: t’accordera-t-il sa faveur
  rationale: L’expression idiomatique « relever/porter le visage de quelqu’un » désigne un accueil favorable ou l’octroi d’une faveur.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » rend directement le nom divin, tandis que « des armées » conserve l’image du titre צְבָאוֹת sans la résoudre par une paraphrase théologique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre et évite de le remplacer par un titre.
- issue: Force de אֵין רָע
  choice: 'Question rhétorique : « n’est-ce pas mal ? »'
  alternative: 'Assertion plus littérale : « il n’y a pas de mal »'
  rationale: Le tour hébreu peut représenter ironiquement l’attitude des prêtres, mais l’ensemble fonctionne comme un reproche. La question rhétorique transmet cette force en français, tandis que la note conserve la formulation littérale et son ambiguïté.
- issue: Portée du titre צְבָאוֹת
  choice: des armées
  alternative: de l’univers ; tout-puissant
  rationale: Le rendu formel conserve la métaphore du texte et n’impose pas une interprétation unique de la nature des « armées ».
translation_notes:
  register: 'Français international actuel, digne et directement compréhensible. Le passage du « vous » au « tu » suit l’hébreu : le reproche vise d’abord les prêtres collectivement, puis interpelle chacun au singulier dans la comparaison avec son gouverneur.'
