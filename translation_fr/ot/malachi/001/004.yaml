id: MAL.1.4
reference: Malachi 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
translation:
  language: fr
  text: 'Même si Édom dit[a] : « Nous avons été dévastés, mais nous reviendrons et rebâtirons les lieux dévastés », voici ce que dit Yahweh des armées : « Ils auront beau bâtir, moi, je démolirai[b]. On les appellera “territoire de méchanceté”[c] et “peuple contre lequel Yahweh est indigné pour toujours”[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Car Édom dit » ou « Quand Édom dit ». La conjonction hébraïque peut recevoir plusieurs nuances selon la relation retenue avec le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, de manière plus prédictive : « Ils bâtiront, mais moi, je démolirai. »'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « région frontalière de méchanceté ». Le mot hébreu peut désigner aussi bien une frontière qu’un territoire.'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « le peuple contre lequel Yahweh s’est indigné pour toujours ». Le parfait hébreu peut présenter l’indignation comme établie, avec des effets durables.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Même si Édom dit
  rationale: Dans ce contexte, כִּי introduit naturellement la déclaration d’Édom à laquelle s’oppose la réponse de Yahweh. « Même si » exprime cette valeur concessive sans en faire une certitude grammaticale absolue.
- source_word: רֻשַּׁשְׁנוּ
  choice: Nous avons été dévastés
  rationale: Le passif décrit un état d’abattement ou de ruine nationale. « Dévastés » convient au contexte territorial et prépare la mention des ruines.
- source_word: וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  choice: nous reviendrons et rebâtirons les ruines
  rationale: שׁוב garde son sens premier de retour, tandis que « rebâtir les ruines » rend idiomatiquement l’action de construire de nouveau les lieux dévastés.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, et צְבָאוֹת est traduit dans son sens collectif et martial plutôt que conservé sous la forme traditionnelle peu transparente « armées célestes » ou « puissances ».
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  choice: Ils auront beau bâtir, moi, je démolirai
  rationale: Les pronoms indépendants marquent fortement le contraste entre leur action et celle de Yahweh. La tournure concessive française exprime la futilité de leur entreprise; la lecture strictement prédictive reste signalée en note.
- source_word: וְקָרְאוּ לָהֶם
  choice: On les appellera
  rationale: Le pluriel hébreu indéfini se rend naturellement en français par « on », sans préciser qui attribuera ces désignations.
- source_word: גְּבוּל רִשְׁעָה
  choice: territoire de méchanceté
  rationale: גְּבוּל peut désigner une frontière, une région frontalière ou un territoire. Ici, « territoire » convient à Édom comme entité géographique, tandis que « méchanceté » conserve la qualification morale abstraite de רִשְׁעָה.
- source_word: אֲשֶׁר זָעַם יְהוָה עַד עוֹלָם
  choice: contre lequel Yahweh s’indigne pour toujours
  rationale: זעם exprime une indignation intense. Le présent français décrit ici une attitude durable, et « pour toujours » conserve la portée temporelle de עַד עוֹלָם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Valeur de הֵמָּה יִבְנוּ face à וַאֲנִי אֶהֱרֹס
  choice: 'Lecture concessive : « Ils auront beau bâtir, moi, je démolirai »'
  alternative: 'Lecture prédictive : « Ils bâtiront, mais moi, je démolirai »'
  rationale: Le contexte souligne surtout l’inefficacité de la reconstruction d’Édom devant l’action divine. La morphologie permet toutefois une formulation prédictive, conservée en note.
- issue: Durée de l’indignation divine
  choice: « pour toujours »
  alternative: « à jamais »
  rationale: La traduction maintient sans l’atténuer la tension théologique de עַד עוֹלָם, qui présente l’indignation de Yahweh comme durable et sans terme indiqué.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme et l’opposition emphatique du texte hébreu sont préservés. Les appellations finales sont présentées comme deux désignations coordonnées, conformément à la syntaxe du verset.
