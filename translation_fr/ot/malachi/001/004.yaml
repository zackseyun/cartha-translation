  source_fidelity: 'Le sens général est fidèle au texte massorétique : Édom envisage le retour et la reconstruction, Yahweh y oppose sa propre action, puis le pays et le peuple reçoivent deux désignations. La tournure concessive « Ils auront beau bâtir » rend légitimement l’opposition rhétorique, avec la lecture prédictive signalée. En revanche, « Yahweh s’indigne pour toujours » présente plus volontiers une action itérative en français. Le parfait זָעַם décrit mieux ici une indignation établie et durable : « Yahweh est indigné ... pour toujours » conserve cette valeur sans surinterpréter l’aspect.'
  naturalness: Le français est moderne et soutenu. « Rebâtir les ruines » reste compréhensible, mais « rebâtir les lieux dévastés » est plus idiomatique et rend plus précisément חֳרָבוֹת, qui désigne des lieux en ruine plutôt que les ruines comme matériau ou objet direct.
  terminology: « Édom », « Yahweh des armées », « territoire de méchanceté » et « pour toujours » sont cohérents avec le texte source et le registre retenu. Les deux appellations finales sont maintenues comme deux désignations coordonnées.
