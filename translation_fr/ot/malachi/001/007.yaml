id: MAL.1.7
reference: Malachi 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
translation:
  language: fr
  text: 'Vous présentez sur mon autel une nourriture souillée[a], et vous dites : « En quoi t’avons-nous souillé[b] ? » Vous le faites en disant : « La table de Yahweh[c] est méprisée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « du pain » ; dans ce contexte sacrificiel, le mot désigne plus largement la nourriture offerte sur l’autel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « En quoi t’avons-nous rendu impur ? » L’hébreu s’adresse directement à Dieu : mépriser son autel revient à l’offenser lui-même.'
    reason: alternative_reading
  - marker: c
    text: La « table de Yahweh » est une image désignant l’autel et le service sacrificiel qui s’y accomplit.
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים
  choice: Vous présentez
  rationale: Le participe hiphil poursuit directement l’accusation du verset précédent. Une proposition verbale explicite est naturelle en français et conserve l’adresse aux prêtres.
- source_word: עַל מִזְבְּחִי
  choice: sur mon autel
  rationale: Rend directement la valeur locative et le possessif de première personne.
- source_word: לֶחֶם
  choice: nourriture
  rationale: Le sens littéral est « pain », mais, dans ce contexte sacrificiel, le terme désigne plus largement ce qui est offert comme nourriture sur l’autel.
- source_word: מְגֹאָל
  choice: souillée
  rationale: « Souillée » exprime la profanation ou contamination cultuelle et s’accorde naturellement avec « nourriture ».
- source_word: בַּמֶּה גֵאַלְנוּךָ
  choice: En quoi t’avons-nous souillé ?
  rationale: Le suffixe hébreu est à la deuxième personne masculine singulière et désigne directement Dieu. « En quoi » rend ici la question portant sur la manière ou le motif.
- source_word: בֶּאֱמָרְכֶם
  choice: C’est en disant
  rationale: La préposition avec l’infinitif indique le moyen et explique comment ils ont souillé Dieu; cette tournure rend clairement le lien logique.
- source_word: שֻׁלְחַן יְהוָה
  choice: La table de Yahweh
  rationale: Conserve la métaphore cultuelle de l’autel et rend le tétragramme comme nom propre.
- source_word: נִבְזֶה הוּא
  choice: est méprisée
  rationale: Rend directement le jugement dépréciatif exprimé par le participe/adjectif passif, sans l’atténuer.
theological_decisions:
- issue: Maintien de l’objet direct divin dans גֵאַלְנוּךָ
  choice: « t’avons-nous souillé »
  alternative: « avons-nous souillé ton autel ? » ou « l’avons-nous souillé ? »
  rationale: L’hébreu s’adresse explicitement à Dieu au singulier. Le texte présente ainsi le mépris de l’autel comme une offense faite à Dieu lui-même; cette tension rhétorique doit être conservée.
- issue: Portée sacrificielle de לֶחֶם
  choice: « nourriture »
  alternative: « pain »
  rationale: Dans le cadre de l’autel et des sacrifices, le mot dépasse vraisemblablement le seul pain. « Nourriture » communique cette portée sans supprimer la métaphore de la table.
- issue: Représentation du nom divin יְהוָה
  choice: « Yahweh »
  alternative: « le SEIGNEUR »
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu, sans lui substituer un titre.
translation_notes:
  register: Français moderne, international et digne. Le verset garde la structure d’accusation et de réponse, l’adresse directe à Dieu ainsi que la métaphore cultuelle de la table. « Souillée » maintient une tonalité rituelle et morale compréhensible.
