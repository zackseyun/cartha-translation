language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
translation:
  language: fr
  text: 'Et maintenant, implorez donc la faveur de Dieu[a], afin qu’il nous fasse grâce. Cela est venu de votre main[b] : accueillera-t-il favorablement l’un de vous ? dit Yahweh des armées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « implorez donc la face de Dieu » ; cette expression signifie rechercher sa faveur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Cela est venu de votre main ; acceptera-t-il l’un de vous ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Reproduit simplement la transition hébraïque et rattache l’exhortation au reproche précédent.
- source_word: חַלּוּ נָא פְנֵי אֵל
  choice: cherchez donc la faveur de Dieu
  rationale: Littéralement « implorez donc la face de Dieu ». En français actuel, cette formulation rend naturellement l’idiome qui signifie solliciter sa faveur, tandis que la note conserve l’image hébraïque.
- source_word: וִיחָנֵּנוּ
  choice: pour qu’il nous fasse grâce
  rationale: Le verbe חנן exprime l’octroi bienveillant de la faveur; la construction après l’impératif se comprend naturellement comme le but recherché.
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  choice: Cela vient de votre main
  rationale: Conserve l’image de la main comme source ou agent des actes condamnés, dans un français clair. Le présent exprime la responsabilité actuelle sans exclure la portée accomplie de l’hébreu.
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  choice: accueillera-t-il favorablement l’un de vous ?
  rationale: L’idiome « relever/porter le visage » désigne ici l’accueil favorable ou l’acceptation. Cette formulation maintient la question rhétorique sans suggérer nécessairement une partialité injuste.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin personnel et rend צְבָאוֹת par « armées », terme français courant qui conserve la dimension souveraine et militaire du titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Portée de הֲיִשָּׂא מִכֶּם פָּנִים
  choice: accueillera-t-il favorablement l’un de vous ?
  alternative: fera-t-il preuve de partialité envers vous ?
  rationale: Dans ce contexte d’offrandes défectueuses, la question porte surtout sur l’acceptation des prêtres par Dieu. Le choix évite d’imposer au verset une discussion abstraite sur la partialité divine.
- issue: Référence du pronom dans וִיחָנֵּנוּ
  choice: nous
  alternative: vous
  rationale: Le texte massorétique porte explicitement le suffixe de première personne du pluriel; il est donc conservé, même si l’ironie prophétique ou la voix des prêtres demeure ouverte à l’interprétation.
translation_notes:
  register: Français international moderne, digne et direct. L’expression idiomatique concernant la « face » est explicitée dans le corps du texte, avec conservation de l’image littérale en note. La ponctuation maintient le lien accusateur entre la conduite des prêtres et la question rhétorique.
