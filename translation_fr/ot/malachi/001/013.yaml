    rationale: Le waw relie les deux accusations sans signaler nécessairement une étape ultérieure.
  - severity: medium
    issue: La reformulation « voilà l’offrande que vous présentez ! » est plus interprétative que le texte source.
    rationale: L’hébreu répète simplement le verbe « apporter » avec « l’offrande » ; « c’est ainsi que vous apportez l’offrande » maintient cette structure et la portée rhétorique.
  - severity: low
    issue: « une bête volée » explicite un substantif qui n’est pas exprimé dans le premier terme de la liste.
    rationale: Le contexte sacrificiel rend l’inférence plausible, mais « ce qui est volé » respecte mieux la formulation ouverte de גָּזוּל.
