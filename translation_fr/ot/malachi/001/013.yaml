revisions:
- from: 'Et vous dites : « Que c’est pénible ! » Puis vous soufflez dessus avec mépris[a], dit Yahweh des armées[b]. Vous apportez une bête volée, une bête boiteuse ou malade : voilà l’offrande que vous présentez ! Pourrais-je l’agréer de votre main ? dit Yahweh.'
  to: 'Et vous dites : « Quelle fatigue ! » Vous soufflez dessus avec mépris[a], dit Yahweh des armées[b]. Vous apportez ce qui est volé, ce qui est boiteux et ce qui est malade ; c’est ainsi que vous apportez l’offrande. Pourrais-je l’agréer de votre main ? dit Yahweh.'
  rationale: La révision conserve les choix terminologiques solides du projet, tout en évitant l’ajout temporel de « Puis », l’explicitation répétée de « bête » et l’intensification de la dernière clause sur l’offrande. Elle préserve l’image concrète et ambiguë du geste de mépris, ainsi que la syntaxe accusatrice du texte hébreu.
  reviewer_model: gpt-5.6-terra
