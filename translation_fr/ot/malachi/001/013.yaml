source:
  edition: WLC
  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
translation:
  language: fr
  text: 'Et vous dites : « Quelle fatigue ! » Vous soufflez dessus avec mépris[a], dit Yahweh des armées[b]. Vous apportez ce qui est volé, ce qui est boiteux et ce qui est malade ; c’est ainsi que vous apportez l’offrande. Pourrais-je l’agréer de votre main ? dit Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu évoque littéralement le fait de souffler sur quelque chose ; ce geste exprime ici le mépris.
    reason: lexical_alternative
  - marker: b
    text: Le titre « Yahweh des armées » peut évoquer les armées célestes placées sous son autorité.
    reason: cultural_note
lexical_decisions:
- source_word: מַתְּלָאָה
  choice: Que c’est pénible !
  rationale: Le nom exprime la fatigue, la peine ou une charge accablante. Cette exclamation française naturelle rend la plainte méprisante des prêtres sans la réduire au simple ennui.
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  choice: Puis vous soufflez dessus avec mépris
  rationale: Le verbe נפח évoque concrètement le fait de souffler. L’ajout « avec mépris » explicite la valeur gestuelle du souffle dans ce contexte, tandis que « dessus » maintient le pronom masculin singulier du texte massorétique.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » transcrit le nom divin, et « des armées » conserve l’image du titre hébreu plutôt que de la remplacer par une qualification abstraite comme « Tout-Puissant ».
- source_word: גָּזוּל
  choice: une bête volée
  rationale: Le participe désigne ce qui a été pris par vol ou rapine. Dans la liste parallèle des animaux boiteux et malades, « une bête volée » rend explicite le référent animal déjà imposé par le contexte sacrificiel.
- source_word: הַפִּסֵּחַ
  choice: une bête boiteuse
  rationale: Le terme désigne ici un animal atteint d’un défaut qui le fait boiter. La formulation est claire et respecte le contexte des sacrifices.
- source_word: הַחוֹלֶה
  choice: une bête malade
  rationale: Le participe adjectival signifie « malade ». La coordination française évite une répétition lourde tout en gardant la catégorie distincte.
- source_word: הַמִּנְחָה
  choice: l’offrande
  rationale: מִנְחָה peut désigner un don, une offrande ou, dans certains contextes, une offrande végétale. Ici, le contexte animal exige le sens général « offrande ».
- source_word: הַאֶרְצֶה אֹתָהּ
  choice: Pourrais-je l’agréer ?
  rationale: Dans le langage sacrificiel, רצה signifie recevoir favorablement ou agréer. Le conditionnel français rend la question rhétorique et réprobatrice sans transformer celle-ci en simple prédiction.
- source_word: מִיֶּדְכֶם
  choice: de votre main
  rationale: La formulation conserve l’image concrète de la réception depuis la main des offrants, compréhensible en français biblique moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: Tout-Puissant
  rationale: Le rendu formel maintient l’imagerie des armées, possiblement célestes, et évite d’aplanir le titre en une affirmation générale de toute-puissance.
- issue: Objet du mépris dans וְהִפַּחְתֶּם אֹתוֹ
  choice: dessus, conformément au pronom « le » du texte massorétique
  alternative: sur moi / à mon égard
  rationale: La traduction suit le texte fourni sans décider que le mépris vise grammaticalement Dieu lui-même. Le contexte laisse néanmoins entendre que mépriser le service sacrificiel offense Yahweh.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. « Que c’est pénible ! » restitue une plainte orale naturelle ; « agréer » conserve le registre cultuel sans être obscur. Les répétitions rhétoriques sont préservées, mais la liste des animaux est légèrement explicitée pour être idiomatique en français.
