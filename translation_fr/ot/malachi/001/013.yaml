review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : plainte devant le service cultuel, geste de mépris, offrandes volées ou défectueuses, puis question rhétorique de Yahweh. Toutefois, « Puis » introduit une succession temporelle absente de l’hébreu, et « voilà l’offrande que vous présentez ! » amplifie la formulation répétitive « vous apportez l’offrande » au-delà de ce qui est nécessaire.'
  naturalness: « Que c’est pénible ! » est idiomatique, mais « Quelle fatigue ! » rend plus directement l’exclamation nominale hébraïque. « Vous soufflez dessus avec mépris » est compréhensible et conserve l’image, mais « dessus » reste volontairement référentiel et sonne quelque peu concret ; la note explique utilement le geste. « C’est ainsi que vous apportez l’offrande » est naturel tout en conservant la force accusatrice de la répétition.
  terminology: « Yahweh des armées », « offrande », « boiteuse », « malade » et « agréer » sont appropriés. Le texte hébreu ne dit pas explicitement « bête » pour l’élément volé ; le contexte permet de comprendre qu’il s’agit d’une victime animale, mais il est préférable de ne pas l’expliciter dans chaque membre de la liste. « De votre main » préserve correctement l’image hébraïque.
