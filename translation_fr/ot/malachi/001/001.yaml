  text: מַשָּׂ֥א דְבַר יְהוָ֖ה אֶל יִשְׂרָאֵ֑ל בְּ/יַ֖ד מַלְאָכִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/001.yaml
  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: fr
  text: 'Oracle[a] : parole du SEIGNEUR adressée à Israël par l’intermédiaire de Malachie.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fardeau ». Dans les titres prophétiques, le mot hébreu désigne habituellement un oracle, tout en pouvant évoquer littéralement une charge pesante.'
    reason: Rend compte de l’emploi prophétique de מַשָּׂא et de sa nuance lexicale sans supprimer l’ambiguïté.
  - marker: b
    text: Le nom Malachie peut signifier « mon messager ».
    reason: Signale le sens possible de מַלְאָכִי sans décider s’il s’agit ici d’un nom propre ou d’une désignation.
lexical_decisions:
- source_word: מַשָּׂא
  choice: fardeau
  rationale: Le terme désigne une proclamation prophétique tout en évoquant littéralement une charge portée. « Fardeau » conserve cette image et la gravité du message, sans réduire le mot au seul sens technique d’« oracle ».
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Cette convention française rend respectueusement le tétragramme divin YHWH et permet de le distinguer du titre ordinaire « Seigneur ».
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’expression signifie littéralement « par la main de » et indique ici que Malachie est le messager ou médiateur humain de la parole.
- source_word: מַלְאָכִי
  choice: Malachie
  rationale: Forme française traditionnelle du nom hébreu, convenant ici à l’identification du prophète.
theological_decisions:
- issue: Nature de מַשָּׂא
  choice: Conserver l’image de la charge avec « fardeau »
  alternative: « oracle » ou « proclamation »
  rationale: Le choix maintient la tension entre le sens imagé de poids à porter et l’emploi du mot comme désignation d’un message prophétique.
- issue: Rôle de Malachie dans la transmission
  choice: « par l’intermédiaire de Malachie »
  alternative: « par la main de Malachie »
  rationale: La formulation indique une médiation prophétique sans suggérer que Malachie serait l’auteur premier de la parole.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe reste proche de la formulation hébraïque, tandis que « par l’intermédiaire de » évite le calque peu naturel « par la main de ». Le deux-points conserve la fonction de titre introductif du verset.
