id: MAL.1.12
reference: Malachi 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
translation:
  language: fr
  text: 'Mais vous, vous le profanez en disant[a] : « La table du Seigneur est souillée, et son fruit, sa nourriture[b], est méprisé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom peut renvoyer au nom du Seigneur, mentionné au verset précédent, ou directement au Seigneur lui-même.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « son fruit, sa nourriture ». Cette expression désigne probablement les aliments offerts sur l’autel, présenté ici comme une table.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחַלְּלִים
  choice: vous le profanez
  rationale: Le verbe חלל au piel signifie ici traiter comme profane ce qui est saint. « Profaner » conserve la portée cultuelle et religieuse du terme.
- source_word: אוֹתוֹ
  choice: le
  rationale: Le pronom renvoie très probablement au « nom » du Seigneur mentionné au verset précédent; « le » reprend naturellement le nom en français. Un renvoi direct au Seigneur reste possible et produit la même forme pronominale française.
- source_word: בֶּאֱמָרְכֶם
  choice: en disant
  rationale: 'La préposition avec l''infinitif construit exprime ici le moyen ou la circonstance : leur profanation se manifeste par leurs paroles.'
- source_word: שֻׁלְחַן אֲדֹנָי
  choice: la table du Seigneur
  rationale: Cette formulation naturelle conserve l'image cultuelle de l'autel présenté comme la table du Seigneur.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte porte le titre אֲדֹנָי, et non le tétragramme; « Seigneur » traduit donc le titre divin sans l'assimiler à YHWH.
- source_word: מְגֹאָל
  choice: souillée
  rationale: Le participe passif désigne ce qui est rendu impur ou profané. « Souillée » convient au contexte sacrificiel et s'accorde avec « table ».
- source_word: נִיבוֹ
  choice: son fruit
  rationale: ניב désigne littéralement le fruit ou le produit. Le rendu direct maintient l'expression condensée de l'hébreu.
- source_word: נִבְזֶה
  choice: est méprisé
  rationale: La forme exprime que la chose est tenue pour méprisable. « Est méprisé » restitue clairement cette valeur passive.
- source_word: אָכְלוֹ
  choice: sa nourriture
  rationale: Le mot signifie littéralement « sa nourriture ». Placé après « son fruit », il précise en apposition ce qui est offert ou consommé sur la table-autel.
theological_decisions:
- issue: Référent du pronom objet dans « vous le profanez »
  choice: Le pronom renvoie probablement au nom du Seigneur mentionné en Malachie 1.11.
  alternative: Le pronom peut renvoyer directement au Seigneur lui-même.
  rationale: Le contexte immédiat porte sur le nom du Seigneur. Toutefois, le masculin français « le » convient aussi bien à « nom » qu'à « Seigneur »; une note signale donc l'ambiguïté réelle sans la résoudre artificiellement.
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: La forme hébraïque est אֲדֹנָי et non YHWH. La distinction est conservée en réservant une convention particulière au tétragramme.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Mais vous, vous » rend l'emphase du pronom hébreu. La formulation conserve l'image cultuelle, la syntaxe appositionnelle condensée et l'ambiguïté du pronom objet.
