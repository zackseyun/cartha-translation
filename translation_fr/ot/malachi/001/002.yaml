base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
translation:
  language: fr
  text: '« Je vous ai aimés, dit Yahweh. Mais vous dites[a] : “Comment nous as-tu aimés ?” Ésaü n’était-il pas le frère de Jacob ? — déclaration de Yahweh. Pourtant, j’ai aimé Jacob. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi rendre les verbes hébreux par le passé simple : « Je vous aimai… Comment nous aimas-tu ?… Pourtant, j’aimai Jacob. » Les formes accomplies hébraïques ne correspondent pas mécaniquement à un seul temps français ; le contexte peut leur donner une portée présente.'
    reason: Préserver la nuance aspectuelle des formes verbales hébraïques et signaler une possibilité de rendu français sans altérer le contraste de la dernière proposition.
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Je vous ai aimés
  rationale: Le qatal qal à la 1re personne du singulier est rendu au passé composé, qui exprime naturellement en français un amour manifesté dans le passé et pertinent dans le présent, sans le paraphraser par « choisir ».
- source_word: אָמַר יְהוָה
  choice: dit Yahweh
  rationale: La formule prophétique est rendue au présent français. Le nom divin est translittéré afin de représenter directement le tétragramme du texte hébreu.
- source_word: וַאֲמַרְתֶּם
  choice: Mais vous dites
  rationale: Le présent convient au débat prophétique mis en scène, et « mais » explicite la valeur adversative naturelle de la conjonction dans ce contexte.
- source_word: בַּמָּה אֲהַבְתָּנוּ
  choice: Comment nous as-tu aimés ?
  rationale: « Comment » rend idiomatiquement l’interrogatif « de quelle manière ? », tandis que le passé composé maintient le parallélisme avec la déclaration initiale.
- source_word: הֲלוֹא אָח עֵשָׂו לְיַעֲקֹב
  choice: Ésaü n’était-il pas le frère de Jacob ?
  rationale: La question négative garde sa force rhétorique et appelle l’assentiment; la relation introduite par לְ est exprimée naturellement par « le frère de Jacob ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Cette formule oraculaire solennelle est distinguée de la première formule de parole tout en restant naturelle en français.
- source_word: וָאֹהַב אֶת יַעֲקֹב
  choice: Pourtant, j’ai aimé Jacob
  rationale: « Pourtant » rend le contraste contextuel entre la fraternité d’Ésaü avec Jacob et l’amour affirmé pour Jacob, sans préciser davantage la nature de cet amour.
theological_decisions:
- issue: Faut-il expliciter l’amour divin comme élection ou amour d’alliance ?
  choice: Conserver le verbe simple « aimer »
  alternative: « choisir » ou « porter sur lui mon amour d’alliance »
  rationale: Le texte emploie le verbe courant אהב. Le contexte peut donner à cet amour une portée d’alliance ou d’élection, mais l’expliciter dans le texte principal résoudrait une tension que l’hébreu laisse implicite.
- issue: Représentation du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel / Yahvé
  rationale: La translittération représente le nom propre présent dans la source sans le remplacer par un titre; la forme « Yahweh » est largement identifiable dans un cadre international.
translation_notes:
  register: Français international actuel, clair et digne. Le tutoiement singulier dans « as-tu » s’adresse à Yahweh; « vous » désigne collectivement le peuple. Les guillemets distinguent les voix du débat prophétique.
