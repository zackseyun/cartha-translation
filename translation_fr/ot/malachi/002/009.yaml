source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
translation:
  language: fr
  text: Ainsi, moi aussi, je vous ai rendus méprisés et abaissés devant tout le peuple, parce que vous ne gardez pas mes voies et que vous faites preuve de partialité dans la Loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’instruction » ou « dans la Torah ».'
    reason: Alternative lexicale pour תּוֹרָה, qui peut désigner la loi, l’enseignement ou la Torah.
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Ainsi, moi aussi
  rationale: Le groupe relie la sentence à la faute précédemment dénoncée, tout en soulignant l’action réciproque de Dieu par le pronom emphatique.
- source_word: נָתַתִּי אֶתְכֶם
  choice: je vous ai rendus
  rationale: 'Avec les adjectifs prédicatifs qui suivent, נתן a ici une valeur résultative : Dieu les a fait devenir tels aux yeux du peuple.'
- source_word: נִבְזִים וּשְׁפָלִים
  choice: méprisables et abaissés
  rationale: « Méprisables » exprime le fait d’être tenu en mépris, tandis que « abaissés » conserve l’image d’un statut devenu bas sans imposer la nuance psychologique de « humiliés ».
- source_word: לְכָל הָעָם
  choice: aux yeux de tout le peuple
  rationale: Cette formulation française naturelle rend la sphère publique dans laquelle leur déchéance est manifeste.
- source_word: כְּפִי אֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte, l’expression introduit le fondement causal de la sanction.
- source_word: אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  choice: vous ne suivez pas mes voies
  rationale: « Suivre mes voies » rend idiomatiquement l’obéissance à la conduite prescrite par Dieu, tout en conservant la métaphore des voies.
- source_word: וְנֹשְׂאִים פָּנִים
  choice: vous faites preuve de partialité
  rationale: L’expression idiomatique signifie favoriser certaines personnes ou traiter les cas avec parti pris.
- source_word: בַּתּוֹרָה
  choice: dans l’application de la Loi
  rationale: La préposition ב avec תּוֹרָה peut désigner le domaine dans lequel les prêtres manifestent leur partialité. « Dans l’application de » explicite naturellement ce rapport en français, tandis que la note préserve les autres valeurs possibles de תּוֹרָה.
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte sacerdotal
  choice: la Loi
  alternative: l’instruction ; la Torah
  rationale: « La Loi » convient au cadre d’autorité et de jugement, mais le terme hébreu peut aussi désigner plus largement l’enseignement ou, avec une désignation hébraïque, la Torah. La note maintient cette ouverture lexicale.
- issue: Portée de l’abaissement public
  choice: méprisables et abaissés aux yeux de tout le peuple
  alternative: méprisés et humiliés devant tout le peuple
  rationale: Le texte présente la sanction divine comme une perte publique de considération et de statut. Le choix retenu conserve les adjectifs de résultat et l’image de l’abaissement sans accentuer la dimension émotionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme accusatoire du verset. « Ainsi, moi aussi » conserve l’emphase divine ; « abaissés » maintient la métaphore de la perte de rang. Le marqueur [a] figure immédiatement après le syntagme concerné.
