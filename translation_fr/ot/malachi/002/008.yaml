id: MAL.2.8
reference: Malachi 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
translation:
  language: fr
  text: Mais vous, vous vous êtes écartés du chemin. Vous avez fait trébucher beaucoup de gens par l’enseignement[a] et vous avez corrompu l’alliance de Lévi, déclare Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la Loi » ou « dans la Loi ». Le mot hébreu torah peut signifier « enseignement » ou « Loi ».
    reason: Préserver l’étendue sémantique de תּוֹרָה et l’ambiguïté de la préposition ב.
lexical_decisions:
- source_word: סַרְתֶּם מִן הַדֶּרֶךְ
  choice: vous vous êtes écartés du chemin
  rationale: Conserve l’image d’un abandon du chemin, tout en employant une tournure française naturelle.
- source_word: הִכְשַׁלְתֶּם רַבִּים
  choice: vous avez fait trébucher beaucoup de gens
  rationale: Le hifil de כשל est causatif. « Faire trébucher » préserve à la fois l’image et sa portée morale ou spirituelle.
- source_word: בַּתּוֹרָה
  choice: par l’enseignement
  rationale: Dans ce contexte sacerdotal, תּוֹרָה peut désigner l’enseignement transmis par les prêtres. « Par » rend la valeur instrumentale possible de ב, sans masquer les autres analyses, signalées en note.
- source_word: שִׁחַתֶּם
  choice: vous avez corrompu
  rationale: Le piel de שׁחת exprime ici l’idée de gâter, ruiner ou corrompre. « Corrompu » convient au contexte d’alliance sans réduire le sens à une simple infraction juridique.
- source_word: בְּרִית הַלֵּוִי
  choice: l’alliance de Lévi
  rationale: Rend directement le groupe construit hébreu et laisse ouverte la question de savoir si Lévi désigne la figure ancestrale ou le sacerdoce lévitique qui lui est associé.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et conserve la forme traditionnelle du titre צְבָאוֹת sans en restreindre artificiellement la portée.
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte sacerdotal
  choice: l’enseignement
  alternative: la Loi; dans la Loi
  rationale: Le devoir sacerdotal d’instruire favorise « enseignement », mais le mot peut aussi désigner la Loi et la préposition ב peut recevoir plusieurs nuances. La note conserve cette ambiguïté.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa transcription permet de préserver le nom d’alliance sans le remplacer par un titre.
- issue: Référent de « l’alliance de Lévi »
  choice: formulation littérale sans explicitation
  alternative: l’alliance avec Lévi; l’alliance lévitique
  rationale: La formulation française retenue suit l’hébreu et évite de trancher entre une alliance conclue avec Lévi et une alliance associée au sacerdoce lévitique.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Mais vous, vous » marque naturellement le contraste emphatique de וְאַתֶּם. Les deux-points-virgules potentiellement lourds ont été remplacés par deux phrases, sans modifier la progression du reproche.
