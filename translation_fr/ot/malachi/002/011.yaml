source:
  edition: WLC
  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
translation:
  language: fr
  text: Juda a été infidèle, et une abomination a été commise en Israël et à Jérusalem, car Juda a profané ce qui est consacré à Yahweh[a], qu’il aime, et il a épousé la fille d’un dieu étranger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se comprendre comme « la sainteté de Yahweh », « le sanctuaire de Yahweh » ou « le peuple saint de Yahweh ». La proposition relative peut également se traduire « qu’il aimait ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « la fille d’un dieu étranger » ; l’expression désigne vraisemblablement une femme attachée au culte d’un dieu étranger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּגְדָה
  choice: a été infidèle
  rationale: Le verbe בגד exprime une conduite déloyale ou perfide, souvent dans un cadre d’alliance. « A été infidèle » est naturel en français et conserve cette portée relationnelle et morale.
- source_word: תוֹעֵבָה
  choice: une abomination
  rationale: « Abomination » garde la forte valeur cultuelle et morale de תועבה dans le discours prophétique.
- source_word: נֶעֶשְׂתָה
  choice: a été commise
  rationale: Cette formulation respecte le passif hébreu et s’emploie naturellement avec « abomination ».
- source_word: חִלֵּל
  choice: a profané
  rationale: Le verbe חלל désigne ici le fait de traiter comme profane ce qui est saint; « profaner » restitue précisément ce contraste.
- source_word: קֹדֶשׁ יְהוָה
  choice: ce qui est saint pour Yahweh
  rationale: La construction peut désigner la sainteté, le sanctuaire, une réalité consacrée ou le peuple saint. Cette formulation française reste intelligible tout en évitant de fixer un référent que l’hébreu laisse ambigu.
- source_word: אֲשֶׁר אָהֵב
  choice: que celui-ci aime
  rationale: Le parfait אָהֵב peut exprimer ici un état durable. « Celui-ci » indique sans lourdeur que Yahweh est le sujet d’« aime », tout en laissant ouvert le référent de la proposition relative.
- source_word: וּבָעַל
  choice: et il a épousé
  rationale: Avec une femme comme complément, בעל signifie naturellement devenir son mari, donc l’épouser.
- source_word: בַּת אֵל נֵכָר
  choice: la fille d’un dieu étranger
  rationale: La traduction littérale préserve la dimension religieuse et polémique de l’expression, sans la réduire à la seule origine ethnique de la femme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Référent de קֹדֶשׁ יְהוָה
  choice: ce qui est saint pour Yahweh
  alternative: la sainteté de Yahweh; le sanctuaire de Yahweh; le peuple saint de Yahweh
  rationale: L’hébreu ne permet pas de trancher avec certitude entre une qualité abstraite et une réalité consacrée telle que le sanctuaire ou le peuple. La traduction choisie conserve cette tension sans devenir obscure en français.
- issue: Antécédent et sujet dans אֲשֶׁר אָהֵב
  choice: que celui-ci aime
  alternative: qu’il aimait; que Juda aime
  rationale: Le masculin singulier permet grammaticalement plusieurs rattachements, mais le sens le plus probable est que Yahweh aime ce qui lui est saint. La note signale toutefois l’ambiguïté de la construction.
- issue: Sens de « fille d’un dieu étranger »
  choice: conserver l’expression littérale et religieusement marquée
  alternative: une femme étrangère; une femme attachée au culte d’un dieu étranger
  rationale: Le contexte dénonce une infidélité liée au culte étranger, pas simplement une différence ethnique. La formulation littérale préserve cette accusation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Infidèle », « abomination » et « profané » maintiennent le registre prophétique et cultuel. La ponctuation en deux phrases améliore la lisibilité sans modifier la logique causale du verset.
