  terminology: « Perfidie », « compagne » et « alliance » conservent avec justesse la gravité relationnelle et covenantale du verset. « Ton épouse par alliance » rend plus directement אֵשֶׁת בְּרִיתֶךָ que la périphrase actuelle, sans imposer une interprétation plus précise de la faute.
