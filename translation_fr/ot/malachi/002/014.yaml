id: MAL.2.14
reference: Malachi 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
translation:
  language: fr
  text: 'Mais vous dites : « Pourquoi ? » Parce que Yahweh est témoin entre toi et la femme de ta jeunesse, envers laquelle tu as agi avec perfidie[a], alors qu’elle est ta compagne et ton épouse par alliance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que tu as trahie » ou « envers laquelle tu as manqué de loyauté ». Le verbe hébreu évoque la perfidie, la trahison ou le manquement à la fidélité, notamment dans le cadre d’une alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la femme de ton alliance »; on pourrait aussi traduire : « la femme à laquelle tu es lié par alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Mais vous demandez
  rationale: Le waw introduit ici l’objection du peuple. « Mais » marque naturellement la réplique, et « demandez » convient à la question directe qui suit.
- source_word: עַל־מָה
  choice: Pourquoi ?
  rationale: Cette tournure idiomatique demande le motif; « Pourquoi ? » en restitue simplement la force.
- source_word: עַל כִּי
  choice: Parce que
  rationale: La locution introduit la réponse à la question précédente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הֵעִיד
  choice: a été témoin
  rationale: Le hiphil de עוד présente Yahweh comme témoin dans un cadre relationnel et juridique; le passé composé exprime naturellement en français le témoignage établi et toujours pertinent.
- source_word: בֵּינְךָ וּבֵין
  choice: entre toi et
  rationale: Cette traduction respecte la construction relationnelle hébraïque et le passage du pluriel de l’objection au singulier représentatif de l’accusation.
- source_word: אֵשֶׁת נְעוּרֶיךָ
  choice: la femme de ta jeunesse
  rationale: 'La formulation conserve l’image hébraïque et sa portée affective: l’épouse à laquelle l’homme s’est uni dans sa jeunesse.'
- source_word: אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ
  choice: envers laquelle tu as agi avec perfidie
  rationale: בגד exprime une conduite déloyale ou traîtresse, particulièrement grave dans un contexte d’alliance. Cette formulation conserve cette force sans réduire nécessairement le sens à l’adultère.
- source_word: וְהִיא
  choice: alors qu’elle est
  rationale: 'Dans le raisonnement, la conjonction a une valeur concessive: la perfidie est d’autant plus condamnable qu’elle est sa compagne et son épouse liée par alliance.'
- source_word: חֲבֶרְתְּךָ
  choice: ta compagne
  rationale: « Compagne » exprime une relation étroite et durable et s’intègre naturellement au contexte conjugal.
- source_word: אֵשֶׁת בְּרִיתֶךָ
  choice: la femme à laquelle tu es lié par alliance
  rationale: Cette formulation française explicite le rapport syntaxique tout en préservant l’idée que le mariage constitue ici une alliance.
theological_decisions:
- issue: La perfidie dans le cadre de l’alliance conjugale
  choice: Conserver à la fois la gravité de בגד et la mention explicite de l’alliance matrimoniale.
  alternative: Traduire plus généralement par « tu as été infidèle » et « ta femme légitime ».
  rationale: La proximité de בגד et ברית donne à la faute une portée relationnelle, juridique et alliancielle. « Agir avec perfidie » évite toutefois de préciser au-delà du texte la forme exacte de la trahison.
- issue: Yahweh comme témoin
  choice: Présenter Yahweh comme témoin entre l’homme et son épouse.
  alternative: Rendre הֵעִיד par « a témoigné contre toi ».
  rationale: La construction בֵּינְךָ וּבֵין désigne explicitement les deux parties entre lesquelles Yahweh est témoin. Une formulation exclusivement accusatoire serait possible en contexte judiciaire, mais moins proche de la syntaxe.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve le passage rhétorique du « vous » collectif au « toi » singulier représentatif. « Femme » est retenu plutôt qu’« épouse » dans les deux expressions construites avec אֵשֶׁת afin de préserver leur parallélisme, tandis que la formulation finale rend explicite leur sens conjugal et allianciel.
