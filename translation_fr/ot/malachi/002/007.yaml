    issue: 'Collocation française peu naturelle : « rechercher l’instruction de sa bouche ».'
    rationale: En français, on cherche l’instruction « auprès de » quelqu’un; « de sa bouche » sonne comme un calque syntaxique et peut obscurcir le sens.
  - severity: low
    issue: 'Note b : « armées célestes » est une expansion interprétative.'
    rationale: צבאות signifie « armées »; la qualification « célestes » n’est pas exprimée dans le titre hébreu. L’alternative traditionnelle française pertinente est « l’Éternel des armées ».
