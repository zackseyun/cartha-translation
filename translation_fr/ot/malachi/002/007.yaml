id: MAL.2.7
reference: Malachi 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
translation:
  language: fr
  text: Car les lèvres d’un prêtre doivent conserver la connaissance, et l’on doit chercher auprès de lui l’instruction[a], car il est le messager du SEIGNEUR des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la loi » ou « l’enseignement » (hébreu : torah).'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  choice: les lèvres d’un prêtre
  rationale: La construction hébraïque désigne littéralement les lèvres d’un prêtre et présente celui-ci comme représentant de sa fonction, sans viser nécessairement un individu précis.
- source_word: יִשְׁמְרוּ
  choice: doivent garder
  rationale: Dans ce contexte de reproche adressé aux prêtres, l’imparfait exprime ce qui est attendu d’eux plutôt qu’une simple prédiction. « Doivent garder » conserve cette valeur normative.
- source_word: דַעַת
  choice: la connaissance
  rationale: Ce terme désigne ici la connaissance juste de Dieu et de ses voies dans le cadre de l’enseignement de l’alliance, et non une simple accumulation d’informations.
- source_word: וְתוֹרָה
  choice: l’instruction
  rationale: Dans ce contexte, torah désigne l’enseignement autorisé que l’on vient chercher auprès du prêtre. « Instruction » évite de restreindre le sens à la seule législation.
- source_word: יְבַקְשׁוּ מִפִּיהוּ
  choice: l’on doit rechercher … de sa bouche
  rationale: Le sujet du verbe pluriel est implicite et indéfini. Le pronom français « on » rend naturellement cette portée générale, tandis que « de sa bouche » conserve l’image de la transmission orale.
- source_word: מַלְאַךְ
  choice: messager
  rationale: Le mot désigne ici le prêtre chargé de transmettre la parole divine, et non un être céleste.
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: « Le SEIGNEUR » suit la convention de traduction révérencielle du tétragramme, et « des armées » rend de façon transparente le titre צְבָאוֹת.
theological_decisions:
- issue: Valeur normative ou prédictive des imparfaits
  choice: doivent garder / l’on doit rechercher
  alternative: garderont / rechercheront
  rationale: Le contexte dénonce le manquement des prêtres à leur vocation. Les verbes énoncent donc leur devoir plutôt qu’un événement futur certain.
- issue: Traduction du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: Yahvé / l’Éternel
  rationale: La forme « le SEIGNEUR » maintient la convention révérencielle traditionnelle sans imposer une vocalisation reconstruite du nom divin.
- issue: Identité du מַלְאַךְ
  choice: messager
  alternative: ange
  rationale: Le référent immédiat est le prêtre dans sa mission d’enseignement; « ange » introduirait à tort un être céleste.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve les images hébraïques des « lèvres » et de la « bouche », tout en employant « l’on » pour rendre naturellement le sujet pluriel indéfini.
