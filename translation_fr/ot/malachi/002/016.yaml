source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
translation:
  language: fr
  text: Car il déteste le divorce[a], dit Yahvé, le Dieu d’Israël, et celui qui couvre son vêtement de violence, dit Yahvé des armées. Veillez donc sur vous-mêmes, dans votre esprit, et ne trahissez pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « Car je déteste le divorce, dit Yahvé, le Dieu d’Israël. » Le texte hébreu de ce passage est difficile et peut être compris de plusieurs manières.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « n’agissez pas avec perfidie » ou « ne soyez pas infidèles ». L’hébreu évoque une conduite déloyale dans une relation d’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’exhortation précédente.
- source_word: שָׂנֵא שַׁלַּח
  choice: il déteste le divorce
  rationale: La forme massorétique שָׂנֵא est à la troisième personne masculine du singulier; dans ce contexte conjugal, שַׁלַּח désigne le renvoi de l’épouse, donc le divorce.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahvé, le Dieu d’Israël
  rationale: Rend explicitement le nom divin et traduit naturellement le titre.
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  choice: ainsi que celui qui couvre son vêtement de violence
  rationale: Conserve l’image concrète et l’ambiguïté d’une proposition hébraïque très condensée; « ainsi que celui qui » relie les deux objets de la haine sans imposer une interprétation détaillée de la métaphore.
- source_word: חָמָס
  choice: violence
  rationale: Préserve la gravité du terme, qui peut englober violence, injustice et tort.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Expression française claire qui conserve la force du titre צְבָאוֹת.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Veillez donc sur votre esprit
  rationale: Rend l’appel réfléchi à la vigilance intérieure dans un français naturel et digne.
- source_word: וְלֹא תִבְגֹּדוּ
  choice: et ne trahissez pas
  rationale: בגד exprime une trahison de la fidélité due dans une relation d’alliance; « trahir » est direct et naturel en français.
theological_decisions:
- issue: Lecture à la troisième personne ou lecture traditionnelle à la première personne
  choice: « il déteste le divorce » dans le texte principal
  alternative: « Je déteste le divorce, dit Yahvé, le Dieu d’Israël »
  rationale: Le texte massorétique porte une forme de troisième personne masculine singulière. La note conserve la lecture traditionnelle sans corriger silencieusement un hébreu syntaxiquement difficile.
- issue: Rapport syntaxique entre la haine, le divorce et l’homme au vêtement couvert de violence
  choice: Comprendre « le divorce » et « celui qui couvre son vêtement de violence » comme deux réalités visées par « il déteste »
  alternative: « car il couvre son vêtement de violence » ou « et la violence couvre son vêtement »
  rationale: Cette construction produit un français cohérent tout en maintenant le parallélisme accusateur et la métaphore, mais l’hébreu demeure difficile et admet d’autres analyses.
- issue: Portée de בגד dans l’exhortation finale
  choice: « ne trahissez pas »
  alternative: « n’agissez pas avec perfidie » ou « ne soyez pas infidèles »
  rationale: Le choix garde la portée relationnelle et liée à l’alliance sans limiter explicitement le terme à l’adultère.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste lisible tout en préservant la difficulté du texte hébreu et l’image du vêtement couvert de violence. Le nom divin est rendu par « Yahvé » conformément à la couche anglaise fournie, malgré une note lexicale anglaise contradictoire mentionnant « the LORD ».
