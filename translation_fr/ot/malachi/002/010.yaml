  variant: modern international French
source:
  edition: WLC
  text: הֲ/ל֨וֹא אָ֤ב אֶחָד֙ לְ/כֻלָּ֔/נוּ הֲ/ל֛וֹא אֵ֥ל אֶֽחָ֖ד בְּרָאָ֑/נוּ מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
translation:
  language: fr
  text: N’avons-nous pas tous un seul Père[a] ? Un seul Dieu ne nous a-t-il pas créés ? Pourquoi donc sommes-nous infidèles, chacun envers son frère[b], profanant ainsi l’alliance de nos pères ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Un seul Père » peut désigner Dieu, comme le suggère le parallèle « un seul Dieu […] nous a créés » ; certains comprennent cependant l’expression comme une référence à un ancêtre commun.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Pourquoi donc agissons-nous avec perfidie, chacun envers son frère ? » Le verbe hébreu évoque une conduite traîtresse ou infidèle, notamment dans le cadre d’une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: N’avons-nous pas / ne nous a-t-il pas
  rationale: Introduit deux questions rhétoriques qui appellent une réponse affirmative ; cette tournure est naturelle en français.
- source_word: אָב אֶחָד
  choice: un seul Père
  rationale: Conserve le singulier, l’accent sur l’unité et l’ambiguïté du référent, sans préciser s’il s’agit directement de Dieu ou d’un ancêtre commun.
- source_word: לְכֻלָּנוּ
  choice: tous
  rationale: Rend idiomatiquement l’idée que ce Père est commun à l’ensemble du peuple.
- source_word: אֵל אֶחָד
  choice: un seul Dieu
  rationale: Traduction directe qui maintient l’insistance monothéiste et le parallélisme avec « un seul Père ».
- source_word: בְּרָאָנוּ
  choice: nous a-t-il pas créés
  rationale: « Créer » restitue la portée propre du verbe ברא avec Dieu pour sujet.
- source_word: מַדּוּעַ
  choice: Pourquoi donc
  rationale: « Donc » marque naturellement le lien logique entre l’origine commune affirmée et le reproche qui suit.
- source_word: נִבְגַּד
  choice: sommes-nous infidèles
  rationale: Exprime l’infidélité ou la traîtrise dans une relation d’alliance, tout en restant clair et digne en français moderne.
- source_word: אִישׁ בְּאָחִיו
  choice: chacun envers son frère
  rationale: Préserve la formulation distributive et les termes masculins du texte hébreu ; « envers » évite d’ajouter une nuance d’hostilité absente de la préposition elle-même.
- source_word: לְחַלֵּל
  choice: profanant ainsi
  rationale: Le participe français relie naturellement l’action à sa conséquence ; « profaner » conserve la gravité sacrée de la violation.
- source_word: בְּרִית אֲבֹתֵינוּ
  choice: l’alliance de nos pères
  rationale: Conserve la relation génitivale et la continuité de l’alliance avec les ancêtres.
theological_decisions:
- issue: Identité du « seul Père »
  choice: « un seul Père », sans explicitation dans le texte
  alternative: « un seul ancêtre » ou « Dieu, notre Père »
  rationale: Le parallélisme avec « un seul Dieu » suggère fortement Dieu, mais l’hébreu n’identifie pas explicitement le Père ; la traduction maintient cette tension.
- issue: Portée de l’infidélité
  choice: « sommes-nous infidèles, chacun envers son frère »
  alternative: « agissons-nous avec perfidie les uns envers les autres »
  rationale: La formulation choisie garde la dimension relationnelle et potentiellement liée à l’alliance sans réduire le verbe à la tromperie ordinaire.
- issue: Langage masculin de אִישׁ ... אָחִיו
  choice: « chacun envers son frère »
  alternative: « les uns envers les autres »
  rationale: Le choix conserve les termes masculins singuliers employés par l’hébreu, avec leur portée représentative dans l’adresse à la communauté.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques, le parallélisme, le vocabulaire de l’alliance et l’ambiguïté concernant le « Père » sont préservés.
