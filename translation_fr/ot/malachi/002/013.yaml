language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
translation:
  language: fr
  text: 'Et voici la deuxième chose que vous faites : vous couvrez l’autel de Yahweh de larmes, de pleurs et de gémissements, parce qu’il ne prête plus attention à l’offrande[a] et n’accepte plus avec faveur ce qui vient de vos mains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’offrande végétale ». Le mot hébreu peut désigner une offrande de céréales en particulier ou, plus largement, une offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  choice: Et voici la deuxième chose
  rationale: La formulation introduit naturellement en français un deuxième reproche tout en conservant la valeur ordinale de שֵׁנִית.
- source_word: תַּעֲשׂוּ
  choice: que vous faites
  rationale: Le présent convient à l’accusation prophétique portant sur une conduite actuelle ou habituelle.
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  choice: vous couvrez de larmes l’autel de Yahweh
  rationale: « Couvrir » conserve l’image concrète de כסה, sans l’intensifier artificiellement en « inonder ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּכִי וַאֲנָקָה
  choice: de pleurs et de gémissements
  rationale: Cette paire française exprime naturellement l’affliction audible indiquée par les deux noms hébreux.
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל
  choice: si bien qu’il ne prête plus attention à
  rationale: Dans ce contexte, פנה אל désigne le fait d’accorder son attention ou sa considération. « Si bien que » rend la conséquence manifeste de leur conduite sans réduire la locution à une simple causalité.
- source_word: הַמִּנְחָה
  choice: l’offrande
  rationale: מִנְחָה peut désigner précisément une offrande végétale, mais aussi plus largement un don cultuel; le terme général préserve ici cette amplitude.
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  choice: et n’accepte plus avec faveur ce qui vient de vos mains
  rationale: La formulation rend l’idée d’une réception favorable et conserve l’image de ce qui est présenté par les mains des adorateurs.
theological_decisions:
- issue: Sujet implicite de פְּנוֹת et לָקַחַת
  choice: Le pronom « il » renvoie à Yahweh.
  alternative: 'Employer une tournure impersonnelle : « il n’y a plus d’attention accordée à l’offrande » et « elle n’est plus reçue favorablement ».'
  rationale: La syntaxe hébraïque est condensée, mais le contexte immédiat identifie naturellement Yahweh comme celui qui ne considère ni n’agrée plus leur offrande.
- issue: Relation logique introduite par מֵאֵין עוֹד
  choice: 'Conséquence : « si bien qu’il ne… plus ».'
  alternative: 'Cause ressentie des pleurs : « parce qu’il ne… plus ».'
  rationale: L’hébreu exprime littéralement l’absence désormais de considération et de réception. La relation exacte peut être comprise diversement; la conséquence s’intègre bien à la chaîne de l’accusation sans attribuer explicitement aux larmes un motif psychologique.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre « vous couvrez de larmes l’autel » évite une ambiguïté momentanée tout en gardant l’image hébraïque. Le nom divin est rendu par « Yahweh » conformément au texte source.
