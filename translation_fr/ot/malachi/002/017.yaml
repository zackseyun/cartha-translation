language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
translation:
  language: fr
  text: 'Vous avez lassé Yahvé par vos paroles. Mais vous dites : « En quoi l’avons-nous lassé ? » En disant : « Quiconque fait le mal est bon aux yeux de Yahvé, et il prend plaisir en eux », ou encore : « Où est le Dieu de la justice[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu du jugement ».
    reason: מִשְׁפָּט peut désigner la justice comme ordre moral ou le jugement comme acte judiciaire.
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  choice: Vous fatiguez / l’avons-nous fatigué
  rationale: Le hiphil de יגע exprime ici le fait de causer de la fatigue ou de la lassitude. « Fatiguer » conserve l’anthropopathisme et son caractère direct en français actuel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du tétragramme préserve le nom divin plutôt que de lui substituer un titre.
- source_word: בְּדִבְרֵיכֶם
  choice: par vos paroles
  rationale: La préposition ב marque ici le moyen; « par vos paroles » l’exprime naturellement.
- source_word: בַּמָּה
  choice: En quoi
  rationale: Dans cette objection, la formule demande sous quel rapport ils ont fatigué Dieu. « En quoi » convient mieux que le plus général « comment ».
- source_word: בֶּאֱמָרְכֶם
  choice: C’est en disant
  rationale: La préposition avec l’infinitif construit explique précisément par quel moyen leurs propos fatiguent Yahvé.
- source_word: כָּל עֹשֵׂה רָע
  choice: Quiconque fait le mal
  rationale: Cette formulation rend la valeur générique et distributive du participe hébreu dans un français naturel.
- source_word: טוֹב
  choice: est bon
  rationale: Le sens simple de l’adjectif est conservé, ainsi que l’ironie accusatrice de l’affirmation.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahvé
  rationale: Cette expression garde l’image hébraïque de l’évaluation tout en étant idiomatique en français.
- source_word: וּבָהֶם הוּא חָפֵץ
  choice: c’est en de telles personnes qu’il prend plaisir
  rationale: חפץ exprime le plaisir ou la faveur. La reprise explicite évite en français l’ambiguïté possible du pronom « eux » tout en maintenant la référence aux personnes qui font le mal.
- source_word: אוֹ
  choice: ou encore
  rationale: אוֹ introduit une autre formulation de la même plainte cynique; « ou encore » rend clairement cette articulation.
- source_word: אַיֵּה
  choice: Où est
  rationale: L’interrogatif exprime directement une mise en doute provocatrice de la présence ou de l’action de Dieu.
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  choice: le Dieu de la justice
  rationale: Dans ce contexte, מִשְׁפָּט désigne principalement l’exercice du juste ordre moral, bien que le sens de « jugement » demeure possible.
theological_decisions:
- issue: Description anthropopathique de Dieu comme étant fatigué
  choice: Conserver la formulation personnelle « Vous fatiguez Yahvé »
  alternative: « Vous offensez Yahvé » ou « Vous lassez Yahvé »
  rationale: L’hébreu parle explicitement du fait de causer de la fatigue. Une abstraction comme « offenser » atténuerait l’image prophétique; la traduction maintient donc cette tension analogique.
- issue: Sens de מִשְׁפָּט dans la dernière proposition
  choice: justice
  alternative: jugement
  rationale: La plainte porte sur l’apparente absence du gouvernement moral juste de Dieu, et non seulement sur une sentence judiciaire. La note conserve néanmoins l’autre valeur lexicale authentique.
translation_notes:
  register: Français international moderne, direct et digne. Les questions et citations conservent la structure de controverse du texte hébreu. « Yahvé » maintient le nom divin; « quiconque » donne une légère solennité adaptée au registre prophétique sans archaïsme marqué.
