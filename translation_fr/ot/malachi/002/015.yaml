id: MAL.2.15
reference: Malachi 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ וּ/מָה֙ הָֽ/אֶחָ֔ד מְבַקֵּ֖שׁ זֶ֣רַע אֱלֹהִ֑ים וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
translation:
  language: fr
  text: Le Dieu unique ne les a-t-il pas faits[a] ? Pourtant, il avait encore une part de l’Esprit[b]. Et que recherchait l’Unique ? Une descendance selon Dieu[c]. Veillez donc sur votre esprit, et que personne ne trahisse la femme de sa jeunesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très difficile : littéralement, « Un seul n’a-t-il pas fait ? Et un reste d’esprit était à lui ? » D’autres comprennent : « Personne ayant encore un reste d’esprit n’a fait cela », ou voient en « l’un » une allusion à Abraham.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une part de l’esprit ». Le sens de toute cette proposition est incertain; on la traduit aussi : « il avait une abondance d’esprit ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « une descendance de Dieu »; autre traduction possible : « une descendance pieuse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֶחָד עָשָׂה
  choice: Le Dieu unique ne les a-t-il pas faits ?
  rationale: Le texte hébreu, extrêmement condensé, dit littéralement quelque chose comme « Et un seul n’a-t-il pas fait ? ». « Dieu » et l’objet « les » sont explicités d’après le contexte du mariage, tandis que la note conserve l’incertitude réelle.
- source_word: וּשְׁאָר רוּחַ לוֹ
  choice: Pourtant, il avait encore une part de l’Esprit
  rationale: שְׁאָר désigne ce qui reste, une part restante; רוּחַ peut désigner l’esprit ou l’Esprit. Cette formulation française reste intelligible sans transformer la proposition en affirmation d’une abondance spirituelle.
- source_word: וּמָה הָאֶחָד מְבַקֵּשׁ
  choice: Et que recherchait l’Unique ?
  rationale: La question et le participe « recherchant » sont maintenus. « L’Unique » reprend l’interprétation de אֶחָד comme désignant le Dieu unique, sans répéter lourdement « le Dieu unique ».
- source_word: זֶרַע אֱלֹהִים
  choice: Une descendance selon Dieu
  rationale: זֶרַע signifie « semence, descendance ». « Selon Dieu » rend naturellement en français la valeur qualitative possible du complément אֱלֹהִים, tandis que la note signale la traduction plus formelle « descendance de Dieu ».
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Veillez donc sur votre esprit
  rationale: Le niphal de שׁמר a ici une valeur réfléchie d’exhortation. « Veillez sur » est naturel et conserve l’attention portée à la disposition intérieure.
- source_word: וּבְאֵשֶׁת נְעוּרֶיךָ אַל יִבְגֹּד
  choice: et que personne ne trahisse la femme de sa jeunesse
  rationale: בגד exprime la perfidie ou la déloyauté, notamment envers une alliance. Le passage de la deuxième personne plurielle au verbe masculin singulier est rendu par l’interdiction générale « que personne ne ».
theological_decisions:
- issue: Identification de « un/l’unique » dans la première proposition
  choice: Le Dieu unique, créateur du couple
  alternative: « Un seul ne les a-t-il pas faits ? »; Abraham comme référent; ou « personne ayant encore un reste d’esprit n’a fait cela »
  rationale: Cette lecture s’accorde avec le contexte immédiat de l’alliance matrimoniale et donne une phrase française compréhensible. Comme la syntaxe hébraïque demeure notoirement difficile, les autres lectures principales sont exposées en note.
- issue: Référent de רוּחַ
  choice: l’Esprit
  alternative: l’esprit humain ou une force vitale
  rationale: La majuscule indique la possibilité d’une référence à l’Esprit divin dans un argument relatif à la création, sans prétendre que l’hébreu tranche la question; la variante est conservée en note.
- issue: Sens du génitif dans זֶרַע אֱלֹהִים
  choice: une descendance selon Dieu
  alternative: une descendance de Dieu
  rationale: Le génitif peut être qualitatif et désigner une descendance conforme à la volonté de Dieu. La formulation plus littérale reste possible et figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation privilégie la clarté dans le corps du texte, tout en signalant par trois notes l’opacité syntaxique du début du verset, l’ambiguïté de « esprit/Esprit » et celle de « descendance de Dieu ».
