  source_fidelity: Le texte rend de façon responsable une proposition hébraïque notoirement elliptique et disputée. « Le Dieu unique ne les a-t-il pas faits ? » explicite de manière lisible le sujet et l’objet implicites selon la lecture contextuelle retenue, tandis que la note a conserve les principales analyses concurrentes. « une part de l’Esprit », « que recherchait l’Unique ? » et « une descendance selon Dieu » maintiennent les choix interprétatifs sans effacer les ambiguïtés pertinentes, signalées par notes.
