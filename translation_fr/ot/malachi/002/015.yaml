  terminology: Les termes « Esprit », « descendance » et « trahisse » conviennent au contexte. La majuscule à « Esprit » et la formulation qualitative « selon Dieu » sont interprétatives, mais les notes correspondantes donnent clairement les alternatives nécessaires. « L’Unique » reprend de façon cohérente la lecture de « le Dieu unique » au début du verset.
