  text: וְ/עַתָּ֗ה אֲלֵי/כֶ֛ם הַ/מִּצְוָ֥ה הַ/זֹּ֖את הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/001.yaml
  text: And now[a], this command is for you, O priests.
translation:
  language: fr
  text: Et maintenant, prêtres, ce commandement s’adresse à vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et le marqueur temporel qui introduisent une transition directe depuis la réprimande précédente.
- source_word: אֲלֵיכֶם
  choice: s’adresse à vous
  rationale: Dans cette construction, אֶל indique les destinataires du commandement. Cette formulation est idiomatique en français et conserve le sens directionnel de la préposition.
- source_word: הַמִּצְוָה
  choice: commandement
  rationale: מִצְוָה désigne couramment un ordre ou une injonction; « commandement » convient au registre prophétique et au contexte d’avertissement.
- source_word: הַזֹּאת
  choice: ce
  rationale: Le démonstratif détermine simplement « commandement »; le masculin français est imposé par le genre du nom traduit.
- source_word: הַכֹּהֲנִים
  choice: prêtres
  rationale: Le nom a une fonction vocative. Son placement en incise après « maintenant » marque clairement l’adresse directe sans recourir au « ô » désormais peu naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe met en évidence l’adresse aux prêtres tout en évitant l’archaïsme « ô prêtres ».
