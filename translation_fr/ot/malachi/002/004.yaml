source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
translation:
  language: fr
  text: Alors vous saurez que je vous ai adressé ce commandement, afin que mon alliance soit avec Lévi[a], dit Yahvé des armées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « afin que mon alliance soit avec Lévi ». L’hébreu est condensé; il peut présenter ce commandement comme lié à l’existence ou au maintien de l’alliance de Dieu avec Lévi.'
    reason: alternative_reading
  - marker: b
    text: 'Rendu traditionnel : « le SEIGNEUR des armées »; on trouve aussi « le SEIGNEUR de l’univers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait avec waw prend ici, dans le discours prophétique, une valeur future et consécutive; « alors » exprime naturellement le résultat du jugement annoncé.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que les prêtres sauront.
- source_word: שִׁלַּחְתִּי אֲלֵיכֶם
  choice: je vous ai adressé
  rationale: Le parfait indique un acte accompli dont le message demeure en vigueur; « adresser » rend naturellement l'envoi d'un commandement à ses destinataires.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: ce commandement
  rationale: מִצְוָה désigne ici une injonction divine; « commandement » convient au registre biblique tout en restant courant.
- source_word: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי
  choice: afin que subsiste mon alliance avec Lévi
  rationale: L'infinitif exprime vraisemblablement le but ou le résultat. « Subsiste » rend la permanence en jeu dans le contexte sans suggérer que l'alliance serait instituée pour la première fois; une note conserve toutefois la formulation plus littérale et son ambiguïté.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Le nom divin est rendu par « Yahvé », et צְבָאוֹת par « armées », qui conserve clairement la force plurielle et martiale de l'expression.
theological_decisions:
- issue: Rapport entre le commandement envoyé et l'alliance avec Lévi
  choice: Le commandement est adressé en vue de la subsistance de l'alliance avec Lévi.
  alternative: Le commandement est lui-même destiné à être l'alliance avec Lévi, ou il est envoyé afin que cette alliance soit.
  rationale: L'hébreu לִהְיוֹת בְּרִיתִי אֶת־לֵוִי est très condensé. Le contexte des versets 1 à 9 favorise l'idée du maintien de l'alliance, mais la note signale la formulation littérale afin de ne pas effacer l'ambiguïté réelle.
- issue: Portée du nom « Lévi »
  choice: Conserver le singulier « Lévi ».
  alternative: Expliciter « les lévites » ou « les prêtres lévitiques ».
  rationale: Le texte nomme Lévi au singulier, probablement comme ancêtre représentatif; la traduction préserve cette forme sans imposer son explicitation corporative.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase principale privilégie la clarté contextuelle, tandis que la note conserve l'ambiguïté de la proposition infinitive hébraïque.
