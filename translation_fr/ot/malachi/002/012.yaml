id: MAL.2.12
reference: Malachi 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַכְרֵ֨ת יְהוָ֜ה לָ/אִ֨ישׁ אֲשֶׁ֤ר יַעֲשֶׂ֨/נָּה֙ עֵ֣ר וְ/עֹנֶ֔ה מֵ/אָהֳלֵ֖י יַֽעֲקֹ֑ב וּ/מַגִּ֣ישׁ מִנְחָ֔ה לַֽ/יהוָ֖ה צְבָאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
translation:
  language: fr
  text: Que Yahweh retranche des tentes de Jacob l’homme qui agit ainsi — celui qui veille et celui qui répond[a] — ainsi que celui qui présente une offrande à Yahweh des armées !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « celui qui veille et celui qui répond ». L’expression est difficile ; elle pourrait être un idiome signifiant quelque chose comme « témoin et défenseur », ou une formule englobant toutes les personnes concernées.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַכְרֵת
  choice: Que … retranche
  rationale: 'Le hiphil de כרת exprime l’exclusion ou le retranchement. Dans cette dénonciation, l’imparfait se prête à une valeur jussive : « Que Yahweh retranche ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לָאִישׁ
  choice: l’homme
  rationale: Conserve le singulier masculin représentatif du texte hébreu.
- source_word: אֲשֶׁר יַעֲשֶׂנָּה
  choice: qui agit ainsi
  rationale: Le suffixe féminin renvoie vraisemblablement à la pratique condamnée dans le contexte ; cette formulation est naturelle en français.
- source_word: עֵר וְעֹנֶה
  choice: celui qui veille et celui qui répond
  rationale: Rendu volontairement proche des participes hébreux, puisque le sens idiomatique exact de cette expression difficile demeure incertain.
- source_word: מֵאָהֳלֵי יַעֲקֹב
  choice: des tentes de Jacob
  rationale: Préserve l’image hébraïque désignant collectivement la communauté issue de Jacob.
- source_word: וּמַגִּישׁ מִנְחָה
  choice: ainsi que celui qui présente une offrande
  rationale: Le participe décrit une personne qui s’approche encore dans le culte. « Ainsi que » n’ajoute pas une nuance adversative absente de la simple conjonction hébraïque.
- source_word: מִנְחָה
  choice: offrande
  rationale: Dans ce contexte cultuel, le terme peut désigner une offrande sans que sa forme précise doive être imposée dans le texte principal.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Conserve à la fois le nom divin et l’image des armées associée à צְבָאוֹת.
theological_decisions:
- issue: Valeur de l’imparfait initial dans un contexte de jugement imprécatoire
  choice: Que Yahweh retranche
  alternative: Yahweh retranchera
  rationale: Le contexte permet de comprendre la forme comme un souhait ou une imprécation prophétique plutôt que comme une simple prédiction.
- issue: Interprétation de l’expression difficile עֵר וְעֹנֶה
  choice: Maintenir une traduction relativement littérale dans le texte et signaler l’incertitude en note
  alternative: « témoin et défenseur », ou une expression englobant toutes les personnes concernées
  rationale: Le sens idiomatique n’est pas suffisamment assuré pour retenir une interprétation précise sans réserve.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de l’imprécation et la note maintient l’ambiguïté réelle de l’expression hébraïque.
