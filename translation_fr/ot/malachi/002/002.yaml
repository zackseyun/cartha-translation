source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
translation:
  language: fr
  text: Si vous n’écoutez pas, si vous ne prenez pas à cœur de rendre gloire à mon nom, dit Yahvé des armées[a], j’enverrai parmi vous la malédiction et je maudirai vos bénédictions. Oui, je les ai maudites[b], parce que vous ne prenez pas cela à cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « Yahvé des armées ». Traduction traditionnelle : « le SEIGNEUR des armées » ou « le SEIGNEUR des armées célestes ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se comprendre : « je les maudirai aussi » ou, avec un suffixe au singulier, « je l’ai maudite ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמְעוּ
  choice: écoutez
  rationale: Le verbe signifie entendre ou écouter et peut, dans cet avertissement d’alliance, impliquer l’obéissance. « Écoutez » conserve cette latitude sans expliciter excessivement.
- source_word: תָשִׂימוּ עַל לֵב
  choice: prenez à cœur
  rationale: Cette expression française naturelle rend l’idée de considérer sérieusement et d’intérioriser; sa répétition conserve l’insistance rhétorique de l’hébreu.
- source_word: לָתֵת כָּבוֹד לִשְׁמִי
  choice: rendre gloire à mon nom
  rationale: « Rendre gloire » est idiomatique en français biblique actuel et garde la portée théologique de כָּבוֹד ainsi que la référence explicite au nom divin.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé, le maître des armées
  rationale: « Yahvé » représente directement le nom divin; « le maître des armées » exprime naturellement l’autorité impliquée par צְבָאוֹת sans recourir à l’archaïque « des armées » comme simple titre figé.
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  choice: j’enverrai parmi vous la malédiction
  rationale: La formulation conserve le verbe d’envoi, l’article défini et la valeur locative possible de בָכֶם, la malédiction entrant au milieu des destinataires.
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  choice: je maudirai vos bénédictions
  rationale: 'La traduction directe préserve l’ambiguïté: il peut s’agir des bénédictions reçues ou de celles que les prêtres prononcent.'
- source_word: וְגַם אָרוֹתִיהָ
  choice: Oui, je les ai déjà maudites
  rationale: Le parfait peut indiquer que le jugement est déjà engagé, tandis que « Oui » rend l’emphase de וְגַם. Le pluriel français reprend naturellement « bénédictions », mais les autres analyses sont signalées en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme; sa transcription préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Sens temporel et référent de אָרוֹתִיהָ
  choice: je les ai déjà maudites
  alternative: je les maudirai aussi; je l’ai maudite
  rationale: Dans le contexte, le parfait peut marquer une malédiction déjà commencée. Toutefois, une valeur prophétique ou future et le suffixe féminin singulier permettent d’autres lectures, conservées dans la note.
- issue: Référent de « vos bénédictions »
  choice: formulation laissée ouverte
  alternative: les bénédictions dont ils bénéficient; les bénédictions qu’ils prononcent
  rationale: Le contexte sacerdotal permet les deux nuances, et l’hébreu ne contraint pas à en sélectionner une.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « prendre à cœur » et l’ambiguïté de « vos bénédictions » sont maintenues. Le titre divin est formulé naturellement dans le texte, avec sa forme littérale et ses équivalents traditionnels en note.
