  rationale: La révision rétablit pour גֹּעֵר son sens lexical de « réprimander », tout en gardant la force du contexte de jugement. Elle rend la reprise finale sans pluriel artificiel et conserve, en note, l’incertitude syntaxique et référentielle du texte hébreu. Les autres choix, notamment « descendance » avec note alternative et la formulation littérale « excréments de vos fêtes », sont maintenus.
