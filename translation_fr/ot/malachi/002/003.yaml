source:
  edition: WLC
  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
translation:
  language: fr
  text: Voici, je vais réprimander votre descendance[a] ; je répandrai des excréments sur vos visages, les excréments de vos fêtes[b], et l’on vous emportera avec cela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre semence » ; certains comprennent qu’il s’agit ici des graines ou des récoltes plutôt que de la descendance.
    reason: alternative_reading
  - marker: b
    text: Littéralement « les excréments de vos fêtes » ; il s’agit vraisemblablement des déchets provenant des animaux offerts en sacrifice pendant les fêtes.
    reason: lexical_alternative
  - marker: c
    text: La dernière proposition est difficile. Elle semble signifier que les prêtres seront emportés avec les excréments et les autres déchets sacrificiels ; le lieu d’évacuation n’est pas précisé.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹעֵר
  choice: je vais menacer
  rationale: 'Avec הִנְנִי et le participe, le jugement est présenté comme imminent. Dans ce contexte, גער exprime plus qu’une simple réprimande verbale : il s’agit d’une intervention menaçante de Dieu.'
- source_word: הַזֶּרַע
  choice: votre descendance
  rationale: זֶרַע peut désigner la semence ou la descendance. L’oracle visant les prêtres favorise ici le sens de postérité, tout en laissant l’autre possibilité en note.
- source_word: וְזֵרִיתִי
  choice: je répandrai
  rationale: Le piel de זרה signifie disperser ou répandre. Avec des excréments et la destination « sur vos visages », « répandre » produit une image naturelle et vigoureuse en français.
- source_word: פֶּרֶשׁ
  choice: des excréments
  rationale: Le terme désigne les déjections ou matières rejetées des animaux sacrifiés. « Excréments » conserve la brutalité humiliante de l’image sans l’atténuer.
- source_word: עַל פְּנֵיכֶם
  choice: sur vos visages
  rationale: Traduction directe et idiomatique de la locution hébraïque, qui maintient l’image de honte publique.
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  choice: les excréments de vos fêtes
  rationale: Cette traduction conserve la construction concise et frappante de l’hébreu. Dans le contexte cultuel, il s’agit vraisemblablement des déchets provenant des animaux sacrifiés lors des fêtes, ce qui est précisé en note.
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: et l’on vous emportera avec eux
  rationale: La construction hébraïque est difficile et comprimée. Le sujet n’étant pas clairement identifié, « l’on » conserve l’agent indéfini ; le sens contextuel est celui d’une évacuation des prêtres avec les déchets sacrificiels.
theological_decisions:
- issue: Sens de הַזֶּרַע dans l’oracle de jugement adressé aux prêtres
  choice: votre descendance
  alternative: votre semence, c’est-à-dire les graines ou les récoltes
  rationale: Le jugement contre la lignée sacerdotale rend « descendance » probable, mais le sens agricole demeure lexicalement possible et mérite d’être signalé.
- issue: Référent de פֶּרֶשׁ חַגֵּיכֶם
  choice: les excréments de vos fêtes
  alternative: les excréments des animaux sacrifiés pendant vos fêtes
  rationale: Le texte principal garde la formulation hébraïque sans introduire explicitement « sacrifices ». La note expose le référent cultuel probablement sous-entendu.
- issue: Interprétation de וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: un agent indéfini emportera les prêtres avec les déchets
  alternative: ils seront emportés vers les déchets, ou les déchets eux-mêmes les emporteront
  rationale: La clause est syntaxiquement obscure. La traduction communique l’image probable d’une exclusion vers un lieu impur sans identifier un agent que le texte ne nomme pas.
translation_notes:
  register: Français international moderne, direct et digne. La rudesse volontaire de l’image prophétique est maintenue. « Voici » restitue le marqueur d’attention ; « je vais menacer » rend l’imminence et la force judiciaire de la construction. Les notes conservent les principales ambiguïtés lexicales et syntaxiques.
