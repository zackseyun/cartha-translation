language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
translation:
  language: fr
  text: Un enseignement vrai était dans sa bouche[a], et aucune injustice ne se trouvait sur ses lèvres. Il marchait avec moi dans la paix et la droiture, et il détournait beaucoup de gens de la faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une loi de vérité était dans sa bouche » ou « Un enseignement fidèle était dans sa bouche ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il ramenait beaucoup de gens loin du péché » ; le mot traduit par « faute » peut aussi signifier « iniquité » ou « culpabilité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  choice: un enseignement vrai
  rationale: Dans ce contexte sacerdotal, תּוֹרָה désigne notamment l’enseignement autorisé du prêtre. « Un enseignement vrai » est naturel en français moderne et exprime clairement la qualité de cet enseignement, tandis qu’une note conserve la traduction plus formelle « une loi de vérité ».
- source_word: בְּפִיהוּ
  choice: dans sa bouche
  rationale: Cette traduction maintient l’image hébraïque de la bouche comme siège de la parole et de l’enseignement.
- source_word: עַוְלָה
  choice: injustice
  rationale: Le terme peut désigner l’injustice, le tort ou la perversité. « Injustice » convient à l’intégrité morale exigée du prêtre sans restreindre le sens à la seule fausseté verbale.
- source_word: נִמְצָא בִשְׂפָתָיו
  choice: ne se trouvait sur ses lèvres
  rationale: La formulation conserve le passif de נִמְצָא ainsi que l’image concrète des lèvres, idiomatique aussi en français.
- source_word: בְּשָׁלוֹם וּבְמִישׁוֹר
  choice: dans la paix et la droiture
  rationale: « Paix » garde les nuances d’harmonie et d’intégrité de שָׁלוֹם; « droiture » rend le sens figuré de rectitude morale porté par מִישׁוֹר.
- source_word: הָלַךְ אִתִּי
  choice: il marchait avec moi
  rationale: L’expression conserve l’image relationnelle et covenantale de la marche avec Dieu au lieu de l’aplanir en simple conduite morale.
- source_word: וְרַבִּים הֵשִׁיב
  choice: il a détourné beaucoup de gens
  rationale: Le verbe causatif indique qu’il a amené autrui à revenir ou à se détourner. Cette formulation française exprime clairement ce mouvement sans rendre explicite davantage que l’hébreu l’idée de repentance.
- source_word: מֵעָוֺן
  choice: de la faute
  rationale: עָוֹן peut évoquer la faute, l’iniquité ou la culpabilité. « Faute » est actuel et suffisamment large; la note signale les autres possibilités.
theological_decisions:
- issue: Nature de la תּוֹרָה sacerdotale
  choice: « Un enseignement vrai » dans le texte principal
  alternative: « Une loi de vérité »
  rationale: Le contexte concerne la mission d’enseignement du prêtre. Le choix principal communique ce sens en français naturel, tandis que la note préserve le lien lexical possible avec la Torah et évite de réduire le terme à un simple conseil humain.
- issue: Image covenantale de la marche avec Dieu
  choice: Conserver « il marchait avec moi »
  alternative: « Il vivait en communion avec moi » ou « il se conduisait devant moi »
  rationale: L’image hébraïque porte à la fois une dimension relationnelle et morale. La conserver empêche de trancher entre ces nuances.
- issue: Portée de עָוֹן
  choice: « la faute »
  alternative: « le péché », « l’iniquité » ou « la culpabilité »
  rationale: Dans ce contexte, le mouvement décrit vise probablement l’acte ou la conduite fautive, mais le mot hébreu peut aussi inclure la culpabilité qui en découle. La note maintient cette amplitude sémantique.
translation_notes:
  register: Français international moderne, clair et digne. Les images bibliques de la bouche, des lèvres et de la marche avec Dieu sont conservées; les termes potentiellement vieillis sont évités dans le texte principal et signalés au besoin en note.
