    reason: ambiguïté syntaxique et lexicale de מוֹרָא
  - marker: b
    text: 'Ou : « il a été abattu », « il a été consterné » ou « il s’est humilié devant mon nom ».'
    reason: alternatives lexicales pour נִחַת
  revision_rationale: La révision conserve une interprétation de but possible pour la construction difficile, mais remplace « révérer » par « craindre » afin de respecter le vocabulaire hébreu et la répétition du verset. Elle remplace aussi une expression française peu naturelle par « a tremblé », rendu sobre qui reflète mieux l’éventail sémantique de נִחַת; les autres possibilités restent signalées en note.
