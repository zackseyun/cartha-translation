  variant: modern international French
source:
  edition: WLC
  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
translation:
  language: fr
  text: Mon alliance avec lui était une alliance de vie et de paix, et je les lui ai données afin qu’il me craigne[a]. Il m’a craint et a tremblé devant mon nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé : litt. « je les lui ai données [comme] crainte ». On peut aussi comprendre « pour la crainte » ou « comme objet de crainte ».'
    reason: ambiguïté syntaxique et lexicale de מוֹרָא
  - marker: b
    text: 'Ou : « il a été abattu », « il a été consterné » ou « il s’est humilié devant mon nom ».'
    reason: alternatives lexicales pour נִחַת
lexical_decisions:
- source_word: בְּרִיתִי הָיְתָה אִתּוֹ
  choice: Mon alliance avec lui était
  rationale: Conserve explicitement le possessif et la relation exprimée par אִתּוֹ, dans une syntaxe française naturelle.
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  choice: vie et paix
  rationale: Rend directement les deux noms; « paix » garde aussi en contexte la nuance de bien-être attachée à שָׁלוֹם.
- source_word: וָאֶתְּנֵם לוֹ
  choice: et je les lui ai données
  rationale: Le pronom masculin pluriel hébreu renvoie naturellement à « vie et paix »; l’accord français se fait au féminin pluriel.
- source_word: מוֹרָא וַיִּירָאֵנִי
  choice: pour qu’il me révère. Il m’a révéré
  rationale: La syntaxe de מוֹרָא est très condensée. Cette formulation comprend le nom comme la révérence attendue ou suscitée par le don, puis rend le verbe apparenté par « révérer ».
- source_word: וּמִפְּנֵי שְׁמִי
  choice: devant mon nom
  rationale: Préserve l’image relationnelle et quasi spatiale de la locution hébraïque.
- source_word: נִחַת
  choice: s’est tenu dans l’effroi
  rationale: Exprime une réaction profonde d’abaissement et de crainte devant Dieu, sans réduire le terme à une simple admiration; les autres nuances possibles sont signalées en note.
theological_decisions:
- issue: Nature de la crainte de Lévi devant Dieu
  choice: Une révérence profonde, comportant de l’effroi
  alternative: Une peur plus négative, traduite par « il fut terrifié », « consterné » ou « brisé »
  rationale: Le cadre favorable de l’alliance de vie et de paix oriente vers la révérence, tandis que ירא, מוֹרָא et חתת conservent toute la gravité de la crainte devant Dieu.
- issue: Rapport syntaxique de מוֹרָא au don de la vie et de la paix
  choice: 'Le don appelle ou suscite la révérence: « pour qu’il me révère »'
  alternative: « Je les lui ai données avec la crainte », « comme crainte » ou « pour la crainte »
  rationale: L’hébreu est comprimé et permet plusieurs analyses. Le texte principal adopte une relation de but ou de résultat cohérente avec la proposition suivante, tout en signalant l’incertitude en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Révérer » maintient la crainte respectueuse dans un registre soutenu mais courant; « effroi » préserve la force du dernier verbe. Les deux notes rendent visibles les principales ambiguïtés de l’hébreu.
