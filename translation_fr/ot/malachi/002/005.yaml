revisions:
- from: Mon alliance avec lui était vie et paix, et je les lui ai données pour qu’il me révère[a]. Il m’a révéré et s’est tenu dans l’effroi devant mon nom[b].
  to: Mon alliance avec lui était une alliance de vie et de paix, et je les lui ai données afin qu’il me craigne[a]. Il m’a craint et a tremblé devant mon nom[b].
  rationale: La révision conserve une interprétation de but possible pour la construction difficile, mais remplace « révérer » par « craindre » afin de respecter le vocabulaire hébreu et la répétition du verset. Elle remplace aussi une expression française peu naturelle par « a tremblé », rendu sobre qui reflète mieux l’éventail sémantique de נִחַת; les autres possibilités restent signalées en note.
