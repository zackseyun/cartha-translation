base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
translation:
  language: fr
  text: Levons-nous de bonne heure pour aller aux vignobles[a] ; voyons si la vigne a bourgeonné[b], si la fleur de la vigne s’est ouverte, si les grenadiers sont en fleurs. Là, je te donnerai mon amour[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « allons de bonne heure aux vignobles ». Le verbe peut exprimer le fait de se lever tôt ou de partir tôt.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a fleuri ». Le verbe hébreu peut désigner la poussée ou la floraison ; « a bourgeonné » fait ressortir la progression vers l’ouverture de la fleur de la vigne dans la proposition suivante.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « mes amours ». Ce pluriel peut exprimer l’amour ou ses manifestations concrètes, notamment les caresses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  choice: Levons-nous de bonne heure
  rationale: Le hiphil cohortatif à la première personne du pluriel exprime une invitation à se lever ou à partir tôt. Cette formulation conserve l’élan volitif et la nuance temporelle.
- source_word: לַכְּרָמִים
  choice: pour aller aux vignobles
  rationale: La préposition ל marque ici la direction. L’explicitation « pour aller aux » donne en français naturel le sens de destination après « levons-nous de bonne heure ».
- source_word: נִרְאֶה
  choice: voyons
  rationale: Le cohortatif de ראה invite à observer. « Voyons » est direct, naturel et fidèle.
- source_word: אִם
  choice: si
  rationale: Dans une interrogation indirecte, le français emploie naturellement « si », répété ici pour rendre la série d’observations.
- source_word: פָּרְחָה הַגֶּפֶן
  choice: la vigne a bourgeonné
  rationale: פרח peut évoquer la poussée ou la floraison. « A bourgeonné » préserve la progression probable vers l’ouverture de la fleur dans le membre suivant.
- source_word: פִּתַּח הַסְּמָדַר
  choice: la fleur s’est ouverte
  rationale: סמדר désigne la fleur ou floraison précoce de la vigne. Dans ce contexte immédiat, « la fleur » est clair sans répétition lourde de « vigne ».
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  choice: les grenadiers sont en fleurs
  rationale: Le verbe décrit l’apparition des fleurs. Puisque le sujet hébreu désigne les arbres ou plants portant les grenades, « les grenadiers » est botaniquement précis et idiomatique.
- source_word: שָׁם
  choice: Là
  rationale: 'L’adverbe est spatial : il renvoie aux vignobles et à ce cadre de floraison.'
- source_word: אֶתֵּן
  choice: je te donnerai
  rationale: נתן signifie couramment « donner ». Le pronom destinataire exigé par לָךְ est intégré naturellement.
- source_word: דֹּדַי
  choice: mes caresses
  rationale: Le pluriel דֹּדַי peut désigner les manifestations concrètes de l’amour, voire les étreintes amoureuses. « Mes caresses » garde le pluriel et l’intimité du passage sans surinterprétation explicite.
theological_decisions:
- issue: Degré d’explicitation de דֹּדַי
  choice: mes caresses
  alternative: mon amour
  rationale: Le texte poétique évoque une intimité concrète tout en restant non explicite. Le pluriel français « mes caresses » reflète mieux la forme hébraïque et la dimension amoureuse, sans imposer une lecture allégorique ou doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme invitatoire et la succession des signes printaniers sont conservés. Les points-virgules structurent la longue phrase sans l’alourdir.
