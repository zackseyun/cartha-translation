  text: מַה יָּפִית֙ וּ/מַה נָּעַ֔מְתְּ אַהֲבָ֖ה בַּ/תַּֽעֲנוּגִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/007.yaml
  text: How beautiful and how delightful you are[a], O love[b], with your pleasures!
translation:
  language: fr
  text: Que tu es belle et que tu es charmante, ô amour[a], parmi les délices[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon amour » ou « bien-aimée ». Le mot hébreu signifie littéralement « amour » et sert ici d’apostrophe.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les délices » ou « avec tes plaisirs ». L’expression hébraïque est concise et peut évoquer la sphère des délices ou les plaisirs qui caractérisent la femme aimée.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Que
  rationale: Devant une proposition exclamative, מַה exprime ici l’admiration plutôt qu’une question. La tournure française « Que tu es… » restitue naturellement cette valeur.
- source_word: יָּפִית
  choice: tu es belle
  rationale: Le verbe יפה décrit la beauté et porte une adresse à la deuxième personne du féminin singulier.
- source_word: וּמַה
  choice: et que
  rationale: La conjonction suivie de la répétition de מַה renforce le parallélisme exclamatif du vers.
- source_word: נָּעַמְתְּ
  choice: tu es charmante
  rationale: Issu de נעם, le terme évoque ce qui est agréable, plaisant et plein de charme. « Charmante » convient au registre amoureux sans réduire le mot à la seule apparence.
- source_word: אַהֲבָה
  choice: ô amour
  rationale: Le nom « amour » fonctionne comme une apostrophe. « Ô amour » conserve ce nom abstrait et sa force vocative sans ajouter le possessif « mon », absent de l’hébreu.
- source_word: בַּתַּעֲנוּגִים
  choice: parmi les délices
  rationale: La construction compacte avec ב peut situer la femme aimée dans la sphère des délices. « Parmi les délices » reste proche de l’hébreu sans introduire un possessif absent du texte.
theological_decisions: []
translation_notes:
  register: Français poétique, actuel et digne. Le parallélisme exclamatif est conservé, de même que l’apostrophe inhabituelle « ô amour ». La formulation principale évite d’ajouter un possessif à בַּתַּעֲנוּגִים, tandis que la note signale l’ambiguïté de la construction.
