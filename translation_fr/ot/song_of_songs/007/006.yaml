  yaml_path: translation/ot/song_of_songs/007/006.yaml
  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
translation:
  language: fr
  text: 'Ta tête est sur toi comme le Carmel[a],

    et les mèches de ta tête[b] comme la pourpre ;

    un roi est captif dans tes boucles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Carmel désigne probablement le mont Carmel, dont l’image évoque ici la hauteur majestueuse et la beauté.
    reason: cultural_note
  - marker: b
    text: 'Ou : « la chevelure pendante de ta tête ». Le terme hébreu est rare et peut désigner une chevelure pendante ou flottante.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un roi est lié dans les galeries ». Le dernier mot hébreu est difficile et a reçu plusieurs interprétations ; le texte principal suit l’image de la chevelure donnée par le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ עָלַיִךְ
  choice: Ta tête se dresse sur toi
  rationale: Le groupe signifie littéralement « ta tête sur toi ». En français poétique naturel, « se dresse sur toi » exprime la position et la prestance suggérées par la comparaison avec le Carmel sans remplacer « tête » par « sommet ».
- source_word: כַּכַּרְמֶל
  choice: comme le Carmel
  rationale: La préposition comparative כ est rendue directement. Le nom propre compact conserve la force poétique de l’hébreu ; une note précise probablement l’allusion géographique.
- source_word: דַלַּת רֹאשֵׁךְ
  choice: les cheveux qui en retombent
  rationale: דַלָּה est rare et désigne probablement une chevelure pendante ou flottante. Cette formulation française rend l’image de cheveux descendant de la tête tout en signalant naturellement leur rattachement à celle-ci.
- source_word: כָּאַרְגָּמָן
  choice: comme la pourpre
  rationale: אַרְגָּמָן peut désigner la teinture ou l’étoffe pourpre, associée au luxe. « La pourpre » garde cette amplitude sans préciser indûment la matière.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: Le nom hébreu est sans article ; l’indéfini respecte donc la forme du texte et son effet hyperbolique.
- source_word: אָסוּר
  choice: est retenu captif
  rationale: Le participe passif de אסר signifie « lié ». Dans ce poème amoureux, « retenu captif » conserve la métaphore tout en étant idiomatique.
- source_word: בָּרְהָטִים
  choice: dans tes boucles
  rationale: Ce pluriel rare est difficile. Dans le contexte immédiat de la chevelure, « boucles » produit une image cohérente, mais d’autres analyses, notamment « galeries », restent possibles et sont indiquées en note.
