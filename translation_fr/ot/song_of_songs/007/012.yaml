  text: לְכָ֤/ה דוֹדִ/י֙ נֵצֵ֣א הַ/שָּׂדֶ֔ה נָלִ֖ינָה בַּ/כְּפָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/012.yaml
  text: Come[a], my beloved, let us go out to the countryside[b]; let us spend the night among the villages.
translation:
  language: fr
  text: Viens, mon bien-aimé, sortons dans la campagne ; passons la nuit dans les villages[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les fleurs de henné ». Certains rapprochent le terme hébreu de la plante mentionnée en Cantique 1.14 ; dans le contexte immédiat, il désigne plus probablement des villages de la campagne.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכָה
  choice: Viens
  rationale: L’impératif de הלך est employé ici comme une invitation adressée au bien-aimé. « Viens » rend naturellement cet appel en français, bien que le verbe signifie littéralement « aller, marcher ».
- source_word: דוֹדִי
  choice: mon bien-aimé
  rationale: Terme d’affection caractéristique du Cantique des cantiques ; « mon bien-aimé » en conserve la portée relationnelle et poétique.
- source_word: נֵצֵא
  choice: sortons
  rationale: Le cohortatif pluriel de יצא exprime une intention commune et implique le fait de quitter le lieu présent. « Sortons » est à la fois précis et naturel.
- source_word: הַשָּׂדֶה
  choice: dans la campagne
  rationale: Le singulier « le champ » peut ici désigner collectivement l’espace rural ou le pays ouvert. « Dans la campagne » transmet ce sens de façon idiomatique.
- source_word: נָלִינָה
  choice: passons la nuit
  rationale: Le cohortatif pluriel de לון/לין désigne le fait de loger ou de demeurer pendant la nuit. « Passons la nuit » est clair, actuel et adapté au contexte poétique.
- source_word: בַּכְּפָרִים
  choice: dans les villages
  rationale: Dans ce contexte de sortie à la campagne et de séjour nocturne, le nom כפרים désigne très probablement des villages. « Dans » rend directement la préposition בְּ ; une autre compréhension lexicale est signalée en note.
