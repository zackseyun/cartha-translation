  text: צַוָּארֵ֖/ךְ כְּ/מִגְדַּ֣ל הַ/שֵּׁ֑ן עֵינַ֜יִ/ךְ בְּרֵכ֣וֹת בְּ/חֶשְׁבּ֗וֹן עַל שַׁ֨עַר֙ בַּת רַבִּ֔ים אַפֵּ/ךְ֙ כְּ/מִגְדַּ֣ל הַ/לְּבָנ֔וֹן צוֹפֶ֖ה פְּנֵ֥י דַמָּֽשֶׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
translation:
  language: fr
  text: Ton cou est comme une tour d’ivoire ; tes yeux sont comme des bassins à Heshbon, près de la porte de Bath-Rabbim[a]. Ton nez[b] est comme la tour du Liban, tournée vers Damas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de la porte de la ville populeuse » ou « près de la porte des multitudes ». L’expression hébraïque Bath-Rabbim peut être un nom de lieu ou avoir un sens descriptif.
    reason: alternative_reading
  - marker: b
    text: Littéralement « ton nez ». Dans cette image poétique, il s’agit vraisemblablement de louer la noblesse du profil de la bien-aimée.
    reason: cultural_note
  - marker: c
    text: Ou « qui domine Damas » ou « faisant face à Damas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוָּארֵךְ
  choice: ton cou
  rationale: Le nom désigne le cou ou la nuque ; « cou » est ici le terme français naturel et précis.
- source_word: כְּמִגְדַּל הַשֵּׁן
  choice: comme une tour d’ivoire
  rationale: La comparaison est conservée directement ; dans cette construction, שֵׁן désigne l’ivoire plutôt qu’une dent au sens littéral.
- source_word: עֵינַיִךְ בְּרֵכוֹת
  choice: tes yeux sont comme les bassins
  rationale: L’hébreu juxtapose les yeux et les bassins dans une comparaison nominale. L’ajout de « sont comme » rend clairement l’image en français sans en modifier le sens.
- source_word: בְּחֶשְׁבּוֹן
  choice: de Heshbon
  rationale: Le nom de lieu est translittéré selon l’usage français ; « les bassins de Heshbon » exprime naturellement leur localisation.
- source_word: עַל שַׁעַר בַּת רַבִּים
  choice: près de la porte de Bath-Rabbim
  rationale: עַל a ici une valeur locative. Bath-Rabbim est maintenu comme nom propre probable, tandis que la note conserve les interprétations descriptives possibles.
- source_word: אַפֵּךְ
  choice: ton nez
  rationale: Le sens concret « nez » préserve l’image anatomique précise et la tension culturelle du poème, plutôt que de l’atténuer en « visage » ou « profil ».
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  choice: comme la tour du Liban
  rationale: Cette formulation respecte la construction définie de l’hébreu et évite de préciser sans preuve qu’il s’agit simplement d’une tour située au Liban.
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  choice: tournée vers Damas
  rationale: Le participe évoque l’orientation d’un poste d’observation. « Tournée vers » convient grammaticalement à « tour » et rend l’idiome פְּנֵי avec naturel.
