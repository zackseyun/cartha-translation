  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse amoureuse. La ponctuation fait ressortir le souhait exprimé par le jussif. Les ambiguïtés anatomiques et la composition du vin sont conservées en notes plutôt que tranchées dans le texte.
