base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/003.yaml
  text: Your navel is a rounded bowl[a]; may it never lack mixed wine. Your belly is a heap of wheat[c][b], encircled with lilies.
translation:
  language: fr
  text: 'Ton nombril est une coupe arrondie[a] : que le vin mêlé[b] n’y manque jamais ! Ton ventre[c] est un tas de blé entouré de lis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Ton sexe est une coupe arrondie. » Le sens du terme hébreu traditionnellement traduit par « nombril » est discuté dans ce contexte érotique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le vin aromatisé ». Le terme hébreu désigne du vin mélangé, probablement avec de l’eau ou des aromates.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Ton utérus est un tas de blé », si le mot désigne ici l’intérieur du corps ; dans ce contexte, « ventre » est toutefois plus probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְרֵךְ
  choice: ton nombril
  rationale: Le sens traditionnel « nombril » convient à la succession des parties du corps décrites dans le poème. Un sens plus explicitement érotique est possible, mais demeure débattu; il est donc signalé en note.
- source_word: אַגַּן הַסַּהַר
  choice: une coupe arrondie
  rationale: אַגַּן désigne une coupe ou un bassin, tandis que הַסַּהַר évoque une forme ronde. « Coupe arrondie » restitue naturellement l’image sans imposer l’interprétation plus précise « en forme de lune ».
- source_word: אַל יֶחְסַר
  choice: que … n’y manque jamais
  rationale: La tournure jussive exprime ici un souhait poétique plutôt qu’une simple constatation.
- source_word: הַמָּזֶג
  choice: le vin mêlé
  rationale: Le terme désigne du vin mélangé, possiblement avec de l’eau ou des aromates. « Vin mêlé » reste proche de l’hébreu et conserve cette latitude.
- source_word: בִּטְנֵךְ
  choice: ton ventre
  rationale: Le nom désigne couramment le ventre; « sein maternel » ou « matrice » est possible dans d’autres contextes, mais la description extérieure du corps favorise ici « ventre ».
- source_word: עֲרֵמַת חִטִּים
  choice: un tas de blé
  rationale: Traduction directe de l’image agricole; « tas » est courant, concret et fidèle.
- source_word: סוּגָה בַּשּׁוֹשַׁנִּים
  choice: entouré de lis
  rationale: Le participe exprime l’idée d’être ceint ou entouré, et la préposition introduit ce qui forme cet entourage. « Lis » conserve l’image florale traditionnelle sans préciser une espèce botanique incertaine.
