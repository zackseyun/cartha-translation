source:
  edition: WLC
  text: הַֽ/דּוּדָאִ֣ים נָֽתְנוּ רֵ֗יחַ וְ/עַל פְּתָחֵ֨י/נוּ֙ כָּל מְגָדִ֔ים חֲדָשִׁ֖ים גַּם יְשָׁנִ֑ים דּוֹדִ֖/י צָפַ֥נְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
translation:
  language: fr
  text: Les mandragores exhalent leur parfum[a], et à nos portes se trouvent tous les délices[b], nouveaux comme anciens. Je les ai réservés pour toi, mon bien-aimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « répandent leur odeur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les fruits de choix » ou « toutes les choses précieuses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  choice: les mandragores
  rationale: Le terme désigne les mandragores, plantes odorantes traditionnellement associées à l’amour et à la fécondité. « Mandragores » est l’équivalent français direct et courant.
- source_word: נָתְנוּ רֵיחַ
  choice: exhalent leur parfum
  rationale: Littéralement « ont donné une odeur/un parfum ». Le présent convient à la scène poétique, et « exhalent leur parfum » restitue naturellement l’image olfactive.
- source_word: וְעַל פְּתָחֵינוּ
  choice: et à nos portes
  rationale: פֶּתַח désigne une ouverture, une entrée ou une porte. Ici, עַל peut naturellement être rendu par « à », sans imposer la localisation plus stricte « au-dessus de ».
- source_word: כָּל מְגָדִים
  choice: toutes sortes de délices
  rationale: מְגָדִים peut désigner des produits de choix, des mets délicats, des fruits précieux ou, plus largement, des choses désirables. « Délices » préserve cette amplitude mieux que le seul mot « fruits ».
- source_word: חֲדָשִׁים גַּם יְשָׁנִים
  choice: nouvelles comme anciennes
  rationale: Cette formulation conserve le contraste et la valeur additive de גַּם tout en s’accordant naturellement avec « délices » en français.
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, דּוֹד est une appellation affectueuse et intime. « Mon bien-aimé » est naturel, digne et bien établi en français.
- source_word: צָפַנְתִּי לָךְ
  choice: je les ai réservées pour toi
  rationale: צפן signifie cacher, mettre en réserve ou garder précieusement. « Réservées pour toi » exprime ici la conservation intentionnelle en vue du bien-aimé.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. L’ordre final place l’adresse « Mon bien-aimé » avant la proposition qui la suit afin d’éviter en français l’ambiguïté selon laquelle le bien-aimé ferait partie des choses mises en réserve, tout en conservant le sens et l’intimité de l’hébreu.
