translation:
  language: fr
  text: Tes deux seins sont comme deux faons[a], jumeaux d’une gazelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux jeunes gazelles ». Le mot hébreu désigne les petits d’un cervidé ou d’un animal semblable.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une biche ». Le terme hébreu est au féminin singulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: tes deux seins
  rationale: שָׁד désigne concrètement le sein, et le suffixe de deuxième personne féminin singulier marque l’adresse directe à la femme. La formulation conserve sans euphémisme le caractère amoureux du poème.
- source_word: כִּשְׁנֵי
  choice: comme deux
  rationale: La préposition comparative כְּ introduit une comparaison. « Comme deux » est naturel en français moderne.
- source_word: עֳפָרִים
  choice: faons
  rationale: Le terme désigne les petits d’un cervidé ou d’un animal apparenté. « Faons » restitue de manière concise l’image de jeunesse, de douceur et de grâce, sans répéter « gazelles ».
- source_word: תָּאֳמֵי
  choice: jumeaux de
  rationale: Le pluriel construit qualifie les deux petits comme issus d’une même naissance et formant une paire parfaitement assortie.
- source_word: צְבִיָּה
  choice: une gazelle
  rationale: La forme féminine singulière désigne une gazelle femelle. « Une gazelle » convient au champ imagé récurrent du Cantique et reste idiomatique en français.
