  text: מַה יָּפ֧וּ פְעָמַ֛יִ/ךְ בַּ/נְּעָלִ֖ים בַּת נָדִ֑יב חַמּוּקֵ֣י יְרֵכַ֔יִ/ךְ כְּמ֣וֹ חֲלָאִ֔ים מַעֲשֵׂ֖ה יְדֵ֥י אָמָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
translation:
  language: fr
  text: Comme tes pieds sont beaux dans tes sandales, fille de noble ! Les courbes de tes cuisses[a] sont comme des joyaux[b], œuvre des mains d’un artisan habile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tes hanches ». Le terme hébreu peut désigner plus largement la région des hanches et des cuisses.
    reason: lexical_alternative
  - marker: b
    text: Ou « des ornements » ou « des colliers ». Le mot hébreu désigne probablement de précieuses parures ouvragées.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: Comme … sont beaux
  rationale: La tournure exclamative exprime l’admiration plutôt qu’une question ; cette formulation est naturelle et poétique en français moderne.
- source_word: פְעָמַיִךְ
  choice: tes pieds
  rationale: Le mot peut évoquer les pieds ou les pas ; la mention des sandales favorise ici le sens concret « pieds ».
- source_word: בַּנְּעָלִים
  choice: dans leurs sandales
  rationale: Cette tournure idiomatique française conserve l’image des pieds chaussés de sandales.
- source_word: בַּת נָדִיב
  choice: fille de noble
  rationale: La construction peut désigner la fille d’un noble tout en portant une nuance honorifique ; la traduction reste compacte et évite de préciser le sexe ou le rang exact du parent au-delà de l’hébreu.
- source_word: חַמּוּקֵי
  choice: les courbes
  rationale: Le terme évoque des contours arrondis ou sinueux ; « courbes » convient au langage poétique de cette description du corps.
- source_word: יְרֵכַיִךְ
  choice: tes cuisses
  rationale: Le mot désigne la région de la cuisse ou de la hanche. « Cuisses » est un équivalent direct, tandis que l’autre possibilité est signalée en note.
- source_word: חֲלָאִים
  choice: des joyaux
  rationale: Le terme rare renvoie vraisemblablement à des bijoux ou ornements travaillés ; « joyaux » communique leur caractère précieux sans imposer une forme précise.
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  choice: œuvre des mains d’un artisan habile
  rationale: La formulation conserve l’image des mains et souligne le savoir-faire artistique, sans surinterpréter le degré de maîtrise.
