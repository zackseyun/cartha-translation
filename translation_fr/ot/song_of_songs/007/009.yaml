  text: אָמַ֨רְתִּי֙ אֶעֱלֶ֣ה בְ/תָמָ֔ר אֹֽחֲזָ֖ה בְּ/סַנְסִנָּ֑י/ו וְ/יִֽהְיוּ נָ֤א שָׁדַ֨יִ/ךְ֙ כְּ/אֶשְׁכְּל֣וֹת הַ/גֶּ֔פֶן וְ/רֵ֥יחַ אַפֵּ֖/ךְ כַּ/תַּפּוּחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
translation:
  language: fr
  text: 'J’ai dit : « Je grimperai au palmier, je saisirai ses rameaux[a]. Que tes seins soient comme les grappes de la vigne, et le parfum de ton nez[b] comme celui des pommes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses branches » ou « ses tiges chargées de fruits » ; le terme hébreu rare désigne les rameaux ou les pousses fructifères du palmier.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ton nez ». Dans ce contexte, l’image peut évoquer le parfum de ton souffle ou, plus largement, celui qui émane de ton visage.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: palmier
  rationale: Le nom désigne le palmier, probablement le dattier. « Palmier » conserve l’image concrète et reste naturel en français.
- source_word: אֶעֱלֶה
  choice: je monterai au
  rationale: Le verbe signifie « monter ». Avec un arbre, « monter au palmier » exprime naturellement l’action sans ajouter un objet absent du texte.
- source_word: אֹחֲזָה
  choice: je saisirai
  rationale: Le verbe exprime l’idée de saisir ou de tenir fermement. « Saisirai » garde la vigueur de l’image sans l’exagérer.
- source_word: סַנְסִנָּיו
  choice: ses rameaux
  rationale: Ce terme rare peut désigner les rameaux, les branches ou les tiges portant les fruits du palmier. « Rameaux » convient au registre poétique, tandis qu’une note conserve l’incertitude lexicale.
- source_word: וְיִהְיוּ נָא
  choice: Que… soient
  rationale: Le jussif accompagné de נָא exprime ici un souhait ou une invitation; cette tournure française en restitue la nuance.
- source_word: שָׁדַיִךְ
  choice: tes seins
  rationale: Le sens est direct et l’image érotique du poème ne doit pas être atténuée.
- source_word: אֶשְׁכְּלֹת הַגֶּפֶן
  choice: les grappes de la vigne
  rationale: Traduction proche de l’expression hébraïque, claire en français et fidèle à l’image végétale.
- source_word: רֵיחַ
  choice: le parfum
  rationale: Dans ce contexte sensuel et positif, « parfum » rend mieux la valeur agréable de l’odeur.
- source_word: אַפֵּךְ
  choice: ton nez
  rationale: Le mot hébreu signifie normalement « nez ». Bien que l’image puisse évoquer le souffle ou la région du visage, la traduction principale conserve le référent concret et signale l’interprétation en note.
- source_word: כַּתַּפּוּחִים
  choice: comme celui des pommes
  rationale: « Pommes » est l’identification traditionnelle, même si l’espèce exacte du fruit ancien demeure discutée. L’ajout de « celui » clarifie que la comparaison porte sur le parfum.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La traduction conserve la sensualité explicite du texte ainsi que l’ambiguïté du terme rare relatif aux rameaux. Le littéralisme « ton nez » est maintenu dans le texte, tandis que la note explicite les sens contextuels possibles.
