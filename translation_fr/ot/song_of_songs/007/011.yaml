  text: אֲנִ֣י לְ/דוֹדִ֔/י וְ/עָלַ֖/י תְּשׁוּקָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/011.yaml
  text: I am my beloved's[a], and his desire is for me.
translation:
  language: fr
  text: Je suis à mon bien-aimé[a], et son désir se porte vers moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : «Je suis pour mon bien-aimé.»'
    reason: Alternative lexicale pour la préposition לְ dans une proposition nominale.
lexical_decisions:
- source_word: אֲנִי
  choice: Je
  rationale: Le pronom hébreu de première personne est explicite et porte une légère emphase; il est donc conservé.
- source_word: לְדוֹדִי
  choice: à mon bien-aimé
  rationale: Dans cette proposition nominale, לְ exprime l’appartenance ou la relation. «Je suis à mon bien-aimé» est naturel en français, correspond au refrain du Cantique (2.16; 6.3) et conserve mieux qu’un possessif exclusif la forme et l’ambiguïté relationnelle de l’hébreu.
- source_word: וְעָלַי
  choice: vers moi
  rationale: Avec תְּשׁוּקָה, עַל indique ici l’objet ou la direction du désir. «Vers moi» rend cette orientation de façon idiomatique sans suggérer une position physique.
- source_word: תְּשׁוּקָתוֹ
  choice: son désir
  rationale: תְּשׁוּקָה désigne le désir ou l’aspiration ardente. «Son désir» est direct et préserve le lien lexical avec Genèse 3.16 et 4.7 sans importer dans le poème les débats interprétatifs liés à ces passages.
theological_decisions:
- issue: Sens de la proposition relationnelle לְדוֹדִי
  choice: «Je suis à mon bien-aimé», exprimant l’appartenance relationnelle mutuelle
  alternative: «Je suis pour mon bien-aimé» ou «J’appartiens à mon bien-aimé»
  rationale: La proposition hébraïque est sans verbe et permet une traduction littérale avec «pour/à». Dans le refrain récurrent du Cantique, elle évoque toutefois l’appartenance amoureuse. La formulation retenue garde cette portée sans introduire une lecture allégorique ultérieure.
translation_notes:
  register: Français international moderne, poétique et digne. «Bien-aimé» conserve le registre amoureux traditionnel sans archaïsme excessif; «se porte vers moi» exprime naturellement la direction du désir.
