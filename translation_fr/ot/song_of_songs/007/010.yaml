base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/010.yaml
  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
translation:
  language: fr
  text: 'Et ton palais est comme le meilleur vin[a],


    qui coule aisément vers mon bien-aimé


    et glisse sur les lèvres de ceux qui dorment[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta bouche » ou « ton goût » ; le terme hébreu désigne plus précisément le palais, c’est-à-dire la voûte de la bouche.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « faisant parler les lèvres de ceux qui dorment ». Le verbe hébreu est rare : il peut évoquer soit un léger mouvement sur les lèvres, soit l’effet du vin qui les fait parler.'
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  choice: ton palais
  rationale: Le nom hébreu désigne précisément le palais, ou par extension la bouche et la faculté de goûter. « Palais » reste naturel dans ce contexte poétique et conserve l’image corporelle du texte.
- source_word: כְּיֵין הַטּוֹב
  choice: comme le meilleur vin
  rationale: Cette formulation française exprime naturellement l’excellence du vin évoqué par l’article et l’adjectif hébreux dans ce contexte laudatif.
- source_word: הוֹלֵךְ
  choice: qui coule
  rationale: Le participe signifie littéralement « allant » ; appliqué au vin, « couler » rend naturellement son mouvement sans alourdir le vers.
- source_word: לְדוֹדִי
  choice: pour mon bien-aimé
  rationale: La préposition peut exprimer la direction ou la destination. « Pour » garde l’idée d’un vin destiné au bien-aimé, tout en laissant au verbe de mouvement sa valeur poétique.
- source_word: לְמֵישָׁרִים
  choice: doucement
  rationale: L’expression signifie littéralement « avec droiture » ou « tout droit » ; à propos du vin, elle évoque un écoulement aisé et agréable. « Doucement » convient au mouvement sensuel décrit dans le vers.
- source_word: דּוֹבֵב
  choice: glisse sur
  rationale: Ce participe rare peut décrire un mouvement léger sur les lèvres. « Glisse sur » préserve cette image, tandis que l’autre interprétation possible, « fait parler », est signalée en note.
- source_word: שִׂפְתֵי יְשֵׁנִים
  choice: les lèvres de ceux qui dorment
  rationale: Cette traduction proche de l’hébreu conserve l’image énigmatique de lèvres mises en mouvement pendant le sommeil.
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme est disposé sur trois lignes afin de rendre le mouvement du vin. Le choix de « palais » maintient la précision de l’image hébraïque sans devenir excessivement anatomique en français.
