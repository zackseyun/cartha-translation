base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
translation:
  language: fr
  text: Reviens, reviens, Sulamite ! Reviens, reviens, afin que nous puissions te regarder. Pourquoi regardez-vous la Sulamite comme on regarde la danse de Mahanaïm ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « Que voyez-vous dans la Sulamite ? — Comme la danse de Mahanaïm. » L’hébreu de cette proposition est difficile, et certaines traductions rattachent « que » à la question plutôt que de comprendre « pourquoi ». Mahanaïm est probablement un nom de lieu ; ce nom peut signifier « deux camps ».'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: שׁוּבִי
  choice: Reviens
  rationale: Impératif féminin singulier répété quatre fois. « Reviens » rend naturellement l'appel sans préciser s'il s'agit d'un retour physique ou relationnel.
- source_word: הַשּׁוּלַמִּית
  choice: Sulamite
  rationale: La translittération conserve l'ambiguïté entre gentilé, désignation poétique et titre éventuel.
- source_word: וְנֶחֱזֶה בָּךְ
  choice: que nous puissions te contempler
  rationale: La tournure exprime le but après les impératifs. « Contempler » convient au registre poétique et maintient le lien lexical avec la forme suivante de חזה.
- source_word: מַה
  choice: Pourquoi
  rationale: 'Bien que מַה signifie normalement « quoi », il peut ici introduire une question rhétorique portant sur la raison : « Pourquoi contemplez-vous… ? » L''autre construction possible est signalée en note.'
- source_word: תֶּחֱזוּ
  choice: contemplez-vous
  rationale: Le pluriel masculin maintient le changement d'interlocuteur et reprend le même verbe חזה que dans la proposition précédente.
- source_word: כִּמְחֹלַת
  choice: comme on contemple la danse de
  rationale: Cette formulation rend la comparaison marquée par כ et s'intègre naturellement au verbe français « contempler ».
- source_word: הַמַּחֲנָיִם
  choice: Mahanaïm
  rationale: Le terme est probablement le nom de lieu Mahanaïm. La translittération évite de trancher en faveur du sens lexical « deux camps ».
theological_decisions:
- issue: Construction de la seconde question
  choice: « Pourquoi contemplez-vous la Sulamite comme on contemple la danse de Mahanaïm ? »
  alternative: « Que voyez-vous dans la Sulamite ? Comme la danse de Mahanaïm. »
  rationale: L'hébreu est difficile. La lecture avec « pourquoi » donne une question française cohérente, tandis que la note préserve l'autre analyse grammaticale sans résoudre artificiellement l'ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. La quadruple répétition est conservée. « Contempler » maintient la cohésion lexicale du verbe hébreu חזה tout en évitant une formulation archaïque.
