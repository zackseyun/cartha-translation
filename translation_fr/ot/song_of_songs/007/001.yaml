- from: Reviens, reviens, Sulamite ! Reviens, reviens, que nous puissions te contempler. Pourquoi contemplez-vous la Sulamite comme on contemple la danse de Mahanaïm[a] ?
  to: Reviens, reviens, Sulamite ! Reviens, reviens, afin que nous puissions te regarder. Pourquoi regardez-vous la Sulamite comme on regarde la danse de Mahanaïm ?[a]
  rationale: La révision emploie « regarder » pour rendre les deux occurrences de חזה avec une intensité non surinterprétée et un parallèle clair. Elle améliore la fluidité de la comparaison française et reformule la note afin de préserver explicitement l'ambiguïté syntaxique attestée, tout en conservant Mahanaïm comme toponyme probable. L'ancre est déplacée à la fin de la question, dont la note explique l'ensemble.
