  naturalness: « Reviens » et la répétition sont naturelles dans un registre poétique moderne. « afin que nous puissions te regarder » est fluide et moins solennel que « que nous puissions te contempler ». Dans la seconde question, « Pourquoi regardez-vous la Sulamite comme la danse de Mahanaïm ? » est un peu heurté en français; « comme on regarde la danse de Mahanaïm » est naturel et explicite.
  terminology: « Sulamite » et « Mahanaïm » sont des translittérations françaises recevables. Le nom de lieu doit rester dans le texte; son sens possible (« deux camps ») relève bien de la note. Aucun terme théologique n'est en jeu.
