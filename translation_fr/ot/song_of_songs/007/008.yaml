source:
  edition: WLC
  text: זֹ֤את קֽוֹמָתֵ/ךְ֙ דָּֽמְתָ֣ה לְ/תָמָ֔ר וְ/שָׁדַ֖יִ/ךְ לְ/אַשְׁכֹּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/008.yaml
  text: This stature of yours is like a palm tree[a], and your breasts are like clusters of fruit.
translation:
  language: fr
  text: 'Ta taille ressemble à un palmier,

    et tes seins à des grappes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à des grappes de raisin ». Le terme hébreu désigne souvent des grappes de raisin, mais le fruit n’est pas précisé ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  choice: Ta taille
  rationale: קוֹמָה désigne ici la taille ou la stature corporelle de la femme. En français, « ta taille » rend naturellement l’image sans suggérer seulement une mesure chiffrée; le démonstratif זֹאת, idiomatique en hébreu dans « cette taille qui est la tienne », n’a pas besoin d’être reproduit séparément.
- source_word: דָּמְתָה
  choice: ressemble à
  rationale: Le verbe דמה exprime une ressemblance. Le présent français convient à cette description poétique, malgré la forme accomplie de l’hébreu.
- source_word: לְתָמָר
  choice: à un palmier
  rationale: La préposition לְ introduit ici le terme de la comparaison, et תָּמָר désigne le palmier.
- source_word: וְשָׁדַיִךְ
  choice: et tes seins
  rationale: שָׁדַיִם désigne explicitement les seins; le terme direct préserve le caractère érotique du poème sans l’atténuer.
- source_word: לְאַשְׁכֹּלוֹת
  choice: à des grappes
  rationale: אַשְׁכֹּלוֹת signifie « grappes » et évoque souvent des grappes de raisin, mais aucun fruit n’est nommé dans ce verset. Le français « grappes » conserve cette indétermination.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme est conservé par l’ellipse du verbe au second membre. « Taille » est plus naturel que « stature » dans une description amoureuse, tandis que « seins » maintient la franchise du texte hébreu.
