  text: כִּֽי הִנֵּ֥ה ה/סתו עָבָ֑ר הַ/גֶּ֕שֶׁם חָלַ֖ף הָלַ֥ךְ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/011.yaml
  text: For look[a], the winter has passed; the rain is over and gone.
translation:
  language: fr
  text: Car voici que l’hiver est passé[a] ; la pluie a cessé, elle s’en est allée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la saison des pluies est passée ». Le terme hébreu traduit par « hiver » peut désigner plus précisément la saison pluvieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’invitation formulée au verset précédent et conserve naturellement la valeur connective.
- source_word: הִנֵּה
  choice: voici que
  rationale: Attire vivement l’attention sur la scène présente dans un français actuel et digne.
- source_word: הַסְּתָו
  choice: l’hiver
  rationale: Le terme désigne l’hiver, plus précisément la saison pluvieuse. « L’hiver » est idiomatique en français et la mention suivante de la pluie en précise le caractère.
- source_word: עָבָר
  choice: est passé
  rationale: Le parfait qal présente la saison comme désormais révolue.
- source_word: הַגֶּשֶׁם
  choice: la pluie
  rationale: Rend directement le nom défini sans ajouter une intensité que le contexte n’exige pas.
- source_word: חָלַף
  choice: a cessé
  rationale: Exprime la disparition de la pluie tout en évitant de répéter immédiatement « passé ».
- source_word: הָלַךְ לוֹ
  choice: elle s’en est allée
  rationale: 'Préserve l’intensification poétique : la pluie a cessé et s’est éloignée.'
