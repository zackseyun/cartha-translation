  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים סֹב֩ דְּמֵה לְ/ךָ֨ דוֹדִ֜/י לִ/צְבִ֗י א֛וֹ לְ/עֹ֥פֶר הָ/אַיָּלִ֖ים עַל הָ֥רֵי בָֽתֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
translation:
  language: fr
  text: Jusqu’à ce que le jour respire et que les ombres s’enfuient[a], tourne-toi, mon bien-aimé ! Sois comme une gazelle ou comme un jeune cerf sur les montagnes de Béter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jusqu’à ce que le jour se rafraîchisse et que les ombres s’enfuient ». L’hébreu parle littéralement du jour qui « respire » ou « souffle », image poétique souvent comprise comme une allusion à la brise du soir ou à la fraîcheur de l’aube.
    reason: lexical_alternative
  - marker: b
    text: « Béter » est peut-être un nom de lieu. L’expression peut aussi signifier « les montagnes de la séparation » ou, de façon moins probable, « les montagnes escarpées » ou « découpées ».
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: Jusqu’à ce que le jour respire
  rationale: Le verbe פוח évoque littéralement le fait de souffler ou de respirer. Cette formulation conserve la personnification poétique du jour sans trancher entre la brise du soir et la fraîcheur de l’aube.
- source_word: וְנָסוּ הַצְּלָלִים
  choice: et que les ombres s’enfuient
  rationale: נוס signifie couramment « fuir ». Le choix français garde le mouvement vif de l’image poétique plutôt que de l’atténuer en « disparaissent ».
- source_word: סֹב
  choice: tourne-toi
  rationale: L’impératif de סבב signifie d’abord « tourner, se tourner ». « Tourne-toi » est naturel en français et évite l’interprétation plus précise « reviens ».
- source_word: דְּמֵה לְךָ
  choice: Sois comme
  rationale: Cette tournure rend naturellement l’impératif de comparaison et introduit clairement l’image de la gazelle ou du jeune cerf.
- source_word: דוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, דּוֹדִי est une appellation amoureuse intime. « Mon bien-aimé » est digne, claire et bien établie en français.
- source_word: לִצְבִי
  choice: comme une gazelle
  rationale: La préposition ל après דמה marque ici le terme de la comparaison. « Comme une gazelle » restitue directement la similitude.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: ou comme un jeune cerf
  rationale: עֹפֶר désigne un jeune animal et, avec אַיָּלִים, un jeune cervidé. « Jeune cerf » conserve l’imagerie masculine et reste idiomatique.
- source_word: עַל הָרֵי בָתֶר
  choice: sur les montagnes de Béter
  rationale: בתר peut être un nom de lieu ou un nom descriptif lié à la séparation ou à la coupure. La translittération préserve l’incertitude dans le texte principal, explicitée en note.
