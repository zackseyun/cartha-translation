  text: כְּ/שֽׁוֹשַׁנָּה֙ בֵּ֣ין הַ/חוֹחִ֔ים כֵּ֥ן רַעְיָתִ֖/י בֵּ֥ין הַ/בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/002.yaml
  text: Like a lily among thorns[b][a], so is my beloved among the daughters.
translation:
  language: fr
  text: 'Comme un lis parmi les épines,

    telle est ma bien-aimée parmi les jeunes femmes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les filles » ; l’expression hébraïque peut désigner les jeunes femmes en général, et non seulement des filles au sens familial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/שׁוֹשַׁנָּה
  choice: Comme un lis
  rationale: Le nom désigne traditionnellement une fleur de type lis, sans permettre une identification botanique certaine. « Lis » conserve l’image poétique familière, et « comme » rend explicitement le préfixe comparatif.
- source_word: בֵּין
  choice: parmi
  rationale: Avec un pluriel collectif, « parmi » exprime naturellement la place au sein d’un groupe et convient aux deux membres de la comparaison.
- source_word: הַ/חוֹחִים
  choice: les épines
  rationale: Le terme désigne des végétaux épineux. « Les épines » est concis et maintient le vif contraste poétique avec le lis.
- source_word: כֵּן
  choice: telle est
  rationale: Cette formulation française reprend le second membre de la comparaison avec naturel et dignité, en accordant l’adjectif au référent féminin.
- source_word: רַעְיָתִי
  choice: ma bien-aimée
  rationale: Dans ce contexte amoureux, le mot désigne la compagne aimée du locuteur. « Ma bien-aimée » exprime l’affection dans un registre poétique actuel sans devenir familier.
- source_word: הַ/בָּנוֹת
  choice: les jeunes femmes
  rationale: Littéralement « les filles », l’expression peut désigner idiomatiquement les femmes du groupe, et non des filles au sens filial. « Les jeunes femmes » est ici plus naturel et immédiatement compréhensible en français.
theological_decisions: []
translation_notes:
  register: Poésie amoureuse au registre moderne, digne et accessible. Le parallélisme et le contraste entre le lis et les épines sont conservés. La disposition sur deux lignes met en valeur les deux membres de la comparaison.
