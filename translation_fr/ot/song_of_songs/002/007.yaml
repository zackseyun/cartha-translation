    rationale: תָּעִירוּ et תְּעוֹרְרוּ sont voisins, mais le premier peut évoquer le fait de susciter ou de provoquer et le second celui de réveiller. « Ne suscitez ni ne réveillez » maintient plus nettement l’intensification.
