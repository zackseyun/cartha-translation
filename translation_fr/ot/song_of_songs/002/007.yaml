    rationale: Le texte hébreu porte un verbe féminin singulier ללא objet exprimé, probablement référé à אַהֲבָה (« l’amour »). En français, « il le désire » introduit un objet non identifié et ne permet pas de comprendre que l’amour est le référent probable. « Avant que l’amour ne le veuille » explicite le sujet, tandis que « le » reprend naturellement l’éveil provoqué dans l’interdiction précédente.
  - severity: low
