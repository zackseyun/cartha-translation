  source_fidelity: 'L’adjuration, l’adresse aux filles de Jérusalem, la formule par les gazelles et les biches, ainsi que l’interdiction sont globalement fidèles au texte hébreu. Toutefois, « avant qu’il le désire » ne rend pas correctement la dernière proposition : le pronom objet « le » n’a pas d’antécédent explicite et le sujet masculin français obscurcit le fait que le verbe hébreu est au féminin singulier, vraisemblablement en rapport avec « l’amour ».'
  naturalness: Le registre est poétique et accessible. « N’éveillez pas, ne réveillez pas » est intelligible, mais atténue la distinction entre les deux verbes hébreux. « Ne suscitez ni ne réveillez » conserve mieux le parallélisme tout en restant naturel. La finale doit être reformulée pour être grammaticalement claire en français.
  terminology: « Filles de Jérusalem », « gazelles », « biches des champs » et « amour » conviennent. « Je vous en conjure » est une adjuration française naturelle dans ce registre, avec la note qui explicite la force de serment de l’hébreu.
