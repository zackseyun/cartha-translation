base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
translation:
  language: fr
  text: 'Je vous en conjure[a], filles de Jérusalem, par les gazelles ou par les biches des champs[b] : ne suscitez ni ne réveillez l’amour avant que l’amour ne le veuille[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Je vous fais jurer » ou « Je vous place sous serment ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « par les gazelles ou par les biches des champs » est une formule poétique de serment. Certains y perçoivent aussi un jeu de mots évoquant des titres divins, mais les animaux constituent ici le sens direct.
    reason: cultural_note
  - marker: c
    text: 'Littéralement, « jusqu’à ce qu’elle veuille [ou : trouve bon] ». Le verbe hébreu est au féminin singulier et renvoie probablement à « l’amour », féminin en hébreu. Le français explicite donc « l’amour » comme sujet ; « le » reprend son éveil.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Je vous en conjure
  rationale: Le hifil de שׁבע signifie ici imposer un serment ou adresser une sommation solennelle. « Je vous en conjure » conserve la force solennelle de la formule tout en restant naturel dans un registre poétique français.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: filles de Jérusalem
  rationale: Cette traduction directe préserve la forme d’adresse collective et poétique de l’hébreu.
- source_word: בִּצְבָאוֹת
  choice: par les gazelles
  rationale: Dans ce parallélisme avec les biches des champs, צְבָאוֹת désigne les gazelles plutôt que les armées ou les puissances célestes.
- source_word: אוֹ
  choice: ou
  rationale: Le sens ordinaire de la conjonction est disjonctif, et rien n’oblige à l’aplanir en « et ».
- source_word: בְּאַיְלוֹת הַשָּׂדֶה
  choice: par les biches des champs
  rationale: אַיְלוֹת désigne des cervidés femelles. « Biches » est courant, poétique et fidèle à l’image féminine; le pluriel français « des champs » rend naturellement la formule hébraïque.
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְרוּ
  choice: n’éveillez pas, ne réveillez pas
  rationale: Après une formule de serment, אִם porte ici une valeur prohibitive. Les deux verbes proches sont maintenus pour reproduire l’insistance poétique sans recourir à la tournure moins naturelle « susciter ou éveiller ».
- source_word: הָאַהֲבָה
  choice: l’amour
  rationale: Le nom abstrait défini se rend naturellement par « l’amour » en français, qui conserve aussi le caractère potentiellement personnifié du terme.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: avant qu’il le désire
  rationale: Le verbe au féminin singulier renvoie le plus naturellement à אַהֲבָה, féminin en hébreu. En français, « amour » est masculin; le pronom « il » suit donc le genre du nom traduit. La formulation conserve l’idée du désir propre de l’amour sans la réduire explicitement à une simple question de moment opportun.
theological_decisions:
- issue: Référent et personnification de « l’amour » dans la proposition finale
  choice: Faire de « l’amour » l’antécédent du verbe et rendre la personnification par « avant qu’il le désire ».
  alternative: 'Traduire de manière temporelle ou impersonnelle : « avant le moment voulu » ou « avant qu’il soit prêt ».'
  rationale: La forme féminine du verbe hébreu s’accorde naturellement avec אַהֲבָה. La traduction retenue préserve cette relation grammaticale et l’ambiguïté poétique quant à la volonté de l’amour, au lieu d’imposer l’interprétation du « bon moment ».
translation_notes:
  register: Français international moderne, digne et poétique. La répétition « n’éveillez pas, ne réveillez pas » reproduit l’insistance des deux verbes hébreux. « Je vous en conjure » garde la solennité de l’adjuration sans employer un vocabulaire juridique trop technique.
