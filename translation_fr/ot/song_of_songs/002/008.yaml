  text: ק֣וֹל דּוֹדִ֔/י הִנֵּה זֶ֖ה בָּ֑א מְדַלֵּג֙ עַל הֶ֣/הָרִ֔ים מְקַפֵּ֖ץ עַל הַ/גְּבָעֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/008.yaml
  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
translation:
  language: fr
  text: La voix[a] de mon bien-aimé ! Le voici qui vient, bondissant sur les montagnes, sautant sur les collines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le son de mon bien-aimé ! » Le terme hébreu peut signifier « voix » ou « son ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: La voix de
  rationale: קוֹל peut désigner la voix ou, plus largement, un son. En français, « La voix de mon bien-aimé ! » est une exclamation naturelle et poétique; le contexte peut évoquer sa voix annonçant son approche. L’autre sens est signalé en note.
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, דּוֹדִי désigne l’homme aimé. « Mon bien-aimé » est actuel, digne et adapté au registre poétique.
- source_word: הִנֵּה זֶה בָּא
  choice: Le voici qui vient
  rationale: Cette tournure rend naturellement en français la présentation vive et déictique de הִנֵּה זֶה, ainsi que l’arrivée exprimée par בָּא.
- source_word: מְדַלֵּג
  choice: bondissant
  rationale: Le participe décrit un déplacement vif et agile. « Bondissant » convient à l’image poétique et conserve la continuité du mouvement.
- source_word: עַל הֶהָרִים
  choice: sur les montagnes
  rationale: Avec ce verbe de mouvement, עַל évoque le parcours du relief. « Sur les montagnes » reste naturel en français sans préciser excessivement la trajectoire.
- source_word: מְקַפֵּץ
  choice: sautant
  rationale: Le second participe est proche du premier et forme un parallélisme. « Sautant » préserve la variation lexicale tout en exprimant le mouvement répété.
- source_word: עַל הַגְּבָעוֹת
  choice: sur les collines
  rationale: Cette expression maintient le parallélisme avec « sur les montagnes » et rend distinctement גְּבָעוֹת par « collines ».
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et immédiatement compréhensible. La syntaxe exclamative et « Le voici qui vient » préservent la vivacité de la scène. Aucun marqueur de note n’est requis, car l’ambiguïté de קוֹל est représentée dans les décisions lexicales mais non ajoutée en note dans ce brouillon.
