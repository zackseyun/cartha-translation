  yaml_path: translation/ot/song_of_songs/002/001.yaml
  text: I am a crocus of Sharon[a], a lily of the valleys.
translation:
  language: fr
  text: Je suis un crocus du Sharon[a], un lis des vallées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une rose du Sharon ». Le mot hébreu חֲבַצֶּלֶת désigne une fleur dont l’espèce exacte est incertaine. « Crocus » est retenu ici comme identification plus probable, tandis que la traduction traditionnelle est signalée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Je suis
  rationale: Le pronom indépendant exprime explicitement l’auto-identification à la première personne; le français exige ici la copule.
- source_word: חֲבַצֶּלֶת
  choice: crocus
  rationale: L’espèce désignée par ce terme hébreu est incertaine. « Crocus » constitue une identification moderne plausible et évite la précision probablement excessive de la traduction traditionnelle « rose ».
- source_word: הַשָּׁרוֹן
  choice: du Sharon
  rationale: Sharon est un nom géographique propre. « Du Sharon » rend simplement la relation construite, sans alourdir le vers par une explicitation telle que « de la plaine du Sharon ».
- source_word: שׁוֹשַׁנַּת
  choice: lis
  rationale: Malgré une certaine incertitude botanique, « lis » est l’équivalent français traditionnel et défendable du terme biblique, tout en conservant l’image florale poétique.
- source_word: הָעֲמָקִים
  choice: des vallées
  rationale: Le pluriel désigne des vallées ou des lieux bas; « des vallées » est naturel en français moderne et maintient le parallélisme poétique.
