  source_fidelity: 'La comparaison et les principaux termes sont bien rendus : « pommier » conserve la traduction traditionnelle de תַּפּוּחַ avec une note appropriée, « mon bien-aimé » rend justement דּוֹדִי, et « jeunes hommes » est un rendu contextuel défendable de בָּנִים, accompagné de la lecture littérale en note. Toutefois, « J’ai pris plaisir à m’asseoir » fusionne les deux verbes finis חִמַּדְתִּי (« j’ai désiré / pris plaisir ») et וְיָשַׁבְתִּי (« je me suis assise ») en une construction infinitive et n’exprime plus explicitement l’action accomplie de s’asseoir.'
