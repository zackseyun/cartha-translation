base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
translation:
  language: fr
  text: 'Comme un pommier[a] parmi les arbres de la forêt,


    tel est mon bien-aimé parmi les jeunes hommes[b].


    J’ai désiré m’asseoir à son ombre,


    et je m’y suis assise,


    et son fruit était doux à mon palais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’espèce exacte désignée par le mot hébreu תַּפּוּחַ est incertaine ; « pommier » est la traduction traditionnelle.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « parmi les fils ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחַ
  choice: pommier
  rationale: « Pommier » est la traduction traditionnelle et la plus immédiatement évocatrice en français. L’identification botanique exacte demeure incertaine, ce que signale la note.
- source_word: בַּעֲצֵי הַיַּעַר
  choice: parmi les arbres de la forêt
  rationale: Cette formulation conserve la comparaison partitive entre un arbre fruitier remarquable et les autres arbres de la forêt.
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, le terme désigne l’homme aimé. « Mon bien-aimé » garde le caractère amoureux et le registre poétique sans lourdeur.
- source_word: בֵּין הַבָּנִים
  choice: parmi les jeunes hommes
  rationale: Dans ce contexte comparatif, בָּנִים désigne les hommes du même groupe d’âge plutôt que des fils au sens familial. Une note conserve le sens littéral.
- source_word: בְּצִלּוֹ
  choice: à son ombre
  rationale: Le suffixe masculin prolonge l’image de l’arbre en l’appliquant au bien-aimé. « À son ombre » est l’expression française naturelle.
- source_word: חִמַּדְתִּי וְיָשַׁבְתִּי
  choice: J’ai pris plaisir à m’asseoir
  rationale: La formulation française réunit naturellement le désir ou le plaisir exprimé par חמד et l’action de s’asseoir exprimée par ישׁב, sans réduire la scène à un désir non réalisé.
- source_word: וּפִרְיוֹ
  choice: et son fruit
  rationale: Le possessif masculin maintient le lien métaphorique entre l’arbre et le bien-aimé.
- source_word: מָתוֹק
  choice: était doux
  rationale: L’imparfait décrit naturellement, dans le récit poétique au passé, la qualité éprouvée du fruit.
- source_word: לְחִכִּי
  choice: à mon palais
  rationale: « Palais » rend concrètement חֵךְ et conserve l’image sensorielle avec une diction poétique naturelle en français.
theological_decisions: []
