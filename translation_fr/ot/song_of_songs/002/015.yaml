  to: Attrapez les renards pour nous[a], les petits renards qui abîment les vignobles[b], car nos vignobles sont en fleurs[c].
  rationale: La révision explicite le sens bénéficiaire de לָנוּ par « pour nous », évitant une ambiguïté de pronom clitique. Elle remplace aussi un verbe potentiellement trop fort par un terme français courant qui laisse ouverte la gravité exacte des dégâts. Les notes conservent les alternatives lexicales pertinentes et leurs ancres restent correctement placées.
