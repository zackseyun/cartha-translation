  source_fidelity: 'La structure et les images du texte hébreu sont bien rendues : impératif pluriel, bénéficiaire pluriel, répétition de « renards », dégâts causés aux vignobles et floraison. Toutefois, « Attrapez-nous les renards » est syntaxiquement possible, mais son placement clitique est ambigu et moins naturel en français international moderne ; « Attrapez les renards pour nous » rend explicitement לָנוּ. « Ravagent » peut suggérer des dégâts plus étendus que le participe מְחַבְּלִים ne l’exige ; « abîment » conserve mieux l’ampleur non précisée du dommage.'
