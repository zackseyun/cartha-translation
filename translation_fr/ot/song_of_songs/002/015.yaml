  text: אֶֽחֱזוּ לָ֨/נוּ֙ שֽׁוּעָלִ֔ים שֽׁוּעָלִ֥ים קְטַנִּ֖ים מְחַבְּלִ֣ים כְּרָמִ֑ים וּ/כְרָמֵ֖י/נוּ סְמָדַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/015.yaml
  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
translation:
  language: fr
  text: Attrapez les renards pour nous[a], les petits renards qui abîment les vignobles[b], car nos vignobles sont en fleurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « renards » peut aussi désigner des « chacals » dans certains contextes.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui ravagent les vignobles ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sont en pleine floraison » ; moins probablement : « portent des raisins encore tendres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶֽחֱזוּ
  choice: Attrapez
  rationale: L’impératif pluriel de אחז appelle à se saisir activement des animaux. « Attrapez » est naturel en français dans ce contexte et conserve la force de l’ordre.
- source_word: לָנוּ
  choice: -nous
  rationale: Le suffixe de première personne du pluriel est rendu par le pronom bénéficiaire « nous », de façon idiomatique dans « Attrapez-nous ».
- source_word: שׁוּעָלִים
  choice: les renards
  rationale: « Renards » est le sens courant et traditionnel; « chacals » demeure possible selon l’étendue sémantique du terme hébreu et figure donc en note.
- source_word: שׁוּעָלִים קְטַנִּים
  choice: les petits renards
  rationale: La répétition de « renards » est conservée, ainsi que l’adjectif « petits », qui souligne leur taille ou leur jeunesse.
- source_word: מְחַבְּלִים
  choice: qui ravagent
  rationale: Le participe décrit une action nuisible en cours. « Ravagent » exprime clairement les dégâts sans imposer l’idée d’une destruction totale.
- source_word: כְּרָמִים
  choice: les vignobles
  rationale: Le nom désigne normalement des vignobles plutôt que des ceps isolés. L’article défini produit ici une formulation française naturelle.
- source_word: וּכְרָמֵינוּ
  choice: car nos vignobles
  rationale: Le waw introduit ici naturellement la raison de l’ordre dans le contexte poétique; « car » explicite cette relation sans modifier l’image.
- source_word: סְמָדַר
  choice: sont en fleurs
  rationale: Le terme évoque la floraison précoce de la vigne. « Sont en fleurs » est clair, actuel et poétique; l’interprétation « portent de jeunes raisins » est moins probable mais signalée en note.
