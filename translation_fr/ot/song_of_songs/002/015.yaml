translation_notes:
  register: Français international moderne, naturel et digne. Le rythme poétique et la répétition de « renards » et « vignobles » sont conservés. « Attrapez-nous » rend idiomatiquement l’idée de « capturez pour nous », tandis que les principales ambiguïtés lexicales sont maintenues en notes.
