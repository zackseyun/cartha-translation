  yaml_path: translation/ot/song_of_songs/002/005.yaml
  text: Sustain me with raisin cakes[a]; refresh me with apples[c][b], for I am sick with love.
translation:
  language: fr
  text: 'Soutenez-moi avec des gâteaux de raisins secs[a],

    ranimez-moi[c] avec des pommes[b],

    car je suis malade d’amour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des gâteaux de raisins » ou « des gâteaux de raisin pressé ».

      '
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traditionnellement traduit par « pommes » peut désigner plus largement un fruit parfumé ; son identification botanique exacte est incertaine.
    reason: cultural_note
  - marker: c
    text: 'Le verbe hébreu peut aussi évoquer l’action de disposer ou d’étendre quelque chose sous quelqu’un ; d’où, selon une autre compréhension : « étendez sous moi des pommes ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכוּנִי
  choice: Soutenez-moi
  rationale: L’impératif pluriel de סמך signifie soutenir ou maintenir. « Soutenez-moi » exprime naturellement l’aide demandée dans cet état de faiblesse.
- source_word: בָּאֲשִׁישׁוֹת
  choice: avec des gâteaux de raisins secs
  rationale: אֲשִׁישׁוֹת désigne vraisemblablement des gâteaux faits de raisins ou de raisins pressés. Cette formulation est claire sans prétendre à une identification plus précise.
- source_word: רַפְּדוּנִי
  choice: ranimez-moi
  rationale: Dans ce parallélisme et devant le complément alimentaire, « ranimez-moi » rend bien la fonction réparatrice probable du verbe, tout en signalant en note son sens concret possible d’arranger ou d’étendre quelque chose sous quelqu’un.
- source_word: בַּתַּפּוּחִים
  choice: avec des pommes
  rationale: « Pommes » conserve la traduction traditionnelle de תַּפּוּחַ. L’identification botanique restant incertaine, cette réserve est indiquée en note.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison des deux demandes. « Car » convient au registre poétique et rend clairement ce rapport logique.
- source_word: חוֹלַת אַהֲבָה
  choice: malade d’amour
  rationale: La locution signifie littéralement que la locutrice est malade à cause de l’amour. « Malade d’amour » préserve l’image et sa force sans la réduire à une simple émotion.
- source_word: אָנִי
  choice: je suis
  rationale: Le pronom indépendant souligne la locutrice; en français, il s’intègre naturellement à « je suis malade d’amour ».
