  text: יוֹנָתִ֞/י בְּ/חַגְוֵ֣י הַ/סֶּ֗לַע בְּ/סֵ֨תֶר֙ הַ/מַּדְרֵגָ֔ה הַרְאִ֨י/נִי֙ אֶתּ מַרְאַ֔יִ/ךְ הַשְׁמִיעִ֖י/נִי אֶת קוֹלֵ֑/ךְ כִּי קוֹלֵ֥/ךְ עָרֵ֖ב וּ/מַרְאֵ֥י/ךְ נָאוֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
translation:
  language: fr
  text: 'Ma colombe,


    dans les fentes du rocher,


    dans l’abri de l’escarpement[a],


    montre-moi ton apparence[b],


    fais-moi entendre ta voix,


    car ta voix est douce


    et ton apparence est ravissante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lieu secret de la pente escarpée » ou « à l’abri du précipice » ; le mot hébreu traduit par « escarpement » est rare et peut désigner une montée rocheuse abrupte, un gradin ou une corniche.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton visage » ou « tes traits » ; le mot hébreu peut désigner plus largement ce qui est visible, l’aspect ou la physionomie.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  choice: Ma colombe
  rationale: Le terme affectueux signifie littéralement « ma colombe ». Cette image poétique est naturelle en français et conserve la tendresse de l’adresse.
- source_word: בְּחַגְוֵי הַסֶּלַע
  choice: dans les fentes du rocher
  rationale: חגוי désigne les fentes ou anfractuosités d’un rocher. « Fentes » rend concrètement l’image et respecte le pluriel hébreu.
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  choice: dans l’abri de l’escarpement
  rationale: סתר évoque un lieu caché ou abrité. Le rare מדרגה paraît désigner une pente rocheuse abrupte, un gradin ou un escarpement ; la traduction garde cette indétermination topographique dans une formulation française naturelle.
- source_word: הַרְאִינִי אֶת־מַרְאַיִךְ
  choice: fais-moi voir ton visage
  rationale: L’impératif hiphil signifie « fais-moi voir ». מראה peut désigner l’apparence visible, les traits ou le visage ; « visage » convient à l’adresse amoureuse, tandis qu’une note signale le sens plus large.
- source_word: הַשְׁמִיעִינִי אֶת־קוֹלֵךְ
  choice: fais-moi entendre ta voix
  rationale: La formulation conserve la valeur causative de l’impératif hiphil tout en restant idiomatique en français et en maintenant le parallélisme avec « fais-moi voir ».
- source_word: עָרֵב
  choice: douce
  rationale: L’adjectif exprime ce qui est agréable ou suave. En français, une voix est naturellement dite « douce » dans ce contexte amoureux.
- source_word: נָאוֶה
  choice: beau
  rationale: L’adjectif signifie « beau, agréable, charmant ». « Beau » s’accorde avec « visage » et conserve la simplicité du compliment.
- source_word: מַרְאַיִךְ / מַרְאֵיךְ
  choice: visage
  rationale: Le même choix est repris aux deux occurrences afin de préserver la cohésion lexicale et le parallélisme du verset, sans masquer dans la note que le terme peut avoir un sens visuel plus large.
