translation_notes:
  register: Poésie amoureuse en français moderne, fluide et digne. Les répétitions de « fais-moi » et de « ton visage » reproduisent le parallélisme et la cohésion de l’hébreu ; la mise en vers rend perceptible sa progression sans ajouter d’interprétation allégorique.
