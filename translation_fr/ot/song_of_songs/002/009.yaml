  text: דּוֹמֶ֤ה דוֹדִ/י֙ לִ/צְבִ֔י א֖וֹ לְ/עֹ֣פֶר הָֽ/אַיָּלִ֑ים הִנֵּה זֶ֤ה עוֹמֵד֙ אַחַ֣ר כָּתְלֵ֔/נוּ מַשְׁגִּ֨יחַ֙ מִן הַֽ/חֲלֹּנ֔וֹת מֵצִ֖יץ מִן הַֽ/חֲרַכִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
translation:
  language: fr
  text: 'Mon bien-aimé ressemble à une gazelle ou à un jeune cerf[a]. Le voici : il se tient derrière notre mur, il regarde par les fenêtres, il jette un regard à travers le treillis[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jeune cervidé ». L’expression hébraïque désigne un jeune animal de la famille des cervidés; « jeune cerf » maintient ici l’image masculine associée au bien-aimé.
    reason: lexical_alternative
  - marker: b
    text: Le « treillis » désigne un dispositif ajouré ou des ouvertures étroites pratiqués dans le mur ou près des fenêtres; il ne s’agit pas nécessairement d’un élément distinct comparable à un treillis moderne.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה דוֹדִי
  choice: Mon bien-aimé ressemble à
  rationale: Le participe exprime une comparaison. « Ressemble à » est naturel en français poétique et conserve explicitement l’idée de similitude; « mon bien-aimé » rend l’affection relationnelle de דּוֹדִי sans surinterprétation.
- source_word: לִצְבִי
  choice: une gazelle
  rationale: « Gazelle » est l’équivalent moderne le plus clair de צְבִי et convient à l’image de grâce et de vivacité.
- source_word: אוֹ לְעֹפֶר הָאַיָּלִים
  choice: à un jeune cerf
  rationale: עֹפֶר désigne un jeune animal et הָאַיָּלִים la famille des cervidés. « Jeune cerf » est idiomatique, maintient l’image masculine du bien-aimé et évite l’archaïsme de « faon des biches ».
- source_word: הִנֵּה זֶה
  choice: Le voici
  rationale: Cette formule déictique attire vivement l’attention sur l’homme aperçu; « Le voici » en restitue l’immédiateté avec naturel.
- source_word: עוֹמֵד אַחַר כָּתְלֵנוּ
  choice: il se tient derrière notre mur
  rationale: Le participe décrit une scène présente. « Se tient » rend la posture avec dignité, tandis que le singulier et le suffixe pluriel sont conservés dans « notre mur ».
- source_word: מַשְׁגִּיחַ מִן הַחֲלֹּנוֹת
  choice: il regarde par les fenêtres
  rationale: Le verbe exprime ici l’action de regarder attentivement depuis l’extérieur. « Par les fenêtres » rend naturellement en français la ligne du regard à travers ces ouvertures, sans ajouter une nuance inquiétante.
- source_word: מֵצִיץ מִן הַחֲרַכִּים
  choice: il épie à travers le treillis
  rationale: מֵצִיץ évoque un regard lancé par une ouverture étroite. Dans ce contexte amoureux, « épie » exprime le regard discret ou furtif; « treillis » représente les ouvertures ou le dispositif ajouré désigné par חֲרַכִּים.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des trois participes hébreux est rendu par trois propositions au présent. La ponctuation après « Le voici » souligne l’apparition vive sans recourir à l’archaïsant « voici que ».
