  text: עָנָ֥ה דוֹדִ֖/י וְ/אָ֣מַר לִ֑/י ק֥וּמִי לָ֛/ךְ רַעְיָתִ֥/י יָפָתִ֖/י וּ/לְכִי לָֽ/ךְ־׃
base_translation:
