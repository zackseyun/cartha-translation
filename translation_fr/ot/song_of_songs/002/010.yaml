  yaml_path: translation/ot/song_of_songs/002/010.yaml
  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: fr
  text: 'Mon bien-aimé a pris la parole et m’a dit : « Lève-toi, mon amie, ma belle, et viens ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנָה
  choice: a pris la parole
  rationale: Dans ce contexte, le verbe introduit la prise de parole du bien-aimé; cette formulation française évite de supposer qu’une question explicite précède.
- source_word: דוֹדִי
  choice: mon bien-aimé
  rationale: Rend naturellement le terme affectueux désignant l’homme aimé dans le Cantique.
- source_word: רַעְיָתִי
  choice: mon amie
  rationale: Conserve l’appellation affectueuse sans lui imposer un statut conjugal que le terme n’explicite pas ici.
- source_word: יָפָתִי
  choice: ma belle
  rationale: Reproduit l’adresse nominale affectueuse, littéralement « ma belle ».
- source_word: קוּמִי לָךְ ... וּלְכִי לָךְ
  choice: Lève-toi ... et viens !
  rationale: Le premier impératif appelle la femme à se lever; le second, littéralement « va pour toi », prend ici en contexte le sens idiomatique de se mettre en route et de venir avec lui.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La répétition de לָךְ n’est pas rendue mécaniquement, car elle renforce ici les invitations plutôt qu’elle n’ajoute un complément distinct. Les guillemets français et l’exclamation restituent l’élan chaleureux de l’appel.
