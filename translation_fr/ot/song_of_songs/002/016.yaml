  text: My beloved is mine[c][b][a], and I am his—he who grazes among the lilies.
translation:
  language: fr
  text: 'Mon bien-aimé[a] est à moi,

    et moi, je suis à lui,

    lui qui paît[b] parmi les lis[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon amant ».
    reason: lexical_alternative
  - marker: b
    text: Le participe hébreu peut aussi se rendre par « celui qui fait paître » ou « celui qui se nourrit parmi les lis ».
    reason: lexical_alternative
  - marker: c
    text: L’espèce de fleur désignée par le mot hébreu est incertaine ; il peut s’agir, plus largement, d’une fleur remarquable.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, דּוֹד désigne l’homme aimé dans une relation intime. « Mon bien-aimé » est naturel, digne et conserve la tendresse du terme sans en réduire la portée à la seule sexualité.
- source_word: לִי
  choice: est à moi
  rationale: La préposition avec suffixe exprime ici une relation d’appartenance réciproque. « Est à moi » rend la brièveté de l’hébreu et évite la formulation plus explicative « m’appartient ».
- source_word: וַאֲנִי לוֹ
  choice: et moi, je suis à lui
  rationale: Cette formulation répond symétriquement à « est à moi » et préserve la réciprocité concise de l’hébreu.
- source_word: הָרֹעֶה
  choice: lui qui fait paître
  rationale: Le participe de רעה peut évoquer l’action de faire paître un troupeau ou celle de paître/se nourrir. « Lui qui fait paître » conserve l’image pastorale et le caractère participial sans ajouter explicitement un troupeau absent du texte.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: parmi les lis
  rationale: Le nom désigne une fleur dont l’identification botanique reste incertaine. « Lis » maintient le rendu traditionnel et poétique, tandis que « parmi » exprime naturellement la valeur locative de la préposition.
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme bref des deux premiers membres est conservé. La reprise « lui qui » maintient le mouvement lyrique tout en rattachant clairement le participe au bien-aimé.
