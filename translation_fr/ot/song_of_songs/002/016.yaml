  terminology: « Mon bien-aimé », « est à moi » et « je suis à lui » sont justes, actuels et d’un registre lyrique approprié. La note alternative pour דּוֹדִי est plus exacte avec « mon amant » que « mon amoureux », ce dernier pouvant désigner une personne simplement éprise.
