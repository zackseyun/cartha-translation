  yaml_path: translation/ot/song_of_songs/002/013.yaml
  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
translation:
  language: fr
  text: Le figuier a formé ses jeunes figues[a], et les vignes en fleur répandent leur parfum[b]. Lève-toi, mon amour, ma belle, et viens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porte ses jeunes figues ». L’hébreu évoque la formation ou le premier développement du fruit, et non nécessairement sa pleine maturité.
    reason: lexical_alternative
  - marker: b
    text: Ou « les vignes aux jeunes grappes répandent leur parfum ». Le terme hébreu peut désigner la floraison ou le tout premier stade de développement des grappes.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « et va pour toi ». Dans le contexte, l’expression constitue une invitation à partir ou à venir, sans préciser explicitement un accompagnement avec le locuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  choice: forme ses premières figues
  rationale: Le verbe et le nom décrivent l’apparition ou le développement des jeunes figues. « Forme ses premières figues » conserve ce stade précoce sans suggérer à tort une pleine maturité.
- source_word: סְמָדַר
  choice: en fleur
  rationale: Le terme désigne la floraison de la vigne ou le tout premier développement des grappes. La mention du parfum favorise ici « en fleur ».
- source_word: נָתְנוּ רֵיחַ
  choice: répandent leur parfum
  rationale: Cette formulation française naturelle restitue l’expression hébraïque « donner une odeur/un parfum » et préserve l’image sensorielle.
- source_word: קוּמִי
  choice: Lève-toi
  rationale: L’impératif exprime une invitation vive et tendre. « Lève-toi » est actuel, naturel et digne.
- source_word: רַעְיָתִי
  choice: mon amour
  rationale: Le terme est une appellation féminine intime et affectueuse. « Mon amour » convient au registre amoureux du Cantique.
- source_word: יָפָתִי
  choice: ma belle
  rationale: L’expression qualifie directement la beauté de la femme. « Ma belle » est concise, tendre et idiomatique en français moderne.
- source_word: וּלְכִי לָךְ
  choice: et viens avec moi
  rationale: Littéralement, le mouvement est formulé avec « aller », accompagné de לָךְ. Dans l’invitation du locuteur, « viens avec moi » rend naturellement le mouvement partagé sans laisser croire qu’il lui demande de partir seule.
