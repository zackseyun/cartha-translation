  text: The blossoms appear in the land; the time of singing has come[a], and the voice of the turtledove is heard in our land.
translation:
  language: fr
  text: Les fleurs apparaissent dans le pays ; le temps des chants est arrivé[a], et la voix de la tourterelle se fait entendre dans notre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le temps de la taille est arrivé ». Le mot hébreu זָמִיר peut désigner soit le chant, soit la taille ; « les chants » est retenu ici parce que ce sens s’accorde avec la mention parallèle de la voix de la tourterelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּנִים
  choice: les fleurs
  rationale: Le terme désigne les fleurs ou les floraisons visibles au printemps. « Les fleurs » est naturel en français moderne et évite le sens plus étroit de boutons encore fermés.
- source_word: נִרְאוּ
  choice: paraissent
  rationale: Le nifal de ראה exprime ici le fait de devenir visible. « Paraissent » conserve ce sens intransitif et le ton poétique.
- source_word: בָאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner la terre ou le pays ; le cadre printanier localisé favorise ici « le pays ».
- source_word: עֵת הַזָּמִיר
  choice: le temps des chants
  rationale: עֵת indique le temps ou la saison, tandis que זָמִיר peut signifier « chant » ou « taille ». Le pluriel français « des chants » évoque naturellement les chants printaniers et s'accorde avec la voix de la tourterelle.
- source_word: הִגִּיעַ
  choice: est arrivé
  rationale: Le verbe signifie ici qu'un temps ou une saison est arrivé. Cette formulation est claire et idiomatique.
- source_word: וְקוֹל הַתּוֹר
  choice: et la voix de la tourterelle
  rationale: קוֹל peut signifier voix ou son, et תּוֹר désigne précisément la tourterelle. « Voix » maintient la qualité lyrique et légèrement personnifiée de l'hébreu.
- source_word: נִשְׁמַע
  choice: se fait entendre
  rationale: Le nifal de שמע signifie « est entendu ». « Se fait entendre » rend naturellement en français l'apparition audible du chant sans ajouter un verbe tel que « appeler ».
- source_word: בְּאַרְצֵנוּ
  choice: dans notre pays
  rationale: Le suffixe de première personne du pluriel crée un cadre partagé et intime ; « notre pays » en conserve le possessif et la tonalité poétique.
