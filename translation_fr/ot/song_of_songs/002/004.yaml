source:
  edition: WLC
  text: הֱבִיאַ֨/נִי֙ אֶל בֵּ֣ית הַ/יָּ֔יִן וְ/דִגְל֥/וֹ עָלַ֖/י אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/004.yaml
  text: He brought me into the house of wine[a], and his banner over me was love.
translation:
  language: fr
  text: Il m’a fait entrer dans la maison du vin[a], et sa bannière au-dessus de moi était l’amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la salle des banquets ». L’hébreu dit plus littéralement « la maison du vin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאַנִי
  choice: Il m’a fait entrer
  rationale: Le hifil accompli de בוא avec suffixe objet exprime l’action de faire venir ou d’introduire. « Il m’a fait entrer » conserve la valeur causative et convient naturellement au mouvement vers un lieu intérieur.
- source_word: אֶל
  choice: dans
  rationale: Avec un verbe de mouvement et un lieu comme destination, אֶל indique ici l’entrée dans ce lieu ; « dans » est idiomatique en français.
- source_word: בֵּית הַיָּיִן
  choice: la maison du vin
  rationale: Cette traduction garde la formulation concrète du syntagme construit hébreu, littéralement « maison du vin », sans expliciter d’emblée qu’il s’agirait d’une salle de banquet.
- source_word: וְדִגְלוֹ
  choice: et sa bannière
  rationale: דֶּגֶל désigne une bannière ou un étendard. « Bannière » préserve l’image poétique d’un signe visible déployé.
- source_word: עָלַי
  choice: au-dessus de moi
  rationale: Dans l’image spatiale de la bannière, עַל est naturellement rendu par « au-dessus de moi », qui évite l’ambiguïté de « sur moi » en français.
- source_word: אַהֲבָה
  choice: l’amour
  rationale: Le nom est sans détermination possessive explicite. « L’amour » conserve la formulation générale et prédicative sans ajouter « son ».
theological_decisions:
- issue: Rapport entre la bannière et l’amour dans la proposition nominale
  choice: sa bannière au-dessus de moi était l’amour
  alternative: son amour était une bannière au-dessus de moi
  rationale: La traduction retenue suit l’ordre et la syntaxe les plus directs de l’hébreu sans transformer « amour » en possesseur ni inverser explicitement l’image.
translation_notes:
  register: Français moderne, poétique et digne. La tournure « maison du vin » est volontairement concrète et légèrement inhabituelle afin de préserver l’image hébraïque ; la note donne l’interprétation idiomatique courante.
