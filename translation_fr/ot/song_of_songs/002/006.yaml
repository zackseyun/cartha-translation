  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: fr
  text: 'Sa main gauche est sous ma tête[a],

    et sa main droite m’enlace.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Son bras gauche… son bras droit » : en hébreu, les termes traduits par « gauche » et « droite » peuvent désigner le côté correspondant, la main ou le bras selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: son bras gauche
  rationale: Le nom désigne le côté gauche et, selon le contexte, la main ou le bras gauche. Ici, la position sous la tête rend « bras gauche » naturel en français et cohérent avec la scène d’étreinte.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition exprime directement une position inférieure; « sous » est précis et idiomatique.
- source_word: לְרֹאשִׁי
  choice: ma tête
  rationale: רֹאשׁ désigne concrètement la tête; avec תַּחַת et la préposition לְ, l’expression signifie « sous ma tête ».
- source_word: וִימִינוֹ
  choice: et son bras droit
  rationale: Le terme désigne le côté droit et peut, dans ce contexte corporel, renvoyer à la main ou au bras. « Bras droit » maintient le parallélisme avec le premier membre et convient au geste d’enlacer.
- source_word: תְּחַבְּקֵנִי
  choice: m’enlace
  rationale: Le verbe חבק signifie « étreindre, enlacer ». Le présent français restitue bien l’imparfait hébreu dans cette description poétique vivante.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. « Bras » est retenu dans le texte pour rendre naturellement la posture intime décrite, tandis que la note conserve l’autre interprétation lexicale légitime, « main ».
