  text: I am my beloved's[a], and my beloved is mine, who grazes among the lilies.
translation:
  language: fr
  text: Je suis à mon bien-aimé, et mon bien-aimé est à moi, qui paît parmi les lis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui fait paître parmi les lis » ou « qui garde un troupeau parmi les lis ». Le participe hébreu peut évoquer le fait de paître, de faire paître ou de garder un troupeau.
    reason: Alternative lexicale liée aux différents sens possibles du participe הָרֹעֶה.
lexical_decisions:
- source_word: אֲנִי לְדוֹדִי
  choice: Je suis à mon bien-aimé
  rationale: La construction avec ל exprime ici l’appartenance. « Je suis à » est idiomatique en français, conserve la formulation poétique et évite une paraphrase explicative comme « j’appartiens à ».
- source_word: וְדוֹדִי לִי
  choice: et mon bien-aimé est à moi
  rationale: La proposition nominale appelle naturellement « est » en français. Cette formulation maintient le parallélisme et la réciprocité des deux membres.
- source_word: הָרֹעֶה
  choice: lui qui paît
  rationale: Le participe de רעה peut signifier paître, faire paître ou garder un troupeau. « Paît » préserve l’image pastorale sans ajouter un troupeau absent du texte, tandis que la note signale l’autre lecture possible.
- source_word: בַּשׁוֹשַׁנִּים
  choice: parmi les lis
  rationale: Dans ce cadre poétique, ב indique la présence au milieu des fleurs. « Lis » maintient le motif floral récurrent du Cantique et la traduction traditionnelle plausible de שׁוֹשַׁנִּים.
theological_decisions:
- issue: Langage d’appartenance réciproque dans le Cantique
  choice: Conserver le langage poétique entre les deux bien-aimés sans développement allégorique.
  alternative: Identifier explicitement le bien-aimé à Dieu ou au Messie dans la traduction.
  rationale: L’hébreu exprime directement l’appartenance amoureuse réciproque. Une interprétation allégorique ultérieure ne doit pas être introduite dans le corps du texte.
- issue: Ambiguïté de l’image pastorale
  choice: Traduire הָרֹעֶה par « lui qui paît » et signaler en note le sens causatif ou pastoral possible.
  alternative: Traduire directement « lui qui fait paître son troupeau » ou « le berger ».
  rationale: Le texte ne nomme aucun troupeau et le participe permet plusieurs nuances. La traduction principale évite d’ajouter un objet, tandis que la note préserve l’autre compréhension légitime.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme « Je suis à… est à moi » conserve la concision de l’hébreu. « Bien-aimé » garde la tonalité affectueuse sans imposer une lecture doctrinale, et « lis » maintient la cohérence des images florales du livre.
