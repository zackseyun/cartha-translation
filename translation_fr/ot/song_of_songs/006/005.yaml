base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
translation:
  language: fr
  text: Détourne tes yeux de moi, car ils me bouleversent[a]. Tes cheveux sont comme un troupeau de chèvres qui descendent du Galaad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car ils me troublent » ou « car ils me subjuguent ». Le verbe hébreu est rare, et sa nuance exacte est discutée.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui dévalent du Galaad » ou « qui descendent sur les pentes du Galaad ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵבִּי עֵינַיִךְ מִנֶּגְדִּי
  choice: Détourne de moi tes yeux
  rationale: L’impératif féminin singulier demande à la femme de détourner son regard de celui qui parle. Cette formulation française est naturelle et conserve la force directe de l’hébreu.
- source_word: שֶׁהֵם הִרְהִיבֻנִי
  choice: car ils me bouleversent
  rationale: Le verbe rare רהב est difficile à préciser ici. Dans ce contexte amoureux, il exprime vraisemblablement l’effet puissant et déstabilisant de son regard; « bouleversent » préserve cette intensité sans trancher excessivement entre trouble et domination.
- source_word: שַׂעְרֵךְ כְּעֵדֶר הָעִזִּים
  choice: Tes cheveux sont comme un troupeau de chèvres
  rationale: La comparaison pastorale est rendue directement; « troupeau » est le terme français courant pour des chèvres.
- source_word: שֶׁגָּלְשׁוּ
  choice: qui dévalent
  rationale: Le verbe évoque un mouvement descendant ou glissant. « Dévalent » restitue clairement et avec vivacité le mouvement du troupeau, tout en servant l’image des cheveux.
- source_word: מִן הַגִּלְעָד
  choice: du Galaad
  rationale: L’hébreu nomme simplement le Galaad avec la préposition מן. La traduction n’ajoute ni montagne ni versants dans le texte principal.
