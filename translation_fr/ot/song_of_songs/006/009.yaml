  verdict: revise
  source_fidelity: 'La structure et les images principales sont bien rendues : la colombe, la parfaite, l’unicité auprès de la mère, les jeunes femmes, les reines et les concubines. Toutefois, « la préférée » ne rend pas de manière suffisamment directe בָּרָה, dont le sens premier dans ce contexte est « pure / sans tache », avec la possible nuance de qualité exceptionnelle signalée en note. La révision restitue ce sens sans trancher au-delà de ce que permet le terme hébreu.'
  naturalness: Le français est poétique et accessible. « Pure aux yeux de celle qui lui a donné naissance » est plus idiomatique que « pure pour celle qui lui a donné naissance » tout en rendant la relation exprimée par le lamed. Le présent poétique est conservé, choix recevable dans ce passage lyrique.
  terminology: « Ma colombe », « ma parfaite », « les jeunes femmes », « les reines », « les concubines » et « font son éloge » conviennent au registre du Cantique. « Elles la déclarent heureuse » rend היטב le piel de אשר sans imposer le sens religieux plus marqué de « bénir ».
