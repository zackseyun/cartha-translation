source:
  edition: WLC
  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
translation:
  language: fr
  text: Elle est unique, ma colombe, ma parfaite[a] ; elle est l’unique enfant de sa mère, pure[b] aux yeux de celle qui lui a donné naissance. Les jeunes femmes[c] la voient et la déclarent heureuse ; les reines et les concubines font son éloge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon irréprochable ». Le mot hébreu peut évoquer la perfection, l’intégrité ou l’absence de défaut.
    reason: lexical_alternative
  - marker: b
    text: Ou « la choisie » ou « la rayonnante ». L’adjectif hébreu peut exprimer la pureté ou une qualité exceptionnelle.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les filles » ; dans le langage poétique du Cantique, cette expression peut désigner plus largement les jeunes femmes.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  choice: ma colombe
  rationale: Conserve l’image poétique littérale et affectueuse, récurrente dans le Cantique, plutôt que de l’aplatir en un terme générique comme « ma bien-aimée ».
- source_word: תַמָּתִי
  choice: ma parfaite
  rationale: Le terme évoque l’intégrité, la plénitude ou l’absence de défaut. « Ma parfaite » est naturel dans une déclaration amoureuse et évite la coloration principalement morale d’« irréprochable ».
- source_word: אַחַת הִיא
  choice: elle est unique / elle est l’unique enfant
  rationale: La répétition souligne l’unicité et la place incomparable de la jeune femme, et non seulement le nombre un.
- source_word: לְאִמָּהּ
  choice: de sa mère
  rationale: Le ל exprime ici la relation à la mère. Avec אַחַת, le français demande une formulation comme « l’unique enfant de sa mère ».
- source_word: בָּרָה
  choice: la préférée
  rationale: Dans le parallélisme familial, le mot peut désigner celle qui est pure, choisie ou distinguée. « La préférée » rend naturellement sa qualité exceptionnelle aux yeux de celle qui l’a enfantée, sans supprimer l’alternative « pure » signalée en note.
- source_word: לְיוֹלַדְתָּהּ
  choice: de celle qui lui a donné naissance
  rationale: Rend explicitement le participe « celle qui l’a enfantée » dans un français actuel et digne.
- source_word: רָאוּהָ
  choice: la voient
  rationale: Le yiqtol narratif coordonné peut se traduire au présent poétique en français, ce qui donne à la scène une immédiateté naturelle.
- source_word: בָנוֹת
  choice: les jeunes femmes
  rationale: Dans l’idiome du Cantique, « filles » désigne souvent les jeunes femmes. La traduction explicite le référent probable, tandis qu’une note conserve le sens littéral.
- source_word: וַיְאַשְּׁרוּהָ
  choice: la disent heureuse
  rationale: Le piel de אשר signifie déclarer quelqu’un heureux ou bienheureux. Cette formulation conserve l’acte d’évaluation sans introduire nécessairement une bénédiction religieuse.
- source_word: מְלָכוֹת
  choice: les reines
  rationale: Équivalent français direct du pluriel hébreu.
- source_word: וּפִילַגְשִׁים
  choice: et les concubines
  rationale: Traduit directement les deux groupes coordonnés, sans ajout nécessaire en français.
- source_word: וַיְהַלְלוּהָ
  choice: font son éloge
  rationale: Rend הלל dans un français poétique, clair et actuel, en évitant la répétition du pronom « la ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu et l’insistance sur l’unicité sont conservés. Le présent poétique unifie la scène et reste compatible avec la valeur discursive des formes verbales hébraïques.
