- from: Elle est unique, ma colombe, ma parfaite[a] ; elle est l’unique enfant de sa mère, la préférée[b] de celle qui lui a donné naissance. Les jeunes femmes[c] la voient et la disent heureuse ; les reines et les concubines font son éloge.
  to: Elle est unique, ma colombe, ma parfaite[a] ; elle est l’unique enfant de sa mère, pure[b] aux yeux de celle qui lui a donné naissance. Les jeunes femmes[c] la voient et la déclarent heureuse ; les reines et les concubines font son éloge.
  rationale: La seule correction nécessaire remplace « la préférée » par « pure », sens lexical central de בָּרָה dans cette formulation. La note conserve les nuances possibles de qualité choisie ou rayonnante. L’ajout idiomatique « aux yeux de » explicite en français la relation à celle qui l’a mise au monde, sans lui attribuer un sens doctrinal ou psychologique supplémentaire.
