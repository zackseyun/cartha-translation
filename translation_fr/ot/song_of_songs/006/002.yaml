base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/002.yaml
  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
translation:
  language: fr
  text: Mon bien-aimé est descendu dans son jardin, aux parterres de plantes aromatiques, pour paître[a] dans les jardins et cueillir des lis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faire paître » ou « se nourrir ». Le verbe hébreu peut évoquer le fait de paître, de faire paître un troupeau ou de se nourrir, et peut maintenir intentionnellement cette ambiguïté pastorale.
    reason: lexical_alternative
  - marker: b
    text: L’espèce exacte de fleur désignée par le mot hébreu est incertaine ; on traduit traditionnellement par « lis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: Mon bien-aimé
  rationale: Dans le Cantique, דּוֹדִי désigne l’homme aimé par la femme. « Mon bien-aimé » exprime naturellement l’affection et le lien relationnel sans les connotations plus étroites que peut avoir « mon amant ».
- source_word: יָרַד
  choice: est descendu
  rationale: Le qatal présente l’action comme accomplie, et le passé composé convient au contexte immédiat tout en conservant le mouvement descendant exprimé par ירד.
- source_word: לְגַנּוֹ
  choice: dans son jardin
  rationale: Après un verbe de mouvement, ל indique ici la destination. En français, « descendre dans son jardin » est plus naturel que « descendre vers son jardin » et exprime l’entrée dans le lieu.
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  choice: vers les parterres de plantes aromatiques
  rationale: עֲרוּגוֹת désigne des parcelles cultivées ou des parterres, tandis que בֹּשֶׂם évoque des substances ou végétaux odorants. Cette formulation conserve à la fois l’image horticole et le parfum.
- source_word: לִרְעוֹת
  choice: pour paître
  rationale: רעה peut signifier paître, faire paître ou se nourrir. « Paître » maintient l’image pastorale et l’ambiguïté du texte sans ajouter explicitement un troupeau absent de l’hébreu.
- source_word: בַּגַּנִּים
  choice: dans les jardins
  rationale: Le pluriel de גַּנִּים est conservé, sans l’harmoniser avec le singulier précédent, afin de respecter la variation poétique du texte.
- source_word: וְלִלְקֹט
  choice: et cueillir
  rationale: לקט signifie ramasser ou recueillir. Pour des fleurs, « cueillir » est le verbe français le plus naturel et précis.
- source_word: שׁוֹשַׁנִּים
  choice: des lis
  rationale: « Lis » est le rendu traditionnel de שׁוֹשַׁנִּים et assure la cohérence des images récurrentes du Cantique, même si l’espèce botanique exacte demeure incertaine.
