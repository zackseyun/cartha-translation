base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/001.yaml
  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
translation:
  language: fr
  text: Où est allé ton bien-aimé, ô la plus belle des femmes ? De quel côté ton bien-aimé s’est-il tourné[a], pour que nous le cherchions avec toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De quel côté ton bien-aimé s’est-il détourné ? » Le verbe peut évoquer un changement de direction, voire le fait de se détourner, et non un simple déplacement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֚נָה
  choice: Où / De quel côté
  rationale: L’adverbe interrogatif demande la destination. « Où » est naturel dans le premier membre ; « de quel côté » rend idiomatiquement l’idée de direction avec פנה dans le second.
- source_word: הָלַ֣ךְ
  choice: est allé
  rationale: Le parfait qal de הלך désigne un déplacement accompli dont on cherche maintenant la destination.
- source_word: דּוֹדֵ֔ךְ
  choice: ton bien-aimé
  rationale: Dans le Cantique, דּוֹד désigne affectueusement l’homme aimé. « Bien-aimé » conserve le registre amoureux et poétique.
- source_word: הַ/יָּפָ֖ה בַּ/נָּשִׁ֑ים
  choice: toi, la plus belle des femmes
  rationale: L’expression est une adresse en apposition et porte ici une valeur superlative. Cette formulation est claire et naturelle en français moderne.
- source_word: פָּנָ֣ה
  choice: s’est tourné
  rationale: Le parfait qal de פנה évoque un changement d’orientation ou de direction. Le verbe « se tourner » préserve cette image sans la réduire à un simple déplacement.
- source_word: וּ/נְבַקְשֶׁ֖/נּוּ
  choice: Nous le chercherons
  rationale: La forme de première personne du pluriel peut exprimer l’intention ou l’encouragement à agir. Une phrase indépendante rend naturellement en français la proposition de se joindre à la recherche.
- source_word: עִמָּֽ/ךְ
  choice: avec toi
  rationale: La préposition avec suffixe féminin singulier exprime directement l’accompagnement.
