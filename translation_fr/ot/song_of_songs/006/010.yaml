  text: מִי זֹ֥את הַ/נִּשְׁקָפָ֖ה כְּמוֹ שָׁ֑חַר יָפָ֣ה כַ/לְּבָנָ֗ה בָּרָה֙ כַּֽ/חַמָּ֔ה אֲיֻמָּ֖ה כַּ/נִּדְגָּלֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/010.yaml
  text: Who is this who looks forth like the dawn[a], beautiful as the moon, bright as the sun[c][b], awe-inspiring as bannered armies?
translation:
  language: fr
  text: Qui est celle qui paraît[a] comme l’aurore, belle comme la lune, éclatante[b] comme le soleil, redoutable comme des troupes sous leurs étendards[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui regarde d’en haut » ; le verbe hébreu peut décrire quelqu’un qui regarde depuis un point élevé ou qui apparaît.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « pure » ou « limpide ».
    reason: lexical_alternative
  - marker: c
    text: Ou « comme des armées portant leurs bannières ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Qui est celle
  rationale: L’interrogatif suivi du démonstratif féminin désigne explicitement une femme. « Qui est celle » garde la forme rhétorique et poétique de l’hébreu en français naturel.
- source_word: הַנִּשְׁקָפָה
  choice: qui se montre
  rationale: Le verbe שׁקף peut évoquer le fait de regarder depuis un point élevé ou d’apparaître. « Se montre » convient à l’apparition progressive de l’aurore sans imposer un emplacement précis.
- source_word: כְּמוֹ שָׁחַר
  choice: comme l’aurore
  rationale: שַׁחַר désigne l’aurore ou le point du jour. « L’aurore » est clair, concis et poétique.
- source_word: יָפָה כַלְּבָנָה
  choice: belle comme la lune
  rationale: Traduction directe qui conserve la comparaison et le parallélisme poétique.
- source_word: בָּרָה כַּחַמָּה
  choice: éclatante comme le soleil
  rationale: בָּרָה peut signifier pure, claire ou lumineuse. Dans la série d’images célestes, « éclatante » rend naturellement la luminosité du soleil tout en signalant l’autre possibilité en note.
- source_word: אֲיֻמָּה
  choice: redoutable
  rationale: Le terme exprime une présence qui inspire la crainte ou le saisissement. « Redoutable » conserve cette force sans lui attribuer une valeur morale négative.
- source_word: כַּנִּדְגָּלוֹת
  choice: comme des troupes sous leurs étendards
  rationale: La forme dérivée de דגל évoque des groupes militaires caractérisés par leurs bannières. Cette formulation française reste vive et intelligible sans préciser indûment leur organisation.
theological_decisions: []
