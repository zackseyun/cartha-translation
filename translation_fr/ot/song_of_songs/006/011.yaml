base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/011.yaml
  text: I went down to the walnut grove to look at the shoots in the valley[a], to see whether the vine had budded[c][b], whether the pomegranates had blossomed.
translation:
  language: fr
  text: Je suis descendue dans le verger de noyers[a] pour regarder les jeunes pousses dans la vallée[b], pour voir si la vigne avait bourgeonné[c], si les grenadiers avaient fleuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le jardin de noyers » ou « dans le jardin des noix ». L’hébreu désigne vraisemblablement un espace cultivé planté de noyers ou d’autres arbres à noix.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « vallée » peut aussi désigner un ravin, un oued ou le lit d’un torrent.
    reason: lexical_alternative
  - marker: c
    text: Ou « avait fleuri ». Le verbe hébreu peut évoquer aussi bien le bourgeonnement que la floraison.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּנַּת אֱגוֹז
  choice: le jardin de noyers
  rationale: גִּנָּה désigne un jardin ou un verger, et אֱגוֹז le noyer ou la noix. « Jardin de noyers » reste proche de l’image hébraïque tout en étant naturel en français.
- source_word: יָרַדְתִּי
  choice: Je suis descendue
  rationale: Le verbe ירד signifie couramment « descendre ». L’accord féminin suit la voix de la bien-aimée dans le contexte immédiat du Cantique.
- source_word: לִרְאוֹת
  choice: pour regarder / pour voir
  rationale: L’infinitif apparaît deux fois. La variation française restitue naturellement le premier examen visuel, puis l’interrogation indirecte introduite par הֲ.
- source_word: בְּאִבֵּי הַנָּחַל
  choice: les jeunes pousses dans la vallée
  rationale: אִבִּים évoque la végétation fraîche ou les jeunes pousses, tandis que נַחַל peut désigner une vallée, un ravin, un oued ou le lit d’un torrent. La formulation conserve une image poétique claire sans effacer l’ambiguïté, signalée en note.
- source_word: הֲפָרְחָה הַגֶּפֶן
  choice: si la vigne avait bourgeonné
  rationale: פרח peut exprimer le fait de bourgeonner ou de fleurir. « Bourgeonné » maintient la distinction lexicale avec נוץ dans le membre suivant.
- source_word: הֵנֵצוּ הָרִמֹּנִים
  choice: si les grenadiers avaient fleuri
  rationale: נוץ désigne ici l’apparition des fleurs. Le français nomme naturellement les arbres, « les grenadiers », plutôt que leurs fruits.
