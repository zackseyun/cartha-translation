  text: יָפָ֨ה אַ֤תְּ רַעְיָתִ/י֙ כְּ/תִרְצָ֔ה נָאוָ֖ה כִּ/ירוּשָׁלִָ֑ם אֲיֻמָּ֖ה כַּ/נִּדְגָּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/004.yaml
  text: You are beautiful[a], my love, like Tirzah, lovely like Jerusalem, awe-inspiring as bannered armies.
translation:
  language: fr
  text: 'Tu es belle, mon amour, comme Tirtsa,

    charmante comme Jérusalem,

    redoutable comme des troupes sous leurs étendards.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire : « imposante comme des armées déployées sous leurs bannières ». L’image est celle de formations ordonnées sous leurs enseignes, dont la vue inspire la crainte et l’admiration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפָה
  choice: belle
  rationale: Adjectif attribut exprimant directement la beauté de la femme ; « belle » est simple, naturel et fidèle.
- source_word: רַעְיָתִי
  choice: mon amour
  rationale: Terme d’affection intime récurrent dans le Cantique ; « mon amour » convient au contexte amoureux et reste naturel en français moderne.
- source_word: כְּתִרְצָה
  choice: comme Tirtsa
  rationale: Le préfixe כְּ marque la comparaison. Le nom de la ville est conservé sous la forme française « Tirtsa ».
- source_word: נָאוָה
  choice: charmante
  rationale: Ce second adjectif est parallèle à יָפָה. « Charmante » préserve la variation poétique sans répéter « belle ».
- source_word: כִּירוּשָׁלִָם
  choice: comme Jérusalem
  rationale: La comparaison et le parallélisme avec Tirtsa sont rendus explicitement, avec la forme française usuelle du nom de la ville.
- source_word: אֲיֻמָּה
  choice: redoutable
  rationale: Le mot évoque ce qui inspire la crainte ou une profonde impression. « Redoutable » conserve la force saisissante de l’image sans lui attribuer une connotation morale négative.
- source_word: כַּנִּדְגָּלוֹת
  choice: comme des troupes sous leurs étendards
  rationale: Le terme désigne vraisemblablement des formations rassemblées ou distinguées par des étendards. Cette formulation restitue l’image militaire ordonnée et imposante sans lourdeur excessive.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du vers hébreu est conservé sur trois lignes. « Redoutable » maintient la tension entre beauté, majesté et crainte, tandis que « troupes sous leurs étendards » explicite sobrement l’image militaire suggérée par l’hébreu.
