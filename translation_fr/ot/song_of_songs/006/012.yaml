  text: Before I knew it[b][a], my soul set me among the chariots of my noble people.
translation:
  language: fr
  text: Avant même que je m’en rende compte, mon âme m’a placé parmi les chars de mon noble peuple.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu est difficile. « Mon âme » peut aussi se comprendre comme « moi-même », « mon cœur » ou « mon désir »; « mon noble peuple » peut également se traduire par « mon peuple princier ».
    reason: lexical_alternative
  - marker: b
    text: 'La fin du vers peut aussi se comprendre ainsi : « parmi les chars d’Ammi-Nadib », si l’on prend les deux derniers mots pour un nom propre.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  choice: Sans que je sache comment
  rationale: Littéralement « je ne savais pas ». Dans ce contexte poétique, la formulation française exprime naturellement l’absence de compréhension ou la soudaineté, sans préciser davantage un hébreu difficile.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la personne elle-même, le cœur intérieur ou le désir. « Mon âme » conserve ici l’image et l’ambiguïté du texte source plutôt que de choisir explicitement « mon désir ».
- source_word: שָׂמַתְנִי
  choice: m’a placé parmi
  rationale: Le verbe שׂוּם signifie fondamentalement « mettre, placer ». Cette traduction garde le sens locatif le plus direct, malgré l’incertitude syntaxique du vers.
- source_word: מַרְכְּבוֹת
  choice: les chars
  rationale: Le nom pluriel désigne directement des chars, probablement des chars de prestige ou de guerre dans l’image poétique.
- source_word: עַמִּי נָדִיב
  choice: mon peuple noble
  rationale: Cette lecture comprend עַמִּי comme « mon peuple » et נָדִיב comme son qualificatif, « noble ». La construction demeure incertaine et peut aussi être lue comme un nom propre.
