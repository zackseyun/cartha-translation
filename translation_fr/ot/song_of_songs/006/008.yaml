- source_word: מְּלָכוֹת
  choice: reines
  rationale: Le pluriel de « reine » convient au contexte royal et préserve le statut exprimé par l’hébreu.
- source_word: וּשְׁמֹנִים
  choice: et quatre-vingts
  rationale: Conjonction et nombre cardinal rendus directement; « quatre-vingts » prend ici la marque du pluriel puisqu’il n’est suivi d’aucun autre nombre.
- source_word: פִּילַגְשִׁים
  choice: concubines
  rationale: Terme français précis et établi pour des femmes reconnues dans une union de rang inférieur à celui des épouses ou des reines.
- source_word: וַעֲלָמוֹת
  choice: et des jeunes femmes
  rationale: עֲלָמוֹת désigne largement de jeunes femmes en âge de se marier, sans imposer à lui seul le sens plus précis de « vierges ».
- source_word: אֵין מִסְפָּר
  choice: sans nombre
  rationale: Expression poétique concise qui conserve l’image hébraïque de l’innombrable tout en restant intelligible en français.
