  yaml_path: translation/ot/song_of_songs/006/007.yaml
  text: Your cheeks are like a slice of pomegranate behind your veil[a].
translation:
  language: fr
  text: Ta joue est comme une moitié de grenade derrière ton voile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « derrière tes mèches » ou « à travers tes cheveux », si לְצַמָּתֵךְ désigne la chevelure plutôt qu’un voile.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  choice: comme une tranche
  rationale: Le préfixe כְּ introduit la comparaison. פֶלַח désigne une partie détachée ou découpée ; « tranche » rend naturellement l’image du fruit ouvert sans préciser indûment s’il s’agit d’une moitié ou d’un quartier.
- source_word: הָרִמּוֹן
  choice: de grenade
  rationale: Le nom désigne la grenade. En français courant, « une tranche de grenade » est plus naturel que la reproduction littérale de l’article hébreu.
- source_word: רַקָּתֵךְ
  choice: ta joue
  rationale: רַקָּה désigne le côté du visage, notamment la tempe. Dans cette comparaison poétique, « joue » exprime naturellement en français la partie visible du visage évoquée par l’image colorée de la grenade, tout en respectant le singulier hébreu.
- source_word: מִבַּעַד
  choice: derrière
  rationale: La préposition présente quelque chose comme visible derrière ou à travers un élément qui le couvre. « Derrière » convient directement avec « voile ».
- source_word: לְצַמָּתֵךְ
  choice: ton voile
  rationale: Dans le Cantique, le terme peut désigner un voile ou, selon une autre analyse, les cheveux ou les mèches. « Voile » s’accorde bien avec מִבַּעַד et avec l’idée d’une beauté partiellement dissimulée ; l’autre interprétation est conservée en note.
