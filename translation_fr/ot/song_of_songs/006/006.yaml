base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/006.yaml
  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: fr
  text: Tes dents sont comme un troupeau de brebis remontées du lavage ; toutes ont des jumeaux[a], et aucune d’elles n’est privée de ses petits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens implicite de la comparaison : « toutes vont par paires ». L’image suggère que chaque dent a sa correspondante.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et il n’y en a pas une de privée de ses petits parmi elles » ; ou : « aucune d’elles n’est endeuillée ». Dans la comparaison, cela souligne qu’aucune dent ne manque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: Tes dents
  rationale: Le nom est au pluriel avec un suffixe possessif féminin singulier. « Tes dents » est l’équivalent français direct et naturel.
- source_word: כְּעֵדֶר הָרְחֵלִים
  choice: comme un troupeau de brebis
  rationale: רְחֵלִים désigne précisément des brebis. Ce choix conserve avec exactitude l’image pastorale.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: qui remontent du lieu où elles se sont lavées
  rationale: La proposition décrit les brebis revenant de la toilette ou du lavage. Cette formulation naturelle garde l’idée d’un mouvement ascendant depuis l’endroit du lavage sans imposer l’image plus précise d’un lavoir aménagé.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: toutes portent des jumeaux
  rationale: Dans la métaphore des brebis, le terme évoque le fait d’avoir des petits jumeaux ; appliqué aux dents, il suggère que chacune a sa correspondante. Le texte principal maintient l’image pastorale, tandis que la note signale l’autre rendu possible.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: et aucune d’elles n’a perdu ses petits
  rationale: שַׁכֻּלָה signifie littéralement qu’une femelle est privée de ses petits ou endeuillée. La formulation conserve cette image tout en restant claire en français ; dans la comparaison, elle suggère qu’aucune dent ne manque.
