revisions:
- from: Tes dents sont comme un troupeau de brebis qui remontent du lieu où elles se sont lavées ; toutes portent des jumeaux[a], et aucune d’elles n’a perdu ses petits[b].
  to: Tes dents sont comme un troupeau de brebis remontées du lavage ; toutes ont des jumeaux[a], et aucune d’elles n’est privée de ses petits[b].
  rationale: La révision supprime une tournure française qui évoque la grossesse plutôt que la possession de petits jumeaux et évite de préciser indûment le cadre du lavage. Elle maintient la métaphore suivie des brebis et l’ambiguïté poétique par laquelle l’image exprime une dentition complète.
