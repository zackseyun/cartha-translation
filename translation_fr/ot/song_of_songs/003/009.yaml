  text: King Solomon made for himself a palanquin from the trees of Lebanon[a].
translation:
  language: fr
  text: Le roi Salomon s’est fait une litière d’apparat en bois du Liban[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « palanquin », « chaise à porteurs » ou « char d’apparat » ; le terme hébreu est rare et son référent exact reste incertain, mais il désigne manifestement un moyen de transport luxueux.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפִּרְיוֹן
  choice: litière d’apparat
  rationale: Le terme hébreu, rare et probablement emprunté, désigne un moyen de transport luxueux sans permettre d’en préciser sûrement la forme. « Litière d’apparat » est compréhensible en français moderne et exprime à la fois le portage et le caractère royal, sans trancher excessivement.
- source_word: עָשָׂה
  choice: s’est fait
  rationale: Le verbe courant signifie « faire ». Avec לֹו et Salomon comme sujet, « s’est fait » rend naturellement en français l’idée qu’il l’a fait fabriquer pour son propre usage, sans préciser qui l’a matériellement construit.
- source_word: לּוֹ
  choice: se
  rationale: La préposition avec suffixe peut signifier « pour lui », mais la coréférence avec le sujet qui suit favorise ici le sens réfléchi, rendu idiomatiquement par « s’est fait ».
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Le roi Salomon
  rationale: Formulation française naturelle du titre suivi du nom propre.
- source_word: מֵעֲצֵי
  choice: avec des arbres de
  rationale: Littéralement « à partir des arbres de ». « Avec des arbres de » conserve l’image concrète de la provenance des matériaux, là où « en bois de » serait plus interprétatif.
- source_word: הַלְּבָנוֹן
  choice: Liban
  rationale: Forme française usuelle du nom géographique.
