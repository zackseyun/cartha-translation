  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
translation:
  language: fr
  text: 'Je vous adjure[a], filles de Jérusalem, par les gazelles ou par les biches des champs[b] : n’éveillez pas l’amour, ne le réveillez pas, jusqu’à ce que l’amour désire être éveillé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vous fais jurer ». Le verbe hébreu exprime ici une mise sous serment ou une exhortation solennelle.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu désigne probablement des gazelles et des biches des champs. Le premier terme peut aussi faire entendre le mot « armées », ce qui crée peut-être un jeu poétique dans la formule de serment.
    reason: cultural_note
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Je vous en conjure
  rationale: Le hifil de שׁבע impose ici un serment ou une exhortation solennelle. « Je vous en conjure » restitue cette force tout en restant naturel et digne en français.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: filles de Jérusalem
  rationale: Le rendu littéral conserve l’adresse poétique et collective propre au Cantique sans la réduire à « femmes » ou « jeunes femmes ».
- source_word: בִּצְבָאוֹת אֹו בְּאַיְלוֹת הַשָּׂדֶה
  choice: par les gazelles ou par les biches des champs
  rationale: Le parallélisme favorise le sens animal de צְבָאוֹת. « Biches » est courant en français moderne, et le pluriel « des champs » rend naturellement la construction hébraïque.
- source_word: אִם ... וְאִם
  choice: ne… pas, ne… pas
  rationale: Dans cette formule de serment, אִם a la force idiomatique d’une interdiction. La répétition française maintient l’insistance des deux verbes.
- source_word: תָּעִירוּ וְתְּעוֹרְרוּ
  choice: n’éveillez pas, ne réveillez pas
  rationale: Deux verbes proches préservent le parallélisme emphatique de l’hébreu. La formulation reste compréhensible tout en reflétant la reprise de la même racine.
- source_word: הָאַהֲבָה
  choice: l’amour
  rationale: Le terme désigne l’amour et peut évoquer à la fois une réalité, un désir ou une réalité personnifiée. « L’amour » conserve cette ouverture poétique.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: avant qu’il le désire
  rationale: Le verbe féminin singulier s’accorde grammaticalement avec אַהֲבָה. Le pronom masculin français reprend naturellement « l’amour » sans identifier une personne humaine; « désire » conserve la nuance de volonté du verbe חפץ.
theological_decisions:
- issue: Référent et personnification de « l’amour » dans la proposition finale
  choice: Faire de « l’amour » le sujet grammatical sans l’identifier à un homme ou à une femme.
  alternative: « avant qu’elle le désire », « avant qu’il le désire » avec référence à une personne, ou la formule traditionnelle « avant qu’il lui plaise »
  rationale: Le féminin du verbe hébreu s’explique naturellement par l’accord avec le nom féminin אַהֲבָה. En français, « il » reprend le nom masculin « amour »; il ne tranche donc pas l’identité éventuelle d’une personne et préserve l’ambiguïté poétique.
translation_notes:
  register: Français international moderne, poétique et digne. L’adresse traditionnelle « filles de Jérusalem » est conservée. Le rythme en deux impératifs négatifs reflète l’insistance hébraïque, et la personnification de l’amour demeure volontairement ouverte.
