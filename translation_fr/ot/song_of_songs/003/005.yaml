  verdict: revise
  source_fidelity: La formule d’adjuration, l’adresse aux filles de Jérusalem, les gazelles et les biches, ainsi que le double appel à ne pas éveiller l’amour correspondent au texte hébreu. Toutefois, « avant qu’il le désire » rend moins directement עַד (« jusqu’à ce que ») et le pronom objet « le » demeure sans antécédent explicite. La révision rétablit la valeur temporelle de l’hébreu et rend explicite, sans identifier l’amour à une personne, que le désir concerne son éveil.
  naturalness: « Je vous adjure » convient au registre poétique et solennel du Cantique et exprime plus précisément une adjuration que « je vous en conjure ». La reprise « n’éveillez pas l’amour, ne le réveillez pas » est idiomatique, poétique et conserve l’insistance des deux verbes hébreux.
  terminology: « Filles de Jérusalem », « gazelles », « biches des champs » et « amour » sont appropriés. « Amour » conserve l’ambiguïté poétique du nom hébreu féminin; la formulation finale ne lui attribue ni identité masculine ni identité féminine humaine.
  issues:
  - severity: medium
    issue: La clausule « avant qu’il le désire » emploie « avant que » plutôt que « jusqu’à ce que » et contient un pronom objet sans antécédent explicite.
    rationale: Le texte porte עַד שֶׁ, « jusqu’à ce que », et le verbe féminin singulier a pour sujet grammatical le mot « amour ». En français, « il le désire » peut se comprendre, mais laisse « le » indéterminé. « Jusqu’à ce que l’amour désire être éveillé » clarifie seulement l’action sous-entendue par l’interdiction, sans déterminer le référent personnel éventuel de l’amour.
  - severity: low
    issue: « Je vous en conjure » peut évoquer davantage une supplication qu’une mise sous serment.
    rationale: Le hifil de שׁבע exprime une adjuration solennelle. « Je vous adjure » est précis, tout en restant recevable dans le registre élevé du poème.
