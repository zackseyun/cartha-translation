  text: 'The watchmen who go about the city found me: “Have you seen the one whom my soul loves?”[a][b]'
translation:
  language: fr
  text: Les gardes qui font leur ronde dans la ville m’ont trouvée. « Avez-vous vu celui que mon âme aime ? »[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression poétique récurrente dans le Cantique.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאוּנִי
  choice: m’ont trouvée
  rationale: Le qal accompli avec suffixe de première personne signifie directement « m’ont trouvée ». L’accord au féminin rend explicite en français le genre de la locutrice établi par le contexte.
- source_word: הַשֹּׁמְרִים
  choice: les gardes
  rationale: Le participe substantivé désigne ceux qui veillent sur la ville. « Gardes » est naturel en français moderne et convient au cadre urbain nocturne.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: qui font leur ronde dans la ville
  rationale: סבב évoque le déplacement circulaire ou répété. « Faire leur ronde » restitue naturellement l’activité régulière des gardes sans recourir au terme plus moderne « patrouiller ».
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: celui que mon âme aime
  rationale: Cette formulation préserve l’expression poétique récurrente du Cantique et rend נֶפֶשׁ par « âme », sans la réduire à « cœur ».
- source_word: רְאִיתֶם
  choice: Avez-vous vu
  rationale: L’accompli à la deuxième personne masculine plurielle fonctionne ici comme une question adressée aux gardes; le passé composé est naturel pour une recherche immédiate.
