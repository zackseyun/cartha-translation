  text: מִ֣י זֹ֗את עֹלָה֙ מִן הַ/מִּדְבָּ֔ר כְּ/תִֽימֲר֖וֹת עָשָׁ֑ן מְקֻטֶּ֤רֶת מוֹר֙ וּ/לְבוֹנָ֔ה מִ/כֹּ֖ל אַבְקַ֥ת רוֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/006.yaml
  text: Who is this coming up from the wilderness like columns of smoke[a], perfumed with myrrh and frankincense[c][b], from every fragrant powder of the merchant?
translation:
  language: fr
  text: Qui est celle-ci qui monte du désert, comme des colonnes de fumée[a], parfumée de myrrhe et d’encens, de toutes les poudres odorantes du marchand ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des piliers de fumée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Qui est celle-ci
  rationale: L’interrogatif suivi du démonstratif féminin signifie littéralement « Qui est celle-ci ? ». Le français permet de conserver naturellement le genre féminin explicite.
- source_word: עֹלָה
  choice: qui monte
  rationale: Le participe de עלה exprime un mouvement ascendant ou une venue depuis un lieu bas ; « qui monte » convient au contexte poétique.
- source_word: מִן הַמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est ici naturel et concis, sans imposer nécessairement l’image de dunes de sable.
- source_word: כְּתִימֲרוֹת עָשָׁן
  choice: comme des colonnes de fumée
  rationale: תִּימֲרוֹת évoque des formes verticales qui s’élèvent ; « colonnes de fumée » préserve clairement cette image.
- source_word: מְקֻטֶּרֶת
  choice: parfumée
  rationale: Le participe passif décrit celle qui est imprégnée de la senteur d’aromates, probablement par fumigation. « Parfumée » exprime naturellement le résultat.
- source_word: מוֹר וּלְבוֹנָה
  choice: de myrrhe et d’encens
  rationale: מוֹר est la myrrhe et לְבוֹנָה l’oliban, couramment appelé « encens » en français biblique et courant.
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  choice: de toutes les poudres odorantes du marchand
  rationale: Le מִן peut ici indiquer les substances dont provient le parfum. אַבְקַת signifie « poudre » ou « poussière » et, dans ce contexte, désigne des poudres aromatiques vendues par un marchand.
