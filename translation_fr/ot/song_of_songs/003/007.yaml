    rationale: « Guerriers » puis « vaillants hommes » transmettent globalement le sens, mais masquent la reprise lexicale hébraïque. Une même traduction aux deux endroits est préférable.
  - severity: low
    issue: « Couche de Salomon » est moins courant que « lit de Salomon » dans cette présentation.
    rationale: « Lit » est naturel en français contemporain et la note permet de conserver explicitement les autres possibilités contextuelles.
