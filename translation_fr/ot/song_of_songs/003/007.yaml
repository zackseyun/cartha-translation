  source_fidelity: 'Le sens fondamental est bien rendu : הִנֵּה introduit la scène, le lit/couch de Salomon est entouré de soixante hommes de valeur issus d’Israël. Toutefois, « Regardez » ajoute un destinataire pluriel que l’interjection hébraïque n’explicite pas. La variation entre « guerriers » et « vaillants hommes » efface aussi la répétition intentionnelle de גִּבּוֹרִים dans le verset.'
  naturalness: « Voici » est une introduction déictique plus idiomatique et plus neutre en français moderne. « Soixante guerriers l’entourent » est fluide et conserve directement la relation exprimée par סָבִיב לָהּ. « D’entre les guerriers d’Israël » rend naturellement la valeur partitive de מִן.
  terminology: « Lit » est le sens français le plus usuel de מִטָּה tout en laissant ouverte, avec la note, la possibilité d’une couche ou d’une litière. Employer « guerriers » aux deux occurrences préserve le lien lexical du texte hébreu sans registre archaïsant.
