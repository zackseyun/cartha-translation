  text: Look[a], it is Solomon’s couch; sixty mighty men are around it, from the mighty men of Israel.
translation:
  language: fr
  text: 'Voici[a] le lit de Salomon : soixante guerriers l’entourent, d’entre les guerriers d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couche » ; le terme hébreu peut désigner un lit ou une couche. À la lumière du contexte, certains y voient une litière royale ou un palanquin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Regardez
  rationale: L’impératif attire naturellement l’attention sur la scène en français moderne et conserve la force déictique de l’hébreu.
- source_word: מִטָּתוֹ
  choice: la couche de Salomon
  rationale: « Couche » peut désigner un lit ou un meuble sur lequel on s’allonge, sans imposer l’interprétation plus précise de litière ou de palanquin suggérée par le contexte.
- source_word: שֶׁלִּשְׁלֹמֹה
  choice: de Salomon
  rationale: Cette tournure rend simplement et naturellement le rapport de possession.
- source_word: שִׁשִּׁים
  choice: soixante
  rationale: Rendu direct du nombre cardinal.
- source_word: גִּבֹּרִים
  choice: guerriers
  rationale: Dans ce contexte de garde armée, « guerriers » exprime clairement la valeur martiale du terme et reste naturel en français actuel.
- source_word: סָבִיב לָהּ
  choice: autour d’elle
  rationale: La formulation conserve la position environnante et reprend naturellement en français le nom féminin « couche ».
- source_word: מִגִּבֹּרֵי יִשְׂרָאֵל
  choice: pris parmi les vaillants hommes d’Israël
  rationale: '« Parmi » rend la valeur partitive de מִן : les soixante hommes sont choisis au sein des hommes valeureux d’Israël. La variation évite une répétition lourde tout en préservant le sens de גִּבּוֹר.'
