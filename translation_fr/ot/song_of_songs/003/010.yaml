translation_notes:
  register: Français international moderne, poétique et digne. La mise en lignes fait ressortir les éléments parallèles de la litière. Les termes concrets restent accessibles, tandis que les incertitudes lexicales de רְפִידָה, מֶרְכָּב et רָצוּף ainsi que l’ambiguïté de מִן sont conservées dans les notes.
