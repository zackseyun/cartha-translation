base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
translation:
  language: fr
  text: 'Il a fait ses colonnes en argent,

    son dossier en or[a],

    son siège en pourpre[b] ;

    son intérieur était pavé d’amour[c]

    par les filles de Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son support » ou « sa base en or » ; le terme hébreu est rare et son sens demeure incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « son habitacle en pourpre » ; le terme hébreu peut désigner plus largement la partie du véhicule où l’on prend place.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « pavé d’amour », expression inhabituelle et poétique. On peut aussi comprendre « revêtu » ou « incrusté d’amour ». La préposition devant « les filles de Jérusalem » peut indiquer l’agent (« par ») ou la provenance (« venant des »).
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: ses colonnes
  rationale: Le nom désigne couramment des colonnes ou des piliers. « Colonnes » conserve l’image architecturale tout en étant naturel pour les montants ouvragés de la litière.
- source_word: עָשָׂה
  choice: Il a fait
  rationale: Rendu direct du verbe courant « faire ». Le sujet masculin singulier renvoie, dans le contexte précédent, à Salomon.
- source_word: כֶסֶף
  choice: argent
  rationale: Désignation usuelle du métal.
- source_word: רְפִידָתוֹ
  choice: son dossier
  rationale: Ce terme rare est incertain et peut désigner une partie servant d’appui, peut-être le dossier, le support ou la base. « Dossier » convient à une litière royale, sans que cette identification puisse être tenue pour certaine.
- source_word: זָהָב
  choice: or
  rationale: Désignation usuelle du métal.
- source_word: מֶרְכָּבוֹ
  choice: son siège
  rationale: Le nom appartient au vocabulaire du véhicule et de l’endroit où l’on prend place. Dans la description des éléments d’une litière, « siège » est clair et plausible, tandis que « habitacle » ou « partie où l’on prend place » resteraient possibles.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Le terme désigne la pourpre, couleur ou matière textile luxueuse. En français, « en pourpre » suggère naturellement le tissu teint.
- source_word: תּוֹכוֹ
  choice: son intérieur
  rationale: Désigne la partie intérieure de la litière ; « intérieur » est précis, naturel et digne.
- source_word: רָצוּף
  choice: a été orné
  rationale: Le participe évoque quelque chose de disposé, garni, pavé ou incrusté. « Orné » produit une formulation française intelligible sans effacer l’étrangeté de l’image, signalée en note.
- source_word: אַהֲבָה
  choice: d’amour
  rationale: Le sens lexical ordinaire est « amour ». Malgré le caractère inhabituel de l’expression, le texte massorétique est conservé plutôt que corrigé ou normalisé.
- source_word: מִבְּנוֹת יְרוּשָׁלִָם
  choice: par les filles de Jérusalem
  rationale: La préposition מִן peut marquer la provenance ou l’agent. Ici, « par » comprend les filles de Jérusalem comme agentes de l’ornementation ; « venant des filles » demeure possible et est indiqué en note.
