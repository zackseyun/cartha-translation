base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/001.yaml
  text: On my bed in the nights I sought the one my soul loves; I sought him[a], but I did not find him.
translation:
  language: fr
  text: Sur mon lit, pendant les nuits, j’ai cherché celui que mon âme aime ; je l’ai cherché, mais je ne l’ai pas trouvé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie le pluriel « les nuits », ce qui peut évoquer des nuits répétées ou plusieurs périodes nocturnes ; certaines traductions rendent simplement « la nuit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  choice: Sur mon lit
  rationale: מִשְׁכָּב désigne ici le lieu où l’on se couche. « Sur mon lit » garde l’image concrète et s’exprime naturellement en français.
- source_word: בַּלֵּילוֹת
  choice: pendant les nuits
  rationale: Le pluriel hébreu est conservé afin de laisser entendre des nuits répétées ou plusieurs périodes nocturnes, sans la tournure peu naturelle « dans les nuits ».
- source_word: בִּקַּשְׁתִּי
  choice: j’ai cherché
  rationale: בקשׁ signifie chercher ou s’efforcer de trouver. « J’ai cherché » est courant, précis et adapté au registre poétique.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: celui que mon âme aime
  rationale: Cette formulation préserve l’expression poétique נַפְשִׁי et le genre masculin indiqué ensuite par les suffixes hébreux, tout en restant claire en français moderne.
- source_word: בִּקַּשְׁתִּיו
  choice: je l’ai cherché
  rationale: La répétition du verbe est maintenue pour respecter le parallélisme et l’intensification du texte hébreu.
- source_word: וְלֹא מְצָאתִיו
  choice: mais je ne l’ai pas trouvé
  rationale: « Mais » rend naturellement la valeur adversative du contexte ; le pronom masculin et le constat de l’échec restent explicites.
theological_decisions: []
