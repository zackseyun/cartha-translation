base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
translation:
  language: fr
  text: Je vais me lever maintenant et parcourir la ville, sur les places de marché et dans les rues ; je chercherai celui que mon âme aime[a]. Je l’ai cherché, mais je ne l’ai pas trouvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui que j’aime de tout mon être ».'
    reason: La tournure hébraïque avec נֶפֶשׁ exprime l’amour de la personne tout entière ; la traduction principale en conserve l’image littérale.
lexical_decisions:
- source_word: אָקוּמָה נָּא
  choice: Je vais me lever maintenant
  rationale: Le cohortatif exprime ici une résolution immédiate, et נָא en souligne l’urgence. Cette formulation est naturelle en français tout en conservant l’idée d’intention.
- source_word: וַאֲסוֹבְבָה בָעִיר
  choice: et parcourir la ville
  rationale: Le verbe סבב évoque le fait de circuler dans la ville en la sillonnant. « Parcourir » rend clairement ce mouvement orienté vers la recherche.
- source_word: בַּשְּׁוָקִים וּבָרְחֹבוֹת
  choice: dans les rues et sur les places
  rationale: שְׁוָקִים peut désigner les rues, notamment les voies publiques fréquentées, tandis que רְחֹבוֹת désigne des espaces larges et ouverts, tels que les places. Ce couple français restitue naturellement les deux types d’espaces urbains.
- source_word: אֲבַקְשָׁה
  choice: je chercherai
  rationale: Le second cohortatif prolonge la résolution de la locutrice. « Chercher » est le verbe français courant et précis dans ce contexte.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: celui que mon âme aime
  rationale: La formulation conserve l’image poétique de נֶפֶשׁ et le refrain caractéristique du livre, sans la réduire d’emblée à « celui que j’aime ».
- source_word: בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו
  choice: Je l’ai cherché, mais je ne l’ai pas trouvé
  rationale: La répétition de « chercher » reflète celle de la racine בקשׁ. « Mais » explicite naturellement en français le contraste porté ici par la coordination.
theological_decisions:
- issue: Portée de נַפְשִׁי dans l’expression amoureuse
  choice: Conserver « mon âme » dans le texte
  alternative: « celui que j’aime de tout mon être » ou simplement « celui que j’aime »
  rationale: נֶפֶשׁ peut désigner la personne, la vie ou l’être intérieur. Garder l’image de l’âme préserve la densité poétique et l’ambiguïté anthropologique du texte sans lui imposer une définition doctrinale.
translation_notes:
  register: Français moderne, poétique et digne. Le passage abrupt de la résolution au récit accompli est conservé. La ponctuation maintient l’élan de la recherche, et le refrain « celui que mon âme aime » garde sa coloration littéraire sans archaïsme grammatical.
