  yaml_path: translation/ot/song_of_songs/003/008.yaml
  text: All of them are holding swords[a], trained in warfare; each man has his sword at his thigh because of terror in the nights.
translation:
  language: fr
  text: Tous portent l’épée, entraînés au combat ; chacun a son épée à la cuisse, par crainte pendant les nuits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les nuits ». Ce pluriel poétique peut aussi avoir le sens général de « la nuit » ou « pendant la nuit ».'
    reason: La formulation hébraïque au pluriel est inhabituelle en français et admet une expression temporelle plus idiomatique.
lexical_decisions:
- source_word: כֻּלָּם
  choice: Tous
  rationale: Le pronom suffixé inclut explicitement l’ensemble du groupe ; « Tous » exprime naturellement cette totalité en français.
- source_word: אֲחֻזֵי חֶרֶב
  choice: portent l’épée
  rationale: La construction participiale avec חֶרֶב décrit des hommes munis d’une épée et prêts à s’en servir. Le singulier collectif « l’épée » conserve la formulation hébraïque sans suggérer qu’ils partageraient une seule arme.
- source_word: מְלֻמְּדֵי מִלְחָמָה
  choice: entraînés au combat
  rationale: Le participe de למד indique qu’ils ont été instruits ou entraînés ; « au combat » rend naturellement le sens militaire de מִלְחָמָה.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif individualise les membres du groupe. « Chacun » est naturel en français, tandis que le contexte des gardes armés suffit à identifier les personnes visées.
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  choice: a son épée à la cuisse
  rationale: La formulation conserve l’image concrète de l’arme placée contre la cuisse, vraisemblablement attachée et prête à être tirée.
- source_word: מִפַּחַד
  choice: à cause de la terreur
  rationale: La préposition מִן est comprise dans son sens causal. « Terreur » conserve l’intensité possible de פַּחַד sans préciser artificiellement la nature de la menace.
- source_word: בַּלֵּילוֹת
  choice: des nuits
  rationale: Le pluriel hébreu est conservé dans une tournure poétique française, tout en signalant en note qu’il peut désigner plus généralement le danger nocturne.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme militaire est préservé, ainsi que l’image de l’épée à la cuisse et l’expression volontairement évocatrice « la terreur des nuits ».
