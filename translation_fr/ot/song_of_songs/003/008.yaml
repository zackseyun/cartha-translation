    issue: « à cause de la terreur des nuits » est syntaxiquement ambigu
    rationale: Le syntagme hébreu מִפַּחַד בַּלֵּילוֹת signifie littéralement « à cause de la crainte/terreur dans les nuits ». En français, « la terreur des nuits » ne préserve pas nettement cette relation temporelle et peut suggérer une qualité des nuits plutôt que la crainte éprouvée pendant celles-ci.
