base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
translation:
  language: fr
  text: Je venais à peine de les dépasser lorsque j’ai trouvé celui que mon âme aime[a]. Je l’ai tenu et je ne l’ai pas laissé partir jusqu’à ce que je l’aie amené dans la maison de ma mère, dans la chambre de celle qui m’a conçue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus couramment : « celui que j’aime ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « la chambre de celle qui m’a conçue », expression poétique parallèle à « la maison de ma mère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם
  choice: Je les avais à peine dépassés
  rationale: La tournure française « à peine… que » rend naturellement la succession presque immédiate exprimée par כִּמְעַט, tandis que « dépassés » indique qu’elle vient de laisser derrière elle les gardes mentionnés au verset précédent.
- source_word: עַד שֶׁמָּצָאתִי
  choice: que j’ai trouvé
  rationale: Après « à peine », « que » exprime en français la quasi-immédiateté de la découverte. Une traduction mécanique par « jusqu’à ce que » serait maladroite ici.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: celui que mon âme aime
  rationale: Cette formulation conserve נֶפֶשׁ, le « moi » profond ou la personne tout entière, ainsi que le caractère poétique du refrain, sans le réduire au simple « celui que j’aime ».
- source_word: אֲחַזְתִּיו
  choice: Je l’ai serré contre moi
  rationale: Le verbe אחז signifie saisir ou tenir fermement. Dans ce contexte amoureux, « serré contre moi » communique une étreinte ferme sans suggérer une saisie violente.
- source_word: וְלֹא אַרְפֶּנּוּ
  choice: je ne l’ai pas laissé partir
  rationale: Le hiphil de רפה signifie ici relâcher ou laisser aller. Cette formulation est claire et idiomatique en français.
- source_word: עַד שֶׁהֲבֵיאתִיו
  choice: jusqu’à ce que je l’aie amené
  rationale: Le subjonctif passé convient après « jusqu’à ce que » et présente l’arrivée comme le terme de l’action précédente.
- source_word: אֶל בֵּית אִמִּי
  choice: dans la maison de ma mère
  rationale: « Dans » rend le mouvement vers l’intérieur du lieu, et non seulement vers la maison.
- source_word: וְאֶל חֶדֶר הוֹרָתִי
  choice: dans la chambre de celle qui m’a conçue
  rationale: Le participe הוֹרָתִי désigne littéralement celle qui a conçu la narratrice. La formulation préserve le parallélisme poétique avec « ma mère » sans transformer le second membre en simple répétition.
theological_decisions: []
translation_notes:
  register: Français moderne, international et poétique. La structure « à peine… que » assure une narration fluide; « celui que mon âme aime » conserve délibérément l’image hébraïque récurrente. Le féminin de « conçue » suit l’identité de la voix féminine dans le contexte du Cantique.
