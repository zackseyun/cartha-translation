  variant: modern international French
source:
  edition: WLC
  text: צְאֶ֧ינָה וּֽ/רְאֶ֛ינָה בְּנ֥וֹת צִיּ֖וֹן בַּ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה בָּ/עֲטָרָ֗ה שֶׁ/עִטְּרָה לּ֤/וֹ אִמּ/וֹ֙ בְּ/י֣וֹם חֲתֻנָּת֔/וֹ וּ/בְ/י֖וֹם שִׂמְחַ֥ת לִבּֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
translation:
  language: fr
  text: Sortez et regardez, filles de Sion, le roi Salomon, portant la couronne[a] dont sa mère l’a couronné le jour de ses noces, le jour de la joie de son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couronne de fête » ou « la guirlande » ; le mot hébreu peut désigner une couronne ou une parure circulaire festive, ce qui convient au contexte de noces.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה וּרְאֶינָה
  choice: Sortez et regardez
  rationale: Les deux impératifs féminins pluriels sont conservés. Cette formulation naturelle exprime à la fois le mouvement vers l’extérieur et l’appel à contempler.
- source_word: בְּנוֹת צִיּוֹן
  choice: filles de Sion
  rationale: Le groupe est pris comme une apostrophe adressée aux femmes de Sion. Le français n’exige pas de particule vocative comme « ô ».
- source_word: בַּמֶּלֶךְ שְׁלֹמֹה
  choice: le roi Salomon
  rationale: Après le verbe « regarder », la préposition hébraïque introduit l’objet de la contemplation et se rend naturellement par un complément direct en français.
- source_word: בָּעֲטָרָה
  choice: portant la couronne
  rationale: Le participe « portant » exprime clairement la circonstance indiquée par la préposition hébraïque, sans donner à entendre que Salomon se trouve matériellement dans la couronne.
- source_word: עֲטָרָה
  choice: couronne
  rationale: Le terme peut désigner une couronne ou une parure circulaire festive. « Couronne » est le choix français le plus large et maintient le lien lexical avec le verbe « couronner ».
- source_word: שֶׁעִטְּרָה לּוֹ אִמּוֹ
  choice: dont sa mère l’a couronné
  rationale: Cette tournure française rend le relatif et préserve le jeu étymologique entre « couronne » et « couronner ».
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  choice: le jour de ses noces
  rationale: « Noces » désigne naturellement la célébration du mariage et convient au registre poétique du Cantique.
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  choice: le jour de la joie de son cœur
  rationale: La formulation conserve le parallélisme ainsi que l’expression hébraïque littérale, tout en restant intelligible en français.
theological_decisions: []
