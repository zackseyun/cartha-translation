  text: שִׂימֵ֨/נִי כַֽ/חוֹתָ֜ם עַל לִבֶּ֗/ךָ כַּֽ/חוֹתָם֙ עַל זְרוֹעֶ֔/ךָ כִּֽי עַזָּ֤ה כַ/מָּ֨וֶת֙ אַהֲבָ֔ה קָשָׁ֥ה כִ/שְׁא֖וֹל קִנְאָ֑ה רְשָׁפֶ֕י/הָ רִשְׁפֵּ֕י אֵ֖שׁ שַׁלְהֶ֥בֶתְ יָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
translation:
  language: fr
  text: 'Pose-moi comme un sceau sur ton cœur,

    comme un sceau sur ton bras ;

    car l’amour est fort comme la mort,

    la jalousie, implacable comme le shéol[a].

    Ses éclats sont des éclats de feu[b],

    une flamme de Yah[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le monde des morts ». Le shéol désigne le séjour des morts et peut parfois être rendu par « la tombe » ou « la mort » selon le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Ses étincelles sont des étincelles de feu » ; le mot hébreu peut aussi évoquer des flammes ou des traits ardents.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement « une flamme de Yah », Yah étant une forme brève du nom divin. L’expression peut aussi être comprise comme un superlatif : « une flamme puissante » ou « une flamme ardente ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂימֵנִי
  choice: Pose-moi
  rationale: L’impératif avec suffixe de première personne exprime une demande directe et intime. « Pose-moi » est naturel en français et convient à l’image concrète du sceau.
- source_word: כַחוֹתָם
  choice: comme un sceau
  rationale: חוֹתָם désigne un sceau ou un cachet servant à marquer l’identité, l’appartenance ou l’authenticité. « Sceau » conserve clairement la métaphore.
- source_word: עַל לִבֶּךָ / עַל זְרוֹעֶךָ
  choice: sur ton cœur / sur ton bras
  rationale: La formulation littérale préserve le parallélisme entre le cœur et le bras, ainsi que la portée à la fois intérieure et visible de l’image.
- source_word: כִּי עַזָּה כַמָּוֶת אַהֲבָה
  choice: car l’amour est fort comme la mort
  rationale: עַזָּה exprime ici la force ou la puissance. La comparaison abrupte avec la mort est gardée sans l’atténuer.
- source_word: קָשָׁה כִשְׁאוֹל קִנְאָה
  choice: la jalousie, implacable comme le shéol
  rationale: קִנְאָה peut désigner la jalousie, le zèle ou une ardeur exclusive. « Jalousie » préserve cette tension, tandis qu’« implacable » rend la dureté et le caractère inexorable exprimés par קָשָׁה.
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: Le terme hébreu est translittéré afin de ne pas le réduire à la seule tombe physique. Une note en donne une formulation française possible.
- source_word: רְשָׁפֶיהָ רִשְׁפֵּי אֵשׁ
  choice: Ses éclats sont des éclats de feu
  rationale: רֶשֶׁף peut évoquer une flamme, une étincelle, un trait ardent ou un éclat. La répétition française reproduit l’insistance poétique de l’hébreu sans fixer excessivement l’image.
- source_word: שַׁלְהֶבֶתְ יָה
  choice: une flamme de Yah
  rationale: יָה est la forme brève du nom divin. La conserver rend visible cette donnée du texte hébreu, tandis qu’une note signale l’interprétation intensive possible.
theological_decisions:
- issue: שַׁלְהֶבֶתְ יָה renvoie-t-il explicitement au nom divin ou constitue-t-il seulement un superlatif ?
  choice: 'Conserver la référence explicite : « une flamme de Yah »'
  alternative: « une flamme puissante » ou « une flamme ardente »
  rationale: Le texte contient explicitement יָה, forme brève du nom divin. La traduction principale garde cet élément potentiellement significatif sans exclure l’analyse intensive, indiquée en note.
- issue: Faut-il adoucir קִנְאָה dans le contexte amoureux ?
  choice: « la jalousie »
  alternative: « la passion », « l’ardeur » ou « le zèle »
  rationale: « Jalousie » maintient la notion d’attachement exclusif et l’intensité parfois troublante du mot hébreu, au lieu de résoudre la tension du poème.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et les répétitions de l’hébreu sont conservés. « Shéol » et « Yah » maintiennent les particularités du texte source, avec des notes pour les lecteurs qui ne connaissent pas ces termes.
