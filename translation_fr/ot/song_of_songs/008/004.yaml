base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/004.yaml
  text: 'I adjure you[b][a], daughters of Jerusalem: why should you awaken or stir up love until it desires?'
translation:
  language: fr
  text: 'Je vous en conjure[a], filles de Jérusalem : pourquoi éveilleriez-vous, ou pourquoi réveilleriez-vous l’amour jusqu’à ce que l’amour le veuille[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Je vous adjure […] de ne pas éveiller ni réveiller l’amour jusqu’à ce qu’il le veuille. » La formulation hébraïque est interrogative, mais elle peut avoir ici la force d’une interdiction solennelle.'
    reason: alternative_reading
  - marker: b
    text: En hébreu, le verbe est au féminin singulier et s’accorde avec le nom féminin traduit par « amour ». L’amour est ainsi personnifié. Le texte ne précise pas l’objet de « veuille » ; en français, il renvoie implicitement à l’action d’éveiller ou de réveiller l’amour. « Amour » étant masculin en français, le sujet est exprimé pour préserver cette personnification.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Je vous en conjure
  rationale: Le hiphil de שׁבע exprime ici une adjuration solennelle, littéralement le fait de placer quelqu’un sous serment. « Je vous en conjure » conserve la solennité sans être excessivement juridique.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: filles de Jérusalem
  rationale: Cette traduction littérale préserve l’apostrophe poétique récurrente du Cantique; « jeunes femmes de Jérusalem » serait plus interprétatif.
- source_word: מַה
  choice: pourquoi… ?
  rationale: Le mot interrogatif est conservé plutôt que transformé silencieusement en interdiction explicite. Dans cette formule, la question possède néanmoins la force pragmatique d’un appel à ne pas agir.
- source_word: תָּעִירוּ וּמַה תְּעֹרְרוּ
  choice: éveilleriez-vous ou réveilleriez-vous
  rationale: Les deux formes apparentées sont rendues par deux verbes français proches afin de préserver le redoublement poétique. Le conditionnel convient à la question rhétorique française.
- source_word: הָאַהֲבָה
  choice: l’amour
  rationale: Le terme désigne l’amour comme réalité ou passion, sans imposer une interprétation plus étroite.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: jusqu’à ce qu’il le désire
  rationale: La traduction garde עַד (« jusqu’à ce que ») et le sens de désir porté par חפץ. Le pronom sujet personnifie l’amour, même si le genre grammatical passe nécessairement du féminin hébreu au masculin français.
theological_decisions:
- issue: Valeur de la question introduite par מַה dans la formule d’adjuration
  choice: 'Conserver la forme interrogative : « pourquoi… ? »'
  alternative: 'Rendre la force pragmatique par une interdiction : « n’éveillez pas… »'
  rationale: La forme choisie reflète plus directement le texte hébreu et maintient son ambiguïté entre question rhétorique et défense solennelle, sans résoudre cette tension dans le corps du verset.
translation_notes:
  register: Français international moderne, poétique et solennel. « Je vous en conjure » garde la force de l’adjuration tout en restant intelligible. Le parallélisme « éveiller… réveiller » reproduit le redoublement hébreu sans employer le possible mais ambigu « exciter l’amour ».
