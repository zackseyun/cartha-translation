    issue: Pronom objet non ancré dans « jusqu’à ce qu’il le désire »
    rationale: Le texte hébreu a un verbe féminin singulier sans objet exprimé. En français, « il le désire » appelle un référent masculin singulier pour « le » et peut être lu de façon confuse. Nommer « l’amour » comme sujet et employer « le veuille » rend l’implicite contextuel intelligible sans ajouter de référent doctrinal ou narratif.
  - severity: low
    issue: La seconde interrogation n’est pas explicitement répétée
    rationale: L’hébreu répète מַה avant le second verbe. Répéter « pourquoi » en français reflète mieux la structure rhétorique et le parallélisme.
