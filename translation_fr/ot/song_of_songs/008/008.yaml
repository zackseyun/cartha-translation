  text: אָח֥וֹת לָ֨/נוּ֙ קְטַנָּ֔ה וְ/שָׁדַ֖יִם אֵ֣ין לָ֑/הּ מַֽה נַּעֲשֶׂה֙ לַ/אֲחֹתֵ֔/נוּ בַּ/יּ֖וֹם שֶׁ/יְּדֻבַּר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
translation:
  language: fr
  text: Nous avons une petite sœur, et elle n’a pas de seins. Que ferons-nous pour notre sœur le jour où l’on parlera d’elle[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le contexte peut aussi suggérer : « où elle sera demandée en mariage », c’est-à-dire lorsque des pourparlers matrimoniaux auront lieu à son sujet.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוֹת לָנוּ
  choice: Nous avons une … sœur
  rationale: La construction hébraïque exprime littéralement qu’une sœur est « à nous ». « Nous avons une sœur » rend cette possession familiale de façon naturelle en français.
- source_word: קְטַנָּה
  choice: petite
  rationale: L’adjectif peut évoquer la petitesse ou la jeunesse. « Petite sœur » est idiomatique et suggère son jeune âge sans le préciser davantage.
- source_word: וְשָׁדַיִם אֵין לָהּ
  choice: et elle n’a pas de seins
  rationale: 'L’hébreu est direct et concret : « des seins, elle n’en a pas ». La formulation retenue conserve cette franchise et le signe d’immaturité physique sans ajouter l’idée explicative de seins « non formés ».'
- source_word: מַה נַּעֲשֶׂה
  choice: Que ferons-nous
  rationale: L’imparfait hébreu à la première personne du pluriel exprime ici une délibération portant sur l’avenir. Le futur français restitue naturellement cette question.
- source_word: לַאֲחֹתֵנוּ
  choice: pour notre sœur
  rationale: La préposition ל indique vraisemblablement une action envisagée en faveur de la sœur ; « pour » conserve ce sens.
- source_word: בַּיּוֹם
  choice: le jour où
  rationale: Cette formulation garde l’expression temporelle explicite de l’hébreu tout en étant naturelle en français.
- source_word: שֶׁיְּדֻבַּר בָּהּ
  choice: où l’on parlera d’elle
  rationale: Le passif de דבר construit avec ב permet le sens général « parler d’elle ». Le contexte peut viser plus précisément des pourparlers matrimoniaux, possibilité signalée en note sans réduire l’ambiguïté du texte.
