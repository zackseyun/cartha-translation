  text: מִ֤י יִתֶּנְ/ךָ֙ כְּ/אָ֣ח לִ֔/י יוֹנֵ֖ק שְׁדֵ֣י אִמִּ֑/י אֶֽמְצָאֲ/ךָ֤ בַ/חוּץ֙ אֶשָׁ֣קְ/ךָ֔ גַּ֖ם לֹא יָב֥וּזוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
translation:
  language: fr
  text: Si seulement tu étais pour moi comme un frère, qui tétait les seins de ma mère ! Si je te rencontrais dehors, je t’embrasserais[b], et personne ne me mépriserait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Il s’agit de l’embrasser en public comme on pouvait embrasser un frère sans provoquer de réprobation.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu dit littéralement : « ils ne me mépriseraient pas », avec un pluriel indéfini désignant les gens en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  choice: Ah ! Si seulement tu étais
  rationale: L’expression hébraïque מִי יִתֵּן formule ici un souhait, non une question littérale. « Si seulement » rend naturellement cette valeur optative en français.
- source_word: כְּאָח לִי
  choice: pour moi comme un frère
  rationale: La préposition כְּ exprime une comparaison plutôt qu’une identité, tandis que לִי marque la relation personnelle.
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  choice: allaité aux seins de ma mère
  rationale: Le participe יוֹנֵק décrit celui qui tète ou est allaité. Cette formulation conserve l’image maternelle concrète et reste naturelle en français.
- source_word: אֶמְצָאֲךָ
  choice: Si je te rencontrais
  rationale: Dans ce contexte de souhait, l’inaccompli a une valeur hypothétique. « Rencontrer » convient au fait de trouver quelqu’un dans un lieu public.
- source_word: בַחוּץ
  choice: dehors
  rationale: Le terme désigne l’extérieur ou l’espace public sans imposer le sens plus précis de « rue ».
- source_word: אֶשָׁקְךָ
  choice: je t’embrasserais
  rationale: Le verbe signifie « embrasser » ; le conditionnel français prolonge naturellement l’hypothèse introduite auparavant.
- source_word: גַּם לֹא יָבֻזוּ לִי
  choice: et personne ne me mépriserait
  rationale: La troisième personne du pluriel a ici une valeur indéfinie. « Personne » exprime idiomatiquement la désapprobation générale envisagée.
theological_decisions:
- issue: Image fraternelle dans un poème amoureux
  choice: Conserver la comparaison avec un frère comme expression d’une affection publiquement admise
  alternative: Éviter l’image fraternelle par une paraphrase, ou comprendre qu’il s’agit d’une parenté réelle
  rationale: Le texte souhaite que le bien-aimé soit socialement comparable à un frère nourri par la même mère, afin qu’un baiser public ne suscite pas le mépris. La traduction maintient cette image sans en tirer une affirmation de parenté réelle ni une conclusion doctrinale.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le tour « Ah ! Si seulement » conserve l’intensité du souhait ; « dehors » maintient sans surinterprétation le cadre public.
