  rationale: La révision remplace le participe passif ambigu « allaité » par « qui tétait », qui rend directement le participe actif יוֹנֵק et l’image explicite des seins maternels. Elle supprime aussi l’interjection redondante. La note a est conservée dans le jeu complet de notes, mais aucun appel [a] n’est requis dans le texte puisque « Si seulement » est retenu comme traduction principale, non comme alternative.
