  source_fidelity: 'La structure optative et hypothétique est bien rendue : מִי יִתֶּנְךָ est un souhait, כְּאָח לִי demeure une comparaison, et le pluriel indéfini de יָבֻזוּ est correctement exprimé par « personne ». La seule correction nécessaire concerne יוֹנֵק, participe actif : « allaité » peut se comprendre passivement et atténue l’image précise de celui qui tète les seins de la mère. « qui tétait les seins de ma mère » conserve l’agent, l’imparfait participial et l’image concrète.'
