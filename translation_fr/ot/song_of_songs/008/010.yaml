  text: I am a wall[a], and my breasts are like towers; then I was in his eyes like one who finds peace.
translation:
  language: fr
  text: 'Moi, je suis une muraille,

    et mes seins sont comme des tours.

    Alors, à ses yeux,

    j’étais comme celle qui trouve la paix[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme celle qui obtient la paix » ; l’expression hébraïque peut aussi évoquer plus largement le bien-être, la plénitude ou une situation favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: muraille
  rationale: Le nom désigne un mur, vraisemblablement une enceinte défensive. « Muraille » s’accorde naturellement avec l’image des tours et exprime la solidité sans développer davantage la métaphore.
- source_word: שָׁדַי
  choice: mes seins
  rationale: L’hébreu désigne explicitement les seins de la femme. Cette traduction directe conserve l’imagerie corporelle du poème.
- source_word: כַּמִּגְדָּלוֹת
  choice: comme des tours
  rationale: La comparaison architecturale est au pluriel. « Tours » est transparent et prolonge naturellement l’image de la muraille.
- source_word: אָז
  choice: alors
  rationale: L’adverbe marque ici une transition temporelle ou logique; « alors » maintient cette souplesse.
- source_word: הָיִיתִי
  choice: j’ai été
  rationale: La forme de היה exprime d’abord le fait d’être. « J’ai été » évite d’imposer la nuance plus nettement progressive de « je suis devenue », même si celle-ci est possible dans le contexte.
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: Cette expression idiomatique évoque le regard ou l’estimation de l’homme et reproduit naturellement l’image hébraïque en français.
- source_word: כְּמוֹצְאֵת
  choice: comme celle qui trouve
  rationale: Le participe féminin singulier de מצא signifie le plus naturellement « trouvant » ou « obtenant ». « Celle qui trouve » conserve le genre et laisse ouverte la nuance exacte.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם peut désigner la paix, le bien-être, l’intégrité ou une situation favorable. « La paix » est la traduction la plus concise et reconnaissable, tandis qu’une note signale l’étendue du sens.
