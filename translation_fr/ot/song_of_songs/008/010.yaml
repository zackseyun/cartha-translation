translation_notes:
  register: Français moderne, poétique et digne. La disposition en vers conserve le parallélisme des images. Le tour « Moi, je » souligne l’affirmation initiale exprimée par le pronom hébreu indépendant; « j’ai été » préserve la formulation de l’hébreu sans résoudre la tension en faveur de « je suis devenue ».
