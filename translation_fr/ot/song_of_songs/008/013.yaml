  text: הַ/יוֹשֶׁ֣בֶת בַּ/גַּנִּ֗ים חֲבֵרִ֛ים מַקְשִׁיבִ֥ים לְ/קוֹלֵ֖/ךְ הַשְׁמִיעִֽי/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/013.yaml
  text: You who dwell in the gardens[a], companions are listening for your voice; let me hear it.
translation:
  language: fr
  text: Toi qui habites dans les jardins, des compagnons écoutent ta voix ; fais-la-moi entendre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais-moi entendre ta voix ».'
    reason: La forme hébraïque ne comporte pas de pronom objet renvoyant explicitement à « la voix » ; celui-ci est repris dans le texte français pour une expression naturelle.
lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  choice: Toi qui habites
  rationale: Le participe féminin singulier avec article désigne directement la femme. « Habites » rend naturellement l’idée de présence durable, sans le littéralisme moins idiomatique de « es assise ».
- source_word: בַּגַּנִּים
  choice: dans les jardins
  rationale: Conserve le pluriel hébreu et offre une formulation française naturelle et proche de la structure source.
- source_word: חֲבֵרִים
  choice: des compagnons
  rationale: Le terme peut désigner des amis ou compagnons. « Compagnons » garde le ton poétique et évite de préciser davantage la nature de leur relation.
- source_word: מַקְשִׁיבִים לְקוֹלֵךְ
  choice: écoutent ta voix
  rationale: Le participe exprime une écoute attentive. En français, « écouter ta voix » est plus naturel que « écouter après ta voix » et n’ajoute pas explicitement une attente que la construction hébraïque ne tranche pas entièrement.
- source_word: הַשְׁמִיעִינִי
  choice: fais-la-moi entendre
  rationale: L’impératif hiphil féminin singulier suivi du suffixe de première personne signifie formellement « fais-moi entendre ». Le pronom « la » reprend clairement « ta voix » et conserve la valeur causative.
