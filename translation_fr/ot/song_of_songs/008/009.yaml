  text: אִם חוֹמָ֣ה הִ֔יא נִבְנֶ֥ה עָלֶ֖י/הָ טִ֣ירַת כָּ֑סֶף וְ/אִם דֶּ֣לֶת הִ֔יא נָצ֥וּר עָלֶ֖י/הָ ל֥וּחַ אָֽרֶז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
translation:
  language: fr
  text: Si elle est une muraille, nous bâtirons sur elle une tourelle d’argent ; mais si elle est une porte, nous la barricaderons avec une planche de cèdre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « nous construirons sur elle un ouvrage fortifié d’argent » ; « nous l’enclorons », « nous la fermerons » ou « nous la garderons » avec une planche de cèdre. Les termes hébreux peuvent désigner un élément architectural fortifié et l’action d’enclore, de bloquer ou de garder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: muraille
  rationale: Le nom désigne un mur ou une muraille. « Muraille » maintient ici l’image architecturale et son idée possible de fermeté, sans expliciter la métaphore.
- source_word: נִבְנֶה
  choice: nous bâtirons
  rationale: L’imparfait qal à la première personne du pluriel exprime naturellement l’action envisagée si la condition se réalise.
- source_word: טִירַת כָּסֶף
  choice: une tourelle d’argent
  rationale: טִירָה peut désigner un ouvrage fortifié ou une structure analogue à une tour. « Tourelle » convient au parallélisme avec « muraille », tout en préservant l’incertitude du terme.
- source_word: דֶּלֶת
  choice: porte
  rationale: C’est le sens courant du nom hébreu ; la traduction conserve l’image concrète sans l’interpréter.
- source_word: נָצוּר
  choice: nous la fermerons
  rationale: Le verbe peut évoquer le fait d’enclore, de bloquer ou de garder. Avec une planche, « fermer » produit une image naturelle en français sans imposer une nuance exclusivement militaire.
- source_word: לוּחַ אָרֶז
  choice: une planche de cèdre
  rationale: לוּחַ désigne une planche, une plaque ou un panneau. « Planche de cèdre » conserve le caractère concret du matériau et de l’action.
- source_word: עָלֶיהָ
  choice: sur elle / la
  rationale: Dans le premier membre, « sur elle » rend directement la préposition et l’image d’une construction sur la muraille. Dans le second, le pronom objet est requis par l’expression française « fermer avec ».
- source_word: וְאִם
  choice: mais si
  rationale: Bien que la conjonction signifie formellement « et », elle introduit ici la condition contrastée parallèle ; « mais si » rend clairement ce contraste.
