revisions:
- from: Qui est celle-ci qui monte du désert, appuyée sur son bien-aimé ? Sous le pommier[a], je t’ai éveillé[b] ; c’est là que ta mère a été en travail pour toi, c’est là qu’a été en travail celle qui t’a mis au monde.[c]
  to: Qui est celle-ci qui monte du désert, appuyée sur son bien-aimé ? Sous le pommier[a], je t’ai éveillé[b] ; c’est là que ta mère a été en travail pour te mettre au monde, c’est là qu’a été en travail celle qui t’a enfanté.[c]
  rationale: La révision améliore uniquement l’idiomaticité française de la métaphore de l’enfantement et la précision de la note lexicale. Elle conserve le mouvement, le parallélisme « c’est là… c’est là », le changement non résolu de voix et la retenue du texte quant à la nuance amoureuse de עור.
