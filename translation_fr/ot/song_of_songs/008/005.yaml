  text: מִ֣י זֹ֗את עֹלָה֙ מִן הַ/מִּדְבָּ֔ר מִתְרַפֶּ֖קֶת עַל דּוֹדָ֑/הּ תַּ֤חַת הַ/תַּפּ֨וּחַ֙ עֽוֹרַרְתִּ֔י/ךָ שָׁ֚מָּ/ה חִבְּלַ֣תְ/ךָ אִמֶּ֔/ךָ שָׁ֖מָּ/ה חִבְּלָ֥ה יְלָדַֽתְ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
translation:
  language: fr
  text: Qui est celle-ci qui monte du désert, appuyée sur son bien-aimé ? Sous le pommier[a], je t’ai éveillé[b] ; c’est là que ta mère a été en travail pour te mettre au monde, c’est là qu’a été en travail celle qui t’a enfanté.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « sous l’abricotier ». L’espèce exacte désignée par le mot hébreu est incertaine ; « pommier » est le rendu traditionnel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je t’ai réveillé ». Dans ce poème d’amour, le verbe hébreu peut aussi évoquer une nuance d’éveil du désir.'
    reason: alternative_reading
  - marker: c
    text: Au milieu du verset, le texte passe probablement d’une voix qui observe à une adresse directe ; l’identité de la personne qui parle n’est pas précisée en hébreu.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: qui monte
  rationale: Le participe exprime un mouvement ascendant. « Qui monte » est naturel en français et conserve l’image du texte hébreu.
- source_word: הַמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne une région aride ou inculte. « Désert » est ici une formulation française courante et évocatrice.
- source_word: מִתְרַפֶּקֶת עַל
  choice: appuyée sur
  rationale: Cette forme rare évoque un soutien physique étroit ou un attachement. « Appuyée sur » convient à la scène tout en évitant de préciser excessivement le geste.
- source_word: דּוֹדָהּ
  choice: son bien-aimé
  rationale: Dans le Cantique, דּוֹד désigne l’homme aimé. « Bien-aimé » garde la valeur affective et le registre poétique.
- source_word: תַּחַת הַתַּפּוּחַ
  choice: Sous le pommier
  rationale: « Pommier » est le rendu traditionnel de תַּפּוּחַ, mais l’identification botanique demeure incertaine ; celle-ci est signalée en note.
- source_word: עוֹרַרְתִּיךָ
  choice: je t’ai éveillé
  rationale: Le verbe עור peut signifier éveiller ou stimuler. « Éveillé » en conserve le sens central sans exclure une nuance amoureuse.
- source_word: חִבְּלַתְךָ
  choice: a été en travail pour toi
  rationale: Le verbe évoque les douleurs et le travail de l’accouchement. Cette expression préserve l’image maternelle et le parallélisme.
- source_word: יְלָדַתְךָ
  choice: celle qui t’a mis au monde
  rationale: Le participe de ילד désigne celle qui a enfanté le destinataire. « Mis au monde » est clair, naturel et distinct de la mention répétée du travail.
- source_word: שָׁמָּה ... שָׁמָּה
  choice: c’est là ... c’est là
  rationale: La répétition de l’adverbe est conservée afin de rendre l’insistance et le parallélisme poétique de l’hébreu.
theological_decisions:
- issue: Changement de voix et d’interlocuteur au milieu du verset
  choice: 'Conserver la question descriptive à la troisième personne, puis le discours direct à la deuxième personne : « je t’ai éveillé… ta mère »'
  alternative: Attribuer explicitement tout le verset aux jeunes femmes, ou identifier explicitement la femme comme locutrice de la seconde moitié
  rationale: L’hébreu passe de « son bien-aimé » à « je t’ai éveillé » sans identifier clairement la voix qui parle. La traduction conserve ce déplacement et laisse ouverte l’identité du locuteur.
- issue: Portée du verbe עוֹרַרְתִּיךָ dans la poésie amoureuse
  choice: « je t’ai éveillé » avec une note signalant « je t’ai stimulé »
  alternative: Traduire directement par « je t’ai excité » ou « je t’ai stimulé »
  rationale: Le contexte amoureux permet une nuance d’éveil du désir, mais ne l’impose pas sans ambiguïté. Le texte principal garde le sens lexical large.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible, la répétition hébraïque est préservée, et les ambiguïtés botanique, affective et énonciative sont indiquées sans imposer une interprétation confessionnelle.
