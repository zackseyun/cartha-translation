  text: כָּרְמִ֥/י שֶׁ/לִּ֖/י לְ/פָנָ֑/י הָ/אֶ֤לֶף לְ/ךָ֙ שְׁלֹמֹ֔ה וּ/מָאתַ֖יִם לְ/נֹטְרִ֥ים אֶת פִּרְיֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
translation:
  language: fr
  text: Ma vigne à moi est devant moi.[a] Les mille sont pour toi, Salomon, et deux cents pour ceux qui en gardent le fruit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Est devant moi » peut aussi suggérer « est sous ma garde » ou « reste sous mon autorité ».
    reason: lexical_alternative
  - marker: b
    text: Le verset précédent parle de mille pièces d’argent, mais celui-ci dit seulement « les mille » et « deux cents », sans répéter l’unité monétaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּרְמִי שֶׁלִּי
  choice: Ma vigne, celle qui est à moi
  rationale: Le redoublement possessif hébreu souligne fortement que la vigne appartient à la locutrice. Cette formulation française conserve l’insistance sans interpréter la vigne comme une métaphore explicite de sa personne.
- source_word: לְפָנַי
  choice: est devant moi
  rationale: La traduction littérale préserve l’ambiguïté poétique entre présence immédiate, possession et maîtrise.
- source_word: הָאֶלֶף
  choice: Les mille
  rationale: Le verset dit seulement « les mille »; la mention de l’argent est comprise grâce au verset précédent, mais ne doit pas être ajoutée silencieusement au texte principal.
- source_word: לְךָ שְׁלֹמֹה
  choice: sont pour toi, Salomon
  rationale: Le lamed exprime ici l’attribution ou la destination; « pour toi » rend naturellement l’adresse directe à Salomon.
- source_word: וּמָאתַיִם
  choice: et deux cents
  rationale: Le nombre est conservé sans ajouter d’unité monétaire absente de ce verset.
- source_word: לְנֹטְרִים
  choice: pour ceux qui en gardent
  rationale: Le participe de נטר désigne ceux qui gardent ou surveillent la vigne; « gardent » convient au contexte agricole tout en restant ouvert à la portée figurée.
- source_word: אֶת־פִּרְיוֹ
  choice: le fruit
  rationale: פְּרִי signifie « fruit » ou « produit ». Le pronom adverbial « en » rattache clairement le fruit à la vigne dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe garde l’insistance possessive et l’ambiguïté de « devant moi ». Les nombres restent elliptiques comme dans l’hébreu, avec une note explicative plutôt qu’un ajout dans le texte.
