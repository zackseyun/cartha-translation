base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
translation:
  language: fr
  text: Je te conduirais, je t’amènerais dans la maison de ma mère[a], elle qui m’a instruite. Je te donnerais à boire du vin épicé[b], du jus de ma grenade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un autre rattachement de la syntaxe poétique : « tu m’instruirais ». Le verbe hébreu est à la troisième personne du féminin singulier et renvoie le plus naturellement à « ma mère » ; la construction très concise a toutefois reçu d’autres interprétations.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « du vin doux de ma grenade ». Le terme hébreu peut désigner du jus frais, du moût ou une boisson douce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  choice: Je te conduirais
  rationale: L’imparfait qal à la première personne du singulier porte ici une valeur souhaitée ou éventuelle; le conditionnel français restitue naturellement cette nuance. « Conduire » conserve le mouvement concret.
- source_word: אֲבִיאֲךָ
  choice: je t’amènerais
  rationale: La forme hiphil de בוא exprime le fait de faire venir ou d’introduire quelqu’un. Coordonné au premier verbe, le conditionnel maintient l’élan souhaité de la locutrice.
- source_word: בֵּית אִמִּי
  choice: dans la maison de ma mère
  rationale: Après אֶל et avec le verbe de mouvement, « dans » exprime naturellement l’entrée dans la maison.
- source_word: תְּלַמְּדֵנִי
  choice: là où elle m’instruisait
  rationale: La morphologie est celle d’un piel imparfait à la troisième personne féminine du singulier avec suffixe de première personne; elle renvoie le plus naturellement à la mère. « Instruisait » garde le sens de transmission ou d’enseignement sans préciser indûment son contenu.
- source_word: אַשְׁקְךָ
  choice: Je te donnerais à boire
  rationale: Le hiphil de שקה signifie faire boire ou donner à boire. Cette tournure française est naturelle et préserve la valeur causative sans suggérer la contrainte.
- source_word: מִיַּיִן הָרֶקַח
  choice: du vin épicé
  rationale: L’expression désigne du vin préparé avec des aromates. « Vin épicé » est concise, actuelle et respecte l’imagerie sensorielle.
- source_word: מֵעֲסִיס רִמֹּנִי
  choice: du jus de ma grenade
  rationale: עָסִיס peut désigner le jus, le moût ou une boisson douce tirée du fruit. « Jus » maintient l’ambiguïté quant à la fermentation, et le singulier possessif suit l’hébreu.
theological_decisions:
- issue: Sujet de תְּלַמְּדֵנִי (« m’instruire »)
  choice: 'La mère est prise comme sujet : « là où elle m’instruisait »'
  alternative: « tu m’instruirais »
  rationale: La forme verbale est féminine singulière et se rattache donc le plus naturellement à « ma mère ». La syntaxe poétique reste toutefois elliptique, d’où le signalement de l’autre rattachement en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme verbal est rendu par deux conditionnels. Les formulations restent accessibles tout en conservant l’intimité et la concision du verset.
