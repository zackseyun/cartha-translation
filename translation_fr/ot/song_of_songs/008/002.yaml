revisions:
- from: Je te conduirais, je t’amènerais dans la maison de ma mère[a], là où elle m’instruisait. Je te donnerais à boire du vin épicé[b], du jus de ma grenade.
  to: Je te conduirais, je t’amènerais dans la maison de ma mère[a], elle qui m’a instruite. Je te donnerais à boire du vin épicé[b], du jus de ma grenade.
  rationale: La révision remplace la subordonnée locative « là où elle m’instruisait » par une apposition relative, plus proche de l’ellipse hébraïque et plus naturelle en français. Le passé composé (« m’a instruite ») exprime sobrement l’antériorité implicite de la mère éducatrice sans imposer une habitude située dans la maison. La note a est également clarifiée pour préserver l’ambiguïté attestée tout en indiquant la morphologie féminine du verbe.
