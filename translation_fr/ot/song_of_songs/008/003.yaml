  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: fr
  text: Sa main gauche est sous ma tête[a], et sa main droite m’enlace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « sa gauche… et sa droite » ; le mot « main » est ajouté en français d’après le sens de ces expressions parallèles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: sa main gauche
  rationale: Le nom désigne le côté gauche ou la main gauche. Dans cette scène d’étreinte, « sa main gauche » est naturel en français et explicite avec retenue la partie du corps sous-entendue.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition signifie directement « sous » ou « au-dessous de » ; « sous » convient au français moderne et au contexte.
- source_word: רֹאשִׁי
  choice: ma tête
  rationale: Traduction directe du nom רֹאשׁ avec le suffixe de première personne du singulier.
- source_word: וִימִינוֹ
  choice: et sa main droite
  rationale: Le syntagme signifie littéralement « et sa droite ». Le français idiomatique appelle ici « sa main droite », en parallèle avec « sa main gauche », sans imposer l’interprétation plus contextuelle « bras ».
- source_word: תְּחַבְּקֵנִי
  choice: m’enlace
  rationale: Le verbe חבק signifie « étreindre, enlacer ». Le présent restitue naturellement l’inaccompli hébreu dans cette description poétique ; « m’enlace » est actuel, digne et moins explicatif que « me serre contre lui ».
