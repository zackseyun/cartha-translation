  text: מַ֣יִם רַבִּ֗ים לֹ֤א יֽוּכְלוּ֙ לְ/כַבּ֣וֹת אֶת הָֽ/אַהֲבָ֔ה וּ/נְהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/הָ אִם יִתֵּ֨ן אִ֜ישׁ אֶת כָּל ה֤וֹן בֵּית/וֹ֙ בָּ/אַהֲבָ֔ה בּ֖וֹז יָב֥וּזוּ לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
translation:
  language: fr
  text: 'Les grandes eaux ne peuvent éteindre l’amour,

    ni les fleuves l’emporter.


    Si un homme donnait toute la richesse de sa maison en échange de l’amour,

    on le couvrirait de mépris[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on le mépriserait avec le plus grand mépris ». En hébreu, l’infinitif absolu suivi du verbe conjugué renforce fortement l’idée de mépris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם רַבִּים
  choice: les grandes eaux
  rationale: Cette expression poétique conserve l’image hébraïque d’eaux immenses ou abondantes sans la réduire à de simples « inondations ».
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  choice: ne peuvent éteindre
  rationale: כבה désigne couramment l’action d’éteindre un feu. Ce choix maintient le contraste poétique avec la flamme de l’amour évoquée au verset précédent.
- source_word: הָאַהֲבָה
  choice: l’amour
  rationale: Le nom désigne directement l’amour; l’article défini français convient à l’emploi générique du nom abstrait.
- source_word: וּנְהָרוֹת
  choice: ni les fleuves
  rationale: « Ni » rend naturellement la coordination de deux propositions négatives parallèles, tandis que « fleuves » conserve l’image concrète du texte.
- source_word: לֹא יִשְׁטְפוּהָ
  choice: ne peuvent l’emporter
  rationale: שטף peut exprimer l’idée de submerger, d’entraîner ou de balayer. « L’emporter » restitue la force destructrice du courant tout en restant poétique et naturel.
- source_word: אִם יִתֵּן אִישׁ
  choice: Si un homme donnait
  rationale: L’imparfait français présente naturellement le cas comme une hypothèse. « Un homme » correspond à אִישׁ.
- source_word: כָּל הוֹן בֵּיתוֹ
  choice: tous les biens de sa maison
  rationale: הוֹן renvoie à la fortune ou aux richesses, et « maison » peut englober le foyer et son patrimoine. Cette formulation reste proche de la structure hébraïque.
- source_word: בָּאַהֲבָה
  choice: en échange de l’amour
  rationale: La préposition ב a ici une valeur transactionnelle probable. Cette formulation rend clairement l’idée qu’on chercherait à acquérir l’amour par ses biens.
- source_word: בּוֹז יָבֻזוּ לוֹ
  choice: on le mépriserait profondément
  rationale: Le pluriel indéfini hébreu est rendu naturellement par « on ». L’adverbe « profondément » exprime l’intensité produite par l’infinitif absolu suivi du verbe conjugué.
theological_decisions: []
translation_notes:
  register: Poésie française moderne, sobre et digne. Le parallélisme des deux premiers vers et les images concrètes de l’eau, des fleuves et de l’amour ont été conservés. La formulation évite tout ajout doctrinal et maintient la vigueur de la condamnation finale.
