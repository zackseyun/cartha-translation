  verdict: revise
  source_fidelity: 'Le sens fondamental est fidèle : les eaux ne peuvent éteindre l’amour, les fleuves ne peuvent l’emporter, et aucune richesse domestique ne peut l’acquérir sans susciter le mépris. « Grandes eaux » est une image poétique recevable pour מַיִם רַבִּים. La dernière expression hébraïque, infinitif absolu suivi d’un verbe fini, exprime un mépris intensifié.'
  naturalness: Le texte est globalement naturel et garde un registre poétique moderne. Toutefois, « on le mépriserait profondément » est moins idiomatique en français pour exprimer l’intensité d’un acte de mépriser; « on le couvrirait de mépris » est plus naturel et plus vigoureux.
  terminology: « Amour », « fleuves » et « richesse de sa maison » conviennent. « En échange de l’amour » rend de façon claire, sans surinterprétation, la valeur transactionnelle probable de בָּאַהֲבָה. La note doit éviter de qualifier de « littérale » une paraphrase qui ajoute « certainement ».
  issues:
