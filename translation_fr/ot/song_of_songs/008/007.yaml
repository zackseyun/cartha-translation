    rationale: « Profondément » qualifie plus spontanément un sentiment ou une réflexion qu’un acte de mépriser. L’hébreu intensifie le verbe; « couvrir de mépris » le rend avec davantage de naturel.
  - severity: low
    issue: Formulation de la note
    rationale: '« Littéralement : ils le mépriseraient certainement » n’est pas strictement littéral. L’infinitif absolu répète et intensifie le verbe; il vaut mieux présenter l’autre rendu comme une option et expliquer le procédé.'
