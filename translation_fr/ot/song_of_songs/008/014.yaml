review_pass:
  verdict: revise
  source_fidelity: 'La traduction de בְּרַח par « Fuis » rend de façon directe l’impératif hébreu, sans lever son ambiguïté poétique. « Mon bien-aimé », « sois semblable à », « une gazelle » et « sur les montagnes des aromates » correspondent bien au texte. En revanche, « le faon des biches » ne rend pas correctement עֹפֶר הָאַיָּלִים : l’expression évoque un jeune cerf / un faon de cerf et porte une coloration masculine cohérente avec l’allocutaire.'
  naturalness: Le vers révisé demeure concis, poétique et naturel en français international. « Montagnes des aromates » conserve plus exactement le complément nominal hébreu que « montagnes embaumées », qui transforme les aromates en simple qualité des montagnes.
  terminology: « Bien-aimé » est approprié au registre du Cantique. « Jeune cerf » corrige l’inversion de sexe introduite par « biches ». « Aromates » restitue la référence ouverte aux substances parfumées, sans limiter l’image à des épices culinaires ou à un parfum abstrait.
  issues:
  - severity: medium
    issue: « le faon des biches »
    rationale: אַיָּלִים désigne ici des cerfs/stags, non des biches. La formulation française introduit donc un référent féminin qui n’est pas dans le texte et affaiblit l’image masculine du jeune cervidé.
  - severity: low
    issue: « montagnes embaumées »
    rationale: Cette expression est poétique, mais elle explicite une qualité odorante là où l’hébreu dit littéralement « montagnes des aromates ». Une formulation nominale préserve mieux l’image et son ouverture.
  revised_text: Fuis, mon bien-aimé[a], et sois semblable à une gazelle ou à un jeune cerf, sur les montagnes des aromates.
  revised_footnotes:
  - marker: a
    text: Voir Cantique 2.17, où la bien-aimée emploie une image presque identique.
    reason: cross_reference
