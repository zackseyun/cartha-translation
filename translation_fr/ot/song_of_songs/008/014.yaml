- from: Fuis, mon bien-aimé[a], sois comme la gazelle ou comme le faon des biches sur les montagnes embaumées.
  to: Fuis, mon bien-aimé[a], et sois semblable à une gazelle ou à un jeune cerf, sur les montagnes des aromates.
  rationale: La révision corrige le genre et le référent animalier de « faon des biches » en « jeune cerf » et restitue plus étroitement le syntagme hébreu « montagnes des aromates ». Elle conserve l’impératif « Fuis », le registre poétique et l’ambiguïté relationnelle du texte.
