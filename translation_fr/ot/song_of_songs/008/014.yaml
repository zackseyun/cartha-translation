base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
translation:
  language: fr
  text: Fuis, mon bien-aimé[a], et sois semblable à une gazelle ou à un jeune cerf, sur les montagnes des aromates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Cantique 2.17, où la bien-aimée emploie une image presque identique.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  choice: Fuis
  rationale: L’impératif exprime littéralement la fuite ou un départ rapide. « Fuis » conserve sa force et l’ambiguïté poétique du mouvement sans l’atténuer.
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, דּוֹדִי désigne l’homme aimé et fonctionne comme un terme d’affection. « Mon bien-aimé » est naturel, digne et précis.
- source_word: וּדְמֵה לְךָ
  choice: sois comme
  rationale: Cette tournure idiomatique française rend simplement l’idée de se montrer ou de devenir semblable, ainsi que la valeur impérative.
- source_word: לִצְבִי
  choice: la gazelle
  rationale: צְבִי désigne ici la gazelle, animal gracieux et rapide qui convient à l’image poétique.
- source_word: אֹו לְעֹפֶר הָאַיָּלִים
  choice: ou comme le faon des biches
  rationale: La traduction conserve la formulation hébraïque, où עֹפֶר est le petit et אַיָּלִים désigne des cervidés. Elle préserve aussi l’écho exact de Cantique 2.17 sans imposer le sexe de l’animal.
- source_word: עַל הָרֵי בְשָׂמִים
  choice: sur les montagnes embaumées
  rationale: בְשָׂמִים évoque des aromates ou substances parfumées. « Montagnes embaumées » restitue naturellement en français la qualité odorante de ces montagnes tout en gardant l’image ouverte.
theological_decisions: []
translation_notes:
  register: Français poétique, actuel et digne. La brièveté de l’impératif final et le parallélisme animalier sont conservés. « Fuis » maintient la force lexicale et l’ambiguïté du contexte amoureux; « montagnes embaumées » évite de réduire בְשָׂמִים aux seules épices.
