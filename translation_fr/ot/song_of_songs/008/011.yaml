base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
translation:
  language: fr
  text: Salomon avait une vigne à Baal-Hamôn. Il confia la vigne à des vignerons ; chacun devait apporter mille pièces d’argent pour son fruit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mille d’argent ». L’unité n’est pas précisée. L’expression traduite par « pour son fruit » peut aussi se comprendre comme « du produit de la vigne » ou « avec son fruit », le suffixe pouvant renvoyer à la vigne ou, distributivement, au produit de chaque vigneron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּרֶם
  choice: vigne
  rationale: En français, « vigne » désigne naturellement un terrain planté de ceps et convient aux deux occurrences.
- source_word: הָיָה לִשְׁלֹמֹה
  choice: Salomon avait
  rationale: La construction possessive hébraïque, littéralement « il y avait pour Salomon », s’exprime naturellement ainsi en français.
- source_word: בְּבַעַל הָמוֹן
  choice: à Baal-Hamôn
  rationale: Le groupe est compris comme un nom de lieu, translittéré ; « à » marque naturellement la localisation.
- source_word: נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים
  choice: Il confia la vigne à des gardiens
  rationale: נתן signifie largement « donner », mais le contexte indique ici la remise de la vigne à des personnes chargées de la garder ou de la gérer. « Confia » rend cette fonction sans imposer la notion juridique de location.
- source_word: לַנֹּטְרִים
  choice: à des gardiens
  rationale: Le participe désigne ceux qui gardent ou surveillent. « Gardiens » conserve ce sens sans préciser indûment l’ensemble de leurs tâches.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif vise chaque gardien individuellement ; « chacun » le rend clairement et naturellement.
- source_word: יָבִא
  choice: devait apporter
  rationale: L’imparfait hébreu exprime ici l’action attendue dans le cadre de cet arrangement, sans qu’un ordre direct soit formulé.
- source_word: בְּפִרְיוֹ
  choice: pour son fruit
  rationale: « Son » renvoie le plus naturellement à la vigne, tandis que « pour » exprime le rapport entre le paiement et la production. Une note conserve les autres lectures possibles du suffixe et de la préposition.
- source_word: אֶלֶף כָּסֶף
  choice: mille pièces d’argent
  rationale: L’hébreu dit littéralement « mille d’argent » sans nommer l’unité. « Pièces d’argent » reste compréhensible tout en évitant d’ajouter « sicles », absent du texte.
