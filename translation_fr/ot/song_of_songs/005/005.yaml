base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/005.yaml
  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
translation:
  language: fr
  text: Je me suis levée pour ouvrir à mon bien-aimé ; mes mains ruisselaient de myrrhe, mes doigts de myrrhe coulante[a], sur les poignées du verrou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « myrrhe liquide » ou « myrrhe qui s’écoule ».
    reason: lexical_alternative
  - marker: b
    text: Ou « poignées de la serrure » ou « loquet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתִּי אֲנִי
  choice: Je me suis levée
  rationale: Le qal accompli à la première personne, renforcé par le pronom explicite, marque nettement le sujet. Le féminin est imposé en français par l’identité de la locutrice dans le contexte immédiat du Cantique.
- source_word: לִפְתֹּחַ לְדוֹדִי
  choice: pour ouvrir à mon bien-aimé
  rationale: L’infinitif exprime le but, et la tournure française « ouvrir à quelqu’un » rend naturellement l’idée d’ouvrir la porte au bien-aimé.
- source_word: יָדַי נָטְפוּ מוֹר
  choice: mes mains dégouttaient de myrrhe
  rationale: נטף évoque ce qui tombe goutte à goutte. « Dégouttaient de » conserve l’image concrète et sensuelle sans explicitation supplémentaire.
- source_word: אֶצְבְּעֹתַי
  choice: mes doigts
  rationale: Équivalent français direct du nom pluriel.
- source_word: מוֹר עֹבֵר
  choice: myrrhe liquide
  rationale: עֹבֵר signifie littéralement « passant » et peut ici qualifier une myrrhe qui coule. « Liquide » est naturel en français tout en laissant ouverte la nuance exacte.
- source_word: עַל כַּפּוֹת הַמַּנְעוּל
  choice: sur les poignées du verrou
  rationale: Dans ce contexte architectural, כַּפּוֹת désigne vraisemblablement les parties saisies à la main du dispositif de fermeture, et מַנְעוּל un verrou ou mécanisme de fermeture ancien.
