    issue: « La voix de mon bien-aimé ! Il frappe »
    rationale: Le קול hébreu peut signifier « voix » ou « bruit », mais il est ici immédiatement qualifié par « frappant ». Rendre le terme par « voix » puis détacher « Il frappe » produit une articulation moins fidèle à l’effet auditif et moins naturelle en français.
  - severity: low
    issue: Formulation de la note b
    rationale: « Mon irréprochable » est au masculin et ne constitue pas une formulation française naturelle dans cette adresse féminine. La note doit aussi refléter les nuances du terme sans imposer une interprétation.
