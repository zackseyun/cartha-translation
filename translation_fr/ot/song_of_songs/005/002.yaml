  text: אֲנִ֥י יְשֵׁנָ֖ה וְ/לִבִּ֣/י עֵ֑ר ק֣וֹל דּוֹדִ֣/י דוֹפֵ֗ק פִּתְחִי לִ֞/י אֲחֹתִ֤/י רַעְיָתִ/י֙ יוֹנָתִ֣/י תַמָּתִ֔/י שֶׁ/רֹּאשִׁ/י֙ נִמְלָא טָ֔ל קְוֻּצּוֹתַ֖/י רְסִ֥יסֵי לָֽיְלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
translation:
  language: fr
  text: 'Je dormais, mais mon cœur veillait.

    Un bruit[a] : mon bien-aimé frappe !


    « Ouvre-moi, ma sœur, mon amie,

    ma colombe, ma parfaite[b],

    car ma tête est couverte de rosée,

    mes mèches, des gouttes de la nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La voix de mon bien-aimé ». Le mot hébreu peut désigner aussi bien une voix qu’un bruit, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma sans-défaut », « ma bien-aimée intègre » ou « celle qui est tout entière ». Le terme hébreu évoque l’intégrité, l’entièreté, l’innocence ou l’absence de défaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֵׁנָה
  choice: Je dormais
  rationale: L’adjectif féminin singulier a une valeur prédicative. L’imparfait introduit naturellement la scène en français, sans alourdir le vers par une tournure progressive.
- source_word: לִבִּי עֵר
  choice: mon cœur veillait
  rationale: « Cœur » conserve l’image hébraïque de l’être intérieur, tandis que « veillait » répond poétiquement à « dormais ».
- source_word: קוֹל דּוֹדִי
  choice: La voix de mon bien-aimé
  rationale: קוֹל peut désigner une voix ou un bruit. La parole citée qui suit favorise « voix », tout en laissant l’autre possibilité en note.
- source_word: דוֹפֵק
  choice: Il frappe
  rationale: Le participe présente l’action en cours avec vivacité. Une proposition brève restitue l’effet soudain de l’hébreu.
- source_word: פִּתְחִי לִי
  choice: Ouvre-moi
  rationale: Cette formulation idiomatique et concise rend l’impératif suivi de לִי dans le contexte d’une porte fermée.
- source_word: אֲחֹתִי
  choice: ma sœur
  rationale: Le terme d’affection caractéristique du Cantique est conservé littéralement.
- source_word: רַעְיָתִי
  choice: mon amie
  rationale: Le mot désigne ici la compagne aimée. « Mon amie » est naturel, affectueux et distinct de « mon bien-aimé ».
- source_word: יוֹנָתִי
  choice: ma colombe
  rationale: La métaphore transparente est maintenue telle quelle.
- source_word: תַמָּתִי
  choice: ma parfaite
  rationale: Le terme exprime l’intégrité, l’entièreté ou l’absence de défaut. « Ma parfaite » conserve la forme affective et poétique sans développer une interprétation particulière; les principales nuances figurent en note.
- source_word: שֶׁרֹּאשִׁי נִמְלָא טָל
  choice: car ma tête est couverte de rosée
  rationale: Le verbe signifie littéralement « être rempli ». Appliqué à la rosée sur la tête, « être couverte » rend naturellement l’image physique en français.
- source_word: קְוֻּצּוֹתַי
  choice: mes mèches
  rationale: Le nom désigne les mèches ou boucles de cheveux. « Mèches » est actuel et poétique.
- source_word: רְסִיסֵי לָיְלָה
  choice: les gouttes de la nuit
  rationale: La traduction littérale préserve le parallélisme avec la rosée et l’image évocatrice sans préciser s’il s’agit de brume ou de rosée nocturne.
