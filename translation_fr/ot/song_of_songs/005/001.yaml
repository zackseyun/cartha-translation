source:
  edition: WLC
  text: בָּ֣אתִי לְ/גַנִּ/י֮ אֲחֹתִ֣/י כַלָּה֒ אָרִ֤יתִי מוֹרִ/י֙ עִם בְּשָׂמִ֔/י אָכַ֤לְתִּי יַעְרִ/י֙ עִם דִּבְשִׁ֔/י שָׁתִ֥יתִי יֵינִ֖/י עִם חֲלָבִ֑/י אִכְל֣וּ רֵעִ֔ים שְׁת֥וּ וְ/שִׁכְר֖וּ דּוֹדִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
translation:
  language: fr
  text: Je suis entré dans mon jardin, ma sœur, ma fiancée ; j’ai récolté ma myrrhe avec mes aromates. J’ai mangé mon rayon de miel avec mon miel ; j’ai bu mon vin avec mon lait. Mangez, amis ; buvez, enivrez-vous d’amour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « buvez et enivrez-vous, bien-aimés » ; le dernier mot hébreu peut désigner l’amour ou être compris comme une apostrophe adressée aux bien-aimés.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּאתִי לְגַנִּי
  choice: Je suis entré dans mon jardin
  rationale: Le parfait qal de בוא exprime ici une arrivée accomplie. « Entrer dans » rend naturellement en français le mouvement jusqu’à l’intérieur du jardin indiqué par לְ.
- source_word: אֲחֹתִי כַלָּה
  choice: ma sœur, ma fiancée
  rationale: Les deux appellations sont conservées séparément, comme en hébreu. « Fiancée » exprime ici la femme promise en mariage sans imposer qu’une cérémonie ait déjà eu lieu.
- source_word: אָרִיתִי
  choice: j’ai récolté
  rationale: Le verbe ארה désigne le fait de recueillir ou de cueillir les produits aromatiques. « Récolté » convient aux éléments coordonnés sans préciser indûment la manière.
- source_word: מוֹרִי עִם בְּשָׂמִי
  choice: ma myrrhe avec mes aromates
  rationale: « Myrrhe » est l’équivalent usuel de מֹר. Le singulier collectif בְּשָׂמִי se rend naturellement par le pluriel français « aromates », qui conserve l’image concrète des substances parfumées.
- source_word: יַעְרִי עִם דִּבְשִׁי
  choice: mon rayon de miel avec mon miel
  rationale: Dans ce contexte, יער désigne le rayon contenant le miel. La répétition est maintenue afin de préserver l’image hébraïque d’abondance.
- source_word: יֵינִי עִם חֲלָבִי
  choice: mon vin avec mon lait
  rationale: Traduction littérale des deux noms possessifs, qui conserve l’imagerie sensorielle du banquet.
- source_word: אִכְלוּ רֵעִים
  choice: Mangez, amis
  rationale: L’impératif pluriel et l’apostrophe רֵעִים sont rendus directement et naturellement.
- source_word: שְׁתוּ וְשִׁכְרוּ דּוֹדִים
  choice: buvez, enivrez-vous d’amour
  rationale: 'Le qal de שׁכר peut signifier devenir ivre ou se rassasier abondamment. דּוֹדִים est compris dans son sens abstrait fréquent dans le Cantique : l’amour et ses manifestations.'
theological_decisions:
- issue: Sens de דּוֹדִים dans l’invitation finale
  choice: 'sens abstrait : « d’amour »'
  alternative: 'vocatif : « bien-aimés » ou « amants »'
  rationale: Dans le Cantique, דּוֹדִים désigne souvent l’amour ou les caresses amoureuses. La construction poétique permet toutefois aussi de le comprendre comme un vocatif. Le texte principal retient le sens abstrait, et la note préserve l’autre analyse sans résoudre artificiellement l’ambiguïté.
- issue: Identité des locuteurs et portée allégorique
  choice: ne pas identifier davantage le locuteur ni les amis
  alternative: expliciter une interprétation religieuse, liturgique ou conjugale particulière
  rationale: Le verset ne nomme pas explicitement les personnages et la traduction doit conserver la scène poétique sans importer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, poétique et digne. Les images concrètes et les possessifs répétés de l’hébreu sont conservés. Le passé composé rend naturellement la série d’actions accomplies ; les impératifs finaux gardent leur vigueur.
