  text: חִכּ/וֹ֙ מַֽמְתַקִּ֔ים וְ/כֻלּ֖/וֹ מַחֲּמַדִּ֑ים זֶ֤ה דוֹדִ/י֙ וְ/זֶ֣ה רֵעִ֔/י בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
translation:
  language: fr
  text: Sa bouche est la douceur même[a], et tout en lui est désirable[b]. Voilà mon bien-aimé, et voilà mon ami, filles de Jérusalem !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Son palais est douceur(s) ». Le mot hébreu peut désigner le palais et, par extension, la bouche; dans ce contexte, il peut aussi évoquer ses baisers ou ses paroles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tout en lui est délices » ou « il est tout à fait charmant ». L’hébreu emploie un pluriel intensif exprimant ce qui est désirable ou agréable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  choice: sa bouche
  rationale: Le nom désigne littéralement le palais, mais peut évoquer par métonymie la bouche, notamment ses baisers ou ses paroles. « Sa bouche » est naturel en français et conserve l’image corporelle; le sens plus littéral est signalé en note.
- source_word: מַמְתַקִּים
  choice: la douceur même
  rationale: Le pluriel hébreu a ici une valeur intensive ou abstraite. « La douceur même » restitue l’intensité poétique sans recourir à une tournure archaïque.
- source_word: וְכֻלּוֹ
  choice: et tout en lui
  rationale: Cette formulation rend l’idée concrète de la totalité de sa personne tout en restant idiomatique en français.
- source_word: מַחֲמַדִּים
  choice: est désirable
  rationale: Le terme exprime ce qui suscite le désir, le plaisir ou l’admiration. L’adjectif prédicatif est naturel en français, tandis que la note conserve la forme nominale intensive de l’hébreu.
- source_word: זֶה דּוֹדִי וְזֶה רֵעִי
  choice: Voilà mon bien-aimé, et voilà mon ami
  rationale: La répétition du démonstratif est maintenue pour préserver l’insistance et le parallélisme. « Bien-aimé » garde le registre amoureux et poétique; « ami » rend directement la dimension de proximité relationnelle de רֵעִי.
- source_word: בְּנוֹת יְרוּשָׁלָם
  choice: filles de Jérusalem
  rationale: Cette expression traditionnelle et littérale conserve l’image et le refrain poétique du Cantique; le vocatif français n’exige pas l’interjection « ô ».
theological_decisions:
- issue: Risque de surinterprétation messianique ou dévotionnelle de מַחֲמַדִּים
  choice: Traduire le mot dans son sens poétique immédiat par « désirable »
  alternative: Employer « tout à fait charmant » ou une formule traditionnelle pouvant recevoir une résonance christologique ultérieure
  rationale: Dans le contexte littéraire, la femme célèbre celui qu’elle aime. La traduction ne transforme donc pas le terme en titre et n’introduit pas une lecture doctrinale absente de l’énoncé hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste fluide tout en conservant la répétition emphatique de « voilà » et l’adresse littéraire « filles de Jérusalem ». Les notes maintiennent les nuances concrètes et intensives de l’hébreu.
