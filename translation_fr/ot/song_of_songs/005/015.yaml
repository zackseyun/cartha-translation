source:
  edition: WLC
  text: שׁוֹקָי/ו֙ עַמּ֣וּדֵי שֵׁ֔שׁ מְיֻסָּדִ֖ים עַל אַדְנֵי פָ֑ז מַרְאֵ֨/הוּ֙ כַּ/לְּבָנ֔וֹן בָּח֖וּר כָּ/אֲרָזִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/015.yaml
  text: His legs are pillars of marble[a], set on bases of fine gold. His appearance is like Lebanon[b], choice as the cedars.
translation:
  language: fr
  text: Ses jambes sont des colonnes de marbre[a], posées sur des socles d’or fin. Son aspect est pareil au Liban[b], remarquable comme les cèdres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des colonnes d’albâtre »; le mot hébreu שֵׁשׁ peut désigner une pierre blanche de qualité plutôt que précisément du marbre.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « Son aspect est pareil au Liban, éminent comme les cèdres. » Ici, le mot hébreu בָּחוּר exprime probablement une excellence distinguée plutôt que l’idée de « jeune homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹקָיו
  choice: ses jambes
  rationale: Le terme peut désigner la jambe ou la cuisse. Dans cette description poétique, « jambes » est naturel et correspond bien à l’image des colonnes.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: des colonnes de marbre
  rationale: « Colonnes » rend précisément l’image architecturale. שֵׁשׁ désigne ici une pierre blanche de qualité, traditionnellement comprise comme du marbre, sans exclure l’albâtre.
- source_word: מְיֻסָּדִים עַל אַדְנֵי פָז
  choice: posées sur des socles d’or fin
  rationale: Le participe passif exprime une installation ferme; « posées » convient à l’image. אַדְנֵי désigne des bases ou socles, et פָז un or précieux et raffiné.
- source_word: מַרְאֵהוּ
  choice: son aspect
  rationale: Le nom désigne l’apparence visible ou l’impression d’ensemble. « Aspect » conserve cette amplitude dans un registre poétique.
- source_word: כַּלְּבָנוֹן
  choice: pareil au Liban
  rationale: La comparaison évoque la beauté et la grandeur du Liban. Cette formulation est idiomatique en français tout en gardant la comparaison explicite.
- source_word: בָּחוּר כָּאֲרָזִים
  choice: remarquable comme les cèdres
  rationale: Dans ce contexte, בָּחוּר exprime vraisemblablement une qualité choisie, éminente ou distinguée, plutôt que l’âge d’un jeune homme. « Remarquable » préserve cette excellence sans surinterpréter l’image.
