  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’ouverture, le départ furtif et achevé du bien-aimé, l’expression poétique concernant l’âme, puis la recherche et l’appel sans réponse sont conservés. Il est préférable d’expliciter « la porte », objet sous-entendu par le contexte, car « ouvrir à quelqu’un » seul est peu naturel en français. Les deux verbes חָמַק עָבָר doivent rester distincts dans une coordination fluide.'
  naturalness: « J’ai ouvert à mon bien-aimé » est elliptique et peu idiomatique en français moderne ; « J’ai ouvert la porte à mon bien-aimé » est naturel sans altérer le sens. La juxtaposition « s’était dérobé, il était parti » est remplacée par une coordination plus fluide. Le reste maintient un registre poétique accessible.
  terminology: '« bien-aimé » convient à דּוֹד dans ce poème. « Mon âme s’en est allée » préserve volontairement l’image et l’ambiguïté de נַפְשִׁי יָצְאָה. La note b doit toutefois donner un littéral exact : le texte hébreu porte un parfait pour « s’en est allée/est sortie » et un infinitif avec suffixe, littéralement « à/lors de sa parole », non « lorsqu’il parlait ».'
