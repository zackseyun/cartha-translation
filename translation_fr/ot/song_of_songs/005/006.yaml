base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
translation:
  language: fr
  text: J’ai ouvert la porte à mon bien-aimé, mais mon bien-aimé s’était dérobé et était parti[a]. Mon âme s’en est allée quand il a parlé[b]. Je l’ai cherché, mais je ne l’ai pas trouvé. Je l’ai appelé, mais il ne m’a pas répondu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’était éclipsé et avait poursuivi son chemin ». L’hébreu emploie deux verbes pour souligner son départ.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Mon âme s’en est allée à sa parole » ou « lors de sa parole ». Cette expression hébraïque très vive peut aussi évoquer le fait de défaillir ou de perdre ses moyens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי
  choice: J’ai ouvert
  rationale: Le pronom indépendant אֲנִי souligne le sujet, mais le français exprime déjà celui-ci par « j’ ». Une formulation comme « moi, j’ai ouvert » donnerait ici une insistance plus forte et plus familière que ne l’exige le contexte.
- source_word: לְדוֹדִי
  choice: à mon bien-aimé
  rationale: Avec le verbe « ouvrir », la préposition ל désigne naturellement la personne à qui l’on ouvre. « Bien-aimé » garde le caractère affectif et poétique de דּוֹד.
- source_word: וְדוֹדִי
  choice: mais mon bien-aimé
  rationale: Bien que ו soit généralement coordonnant, le contexte établit un contraste net entre l’ouverture de la porte et l’absence du bien-aimé ; « mais » rend naturellement cette opposition.
- source_word: חָמַק עָבָר
  choice: s’était dérobé, il était parti
  rationale: Les deux verbes successifs décrivent et accentuent son départ. « Se dérober » conserve l’idée d’un retrait furtif portée par חמק, tandis que « partir » exprime clairement עבר dans ce contexte.
- source_word: נַפְשִׁי יָצְאָה
  choice: Mon âme s’en est allée
  rationale: Cette formulation conserve l’image vive de l’hébreu, où נֶפֶשׁ peut désigner l’âme, la vie ou l’être intérieur, sans réduire d’emblée l’expression à une émotion précise.
- source_word: בְדַבְּרוֹ
  choice: quand il a parlé
  rationale: La préposition ב avec l’infinitif construit peut ici avoir une valeur temporelle. Cette traduction reste naturelle tout en laissant le contexte déterminer s’il s’agit d’une parole entendue ou remémorée.
- source_word: בִּקַּשְׁתִּיהוּ
  choice: Je l’ai cherché
  rationale: בקשׁ signifie chercher ou rechercher. « Chercher » est direct, naturel et convient à la poursuite concrète racontée dans le passage.
- source_word: וְלֹא מְצָאתִיהוּ
  choice: mais je ne l’ai pas trouvé
  rationale: Le parfait nié indique simplement que la recherche n’a pas abouti. La traduction évite d’ajouter une idée d’incapacité qui n’est pas explicitement présente.
- source_word: קְרָאתִיו
  choice: Je l’ai appelé
  rationale: Le suffixe objet se rend naturellement par « l’ ». En français, « appeler quelqu’un » peut signifier l’interpeller et reste proche de la construction hébraïque.
- source_word: וְלֹא עָנָנִי
  choice: mais il ne m’a pas répondu
  rationale: ענה signifie ici répondre. La formulation personnelle met en relief le silence douloureux du bien-aimé.
