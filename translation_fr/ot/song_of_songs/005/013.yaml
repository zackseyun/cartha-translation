  text: His cheeks are like beds of spice[a], mounds of perfumes; his lips are lilies, dripping flowing myrrh.
translation:
  language: fr
  text: Ses joues sont comme un parterre d’aromates, des tertres de parfums[a] ; ses lèvres sont des lis, distillant une myrrhe fluide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette expression est difficile. On peut aussi traduire : « des tours de parfums » ; il pourrait évoquer des plates-bandes élevées ou des amas d’aromates.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָיָו
  choice: ses joues
  rationale: Le pluriel avec suffixe renvoie aux côtés du visage ; « joues » est naturel dans ce portrait poétique.
- source_word: כַּעֲרוּגַת הַבֹּשֶׂם
  choice: comme des parterres d’aromates
  rationale: עֲרוּגָה désigne un parterre ou une plate-bande cultivée, et בֹּשֶׂם des substances odorantes ; ce choix conserve l’image horticole.
- source_word: מִגְדְּלוֹת מֶרְקָחִים
  choice: des tertres de parfums
  rationale: L’expression est difficile. « Tertres » rend ici l’idée de formes élevées suggérée par מִגְדְּלוֹת, tandis que « parfums » traduit les compositions aromatiques désignées par מֶרְקָחִים, sans imposer des tours littérales.
- source_word: שִׂפְתוֹתָיו
  choice: ses lèvres
  rationale: Équivalent direct et naturel du nom pluriel avec suffixe masculin singulier.
- source_word: שׁוֹשַׁנִּים
  choice: des lis
  rationale: « Lis » est l’équivalent traditionnel et poétiquement naturel, même si l’identification botanique exacte demeure incertaine.
- source_word: נֹטְפוֹת
  choice: d’où coule
  rationale: Le participe exprime l’écoulement goutte à goutte ; la tournure française relie clairement l’image florale à la myrrhe.
- source_word: מוֹר עֹבֵר
  choice: une myrrhe fluide
  rationale: מוֹר désigne la myrrhe et עֹבֵר paraît ici qualifier une myrrhe liquide, qui s’écoule librement.
