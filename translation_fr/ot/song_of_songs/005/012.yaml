  text: עֵינָ֕י/ו כְּ/יוֹנִ֖ים עַל אֲפִ֣יקֵי מָ֑יִם רֹֽחֲצוֹת֙ בֶּֽ/חָלָ֔ב יֹשְׁב֖וֹת עַל מִלֵּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/012.yaml
  text: His eyes are like doves beside streams of water[a], bathed in milk, sitting by fullness.
translation:
  language: fr
  text: Ses yeux sont comme des colombes au bord des cours d’eau, baignées dans le lait, posées près d’un bassin plein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le dernier membre de phrase est difficile en hébreu. Il peut aussi évoquer des yeux bien enchâssés ou des colombes posées près d’une étendue d’eau pleine.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינָיו
  choice: Ses yeux
  rationale: עַיִן désigne ici les yeux du bien-aimé; le possessif et la comparaison avec les colombes excluent pratiquement le sens «source».
- source_word: כְּיוֹנִים
  choice: comme des colombes
  rationale: Le préfixe comparatif כ introduit une image poétique, rendue naturellement en français par «comme».
- source_word: עַל אֲפִיקֵי מָיִם
  choice: au bord des cours d’eau
  rationale: אֲפִיקִים peut désigner des chenaux, des ruisseaux ou des cours d’eau; «au bord des cours d’eau» conserve le cadre de la comparaison dans un français naturel.
- source_word: רֹחֲצוֹת בֶּחָלָב
  choice: baignées dans le lait
  rationale: Le participe féminin pluriel s’accorde formellement avec les colombes et évoque leur bain; «dans le lait» préserve l’image de blancheur et la valeur locative de ב.
- source_word: יֹשְׁבוֹת
  choice: posées
  rationale: Le verbe ישב signifie littéralement «être assis, demeurer». Pour des colombes, «posées» restitue concrètement et naturellement leur immobilité, tout en pouvant suggérer les yeux bien placés.
- source_word: עַל מִלֵּאת
  choice: près d’un bassin plein
  rationale: La formule est obscure. מִלֵּאת semble évoquer ce qui est plein ou un réceptacle rempli; dans la continuité de l’image aquatique, «un bassin plein» offre un sens possible sans masquer l’incertitude, signalée en note.
