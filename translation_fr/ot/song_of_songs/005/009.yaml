translation_notes:
  register: Français moderne, poétique et digne. Le tutoiement correspond au discours direct adressé à la jeune femme. L’accord éventuel au féminin dans la note (« mises ») reflète le chœur des femmes, tandis que le texte principal évite un marquage de genre non nécessaire.
