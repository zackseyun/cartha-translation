base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
translation:
  language: fr
  text: Qu’a donc ton bien-aimé de plus qu’un autre bien-aimé[a], ô la plus belle des femmes ? Qu’a donc ton bien-aimé de plus qu’un autre bien-aimé, pour que tu nous aies fait jurer[b] ainsi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton amoureux » dans tout le verset ; le mot hébreu דּוֹד peut désigner la personne aimée dans une relation amoureuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour que tu nous aies ainsi fait prêter serment » ; le verbe hébreu signifie faire jurer quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה דּוֹדֵךְ מִדּוֹד
  choice: Qu’a donc ton bien-aimé de plus qu’un autre bien-aimé
  rationale: La tournure française exprime naturellement la comparaison introduite par מַה et מִן, tout en conservant la répétition poétique de דּוֹד.
- source_word: דּוֹדֵךְ
  choice: ton bien-aimé
  rationale: Dans le Cantique, דּוֹד désigne le partenaire amoureux de la femme. « Bien-aimé » garde à la fois la valeur romantique et le registre poétique.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: ô la plus belle des femmes
  rationale: Le français rend clairement la valeur superlative contextuelle. L’interjection « ô » marque l’apostrophe sans archaïsme excessif.
- source_word: שֶׁכָּכָה
  choice: ainsi
  rationale: « Ainsi » restitue de façon concise et digne l’idée de manière ou d’intensité portée par l’adverbe.
- source_word: הִשְׁבַּעְתָּנוּ
  choice: tu nous aies fait jurer
  rationale: Le causatif hébreu signifie faire prêter serment. Cette formulation est précise et compréhensible en français courant.
