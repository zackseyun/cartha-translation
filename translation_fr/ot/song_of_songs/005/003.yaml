  text: פָּשַׁ֨טְתִּי֙ אֶת כֻּתָּנְתִּ֔/י אֵיכָ֖כָה אֶלְבָּשֶׁ֑/נָּה רָחַ֥צְתִּי אֶת רַגְלַ֖/י אֵיכָ֥כָה אֲטַנְּפֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/003.yaml
  text: I have taken off my tunic—how can I put it on again? I have washed my feet—how can I soil them?[a][b]
translation:
  language: fr
  text: J’ai ôté ma tunique — comment pourrais-je la remettre ? J’ai lavé mes pieds — comment pourrais-je les salir ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comment pourrais-je les souiller ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְתִּי
  choice: J’ai ôté
  rationale: Le verbe signifie enlever ou se dépouiller d’un vêtement. « Ôter » est naturel, précis et convient au registre poétique.
- source_word: כֻּתָּנְתִּי
  choice: ma tunique
  rationale: כֻּתֹּנֶת désigne un vêtement porté près du corps; « tunique » conserve cette précision mieux que le terme générique « vêtement ».
- source_word: אֵיכָכָה
  choice: comment pourrais-je
  rationale: L’interrogatif exprime ici une objection réticente plutôt qu’une impossibilité stricte; le conditionnel rend naturellement cette nuance en français.
- source_word: אֶלְבָּשֶׁנָּה
  choice: la remettre
  rationale: Le verbe signifie mettre ou revêtir, et le suffixe féminin renvoie à la tunique. « Remettre » exprime idiomatiquement l’inversion de l’action précédente.
- source_word: רָחַצְתִּי
  choice: J’ai lavé
  rationale: L’accompli présente une action achevée dont le résultat demeure pertinent au moment où la femme parle.
- source_word: רַגְלַי
  choice: mes pieds
  rationale: La forme renvoie naturellement aux deux pieds.
- source_word: אֲטַנְּפֵם
  choice: les salir
  rationale: Le piel de טנף signifie rendre sale. « Salir » garde le sens physique concret sans introduire l’idée cultuelle de souillure.
theological_decisions:
- issue: Interprétation des paroles de la femme
  choice: Les rendre comme une objection domestique concrète, sans introduire d’euphémisme sexuel dans le texte principal.
  alternative: Comprendre avant tout le vêtement et les pieds comme des images érotiques.
  rationale: Le Cantique peut permettre plusieurs niveaux de lecture, mais les mots de ce verset sont immédiatement concrets et domestiques. La traduction préserve ce sens explicite sans exclure les lectures littéraires plus larges.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux objections et leur tonalité réticente sont conservés; « ôté » apporte une légère élévation poétique sans archaïsme marqué.
