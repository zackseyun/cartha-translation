  text: My beloved put his hand through the opening[b][a], and my inward parts trembled for him.
translation:
  language: fr
  text: Mon bien-aimé a passé sa main par l’ouverture[a], et mes entrailles se sont émues pour lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’ouverture » ou « du trou ». Il s’agit probablement d’une ouverture dans la porte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes entrailles se sont émues à cause de lui ». L’hébreu décrit une émotion profonde au moyen d’une image corporelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, le nom désigne l’homme aimé par la femme. « Mon bien-aimé » conserve le ton relationnel et poétique sans ajouter une nuance plus explicite que le contexte.
- source_word: שָׁלַח יָדוֹ
  choice: a passé la main
  rationale: Le verbe signifie couramment « envoyer », mais, avec « la main », il décrit ici le geste de l’avancer ou de l’introduire. Cette formulation est naturelle en français devant « par l’ouverture ».
- source_word: מִן הַחֹר
  choice: par l’ouverture
  rationale: Le nom désigne un trou ou une ouverture, vraisemblablement dans la porte. La préposition est littéralement « depuis/de l’ouverture », mais le contexte évoque le passage de la main par celle-ci.
- source_word: וּמֵעַי
  choice: mes entrailles
  rationale: Le terme désigne les organes internes et, par extension, le siège des émotions profondes. « Mes entrailles » maintient cette image corporelle sans la remplacer par l’interprétation « mon cœur ».
- source_word: הָמוּ
  choice: ont frémi
  rationale: Le verbe exprime une agitation, un tumulte ou un mouvement intérieur. « Ont frémi » rend de façon poétique et concise cette réaction viscérale.
- source_word: עָלָיו
  choice: pour lui
  rationale: Dans ce contexte affectif, la préposition marque l’orientation de l’émotion vers le bien-aimé. « Pour lui » garde cette relation sans préciser davantage sa cause ou sa nature.
