  text: הִשְׁבַּ֥עְתִּי אֶתְ/כֶ֖ם בְּנ֣וֹת יְרוּשָׁלִָ֑ם אִֽם תִּמְצְאוּ֙ אֶת דּוֹדִ֔/י מַה תַּגִּ֣ידוּ ל֔/וֹ שֶׁ/חוֹלַ֥ת אַהֲבָ֖ה אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
translation:
  language: fr
  text: 'Je vous en conjure, filles de Jérusalem : si vous trouvez mon bien-aimé, que lui direz-vous ? Que je suis malade d’amour.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « malade d’amour ».'
    reason: Précise la formulation source sans proposer une paraphrase qui atténuerait l’image de la maladie.
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Je vous en conjure
  rationale: Le hiphil de שׁבע exprime ici une adjuration solennelle, c’est-à-dire le fait de placer quelqu’un sous serment. « Je vous en conjure » conserve l’urgence et la dignité poétique de la formule sans lourdeur juridique.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: filles de Jérusalem
  rationale: Traduction directe de l’apostrophe conventionnelle du Cantique, qui préserve son caractère littéraire sans préciser davantage l’âge ou le statut des destinataires.
- source_word: אִם תִּמְצְאוּ
  choice: si vous trouvez
  rationale: אִם introduit normalement une condition. « Si » maintient cette nuance plutôt que de transformer l’éventualité en attente certaine avec « quand ».
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, דּוֹד désigne l’homme aimé. « Mon bien-aimé » est naturel, digne et suffisamment large pour ne pas expliciter plus que l’hébreu.
- source_word: מַה תַּגִּידוּ לוֹ
  choice: que lui direz-vous ?
  rationale: La question demande quel message les filles transmettront. Le futur français rend naturellement l’interrogation directe.
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  choice: Que je suis malade d’amour
  rationale: Cette formulation reproduit la métaphore hébraïque explicite de la maladie causée par l’amour et respecte l’ordre communicatif de la réponse attendue.
- source_word: אַהֲבָה
  choice: amour
  rationale: Équivalent français courant et direct du terme hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe traditionnelle « filles de Jérusalem » et la métaphore « malade d’amour » sont conservées, tandis que la syntaxe reste claire pour un lectorat contemporain.
