  text: His head is finest gold[a]; his locks are wavy[b], black as a raven.
translation:
  language: fr
  text: Sa tête est d’or très pur[a] ; ses mèches sont ondulées[b], noires comme le corbeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’or fin » ; l’hébreu associe deux termes désignant l’or pour renforcer l’image de sa qualité exceptionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « sont bouclées » ; le terme hébreu est rare et poétique, et peut évoquer des ondulations ou des boucles.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁוֹ
  choice: Sa tête
  rationale: Le nom רֹאשׁ désigne concrètement la tête dans cette description poétique du corps du bien-aimé.
- source_word: כֶּתֶם פָּז
  choice: d’or très fin
  rationale: Les deux termes associés évoquent un or précieux et de haute qualité. « D’or très fin » conserve leur force poétique sans reproduire lourdement la construction hébraïque.
- source_word: קְוּצּוֹתָיו
  choice: ses mèches
  rationale: Le mot désigne des mèches ou des boucles de cheveux. « Mèches » est naturel, poétique et suffisamment général en français moderne.
- source_word: תַּלְתַּלִּים
  choice: ondulent
  rationale: Ce terme poétique rare décrit vraisemblablement des cheveux formant des ondulations ou des boucles. Le verbe « ondulent » préserve cette nuance sans imposer une précision incertaine.
- source_word: שְׁחֹרוֹת
  choice: noires
  rationale: L’adjectif exprime directement la couleur noire et s’accorde ici avec « mèches ».
- source_word: כָּעוֹרֵב
  choice: comme le corbeau
  rationale: La comparaison évoque le noir du corbeau. Cette formulation est concise et conserve l’image poétique de l’hébreu.
