  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
translation:
  language: fr
  text: 'Mon bien-aimé est rayonnant et vermeil,

    il se distingue entre dix mille[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est remarquable entre dix mille » ; plus littéralement : « signalé comme par une bannière ».'
    reason: Alternative lexicale pour דָּגוּל, qui peut exprimer le fait d’être signalé ou remarquable et garde un lien possible avec l’image d’une bannière.
lexical_decisions:
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique des cantiques, דּוֹד désigne régulièrement l’homme aimé par la femme. « Mon bien-aimé » est naturel, digne et cohérent avec le vocabulaire amoureux du livre.
- source_word: צַח
  choice: rayonnant
  rationale: L’adjectif évoque un aspect clair, lumineux ou éclatant. « Rayonnant » rend cette luminosité visible sans réduire nécessairement le terme à la couleur de la peau.
- source_word: וְאָדוֹם
  choice: et vermeil
  rationale: אָדוֹם exprime la rougeur. Appliqué à l’apparence d’une personne, « vermeil » évoque une coloration rouge et pleine de santé dans un registre poétique approprié.
- source_word: דָּגוּל
  choice: il se distingue
  rationale: La forme peut désigner quelqu’un qui est signalé, bien visible ou remarquable, avec une possible image de bannière. « Il se distingue » exprime naturellement sa prééminence perceptible sans imposer une métaphore obscure.
- source_word: מֵרְבָבָה
  choice: entre dix mille
  rationale: La préposition מִן présente ici l’être aimé comme ressortant d’une immense multitude. « Entre dix mille » conserve la formulation poétique et le nombre du texte source.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. « Vermeil » est légèrement littéraire, mais précis et adapté au genre. Le parallélisme est conservé sur deux lignes.
