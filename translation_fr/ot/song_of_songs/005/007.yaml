  text: מְצָאֻ֧/נִי הַ/שֹּׁמְרִ֛ים הַ/סֹּבְבִ֥ים בָּ/עִ֖יר הִכּ֣וּ/נִי פְצָע֑וּ/נִי נָשְׂא֤וּ אֶת רְדִידִ/י֙ מֵֽ/עָלַ֔/י שֹׁמְרֵ֖י הַ/חֹמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/007.yaml
  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
translation:
  language: fr
  text: Les gardes qui faisaient leur ronde dans la ville[a] m’ont trouvée ; ils m’ont frappée, ils m’ont blessée ; les gardes des murailles m’ont enlevé mon châle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui circulaient dans la ville » ou « qui patrouillaient dans la ville ». Le participe hébreu signifie « aller autour » ou « faire le tour ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon voile » ou « mon vêtement de dessus ». Le mot hébreu désigne une pièce d’étoffe extérieure servant à couvrir le corps, sans permettre d’en préciser exactement la forme.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאֻנִי
  choice: m’ont trouvée
  rationale: Le verbe מצא signifie directement « trouver ». L’accord au féminin correspond à la voix féminine qui parle dans le contexte du poème.
- source_word: הַשֹּׁמְרִים
  choice: les gardes
  rationale: Le participe substantivé désigne ceux qui montent la garde. « Gardes » est naturel en français moderne dans le cadre urbain et nocturne.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: qui faisaient leur ronde dans la ville
  rationale: Le participe de סבב évoque le fait de circuler ou de faire le tour. « Faisaient leur ronde » rend naturellement leur déplacement régulier sans imposer une fonction policière moderne.
- source_word: הִכּוּנִי
  choice: ils m’ont frappée
  rationale: נכה est un verbe général signifiant frapper. Cette formulation reste distincte du verbe plus fort qui suit.
- source_word: פְצָעוּנִי
  choice: ils m’ont blessée
  rationale: פצע signifie blesser ou causer une plaie et exprime clairement l’issue violente des coups.
- source_word: נָשְׂאוּ אֶת רְדִידִי מֵעָלַי
  choice: m’ont enlevé mon châle
  rationale: נשא avec מֵעָלַי indique ici qu’on retire le vêtement qui se trouve sur elle. רְדִיד désigne une pièce d’étoffe extérieure couvrante ; « châle » est clair sans préciser indûment qu’il couvrait le visage.
- source_word: שֹׁמְרֵי הַחֹמוֹת
  choice: les gardes des murailles
  rationale: Le groupe construit désigne ceux qui gardent les murs de la ville. « Murailles » convient mieux que « murs » aux fortifications urbaines.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais direct. La répétition « ils m’ont frappée, ils m’ont blessée » conserve le parallélisme et l’intensification de l’hébreu. Le point-virgule maintient la progression rapide de la scène.
