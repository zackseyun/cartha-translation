base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/014.yaml
  text: His hands are rods of gold[a], set with beryl; his body is polished ivory[c][b], covered with sapphires.
translation:
  language: fr
  text: Ses mains sont des rouleaux d’or[a], sertis de chrysolithe[b] ; son ventre est une œuvre d’ivoire[c], couverte de saphirs[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des anneaux d’or » ; le mot hébreu désigne des formes arrondies ou cylindriques et peut évoquer un travail d’orfèvrerie.
    reason: lexical_alternative
  - marker: b
    text: Ou « de béryl » ou « de topaze » ; l’identification précise de la pierre appelée תַּרְשִׁישׁ en hébreu est incertaine.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ses entrailles » ou « son ventre » ; dans ce portrait poétique, le terme désigne la région abdominale.
    reason: lexical_alternative
  - marker: d
    text: Le « saphir » antique ne correspondait pas nécessairement à la pierre aujourd’hui appelée ainsi.
    reason: historical_context
lexical_decisions:
- source_word: יָדָיו
  choice: ses mains
  rationale: יָד désigne normalement la main, tout en pouvant parfois inclure le bras. « Mains » conserve ici l’image corporelle la plus directe.
- source_word: גְּלִילֵי זָהָב
  choice: des cylindres d’or
  rationale: גְּלִילִים évoque des formes arrondies ou cylindriques. « Cylindres » rend cette forme sans imposer l’interprétation plus précise d’anneaux.
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  choice: sertis de chrysolithe
  rationale: Dans cette image d’orfèvrerie, le participe signifiant littéralement « remplis » se rend naturellement par « sertis ». L’identification exacte de תַּרְשִׁישׁ demeure incertaine ; « chrysolithe » est un équivalent traditionnel, accompagné d’une note.
- source_word: מֵעָיו
  choice: son ventre
  rationale: מֵעֶה peut désigner les entrailles, le ventre ou la région abdominale. Dans ce portrait physique, « ventre » est concret, courant et fidèle, sans élargir arbitrairement le terme à tout le corps.
- source_word: עֶשֶׁת שֵׁן
  choice: une pièce d’ivoire poli
  rationale: La formule évoque une masse ou une pièce d’ivoire travaillée. Cette traduction préserve l’image artisanale tout en donnant un français poétique naturel.
- source_word: מְעֻלֶּפֶת סַפִּירִים
  choice: couverte de saphirs
  rationale: Le participe exprime l’idée d’être enveloppé, revêtu ou couvert. « Couverte de » restitue clairement l’image sans préciser indûment la technique décorative.
