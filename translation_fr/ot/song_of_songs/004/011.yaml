  text: נֹ֛פֶת תִּטֹּ֥פְנָה שִׂפְתוֹתַ֖יִ/ךְ כַּלָּ֑ה דְּבַ֤שׁ וְ/חָלָב֙ תַּ֣חַת לְשׁוֹנֵ֔/ךְ וְ/רֵ֥יחַ שַׂלְמֹתַ֖יִ/ךְ כְּ/רֵ֥יחַ לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/011.yaml
  text: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
translation:
  language: fr
  text: Tes lèvres distillent du miel des rayons[a], ma fiancée ; le miel et le lait sont sous ta langue[b], et le parfum de tes vêtements est comme le parfum du Liban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miel en rayon » ; le mot hébreu נֹפֶת est plus précis que le terme général traduit ensuite par « miel ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « le miel et le lait », et non la formule plus familière « le lait et le miel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפֶת
  choice: le miel des rayons
  rationale: Le terme désigne plus précisément le miel qui coule des rayons, à la différence de דְּבַשׁ, terme plus général employé ensuite. Cette formulation conserve la distinction poétique tout en restant naturelle en français.
- source_word: תִּטֹּפְנָה
  choice: distillent
  rationale: Le verbe נטף évoque un liquide qui tombe ou coule goutte à goutte. « Distillent » convient naturellement aux lèvres dans ce contexte poétique.
- source_word: שִׂפְתוֹתַיִךְ
  choice: tes lèvres
  rationale: Traduction directe et idiomatique du pluriel muni du suffixe féminin singulier.
- source_word: כַּלָּה
  choice: ma fiancée
  rationale: Dans le Cantique, le mot sert d'appellation amoureuse dans un cadre nuptial. « Ma fiancée » est naturel en français et rend explicitement la relation implicite dans l'interpellation.
- source_word: דְּבַשׁ וְחָלָב
  choice: le miel et le lait
  rationale: L'ordre hébreu est conservé afin de ne pas substituer la formule biblique plus courante « le lait et le miel ».
- source_word: תַּחַת לְשׁוֹנֵךְ
  choice: sous ta langue
  rationale: La formulation directe préserve l'image concrète et sensuelle de l'hébreu.
- source_word: רֵיחַ
  choice: parfum
  rationale: Dans ce contexte favorable, « parfum » exprime clairement une odeur agréable et convient au registre poétique.
- source_word: שַׂלְמֹתַיִךְ
  choice: tes vêtements
  rationale: Le nom pluriel désigne les habits ou vêtements extérieurs ; « vêtements » est précis, courant et digne.
- source_word: כְּרֵיחַ לְבָנוֹן
  choice: comme le parfum du Liban
  rationale: La traduction garde l'image géographique et poétique du Liban sans préciser ce que le texte laisse évocateur.
