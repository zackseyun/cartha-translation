  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים אֵ֤לֶךְ לִ/י֙ אֶל הַ֣ר הַ/מּ֔וֹר וְ/אֶל גִּבְעַ֖ת הַ/לְּבוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
translation:
  language: fr
  text: Jusqu’à ce que le jour respire et que les ombres s’enfuient[a], j’irai[b] vers la montagne de myrrhe et vers la colline d’oliban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à ce que le jour souffle (ou fraîchisse) et que les ombres s’enfuient ». Le verbe hébreu signifie littéralement « respirer » ou « souffler » et peut évoquer la brise du soir ou la venue de l’aube.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ajoute un datif à suffixe pronominal, que l’on pourrait rendre littéralement par « j’irai pour moi-même ». Il peut simplement souligner l’implication personnelle du locuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: Jusqu’à ce que
  rationale: Marque la limite temporelle tout en conservant la construction ouverte du texte hébreu.
- source_word: שֶׁיָּפוּחַ
  choice: respire
  rationale: Le verbe פוח signifie littéralement « respirer » ou « souffler ». « Respire » préserve la personnification poétique du jour sans trancher entre la brise du soir et l’apparition de l’aube.
- source_word: הַיּוֹם
  choice: le jour
  rationale: Équivalent direct du nom défini, ici personnifié par le verbe « respirer ».
- source_word: וְנָסוּ
  choice: et que… s’enfuient
  rationale: Le verbe נוס exprime la fuite. La forme pronominale est naturelle en français et maintient l’image vive plutôt que de l’atténuer en « disparaissent ».
- source_word: הַצְּלָלִים
  choice: les ombres
  rationale: Rendu courant et concret de צְלָלִים, adapté au parallélisme poétique.
- source_word: אֵלֶךְ לִי
  choice: j’irai
  rationale: אֵלֶךְ est la première personne de « aller ». Le datif לִי peut renforcer l’implication personnelle du locuteur, mais il ne requiert pas nécessairement un complément distinct en français.
- source_word: אֶל הַר הַמּוֹר
  choice: vers la montagne de la myrrhe
  rationale: La préposition directionnelle et le syntagme construit sont rendus directement, sans interpréter l’image.
- source_word: וְאֶל גִּבְעַת הַלְּבוֹנָה
  choice: et vers la colline de l’encens
  rationale: גִּבְעָה est distingué de הַר par « colline ». לְבוֹנָה désigne la résine aromatique connue en français biblique et courant sous le nom d’« encens ».
theological_decisions:
- issue: Identification du sens de la montagne de la myrrhe et de la colline de l’encens
  choice: Conserver les images poétiques littérales sans en préciser le référent
  alternative: Les expliciter comme métaphores du corps de la bien-aimée ou comme symboles d’un lieu cultuel
  rationale: Le texte hébreu ne nomme pas explicitement le référent de ces images. Une traduction ne doit pas imposer une lecture érotique, allégorique ou cultuelle particulière.
translation_notes:
  register: Français moderne, poétique et digne. La personnification « le jour respire » conserve l’étrangeté expressive de l’hébreu. « S’enfuient » maintient le mouvement concret des ombres, et la répétition de « vers » respecte le parallélisme des deux destinations.
