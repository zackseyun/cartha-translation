base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/003.yaml
  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
translation:
  language: fr
  text: 'Tes lèvres sont comme un fil écarlate,

    et ta bouche est ravissante[a].

    Tes tempes sont comme une tranche de grenade,

    derrière ton voile[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta parole est ravissante » ; le terme hébreu peut désigner le fait de parler ou ce qui est dit, mais, dans cette description successive des traits du corps, il peut aussi évoquer la bouche.
    reason: lexical_alternative
  - marker: b
    text: Ou « à travers ton voile » ; l’expression hébraïque peut évoquer quelque chose que l’on voit à travers une couverture ou depuis l’arrière de celle-ci.
    reason: lexical_alternative
  - marker: c
    text: Ou « derrière tes mèches » ou « derrière tes cheveux » ; le sens du terme hébreu traduit par « voile » est discuté dans ce contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּחוּט הַשָּׁנִי
  choice: comme un fil écarlate
  rationale: חוּט désigne un fil, un cordon ou une cordelette, et שָׁנִי une teinture écarlate ou cramoisie. « Un fil écarlate » restitue avec naturel la finesse et la couleur de l’image.
- source_word: שִׂפְתֹתַיִךְ
  choice: tes lèvres
  rationale: Le duel hébreu désigne les deux lèvres ; le pluriel français est idiomatique.
- source_word: וּמִדְבָּרֵיךְ
  choice: et ta bouche
  rationale: Le terme est lié à la parole et peut désigner le parler ou le discours. Dans cette succession de traits physiques, « bouche » est une métonymie naturelle, tout en laissant l’autre sens en note.
- source_word: נָאוֶה
  choice: est ravissante
  rationale: נָאוֶה exprime ce qui est beau, agréable ou charmant. « Ravissante » convient au registre amoureux et poétique sans archaïsme.
- source_word: כְּפֶלַח הָרִמּוֹן
  choice: comme une tranche de grenade
  rationale: פֶּלַח est une tranche ou une portion découpée. Cette formulation conserve l’image concrète de la grenade ouverte.
- source_word: רַקָּתֵךְ
  choice: tes tempes
  rationale: רַקָּה désigne normalement la tempe, le côté de la tête. « Tempes » est plus précis lexicalement que « joues ».
- source_word: מִבַּעַד
  choice: derrière
  rationale: La préposition évoque ce qui se voit derrière ou à travers un élément interposé. « Derrière » est fluide dans le texte, et la nuance « à travers » est conservée en note.
- source_word: לְצַמָּתֵךְ
  choice: ton voile
  rationale: צַמָּה est traditionnellement compris ici comme un voile ou une couverture, mais son sens est débattu et peut renvoyer aux mèches ou aux cheveux ; l’alternative est signalée en note.
