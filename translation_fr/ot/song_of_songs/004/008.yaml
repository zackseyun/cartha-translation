review_pass:
  verdict: revise
  source_fidelity: Le sens principal de תָּשׁוּרִי est rendu avec prudence par « Regarde », ce qui respecte une interprétation lexicalement défendable et l’ambiguïté est signalée. Les toponymes et les images des repaires de lions et des montagnes de léopards sont fidèles. En revanche, כַּלָּה désigne explicitement la « fiancée / épouse »; « ma bien-aimée » atténue indûment ce terme nuptial.
  naturalness: Le français est poétique et globalement naturel. « Viens avec moi du Liban » peut toutefois se lire comme si le Liban était le lieu où se trouve le locuteur; « Viens avec moi, loin du Liban » exprime plus clairement l’invitation à quitter cette région tout en gardant la répétition. « Ma fiancée » est naturel dans ce contexte lyrique.
  terminology: Employer « ma fiancée » préserve le terme nuptial hébreu sans recourir au peu naturel « ma mariée ». Les graphies « l’Amana », « le Senir » et « l’Hermon » sont recevables. La note a doit présenter l’alternative sans affirmer trop fortement « descends », qui est une interprétation contextuelle disputée.
  issues:
  - severity: medium
    issue: Le terme כַּלָּה est traduit par « ma bien-aimée ».
    rationale: Ce choix efface la désignation nuptiale explicite (« fiancée », éventuellement « épouse » selon l’interprétation), alors que le français dispose de « ma fiancée », idiomatique et fidèle.
  - severity: low
    issue: La note a formule « descends du sommet » comme l’alternative unique immédiate.
    rationale: Le verbe est difficile et l’analyse de mouvement descendant demeure disputée. La note devrait signaler sobrement que certains comprennent un appel à quitter ou à descendre des hauteurs, tout en conservant la possibilité de « regarder / observer ».
