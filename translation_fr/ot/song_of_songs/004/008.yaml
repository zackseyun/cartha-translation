base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
translation:
  language: fr
  text: 'Viens avec moi, loin du Liban, ma fiancée ;

    avec moi, loin du Liban, viens.

    Regarde[a] depuis le sommet de l’Amana,

    depuis le sommet du Senir et de l’Hermon,

    depuis les repaires des lions,

    depuis les montagnes des léopards.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est difficile. Il peut évoquer le fait de regarder ou d’observer depuis les hauteurs ; certains le comprennent comme un appel à quitter ou à descendre des sommets.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִתִּי מִלְּבָנוֹן
  choice: avec moi du Liban
  rationale: La préposition אֵת avec suffixe signifie naturellement « avec moi », tandis que מִן indique la provenance. La répétition est conservée pour préserver l’insistance poétique.
- source_word: כַּלָּה
  choice: ma bien-aimée
  rationale: Le nom désigne littéralement une jeune épouse ou une fiancée. Dans l’adresse amoureuse du Cantique, « ma bien-aimée » est naturel en français et évite le terme moderne plus étroit « mariée », sans effacer la relation nuptiale sous-jacente.
- source_word: תָּבוֹאִי
  choice: viens
  rationale: La forme verbale prend ici la valeur d’une invitation pressante. L’impératif français rend cette force naturellement.
- source_word: תָּשׁוּרִי
  choice: regarde
  rationale: Ce verbe rare peut exprimer l’action de regarder ou d’observer. « Regarde » conserve ce sens sans imposer un déplacement qui n’est pas lexicalement certain; l’autre interprétation contextuelle est signalée en note.
- source_word: מֵרֹאשׁ
  choice: depuis le sommet de
  rationale: רֹאשׁ signifie littéralement « tête », mais « sommet » est l’équivalent français idiomatique dans un contexte montagneux; « depuis » maintient la valeur de מִן.
- source_word: אֲמָנָה
  choice: l’Amana
  rationale: Nom géographique translittéré selon une forme française lisible.
- source_word: שְׂנִיר
  choice: le Senir
  rationale: Nom géographique ancien translittéré; l’article convient en français pour un massif ou sommet.
- source_word: חֶרְמוֹן
  choice: l’Hermon
  rationale: Forme française usuelle du nom propre, avec l’article normalement employé pour une montagne.
- source_word: מִמְּעֹנוֹת אֲרָיוֹת
  choice: depuis les repaires des lions
  rationale: מְעוֹנוֹת désigne des demeures ou tanières. « Repaires » est naturel, évocateur et maintient l’image du danger.
- source_word: מֵהַרְרֵי נְמֵרִים
  choice: depuis les montagnes des léopards
  rationale: La construction nominale est rendue directement, en conservant le parallélisme avec les repaires des lions.
theological_decisions:
- issue: Valeur de תָּשׁוּרִי
  choice: regarde
  alternative: descends
  rationale: Le verbe difficile permet une lecture liée au regard, tandis que le contexte d’un appel à quitter les hauteurs dangereuses a conduit certains à comprendre un mouvement de descente. Le texte retient le sens lexical le plus direct et la note préserve l’ambiguïté.
translation_notes:
  register: Vers libre, poétique et digne, avec répétition de l’invitation et des compléments introduits par « depuis ». Le vocabulaire reste courant en français international. « Ma bien-aimée » privilégie une adresse amoureuse naturelle, tandis que la note lexicale conserve la principale difficulté du texte hébreu.
