source:
  edition: WLC
  text: גַּ֥ן נָע֖וּל אֲחֹתִ֣/י כַלָּ֑ה גַּ֥ל נָע֖וּל מַעְיָ֥ן חָתֽוּם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/012.yaml
  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
translation:
  language: fr
  text: Un jardin clos, ma sœur, ma fiancée ; une source close[a], une fontaine scellée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « source » peut aussi signifier « tas » ailleurs ; ici, son parallélisme avec « fontaine » favorise le sens d’une source d’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּן
  choice: jardin
  rationale: Le nom désigne simplement un jardin ; l’idée d’accès fermé est exprimée séparément par נָעוּל.
- source_word: נָעוּל
  choice: clos / close
  rationale: Le participe passif signifie « fermé » ou « verrouillé ». « Clos » convient naturellement au jardin et, repris au féminin avec « source », conserve la répétition hébraïque dans une langue poétique et digne.
- source_word: אֲחֹתִי
  choice: ma sœur
  rationale: Cette appellation intime propre au Cantique est conservée littéralement, sans la réduire à un lien de parenté ordinaire ni la paraphraser.
- source_word: כַלָּה
  choice: ma fiancée
  rationale: Le terme désigne la jeune femme destinée au mariage ou la mariée. « Ma fiancée » est naturel en français moderne dans cette adresse amoureuse et maintient le parallélisme avec « ma sœur ».
- source_word: גַּל
  choice: source
  rationale: Bien que ce mot puisse ailleurs désigner un « tas », son parallélisme immédiat avec מַעְיָן favorise ici le sens d’une source d’eau.
- source_word: מַעְיָן
  choice: fontaine
  rationale: Le mot désigne une source ou un point d’où jaillit l’eau. « Fontaine » préserve la variation poétique avec « source ».
- source_word: חָתוּם
  choice: scellée
  rationale: Le participe passif signifie directement « scellé » et maintient l’image d’un accès protégé.
theological_decisions:
- issue: Identification explicite de la femme au jardin et aux sources
  choice: Maintien des propositions nominales sans ajout de « tu es »
  alternative: « Tu es un jardin clos… »
  rationale: L’hébreu juxtapose les images et les appellations sans copule exprimée. La formulation française conserve cette densité poétique et ne tranche pas davantage la syntaxe métaphorique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition « clos / close » reproduit celle du participe hébreu, tandis que le point-virgule rend les deux volets parallèles du vers.
