  yaml_path: translation/ot/song_of_songs/004/005.yaml
  text: Your two breasts are like two fawns[a], twins of a gazelle, grazing among the lilies.
translation:
  language: fr
  text: Tes deux seins sont comme deux faons, jumeaux d’une gazelle[a], qui broutent parmi les lis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jumeaux d’une biche ». Le mot hébreu peut désigner plus généralement la femelle d’un animal semblable à une gazelle ou à un cerf ; « gazelle » est retenu ici en accord avec l’imagerie récurrente du Cantique.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: tes deux seins
  rationale: Le numéral « deux » est explicite en hébreu et prépare le parallèle avec les deux faons.
- source_word: כִּשְׁנֵי
  choice: sont comme deux
  rationale: Le préfixe כְּ marque la comparaison; le français ajoute naturellement la copule dans cette proposition nominale.
- source_word: עֳפָרִים
  choice: faons
  rationale: Le terme désigne de jeunes cervidés; « faons » est concis, naturel et conserve la tendresse de l’image.
- source_word: תְּאוֹמֵי
  choice: jumeaux
  rationale: Le construit signifie littéralement « jumeaux de » et souligne la ressemblance ainsi que la symétrie du couple.
- source_word: צְבִיָּה
  choice: d’une gazelle
  rationale: Le nom féminin peut désigner une gazelle femelle ou, plus largement, une biche; « gazelle » correspond bien à l’imagerie récurrente du Cantique.
- source_word: הָרֹעִים
  choice: qui broutent
  rationale: Le participe décrit des animaux en train de se nourrir; « broutent » rend cette action pastorale de manière idiomatique.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: parmi les lis
  rationale: « Lis » est le rendu traditionnel et plausible de שׁוֹשַׁנִּים; « parmi » convient à des animaux évoluant au milieu des fleurs.
