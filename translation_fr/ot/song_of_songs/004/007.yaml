  text: You are altogether beautiful[a], my beloved[c][b], and there is no blemish in you.
translation:
  language: fr
  text: 'Tu es tout entière belle, mon amour,

    et il n’y a aucun défaut en toi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֻּלָּךְ
  choice: tout entière
  rationale: Avec le suffixe féminin singulier, l’expression porte sur la femme dans son ensemble. « Tout entière » rend naturellement en français cette valeur globale et intensive.
- source_word: יָפָה
  choice: belle
  rationale: « Belle » est l’équivalent français direct, actuel et poétique de l’adjectif dans ce contexte.
- source_word: רַעְיָתִי
  choice: mon amour
  rationale: Dans le Cantique, le terme sert d’appellation affectueuse adressée à la femme aimée. « Mon amour » est naturel en français moderne et conserve l’intimité du vocatif.
- source_word: וּמוּם
  choice: et aucun défaut
  rationale: מוּם désigne un défaut ou une imperfection physique. « Aucun défaut » convient au contexte poétique sans limiter le sens à une tache visible.
- source_word: אֵין בָּךְ
  choice: il n’y a … en toi
  rationale: Cette tournure préserve la construction existentielle négative de l’hébreu tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Langue poétique, digne et actuelle. Le féminin de « tout entière » rend explicitement le genre grammatical de la destinataire. La formulation conserve le parallélisme entre l’affirmation globale de sa beauté et l’absence de tout défaut.
