translation_notes:
  register: Français international moderne, poétique et digne. La structure parallèle et la répétition emphatique de l’hébreu sont maintenues. « Ravir le cœur » conserve l’intensité amoureuse sans archaïsme excessif; les formulations plus littérales et les ambiguïtés relatives au regard et à l’ornement du cou sont indiquées en notes.
