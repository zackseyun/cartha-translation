  source_fidelity: La répétition emphatique de לִבַּבְתִּנִי, l’appellation poétique « ma sœur, ma fiancée », et le sens probable de בְּאֶחָד מֵעֵינַיִךְ sont bien rendus. En revanche, « un pendentif de ton collier » ajoute une relation partie-tout (« pendentif » attaché à un « collier ») qui n’est pas explicitement donnée par l’hébreu. עֲנָק désigne plus largement une parure/ornement de cou, tandis que le dernier mot peut renvoyer au cou ou, selon l’analyse, à des ornements de cou.
  naturalness: Le français est poétique, moderne et fluide. « Tu m’as ravi le cœur » convient au registre du Cantique et conserve la répétition. « Par un seul de tes regards » est idiomatique. « Par un seul ornement à ton cou » est plus naturel et moins surinterprétatif que « par un seul pendentif de ton collier ».
  terminology: « Ma sœur, ma fiancée » préserve l’expression d’intimité du Cantique sans en faire une affirmation de parenté biologique. « Fiancée » est un usage français biblique établi pour כַלָּה et maintient la nuance nuptiale. Le terme plus générique « ornement » conserve l’incertitude de עֲנָק; la note explicite les possibilités « chaîne » et « collier ».
