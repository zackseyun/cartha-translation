base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/009.yaml
  text: You have captured my heart[a], my sister, my bride; you have captured my heart with one glance of your eyes[c][b], with one jewel of your necklace.
translation:
  language: fr
  text: Tu m’as ravi le cœur[a], ma sœur, ma fiancée ! Tu m’as ravi le cœur par un seul de tes regards[b], par un seul ornement à ton cou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu as bouleversé mon cœur ». Le verbe hébreu est rare et décrit l’effet puissant de la bien-aimée sur le cœur du locuteur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par un seul de tes yeux ». Il s’agit probablement d’un seul regard.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu peut aussi se comprendre comme « par une seule chaîne à ton cou » ou « par un seul élément de ton collier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבַּבְתִּנִי
  choice: tu m’as ravi le cœur
  rationale: Le verbe rare לבב exprime ici l’effet puissant de la bien-aimée sur le cœur du locuteur. « Ravir le cœur » est une expression française naturelle, poétique et intense; la répétition hébraïque est conservée.
- source_word: אֲחֹתִי
  choice: ma sœur
  rationale: La traduction littérale préserve ce terme d’affection propre au langage amoureux du Cantique sans l’interpréter comme une indication de parenté biologique.
- source_word: כַלָּה
  choice: ma fiancée
  rationale: כַלָּה peut désigner une jeune femme promise au mariage ou une épouse nouvellement mariée. « Ma fiancée » convient au registre amoureux et laisse entendre la dimension nuptiale sans imposer un état matrimonial trop précis.
- source_word: בְאֶחָד מֵעֵינַיִךְ
  choice: par un seul de tes regards
  rationale: Littéralement, « par un [élément] de tes yeux ». Le français idiomatique exprime naturellement le sens probable par « un seul de tes regards », tout en signalant l’ambiguïté formelle en note.
- source_word: בְּאַחַד עֲנָק
  choice: par un seul pendentif
  rationale: עֲנָק désigne un ornement porté au cou, possiblement une chaîne ou un collier. Dans cette construction, « pendentif » rend naturellement l’idée d’un élément singulier de la parure, tout en laissant les autres analyses en note.
- source_word: מִצַּוְּרֹנָיִךְ
  choice: de ton collier
  rationale: La forme rare liée au cou peut évoquer le cou lui-même ou les ornements qui l’entourent. Avec עֲנָק, « de ton collier » produit une image cohérente et naturelle, sans masquer l’incertitude lexicale grâce à la note.
