source:
  edition: WLC
  text: נֵ֣רְדְּ וְ/כַרְכֹּ֗ם קָנֶה֙ וְ/קִנָּמ֔וֹן עִ֖ם כָּל עֲצֵ֣י לְבוֹנָ֑ה מֹ֚ר וַ/אֲהָל֔וֹת עִ֖ם כָּל רָאשֵׁ֥י בְשָׂמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/014.yaml
  text: nard and saffron[a], calamus and cinnamon, with all the trees of frankincense, myrrh and aloes[e][d][c][b], with all the finest spices.
translation:
  language: fr
  text: nard et safran[a], roseau aromatique[b] et cannelle, avec tous les arbres à encens[c], myrrhe et bois d’aloès[d], avec les plus précieux des aromates[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nard indien ».
    reason: lexical_alternative
  - marker: b
    text: Ou « calamus » ou « canne odorante ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « avec tous les arbres d’encens ».'
    reason: lexical_alternative
  - marker: d
    text: Le « bois d’aloès » désigne probablement ici le bois odorant d’agar, et non l’aloe vera.
    reason: cultural_note
  - marker: e
    text: 'L’hébreu dit littéralement : « avec toutes les têtes des aromates », c’est-à-dire les aromates de premier choix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵרְדְּ
  choice: nard
  rationale: Désigne la plante ou la substance aromatique traditionnellement appelée « nard »; ce terme est précis, concis et établi en français biblique.
- source_word: כַרְכֹּם
  choice: safran
  rationale: Identification standard de cette épice aromatique coûteuse.
- source_word: קָנֶה
  choice: roseau aromatique
  rationale: Dans cette liste de parfums, le mot désigne vraisemblablement un roseau odorant; cette formulation est plus transparente en français courant que « calamus » tout en conservant l’image végétale.
- source_word: קִנָּמוֹן
  choice: cannelle
  rationale: Équivalent français standard de cette épice.
- source_word: עִם כָּל עֲצֵי לְבוֹנָה
  choice: avec tous les arbres à encens
  rationale: Rend de près l’expression hébraïque et préserve son image arborée, sans la réduire à la seule résine.
- source_word: מֹר
  choice: myrrhe
  rationale: Équivalent français traditionnel et exact de cette résine aromatique.
- source_word: אֲהָלוֹת
  choice: bois d’aloès
  rationale: Dans ce contexte de parfumerie, il s’agit vraisemblablement d’un bois odorant, l’agar, et non de l’aloe vera; « bois d’aloès » conserve l’expression biblique tout en évitant une identification végétale trompeuse.
- source_word: רָאשֵׁי בְשָׂמִים
  choice: les plus précieux des aromates
  rationale: Littéralement « les têtes/chefs des aromates »; l’expression idiomatique désigne les aromates de premier choix. « Plus précieux » convient au contexte poétique et luxueux.
theological_decisions: []
