  text: שְׁלָחַ֨יִ/ךְ֙ פַּרְדֵּ֣ס רִמּוֹנִ֔ים עִ֖ם פְּרִ֣י מְגָדִ֑ים כְּפָרִ֖ים עִם נְרָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/013.yaml
  text: Your shoots are an orchard of pomegranates with choice fruits, henna with nards.
translation:
  language: fr
  text: 'Tes pousses sont un verger de grenadiers,

    avec des fruits exquis,

    des plants de henné et des nards.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלָחַיִךְ
  choice: Tes pousses
  rationale: Le terme désigne ici ce qui pousse ou s’étend à partir de la bien-aimée. « Pousses » conserve l’image végétale et la possible portée poétique sans la préciser abusivement.
- source_word: פַּרְדֵּס רִמּוֹנִים
  choice: un verger de grenadiers
  rationale: פַּרְדֵּס désigne un parc ou verger cultivé, et רִמּוֹנִים peut désigner les grenades ou les grenadiers. Dans l’image d’un verger, « grenadiers » est le rendu français le plus naturel.
- source_word: פְּרִי מְגָדִים
  choice: des fruits exquis
  rationale: מְגָדִים évoque ce qui est précieux, excellent ou délectable. « Exquis » exprime à la fois la qualité et l’agrément des fruits.
- source_word: כְּפָרִים
  choice: des plants de henné
  rationale: Le pluriel renvoie à des plantes de henné. « Plants de henné » évite le pluriel français peu naturel « hennés » tout en gardant la référence botanique.
- source_word: נְרָדִים
  choice: des nards
  rationale: Le pluriel hébreu est conservé. Le nard est une plante aromatique et un parfum bien attesté dans le contexte du Cantique.
