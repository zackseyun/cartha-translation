base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
translation:
  language: fr
  text: Réveille-toi, vent du nord, et viens, vent du sud ! Souffle sur mon jardin, pour que ses parfums se répandent.[a] Que mon bien-aimé entre dans son jardin[b] et qu’il mange de ses fruits exquis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour que ses aromates coulent ». Le mot hébreu peut désigner les substances aromatiques ou le parfum qu’elles dégagent.'
    reason: lexical_alternative
  - marker: b
    text: Le passage de « mon jardin » à « son jardin » se trouve dans le texte hébreu et suggère ici l’appartenance réciproque des deux amoureux.
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי צָפוֹן֙ וּב֣וֹאִי תֵימָ֔ן
  choice: Réveille-toi, vent du nord, et viens, vent du sud
  rationale: Les noms hébreux désignent littéralement le nord et le sud, mais ils sont interpellés comme des agents qui soufflent. En français, « vent » explicite naturellement la métonymie. Les impératifs féminins singuliers sont rendus au singulier dans chaque apostrophe.
- source_word: הָפִ֥יחִי גַנִּ֖י
  choice: Soufflez sur mon jardin
  rationale: Le verbe évoque l’action de souffler. Le pluriel français reprend ensemble les deux vents qui viennent d’être invoqués, là où l’hébreu emploie encore une forme féminine singulière.
- source_word: יִזְּל֣וּ בְשָׂמָ֑יו
  choice: pour que ses parfums se répandent
  rationale: יִזְּלוּ signifie couler ou ruisseler, tandis que בְשָׂמִים peut désigner les aromates ou les senteurs qu’ils produisent. En français, « les parfums se répandent » conserve l’image olfactive et évite l’expression peu naturelle « les aromates coulent ».
- source_word: יָבֹ֤א דוֹדִי֙ לְגַנּ֔וֹ
  choice: Que mon bien-aimé entre dans son jardin
  rationale: La tournure volitive est rendue par « Que… ». « Entre dans » exprime naturellement le mouvement vers l’intérieur, et le passage de « mon jardin » à « son jardin » est strictement conservé.
- source_word: וְיֹאכַ֖ל פְּרִ֥י מְגָדָֽיו
  choice: et qu’il mange de ses fruits exquis
  rationale: Le verbe concret « manger » est maintenu plutôt que remplacé par une interprétation. מֶגֶד qualifie ce qui est précieux, excellent ou délicieux ; « exquis » convient à la poésie amoureuse sans introduire de superlatif.
theological_decisions:
- issue: Image sensuelle du jardin et changement de possessif
  choice: Conserver sans l’expliciter l’image érotique et le passage de « mon jardin » à « son jardin ».
  alternative: Allégoriser le jardin ou uniformiser les possessifs.
  rationale: Le texte hébreu présente directement une poésie amoureuse intime. La traduction ne doit ni en atténuer la sensualité ni lui imposer une interprétation doctrinale extérieure ; le changement de possessif contribue à l’expression de l’appartenance réciproque.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe directe aux vents est maintenue. Le tutoiement convient à la poésie amoureuse ; le pluriel « Soufflez » réunit naturellement les deux vents interpellés.
