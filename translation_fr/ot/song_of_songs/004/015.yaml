  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
translation:
  language: fr
  text: Une source des jardins[a], un puits d’eau vive[b], des eaux qui coulent du Liban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fontaine des jardins ». L’hébreu peut désigner une source naturelle ou le point d’où l’eau jaillit; le rapport exact avec les jardins est condensé dans l’expression.
    reason: lexical_alternative
  - marker: b
    text: Dans la langue biblique, l’« eau vive » est une eau fraîche et courante, par opposition à une eau stagnante.
    reason: cultural_note
lexical_decisions:
- source_word: מַעְיַן
  choice: source
  rationale: Le nom désigne une source naturelle ou le point d’où jaillit l’eau. « Source » est naturel en français et convient au parallélisme avec « puits » et les eaux qui coulent.
- source_word: גַּנִּים
  choice: jardins
  rationale: Le pluriel explicite est conservé. Avec « qui arrose », il exprime naturellement la fonction de la source à l’égard des jardins.
- source_word: בְּאֵר
  choice: puits
  rationale: Le terme désigne normalement un puits. « Citerne » évoquerait plutôt une eau stockée, contrairement à l’image d’une eau fraîche et courante.
- source_word: מַיִם חַיִּים
  choice: eau vive
  rationale: « Eau vive » est l’expression française traditionnelle et toujours intelligible pour une eau fraîche et courante, par opposition à une eau stagnante; le singulier collectif est idiomatique en français.
- source_word: וְנֹזְלִים
  choice: des ruisseaux qui coulent
  rationale: Le participe pluriel exprime des eaux en mouvement. « Ruisseaux » explicite naturellement le nom sous-entendu par l’image aquatique, tandis que « qui coulent » préserve la valeur verbale du participe.
- source_word: מִן לְבָנוֹן
  choice: du Liban
  rationale: Rend directement l’origine géographique exprimée par la préposition, sans ajouter l’idée interprétative de descente.
