  text: הִנָּ֨/ךְ יָפָ֤ה רַעְיָתִ/י֙ הִנָּ֣/ךְ יָפָ֔ה עֵינַ֣יִ/ךְ יוֹנִ֔ים מִ/בַּ֖עַד לְ/צַמָּתֵ֑/ךְ שַׂעְרֵ/ךְ֙ כְּ/עֵ֣דֶר הָֽ/עִזִּ֔ים שֶׁ/גָּלְשׁ֖וּ מֵ/הַ֥ר גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
translation:
  language: fr
  text: Te voilà belle, mon amour, te voilà belle ! Tes yeux sont des colombes derrière ton voile[a]. Tes cheveux ressemblent à un troupeau de chèvres qui descendent du mont Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « voile » est incertain ; il peut aussi désigner des mèches ou une natte. La préposition peut signifier « derrière », « depuis derrière » ou « à travers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: Te voilà
  rationale: Cette tournure restitue naturellement en français moderne la force présentative et exclamative de la particule hébraïque avec suffixe féminin.
- source_word: יָפָה
  choice: belle
  rationale: Équivalent direct, naturel et actuel de l’adjectif hébreu.
- source_word: רַעְיָתִי
  choice: mon amour
  rationale: Dans le Cantique, ce terme est une adresse affectueuse à la femme aimée. « Mon amour » est naturel, intime et digne, sans réduire le terme au sens plat de « compagne ».
- source_word: עֵינַיִךְ יוֹנִים
  choice: Tes yeux sont des colombes
  rationale: Le texte hébreu juxtapose littéralement « tes yeux, des colombes ». La métaphore directe en conserve la vigueur sans ajouter « comme ».
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: derrière ton voile
  rationale: La préposition évoque une vision à travers ou depuis derrière quelque chose qui dissimule partiellement. « Derrière » donne une formulation fluide, tandis que le nom suivant est probablement un voile, bien que son sens soit discuté.
- source_word: שַׂעְרֵךְ
  choice: Tes cheveux
  rationale: Traduction directe du nom avec suffixe possessif féminin.
- source_word: כְּעֵדֶר הָעִזִּים
  choice: ressemblent à un troupeau de chèvres
  rationale: La comparaison pastorale est explicite en hébreu. « Troupeau » convient naturellement aux chèvres en français.
- source_word: שֶׁגָּלְשׁוּ
  choice: qui dévalent
  rationale: Le verbe décrit un mouvement descendant. « Dévalent » restitue le mouvement visible du troupeau sur le versant et, par image, celui de la chevelure, sans imposer l’idée plus précise de cheveux « ruisselants ».
- source_word: מֵהַר גִּלְעָד
  choice: du mont Galaad
  rationale: Rend directement l’expression géographique « de la montagne de Galaad » dans la forme française biblique usuelle du toponyme.
