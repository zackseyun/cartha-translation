base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/010.yaml
  text: How beautiful your love is[a], my sister, my bride! How much better your love is than wine[b], and the fragrance of your oils than all spices!
translation:
  language: fr
  text: Que ton amour[a] est beau, ma sœur, mon épouse ! Que ton amour est meilleur que le vin, et que le parfum de tes huiles[b] est meilleur que tous les aromates !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes caresses », ici et dans la seconde occurrence ; l’hébreu דֹדַיִךְ peut désigner l’amour exprimé par des gestes d’affection physique.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement d’huiles parfumées ou d’onguents.
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָפוּ
  choice: Qu’il est beau
  rationale: מַה introduit ici une exclamation admirative, et יָפוּ exprime la beauté. Cette tournure française restitue naturellement l’exclamation sans en faire une question.
- source_word: דֹדַיִךְ
  choice: ton amour
  rationale: Le pluriel hébreu דֹדִים peut désigner l’amour ou ses manifestations physiques, notamment les caresses. « Ton amour » conserve la portée relationnelle et poétique sans imposer un degré d’explicitation absent du contexte immédiat.
- source_word: אֲחֹתִי כַלָּה
  choice: ma sœur, ma fiancée
  rationale: Les deux appellations sont conservées séparément. « Ma sœur » est un terme d’affection dans le poème, tandis que « ma fiancée » rend כַלָּה dans son sens nuptial sans les fusionner.
- source_word: מַה טֹבוּ
  choice: Qu’il est meilleur
  rationale: טֹבוּ, suivi de la comparaison introduite par מִן, exprime ici une supériorité. La formulation reprend la structure exclamative du premier hémistiche.
- source_word: מִיַּיִן
  choice: que le vin
  rationale: La préposition מִן marque la comparaison après le comparatif « meilleur ».
- source_word: וְרֵיחַ
  choice: et le parfum
  rationale: רֵיחַ désigne une odeur ou une senteur ; « parfum » convient au contexte positif et poétique.
- source_word: שְׁמָנַיִךְ
  choice: de tes huiles
  rationale: La traduction conserve l’image concrète des huiles, probablement des huiles parfumées ou des onguents dans ce contexte.
- source_word: מִכָּל בְּשָׂמִים
  choice: que tous les aromates
  rationale: בְּשָׂמִים désigne des substances odorantes, notamment des aromates. Le comparatif sous-entendu à partir de טֹבוּ est maintenu en français.
theological_decisions: []
translation_notes:
  register: Français poétique, actuel et digne. L’inversion détachée (« Qu’il est beau, ton amour ») garde l’élan admiratif de l’hébreu. Le parallélisme est préservé, y compris l’adjectif comparatif sous-entendu dans le dernier membre.
