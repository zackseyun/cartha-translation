  source_fidelity: 'La comparaison pastorale, les brebis tondues, le mouvement de remontée après le lavage et l’image de la mise bas de jumeaux sont bien conservés. Toutefois, « n’est privée de ses petits » ne rend pas avec assez de précision שַׁכֻּלָה (« privée d’enfant, endeuillée ») : le texte évoque une brebis qui a perdu son petit, non une privation indéterminée.'
