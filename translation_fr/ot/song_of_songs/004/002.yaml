base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: fr
  text: 'Tes dents sont comme un troupeau de brebis tondues qui remontent du bain : toutes portent des jumeaux[a], et aucune d’elles n’a perdu son petit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image de brebis portant des jumeaux évoque des dents disposées en paires régulières.
    reason: cultural_note
  - marker: b
    text: Ou « aucune d’elles n’est endeuillée ». L’hébreu maintient l’image des brebis plutôt que d’indiquer directement qu’aucune dent ne manque.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: Tes dents
  rationale: Rend directement le nom et le suffixe de deuxième personne féminin, sans ajouter une comparaison à l’ivoire absente de l’hébreu.
- source_word: כְּעֵדֶר הַקְּצוּבוֹת
  choice: comme un troupeau de brebis tondues
  rationale: « Troupeau » convient au petit bétail. « Brebis » explicite naturellement en français les formes féminines qui structurent la suite de l’image, et « tondues » reflète le participe passif.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: qui remontent du bain
  rationale: Conserve le mouvement concret des brebis sortant du lavage tout en employant une formulation française fluide et imagée.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: toutes ont des jumeaux
  rationale: Préserve l’image pastorale et le sens de mise par paires, qui suggère indirectement une dentition complète et régulière.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: et aucune d’elles n’est privée de ses petits
  rationale: Garde la métaphore des brebis et l’idée littérale de privation ou de deuil, sans remplacer explicitement l’image par l’explication qu’aucune dent ne manque.
