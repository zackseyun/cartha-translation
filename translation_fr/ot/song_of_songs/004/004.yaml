  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
translation:
  language: fr
  text: Ton cou est comme la tour de David, bâtie en rangées de pierres[a] ; mille boucliers y sont suspendus, tous les écus des guerriers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « bâtie pour servir d’arsenal », « bâtie avec des créneaux » ou « bâtie par assises ». Le mot hébreu תַּלְפִּיּוֹת est rare, et son sens précis est incertain.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie deux mots différents pour les pièces défensives : מָגֵן, rendu par « boucliers », et שֶׁלֶט, rendu ici par « écus » afin de préserver cette distinction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  choice: comme la tour de David
  rationale: La préposition כְּ marque une comparaison, et l’état construit avec דָּוִיד favorise « la tour de David ». Cette formulation conserve directement l’image architecturale.
- source_word: צַוָּארֵךְ
  choice: ton cou
  rationale: Traduction directe et naturelle de l’image corporelle dans le poème amoureux.
- source_word: בָּנוּי
  choice: bâtie
  rationale: Le participe passif de בנה signifie « construit, bâti ». Le féminin s’accorde en français avec « tour ».
- source_word: לְתַלְפִּיּוֹת
  choice: en rangées de pierres
  rationale: Le mot תַּלְפִּיּוֹת est rare et de sens incertain. Dans ce contexte architectural, « en rangées de pierres » donne une image intelligible sans présenter comme certaine une interprétation militaire spéculative; l’incertitude est signalée en note.
- source_word: אֶלֶף הַמָּגֵן
  choice: mille boucliers
  rationale: Le nom singulier précédé du nombre a une valeur collective. « Boucliers » est le terme français courant et clair.
- source_word: תָּלוּי עָלָיו
  choice: y sont suspendus
  rationale: Cette formulation rend l’état décrit par le participe et rattache naturellement les boucliers à la tour.
- source_word: שִׁלְטֵי
  choice: écus
  rationale: Le texte emploie ici un autre mot que מָגֵן. « Écus » maintient en français cette distinction lexicale sans ajouter au texte l’idée explicite de petite taille.
- source_word: הַגִּבּוֹרִים
  choice: des guerriers
  rationale: גִּבּוֹרִים désigne ici des hommes forts et valeureux dans un cadre martial. « Guerriers » est naturel, actuel et adapté à l’image.
