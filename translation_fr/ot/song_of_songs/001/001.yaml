lexical_decisions:
- source_word: שִׁיר הַשִּׁירִים
  choice: Le Cantique des cantiques
  rationale: Cette formulation conserve la construction hébraïque traditionnelle, un génitif d’excellence qui présente ce cantique comme exceptionnel ou suprême. « Cantique » convient au registre poétique et au titre reconnu du livre.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif introduit naturellement en français la proposition qui relie le cantique à Salomon.
- source_word: לִשְׁלֹמֹה
  choice: est de Salomon
  rationale: La préposition hébraïque לְ peut exprimer la possession, l’auteur, la destination ou une autre forme de rapport. « Est de Salomon » reste naturel tout en évitant d’imposer exclusivement l’idée d’auteur.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Le nom propre est rendu selon sa forme française usuelle.
theological_decisions:
- issue: Nature du lien entre le cantique et Salomon indiqué par לִשְׁלֹמֹה
  choice: qui est de Salomon
  alternative: composé par Salomon ; pour Salomon ; au sujet de Salomon
  rationale: L’hébreu ne précise pas sans ambiguïté s’il s’agit de l’auteur, du destinataire, du sujet ou d’une autre association. La traduction principale maintient cette ouverture interprétative, et la note en expose les principales possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. Le titre traditionnel « Cantique des cantiques » préserve la forme hébraïque, tandis que « qui est de Salomon » garde volontairement l’ambiguïté du rapport exprimé dans le texte source.
