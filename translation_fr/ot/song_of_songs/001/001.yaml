  text: The Song of Songs[b][a], which is Solomon’s.
translation:
  language: fr
  text: Le Cantique des cantiques[b], qui est de Salomon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « composé par Salomon », « pour Salomon » ou « au sujet de Salomon » ; la préposition hébraïque peut exprimer plusieurs sortes de liens.
    reason: alternative_reading
  - marker: b
    text: Littéralement « Cantique des cantiques » en hébreu, une tournure superlative désignant un cantique exceptionnel ou le plus grand des cantiques.
