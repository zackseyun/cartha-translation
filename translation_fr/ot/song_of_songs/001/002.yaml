  text: Let him kiss me with the kisses of his mouth[a], for your love is better than wine.
translation:
  language: fr
  text: Qu’il me donne des baisers de sa bouche ! Car tes caresses[a] sont meilleures que le vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton amour est meilleur que le vin ». Le pluriel hébreu דֹּדֶיךָ peut désigner l’amour ou, plus concrètement, ses manifestations, telles que les caresses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁקֵנִי
  choice: Qu’il me couvre de baisers
  rationale: L’imparfait qal à valeur volitive exprime ici un désir. « Qu’il… » le rend naturellement en français ; « couvre de baisers » traduit idiomatiquement la construction avec מִן tout en conservant l’image concrète.
- source_word: מִנְּשִׁיקוֹת פִּיהוּ
  choice: des baisers de sa bouche
  rationale: La formulation garde la sensualité concrète du texte hébreu sans l’atténuer. Dans cette construction, מִן se rend naturellement par « de » après « couvrir ».
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison du souhait précédent et conserve clairement le lien causal.
- source_word: דֹּדֶיךָ
  choice: tes caresses
  rationale: Le pluriel דֹּדֶיךָ peut désigner des manifestations concrètes de l’amour ou des caresses. Dans ce contexte sensuel, « tes caresses » préserve le pluriel et la force concrète du terme.
- source_word: טוֹבִים ... מִיָּיִן
  choice: sont meilleures que le vin
  rationale: 'Le pluriel s’accorde avec « caresses », tandis que מִן après טוֹב exprime naturellement la comparaison : « meilleures que ».'
