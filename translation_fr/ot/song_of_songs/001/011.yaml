  text: We will make for you ornaments of gold[b][a], with studs of silver.
translation:
  language: fr
  text: Nous te ferons des ornements en or[a], rehaussés de points d’argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des chaînes en or » ou « des rangées d’or » ; le terme hébreu désigne probablement une sorte de parure, mais sa forme exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « de perles d’argent » ou « de paillettes d’argent » ; l’hébreu désigne de petits éléments décoratifs en argent.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרֵי
  choice: ornements
  rationale: Le terme désigne ici des éléments de parure, mais leur forme exacte demeure incertaine. « Ornements » rend le contexte joaillier sans imposer « chaînes », « rangées » ou « bandeaux ».
- source_word: זָהָב
  choice: or
  rationale: Désignation courante du métal dont les ornements sont faits.
- source_word: נַעֲשֶׂה
  choice: nous te ferons
  rationale: L’imparfait qal à la première personne du pluriel exprime naturellement ici une promesse ou une intention future. La tournure française intègre le complément לָךְ de façon idiomatique.
- source_word: לָּךְ
  choice: te
  rationale: La préposition avec suffixe féminin singulier indique que les parures sont destinées à la femme à qui l’on parle.
- source_word: עִם
  choice: rehaussés de
  rationale: Dans cette description de joaillerie, cette formulation naturelle exprime l’association des ornements d’or et des petits éléments décoratifs en argent, sans préciser indûment leur technique d’assemblage.
- source_word: נְקֻדּוֹת
  choice: points
  rationale: Le nom évoque de petits éléments ou motifs ponctuels. « Points » conserve l’image et l’indétermination du terme hébreu mieux qu’un objet technique précis.
- source_word: הַכָּסֶף
  choice: argent
  rationale: Désignation courante du métal employé pour les petits éléments décoratifs.
theological_decisions: []
