base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
translation:
  language: fr
  text: Si tu ne sais pas[a], toi, la plus belle des femmes, sors sur les traces du troupeau[b] et fais paître tes chevreaux près des tentes des bergers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne précise pas ce qu’elle ne sait pas; le contexte suggère qu’il s’agit de savoir où aller ou comment trouver celui qu’elle cherche.
    reason: ambiguïté_contextuelle
  - marker: b
    text: 'Ou : « en suivant le troupeau ». Littéralement : « dans les traces (ou les pas) du troupeau ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: אִם לֹא תֵדְעִי לָךְ
  choice: Si tu ne le sais pas
  rationale: La proposition conditionnelle est conservée directement. Le verbe ידע signifie ici « savoir », tandis que son objet reste implicite en hébreu. Le pronom « le », nécessaire à une formulation française naturelle, renvoie sans en préciser davantage le contenu à ce qu’elle cherche à savoir. Le datif לָךְ apporte une nuance personnelle difficile à isoler sans alourdir la phrase.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: toi, la plus belle des femmes
  rationale: L’adjectif suivi de ב au sein d’un groupe exprime ici une valeur superlative. La tournure vocative avec « toi » est actuelle, naturelle et digne.
- source_word: צְאִי לָךְ
  choice: sors
  rationale: L’impératif féminin de יצא signifie « sortir ». Le datif לָךְ renforce l’implication personnelle du sujet, mais une traduction littérale comme « sors pour toi-même » serait peu naturelle en français.
- source_word: בְּעִקְבֵי הַצֹּאן
  choice: sur les traces du troupeau
  rationale: עִקְבֵי évoque concrètement les empreintes, les pas ou les talons. « Sur les traces » préserve cette image pastorale tout en étant idiomatique en français.
- source_word: וּרְעִי אֶת גְּדִיֹּתַיִךְ
  choice: et fais paître tes chevreaux
  rationale: Le verbe רעה désigne ici l’action de mener les bêtes au pâturage. גְּדִיֹּתַיִךְ désigne de jeunes chèvres; « chevreaux » est précis et courant.
- source_word: עַל מִשְׁכְּנוֹת הָרֹעִים
  choice: près des tentes des bergers
  rationale: Dans ce cadre pastoral, מִשְׁכְּנוֹת désigne les habitations mobiles des bergers, donc leurs tentes. עַל exprime ici la proximité spatiale, rendue naturellement par « près de ».
