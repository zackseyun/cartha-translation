  text: הִנְּ/ךָ֨ יָפֶ֤ה דוֹדִ/י֙ אַ֣ף נָעִ֔ים אַף עַרְשֵׂ֖/נוּ רַעֲנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/016.yaml
  text: Look[a], you are beautiful, my beloved—indeed, pleasant! Indeed, our couch is luxuriant.
translation:
  language: fr
  text: Que tu es beau, mon bien-aimé, et charmant ! Notre couche aussi est verdoyante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fraîche » ou « luxuriante ». L’adjectif hébreu évoque la fraîcheur et la verdeur, probablement dans un cadre naturel luxuriant.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: Que tu es
  rationale: La particule déictique et exclamative attire vivement l’attention sur l’être aimé. En français poétique actuel, la tournure exclamative « Que tu es… » rend cet élan plus naturellement que « Voici, tu es ».
- source_word: יָפֶה
  choice: beau
  rationale: L’adjectif exprime la beauté et l’attrait. Le masculin « beau » convient à l’homme auquel la locutrice s’adresse.
- source_word: דוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, le terme désigne l’amant aimé. « Mon bien-aimé » conserve sa valeur affective et son registre poétique sans être familier.
- source_word: אַף
  choice: que… / Même
  rationale: La particule a une force emphatique ou additive. Dans le premier emploi, l’exclamation coordonnée « que tu es charmant » en transmet naturellement l’intensité ; dans le second, « même » maintient l’ajout emphatique concernant la couche.
- source_word: נָעִים
  choice: charmant
  rationale: Le mot évoque ce qui est agréable, plaisant et plein de charme. « Charmant » s’applique naturellement à la personne aimée et se distingue de « beau ».
- source_word: עַרְשֵׂנוּ
  choice: notre couche
  rationale: Le nom peut désigner un lit, une couche ou un lieu de repos. « Couche » conserve l’image intime et poétique sans la préciser davantage.
- source_word: רַעֲנָנָה
  choice: verdoyante
  rationale: L’adjectif évoque la fraîcheur, la verdeur et une végétation florissante. « Verdoyante » garde l’image concrète et suggère un cadre naturel luxuriant.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La double exclamation restitue l’élan amoureux ; « couche » et « verdoyante » préservent l’image suggestive et son possible cadre végétal sans en résoudre l’ambiguïté.
