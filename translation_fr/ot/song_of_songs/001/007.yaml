  text: הַגִּ֣ידָ/ה לִּ֗/י שֶׁ֤/אָהֲבָה֙ נַפְשִׁ֔/י אֵיכָ֣ה תִרְעֶ֔ה אֵיכָ֖ה תַּרְבִּ֣יץ בַּֽ/צָּהֳרָ֑יִם שַׁ/לָּ/מָ֤ה אֶֽהְיֶה֙ כְּ/עֹ֣טְיָ֔ה עַ֖ל עֶדְרֵ֥י חֲבֵרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
translation:
  language: fr
  text: Dis-moi, toi que mon âme aime, où tu fais paître ton troupeau, où tu le fais reposer à midi. Pourquoi serais-je comme une femme voilée[a] près des troupeaux de tes compagnons ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme une femme qui erre » près des troupeaux de tes compagnons. L’expression hébraïque peut désigner une femme qui se voile ou, selon une interprétation liée au contexte, une femme qui va çà et là à la recherche de son bien-aimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Dis-moi
  rationale: L’impératif de נגד suivi du pronom de première personne appelle une demande directe. « Dis-moi » est naturel, actuel et fidèle.
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  choice: toi que mon âme aime
  rationale: Cette formulation conserve l’image poétique de נֶפֶשׁ, qui désigne l’âme, la personne ou la vie, sans la réduire au simple « que j’aime ».
- source_word: אֵיכָה
  choice: où
  rationale: Dans le parallélisme pastoral, l’interrogatif porte naturellement sur le lieu où le troupeau paît et se repose.
- source_word: תִרְעֶה
  choice: tu fais paître ton troupeau
  rationale: רעה signifie faire paître, prendre soin ou agir en berger. L’objet « ton troupeau », implicite dans l’hébreu, est explicité pour la clarté en français.
- source_word: תַּרְבִּיץ
  choice: tu le fais reposer
  rationale: Le hifil de רבץ exprime l’action de faire se coucher ou se reposer. Le pronom singulier reprend le nom collectif « troupeau ».
- source_word: בַּצָּהֳרָיִם
  choice: à midi
  rationale: Traduction directe et idiomatique de l’indication temporelle.
- source_word: שַׁלָּמָה אֶהְיֶה
  choice: Pourquoi serais-je
  rationale: La question rhétorique exprime une situation éventuelle et explique la demande précédente. Le conditionnel français rend naturellement cette nuance.
- source_word: כְּעֹטְיָה
  choice: comme une femme voilée
  rationale: Le participe féminin est probablement lié à עטה, « se couvrir, se voiler ». Cette lecture lexicalement solide est retenue dans le texte, tandis que l’interprétation contextuelle « une femme qui erre » est signalée en note.
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  choice: près des troupeaux de tes compagnons
  rationale: עַל reçoit ici un sens spatial, et חֲבֵרֶיךָ désigne les compagnons ou associés masculins de l’être aimé.
