  text: My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi[a].
translation:
  language: fr
  text: Mon bien-aimé est pour moi une grappe de fleurs de henné dans les vignes d’En-Guédi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « troène » ; le terme hébreu כֹּפֶר a été traditionnellement rendu ainsi, mais il désigne très probablement le henné, apprécié pour ses fleurs parfumées.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁכֹּל
  choice: une grappe
  rationale: Le nom désigne une grappe ou un bouquet compact. « Grappe » conserve l’image concrète et convient à un ensemble de fleurs.
- source_word: הַכֹּפֶר
  choice: de fleurs de henné
  rationale: Le terme désigne très probablement le henné (Lawsonia inermis), apprécié notamment pour ses fleurs parfumées. L’ajout de « fleurs » explicite naturellement l’image florale suggérée par « grappe ».
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, le mot désigne le partenaire masculin aimé. « Bien-aimé » garde un ton poétique digne tout en restant courant.
- source_word: לִי
  choice: est pour moi
  rationale: La préposition exprime ici une relation ou une appréciation personnelle. « Est pour moi » reproduit cette construction sans en préciser excessivement le sens.
- source_word: בְּכַרְמֵי
  choice: dans les vignes
  rationale: La préposition בְּ et le pluriel construit de כֶּרֶם donnent naturellement ce sens locatif; « vignes » est plus idiomatique ici que « vignobles ».
- source_word: עֵין גֶּדִי
  choice: En-Guédi
  rationale: Le nom de lieu est translittéré selon une forme française biblique claire et courante.
