base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/003.yaml
  text: The fragrance of your oils is pleasing[a]; your name is oil poured out[b]; therefore young women love you.
translation:
  language: fr
  text: Le parfum de tes huiles est agréable[a] ; ton nom est comme une huile répandue ; c’est pourquoi les jeunes femmes[b] t’aiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car le parfum de tes huiles est bon. » La syntaxe hébraïque est condensée et très poétique.'
    reason: alternative_reading
  - marker: b
    text: L’expression « jeunes femmes » traduit un mot hébreu qui peut aussi se rendre par « jeunes filles ». La traduction « vierges » est possible dans certains contextes, mais elle est ici plus précise que le terme hébreu lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֵיחַ שְׁמָנֶיךָ טוֹבִים
  choice: Le parfum de tes huiles est agréable
  rationale: רֵיחַ désigne l’odeur ou le parfum, et שְׁמָנֶיךָ des huiles, probablement parfumées. Cette formulation française naturelle conserve l’image concrète et la syntaxe poétique centrée sur le parfum, tout en rendant l’évaluation positive de טוֹבִים.
- source_word: שֶׁמֶן תּוּרַק שְׁמֶךָ
  choice: ton nom est une huile répandue
  rationale: La métaphore associe explicitement le nom, donc la renommée et la personne, à une huile que l’on répand. « Répandue » restitue le passif de תּוּרַק et suggère naturellement la diffusion de son parfum.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution exprime clairement en français courant la conséquence indiquée par l’hébreu.
- source_word: עֲלָמוֹת
  choice: les jeunes femmes
  rationale: Le terme désigne des femmes jeunes, en âge de se marier, sans imposer à lui seul la précision « vierges ». « Jeunes femmes » est exact, moderne et non surinterprétatif.
- source_word: אֲהֵבוּךָ
  choice: t’aiment
  rationale: Le parfait poétique exprime ici naturellement un état ou une vérité constatée ; le présent français convient au contexte.
theological_decisions:
- issue: Degré de précision de עֲלָמוֹת
  choice: jeunes femmes
  alternative: vierges
  rationale: Le texte évoque la jeunesse féminine sans exiger explicitement une affirmation technique de virginité ; il convient de ne pas rendre le terme plus spécifique qu’il ne l’est.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme, l’image de l’huile et la relation logique entre les propositions sont préservés sans archaïsme.
