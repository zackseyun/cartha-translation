  text: אַל תִּרְא֨וּ/נִי֙ שֶׁ/אֲנִ֣י שְׁחַרְחֹ֔רֶת שֶׁ/שֱּׁזָפַ֖תְ/נִי הַ/שָּׁ֑מֶשׁ בְּנֵ֧י אִמִּ֣/י נִֽחֲרוּ בִ֗/י שָׂמֻ֨/נִי֙ נֹטֵרָ֣ה אֶת הַ/כְּרָמִ֔ים כַּרְמִ֥/י שֶׁ/לִּ֖/י לֹ֥א נָטָֽרְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
translation:
  language: fr
  text: Ne me dévisagez pas parce que j’ai la peau sombre[a], parce que le soleil m’a brûlé la peau[b]. Les fils de ma mère[c] se sont mis en colère contre moi ; ils m’ont chargée de garder les vignes. Ma propre vigne[d], je ne l’ai pas gardée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce que je suis noire » ; l’adjectif hébreu peut recevoir cette traduction plus littérale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « parce que le soleil m’a brûlée » ; le verbe évoque l’effet brûlant et assombrissant du soleil.
    reason: lexical_alternative
  - marker: c
    text: Cette expression peut désigner ses frères, mais l’hébreu dit précisément « les fils de ma mère ».
    reason: lexical_alternative
  - marker: d
    text: « Ma propre vigne » a vraisemblablement une portée métaphorique, mais l’hébreu n’en précise pas le référent.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  choice: Ne me dévisagez pas
  rationale: Le verbe signifie littéralement « regarder », mais le contexte évoque un regard insistant porté sur son apparence. « Dévisager » rend naturellement cette nuance de regard scrutateur.
- source_word: שְׁחַרְחֹרֶת
  choice: j’ai la peau sombre
  rationale: L’adjectif décrit ici une apparence ou un teint foncé. Cette formulation française est claire et évite de transformer inutilement la description en désignation ethnique.
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  choice: parce que le soleil m’a brûlée
  rationale: Le verbe exprime l’effet brûlant du soleil. « M’a brûlée » conserve la vigueur de l’image et explique le teint assombri sans réduire l’expression à un simple bronzage.
- source_word: בְּנֵי אִמִּי
  choice: Les fils de ma mère
  rationale: Cette traduction reproduit la formulation précise de l’hébreu et en préserve la possible nuance de distance familiale, plutôt que de la remplacer par « mes frères ».
- source_word: נִחֲרוּ בִי
  choice: se sont irrités contre moi
  rationale: Le verbe évoque une colère qui s’enflamme. « Se sont irrités contre moi » est idiomatique en français tout en gardant une certaine intensité.
- source_word: שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים
  choice: ils m’ont chargée de garder les vignes
  rationale: Le participe féminin désigne celle qui garde ou surveille. La formulation exprime clairement la tâche imposée à la locutrice.
- source_word: כַּרְמִי שֶׁלִּי
  choice: Ma propre vigne
  rationale: Le double marquage possessif de l’hébreu met l’appartenance en relief ; « ma propre vigne » rend cette insistance naturellement.
- source_word: לֹא נָטָרְתִּי
  choice: je ne l’ai pas gardée
  rationale: La répétition de « garder » maintient le lien lexical avec la garde des autres vignes et laisse ouverte la portée métaphorique de l’image.
theological_decisions:
- issue: Portée métaphorique de « ma propre vigne »
  choice: Conserver littéralement l’image de la vigne sans en préciser le référent dans le texte principal.
  alternative: Interpréter explicitement la vigne comme son corps, son apparence, sa vie personnelle ou sa chasteté.
  rationale: Le caractère métaphorique est probable, mais l’hébreu n’identifie pas précisément le référent. La traduction préserve donc l’ambiguïté poétique et théologique.
translation_notes:
  register: Français international moderne, poétique et digne. Les accords féminins rendent explicite le genre de la locutrice déjà marqué en hébreu. La reprise du verbe « garder » préserve le jeu lexical du verset.
