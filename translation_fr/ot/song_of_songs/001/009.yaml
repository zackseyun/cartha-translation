translation_notes:
  register: Formulation poétique mais immédiatement compréhensible en français international moderne. L’ordre de la phrase place d’abord l’acte de comparaison, comme dans un énoncé amoureux naturel, tout en conservant les éléments précis de l’image hébraïque.
