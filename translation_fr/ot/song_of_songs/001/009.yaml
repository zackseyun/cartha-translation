  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
translation:
  language: fr
  text: Je te compare, ma bien-aimée, à ma jument parmi les chars du pharaon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסֻסָתִי
  choice: à ma jument
  rationale: Le nom סוּסָה est féminin singulier et désigne une jument; le suffixe de première personne est rendu explicitement par « ma ». Cette traduction préserve à la fois le genre marqué de l’animal et la forme possessive de l’hébreu.
- source_word: בְּרִכְבֵי פַרְעֹה
  choice: parmi les chars du pharaon
  rationale: La préposition בְּ peut exprimer ici la situation ou l’association. « Parmi » restitue naturellement l’image de la jument au milieu des chars royaux sans ajouter qu’elle y serait attelée. En français courant, le titre est écrit avec une minuscule.
- source_word: דִּמִּיתִיךְ
  choice: Je te compare
  rationale: Le piel accompli de דמה avec suffixe féminin signifie « je t’ai comparée / je te compare ». Le présent convient au discours poétique direct et reste naturel en français.
- source_word: רַעְיָתִי
  choice: ma bien-aimée
  rationale: Dans le Cantique, ce terme sert d’adresse affectueuse à la femme aimée. « Ma bien-aimée » conserve le registre amoureux, poétique et digne, tout en indiquant clairement le féminin.
