  text: Your cheeks are lovely with ornaments[b][a], your neck with strings of jewels.
translation:
  language: fr
  text: Tes joues sont belles, parées de rangées d’ornements[a], ton cou de colliers de perles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de rangées » ; le terme hébreu désigne probablement des rangées ou des arrangements d’ornements, mais le type exact de parure reste incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « de perles enfilées » ; l’hébreu évoque des ornements enfilés, qui peuvent former des colliers.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאווּ
  choice: sont ravissantes
  rationale: Le verbe exprime ici la beauté ou l'élégance. « Sont ravissantes » rend naturellement la louange poétique en français moderne.
- source_word: לְחָיַיִךְ
  choice: tes joues
  rationale: לְחָיַיִךְ désigne les joues ou la région des joues et de la mâchoire ; « tes joues » convient le mieux à cette description poétique.
- source_word: בַּתֹּרִים
  choice: au milieu des rangées de parures
  rationale: Dans ce contexte, le terme évoque vraisemblablement des rangées ou arrangements d'ornements. La formulation garde l'idée de disposition tout en explicitant le référent probable.
- source_word: צַוָּארֵךְ
  choice: ton cou
  rationale: Équivalent anatomique direct et naturel.
- source_word: בַּחֲרוּזִים
  choice: au milieu des colliers de perles
  rationale: Le mot désigne des éléments enfilés, probablement des perles ou ornements formant des colliers. Cette traduction conserve l'image concrète sans imposer la valeur de pierres précieuses.
