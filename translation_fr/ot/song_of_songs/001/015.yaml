lexical_decisions:
- source_word: הִנָּךְ
  choice: Que tu es
  rationale: La particule déictique et exclamative avec suffixe féminin attire vivement l’attention sur l’interlocutrice. En français poétique actuel, « Que tu es… ! » rend naturellement cette admiration directe, sans l’archaïsme de « Voici ».
- source_word: יָפָה
  choice: belle
  rationale: L’adjectif exprime la beauté et l’attrait ; « belle » est l’équivalent français le plus direct et naturel.
- source_word: רַעְיָתִי
  choice: mon amour
  rationale: Dans le Cantique, ce terme sert d’adresse affectueuse à la femme aimée. « Mon amour » est intime, naturel en français moderne et conserve sa valeur vocative.
- source_word: הִנָּךְ יָפָה
  choice: Que tu es belle
  rationale: La formule est répétée intégralement afin de préserver l’insistance et le parallélisme poétiques de l’hébreu.
- source_word: עֵינַיִךְ
  choice: tes yeux
  rationale: Rendu direct du nom duel muni du suffixe féminin singulier.
- source_word: יוֹנִים
  choice: des colombes
  rationale: 'L’hébreu emploie une métaphore nominale concise : « tes yeux [sont] des colombes ». Le français peut conserver cette image directe sans ajouter « comme » dans le texte principal.'
