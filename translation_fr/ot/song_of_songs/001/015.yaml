  language: fr
  text: Que tu es belle, mon amour ! Que tu es belle ! Tes yeux sont des colombes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Tes yeux sont comme des colombes ». L’hébreu exprime l’image de façon concise : « Tes yeux sont des colombes ».'
