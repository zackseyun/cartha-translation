base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
translation:
  language: fr
  text: 'Je suis noire[a], et pourtant belle,

    filles de Jérusalem,

    comme les tentes de Qédar,

    comme les tentures de Salomon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je suis noire et belle ». En hébreu, la conjonction signifie simplement « et » ; « et pourtant » exprime le contraste probablement sous-entendu par le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁחוֹרָה
  choice: sombre
  rationale: L’adjectif décrit une couleur foncée. « Sombre » convient naturellement à la complexion sans préciser une origine ethnique ni imposer l’absolu de « noire ».
- source_word: וְנָאוָה
  choice: et pourtant belle
  rationale: La conjonction signifie formellement « et », mais le contexte poétique suggère probablement un contraste. « Et pourtant belle » le rend en français naturel, tandis que la coordination simple est conservée en note.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: filles de Jérusalem
  rationale: La traduction directe préserve l’adresse poétique et l’image féminine du pluriel hébreu, sans interpréter les destinataires comme de simples « jeunes femmes ».
- source_word: כְּאָהֳלֵי קֵדָר
  choice: comme les tentes de Qédar
  rationale: Cette traduction directe conserve la comparaison et le nom propre. Les tentes nomades de Qédar évoquent vraisemblablement une toile sombre, sans qu’il soit nécessaire d’expliciter cette donnée dans le texte.
- source_word: כִּירִיעוֹת שְׁלֹמֹה
  choice: comme les tentures de Salomon
  rationale: יְרִיעוֹת désigne des pans de tissu, rideaux ou toiles de tente. « Tentures » est ici clair, poétique et assez large pour préserver la nature exacte de ces étoffes.
theological_decisions:
- issue: Valeur de la conjonction ו devant נָאוָה
  choice: 'Nuance adversative : « et pourtant belle »'
  alternative: 'Coordination simple : « sombre et belle »'
  rationale: L’hébreu emploie la conjonction ordinaire « et » et ne marque pas explicitement l’opposition. Le contexte permet toutefois d’entendre une réponse à un jugement défavorable sur la couleur de la locutrice. La traduction principale exprime ce contraste probable, et la note conserve la lecture formelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du vers est maintenu sur quatre lignes. « Qédar » suit la forme française usuelle du nom biblique ; « tentures » conserve l’élégance de l’image sans déterminer excessivement la fonction des étoffes.
