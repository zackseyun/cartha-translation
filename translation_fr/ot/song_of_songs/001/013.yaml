  text: צְר֨וֹר הַ/מֹּ֤ר דּוֹדִ/י֙ לִ֔/י בֵּ֥ין שָׁדַ֖/י יָלִֽין׀׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/013.yaml
  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
translation:
  language: fr
  text: Mon bien-aimé est pour moi un sachet de myrrhe[a] ; il passe la nuit entre mes seins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un petit paquet de myrrhe ». Le mot hébreu désigne un petit paquet ou ballot enveloppé ; « sachet » rend ici l’idée d’un parfum que l’on porte sur soi.
    reason: lexical_alternative
  - marker: b
    text: Ou « il loge entre mes seins ». Le verbe hébreu peut désigner le fait de loger ou de passer la nuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: sachet
  rationale: Le nom désigne un petit paquet ou ballot enveloppé. Avec la myrrhe et dans cette image corporelle, « sachet » évoque naturellement un petit contenant parfumé porté sur soi.
- source_word: הַמֹּר
  choice: myrrhe
  rationale: C’est le terme français courant et précis pour la résine aromatique évoquée par le texte.
- source_word: דּוֹדִי
  choice: mon bien-aimé
  rationale: Dans le Cantique, le mot désigne l’homme aimé dans un registre intime et poétique ; « bien-aimé » conserve ce ton sans atténuer l’affection.
- source_word: לִי
  choice: pour moi
  rationale: Cette tournure exprime naturellement en français la relation et la valeur personnelles indiquées par la préposition.
- source_word: בֵּין
  choice: entre
  rationale: Le sens spatial concret de la préposition convient à l’image corporelle.
- source_word: שָׁדַי
  choice: mes seins
  rationale: L’hébreu nomme explicitement les seins ; cette traduction évite l’euphémisme et conserve la précision de l’image.
- source_word: יָלִין
  choice: il passe la nuit
  rationale: Le verbe לין signifie loger ou passer la nuit. Cette formulation conserve la nuance nocturne et l’intimité de l’image ; le masculin permet de maintenir la référence au bien-aimé à travers la métaphore.
