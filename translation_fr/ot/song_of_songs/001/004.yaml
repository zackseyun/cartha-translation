review_pass:
  verdict: revise
  source_fidelity: Le texte conserve bien la succession des personnes (singulier « moi », puis pluriel exhortatif) et ne force aucune lecture allégorique du « roi ». Toutefois, « à cause de toi » explicite la relation causale là où בָּךְ garde une expression plus directe de la joie centrée sur l’être aimé. La note a doit aussi maintenir « plus que le vin » dans chacune des options, car la comparaison appartient à la proposition entière.
  naturalness: « Soyons dans l’allégresse à cause de toi » est compréhensible, mais un peu lourd et explicatif. « Réjouissons-nous et exultons en toi » est à la fois poétique, moderne et plus proche du parallélisme hébreu. « Entraîne-moi à ta suite ; courons ! » est naturel et conserve l’élan du texte.
  terminology: « Appartements » rend bien חֲדָרָיו dans un registre poétique sans sexualiser indûment le terme. « Caresses » est une bonne traduction contextuelle de דֹדֶיךָ. « C’est à juste titre qu’on t’aime » préserve correctement la lecture adverbiale de מֵישָׁרִים; l’alternative substantive doit rester en note.
  issues:
  - severity: low
    issue: Rendu de בָּךְ par « à cause de toi »
    rationale: Cette formulation est possible, mais elle explicite une causalité qui n’est pas requise. « En toi » conserve mieux la concision et la focalisation personnelle de l’hébreu.
  - severity: low
    issue: Portée inégale de la comparaison dans la note a
    rationale: Les deux premières variantes de la note omettent « plus que le vin », pourtant présent dans l’hébreu et dans le texte principal.
  - severity: low
    issue: Style de la paire de cohortatifs
    rationale: « Réjouissons-nous et exultons » rend plus directement les deux verbes parallèles que « Réjouissons-nous, soyons dans l’allégresse ».
