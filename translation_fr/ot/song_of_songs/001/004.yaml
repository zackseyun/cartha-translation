source:
  edition: WLC
  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
translation:
  language: fr
  text: Entraîne-moi à ta suite ; courons ! Le roi m’a fait entrer dans ses appartements. Réjouissons-nous et exultons en toi ! Célébrons tes caresses plus que le vin[a] ! C’est à juste titre qu’on t’aime[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Souvenons-nous de tes caresses plus que le vin », « racontons tes caresses plus que le vin » ou « évoquons tes caresses plus que le vin ».
    reason: Le verbe נַזְכִּירָה peut signifier se souvenir, mentionner, raconter ou, dans ce contexte, célébrer.
  - marker: b
    text: Ou « Les personnes droites t’aiment ». Le mot hébreu מֵישָׁרִים peut être compris comme un adverbe (« à juste titre ») ou comme un substantif désignant les personnes droites.
    reason: La syntaxe hébraïque permet une lecture adverbiale ou substantive.
lexical_decisions:
- source_word: מָשְׁכֵנִי אַחֲרֶיךָ נָּרוּצָה
  choice: Entraîne-moi à ta suite, courons !
  rationale: « Entraîne-moi » exprime naturellement l’idée d’attirer ou de tirer à sa suite. Le passage du singulier (« moi ») au pluriel (« courons ») est conservé, de même que la valeur exhortative du cohortatif.
- source_word: הֱבִיאַנִי הַמֶּלֶךְ חֲדָרָיו
  choice: Le roi m’a fait entrer dans ses appartements
  rationale: Le parfait est rendu comme une action accomplie. « Appartements » désigne ici les pièces privées ou intérieures du roi et garde la dignité poétique sans suggérer nécessairement une chambre à coucher unique.
- source_word: נָגִילָה וְנִשְׂמְחָה בָּךְ
  choice: Réjouissons-nous, soyons dans l’allégresse à cause de toi !
  rationale: Les deux cohortatifs sont rendus par des exhortations parallèles. « À cause de toi » exprime idiomatiquement la personne qui suscite cette joie, là où un calque comme « en toi » serait moins naturel en français dans ce contexte amoureux.
- source_word: נַזְכִּירָה דֹדֶיךָ מִיַּיִן
  choice: Célébrons tes caresses plus que le vin
  rationale: Le verbe זכר signifie fondamentalement se souvenir ou faire mention, mais peut ici évoquer une célébration verbale. « Tes caresses » rend le pluriel דֹדֶיךָ, qui désigne les manifestations concrètes de l’amour érotique, tandis que « plus que le vin » conserve la comparaison concise de l’hébreu.
- source_word: מֵישָׁרִים אֲהֵבוּךָ
  choice: C’est à juste titre qu’on t’aime
  rationale: מֵישָׁרִים est pris adverbialement au sens de « justement, à bon droit ». Le pronom français « on » rend naturellement le sujet pluriel indéfini du verbe sans lui attribuer une identité absente du texte.
theological_decisions:
- issue: Identité du « roi »
  choice: Conserver le roi comme personnage littéraire du poème sans identification explicite.
  alternative: Y voir directement Dieu ou le Messie.
  rationale: Le verset ne donne pas lui-même d’identification divine ou messianique non équivoque ; la traduction ne doit donc pas imposer une lecture allégorique particulière.
- issue: Sens de מֵישָׁרִים dans la dernière proposition
  choice: 'Lecture adverbiale : « à juste titre ».'
  alternative: 'Lecture substantive : « les gens droits t’aiment ».'
  rationale: Les deux analyses sont grammaticalement possibles. La lecture adverbiale s’intègre bien à la louange amoureuse, tandis que l’autre est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique et accessible. Le tutoiement convient à l’adresse amoureuse directe. Les impératifs exhortatifs rendent les cohortatifs hébreux, et les exclamations soutiennent l’élan lyrique sans ajouter d’interprétation confessionnelle.
