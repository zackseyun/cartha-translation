  text: The beams of our house are cedars[c][b][a]; our rafters are cypresses.
translation:
  language: fr
  text: Les poutres de notre maison[a] sont des cèdres ; nos solives[b], des cyprès[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « nos maisons » ; la forme hébraïque est plurielle, mais elle peut avoir un sens collectif : « notre maison » ou « notre demeure ».'
    reason: lexical_alternative
  - marker: b
    text: Le sens du terme hébreu traduit par « solives » est incertain ; il pourrait aussi désigner des lambris ou des galeries.
    reason: lexical_alternative
  - marker: c
    text: Ou « genévriers » ou « sapins » ; l’espèce exacte de l’arbre est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרוֹת
  choice: poutres
  rationale: Le terme désigne des pièces de bois structurelles, notamment les poutres d’un toit. « Poutres » est naturel en français et convient au parallélisme architectural.
- source_word: בָּתֵּינוּ
  choice: notre maison
  rationale: La forme hébraïque est morphologiquement plurielle, mais peut avoir ici un sens collectif et désigner la demeure commune des deux amoureux. Le singulier donne en français une expression naturelle, sans masquer l’autre possibilité, signalée en note.
- source_word: אֲרָזִים
  choice: cèdres
  rationale: Le pluriel désigne des cèdres ou du bois de cèdre employé dans la construction. La formulation nominale conserve l’image poétique.
- source_word: רַחִיטֵנוּ
  choice: nos solives
  rationale: Le sens précis du terme est incertain. Dans ce contexte architectural et en parallèle avec « poutres », « solives » évoque naturellement les éléments de charpente, tandis que les autres interprétations sont conservées en note.
- source_word: בְּרוֹתִים
  choice: cyprès
  rationale: L’identification botanique est discutée. « Cyprès » est une traduction courante dans les contextes de construction et forme un parallèle naturel avec les cèdres.
