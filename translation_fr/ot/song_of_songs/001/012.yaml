source:
  edition: WLC
  text: עַד שֶׁ֤/הַ/מֶּ֨לֶךְ֙ בִּ/מְסִבּ֔/וֹ נִרְדִּ֖/י נָתַ֥ן רֵיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/012.yaml
  text: While the king was at his table[b][a], my nard gave its fragrance.
translation:
  language: fr
  text: Tandis que le roi est à sa table[a], mon nard répand son parfum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son banquet » ou « sur son divan ». Le terme hébreu peut désigner plus largement le cadre d’un banquet ou un groupe de convives étendus pour manger.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: Tandis que
  rationale: Dans ce vers poétique, עַד introduit vraisemblablement la circonstance temporelle de l’action. « Tandis que » est naturel en français et préserve ce rapport sans imposer le sens terminatif « jusqu’à ce que ».
- source_word: שֶׁהַמֶּלֶךְ
  choice: le roi
  rationale: Le groupe nominal défini désigne le bien-aimé dans l’imagerie du poème. La minuscule évite d’introduire une interprétation messianique ou théologique que l’hébreu n’exige pas.
- source_word: בִּמְסִבּוֹ
  choice: à sa table
  rationale: מְסִבָּה peut évoquer la table, le banquet ou la place où l’on est étendu pour manger. « À sa table » est idiomatique et concret, tout en laissant les autres possibilités en note.
- source_word: נִרְדִּי
  choice: mon nard
  rationale: Le mot désigne le nard, plante aromatique ou parfum qui en est tiré. « Nard » est le terme français précis, et le suffixe possessif est rendu par « mon ».
- source_word: נָתַן
  choice: répand
  rationale: Le verbe signifie littéralement « donner ». Avec un parfum pour complément, « répand son parfum » exprime naturellement en français l’idiome hébreu sans modifier l’image.
- source_word: רֵיחוֹ
  choice: son parfum
  rationale: Le suffixe renvoie au nard. « Parfum » convient au contexte sensoriel positif et produit une formulation française naturelle.
theological_decisions:
- issue: Faut-il présenter « le roi » comme un titre messianique ou théologique ?
  choice: « le roi » avec une minuscule, comme référent littéraire dans le Cantique
  alternative: « le Roi » avec une majuscule pour suggérer une lecture théologique ou typologique
  rationale: L’hébreu ne signale pas ici un titre divin ou messianique. La traduction conserve donc le sens littéraire immédiat sans imposer une interprétation allégorique.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La tournure « répand son parfum » restitue avec naturel l’idiome hébreu « donne son odeur ». Aucun marqueur distinct n’est nécessaire pour « nard », terme français exact et usuel dans le registre biblique et littéraire.
