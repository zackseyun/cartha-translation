source:
  edition: WLC
  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: fr
  text: Quand les justes connaissent le bien-être, la ville se réjouit ; quand les méchants périssent, des cris de joie éclatent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des clameurs retentissent ». Le mot hébreu désigne un cri sonore, souvent joyeux ou triomphal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: Quand les justes connaissent le bien-être
  rationale: 'La construction בְּ + טוּב exprime ici la circonstance ou l’occasion : le bien, le bonheur ou la prospérité des justes. « Connaissent le bien-être » reste naturel tout en conservant l’étendue du terme hébreu, qui ne se limite pas à la richesse matérielle.'
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif pluriel substantivé désigne ceux qui se conduisent avec justice. « Les justes » est concis, usuel et maintient la catégorie morale propre aux Proverbes.
- source_word: תַּעֲלֹץ
  choice: se réjouit
  rationale: Le verbe עלץ évoque une joie vive ou exultante. « Se réjouit » est clair, digne et convient à la personnification de la ville.
- source_word: קִרְיָה
  choice: la ville
  rationale: קִרְיָה désigne une ville ou une cité. En français proverbial, l’article défini générique « la ville » exprime naturellement une vérité générale sans désigner une ville particulière.
- source_word: וּבַאֲבֹד
  choice: quand ... périssent
  rationale: La conjonction, la préposition et l’infinitif construit de אבד introduisent une circonstance parallèle au premier membre. La tournure temporelle est idiomatique en français.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif pluriel substantivé forme l’antithèse morale de « les justes ». « Les méchants » est la formulation française traditionnelle et immédiatement compréhensible.
- source_word: רִנָּה
  choice: elle pousse des cris de joie
  rationale: רִנָּה peut désigner un cri retentissant, souvent joyeux ou triomphal. Le contexte favorise une acclamation publique ; le pronom « elle » rattache naturellement cette réaction à la ville du premier membre.
theological_decisions:
- issue: La joie suscitée par la disparition des méchants
  choice: 'Traduire directement la réaction collective sans l’atténuer : « elle pousse des cris de joie »'
  alternative: Employer le terme plus neutre « des clameurs s’élèvent »
  rationale: Le texte présente une observation proverbiale sur le soulagement public produit par la fin du pouvoir des méchants. La traduction ne doit ni moraliser cette joie ni en supprimer la force.
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme temporel est rendu par deux propositions introduites par « quand ». « Bien-être » évite de réduire טוּב à la seule prospérité financière. Le second membre reprend implicitement « la ville » par « elle », ce qui donne une phrase française fluide tout en préservant le parallélisme.
