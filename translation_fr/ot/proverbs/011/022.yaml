  text: נֶ֣זֶם זָ֭הָב בְּ/אַ֣ף חֲזִ֑יר אִשָּׁ֥ה יָ֝פָ֗ה וְ/סָ֣רַת טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/022.yaml
  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: fr
  text: 'Un anneau d’or au groin d’un porc : telle est une belle femme qui se détourne du bon sens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une belle femme dépourvue de discernement ».
    reason: Alternative idiomatique pour וְסָרַת טָעַם, qui peut décrire l’absence de discernement plutôt que souligner le fait de s’en détourner.
lexical_decisions:
- source_word: נֶזֶם
  choice: anneau
  rationale: Le nom désigne un anneau, souvent porté au nez. Comme le complément précise qu’il se trouve au groin du porc, « anneau » suffit naturellement sans rendre deux fois l’idée du nez.
- source_word: זָהָב
  choice: d’or
  rationale: Équivalent courant qui conserve le contraste entre la valeur du bijou et l’animal qui le porte.
- source_word: בְּאַף חֲזִיר
  choice: au groin d’un porc
  rationale: אַף désigne ici le nez; « groin » est le terme français précis et imagé pour le nez du porc. « Porc » convient au registre proverbial et digne.
- source_word: אִשָּׁה יָפָה
  choice: une belle femme
  rationale: En l’absence de contexte matrimonial, אִשָּׁה signifie « femme » plutôt qu’« épouse »; יָפָה exprime clairement la beauté physique.
- source_word: וְסָרַת טָעַם
  choice: qui se détourne du bon sens
  rationale: La formulation conserve la valeur active de סָרַת, « qui s’écarte/se détourne », et rend טַעַם par « bon sens », c’est-à-dire discernement ou jugement, plutôt que goût esthétique.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, actuelle et digne. Les deux membres sont rapprochés par les deux-points et « telle est », ce qui explicite naturellement la comparaison nominale de l’hébreu sans en atténuer la force.
