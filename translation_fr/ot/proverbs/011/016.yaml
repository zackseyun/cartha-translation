  text: אֵֽשֶׁת חֵ֭ן תִּתְמֹ֣ךְ כָּב֑וֹד וְ֝/עָרִיצִ֗ים יִתְמְכוּ עֹֽשֶׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/016.yaml
  text: A gracious woman obtains honor[a], and ruthless men obtain wealth.
translation:
  language: fr
  text: Une femme pleine de grâce acquiert l’honneur[a], et les hommes impitoyables acquièrent la richesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une femme pleine de grâce conserve son honneur… et les hommes impitoyables conservent leur richesse. » Dans les deux membres, le verbe hébreu signifie littéralement « tenir, soutenir » ; ici, il peut exprimer l’idée d’acquérir ou de s’assurer quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: une femme pleine de grâce
  rationale: Le groupe construit signifie littéralement « femme de grâce/faveur ». Cette formulation naturelle en français conserve la qualité personnelle et morale sans la réduire au simple charme.
- source_word: תִּתְמֹךְ
  choice: acquiert
  rationale: Le verbe תמך signifie fondamentalement « saisir, tenir, soutenir ». Dans ce parallélisme, il évoque probablement le fait de parvenir à posséder ou à assurer quelque chose ; « acquiert » exprime ce résultat tout en laissant l’autre lecture en note.
- source_word: כָּבוֹד
  choice: l’honneur
  rationale: Dans la littérature sapientielle, le terme désigne souvent l’honneur ou l’estime sociale plutôt qu’une gloire visible.
- source_word: עָרִיצִים
  choice: les hommes impitoyables
  rationale: Le mot désigne des personnes violentes, oppressives ou sans pitié. « Impitoyables » garde cette dureté sans restreindre le sens à des tyrans politiques.
- source_word: יִתְמְכוּ
  choice: acquièrent
  rationale: Le même verbe que dans le premier membre est rendu de la même manière afin de préserver le parallélisme lexical du texte hébreu.
- source_word: עֹשֶׁר
  choice: la richesse
  rationale: Rendu courant et clair pour l’abondance matérielle, en contraste avec l’honneur.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé par la répétition d’« acquiert/acquièrent », tandis que la note signale le sens concret du verbe hébreu et l’ambiguïté entre acquisition et conservation.
