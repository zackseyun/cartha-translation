source:
  edition: WLC
  text: נֶֽפֶשׁ בְּרָכָ֥ה תְדֻשָּׁ֑ן וּ֝/מַרְוֶ֗ה גַּם ה֥וּא יוֹרֶֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: fr
  text: La personne généreuse sera comblée[a], et celui qui désaltère les autres sera lui aussi désaltéré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Une âme de bénédiction sera engraissée. » En hébreu, l’image évoque l’abondance et l’épanouissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « celui qui arrose sera lui aussi arrosé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ בְּרָכָה
  choice: La personne généreuse
  rationale: נֶפֶשׁ désigne ici la personne entière, tandis que בְּרָכָה la caractérise comme une source de bénédiction. « La personne généreuse » exprime naturellement en français le sens éthique de l’ensemble sans spiritualiser indûment נֶפֶשׁ.
- source_word: תְדֻשָּׁן
  choice: connaîtra l’abondance
  rationale: Le pual de דשׁן évoque littéralement le fait d’être engraissé, image hébraïque de prospérité et d’épanouissement. Cette formulation restitue l’idée d’abondance sans les connotations physiques trompeuses de « sera engraissée ».
- source_word: וּמַרְוֶה
  choice: celui qui désaltère les autres
  rationale: Le participe hiphil de רוה signifie faire boire ou désaltérer. « Désaltère les autres » conserve l’image concrète de l’eau tout en laissant entendre le bienfait figuré; « les autres » explicite l’objet implicite requis par le français.
- source_word: גַּם הוּא יוֹרֶא
  choice: sera lui aussi désaltéré
  rationale: La proposition exprime un retour correspondant sur le bienfaiteur. « Lui aussi » rend l’emphase de גַּם הוּא, et « sera désaltéré » maintient le parallélisme et l’image de la première forme de רוה.
theological_decisions:
- issue: Nature de la réciprocité promise
  choice: Conserver une affirmation proverbiale générale, sans préciser l’agent ni le mécanisme du retour.
  alternative: Présenter explicitement Dieu comme celui qui récompense la générosité, ou formuler une garantie matérielle absolue.
  rationale: L’hébreu emploie des passifs et ne nomme pas l’agent. Le verset affirme la réciprocité avec force, mais ne définit ni comment ni par qui elle s’accomplit.
translation_notes:
  register: Français international moderne, naturel et digne. Le premier membre privilégie une formulation idiomatique, tandis que le second conserve l’image de l’eau et la réciprocité marquée par l’hébreu.
