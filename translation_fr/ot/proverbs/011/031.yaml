id: PRO.11.31
reference: Proverbs 11:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: fr
  text: Si[a] le juste reçoit sa rétribution sur la terre, combien plus le méchant et le pécheur !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ouvre par un terme emphatique qui peut aussi se rendre par « Assurément » ou « Voici ». « Terre » peut également signifier « pays » ; plus littéralement : « Voici, le juste recevra sa rétribution sur la terre/dans le pays. »'
    reason: 'Alternative lexicale pour l’interjection הֵן et ambiguïté de אֶרֶץ entre « terre » et « pays ». '
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Introduit avec force une affirmation. « Oui » est naturel et digne en français moderne, tandis que « Voici » ferait davantage attendre une présentation visuelle.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier substantivé désigne ici la figure représentative du juste; cette formulation traditionnelle reste claire et concise.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. La portée générale de la maxime favorise « la terre », sans exclure entièrement l’autre lecture.
- source_word: יְשֻׁלָּם
  choice: reçoit sa rétribution
  rationale: Le pual de שלם exprime le fait de recevoir ce qui est dû. « Rétribution » demeure assez large pour ne réduire le sens ni à une récompense positive ni à un châtiment.
- source_word: אַף כִּי
  choice: combien plus
  rationale: Cette locution marque ici un raisonnement a fortiori; « combien plus » en rend explicitement et naturellement la progression.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Équivalent courant de l’adjectif substantivé dans la littérature sapientielle.
- source_word: וְחוֹטֵא
  choice: et le pécheur
  rationale: Le participe substantivé désigne celui qui est caractérisé par le péché; « le pécheur » préserve le parallélisme avec « le méchant ».
theological_decisions:
- issue: Nature de la rétribution du juste
  choice: Le juste reçoit sur la terre ce qui lui revient, sans que la traduction précise s’il s’agit d’une récompense, d’une discipline ou d’une autre conséquence.
  alternative: « Le juste est récompensé » ou « le juste est puni » sur la terre.
  rationale: Le verbe hébreu permet une notion générale de rétribution. Une formulation plus étroite résoudrait indûment la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure conserve le raisonnement a fortiori et l’ambiguïté de la rétribution, tout en signalant en note les autres valeurs possibles de l’interjection et de אֶרֶץ.
