  edition: WLC
  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: fr
  text: 'Main à main[a], le méchant ne restera pas impuni,

    mais la descendance des justes échappera.


    [a] Littéralement : « main à main ». Cette expression hébraïque difficile à interpréter marque probablement une forte certitude (« à coup sûr ») ; elle peut aussi évoquer une entente ou une association.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « main à main ». Cette expression hébraïque difficile à interpréter marque probablement une forte certitude (« à coup sûr ») ; elle peut aussi évoquer une entente ou une association.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  choice: Main dans la main
  rationale: Cette formulation conserve l’image répétée de la main tout en restant compréhensible en français. Comme l’expression hébraïque est obscure et peut marquer la certitude ou évoquer une association, la note en signale le sens littéral et les principales possibilités.
- source_word: יִנָּקֶה
  choice: ne restera pas impuni
  rationale: Le niphal de נקה exprime ici le fait d’être exempté d’une peine ou d’échapper à ses conséquences. Cette tournure française est naturelle dans un contexte moral et judiciaire.
- source_word: רָּע
  choice: le méchant
  rationale: L’adjectif masculin singulier est employé comme substantif et désigne une personne méchante représentative. « Le méchant » est concis, idiomatique et conforme au style proverbial.
- source_word: וְזֶרַע
  choice: mais la descendance
  rationale: זֶרַע désigne ici les descendants plutôt qu’une semence matérielle. Le français « descendance » conserve le collectif singulier, et « mais » rend le contraste entre les deux destinées.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif pluriel substantivé désigne collectivement les personnes justes. « Des justes » est naturel, concis et n’ajoute aucune précision absente du texte.
- source_word: נִמְלָט
  choice: échappera au danger
  rationale: Le niphal de מלט exprime l’idée d’échapper ou d’être délivré. L’ajout idiomatique « au danger » indique le sens verbal sans identifier plus précisément la menace, que le texte laisse implicite.
theological_decisions:
- issue: Valeur de l’expression יָד לְיָד
  choice: Conserver l’image dans le texte principal et expliquer l’incertitude en note
  alternative: Traduire directement par « À coup sûr »
  rationale: L’expression est suffisamment obscure pour ne pas imposer exclusivement une valeur adverbiale. Le texte conserve donc son image, tandis que la note présente la certitude comme sens probable et mentionne aussi l’idée possible d’association.
- issue: Adjectif substantivé masculin רָּע
  choice: le méchant
  alternative: une personne méchante
  rationale: Le masculin singulier hébreu présente une figure représentative. « Le méchant » respecte cette forme et le parallélisme proverbial sans introduire le nom « homme ».
- issue: Objet implicite de נִמְלָט
  choice: échappera au danger
  alternative: sera délivrée
  rationale: Le texte ne précise pas explicitement de quoi la descendance s’échappe. « Au danger » reste général et évite de déterminer s’il s’agit du jugement, du malheur ou du sort du méchant.
translation_notes:
  register: Français international moderne, concis et digne, avec le parallélisme propre au proverbe. Le singulier collectif « la descendance » commande « échappera ». La note préserve l’opacité réelle de l’idiome initial sans alourdir le verset.
