  source_fidelity: 'La traduction rend correctement le contraste entre le méchant singulier et la descendance collective des justes. Toutefois, « au danger » introduit un complément absent de l’hébreu : נִמְלָט laisse volontairement implicite ce à quoi la descendance échappe. « Main dans la main » est une expression française qui privilégie l’idée d’association, possibilité secondaire mais non assurée pour l’idiome hébreu. « Main à main » conserve plus sobrement l’opacité et la répétition de l’original, expliquées en note.'
