id: PRO.11.9
reference: Proverbs 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: fr
  text: Par sa bouche, l’homme impie[a] détruit son prochain, mais par la connaissance, les justes sont délivrés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’hypocrite ». Le mot hébreu peut désigner une personne hypocrite, profane ou impie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les justes échappent grâce à la connaissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  choice: Par sa bouche
  rationale: La préposition בְּ a ici une valeur instrumentale. Cette formulation naturelle conserve l’image concrète de la bouche comme moyen de destruction.
- source_word: חָנֵף
  choice: l’homme impie
  rationale: Le terme désigne une personne moralement et religieusement corrompue; il peut aussi évoquer l’hypocrisie. « Impie » préserve ce sens large, tandis que le nom « homme » rend le masculin singulier.
- source_word: יַשְׁחִת
  choice: détruit
  rationale: Le hifil de שׁחת exprime l’action de détruire ou de mener à la ruine. « Détruit » restitue la force concise du verbe hébreu.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner un prochain, un compagnon ou un ami. « Prochain » convient au cadre social et moral du proverbe sans supposer une amitié étroite.
- source_word: וּבְדַעַת
  choice: mais par la connaissance
  rationale: Le וּ marque ici le contraste, et בְּ indique le moyen. « Connaissance » maintient un terme majeur du vocabulaire sapientiel des Proverbes.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif masculin pluriel est employé comme nom et désigne la catégorie morale des personnes justes.
- source_word: יֵחָלֵצוּ
  choice: sont délivrés
  rationale: Le nifal de חלץ exprime ici la délivrance ou le fait d’échapper à un danger. La tournure passive laisse ouverte la nature précise de cette délivrance.
theological_decisions:
- issue: Sens de חָנֵף dans le contexte sapientiel
  choice: l’homme impie
  alternative: l’hypocrite
  rationale: Le mot peut inclure l’idée d’hypocrisie, mais son opposition aux « justes » indique plus largement une corruption morale et religieuse. La variante est conservée en note.
- issue: Relation entre le sujet et le verbe dans le second membre
  choice: les justes sont délivrés
  alternative: des personnes sont délivrées par la connaissance des justes
  rationale: La syntaxe hébraïque prend le plus naturellement צַדִּיקִים comme sujet de יֵחָלֵצוּ. La traduction ne transforme donc pas la connaissance des justes en moyen de délivrance pour autrui.
- issue: Nuance de la délivrance
  choice: sont délivrés
  alternative: échappent au danger
  rationale: Le passif français correspond à la forme nifal et ne précise ni l’agent ni le danger, maintenant ainsi l’ouverture du texte hébreu.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme antithétique est conservé, ainsi que la répétition instrumentale de « par ». Les termes « impie », « prochain », « connaissance » et « justes » maintiennent le registre moral et sapientiel du texte.
