source:
  edition: WLC
  text: צַ֭דִּיק מִ/צָּרָ֣ה נֶחֱלָ֑ץ וַ/יָּבֹ֖א רָשָׁ֣ע תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/008.yaml
  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: fr
  text: Le juste est délivré de la détresse, et le méchant prend sa place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « et le méchant vient à sa place ». L’expression hébraïque peut marquer la substitution et suggérer que le méchant tombe dans la détresse à la place du juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne ici, au singulier, une personne juste. « Le juste » conserve la forme représentative et le parallélisme avec « le méchant ».
- source_word: מִצָּרָה
  choice: de la détresse
  rationale: La préposition מִן exprime la séparation ou la délivrance hors d’une situation, tandis que צָרָה désigne la détresse, l’adversité ou une situation critique.
- source_word: נֶחֱלָץ
  choice: est délivré
  rationale: Le niphal de חלץ exprime ici une délivrance subie ou reçue. « Est délivré » respecte cette valeur passive sans préciser l’agent.
- source_word: וַיָּבֹא
  choice: vient prendre
  rationale: Le verbe בוא signifie littéralement « venir/entrer ». Avec תַּחְתָּיו, la tournure française « vient prendre sa place » rend naturellement le mouvement vers une position de substitution.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé forme le pendant singulier de « le juste » et désigne celui dont la conduite est mauvaise ou coupable.
- source_word: תַּחְתָּיו
  choice: sa place
  rationale: תַּחַת avec suffixe peut signifier « à sa place » ou « à sa place, à sa place de substitution ». Ici, le contexte antithétique favorise l’idée que le méchant prend la place du juste dans la détresse.
theological_decisions:
- issue: Nature du renversement entre le juste et le méchant
  choice: 'Le proverbe présente un principe général de renversement : le juste sort de la détresse et le méchant prend sa place.'
  alternative: Le méchant tombe précisément dans la même détresse que celle dont le juste vient d’être délivré.
  rationale: Le terme תַּחְתָּיו soutient une idée de substitution, mais le texte ne précise ni le mécanisme ni le moment de ce renversement. La formulation conserve cette tension sans transformer le proverbe en scénario détaillé.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme « le juste / le méchant » est conservé. « Détresse » rend la gravité possible de צָרָה, et « vient prendre sa place » explicite juste assez la relation syntaxique sans préciser indûment le déroulement.
