  source_fidelity: 'Le premier membre rend correctement l’avertissement intensif רַע יֵרוֹעַ : « s’en trouvera très mal » exprime une conséquence dommageable, sans moraliser רַע. « Se porter garant pour un inconnu » restitue avec justesse עָרַב זָר, où זָר désigne une personne extérieure au cercle relationnel, pas nécessairement un étranger ethnique. Le second membre conserve la force de שֹׂנֵא et le sens prudent de בּוֹטֵחַ. La formulation explicite l’acte représenté par תֹקְעִים sans le réduire à une simple salutation.'
