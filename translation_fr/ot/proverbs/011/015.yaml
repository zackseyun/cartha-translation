source:
  edition: WLC
  text: רַע יֵ֭רוֹעַ כִּי עָ֣רַב זָ֑ר וְ/שֹׂנֵ֖א תֹקְעִ֣ים בּוֹטֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: fr
  text: Qui se porte garant pour un inconnu s’en trouvera très mal, mais qui déteste s’engager en frappant dans la main[a] est en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, «ceux qui frappent dans la main» : ce geste servait à sceller un engagement ou une garantie.'
    reason: cultural_note
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  choice: s’en trouvera très mal
  rationale: La combinaison intensive exprime avec force les conséquences dommageables subies, sans donner à רַע un sens moral ici.
- source_word: כִּי עָרַב
  choice: qui se porte garant
  rationale: כִּי introduit ici la personne ou la situation visée plutôt qu’une condition explicite; «se porter garant» rend naturellement l’engagement financier ou juridique.
- source_word: זָר
  choice: pour un inconnu
  rationale: Dans ce contexte sapientiel, le terme désigne une personne extérieure au cercle de relations, sans nécessairement indiquer un étranger au sens ethnique.
- source_word: שֹׂנֵא
  choice: déteste
  rationale: Le choix conserve la force du participe hébreu et l’aversion résolue exprimée par le proverbe.
- source_word: תֹקְעִים
  choice: s’engager en frappant dans la main
  rationale: La formulation conserve le geste concret qui scellait une garantie tout en explicitant sa fonction, afin d’éviter le sens moderne banal de «serrer la main».
- source_word: בּוֹטֵחַ
  choice: est en sécurité
  rationale: Le terme décrit l’état de sûreté de celui qui évite le risque évoqué dans le premier membre.
