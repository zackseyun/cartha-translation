source:
  edition: WLC
  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: fr
  text: Quand un homme méchant meurt, son espoir disparaît, et l’attente de la puissance[a] s’évanouit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est difficile. Il peut aussi se comprendre comme « l’attente des puissants » et peut évoquer les richesses ou les ressources.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: Quand … meurt
  rationale: La préposition ב suivie de l’infinitif construit de מות introduit une proposition temporelle ; cette tournure est naturelle en français.
- source_word: אָדָם רָשָׁע
  choice: un homme méchant
  rationale: אָדָם désigne ici un individu représentatif, qualifié par רָשָׁע, terme courant des Proverbes pour une personne moralement mauvaise opposée au juste.
- source_word: תֹּאבַד תִּקְוָה
  choice: son espoir disparaît
  rationale: תִּקְוָה signifie « espoir » ou « espérance », et אבד exprime ici sa disparition. Le possessif explicite le rapport naturel avec l’homme mentionné sans modifier le sens.
- source_word: וְתוֹחֶלֶת
  choice: et ce qu’il attendait
  rationale: תּוֹחֶלֶת désigne une attente ou une espérance. La formulation verbale préserve sa nuance propre tout en évitant une construction nominale peu naturelle en français.
- source_word: אוֹנִים
  choice: de sa puissance
  rationale: Le terme difficile se rattache probablement à la force, aux ressources ou à la puissance. « Puissance » conserve cette largeur de sens ; « sa » exprime que le méchant fondait là son attente, tout en laissant les autres analyses dans la note.
- source_word: אָבָדָה
  choice: s’évanouit
  rationale: Le second emploi de אבד reprend l’idée de disparition. « S’évanouit » maintient le parallélisme sans imposer en français une répétition lourde.
theological_decisions:
- issue: Portée de אָדָם
  choice: un homme
  alternative: une personne
  rationale: Dans ce proverbe, le nom présente un individu masculin représentatif plutôt que l’humanité en général ; « un homme » correspond directement à cette formulation.
- issue: Sens de אוֹנִים
  choice: sa puissance
  alternative: les puissants ; ses richesses ou ses ressources
  rationale: La forme hébraïque est difficile et peut évoquer la force ou la puissance, être comprise comme désignant des personnes puissantes, ou, par extension, des ressources. Le texte principal retient le sens abstrait probable sans supprimer les autres possibilités.
translation_notes:
  register: Français international actuel, sobre et proverbial. Le parallélisme est conservé avec deux expressions distinctes, « espoir » et « ce qu’il attendait », afin de refléter les deux noms hébreux sans lourdeur.
