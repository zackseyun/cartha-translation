id: PRO.11.30
reference: Proverbs 11:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פְּֽרִי צַ֭דִּיק עֵ֣ץ חַיִּ֑ים וְ/לֹקֵ֖חַ נְפָשׂ֣וֹת חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: fr
  text: 'Le fruit du juste est un arbre de vie,

    et celui qui gagne les gens à lui est sage.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui prend des personnes (ou des vies) est sage ». L’expression hébraïque peut évoquer le fait de gagner des personnes à soi ou d’exercer une influence sur elles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי
  choice: fruit
  rationale: « Fruit » conserve l’image concrète et sa portée figurée naturelle dans la littérature de sagesse.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne ici de manière représentative la personne juste; le singulier français garde la forme proverbiale.
- source_word: עֵץ חַיִּים
  choice: un arbre de vie
  rationale: Cette expression consacrée dans les Proverbes préserve l’écho à la Genèse et évite de réduire la métaphore à une simple paraphrase comme « un arbre qui donne la vie ».
- source_word: וְלֹקֵחַ
  choice: celui qui gagne … à lui
  rationale: Le participe signifie littéralement « prenant », mais, avec des personnes comme complément, « gagner les gens à lui » exprime naturellement en français l’idée de les rallier ou d’exercer sur eux une influence, sans imposer une lecture évangélistique.
- source_word: נְפָשׂוֹת
  choice: les gens
  rationale: נפשׁ peut désigner des personnes ou des vies, et non seulement des « âmes » au sens immatériel. « Les gens » rend ici le sens personnel de manière idiomatique.
- source_word: חָכָם
  choice: est sage
  rationale: L’adjectif a une valeur prédicative; cette formulation concise conserve la conclusion évaluative du proverbe.
theological_decisions:
- issue: Sens de « prendre/gagner des personnes » dans le contexte sapiential
  choice: « celui qui gagne les gens à lui » au sens large de rallier ou d’influencer des personnes
  alternative: « celui qui prend des vies » ou « celui qui s’empare de personnes »
  rationale: L’hébreu n’énonce pas explicitement la conversion religieuse. Le texte principal donne un sens idiomatique plausible, tandis que la note conserve la formulation plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, proverbial et digne. Le parallélisme est conservé sur deux lignes. « Les gens » évite que « âmes » soit compris dans un sens anthropologique étroit ou comme une allusion explicite à l’évangélisation; la note maintient toutefois l’ambiguïté réelle de l’hébreu.
