source:
  edition: WLC
  text: תֻּמַּ֣ת יְשָׁרִ֣ים תַּנְחֵ֑/ם וְ/סֶ֖לֶף בּוֹגְדִ֣ים ו/שד/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: fr
  text: L’intégrité des gens droits les guide, mais la conduite tortueuse[a] des perfides les détruit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la perversité » au lieu de « la conduite tortueuse ». Le mot hébreu évoque une déformation morale, en contraste avec les « gens droits ».'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset peut aussi se traduire : « cause la ruine des perfides » ou « est leur ruine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֻּמַּת
  choice: l’intégrité
  rationale: Le nom exprime ici la plénitude ou la rectitude morale. « Intégrité » convient au contexte sapientiel sans suggérer une perfection absolue.
- source_word: יְשָׁרִים
  choice: les gens droits
  rationale: L’expression désigne des personnes moralement droites. Ce choix reste naturel en français moderne et prépare le contraste avec l’image de ce qui est tortueux.
- source_word: תַּנְחֵם
  choice: les guide
  rationale: La forme causative de נחה signifie conduire ou guider. « Guide » exprime bien l’orientation morale évoquée par le proverbe.
- source_word: סֶלֶף
  choice: la conduite tortueuse
  rationale: Le terme évoque ce qui est tordu, déformé ou pervers. Cette formulation conserve l’image concrète opposée aux « gens droits », tout en étant idiomatique en français.
- source_word: בּוֹגְדִים
  choice: les perfides
  rationale: Le participe désigne ceux qui trompent ou trahissent la confiance. « Les perfides » rend ce trait moral habituel sans limiter le sens à la trahison politique.
- source_word: ו/שד/ם
  choice: les détruit
  rationale: La forme renvoie à la dévastation ou à la destruction et présente les perfides comme victimes de leur propre conduite tortueuse. « Les détruit » conserve la force concise de l’antithèse.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique et l’image spatiale opposant ce qui est droit à ce qui est tortueux sont conservés.
