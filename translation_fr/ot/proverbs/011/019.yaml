  text: כֵּן צְדָקָ֥ה לְ/חַיִּ֑ים וּ/מְרַדֵּ֖ף רָעָ֣ה לְ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: fr
  text: Ainsi, la justice mène à la vie[a], mais celui qui poursuit le mal va vers sa mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ainsi, la justice conduit à la vie » ou « Oui, la justice mène à la vie ». La première proposition hébraïque ne comporte pas de verbe ; le français explicite donc le rapport sous-entendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: L’adverbe introduit ici une conclusion ou une affirmation appuyée. « Ainsi » garde la concision et la force proverbiale de l’hébreu.
- source_word: צְדָקָה
  choice: la justice
  rationale: Dans la littérature de sagesse, le nom désigne une conduite droite et conforme au bien. « Justice » est naturel en français et conserve l’étendue morale du terme sans le réduire à la seule équité sociale.
- source_word: לְחַיִּים
  choice: mène à la vie
  rationale: La préposition לְ peut exprimer le but ou le résultat. Comme la première proposition hébraïque est sans verbe, « mène à » explicite sobrement le rapport entre la justice et la vie.
- source_word: וּמְרַדֵּף
  choice: mais celui qui poursuit
  rationale: Le participe substantivé désigne celui qui s’attache habituellement à poursuivre quelque chose. Dans le parallélisme antithétique, וּ prend naturellement en français une valeur contrastive rendue par « mais ».
- source_word: רָעָה
  choice: le mal
  rationale: L’opposition avec la justice et la vie favorise le sens moral de « mal », plutôt que ceux de malheur ou de calamité.
- source_word: לְמוֹתוֹ
  choice: va à sa propre mort
  rationale: L’expression signifie littéralement « vers/pour sa mort ». « Va à sa propre mort » conserve l’idée de destination ou de résultat, tandis que « propre » fait clairement ressortir le suffixe possessif masculin singulier.
theological_decisions:
- issue: Portée de צְדָקָה dans ce contexte sapiential
  choice: La justice comme droiture morale qui mène à la vie
  alternative: La justice comprise plus étroitement comme équité sociale
  rationale: Le parallélisme oppose une orientation morale droite à la poursuite du mal. Le terme peut inclure l’équité sociale, mais le contexte appelle ici un sens éthique plus large, sans ajout doctrinal.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation reste proche de la structure antithétique hébraïque tout en suppléant les verbes nécessaires à un français naturel.
