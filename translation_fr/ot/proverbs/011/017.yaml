  text: גֹּמֵ֣ל נַ֭פְשׁ/וֹ אִ֣ישׁ חָ֑סֶד וְ/עֹכֵ֥ר שְׁ֝אֵר֗/וֹ אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/017.yaml
  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: fr
  text: L’homme bienveillant se fait du bien, mais l’homme cruel fait du tort à sa propre chair[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son propre corps » ; autre traduction possible : « ses proches », si שְׁאֵרוֹ désigne ici les membres de sa parenté plutôt que sa chair ou son corps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֵל
  choice: se fait du bien
  rationale: Le participe exprime ici l’idée de faire du bien ou de procurer un avantage. La tournure pronominale rend naturellement en français le rapport avec נַפְשׁוֹ.
- source_word: נַפְשׁוֹ
  choice: se
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. Dans ce contexte sapiential, le sens réflexif « à lui-même » convient au parallélisme avec « sa propre chair ».
- source_word: אִישׁ חָסֶד
  choice: l’homme bon
  rationale: חֶסֶד décrit ici une personne caractérisée par la bonté et la bienveillance. « L’homme bon » est naturel, digne et conserve la forme masculine représentative du proverbe.
- source_word: עֹכֵר
  choice: tourmente
  rationale: Le verbe signifie causer du trouble ou du mal. « Tourmente » maintient cette force causative et s’oppose clairement à « se fait du bien ».
- source_word: שְׁאֵרוֹ
  choice: sa propre chair
  rationale: שְׁאֵר peut désigner la chair, le corps ou les proches par le sang. « Sa propre chair » préserve l’image hébraïque et le parallélisme avec נַפְשׁוֹ, tout en laissant l’autre sens en note.
- source_word: אַכְזָרִי
  choice: l’homme cruel
  rationale: L’adjectif est employé substantivement. Cette formulation reproduit l’opposition entre les deux types de personnes.
theological_decisions: []
translation_notes:
  register: Français international moderne, proverbial et digne. Le parallélisme antithétique est conservé, ainsi que l’image concrète de la « chair ». Le masculin singulier suit la forme représentative de l’hébreu.
