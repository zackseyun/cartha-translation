  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: fr
  text: Quand vient l’arrogance, vient aussi le déshonneur[a] ; mais la sagesse est avec les gens modestes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand vient l’orgueil, alors vient la honte. »'
    reason: Alternative lexicale qui reflète les sens possibles de זָדוֹן et קָלוֹן ainsi qu’une autre manière de rendre l’enchaînement proverbial.
lexical_decisions:
- source_word: בָּא
  choice: vient
  rationale: Le qal accompli a ici une valeur générale propre au proverbe ; le présent français exprime naturellement cette vérité habituelle.
- source_word: זָדוֹן
  choice: l’arrogance
  rationale: Le nom désigne un orgueil présomptueux et condamnable. « Arrogance » rend clairement cette faute morale, tandis que « orgueil » peut avoir des emplois plus larges en français contemporain.
- source_word: וַיָּבֹא
  choice: vient aussi
  rationale: La forme poursuit le parallélisme et associe le déshonneur à l’arrivée de l’arrogance. « Aussi » conserve ce lien sans alourdir la maxime.
- source_word: קָלוֹן
  choice: le déshonneur
  rationale: Le terme évoque la honte publique et la perte d’honneur. « Déshonneur » convient au registre proverbial ; « honte » reste une possibilité réelle.
- source_word: וְאֶת
  choice: mais ... avec
  rationale: אֶת exprime ici l’association. Le contraste implicite du parallélisme est rendu naturellement par « mais », tandis que « avec » préserve la construction relationnelle.
- source_word: צְנוּעִים
  choice: les gens modestes
  rationale: Le mot désigne des personnes modestes, réservées ou humbles. « Les gens modestes » reste naturel et évite de réduire le terme à une condition sociale.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: C’est le terme courant pour la sagesse. La proposition nominale est conservée sous la forme concise « la sagesse est avec ».
