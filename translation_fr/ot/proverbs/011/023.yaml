source:
  edition: WLC
  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: fr
  text: Le désir des justes n’est que bien, mais l’attente des méchants est colère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans la seconde proposition, l’hébreu dit littéralement : « l’attente des méchants, colère ». Il ne précise pas de qui vient cette colère ; il peut s’agir de la fureur des méchants ou de la colère qui s’abat sur eux.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  choice: désir
  rationale: Le nom exprime le désir ou l’aspiration. « Désir » est naturel, concis et maintient le parallèle avec « attente ».
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif pluriel est employé comme nom et désigne ici les personnes justes; « les justes » conserve la catégorie morale avec concision.
- source_word: אַךְ
  choice: ne… que
  rationale: Dans ce contexte, la particule a une valeur restrictive. La tournure « n’aboutit qu’au bien » exprime clairement cette exclusivité.
- source_word: טוֹב
  choice: au bien
  rationale: Le terme signifie « bien » ou « ce qui est bon ». « Au bien » garde la brièveté de l’hébreu tout en donnant une formulation française naturelle.
- source_word: תִּקְוַת
  choice: attente
  rationale: Le nom peut désigner l’espoir ou l’attente. « Attente » fonctionne mieux avec l’issue négative de la seconde proposition et évite la nuance intrinsèquement positive que possède souvent « espoir » en français.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif pluriel substantivé désigne les personnes moralement mauvaises; « les méchants » est courant et parallèle à « les justes ».
- source_word: עֶבְרָה
  choice: colère
  rationale: Le nom peut signifier colère, fureur ou courroux. « Colère » est clair en français moderne et n’identifie pas celui dont elle émane.
theological_decisions:
- issue: Sens de la proposition finale
  choice: L’attente des méchants aboutit à la colère, sans préciser de qui vient cette colère.
  alternative: L’attente des méchants est elle-même colère, ou elle finit par attirer la colère de Dieu.
  rationale: L’hébreu juxtapose littéralement « l’attente des méchants » et « colère », sans verbe exprimé ni possesseur explicite. La formulation française conserve cette indétermination et la note signale les principales possibilités sans introduire explicitement Dieu dans le texte.
translation_notes:
  register: Français moderne, sobre et proverbial. L’ajout verbal « n’aboutit » rend le contraste idiomatique et suggère l’issue des deux attentes, tout en laissant la proposition finale nominale et théologiquement ouverte grâce à la ponctuation et à la note.
