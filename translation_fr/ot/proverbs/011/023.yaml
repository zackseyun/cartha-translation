review_pass:
  verdict: revise
  source_fidelity: La première proposition hébraïque est une prédication nominale (« le désir des justes — seulement bien »), non une affirmation explicite de résultat. La formulation « n’aboutit qu’au bien » introduit donc une idée d’issue qui n’est pas exprimée. Par ailleurs, la virgule de la seconde proposition invite à sous-entendre le même verbe (« aboutit »), ce qui oriente indûment le sens final vers un aboutissement. Une formulation copulative conserve mieux la juxtaposition et l’ambiguïté de עֶבְרָה, dont le possesseur n’est pas indiqué.
  naturalness: « Le désir des justes n’est que bien » et « l’attente des méchants est colère » ont une concision proverbiale légèrement soutenue, mais restent naturelles et intelligibles en français biblique moderne. Elles rendent le parallélisme sans ajouter une relation causale ou temporelle.
  terminology: « Désir », « justes », « attente », « méchants » et « colère » sont des équivalents appropriés. « Attente » rend bien תִּקְוָה dans ce contexte, sans imposer la coloration positive souvent associée à « espérance ». « Colère » maintient l’absence d’identification explicite de l’agent ou du sujet de la colère.
  issues:
  - severity: medium
    issue: « n’aboutit qu’au bien » ajoute une notion de résultat.
    rationale: 'Le texte hébreu ne contient aucun verbe signifiant « aboutir » : il énonce nominalement que le désir des justes est seulement bien.'
  - severity: medium
    issue: La ponctuation de « mais l’attente des méchants, à la colère » fait sous-entendre « aboutit ».
    rationale: Cette ellipse transforme la seconde prédication nominale en affirmation d’aboutissement et réduit l’ambiguïté que la note cherche à préserver.
  revised_text: Le désir des justes n’est que bien, mais l’attente des méchants est colère.[a]
  revised_footnotes:
