source:
  edition: WLC
  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: fr
  text: Celui qui retient le grain, le peuple le maudit[a] ; mais la bénédiction repose sur la tête de celui qui le vend[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nation » ou « la population le maudit » ; le mot hébreu peut désigner un peuple particulier ou le public pris collectivement.
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui le distribue » ; le participe hébreu peut mettre l’accent sur l’approvisionnement en grain, mais, dans ce contexte, il désigne généralement le fait de le vendre ou de le mettre en vente plutôt que de l’accaparer.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: celui qui retient
  rationale: Le participe substantivé décrit de manière générale celui qui garde le grain au lieu de le mettre à disposition.
- source_word: בָּר
  choice: le grain
  rationale: Le terme désigne ici les céréales de façon générique, sans se limiter au blé.
- source_word: יִקְּבֻהוּ
  choice: le maudit
  rationale: Dans ce contexte, le verbe נקב exprime l’action de prononcer une malédiction contre quelqu’un.
- source_word: לְאֹם
  choice: le peuple
  rationale: Le mot peut désigner une nation ou la population prise collectivement ; « le peuple » convient au cadre social du proverbe tout en conservant sa portée collective.
- source_word: וּבְרָכָה
  choice: mais la bénédiction
  rationale: La conjonction signifie formellement « et », mais le parallélisme antithétique justifie naturellement « mais » en français.
- source_word: לְרֹאשׁ
  choice: repose sur la tête
  rationale: Cette formulation préserve l’image hébraïque concrète d’une bénédiction placée sur la tête d’une personne.
- source_word: מַשְׁבִּיר
  choice: celui qui le vend
  rationale: Le participe hiphil de שׁבר désigne ici celui qui approvisionne les autres en leur vendant du grain, par opposition à celui qui le retient.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La structure antithétique du proverbe et l’image concrète de la bénédiction sur la tête sont conservées ; « retient » et « vend » rendent clairement l’opposition économique sans ajouter de motif spéculatif.
