id: PRO.11.24
reference: Proverbs 11:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵ֣שׁ מְ֭פַזֵּר וְ/נוֹסָ֥ף ע֑וֹד וְ/חוֹשֵׂ֥ךְ מִ֝/יֹּ֗שֶׁר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: fr
  text: L’un donne largement et s’enrichit encore ; l’autre retient plus qu’il ne convient[a] et ne fait que s’appauvrir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « retient ce que l’équité exige ». L’expression hébraïque est difficile ; elle peut désigner le fait de retenir au-delà de ce qui convient ou de retenir ce que la justice commande de donner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: L’un … l’autre
  rationale: La construction présente deux types de personnes en contraste. Cette tournure est naturelle en français et rend la portée générale du proverbe.
- source_word: מְפַזֵּר
  choice: donne largement
  rationale: Le participe signifie littéralement « disperse » ou « répand ». Dans ce contexte de biens retenus ou distribués, « donne largement » exprime clairement la générosité suggérée par la métaphore.
- source_word: וְנוֹסָף עוֹד
  choice: et s’enrichit encore
  rationale: La forme verbale exprime ce qui est ajouté ou augmente. Dans le parallélisme économique du verset, « s’enrichit encore » rend naturellement le résultat paradoxal sans en faire une promesse mécanique.
- source_word: וְחוֹשֵׂךְ
  choice: l’autre retient
  rationale: Le verbe désigne l’action de retenir ou de garder par-devers soi, en opposition au fait de répandre généreusement.
- source_word: מִיֹּשֶׁר
  choice: plus qu’il ne convient
  rationale: L’expression difficile renvoie à ce qui est droit, juste ou convenable. Cette traduction rend l’idée probable d’une retenue qui dépasse la juste mesure, tout en signalant l’autre analyse en note.
- source_word: אַךְ לְמַחְסוֹר
  choice: et ne fait que s’appauvrir
  rationale: אַךְ marque ici une restriction emphatique, tandis que מַחְסוֹר désigne le manque. La formulation française exprime clairement que cette conduite n’aboutit qu’à l’indigence.
theological_decisions:
- issue: Nature du lien entre générosité, enrichissement, avarice et pauvreté
  choice: Conserver la formulation proverbiale sans préciser le mécanisme de la rétribution
  alternative: Présenter explicitement le résultat comme une récompense divine immédiate et garantie
  rationale: Le texte énonce une observation sapientielle paradoxale, mais ne précise ni le moyen ni le calendrier du résultat. La traduction ne doit pas transformer ce principe en garantie automatique de prospérité.
translation_notes:
  register: Français moderne, international et proverbial. Le balancement « L’un… l’autre… » met en relief l’antithèse. « Donne largement » privilégie la clarté contextuelle sur le littéralisme de « disperse », tandis que la note préserve l’ambiguïté réelle de מִיֹּשֶׁר.
