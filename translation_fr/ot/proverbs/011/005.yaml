source:
  edition: WLC
  text: צִדְקַ֣ת תָּ֭מִים תְּיַשֵּׁ֣ר דַּרְכּ֑/וֹ וּ֝/בְ/רִשְׁעָת֗/וֹ יִפֹּ֥ל רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: fr
  text: La droiture de l’homme intègre rend droit son chemin[a], mais le méchant tombe par sa méchanceté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dirige son sentier » ou « aplanit son chemin ». Le verbe hébreu évoque le fait de rendre une voie droite.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa méchanceté ». La préposition hébraïque peut présenter la méchanceté soit comme le moyen de sa chute, soit comme la situation dans laquelle le méchant tombe.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: la justice
  rationale: Le nom construit צִדְקַת désigne ici la droiture morale, le fait d’agir conformément à ce qui est juste. « Justice » conserve le lien lexical et convient au contexte sapiential.
- source_word: תָּמִים
  choice: l’homme intègre
  rationale: תָּמִים exprime l’intégrité et la plénitude morale, sans nécessairement affirmer une perfection absolue. « L’homme intègre » est naturel en français et maintient le masculin singulier représentatif de l’hébreu.
- source_word: תְּיַשֵּׁר
  choice: rend […] droit
  rationale: Le piel de ישר signifie rendre droit ou aplanir. Cette formulation préserve l’image concrète du chemin tout en restant idiomatique.
- source_word: דַּרְכּוֹ
  choice: son chemin
  rationale: « Chemin » rend la métaphore sapientiale de la conduite ou du cours de la vie et s’accorde avec l’image de ce qui est rendu droit.
- source_word: וּבְרִשְׁעָתוֹ
  choice: par sa propre méchanceté
  rationale: La préposition ב peut être instrumentale ou locative. « Par » exprime ici naturellement le moyen de la chute; « propre » explicite sans changer le référent du suffixe hébreu et souligne que sa méchanceté cause sa perte.
- source_word: יִפֹּל
  choice: tombe
  rationale: Dans cette maxime, l’inaccompli exprime une vérité générale; le présent français en restitue la valeur gnomique.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé singulier désigne une personne méchante comme type moral. « Le méchant » est concis et traditionnel sans être archaïque.
theological_decisions:
- issue: Genre anthropologique des formes masculines singulières
  choice: 'Conserver le masculin singulier représentatif : « l’homme intègre », « son chemin », « le méchant »'
  alternative: Employer des formulations inclusives ou plurielles telles que « les personnes intègres » et « leur chemin »
  rationale: L’hébreu formule la maxime au masculin singulier. Le français peut conserver cette représentation grammaticale sans transformer le nombre ni effacer la structure antithétique.
- issue: Rapport entre la méchanceté et la chute
  choice: 'Lire ב comme indiquant le moyen : « par sa propre méchanceté »'
  alternative: 'Lire ב comme indiquant la sphère : « dans sa méchanceté »'
  rationale: Les deux valeurs sont possibles. Le sens instrumental met en évidence la causalité morale du proverbe, tandis qu’une note conserve l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique et l’image du chemin sont conservés. « Intègre » évite de faire de תָּמִים une affirmation de perfection sans faute.
