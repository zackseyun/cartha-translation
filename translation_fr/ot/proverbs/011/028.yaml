source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/עָשְׁר/וֹ ה֣וּא יִפֹּ֑ל וְ֝/כֶ/עָלֶ֗ה צַדִּיקִ֥ים יִפְרָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: fr
  text: 'Qui met sa confiance dans sa richesse tombera,

    mais les justes s’épanouiront comme le feuillage.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « comme une feuille » (le nom hébreu est au singulier).'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: met sa confiance
  rationale: Le participe de בטח exprime le fait de placer sa confiance en quelque chose. « Met sa confiance » restitue clairement cette orientation active et convient au registre sapientiel.
- source_word: בְּעָשְׁרוֹ
  choice: dans sa richesse
  rationale: עֹשֶׁר désigne la richesse ou les biens. Le singulier « sa richesse » suit la forme hébraïque et exprime naturellement ce qui devient une sécurité mal placée.
- source_word: הוּא
  choice: implicite
  rationale: Le pronom indépendant renforce le sujet en hébreu. En français, la tournure « Qui… tombera » porte suffisamment le contraste sans ajouter un pronom lourd.
- source_word: יִפֹּל
  choice: tombera
  rationale: L’imparfait hébreu énonce ici la conséquence générale d’une conduite. Le futur français conserve à la fois la portée proverbiale et l’idée de conséquence, sans préciser la nature de la chute.
- source_word: וְכֶעָלֶה
  choice: comme le feuillage
  rationale: עָלֶה est morphologiquement singulier (« feuille »), mais peut évoquer ici, dans la comparaison avec le pluriel « les justes », une image collective de végétation vigoureuse. « Comme le feuillage » rend cette image naturellement; la forme plus littérale est signalée en note.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif masculin pluriel est substantivé. « Les justes » est concis, courant dans le registre biblique français et n’ajoute aucune précision absente du texte.
- source_word: יִפְרָחוּ
  choice: s’épanouiront
  rationale: פרח signifie pousser, fleurir ou s’épanouir. « S’épanouiront » conserve l’image végétale tout en exprimant naturellement la prospérité des justes.
theological_decisions:
- issue: Portée générique du participe masculin singulier initial
  choice: Qui met sa confiance dans sa richesse
  alternative: Celui qui met sa confiance dans sa richesse
  rationale: Le masculin singulier hébreu a une valeur générique dans le proverbe. La relative sans antécédent « Qui… » garde cette portée générale en français naturel sans restreindre artificiellement l’énoncé aux hommes.
- issue: Nature de la comparaison avec עָלֶה
  choice: comme le feuillage
  alternative: comme une feuille
  rationale: Le substantif hébreu est au singulier, mais l’image peut fonctionner collectivement et évoquer une végétation florissante. Le texte principal privilégie cette force imagée tout en conservant la lecture formelle dans une note.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme entre la chute de la personne qui se fie à sa richesse et l’épanouissement des justes est conservé sur deux lignes.
