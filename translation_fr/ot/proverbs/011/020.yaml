id: PRO.11.20
reference: Proverbs 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: fr
  text: Yahweh a en horreur ceux dont le cœur est tortueux[a], mais il prend plaisir à ceux dont la conduite est intègre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux dont le cœur est pervers ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « ceux qui sont intègres de chemin », c’est-à-dire ceux dont la manière de vivre est droite et cohérente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: a en horreur
  rationale: Cette expression française naturelle conserve la forte répulsion morale exprimée par le nom hébreu, tout en rendant clairement la proposition nominale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: עִקְּשֵׁי לֵב
  choice: ceux dont le cœur est tortueux
  rationale: « Tortueux » maintient l’image d’une déviation morale intérieure, tandis que « cœur » conserve l’anthropologie hébraïque englobant la pensée, la volonté et les dispositions profondes.
- source_word: וּרְצוֹנוֹ
  choice: il prend plaisir à
  rationale: Cette tournure idiomatique exprime le plaisir, l’approbation ou la faveur et forme en français un contraste net avec « a en horreur ».
- source_word: תְּמִימֵי דָרֶךְ
  choice: ceux dont la conduite est intègre
  rationale: Dans la littérature sapientiale, « chemin » désigne souvent la manière de vivre. « Conduite » explicite ce sens, et « intègre » rend l’idée de totalité morale et d’irréprochabilité sans prétendre à une perfection absolue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; conserver le nom propre distingue celui-ci d’un simple titre.
- issue: Sens anthropologique de לֵב (« cœur »)
  choice: Conserver « cœur »
  alternative: esprit / être intérieur
  rationale: « Cœur » préserve l’image biblique et sa portée à la fois morale, intellectuelle et volitive, sans la réduire à une seule faculté.
- issue: Portée de תָּמִים dans תְּמִימֵי דָרֶךְ
  choice: intègre
  alternative: irréprochable / parfait
  rationale: « Intègre » exprime ici la droiture et la cohérence de la conduite sans imposer au proverbe l’idée théologique d’une perfection sans péché.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique est conservé; les propositions nominales hébraïques sont reformulées verbalement pour produire une phrase française naturelle.
