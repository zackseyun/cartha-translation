source:
  edition: WLC
  text: עוֹכֵ֣ר בֵּ֭ית/וֹ יִנְחַל ר֑וּחַ וְ/עֶ֥בֶד אֱ֝וִ֗יל לַ/חֲכַם לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: fr
  text: Qui attire le malheur sur sa propre maison[a] héritera du vent[b], et l’insensé sera le serviteur de celui qui a le cœur sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » peut désigner la maisonnée ou la famille, et non seulement l’habitation.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’héritera de rien » ou « héritera du vide » ; en hébreu, le « vent » évoque ici ce qui est inconsistant ou vain.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: attire le malheur sur
  rationale: Le participe désigne celui qui cause des troubles ou un malheur. Cette formulation française garde le sens actif sans impliquer nécessairement une destruction totale.
- source_word: בֵּיתוֹ
  choice: sa propre maison
  rationale: Le mot hébreu peut désigner la maison, mais aussi la maisonnée ou la famille. « Sa propre maison » conserve l’image concrète tout en permettant le sens collectif.
- source_word: יִנְחַל
  choice: héritera
  rationale: 'Le verbe signifie couramment « hériter » ou « prendre possession ». « Héritera » préserve l’ironie du proverbe : le seul héritage obtenu est du vent.'
- source_word: רוּחַ
  choice: vent
  rationale: Dans ce contexte, le terme évoque probablement ce qui est inconsistant, vide ou vain. Garder « vent » préserve la métaphore hébraïque.
- source_word: וְעֶבֶד
  choice: sera le serviteur
  rationale: La proposition nominale implique ici un résultat. « Sera le serviteur » fournit une prédication naturelle en français sans renforcer indûment le terme en « esclave ».
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Terme fréquent de la littérature de sagesse pour une personne dépourvue de discernement moral et pratique. « L’insensé » convient au registre proverbial français.
- source_word: לַחֲכַם־לֵב
  choice: de celui qui a le cœur sage
  rationale: L’expression décrit une personne caractérisée intérieurement par la sagesse. Cette formulation naturelle conserve l’image hébraïque du cœur.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. La formulation reste digne et accessible, conserve les images concrètes de la maison, de l’héritage, du vent et du cœur, et évite le terme plus fortement marqué « esclave ».
