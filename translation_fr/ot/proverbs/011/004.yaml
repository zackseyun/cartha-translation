id: PRO.11.4
reference: Proverbs 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: fr
  text: La richesse ne sert à rien au jour de la colère[a], mais la justice[b] délivre de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le jour de la colère » peut désigner de manière générale un temps de jugement ou de calamité; le proverbe ne précise pas davantage.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut aussi être rendu par « droiture » ou « conduite juste » dans les textes de sagesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: la richesse
  rationale: Le terme désigne les biens matériels ou la fortune. « La richesse » est naturel en français moderne et conserve la portée générale du singulier collectif hébreu.
- source_word: יוֹעִיל
  choice: ne sert à rien
  rationale: Le hifil de יעל exprime ce qui profite, est utile ou procure un avantage. Cette tournure française rend clairement l’inefficacité de la richesse dans la situation évoquée.
- source_word: בְּיוֹם עֶבְרָה
  choice: au jour de la colère
  rationale: La préposition ב marque ici le temps, et עֶבְרָה désigne une colère intense, voire la fureur. La formulation reste proche de l’hébreu sans préciser si ce jour est un jugement divin, une calamité ou les deux.
- source_word: צְדָקָה
  choice: la justice
  rationale: Dans les Proverbes, צְדָקָה évoque la conformité à ce qui est droit, manifestée dans la conduite. « Justice » est idiomatique en français et garde à la fois les dimensions morale et relationnelle du terme; une note signale l’autre rendu majeur.
- source_word: תַּצִּיל
  choice: délivre
  rationale: Le hifil de נצל signifie arracher au danger, sauver ou délivrer. « Délivre » conserve la concision et le parallélisme du proverbe.
- source_word: מִמָּוֶת
  choice: de la mort
  rationale: La formulation traduit directement l’expression hébraïque, sans la réduire à la seule idée de danger mortel.
theological_decisions:
- issue: Sens du « jour de la colère »
  choice: Une période décisive de colère ou de jugement, laissée sans précision supplémentaire.
  alternative: Un jour de calamité humaine, ou plus précisément le jour eschatologique du jugement divin.
  rationale: Le texte permet un cadre de jugement, mais ne dit pas explicitement de quelle colère il s’agit ni ne définit ce « jour » dans un système eschatologique.
- issue: La justice délivre de la mort
  choice: Le proverbe affirme, dans le langage propre à la sagesse, le pouvoir salvateur de la conduite juste.
  alternative: La droiture préserve concrètement des conséquences mortelles, ou la justice devant Dieu garantit un salut ultime.
  rationale: La traduction maintient l’affirmation forte du texte sans l’assimiler à une formulation technique concernant la justification ou le salut éternel.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, ainsi que les termes directs « colère », « justice » et « mort ». Les notes préservent les principales ambiguïtés lexicales et théologiques sans alourdir le texte.
