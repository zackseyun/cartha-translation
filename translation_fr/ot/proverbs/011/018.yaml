id: PRO.11.18
reference: Proverbs 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: fr
  text: Le méchant obtient un gain trompeur[a], mais celui qui sème la droiture reçoit une récompense véritable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accomplit une œuvre de fausseté » ou « travaille pour un salaire illusoire » ; l’expression hébraïque peut désigner soit une œuvre marquée par la fausseté, soit un travail dont le résultat se révèle vain.
    reason: lexical_alternative
  - marker: b
    text: Ou « une récompense sûre » ou « un salaire fiable » ; littéralement « une récompense de vérité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le nom masculin singulier a ici une valeur générique et proverbiale. Cette formulation française est concise et naturelle.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: accomplit une œuvre trompeuse
  rationale: La formulation reste proche de « fait/accomplit une œuvre de fausseté » et conserve l’ambiguïté entre une activité fondée sur la tromperie et un travail dont le résultat se révèle illusoire.
- source_word: שָׁקֶר
  choice: trompeuse
  rationale: Le terme peut exprimer la fausseté, la tromperie ou le caractère illusoire et peu fiable de ce qui est obtenu.
- source_word: וְזֹרֵעַ
  choice: mais celui qui sème
  rationale: Dans ce proverbe antithétique, la conjonction introduit naturellement un contraste. Le participe singulier est rendu par une tournure proverbiale fluide.
- source_word: צְדָקָה
  choice: la justice
  rationale: En français biblique moderne, « justice » exprime à la fois la conduite droite et sa dimension morale, sans réduire le terme à la seule justice judiciaire.
- source_word: שֶׂכֶר אֱמֶת
  choice: une récompense véritable
  rationale: 'Littéralement « une récompense de vérité » : la formule désigne une récompense réelle et fiable, par contraste avec l’œuvre trompeuse du premier membre.'
theological_decisions:
- issue: Portée de צְדָקָה
  choice: la justice
  alternative: ce qui est juste / la droiture
  rationale: « Justice » conserve l’ampleur éthique du terme hébreu et demeure idiomatique dans l’image de semer, sans imposer une lecture exclusivement juridique ou confessionnelle.
- issue: Valeur de שֶׂכֶר אֱמֶת
  choice: une récompense véritable
  alternative: une récompense sûre / un salaire fiable
  rationale: « Véritable » maintient le contraste avec שָׁקֶר tout en laissant entendre que la récompense est authentique et non illusoire; la note signale sa nuance de fiabilité.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique et l’image agricole sont conservées; les deux expressions nominales ambiguës sont rendues lisiblement sans effacer leurs autres sens possibles, indiqués en notes.
