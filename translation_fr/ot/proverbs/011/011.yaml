id: PRO.11.11
reference: Proverbs 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/בִרְכַּ֣ת יְ֭שָׁרִים תָּר֣וּם קָ֑רֶת וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים תֵּהָרֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: fr
  text: Par la bénédiction des hommes droits, une ville s’élève[a] ; mais par la bouche des méchants, elle est renversée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Grâce à la bénédiction des hommes droits, une ville prospère. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la bouche des méchants » ; cette image souligne le pouvoir destructeur de leurs paroles.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּבִרְכַּת
  choice: Par la bénédiction de
  rationale: La préposition בְּ exprime ici le moyen (« par »), tandis que בְּרָכָה désigne la bénédiction. La formulation conserve la concision du proverbe et peut évoquer aussi bien les paroles bienfaisantes que l’influence bénéfique des hommes droits.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: יָשָׁר caractérise ceux dont la conduite est moralement droite. « Les hommes droits » est naturel en français moderne et garde la portée éthique sans la préciser excessivement.
- source_word: תָּרוּם
  choice: s’élève
  rationale: Le verbe רוּם signifie s’élever ou être élevé. « S’élève » préserve à la fois l’image d’élévation et son sens figuré de prospérité ou de prestige civique.
- source_word: קָרֶת
  choice: une ville
  rationale: קָרֶת désigne une ville ou une cité. « Une ville » est le terme courant qui convient à la portée collective du proverbe.
- source_word: וּבְפִי
  choice: mais par la bouche de
  rationale: La conjonction introduit l’antithèse, et בְּ marque de nouveau le moyen. Garder l’image de la « bouche » reste naturel en français et met en relief la puissance destructrice de la parole.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: רָשָׁע désigne couramment, dans la littérature sapientiale, ceux dont la conduite est mauvaise. « Les méchants » est une traduction directe et traditionnelle, encore intelligible aujourd’hui.
- source_word: תֵּהָרֵס
  choice: elle est renversée
  rationale: Le niphal de הרס exprime le fait d’être démoli, abattu ou renversé. « Elle est renversée » conserve la valeur passive et forme une antithèse nette avec « s’élève ».
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. La structure antithétique et l’image hébraïque de la bouche sont conservées. Le choix de « s’élève » maintient l’ambiguïté entre élévation, prestige et prospérité.
