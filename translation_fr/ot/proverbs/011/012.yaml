id: PRO.11.12
reference: Proverbs 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: fr
  text: Celui qui méprise son prochain[a] manque de bon sens[b], mais un homme[c] doué de discernement garde le silence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ami » ou « son compagnon ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « manque de cœur » ; en hébreu, cette expression évoque un manque de jugement ou d’intelligence.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie ici le masculin singulier dans un sens représentatif, qui peut désigner toute personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: méprise
  rationale: Le participe exprime le fait de traiter quelqu’un avec mépris. « Méprise » est concis, naturel et maintient le contraste moral du proverbe.
- source_word: לְרֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner un ami, un compagnon ou un prochain. « Son prochain » conserve ici la portée sociale générale du terme sans la limiter à une amitié étroite.
- source_word: חֲסַר לֵב
  choice: manque de bon sens
  rationale: L’expression signifie littéralement « manque de cœur », mais le cœur désigne ici la faculté de juger et de comprendre. « Manque de bon sens » rend clairement cet idiome en français moderne.
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: mais un homme doué de discernement
  rationale: אִישׁ est un masculin singulier employé de façon représentative, tandis que תְּבוּנוֹת, formellement pluriel, caractérise une personne pourvue de discernement. La formulation française reste naturelle et proche de cette structure.
- source_word: יַחֲרִישׁ
  choice: garde le silence
  rationale: Le verbe exprime ici le fait de se taire. « Garde le silence » suggère la retenue volontaire qui s’oppose au mépris manifesté envers autrui.
theological_decisions:
- issue: Masculin représentatif dans וְאִישׁ
  choice: un homme doué de discernement
  alternative: une personne douée de discernement
  rationale: L’hébreu emploie le masculin singulier dans une maxime de portée générale. La traduction conserve cette forme tout en signalant qu’elle représente ici toute personne.
translation_notes:
  register: Français moderne, clair et digne. La structure antithétique du proverbe est conservée, ainsi que le masculin représentatif de l’hébreu, explicité en note.
