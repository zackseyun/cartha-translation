source:
  edition: WLC
  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: fr
  text: Qui recherche avec empressement le bien[a] recherche la faveur[b], mais celui qui recherche le mal, le mal lui arrivera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui cherche le bien de bon matin » ; le verbe hébreu peut évoquer une recherche empressée ou matinale.'
    reason: lexical_alternative
  - marker: b
    text: La « faveur » peut désigner l’agrément ou la bienveillance de Dieu, des humains, ou des deux.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il viendra à lui » ; le sujet sous-entendu est le mal mentionné juste avant.'
    reason: translation_clarity
lexical_decisions:
- source_word: שֹׁחֵר
  choice: recherche ardemment
  rationale: Le participe exprime une recherche empressée, assidue ou matinale. « Recherche ardemment » restitue naturellement en français l’idée d’intensité sans imposer le sens temporel possible.
- source_word: טוֹב
  choice: le bien
  rationale: L’adjectif est employé comme substantif et désigne largement ce qui est bon, sur les plans moral et pratique.
- source_word: יְבַקֵּשׁ
  choice: recherche
  rationale: Ce verbe courant signifie « chercher » ou « rechercher ». La répétition de « recherche » conserve le parallélisme lexical du premier membre.
- source_word: רָצוֹן
  choice: la faveur
  rationale: Le nom peut désigner la faveur, l’agrément ou la bienveillance. « La faveur » reste concis et ne précise pas si elle vient de Dieu, des humains ou des deux.
- source_word: וְדֹרֵשׁ
  choice: mais celui qui recherche
  rationale: La conjonction, littéralement « et », introduit ici le contraste du parallélisme antithétique. « Mais » rend ce rapport clairement en français moderne.
- source_word: רָעָה
  choice: le mal
  rationale: Le terme peut évoquer à la fois le mal moral et le malheur qui en résulte. « Le mal » préserve cette amplitude et renforce le retournement du proverbe.
- source_word: תְבוֹאֶנּוּ
  choice: le mal viendra à lui
  rationale: Le verbe signifie « venir » et porte un suffixe masculin singulier, « à lui ». La reprise explicite de « le mal » clarifie le sujet en français tout en gardant la formulation prospective de l’hébreu.
theological_decisions:
- issue: Origine de la faveur exprimée par רָצוֹן
  choice: Laisser « la faveur » sans en préciser la source.
  alternative: « La faveur de Dieu » ou « la faveur des autres »
  rationale: L’hébreu ne nomme pas celui qui accorde cette faveur. La formulation large conserve donc l’ambiguïté entre faveur divine, faveur humaine, ou les deux.
- issue: Rapport entre le mal recherché et le mal qui survient
  choice: Employer « le mal » dans les deux propositions.
  alternative: Distinguer « le mal » recherché du « malheur » qui atteint la personne.
  rationale: La répétition préserve le jeu intentionnel de l’hébreu et sa tension entre mal moral et conséquence nuisible, sans réduire le second emploi à la seule calamité.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique est conservé, ainsi que la répétition de « rechercher » et de « le mal ». L’expression « recherche ardemment » rend l’intensité du premier verbe sans faire du sens temporel une certitude.
