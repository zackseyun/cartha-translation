  text: בְּ/אֵ֣ין תַּ֭חְבֻּלוֹת יִפָּל עָ֑ם וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: fr
  text: Sans direction avisée, un peuple tombe[a] ; mais avec de nombreux conseillers, il y a délivrance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Là où il n’y a pas de stratégie, un peuple tombe ; mais avec une multitude de conseillers, il y a sécurité ou victoire. »'
    reason: 'Alternative lexicale et syntaxique : תַּחְבֻּלוֹת peut désigner une stratégie ou une conduite avisée, et תְּשׁוּעָה peut évoquer la sécurité ou la victoire, en plus de la délivrance.'
lexical_decisions:
- source_word: בְּ/אֵין
  choice: Faute de
  rationale: La construction exprime l’absence de quelque chose. « Faute de » est concise, naturelle en français et convient à la formulation d’un principe général.
- source_word: תַּחְבֻּלוֹת
  choice: directives
  rationale: Le nom évoque la conduite avisée, l’orientation ou la stratégie. « Directives » rend ici l’idée d’une direction permettant de bien conduire le peuple, tout en restant distinct de « conseillers » dans le second membre.
- source_word: יִפָּל
  choice: tombe
  rationale: Le verbe signifie littéralement « tomber ». Ce choix conserve la métaphore hébraïque sans préciser s’il s’agit de ruine, d’effondrement ou de défaite.
- source_word: עָם
  choice: un peuple
  rationale: La forme sans article énonce une vérité générale ; « un peuple » respecte cette portée proverbiale sans imposer le sens plus politique de « nation ».
- source_word: וּ/תְשׁוּעָה
  choice: il trouve la délivrance
  rationale: תְּשׁוּעָה peut désigner la délivrance, le salut, la sécurité ou la victoire. « Délivrance » conserve cette amplitude ; la tournure « il trouve » rend naturellement en français la proposition nominale hébraïque.
- source_word: בְּ/רֹב
  choice: avec de nombreux
  rationale: L’expression indique la multiplicité ou l’abondance. « Avec de nombreux » est idiomatique et met clairement en relief le nombre des conseillers.
- source_word: יוֹעֵץ
  choice: conseillers
  rationale: Bien que le mot soit morphologiquement singulier, la construction avec רֹב possède une valeur collective et désigne une pluralité de personnes qui donnent conseil.
theological_decisions:
- issue: Portée de תְּשׁוּעָה
  choice: délivrance
  alternative: sécurité ou victoire
  rationale: Le contexte civique peut suggérer la préservation ou la victoire, mais le terme hébreu est plus large. Le texte principal garde donc « délivrance », tandis que la note signale les principales nuances possibles.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, ainsi que la métaphore ouverte de la chute. Le point-virgule marque nettement les deux membres du verset.
