  text: צִדְקַ֣ת יְ֭שָׁרִים תַּצִּילֵ֑/ם וּ֝/בְ/הַוַּ֗ת בֹּגְדִ֥ים יִלָּכֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: fr
  text: La justice des hommes droits les délivre, mais les perfides sont pris au piège par leur propre avidité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais les perfides sont pris dans leur malheur » ou « par leur destruction ». Le nom hébreu peut désigner soit un désir avide et destructeur, soit le malheur ou la ruine. Le texte retient ici le désir intérieur qui les prend au piège.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: la justice
  rationale: Le nom construit צְדָקָה désigne ici la qualité et la conduite de celui qui agit conformément au droit. « Justice » est naturel en français biblique moderne et conserve le lien avec la famille lexicale de « juste ».
- source_word: יְשָׁרִים
  choice: des hommes droits
  rationale: Le terme désigne des personnes moralement droites. « Hommes droits » exprime clairement cette catégorie éthique sans suggérer la simple franchise verbale.
- source_word: תַּצִּילֵם
  choice: les délivre
  rationale: Le hiphil de נצל signifie arracher au danger ou délivrer. « Délivre » convient au registre sapientiel tout en restant compréhensible et sans imposer ici un sens sotériologique spécialisé.
- source_word: וּבְהַוַּת
  choice: par leur propre avidité
  rationale: הַוָּה peut évoquer un désir avide et destructeur, mais aussi le malheur ou la ruine. Le ב est compris comme instrumental; « leur propre avidité » fait ressortir le désir intérieur qui devient le moyen de leur capture, tandis que l’autre lecture est conservée en note.
- source_word: בֹּגְדִים
  choice: les traîtres
  rationale: Le participe de בגד désigne ceux qui agissent avec perfidie ou déloyauté. « Traîtres » est concis et garde la force morale du terme, sans le limiter explicitement à l’apostasie religieuse.
- source_word: יִלָּכֵדוּ
  choice: sont pris au piège
  rationale: Le niphal de לכד exprime le fait d’être saisi ou piégé. « Sont pris au piège » rend naturellement l’image d’un désir qui se retourne contre les perfides.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’antithèse concise du proverbe et signale en note l’ambiguïté réelle de הַוָּה.
