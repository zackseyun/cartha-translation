  text: הוֹלֵ֣ךְ רָ֭כִיל מְגַלֶּה סּ֑וֹד וְ/נֶאֱמַן ר֝֗וּחַ מְכַסֶּ֥ה דָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/013.yaml
  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
translation:
  language: fr
  text: Celui qui colporte des commérages[a] révèle un secret, mais celui qui est digne de confiance garde une affaire pour lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui va de-ci de-là en colportant des propos révèle un secret. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui qui est fidèle d’esprit couvre une affaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: Qui va colportant des médisances
  rationale: L’expression décrit littéralement quelqu’un qui va de-ci de-là comme colporteur de propos nuisibles. Cette formulation française conserve l’idée de comportement habituel et itinérant sans limiter le sens à une accusation nécessairement fausse.
- source_word: מְגַלֶּה
  choice: dévoile
  rationale: Le participe signifie rendre public ou mettre au jour; « dévoile » convient naturellement à l’objet « un secret ».
- source_word: סּוֹד
  choice: un secret
  rationale: Dans ce parallélisme, le mot désigne une information privée ou confidentielle, plutôt qu’un conseil ou une assemblée.
- source_word: נֶאֱמַן רוּחַ
  choice: qui est fidèle d’esprit
  rationale: Ce rendu conserve la mention explicite de l’esprit et l’idée d’une fidélité intérieure qui se manifeste par la discrétion.
- source_word: מְכַסֶּה
  choice: garde […] secrète
  rationale: Littéralement « couvre ». Dans ce contexte, l’expression française rend clairement le fait de ne pas divulguer une information tout en évitant l’ambiguïté possible de « couvre ».
- source_word: דָבָר
  choice: une affaire
  rationale: Le terme est volontairement large et peut désigner une parole, une chose ou une affaire; ici, « affaire » convient au contenu confidentiel évoqué par le parallélisme.
