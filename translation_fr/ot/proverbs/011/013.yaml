review_pass:
  verdict: revise
  source_fidelity: Le premier membre hébreu décrit celui qui circule en colportant des propos (רכיל), avec l’idée de commérage ou de dénonciation, sans exiger que ces propos soient des « médisances » au sens de paroles nécessairement malveillantes ou diffamatoires. Le second membre oppose cette divulgation à la discrétion d’une personne fiable. « Garde une affaire pour lui » rend bien le sens figuré de « couvre une affaire », sans suggérer qu’il s’agit forcément de dissimuler une faute.
  naturalness: '« Qui va colportant des médisances » est peu naturel en français contemporain : la construction est lourde et « médisances » resserre indûment le sens. La formulation révisée est idiomatique, proverbiale et accessible en français international.'
  terminology: « Celui qui est digne de confiance » est une expression française naturelle pour נֶאֱמַן רוּחַ dans ce contexte et exprime la fiabilité intérieure impliquée. « Affaire » maintient l’ampleur de דָבָר; « pour lui » explicite naturellement la métaphore hébraïque de couvrir.
