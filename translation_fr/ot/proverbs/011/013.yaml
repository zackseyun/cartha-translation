revisions:
- from: Qui va colportant des médisances dévoile un secret[a], mais qui est fidèle d’esprit garde une affaire secrète[b].
  to: Celui qui colporte des commérages[a] révèle un secret, mais celui qui est digne de confiance garde une affaire pour lui[b].
  rationale: La révision remplace une tournure peu naturelle et un terme trop restrictif par « colporte des commérages », qui rend le comportement caractéristique décrit par l’hébreu sans affirmer la fausseté ou la malveillance des propos. Elle rend נֶאֱמַן רוּחַ de façon idiomatique par « celui qui est digne de confiance » et conserve, en note, la formulation littérale incluant « esprit » et « couvre ».
