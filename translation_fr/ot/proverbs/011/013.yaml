    rationale: Elle ne correspond pas au français moderne international recherché; l’idée habituelle portée par le participe hébreu peut être rendue sans la reproduire littéralement.
  - severity: low
    issue: La note a est ancrée à « un secret » alors qu’elle propose une reformulation du premier membre entier.
    rationale: L’ancre est plus claire après l’expression initiale à laquelle porte l’alternative lexicale.
