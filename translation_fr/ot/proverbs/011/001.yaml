  text: מֹאזְנֵ֣י מִ֭רְמָה תּוֹעֲבַ֣ת יְהוָ֑ה וְ/אֶ֖בֶן שְׁלֵמָ֣ה רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
translation:
  language: fr
  text: Des balances frauduleuses sont une abomination pour Yahweh, mais un poids exact lui est agréable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  choice: une balance faussée
  rationale: L’expression désigne une balance servant à tromper. « Faussée » est naturel en français commercial et conserve l’image concrète d’un instrument de pesage frauduleux.
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Ce terme exprime une réprobation morale très forte. « Abomination » en préserve la vigueur biblique sans l’atténuer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa transcription préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: אֶבֶן שְׁלֵמָה
  choice: un poids juste
  rationale: Littéralement, il s’agit d’une « pierre entière », c’est-à-dire d’un poids étalon complet et conforme. « Poids juste » rend clairement sa fonction commerciale et son opposition à la balance faussée.
- source_word: רְצוֹנוֹ
  choice: lui est agréable
  rationale: Le nom peut exprimer le plaisir, l’agrément ou la faveur. Cette tournure française restitue naturellement l’évaluation positive de Yahweh en parallèle avec « abomination ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le représente directement au lieu de le remplacer par un titre.
- issue: Portée de רְצוֹנוֹ
  choice: lui est agréable
  alternative: obtient sa faveur
  rationale: Le mot peut désigner soit ce qui procure du plaisir, soit ce qui reçoit la faveur. La formulation retenue préserve le sens évaluatif dans l’antithèse sans transformer explicitement le verset en promesse de faveur.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique de l’hébreu est conservé, avec un vocabulaire dignifié mais immédiatement compréhensible.
