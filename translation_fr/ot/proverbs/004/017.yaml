source:
  edition: WLC
  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: fr
  text: Car ils mangent le pain de la méchanceté[a] et boivent le vin de la violence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « ils se nourrissent du pain de la méchanceté ». Le verbe hébreu peut exprimer l’idée de consommer ou de se nourrir, mais « mangent » correspond directement au parallèle avec « boivent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le vin des violences ». Le pluriel hébreu semble donner au mot une valeur intensive ou collective ; en français, « le vin de la violence » est plus naturel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’avertissement précédent ; « car » en conserve naturellement la valeur explicative.
- source_word: לָחֲמוּ
  choice: ils mangent
  rationale: Le verbe לחם II signifie ici « manger, consommer ». « Ils mangent » est le rendu le plus direct et maintient le parallélisme avec « boivent ».
- source_word: לֶחֶם
  choice: le pain
  rationale: Le sens concret de « pain » est conservé, notamment parce que l’image forme un couple poétique avec le vin.
- source_word: רֶשַׁע
  choice: la méchanceté
  rationale: Dans la littérature de sagesse, le terme désigne le mal moral ou la conduite mauvaise. « Méchanceté » convient à cette construction imagée sans en préciser abusivement le sens.
- source_word: וְיֵין
  choice: et … le vin
  rationale: La conjonction relie les deux membres parallèles ; le verbe français « boivent » traduit le verbe hébreu placé à la fin du second membre.
- source_word: חֲמָסִים
  choice: la violence
  rationale: Bien que le mot hébreu soit au pluriel, il a ici une valeur intensive ou collective. Le singulier abstrait est naturel en français, tandis qu’une note signale la forme source.
- source_word: יִשְׁתּוּ
  choice: boivent
  rationale: Le verbe est rendu directement et conserve le parallélisme manger/boire de l’hébreu.
