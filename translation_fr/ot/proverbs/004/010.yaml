id: PRO.4.10
reference: Proverbs 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: fr
  text: Écoute[a], mon fils, et reçois mes paroles[b] ; les années de ta vie seront nombreuses[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Entends » ; le verbe peut aussi impliquer l’attention et l’obéissance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « prends mes paroles » ; autre traduction possible : « accueille mes paroles ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « les années de ta vie augmenteront » ou « se multiplieront ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif appelle non seulement à entendre, mais à prêter une attention réceptive. « Écoute » exprime naturellement cette nuance en français.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le vocatif hébreu est masculin singulier et appartient au cadre littéraire où un père instruit son fils.
- source_word: וְקַח
  choice: et reçois
  rationale: Le verbe signifie littéralement « prendre », mais, avec « mes paroles », « recevoir » rend plus naturellement l’idée d’accueillir un enseignement.
- source_word: אֲמָרָי
  choice: mes paroles
  rationale: Cette traduction directe et naturelle conserve le pluriel et le suffixe possessif de la première personne.
- source_word: וְיִרְבּוּ
  choice: seront nombreuses
  rationale: Le verbe רבה peut signifier « devenir nombreux », « augmenter » ou « se multiplier ». Avec « années », cette formulation exprime idiomatiquement le résultat promis.
- source_word: לְךָ שְׁנוֹת חַיִּים
  choice: les années de ta vie
  rationale: Le datif « pour toi » est rendu naturellement par le possessif français, sans alourdir la phrase.
theological_decisions:
- issue: Adresse genrée dans l’instruction de sagesse
  choice: mon fils
  alternative: mon enfant
  rationale: L’hébreu est explicitement masculin singulier et met en scène l’instruction d’un fils ; neutraliser l’expression effacerait un trait du texte.
- issue: Nature de la promesse de longévité
  choice: les années de ta vie seront nombreuses
  alternative: les années de ta vie augmenteront / se multiplieront
  rationale: La formulation conserve la promesse telle qu’elle est exprimée, sans préciser si elle doit être comprise comme une garantie absolue, un principe sapientiel ou une conséquence générale.
translation_notes:
  register: Français international moderne, clair et digne. « Écoute » et « reçois » gardent la forme exhortative du discours paternel. Le point-virgule marque le passage de l’exhortation à sa conséquence sans ajouter un connecteur explicatif absent de l’hébreu.
