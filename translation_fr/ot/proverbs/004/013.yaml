  yaml_path: translation/ot/proverbs/004/013.yaml
  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
translation:
  language: fr
  text: Attache-toi fermement à l’instruction[a] ; ne la lâche pas. Garde-la, car elle est ta vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « discipline » ou « correction ». Le mot hébreu moussar désigne un enseignement formateur qui comporte aussi l’idée de discipline.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק בַּמּוּסָר
  choice: Attache-toi fermement à l’instruction
  rationale: L’expression rend l’impératif énergique et l’idée d’une prise maintenue, tout en restant naturelle en français. « Instruction » désigne ici un enseignement qui forme et discipline.
- source_word: אַל תֶּרֶף
  choice: ne la lâche pas
  rationale: Le verbe évoque le relâchement de la prise. Cette formulation prolonge clairement l’image de l’attachement ferme.
- source_word: נִצְּרֶהָ
  choice: Garde-la
  rationale: נצר exprime l’action de garder, protéger ou préserver. Le pronom féminin renvoie naturellement à « l’instruction » en français et conserve la reprise féminine du texte hébreu.
- source_word: כִּי הִיא חַיֶּיךָ
  choice: car elle est ta vie
  rationale: La formulation conserve l’affirmation forte et directe du texte. חַיִּים, bien que de forme plurielle en hébreu, signifie ici idiomatiquement « vie ».
theological_decisions: []
