id: PRO.4.1
reference: Proverbs 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֣וּ בָ֭נִים מ֣וּסַר אָ֑ב וְ֝/הַקְשִׁ֗יבוּ לָ/דַ֥עַת בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: fr
  text: Fils[a], écoutez l’instruction d’un père ; soyez attentifs afin d’acquérir du discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants ». L’hébreu dit « fils », conformément à la mise en scène, fréquente dans les Proverbes, d’un père s’adressant à ses fils.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif pluriel appelle à une écoute attentive. « Écoutez » est direct, naturel en français et convient au cadre sapientiel.
- source_word: בָנִים
  choice: fils
  rationale: Le nom hébreu est explicitement masculin pluriel et maintient la mise en scène d’un père s’adressant à ses fils. Une note signale la portée possible de « enfants ».
- source_word: מוּסַר
  choice: instruction
  rationale: Dans la littérature de sagesse, le terme désigne une formation qui peut inclure discipline et correction. « Instruction » convient au contexte didactique sans exclure cette dimension formative.
- source_word: אָב
  choice: d’un père
  rationale: Le groupe construit est indéfini. « D’un père » respecte cette indétermination sans introduire le possessif « mon ».
- source_word: וְהַקְשִׁיבוּ
  choice: soyez attentifs
  rationale: Ce second impératif souligne l’attention soutenue et se distingue ainsi du simple appel initial à écouter.
- source_word: לָדַעַת
  choice: afin d’acquérir
  rationale: L’infinitif précédé de ל exprime ici le but. Avec un nom abstrait de sagesse, « acquérir » rend idiomatiquement l’accès à cette capacité sans réduire le verbe à une connaissance purement théorique.
- source_word: בִּינָה
  choice: du discernement
  rationale: Ce terme sapientiel désigne la faculté de comprendre et de distinguer avec justesse. « Discernement » est naturel dans cette formulation et conserve sa portée pratique.
theological_decisions:
- issue: Adresse masculine dans l’enseignement sapientiel
  choice: fils
  alternative: enfants
  rationale: Le texte hébreu emploie le masculin pluriel et conserve une relation littéraire de père à fils. La traduction ne neutralise donc pas cette forme, tout en indiquant en note l’autre rendu possible.
translation_notes:
  register: Français moderne, sobre et digne. L’apostrophe initiale « Fils » garde la forme pédagogique du texte hébreu ; le point-virgule met en relief les deux impératifs parallèles.
