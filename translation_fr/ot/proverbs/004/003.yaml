revisions:
- from: Car j’étais un fils pour mon père, encore tendre et unique auprès de ma mère[a].
  to: Car j’étais le fils de mon père, tendre et unique aux yeux de ma mère[a].
  rationale: La révision remplace deux calques peu naturels par une expression française idiomatique. « Le fils de mon père » conserve le référent masculin de בֵן et la relation filiale. « Unique aux yeux de ma mère » rend la valeur de לִפְנֵי comme perspective ou regard maternel et maintient l’ambiguïté lexicale de יָחִיד, explicitée en note.
