source:
  edition: WLC
  text: כִּי בֵ֭ן הָיִ֣יתִי לְ/אָבִ֑/י רַ֥ךְ וְ֝/יָחִ֗יד לִ/פְנֵ֥י אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/003.yaml
  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: fr
  text: Car j’étais le fils de mon père, tendre et unique aux yeux de ma mère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le seul aux yeux de ma mère » ; le mot hébreu peut aussi signifier « fils unique », « être unique » ou, selon le contexte, « bien-aimé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde l’exhortation paternelle dans le contexte.
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: j’étais un fils pour mon père
  rationale: Conserve le terme précis « fils » et la relation exprimée par la préposition ל, dans une formulation française compréhensible.
- source_word: רַךְ
  choice: encore tendre
  rationale: Évoque la jeunesse et la vulnérabilité sans réduire le mot au seul sens d’« enfant »; « encore » rend cette valeur plus naturelle en français.
- source_word: וְיָחִיד
  choice: et unique
  rationale: Préserve la gamme de sens de יָחִיד — seul, unique, éventuellement bien-aimé — sans préciser indûment « enfant unique » ou « fils unique ».
- source_word: לִפְנֵי אִמִּי
  choice: auprès de ma mère
  rationale: Rend naturellement la relation ou la présence exprimée par לִפְנֵי; le français littéral « devant ma mère » risquerait d’être compris dans un sens seulement spatial.
theological_decisions:
- issue: Portée de יָחִיד dans la relation à la mère
  choice: unique
  alternative: fils unique; enfant unique; bien-aimé
  rationale: Le texte hébreu ne tranche pas explicitement entre l’unicité familiale et la valeur affective; la traduction maintient cette tension lexicale.
translation_notes:
  register: Français moderne, digne et accessible. La construction « un fils pour mon père » conserve volontairement la tournure relationnelle de l’hébreu, tandis que « auprès de ma mère » évite le spatialisme de « devant ma mère ».
