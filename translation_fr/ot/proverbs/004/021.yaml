  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
translation:
  language: fr
  text: Qu’elles ne s’éloignent pas de tes yeux[a] ; garde-les au fond de ton cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’elles ne quittent pas ton regard. »'
    reason: lexical_alternative
  - marker: b
    text: Dans l’usage hébraïque, le « cœur » désigne la personne intérieure, notamment le siège de la pensée, de la volonté et des sentiments.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: Qu’elles ne… pas
  rationale: Rend naturellement en français moderne la défense exprimée par la particule hébraïque אַל.
- source_word: יַלִּיזוּ
  choice: s’éloignent
  rationale: Le verbe לוּז exprime ici l’idée de se détourner ou de s’écarter. « S’éloignent » préserve le mouvement figuré sans surinterpréter.
- source_word: מֵעֵינֶיךָ
  choice: de tes yeux
  rationale: Traduction concrète et proche de l’expression hébraïque, qui évoque le fait de garder continuellement ces paroles en vue et présentes à l’attention.
- source_word: שָׁמְרֵם
  choice: garde-les
  rationale: L’impératif de שׁמר peut signifier garder, conserver ou veiller sur. « Garde-les » conserve cette amplitude et convient au contexte.
- source_word: בְּתוֹךְ
  choice: au fond de
  rationale: Dans ce contexte, l’expression désigne l’intériorité. « Au fond de » est idiomatique en français tout en maintenant l’image d’un emplacement intérieur.
- source_word: לְבָבֶךָ
  choice: ton cœur
  rationale: « Cœur » préserve la métaphore hébraïque du centre intérieur de la pensée, de la volonté et des sentiments.
