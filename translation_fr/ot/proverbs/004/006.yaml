source:
  edition: WLC
  text: אַל תַּעַזְבֶ֥/הָ וְ/תִשְׁמְרֶ֑/ךָּ אֱהָבֶ֥/הָ וְ/תִצְּרֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/006.yaml
  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: fr
  text: Ne l’abandonne pas[a], et elle veillera sur toi ; aime-la, et elle te protégera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la sagesse, personnifiée comme une femme dans ce passage.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: Ne… pas
  rationale: Avec l’inaccompli, אַל exprime une interdiction. « Ne… pas » la rend naturellement sans ajouter l’insistance de « jamais ».
- source_word: תַּעַזְבֶהָ
  choice: l’abandonne
  rationale: עזב signifie « laisser, délaisser, abandonner ». « Abandonner » conserve ici la force relationnelle du verbe et convient à la sagesse personnifiée.
- source_word: וְתִשְׁמְרֶךָּ
  choice: et elle veillera sur toi
  rationale: שׁמר peut signifier garder, protéger ou veiller sur. Cette formulation française est naturelle et permet de distinguer légèrement ce verbe de נצר dans le second membre.
- source_word: אֱהָבֶהָ
  choice: aime-la
  rationale: אהב est le verbe courant signifiant « aimer » ; la traduction en conserve la simplicité et le suffixe féminin.
- source_word: וְתִצְּרֶךָּ
  choice: et elle te protégera
  rationale: נצר évoque la garde attentive et la préservation. « Protéger » exprime clairement cette nuance tout en évitant une répétition peu naturelle.
theological_decisions:
- issue: Personnification féminine de la sagesse
  choice: Conserver les pronoms féminins « la » et « elle »
  alternative: Employer « elle » en répétant explicitement « la sagesse », ou neutraliser la personnification
  rationale: Les suffixes hébreux sont féminins et renvoient, dans le contexte immédiat, à la sagesse personnifiée comme une femme. Le féminin préserve cette image littéraire sans imposer une identification doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé, avec une légère variation entre « veillera sur toi » et « te protégera » pour refléter les deux verbes hébreux.
