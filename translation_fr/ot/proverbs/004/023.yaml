id: PRO.4.23
reference: Proverbs 4:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִֽ/כָּל מִ֭שְׁמָר נְצֹ֣ר לִבֶּ֑/ךָ כִּֽי מִ֝מֶּ֗/נּוּ תּוֹצְא֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/023.yaml
  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
translation:
  language: fr
  text: Par-dessus tout, garde ton cœur[a], car de lui jaillissent les sources de la vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Plus que toute garde, garde ton cœur », ou : « Garde ton cœur plus que tout ce que tu gardes. » L’hébreu souligne ainsi une vigilance suprême.'
    reason: alternative lexicale et conservation du jeu de mots hébreu
  - marker: b
    text: 'Ou : « car de lui viennent les sorties, les débouchés de la vie ». Le mot hébreu peut désigner ce qui sort, les issues ou les sources.'
    reason: ambiguïté lexicale
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: Par-dessus tout
  rationale: 'La construction donne à la préposition מִן une valeur comparative ou superlative : le cœur doit faire l’objet de la vigilance suprême. Cette formulation est naturelle en français tout en conservant la priorité absolue exprimée par l’hébreu.'
- source_word: נְצֹר
  choice: garde
  rationale: L’impératif exprime une protection active et attentive. « Garde » est bref, vigoureux et appartient au même champ lexical que מִשְׁמָר.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Dans l’anthropologie hébraïque, le cœur englobe la pensée, la volonté et les affections. Le terme concret est conservé afin de ne pas réduire son sens aux seules émotions.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation ; « car » rend clairement ce lien explicatif.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: Le suffixe renvoie au cœur, nom masculin en hébreu comme en français. « De lui » conserve la relation de provenance sans explicitation superflue.
- source_word: תּוֹצְאוֹת
  choice: jaillissent les sources
  rationale: Le nom peut désigner des sorties, des débouchés ou des sources. Avec « la vie », l’image d’un jaillissement rend naturellement en français l’idée que la vie procède du cœur, tandis qu’une note maintient les autres nuances possibles.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que sa forme soit plurielle, חַיִּים fonctionne couramment comme un nom abstrait singulier ; « la vie » est donc l’équivalent français naturel.
theological_decisions:
- issue: Portée anthropologique du « cœur »
  choice: Conserver « cœur » comme centre de la vie intérieure, comprenant pensée, volonté et affections.
  alternative: « esprit », « être intérieur » ou une réduction aux émotions
  rationale: Le langage anthropologique hébraïque doit rester perceptible. Une paraphrase interprétative rétrécirait ou déplacerait la portée du terme.
- issue: Image de תּוֹצְאוֹת חַיִּים
  choice: « jaillissent les sources de la vie »
  alternative: « sortent les voies de la vie » ou « viennent les issues de la vie »
  rationale: Le terme hébreu demeure ouvert entre sorties, débouchés et sources. Le texte principal privilégie une image fluide et intelligible, sans en faire une affirmation doctrinale particulière ; la note signale l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif reste direct. « Par-dessus tout » évite une tournure littérale pesante dans le texte principal, tandis que la note conserve le jeu de mots entre la garde et l’action de garder.
