source:
  edition: WLC
  text: כִּֽי חַיִּ֣ים הֵ֭ם לְ/מֹצְאֵי/הֶ֑ם וּֽ/לְ/כָל בְּשָׂר֥/וֹ מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: fr
  text: Car elles sont vie pour ceux qui les trouvent, et guérison pour toute sa chair[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « guérison pour toute sa chair ». Le sens peut être : « guérison pour tout son corps », c’est-à-dire pour le corps de chacun de ceux qui les trouvent.'
    reason: Signale le singulier inattendu de l’hébreu et l’autre formulation naturelle possible en français.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et conserve le lien explicatif du proverbe.
- source_word: חַיִּים
  choice: vie
  rationale: Bien que le nom soit morphologiquement pluriel, il exprime ici la notion abstraite de vie. L’absence d’article garde la formulation prédicative et concise de l’hébreu.
- source_word: הֵם
  choice: elles sont
  rationale: Le pronom renvoie aux paroles mentionnées dans le contexte immédiat; le féminin français s’accorde avec « paroles ».
- source_word: לְמֹצְאֵיהֶם
  choice: pour ceux qui les trouvent
  rationale: Rend le participe pluriel et son suffixe objet sans expliciter davantage ce que représentent « elles ».
- source_word: מַרְפֵּא
  choice: guérison
  rationale: Exprime le rétablissement ou la guérison sans introduire l’idée plus concrète d’un médicament.
- source_word: בְּשָׂרוֹ
  choice: sa chair
  rationale: Conserve à la fois le sens lexical direct de בָּשָׂר et le suffixe masculin singulier de l’hébreu, malgré le passage du pluriel au singulier dans la construction proverbiale.
theological_decisions:
- issue: Passage du pluriel au masculin singulier dans le discours proverbial
  choice: Conserver « ceux qui les trouvent » puis « sa chair »
  alternative: « ceux qui les trouvent » puis « leur corps »
  rationale: L’hébreu présente réellement un participe pluriel dans la première proposition et un suffixe masculin singulier dans la seconde. La traduction maintient cette tension grammaticale plutôt que de l’harmoniser silencieusement.
- issue: Sens littéral ou interprétatif de בָּשָׂר
  choice: « chair »
  alternative: « corps »
  rationale: « Chair » assure la transparence lexicale. Dans ce contexte, le mot peut désigner l’ensemble de la réalité corporelle de la personne, ce que précise la note.
translation_notes:
  register: Style proverbial, bref et digne. « Elles » reprend les paroles du contexte. La tournure inhabituelle « toute sa chair » est volontairement conservée pour refléter la formulation hébraïque; la note en éclaire le sens corporel et distributif.
