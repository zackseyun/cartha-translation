id: PRO.4.14
reference: Proverbs 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/אֹ֣רַח רְ֭שָׁעִים אַל תָּבֹ֑א וְ/אַל תְּ֝אַשֵּׁ֗ר בְּ/דֶ֣רֶךְ רָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/014.yaml
  text: Do not enter the path of the wicked[a], and do not walk in the way of evil men.
translation:
  language: fr
  text: Ne t’engage pas sur le sentier des méchants et n’avance pas sur le chemin des gens mauvais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne va pas tout droit sur le chemin des gens mauvais ». Le verbe hébreu peut signifier « avancer », « poursuivre sa route » ou « aller droit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: sentier
  rationale: Le mot désigne un sentier ou un parcours, souvent employé comme image d’une conduite. « Sentier » conserve cette image et le distingue de דֶּרֶךְ dans le second membre.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé désigne collectivement les personnes méchantes; cette formulation française est naturelle et n’ajoute aucune précision de genre absente de la portée contextuelle.
- source_word: אַל תָּבֹא
  choice: ne t’engage pas sur
  rationale: Avec un terme désignant un sentier, בוא exprime ici l’entrée dans un parcours. « S’engager sur » rend naturellement en français le début d’une conduite imagée comme un trajet.
- source_word: תְּאַשֵּׁר
  choice: n’avance pas
  rationale: Au piel, אשר peut signifier aller droit, progresser ou avancer. « Avancer » préserve mieux cette nuance que le simple « marcher ».
- source_word: דֶּרֶךְ
  choice: chemin
  rationale: Le terme signifie route ou chemin et peut représenter une manière de vivre. « Chemin » est courant, concret et convient au parallélisme.
- source_word: רָעִים
  choice: les gens mauvais
  rationale: L’adjectif masculin pluriel substantivé désigne des personnes mauvaises. « Gens mauvais » est naturel en français moderne et conserve la référence humaine sans imposer que le verset vise exclusivement des hommes.
theological_decisions:
- issue: Portée du masculin pluriel רָעִים
  choice: les gens mauvais
  alternative: les hommes mauvais
  rationale: Bien que la forme hébraïque soit masculine plurielle, elle peut désigner une catégorie humaine de façon représentative. Le contexte ne limite pas explicitement l’avertissement aux hommes; la formulation retenue garde donc cette portée générale sans effacer l’idée de personnes mauvaises.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif négatif au tutoiement correspond à l’adresse pédagogique du contexte. Le parallélisme est conservé avec « sentier » et « chemin », tandis que « s’engager » puis « avancer » distinguent l’entrée dans la voie de la progression sur celle-ci.
