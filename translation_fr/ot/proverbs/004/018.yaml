id: PRO.4.18
reference: Proverbs 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: fr
  text: 'Mais le sentier des justes est comme la lumière de l’aurore[a] : son éclat augmente jusqu’au plein jour[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme une lumière éclatante ».'
    reason: lexical_alternative
  - marker: b
    text: Litt. « jusqu’à ce que le jour soit fermement établi » ; ou « jusqu’à ce que le jour soit pleinement établi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: Mais le sentier
  rationale: אֹרַח désigne un sentier ou un chemin. Dans le contexte antithétique qui suit la voie des méchants, « mais » rend naturellement la valeur contrastive de וְ.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: Le substantif adjectival pluriel désigne ceux qui sont justes. « Les justes » conserve avec concision la catégorie morale centrale des Proverbes.
- source_word: כְּ/אוֹר נֹגַהּ
  choice: comme la lumière de l’aurore
  rationale: כְּ marque la comparaison, אוֹר signifie « lumière » et נֹגַהּ évoque l’éclat ou la clarté rayonnante. La progression vers le plein jour favorise ici l’image de l’aurore, sans éliminer l’autre analyse possible.
- source_word: הוֹלֵךְ וָ/אוֹר
  choice: elle va croissant en éclat
  rationale: Littéralement, la lumière « va et brille ». Cette tournure française naturelle garde l’idée verbale de progression portée par הוֹלֵךְ et celle de rayonnement portée par אוֹר, sans recourir à l’expression artificielle « va et brille ».
- source_word: עַד נְכוֹן הַ/יּוֹם
  choice: jusqu’à ce que le jour soit pleinement établi
  rationale: עַד marque le terme temporel. נְכוֹן, issu de כון, exprime ce qui est ferme ou établi ; appliqué au jour, il évoque son plein établissement plutôt qu’une simple heure nommée.
theological_decisions:
- issue: Catégorie morale de צַדִּיקִים
  choice: les justes
  alternative: les personnes justes
  rationale: Le contexte oppose leur chemin à celui des méchants. « Les justes » préserve cette catégorie éthique et théologique sans lui imposer une définition doctrinale postérieure.
- issue: Portée de l’image lumineuse
  choice: Conserver l’image proverbiale d’une lumière qui progresse vers le plein jour
  alternative: L’expliciter comme croissance spirituelle ou révélation doctrinale
  rationale: Le verset décrit figurativement le sentier des justes, mais ne précise pas à lui seul le mécanisme ou le domaine de cette progression. La traduction ne doit pas résoudre cette ouverture théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Sentier » entretient l’image concrète du parcours ; la reprise pronominale « elle » rend explicite que c’est la lumière qui croît. La formulation garde la progression de l’hébreu tout en évitant un calque peu naturel.
