    rationale: « Elle va croissant en éclat » est un idiome littéraire traditionnel plutôt qu’une tournure du français international moderne. Il peut être remplacé par une expression naturelle qui garde l’idée de lumière progressive.
  - severity: medium
    issue: « Le jour soit pleinement établi » est peu idiomatique
    rationale: Bien que proche de la racine de נכון (« être ferme/établi »), cette formulation ne se dit guère en français à propos du jour. « Jusqu’au plein jour » transmet naturellement le point d’aboutissement de l’image et correspond à l’alternative déjà signalée.
