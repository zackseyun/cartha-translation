  text: כִּ֤י לֶ֣קַח ט֭וֹב נָתַ֣תִּי לָ/כֶ֑ם תּֽ֝וֹרָתִ֗/י אַֽל תַּעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: fr
  text: Car je vous ai transmis un bon enseignement ; n’abandonnez pas mon instruction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon enseignement » ; traditionnellement, « ma loi ». Le terme hébreu torah peut désigner l’instruction au sens large, et pas seulement une loi au sens juridique.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’exhortation du contexte, avec une valeur explicative naturelle en français.
- source_word: לֶקַח טוֹב
  choice: un bon enseignement
  rationale: לֶקַח désigne ici le contenu transmis par le père, et טוֹב en souligne la qualité. Cette formulation est claire et idiomatique.
- source_word: נָתַתִּי לָכֶם
  choice: je vous ai transmis
  rationale: Le parfait présente l’enseignement comme déjà communiqué. « Transmettre » est plus naturel ici que le calque « donner un enseignement » tout en conservant l’idée de communication.
- source_word: תּוֹרָתִי
  choice: mes instructions
  rationale: Dans ce cadre de sagesse familiale, תּוֹרָה désigne l’instruction autorisée du père plutôt qu’un code légal. Le pluriel français rend naturellement la valeur collective du singulier hébreu et évite de répéter « enseignement ».
- source_word: אַל תַּעֲזֹבוּ
  choice: n’abandonnez pas
  rationale: Le prohibitif appelle les auditeurs à ne pas se détourner de l’instruction reçue. « Abandonner » conserve la force morale de עזב en français courant.
theological_decisions:
- issue: Sens de תּוֹרָתִי dans le contexte sapiential
  choice: mes instructions
  alternative: mon enseignement ; ma loi
  rationale: Le contexte est celui de l’enseignement d’un père à ses enfants. Le terme garde ici son sens large d’instruction autorisée sans être identifié de façon indue à la Loi mosaïque.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation distingue les deux termes hébreux לֶקַח et תּוֹרָה sans alourdir la phrase.
