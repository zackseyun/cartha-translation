  text: עֵ֭ינֶי/ךָ לְ/נֹ֣כַח יַבִּ֑יטוּ וְ֝/עַפְעַפֶּ֗י/ךָ יַיְשִׁ֥רוּ נֶגְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/025.yaml
  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
translation:
  language: fr
  text: Que tes yeux regardent droit devant toi, et que tes paupières soient tournées droit devant toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « que tes paupières aillent droit devant toi ». Le verbe hébreu exprime l’idée d’une orientation droite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: Le pluriel avec suffixe de deuxième personne du masculin singulier désigne naturellement « tes yeux ».
- source_word: לְנֹכַח
  choice: droit devant toi
  rationale: L’expression indique ce qui se trouve directement en face de quelqu’un ; cette formulation française naturelle conserve aussi l’idée de rectitude.
- source_word: יַבִּיטוּ
  choice: regardent
  rationale: Le verbe נבט signifie regarder ou porter le regard, sans imposer l’intensité que suggérerait « fixer ».
- source_word: וְעַפְעַפֶּיךָ
  choice: et que tes paupières
  rationale: Le terme hébreu nomme précisément les paupières, en parallèle poétique avec les yeux ; l’image concrète est donc conservée.
- source_word: יַיְשִׁרוּ
  choice: soient dirigées droit
  rationale: Le verbe exprime l’action d’aller droit ou d’être orienté droit. La tournure française rend intelligible cette orientation du regard tout en maintenant l’idée de rectitude.
- source_word: נֶגְדֶּךָ
  choice: devant toi
  rationale: Le mot désigne ce qui est en face ou devant la personne et répond au premier membre du parallélisme.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse individuelle du texte sapientiel. La répétition de « droit devant toi » conserve le parallélisme et l’insistance de l’hébreu ; « paupières » maintient son image corporelle, malgré son caractère inhabituel en français.
