  yaml_path: translation/ot/proverbs/004/011.yaml
  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: fr
  text: Je t’ai enseigné la voie de la sagesse ; je t’ai conduit sur les sentiers de la droiture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des sentiers droits ». Le mot hébreu peut évoquer à la fois ce qui est droit au sens concret et la droiture morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: la voie de la sagesse
  rationale: « Voie » conserve la métaphore du chemin et, comme דֶּרֶךְ dans les Proverbes, peut désigner une manière de vivre. La tournure « de la sagesse » préserve le rapport étroit entre les deux noms.
- source_word: הֹרֵתִיךָ
  choice: je t’ai enseigné
  rationale: Le hiphil de ירה signifie ici « enseigner, instruire, diriger ». « Enseigné » est naturel en français dans ce contexte pédagogique et convient à la voie donnée comme objet de l’enseignement.
- source_word: הִדְרַכְתִּיךָ
  choice: je t’ai conduit
  rationale: Le hiphil de דרך exprime le fait de guider ou de faire marcher. « Conduit » reste idiomatique tout en maintenant l’image du déplacement.
- source_word: בְּמַעְגְּלֵי
  choice: sur les sentiers
  rationale: מַעְגָּל désigne une piste, un sentier ou un parcours. Le pluriel est conservé, et « sur » est la préposition française naturelle avec « sentiers ».
- source_word: יֹשֶׁר
  choice: la droiture
  rationale: Le nom peut évoquer à la fois ce qui est droit au sens spatial et la rectitude morale. « Droiture » exprime clairement la portée éthique du contexte sans faire disparaître l’image, signalée en note.
