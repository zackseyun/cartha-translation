  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: fr
  text: Mon fils, sois attentif à mes paroles ; tends l’oreille à mes propos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif masculin singulier désigne ici le fils auquel s’adresse le père ou maître ; le genre et le nombre du texte hébreu sont conservés.
- source_word: לִדְבָרַי
  choice: à mes paroles
  rationale: דברים désigne ici les paroles d’instruction du locuteur. « Paroles » est naturel et digne en français.
- source_word: הַקְשִׁיבָה
  choice: sois attentif
  rationale: L’impératif hiphil de קשׁב appelle une écoute active et soigneuse. « Sois attentif » en exprime naturellement la force en français moderne.
- source_word: לַאֲמָרַי
  choice: à mes propos
  rationale: אמרים est rendu distinctement de דברים afin de préserver la variation du parallélisme poétique sans introduire une différence de sens excessive.
- source_word: הַט
  choice: tends
  rationale: Avec « oreille », l’impératif de נטה forme une image conventionnelle d’écoute attentive. « Tends l’oreille » conserve cette image dans un idiome français courant.
- source_word: אָזְנֶךָ
  choice: l’oreille
  rationale: Le singulier hébreu est conservé dans l’expression française idiomatique « tendre l’oreille » ; le possessif est naturellement implicite avec cette construction pronominale et l’adresse directe.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est préservé par « paroles / propos », tandis que « tends l’oreille » maintient la métaphore hébraïque sans nécessiter de note.
