source:
  edition: WLC
  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: fr
  text: Évite-le[a] ; ne t’y engage pas[b]. Détourne-t’en et poursuis ton chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tiens-t’en éloigné ». Le verbe hébreu est rare et exprime ici l’idée de rester à l’écart du chemin des méchants.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « ne passe pas par là ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: Évite-le
  rationale: L’impératif, formé sur un verbe rare dans ce sens, commande de se tenir à l’écart du chemin des méchants. « Évite-le » est naturel, précis et conserve le pronom masculin renvoyant au « chemin » du contexte.
- source_word: אַל תַּעֲבָר בּוֹ
  choice: ne t’y engage pas
  rationale: La négation אַל exprime une interdiction. Avec עבר et ב, l’expression évoque le fait de passer par ce chemin ou de s’y avancer ; « ne t’y engage pas » rend clairement l’idée sans suggérer simplement qu’il serait interdit de le traverser d’un côté à l’autre.
- source_word: שְׂטֵה מֵעָלָיו
  choice: Détourne-t’en
  rationale: L’impératif שְׂטֵה demande de dévier ou de se détourner, tandis que מֵעָלָיו marque l’éloignement du chemin. La tournure française est concise et conserve le mouvement spatial.
- source_word: וַעֲבוֹר
  choice: et poursuis ton chemin
  rationale: Le dernier impératif invite à continuer au-delà du mauvais chemin sans l’emprunter. « Poursuis ton chemin » est idiomatique en français et distingue ce mouvement positif de l’interdiction précédente.
