  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: fr
  text: 'Car ils ne dorment pas tant qu’ils n’ont pas fait le mal,

    et leur sommeil est enlevé tant qu’ils n’ont pas fait trébucher quelqu’un.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tant qu’ils n’ont pas eux-mêmes trébuché ». La formulation hébraïque est brève et peut être comprise soit comme le fait de faire trébucher quelqu’un, soit comme le fait de trébucher soi-même ; le contexte favorise le tort causé à autrui.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’avertissement qui précède et conserve la valeur causale de la conjonction.
- source_word: לֹא יִשְׁנוּ
  choice: ils ne dorment pas
  rationale: Rend directement le qal imperfectif négatif de ישׁן, avec ici une portée habituelle.
- source_word: אִם לֹא יָרֵעוּ
  choice: tant qu’ils n’ont pas fait le mal
  rationale: Le hiphil de רעע exprime le fait de faire le mal ou de nuire. Sans objet exprimé, « faire le mal » préserve la généralité du texte; le passé composé marque naturellement en français l’acte préalable au sommeil.
- source_word: וְנִגְזְלָה שְׁנָתָם
  choice: et le sommeil leur est ravi
  rationale: Conserve le passif du niphal de גזל et l’image forte d’un sommeil enlevé, dans un français digne et naturel.
- source_word: אִם לֹא יכשולו
  choice: tant qu’ils n’ont pas fait trébucher quelqu’un
  rationale: Le contexte parallèle favorise un sens causatif, où les méchants provoquent la chute d’autrui. « Faire trébucher » conserve la métaphore, tandis que l’ajout de « quelqu’un » explicite l’objet impliqué.
theological_decisions:
- issue: Portée morale de יָרֵעוּ sans objet exprimé
  choice: 'Expression générale: « faire le mal »'
  alternative: « nuire à quelqu’un »
  rationale: L’hébreu ne précise pas la victime; la traduction évite donc de particulariser ce que le texte laisse général.
- issue: Sens de יכשולו
  choice: 'Sens causatif en contexte: faire trébucher quelqu’un'
  alternative: 'Sens intransitif: trébucher eux-mêmes'
  rationale: Le parallélisme avec l’action mauvaise et la logique du proverbe favorisent le tort infligé à autrui, mais la brièveté et la forme de l’hébreu permettent aussi une lecture intransitive, signalée en note.
translation_notes:
  register: Français international moderne, clair et soutenu. Le parallélisme poétique est conservé par la répétition de « tant qu’ils n’ont pas ». « Ravi » maintient l’image énergique de גזל sans lourdeur excessive.
