source:
  edition: WLC
  text: פַּ֭לֵּס מַעְגַּ֣ל רַגְלֶ֑/ךָ וְֽ/כָל דְּרָכֶ֥י/ךָ יִכֹּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/026.yaml
  text: Level the path of your feet[a], and all your ways will be established.
translation:
  language: fr
  text: Aplanis le sentier de tes pas[a], et toutes tes voies seront affermies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Examine attentivement le sentier de tes pas » ; le verbe hébreu peut aussi signifier peser ou considérer avec soin.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלֵּס
  choice: Aplanis
  rationale: L’impératif piel de פלס peut évoquer l’action d’aplanir ou de niveler, mais aussi celle de peser et, par extension, d’examiner. « Aplanis » conserve ici l’image concrète du sentier tout en suggérant une conduite soigneusement préparée.
- source_word: מַעְגַּל
  choice: le sentier
  rationale: Le nom désigne une piste, un sentier ou un parcours. « Sentier » est naturel en français et garde à la fois l’image physique et sa portée morale.
- source_word: רַגְלֶךָ
  choice: que suivent tes pieds
  rationale: Cette formulation française exprime naturellement le rapport entre les pieds et le sentier sans perdre l’image hébraïque de la marche.
- source_word: וְכָל
  choice: et toutes
  rationale: La coordination simple de l’hébreu est maintenue sans introduire un lien de conséquence plus explicite que le texte.
- source_word: דְּרָכֶיךָ
  choice: tes voies
  rationale: « Voies » rend le sens fréquent de דֶּרֶךְ comme manière de vivre et évite de répéter « sentier ».
- source_word: יִכֹּנוּ
  choice: seront affermies
  rationale: Le niphal de כון exprime le fait d’être établi, rendu ferme ou stable. « Seront affermies » conserve cette idée de stabilité sans préciser indûment l’agent.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse personnelle de l’instruction sapientielle. La formulation maintient la métaphore de la marche et l’ambiguïté lexicale de פַּלֵּס au moyen d’une note.
