source:
  edition: WLC
  text: תִּתֵּ֣ן לְ֭/רֹאשְׁ/ךָ לִוְיַת חֵ֑ן עֲטֶ֖רֶת תִּפְאֶ֣רֶת תְּמַגְּנֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/009.yaml
  text: She will place on your head a graceful wreath[b][a]; she will bestow on you a crown of beauty.
translation:
  language: fr
  text: Elle posera sur ta tête une guirlande pleine de grâce[a] ; elle te remettra une couronne de splendeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une guirlande de grâce » ou « une gracieuse guirlande ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une couronne de beauté » ou « une couronne de gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: elle posera
  rationale: Le qal inaccompli 3fs a pour sujet la sagesse, féminine dans le contexte. « Posera » convient naturellement au complément « sur ta tête » et conserve l’image concrète.
- source_word: לְרֹאשְׁךָ
  choice: sur ta tête
  rationale: Dans ce contexte de parure, la préposition ל se rend idiomatiquement en français par « sur ».
- source_word: לִוְיַת
  choice: guirlande
  rationale: Le nom désigne une parure portée sur la tête, une guirlande ou une couronne végétale. « Guirlande » est clair et distingue ce premier objet de עֲטֶרֶת, rendu par « couronne ».
- source_word: חֵן
  choice: pleine de grâce
  rationale: חֵן peut exprimer la grâce, le charme ou la faveur. « Pleine de grâce » conserve la construction nominale et laisse subsister cette richesse de sens.
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: Rendu courant et précis de cette parure de tête, aisément compris en français moderne.
- source_word: תִּפְאֶרֶת
  choice: splendeur
  rationale: Le terme peut désigner la beauté, la magnificence, la gloire ou l’honneur. « Splendeur » convient au parallélisme poétique sans réduire le sens à la seule beauté physique.
- source_word: תְּמַגְּנֶךָּ
  choice: elle te remettra
  rationale: La forme piel signifie ici remettre, livrer ou accorder, plutôt que protéger. « Te remettra » préserve l’action de présenter la couronne sans ajouter une nuance cérémonielle trop forte.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le féminin « elle » reprend la sagesse personnifiée dans le contexte. Le parallélisme et l’image de deux parures de tête sont conservés.
