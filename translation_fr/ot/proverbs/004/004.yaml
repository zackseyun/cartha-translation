  yaml_path: translation/ot/proverbs/004/004.yaml
  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: fr
  text: 'Il m’enseigna et me dit : « Que ton cœur[a] retienne fermement mes paroles ; garde mes commandements et vis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le « cœur » comprend souvent la pensée, la volonté et le discernement, et pas seulement les émotions.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: Il m’instruisait
  rationale: Le hiphil de ירה signifie ici « enseigner, instruire ». L’imparfait français convient au récit rétrospectif et présente l’enseignement paternel comme une action située dans le passé.
- source_word: וַיֹּאמֶר לִי
  choice: et me disait
  rationale: Rend directement אמר avec son complément, tout en maintenant la continuité temporelle avec « m’instruisait ».
- source_word: יִתְמָךְ
  choice: retienne fermement
  rationale: תמך exprime l’idée de tenir, soutenir ou saisir. Avec « ton cœur » pour sujet et « mes paroles » pour objet, l’expression évoque une conservation intérieure ferme ; « retienne fermement » est naturel et garde cette force.
- source_word: דְּבָרַי
  choice: mes paroles
  rationale: Rendu large et direct de דְּבָרַי, sans le restreindre à des maximes ou à une instruction explicitée.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Conserve l’image hébraïque du cœur comme centre de la pensée, de la volonté et du discernement, sans la réduire aux émotions.
- source_word: שְׁמֹר
  choice: garde
  rationale: שמר signifie garder, observer ou veiller sur. « Garde mes commandements » préserve à la fois l’idée d’obéissance et celle d’une conservation attentive.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: מִצְוָה désigne un ordre faisant autorité. « Commandements » en maintient la portée forte et convient au contexte sapientiel.
- source_word: וֶחְיֵה
  choice: et vis
  rationale: Rend l’impératif compact relié par ו, sans décider s’il exprime principalement une conséquence (« tu vivras ») ou un but (« afin que tu vives »).
theological_decisions:
- issue: Rapport entre l’obéissance et la vie dans וֶחְיֵה
  choice: « et vis »
  alternative: « et tu vivras » ou « afin que tu vives »
  rationale: La formulation impérative conserve la tension du texte hébreu entre exhortation, résultat et finalité, sans préciser davantage la nature de la vie promise.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et conserve le parallélisme exhortatif de l’hébreu. « Retienne fermement » explicite naturellement la vigueur de תמך sans ajouter d’interprétation doctrinale.
