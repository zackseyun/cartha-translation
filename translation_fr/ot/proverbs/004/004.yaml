  text: וַ/יֹּרֵ֗/נִי וַ/יֹּ֥אמֶר לִ֗/י יִֽתְמָךְ דְּבָרַ֥/י לִבֶּ֑/ךָ שְׁמֹ֖ר מִצְוֺתַ֣/י וֶֽ/חְיֵֽה־׃
base_translation:
