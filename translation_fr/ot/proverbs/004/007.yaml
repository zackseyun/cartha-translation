  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: fr
  text: 'Le commencement de la sagesse, c’est : acquiers la sagesse[a] ; et, avec tout ce que tu acquiers[b], acquiers le discernement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « La sagesse est la chose principale ; acquiers donc la sagesse. » Cette traduction comprend רֵאשִׁית au sens de « ce qui est premier » ou « ce qui importe le plus ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « avec toute ton acquisition ». On peut aussi comprendre : « avec tous tes biens » ou « au prix de tout ce que tu possèdes ». L’hébreu joue vraisemblablement sur le nom « acquisition » et le verbe rendu par « acquiers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: le commencement de la sagesse
  rationale: Cette formulation conserve la construction concise de l’hébreu et permet à l’impératif qui suit d’expliquer en quoi consiste ce commencement, sans exclure le sens possible de « chose primordiale ».
- source_word: קְנֵה
  choice: acquiers
  rationale: L’impératif de קנה exprime l’action volontaire d’obtenir ou de se procurer quelque chose. « Acquiers » est naturel dans une maxime et maintient son lien avec קִנְיָנְךָ.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent usuel dans les Proverbes pour une sagesse pratique et morale. La répétition de l’hébreu est conservée.
- source_word: וּבְכָל קִנְיָנְךָ
  choice: au prix de tout ce que tu possèdes
  rationale: La locution indique vraisemblablement que l’intelligence doit être acquise en y consacrant tous ses biens ou toutes ses acquisitions. « Au prix de » rend ce rapport de coût plus naturellement en français, tandis que la note conserve les autres nuances lexicales.
- source_word: בִינָה
  choice: l’intelligence
  rationale: Dans la littérature sapientielle, בינה désigne la faculté de comprendre et de discerner. « Intelligence » est ici idiomatique et distinct de « sagesse », sans se limiter aux capacités intellectuelles.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et sentencieux. Le tutoiement singulier correspond à la forme hébraïque. La ponctuation explicite la structure de la maxime sans supprimer l’ambiguïté de רֵאשִׁית, signalée en note.
