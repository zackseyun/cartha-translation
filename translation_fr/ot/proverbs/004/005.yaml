id: PRO.4.5
reference: Proverbs 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קְנֵ֣ה חָ֭כְמָה קְנֵ֣ה בִינָ֑ה אַל תִּשְׁכַּ֥ח וְ/אַל תֵּ֝֗ט מֵֽ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/005.yaml
  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
translation:
  language: fr
  text: Acquiers la sagesse[a], acquiers l’intelligence. N’oublie pas et ne t’écarte pas[b] des paroles de ma bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Procure-toi la sagesse, procure-toi l’intelligence ». Le verbe hébreu peut signifier obtenir, acquérir ou acheter selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne te détourne pas » ou « ne dévie pas » des paroles de ma bouche.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  choice: Acquiers
  rationale: L’impératif de קנה exprime ici l’action résolue d’obtenir ou de se procurer quelque chose de précieux. « Acquiers » conserve cette intention sans imposer l’idée d’un achat et permet de reproduire la répétition hébraïque.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Traduction usuelle de חכמה dans les Proverbes, où le terme désigne une sagesse pratique, morale et spirituelle.
- source_word: בִינָה
  choice: l’intelligence
  rationale: בינה renvoie à la capacité de comprendre et de discerner. « Intelligence » forme en français une paire naturelle avec « sagesse » sans effacer leur distinction.
- source_word: אַל תִּשְׁכַּח
  choice: N’oublie pas
  rationale: La formulation garde le sens premier de שכח et l’absence d’objet exprimé dans le texte hébreu, sans préciser artificiellement ce qui ne doit pas être oublié.
- source_word: וְאַל תֵּט
  choice: et ne t’écarte pas
  rationale: נטה peut exprimer le fait de dévier ou de se détourner. « Ne t’écarte pas de » est idiomatique en français et convient au complément introduit par מִן.
- source_word: מֵאִמְרֵי פִי
  choice: des paroles de ma bouche
  rationale: Cette traduction préserve l’image concrète et l’accent mis sur l’enseignement oral, plutôt que de réduire l’expression à « mes paroles ».
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La répétition impérative de l’hébreu est conservée, ainsi que l’image « des paroles de ma bouche ». Les deux interdictions restent coordonnées sans ajout d’un objet absent après « N’oublie pas ».
