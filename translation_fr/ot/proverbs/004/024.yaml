  text: הָסֵ֣ר מִ֭מְּ/ךָ עִקְּשׁ֣וּת פֶּ֑ה וּ/לְז֥וּת שְׂ֝פָתַ֗יִם הַרְחֵ֥ק מִמֶּֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/024.yaml
  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: fr
  text: Écarte de toi les paroles tortueuses, et éloigne de toi les propos retors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tortuosité de la bouche » et « la déviation des lèvres ». Dans les deux membres, les noms hébreux décrivent une parole moralement déformée ou perverse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Écarte
  rationale: L’impératif appelle à supprimer activement ou à tenir à l’écart; « écarte » est naturel en français et convient au complément « de toi ».
- source_word: מִמְּךָ
  choice: de toi
  rationale: La préposition avec suffixe marque la séparation d’avec le destinataire et souligne sa responsabilité personnelle.
- source_word: עִקְּשׁוּת פֶּה
  choice: toute parole tortueuse
  rationale: Littéralement, l’expression associe la « tortuosité » à la « bouche ». En français courant, « parole tortueuse » transmet clairement l’image morale d’un discours déformé ou pervers, tandis que « toute » donne une tournure idiomatique au nom abstrait.
- source_word: וּלְזוּת שְׂפָתַיִם
  choice: tout propos retors
  rationale: Le nom désigne une déviation ou une perversité, ici liée aux « lèvres ». « Propos retors » conserve l’idée d’un langage moralement dévié et maintient une variation poétique avec le premier membre.
- source_word: הַרְחֵק
  choice: éloigne
  rationale: L’impératif causatif signifie faire en sorte que quelque chose soit loin; « éloigne de toi » en restitue directement la force.
- source_word: מִמֶּךָ
  choice: de toi
  rationale: Le complément répété marque de nouveau la séparation et préserve le parallélisme des deux membres.
