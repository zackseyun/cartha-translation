  text: דֶּ֣רֶךְ רְ֭שָׁעִים כָּֽ/אֲפֵלָ֑ה לֹ֥א יָ֝דְע֗וּ בַּ/מֶּ֥ה יִכָּשֵֽׁלוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/019.yaml
  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
translation:
  language: fr
  text: Le chemin des méchants est comme une obscurité profonde[a] ; ils ne savent pas ce qui les fait trébucher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme d’épaisses ténèbres » ou « comme une obscurité dense ». Le terme hébreu désigne une obscurité particulièrement profonde.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ne savent pas sur quoi ils trébuchent ». L’expression hébraïque peut désigner soit ce qui les fait trébucher, soit l’obstacle sur lequel ils trébuchent.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: chemin
  rationale: Conserve la métaphore sapientielle du parcours de vie ou de la conduite, dans un français courant et naturel.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rend directement le pluriel substantivé désignant les personnes moralement coupables, formulation concise et traditionnelle dans les écrits de sagesse.
- source_word: כָּאֲפֵלָה
  choice: comme une obscurité profonde
  rationale: Préserve la comparaison introduite par כְּ et exprime l’intensité d’אֲפֵלָה, qui évoque une obscurité particulièrement dense.
- source_word: לֹא יָדְעוּ
  choice: ils ne savent pas
  rationale: Traduction directe qui laisse ouvertes les nuances d’ignorance, d’inconscience et de manque de discernement.
- source_word: בַּמֶּה יִכָּשֵׁלוּ
  choice: ce qui les fait trébucher
  rationale: Exprime naturellement en français la lecture instrumentale ou causale de בַּמֶּה avec le verbe « trébucher », tout en signalant en note la lecture locative possible.
theological_decisions:
- issue: Nature de l’ignorance des méchants
  choice: Ne pas préciser si leur ignorance est morale, spirituelle ou circonstancielle.
  alternative: Expliciter qu’ils manquent de discernement spirituel.
  rationale: Le texte affirme simplement qu’ils ne savent pas ; une précision théologique supplémentaire réduirait la portée de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du chemin et l’image du trébuchement sont conservées, sans explicitation doctrinale. Les deux ambiguïtés lexicales principales sont indiquées en notes.
