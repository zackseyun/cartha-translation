source:
  edition: WLC
  text: סַלְסְלֶ֥/הָ וּֽ/תְרוֹמְמֶ֑/ךָּ תְּ֝כַבֵּ֗דְ/ךָ כִּ֣י תְחַבְּקֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/008.yaml
  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: fr
  text: Tiens-la en haute estime[a], et elle t’élèvera ; elle t’honorera[b], car tu l’étreins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chéris-la » ou « Exalte-la ». Le verbe hébreu est rare et peut évoquer le fait d’estimer, de chérir ou d’exalter la sagesse.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « elle t’honorera quand tu l’étreins ». La conjonction hébraïque peut exprimer ici la cause ou la circonstance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: Tiens-la en haute estime
  rationale: Le verbe rare סלסל peut évoquer le fait d’estimer, de chérir ou d’exalter. Cette formulation naturelle conserve l’idée d’accorder une grande valeur à la sagesse tout en évitant de répéter « élever », employé dans la proposition suivante.
- source_word: וּתְרוֹמְמֶךָ
  choice: et elle t’élèvera
  rationale: Le verbe רומם signifie élever ou exalter. Le sujet féminin singulier renvoie à la sagesse personnifiée.
- source_word: תְּכַבֵּדְךָ
  choice: elle t’honorera
  rationale: Au piel, כבד exprime couramment l’action d’honorer ou de conférer de l’honneur. « Honorer » rend ce sens avec naturel sans le renforcer indûment par « glorifier ».
- source_word: כִּי
  choice: car
  rationale: 'כי a ici naturellement une valeur causale : la sagesse honore celui qui l’étreint. Une lecture circonstancielle ou temporelle reste toutefois possible et est signalée en note.'
- source_word: תְחַבְּקֶנָּה
  choice: tu l’étreins
  rationale: Le verbe חבק signifie étreindre ou prendre dans ses bras. « Étreindre » maintient l’image concrète de la sagesse personnifiée et l’idée de s’attacher fermement à elle.
theological_decisions:
- issue: Lien entre l’étreinte de la sagesse et l’honneur qu’elle accorde
  choice: 'Relation causale : « car tu l’étreins »'
  alternative: 'Relation temporelle ou circonstancielle : « quand tu l’étreins »'
  rationale: La conjonction כי permet les deux nuances. Le texte principal retient son sens causal courant, tandis que la note préserve l’autre lecture sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin des pronoms conserve la personnification de la sagesse. Le parallélisme et la progression entre haute estime, élévation, honneur et étreinte sont maintenus.
