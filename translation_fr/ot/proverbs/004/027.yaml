  text: אַֽל תֵּט יָמִ֥ין וּ/שְׂמֹ֑אול הָסֵ֖ר רַגְלְ/ךָ֣ מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/027.yaml
  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: fr
  text: Ne dévie ni à droite ni à gauche ; détourne ton pied du mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écarte ton pied du mal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּט
  choice: dévie
  rationale: Avec אַל, la forme exprime une interdiction. « Dévier » rend naturellement l’idée de s’écarter de la voie, tout en convenant aux compléments directionnels « à droite » et « à gauche ».
- source_word: יָמִין
  choice: à droite
  rationale: Le nom directionnel désigne le côté droit et forme avec שְׂמֹאול une paire parallèle exprimant tout écart de la voie.
- source_word: שְׂמֹאול
  choice: à gauche
  rationale: Le terme est le pendant directionnel de יָמִין ; « à gauche » préserve le parallélisme hébreu dans un français naturel.
- source_word: הָסֵר
  choice: détourne
  rationale: L’impératif demande d’éloigner ou d’écarter le pied. « Détourne » conserve l’image concrète du déplacement et s’accorde avec l’exhortation à ne pas dévier.
- source_word: רַגְלְךָ
  choice: ton pied
  rationale: Le singulier est conservé afin de respecter le texte hébreu et son image corporelle de la conduite comme marche sur un chemin.
- source_word: מֵרָע
  choice: du mal
  rationale: Dans cette exhortation sapientielle, רַע garde une portée morale large. « Du mal » est concis et ne réduit pas le terme à la seule nuisance ou à une forme particulière de méchanceté.
theological_decisions: []
