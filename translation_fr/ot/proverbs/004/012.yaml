  text: בְּֽ֭/לֶכְתְּ/ךָ לֹא יֵצַ֣ר צַעֲדֶ֑/ךָ וְ/אִם תָּ֝ר֗וּץ לֹ֣א תִכָּשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: fr
  text: Quand tu marcheras, ton pas ne sera pas entravé[a] ; et si tu cours, tu ne trébucheras pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton pas ne sera pas à l’étroit » ou « ne sera pas limité ». Le verbe hébreu évoque ce qui est resserré ou soumis à une contrainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: Quand tu marcheras
  rationale: 'La préposition בְּ avec l’infinitif construit et le suffixe de 2e personne exprime ici le temps : « quand tu marcheras » ou « lorsque tu marcheras ». Le futur s’accorde naturellement en français avec les verbes inaccomplis qui suivent.'
- source_word: יֵצַר
  choice: ne sera pas entravé
  rationale: Le verbe évoque ce qui devient étroit, resserré ou limité. Avec « ton pas », « ne sera pas entravé » rend clairement l’idée d’une progression qui ne rencontre aucune contrainte, tout en conservant l’image du chemin.
- source_word: צַעֲדֶךָ
  choice: ton pas
  rationale: Le nom hébreu est au singulier avec un suffixe de 2e personne masculine. Le singulier français préserve cette forme et fonctionne comme une image générale de la démarche.
- source_word: וְאִם
  choice: et si
  rationale: La conjonction suivie de la particule conditionnelle introduit simplement une condition. « Et si » conserve à la fois le lien avec la proposition précédente et la formulation conditionnelle.
- source_word: תָּרוּץ
  choice: tu cours
  rationale: Le verbe רוץ signifie normalement « courir » ; le contexte ne demande ni atténuation ni intensification.
- source_word: תִכָּשֵׁל
  choice: tu ne trébucheras pas
  rationale: Le nifal de כשל exprime le fait de trébucher ou de chanceler. « Trébucher » maintient l’image du chemin et laisse subsister sa portée concrète aussi bien que morale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques de la 2e personne masculine singulière. La ponctuation conserve le parallélisme des deux propositions.
