source:
  edition: WLC
  text: תּוֹחֶ֣לֶת מְ֭מֻשָּׁכָה מַחֲלָה לֵ֑ב וְ/עֵ֥ץ חַ֝יִּ֗ים תַּאֲוָ֥ה בָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/012.yaml
  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: fr
  text: Un espoir qui tarde à se réaliser rend le cœur malade[a], mais un désir réalisé est un arbre de vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Un espoir prolongé est une maladie du cœur, mais un désir qui arrive est un arbre de vie. »'
    reason: Alternative lexicale et représentation de la structure nominale hébraïque.
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: une attente
  rationale: Le nom désigne une attente empreinte d’espoir. « Attente » s’accorde naturellement avec l’idée de prolongation, tout en préservant la nuance d’espérance portée par le contexte.
- source_word: מְמֻשָּׁכָה
  choice: qui se prolonge
  rationale: Le participe signifie littéralement « tirée en longueur » ou « prolongée ». Cette formulation française est claire et rend la durée pénible sans préciser artificiellement qui cause le délai.
- source_word: מַחֲלָה לֵב
  choice: rend le cœur malade
  rationale: L’hébreu présente une proposition nominale, littéralement « maladie du cœur ». La tournure verbale française conserve l’image et exprime naturellement son effet.
- source_word: וְעֵץ חַיִּים
  choice: mais ... un arbre de vie
  rationale: Même si ו signifie formellement « et », le parallélisme est antithétique ; « mais » rend clairement ce contraste. L’image biblique « arbre de vie » est conservée.
- source_word: תַּאֲוָה
  choice: un désir
  rationale: Le terme peut désigner un désir ou une aspiration. « Désir » reste large et neutre dans ce contexte sapientiel.
- source_word: בָאָה
  choice: réalisé
  rationale: Le verbe signifie littéralement « venu » ou « arrivé ». Appliqué au désir, « réalisé » exprime idiomatiquement en français qu’il a abouti, sans ajouter de jugement moral.
theological_decisions:
- issue: Valeur de la conjonction ו devant עֵץ חַיִּים
  choice: mais
  alternative: et
  rationale: La coordination hébraïque peut porter ici un contraste dans le parallélisme proverbial. « Mais » communique cette opposition en français moderne sans changer le sens.
- issue: Portée de l’image עֵץ חַיִּים
  choice: arbre de vie
  alternative: source de vie
  rationale: La traduction littérale préserve une image biblique importante et évite de réduire sa richesse métaphorique à une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique et l’image concrète de l’arbre de vie sont préservés ; la note signale la formulation plus littérale.
