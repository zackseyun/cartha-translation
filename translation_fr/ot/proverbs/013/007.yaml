  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: fr
  text: Tel se fait passer pour riche[a] et n’a rien ; tel autre se fait passer pour pauvre et possède de grands biens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tel s’enrichit et n’a rien ; tel autre s’appauvrit et possède de grands biens. » Les verbes réflexifs hébreux peuvent évoquer soit l’apparence que l’on se donne, soit le fait de s’enrichir ou de s’appauvrir réellement. Le texte retient le sens de l’apparence en raison de l’ironie marquée du proverbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Tel… tel autre
  rationale: La tournure existentielle introduit une observation générale. En français, la construction corrélative « Tel… tel autre » rend naturellement le parallélisme proverbial.
- source_word: מִתְעַשֵּׁר
  choice: se fait passer pour riche
  rationale: Le hitpael de עשר peut exprimer soit une manière de se présenter, soit le fait de s’enrichir. Le contraste avec « n’a rien » favorise ici l’idée d’une apparence affichée.
- source_word: וְאֵין כֹּל
  choice: et n’a rien
  rationale: אֵין avec כֹּל exprime l’absence totale. La formulation française est concise et conserve la tension ironique du texte.
- source_word: מִתְרוֹשֵׁשׁ
  choice: se fait passer pour pauvre
  rationale: La forme réflexive, parallèle à מִתְעַשֵּׁר, peut désigner l’apparence de pauvreté ou l’action de s’appauvrir. Le sens de présentation de soi convient au contraste antithétique.
- source_word: וְהוֹן רָב
  choice: et possède de grands biens
  rationale: הוֹן désigne les richesses ou les biens, et רָב leur abondance. Cette expression est naturelle en français et garde la force concrète de la proposition nominale hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme « Tel… tel autre » restitue la structure équilibrée du verset sans alourdir la phrase.
