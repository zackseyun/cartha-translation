- from: L’arrogance ne produit que des querelles[a], mais la sagesse est avec ceux qui acceptent les conseils.
  to: L’arrogance ne produit que des querelles[a], mais la sagesse est avec ceux qui prennent conseil.
  rationale: La révision se limite à remplacer « acceptent les conseils » par « prennent conseil », afin d’éviter d’ajouter l’idée d’une acceptation effective tout en conservant une expression française naturelle. La note conserve les alternatives lexicales pertinentes et rend explicite l’autre possibilité passive de נוֹעָצִים.
