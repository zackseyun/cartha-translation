source:
  edition: WLC
  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: fr
  text: L’arrogance ne produit que des querelles[a], mais la sagesse est avec ceux qui prennent conseil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’insolence ne fait que susciter des conflits, mais la sagesse est chez ceux qui reçoivent conseil. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ne… que
  rationale: Cette tournure française exprime naturellement la valeur restrictive de רַק sans affaiblir la formulation proverbiale.
- source_word: בְּזָדוֹן
  choice: l’arrogance
  rationale: זָדוֹן désigne l’orgueil présomptueux, l’arrogance ou l’insolence. « L’arrogance » est clair, actuel et convient au rôle causal indiqué par בְּ.
- source_word: יִתֵּן
  choice: produit
  rationale: Le verbe signifie littéralement « donne ». Dans ce contexte, « produit » rend naturellement l’idée que l’arrogance engendre le conflit.
- source_word: מַצָּה
  choice: des querelles
  rationale: מַצָּה désigne la dispute ou la contestation. Le pluriel générique « des querelles » est idiomatique en français et garde la portée relationnelle du terme.
- source_word: וְאֶת
  choice: mais… avec
  rationale: 'La conjonction introduit ici un contraste entre les deux membres, tandis que אֶת garde l’idée de présence ou d’association : la sagesse se trouve auprès des personnes conseillées.'
- source_word: נוֹעָצִים
  choice: ceux qui acceptent les conseils
  rationale: Le participe niphal de יעץ peut désigner ceux qui se laissent conseiller ou qui prennent conseil. « Acceptent les conseils » met en valeur leur disposition à recevoir un avis sans exclure entièrement l’idée de consultation.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: חָכְמָה est le terme sapientiel central des Proverbes ; « sagesse » en est l’équivalent français naturel et cohérent.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La structure antithétique est conservée. La note signale les nuances possibles de זָדוֹן, מַצָּה et נוֹעָצִים sans trancher inutilement entre réception d’un conseil et consultation.
