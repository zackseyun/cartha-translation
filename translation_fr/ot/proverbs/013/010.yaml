    issue: « Ceux qui acceptent les conseils » interprète de façon trop précise נוֹעָצִים.
    rationale: Le niphal ne dit pas explicitement que les personnes suivent ou acceptent les avis. « Ceux qui prennent conseil » est à la fois idiomatique et plus proche de la portée du terme hébreu.
  revised_text: L’arrogance ne produit que des querelles[a], mais la sagesse est avec ceux qui prennent conseil.
  revised_footnotes:
