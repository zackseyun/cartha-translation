  text: שֵֽׂכֶל ט֭וֹב יִתֶּן חֵ֑ן וְ/דֶ֖רֶךְ בֹּגְדִ֣ים אֵיתָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/015.yaml
  text: Good sense gives favor[b][a], but the way of the treacherous is hard.
translation:
  language: fr
  text: 'Un bon discernement attire la faveur[a],

    mais le chemin des traîtres est rude[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donne la faveur » ; on peut aussi traduire : « Un bon discernement procure la faveur. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est dur ». Le mot hébreu peut évoquer ce qui est âpre, difficile ou inflexible ; ailleurs, il peut signifier « durable » ou « permanent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל טוֹב
  choice: un bon discernement
  rationale: L’expression désigne un jugement sain et pratique. « Bon discernement » est naturel en français moderne et convient au registre sapientiel.
- source_word: יִתֶּן
  choice: attire
  rationale: Le verbe signifie littéralement « donne », mais, avec « faveur », il exprime ici le résultat obtenu. « Attire » rend clairement cette relation en français sans en modifier le sens.
- source_word: חֵן
  choice: la faveur
  rationale: Dans ce contexte, le terme évoque l’accueil favorable ou l’estime accordée par autrui, plutôt qu’une notion théologique particulière de grâce.
- source_word: דֶרֶךְ
  choice: le chemin
  rationale: Mot fréquent dans la littérature sapientielle pour désigner à la fois une voie et une manière de vivre. « Chemin » conserve cette image.
- source_word: בֹּגְדִים
  choice: des traîtres
  rationale: Le participe désigne des personnes qui agissent avec perfidie ou déloyauté. « Traîtres » est concis, intelligible et proverbial.
- source_word: אֵיתָן
  choice: rude
  rationale: Le mot peut évoquer ce qui est ferme, durable ou difficile. Dans l’antithèse du proverbe, « rude » rend bien l’idée probable d’un chemin âpre ou pénible tout en laissant percevoir l’image concrète.
