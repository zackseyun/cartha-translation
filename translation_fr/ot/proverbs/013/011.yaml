id: PRO.13.11
reference: Proverbs 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֭וֹן מֵ/הֶ֣בֶל יִמְעָ֑ט וְ/קֹבֵ֖ץ עַל יָ֣ד יַרְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/011.yaml
  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: fr
  text: La richesse provenant de ce qui est vain diminue[a], mais celui qui amasse peu à peu l’augmente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « provenant d’un souffle » ou « de la vanité » ; l’expression peut évoquer une richesse éphémère, sans consistance ou mal fondée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur la main » ; l’expression signifie probablement qu’on amasse progressivement, par petites quantités.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: la richesse
  rationale: Le nom désigne les biens matériels ou la fortune; « richesse » est naturel, large et adapté au style proverbial.
- source_word: מֵהֶבֶל
  choice: venue du néant
  rationale: הֶבֶל évoque littéralement un souffle ou une vapeur, puis ce qui est vide, vain ou sans consistance. « Venue du néant » conserve l’image et l’ambiguïté quant au caractère illusoire, éphémère ou mal fondé de cette richesse.
- source_word: יִמְעָט
  choice: diminue
  rationale: Le verbe signifie devenir moindre, décroître. « Diminue » exprime clairement ce mouvement sans ajouter une nuance absente du texte.
- source_word: וְקֹבֵץ
  choice: mais celui qui amasse
  rationale: Le participe substantivé décrit de manière générale la personne qui rassemble ou accumule; « celui qui amasse » convient au contexte économique.
- source_word: עַל יָד
  choice: peu à peu
  rationale: L’expression est littéralement liée à la « main », mais elle indique probablement ici une accumulation progressive, par petites quantités.
- source_word: יַרְבֶּה
  choice: l’augmente
  rationale: La forme causative signifie rendre plus abondant ou accroître. Le pronom renvoie naturellement à la richesse mentionnée au début du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le choix « venue du néant » maintient l’image hébraïque et son ambiguïté, tandis que « peu à peu » rend naturellement l’idiome de la seconde proposition.
