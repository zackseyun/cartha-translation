source:
  edition: WLC
  text: חַ֭טָּאִים תְּרַדֵּ֣ף רָעָ֑ה וְ/אֶת צַ֝דִּיקִ֗ים יְשַׁלֶּם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/021.yaml
  text: Disaster pursues sinners, but good repays the righteous.
translation:
  language: fr
  text: Le mal poursuit les pécheurs, mais le bien récompense les justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: le mal
  rationale: Le nom féminin peut désigner le mal ou le malheur. « Le mal » préserve la formulation personnifiée et l’ambiguïté entre faute et conséquence néfaste.
- source_word: תְּרַדֵּף
  choice: poursuit
  rationale: Rend directement l’idée de poursuivre avec insistance, sans ajouter d’explication causale.
- source_word: חַטָּאִים
  choice: les pécheurs
  rationale: Équivalent français courant du pluriel désignant ceux qui pèchent.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: Terme sapientiel et théologique usuel pour les personnes droites ou justes.
- source_word: יְשַׁלֶּם
  choice: récompense
  rationale: Le verbe signifie rendre, payer ou rétribuer. Avec « le bien » comme sujet et « les justes » comme complément, « récompense » donne un français naturel tout en conservant l’idée de rétribution.
- source_word: טוֹב
  choice: le bien
  rationale: Le substantif peut évoquer le bien, le bonheur ou la prospérité. « Le bien » maintient le parallélisme avec « le mal » et la personnification du texte hébreu.
theological_decisions:
- issue: Nature de la rétribution dans le proverbe
  choice: Conserver l’énoncé général selon lequel le mal poursuit les pécheurs et le bien récompense les justes.
  alternative: Préciser que Dieu punit les pécheurs et récompense les justes.
  rationale: Dieu n’est pas explicitement nommé comme sujet dans l’hébreu. La traduction garde donc la personnification et la tension sapientielle sans imposer un agent théologique absent du verset.
- issue: Sens de רָעָה
  choice: « le mal »
  alternative: « le malheur » ou « la catastrophe »
  rationale: Le contexte permet une conséquence calamiteuse, mais le terme reste polysémique. « Le mal » préserve mieux cette ouverture et répond formellement à « le bien ».
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme « le mal / le bien » et « les pécheurs / les justes » est conservé; aucune note n’est nécessaire.
