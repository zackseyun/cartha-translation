  text: נֹצֵ֣ר פִּ֭י/ו שֹׁמֵ֣ר נַפְשׁ֑/וֹ פֹּשֵׂ֥ק שְׂ֝פָתָ֗י/ו מְחִתָּה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/003.yaml
  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: fr
  text: Qui garde sa bouche préserve sa vie[a] ; qui ouvre grand ses lèvres court à sa perte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « sa vie » (nephesh) ; selon le contexte, ce terme peut aussi désigner la personne elle-même ou l’âme.
    reason: lexical_alternative
  - marker: b
    text: Ou « attire sur lui la destruction » ; l’expression hébraïque est concise et permet plusieurs formulations proches.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: surveille
  rationale: Le participe exprime l’action de garder avec vigilance. « Surveille » évoque naturellement la maîtrise attentive de ses paroles.
- source_word: פִּיו
  choice: sa bouche
  rationale: Traduction concrète du nom avec suffixe ; elle conserve l’image hébraïque et le parallélisme avec « ses lèvres ».
- source_word: שֹׁמֵר
  choice: préserve
  rationale: Avec « sa vie » comme complément, le verbe indique ici le résultat protecteur de la retenue dans la parole.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: Dans ce contexte sapientiel, נֶפֶשׁ désigne le plus naturellement la vie ou la personne elle-même, plutôt qu’une âme immatérielle au sens étroit.
- source_word: פֹּשֵׂק
  choice: ouvre toutes grandes
  rationale: Cette expression conserve l’image concrète d’une large ouverture et suggère une parole sans retenue sans remplacer la métaphore par son interprétation.
- source_word: שְׂפָתָיו
  choice: ses lèvres
  rationale: La traduction littérale préserve le parallélisme poétique entre la bouche et les lèvres.
- source_word: מְחִתָּה לוֹ
  choice: court à sa perte
  rationale: La proposition hébraïque est elliptique. Cette formulation française exprime naturellement la conséquence désastreuse qui atteint celui qui parle sans retenue, tout en gardant la brièveté proverbiale.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme concret entre « bouche » et « lèvres » est conservé ; « ouvre toutes grandes » maintient l’image de la parole débridée, tandis que « court à sa perte » rend l’ellipse finale dans un français naturel et digne.
