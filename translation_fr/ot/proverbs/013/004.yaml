  text: מִתְאַוָּ֣ה וָ֭/אַיִן נַפְשׁ֣/וֹ עָצֵ֑ל וְ/נֶ֖פֶשׁ חָרֻצִ֣ים תְּדֻשָּֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: fr
  text: Le paresseux désire, mais il n’a rien ; l’appétit des diligents sera pleinement satisfait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sera engraissé » ; image hébraïque d’une satisfaction abondante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: a des désirs
  rationale: Le participe hitpael exprime ici un désir persistant. « A des désirs » est naturel en français et maintient l’opposition entre les souhaits du paresseux et l’assouvissement des personnes assidues.
- source_word: וָאַיִן
  choice: mais il n’a rien
  rationale: La négation existentielle indique que le désir reste sans résultat. Cette formulation française concise reflète directement le contraste du premier membre.
- source_word: נַפְשׁוֹ
  choice: il
  rationale: Dans le premier membre, נֶפֶשׁ désigne la personne désirante ou son appétit. La tournure « il n’a rien » évite un emploi artificiel de « âme » tout en conservant le sens contextuel.
- source_word: עָצֵל
  choice: le paresseux
  rationale: Terme sapientiel désignant une personne caractérisée par la paresse. « Le paresseux » est courant, clair et adapté au registre proverbial.
- source_word: וְנֶפֶשׁ
  choice: l’appétit
  rationale: Ici נֶפֶשׁ évoque le désir ou l’appétit de la personne, sans désigner techniquement une âme immatérielle. « Appétit » rend concrètement l’image et le parallélisme.
- source_word: חָרֻצִים
  choice: des personnes assidues
  rationale: L’adjectif pluriel substantivé désigne ceux qui se distinguent par leur diligence. Cette formulation inclusive et naturelle évite l’ambiguïté possible de « les assidus ».
- source_word: תְּדֻשָּׁן
  choice: sera comblé d’abondance
  rationale: Le pual de דשׁן évoque littéralement le fait d’être engraissé, image hébraïque de profusion et de pleine satisfaction. La traduction conserve l’idée d’abondance sans imposer la seule prospérité matérielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et proverbial. Le balancement entre désir stérile et appétit comblé est préservé. Le pronom disloqué « lui » souligne naturellement le contraste entre le paresseux et les personnes assidues.
