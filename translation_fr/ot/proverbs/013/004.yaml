review_pass:
  verdict: revise
  source_fidelity: Le sens global et le contraste proverbial sont bien rendus. Toutefois, « personnes assidues » évoque surtout la régularité ou l’assiduité, alors que חָרוּצִים désigne des personnes laborieuses et appliquées. « Diligents » restitue plus exactement ce terme sapientiel. La formulation révisée conserve le désir non satisfait du paresseux et la satisfaction abondante associée aux diligents.
  naturalness: « Le paresseux désire » est plus direct et proverbial que « a des désirs ». « Sera comblé d’abondance » est peu idiomatique en français moderne ; « sera pleinement satisfait » est naturel tout en conservant l’image de satisfaction abondante, explicitée par la note.
  terminology: « Paresseux » convient pour עָצֵל. « Appétit » est défendable pour נֶפֶשׁ dans ce parallélisme, sans importer une notion technique d’« âme ». « Diligents » est préférable à « personnes assidues » pour חָרוּצִים.
  issues:
  - severity: medium
    issue: « personnes assidues » affaiblit le sens de חָרוּצִים.
    rationale: En français, « assidu » renvoie principalement à la régularité et à la présence. Le terme hébreu qualifie ici des personnes laborieuses, actives et diligentes, en opposition au paresseux.
  - severity: low
    issue: « sera comblé d’abondance » est une collocation maladroite.
    rationale: Le français dit plus naturellement qu’un appétit « sera pleinement satisfait » ou qu’une personne « sera comblée ». La note peut conserver l’image lexicale d’« engraissement ».
  revised_text: Le paresseux désire, mais il n’a rien ; l’appétit des diligents sera pleinement satisfait.[a]
  revised_footnotes:
