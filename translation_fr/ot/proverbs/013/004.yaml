- from: Le paresseux a des désirs, mais il n’a rien ; l’appétit des personnes assidues, lui, sera comblé d’abondance.[a]
  to: Le paresseux désire, mais il n’a rien ; l’appétit des diligents sera pleinement satisfait.[a]
