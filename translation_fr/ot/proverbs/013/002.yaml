    rationale: « Du fruit de sa bouche, un homme se nourrit » est compréhensible, mais l’antécédent de « sa » ne vient qu’après le groupe et la tournure est moins fluide en français contemporain.
  - severity: medium
    issue: « Traîtres » est trop spécifique pour בֹּגְדִים
    rationale: Le terme hébreu vise largement des personnes perfides ou déloyales ; « traîtres » peut orienter le lecteur vers une trahison formelle, notamment politique.
