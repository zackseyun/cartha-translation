source:
  edition: WLC
  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יֹ֣אכַל ט֑וֹב וְ/נֶ֖פֶשׁ בֹּגְדִ֣ים חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: fr
  text: Grâce au fruit de sa bouche, un homme se nourrit de ce qui est bon, mais l’appétit des perfides est la violence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très elliptique : littéralement, « mais l’âme — ou l’appétit — des perfides, la violence ». On peut aussi comprendre : « mais l’âme des perfides se nourrit de violence ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: Du fruit de sa bouche, un homme
  rationale: Conserve l’image concrète du « fruit de la bouche », c’est-à-dire le produit des paroles. אִישׁ est rendu par « un homme », conformément à la forme masculine singulière et à sa portée proverbiale générale.
- source_word: יֹאכַל טוֹב
  choice: se nourrit de ce qui est bon
  rationale: 'L’imparfait exprime ici une vérité générale. « Se nourrit » maintient la métaphore alimentaire et « ce qui est bon » laisse à טוֹב sa portée ouverte : bien, bénéfice ou résultat favorable.'
- source_word: וְנֶפֶשׁ
  choice: mais l’appétit
  rationale: נֶפֶשׁ peut désigner la personne, l’âme, le désir ou l’appétit. Dans cette proposition elliptique mise en parallèle avec « se nourrit », « appétit » rend naturellement le désir intérieur, tandis que « mais » explicite le contraste.
- source_word: בֹּגְדִים
  choice: des traîtres
  rationale: Le participe décrit ceux qui agissent avec perfidie ou déloyauté. « Traîtres » est courant et vigoureux en français, sans restreindre nécessairement le terme à la trahison politique.
- source_word: חָמָס
  choice: la violence
  rationale: חָמָס désigne couramment la violence ou le tort violent. « Violence » est direct et préserve le contraste avec « ce qui est bon ».
theological_decisions:
- issue: Ellipse de la seconde proposition
  choice: « l’appétit des traîtres, c’est la violence »
  alternative: « l’âme des traîtres se nourrit de violence »
  rationale: L’hébreu ne comporte aucun verbe exprimé dans la seconde proposition. La traduction retenue préserve cette concision et comprend נֶפֶשׁ comme « appétit », sans importer explicitement le verbe « manger » de la première proposition. Une autre analyse peut sous-entendre ce verbe et conserver le sens littéral « âme ».
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image proverbiale du fruit de la bouche et la tension de la proposition hébraïque elliptique, tout en évitant un calque peu intelligible.
