id: PRO.13.23
reference: Proverbs 13:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: fr
  text: Le champ fraîchement labouré des pauvres[a] donne une nourriture abondante, mais certains sont emportés faute de justice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «La terre en friche des pauvres» ou «Le champ cultivé des pauvres».
    reason: alternative lexicale
  - marker: b
    text: Ou «mais il y a ce qui est emporté sans justice». Le second membre est très concis en hébreu et peut se traduire de manière plus impersonnelle.
    reason: lecture alternative
lexical_decisions:
- source_word: רָב אֹכֶל
  choice: une nourriture abondante
  rationale: Cette expression rend la grande quantité de nourriture ou de produit agricole sans préciser indûment la récolte.
- source_word: נִיר
  choice: le champ fraîchement labouré
  rationale: Le terme désigne une terre arable récemment défrichée ou labourée; cette formulation française est claire et conserve l’image agricole.
- source_word: רָאשִׁים
  choice: des pauvres
  rationale: Malgré sa forme inhabituelle, le mot est traditionnellement compris ici comme désignant des personnes pauvres ou démunies.
- source_word: וְיֵשׁ
  choice: mais certains sont
  rationale: La construction existentielle introduit ici un contraste; le français idiomatique emploie «certains» sans imposer l’idée précise d’un seul individu.
- source_word: נִסְפֶּה
  choice: sont emportés
  rationale: Le participe passif évoque le fait d’être supprimé, détruit ou balayé; «emportés» en conserve la force imagée et le passif.
- source_word: בְּלֹא מִשְׁפָּט
  choice: faute de justice
  rationale: La formule exprime naturellement l’absence de justice, de jugement équitable ou de droit, présentée comme liée à la ruine.
theological_decisions:
- issue: Interprétation du second membre du proverbe
  choice: Le texte oppose le potentiel productif du champ des pauvres à la ruine que certains subissent faute de justice.
  alternative: Comprendre impersonnellement que quelque chose est perdu sans jugement, éventuellement la récolte elle-même.
  rationale: בלא משפט porte naturellement un sens éthique et judiciaire dans les Proverbes. La traduction garde toutefois le sujet assez indéfini pour ne pas préciser le mécanisme de la ruine.
translation_notes:
  register: Français international moderne, naturel et digne. «Champ fraîchement labouré» rend l’image agricole plus immédiatement que le terme technique «jachère», tandis que les notes préservent les principales possibilités lexicales et syntaxiques.
