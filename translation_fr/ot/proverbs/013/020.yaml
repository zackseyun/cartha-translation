  source_fidelity: 'Le texte rend fidèlement le parallélisme hébreu : la fréquentation des sages conduit à la sagesse, tandis que la compagnie des insensés entraîne une conséquence nuisible. « Marche avec » restitue bien l’idée d’accompagnement de הָלוֹךְ אֶת, et « fréquente » exprime naturellement la valeur associative de רֹעֶה dans ce contexte. « Deviendra sage » rend de manière recevable la conséquence exprimée par וְחָכָם. « S’en trouvera mal » conserve l’ampleur de יֵרוֹעַ sans imposer une ruine totale.'
  naturalness: Le français est moderne, fluide et proverbial. La reprise de « qui » dans les deux membres est naturelle, et « mais » explicite sobrement l’opposition du parallélisme. « S’en trouvera mal » est une expression idiomatique au registre approprié.
  terminology: « Sages » et « insensés » conviennent au lexique sapientiel et évitent de réduire ces catégories à la seule intelligence ou à une insulte. La note présente des possibilités lexicales sans les confondre avec le sens principal.
