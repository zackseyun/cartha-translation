  text: הלוך אֶת חֲכָמִ֣ים ו/חכם וְ/רֹעֶ֖ה כְסִילִ֣ים יֵרֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/020.yaml
  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: fr
  text: 'Qui marche avec les sages deviendra sage,

    mais qui fréquente les insensés s’en trouvera mal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « subira du tort », « connaîtra le malheur » ou « ira à sa perte ». Le verbe hébreu peut désigner un dommage subi ou une issue défavorable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ אֶת חֲכָמִים
  choice: Qui marche avec les sages
  rationale: La tournure proverbiale désigne la personne qui chemine en compagnie des sages. « Marche avec » conserve la métaphore hébraïque de la conduite et de la fréquentation tout en restant naturel en français.
- source_word: וַחֲכָם
  choice: deviendra sage
  rationale: La forme exprime ici la conséquence de la fréquentation des sages. « Deviendra sage » rend plus clairement cette progression que le simple état « sera sage ».
- source_word: וְרֹעֶה כְסִילִים
  choice: mais qui fréquente les insensés
  rationale: Dans ce contexte, רעה désigne le fait de se tenir en compagnie de quelqu’un. « Fréquente » établit le contraste avec « marche avec » sans introduire l’image trompeuse d’un berger.
- source_word: כְסִילִים
  choice: les insensés
  rationale: « Insensés » rend la catégorie morale et intellectuelle caractéristique des Proverbes, sans suggérer seulement un manque d’intelligence.
- source_word: יֵרוֹעַ
  choice: s’en trouvera mal
  rationale: Le nifal de רעע indique qu’une personne subit un dommage ou connaît une issue défavorable. Cette formulation française préserve l’étendue du sens sans imposer l’idée plus forte de ruine totale.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme est conservé, avec « mais » pour rendre l’opposition implicite entre les deux membres. « Qui » garde la portée générale et inclusive du proverbe.
