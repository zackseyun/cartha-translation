source:
  edition: WLC
  text: חוֹשֵׂ֣ךְ שִׁ֭בְט/וֹ שׂוֹנֵ֣א בְנ֑/וֹ וְ֝/אֹהֲב֗/וֹ שִֽׁחֲר֥/וֹ מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: fr
  text: Qui retient son bâton[a] déteste son fils, mais qui l’aime s’applique à le discipliner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épargne son bâton ». Le verbe hébreu peut exprimer le fait de retenir ou d’épargner.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque évoque le fait de rechercher avec empressement ou assiduité la discipline pour lui. Le terme מוּסָר peut désigner la discipline, la correction ou l’instruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: retient
  rationale: Le participe de חשׂך exprime le fait de retenir ou de ne pas employer quelque chose. « Retient » conserve cette action délibérée sans donner à « épargner » une connotation moderne nécessairement bienveillante.
- source_word: שִׁבְטוֹ
  choice: son bâton
  rationale: שֵׁבֶט désigne concrètement un bâton, une verge ou un sceptre. « Bâton » est clair en français moderne et maintient l’image concrète du proverbe.
- source_word: שׂוֹנֵא
  choice: déteste
  rationale: Le verbe signifie directement « haïr, détester ». Le terme fort préserve l’antithèse volontaire du proverbe sans l’atténuer.
- source_word: בְנוֹ
  choice: son fils
  rationale: Le texte hébreu dit précisément « son fils »; la traduction conserve cette référence masculine plutôt que de la généraliser en « enfant ».
- source_word: וְאֹהֲבוֹ
  choice: mais qui l’aime
  rationale: La tournure participiale et le suffixe objet renvoyant au fils sont rendus naturellement en français.
- source_word: שִׁחֲרוֹ
  choice: s’empresse de le
  rationale: Le piel de שׁחר, associé à l’idée de chercher tôt, exprime ici l’empressement ou la diligence. Le pronom suffixe « le » renvoie au fils et doit être représenté dans la traduction.
- source_word: מוּסָר
  choice: corriger
  rationale: מוּסָר couvre l’instruction, la correction et la discipline morale. Dans ce contexte parallèle au bâton, « corriger » exprime naturellement l’aspect correctif sans réduire le terme au seul châtiment physique.
theological_decisions:
- issue: Faut-il atténuer l’image de la correction corporelle ?
  choice: Conserver l’image concrète du « bâton » tout en rendant מוּסָר par le terme plus large « corriger ».
  alternative: Remplacer « bâton » par une notion générale comme « encadrement » ou « conseils ».
  rationale: Le texte nomme explicitement le שֵׁבֶט, le « bâton », et il faut préserver cette image ainsi que la tension éthique du proverbe. Toutefois, מוּסָר englobe plus largement la correction, l’instruction et la formation; le verset ne doit donc pas être réduit à la seule punition physique.
- issue: Force rhétorique du verbe « haïr »
  choice: Traduire שׂנא par « déteste ».
  alternative: Atténuer en « ne fait pas vraiment preuve d’amour envers ».
  rationale: L’antithèse entre détester et aimer est explicite dans l’hébreu. La traduction conserve cette formulation proverbiale tranchée sans en faire une description psychologique exhaustive.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste concise comme le proverbe hébreu. « Bâton » maintient l’image concrète; « s’empresse de le corriger » restitue à la fois le suffixe objet renvoyant au fils et la diligence exprimée par שׁחר, dans une tournure française naturelle.
