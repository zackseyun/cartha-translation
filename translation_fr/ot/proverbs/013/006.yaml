  source_fidelity: Le premier membre rend correctement צְדָקָה, נצר et l’idée de תָּם דָּרֶךְ. Dans le second, חַטָּאת peut effectivement être compris de façon concrète, « le pécheur », mais cette lecture reste disputée; le texte principal et la note doivent présenter l’alternative abstraite sans la qualifier indûment de « plus littérale ». « Cause la ruine » est une explicitation plus forte que nécessaire de תְּסַלֵּף.
