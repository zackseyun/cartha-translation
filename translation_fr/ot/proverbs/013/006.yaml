  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: fr
  text: La justice protège celui dont la conduite est intègre, mais la méchanceté ruine le pécheur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais la méchanceté renverse le péché ». Le terme hébreu rendu par « pécheur » peut aussi être compris comme désignant le péché.'
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: La justice
  rationale: Dans ce proverbe éthique, le terme désigne la rectitude morale et la conduite conforme au bien. « Justice » est naturel en français et conserve la portée morale du mot.
- source_word: תִּצֹּר
  choice: protège
  rationale: Le verbe נצר signifie garder, préserver ou veiller sur. « Protège » exprime clairement ici l’effet bénéfique de la justice.
- source_word: תָּם דָּרֶךְ
  choice: celui dont la conduite est intègre
  rationale: La tournure hébraïque condensée qualifie vraisemblablement une personne irréprochable quant à sa voie. Cette formulation française restitue l’image éthique de la « voie » par « conduite » sans suggérer une absence absolue de péché.
- source_word: וְרִשְׁעָה
  choice: mais la méchanceté
  rationale: Le waw introduit ici le contraste entre les effets de la justice et ceux de la méchanceté. « Méchanceté » rend le caractère moralement mauvais exprimé par רִשְׁעָה.
- source_word: תְּסַלֵּף
  choice: cause la ruine
  rationale: Le piel de סלף évoque le fait de tordre, bouleverser ou renverser. Avec une personne comme complément, « cause la ruine » donne en français un sens naturel tout en conservant l’issue destructrice.
- source_word: חַטָּאת
  choice: du pécheur
  rationale: Bien que le nom désigne ordinairement le péché, il peut ici désigner concrètement la personne caractérisée par le péché. Le parallélisme avec la personne intègre favorise « le pécheur », tandis que le sens abstrait est conservé en note.
theological_decisions:
- issue: Sens concret ou abstrait de חַטָּאת dans le second membre
  choice: Le texte principal comprend le terme comme désignant « le pécheur ».
  alternative: '« le péché » : « mais la méchanceté bouleverse le péché »'
  rationale: Le parallélisme antithétique oppose probablement la personne dont la conduite est intègre au pécheur. Toutefois, la forme hébraïque peut se lire littéralement comme « péché »; la note maintient donc cette ambiguïté réelle au lieu de la supprimer.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Conduite » rend naturellement la métaphore hébraïque de la voie; « intègre » évite de faire de תָּם une affirmation de perfection absolue.
