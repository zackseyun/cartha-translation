  terminology: « Justice », « intègre », « méchanceté » et « pécheur » conviennent au registre et aux termes sapientiaux. Le choix de « pécheur » est conservé dans le texte, avec une note qui maintient explicitement la possibilité de comprendre חַטָּאת comme « péché ».
