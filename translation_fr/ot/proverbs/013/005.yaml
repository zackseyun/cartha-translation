id: PRO.13.5
reference: Proverbs 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דְּבַר שֶׁ֭קֶר יִשְׂנָ֣א צַדִּ֑יק וְ֝/רָשָׁ֗ע יַבְאִ֥ישׁ וְ/יַחְפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/005.yaml
  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
translation:
  language: fr
  text: Le juste déteste la parole mensongère, mais le méchant se rend odieux et se couvre de honte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les deux derniers verbes peuvent aussi se comprendre ainsi : « agit de manière répugnante et honteuse » ou « devient odieux et est couvert de honte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: la parole mensongère
  rationale: Le syntagme construit signifie littéralement « parole de mensonge ». Cette formulation conserve l’image concrète de la parole tout en restant naturelle en français.
- source_word: יִשְׂנָא
  choice: déteste
  rationale: Le verbe exprime ici une vive aversion morale. « Déteste » est direct, actuel et idiomatique.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier est substantivé. « Le juste » conserve le type proverbial singulier et appartient au registre naturel de la littérature sapientiale française.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le masculin singulier substantivé répond à « le juste » et maintient l’antithèse concise du proverbe.
- source_word: יַבְאִישׁ
  choice: se rend odieux
  rationale: Le hiphil de באש évoque ce qui devient ou fait devenir puant, donc odieux. « Se rend odieux » restitue la portée figurée sans imposer en français une image olfactive potentiellement trompeuse.
- source_word: וְיַחְפִּיר
  choice: et se couvre de honte
  rationale: Le verbe peut exprimer la honte subie ou la conduite honteuse. « Se couvre de honte » rend naturellement la conséquence attachée au méchant, tout en laissant ouverte la nuance entre devenir honteux et subir la honte.
theological_decisions:
- issue: Valeur des deux verbes décrivant le méchant
  choice: Description du méchant comme devenant odieux et couvert de honte
  alternative: « agit de manière honteuse et déshonorante » ou « devient odieux et est déshonoré »
  rationale: L’hébreu permet de comprendre ces formes comme décrivant soit sa conduite honteuse, soit la honte qui lui échoit. Le texte principal privilégie une formulation naturelle qui conserve l’idée de résultat, et la note signale l’ambiguïté.
translation_notes:
  register: Français moderne, digne et concis, avec la symétrie proverbiale « le juste / le méchant ». La formulation évite le littéralisme « pue », trop familier et susceptible de masquer le sens moral figuré.
