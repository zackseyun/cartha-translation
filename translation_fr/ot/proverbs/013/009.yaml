source:
  edition: WLC
  text: אוֹר צַדִּיקִ֥ים יִשְׂמָ֑ח וְ/נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: fr
  text: La lumière des justes se réjouit[a], mais la lampe des méchants s’éteint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est dans la joie ». Le verbe hébreu signifie normalement « se réjouir » ou « être dans la joie »; certains le comprennent ici, puisque son sujet est la lumière, au sens contextuel de « briller vivement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: lumière
  rationale: Le nom désigne couramment la lumière ou la clarté. « Lumière » est naturel en français et maintient le contraste poétique avec la « lampe » du second membre.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif pluriel est employé comme substantif. « Les justes » exprime avec concision cette catégorie morale caractéristique de la littérature de sagesse.
- source_word: יִשְׂמָח
  choice: se réjouit
  rationale: Le verbe שׂמח signifie normalement « se réjouir, être dans la joie ». Cette traduction conserve la personnification frappante de la lumière sans attribuer au verbe le sens lexical de « briller ».
- source_word: נֵר
  choice: lampe
  rationale: נֵר désigne une lampe, généralement une lampe à huile, et non précisément une bougie. « Lampe » préserve aussi le contraste entre la lumière des justes et l’objet lumineux périssable des méchants.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif pluriel est substantivé. « Les méchants » est une formulation concise, naturelle et habituelle dans les textes sapientiaux.
- source_word: יִדְעָךְ
  choice: s’éteint
  rationale: Le verbe signifie s’éteindre ou être éteint, notamment à propos d’une lampe. « S’éteint » est idiomatique et ne précise pas indûment l’agent.
- source_word: וְ
  choice: mais
  rationale: La conjonction signifie formellement « et », mais elle relie ici deux membres antithétiques; « mais » rend clairement cette opposition en français.
