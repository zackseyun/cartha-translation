  text: כֹּ֣פֶר נֶֽפֶשׁ אִ֣ישׁ עָשְׁר֑/וֹ וְ֝/רָ֗שׁ לֹא שָׁמַ֥ע גְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: fr
  text: La richesse d’un homme est la rançon de sa vie, mais le pauvre n’entend pas de réprimande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de menace ». La seconde ligne peut évoquer le fait que le pauvre, n’ayant rien à verser, n’est pas visé par une demande de rançon ou d’extorsion.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: rançon
  rationale: Le terme désigne le prix versé pour préserver ou racheter une vie; « rançon » conserve ici son sens économique et concret.
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans ce contexte sapiential, le mot désigne la vie de la personne plutôt qu’une âme immatérielle.
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier hébreu est conservé, tout en restant naturel dans le style proverbial français.
- source_word: עָשְׁרוֹ
  choice: la richesse d’un homme
  rationale: « Richesse » exprime naturellement les biens matériels et forme le contraste avec « le pauvre ».
- source_word: רָשׁ
  choice: le pauvre
  rationale: Cette formulation rend le substantif masculin singulier et préserve l’opposition concise du proverbe.
- source_word: לֹא שָׁמַע
  choice: n’entend pas
  rationale: La traduction garde l’image auditive de l’hébreu sans préciser à tort s’il s’agit d’entendre, d’écouter ou de subir la parole.
- source_word: גְּעָרָה
  choice: menace
  rationale: Le mot signifie normalement réprimande ou reproche, mais peut désigner une parole sévère et menaçante. Dans le contraste avec la rançon, « menace » rend plus clairement la probable pression exercée sur le riche, tandis que l’autre sens est signalé en note.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et proverbial. « Sert de rançon » explicite sobrement la relation nominale hébraïque sans résoudre au-delà du texte le mécanisme précis du danger. Le marqueur de note est placé après la proposition concernée.
