  text: צַדִּ֗יק אֹ֭כֵל לְ/שֹׂ֣בַע נַפְשׁ֑/וֹ וּ/בֶ֖טֶן רְשָׁעִ֣ים תֶּחְסָֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: fr
  text: Le juste mange à sa faim[a], mais le ventre des méchants reste affamé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le mot נֶפֶשׁ (néfèsh), qui peut désigner l’âme, la vie, la personne elle-même ou l’appétit, selon le contexte. Littéralement : « pour le rassasiement de sa nefèsh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier employé comme substantif désigne ici, de façon représentative, celui qui agit avec justice. « Le juste » est naturel et traditionnel dans la littérature sapientiale française.
- source_word: אֹכֵל
  choice: mange
  rationale: Le participe exprime une vérité générale ou une conduite habituelle; le présent rend bien cette valeur proverbiale.
- source_word: לְשֹׂבַע נַפְשׁוֹ
  choice: jusqu’à être rassasié
  rationale: Cette formulation française naturelle exprime l’idée de manger à satiété. Dans ce contexte alimentaire, נֶפֶשׁ renvoie vraisemblablement à la personne elle-même ou à son appétit, sans qu’il soit nécessaire d’introduire ici le terme potentiellement trompeur « âme ».
- source_word: וּבֶטֶן
  choice: mais le ventre
  rationale: « Ventre » conserve l’image corporelle de l’hébreu, tandis que « mais » explicite la valeur adversative de la conjonction dans ce parallélisme contrastif.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne les personnes mauvaises comme une catégorie; « les méchants » convient au registre sapiential.
- source_word: תֶּחְסָר
  choice: reste affamé
  rationale: Le verbe signifie manquer, être dans le besoin. Avec « ventre » comme sujet, « reste affamé » communique naturellement l’insuffisance et le manque persistants, en contraste avec le rassasiement du juste.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme entre le rassasiement du juste et le ventre affamé des méchants est conservé, avec une formulation idiomatique qui évite de donner à נֶפֶשׁ un sens exclusivement immatériel.
