  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: fr
  text: Un fils sage écoute la discipline d’un père[a], mais un railleur[b] n’écoute pas la réprimande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le premier membre ne comporte pas de verbe : « Un fils sage, la discipline d’un père ». Le verbe « écouter », exprimé dans le second membre, y est probablement sous-entendu; il peut aussi impliquer le fait d’accueillir la discipline ou d’en tenir compte.'
    reason: ambiguïté_syntaxique_et_lexicale
  - marker: b
    text: Ou « moqueur ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: בֵּן
  choice: fils
  rationale: Le nom hébreu est masculin singulier et présente ici, selon le style proverbial, un cas représentatif; « fils » conserve cette forme sans la neutraliser.
- source_word: חָכָם
  choice: sage
  rationale: Dans les Proverbes, l’adjectif désigne la sagesse pratique et le discernement moral; « sage » est le terme français naturel.
- source_word: מוּסַר
  choice: discipline
  rationale: Le mot désigne une formation qui comporte instruction et correction; « discipline » préserve cette portée formative et corrective.
- source_word: אָב
  choice: d’un père
  rationale: L’hébreu dit littéralement « discipline d’un père » sans suffixe possessif; traduire « de son père » préciserait indûment le rapport.
- source_word: לֵץ
  choice: moqueur
  rationale: Le terme désigne dans les Proverbes celui qui tourne avec arrogance la correction en dérision. « Moqueur » est clair et courant en français moderne.
- source_word: שָׁמַע
  choice: écoute / n’écoute pas
  rationale: Le verbe peut exprimer le fait d’entendre, d’écouter ou de tenir compte. La répétition française de « écouter » rend le verbe explicite du second membre et son ellipse probable dans le premier, sans imposer entièrement le sens plus fort d’« accepter » ou d’« obéir ».
- source_word: גְּעָרָה
  choice: réprimande
  rationale: Le nom désigne un blâme verbal énergique; « réprimande » est précis, actuel et convient au parallèle avec la discipline.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé par la répétition d’« écoute », tandis que la note signale l’ellipse verbale et la nuance possible d’adhésion ou d’obéissance.
