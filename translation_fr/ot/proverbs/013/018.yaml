id: PRO.13.18
reference: Proverbs 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: fr
  text: 'Pauvreté et déshonneur à qui néglige la discipline,

    mais celui qui tient compte de la réprimande sera honoré.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵישׁ
  choice: Pauvreté
  rationale: Le nom désigne le manque ou la pauvreté. « Pauvreté » est clair, actuel et convient à l’énoncé de conséquence.
- source_word: קָלוֹן
  choice: déshonneur
  rationale: Le terme évoque la honte et la perte publique d’honneur. « Déshonneur » préserve cette dimension sociale et forme un contraste lexical net avec « sera honoré ».
- source_word: פּוֹרֵעַ
  choice: pour qui rejette
  rationale: Le participe peut signifier négliger, délaisser ou rejeter une contrainte. « Rejette » exprime naturellement l’abandon de la discipline sans préciser davantage que l’hébreu le degré d’intention.
- source_word: מוּסָר
  choice: la discipline
  rationale: Dans les Proverbes, le mot désigne une formation corrective, et non une simple transmission d’informations. « Discipline » conserve cette nuance.
- source_word: שׁוֹמֵר
  choice: qui tient compte de
  rationale: Le sens littéral est « garder ». Dans ce parallélisme, il s’agit d’accueillir attentivement la correction et de la retenir; « tient compte de » rend ce sens en français naturel.
- source_word: תּוֹכַחַת
  choice: la réprimande
  rationale: Le nom désigne une correction verbale ou un reproche. « Réprimande » le distingue de la formation corrective plus large exprimée par מוּסָר.
- source_word: יְכֻבָּד
  choice: sera honoré
  rationale: Le pual exprime ici le fait de recevoir de l’honneur. Le passif français suit fidèlement la forme et le résultat social du proverbe.
theological_decisions: []
translation_notes:
  register: Formulation concise et proverbiale, en français international moderne. La première proposition nominale conserve la vigueur elliptique de l’hébreu; la seconde garde le passif. Le parallélisme entre « déshonneur » et « honoré » est rendu explicitement, sans ajouter de lien causal absent du texte.
