  text: כָּל עָ֭רוּם יַעֲשֶׂ֣ה בְ/דָ֑עַת וּ֝/כְסִ֗יל יִפְרֹ֥שׂ אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/016.yaml
  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: fr
  text: Toute personne avisée agit en connaissance de cause, mais l’insensé étale sa folie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déploie sa folie » ou « expose sa folie ». Le verbe hébreu évoque le fait d’étendre quelque chose ou de le mettre au grand jour.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Toute
  rationale: 'Le terme a ici une valeur distributive et générale : chaque personne appartenant à cette catégorie est concernée.'
- source_word: עָרוּם
  choice: personne avisée
  rationale: Dans les Proverbes, le mot désigne généralement quelqu’un de prudent, perspicace et prévoyant, sans la nuance négative de « rusé ».
- source_word: יַעֲשֶׂה
  choice: agit
  rationale: Ce verbe courant décrit ici la conduite habituelle ; « agit » convient au caractère général de la maxime.
- source_word: בְדָעַת
  choice: en connaissance de cause
  rationale: La préposition indique que l’action repose sur la connaissance ; cette expression française rend naturellement cette valeur adverbiale.
- source_word: וּכְסִיל
  choice: mais l’insensé
  rationale: Bien que la conjonction puisse littéralement signifier « et », « mais » exprime clairement l’opposition entre les deux membres du proverbe. « Insensé » conserve la portée morale et sapientielle du terme.
- source_word: יִפְרֹשׂ
  choice: étale
  rationale: Le verbe évoque l’action de déployer, d’étendre ou d’exposer au grand jour ; « étale » garde cette image tout en restant idiomatique.
- source_word: אִוֶּלֶת
  choice: sa folie
  rationale: « Folie » est le terme abstrait traditionnel et naturel pour cette notion majeure de la littérature sapientielle ; le possessif est implicite dans le rapport entre l’insensé et la folie qu’il manifeste.
