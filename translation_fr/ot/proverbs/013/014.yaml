  text: תּוֹרַ֣ת חָ֭כָם מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: fr
  text: L’enseignement d’un sage[a] est une source de vie, pour qu’on se détourne des pièges de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le masculin singulier de manière représentative.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹרַת
  choice: L’enseignement de
  rationale: Dans la littérature sapientielle, תּוֹרָה désigne ici un enseignement ou une instruction, et non un code juridique.
- source_word: חָכָם
  choice: un sage
  rationale: Le masculin singulier hébreu présente une figure représentative. « Un sage » conserve cette forme et convient naturellement au style proverbial français.
- source_word: מְקוֹר
  choice: une source
  rationale: Le terme évoque une source d’eau vive. « Source de vie » est à la fois fidèle, naturel et poétique en français.
- source_word: חַיִּים
  choice: vie
  rationale: Bien que le mot hébreu ait une forme plurielle, il exprime couramment la notion abstraite de vie.
- source_word: לָסוּר
  choice: pour se détourner
  rationale: L’infinitif peut exprimer le but ou le résultat. La tournure pronominale respecte le caractère non causatif du verbe hébreu et laisse son sujet implicite, comme dans le texte source.
- source_word: מִמֹּקְשֵׁי
  choice: des pièges de
  rationale: מוֹקֵשׁ désigne un piège ou un lacet. « Pièges » rend clairement la métaphore en français courant.
- source_word: מָוֶת
  choice: la mort
  rationale: Traduction directe du nom dans l’expression métaphorique « les pièges de la mort ».
theological_decisions:
- issue: Sujet implicite de לָסוּר
  choice: pour se détourner
  alternative: pour détourner quelqu’un
  rationale: L’hébreu emploie un verbe non causatif sans sujet explicite. La traduction retenue préserve cette indétermination au lieu d’ajouter un agent ou un objet.
translation_notes:
  register: Français moderne, sobre et proverbial. « Enseignement », « source de vie » et « pièges de la mort » conservent le parallélisme imagé et la dignité poétique de l’hébreu.
