source:
  edition: WLC
  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: fr
  text: L’homme de bien laisse un héritage aux enfants de ses enfants[a], mais les biens du pécheur sont mis en réserve[b] pour le juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils des fils »; c’est-à-dire à ses petits-enfants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sont cachés » ou « sont réservés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: l’homme de bien
  rationale: L’adjectif masculin singulier est employé comme substantif et désigne, dans la formulation proverbiale, un homme caractérisé par le bien. « L’homme de bien » est naturel, digne et garde la forme masculine du texte.
- source_word: יַנְחִיל
  choice: laisse un héritage
  rationale: Le hiphil de נחל signifie faire hériter ou donner en héritage. Cette expression française rend naturellement l’idée d’une transmission patrimoniale.
- source_word: בְּנֵי בָנִים
  choice: aux enfants de ses enfants
  rationale: La formulation conserve l’expression hébraïque littérale et souligne explicitement la continuité sur deux générations; elle équivaut à « ses petits-enfants ».
- source_word: וְצָפוּן
  choice: mais ... sont mis en réserve
  rationale: Le participe passif de צפן peut exprimer ce qui est caché, amassé ou réservé. « Mis en réserve » convient aux biens et fait ressortir le contraste proverbial sans préciser le mécanisme de leur transfert.
- source_word: לַצַּדִּיק
  choice: pour le juste
  rationale: Le ל marque ici le bénéficiaire, et l’adjectif substantivé au singulier représente la personne juste comme type proverbial.
- source_word: חֵיל
  choice: les biens
  rationale: Dans ce contexte patrimonial, חֵיל désigne les ressources, la fortune ou les richesses. « Les biens » s’accorde naturellement avec l’héritage évoqué dans le premier membre.
- source_word: חוֹטֵא
  choice: du pécheur
  rationale: Le participe substantivé désigne celui qui pèche comme figure proverbiale; « le pécheur » en conserve la concision et l’opposition avec « le juste ».
theological_decisions:
- issue: Adjectif substantivé masculin dans une maxime générale
  choice: l’homme de bien
  alternative: la personne de bien
  rationale: Le texte hébreu emploie le masculin singulier. La traduction le conserve sans prétendre limiter la portée morale du proverbe aux seuls hommes.
- issue: Portée de la mise en réserve des biens du pécheur
  choice: sont mis en réserve pour le juste
  alternative: sont cachés pour le juste
  rationale: Le texte affirme la destination finale des biens sans expliquer quand ni comment elle se réalise. La traduction préserve cette tension et n’en fait ni une promesse mécanique ni une description détaillée de la providence.
translation_notes:
  register: Français international moderne, proverbial et digne. Le parallélisme antithétique est marqué par « mais ». La formulation reste proche de l’hébreu tout en étant immédiatement compréhensible.
