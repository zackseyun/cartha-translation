  text: מַלְאָ֣ךְ רָ֭שָׁע יִפֹּ֣ל בְּ/רָ֑ע וְ/צִ֖יר אֱמוּנִ֣ים מַרְפֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/017.yaml
  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
translation:
  language: fr
  text: Un messager méchant tombe dans le malheur[a], mais un envoyé fidèle[b] apporte la guérison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombe dans le mal » ou « tombe dans l’adversité ». L’expression hébraïque peut désigner le mal, le tort ou la détresse dans lesquels le messager tombe.
    reason: lexical_alternative
  - marker: b
    text: Ou « messager » ou « ambassadeur ». L’hébreu emploie dans ce proverbe deux mots différents pour désigner un messager.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: messager
  rationale: Dans ce contexte sapiential et social, le mot désigne vraisemblablement un messager humain, non un être céleste. « Messager » est le terme français le plus large et le plus naturel.
- source_word: רָשָׁע
  choice: méchant
  rationale: L’adjectif qualifie moralement le messager. « Méchant » conserve cette portée éthique sans réduire le terme à l’idée d’inefficacité ou de nuisance.
- source_word: יִפֹּל
  choice: tombe
  rationale: L’inaccompli exprime ici une vérité générale. Le présent convient au style proverbial et conserve l’image de la chute.
- source_word: בְּרָע
  choice: dans le malheur
  rationale: רָע peut désigner ici le mal, le tort subi ou la détresse qui atteint le messager. « Dans le malheur » rend naturellement la conséquence funeste tout en laissant une note signaler l’ambiguïté.
- source_word: צִיר
  choice: envoyé
  rationale: Le terme peut désigner un messager chargé d’une mission officielle. « Envoyé » le distingue de מַלְאָךְ tout en maintenant le parallélisme.
- source_word: אֱמוּנִים
  choice: fidèle
  rationale: La forme exprime la fiabilité et la loyauté. « Fidèle » est concis, naturel et conserve l’ampleur morale du terme.
- source_word: מַרְפֵּא
  choice: guérison
  rationale: Le nom désigne la guérison, le remède ou le rétablissement. « Guérison » préserve sa force imagée et son contraste avec le malheur.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé, ainsi que la distinction lexicale entre « messager » et « envoyé ». Le verbe « apporte » est explicité dans le second membre, qui est nominal en hébreu, afin d’obtenir une phrase française naturelle sans supprimer la portée de « guérison ».
