source:
  edition: WLC
  text: בָּ֣ז לְ֭/דָבָר יֵחָ֣בֶל ל֑/וֹ וִ/ירֵ֥א מִ֝צְוָ֗ה ה֣וּא יְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: fr
  text: Qui méprise une parole[a] court à sa perte[b], mais celui qui craint le commandement sera récompensé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affaire ». Le mot hébreu peut signifier « parole », « affaire » ou « chose ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en subira les conséquences » ou « attire la ruine sur lui-même ».
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « sera rétribué » ou « recevra ce qui lui est dû ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: méprise
  rationale: Le participe désigne une personne qui tient quelque chose pour méprisable. « Méprise » conserve directement la force morale de l’hébreu dans un français actuel.
- source_word: לְדָבָר
  choice: une parole
  rationale: דָבָר peut désigner une parole, une affaire ou une chose. « Une parole » préserve la forme lexicale et l’ouverture proverbiale du texte, probablement orientée ici vers une parole d’instruction ou de conseil.
- source_word: יֵחָבֶל לוֹ
  choice: court à sa perte
  rationale: Le niphal de חבל exprime ici le fait de subir un dommage ou d’aller à la ruine, tandis que לוֹ souligne que les conséquences retombent sur la personne elle-même. « Court à sa perte » rend naturellement cet effet sans préciser à l’excès le mécanisme.
- source_word: וִירֵא
  choice: celui qui craint
  rationale: La forme issue de ירא exprime la crainte respectueuse. « Craint » maintient le vocabulaire caractéristique de la littérature de sagesse sans le réduire au simple respect.
- source_word: מִצְוָה
  choice: le commandement
  rationale: מִצְוָה signifie directement « commandement » ou « ordre ». Le singulier défini conserve le contraste proverbial avec « une parole » ainsi que le poids éthique du terme.
- source_word: יְשֻׁלָּם
  choice: sera récompensé
  rationale: Le pual de שלם signifie être payé, rétribué ou recevoir ce qui est dû. Dans ce parallélisme, la rétribution est manifestement favorable; « sera récompensé » communique ce sens naturellement, tandis qu’une note conserve le sens plus littéral.
- source_word: הוּא
  choice: celui
  rationale: Le pronom explicite met en relief la personne qui craint le commandement. « Celui » préserve cette reprise emphatique tout en restant naturel en français proverbial.
theological_decisions:
- issue: Portée générique du masculin singulier dans un proverbe de sagesse
  choice: Employer « qui » dans le premier membre et « celui qui » dans le second.
  alternative: Employer « quiconque » dans les deux membres, ou répéter « celui qui » partout.
  rationale: Le masculin singulier hébreu a ici une portée représentative et générique. La formulation française demeure fidèle à cette forme tout en évitant une répétition lourde; elle ne limite pas l’enseignement aux hommes.
- issue: Nature de la rétribution exprimée par יְשֻׁלָּם
  choice: Traduire selon le sens positif contextuel par « sera récompensé ».
  alternative: Traduire plus formellement par « recevra sa rétribution » ou « sera rétribué ».
  rationale: Le verbe peut désigner une rétribution sans en préciser à lui seul la valeur, mais l’opposition avec la perte dans le premier membre indique ici une issue favorable. La traduction ne précise ni la forme ni l’étendue de cette récompense.
translation_notes:
  register: Français international moderne, concis et proverbial. Le rythme antithétique est conservé. « Court à sa perte » évite une tournure passive peu naturelle, tandis que « craint le commandement » maintient volontairement la tension du texte hébreu entre crainte et obéissance.
