  text: תַּאֲוָ֣ה נִ֭הְיָה תֶּעֱרַ֣ב לְ/נָ֑פֶשׁ וְ/תוֹעֲבַ֥ת כְּ֝סִילִ֗ים ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/019.yaml
  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: fr
  text: Un désir réalisé est doux à l’âme[a], mais se détourner du mal est une abomination pour les insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Un désir qui devient réalité est agréable à l’âme. »
    reason: Alternative lexicale reflétant plus explicitement la valeur de נִהְיָה et le sens non métaphorique possible de תֶּעֱרַב.
lexical_decisions:
- source_word: תַּאֲוָה
  choice: un désir
  rationale: Le nom désigne un désir ou une aspiration. « Désir » reste général et naturel, sans la connotation excessive de « convoitise ».
- source_word: נִהְיָה
  choice: réalisé
  rationale: Le participe niphal de היה présente le désir comme devenu réalité. « Réalisé » s’emploie naturellement avec « désir » et conserve l’idée d’aboutissement.
- source_word: תֶּעֱרַב
  choice: est doux
  rationale: Le verbe signifie ici « être agréable, doux ». Cette formulation préserve la métaphore gustative du texte hébreu.
- source_word: לְנָפֶשׁ
  choice: à l’âme
  rationale: נפש désigne ici la personne dans son intériorité, siège du désir et de la satisfaction. « À l’âme » maintient la profondeur anthropologique de l’hébreu.
- source_word: וְתוֹעֲבַת
  choice: mais … est une abomination
  rationale: Dans le parallélisme, la conjonction introduit un contraste. « Abomination » conserve la force du terme תועבה, qui désigne ce qui inspire une profonde répulsion.
- source_word: כְּסִילִים
  choice: les insensés
  rationale: Dans les Proverbes, כסילים désigne des personnes moralement et intellectuellement obstinées. « Insensés » exprime mieux cette dimension éthique que « stupides ».
- source_word: סוּר
  choice: se détourner
  rationale: L’infinitif exprime l’action de quitter ou d’éviter une voie. « Se détourner » rend naturellement sa portée volontaire et morale.
- source_word: מֵרָע
  choice: du mal
  rationale: Dans ce contexte sapiential, רע renvoie au mal moral plutôt qu’au seul malheur ou dommage.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme antithétique est conservé, ainsi que la vigueur de « abomination » et la métaphore de la douceur.
