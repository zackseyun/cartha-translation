  text: נַ֥פְתִּי מִשְׁכָּבִ֑/י מֹ֥ר אֲ֝הָלִ֗ים וְ/קִנָּמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/017.yaml
  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: fr
  text: J’ai parfumé mon lit de myrrhe, de bois d’aloès[a] et de cannelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aloès » ; le terme hébreu désigne probablement un bois aromatique utilisé en parfumerie, et non la plante appelée aujourd’hui aloe vera.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: J’ai parfumé
  rationale: Le verbe désigne ici l’application de substances aromatiques. « J’ai parfumé » exprime naturellement en français le résultat recherché, tandis que « j’ai aspergé » serait plus concret mais moins clair quant à leur fonction.
- source_word: מִשְׁכָּבִי
  choice: mon lit
  rationale: Le nom peut désigner l’endroit où l’on se couche, un lit ou une couche. Dans cette scène de séduction, « mon lit » est le rendu français le plus direct et naturel.
- source_word: מֹר
  choice: myrrhe
  rationale: Équivalent français établi de cette résine aromatique.
- source_word: אֲהָלִים
  choice: bois d’aloès
  rationale: Le terme renvoie à un bois odorant employé comme parfum, et non à l’aloe vera généralement connu aujourd’hui. « Bois d’aloès » évite cette confusion tout en conservant le nom traditionnel.
- source_word: וְקִנָּמוֹן
  choice: et de cannelle
  rationale: Rendu direct du nom de cette épice, avec la conjonction qui clôt naturellement l’énumération en français.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation brève conserve l’image sensuelle et l’énumération des trois parfums sans l’expliciter davantage.
