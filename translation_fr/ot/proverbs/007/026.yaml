  naturalness: Le français est naturel, clair et de registre proverbial approprié. « Tous ceux qu’elle a tués » explicite correctement « ses tués / ses morts » en français moderne.
  terminology: 'La note a est utile et doit mieux refléter l’alternative lexicale sans transformer la construction verbale. La note b n’est pas retenue : dans ce parallélisme, עֲצֻמִים qualifie les victimes comme puissantes/fortes; « nombreux » ne constitue pas ici une alternative contextuellement suffisamment solide, d’autant que כָּל exprime déjà la totalité.'
