  text: כִּֽי רַבִּ֣ים חֲלָלִ֣ים הִפִּ֑ילָה וַ֝/עֲצֻמִ֗ים כָּל הֲרֻגֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/026.yaml
  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: fr
  text: 'Car elle a fait tomber beaucoup de blessés[a],

    et tous ceux qu’elle a tués sont puissants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup de morts »; le terme hébreu peut désigner des personnes blessées ou transpercées, mais aussi des personnes tuées.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’avertissement donné dans le contexte; « Car » en conserve naturellement la valeur explicative.
- source_word: רַבִּים
  choice: beaucoup de
  rationale: Rend simplement l’idée de grand nombre tout en permettant une formulation française naturelle avec le complément « blessés ».
- source_word: חֲלָלִים
  choice: blessés
  rationale: Le nom peut désigner des personnes transpercées ou tuées. « Blessés » préserve ici une progression poétique vers le terme plus explicite « ceux qu’elle a tués » au second membre, sans supprimer l’autre sens possible, signalé en note.
- source_word: הִפִּילָה
  choice: elle a fait tomber
  rationale: Le hiphil de נפל exprime le fait de causer la chute. Cette traduction conserve directement l’image hébraïque.
- source_word: וַעֲצֻמִים
  choice: sont puissants
  rationale: L’adjectif peut exprimer la puissance ou, selon son emploi, le grand nombre. « Puissants » maintient l’idée frappante que même les forts figurent parmi ses victimes; l’autre lecture est indiquée en note.
- source_word: כָּל
  choice: tous
  rationale: Correspond à la portée universelle du terme hébreu dans le second membre.
- source_word: הֲרֻגֶיהָ
  choice: ceux qu’elle a tués
  rationale: Rend clairement en français le participe passif substantivé muni du suffixe féminin, littéralement « ses tués ».
