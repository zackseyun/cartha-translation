source:
  edition: WLC
  text: כִּ֭י בְּ/חַלּ֣וֹן בֵּיתִ֑/י בְּעַ֖ד אֶשְׁנַבִּ֣/י נִשְׁקָֽפְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/006.yaml
  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: fr
  text: Car, à la fenêtre de ma maison, j’ai regardé dehors à travers mon treillis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par mon ouverture grillagée ». Le terme hébreu désigne une ouverture ou une fenêtre munie d’un treillis.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication ou le récit qui fonde l’avertissement précédent. « Car » conserve cette valeur discursive sans imposer une causalité plus stricte.
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: à la fenêtre de ma maison
  rationale: חַלּוֹן désigne une fenêtre et בְּ a ici une valeur locative. Cette formulation française situe naturellement le narrateur à son poste d’observation.
- source_word: בְּעַד
  choice: à travers
  rationale: La préposition présente le treillis comme l’ouverture ou l’écran au travers duquel le narrateur regarde.
- source_word: אֶשְׁנַבִּי
  choice: mon treillis
  rationale: אֶשְׁנָב désigne vraisemblablement une ouverture munie d’un treillis ou un écran ajouré. « Treillis » préserve l’image concrète et le distingue de חַלּוֹן, la fenêtre déjà mentionnée.
- source_word: נִשְׁקָפְתִּי
  choice: je regardais dehors
  rationale: Le verbe exprime le fait de regarder depuis un point d’observation, souvent vers l’extérieur ou vers le bas. L’imparfait convient à l’arrière-plan narratif et n’ajoute pas l’intensité suggérée par « épier ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’ordre de la proposition a été légèrement réorganisé afin d’éviter une succession pesante de compléments, tout en conservant la fenêtre, la maison, le treillis et l’acte de regarder dehors.
