id: PRO.7.14
reference: Proverbs 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: fr
  text: J’avais à offrir des sacrifices de communion[a] ; aujourd’hui, j’ai accompli mes vœux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix » ou « sacrifices de bien-être ». Ces sacrifices permettaient à la personne qui les offrait de manger une partie de la viande.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: sacrifices de communion
  rationale: La locution désigne les sacrifices associés à la paix et au bien-être, dont une partie pouvait être consommée. « Sacrifices de communion » est un terme cultuel français clair qui évoque ce repas partagé sans réduire le sens à une simple offrande générique.
- source_word: עָלַי
  choice: j’avais à offrir
  rationale: Littéralement « sur moi », l’expression indique ici une obligation qui incombait à la femme. Cette formulation française naturelle préserve cette valeur plutôt que de supposer simplement qu’elle avait de la viande chez elle.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent temporel direct et naturel.
- source_word: שִׁלַּמְתִּי
  choice: j’ai accompli
  rationale: Au piel avec נדר, le verbe signifie acquitter ou accomplir un vœu. « Accomplir ses vœux » est idiomatique et évite la connotation principalement financière de « payer ».
- source_word: נְדָרָי
  choice: mes vœux
  rationale: Le pluriel suffixé signifie directement « mes vœux » ; ajouter « offrandes » expliciterait plus que l’hébreu.
theological_decisions:
- issue: Terminologie cultuelle dans les paroles de la femme séductrice
  choice: Conserver explicitement les sacrifices de communion et l’accomplissement des vœux.
  alternative: Paraphraser en indiquant simplement qu’elle dispose d’un repas ou de nourriture.
  rationale: Le texte place délibérément le langage du culte dans la bouche de cette femme. La traduction maintient cette tension sans moraliser ses paroles ni transformer l’allusion sacrificielle en simple invitation à manger.
- issue: Valeur de עָלַי
  choice: 'Exprimer l’obligation : « j’avais à offrir ».'
  alternative: Comprendre que les sacrifices ou leur viande étaient « chez moi » ou « en ma possession ».
  rationale: Le sens premier « sur moi » se prête naturellement à l’idée d’une obligation cultuelle, en parallèle avec l’acquittement des vœux dans la seconde proposition. L’autre lecture explique le repas disponible dans le contexte, mais elle est plus interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « J’avais à offrir » rend l’obligation sans lourdeur, tandis que « sacrifices de communion » conserve le caractère technique du vocabulaire cultuel. Le point-virgule respecte l’enchaînement serré des deux propositions.
