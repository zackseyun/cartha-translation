  yaml_path: translation/ot/proverbs/007/004.yaml
  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: fr
  text: 'Dis à la sagesse : « Tu es ma sœur », et appelle l’intelligence une amie proche[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parente » ou « une connaissance ». Le terme hébreu מוֹדָע désigne une personne que l’on connaît et peut évoquer, selon le contexte, une relation étroite ou familiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לַחָכְמָה
  choice: Dis à la sagesse
  rationale: L’impératif אֱמֹר introduit une parole adressée à la sagesse personnifiée; cette tournure française est directe et naturelle.
- source_word: אֲחֹתִי אָתְּ
  choice: « Tu es ma sœur »
  rationale: La traduction conserve le terme familial littéral et la personnification féminine de la sagesse.
- source_word: וּמוֹדָע
  choice: « ta proche parente »
  rationale: מוֹדָע désigne une personne connue ou proche et peut, selon le contexte, évoquer une relation de parenté. « Proche parente » maintient ici le parallélisme familial avec « sœur » sans préciser un lien généalogique particulier.
- source_word: לַבִּינָה
  choice: l’intelligence
  rationale: Dans les Proverbes, בִּינָה désigne la faculté de comprendre et de discerner; « intelligence » forme en français un couple idiomatique avec « sagesse ».
- source_word: תִקְרָא
  choice: appelle
  rationale: La forme verbale a une valeur directive parallèle au premier impératif. « Appelle » peut introduire naturellement le nom relationnel attribué à l’intelligence.
