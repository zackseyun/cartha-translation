  text: אַל יֵ֣שְׂטְ אֶל דְּרָכֶ֣י/הָ לִבֶּ֑/ךָ אַל תֵּ֝תַע בִּ/נְתִיבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/025.yaml
  text: Do not let your heart turn aside to her ways; do not wander into her paths.
translation:
  language: fr
  text: Que ton cœur ne se détourne pas vers les voies de cette femme ; ne t’égare pas sur ses sentiers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יֵשְׂטְ
  choice: ne se détourne pas
  rationale: Le verbe שׂטה exprime ici le fait de dévier ou de se détourner ; la formulation française conserve l’image d’un cœur qui quitte la bonne direction.
- source_word: אֶל דְּרָכֶיהָ
  choice: vers les voies de cette femme
  rationale: אֶל marque la direction et דְּרָכֶיהָ signifie littéralement « ses voies ». « Cette femme » explicite en français le référent féminin déjà établi par le contexte, sans ajouter d’interprétation doctrinale.
- source_word: אַל תֵּתַע
  choice: ne t’égare pas
  rationale: תעה désigne l’action d’errer ou de s’égarer. « Ne t’égare pas » est naturel, dignifié et maintient la métaphore du déplacement.
- source_word: בִּנְתִיבוֹתֶיהָ
  choice: sur ses sentiers
  rationale: נתיבות désigne des sentiers ou chemins tracés ; « sur » convient idiomatiquement au mouvement exprimé en français.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et proverbial. Le parallélisme entre « voies » et « sentiers », ainsi qu’entre le cœur qui se détourne et la personne qui s’égare, est conservé.
