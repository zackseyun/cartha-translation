translation_notes:
  register: Français moderne, digne et légèrement poétique. La succession des compléments temporels conserve la progression hébraïque du crépuscule vers l’obscurité profonde. Aucune note n’est nécessaire, puisque « au cœur de la nuit » rend clairement l’idiome hébreu.
