  text: at twilight[a], in the evening of the day, in the black of night and darkness.
translation:
  language: fr
  text: au crépuscule, au soir du jour, au cœur de la nuit et de l’obscurité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶשֶׁף
  choice: au crépuscule
  rationale: Dans ce contexte de progression vers la nuit, נֶשֶׁף désigne la faible lumière de la fin du jour. « Crépuscule » conserve cette transition sans préciser davantage que l’hébreu.
- source_word: עֶרֶב יוֹם
  choice: au soir du jour
  rationale: Cette formulation garde les deux éléments de l’expression hébraïque et son effet cumulatif, tout en restant intelligible dans un registre poétique français.
- source_word: אִישׁוֹן לַיְלָה
  choice: au cœur de la nuit
  rationale: Littéralement associé à la « pupille » de la nuit, cet idiome évoque sa partie la plus profonde et la plus sombre. « Au cœur de la nuit » en restitue naturellement le sens sans introduire l’idée plus précise de minuit.
- source_word: וַאֲפֵלָה
  choice: et de l’obscurité
  rationale: אֲפֵלָה désigne l’obscurité ou les ténèbres. Le nom « obscurité » maintient ici l’accumulation finale sans alourdir excessivement la phrase.
- source_word: בְּ ... בְּ ... בְּ
  choice: au ... au ... au ...
  rationale: La répétition de « au » reflète les trois indications temporelles successives introduites par בְּ et préserve la progression rythmique de l’hébreu.
