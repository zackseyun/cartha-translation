id: PRO.7.2
reference: Proverbs 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: fr
  text: Garde mes commandements, et tu vivras ; garde mon enseignement comme la prunelle de tes yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme la pupille de tes yeux ». Cette image hébraïque évoque ce que l’on protège avec le plus grand soin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר
  choice: Garde
  rationale: L’impératif de שׁמר exprime à la fois l’obéissance et une attention protectrice. « Garde » convient aux commandements et prépare naturellement l’image de la prunelle à protéger.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: Le pluriel avec suffixe de première personne est rendu directement ; « commandements » garde la portée normative du terme.
- source_word: וֶחְיֵה
  choice: et tu vivras
  rationale: Cette formulation française naturelle conserve la coordination concise de l’hébreu tout en laissant entendre la nuance de conséquence, sans l’expliciter davantage.
- source_word: וְתוֹרָתִי
  choice: mon enseignement
  rationale: Dans les Proverbes, תּוֹרָה désigne ici l’enseignement du sage ou du père plutôt qu’un corpus légal au sens étroit.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: comme la prunelle de tes yeux
  rationale: « La prunelle de ses yeux » est une expression française vivante et transparente qui désigne ce que l’on protège avec le plus grand soin. Le pluriel « tes yeux » suit naturellement la forme hébraïque et l’usage français.
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte sapientiel
  choice: enseignement
  alternative: loi
  rationale: Le locuteur parle de son propre enseignement de sagesse. « Enseignement » préserve la portée directive du terme sans l’identifier indûment à la seule législation mosaïque.
- issue: Rapport entre l’obéissance et la vie dans וֶחְיֵה
  choice: et tu vivras
  alternative: afin que tu vives
  rationale: Le texte juxtapose l’impératif et la vie promise ou résultante. La traduction conserve cette tension concise sans préciser un mécanisme théologique que l’hébreu ne développe pas ici.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « garde » rend explicite le verbe sous-entendu devant « mon enseignement », nécessaire à la fluidité française. Le point-virgule clarifie les deux membres parallèles.
