  text: 'She seized him and kissed him[a]; with a bold face she said to him:'
translation:
  language: fr
  text: 'Elle le saisit et l’embrassa ; puis, le visage effronté[a], elle lui dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une audace sans gêne ». L’expression hébraïque évoque une attitude effrontée, hardie et dépourvue de toute retenue.
