lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: Elle le saisit
  rationale: Le hifil de חזק construit avec ב exprime ici le fait de saisir quelqu’un ou de s’emparer de lui. « Saisit » rend l’action physique soudaine et assurée.
- source_word: וְנָשְׁקָה לּוֹ
  choice: et l’embrassa
  rationale: Le qal de נשׁק signifie couramment « embrasser ». Le passé simple maintient la succession vive des actions du récit.
- source_word: הֵעֵזָה פָנֶיהָ
  choice: le visage effronté
  rationale: L’expression hébraïque évoque littéralement un visage rendu ferme ou hardi, et dénote une audace sans gêne. « Le visage effronté » conserve l’image du visage tout en étant idiomatique en français.
- source_word: וַתֹּאמַר לוֹ
  choice: elle lui dit
  rationale: Cette formulation restitue explicitement le complément לוֹ et introduit naturellement les paroles qui suivent.
