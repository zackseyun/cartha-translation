id: PRO.7.24
reference: Proverbs 7:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/הַקְשִׁ֗יבוּ לְ/אִמְרֵי פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: fr
  text: Et maintenant, mes fils[a], écoutez-moi et soyez attentifs aux paroles de ma bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes enfants ». L’hébreu dit littéralement « fils », forme masculine plurielle courante dans l’enseignement de sagesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction suivie de l’adverbe temporel marque une transition et introduit une nouvelle exhortation; « Et maintenant » conserve ce mouvement du discours.
- source_word: בָנִים
  choice: mes fils
  rationale: Le nom hébreu est un pluriel masculin employé comme adresse dans l’enseignement de sagesse. Le possessif, implicite dans la relation pédagogique et naturel en français dans cette apostrophe, évite une adresse abrupte.
- source_word: שִׁמְעוּ לִי
  choice: écoutez-moi
  rationale: שׁמע construit avec ל exprime une écoute attentive dirigée vers le locuteur. « Écoutez-moi » rend naturellement l’impératif en français moderne.
- source_word: וְהַקְשִׁיבוּ
  choice: et soyez attentifs
  rationale: La forme hiphil de קשׁב appelle à une attention soutenue. « Soyez attentifs » garde la force exhortative et s’enchaîne naturellement avec le complément suivant.
- source_word: לְאִמְרֵי
  choice: aux paroles
  rationale: Le pluriel construit désigne les paroles ou propos du locuteur. « Paroles » convient à la diction sapientiale et à l’expression « de ma bouche ».
- source_word: פִי
  choice: de ma bouche
  rationale: La formulation littérale conserve l’image poétique hébraïque et souligne que l’instruction vient directement du locuteur.
theological_decisions:
- issue: Vocatif genré dans l’enseignement de sagesse
  choice: mes fils
  alternative: mes enfants
  rationale: Le texte source porte un pluriel masculin. La traduction le préserve sans décider si, dans sa portée pédagogique, l’adresse peut aussi être représentative d’un auditoire plus large.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe parallèle et l’image « les paroles de ma bouche » préservent la texture poétique de l’hébreu.
