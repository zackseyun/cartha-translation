  text: קָשְׁרֵ֥/ם עַל אֶצְבְּעֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/003.yaml
  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: fr
  text: Attache-les à tes doigts ; écris-les sur la tablette de ton cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Attache-les
  rationale: L’impératif de קשר signifie concrètement « attacher, lier ». « Attache-les » est naturel en français moderne et conserve l’image d’enseignements fixés sur soi.
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: à tes doigts
  rationale: Avec le verbe « attacher », la préposition française « à » exprime naturellement la fixation aux doigts, tout en conservant le pluriel de l’hébreu.
- source_word: כָּתְבֵם
  choice: écris-les
  rationale: L’impératif de כתב est rendu directement et maintient le parallélisme concret entre attacher et écrire.
- source_word: עַל לוּחַ
  choice: sur la tablette
  rationale: לוּחַ désigne une tablette ou plaque destinée à l’écriture. « Tablette » préserve l’image biblique sans la paraphraser.
- source_word: לִבֶּךָ
  choice: de ton cœur
  rationale: « Cœur » conserve la métaphore hébraïque et sa portée englobant la pensée, la volonté et la vie intérieure.
theological_decisions:
- issue: Intériorisation métaphorique de l’enseignement
  choice: Conserver les images concrètes des enseignements attachés aux doigts et écrits sur la tablette du cœur.
  alternative: Les garder constamment présents et les intérioriser profondément.
  rationale: Les métaphores portent la force littéraire et les résonances bibliques du verset ; les paraphraser résoudrait inutilement leur richesse.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne masculine singulière. Aucun appel de note n’est nécessaire, puisque « attacher » rend adéquatement קשר sans qu’une variante française apporte une nuance substantielle.
