  text: Therefore I came out to meet you[a], to seek your face, and I have found you.
translation:
  language: fr
  text: C’est pourquoi je suis sortie à ta rencontre, pour te chercher[a], et je t’ai trouvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour chercher ton visage ». Ou : « pour te chercher dès le matin » ou « pour te chercher avec empressement » ; le verbe hébreu peut évoquer une recherche matinale ou assidue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Rend naturellement la relation causale introduisant l’explication de la femme, dans un registre moderne et digne.
- source_word: יָצָאתִי
  choice: je suis sortie
  rationale: Le verbe signifie « sortir ». Le féminin est imposé par l’identité de la locutrice dans le contexte immédiat.
- source_word: לִקְרָאתֶךָ
  choice: à ta rencontre
  rationale: Expression française idiomatique qui correspond à la construction hébraïque désignant le fait de sortir pour rencontrer quelqu’un.
- source_word: לְשַׁחֵר
  choice: chercher
  rationale: Conserve le sens central de la recherche intentionnelle, tandis que les nuances possibles d’empressement ou de recherche matinale sont signalées en note.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Préserve l’image concrète et la formulation personnelle de l’hébreu, intelligible en français malgré son caractère légèrement sémitique.
- source_word: וָאֶמְצָאֶךָּ
  choice: et je t’ai trouvé
  rationale: Le passé composé rend naturellement en français l’action accomplie dont le résultat est présent au moment où la femme parle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond aux formes hébraïques singulières et à l’adresse directe. L’expression « chercher ton visage » est volontairement conservée afin de préserver l’image hébraïque et son intensité personnelle.
