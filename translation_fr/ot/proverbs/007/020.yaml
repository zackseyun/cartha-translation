source:
  edition: WLC
  text: צְֽרוֹר הַ֭/כֶּסֶף לָקַ֣ח בְּ/יָד֑/וֹ לְ/י֥וֹם הַ֝/כֵּ֗סֶא יָבֹ֥א בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/020.yaml
  text: He took a bag of money in his hand[a]; he will come home at the full moon.
translation:
  language: fr
  text: Il a emporté avec lui une bourse d’argent ; il rentrera chez lui le jour de la pleine lune[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au jour fixé ». Le terme hébreu est difficile ; certains y voient aussi la nouvelle lune.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: bourse
  rationale: Le nom désigne un contenant noué, ici une bourse ou un sachet destiné à l’argent. « Bourse » est naturel en français et convient au contexte d’un voyage.
- source_word: הַכֶּסֶף
  choice: argent
  rationale: כֶּסֶף peut désigner littéralement l’argent métal ou, par métonymie, l’argent comme moyen de paiement. Le français « argent » conserve naturellement ces deux valeurs.
- source_word: לָקַח בְּיָדוֹ
  choice: a emporté avec lui
  rationale: L’expression hébraïque signifie littéralement « a pris dans sa main ». Dans ce contexte, elle indique qu’il a pris la bourse pour son voyage ; « a emporté avec lui » restitue cette idée dans un français courant sans suggérer qu’il la gardera constamment à la main.
- source_word: לְיוֹם
  choice: le jour de
  rationale: La préposition introduit ici le moment prévu du retour. « Le jour de » rend clairement cette valeur temporelle.
- source_word: הַכֵּסֶא
  choice: la pleine lune
  rationale: Ce terme rare et discuté désigne probablement ici la pleine lune, qui sert de repère pour une date de retour assez éloignée. L’incertitude lexicale est signalée en note.
- source_word: יָבֹא בֵיתוֹ
  choice: il rentrera chez lui
  rationale: Littéralement, « il viendra à sa maison ». « Il rentrera chez lui » exprime naturellement en français le retour du mari à son domicile.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la structure et du sens de l’hébreu, tout en employant des expressions idiomatiques. L’ambiguïté du terme הַכֵּסֶא est conservée dans la note.
