  text: לְכָ֤/ה נִרְוֶ֣ה דֹ֭דִים עַד הַ/בֹּ֑קֶר נִ֝תְעַלְּסָ֗ה בָּ/אֳהָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/018.yaml
  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: fr
  text: Viens, rassasions-nous de caresses jusqu’au matin ; livrons-nous aux délices de l’amour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Viens
  rationale: L’impératif de הלך sert ici d’invitation pressante. « Viens » est naturel en français et convient à la scène de séduction.
- source_word: נִרְוֶה
  choice: enivrons-nous
  rationale: Le verbe רוה signifie littéralement « boire à satiété, se rassasier ». Avec דֹדִים, « enivrons-nous » conserve l’image de la satiété sensuelle sans produire la tournure peu naturelle « buvons notre plein ».
- source_word: דֹדִים
  choice: de caresses
  rationale: Dans ce contexte érotique, le pluriel peut désigner les manifestations physiques de l’amour. « Caresses » rend concrètement ce sens et s’associe naturellement à « enivrons-nous ».
- source_word: עַד הַבֹּקֶר
  choice: jusqu’au matin
  rationale: Traduction directe et idiomatique de l’expression temporelle.
- source_word: נִתְעַלְּסָה
  choice: livrons-nous aux délices
  rationale: La forme réflexive exprime le fait de se délecter, de goûter pleinement un plaisir. Cette formulation garde l’intensité sensuelle dans un registre digne et actuel.
- source_word: בָּאֳהָבִים
  choice: de l’amour
  rationale: Le pluriel désigne ici les plaisirs ou manifestations de l’amour dans un cadre explicitement érotique. « De l’amour » reste proche du lexème et évite de préciser davantage que l’hébreu.
