review_pass:
  verdict: revise
  source_fidelity: La scène est rendue fidèlement, et « vient à sa rencontre » exprime bien לִקְרָאתוֹ. Cependant, שִׁית זֹנָה désigne plus directement une tenue ou un accoutrement de prostituée ; « vêtue comme une prostituée » peut suggérer qu’elle imite seulement une prostituée, nuance que le texte hébreu ne formule pas. « Le cœur plein de ruse » rend une implication contextuellement plausible de נְצֻרַת לֵב, à condition que la note conserve l’ambiguïté de l’expression.
  naturalness: Le français est moderne, fluide et adapté au récit. « Vêtue d’une tenue de prostituée » est naturel et évite l’ambiguïté comparative de « vêtue comme une prostituée ».
  terminology: « Femme » et « prostituée » sont des choix justes et contemporains. La note doit corriger « protégée de cœur », qui est à la fois une restitution trop étroite et une formulation moins claire ; « au cœur gardé » préserve mieux l’image sans trancher indûment entre réserve, dissimulation et ruse.
  issues:
  - severity: medium
    issue: « vêtue comme une prostituée »
    rationale: 'Cette formulation comparative peut signifier qu’elle est habillée à la manière d’une prostituée sans que sa tenue soit explicitement qualifiée comme telle. Le syntagme hébreu désigne son accoutrement comme une « tenue de prostituée ». '
  - severity: low
    issue: 'Note : « protégée de cœur »'
    rationale: Cette formulation est moins fidèle à la métaphore de נְצֻרַת לֵב et peut orienter vers le sens de protection. « Au cœur gardé » rend plus directement le participe tout en laissant ouvertes les implications contextuelles.
  revised_text: Et voici qu’une femme vient à sa rencontre, vêtue d’une tenue de prostituée, le cœur plein de ruse[a].
