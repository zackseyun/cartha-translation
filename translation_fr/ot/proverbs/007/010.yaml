source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֭שָּׁה לִ/קְרָאת֑/וֹ שִׁ֥ית ז֝וֹנָ֗ה וּ/נְצֻ֥רַת לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
translation:
  language: fr
  text: Et voici qu’une femme vient à sa rencontre, vêtue d’une tenue de prostituée, le cœur plein de ruse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « au cœur gardé » ; l’expression peut évoquer un cœur fermé, des intentions cachées ou la ruse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure française actuelle conserve l’irruption vive de la scène marquée par וְהִנֵּה, sans l’archaïsme de « voici » employé seul.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le contexte présente une femme jusque-là non identifiée ; « femme » est ici le terme naturel et non marqué.
- source_word: לִקְרָאתוֹ
  choice: vient à sa rencontre
  rationale: Cette expression rend naturellement le mouvement dirigé vers le jeune homme et l’idée de rencontre portée par לִקְרָאתוֹ.
- source_word: שִׁית זוֹנָה
  choice: vêtue comme une prostituée
  rationale: Le syntagme désigne la tenue caractéristique d’une prostituée. Cette formulation naturelle indique une apparence vestimentaire sans affirmer davantage que l’hébreu sur l’identité de la femme.
- source_word: וּנְצֻרַת לֵב
  choice: le cœur plein de ruse
  rationale: Dans ce contexte, l’expression qualifie vraisemblablement une disposition intérieure dissimulée et rusée. La note conserve toutefois l’image littérale et l’ambiguïté du participe issu de נצר.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » donne de l’immédiateté à la scène ; « prostituée » est contemporain et précis. La formulation principale privilégie le sens contextuel de נְצֻרַת לֵב, tandis que la note préserve sa métaphore et son ambiguïté lexicales.
