revisions:
- from: Et voici qu’une femme vient à sa rencontre, vêtue comme une prostituée, le cœur plein de ruse[a].
  to: Et voici qu’une femme vient à sa rencontre, vêtue d’une tenue de prostituée, le cœur plein de ruse[a].
  rationale: La révision rend explicitement la relation d’attribut vestimentaire dans שִׁית זֹנָה sans ajouter l’idée qu’elle ne ferait qu’imiter une prostituée. La formulation principale de נְצֻרַת לֵב conserve son sens contextuel probable, tandis que la note préserve la métaphore et l’ambiguïté lexicale du texte hébreu.
