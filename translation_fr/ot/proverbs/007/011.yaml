  text: She is loud and rebellious; her feet do not stay at home.
translation:
  language: fr
  text: Elle est tapageuse et rebelle ; ses pieds ne restent pas chez elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹמִיָּה
  choice: tapageuse
  rationale: Le participe décrit une femme bruyante et turbulente. « Tapageuse » exprime naturellement en français le bruit excessif et le caractère remuant du terme.
- source_word: סֹרָרֶת
  choice: rebelle
  rationale: Le mot désigne celle qui résiste à l’autorité ou refuse de se laisser diriger ; « rebelle » en conserve la force morale.
- source_word: בְּבֵיתָהּ
  choice: chez elle
  rationale: Littéralement « dans sa maison ». Avec « rester », « chez elle » est l’expression française naturelle tout en gardant la référence à son propre domicile.
- source_word: לֹא יִשְׁכְּנוּ רַגְלֶיהָ
  choice: ses pieds ne restent pas
  rationale: L’image concrète des pieds est conservée. Dans ce contexte, le verbe indique qu’ils ne demeurent ni ne se tiennent durablement sur place.
