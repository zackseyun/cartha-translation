  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: fr
  text: Car l’homme n’est pas chez lui[a] ; il est parti en voyage au loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mon mari n’est pas à la maison ». L’hébreu dit plus littéralement : « l’homme n’est pas dans sa maison », manière indirecte de parler de son mari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison donnée par la séductrice pour rassurer son interlocuteur ; « car » conserve clairement la valeur causale.
- source_word: אֵין
  choice: n’est pas
  rationale: Avec le groupe nominal et l’indication de lieu qui suivent, exprime l’absence.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Reproduit l’expression indirecte de l’hébreu. Dans le contexte, il s’agit de son mari, mais cette identification n’est pas explicitée dans le texte principal.
- source_word: בְּבֵיתוֹ
  choice: chez lui
  rationale: Expression française naturelle indiquant qu’il n’est pas dans sa propre maison ; elle conserve sémantiquement le possessif hébreu.
- source_word: הָלַךְ
  choice: il est parti
  rationale: 'Le verbe présente un départ accompli dont le résultat demeure : l’homme est actuellement absent.'
- source_word: בְּדֶרֶךְ
  choice: en voyage
  rationale: Dans ce contexte, le terme désignant le chemin ou la route évoque idiomatiquement un déplacement ou un voyage.
- source_word: מֵרָחוֹק
  choice: au loin
  rationale: Conserve explicitement la notion spatiale de distance sans la transformer en simple indication de durée.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Chez lui » évite une formulation raide tout en gardant le possessif, tandis que « en voyage au loin » préserve la valeur spatiale de l’expression hébraïque.
