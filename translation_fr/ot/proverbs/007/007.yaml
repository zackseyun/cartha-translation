  text: וָ/אֵ֤רֶא בַ/פְּתָאיִ֗ם אָ֘בִ֤ינָה בַ/בָּנִ֗ים נַ֣עַר חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/007.yaml
  text: and I saw among the simple[a]; I discerned among the young men a youth lacking sense.
translation:
  language: fr
  text: J’ai vu parmi les naïfs ; j’ai remarqué parmi les jeunes gens un jeune homme qui manquait de jugement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dépourvu de cœur » ; dans la pensée hébraïque, le cœur peut désigner le discernement, l’intelligence et le jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: J’ai vu
  rationale: Le wayyiqtol qal à la première personne poursuit le récit de l’observation; le passé composé est naturel en français moderne dans ce contexte.
- source_word: בַפְּתָאיִם
  choice: parmi les naïfs
  rationale: פְּתָאיִם désigne dans les Proverbes des personnes inexpérimentées et faciles à entraîner. « Naïfs » rend cette catégorie sapientielle sans suggérer une déficience intellectuelle.
- source_word: אָבִינָה
  choice: j’ai remarqué
  rationale: Le verbe בין exprime ici une perception attentive et évaluative. « J’ai remarqué » distingue cette observation précise du simple fait d’avoir vu, tout en restant idiomatique.
- source_word: בַבָּנִים
  choice: parmi les jeunes gens
  rationale: Bien que בָּנִים signifie littéralement « fils », le contexte désigne un groupe de jeunes hommes observés dans la rue; « jeunes gens » est naturel et fidèle.
- source_word: נַעַר
  choice: un jeune homme
  rationale: נַעַר peut désigner un garçon ou un jeune homme. Le contexte décrit quelqu’un qui se déplace seul et peut être séduit; « jeune homme » convient donc le mieux.
- source_word: חֲסַר לֵב
  choice: qui manquait de jugement
  rationale: L’expression signifie littéralement « dépourvu de cœur », mais לֵב désigne ici le discernement et le sens moral. « Manquait de jugement » communique clairement l’idiome en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition « parmi… parmi… » conserve le parallélisme hébreu, tandis que « vu » puis « remarqué » rend la progression entre observation et discernement.
