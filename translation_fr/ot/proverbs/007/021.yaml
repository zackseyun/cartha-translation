  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: fr
  text: Par ses nombreuses paroles persuasives, elle le fait céder[a] ; par la douceur de ses lèvres, elle le pousse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par l’abondance de ses propos, elle le détourne ; par le charme de ses lèvres, elle le pousse en avant. »'
    reason: 'Alternative lexicale : le premier verbe peut évoquer le fait de détourner ou de faire dévier, et les expressions concernant ses propos et ses lèvres peuvent être rendues de manière plus littérale.'
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: elle le fait céder
  rationale: Le hiphil de נטה exprime ici le fait d’amener quelqu’un à se détourner ou à se laisser fléchir. « Elle le fait céder » rend naturellement l’effet persuasif sans ajouter explicitement la nuance sexuelle du contexte.
- source_word: בְּרֹב לִקְחָהּ
  choice: à force d’arguments
  rationale: רֹב marque l’abondance, et לֶקַח peut désigner un discours persuasif. Cette formulation française conserve l’idée d’une persuasion répétée ou abondante, sans donner au terme le sens positif d’« instruction ».
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  choice: par ses lèvres enjôleuses
  rationale: חֵלֶק évoque la douceur lisse et flatteuse du discours, tandis que « lèvres » préserve l’image concrète de l’hébreu. « Enjôleuses » exprime cette douceur trompeuse dans un français naturel.
- source_word: תַּדִּיחֶנּוּ
  choice: elle l’entraîne
  rationale: Le hiphil de נדח peut signifier pousser, chasser ou entraîner. Ici, « elle l’entraîne » garde l’image d’un mouvement imposé par son discours tout en laissant au contexte le soin d’en préciser la direction morale.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé, ainsi que l’image des lèvres. « Enjôleuses » explicite sobrement la valeur contextuelle de la douceur du discours sans employer directement « séduit », qui chargerait davantage le verbe d’une nuance sexuelle.
