revisions:
- from: À force d’arguments, elle le fait céder[a] ; par ses lèvres enjôleuses, elle l’entraîne.
  to: Par ses nombreuses paroles persuasives, elle le fait céder[a] ; par la douceur de ses lèvres, elle le pousse.
  rationale: La révision remplace une expression plus argumentative et intensive par une formulation qui rend plus largement l’abondance de la persuasion exprimée en hébreu. Elle conserve également l’image poétique de la douceur des lèvres et rend le second verbe par « pousse », plus proche de sa valeur causative. La note maintient les principales possibilités lexicales sans imposer une lecture doctrinale ou sexualiser explicitement les verbes.
