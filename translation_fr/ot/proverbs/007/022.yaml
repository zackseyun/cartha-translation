  source_fidelity: 'La première comparaison rend fidèlement הוֹלֵךְ אַחֲרֶיהָ פִּתְאֹם et כְּשׁוֹר אֶל טָבַח יָבֹא. La seconde est réellement obscure : le texte conserve bien « entrave », mais « vers la correction » rend le lien syntaxique inutilement directionnel, alors que אֶל peut ici exprimer un rapport moins déterminé.'
  naturalness: « Il la suit aussitôt » et « comme un bœuf qui va à l’abattoir » sont naturels en français moderne. « Comme une entrave vers la correction de l’insensé » est maladroit et difficilement intelligible en français. « pour la correction d’un insensé » demeure prudent face à l’ambiguïté tout en étant idiomatico-compréhensible.
  terminology: « Bœuf », « abattoir », « entrave », « correction » et « insensé » conviennent au registre proverbial. L’article indéfini dans « d’un insensé » évite de suggérer un individu déjà identifié et rend naturellement l’hébreu sans résoudre excessivement sa relation syntaxique.
