  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: fr
  text: Il la suit aussitôt, comme un bœuf qui va à l’abattoir, et comme une entrave pour la correction d’un insensé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la dernière comparaison est difficile. On peut aussi comprendre autrement le mot traduit par « entrave » et rendre la proposition, par exemple : « comme un cerf qui s’avance dans un piège » ou « comme des fers pour la correction d’un insensé ».'
    reason: Signaler l’incertitude lexicale et syntaxique réelle de la dernière comparaison, sans présenter une interprétation disputée comme certaine.
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  choice: Il la suit
  rationale: Le participe de הלך avec אַחֲרֶיהָ décrit le jeune homme qui va derrière la femme. « Il la suit » exprime naturellement cette action en français.
- source_word: פִּתְאֹם
  choice: aussitôt
  rationale: L’adverbe souligne la réaction immédiate et irréfléchie du jeune homme. « Aussitôt » convient mieux ici que « soudain », qui pourrait surtout évoquer un effet de surprise.
- source_word: כְּשׁוֹר אֶל טָבַח יָבֹא
  choice: comme un bœuf qui va à l’abattoir
  rationale: Cette formulation française naturelle conserve l’image d’un bovin conduit sans comprendre vers sa mise à mort.
- source_word: וּכְעֶכֶס
  choice: et comme une entrave
  rationale: עֶכֶס est rare et son sens est discuté. « Entrave » conserve l’idée probable d’un lien ou d’une chaîne sans préciser indûment sa forme.
- source_word: אֶל מוּסַר אֱוִיל
  choice: vers la correction de l’insensé
  rationale: מוּסָר peut désigner une correction disciplinaire. La tournure volontairement serrée respecte la difficulté syntaxique de l’hébreu au lieu de la résoudre de façon conjecturale.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. « Bœuf » et « abattoir » rendent l’image concrète avec dignité. La dernière proposition demeure volontairement énigmatique, comme le texte hébreu transmis, et sa difficulté est explicitée en note.
