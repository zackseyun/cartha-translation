id: PRO.7.1
reference: Proverbs 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ֭נִ/י שְׁמֹ֣ר אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/001.yaml
  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: fr
  text: Mon fils, garde mes paroles et conserve précieusement mes commandements auprès de toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mets mes commandements en réserve auprès de toi ». Le verbe hébreu peut évoquer le fait de cacher ou de mettre soigneusement quelque chose à l’abri afin de le conserver.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le nom masculin singulier muni du suffixe de première personne constitue une adresse paternelle directe, caractéristique du livre des Proverbes.
- source_word: שְׁמֹר
  choice: garde
  rationale: L’impératif exprime à la fois la conservation attentive des paroles et leur mise en pratique. « Garde » préserve cette amplitude en français.
- source_word: אֲמָרָי
  choice: mes paroles
  rationale: Le pluriel désigne ici l’enseignement formulé par le locuteur. « Mes paroles » est naturel et suffisamment large.
- source_word: וּמִצְוֺתַי
  choice: et mes commandements
  rationale: « Commandements » restitue le poids normatif de מִצְוָה sans réduire ces instructions à de simples conseils.
- source_word: תִּצְפֹּן
  choice: conserve précieusement
  rationale: Le verbe צפן évoque le fait de cacher ou de mettre quelque chose en réserve pour le préserver. Dans ce contexte, cette formulation exprime la conservation soigneuse sans suggérer principalement le secret.
- source_word: אִתָּךְ
  choice: auprès de toi
  rationale: La préposition signifie littéralement « avec toi ». « Auprès de toi » rend naturellement l’idée de garder les commandements à sa disposition, sans imposer l’interprétation plus forte « en toi ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé, de même que l’adresse masculine singulière du texte hébreu. La note maintient la nuance concrète de mise en réserve portée par צפן.
