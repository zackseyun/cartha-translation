id: PRO.7.27
reference: Proverbs 7:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: fr
  text: Sa maison, ce sont les chemins du shéol[a], qui descendent vers les chambres de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le shéol désigne le séjour des morts ; autre traduction possible : « la tombe ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: les chemins
  rationale: Le pluriel construit de דֶּרֶךְ est conservé, car le participe féminin pluriel יֹרְדוֹת s’y rapporte. « Chemins » reste naturel en français et préserve l’image de voies conduisant à la mort.
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération garde la notion hébraïque du séjour des morts sans la réduire à la tombe ni lui substituer la notion plus tardive d’enfer.
- source_word: בֵּיתָהּ
  choice: sa maison
  rationale: Le sens concret de « maison » convient au contexte et porte aussi l’image du lieu dans lequel on entre.
- source_word: יֹרְדוֹת
  choice: qui descendent
  rationale: Cette proposition relative rend naturellement en français le participe féminin pluriel et maintient son accord avec « les chemins ».
- source_word: אֶל
  choice: vers
  rationale: « Vers » exprime clairement la direction du mouvement descendant sans préciser davantage que l’hébreu.
- source_word: חַדְרֵי
  choice: les chambres
  rationale: « Chambres » conserve l’image d’espaces intérieurs ainsi que la tonalité poétique et inquiétante du texte.
- source_word: מָוֶת
  choice: la mort
  rationale: Le nom commun est traduit sans personnification imposée.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: le shéol
  alternative: le séjour des morts ; la tombe
  rationale: « Shéol » préserve la conception hébraïque du domaine des morts, plus large qu’une tombe, sans importer une doctrine ultérieure de l’enfer.
- issue: Rapport entre la maison et les chemins
  choice: Sa maison, ce sont les chemins du shéol
  alternative: Sa maison est le chemin du shéol
  rationale: Le pluriel de l’hébreu et l’accord du participe sont maintenus au lieu de les ramener silencieusement à un singulier collectif.
translation_notes:
  register: Français moderne, digne et poétique. La tournure disloquée « Sa maison, ce sont… » permet de conserver le pluriel hébreu tout en restant intelligible. Le terme « shéol » est explicité en note.
