source:
  edition: WLC
  text: לִ֭/שְׁמָרְ/ךָ מֵ/אִשָּׁ֣ה זָרָ֑ה מִ֝/נָּכְרִיָּ֗ה אֲמָרֶ֥י/הָ הֶחֱלִֽיקָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/005.yaml
  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: fr
  text: pour te garder de la femme interdite, de l’étrangère aux paroles flatteuses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui a rendu ses paroles lisses » ; ou : « qui flatte par ses paroles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: pour te préserver
  rationale: L’infinitif construit précédé de ל exprime ici le but par rapport au verset précédent. « Préserver » restitue naturellement la fonction protectrice de שׁמר.
- source_word: מֵאִשָּׁה זָרָה
  choice: de la femme interdite
  rationale: Dans ce contexte sapiential, זָרָה ne désigne pas simplement une femme étrange ou étrangère, mais une femme située hors des limites légitimes de la relation sexuelle. « Femme interdite » rend clairement cette portée morale.
- source_word: מִנָּכְרִיָּה
  choice: de l’étrangère
  rationale: נָכְרִיָּה signifie plus directement « étrangère ». Ce choix maintient la distinction lexicale avec זָרָה dans le parallélisme hébreu, sans présumer que l’origine ethnique soit le point principal.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: qui rend ses paroles séduisantes
  rationale: Le hifil de חלק signifie littéralement « rendre lisse » et évoque ici des paroles enjôleuses ou flatteuses. La formulation française conserve l’action du verbe et explicite naturellement l’effet de cette parole.
theological_decisions:
- issue: Portée de « femme étrangère » dans le contexte
  choice: Conserver « l’étrangère » tout en signalant que l’expression désigne contextuellement une séductrice hors des limites légitimes.
  alternative: Traduire directement par « l’adultère » ou « la séductrice ».
  rationale: Le texte ne précise pas explicitement son statut matrimonial et emploie deux termes distincts en parallèle. Une traduction plus déterminée résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Femme interdite » communique l’idiome moral, tandis que « l’étrangère » préserve le parallélisme lexical. L’image hébraïque des paroles rendues « lisses » est conservée en note.
