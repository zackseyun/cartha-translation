review_pass:
  verdict: revise
  source_fidelity: La structure alternée « tantôt… tantôt » rend bien פַּעַם… פַּעַם. « Dehors » et « sur les places » correspondent de manière plausible à l’espace public extérieur et aux places/rues larges. Le draft atténue toutefois la préposition אֵצֶל (« près de », « à côté de ») en disant « à chaque coin de rue », qui peut situer directement l’action au coin plutôt qu’à proximité de celui-ci.
  naturalness: Le français est globalement naturel. « Se tient en embuscade » est compréhensible, mais « se tient à l’affût » est plus idiomatique en français moderne tout en conservant l’idée d’une attente cachée.
  terminology: « Coin de rue » est une explicitation urbaine naturelle de פִּנָּה dans ce contexte. Le déplacement de l’ancre de note sur le verbe assure que la note lexicale porte précisément sur תֶאֱרֹב.
  issues:
  - severity: low
    issue: La nuance de proximité de אֵצֶל n’est pas explicitement rendue.
    rationale: « À chaque coin de rue » peut vouloir dire que la femme est postée au coin; אֵצֶל signifie plus précisément « près de / à côté de ». « Près de chaque coin de rue » conserve cette nuance.
  - severity: low
    issue: Ancre de note placée en fin de phrase plutôt que sur le verbe commenté.
    rationale: La note explique le verbe hébreu תֶאֱרֹב; l’ancre doit donc suivre l’équivalent verbal.
  revised_text: Tantôt dehors, tantôt sur les places, elle se tient à l’affût[a] près de chaque coin de rue.
