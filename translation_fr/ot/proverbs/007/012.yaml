source:
  edition: WLC
  text: פַּ֤עַם בַּ/ח֗וּץ פַּ֥עַם בָּ/רְחֹב֑וֹת וְ/אֵ֖צֶל כָּל פִּנָּ֣ה תֶאֱרֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/012.yaml
  text: In the street[a], now in the squares[b], and beside every corner she lies in wait.
translation:
  language: fr
  text: Tantôt dehors, tantôt sur les places, elle se tient à l’affût[a] près de chaque coin de rue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle guette » ou « elle attend en embuscade ». Le verbe hébreu évoque une attente furtive, comparable à une embuscade.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  choice: tantôt… tantôt
  rationale: La répétition marque l’alternance d’un lieu à l’autre; « tantôt… tantôt » la rend avec naturel et vivacité en français.
- source_word: בַּחוּץ
  choice: dehors
  rationale: Le terme désigne l’espace extérieur ou public; « dehors » conserve sa portée générale sans répéter inutilement l’idée de rue.
- source_word: בָּרְחֹבוֹת
  choice: sur les places
  rationale: Le pluriel désigne vraisemblablement les espaces publics larges et ouverts de la ville; « places » convient au cadre urbain.
- source_word: וְאֵצֶל כָּל פִּנָּה
  choice: à chaque coin de rue
  rationale: אֵצֶל exprime la proximité et פִּנָּה le coin; l’expression française explicite naturellement le cadre urbain.
- source_word: תֶאֱרֹב
  choice: elle se tient en embuscade
  rationale: Le verbe ארב évoque une attente cachée et prédatrice; cette formulation préserve nettement la menace.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et soutenu. La structure « tantôt… tantôt » reproduit l’alternance hébraïque, tandis que « se tient en embuscade » maintient la force prédatrice du dernier verbe.
