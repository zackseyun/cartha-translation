source:
  edition: WLC
  text: עֹבֵ֣ר בַּ֭/שּׁוּק אֵ֣צֶל פִּנָּ֑/הּ וְ/דֶ֖רֶךְ בֵּיתָ֣/הּ יִצְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/008.yaml
  text: passing through the street near her corner[a], and he steps toward her house.
translation:
  language: fr
  text: passant dans la rue près de son coin[a], il avance vers sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « passant dans la rue du marché près de son coin, il prend le chemin de sa maison »'
    reason: Alternative lexicale préservant les sens possibles de שׁוּק (« rue du marché ») et de דֶּרֶךְ (« chemin »).
lexical_decisions:
- source_word: עֹבֵר
  choice: passant
  rationale: Le participe qal plante le décor par une action en cours; le participe français conserve cette progression de manière naturelle.
- source_word: בַּשּׁוּק
  choice: dans la rue
  rationale: שׁוּק peut désigner une rue ou une rue de marché. Dans ce contexte urbain, « rue » est clair et naturel, sans exclure la nuance commerciale signalée en note.
- source_word: אֵצֶל
  choice: près de
  rationale: Exprime simplement et précisément la proximité.
- source_word: פִּנָּהּ
  choice: son coin
  rationale: Le nom signifie « coin » et le suffixe féminin l'associe à la femme du contexte. Cette formulation préserve cette association sans l'expliciter davantage.
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: vers sa maison
  rationale: Littéralement lié au « chemin de sa maison », le groupe indique ici la direction ou l'itinéraire suivi; « vers sa maison » est idiomatique et conserve le mouvement orienté.
- source_word: יִצְעָד
  choice: il avance
  rationale: צעד évoque le fait de marcher à pas mesurés ou de faire des pas. « Il avance » maintient l'image du déplacement sans la raideur de « il fait des pas ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le participe initial conserve l'effet de scène du texte hébreu; « son coin » maintient l'ambiguïté de l'association possessive.
