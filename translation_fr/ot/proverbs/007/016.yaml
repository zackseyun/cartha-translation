translation:
  language: fr
  text: J’ai garni mon lit de couvertures[a], d’étoffes ouvragées en lin d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de tapisseries ». Les mots hébreux qui désignent ces garnitures décoratives et le textile d’Égypte sont rares; il pourrait s’agir plus précisément d’étoffes à motifs ou brodées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: couvertures
  rationale: Le pluriel désigne des garnitures ou couvertures décoratives étendues sur un lit; « couvertures » reste naturel et suffisamment large en français.
- source_word: רָבַדְתִּי
  choice: J’ai garni
  rationale: Le verbe évoque l’action d’étendre ou de disposer en couches. « Garnir » convient à la préparation soignée et luxueuse du lit sans préciser à tort la technique.
- source_word: עַרְשִׂי
  choice: mon lit
  rationale: Le nom peut désigner un lit ou une couche. Ici, « lit » est le terme courant et explicite dans le contexte de séduction.
- source_word: חֲטֻבוֹת
  choice: étoffes ouvragées
  rationale: Ce terme rare peut évoquer un travail décoratif, littéralement quelque chose de taillé ou gravé. Dans ce contexte textile, « ouvragées » conserve l’idée d’un décor élaboré sans imposer « colorées » ou « brodées ».
- source_word: אֵטוּן
  choice: lin
  rationale: Ce mot textile rare est généralement compris comme du fil, du lin ou une étoffe fine. « Lin » donne un français naturel tout en signalant une matière de luxe liée à l’Égypte.
- source_word: מִצְרָיִם
  choice: d’Égypte
  rationale: Le complément d’origine est rendu directement, sans transformer inutilement le nom géographique en adjectif.
