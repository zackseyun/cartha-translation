source:
  edition: WLC
  text: עַ֤ד יְפַלַּ֪ח חֵ֡ץ כְּֽבֵד֗/וֹ כְּ/מַהֵ֣ר צִפּ֣וֹר אֶל פָּ֑ח וְ/לֹֽא יָ֝דַ֗ע כִּֽי בְ/נַפְשׁ֥/וֹ הֽוּא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/023.yaml
  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
translation:
  language: fr
  text: jusqu’à ce qu’une flèche lui transperce le foie ; comme un oiseau qui se précipite vers un piège, il ne sait pas qu’il y va de sa vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que c’est pour sa vie ». L’expression hébraïque est elliptique ; dans ce contexte, elle signifie que cette voie lui coûtera la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Marque l’aboutissement fatal du mouvement décrit au verset précédent et appelle naturellement le subjonctif en français.
- source_word: יְפַלַּח
  choice: transperce
  rationale: Le piel de פלח exprime ici une pénétration violente; « transperce » restitue la force et l’image concrète.
- source_word: חֵץ
  choice: une flèche
  rationale: Équivalent courant et précis du projectile mentionné.
- source_word: כְּבֵדוֹ
  choice: le foie
  rationale: Conserve l’organe concret du texte hébreu et sa représentation saisissante d’une blessure mortelle.
- source_word: כְמַהֵר צִפּוֹר
  choice: comme un oiseau qui se précipite
  rationale: Rend le mouvement rapide et irréfléchi exprimé par מהר, dans un français naturel.
- source_word: אֶל־פָּח
  choice: vers le piège
  rationale: פח désigne un piège, notamment destiné aux oiseaux; « vers » respecte la préposition אֶל sans préciser au-delà du texte si l’oiseau y est déjà entré.
- source_word: וְלֹא יָדַע
  choice: il ne sait pas
  rationale: Traduction directe qui maintient l’immédiateté de la narration proverbiale.
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: qu’il y va de sa vie
  rationale: Cette tournure française exprime naturellement l’enjeu mortel tout en restant proche de la formulation hébraïque elliptique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et imagé. La ponctuation distingue l’aboutissement de la première comparaison et l’image de l’oiseau, tout en conservant la continuité avec le verset précédent. Le pronom « il » maintient la formulation concise du proverbe.
