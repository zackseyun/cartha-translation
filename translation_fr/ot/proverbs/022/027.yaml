  yaml_path: translation/ot/proverbs/022/027.yaml
  text: If you have nothing with which to pay[a], why should he take your bed from under you?
translation:
  language: fr
  text: Si tu n’as pas de quoi payer, pourquoi prendrait-il ton lit[a] de sous toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta couche » ou « ton lieu de repos ». L’hébreu nomme précisément l’objet emporté, et non simplement un gage quelconque.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit directement la condition qui fonde l’avertissement.
- source_word: אֵין לְךָ
  choice: tu n’as pas
  rationale: La construction hébraïque exprime idiomatiquement la possession négative ; cette formulation est naturelle en français.
- source_word: לְשַׁלֵּם
  choice: de quoi payer
  rationale: L’infinitif renvoie au paiement de la dette ; « de quoi payer » restitue sobrement l’idée de moyens disponibles.
- source_word: לָמָּה
  choice: pourquoi
  rationale: Introduit la question rhétorique sans en atténuer la force d’avertissement.
- source_word: יִקַּח
  choice: prendrait-il
  rationale: Conserve le sujet masculin singulier, qui renvoie probablement au créancier évoqué par le contexte, sans le nommer explicitement.
- source_word: מִשְׁכָּבְךָ
  choice: ton lit
  rationale: Le nom désigne concrètement ce sur quoi l’on se couche ; « lit » est ici clair, actuel et plus fidèle qu’un terme générique comme « gage ».
- source_word: מִתַּחְתֶּיךָ
  choice: de dessous toi
  rationale: Préserve l’image frappante du lit retiré à la personne même qui y est couchée.
