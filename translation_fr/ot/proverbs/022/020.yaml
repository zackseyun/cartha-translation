  text: הֲ/לֹ֤א כָתַ֣בְתִּי לְ֭/ךָ שלשום בְּ/מ֖וֹעֵצֹ֣ת וָ/דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/020.yaml
  text: Have I not written for you thirty sayings of counsel and knowledge?[a][b]
translation:
  language: fr
  text: N’ai-je pas écrit pour toi trente paroles de conseil et de connaissance ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’ai-je pas écrit pour toi auparavant au sujet du conseil et de la connaissance ? » Le mot hébreu traditionnellement rendu par « auparavant » est difficile ici ; beaucoup y comprennent plutôt « trente », peut-être en référence à un recueil de trente paroles.'
    reason: alternative_reading
  - marker: b
    text: Certaines traductions traditionnelles ont « des choses excellentes » au lieu de « trente paroles ». Cette traduction repose sur une autre interprétation de l’expression hébraïque difficile.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: N’ai-je pas
  rationale: La particule interrogative suivie de la négation introduit une question rhétorique qui appelle une réponse affirmative. Cette formulation en conserve directement la force.
- source_word: כָתַבְתִּי
  choice: écrit
  rationale: Le parfait qal à la première personne du singulier désigne une action accomplie. Avec « N’ai-je pas », le passé composé est idiomatique en français et souligne sa pertinence actuelle.
- source_word: לְךָ
  choice: pour toi
  rationale: La préposition ל peut marquer le destinataire ou le bénéficiaire. Dans ce contexte d’instruction, « pour toi » exprime naturellement que ces paroles ont été écrites au bénéfice de l’élève.
- source_word: שלשום
  choice: trente paroles
  rationale: L’expression hébraïque est difficile. Beaucoup la rattachent au nombre « trente », probablement en référence à un ensemble de paroles sapientielles. « Paroles » explicite sobrement le nom sous-entendu d’après le contexte, sans préciser davantage leur genre.
- source_word: בְּמוֹעֵצוֹת
  choice: de conseil
  rationale: Le terme est lié à עֵצָה, « conseil, avis, projet ». La tournure française « paroles de conseil » restitue naturellement la valeur descriptive de l’expression prépositionnelle.
- source_word: וָדָעַת
  choice: et de connaissance
  rationale: דַּעַת signifie couramment « connaissance » dans la littérature de sagesse. La coordination avec « conseil » est maintenue.
