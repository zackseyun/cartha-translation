id: PRO.22.12
reference: Proverbs 22:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה נָ֣צְרוּ דָ֑עַת וַ֝/יְסַלֵּ֗ף דִּבְרֵ֥י בֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
translation:
  language: fr
  text: Les yeux de Yahweh gardent la connaissance[a], mais il renverse[b] les paroles du traître[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préservent la connaissance ». Le verbe hébreu peut signifier garder, protéger ou préserver.
    reason: lexical_alternative
  - marker: b
    text: Ou « déjoue » ou « bouleverse ». Le verbe hébreu peut évoquer le fait de rendre tortueux, de fausser ou de renverser.
    reason: lexical_alternative
  - marker: c
    text: Ou « de l’infidèle ». Le terme hébreu désigne une personne qui agit avec perfidie ou infidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  choice: Les yeux de Yahweh
  rationale: Cette traduction conserve l’image anthropomorphique de la vigilance divine et rend directement le nom divin יהוה par « Yahweh ».
- source_word: נָצְרוּ
  choice: gardent
  rationale: Le verbe נצר signifie garder, protéger ou préserver. « Gardent » est naturel en français et maintient le contraste avec l’action de renverser dans le second membre.
- source_word: דָעַת
  choice: la connaissance
  rationale: Dans les Proverbes, דעת désigne normalement la connaissance, notamment la connaissance vraie associée à la sagesse.
- source_word: וַיְסַלֵּף
  choice: il renverse
  rationale: Le verbe סלף peut exprimer l’idée de rendre tortueux, de fausser ou de bouleverser. Ici, « renverse » traduit l’opposition active de Yahweh aux paroles trompeuses sans préciser indûment la manière dont elles échouent.
- source_word: דִּבְרֵי
  choice: les paroles
  rationale: דבר peut désigner une parole ou une affaire; dans cette construction, « les paroles » est le sens le plus direct.
- source_word: בֹגֵד
  choice: du traître
  rationale: Le participe בוגד désigne celui qui agit avec perfidie ou infidélité. Le singulier « du traître » respecte la forme hébraïque et reste général.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nature de l’action divine sur les paroles du traître
  choice: il renverse les paroles
  alternative: il fausse les paroles
  rationale: Le contexte oppose la préservation de la connaissance à l’échec imposé aux paroles perfides. « Renverse » préserve cette force sans suggérer que Dieu serait lui-même l’auteur d’une falsification trompeuse.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve le parallélisme, l’image des « yeux » de Yahweh et l’ambiguïté lexicale principale au moyen de notes.
