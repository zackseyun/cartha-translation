  verdict: revise
  source_fidelity: 'Le sens fondamental des deux interdictions est bien rendu : ne pas nouer une relation d’amitié avec un homme caractérisé par la colère et ne pas entrer dans sa compagnie. Toutefois, « accès de fureur » explicite de façon un peu trop étroite le pluriel hébreu חֵמוֹת, qui caractérise surtout l’homme par une fureur/colère ardente sans imposer précisément l’idée d’épisodes distincts.'
  naturalness: « Se lier d’amitié avec » et « fréquenter » sont naturels en français moderne et conviennent au registre proverbial. « Un homme porté à la fureur » est plus idiomatique et moins lourd que « un homme sujet aux accès de fureur ».
  terminology: « Homme colérique » rend convenablement בַּעַל אָף. Pour אִישׁ חֵמוֹת, « homme porté à la fureur » conserve une caractérisation durable et la force de « fureur », sans surinterpréter le pluriel. La note littérale sur תָבוֹא doit être ancrée au verbe français qu’elle explique.
