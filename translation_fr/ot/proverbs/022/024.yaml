  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
translation:
  language: fr
  text: Ne te lie pas d’amitié avec un homme colérique[a], et ne fréquente[b] pas un homme porté à la fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne t’associe pas à un homme prompt à la colère. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « n’entre pas avec un homme de fureurs » ; dans ce contexte, il s’agit d’entrer dans sa compagnie ou de le fréquenter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  choice: te lie pas d’amitié avec
  rationale: Le hitpael de רעה désigne ici le fait de devenir le compagnon ou l’ami de quelqu’un. Cette tournure française exprime naturellement une relation étroite, sans réduire le verbe à une simple rencontre.
- source_word: בַּעַל אָף
  choice: un homme colérique
  rationale: La construction בעל suivie d’un nom caractérise une personne par ce trait. אָף signifie littéralement « nez », puis, par métonymie, « colère » ; « homme colérique » restitue l’idiome de façon concise.
- source_word: אִישׁ חֵמוֹת
  choice: un homme sujet aux accès de fureur
  rationale: Le pluriel חֵמוֹת peut évoquer des manifestations répétées ou intenses de colère. La formulation conserve la description caractéristique tout en distinguant légèrement ce membre du parallèle.
- source_word: תָבוֹא
  choice: fréquente
  rationale: בוא signifie littéralement « venir/entrer », mais, avec אֶת et en parallèle avec תתרע, il avertit ici de ne pas entrer dans la compagnie de cet homme ni la rechercher régulièrement.
- source_word: אַל ... לֹא
  choice: Ne ... pas ... et ne ... pas
  rationale: Les deux interdictions parallèles sont rendues explicitement afin de préserver leur structure et leur force.
- source_word: אִישׁ
  choice: homme
  rationale: Le substantif hébreu est masculin singulier et présente proverbialement un individu représentatif ; « homme » en conserve la forme grammaticale.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme hébreu est conservé, avec une variation naturelle entre « se lier d’amitié » et « fréquenter ». Les expressions imagées hébraïques sont rendues idiomatiquement, tandis que la note b signale la formulation littérale inhabituelle.
