base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/017.yaml
  text: Incline your ear and hear the words of the wise[a], and set your heart on my knowledge.
translation:
  language: fr
  text: Tends l’oreille et écoute les paroles des sages ; tourne ton cœur vers ma connaissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers mon enseignement ». L’hébreu dit littéralement « vers ma connaissance », ce qui peut désigner soit le savoir du locuteur, soit, par extension, l’enseignement qui le transmet.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט אָזְנְךָ
  choice: Tends l’oreille
  rationale: L’impératif hiphil de נטה exprime l’idée d’incliner ou de tendre. « Tends l’oreille » conserve l’image d’une attention volontaire tout en étant naturel en français moderne.
- source_word: וּשְׁמַע
  choice: et écoute
  rationale: שׁמע signifie entendre ou écouter. Ici, « écoute » rend clairement la valeur impérative et attentive sans absorber l’image distincte de l’oreille tendue.
- source_word: דִּבְרֵי חֲכָמִים
  choice: les paroles des sages
  rationale: דִּבְרֵי désigne des paroles ou des propos, et חֲכָמִים les personnes sages au pluriel. Cette formulation est fidèle, idiomatique et n’ajoute aucune précision de genre absente du contexte.
- source_word: וְלִבְּךָ תָּשִׁית
  choice: applique ton cœur
  rationale: תָּשִׁית signifie mettre, placer ou diriger. Avec לֵב, « applique ton cœur » exprime l’engagement volontaire de la pensée et de la volonté tout en conservant l’anthropologie imagée de l’hébreu.
- source_word: לְדַעְתִּי
  choice: à ma connaissance
  rationale: La forme signifie littéralement « à/pour ma connaissance ». La traduction conserve le suffixe de première personne et l’ambiguïté entre le savoir du locuteur et l’enseignement qui le communique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Tends l’oreille » est plus naturel aujourd’hui que « incline ton oreille », tandis que « applique ton cœur » conserve l’image hébraïque et la tension entre compréhension intérieure et volonté.
