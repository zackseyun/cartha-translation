source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל לְ/הַרְבּ֣וֹת ל֑/וֹ נֹתֵ֥ן לְ֝/עָשִׁ֗יר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
translation:
  language: fr
  text: Qui opprime le pauvre pour s’enrichir, ou donne au riche[a], n’aboutit qu’à la pauvreté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui opprime le pauvre pour s’enrichir et donne au riche n’aboutit qu’à la pauvreté. » L’hébreu peut présenter soit deux pratiques comparables, soit un même comportement combinant les deux actes.'
    reason: alternative_reading
  - marker: b
    text: « À la pauvreté » peut aussi se traduire par « au dénuement » ou « à l’indigence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Qui opprime
  rationale: Le participe qal employé substantivement décrit de façon générale une personne qui exploite ou opprime; cette tournure française en conserve la force habituelle.
- source_word: דָּל
  choice: le pauvre
  rationale: Dans ce contexte économique, דָּל désigne avant tout une personne pauvre ou socialement démunie.
- source_word: לְהַרְבּוֹת לוֹ
  choice: pour s’enrichir
  rationale: L’infinitif exprime le but ou le résultat recherché au bénéfice du sujet; «s’enrichir» rend naturellement l’augmentation implicite de ses biens.
- source_word: נֹתֵן לְעָשִׁיר
  choice: ou donne au riche
  rationale: Le second participe peut présenter une pratique parallèle à la première. «Ou» offre une lecture naturelle tout en signalant en note que l’hébreu permet aussi de relier cumulativement les deux actes.
- source_word: אַךְ
  choice: ne… qu’à
  rationale: La construction restrictive française restitue la force limitative et emphatique de אַךְ.
- source_word: לְמַחְסוֹר
  choice: à la pauvreté
  rationale: מַחְסוֹר signifie manque, besoin ou indigence; «pauvreté» convient clairement au cadre économique du proverbe.
theological_decisions:
- issue: Relation syntaxique entre les deux participes
  choice: 'Deux pratiques comparables sont présentées: opprimer le pauvre pour s’enrichir, ou donner au riche; elles mènent à la pauvreté.'
  alternative: 'Une seule personne accomplit les deux actes: elle opprime le pauvre pour s’enrichir et donne au riche, pour n’aboutir qu’à la pauvreté.'
  rationale: La syntaxe hébraïque, concise et sans verbe principal explicite, permet une lecture disjonctive ou cumulative. Le texte retient la première, plus fluide en français, et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, concis et proverbial. «Le pauvre» et «le riche» ont une valeur générique; la formulation reste digne et accessible, sans préciser au-delà de l’ambiguïté syntaxique de l’hébreu.
