  text: אָמַ֣ר עָ֭צֵל אֲרִ֣י בַ/ח֑וּץ בְּ/ת֥וֹךְ רְ֝חֹב֗וֹת אֵֽרָצֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/013.yaml
  text: The sluggard says[b][a], “There is a lion outside! I will be killed in the streets!”
translation:
  language: fr
  text: 'Le paresseux dit : « Il y a un lion dehors ! Je serai tué[b] au milieu des rues[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les places » / « dans les espaces publics » ; le mot hébreu peut désigner de larges espaces ouverts, et pas seulement des rues.
    reason: lexical_alternative
  - marker: b
    text: Ou « je serai assassiné » / « mis à mort » ; le verbe hébreu peut évoquer une mise à mort violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: le paresseux
  rationale: Le nom désigne une personne habituellement paresseuse, figure caractéristique des Proverbes. L’article défini présente naturellement en français ce type humain générique.
- source_word: אֲרִי
  choice: un lion
  rationale: Sens lexical direct. Rien dans le contexte immédiat n’impose une lecture métaphorique ; le lion fait partie de l’excuse démesurée du paresseux.
- source_word: בַחוּץ
  choice: dehors
  rationale: Le terme désigne ce qui se trouve à l’extérieur de la maison. « Dehors » est naturel en français et prépare la mention des espaces publics dans le second membre.
- source_word: בְּתוֹךְ רְחֹבוֹת
  choice: dans les rues
  rationale: רְחֹבוֹת peut désigner des rues larges, des places ou d’autres espaces publics ouverts. « Dans les rues » est idiomatique et conserve l’idée générale sans surcharger le français ; l’autre possibilité est signalée en note.
- source_word: אֵרָצֵחַ
  choice: je serai tué
  rationale: Le niphal inaccompli de רצח exprime ici le fait de subir une mort violente. « Je serai tué » est naturel et laisse ouverte l’identité de l’agent ; la nuance plus forte de meurtre est conservée en note.
- source_word: אָמַר עָצֵל
  choice: Le paresseux dit
  rationale: Bien que עָצֵל soit sans article en hébreu, le style proverbial présente un représentant générique d’une catégorie. « Le paresseux » rend cette fonction naturellement en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et proverbial. La formulation conserve l’exagération comique de l’excuse sans expliquer explicitement que la crainte est invraisemblable.
