  source_fidelity: 'Le sens principal est bien rendu : le proverbe associe l’amour de la pureté intérieure et une parole marquée par חֵן à l’amitié du roi. « A le roi pour ami » rend naturellement la proposition nominale finale et la note conserve correctement la possibilité d’un sens indéfini pour מֶלֶךְ. Toutefois, la note a présente comme « plus littérale » une reformulation qui ne reflète pas directement la construction nominale hébraïque חֵן שְׂפָתָיו (« la grâce de ses lèvres »).'
