source:
  edition: WLC
  text: אֹהֵ֥ב טהור לֵ֑ב חֵ֥ן שְׂ֝פָתָ֗י/ו רֵעֵ֥/הוּ מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/011.yaml
  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
translation:
  language: fr
  text: Qui aime la pureté du cœur et dont les lèvres sont pleines de grâce[a] a le roi[b] pour ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « la grâce de ses lèvres » ; c.-à-d. ses lèvres, ou sa parole, sont gracieuses.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un roi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  choice: Qui aime
  rationale: Le participe qal est employé substantivement et décrit, sous une forme proverbiale générale, la personne qui aime.
- source_word: טהור לֵב
  choice: la pureté du cœur
  rationale: L’expression désigne une qualité morale intérieure; cette formulation française est naturelle tout en restant proche de la construction hébraïque.
- source_word: חֵן שְׂפָתָיו
  choice: dont les lèvres sont pleines de grâce
  rationale: Littéralement, le texte associe la « grâce » aux lèvres; la formulation conserve cette image et exprime une parole aimable et bienveillante sans réduire חֵן à une seule nuance.
- source_word: רֵעֵהוּ
  choice: a … pour ami
  rationale: רֵעַ désigne ici un ami ou compagnon; la tournure française rend naturellement la proposition nominale hébraïque.
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Même sans article en hébreu, le nom peut désigner le roi de manière typique dans cette maxime. Une note préserve la lecture indéfinie possible.
theological_decisions:
- issue: Relation syntaxique de la dernière proposition
  choice: La personne décrite a le roi pour ami.
  alternative: Un roi est son ami.
  rationale: La proposition nominale hébraïque permet cette formulation naturelle sans trancher au-delà du texte la portée définie ou indéfinie de מֶלֶךְ; l’alternative est signalée en note.
translation_notes:
  register: Français moderne, proverbial et digne. La formulation conserve l’image des lèvres et la notion polysémique de grâce, tout en restant immédiatement compréhensible.
