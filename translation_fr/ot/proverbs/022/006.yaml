id: PRO.22.6
reference: Proverbs 22:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
translation:
  language: fr
  text: Éduque un garçon selon sa voie[a][b] ; même quand il vieillira, il ne s’en écartera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon sa voie ». On comprend aussi : « dans la voie qu’il doit suivre » ou « selon la voie qui lui convient ».'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu est un masculin singulier désignant un garçon ou un jeune homme, employé ici dans un énoncé général. Comme souvent dans les Proverbes, il s’agit d’un principe de sagesse, non d’une promesse sans exception.
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  choice: Éduque
  rationale: L’impératif de חנך peut évoquer l’initiation ou la consécration, mais, dans ce contexte sapientiel et formateur, « Éduque » exprime naturellement l’action de former un jeune sans surinterpréter le verbe.
- source_word: לַנַּעַר
  choice: le jeune
  rationale: נַעַר désigne couramment un garçon ou un jeune homme. « Le jeune » conserve ici le masculin singulier à valeur générique tout en restant naturel en français moderne.
- source_word: עַל פִּי
  choice: selon
  rationale: L’expression idiomatique עַל־פִּי signifie ici « selon » ou « conformément à ». Une traduction littérale par « sur la bouche de » serait incompréhensible en français.
- source_word: דַרְכּוֹ
  choice: sa voie
  rationale: L’hébreu dit littéralement « sa voie ». Cette formulation préserve l’ambiguïté entre la bonne voie à suivre et la voie correspondant au caractère ou au stade de développement du jeune.
- source_word: גַּם כִּי
  choice: même quand
  rationale: La locution introduit ici une nuance à la fois temporelle et concessive. « Même quand » convient à la vieillesse envisagée comme une étape future attendue.
- source_word: יַזְקִין
  choice: il vieillira
  rationale: Le verbe exprime le fait de devenir vieux. Le futur français rend naturellement la perspective du proverbe.
- source_word: לֹא יָסוּר
  choice: il ne s’en écartera pas
  rationale: סור signifie se détourner, s’écarter ou abandonner. « S’en écarter » reprend clairement l’image de la voie en français.
- source_word: מִמֶּנָּה
  choice: en
  rationale: Le suffixe féminin renvoie à דֶּרֶךְ, « voie ». Le pronom adverbial « en » permet une reprise idiomatique dans l’expression « s’en écarter ».
theological_decisions:
- issue: Sens débattu de « sa voie »
  choice: Conserver « selon sa voie » dans le texte principal.
  alternative: « dans la voie qu’il doit suivre » ou « selon la voie qui lui convient »
  rationale: Le texte hébreu ne précise ni explicitement l’obligation morale ni l’adaptation au tempérament du jeune. La traduction principale maintient donc cette tension réelle, tandis que la note présente les principales interprétations.
- issue: Portée de l’énoncé proverbial
  choice: Présenter le verset comme un principe général de sagesse.
  alternative: Le comprendre comme une promesse absolue ne souffrant aucune exception.
  rationale: La forme proverbiale énonce une observation et une orientation générales ; elle ne marque pas explicitement une garantie inconditionnelle pour chaque cas particulier.
translation_notes:
  register: Français international moderne, sobre et digne. « Éduque » est accessible sans être familier ; « selon sa voie » conserve volontairement la formulation concise et l’ambiguïté de l’hébreu. La ponctuation met en relief les deux membres parallèles du proverbe.
