  text: גָּ֣רֵֽשׁ לֵ֭ץ וְ/יֵצֵ֣א מָד֑וֹן וְ֝/יִשְׁבֹּ֗ת דִּ֣ין וְ/קָלֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
translation:
  language: fr
  text: Chasse le moqueur[a], et la discorde s’en ira ; les disputes[b] et l’opprobre cesseront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « railleur ». Le mot hébreu désigne, dans les écrits de sagesse, une personne qui tourne avec arrogance la correction et la sagesse en dérision.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner des contestations, un procès ou un jugement.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Chasse
  rationale: L’impératif exprime l’action de forcer quelqu’un à partir. « Chasse » est direct, naturel et conserve la vigueur du verbe hébreu.
- source_word: לֵץ
  choice: le moqueur
  rationale: Dans les Proverbes, ce terme désigne celui qui tourne avec arrogance la sagesse et la correction en dérision. « Moqueur » est clair en français moderne.
- source_word: מָדוֹן
  choice: la discorde
  rationale: Le nom évoque les conflits et les querelles. « Discorde » convient au résultat collectif provoqué par le moqueur et s’accorde naturellement avec « s’en ira ».
- source_word: וְיֵצֵא
  choice: s’en ira
  rationale: L’imparfait hébreu présente ici la conséquence attendue de l’impératif. Le futur français rend clairement cette relation.
- source_word: דִּין
  choice: les disputes
  rationale: Dans ce parallélisme avec מָדוֹן, le mot désigne probablement des contestations ou querelles, tout en pouvant aussi évoquer un procès ou un jugement. La note conserve cette latitude.
- source_word: וְיִשְׁבֹּת
  choice: cesseront
  rationale: Le verbe signifie cesser ou prendre fin. Le futur exprime la conséquence de l’expulsion du moqueur.
- source_word: קָלוֹן
  choice: les humiliations
  rationale: Le terme désigne le déshonneur, la honte ou l’opprobre. « Humiliations » exprime naturellement les affronts déshonorants associés aux querelles.
