id: PRO.22.15
reference: Proverbs 22:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
translation:
  language: fr
  text: La folie est attachée au cœur du jeune garçon ; le bâton de la discipline l’éloignera de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: la folie
  rationale: Dans les Proverbes, le nom désigne une attitude moralement insensée, et non un simple manque d’intelligence. « Folie » est ici naturel, concis et fidèle.
- source_word: קְשׁוּרָה
  choice: est attachée
  rationale: Le participe passif exprime ce qui est lié ou solidement associé. « Est attachée » préserve l’image sans ajouter l’idée plus interprétative d’un enracinement.
- source_word: בְלֶב
  choice: au cœur
  rationale: Le cœur représente en hébreu le centre de la pensée, de la volonté et des désirs. Le maintien de « cœur » préserve cette anthropologie et l’image du texte.
- source_word: נָעַר
  choice: du jeune garçon
  rationale: Le terme peut désigner un enfant, un garçon ou un jeune homme. Le masculin singulier et le contexte éducatif justifient « jeune garçon », qui rend à la fois le sexe et la jeunesse du référent.
- source_word: שֵׁבֶט
  choice: le bâton
  rationale: Le mot désigne concrètement une verge ou un bâton employé comme instrument d’autorité ou de correction. « Bâton » est plus courant et naturel en français moderne que « verge », tout en conservant l’image concrète.
- source_word: מוּסָר
  choice: de la discipline
  rationale: Dans la littérature de sagesse, le terme englobe l’éducation, la correction et la formation. « Discipline » rend cette portée formative sans la réduire au seul châtiment.
- source_word: יַרְחִיקֶנָּה
  choice: l’éloignera
  rationale: La forme causative signifie faire devenir lointain ou éloigner. « L’éloignera » restitue clairement ce mouvement de séparation ; l’objet féminin renvoie à la folie.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: La préposition avec suffixe masculin indique la séparation d’avec le jeune garçon. « De lui » rend directement ce rapport.
theological_decisions:
- issue: Faut-il atténuer l’image d’une correction corporelle ?
  choice: Conserver l’expression concrète « le bâton de la discipline ».
  alternative: Traduire de manière abstraite par « la discipline » ou « la correction », sans mentionner le bâton.
  rationale: Le texte hébreu nomme explicitement le bâton. La traduction conserve donc cette image et la tension qu’elle peut susciter, sans l’élargir en principe doctrinal au-delà de ce que dit le proverbe.
- issue: Rendu du genre de נָעַר
  choice: Employer « le jeune garçon ».
  alternative: Employer « l’enfant » ou « le jeune ».
  rationale: Le nom est masculin singulier et désigne vraisemblablement ici un garçon soumis à une formation. Le rendu choisi respecte cette indication sans neutraliser le référent.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé au moyen du point-virgule. « Bâton » maintient l’image concrète dans un vocabulaire courant et digne ; aucune note n’est nécessaire, car les principales nuances lexicales sont suffisamment représentées dans le texte.
