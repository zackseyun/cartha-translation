  text: צִנִּ֣ים פַּ֭חִים בְּ/דֶ֣רֶךְ עִקֵּ֑שׁ שׁוֹמֵ֥ר נַ֝פְשׁ֗/וֹ יִרְחַ֥ק מֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
translation:
  language: fr
  text: Épines et pièges se trouvent sur le chemin de l’homme retors[a] ; celui qui veille sur sa vie[b] s’en tient éloigné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’homme pervers » ou « de l’homme tortueux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « son âme » ; ici, le mot désigne la vie ou la personne elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  choice: épines
  rationale: Le nom désigne très probablement des objets pointus, notamment des épines. Dans ce parallélisme, il évoque clairement les dangers rencontrés sur un chemin.
- source_word: פַּחִים
  choice: pièges
  rationale: Le terme désigne des pièges ou des filets. « Pièges » est naturel en français moderne et conserve l’image d’un danger caché.
- source_word: בְּדֶרֶךְ
  choice: jonchent le chemin de
  rationale: דֶרֶךְ désigne ici à la fois le chemin et, figurativement, la conduite. Le verbe « jonchent », ajouté pour rendre la proposition nominale de façon naturelle, présente les dangers comme disposés sur ce chemin.
- source_word: עִקֵּשׁ
  choice: l’homme retors
  rationale: L’adjectif décrit une personne moralement tortueuse, perverse ou dévoyée. « Retors » conserve cette idée et s’accorde naturellement avec la métaphore du chemin.
- source_word: שׁוֹמֵר נַפְשׁוֹ
  choice: celui qui veille sur sa vie
  rationale: Le participe énonce une vérité générale. נֶפֶשׁ peut signifier l’âme, la vie ou la personne elle-même ; dans ce contexte de préservation face au danger, « vie » convient le mieux.
- source_word: יִרְחַק מֵהֶם
  choice: s’en tient éloigné
  rationale: L’imparfait exprime le comportement ou le résultat habituel. Le pronom pluriel renvoie naturellement aux épines et aux pièges.
theological_decisions:
- issue: Portée générique du masculin singulier dans la littérature de sagesse
  choice: celui qui veille sur sa vie
  alternative: qui veille sur sa vie / l’homme qui veille sur sa vie
  rationale: Le masculin singulier hébreu formule un principe représentatif applicable à toute personne. « Celui qui » le conserve sans limiter artificiellement le proverbe aux hommes.
- issue: Sens de נֶפֶשׁ
  choice: vie
  alternative: âme / personne
  rationale: Le verset porte sur la protection contre des dangers figurés par des épines et des pièges. « Vie » rend donc ici le sens contextuel sans imposer une distinction théologique entre l’âme et le corps.
translation_notes:
  register: Français international moderne, concis et proverbial. « Retors » est soutenu mais courant et conserve la dimension morale de l’hébreu. La structure en deux membres et la métaphore du chemin sont préservées.
