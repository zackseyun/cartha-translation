source:
  edition: WLC
  text: עֵ֣קֶב עֲ֭נָוָה יִרְאַ֣ת יְהוָ֑ה עֹ֖שֶׁר וְ/כָב֣וֹד וְ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
translation:
  language: fr
  text: La récompense de l’humilité et de la crainte de Yahweh, c’est la richesse, l’honneur et la vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, moins probable : « La récompense de l’humilité, c’est la crainte de Yahweh, la richesse, l’honneur et la vie. »'
    reason: Lecture syntaxique alternative permise par la formulation hébraïque condensée.
lexical_decisions:
- source_word: עֵקֶב
  choice: la récompense de
  rationale: Le nom peut exprimer le résultat, la conséquence ou la rétribution. « La récompense de » convient au caractère proverbial et introduit naturellement les bienfaits énumérés.
- source_word: עֲנָוָה
  choice: l’humilité
  rationale: Ce terme désigne l’humilité ou l’abaissement. « Humilité » est clair, actuel et n’ajoute pas la nuance de passivité que pourrait suggérer « douceur ».
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  rationale: Cette expression sapientielle désigne une crainte révérencielle envers le Dieu d’Israël. « Crainte » conserve la force et l’épaisseur théologique de l’expression hébraïque sans la réduire à la seule « révérence ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עֹשֶׁר
  choice: la richesse
  rationale: Le terme désigne la richesse ou l’abondance matérielle. Le singulier collectif « richesse » est naturel dans cette maxime.
- source_word: כָבוֹד
  choice: l’honneur
  rationale: Dans ce contexte sapientiel humain, le mot évoque surtout la considération et l’honneur, plutôt que la gloire divine.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le mot ait une forme plurielle en hébreu, il fonctionne couramment comme un nom abstrait signifiant « vie ». « Longue vie » serait possible par implication, mais ajouterait une précision absente du texte.
theological_decisions:
- issue: Rapport syntaxique entre « humilité » et « crainte de Yahweh »
  choice: Les deux noms sont coordonnés comme les qualités dont la récompense est la richesse, l’honneur et la vie.
  alternative: 'Comprendre « la crainte de Yahweh » comme le premier élément de la récompense : « La récompense de l’humilité, c’est la crainte de Yahweh, la richesse, l’honneur et la vie. »'
  rationale: La formulation hébraïque, très condensée, autorise les deux analyses. La coordination des deux vertus fournit toutefois la lecture la plus naturelle dans le style proverbial; l’autre possibilité est conservée en note afin de ne pas effacer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, concis et digne. La structure nominale et la série ternaire du proverbe sont conservées; « c’est » clarifie naturellement la relation prédicative en français.
