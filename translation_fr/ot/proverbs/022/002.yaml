source:
  edition: WLC
  text: עָשִׁ֣יר וָ/רָ֣שׁ נִפְגָּ֑שׁוּ עֹשֵׂ֖ה כֻלָּ֣/ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/002.yaml
  text: The rich and the poor meet together[a]; Yahweh is the maker of them all.
translation:
  language: fr
  text: Le riche et le pauvre se rencontrent[a] ; Yahvé les a tous faits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « Le riche et le pauvre ont ceci en commun : Yahvé les a tous faits. »'
    reason: Alternative lexicale et interprétative pour נִפְגָּשׁוּ dans le contexte proverbial.
lexical_decisions:
- source_word: עָשִׁיר
  choice: le riche
  rationale: Adjectif substantivé désignant de façon générique la personne riche ou la catégorie des riches ; le singulier français conserve la formulation concise et représentative du proverbe.
- source_word: וָרָשׁ
  choice: et le pauvre
  rationale: Opposé social de עָשִׁיר ; « le pauvre » préserve le parallélisme, la valeur générique et la concision de l’hébreu.
- source_word: נִפְגָּשׁוּ
  choice: se rencontrent
  rationale: Le niphal de פגשׁ exprime ici une rencontre réciproque. « Se rencontrent » est naturel en français et maintient l’image concrète sans imposer l’interprétation plus abstraite « ont ceci en commun ».
- source_word: עֹשֵׂה
  choice: a faits
  rationale: Le participe qal peut caractériser Yahvé comme celui qui fait les uns et les autres. En français, la proposition « les a tous faits » rend idiomatiquement l’affirmation de leur origine commune, sans ajouter le terme plus spécialisé « créateur ».
- source_word: כֻלָּם
  choice: les… tous
  rationale: Le pronom renvoie collectivement au riche et au pauvre. La tournure discontinue française « les a tous faits » exprime clairement cette totalité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme, qui conserve le nom divin plutôt que de lui substituer le titre « le Seigneur ».
theological_decisions:
- issue: Portée interprétative du premier membre
  choice: Conserver l’image selon laquelle le riche et le pauvre « se rencontrent », tout en laissant la seconde proposition éclairer leur condition commune sous l’action de Yahvé.
  alternative: '« Le riche et le pauvre ont ceci en commun : Yahvé les a tous faits. »'
  rationale: Le sens lexical le plus direct de נִפְגָּשׁוּ est « se rencontrer », mais la forme proverbiale peut suggérer une réalité partagée. Le texte principal maintient cette tension, et la note donne l’interprétation explicite sans la substituer à l’image hébraïque.
- issue: Rapport de Yahvé aux deux catégories sociales
  choice: Affirmer que Yahvé les a tous faits, sans tirer dans la traduction une conclusion sociale ou doctrinale supplémentaire.
  alternative: Expliciter une égalité de statut, de dignité ou de condition devant Dieu.
  rationale: Le verset fonde leur point commun dans l’action de Yahvé, mais ne formule pas lui-même toutes les implications théologiques ou sociales possibles.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le singulier générique « le riche et le pauvre » reproduit le contraste social compact de l’hébreu. Le point-virgule conserve les deux membres du proverbe tout en indiquant leur lien étroit.
