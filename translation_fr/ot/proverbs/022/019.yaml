source:
  edition: WLC
  text: לִ/הְי֣וֹת בַּ֭/יהוָה מִבְטַחֶ֑/ךָ הוֹדַעְתִּ֖י/ךָ הַ/יּ֣וֹם אַף אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/019.yaml
  text: So that your trust may be in Yahweh[a], I have made known to you today, even to you.
translation:
  language: fr
  text: Afin que ta confiance soit en Yahweh, je te les[a] ai fait connaître aujourd’hui, à toi personnellement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « les » n’est pas exprimé en hébreu; il renvoie aux paroles ou aux instructions du contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Afin que tu mettes
  rationale: L’infinitif construit précédé de ל exprime ici le but. Cette formulation rend naturellement en français la finalité de l’enseignement.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב introduit celui en qui la confiance est placée; le nom divin יהוה est transcrit « Yahweh ».
- source_word: מִבְטַחֶךָ
  choice: ta confiance
  rationale: מִבְטָח désigne la confiance ou l’assurance sur laquelle on s’appuie; le suffixe de deuxième personne du masculin singulier est conservé par « ta ».
- source_word: הוֹדַעְתִּיךָ
  choice: je te les ai fait connaître
  rationale: Le hiphil de ידע signifie « faire connaître ». Le pronom « les », absent en hébreu, reprend explicitement les paroles ou instructions du contexte afin d’obtenir une phrase française intelligible.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Traduction directe et courante de l’indication temporelle.
- source_word: אַף אָתָּה
  choice: à toi aussi
  rationale: אַף et le pronom indépendant אָתָּה mettent l’accent sur le destinataire. « À toi aussi » conserve cette insistance sans alourdir excessivement la phrase.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme יהוה; « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement conserve l’adresse individuelle au masculin singulier. La formulation privilégie une équivalence optimale tout en signalant l’objet sous-entendu ajouté pour la clarté.
