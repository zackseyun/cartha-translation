  yaml_path: translation/ot/proverbs/022/022.yaml
  text: Do not rob the poor because he is poor[b][a], and do not crush the afflicted at the gate.
translation:
  language: fr
  text: Ne dépouille pas le pauvre parce qu’il est pauvre, et n’écrase pas le malheureux à la porte de la ville.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La porte de la ville était le lieu où l’on traitait couramment les affaires judiciaires et où l’on rendait les jugements publics.
    reason: cultural_note
lexical_decisions:
- source_word: תִּגְזָל
  choice: dépouille
  rationale: Le verbe גזל désigne couramment le fait de prendre par la force ou de s’emparer injustement du bien d’autrui. « Dépouiller » exprime cette spoliation mieux que le terme plus général « voler ».
- source_word: דָּל
  choice: le pauvre
  rationale: דָּל désigne ici une personne démunie ou socialement faible. « Le pauvre » est naturel en français et permet de conserver la répétition dans « parce qu’il est pauvre ».
- source_word: כִּי דַל הוּא
  choice: parce qu’il est pauvre
  rationale: 'כִּי a ici une valeur causale : la pauvreté de la victime devient précisément l’occasion ou le motif de l’injustice. Cette formulation préserve aussi la répétition rhétorique de דל.'
- source_word: תְּדַכֵּא
  choice: n’écrase pas
  rationale: Au piel, דכא évoque l’action d’écraser et, par extension, d’opprimer sévèrement. « Écraser » maintient la vigueur de l’image hébraïque.
- source_word: עָנִי
  choice: le malheureux
  rationale: עָנִי peut désigner le pauvre, l’affligé ou l’opprimé. « Le malheureux » souligne ici la détresse et la vulnérabilité tout en distinguant ce terme du précédent דָּל.
- source_word: בַשָּׁעַר
  choice: à la porte de la ville
  rationale: La « porte » est celle de la ville, lieu habituel des affaires publiques et des jugements. L’explicitation minimale « de la ville » rend la référence intelligible sans remplacer l’image par « au tribunal ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve le parallélisme, la répétition de « pauvre » et la métaphore forte d’« écraser », tout en explicitant sobrement qu’il s’agit de la porte de la ville.
