id: PRO.22.1
reference: Proverbs 22:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִבְחָ֣ר שֵׁ֭ם מֵ/עֹ֣שֶׁר רָ֑ב מִ/כֶּ֥סֶף וּ֝/מִ/זָּהָ֗ב חֵ֣ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/001.yaml
  text: A name is to be chosen rather than great wealth[c][b][a], and favor is better than silver and gold.
translation:
  language: fr
  text: Un nom est préférable à de grandes richesses[a][b] ; la faveur[c] vaut mieux que l’argent et l’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un nom est plus désirable que de grandes richesses ; la faveur vaut mieux que l’argent et l’or. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, le « nom » évoque la réputation ou l’honneur d’une personne.
    reason: cultural_note
  - marker: c
    text: 'Ou : « la grâce ». Le terme hébreu peut désigner la qualité de ce qui est gracieux ou le regard favorable accordé à quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְחָר
  choice: est préférable
  rationale: Le participe nifal a ici une valeur prédicative de préférence. « Est préférable » restitue naturellement la force comparative du proverbe sans réduire l’expression à un simple passif.
- source_word: שֵׁם
  choice: un nom
  rationale: Le terme signifie littéralement « nom » et évoque ici la réputation ou l’honneur attaché à une personne. Garder l’image du nom préserve la formulation hébraïque.
- source_word: מֵעֹשֶׁר רָב
  choice: à de grandes richesses
  rationale: Le מִן comparatif marque la préférence, et עֹשֶׁר רָב désigne une richesse grande ou abondante. Le pluriel « de grandes richesses » est idiomatique et soutenu en français.
- source_word: חֵן
  choice: la faveur
  rationale: Dans le parallélisme avec le nom, le mot désigne vraisemblablement le regard favorable ou l’estime accordée par autrui. « Faveur » conserve aussi l’éventail sémantique du terme sans lui imposer un sens théologique.
- source_word: טוֹב
  choice: vaut mieux
  rationale: Bien que le mot signifie littéralement « bon », la construction elliptique est comparative. « Vaut mieux » rend cette comparaison de manière naturelle.
- source_word: מִכֶּסֶף וּמִזָּהָב
  choice: que l’argent et l’or
  rationale: La seconde expression comparative nomme les métaux précieux comme figures de la richesse. « L’argent et l’or » en est la traduction directe et claire.
theological_decisions: []
