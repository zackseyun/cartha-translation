  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם אֲשֶׁ֖ר עָשׂ֣וּ אֲבוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/028.yaml
  text: Do not move an ancient boundary marker that your fathers made[a][b].
translation:
  language: fr
  text: Ne déplace pas une ancienne borne[a] que tes pères[b] ont posée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne repousse pas une limite ancienne que tes pères ont établie. »'
    reason: lexical_alternative
  - marker: b
    text: « Tes pères » peut désigner plus largement tes ancêtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Ne… pas
  rationale: Avec l’inaccompli, אַל exprime une interdiction. « Ne… pas » en restitue naturellement la force en français moderne.
- source_word: תַּסֵּג
  choice: déplace
  rationale: Dans le contexte d’une limite de propriété, נסג désigne le fait de déplacer ou de repousser une limite hors de sa position légitime. « Déplace » reste clair sans suggérer nécessairement la suppression totale.
- source_word: גְּבוּל
  choice: borne
  rationale: Le nom désigne littéralement une limite ou une frontière. Avec le verbe « déplacer », « borne » exprime naturellement en français l’objet concret qui matérialise une limite de propriété.
- source_word: עוֹלָם
  choice: ancienne
  rationale: Ici, עוֹלָם qualifie une borne établie depuis longtemps, et non quelque chose d’éternel au sens métaphysique. « Ancienne » rend ce sens temporel avec naturel.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif introduit la proposition qui précise l’action des pères sur la borne.
- source_word: עָשׂוּ
  choice: ont posée
  rationale: Bien que עשה signifie couramment « faire », le contexte d’une borne appelle en français le verbe idiomatique « poser ». Cette formulation exprime son établissement matériel sans surinterpréter.
- source_word: אֲבוֹתֶיךָ
  choice: tes pères
  rationale: Le terme hébreu est un masculin pluriel muni d’un suffixe de deuxième personne masculine singulière. « Tes pères » en conserve la forme, tout en laissant la note signaler le sens plus large possible d’ancêtres.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. « Borne » est plus idiomatique que « marqueur de limite » et évoque clairement une limite de propriété. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu.
