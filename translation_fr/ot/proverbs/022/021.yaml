  text: לְ/הוֹדִֽיעֲ/ךָ֗ קֹ֭שְׁטְ אִמְרֵ֣י אֱמֶ֑ת לְ/הָשִׁ֥יב אֲמָרִ֥ים אֱ֝מֶ֗ת לְ/שֹׁלְחֶֽי/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/021.yaml
  text: to make known to you the certainty of words of truth[b][a], so that you may return words of truth to those who sent you.
translation:
  language: fr
  text: pour te faire connaître la fiabilité des paroles de vérité[a], afin que tu répondes par des paroles de vérité à ceux qui t’envoient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vérité des paroles de vérité » ; קֹשְׁט peut aussi signifier « vérité », « justesse » ou « caractère sûr ».
    reason: lexical_alternative
  - marker: b
    text: Litt. « afin que tu rapportes (ou rendes) des paroles de vérité à ceux qui t’envoient ».
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  choice: pour te faire connaître
  rationale: L’infinitif hiphil de ידע avec suffixe de 2e personne du masculin singulier exprime l’idée causative de faire savoir ou connaître.
- source_word: קֹשְׁט
  choice: la fiabilité
  rationale: Le nom peut désigner la vérité, la justesse ou le caractère sûr. « Fiabilité » exprime ici la valeur digne de confiance de l’enseignement tout en le distinguant de אֱמֶת.
- source_word: אִמְרֵי אֱמֶת
  choice: des paroles de vérité
  rationale: Cette formulation conserve la construction nominale hébraïque et son caractère solennel sans être obscure en français.
- source_word: לְהָשִׁיב
  choice: afin que tu rapportes
  rationale: Le hiphil de שוב évoque littéralement le fait de ramener ou rapporter; dans ce contexte, il s’agit de transmettre en retour une réponse. « Rapporter » préserve cette image sans exclure le sens de répondre.
- source_word: אֲמָרִים אֱמֶת
  choice: des paroles vraies
  rationale: Le pluriel אֲמָרִים désigne des propos, et אֱמֶת en précise la véracité ou la fiabilité. La formulation française est naturelle et évite une répétition pesante de « paroles de vérité ».
- source_word: לְשֹׁלְחֶיךָ
  choice: à ceux qui t’envoient
  rationale: Le participe qal pluriel avec suffixe désigne littéralement « ceux qui t’envoient ». Le présent français respecte la forme participiale sans imposer un envoi uniquement passé.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image du retour portée par לְהָשִׁיב, tandis qu’une note signale le sens contextuel possible de « répondre ».
