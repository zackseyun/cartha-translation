- from: pour te faire connaître la fiabilité des paroles de vérité[a], afin que tu rapportes des paroles vraies à ceux qui t’envoient[b].
  to: pour te faire connaître la fiabilité des paroles de vérité[a], afin que tu répondes par des paroles de vérité à ceux qui t’envoient[b].
  rationale: La révision adopte dans le texte principal le sens contextuel, naturel en français, de « répondre » pour לְהָשִׁיב, tout en conservant en note l’image plus littérale du retour. Elle rétablit également l’écho formel de « paroles de vérité » dans les deux propositions.
