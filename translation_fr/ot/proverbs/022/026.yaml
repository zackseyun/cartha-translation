source:
  edition: WLC
  text: אַל תְּהִ֥י בְ/תֹֽקְעֵי כָ֑ף בַּ֝/עֹרְבִ֗ים מַשָּׁאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/026.yaml
  text: Do not be among those who strike hands[a], among those who become surety for debts.
translation:
  language: fr
  text: Ne sois pas de ceux qui frappent dans la main[a], de ceux qui se portent garants de dettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui frappent dans la main en signe d’engagement »; ce geste servait à conclure un accord ou à donner une garantie.
    reason: Précision de l’idiome hébreu et de sa portée juridique.
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Ne sois pas
  rationale: La particule de défense אַל suivie de l’imparfait de היה formule ici une interdiction ou une exhortation négative directe.
- source_word: בְתֹקְעֵי כָף
  choice: de ceux qui frappent dans la main
  rationale: Le participe de תקע avec כף décrit littéralement le geste de frapper la paume ou la main, geste qui scelle un engagement. La formulation française conserve l’image concrète et la note en précise la portée.
- source_word: בַּעֹרְבִים
  choice: de ceux qui se portent garants
  rationale: Le participe de ערב désigne ceux qui s’engagent comme cautions ou garants pour autrui. « Se porter garant » est naturel, précis et actuel en français.
- source_word: מַשָּׁאוֹת
  choice: dettes
  rationale: Dans ce contexte financier, le terme désigne les obligations pécuniaires pour lesquelles quelqu’un fournit une garantie; « dettes » l’exprime clairement sans limiter indûment le sens à un type précis de prêt.
