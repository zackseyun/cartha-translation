id: PRO.22.7
reference: Proverbs 22:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָ֭שִׁיר בְּ/רָשִׁ֣ים יִמְשׁ֑וֹל וְ/עֶ֥בֶד לֹ֝וֶ֗ה לְ/אִ֣ישׁ מַלְוֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/007.yaml
  text: The rich rules over the poor[a], and the borrower is a servant to the lender.
translation:
  language: fr
  text: Le riche domine les pauvres, et celui qui emprunte est l’esclave[a] de celui qui prête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : le serviteur.'
    reason: עֶבֶד peut signifier « esclave » ou « serviteur » ; le contexte souligne dans les deux cas une forte dépendance envers le prêteur.
lexical_decisions:
- source_word: עָשִׁיר
  choice: le riche
  rationale: Adjectif substantivé désignant de manière générale une personne riche ; le singulier générique convient au style proverbial français.
- source_word: בְּרָשִׁים
  choice: les pauvres
  rationale: Avec מָשַׁל, la préposition בְּ introduit ici les personnes sur lesquelles s’exerce la domination.
- source_word: יִמְשׁוֹל
  choice: domine
  rationale: Dans une maxime, l’imparfait hébreu exprime une réalité générale plutôt qu’un futur. « Domine » restitue naturellement le rapport de pouvoir.
- source_word: וְעֶבֶד
  choice: est l’esclave
  rationale: Le nom עֶבֶד peut désigner un esclave ou un serviteur. « Esclave » conserve ici la force de l’image de dépendance créée par l’endettement ; le verbe « est » est ajouté conformément à la syntaxe française.
- source_word: לֹוֶה
  choice: celui qui emprunte
  rationale: Le participe qal substantivé désigne la personne qui emprunte. Cette formulation courante évite la nuance plus technique de « débiteur ».
- source_word: לְאִישׁ מַלְוֶה
  choice: de celui qui prête
  rationale: Littéralement « d’un homme qui prête ». Le français générique « celui qui prête » préserve le parallèle verbal avec « celui qui emprunte » sans alourdir la maxime.
theological_decisions: []
translation_notes:
  register: Formulation concise et proverbiale, en français moderne et digne. Le présent exprime une observation générale, sans transformer la maxime en commandement ni en promesse absolue.
