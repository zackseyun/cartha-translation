id: PRO.22.23
reference: Proverbs 22:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יָרִ֣יב רִיבָ֑/ם וְ/קָבַ֖ע אֶת קֹבְעֵי/הֶ֣ם נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/023.yaml
  text: For Yahweh will plead their case and rob of life those who rob them[a].
translation:
  language: fr
  text: 'Car Yahvé défendra leur cause

    et ôtera la vie à ceux qui les dépouillent.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car Yahvé prendra leur défense et dépouillera de la vie ceux qui les dépouillent. »'
    reason: Cette variante conserve plus explicitement la répétition de la racine hébraïque קבע, au prix d’une expression française moins naturelle.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’interdiction du verset précédent et conserve clairement la valeur causale.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin plutôt que de lui substituer un titre.
- source_word: יָרִיב רִיבָם
  choice: défendra leur cause
  rationale: Le verbe et le nom apparentés relèvent ici du domaine judiciaire. Cette expression française naturelle présente Yahvé comme celui qui prend en charge la cause des personnes lésées.
- source_word: וְקָבַע
  choice: et ôtera la vie
  rationale: קבע évoque le fait de dépouiller ou de saisir. Avec נָפֶשׁ, le sens contextuel est la privation de la vie; cette formulation reste claire sans imposer la notion d’une âme immatérielle.
- source_word: קֹבְעֵיהֶם
  choice: à ceux qui les dépouillent
  rationale: Reprend le sens de קבע et exprime la justice rétributive du vers; le français ne permet pas de conserver élégamment toute la répétition de la racine hébraïque.
- source_word: נָפֶשׁ
  choice: la vie
  rationale: Dans ce contexte, נָפֶשׁ désigne la vie de la personne plutôt qu’une composante immatérielle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le choix préserve le nom personnel présent dans le texte hébreu, selon sa forme française courante, sans le remplacer par un titre.
- issue: Portée de נָפֶשׁ dans la sanction divine
  choice: la vie
  alternative: l’âme
  rationale: Le contexte décrit une rétribution qui prive les spoliateurs de leur vie; « âme » risquerait d’introduire ici une distinction anthropologique absente du propos.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Défendra leur cause » maintient la métaphore judiciaire; « ôtera la vie » exprime naturellement la rétribution tout en laissant la note signaler le jeu de mots hébreu.
