  text: lest you learn his ways and take a snare for yourself[a][b].
translation:
  language: fr
  text: De peur que tu n’apprennes sa manière d’agir[a] et que tu ne tombes toi-même dans un piège[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son chemin » ou « sa conduite ». Le singulier hébreu peut désigner la manière habituelle d’agir d’une personne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que tu prennes un piège pour ta vie ». Le mot hébreu traduit ici par « toi-même » peut aussi désigner la vie, la personne elle-même ou l’âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Introduit naturellement en français une conséquence redoutée et conserve la force préventive de l’avertissement proverbial.
- source_word: תֶּאֱלַף
  choice: tu n’apprennes
  rationale: Le verbe peut signifier apprendre ou s’accoutumer. « Apprendre » reste proche de l’hébreu tout en exprimant l’influence produite par la fréquentation.
- source_word: אָרְחֹתוֹ
  choice: ses manières d’agir
  rationale: Le singulier hébreu désigne ici la conduite habituelle d’une personne. Cette formulation est naturelle en français moderne sans effacer la valeur comportementale du terme.
- source_word: וְלָקַחְתָּ
  choice: tu ne tendes
  rationale: 'Littéralement « tu ne prennes ». Avec « piège », le français idiomatique demande une légère explicitation de l’image : le piège finit par être tendu contre soi-même.'
- source_word: מוֹקֵשׁ
  choice: un piège
  rationale: Rend directement la métaphore d’un dispositif qui capture et évoque le danger moral ou personnel.
- source_word: לְנַפְשֶׁךָ
  choice: à ta propre vie
  rationale: נֶפֶשׁ peut désigner la vie, la personne elle-même ou l’âme. « Ta propre vie » conserve ici l’enjeu personnel sans imposer une anthropologie technique.
