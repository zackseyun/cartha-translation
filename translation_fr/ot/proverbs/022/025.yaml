review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement פֶּן et תֶּאֱלַף. En revanche, « tu ne tendes un piège » traduit « poser/tendre un piège », alors que וְלָקַחְתָּ signifie « prendre » et décrit le fait de s’exposer à un piège ou de le subir. La révision exprime ce résultat sans faire de la personne celle qui tend le piège.
  naturalness: « Sa manière d’agir » est plus idiomatique et plus resserré que « ses manières d’agir » pour la conduite habituelle d’une personne. « Tomber toi-même dans un piège » est naturel en français moderne et conserve l’image proverbiale.
  terminology: « Piège » convient pour מוֹקֵשׁ. « Toi-même » rend ici de façon naturelle la portée personnelle de לְנַפְשֶׁךָ, sans imposer le sens technique d’« âme » ni employer l’expression moins naturelle « pour ta vie ».
  issues:
