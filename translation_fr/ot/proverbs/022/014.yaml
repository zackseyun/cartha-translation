  verdict: revise
  source_fidelity: Le texte rend fidèlement l’image de שׁוּחָה עֲמֻקָּה (« fosse profonde »), la métaphore de « la bouche », l’indignation de Yahvé et la conséquence exprimée par l’imparfait (« y tombera »). Toutefois, « femmes interdites » n’est pas une désignation française idiomatique et donne l’impression d’une interdiction explicite plutôt que de conserver la catégorie hébraïque, volontairement large, de זָרוֹת.
  naturalness: « La bouche des femmes interdites » est peu naturel en français moderne. « La bouche des femmes étrangères » est une expression française claire, traditionnelle dans ce contexte, et la note permet d’éviter de réduire indûment le sens à l’origine ethnique.
  terminology: « Yahvé » convient comme rendu français usuel du tétragramme. « Fosse profonde », « colère » et « y tombera » sont justes et de registre proverbial sobre. La note doit présenter « femmes d’autrui » comme une autre possibilité sans transformer le sens principal en interprétation sexuelle exclusive.
