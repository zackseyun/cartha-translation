  text: שׁוּחָ֣ה עֲ֭מֻקָּה פִּ֣י זָר֑וֹת זְע֥וּם יְ֝הוָ֗ה יפול שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/014.yaml
  text: The mouth of forbidden women is a deep pit[a]; he who is under Yahweh’s wrath will fall there.
translation:
  language: fr
  text: La bouche des femmes étrangères est une fosse profonde[a] ; celui qui est sous la colère de Yahvé y tombera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des femmes d’autrui », « des femmes étrangères à la communauté » ou « des femmes adultères ». Dans les Proverbes, le terme hébreu désigne souvent des femmes situées hors des limites sexuelles légitimes, sans se limiter nécessairement à leur origine ethnique.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה
  choice: fosse
  rationale: Le nom désigne une cavité ou un trou profond. « Fosse » conserve naturellement l’image concrète du danger et du piège.
- source_word: עֲמֻקָּה
  choice: profonde
  rationale: L’adjectif qualifie directement la fosse et préserve sans surinterprétation l’image hébraïque.
- source_word: פִּי
  choice: bouche
  rationale: Traduction littérale qui maintient la métaphore hébraïque tout en laissant entendre la parole séductrice.
- source_word: זָרוֹת
  choice: femmes interdites
  rationale: Dans les Proverbes, le terme désigne couramment des femmes situées hors des limites sexuelles légitimes, sans nécessairement mettre l’accent sur leur origine étrangère.
- source_word: זְעוּם
  choice: est sous la colère de
  rationale: Le participe passif présente la personne comme l’objet de l’indignation divine ; cette formulation est claire et idiomatique en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend directement le nom divin plutôt que de lui substituer un titre.
- source_word: יפול
  choice: tombera
  rationale: L’imparfait hébreu exprime ici le résultat général annoncé par le proverbe.
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial renvoie naturellement en français à la fosse métaphorique et traduit avec concision « là ».
theological_decisions:
- issue: Sens de זָרוֹת dans le contexte sapientiel des Proverbes
  choice: femmes interdites
  alternative: femmes étrangères, femmes d’autrui ou femmes adultères
  rationale: Le choix conserve la catégorie morale et sexuelle assez large du contexte sans la réduire à l’ethnicité ni au seul adultère.
- issue: Force de זְעוּם יְהוָה
  choice: celui qui est sous la colère de Yahvé
  alternative: celui que Yahvé maudit, réprouve ou déteste
  rationale: Cette traduction exprime l’état de celui qui subit l’indignation divine sans imposer une nuance plus étroite que le participe hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme et la métaphore concrète de la fosse sont conservés ; le point-virgule marque les deux membres du verset.
