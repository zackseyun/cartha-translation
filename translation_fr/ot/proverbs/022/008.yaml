source:
  edition: WLC
  text: זוֹרֵ֣עַ עַ֭וְלָה יקצור אָ֑וֶן וְ/שֵׁ֖בֶט עֶבְרָת֣/וֹ יִכְלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
translation:
  language: fr
  text: Qui sème l’injustice récoltera le malheur[a], et le bâton de sa fureur prendra fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la détresse », « le désastre » ou « la peine ». Le mot hébreu peut désigner une conséquence funeste ou la souffrance qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Ou « disparaîtra ». Littéralement, « prendra fin ». L’expression peut évoquer la disparition du pouvoir violent de celui qui commet l’injustice.
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  choice: Qui sème
  rationale: Le participe qal masculin singulier a ici une portée générale. « Qui sème » rend naturellement la maxime tout en conservant l’image agricole.
- source_word: עַוְלָה
  choice: l’injustice
  rationale: Le nom désigne l’injustice ou le tort moral. « Injustice » est clair, actuel et conserve la portée éthique du proverbe.
- source_word: יקצור
  choice: récoltera
  rationale: L’imparfait exprime la conséquence proverbiale de l’acte initial. « Récoltera » maintient la métaphore des semailles.
- source_word: אָוֶן
  choice: le malheur
  rationale: Le terme peut évoquer le mal, la peine, la détresse ou une conséquence funeste. Ici, « malheur » désigne sans précision excessive ce que produit l’injustice.
- source_word: וְשֵׁבֶט
  choice: et le bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge ou un sceptre. « Bâton » préserve l’image concrète d’un instrument de force sans imposer l’idée de royauté.
- source_word: עֶבְרָתוֹ
  choice: de sa fureur
  rationale: Le nom עֶבְרָה signifie couramment colère ou fureur. « Fureur » exprime ici la violence intense associée au bâton.
- source_word: יִכְלֶה
  choice: disparaîtra
  rationale: כלה signifie être achevé, prendre fin ou s’épuiser. « Disparaîtra » exprime naturellement la cessation du pouvoir violent figuré par le bâton.
theological_decisions:
- issue: Sens de la proposition וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה
  choice: '« le bâton de sa fureur disparaîtra » : l’instrument ou le pouvoir violent de l’auteur de l’injustice prendra fin.'
  alternative: « le bâton de sa colère prendra fin » ou « le bâton de son arrogance disparaîtra »
  rationale: Le texte massorétique pointé soutient le sens « bâton de sa fureur/colère ». La traduction conserve l’image et l’ambiguïté concernant la nature précise du bâton, sans transformer la maxime en affirmation doctrinale plus détaillée.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme agricole est conservé dans « sème/récoltera » ; la seconde image reste concrète et volontairement ouverte.
