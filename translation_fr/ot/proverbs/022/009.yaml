  text: טֽוֹב עַ֭יִן ה֣וּא יְבֹרָ֑ךְ כִּֽי נָתַ֖ן מִ/לַּחְמ֣/וֹ לַ/דָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/009.yaml
  text: He who has a generous eye will be blessed[a], for he gives some of his bread to the poor.
translation:
  language: fr
  text: 'Celui qui est généreux[a] sera béni,

    car il donne de son pain au pauvre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « bon d’œil » ; cette expression hébraïque désigne une personne généreuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב עַיִן
  choice: le regard généreux
  rationale: Littéralement « bon œil », cette expression hébraïque désigne une disposition généreuse. « Regard généreux » conserve l’image tout en rendant l’idée intelligible en français.
- source_word: יְבֹרָךְ
  choice: sera béni
  rationale: La forme verbale est passive. Le futur convient à la portée générale et à la conséquence attendue exprimées par le proverbe, sans préciser qui accorde la bénédiction.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la bénédiction annoncée.
- source_word: נָתַן
  choice: il donne
  rationale: Bien que la forme hébraïque soit un accompli, elle décrit dans ce contexte proverbial une conduite caractéristique; le présent français rend naturellement cette valeur habituelle.
- source_word: מִלַּחְמוֹ
  choice: de son pain
  rationale: 'La préposition מִן a une valeur partitive: la personne partage ce qui provient de sa propre provision. Le mot concret « pain » préserve l’image hébraïque.'
- source_word: לַדָּל
  choice: au pauvre
  rationale: דַּל désigne ici une personne pauvre ou démunie. Le singulier français conserve celui du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La tournure « Celui qui… » explicite sans lourdeur le sujet personnel de l’expression hébraïque, tandis que « regard généreux » en préserve la métaphore.
