  text: חָזִ֡יתָ אִ֤ישׁ מָ֘הִ֤יר בִּ/מְלַאכְתּ֗/וֹ לִֽ/פְנֵֽי מְלָכִ֥ים יִתְיַצָּ֑ב בַּל יִ֝תְיַצֵּב לִ/פְנֵ֥י חֲשֻׁכִּֽים׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
translation:
  language: fr
  text: As-tu vu un homme habile dans son travail[a] ? Il se tiendra devant des rois ; il ne se tiendra pas devant des gens sans importance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prompt dans son travail ». Le terme hébreu peut souligner la rapidité ou l’empressement et, par extension, la compétence.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des gens obscurs », c’est-à-dire sans renom ni position notable.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: As-tu vu
  rationale: Le qatal à la 2e personne du singulier introduit ici une observation proverbiale. Le passé composé est naturel en français et conserve la forme interrogative de l’hébreu.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et présente un homme comme figure représentative du proverbe.
- source_word: מָהִיר
  choice: habile
  rationale: Dans le contexte du travail, l’adjectif évoque la promptitude, l’empressement et, par extension, la compétence. « Habile » exprime clairement cette compétence sans réduire le sens à la seule rapidité.
- source_word: בִּמְלַאכְתּוֹ
  choice: dans son travail
  rationale: Cette formulation générale peut désigner aussi bien un métier qu’une tâche ou une activité, sans limiter le verset au travail manuel.
- source_word: לִפְנֵי מְלָכִים
  choice: devant des rois
  rationale: L’expression conserve l’image hébraïque et suggère l’accès à la cour ou au service de personnages souverains.
- source_word: יִתְיַצָּב
  choice: il se tiendra
  rationale: Le hitpael exprime le fait de prendre place ou de se présenter. « Se tenir devant » garde l’image et la valeur sociale de la scène.
- source_word: בַּל
  choice: ne… pas
  rationale: La négation poétique est rendue directement dans la proposition future, en parallèle avec le premier verbe.
- source_word: חֲשֻׁכִּים
  choice: des gens sans importance
  rationale: Le terme désigne littéralement des personnes « obscures », ici au sens de gens sans renom ni position notable. Une formulation idiomatique évite que « obscurs » soit compris comme moralement sombres ou difficiles à comprendre.
theological_decisions: []
