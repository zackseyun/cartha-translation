id: PRO.22.18
reference: Proverbs 22:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
translation:
  language: fr
  text: Car il est agréable de les garder au fond de toi[a] ; elles seront toutes prêtes sur tes lèvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ton ventre », expression hébraïque qui désigne l’être intérieur.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « elles seront toutes fermement établies sur tes lèvres ». Le verbe peut souligner soit leur ferme établissement, soit leur disponibilité pour être prononcées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Le premier כִּי introduit la raison qui motive l’exhortation précédente ; « Car » en conserve naturellement la valeur explicative.
- source_word: נָעִים
  choice: il est agréable
  rationale: נָעִים exprime ce qui est plaisant ou procure de l’agrément. Cette tournure reste simple et digne en français moderne.
- source_word: כִּי
  choice: de
  rationale: Le second כִּי introduit ici ce en quoi consiste l’expérience agréable. L’infinitif français rend cette relation plus naturellement qu’un calque avec « si », sans exclure la nuance circonstancielle du texte hébreu.
- source_word: תִשְׁמְרֵם
  choice: les garder
  rationale: שׁמר signifie garder, conserver ou préserver ; dans ce contexte, il s’agit de retenir intérieurement les paroles de sagesse.
- source_word: בְּבִטְנֶךָ
  choice: au fond de toi
  rationale: Littéralement « dans ton ventre », expression hébraïque désignant l’intériorité. « Au fond de toi » transmet ce sens sans substituer le terme plus interprétatif « cœur ».
- source_word: יִכֹּנוּ
  choice: elles seront toutes prêtes
  rationale: Le niphal de כון peut exprimer l’établissement ferme ou la disponibilité. « Seront prêtes » convient à l’image de paroles disponibles pour être prononcées, tandis que l’autre nuance est signalée en note.
- source_word: יַחְדָּו
  choice: toutes
  rationale: יַחְדָּו indique que les paroles sont réunies ou prises ensemble. En français, « toutes prêtes » exprime naturellement cette portée collective.
- source_word: עַל שְׂפָתֶיךָ
  choice: sur tes lèvres
  rationale: Cette expression hébraïque évoque des paroles disponibles pour être dites ; son équivalent littéral est également idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme est conservé en deux propositions séparées par un point-virgule ; la formulation évite le calque anatomique tout en l’expliquant en note.
