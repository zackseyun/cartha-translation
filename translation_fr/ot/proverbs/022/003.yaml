source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה ו/יסתר וּ֝/פְתָיִ֗ים עָבְר֥וּ וְֽ/נֶעֱנָֽשׁוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/003.yaml
  text: A prudent man sees danger and hides himself[b][a], but the simple pass on and suffer for it.
translation:
  language: fr
  text: L’homme prudent voit le danger[a] et se met à l’abri, mais les naïfs poursuivent leur chemin et en subissent les conséquences[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mal », « le malheur », « le trouble » ou « la calamité ». Le terme hébreu peut désigner le mal moral aussi bien qu’une calamité ; ici, il évoque une situation menaçante que la personne prudente reconnaît.
    reason: lexical_alternative
  - marker: b
    text: Ou « sont punis ». L’hébreu peut souligner une sanction, mais aussi le fait de subir les conséquences de leur conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: l’homme prudent
  rationale: Dans les Proverbes, le terme désigne généralement une personne avisée, capable d’anticiper, plutôt qu’une personne rusée au sens négatif. Le masculin singulier de l’hébreu est conservé dans cette maxime à portée générale.
- source_word: רָאָה
  choice: voit
  rationale: Le parfait hébreu exprime ici une vérité générale; le présent convient naturellement en français et garde l’image concrète de la perception.
- source_word: רָעָה
  choice: le danger
  rationale: Le nom peut désigner le mal, le malheur ou une calamité. Dans ce contexte, il évoque une menace que la personne prudente aperçoit et évite.
- source_word: ו/יסתר
  choice: se met à l’abri
  rationale: La forme verbale exprime le fait de se cacher ou de se retirer pour se protéger. Cette formulation française naturelle conserve l’idée d’une réaction protectrice.
- source_word: פְתָיִם
  choice: les naïfs
  rationale: Terme caractéristique de la littérature de sagesse pour les personnes inexpérimentées et dépourvues de discernement. « Les naïfs » est clair en français moderne sans suggérer une déficience intellectuelle.
- source_word: עָבְרוּ
  choice: poursuivent leur chemin
  rationale: Le verbe indique qu’ils continuent d’avancer au lieu d’éviter la menace. Cette expression explicite naturellement le mouvement sous-entendu.
- source_word: וְנֶעֱנָשׁוּ
  choice: en subissent les conséquences
  rationale: Le verbe peut signifier être puni ou subir une peine. La traduction retenue garde ouverte la question de savoir s’il s’agit d’un châtiment ou des conséquences funestes de leur conduite.
theological_decisions:
- issue: Nature de la conséquence subie par les naïfs
  choice: en subissent les conséquences
  alternative: sont punis
  rationale: L’hébreu peut évoquer une sanction, mais le contexte sapientiel permet aussi de comprendre les effets naturels de l’imprudence. La formulation choisie ne tranche pas indûment entre ces nuances.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique est conservé, ainsi que le singulier proverbial du premier membre et le pluriel du second.
