id: PRO.2.8
reference: Proverbs 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ֭/נְצֹר אָרְח֣וֹת מִשְׁפָּ֑ט וְ/דֶ֖רֶךְ חסיד/ו יִשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/008.yaml
  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: fr
  text: pour protéger les sentiers de la justice ; il veille sur le chemin de ses fidèles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture d’après la forme consonantique : « son fidèle » ou « celui qui lui est loyal ». Le mot hébreu désigne une personne caractérisée par sa fidélité, sa loyauté ou sa piété.'
    reason: Variante textuelle et nuance lexicale de חסיד/ו.
lexical_decisions:
- source_word: לִנְצֹר
  choice: pour protéger
  rationale: L’infinitif précédé de ל exprime ici le but ou le résultat dans la continuité du verset précédent. « Protéger » conserve l’idée de garde sans imposer une tournure archaïque.
- source_word: אָרְחוֹת
  choice: les sentiers
  rationale: Le pluriel désigne des chemins ou des voies. « Sentiers » est naturel dans le langage sapientiel et maintient la variation avec דֶרֶךְ.
- source_word: מִשְׁפָּט
  choice: de la justice
  rationale: Dans ce contexte éthique, le terme renvoie à ce qui est juste et à l’exercice de la justice, plutôt qu’à un verdict particulier.
- source_word: וְדֶרֶךְ
  choice: le chemin
  rationale: « Chemin » rend naturellement דֶרֶךְ et préserve la variation entre le pluriel « sentiers » et le singulier hébreu.
- source_word: חסיד/ו
  choice: de ses fidèles
  rationale: « Fidèles » exprime la loyauté et la piété associées à חָסִיד sans recourir au terme ecclésiastique potentiellement technique « saints ». Le pluriel suit la lecture traditionnelle généralement reçue, tandis que la forme consonantique singulière est signalée en note.
- source_word: יִשְׁמֹר
  choice: il veille sur
  rationale: Le verbe exprime la garde et la protection. « Veille sur » évite de répéter « protéger » tout en rendant explicite le soin protecteur ; le sujet implicite est Dieu d’après le contexte.
theological_decisions:
- issue: Référent du sujet implicite de יִשְׁמֹר
  choice: « il », renvoyant à Dieu
  alternative: Un sujet indéfini ou générique
  rationale: Dans Proverbes 2.6-8, le SEIGNEUR est l’acteur qui donne la sagesse et protège les hommes droits ; le sujet implicite continue naturellement cette description.
- issue: Nombre et portée de חסיד/ו
  choice: « ses fidèles »
  alternative: « son fidèle » ou « celui qui lui est loyal »
  rationale: La lecture traditionnelle comprise comme plurielle convient au parallélisme collectif du contexte. La forme consonantique transmise peut toutefois être comprise au singulier ; cette tension textuelle est conservée dans la note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule préserve le passage de l’infinitif dépendant du contexte précédent au verbe personnel de la seconde proposition, sans lisser entièrement la syntaxe hébraïque.
