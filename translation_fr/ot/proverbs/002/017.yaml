source:
  edition: WLC
  text: הַ֭/עֹזֶבֶת אַלּ֣וּף נְעוּרֶ֑י/הָ וְ/אֶת בְּרִ֖ית אֱלֹהֶ֣י/הָ שָׁכֵֽחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/017.yaml
  text: who abandons the companion of her youth and forgets the covenant of her God[a][b].
translation:
  language: fr
  text: 'elle qui abandonne le compagnon de sa jeunesse[a]

    et oublie l’alliance de son Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mari de sa jeunesse ». Le mot hébreu peut désigner un compagnon intime et renvoie probablement ici à son conjoint.
    reason: lexical_alternative
  - marker: b
    text: « L’alliance de son Dieu » désigne probablement l’alliance conjugale conclue sous l’autorité ou le regard de Dieu, mais l’expression peut aussi évoquer plus largement ses obligations d’alliance envers Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: elle qui abandonne
  rationale: Le participe qal féminin singulier caractérise la femme évoquée au verset précédent. « Abandonne » exprime une rupture volontaire et convient au registre proverbial.
- source_word: אַלּוּף
  choice: le compagnon
  rationale: Le terme désigne un proche ou compagnon intime. Dans ce contexte, il renvoie probablement au mari, mais « compagnon » préserve l’étendue lexicale de l’hébreu sans expliciter plus que le texte.
- source_word: נְעוּרֶיהָ
  choice: de sa jeunesse
  rationale: Cette expression française naturelle conserve l’idée d’un lien noué durant la jeunesse.
- source_word: בְּרִית
  choice: l’alliance
  rationale: « Alliance » garde la portée relationnelle, solennelle et théologique du terme hébreu.
- source_word: אֱלֹהֶיהָ
  choice: de son Dieu
  rationale: Le possessif féminin est explicite en hébreu et souligne la responsabilité personnelle de la femme envers Dieu.
- source_word: שָׁכֵחָה
  choice: oublie
  rationale: Bien que la forme hébraïque soit un parfait, le présent convient à la caractérisation générale du discours proverbial. Ici, oublier implique négliger ou mépriser un engagement, non une simple défaillance de mémoire.
theological_decisions:
- issue: Portée de בְּרִית אֱלֹהֶיהָ
  choice: « l’alliance de son Dieu », avec une probable allusion à l’alliance conjugale placée sous l’autorité ou le témoignage de Dieu
  alternative: « son alliance conjugale devant Dieu » ou, plus largement, l’alliance et les obligations envers Dieu
  rationale: Le parallélisme avec « le compagnon de sa jeunesse » oriente fortement vers le mariage. Toutefois, l’hébreu dit littéralement « l’alliance de son Dieu » ; la formulation retenue conserve donc la possible portée plus large du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé sur deux lignes. « Compagnon » maintient l’ambiguïté lexicale, tandis que les notes indiquent le sens conjugal probable sans l’imposer dans le texte principal.
