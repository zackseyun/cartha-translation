id: PRO.2.20
reference: Proverbs 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: fr
  text: afin que tu marches sur la voie des gens de bien[a] et que tu restes sur les sentiers des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des bons ». L’adjectif hébreu masculin pluriel est employé comme nom pour désigner une catégorie de personnes.
    reason: lexical_alternative
  - marker: b
    text: Ou « que tu gardes les sentiers des justes ». Le verbe hébreu peut signifier « garder », « veiller sur » ou « observer » ; ici, il évoque probablement le fait de demeurer sur ces sentiers et d’y conformer sa conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat de l’enseignement précédent, tout en conservant la force finale de l’hébreu.
- source_word: תֵּלֵךְ
  choice: tu marches
  rationale: L’imparfait qal 2ms de הלך, après לְמַעַן, exprime ici le but ou le résultat visé. Le présent du subjonctif après « afin que » est naturel en français.
- source_word: בְּדֶרֶךְ
  choice: sur la voie
  rationale: דֶּרֶךְ désigne une route et, au sens figuré, une manière de vivre. « Sur la voie » maintient cette image et convient naturellement avec « marcher ».
- source_word: טוֹבִים
  choice: des gens de bien
  rationale: Adjectif masculin pluriel substantivé désignant une catégorie de personnes. « Les gens de bien » rend clairement le sens moral sans limiter explicitement le groupe aux hommes.
- source_word: וְאָרְחוֹת
  choice: et ... les sentiers
  rationale: Le pluriel de אֹרַח évoque des chemins ou pistes, souvent au figuré. « Sentiers » préserve le parallélisme poétique tout en distinguant le terme de « voie ».
- source_word: צַדִּיקִים
  choice: des justes
  rationale: Adjectif pluriel substantivé désignant ceux qui vivent avec droiture. « Les justes » est une formulation française courante et digne dans ce contexte sapientiel.
- source_word: תִּשְׁמֹר
  choice: tu restes sur
  rationale: שׁמר peut signifier garder, observer ou veiller sur. Avec « sentiers » comme complément, « rester sur » exprime naturellement l’idée de s’y tenir, sans effacer les autres possibilités lexicales signalées en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu. Le parallélisme entre « voie » et « sentiers » ainsi que la métaphore de la conduite comme marche sont conservés.
