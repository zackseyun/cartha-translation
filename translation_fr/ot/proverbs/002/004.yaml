  text: אִם תְּבַקְשֶׁ֥/נָּה כַ/כָּ֑סֶף וְֽ/כַ/מַּטְמוֹנִ֥ים תַּחְפְּשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/004.yaml
  text: if you seek it like silver and search for it like hidden treasures[b][a],
translation:
  language: fr
  text: 'si tu la recherches comme l’argent,

    et tu la cherches comme des trésors cachés[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des trésors enfouis ». Le terme hébreu désigne des biens précieux dissimulés, notamment dans le sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit la condition qui se poursuit depuis les versets précédents; « si » en conserve directement la valeur conditionnelle.
- source_word: תְּבַקְשֶׁנָּה
  choice: tu la recherches
  rationale: Le suffixe féminin singulier renvoie à la sagesse ou à l’intelligence mentionnée dans le contexte. Le pronom féminin « la » est naturel en français et préserve ce renvoi.
- source_word: כַכָּסֶף
  choice: comme l’argent
  rationale: Le כ comparatif établit une comparaison avec l’argent, métal précieux recherché avec soin.
- source_word: וְכַמַּטְמוֹנִים
  choice: comme des trésors cachés
  rationale: מַטְמוֹנִים désigne des biens précieux dissimulés ou enfouis. « Trésors cachés » conserve à la fois l’idée de valeur et celle de dissimulation.
- source_word: תַּחְפְּשֶׂנָּה
  choice: tu la cherches
  rationale: Le verbe חפשׂ exprime une recherche attentive. « Chercher » est idiomatique et forme un parallélisme naturel avec « rechercher ».
theological_decisions:
- issue: Référent du suffixe féminin singulier
  choice: Le rendre par « la », sans préciser davantage son antécédent dans ce verset.
  alternative: Répéter « la sagesse » ou « l’intelligence ».
  rationale: L’hébreu renvoie anaphoriquement au contexte antérieur et peut laisser jouer la proximité entre sagesse et intelligence; expliciter l’une des deux réduirait cette souplesse.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu est conservé en deux lignes; le féminin du pronom maintient le renvoi contextuel sans imposer un antécédent unique.
