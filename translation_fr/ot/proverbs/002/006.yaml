  text: כִּֽי יְ֭הוָה יִתֵּ֣ן חָכְמָ֑ה מִ֝/פִּ֗י/ו דַּ֣עַת וּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: fr
  text: Car[a] Yahweh donne la sagesse ; de sa bouche[b] viennent la connaissance et l’intelligence[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parce que Yahweh donne la sagesse. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de sa bouche » ; l’image présente la parole de Yahweh comme la source de la connaissance et de l’intelligence.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le discernement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de l’exhortation précédente. « Car » exprime naturellement ce rapport explicatif en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie le nom divin personnel ; sa translittération le distingue d’un titre comme « le Seigneur ».
- source_word: יִתֵּן
  choice: donne
  rationale: L’imparfait hébreu énonce ici une vérité générale propre au style proverbial ; le présent français en rend clairement la valeur.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: C’est le terme central du livre des Proverbes et son équivalent français usuel.
- source_word: מִפִּיו
  choice: de sa bouche viennent
  rationale: La formulation conserve l’image concrète de la bouche de Yahweh comme origine de la connaissance et de l’intelligence, tout en ajoutant le verbe requis par le français.
- source_word: דַּעַת
  choice: la connaissance
  rationale: Équivalent direct et naturel dans le vocabulaire sapientiel.
- source_word: וּתְבוּנָה
  choice: et l’intelligence
  rationale: « Intelligence » désigne ici la faculté de comprendre et forme un couple naturel avec « connaissance » ; « discernement » reste possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel, non un simple titre. « Yahweh » préserve cette distinction sans substituer la lecture traditionnelle « le Seigneur ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du parallélisme hébreu, et l’image de la bouche est conservée plutôt qu’explicitée dans le corps du verset.
