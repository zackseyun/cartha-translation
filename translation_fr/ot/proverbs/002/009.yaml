  source_fidelity: 'Le verset énumère quatre réalités que le destinataire viendra à comprendre : צֶדֶק, מִשְׁפָּט, מֵישָׁרִים et « toute bonne voie ». « La justice » et « le droit » permettent de conserver la distinction entre les deux premiers termes. Pour מֵישָׁרִים, « la droiture » rend plus directement l’idée hébraïque de rectitude/ce qui est droit; « l’équité » reste une possibilité valable en note. La coordination explicite avant le dernier membre rend la série recevable en français sans modifier son extension.'
