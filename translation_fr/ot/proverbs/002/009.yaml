source:
  edition: WLC
  text: אָ֗ז תָּ֭בִין צֶ֣דֶק וּ/מִשְׁפָּ֑ט וּ֝/מֵישָׁרִ֗ים כָּל מַעְגַּל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/009.yaml
  text: Then you will understand righteousness and justice and equity[a], every good path.
translation:
  language: fr
  text: Alors tu comprendras la justice, le droit, la droiture et toute bonne voie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’équité ». Le mot hébreu מֵישָׁרִים évoque ce qui est droit, rectiligne ou moralement intègre.
    reason: Alternative lexicale
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel et logique qui relie ce résultat aux conditions énoncées auparavant.
- source_word: תָּבִין
  choice: tu comprendras
  rationale: Le verbe בין au qal exprime ici l’accès à la compréhension ou au discernement; « comprendre » est clair et naturel dans ce contexte sapientiel.
- source_word: צֶדֶק
  choice: ce qui est juste
  rationale: Cette formulation exprime la rectitude morale de צֶדֶק tout en évitant de confondre le terme avec מִשְׁפָּט, rendu ici par « le droit ».
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Le mot peut désigner le jugement, la justice ou l’ordre juste; « le droit » convient à la série éthique et distingue ce terme du précédent.
- source_word: מֵישָׁרִים
  choice: l’équité
  rationale: Le pluriel évoque ce qui est droit, égal ou moralement rectiligne; « équité » rend bien sa portée éthique, tandis que « droiture » demeure une autre traduction possible.
- source_word: כָּל
  choice: toute
  rationale: Avec le nom singulier qui suit, le sens distributif « toute » est naturel.
- source_word: מַעְגַּל
  choice: voie
  rationale: Le terme désigne une piste ou un sentier et s’emploie métaphoriquement pour la conduite humaine; « voie » conserve cette image familière au livre des Proverbes.
- source_word: טוֹב
  choice: bonne
  rationale: L’adjectif garde volontairement l’ampleur morale et pratique du terme hébreu sans en réduire le sens.
theological_decisions:
- issue: Rapport de כָּל מַעְגַּל טוֹב avec les trois notions précédentes
  choice: 'Conserver la juxtaposition par une virgule : « ce qui est juste, le droit et l’équité, toute bonne voie »'
  alternative: Marquer explicitement l’apposition par un deux-points ou un tiret, ou ajouter « et » devant « toute bonne voie »
  rationale: L’hébreu ne place pas de conjonction avant la dernière expression. La juxtaposition préserve l’ambiguïté entre une récapitulation des trois notions et un dernier complément du verbe.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement suit l’adresse personnelle du contexte sapientiel. La syntaxe conserve la série dense et la légère ambiguïté de la dernière expression hébraïque.
