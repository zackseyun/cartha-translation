  terminology: « Justice », « droit » et « droiture » constituent une triade éthique claire, sans imposer une interprétation confessionnelle. « Voie » conserve l’image sapientielle de מַעְגַּל. Le tutoiement convient au cadre d’adresse personnelle du passage.
