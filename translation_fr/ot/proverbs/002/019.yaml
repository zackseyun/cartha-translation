  text: כָּל בָּ֭אֶי/הָ לֹ֣א יְשׁוּב֑וּ/ן וְ/לֹֽא יַ֝שִּׂ֗יגוּ אָרְח֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/019.yaml
  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: fr
  text: 'Tous ceux qui entrent chez elle ne reviennent pas,

    et n’atteignent pas les sentiers de la vie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּאֶיהָ
  choice: Aucun de ceux qui vont vers elle
  rationale: Avec la négation qui suit, la tournure hébraïque signifie de manière distributive qu’aucun de ceux qui entrent auprès d’elle ne revient. « Vont vers elle » reste naturel en français et conserve la référence féminine du contexte.
- source_word: לֹא יְשׁוּבוּן
  choice: ne revient
  rationale: Le verbe שׁוב exprime le retour. Le singulier français s’accorde naturellement avec « aucun » tout en représentant le pluriel hébreu.
- source_word: וְלֹא יַשִּׂיגוּ
  choice: et ils ne retrouvent pas
  rationale: Le hifil de נשׂג signifie atteindre, parvenir à ou rattraper. Dans ce contexte de retour impossible vers les voies de la vie, « retrouver » exprime naturellement l’idée d’y accéder de nouveau, conformément au sens contextuel retenu par la couche de consultation anglaise.
- source_word: אָרְחוֹת חַיִּים
  choice: les sentiers de la vie
  rationale: « Sentiers » rend l’image sapientielle de אֹרַח, tandis que « de la vie » conserve la formulation concise et ouverte de l’hébreu.
theological_decisions:
- issue: Portée absolue de l’affirmation proverbiale
  choice: Conserver la formulation catégorique du verset sans l’atténuer
  alternative: Ajouter une nuance telle que « difficilement » ou « en général »
  rationale: Le texte hébreu formule sans réserve le danger mortel de cette voie. La traduction ne doit ni transformer la maxime en définition métaphysique de l’impossibilité du repentir, ni en affaiblir la force par un ajout absent du texte.
translation_notes:
  register: Français moderne, sobre et sentencieux. Le parallélisme en deux membres est conservé, avec une formulation accessible et digne.
