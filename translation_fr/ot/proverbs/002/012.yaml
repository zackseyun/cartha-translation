id: PRO.2.12
reference: Proverbs 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ֭/הַצִּ֣ילְ/ךָ מִ/דֶּ֣רֶךְ רָ֑ע מֵ֝/אִ֗ישׁ מְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: fr
  text: pour te délivrer de la voie du mal[a], de l’homme qui tient des propos pervers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la mauvaise voie ».'
    reason: La construction דֶּרֶךְ רָע peut se rendre soit par un nom suivi d’un complément moral (« la voie du mal »), soit par un nom qualifié (« la mauvaise voie »).
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: pour te délivrer
  rationale: L’infinitif construit au hiphil de נצל, avec suffixe de deuxième personne masculine singulière, exprime ici le but. « Délivrer » rend naturellement l’idée de soustraire à un danger sans donner au verbe un sens sotériologique plus précis que le contexte.
- source_word: מִדֶּרֶךְ רָע
  choice: de la voie du mal
  rationale: דֶּרֶךְ évoque à la fois un chemin et une conduite morale. « La voie du mal » conserve cette image sapientielle et le caractère éthique de רָע; « la mauvaise voie » reste possible.
- source_word: מֵאִישׁ
  choice: de l’homme
  rationale: אִישׁ est masculin singulier et désigne ici le type représentatif de l’homme malfaisant dont il faut être préservé. La répétition de « de » reproduit la reprise hébraïque.
- source_word: מְדַבֵּר תַּהְפֻּכוֹת
  choice: qui tient des propos pervers
  rationale: Le participe מְדַבֵּר décrit une manière habituelle de parler, tandis que תַּהְפֻּכוֹת désigne des paroles faussées, tortueuses ou perverses. Cette formulation est naturelle en français tout en conservant la portée morale du pluriel hébreu.
theological_decisions:
- issue: Rendu genré de אִישׁ
  choice: de l’homme
  alternative: d’une personne
  rationale: Le texte hébreu emploie explicitement un nom masculin singulier pour représenter un type d’individu. Le rendu retenu préserve cette forme sans lui donner une portée doctrinale supplémentaire.
- issue: Rapport entre la voie mauvaise et l’homme aux propos pervers
  choice: de la voie du mal, de l’homme…
  alternative: du mauvais chemin d’un homme…
  rationale: La répétition de la préposition מִן devant אִישׁ favorise deux compléments parallèles de la délivrance. La ponctuation maintient leur étroite association sans faire du second un simple complément possessif du premier.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Voie » maintient la métaphore morale traditionnelle tout en restant intelligible; « tient des propos pervers » évite le tour moins naturel « parle des perversités ».
