source:
  edition: WLC
  text: כִּֽי תָב֣וֹא חָכְמָ֣ה בְ/לִבֶּ֑/ךָ וְ֝/דַ֗עַת לְֽ/נַפְשְׁ/ךָ֥ יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: fr
  text: Car[a] la sagesse entrera dans ton cœur, et la connaissance sera agréable à ton âme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand la sagesse entrera dans ton cœur. »'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « âme » peut aussi désigner la personne elle-même ou la vie, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Dans ce contexte, כִּי introduit probablement l’explication de ce qui précède. « Car » conserve ce lien logique. Une valeur temporelle, « quand », demeure toutefois possible et est signalée en note.
- source_word: תָבוֹא
  choice: entrera
  rationale: Le verbe בוא signifie « venir » ou « entrer ». Avec « dans ton cœur », « entrera » est naturel et respecte la forme inaccomplie dans ce contexte de promesse ou de conséquence.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: « Sagesse » est l’équivalent français courant de חָכְמָה et maintient le terme central du livre des Proverbes.
- source_word: בְלִבֶּךָ
  choice: dans ton cœur
  rationale: Le cœur désigne ici l’être intérieur, notamment la pensée et la volonté. Conserver « cœur » respecte l’image hébraïque sans la réduire au seul intellect.
- source_word: וְדַעַת
  choice: et la connaissance
  rationale: « Connaissance » rend directement דַּעַת et préserve sa distinction avec les termes hébreux désignant l’intelligence ou le discernement.
- source_word: לְנַפְשְׁךָ
  choice: à ton âme
  rationale: נֶפֶשׁ peut désigner l’âme, la personne elle-même ou la vie. « À ton âme » préserve ici le parallélisme poétique avec « ton cœur » et l’expression anthropologique du texte.
- source_word: יִנְעָם
  choice: sera agréable
  rationale: Le verbe נעם exprime ce qui est plaisant, doux ou agréable. « Sera agréable » conserve sa valeur prédicative sans ajouter l’idée plus interprétative de procurer activement du plaisir.
theological_decisions:
- issue: Anthropologie hébraïque de לֵב et נֶפֶשׁ
  choice: Conserver « cœur » et « âme » dans le texte principal
  alternative: « esprit » et « personne » ou « pensée » et « vie »
  rationale: Ces termes décrivent l’être intérieur selon les catégories poétiques hébraïques. Les conserver maintient la texture littéraire et théologique du verset sans leur imposer une définition doctrinale technique.
- issue: Valeur logique ou temporelle de כִּי
  choice: 'Lecture explicative : « Car »'
  alternative: 'Lecture temporelle : « Quand »'
  rationale: Le contexte permet à כִּי d’expliquer la protection promise dans les versets voisins, mais la lecture temporelle reste grammaticalement possible. La note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse individuelle du texte hébreu. La formulation conserve le parallélisme entre « cœur » et « âme » ainsi que l’ambiguïté de כִּי au moyen d’une note.
