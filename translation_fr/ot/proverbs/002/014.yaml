source:
  edition: WLC
  text: הַ֭/שְּׂמֵחִים לַ/עֲשׂ֥וֹת רָ֑ע יָ֝גִ֗ילוּ בְּֽ/תַהְפֻּכ֥וֹת רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/014.yaml
  text: who rejoice to do evil[a], and exult in the perversities of evil[b],
translation:
  language: fr
  text: 'qui se réjouissent de faire le mal[a]

    et exultent dans les actes pervers[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui prennent plaisir à faire le mal »; littéralement, « qui se réjouissent de faire le mal »
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les perversités du mal » ou « dans les choses perverses du mal »
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: qui se réjouissent
  rationale: Le participe caractérise les personnes évoquées au verset précédent. « Se réjouissent » exprime naturellement leur plaisir face au mal.
- source_word: לַעֲשׂוֹת
  choice: de faire
  rationale: L’infinitif de עשה signifie directement « faire »; cette formulation évite d’ajouter l’idée d’une pratique habituelle ou d’un acte criminel.
- source_word: רָע
  choice: le mal
  rationale: Dans ce contexte sapiential, le terme possède une nette portée morale, mieux conservée par « le mal » que par « le tort » ou « le dommage ».
- source_word: יָגִילוּ
  choice: exultent
  rationale: « Exultent » rend la joie intense exprimée par גיל et distingue ce second verbe du précédent tout en respectant le parallélisme poétique.
- source_word: בְּתַהְפֻּכוֹת
  choice: dans les voies perverses
  rationale: Le nom pluriel désigne ce qui est retourné, dévoyé ou pervers. « Voies perverses » est idiomatique en français et convient au contexte de conduite morale, sans réduire le terme à une seule catégorie d’actes.
- source_word: רָע
  choice: du mal
  rationale: Le dernier רָע qualifie les réalités perverses par leur caractère mauvais. « Du mal » conserve la relation compacte et quelque peu ambiguë de l’hébreu.
theological_decisions:
- issue: Relation entre תַהְפֻּכוֹת et le dernier רָע
  choice: les voies perverses du mal
  alternative: les actes pervers / les perversités mauvaises
  rationale: L’hébreu permet de comprendre le dernier terme comme qualifiant ou déterminant le pluriel précédent. La formulation retenue préserve cette relation sans préciser indûment s’il s’agit de paroles, d’actes ou de comportements.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme est marqué par « se réjouissent » puis « exultent ». Le vers commence par une relative, conformément à son lien syntaxique avec le verset précédent.
