  language: fr
  text: dont les sentiers sont tortueux[a] et qui avancent par des voies détournées,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont les voies sont perverses et qui avancent par des sentiers détournés »; les deux adjectifs hébreux peuvent évoquer une déformation ou un écart, au sens physique comme au sens moral.'
    reason: alternative lexicale préservant le chevauchement sémantique des termes hébreux
lexical_decisions:
- source_word: אֲשֶׁר
  choice: eux dont
  rationale: Le relatif reprend les hommes mentionnés au verset précédent; « eux dont » rend explicite ce lien tout en s’accordant naturellement avec les deux noms pourvus d’un suffixe possessif.
- source_word: אָרְחֹתֵיהֶם
  choice: leurs sentiers
  rationale: Le terme désigne des sentiers ou, métaphoriquement, une manière de vivre. « Sentiers » conserve l’image concrète et morale.
- source_word: עִקְּשִׁים
  choice: tortueux
  rationale: L’adjectif évoque ce qui est tordu, déformé ou moralement pervers. « Tortueux » maintient à la fois l’image du sentier et sa portée éthique.
- source_word: וּנְלוֹזִים
  choice: déviants
  rationale: Le mot exprime l’idée de se détourner ou de dévier. « Déviants » préserve ce mouvement d’écart ainsi que la valeur morale, sans préciser davantage que l’hébreu.
- source_word: בְּמַעְגְּלוֹתָם
  choice: leurs chemins
  rationale: מַעְגָּל peut désigner une piste, un chemin ou une conduite. « Chemins » est naturel en français et maintient le parallélisme avec « sentiers » sans répétition exacte.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. Le fragment conserve sa dépendance syntaxique envers le verset précédent. Le parallélisme hébreu est rendu par « sentiers / chemins » et « tortueux / déviants ».
