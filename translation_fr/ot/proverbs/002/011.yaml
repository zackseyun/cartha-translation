id: PRO.2.11
reference: Proverbs 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מְ֭זִמָּה תִּשְׁמֹ֥ר עָלֶ֗י/ךָ תְּבוּנָ֥ה תִנְצְרֶֽ/כָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/011.yaml
  text: Discretion will watch over you[a]; understanding will guard you.
translation:
  language: fr
  text: La prudence[a] veillera sur toi ; le discernement te gardera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la réflexion » ou « le bon jugement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזִמָּה
  choice: prudence
  rationale: Dans ce contexte sapientiel, le nom désigne la capacité de réfléchir et d’agir avec circonspection. « Prudence » exprime naturellement ce sens positif en français, tandis que « projet » ou « dessein » conviendraient mieux à d’autres contextes.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: veillera sur toi
  rationale: Le verbe שׁמר accompagné de עַל exprime ici une protection attentive ; « veillera sur toi » restitue à la fois la construction et l’image protectrice.
- source_word: תְּבוּנָה
  choice: discernement
  rationale: Ce terme sapientiel désigne l’aptitude à distinguer et à comprendre avec justesse. « Discernement » est précis, courant et se distingue utilement de « prudence » dans le parallélisme.
- source_word: תִנְצְרֶכָּה
  choice: te gardera
  rationale: נצר signifie garder, protéger ou préserver. « Te gardera » conserve la brièveté et le parallélisme du texte hébreu sans confondre les deux verbes.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme hébreu est conservé, avec deux termes sapientiels et deux verbes de protection distincts.
