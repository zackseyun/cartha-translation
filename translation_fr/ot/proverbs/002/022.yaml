id: PRO.2.22
reference: Proverbs 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: fr
  text: Mais les méchants seront retranchés du pays[a], et les traîtres en seront arrachés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Le mot hébreu peut désigner un pays ou la terre; ici, « pays » correspond au contraste avec les hommes droits qui y demeurent au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé désigne collectivement les personnes moralement mauvaises. « Les méchants » est naturel, concis et conserve cette valeur collective.
- source_word: מֵאֶרֶץ
  choice: du pays
  rationale: אֶרֶץ peut désigner le pays ou la terre. Le contexte immédiat, qui oppose ceux qui demeurent dans le pays à ceux qui en sont retranchés, favorise « pays », tout en laissant l’autre sens en note.
- source_word: יִכָּרֵתוּ
  choice: seront retranchés
  rationale: Le nifal de כרת exprime ici l’exclusion ou la suppression forcée. « Seront retranchés » préserve l’image de la coupure et sa portée judiciaire.
- source_word: בוֹגְדִים
  choice: les traîtres
  rationale: Le participe désigne ceux qui agissent avec perfidie ou déloyauté. « Les traîtres » rend clairement et naturellement cette caractérisation habituelle.
- source_word: יִסְּחוּ
  choice: seront arrachés
  rationale: Ce verbe rare exprime un enlèvement énergique. « Seront arrachés » conserve la force de l’action sans imposer plus précisément une image végétale.
- source_word: מִמֶּנָּה
  choice: en
  rationale: Le pronom féminin renvoie à אֶרֶץ. Dans « en seront arrachés », le pronom français reprend naturellement « du pays » et évite une répétition lourde.
- source_word: וּ... וּ
  choice: Mais… et…
  rationale: La première conjonction marque le contraste avec le sort des hommes droits au verset précédent; la seconde coordonne les deux propositions parallèles.
theological_decisions:
- issue: Portée de אֶרֶץ dans le contexte sapientiel
  choice: pays
  alternative: terre
  rationale: Les versets 21-22 opposent ceux qui habitent et restent dans le pays à ceux qui en sont retirés. « Pays » respecte ce contraste immédiat sans transformer le proverbe en affirmation explicitement universelle; l’ambiguïté lexicale est néanmoins signalée.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. Le parallélisme hébreu est conservé par « seront retranchés » / « seront arrachés »; « en » reprend naturellement « du pays ».
