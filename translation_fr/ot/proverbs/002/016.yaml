  text: לְ֭/הַצִּ֣ילְ/ךָ מֵ/אִשָּׁ֣ה זָרָ֑ה מִ֝/נָּכְרִיָּ֗ה אֲמָרֶ֥י/הָ הֶחֱלִֽיקָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/016.yaml
  text: to rescue you from the strange woman[c][b][a], from the foreign woman whose words are smooth.
translation:
  language: fr
  text: pour te délivrer d’une femme étrangère[a], d’une étrangère aux paroles flatteuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les Proverbes, ces termes peuvent aussi désigner une femme extérieure au cadre conjugal légitime, et pas seulement une femme d’origine étrangère.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui rend ses paroles lisses » ; ou « qui flatte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: pour te délivrer
  rationale: L’infinitif construit hiphil avec suffixe de deuxième personne exprime ici le but ou le résultat. « Délivrer » rend naturellement l’idée d’arracher à un danger.
- source_word: מֵאִשָּׁה זָרָה
  choice: de la femme étrangère
  rationale: « Étrangère » conserve le sens premier de זָרָה tout en laissant le contexte sapientiel indiquer qu’il s’agit d’une femme située hors des liens légitimes, sans réduire d’emblée le terme à l’origine ethnique ou à l’adultère.
- source_word: מִנָּכְרִיָּה
  choice: de l’inconnue
  rationale: Le substantif féminin désigne celle qui est étrangère ou extérieure. « L’inconnue » préserve la nuance d’altérité et évite une répétition lourde de « femme étrangère », sans imposer une lecture purement ethnique.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: aux paroles enjôleuses
  rationale: Le hiphil de חלק évoque un discours rendu lisse, donc flatteur ou séducteur. « Enjôleuses » transmet cette métaphore idiomatiquement en français moderne.
theological_decisions:
- issue: Portée morale de זָרָה et נָכְרִיָּה
  choice: Conserver le langage de l’altérité dans le texte et préciser sa portée contextuelle en note.
  alternative: « femme interdite » ou « femme adultère »
  rationale: Le contexte présente une séductrice extérieure aux relations légitimes, mais les termes hébreux ne signifient pas directement « adultère ». La traduction évite donc de résoudre plus précisément que le texte la tension entre étrangeté sociale et transgression sexuelle.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébreu est maintenu par deux désignations successives de la même figure. « Enjôleuses » explicite naturellement l’image des paroles rendues lisses.
