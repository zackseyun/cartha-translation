  source_fidelity: 'Le texte rend fidèlement le parallélisme hébreu : כִּי est bien explicatif (« Car »), « sa maison » conserve בֵּיתָהּ, et « s’enfonce vers la mort » exprime de manière imagée la descente indiquée par שָׁחָה אֶל־מָוֶת. Le second membre maintient avec justesse l’ellipse verbale de l’hébreu : « ses sentiers vers les morts ». « Les morts » est un rendu contextuellement juste de רְפָאִים, sans confusion avec le nom ethnique Rephaïm.'
