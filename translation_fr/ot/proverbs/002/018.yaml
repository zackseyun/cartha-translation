id: PRO.2.18
reference: Proverbs 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה אֶל מָ֣וֶת בֵּיתָ֑/הּ וְ/אֶל רְ֝פָאִ֗ים מַעְגְּלֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: fr
  text: 'Car sa maison s’enfonce vers la mort,

    et ses sentiers vers les morts[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ombres », terme poétique désignant les défunts.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’avertissement du contexte, avec une valeur explicative concise.
- source_word: שָׁחָה
  choice: s’enfonce
  rationale: Rend l’image d’un mouvement vers le bas, en direction de la mort, sans ajouter l’idée explicative de « conduire ».
- source_word: אֶל מָוֶת
  choice: vers la mort
  rationale: Préserve la valeur directionnelle de la préposition אֶל et le caractère progressif de l’image.
- source_word: בֵּיתָהּ
  choice: sa maison
  rationale: Conserve l’image concrète de la maison, tout en laissant possible son sens plus large de maisonnée ou de sphère de vie.
- source_word: רְפָאִים
  choice: les morts
  rationale: Dans ce contexte sapiential et poétique, le mot désigne les défunts associés au séjour des morts, et non le peuple des Rephaïm. « Les morts » est clair en français moderne, tandis que la nuance poétique est signalée en note.
- source_word: מַעְגְּלֹתֶיהָ
  choice: ses sentiers
  rationale: Rend les chemins ou pistes suivis de manière habituelle et maintient le parallélisme poétique sans introduire de verbe absent de l’hébreu.
theological_decisions:
- issue: Sens de רְפָאִים dans le contexte poétique sapiential
  choice: les morts
  alternative: les ombres ; les esprits des défunts
  rationale: Le terme renvoie ici aux habitants du domaine de la mort. La traduction principale évite aussi bien une translittération ethnique trompeuse qu’une description trop précise de l’au-delà, tandis que la note conserve l’expression poétique possible.
translation_notes:
  register: 'Français international moderne, sobre et poétique. Le parallélisme elliptique du second membre est conservé : le verbe « s’enfonce » y est sous-entendu, comme en hébreu.'
