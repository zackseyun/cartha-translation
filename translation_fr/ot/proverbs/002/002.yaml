translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. Les deux gérondifs préservent la dépendance syntaxique envers le verset précédent et le parallélisme poétique, sans ajouter de conjonction absente de l’hébreu.
