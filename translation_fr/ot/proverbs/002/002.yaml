  text: making your ear attentive to wisdom[a], inclining your heart to understanding,
translation:
  language: fr
  text: 'en rendant ton oreille attentive à la sagesse,

    en inclinant ton cœur vers l’intelligence[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le discernement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: en rendant… attentive
  rationale: L’infinitif construit à valeur causative dépend du verset précédent. Cette tournure conserve à la fois ce lien syntaxique et l’idée d’une attention volontaire.
- source_word: לַחָכְמָה
  choice: à la sagesse
  rationale: La préposition ל indique ici ce vers quoi l’oreille se rend attentive; « à la sagesse » est naturel en français et respecte l’image hébraïque.
- source_word: אָזְנֶךָ
  choice: ton oreille
  rationale: Le singulier hébreu avec suffixe de deuxième personne masculine est conservé, car l’image reste idiomatique en français.
- source_word: תַּטֶּה
  choice: en inclinant
  rationale: Le verbe נטה signifie notamment « incliner, tendre, tourner ». « En inclinant » maintient le parallélisme avec le premier membre et l’image d’une orientation volontaire.
- source_word: לִבְּךָ
  choice: ton cœur
  rationale: Dans l’anthropologie hébraïque, le cœur englobe l’intelligence, la volonté et la vie intérieure. « Cœur » préserve cette amplitude mieux que « esprit ».
- source_word: לַתְּבוּנָה
  choice: vers l’intelligence
  rationale: תְּבוּנָה désigne la faculté de comprendre et de discerner. « Intelligence » convient au vocabulaire sapientiel français, tandis que « discernement » demeure une alternative légitime.
