source:
  edition: WLC
  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: fr
  text: Il tient en réserve une sagesse solide[a] pour les personnes droites ; il est un bouclier pour ceux qui marchent dans l’intégrité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jugement sûr », « des ressources » ou « la réussite » ; le terme hébreu peut désigner une sagesse solide et pratique, qui permet d’agir efficacement et conduit au bien-être.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans une intégrité parfaite » ou « de manière irréprochable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: Il réserve
  rationale: Le verbe צפן exprime l’idée de mettre en réserve ou de conserver pour un usage futur. « Réserve » restitue cette image en français naturel.
- source_word: לַיְשָׁרִים
  choice: aux hommes droits
  rationale: יְשָׁרִים désigne ici les personnes moralement droites. « Aux hommes droits » rend clairement l’adjectif substantivé pluriel sans suggérer la rectitude physique.
- source_word: תּוּשִׁיָּה
  choice: une sagesse efficace
  rationale: תּוּשִׁיָּה peut désigner une sagesse solide et pratique, l’ingéniosité ou la réussite qui en découle. « Sagesse efficace » conserve à la fois la dimension sapientielle et son aptitude à produire de bons résultats.
- source_word: מָגֵן
  choice: un bouclier
  rationale: Le nom désigne concrètement un bouclier. La traduction maintient cette métaphore de protection plutôt que de la remplacer par une abstraction.
- source_word: לְהֹלְכֵי
  choice: pour ceux qui marchent
  rationale: Le participe de הלך décrit une manière habituelle de vivre. « Marchent » conserve la métaphore hébraïque de la conduite.
- source_word: תֹם
  choice: avec intégrité
  rationale: תֹם évoque l’intégrité, la plénitude morale ou l’irréprochabilité. « Intégrité » est clair en français moderne et n’implique pas nécessairement une perfection sans péché.
theological_decisions:
- issue: Rapport entre les deux propositions
  choice: Dieu est compris comme le sujet implicite de « il est un bouclier » aussi bien que de « il réserve ».
  alternative: 'On pourrait comprendre elliptiquement : « un bouclier est réservé à ceux qui marchent avec intégrité ».'
  rationale: Le contexte immédiat identifie le SEIGNEUR comme l’auteur de ces bienfaits, et la reprise du même sujet donne en français la lecture la plus naturelle. L’ellipse possible demeure toutefois une question syntaxique, sans modifier l’idée générale de la protection divine.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, ainsi que les images concrètes de la réserve, de la marche et du bouclier. « Sagesse efficace » évite l’expression plus vieillie « sagesse salutaire » tout en préservant l’étendue sémantique de תּוּשִׁיָּה.
