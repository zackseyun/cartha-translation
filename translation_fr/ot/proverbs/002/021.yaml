id: PRO.2.21
reference: Proverbs 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: fr
  text: Car les hommes droits habiteront le pays[a], et les hommes intègres y resteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ». Le mot hébreu אָרֶץ peut désigner soit un pays, soit la terre; « le pays » est retenu ici parce que le contexte souligne le fait de demeurer dans un lieu habité ou d’en être retranché.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison ou l’explication de l’exhortation précédente; « Car » rend naturellement ce lien logique.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Le terme désigne ceux dont la conduite est moralement droite. Cette formulation est claire et évite de confondre ce mot avec un terme plus spécifiquement rendu par « justes ».
- source_word: יִשְׁכְּנוּ
  choice: habiteront
  rationale: Le verbe שׁכן exprime une habitation durable; « habiteront » convient au registre sapiential et reste naturel en français.
- source_word: אָרֶץ
  choice: le pays
  rationale: Le nom peut désigner le pays ou la terre. Dans le contraste avec l’expulsion au verset suivant, « le pays » souligne le lieu habité sans imposer une interprétation territoriale trop étroite.
- source_word: וּתְמִימִים
  choice: et les hommes intègres
  rationale: תמים évoque l’intégrité, la totalité morale ou l’irréprochabilité. « Intègres » exprime clairement ici la qualité éthique visée.
- source_word: יִוָּתְרוּ
  choice: resteront
  rationale: Le niphal de יתר signifie être laissé ou demeurer. « Resteront » rend avec naturel la continuité de leur présence.
- source_word: בָהּ
  choice: y
  rationale: Le pronom renvoie au pays; l’adverbe « y » préserve ce lien de manière concise et idiomatique.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat oppose ceux qui demeurent dans un lieu habitable à ceux qui en sont retranchés. « Le pays » conserve ce sens concret, tandis que « la terre » demeure une lecture lexicalement possible signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé par les deux groupes nominaux et les verbes « habiteront » et « resteront ».
