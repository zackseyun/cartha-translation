  yaml_path: translation/ot/proverbs/002/003.yaml
  text: yes[a], if you call out for understanding and lift up your voice for discernment,
translation:
  language: fr
  text: oui[a], si tu fais appel à l’intelligence et si tu élèves ta voix pour obtenir le discernement,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « oui, si tu fais appel au discernement et si tu élèves ta voix pour obtenir l’intelligence ». Les deux termes hébreux sont très proches par le sens et peuvent aussi être rendus par « compréhension » ou « perspicacité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: oui, si
  rationale: La locution poursuit avec insistance la condition amorcée au verset précédent. « Oui, si » en conserve à la fois la valeur conditionnelle et le renforcement rhétorique.
- source_word: בִּינָה
  choice: intelligence
  rationale: Dans la littérature sapientielle, בִּינָה désigne la faculté de comprendre. « Intelligence » est naturel en français dans ce contexte et permet de le distinguer légèrement du terme voisin.
- source_word: תִקְרָא
  choice: tu appelles
  rationale: Le verbe exprime ici un appel vocal et pressant. « Appeler » conserve simplement cette image sans ajouter une intensité qui n’est pas explicitement marquée par le verbe seul.
- source_word: תְּבוּנָה
  choice: discernement
  rationale: תְּבוּנָה recoupe largement בִּינָה tout en pouvant évoquer l’aptitude à distinguer et à juger avec justesse. « Discernement » maintient cette nuance sans exagérer la différence entre les deux termes.
- source_word: תִּתֵּן קוֹלֶךָ
  choice: tu élèves la voix
  rationale: L’expression hébraïque signifie littéralement « donner sa voix » et décrit un appel prononcé avec force. L’expression française « élever la voix » en rend naturellement l’image et l’intensité.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et sapientiel. Le tutoiement maintient l’adresse personnelle du père au disciple dans le contexte. La ponctuation finale indique que la proposition conditionnelle se poursuit dans les versets suivants.
