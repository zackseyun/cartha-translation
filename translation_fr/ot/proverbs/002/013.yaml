  text: הַ֭/עֹ֣זְבִים אָרְח֣וֹת יֹ֑שֶׁר לָ֝/לֶ֗כֶת בְּ/דַרְכֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/013.yaml
  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: fr
  text: ceux qui abandonnent les sentiers de la droiture[a] pour marcher dans les voies des ténèbres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sentiers de ce qui est droit ».
    reason: Alternative lexicale permettant de rendre יֹשֶׁר de façon moins abstraite tout en conservant son sens moral.
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: eux qui abandonnent
  rationale: Le participe substantivé décrit les personnes évoquées au verset précédent. « Abandonnent » exprime naturellement l’idée d’un délaissement volontaire.
- source_word: אָרְחוֹת
  choice: les sentiers de
  rationale: Le terme désigne métaphoriquement une ligne de conduite. « Sentiers » conserve l’image sapientielle et le parallélisme avec les « voies » du second membre.
- source_word: יֹשֶׁר
  choice: la droiture
  rationale: Dans la littérature de sagesse, le mot désigne la rectitude morale tout en évoquant ce qui est droit. « Droiture » préserve cette portée éthique sans effacer la métaphore du chemin.
- source_word: לָלֶכֶת
  choice: pour marcher
  rationale: L’infinitif exprime ici la conduite habituelle sous l’image de la marche. « Marcher » conserve cette métaphore biblique tout en restant clair en français.
- source_word: בְּדַרְכֵי
  choice: dans les voies des
  rationale: « Voies » rend naturellement le pluriel construit et maintient le parallélisme avec les « sentiers ».
- source_word: חֹשֶׁךְ
  choice: ténèbres
  rationale: « Ténèbres » conserve à la fois l’image concrète et sa portée morale implicite, sans la réduire explicitement au mal.
theological_decisions:
- issue: Métaphore morale des ténèbres
  choice: Conserver « ténèbres » sans expliciter « mal » dans le texte principal.
  alternative: méchanceté / mal
  rationale: L’hébreu transmet la déviation morale par l’opposition imagée entre les sentiers droits et les voies obscures. Une explicitation supprimerait une part de la richesse et de la tension métaphoriques.
translation_notes:
  register: Français moderne, digne et accessible. Le pronom « eux » assure le lien syntaxique avec le verset précédent, puisque le texte hébreu commence par un participe substantivé. Les deux métaphores de déplacement sont conservées.
