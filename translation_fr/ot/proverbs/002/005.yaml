source:
  edition: WLC
  text: אָ֗ז תָּ֭בִין יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת אֱלֹהִ֣ים תִּמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/005.yaml
  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: fr
  text: Alors tu comprendras la crainte de Yahvé et tu trouveras la connaissance de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: L’adverbe introduit le résultat des conditions énoncées aux versets 1 à 4. « Alors » conserve à la fois la progression temporelle et la conséquence logique.
- source_word: תָּבִין
  choice: tu comprendras
  rationale: Le qal inaccompli, deuxième personne du masculin singulier, exprime l’accès à la compréhension ou au discernement. « Tu comprendras » est naturel et fidèle au contexte sapientiel.
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahvé
  rationale: L’expression construite désigne une crainte révérencielle orientée vers YHWH. « Crainte » préserve la force et la tension du terme hébreu, sans le réduire au simple respect; « Yahvé » rend le nom divin.
- source_word: וְדַעַת אֱלֹהִים
  choice: et… la connaissance de Dieu
  rationale: דַּעַת signifie « connaissance » et אֱלֹהִים désigne ici Dieu. La formulation conserve le parallélisme entre comprendre la crainte de Yahvé et trouver la connaissance de Dieu.
- source_word: תִּמְצָא
  choice: tu trouveras
  rationale: Le verbe מצא signifie couramment « trouver ». Ce choix maintient aussi le lien avec l’image de la recherche développée dans les versets précédents.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahvé » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens de יִרְאַת יְהוָה
  choice: la crainte de Yahvé
  alternative: le respect révérenciel envers Yahvé
  rationale: Le choix principal garde le terme traditionnel et la portée théologique de la « crainte » dans la littérature de sagesse, sans en résoudre la tension en simple respect.
- issue: Rapport exprimé par דַּעַת אֱלֹהִים
  choice: la connaissance de Dieu
  alternative: la connaissance qui vient de Dieu
  rationale: Le génitif hébreu peut, hors contexte, permettre plusieurs nuances, mais le parallélisme avec « la crainte de Yahvé » favorise ici Dieu comme objet de la connaissance. La formulation française conserve néanmoins la construction nominale.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier reproduit l’adresse hébraïque au disciple. La syntaxe parallèle et les verbes au futur conservent la structure du verset.
