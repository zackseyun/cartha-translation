  text: בְּ֭נִ/י אִם תִּקַּ֣ח אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/001.yaml
  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: fr
  text: Mon fils[a], si tu accueilles mes paroles et gardes précieusement mes commandements auprès de toi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon enfant ». L’hébreu est au masculin singulier (« mon fils »), forme habituelle de l’enseignement paternel dans les Proverbes.
    reason: lexical_alternative
  - marker: b
    text: Ou « mets en réserve ». Le verbe hébreu peut désigner le fait de cacher ou de conserver soigneusement quelque chose ; « avec toi » exprime ce qui est gardé en sa possession.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif hébreu est au masculin singulier et relève de la forme paternelle d’enseignement caractéristique des Proverbes.
- source_word: אִם
  choice: si
  rationale: La conjonction introduit directement la proposition conditionnelle qui se poursuit dans les versets suivants.
- source_word: תִּקַּח
  choice: tu accueilles
  rationale: Le verbe signifie littéralement « prendre », mais, avec « mes paroles », il exprime ici leur réception consentie; « accueillir » est naturel en français et conserve cette nuance.
- source_word: אֲמָרָי
  choice: mes paroles
  rationale: Le pluriel désigne les paroles ou déclarations du maître; « paroles » convient au registre sapientiel sans préciser excessivement leur genre.
- source_word: וּמִצְוֺתַי
  choice: et mes commandements
  rationale: Le terme désigne des prescriptions faisant autorité; « commandements » en préserve le poids moral et instructionnel.
- source_word: תִּצְפֹּן
  choice: gardes précieusement
  rationale: Le verbe évoque le fait de mettre en réserve, de cacher ou de conserver soigneusement. Cette formulation française exprime à la fois la conservation attentive et la valeur accordée à ce qui est gardé.
- source_word: אִתָּךְ
  choice: auprès de toi
  rationale: La préposition signifie directement « avec toi ». « Auprès de toi » conserve l’image d’une chose gardée à proximité et en possession de la personne, sans l’intérioriser explicitement.
theological_decisions:
- issue: Adresse filiale genrée dans l’enseignement sapientiel
  choice: Mon fils
  alternative: Mon enfant
  rationale: L’hébreu est explicitement masculin singulier et reflète la mise en scène littéraire d’un père ou maître s’adressant à son fils. Le texte principal conserve cette forme, tandis que la note signale une formulation française plus générale sans effacer le genre de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier de l’adresse paternelle. La phrase reste ouverte par une virgule, puisque la proposition conditionnelle se poursuit au verset suivant.
