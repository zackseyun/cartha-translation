  text: קְחֽוּ מוּסָרִ֥/י וְ/אַל כָּ֑סֶף וְ֝/דַ֗עַת מֵ/חָר֥וּץ נִבְחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/010.yaml
  text: Take my instruction instead of silver[b][a], and knowledge rather than choice gold.
translation:
  language: fr
  text: Recevez mon instruction plutôt que l’argent[a], et la connaissance plutôt que l’or de choix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et non l’argent ». Dans ce contraste poétique, le sens est de préférer l’instruction à la richesse.'
    reason: lexical_alternative
  - marker: b
    text: « Or de choix » peut aussi se traduire par « or choisi » ou, selon le sens contextuel, « or fin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Recevez
  rationale: L’impératif pluriel de לקח appelle à accueillir et à faire sienne l’instruction. « Recevez » est naturel en français dans ce contexte pédagogique.
- source_word: מוּסָרִי
  choice: mon instruction
  rationale: מוּסָר désigne une instruction comportant une dimension de discipline ou de correction. Le parallèle avec « connaissance » favorise ici « instruction ».
- source_word: וְאַל כָּסֶף
  choice: plutôt que l’argent
  rationale: Après l’impératif, la construction exprime poétiquement une préférence. « Plutôt que » rend clairement la comparaison, tandis que « argent » conserve le sens du métal précieux dans ce contraste avec l’or.
- source_word: דַעַת
  choice: la connaissance
  rationale: Traduction directe de דַעַת, courante dans la littérature sapientielle et bien adaptée au parallèle avec l’instruction.
- source_word: מֵחָרוּץ
  choice: plutôt que l’or
  rationale: חָרוּץ désigne ici l’or, vraisemblablement précieux ou fin. La préposition comparative מִן est rendue par « plutôt que ».
- source_word: נִבְחָר
  choice: de choix
  rationale: Le participe passif de בחר signifie « choisi, sélectionné ». L’expression française « or de choix » conserve cette qualification sans la confondre avec le raffinage.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme hébreu est conservé par la répétition de « plutôt que ». « Recevez » souligne l’accueil actif de l’enseignement, et les notes préservent les lectures plus littérales ou lexicalement possibles.
