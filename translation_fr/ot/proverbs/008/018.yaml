id: PRO.8.18
reference: Proverbs 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: fr
  text: 'La richesse et l’honneur sont avec moi,

    une fortune durable[a] et la droiture[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fortune solide »; l’adjectif peut évoquer ce qui est durable ou substantiel.
    reason: lexical_alternative
  - marker: b
    text: Ou « la justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: richesse
  rationale: Le terme désigne l’abondance matérielle. « Richesse » convient au parallélisme poétique avec « honneur » et reste distinct de הוֹן dans le second membre.
- source_word: כָבוֹד
  choice: honneur
  rationale: Dans ce contexte sapientiel, il s’agit surtout de considération et de prestige social; « honneur » est donc plus naturel que « gloire ».
- source_word: אִתִּי
  choice: sont avec moi
  rationale: Cette tournure conserve l’image hébraïque selon laquelle la richesse et l’honneur se trouvent auprès de la Sagesse, sans transformer explicitement la relation en possession ou en don.
- source_word: הוֹן
  choice: fortune
  rationale: Le mot désigne les biens ou la richesse. « Fortune » évite de répéter « richesse » tout en maintenant le chevauchement voulu par le parallélisme.
- source_word: עָתֵק
  choice: durable
  rationale: Appliqué à la fortune, l’adjectif évoque ici vraisemblablement ce qui dure, tout en pouvant suggérer des biens solides ou substantiels; cette nuance est signalée en note.
- source_word: צְדָקָה
  choice: droiture
  rationale: « Droiture » exprime ici la qualité morale associée à la Sagesse sans limiter le terme à un cadre judiciaire. « Justice », également possible, est conservé en note.
theological_decisions:
- issue: Portée morale de צְדָקָה dans un contexte sapientiel
  choice: droiture
  alternative: justice
  rationale: Le contexte n’est pas spécifiquement judiciaire. « Droiture » rend la dimension morale générale, tandis que la note maintient l’autre valeur importante du terme hébreu sans résoudre artificiellement son amplitude sémantique.
translation_notes:
  register: Français international actuel, simple et digne. Le parallélisme en deux lignes reflète la poésie hébraïque; les articles définis et indéfini assurent une formulation française naturelle.
