  yaml_path: translation/ot/proverbs/008/007.yaml
  text: For my mouth will utter truth[a], and wickedness is an abomination to my lips.
translation:
  language: fr
  text: Car mon palais dit la vérité[a], et mes lèvres ont la méchanceté en horreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon palais dit la vérité ». Le « palais » représente ici l’organe de la parole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient l’appel précédent de la Sagesse et conserve naturellement la valeur explicative de la conjonction.
- source_word: אֱמֶת
  choice: la vérité
  rationale: Dans ce contexte de parole, le terme désigne ce qui est vrai ou véridique; « la vérité » rend clairement le contraste moral avec la méchanceté.
- source_word: יֶהְגֶּה
  choice: proclame
  rationale: Avec le palais comme sujet et la vérité comme objet, le verbe désigne ici l’émission de paroles. « Proclame » exprime une parole articulée sans retenir les sens contextuellement moins probables de murmurer ou méditer.
- source_word: חִכִּי
  choice: mon palais
  rationale: Conserve l’image corporelle précise de l’hébreu, où le palais représente l’organe de la parole; une note en explicite la fonction figurée.
- source_word: וְתוֹעֲבַת
  choice: et … est une abomination
  rationale: Préserve la forte réprobation morale du substantif hébreu dans un registre biblique encore compréhensible en français moderne.
- source_word: שְׂפָתַי
  choice: pour mes lèvres
  rationale: Maintient le parallélisme corporel avec « mon palais » et exprime que la méchanceté est répugnante dans la parole de la Sagesse.
- source_word: רֶשַׁע
  choice: la méchanceté
  rationale: Rend le mal moral ou la conduite coupable et forme un contraste net avec « la vérité ».
theological_decisions: []
