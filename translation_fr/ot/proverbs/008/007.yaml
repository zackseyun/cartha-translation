- from: Car mon palais proclame la vérité[a], et la méchanceté est une abomination pour mes lèvres.
  to: Car mon palais dit la vérité[a], et mes lèvres ont la méchanceté en horreur.
  rationale: La révision conserve la métaphore du « palais » et le lien explicatif de « Car », tout en employant des formulations françaises plus naturelles. Le second membre rend le sens du construct hébreu (« la méchanceté est une chose abominable pour mes lèvres ») par une tournure idiomatique d’intensité équivalente.
