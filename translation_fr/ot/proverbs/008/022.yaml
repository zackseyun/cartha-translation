source:
  edition: WLC
  text: יְֽהוָ֗ה קָ֭נָ/נִי רֵאשִׁ֣ית דַּרְכּ֑/וֹ קֶ֖דֶם מִפְעָלָ֣י/ו מֵ/אָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: fr
  text: Yahweh m’a acquise[a] au commencement de sa voie, avant ses œuvres les plus anciennes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’a créée » ou « m’a possédée ». Le verbe hébreu peut avoir plusieurs sens. Ce verset a occupé une place centrale dans les débats historiques sur la Sagesse personnifiée et sa relation avec le Fils.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: קָנָנִי
  choice: m’a possédée
  rationale: Le verbe קנה peut exprimer l’idée de posséder, d’acquérir ou, dans certains contextes, de créer. « M’a possédée » retient un sens lexical solide sans trancher silencieusement l’ambiguïté; l’accord au féminin correspond à la Sagesse personnifiée.
- source_word: רֵאשִׁית
  choice: au commencement
  rationale: Dans cette construction, le terme indique naturellement le début de l’activité ou de la voie de Yahweh.
- source_word: דַּרְכּוֹ
  choice: de sa voie
  rationale: « Voie » conserve la portée assez large de דרך, qui peut désigner ici le cours ou le mode d’action de Dieu sans le préciser davantage.
- source_word: קֶדֶם
  choice: avant
  rationale: Dans le contexte, le mot marque la priorité temporelle de la Sagesse par rapport aux œuvres mentionnées ensuite.
- source_word: מִפְעָלָיו
  choice: ses œuvres
  rationale: Le terme désigne ce que Yahweh a fait ou réalisé; « œuvres » convient au contexte primordial et reste concis.
- source_word: מֵאָז
  choice: d’autrefois
  rationale: Cette expression renvoie à une époque reculée; « d’autrefois » rend cette ancienneté en français naturel et digne.
theological_decisions:
- issue: Traduction de קָנָנִי dans un verset historiquement lié aux débats christologiques
  choice: m’a possédée
  alternative: m’a créée; m’a acquise
  rationale: Le passage présente directement la Sagesse personnifiée et ne nomme pas explicitement le Fils. Le texte principal retient donc une valeur possible du verbe sans imposer une conclusion christologique ultérieure, tandis que la note conserve les autres sens importants et la tension historique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’image biblique de la « voie » et marque grammaticalement le féminin de la Sagesse personnifiée.
