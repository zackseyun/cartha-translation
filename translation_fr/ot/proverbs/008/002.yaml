source:
  edition: WLC
  text: בְּ/רֹאשׁ מְרוֹמִ֥ים עֲלֵי דָ֑רֶךְ בֵּ֖ית נְתִיב֣וֹת נִצָּֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/002.yaml
  text: On the heights beside the road[a], at the crossroads she takes her stand.
translation:
  language: fr
  text: Au sommet des hauteurs, près du chemin, au carrefour des sentiers[a], elle se tient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la maison des sentiers », c’est-à-dire à l’endroit où les sentiers se rencontrent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ מְרוֹמִים
  choice: Au sommet des hauteurs
  rationale: רֹאשׁ désigne la tête ou le sommet, et מְרוֹמִים des lieux élevés. Cette formulation conserve à la fois l’élévation et la position dominante exprimées par l’hébreu.
- source_word: עֲלֵי דָרֶךְ
  choice: près du chemin
  rationale: La préposition situe ici la Sagesse par rapport au chemin. « Près du chemin » est naturel en français moderne et souligne le caractère public et accessible du lieu sans imposer le sens spatial « au-dessus de ».
- source_word: בֵּית נְתִיבוֹת
  choice: au carrefour des sentiers
  rationale: L’expression signifie littéralement « maison des sentiers » et désigne vraisemblablement l’endroit où plusieurs sentiers se rejoignent. « Carrefour des sentiers » restitue clairement cette image.
- source_word: נִצָּבָה
  choice: elle se tient
  rationale: La forme féminine singulière décrit la Sagesse personnifiée dans une position établie. « Elle se tient » est sobre, naturel et n’ajoute pas une nuance d’affrontement absente du contexte immédiat.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Employer le pronom féminin « elle »
  alternative: Répéter « la Sagesse » ou neutraliser la référence
  rationale: Le verbe hébreu est au féminin singulier et renvoie à la Sagesse personnifiée dans le contexte. Le féminin préserve la forme littéraire du texte sans trancher d’autres questions théologiques.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme spatial est conservé par trois compléments successifs, et la formulation reste digne sans archaïsme.
