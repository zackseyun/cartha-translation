source:
  edition: WLC
  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: fr
  text: À moi le conseil et la sagesse efficace[a] ; je suis l’intelligence ; à moi la puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la compétence » ; le terme hébreu évoque une sagesse solide qui permet d’agir efficacement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵצָה
  choice: le conseil
  rationale: Dans la littérature sapientielle, le terme désigne le conseil réfléchi ou la juste orientation. « Le conseil » convient au registre élevé de la Sagesse personnifiée.
- source_word: תוּשִׁיָּה
  choice: la sagesse efficace
  rationale: Le mot associe solidité du jugement, compétence et efficacité pratique. « Sagesse efficace » préserve cette dimension active sans réduire le sens à la réussite matérielle.
- source_word: אֲנִי בִינָה
  choice: je suis l’intelligence
  rationale: La proposition nominale identifie la Sagesse à l’intelligence elle-même, plutôt que de dire seulement qu’elle la possède. La formulation conserve cette force prédicative.
- source_word: גְּבוּרָה
  choice: la puissance
  rationale: Le terme peut exprimer la force, la puissance ou la vaillance. Ici, « puissance » est naturel et assez large, sans imposer une nuance exclusivement guerrière.
- source_word: לִי ... לִי
  choice: À moi ... à moi
  rationale: La reprise en tête de membre reproduit l’insistance possessive et le parallélisme poétique de l’hébreu.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Conserver la parole à la première personne de la Sagesse personnifiée.
  alternative: Identifier explicitement la Sagesse au Christ dans la traduction.
  rationale: Le texte hébreu présente la Sagesse comme une figure personnifiée qui parle. La traduction maintient cette présentation littéraire et théologique sans trancher les interprétations ultérieures.
translation_notes:
  register: Français moderne, digne et poétique. La construction répétée « À moi… » maintient l’emphase de l’hébreu. « Intelligence » est employé au sens de faculté de comprendre et de discerner, non au seul sens intellectuel moderne.
