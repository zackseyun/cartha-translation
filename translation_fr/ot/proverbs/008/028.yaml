  text: when he made the skies firm above[a], when the springs of the deep grew strong[b],
translation:
  language: fr
  text: 'quand il affermit les cieux[a] en haut,

    quand les sources de l’abîme gagnèrent en puissance[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nuages » ou « le ciel » ; le mot hébreu peut désigner la région céleste aussi bien que les nuages.
    reason: lexical_alternative
  - marker: b
    text: Ou « quand il renforça les sources de l’abîme ». L’hébreu peut être compris soit comme les sources qui gagnent en puissance, soit comme Dieu qui les rend puissantes.
    reason: syntactic_alternative
lexical_decisions:
- source_word: בְּאַמְּצוֹ
  choice: quand il affermissait
  rationale: L’infinitif construit précédé de בְּ introduit ici une proposition temporelle. אמץ exprime l’action de rendre ferme ou fort ; « affermissait » restitue cette idée dans un français naturel et convient à l’évocation de la création.
- source_word: שְׁחָקִים
  choice: les cieux
  rationale: Le terme peut désigner les cieux, le ciel ou les nuages. Dans ce contexte cosmologique et avec מִמָּעַל, « les cieux » rend naturellement la région supérieure sans la limiter aux seuls nuages.
- source_word: מִמָּעַל
  choice: là-haut
  rationale: L’expression indique ce qui est au-dessus. « Là-haut » conserve la valeur spatiale et évite la tournure moins naturelle « les cieux au-dessus ».
- source_word: בַּעֲזוֹז
  choice: prenaient de la force
  rationale: L’infinitif de עזז décrit ici les sources comme devenant fortes ou puissantes. « Prenaient de la force » préserve cette valeur inchoative tout en restant idiomatique en français.
- source_word: עִינוֹת
  choice: les sources
  rationale: עִינוֹת désigne des sources ou des fontaines. « Sources » est le terme courant et convient à l’image des eaux issues de l’abîme.
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: תְּהוֹם désigne l’abîme aqueux ou les eaux profondes primordiales. « L’abîme » est concis et conserve la portée cosmique du mot.
