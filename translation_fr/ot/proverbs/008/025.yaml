  text: בְּ/טֶ֣רֶם הָרִ֣ים הָטְבָּ֑עוּ לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/025.yaml
  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: fr
  text: Avant que les montagnes ne soient établies, avant les collines, j’ai été mise au monde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis née » ou « j’ai été engendrée ». L’hébreu emploie une image de naissance ou d’origine pour parler de la Sagesse personnifiée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Avant que
  rationale: Marque l’antériorité temporelle et introduit naturellement en français une proposition au subjonctif.
- source_word: הָרִים
  choice: les montagnes
  rationale: Équivalent courant du pluriel défini, adapté au parallélisme poétique de la création.
- source_word: הָטְבָּעוּ
  choice: soient implantées
  rationale: Le hophal de טבע évoque ici des montagnes enfoncées ou fixées solidement. « Implantées » conserve cette image d’ancrage sans lourdeur excessive.
- source_word: לִפְנֵי
  choice: avant
  rationale: La préposition a ici un sens temporel et reprend l’idée de בְּטֶרֶם dans le parallélisme.
- source_word: גְבָעוֹת
  choice: les collines
  rationale: Traduction usuelle qui préserve le parallèle topographique avec les montagnes.
- source_word: חוֹלָלְתִּי
  choice: j’ai été mise au monde
  rationale: La forme exprime ici une naissance ou une venue à l’existence. Puisque la Sagesse personnifiée parle au féminin en français, « mise » s’accorde avec elle. Cette formulation maintient l’imagerie d’enfantement sans imposer le sens doctrinal plus précis d’« engendrée ».
theological_decisions:
- issue: Rendre le langage d’origine appliqué à la Sagesse personnifiée sans trancher les débats christologiques ultérieurs
  choice: j’ai été mise au monde
  alternative: je suis née ; j’ai été engendrée
  rationale: « Mise au monde » conserve l’image hébraïque de naissance ou d’origine tout en évitant de réduire le vers à une description biologique ou de lui imposer la charge doctrinale que peut recevoir « engendrée ». L’ambiguïté poétique et théologique demeure ouverte.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition « avant » conserve le parallélisme hébreu. Le féminin explicite correspond au genre de « la Sagesse » dans le contexte.
