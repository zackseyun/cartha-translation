  text: לְ/יַד שְׁעָרִ֥ים לְ/פִי קָ֑רֶת מְב֖וֹא פְתָחִ֣ים תָּרֹֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/003.yaml
  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
translation:
  language: fr
  text: Près des portes, à l’entrée de la ville[a], à l’entrée des portes, elle crie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à la bouche de la ville » ; ou « à l’ouverture de la ville ».
    reason: lexical_alternative
  - marker: b
    text: Ou « elle appelle à grands cris ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיַד
  choice: Près de
  rationale: L’expression formée avec יָד a ici le sens spatial de « près de » ou « à côté de ». « Près de » est naturel et concis en français.
- source_word: שְׁעָרִים
  choice: des portes
  rationale: Il s’agit vraisemblablement des portes de la ville, lieux publics de passage, de rassemblement et de jugement.
- source_word: לְפִי
  choice: à l’entrée de
  rationale: Littéralement « à la bouche de ». En français actuel, « à l’entrée de » transmet clairement l’image spatiale sans produire une expression artificielle; la formulation littérale est signalée en note.
- source_word: קָרֶת
  choice: la ville
  rationale: Le nom désigne une ville ou une cité. « Ville » convient au cadre urbain évoqué par les portes.
- source_word: מְבוֹא
  choice: là où débouchent
  rationale: Le terme indique un lieu d’accès ou d’entrée. La tournure verbale française rend naturellement la relation spatiale avec le pluriel פְתָחִים.
- source_word: פְתָחִים
  choice: les passages
  rationale: Le pluriel peut désigner des ouvertures, entrées ou accès. « Passages » évite la répétition immédiate d’« entrée » tout en conservant l’idée de voies d’accès.
- source_word: תָּרֹנָּה
  choice: elle lance son appel
  rationale: Le verbe décrit une proclamation audible et publique. « Lance son appel » conserve cette force sans lui attribuer une émotion particulière.
