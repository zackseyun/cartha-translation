  source_fidelity: La scène et les trois repères spatiaux sont globalement reconnus, mais « là où débouchent les passages » transforme le syntagme nominal מְבוֹא פְתָחִים (« à l’entrée des portes / des ouvertures ») en une proposition explicative et affaiblit son parallélisme avec les deux repères précédents. « Elle lance son appel » est recevable, mais « elle crie » rend plus directement la proclamation sonore de תָּרֹנָּה.
  naturalness: La révision demeure naturelle en français moderne tout en conservant la répétition délibérée des termes d’accès présente dans l’hébreu. « À l’entrée des portes » est légèrement plus littéral que la reformulation du projet, mais clair dans le cadre des portes de ville.
  terminology: « Portes », « ville » et « entrée » rendent adéquatement les termes civiques et spatiaux. La note sur la « bouche » est rattachée à « ville », soit à l’expression qu’elle explique réellement. La note sur le cri est rattachée au verbe, plutôt qu’au terme spatial précédent.
