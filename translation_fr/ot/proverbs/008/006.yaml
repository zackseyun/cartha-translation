    issue: Ambiguïté de « parler de choses nobles »
    rationale: En français, « parler de » introduit normalement le thème du discours, tandis que l’hébreu dit que la locutrice prononcera des choses nobles. « Dire des choses nobles » rétablit le rapport syntaxique et sémantique direct.
