  text: שִׁ֭מְעוּ כִּֽי נְגִידִ֣ים אֲדַבֵּ֑ר וּ/מִפְתַּ֥ח שְׂ֝פָתַ֗/י מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/006.yaml
  text: Listen[a], for I will speak noble things[b], and the opening of my lips will be upright things.
translation:
  language: fr
  text: Écoutez, car je dirai des choses nobles[a], et mes lèvres s’ouvriront pour dire ce qui est droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’excellentes choses ». Le terme hébreu est apparenté à ce qui est princier ou noble et désigne ici des paroles de grande valeur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des choses droites ». Le terme hébreu évoque la droiture, notamment au sens moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » appelle naturellement à une attention active en français moderne.
- source_word: כִּי
  choice: car
  rationale: 'La conjonction introduit ici la raison de l’appel à écouter : la Sagesse va prendre la parole.'
- source_word: נְגִידִים
  choice: choses nobles
  rationale: Dans ce contexte poétique, le terme évoque ce qui est princier, noble ou d’une haute valeur, plutôt que des chefs en tant que personnes.
- source_word: אֲדַבֵּר
  choice: je parlerai
  rationale: L’imparfait hébreu exprime ici la prise de parole annoncée après l’impératif.
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: et mes lèvres s’ouvriront pour dire
  rationale: Cette formulation française naturelle conserve l’image hébraïque de l’ouverture des lèvres, tout en explicitant sa fonction d’énonciation.
- source_word: מֵישָׁרִים
  choice: ce qui est droit
  rationale: Le pluriel abstrait désigne la rectitude, notamment morale. « Ce qui est droit » rend ce sens plus naturellement que le calque « des choses droites ».
theological_decisions:
- issue: Portée morale de מֵישָׁרִים
  choice: ce qui est droit
  alternative: des paroles droites
  rationale: La traduction conserve la notion générale de rectitude sans la limiter explicitement à une catégorie doctrinale particulière; le contexte de parole permet néanmoins de comprendre qu’il s’agit du contenu prononcé.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme poétique est maintenu, tandis que l’expression littérale « l’ouverture de mes lèvres » est reformulée verbalement pour éviter une tournure raide en français.
