source:
  edition: WLC
  text: כִּֽי טוֹבָ֣ה חָ֭כְמָה מִ/פְּנִינִ֑ים וְ/כָל חֲ֝פָצִ֗ים לֹ֣א יִֽשְׁווּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: fr
  text: Car la sagesse vaut mieux que les joyaux[a], et rien de ce qu’on peut désirer ne l’égale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les perles » ou « les rubis » ; le terme hébreu désigne des pierres précieuses dont l’identification exacte est incertaine.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et conserve naturellement la valeur explicative du connecteur.
- source_word: טוֹבָה חָכְמָה מִפְּנִינִים
  choice: la sagesse vaut mieux que les joyaux
  rationale: La préposition comparative מִן donne à טוֹבָה le sens de « vaut mieux que ». « Joyaux » préserve la valeur générale de פְּנִינִים sans préciser indûment la pierre concernée.
- source_word: וְכָל חֲפָצִים
  choice: et rien de ce qu’on peut désirer
  rationale: Tour français naturel qui exprime la totalité des choses désirables tout en préparant la négation comparative.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: ne l’égale
  rationale: שׁוה avec ב exprime l’égalité ou l’équivalence. Le pronom féminin « l’ » renvoie à la sagesse personnifiée, même si son genre n’est pas explicitement audible.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver un renvoi grammatical féminin par « l’ », référant à « la sagesse »
  alternative: Employer une formulation impersonnelle telle que « n’est comparable à la sagesse »
  rationale: Le suffixe hébreu בָהּ est féminin singulier et le chapitre 8 personnifie la Sagesse comme une femme. La formulation retenue respecte cette donnée littéraire sans lui imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. « Vaut mieux que » rend la comparaison de valeur avec clarté ; « rien de ce qu’on peut désirer » évite une tournure lourde tout en conservant la portée générale de l’hébreu.
