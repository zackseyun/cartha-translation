  source_fidelity: « Par moi » rend fidèlement l’instrumentalité de בִּי dans le discours de la Sagesse. « Les rois règnent » correspond précisément à מְלָכִים יִמְלֹכוּ. En revanche, « dignitaires » peut désigner des personnalités de haut rang sans compétence gouvernante effective, alors que רֹזְנִים est ici parallèle aux rois et accomplit l’action d’édicter. « Gouvernants » restitue mieux cette fonction tout en évitant de limiter le terme à des princes de sang.
