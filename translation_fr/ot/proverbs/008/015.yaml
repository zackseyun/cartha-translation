  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: fr
  text: Par moi[a], les rois règnent, et les gouvernants[b] décrètent ce qui est juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Grâce à moi » ou « par mon moyen ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les princes », « les dignitaires » ou « les grands ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Par moi
  rationale: Dans le discours de la Sagesse, la préposition בְּ avec le suffixe de première personne exprime ici le moyen ou l’action médiatrice. « Par moi » est concis et conserve cette portée sans la préciser excessivement.
- source_word: מְלָכִים
  choice: les rois
  rationale: Équivalent français direct et naturel du nom désignant les monarques.
- source_word: יִמְלֹכוּ
  choice: règnent
  rationale: Le verbe מלך désigne l’exercice du pouvoir royal ; « règnent » préserve cette nuance et s’accorde naturellement avec « les rois ».
- source_word: וְרוֹזְנִים
  choice: et les dignitaires
  rationale: רֹזְנִים désigne de hauts personnages investis d’une autorité publique. « Dignitaires » maintient leur rang élevé sans les assimiler nécessairement à des princes de sang.
- source_word: יְחֹקְקוּ
  choice: décrètent
  rationale: Dans ce contexte gouvernemental, חקק évoque l’établissement autorisé d’une règle ou d’une décision. « Décrètent » conserve cette force sans introduire le cadre précis d’un parlement moderne.
- source_word: צֶדֶק
  choice: ce qui est juste
  rationale: צֶדֶק peut signifier la justice, la droiture ou ce qui est conforme au droit. Après « décrètent », « ce qui est juste » est naturel en français et maintient la dimension éthique et judiciaire du terme.
theological_decisions:
- issue: Le rôle de la Sagesse dans l’exercice de l’autorité politique
  choice: Le verset affirme que c’est par la Sagesse que les rois règnent et que les dignitaires établissent ce qui est juste.
  alternative: Comprendre le verset comme une légitimation morale automatique de tout pouvoir politique et de toutes ses décisions.
  rationale: Dans le contexte, la Sagesse personnifiée se présente comme indispensable au bon gouvernement. La formulation conserve cette affirmation positive sans prétendre que tout dirigeant réel agit toujours avec justice.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme hébreu et évite aussi bien l’archaïsme que le vocabulaire institutionnel trop contemporain.
