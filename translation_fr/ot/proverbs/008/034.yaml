id: PRO.8.34
reference: Proverbs 8:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָם֮ שֹׁמֵ֪עַֽ֫ לִ֥/י לִ/שְׁקֹ֣ד עַל דַּ֭לְתֹתַ/י י֤וֹם י֑וֹם לִ֝/שְׁמֹ֗ר מְזוּזֹ֥ת פְּתָחָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: fr
  text: Heureux l’homme qui m’écoute[a], veillant jour après jour à mes portes, montant la garde aux montants de mes entrées !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu rendu par « l’homme » est au masculin singulier, mais il a ici un sens générique : il désigne toute personne qui écoute la Sagesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule exprime le bonheur profond et l’épanouissement de celui qui suit la sagesse; « Heureux » est la tournure naturelle des béatitudes en français.
- source_word: אָדָם
  choice: l’homme
  rationale: Le singulier hébreu a ici une portée représentative et générique. « L’homme » conserve la forme proverbiale, avec une note précisant qu’il s’agit de toute personne.
- source_word: שֹׁמֵעַ לִי
  choice: qui m’écoute
  rationale: Cette formulation garde l’image de l’écoute attentive sans expliciter excessivement l’obéissance qu’elle peut impliquer.
- source_word: לִשְׁקֹד
  choice: veillant
  rationale: Le verbe évoque une attention assidue et vigilante; « veillant » s’accorde naturellement avec l’image des portes.
- source_word: עַל דַּלְתֹתַי
  choice: à mes portes
  rationale: La préposition indique ici le lieu où l’on se tient dans l’attente; « à mes portes » est idiomatique et fidèle à l’image.
- source_word: יוֹם יוֹם
  choice: jour après jour
  rationale: La répétition hébraïque souligne la constance; cette expression française en restitue la valeur itérative.
- source_word: לִשְׁמֹר
  choice: montant la garde
  rationale: Le verbe signifie garder ou surveiller. Dans ce contexte, l’expression dépeint une attente attentive sans effacer le parallélisme.
- source_word: מְזוּזוֹת
  choice: aux montants
  rationale: Le nom désigne les poteaux ou jambages verticaux d’une porte; « montants » est précis et naturel en français.
- source_word: פְּתָחַי
  choice: de mes entrées
  rationale: Le pluriel « entrées » conserve la distinction lexicale avec les « portes » du membre parallèle.
theological_decisions:
- issue: Masculin générique dans la béatitude sapientielle
  choice: l’homme
  alternative: la personne / quiconque
  rationale: אָדָם, au singulier, représente ici tout être humain et ne limite pas la promesse aux hommes. Le texte conserve la forme proverbiale traditionnelle, tandis que la note en explicite la portée inclusive.
translation_notes:
  register: Français international moderne, digne et proverbial. La syntaxe participiale maintient le mouvement du verset et le parallélisme entre l’attente aux portes et la vigilance aux montants des entrées.
