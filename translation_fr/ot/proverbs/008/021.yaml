review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : la Sagesse fait hériter ceux qui l’aiment de biens et remplit leurs lieux de dépôt. Toutefois, « réserves » désigne plus naturellement les stocks eux-mêmes que les trésoreries ou lieux de stockage qu’évoque אֹצָרוֹת.'
  naturalness: « Donner des biens en héritage » est compréhensible et naturel. « Faire hériter de biens » restitue plus directement la construction causative hébraïque et s’enchaîne bien dans ce distique. « Entrepôts » est plus concret et idiomatique que « réserves » avec « remplir ».
  terminology: « Biens » convient pour יֵשׁ sans réduire le terme à l’argent. La note doit éviter de présenter « ce qui existe » comme une équivalence littérale simple dans ce contexte ; il s’agit ici de biens, de substance ou de possessions.
  issues:
  - severity: medium
    issue: « leurs réserves » pour וְאֹצְרֹתֵיהֶם
    rationale: Le mot hébreu désigne des trésors, magasins ou lieux de dépôt. En français, des « réserves » sont généralement des provisions ou des stocks ; « remplir leurs réserves » modifie légèrement l’image concrète de contenants ou de dépôts.
  - severity: low
    issue: Formulation de la note sur יֵשׁ
    rationale: Dire que le mot signifie littéralement « ce qui existe » est trop schématique ici. Dans cet emploi nominal, il peut désigner des biens ou des possessions ; la note doit présenter cette valeur contextuelle sans une glose littérale potentiellement trompeuse.
  revised_text: 'pour faire hériter de biens[a] ceux qui m’aiment

    et remplir leurs entrepôts.'
  revised_footnotes:
