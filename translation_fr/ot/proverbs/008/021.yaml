  text: לְ/הַנְחִ֖יל אֹהֲבַ֥/י יֵ֑שׁ וְ/אֹצְרֹ֖תֵי/הֶ֣ם אֲמַלֵּֽא׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: fr
  text: 'pour faire hériter de biens[a] ceux qui m’aiment

    et remplir leurs entrepôts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de substance » ou « de possessions ». L’hébreu יֵשׁ peut désigner des biens ou des possessions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: donner … en héritage
  rationale: Le hiphil de נחל signifie « faire hériter » ou « donner en possession comme héritage ». Cette formulation conserve l’image de l’héritage tout en restant naturelle en français.
- source_word: אֹהֲבַי
  choice: ceux qui m’aiment
  rationale: Le participe avec suffixe de première personne désigne les personnes caractérisées par leur amour pour la Sagesse personnifiée.
- source_word: יֵשׁ
  choice: des biens
  rationale: Dans ce contexte, יֵשׁ désigne ce qui a une réalité substantielle, notamment des possessions. « Des biens » convient au parallèle avec les réserves sans limiter le propos à l’argent.
- source_word: וְאֹצְרֹתֵיהֶם
  choice: leurs réserves
  rationale: אֹצָר désigne un lieu où l’on amasse et conserve des biens, tel un dépôt, un magasin ou une trésorerie. « Réserves » rend naturellement en français moderne l’image de lieux ou de ressources que l’on remplit.
- source_word: אֲמַלֵּא
  choice: remplir
  rationale: Le piel à la première personne signifie littéralement « je remplirai ». L’infinitif français coordonné à « donner » exprime naturellement la continuation du but introduit par לְהַנְחִיל.
theological_decisions:
- issue: Nature des bienfaits promis par la Sagesse personnifiée
  choice: Conserver l’image concrète de biens transmis et de réserves remplies, sans en faire une promesse doctrinale générale de prospérité matérielle.
  alternative: Spiritualiser explicitement par « vraies richesses » ou « biens durables ».
  rationale: Le rapprochement de יֵשׁ avec les lieux de stockage favorise une image concrète de possessions. Le texte ne précise cependant pas ici la portée doctrinale de cette image; la traduction ne doit donc ni la spiritualiser ni l’étendre en garantie universelle de richesse.
translation_notes:
  register: Français international moderne, poétique et digne. Le vers est formulé comme la suite syntaxique du contexte; « donner … en héritage » préserve l’image hébraïque sans la lourdeur de « faire hériter ». Le marqueur [a] figure immédiatement après le terme concerné.
