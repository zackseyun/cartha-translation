  to: 'pour faire hériter de biens[a] ceux qui m’aiment

    et remplir leurs entrepôts.'
  rationale: La révision conserve l’image d’un héritage accordé par la Sagesse, rend plus explicitement la valeur causative de לְהַנְחִיל, et remplace « réserves » par « entrepôts », qui préserve mieux l’image de lieux de dépôt que la Sagesse remplit. La note est reformulée pour refléter l’emploi lexical de יֵשׁ dans le contexte sans surinterpréter sa valeur littérale.
