  text: בְּ/אֹֽרַח צְדָקָ֥ה אֲהַלֵּ֑ך בְּ֝/ת֗וֹךְ נְתִיב֥וֹת מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/020.yaml
  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
translation:
  language: fr
  text: Je marche dans le chemin de la droiture[a], au milieu des sentiers de la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le chemin de la justice, au milieu des sentiers de l’équité ». Les termes hébreux traduits par « droiture » et « justice » ont des sens qui se recoupent.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֹרַח
  choice: sur le chemin de
  rationale: אֹרַח désigne un chemin, une voie ou une manière de vivre. « Sur le chemin de » est naturel en français et conserve la métaphore morale du déplacement.
- source_word: צְדָקָה
  choice: justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou ce qui est juste. « Justice » exprime ici la conformité morale au bien, tandis que « équité » dans le second membre maintient autant que possible la distinction poétique.
- source_word: אֲהַלֵּך
  choice: je marche
  rationale: La forme de הלך exprime ici une marche suivie, métaphore d’une conduite habituelle. « Je marche » préserve cette image sans l’expliciter.
- source_word: בְּ/תוֹךְ
  choice: au milieu de
  rationale: תּוֹךְ évoque le milieu ou l’intérieur. « Au milieu de » conserve l’image spatiale et le parallélisme du vers.
- source_word: נְתִיבוֹת
  choice: des sentiers de
  rationale: נְתִיבוֹת désigne des sentiers ou des pistes. « Sentiers » forme un parallèle poétique naturel avec « chemin ».
- source_word: מִשְׁפָּט
  choice: équité
  rationale: מִשְׁפָּט peut signifier jugement, droit ou justice. « Équité » met ici en relief la dimension juste du droit et évite de répéter « justice », tout en préservant la distinction entre les deux termes hébreux.
theological_decisions:
- issue: Distinction entre צְדָקָה et מִשְׁפָּט
  choice: « justice » puis « équité »
  alternative: « droiture » puis « justice »
  rationale: Les deux termes se recoupent sans être identiques. Le texte principal conserve leur parallélisme et leur nuance distincte; la note signale une autre répartition française possible sans imposer une opposition trop rigide.
translation_notes:
  register: Français moderne, international et digne. La métaphore sapientielle de la marche est conservée, ainsi que le parallélisme entre « chemin » et « sentiers ». « Équité » est courant dans un registre soutenu accessible et permet de distinguer les deux notions hébraïques sans nier leur chevauchement.
