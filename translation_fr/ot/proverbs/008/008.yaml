  yaml_path: translation/ot/proverbs/008/008.yaml
  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: fr
  text: Toutes les paroles de ma bouche sont justes ; elles ne contiennent rien de tortueux ni de pervers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: sont justes
  rationale: Le syntagme prépositionnel hébreu exprime ici la conformité au droit et à la rectitude. « Sont justes » restitue ce sens de façon naturelle en français, sans l’étrangeté de « sont dans la justice ».
- source_word: כָּל
  choice: Toutes
  rationale: Ce choix conserve la portée globale du terme hébreu et s’accorde naturellement avec « les paroles ».
- source_word: אִמְרֵי פִי
  choice: les paroles de ma bouche
  rationale: Cette formulation préserve l’image concrète et solennelle de l’hébreu tout en restant idiomatique en français.
- source_word: אֵין בָּהֶם
  choice: elles ne contiennent rien de
  rationale: Cette restructuration française rend clairement la négation existentielle et le pronom pluriel renvoyant aux paroles.
- source_word: נִפְתָּל
  choice: tortueux
  rationale: Le mot évoque ce qui est tordu, détourné ou retors. « Tortueux » conserve à la fois la métaphore et sa portée morale.
- source_word: וְעִקֵּשׁ
  choice: ni de pervers
  rationale: עִקֵּשׁ désigne ce qui est faussé, dévoyé ou moralement pervers. « Pervers » distingue suffisamment ce second terme de « tortueux » tout en maintenant l’intensification synonymique.
