  text: אֲ֭נִי אהבי/ה אֵהָ֑ב וּ֝/מְשַׁחֲרַ֗/י יִמְצָאֻֽ/נְנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/017.yaml
  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: fr
  text: Moi, j’aime ceux qui m’aiment, et ceux qui me cherchent avec ardeur me trouvent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui me cherchent de bonne heure me trouvent ». Le verbe hébreu peut désigner le fait de chercher tôt et, par extension, de chercher avec ardeur ou assiduité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: J’aime
  rationale: Le pronom sujet est exprimé par la forme verbale française. L’ordre naturel du français ne permet pas de reproduire l’emphase initiale sans lourdeur.
- source_word: אֹהֲבַי / אהבי/ה
  choice: ceux qui m’aiment
  rationale: Le participe substantivé avec suffixe de première personne se rend naturellement par une proposition relative.
- source_word: אֵהָב
  choice: J’aime
  rationale: L’imparfait hébreu exprime ici au mieux une vérité générale; le présent français convient au caractère proverbial de l’énoncé.
- source_word: מְשַׁחֲרַי
  choice: ceux qui me cherchent avec empressement
  rationale: Le participe de שׁחר peut évoquer une recherche faite de bonne heure et, par extension, une recherche ardente ou assidue. «Avec empressement» transmet cette intensité sans imposer un sens exclusivement temporel.
- source_word: יִמְצָאֻנְנִי
  choice: me trouvent
  rationale: Le présent rend naturellement la portée générale et proverbiale de l’imparfait hébreu, en parallèle avec le premier membre.
theological_decisions:
- issue: Réciprocité de l’amour de la Sagesse
  choice: Présenter la parole comme un principe général énoncé par la Sagesse personnifiée.
  alternative: Y lire explicitement une affirmation sur l’élection, le salut ou le Christ.
  rationale: Dans Proverbes 8, la Sagesse parle sous une forme poétique personnifiée. La traduction conserve cette portée littéraire et théologique sans ajouter de catégorie doctrinale absente de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle est conservée, ainsi que le présent gnomique. Le féminin référentiel de la Sagesse n’exige ici aucune marque grammaticale dans les pronoms compléments.
