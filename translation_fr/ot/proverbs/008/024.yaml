id: PRO.8.24
reference: Proverbs 8:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/אֵין תְּהֹמ֥וֹת חוֹלָ֑לְתִּי בְּ/אֵ֥ין מַ֝עְיָנ֗וֹת נִכְבַּדֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: fr
  text: Quand il n’y avait pas d’abîmes, j’ai été enfantée[a], quand il n’y avait pas de sources chargées d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai été mise au monde » ou « j’ai été formée ». Le verbe hébreu peut évoquer un enfantement ; « j’ai été enfantée » conserve cette image sans en préciser davantage la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: quand il n’y avait pas
  rationale: Dans les deux membres parallèles, l’expression introduit une circonstance temporelle. Cette formulation française reste naturelle sans expliciter davantage par « avant qu’il y ait ».
- source_word: תְּהֹמוֹת
  choice: abîmes
  rationale: Le terme désigne les eaux profondes ou les profondeurs abyssales. « Abîmes » convient au contexte de la création sans ajouter la qualification « primitifs ».
- source_word: חוֹלָלְתִּי
  choice: j’ai été enfantée
  rationale: Le passif évoque ici la naissance de la Sagesse personnifiée. « Enfantée » conserve cette image poétique et le genre féminin du sujet sans tirer de conclusion doctrinale ultérieure.
- source_word: מַעְיָנוֹת
  choice: sources
  rationale: Le nom désigne des points d’où jaillit naturellement l’eau. « Sources » est le terme moderne le plus direct.
- source_word: נִכְבַּדֵּי מָיִם
  choice: chargées d’eau
  rationale: L’expression présente littéralement les sources comme lourdes ou chargées d’eau. Cette traduction conserve l’image concrète tout en restant idiomatique en français.
theological_decisions:
- issue: Le langage relatif à l’origine de la Sagesse en Proverbes 8
  choice: j’ai été enfantée
  alternative: j’ai été mise au monde ; j’ai été formée
  rationale: Le texte emploie une image de naissance pour la Sagesse personnifiée. La traduction la préserve sans imposer au passage poétique une conclusion christologique ou métaphysique.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme des deux propositions temporelles est conservé ; « chargées d’eau » maintient l’image hébraïque du poids sans lourdeur excessive en français.
