id: PRO.8.1
reference: Proverbs 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: fr
  text: La sagesse ne lance-t-elle pas son appel[a] ? L’intelligence ne fait-elle pas entendre sa voix[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne crie-t-elle pas ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne donne-t-elle pas sa voix ? » Cette expression hébraïque signifie qu’elle prend la parole ou élève la voix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative. La tournure négative interrogative en français en conserve clairement la force.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent usuel et direct du nom hébreu; l’article défini convient à la personnification développée dans le contexte.
- source_word: תִקְרָא
  choice: lance son appel
  rationale: Le qal de קרא signifie « appeler » ou « crier ». « Lancer son appel » est naturel en français et exprime ici un appel public sans exagérer nécessairement son volume.
- source_word: וּתְבוּנָה
  choice: l’intelligence
  rationale: תבונה désigne la faculté de comprendre, le discernement. « Intelligence » forme en français un couple naturel avec « sagesse », tout en restant distinct de la simple connaissance.
- source_word: תִּתֵּן קוֹלָהּ
  choice: fait entendre sa voix
  rationale: Littéralement « donne sa voix ». Cette expression française rend naturellement l’idée de prendre la parole et de parler publiquement, tout en préservant l’image de la voix.
theological_decisions:
- issue: Personnification de la sagesse et de l’intelligence
  choice: Conserver la personnification littéraire par les verbes d’action et la mention de « sa voix », sans majuscules théologiques.
  alternative: Dépersonnaliser les qualités abstraites, ou écrire « Sagesse » pour suggérer une identification théologique plus précise.
  rationale: Les noms hébreux sont féminins et le contexte présente la sagesse comme une femme qui appelle en public. Le français permet de garder cette personnification sans pronoms marqués et sans imposer une identification doctrinale que ce verset n’énonce pas.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux propositions et la question rhétorique sont conservés. « L’intelligence » est employé au sens de compréhension ou discernement, non de capacité intellectuelle mesurable.
