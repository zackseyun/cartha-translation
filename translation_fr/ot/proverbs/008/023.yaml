  text: מֵ֭/עוֹלָם נִסַּ֥כְתִּי מֵ/רֹ֗אשׁ מִ/קַּדְמֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: fr
  text: Depuis toujours, j’ai été établie[a], dès le commencement, avant l’existence de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai été mise en place » ; le sens du verbe hébreu est discuté. On l’a aussi compris comme « j’ai été installée » ou, moins probablement ici, « j’ai été ointe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: Depuis toujours
  rationale: Dans ce contexte antérieur à la création, עוֹלָם exprime un passé sans horizon assignable. « Depuis toujours » garde cette ampleur temporelle dans un français naturel, sans trancher explicitement entre éternité absolue et antiquité reculée.
- source_word: נִסַּכְתִּי
  choice: j’ai été établie
  rationale: Le nifal de נסך est discuté. « Établie » exprime ici la mise en place ou l’institution de la Sagesse avant la création, tout en évitant les connotations messianiques que pourrait introduire « ointe ».
- source_word: מֵרֹאשׁ
  choice: dès le commencement
  rationale: Dans cet emploi temporel, רֹאשׁ désigne le commencement. « Dès le commencement » restitue clairement la valeur de מִן et s’insère naturellement dans le parallélisme.
- source_word: מִקַּדְמֵי אָרֶץ
  choice: avant que la terre existe
  rationale: L’expression situe la Sagesse antérieurement à la terre. Cette formulation française explicite légèrement la relation temporelle implicite, tout en conservant le cadre cosmique où אָרֶץ signifie « terre » plutôt que « pays ».
theological_decisions:
- issue: Risque de lecture christologique excessive de la Sagesse personnifiée
  choice: Présenter la Sagesse personnifiée comme établie avant la création, sans terminologie explicitement messianique ou trinitaire.
  alternative: Traduire נִסַּכְתִּי par « j’ai été ointe », formulation susceptible d’orienter le verset vers une lecture messianique.
  rationale: La traduction doit d’abord rendre le sens littéraire immédiat du texte hébreu. Elle ne nie pas les lectures typologiques ultérieures, mais n’introduit pas dans le verset une identification doctrinale que celui-ci n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin d’« établie » correspond à la Sagesse personnifiée, nom féminin en français comme en hébreu. Le rythme ternaire du texte source est conservé, avec une légère explicitation finale pour éviter la tournure peu idiomatique « depuis avant la terre ».
