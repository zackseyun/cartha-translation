  text: ט֣וֹב פִּ֭רְיִ/י מֵ/חָר֣וּץ וּ/מִ/פָּ֑ז וּ֝/תְבוּאָתִ֗/י מִ/כֶּ֥סֶף נִבְחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/019.yaml
  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
translation:
  language: fr
  text: Mon fruit vaut mieux que l’or, même l’or fin, et mon produit vaut mieux que l’argent de choix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: vaut mieux que
  rationale: L’adjectif טוֹב suivi de la préposition comparative מִן exprime ici une comparaison. « Vaut mieux que » est naturel en français et convient à la comparaison avec des métaux précieux.
- source_word: פִּרְיִי
  choice: mon fruit
  rationale: Le nom désigne le fruit ou le produit. « Mon fruit » préserve l’image concrète de ce que la sagesse fait naître.
- source_word: מֵחָרוּץ
  choice: que l’or
  rationale: Dans la littérature sapientiale, חָרוּץ désigne couramment l’or. Le terme non qualifié permet de conserver la progression vers פָּז, l’or fin.
- source_word: וּמִפָּז
  choice: même que l’or fin
  rationale: פָּז désigne un or particulièrement pur ou raffiné. « Même que » rend l’intensification après la première mention de l’or.
- source_word: וּתְבוּאָתִי
  choice: et ce que je rapporte
  rationale: תְּבוּאָה peut désigner le produit, la récolte ou le revenu. Cette formulation française conserve l’idée de rendement tout en évitant la répétition peu naturelle de « produit » après « fruit ».
- source_word: מִכֶּסֶף נִבְחָר
  choice: vaut mieux que l’argent de choix
  rationale: נִבְחָר signifie « choisi » ou « de choix ». La reprise explicite de « vaut mieux » clarifie en français l’ellipse du parallélisme hébreu sans en modifier le sens.
