source:
  edition: WLC
  text: שִׁמְע֖וּ מוּסָ֥ר וַ/חֲכָ֗מוּ וְ/אַל תִּפְרָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: fr
  text: Écoutez l’instruction et devenez sages; ne la négligez pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne la rejetez pas » ou « ne la laissez pas échapper ». Le verbe hébreu peut exprimer le fait d’abandonner ou de négliger l’instruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel exprime une écoute attentive pouvant conduire à l’obéissance, sans réduire d’emblée le sens à « obéissez ».
- source_word: מוּסָר
  choice: l’instruction
  rationale: Dans la littérature de sagesse, le terme désigne une formation qui peut inclure discipline et correction. « Instruction » convient au contexte pédagogique et reste naturel en français.
- source_word: וַחֲכָמוּ
  choice: et devenez sages
  rationale: L’impératif du verbe חכם présente ici l’acquisition de la sagesse, et non seulement la possession d’une qualité déjà acquise.
- source_word: וְאַל תִּפְרָעוּ
  choice: ne la négligez pas
  rationale: Le verbe פרע peut évoquer le fait de laisser aller, d’abandonner ou de rejeter. Le pronom « la », nécessaire à la fluidité en français, reprend l’instruction mentionnée dans la première proposition.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le pluriel des impératifs est conservé. Le point-virgule distingue clairement l’exhortation positive de l’avertissement final sans rompre leur coordination.
