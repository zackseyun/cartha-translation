id: PRO.8.27
reference: Proverbs 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/הֲכִינ֣/וֹ שָׁ֭מַיִם שָׁ֣ם אָ֑נִי בְּ/ח֥וּק/וֹ ח֝֗וּג עַל פְּנֵ֥י תְהֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: fr
  text: Quand il établissait les cieux, j’étais là ; quand il traçait un cercle[a] à la surface de l’abîme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délimitait l’horizon » ; l’hébreu évoque un cercle ou une limite circulaire au-dessus des eaux profondes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: Quand il établissait
  rationale: La préposition ב avec l’infinitif construit et son suffixe a ici une valeur temporelle. « Établissait » exprime la mise en place et l’affermissement du cosmos ; l’imparfait convient aux actions évoquées dans cette scène de création.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Dans ce contexte cosmique, « les cieux » rend naturellement le pluriel hébreu tout en conservant la dignité poétique du passage.
- source_word: שָׁם אָ֑נִי
  choice: j’étais là
  rationale: שָׁם est locatif. Le français exige l’ajout du verbe être, mis à l’imparfait dans ce récit rétrospectif de la création.
- source_word: בְּח֥וּק/וֹ
  choice: quand il traçait
  rationale: La construction a de nouveau une valeur temporelle. Avec חוּג pour complément, le verbe évoque concrètement le tracé ou la délimitation plutôt qu’un décret abstrait.
- source_word: חוּג
  choice: un cercle
  rationale: « Cercle » conserve l’image géométrique directe de l’hébreu sans imposer l’interprétation plus précise d’un horizon ou d’une voûte.
- source_word: עַל פְּנֵ֥י
  choice: à la surface de
  rationale: Cette tournure exprime ici la surface. La formulation française est naturelle et garde la relation spatiale de l’image hébraïque.
- source_word: תְהוֹם
  choice: l’abîme
  rationale: « L’abîme » désigne naturellement les eaux profondes primordiales dans un registre poétique français. Le contexte, et non un ajout explicatif, indique qu’il s’agit de la profondeur cosmique.
theological_decisions:
- issue: Image cosmologique dans le discours de la Sagesse
  choice: Présenter poétiquement la présence de la Sagesse lors de la création, en gardant l’image du cercle.
  alternative: Préciser « horizon » ou « voûte », ou formuler le verset de manière à imposer une lecture christologique ultérieure.
  rationale: Le texte hébreu personnifie la Sagesse et décrit la création sans définir un modèle cosmologique précis ni trancher les interprétations théologiques postérieures. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, poétique et digne. L’imparfait donne une continuité naturelle aux deux actes créateurs. « À la surface de » est plus idiomatique que le calque « sur la face de », tandis que « cercle » préserve l’image concrète de l’original.
