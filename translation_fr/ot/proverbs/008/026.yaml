source:
  edition: WLC
  text: עַד לֹ֣א עָ֭שָׂה אֶ֣רֶץ וְ/חוּצ֑וֹת וְ֝/רֹ֗אשׁ עָפְר֥וֹת תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/026.yaml
  text: before he had made the earth and the fields[b][a], or the first of the dust of the world.
translation:
  language: fr
  text: avant qu’il ait fait la terre et les vastes étendues[a], et les premières poussières du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les espaces ouverts ». Ailleurs, le mot hébreu peut désigner des rues, mais le contexte de la création favorise ici le sens de vastes espaces à découvert.
    reason: lexical_alternative
  - marker: b
    text: Ou « le commencement de la poussière du monde ». L’expression hébraïque est compacte et inhabituelle ; elle évoque probablement la toute première poussière ou le tout premier sol du monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד לֹא
  choice: avant que
  rationale: Dans cette construction temporelle suivie du verbe accompli, l’expression signifie idiomatiquement « avant que » et marque l’antériorité.
- source_word: עָשָׂה
  choice: ait fait
  rationale: Le verbe courant signifie « faire ». Après « avant que », le subjonctif passé exprime naturellement en français l’action envisagée comme non encore accomplie.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le contexte de la création et le parallélisme avec תֵּבֵל favorisent le sens cosmique de « terre » plutôt que celui, local, de « pays ».
- source_word: חוּצוֹת
  choice: les vastes étendues
  rationale: Le mot désigne des lieux extérieurs ou ouverts. Dans ce contexte préurbain de création, « vastes étendues » évite le sens habituel de « rues » tout en conservant l’idée d’espaces ouverts.
- source_word: רֹאשׁ עָפְרוֹת
  choice: les premières poussières
  rationale: L’expression hébraïque, compacte et inhabituelle, associe « commencement/premier » à un pluriel de « poussière/terre sèche ». Cette formulation française privilégie le sens primordial sans imposer une définition trop précise de la matière évoquée.
- source_word: תֵּבֵל
  choice: le monde
  rationale: Le terme désigne le monde ordonné, souvent considéré comme habitable ; « le monde » est ici précis, naturel et concis.
theological_decisions: []
