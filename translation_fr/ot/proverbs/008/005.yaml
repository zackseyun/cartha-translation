  variant: modern international French
source:
  edition: WLC
  text: הָבִ֣ינוּ פְתָאיִ֣ם עָרְמָ֑ה וּ֝/כְסִילִ֗ים הָבִ֥ינוּ לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: fr
  text: Vous qui êtes naïfs, apprenez la prudence ; vous qui êtes insensés, apprenez le discernement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cœur ». Ici, le cœur désigne la faculté intérieure de comprendre et de juger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִינוּ
  choice: apprenez
  rationale: L’impératif pluriel de בין appelle à comprendre et à acquérir la capacité de discerner. « Apprenez » exprime naturellement cette exhortation en français et permet de conserver la répétition hébraïque.
- source_word: פְתָאיִם
  choice: vous qui êtes naïfs
  rationale: Dans les Proverbes, פתי désigne les personnes inexpérimentées, crédules ou facilement influençables, et non des personnes déficientes sur le plan intellectuel.
- source_word: עָרְמָה
  choice: la prudence
  rationale: Dans ce contexte positif de sagesse, ערמה désigne une finesse de jugement pratique, non la ruse trompeuse. « Prudence » en rend clairement la valeur favorable.
- source_word: וּכְסִילִים
  choice: vous qui êtes insensés
  rationale: כסילים désigne, dans le vocabulaire sapientiel, des personnes réfractaires à la sagesse. « Insensés » conserve la portée morale du terme et la forme d’interpellation.
- source_word: הָבִינוּ
  choice: apprenez
  rationale: La reprise de « apprenez » reproduit le parallélisme et la répétition de l’impératif hébreu dans une formulation française naturelle.
- source_word: לֵב
  choice: le discernement
  rationale: Littéralement « cœur », לב désigne ici la faculté intérieure de comprendre, de juger et de discerner. « Discernement » communique cette fonction en français moderne, tandis que le sens littéral est signalé en note.
