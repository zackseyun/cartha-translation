id: PRO.8.16
reference: Proverbs 8:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ֭/י שָׂרִ֣ים יָשֹׂ֑רוּ וּ֝/נְדִיבִ֗ים כָּל שֹׁ֥פְטֵי צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: fr
  text: Par moi, les dirigeants gouvernent, et les nobles, tous les juges qui rendent la justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit plus littéralement « juges de justice »; le mot peut aussi évoquer ce qui est droit ou conforme à la rectitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Par moi
  rationale: La préposition ב avec le suffixe de première personne exprime ici le moyen ou l’action médiatrice de la Sagesse. « Par moi » est concis et conserve cette relation sans préciser davantage sa portée théologique.
- source_word: שָׂרִים
  choice: les dirigeants
  rationale: Le terme désigne des princes ou de hauts responsables exerçant l’autorité. « Dirigeants » est actuel, compréhensible et n’évoque pas seulement des membres d’une famille royale.
- source_word: יָשֹׂרוּ
  choice: gouvernent
  rationale: Le verbe שׂרר signifie exercer le pouvoir ou la domination. « Gouvernent » rend naturellement cette fonction politique en français.
- source_word: וּנְדִיבִים
  choice: et les nobles
  rationale: Le nom désigne des personnes de rang élevé ou des notables. « Nobles » maintient la distinction avec les dirigeants de la première proposition.
- source_word: כָּל
  choice: tous
  rationale: Le quantificateur est rendu explicitement et conserve la valeur récapitulative ou appositive de la fin du verset.
- source_word: שֹׁפְטֵי צֶדֶק
  choice: tous ceux qui jugent avec justice
  rationale: Cette formulation française naturelle conserve l’action judiciaire exprimée par שׁפט et la notion de rectitude ou de justice portée par צֶדֶק, sans réduire celle-ci à une simple qualité personnelle.
- source_word: צֶדֶק
  choice: justice
  rationale: Dans ce contexte judiciaire, « justice » convient directement, tout en pouvant évoquer à la fois la conformité morale au droit et l’équité dans le jugement.
theological_decisions:
- issue: Rôle de la Sagesse dans l’exercice de l’autorité politique
  choice: Le verset affirme que les responsables gouvernent et jugent par la Sagesse, sans déclarer que tout exercice concret du pouvoir reçoit son approbation.
  alternative: Comprendre le verset comme une affirmation selon laquelle toute autorité politique serait directement légitimée par la Sagesse.
  rationale: Le syntagme בִּי présente la Sagesse comme moyen ou principe de l’exercice du gouvernement. La traduction garde cette affirmation sans lui ajouter une doctrine générale sur la légitimité de chaque dirigeant.
- issue: Rapport syntaxique entre « les nobles » et la proposition finale
  choice: Conserver par des virgules la construction appositive ou récapitulative du texte hébreu.
  alternative: Ajouter un verbe ou un lien explicatif qui ferait de la proposition finale une affirmation syntaxiquement indépendante.
  rationale: L’hébreu est compact et permet de comprendre la fin comme une apposition ou une précision. La ponctuation retenue préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et proverbial. La phrase reste compacte et conserve la syntaxe appositive de l’hébreu, tandis que « tous ceux qui jugent avec justice » évite en français la tournure peu naturelle « juges de justice ».
