review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens général sont bien rendus : בִּי exprime le moyen (« Par moi »), et les deux groupes de détenteurs d’autorité sont maintenus. Toutefois, « tous ceux qui jugent avec justice » transforme le syntagme nominal שֹׁפְטֵי צֶדֶק (« juges de… ») en une relative verbale et présente צֶדֶק surtout comme une manière de juger. « Tous les juges qui rendent la justice » conserve plus clairement la désignation de juges et le domaine judiciaire de צֶדֶק, sans prétendre trancher entre justice et rectitude.'
  naturalness: « Par moi, les dirigeants gouvernent » est naturel dans un registre proverbial moderne. « Tous les juges qui rendent la justice » est idiomatique en français international et s’intègre à l’apposition compacte après « les nobles ».
  terminology: « Dirigeants » convient à שָׂרִים et « nobles » à נְדִיבִים. « Rendre la justice » est une expression judiciaire française usuelle qui préserve le sens de צֶדֶק dans ce contexte; la note conserve l’alternative plus formelle et la portée de rectitude.
  issues:
  - severity: low
    issue: Le groupe « tous ceux qui jugent avec justice » ne maintient pas explicitement le nom « juges ».
    rationale: שֹׁפְטֵי est un nom en construit (« juges de… »). Une formulation avec « juges » préserve mieux la forme et l’identification des personnes visées, tout en restant naturelle.
  revised_text: Par moi, les dirigeants gouvernent, et les nobles, tous les juges qui rendent la justice[a].
