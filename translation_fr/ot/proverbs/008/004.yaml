  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: fr
  text: C’est vous, les hommes, que j’appelle ; ma voix s’adresse aux êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de l’homme », expression hébraïque courante pour désigner les êtres humains.'
    reason: Précision sur la forme littérale et la portée collective de בְּנֵי אָדָם, sans identifier indûment אָדָם au nom propre Adam.
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: C’est vous … que
  rationale: La tournure emphatique rend naturellement l’adresse directe marquée par la préposition אֶל et le suffixe de deuxième personne du pluriel.
- source_word: אִישִׁים
  choice: les hommes
  rationale: Le pluriel désigne ici des hommes et conserve la formulation masculine du premier membre du parallélisme, sans l’aplanir en « gens ».
- source_word: אֶקְרָא
  choice: j’appelle
  rationale: Le qal inaccompli de קרא exprime ici l’action d’appeler ou d’interpeller ; « j’appelle » en donne le sens direct.
- source_word: וְקוֹלִי
  choice: ma voix
  rationale: Le substantif avec suffixe de première personne est conservé afin de respecter l’image et le parallélisme hébreux.
- source_word: אֶל
  choice: s’adresse à
  rationale: Avec « ma voix » comme sujet, « s’adresse à » exprime idiomatiquement en français l’orientation indiquée par אֶל.
- source_word: בְּנֵי אָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque, littéralement « les fils d’Adam », désigne couramment l’ensemble des humains. La traduction idiomatique évite de faire croire qu’il s’agit seulement de descendants mâles, tandis que la forme source est signalée en note.
theological_decisions:
- issue: Langage anthropologique genré dans le parallélisme
  choice: Conserver « les hommes » dans le premier membre et rendre l’expression générique בְּנֵי אָדָם par « les êtres humains » dans le second.
  alternative: « hommes … fils d’Adam » ou « gens … êtres humains »
  rationale: 'Cette solution maintient la différence entre les deux expressions hébraïques : אִישִׁים reste explicitement masculin, alors que בְּנֵי אָדָם est une locution collective courante. Elle ne masculinise pas indûment la portée du second membre et n’efface pas non plus la forme du premier.'
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La construction emphatique « C’est vous … que » rend l’interpellation avec naturel ; le point-virgule fait ressortir le parallélisme poétique.
