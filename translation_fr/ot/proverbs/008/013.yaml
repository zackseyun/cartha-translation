  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: fr
  text: Craindre l’Éternel, c’est détester le mal. L’orgueil, l’arrogance, la voie du mal et une bouche aux paroles perverses[a], je les déteste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une bouche de perversités » ; autre traduction possible : « une bouche perverse » ou « une bouche aux paroles tortueuses ».'
    reason: Alternative lexicale et préservation de la construction hébraïque.
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: Craindre l’Éternel
  rationale: Le syntagme construit désigne la crainte révérencielle envers YHWH. La tournure verbale est naturelle en français, et « l’Éternel » est une manière française traditionnelle et intelligible de rendre le nom divin.
- source_word: שְׂנֹאת רָע
  choice: c’est détester le mal
  rationale: L’infinitif construit a ici une fonction prédicative. « C’est détester » conserve sa force verbale et exprime clairement que la crainte de YHWH se manifeste par le rejet du mal moral.
- source_word: גֵּאָה וְגָאוֹן
  choice: l’orgueil, l’arrogance
  rationale: Les deux noms proches sont distingués par deux termes français courants, qui préservent leur accumulation rhétorique.
- source_word: דֶרֶךְ רָע
  choice: la voie du mal
  rationale: Cette formulation conserve la métaphore hébraïque d’une conduite ou d’un parcours caractérisé par le mal.
- source_word: פִי תַהְפֻּכוֹת
  choice: les paroles perverses
  rationale: Littéralement « une bouche de choses perverses/renversements ». La métonymie de la bouche désignant la parole est rendue naturellement en français, sans perdre l’idée d’un discours moralement dévoyé.
- source_word: שָׂנֵאתִי
  choice: je les déteste
  rationale: Le parfait à la première personne exprime ici une attitude constante dans le discours de la Sagesse. Le pronom « les » reprend clairement les éléments de la liste en français.
theological_decisions:
- issue: Identité du locuteur dans le discours de la Sagesse
  choice: Conserver la première personne « je » sans identifier explicitement le locuteur dans le verset.
  alternative: Ajouter « la Sagesse dit » ou assimiler explicitement le « je » à Dieu.
  rationale: L’hébreu maintient la première personne dans le contexte du discours de la Sagesse. Une identification ajoutée résoudrait une tension littéraire et théologique que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La première proposition garde une structure proverbiale nette ; la seconde conserve l’accumulation solennelle des vices tout en employant une formulation idiomatique.
