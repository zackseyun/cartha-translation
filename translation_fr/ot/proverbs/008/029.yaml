  variant: modern international French
source:
  edition: WLC
  text: בְּ/שׂ֘וּמ֤/וֹ לַ/יָּ֨ם חֻקּ֗/וֹ וּ֭/מַיִם לֹ֣א יַֽעַבְרוּ פִ֑י/ו בְּ֝/חוּק֗/וֹ מ֣וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: fr
  text: quand il fixa à la mer sa limite[a], afin que les eaux ne dépassent pas l’ordre qu’il avait donné[b], quand il traça les fondations de la terre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son décret pour la mer » ou « sa limite » ; le terme hébreu peut désigner une prescription fixée ou une limite, et le suffixe peut se rapporter à Dieu ou à la mer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sa bouche » ; il s’agit de ce que Dieu avait ordonné.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: quand il fixa
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe sujet exprime ici naturellement le temps. « Fixa » convient à l’établissement d’une limite.
- source_word: לַיָּם חֻקּוֹ
  choice: une limite à la mer
  rationale: חֹק peut désigner une prescription ou une limite fixée. Dans cette scène de création, « fixer une limite à la mer » rend clairement l’image concrète, tout en signalant l’ambiguïté du suffixe en note.
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: afin que les eaux ne franchissent pas
  rationale: La coordination introduit ici naturellement le but ou le résultat. עבר signifie passer, traverser ou dépasser; « franchir » convient à la fois à une limite et à un ordre.
- source_word: פִּיו
  choice: l’ordre de sa bouche
  rationale: Le texte dit littéralement « sa bouche ». Cette formulation française conserve la métonymie hébraïque tout en rendant explicite que les eaux ne doivent pas dépasser ce que Dieu ordonne.
- source_word: בְּחוּקוֹ
  choice: quand il traça
  rationale: L’infinitif construit de חקק, précédé de בְּ, a de nouveau une valeur temporelle. Avec les fondations de la terre, « tracer » préserve l’image d’une délimitation ou d’un dessin créateur.
- source_word: מוֹסְדֵי אָרֶץ
  choice: les fondations de la terre
  rationale: Traduction directe du groupe construit, qui conserve l’imagerie cosmologique et poétique du texte.
theological_decisions:
- issue: L’imagerie de la création dans le discours de la Sagesse
  choice: Présenter Dieu comme celui qui ordonne la création au moyen de limites et de fondations.
  alternative: Interpréter l’image de façon purement abstraite, ou lui imposer dans le texte principal une lecture christologique ultérieure.
  rationale: Le verset décrit poétiquement l’organisation de la création. La traduction conserve cette image concrète sans trancher des débats théologiques dépassant ce que dit l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « quand il » reproduit la structure temporelle du verset. « L’ordre de sa bouche » maintient l’image hébraïque inhabituelle sans devenir obscure. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
