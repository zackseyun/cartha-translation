  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/אַשְׁרֵ֗י דְּרָכַ֥/י יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: fr
  text: 'Et maintenant, fils[a], écoutez-moi : heureux ceux qui observent mes voies.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants ». L’hébreu dit littéralement « fils », forme masculine plurielle habituelle dans l’enseignement de sagesse, bien que l’exhortation ait une portée générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: La conjonction suivie de l’adverbe temporel marque à la fois la continuité du discours et un tournant exhortatif.
- source_word: בָנִים
  choice: fils
  rationale: Le terme hébreu est un pluriel masculin et constitue une adresse pédagogique courante dans la littérature de sagesse. Le possessif « mes » n’est pas exprimé.
- source_word: שִׁמְעוּ לִי
  choice: écoutez-moi
  rationale: La construction avec ל désigne une écoute attentive tournée vers la locutrice. « Écoutez-moi » conserve l’impératif sans expliciter excessivement l’idée d’obéissance.
- source_word: וְאַשְׁרֵי
  choice: Heureux
  rationale: La formule exprime l’état enviable et favorable de ceux qui suivent les voies de la Sagesse. « Heureux » est la tournure française naturelle et consacrée des béatitudes.
- source_word: דְּרָכַי
  choice: mes voies
  rationale: Dans ce contexte sapientiel, le pluriel désigne une manière de vivre ou une ligne de conduite; « voies » en préserve la métaphore.
- source_word: יִשְׁמֹרוּ
  choice: gardent
  rationale: Le verbe peut signifier garder, observer ou veiller sur. « Gardent » maintient à la fois l’idée d’attention vigilante et celle de mise en pratique.
theological_decisions:
- issue: Adresse masculine dans l’enseignement de sagesse
  choice: fils
  alternative: enfants
  rationale: « Fils » reflète la forme masculine plurielle du texte et l’adresse pédagogique conventionnelle des Proverbes. Une note signale « enfants », puisque la portée de l’exhortation ne se limite pas nécessairement aux hommes.
translation_notes:
  register: Français international moderne, naturel et digne. Les exclamations rendent la vigueur de l’impératif et de la formule de félicitation, tout en conservant la métaphore sapientielle des « voies ».
