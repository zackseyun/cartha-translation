id: PRO.8.35
reference: Proverbs 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: fr
  text: Car quiconque me trouve trouve la vie et obtient la faveur de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison qui fonde l’exhortation précédente; « car » rend naturellement ce lien explicatif en français.
- source_word: מֹצְאִי
  choice: quiconque me trouve
  rationale: La forme désigne littéralement « celui qui me trouve », avec un suffixe de première personne renvoyant à la Sagesse personnifiée. « Quiconque » exprime clairement la portée générique et universelle.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le mot soit morphologiquement pluriel en hébreu, il désigne couramment la vie comme réalité globale; le singulier est l’équivalent idiomatique en français.
- source_word: וַיָּפֶק
  choice: obtient
  rationale: Le verbe peut évoquer le fait de faire sortir, d’acquérir ou d’obtenir. Avec la faveur divine pour complément, « obtient » exprime sobrement le résultat sans suggérer qu’elle serait méritée.
- source_word: רָצוֹן
  choice: la faveur
  rationale: Dans cette construction, le terme désigne la bienveillance ou l’approbation accordée par Dieu. « La faveur » conserve ce sens relationnel et convient au français courant.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: La préposition מִן marque ici la source de la faveur. Le nom divin יהוה est rendu par « Yahweh », transcription française claire du tétragramme.
theological_decisions:
- issue: Portée du singulier générique dans le discours de la Sagesse personnifiée
  choice: quiconque me trouve
  alternative: celui qui me trouve
  rationale: Le masculin singulier hébreu a une portée générique et ne limite pas l’énoncé aux hommes. « Quiconque » préserve cette universalité sans effacer le caractère individuel de l’affirmation.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Relation entre la découverte de la Sagesse, la vie et la faveur divine
  choice: trouve la vie et obtient la faveur
  alternative: a trouvé la vie et reçu la faveur
  rationale: Le présent français préserve la portée générale de la maxime. « Obtient » maintient le lien affirmé par le texte sans préciser le mécanisme théologique ni présenter la faveur comme un salaire mérité.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « trouve… trouve » est conservée parce qu’elle reflète la formulation concise et emphatique de l’hébreu. Aucun marqueur de note n’est nécessaire.
