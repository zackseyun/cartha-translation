source:
  edition: WLC
  text: אֲֽנִי חָ֭כְמָה שָׁכַ֣נְתִּי עָרְמָ֑ה וְ/דַ֖עַת מְזִמּ֣וֹת אֶמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/012.yaml
  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: fr
  text: Moi, la sagesse, j’habite avec la prudence, et je trouve la connaissance et le discernement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Moi, la sagesse, j’ai habité avec la prudence, et je trouve la connaissance et le discernement. » La forme verbale hébraïque peut être comprise comme un accompli. Le terme rendu par « discernement » peut aussi désigner des projets, des desseins ou des dispositifs, selon le contexte.'
    reason: Variante de temps verbal et éventail lexical de מְזִמּוֹת.
lexical_decisions:
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Le nom désigne la sagesse, ici personnifiée. La minuscule préserve cette personnification poétique sans en faire nécessairement un nom propre.
- source_word: שָׁכַנְתִּי
  choice: j’habite
  rationale: Le verbe שׁכן exprime le fait d’habiter ou de demeurer. Le présent convient au discours poétique immédiat, bien que la forme hébraïque puisse aussi recevoir une traduction accomplie.
- source_word: עָרְמָה
  choice: la prudence
  rationale: Dans ce contexte positif des Proverbes, le terme évoque une intelligence pratique et avisée, non la ruse trompeuse.
- source_word: דַעַת
  choice: la connaissance
  rationale: Cette traduction courante maintient la distinction entre la connaissance et la sagesse.
- source_word: מְזִמּוֹת
  choice: des projets avisés
  rationale: Le pluriel peut désigner des projets, des desseins ou la capacité de réflexion. « Projets avisés » conserve la construction avec דַעַת et le sens positif suggéré par le contexte.
- source_word: אֶמְצָא
  choice: je trouve
  rationale: Le verbe מצא signifie normalement « trouver ». Cette traduction garde l’image simple de l’hébreu sans la remplacer par l’interprétation « posséder ».
- source_word: וְ
  choice: et
  rationale: La conjonction relie directement les deux propositions et conserve leur parallélisme.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Présenter la sagesse comme la locutrice personnifiée, sans majuscule ni identification doctrinale ajoutée.
  alternative: Employer « Sagesse » comme nom propre ou introduire une identification christologique.
  rationale: Le chapitre met poétiquement la sagesse en scène comme une personne. La traduction préserve ce procédé sans trancher une identification théologique que ce verset n’énonce pas.
- issue: Rapport entre דַעַת et מְזִמּוֹת
  choice: Traduire la construction comme « la connaissance des projets avisés ».
  alternative: 'Coordonner les deux noms : « la connaissance et le discernement ».'
  rationale: L’hébreu ne place pas de conjonction entre les deux noms ; les lire comme une construction liée respecte mieux la forme du texte tout en laissant à מְזִמּוֹת sa nuance contextuelle positive.
translation_notes:
  register: Français international moderne, naturel et digne. L’apposition « Moi, la sagesse » rend clairement la personnification. « Projets avisés » conserve la relation syntaxique des deux noms hébreux tout en exprimant leur valeur positive dans le contexte sapiential.
