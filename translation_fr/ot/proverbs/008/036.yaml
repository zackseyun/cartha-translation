  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: fr
  text: Mais celui qui pèche contre moi[a] se fait du tort à lui-même[b] ; tous ceux qui me haïssent aiment la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi évoquer l’idée de « manquer », notamment manquer un but.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fait violence à sa vie / sa personne » ; le mot hébreu peut aussi désigner l’âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: celui qui pèche contre moi
  rationale: Le participe de חטא avec le suffixe de première personne peut évoquer le fait de manquer ou de pécher contre quelqu’un. En français, « pèche contre moi » exprime clairement la portée relationnelle et morale du contexte, tandis que l’autre nuance demeure signalée en note.
- source_word: חֹמֵס
  choice: fait violence à
  rationale: Le participe de חמס désigne l’action de violenter, léser ou faire du tort. « Fait violence à » conserve ici la vigueur inhabituelle de l’expression hébraïque.
- source_word: נַפְשׁוֹ
  choice: sa propre vie
  rationale: נפש peut désigner la vie, la personne ou l’être lui-même. « Sa propre vie » rend le caractère autodestructeur du rejet de la Sagesse sans imposer une distinction technique entre corps et âme.
- source_word: כָּל מְשַׂנְאַי
  choice: tous ceux qui me haïssent
  rationale: Cette formulation française naturelle préserve le quantificateur universel et le suffixe de première personne.
- source_word: אָהֲבוּ
  choice: aiment
  rationale: Bien que la forme hébraïque soit un accompli, le parallélisme proverbial énonce une vérité générale, naturellement rendue au présent en français.
- source_word: מָוֶת
  choice: la mort
  rationale: Traduction directe qui maintient l’opposition, centrale dans le chapitre, entre la vie offerte par la Sagesse et la mort.
theological_decisions:
- issue: Portée anthropologique de נַפְשׁוֹ
  choice: sa propre vie
  alternative: son âme ; lui-même
  rationale: « Sa propre vie » garde ensemble les sens de vie et de personne, et évite de réduire נֶפֶשׁ à une âme immatérielle distincte du corps.
- issue: Sens de חֹטְאִי avec la Sagesse pour objet
  choice: celui qui pèche contre moi
  alternative: celui qui me manque ; celui qui ne me trouve pas
  rationale: Le verbe permet l’idée de manquer, mais « pécher contre » rend mieux en français la faute personnelle mise en parallèle avec la haine de la Sagesse, sans exclure entièrement l’image sous-jacente du but manqué.
translation_notes:
  register: Français moderne, courant et digne. Le tour « fait violence à sa propre vie » conserve la force poétique et le parallélisme du proverbe tout en restant compréhensible.
