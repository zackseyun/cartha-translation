source:
  edition: WLC
  text: כֻּלָּ֣/ם נְ֭כֹחִים לַ/מֵּבִ֑ין וִֽ֝/ישָׁרִ֗ים לְ/מֹ֣צְאֵי דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/009.yaml
  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
translation:
  language: fr
  text: Toutes sont sans détour pour qui comprend[a], et droites pour ceux qui trouvent la connaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droites », « directes » ou « claires ». L’hébreu décrit les paroles de la sagesse comme non tortueuses pour la personne qui comprend.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Toutes
  rationale: Le féminin pluriel renvoie naturellement en français aux paroles de la sagesse évoquées dans le contexte immédiat, tout en conservant la totalité exprimée par l’hébreu.
- source_word: נְכֹחִים
  choice: claires
  rationale: Dans le contexte de paroles adressées à l’intelligence, « claires » exprime ce qui est direct, évident et sans détour, tout en restant naturel en français.
- source_word: לַמֵּבִין
  choice: pour qui comprend
  rationale: Cette formulation rend la relation marquée par ל et le participe de בין sans introduire de genre inutile; elle désigne la personne douée de compréhension.
- source_word: וִישָׁרִים
  choice: et droites
  rationale: « Droites » conserve l’image hébraïque de rectitude et fait écho au contraste du verset précédent avec ce qui est tortueux ou pervers.
- source_word: לְמֹצְאֵי
  choice: pour ceux qui trouvent
  rationale: 'Le participe garde son sens actif et expérientiel: il s’agit de personnes qui accèdent à la connaissance.'
- source_word: דָעַת
  choice: la connaissance
  rationale: « Connaissance » préserve la distinction lexicale avec בין, rendu par « comprend » dans le premier membre.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme hébreu est conservé, avec « claires » dans le premier membre et « droites » dans le second; l’antécédent féminin pluriel « paroles » demeure implicite comme dans le texte source, mais se comprend grâce au contexte.
