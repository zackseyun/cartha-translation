  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: fr
  text: Celui dont le cœur se détourne sera rassasié de ses voies[a], et l’homme bon de ce qui vient de lui-même[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera rassasié du fruit de sa conduite ».'
    reason: La préposition indique la source ; « fruit » explicite les conséquences produites par la conduite, mais ce mot n’apparaît pas dans l’hébreu.
  - marker: b
    text: 'L’hébreu du second membre est difficile. On peut aussi comprendre : « et l’homme bon de ses propres actes ».'
    reason: La formule וּמֵעָלָיו est elliptique et peut renvoyer à ce qui procède de l’homme bon, notamment à sa conduite.
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: de ses propres voies
  rationale: La préposition מִן indique ici la source de ce dont quelqu’un est rassasié. « De ses propres voies » conserve la métaphore et le parallélisme sans ajouter explicitement « fruit » ou « conséquences ».
- source_word: יִשְׂבַּע
  choice: sera rassasié
  rationale: Le verbe signifie être repu, comblé ou rassasié. « Sera rassasié » garde l’image concrète et permet de sous-entendre le même verbe dans le second membre.
- source_word: סוּג לֵב
  choice: celui dont le cœur se détourne
  rationale: סוּג exprime l’action de se retirer ou de se détourner. Cette formulation naturelle conserve l’orientation intérieure indiquée par לֵב sans imposer le terme confessionnel « apostat ».
- source_word: וּמֵעָלָיו
  choice: et … de ce qui vient de lui-même
  rationale: L’expression est difficile et elliptique. Dans le parallélisme, elle semble désigner ce qui procède de l’homme bon lui-même, probablement sa conduite; la traduction garde cette indétermination plutôt que d’ajouter « œuvres ».
- source_word: אִישׁ טוֹב
  choice: l’homme bon
  rationale: Cette traduction reproduit la forme masculine singulière et convient au style proverbial français.
theological_decisions:
- issue: Nature de la rétribution exprimée dans les deux membres
  choice: Conserver l’image d’une personne rassasiée de ce qui provient de sa propre orientation ou conduite
  alternative: Expliciter une récompense divine ou les conséquences morales des actes
  rationale: Le texte met en parallèle les voies de celui qui se détourne et ce qui vient de l’homme bon, sans nommer directement Dieu ni préciser le mécanisme de la rétribution.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le verset conserve le parallélisme, la métaphore du rassasiement et l’obscurité réelle du second membre; les notes signalent les principales explicitations possibles.
