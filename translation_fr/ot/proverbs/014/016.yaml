source:
  edition: WLC
  text: חָכָ֣ם יָ֭רֵא וְ/סָ֣ר מֵ/רָ֑ע וּ֝/כְסִ֗יל מִתְעַבֵּ֥ר וּ/בוֹטֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: fr
  text: Le sage craint le mal et s’en détourne, mais l’insensé se laisse emporter[a] et se croit en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’emporte », « agit sans retenue » ou « franchit les limites » ; le verbe hébreu est difficile et décrit probablement ici un comportement irréfléchi et incontrôlé.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: le sage
  rationale: L’adjectif masculin singulier est employé comme substantif. « Le sage » est naturel en français et conserve la forme proverbiale générale.
- source_word: יָרֵא
  choice: craint
  rationale: Le verbe signifie fondamentalement « craindre ». Ici, il exprime une crainte prudente devant le mal, sans introduire explicitement la crainte de Dieu, qui n’est pas nommée dans ce verset.
- source_word: וְסָר
  choice: et s’en détourne
  rationale: Le verbe סור signifie se détourner, s’écarter. Le pronom « en » reprend naturellement « le mal » en français.
- source_word: מֵרָע
  choice: le mal
  rationale: רַע peut désigner le mal moral ou ce qui est nuisible. Dans ce contraste sapientiel, « le mal » préserve au mieux cette portée sans la réduire au seul danger.
- source_word: כְסִיל
  choice: l’insensé
  rationale: Terme courant des Proverbes pour une personne moralement et intellectuellement dépourvue de sagesse. « L’insensé » appartient au registre biblique tout en restant compréhensible.
- source_word: מִתְעַבֵּר
  choice: se laisse emporter
  rationale: La forme hitpael de עבר est difficile; elle peut évoquer le fait de déborder, de franchir les limites ou de s’emporter. « Se laisse emporter » conserve à la fois l’idée d’absence de maîtrise et une possible nuance de colère.
- source_word: וּבוֹטֵחַ
  choice: et se croit en sécurité
  rationale: בטח exprime la confiance ou le sentiment de sécurité. Comme aucun objet de confiance n’est indiqué et que le contexte est négatif, cette formulation rend une assurance mal placée sans ajouter explicitement l’idée de confiance en soi.
theological_decisions: []
