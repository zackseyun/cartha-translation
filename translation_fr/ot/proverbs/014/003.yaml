  text: בְּֽ/פִי אֱ֭וִיל חֹ֣טֶר גַּאֲוָ֑ה וְ/שִׂפְתֵ֥י חֲ֝כָמִ֗ים תִּשְׁמוּרֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: fr
  text: Dans la bouche de l’insensé se trouve un bâton d’orgueil[a], mais les lèvres des sages les protègent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un rejet d’orgueil ». Le mot hébreu peut désigner un bâton, un rejet ou un rameau.'
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom « les » renvoie probablement aux sages : leurs lèvres les protègent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  choice: Dans la bouche de
  rationale: La tournure locative conserve l’image hébraïque de ce qui se trouve dans la bouche, c’est-à-dire dans la parole, sans la paraphraser.
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Dans les Proverbes, le terme désigne une personne moralement obtuse ou obstinée, et non simplement quelqu’un qui manque d’intelligence.
- source_word: חֹטֶר
  choice: un bâton
  rationale: Le mot peut désigner un bâton, mais aussi un rejet ou un rameau. Dans ce contexte, « bâton » exprime plus naturellement l’image menaçante ou punitive d’une parole orgueilleuse, tout en laissant l’autre sens en note.
- source_word: גַּאֲוָה
  choice: d’orgueil
  rationale: Cette traduction directe conserve la construction nominale concise et l’image dense de l’hébreu.
- source_word: וְשִׂפְתֵי
  choice: mais les lèvres de
  rationale: « Mais » rend le contraste entre les deux membres du proverbe; « lèvres » maintient le parallélisme poétique avec « bouche ».
- source_word: חֲכָמִים
  choice: des sages
  rationale: L’adjectif substantivé désigne collectivement les personnes sages; « les sages » est naturel dans la littérature sapientielle française.
- source_word: תִּשְׁמוּרֵם
  choice: les protègent
  rationale: Le verbe signifie garder, préserver ou protéger, et le suffixe masculin pluriel signifie « les ». « Protègent » exprime clairement l’effet bénéfique des paroles sages sans remplacer le pronom par un antécédent explicite absent de l’hébreu.
theological_decisions:
- issue: Antécédent du pronom « les »
  choice: Conserver le pronom pluriel sans expliciter son antécédent dans le texte
  alternative: Traduire « protègent les sages » ou « protègent leurs propriétaires »
  rationale: Le suffixe hébreu est masculin pluriel et renvoie probablement aux sages eux-mêmes, mais son antécédent demeure implicite. Le conserver respecte la concision et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme « bouche / lèvres » et la métaphore compacte du bâton sont conservés; « insensé » garde la portée morale propre au vocabulaire sapientiel.
