  text: מַצִּ֣יל נְ֭פָשׁוֹת עֵ֣ד אֱמֶ֑ת וְ/יָפִ֖חַ כְּזָבִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
translation:
  language: fr
  text: Un témoin véridique sauve des vies[a], mais celui qui profère des mensonges[b] est trompeur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « délivre des personnes ». Le mot hébreu désigne ici des êtres vivants ou leur vie, et non spécialement des âmes immatérielles.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « exhale des mensonges ». L’hébreu emploie l’image vive du souffle pour parler de l’énonciation du mensonge.'
    reason: lexical_alternative
  - marker: c
    text: 'La fin peut aussi se rendre plus littéralement : « est tromperie », ou se comprendre : « profère des mensonges avec tromperie ». L’hébreu dit de façon très concise : « tromperie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: sauve
  rationale: Le participe hiphil de נצל exprime le fait de délivrer ou de préserver d’un danger. « Sauve » est ici naturel et concret, sans imposer un sens spécifiquement sotériologique.
- source_word: נְפָשׁוֹת
  choice: des vies
  rationale: Le pluriel de נֶפֶשׁ désigne ici des personnes considérées comme des êtres vivants, ou leur vie préservée, plutôt que des âmes immatérielles.
- source_word: עֵד אֱמֶת
  choice: un témoin véridique
  rationale: La tournure caractérise un témoin attaché à la vérité. « Véridique » convient au registre proverbial et exprime sa fiabilité.
- source_word: וְיָפִחַ
  choice: mais celui qui profère
  rationale: פוח évoque littéralement le fait de souffler ou d’exhaler, puis figurativement celui d’énoncer. « Profère » donne un français naturel; l’image littérale est signalée en note.
- source_word: כְּזָבִים
  choice: des mensonges
  rationale: Le nom pluriel désigne clairement des affirmations fausses; « mensonges » est le terme français courant et précis.
- source_word: מִרְמָה
  choice: n’est que tromperie
  rationale: Le substantif final forme une conclusion nominale très concise. Cette formulation française conserve la force de la caractérisation sans préciser indûment s’il s’agit de la personne ou de son acte.
theological_decisions:
- issue: Sens de נְפָשׁוֹת
  choice: des vies
  alternative: des âmes; des personnes
  rationale: Le contexte judiciaire et sapientiel porte sur la préservation de personnes ou de vies; traduire par « âmes » risquerait d’introduire une conception anthropologique étrangère au propos.
- issue: Rapport syntaxique de מִרְמָה à la proposition précédente
  choice: n’est que tromperie
  alternative: est trompeur; profère des mensonges avec tromperie
  rationale: L’hébreu juxtapose le substantif « tromperie » à la proposition, ce qui permet une caractérisation nominale ou une lecture adverbiale. Le texte principal garde une formulation nominale énergique, et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique du proverbe est conservée. « Véridique » maintient un registre sapientiel soutenu mais accessible; les notes rendent visibles l’image du souffle et la concision ambiguë du dernier terme hébreu.
