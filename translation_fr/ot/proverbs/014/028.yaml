  text: בְּ/רָב עָ֥ם הַדְרַת מֶ֑לֶךְ וּ/בְ/אֶ֥פֶס לְ֝אֹ֗ם מְחִתַּ֥ת רָזֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/028.yaml
  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: fr
  text: Une population nombreuse est la splendeur d’un roi, mais l’absence de peuple est la ruine[a] d’un dirigeant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’effroi » ou « la consternation » ; le terme hébreu peut évoquer aussi bien la peur que l’effondrement destructeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: Un peuple nombreux
  rationale: Cette formulation naturelle rend la grande quantité de population exprimée par בְּרָב עָם sans suggérer un État-nation moderne.
- source_word: הַדְרַת
  choice: splendeur
  rationale: Le nom désigne l’éclat, l’honneur ou la majesté; « splendeur » convient au prestige royal que manifeste une population nombreuse.
- source_word: מֶלֶךְ
  choice: d’un roi
  rationale: Le rapport construit est rendu naturellement en français par le complément possessif.
- source_word: וּבְאֶפֶס לְאֹם
  choice: mais l’absence de peuple
  rationale: אֶפֶס exprime ici le manque ou l’inexistence; « absence de peuple » préserve le contraste politique sans introduire l’idée moderne d’un État-nation.
- source_word: מְחִתַּת
  choice: ruine
  rationale: Le terme peut désigner l’effroi, la consternation ou l’effondrement. « Ruine » forme ici une antithèse nette avec la splendeur, tout en signalant l’autre possibilité en note.
- source_word: רָזוֹן
  choice: d’un dirigeant
  rationale: Le mot désigne une personne investie d’autorité, prince ou gouvernant. « Dirigeant » reste large et actuel sans imposer un rang précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé par la répétition de « peuple » et par l’opposition entre « splendeur » et « ruine ».
