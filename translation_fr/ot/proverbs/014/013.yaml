  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
translation:
  language: fr
  text: Même dans le rire, le cœur peut souffrir[a], et la fin de la joie, c’est le chagrin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Même dans le rire, le cœur souffre. » Dans le langage proverbial, l’imparfait hébreu peut exprimer une vérité générale au présent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et sa fin, [c’est] le chagrin ». On peut aussi traduire : « l’issue de la joie est le chagrin » ou, de façon plus interprétative, « après la joie vient le chagrin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Exprime ici la valeur concessive et emphatique : la douleur peut être présente malgré les rires.'
- source_word: בִּשְׂחוֹק
  choice: au milieu des rires
  rationale: Rend naturellement la préposition ב et conserve l’image concrète du rire ; le pluriel idiomatique français évoque une situation extérieure joyeuse.
- source_word: יִכְאַב
  choice: peut souffrir
  rationale: L’imparfait hébreu peut exprimer une vérité générale ou une possibilité dans le style proverbial ; « peut souffrir » préserve cette ouverture.
- source_word: לֵב
  choice: le cœur
  rationale: Équivalent traditionnel, clair et naturel de לֵב, désignant ici l’intériorité et le siège de la douleur.
- source_word: וְאַחֲרִיתָהּ
  choice: peut finir dans
  rationale: Formulation française naturelle qui rend l’idée de fin ou d’aboutissement, le suffixe féminin renvoyant vraisemblablement à la joie.
- source_word: שִׂמְחָה
  choice: la joie
  rationale: Équivalent moderne et courant, qui contraste nettement avec le chagrin.
- source_word: תוּגָה
  choice: le chagrin
  rationale: Rend la tristesse profonde exprimée par תוּגָה dans un français actuel et digne.
theological_decisions:
- issue: Portée de l’affirmation finale
  choice: la joie peut finir dans le chagrin
  alternative: la fin de la joie, c’est le chagrin
  rationale: L’hébreu ne marque pas explicitement la modalité. La formulation retenue évite de transformer le proverbe en affirmation universelle selon laquelle toute joie finit nécessairement dans le chagrin, tout en conservant son avertissement sobre ; la lecture plus formelle est signalée en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Au milieu des rires » est plus idiomatique que « dans le rire » et souligne le contraste entre l’apparence extérieure et l’état intérieur. Les deux marqueurs de note figurent dans le texte principal.
