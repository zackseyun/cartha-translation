  text: בְּ/אֵ֣ין אֲ֭לָפִים אֵב֣וּס בָּ֑ר וְ/רָב תְּ֝בוּא֗וֹת בְּ/כֹ֣חַ שֽׁוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/004.yaml
  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: fr
  text: Quand il n’y a pas de bœufs, la mangeoire[a] est propre, mais la force du bœuf procure d’abondantes récoltes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’auge ».
    reason: lexical_alternative
  - marker: b
    text: Ou « produits agricoles » ou « rendements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Quand il n’y a pas
  rationale: La préposition בְּ avec אֵין introduit une circonstance ou une condition. « Quand il n’y a pas » rend naturellement cette relation en français.
- source_word: אֲלָפִים
  choice: de bœufs
  rationale: Le pluriel peut désigner les bovins en général, mais le parallèle avec שׁוֹר et le contexte agricole orientent vers des animaux de trait. « Bœufs » convient à cette image.
- source_word: אֵבוּס
  choice: la mangeoire
  rationale: Le nom désigne l’endroit ou le récipient où mangent les animaux. « Mangeoire » est précis, courant et adapté au style proverbial.
- source_word: בָּר
  choice: est propre
  rationale: Dans ce contexte, l’adjectif évoque une mangeoire exempte des saletés liées à la présence des bœufs. « Propre » conserve le contraste concret avec la productivité.
- source_word: וְרָב
  choice: mais … d’abondantes
  rationale: Le וְ marque ici un contraste que le français exprime naturellement par « mais »; רָב indique la grande quantité.
- source_word: תְּבוּאוֹת
  choice: récoltes
  rationale: Le terme désigne les produits, revenus ou rendements agricoles. « Récoltes » maintient l’image concrète du travail des champs.
- source_word: בְּכֹחַ
  choice: la force … procure
  rationale: La préposition בְּ exprime le moyen ou la cause instrumentale. La tournure française avec « procure » rend clairement que l’abondance résulte de la force de l’animal.
- source_word: שׁוֹר
  choice: du bœuf
  rationale: Le singulier a une valeur générique et désigne ici le bovin employé pour les travaux agricoles.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et proverbial. La formulation conserve le contraste entre la propreté obtenue en l’absence d’animaux et l’abondance rendue possible par leur force, sans expliciter davantage l’application morale implicite.
