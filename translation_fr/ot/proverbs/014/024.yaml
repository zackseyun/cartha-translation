  text: עֲטֶ֣רֶת חֲכָמִ֣ים עָשְׁרָ֑/ם אִוֶּ֖לֶת כְּסִילִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: fr
  text: La couronne des sages est leur richesse, mais la folie des insensés est folie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon certaines versions anciennes et certains interprètes : « la richesse des insensés est folie ». Le texte massorétique dit littéralement : « la folie des insensés est folie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: Le nom désigne une couronne ou une parure honorifique. « Couronne » conserve clairement la métaphore d’honneur et de distinction visible.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Le pluriel désigne de manière générale les personnes sages. « Les sages » est naturel en français et n’ajoute aucune précision de genre absente du sens contextuel.
- source_word: עָשְׁרָם
  choice: leur richesse
  rationale: Le nom עֹשֶׁר, accompagné du suffixe de troisième personne du pluriel, signifie « leur richesse ». Ce choix est courant, clair et convient à la formulation proverbiale.
- source_word: אִוֶּלֶת
  choice: folie
  rationale: Le terme désigne la folie comme disposition intellectuelle et morale. « Folie » est concis et maintient la répétition voulue du texte massorétique.
- source_word: כְּסִילִים
  choice: les insensés
  rationale: Dans la littérature sapientielle, le terme désigne des personnes réfractaires à la sagesse, et pas seulement des gens peu intelligents. « Insensés » rend cette portée morale dans un registre digne et actuel.
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: la folie des insensés n’est que folie
  rationale: Cette formulation préserve la répétition emphatique du texte massorétique tout en donnant en français une tournure proverbiale naturelle. « N’est que » explicite légèrement la force de la tautologie sans en modifier le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure nominale du premier membre est conservée par « c’est », tandis que « n’est que folie » rend naturellement l’emphase de la répétition hébraïque sans supprimer son caractère volontairement tautologique.
