id: PRO.14.6
reference: Proverbs 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּקֶּשׁ לֵ֣ץ חָכְמָ֣ה וָ/אָ֑יִן וְ/דַ֖עַת לְ/נָב֣וֹן נָקָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: fr
  text: Le moqueur cherche la sagesse, mais elle reste introuvable[a] ; la connaissance vient facilement à qui a du discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’y en a pas » ; autre traduction possible : « mais il n’en trouve pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: cherche
  rationale: Dans le style gnomique des Proverbes, l’accompli hébreu exprime ici une vérité générale ; le présent français convient donc naturellement.
- source_word: לֵץ
  choice: le moqueur
  rationale: Le terme désigne celui qui tourne avec arrogance la sagesse et la correction en dérision. « Moqueur » est actuel et conserve cette portée morale.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rendu habituel dans les Proverbes, où il s’agit d’un discernement pratique et moral, et non de la seule intelligence.
- source_word: וָאָיִן
  choice: mais elle reste introuvable
  rationale: Cette formulation naturelle en français rend l’échec de la recherche tout en signalant en note la tournure existentielle plus littérale de l’hébreu.
- source_word: וְדַעַת
  choice: la connaissance
  rationale: Le mot désigne ici une connaissance comprise et assimilée, dans le champ lexical sapientiel du livre.
- source_word: לְנָבוֹן
  choice: à qui a du discernement
  rationale: Cette formulation proverbiale rend la qualité durable exprimée par נָבוֹן sans restreindre indûment la maxime à un homme de sexe masculin.
- source_word: נָקָל
  choice: vient facilement
  rationale: Cette expression française idiomatique traduit l’idée d’aisance et forme un contraste clair avec la recherche infructueuse du moqueur.
theological_decisions:
- issue: Masculin représentatif dans la littérature sapientielle
  choice: à qui a du discernement
  alternative: à l’homme perspicace
  rationale: Le masculin singulier hébreu fonctionne ici comme désignation proverbiale d’une personne caractérisée par le discernement. La formulation choisie conserve la portée générale de la maxime sans ajouter une restriction sexuelle absente de son propos.
- issue: Nature de l’échec du moqueur
  choice: elle reste introuvable
  alternative: il n’y en a pas
  rationale: Le texte affirme sobrement l’absence de sagesse au terme de sa recherche, sans expliquer pourquoi. La traduction préserve cette tension et n’ajoute aucune cause doctrinale ou psychologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, avec une ponctuation qui met nettement en regard la recherche vaine du moqueur et l’accès aisé à la connaissance pour la personne douée de discernement.
