source:
  edition: WLC
  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: fr
  text: Ceux qui planifient le mal ne s’égarent-ils pas ? Mais la bonté et la fidélité sont pour ceux qui planifient le bien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « amour fidèle et vérité », ou « amour loyal et fiabilité ». Le couple hébreu désigne souvent un amour loyal associé à la vérité, à la fiabilité ou à la fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: ne… pas ?
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative, forme naturelle en français.
- source_word: יִתְעוּ
  choice: s’égarent
  rationale: Exprime l’idée de dévier du bon chemin, avec ici une portée morale.
- source_word: חֹרְשֵׁי רָע
  choice: ceux qui méditent le mal
  rationale: Le participe de חרשׁ évoque une conception intentionnelle ou un projet; « méditent » garde cette délibération sans limiter le sens à un complot.
- source_word: רָע
  choice: le mal
  rationale: Préserve l’opposition morale nette avec טוֹב.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Rend l’amour loyal, bienveillant et durable souvent exprimé par חֶסֶד.
- source_word: אֱמֶת
  choice: vérité
  rationale: Conserve le sens premier et l’ambiguïté entre vérité, fiabilité et fidélité dans le binôme hébreu.
- source_word: חֹרְשֵׁי טוֹב
  choice: ceux qui méditent le bien
  rationale: Répète le même verbe français pour reproduire le parallélisme avec ceux qui méditent le mal.
- source_word: טוֹב
  choice: le bien
  rationale: Rend l’emploi substantivé et maintient la symétrie morale avec « le mal ».
theological_decisions:
- issue: Sens de la proposition nominale וְחֶסֶד וֶאֱמֶת חֹרְשֵׁי טוֹב
  choice: « amour fidèle et vérité sont pour ceux qui méditent le bien »
  alternative: « ceux qui méditent le bien font preuve d’amour fidèle et de vérité »; « amour fidèle et vérité viennent à la rencontre de ceux qui méditent le bien »
  rationale: 'L’hébreu ne comporte aucun verbe explicite et laisse ouverte la relation exacte : ces qualités peuvent caractériser les personnes qui projettent le bien ou leur être accordées. « Sont pour » préserve cette concision et cette ambiguïté mieux qu’une formulation qui en fixerait le sujet ou la direction.'
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est maintenu par la répétition de « méditent ». « Vérité » évite de résoudre silencieusement la polysémie de אֱמֶת, tandis que la note présente les principales nuances du binôme.
