source:
  edition: WLC
  text: עֵ֣ד אֱ֭מוּנִים לֹ֣א יְכַזֵּ֑ב וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: fr
  text: Un témoin digne de confiance ne ment pas, mais un faux témoin profère des mensonges[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « souffle des mensonges ». Le verbe hébreu évoque des mensonges émis comme un souffle.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד אֱמוּנִים
  choice: un témoin digne de confiance
  rationale: עֵד désigne celui qui témoigne, tandis que אֱמוּנִים exprime ici la fiabilité. « Digne de confiance » est naturel en français moderne et met clairement en valeur cette qualité morale.
- source_word: לֹא יְכַזֵּב
  choice: ne ment pas
  rationale: Dans le contexte du témoignage, le piel de כזב désigne le fait de parler faussement. « Ne ment pas » en donne le sens direct et idiomatique.
- source_word: וְיָפִיחַ
  choice: mais ... exhale
  rationale: Le waw introduit le contraste entre les deux membres du proverbe, d'où « mais ». Le verbe פוח évoque littéralement l'action de souffler ou d'exhaler et conserve ainsi l'image vive de l'hébreu.
- source_word: כְּזָבִים
  choice: des mensonges
  rationale: Le pluriel hébreu est conservé et suggère une production répétée de déclarations mensongères.
- source_word: עֵד שָׁקֶר
  choice: un faux témoin
  rationale: Cette expression désigne un témoin dont le témoignage est faux. « Faux témoin » est l'expression juridique et biblique naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique est rendu par « mais », et l’image concrète de l’expiration est conservée dans « exhale », avec une formulation plus idiomatique signalée en note.
