id: PRO.14.1
reference: Proverbs 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: fr
  text: 'La plus sage des femmes bâtit sa maison[a][b],

    mais la femme insensée la démolit de ses propres mains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toute femme sage bâtit sa maison. » Le début de l’hébreu peut être compris comme une affirmation générale plutôt que comme un superlatif.'
    reason: lexical_alternative
  - marker: b
    text: Le mot « maison » peut aussi désigner le foyer, la maisonnée ou l’ensemble familial, et pas seulement le bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: la plus sage des femmes
  rationale: Cette tournure rend l’expression hébraïque comme un superlatif idiomatique et s’accorde avec le verbe féminin singulier. Le sens générique « toute femme sage » demeure possible et est signalé en note.
- source_word: בָּנְתָה
  choice: bâtit
  rationale: Le parfait hébreu exprime ici une vérité proverbiale générale; le présent français en restitue naturellement la portée gnomique.
- source_word: בֵיתָהּ
  choice: sa maison
  rationale: « Maison » conserve l’image concrète de l’hébreu tout en pouvant évoquer, par extension, le foyer ou la maisonnée.
- source_word: אִוֶּלֶת
  choice: la femme insensée
  rationale: Le nom féminin, associé au verbe singulier et opposé au premier membre, désigne ici naturellement une femme caractérisée par la sottise plutôt que l’abstraction « folie ».
- source_word: בְּיָדֶיהָ
  choice: de ses propres mains
  rationale: Cette formulation française exprime le moyen employé tout en soulignant la responsabilité personnelle indiquée par l’hébreu.
- source_word: תֶהֶרְסֶנּוּ
  choice: la démolit
  rationale: « Démolir » maintient l’opposition concrète avec « bâtir »; le pronom féminin renvoie clairement à « maison ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique et l’image de la construction puis de la démolition sont conservés. Les deux marqueurs sont placés après « maison », selon l’ordre alphabétique.
