source:
  edition: WLC
  text: פֶּ֭תִי יַאֲמִ֣ין לְ/כָל דָּבָ֑ר וְ֝/עָר֗וּם יָבִ֥ין לַ/אֲשֻׁרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/015.yaml
  text: A simple man believes every word[a], but a prudent man considers his steps.
translation:
  language: fr
  text: Le naïf croit toute parole[a], mais l’homme avisé réfléchit à ses pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « croit tout » ou « croit toute chose ».
    reason: 'Alternative lexicale : דָּבָר peut désigner une parole, une chose ou une affaire.'
lexical_decisions:
- source_word: פֶּתִי
  choice: le naïf
  rationale: Dans les Proverbes, le terme désigne une personne inexpérimentée et facile à influencer, non une personne simplement peu intelligente. « Le naïf » est naturel en français moderne et conserve la catégorie sapientiale.
- source_word: יַאֲמִין
  choice: croit
  rationale: Le hiphil de אמן signifie ici tenir pour vrai ou digne de confiance. « Croit » convient naturellement avec l’objet « toute parole ».
- source_word: לְכָל דָּבָר
  choice: toute parole
  rationale: דָּבָר peut signifier « parole », « chose » ou « affaire ». « Toute parole » préserve l’image concrète d’une crédulité envers ce qui est dit, tandis que l’extension plus large est signalée en note.
- source_word: עָרוּם
  choice: l’homme avisé
  rationale: Dans ce contexte sapiential, עָרוּם a un sens positif de prudence et de discernement plutôt que de ruse trompeuse. « Avisé » rend cette valeur favorable en français courant et digne.
- source_word: יָבִין
  choice: réfléchit à
  rationale: Avec la mention des pas, בין exprime un discernement pratique et attentif. « Réfléchit à » communique naturellement l’examen de sa conduite.
- source_word: לַאֲשֻׁרוֹ
  choice: ses pas
  rationale: Le nom évoque concrètement les pas ou la marche, métaphore de la conduite et de l’orientation de vie. « Ses pas » conserve cette image hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme antithétique et l’image concrète des « pas » sont conservés. « Le naïf » et « l’homme avisé » rendent les deux types humains masculins singuliers du texte hébreu sans alourdir la formulation.
