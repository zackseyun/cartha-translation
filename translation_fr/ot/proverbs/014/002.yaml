id: PRO.14.2
reference: Proverbs 14:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹלֵ֣ךְ בְּ֭/יָשְׁר/וֹ יְרֵ֣א יְהוָ֑ה וּ/נְל֖וֹז דְּרָכָ֣י/ו בּוֹזֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: fr
  text: Qui marche avec droiture craint Yahvé ; mais celui dont les voies sont tortueuses[a] le[b] méprise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais celui qui se montre retors dans sa conduite ». L’hébreu décrit une personne dont la manière d’agir est tordue ou dévoyée.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom « le » renvoie très probablement à Yahvé ; certains le comprennent toutefois de manière plus générale.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: marche
  rationale: Le verbe הלך décrit ici, selon l’image courante des écrits de sagesse, la manière de vivre. « Marche » conserve cette image tout en restant intelligible en français.
- source_word: בְּיָשְׁרוֹ
  choice: avec droiture
  rationale: Le terme exprime la rectitude et l’intégrité morale. « Avec droiture » rend naturellement la construction hébraïque sans alourdir la phrase par un possessif peu idiomatique en français.
- source_word: יְרֵא יְהוָה
  choice: craint Yahvé
  rationale: « Craint » préserve la formulation théologique caractéristique des Proverbes, plus forte et plus précise que le seul « respecte ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » transcrit en français moderne le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: וּנְלוֹז דְּרָכָיו
  choice: mais celui dont les voies sont tortueuses
  rationale: נלוז évoque ce qui est tordu, déviant ou pervers, tandis que « voies » désigne ici la conduite habituelle. La formulation conserve l’image concrète et l’antithèse avec la droiture.
- source_word: בּוֹזֵהוּ
  choice: le méprise
  rationale: בזה signifie traiter avec mépris. Le pronom masculin singulier renvoie le plus naturellement à Yahvé, mentionné juste auparavant, tout en laissant l’ambiguïté du suffixe signalée en note.
theological_decisions:
- issue: Référent du suffixe pronominal dans בּוֹזֵהוּ
  choice: Le pronom « le » renvoie à Yahvé.
  alternative: Le pronom pourrait être compris de façon plus générale, notamment comme visant l’homme droit ou l’ordre moral représenté par sa conduite.
  rationale: L’antithèse la plus directe oppose celui qui craint Yahvé à celui qui le méprise, et Yahvé est l’antécédent explicite le plus proche. Une note conserve néanmoins l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve les images coordonnées de la marche et des voies, ainsi que le terme traditionnel « craint » dans le langage de sagesse.
