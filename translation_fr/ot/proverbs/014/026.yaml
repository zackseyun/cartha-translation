  text: בְּ/יִרְאַ֣ת יְ֭הוָה מִבְטַח עֹ֑ז וּ֝/לְ/בָנָ֗י/ו יִהְיֶ֥ה מַחְסֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: fr
  text: Qui craint Yahweh a une ferme assurance, et ses enfants[a] auront un refuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible, mais moins probable : « ses enfants » peut désigner les enfants de Yahweh plutôt que ceux de la personne qui le craint.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יִרְאַת
  choice: Dans la crainte de
  rationale: La préposition ב avec le nom construit יִרְאָה exprime ici la sphère dans laquelle on vit. « Dans la crainte de » conserve l’expression hébraïque et son idée de respect révérenciel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: מִבְטַח עֹז
  choice: une ferme assurance
  rationale: מִבְטַח désigne l’assurance ou la confiance, et עֹז en souligne la force. « Ferme assurance » est idiomatique en français et conserve cette intensification.
- source_word: וּ֝/לְ/בָנָ֗י/ו
  choice: et ses enfants auront
  rationale: בָּנִים peut désigner les fils ou, au sens générique, les enfants. Le ל marque ce qui est accordé ou assuré à leur bénéfice; la tournure française « ses enfants auront » le rend naturellement.
- source_word: יִהְיֶה מַחְסֶה
  choice: auront un refuge
  rationale: Le syntagme annonce l’existence d’un refuge pour les enfants. La reformulation avec « auront » est naturelle en français sans modifier le rapport exprimé par l’hébreu.
theological_decisions:
- issue: Référent du suffixe pronominal dans « ses enfants »
  choice: Le suffixe renvoie à la personne qui craint Yahweh.
  alternative: 'Le suffixe peut renvoyer à Yahweh : « les enfants de Yahweh auront un refuge ».'
  rationale: 'L’enchaînement proverbial favorise la personne qui craint Yahweh comme antécédent : elle trouve une ferme assurance, et ses enfants bénéficient d’un refuge. Cependant, le référent divin reste grammaticalement possible et est donc signalé en note.'
translation_notes:
  register: Français international moderne, clair et digne. « On trouve » évite une construction existentielle lourde, tandis que « ferme assurance » restitue l’intensité de עֹז. Le marqueur [a] est placé après la proposition concernée, puisque la note porte sur le référent de « ses ».
