source:
  edition: WLC
  text: בֵּ֣ית רְ֭שָׁעִים יִשָּׁמֵ֑ד וְ/אֹ֖הֶל יְשָׁרִ֣ים יַפְרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/011.yaml
  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: fr
  text: 'La maison des méchants sera détruite,

    mais la tente des hommes droits fleurira[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bourgeonnera » ou « germera » ; le verbe hébreu évoque une croissance qui produit des bourgeons.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: la maison des
  rationale: Le nom à l’état construit exprime ici « la maison des méchants ». « Maison » maintient l’image concrète de l’habitation tout en pouvant évoquer la maisonnée.
- source_word: רְשָׁעִים
  choice: méchants
  rationale: Le pluriel substantivé désigne des personnes moralement mauvaises. « Les méchants » rend directement le contraste éthique du proverbe.
- source_word: יִשָּׁמֵד
  choice: sera détruite
  rationale: Le niphal de שׁמד exprime la destruction ou la dévastation. Le futur passif français rend naturellement la valeur de l’imparfait hébreu dans cet énoncé proverbial.
- source_word: אֹהֶל
  choice: la tente
  rationale: La traduction littérale préserve le contraste intentionnel entre la solide maison des méchants et la tente, plus modeste, des hommes droits.
- source_word: יְשָׁרִים
  choice: des hommes droits
  rationale: Le terme qualifie ceux qui sont moralement droits. Cette formulation est claire en français courant et évite de confondre ce mot avec d’autres termes hébreux souvent rendus par « justes ».
- source_word: יַפְרִיחַ
  choice: fleurira
  rationale: Le hiphil de פרח évoque la croissance qui bourgeonne ou fleurit. « Fleurira » conserve cette métaphore végétale tout en exprimant l’essor et la prospérité.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme antithétique et les images concrètes de la maison, de la tente et de la floraison sont conservés.
