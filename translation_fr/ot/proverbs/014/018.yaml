  source_fidelity: 'Le texte rend fidèlement les deux membres du proverbe : נָחֲלוּ est bien exprimé par « héritent », פְתָאיִם par « les naïfs », et אִוֶּלֶת par « la folie ». « Les gens avisés » convient au sens positif de עֲרוּמִים dans ce contraste. « Sont couronnés de connaissance » conserve l’image de יַכְתִּרוּ דָעַת sans imposer indûment l’agent de l’action.'
