source:
  edition: WLC
  text: נָחֲל֣וּ פְתָאיִ֣ם אִוֶּ֑לֶת וַֽ֝/עֲרוּמִ֗ים יַכְתִּ֥רוּ דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/018.yaml
  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: fr
  text: Les naïfs héritent de la folie, mais les gens avisés sont couronnés de connaissance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais les gens avisés se couronnent de connaissance ». Le verbe hébreu peut être compris activement (« couronnent ») ou comme décrivant le fait d’être paré ou couronné de connaissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  choice: héritent
  rationale: Le verbe נחל désigne couramment le fait de recevoir en héritage ou d’entrer en possession de quelque chose. « Héritent » conserve l’image frappante de la folie comme possession des naïfs.
- source_word: פְתָאיִם
  choice: les naïfs
  rationale: Dans les Proverbes, פתי désigne les personnes inexpérimentées, ouvertes à toutes les influences et faciles à égarer. « Les naïfs » exprime clairement cette catégorie morale et intellectuelle en français moderne.
- source_word: אִוֶּלֶת
  choice: la folie
  rationale: Terme caractéristique de la littérature de sagesse, il renvoie à une conduite moralement et pratiquement insensée. « Folie » en est l’équivalent direct et naturel.
- source_word: עֲרוּמִים
  choice: les gens avisés
  rationale: Dans ce contraste avec les naïfs, עֲרוּמִים a le sens positif de personnes prudentes, perspicaces et capables de discernement. « Les gens avisés » est naturel et accessible.
- source_word: יַכְתִּרוּ
  choice: sont couronnés de
  rationale: Le hiphil de כתר peut évoquer le fait d’entourer ou de couronner. La formulation française exprime naturellement l’état résultant, tout en signalant en note la lecture active possible.
- source_word: דָעַת
  choice: connaissance
  rationale: דעת est un terme central de la sagesse biblique, désignant une connaissance liée au discernement. « Connaissance » en conserve le sens direct.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Les naïfs » et « les gens avisés » rendent le contraste sapiential sans archaïsme. La métaphore de l’héritage et celle de la couronne sont conservées.
