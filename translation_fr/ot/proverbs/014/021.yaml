source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: fr
  text: 'Qui méprise son prochain pèche,

    mais heureux[a] celui qui fait preuve de bonté envers les pauvres !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu décrit un état de bonheur, d’épanouissement ou de faveur, et non une simple émotion passagère. On pourrait aussi traduire : « quel bonheur pour celui » ou « béni est celui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: méprise
  rationale: Le participe exprime une attitude de mépris envers autrui. « Méprise » est direct, naturel et conserve toute la portée morale du terme.
- source_word: לְרֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ désigne ici une personne appartenant à la sphère relationnelle du sujet. « Son prochain » est idiomatique en français biblique moderne et ne limite pas le sens au voisin géographique.
- source_word: חוֹטֵא
  choice: pèche
  rationale: Le participe employé comme prédicat qualifie explicitement de péché le mépris du prochain. « Pèche » préserve cette catégorie morale et théologique sans l'atténuer en simple faute.
- source_word: וּמְחוֹנֵן
  choice: fait preuve de bonté envers
  rationale: La forme issue de חנן évoque la faveur accordée avec bienveillance. Cette formulation française est naturelle et exprime une bonté active sans restreindre le sens à la seule pitié.
- source_word: עניים
  choice: les pauvres
  rationale: Dans ce contraste éthique, le mot vise des personnes pauvres ou socialement vulnérables. « Les pauvres » rend clairement sa dimension socioéconomique, tout en laissant présente l'idée de fragilité.
- source_word: אַשְׁרָיו
  choice: heureux celui
  rationale: La formule sapientielle proclame l'état enviable et florissant de la personne concernée. En français, « heureux celui » est la tournure idiomatique traditionnelle des béatitudes et n'exige pas d'expliciter un agent divin absent de l'hébreu.
theological_decisions:
- issue: Portée de la formule sapientielle אַשְׁרָיו
  choice: heureux celui
  alternative: béni soit celui / quel bonheur pour celui
  rationale: Le terme décrit une condition objective de bonheur, d'épanouissement ou de faveur, et non une simple émotion passagère. « Heureux celui » conserve cette richesse dans une formule française naturelle; une note prévient une lecture purement affective.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme antithétique du proverbe est conservé sur deux lignes. « Son prochain » maintient la portée relationnelle générale, tandis que « fait preuve de bonté » exprime de manière naturelle la faveur active de חנן.
