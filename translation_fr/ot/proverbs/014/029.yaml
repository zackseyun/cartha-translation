  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
translation:
  language: fr
  text: Celui qui est lent à la colère a beaucoup de discernement, mais celui qui s’emporte vite exalte la folie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  choice: qui est lent à la colère
  rationale: L’expression hébraïque signifie littéralement « long de narines » et désigne une personne patiente, qui ne se met pas rapidement en colère. La formulation française conserve directement le sens de l’idiome.
- source_word: רַב תְּבוּנָה
  choice: a beaucoup de discernement
  rationale: רַב exprime ici l’abondance, et תְּבוּנָה la capacité de comprendre et de juger avec justesse. « Beaucoup de discernement » est naturel en français et convient au vocabulaire sapiential.
- source_word: קְצַר רוּחַ
  choice: qui s’emporte vite
  rationale: Littéralement « court de souffle/esprit », cet idiome désigne une personne impatiente ou prompte à la colère. « S’emporte vite » rend clairement le contraste avec la lenteur à la colère du premier membre.
- source_word: מֵרִים
  choice: exalte
  rationale: Le participe causatif de רום signifie « élever, exalter ». Le choix conserve la métaphore frappante de l’hébreu plutôt que de la réduire à « manifeste » ou « étale ».
- source_word: אִוֶּלֶת
  choice: la folie
  rationale: Dans les Proverbes, le terme désigne la folie comme défaut moral autant qu’intellectuel. « Folie » en conserve la portée sapientiale.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme antithétique de l’hébreu est conservé, ainsi que la métaphore volontairement forte d’« exalter la folie ».
