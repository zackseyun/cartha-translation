id: PRO.14.10
reference: Proverbs 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֗ב י֭וֹדֵעַ מָרַּ֣ת נַפְשׁ֑/וֹ וּ֝/בְ/שִׂמְחָת֗/וֹ לֹא יִתְעָ֥רַב זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/010.yaml
  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: fr
  text: Le cœur connaît l’amertume de son âme[a], et aucun étranger ne prend part à sa joie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’amertume de son âme ». Ici, « âme » peut désigner l’être intérieur ou la personne elle-même, sans constituer nécessairement une définition technique de la nature humaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucun étranger ne se mêle à sa joie » ou « ne participe à sa joie ». Le verbe hébreu peut exprimer le fait de se mêler à quelque chose, de s’y associer ou d’y prendre part.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: le cœur
  rationale: Dans les Proverbes, le terme désigne souvent l’être intérieur, siège de la pensée et des sentiments. « Le cœur » conserve l’image hébraïque tout en restant naturel en français.
- source_word: יֹדֵעַ
  choice: connaît
  rationale: Le verbe exprime ici une connaissance intime et personnelle. « Connaît » rend directement cette conscience intérieure.
- source_word: מָרַת
  choice: l’amertume
  rationale: Le mot évoque une amertume affective ou existentielle. Ce choix préserve la métaphore sans la réduire à la seule tristesse.
- source_word: נַפְשׁוֹ
  choice: de son âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « De son âme » conserve l’expression anthropologique du texte, dont la portée est précisée en note.
- source_word: וּבְשִׂמְחָתוֹ
  choice: à sa joie
  rationale: שִׂמְחָה signifie « joie » ou « allégresse ». La préposition ב est naturellement intégrée en français à la locution « prendre part à ».
- source_word: יִתְעָרַב
  choice: ne prend part
  rationale: La forme verbale peut exprimer le fait de se mêler à quelque chose, de s’y associer ou d’y participer. « Prendre part » rend clairement l’idée dans ce contexte, sans exclure les autres nuances.
- source_word: זָר
  choice: aucun étranger
  rationale: Le mot désigne ici une personne extérieure à l’expérience intime du cœur, plutôt qu’un étranger au sens ethnique. La formulation conserve le contraste incisif de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme entre l’amertume et la joie ainsi que les images du cœur et de l’âme. « Aucun étranger » désigne ici celui qui demeure extérieur à l’expérience intime d’autrui.
