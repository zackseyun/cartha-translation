source:
  edition: WLC
  text: צְדָקָ֥ה תְרֽוֹמֵֽם גּ֑וֹי וְ/חֶ֖סֶד לְאֻמִּ֣ים חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: fr
  text: 'La justice élève une nation,

    mais le péché est une honte pour les peuples[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La seconde partie du verset est difficile en hébreu. Elle est traditionnellement comprise ainsi : le péché est un déshonneur pour les peuples. Le mot habituellement traduit par « bonté », « fidélité » ou « amour loyal » y figure dans un emploi inhabituel; certains lui attribuent ici le sens rare de « déshonneur » ou « opprobre ». La construction précise de la proposition est aussi discutée.'
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: La justice
  rationale: Le nom désigne ici ce qui est juste et droit dans la conduite morale et sociale. « Justice » est naturel en français et conserve la portée collective du proverbe.
- source_word: תְרוֹמֵם
  choice: élève
  rationale: La forme verbale de רום exprime l’action d’élever ou de placer en hauteur; « élève » garde l’image tout en évoquant la dignité et la prospérité publiques.
- source_word: גּוֹי
  choice: une nation
  rationale: Le terme désigne ici de façon générale une collectivité nationale, sans opposition particulière entre Israël et les autres nations.
- source_word: וְחֶסֶד ... חַטָּאת
  choice: mais le péché couvre ... de honte
  rationale: La seconde proposition est textuellement difficile. Cette formulation rend l’antithèse traditionnelle entre la justice qui élève et le péché qui déshonore, sans attribuer artificiellement à חֶסֶד son sens positif habituel dans le corps du texte.
- source_word: לְאֻמִּים
  choice: les peuples
  rationale: Le pluriel est conservé et maintient le parallélisme poétique avec « une nation ».
theological_decisions:
- issue: Sens de וְחֶסֶד לְאֻמִּים חַטָּאת dans la seconde proposition
  choice: « mais le péché couvre les peuples de honte »
  alternative: « mais la bonté envers les peuples est un péché » ou une construction où « honte » et « péché » sont autrement reliés
  rationale: Le texte hébreu est difficile, notamment parce que חֶסֶד signifie normalement « bonté », « fidélité » ou « amour loyal ». Le parallélisme antithétique favorise cependant la compréhension traditionnelle selon laquelle le péché déshonore les peuples. Une note signale honnêtement l’ambiguïté au lieu de la dissimuler.
translation_notes:
  register: Français moderne, international et digne. La formulation brève conserve le caractère sentencieux, le parallélisme collectif (« une nation / les peuples ») et l’image verticale du premier membre.
