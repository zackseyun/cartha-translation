id: PRO.14.8
reference: Proverbs 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: fr
  text: La sagesse de l’homme avisé consiste à discerner sa voie[a], mais la folie des insensés est tromperie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à comprendre son chemin » ; la « voie » peut désigner sa conduite ou le cours de sa vie.'
    reason: lexical_alternative
  - marker: b
    text: La « tromperie » peut désigner soit la conduite trompeuse des insensés, soit l’illusion dans laquelle leur folie les enferme.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת
  choice: la sagesse de
  rationale: La forme construite introduit une relation génitive avec עָרוּם ; cette tournure est naturelle en français.
- source_word: עָרוּם
  choice: l’homme avisé
  rationale: Dans ce contexte sapiential, le mot désigne positivement une personne prudente et perspicace, sans la nuance négative de « rusé ».
- source_word: הָבִין
  choice: consiste à discerner
  rationale: L’infinitif a ici une valeur prédicative et définit en quoi réside la sagesse de l’homme avisé. « Discerner » exprime l’examen intelligent de sa conduite.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: דֶּרֶךְ peut désigner le chemin, la conduite ou le cours de la vie. Le possessif singulier masculin est conservé conformément à l’hébreu.
- source_word: וְאִוֶּלֶת
  choice: mais la folie
  rationale: La conjonction relie deux membres antithétiques ; « mais » rend clairement ce contraste en français.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: « Insensés » est un terme naturel et digne pour les personnes moralement dépourvues de sagesse dans la littérature sapientiale.
- source_word: מִרְמָה
  choice: tromperie
  rationale: Le nom peut évoquer aussi bien le comportement trompeur que l’illusion dans laquelle les insensés s’enferment ; « tromperie » préserve cette amplitude.
theological_decisions:
- issue: Suffixe masculin représentatif dans דַּרְכּוֹ
  choice: sa voie, en lien avec « l’homme avisé »
  alternative: leur voie ; sa propre voie
  rationale: Le texte hébreu emploie un singulier masculin générique. La traduction en conserve le nombre et le genre grammatical sans limiter la portée universelle du proverbe.
- issue: Nuance morale de עָרוּם
  choice: avisé
  alternative: prudent ; perspicace ; rusé
  rationale: L’opposition entre sagesse et folie impose ici une valeur positive. « Rusé » risquerait d’introduire une connotation morale négative absente du contexte.
- issue: Portée de מִרְמָה
  choice: maintenir l’ambiguïté avec « tromperie »
  alternative: conduite trompeuse ; illusion sur soi-même
  rationale: La syntaxe nominale ne précise pas si la folie produit la tromperie, consiste en une conduite trompeuse ou relève de l’auto-illusion. Il convient de ne pas trancher silencieusement.
translation_notes:
  register: Français international moderne, concis et proverbial. « L’homme avisé » rend explicitement la personne désignée par le singulier masculin hébreu ; « insensés » maintient le vocabulaire moral de la littérature sapientiale. Le parallélisme antithétique est conservé.
