id: PRO.14.12
reference: Proverbs 14:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: fr
  text: Il y a une voie qui paraît droite à un homme[a], mais son aboutissement, ce sont les chemins de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « droite devant un homme »; cette expression hébraïque désigne ce qui paraît juste à ses propres yeux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y a
  rationale: La particule existentielle introduit une vérité générale; « Il y a » est naturel et direct en français.
- source_word: דֶּרֶךְ
  choice: une voie
  rationale: Le mot désigne à la fois un chemin et, métaphoriquement, une conduite ou une orientation de vie; « voie » conserve cette double portée.
- source_word: יָשָׁר
  choice: droite
  rationale: « Droite » garde l'image du chemin rectiligne tout en exprimant ce qui semble juste ou correct.
- source_word: לִפְנֵי אִישׁ
  choice: paraît… à un homme
  rationale: Littéralement « devant un homme »; dans ce contexte, l'expression indique ce qui paraît juste selon son propre jugement. La formulation française rend naturellement cet idiome tout en conservant le masculin singulier représentatif.
- source_word: וְאַחֲרִיתָהּ
  choice: mais son aboutissement
  rationale: Le waw a ici une valeur contrastive. « Aboutissement » exprime la fin ou l'issue d'une conduite avec une tournure française idiomatique.
- source_word: דַּרְכֵי
  choice: les chemins de
  rationale: Le pluriel hébreu est conservé et « chemins » maintient le lien lexical et imagé avec la « voie » du premier membre.
- source_word: מָוֶת
  choice: la mort
  rationale: Traduction directe qui préserve toute l'ampleur de l'avertissement sans limiter la mort à une interprétation particulière.
theological_decisions:
- issue: Masculin générique אִישׁ
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le texte hébreu emploie le masculin singulier avec une portée représentative; « un homme » en conserve la forme sans empêcher l'application universelle du proverbe.
- issue: Portée de מָוֶת
  choice: la mort
  alternative: la ruine / la destruction
  rationale: Le texte nomme explicitement la mort. Il convient de ne pas réduire ni préciser indûment sa portée physique, morale ou eschatologique.
- issue: Pluriel דַּרְכֵי מָוֶת
  choice: les chemins de la mort
  alternative: un chemin qui mène à la mort
  rationale: Le pluriel inhabituel est maintenu afin de préserver la formulation et la tension poétique de l'hébreu plutôt que de les normaliser.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme est conservé, ainsi que le contraste entre la voie unique jugée droite et les chemins pluriels de la mort.
