id: PRO.14.32
reference: Proverbs 14:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּֽ֭/רָעָת/וֹ יִדָּחֶ֣ה רָשָׁ֑ע וְ/חֹסֶ֖ה בְ/מוֹת֣/וֹ צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: fr
  text: À cause de sa méchanceté[a], le méchant est renversé, mais le juste trouve refuge[b] dans sa mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dans son malheur ». Le mot hébreu peut désigner soit le mal moral, soit le malheur ou la catastrophe.
    reason: lexical_alternative
  - marker: b
    text: Ou « se réfugie » ou « prend refuge ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « dans sa mort »; on peut aussi comprendre « à sa mort » ou « quand il meurt ». Certaines traductions explicitent: « garde espoir à sa mort », mais le mot « espoir » ne figure pas dans l’hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: À cause de sa méchanceté
  rationale: רָעָה peut désigner le mal moral ou le malheur. Le rapprochement avec « le méchant » et l’opposition au juste favorisent ici le sens moral; בְּ est compris comme indiquant la cause. L’autre sens possible est signalé en note.
- source_word: יִדָּחֶה
  choice: est renversé
  rationale: Le niphal exprime le fait d’être repoussé, chassé ou précipité dans la ruine. « Est renversé » conserve la voix passive et convient naturellement à la chute évoquée par le proverbe.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé au singulier désigne un type humain proverbial. « Le méchant » est idiomatique en français et maintient le contraste avec « le juste ».
- source_word: וְחֹסֶה
  choice: mais … trouve refuge
  rationale: Le participe de חסה peut exprimer le fait de chercher, prendre ou trouver refuge. « Trouve refuge » rend naturellement le résultat assuré sans préciser un objet de confiance absent du texte.
- source_word: בְמוֹתוֹ
  choice: dans sa mort
  rationale: Cette traduction formelle conserve la préposition et l’expression compacte de l’hébreu, sans réduire celle-ci à une simple indication temporelle.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne ici la personne juste comme figure proverbiale et répond directement à « le méchant ».
theological_decisions:
- issue: Le verset affirme-t-il une espérance au-delà de la mort ou une sécurité au moment de mourir ?
  choice: Le texte principal garde l’expression « trouve refuge dans sa mort ».
  alternative: « Le juste a de l’espoir au moment de sa mort » ou « le juste est en sécurité quand il meurt ».
  rationale: L’hébreu ne contient pas explicitement le mot « espoir » et ne définit ni la nature ni la durée du refuge. La formulation retenue préserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation reste digne et accessible tout en conservant l’expression inhabituelle « dans sa mort », nécessaire pour ne pas trancher une difficulté réelle du texte hébreu.
