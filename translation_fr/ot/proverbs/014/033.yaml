id: PRO.14.33
reference: Proverbs 14:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: fr
  text: La sagesse repose dans le cœur d’une personne avisée, mais au milieu des insensés, elle se fait connaître[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle devient manifeste » ; l’hébreu peut aussi se comprendre : « elle est connue ».'
    reason: Le niphal תִּוָּדֵעַ permet une lecture réflexive, résultative ou passive.
lexical_decisions:
- source_word: בְּלֵב
  choice: dans le cœur de
  rationale: Cette formulation conserve l’image hébraïque du cœur, qui englobe ici la pensée, la volonté et la vie intérieure, tout en restant naturelle en français.
- source_word: נָבוֹן
  choice: une personne avisée
  rationale: Le terme désigne quelqu’un qui possède compréhension et discernement. « Une personne avisée » exprime cette qualité dans un français actuel sans restreindre indûment la portée générale du proverbe.
- source_word: תָּנוּחַ
  choice: repose
  rationale: Le verbe נוח évoque le fait de se poser ou de demeurer au repos. « Repose » préserve l’image d’une sagesse établie calmement dans la vie intérieure.
- source_word: חָכְמָה
  choice: La sagesse
  rationale: Le nom est le sujet de la proposition. L’article défini convient à l’énoncé proverbial français sans imposer une personnification plus forte que celle du texte.
- source_word: וּבְקֶרֶב
  choice: mais au milieu de
  rationale: Le waw prend ici naturellement une valeur contrastive. « Au milieu de » conserve la dimension spatiale de קֶרֶב et s’oppose à la sagesse qui repose intérieurement dans le premier membre.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: Dans les Proverbes, כְּסִילִים désigne ceux dont la sottise est à la fois intellectuelle et morale. « Insensés » rend ce terme avec un registre digne et traditionnel, sans la nuance surtout injurieuse de « idiots ».
- source_word: תִּוָּדֵעַ
  choice: elle se fait connaître
  rationale: Le niphal de ידע peut être compris comme passif, réflexif ou résultatif. « Elle se fait connaître » exprime le fait que la sagesse devient extérieurement perceptible, tout en laissant une note signaler l’autre nuance possible.
theological_decisions:
- issue: Nature de la manifestation de la sagesse parmi les insensés
  choice: « elle se fait connaître »
  alternative: « elle devient manifeste » ou « elle est connue »
  rationale: Le texte ne précise pas exactement comment la sagesse est reconnue parmi les insensés. La traduction conserve donc l’ambiguïté du niphal et n’ajoute aucune explication doctrinale ou morale absente de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique du proverbe et l’image du cœur sont conservées. « Personne avisée » rend la portée représentative du masculin hébreu sans alourdir la phrase.
