  text: לֵ֣ךְ מִ֭/נֶּגֶד לְ/אִ֣ישׁ כְּסִ֑יל וּ/בַל יָ֝דַ֗עְתָּ שִׂפְתֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/007.yaml
  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: fr
  text: Éloigne-toi d’un homme insensé[a], car tu ne trouveras pas sur ses lèvres de paroles de connaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Éloigne-toi de devant un homme insensé, car tu ne trouveras pas de paroles de connaissance. »'
    reason: L’expression מִנֶּגֶד signifie littéralement « de devant / de la présence de ». Le parfait יָדַעְתָּ peut être compris, dans ce proverbe, comme l’idée de rencontrer ou de trouver.
lexical_decisions:
- source_word: לֵךְ מִנֶּגֶד
  choice: Éloigne-toi de la présence de
  rationale: L’impératif לֵךְ et l’expression spatiale מִנֶּגֶד appellent à quitter l’endroit où l’on se tient devant quelqu’un. Cette formulation conserve la notion de présence tout en restant naturelle en français.
- source_word: לְאִישׁ כְּסִיל
  choice: un homme insensé
  rationale: אִישׁ désigne ici un homme, et כְּסִיל est le terme sapientiel courant pour une personne réfractaire à la sagesse. « Insensé » rend ce sens moral et intellectuel sans se limiter à un manque d’intelligence.
- source_word: וּבַל יָדַעְתָּ
  choice: car tu ne discernes pas chez lui
  rationale: בַל est une négation poétique, et le parfait יָדַעְתָּ peut exprimer ici une constatation générale. Le lien causal avec l’exhortation est rendu par « car ». « Discernes » préserve l’idée de reconnaître ou constater, tandis que « chez lui » explicite sobrement le rapport au discours de l’insensé.
- source_word: שִׂפְתֵי דָעַת
  choice: des paroles de connaissance
  rationale: L’expression signifie littéralement « des lèvres de connaissance », les lèvres étant une métonymie de la parole. En français, « paroles de connaissance » transmet clairement l’idée sans produire une image obscure ou artificielle.
