  register: Style sapientiel bref, direct et digne. Le tutoiement singulier correspond à l’impératif et au verbe hébreux à la deuxième personne masculine du singulier. La formulation principale conserve la nuance spatiale de מִנֶּגֶד et laisse la note présenter une lecture française plus idiomatique.
