  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’impératif invite à se retirer d’un homme qualifié de כְּסִיל, parce que ses paroles ne manifestent pas la connaissance. Toutefois, « tu ne discernes pas chez lui » affaiblit la valeur résultative/proverbiale possible du parfait יָדַעְתָּ et produit une formulation moins directe que « tu ne trouveras pas ».'
  naturalness: « Éloigne-toi de la présence d’un homme » est grammatical, mais peu idiomatique en français moderne ; « Éloigne-toi d’un homme » suffit dans ce contexte. « Discerner chez lui des paroles de connaissance » est également lourd. La formulation révisée est plus fluide tout en conservant la concision sapientielle.
  terminology: « Homme insensé » rend correctement אִישׁ כְּסִיל et conserve le terme traditionnel de la littérature sapientielle. « Paroles de connaissance » rend de façon intelligible l’image hébraïque « lèvres de connaissance »; l’ajout de « sur ses lèvres » restaure cette image et son lien avec la parole.
