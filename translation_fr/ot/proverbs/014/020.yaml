source:
  edition: WLC
  text: גַּם לְ֭/רֵעֵ/הוּ יִשָּׂ֣נֵא רָ֑שׁ וְ/אֹהֲבֵ֖י עָשִׁ֣יר רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/020.yaml
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
translation:
  language: fr
  text: Le pauvre est détesté même par son prochain[a], mais ceux qui aiment le riche sont nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par son ami » ; le mot hébreu peut désigner un prochain, un compagnon ou un ami.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: même
  rationale: 'La particule renforce le constat : le rejet du pauvre s’étend même à une personne qui lui est proche.'
- source_word: לְרֵעֵהוּ
  choice: par son prochain
  rationale: Avec le verbe passif, la préposition introduit l’agent. « Prochain » garde le sens large de voisin ou de proche, tandis que « ami » demeure une possibilité réelle.
- source_word: יִשָּׂנֵא
  choice: est détesté
  rationale: 'La forme nifal est passive : c’est le pauvre qui subit l’hostilité. Cette traduction préserve donc la grammaire et le contraste avec « aiment ».'
- source_word: רָשׁ
  choice: le pauvre
  rationale: Le nom désigne une personne démunie. Le singulier générique français convient au style concis du proverbe.
- source_word: וְאֹהֲבֵי
  choice: mais ceux qui aiment
  rationale: Le participe conserve sa valeur verbale et maintient le parallèle entre être détesté et aimer.
- source_word: עָשִׁיר
  choice: le riche
  rationale: Le singulier générique fait pendant à « le pauvre » et exprime naturellement le contraste social du proverbe.
- source_word: רַבִּים
  choice: sont nombreux
  rationale: Cette formulation rend directement l’idée d’abondance tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et proverbial. Les singuliers génériques « le pauvre » et « le riche » préservent le parallélisme concis de l’hébreu ; la voix passive du premier membre est maintenue.
