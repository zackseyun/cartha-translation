  source_fidelity: 'Le premier membre est fidèle : יִרְאַת יְהוָה est bien rendu par « la crainte de Yahweh », et מְקוֹר חַיִּים par « une source de vie ». Dans le second membre, לָסוּר est un infinitif qal intransitif (« se détourner / s’écarter »), non une forme causative (« détourner »). La relative « qui détourne » attribue donc explicitement à la crainte ou à la source une action causative que l’hébreu ne formule pas et fixe inutilement le sujet implicite.'
