  terminology: « Crainte », « Yahweh », « source », « pièges » et « mort » conviennent au français international moderne et préservent les termes théologiques et métaphoriques du proverbe. La note sur « fontaine » est une alternative lexicale recevable. La seconde note doit toutefois proposer l’alternative sans introduire « afin de », qui interprète plus étroitement la relation comme un but.
