  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: fr
  text: La crainte de Yahweh est une source de vie[a], pour se détourner des pièges de la mort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fontaine de vie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour s’écarter des pièges de la mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: la crainte de
  rationale: Le nom à l’état construit avec Yahweh désigne la crainte révérencielle qui lui est due. « Crainte » conserve le motif théologique propre aux Proverbes sans le réduire à un simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: מְקוֹר
  choice: une source
  rationale: Le terme désigne une source ou un jaillissement d’eau; « source » est naturel en français et maintient l’image d’une origine vivifiante.
- source_word: חַיִּים
  choice: de vie
  rationale: Bien que sa forme soit plurielle en hébreu, le mot exprime ici la notion générale de vie, rendue naturellement au singulier en français.
- source_word: לָסוּר
  choice: qui détourne
  rationale: L’infinitif précédé de ל peut indiquer le but ou le résultat. La proposition relative exprime naturellement en français l’effet de cette source de vie, sans préciser un objet humain absent de l’hébreu.
- source_word: מִמֹּקְשֵׁי
  choice: des pièges de
  rationale: Le nom évoque des dispositifs cachés qui capturent; « pièges » conserve cette métaphore dans un français courant et digne.
- source_word: מָוֶת
  choice: la mort
  rationale: Traduction directe qui préserve l’étendue de sens du proverbe, de la mort littérale à la ruine mortelle, sans la restreindre.
theological_decisions:
- issue: Sens de « crainte de Yahweh » dans la littérature de sagesse
  choice: Conserver « crainte »
  alternative: « respect pour Yahweh » ou « révérence envers Yahweh »
  rationale: L’expression hébraïque associe peur, révérence et disposition obéissante. « Crainte » maintient cette tension canonique au lieu de l’adoucir par interprétation.
- issue: Portée de l’infinitif לָסוּר
  choice: « qui détourne des pièges de la mort »
  alternative: « afin de se détourner des pièges de la mort »
  rationale: La construction peut exprimer le but ou le résultat, et le sujet implicite de « se détourner » n’est pas spécifié. Le texte principal rend l’effet de la crainte de Yahweh, tandis qu’une note conserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme proverbial, le nom divin Yahweh, la force de « crainte » et l’ambiguïté possible de l’infinitif final.
