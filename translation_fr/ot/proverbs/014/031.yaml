source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: fr
  text: Qui opprime le pauvre insulte son Créateur[a], mais qui se montre généreux envers une personne dans le besoin l’honore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « mais qui honore le pauvre se montre généreux envers une personne dans le besoin ». Dans « l’honore », le pronom hébreu peut renvoyer soit au pauvre, soit à son Créateur. Le texte principal le rapporte à Dieu en raison du parallélisme.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Qui opprime
  rationale: Le participe qal employé comme désignation générale reçoit une formulation proverbiale naturelle en français. « Opprimer » exprime la pression injuste et l’exploitation.
- source_word: דָּל
  choice: le pauvre
  rationale: דָּל peut désigner une personne pauvre, faible ou socialement vulnérable. « Le pauvre » est ici clair et idiomatique.
- source_word: חֵרֵף
  choice: insulte
  rationale: Le verbe signifie outrager, couvrir de mépris ou traiter avec dédain. « Insulte » rend directement l’affront fait au Créateur.
- source_word: עֹשֵׂהוּ
  choice: celui qui l’a fait
  rationale: 'Le suffixe renvoie naturellement au pauvre : son oppresseur insulte celui qui l’a créé. Cette formulation est plus naturelle en français courant que « son Auteur » et conserve le lien verbal avec « faire ».'
- source_word: וּמְכַבְּדוֹ
  choice: l’honore
  rationale: Le suffixe pronominal peut renvoyer soit à celui qui a fait le pauvre, soit au pauvre. Le texte principal retient Dieu comme référent en raison du parallélisme, sans majuscule interprétative.
- source_word: חֹנֵן
  choice: fait grâce à
  rationale: Le participe exprime l’octroi bienveillant d’une faveur. « Faire grâce à » garde la nuance de faveur, même si « se montrer généreux envers » serait plus immédiatement idiomatique.
- source_word: אֶבְיוֹן
  choice: l’indigent
  rationale: אֶבְיוֹן souligne le besoin et le dénuement. « L’indigent » le distingue de דָּל, rendu par « le pauvre ».
theological_decisions:
- issue: Référent du suffixe dans וּמְכַבְּדוֹ
  choice: 'Le pronom renvoie à Dieu, celui qui a fait le pauvre : faire grâce à l’indigent revient à l’honorer.'
  alternative: 'Le pronom renvoie au pauvre : « mais qui l’honore fait grâce à l’indigent ».'
  rationale: Le parallélisme antithétique favorise la correspondance entre insulter celui qui a fait le pauvre et honorer ce même Créateur en faisant grâce à l’indigent. Comme l’hébreu permet aussi l’autre rattachement, celui-ci est signalé en note.
translation_notes:
  register: Français international moderne, concis et proverbial. Le registre reste digne et accessible. « Celui qui l’a fait » évite une tournure archaïque tout en gardant l’écho explicite au Créateur; « indigent » préserve la distinction lexicale entre דָּל et אֶבְיוֹן.
