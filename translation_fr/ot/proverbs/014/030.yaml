id: PRO.14.30
reference: Proverbs 14:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חַיֵּ֣י בְ֭שָׂרִים לֵ֣ב מַרְפֵּ֑א וּ/רְקַ֖ב עֲצָמ֣וֹת קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/030.yaml
  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
translation:
  language: fr
  text: Un cœur paisible[a] est la vie du corps, mais la jalousie[b] est la pourriture des os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Un cœur sain est la vie du corps ». Le terme hébreu traduit par « paisible » évoque plus littéralement la guérison ou la santé.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’envie ». Le mot hébreu peut désigner la jalousie, l’envie ou le zèle, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי
  choice: est la vie
  rationale: Le pluriel construit de חַיִּים exprime idiomatiquement la « vie ». La proposition hébraïque étant sans verbe, « est la vie » restitue naturellement la relation prédicative en français.
- source_word: בְשָׂרִים
  choice: du corps
  rationale: Le terme désigne littéralement les « chairs », mais renvoie ici à l’organisme physique dans son ensemble. « Corps » évite les connotations théologiques que « chair » pourrait suggérer à tort.
- source_word: לֵב
  choice: cœur
  rationale: Le mot désigne ici la disposition intérieure et le centre des émotions. « Cœur » conserve l’image anthropologique hébraïque et reste naturel en français.
- source_word: מַרְפֵּא
  choice: paisible
  rationale: Le nom évoque la guérison, la santé ou un état salutaire. Dans ce contexte, « paisible » exprime l’état intérieur bénéfique visé, tandis que la valeur plus littérale est signalée en note.
- source_word: וּרְקַב
  choice: mais … est la pourriture
  rationale: La conjonction introduit un contraste, d’où « mais ». « Pourriture » conserve l’image concrète et forte de רֶקֶב.
- source_word: עֲצָמוֹת
  choice: des os
  rationale: La traduction littérale préserve l’image de la charpente profonde du corps et, par extension, de la vitalité intérieure.
- source_word: קִנְאָה
  choice: jalousie
  rationale: Le terme peut désigner la jalousie, l’envie ou le zèle. Son effet destructeur dans ce parallélisme favorise ici le sens négatif de « jalousie », sans exclure « envie ».
theological_decisions: []
