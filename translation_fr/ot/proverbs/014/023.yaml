id: PRO.14.23
reference: Proverbs 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/כָל עֶ֭צֶב יִהְיֶ֣ה מוֹתָ֑ר וּ/דְבַר שְׂ֝פָתַ֗יִם אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/023.yaml
  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: fr
  text: Tout travail pénible procure un avantage, mais les paroles en l’air ne mènent qu’au manque[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la pauvreté ». Le mot hébreu peut désigner le manque, le besoin ou la pauvreté.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל עֶצֶב
  choice: Tout travail pénible
  rationale: עֶצֶב désigne ici un travail marqué par l’effort ou la peine. La tournure française exprime naturellement la portée générale de בְּכָל sans réduire le terme à la douleur.
- source_word: יִהְיֶה
  choice: procure
  rationale: L’imparfait hébreu a une valeur gnomique dans ce proverbe. Le présent français exprime une vérité générale, et « procure » rend idiomatiquement la relation entre le travail et son résultat.
- source_word: מוֹתָר
  choice: un avantage
  rationale: מוֹתָר peut désigner ce qui reste en plus, un surplus, un gain ou un avantage. « Avantage » conserve une portée assez large et convient à l’antithèse avec le manque.
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: mais les paroles en l’air
  rationale: Littéralement « parole des lèvres », l’expression désigne des propos qui ne s’accompagnent pas d’actes. « Paroles en l’air » restitue naturellement en français le contraste dépréciatif avec le travail réel.
- source_word: אַךְ
  choice: ne… que
  rationale: La construction restrictive française « ne… que » rend la force exclusive de אַךְ.
- source_word: לְ/מַחְסוֹר
  choice: au manque
  rationale: מַחְסוֹר couvre le manque, le besoin et la pauvreté. « Manque » préserve cette amplitude sémantique; « pauvreté » est signalé comme possibilité plus forte en note.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’antithèse concise du proverbe est conservée; « travail pénible » souligne l’effort productif, tandis que « paroles en l’air » désigne un discours sans action.
