id: PRO.14.19
reference: Proverbs 14:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שַׁח֣וּ רָ֭עִים לִ/פְנֵ֣י טוֹבִ֑ים וּ֝/רְשָׁעִ֗ים עַֽל שַׁעֲרֵ֥י צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: fr
  text: Les mauvais s’inclinent devant les bons[a], et les méchants aux portes du juste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se prosternent devant les bons ». Le verbe hébreu peut désigner un geste plus profond consistant à se courber très bas.
    reason: lexical_alternative
  - marker: b
    text: Se tenir « aux portes du juste » peut évoquer une démarche de dépendance, de supplication ou la reconnaissance de la position du juste.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ
  choice: s’inclinent
  rationale: Le verbe שׁחה exprime le fait de se courber profondément, voire de se prosterner. « S’inclinent » conserve l’image d’abaissement sans préciser si le geste est volontaire ou imposé.
- source_word: רָעִים
  choice: les mauvais
  rationale: L’adjectif masculin pluriel est substantivé et désigne des personnes mauvaises. Cette formulation concise convient au parallélisme proverbial.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition signifie « devant, en présence de » et s’accorde naturellement avec le geste de s’incliner.
- source_word: טוֹבִים
  choice: les bons
  rationale: L’adjectif pluriel substantivé forme avec « les mauvais » l’antithèse directe du premier membre.
- source_word: וּרְשָׁעִים
  choice: et les méchants
  rationale: רְשָׁעִים désigne couramment, dans la littérature de sagesse, ceux dont la conduite est coupable ou impie. « Les méchants » est clair et conserve le parallélisme.
- source_word: עַל
  choice: aux
  rationale: Avec « portes », עַל situe ici les méchants à l’entrée ou auprès des portes; « aux portes » est l’expression française naturelle.
- source_word: שַׁעֲרֵי
  choice: portes
  rationale: Le pluriel construit est conservé. Les portes peuvent évoquer l’entrée d’une demeure ou le lieu où l’on se présente devant quelqu’un.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif singulier substantivé représente une personne juste. « Le juste » est une désignation concise et traditionnelle, encore intelligible en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et proverbial. Le parallélisme antithétique et les catégories génériques de personnes sont maintenus; la seconde proposition, sans verbe exprimé en hébreu, reste elliptique en français.
