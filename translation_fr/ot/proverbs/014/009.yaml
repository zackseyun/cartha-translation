id: PRO.14.9
reference: Proverbs 14:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱ֭וִלִים יָלִ֣יץ אָשָׁ֑ם וּ/בֵ֖ין יְשָׁרִ֣ים רָצֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: fr
  text: Les insensés se moquent de la culpabilité[a], mais la faveur se trouve parmi les hommes droits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se moquent du sacrifice de réparation ». Le mot hébreu peut désigner soit la culpabilité, soit, dans un contexte cultuel, un sacrifice de réparation.
    reason: alternative_reading
  - marker: b
    text: Ou « l’agrément » ou « la bonne volonté ». L’hébreu ne précise pas à qui appartient cette faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: les insensés
  rationale: Désigne, dans les Proverbes, des personnes moralement dépourvues de sagesse; « les insensés » est naturel, concis et digne en français.
- source_word: יָלִיץ
  choice: se moquent de
  rationale: Le hifil de לוץ exprime ici la raillerie ou le mépris; cette formulation rend clairement l'attitude des insensés envers la culpabilité.
- source_word: אָשָׁם
  choice: la culpabilité
  rationale: Dans ce contexte sapientiel et éthique, le sens abstrait de faute imputable ou de culpabilité convient mieux que le sens cultuel de « sacrifice de réparation », tout en laissant celui-ci en note.
- source_word: וּבֵין
  choice: mais parmi
  rationale: La conjonction introduit le second membre antithétique; « mais parmi » rend naturellement ce contraste.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Expression claire pour les personnes moralement droites; elle évite ici la tournure plus abstraite « les justes », qui pourrait réduire la nuance de rectitude.
- source_word: רָצוֹן
  choice: la bienveillance
  rationale: Le terme peut désigner la faveur, l'agrément ou la bonne volonté. « Bienveillance » s'intègre naturellement avec « parmi » sans préciser abusivement si elle vient de Dieu ou des humains.
theological_decisions:
- issue: Sens de אָשָׁם dans un contexte sapientiel non cultuel
  choice: « culpabilité », au sens abstrait
  alternative: « sacrifice de réparation »
  rationale: Le contraste moral entre les insensés et les hommes droits favorise le sens abstrait, mais la polysémie cultuelle réelle du mot hébreu est conservée en note.
- issue: Référent de רָצוֹן
  choice: référent laissé indéterminé par « bienveillance »
  alternative: faveur de Dieu, bonne volonté humaine ou agrément
  rationale: L'hébreu ne précise pas de qui vient cette faveur; la traduction préserve donc cette ouverture théologique et relationnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique est conservé, ainsi que l'ambiguïté de רָצוֹן. Les deux appels de note figurent explicitement dans le texte principal.
