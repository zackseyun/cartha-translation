  source_fidelity: Le sens principal retenu pour אָשָׁם (« culpabilité ») est défendable dans ce proverbe sapientiel, et la note conserve correctement l'alternative cultuelle. Le contraste entre les insensés et les hommes droits ainsi que l'indétermination du référent de רָצוֹן sont préservés. Toutefois, « règne » ajoute une affirmation verbale absente de l'hébreu, dont le second membre est nominal.
