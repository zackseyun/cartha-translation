source:
  edition: WLC
  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: fr
  text: La faveur du roi va au serviteur qui agit avec sagesse[a], mais sa colère sera contre celui qui fait honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se montre prudent » ou « qui est compétent ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais sa colère sera pour celui qui fait honte »; la relation peut aussi se rendre par « sera contre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: faveur
  rationale: Dans la littérature de sagesse, le terme désigne couramment une disposition favorable, l’agrément ou la bienveillance; « faveur » convient naturellement au contexte royal.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent direct du nom commun désignant un monarque.
- source_word: לְעֶבֶד
  choice: va au serviteur
  rationale: La préposition ל indique ici la personne vers laquelle se porte la faveur. « Serviteur » convient au cadre de service auprès du roi sans préciser inutilement le statut juridique.
- source_word: מַשְׂכִּיל
  choice: qui agit avec sagesse
  rationale: Le participe hiphil de שׂכל peut exprimer une conduite avisée, prudente ou efficace. Cette formulation conserve sa valeur active et pratique.
- source_word: וְעֶבְרָתוֹ
  choice: mais sa colère
  rationale: עֶבְרָה désigne une colère intense. « Colère » est idiomatique en français, tandis que « mais » rend le contraste entre les deux membres.
- source_word: תִּהְיֶה
  choice: s’abattra
  rationale: Le verbe היה signifie littéralement « sera ». Avec la colère comme sujet et la personne visée introduite implicitement, « s’abattra sur » exprime naturellement en français la relation et la valeur prospective de l’imparfait hébreu.
- source_word: מֵבִישׁ
  choice: celui qui fait honte
  rationale: 'Le participe hiphil de בוש est compris causativement: une personne qui cause honte ou déshonneur.'
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme antithétique est conservé. « Va au » et « s’abattra sur » rendent explicitement et naturellement les relations suggérées par les prépositions et la syntaxe hébraïques.
