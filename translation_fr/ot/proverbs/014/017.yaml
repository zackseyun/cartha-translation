  text: קְֽצַר אַ֭פַּיִם יַעֲשֶׂ֣ה אִוֶּ֑לֶת וְ/אִ֥ישׁ מְ֝זִמּ֗וֹת יִשָּׂנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/017.yaml
  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: fr
  text: L’homme qui s’emporte vite agit avec folie, et l’homme aux desseins[a] est détesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux projets ». Le terme hébreu peut avoir une nuance défavorable, comme « desseins calculateurs », mais il n’est pas explicitement qualifié de mauvais.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: qui s’emporte vite
  rationale: Littéralement « court de narines/colère », cette expression hébraïque désigne celui qui se met rapidement en colère. « Qui s’emporte vite » est naturel en français moderne et conserve cette idée.
- source_word: יַעֲשֶׂה
  choice: agit
  rationale: Le verbe courant signifie « faire ». Avec אִוֶּלֶת, « agit avec folie » exprime clairement l’action sans s’éloigner de la construction hébraïque.
- source_word: אִוֶּלֶת
  choice: avec folie
  rationale: Le nom désigne la folie, au sens moral et pratique fréquent dans les Proverbes. La locution « avec folie » en maintient la valeur nominale tout en produisant une phrase française naturelle.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le substantif est masculin singulier et présente ici un type humain représentatif. « L’homme » respecte la forme du texte source.
- source_word: מְזִמּוֹת
  choice: mauvais desseins
  rationale: Le mot peut désigner des projets, calculs ou desseins et prend souvent une nuance péjorative. Le contexte défavorable, notamment « est détesté », soutient « mauvais desseins », tout en signalant en note la possibilité plus neutre.
- source_word: יִשָּׂנֵא
  choice: est détesté
  rationale: La forme niphal est passive. Le présent convient à la portée générale de cette maxime; « détesté » rend avec force et naturel l’idée d’être l’objet de haine.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme entre les deux types d’hommes est conservé, ainsi que le passif de la seconde proposition. La formulation évite un calque obscur de l’expression hébraïque liée à la colère.
