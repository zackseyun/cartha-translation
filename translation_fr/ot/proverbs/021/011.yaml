id: PRO.21.11
reference: Proverbs 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/עְנָשׁ לֵ֭ץ יֶחְכַּם פֶּ֑תִי וּ/בְ/הַשְׂכִּ֥יל לְ֝/חָכָ֗ם יִקַּח דָּֽעַת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
translation:
  language: fr
  text: Quand on punit le moqueur[a], le naïf devient sage ; quand on instruit le sage[b], il acquiert la connaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Lors de la punition du moqueur » ou « En punissant le moqueur ».'
    reason: La construction hébraïque peut être comprise comme circonstancielle, temporelle ou instrumentale.
  - marker: b
    text: 'Ou : « quand on donne du discernement au sage ».'
    reason: Le verbe hébreu peut exprimer le fait d’instruire, de rendre perspicace ou de donner du discernement.
lexical_decisions:
- source_word: בַּעְנָשׁ
  choice: Quand on punit
  rationale: La préposition בְּ suivie de l’infinitif construit exprime ici la circonstance ou le moment. Cette tournure rend naturellement en français le sens de « lors de la punition de » sans imposer au texte un agent précis.
- source_word: לֵץ
  choice: le moqueur
  rationale: לֵץ désigne dans les Proverbes une personne railleuse qui méprise la correction. « Moqueur » est courant et conserve cette portée morale.
- source_word: יֶחְכַּם
  choice: devient sage
  rationale: Le qal de חכם exprime ici l’entrée ou la progression dans la sagesse, plutôt que sa simple possession.
- source_word: פֶּתִי
  choice: le naïf
  rationale: פֶּתִי désigne une personne inexpérimentée, influençable et encore dépourvue de discernement moral. « Naïf » restitue cette catégorie sapientielle sans suggérer une déficience intellectuelle.
- source_word: וּבְהַשְׂכִּיל
  choice: quand on instruit
  rationale: L’infinitif construit au hiphil de שׂכל peut signifier rendre perspicace, donner du discernement ou instruire. La formulation choisie est idiomatique et garde l’agent indéterminé.
- source_word: לְחָכָם
  choice: le sage
  rationale: L’adjectif masculin singulier substantivé présente un type proverbial. En français, « le sage » conserve naturellement cette forme générique.
- source_word: יִקַּח דָּעַת
  choice: il acquiert la connaissance
  rationale: לקח signifie littéralement « prendre » ; avec דַּעַת, il exprime idiomatiquement l’acquisition de la connaissance. « Acquiert » conserve mieux cette image que le simple verbe « apprend ».
theological_decisions:
- issue: Genre grammatical des personnages proverbiaux
  choice: le naïf / le sage
  alternative: la personne naïve / la personne sage
  rationale: L’hébreu emploie des formes masculines singulières comme types représentatifs. Les substantifs masculins génériques sont naturels dans le style proverbial français et respectent la forme du texte sans limiter explicitement l’énoncé aux seuls hommes.
- issue: Effet respectif de la punition et de l’instruction
  choice: Le naïf apprend en voyant punir le moqueur, tandis que le sage acquiert lui-même la connaissance lorsqu’il est instruit.
  alternative: Faire du sage l’agent qui instruit ou donne du discernement
  rationale: La construction בְּ + infinitif hiphil suivie de לְחָכָם indique le fait de donner du discernement au sage. La traduction garde l’agent indéfini et préserve le contraste entre l’effet indirect sur le naïf et l’effet direct sur le sage.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est maintenu par la répétition de « quand on », tandis que « moqueur », « naïf » et « sage » restent des catégories morales facilement compréhensibles.
