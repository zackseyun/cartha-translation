  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
translation:
  language: fr
  text: Pratiquer la justice est une joie pour le juste, mais une cause d’effroi[a] pour ceux qui font le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pratiquer la justice est une joie pour le juste, mais la ruine pour ceux qui font le mal. » Le nom hébreu מְחִתָּה peut évoquer l’effroi, la consternation ou la ruine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: une joie
  rationale: Le nom désigne la joie ou l’allégresse. « Une joie » conserve sa valeur nominale et forme une phrase naturelle en français.
- source_word: לַצַּדִּיק
  choice: pour le juste
  rationale: La préposition ל exprime ici la relation ou l’intérêt. Le singulier substantivé « le juste » garde la portée représentative de l’hébreu.
- source_word: עֲשׂוֹת
  choice: pratiquer
  rationale: L’infinitif construit présente l’action comme un principe général. « Pratiquer » est naturel avec « la justice » et ne réduit pas l’expression à un acte ponctuel.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte sapientiel, le terme renvoie à ce qui est juste, notamment dans la conduite et le jugement. « La justice » en rend clairement la portée morale et juridique.
- source_word: וּמְחִתָּה
  choice: mais une cause d’effroi
  rationale: Le nom peut désigner l’effroi, la consternation ou la ruine. « Une cause d’effroi » exprime naturellement le contraste avec « une joie » tout en maintenant dans la note la possibilité d’un résultat destructeur.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: pour ceux qui font le mal
  rationale: La formule signifie littéralement « pour les artisans de mal/injustice ». Cette tournure moderne et transparente conserve l’idée d’une pratique active du mal.
- source_word: אָוֶן
  choice: le mal
  rationale: Dans cette association avec « ceux qui font », le mot désigne la perversité ou le mal moral plutôt qu’un simple malheur.
theological_decisions:
- issue: Rapport entre l’exercice de la justice et מְחִתָּה pour les malfaiteurs
  choice: Le second membre décrit la justice comme une cause d’effroi pour ceux qui font le mal.
  alternative: Le second membre peut annoncer leur ruine ou leur destruction.
  rationale: La concision hébraïque ne précise pas si מְחִתָּה décrit principalement leur réaction intérieure ou l’issue qui les frappe. Le texte principal retient le sens d’effroi, tandis que la note préserve l’autre lecture sans trancher une tension réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé par « pour le juste / pour ceux qui font le mal ». « Pratiquer la justice » est idiomatique tout en gardant la portée générale de l’infinitif hébreu.
