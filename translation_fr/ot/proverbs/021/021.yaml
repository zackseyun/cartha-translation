reference: Proverbs 21:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רֹ֭דֵף צְדָקָ֣ה וָ/חָ֑סֶד יִמְצָ֥א חַ֝יִּ֗ים צְדָקָ֥ה וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
translation:
  language: fr
  text: Qui poursuit la droiture[a] et l’amour fidèle[b] trouvera la vie, la droiture[c] et l’honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « justice » pour l’une ou les deux occurrences de « droiture » ; le terme hébreu peut désigner aussi bien la rectitude personnelle qu’une conduite juste.
    reason: lexical_alternative
  - marker: b
    text: L’expression « amour fidèle » traduit l’hébreu ḥésèd, qui peut aussi être rendu par « bonté », « compassion » ou « amour loyal ».
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, la seconde occurrence de « droiture » peut aussi être comprise au sens de « réhabilitation » ou de « reconnaissance de son bon droit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֵף
  choice: poursuit
  rationale: Le participe exprime une recherche active et continue. « Poursuit » conserve cette énergie et permet une formulation proverbiale générale avec « Qui ».
- source_word: צְדָקָה
  choice: justice
  rationale: Le terme hébreu embrasse ici la droiture personnelle et la conduite juste. « Justice » est naturel en français et peut porter ces dimensions, sans limiter le sens au seul domaine judiciaire.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: חֶסֶד associe bonté, attachement et fidélité. « Amour fidèle » en rend la densité relationnelle mieux que « bonté » ou « compassion » seules.
- source_word: יִמְצָא
  choice: trouvera
  rationale: L’imparfait hébreu énonce la conséquence générale de cette poursuite; le futur français convient au caractère sentencieux du proverbe.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le mot soit formellement pluriel en hébreu, il désigne idiomatiquement la vie; le singulier est la forme française naturelle.
- source_word: צְדָקָה
  choice: la justice
  rationale: La répétition du même terme est conservée afin de respecter la symétrie concise de l’hébreu, tout en signalant en note que la seconde occurrence peut avoir la nuance de réhabilitation.
- source_word: כָבוֹד
  choice: l’honneur
  rationale: Dans ce contexte sapientiel, כָבוֹד évoque surtout l’honneur et l’estime accordée à une personne. « Honneur » évite d’introduire indûment l’idée de prospérité matérielle.
theological_decisions:
- issue: Sens de la répétition de צְדָקָה dans un contexte sapientiel
  choice: « justice » dans les deux occurrences
  alternative: « droiture » dans l’une ou les deux occurrences; « réhabilitation » dans la seconde
  rationale: Employer le même mot préserve la répétition hébraïque et la tension entre la justice recherchée comme conduite et la justice trouvée comme fruit ou reconnaissance, sans trancher silencieusement entre une qualité morale et une réhabilitation.
translation_notes:
  register: Français international moderne, concis et sentencieux. La tournure « Qui poursuit… » exprime un sujet générique sans alourdir le proverbe. Le vocabulaire reste digne et accessible, et la répétition de « justice » reproduit volontairement celle de l’hébreu.
