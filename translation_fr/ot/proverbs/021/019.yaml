  yaml_path: translation/ot/proverbs/021/019.yaml
  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
translation:
  language: fr
  text: Mieux vaut habiter dans une terre désertique qu’avec une femme querelleuse et irritable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « querelleuse et exaspérante ». Le dernier terme peut décrire soit son caractère (« irritable », « coléreuse »), soit l’effet qu’elle produit sur les autres (« exaspérante », « provocante »).
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Cette tournure proverbiale française exprime naturellement l’adjectif prédicatif et la comparaison.
- source_word: שֶׁבֶת
  choice: habiter
  rationale: L’infinitif de ישׁב désigne ici le fait de demeurer dans un lieu; « habiter » est courant et digne.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: dans une terre désertique
  rationale: Cette formulation conserve à la fois אֶרֶץ, « terre », et מִדְבָּר, région déserte ou sauvage.
- source_word: מֵאֵשֶׁת
  choice: qu’avec une femme
  rationale: Le מִן marque la comparaison après טוֹב; le français demande ici « avec » pour exprimer la cohabitation implicite.
- source_word: מדונים
  choice: querelleuse
  rationale: Le pluriel abstrait lié aux disputes qualifie une personne portée à provoquer ou entretenir les querelles.
- source_word: וָכָעַס
  choice: et irritable
  rationale: כעס peut renvoyer à la colère, à l’irritation ou au fait de provoquer l’irritation; « irritable » garde ici une part de cette latitude sans alourdir le vers.
