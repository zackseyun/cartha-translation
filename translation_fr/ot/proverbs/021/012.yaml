id: PRO.21.12
reference: Proverbs 21:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַשְׂכִּ֣יל צַ֭דִּיק לְ/בֵ֣ית רָשָׁ֑ע מְסַלֵּ֖ף רְשָׁעִ֣ים לָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/012.yaml
  text: The righteous one considers the house of the wicked[a], bringing the wicked to ruin.
translation:
  language: fr
  text: Le juste considère avec discernement la maison du méchant[a] et précipite les méchants dans la ruine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le Juste considère avec discernement la maison du méchant ; il précipite les méchants dans la ruine », si « le Juste » désigne Dieu plutôt qu’une personne juste.'
    reason: Lecture alternative concernant l’identité du sujet.
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: considère avec discernement
  rationale: Le participe hiphil de שכל exprime ici une attention réfléchie ou une compréhension avisée. Cette formulation française conserve à la fois l’idée d’examiner et celle d’agir avec intelligence.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier substantivé désigne une figure représentative. « Le juste » est naturel dans le style proverbial français et ne précise pas davantage l’identité du sujet que l’hébreu.
- source_word: לְבֵית רָשָׁע
  choice: la maison du méchant
  rationale: בַּיִת peut désigner la maison, la maisonnée ou le domaine familial. « La maison » reste proche de l’image hébraïque, tandis que רָשָׁע est conservé au singulier.
- source_word: מְסַלֵּף
  choice: précipite
  rationale: Le verbe סלף évoque le fait de renverser, bouleverser ou conduire à la perte. Avec לָרָע, « précipite… dans la ruine » exprime naturellement l’action et son issue désastreuse.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé au pluriel est rendu par la désignation générique habituelle en français biblique courant.
- source_word: לָרָע
  choice: dans la ruine
  rationale: רַע peut désigner ici non le mal moral, mais le malheur ou le désastre qui atteint les méchants. « Dans la ruine » évite de suggérer que le sujet les rend moralement mauvais.
theological_decisions:
- issue: Identification du sujet dans ce proverbe à la syntaxe condensée
  choice: Le sujet est un juste humain dans l’ensemble du verset.
  alternative: « Le Juste » désigne Dieu, qui considère la maison du méchant et précipite les méchants dans la ruine.
  rationale: Aucun nom divin n’apparaît dans l’hébreu, et צַדִּיק se lit naturellement comme la figure humaine typique des Proverbes. La lecture qui y voit Dieu demeure possible et est signalée en note, sans être imposée au texte principal.
translation_notes:
  register: Français moderne, international et proverbial. La formulation reste concise et digne ; « avec discernement » explicite la nuance de שכל sans alourdir excessivement le verset. Le marqueur [a] est placé après le premier membre, là où se pose l’ambiguïté sur l’identité du juste.
