  yaml_path: translation/ot/proverbs/021/004.yaml
  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
translation:
  language: fr
  text: Le regard hautain, le cœur orgueilleux et le labour des méchants sont un péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture : « la lampe des méchants ». Le mot hébreu vocalisé ici « labour » peut aussi être lu « lampe » selon une autre vocalisation ; il peut également désigner la terre labourée ou en jachère des méchants.'
    reason: alternative_reading
lexical_decisions:
- source_word: רוּם עֵינַיִם
  choice: Le regard hautain
  rationale: Littéralement « hauteur des yeux » ; l’expression désigne l’arrogance. « Le regard hautain » conserve l’image des yeux dans un français naturel.
- source_word: וּרְחַב לֵב
  choice: le cœur orgueilleux
  rationale: Littéralement « largeur du cœur » ; dans ce contexte sapientiel, la formule évoque l’orgueil ou l’exaltation de soi, non la générosité.
- source_word: נִר
  choice: la lampe
  rationale: La forme hébraïque admet principalement une lecture liée à la lampe et une lecture agricole (« labour », « terre cultivée ou en friche »). « Lampe » est retenu dans le texte, tandis que l’ambiguïté réelle est signalée en note.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Terme courant de la littérature sapientielle pour les personnes moralement coupables ; cette formulation est concise et traditionnelle sans être obscure.
- source_word: חַטָּאת
  choice: sont péché
  rationale: Le substantif hébreu signifie « péché ». La formulation conserve sa force nominale et rattache le verdict à l’ensemble des éléments énumérés.
theological_decisions:
- issue: Interprétation de נִר רְשָׁעִים
  choice: la lampe des méchants
  alternative: le labour des méchants ; la terre cultivée ou en friche des méchants
  rationale: Le choix est lexical et contextuel plutôt que doctrinal. La lecture « lampe » est ancienne et cohérente, mais la lecture agricole est également plausible et modifie sensiblement le proverbe ; elle est donc conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. Le singulier collectif « le regard » rend naturellement l’idiome hébreu portant sur les yeux. Les tirets préservent la construction dense et quelque peu ambiguë du proverbe sans la résoudre par une paraphrase.
