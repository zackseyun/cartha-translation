  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣פֶר לַ/צַּדִּ֣יק רָשָׁ֑ע וְ/תַ֖חַת יְשָׁרִ֣ים בּוֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/018.yaml
  text: The wicked is a ransom for the righteous[a], and the treacherous one in place of the upright.
translation:
  language: fr
  text: Le méchant sert de rançon pour le juste[a], et l’homme perfide prend la place des hommes droits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le méchant sert de substitut au juste, et l’homme perfide aux hommes droits. »'
    reason: Alternative lexicale mettant davantage en évidence l’idée de substitution portée par כֹּפֶר et תַּחַת.
lexical_decisions:
- source_word: כֹּפֶר
  choice: rançon
  rationale: Le nom désigne une rançon ou une compensation versée à la place de quelqu’un. « Rançon » conserve l’image brève et forte du texte hébreu.
- source_word: לַצַּדִּיק
  choice: pour le juste
  rationale: La préposition ל exprime ici la relation de substitution ou d’avantage; le singulier générique est conservé dans le style proverbial.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le masculin singulier a une valeur générique et établit le contraste moral traditionnel avec « le juste ».
- source_word: וְתַחַת
  choice: et … prend la place de
  rationale: תַּחַת exprime ici la substitution plutôt que la position spatiale; cette formulation française rend clairement le parallélisme.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Le pluriel désigne ceux dont la conduite est moralement droite. « Hommes droits » restitue le pluriel et demeure naturel en français.
- source_word: בּוֹגֵד
  choice: l’homme perfide
  rationale: Le participe substantivé désigne celui qui agit avec déloyauté ou perfidie, sans limiter le sens à la trahison politique.
theological_decisions:
- issue: Nature de la substitution évoquée
  choice: Conserver la métaphore de la rançon sans préciser son mécanisme
  alternative: Interpréter explicitement le verset comme un jugement providentiel ou une expiation
  rationale: Le proverbe affirme un renversement substitutif, mais ne précise ni les circonstances ni le mécanisme théologique; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est préservé, avec une formulation légèrement explicitée (« sert de », « prend la place de ») pour produire une phrase naturelle sans résoudre l’ambiguïté de la maxime.
