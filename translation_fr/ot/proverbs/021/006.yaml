  text: פֹּ֣עַל א֭וֹצָרוֹת בִּ/לְשׁ֣וֹן שָׁ֑קֶר הֶ֥בֶל נִ֝דָּ֗ף מְבַקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
translation:
  language: fr
  text: 'Acquérir des trésors par une langue mensongère,

    c’est une vapeur emportée[a] ;

    ceux qui acquièrent ainsi ces trésors cherchent la mort[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une vapeur emportée » ; image de quelque chose d’inconsistant et vite dissipé.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque finale, littéralement « ceux qui cherchent la mort », est difficile à rattacher au reste de la phrase. Elle peut aussi signifier : « ceux qui recherchent de tels trésors cherchent la mort ». Certaines traductions, sous l’influence de versions anciennes ou d’une autre lecture du texte, ont : « un piège mortel » ou « un piège pour ceux qui cherchent la mort ».'
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  choice: Acquérir des trésors
  rationale: פֹּעַל désigne ici l’action ou le résultat de l’activité. La tournure infinitive rend naturellement en français le processus d’obtention de richesses, tandis que « trésors » conserve l’image concrète d’une richesse accumulée.
- source_word: בִּלְשׁוֹן שָׁקֶר
  choice: par une langue mensongère
  rationale: Littéralement « par/avec une langue de mensonge ». La traduction conserve l’image corporelle de la langue et exprime clairement le moyen frauduleux.
- source_word: הֶבֶל נִדָּף
  choice: une vapeur chassée par le vent
  rationale: הֶבֶל évoque une vapeur ou un souffle, donc quelque chose d’inconsistant et de passager ; נִדָּף signifie « chassé, emporté ». La mention du vent, implicite dans l’image, produit une expression française naturelle sans remplacer l’image hébraïque par une abstraction.
- source_word: מְבַקְשֵׁי מָוֶת
  choice: ceux qui agissent ainsi cherchent la mort
  rationale: Le texte massorétique porte littéralement « ceux qui cherchent la mort ». La formulation française rattache ces mots aux personnes qui acquièrent frauduleusement les trésors, tout en signalant en note que la syntaxe hébraïque demeure condensée et difficile.
theological_decisions:
- issue: Rapport syntaxique de מְבַקְשֵׁי מָוֶת avec le reste du verset
  choice: Les auteurs du gain mensonger sont présentés comme cherchant la mort.
  alternative: '« ceux qui recherchent de tels trésors cherchent la mort » ; selon une lecture influencée par des versions anciennes ou par une correction du texte : « un piège mortel » ou « un piège pour ceux qui cherchent la mort ».'
  rationale: Le texte massorétique dit bien « ceux qui cherchent la mort », sans mot signifiant « piège ». La traduction suit donc prioritairement l’hébreu reçu, mais explicite sobrement le sujet implicite et conserve les autres analyses dans une note afin de ne pas masquer la difficulté.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme en trois lignes préserve la progression de l’acquisition frauduleuse vers son caractère éphémère, puis vers son issue mortelle. « Langue mensongère » garde l’image hébraïque sans archaïsme marqué.
