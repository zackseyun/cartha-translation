  source_fidelity: 'La première proposition rend correctement פֹּעַל אֹצָרוֹת et בִּלְשׁוֹן שָׁקֶר. « Chassée par le vent » ajoute toutefois « le vent », qui n’est pas exprimé dans le texte hébreu : נִדָּף signifie « emporté / dispersé », sans agent explicite. La dernière expression est réellement elliptique et difficile ; la traduction peut expliciter prudemment son rapport aux auteurs de l’acquisition frauduleuse, à condition que la note maintienne les autres analyses possibles.'
