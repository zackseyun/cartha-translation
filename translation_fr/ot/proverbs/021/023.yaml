source:
  edition: WLC
  text: שֹׁמֵ֣ר פִּ֭י/ו וּ/לְשׁוֹנ֑/וֹ שֹׁמֵ֖ר מִ/צָּר֣וֹת נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/023.yaml
  text: Whoever guards his mouth and his tongue guards his life from troubles[a].
translation:
  language: fr
  text: Qui veille sur sa bouche et sur sa langue préserve sa vie des détresses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se préserve lui-même des détresses »; littéralement « préserve son néfèsh des détresses ».
    reason: Alternative lexicale permettant de conserver l’amplitude de נֶפֶשׁ, qui peut désigner la vie ou la personne elle-même.
lexical_decisions:
- source_word: שֹׁמֵר
  choice: veille sur / préserve
  rationale: Le participe qal exprime l’idée de garder ou de veiller. « Veille sur » est naturel pour la bouche et la langue; « préserve » restitue le même verbe dans la conséquence sans raideur en français.
- source_word: פִּיו
  choice: sa bouche
  rationale: Traduction directe du nom suffixé; la bouche représente ici l’usage de la parole.
- source_word: לְשׁוֹנוֹ
  choice: sa langue
  rationale: Traduction directe qui conserve l’image hébraïque de la langue comme organe de la parole.
- source_word: מִצָּרוֹת
  choice: des détresses
  rationale: Le pluriel désigne des situations de détresse ou des difficultés pressantes. « Détresses » conserve l’intensité possible du terme sans la préciser excessivement.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: Dans ce contexte sapientiel, נֶפֶשׁ désigne naturellement la vie ou la personne elle-même, plutôt qu’une « âme » définie en un sens technique.
theological_decisions:
- issue: Sens de נַפְשׁוֹ
  choice: sa vie
  alternative: sa personne / lui-même / son âme
  rationale: « Sa vie » exprime ici la protection de la personne contre les conséquences néfastes de paroles irréfléchies, sans imposer une conception particulière de l’âme.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme bouche/langue et rend le redoublement de שֹׁמֵר par deux verbes français étroitement apparentés afin d’éviter une tournure peu naturelle.
