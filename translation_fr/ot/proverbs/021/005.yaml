  text: מַחְשְׁב֣וֹת חָ֭רוּץ אַךְ לְ/מוֹתָ֑ר וְ/כָל אָ֝֗ץ אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
translation:
  language: fr
  text: Les projets de l’homme diligent mènent assurément à l’abondance[a], mais quiconque agit avec précipitation aboutit assurément au manque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au profit »; le terme hébreu peut désigner un surplus, un avantage ou un gain.
    reason: lexical_alternative
  - marker: b
    text: Ou « à la pauvreté »; le terme hébreu peut désigner le manque, le besoin ou l’appauvrissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: les projets
  rationale: Dans ce contexte sapientiel, le nom désigne des desseins réfléchis et intentionnels plutôt que de simples pensées.
- source_word: חָרוּץ
  choice: l’homme diligent
  rationale: Le terme décrit une personne appliquée et travailleuse. Cette formulation est claire, digne et naturelle en français moderne.
- source_word: אַךְ
  choice: assurément
  rationale: Dans les deux membres, la particule souligne la certitude du résultat proverbial; la répétition conserve la structure emphatique de l’hébreu.
- source_word: לְמוֹתָר
  choice: mènent à l’abondance
  rationale: מוֹתָר peut désigner un surplus, un avantage ou un gain. « Abondance » forme ici une antithèse concrète avec « manque », tandis que « mènent à » explicite naturellement la relation de résultat portée par לְ.
- source_word: וְכָל
  choice: mais quiconque
  rationale: Le waw relie deux membres antithétiques et se rend naturellement par « mais »; כָל suivi du participe a une portée générale, exprimée par « quiconque ».
- source_word: אָץ
  choice: agit avec précipitation
  rationale: Le participe désigne celui qui se hâte ou se précipite. Cette formulation exprime le comportement impulsif sans imposer l’idée distincte d’impatience.
- source_word: לְמַחְסוֹר
  choice: aboutit au manque
  rationale: מַחְסוֹר couvre le manque, le besoin ou la pauvreté. « Manque » préserve cette amplitude sémantique et répond directement à « abondance ».
theological_decisions: []
