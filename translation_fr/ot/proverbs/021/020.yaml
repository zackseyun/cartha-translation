source:
  edition: WLC
  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
translation:
  language: fr
  text: Un trésor précieux et de l’huile se trouvent dans la demeure du sage, mais l’homme insensé les engloutit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’engloutit ». Le pronom hébreu est au singulier et peut désigner collectivement la réserve de biens. Le verbe évoque leur consommation irréfléchie.'
    reason: Ambiguïté grammaticale et image lexicale du texte hébreu.
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  choice: un trésor précieux
  rationale: אוֹצָר désigne des richesses ou des biens mis en réserve, et נֶחְמָד les qualifie de désirables ou précieux. Cette formulation naturelle conserve l’idée d’une réserve de valeur.
- source_word: וָשֶׁמֶן
  choice: et de l’huile
  rationale: שֶׁמֶן désigne couramment l’huile, souvent l’huile d’olive, mais le texte ne précise pas sa nature.
- source_word: בִּנְוֵה חָכָם
  choice: dans la demeure du sage
  rationale: נָוֶה désigne ici un lieu d’habitation. « Demeure » garde l’image sans préciser indûment le type de bâtiment, tandis que « du sage » rend naturellement l’adjectif substantivé חָכָם.
- source_word: וּכְסִיל אָדָם
  choice: mais l’homme insensé
  rationale: כְּסִיל est le terme sapiential habituel pour une personne dépourvue de sagesse; אָדָם souligne le type humain décrit. « L’homme insensé » conserve la forme masculine singulière du proverbe.
- source_word: יְבַלְּעֶנּוּ
  choice: les engloutit
  rationale: Le verbe בלע signifie littéralement « avaler, engloutir » et évoque ici une consommation irréfléchie. Le pronom français pluriel reprend naturellement les deux biens mentionnés, tout en signalant en note le singulier hébreu.
theological_decisions:
- issue: Portée anthropologique des formes masculines חָכָם ... כְסִיל אָדָם
  choice: « du sage… l’homme insensé »
  alternative: « d’une personne sage… une personne insensée »
  rationale: L’hébreu emploie des formes masculines singulières représentatives. La traduction les conserve sans restreindre pour autant la portée générale du proverbe.
- issue: Référent du suffixe singulier dans יְבַלְּעֶנּוּ
  choice: Le rendre au pluriel par « les », avec une note
  alternative: « l’engloutit »
  rationale: Le suffixe hébreu est grammaticalement singulier, mais il peut reprendre collectivement la réserve précieuse constituée du trésor et de l’huile. En français, « les » rattache clairement le verbe aux deux éléments, tandis que la note préserve l’ambiguïté formelle de l’original.
translation_notes:
  register: Français international moderne, proverbial et digne. « Engloutit » conserve l’image vigoureuse de l’hébreu tout en restant courant; « demeure » donne au verset une légère tenue littéraire sans archaïsme.
