source:
  edition: WLC
  text: הֵעֵ֬ז אִ֣ישׁ רָשָׁ֣ע בְּ/פָנָ֑י/ו וְ֝/יָשָׁ֗ר ה֤וּא יכין דרכי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/029.yaml
  text: A wicked man puts on a bold face[a], but an upright man makes his way sure.
translation:
  language: fr
  text: L’homme méchant prend un air effronté[a], mais l’homme droit affermit sa conduite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’homme méchant endurcit son visage, mais l’homme droit établit ses voies. »'
    reason: Alternative plus littérale qui conserve l’expression faciale hébraïque et le pluriel formel de דרכיו.
lexical_decisions:
- source_word: הֵעֵז ... בְּפָנָיו
  choice: prend un air effronté
  rationale: Le hifil de עזז associé à « son visage » décrit une assurance provocante ou impudente. Cette tournure française naturelle conserve l’image du visage sans suggérer une simple bravoure honorable.
- source_word: אִישׁ רָשָׁע
  choice: l’homme méchant
  rationale: Le masculin singulier proverbial est conservé. « Méchant » rend la catégorie morale de רָשָׁע et maintient son opposition avec « droit ».
- source_word: וְיָשָׁר הוּא
  choice: mais l’homme droit
  rationale: « Mais » explicite le contraste entre les deux membres. « L’homme droit » exprime naturellement le substantif/adjectif masculin singulier, tandis que הוּא renforce le sujet sans exiger un pronom français séparé.
- source_word: יכין
  choice: affermit
  rationale: Le hifil de כון signifie établir, rendre ferme ou disposer solidement. « Affermit » garde cette idée fondamentale sans réduire le verbe à la seule orientation.
- source_word: דרכיו
  choice: sa conduite
  rationale: Littéralement « ses voies », cette expression désigne ici la manière de vivre. Le singulier collectif « sa conduite » est idiomatique en français et conserve la portée éthique du proverbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, proverbial et digne. « Air effronté » évite l’ambiguïté positive que pourrait avoir « air assuré »; « conduite » rend clairement la métaphore biblique de la voie comme manière de vivre.
