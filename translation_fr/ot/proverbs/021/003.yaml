  text: עֲ֭שֹׂה צְדָקָ֣ה וּ/מִשְׁפָּ֑ט נִבְחָ֖ר לַ/יהוָ֣ה מִ/זָּֽבַח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
translation:
  language: fr
  text: Pratiquer la droiture et la justice est, pour Yahweh, préférable à un sacrifice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « est choisi pour/par Yahweh » ; dans cette comparaison avec le sacrifice, la tournure exprime la préférence ou l’approbation divine.'
    reason: La formulation littérale de נִבְחָר לַיהוָה est inhabituelle en français. La note conserve l’ambiguïté de la préposition tout en expliquant la valeur comparative dans le contexte.
lexical_decisions:
- source_word: עֲשֹׂה
  choice: Pratiquer
  rationale: L’infinitif construit fonctionne ici comme un substantif verbal. « Pratiquer » exprime naturellement une conduite habituelle, sans réduire le terme à un acte isolé.
- source_word: צְדָקָה
  choice: la droiture
  rationale: Le mot désigne ici la conduite conforme à ce qui est juste. « Droiture » préserve sa distinction avec מִשְׁפָּט, rendu par « justice ».
- source_word: וּמִשְׁפָּט
  choice: et la justice
  rationale: Dans ce contexte éthique, מִשְׁפָּט évoque l’exercice de la justice ou un jugement équitable; « justice » est le terme français moderne le plus clair.
- source_word: נִבְחָר
  choice: est […] préférable
  rationale: Le participe niphal signifie littéralement « est choisi » et exprime ici une préférence dans la comparaison avec le sacrifice. « Est préférable » transmet ce sens tout en conservant la tournure évaluative du texte.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le point de vue ou la préférence de Yahweh. « Pour Yahweh » est idiomatique en français et évite de préciser excessivement si la construction signifie littéralement « choisi pour » ou « choisi par ».
- source_word: מִזָּבַח
  choice: à un sacrifice
  rationale: Le מִן introduit la comparaison. Le singulier « un sacrifice » formule naturellement en français la catégorie générale du sacrifice.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Rapport entre conduite juste et sacrifice
  choice: une préférence comparative de Yahweh
  alternative: un rejet absolu de tout sacrifice
  rationale: Le comparatif indique que la droiture et la justice ont davantage de prix pour Yahweh que le sacrifice; il ne déclare pas en lui-même que tout sacrifice est intrinsèquement illégitime.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Droiture et justice » maintient le parallélisme des deux notions éthiques, tandis que l’incise « pour Yahweh » garde la structure évaluative de l’hébreu.
