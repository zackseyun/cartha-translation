source:
  edition: WLC
  text: ט֗וֹב לָ/שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מִ֝דְיָנִ֗ים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/009.yaml
  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: fr
  text: Mieux vaut habiter dans un coin du toit qu’avec une femme querelleuse dans une maison partagée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une maison où l’on vit en compagnie d’autres personnes » ; l’expression hébraïque signifie littéralement « et une maison de compagnie/d’association ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette comparaison proverbiale, l’adjectif introduit naturellement en français une préférence entre deux situations.
- source_word: לָשֶׁבֶת
  choice: habiter
  rationale: Bien que le verbe signifie littéralement « s’asseoir », il désigne couramment le fait de demeurer ou d’habiter dans ce contexte.
- source_word: עַל פִּנַּת גָּג
  choice: dans un coin du toit
  rationale: L’expression évoque un espace exigu et exposé sur le toit plat d’une maison. « Dans un coin du toit » rend l’image de façon naturelle en français.
- source_word: מֵאֵשֶׁת
  choice: qu’avec une … femme
  rationale: La préposition מִן marque ici la comparaison après טוֹב. « Avec » explicite en français la cohabitation mise en contraste.
- source_word: מִדְיָנִים
  choice: querelleuse
  rationale: Le pluriel nominal « querelles, conflits » qualifie ici la femme comme portée à provoquer des disputes.
- source_word: וּבֵית חָבֶר
  choice: dans une maison partagée
  rationale: L’expression hébraïque, difficile et concise, associe la maison à la compagnie ou à l’association. Cette traduction conserve l’idée probable d’un logement occupé en commun sans masquer l’incertitude lexicale, signalée en note.
