source:
  edition: WLC
  text: מַתָּ֣ן בַּ֭/סֵּתֶר יִכְפֶּה אָ֑ף וְ/שֹׁ֥חַד בַּ֝/חֵ֗ק חֵמָ֥ה עַזָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/014.yaml
  text: A gift in secret subdues anger[a], and a bribe in the bosom, fierce wrath.
translation:
  language: fr
  text: Un cadeau donné en secret apaise la colère, et un pot-de-vin dans le pli du vêtement[a] calme une violente fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « dans le sein » ou « dans le giron » : il s’agit de quelque chose dissimulé dans les plis du vêtement, ce qui souligne le caractère secret du geste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: cadeau
  rationale: Le nom désigne un don ou un présent. « Cadeau » est naturel en français moderne et le distingue de שֹׁחַד, qui désigne explicitement un pot-de-vin dans le second membre.
- source_word: בַּסֵּתֶר
  choice: en secret
  rationale: Cette expression évoque un lieu caché ou une action accomplie secrètement. « En secret » conserve la concision et le parallélisme du proverbe.
- source_word: יִכְפֶּה
  choice: apaise
  rationale: Dans ce contexte, le verbe exprime l’idée de couvrir, contenir ou faire retomber la colère. « Apaise » rend naturellement l’effet produit sans affirmer nécessairement que la colère disparaît totalement.
- source_word: אָף
  choice: colère
  rationale: Bien que le mot signifie littéralement « nez », il constitue ici un idiome hébreu courant désignant la colère.
- source_word: שֹׁחַד
  choice: pot-de-vin
  rationale: Ce terme désigne régulièrement un don corrupteur. « Pot-de-vin » préserve la différence lexicale et morale avec le simple « cadeau » du premier membre.
- source_word: בַּחֵק
  choice: glissé dans le pli du vêtement
  rationale: L’expression signifie littéralement « dans le sein » ou « dans le giron » et évoque un objet dissimulé dans les plis du vêtement. La formulation retenue rend cette image clairement en français moderne.
- source_word: חֵמָה עַזָּה
  choice: une violente fureur
  rationale: Le groupe nominal intensifie le second membre par rapport à la simple « colère » du premier. « Violente fureur » conserve cette progression.
theological_decisions:
- issue: Portée morale du proverbe
  choice: Conserver l’énoncé descriptif sans ajouter d’approbation morale.
  alternative: Préciser dans le texte que le pot-de-vin est condamné.
  rationale: Le verset énonce l’efficacité d’un don secret et d’un pot-de-vin pour calmer la colère, sans formuler ici de jugement explicite. Le terme « pot-de-vin » garde toutefois sa connotation négative naturelle.
translation_notes:
  register: Français international moderne, concis et proverbial. La répétition verbale implicite de l’hébreu est explicitée par « calme » dans le second membre pour assurer une lecture naturelle, tandis que « violente fureur » maintient l’intensification poétique.
