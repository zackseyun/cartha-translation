  yaml_path: translation/ot/proverbs/021/025.yaml
  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: fr
  text: Le désir du paresseux le tue, car ses mains refusent de travailler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Le désir
  rationale: Le nom singulier désigne ici un désir pressant. « Désir » conserve la portée générale du terme hébreu sans ajouter l’idée d’un désir nécessairement mauvais ou insatiable.
- source_word: עָצֵל
  choice: du paresseux
  rationale: Terme courant et naturel correspondant à la figure proverbiale de celui qui refuse l’effort.
- source_word: תְּמִיתֶנּוּ
  choice: le tue
  rationale: 'Rend directement la forme causative : le désir est présenté comme ce qui provoque sa mort.'
- source_word: מֵאֲנוּ יָדָיו לַעֲשׂוֹת
  choice: ses mains refusent de travailler
  rationale: Conserve la personnification des mains et exprime naturellement en français l’idée de faire le travail nécessaire.
theological_decisions:
- issue: Nature du lien entre le désir, l’inaction et la mort
  choice: Conserver l’affirmation directe « le tue »
  alternative: « le mène à la mort »
  rationale: L’hébreu formule une causalité forte. Il n’est pas nécessaire de préciser si la mort est littérale, sociale ou figurée ; la tension proverbiale reste ouverte.
translation_notes:
  register: Français moderne, sobre et proverbial. La phrase conserve le parallélisme causal et la personnification concrète des mains.
