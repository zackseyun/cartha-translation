  text: עִ֣יר גִּ֭בֹּרִים עָלָ֣ה חָכָ֑ם וַ֝/יֹּ֗רֶד עֹ֣ז מִבְטֶחָֽ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/022.yaml
  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
translation:
  language: fr
  text: Un sage monte contre la ville des guerriers et fait tomber la force en laquelle elle met sa confiance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la force de sa confiance ». Le mot hébreu rendu par « force » peut, dans ce contexte militaire, évoquer une puissance ou une défense concrète, telle qu’une forteresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: ville
  rationale: Le nom désigne une agglomération, souvent fortifiée dans un contexte militaire. « Ville » est ici naturel et suffisamment large.
- source_word: גִּבֹּרִים
  choice: guerriers
  rationale: Le terme désigne des hommes forts ou vaillants et possède souvent une nuance militaire. « Guerriers » exprime clairement cette nuance dans le contexte de l’assaut d’une ville.
- source_word: עָלָה
  choice: monte à l’assaut de
  rationale: Le sens premier est « monter », mais le verbe s’emploie couramment pour une avancée militaire contre une ville. Cette formulation conserve l’image tout en explicitant le contexte hostile.
- source_word: חָכָם
  choice: un sage
  rationale: L’adjectif substantivé masculin singulier désigne ici, selon l’usage proverbial, un homme caractérisé par la sagesse. « Un sage » est idiomatique et concis en français.
- source_word: וַיֹּרֶד
  choice: fait tomber
  rationale: La forme causative signifie littéralement « fait descendre ». « Fait tomber » convient naturellement au renversement d’un ouvrage défensif.
- source_word: עֹז
  choice: forteresse
  rationale: Le sens ordinaire est « force » ou « puissance », mais le contexte militaire permet un emploi concret désignant ce qui assure la force défensive de la ville. L’alternative plus littérale est signalée en note.
- source_word: מִבְטֶחָה
  choice: dans laquelle elle met sa confiance
  rationale: Le nom exprime la confiance ou la sécurité, et le suffixe féminin singulier renvoie vraisemblablement à la ville. La tournure française rend explicite la relation entre la ville et ce qui lui inspire confiance.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le présent proverbial, l’image militaire de la montée contre la ville et le contraste entre sagesse et puissance guerrière.
