review_pass:
  verdict: revise
  source_fidelity: La structure et l’image militaire sont bien rendues, mais « forteresse » impose un sens concret à עֹז (« force, puissance ») qui n’est pas certain. Le texte hébreu dit plus directement que le sage fait tomber « la force de sa confiance » (ou la force en laquelle la ville place sa confiance). Le suffixe féminin singulier renvoie naturellement à la ville.
  naturalness: « Un sage monte contre la ville des guerriers » conserve l’idiome militaire sans surcharger le verbe d’une interprétation. « La force en laquelle elle met sa confiance » est naturel dans un registre proverbial soutenu et permet de conserver la personnification de la ville.
  terminology: « Guerriers » convient à גִּבֹּרִים dans ce contexte. « Sage » rend bien חָכָם. Le remplacement de « forteresse » par « force » préserve l’ambiguïté lexicale de עֹז; la possibilité d’un sens défensif concret est signalée en note, sans le faire passer pour certain.
  issues:
  - severity: medium
    issue: « forteresse » restreint indûment le sens de עֹז.
    rationale: Le nom signifie d’abord « force, puissance ». Dans ce contexte, il peut évoquer un moyen de défense concret, mais le texte ne désigne pas explicitement une forteresse. La traduction principale doit préserver cette ouverture.
  - severity: low
    issue: La note décrit « la force de sa confiance » comme une formulation littérale, mais la traduction principale et l’explication privilégient trop fortement l’ouvrage défensif.
    rationale: Une note doit présenter le sens concret comme une possibilité contextuelle, non comme le sens assuré du mot.
