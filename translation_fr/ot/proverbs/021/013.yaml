source:
  edition: WLC
  text: אֹטֵ֣ם אָ֭זְנ/וֹ מִ/זַּעֲקַת דָּ֑ל גַּֽם ה֥וּא יִ֝קְרָ֗א וְ/לֹ֣א יֵעָנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
translation:
  language: fr
  text: Celui qui se bouche les oreilles au cri du pauvre criera lui aussi, et ne recevra pas de réponse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du faible » ou « du nécessiteux ». Le mot hébreu דָּל peut désigner une personne pauvre, faible ou socialement vulnérable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  choice: ferme
  rationale: Le participe qal exprime l’action délibérée de fermer ou de boucher. « Ferme l’oreille » est naturel en français et conserve l’idée d’un refus d’écouter.
- source_word: אָזְנוֹ
  choice: l’oreille
  rationale: L’hébreu emploie le singulier avec un suffixe masculin singulier. La tournure française « fermer l’oreille » préserve cette image concrète sans alourdir la phrase.
- source_word: מִזַּעֲקַת
  choice: au cri de
  rationale: Avec « fermer l’oreille », la préposition désigne ce que la personne refuse d’entendre. « Au cri de » est la formulation française idiomatique.
- source_word: דָּל
  choice: du pauvre
  rationale: דָּל peut désigner une personne pauvre, faible ou socialement vulnérable. « Le pauvre » est clair et traditionnel dans la littérature sapientiale, tandis qu’une note conserve les autres nuances possibles.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: 'Cette expression souligne la réciprocité : celui qui n’écoute pas connaîtra à son tour l’absence de réponse.'
- source_word: יִקְרָא
  choice: appellera
  rationale: Le verbe signifie appeler ou crier. « Appellera » reste naturel tout en évitant de préciser à tort le destinataire de l’appel.
- source_word: וְלֹא יֵעָנֶה
  choice: mais on ne lui répondra pas
  rationale: 'Le niphal a un sens passif : ne pas recevoir de réponse. La construction française impersonnelle rend naturellement ce passif et laisse l’agent non exprimé, comme en hébreu.'
theological_decisions:
- issue: Identité de celui qui ne répond pas à l’appel
  choice: Laisser l’agent non précisé par la tournure « on ne lui répondra pas »
  alternative: Préciser que Dieu ne lui répondra pas, ou que les autres ne lui répondront pas
  rationale: L’hébreu n’indique pas explicitement qui ne répond pas. Le contexte peut évoquer la justice divine, mais la traduction ne doit pas résoudre cette ambiguïté.
- issue: Masculin singulier générique
  choice: Employer « celui qui » et « lui »
  alternative: Employer une formulation épicène ou plurielle
  rationale: Les formes hébraïques sont au masculin singulier avec une portée générale. Le français masculin générique conserve ici la structure représentative du texte source.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme de réciprocité et l’image concrète de l’oreille fermée. « Mais » explicite naturellement le contraste logique sans ajouter d’agent au passif hébreu.
