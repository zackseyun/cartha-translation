  source_fidelity: 'Le sens global est fidèle : le refus délibéré d’entendre le cri du pauvre est suivi, par réciprocité, d’un appel qui demeure sans réponse. Toutefois, « ferme l’oreille » est moins idiomatique et atténue légèrement l’image de l’hébreu אֹטֵם, qui évoque le fait de boucher/obstruer. « Mais » introduit un contraste qui n’est pas explicitement marqué par la simple coordination hébraïque.'
  naturalness: « Se boucher les oreilles au cri de quelqu’un » est une expression française moderne et naturelle. « Crier » rend mieux ici יִקְרָא dans son parallélisme avec « le cri », sans préciser de destinataire. « Ne recevra pas de réponse » est idiomatique et maintient l’agent de la non-réponse implicite.
  terminology: « Le pauvre » convient pour דָּל, et la note préserve avec justesse les nuances de faiblesse et de vulnérabilité sociale. Aucun terme théologique n’est ajouté ; l’agent implicite du passif demeure non identifié.
