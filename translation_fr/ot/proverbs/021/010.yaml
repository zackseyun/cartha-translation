  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
translation:
  language: fr
  text: L’âme du méchant désire le mal ; son prochain[a] ne trouve aucune faveur à ses yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ami » ou « son compagnon ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « trouver faveur aux yeux de quelqu’un » signifie recevoir de lui faveur, bonté ou bienveillance.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: l’âme
  rationale: Dans ce contexte, le terme désigne la vie intérieure, siège du désir. « L’âme » conserve la formulation concise et la portée anthropologique de l’hébreu.
- source_word: רָשָׁע
  choice: du méchant
  rationale: L’adjectif est employé comme substantif et présente un type humain représentatif, sans qu’il soit nécessaire d’ajouter « homme ».
- source_word: אִוְּתָה
  choice: désire
  rationale: Le verbe exprime le désir, éventuellement intense. « Désire » rend le sens sans accentuer outre mesure sa force.
- source_word: רָע
  choice: le mal
  rationale: Dans ce contexte sapientiel, le mot possède principalement une portée morale, même s’il peut aussi évoquer ce qui fait du tort.
- source_word: יֻחַן
  choice: ne trouve aucune faveur
  rationale: La forme passive de חנן indique que le prochain ne bénéficie d’aucune faveur ou bienveillance de la part du méchant.
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: La traduction conserve l’image hébraïque qui exprime le regard et l’attitude du méchant envers autrui.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: Le terme peut désigner le prochain, le compagnon ou l’ami. « Prochain » convient au cadre éthique et social du proverbe tout en préservant sa portée générale.
theological_decisions:
- issue: Portée de רָע
  choice: le mal
  alternative: le tort / ce qui fait du mal
  rationale: Le contexte décrit l’orientation morale du méchant. « Le mal » garde cette dimension éthique sans exclure les conséquences nuisibles de son désir.
translation_notes:
  register: Français moderne, sobre et proverbial. La structure parallèle de l’hébreu et l’image « à ses yeux » sont conservées, tandis que la ponctuation clarifie le rapport entre les deux propositions.
