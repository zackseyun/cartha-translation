  text: עֵד כְּזָבִ֥ים יֹאבֵ֑ד וְ/אִ֥ישׁ שׁ֝וֹמֵ֗עַ לָ/נֶ֥צַח יְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/028.yaml
  text: A false witness will perish[a], but a man who listens will speak forever.
translation:
  language: fr
  text: Le faux témoin périra, mais l’homme qui écoute parlera toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parlera continuellement » ou « parlera avec un effet durable ». L’expression hébraïque rendue par « toujours » peut souligner la validité persistante de sa parole plutôt qu’une durée littéralement sans fin.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד כְּזָבִים
  choice: le faux témoin
  rationale: Littéralement « témoin de mensonges » ; en français courant, « faux témoin » conserve naturellement la portée judiciaire de l’expression.
- source_word: יֹאבֵד
  choice: disparaîtra
  rationale: Le verbe אבד peut signifier périr, disparaître ou être anéanti. « Disparaîtra » exprime ici la suppression ou la perte de crédit du témoin mensonger sans préciser indûment la manière.
- source_word: וְאִישׁ
  choice: mais l’homme
  rationale: Le ו marque ici le contraste, et אִישׁ est un nom masculin singulier. « L’homme » préserve la forme proverbiale et représentative de l’hébreu.
- source_word: שׁוֹמֵעַ
  choice: qui écoute
  rationale: Le participe de שמע peut signifier entendre, écouter ou obéir. Dans le contexte du témoignage, il désigne vraisemblablement celui qui écoute attentivement avant de parler.
- source_word: לָנֶצַח
  choice: durablement
  rationale: נֶצַח peut exprimer la perpétuité ou la durée persistante. Ici, « durablement » rend probablement l’idée d’une parole qui conserve sa validité ou son effet, plutôt qu’une parole prononcée sans fin.
- source_word: יְדַבֵּר
  choice: parlera
  rationale: Le piel imparfait de דבר signifie « parler ». Le futur français maintient le parallélisme avec « disparaîtra » et laisse à לָנֶצַח la nuance de durée.
theological_decisions:
- issue: Portée de לָנֶצַח appliqué à la parole
  choice: parlera durablement
  alternative: parlera pour toujours / parlera continuellement
  rationale: Le texte hébreu permet plusieurs nuances. La traduction retenue met en avant la validité ou l’effet durable de la parole sans imposer l’idée métaphysique d’une parole sans fin ; la note conserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, ainsi que le masculin singulier de אִישׁ. La formulation évite de résoudre entièrement l’ambiguïté de לָנֶצַח ; celle-ci est explicitée en note.
