id: PRO.21.31
reference: Proverbs 21:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ס֗וּס מ֭וּכָן לְ/י֣וֹם מִלְחָמָ֑ה וְ֝/לַֽ/יהוָ֗ה הַ/תְּשׁוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
translation:
  language: fr
  text: Le cheval est préparé pour le jour du combat, mais la victoire[a] appartient à Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la délivrance » ou « le salut ». Le mot hébreu peut désigner plus largement le fait d’être sauvé ou délivré ; ici, « victoire » convient au contexte du combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  choice: le cheval
  rationale: Le nom désigne simplement le cheval. Le contexte militaire est déjà exprimé par « pour le jour du combat » ; il n’est donc pas nécessaire d’ajouter « de guerre ».
- source_word: מוּכָן
  choice: est préparé
  rationale: Le participe passif exprime un état résultant d’une préparation. « Est préparé » conserve cette valeur passive tout en restant naturel en français.
- source_word: לְיוֹם מִלְחָמָה
  choice: pour le jour du combat
  rationale: La préposition marque ici la destination ou la préparation en vue de quelque chose. « Le jour du combat » rend naturellement l’expression hébraïque et évoque l’affrontement concret.
- source_word: וְלַיהוָה
  choice: mais ... appartient à Yahvé
  rationale: La conjonction introduit un contraste entre la préparation humaine et l’issue qui dépend de Dieu. La construction avec לְ est rendue idiomatiquement par « appartient à ».
- source_word: יהוה
  choice: Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahvé » est sa forme française traditionnelle et intelligible, qui préserve ici le nom divin plutôt que de le remplacer par un titre.
- source_word: הַתְּשׁוּעָה
  choice: la victoire
  rationale: Le terme peut désigner le salut, la délivrance ou la victoire. Dans le contexte immédiat du cheval préparé au combat, « victoire » exprime le mieux son sens concret.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le verset emploie le nom divin lui-même. Le conserver sous la forme française « Yahvé » évite de substituer un titre au nom présent dans l’hébreu.
- issue: Portée de תְּשׁוּעָה dans ce proverbe militaire
  choice: la victoire appartient à Yahvé
  alternative: le salut ou la délivrance appartient à Yahvé
  rationale: Le cadre militaire favorise « victoire », sans nier l’éventail plus large du mot hébreu. Une note maintient les autres possibilités lexicales et l’ambiguïté réelle.
translation_notes:
  register: Formulation concise, proverbiale et digne, en français international moderne. Le parallélisme contrastif entre la préparation humaine et la souveraineté divine est conservé.
