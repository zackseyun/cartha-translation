id: PRO.21.2
reference: Proverbs 21:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּֽל דֶּרֶךְ אִ֭ישׁ יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן לִבּ֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
translation:
  language: fr
  text: Toutes les voies d’un homme sont droites à ses yeux, mais Yahweh pèse les cœurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: Toutes les
  rationale: 'Avec le nom « voies » au pluriel, cette formulation exprime naturellement en français la portée distributive de l’hébreu : les différentes conduites qu’un homme adopte.'
- source_word: דֶּרֶךְ
  choice: voies
  rationale: « Voie » conserve la métaphore sapientielle du chemin pour désigner la conduite ou l’orientation de la vie.
- source_word: אִישׁ
  choice: d’un homme
  rationale: Le singulier masculin représentatif de l’hébreu est conservé sans transformer le proverbe en formulation abstraite.
- source_word: יָשָׁר
  choice: droites
  rationale: « Droites » garde à la fois l’image spatiale et le jugement moral ou pratique porté sur la conduite.
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: Cette expression française correspond directement à l’idiome hébreu et indique qu’il s’agit de l’évaluation personnelle de l’homme.
- source_word: וְתֹכֵן
  choice: mais … pèse
  rationale: « Pèse » préserve l’image d’une évaluation comparable à celle d’une balance. La conjonction est rendue par « mais » afin de faire ressortir le contraste entre jugement humain et examen divin.
- source_word: לִבּוֹת
  choice: les cœurs
  rationale: Le pluriel hébreu est maintenu. Dans l’anthropologie biblique, le cœur englobe pensées, intentions et motivations, sans se limiter aux émotions.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
theological_decisions:
- issue: Portée de l’évaluation divine des « cœurs »
  choice: Conserver « pèse les cœurs » sans expliciter davantage
  alternative: « examine les motivations profondes »
  rationale: 'L’image hébraïque demeure ouverte et riche : Yahweh évalue l’être intérieur, notamment les pensées et les intentions. Une paraphrase préciserait indûment ce que le proverbe laisse condensé.'
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le nom propre divin; le conserver distingue ce nom d’un simple titre.
translation_notes:
  register: Français international actuel, sobre et proverbial. Le parallélisme et la métaphore de la pesée sont conservés; « à ses yeux » reste idiomatique et dignifié.
