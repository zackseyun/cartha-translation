  yaml_path: translation/ot/proverbs/021/030.yaml
  text: There is no wisdom[a], no understanding, and no counsel against Yahweh.
translation:
  language: fr
  text: Il n’y a ni sagesse, ni intelligence ni conseil contre Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant Yahweh » ou « en présence de Yahweh ». L’expression hébraïque peut désigner ce qui se trouve devant quelqu’un ; ici, elle évoque probablement l’opposition ou le fait de se dresser contre lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: il n’y a ni… ni… ni
  rationale: La négation existentielle est répétée devant chacun des trois noms. La tournure française corrélative « ni… ni… ni » en conserve l’insistance tout en restant naturelle.
- source_word: חָכְמָה
  choice: sagesse
  rationale: Terme usuel dans les Proverbes pour la sagesse pratique et habile; il préserve le premier élément de la triade.
- source_word: תְּבוּנָה
  choice: intelligence
  rationale: Le mot désigne la faculté de comprendre et de discerner. « Intelligence » le distingue convenablement de « sagesse » en français courant et soutenu.
- source_word: עֵצָה
  choice: conseil
  rationale: Le terme peut désigner le conseil, l’avis ou le dessein. « Conseil » maintient le mouvement des facultés intérieures vers la délibération stratégique.
- source_word: לְנֶגֶד
  choice: qui tienne contre
  rationale: L’expression peut indiquer ce qui se trouve devant quelqu’un, mais le contexte proverbial lui donne vraisemblablement une valeur d’opposition. « Qui tienne contre » exprime l’impossibilité de résister ou de prévaloir sans surinterpréter par un verbe de victoire explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin יהוה, plutôt que substitution par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Valeur de לְנֶגֶד יְהוָה
  choice: qui tienne contre Yahweh
  alternative: devant Yahweh; en présence de Yahweh
  rationale: La préposition peut avoir un sens spatial (« devant, en présence de »), mais dans cette affirmation sur la sagesse, l’intelligence et le conseil, le sens adversatif est probablement dominant. La note conserve l’ambiguïté réelle.
translation_notes:
  register: Français moderne, international et digne. La structure ternaire est resserrée par « ni… ni… ni ». L’expression idiomatique « qui tienne contre » communique la résistance vaine tout en gardant en note les lectures spatiales possibles.
