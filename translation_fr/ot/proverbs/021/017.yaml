id: PRO.21.17
reference: Proverbs 21:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
translation:
  language: fr
  text: Celui qui aime les plaisirs connaîtra le besoin[a] ; celui qui aime le vin et l’huile[b] ne s’enrichira pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui aime la joie » ou « les réjouissances ». Le terme hébreu peut désigner la joie ou les festivités ; dans ce contexte, il évoque probablement un mode de vie voué aux plaisirs.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement d’huile d’olive. Avec le vin, elle peut évoquer ici le luxe, les festins ou des parfums coûteux, plutôt qu’un simple aliment de base.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  choice: connaîtra le besoin
  rationale: Littéralement, l’expression nominale décrit un « homme de manque ». En français proverbial, « connaîtra le besoin » rend naturellement l’état de dénuement qui résulte du comportement décrit, sans surinterpréter le degré de pauvreté.
- source_word: אֹהֵב שִׂמְחָה
  choice: celui qui aime les plaisirs
  rationale: שִׂמְחָה peut désigner la joie, l’allégresse ou les réjouissances. Dans ce parallèle avec le vin et l’huile, le pluriel « les plaisirs » fait ressortir le mode de vie tourné vers les jouissances, tout en signalant en note l’ambiguïté lexicale.
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  choice: celui qui aime le vin et l’huile
  rationale: La traduction conserve les deux images concrètes de l’hébreu. שֶׁמֶן désigne généralement l’huile, notamment l’huile d’olive, et peut évoquer ici un produit raffiné ou luxueux.
- source_word: לֹא יַעֲשִׁיר
  choice: ne s’enrichira pas
  rationale: Le hiphil de עשר est ici employé sans objet et exprime l’accession à la richesse. « Ne s’enrichira pas » est précis, naturel et plus étroit que « ne prospérera pas ».
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La répétition « celui qui aime » reproduit le parallélisme hébreu. « Connaîtra le besoin » évite une formulation nominale artificielle et conserve la nuance de manque de מַחְסוֹר.
