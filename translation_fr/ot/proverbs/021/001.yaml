    text: Ou « des ruisseaux » ou « des cours d’eau ». L’image hébraïque évoque des voies d’eau divisées que l’on peut orienter.
    reason: lexical_alternative
  - marker: b
    text: Ou « partout où il veut l’orienter » ou « partout où il lui plaît ».
    reason: lexical_alternative
  revision_rationale: La révision ne modifie pas le sens. Elle remplace une construction pronominale ambiguë par une expression française idiomatique qui garde la liberté de direction exprimée par « tout ce qu’il désire » et l’action effective du verbe causatif « orienter ». Les ancres de notes restent attachées respectivement à l’image des canaux et au choix divin.
