source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
translation:
  language: fr
  text: 'Le cœur d’un roi est comme des canaux d’eau[a] dans la main de Yahvé : il l’oriente où bon lui semble[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ruisseaux » ou « des cours d’eau ». L’image hébraïque évoque des voies d’eau divisées que l’on peut orienter.
    reason: lexical_alternative
  - marker: b
    text: Ou « partout où il veut l’orienter » ou « partout où il lui plaît ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: des canaux d’eau
  rationale: L’expression désigne des cours d’eau divisés ou des canaux, notamment susceptibles d’être orientés. « Canaux d’eau » conserve l’image d’un débit maîtrisé et s’accorde avec le verbe final.
- source_word: לֶב מֶלֶךְ
  choice: le cœur d’un roi
  rationale: La construction exprime une vérité générale sur tout roi. En hébreu biblique, le « cœur » désigne notamment le siège de la volonté, de la pensée et des dispositions intérieures.
- source_word: בְּיַד יְהוָה
  choice: dans la main de Yahvé
  rationale: L’expression idiomatique marque le pouvoir et la maîtrise, tout en conservant l’image concrète de la main.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du nom divin préserve ici le nom personnel présent dans le texte hébreu.
- source_word: עַל כָּל אֲשֶׁר
  choice: partout où
  rationale: Avec le verbe « diriger/incliner », la locution indique toute direction ou destination choisie.
- source_word: יַחְפֹּץ
  choice: il le désire
  rationale: Le verbe חפץ peut exprimer le désir, le bon plaisir ou la volonté. « Désire » reste naturel sans imposer une formulation philosophique plus forte.
- source_word: יַטֶּנּוּ
  choice: il le dirige
  rationale: Le hiphil de נטה signifie faire pencher, détourner ou diriger. « Il le dirige » rend clairement l’action exercée sur le cœur et convient à l’image des canaux.
theological_decisions:
- issue: La souveraineté divine sur les gouvernants
  choice: Le texte affirme que Yahvé peut réellement diriger la disposition intérieure d’un roi, comme on oriente l’eau dans des canaux.
  alternative: On pourrait comprendre cette affirmation soit comme un déterminisme exhaustif, soit comme une simple influence divine.
  rationale: La formulation conserve la force de « dans la main de Yahvé » et du causatif « il le dirige », sans préciser un modèle de providence ni résoudre le rapport entre souveraineté divine et responsabilité humaine.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale demeure concise; les métaphores du cœur, de la main et des canaux sont conservées.
