revisions:
- from: 'Le cœur d’un roi est comme des canaux d’eau[a] dans la main de Yahvé : il le dirige partout où il le désire[b].'
  to: 'Le cœur d’un roi est comme des canaux d’eau[a] dans la main de Yahvé : il l’oriente où bon lui semble[b].'
  rationale: La révision ne modifie pas le sens. Elle remplace une construction pronominale ambiguë par une expression française idiomatique qui garde la liberté de direction exprimée par « tout ce qu’il désire » et l’action effective du verbe causatif « orienter ». Les ancres de notes restent attachées respectivement à l’image des canaux et au choix divin.
