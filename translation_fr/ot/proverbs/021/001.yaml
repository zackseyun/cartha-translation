review_pass:
  verdict: revise
  source_fidelity: Le verset rend correctement la comparaison entre le cœur d’un roi et des canaux d’eau, ainsi que la main de Yahvé et son action directrice. Cependant, « partout où il le désire » risque de faire de « le » l’objet de « désire » (le cœur), alors que l’hébreu exprime la direction que Yahvé choisit. « Où bon lui semble » rend naturellement חפץ sans atténuer l’action causative de יַטֶּנּוּ.
  naturalness: La formulation proposée est globalement fluide et de registre proverbial approprié. « Il l’oriente où bon lui semble » est plus idiomatique et plus net en français international moderne que « il le dirige partout où il le désire ».
  terminology: « Yahvé » est une translittération française usuelle et cohérente avec la présence du tétragramme. « Cœur », « main » et « canaux d’eau » conservent les images et la portée non systématisée du texte hébreu.
  issues:
  - severity: medium
    issue: Ambiguïté maladroite de « il le désire »
    rationale: Dans « il le dirige partout où il le désire », le pronom « le » peut naturellement être compris comme renvoyant au cœur et comme complément de « désire ». Le texte hébreu signifie que Yahvé oriente le cœur vers toute direction qui lui plaît; la révision évite cette lecture fautive.
  revised_text: 'Le cœur d’un roi est comme des canaux d’eau[a] dans la main de Yahvé : il l’oriente où bon lui semble[b].'
  revised_footnotes:
