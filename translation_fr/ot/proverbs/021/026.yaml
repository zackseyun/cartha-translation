  yaml_path: translation/ot/proverbs/021/026.yaml
  text: All day long he craves greedily[b][a], but the righteous gives and does not hold back.
translation:
  language: fr
  text: Toute la journée, il ne cesse de désirer[a], mais le juste[b] donne sans rien retenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe par un nom de la même racine : littéralement, « il désire un désir » ; autrement : « il désire avidement ».'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « le juste » est au masculin singulier, employé ici de manière représentative pour décrire le comportement de toute personne juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Toute la journée
  rationale: Expression temporelle française naturelle qui conserve l’idée d’une action se prolongeant tout au long du jour.
- source_word: הִתְאַוָּה תַאֲוָה
  choice: il ne cesse de désirer
  rationale: Le verbe suivi d’un nom de même racine intensifie l’action. « Ne cesse de désirer » restitue cette insistance en français courant sans préciser un objet que l’hébreu laisse indéterminé.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé masculin singulier désigne ici, de façon représentative, toute personne juste. « Le juste » est une formulation proverbiale naturelle et digne.
- source_word: יִתֵּן
  choice: donne
  rationale: Le verbe à l’inaccompli a ici une valeur habituelle ou caractéristique, bien rendue par le présent proverbial français.
- source_word: וְלֹא יַחְשֹׂךְ
  choice: sans rien retenir
  rationale: Cette formulation idiomatique exprime le fait de ne pas garder ou refuser ce que l’on pourrait donner, tout en faisant ressortir la générosité opposée au désir insatiable.
