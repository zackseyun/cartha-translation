source:
  edition: WLC
  text: אָדָ֗ם תּ֭וֹעֶה מִ/דֶּ֣רֶךְ הַשְׂכֵּ֑ל בִּ/קְהַ֖ל רְפָאִ֣ים יָנֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
translation:
  language: fr
  text: L’homme qui s’égare du chemin du discernement reposera dans l’assemblée des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assemblée des ombres ». Le terme hébreu Rephaïm désigne ici les défunts.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: L’homme
  rationale: Le nom singulier présente ici un individu représentatif dans une maxime. « L’homme qui » conserve la force proverbiale et la formulation personnelle de l’hébreu.
- source_word: תּוֹעֶה
  choice: qui s’égare
  rationale: Le participe décrit quelqu’un qui dévie ou erre. « S’égare » s’accorde naturellement avec l’image du chemin et peut exprimer un comportement durable.
- source_word: מִדֶּרֶךְ
  choice: loin du chemin
  rationale: La préposition marque l’éloignement à partir du chemin. « Chemin » maintient la métaphore sapientielle d’une conduite de vie.
- source_word: הַשְׂכֵּל
  choice: du discernement
  rationale: Le terme évoque l’intelligence pratique, la perspicacité et la conduite avisée. « Discernement » rend cette dimension sapientielle sans réduire le sens à une connaissance abstraite.
- source_word: בִּקְהַל
  choice: dans l’assemblée
  rationale: קהל désigne un groupe réuni. « Assemblée » garde l’image collective tout en évitant une coloration ecclésiale trop marquée.
- source_word: רְפָאִים
  choice: des morts
  rationale: Dans ce contexte sapientiel, רְפָאִים désigne les défunts du séjour des morts, non le peuple ancien appelé Rephaïm. « Les morts » est immédiatement compréhensible; la nuance plus imagée est signalée en note.
- source_word: יָנוּחַ
  choice: reposera
  rationale: Le verbe signifie se reposer ou demeurer établi. Le futur simple conserve la concision solennelle de l’hébreu; le contexte donne à ce repos une portée funèbre plutôt que paisible.
theological_decisions:
- issue: Sens de רְפָאִים dans la littérature sapientielle
  choice: les morts
  alternative: les ombres; les Rephaïm
  rationale: Le proverbe avertit que celui qui quitte la voie du discernement finira parmi les défunts. La translittération « Rephaïm » risquerait d’évoquer à tort un ancien peuple, tandis que « les ombres » demeure possible mais moins immédiatement clair; cette nuance est donc conservée en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure en deux temps et les métaphores du chemin et de l’assemblée sont conservées. « Reposera » maintient volontairement la tension ironique entre le repos et la mort.
