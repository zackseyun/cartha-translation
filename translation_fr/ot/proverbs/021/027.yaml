review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est bien rendu : le sacrifice des méchants est qualifié d’« abomination », et אַף כִּי introduit une aggravation lorsque l’offrande est apportée dans une זִמָּה. Le passage au pluriel (« ils l’apportent ») est compréhensible en français, mais il neutralise le singulier distributif de יְבִיאֶנּוּ. Employer « un méchant » restitue clairement ce singulier sans modifier la portée générale du proverbe.'
  naturalness: « Avec une intention mauvaise » est intelligible, mais moins idiomatique et moins évocateur du sens de dessein ou de projet que « dans un dessein coupable ». La formulation révisée demeure concise, proverbiale et naturelle en français international moderne.
  terminology: « Sacrifice », « méchants » et « abomination » rendent adéquatement les termes cultuel, moral et théologique du texte. « Dessein coupable » traduit prudemment זִמָּה dans ce contexte, sans imposer un sens sexuel ni limiter le terme à une intention purement intérieure.
  issues:
  - severity: low
    issue: Le pronom sujet pluriel ne reflète pas le singulier hébreu dans la seconde proposition.
    rationale: Le pluriel collectif français est grammaticalement possible après « des méchants », mais l’hébreu emploie un singulier distributif. « Quand un méchant l’apporte » est plus précis et reste naturel.
  - severity: low
    issue: « Avec une intention mauvaise » est une collocation un peu lourde.
    rationale: La nuance de זִמָּה inclut volontiers un dessein ou un projet pervers. « Dans un dessein coupable » exprime mieux cette dimension tout en préservant l’ambiguïté entre intention dépravée et plan malveillant.
  revised_text: Le sacrifice des méchants est une abomination ; à plus forte raison quand un méchant l’apporte dans un dessein coupable[a].
  revised_footnotes:
