source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
translation:
  language: fr
  text: Le sacrifice des méchants est une abomination ; à plus forte raison quand un méchant l’apporte dans un dessein coupable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec de mauvaises intentions ». Le mot hébreu peut désigner une intention dépravée ou un projet malveillant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: sacrifice
  rationale: Le terme désigne ici une offrande sacrificielle, notamment un animal immolé. « Sacrifice » est naturel en français et conserve la précision cultuelle.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif substantivé pluriel désigne une catégorie de personnes moralement coupables. « Les méchants » est concis et idiomatique dans le registre proverbial.
- source_word: תּוֹעֵבָה
  choice: une abomination
  rationale: Ce nom exprime une répulsion morale très forte, en particulier devant Dieu. « Abomination » en préserve la force sans atténuer la portée théologique.
- source_word: אַף כִּי
  choice: à plus forte raison
  rationale: 'La locution introduit ici une intensification : le sacrifice est déjà abominable du fait de ceux qui l’offrent, et il l’est davantage encore dans la circonstance précisée ensuite.'
- source_word: בְּזִמָּה
  choice: avec une intention mauvaise
  rationale: זִמָּה peut évoquer une pensée dépravée, un dessein malveillant ou un projet coupable. Dans ce contexte cultuel, la formulation retenue met naturellement l’accent sur le motif corrompu sans imposer une nuance sexuelle.
- source_word: יְבִיאֶנּוּ
  choice: ils l’apportent
  rationale: Le hiphil de בוא signifie « apporter » ou « présenter », et le suffixe renvoie le plus naturellement au sacrifice. Le pluriel français reprend collectivement « les méchants », alors que l’hébreu passe au singulier distributif.
theological_decisions:
- issue: Évaluation morale du sacrifice offert par les méchants
  choice: Le proverbe affirme que le sacrifice des méchants est abominable, et davantage encore lorsqu’ils l’apportent avec une intention corrompue.
  alternative: 'La seconde proposition peut être comprise plus largement : « quand ils l’apportent dans un dessein malveillant », en soulignant un projet coupable plutôt que le seul motif intérieur.'
  rationale: Le texte ne condamne pas le sacrifice en lui-même, mais le culte pratiqué par des personnes méchantes, particulièrement lorsqu’il sert une intention mauvaise. La formulation n’importe aucune condamnation générale du système sacrificiel.
translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale reste concise ; « à plus forte raison » rend explicitement la progression argumentative de l’hébreu.
