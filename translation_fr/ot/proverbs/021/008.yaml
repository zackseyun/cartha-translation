  naturalness: Le français révisé est idiomatique, sobre et proverbial. « La conduite ... est droite » est plus naturel dans ce contexte éthique que « agit avec droiture », tout en conservant le contraste entre la voie tortueuse et ce qui est droit.
  terminology: « Voie », « coupable », « pur », « conduite » et « droite » conviennent au registre sapientiel. L’ancre de note doit suivre « coupable », le mot français qui rend le terme hébreu discuté, et non « tortueuse », qui rend un autre mot. Dans la note, « aliéné » risquerait d’évoquer un sens psychologique moderne qui ne correspond pas ici à « alien/foreign » ; « extérieur » préserve mieux l’alternative sans surinterprétation.
