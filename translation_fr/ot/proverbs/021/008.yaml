source:
  edition: WLC
  text: הֲפַכְפַּ֬ךְ דֶּ֣רֶךְ אִ֣ישׁ וָזָ֑ר וְ֝/זַ֗ךְ יָשָׁ֥ר פָּעֳלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/008.yaml
  text: The way of a guilty man is crooked and strange[a], but the conduct of the pure is upright.
translation:
  language: fr
  text: La voie de l’homme coupable[a] est tortueuse, mais la conduite de l’homme pur est droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La voie d’un homme est tortueuse et étrange ». Le terme hébreu rendu par « coupable » est difficile et peut aussi évoquer ce qui est étrange, étranger ou extérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲפַכְפַּךְ
  choice: tortueuse
  rationale: Le terme décrit ce qui est retourné, déformé ou détourné. « Tortueuse » conserve la métaphore de la voie et forme un contraste naturel avec la droiture du second membre.
- source_word: דֶּרֶךְ
  choice: voie
  rationale: Terme fréquent dans la littérature sapientiale pour désigner le chemin suivi et, par métaphore, la manière de vivre.
- source_word: אִישׁ
  choice: homme
  rationale: Le nom hébreu est masculin singulier et présente ici une figure proverbiale individuelle.
- source_word: וָזָר
  choice: coupable
  rationale: Le mot est difficile. Dans ce parallélisme moral, « coupable » rend l’interprétation selon laquelle il qualifie un homme fautif, tout en laissant les autres possibilités dans la note.
- source_word: זַךְ
  choice: pur
  rationale: Dans ce contexte sapientiel, l’adjectif exprime principalement la pureté ou l’intégrité morale.
- source_word: יָשָׁר
  choice: avec droiture
  rationale: L’adjectif signifie « droit » et s’oppose à ce qui est tortueux. La locution adverbiale produit un français naturel avec le verbe « agit ».
- source_word: פָּעֳלוֹ
  choice: agit
  rationale: Littéralement « son œuvre » ou « son action ». La formulation verbale « agit » exprime naturellement la conduite de l’homme pur sans limiter le sens à un acte isolé.
theological_decisions:
- issue: Rapport entre culpabilité, étrangeté et voie tortueuse
  choice: 'Comprendre וָזָר comme qualifiant moralement l’homme : « l’homme coupable »'
  alternative: « La voie d’un homme est tortueuse et étrange » ou « la voie de l’homme étranger est tortueuse »
  rationale: La forme hébraïque et son sens sont discutés. Le contraste avec « l’homme pur » favorise une lecture morale, mais la note préserve explicitement l’ambiguïté lexicale au lieu de l’effacer.
translation_notes:
  register: 'Français international moderne, sobre et proverbial. La métaphore de la voie est conservée, tandis que le second membre est légèrement restructuré pour être idiomatique : littéralement, « mais le pur, droite est son action ».'
