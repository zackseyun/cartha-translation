  text: זֵ֣ד יָ֭הִיר לֵ֣ץ שְׁמ֑/וֹ ע֝וֹשֶׂ֗ה בְּ/עֶבְרַ֥ת זָדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/024.yaml
  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
translation:
  language: fr
  text: '« Présomptueux, hautain, moqueur » : voilà son nom[a] — il agit avec une fureur insolente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Le présomptueux hautain est appelé “moqueur” ; il agit avec une fureur insolente. »'
    reason: La syntaxe permet de comprendre les trois premiers mots comme une série de qualificatifs ou de prendre « moqueur » comme le nom donné au présomptueux hautain.
lexical_decisions:
- source_word: זֵד
  choice: présomptueux
  rationale: Désigne une personne dominée par un orgueil insolent et une assurance qui outrepasse les limites; « présomptueux » conserve cette nuance et distingue le terme de יָהִיר.
- source_word: יָהִיר
  choice: hautain
  rationale: Exprime l’arrogance et l’élévation de soi; « hautain » forme avec « présomptueux » une caractérisation naturelle sans confondre les deux termes.
- source_word: לֵץ
  choice: moqueur
  rationale: Dans les Proverbes, le mot désigne le type humain qui raille et rejette la correction; « moqueur » est clair et courant en français.
- source_word: שְׁמוֹ
  choice: voilà son nom
  rationale: Conserve l’image hébraïque du « nom » comme caractérisation publique tout en produisant une formule française naturelle.
- source_word: עֹשֶׂה
  choice: il agit
  rationale: Le participe décrit une conduite caractéristique; au présent gnomique français, « il agit » rend naturellement cette valeur habituelle.
- source_word: בְּעֶבְרַת
  choice: dans l’emportement de
  rationale: עֶבְרָה évoque une colère ou une fureur qui déborde; « emportement » préserve l’intensité et convient au contexte de l’arrogance.
- source_word: זָדוֹן
  choice: l’orgueil
  rationale: Le nom apparenté à זֵד exprime la présomption, l’insolence ou l’orgueil volontaire; « orgueil » est idiomatique avec « emportement » et maintient le lien sémantique avec le premier qualificatif.
