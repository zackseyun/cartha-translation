  text: The violence of the wicked will drag them away[a], because they refuse to do justice.
translation:
  language: fr
  text: La violence des méchants les emportera[a], parce qu’ils refusent de pratiquer la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Le pillage des méchants les balaiera ». Le verbe hébreu est difficile, et son interprétation varie : il peut évoquer notamment la terreur ou le fait d’être emporté par sa propre conduite violente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁד
  choice: violence
  rationale: Le nom peut désigner la dévastation violente ou le pillage. Ici, « violence » exprime naturellement la conduite destructrice des méchants, mise en contraste avec la pratique de la justice.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Équivalent français concis et usuel dans le registre proverbial pour désigner des personnes moralement coupables.
- source_word: יְגוֹרֵם
  choice: les emportera
  rationale: La forme verbale est difficile. Dans ce contexte de conséquence rétributive, « les emportera » conserve l’image de leur propre violence qui finit par les entraîner à leur perte, sans préciser excessivement le mouvement.
- source_word: כִּי
  choice: parce que
  rationale: Introduit explicitement la raison de la conséquence énoncée dans le premier membre.
- source_word: מֵאֲנוּ
  choice: ils refusent
  rationale: Le présent convient à la portée générale et caractéristique de la maxime.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: pratiquer la justice
  rationale: Cette expression française naturelle traduit l’action concrète et habituelle de faire ce qui est juste, plutôt qu’un simple jugement judiciaire.
