source:
  edition: WLC
  text: כִּי בִ֭/י יִרְבּ֣וּ יָמֶ֑י/ךָ וְ/יוֹסִ֥יפוּ לְּ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/011.yaml
  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: fr
  text: Car c’est par moi[a] que tes jours se multiplieront, et des années de vie te seront ajoutées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en moi » ou « grâce à moi » ; la préposition hébraïque peut prendre ici plusieurs sens étroitement liés. Dans le contexte, « par moi » exprime naturellement le moyen : la Sagesse est ce par quoi la vie se prolonge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’exhortation précédente et convient au mouvement explicatif du proverbe.
- source_word: בִי
  choice: grâce à moi
  rationale: 'Dans ce contexte, la préposition ב avec le suffixe de première personne exprime vraisemblablement le moyen : la Sagesse personnifiée est ce par quoi la vie se prolonge. « Grâce à moi » est naturel en français tout en conservant la parole à la première personne.'
- source_word: יִרְבּוּ
  choice: se multiplieront
  rationale: Le verbe רבה signifie « devenir nombreux, augmenter ». Avec « tes jours », « se multiplieront » restitue l’image hébraïque dans un français clair.
- source_word: יָמֶיךָ
  choice: tes jours
  rationale: Expression hébraïque courante désignant la durée de la vie ; la traduction littérale reste naturelle en français et préserve l’image du texte.
- source_word: וְיוֹסִיפוּ
  choice: seront ajoutées
  rationale: La construction causative avec לְךָ se rend naturellement au passif en français, sans introduire un sujet indéfini absent du texte.
- source_word: לְךָ
  choice: te
  rationale: Marque la personne à laquelle reviennent les années ajoutées ; le pronom indirect est la formulation française la plus idiomatique.
- source_word: שְׁנוֹת חַיִּים
  choice: des années de vie
  rationale: Rend directement la construction génitive hébraïque et demeure idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne et au discours proverbial adressé à l’élève. Le parallélisme entre « tes jours » et « des années de vie » est conservé.
