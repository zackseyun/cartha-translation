source:
  edition: WLC
  text: תֵּ֣ן לְ֭/חָכָם וְ/יֶחְכַּם ע֑וֹד הוֹדַ֥ע לְ֝/צַדִּ֗יק וְ/י֣וֹסֶף לֶֽקַח־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: fr
  text: Donne au sage[a], et il deviendra encore plus sage ; instruis le juste[b], et il augmentera son savoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « Donne une instruction au sage. » En hébreu, le complément du verbe « donner » reste sous-entendu.'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « le juste » est au masculin singulier et représente ici toute personne juste, selon un usage fréquent dans les Proverbes.
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: Donne
  rationale: L’impératif de נתן signifie largement « donner ». L’objet restant sous-entendu en hébreu, « Donne » en conserve la formulation concise et elliptique.
- source_word: לְחָכָם
  choice: au sage
  rationale: חָכָם désigne une personne sage. Le substantif français « le sage » rend naturellement le singulier représentatif et maintient le parallélisme avec « le juste ».
- source_word: וְיֶחְכַּם עוֹד
  choice: et il deviendra encore plus sage
  rationale: Le verbe חכם exprime ici un progrès en sagesse, tandis que עוֹד marque un accroissement supplémentaire. Cette formulation rend clairement la progression implicite.
- source_word: הוֹדַע
  choice: instruis
  rationale: Le hiphil impératif de ידע signifie « fais connaître ». Dans le contexte pédagogique des Proverbes, « instruis » en exprime naturellement la portée.
- source_word: לְצַדִּיק
  choice: le juste
  rationale: צַדִּיק désigne celui qui est juste ou droit. « Le juste » est une expression française courante dans le registre sapientiel et correspond au singulier représentatif.
- source_word: וְיוֹסֶף לֶקַח
  choice: et il augmentera son savoir
  rationale: יסף exprime l’ajout ou l’accroissement, et לֶקַח désigne l’enseignement reçu, l’instruction ou le savoir acquis. Cette formulation est naturelle en français tout en conservant l’idée d’augmentation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La concision elliptique du premier impératif est conservée, tandis que les deux membres parallèles restent clairement perceptibles.
