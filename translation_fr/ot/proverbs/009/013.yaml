  text: אֵ֣שֶׁת כְּ֭סִילוּת הֹֽמִיָּ֑ה פְּ֝תַיּ֗וּת וּ/בַל יָ֥דְעָה מָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/013.yaml
  text: The woman Folly is loud[a]; she is simple and knows nothing.
translation:
  language: fr
  text: La femme Folie est bruyante ; elle est naïve et ne sait rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « elle ne sait pas quoi » ou « elle ne sait quoi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: La femme Folie
  rationale: Le groupe construit signifie littéralement « femme de folie ». Dans Proverbes 9, la folie est personnifiée sous les traits d’une femme, en parallèle avec la Sagesse. « La femme Folie » conserve cette personnification sans introduire le titre plus marqué « Dame Folie ».
- source_word: הֹמִיָּה
  choice: est bruyante
  rationale: Le terme évoque une personne tapageuse, turbulente ou bruyante. « Est bruyante » est naturel en français moderne et rend directement son caractère sonore.
- source_word: פְּתַיּוּת
  choice: elle est naïve
  rationale: Le nom abstrait désigne la naïveté ou le manque de discernement. Dans cette proposition nominale, la formulation adjectivale donne un français fluide tout en maintenant le lien avec les personnes naïves fréquemment évoquées dans les Proverbes.
- source_word: וּבַל
  choice: et ne… rien
  rationale: La conjonction suivie de la négation ajoute un second trait. « Et » respecte cette coordination sans lui donner une valeur adversative absente du texte.
- source_word: יָדְעָה מָּה
  choice: ne sait rien
  rationale: L’expression abrupte signifie littéralement « ne sait pas quoi » et souligne l’ignorance. « Ne sait rien » en restitue naturellement la force en français ; la tournure littérale est signalée en note.
