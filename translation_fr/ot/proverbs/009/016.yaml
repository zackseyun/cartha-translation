source:
  edition: WLC
  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה וַ/חֲסַר לֵ֝֗ב וְ/אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/016.yaml
  text: Whoever is simple[a], let him turn in here! And to him who lacks sense she says,
translation:
  language: fr
  text: '« Que celui qui est naïf vienne par ici ! » Et à celui qui manque de jugement[a], elle dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui est dépourvu de cœur ». Dans les Proverbes, le « cœur » désigne souvent l’intelligence, le discernement ou le jugement intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: celui qui est naïf
  rationale: מִי suivi de פֶתִי introduit ici une invitation générale. « Naïf » désigne, dans les Proverbes, une personne inexpérimentée et facilement influençable, sans suggérer simplement une déficience intellectuelle.
- source_word: יָסֻר הֵנָּה
  choice: passe par ici
  rationale: Le verbe exprime le fait de se détourner de son chemin pour venir vers le lieu indiqué. « Passe par ici » rend naturellement en français l’invitation et la valeur déictique de הֵנָּה.
- source_word: חֲסַר לֵב
  choice: celui qui manque de jugement
  rationale: L’expression signifie littéralement « dépourvu de cœur », le cœur représentant ici la faculté de comprendre, de discerner et de juger. « Manque de jugement » restitue cet idiome dans un français clair.
- source_word: וְאָמְרָה לּוֹ
  choice: elle dit
  rationale: Le sujet féminin renvoie, dans le contexte, à la Folie personnifiée. Le présent convient à l’introduction du discours direct et maintient l’enchaînement proverbial.
theological_decisions: []
translation_notes:
  register: Français international actuel, naturel et digne. Le parallélisme entre « naïf » et « manque de jugement » est conservé, tandis que les deux-points signalent que les paroles introduites se poursuivent au verset suivant.
