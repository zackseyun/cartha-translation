source:
  edition: WLC
  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: fr
  text: Si tu es sage, c’est pour toi-même que tu es sage ; si tu te moques, tu le porteras seul[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu porteras seul ». L’hébreu ne précise pas ce qui est porté ; il laisse le fardeau ou les conséquences implicites.'
    reason: ambiguïté lexicale
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit une véritable condition. « Si » conserve mieux cette valeur que « quand ».
- source_word: חָכַמְתָּ ... חָכַמְתָּ לָּךְ
  choice: tu es sage, c’est pour toi-même que tu es sage
  rationale: La répétition du verbe « être sage » reproduit l’insistance de l’hébreu, tandis que « pour toi-même » exprime le bénéfice personnel indiqué par לָּךְ.
- source_word: וְלַצְתָּ
  choice: si tu te moques
  rationale: Le verbe לוץ désigne la dérision arrogante typique du moqueur dans les Proverbes. La tournure verbale française reste simple et naturelle.
- source_word: לְבַדְּךָ
  choice: seul
  rationale: Exprime la responsabilité personnelle exclusive et conserve la concision de l’hébreu.
- source_word: תִשָּׂא
  choice: tu le porteras
  rationale: נשא signifie ici « porter » ou « supporter ». Le pronom « le », nécessaire à une formulation française naturelle, laisse comme l’hébreu la nature du fardeau non précisée.
theological_decisions:
- issue: Portée individuelle des conséquences
  choice: Conserver le contraste entre le bénéfice personnel de la sagesse et le fardeau assumé seul par le moqueur.
  alternative: Préciser explicitement « tu subiras seul les conséquences ».
  rationale: Le texte souligne la responsabilité personnelle, mais ne nomme pas explicitement ce qui est porté. La traduction évite donc d’expliciter davantage.
translation_notes:
  register: Français moderne, sobre et proverbial. La structure parallèle et la répétition de « sage » sont maintenues. « Tu le porteras » préserve l’image concrète et l’implicite du texte source.
