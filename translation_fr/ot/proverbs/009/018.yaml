id: PRO.9.18
reference: Proverbs 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: fr
  text: Mais il ne sait pas que les morts sont là[a], que ceux qu’elle a invités sont dans les profondeurs du Shéol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ombres sont là ». Le mot hébreu רְפָאִים désigne ici les morts, les défunts qui se trouvent au Shéol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… ne… pas
  rationale: Le contraste avec l’attrait trompeur décrit au verset précédent appelle naturellement « Mais » en français.
- source_word: יָדַע
  choice: il ne sait pas
  rationale: L’accompli hébreu décrit ici l’état présent d’ignorance de l’homme séduit.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’il ignore.
- source_word: רְפָאִים
  choice: les morts
  rationale: Dans ce contexte sapientiel, le terme désigne les défunts qui se trouvent au Shéol, et non le peuple des Rephaïm. « Les morts » est clair et naturel; la variante plus littérale figure en note.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe local renvoie au lieu où conduit réellement l’invitation de la femme.
- source_word: בְּעִמְקֵי
  choice: dans les profondeurs de
  rationale: Cette expression française conserve l’image spatiale d’une descente vers les régions profondes.
- source_word: שְׁאוֹל
  choice: Shéol
  rationale: La translittération préserve le terme hébreu désignant le séjour des morts sans l’assimiler à « l’enfer » ni le réduire à la tombe.
- source_word: קְרֻאֶיהָ
  choice: ceux qu’elle a invités
  rationale: Le participe passif avec suffixe féminin désigne les personnes invitées par la femme. Cette formulation garde explicitement le motif de son appel.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: Shéol
  alternative: le séjour des morts; la tombe; l’enfer
  rationale: « Shéol » conserve l’image hébraïque du domaine des morts et évite d’introduire la précision doctrinale ultérieure que pourrait suggérer « enfer ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle de l’hébreu est conservée, tandis que « ceux qu’elle a invités » explicite naturellement en français le participe passif hébreu.
