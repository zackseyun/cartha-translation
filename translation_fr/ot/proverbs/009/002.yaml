  text: טָבְחָ֣ה טִ֭בְחָ/הּ מָסְכָ֣ה יֵינָ֑/הּ אַ֝֗ף עָֽרְכָ֥ה שֻׁלְחָנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
translation:
  language: fr
  text: Elle a abattu ses bêtes[a], elle a mélangé son vin[b] et elle a aussi dressé sa table.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa viande »; le nom hébreu peut désigner les animaux abattus ou la viande préparée pour le banquet.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’elle a préparé le vin en le mélangeant, selon l’usage des banquets; le texte ne précise pas ce qui y était ajouté.
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה
  choice: a abattu
  rationale: Le qal accompli féminin singulier de טבח désigne concrètement l’abattage d’animaux destinés au repas. « A abattu » est naturel en français et plus précis que « a préparé ».
- source_word: טִבְחָהּ
  choice: ses bêtes
  rationale: Le nom désigne ici les animaux abattus ou, par métonymie, la viande ainsi préparée. « Ses bêtes » s’accorde directement avec le verbe « abattre » et conserve l’image concrète du banquet; la note signale l’autre nuance possible.
- source_word: מָסְכָה
  choice: a mélangé
  rationale: Le verbe מסך signifie mélanger le vin, probablement avec de l’eau ou des aromates selon les usages du banquet. La traduction conserve l’action précise sans préciser ce que le texte ne nomme pas.
- source_word: יֵינָהּ
  choice: son vin
  rationale: Traduction directe du nom avec suffixe possessif féminin singulier.
- source_word: אַף
  choice: et
  rationale: Dans cette série d’actions préparatoires, אַף ajoute la dernière action. Une coordination par « et » rend naturellement cette progression en français; la valeur cumulative demeure perceptible.
- source_word: עָרְכָה
  choice: a dressé
  rationale: ערך signifie disposer ou mettre en ordre. Pour une table, « dresser la table » est l’expression française idiomatique qui garde ce sens.
- source_word: שֻׁלְחָנָהּ
  choice: sa table
  rationale: Traduction concrète et directe, sans allégorisation supplémentaire.
theological_decisions:
- issue: Sujet féminin personnifié dans le poème sur la Sagesse
  choice: Employer simplement le pronom féminin « Elle »
  alternative: Répéter explicitement « La Sagesse » dans le verset
  rationale: Les verbes hébreux sont au féminin singulier et le contexte immédiat identifie leur sujet comme la Sagesse personnifiée. « Elle » préserve la personnification poétique sans ajouter au verset une désignation absente de cette phrase.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition des trois verbes à l’accompli est conservée. « Dresser la table » est idiomatique, tandis que les notes maintiennent l’ambiguïté lexicale et culturelle sans la résoudre abusivement.
