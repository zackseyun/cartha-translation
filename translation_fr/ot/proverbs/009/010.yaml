id: PRO.9.10
reference: Proverbs 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: fr
  text: Le commencement de la sagesse est la crainte de Yahweh, et la connaissance du Saint[a] est l’intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une forme plurielle : « les saints » ou « les êtres saints ». Elle est souvent comprise comme désignant Dieu, d’où « le Saint ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַּת
  choice: le commencement de
  rationale: Le nom à l’état construit désigne ici le commencement ou le point de départ. Cette formulation conserve l’image hébraïque sans expliciter davantage l’idée possible de fondement.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Terme courant et central dans les Proverbes, englobant la sagesse morale et pratique.
- source_word: יִרְאַת
  choice: la crainte de
  rationale: « Crainte » préserve la tension entre respect profond, saisissement et juste peur devant Dieu, tandis que « révérence » ou « respect » réduiraient la portée du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que substitution par un titre.
- source_word: וְדַעַת
  choice: et la connaissance de
  rationale: Le nom à l’état construit exprime la connaissance de la personne qui suit et maintient le parallélisme nominal du verset.
- source_word: קְדֹשִׁים
  choice: du Saint
  rationale: Bien que la forme hébraïque soit plurielle, le parallélisme avec Yahweh favorise ici un référent divin singulier. Le pluriel littéral est signalé en note afin de préserver l’ambiguïté réelle.
- source_word: בִּינָה
  choice: est l’intelligence
  rationale: « Intelligence » rend le discernement ou la compréhension évoqués dans les Proverbes et préserve l’équation nominale de l’hébreu.
theological_decisions:
- issue: Référent de קְדֹשִׁים
  choice: 'Un référent divin singulier : « le Saint »'
  alternative: 'Un référent pluriel : « les saints » ou « les êtres saints »'
  rationale: Le parallélisme synonymique entre « la crainte de Yahweh » et « la connaissance du Saint » favorise une référence à Dieu. Comme le mot hébreu est morphologiquement pluriel, cette donnée est conservée dans une note plutôt que passée sous silence.
translation_notes:
  register: Français international moderne, sobre et digne. La structure nominale et le parallélisme de l’hébreu sont conservés, ainsi que le terme théologiquement dense « crainte ».
