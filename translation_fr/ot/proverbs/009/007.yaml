  source_fidelity: 'Le texte rend fidèlement les deux participes génériques et leur parallélisme : « Qui corrige » pour יֹסֵר et « qui reprend » pour וּמוֹכִיחַ. « S’attire le déshonneur » exprime bien לֹקֵחַ לוֹ קָלוֹן. Dans le second membre, « s’attire une tache » conserve l’image de מוּמוֹ sans fixer abusivement l’antécédent du suffixe ni transformer le terme en une explication univoque telle qu’« insultes ».'
