  terminology: '« Moqueur » convient à לֵץ dans les Proverbes. « Méchant » rend de façon usuelle רָשָׁע sans ajouter de cadrage doctrinal. La distinction entre « corrige » et « reprend » reflète correctement les deux verbes hébreux. Les ancres sont correctement placées : [a] après la première expression idiomatique, [c] après « méchant », et [b] après l’image ambiguë de « tache ».'
