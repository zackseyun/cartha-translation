base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: fr
  text: 'Qui corrige un moqueur s’attire le déshonneur[a],

    et qui reprend un méchant[c] s’attire une tache[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prend sur lui le déshonneur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sa tache ». Cette expression concise peut signifier que celui qui reprend le méchant reçoit de lui insultes ou opprobre.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu est au masculin singulier, employé ici de manière générique.
    reason: cultural_note
lexical_decisions:
- source_word: יֹסֵר
  choice: Qui corrige
  rationale: Le participe exprime une vérité générale. « Corrige » rend ici l’idée de rectifier ou d’avertir sans suggérer nécessairement une punition.
- source_word: לֵץ
  choice: un moqueur
  rationale: Dans les Proverbes, le terme désigne celui qui rejette la sagesse avec arrogance et dérision. « Moqueur » est naturel et conserve cette nuance.
- source_word: לֹקֵחַ לוֹ
  choice: s’attire
  rationale: La tournure hébraïque signifie que la personne fait venir sur elle-même ou reçoit quelque chose en conséquence de son action. « S’attire » exprime naturellement cette valeur réfléchie.
- source_word: קָלוֹן
  choice: le déshonneur
  rationale: Le mot évoque l’opprobre et la honte publique plutôt qu’un simple sentiment intérieur de honte.
- source_word: וּמוֹכִיחַ
  choice: et qui reprend
  rationale: Le verbe désigne une réprimande ou une mise en cause directe. « Reprend » convient au parallélisme tout en restant distinct de « corrige ».
- source_word: לְרָשָׁע
  choice: un méchant
  rationale: Le substantif masculin singulier est employé de manière générique pour une personne coupable ou mauvaise. La formulation française conserve la forme concise du proverbe.
- source_word: מוּמוֹ
  choice: s’attire une tache
  rationale: Le nom signifie littéralement « défaut » ou « tache ». Dans ce contexte, il évoque probablement l’atteinte, l’insulte ou l’opprobre subi par celui qui reprend le méchant. La traduction garde l’image tout en rendant la conséquence explicite; l’ambiguïté du suffixe est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme des deux propositions est conservé, avec « corrige » puis « reprend ». L’image concrète de la « tache » est maintenue afin de ne pas effacer la formulation compacte et ambiguë de l’hébreu.
