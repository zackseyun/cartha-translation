source:
  edition: WLC
  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה חֲסַר לֵ֝֗ב אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/004.yaml
  text: Whoever is simple[a], let him turn in here! To him who lacks sense she says,
translation:
  language: fr
  text: '« Que celui qui est naïf vienne par ici ! » À celui qui manque de jugement[a], elle dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « manque de cœur ». En hébreu, le « cœur » peut désigner l’intelligence, le discernement ou le jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: celui qui
  rationale: Introduit ici une personne indéfinie appartenant à la catégorie visée. Avec le subjonctif exhortatif, « celui qui » rend naturellement l’invitation en français.
- source_word: פֶתִי
  choice: naïf
  rationale: Dans les Proverbes, le terme désigne une personne inexpérimentée, influençable ou facilement égarée, sans impliquer nécessairement une déficience intellectuelle. « Naïf » conserve cette nuance sapientielle avec concision.
- source_word: יָסֻר הֵנָּה
  choice: vienne par ici
  rationale: Le verbe à valeur jussive exprime une invitation à se diriger vers le lieu indiqué. « Vienne par ici » est naturel en français et convient au contexte de l’entrée dans la maison de la Sagesse, tout en gardant la nuance directionnelle.
- source_word: חֲסַר לֵב
  choice: manque de jugement
  rationale: L’expression signifie littéralement « manque de cœur », le cœur représentant ici la compréhension et le discernement. « Manque de jugement » transmet clairement l’idiome sans suggérer une absence de sentiments.
- source_word: אָמְרָה לּוֹ
  choice: elle dit
  rationale: Le féminin renvoie à la Sagesse. Le présent français rend vivement l’introduction au discours direct, tandis que le complément indirect est déjà exprimé par « À celui qui ».
theological_decisions: []
