id: PRO.9.5
reference: Proverbs 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ֭כוּ לַחֲמ֣וּ בְֽ/לַחֲמִ֑/י וּ֝/שְׁת֗וּ בְּ/יַ֣יִן מָסָֽכְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: fr
  text: Venez[a], mangez de mon pain et buvez du vin que j’ai mélangé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Allez, mangez de mon pain. » Le verbe hébreu signifie littéralement « aller », mais, dans ce contexte d’invitation, il fonctionne comme un appel : « Venez. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que j’ai préparé ». Le verbe hébreu désigne plus précisément du vin mélangé, probablement avec de l’eau ou des aromates.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venez
  rationale: Le verbe signifie littéralement « aller », mais, dans cette invitation lancée par la Sagesse, « Venez » exprime naturellement en français la valeur d’appel du contexte.
- source_word: לַחֲמוּ
  choice: mangez
  rationale: Le verbe לחם II signifie ici « manger », comme le montrent son objet, « mon pain », et son parallélisme avec « buvez ».
- source_word: בְלַחֲמִי
  choice: de mon pain
  rationale: La préposition ב a ici une valeur partitive après le verbe « manger » ; « mangez de mon pain » rend clairement l’invitation à prendre part au repas.
- source_word: וּשְׁתוּ
  choice: et buvez
  rationale: Cet impératif coordonné au précédent conserve le parallélisme simple de l’hébreu.
- source_word: בְּיַיִן
  choice: du vin
  rationale: Après « boire », la préposition ב se rend naturellement par l’article partitif français « du ».
- source_word: מָסָכְתִּי
  choice: que j’ai mélangé
  rationale: Le verbe désigne spécifiquement l’action de mélanger le vin, probablement avec de l’eau ou des aromates. Cette formulation en conserve le sens concret sans préciser ce que le mélange contient.
theological_decisions:
- issue: Portée de l’image du repas offert par la Sagesse
  choice: Conserver l’image concrète du pain et du vin sans l’expliciter allégoriquement.
  alternative: Interpréter le repas dans la traduction comme une image générale de l’enseignement, ou lui donner une portée sacramentelle.
  rationale: Le texte présente la Sagesse personnifiée invitant ses auditeurs à un repas préparé. La traduction laisse ouvertes ses résonances théologiques sans introduire une interprétation doctrinale absente de l’énoncé hébreu.
translation_notes:
  register: Français international moderne, simple et digne. Les impératifs au pluriel rendent l’appel collectif. « Mélangé » conserve la précision du verbe hébreu, tandis que la note signale la formulation française plus générale « préparé ».
