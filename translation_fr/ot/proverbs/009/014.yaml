source:
  edition: WLC
  text: וְֽ֭/יָשְׁבָה לְ/פֶ֣תַח בֵּיתָ֑/הּ עַל כִּ֝סֵּ֗א מְרֹ֣מֵי קָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/014.yaml
  text: and sits at the doorway of her house[a], on a seat at the heights of the city,
translation:
  language: fr
  text: et elle est assise à l’entrée de sa maison, sur un siège[a], sur les hauteurs de la ville,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un trône ». Le mot hébreu peut désigner un siège royal, mais le contexte immédiat n’impose pas cette image.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְיָשְׁבָה
  choice: elle est assise
  rationale: Le qal accompli 3e personne féminin singulier de ישׁב a ici une valeur descriptive dans le portrait vivant de Dame Folie. « Elle est assise » exprime naturellement en français une posture durable, sans imposer un passé narratif ni le sens ingressif de « elle s’assied ».
- source_word: לְפֶתַח
  choice: à l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « À l’entrée » est concret, naturel et convient mieux ici que le plus matériel « dans l’encadrement de la porte ».
- source_word: בֵּיתָהּ
  choice: de sa maison
  rationale: בַּיִת désigne ici le bâtiment où elle se tient; « maison » conserve cette référence spatiale sans la nuance affective de « foyer ».
- source_word: עַל
  choice: sur
  rationale: La préposition locative est rendue directement par « sur » dans ses deux occurrences.
- source_word: כִּסֵּא
  choice: un siège
  rationale: כִּסֵּא peut désigner un siège ou un trône. Le contexte n’exige pas une imagerie royale; « siège » préserve donc l’étendue lexicale sans banaliser l’objet comme le ferait « chaise ».
- source_word: מְרֹמֵי
  choice: les hauteurs de
  rationale: Le pluriel construit de מָרוֹם évoque les lieux élevés. « Les hauteurs de » conserve à la fois l’élévation et la visibilité publique de l’emplacement.
- source_word: קָרֶת
  choice: la ville
  rationale: קָרֶת désigne une ville ou une cité. « Ville » est le terme moderne courant qui convient au cadre urbain public.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le tableau poétique et la répétition de « sur », qui reflète les deux relations locatives du texte hébreu. La virgule finale respecte la continuité syntaxique avec le verset suivant.
