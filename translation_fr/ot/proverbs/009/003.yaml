source:
  edition: WLC
  text: שָֽׁלְחָ֣ה נַעֲרֹתֶ֣י/הָ תִקְרָ֑א עַל גַּ֝פֵּ֗י מְרֹ֣מֵי קָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
translation:
  language: fr
  text: 'Elle a envoyé ses jeunes filles[a] ; elle lance son appel depuis les hauteurs de la ville[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses jeunes femmes », « ses suivantes » ou « ses servantes ». Le terme hébreu désigne de jeunes personnes de sexe féminin et peut ici évoquer des servantes, sans préciser nettement leur statut.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur les crêtes des hauteurs de la ville ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְחָה
  choice: elle a envoyé
  rationale: Le qal accompli, 3e personne du féminin singulier, a pour sujet la Sagesse personnifiée. Le passé composé présente naturellement en français l’action préparatoire comme accomplie.
- source_word: נַעֲרֹתֶיהָ
  choice: ses jeunes femmes
  rationale: Le nom désigne des jeunes filles ou jeunes femmes et peut, dans ce contexte, évoquer des suivantes. « Jeunes femmes » conserve l’âge et le genre sans imposer un statut servile.
- source_word: תִקְרָא
  choice: elle lance son appel
  rationale: Le qal inaccompli décrit ici un appel public. Cette formulation française exprime clairement l’action sans donner au verbe une intensité excessive.
- source_word: עַל גַּפֵּי מְרֹמֵי קָרֶת
  choice: depuis les hauteurs de la ville
  rationale: La tournure hébraïque accumule les termes d’élévation et situe l’appel en un lieu haut et visible. « Depuis » est idiomatique avec « lancer son appel », tandis que la note signale la formulation plus littérale.
theological_decisions: []
translation_notes:
  register: Français international actuel, naturel et digne. La syntaxe garde le parallélisme des deux propositions et le deux-points final ouvre sur l’invitation du verset suivant.
