source:
  edition: WLC
  text: לִ/קְרֹ֥א לְ/עֹֽבְרֵי דָ֑רֶךְ הַֽ֝/מְיַשְּׁרִ֗ים אֹֽרְחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/015.yaml
  text: 'to call to those passing by on the road[a], who are going straight on their paths:'
translation:
  language: fr
  text: 'pour appeler ceux qui passent sur la route, ceux qui vont tout droit sur leurs chemins[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui rendent droits leurs chemins ». Le participe hébreu peut souligner soit le fait d’avancer droit devant soi, soit celui de maintenir ses chemins droits.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: pour appeler
  rationale: L’infinitif construit exprime ici le but dans la phrase commencée au verset précédent. « Appeler » garde le sens vocal et public sans ajouter une nuance étrangère au texte.
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: ceux qui passent sur la route
  rationale: Le participe désigne des personnes en train de passer. Cette formulation conserve l’image concrète des voyageurs et distingue דָרֶךְ des sentiers mentionnés ensuite.
- source_word: הַמְיַשְּׁרִים
  choice: ceux qui suivent tout droit
  rationale: Le participe issu de ישר peut décrire soit le fait d’aller droit, soit celui de rendre droit. Dans ce contexte, « suivent tout droit » exprime naturellement la progression directe tout en laissant l’autre analyse en note.
- source_word: אֹרְחוֹתָם
  choice: leurs sentiers
  rationale: Le pluriel désigne leurs voies ou leurs parcours. « Sentiers » préserve l’image du déplacement et la distingue de la « route » précédente, avec la possible résonance morale propre à la littérature de sagesse.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le verset demeure un segment syntaxique lié au contexte précédent; les deux groupes sont mis en apposition, et l’ambiguïté du participe hébreu est conservée en note.
