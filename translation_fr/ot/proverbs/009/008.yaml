id: PRO.9.8
reference: Proverbs 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תּ֣וֹכַח לֵ֭ץ פֶּן יִשְׂנָאֶ֑/ךָּ הוֹכַ֥ח לְ֝/חָכָ֗ם וְ/יֶאֱהָבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: fr
  text: Ne reprends pas le moqueur[a], de peur qu’il ne te déteste ; reprends le sage[b], et il t’aimera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « railleur ». Le mot hébreu désigne une personne caractérisée par un mépris arrogant et moqueur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un sage » ; dans les Proverbes, le masculin singulier sert ici à représenter un type de personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Ne… pas
  rationale: Avec l’imparfait, אַל exprime une interdiction. La tournure française « Ne… pas » en restitue naturellement la force sans ajouter d’emphase.
- source_word: תּוֹכַח / הוֹכַח (יכח)
  choice: reprends
  rationale: Dans la littérature sapientielle, יכח désigne une correction verbale ou une réprimande. « Reprendre » conserve cette force dans les deux propositions et convient au registre proverbial.
- source_word: לֵץ
  choice: le moqueur
  rationale: Dans les Proverbes, לֵץ caractérise celui qui affiche un mépris arrogant et railleur. « Le moqueur » est naturel en français et présente ici un type humain, conformément à l’absence d’article en hébreu dans une maxime générale.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: פֶּן introduit une conséquence négative à éviter. « De peur que… ne » rend précisément ce rapport d’avertissement, sans attribuer au « ne » une valeur négative autonome.
- source_word: יִשְׂנָאֶךָּ
  choice: il ne te déteste
  rationale: L’imparfait après פֶּן indique la conséquence possible ou attendue. Le présent du subjonctif français après « de peur que » est idiomatique et conserve cette nuance.
- source_word: לְחָכָם
  choice: le sage
  rationale: Le masculin singulier hébreu désigne ici un type représentatif. « Le sage » conserve le nombre et le genre grammaticaux tout en étant idiomatique dans le style proverbial français.
- source_word: וְיֶאֱהָבֶךָּ
  choice: et il t’aimera
  rationale: L’imparfait exprime le résultat attendu après l’impératif. Le futur français rend clairement cette conséquence.
theological_decisions:
- issue: Masculin singulier représentatif dans l’instruction sapientielle
  choice: le sage
  alternative: une personne sage / les sages
  rationale: Le texte hébreu emploie un masculin singulier représentatif. La traduction le conserve sans limiter explicitement l’application du proverbe aux hommes.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est préservé par la répétition de « reprends » ; « de peur que… ne » maintient le rapport précis entre l’avertissement et sa conséquence.
