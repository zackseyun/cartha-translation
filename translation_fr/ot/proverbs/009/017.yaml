  text: מַֽיִם גְּנוּבִ֥ים יִמְתָּ֑קוּ וְ/לֶ֖חֶם סְתָרִ֣ים יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/017.yaml
  text: Stolen water is sweet[a], and bread of secrecy is pleasant.
translation:
  language: fr
  text: Les eaux volées sont douces, et le pain mangé en cachette[a] est agréable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain des choses cachées » ou « le pain des lieux secrets ». L’expression hébraïque est condensée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: les eaux
  rationale: Le nom hébreu est de forme plurielle. Le pluriel français, naturel dans une formule proverbiale, préserve cette forme et permet l'accord avec le participe pluriel.
- source_word: גְּנוּבִים
  choice: volées
  rationale: Le participe passif de גנב qualifie directement les eaux comme acquises par vol; « volées » en est l'équivalent direct.
- source_word: יִמְתָּקוּ
  choice: sont douces
  rationale: Le verbe מתק exprime ici une qualité gustative. Le présent rend naturellement la portée générale du proverbe.
- source_word: לֶחֶם
  choice: le pain
  rationale: « Pain » conserve l'image concrète et le parallélisme avec les eaux, sans élargir inutilement le sens à toute nourriture.
- source_word: סְתָרִים
  choice: mangé en cachette
  rationale: Le pluriel substantivé de סתר évoque ce qui est caché ou secret. Avec « pain », le français idiomatique appelle « mangé en cachette », tout en signalant en note la formulation hébraïque plus condensée.
- source_word: יִנְעָם
  choice: est agréable
  rationale: Le verbe נעם signifie « être agréable, plaisant ». « Est agréable » maintient le parallélisme évaluatif avec « sont douces ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et proverbial. Le premier membre garde le pluriel hébreu « les eaux »; le second emploie une explicitation idiomatique minimale, accompagnée d’une note qui préserve l’ambiguïté de l’expression source.
