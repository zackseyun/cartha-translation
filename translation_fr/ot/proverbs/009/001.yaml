  text: חָ֭כְמוֹת בָּנְתָ֣ה בֵיתָ֑/הּ חָצְבָ֖ה עַמּוּדֶ֣י/הָ שִׁבְעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: fr
  text: La Sagesse[a] a bâti sa maison ; elle a taillé ses sept piliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu חָכְמוֹת est de forme plurielle, mais il est ici accompagné de verbes féminins singuliers : il désigne donc la Sagesse personnifiée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: La Sagesse
  rationale: Bien que le nom soit morphologiquement pluriel, les verbes féminins singuliers montrent qu’il fonctionne ici comme une personnification singulière. En français, « la Sagesse » rend naturellement cette personnification.
- source_word: בָּנְתָה
  choice: a bâti
  rationale: Le parfait présente l’action comme accomplie ; le passé composé est naturel en français moderne et convient au parallélisme poétique.
- source_word: בֵיתָהּ
  choice: sa maison
  rationale: Le sens concret de « maison » s’accorde avec l’image architecturale des piliers et évite le déplacement de sens qu’introduirait « maisonnée ».
- source_word: חָצְבָה
  choice: en a taillé
  rationale: Le verbe évoque le travail de la pierre, taillée ou extraite. « Tailler » conserve cette image concrète dans un français naturel ; « en » rattache explicitement les piliers à la maison sans ajouter de contenu substantiel.
- source_word: עַמּוּדֶיהָ
  choice: les piliers
  rationale: « Piliers » est le terme architectural courant et restitue la solidité de l’image. L’article défini, avec « en », exprime idiomatiquement en français l’appartenance indiquée par le suffixe hébreu.
- source_word: שִׁבְעָה
  choice: sept
  rationale: Le nombre est traduit directement, sans inscrire dans le texte une éventuelle valeur symbolique de plénitude.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Rendre חָכְמוֹת par la personnification singulière féminine « la Sagesse », reprise par « elle ».
  alternative: Employer « Dame Sagesse », « Femme Sagesse » ou conserver un pluriel comme « les sagesses ».
  rationale: Les verbes et suffixes féminins singuliers imposent une référence personnifiée au singulier. « Dame Sagesse » ou « Femme Sagesse » expliciterait davantage que le texte hébreu, tandis qu’un pluriel obscurcirait sa syntaxe.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme et l’image architecturale du texte hébreu, sans expliciter la possible portée symbolique du nombre sept.
