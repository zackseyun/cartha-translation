source:
  edition: WLC
  text: עִזְב֣וּ פְתָאיִ֣ם וִֽ/חְי֑וּ וְ֝/אִשְׁר֗וּ בְּ/דֶ֣רֶךְ בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/006.yaml
  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: fr
  text: Abandonnez votre naïveté[a] et vivez ; avancez sur le chemin du discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Abandonnez les naïfs. » Dans ce contexte, l’expression peut inviter à quitter la compagnie des naïfs ou, plus probablement, à abandonner l’état de naïveté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  choice: Abandonnez
  rationale: Impératif pluriel de עזב, il exprime ici une rupture résolue. « Abandonnez » est direct, actuel et digne.
- source_word: פְתָאיִם
  choice: votre naïveté
  rationale: Le mot désigne littéralement « les naïfs » ou « les personnes inexpérimentées ». Puisque la Sagesse s’adresse précisément à ces personnes, le contexte invite à comprendre qu’elles doivent quitter leur état de naïveté, et non abandonner d’autres personnes. Une note conserve la formulation littérale et son ambiguïté.
- source_word: וִחְיוּ
  choice: et vivez
  rationale: L’impératif coordonné est rendu directement, ce qui préserve la brièveté et la force de l’exhortation hébraïque.
- source_word: וְאִשְׁרוּ
  choice: avancez
  rationale: Dans ce contexte de chemin, אשר évoque le fait d’aller de l’avant ou de suivre une direction droite. « Avancez » restitue naturellement ce mouvement sans réduire le verbe au seul sens de marcher.
- source_word: בְּדֶרֶךְ
  choice: sur le chemin
  rationale: Cette expression garde l’image biblique d’un itinéraire tout en évoquant naturellement une manière de vivre.
- source_word: בִּינָה
  choice: discernement
  rationale: Dans les Proverbes, בינה désigne la faculté de comprendre et de distinguer avec justesse. « Discernement » rend cette nuance de manière claire en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et exhortatif. Le parallélisme des impératifs est conservé, ainsi que l’image du chemin. La formulation principale privilégie le sens contextuel, tandis que la note signale sans la supprimer l’ambiguïté du texte hébreu.
