source:
  edition: WLC
  text: רַ֭גְלֶי/הָ יֹרְד֣וֹת מָ֑וֶת שְׁ֝א֗וֹל צְעָדֶ֥י/הָ יִתְמֹֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: fr
  text: Ses pieds descendent vers la mort ; ses pas s’attachent au séjour des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : le shéol ; on peut aussi traduire « la tombe » ou « le monde des morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: ses pieds
  rationale: Le pluriel concret préserve l’image corporelle et se dit naturellement en français.
- source_word: יֹרְדוֹת
  choice: descendent
  rationale: Le participe qal féminin pluriel décrit la direction constante de ses pieds ; « descendent » est naturel et fidèle.
- source_word: מָוֶת
  choice: la mort
  rationale: Le sens lexical direct convient au contexte sapientiel et ne doit pas être atténué en simple danger ou ruine.
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française intelligible rend le shéol comme domaine des morts sans l’assimiler à l’enfer ni le réduire à une tombe individuelle ; le terme hébreu est signalé en note.
- source_word: צְעָדֶיהָ
  choice: ses pas
  rationale: Le pluriel concret maintient le parallélisme poétique avec « ses pieds ».
- source_word: יִתְמֹכוּ
  choice: s’attachent à
  rationale: Le verbe תמך exprime ici une prise ou un maintien ferme. La forme pronominale transmet le lien étroit entre son cheminement et le séjour des morts sans l’étrangeté d’un littéralisme tel que « soutiennent ».
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le shéol ; la tombe
  rationale: « Le séjour des morts » conserve la notion vétérotestamentaire du domaine des morts tout en restant immédiatement compréhensible. Il évite d’importer la notion plus tardive d’enfer et de réduire le terme à la seule tombe physique. La note indique le mot hébreu et les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme « ses pieds / ses pas » et le mouvement vers la mort sont conservés. La formulation garde la force poétique du second membre sans imposer une définition confessionnelle du shéol.
