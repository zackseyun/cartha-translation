source:
  edition: WLC
  text: וְ/לָ֤/מָּה תִשְׁגֶּ֣ה בְנִ֣/י בְ/זָרָ֑ה וּ֝/תְחַבֵּ֗ק חֵ֣ק נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: fr
  text: Pourquoi, mon fils, t’égarerais-tu auprès d’une femme qui t’est interdite[a] et étreindrais-tu le sein d’une étrangère[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une femme étrangère » ou « une autre femme ». Dans ce contexte, il s’agit d’une femme située hors des liens conjugaux légitimes.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner une femme étrangère ou extérieure au groupe. Dans ce contexte, il caractérise aussi une femme hors des limites relationnelles et conjugales légitimes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Pourquoi… t’égarerais-tu… ?
  rationale: L’interrogatif introduit une question rhétorique qui sert d’avertissement. Le conditionnel français exprime naturellement cette force d’exhortation.
- source_word: תִשְׁגֶּה
  choice: t’égarerais-tu
  rationale: Le verbe peut évoquer l’égarement, la divagation ou l’infatuation. « S’égarer » conserve à la fois l’image et sa portée morale sans imposer une nuance plus précise.
- source_word: בְנִי
  choice: mon fils
  rationale: Le suffixe de première personne exige « mon » et maintient le cadre paternel de l’enseignement des Proverbes.
- source_word: זָרָה
  choice: une femme qui t’est interdite
  rationale: Dans ce contexte, le terme désigne une femme extérieure aux relations conjugales légitimes, non une femme simplement bizarre ou nécessairement étrangère par son origine. Cette formulation française explicite sobrement la portée relationnelle et morale.
- source_word: תְחַבֵּק
  choice: étreindrais-tu
  rationale: « Étreindre » rend l’action d’enlacer et convient au registre poétique ainsi qu’au contexte intime.
- source_word: חֵק
  choice: la poitrine
  rationale: Le nom peut désigner le sein, la poitrine ou le giron, notamment dans une étreinte. « Poitrine » garde l’image corporelle sans l’archaïsme de « giron » ni l’ambiguïté anatomique de « sein » au singulier en français courant.
- source_word: נָכְרִיָּה
  choice: une étrangère
  rationale: Le terme désigne une femme étrangère ou extérieure au groupe. « Étrangère » préserve la distinction lexicale avec זָרָה et le parallélisme, tandis que la note empêche une lecture purement ethnique.
theological_decisions:
- issue: Rendu des termes parallèles זָרָה et נָכְרִיָּה dans l’avertissement contre une relation sexuelle illicite
  choice: « une femme qui t’est interdite » puis « une étrangère »
  alternative: « une femme étrangère » puis « une étrangère » ; ou « une femme adultère » dans les deux membres
  rationale: Le premier rendu communique clairement l’interdit conjugal sans réduire le mot à une appartenance ethnique; le second conserve la différence lexicale et le parallélisme hébreux. La note précise que l’altérité est ici surtout relationnelle et morale, sans exclure entièrement le sens littéral de provenance extérieure.
translation_notes:
  register: Français international moderne, direct et digne. La question rhétorique est formulée au conditionnel pour son naturel en français. Le parallélisme poétique et l’adresse « mon fils » sont conservés; les notes rendent visibles les ambiguïtés lexicales sans faire de l’origine ethnique le point principal du verset.
