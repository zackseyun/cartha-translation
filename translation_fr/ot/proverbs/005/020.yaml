  source_fidelity: La question rhétorique, l’adresse « mon fils », l’idée de s’égarer et le parallélisme des deux femmes sont bien rendus. « Une femme qui t’est interdite » communique de façon contextuelle la portée de זָרָה sans identifier indûment cette femme à une adultère. En revanche, « poitrine » désigne plus naturellement le thorax en français moderne et ne rend pas avec assez de précision חֵק, qui évoque ici le sein ou le giron dans une étreinte intime.
  naturalness: La formulation est fluide et le conditionnel interrogatif convient au français moderne. « Étreindre le sein d’une étrangère » est plus idiomatique et plus proche de l’image poétique que « étreindre la poitrine d’une étrangère ».
  terminology: La distinction entre la femme « interdite » (זָרָה) et « étrangère » (נָכְרִיָּה) est conservée. Les notes révisées distinguent les ambiguïtés respectives de נָכְרִיָּה et de חֵק, avec des ancres placées sur les mots concernés.
