source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: fr
  text: Et maintenant, fils, écoutez-moi et ne vous détournez pas des paroles de ma bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Le waw suivi de l’adverbe temporel marque à la fois le lien avec ce qui précède et un tournant exhortatif; « Et maintenant » conserve ces deux fonctions.
- source_word: בָנִים
  choice: fils
  rationale: Le nom hébreu est un masculin pluriel sans possessif exprimé. « Fils » en préserve la forme et la relation pédagogique propre au discours de sagesse, sans ajouter « mes ».
- source_word: שִׁמְעוּ לִי
  choice: écoutez-moi
  rationale: La construction avec ל appelle une écoute attentive pouvant impliquer l’obéissance; « écoutez-moi » reste naturelle sans expliciter excessivement cette implication.
- source_word: וְאַל תָּסוּרוּ
  choice: et ne vous détournez pas
  rationale: La coordination et l’interdiction sont conservées. Le verbe סור évoque le fait de quitter une voie ou une instruction; « se détourner » maintient cette image.
- source_word: מֵאִמְרֵי פִי
  choice: des paroles de ma bouche
  rationale: Cette formulation garde l’expression corporelle et solennelle de l’hébreu tout en restant claire en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et directement exhortatif. Le masculin « fils » est maintenu parce qu’il correspond explicitement à la forme hébraïque; aucun possessif absent du texte source n’est ajouté.
