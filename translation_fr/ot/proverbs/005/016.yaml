  yaml_path: translation/ot/proverbs/005/016.yaml
  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: fr
  text: 'Tes sources doivent-elles se répandre au-dehors[a][b],

    tes ruisseaux d’eau dans les rues ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Que tes sources se répandent au-dehors, tes ruisseaux d’eau dans les rues. » La forme hébraïque peut se lire ainsi, mais le contexte plus large favorise fortement une question rhétorique.'
    reason: alternative_reading
  - marker: b
    text: Dans le contexte de la fidélité conjugale, l’image de l’eau évoque la vitalité sexuelle et la descendance d’un homme (voir Pr 5.15–18).
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: doivent-elles se disperser
  rationale: Le qal de פוץ exprime la dispersion. La tournure interrogative avec « doivent-elles » restitue naturellement en français la force de la question rhétorique suggérée par le contexte, tout en conservant l’image de la dispersion.
- source_word: מַעְיְנֹתֶיךָ
  choice: tes sources
  rationale: מַעְיָן désigne une source ou une fontaine. « Sources » est courant, poétique sans être archaïque, et préserve la métaphore aqueuse.
- source_word: חוּצָה
  choice: au-dehors
  rationale: L’adverbe indique un mouvement vers l’extérieur. « Au-dehors » marque ici le contraste entre ce qui doit rester dans le cadre intime du mariage et l’espace public.
- source_word: בָּרְחֹבוֹת
  choice: dans les rues
  rationale: רְחֹבוֹת peut désigner des rues larges, des places ou des espaces publics. « Dans les rues » est naturel en français et rend clairement l’opposition avec la sphère privée.
- source_word: פַּלְגֵי מָיִם
  choice: tes ruisseaux d’eau
  rationale: פֶּלֶג désigne un cours, un canal ou un ruisseau d’eau. « Ruisseaux d’eau » maintient le parallélisme poétique avec « sources » et reste immédiatement compréhensible.
theological_decisions:
- issue: La proposition doit-elle être comprise comme une affirmation, une exhortation ou une question rhétorique dans l’avertissement concernant la fidélité conjugale ?
  choice: 'Une question rhétorique : « Tes sources doivent-elles se disperser… ? »'
  alternative: 'Une exhortation : « Que tes sources se dispersent au-dehors… » ; ou une simple affirmation.'
  rationale: La morphologie hébraïque permet une lecture volitive, mais le contexte immédiat de Proverbes 5.15–17 appelle à réserver cette intimité à son épouse. La question rhétorique préserve cette cohérence sans ajouter d’interdiction explicite absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse paternelle directe du passage. La structure en deux membres conserve le parallélisme poétique hébreu ; « au-dehors » et « dans les rues » font ressortir le passage de l’intime à l’espace public.
