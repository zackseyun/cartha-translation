  text: עַֽווֹנוֹתָ֗י/ו יִלְכְּדֻ/נ֥וֹ אֶת הָ/רָשָׁ֑ע וּ/בְ/חַבְלֵ֥י חַ֝טָּאת֗/וֹ יִתָּמֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: fr
  text: Les fautes du méchant le prendront au piège, et il sera retenu par les liens[a] de son péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cordes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: les fautes du méchant
  rationale: Le pluriel de עָוֹן désigne ici ses torts moralement coupables. La reformulation avec « du méchant » rend clairement en français le possessif hébreu, dont le référent apparaît ensuite dans la phrase.
- source_word: יִלְכְּדֻנוֹ
  choice: le prendront au piège
  rationale: Le verbe לָכַד exprime l’action de capturer ou de saisir. « Prendre au piège » conserve l’image vive d’un homme pris par ses propres fautes.
- source_word: הָרָשָׁע
  choice: le méchant
  rationale: L’expression hébraïque est un substantif singulier masculin désignant celui qui agit mal. « Le méchant » en respecte la forme et convient au registre sapiential.
- source_word: וּבְחַבְלֵי
  choice: et dans les liens de
  rationale: חֶבֶל peut désigner une corde, un lien ou une entrave. « Liens » restitue naturellement en français l’image de l’enserrement, tandis que la préposition « dans » suit la construction hébraïque.
- source_word: חַטָּאתוֹ
  choice: son péché
  rationale: Le singulier חַטָּאת peut avoir ici une valeur collective ou abstraite. « Son péché » conserve ce singulier et présente le péché comme ce qui entrave le coupable.
- source_word: יִתָּמֵךְ
  choice: il sera retenu
  rationale: Dans ce contexte, le niphal de תמך exprime le fait d’être maintenu ou immobilisé. « Sera retenu » préserve la voix passive et s’accorde avec l’image des liens.
theological_decisions:
- issue: Image de la responsabilité morale
  choice: Les propres fautes du méchant deviennent ce qui le capture et le retient.
  alternative: Exprimer seulement, de façon générale, que les mauvaises actions entraînent des conséquences.
  rationale: Le parallélisme hébreu personnifie les fautes et présente le péché comme un moyen de capture. La traduction conserve cette causalité morale imagée sans préciser davantage les mécanismes du jugement.
- issue: Portée du masculin singulier הָרָשָׁע
  choice: le méchant
  alternative: la personne méchante
  rationale: Le masculin singulier est explicite dans le texte hébreu et s’inscrit dans la formulation proverbiale. Le conserver évite d’effacer la forme grammaticale de la source, sans exclure la portée générale du proverbe.
translation_notes:
  register: Français international moderne, sobre et proverbial. La phrase maintient les deux images parallèles de la capture et de l’entrave, avec un vocabulaire courant mais digne.
