- from: Il meurt faute de discipline[a], et l’abondance de sa folie l’égare.
  to: Il meurt faute de discipline[a], et dans l’abondance de sa folie, il s’égare.
  rationale: La révision conserve les choix lexicaux solides du projet, mais restaure dans la seconde proposition le sujet de יִשְׁגֶּה et son caractère intransitif. Elle évite ainsi de convertir le complément hébreu « dans/par l’abondance de sa folie » en sujet causal français.
