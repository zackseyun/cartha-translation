  text: ה֗וּא יָ֭מוּת בְּ/אֵ֣ין מוּסָ֑ר וּ/בְ/רֹ֖ב אִוַּלְתּ֣/וֹ יִשְׁגֶּֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/023.yaml
  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: fr
  text: Il meurt faute de discipline[a], et dans l’abondance de sa folie, il s’égare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il mourra sans discipline, et dans l’abondance de sa folie, il s’égarera. »'
    reason: 'Alternative grammaticale et lexicale : les formes verbales peuvent être rendues au futur, et בְּאֵין peut décrire la circonstance (« sans ») plutôt que la cause (« faute de »).'
lexical_decisions:
- source_word: יָמוּת
  choice: meurt
  rationale: L’imparfait qal peut exprimer ici l’issue générale et certaine d’une conduite. Le présent convient au style proverbial français.
- source_word: בְּאֵין
  choice: faute de
  rationale: 'Cette tournure rend naturellement la circonstance causale : l’absence de quelque chose entraîne le résultat.'
- source_word: מוּסָר
  choice: discipline
  rationale: Dans les Proverbes, le terme désigne une formation corrective et morale, et non une simple transmission d’informations.
- source_word: וּבְרֹב
  choice: l’abondance de
  rationale: רֹב exprime la quantité ou la grandeur. La construction française avec sujet causal reste naturelle tout en conservant l’idée d’abondance.
- source_word: אִוַּלְתּוֹ
  choice: sa folie
  rationale: Le mot désigne la folie morale propre à la littérature de sagesse ; « folie » en garde la force.
- source_word: יִשְׁגֶּה
  choice: l’égare
  rationale: Le verbe peut signifier errer ou s’égarer. La tournure causative française traduit ici naturellement le fait que sa grande folie le fait dévier, sans introduire l’idée plus précise d’ivresse.
- source_word: הוּא
  choice: Il
  rationale: Le pronom explicite met le sujet en relief ; le français le rend simplement par « Il ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. « Discipline » conserve la dimension corrective de מוּסָר. La seconde proposition privilégie une syntaxe française naturelle tout en maintenant le lien étroit entre l’abondance de la folie et l’égarement.
