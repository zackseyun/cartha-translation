  text: אַיֶּ֥לֶת אֲהָבִ֗ים וְֽ/יַעֲלַ֫ת חֵ֥ן דַּ֭דֶּי/הָ יְרַוֻּ֣/ךָ בְ/כָל עֵ֑ת בְּ֝/אַהֲבָתָ֗/הּ תִּשְׁגֶּ֥ה תָמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/019.yaml
  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
translation:
  language: fr
  text: Biche aimante, gracieuse chèvre sauvage[a], que ses seins te rassasient en tout temps ! Sois toujours grisé par son amour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « gracieuse bouquetine ». Le mot hébreu désigne une chèvre sauvage, probablement le bouquetin.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sois toujours transporté par son amour ». Le verbe hébreu signifie souvent « s’égarer », mais il évoque ici le fait d’être entièrement emporté par l’amour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: Biche pleine d’amour
  rationale: אַיֶּלֶת désigne la femelle du cerf, et אֲהָבִים la caractérise par l’amour et l’affection. Cette formulation conserve l’image animale et le ton amoureux du poème.
- source_word: וְיַעֲלַת חֵן
  choice: gracieuse chèvre sauvage
  rationale: יַעֲלָה désigne une chèvre sauvage, probablement le bouquetin, tandis que חֵן évoque la grâce et le charme. Le choix reste compréhensible en français courant tout en préservant le parallélisme poétique.
- source_word: דַּדֶּיהָ
  choice: ses seins
  rationale: Le terme hébreu désigne concrètement les seins. Le contexte célèbre l’intimité conjugale ; une traduction explicite est donc plus exacte qu’un euphémisme comme « son sein ».
- source_word: יְרַוֻּךָ
  choice: que … te rassasient
  rationale: Le verbe רוה exprime le fait de boire à satiété, d’être abreuvé ou pleinement comblé. « Te rassasient » rend ici l’idée d’une satisfaction abondante sans effacer l’image sensuelle.
- source_word: בְכָל־עֵת
  choice: en tout temps
  rationale: Traduction directe de l’expression temporelle, adaptée au registre poétique et sapiential.
- source_word: בְאַהֲבָתָהּ
  choice: par son amour
  rationale: La préposition ב peut ici présenter l’amour comme ce qui saisit ou grise l’homme. « Par son amour » est idiomatique dans cette construction.
- source_word: תִּשְׁגֶּה תָמִיד
  choice: Laisse-toi toujours griser
  rationale: שׁגה signifie habituellement « s’égarer », mais prend ici, de façon positive et imagée, le sens d’être emporté ou comme grisé par l’amour. La tournure française garde cette force sans suggérer une faute morale.
theological_decisions:
- issue: Imagerie érotique dans le cadre conjugal
  choice: Conserver la mention explicite des seins et la pleine intensité du désir amoureux.
  alternative: Atténuer le texte par des termes comme « son sein », « sa tendresse » ou « son affection ».
  rationale: Dans le contexte de Proverbes 5, le verset recommande de trouver sa joie auprès de son épouse plutôt que dans l’adultère. L’hébreu emploie délibérément une image sexuelle concrète, qu’il ne convient pas d’adoucir pour des raisons doctrinales ou culturelles.
- issue: Valeur positive inhabituelle de שׁגה
  choice: Rendre le verbe comme le fait d’être grisé et emporté par l’amour.
  alternative: Traduire littéralement par « égare-toi », au risque de donner ici une connotation morale négative.
  rationale: Le contexte transforme de manière poétique un verbe souvent négatif en invitation à se laisser entièrement captiver par l’amour de son épouse. La traduction préserve cette tension dans une formulation française intelligible, avec une note signalant l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, poétique et digne. L’expression reste directe conformément au contexte conjugal, sans archaïsme ni euphémisation. Le rythme en deux membres conserve le parallélisme et la progression du texte hébreu.
