  text: אֹ֣רַח חַ֭יִּים פֶּן תְּפַלֵּ֑ס נָע֥וּ מַ֝עְגְּלֹתֶ֗י/הָ לֹ֣א תֵדָֽע־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: fr
  text: De peur qu’elle n’aplanisse le sentier de la vie[a], ses chemins sont instables ; elle ne le sait pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « Elle ne prend pas garde au sentier de la vie ; ses chemins s’égarent, et elle ne le sait pas. » L’hébreu de ce verset est très condensé et peut être compris de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre lecture possible : « tu ne le sais pas », si la dernière proposition s’adresse à l’auditeur plutôt que de décrire la femme.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: le sentier de la vie
  rationale: אֹרַח désigne un sentier ou une voie, et חַיִּים, la vie. « Le sentier de la vie » conserve l’image concrète du déplacement.
- source_word: פֶּן תְּפַלֵּס
  choice: elle ne prend pas garde
  rationale: פֶּן marque normalement la prévention ou l’évitement, tandis que פלס peut exprimer l’action d’aplanir, de peser ou d’examiner. Dans cette formulation hébraïque très condensée, « ne prend pas garde » rend naturellement l’idée qu’elle n’examine pas la voie de la vie, sans supprimer l’autre analyse possible.
- source_word: נָעוּ
  choice: s’égarent
  rationale: Le verbe évoque un mouvement instable, vacillant ou errant. « S’égarent » convient à l’image des chemins et exprime la déviation morale.
- source_word: מַעְגְּלֹתֶיהָ
  choice: ses chemins
  rationale: מַעְגָּל désigne une piste, une ornière ou un chemin. « Chemins » est naturel en français et maintient la métaphore routière.
- source_word: לֹא תֵדָע
  choice: elle ne le sait pas
  rationale: Le contexte de 5.3-6 favorise la femme comme sujet au féminin singulier. Le pronom « le » reprend implicitement l’égarement de ses chemins.
theological_decisions:
- issue: Sujet de la proposition finale
  choice: 'La proposition continue de décrire la femme : « elle ne le sait pas ».'
  alternative: 'La proposition peut être comprise comme une adresse au lecteur : « tu ne le sais pas » ou « tu ne le sauras pas » antique.'
  rationale: Le contexte immédiat décrit la femme à la troisième personne du féminin. Cette lecture assure la continuité, tout en signalant en note l’autre compréhension possible de la tradition textuelle.
- issue: Analyse de פֶּן תְּפַלֵּס
  choice: La phrase indique qu’elle ne considère pas attentivement le sentier de la vie.
  alternative: « De peur qu’elle n’aplanisse le sentier de la vie, ses chemins s’égarent. »
  rationale: L’hébreu est compact et syntaxiquement difficile. La traduction principale fournit un français intelligible selon le sens possible « peser, examiner », tandis que la note conserve l’analyse négative-préventive et l’image d’aplanir.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore du chemin est maintenue, tandis que les notes rendent explicites les principales ambiguïtés lexicales et syntaxiques de l’hébreu.
