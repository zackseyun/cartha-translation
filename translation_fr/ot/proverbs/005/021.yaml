id: PRO.5.21
reference: Proverbs 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: fr
  text: Car les voies de l’homme sont devant les yeux de Yahweh, et il examine tous ses sentiers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il pèse tous ses sentiers ». Le verbe hébreu peut évoquer le fait de mesurer ou d’évaluer un parcours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’avertissement précédent et conserve le lien explicatif du proverbe.
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: devant les yeux de Yahweh
  rationale: Conserve l’image anthropomorphique et exprime que la conduite humaine est pleinement exposée au regard divin.
- source_word: דַּרְכֵי אִישׁ
  choice: les voies de l’homme
  rationale: Le singulier אִישׁ a ici une portée générique; « l’homme » garde la forme représentative de l’hébreu dans un français biblique naturel.
- source_word: מַעְגְּלֹתָיו
  choice: ses sentiers
  rationale: Préserve le parallélisme poétique avec « voies » tout en gardant l’image plus concrète des pistes ou parcours.
- source_word: מְפַלֵּס
  choice: il examine
  rationale: Dans ce contexte, le participe exprime l’évaluation attentive des conduites. « Examine » rend clairement cette dimension, tandis que « pèse » demeure une possibilité métaphorique authentique signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel et l’usage établi du projet.
- issue: Portée du masculin générique אִישׁ
  choice: l’homme
  alternative: une personne; l’être humain
  rationale: « L’homme » reflète le masculin singulier représentatif du texte sans limiter nécessairement l’énoncé à un individu précis.
- issue: Nuance de מְפַלֵּס
  choice: il examine
  alternative: il pèse; il aplanit
  rationale: Le contexte autorise une lecture évaluative, mais la métaphore précise de la pesée ou de la mesure reste possible et ne doit pas être effacée.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle « voies / sentiers » et l’image « devant les yeux » sont conservées. Le marqueur de note est placé après la proposition concernée.
