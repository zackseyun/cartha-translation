  text: יִֽהְיוּ לְ/ךָ֥ לְ/בַדֶּ֑/ךָ וְ/אֵ֖ין לְ/זָרִ֣ים אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/017.yaml
  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: fr
  text: Qu’elles soient pour toi seul[a], et que des étrangers ne les partagent pas avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’elles soient à toi seul, sans que des étrangers les partagent avec toi. » Le verset poursuit l’image des sources et des cours d’eau du contexte précédent; « étrangers » désigne ici des personnes extérieures à l’union et souligne l’exclusivité conjugale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Qu’elles soient
  rationale: L’imparfait qal à la 3e personne du pluriel a ici une valeur volitive dans la suite de l’exhortation. Le subjonctif français rend naturellement cette nuance.
- source_word: לְךָ
  choice: pour toi
  rationale: La préposition לְ avec suffixe exprime ici l’attribution ou la possession; « pour toi » conserve la formulation et s’accorde avec la proposition suivante.
- source_word: לְבַדֶּךָ
  choice: seul
  rationale: L’expression adverbiale signifie « seul, à toi seul » et souligne l’exclusivité.
- source_word: וְאֵין
  choice: et non
  rationale: La conjonction suivie de la négation existentielle introduit le pendant négatif de la première proposition. « Et non » exprime sobrement l’exclusion.
- source_word: לְזָרִים
  choice: pour des étrangers
  rationale: Dans ce contexte sapientiel, זָרִים désigne des personnes extérieures à l’union, non des étrangers au sens ethnique. La traduction littérale préserve l’image et l’ambiguïté du texte.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: La préposition associative signifie directement « avec toi » et indique que d’autres ne doivent pas partager ce qui est réservé au destinataire.
theological_decisions:
- issue: Portée de l’exclusivité
  choice: Conserver la métaphore implicite et la formulation générale du verset
  alternative: Expliciter directement la fidélité conjugale
  rationale: Le contexte des sources et des cours d’eau évoqués auparavant renvoie à l’exclusivité conjugale, mais le verset ne nomme pas explicitement le mariage. La traduction maintient donc la tension métaphorique, tandis que la note en indique la portée contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le féminin pluriel de « Qu’elles » reprend naturellement les réalités féminines évoquées par la métaphore précédente, sans les expliciter. La syntaxe légèrement formelle conserve le parallélisme hébreu.
