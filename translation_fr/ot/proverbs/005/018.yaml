source:
  edition: WLC
  text: יְהִֽי מְקוֹרְ/ךָ֥ בָר֑וּךְ וּ֝/שְׂמַ֗ח מֵ/אֵ֥שֶׁת נְעוּרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: fr
  text: Que ta source soit bénie[a], et trouve ta joie dans la femme de ta jeunesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta fontaine ». L’hébreu maintient l’image de l’eau; celle-ci peut évoquer à la fois la source de la vie et la fécondité conjugale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Que … soit
  rationale: Le jussif de היה exprime ici un souhait à valeur d’exhortation. « Que … soit » en restitue naturellement la force en français.
- source_word: מְקוֹרְךָ
  choice: ta source
  rationale: מָקוֹר désigne une source ou une fontaine. « Source » conserve l’image de l’eau qui traverse le passage et peut évoquer à la fois l’origine de la vie et la fécondité conjugale, sans expliciter davantage que l’hébreu.
- source_word: בָרוּךְ
  choice: bénie
  rationale: « Bénie » rend directement le sens passif ou adjectival et conserve la résonance propre au vocabulaire biblique de la bénédiction.
- source_word: וּשְׂמַח
  choice: et réjouis-toi
  rationale: L’impératif poursuit l’exhortation positive. « Réjouis-toi » est clair, digne et fidèle au sens de שמח.
- source_word: מֵאֵשֶׁת
  choice: de la femme de
  rationale: Après שמח, מן peut indiquer la source ou l’objet de la joie. « Se réjouir de » préserve cette relation sans la réduire à la simple compagnie.
- source_word: נְעוּרֶיךָ
  choice: ta jeunesse
  rationale: L’expression désigne la femme épousée dans la jeunesse. La tournure traditionnelle « la femme de ta jeunesse » reste naturelle et immédiatement compréhensible en français.
theological_decisions:
- issue: Portée de la métaphore de la source
  choice: Conserver « ta source » sans identifier explicitement son référent
  alternative: Expliciter la sexualité, l’épouse ou la descendance
  rationale: Dans le contexte, l’image peut suggérer la vitalité sexuelle, l’union conjugale et la fécondité. Le texte hébreu laisse toutefois cette richesse métaphorique ouverte; la traduction ne doit pas la réduire à une seule interprétation.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme exhortatif est conservé, de même que la métaphore aquatique et son ambiguïté contextuelle.
