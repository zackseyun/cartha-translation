id: PRO.5.12
reference: Proverbs 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ/אָמַרְתָּ֗ אֵ֭יךְ שָׂנֵ֣אתִי מוּסָ֑ר וְ֝/תוֹכַ֗חַת נָאַ֥ץ לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/012.yaml
  text: and you say[a], “How I hated discipline[b], and my heart despised reproof!”
translation:
  language: fr
  text: 'et tu diras[a] : « Comme j’ai détesté la discipline, et comme mon cœur a méprisé la réprimande[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « et tu dis ». Le parfait hébreu peut décrire de manière saisissante la parole future annoncée dans cet avertissement.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le reproche » ou « la correction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: et tu diras
  rationale: Le parfait qal à la 2e personne masculine singulière, coordonné dans cet avertissement, peut avoir une portée future ou consécutive. Le futur français exprime naturellement la lamentation annoncée.
- source_word: אֵיךְ
  choice: Comme
  rationale: Le terme introduit ici une exclamation de regret, non une question. « Comme » rend naturellement cette force en français.
- source_word: שָׂנֵאתִי
  choice: j’ai détesté
  rationale: Le parfait à la 1re personne du singulier présente un aveu rétrospectif. Le passé composé convient au français moderne et garde la force du verbe.
- source_word: מוּסָר
  choice: la discipline
  rationale: Dans les Proverbes, le mot désigne une formation qui instruit et corrige. « Discipline » conserve ces deux dimensions.
- source_word: וְתוֹכַחַת
  choice: et… la réprimande
  rationale: Le nom désigne une correction exprimée verbalement. « Réprimande » est clair, actuel et suffisamment fort.
- source_word: נָאַץ
  choice: a méprisé
  rationale: Le verbe exprime un rejet empreint de mépris. « Méprisé » maintient le parallélisme intense avec « détesté ».
- source_word: לִבִּי
  choice: mon cœur
  rationale: Le cœur représente ici la personne intérieure, notamment sa volonté et son jugement. Le conserver respecte l’image et l’anthropologie poétique hébraïques.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition de « comme » restitue l’exclamation hébraïque et donne à l’aveu sa force poétique. Le parallélisme entre « détesté » et « méprisé » ainsi que l’image du cœur sont conservés.
