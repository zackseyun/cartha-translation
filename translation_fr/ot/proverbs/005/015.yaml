  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: fr
  text: Bois l’eau de ta citerne, et l’eau qui coule[a] de l’intérieur de ton puits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui s’écoule de l’intérieur de ton puits ». Le participe hébreu peut être rendu plus littéralement sans reprendre le mot « eau ».'
    reason: Alternative lexicale liée à la construction elliptique du participe וְנֹזְלִים.
lexical_decisions:
- source_word: שְׁתֵה
  choice: Bois
  rationale: L’impératif qal masculin singulier appelle un ordre direct; « Bois » en conserve simplement la force.
- source_word: מַיִם
  choice: l’eau
  rationale: Le nom hébreu désigne l’eau; le singulier collectif est naturel en français.
- source_word: מִבּוֹרֶךָ
  choice: de ta propre citerne
  rationale: בּוֹר peut désigner une fosse ou une citerne. Dans cette image domestique mise en parallèle avec le puits, « citerne » est précis, tandis que « propre » fait ressortir la possession et l’exclusivité contextuelle.
- source_word: וְנֹזְלִים
  choice: et celle qui coule
  rationale: Le participe de נזל signifie « couler ». Le pronom « celle » reprend naturellement « l’eau » sans introduire un second nom absent de l’hébreu et préserve la valeur participiale.
- source_word: מִתּוֹךְ
  choice: de
  rationale: Dans ce contexte, la provenance depuis l’intérieur du puits s’exprime naturellement en français par « de »; « du fond de » ajouterait une précision non nécessaire.
- source_word: בְּאֵרֶךָ
  choice: ton propre puits
  rationale: בְּאֵר désigne normalement un puits. Le texte concret est conservé, et « propre » rend explicite l’exclusivité suggérée par le suffixe possessif et le contexte.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal la métaphore conjugale et sexuelle ?
  choice: Conserver l’image littérale de l’eau, de la citerne et du puits.
  alternative: Traduire interprétativement par une formulation telle que « Trouve ta satisfaction auprès de ta propre femme ».
  rationale: L’hébreu formule intentionnellement une métaphore dont le contexte donne l’application. L’expliciter ici transformerait la traduction en commentaire et atténuerait sa force littéraire.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme poétique et l’image concrète sont préservés; la syntaxe reste accessible sans expliciter la métaphore.
