  source_fidelity: La première proposition rend bien פֶּן, יִשְׂבְּעוּ, זָרִים et כֹּחֶךָ. Dans la seconde, « le fruit de ton labeur » est une interprétation contextuellement plausible de וַעֲצָבֶיךָ, mais elle réduit le sens plus direct de « tes peines / ton labeur ». Le singulier « un inconnu » affaiblit aussi la notion de נָכְרִי, qui désigne ici quelqu’un d’étranger au destinataire plutôt qu’une personne simplement non connue.
  naturalness: « De peur que ... ne » et « se rassasient de ta force » sont naturels dans un registre proverbial moderne. « Que le fruit de ton labeur ne soit dans la maison » reste grammatical, mais est plus lourd et moins proche de l’ellipse hébraïque que « que tes peines ne soient dans la maison ».
  terminology: « Étranger » convient aux deux termes hébreux sans leur imposer un sens national moderne strict. « Tes peines » conserve l’association de עצבים avec le travail pénible et ses résultats, sans choisir exclusivement « le fruit » ou « les biens ».
