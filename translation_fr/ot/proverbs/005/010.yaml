translation_notes:
  register: Français moderne, sobre et proverbial. « Se rassasier de » préserve l’image hébraïque; « le fruit de ton labeur » explicite avec mesure la valeur probablement résultative du nom. Les deux marqueurs de note figurent dans le texte.
