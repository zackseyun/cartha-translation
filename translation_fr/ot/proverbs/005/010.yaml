  text: lest strangers be filled with your strength[b][a], and your labors go to the house of a foreigner.
translation:
  language: fr
  text: de peur que des étrangers ne se rassasient de ta force[a], et que tes peines ne soient dans la maison d’un étranger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne soient comblés par ta force ». Le verbe hébreu peut exprimer le fait d’être rassasié, rempli ou satisfait.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne les peines ou le labeur; dans ce contexte, il peut aussi évoquer le fruit du travail ou des biens durement acquis.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Introduit avec naturel en français une conséquence indésirable à éviter et conserve la force d’avertissement du proverbe.
- source_word: יִשְׂבְּעוּ
  choice: se rassasient
  rationale: Rend le sens concret d’être repu ou comblé, tout en laissant ouverte l’idée de tirer pleinement profit de ce qui appartient à autrui.
- source_word: זָרִים
  choice: des étrangers
  rationale: Désigne ici des personnes extérieures au cercle propre du destinataire et maintient le parallélisme avec נָכְרִי sans confondre les deux termes.
- source_word: כֹּחֶךָ
  choice: ta force
  rationale: Conserve le sens large de force, vigueur ou capacité productive, sans réduire explicitement le terme aux richesses.
- source_word: וַעֲצָבֶיךָ
  choice: le fruit de ton labeur
  rationale: Dans ce contexte économique et en parallèle avec « ta force », l’expression désigne vraisemblablement ce qui est acquis par un travail pénible; cette formulation est naturelle en français tout en gardant l’idée d’effort.
- source_word: בְּבֵית
  choice: soit dans la maison de
  rationale: Suit directement la construction hébraïque avec la préposition « dans »; le contexte fait comprendre que les gains aboutissent chez autrui sans ajouter un verbe de mouvement absent du texte.
- source_word: נָכְרִי
  choice: un inconnu
  rationale: Exprime l’idée d’une personne étrangère au foyer ou au cercle du destinataire. « Inconnu » évite en français moderne une lecture principalement liée à la nationalité.
