  - severity: medium
    issue: « un inconnu » ne rend pas assez précisément נָכְרִי
    rationale: En français, « inconnu » signifie surtout une personne que l’on ne connaît pas. « Un étranger » rend mieux l’idée d’une personne extérieure au foyer ou au cercle du destinataire.
