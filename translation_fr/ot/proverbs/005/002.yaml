  text: לִ/שְׁמֹ֥ר מְזִמּ֑וֹת וְ֝/דַ֗עַת שְׂפָתֶ֥י/ךָ יִנְצֹֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/002.yaml
  text: so that you may keep discretion[b][a], and your lips may guard knowledge.
translation:
  language: fr
  text: afin que tu gardes ton discernement[a] et que tes lèvres[b] préservent la connaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta prudence » ou « ton bon jugement ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « tes lèvres garderont la connaissance » ; les lèvres peuvent désigner la parole.
    reason: clarification
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: afin que tu gardes
  rationale: L’infinitif construit précédé de ל exprime ici le but de l’exhortation du verset précédent. « Afin que » explicite naturellement ce rapport, et « gardes » conserve le sens de protection et de conservation de שׁמר.
- source_word: מְזִמּוֹת
  choice: ton discernement
  rationale: Dans le contexte positif de la littérature de sagesse, le terme désigne la capacité de réfléchir avec prudence et jugement, plutôt que des projets ou des intrigues au sens négatif. Le possessif rend la tournure idiomatique en français sans modifier la relation implicite avec le destinataire.
- source_word: וְדַעַת
  choice: la connaissance
  rationale: דעת désigne couramment, dans les Proverbes, une connaissance à la fois morale et pratique. « Connaissance » maintient ce lien lexical sans préciser indûment qu’il s’agirait d’intelligence ou de compréhension.
- source_word: שְׂפָתֶיךָ
  choice: tes lèvres
  rationale: La traduction littérale conserve l’image corporelle et poétique de l’hébreu, où les lèvres représentent la parole.
- source_word: יִנְצֹרוּ
  choice: préservent
  rationale: נצר signifie garder, protéger ou conserver. « Préservent » évite la répétition immédiate de « gardes » tout en maintenant l’idée que la parole doit conserver et protéger la connaissance. Le subjonctif dépend naturellement de « afin que ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La structure de but est reliée au verset précédent; le parallélisme verbal et l’image concrète des lèvres sont conservés, avec une légère variation lexicale entre « gardes » et « préservent ».
