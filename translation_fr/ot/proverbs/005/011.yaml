  text: and you groan at your end[b][a], when your flesh and your body are consumed.
translation:
  language: fr
  text: Et tu gémiras[a] à la fin[b], quand ta chair et ton corps seront consumés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu pousseras des gémissements » ; le verbe hébreu évoque un cri audible et profond de détresse.
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’issue de ta vie » ou « quand viendra ta fin » ; l’hébreu peut évoquer aussi bien l’issue finale d’une conduite que la fin de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: Et tu gémiras
  rationale: Le verbe נהם évoque un son audible et profond produit dans la détresse. « Gémir » exprime naturellement en français la douleur et le regret sans renforcer excessivement l’image.
- source_word: בְאַחֲרִיתֶךָ
  choice: à la fin
  rationale: אַחֲרִית peut désigner à la fois l’issue finale d’une conduite et la fin de la vie. La formulation concise « à la fin » préserve cette ouverture, explicitée en note.
- source_word: בִּכְלוֹת
  choice: quand … seront consumés
  rationale: L’infinitif construit de כלה indique ici la circonstance ou le moment où la chair et le corps arrivent à épuisement. « Seront consumés » conserve l’image d’un dépérissement complet.
- source_word: בְּשָׂרְךָ
  choice: ta chair
  rationale: בשר signifie concrètement « chair ». Ce choix maintient l’image corporelle et distingue le premier terme de son parallèle.
- source_word: וּשְׁאֵרֶךָ
  choice: et ton corps
  rationale: Dans ce parallélisme avec בשר et ce contexte de déchéance physique, שאר désigne le corps ou la substance corporelle. « Ton corps » est clair et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et solennel. Le parallélisme concret « ta chair et ton corps » est conservé, de même que l’ambiguïté de « la fin » entre aboutissement et fin de vie.
