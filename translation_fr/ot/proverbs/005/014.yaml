  - severity: medium
    issue: La première alternative de la note, « dans toutes sortes de mal », n’est pas idiomatique en français et brouille la portée de l’alternative.
    rationale: Pour refléter l’acception morale possible, « dans tout le mal » est plus proche de la formule hébraïque compacte; l’autre option doit exprimer la ruine ou le malheur sans présenter cette interprétation comme certaine.
