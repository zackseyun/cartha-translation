source:
  edition: WLC
  text: פֶּן תִּתֵּ֣ן לַ/אֲחֵרִ֣ים הוֹדֶ֑/ךָ וּ֝/שְׁנֹתֶ֗י/ךָ לְ/אַכְזָרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/009.yaml
  text: lest you give your honor to others[b][a], and your years to the cruel one.
translation:
  language: fr
  text: de peur que tu ne donnes à d’autres ton honneur[a], et tes années à quelqu’un de cruel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta splendeur » ou « ta vigueur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à un homme cruel » ou « à quelqu’un d’impitoyable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Introduit la conséquence indésirable dont l’avertissement cherche à préserver; cette tournure conserve la force admonitrice concise de l’hébreu.
- source_word: תִּתֵּן
  choice: tu ne donnes
  rationale: Rend directement le sens courant de נתן. Le contexte suggère une perte ou un abandon, sans qu’il soit nécessaire de renforcer le verbe dans le texte principal.
- source_word: לַאֲחֵרִים
  choice: à d’autres
  rationale: Respecte le pluriel et exprime naturellement le transfert de ce qui appartient au destinataire vers d’autres personnes.
- source_word: הוֹדֶךָ
  choice: ton honneur
  rationale: הוד peut évoquer l’honneur, la splendeur, la majesté ou la vigueur. Dans ce contexte de ruine personnelle, « honneur » est naturel tout en laissant les autres nuances en note.
- source_word: וּשְׁנֹתֶיךָ
  choice: et tes années
  rationale: Traduction concise de l’expression hébraïque, qui peut désigner les années de vie ou les meilleures années d’une personne.
- source_word: לְאַכְזָרִי
  choice: à quelqu’un de cruel
  rationale: L’adjectif hébreu est substantivé et son référent demeure implicite. Cette formulation française naturelle préserve cette indétermination sans ajouter explicitement « homme ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La construction « de peur que… ne » restitue l’avertissement sans employer le « ne » explétif de manière ambiguë; « quelqu’un de cruel » maintient ouvert le référent du substantif adjectival hébreu.
