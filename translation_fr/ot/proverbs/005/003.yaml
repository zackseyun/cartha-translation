  text: כִּ֤י נֹ֣פֶת תִּ֭טֹּפְנָה שִׂפְתֵ֣י זָרָ֑ה וְ/חָלָ֖ק מִ/שֶּׁ֣מֶן חִכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: fr
  text: Car les lèvres d’une femme étrangère[a] distillent du miel, et son palais est plus lisse que l’huile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une femme interdite », « d’une inconnue » ou « d’une femme adultère ». Dans les Proverbes, le terme hébreu désigne souvent une femme avec qui une relation sexuelle serait illégitime.
    reason: Alternative lexicale et préservation de l’étendue sémantique de זָרָה.
  - marker: b
    text: Le mot hébreu désigne littéralement le « palais »; il peut aussi, par métonymie, renvoyer à la bouche ou aux paroles.
    reason: Signalement de la valeur littérale et métonymique de חִכָּהּ.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation des versets précédents et conserve clairement le lien logique.
- source_word: נֹפֶת תִּטֹּפְנָה
  choice: distillent du miel
  rationale: Rend ensemble l’image du miel qui coule goutte à goutte, dans un français naturel et évocateur.
- source_word: שִׂפְתֵי זָרָה
  choice: les lèvres d’une femme interdite
  rationale: Dans les Proverbes, זָרָה désigne généralement une femme située hors des limites d’une relation sexuelle légitime. « Interdite » exprime cette portée sans réduire le terme à l’origine étrangère ni affirmer nécessairement qu’elle est mariée.
- source_word: וְחָלָק מִשֶּׁמֶן
  choice: est plus douce que l’huile
  rationale: Le מִן marque ici la comparaison. « Douce » transpose naturellement en français la qualité lisse et séduisante exprimée par חָלָק, appliquée à la bouche et implicitement aux paroles.
- source_word: חִכָּהּ
  choice: sa bouche
  rationale: Le mot signifie littéralement « son palais », mais peut désigner par métonymie la bouche ou la parole. « Sa bouche » maintient l’image corporelle tout en évitant une formulation française artificielle.
theological_decisions:
- issue: Portée de זָרָה dans le contexte sapientiel
  choice: une femme interdite
  alternative: une femme étrangère ; une femme adultère
  rationale: Le contexte met en avant une relation sexuelle illégitime. Le choix retenu communique cette dimension morale sans faire de l’appartenance ethnique le sens principal ni préciser plus que le texte le statut matrimonial de la femme.
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve l’image sensuelle du miel et de l’huile, tout en rendant explicite en note l’ambiguïté de זָרָה et la mention littérale du palais.
