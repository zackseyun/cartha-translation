revisions:
- from: Car les lèvres d’une femme interdite[a] distillent du miel, et sa bouche est plus douce que l’huile[b].
  to: Car les lèvres d’une femme étrangère[a] distillent du miel, et son palais est plus lisse que l’huile[b].
  rationale: 'La révision conserve le parallélisme imagé du texte hébreu: le miel qui distille des lèvres et le palais plus lisse que l’huile. Elle remplace une expression française maladroite et interprétative par un rendu lexicalement plus ouvert, dont les implications contextuelles sont indiquées en note, et elle restitue la qualité de « lisse » plutôt que celle de « doux ».'
