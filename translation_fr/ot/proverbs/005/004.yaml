  text: וְֽ֭/אַחֲרִיתָ/הּ מָרָ֣ה כַֽ/לַּעֲנָ֑ה חַ֝דָּ֗ה כְּ/חֶ֣רֶב פִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/004.yaml
  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: fr
  text: mais, à la fin, elle est amère[a] comme l’absinthe, tranchante comme une épée à double tranchant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « mais sa fin est amère comme l’absinthe, tranchante comme une épée à double tranchant ».'
    reason: La construction hébraïque dit littéralement « sa fin » ou « son issue » ; le texte principal l’exprime dans un français plus naturel sans exclure cette nuance.
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: mais, à la fin, elle
  rationale: אַחֲרִית désigne la fin, l’issue ou le résultat final. Cette tournure française naturelle maintient le contraste avec la douceur décrite auparavant et garde explicite le référent féminin, tandis que la note conserve la construction hébraïque plus formelle.
- source_word: מָרָה
  choice: est amère
  rationale: L’adjectif prédicatif exprime l’amertume douloureuse de l’issue finale. « Est amère » évite d’ajouter l’idée de changement qu’introduirait « devient amère ».
- source_word: כַלַּעֲנָה
  choice: comme l’absinthe
  rationale: לַעֲנָה désigne une plante réputée pour son extrême amertume. « Absinthe » est le nom français traditionnel et concret de cette plante dans le langage biblique.
- source_word: חַדָּה
  choice: tranchante
  rationale: Dans la comparaison avec une épée, « tranchante » rend naturellement l’idée de ce qui est acéré et capable de couper.
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: comme une épée à double tranchant
  rationale: L’expression littérale « épée de bouches » désigne une lame qui coupe des deux côtés. « Épée à double tranchant » est l’expression française claire et consacrée qui conserve cette image.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La métaphore végétale concrète et l’image de l’épée sont conservées ; la note signale l’ambiguïté entre la femme elle-même à la fin et l’issue finale qu’elle réserve.
