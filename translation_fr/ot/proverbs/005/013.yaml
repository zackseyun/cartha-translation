  text: וְֽ/לֹא שָׁ֭מַעְתִּי בְּ/ק֣וֹל מוֹרָ֑/י וְ֝/לִֽ/מְלַמְּדַ֗/י לֹא הִטִּ֥יתִי אָזְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/013.yaml
  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: fr
  text: Je n’ai pas écouté la voix de ceux qui m’instruisaient[a], et je n’ai pas tendu l’oreille à ceux qui m’enseignaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je n’ai pas obéi à ceux qui m’instruisaient ». En hébreu, le verbe peut désigner une écoute qui se traduit par l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: je n’ai pas écouté
  rationale: Le verbe שׁמע peut exprimer le fait d’entendre, d’écouter ou d’obéir. Dans ce contexte de sagesse, « écouter » conserve cette amplitude tout en suggérant le refus de tenir compte de l’enseignement.
- source_word: בְּקוֹל
  choice: la voix de
  rationale: Cette formulation préserve l’image hébraïque et reste naturelle en français, tandis que l’expression complète peut aussi impliquer l’obéissance.
- source_word: מוֹרָי
  choice: ceux qui m’instruisaient
  rationale: Cette périphrase naturelle rend le participe substantivé issu de ירה et le suffixe possessif, tout en le distinguant légèrement du terme parallèle suivant.
- source_word: מְלַמְּדַי
  choice: ceux qui m’enseignaient
  rationale: Le choix rend directement le participe de למד, « enseigner », ainsi que le suffixe de première personne, et maintient le parallélisme avec le premier groupe.
- source_word: הִטִּיתִי אָזְנִי
  choice: je n’ai pas tendu l’oreille
  rationale: L’expression française conserve la métaphore corporelle de l’hébreu et communique clairement l’idée d’une attention volontaire.
- source_word: וְ...וְלֹא
  choice: et… et je n’ai pas
  rationale: La coordination répétée restitue les deux propositions négatives parallèles dans un français clair et rythmé.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébraïque est conservé, ainsi que les images de la voix et de l’oreille; les deux termes désignant les enseignants sont rendus par des formulations proches mais distinctes.
