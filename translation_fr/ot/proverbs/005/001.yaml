lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif hébreu est masculin singulier et présente l’adresse d’un père ou maître à son fils.
- source_word: לְחָכְמָתִי
  choice: à ma sagesse
  rationale: Conserve le nom abstrait חָכְמָה et le lien syntaxique avec l’appel à une écoute attentive.
- source_word: הַקְשִׁיבָה
  choice: prête attention
  rationale: Rend naturellement en français moderne l’impératif qui demande une écoute attentive.
- source_word: לִתְבוּנָתִי
  choice: vers mon intelligence
  rationale: תְּבוּנָה désigne la faculté de comprendre, avec des nuances possibles de discernement et de perspicacité.
- source_word: הַט אָזְנֶךָ
  choice: tends l’oreille
  rationale: Expression française naturelle qui conserve l’image hébraïque de l’oreille orientée vers l’enseignement.
