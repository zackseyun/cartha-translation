  text: הַרְחֵ֣ק מֵ/עָלֶ֣י/הָ דַרְכֶּ֑/ךָ וְ/אַל תִּ֝קְרַ֗ב אֶל פֶּ֥תַח בֵּיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: fr
  text: Éloigne ton chemin d’elle[a], et ne t’approche pas de l’entrée de sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reste loin d’elle, et ne t’approche pas de l’entrée de sa maison. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְחֵק
  choice: Tiens ... loin
  rationale: L’impératif hiphil de רחק exprime ici l’ordre de maintenir une distance. Avec « ton chemin » comme complément, « tiens ... loin » conserve la force causative et l’image spatiale.
- source_word: מֵעָלֶיהָ
  choice: d’elle
  rationale: La construction marque l’éloignement par rapport à elle; la notion de distance est déjà exprimée par « loin ».
- source_word: דַרְכֶּךָ
  choice: ton chemin
  rationale: דֶּרֶךְ désigne le chemin, au sens concret ou figuré. « Ton chemin » préserve l’image sapientielle du parcours et de la conduite personnelle.
- source_word: וְאַל תִּקְרַב
  choice: et ne t’approche pas
  rationale: La négation אַל suivie de l’inaccompli exprime une interdiction. « Ne t’approche pas » est naturel et garde l’idée de mouvement vers un lieu.
- source_word: אֶל פֶּתַח
  choice: de l’entrée
  rationale: פֶּתַח peut désigner une ouverture, une entrée ou un seuil. « Entrée » convient au repère spatial sans préciser excessivement qu’il s’agit de la porte elle-même.
- source_word: בֵּיתָהּ
  choice: de sa maison
  rationale: בַּיִת signifie concrètement « maison »; ce choix maintient le caractère spatial de l’avertissement.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu. La formulation conserve la métaphore du « chemin » plutôt que de la réduire à un simple avertissement de distance physique.
