source:
  edition: WLC
  text: ט֤וֹב פַּ֣ת חֲ֭רֵבָה וְ/שַׁלְוָה בָ֑/הּ מִ֝/בַּ֗יִת מָלֵ֥א זִבְחֵי רִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/001.yaml
  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: fr
  text: Mieux vaut un morceau de pain sec dans la tranquillité qu’une maison pleine de festins sacrificiels au milieu des querelles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sacrifices » ; l’hébreu peut désigner les sacrifices eux-mêmes ou, plus largement, les repas abondants qui leur sont associés.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Formule comparative proverbiale naturelle en français, correspondant à l’ellipse hébraïque.
- source_word: פַּת חֲרֵבָה
  choice: un morceau de pain sec
  rationale: פַּת désigne un morceau de pain; cette formulation reste concrète et naturelle, tandis que חֲרֵבָה souligne la maigreur du repas.
- source_word: וְשַׁלְוָה בָהּ
  choice: dans la tranquillité
  rationale: שַׁלְוָה exprime le calme et la quiétude. La tournure française rend la situation paisible sans imposer au suffixe בָהּ un antécédent trop précis.
- source_word: מִבַּיִת מָלֵא
  choice: qu’une maison pleine de
  rationale: Conserve l’image domestique concrète et rend explicitement la comparaison marquée par מִן.
- source_word: זִבְחֵי
  choice: festins sacrificiels
  rationale: Le pluriel de זֶבַח peut évoquer les sacrifices eux-mêmes ou les repas abondants qui leur sont associés; le choix principal préserve les deux dimensions autant que possible.
- source_word: רִיב
  choice: querelles
  rationale: Rend le conflit interpersonnel de manière courante et concrète, en contraste avec la tranquillité.
