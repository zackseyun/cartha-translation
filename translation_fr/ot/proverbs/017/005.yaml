id: PRO.17.5
reference: Proverbs 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹעֵ֣ג לָ֭/רָשׁ חֵרֵ֣ף עֹשֵׂ֑/הוּ שָׂמֵ֥חַ לְ֝/אֵ֗יד לֹ֣א יִנָּקֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: fr
  text: Qui se moque du pauvre outrage celui qui l’a fait[a] ; qui se réjouit du malheur ne restera pas impuni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son Créateur » ou « celui qui l’a créé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne sera pas tenu pour innocent » ou « ne sera pas acquitté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹעֵג
  choice: se moque
  rationale: Le participe exprime une attitude de dérision ou de mépris. « Se moque » est naturel en français moderne et conserve la force active du terme.
- source_word: לָרָשׁ
  choice: du pauvre
  rationale: רָשׁ désigne une personne pauvre ou démunie. Le singulier générique « le pauvre » correspond à la formulation proverbiale hébraïque.
- source_word: חֵרֵף
  choice: outrage
  rationale: Le verbe signifie couvrir d’opprobre, insulter ou traiter avec mépris. « Outrage » rend ici la gravité de l’affront fait à Dieu sans imposer le sens cultuel plus précis de « blasphémer ».
- source_word: עֹשֵׂהוּ
  choice: celui qui l’a fait
  rationale: Le participe avec suffixe signifie littéralement « celui qui l’a fait ». Cette formulation naturelle conserve le pronom renvoyant probablement au pauvre ainsi que l’idée de Dieu comme auteur de son existence.
- source_word: שָׂמֵחַ
  choice: se réjouit
  rationale: Le terme exprime la joie éprouvée devant une situation. « Se réjouit » convient au registre moral et sentencieux du proverbe.
- source_word: לְאֵיד
  choice: du malheur
  rationale: אֵיד désigne le désastre, la ruine ou la détresse. « Malheur » reste général et idiomatique, sans préciser si l’épreuve touche autrui, même si le contexte moral le suggère.
- source_word: לֹא יִנָּקֶה
  choice: ne restera pas impuni
  rationale: Le niphal de נקה peut signifier être tenu pour innocent, être acquitté ou échapper au châtiment. « Ne restera pas impuni » exprime clairement la conséquence judiciaire et morale dans un français naturel.
theological_decisions:
- issue: Référent du suffixe dans « celui qui l’a fait »
  choice: 'Le pronom « l’ » renvoie au pauvre : se moquer de lui revient à outrager Dieu, qui l’a fait.'
  alternative: Comprendre plus généralement Dieu comme le Créateur, sans insister sur le lien possessif ou pronominal avec le pauvre.
  rationale: Le suffixe de עֹשֵׂהוּ renvoie naturellement au pauvre mentionné juste avant. La traduction préserve ainsi le fondement créationnel de sa dignité sans expliciter davantage que l’hébreu.
- issue: Portée générique des formes masculines singulières
  choice: Employer deux propositions introduites par « qui », sans pronom personnel genré.
  alternative: Employer « celui qui » dans chaque proposition ou conserver un masculin générique plus marqué.
  rationale: La construction française avec « qui » rend naturellement la portée universelle des participes masculins singuliers hébreux, sans modifier leur sens ni ajouter une distinction de genre absente de la visée proverbiale.
translation_notes:
  register: Français international moderne, concis et digne, avec parallélisme proverbial. « Outrage » maintient la gravité théologique de חֵרֵף, tandis que « celui qui l’a fait » suit de près la forme hébraïque et évite une nominalisation inutilement traditionnelle.
