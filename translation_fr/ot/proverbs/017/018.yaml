  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: fr
  text: Un homme qui manque de bon sens frappe dans la main[a][b], se portant garant[c] devant son prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Un homme qui manque de cœur frappe la paume, se portant garant devant son prochain. »'
    reason: lexical_alternative
  - marker: b
    text: Frapper dans la main était un geste coutumier par lequel on confirmait un engagement ou une garantie financière.
    reason: cultural_note
  - marker: c
    text: Ou « s’engage comme caution » ; l’hébreu emploie ici un verbe et un nom de même racine.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: Un homme
  rationale: Le singulier présente ici un individu représentatif dans une maxime de sagesse, plutôt que l’humanité en général.
- source_word: חֲסַר לֵב
  choice: qui manque de bon sens
  rationale: L’expression signifie littéralement « qui manque de cœur », mais, dans la littérature sapientiale hébraïque, le cœur désigne souvent l’intelligence, le discernement et le jugement.
- source_word: תּוֹקֵעַ כָּף
  choice: frappe dans la main
  rationale: Cette formulation conserve l’image hébraïque d’un geste de la main servant à conclure un engagement, sans la réduire à une simple poignée de main moderne.
- source_word: עֹרֵב עֲרֻבָּה
  choice: se portant garant
  rationale: Le verbe et le nom de même racine expriment fortement l’acte d’assumer une garantie pour autrui. « Se porter garant » rend clairement cette portée juridique et financière en français courant.
- source_word: לִפְנֵי רֵעֵהוּ
  choice: devant son prochain
  rationale: La traduction conserve le sens spatial ou relationnel de « devant, en présence de » et évite de décider si le prochain est le bénéficiaire, le créancier ou le témoin de l’engagement.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Bon sens » explicite l’idiome hébraïque du cœur comme siège du discernement ; « frappe dans la main » garde l’image culturelle ancienne, expliquée en note. La formulation « devant son prochain » préserve l’ambiguïté relationnelle du texte source.
