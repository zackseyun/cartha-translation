  text: פּ֣וֹטֵֽר מַ֭יִם רֵאשִׁ֣ית מָד֑וֹן וְ/לִ/פְנֵ֥י הִ֝תְגַּלַּ֗ע הָ/רִ֥יב נְטֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/014.yaml
  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: fr
  text: Commencer une dispute, c’est comme laisser s’échapper de l’eau[a] ; renonce donc à la querelle avant qu’elle n’éclate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « libérer de l’eau ». L’image peut évoquer l’ouverture d’une brèche dans une digue ou dans une retenue, après quoi l’écoulement devient difficile à arrêter.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est difficile. On peut aussi comprendre : « avant qu’elle ne se déchaîne », « ne se révèle au grand jour » ou « ne s’envenime ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר מַיִם
  choice: ouvrir une brèche dans une retenue d’eau
  rationale: Le participe פּוֹטֵר évoque l’ouverture ou la libération de ce qui était retenu. Cette formulation française rend concrète l’image d’une eau qui, une fois libérée par une brèche, devient difficile à arrêter, sans transformer l’image en explication abstraite.
- source_word: רֵאשִׁית מָדוֹן
  choice: commencer une dispute
  rationale: רֵאשִׁית désigne le commencement, et מָדוֹן une situation de contestation ou de conflit. La tournure verbale est naturelle en français et conserve le rapport direct entre le début du conflit et l’ouverture de la brèche.
- source_word: וְלִפְנֵי
  choice: donc… avant que
  rationale: Le waw relie l’image à l’exhortation. « donc » exprime naturellement en français la conséquence pragmatique du proverbe, tandis que « avant que » rend לִפְנֵי.
- source_word: הִתְגַּלַּע
  choice: n’éclate
  rationale: Le verbe est difficile, mais peut évoquer ce qui fait irruption, se dévoile ou se déchaîne. « éclater » convient idiomatiquement à une querelle et préserve l’idée de passage à un conflit ouvert.
- source_word: הָרִיב
  choice: la querelle
  rationale: רִיב désigne une contestation, un différend ou une querelle. « querelle » est courant, précis et adapté au contexte interpersonnel.
- source_word: נְטוֹשׁ
  choice: abandonne
  rationale: L’impératif appelle à laisser tomber ou à cesser le conflit. « abandonne » conserve la force de l’ordre sans devenir familier.
