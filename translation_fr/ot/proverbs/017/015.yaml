id: PRO.17.15
reference: Proverbs 17:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: fr
  text: 'Celui qui acquitte le méchant et celui qui condamne le juste : tous deux sont une abomination pour Yahweh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui déclare juste le méchant et celui qui déclare coupable le juste. »'
    reason: Alternative lexicale qui explicite plus littéralement les deux verdicts opposés, tout en conservant la portée judiciaire de l’hébreu.
lexical_decisions:
- source_word: מַצְדִּיק
  choice: celui qui acquitte
  rationale: Le participe hiphil de צדק a ici un sens judiciaire, confirmé par son opposition à « condamne ». « Acquitte » exprime clairement le verdict favorable sans introduire les connotations doctrinales que peut porter « justifie ».
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le terme désigne une personne moralement coupable. « Le méchant » conserve cette portée morale, tandis que « le coupable » limiterait davantage le sens au cadre judiciaire.
- source_word: וּמַרְשִׁיעַ
  choice: et celui qui condamne
  rationale: Le participe hiphil de רשע signifie ici prononcer un verdict de culpabilité. « Condamne » forme en français une antithèse judiciaire naturelle avec « acquitte ».
- source_word: צַדִּיק
  choice: le juste
  rationale: Le mot désigne celui qui est dans son droit et qui agit avec droiture. « Le juste » préserve à la fois les dimensions judiciaire et morale ; « l’innocent » serait plus étroit.
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Ce substantif exprime une répulsion morale intense devant Dieu. « Une abomination » en conserve la force et la forme nominale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: גַּם שְׁנֵיהֶם
  choice: tous deux
  rationale: 'Cette formulation française concise rend l’insistance du texte : les deux personnes, sans exception, sont concernées par le même jugement.'
theological_decisions:
- issue: Sens judiciaire ou transformateur des verbes dérivés de צדק et רשע
  choice: 'Langage judiciaire : « acquitte » et « condamne »'
  alternative: 'Sens moral plus général : « traite le méchant comme un juste » et « traite le juste comme un méchant »'
  rationale: Les deux participes hiphil forment une opposition de type judiciaire. Cette traduction préserve le sens immédiat du proverbe sur la perversion de la justice sans importer dans le texte une doctrine ultérieure de la justification.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle du proverbe est conservée, et les termes judiciaires restent compréhensibles dans l’usage courant.
