source:
  edition: WLC
  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: fr
  text: Le creuset est pour l’argent, le four pour l’or, et Yahweh éprouve les cœurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְרֵף
  choice: creuset
  rationale: Le terme désigne un récipient ou dispositif servant à affiner les métaux. « Creuset » est précis, courant et conserve l’image métallurgique.
- source_word: לַכֶּסֶף
  choice: pour l’argent
  rationale: 'Le préfixe ל indique ici la destination ou l’usage : le creuset sert à l’affinage de l’argent. L’article défini est naturel en français dans cette formule proverbiale.'
- source_word: כּוּר
  choice: four
  rationale: Le mot désigne un four utilisé pour fondre ou affiner un métal. « Four » rend simplement le terme et maintient le parallélisme avec « creuset ».
- source_word: לַזָּהָב
  choice: pour l’or
  rationale: Comme dans le membre précédent, ל exprime la destination ou l’usage. « Pour l’or » convient au caractère général du proverbe.
- source_word: וּבֹחֵן
  choice: mais … éprouve
  rationale: Le participe de בחן exprime l’action d’examiner ou de mettre à l’épreuve afin de révéler la qualité véritable. « Éprouve » prolonge l’image de l’affinage sans la réduire à une simple observation. La conjonction ו est rendue par « mais » pour faire ressortir le contraste implicite entre les instruments qui éprouvent les métaux et Yahweh qui éprouve l’être intérieur.
- source_word: לִבּוֹת
  choice: les cœurs
  rationale: Dans l’anthropologie hébraïque, le cœur désigne l’intériorité humaine, notamment les pensées, les intentions et les dispositions. Le maintien de « cœurs » préserve la métaphore biblique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le représente comme un nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Relation entre l’affinage des métaux et l’action divine
  choice: « mais Yahweh éprouve les cœurs »
  alternative: « et Yahweh examine les cœurs »
  rationale: 'Le proverbe établit une analogie tout en marquant une progression : les métaux ont leurs instruments d’épreuve, tandis que l’intériorité humaine relève de Yahweh. « Mais » explicite le contraste naturel du parallélisme sans nier que le waw hébreu puisse aussi être rendu par « et ».'
- issue: Portée de בחן appliqué aux cœurs
  choice: « éprouve »
  alternative: « examine »
  rationale: « Éprouve » conserve à la fois l’idée d’évaluation et l’écho de la purification des métaux. Le texte ne précise toutefois ni le moyen ni l’issue de cette mise à l’épreuve, et la traduction n’en ajoute pas.
- issue: Rendu du nom divin יְהוָה
  choice: « Yahweh »
  alternative: « le Seigneur »
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par « Yahweh » préserve le nom personnel présent dans la source, sans lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé, ainsi que l’image traditionnelle du cœur comme siège de l’intériorité. La ponctuation met en valeur les trois membres sans alourdir la phrase.
