id: PRO.17.11
reference: Proverbs 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: fr
  text: Le rebelle ne recherche que le mal, et un messager cruel sera envoyé contre lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un ange cruel sera envoyé contre lui ». Le mot hébreu peut désigner soit un messager, soit un ange.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: ne… que
  rationale: 'Cette tournure française exprime naturellement la valeur restrictive de אַךְ : le rebelle recherche uniquement le mal.'
- source_word: מְרִי
  choice: le rebelle
  rationale: 'Bien que le nom puisse désigner abstraitement la rébellion, les verbes et le pronom au masculin singulier favorisent ici un emploi personnel : celui qui se rebelle.'
- source_word: יְבַקֶּשׁ
  choice: recherche
  rationale: Le piel de בקש signifie couramment « chercher » ou « rechercher » ; « recherche » convient au registre proverbial et suggère une démarche délibérée.
- source_word: רָע
  choice: le mal
  rationale: רָע peut désigner le mal moral, le tort ou le malheur. « Le mal » conserve ici sa portée générale sans réduire le terme au seul dommage subi.
- source_word: מַלְאָךְ
  choice: messager
  rationale: Le mot peut désigner un messager humain ou un ange. « Messager » préserve la catégorie générale sans imposer une identité surnaturelle.
- source_word: אַכְזָרִי
  choice: cruel
  rationale: « Cruel » rend directement la dureté impitoyable exprimée par l’adjectif hébreu.
- source_word: יְשֻׁלַּח
  choice: sera envoyé
  rationale: La forme pual est passive ; le futur français exprime bien la conséquence annoncée par le proverbe.
- source_word: בּוֹ
  choice: contre lui
  rationale: Dans ce contexte hostile et punitif, « contre lui » rend idiomatiquement la direction de l’action.
theological_decisions:
- issue: מַלְאָךְ désigne-t-il un ange surnaturel ou plus généralement un messager ?
  choice: messager
  alternative: ange
  rationale: Le texte n’identifie pas explicitement l’agent comme céleste. « Messager » évite de préciser davantage que l’hébreu, tandis que la note conserve l’interprétation possible « ange ».
translation_notes:
  register: Français international moderne, concis et digne, avec le parallélisme proverbial conservé. « Le rebelle » est plus naturel et inclusif que « l’homme rebelle », tout en maintenant la référence personnelle masculine du texte hébreu.
