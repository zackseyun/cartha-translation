  text: יֹלֵ֣ד כְּ֭סִיל לְ/ת֣וּגָה ל֑/וֹ וְ/לֹֽא יִ֝שְׂמַ֗ח אֲבִ֣י נָבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: fr
  text: Qui engendre un insensé s’en attire du chagrin, et le père d’un homme ignoble ne se réjouit pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « homme ignoble » désigne une personne moralement vile ou déshonorante, et non simplement quelqu’un qui manque d’intelligence. Ou « vaurien ».
    reason: cultural_note
lexical_decisions:
- source_word: יֹלֵד
  choice: Qui engendre
  rationale: Le participe qal employé substantivement désigne celui qui engendre. « Engendre » convient aux deux parents en soi, tout en prenant ici une nuance paternelle du fait du parallèle avec « le père ».
- source_word: כְּסִיל
  choice: un insensé
  rationale: Terme courant de la littérature de sagesse pour une personne obstinée dans sa folie morale et intellectuelle, et non simplement peu intelligente.
- source_word: לְתוּגָה לוֹ
  choice: pour son propre chagrin
  rationale: La préposition et le pronom indiquent que l’engendrement aboutit au chagrin de celui qui engendre; cette formulation française rend naturellement ce résultat.
- source_word: וְלֹא יִשְׂמַח
  choice: n’a aucune joie
  rationale: L’imparfait hébreu énonce ici une vérité générale. La formulation conserve l’idée d’une absence de réjouissance.
- source_word: אֲבִי
  choice: le père de
  rationale: La forme construite est complétée par le nom suivant et le parallélisme confirme le référent paternel.
- source_word: נָבָל
  choice: un être ignoble
  rationale: Le mot qualifie une personne moralement vile, honteuse ou indigne, et ne se limite pas à un manque d’intelligence. Cette traduction le distingue de כְּסִיל sans préciser indûment le sexe de l’enfant.
