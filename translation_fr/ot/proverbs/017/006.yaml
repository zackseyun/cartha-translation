source:
  edition: WLC
  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: fr
  text: Les petits-enfants[a] sont la couronne des personnes âgées, et la gloire des enfants, ce sont leurs pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les enfants des enfants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: Le nom désigne une couronne, symbole d’honneur et de distinction. « Couronne » conserve naturellement la métaphore et le parallélisme du proverbe.
- source_word: זְקֵנִים
  choice: personnes âgées
  rationale: Dans ce contexte, le terme désigne les gens avancés en âge, sans impliquer la fonction officielle d’« anciens ». Cette formulation est naturelle en français moderne et inclut la portée collective du pluriel hébreu.
- source_word: בְּנֵי בָנִים
  choice: petits-enfants
  rationale: L’expression signifie littéralement « enfants des enfants » et désigne idiomatiquement les petits-enfants.
- source_word: תִפְאֶרֶת
  choice: fierté
  rationale: Le terme peut exprimer la gloire, la splendeur ou l’honneur. Dans cette relation familiale, « fierté » rend avec naturel l’honneur dont les enfants se réclament, tout en répondant à l’image de la couronne.
- source_word: בָּנִים
  choice: enfants
  rationale: Bien que le mot soit morphologiquement masculin, il peut avoir ici une portée familiale générale dans la littérature de sagesse. « Enfants » restitue cette portée sans limiter le propos aux fils.
- source_word: אֲבוֹתָם
  choice: les pères … de leurs enfants
  rationale: L’hébreu dit explicitement « leurs pères ». La restructuration française — « les pères sont la fierté de leurs enfants » — clarifie sans ambiguïté le référent du pronom tout en conservant le terme masculin du texte source.
theological_decisions:
- issue: Termes familiaux genrés dans un proverbe de portée générale
  choice: Traduire בָּנִים par « enfants » et conserver אֲבוֹתָם sous la forme « les pères ».
  alternative: Traduire plus formellement par « fils » et « leurs pères », ou généraliser en « enfants » et « parents ».
  rationale: Le proverbe formule une observation générale sur l’honneur entre générations. בָּנִים peut englober les enfants dans ce contexte, tandis que אֲבוֹתָם est explicitement masculin et ne doit pas être élargi silencieusement à « parents ».
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme proverbial et la métaphore de la couronne. « Personnes âgées » évite de faire croire qu’il s’agit d’anciens investis d’une charge. L’inversion de la seconde proposition rend le lien possessif immédiatement clair en français.
