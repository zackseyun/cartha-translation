  text: גַּ֤ם אֱוִ֣יל מַ֭חֲרִישׁ חָכָ֣ם יֵחָשֵׁ֑ב אֹטֵ֖ם שְׂפָתָ֣י/ו נָבֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/028.yaml
  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: fr
  text: Même l’insensé qui se tait passe pour sage ; celui qui ferme ses lèvres passe pour intelligent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Marque l’extension surprenante et concessive : même une personne insensée peut être tenue pour sage dans cette situation.'
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Terme courant de la littérature sapientiale pour une personne déficiente sur les plans moral et intellectuel ; « insensé » convient au registre digne des Proverbes.
- source_word: מַחֲרִישׁ
  choice: quand il se tait
  rationale: Rend naturellement le participe qui décrit l’état ou l’action de s’abstenir de parler.
- source_word: חָכָם יֵחָשֵׁב
  choice: passe pour sage
  rationale: Conserve le sens passif d’être tenu ou regardé comme sage, tout en exprimant clairement qu’il s’agit de l’impression produite.
- source_word: אֹטֵם
  choice: celui qui ferme
  rationale: Préserve l’image concrète de la fermeture et la nuance de retenue volontaire dans la parole.
- source_word: שְׂפָתָיו
  choice: ses lèvres
  rationale: Reproduit l’image corporelle précise de l’hébreu plutôt que de la remplacer par « bouche » ou « paroles ».
- source_word: נָבוֹן
  choice: intelligent
  rationale: Désigne ici une personne douée de compréhension et de discernement ; le français « intelligent » s’insère naturellement dans la construction elliptique du second membre.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme hébreu est conservé, avec ellipse de « passe » dans le second membre. La formulation maintient la distinction entre être réellement sage et passer pour sage aux yeux d’autrui.
