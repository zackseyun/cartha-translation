  text: מְֽכַסֶּה פֶּ֭שַׁע מְבַקֵּ֣שׁ אַהֲבָ֑ה וְ/שֹׁנֶ֥ה בְ֝/דָבָ֗ר מַפְרִ֥יד אַלּֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: fr
  text: Celui qui couvre une offense recherche l’amour[a], mais celui qui revient sur une affaire sépare un ami intime.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvre une transgression ». L’hébreu conserve l’image de couvrir au lieu de parler explicitement de pardon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: couvre
  rationale: Le participe de כסה signifie littéralement « couvrir » ou « dissimuler ». « Couvre » conserve la métaphore hébraïque sans expliciter excessivement l’idée de pardon.
- source_word: פֶּשַׁע
  choice: une offense
  rationale: Bien que פשע puisse désigner une transgression ou une rébellion, le cadre relationnel du proverbe favorise ici le terme courant « offense ».
- source_word: מְבַקֵּשׁ
  choice: recherche
  rationale: Le participe exprime l’action de chercher ou de poursuivre. « Recherche » rend naturellement l’orientation volontaire vers l’amour.
- source_word: אַהֲבָה
  choice: l’amour
  rationale: Le nom désigne largement l’amour. Ce choix direct évite de le réduire à la seule amitié.
- source_word: שֹׁנֶה
  choice: revient sur
  rationale: Avec « affaire », שנה évoque le fait de reprendre ou de remettre en circulation une offense passée. « Revient sur » exprime ce sens en français naturel tout en laissant ouverte la manière précise dont l’affaire est répétée.
- source_word: בְדָבָר
  choice: sur l’affaire
  rationale: דבר peut signifier parole, chose, affaire ou question. Ici, « l’affaire » renvoie naturellement à l’offense évoquée dans le premier membre.
- source_word: מַפְרִיד
  choice: sépare
  rationale: Le participe causatif signifie « faire séparer » ou « provoquer une séparation ». « Sépare » en est l’équivalent direct.
- source_word: אַלּוּף
  choice: des amis intimes
  rationale: Dans la littérature de sagesse, אַלּוּף peut désigner un proche, un compagnon intime. Le pluriel français exprime naturellement la portée générale du singulier hébreu.
