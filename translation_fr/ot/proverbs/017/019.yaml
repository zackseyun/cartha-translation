source:
  edition: WLC
  text: אֹ֣הֵֽב פֶּ֭שַׁע אֹהֵ֣ב מַצָּ֑ה מַגְבִּ֥יהַּ פִּ֝תְח֗/וֹ מְבַקֶּשׁ שָֽׁבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/019.yaml
  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
translation:
  language: fr
  text: Qui aime la transgression aime la querelle ; qui élève sa porte[a] cherche la ruine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui élève son entrée » ou « son portail ». L’image peut évoquer l’orgueil et l’exaltation de soi, une construction ostentatoire, ou encore une attitude qui attire le désastre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: aime
  rationale: Le participe qal exprime ici un attachement ou un goût habituel. « Aime » conserve la force morale et la répétition du texte hébreu.
- source_word: פֶּשַׁע
  choice: révolte
  rationale: Le terme désigne une violation volontaire, souvent conçue comme une rébellion. « Révolte » rend mieux cette dimension délibérée que « faute ».
- source_word: מַצָּה
  choice: querelles
  rationale: Le nom évoque la dispute et la discorde. Le pluriel français « querelles » est naturel dans cette maxime générale.
- source_word: מַגְבִּיהַּ
  choice: élève
  rationale: Le participe hiphil signifie « rendre haut, élever ». Cette traduction maintient l'image concrète sans en imposer une interprétation figurée.
- source_word: פִּתְחוֹ
  choice: son entrée
  rationale: פֶּתַח désigne une ouverture, une entrée ou un seuil. « Entrée » préserve l'ambiguïté entre l'ouverture architecturale et une éventuelle image sociale, sans préciser indûment « porte » ou « portail ».
- source_word: מְבַקֶּשׁ
  choice: cherche
  rationale: 'Le participe signifie normalement « chercher ». Le mot conserve ici l''ironie proverbiale : le comportement décrit revient à aller au-devant de la ruine.'
- source_word: שָׁבֶר
  choice: ruine
  rationale: Le terme peut évoquer brisure, effondrement ou désastre. « Ruine » convient à la fois à l'image architecturale et à la conséquence générale.
theological_decisions:
- issue: Sens de l'entrée élevée
  choice: Conserver l'image concrète « élève son entrée » sans l'expliquer dans le verset.
  alternative: Expliciter l'orgueil, l'ostentation architecturale ou une conduite qui attire le désastre.
  rationale: L'hébreu ne tranche pas entre ces lectures. La traduction maintient donc la tension et la note signale les principales possibilités sans privilégier une doctrine.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme est conservé par la reprise de « aime » et de la structure « qui… ». « Révolte », « querelles » et « ruine » gardent une tonalité digne tout en restant accessibles.
