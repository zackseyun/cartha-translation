id: PRO.17.22
reference: Proverbs 17:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב גֵּהָ֑ה וְ/ר֥וּחַ נְ֝כֵאָ֗ה תְּיַבֶּשׁ גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: fr
  text: Un cœur joyeux favorise la guérison[a], mais un esprit abattu dessèche les os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait du bien comme un remède ». Le nom hébreu גֵּהָה peut désigner la guérison, le rétablissement ou un remède ; le texte retient le sens plus large de « guérison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Dans les Proverbes, לֵב désigne couramment la personne intérieure, notamment ses émotions et sa volonté. « Cœur » est naturel en français et conserve l’image anthropologique.
- source_word: שָׂמֵחַ
  choice: joyeux
  rationale: L’adjectif exprime la joie. « Un cœur joyeux » est une tournure actuelle et digne, sans la nuance parfois légère de « gai ».
- source_word: יֵיטִב
  choice: favorise
  rationale: Le hifil de יטב signifie « faire du bien » ou « rendre bon ». Avec גֵּהָה, « favorise la guérison » exprime clairement sa valeur bénéfique ou causative sans imposer une formulation française maladroite.
- source_word: גֵּהָה
  choice: guérison
  rationale: Ce nom rare peut désigner la guérison, le rétablissement ou un remède. « Guérison » conserve le sens large et correspond au contraste avec la détérioration physique du second membre.
- source_word: רוּחַ
  choice: esprit
  rationale: Ici, רוּחַ désigne l’esprit ou la disposition intérieure de la personne. « Esprit » maintient le parallélisme anthropologique avec « cœur ».
- source_word: נְכֵאָה
  choice: abattu
  rationale: L’adjectif décrit un esprit frappé, accablé ou brisé. « Abattu » est idiomatique en français avec « esprit » et traduit l’affliction profonde sans suggérer nécessairement une destruction totale.
- source_word: תְּיַבֶּשׁ
  choice: dessèche
  rationale: Le piel exprime l’action de rendre sec. « Dessèche » restitue directement et avec force la métaphore concrète.
- source_word: גָּרֶם
  choice: les os
  rationale: Bien que le terme soit au singulier, il peut avoir un sens collectif. Le pluriel « les os » est naturel en français et rend clairement l’effet sur tout l’organisme.
theological_decisions: []
