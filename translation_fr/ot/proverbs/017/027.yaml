    rationale: En français, « esprit frais » n’est pas une formulation littérale claire dans ce contexte et risque d’évoquer la vivacité intellectuelle. « Froid d’esprit » rend plus directement l’image hébraïque, tandis que « sang-froid » transmet naturellement le sens.
