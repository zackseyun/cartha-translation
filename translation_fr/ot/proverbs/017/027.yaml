  text: חוֹשֵׂ֣ךְ אֲ֭מָרָי/ו יוֹדֵ֣עַ דָּ֑עַת ו/קר ר֝֗וּחַ אִ֣ישׁ תְּבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: fr
  text: 'Celui qui retient ses paroles possède la connaissance,

    et celui qui garde son sang-froid[b] est un homme de discernement[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « un homme de discernement » ; dans ce proverbe, le masculin singulier désigne de façon générale une personne caractérisée par le discernement.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « est froid d’esprit ». L’hébreu emploie une image de température pour évoquer le calme et la maîtrise de soi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ אֲמָרָיו
  choice: retient ses paroles
  rationale: Le participe חוֹשֵׂךְ exprime ici le fait de contenir ou de retenir sa parole. « Retient ses paroles » est naturel en français et conserve l’accent mis sur la maîtrise de soi.
- source_word: יוֹדֵעַ דָּעַת
  choice: possède la connaissance
  rationale: La formulation hébraïque, littéralement proche de « connaît la connaissance », caractérise quelqu’un qui a du savoir ou du discernement. « Possède la connaissance » rend clairement cet idiome sans l’aplanir en simple jugement moral.
- source_word: וְקַר רוּחַ
  choice: a l’esprit calme
  rationale: קַר signifie littéralement « frais, froid » et décrit métaphoriquement une disposition intérieure maîtrisée. La traduction principale exprime le sens en français courant, tandis que la note conserve l’image de température.
- source_word: אִישׁ תְּבוּנָה
  choice: l’homme intelligent
  rationale: אִישׁ est explicitement masculin singulier, et תְּבוּנָה désigne l’intelligence, le discernement ou la compréhension. Le masculin est conservé, avec une note précisant la portée proverbiale générale.
theological_decisions:
- issue: Expression genrée dans un proverbe de sagesse
  choice: l’homme intelligent
  alternative: la personne intelligente
  rationale: Le texte hébreu emploie אִישׁ, « homme », au masculin singulier. La traduction en garde la forme tout en signalant que, dans ce proverbe, elle décrit de manière générale quiconque se caractérise par le discernement.
- issue: Métaphore de la température appliquée à l’esprit
  choice: a l’esprit calme
  alternative: a l’esprit frais
  rationale: Le français « avoir l’esprit frais » ne communique pas naturellement la maîtrise émotionnelle visée ici. « Calme » transmet le sens contextuel, et la note rend transparente l’image littérale de l’hébreu sans imposer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme des deux propositions est conservé. « Paroles », « connaissance », « homme intelligent » et « esprit » maintiennent les principaux termes concrets de l’hébreu, tandis que les notes explicitent la portée générique du masculin et l’image de fraîcheur.
