review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend fidèlement בְּכָל־עֵת et le participe prédicatif אֹהֵב. Dans la seconde, יִוָּלֵד est un imparfait nifal à valeur gnomique : « naît » restitue mieux cette valeur que le passé composé résultatif « est né ». « Pour l’adversité » rend directement לְצָרָה.'
  naturalness: « Un ami aime en tout temps » est idiomatique dans un registre proverbial moderne. « Un frère naît pour l’adversité » demeure une formulation volontairement dense, mais naturelle et fidèle à l’image du texte.
  terminology: « Ami », « frère » et « adversité » sont justes et conservent le parallélisme ainsi que le registre sapientiel. Aucun terme théologique spécialisé n’est en jeu.
  issues:
  - severity: medium
    issue: Temps verbal de « est né »
    rationale: יִוָּלֵד est un imparfait nifal, employé ici dans une maxime générale. « Naît » exprime mieux l’aspect gnomique que « est né », qui présente la naissance comme un fait accompli.
  - severity: medium
    issue: Note présentant « au temps de la détresse » comme lecture alternative
    rationale: La préposition לְ dans לְצָרָה se rend naturellement par « pour » et n’établit pas à elle seule une alternative temporelle « au temps de ». Cette note transforme une explicitation interprétative possible en variante textuelle et risque d’induire une ambiguïté que le texte ne marque pas.
