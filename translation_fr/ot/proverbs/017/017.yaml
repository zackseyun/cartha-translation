  text: בְּ/כָל עֵ֭ת אֹהֵ֣ב הָ/רֵ֑עַ וְ/אָ֥ח לְ֝/צָרָ֗ה יִוָּלֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: fr
  text: Un ami aime en tout temps, et un frère naît pour l’adversité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/כָל עֵת
  choice: en tout temps
  rationale: La construction בְּ + כָּל + עֵת exprime une portée temporelle universelle. « En tout temps » est naturel, concis et adapté au style proverbial.
- source_word: אֹהֵב
  choice: aime
  rationale: Le participe qal exprime ici une conduite caractéristique. Le présent « aime » restitue directement cette valeur générale et durable.
- source_word: הָ/רֵעַ
  choice: un ami
  rationale: Dans cette maxime, l’article hébreu désigne vraisemblablement une catégorie plutôt qu’une personne déterminée. « Un ami » exprime clairement ce sens générique et relationnel.
- source_word: וְ/אָח
  choice: et un frère
  rationale: אָח signifie normalement « frère », au sens propre ou, par extension, d’un proche solidaire. Le terme conserve le parallélisme du proverbe.
- source_word: לְ֝/צָרָה
  choice: pour l’adversité
  rationale: צָרָה peut désigner la détresse, le malheur ou l’adversité. « Pour l’adversité » reste bref et préserve l’ouverture sémantique de l’hébreu.
- source_word: יִוָּלֵד
  choice: est né
  rationale: Le nifal de ילד signifie naturellement « naître ». La traduction littérale préserve l’image forte selon laquelle la vocation fraternelle se manifeste particulièrement dans l’épreuve.
theological_decisions:
- issue: Rapport entre la naissance du frère et l’adversité
  choice: '« un frère est né pour l’adversité » : la préposition לְ est rendue par une relation de destination ou de finalité'
  alternative: '« un frère naît au temps de l’adversité » : l’épreuve ferait apparaître qui se révèle véritablement frère'
  rationale: L’hébreu permet de comprendre לְצָרָה comme indiquant la destination ou la circonstance. Le texte principal conserve la formulation la plus directe, tandis que la note signale l’autre lecture sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et concis. La structure parallèle et la densité proverbiale de l’hébreu sont conservées. « En tout temps » et « adversité » donnent une cadence soutenue sans archaïsme excessif.
