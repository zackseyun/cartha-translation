id: PRO.17.23
reference: Proverbs 17:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֹׁ֣חַד מֵ֭/חֵיק רָשָׁ֣ע יִקָּ֑ח לְ֝/הַטּ֗וֹת אָרְח֥וֹת מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/023.yaml
  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: fr
  text: Le méchant accepte un pot-de-vin tiré du repli d’un vêtement[a], afin de faire dévier les voies de la justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venant du sein » ou « du giron »; l’image hébraïque évoque probablement un objet sorti d’un repli du vêtement où il était dissimulé, ce qui suggère une transaction secrète.
    reason: lexical_alternative
  - marker: b
    text: Ou « le cours de la justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: pot-de-vin
  rationale: Le terme désigne ici un présent illicite destiné à influencer une décision. « Pot-de-vin » est l’équivalent français moderne le plus clair dans ce contexte judiciaire.
- source_word: מֵחֵיק
  choice: tiré du repli d’un vêtement
  rationale: חֵיק désigne littéralement le sein ou le giron, et peut évoquer le repli du vêtement où l’on dissimule un objet. Cette formulation conserve l’image concrète ainsi que l’idée implicite de secret.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé désigne une personne mauvaise ou coupable. « Le méchant » rend naturellement en français le masculin singulier à portée proverbiale et générique.
- source_word: יִקָּח
  choice: accepte
  rationale: לקח signifie couramment « prendre »; avec un pot-de-vin, « accepte » exprime plus naturellement en français l’acte de le recevoir sans modifier le sens.
- source_word: לְהַטּוֹת
  choice: afin de faire dévier
  rationale: L’infinitif exprime le fait de détourner de la voie droite. « Faire dévier » conserve la métaphore spatiale qui se poursuit avec les « voies ».
- source_word: אָרְחוֹת
  choice: les voies
  rationale: Le pluriel signifie « sentiers », « chemins » ou « voies ». « Voies » préserve la métaphore tout en restant idiomatique dans un contexte abstrait.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte de corruption, le mot vise la justice ou le juste jugement; « justice » rend le mieux la portée juridique et morale.
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: les voies de la justice
  rationale: Cette expression conserve le pluriel et l’image hébraïque de chemins que la corruption détourne, tout en restant claire en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve l’image concrète du vêtement et la métaphore plurielle des voies, tout en employant « accepte un pot-de-vin », expression naturelle dans le contexte de la corruption.
