  text: אֶת פְּנֵ֣י מֵבִ֣ין חָכְמָ֑ה וְ/עֵינֵ֥י כְ֝סִ֗יל בִּ/קְצֵה אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: fr
  text: La sagesse est devant celui qui a du discernement[a], mais les yeux de l’insensé sont au bout du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant la face de celui qui comprend » ; on peut aussi comprendre : « en présence de celui qui comprend ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à l’extrémité de la terre » ; le mot hébreu peut aussi signifier « le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת פְּנֵי
  choice: devant
  rationale: L’expression est comprise dans son sens prépositionnel (« auprès de, devant »). « Devant » exprime naturellement que la sagesse est immédiatement accessible à la personne avisée, en contraste avec le regard égaré au loin.
- source_word: מֵבִין
  choice: celui qui a du discernement
  rationale: Le participe masculin singulier désigne proverbialement une personne caractérisée par l’intelligence et le discernement. Cette formulation française reste générique sans rendre le masculin hébreu par « un homme », qui serait ici plus restrictif.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Le nom abstrait est rendu sans majuscule afin de ne pas imposer une personnification que le verset n’exige pas.
- source_word: וְעֵינֵי
  choice: mais les yeux
  rationale: La conjonction introduit un contraste net entre la proximité de la sagesse pour la personne avisée et le regard dispersé de l’insensé.
- source_word: כְסִיל
  choice: l’insensé
  rationale: Dans les Proverbes, le terme désigne une personne à la fois moralement et intellectuellement dépourvue de sagesse. « Insensé » convient au registre sapiential et demeure clair en français moderne.
- source_word: בִּקְצֵה אָרֶץ
  choice: au bout du monde
  rationale: Cette expression française naturelle conserve l’image hyperbolique de l’extrême éloignement et du regard qui erre loin de ce qui est présent.
theological_decisions:
- issue: Sujet proverbial au masculin singulier
  choice: celui qui a du discernement
  alternative: un homme intelligent
  rationale: Le masculin singulier hébreu représente ici un type humain générique. La formulation choisie communique cette portée sans ajouter une restriction au sexe masculin.
- issue: Personnification de la sagesse
  choice: la sagesse
  alternative: La Sagesse
  rationale: Rien dans ce verset n’oblige à comprendre la sagesse comme une figure personnelle. La minuscule préserve le sens abstrait et évite une interprétation théologique ajoutée.
- issue: Portée de אָרֶץ
  choice: le monde
  alternative: le pays / la terre
  rationale: Dans cette image proverbiale d’éloignement extrême, le sens large convient mieux qu’un territoire déterminé, tout en laissant l’alternative littérale en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé. « Au bout du monde » rend idiomatiquement l’hyperbole hébraïque, tandis que les notes signalent les formulations plus littérales et les ambiguïtés lexicales.
