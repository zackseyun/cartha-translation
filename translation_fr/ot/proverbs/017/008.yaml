  text: אֶֽבֶן חֵ֣ן הַ֭/שֹּׁחַד בְּ/עֵינֵ֣י בְעָלָ֑י/ו אֶֽל כָּל אֲשֶׁ֖ר יִפְנֶ֣ה יַשְׂכִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/008.yaml
  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: fr
  text: Le pot-de-vin est une pierre porte-bonheur aux yeux de celui qui le possède[a] ; où qu’il se tourne, il réussit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une pierre précieuse » ou « une pierre magique ». Littéralement : « une pierre de faveur ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « il prospère ». Le verbe hébreu peut évoquer une conduite avisée ou efficace qui mène à la réussite.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: une pierre qui attire la faveur
  rationale: Littéralement « pierre de faveur » ou « pierre de grâce ». La formulation conserve l’image concrète de la pierre tout en exprimant naturellement en français l’avantage que son possesseur lui attribue, sans trancher entièrement entre objet précieux et talisman.
- source_word: הַשֹּׁחַד
  choice: le pot-de-vin
  rationale: Le nom désigne couramment un présent corrupteur. « Pot-de-vin » rend clairement cette valeur morale négative dans un français actuel.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française correspond naturellement à l’idiome hébreu de perspective ou d’appréciation.
- source_word: בְעָלָיו
  choice: celui qui le possède
  rationale: La formule désigne le détenteur du pot-de-vin, vraisemblablement celui qui s’en sert. Elle évite le mot « propriétaire », peu naturel ici, sans préciser davantage que l’hébreu son rôle exact.
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: où qu’il se tourne
  rationale: Cette tournure idiomatique garde l’idée de toute direction ou de toute entreprise, dans un français concis.
- source_word: יַשְׂכִּיל
  choice: il réussit
  rationale: Le hiphil de שׂכל peut exprimer le fait d’agir avec discernement ou efficacité et, par conséquent, de réussir. Ici, le contexte met surtout en avant l’efficacité pratique attribuée au pot-de-vin.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la pierre est conservée, tandis que « qui attire la faveur » rend intelligible l’expression hébraïque inhabituelle. Le verset décrit le pouvoir que le détenteur attribue au pot-de-vin, sans nécessairement l’approuver.
