  yaml_path: translation/ot/proverbs/017/013.yaml
  text: Whoever repays evil for good[a], evil will not depart from his house.
translation:
  language: fr
  text: Qui rend le mal pour le bien, le mal ne quittera pas sa maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le malheur ne quittera pas sa maison ». Le second terme traduit par « mal » (רָעָה) peut désigner soit le mal moral, soit une conséquence nuisible, comme le malheur ou la calamité. Le texte principal conserve la répétition de l’hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: rend
  rationale: Le participe hiphil de שוב exprime ici le fait de rendre quelque chose en retour. « Rend le mal pour le bien » est une tournure française naturelle qui conserve la force réciproque du proverbe.
- source_word: רָעָה (première occurrence)
  choice: le mal
  rationale: Le terme désigne ici une conduite mauvaise opposée au bien reçu. « Le mal » en préserve nettement la portée morale.
- source_word: תַּחַת
  choice: pour
  rationale: La préposition marque ici l’échange ou la contrepartie. Avec « rendre », « pour » exprime idiomatiquement le fait de répondre au bien par le mal.
- source_word: טוֹבָה
  choice: le bien
  rationale: Le nom a un sens général de bien, de bonté ou de bienfait. « Le bien » maintient la portée générale et le parallélisme avec « le mal ».
- source_word: לֹא תמיש
  choice: ne quittera pas
  rationale: Cette forme de מוש exprime le non-éloignement ou la permanence. « Ne quittera pas » est clair en français moderne et indique que le mal restera attaché à la maison.
- source_word: רָעָה (seconde occurrence)
  choice: le mal
  rationale: La répétition française reproduit celle de l’hébreu et conserve son effet frappant, sans exclure le sens possible de malheur ou de calamité, signalé en note.
- source_word: מִבֵּיתוֹ
  choice: sa maison
  rationale: בַּיִת peut désigner la maison, la maisonnée ou la famille. « Sa maison » est direct et conserve l’expression proverbiale tout en pouvant inclure le foyer.
- source_word: sujet implicite du participe
  choice: Qui
  rationale: Le participe substantivé a une valeur générique. Le relatif « Qui » rend cette généralité avec concision et dans un registre proverbial naturel.
