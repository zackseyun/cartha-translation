source:
  edition: WLC
  text: מֵ֭רַע מַקְשִׁ֣יב עַל שְׂפַת אָ֑וֶן שֶׁ֥קֶר מֵ֝זִין עַל לְשׁ֥וֹן הַוֺּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/004.yaml
  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: fr
  text: Celui qui fait le mal écoute des lèvres malveillantes ; le menteur prête l’oreille à une langue destructrice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui fait le mal écoute des lèvres d’iniquité ; le mensonge prête l’oreille à une langue de ruine. » L’hébreu permet une traduction plus littérale où « mensonge » est compris de manière abstraite plutôt que comme « le menteur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  choice: celui qui fait le mal
  rationale: Le terme désigne substantivement une personne caractérisée par le mal. Cette formulation est claire et naturelle en français moderne.
- source_word: מַקְשִׁיב עַל
  choice: écoute
  rationale: Le verbe exprime une écoute attentive, et la préposition introduit ici ce à quoi la personne prête attention.
- source_word: שְׂפַת אָוֶן
  choice: des lèvres malveillantes
  rationale: « Lèvres » conserve la métonymie hébraïque désignant la parole ; אָוֶן évoque ici une parole moralement mauvaise et nuisible.
- source_word: שֶׁקֶר
  choice: le menteur
  rationale: Bien que le mot signifie formellement « mensonge » ou « fausseté », le parallélisme avec מֵרַע permet de le comprendre comme désignant une personne caractérisée par le mensonge.
- source_word: מֵזִין
  choice: prête l’oreille
  rationale: Le hiphil de אזן signifie « prêter l’oreille, écouter ». La formulation française préserve la nuance d’attention et la variation poétique.
- source_word: לְשׁוֹן הַוּוֹת
  choice: une langue destructrice
  rationale: « Langue » conserve l’image hébraïque de la parole, tandis que הַוּוֹת désigne des ravages, des désastres ou la ruine ; « destructrice » exprime naturellement sa force nuisible.
theological_decisions:
- issue: Valeur personnelle ou abstraite de שֶׁקֶר
  choice: le menteur
  alternative: le mensonge
  rationale: Le parallélisme favorise une lecture personnelle, mais l’hébreu permet aussi de conserver le substantif abstrait ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé par « écoute » et « prête l’oreille », ainsi que par les images des lèvres et de la langue.
