source:
  edition: WLC
  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent servant will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: fr
  text: Un esclave avisé exercera son autorité sur un fils qui fait honte, et parmi les frères, il aura sa part de l’héritage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: esclave
  rationale: Le terme peut désigner un serviteur ou un esclave. Ici, « esclave » rend sa condition subordonnée et fait ressortir le renversement social au cœur du proverbe.
- source_word: מַשְׂכִּיל
  choice: avisé
  rationale: Le participe évoque une personne qui agit avec discernement et efficacité pratique; « avisé » convient au registre sapientiel et reste naturel en français.
- source_word: יִמְשֹׁל בְּבֵן
  choice: dominera sur un fils
  rationale: Le verbe exprime l’exercice d’une autorité sur quelqu’un. « Dominera sur » conserve la force directe de l’hébreu et le contraste de statut.
- source_word: מֵבִישׁ
  choice: qui fait honte
  rationale: 'Le participe a une valeur active: le fils cause la honte, vraisemblablement à sa famille, plutôt qu’il ne la ressent simplement.'
- source_word: וּבְתוֹךְ אַחִים
  choice: et au milieu des frères
  rationale: Cette formulation proche de l’hébreu indique que l’esclave est admis dans le cercle des héritiers familiaux; le masculin « frères » est conservé.
- source_word: יַחֲלֹק נַחֲלָה
  choice: il partagera l’héritage
  rationale: Dans ce contexte successoral, le verbe indique qu’il aura part au partage ou recevra une part de l’héritage. La formulation française conserve cette légère latitude.
theological_decisions:
- issue: Langage familial genré
  choice: frères
  alternative: frères et sœurs / membres de la fratrie
  rationale: Le texte hébreu emploie explicitement le masculin pluriel אַחִים. « Frères » préserve cette forme et le cadre traditionnel des héritiers sans exclure par explication une portée familiale plus large.
- issue: Statut de עֶבֶד
  choice: esclave
  alternative: serviteur
  rationale: Le contexte repose sur le renversement par lequel une personne de condition servile surpasse un fils déshonorant et participe à l’héritage. « Esclave » rend ce contraste plus nettement, sans ajouter de précision absente du texte.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure parallèle et le futur sentencieux sont maintenus. « Avisé » exprime une sagesse pratique; « dominera sur » assume une légère solennité afin de préserver la vigueur de משל.
