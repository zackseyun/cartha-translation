  - severity: low
    issue: Tour « dominera sur »
    rationale: Le tour est moins idiomatique en français moderne et peut évoquer une domination générale plutôt qu’une autorité exercée sur une personne.
  - severity: low
    issue: « Au milieu des frères »
    rationale: Le calque spatial est compréhensible, mais « parmi les frères » exprime plus naturellement l’inclusion dans le groupe des cohéritiers.
