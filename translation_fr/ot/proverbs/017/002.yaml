- from: Un esclave avisé dominera sur un fils qui fait honte, et il partagera l’héritage au milieu des frères.
  to: Un esclave avisé exercera son autorité sur un fils qui fait honte, et parmi les frères, il aura sa part de l’héritage.
  rationale: 'La révision améliore l’idiomaticité sans modifier le sens : elle conserve l’opposition sociale marquée par « esclave », l’autorité sur le fils déshonorant et la participation de l’esclave à l’héritage avec les frères. « Aura sa part de l’héritage » évite l’ambiguïté distributive de « partagera l’héritage » tout en rendant la part successorale impliquée par l’hébreu.'
