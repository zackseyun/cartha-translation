  text: כַּ֣עַס לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וּ֝/מֶ֗מֶר לְ/יוֹלַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: fr
  text: 'Un fils insensé cause du chagrin à son père[a]

    et de l’amertume à celle qui l’a mis au monde[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « provoque la colère de son père ». Le mot hébreu peut désigner la colère, l’irritation ou le chagrin ; ici, il évoque probablement la détresse que le fils cause à son père.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celle qui l’a enfanté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: chagrin
  rationale: Le nom peut exprimer la colère, l’irritation ou la peine. Dans ce parallélisme, « chagrin » rend naturellement la détresse que le fils cause à son père, sans réduire le terme à une réaction de colère.
- source_word: לְאָבִיו
  choice: de son père
  rationale: La préposition לְ marque ici la personne affectée. La tournure française « fait le chagrin de son père » exprime naturellement cette relation dans une proposition nominale hébraïque.
- source_word: בֵּן כְּסִיל
  choice: un fils insensé
  rationale: Dans les Proverbes, כְּסִיל désigne celui dont la folie est morale et pratique, et non un simple manque d’intelligence. « Insensé » conserve cette catégorie sapientielle dans un registre digne.
- source_word: וּמֶמֶר
  choice: et remplit d’amertume
  rationale: Ce nom rare désigne vraisemblablement l’amertume ou une profonde affliction. La formulation verbale est naturelle en français et maintient le parallélisme avec le chagrin du père.
- source_word: לְיוֹלַדְתּוֹ
  choice: celle qui l’a mis au monde
  rationale: Le participe signifie littéralement « celle qui l’a enfanté ». Cette formulation conserve l’expression maternelle concrète du texte hébreu plutôt que de la réduire à « sa mère ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé sur deux lignes. « Insensé » garde la portée morale et pratique du vocabulaire sapientiel ; « celle qui l’a mis au monde » préserve l’image concrète de l’hébreu.
