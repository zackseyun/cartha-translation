id: PRO.17.26
reference: Proverbs 17:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֤ם עֲנ֣וֹשׁ לַ/צַּדִּ֣יק לֹא ט֑וֹב לְ/הַכּ֖וֹת נְדִיבִ֣ים עַל יֹֽשֶׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/026.yaml
  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: fr
  text: Il n’est pas bon non plus de punir le juste, ni de frapper des hommes de haut rang[b] à cause de leur droiture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contrairement à ce qui est juste ». L’expression hébraïque peut désigner le motif des coups (« à cause de leur droiture ») ou qualifier l’acte comme contraire à la justice.'
    reason: lexical_alternative
  - marker: b
    text: L’expression traduite par « hommes de haut rang » peut aussi désigner des nobles, des princes ou des dirigeants.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: non plus
  rationale: Dans une phrase négative, « non plus » rend naturellement la valeur additive de גַּם et relie ce constat à ce qui précède.
- source_word: עֲנוֹשׁ
  choice: punir
  rationale: Le verbe désigne ici l’imposition d’une peine sans préciser qu’il s’agit nécessairement d’une amende.
- source_word: לַצַּדִּיק
  choice: le juste
  rationale: Le singulier défini hébreu désigne le juste comme figure représentative ; cette formulation est concise et traditionnelle tout en restant courante.
- source_word: לֹא טוֹב
  choice: il n’est pas bon
  rationale: Cette tournure conserve l’évaluation simple et directe de l’hébreu sans la préciser davantage en « injuste » ou « illégitime ».
- source_word: לְהַכּוֹת
  choice: frapper
  rationale: Le terme reste général, comme le verbe hébreu, sans imposer le sens plus précis de battre ou de fouetter.
- source_word: נְדִיבִים
  choice: des hommes de haut rang
  rationale: Dans ce contexte judiciaire, le mot désigne probablement des personnes de rang élevé. Cette expression évite de limiter le sens à une noblesse héréditaire.
- source_word: עַל יֹשֶׁר
  choice: à cause de leur droiture
  rationale: 'La préposition עַל peut indiquer le motif : ces hommes sont frappés en raison de leur conduite droite. Le possessif explicite en français la relation suggérée par le contexte, sans exclure l’autre analyse possible.'
theological_decisions:
- issue: Rapport entre la sanction et la droiture dans עַל יֹשֶׁר
  choice: La droiture est présentée comme le motif pour lequel les hommes de haut rang sont frappés.
  alternative: 'Comprendre l’expression adverbialement : les frapper contrairement à la justice.'
  rationale: Le sens causal de עַל est direct et préserve le parallélisme avec la punition du juste, mais l’hébreu permet aussi une lecture normative ; celle-ci est donc signalée en note.
translation_notes:
  register: Français moderne, clair et digne. La coordination « ni » reproduit le parallélisme du verset. « Hommes de haut rang » rend la dimension sociale de נְדִיבִים sans évoquer exclusivement un titre nobiliaire héréditaire.
