id: PRO.17.7
reference: Proverbs 17:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא נָאוָ֣ה לְ/נָבָ֣ל שְׂפַת יֶ֑תֶר אַ֝֗ף כִּֽי לְ/נָדִ֥יב שְׂפַת שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: fr
  text: Un langage élevé[a] ne convient pas à un insensé ; combien moins des lèvres mensongères à un homme noble[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un langage excellent » ou « des paroles grandiloquentes ». L’expression hébraïque peut évoquer une parole élevée, supérieure ou excessive.
    reason: lexical_alternative
  - marker: b
    text: Ou « à un prince » ou « à un homme généreux ». Le mot hébreu peut désigner la noblesse du rang ou celle du caractère.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: ne convient pas
  rationale: Le terme exprime ce qui est approprié ou bienséant. « Ne convient pas » est naturel en français moderne et conserve l'idée centrale de convenance.
- source_word: נָבָל
  choice: un insensé
  rationale: Dans la littérature sapientiale, le mot désigne une personne dépourvue de discernement moral autant qu'intellectuel. « Insensé » garde cette portée traditionnelle sans se limiter à un manque d'intelligence.
- source_word: שְׂפַת יֶתֶר
  choice: un langage élevé
  rationale: Littéralement « lèvre de supériorité/excès », l'expression peut évoquer une parole élevée, excellente ou grandiloquente. « Langage élevé » préserve cette ambiguïté mieux qu'une formulation uniquement laudative.
- source_word: אַף כִּי
  choice: combien moins
  rationale: 'Cet idiome marque un raisonnement a fortiori : si le premier cas ne convient pas, le second convient encore moins.'
- source_word: נָדִיב
  choice: un homme noble
  rationale: Le terme peut désigner une personne de rang noble, de caractère généreux ou un prince. « Homme noble » conserve à la fois une possible dimension sociale et morale, les autres sens étant signalés en note.
- source_word: שְׂפַת שָׁקֶר
  choice: des lèvres mensongères
  rationale: L'expression signifie littéralement « lèvre de mensonge ». Le pluriel français est idiomatique et maintient l'image concrète des lèvres.
theological_decisions: []
