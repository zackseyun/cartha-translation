source:
  edition: WLC
  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: fr
  text: Celui qui a le cœur tortueux ne trouve pas le bien, et celui qui a la langue retorse tombe dans le malheur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: celui qui a le cœur tortueux
  rationale: L’expression désigne une personne dont l’intériorité, la volonté ou les intentions sont dévoyées. « Cœur tortueux » conserve l’image hébraïque dans un français naturel.
- source_word: לֹא יִמְצָא טוֹב
  choice: ne trouve pas le bien
  rationale: 'Traduction directe qui préserve l’étendue de טוֹב : ce qui est bon, bénéfique ou favorable.'
- source_word: נֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: celui dont la langue est perverse
  rationale: Littéralement, la langue est « retournée » ou « renversée » ; dans ce contexte, l’expression qualifie une parole fausse, retorse ou dévoyée. « Langue perverse » transmet ce sens sans le réduire au seul mensonge.
- source_word: יִפּוֹל בְּרָעָה
  choice: tombe dans le malheur
  rationale: רָעָה peut désigner le mal moral ou le malheur subi. Avec « tomber dans », le contexte proverbial favorise ici le malheur ou la calamité comme conséquence de la parole perverse.
theological_decisions:
- issue: Portée de « ne trouve pas le bien »
  choice: Conserver la formulation générale « le bien »
  alternative: « ne connaît pas le bonheur » ou « ne réussit pas »
  rationale: Le texte hébreu laisse ouverte la portée morale et concrète de טוֹב ; une traduction plus précise résoudrait indûment cette polyvalence.
- issue: Sens de רָעָה dans le second vers
  choice: « le malheur »
  alternative: « le mal »
  rationale: La construction évoque vraisemblablement une conséquence funeste dans laquelle la personne tombe, tout en laissant subsister le lien entre faute morale et calamité.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme entre le cœur tortueux et la langue perverse est maintenu, ainsi que la progression entre disposition intérieure, parole et conséquence.
