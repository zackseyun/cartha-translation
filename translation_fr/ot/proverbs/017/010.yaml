source:
  edition: WLC
  text: תֵּ֣חַת גְּעָרָ֣ה בְ/מֵבִ֑ין מֵ/הַכּ֖וֹת כְּסִ֣יל מֵאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/010.yaml
  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: fr
  text: Une réprimande a plus d’effet sur un homme qui comprend que de frapper cent fois un insensé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une réprimande touche plus profondément celui qui comprend que le fait de frapper cent fois un insensé. »'
    reason: Alternative plus imagée, qui conserve la métaphore spatiale du verbe hébreu tout en explicitant l'infinitif « frapper » du second membre.
lexical_decisions:
- source_word: תֵּחַת
  choice: pénètre plus profondément
  rationale: Le verbe exprime ici le fait de descendre ou de pénétrer; dans ce proverbe, il évoque l’effet profond d’une correction et conserve la comparaison introduite ensuite.
- source_word: גְּעָרָה
  choice: une réprimande
  rationale: Le nom désigne une correction verbale ferme. « Réprimande » est actuel, digne et suffisamment incisif.
- source_word: בְמֵבִין
  choice: chez un homme qui comprend
  rationale: Le participe masculin singulier désigne une personne capable de discernement. Cette formulation garde le masculin représentatif et exprime naturellement la disposition intérieure visée.
- source_word: מֵהַכּוֹת
  choice: que cent coups chez
  rationale: La préposition מִן marque la comparaison, tandis que l’infinitif de נכה évoque l’action de frapper. La formulation française condense naturellement cette action en « cent coups ».
- source_word: כְּסִיל
  choice: un insensé
  rationale: Dans les Proverbes, le terme désigne une personne moralement et intellectuellement réfractaire, non une simple déficience d’intelligence. « Insensé » conserve cette portée sapientielle.
- source_word: מֵאָה
  choice: cent
  rationale: Le nombre produit un contraste hyperbolique entre la réceptivité de l’homme qui comprend et l’obstination de l’insensé.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. « Pénètre plus profondément » préserve l’image spatiale de l’hébreu; la note propose une formulation plus explicite de son sens.
