  text: לָ/מָּה זֶּ֣ה מְחִ֣יר בְּ/יַד כְּסִ֑יל לִ/קְנ֖וֹת חָכְמָ֣ה וְ/לֶב אָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: fr
  text: Pourquoi l’insensé a-t-il en main de quoi acquérir la sagesse, alors qu’il n’a pas de cœur ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’y a pas de cœur ». En hébreu, le « cœur » peut désigner la faculté intérieure de comprendre, de juger ou de vouloir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Pourquoi… a-t-il
  rationale: Cette tournure rend naturellement en français la question rhétorique hébraïque, sans alourdir le texte par un calque de זֶה.
- source_word: מְחִיר בְּיַד
  choice: a-t-il en main le prix
  rationale: « Le prix » conserve la métaphore commerciale, tandis que « en main » maintient l’image hébraïque de la possession ou de la disponibilité.
- source_word: כְּסִיל
  choice: l’insensé
  rationale: Dans les Proverbes, ce terme désigne une personne obstinée sur les plans moral et intellectuel. « L’insensé » est plus digne et plus traditionnel dans ce registre que « l’idiot ».
- source_word: לִקְנוֹת
  choice: pour acquérir
  rationale: Le verbe peut signifier acheter ou acquérir. « Acquérir » s’accorde naturellement avec la sagesse tout en restant lié au « prix » mentionné juste avant.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent direct du terme central des Proverbes, qui englobe le jugement moral et l’habileté pratique à bien vivre.
- source_word: וְלֶב אָיִן
  choice: alors qu’il n’a aucun discernement
  rationale: Littéralement, le texte dit qu’il n’y a pas de cœur. Dans l’anthropologie hébraïque, le cœur est notamment le siège de l’intelligence, du jugement et de la volonté. « Discernement » exprime ici le sens contextuel sans suggérer en français un manque de courage ou de compassion.
theological_decisions:
- issue: Portée de l’absence de « cœur » chez l’insensé
  choice: aucun discernement
  alternative: aucune disposition intérieure à la sagesse
  rationale: Le texte peut viser une déficience de compréhension, de jugement ou de volonté. La traduction ne tranche pas en faveur d’une incapacité absolue ni d’une simple absence de désir ; la note préserve l’étendue du terme hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La structure interrogative conserve la force rhétorique du proverbe ; la métaphore du prix tenu en main est maintenue, tandis que l’expression hébraïque du « cœur » est explicitée dans la note afin d’éviter un contresens en français.
