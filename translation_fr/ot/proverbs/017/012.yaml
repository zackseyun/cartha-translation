  yaml_path: translation/ot/proverbs/017/012.yaml
  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: fr
  text: Mieux vaut rencontrer une ourse privée de ses petits que de rencontrer un insensé dans sa folie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגוֹשׁ
  choice: rencontrer
  rationale: L’infinitif absolu exprime ici l’idée de faire face à quelqu’un ou à quelque chose; « rencontrer » restitue simplement l’image et convient à la comparaison implicite.
- source_word: דֹּב שַׁכּוּל
  choice: une ourse privée de ses petits
  rationale: דֹּב n’indique pas grammaticalement le sexe, mais le participe שַׁכּוּל évoque un animal ayant perdu ses petits; le féminin français rend naturellement cette image sans ajouter qu’ils ont été tués ou volés.
- source_word: כְּסִיל
  choice: un insensé
  rationale: Terme sapientiel désignant une personne réfractaire à la sagesse, et non un simple manque d’intelligence.
- source_word: בְּאִוַּלְתּוֹ
  choice: en pleine folie
  rationale: La préposition situe l’insensé dans la manifestation de sa folie; « en pleine » transmet l’idée idiomatiquement sans préciser indûment s’il s’agit d’un acte particulier.
theological_decisions:
- issue: Portée de la comparaison
  choice: Conserver une maxime générale formulée par « Mieux vaut… que… »
  alternative: Traduire plus formellement par « Qu’une ourse… rencontre un homme, plutôt qu’un insensé… »
  rationale: L’hébreu oppose deux rencontres dangereuses et implique que celle de l’ourse est préférable. La formulation comparative explicite le sens proverbial sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, direct et proverbial. « Ourse » et « insensé » gardent une dignité littéraire accessible; aucun marqueur de note n’est nécessaire.
