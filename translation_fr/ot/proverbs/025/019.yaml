source:
  edition: WLC
  text: שֵׁ֣ן רֹ֭עָה וְ/רֶ֣גֶל מוּעָ֑דֶת מִבְטָ֥ח בּ֝וֹגֵ֗ד בְּ/י֣וֹם צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
translation:
  language: fr
  text: Comme une dent abîmée et un pied qui vacille, telle est la confiance placée en un homme déloyal au jour de la détresse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la confiance mise en un homme qui trahit ». Le « pied qui vacille » peut aussi se comprendre comme un pied qui glisse ou chancelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן רֹעָה
  choice: une dent abîmée
  rationale: L’expression désigne littéralement une « dent mauvaise », c’est-à-dire défectueuse et peu fiable. « Abîmée » conserve l’image concrète sans préciser indûment qu’elle est cariée ou cassée.
- source_word: רֶגֶל מוּעָדֶת
  choice: un pied qui vacille
  rationale: Le participe évoque un pied qui chancelle, glisse ou manque de stabilité. « Qui vacille » rend clairement l’idée d’un appui peu sûr tout en préservant l’image corporelle.
- source_word: מִבְטָח
  choice: la confiance placée
  rationale: Le nom exprime la confiance ou le fait de se fier à quelqu’un. L’ajout idiomatique de « placée » produit une formulation française naturelle sans modifier le sens.
- source_word: בּוֹגֵד
  choice: un homme infidèle
  rationale: Le participe masculin singulier désigne celui qui agit avec déloyauté ou trahison. « Homme infidèle » maintient la forme masculine représentative du texte et couvre ici l’idée de manque de fiabilité.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Cette formulation conserve la construction temporelle et le ton proverbial de l’hébreu. « Détresse » exprime une situation pressante où la fiabilité d’un appui est mise à l’épreuve.
theological_decisions:
- issue: Portée du masculin singulier בּוֹגֵד
  choice: un homme infidèle
  alternative: une personne infidèle / quelqu’un de déloyal
  rationale: La traduction conserve le masculin singulier de la source tout en lui laissant sa portée proverbiale et représentative; elle ne limite pas l’application du principe aux seuls hommes.
translation_notes:
  register: Français international moderne, clair et digne. La comparaison est explicitée par « telle est » afin d’éviter une phrase nominale lourde, tout en conservant l’ordre imagé de l’hébreu. Le vocabulaire reste concret et proverbial.
