id: PRO.25.8
reference: Proverbs 25:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תֵּצֵ֥א לָ/רִ֗ב מַ֫הֵ֥ר פֶּ֣ן מַה תַּ֭עֲשֶׂה בְּ/אַחֲרִיתָ֑/הּ בְּ/הַכְלִ֖ים אֹתְ/ךָ֣ רֵעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
translation:
  language: fr
  text: Ne te lance pas à la hâte dans un conflit[a] ; sinon, que feras-tu à la fin, quand ton prochain te fera honte ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une querelle » ; le terme hébreu peut aussi désigner une contestation portée en justice.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּצֵא לָרִיב
  choice: te lance pas ... dans un litige
  rationale: Littéralement « sortir pour un conflit ». En français naturel, « se lancer dans » conserve l’idée d’entreprendre une confrontation. « Litige » maintient la portée à la fois personnelle et potentiellement judiciaire de רִיב.
- source_word: מַהֵר
  choice: précipitamment
  rationale: Le terme exprime non seulement la rapidité, mais aussi l’imprudence avec laquelle on engage le conflit.
- source_word: פֶּן
  choice: sinon
  rationale: Introduit clairement l’issue indésirable contre laquelle porte l’avertissement, dans un français moderne et proverbial.
- source_word: בְּאַחֲרִיתָהּ
  choice: à la fin
  rationale: Désigne l’issue finale du litige, sans expliciter excessivement le référent féminin sous-entendu en hébreu.
- source_word: בְּהַכְלִים אֹתְךָ
  choice: lorsque ... t’aura couvert de honte
  rationale: Rend la circonstance temporelle marquée par בְּ et la dimension publique d’humiliation portée par כלם.
- source_word: רֵעֶךָ
  choice: ton prochain
  rationale: « Prochain » garde l’étendue sociale de רֵעַ sans supposer une relation amicale intime.
- source_word: מַה תַּעֲשֶׂה
  choice: que feras-tu ?
  rationale: Conserve directement la question rhétorique et l’ellipse de l’hébreu, au lieu d’ajouter explicitement « tu ne sauras pas quoi faire ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et proverbial. La question rhétorique finale préserve l’ellipse et l’ambiguïté de l’hébreu ; le point-virgule rend clairement l’enchaînement de l’avertissement.
