revisions:
- from: Ne te lance pas précipitamment dans un litige[a] ; sinon, que feras-tu à la fin, lorsque ton prochain t’aura couvert de honte ?
  to: Ne te lance pas à la hâte dans un conflit[a] ; sinon, que feras-tu à la fin, quand ton prochain te fera honte ?
  rationale: La révision remplace le terme juridiquement plus étroit « litige » par « conflit », qui respecte l'éventail sémantique de l'hébreu, et rend la mise à honte au futur simple. Elle conserve la question rhétorique finale et son ellipse, plutôt que d'expliciter « tu ne sauras pas quoi faire ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:29Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, notamment l'avertissement contre l'engagement hâtif dans un conflit et la question finale, qui conserve l'ellipse rhétorique de l'hébreu. Toutefois, « litige » tend en français à désigner un différend juridique et restreint donc la portée de רִיב, qui peut aussi être une querelle ou un conflit non judiciaire. « T’aura couvert de honte » introduit en outre une antériorité achevée que l'infinitif hébreu ne requiert pas.
  naturalness: La formulation est globalement idiomatique et d'un registre proverbial approprié. « Quand ton prochain te fera honte » est plus direct et plus naturel ici que le futur antérieur « lorsque ... t’aura couvert de honte », tout en rendant la circonstance temporelle.
  terminology: « Conflit » conserve mieux l'amplitude de רִיב que « litige », sans imposer un cadre exclusivement judiciaire. « Prochain » rend convenablement רֵעֶךָ dans un français soutenu mais moderne. « Faire honte » transmet clairement l'idée de mise à honte portée par כלם.
  issues:
  - severity: medium
    issue: « Litige » restreint potentiellement le sens de רִיב.
    rationale: Le mot français évoque principalement un différend juridique, tandis que l'hébreu peut viser aussi bien une querelle personnelle qu'une contestation judiciaire. « Conflit » maintient cette ambiguïté.
  - severity: low
    issue: Le futur antérieur « t’aura couvert de honte » est plus marqué que le texte source.
    rationale: La construction hébraïque situe la honte comme circonstance de l'issue, sans exiger qu'elle soit présentée comme déjà achevée. Un futur simple préserve mieux ce rapport temporel.
  revised_text: Ne te lance pas à la hâte dans un conflit[a] ; sinon, que feras-tu à la fin, quand ton prochain te fera honte ?
  revised_footnotes:
  - marker: a
    text: Ou « dans une querelle » ; le terme hébreu peut aussi désigner une contestation portée en justice.
    reason: alternative_reading
