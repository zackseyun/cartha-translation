  text: עִ֣יר פְּ֭רוּצָה אֵ֣ין חוֹמָ֑ה אִ֝֗ישׁ אֲשֶׁ֤ר אֵ֖ין מַעְצָ֣ר לְ/רוּחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/028.yaml
  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
translation:
  language: fr
  text: 'Une ville forcée, sans muraille : tel est l’homme qui ne maîtrise pas son esprit[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne maîtrise pas son tempérament » ou « qui ne sait pas se maîtriser ». L’hébreu dit « son esprit », expression qui peut désigner la disposition intérieure ou le tempérament.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: ville
  rationale: « Ville » est l’équivalent courant d’un centre habité et convient naturellement à l’image proverbiale.
- source_word: פְּרוּצָה
  choice: ouverte par une brèche
  rationale: Le terme, issu de פרץ, évoque une enceinte rompue ou forcée. Cette formulation conserve concrètement l’idée d’une défense percée.
- source_word: אֵין חוֹמָה
  choice: sans muraille
  rationale: Rend directement l’absence de mur défensif, dans une formulation française concise.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le masculin singulier hébreu a ici une portée représentative. « L’homme » conserve cette forme proverbiale sans limiter l’application du dicton.
- source_word: מַעְצָר
  choice: maîtrise
  rationale: Le nom désigne la retenue ou le contrôle. Dans la tournure verbale française « ne maîtrise pas », il exprime naturellement l’absence de retenue.
- source_word: לְרוּחוֹ
  choice: son esprit
  rationale: « Esprit » préserve l’étendue sémantique de רוּחַ, qui peut ici désigner la disposition intérieure, les impulsions ou le tempérament.
theological_decisions:
- issue: Langage masculin représentatif dans une maxime de sagesse
  choice: l’homme
  alternative: la personne; celui qui
  rationale: Le texte emploie אִישׁ au masculin singulier dans un énoncé proverbial de portée générale. La traduction garde cette forme sans lui attribuer une portée exclusivement masculine.
- issue: Sens anthropologique de רוּחַ
  choice: son esprit
  alternative: son tempérament; lui-même
  rationale: Le contexte vise la maîtrise des impulsions intérieures, mais le mot hébreu reste plus large que « colère » ou « tempérament ». Le texte principal conserve donc « esprit », tandis que la note signale les rendus interprétatifs possibles.
translation_notes:
  register: Français moderne, international et digne. La structure imagée du proverbe est conservée, avec une formulation claire pour un lectorat général. Le deux-points explicite la comparaison implicite sans en modifier le sens.
