source:
  edition: WLC
  text: ט֗וֹב שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מדונים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/024.yaml
  text: It is better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: fr
  text: Mieux vaut habiter sur un coin de toit qu’avec une femme querelleuse dans une maison partagée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’une femme querelleuse et une maison commune ». La dernière expression est concise en hébreu ; elle peut souligner le fait de partager le même foyer plutôt que l’agrément de la compagnie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette maxime comparative, l’adjectif prédicatif signifie idiomatiquement « mieux vaut » ; cette tournure est naturelle et concise en français.
- source_word: שֶׁבֶת
  choice: habiter
  rationale: Bien que le verbe puisse littéralement signifier « s’asseoir », le complément de lieu lui donne ici le sens de demeurer ou résider.
- source_word: עַל פִּנַּת גָּג
  choice: dans un coin du toit
  rationale: Cette formulation conserve l’image concrète d’un emplacement exigu et exposé sur un toit plat, sans l’expliciter dans le texte.
- source_word: מֵאֵשֶׁת
  choice: qu’avec une… femme
  rationale: La préposition מִן marque la comparaison après טוֹב ; le français naturel restructure la proposition avec « qu’avec ».
- source_word: מִדְיָנִים
  choice: querelleuse
  rationale: Le pluriel abstrait désignant les querelles ou disputes qualifie ici la femme et évoque une disposition habituelle au conflit.
- source_word: וּבֵית חָבֶר
  choice: dans une maison partagée
  rationale: La formule hébraïque est très concise et peut évoquer une maison commune, l’association ou la cohabitation. « Maison partagée » rend le sens pratique tout en laissant la note signaler l’ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale concise « Mieux vaut… que… » est conservée, ainsi que l’image du toit. La formulation genrée reflète explicitement le texte hébreu sans généralisation ni atténuation.
