id: PRO.25.21
reference: Proverbs 25:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם רָעֵ֣ב שֹׂ֭נַאֲ/ךָ הַאֲכִלֵ֣/הוּ לָ֑חֶם וְ/אִם צָ֝מֵ֗א הַשְׁקֵ֥/הוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/021.yaml
  text: If your enemy is hungry[a], feed him bread, and if he is thirsty, give him water to drink.
translation:
  language: fr
  text: Si celui qui te déteste[a] a faim, donne-lui du pain à manger ; s’il a soif, donne-lui de l’eau à boire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton ennemi ». Littéralement : « celui qui te hait ».'
    reason: Alternative lexicale et précision sur la forme participiale hébraïque.
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: La particule introduit directement une condition ; « si » conserve cette valeur sans la rendre plus attendue par « quand ».
- source_word: רָעֵב
  choice: a faim
  rationale: Formulation française naturelle pour l’adjectif prédicatif décrivant son état, sans intensification indue.
- source_word: שֹׂנַאֲךָ
  choice: celui qui te déteste
  rationale: Le participe avec suffixe signifie littéralement « celui qui te hait/déteste ». Cette formulation préserve plus directement la valeur verbale et l’ambiguïté relationnelle du terme qu’« ennemi ».
- source_word: הַאֲכִלֵהוּ
  choice: donne-lui … à manger
  rationale: L’impératif causatif signifie « fais-le manger / nourris-le ». Avec l’objet concret « pain », cette tournure est naturelle en français.
- source_word: לָחֶם
  choice: du pain
  rationale: Conserve l’image concrète du terme hébreu plutôt que de l’élargir à « nourriture ».
- source_word: וְאִם
  choice: s’il
  rationale: Le second membre conditionnel reste parallèle au premier ; l’omission de « et » est idiomatique en français sans effacer la coordination poétique.
- source_word: צָמֵא
  choice: a soif
  rationale: Équivalent français courant et exact de l’adjectif prédicatif.
- source_word: הַשְׁקֵהוּ
  choice: donne-lui … à boire
  rationale: Rend naturellement l’impératif causatif « fais-le boire / donne-lui à boire ».
- source_word: מָיִם
  choice: de l’eau
  rationale: Reproduit explicitement l’objet concret du texte hébreu.
theological_decisions:
- issue: Genre grammatical masculin singulier à portée représentative
  choice: 'Conserver le singulier masculin : « celui qui te déteste… donne-lui… s’il… »'
  alternative: Employer une formulation plurielle ou épicène pour neutraliser le genre.
  rationale: L’hébreu emploie des formes masculines singulières à portée proverbiale générale. Le français masculin singulier préserve la forme source et l’adresse morale individualisée sans limiter nécessairement l’application aux hommes.
- issue: Rapport entre haine personnelle et inimitié
  choice: Traduire littéralement par « celui qui te déteste » et signaler « ton ennemi » en note.
  alternative: Traduire directement par « ton ennemi ».
  rationale: Le participe de שׂנא désigne d’abord celui qui hait. Garder cette formulation évite de résoudre silencieusement le rapport possible entre disposition hostile et statut d’ennemi.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond à l’adresse hébraïque. Le parallélisme faim/soif et pain/eau est conservé ; la seconde coordination est légèrement allégée pour une syntaxe française naturelle.
