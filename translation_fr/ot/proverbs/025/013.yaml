source:
  edition: WLC
  text: כְּ/צִנַּת שֶׁ֨לֶג בְּ/י֬וֹם קָצִ֗יר צִ֣יר נֶ֭אֱמָן לְ/שֹׁלְחָ֑י/ו וְ/נֶ֖פֶשׁ אֲדֹנָ֣י/ו יָשִֽׁיב־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
translation:
  language: fr
  text: Comme la fraîcheur de la neige un jour de moisson[a], tel est un messager fidèle pour ceux qui l’envoient, et il redonne vigueur à ses maîtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comme le froid de la neige au temps de la moisson ». L’image évoque vraisemblablement la fraîcheur bienfaisante associée à la neige, et non une chute de neige qui endommagerait la récolte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il restaure l’âme de ses maîtres » ; on peut aussi comprendre : « il leur redonne vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת
  choice: Comme la fraîcheur de
  rationale: צִנָּה désigne le froid ou la fraîcheur. « Fraîcheur » exprime naturellement ici l’effet bienfaisant de l’image, sans suggérer un froid pénible.
- source_word: שֶׁלֶג
  choice: la neige
  rationale: Équivalent direct de שֶׁלֶג.
- source_word: בְּיוֹם קָצִיר
  choice: un jour de moisson
  rationale: Cette formulation conserve l’image concrète du texte hébreu et reste naturelle en français moderne.
- source_word: צִיר נֶאֱמָן
  choice: un messager fidèle
  rationale: צִיר désigne ici une personne chargée d’un message, et נֶאֱמָן souligne qu’elle est digne de confiance. « Messager fidèle » préserve à la fois la fonction et la qualité morale.
- source_word: לְשֹׁלְחָיו
  choice: pour ceux qui l’envoient
  rationale: 'Le participe est au pluriel avec un suffixe masculin singulier : littéralement, « pour ses envoyeurs ». La formulation retenue conserve ce pluriel dans un français idiomatique.'
- source_word: וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב
  choice: car il redonne vigueur à ses maîtres
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne, tandis que le hiphil de שׁוב signifie faire revenir ou restaurer. « Redonner vigueur » rend l’idée de restauration intérieure et prolonge naturellement l’image rafraîchissante.
- source_word: אֲדֹנָיו
  choice: ses maîtres
  rationale: La forme hébraïque est plurielle. « Maîtres » la respecte sans préciser indûment une relation de propriété ou d’esclavage.
