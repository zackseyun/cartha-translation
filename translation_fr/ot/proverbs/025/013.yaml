translation_notes:
  register: Français international moderne, clair et digne. La tournure corrélative « Comme…, tel est… » restitue explicitement la comparaison hébraïque. « Car » rend la valeur explicative probable de la dernière proposition, bien que l’hébreu emploie simplement la coordination.
