  text: מַעְיָ֣ן נִ֭רְפָּשׂ וּ/מָק֣וֹר מָשְׁחָ֑ת צַ֝דִּ֗יק מָ֣ט לִ/פְנֵֽי רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/026.yaml
  text: Like a muddied spring and a polluted fountain is a righteous man who gives way before the wicked[a].
translation:
  language: fr
  text: 'Une source troublée et une fontaine polluée : tel est le juste qui cède devant le méchant[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une source rendue boueuse et une fontaine corrompue : tel est le juste qui chancelle devant le méchant. » Le premier terme peut évoquer une eau troublée, possiblement par piétinement.'
    reason: Alternative lexicale pour נִרְפָּשׂ, מָשְׁחָת et מָט; la précision sur le piétinement préserve son caractère interprétatif.
lexical_decisions:
- source_word: מַעְיָן
  choice: source
  rationale: Le terme désigne une source naturelle. « Source » est courant en français et convient au parallélisme avec מָקוֹר.
- source_word: נִרְפָּשׂ
  choice: rendue boueuse
  rationale: Le participe passif évoque une eau troublée ou salie, vraisemblablement parce qu’on l’a remuée ou piétinée. « Rendue boueuse » exprime clairement à la fois l’état résultant et l’intervention extérieure.
- source_word: מָקוֹר
  choice: fontaine
  rationale: Employé en parallèle avec מַעְיָן, ce mot désigne un point d’où jaillit l’eau. « Fontaine » maintient en français la légère variation poétique entre les deux membres.
- source_word: מָשְׁחָת
  choice: polluée
  rationale: Le nom exprime la corruption, la détérioration ou la ruine. Appliqué à une source d’eau, « polluée » rend naturellement l’idée de contamination.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier est substantivé. « Le juste » est une formulation française naturelle, fidèle au genre grammatical et à la portée représentative du proverbe.
- source_word: מָט
  choice: cède
  rationale: Le verbe peut signifier chanceler, glisser, vaciller ou céder. Dans la relation marquée par לִפְנֵי רָשָׁע, « cède » exprime naturellement une défaillance morale ou sociale devant le méchant, sans effacer dans la note le sens concret possible de vacillement.
- source_word: לִפְנֵי
  choice: devant
  rationale: Cette préposition signifie « devant » ou « en présence de ». Ici, elle indique face à qui le juste cède.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif masculin singulier est substantivé et représente un type de personne. « Le méchant » conserve cette forme singulière proverbiale.
theological_decisions:
- issue: Genre et portée de צַדִּיק
  choice: le juste
  alternative: une personne juste
  rationale: L’hébreu est au masculin singulier et s’emploie de façon proverbiale et représentative. « Le juste » respecte cette forme sans restreindre nécessairement l’application du proverbe aux seuls hommes.
- issue: Nature de la défaillance exprimée par מָט
  choice: cède
  alternative: chancelle
  rationale: Le contexte permet une lecture morale ou sociale, celle d’un juste qui se laisse dominer par un méchant, mais le verbe conserve aussi une image de vacillement. Le texte principal retient l’expression idiomatique « cède », tandis que la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, concis et proverbial. La structure nominale en deux images suivie de « tel est » reproduit le mouvement de l’hébreu tout en restant naturelle. Le registre est digne sans archaïsme.
