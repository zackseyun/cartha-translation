  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
translation:
  language: fr
  text: Comme un anneau d’or et une parure d’or fin, ainsi est un sage qui reprend pour une oreille attentive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme un anneau d’or et un bijou d’or fin, ainsi est un sage qui reprend pour une oreille qui écoute. » Les termes hébreux désignant les bijoux sont assez généraux, et la dernière expression souligne une écoute réceptive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  choice: anneau
  rationale: Le terme désigne un bijou en forme d’anneau, porté notamment au nez ou à l’oreille. « Anneau » conserve l’image sans préciser un emplacement que le verset ne donne pas.
- source_word: זָהָב
  choice: or
  rationale: Désignation directe du matériau de l’anneau.
- source_word: וַחֲלִי
  choice: et une parure
  rationale: חֲלִי désigne assez généralement une parure ou un bijou. « Parure » reste naturel en français et évite de préciser sans certitude qu’il s’agit d’un collier.
- source_word: כָתֶם
  choice: or fin
  rationale: Le mot évoque un or précieux, raffiné ou de grande qualité. « Or fin » rend cette valeur dans un registre proverbial digne.
- source_word: מוֹכִיחַ
  choice: celui qui reprend
  rationale: Le participe désigne une personne qui adresse une réprimande ou une correction. Cette tournure est plus naturelle en français moderne que le substantif rare « censeur » et garde le caractère personnel de l’hébreu.
- source_word: חָכָם
  choice: avec sagesse
  rationale: L’hébreu qualifie littéralement la personne qui reprend de « sage ». La formulation adverbiale française exprime ici naturellement que la personne comme sa réprimande sont marquées par la sagesse.
- source_word: עַל
  choice: pour
  rationale: Dans cette comparaison, la préposition marque le rapport entre celui qui reprend et l’oreille réceptive. « Pour » produit une comparaison française naturelle sans imposer le sens spatial littéral « sur ».
- source_word: אֹזֶן שֹׁמָעַת
  choice: une oreille attentive
  rationale: L’expression signifie littéralement « une oreille qui écoute/entend » et évoque une écoute réceptive. « Oreille attentive » conserve la métaphore tout en exprimant cette disponibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative et l’imagerie concrète du proverbe sont conservées, avec une formulation accessible et sans surinterprétation de la nature exacte des bijoux.
