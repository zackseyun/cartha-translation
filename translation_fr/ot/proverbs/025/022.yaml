translation:
  language: fr
  text: car tu amasses des braises sur sa tête[a], et le Seigneur te récompensera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ramasses des braises sur sa tête ». L’image hébraïque est conservée ; les interprètes divergent quant à son sens : elle peut évoquer la honte qui conduit un ennemi au repentir ou l’aggravation de son jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le Seigneur te rendra ce qui t’est dû » ou « te rétribuera ». Le verbe hébreu peut désigner le fait de rendre ou de rétribuer ; le contexte indique ici une rétribution favorable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’exhortation du verset précédent et maintient clairement le lien explicatif.
- source_word: גֶחָלִים
  choice: des braises
  rationale: Désigne des charbons ardents; « braises » exprime naturellement en français l’idée de charbons encore incandescents.
- source_word: חֹתֶה
  choice: tu amasses
  rationale: Le verbe évoque l’action de prendre, ramasser ou rassembler des charbons. « Amasses » conserve l’image de leur accumulation sur la tête sans l’interpréter.
- source_word: עַל רֹאשׁוֹ
  choice: sur sa tête
  rationale: Rendu direct de la locution hébraïque, dont l’image est volontairement préservée.
- source_word: וַיהוָה
  choice: le Seigneur
  rationale: Rend le nom divin יהוה selon la convention française courante, dans une formulation digne et accessible.
- source_word: יְשַׁלֶּם לָךְ
  choice: te le rendra
  rationale: Le verbe exprime l’idée de rendre, rétribuer ou récompenser. Dans ce contexte favorable, « te le rendra » reste proche de l’hébreu tout en demeurant naturel.
theological_decisions:
- issue: Sens des « braises sur sa tête »
  choice: Conserver la métaphore sans en fixer le sens dans le texte principal.
  alternative: L’expliciter soit comme une honte conduisant l’ennemi au repentir, soit comme un accroissement de son jugement.
  rationale: L’hébreu énonce l’image sans expliquer son effet; la traduction préserve donc son ambiguïté et la tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore concrète de l’hébreu est maintenue, ainsi que le lien avec le verset précédent. « Seigneur » porte une majuscule sans recourir aux petites capitales, peu adaptées au texte brut.
