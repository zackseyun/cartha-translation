  source_fidelity: 'Le texte conserve exactement la structure proverbiale et l’image de l’hébreu : une triade d’armes destructrices suivie de son application à l’individu qui témoigne faussement contre son prochain. « Massue » rend adéquatement מֵפִיץ, arme de frappe ; « épée » et « flèche acérée » correspondent directement à חֶרֶב et חֵץ שָׁנוּן. « Porte un faux témoignage contre son prochain » exprime avec justesse la valeur judiciaire de עֹנֶה ... עֵד שָׁקֶר, sans forcer une distinction non nécessaire entre « faux témoin » et « faux témoignage ».'
