  text: מֵפִ֣יץ וְ֭/חֶרֶב וְ/חֵ֣ץ שָׁנ֑וּן אִ֥ישׁ עֹנֶ֥ה בְ֝/רֵעֵ֗/הוּ עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
translation:
  language: fr
  text: 'Une massue, une épée et une flèche acérée : tel est l’homme qui porte un faux témoignage contre son prochain.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפִיץ
  choice: massue
  rationale: Le nom désigne une arme servant à fracasser. « Massue » est concret, courant et convient à la série d’armes.
- source_word: חֶרֶב
  choice: épée
  rationale: Équivalent français usuel du terme hébreu commun désignant l’épée.
- source_word: חֵץ שָׁנוּן
  choice: flèche acérée
  rationale: שָׁנוּן signifie « aiguisée, acérée ». Cette formulation conserve l’image concrète et la force poétique de la triade.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le masculin singulier hébreu présente ici un individu représentatif. La tournure « tel est l’homme » reste naturelle dans le registre proverbial.
- source_word: עֹנֶה
  choice: porte
  rationale: Bien que le participe signifie littéralement « répond », l’expression associée à עֵד שָׁקֶר relève du témoignage judiciaire. « Porter un témoignage » exprime naturellement ce sens en français.
- source_word: בְרֵעֵהוּ
  choice: contre son prochain
  rationale: Dans ce contexte judiciaire, la préposition a un sens adversatif. « Prochain » conserve la portée relationnelle et éthique de רֵעַ.
- source_word: עֵד שָׁקֶר
  choice: un faux témoignage
  rationale: La construction peut littéralement désigner un « témoin mensonger », mais avec עֹנֶה elle exprime l’acte de déposer faussement. « Faux témoignage » donne en français un sens juridique clair sans modifier l’image principale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Les trois armes sont maintenues dans leur ordre, puis identifiées au faux témoin par la tournure explicative « tel est ». Aucun marqueur de note n’est requis.
