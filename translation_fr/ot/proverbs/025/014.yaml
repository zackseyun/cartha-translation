  yaml_path: translation/ot/proverbs/025/014.yaml
  text: Like clouds and wind without rain is a man who boasts of a false gift[a].
translation:
  language: fr
  text: Comme des nuages et du vent sans pluie, tel est l’homme qui se vante d’un cadeau qu’il ne donne pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « d’un cadeau mensonger » ; ou « d’un don trompeur ».'
    reason: La formule hébraïque concise associe le don au mensonge; le texte explicite le sens contextuel probable d’un cadeau vanté mais non donné.
lexical_decisions:
- source_word: נְשִׂיאִים
  choice: nuages
  rationale: Dans cette image météorologique, le nom désigne des formations célestes qui font espérer la pluie; « nuages » est l’équivalent français le plus naturel.
- source_word: רוּחַ
  choice: vent
  rationale: Associé aux nuages et à la pluie, le mot a clairement ici son sens météorologique.
- source_word: גֶשֶׁם
  choice: pluie
  rationale: Sens courant et contextuel du terme dans cette comparaison météorologique.
- source_word: אָיִן
  choice: sans
  rationale: « Sans pluie » exprime naturellement et avec concision l’absence formulée en hébreu.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le masculin singulier représentatif de l’hébreu est conservé dans la formulation proverbiale.
- source_word: מִתְהַלֵּל
  choice: se vante
  rationale: La forme réfléchie du verbe exprime ici l’autoglorification; « se vante » est naturel, moderne et digne.
- source_word: בְּמַתַּת
  choice: d’un cadeau
  rationale: La préposition introduit le contenu ou l’objet de la vantardise; « se vanter de » est l’expression idiomatique française.
- source_word: שָׁקֶר
  choice: mensonger
  rationale: Le qualificatif dénonce un cadeau faux ou trompeur, probablement promis mais non donné; « mensonger » préserve la concision et souligne la tromperie sans expliciter davantage que l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La structure comparative « Comme…, tel est… » conserve le parallélisme de l’hébreu. « Cadeau mensonger » maintient l’ambiguïté entre un don frauduleux et un don promis mais jamais remis; la note donne l’interprétation contextuelle la plus courante.
