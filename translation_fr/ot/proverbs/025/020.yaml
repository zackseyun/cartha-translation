language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַ֥עֲדֶה בֶּ֨גֶד בְּ/י֣וֹם קָ֭רָה חֹ֣מֶץ עַל נָ֑תֶר וְ/שָׁ֥ר בַּ֝/שִּׁרִ֗ים עַ֣ל לֶב רָֽע׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/020.yaml
  text: Like one who takes off a garment on a cold day[a], and like vinegar on soda[b], is one who sings songs to a troubled heart.
translation:
  language: fr
  text: Celui qui chante des chansons à un cœur en peine[b] est comme quelqu’un qui enlève un vêtement par temps froid, et comme du vinaigre sur du natron[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le natron est un alcali minéral. Le vinaigre provoque à son contact une réaction vive et perturbatrice.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à/sur un cœur mauvais ». Ici, « mauvais » semble désigner un cœur affligé ou malheureux, sans impliquer nécessairement une faute morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲדֶה
  choice: quelqu’un qui enlève
  rationale: Le participe désigne ici l’action d’ôter un vêtement. « Enlève » est courant et garde l’image concrète d’une chaleur protectrice retirée au mauvais moment.
- source_word: בֶּגֶד
  choice: un vêtement
  rationale: Terme général qui évite de préciser sans fondement qu’il s’agit d’un manteau.
- source_word: בְּיוֹם קָרָה
  choice: par temps froid
  rationale: Formulation française naturelle qui restitue la circonstance temporelle et l’incongruité du geste.
- source_word: חֹמֶץ
  choice: du vinaigre
  rationale: Équivalent français direct et usuel.
- source_word: נָתֶר
  choice: du natron
  rationale: Le mot désigne un alcali minéral ancien. « Natron » est plus exact que « bicarbonate de soude » ou « soude », qui risqueraient d’évoquer des produits modernes précis; une note l’explique.
- source_word: וְשָׁר בַּשִּׁרִים
  choice: celui qui chante des chansons
  rationale: Conserve le participe et le pluriel hébreu tout en restant idiomatique en français.
- source_word: עַל לֶב רָע
  choice: à un cœur en peine
  rationale: Littéralement « sur/à un cœur mauvais ». Dans ce contexte, רַע décrit vraisemblablement un état intérieur douloureux plutôt qu’une faute morale. « Cœur en peine » exprime naturellement la détresse sans effacer l’image du cœur.
theological_decisions:
- issue: Sens moral ou affectif de לֶב רָע
  choice: cœur en peine
  alternative: cœur mauvais
  rationale: Les comparaisons dénoncent une réaction inadaptée à la souffrance; le sens affectif convient donc mieux au contexte. La note conserve le sens littéral et signale l’ambiguïté lexicale.
translation_notes:
  register: Français international actuel, sobre et proverbial. La proposition principale a été placée en tête pour éviter en français la lourdeur de « ainsi est celui qui… ». Les deux comparaisons sont reliées par « et comme », conformément à la série hébraïque. Tous les marqueurs de notes figurent dans le texte.
