  variant: modern international French
source:
  edition: WLC
  text: פֶּֽן יְחַסֶּדְ/ךָ֥ שֹׁמֵ֑עַ וְ֝/דִבָּתְ/ךָ֗ לֹ֣א תָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/010.yaml
  text: lest one who hears it disgrace you[b][a], and your bad reputation not turn back.
translation:
  language: fr
  text: de peur que celui qui entend cela ne te couvre de honte[a], et que le mauvais bruit qui court sur toi ne s’efface plus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne te fasse des reproches » ou « ne te déshonore ». Le verbe hébreu employé ici est rare et son sens précis est difficile à déterminer dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et que le mauvais rapport à ton sujet ne revienne pas ». L’hébreu peut évoquer soit des propos défavorables qui continuent à circuler, soit un déshonneur devenu irréversible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que
  rationale: Introduit naturellement en français une conséquence indésirable à éviter, tout en conservant la forme d’avertissement du proverbe.
- source_word: יְחַסֶּדְךָ
  choice: ne te couvre de honte
  rationale: Le verbe, rare et difficile dans ce contexte, paraît exprimer une humiliation ou un reproche public. Cette formulation française reste naturelle sans en préciser excessivement la nuance.
- source_word: שֹׁמֵעַ
  choice: celui qui entend cela
  rationale: Le participe substantivé désigne une personne indéfinie qui entend la divulgation évoquée au verset précédent. « Cela » explicite sobrement le complément implicite.
- source_word: דִבָּתְךָ
  choice: le mauvais bruit qui court sur toi
  rationale: דִּבָּה désigne souvent des propos défavorables, un rapport malveillant ou une rumeur. Cette expression idiomatique conserve à la fois l’idée de propos négatifs et leur circulation publique.
- source_word: לֹא תָשׁוּב
  choice: ne s’efface plus
  rationale: שׁוב signifie littéralement revenir ou faire demi-tour. Appliqué au mauvais bruit, « ne s’efface plus » exprime naturellement en français le caractère durable ou irréversible du dommage, tandis qu’une note conserve l’image plus littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. « Le mauvais bruit qui court sur toi » rend de façon idiomatique la dimension publique de דִּבָּה, et « ne s’efface plus » évite la tournure peu naturelle « ne revient pas » tout en signalant celle-ci en note.
