  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
translation:
  language: fr
  text: Mets rarement les pieds chez ton prochain[a][b], de peur qu’il n’en ait assez de toi et ne te prenne en haine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Rends ton pied rare de la maison de ton prochain. » Cette expression signifie qu’il faut espacer ses visites.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chez ton ami » ou « chez ton compagnon » ; le mot hébreu peut avoir ces différents sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר רַגְלְךָ
  choice: Mets rarement les pieds
  rationale: L’impératif hiphil de יקר signifie ici littéralement « rends ton pied rare ». La tournure française exprime naturellement l’idée d’espacer ses visites tout en conservant l’image concrète des pieds.
- source_word: מִבֵּית
  choice: chez
  rationale: Bien que מִן signifie littéralement « loin de / depuis », l’expression idiomatique vise la fréquentation de la maison; « chez » est la formulation française la plus naturelle.
- source_word: רֵעֶךָ
  choice: ton prochain
  rationale: רֵעַ peut désigner un prochain, un ami ou un compagnon. « Prochain » conserve la portée sociale assez large du terme sans présumer une amitié intime.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française rend clairement l’avertissement introduit par פֶּן et convient au style proverbial.
- source_word: יִשְׂבָּעֲךָ
  choice: il ne se lasse de toi
  rationale: Le verbe שבע évoque littéralement le fait d’être rassasié ou repu. Dans ce contexte, il s’agit d’être saturé de la présence de quelqu’un; « se lasser de toi » en donne le sens naturel en français, tandis qu’une note préserve l’image hébraïque.
- source_word: וּשְׂנֵאֶךָ
  choice: et ne te prenne en haine
  rationale: Cette formulation conserve sans l’atténuer le sens fort de שנא et présente la haine comme l’aboutissement redouté de visites excessives.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Mets rarement les pieds chez » restitue l’image hébraïque dans une tournure immédiatement compréhensible. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne du masculin singulier.
