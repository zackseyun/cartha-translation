source:
  edition: WLC
  text: תַּפּוּחֵ֣י זָ֭הָב בְּ/מַשְׂכִּיּ֥וֹת כָּ֑סֶף דָּ֝בָ֗ר דָּבֻ֥ר עַל אָפְנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
translation:
  language: fr
  text: Comme des pommes d’or dans des ornements d’argent, telle est une parole dite à propos[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dite au bon moment »; littéralement, « dite sur ses roues », expression qui évoque probablement une parole adaptée aux circonstances ou prononcée au moment opportun.
    reason: lexical_alternative
  - marker: b
    text: Le fruit précisément désigné par le mot hébreu ne correspondait peut-être pas exactement à la pomme moderne.
    reason: cultural_note
  - marker: c
    text: Ou « dans des ciselures d’argent », « dans des montures d’argent » ou « dans un filigrane d’argent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי
  choice: pommes
  rationale: Le nom désigne traditionnellement des « pommes », mais l’identification exacte du fruit ancien demeure incertaine; le choix conserve l’image concrète et familière.
- source_word: זָהָב
  choice: or
  rationale: Équivalent direct du terme hébreu désignant l’or.
- source_word: בְּמַשְׂכִּיּוֹת
  choice: dans des ornements
  rationale: Le terme rare évoque un ouvrage décoratif ou figuré. « Ornements » reste naturel tout en évitant de préciser indûment s’il s’agit de montures, de ciselures ou de filigranes.
- source_word: כָּסֶף
  choice: argent
  rationale: Équivalent direct du matériau désigné.
- source_word: דָּבָר דָּבֻר
  choice: une parole dite
  rationale: Cette formulation reproduit sobrement le substantif « parole » suivi de la forme passive « dite ».
- source_word: עַל אָפְנָיו
  choice: à propos
  rationale: L’expression, littéralement liée aux « roues », est obscure et idiomatique. « À propos » rend l’idée d’une parole adaptée aux circonstances sans la limiter exclusivement au moment opportun.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. L’ordre comparatif de l’hébreu est conservé. « Telle est » assure une syntaxe française digne et claire; les notes maintiennent les incertitudes concernant le fruit, l’ouvrage d’argent et l’expression idiomatique finale.
