  text: בְּ/אֹ֣רֶךְ אַ֭פַּיִם יְפֻתֶּ֣ה קָצִ֑ין וְ/לָשׁ֥וֹן רַ֝כָּ֗ה תִּשְׁבָּר גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/015.yaml
  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
translation:
  language: fr
  text: Par la patience, on peut persuader un dirigeant, et une langue douce brise un os.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une langue douce brise un os » — image de la puissance de paroles douces pour vaincre la dureté ou la résistance.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  choice: Par la patience
  rationale: L’expression hébraïque signifie littéralement « par la longueur des narines/de la colère » et désigne la lenteur à se mettre en colère, la patience ou la maîtrise de soi. « Par la patience » est naturel et concis en français.
- source_word: יְפֻתֶּה
  choice: on peut persuader
  rationale: Le pual de פתה exprime ici le fait d’être amené à céder ou d’être gagné. La tournure française rend la valeur passive et la portée générale du proverbe sans suggérer nécessairement la tromperie.
- source_word: קָצִין
  choice: un dirigeant
  rationale: Le terme désigne une personne investie d’autorité, qu’il s’agisse d’un chef, d’un responsable ou d’un gouvernant. « Dirigeant » convient à la portée générale du proverbe.
- source_word: לָשׁוֹן רַכָּה
  choice: une langue douce
  rationale: La traduction conserve l’image concrète de la langue tout en évoquant naturellement des paroles empreintes de douceur.
- source_word: תִּשְׁבָּר גָּרֶם
  choice: brise les os
  rationale: 'Cette formulation préserve le paradoxe saisissant de l’hébreu : une parole douce peut vaincre une résistance apparemment très dure. Le singulier collectif hébreu peut être rendu idiomatiquement par le pluriel français.'
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La structure antithétique et l’image paradoxale de l’original sont conservées; « langue douce » reste volontairement concret plutôt que d’expliciter « paroles douces ».
