source:
  edition: WLC
  text: הָג֣וֹ סִיגִ֣ים מִ/כָּ֑סֶף וַ/יֵּצֵ֖א לַ/צֹּרֵ֣ף כֶּֽלִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/004.yaml
  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
translation:
  language: fr
  text: 'Ôte les scories de l’argent,

    et il en sortira un objet pour l’affineur.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’orfèvre ». Le terme hébreu désigne un artisan qui affine ou travaille les métaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Ôte
  rationale: L’impératif exprime l’action d’enlever ou d’écarter. Le singulier français convient au ton direct et proverbial du contexte.
- source_word: סִיגִים
  choice: les scories
  rationale: Le terme désigne les matières impures séparées du métal lors de l’affinage. « Scories » restitue précisément l’image métallurgique en français courant.
- source_word: מִכָּסֶף
  choice: de l’argent
  rationale: 'La préposition marque la séparation : les scories sont retirées de l’argent.'
- source_word: וַיֵּצֵא
  choice: et il en sortira
  rationale: La forme verbale indique ici le résultat de l’action dans une séquence proverbiale. Le futur français rend naturellement cette conséquence.
- source_word: לַצֹּרֵף
  choice: pour l’orfèvre
  rationale: צֹרֵף désigne l’artisan qui affine ou travaille le métal. « Orfèvre » est naturel avec l’argent, tout en gardant une note sur le sens plus directement lié à l’affinage.
- source_word: כֶּלִי
  choice: un objet
  rationale: כְּלִי est un terme large pouvant désigner un objet, un ustensile ou un récipient. « Objet » préserve cette ouverture sans imposer la forme d’un vase.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et proverbial. L’image concrète de l’affinage est conservée, tandis que « objet » maintient l’étendue sémantique de כְּלִי. Le marqueur de note est placé après « orfèvre », terme directement concerné.
