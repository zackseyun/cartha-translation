  text: הָג֣וֹ רָ֭שָׁע לִ/פְנֵי מֶ֑לֶךְ וְ/יִכּ֖וֹן בַּ/צֶּ֣דֶק כִּסְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/005.yaml
  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
translation:
  language: fr
  text: Éloigne le méchant de la présence du roi, et son trône sera affermi dans la justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Éloigne
  rationale: L’impératif qal exprime ici l’action d’ôter ou d’écarter, dans le prolongement de l’image du verset 4. « Éloigne » est naturel en français et convient à l’idée d’écarter une influence mauvaise de la cour.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé au singulier désigne une personne méchante comme type. « Le méchant » conserve le singulier et le caractère proverbial sans ajouter explicitement « homme ».
- source_word: לִפְנֵי
  choice: de la présence de
  rationale: L’expression signifie idiomatiquement retirer quelqu’un de devant une personne, donc de sa présence. Cette formulation restitue clairement le cadre de la cour royale.
- source_word: מֶלֶךְ
  choice: du roi
  rationale: L’article défini convient au caractère générique de la maxime en français et maintient le lien direct avec « son trône ».
- source_word: וְיִכּוֹן
  choice: sera affermi
  rationale: Le niphal de כון exprime l’établissement ou la consolidation. « Sera affermi » rend la valeur passive et l’idée de stabilité du trône.
- source_word: בַּצֶּדֶק
  choice: dans la justice
  rationale: צֶדֶק associe rectitude morale et justice judiciaire. « Dans la justice » convient particulièrement au contexte royal, tandis que la note conserve l’ambiguïté possible du beth, qui peut aussi indiquer le moyen.
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: Le suffixe masculin singulier renvoie naturellement au roi.
theological_decisions:
- issue: Valeur de la préposition ב dans בַּצֶּדֶק
  choice: dans la justice
  alternative: par la justice
  rationale: L’hébreu permet de comprendre la justice comme la sphère dans laquelle le trône est affermi ou comme le moyen par lequel il l’est. Le texte principal retient la formulation française la plus naturelle, et la note signale l’autre lecture.
translation_notes:
  register: Français moderne, digne et proverbial. Le parallélisme causal est conservé, ainsi que le singulier générique « le méchant ». La note maintient l’ambiguïté instrumentale ou locative de la préposition hébraïque.
