id: PRO.25.6
reference: Proverbs 25:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/006.yaml
  text: Do not exalt yourself before a king[a], and do not stand in the place of great men.
translation:
  language: fr
  text: Ne te mets pas en avant devant un roi, et ne te tiens pas à la place des grands[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne prends pas place parmi les grands ». Littéralement : « dans le lieu des grands ».'
    reason: L’hébreu emploie « lieu/place » et peut désigner soit une place réservée aux personnes éminentes, soit, par extension, la prétention à se joindre à elles.
lexical_decisions:
- source_word: תִּתְהַדַּר
  choice: te mets pas en avant
  rationale: Le hitpael de הדר exprime ici le fait de chercher soi-même à paraître honoré ou important. « Ne te mets pas en avant » rend naturellement en français l’idée de promotion de soi dans un cadre royal.
- source_word: לִפְנֵי מֶלֶךְ
  choice: devant un roi
  rationale: לִפְנֵי signifie couramment « devant » ou « en présence de ». La formulation retenue est concise et conserve la scène de cour.
- source_word: בִּמְקוֹם גְּדֹלִים
  choice: parmi les grands
  rationale: L’expression désigne la place occupée par des personnes socialement élevées. « Parmi les grands » est idiomatique et préserve l’idée de rang sans imposer un titre précis comme « nobles ».
- source_word: תַּעֲמֹד
  choice: prends pas place
  rationale: עמד signifie littéralement « se tenir debout », mais, avec מָקוֹם, il évoque ici le fait de se placer ou d’occuper une position. « Ne prends pas place » restitue clairement cette valeur contextuelle.
theological_decisions:
- issue: Portée de גְּדֹלִים, masculin pluriel
  choice: les grands
  alternative: les personnages importants
  rationale: Le masculin pluriel hébreu désigne des personnes de rang élevé. Le français « les grands » conserve cette forme et cette nuance sociale sans affirmer que l’enseignement ne viserait que des hommes.
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme des deux interdictions est conservé, tandis que les formulations idiomatiques évitent un calque obscur.
