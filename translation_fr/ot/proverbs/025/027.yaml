  yaml_path: translation/ot/proverbs/025/027.yaml
  text: To eat much honey is not good[a], and to search out their glory is glory.
translation:
  language: fr
  text: Manger beaucoup de miel n’est pas bon, et sonder leur gloire est une gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « et sonder leur gloire est une gloire ». La seconde partie du verset est difficile. Elle pourrait signifier que rechercher sa propre gloire n’est pas glorieux, ou qu’examiner des questions importantes est honorable. Le texte massorétique est rendu ici au plus près.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֹל
  choice: Manger
  rationale: L’infinitif construit a ici une valeur substantivale et proverbiale; l’infinitif français conserve cette portée générale.
- source_word: דְּבַשׁ
  choice: miel
  rationale: Sens lexical direct, qui préserve l’image concrète du proverbe.
- source_word: הַרְבּוֹת
  choice: beaucoup
  rationale: Employé adverbialement, le terme indique une grande quantité, avec une possible nuance d’excès; « beaucoup » reste proche de la formulation hébraïque sans expliciter davantage.
- source_word: לֹא טוֹב
  choice: n’est pas bon
  rationale: Cette formulation garde l’évaluation concise de l’hébreu sans la limiter à un effet physique ou sanitaire.
- source_word: וְחֵקֶר
  choice: et sonder
  rationale: Le nom désigne la recherche ou l’examen approfondi. Une forme verbale rend naturellement en français le parallélisme avec « Manger ».
- source_word: כְּבֹדָם
  choice: leur gloire
  rationale: Le texte massorétique porte un suffixe masculin pluriel de troisième personne. La traduction littérale préserve cette référence difficile plutôt que de la remplacer par « sa propre gloire ».
- source_word: כָּבוֹד
  choice: est une gloire
  rationale: Le prédicat nominal et la répétition de la racine כבד sont maintenus, malgré l’étrangeté de la proposition.
theological_decisions:
- issue: Sens de la seconde proposition, textuellement difficile
  choice: Conserver au plus près « sonder leur gloire est une gloire »
  alternative: « rechercher sa propre gloire n’est pas glorieux » ou « approfondir des sujets importants est honorable »
  rationale: Le texte massorétique reçu est obscur et peut avoir donné lieu à plusieurs reconstructions ou interprétations. La traduction ne tranche pas silencieusement entre elles.
translation_notes:
  register: Français moderne, sobre et proverbial. La première proposition est naturelle; l’étrangeté de la seconde est volontairement conservée et expliquée en note afin de respecter l’ambiguïté du texte hébreu.
