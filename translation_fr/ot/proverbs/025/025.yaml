source:
  edition: WLC
  text: מַ֣יִם קָ֭רִים עַל נֶ֣פֶשׁ עֲיֵפָ֑ה וּ/שְׁמוּעָ֥ה ט֝וֹבָ֗ה מֵ/אֶ֥רֶץ מֶרְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/025.yaml
  text: Like cold water to a weary soul[a], so is good news from a distant land.
translation:
  language: fr
  text: Comme de l’eau froide pour une personne épuisée, telle est une bonne nouvelle venue d’un pays lointain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bon rapport venu d’un pays lointain ». Le mot hébreu שְׁמוּעָה peut désigner une nouvelle, une information ou un rapport.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קָרִים
  choice: de l’eau froide
  rationale: מַיִם est morphologiquement pluriel mais fonctionne ici comme un nom massif. « Eau froide » rend naturellement et vivement l’image du rafraîchissement.
- source_word: עַל
  choice: pour
  rationale: Dans cette comparaison, « pour » exprime en français moderne le bienfait apporté au destinataire, sans le calque maladroit « sur ».
- source_word: נֶפֶשׁ עֲיֵפָה
  choice: une personne épuisée
  rationale: נֶפֶשׁ peut désigner la personne, la vie, l’être intérieur ou la gorge. Dans ce contexte concret de fatigue et de rafraîchissement, « personne » conserve l’ampleur anthropologique du terme sans imposer la lecture dualiste que pourrait suggérer « âme »; « épuisée » rend la forte fatigue exprimée par עֲיֵפָה.
- source_word: שְׁמוּעָה טוֹבָה
  choice: une bonne nouvelle
  rationale: שְׁמוּעָה désigne une nouvelle, une information ou un rapport reçu. « Bonne nouvelle » est l’expression française actuelle la plus naturelle et correspond au parallèle avec l’eau qui ranime.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: venue d’un pays lointain
  rationale: La locution signifie littéralement « d’un pays de distance ». « Venue d’un pays lointain » indique clairement l’origine de la nouvelle et restitue la distance géographique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative concise du proverbe est conservée. Le choix de « personne » évite de réduire נֶפֶשׁ à une composante immatérielle, tandis que la note maintient l’étendue lexicale de שְׁמוּעָה.
