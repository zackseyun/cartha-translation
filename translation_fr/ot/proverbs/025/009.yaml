id: PRO.25.9
reference: Proverbs 25:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רִֽ֭יבְ/ךָ רִ֣יב אֶת רֵעֶ֑/ךָ וְ/ס֖וֹד אַחֵ֣ר אַל תְּגָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/009.yaml
  text: Argue your case with your neighbor himself[b][a], and do not reveal another person's secret.
translation:
  language: fr
  text: Défends ta cause contre ton prochain[a], mais ne révèle pas le secret d’un autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Règle ton différend avec ton prochain ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le secret d’un autre »; il peut s’agir d’une confidence ou d’une information confidentielle appartenant à autrui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבְךָ
  choice: ta cause
  rationale: Le nom רִיב peut désigner un différend, une contestation ou une cause. « Ta cause » conserve ici la possible nuance juridique sans limiter le propos à un procès.
- source_word: רִיב
  choice: défends
  rationale: L’impératif demande de mener ou soutenir son différend. Avec « ta cause », « défends » est naturel en français et rend la force active du verbe sans imposer le cadre strict d’un tribunal.
- source_word: אֶת רֵעֶךָ
  choice: contre ton prochain
  rationale: רֵעַ désigne le prochain, le compagnon ou l’ami. Dans une construction exprimant le différend, « contre » marque naturellement la partie adverse; « prochain » garde la portée générale du terme sapientiel.
- source_word: וְסוֹד
  choice: mais… le secret
  rationale: סוֹד peut désigner un secret, une confidence ou un entretien confidentiel. « Le secret » est clair et laisse ouverte la nature exacte de l’information. La conjonction est rendue par « mais » pour exprimer le contraste contextuel.
- source_word: אַחֵר
  choice: d’un autre
  rationale: La formule française « le secret d’un autre » suit de près l’hébreu et évite de préciser au-delà du texte si cet autre est le prochain impliqué ou une tierce personne.
- source_word: אַל תְּגָל
  choice: ne révèle pas
  rationale: Le verbe גלה signifie ici dévoiler ou divulguer. « Ne révèle pas » exprime clairement l’interdiction.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme oppose la défense ouverte de sa propre cause à la divulgation interdite du secret d’autrui. Aucun équivalent de « lui-même » ou « directement » n’est ajouté, car cette précision, bien que plausible dans le contexte, n’est pas exprimée dans l’hébreu.
