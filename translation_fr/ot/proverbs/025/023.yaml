  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
translation:
  language: fr
  text: Le vent du nord produit la pluie[a], et une langue qui parle en secret[b] provoque un visage irrité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le vent du nord chasse la pluie, et une langue qui parle en secret provoque un visage irrité. » Le verbe hébreu peut être compris de deux manières : le vent du nord produit la pluie ou la dissipe.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une langue du secret » ou « une langue cachée » ; c’est-à-dire des paroles prononcées en secret contre quelqu’un, comme la médisance ou la calomnie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  choice: le vent du nord
  rationale: Expression construite désignant le vent qui vient du nord; « le vent du nord » est naturel en français et conserve l’image hébraïque.
- source_word: תְּח֣וֹלֵֽל
  choice: fait naître
  rationale: Le verbe peut exprimer l’idée de produire ou de faire venir. « Fait naître » préserve l’image causative tout en laissant la note signaler l’autre compréhension possible, « chasse ».
- source_word: גָּ֑שֶׁם
  choice: la pluie
  rationale: Traduction française usuelle du terme désignant la pluie ou une forte pluie.
- source_word: וּ/פָנִ֥ים נִ֝זְעָמִ֗ים
  choice: un visage irrité
  rationale: Bien que פָנִים soit morphologiquement pluriel, il désigne couramment le visage au singulier. « Irrité » rend l’indignation ou la colère exprimée par le participe.
- source_word: לְשׁ֣וֹן סָֽתֶר
  choice: la médisance
  rationale: Littéralement « une langue du secret » ou « une langue cachée »; l’expression évoque des paroles dites en secret contre quelqu’un. « Médisance » en communique naturellement la portée, tandis que la note conserve l’image littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. La formulation reste concise et conserve le parallélisme de cause à effet. « Médisance » est plus idiomatique que l’image littérale dans le corps du verset; celle-ci est donnée en note. Les deux lectures météorologiques du verbe hébreu sont explicitement préservées.
