  naturalness: La structure proverbiale est naturelle. La formulation révisée « est de cacher » est plus idiomatique et concise que « c’est de tenir ... cachée », tout en conservant le registre soutenu sans archaïsme.
  terminology: « Gloire », « Dieu », « rois », « affaire » et « examiner » conviennent. « Affaire » rend adéquatement דָבָר dans ce contexte et sa répétition conserve le parallélisme formel. La note sur « honneur » est conservée comme alternative possible à « gloire ».
