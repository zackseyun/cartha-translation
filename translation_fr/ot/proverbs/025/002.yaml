    issue: Nuance de « tenir ... cachée »
    rationale: Cette expression peut suggérer le fait de garder durablement une affaire secrète. L’infinitif hébreu exprime plus simplement l’action de cacher/concevoir dans le secret. « Cacher » évite cet ajout de nuance.
