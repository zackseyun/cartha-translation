source:
  edition: WLC
  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
translation:
  language: fr
  text: La gloire[a] de Dieu est de cacher une affaire[b], et la gloire des rois est d’examiner une affaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « honneur », dans les deux membres.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « cacher une chose » et « scruter une chose ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  choice: gloire
  rationale: Le terme désigne ici l’honneur éclatant ou le prestige attaché à Dieu et à la fonction royale. « Gloire » maintient le registre élevé et le parallélisme des deux membres.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte de la sagesse d’Israël, le mot renvoie ici au Dieu unique.
- source_word: הַסְתֵּר
  choice: tenir cachée
  rationale: L’infinitif exprime l’action qui constitue ou manifeste la gloire de Dieu. « Tenir cachée » rend l’idée d’une dissimulation intentionnelle dans un français naturel.
- source_word: דָּבָר
  choice: une affaire
  rationale: Le mot peut désigner une chose, une parole ou une question. Ici, « affaire » convient aux deux membres et à l’idée d’examen royal.
- source_word: וּ/כְבֹד
  choice: la gloire
  rationale: Le point-virgule coordonne naturellement les deux membres en français sans imposer un contraste adversatif absent de la simple conjonction hébraïque.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le terme hébreu désigne précisément des rois ; le conserver préserve l’image royale du proverbe.
- source_word: חֲקֹר
  choice: examiner
  rationale: Le verbe évoque une recherche approfondie ou une investigation. « Examiner » est actuel, digne et adapté au discernement attendu des rois.
theological_decisions:
- issue: Rapport entre ce que Dieu cache et ce que les rois examinent
  choice: Présenter sans explication ajoutée les deux manifestations parallèles de la gloire.
  alternative: Faire de la seconde proposition une opposition à la première, ou affirmer que les rois découvrent précisément ce que Dieu a caché.
  rationale: L’hébreu juxtapose la gloire de Dieu qui cache et celle des rois qui approfondissent une affaire, sans préciser davantage leur rapport. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, concis et proverbial. La structure présentative « c’est de » rend clairement les infinitifs hébreux tout en conservant le parallélisme. La répétition de « une affaire » est volontaire.
