source:
  edition: WLC
  text: כִּ֤י ט֥וֹב אֲמָר לְ/ךָ֗ עֲֽלֵ֫ה הֵ֥נָּה מֵֽ֭/הַשְׁפִּ֣ילְ/ךָ לִ/פְנֵ֣י נָדִ֑יב אֲשֶׁ֖ר רָא֣וּ עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/007.yaml
  text: For it is better that it be said to you[b][a], “Come up here,” than that you be humbled before a nobleman whom your eyes have seen.
translation:
  language: fr
  text: 'Car il vaut mieux qu’on te dise : « Monte ici », plutôt que tu sois abaissé devant un dignitaire que tes yeux ont vu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que tes yeux ont vu ». Cette expression hébraïque très concrète peut aussi se traduire simplement par « que tu as vu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’exhortation du verset précédent.
- source_word: טוֹב ... מִן
  choice: il vaut mieux… plutôt que
  rationale: Rend naturellement en français la comparaison exprimée par טוֹב avec מִן.
- source_word: אֲמָר לְךָ
  choice: qu’on te dise
  rationale: La tournure impersonnelle française conserve l’absence de sujet exprimé.
- source_word: עֲלֵה הֵנָּה
  choice: Monte ici
  rationale: Préserve à la fois le mouvement ascendant et la promotion sociale suggérée par le contexte.
- source_word: מֵהַשְׁפִּילְךָ
  choice: plutôt que d’être abaissé
  rationale: Rend le sens causatif de שׁפל sans réduire l’expression à la seule humiliation psychologique; l’abaissement peut être spatial, social ou les deux.
- source_word: לִפְנֵי נָדִיב
  choice: devant un dignitaire
  rationale: « Devant » marque la présence publique; « dignitaire » désigne naturellement une personne de rang élevé sans lui attribuer une fonction précise.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: que tes yeux ont vu
  rationale: Conserve l’expression hébraïque concrète et son possible renvoi à un personnage précis déjà aperçu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse individuelle du texte sapiential. La formulation conserve l’ambivalence entre changement de place et abaissement de rang.
