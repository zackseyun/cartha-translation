id: PRO.25.1
reference: Proverbs 25:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אֵ֭לֶּה מִשְׁלֵ֣י שְׁלֹמֹ֑ה אֲשֶׁ֥ר הֶ֝עְתִּ֗יקוּ אַנְשֵׁ֤י חִזְקִיָּ֬ה מֶֽלֶךְ יְהוּדָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/001.yaml
  text: These also are proverbs of Solomon[b][a], which the men of Hezekiah king of Judah copied.
translation:
  language: fr
  text: Voici encore des proverbes de Salomon, que les hommes d’Ézéchias, roi de Juda, ont transcrits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « copiés » ou « rassemblés par écrit ». Le verbe hébreu évoque probablement la transcription de ces proverbes en vue de constituer une collection.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Voici encore
  rationale: Cette tournure française naturelle présente la nouvelle section tout en conservant la valeur additive de גַּם et la valeur démonstrative de אֵלֶּה.
- source_word: מִשְׁלֵי
  choice: proverbes
  rationale: Terme consacré pour מָשָׁל dans ce livre et désignation exacte du genre de ces sentences.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הֶעְתִּיקוּ
  choice: ont transcrits
  rationale: Le hiphil de עתק désigne ici vraisemblablement le transfert écrit ou la copie de proverbes dans une collection. « Transcrits » exprime clairement ce travail sans préciser indûment l’ensemble du processus éditorial.
- source_word: אַנְשֵׁי חִזְקִיָּה
  choice: les hommes d’Ézéchias
  rationale: Rend formellement l’expression masculine « les hommes de », qui désigne des personnes rattachées au roi, probablement des membres de sa cour ou des scribes.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend naturellement et précisément la chaîne construite qui indique la fonction royale d’Ézéchias.
theological_decisions:
- issue: Portée de l’expression genrée אַנְשֵׁי חִזְקִיָּה
  choice: les hommes d’Ézéchias
  alternative: les fonctionnaires d’Ézéchias / les scribes d’Ézéchias
  rationale: Le texte hébreu emploie une expression masculine et ne précise pas la fonction de ces hommes. La traduction conserve donc la forme du texte et évite de transformer une inférence historique plausible en affirmation explicite.
- issue: Nature du travail exprimé par הֶעְתִּיקוּ
  choice: ont transcrits
  alternative: ont copiés / ont compilés
  rationale: Le verbe peut évoquer la copie ou le transfert de ces proverbes dans une collection. « Transcrits » préserve cette latitude mieux que « compilés », qui pourrait suggérer un travail éditorial plus précisément défini.
translation_notes:
  register: Français international moderne, sobre et digne. « Voici encore » marque naturellement l’ouverture d’une nouvelle collection. La formulation reste proche de l’hébreu sans alourdir la phrase.
