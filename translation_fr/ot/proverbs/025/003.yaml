  - severity: low
    issue: Note actuelle inutilement interprétative sur le rattachement au seul cœur des rois
    rationale: La note présente comme possibilité un rattachement plus direct au seul dernier membre, alors que l’énumération proverbiale se lit naturellement comme une série soumise à la conclusion. Une note strictement lexicale suffit.
