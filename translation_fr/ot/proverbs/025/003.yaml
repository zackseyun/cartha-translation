  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
translation:
  language: fr
  text: 'Le ciel dans sa hauteur, la terre dans sa profondeur, et le cœur des rois : on ne peut les sonder[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il n’y a pas de recherche » ou « pas d’exploration ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַיִם לָרוּם
  choice: la hauteur du ciel
  rationale: Le pluriel hébreu שָׁמַיִם désigne ici le ciel ou les cieux, tandis que לָרוּם indique la dimension considérée, la hauteur. La formulation française transpose naturellement cette relation concise.
- source_word: וָאָרֶץ לָעֹמֶק
  choice: la profondeur de la terre
  rationale: אֶרֶץ a ici le sens cosmique de « terre », en parallèle avec le ciel. לָעֹמֶק désigne sa profondeur et répond à לָרוּם.
- source_word: לֵב מְלָכִים
  choice: le cœur des rois
  rationale: « Cœur » conserve la métaphore hébraïque, qui englobe la pensée, les intentions et les dispositions intérieures. מְלָכִים signifie précisément « rois ».
- source_word: אֵין חֵקֶר
  choice: sont insondables
  rationale: L’expression signifie littéralement qu’il n’existe pas de recherche ou d’exploration permettant d’atteindre le fond de la réalité évoquée. « Insondables » rend cette idée avec concision et dans un français naturel.
theological_decisions:
- issue: Portée de אֵין חֵקֶר
  choice: La proposition finale est rendue comme portant sur les trois éléments énumérés.
  alternative: La rattacher directement au seul « cœur des rois », les deux premiers éléments servant de comparaisons implicites.
  rationale: La structure proverbiale rapproche la hauteur du ciel, la profondeur de la terre et l’intériorité royale comme réalités qu’on ne peut sonder. Une note préserve toutefois la possibilité que la proposition finale vise plus directement le cœur des rois.
translation_notes:
  register: Français moderne, sobre et proverbial. La restructuration nominale évite un calque maladroit de l’hébreu tout en conservant le parallélisme en trois membres et l’image du cœur royal.
