  verdict: revise
  source_fidelity: La version proposée élargit explicitement « sont insondables » aux trois réalités. Le texte hébreu juxtapose « le ciel pour la hauteur, la terre pour la profondeur, et le cœur des rois — il n’y a pas de recherche »; la portée peut être comprise de façon collective, mais la formulation nominale française proposée efface la construction finale et rend l’attribution plus catégorique. Une formulation avec « on ne peut les sonder » conserve mieux l’image et la conclusion hébraïque.
  naturalness: '« Le ciel dans sa hauteur, la terre dans sa profondeur, et le cœur des rois : on ne peut les sonder » est idiomatique en français moderne, sobre, et garde le rythme proverbial sans calquer lourdement les prépositions hébraïques.'
  terminology: « Ciel », « terre », « cœur » et « rois » sont exacts et conservent les termes et l’imagerie du texte source. « Sonder » rend naturellement חֵקֶר (« recherche/exploration, investigation approfondie ») sans imposer une lecture psychologique ou théologique.
