  text: דְּבַ֣שׁ מָ֭צָאתָ אֱכֹ֣ל דַּיֶּ֑/ךָּ פֶּן תִּ֝שְׂבָּעֶ֗/נּוּ וַ/הֲקֵֽאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/016.yaml
  text: If you find honey[a], eat only enough for you, lest you become full of it and vomit it.
translation:
  language: fr
  text: Si tu trouves du miel, n’en mange que ce qu’il te faut[a], de peur d’en être rassasié et de le vomir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mange ce qui te suffit » ou « mange à ta suffisance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַשׁ
  choice: miel
  rationale: Le nom désigne concrètement le miel; rien dans le verset n’impose de rendre l’image métaphorique.
- source_word: מָצָאתָ
  choice: si tu trouves
  rationale: Bien que la forme hébraïque soit un accompli à la deuxième personne du masculin singulier, le contexte proverbial présente une situation générale, naturellement exprimée en français par une proposition conditionnelle au présent.
- source_word: אֱכֹל
  choice: mange
  rationale: L’impératif singulier signifie « mange »; le pronom adverbial « en » reprend naturellement « du miel » en français.
- source_word: דַּיֶּךָ
  choice: n’en mange que ce qu’il te faut
  rationale: Le terme exprime ce qui suffit à la personne. Cette formulation idiomatique conserve la limite quantitative et la valeur d’exhortation.
- source_word: פֶּן
  choice: de peur de
  rationale: La conjonction introduit une conséquence indésirable à éviter; « de peur de » rend clairement ce rapport d’avertissement.
- source_word: תִּשְׂבָּעֶנּוּ
  choice: en être rassasié
  rationale: Le verbe signifie être rassasié ou repu, et le suffixe renvoie au miel. La formulation préserve l’image physique de la surconsommation.
- source_word: וַהֲקֵאתוֹ
  choice: et le vomir
  rationale: La forme causative du verbe קיא/קוא signifie vomir. Le choix direct « vomir » conserve la vigueur concrète de l’hébreu sans l’atténuer.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et proverbial. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu, employée ici de façon générale. La formulation reste digne tout en conservant le terme concret et vigoureux « vomir ».
