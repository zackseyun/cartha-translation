source:
  edition: WLC
  text: שְׁמַ֣ע עֵ֭צָה וְ/קַבֵּ֣ל מוּסָ֑ר לְ֝מַ֗עַן תֶּחְכַּ֥ם בְּ/אַחֲרִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/020.yaml
  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
translation:
  language: fr
  text: Écoute les conseils et accepte la correction, afin de devenir sage pour ton avenir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tes dernières années » ou « en fin de compte ». Le mot hébreu peut désigner l’avenir, la dernière période de la vie ou l’issue finale.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif appelle à prêter attention et à tenir compte de ce qui est dit, plutôt qu’à simplement entendre.
- source_word: עֵצָה
  choice: les conseils
  rationale: Le terme désigne ici des avis réfléchis qui orientent la conduite; le pluriel est idiomatique en français dans cette formule générale.
- source_word: וְקַבֵּל
  choice: et accepte
  rationale: Cette formulation exprime l’accueil volontaire demandé par l’impératif hébreu.
- source_word: מוּסָר
  choice: la correction
  rationale: Dans les Proverbes, le mot comprend une instruction formative qui rectifie la conduite. « Correction » conserve cette dimension sans se limiter à une punition.
- source_word: לְמַעַן
  choice: afin de
  rationale: Cette locution française naturelle marque clairement le but.
- source_word: תֶּחְכַּם
  choice: devenir sage
  rationale: La tournure rend la progression vers la sagesse envisagée comme résultat de l’écoute et de l’acceptation.
- source_word: בְּאַחֲרִיתֶךָ
  choice: pour ton avenir
  rationale: אַחֲרִית peut désigner la suite, l’issue ou la fin. « Pour ton avenir » est naturel et conserve ici l’orientation vers le temps à venir, sans imposer exclusivement la fin de la vie.
theological_decisions:
- issue: Portée temporelle de בְּאַחֲרִיתֶךָ
  choice: pour ton avenir
  alternative: à la fin de ta vie / dans tes dernières années / en fin de compte
  rationale: Le contexte ne tranche pas définitivement entre avenir, dernière période de la vie et issue finale. Le texte retient une formulation naturelle assez large et la note conserve les autres possibilités.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond aux impératifs et suffixes masculins singuliers de l’hébreu. La formulation évite un registre archaïque tout en gardant la concision proverbiale.
