  text: לֹֽא נָאוֶ֣ה לִ/כְסִ֣יל תַּעֲנ֑וּג אַ֝֗ף כִּֽי לְ/עֶ֤בֶד מְשֹׁ֬ל בְּ/שָׂרִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/010.yaml
  text: Luxury is not fitting for a fool[c][b][a], much less for a servant to rule over princes.
translation:
  language: fr
  text: Le luxe ne convient pas à l’insensé[a], encore moins qu’un esclave[b] gouverne des princes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sot ». Dans les Proverbes, le terme désigne surtout une personne réfractaire à la sagesse, et non simplement quelqu’un qui manque d’intelligence.
    reason: lexical_alternative
  - marker: b
    text: Ou « serviteur ». Le mot hébreu peut désigner diverses situations de dépendance; « esclave » souligne ici le fort renversement de la hiérarchie sociale.
    reason: lexical_alternative
  - marker: c
    text: Ou « nobles », « dignitaires » ou « chefs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֶה
  choice: convient
  rationale: Le terme exprime ce qui est approprié ou bienséant. « Ne convient pas » est naturel en français moderne et conserve l’évaluation proverbiale.
- source_word: כְסִיל
  choice: insensé
  rationale: Dans les Proverbes, le mot désigne une catégorie morale et spirituelle, non un simple manque d’intelligence. « Insensé » préserve cette portée sapientielle.
- source_word: תַּעֲנוּג
  choice: luxe
  rationale: Le nom peut désigner le plaisir ou les délices, mais le contraste social du verset suggère ici l’aisance raffinée ou la vie indulgente; « luxe » rend cette nuance avec concision.
- source_word: אַף כִּי
  choice: encore moins
  rationale: L’expression introduit ici un second cas présenté comme d’autant moins approprié. « Encore moins » restitue clairement cette progression a fortiori.
- source_word: עֶבֶד
  choice: esclave
  rationale: Le terme couvre diverses formes de dépendance servile. Ici, le renversement de rang social porte la force du proverbe; « esclave » maintient donc mieux le contraste que « serviteur ».
- source_word: מְשֹׁל
  choice: gouverner
  rationale: L’infinitif indique l’exercice de l’autorité. « Gouverner » est idiomatique avec un complément désignant des dirigeants et évite une répétition de la racine de « prince ».
- source_word: שָׂרִים
  choice: princes
  rationale: Le mot désigne des personnages de haut rang, chefs, dignitaires ou nobles. « Princes » conserve nettement le contraste hiérarchique du proverbe.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, digne et immédiatement compréhensible en français international moderne. La structure parallèle et la progression renforcée par « encore moins » sont conservées. Les termes sociaux reflètent le contraste du texte ancien sans en faire une approbation normative.
