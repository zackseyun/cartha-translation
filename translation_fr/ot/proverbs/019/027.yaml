review_pass:
  verdict: revise
  source_fidelity: 'Le texte hébreu juxtapose de manière elliptique l’impératif « cesse », « mon fils », et deux infinitifs : « écouter l’instruction » et « s’égarer loin des paroles de la connaissance ». Le lien précis entre les infinitifs est discuté. La formulation française actuelle avec « pour t’égarer » donne trop nettement à לְ un sens de but et peut faire entendre que le destinataire doit cesser d’écouter afin de s’égarer. Une formulation conditionnelle exprime naturellement la lecture consécutive tout en signalant l’autre analyse dans la note.'
  naturalness: « Cesse … d’écouter …, pour t’égarer » est grammaticalement possible dans un style très littéraire, mais son sens final est peu naturel et contre-intuitif en français moderne. « Si tu cesses d’écouter …, tu t’égareras » est clair, proverbial et idiomatique.
  terminology: « Mon fils », « instruction », « t’égareras », « paroles de la connaissance » sont appropriés au registre sapientiel et rendent sans surcharge les termes hébreux. Le masculin singulier de l’adresse est conservé.
  issues:
  - severity: medium
    issue: « pour t’égarer » attribue un rapport de finalité trop déterminé au second infinitif.
    rationale: La construction hébraïque est elliptique et admet notamment une lecture de conséquence. En français moderne, « pour » est compris d’abord comme exprimant le but, ce qui rend la maxime inutilement paradoxale hors d’une interprétation ironique.
  revised_text: Mon fils, si tu cesses d’écouter l’instruction, tu t’égareras loin des paroles de la connaissance.
  revised_footnotes:
  - marker: a
    text: 'Ou, litt. : « Cesse, mon fils, d’écouter l’instruction, pour t’égarer loin des paroles de la connaissance. » La syntaxe hébraïque est condensée. Elle peut exprimer la conséquence de cesser d’écouter une saine instruction, ou mettre en garde contre un enseignement qui éloigne des paroles de la connaissance.'
    reason: alternative_reading
  revision_rationale: La révision remplace une finalité française ambiguë et peu naturelle par une condition-conséquence, lecture largement possible dans l’hébreu. La note conserve la forme elliptique et l’autre compréhension attestée, sans décider si « instruction » doit être qualifiée de trompeuse.
