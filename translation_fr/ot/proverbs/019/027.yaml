  text: חַֽדַל בְּ֭נִ/י לִ/שְׁמֹ֣עַ מוּסָ֑ר לִ֝/שְׁג֗וֹת מֵֽ/אִמְרֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/027.yaml
  text: Cease[a], my son, to hear instruction and to stray from the words of knowledge.
translation:
  language: fr
  text: Mon fils, si tu cesses d’écouter l’instruction, tu t’égareras loin des paroles de la connaissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַדַל
  choice: Cesse
  rationale: Impératif masculin singulier de חדל. « Cesse » garde la force directe et le ton sentencieux de l’hébreu.
- source_word: בְּנִי
  choice: mon fils
  rationale: Vocatif masculin singulier caractéristique de la littérature sapientiale; le genre grammatical et l’adresse personnelle sont conservés.
- source_word: לִשְׁמֹעַ
  choice: d’écouter
  rationale: שמע peut signifier entendre ou écouter. Avec מוּסָר, « écouter » exprime naturellement l’attention portée à un enseignement.
- source_word: מוּסָר
  choice: l’instruction
  rationale: מוּסָר couvre l’instruction, la correction et la discipline éducative. « Instruction » convient ici au contexte sapientiel sans exclure cette dimension formative.
- source_word: לִשְׁגוֹת
  choice: pour t’égarer
  rationale: L’infinitif construit de שגה exprime l’action de s’égarer ou de se tromper. « Pour t’égarer » conserve la relation syntaxique comprimée et son ambiguïté possible, plutôt que d’ajouter explicitement un enseignement trompeur.
- source_word: מֵאִמְרֵי
  choice: loin des paroles de
  rationale: La préposition מן marque l’éloignement; « loin des paroles de » rend clairement cette séparation tout en conservant le rapport construit.
- source_word: דָעַת
  choice: la connaissance
  rationale: דעת désigne couramment dans les Proverbes la connaissance au sens sapientiel; le rendu direct préserve ce motif lexical.
theological_decisions:
- issue: Rapport entre l’ordre de cesser, l’écoute de l’instruction et l’égarement
  choice: Conserver dans le texte la construction « Cesse… d’écouter… pour t’égarer », qui peut se lire comme une injonction ironique ou comme l’ordre de ne plus écouter un enseignement conduisant à l’égarement.
  alternative: « Cesse, mon fils, d’écouter l’instruction, et tu t’égareras loin des paroles de la connaissance. »
  rationale: La syntaxe hébraïque est fortement comprimée. Elle ne précise ni un adjectif qualifiant מוּסָר comme trompeur, ni une conséquence explicitement coordonnée. La traduction principale maintient donc la tension, tandis que la note présente la lecture consécutive courante.
translation_notes:
  register: Français international moderne, digne et proverbial. « Mon fils » conserve l’adresse sapientielle masculine; « paroles de la connaissance » garde la formulation concrète et le motif lexical du texte hébreu.
