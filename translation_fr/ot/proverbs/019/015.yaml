  text: עַ֭צְלָה תַּפִּ֣יל תַּרְדֵּמָ֑ה וְ/נֶ֖פֶשׁ רְמִיָּ֣ה תִרְעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/015.yaml
  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
translation:
  language: fr
  text: La paresse plonge dans un profond sommeil, et la personne[a] négligente[b] aura faim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’âme ». Ici, le mot hébreu נֶפֶשׁ peut désigner la personne elle-même.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu רְמִיָּה désigne ici probablement la négligence ou le relâchement ; ailleurs, il peut aussi désigner la tromperie.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְלָה
  choice: la paresse
  rationale: Le nom désigne la paresse ou l’indolence. « La paresse » est actuel, clair et conserve la portée morale du proverbe.
- source_word: תַּפִּיל
  choice: plonge dans
  rationale: La forme causative de נפל signifie littéralement « faire tomber ». Avec « profond sommeil », « plonge dans » restitue naturellement l’idée causative tout en gardant l’image.
- source_word: תַּרְדֵּמָה
  choice: un profond sommeil
  rationale: Le terme évoque un sommeil lourd ou profond, et non une simple somnolence.
- source_word: נֶפֶשׁ
  choice: la personne
  rationale: Dans ce contexte, נֶפֶשׁ désigne l’être ou la personne elle-même. « Personne » évite de donner à « âme » un sens métaphysique trop étroit.
- source_word: רְמִיָּה
  choice: négligente
  rationale: Dans ce contexte de paresse suivie de faim, le mot exprime vraisemblablement le relâchement ou la négligence. Ce choix évite de répéter simplement « paresseuse » tout en conservant le lien logique du verset.
- source_word: תִרְעָב
  choice: aura faim
  rationale: Le qal de רעב signifie « avoir faim » ou « souffrir de la faim ». « Aura faim » est direct, idiomatique et n’exagère pas le sens jusqu’à « mourra de faim ».
theological_decisions:
- issue: Sens de רְמִיָּה
  choice: négligente
  alternative: trompeuse
  rationale: Le parallélisme avec « la paresse » et la conséquence de la faim favorisent ici le sens de négligence, mais le sens courant de tromperie reste lexicalement possible et est signalé en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. La première proposition conserve l’image causative de la chute dans un sommeil profond ; la seconde privilégie une formulation immédiatement intelligible sans effacer les ambiguïtés lexicales, qui sont indiquées en notes.
