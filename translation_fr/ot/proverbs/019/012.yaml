  text: נַ֣הַם כַּ֭/כְּפִיר זַ֣עַף מֶ֑לֶךְ וּ/כְ/טַ֖ל עַל עֵ֣שֶׂב רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
translation:
  language: fr
  text: La fureur du roi est comme le grondement d’un jeune lion[a], mais sa faveur[b] est comme la rosée sur l’herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rugissement d’un jeune lion ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa bienveillance » ou « son bon plaisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: grondement
  rationale: Le nom désigne le grondement ou le rugissement d’un lion. « Grondement » rend naturellement le son menaçant tout en conservant la brièveté de l’hébreu.
- source_word: כְּפִיר
  choice: jeune lion
  rationale: Le terme désigne couramment un jeune lion déjà vigoureux et dangereux ; cette traduction est claire et fidèle.
- source_word: זַעַף
  choice: fureur
  rationale: Le nom exprime une colère intense. « Fureur » conserve la force du terme dans un registre actuel et digne.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent direct du nom hébreu dans ce contexte de sagesse portant sur le pouvoir royal.
- source_word: וּכְטַל
  choice: mais sa faveur est comme la rosée
  rationale: Le waw coordonne les deux membres, mais leur parallélisme antithétique permet naturellement « mais » en français. L’image concrète et bienfaisante de la rosée est conservée.
- source_word: עַל
  choice: sur
  rationale: Préposition française naturelle correspondant au rapport spatial exprimé ici.
- source_word: עֵשֶׂב
  choice: herbe
  rationale: « Herbe » restitue simplement et concrètement la végétation basse évoquée par l’image.
- source_word: רְצוֹנוֹ
  choice: sa faveur
  rationale: Le mot peut désigner la faveur, la bienveillance ou le bon plaisir. Face à la fureur royale, « sa faveur » est l’équivalent français le plus direct et naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme entre la menace du roi et le caractère vivifiant de sa faveur est préservé ; « mais » explicite sans l’exagérer le contraste porté par les deux membres.
