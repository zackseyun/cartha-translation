  text: ה֗וֹן יֹ֭סִיף רֵעִ֣ים רַבִּ֑ים וְ֝/דָ֗ל מֵרֵ֥ע/הוּ יִפָּרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: fr
  text: 'La richesse procure de nombreux amis,

    mais le pauvre est séparé de son ami[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pauvre est abandonné par son ami ». Le verbe hébreu peut décrire une séparation sans préciser si le pauvre se retire ou s’il est abandonné; le contexte évoque fortement l’abandon social.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: la richesse
  rationale: Le terme désigne les biens matériels ou la fortune au sens large, et non seulement l’argent liquide.
- source_word: יֹסִיף
  choice: multiplie
  rationale: Le hifil de יסף exprime ici l’accroissement du nombre d’amis. « Multiplie » rend naturellement cet effet causatif en français.
- source_word: רֵעִים רַבִּים
  choice: les amis
  rationale: רֵעִים désigne ici des amis ou compagnons attirés par la richesse. Avec « multiplie », l’idée de grand nombre portée par רַבִּים est déjà exprimée sans lourdeur.
- source_word: דָל
  choice: le pauvre
  rationale: דָל désigne une personne pauvre, faible ou de condition modeste. Le substantif adjectival masculin singulier convient au style proverbial français.
- source_word: מֵרֵעֵהוּ
  choice: de son ami
  rationale: La préposition מִן avec רֵעַ et le suffixe possessif indique une séparation d’avec son ami. Le singulier générique est conservé.
- source_word: יִפָּרֵד
  choice: est séparé
  rationale: Le nifal de פרד peut décrire l’état ou le fait d’être séparé sans préciser clairement qui prend l’initiative. Cette formulation préserve l’ambiguïté de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme antithétique est conservé, ainsi que l’ambiguïté concernant l’initiative de la séparation dans le second membre.
