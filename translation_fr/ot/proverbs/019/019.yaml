  source_fidelity: La première expression désigne une personne caractérisée par une grande colère; « L’homme colérique » atténue la qualification intensive. Le participe נֹשֵׂא présente la conséquence comme certaine dans l’énoncé proverbial; « subira une peine » la rend sans limiter עֹנֶשׁ à une amende ou à une forme précise de châtiment. La reprise implicite de l’acte de délivrer dans le dernier membre est bien rendue par « recommencer ».
  naturalness: « Un homme très colérique subira une peine » est naturel, sobre et d’un registre proverbial moderne. « Car si tu le délivres, tu devras recommencer » conserve l’adresse au singulier et l’ellipse contextuellement intelligible.
  terminology: « Très colérique » restitue l’idée de grande colère sans introduire la violence physique. « Peine » est suffisamment large pour עֹנֶשׁ. « Délivrer » convient à la forme causative de נצל et ne surinterprète pas la nature de l’intervention.
