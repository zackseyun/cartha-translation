  text: גרל חֵ֭מָה נֹ֣שֵׂא עֹ֑נֶשׁ כִּ֥י אִם תַּ֝צִּ֗יל וְ/ע֣וֹד תּוֹסִֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/019.yaml
  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
translation:
  language: fr
  text: Un homme très colérique subira une peine[a] ; car si tu le délivres, tu devras recommencer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Un homme de grande colère porte une peine » ; l’hébreu est concis et idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גרל חֵמָה
  choice: L’homme colérique
  rationale: L’expression construite, littéralement « un homme/possesseur de fureur », désigne une personne caractérisée par une vive colère. « L’homme colérique » est naturel en français et conserve la portée générale du proverbe.
- source_word: נֹשֵׂא
  choice: doit subir
  rationale: Le participe de נשׂא signifie « porter, supporter ». Avec « peine », « subir » est idiomatique ; l’ajout de « doit » exprime ici la nécessité proverbiale sans fixer artificiellement le temps.
- source_word: עֹנֶשׁ
  choice: sa peine
  rationale: Le nom peut désigner une peine, une punition ou une sanction. « Sa peine » rend de façon concise la conséquence encourue sans en préciser indûment la forme.
- source_word: כִּי אִם
  choice: car si
  rationale: Cette combinaison introduit l’explication conditionnelle qui justifie la première proposition. « Car si » en préserve clairement les deux valeurs.
- source_word: תַּצִּיל
  choice: tu le délivres
  rationale: Le hiphil de נצל signifie « délivrer, arracher, sauver ». Le pronom objet, implicite en hébreu, renvoie à l’homme colérique.
- source_word: וְעוֹד תּוֹסִף
  choice: tu devras recommencer
  rationale: L’expression elliptique signifie littéralement « tu ajouteras encore ». Dans le contexte, elle annonce la répétition de l’intervention ; « tu devras recommencer » l’explicite sans imposer un objet absent de l’hébreu.
