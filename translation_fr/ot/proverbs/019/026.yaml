  text: מְֽשַׁדֶּד אָ֭ב יַבְרִ֣יחַ אֵ֑ם בֵּ֝֗ן מֵבִ֥ישׁ וּ/מַחְפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/026.yaml
  text: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
translation:
  language: fr
  text: Celui qui dépouille son père et chasse sa mère est un fils qui fait honte et attire le déshonneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Celui qui ruine son père et fait fuir sa mère est un fils qui couvre de honte et d’opprobre. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁדֶּד
  choice: dépouille
  rationale: Le participe de שׁדד exprime une action violente qui ravage ou spolie. « Dépouille » convient naturellement avec « son père » et conserve ici l’idée d’une grave atteinte, notamment aux biens, sans atténuer la brutalité du terme.
- source_word: אָב
  choice: son père
  rationale: Le possessif, implicite dans le contexte familial, est explicité en français naturel.
- source_word: יַבְרִיחַ
  choice: chasse
  rationale: Le hiphil de ברח indique qu’il fait fuir sa mère ou la contraint à partir. « Chasse » restitue clairement cette valeur causative.
- source_word: אֵם
  choice: sa mère
  rationale: Le possessif contextuel est explicité, parallèlement à « son père ».
- source_word: בֵּן
  choice: un fils
  rationale: Le nom caractérise de manière prédicative l’individu décrit et garde la portée générale de la maxime.
- source_word: מֵבִישׁ
  choice: qui fait honte
  rationale: Le participe causatif de בוש désigne quelqu’un qui cause la honte. « Fait honte » est direct et idiomatique.
- source_word: וּמַחְפִּיר
  choice: et attire le déshonneur
  rationale: Le second participe renforce l’idée de honte publique. Cette formulation maintient sa valeur active et le parallélisme sans confondre entièrement les deux termes.
