  source_fidelity: 'Le texte rend correctement la structure proverbiale et les principaux éléments hébreux : le participe מְשַׁדֶּד par « dépouille », le hiphil יַבְרִיחַ par « chasse », et la double caractérisation finale par « fait honte et attire le déshonneur ». « Dépouille son père » conserve de manière idiomatique l’idée de spoliation violente, sans imposer une lecture strictement limitée au vol. La note offre de façon appropriée les possibilités plus larges « ruine » et « fait fuir ».'
  naturalness: Le français est fluide, moderne et d’un registre proverbial approprié. « Celui qui… est un fils qui… » restitue naturellement la portée généralisante et caractérisante de la maxime. « Fait honte et attire le déshonneur » est idiomatique et garde la progression parallèle des deux participes finaux.
  terminology: Les termes familiaux, « fils », « honte » et « déshonneur », sont exacts et accessibles en français international. « Opprobre » dans la note convient comme alternative de registre plus soutenu. L’ancre [a] est correctement placée après la phrase et correspond à une véritable alternative lexicale.
