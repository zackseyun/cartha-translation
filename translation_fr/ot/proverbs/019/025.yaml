  yaml_path: translation/ot/proverbs/019/025.yaml
  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
translation:
  language: fr
  text: Frappe le moqueur[a], et le naïf deviendra avisé ; reprends une personne qui a du discernement[b], et elle acquerra de la connaissance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le railleur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une personne intelligente ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « elle comprendra la connaissance ».'
    reason: translation_transparency
lexical_decisions:
- source_word: לֵץ
  choice: le moqueur
  rationale: Dans les Proverbes, le terme désigne une personne méprisante qui tourne la sagesse en dérision. « Moqueur » est courant et conserve cette portée morale.
- source_word: תַּכֶּה
  choice: Frappe
  rationale: Le verbe évoque ici un coup infligé comme châtiment. « Frappe » rend directement le sens sans archaïsme ni intensification excessive.
- source_word: פֶתִי
  choice: le naïf
  rationale: Ce terme sapiential désigne une personne inexpérimentée, crédule et encore malléable. « Le naïf » est plus naturel en français actuel que « le simple ».
- source_word: יַעְרִם
  choice: deviendra avisé
  rationale: La forme verbale exprime l’acquisition de prudence ou de finesse pratique. « Deviendra avisé » conserve la valeur résultative.
- source_word: וְהוֹכִיחַ
  choice: reprends
  rationale: Le verbe désigne une correction formulée en paroles. « Reprendre » convient au registre proverbial et distingue cette action du coup mentionné dans le premier membre.
- source_word: לְנָבוֹן
  choice: la personne qui a du discernement
  rationale: Le substantif qualifie un individu capable de comprendre et de discerner. Cette formulation garde le référent personnel singulier sans ajouter un genre absent du propos sapiential.
- source_word: יָבִין דָּעַת
  choice: elle acquerra la connaissance
  rationale: Littéralement, l’expression associe « comprendre » à « connaissance ». En français, « acquerra la connaissance » exprime naturellement le progrès cognitif visé tout en maintenant la distinction entre discernement déjà présent et connaissance accrue.
