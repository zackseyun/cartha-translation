source:
  edition: WLC
  text: יַסֵּ֣ר בִּ֭נְ/ךָ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ/אֶל הֲ֝מִית֗/וֹ אַל תִּשָּׂ֥א נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
translation:
  language: fr
  text: Corrige ton fils, car il y a de l’espoir[a] ; ne désire pas le faire mourir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tant qu’il y a de l’espoir ». La proposition hébraïque peut exprimer la cause (« car il y a de l’espoir ») ou le temps (« tant qu’il y a de l’espoir »).'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne lève pas ton âme vers le faire mourir ». Cette expression hébraïque évoque une volonté ou une résolution dirigée vers une issue mortelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Corrige
  rationale: Le piel impératif de יסר désigne une correction éducative et disciplinaire. « Corrige » est naturel en français moderne et convient au cadre parental sans suggérer à lui seul un châtiment corporel.
- source_word: בִּנְךָ
  choice: ton fils
  rationale: L’hébreu désigne explicitement le fils ; la traduction conserve cette précision.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: car il y a de l’espoir
  rationale: 'כִּי se comprend naturellement comme causal : l’espoir motive la correction. La valeur temporelle « tant qu’il y a de l’espoir » reste possible et est signalée en note.'
- source_word: וְאֶל הֲמִיתוֹ
  choice: mais ne va pas jusqu’à vouloir sa mort
  rationale: Dans le parallélisme, וְ prend ici une valeur adversative naturelle en français. הֲמִיתוֹ signifie littéralement « le faire mourir » ; « sa mort » s’intègre à l’expression idiomatique choisie sans effacer l’issue mortelle.
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  choice: ne va pas jusqu’à vouloir
  rationale: L’expression, littéralement « ne porte pas ton âme vers », décrit l’orientation de la volonté ou du désir. Cette formulation française restitue l’interdiction d’une résolution destructrice et le contraste avec une correction porteuse d’espoir.
theological_decisions:
- issue: Sens de l’avertissement dans le second membre
  choice: La correction parentale ne doit pas devenir une volonté ou une démarche conduisant à la mort du fils.
  alternative: Ne refuse pas de le corriger, de peur de contribuer à sa mort.
  rationale: La syntaxe hébraïque rattache le mouvement de la נֶפֶשׁ au fait de « le faire mourir » et interdit ainsi d’orienter sa volonté vers cette issue. La lecture faisant de l’absence de correction la cause de sa mort ajoute un lien qui n’est pas exprimé dans le texte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond aux impératifs hébreux au singulier. « Corrige » privilégie une correction éducative sans préciser le moyen employé ; les notes préservent l’ambiguïté causale ou temporelle du premier membre et l’image idiomatique du second.
