id: PRO.19.3
reference: Proverbs 19:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: fr
  text: La folie d’un homme[a] rend sa voie tortueuse[b], et son cœur s’emporte contre Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un nom masculin singulier au sens générique : il s’agit d’une personne en général.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « fausse sa voie » ou « fait dévier son chemin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: folie
  rationale: « Folie » est le terme traditionnel et naturel du registre sapientiel pour désigner l’état ou le comportement opposé à la sagesse.
- source_word: אָדָם
  choice: un homme
  rationale: Le nom singulier est ici générique et présente un individu représentatif. « Un homme » conserve la forme proverbiale du texte, tandis qu’une note précise sa portée générale.
- source_word: תְּסַלֵּף
  choice: rend […] tortueuse
  rationale: Le piel de סלף exprime l’action de tordre, de fausser ou de rendre tortueux. Cette formulation conserve l’image concrète appliquée à la voie d’une personne.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: « Voie » préserve la métaphore sapientielle de la conduite et du cours de la vie, fréquente dans les Proverbes.
- source_word: וְעַל
  choice: et […] contre
  rationale: La coordination et la préposition sont rendues directement, sans transformer explicitement en opposition le rapport laissé implicite en hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » représente le nom divin יהוה au lieu de le remplacer par un titre.
- source_word: יִזְעַף
  choice: s’emporte
  rationale: Le verbe évoque une vive irritation ou une colère indignée. « S’emporte » en restitue l’intensité dans un français naturel.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Le cœur désigne ici le siège intérieur des pensées et des émotions; conserver cette image respecte l’anthropologie du texte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme; la transcription préserve le nom propre sans le remplacer par un titre.
- issue: Portée générique de אדם
  choice: un homme
  alternative: une personne
  rationale: « Un homme » conserve le singulier et la forme du texte source. La note indique clairement que l’énoncé concerne toute personne, sans limiter son application aux hommes.
- issue: Responsabilité humaine et colère contre Dieu
  choice: maintien de la coordination « et »
  alternative: « mais » ou « puis »
  rationale: L’hébreu juxtapose la folie qui déforme la voie humaine et la colère du cœur contre Yahweh. La traduction ne précise pas davantage le lien logique, préservant ainsi la tension du proverbe.
translation_notes:
  register: Français international actuel, sobre et proverbial. « Voie » et « cœur » maintiennent les images caractéristiques de la littérature sapientielle; « rend […] tortueuse » conserve l’image hébraïque tout en restant intelligible.
