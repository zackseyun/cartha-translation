id: PRO.19.9
reference: Proverbs 19:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֖יחַ כְּזָבִ֣ים יֹאבֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
translation:
  language: fr
  text: Le faux témoin ne restera pas impuni[a], et celui qui exhale des mensonges périra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne sera pas acquitté » ou « ne sera pas tenu pour innocent ». Le verbe hébreu peut souligner soit l’absence d’acquittement, soit la certitude de la punition.
    reason: lexical_alternative
  - marker: b
    text: Ou « ira à sa perte ». Le verbe hébreu peut désigner le fait de périr, de disparaître ou de tomber dans la ruine.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: le faux témoin
  rationale: L’expression hébraïque signifie littéralement « témoin de faussetés ». « Le faux témoin » est l’équivalent français naturel et conserve la portée judiciaire.
- source_word: לֹא יִנָּקֶה
  choice: ne restera pas impuni
  rationale: Le niphal de נקה peut exprimer le fait d’être tenu pour innocent, acquitté ou exempté d’une peine. Dans ce proverbe, cette formulation naturelle souligne qu’il n’échappera pas aux conséquences.
- source_word: וְיָפִיחַ
  choice: et celui qui exhale
  rationale: Le participe de פוח évoque l’action de souffler ou de faire sortir avec son souffle. « Exhale » préserve l’image frappante de mensonges émis aussi aisément que le souffle.
- source_word: כְּזָבִים
  choice: des mensonges
  rationale: Le pluriel désigne clairement des paroles mensongères; « des mensonges » est direct et courant en français moderne.
- source_word: יֹאבֵד
  choice: périra
  rationale: Le qal de אבד signifie couramment « périr » ou « disparaître ». « Périra » conserve la force concise de l’avertissement sans préciser artificiellement la forme de la ruine.
theological_decisions:
- issue: Nature de la conséquence annoncée par יֹאבֵד
  choice: périra
  alternative: ira à sa perte
  rationale: Le texte annonce une issue fatale ou une ruine sans en définir précisément les modalités. « Périra » maintient cette portée ouverte et la tension du parallélisme.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme proverbial est conservé. « Exhale des mensonges » garde volontairement la métaphore hébraïque du souffle tout en restant compréhensible.
