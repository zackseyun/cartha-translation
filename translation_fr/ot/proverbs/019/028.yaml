id: PRO.19.28
reference: Proverbs 19:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵ֣ד בְּ֭לִיַּעַל יָלִ֣יץ מִשְׁפָּ֑ט וּ/פִ֥י רְ֝שָׁעִ֗ים יְבַלַּע אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/028.yaml
  text: A worthless witness mocks justice[c][b][a], and the mouth of the wicked swallows iniquity.
translation:
  language: fr
  text: 'Un témoin corrompu[a] se moque de la justice[b],

    et la bouche des méchants engloutit le mal[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un témoin indigne ». On peut aussi traduire littéralement : « un témoin de Bélial », si בְּלִיַּעַל est compris comme un nom propre plutôt que comme un terme décrivant la perversité morale.'
    reason: lexical_alternative
  - marker: b
    text: Ou « tourne le jugement en dérision » ou « se rit du droit ».
    reason: lexical_alternative
  - marker: c
    text: Ou « avale avidement l’iniquité »; le terme hébreu peut aussi désigner la fausseté ou le méfait.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: témoin
  rationale: Le nom désigne celui qui rend témoignage; « témoin » est l’équivalent français naturel dans ce contexte judiciaire.
- source_word: בְּלִיַּעַל
  choice: corrompu
  rationale: Le terme qualifie ici moralement le témoin. « Corrompu » exprime sa perversité et son indignité sans faire de Bélial un nom propre.
- source_word: יָלִיץ
  choice: se moque de
  rationale: Dans ce contexte, la forme verbale exprime le mépris et la dérision; cette tournure est naturelle et conserve la vigueur du proverbe.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Le mot peut désigner le jugement, la décision judiciaire ou la justice. Ici, « justice » rend bien sa portée à la fois juridique et morale.
- source_word: פִי
  choice: la bouche de
  rationale: La traduction conserve l’image corporelle explicite de l’hébreu ainsi que le parallélisme du verset.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé pluriel désigne collectivement les personnes mauvaises; « les méchants » convient au style proverbial.
- source_word: יְבַלַּע
  choice: engloutit
  rationale: Le verbe signifie avaler ou dévorer. « Engloutit » préserve l’image forte liée à la bouche et peut suggérer l’avidité.
- source_word: אָוֶן
  choice: le mal
  rationale: Le nom peut évoquer le mal, l’iniquité, le méfait ou la fausseté. « Le mal » reste clair et suffisamment large pour ne pas réduire l’ambiguïté du terme.
theological_decisions:
- issue: Statut de בְּלִיַּעַל
  choice: Nom commun à valeur qualificative (« corrompu »)
  alternative: Nom propre (« Bélial »)
  rationale: Dans ce proverbe, le mot qualifie naturellement le témoin; le traiter comme le nom propre plus tardif « Bélial » importerait une personnification qui n’est pas exigée par le contexte.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme et l’image concrète de la bouche qui engloutit sont conservés; le vocabulaire reste accessible tout en maintenant la gravité morale du texte.
