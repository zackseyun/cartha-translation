id: PRO.19.11
reference: Proverbs 19:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
translation:
  language: fr
  text: Le bon sens d’un homme le rend lent à la colère[a], et c’est tout à son honneur de passer outre à une offense[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « allonge son nez », une expression qui évoque la patience et une colère qui tarde à éclater.
    reason: idiome
  - marker: b
    text: Ou « de ne pas tenir compte d’une offense » ; littéralement « de passer par-dessus une transgression ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל
  choice: bon sens
  rationale: Le terme désigne ici une intelligence pratique, un jugement avisé qui conduit à la maîtrise de soi. « Bon sens » est naturel et concret en français moderne.
- source_word: אָדָם
  choice: un homme
  rationale: Le nom désigne ici un être humain individuel de manière générique. « Un homme » conserve la forme du texte hébreu sans limiter la portée générale du proverbe.
- source_word: הֶאֱרִיךְ אַפּוֹ
  choice: le rend lent à la colère
  rationale: L’expression signifie littéralement « allonge son nez » et constitue un idiome hébreu évoquant une colère qui tarde à éclater, donc la patience.
- source_word: וְתִפְאַרְתּוֹ
  choice: c’est pour lui un honneur
  rationale: תִפְאֶרֶת peut évoquer la splendeur, la gloire ou l’honneur. Dans ce contexte moral, « honneur » exprime naturellement ce qui fait la dignité et le mérite d’une personne.
- source_word: עֲבֹר עַל
  choice: passer par-dessus
  rationale: Cette formulation garde l’image de « passer au-dessus » d’une faute, sans renforcer le texte jusqu’au sens plus explicite de « pardonner ».
- source_word: פָּשַׁע
  choice: une offense
  rationale: Dans ce cadre relationnel, le mot désigne une faute commise contre quelqu’un. « Offense » garde la gravité du tort tout en restant idiomatique.
theological_decisions:
- issue: Portée de l’expression עֲבֹר עַל פָּשַׁע
  choice: passer par-dessus une offense
  alternative: pardonner une faute
  rationale: Le texte valorise le fait de ne pas s’arrêter à un tort, mais n’emploie pas le vocabulaire hébreu explicite du pardon. La traduction préserve cette nuance sans imposer une définition théologique plus précise.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale en deux membres est conservée. « Bon sens » privilégie l’intelligence pratique ; « passer par-dessus » maintient l’image hébraïque tout en restant compréhensible, avec une note proposant une formulation plus idiomatique.
