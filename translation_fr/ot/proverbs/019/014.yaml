source:
  edition: WLC
  text: בַּ֣יִת וָ֭/הוֹן נַחֲלַ֣ת אָב֑וֹת וּ֝/מֵ/יְהוָ֗ה אִשָּׁ֥ה מַשְׂכָּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
translation:
  language: fr
  text: Maison et richesse sont un héritage reçu des pères, mais une femme avisée[a] vient de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épouse avisée ». Le mot hébreu peut désigner une femme ou une épouse ; dans ce contexte, « épouse » convient probablement au contraste avec les biens hérités.
    reason: alternative lexicale
lexical_decisions:
- source_word: בַּיִת
  choice: maison
  rationale: Le nom désigne ici vraisemblablement une maison ou un bien immobilier, en parallèle avec la richesse; « maison » conserve ce sens concret.
- source_word: הוֹן
  choice: richesse
  rationale: Dans la littérature sapientielle, le terme désigne les biens matériels ou la fortune; « richesse » est naturel et clair en français moderne.
- source_word: נַחֲלַת
  choice: un héritage reçu
  rationale: Le substantif à l’état construit exprime ce qui est transmis par les pères. L’ajout de « reçu » rend naturellement en français la relation de provenance sans changer le sens.
- source_word: אָבוֹת
  choice: des pères
  rationale: L’hébreu porte explicitement le masculin pluriel et évoque le cadre ancestral de la transmission patrimoniale; « pères » préserve cette formulation.
- source_word: מֵיְהוָה
  choice: vient de Yahweh
  rationale: La préposition מִן marque la provenance. Le nom divin יהוה est translittéré « Yahweh » conformément à la politique de traduction indiquée.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le terme peut signifier « femme » ou « épouse ». Le français « une femme » préserve l’ambiguïté lexicale authentique, tandis que le contexte matrimonial possible est signalé en note.
- source_word: מַשְׂכָּלֶת
  choice: avisée
  rationale: Le participe dérivé de שׂכל évoque le discernement et le bon sens pratique. « Avisée » convient au registre sapientiel et s’accorde naturellement avec « femme ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Sens de אִשָּׁה dans le contraste du proverbe
  choice: femme dans le texte, avec épouse en note
  alternative: épouse
  rationale: Le contexte favorise fortement le sens d’« épouse », opposée aux biens hérités, mais le nom hébreu garde formellement les deux possibilités. La traduction principale préserve cette tension et la note explicite la lecture contextuelle.
- issue: Nature du contraste
  choice: les biens viennent de la lignée familiale, tandis que la femme avisée vient de Yahweh
  alternative: assimiler la femme à une autre forme d’héritage
  rationale: La conjonction וּ, rendue ici par « mais », met en relief le contraste entre transmission humaine du patrimoine et provenance divine de la femme avisée, sans présenter celle-ci comme un bien possédé.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure équilibrée des deux propositions est conservée. « Avisée » exprime le discernement pratique sans vocabulaire archaïque; « vient de » restitue clairement la provenance marquée par l’hébreu.
