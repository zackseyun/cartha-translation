  text: יִרְאַ֣ת יְהוָ֣ה לְ/חַיִּ֑ים וְ/שָׂבֵ֥עַ יָ֝לִ֗ין בַּל יִפָּ֥קֶד רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
translation:
  language: fr
  text: La crainte de Yahweh mène à la vie[a] ; rassasié, on passe la nuit et l’on n’est pas atteint par le malheur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est pour la vie » ou « conduit à la vie » ; l’expression hébraïque est très concise.
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « le malheur ne le visitera pas ». Ici, le « mal » désigne le malheur ou le tort subi, et non le mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: crainte
  rationale: Le nom construit avec יְהוָה désigne la crainte révérencielle et l’attachement respectueux envers Dieu. « Crainte » conserve toute la force du terme hébreu, que « respect » ou « révérence » risqueraient d’atténuer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְחַיִּים
  choice: mène à la vie
  rationale: La construction concise avec לְ peut exprimer la destination ou le résultat. « Mène à la vie » est naturel en français et garde la portée large de « vie » dans la littérature sapientielle.
- source_word: וְשָׂבֵעַ
  choice: rassasié
  rationale: Le terme signifie être repu ou satisfait. « Rassasié » conserve l’image concrète tout en pouvant évoquer un état de contentement.
- source_word: יָלִין
  choice: passe la nuit
  rationale: Le verbe désigne littéralement le fait de loger ou de passer la nuit. Cette traduction préserve l’image d’un repos nocturne paisible sans la réduire au seul fait de dormir.
- source_word: בַּל
  choice: ne… pas
  rationale: Cette particule négative poétique est rendue directement, sans ajouter l’emphase de « jamais ».
- source_word: יִפָּקֶד רָע
  choice: ne sera pas atteint par le malheur
  rationale: Le niphal de פקד associé à רָע évoque une visitation adverse. Cette formulation française naturelle conserve l’idée qu’un malheur ne vient pas frapper la personne.
theological_decisions:
- issue: Portée du mot « vie »
  choice: Conserver « vie » dans son ampleur sapientielle, sans la limiter à la longévité, à la prospérité matérielle ou à la vie éternelle.
  alternative: Préciser « longue vie », « bien-être » ou « vie éternelle ».
  rationale: Dans les Proverbes, la vie peut englober l’existence, l’épanouissement et le bien-être conformes à l’ordre de Dieu. Le texte hébreu ne justifie pas une restriction doctrinale.
- issue: Caractère apparemment absolu de la protection contre le malheur
  choice: Traduire l’affirmation proverbiale telle quelle, avec « ne sera pas atteint par le malheur ».
  alternative: Atténuer explicitement par « en général » ou interpréter comme une exemption absolue de toute souffrance.
  rationale: La maxime énonce de manière condensée une vérité générale de sagesse. Il convient de préserver sa force sans lui ajouter ni réserve explicite ni doctrine garantissant l’absence totale d’épreuves.
- issue: Sujet implicite de « passe la nuit rassasié »
  choice: Expliciter par « celui qui l’éprouve », en renvoyant à la crainte de Yahweh.
  alternative: 'Garder une formulation impersonnelle très littérale : « rassasié, il passe la nuit ».'
  rationale: L’hébreu enchaîne des prédicats de façon concise sans exprimer le sujet. L’explicitation rend la relation intelligible en français sans modifier le sens probable.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Yahweh » conserve le nom divin. La formulation reste accessible tout en maintenant l’image concrète de la nuit, la portée sapientielle de « vie » et la tension de la promesse finale.
