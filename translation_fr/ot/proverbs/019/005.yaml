id: PRO.19.5
reference: Proverbs 19:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים לֹ֣א יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: fr
  text: Le faux témoin ne restera pas impuni[a], et celui qui profère des mensonges[b] n’échappera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne sera pas tenu pour innocent » ou « ne sera pas acquitté ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « souffle des mensonges », image de quelqu’un qui les dit continuellement ou avec facilité; autre traduction possible : « débite des mensonges ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: le faux témoin
  rationale: Cette expression construite désigne un témoin caractérisé par le mensonge. « Faux témoin » est l’expression française naturelle et conserve clairement le cadre testimonial ou judiciaire.
- source_word: יִנָּקֶה
  choice: ne restera pas impuni
  rationale: Au niphal, נקה peut signifier être exempt de peine ou tenu pour innocent. Ici, « ne restera pas impuni » exprime naturellement la conséquence morale et judiciaire, sans réduire le sens à un acquittement strictement technique.
- source_word: וְיָפִיחַ כְּזָבִים
  choice: et celui qui profère des mensonges
  rationale: Le hiphil de פוח évoque littéralement le fait de souffler ou d’exhaler, puis, figurativement, de faire sortir des paroles. « Profère » rend clairement l’acte répété ou libre de dire des mensonges; l’image littérale est signalée en note.
- source_word: כְּזָבִים
  choice: des mensonges
  rationale: Le pluriel désigne des paroles fausses. « Mensonges » est direct, courant et forme un parallèle naturel avec « faux témoin ».
- source_word: יִמָּלֵט
  choice: n’échappera pas
  rationale: Le niphal de מלט signifie échapper ou être délivré. « N’échappera pas » conserve la formulation ouverte du texte quant à ce à quoi le menteur ne pourra échapper, tout en répondant au premier hémistiche.
theological_decisions:
- issue: Nature précise de la sanction ou de l’issue judiciaire
  choice: Conserver les formulations générales « ne restera pas impuni » et « n’échappera pas »
  alternative: Préciser un acquittement judiciaire ou un châtiment divin explicite
  rationale: Le verset affirme la certitude des conséquences sans nommer explicitement l’agent, la forme de la sanction ni le tribunal. La traduction ne doit pas résoudre cette ouverture théologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme hébreu est conservé. « Profère » maintient un registre digne sans être technique; la note restitue l’image concrète du souffle.
