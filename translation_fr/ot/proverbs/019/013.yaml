  text: הַוֺּ֣ת לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וְ/דֶ֥לֶף טֹ֝רֵ֗ד מִדְיְנֵ֥י אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
translation:
  language: fr
  text: Un fils insensé est un malheur pour son père, et les querelles d’une femme sont un goutte-à-goutte incessant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un fils insensé est un désastre pour son père, et les disputes d’une épouse sont un goutte-à-goutte constant. »'
    reason: « Désastre » est une autre possibilité pour הַוּוֹת; « épouse » explicite l’interprétation conjugale possible de אִשָּׁה; « disputes » et « constant » sont des équivalents lexicaux possibles.
lexical_decisions:
- source_word: הַוּוֹת
  choice: malheur
  rationale: Le pluriel peut avoir une valeur intensive ou abstraite et désigner désastre, ruine ou calamité. « Fait le malheur » exprime naturellement en français l’effet destructeur sur le père sans exiger une ruine matérielle.
- source_word: לְאָבִיו
  choice: de son père
  rationale: Dans la tournure française « faire le malheur de quelqu’un », le complément rend naturellement la relation et l’impact marqués par לְ.
- source_word: בֵּן כְּסִיל
  choice: un fils insensé
  rationale: Dans les Proverbes, כְּסִיל caractérise une folie morale et pratique, et non un simple manque d’intelligence. « Insensé » conserve cette portée dans un registre digne.
- source_word: דֶּלֶף טֹרֵד
  choice: une gouttière qui coule sans cesse
  rationale: דֶּלֶף évoque l’écoulement répétitif provenant d’une fuite, tandis que טֹרֵד en souligne le caractère persistant. Cette image concrète est idiomatique et immédiatement compréhensible en français.
- source_word: מִדְיְנֵי
  choice: les querelles
  rationale: Le pluriel désigne des disputes ou contestations répétées. « Querelles » est courant et garde la force négative du terme.
- source_word: אִשָּׁה
  choice: d’une femme
  rationale: Le nom hébreu peut signifier « femme » ou « épouse ». Sans détermination possessive explicite dans ce verset, « femme » préserve l’ambiguïté lexicale du texte source.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. « Insensé » maintient la dimension morale du vocabulaire sapientiel. L’image concrète d’une gouttière qui coule sans cesse rend la nuisance domestique persistante, tandis que la note conserve des équivalents plus littéraux et l’interprétation possible « épouse ».
