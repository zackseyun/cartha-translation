id: PRO.19.21
reference: Proverbs 19:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַבּ֣וֹת מַחֲשָׁב֣וֹת בְּ/לֶב אִ֑ישׁ וַ/עֲצַ֥ת יְ֝הוָ֗ה הִ֣יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
translation:
  language: fr
  text: Nombreux sont les projets[a] dans le cœur d’un homme, mais le dessein de Yahvé, lui, s’accomplira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pensées » ou « intentions » au lieu de « projets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Nombreux sont
  rationale: L’adjectif prédicatif placé en tête met l’accent sur la multiplicité et conserve la tournure sentencieuse de l’hébreu.
- source_word: מַחֲשָׁבוֹת
  choice: projets
  rationale: Le nom peut désigner des pensées, des intentions ou des plans élaborés. « Projets » convient au contraste avec le dessein arrêté de Yahvé sans réduire le terme à de simples idées.
- source_word: בְּלֶב אִישׁ
  choice: dans le cœur d’un homme
  rationale: « Cœur » conserve l’anthropologie hébraïque, où il est le siège de la réflexion et de la volonté. Le masculin singulier représentatif de אִישׁ est maintenu.
- source_word: וַעֲצַת
  choice: mais le dessein de
  rationale: La conjonction introduit ici une opposition. « Dessein » exprime un conseil devenu intention ou orientation arrêtée et forme un contraste naturel avec les multiples projets humains.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve sa référence personnelle et alliancélle.
- source_word: הִיא
  choice: lui
  rationale: Le pronom hébreu reprend avec emphase le nom féminin עֲצַת. Le pronom disjoint « lui » restitue cette mise en relief en français et s’accorde avec « dessein ».
- source_word: תָקוּם
  choice: se réalisera
  rationale: Dans ce contexte, קום indique que le dessein tient, prévaut et devient effectif. « Se réalisera » rend naturellement cette efficacité en français, sans développer une théorie de la causalité.
theological_decisions:
- issue: Projets humains et dessein divin
  choice: Le verset oppose la multiplicité des projets humains au dessein de Yahvé, qui seul est présenté comme devenant effectivement réalité.
  alternative: Une paraphrase déterministe plus forte, telle que « Dieu détermine tout ce qui arrive », ou une formulation statique comme « subsistera ».
  rationale: L’hébreu affirme l’efficacité décisive du dessein de Yahvé, mais ne précise pas ici tous les rapports de causalité entre la volonté divine et les décisions humaines. La traduction préserve cette tension sans l’élargir en système doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. La structure initiale « Nombreux sont » conserve l’emphase et le caractère proverbial de l’hébreu. « Yahvé » rend explicitement le tétragramme.
