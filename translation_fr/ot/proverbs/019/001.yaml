  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ שְׂ֝פָתָ֗י/ו וְ/ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: fr
  text: Mieux vaut un pauvre qui marche dans son intégrité qu’un homme aux lèvres perverses et insensé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’un insensé aux lèvres perverses ». La syntaxe hébraïque permet de comprendre la dernière expression, « et il est insensé », comme une désignation plus compacte de la personne mise en contraste.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « marche dans son intégrité ». Dans la Bible hébraïque, « marcher » est une image qui désigne la manière de vivre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Rend naturellement en français la formule comparative proverbiale qui affirme qu’une situation est préférable à une autre.
- source_word: רָשׁ
  choice: un pauvre
  rationale: Le terme désigne une personne pauvre; le masculin singulier correspond à la forme hébraïque et au contraste entre deux individus.
- source_word: הוֹלֵךְ
  choice: qui marche
  rationale: Conserve la métaphore hébraïque courante de la marche pour désigner la conduite et la manière de vivre.
- source_word: בְּתֻמּוֹ
  choice: dans son intégrité
  rationale: Le terme évoque la droiture et l’entier caractère moral, sans impliquer nécessairement une absence totale de péché.
- source_word: מֵעִקֵּשׁ
  choice: qu’un homme … tortueuses
  rationale: La préposition introduit le second terme de la comparaison; l’adjectif exprime ce qui est tordu ou pervers sur le plan moral.
- source_word: שְׂפָתָיו
  choice: aux lèvres tortueuses
  rationale: Préserve l’image concrète des « lèvres » tout en constituant en français une expression intelligible pour une parole fausse ou perverse.
- source_word: וְהוּא כְסִיל
  choice: et qui est insensé
  rationale: Maintient la coordination explicite de l’hébreu et rattache naturellement la qualification au second personnage sans effacer l’ambiguïté syntaxique.
