  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
translation:
  language: fr
  text: Le paresseux enfouit sa main dans le plat[a] ; il ne la ramène même pas à sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’écuelle » ou « dans le bol ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: enfouit
  rationale: Le verbe signifie « cacher, dissimuler, enfouir ». « Enfouit » conserve l’image concrète et volontairement exagérée du proverbe.
- source_word: עָצֵל
  choice: le paresseux
  rationale: Terme caractéristique de la littérature sapientielle pour une personne habituellement paresseuse ; la formulation est concise, naturelle et proverbiale en français moderne.
- source_word: יָדוֹ
  choice: sa main
  rationale: Reproduction directe du singulier et de la relation possessive de l’hébreu.
- source_word: בַּצַּלָּחַת
  choice: dans le plat
  rationale: Le nom désigne un récipient servant à présenter ou contenir la nourriture, plat ou écuelle ; « plat » est courant et n’en précise pas excessivement la forme.
- source_word: גַּם
  choice: même
  rationale: 'La particule a ici une valeur intensive : elle souligne l’absurdité de ne pas accomplir jusqu’au geste minimal suivant.'
- source_word: אֶל־פִּיהוּ
  choice: à sa bouche
  rationale: Traduction concrète du mot hébreu « bouche », conforme à la scène du repas.
- source_word: לֹא יְשִׁיבֶנָּה
  choice: il ne la ramène pas
  rationale: Le hiphil de שוב exprime le fait de faire revenir ou de ramener. Le pronom féminin renvoie à « main » ; « la ramène » restitue clairement ce lien en français.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne, avec une tournure concise adaptée au registre proverbial. « Enfouit » maintient l’hyperbole saisissante de l’hébreu sans l’aplanir.
