  text: רַ֭בִּים יְחַלּ֣וּ פְנֵֽי נָדִ֑יב וְ/כָל הָ֝/רֵ֗עַ לְ/אִ֣ישׁ מַתָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/006.yaml
  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: fr
  text: Beaucoup cherchent à gagner la faveur d’un noble[a], et chacun est l’ami d’un homme qui fait des cadeaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un homme généreux ». Le mot hébreu peut désigner un noble, un prince ou une personne généreuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « d’un homme de don » : un homme caractérisé par les présents qu’il donne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Beaucoup
  rationale: Rend avec concision le quantificateur pluriel dans le style proverbial.
- source_word: יְחַלּוּ פְנֵי
  choice: recherchent la faveur de
  rationale: Cette expression idiomatique signifie solliciter, rechercher ou tenter de gagner la faveur de quelqu’un; une traduction littérale par «adoucir le visage» serait obscure en français.
- source_word: נָדִיב
  choice: un homme généreux
  rationale: Le mot peut désigner un noble ou un prince, mais aussi une personne généreuse. Le parallélisme avec l’homme qui fait des cadeaux favorise ici la nuance de générosité, sans supprimer l’autre possibilité, signalée en note.
- source_word: וְכָל הָרֵעַ
  choice: et tout le monde est l’ami
  rationale: Formulation française naturelle qui conserve la généralisation forte et l’idée de relation amicale exprimée par רֵעַ.
- source_word: לְאִישׁ מַתָּן
  choice: d’un homme qui fait des cadeaux
  rationale: Déploie naturellement en français la construction concise «homme de don/cadeau», c’est-à-dire un homme caractérisé par le fait de donner des présents.
