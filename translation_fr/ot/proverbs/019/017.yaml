source:
  edition: WLC
  text: מַלְוֵ֣ה יְ֭הוָה ח֣וֹנֵֽן דָּ֑ל וּ֝/גְמֻל֗/וֹ יְשַׁלֶּם לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/017.yaml
  text: Whoever is gracious to the poor lends to Yahweh[a], and he will repay him for his deed.
translation:
  language: fr
  text: 'Qui est généreux envers le pauvre prête à Yahweh,

    et Yahweh lui rendra son bienfait.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et sa rétribution, il la lui rendra ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְוֵה
  choice: prête
  rationale: Le participe hiphil de לוה signifie « prêter ». La formulation conserve la métaphore forte du prêt, au lieu de la réduire à l’idée générale de donner.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver sa valeur de nom propre dans le texte hébreu.
- source_word: חֹנֵן
  choice: fait grâce à
  rationale: Le participe qal de חנן exprime le fait d’accorder faveur ou grâce. « Faire grâce à » maintient ce champ lexical tout en restant compréhensible en français.
- source_word: דָּל
  choice: le pauvre
  rationale: דָּל peut désigner une personne pauvre, faible ou démunie. Ici, « le pauvre » rend naturellement sa portée socioéconomique dans la littérature sapientiale.
- source_word: וּגְמֻלוֹ
  choice: son bienfait
  rationale: גְּמוּל peut désigner l’acte accompli, le bienfait ou la rétribution. « Son bienfait » renvoie ici à l’acte favorable envers le pauvre et permet de conserver l’objet antéposé du texte hébreu.
- source_word: יְשַׁלֶּם
  choice: rendra
  rationale: Le piel de שלם signifie ici rendre, rembourser ou rétribuer. Avec « bienfait », « rendra » est naturel et prolonge implicitement l’image du prêt.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom renvoie le plus naturellement à la personne qui fait grâce au pauvre; le français « lui » reproduit aussi la construction indirecte de l’hébreu.
theological_decisions:
- issue: Rapport métaphorique entre la générosité envers le pauvre et Yahweh
  choice: L’acte de faveur envers le pauvre est présenté comme un prêt consenti à Yahweh, qui rendra lui-même le bienfait à son auteur.
  alternative: Paraphraser en disant seulement que Dieu voit et récompense la générosité.
  rationale: Le texte hébreu emploie explicitement la métaphore du prêt et fait de Yahweh celui à qui l’on prête. Cette tension théologique doit être conservée sans développement doctrinal supplémentaire.
- issue: Référent du sujet implicite de יְשַׁלֶּם
  choice: Yahweh est compris comme le sujet de « rendra ».
  alternative: Laisser le sujet entièrement indéterminé ou le rapporter au pauvre.
  rationale: Yahweh est l’antécédent syntaxique et sémantique le plus naturel, et la logique du prêt appelle son remboursement par celui qui l’a reçu métaphoriquement.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme et la métaphore financière sont préservés. « Faire grâce au pauvre » est légèrement soutenu, mais dignifié et fidèle au champ lexical de חנן.
