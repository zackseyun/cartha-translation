  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/016.yaml
  text: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
translation:
  language: fr
  text: Qui observe le commandement préserve sa vie[a] ; qui méprise ses voies[b] sera mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner la vie, la personne elle-même ou, selon le contexte, l’âme.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses voies ». Le suffixe peut renvoyer à la propre conduite de la personne ; certains le rapportent aux voies de Dieu ou à la voie prescrite par le commandement.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר מִצְוָה
  choice: observe le commandement
  rationale: « Observer » exprime en français courant l’obéissance attentive et durable impliquée par שֹׁמֵר, tandis que le singulier « le commandement » conserve la formulation générique et solennelle de מִצְוָה.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: préserve sa vie
  rationale: La répétition de שֹׁמֵר prend ici naturellement le sens de protéger ou préserver. Dans le contraste avec la mort, נֶפֶשׁ désigne surtout la vie ou la personne vivante, sans imposer le sens technique d’une âme immatérielle.
- source_word: בּוֹזֵה
  choice: méprise
  rationale: Le verbe exprime le dédain ou le peu de cas que l’on fait de quelque chose ; « méprise » en conserve la force morale.
- source_word: דְרָכָיו
  choice: sa propre conduite
  rationale: Le pluriel hébreu « ses chemins/voies » désigne idiomatiquement la manière de vivre. « Sa propre conduite » rend explicite le référent le plus naturel du suffixe, à savoir le sujet lui-même, tout en signalant en note les autres lectures possibles.
- source_word: יומת
  choice: sera mis à mort
  rationale: La forme hophal est passive et signifie littéralement « sera mis à mort ». Cette traduction conserve la forme verbale sans préciser l’agent.
theological_decisions:
- issue: Référent du suffixe dans דְרָכָיו (« ses voies »)
  choice: la conduite propre du sujet
  alternative: les voies de Dieu, ou plus généralement la voie tracée par le commandement
  rationale: Le suffixe masculin singulier peut naturellement renvoyer au sujet de la proposition. Comme Dieu n’est pas nommé dans le texte, la traduction n’ajoute pas explicitement ce référent théologique, mais la note préserve l’ambiguïté.
- issue: Sens de נֶפֶשׁ
  choice: vie
  alternative: âme ; personne elle-même
  rationale: Le parallélisme avec la mise à mort favorise le sens concret de « vie ». Ce choix évite d’introduire dans le proverbe une anthropologie doctrinale plus tardive.
- issue: Valeur de יומת
  choice: sera mis à mort
  alternative: mourra
  rationale: Le passif hébreu est conservé, sans identifier celui qui exécute ou provoque la sentence. « Mourra » exprimerait bien l’issue proverbiale, mais atténuerait la forme passive du texte consonantique transmis.
translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale en deux membres est conservée. « Sa propre conduite » est plus idiomatique que le calque « ses voies », tandis que les sens possibles de l’expression hébraïque sont maintenus en note.
