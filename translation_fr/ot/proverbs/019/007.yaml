    issue: Ajout de « plus » dans la dernière clause
    rationale: Le texte hébreu difficile לֹא הֵמָּה n’exprime pas explicitement un changement temporel. « Elles ne sont pas là » conserve mieux l’absence sans ajouter cette nuance.
  - severity: low
    issue: Ancre de la note culturelle mal placée
    rationale: La note a explique « frères » mais son appel se trouve après « haïssent ». Il doit suivre « frères ».
  - severity: low
    issue: Formulation potentiellement interrogative
    rationale: L’inversion « se tiennent-ils » est grammaticalement possible dans une déclaration soutenue, mais elle est moins naturelle et peut suggérer une question. Une tournure sans inversion est plus claire.
