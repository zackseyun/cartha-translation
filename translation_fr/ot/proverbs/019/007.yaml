source:
  edition: WLC
  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: fr
  text: Tous les frères[a] du pauvre le haïssent ; à plus forte raison, ses amis s’éloignent de lui ! Il poursuit des paroles, mais elles ne sont pas là.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « frères » est au masculin. Dans le cadre social du proverbe, il désigne les frères et, plus largement selon le contexte, les membres de la famille.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Il poursuit des paroles qui ne sont rien », ou : « Il court après des promesses, mais elles ne sont pas là. » La dernière proposition est difficile du point de vue du texte et de la syntaxe hébraïques.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשׁ
  choice: le pauvre
  rationale: Le nom désigne ici un homme pauvre ou démuni. Le singulier défini est naturel dans la formulation proverbiale française et conserve la valeur générique du masculin hébreu.
- source_word: אֲחֵי
  choice: frères
  rationale: Le terme signifie littéralement « frères » et maintient la force du lien familial, plus précise que « proches » ou « parents ».
- source_word: שְׂנֵאֻהוּ
  choice: le haïssent
  rationale: Le verbe שׂנא exprime normalement la haine ; « méprisent » en atténuerait la force.
- source_word: אַף כִּי
  choice: à plus forte raison
  rationale: 'Cette locution rend clairement le raisonnement a fortiori : si même ses frères le haïssent, ses amis s''éloignent d''autant plus.'
- source_word: מְרֵעֵהוּ
  choice: ses amis
  rationale: Le terme désigne des compagnons ou des amis ; « amis » forme ici un contraste naturel avec « frères ».
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: se tiennent loin de lui
  rationale: Cette formulation conserve l'idée d'éloignement, notamment relationnel, sans surinterpréter le verbe.
- source_word: מְרַדֵּף
  choice: Il poursuit
  rationale: Le participe est syntaxiquement difficile. Le rendre par une proposition verbale poursuivant le portrait du pauvre produit un français intelligible tout en gardant sa valeur durative.
- source_word: אֲמָרִים
  choice: des paroles
  rationale: Le nom signifie littéralement « paroles » ou « propos ». Le contexte peut suggérer des promesses ou assurances, mais le texte principal préserve l'indétermination lexicale.
- source_word: לֹא הֵמָּה
  choice: elles ne sont plus là
  rationale: La formule finale est très concise et difficile. Cette traduction rapporte naturellement le pronom aux « paroles » et exprime leur absence sans décider qu'elles seraient mensongères ou sans valeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure proverbiale et la progression a fortiori sont maintenues. Le masculin générique « le pauvre » reflète le singulier masculin hébreu sans élargir explicitement le référent. La clause finale reste volontairement proche et ambiguë, avec ses principales interprétations signalées en note.
