revisions:
- from: Tous les frères du pauvre le haïssent[a] ; à plus forte raison, ses amis se tiennent-ils loin de lui ! Il poursuit des paroles, mais elles ne sont plus là.[b]
  to: Tous les frères[a] du pauvre le haïssent ; à plus forte raison, ses amis s’éloignent de lui ! Il poursuit des paroles, mais elles ne sont pas là.[b]
  rationale: La révision supprime l’ajout temporel non exprimé par l’hébreu, rend la seconde proposition plus naturelle sans modifier son rapport a fortiori, et replace la note culturelle sur le mot qu’elle explique. La note finale maintient explicitement l’incertitude textuelle et syntaxique.
