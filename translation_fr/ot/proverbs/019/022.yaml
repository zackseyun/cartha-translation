  text: תַּאֲוַ֣ת אָדָ֣ם חַסְדּ֑/וֹ וְ/טֽוֹב רָ֝שׁ מֵ/אִ֥ישׁ כָּזָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/022.yaml
  text: What is desired in a man is his steadfast love[b][a], and a poor man is better than a liar.
translation:
  language: fr
  text: Ce qu’on recherche chez une personne, c’est son amour fidèle[a][b] ; mieux vaut un pauvre qu’un menteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le désir d’une personne, c’est son amour fidèle. » La première partie du verset est concise en hébreu : elle peut décrire ce qui est recherché chez une personne ou identifier son désir à son amour fidèle.'
    reason: alternative_reading
  - marker: b
    text: L’expression « amour fidèle » traduit חֶסֶד, terme riche qui peut aussi signifier « bonté », « loyauté » ou « attachement fidèle », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Ce qu’on recherche
  rationale: Le nom peut désigner soit le désir, soit ce qui est désiré. Cette formulation exprime naturellement en français la lecture prédicative probable, sans masquer l’autre lecture, signalée en note.
- source_word: אָדָם
  choice: chez une personne
  rationale: Dans cette maxime de sagesse, le terme désigne un être humain pris individuellement et de manière générique. « Une personne » rend ce sens en français moderne sans suggérer que l’énoncé ne concerne que les hommes.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement et fidélité relationnelle. « Amour fidèle » conserve cette richesse morale sans introduire ici une notion d’alliance plus précise que le contexte.
- source_word: וְטוֹב
  choice: mieux vaut
  rationale: La conjonction et l’adjectif introduisent une comparaison. La tournure proverbiale française « mieux vaut » en restitue clairement et sobrement la force.
- source_word: רָשׁ
  choice: un pauvre
  rationale: Le mot désigne une personne pauvre. Employé substantivement, « un pauvre » garde la forme concise et proverbiale du texte hébreu.
- source_word: מֵאִישׁ כָּזָב
  choice: qu’un menteur
  rationale: La préposition marque le terme de comparaison, tandis que אִישׁ כָּזָב décrit un homme caractérisé par le mensonge. « Un menteur » est concis, idiomatique et fidèle au sens.
theological_decisions:
- issue: Ambiguïté de la première proposition
  choice: 'Lecture prédicative : ce qui est recherché chez une personne est son amour fidèle'
  alternative: « Le désir d’une personne, c’est son amour fidèle » ou « Ce qu’une personne désire, c’est son amour fidèle »
  rationale: La construction hébraïque est très concise et autorise plusieurs relations syntaxiques entre « désir », « personne » et « amour fidèle ». Le texte principal retient une lecture probable et naturelle, tandis que la note préserve l’autre possibilité sans trancher artificiellement.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « mieux vaut… » conserve le caractère bref de la maxime. Le vocabulaire reste accessible tout en maintenant l’ambiguïté réelle du premier vers dans une note.
