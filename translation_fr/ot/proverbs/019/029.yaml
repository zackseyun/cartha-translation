  text: נָכ֣וֹנוּ לַ/לֵּצִ֣ים שְׁפָטִ֑ים וּ֝/מַהֲלֻמ֗וֹת לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/029.yaml
  text: Judgments are prepared for scoffers[a], and beatings for the back of fools.
translation:
  language: fr
  text: Des jugements sont préparés pour les moqueurs[a], et des coups pour le dos des insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des sanctions sont prévues pour les railleurs, et des coups pour le dos des insensés. »'
    reason: 'Alternative lexicale pour נָכֹנוּ, לֵצִים et שְׁפָטִים : « prévus », « railleurs » et « sanctions » explicitent respectivement les nuances d’établissement, de dérision méprisante et de portée punitive.'
lexical_decisions:
- source_word: נָכוֹנוּ
  choice: sont prêts
  rationale: Le niphal accompli pluriel de כון exprime ici ce qui est disposé, établi ou tenu prêt. « Sont prêts » rend naturellement l’idée que ces sanctions attendent leurs destinataires.
- source_word: לַלֵּצִים
  choice: pour les moqueurs
  rationale: לץ désigne ceux qui tournent autrui ou la sagesse en dérision avec arrogance. « Moqueurs » est actuel, clair et conserve la portée morale du terme dans les Proverbes.
- source_word: שְׁפָטִים
  choice: les jugements
  rationale: משפטים peut désigner des décisions judiciaires ou, comme ici en parallèle avec les coups, des sanctions. « Jugements » préserve l’étendue lexicale et laisse le contexte en préciser la dimension punitive.
- source_word: וּמַהֲלֻמוֹת
  choice: les coups
  rationale: Le nom désigne des coups portés. « Coups » rend directement le pluriel sans imposer l’idée plus précise de flagellation.
- source_word: לְגֵו
  choice: pour le dos
  rationale: גֵּו peut désigner le dos ou le tronc. Avec des coups, « le dos » est concret et idiomatique; le singulier collectif reflète le nom hébreu singulier.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: 'כסיל est une catégorie sapientielle: la personne moralement obtuse et réfractaire à la sagesse, et non seulement peu intelligente. « Insensés » garde cette portée traditionnelle et morale.'
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme hébreu est conservé, de même que l’ambiguïté entre jugement judiciaire et sanction punitive.
