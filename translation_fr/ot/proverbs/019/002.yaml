  text: גַּ֤ם בְּ/לֹא דַ֣עַת נֶ֣פֶשׁ לֹא ט֑וֹב וְ/אָ֖ץ בְּ/רַגְלַ֣יִם חוֹטֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/002.yaml
  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
translation:
  language: fr
  text: De plus, le désir sans connaissance n’est pas bon[a], et celui qui précipite ses pas pèche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Une personne sans connaissance n’est pas bonne. » Le mot hébreu rendu ici par « désir » peut aussi désigner la personne elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De même
  rationale: Rend la valeur additive de גַּם et relie naturellement cette maxime à son contexte, sans lui donner une emphase excessive.
- source_word: בְּלֹא דַעַת
  choice: sans connaissance
  rationale: Traduction directe qui conserve la portée à la fois intellectuelle et morale de דַעַת dans la littérature sapientielle.
- source_word: נֶפֶשׁ
  choice: le désir
  rationale: נֶפֶשׁ peut ici désigner l’appétit ou l’élan intérieur plutôt que l’âme au sens technique. « Le désir » donne en français un sens intelligible tout en signalant en note l’autre analyse possible.
- source_word: לֹא טוֹב
  choice: n’est pas bon
  rationale: Conserve la simplicité et la concision de la prédication hébraïque.
- source_word: וְאָץ בְּרַגְלַיִם
  choice: et qui se précipite dans sa marche
  rationale: Le participe décrit de façon générale une personne qui agit avec précipitation. Cette formulation garde l’image concrète des pieds, adaptée en français par « dans sa marche ».
- source_word: חוֹטֵא
  choice: tombe dans le péché
  rationale: Préserve le poids moral de חטא. Cette tournure française exprime naturellement le fait de pécher sans réduire le terme à une simple erreur pratique.
theological_decisions:
- issue: Portée morale de חוֹטֵא
  choice: tombe dans le péché
  alternative: manque son chemin / commet une erreur
  rationale: Le verbe peut évoquer l’idée de manquer le but, mais son emploi sapientiel comporte ici une portée morale qu’il convient de ne pas atténuer.
- issue: Interprétation de נֶפֶשׁ
  choice: le désir
  alternative: la personne / l’âme
  rationale: La syntaxe permet plusieurs lectures. Le texte retient le sens d’appétit ou de désir intérieur, mais la note conserve explicitement l’autre interprétation possible afin de ne pas effacer l’ambiguïté de l’hébreu.
translation_notes:
  register: Français moderne, international et proverbial, avec une syntaxe concise et digne. L’image corporelle de la marche est conservée sans calque maladroit. L’ambiguïté de נֶפֶשׁ est maintenue par une note.
