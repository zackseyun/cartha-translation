- from: Qui acquiert du discernement[a] aime sa propre vie[b] ; qui veille sur l’intelligence trouvera le bonheur[c].
  to: Qui acquiert du discernement[a] aime sa propre vie[b] ; qui conserve son intelligence trouvera le bien.
  rationale: La révision remplace « le bonheur » par « le bien » afin de préserver l’ampleur de טוֹב, et remplace « veille sur l’intelligence » par « conserve son intelligence » pour un français plus naturel et une meilleure correspondance avec l’idée de garder ou préserver la compréhension. La note c est devenue inutile puisque le texte principal porte désormais le sens direct de l’hébreu.
