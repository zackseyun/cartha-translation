  text: קֹֽנֶה לֵּ֭ב אֹהֵ֣ב נַפְשׁ֑/וֹ שֹׁמֵ֥ר תְּ֝בוּנָ֗ה לִ/מְצֹא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: fr
  text: Qui acquiert du discernement[a] aime sa propre vie[b] ; qui conserve son intelligence trouvera le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « acquiert un cœur ». Dans la littérature de sagesse hébraïque, le « cœur » désigne souvent la faculté de penser et de discerner.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « s’aime lui-même » ou « aime sa personne ». Le mot hébreu peut désigner la personne ou sa vie, et non seulement l’âme au sens étroit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה
  choice: acquiert
  rationale: Le participe qal signifie « acquérir, obtenir ». « Acquiert » convient naturellement à une qualité que l’on développe et conserve la métaphore d’acquisition.
- source_word: לֵּב
  choice: du discernement
  rationale: Littéralement « cœur », mais dans la littérature sapientielle, לֵב désigne souvent la faculté intérieure de penser, de juger et de discerner. « Discernement » exprime ici cette valeur cognitive en français actuel.
- source_word: אֹהֵב נַפְשׁוֹ
  choice: aime sa propre vie
  rationale: נֶפֶשׁ peut désigner la personne elle-même ou sa vie, sans se limiter à une âme immatérielle. Cette formulation garde ouverte la nuance entre souci de soi et attachement à sa vie.
- source_word: שֹׁמֵר
  choice: veille sur
  rationale: Le participe évoque une attention qui garde et préserve. « Veille sur » rend cette vigilance plus clairement que le simple « garde » avec un nom abstrait.
- source_word: תְּבוּנָה
  choice: l’intelligence
  rationale: Terme sapientiel désignant la compréhension et la capacité de discerner. « Intelligence » est naturel ici et se distingue suffisamment de « discernement » dans le premier membre.
- source_word: לִמְצֹא טוֹב
  choice: trouvera le bonheur
  rationale: L’expression signifie littéralement « trouver le bien ». Dans ce contexte proverbial, טוֹב peut désigner ce qui est bon ou une issue heureuse ; « le bonheur » rend idiomatiquement le bénéfice obtenu, tandis qu’une note conserve le sens littéral.
theological_decisions:
- issue: Portée de נַפְשׁוֹ
  choice: sa propre vie
  alternative: lui-même / son âme
  rationale: Le choix évite d’imposer une anthropologie dualiste à נֶפֶשׁ tout en préservant la possibilité que le mot renvoie à la personne elle-même.
- issue: Valeur de טוֹב
  choice: le bonheur
  alternative: le bien / ce qui est bon
  rationale: Le contexte permet aussi bien le bien obtenu qu’une issue favorable. Le texte principal privilégie un français proverbial naturel, et la note signale l’expression littérale.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme des deux participes hébreux est rendu par deux relatives en « qui ». Le registre reste digne sans archaïsme ; les notes préservent les images et ambiguïtés lexicales de l’hébreu.
