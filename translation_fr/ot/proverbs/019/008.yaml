  source_fidelity: Le premier membre rend correctement קֹנֶה לֵב comme l’acquisition d’une capacité de discernement, et « sa propre vie » préserve bien la portée de נַפְשׁוֹ. En revanche, « le bonheur » restreint indûment טוֹב, qui signifie plus largement « le bien / ce qui est bon »; la note ne compense pas entièrement cette restriction dans le texte principal. « Conserve son intelligence » rend de façon plus naturelle et suffisamment précise שֹׁמֵר תְּבוּנָה que « veille sur l’intelligence ».
  naturalness: Le style demeure concis et proverbial. « Qui conserve son intelligence » est plus idiomatique en français moderne que « qui veille sur l’intelligence », tout en gardant le parallélisme. « Trouvera le bien » est une formulation sobre et fidèle, acceptable dans le registre sapientiel.
  terminology: « Discernement » pour לֵב et « intelligence » pour תְּבוּנָה distinguent utilement les deux termes sapientiaux sans les opposer artificiellement. Les notes sur « cœur » et נֶפֶשׁ sont appropriées. Aucun terme théologique confessionnel n’est introduit.
