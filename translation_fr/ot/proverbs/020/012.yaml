  variant: modern international French
source:
  edition: WLC
  text: אֹ֣זֶן שֹׁ֭מַעַת וְ/עַ֣יִן רֹאָ֑ה יְ֝הוָ֗ה עָשָׂ֥ה גַם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/012.yaml
  text: The hearing ear and the seeing eye—Yahweh made both of them[a].
translation:
  language: fr
  text: L’oreille qui entend et l’œil qui voit — Yahweh les a faits tous les deux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’oreille capable d’entendre et l’œil capable de voir — Yahweh les a faits l’un et l’autre. »'
    reason: Les participes hébreux peuvent décrire l’exercice de l’ouïe et de la vue ou souligner la capacité correspondante.
lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  choice: l’oreille qui entend
  rationale: Le participe שֹׁמַעַת qualifie l’oreille. La proposition relative est naturelle en français et conserve l’image concrète ainsi que le parallélisme du texte hébreu.
- source_word: עַיִן רֹאָה
  choice: l’œil qui voit
  rationale: Cette formulation rend directement le participe attributif רֹאָה et répond symétriquement à « l’oreille qui entend ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
- source_word: עָשָׂה
  choice: a faits
  rationale: Le verbe עָשָׂה signifie ici que Yahweh est l’auteur de ces deux facultés. « A faits » reste direct et évite la précision supplémentaire qu’introduirait « a créés ».
- source_word: גַם שְׁנֵיהֶם
  choice: tous les deux
  rationale: L’expression rend naturellement en français l’insistance inclusive de גַם avec « les deux d’entre eux ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le conserve explicitement, sans lui substituer un titre.
- issue: Portée de l’action divine
  choice: Yahweh a fait l’oreille et l’œil
  alternative: Yahweh leur donne la capacité d’entendre et de voir
  rationale: La traduction retient l’affirmation concrète du texte sur la création des deux organes sans expliciter davantage si l’accent porte sur les organes eux-mêmes, leurs facultés ou les deux.
translation_notes:
  register: Français moderne, simple et sentencieux. Le singulier de « l’oreille » et de « l’œil » ainsi que leur parallélisme sont conservés. Le tiret met en relief la conclusion du proverbe.
