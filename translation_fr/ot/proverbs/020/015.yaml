source:
  edition: WLC
  text: יֵ֣שׁ זָ֭הָב וְ/רָב פְּנִינִ֑ים וּ/כְלִ֥י יְ֝קָ֗ר שִׂפְתֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/015.yaml
  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
translation:
  language: fr
  text: Il y a de l’or et une abondance de perles[a], mais des lèvres pleines de connaissance sont un objet précieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coraux », « rubis » ou, plus généralement, « pierres précieuses » ; le sens exact du mot hébreu פְּנִינִים est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Il y a
  rationale: La particule existentielle introduit l’observation du proverbe; « Il y a » est la tournure française naturelle.
- source_word: זָהָב
  choice: de l’or
  rationale: Désignation directe et courante du matériau précieux.
- source_word: וְרָב
  choice: en abondance
  rationale: Exprime naturellement la grande quantité indiquée par רָב dans ce contexte.
- source_word: פְּנִינִים
  choice: des perles
  rationale: Choix lexical défendable pour un terme désignant une matière ou des pierres précieuses dont le référent exact reste incertain; cette incertitude est signalée en note.
- source_word: וּכְלִי יְקָר
  choice: un objet précieux
  rationale: כְּלִי peut désigner un récipient, un ustensile ou, plus largement, un objet. « Objet précieux » garde la comparaison concrète sans imposer en français l’image plus étroite d’un récipient.
- source_word: שִׂפְתֵי דָעַת
  choice: des lèvres qui parlent avec connaissance
  rationale: Le syntagme signifie littéralement « lèvres de connaissance » et désigne une parole caractérisée par la connaissance. Cette formulation rend l’image et son sens en français actuel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure antithétique du proverbe est conservée, ainsi que l’image concrète des lèvres comme objet d’une valeur supérieure aux richesses matérielles.
