source:
  edition: WLC
  text: כָּב֣וֹד לָ֭/אִישׁ שֶׁ֣בֶת מֵ/רִ֑יב וְ/כָל אֱ֝וִ֗יל יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/003.yaml
  text: It is an honor for a man to keep away from strife[a], but every fool bursts out in quarrel.
translation:
  language: fr
  text: C’est un honneur pour un homme de se tenir loin des querelles, mais tout insensé s’y déchaîne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu traduit par « s’y déchaîne » est rare et de sens incertain. Il pourrait aussi signifier « se mêle à la querelle » ou, plus littéralement, quelque chose comme « se montre » de manière agressive.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  choice: un honneur
  rationale: Dans la littérature de sagesse, le nom désigne ici ce qui fait honneur à quelqu’un ou lui vaut de l’estime; « un honneur » exprime naturellement cette valeur sociale et morale.
- source_word: לָאִישׁ
  choice: pour un homme
  rationale: Le singulier masculin אִישׁ est conservé, avec sa portée représentative habituelle dans la formulation proverbiale.
- source_word: שֶׁבֶת מֵרִיב
  choice: se tenir loin des querelles
  rationale: Dans cette construction avec מִן, le verbe exprime l’idée de s’abstenir d’un conflit ou de ne pas s’y engager. Cette formulation est claire et idiomatique en français.
- source_word: רִיב
  choice: querelles
  rationale: רִיב peut désigner une dispute, une contestation ou un conflit. Le pluriel générique « querelles » convient au caractère proverbial de l’énoncé.
- source_word: אֱוִיל
  choice: insensé
  rationale: Terme traditionnel et intelligible de la littérature sapientielle, « insensé » conserve la dimension morale et comportementale du mot hébreu, au-delà d’un simple manque d’intelligence.
- source_word: יִתְגַּלָּע
  choice: s’y déchaîne
  rationale: Le hitpael rare est lexicalement incertain. Dans le contraste avec le fait de rester loin d’une querelle, « s’y déchaîne » rend de façon concise l’idée probable de se laisser aller ouvertement au conflit, sans présenter cette interprétation comme certaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique du proverbe est conservée. « Un homme » respecte la forme masculine singulière de l’hébreu, tandis que « querelles » fonctionne comme un pluriel générique idiomatique. Le pronom « y » évite une répétition lourde tout en renvoyant clairement aux querelles.
