  text: מְזָרֶ֣ה רְ֭שָׁעִים מֶ֣לֶךְ חָכָ֑ם וַ/יָּ֖שֶׁב עֲלֵי/הֶ֣ם אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/026.yaml
  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: fr
  text: Un roi sage vanne les méchants et fait rouler la roue sur eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזָרֶה (mezareh)
  choice: passe … au van
  rationale: Le participe exprime l’action de vanner, image agricole du tri et de la dispersion. « Passer au van » restitue cette image en français naturel.
- source_word: וַיָּשֶׁב (wayyashev)
  choice: fait passer
  rationale: La forme causative évoque le fait de ramener ou de faire passer la roue sur les coupables. Cette formulation française est claire sans préciser au-delà du texte le mécanisme exact.
- source_word: אוֹפָן (ofan)
  choice: la roue
  rationale: Traduction directe du nom hébreu. Le contexte suggère une roue ou un instrument de battage, mais le texte dit simplement « roue ».
theological_decisions:
- issue: Portée de l’image du jugement royal
  choice: 'Conserver les deux images agricoles successives : le vannage et la roue passant sur les méchants.'
  alternative: Expliciter abstraitement que le roi sépare puis punit les méchants.
  rationale: Le proverbe décrit avec force l’exercice du jugement sans définir précisément la peine. Garder les images préserve cette tension et évite d’ajouter une interprétation juridique ou doctrinale.
translation_notes:
  register: Français moderne, concis et proverbial. « Passer au van » est une expression agricole moins courante, mais intelligible et fidèle à l’image source ; la répétition de « passer » reste acceptable, tout en rendant distinctement les deux actions hébraïques.
