  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
translation:
  language: fr
  text: 'Ne dis pas : « Je rendrai le mal. » Espère en Yahweh[a], et il te sauvera[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Attends Yahweh » ; le verbe implique une attente confiante et pleine d’espérance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il te délivrera » ; dans ce contexte, le verbe peut aussi suggérer : « il te fera justice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: La particule אַל suivie de l’inaccompli exprime ici une interdiction; « Ne dis pas » rend naturellement la formulation hébraïque.
- source_word: אֲשַׁלְּמָה רָע
  choice: Je rendrai le mal pour le mal
  rationale: Le piel de שׁלם exprime la riposte ou la rétribution. Cette tournure française explicite idiomatiquement la réciprocité sous-entendue tout en conservant רָע, « le mal ».
- source_word: קַוֵּה
  choice: Attends
  rationale: קוה désigne une attente confiante et pleine d’espérance. « Attends » convient au texte principal, tandis qu’une note en précise la nuance.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה; « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre.
- source_word: וְיֹשַׁע לָךְ
  choice: et il te délivrera
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. Dans ce contexte de représailles auxquelles il faut renoncer, « délivrera » est naturel sans préciser indûment la forme de l’intervention.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie le tétragramme comme nom divin; sa translittération préserve cette particularité du texte source.
- issue: Portée de וְיֹשַׁע לָךְ
  choice: il te délivrera
  alternative: il te sauvera; il te fera justice
  rationale: ישׁע peut évoquer le salut, la délivrance ou, dans ce contexte, une intervention qui rétablit la justice. Le texte principal conserve une formulation large et la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, concis et sentencieux, conforme au registre sapientiel. « Rendre le mal pour le mal » est une expression française courante qui communique clairement l’idée de représailles.
