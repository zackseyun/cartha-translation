    rationale: La note porte sur la nuance de קַוֵּה (« Attends » / espérance confiante), non sur le nom divin. L’ancre doit suivre « Espère en ».
  - severity: low
    issue: « Attends Yahweh » est susceptible d’une lecture peu naturelle.
    rationale: En français courant, la construction peut évoquer l’attente de la venue ou de l’arrivée de quelqu’un. « Espère en Yahweh » transmet la valeur confiante de קוה avec davantage de clarté.
