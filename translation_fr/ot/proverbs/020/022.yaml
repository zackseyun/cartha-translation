  source_fidelity: La formulation « le mal pour le mal » explicite la réciprocité contextuelle de שׁלם, mais ajoute « pour le mal », qui n’est pas exprimé dans l’hébreu. « Je rendrai le mal » conserve l’objet רָע et laisse la rétribution implicite, comme dans le texte source. Pour קַוֵּה לַיהוה, « Espère en Yahweh » rend naturellement en français l’attente confiante impliquée par le verbe.
  naturalness: « Espère en Yahweh » est plus idiomatique en français international moderne que « Attends Yahweh », qui peut se comprendre comme le fait d’attendre l’arrivée de Yahweh. La phrase révisée garde un ton bref et sentencieux approprié à un proverbe.
  terminology: Yahweh rend correctement יהוה comme nom propre. « Sauvera » rend directement le hiphil de ישׁע et préserve son ampleur; la délivrance et la vindication restent des possibilités signalées en note, sans les imposer au texte.
