  text: נַ֣הַם כַּ֭/כְּפִיר אֵ֣ימַת מֶ֑לֶךְ מִ֝תְעַבְּר֗/וֹ חוֹטֵ֥א נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
translation:
  language: fr
  text: La terreur qu’inspire le roi est comme le grondement d’un jeune lion[a] ; qui provoque sa colère pèche contre sa propre vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rugissement d’un jeune lion ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pèche contre sa vie » ; le mot hébreu peut aussi désigner la personne elle-même ou l’âme.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: grondement
  rationale: Le nom désigne le cri menaçant du lion. « Grondement » restitue naturellement en français la menace exprimée, sans imposer l’image plus précise d’un rugissement à pleine voix.
- source_word: כְּפִיר
  choice: jeune lion
  rationale: Le terme désigne couramment un jeune lion vigoureux et dangereux ; cette précision lexicale est conservée.
- source_word: אֵימַת מֶלֶךְ
  choice: la terreur qu’inspire le roi
  rationale: La construction exprime vraisemblablement l’effroi suscité par le roi. Cette formulation française rend clairement cette relation sans réduire l’intensité de אֵימָה.
- source_word: מִתְעַבְּרוֹ
  choice: qui provoque sa colère
  rationale: Dans ce contexte, la forme avec suffixe renvoie à l’action de susciter la colère du roi. La traduction explicite le référent et demeure naturelle.
- source_word: חוֹטֵא נַפְשׁוֹ
  choice: met sa propre vie en péril
  rationale: L’expression signifie littéralement « pèche contre sa vie/personne », mais elle avertit ici du danger mortel auquel on s’expose. La formulation choisie rend le sens contextuel, tandis que la note conserve la tournure et l’ambiguïté lexicales.
theological_decisions:
- issue: Valeur morale ou conséquence pratique de חוֹטֵא נַפְשׁוֹ
  choice: met sa propre vie en péril
  alternative: pèche contre sa propre vie / contre lui-même
  rationale: Le contexte proverbial souligne la conséquence autodestructrice de la provocation du roi. La note préserve néanmoins le verbe moral « pécher » présent dans l’hébreu, afin de ne pas effacer la tension entre faute et mise en danger.
translation_notes:
  register: Français international moderne, sobre et proverbial. « La terreur qu’inspire » évite l’expression moins naturelle « la terreur du roi » ; « grondement » maintient l’image animale menaçante. Le point-virgule conserve l’équilibre des deux membres du proverbe.
