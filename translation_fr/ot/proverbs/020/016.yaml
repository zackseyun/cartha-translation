source:
  edition: WLC
  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
translation:
  language: fr
  text: Prends son vêtement[a], car il s’est porté garant pour un inconnu[b] ; pour des étrangers, prends-lui un gage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier membre peut aussi se comprendre : « garde son vêtement en gage » ou « prends-le comme gage ». L’hébreu est concis et peut mettre l’accent soit sur le vêtement donné en garantie, soit sur la garantie exigée de l’homme lui-même.'
    reason: alternative_reading
  - marker: b
    text: « Se porter garant » signifie s’engager à répondre de la dette ou de l’obligation d’une autre personne.
    reason: cultural_note
lexical_decisions:
- source_word: לְקַח
  choice: Prends
  rationale: Impératif qal masculin singulier de לקח. « Prends » exprime directement l’ordre sans lui donner la force excessive de « saisis ».
- source_word: בִּגְדוֹ
  choice: son vêtement
  rationale: בגד désigne de manière générale une pièce d’habillement. « Vêtement » évite de préciser sans preuve qu’il s’agit d’un manteau ou d’une robe.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit ici le motif de l’ordre. « Puisque » conserve clairement ce rapport causal dans un français naturel.
- source_word: עָרַב
  choice: s’est porté garant
  rationale: Dans ce contexte financier, ערב signifie assumer la responsabilité de la dette ou de l’obligation d’autrui. « Se porter garant » est l’expression française courante et exacte.
- source_word: זָר
  choice: pour un inconnu
  rationale: זר désigne une personne extérieure au cercle habituel. « Inconnu » rend ici le risque de garantir quelqu’un que l’on ne connaît pas, tout en évitant de confondre ce singulier avec le pluriel נכרִים du second membre.
- source_word: וּבְעַד
  choice: et puisqu’il l’a fait pour
  rationale: בעד marque ici l’action accomplie en faveur d’autrui. L’ajout explicatif « il l’a fait » restitue en français l’ellipse du parallélisme hébreu sans en modifier le sens.
- source_word: נכרים
  choice: des étrangers
  rationale: Le texte consonantique fourni porte un pluriel, « étrangers », qui désigne des personnes extérieures à la communauté ou au cercle du garant.
- source_word: חַבְלֵהוּ
  choice: prends-lui un gage
  rationale: Le verbe חבל, dans ce cadre juridique, concerne la prise d’un bien comme garantie. La construction française « prendre un gage à quelqu’un » rend naturellement le suffixe masculin tout en laissant le vêtement du premier membre fonctionner comme le bien saisi.
theological_decisions:
- issue: Objet du dernier impératif חַבְלֵהוּ
  choice: prends-lui un gage
  alternative: prends-le comme gage / garde son vêtement en gage
  rationale: 'La formulation hébraïque est très concise : le suffixe masculin peut orienter l’attention vers l’homme dont on exige une garantie, tandis que le parallélisme peut faire comprendre que son vêtement est le gage. La traduction principale conserve le cadre juridique sans trancher excessivement la relation précise entre l’homme et le bien gagé.'
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme proverbial est maintenu avec deux impératifs. Le vocabulaire juridique reste accessible, et les notes signalent l’ambiguïté réelle de la dernière proposition sans imposer une lecture confessionnelle.
