source:
  edition: WLC
  text: תִּפְאֶ֣רֶת בַּחוּרִ֣ים כֹּחָ֑/ם וַ/הֲדַ֖ר זְקֵנִ֣ים שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/029.yaml
  text: The glory of young men is their strength[a], and the splendor of old men is gray hair.
translation:
  language: fr
  text: 'La gloire des jeunes hommes, c’est leur force,

    et la splendeur des hommes âgés, leurs cheveux blancs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּפְאֶרֶת
  choice: gloire
  rationale: Le nom désigne ce qui fait la beauté, la fierté ou l’honneur de quelqu’un. « Gloire » conserve ici l’idée de distinction honorable et forme un parallèle poétique avec « splendeur ».
- source_word: בַּחוּרִים
  choice: jeunes hommes
  rationale: Le terme vise spécifiquement de jeunes hommes, plutôt que la jeunesse en général; cette traduction respecte le masculin pluriel hébreu tout en restant naturelle.
- source_word: כֹּחָם
  choice: leur force
  rationale: כֹּחַ désigne couramment la force ou la puissance; dans ce contraste lié aux âges de la vie, « force » exprime directement la vigueur propre à la jeunesse.
- source_word: הֲדַר
  choice: splendeur
  rationale: Le mot peut exprimer la splendeur, l’honneur, la majesté ou la beauté. « Splendeur » maintient le registre poétique et le parallélisme avec « gloire » sans effacer la nuance d’apparat honorable.
- source_word: זְקֵנִים
  choice: vieillards
  rationale: Le contexte oppose des groupes selon leur âge, et non selon une fonction communautaire; « vieillards » évite donc le sens institutionnel possible de « anciens » et conserve la référence masculine.
- source_word: שֵׂיבָה
  choice: cheveux blancs
  rationale: Le nom désigne les cheveux devenus blancs ou gris et, par métonymie, la vieillesse. « Cheveux blancs » restitue clairement l’image concrète et constitue une expression française naturelle.
theological_decisions: []
translation_notes:
  register: Formulation française moderne, concise et dignifiée, avec parallélisme conservé. La tournure présentative « c’est » rend naturellement la relation nominale implicite en hébreu. Le vers est disposé en deux lignes pour faire ressortir sa structure poétique.
