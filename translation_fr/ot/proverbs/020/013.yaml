  naturalness: « N’aime pas le sommeil » est plus idiomatique et plus proche de l’objet nominal hébreu que « N’aime pas dormir ». « Devenir pauvre » donne une formulation française directe et naturelle.
  terminology: « Sommeil », « pauvre », « ouvre les yeux » et « pain » conservent le lexique et les images du proverbe. « Rassasie-toi de pain » maintient prudemment l’impératif hébreu; la note signale sans l’imposer la lecture résultative.
