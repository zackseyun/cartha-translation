  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
translation:
  language: fr
  text: N’aime pas le sommeil, de peur de devenir pauvre ; ouvre les yeux et rassasie-toi de pain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre la dernière proposition comme exprimant le résultat : « ouvre les yeux, et tu auras du pain à satiété ». Littéralement, l’hébreu enchaîne : « ouvre tes yeux ; rassasie-toi de pain ».'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: אַל תֶּאֱהַב שֵׁנָה
  choice: N’aime pas dormir
  rationale: La tournure conserve la prohibition directe et la force du verbe « aimer », tout en employant en français naturel l’infinitif « dormir » plutôt que le substantif plus abstrait « sommeil ».
- source_word: פֶּן תִּוָּרֵשׁ
  choice: de peur de t’appauvrir
  rationale: פֶּן introduit une conséquence redoutée. Le niphal de ירשׁ évoque ici le fait de devenir pauvre ou d’être dépouillé ; « t’appauvrir » exprime sobrement cette évolution sans préciser au-delà de l’hébreu sa cause.
- source_word: פְּקַח עֵינֶיךָ
  choice: ouvre les yeux
  rationale: Traduction directe de l’impératif et de son complément, qui préserve à la fois l’image concrète du réveil et sa portée pratique d’attention et d’activité.
- source_word: שְׂבַע לָחֶם
  choice: rassasie-toi de pain
  rationale: La forme hébraïque est un impératif, non un futur explicite. « Rassasie-toi » en maintient la forme et « pain » conserve l’image hébraïque de la nourriture et de la subsistance.
theological_decisions:
- issue: Rapport syntaxique entre « ouvre les yeux » et « rassasie-toi de pain »
  choice: Conserver deux impératifs coordonnés
  alternative: « ouvre les yeux, et tu auras du pain à satiété »
  rationale: L’hébreu enchaîne deux impératifs. Une traduction résultative est plausible dans le contexte proverbial, mais elle explicite une relation logique qui n’est pas grammaticalement marquée ; le texte principal préserve donc la tension formelle, avec une note signalant l’autre lecture naturelle.
translation_notes:
  register: Français moderne, direct et proverbial. « N’aime pas dormir » évite le tour plus soutenu « N’aime pas le sommeil » tout en gardant la formulation frappante de l’hébreu. La ponctuation met en relief les deux volets opposés du proverbe.
