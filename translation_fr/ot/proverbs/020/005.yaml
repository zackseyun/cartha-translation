revisions:
- from: Les pensées dans le cœur d’un homme sont des eaux profondes[a], mais l’homme qui a du discernement sait les en tirer.[b]
  to: Le dessein dans le cœur d’un homme est comme des eaux profondes, mais un homme de discernement sait l’en tirer.[a]
  rationale: La révision restitue le singulier de עֵצָה par « dessein », explicite la comparaison poétique requise par le français et conserve l’image de l’eau profonde que l’homme de discernement sait tirer au dehors. La note générique est conservée avec un ancrage unique et cohérent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:09Z'
review_pass:
  verdict: revise
  source_fidelity: La draft affaiblit le singulier de עֵצָה (« les pensées ») et réorganise l’image en faisant tirer des pensées hors des eaux. Le texte hébreu compare le dessein intérieur à des eaux profondes, qu’un homme de discernement sait puiser ou tirer au dehors. La révision maintient le singulier et l’image du puisage.
  naturalness: « Le dessein dans le cœur d’un homme est comme des eaux profondes » est une formulation proverbiale naturelle et claire en français moderne. « Sait l’en tirer » conserve l’idée d’extraire ce qui est caché, sans la tournure maladroite « sait les en tirer ».
  terminology: « Dessein » rend bien עֵצָה dans ce contexte d’intention ou de délibération intérieure; « discernement » rend précisément תְּבוּנָה. « Cœur » préserve l’anthropologie hébraïque, qui inclut pensée et volonté.
  issues:
  - severity: medium
    issue: « Les pensées » au pluriel pour עֵצָה
    rationale: Le nom hébreu est singulier et désigne ici un dessein, une intention ou une délibération; le pluriel « pensées » diffuse et modifie légèrement l’image.
  - severity: medium
    issue: « sait les en tirer »
    rationale: La formulation fait des « pensées » l’objet tiré des « eaux » et rend le référent de « en » ambigu. L’hébreu présente le dessein comme comparable à des eaux profondes et dit que l’homme discernant le tire/puise.
  - severity: low
    issue: Comparaison insuffisamment explicite dans le texte principal
    rationale: Le premier membre est une comparaison nominale. En français, « est comme des eaux profondes » exprime idiomatiquement le rapport métaphorique sans ajouter de contenu interprétatif.
  revised_text: Le dessein dans le cœur d’un homme est comme des eaux profondes, mais un homme de discernement sait l’en tirer.[a]
  revised_footnotes:
  - marker: a
    text: Dans ce proverbe, le mot hébreu traduit par « homme » est employé au sens générique et peut désigner toute personne.
    reason: cultural_note
