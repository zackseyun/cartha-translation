source:
  edition: WLC
  text: מַ֣יִם עֲ֭מֻקִּים עֵצָ֣ה בְ/לֶב אִ֑ישׁ וְ/אִ֖ישׁ תְּבוּנָ֣ה יִדְלֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/005.yaml
  text: Counsel in a man's heart is like deep water[b][a], but a man of understanding draws it out.
translation:
  language: fr
  text: Le dessein dans le cœur d’un homme est comme des eaux profondes, mais un homme de discernement sait l’en tirer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce proverbe, le mot hébreu traduit par « homme » est employé au sens générique et peut désigner toute personne.
    reason: cultural_note
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: des eaux profondes
  rationale: Rend littéralement le pluriel hébreu et conserve l’image d’une profondeur difficile d’accès.
- source_word: עֵצָה
  choice: les pensées
  rationale: Dans ce contexte, עֵצָה désigne ce qui se forme intérieurement — réflexion, intention ou dessein. « Les pensées » est naturel en français et évite de réduire le sens à un conseil donné à autrui.
- source_word: בְלֶב אִישׁ
  choice: dans le cœur d’un homme
  rationale: « Cœur » conserve l’anthropologie hébraïque, où le terme englobe pensée, volonté et intention. Le masculin proverbial est maintenu, avec une note précisant sa portée générique.
- source_word: וְאִישׁ תְּבוּנָה
  choice: mais l’homme qui a du discernement
  rationale: Le waw est compris comme adversatif en raison du contraste entre la profondeur cachée et la capacité à en faire sortir le contenu. תְּבוּנָה est rendu par « discernement », idiomatique et précis.
- source_word: יִדְלֶנָּה
  choice: sait les en tirer
  rationale: Le verbe דלה évoque l’action de puiser ou tirer de l’eau. La formulation maintient cette image tout en exprimant l’aptitude du sage à faire émerger les pensées cachées.
theological_decisions:
- issue: Portée du masculin אִישׁ
  choice: Maintenir « homme » dans le texte et signaler son emploi générique en note.
  alternative: Employer « personne » dans le texte.
  rationale: Le choix conserve la forme proverbiale et le parallélisme masculins du texte hébreu sans laisser entendre que l’enseignement ne concernerait que les hommes.
translation_notes:
  register: Français moderne, international et digne. La phrase garde l’image poétique des eaux profondes et du puisage, tout en explicitant naturellement le lien entre les deux membres du proverbe.
