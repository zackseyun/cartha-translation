  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
translation:
  language: fr
  text: À cause de l’hiver[a], le paresseux ne laboure pas ; à la moisson, il cherche[b], et il n’y a rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En hiver, le paresseux ne laboure pas. » La préposition hébraïque peut indiquer le temps (« en hiver ») ou la cause (« à cause de l’hiver »).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il demande ». Le verbe hébreu peut signifier « demander » ou, dans ce contexte, chercher ou solliciter quelque chose au temps de la moisson.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֹרֶף
  choice: À cause de l’hiver
  rationale: 'La préposition מִן peut ici exprimer la cause : l’hiver, ou le froid qui lui est associé, détourne le paresseux du labour. La valeur temporelle reste possible et est signalée en note.'
- source_word: עָצֵל
  choice: le paresseux
  rationale: Terme courant des Proverbes pour désigner une personne caractérisée par la paresse. Le masculin singulier représentatif correspond à la forme hébraïque et demeure naturel en français.
- source_word: לֹא יַחֲרֹשׁ
  choice: ne laboure pas
  rationale: Le verbe désigne précisément le labour agricole. Le présent rend la portée générale et proverbiale de l’énoncé.
- source_word: ישאל
  choice: il cherche
  rationale: שׁאל signifie normalement « demander », mais l’absence de complément et la conclusion « il n’y a rien » permettent ici le sens contextuel de chercher ou solliciter quelque chose. « Il cherche » conserve cette ouverture sans préciser indûment l’objet.
- source_word: בַּקָּצִיר
  choice: à la moisson
  rationale: Expression française concise qui situe le moment où apparaissent les conséquences de l’inaction.
- source_word: וָאָיִן
  choice: mais il n’y a rien
  rationale: אָיִן est une négation existentielle. « Il n’y a rien » garde l’objet implicite comme en hébreu ; « mais » exprime naturellement en français le contraste résultatif porté par le contexte.
