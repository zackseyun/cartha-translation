  text: נַ֭חֲלָה מבחלת בָּ/רִאשֹׁנָ֑ה וְ֝/אַחֲרִיתָ֗/הּ לֹ֣א תְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
translation:
  language: fr
  text: Un héritage acquis à la hâte[a] au début ne sera pas béni à la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un héritage obtenu rapidement au début. » Le terme hébreu peut souligner la rapidité, une acquisition prématurée ou un empressement avide.'
    reason: Variante lexicale due à l’incertitude et à l’étendue sémantique de מבחלת.
lexical_decisions:
- source_word: נַחֲלָה
  choice: héritage
  rationale: Le nom désigne un bien ou un patrimoine reçu en héritage. « Héritage » est l’équivalent français courant et convient au contexte de ce proverbe.
- source_word: מבחלת
  choice: acquis à la hâte
  rationale: La forme, textuellement difficile, est généralement rattachée à l’idée de se hâter ou d’obtenir rapidement, avec une possible nuance d’empressement avide ou d’acquisition prématurée. « Acquis à la hâte » conserve à la fois la rapidité et sa connotation potentiellement répréhensible.
- source_word: בָּרִאשֹׁנָה
  choice: dès le début
  rationale: Cette expression temporelle désigne le commencement du processus et forme un contraste net avec « à la fin ».
- source_word: וְאַחֲרִיתָהּ
  choice: à la fin
  rationale: Le terme signifie littéralement « sa fin » ou « son issue ». La formulation proverbiale « à la fin » exprime naturellement le résultat ultime tout en maintenant le contraste temporel.
- source_word: לֹא תְבֹרָךְ
  choice: ne sera pas béni
  rationale: Le verbe ברך appelle ici une formulation passive. « Ne sera pas béni » préserve la portée théologique plus large du texte, contrairement à « ne prospérera pas », qui limiterait le sens au succès matériel.
theological_decisions:
- issue: Nature de l’avertissement proverbial
  choice: Le verset affirme qu’un héritage acquis à la hâte ne connaîtra pas une issue bénie, sans préciser le mécanisme du jugement.
  alternative: Y voir soit une déclaration explicite de jugement divin contre l’avidité, soit seulement les conséquences pratiques de l’impatience.
  rationale: Le langage sapientiel associe conduite morale, bénédiction et issue finale. La traduction garde cette tension et ne réduit le propos ni à un châtiment divin explicitement décrit ni à de simples conséquences naturelles.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique entre « dès le début » et « à la fin » est conservée, ainsi que le vocabulaire théologique de la bénédiction.
