source:
  edition: WLC
  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
translation:
  language: fr
  text: Le souffle de l’être humain[a] est la lampe de Yahweh ; elle explore tous les recoins de son être[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’esprit de l’être humain est la lampe de Yahweh. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toutes les chambres du ventre », image qui désigne les parties les plus profondes et cachées de la personne.'
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  choice: lampe
  rationale: Le nom désigne concrètement une lampe. Ce choix conserve l’image d’une lumière qui révèle ce qui est caché.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: נִשְׁמַת
  choice: souffle
  rationale: נשמה désigne d’abord le souffle vital et peut, par extension, évoquer l’esprit humain. « Souffle » reste proche de l’image anthropologique hébraïque sans préciser excessivement le sens.
- source_word: אָדָם
  choice: l’être humain
  rationale: אָדָם est ici générique et singulier. « L’être humain » exprime naturellement en français cette portée représentative sans la limiter au sexe masculin.
- source_word: חֹפֵשׂ
  choice: explore
  rationale: Le participe exprime une action continue de recherche approfondie. « Explore » convient à l’image de la lampe qui pénètre les endroits cachés.
- source_word: כָּל
  choice: tous
  rationale: Ce terme marque l’étendue complète de l’examen.
- source_word: חַדְרֵי
  choice: recoins
  rationale: Le mot signifie littéralement « chambres » ou « pièces » ; dans cette image, « recoins » communique naturellement l’idée d’espaces intérieurs cachés.
- source_word: בָטֶן
  choice: son être
  rationale: בטן signifie littéralement « ventre », mais désigne ici idiomatiquement l’intérieur profond de la personne. La formulation française rend le sens, tandis que la note conserve l’image littérale.
theological_decisions:
- issue: Sens anthropologique de נִשְׁמַת אָדָם
  choice: « Le souffle de l’être humain »
  alternative: « L’esprit de l’être humain »
  rationale: L’hébreu peut évoquer le souffle vital ou, par extension, l’esprit. Il ne nomme pas explicitement la conscience. Le texte principal retient le sens concret de « souffle », et la note signale l’autre lecture sans imposer une interprétation doctrinale.
- issue: Sujet de חֹפֵשׂ (« explore »)
  choice: La lampe, c’est-à-dire le souffle humain envisagé comme lampe de Yahweh, explore l’être intérieur.
  alternative: Yahweh explore l’être intérieur au moyen du souffle humain.
  rationale: Le participe masculin singulier s’accorde naturellement avec נֵר, « lampe », également masculin en hébreu, plutôt qu’avec נִשְׁמַת, qui est féminin. La formulation française conserve cette relation grammaticale tout en laissant subsister l’idée que cette lampe appartient à Yahweh ou sert son action.
translation_notes:
  register: Français moderne, international et digne. « L’être humain » rend le singulier générique ; « recoins de son être » restitue naturellement l’idiome, tandis que la note en préserve l’image corporelle. Le pronom « elle » renvoie clairement à « la lampe ».
