source:
  edition: WLC
  text: גּֽוֹלֶה סּ֭וֹד הוֹלֵ֣ךְ רָכִ֑יל וּ/לְ/פֹתֶ֥ה שְׂ֝פָתָ֗י/ו לֹ֣א תִתְעָרָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/019.yaml
  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
translation:
  language: fr
  text: Celui qui dévoile les secrets va partout en médisant[a] ; ne fréquente pas celui qui parle sans retenue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « va partout en colportant des propos ». Le mot hébreu peut désigner quelqu’un qui répand des médisances ou des commérages nuisibles.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui qui ouvre ses lèvres ». L’expression désigne une personne qui parle trop ou sans retenue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹלֶה סּוֹד
  choice: celui qui dévoile les secrets
  rationale: Le participe qal de גלה exprime ici la divulgation de ce qui devait rester caché. « Dévoile les secrets » restitue clairement le sens de סוד, qui peut désigner une confidence ou une délibération confidentielle.
- source_word: הוֹלֵךְ רָכִיל
  choice: va partout en médisant
  rationale: L’expression associe l’idée de circuler à celle de répandre des propos nuisibles. « Médisant » conserve cette portée dommageable sans supposer nécessairement que les propos sont faux, contrairement à « calomniant ».
- source_word: וּלְפֹתֶה שְׂפָתָיו
  choice: celui qui parle trop librement
  rationale: Littéralement liée à l’ouverture des lèvres, l’expression décrit une personne qui parle sans retenue. Cette formulation française en communique naturellement le sens tout en laissant la note signaler l’image hébraïque.
- source_word: לֹא תִתְעָרָב
  choice: ne fréquente pas
  rationale: Le hitpael de ערב signifie ici se mêler à quelqu’un ou entretenir des rapports avec lui. « Ne fréquente pas » est naturel, direct et adapté au style proverbial.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et proverbial. « Médisant » évite le registre familier de « ragots » et l’idée de fausseté nécessairement impliquée par « calomniant ». Le parallélisme entre la divulgation des secrets et la parole sans retenue est conservé.
