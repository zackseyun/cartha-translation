source:
  edition: WLC
  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
translation:
  language: fr
  text: Les pas d’un homme viennent de Yahweh[b] ; comment donc un être humain pourrait-il comprendre son chemin[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie d’abord un terme désignant un homme, puis un terme désignant l’être humain en général. La maxime a une portée générale.
    reason: lexical_alternative
  - marker: b
    text: '« Viennent de Yahweh » indique la source : le parcours d’une personne relève de Yahweh. On peut aussi comprendre que ses pas sont dirigés ou déterminés par lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיהוָה
  choice: viennent de Yahweh
  rationale: La préposition מִן exprime ici la source ou l’origine. « Viennent de » conserve cette relation sans expliciter davantage si Dieu dirige, ordonne ou détermine chaque pas.
- source_word: מִצְעֲדֵי
  choice: les pas
  rationale: Le nom désigne les pas ou les mouvements qui composent le parcours d’une vie. « Les pas » préserve l’image concrète et reste naturel en français.
- source_word: גָבֶר
  choice: d’un homme
  rationale: גֶּבֶר désigne un homme de sexe masculin, employé ici avec une portée représentative ou générale. La traduction maintient cette forme masculine sans limiter nécessairement la maxime aux seuls hommes.
- source_word: וְאָדָם
  choice: un être humain
  rationale: אָדָם renvoie ici à l’humain en général. « Un être humain » distingue naturellement ce terme de גָבֶר tout en rendant sa portée générique.
- source_word: מַה יָּבִין
  choice: comment donc … pourrait-il comprendre
  rationale: Dans cette question rhétorique, מַה prend le sens de « comment ». Le conditionnel souligne en français la limite humaine exprimée par le contraste entre les deux propositions, sans transformer celle-ci en impossibilité absolue explicitement formulée.
- source_word: דַּרְכּוֹ
  choice: son chemin
  rationale: דֶּרֶךְ désigne à la fois un chemin et, métaphoriquement, la conduite ou le cours d’une vie. « Son chemin » conserve cette richesse d’image.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre divin et évite de le remplacer par un titre.
- issue: Rapport entre la direction divine et la compréhension humaine
  choice: « viennent de Yahweh » avec une question rhétorique sur la compréhension humaine
  alternative: « sont dirigés/déterminés par Yahweh »
  rationale: La traduction conserve l’affirmation de la provenance divine et la tension avec les limites de l’intelligence humaine, sans préciser au-delà de l’hébreu le mode exact de l’action divine.
- issue: Portée anthropologique de גבר et אדם
  choice: « un homme » puis « un être humain »
  alternative: « une personne » dans les deux propositions
  rationale: Ce choix respecte la différence lexicale entre le terme masculin גבר et le terme plus largement humain אדם, tout en signalant la portée générale de la seconde proposition.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation garde la métaphore des pas et du chemin, ainsi que la question rhétorique. Le nom divin est translittéré « Yahweh ».
