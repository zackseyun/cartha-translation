source:
  edition: WLC
  text: גַּ֣ם בְּ֭/מַעֲלָלָי/ו יִתְנַכֶּר נָ֑עַר אִם זַ֖ךְ וְ/אִם יָשָׁ֣ר פָּעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/011.yaml
  text: Even a youth makes himself known by his deeds[a], whether his work is pure and upright.
translation:
  language: fr
  text: Même un jeune se fait connaître par ses actes[a], selon que sa conduite est pure et droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Même un jeune est reconnu à ses actes, selon que sa conduite est pure et droite. »'
    reason: Le verbe hébreu peut souligner soit la manière dont le jeune se révèle par son comportement, soit la manière dont il est reconnu par les autres.
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Rend la valeur emphatique et extensive de גַּם : le comportement révèle même une personne encore jeune.'
- source_word: בְּמַעֲלָלָיו
  choice: par ses actes
  rationale: מַעֲלָל désigne les actes ou les agissements, souvent envisagés sous l’angle moral ; la préposition בְּ indique ici ce par quoi le jeune se fait connaître.
- source_word: יִתְנַכֶּר
  choice: se fait connaître
  rationale: Le hitpael exprime ici le fait de se révéler ou de devenir reconnaissable par son comportement. La formulation française conserve la nuance réfléchie sans exclure l’idée qu’autrui le reconnaît.
- source_word: נָעַר
  choice: un jeune
  rationale: נַעַר peut désigner un garçon ou, plus largement, une personne jeune. « Un jeune » convient à la portée générale du proverbe.
- source_word: זַךְ
  choice: pure
  rationale: זַךְ signifie pur, net ou innocent. Appliqué à la conduite, « pure » conserve directement l’évaluation morale.
- source_word: יָשָׁר
  choice: droite
  rationale: יָשָׁר évoque ce qui est droit, juste et moralement intègre. « Droite » forme en français une association naturelle avec « conduite ».
- source_word: פָּעֳלוֹ
  choice: sa conduite
  rationale: פֹּעַל désigne l’œuvre, l’action ou l’activité. Dans ce contexte sapiential, « sa conduite » résume naturellement ce que fait le jeune et évite de réduire le propos à une œuvre particulière.
theological_decisions:
- issue: Portée de אִם…וְאִם dans la seconde proposition
  choice: 'Une question évaluative : « sa conduite est-elle pure et droite ? »'
  alternative: 'Une proposition indirecte : « si sa conduite est pure et droite »'
  rationale: La formulation interrogative rend en français la valeur d’examen portée par אִם…וְאִם sans affirmer d’avance que la conduite du jeune est bonne. Elle préserve ainsi la tension morale du proverbe.
translation_notes:
  register: Français international moderne, concis et proverbial. « Un jeune » reste courant et inclusif quant à l’âge exact ; « conduite » exprime naturellement l’ensemble du comportement moral. La ponctuation en deux-points et la question finale rendent explicite la fonction d’évaluation de la seconde moitié sans résoudre abusivement son caractère légèrement elliptique.
