  naturalness: « Même un jeune se fait connaître par ses actes » est naturel, concis et proverbial. « Selon que sa conduite est pure et droite » est une tournure française idiomatique qui conserve la relation évaluative sans ajouter de ponctuation interrogative ni présupposer une réponse.
  terminology: « Actes », « conduite », « pure » et « droite » rendent convenablement le vocabulaire moral du proverbe. « Un jeune » convient à la généralité de נער, sans fixer un âge plus précis que ne le fait l’hébreu.
