id: PRO.20.8
reference: Proverbs 20:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֶ֗לֶךְ יוֹשֵׁ֥ב עַל כִּסֵּא דִ֑ין מְזָרֶ֖ה בְ/עֵינָ֣י/ו כָּל רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/008.yaml
  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
translation:
  language: fr
  text: Un roi assis sur le trône de justice vanne par son regard tout ce qui est mauvais[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « disperse » ou « élimine en triant ». Le verbe hébreu évoque le vannage, qui sépare ce qui ne vaut rien de ce qui est bon.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute personne mauvaise ». L’hébreu peut désigner largement ce qui est mauvais ou, par implication, les malfaiteurs traduits en justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: Un roi
  rationale: L’indéfini exprime une vérité générale sur l’exercice de la justice royale, sans désigner un monarque particulier.
- source_word: יוֹשֵׁב עַל כִּסֵּא דִין
  choice: assis sur le trône de justice
  rationale: Cette formulation conserve à la fois la posture exprimée par le participe et l’image proprement royale du siège où la justice est rendue.
- source_word: מְזָרֶה
  choice: vanne
  rationale: Le verbe évoque le vannage, qui sépare le grain de ce qui ne vaut rien. « Vanne » préserve cette métaphore agricole appliquée au discernement judiciaire.
- source_word: בְעֵינָיו
  choice: par son regard
  rationale: Le beth peut exprimer le moyen. En français, « par son regard » rend naturellement l’idée que le regard perspicace du roi détecte et sépare le mal.
- source_word: כָּל רָע
  choice: tout ce qui est mauvais
  rationale: Cette expression garde la portée large de רָע, qui peut désigner le mal en général, des choses mauvaises ou, selon le contexte, des personnes malfaisantes.
theological_decisions:
- issue: Portée de כָּל רָע
  choice: tout ce qui est mauvais
  alternative: toute personne mauvaise
  rationale: L’hébreu ne contraint pas à limiter le propos aux personnes. La traduction principale conserve donc l’ambiguïté, tandis que la note signale la lecture personnelle possible.
translation_notes:
  register: Français moderne, international et digne. « Vanne » est un terme concret mais compréhensible dans ce contexte; la note en explicite l’image. « Par son regard » est plus idiomatique que le calque « avec ses yeux » tout en conservant l’image du discernement royal.
