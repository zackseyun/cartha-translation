source:
  edition: WLC
  text: עָרֵ֣ב לָ֭/אִישׁ לֶ֣חֶם שָׁ֑קֶר וְ֝/אַחַ֗ר יִמָּֽלֵא פִ֥י/הוּ חָצָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/017.yaml
  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
translation:
  language: fr
  text: Le pain du mensonge est doux à l’homme[a], mais ensuite sa bouche se remplira de gravier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le pain du mensonge » peut aussi désigner du pain obtenu par le mensonge ou la tromperie.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵב
  choice: est doux
  rationale: L’adjectif signifie « agréable, plaisant, doux ». « Doux » conserve l’image gustative et son contraste ironique avec le gravier.
- source_word: לָאִישׁ
  choice: à l’homme
  rationale: Le syntagme hébreu est au masculin singulier et présente un individu représentatif. Cette formulation conserve la forme proverbiale sans ajouter un sujet absent du texte.
- source_word: לֶחֶם שָׁקֶר
  choice: le pain du mensonge
  rationale: Cette traduction garde l’image concrète du pain ainsi que la relation concise et quelque peu ambiguë de l’hébreu entre le pain et le mensonge, sans préciser indûment s’il est obtenu par tromperie ou s’il représente un gain trompeur.
- source_word: וְאַחַר
  choice: mais ensuite
  rationale: « Ensuite » exprime la succession temporelle, tandis que « mais » rend naturellement le renversement entre la douceur initiale et la conséquence pénible.
- source_word: יִמָּלֵא
  choice: se remplira
  rationale: L’imparfait hébreu peut présenter la conséquence à venir. Le futur français souligne le résultat inévitable après l’attrait initial.
- source_word: פִיהוּ
  choice: sa bouche
  rationale: La traduction directe maintient l’unité de l’image sensorielle du proverbe.
- source_word: חָצָץ
  choice: gravier
  rationale: Le nom désigne de petites pierres ou du gravier. « Gravier » donne une image vive de la conséquence douloureuse.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et proverbial. La syntaxe reste proche de l’hébreu tout en étant naturelle; l’image concrète du pain et du gravier ainsi que l’ambiguïté de « pain du mensonge » sont conservées.
