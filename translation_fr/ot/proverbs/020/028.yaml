    issue: La seconde proposition rend un verbe actif par une tournure passive.
    rationale: וְסָעַד est un actif 3ms; le roi, mentionné dans le premier membre, en est le sujet implicite, et « son trône » est l’objet. La version passive atténue cette structure.
  - severity: low
    issue: « Loyauté » pour אֱמֶת est moins précis dans ce binôme.
    rationale: Le terme peut évoquer l’attachement loyal, nuance déjà fortement incluse dans « amour fidèle » pour חֶסֶד. « Fidélité » exprime plus directement la constance et la fiabilité d’אֱמֶת.
  revised_text: L’amour fidèle et la fidélité préservent un roi[a], et par l’amour fidèle il soutient son trône.
