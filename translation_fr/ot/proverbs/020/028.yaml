  text: חֶ֣סֶד וֶ֭/אֱמֶת יִצְּרוּ מֶ֑לֶךְ וְ/סָעַ֖ד בַּ/חֶ֣סֶד כִּסְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/028.yaml
  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
translation:
  language: fr
  text: L’amour fidèle et la fidélité préservent un roi[a], et par l’amour fidèle il soutient son trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vérité » pour אֱמֶת ; dans cette association avec l’amour fidèle, le mot souligne probablement la fiabilité ou la fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression associe bienveillance et loyauté durable. Sa répétition dans les deux propositions conserve celle de l’hébreu.
- source_word: אֱמֶת
  choice: loyauté
  rationale: Associé à חֶסֶד, le terme désigne ici surtout la fiabilité et la fidélité dans la conduite, plutôt que la vérité abstraite.
- source_word: יִצְּרוּ
  choice: préservent
  rationale: Le verbe נצר signifie garder, protéger ou conserver; « préservent » exprime naturellement l’effet protecteur de ces qualités sur le roi.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: L’absence d’article et le caractère général du proverbe favorisent le sens indéfini.
- source_word: וְסָעַד
  choice: est affermi
  rationale: Le verbe exprime l’action de soutenir ou d’assurer la stabilité; la tournure française met naturellement le trône au premier plan comme bénéficiaire de cette action.
- source_word: בַּחֶסֶד
  choice: par l’amour fidèle
  rationale: 'La préposition בְּ a ici une valeur instrumentale: l’amour fidèle est le moyen par lequel le trône est soutenu.'
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: La traduction conserve l’image concrète du trône, qui représente aussi l’autorité et la continuité du règne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme et la répétition de « l’amour fidèle » sont conservés; « loyauté » évite la redondance française que produirait « amour fidèle et fidélité » tout en rendant la nuance contextuelle de אֱמֶת.
