source:
  edition: WLC
  text: מִתְהַלֵּ֣ךְ בְּ/תֻמּ֣/וֹ צַדִּ֑יק אַשְׁרֵ֖י בָנָ֣י/ו אַחֲרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
translation:
  language: fr
  text: Le juste marche dans son intégrité ; heureux[a] sont ses enfants[b] après lui !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que ses enfants sont heureux ! » ; l’hébreu emploie une exclamation de félicité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses fils » ; le mot hébreu peut désigner ici ses enfants, garçons et filles.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  choice: marche
  rationale: Le participe hitpael de הלך décrit ici la manière habituelle de vivre ou de se conduire. « Marche » conserve la métaphore hébraïque, familière au registre sapientiel, tout en restant intelligible en français.
- source_word: בְּתֻמּוֹ
  choice: dans son intégrité
  rationale: תֹּם désigne l’intégrité, la droiture entière ou l’irréprochabilité du caractère. « Dans son intégrité » rend directement la préposition בְּ sans réduire le terme à la seule honnêteté.
- source_word: צַדִּיק
  choice: le juste
  rationale: Le masculin singulier désigne de façon représentative une personne juste. « Le juste » est une formulation proverbiale naturelle et digne en français.
- source_word: אַשְׁרֵי
  choice: heureux
  rationale: אַשְׁרֵי est une exclamation qui proclame l’état enviable ou florissant de quelqu’un. « Heureux » en restitue naturellement la force sans imposer l’idée d’une bénédiction explicitement prononcée par Dieu.
- source_word: בָנָיו
  choice: ses enfants
  rationale: Bien que בָּנִים signifie formellement « fils », le mot peut englober la descendance. Le contexte porte sur les enfants du juste sans exiger une restriction aux seuls garçons.
- source_word: אַחֲרָיו
  choice: après lui
  rationale: Cette expression compacte peut évoquer les enfants qui viennent après leur père, notamment dans la succession des générations. La traduction conserve cette concision et sa légère ouverture de sens.
theological_decisions:
- issue: Masculin représentatif dans une maxime sapientielle
  choice: le juste
  alternative: la personne juste
  rationale: L’hébreu emploie un masculin singulier représentatif. Le français proverbial « le juste » respecte cette forme sans affirmer que le principe serait réservé aux hommes.
- issue: Nature de la félicité exprimée par אַשְׁרֵי
  choice: heureux
  alternative: bénis
  rationale: Le terme proclame une situation enviable et favorable, sans employer la formule hébraïque habituelle signifiant explicitement « béni ». « Heureux » préserve cette distinction et laisse ouverte la dimension théologique de cette félicité.
translation_notes:
  register: Formulation concise et proverbiale. Le point-virgule fait ressortir le lien entre l’intégrité du juste et la condition enviable de ses enfants, tandis que l’exclamation française reproduit la force de אַשְׁרֵי. L’ellipse de « sont » conserve le rythme serré de l’hébreu sans nuire à la compréhension.
