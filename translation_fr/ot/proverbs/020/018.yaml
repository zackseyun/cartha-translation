  text: מַ֭חֲשָׁבוֹת בְּ/עֵצָ֣ה תִכּ֑וֹן וּ֝/בְ/תַחְבֻּל֗וֹת עֲשֵׂ֣ה מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/018.yaml
  text: Plans are established by counsel[a]; wage war with strategy.
translation:
  language: fr
  text: Les projets s’affermissent par le conseil[a] ; fais la guerre avec une stratégie bien pensée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce aux avis reçus ». Le terme hébreu désigne un conseil ou un avis qui aide à prendre une décision.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  choice: les projets
  rationale: Dans ce contexte pratique, le pluriel désigne des intentions ou des lignes d’action projetées, plutôt que de simples pensées.
- source_word: בְּעֵצָה
  choice: par le conseil
  rationale: 'La préposition a ici une valeur instrumentale : le conseil est le moyen par lequel les projets deviennent fermes.'
- source_word: תִכּוֹן
  choice: s’affermissent
  rationale: Le niphal de כון exprime l’idée d’être établi ou rendu ferme. Le pluriel est naturel en français avec « les projets ».
- source_word: וּבְתַחְבֻּלוֹת
  choice: avec une stratégie bien pensée
  rationale: Le terme évoque l’art de diriger ou de gouverner habilement et, dans le contexte militaire, une conduite stratégique avisée. Cette formulation conserve à la fois l’idée de stratégie et celle de direction réfléchie.
- source_word: עֲשֵׂה
  choice: fais
  rationale: Avec « guerre », עשה forme l’expression « faire la guerre », idiomatique et directe en français.
- source_word: מִלְחָמָה
  choice: la guerre
  rationale: Le nom désigne la guerre ou l’activité guerrière au sens large ; « la guerre » restitue directement la portée de l’impératif.
