  text: Many a man proclaims his own loyalty[b][a], but who can find a faithful man?
translation:
  language: fr
  text: Bien des gens proclament leur propre bonté[a], mais un homme fidèle[b], qui peut le trouver ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa loyauté » ou « son amour fidèle ». Le mot hébreu peut désigner la bonté, la loyauté ou un amour constant.
    reason: lexical_alternative
  - marker: b
    text: Ou « mais un homme digne de confiance, qui peut le trouver ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אָדָם
  choice: Beaucoup
  rationale: L’expression associe « beaucoup » à un terme générique désignant l’être humain. En français, « beaucoup » exprime naturellement cette pluralité distributive sans alourdir le proverbe.
- source_word: יִקְרָא
  choice: proclament
  rationale: Dans ce contexte, le verbe signifie déclarer ou faire valoir publiquement une qualité que l’on s’attribue.
- source_word: אִישׁ חַסְדּוֹ
  choice: chacun sa bonté
  rationale: Le suffixe possessif est rendu distributivement par « chacun sa ». Ici, חֶסֶד désigne la bonté loyale dont chacun se prévaut; « bonté » conserve sa dimension morale sans imposer un cadre exclusivement covenantal.
- source_word: וְאִישׁ אֱמוּנִים
  choice: mais un homme vraiment fidèle
  rationale: אֱמוּנִים évoque la fidélité, la fiabilité et la constance. « Vraiment » fait ressortir le contraste entre la qualité proclamée et celle qui se vérifie réellement, sans ajouter une idée étrangère au parallélisme.
- source_word: מִי יִמְצָא
  choice: qui le trouvera ?
  rationale: L’interrogation rhétorique souligne la rareté d’une telle personne. La tournure française conserve l’ordre marqué et la force proverbiale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme oppose les qualités que beaucoup revendiquent à la rareté d’une personne dont la fidélité est réelle. Le masculin singulier de la seconde proposition est conservé parce que le texte hébreu emploie explicitement אִישׁ.
