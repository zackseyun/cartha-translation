  yaml_path: translation/ot/proverbs/020/009.yaml
  text: Who can say[a], “I have made my heart pure; I am clean from my sin” ?
translation:
  language: fr
  text: 'Qui peut dire[a] : « J’ai rendu mon cœur pur, je suis pur de mon péché » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Qui dira : “J’ai purifié mon cœur, je suis devenu pur de mon péché” ? » Le premier verbe souligne l’action de rendre le cœur pur ; le second peut exprimer le fait d’être ou de devenir pur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יֹאמַר
  choice: Qui peut dire
  rationale: מִי signifie littéralement « qui » et יֹאמַר « dira/peut dire » selon le contexte. L’ajout idiomatique de « peut » fait ressortir en français la force rhétorique de la question sans changer son sens.
- source_word: זִכִּיתִי
  choice: J’ai purifié
  rationale: Le piel de זכה exprime ici l’action de rendre pur, avec « mon cœur » pour objet. « J’ai purifié » conserve cette nuance active et causative.
- source_word: לִבִּי
  choice: mon cœur
  rationale: « Cœur » préserve le langage anthropologique biblique et désigne ici le centre intérieur et moral de la personne.
- source_word: טָהַרְתִּי
  choice: je suis pur
  rationale: Le verbe טהר peut indiquer le fait d’être ou de devenir pur. « Je suis pur » exprime naturellement en français l’état résultant, sans imposer une valeur réflexive.
- source_word: מֵחַטָּאתִי
  choice: de mon péché
  rationale: חטאת désigne ici le péché, tandis que מִן marque la séparation. « Pur de mon péché » rend la construction de façon concise et intelligible.
theological_decisions:
- issue: Prétention à la pureté intérieure et morale
  choice: La formulation conserve une question rhétorique qui met en cause la possibilité de revendiquer une pureté intérieure et l’absence de péché.
  alternative: Une simple question descriptive portant sur les personnes capables de faire une telle affirmation.
  rationale: Le parallélisme entre la purification du cœur et la pureté à l’égard du péché présente une affirmation absolue. La traduction laisse entendre la réponse négative attendue sans l’ajouter explicitement ni développer une doctrine au-delà du texte.
translation_notes:
  register: Français international moderne, sobre et dignifié. Le parallélisme poétique est conservé, ainsi que le terme biblique « cœur ». La ponctuation française place une espace avant les deux-points et le point d’interrogation.
