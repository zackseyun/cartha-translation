source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה אֶ֣בֶן וָ/אָ֑בֶן וּ/מֹאזְנֵ֖י מִרְמָ֣ה לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
translation:
  language: fr
  text: Des poids inégaux[a] sont une abomination pour Yahweh, et des balances frauduleuses ne sont pas bonnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une pierre et une pierre », expression désignant des poids différents employés malhonnêtement dans le commerce.'
    reason: Alternative lexicale et explication de l’idiome.
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Ce terme exprime une réprobation morale très forte. « Une abomination » en conserve la vigueur et appartient au registre biblique courant en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: אֶבֶן וָאָבֶן
  choice: des poids inégaux
  rationale: L’expression signifie littéralement « une pierre et une pierre » et désigne deux poids différents employés malhonnêtement dans le commerce. La formulation retenue transmet naturellement cet idiome en français.
- source_word: וּמֹאזְנֵי מִרְמָה
  choice: et les balances faussées
  rationale: Le syntagme désigne des balances servant à tromper. « Faussées » exprime clairement la fraude commerciale sans rendre les balances elles-mêmes moralement responsables.
- source_word: לֹא טוֹב
  choice: ne sont pas bonnes
  rationale: Cette traduction conserve la négation mesurée de l’hébreu, sans l’intensifier en « sont mauvaises » ou « sont inacceptables ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme; la translittération « Yahweh » préserve le nom personnel divin au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme proverbial et la formulation sobre « ne sont pas bonnes » sont conservés.
