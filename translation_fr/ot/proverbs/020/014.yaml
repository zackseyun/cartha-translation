  yaml_path: translation/ot/proverbs/020/014.yaml
  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
translation:
  language: fr
  text: « Pas bon, pas bon ! » dit l’acheteur ; quand il s’en va, alors il se vante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Mauvais, mauvais ! », « Ce n’est pas bon, ce n’est pas bon ! » ou « Ça ne vaut rien, ça ne vaut rien ! » L’hébreu répète « mauvais » pour insister : l’acheteur cherche à faire baisser la valeur de l’objet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע רַע
  choice: « Mauvais, mauvais ! »
  rationale: La répétition conserve la formule brève et insistante par laquelle l’acheteur déprécie l’objet pendant le marchandage.
- source_word: יֹאמַר
  choice: dit
  rationale: L’imparfait exprime ici une action habituelle dans une maxime ; le présent français convient au style proverbial.
- source_word: הַקּוֹנֶה
  choice: l’acheteur
  rationale: Dans ce contexte commercial, ce terme courant rend précisément la personne qui achète.
- source_word: וְאֹזֵל לוֹ
  choice: puis il s’en va
  rationale: Cette formulation naturelle marque la suite de la scène sans donner à la conjonction une valeur adversative plus explicite que ne l’impose l’hébreu.
- source_word: אָז
  choice: puis
  rationale: Le français peut intégrer naturellement la succession temporelle dans « puis », en évitant la lourdeur de « et alors ».
- source_word: יִתְהַלָּל
  choice: se vante
  rationale: La forme réfléchie exprime l’autosatisfaction de l’acheteur, qui se félicite implicitement de l’affaire conclue.
