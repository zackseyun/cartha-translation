  text: מוֹקֵ֣שׁ אָ֭דָם יָ֣לַע קֹ֑דֶשׁ וְ/אַחַ֖ר נְדָרִ֣ים לְ/בַקֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/025.yaml
  text: It is a snare for a man to rashly dedicate something as holy, and only afterward to consider his vows.
translation:
  language: fr
  text: 'C’est un piège pour quelqu’un de déclarer à la légère : « C’est sacré ! », puis de ne réfléchir qu’après avoir fait des vœux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un verbe rare dont le sens précis est incertain. On peut aussi comprendre : « de consacrer précipitamment quelque chose comme sacré », ou « de vouer précipitamment une chose sacrée ».'
    reason: Signale l’incertitude de יָלַע et préserve les lectures qui comprennent l’expression comme un acte de consécration plutôt que comme une déclaration.
lexical_decisions:
- source_word: מוֹקֵשׁ
  choice: un piège
  rationale: Rend directement l’image du piège ou du traquenard qui entraîne des conséquences néfastes.
- source_word: אָדָם
  choice: quelqu’un
  rationale: Le nom est générique ici; « quelqu’un » est inclusif et naturel en français moderne.
- source_word: יָלַע קֹדֶשׁ
  choice: consacrer quelque chose à Dieu à la légère
  rationale: L’expression hébraïque est très concise et son verbe rare est incertain; dans ce contexte, elle désigne vraisemblablement un acte ou une déclaration précipitée par laquelle une chose est vouée comme sacrée. « À Dieu » explicite la portée cultuelle de קֹדֶשׁ sans désigner une offrande particulière.
- source_word: וְאַחַר נְדָרִים לְבַקֵּר
  choice: puis de réfléchir seulement après avoir fait ses vœux
  rationale: 'Conserve le contraste temporel: l’examen ou la réflexion n’arrive qu’après l’engagement solennel.'
theological_decisions:
- issue: Nature de la faute dénoncée
  choice: Une consécration faite à la légère, suivie d’une réflexion tardive
  alternative: Une interdiction générale de revenir sur un vœu
  rationale: Le verset critique explicitement la précipitation et l’examen après coup; il ne formule pas à lui seul une doctrine exhaustive sur tous les vœux.
- issue: Destinataire de la consécration
  choice: « à Dieu »
  alternative: « comme sacré »
  rationale: Dans le contexte sapientiel et cultuel des vœux, le statut de קֹדֶשׁ implique une mise à part pour Dieu. Cette formulation reste générale et n’ajoute aucune pratique confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux temps met en relief l’engagement irréfléchi puis la réflexion trop tardive. « À la légère » exprime naturellement la précipitation coupable sans alourdir la phrase.
