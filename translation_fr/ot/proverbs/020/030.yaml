id: PRO.20.30
reference: Proverbs 20:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/030.yaml
  text: The bruises of a wound cleanse away evil[b][a], and blows cleanse the innermost parts of the belly.
translation:
  language: fr
  text: Les meurtrissures d’une blessure purgent le mal[a], et les coups purifient[c] les profondeurs du ventre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nettoient le mal » ou « décapent le mal » ; le verbe hébreu peut évoquer le fait de nettoyer à fond, de récurer ou de purger.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les chambres du ventre », expression hébraïque désignant les parties les plus profondes de la personne.
    reason: cultural_note
  - marker: c
    text: Le verbe « purifient » est sous-entendu en hébreu et repris du premier membre par parallélisme.
    reason: textual_clarity
lexical_decisions:
- source_word: חַבֻּרוֹת
  choice: meurtrissures
  rationale: Le nom désigne les marques ou contusions laissées par des coups. « Meurtrissures » conserve l’image corporelle et reste naturel dans un registre proverbial soutenu.
- source_word: פֶּצַע
  choice: d’une blessure
  rationale: 'Le terme est rendu comme complément de חַבֻּרוֹת, conformément à la construction compacte du texte : « les meurtrissures d’une blessure ».'
- source_word: תמריק
  choice: purgent
  rationale: Le verbe מרק à la forme causative évoque l’action de nettoyer, récurer ou purger. « Purgent » exprime ici l’élimination douloureuse du mal sans réduire la métaphore à une simple correction morale.
- source_word: בְּרָע
  choice: le mal
  rationale: Dans ce contexte, רָע désigne le mal sur lequel agit le processus de purification. La formulation concise garde le poids moral du proverbe.
- source_word: וּמַכּוֹת
  choice: et les coups
  rationale: Le nom désigne des coups portés. Cette traduction directe maintient le parallélisme concret avec les meurtrissures et la blessure du premier membre.
- source_word: חַדְרֵי בָטֶן
  choice: les profondeurs du ventre
  rationale: Littéralement « les chambres du ventre », expression qui désigne l’intérieur le plus profond de la personne. « Les profondeurs du ventre » conserve la métaphore corporelle tout en étant compréhensible en français moderne.
theological_decisions:
- issue: Portée de l’image de la discipline douloureuse
  choice: Le proverbe présente les blessures et les coups comme pouvant éliminer le mal jusque dans l’intériorité profonde d’une personne.
  alternative: Le verset peut décrire plus largement l’effet purificateur de la souffrance, sans viser spécifiquement une punition disciplinaire.
  rationale: Les images parallèles de meurtrissures et de coups suggèrent naturellement une correction douloureuse, mais le texte ne formule pas une doctrine générale sur toute souffrance. La traduction maintient l’image sans explicitation doctrinale.
- issue: Verbe sous-entendu dans le second membre
  choice: Rendre le parallélisme par « purifient », verbe explicitement ajouté en français.
  alternative: 'Conserver une proposition nominale elliptique : « et les coups, les profondeurs du ventre ».'
  rationale: L’hébreu ne répète pas le verbe dans le second membre. Le français exige ici de l’expliciter pour être intelligible ; « purifient » reprend le sens de תמריק tout en signalant cet ajout dans une note.
translation_notes:
  register: Français international moderne, concis et proverbial. Le registre demeure digne ; les images corporelles de l’hébreu sont conservées, tandis que l’ellipse du second membre est explicitée pour assurer une lecture naturelle.
