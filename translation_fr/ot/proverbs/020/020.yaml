  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
translation:
  language: fr
  text: Celui qui maudit son père et sa mère — sa lampe s’éteindra au plus profond des ténèbres[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la pupille des ténèbres », expression hébraïque désignant les ténèbres les plus profondes.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « sa lampe sera éteinte dans d’épaisses ténèbres ». La lampe peut symboliser la vie, le bien-être ou l’avenir d’une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַלֵּל
  choice: Celui qui maudit
  rationale: Le participe piel substantivé désigne de manière générale toute personne qui profère une malédiction. « Maudit » conserve ici le sens fort de קלל et convient au contexte de l’honneur dû aux parents.
- source_word: אָבִיו וְאִמּוֹ
  choice: son père ou sa mère
  rationale: 'Bien que ו soit formellement conjonctif, le français emploie naturellement « ou » dans cette formulation générale : l’énoncé vise celui qui maudit l’un ou l’autre de ses parents, sans exiger que les deux soient maudits.'
- source_word: יִדְעַךְ
  choice: s’éteindra
  rationale: Le verbe exprime l’extinction d’une lampe. La forme pronominale française est naturelle, ne précise aucun agent et préserve l’idée que la lampe cessera de brûler.
- source_word: נֵרוֹ
  choice: sa lampe
  rationale: La traduction littérale maintient l’image concrète de la littérature sapientielle, susceptible d’évoquer la vie, le bien-être, la descendance ou l’avenir de la personne sans réduire la métaphore à une seule interprétation.
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  choice: au plus profond des ténèbres
  rationale: L’expression hébraïque, littéralement « dans la pupille des ténèbres », est idiomatique et désigne l’obscurité la plus profonde. Cette formulation française en restitue l’intensité sans produire une image incompréhensible.
theological_decisions:
- issue: Portée symbolique de « sa lampe »
  choice: Conserver la métaphore sans en fixer le référent dans le texte principal
  alternative: Traduire explicitement par « sa vie », « son avenir » ou « sa prospérité »
  rationale: Dans les Proverbes, la lampe peut évoquer plusieurs dimensions liées à la vie et à l’avenir. Le texte ne tranche pas explicitement entre elles ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Celui qui » garde la généralité du participe hébreu ; « maudit » maintient la gravité de l’acte. La proposition juxtaposée après la virgule reproduit le parallélisme sentencieux sans alourdir la phrase.
