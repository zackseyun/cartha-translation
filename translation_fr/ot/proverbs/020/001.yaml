base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/001.yaml
  text: Wine is a mocker[a], strong drink a brawler, and whoever is led astray by it is not wise.
translation:
  language: fr
  text: Le vin est moqueur, la boisson enivrante est tapageuse ; quiconque s’en laisse égarer n’est pas sage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Le vin est railleur, la boisson enivrante est bruyante. » L’hébreu personnifie les boissons alcoolisées. Le pronom singulier peut renvoyer à la boisson mentionnée, prise collectivement ; la préposition peut signifier « par » ou « dans ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵץ
  choice: moqueur
  rationale: Le nom hébreu désigne habituellement un moqueur ou un railleur. Employé ici comme attribut du vin, « moqueur » garde la personnification tout en restant naturel en français.
- source_word: הַיַּיִן
  choice: le vin
  rationale: Équivalent français courant de יין. L’article défini convient à la formulation générale du proverbe en français.
- source_word: הֹמֶה
  choice: tapageuse
  rationale: Le participe exprime le bruit, l’agitation ou le tumulte. « Tapageuse » restitue directement cette idée et prolonge la personnification des boissons.
- source_word: שֵׁכָר
  choice: la boisson enivrante
  rationale: Le terme désigne une boisson alcoolisée autre que le vin sans imposer une catégorie moderne précise. « Boisson enivrante » est plus clair en français actuel que « boisson forte », qui pourrait suggérer exclusivement des spiritueux distillés.
- source_word: שֹׁגֶה
  choice: s’égare
  rationale: Le verbe signifie errer ou s’écarter du bon chemin. « S’égare » conserve sa portée pratique et morale sans le réduire au seul fait de tituber.
- source_word: בּוֹ
  choice: s’y
  rationale: Le pronom hébreu est singulier. Le pronom adverbial « y » permet de conserver cette référence sans trancher artificiellement entre le vin, la boisson enivrante ou leur emprise collective.
- source_word: לֹא יֶחְכָּם
  choice: n’est pas sage
  rationale: L’imparfait hébreu exprime ici une vérité générale. Le présent français rend naturellement cette valeur proverbiale.
