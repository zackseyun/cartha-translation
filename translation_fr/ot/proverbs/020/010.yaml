source:
  edition: WLC
  text: אֶ֣בֶן וָ֭/אֶבֶן אֵיפָ֣ה וְ/אֵיפָ֑ה תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
translation:
  language: fr
  text: Des poids différents et des mesures différentes sont tous deux une abomination pour Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « pierre et pierre, épha et épha », c’est-à-dire des poids et des mesures différents employés de manière malhonnête dans le commerce.
    reason: Précision lexicale et culturelle sur les étalons commerciaux.
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  choice: des poids différents
  rationale: Littéralement « pierre et pierre ». Dans le contexte commercial, les pierres servent de poids sur une balance, et la répétition évoque deux étalons qui ne concordent pas.
- source_word: אֵיפָה וְאֵיפָה
  choice: des mesures différentes
  rationale: L’épha est une unité de mesure pour les matières sèches. Le terme générique « mesures » rend clairement ici l’idée d’étalons de capacité non concordants.
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Ce terme fort exprime ce que Yahweh juge profondément odieux; « abomination » en préserve la gravité morale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: גַּם שְׁנֵיהֶם
  choice: les uns comme les autres
  rationale: Cette tournure française souligne que les poids comme les mesures falsifiés sont pareillement condamnés.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » conserve le nom propre au lieu de lui substituer un titre.
- issue: Caractère implicite de la fraude commerciale
  choice: Le texte principal parle de poids et de mesures « différents », avec explication en note.
  alternative: Préciser dans le texte principal qu’ils sont faux ou truqués.
  rationale: L’hébreu décrit littéralement des étalons non concordants sans employer ici un adjectif signifiant directement « faux ». La note explicite l’usage malhonnête impliqué sans effacer cette formulation.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme concis du proverbe est conservé, ainsi que la force du mot « abomination ».
