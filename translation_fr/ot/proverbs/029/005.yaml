  text: גֶּ֭בֶר מַחֲלִ֣יק עַל רֵעֵ֑/הוּ רֶ֝֗שֶׁת פּוֹרֵ֥שׂ עַל פְּעָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/005.yaml
  text: A man who flatters his neighbor spreads a net for his steps[a][b].
translation:
  language: fr
  text: Un homme qui flatte son prochain tend un filet sous ses pas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ami » ou « son compagnon ». Le mot hébreu רֵעַ peut avoir ces différents sens.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur ses pas » ou « pour ses pas »; l’image est celle d’un filet disposé sur le passage de quelqu’un pour le prendre au piège.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: Un homme
  rationale: Le nom masculin singulier désigne couramment un homme. Dans ce proverbe, il a aussi une portée représentative, mais « un homme » conserve la forme du texte hébreu.
- source_word: מַחֲלִיק
  choice: qui flatte
  rationale: Le participe hiphil de חלק évoque ici le fait de rendre ses paroles lisses, donc de flatter. « Flatte » exprime naturellement et brièvement cet emploi idiomatique.
- source_word: עַל רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner un prochain, un ami ou un compagnon. « Son prochain » garde ici une portée sociale assez large; la préposition עַל est intégrée idiomatiquement au verbe français « flatter ».
- source_word: רֶשֶׁת
  choice: un filet
  rationale: Le terme désigne concrètement un filet servant à capturer; « filet » préserve l'image plutôt que de l'interpréter comme un piège au sens général.
- source_word: פּוֹרֵשׂ
  choice: tend
  rationale: Le participe signifie déployer ou étendre. En français, on « tend un filet », tournure naturelle qui conserve l'action imagée.
- source_word: עַל פְּעָמָיו
  choice: sous ses pas
  rationale: פְּעָמִים désigne les pas ou les pieds. « Sous ses pas » rend clairement l'image du filet placé là où avancera le prochain, tout en maintenant le référent naturel du suffixe.
