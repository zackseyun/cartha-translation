id: PRO.29.10
reference: Proverbs 29:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַנְשֵׁ֣י דָ֭מִים יִשְׂנְאוּ תָ֑ם וִֽ֝/ישָׁרִ֗ים יְבַקְשׁ֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/010.yaml
  text: Men of blood hate the blameless[a], but the upright seek his life.
translation:
  language: fr
  text: Les hommes sanguinaires haïssent l’homme irréprochable, mais les gens droits recherchent sa vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais les gens droits veillent sur sa vie » ou « cherchent à le protéger ». L’hébreu peut avoir ici un sens positif.'
    reason: Lecture alternative de l’expression hébraïque ambiguë יְבַקְשׁוּ נַפְשׁוֹ.
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  choice: les hommes sanguinaires
  rationale: L’expression désigne littéralement des « hommes de sang », c’est-à-dire des hommes portés au meurtre ou à la violence. « Hommes sanguinaires » conserve sa force morale tout en étant plus naturel en français moderne.
- source_word: יִשְׂנְאוּ
  choice: haïssent
  rationale: Équivalent direct et courant du verbe hébreu exprimant la haine.
- source_word: תָם
  choice: l’homme irréprochable
  rationale: Le terme évoque l’intégrité et une conduite sans reproche. Cette formulation le distingue de « les gens droits » dans le second membre.
- source_word: וִישָׁרִים
  choice: les gens droits
  rationale: Le pluriel désigne ceux dont la conduite est moralement droite. « Les gens droits » est naturel et conserve le sens collectif.
- source_word: יְבַקְשׁוּ
  choice: recherchent
  rationale: Le verbe signifie fondamentalement « chercher ». « Recherchent » maintient autant que possible l’indétermination de la tournure, qui peut être comprise de manière hostile ou bienveillante.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: נפש peut désigner la vie, la personne ou le soi. « Sa vie » conserve ici la tension entre chercher à prendre une vie et s’en préoccuper.
theological_decisions:
- issue: 'Ambiguïté du second membre : les gens droits cherchent-ils la vie de l’homme irréprochable pour la lui prendre, ou cherchent-ils à la préserver ?'
  choice: recherchent sa vie
  alternative: veillent sur sa vie ; cherchent à le protéger
  rationale: La formulation principale reste proche de יְבַקְשׁוּ נַפְשׁוֹ et ne tranche pas silencieusement une difficulté réelle du texte hébreu. La note signale explicitement la lecture positive.
translation_notes:
  register: Français international moderne, sobre et digne. « Hommes sanguinaires » restitue l’idiome hébreu sans le calquer maladroitement ; la tournure inhabituelle « recherchent sa vie » est conservée afin de ne pas effacer l’ambiguïté du second membre.
