  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
translation:
  language: fr
  text: Un homme souvent repris[a], mais qui raidit la nuque, sera soudain brisé, sans remède.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un homme qui reçoit maintes réprimandes et raidit la nuque sera soudain brisé, et il n’y aura pas de remède. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et présente ici une figure représentative dans une maxime de sagesse. « Un homme » respecte la forme du texte source tout en ayant une portée générale.
- source_word: תּוֹכָחוֹת
  choice: souvent repris
  rationale: Le pluriel évoque des réprimandes répétées. Cette formulation française naturelle exprime qu’il a reçu de nombreux avertissements, sans l’expression peu idiomatique « homme de réprimandes ».
- source_word: מַקְשֶׁה עֹרֶף
  choice: mais qui raidit la nuque
  rationale: Le participe hiphil associé à « nuque » décrit une résistance obstinée. « Raidit la nuque » conserve l’image corporelle hébraïque; « mais » rend la valeur concessive suggérée par l’enchaînement.
- source_word: פֶּתַע
  choice: soudain
  rationale: L’adverbe marque le caractère brusque et inattendu de la rupture annoncée.
- source_word: יִשָּׁבֵר
  choice: sera brisé
  rationale: Le niphal de שׁבר est rendu au passif, en conservant la métaphore sans préciser indûment la nature physique, sociale ou morale de la ruine.
- source_word: וְאֵין מַרְפֵּא
  choice: sans remède
  rationale: La tournure traduit de façon concise et naturelle l’absence de guérison ou de recours, et maintient le caractère définitif de l’énoncé.
