source:
  edition: WLC
  text: בִּ/רְב֣וֹת צַ֭דִּיקִים יִשְׂמַ֣ח הָ/עָ֑ם וּ/בִ/מְשֹׁ֥ל רָ֝שָׁ֗ע יֵאָ֥נַֽח עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/002.yaml
  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
translation:
  language: fr
  text: Quand les justes se multiplient[a], le peuple se réjouit ; mais quand un méchant gouverne, le peuple gémit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand les justes sont nombreux, le peuple se réjouit. » La construction infinitive hébraïque peut mettre l’accent soit sur leur accroissement, soit sur leur grand nombre.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Quand … se multiplient
  rationale: La préposition ב avec l’infinitif construit de רבה introduit ici une circonstance temporelle. « Se multiplient » exprime l’accroissement tout en laissant en note l’autre nuance possible, celle du grand nombre.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif pluriel est employé comme substantif. « Les justes » est concis, naturel et conserve la portée collective de l’hébreu.
- source_word: יִשְׂמַח
  choice: se réjouit
  rationale: Le verbe שמח exprime la joie. « Se réjouit » convient au registre proverbial et forme une antithèse nette avec « gémit ».
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne ici la population considérée collectivement. « Le peuple » est la formulation française la plus naturelle dans ce contexte.
- source_word: וּבִמְשֹׁל
  choice: mais quand … gouverne
  rationale: La conjonction suivie de ב et de l’infinitif construit de משל forme une seconde proposition temporelle. « Mais » rend explicitement le parallélisme antithétique, tandis que « gouverne » exprime l’exercice du pouvoir sans ajouter de titre particulier.
- source_word: רָשָׁע
  choice: un méchant
  rationale: L’adjectif masculin singulier est substantivé et désigne ici une personne injuste exerçant le pouvoir. « Un méchant » préserve le singulier et reste proche de la formulation concise de l’hébreu.
- source_word: יֵאָנַח
  choice: gémit
  rationale: Le niphal de אנח évoque un gémissement ou un soupir de détresse. « Gémit » restitue clairement la souffrance collective causée par un pouvoir mauvais.
- source_word: עָם
  choice: le peuple
  rationale: Bien que le second emploi soit sans article en hébreu, il renvoie au même ensemble collectif. La répétition de « le peuple » conserve l’équilibre du proverbe.
