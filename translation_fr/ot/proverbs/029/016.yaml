  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
translation:
  language: fr
  text: Quand les méchants deviennent nombreux, la transgression se multiplie ; mais les justes verront leur chute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assisteront à leur effondrement ». Le verbe hébreu signifie simplement « voir », et le nom peut désigner une chute ou un effondrement.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Quand … deviennent nombreux
  rationale: La préposition בְּ suivie de l’infinitif construit de רבה introduit une proposition temporelle. Cette formulation française exprime naturellement l’augmentation du nombre.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé pluriel désigne des personnes moralement coupables. « Les méchants » est concis et usuel dans la littérature de sagesse.
- source_word: יִרְבֶּה
  choice: grandit
  rationale: Le verbe רבה reprend l’idée d’accroissement du premier membre. « Grandit » convient naturellement avec le nom collectif « révolte » tout en préservant ce parallélisme.
- source_word: פָּשַׁע
  choice: la révolte
  rationale: פשע peut désigner une transgression conçue comme rébellion contre l’autorité ou l’ordre moral. « Révolte » conserve cette force mieux que le terme plus général « péché ».
- source_word: וְצַדִּיקִים
  choice: mais les justes
  rationale: Dans ce parallélisme, la conjonction introduit un contraste. « Les justes » est l’équivalent traditionnel et naturel de l’adjectif substantivé.
- source_word: בְּמַפַּלְתָּם
  choice: leur chute
  rationale: מַפָּלָה désigne une chute, une défaite ou un effondrement. Le suffixe masculin pluriel renvoie le plus naturellement aux méchants.
- source_word: יִרְאוּ
  choice: verront
  rationale: Le qal imparfait de ראה signifie simplement « voir ». Le futur français convient à l’orientation prospective de l’énoncé sans ajouter l’idée de joie ou de triomphe.
theological_decisions:
- issue: Référent du suffixe dans « leur chute »
  choice: Le suffixe renvoie aux méchants du premier membre.
  alternative: Le suffixe pourrait, en théorie, viser plus généralement ceux qui tombent.
  rationale: « Les méchants » constitue l’antécédent pluriel le plus proche et le parallélisme oppose leur multiplication présente à leur chute future, dont les justes seront témoins.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme d’accroissement est conservé par « deviennent nombreux » et « grandit », tandis que « verront » reste proche du verbe hébreu sans suggérer que les justes se réjouissent de la chute des méchants.
