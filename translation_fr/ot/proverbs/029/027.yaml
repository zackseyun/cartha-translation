  text: תּוֹעֲבַ֣ת צַ֭דִּיקִים אִ֣ישׁ עָ֑וֶל וְ/תוֹעֲבַ֖ת רָשָׁ֣ע יְשַׁר דָּֽרֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
translation:
  language: fr
  text: L’homme injuste est en horreur[a] aux justes, et celui dont la voie est droite[b] est en horreur au méchant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est une abomination pour » ou « est détestable aux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « droit de voie », c’est-à-dire celui dont la conduite est droite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: est en horreur à
  rationale: Le nom construit désigne ce qui provoque une très forte répulsion morale. La tournure française « être en horreur à » en conserve la force tout en restant naturelle et digne.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif masculin pluriel est employé comme substantif et désigne la catégorie morale des personnes justes.
- source_word: אִישׁ עָוֶל
  choice: l’homme injuste
  rationale: אִישׁ est un nom masculin singulier et עָוֶל caractérise ici l’homme par l’injustice ou le mal qu’il pratique. La formulation conserve le masculin représentatif du texte source.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif masculin singulier substantivé a une valeur générique. Le singulier est conservé et forme un contraste direct avec « les justes ».
- source_word: יְשַׁר דָּרֶךְ
  choice: celui dont la voie est droite
  rationale: La formulation préserve l’image sapientielle de la « voie » comme manière de vivre, tout en donnant une phrase idiomatique en français.
- source_word: דָּרֶךְ
  choice: voie
  rationale: « Voie » conserve la métaphore hébraïque du chemin suivi dans la vie et son sens éthique, sans la réduire directement à « conduite ».
theological_decisions:
- issue: Masculin représentatif dans אִישׁ עָוֶל
  choice: « l’homme injuste »
  alternative: « la personne injuste » ou « l’injuste »
  rationale: Le texte hébreu emploie explicitement le masculin singulier אִישׁ. La traduction le conserve sans prétendre que la maxime ne concernerait que les hommes.
- issue: Valeur morale de תּוֹעֵבָה
  choice: « être en horreur à »
  alternative: « être une abomination pour » ou « être détestable à »
  rationale: Cette expression maintient la forte répulsion morale réciproque des deux membres du verset sans ajouter une qualification cultuelle ou doctrinale absente du contexte.
translation_notes:
  register: Français international moderne, clair et soutenu. Le parallélisme antithétique est conservé, ainsi que la répétition de « est en horreur », la variation entre le pluriel « les justes » et le singulier générique « le méchant », et l’image biblique de la voie.
