source:
  edition: WLC
  text: יֹדֵ֣עַ צַ֭דִּיק דִּ֣ין דַּלִּ֑ים רָ֝שָׁ֗ע לֹא יָבִ֥ין דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/007.yaml
  text: A righteous man knows the case of the poor[b][a]; a wicked man does not understand knowledge.
translation:
  language: fr
  text: Le juste connaît la cause des pauvres[a] ; le méchant ne comprend pas ce qu’est la connaissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le droit des pauvres » ou « l’affaire des pauvres ». Le mot hébreu peut désigner une cause, un droit, une affaire judiciaire ou la justice.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte simplement « ne comprend pas la connaissance ». Il n’explicite pas si cette « connaissance » renvoie directement à la cause des pauvres mentionnée dans le premier membre.
    reason: ambiguity
lexical_decisions:
- source_word: יֹדֵעַ
  choice: connaît
  rationale: Le participe de ידע exprime directement le fait de connaître ou de reconnaître. « Connaît » préserve ce sens sans ajouter explicitement l’idée, pourtant possible en contexte, de prendre soin de leur cause.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier employé comme nom désigne ici un type représentatif. « Le juste » est naturel dans le registre sapiential français.
- source_word: דִּין
  choice: la cause
  rationale: דִּין peut désigner une affaire judiciaire, une cause, un droit ou la justice. « La cause » convient au rapport avec les pauvres et conserve à la fois la dimension juridique et sociale.
- source_word: דַּלִּים
  choice: des pauvres
  rationale: Le pluriel désigne les personnes pauvres, faibles ou socialement vulnérables. « Les pauvres » est clair, courant et suffisamment large dans ce contexte.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Comme צַדִּיק, cet adjectif masculin singulier est substantivé et présente un type humain opposé au juste.
- source_word: יָבִין
  choice: comprend
  rationale: Le verbe בין signifie comprendre ou discerner. « Comprend » rend clairement le contraste avec « connaît ».
- source_word: דָּעַת
  choice: la connaissance
  rationale: Le nom abstrait signifie « connaissance » ou « savoir ». La formulation reste volontairement abrupte, comme l’hébreu, plutôt que de remplacer le nom par un pronom interprétatif.
theological_decisions:
- issue: Portée de la connaissance attribuée au juste
  choice: « connaît la cause »
  alternative: « défend la cause » ou « se soucie de la cause »
  rationale: Le contexte implique probablement une attention concrète à la situation des pauvres, mais le verbe hébreu signifie d’abord « connaître ». La traduction n’explicite donc pas une action que le texte laisse implicite.
- issue: Lien entre « connaissance » et la première proposition
  choice: Conserver « la connaissance »
  alternative: « ne comprend pas cela » ou « ne comprend pas une telle connaissance »
  rationale: L’hébreu emploie le nom abstrait דָּעַת sans démonstratif. La traduction préserve cette tension plutôt que d’imposer un lien référentiel précis avec la cause des pauvres.
translation_notes:
  register: Français international moderne, sobre et sapiential. Le parallélisme antithétique et les deux substantifs masculins représentatifs (« le juste », « le méchant ») sont conservés. La légère étrangeté de « ne comprend pas la connaissance » reflète celle de l’expression hébraïque sans la résoudre silencieusement.
