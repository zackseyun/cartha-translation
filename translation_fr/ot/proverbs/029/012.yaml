  text: מֹ֭שֵׁל מַקְשִׁ֣יב עַל דְּבַר שָׁ֑קֶר כָּֽל מְשָׁרְתָ֥י/ו רְשָׁעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: fr
  text: Si un dirigeant prête l’oreille à une parole mensongère, tous ses serviteurs sont méchants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne comporte pas de verbe exprimé ; dans le contexte, on peut aussi comprendre : « tous ses serviteurs deviennent méchants ».'
    reason: Préserve dans le texte la prédication nominale hébraïque tout en signalant l’interprétation dynamique possible, également retenue dans l’audit anglais.
lexical_decisions:
- source_word: מֹשֵׁל
  choice: un dirigeant
  rationale: Terme général désignant celui qui gouverne ou exerce l’autorité; « dirigeant » convient à la portée générale du proverbe.
- source_word: מַקְשִׁיב עַל
  choice: prête l’oreille à
  rationale: Rend l’idée d’écouter avec attention ou d’accorder du crédit, dans un français naturel et digne.
- source_word: דְּבַר שָׁקֶר
  choice: une parole mensongère
  rationale: Conserve le singulier hébreu et l’idée d’un propos caractérisé par le mensonge.
- source_word: מְשָׁרְתָיו
  choice: ses serviteurs
  rationale: Désigne les personnes au service du dirigeant, notamment ses subordonnés ou fonctionnaires.
- source_word: רְשָׁעִים
  choice: méchants
  rationale: Rend la qualification morale forte du terme hébreu sans l’atténuer en simple incompétence ou erreur.
theological_decisions:
- issue: Valeur de la proposition nominale finale
  choice: deviennent méchants
  alternative: sont méchants
  rationale: L’hébreu ne comporte pas de copule et peut décrire l’état de l’entourage du dirigeant. Dans la logique causale du proverbe, « deviennent » exprime naturellement l’effet corrupteur de son écoute, tandis que la note conserve la lecture stative plus formelle.
translation_notes:
  register: Français international moderne, clair et proverbial. « Prête l’oreille » conserve une dignité littéraire accessible; la phrase reste concise et parallèle à la structure hébraïque.
