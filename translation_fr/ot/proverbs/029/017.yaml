  text: יַסֵּ֣ר בִּ֭נְ/ךָ וִֽ/ינִיחֶ֑/ךָ וְ/יִתֵּ֖ן מַעֲדַנִּ֣ים לְ/נַפְשֶֽׁ/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/017.yaml
  text: Discipline your son[a], and he will give you rest[b]; he will give delights to your soul.
translation:
  language: fr
  text: Discipline ton fils, et il te donnera du repos ; il procurera des délices à ton âme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, pour « des délices », « des choses agréables » ou « des joies » ; et pour « âme », « vie », « personne » ou « être intérieur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Corrige
  rationale: Le piel impératif de יסר exprime une correction éducative active. « Corrige » est naturel en français et conserve ici l’idée de discipline formatrice.
- source_word: בִּנְךָ
  choice: ton fils
  rationale: L’hébreu désigne explicitement le fils au masculin singulier ; il n’est donc pas généralisé en « enfant ».
- source_word: וִינִיחֶךָ
  choice: il te donnera du repos
  rationale: 'Le hiphil de נוח a une valeur causative : le fils amènera le parent au repos ou au soulagement. Cette tournure préserve ce sens et le parallélisme avec « il procurera ».'
- source_word: וְיִתֵּן
  choice: il procurera
  rationale: נתן signifie normalement « donner ». « Procurera » évite en français la répétition maladroite de « donnera » tout en gardant l’idée d’un bien accordé.
- source_word: מַעֲדַנִּים
  choice: des délices
  rationale: Le pluriel désigne des choses agréables, des joies ou des délices. « Des délices » conserve l’image poétique sans la réduire aux mets délicats.
- source_word: לְנַפְשֶׁךָ
  choice: à ton âme
  rationale: נפש peut désigner l’âme, la vie ou la personne intérieure. « À ton âme » préserve la profondeur anthropologique et l’ambiguïté du texte.
