  yaml_path: translation/ot/proverbs/029/024.yaml
  text: Whoever shares with a thief hates his own life[b][a]; he hears a curse and does not disclose it.
translation:
  language: fr
  text: Celui qui s’associe à un voleur hait sa propre vie[b] ; il entend une adjuration[a] et ne dit rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une malédiction ». Le terme hébreu peut désigner une formule de malédiction ou une adjuration solennelle, probablement prononcée dans un cadre juridique pour obliger un témoin à parler.
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, en se rendant complice du voleur et en refusant de révéler ce qu’il sait, il agit contre son propre intérêt.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹלֵק עִם גַּנָּב
  choice: s’associe à un voleur
  rationale: Le participe חוֹלֵק exprime le fait de partager ou de prendre part avec quelqu’un. Dans ce contexte, la formulation française indique naturellement la complicité avec un voleur sans limiter le sens au seul partage du butin.
- source_word: שׂוֹנֵא נַפְשׁוֹ
  choice: hait sa propre vie
  rationale: נֶפֶשׁ peut désigner la vie ou la personne elle-même. « Sa propre vie » conserve ici l’image forte de l’hébreu et souligne le caractère autodestructeur de cette complicité.
- source_word: אָלָה
  choice: l’adjuration
  rationale: Le nom peut désigner une malédiction ou une formule solennelle qui oblige quelqu’un à parler, probablement dans un cadre judiciaire. « L’adjuration » préserve cette dimension juridique sans effacer la nuance de malédiction, expliquée en note.
- source_word: יִשְׁמַע
  choice: il entend
  rationale: Le verbe signifie simplement « entendre ». La traduction évite d’expliciter dans le texte principal un cadre judiciaire qui reste implicite.
- source_word: וְלֹא יַגִּיד
  choice: mais ne révèle rien
  rationale: Le hifil de נגד signifie déclarer, rapporter ou faire connaître. « Ne révèle rien » exprime naturellement le refus de communiquer ce que l’on sait, sans imposer le sens plus précis de témoignage en justice.
theological_decisions:
- issue: Portée de l’expression « hait sa propre vie »
  choice: Conserver l’image forte et concrète de l’hébreu
  alternative: « se fait du tort à lui-même » ou « se déteste lui-même »
  rationale: Le texte décrit une conduite autodestructrice sans formuler une théorie sur l’âme. La traduction retenue garde la tension proverbiale et le sens contextuel de נֶפֶשׁ.
translation_notes:
  register: Français moderne, international et digne. « S’associe à » rend la complicité de façon naturelle ; « hait sa propre vie » conserve la vigueur de l’image hébraïque. Le terme plus rare « adjuration » est maintenu pour sa précision et éclairé par une note.
