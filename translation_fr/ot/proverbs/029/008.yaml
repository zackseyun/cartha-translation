  text: אַנְשֵׁ֣י לָ֭צוֹן יָפִ֣יחוּ קִרְיָ֑ה וַ֝/חֲכָמִ֗ים יָשִׁ֥יבוּ אָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/008.yaml
  text: Mockers inflame a city[b][a], but wise men turn away anger.
translation:
  language: fr
  text: 'Les moqueurs embrasent une ville[a],

    mais les sages détournent la colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sèment l’agitation dans une ville » ; le verbe hébreu évoque le fait d’attiser ou d’allumer, probablement ici au sens figuré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  choice: les moqueurs
  rationale: La locution signifie littéralement « hommes de moquerie ». « Les moqueurs » exprime naturellement ce type de personne caractéristique des Proverbes.
- source_word: יָפִיחוּ
  choice: embrasent
  rationale: Dans ce contexte, la forme causative évoque le fait d’attiser ou de faire éclater un feu, au sens propre ou figuré. « Embrasent » conserve cette image forte et peut désigner les troubles qui gagnent toute une ville.
- source_word: קִרְיָה
  choice: une ville
  rationale: Le nom désigne une ville ou une cité. « Une ville » est le terme courant et convient à l’ampleur collective du désordre évoqué.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Le pluriel masculin hébreu désigne ici la catégorie des personnes sages. « Les sages » est idiomatique en français et maintient le parallélisme avec « les moqueurs ».
- source_word: יָשִׁיבוּ
  choice: détournent
  rationale: La forme causative de שוב signifie faire revenir ou repousser. Avec la colère pour objet, « détournent » conserve l’idée de l’écarter plutôt que de simplement la calmer.
- source_word: אָף
  choice: la colère
  rationale: Bien que le mot signifie littéralement « nez », il désigne couramment la colère. « La colère » est clair et naturel, sans préciser si elle est individuelle ou collective.
