  text: חָזִ֗יתָ אִ֭ישׁ אָ֣ץ בִּ/דְבָרָ֑י/ו תִּקְוָ֖ה לִ/כְסִ֣יל מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/020.yaml
  text: Do you see a man who is hasty in his words? There is more hope for a fool than for him[a].
translation:
  language: fr
  text: As-tu vu un homme qui parle avec précipitation[a] ? Il y a plus d’espoir pour un insensé que pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vois-tu un homme qui parle avec précipitation ? » Le verbe hébreu à l’accompli peut introduire ici une observation rhétorique rendue au passé ou, de façon idiomatique, au présent.'
    reason: alternative lexicale et aspectuelle
lexical_decisions:
- source_word: חָזִיתָ
  choice: As-tu vu
  rationale: Le qal accompli à la 2e personne du singulier est rendu directement par le passé composé. La question rhétorique convient à la formule d’observation employée dans la littérature de sagesse.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu désigne ici un homme au singulier et sert de figure représentative dans le proverbe.
- source_word: אָץ בִּדְבָרָיו
  choice: qui parle avec précipitation
  rationale: Littéralement « qui se hâte dans ses paroles ». Cette formulation française naturelle conserve l’idée d’une parole produite trop vite, sans ajouter explicitement la notion de témérité.
- source_word: תִּקְוָה
  choice: espoir
  rationale: Le terme exprime ici la perspective d’une amélioration ou d’une issue favorable ; « espoir » est son équivalent français usuel.
- source_word: כְסִיל
  choice: insensé
  rationale: Terme sapientiel désignant une personne moralement et intellectuellement obtuse. « Insensé » préserve cette portée éthique sans réduire le sens à un manque d’intelligence.
- source_word: מִמֶּנּוּ
  choice: que pour lui
  rationale: La préposition מן marque la comparaison. Le français explicite naturellement « plus d’espoir pour… que pour… », et le pronom renvoie à l’homme qui parle avec précipitation.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La structure interrogative et la comparaison incisive du proverbe sont conservées, tandis que « qui parle avec précipitation » rend naturellement l’expression hébraïque littérale « pressé dans ses paroles ».
