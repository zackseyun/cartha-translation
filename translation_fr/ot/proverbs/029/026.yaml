  text: רַ֭בִּים מְבַקְשִׁ֣ים פְּנֵי מוֹשֵׁ֑ל וּ֝/מֵ/יְהוָ֗ה מִשְׁפַּט אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/026.yaml
  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: fr
  text: Beaucoup recherchent la faveur d’un dirigeant, mais c’est du SEIGNEUR que vient la justice de chacun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקְשִׁים פְּנֵי
  choice: recherchent la faveur
  rationale: L’expression idiomatique « chercher le visage de » signifie chercher l’accès, l’attention ou la faveur d’une personne; la traduction naturelle explicite ici cette valeur sans ajouter l’idée plus précise d’un résultat garanti.
- source_word: מוֹשֵׁל
  choice: dirigeant
  rationale: Terme général désignant celui qui gouverne ou exerce l’autorité; « dirigeant » conserve cette portée sans imposer un titre politique particulier.
- source_word: מִשְׁפַּט אִישׁ
  choice: le droit de chacun
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou le droit reconnu dans une cause. « Le droit de chacun » rend la construction distributive avec אִישׁ et conserve le contexte judiciaire.
theological_decisions:
- issue: Origine ultime de la justice
  choice: « c’est du SEIGNEUR que vient le droit de chacun »
  alternative: « le SEIGNEUR rend justice à chacun »
  rationale: La formulation retenue suit la construction nominale hébraïque et affirme que la juste décision vient de Dieu, sans transformer explicitement la phrase en une promesse que chacun obtiendra toujours gain de cause.
- issue: Nom divin יהוה
  choice: SEIGNEUR
  alternative: YHWH / l’Éternel
  rationale: « SEIGNEUR » en petites capitales conventionnelles représente le tétragramme dans un français biblique courant et concorde avec la couche de consultation fournie, sans tenter d’imposer une vocalisation du nom.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme oppose la faveur recherchée auprès du pouvoir humain à la source divine du droit véritable. Aucun marqueur de note n’est nécessaire.
