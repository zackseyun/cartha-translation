  text: A man who loves wisdom makes his father glad[a], but one who keeps company with prostitutes destroys wealth.
translation:
  language: fr
  text: Un homme qui aime la sagesse réjouit son père, mais celui qui fréquente des prostituées[a] ruine sa fortune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui fait paître avec des prostituées » ou « qui paît avec elles » ; l’expression hébraïque signifie ici qu’il recherche leur compagnie ou les fréquente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Un homme
  rationale: Le nom hébreu est masculin singulier et présente une figure représentative dans la forme proverbiale. « Un homme » respecte la forme du texte tout en gardant sa portée générale.
- source_word: אֹהֵב חָכְמָה
  choice: qui aime la sagesse
  rationale: Le participe décrit une disposition habituelle. « Sagesse » rend directement חָכְמָה sans en restreindre le sens à l’instruction.
- source_word: יְשַׂמַּח
  choice: réjouit
  rationale: Le piel exprime ici le fait de rendre joyeux. « Réjouit son père » est naturel, actuel et conserve la valeur causative.
- source_word: אָבִיו
  choice: son père
  rationale: Le nom désigne précisément le père et porte un suffixe masculin singulier de troisième personne.
- source_word: וְרֹעֶה
  choice: mais celui qui fréquente
  rationale: Le participe de רעה signifie littéralement « faire paître » ou « paître », mais, avec זֹנוֹת, il évoque idiomatiquement le fait de rechercher leur compagnie ou de les fréquenter. La note conserve l’image littérale.
- source_word: זֹנוֹת
  choice: des prostituées
  rationale: Le terme féminin pluriel désigne des femmes qui se prostituent. « Prostituées » est précis, contemporain et non archaïque.
- source_word: יְאַבֶּד
  choice: dilapide
  rationale: Le piel signifie faire périr, détruire ou perdre. Appliqué à la fortune, « dilapide » exprime naturellement la perte ruineuse causée par la conduite décrite.
- source_word: הוֹן
  choice: sa fortune
  rationale: הוֹן désigne les richesses, les biens ou la fortune. Le possessif, implicite dans le contexte, est nécessaire à une formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme entre les deux types d’hommes est maintenu. La formulation évite les termes archaïques ou inutilement injurieux, tandis que la note signale l’image inhabituelle du verbe hébreu.
