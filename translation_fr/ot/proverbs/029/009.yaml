    issue: Le pronom « il » oriente le sujet des verbes de colère et de rire.
    rationale: Bien que la phrase puisse théoriquement être comprise autrement, la syntaxe française fait normalement rattacher « qu’il s’emporte ou qu’il rie » au sujet « un homme sage ». L’hébreu ne permet pas de trancher explicitement entre les deux protagonistes; le texte principal doit conserver cette indétermination.
  - severity: low
    issue: « Homme stupide » est moins adapté au lexique sapientiel que « insensé ».
    rationale: אֱוִיל désigne couramment dans les Proverbes une personne insensée sur les plans moral et pratique. « Insensé » est courant en français biblique moderne et maintient le contraste proverbial avec « sage ».
  revised_text: Quand un sage entre en conflit avec un insensé[a], que l’on s’emporte ou que l’on rie[b], il n’y a pas de répit.
