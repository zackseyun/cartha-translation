- from: Quand un homme sage entre en conflit avec un homme stupide[a], qu’il s’emporte ou qu’il rie[b], il n’y a pas de répit.
  to: Quand un sage entre en conflit avec un insensé[a], que l’on s’emporte ou que l’on rie[b], il n’y a pas de répit.
  rationale: La révision conserve le différend non spécifiquement judiciaire et l’absence de calme, tout en supprimant l’attribution implicite des verbes « s’emporter » et « rire » au sage. Elle adopte aussi le couple sapientiel usuel « sage / insensé » et conserve les deux ancres de note à leurs emplacements pertinents.
