  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
translation:
  language: fr
  text: Quand un sage entre en conflit avec un insensé[a], que l’on s’emporte ou que l’on rie[b], il n’y a pas de répit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Quand un sage entre en conflit avec un insensé, celui-ci peut s’emporter ou rire, mais il n’y a pas de répit. » L’hébreu ne précise pas explicitement si celui qui s’emporte ou rit est le sage ou l’insensé ; pour beaucoup d’interprètes, le contexte favorise l’insensé.'
    reason: alternative_reading
  - marker: b
    text: Ici, « rire » peut désigner un rire moqueur ou railleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָכָם
  choice: un homme sage
  rationale: Rend directement le masculin singulier hébreu tout en conservant la formulation représentative caractéristique des Proverbes.
- source_word: נִשְׁפָּט
  choice: entre en conflit
  rationale: Le nifal de שׁפט désigne ici le fait de plaider ou de se mesurer à quelqu’un dans un différend, sans imposer un cadre judiciaire précis.
- source_word: אֶת אִישׁ אֱוִיל
  choice: avec un homme stupide
  rationale: Conserve le parallélisme avec « un homme sage » et rend אֱוִיל par un terme français courant exprimant la stupidité morale et pratique propre à la littérature sapientielle.
- source_word: וְרָגַז
  choice: qu’il s’emporte
  rationale: Exprime l’agitation coléreuse de רגז. Le pronom garde l’ambiguïté de l’hébreu quant à l’identité de celui qui s’emporte.
- source_word: וְשָׂחַק
  choice: ou qu’il rie
  rationale: Retient le sens premier de שׂחק, « rire », sans exclure une nuance de moquerie signalée en note.
- source_word: וְאֵין נָחַת
  choice: il n’y a pas de répit
  rationale: נַחַת évoque le calme, le repos ou l’apaisement. « Pas de répit » est naturel en français et traduit l’absence persistante d’apaisement sans affirmer explicitement l’absence d’une résolution juridique.
theological_decisions:
- issue: Sujet de « s’emporte » et « rie »
  choice: Maintenir un pronom dont le référent reste ambigu dans le texte principal.
  alternative: Identifier explicitement l’homme stupide comme sujet.
  rationale: L’hébreu n’exprime pas un nouveau sujet et permet grammaticalement de rapporter les verbes à l’un ou l’autre homme; le contexte conduit beaucoup d’interprètes à y voir l’homme stupide, mais ne l’impose pas avec certitude.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Homme sage » et « homme stupide » préservent le parallélisme masculin du texte source; la syntaxe garde volontairement l’ambiguïté du sujet des deux verbes.
