  text: מֶ֤לֶךְ שׁוֹפֵ֣ט בֶּֽ/אֱמֶ֣ת דַּלִּ֑ים כִּ֝סְא֗/וֹ לָ/עַ֥ד יִכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/014.yaml
  text: A king who judges the poor with truth—his throne will be established forever[a].
translation:
  language: fr
  text: Un roi qui juge les pauvres avec droiture — son trône sera affermi pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « juge les pauvres en vérité », « avec fidélité » ou « avec justice ». Le terme hébreu peut évoquer la vérité, la fidélité ou la droiture dans l’exercice du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: Un roi
  rationale: L’indéfini exprime naturellement en français la portée générale du proverbe, tout en conservant le cadre royal concret.
- source_word: שׁוֹפֵט
  choice: qui juge
  rationale: Le participe décrit le roi en fonction de son action judiciaire; cette formulation garde ce sens précis et reste naturelle.
- source_word: בֶּאֱמֶת
  choice: avec vérité
  rationale: Cette traduction formellement proche préserve l’éventail sémantique de אֱמֶת — vérité, fidélité, droiture — sans réduire d’emblée le terme à la seule justice.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: Le terme désigne des personnes de condition humble, démunies ou faibles; « les pauvres » convient particulièrement au contexte de justice royale.
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: La traduction conserve l’image concrète du trône, qui représente aussi la royauté et sa stabilité.
- source_word: לָעַד
  choice: pour toujours
  rationale: L’expression rend directement l’idée de durée permanente, tout en laissant au genre proverbial le soin d’en préciser la portée.
- source_word: יִכּוֹן
  choice: sera affermi
  rationale: Le verbe au niphal exprime le fait d’être établi, rendu stable ou assuré; « sera affermi » s’accorde naturellement avec l’image du trône.
theological_decisions:
- issue: Portée de לָעַד dans la littérature de sagesse
  choice: pour toujours
  alternative: durablement / pour longtemps
  rationale: La traduction conserve la formulation forte de l’hébreu sans transformer cette maxime sapientielle en garantie métaphysique explicitement formulée.
- issue: Sens judiciaire de בֶּאֱמֶת
  choice: avec vérité
  alternative: avec fidélité / avec justice
  rationale: L’hébreu peut évoquer la vérité, la fidélité et la droiture dans l’exercice du jugement. Le texte principal maintient cette tension sémantique, tandis que la note expose les principales lectures possibles.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève et équilibrée du proverbe est conservée; le tiret met en relief le rapport entre une justice fidèle envers les pauvres et la stabilité du règne.
