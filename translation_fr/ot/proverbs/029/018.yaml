  text: בְּ/אֵ֣ין חָ֭זוֹן יִפָּ֣רַֽע עָ֑ם וְ/שֹׁמֵ֖ר תּוֹרָ֣ה אַשְׁרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/018.yaml
  text: Where there is no vision[a], a people cast off restraint[d][c][b]; but the one who keeps the law—happy is he.
translation:
  language: fr
  text: Quand il n’y a pas de révélation[a], un peuple est sans frein[b] ; mais celui qui observe la loi[c] est heureux[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vision » ou « vision prophétique ». Le mot hébreu désigne une révélation divine, et non simplement des projets ou des ambitions humaines.
    reason: lexical_alternative
  - marker: b
    text: Ou « se déchaîne » ou « échappe à toute retenue ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’enseignement » ou « l’instruction ».
    reason: lexical_alternative
  - marker: d
    text: Ou « est bienheureux » ou « est béni ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Quand il n’y a pas
  rationale: 'La construction בְּ avec אֵין introduit une circonstance générale : « quand il n’y a pas » ou « en l’absence de ». Cette formulation convient à la structure de cause et de conséquence du proverbe.'
- source_word: חָזוֹן
  choice: révélation
  rationale: Le nom désigne normalement une vision révélée, souvent prophétique. « Révélation » évite que le lecteur moderne comprenne une simple ambition, un projet ou une stratégie humaine.
- source_word: יִפָּרַע
  choice: vit sans frein
  rationale: Le niphal de פרע exprime ici le fait de se laisser aller, de ne plus être contenu ou de devenir incontrôlé. « Vit sans frein » rend naturellement cette absence de retenue sans suggérer à tort que le peuple « périt ».
- source_word: עָם
  choice: un peuple
  rationale: Le singulier collectif est conservé et le proverbe demeure une maxime générale, sans être limité à un peuple particulier.
- source_word: וְשֹׁמֵר
  choice: mais celui qui observe
  rationale: Le participe décrit une personne caractérisée par son attachement constant à la loi. Le וְ est rendu par « mais » pour faire ressortir le contraste entre les deux membres.
- source_word: תּוֹרָה
  choice: la loi
  rationale: תּוֹרָה peut désigner l’enseignement ou l’instruction, mais porte ici un poids moral et religieux que « la loi » rend bien. L’autre possibilité est signalée en note.
- source_word: אַשְׁרֵהוּ
  choice: est heureux
  rationale: La formule sapientielle exprime le bonheur enviable de la personne concernée. « Est heureux » est naturel en français actuel et conserve le singulier grâce à « celui ».
theological_decisions:
- issue: Nature de la חָזוֹן absente
  choice: Comprendre חָזוֹן comme une révélation venant de Dieu.
  alternative: Une vision humaine au sens de projet collectif, d’orientation politique ou d’ambition stratégique.
  rationale: Dans l’hébreu biblique, חָזוֹן désigne ordinairement une communication révélée, notamment une vision prophétique. Le proverbe ne formule donc pas simplement un principe de gestion ou de leadership.
- issue: Portée de תּוֹרָה
  choice: Traduire par « la loi », tout en signalant « l’enseignement » comme possibilité.
  alternative: Traduire directement par « l’enseignement » ou « l’instruction ».
  rationale: Le terme peut avoir un sens large, mais le parallèle avec la révélation et le contexte moral du proverbe permettent de conserver sa dimension normative sans trancher la question plus étroitement.
- issue: Forme singulière masculine de אַשְׁרֵהוּ
  choice: Conserver le singulier représentatif par « celui qui… est heureux ».
  alternative: Employer un pluriel inclusif, par exemple « heureux ceux qui… ».
  rationale: L’hébreu présente une personne masculine singulière à valeur représentative. La formulation française respecte cette forme tout en restant naturelle.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve le parallélisme proverbial, le contraste collectif-individuel et la concision de l’hébreu. « Révélation » a été préféré à « vision » dans le texte principal afin d’éviter le sens moderne de projet stratégique ; les possibilités lexicales réelles restent accessibles dans les notes.
