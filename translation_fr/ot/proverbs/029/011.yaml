  yaml_path: translation/ot/proverbs/029/011.yaml
  text: A fool lets out all his spirit[a], but a wise man holds it back.
translation:
  language: fr
  text: L’insensé laisse sortir tout son esprit[a], mais le sage le retient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «L’insensé donne libre cours à toute sa colère, mais le sage l’apaise et la retient.» Le mot hébreu traduit par «esprit» peut aussi désigner l’humeur ou la colère, et le dernier verbe peut exprimer l’idée d’apaiser aussi bien que celle de retenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רוּחוֹ
  choice: tout son esprit
  rationale: Cette formulation conserve l’image hébraïque et la totalité exprimée par כָּל, sans réduire רוּחַ à la seule colère; le contexte évoque l’élan intérieur ou les émotions.
- source_word: יוֹצִיא
  choice: laisse sortir
  rationale: Le hiphil de יצא signifie littéralement «faire sortir». «Laisse sortir» rend naturellement ici l’idée de donner libre cours à ce qui est en soi.
- source_word: כְסִיל
  choice: l’insensé
  rationale: Terme courant de la littérature sapientielle pour une personne moralement et pratiquement dépourvue de sagesse.
- source_word: חָכָם
  choice: le sage
  rationale: Le masculin singulier substantivé est générique dans la forme proverbiale; «le sage» est naturel et fidèle en français.
- source_word: בְּאָחוֹר יְשַׁבְּחֶנָּה
  choice: le calme en le retenant
  rationale: 'La construction est difficile: בְּאָחוֹר suggère l’idée de garder en arrière, tandis que le verbe peut évoquer l’apaisement. La traduction maintient les deux nuances sans choisir exclusivement entre calme et retenue.'
