source:
  edition: WLC
  text: בִּ֭/דְבָרִים לֹא יִוָּ֣סֶר עָ֑בֶד כִּֽי יָ֝בִ֗ין וְ/אֵ֣ין מַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/019.yaml
  text: A servant is not corrected by words alone[a], for though he understands[b], there is no response.
translation:
  language: fr
  text: 'De simples paroles ne suffisent pas à corriger un esclave[a] : même s’il comprend, il n’y a pas de réponse[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot hébreu peut désigner aussi bien un serviteur qu’une personne en situation d’esclavage.
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne répond pas ». Il peut s’agir d’une absence de réponse verbale ou d’une absence de réaction concrète.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְבָרִים
  choice: De simples paroles ne suffisent pas
  rationale: Le syntagme instrumental signifie littéralement « par des paroles ». La formulation française explicite naturellement que les paroles seules restent sans effet, contraste implicite du proverbe.
- source_word: יִוָּסֶר
  choice: à corriger
  rationale: Le niphal de יסר exprime ici le fait d’être corrigé ou discipliné. « Corriger » conserve le sens pratique sans imposer l’idée d’une punition.
- source_word: עָבֶד
  choice: esclave
  rationale: עבד peut désigner un serviteur ou un esclave. Dans ce contexte d’autorité et de discipline, « esclave » rend clairement le statut de dépendance exprimé par le terme hébreu.
- source_word: כִּי יָבִין
  choice: même s’il comprend
  rationale: 'כִּי introduit l’explication, mais l’enchaînement crée une nuance concessive : la compréhension existe sans produire de réponse. « Même si » restitue cette tension en français naturel.'
- source_word: וְאֵין מַעֲנֶה
  choice: il n’y a pas de réponse
  rationale: 'Cette formulation impersonnelle suit la construction nominale hébraïque et laisse ouverte la nature de la réponse : parole ou réaction concrète.'
theological_decisions: []
translation_notes:
  register: Français moderne, clair et sentencieux. La tournure initiale évite le passif peu naturel « n’est pas corrigé » tout en conservant l’idée que les paroles seules ne produisent pas la correction attendue. Le vocabulaire social du texte ancien est maintenu sans l’atténuer.
