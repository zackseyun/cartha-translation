source:
  edition: WLC
  text: מֶ֗לֶךְ בְּ֭/מִשְׁפָּט יַעֲמִ֣יד אָ֑רֶץ וְ/אִ֖ישׁ תְּרוּמ֣וֹת יֶֽהֶרְסֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/004.yaml
  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
translation:
  language: fr
  text: Par la justice, un roi affermit un pays, mais l’homme qui exige des prélèvements[a] le ruine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme qui reçoit des cadeaux » ou « des pots-de-vin ». Le terme hébreu peut désigner des contributions, des offrandes ou des prélèvements; ici, il évoque vraisemblablement des exactions ou des paiements corrupteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: un roi
  rationale: L’indéfini exprime la portée générale de cette maxime sur l’exercice du pouvoir royal.
- source_word: בְּמִשְׁפָּט
  choice: par la justice
  rationale: מִשְׁפָּט désigne ici une administration conforme au droit et à la justice; cette formulation conserve aussi l’idée du moyen par lequel le pays est stabilisé.
- source_word: יַעֲמִיד
  choice: affermit
  rationale: Le hifil de עמד signifie faire tenir, rendre stable. « Affermit » restitue cette idée plus directement que le calque « établit » en français.
- source_word: אָרֶץ
  choice: un pays
  rationale: Dans le contexte du gouvernement royal, le mot désigne le territoire ou le pays gouverné, non la terre entière.
- source_word: אִישׁ
  choice: l’homme qui
  rationale: La construction française introduit naturellement la personne caractérisée par ce qui suit, tout en conservant le masculin singulier générique de l’hébreu.
- source_word: תְּרוּמוֹת
  choice: exige des prélèvements
  rationale: תְּרוּמוֹת signifie littéralement contributions, offrandes ou prélèvements. Dans ce contraste politique, il peut évoquer des exactions ou des paiements corrupteurs; le texte principal garde la catégorie plus large sans réduire d’office le terme aux seuls pots-de-vin.
- source_word: יֶהֶרְסֶנָּה
  choice: le ruine
  rationale: הרס évoque la démolition. « Le ruine » est naturel pour un pays et préserve la force destructrice du verbe; le pronom reprend « un pays ».
theological_decisions:
- issue: Nature exacte des תְּרוּמוֹת dans le mauvais gouvernement
  choice: prélèvements exigés
  alternative: pots-de-vin reçus
  rationale: Le substantif ne signifie pas lexicalement et sans ambiguïté « pots-de-vin ». Le contexte condamne assurément une pratique financière destructrice, mais permet d’envisager soit des exactions fiscales, soit des dons corrupteurs; une note conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est maintenu entre l’action stabilisatrice de la justice et l’action destructrice des prélèvements abusifs. « Affermit » et « ruine » forment une opposition nette sans alourdir la maxime.
