id: PRO.29.13
reference: Proverbs 29:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
translation:
  language: fr
  text: Le pauvre et l’oppresseur[a] se rencontrent ; Yahweh éclaire les yeux de l’un comme de l’autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « un homme d’oppressions ». L’expression hébraïque peut désigner quelqu’un qui exploite ou opprime les autres ; elle a aussi été comprise comme « un homme trompeur » ou « un usurier ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « éclairer les yeux » peut signifier donner la vue, donner ou préserver la vie, ou encore éclairer l’intelligence.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: le pauvre
  rationale: Le nom désigne une personne pauvre ou démunie. Le singulier proverbial est conservé et le masculin correspond à son association avec אִישׁ.
- source_word: אִישׁ תְּכָכִים
  choice: l’oppresseur
  rationale: L’expression hébraïque est difficile et évoque probablement un homme qui se livre à des exactions ou exploite autrui. « L’oppresseur » exprime clairement ce sens probable, tandis qu’une note conserve les autres possibilités.
- source_word: נִפְגָּשׁוּ
  choice: se rencontrent
  rationale: Le niphal de פגשׁ signifie couramment « rencontrer » ou « se rencontrer ». La traduction garde l’image concrète et laisse la suite indiquer ce que les deux hommes ont en commun.
- source_word: מֵאִיר
  choice: éclaire
  rationale: Le participe hiphil de אור signifie « faire briller, donner de la lumière ». Avec « les yeux », l’expression peut évoquer la vue, la vie, la préservation ou l’intelligence ; « éclaire » conserve cette richesse métaphorique.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: les yeux de l’un comme de l’autre
  rationale: Cette formulation française naturelle maintient l’insistance sur le fait que les deux hommes dépendent pareillement de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh » plutôt que remplacé par un titre.
theological_decisions:
- issue: Sens du second membre du proverbe
  choice: Yahweh éclaire les yeux du pauvre comme ceux de l’oppresseur.
  alternative: Yahweh donne la vue ou la vie aux deux ; ou il les éclaire moralement ou spirituellement.
  rationale: L’hébreu affirme littéralement que Yahweh « éclaire les yeux des deux ». La traduction conserve cette image sans décider si elle désigne principalement la vue, la vie entretenue par Dieu ou une forme d’illumination.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme proverbial au singulier est conservé, ainsi que la métaphore volontairement ouverte de la lumière donnée aux yeux.
