  text: אִֽישׁ אַ֭ף יְגָרֶ֣ה מָד֑וֹן וּ/בַ֖עַל חֵמָ֣ה רַב פָּֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
translation:
  language: fr
  text: L’homme coléreux suscite des querelles, et l’homme emporté commet de nombreuses transgressions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « multiplie les transgressions ». Littéralement : « un homme de colère… et un maître de fureur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אַף
  choice: un homme coléreux
  rationale: L’expression signifie littéralement « un homme de colère » et décrit une personne caractérisée par la colère. « Un homme coléreux » est naturel et fidèle à cette disposition habituelle.
- source_word: יְגָרֶה
  choice: provoque
  rationale: Le verbe exprime l’action de susciter ou d’attiser. Avec « des querelles », « provoque » rend clairement le rapport de cause.
- source_word: מָדוֹן
  choice: des querelles
  rationale: Le nom désigne la discorde ou la contestation. Le pluriel français « des querelles » restitue naturellement le sens collectif du singulier hébreu.
- source_word: בַעַל חֵמָה
  choice: celui qui est sujet à la fureur
  rationale: Littéralement « maître de fureur », l’idiome désigne quelqu’un dominé ou caractérisé par une colère intense. Cette formulation conserve l’intensité de חֵמָה sans suggérer seulement une émotion passagère.
- source_word: רַב
  choice: multiplie
  rationale: Dans la construction רַב פָּשַׁע, le terme peut exprimer soit l’abondance des transgressions, soit leur multiplication. « Multiplie » donne un français vigoureux et convient au parallélisme verbal avec « provoque », tout en signalant l’autre analyse en note.
- source_word: פָּשַׁע
  choice: les transgressions
  rationale: Le nom évoque une faute grave, souvent avec une nuance de rébellion. « Transgressions » préserve cette gravité morale sans imposer un contexte politique.
theological_decisions:
- issue: Valeur de רַב dans רַב פָּשַׁע
  choice: multiplie les transgressions
  alternative: commet beaucoup de transgressions / abonde en transgressions
  rationale: La syntaxe permet de comprendre רַב comme exprimant l’abondance ou, selon une lecture verbale de sens, la multiplication. Le texte retient la formulation dynamique, tandis que la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est maintenu par deux propositions coordonnées et des verbes directs. Les expressions idiomatiques hébraïques sont rendues naturellement, avec leur forme littérale indiquée en note.
