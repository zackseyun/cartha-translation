id: PRO.29.15
reference: Proverbs 29:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֵׁ֣בֶט וְ֭/תוֹכַחַת יִתֵּ֣ן חָכְמָ֑ה וְ/נַ֥עַר מְ֝שֻׁלָּ֗ח מֵבִ֥ישׁ אִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/015.yaml
  text: A rod and reproof give wisdom[a], but a boy left to himself brings shame to his mother.
translation:
  language: fr
  text: Le bâton et la réprimande donnent la sagesse, mais un garçon laissé à lui-même[a] fait honte à sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laissé sans contrôle » ou « laissé sans discipline ». L’hébreu évoque littéralement un garçon qu’on a « laissé aller » ou « relâché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: le bâton
  rationale: Le terme désigne concrètement un bâton ou une verge. Dans ce contexte éducatif, « le bâton » conserve l’image de la discipline sans la remplacer par une abstraction comme « punition ».
- source_word: וְתוֹכַחַת
  choice: et la réprimande
  rationale: Le nom évoque une correction exprimée verbalement, un reproche ou une réprimande. « Réprimande » est naturel en français actuel et maintient le contraste complémentaire entre discipline physique et correction verbale.
- source_word: יִתֵּן חָכְמָה
  choice: donnent la sagesse
  rationale: Le singulier verbal hébreu peut avoir pour sujet l’ensemble coordonné « le bâton et la réprimande ». En français, l’accord au pluriel est requis, tandis que le verbe simple « donner » préserve la concision de l’original.
- source_word: נַעַר
  choice: un garçon
  rationale: נַעַר peut désigner un enfant, un adolescent ou un jeune homme. Le contexte de formation parentale et la référence à sa mère favorisent ici « garçon », qui conserve aussi le masculin singulier.
- source_word: מְשֻׁלָּח
  choice: laissé à lui-même
  rationale: Le participe passif de שלח signifie littéralement « relâché », « laissé aller » ou « renvoyé ». Dans ce contexte, l’expression décrit un garçon sans encadrement ni retenue; « laissé à lui-même » rend naturellement cette idée tout en gardant une part de l’ambiguïté de l’hébreu.
- source_word: מֵבִישׁ
  choice: fait honte à
  rationale: La forme causative exprime le fait de couvrir quelqu’un de honte ou de lui attirer la honte. « Fait honte à » est idiomatique et restitue directement cette valeur causative.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Le suffixe masculin singulier renvoie au garçon. En français, « sa mère » exprime directement et sans ambiguïté cette relation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme concis du proverbe ainsi que l’image concrète du bâton, sans expliciter davantage la nature ou les modalités de la discipline.
