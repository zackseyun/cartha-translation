revisions:
- from: Dans la révolte d’un homme mauvais se trouve un piège[a], mais le juste pousse des cris de joie et se réjouit[b].
  to: Dans la transgression d’un homme mauvais, il y a un piège[a], mais le juste pousse des cris de joie et se réjouit[b].
  rationale: La révision remplace « révolte » par « transgression » pour une fidélité lexicale et contextuelle supérieure. Elle rend aussi la phrase française plus fluide par « il y a » et précise les notes afin qu’elles signalent fidèlement les alternatives sans lever l’ambiguïté du texte hébreu.
