  text: בְּ/פֶ֤שַֽׁע אִ֣ישׁ רָ֣ע מוֹקֵ֑שׁ וְ֝/צַדִּ֗יק יָר֥וּן וְ/שָׂמֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/006.yaml
  text: In the transgression of an evil man there is a snare[b][a], but the righteous sings for joy and rejoices.
translation:
  language: fr
  text: Dans la transgression d’un homme mauvais, il y a un piège[a], mais le juste pousse des cris de joie et se réjouit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La transgression d’un homme mauvais entraîne un piège. » L’hébreu peut indiquer soit que le piège se trouve dans sa transgression, soit que celle-ci le provoque.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « chante de joie et est dans l’allégresse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Dans la révolte
  rationale: La préposition בְּ peut être comprise de manière locative ou instrumentale. « Dans la révolte » conserve la formulation compacte et l’idée que le piège est lié à la faute elle-même.
- source_word: אִישׁ רָע
  choice: d’un homme mauvais
  rationale: Cette formulation garde le masculin singulier du texte hébreu et exprime clairement le jugement moral.
- source_word: מוֹקֵשׁ
  choice: un piège
  rationale: « Piège » restitue naturellement l’image sapientielle d’un dispositif qui prend ou fait trébucher.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne ici le représentant d’une catégorie morale et contraste directement avec l’homme mauvais.
- source_word: יָרוּן
  choice: pousse des cris de joie
  rationale: Le verbe évoque une manifestation vocale et éclatante de joie, pas seulement un sentiment intérieur.
- source_word: וְשָׂמֵחַ
  choice: et se réjouit
  rationale: La traduction maintient la seconde expression de joie et le parallélisme du texte.
theological_decisions:
- issue: Rapport entre la faute de l’homme mauvais et le piège
  choice: « Dans la révolte […] se trouve un piège »
  alternative: « Par la révolte […] vient un piège »
  rationale: L’hébreu permet une nuance locative ou instrumentale. Le texte principal préserve l’idée que le piège réside dans la révolte, tandis que la note signale qu’elle peut aussi être comprise comme sa cause.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise pour conserver le caractère proverbial; « révolte » rend la gravité de פֶּשַׁע, tandis que « pousse des cris de joie » explicite la dimension vocale de יָרוּן.
