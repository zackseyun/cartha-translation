id: PRO.29.25
reference: Proverbs 29:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
translation:
  language: fr
  text: La peur des autres tend un piège[a], mais qui met sa confiance en Yahweh sera placé hors d’atteinte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La peur de l’être humain donne un piège. » Autrement dit, la peur des autres devient elle-même un piège.'
    reason: lexical_alternative
  - marker: b
    text: Ou « sera en sécurité » ou « sera protégé ». Le verbe hébreu évoque littéralement le fait d’être placé en hauteur, hors d’atteinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת
  choice: la peur de
  rationale: Le nom à l’état construit exprime la peur, l’effroi ou le tremblement. « La peur de » est naturel en français et conserve ici l’idée générale d’une crainte anxieuse.
- source_word: אָדָם
  choice: des autres
  rationale: Dans ce contexte, le nom générique désigne les êtres humains dont on redoute le jugement ou le pouvoir. « Des autres » rend clairement cette relation en français moderne sans suggérer la peur d’un seul homme ni la peur de l’humanité comme abstraction.
- source_word: יִתֵּן
  choice: tend
  rationale: Le verbe signifie littéralement « donne », mais associé au piège, « tend » restitue idiomatiquement l’image et indique que cette peur devient un moyen d’entraver la personne.
- source_word: מוֹקֵשׁ
  choice: un piège
  rationale: Le terme désigne un piège ou un lacet qui capture. « Piège » est courant, précis et conserve la métaphore sapientielle.
- source_word: וּבוֹטֵחַ
  choice: mais qui met sa confiance
  rationale: Le participe substantivé a une portée générale. Cette formulation française naturelle maintient cette valeur sans restreindre le propos à un individu masculin.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition marque ici l’objet de la confiance, et le tétragramme est rendu par le nom personnel « Yahweh ».
- source_word: יְשֻׂגָּב
  choice: sera placé hors d’atteinte
  rationale: Le verbe au passif évoque le fait d’être placé en hauteur, donc dans un lieu inaccessible et sûr. « Placé hors d’atteinte » conserve à la fois l’idée d’une action reçue et celle de la protection.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, rendu ici comme nom personnel afin de préserver la référence explicite au Dieu d’Israël.
- issue: Portée générique de אָדָם et de בוֹטֵחַ
  choice: « des autres » et « qui met sa confiance »
  alternative: « de l’homme » et « celui qui met sa confiance »
  rationale: Le contraste porte sur la crainte des humains en général et la confiance en Yahweh. Le choix retenu exprime cette portée générique en français actuel sans ajouter de restriction de genre.
- issue: Métaphore de la hauteur dans יְשֻׂגָּב
  choice: sera placé hors d’atteinte
  alternative: sera en sécurité
  rationale: Le choix maintient l’image d’une protection obtenue par une position inaccessible, sans réduire le verbe à son seul effet pratique.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme entre la crainte des autres et la confiance en Yahweh est conservé, ainsi que les images du piège et de la hauteur protectrice.
