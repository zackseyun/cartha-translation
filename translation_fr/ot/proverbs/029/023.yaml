source:
  edition: WLC
  text: גַּאֲוַ֣ת אָ֭דָם תַּשְׁפִּילֶ֑/נּוּ וּ/שְׁפַל ר֝֗וּחַ יִתְמֹ֥ךְ כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/023.yaml
  text: A man's pride will bring him low[a], but one who is lowly in spirit will obtain honor.
translation:
  language: fr
  text: L’orgueil d’un être humain l’abaissera, mais celui qui est humble d’esprit obtiendra l’honneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conservera l’honneur » ou « saisira l’honneur ». Le verbe hébreu peut exprimer l’idée de saisir, de tenir fermement ou d’obtenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּאֲוַת
  choice: l’orgueil
  rationale: Le nom désigne une haute opinion de soi, voire l’arrogance. « Orgueil » est naturel en français et forme une antithèse claire avec l’humilité d’esprit.
- source_word: אָדָם
  choice: d’un être humain
  rationale: Le singulier a ici une valeur représentative. « Un être humain » conserve cette portée générique sans limiter artificiellement le proverbe au sexe masculin.
- source_word: תַּשְׁפִּילֶנּוּ
  choice: l’abaissera
  rationale: La forme causative de שׁפל signifie faire descendre, abaisser ou humilier. « L’abaissera » rend de façon concise le mouvement opposé à l’honneur.
- source_word: וּשְׁפַל רוּחַ
  choice: mais celui qui est humble d’esprit
  rationale: La formule hébraïque signifie littéralement « bas/humble d’esprit ». Cette traduction garde la référence à la disposition intérieure tout en restant idiomatique.
- source_word: יִתְמֹךְ
  choice: obtiendra
  rationale: תמך peut signifier saisir, soutenir ou tenir fermement. Avec « honneur » comme complément, « obtiendra » exprime naturellement l’accès à l’honneur, tandis qu’une note préserve les autres lectures possibles.
- source_word: כָּבוֹד
  choice: l’honneur
  rationale: Dans ce contexte sapientiel, le terme renvoie surtout à l’honneur ou à l’estime accordée à une personne, plutôt qu’à la gloire au sens théologique.
theological_decisions: []
