  text: Whoever pampers his servant from youth[a], in the end he will become a son.
translation:
  language: fr
  text: Qui dorlote son esclave dès sa jeunesse, celui-ci finira par devenir un fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu traduit par « devenir un fils » est incertain. On l’a aussi compris comme « agir comme un fils », l’idée étant qu’un esclave trop choyé pourrait s’arroger le statut d’un fils ; d’autres y voient plus généralement les notions d’ennuis ou d’insubordination.
    reason: alternative_reading
lexical_decisions:
- source_word: מְפַנֵּק
  choice: dorlote
  rationale: Le participe piel exprime le fait de traiter quelqu’un avec une délicatesse excessive ou indulgente. « Dorlote » est naturel en français moderne et conserve la nuance critique du proverbe.
- source_word: מִנֹּעַר
  choice: dès sa jeunesse
  rationale: L’expression indique que ce traitement commence tôt et se prolonge. Le possessif français renvoie naturellement à l’esclave, sans modifier le sens contextuel.
- source_word: עַבְדּוֹ
  choice: son esclave
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, la relation d’autorité domestique et le statut subordonné sont saillants ; « esclave » rend clairement la réalité sociale du texte.
- source_word: וְאַחֲרִיתוֹ
  choice: celui-ci finira par
  rationale: אַחֲרִית désigne l’issue ou l’état final. Cette tournure française exprime l’aboutissement envisagé par le proverbe et identifie naturellement l’esclave comme sujet de la proposition finale.
- source_word: יִהְיֶה מָנוֹן
  choice: se comporter en fils
  rationale: מָנוֹן est un terme unique et très incertain. La traduction retient prudemment l’interprétation liée au « fils », comprise comme l’adoption présomptueuse d’un statut filial, tout en signalant les autres analyses en note.
theological_decisions:
- issue: Sens du terme rare מָנוֹן
  choice: « se comporter en fils » dans le texte, avec signalement explicite de l’incertitude
  alternative: « devenir un fils », « causer des ennuis » ou « devenir insoumis »
  rationale: Le mot est un hapax dont le sens ne peut être établi avec certitude. La formulation choisie garde le lien possible avec la filiation sans affirmer une adoption juridique ou familiale, tandis que la note préserve les lectures négatives concurrentes.
translation_notes:
  register: Français international moderne, concis et proverbial. « Dorlote » est courant sans être familier ; « se comporter en fils » évite de transformer une lecture lexicale incertaine en affirmation juridique ou théologique.
