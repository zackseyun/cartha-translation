id: PRO.16.2
reference: Proverbs 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּֽל דַּרְכֵי אִ֭ישׁ זַ֣ךְ בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן רוּח֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: fr
  text: Toutes les voies d’un homme sont pures à ses propres yeux, mais Yahweh pèse les esprits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mais Yahweh examine les esprits »; le sens peut aussi être rendu de façon plus interprétative par « mais Yahweh évalue les mobiles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דַּרְכֵי אִישׁ
  choice: Toutes les voies d’un homme
  rationale: « Voies » conserve l’image hébraïque tout en désignant naturellement la conduite et les choix de vie dans le contexte sapientiel. Le masculin singulier représentatif de אִישׁ est maintenu.
- source_word: זַךְ
  choice: pures
  rationale: Le terme exprime la pureté ou la netteté morale telle que l’homme l’évalue lui-même; « pures » rend cette appréciation sans lui donner une portée strictement judiciaire.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: 'Cette tournure française naturelle explicite la valeur réflexive de l’idiome: selon son propre jugement.'
- source_word: וְתֹכֵן
  choice: mais … pèse
  rationale: Le waw introduit ici le contraste. « Pèse » préserve la métaphore de la mesure et exprime l’évaluation exacte de Yahweh.
- source_word: רוּחוֹת
  choice: les esprits
  rationale: Le pluriel renvoie vraisemblablement aux dispositions intérieures humaines. La traduction formelle conserve l’étendue et l’ambiguïté de l’image plutôt que de la réduire aux seuls mobiles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré au lieu d’être remplacé par un titre.
theological_decisions:
- issue: Sens anthropologique de רוּחוֹת
  choice: les esprits, au sens des dispositions intérieures humaines
  alternative: les mobiles; les dispositions intérieures
  rationale: Dans l’opposition entre l’autoévaluation humaine et le jugement divin, le mot vise probablement l’être intérieur. « Esprits » conserve toutefois la formulation et la portée du texte hébreu.
- issue: Masculin représentatif אִישׁ
  choice: d’un homme
  alternative: d’une personne; de l’être humain
  rationale: Le texte hébreu emploie un nom masculin singulier à valeur représentative; la traduction en garde la forme sans limiter la portée universelle du proverbe.
translation_notes:
  register: Français international moderne, sobre et proverbial. L’expression « à ses propres yeux » est idiomatique; « pèse les esprits » conserve délibérément la métaphore et la tension anthropologique de l’hébreu.
