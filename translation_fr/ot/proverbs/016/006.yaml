source:
  edition: WLC
  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: fr
  text: Par l’amour fidèle et la fidélité, la faute est expiée[a][b], et par la crainte de Yahweh on se détourne du mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par l’amour fidèle et la vérité, la faute est expiée. » Le mot hébreu אֱמֶת peut exprimer la fidélité aussi bien que la vérité.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est au passif et ne précise pas qui accomplit l’expiation; le proverbe ne tranche pas explicitement entre l’action de Dieu, le rôle de ces vertus d’alliance, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: Par l’amour fidèle
  rationale: חֶסֶד exprime ici un amour durable, loyal et bienveillant. « Amour fidèle » rend naturellement en français sa dimension relationnelle sans limiter le terme à la seule miséricorde; ב est compris dans un sens instrumental.
- source_word: וֶאֱמֶת
  choice: et la fidélité
  rationale: אֱמֶת peut signifier « vérité » ou « fidélité ». Associé à חֶסֶד, il évoque souvent la fiabilité et la loyauté; « fidélité » convient au contexte éthique, tout en signalant « vérité » en note.
- source_word: יְכֻפַּר
  choice: est expiée
  rationale: Le poual de כפר indique que l’expiation est accomplie, sans en nommer l’agent. La forme passive française conserve cette indétermination.
- source_word: עָוֺן
  choice: la faute
  rationale: עָוֺן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » est courant, digne et suffisamment large dans ce proverbe; « iniquité » serait plus formel mais moins naturel pour de nombreux lecteurs.
- source_word: וּבְיִרְאַת יְהוָה
  choice: et par la crainte de Yahweh
  rationale: יִרְאָה désigne dans les Proverbes une crainte révérencielle. La préposition ב est rendue parallèlement par « par », et le nom divin est translittéré « Yahweh » conformément au choix du projet.
- source_word: סוּר
  choice: on se détourne
  rationale: L’expression proverbiale est générique. Le pronom « on » la rend naturellement en français sans introduire de sujet particulier.
- source_word: מֵרָע
  choice: du mal
  rationale: רָע désigne ici le mal moral, en cohérence avec le thème sapientiel de la crainte de Yahweh.
theological_decisions:
- issue: Le rôle de l’amour fidèle et de la fidélité dans l’expiation
  choice: Conserver une formulation passive et instrumentale sans préciser l’agent de l’expiation.
  alternative: Attribuer explicitement l’expiation à l’action de Dieu, ou présenter les vertus humaines comme obtenant le pardon.
  rationale: Le passif hébreu יְכֻפַּר ne nomme pas l’agent. La traduction préserve donc la tension entre l’action divine et le rôle éthique ou relationnel de l’amour fidèle et de la fidélité, sans transformer le proverbe en affirmation explicite du mérite humain.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu et suit la décision terminologique fournie pour le projet.
translation_notes:
  register: Français international actuel, naturel et digne. « Amour fidèle » maintient la portée relationnelle de חֶסֶד; « faute » évite l’archaïsme relatif d’« iniquité ». Le parallélisme des deux propositions est conservé, ainsi que l’ambiguïté du passif hébreu.
