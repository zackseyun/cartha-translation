source:
  edition: WLC
  text: מְסִלַּ֣ת יְ֭שָׁרִים ס֣וּר מֵ/רָ֑ע שֹׁמֵ֥ר נַ֝פְשׁ֗/וֹ נֹצֵ֥ר דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: fr
  text: La route des hommes droits, c’est se détourner du mal[a] ; qui veille sur sa vie[b] prend garde à son chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La route des hommes droits s’écarte du mal. » L’hébreu emploie une construction nominale dont le rapport exact entre les deux expressions peut se rendre de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son âme ». Ici, le mot hébreu désigne probablement sa vie ou sa personne elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: route
  rationale: « Route » conserve l’image concrète d’une voie bien tracée tout en restant naturelle en français moderne ; « grand-route » serait vieilli et « chemin » atténuerait le terme hébreu plus marqué.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: L’expression désigne des personnes moralement droites. « Les hommes droits » est idiomatique et évite de confondre ce terme avec le vocabulaire hébreu plus spécifique de la justice.
- source_word: סוּר מֵרָע
  choice: se détourner du mal
  rationale: L’infinitif décrit en quoi consiste la route des hommes droits. « Se détourner du mal » en garde la force verbale et le sens moral.
- source_word: רָע
  choice: le mal
  rationale: Dans ce contexte sapientiel, le terme a une portée éthique ; « le mal » rend cette opposition morale sans l’affaiblir en simple dommage.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: qui veille sur sa vie
  rationale: Ici נֶפֶשׁ désigne vraisemblablement la vie ou la personne elle-même, non une âme immatérielle prise comme terme technique. « Veiller sur sa vie » est naturel et convient à l’idée de vigilance.
- source_word: נֹצֵר דַּרְכּוֹ
  choice: prend garde à son chemin
  rationale: Cette tournure exprime une attention vigilante à sa conduite, tout en distinguant נצר du verbe שׁמר du premier membre. « Chemin » conserve la métaphore sapientielle de la manière de vivre.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte sapientiel
  choice: la vie ou la personne elle-même
  alternative: l’âme
  rationale: Le proverbe porte sur la conduite morale et la préservation de soi. « Vie » n’impose pas une distinction ultérieure entre corps et âme que l’hébreu n’exige pas ici.
- issue: Rapport syntaxique entre מְסִלַּת יְשָׁרִים et סוּר מֵרָע
  choice: la route consiste à se détourner du mal
  alternative: la route des hommes droits s’écarte du mal
  rationale: La formulation retenue respecte la construction nominale et présente l’éloignement du mal comme la nature même de cette route, sans exclure l’autre analyse possible, signalée en note.
translation_notes:
  register: 'Français international moderne, sobre et digne. La construction détachée « c’est se détourner » rend naturellement la proposition nominale hébraïque. Le parallélisme est conservé avec deux expressions distinctes de vigilance : « veille sur » et « prend garde à ».'
