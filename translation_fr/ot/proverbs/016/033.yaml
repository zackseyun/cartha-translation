  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: fr
  text: Le sort est jeté dans le giron, mais toute décision du sort[a] vient de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout verdict du sort » ou « tout jugement du sort ». Le terme hébreu peut avoir une nuance judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק
  choice: dans le giron
  rationale: חֵיק désigne littéralement la poitrine, le giron ou le pli d’un vêtement. « Dans le giron » conserve l’image concrète de l’endroit où l’on jetait les sorts.
- source_word: יוּטַל
  choice: on jette
  rationale: Le hophal exprime l’action subie par le sort. La tournure française indéfinie « on jette » est naturelle et garde l’action concrète sans préciser l’agent.
- source_word: הַגּוֹרָל
  choice: le sort
  rationale: גּוֹרָל désigne un objet ou procédé de tirage employé pour trancher une question. « Le sort » est l’équivalent français direct sans imposer la forme précise de l’objet.
- source_word: וּמֵיְהוָה
  choice: mais … vient de Yahweh
  rationale: Le ו peut être simplement coordonnant, mais « mais » rend clairement le contraste implicite entre le geste humain et l’origine divine de la décision. מִן exprime ici la provenance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כָּל מִשְׁפָּטוֹ
  choice: toute décision qu’il donne
  rationale: כָּל devant le singulier a une valeur distributive. Le suffixe de מִשְׁפָּטוֹ renvoie au sort; la relative « qu’il donne » l’exprime naturellement en français, tandis que « décision » convient au résultat d’un tirage.
theological_decisions:
- issue: Souveraineté divine et tirage au sort
  choice: Le geste de jeter le sort est humain, mais chaque décision obtenue vient de Yahweh.
  alternative: Limiter explicitement l’énoncé aux seuls tirages sacrés, ou l’élargir à tous les événements apparemment aléatoires.
  rationale: Le texte oppose directement le lancement du sort à Yahweh comme source de sa décision. La traduction maintient cette affirmation sans en étendre ni en restreindre explicitement la portée.
translation_notes:
  register: Français moderne, concis et proverbial. « Giron » est un terme soutenu mais encore intelligible, retenu pour préserver l’image ancienne du creux formé par le vêtement. La formulation évite d’expliquer le mécanisme du tirage ou de développer une doctrine générale de la providence.
