  source_fidelity: Le verset hébreu oppose le geste de jeter le sort à l’origine divine de « toute sa décision » (כָּל־מִשְׁפָּטוֹ). La formulation proposée « qu’il donne » attribue au sort l’acte de donner une décision, ce qui est plus interprétatif que le texte. « Du sort » rend plus directement le suffixe possessif sans introduire cette agentivité.
  naturalness: « Le sort est jeté dans le giron » est une formulation française naturelle, concise et plus proche du passif hébreu que « On jette le sort ». « Toute décision du sort » est compréhensible dans le registre proverbial et conserve le lien entre le tirage et son issue.
  terminology: « Sort », « giron », « décision » et « Yahweh » sont appropriés. La note conserve utilement les nuances judiciaires possibles de מִשְׁפָּט.
