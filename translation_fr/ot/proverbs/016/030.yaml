source:
  edition: WLC
  text: עֹצֶ֣ה עֵ֭ינָי/ו לַ/חְשֹׁ֣ב תַּהְפֻּכ֑וֹת קֹרֵ֥ץ שְׂ֝פָתָ֗י/ו כִּלָּ֥ה רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: fr
  text: Celui qui ferme les yeux pour concevoir des projets pervers, qui pince les lèvres, mène le mal à son terme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹצֶה עֵינָיו
  choice: ferme les yeux
  rationale: Le participe décrit le fait de fermer les yeux, geste associé ici à la préparation réfléchie du mal.
- source_word: לַחְשֹׁב
  choice: pour concevoir
  rationale: Le verbe חשב exprime ici l’élaboration intentionnelle d’un projet; « concevoir » reste naturel et précis en français.
- source_word: תַּהְפֻּכוֹת
  choice: des projets pervers
  rationale: Le pluriel désigne des desseins marqués par la déviation morale. « Projets pervers » explicite sobrement le sens contextuel sans en atténuer la force.
- source_word: קֹרֵץ שְׂפָתָיו
  choice: pince les lèvres
  rationale: Puisque l’objet est « ses lèvres », קרץ désigne ici un resserrement des lèvres plutôt qu’un clignement des yeux. « Pince les lèvres » rend le geste de façon concise.
- source_word: כִּלָּה רָעָה
  choice: mène le mal à son terme
  rationale: Le piel de כלה souligne l’achèvement ou l’aboutissement. Cette formulation française conserve la valeur résultative sans suggérer que le mal lui-même serait épuisé.
theological_decisions:
- issue: Rapport entre les gestes et l’achèvement du mal
  choice: 'Conserver la proposition finale comme constat d’aboutissement: « mène le mal à son terme »'
  alternative: « est résolu à faire le mal » ou « accomplit le mal »
  rationale: L’hébreu emploie un verbe d’achèvement et ne dit pas simplement que l’homme prend une résolution. La traduction maintient cette tension entre la préparation gestuelle et le mal arrivé à son plein aboutissement.
translation_notes:
  register: Français moderne, international et dignifié. La structure participiale et le parallélisme du verset sont conservés, avec une formulation accessible. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
