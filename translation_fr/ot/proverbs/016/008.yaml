  text: טוֹב מְ֭עַט בִּ/צְדָקָ֑ה מֵ/רֹ֥ב תְּ֝בוּא֗וֹת בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/008.yaml
  text: Better a little with righteousness than great income without justice.
translation:
  language: fr
  text: Mieux vaut peu avec justice que d’abondants revenus sans droit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט (meʿat)
  choice: peu
  rationale: Conserve la formulation concise et générale de l’hébreu, sans ajouter « biens » ni préciser leur origine.
- source_word: בִּצְדָקָה (bitsedaqah)
  choice: dans la justice
  rationale: Rend la préposition et le sens moral de צְדָקָה sans introduire l’idée non exprimée de biens « acquis » justement.
- source_word: רֹב תְּבוּאוֹת (rov tevuʾot)
  choice: d’abondants revenus
  rationale: רֹב exprime l’abondance et תְּבוּאוֹת peut désigner les produits, recettes ou revenus; « revenus » convient au caractère général du proverbe.
- source_word: בְּלֹא מִשְׁפָּט (belo mishpat)
  choice: sans équité
  rationale: Exprime l’absence de droit, de jugement juste ou d’équité, tout en évitant une répétition française lourde de « justice ».
theological_decisions:
- issue: Rapport entre צְדָקָה et מִשְׁפָּט
  choice: justice / équité
  alternative: justice / droit
  rationale: Les deux termes se recoupent sans être identiques. Cette paire maintient leur parallélisme moral et juridique sans les confondre ni leur imposer une distinction doctrinale rigide.
translation_notes:
  register: Formulation brève, sentencieuse et accessible, fidèle au parallélisme antithétique hébreu. La ponctuation met en relief « dans la justice » sans expliciter au-delà du texte source.
