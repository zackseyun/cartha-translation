id: PRO.16.18
reference: Proverbs 16:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֥בֶר גָּא֑וֹן וְ/לִ/פְנֵ֥י כִ֝שָּׁל֗וֹן גֹּ֣בַהּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: fr
  text: L’orgueil précède la ruine[a], et l’esprit hautain précède la chute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Avant la ruine, l’orgueil ; et avant le trébuchement, l’élévation d’esprit. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: précède
  rationale: Dans ce proverbe, la locution signifie temporellement « avant ». La tournure verbale « précède » est naturelle en français et exprime clairement le rapport entre l’attitude et l’issue qui suit.
- source_word: שֶׁבֶר
  choice: ruine
  rationale: Le nom évoque ici non une fracture matérielle, mais un effondrement ou un désastre. « Ruine » convient au registre sapientiel et reste distinct de la « chute » du second membre.
- source_word: גָּאוֹן
  choice: orgueil
  rationale: Bien que le terme puisse ailleurs désigner la majesté ou l’élévation, son parallélisme avec l’esprit hautain et son association à la ruine imposent ici son sens moral négatif.
- source_word: וְלִפְנֵי
  choice: et … précède
  rationale: La répétition de « précède » restitue la structure parallèle et équilibrée de l’hébreu dans un français fluide.
- source_word: כִּשָּׁלוֹן
  choice: chute
  rationale: Le terme désigne le fait de trébucher ou de tomber. « Chute » est idiomatique et exprime aussi bien le mouvement concret que le revers figuré.
- source_word: גֹּבַהּ רוּחַ
  choice: l’esprit hautain
  rationale: Cette expression signifie littéralement « hauteur d’esprit ». « Esprit hautain » conserve le terme anthropologique « esprit » tout en rendant clairement l’arrogance suggérée par la métaphore.
theological_decisions:
- issue: Caractérisation morale de גָּאוֹן et de גֹּבַהּ רוּחַ
  choice: Les deux expressions sont rendues négativement par « orgueil » et « esprit hautain ».
  alternative: « majesté » pour גָּאוֹן ou « élévation d’esprit » pour גֹּבַהּ רוּחַ
  rationale: Le parallélisme synonymique relie ces dispositions à la ruine et à la chute, ce qui établit leur valeur morale négative dans ce contexte sans importer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, concis et proverbial. La répétition de « précède » maintient le parallélisme hébreu, tandis que la note conserve la formulation nominale plus littérale et la nuance de « trébuchement ».
