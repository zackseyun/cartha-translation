  text: לֵ֣ב חָ֭כָם יַשְׂכִּ֣יל פִּ֑י/הוּ וְ/עַל שְׂ֝פָתָ֗י/ו יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/023.yaml
  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: fr
  text: Le cœur du sage rend sa bouche avisée[a] et ajoute du savoir à ses lèvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donne du discernement à sa bouche ». Le verbe hébreu peut exprimer le fait de rendre prudent ou de donner du discernement.
    reason: lexical_alternative
  - marker: b
    text: Ou « rend ses lèvres plus persuasives ». Le mot hébreu désigne d’abord l’instruction, l’enseignement ou le savoir ; dans ce contexte, il peut aussi évoquer une parole instructive ou persuasive.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » conserve l’image anthropologique hébraïque de la personne intérieure, siège notamment de la pensée et du jugement.
- source_word: חָכָם
  choice: sage
  rationale: L’adjectif masculin singulier est employé comme substantif. « Le sage » correspond naturellement à cette forme en français.
- source_word: יַשְׂכִּיל
  choice: donne du discernement
  rationale: Le hiphil de שׂכל exprime ici l’idée de communiquer ou de produire intelligence, prudence ou discernement. Cette formulation restitue la valeur causative sans rendre la phrase artificielle.
- source_word: פִּיהוּ
  choice: à sa bouche
  rationale: La traduction garde l’image concrète de la bouche, parallèle à celle des lèvres dans le second membre.
- source_word: וְעַל שְׂפָתָיו
  choice: et … ses lèvres
  rationale: La préposition עַל s’intègre idiomatiquement à la construction verbale française. Les « lèvres » sont conservées pour respecter le parallélisme poétique.
- source_word: יֹסִיף
  choice: rend … plus
  rationale: Cette tournure française exprime naturellement l’idée d’ajouter ou d’accroître portée par le verbe יסף.
- source_word: לֶקַח
  choice: persuasives
  rationale: לֶקַח désigne fondamentalement ce qui est reçu comme enseignement ou instruction; appliqué aux lèvres, le terme peut évoquer la qualité instructive et persuasive du discours. « Persuasives » donne ici un sens contextuel naturel, tout en signalant l’autre possibilité en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme « cœur / bouche / lèvres » est préservé, tandis que le second membre est formulé idiomatiquement pour rester immédiatement compréhensible.
