  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: fr
  text: C’est une abomination pour les rois de commettre le mal, car un trône est affermi par la droiture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la justice ».'
    reason: 'Alternative lexicale pertinente : dans ce contexte royal, צְדָקָה peut aussi mettre l’accent sur une administration juste.'
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Conserve la forte réprobation morale du nom hébreu et la concision proverbiale.
- source_word: מְלָכִים
  choice: les rois
  rationale: Rend directement le pluriel hébreu, qui vise ici les détenteurs de l’autorité royale en général.
- source_word: עֲשׂוֹת רֶשַׁע
  choice: commettre le mal
  rationale: « Commettre » est l’expression française naturelle avec un acte moralement condamnable; « le mal » rend le caractère mauvais et coupable de רֶשַׁע sans alourdir la phrase.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français le fondement donné par le second membre du proverbe.
- source_word: בִצְדָקָה
  choice: par la droiture
  rationale: « Droiture » préserve la portée morale générale de צְדָקָה, tandis que la préposition « par » exprime le moyen ou le fondement. Le sens politique de « justice » est signalé en note.
- source_word: יִכּוֹן
  choice: s’affermit
  rationale: 'Exprime l’idée du niphal de כון : devenir ferme, stable ou solidement établi. Le verbe convient naturellement à l’image d’un trône.'
- source_word: כִּסֵּא
  choice: un trône
  rationale: L’article indéfini rend la valeur générique du singulier dans cette maxime.
theological_decisions:
- issue: Sens de צְדָקָה dans un contexte de sagesse royale
  choice: droiture
  alternative: justice
  rationale: « Droiture » garde la qualité morale générale qui fonde la légitimité du règne. « Justice » convient également au contexte du gouvernement royal et demeure donc en note afin de préserver cette nuance authentique.
translation_notes:
  register: Français moderne, digne et proverbial. La formulation reste concise, avec un parallélisme clair entre la conduite morale des rois et la stabilité du trône.
