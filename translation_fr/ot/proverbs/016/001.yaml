id: PRO.16.1
reference: Proverbs 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: fr
  text: Les projets du cœur appartiennent à l’être humain[a], mais la réponse de la langue vient de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les dispositions du cœur appartiennent à l’être humain, mais la réponse de la langue vient de Yahweh. »'
    reason: 'Alternative lexicale : מַעַרְכֵי peut désigner des arrangements, des préparatifs ou des dispositions.'
lexical_decisions:
- source_word: לְאָדָם
  choice: À l’être humain
  rationale: Le לְ exprime ici la relation ou ce qui relève de quelqu’un. « L’être humain » rend le singulier représentatif אָדָם de manière générique et naturelle en français.
- source_word: מַעַרְכֵי
  choice: les projets
  rationale: Le terme désigne des dispositions ou mises en ordre. Avec « cœur », « projets » exprime naturellement l’organisation intérieure des intentions.
- source_word: לֵב
  choice: du cœur
  rationale: « Cœur » conserve l’image hébraïque de l’intériorité, siège notamment de la pensée et de l’intention.
- source_word: וּמֵיְהוָה
  choice: mais de Yahweh vient
  rationale: La conjonction peut signifier « et », mais le parallélisme marque ici un contraste. La tournure française explicite naturellement l’origine indiquée par מִן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu.
- source_word: מַעֲנֵה
  choice: la réponse
  rationale: « Réponse » est le sens direct du nom et convient à la formulation concise du proverbe.
- source_word: לָשׁוֹן
  choice: de la langue
  rationale: La traduction littérale conserve la métonymie poétique hébraïque de la langue pour la parole prononcée.
theological_decisions:
- issue: Rapport entre l’intention humaine et la souveraineté divine
  choice: Le premier membre attribue à l’être humain les projets intérieurs, tandis que le second fait venir de Yahweh la réponse prononcée.
  alternative: Comprendre le second membre plus largement comme une affirmation de la maîtrise divine de tous les résultats.
  rationale: La traduction maintient la tension précise entre les projets du cœur et la réponse de la langue, sans la transformer en système déterministe ni en affirmation générale sur les résultats.
translation_notes:
  register: Style sapiential concis et solennel. La phrase nominale du premier membre est conservée pour respecter le parallélisme hébreu, tout en restant intelligible en français moderne.
