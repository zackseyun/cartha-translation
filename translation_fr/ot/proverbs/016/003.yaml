source:
  edition: WLC
  text: גֹּ֣ל אֶל יְהוָ֣ה מַעֲשֶׂ֑י/ךָ וְ֝/יִכֹּ֗נוּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: fr
  text: Confie à Yahweh tout ce que tu fais[a], et tes projets[b] seront affermis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Roule vers Yahweh tes œuvres ». Cette image signifie qu’on les lui remet avec confiance.'
    reason: lexical_alternative
  - marker: b
    text: Ou « tes pensées », « tes intentions » ou « tes desseins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Confie
  rationale: L’impératif signifie littéralement « roule », mais, dans cette construction avec Yahweh, il exprime l’idée de remettre ses affaires à quelqu’un en toute confiance. « Confie » rend naturellement cet idiome en français moderne.
- source_word: אֶל
  choice: à
  rationale: La préposition marque ici la direction vers Yahweh. Avec « confier », « à » est l’équivalent français idiomatique, tandis que « sur » conserverait plus directement l’image de ce que l’on roule, au prix d’une formulation peu naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, « Yahweh », plutôt que par un titre de substitution.
- source_word: מַעֲשֶׂיךָ
  choice: tout ce que tu fais
  rationale: Le nom désigne les actes, les œuvres ou les entreprises d’une personne. « Tout ce que tu fais » est clair, large et naturel, sans la connotation religieuse que « œuvres » peut prendre en français.
- source_word: וְיִכֹּנוּ
  choice: seront affermis
  rationale: La forme niphal de כון exprime le fait d’être établi, rendu ferme ou assuré. « Seront affermis » conserve cette nuance passive et résultative.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: tes projets
  rationale: Le terme peut désigner les pensées, les intentions, les desseins ou les projets. En parallèle avec ce que la personne fait, « projets » exprime naturellement ici la dimension pratique du mot, sans exclure entièrement l’idée d’intention.
theological_decisions:
- issue: Rapport entre l’action humaine et l’établissement divin
  choice: Le proverbe appelle à confier à Yahweh ce que l’on fait et annonce alors que les projets seront affermis.
  alternative: On pourrait y lire soit une détermination unilatérale de tous les projets humains, soit une garantie de réussite matérielle pour toute entreprise.
  rationale: L’hébreu formule une exhortation de sagesse accompagnée d’un résultat, sans exposer une doctrine complète de la providence ni promettre que toute entreprise connaîtra le succès. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne. « Tout ce que tu fais » évite le caractère aujourd’hui soutenu ou théologiquement chargé de « tes œuvres ».
