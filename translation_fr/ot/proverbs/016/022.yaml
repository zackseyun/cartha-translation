  text: מְק֣וֹר חַ֭יִּים שֵׂ֣כֶל בְּעָלָ֑י/ו וּ/מוּסַ֖ר אֱוִלִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: fr
  text: Le discernement[a] est une source de vie pour qui le possède, mais l’instruction des insensés[b] est folie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’intelligence est une source de vie pour celui qui la possède. »'
    reason: lexical_alternative
  - marker: b
    text: « Instruction » peut aussi se traduire par « discipline » ou « correction ». La formulation peut désigner l’instruction dispensée par les insensés, laquelle n’est que folie.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: מְקוֹר
  choice: source
  rationale: Le nom désigne une source ou une fontaine. « Source de vie » conserve l’image concrète et constitue une expression naturelle en français.
- source_word: חַיִּים
  choice: vie
  rationale: Bien que le mot hébreu soit de forme plurielle, il exprime couramment la notion abstraite de vie; le singulier français convient ici.
- source_word: שֵׂכֶל
  choice: discernement
  rationale: Dans les Proverbes, le terme évoque une intelligence pratique et avisée. « Discernement » rend cette capacité de bien comprendre et d’agir judicieusement.
- source_word: בְּעָלָיו
  choice: pour qui le possède
  rationale: L’expression signifie littéralement « pour son possesseur ». Cette formulation française garde le rapport singulier tout en restant naturelle.
- source_word: מוּסַר
  choice: correction
  rationale: Le terme couvre l’instruction, la discipline et la correction. « Correction » préserve ici l’ambiguïté entre ce qui vise à redresser les gens stupides et la leçon qu’ils peuvent dispenser.
- source_word: אֱוִלִים
  choice: gens stupides
  rationale: Le mot désigne, dans la littérature sapientielle, des personnes moralement obtuses et réfractaires à la sagesse. Cette formulation est claire en français moderne.
- source_word: אִוֶּלֶת
  choice: stupidité
  rationale: Le nom abstrait désigne la qualité caractéristique des אֱוִלִים. La répétition « gens stupides… stupidité » reproduit le lien lexical et la pointe du proverbe.
theological_decisions:
- issue: Rapport syntaxique entre מוּסַר et אִוֶּלֶת
  choice: La correction des gens stupides est leur propre stupidité.
  alternative: La stupidité sert de correction aux gens stupides.
  rationale: 'L’hébreu nominal permet plusieurs nuances : la correction destinée aux gens stupides, celle qu’ils donnent, ou la stupidité elle-même comme leur correction. Le texte principal suit l’ordre syntaxique le plus direct sans exclure les autres lectures, signalées en note.'
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé; « source de vie » maintient la métaphore hébraïque. Les notes rendent explicites les principales ambiguïtés lexicales et syntaxiques sans imposer une interprétation confessionnelle.
