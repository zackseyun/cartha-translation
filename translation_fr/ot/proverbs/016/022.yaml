    issue: « Correction des gens stupides » est une lecture moins directe de מוּסַר אֱוִלִים.
    rationale: Le génitif après מוּסַר se comprend naturellement comme l’instruction donnée par les insensés. Une note peut préserver les valeurs lexicales voisines de מוּסַר sans transformer le texte principal en une interprétation plus spécifique.
  - severity: low
    issue: « Gens stupides » affaiblit le registre sapientiel de אֱוִלִים.
    rationale: « Insensés » conserve mieux la portée morale et pratique du terme hébreu, sans le réduire à une déficience intellectuelle.
