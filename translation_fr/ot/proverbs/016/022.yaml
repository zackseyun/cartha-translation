  naturalness: « Source de vie » et « pour qui le possède » sont naturels dans un français proverbial moderne. « Les insensés » est plus concis, plus idiomatique dans ce registre et plus fidèle à la catégorie sapientielle que « les gens stupides ».
  terminology: « Discernement » convient pour שֵׂכֶל. « Instruction » est retenu pour מוּסַר dans la seconde ligne, car il rend naturellement le construit avec « des insensés » sans exclure les sens voisins de discipline ou correction, qui sont signalés en note. « Folie » rend avec précision אִוֶּלֶת.
