  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: fr
  text: Acquiers la sagesse — combien cela vaut mieux que l’or ! Acquérir l’intelligence est préférable à l’argent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: Acquérir
  rationale: L’infinitif français rend naturellement l’idée d’obtenir ou d’acquérir, répétée dans les deux membres du verset.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent courant et direct du terme hébreu dans la littérature sapientielle.
- source_word: חָרוּץ
  choice: l’or
  rationale: Dans ce contexte de comparaison avec l’argent, le terme désigne l’or, probablement l’or fin.
- source_word: בִּינָה
  choice: l’intelligence
  rationale: Rend la faculté de discernement et de compréhension, tout en restant naturel en français moderne.
- source_word: נִבְחָר
  choice: est préférable
  rationale: Le passif hébreu signifie littéralement « est choisi »; la formulation comparative française exprime naturellement ce qui mérite d’être choisi plutôt que l’argent.
- source_word: כָּסֶף
  choice: l’argent
  rationale: Le contexte oppose les métaux précieux; « argent » désigne ici le métal.
theological_decisions:
- issue: Valeur relative de la sagesse et des richesses
  choice: Conserver une comparaison de supériorité sans condamner en soi les métaux précieux
  alternative: Présenter l’or et l’argent comme mauvais
  rationale: L’hébreu affirme que sagesse et intelligence sont meilleures et préférables; il ne formule pas une condamnation absolue de la richesse.
translation_notes:
  register: Formulation moderne, concise et proverbiale. Le parallélisme hébreu est maintenu par la répétition d’« Acquérir », tandis que l’exclamation du premier membre restitue מַה־טּוֹב.
