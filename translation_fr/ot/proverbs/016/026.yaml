source:
  edition: WLC
  text: נֶ֣פֶשׁ עָ֭מֵל עָ֣מְלָה לּ֑/וֹ כִּֽי אָכַ֖ף עָלָ֣י/ו פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/026.yaml
  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
translation:
  language: fr
  text: L’appétit[a] du travailleur travaille pour lui[b], car sa bouche le presse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âme », « la vie » ou « le désir ». Le mot hébreu peut prendre tous ces sens; ici, la mention de « sa bouche » favorise « l’appétit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour lui-même ». L’hébreu dit littéralement « pour lui », mais l’expression peut être comprise dans un sens réfléchi.
    reason: alternative_reading
  - marker: c
    text: Ou « le pousse », « le contraint » ou « le talonne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: appétit
  rationale: Le nom peut désigner la personne, la vie, le désir ou l’appétit. La mention de « sa bouche » dans le second membre favorise ici « appétit », sans effacer les autres nuances possibles.
- source_word: עָמֵל
  choice: travailleur
  rationale: Le terme désigne celui qui travaille ou peine. « Travailleur » est actuel et permet de conserver l’écho avec le verbe suivant.
- source_word: עָמְלָה
  choice: travaille
  rationale: 'Ce choix reproduit autant que possible le jeu de mots hébreu entre עָמֵל et עָמְלָה : « le travailleur travaille ».'
- source_word: לּוֹ
  choice: pour lui
  rationale: La forme hébraïque signifie directement « pour lui ». Une valeur réfléchie, « pour lui-même », reste possible selon le sens donné au contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle l’appétit du travailleur le fait travailler.
- source_word: אָכַף
  choice: presse
  rationale: Le verbe exprime une pression contraignante. « Le presse » conserve cette force tout en restant concis et proverbial en français.
- source_word: עָלָיו
  choice: le
  rationale: Avec אָכַף, la préposition marque la personne sur laquelle s’exerce la pression; le français l’intègre naturellement au pronom objet « le ».
- source_word: פִּיהוּ
  choice: sa bouche
  rationale: La traduction littérale préserve la personnification concrète de la bouche, plutôt que de l’interpréter directement comme la faim.
theological_decisions: []
