source:
  edition: WLC
  text: אִ֣ישׁ חָ֭מָס יְפַתֶּ֣ה רֵעֵ֑/הוּ וְ֝/הוֹלִיכ֗/וֹ בְּ/דֶ֣רֶךְ לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/029.yaml
  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: fr
  text: L’homme violent entraîne son prochain[a] et le conduit sur une voie qui n’est pas bonne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ami » ou « son compagnon ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur une voie pas bonne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָמָס
  choice: L’homme violent
  rationale: La tournure française exprime naturellement l’homme caractérisé par la violence, tout en conservant le masculin singulier représentatif de l’hébreu.
- source_word: יְפַתֶּה
  choice: entraîne
  rationale: Le piel de פתה désigne ici l’action d’attirer ou d’amener quelqu’un à suivre une mauvaise conduite. « Entraîne » est naturel dans ce contexte moral et n’ajoute ni tromperie explicite ni connotation sexuelle.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner le prochain, l’ami ou le compagnon. « Son prochain » maintient le sens relationnel large sans supposer une amitié intime.
- source_word: וְהוֹלִיכוֹ
  choice: et le conduit
  rationale: 'Le hifil de הלך est causatif : faire aller, mener. « Le conduit » en restitue clairement la force.'
- source_word: בְּדֶרֶךְ
  choice: sur une voie
  rationale: דֶּרֶךְ évoque une route ou, métaphoriquement, une ligne de conduite. « Sur une voie » conserve cette image proverbiale en français naturel.
- source_word: לֹא טוֹב
  choice: qui n’est pas bonne
  rationale: Cette formulation garde la litote littérale « pas bonne » sans la renforcer en « mauvaise » ou « mauvaise voie ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. « L’homme violent » garde la forme masculine du texte; « entraîne » et « conduit » distinguent l’incitation initiale de la direction qui suit. Les deux marqueurs de note figurent dans le texte.
