  text: מַשְׂכִּ֣יל עַל דָּ֭בָר יִמְצָא ט֑וֹב וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה אַשְׁרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: fr
  text: Qui réfléchit avec discernement à une affaire trouvera le bien[a] ; heureux celui qui met sa confiance en Yahweh[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui agit avec sagesse dans une affaire trouvera le bien » ou « Qui se montre avisé dans une affaire trouvera le bien ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu emploie le nom divin יהוה (YHWH), rendu ici par « Yahweh ».
    reason: textual_clarification
lexical_decisions:
- source_word: מַשְׂכִּיל עַל דָּבָר
  choice: prête une attention avisée à une affaire
  rationale: Le participe hiphil de שׂכל peut exprimer une conduite avisée ou un examen prudent. Avec עַל דָּבָר, cette formulation française conserve à la fois l’attention active et la sagesse pratique, sans réduire דָּבָר à une simple parole.
- source_word: יִמְצָא טוֹב
  choice: trouvera le bien
  rationale: 'La traduction garde le verbe « trouver » et la portée générale de טוֹב : bien, avantage ou bonheur, sans la limiter à la prospérité matérielle.'
- source_word: וּבוֹטֵחַ בַּיהוָה
  choice: qui met sa confiance en Yahweh
  rationale: Le participe a une valeur générale. « Met sa confiance en » est idiomatique en français et exprime une confiance active placée en Yahweh.
- source_word: אַשְׁרָיו
  choice: heureux
  rationale: Dans une formule de béatitude, « heureux » exprime l’état favorable et florissant désigné par אַשְׁרֵי, et la tournure épicène « heureux qui » évite de faire croire que l’énoncé ne viserait que les hommes.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Portée de אַשְׁרָיו
  choice: formulation générique « heureux qui »
  alternative: « heureux est-il » ou « heureux l’homme »
  rationale: Le suffixe masculin singulier a ici une portée proverbiale générale. La formulation choisie inclut naturellement toute personne sans ajouter de particularisme doctrinal.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme des deux propositions et la brièveté de la béatitude sont préservés ; « affaire » garde le sens large de דָּבָר.
