source:
  edition: WLC
  text: ט֣וֹב שְׁפַל ר֭וּחַ אֶת עניים מֵֽ/חַלֵּ֥ק שָׁ֝לָ֗ל אֶת גֵּאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/019.yaml
  text: Better to be lowly in spirit with the poor than to divide plunder with the proud[a].
translation:
  language: fr
  text: Mieux vaut être humble d’esprit avec les pauvres[a] que partager le butin avec les orgueilleux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les affligés » ou « avec les humbles ». Le mot hébreu עניים peut désigner les pauvres, les affligés ou les humbles, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Cette tournure introduit naturellement en français l’évaluation comparative du proverbe tout en conservant sa concision.
- source_word: שְׁפַל רוּחַ
  choice: être humble d’esprit
  rationale: L’expression désigne une disposition intérieure d’humilité ou d’abaissement. « Humble d’esprit » est clair, digne et fait ressortir le contraste avec les orgueilleux.
- source_word: אֶת עניים
  choice: avec les pauvres
  rationale: אֶת a ici une valeur associative, « avec ». עניים peut désigner les pauvres, les affligés ou les humbles ; « les pauvres » convient au contraste social avec ceux qui se partagent un butin, tandis qu’une note préserve les autres sens possibles.
- source_word: מֵחַלֵּק
  choice: que partager
  rationale: La préposition מִן marque la comparaison après טוֹב. « Que partager » rend le mouvement comparatif de façon idiomatique en français.
- source_word: שָׁלָל
  choice: le butin
  rationale: Le mot désigne les biens pris à l’ennemi ou acquis par pillage. « Butin » est le terme français moderne le plus direct dans ce contexte.
- source_word: אֶת גֵּאִים
  choice: avec les orgueilleux
  rationale: אֶת est de nouveau associatif. גֵּאִים désigne ceux qui sont orgueilleux ou arrogants ; « orgueilleux » forme un contraste lexical net avec « humble d’esprit ».
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La formulation garde le parallélisme entre l’humilité solidaire des pauvres et le partage du butin avec les orgueilleux, sans trancher silencieusement l’ambiguïté de עניים.
