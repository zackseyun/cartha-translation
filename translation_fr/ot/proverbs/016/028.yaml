id: PRO.16.28
reference: Proverbs 16:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֣ישׁ תַּ֭הְפֻּכוֹת יְשַׁלַּ֣ח מָד֑וֹן וְ֝/נִרְגָּ֗ מַפְרִ֥יד אַלּֽוּף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: fr
  text: Un homme pervers[a] provoque des querelles[b], et le médisant[c] sépare les amis intimes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme aux voies tortueuses ». Le nom hébreu évoque ce qui est pervers, dévoyé ou tortueux.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « envoie des querelles »; on peut aussi traduire « déclenche des conflits ».
    reason: lexical_alternative
  - marker: c
    text: Ou « celui qui colporte des médisances ». Le terme hébreu désigne quelqu’un dont les propos discrets ou secrets détériorent les relations.
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu est au singulier : « un ami intime » ou « un proche compagnon ». Le pluriel français exprime la portée générale du proverbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le masculin singulier de l’hébreu, qui a ici une portée représentative dans la maxime.
- source_word: תַּהְפֻּכוֹת
  choice: pervers
  rationale: L’expression idiomatique française « homme pervers » rend naturellement l’idée de caractère tortueux ou dévoyé sans limiter le terme au domaine sexuel.
- source_word: יְשַׁלַּח
  choice: provoque
  rationale: Le verbe signifie littéralement « envoie »; avec « querelles », il décrit le fait de les déclencher ou de les mettre en circulation.
- source_word: מָדוֹן
  choice: des querelles
  rationale: Terme courant et concret pour les conflits et contestations interpersonnels évoqués dans la littérature sapientielle.
- source_word: נִרְגָּן
  choice: le médisant
  rationale: Désigne celui qui tient à voix basse ou en secret des propos nuisibles aux relations; « médisant » reste naturel et suffisamment large en français moderne.
- source_word: מַפְרִיד
  choice: sépare
  rationale: Rend directement le participe hébreu, qui exprime une conduite habituelle aux effets destructeurs.
- source_word: אַלּוּף
  choice: les amis intimes
  rationale: Dans ce contexte, le mot désigne un proche compagnon ou confident. Le pluriel français exprime naturellement la portée générale du proverbe.
