review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu oppose le projet conçu par le cœur humain à l’action de Yahweh qui rend fermes/établit les pas. « Affermit ses pas » rend bien יָכִין et préserve la tension sans imposer une lecture déterministe. En revanche, « le chemin qu’il prendra » explicite et ajoute une idée prospective qui n’est pas formulée dans l’hébreu.
  naturalness: La formulation révisée est sobre, intelligible et conserve le parallélisme proverbial entre « voie » et « pas ». « Dans son cœur » transmet naturellement la fonction intentionnelle de לֵב sans faire du cœur une simple émotion.
  terminology: « L’être humain » convient pour le singulier générique de אָדָם dans un français international moderne. « Yahweh » reproduit systématiquement le tétragramme. « Voie » et « pas » maintiennent les images correspondantes du texte source.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « le chemin qu’il prendra »
    rationale: דַּרְכּוֹ signifie simplement « sa voie/son chemin ». La relative introduit l’idée que l’humain prendra effectivement ce chemin, alors que le proverbe contraste précisément son projet avec l’établissement de ses pas par Yahweh.
  - severity: low
    issue: Note lexicalement trop directive
    rationale: La note peut présenter « dirige » comme possibilité de traduction sans affirmer que le contexte impose ce sens plus étroit que « rend ferme/établit ».
