source:
  edition: WLC
  text: לֵ֣ב אָ֭דָם יְחַשֵּׁ֣ב דַּרְכּ֑/וֹ וַֽ֝/יהוָ֗ה יָכִ֥ין צַעֲדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: fr
  text: Dans son cœur, l’être humain planifie sa voie, mais Yahweh affermit ses pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « établit ses pas » ou « dirige ses pas ». Le verbe hébreu peut signifier « rendre ferme », « établir » ou « diriger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: dans son cœur
  rationale: Le cœur désigne ici le centre intérieur de la réflexion et de l’intention. La tournure locative conserve l’image hébraïque tout en étant naturelle en français.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le nom singulier a ici une portée générique et représente toute personne. « L’être humain » rend cette valeur sans limiter artificiellement le proverbe aux hommes.
- source_word: יְחַשֵּׁב
  choice: prépare
  rationale: Le piel de חשׁב exprime l’élaboration réfléchie d’un projet. Avec « le chemin qu’il prendra », « prépare » communique naturellement l’idée de planifier sans évoquer un calcul mécanique.
- source_word: דַּרְכּוֹ
  choice: le chemin qu’il prendra
  rationale: דֶּרֶךְ peut désigner aussi bien une route que le cours de la vie. Cette formulation garde la métaphore du chemin et exprime clairement l’orientation projetée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: יָכִין
  choice: affermit
  rationale: Le hiphil de כון signifie rendre ferme, établir ou mettre solidement en place. « Affermit » conserve cette nuance causative sans réduire le sens à la seule direction.
- source_word: צַעֲדוֹ
  choice: ses pas
  rationale: Le singulier hébreu peut avoir une valeur collective. Le pluriel français est idiomatique et préserve l’image concrète des pas qui composent le parcours d’une vie.
theological_decisions:
- issue: Souveraineté divine et projets humains
  choice: L’être humain prépare réellement son chemin, tandis que Yahweh affermit ses pas.
  alternative: Yahweh dirige ses pas ; Yahweh détermine ses pas.
  rationale: La traduction maintient côte à côte l’intention humaine et l’action décisive de Dieu. « Affermit » évite de ramener cette action soit à une simple orientation, soit à une formulation explicitement déterministe.
translation_notes:
  register: Français moderne, sobre et proverbial. La structure antithétique des deux membres est conservée, ainsi que les images liées du chemin et des pas.
