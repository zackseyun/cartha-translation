  text: תּוֹעֲבַ֣ת יְ֭הוָה כָּל גְּבַהּ לֵ֑ב יָ֥ד לְ֝/יָ֗ד לֹ֣א יִנָּקֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: fr
  text: Quiconque a le cœur orgueilleux est une abomination pour Yahweh ; main à main[a], il ne restera pas impuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « main à main ». Cette expression peut signifier « certainement » ou « soyez-en sûr » ; elle peut aussi vouloir dire « même s’ils se donnent la main », c’est-à-dire même s’ils s’allient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Le nom désigne ce qui est profondément odieux ou détestable, avec ici une forte portée morale et religieuse. « Une abomination » conserve cette intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre substitutif.
- source_word: כָּל גְּבַהּ לֵב
  choice: quiconque a le cœur orgueilleux
  rationale: Cette formulation naturelle restitue la valeur distributive de כָּל et l’image hébraïque d’un cœur élevé, c’est-à-dire intérieurement orgueilleux.
- source_word: יָד לְיָד
  choice: de main à main
  rationale: La traduction formellement transparente maintient dans le texte l’expression hébraïque difficile, sans trancher entre sa valeur d’assurance et l’éventuelle image de personnes qui se donnent ou se joignent la main.
- source_word: לֹא יִנָּקֶה
  choice: il ne restera certainement pas impuni
  rationale: Le nifal de נקה exprime ici le fait de ne pas échapper à la sanction. « Ne restera pas impuni » en rend clairement la portée judiciaire ; « certainement » traduit la probable force emphatique de l’expression précédente tout en laissant celle-ci visible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre divin sans lui substituer un titre.
- issue: Interprétation de יָד לְיָד
  choice: Conserver « de main à main » dans le texte et exprimer sa probable force emphatique par « certainement »
  alternative: Traduire « soyez-en sûr » ou comprendre « même s’ils se donnent la main »
  rationale: L’expression est réellement obscure. Sa conservation dans le texte, accompagnée d’une note, évite de résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe proverbiale reste concise ; le point-virgule conserve les deux affirmations parallèles. Le terme fort « abomination » et l’expression source ambiguë sont maintenus.
