  naturalness: La formulation est moderne et digne dans l’ensemble. « Main à main » demeure volontairement non idiomatique, mais la note l’explique; c’est préférable à « de main à main », qui est idiomatique en français avec un sens parasite. La suppression de « certainement » évite d’imposer dans le texte une interprétation de l’expression tout en la présentant littéralement.
  terminology: « Yahweh » respecte le rendu du tétragramme établi dans le dossier. « Abomination » garde la force morale et religieuse de תּוֹעֲבָה sans atténuation. « Cœur orgueilleux » est naturel et conserve l’intériorité de l’idiome hébreu.
