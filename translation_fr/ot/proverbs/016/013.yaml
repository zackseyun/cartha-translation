reference: Proverbs 16:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: fr
  text: Les rois prennent plaisir aux paroles justes[a], et le roi aime celui qui dit ce qui est droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les lèvres de justice sont le plaisir — ou la faveur — des rois. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui dit des choses droites ». L’hébreu emploie ici un pluriel substantivé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: prennent plaisir
  rationale: Le nom peut exprimer le plaisir, la faveur ou l’agrément. La tournure verbale « prennent plaisir » restitue naturellement en français la valeur prédicative de l’expression hébraïque dans ce proverbe.
- source_word: מְלָכִים
  choice: les rois
  rationale: Le pluriel concret « rois » conserve le cadre royal du texte sapientiel.
- source_word: שִׂפְתֵי צֶדֶק
  choice: aux paroles justes
  rationale: Littéralement « lèvres de justice », cette expression désigne par métonymie des paroles conformes à la justice. « Paroles justes » est naturel en français moderne tout en gardant la dimension morale.
- source_word: וְדֹבֵר
  choice: celui qui dit
  rationale: Le participe est employé substantivement et désigne de manière générale la personne qui parle.
- source_word: יְשָׁרִים
  choice: ce qui est droit
  rationale: L’adjectif pluriel substantivé désigne des choses droites, honnêtes ou justes. Le singulier collectif français « ce qui est droit » en transmet naturellement le sens.
- source_word: יֶאֱהָב
  choice: le roi aime
  rationale: Le verbe hébreu est à la troisième personne du singulier et exprime ici une vérité générale. « Le roi » explicite sobrement le sujet singulier générique suggéré par le premier membre, sans le remplacer par un pluriel.
theological_decisions:
- issue: Passage du pluriel « rois » au verbe singulier יֶאֱהָב
  choice: « et le roi aime »
  alternative: « et ils aiment »
  rationale: La lecture au singulier respecte la morphologie du texte massorétique et comprend « le roi » comme représentant générique de la catégorie évoquée au premier membre. Le pluriel serait plus régulier en français, mais effacerait le singulier hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La première proposition emploie une formulation idiomatique plutôt que de conserver la métonymie peu naturelle des « lèvres » ; celle-ci est signalée en note. La seconde maintient délibérément le singulier du verbe hébreu au moyen du sujet générique « le roi ».
