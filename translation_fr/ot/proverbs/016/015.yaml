  text: בְּ/אוֹר פְּנֵי מֶ֥לֶךְ חַיִּ֑ים וּ֝/רְצוֹנ֗/וֹ כְּ/עָ֣ב מַלְקֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/015.yaml
  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: fr
  text: Dans la lumière du visage du roi se trouve la vie[a], et sa faveur est comme un nuage de pluie de fin de saison.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image évoque l’expression favorable et la bienveillance du roi, qui apportent vie et bénédiction.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « comme un nuage de pluie tardive ». Il s’agit de la pluie de fin de saison, importante pour les récoltes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אוֹר
  choice: Dans la lumière
  rationale: Conserve l’image concrète de l’hébreu tout en formant une expression naturelle en français.
- source_word: פְּנֵי
  choice: du visage
  rationale: Rend littéralement le terme hébreu et préserve l’image de l’expression favorable du roi, sans la remplacer par l’interprétation « présence ».
- source_word: מֶלֶךְ
  choice: du roi
  rationale: Équivalent lexical direct dans ce contexte royal.
- source_word: חַיִּים
  choice: se trouve la vie
  rationale: Le substantif pluriel hébreu désigne idiomatiquement la vie; le verbe ajouté rend naturelle en français cette proposition sans verbe.
- source_word: וּ/רְצוֹנ/וֹ
  choice: et sa faveur
  rationale: « Faveur » exprime ici l’approbation et la bienveillance royales, en parallèle avec la lumière du visage.
- source_word: כְּ/עָב
  choice: est comme un nuage annonçant
  rationale: La comparaison est conservée; « annonçant » explicite sobrement la relation naturelle entre le nuage et la pluie, afin d’éviter l’expression peu idiomatique « nuage de pluie tardive ».
- source_word: מַלְקוֹשׁ
  choice: la pluie de printemps
  rationale: Le terme désigne la pluie tardive de la saison agricole, qui tombe au printemps et favorise la maturation des récoltes.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation maintient les deux images poétiques concrètes du texte hébreu et évite le terme vieilli « pluie de l’arrière-saison » dans le corps du verset.
