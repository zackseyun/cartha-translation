    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et sur ses lèvres, comme un feu brûlant ». L’hébreu ne précise pas explicitement ce qui est comparé au feu; l’image peut évoquer le mal qu’il trame ou, plus largement, sa parole.
    reason: source_ambiguity
