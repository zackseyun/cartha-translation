review_pass:
  verdict: revise
  source_fidelity: Le premier membre rend fidèlement אִישׁ בְּלִיַּעַל כֹּרֶה רָעָה. Le second membre contient explicitement la comparaison « comme un feu brûlant » (כְאֵשׁ צָרָבֶת); la version proposée l’a conservée, mais « il » sans antécédent français clair rend la phrase inutilement ambiguë. Le texte hébreu est elliptique quant au sujet de la comparaison; il est préférable de ne pas l’identifier dogmatiquement, tout en formulant une phrase française complète.
  naturalness: « Un homme sans valeur » peut se comprendre, mais est moins idiomatique et moins expressif en français proverbial que « Un homme pervers ». « Creuse le mal » est calqué et assez opaque; « trame le mal » transmet naturellement l’image métaphorique de l’activité intentionnelle sans prétendre que le verbe signifie littéralement « tramer ». « Sur ses lèvres, il y a comme un feu brûlant » est une ellipse poétique française naturelle et évite un pronom sans référent net.
  terminology: « Homme pervers » rend convenablement בְּלִיַּעַל dans ce contexte, sans en faire un nom propre. « Mal » maintient l’amplitude de רָעָה. « Feu brûlant » est plus sémantiquement direct que « feu dévorant » pour צָרָבֶת, qui évoque ce qui brûle ou consume par chaleur; la note peut signaler les autres nuances.
  issues:
  - severity: medium
    issue: Pronom « il » sans antécédent clair dans le second membre
    rationale: Dans « et sur ses lèvres il est comme un feu dévorant », le pronom ne possède pas de référent grammatical naturel en français. L’hébreu est elliptique, mais le français peut conserver l’indétermination au moyen de « il y a », sans créer de rupture syntaxique.
  - severity: low
    issue: « Creuse le mal » est peu naturel en français moderne
    rationale: Bien que proche de l’image de כרה, cette expression sonne comme un calque. « Trame le mal » est idiomatique dans un proverbe et préserve l’idée de production active et préméditée; la note maintient l’image littérale de creuser.
  - severity: low
    issue: « Sans valeur » affaiblit la caractérisation morale de בְּלִיַּעַל
    rationale: Le terme désigne ici un individu vil, pervers ou scélérat, plutôt qu’une personne simplement dépourvue de valeur. « Pervers » rend mieux son orientation morale dans un registre proverbial moderne.
  revised_text: Un homme pervers trame le mal[a], et sur ses lèvres, il y a comme un feu brûlant[b].
