  text: אִ֣ישׁ בְּ֭לִיַּעַל כֹּרֶ֣ה רָעָ֑ה וְ/עַל שפתי/ו כְּ/אֵ֣שׁ צָרָֽבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/027.yaml
  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: fr
  text: Un homme pervers trame le mal[a], et sur ses lèvres, il y a comme un feu brûlant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « creuse le mal ». Ou « trame le malheur » ou « prépare un mauvais coup »; l’hébreu peut désigner tant le mal moral que le tort destructeur causé à autrui.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et sur ses lèvres, comme un feu brûlant ». L’hébreu ne précise pas explicitement ce qui est comparé au feu; l’image peut évoquer le mal qu’il trame ou, plus largement, sa parole.
    reason: source_ambiguity
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et présente ici un type humain; le français conserve cette précision grammaticale.
- source_word: בְּלִיַּעַל
  choice: sans valeur
  rationale: Dans ce contexte sapiential, le terme qualifie la perversité et l'indignité morale, sans fonctionner comme un nom propre.
- source_word: כֹּרֶה
  choice: creuse
  rationale: Le participe de כרה signifie littéralement « creuser »; conserver cette image exprime la manière dont l'homme prépare ou fait surgir le mal.
- source_word: רָעָה
  choice: le mal
  rationale: Le mot peut désigner le mal moral aussi bien que le malheur ou le tort causé; « le mal » garde cette portée large.
- source_word: שפתיו
  choice: ses lèvres
  rationale: La traduction littérale préserve l'image corporelle et poétique associée à la parole.
- source_word: כְאֵשׁ
  choice: comme un feu
  rationale: La préposition כְ marque explicitement une comparaison, qu'il convient de conserver.
- source_word: צָרָבֶת
  choice: dévorant
  rationale: Ce terme rare évoque une chaleur brûlante ou qui consume; « dévorant » est naturel en français avec « feu » et rend sa force destructrice.
- source_word: וְעַל
  choice: et sur
  rationale: Cette formulation respecte la coordination et la préposition du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La métaphore de l’action de creuser et l’image des lèvres sont maintenues. Le pronom « il » conserve l’ambiguïté et la tension syntaxique du second membre hébreu plutôt que de transformer explicitement les lèvres ou la parole en feu.
