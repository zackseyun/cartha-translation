revisions:
- from: Un homme sans valeur creuse le mal[a], et sur ses lèvres il est comme un feu dévorant[b].
  to: Un homme pervers trame le mal[a], et sur ses lèvres, il y a comme un feu brûlant[b].
  rationale: La révision corrige l’ambiguïté syntaxique non voulue du pronom français, améliore l’idiomaticité proverbiale et rend plus nettement la portée morale de בְּלִיַּעַל. Elle maintient l’ellipse et l’indétermination du texte hébreu dans le second membre, sans imposer que les lèvres, le mal ou les paroles soient le sujet précis de la comparaison.
