id: PRO.16.11
reference: Proverbs 16:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פֶּ֤לֶס וּ/מֹאזְנֵ֣י מִ֭שְׁפָּט לַֽ/יהוָ֑ה מַ֝עֲשֵׂ֗/הוּ כָּל אַבְנֵי כִֽיס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/011.yaml
  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: fr
  text: 'La balance et les balances justes appartiennent à Yahweh ;

    tous les poids du sac[a] sont son œuvre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes les pierres du sac ». Il s’agit de pierres calibrées utilisées comme poids pour les pesées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּלֶס
  choice: balance
  rationale: Le terme désigne ici un instrument de pesage. « Balance » est courant en français et maintient l’image du commerce équitable.
- source_word: וּמֹאזְנֵי מִשְׁפָּט
  choice: et les plateaux justes
  rationale: Le duel מֹאזְנַיִם évoque la balance, notamment ses deux plateaux, tandis que מִשְׁפָּט qualifie la pesée conforme à la justice. Cette formulation conserve le parallélisme sans répéter « balance ».
- source_word: לַיהוָה
  choice: appartiennent à Yahweh
  rationale: La préposition לְ exprime ici naturellement l’appartenance ou le domaine d’autorité. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: מַעֲשֵׂהוּ
  choice: sont son œuvre
  rationale: 'Cette expression garde la portée assez large de l’hébreu : les poids relèvent de ce que Yahweh fait, établit ou ordonne, sans réduire le propos à leur seule fabrication matérielle.'
- source_word: כָּל־אַבְנֵי כִיס
  choice: tous les poids du sac
  rationale: Littéralement, il s’agit de « toutes les pierres du sac », c’est-à-dire des pierres calibrées servant de poids. « Poids » rend clairement leur fonction dans ce contexte commercial.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme ; « Yahweh » préserve le nom personnel de l’alliance.
- issue: Portée de l’affirmation sur les instruments de pesage
  choice: Les mesures justes relèvent de l’autorité et de l’ordre moral de Yahweh.
  alternative: Yahweh a seulement fabriqué matériellement les poids.
  rationale: La présence de מִשְׁפָּט (« justice ») inscrit le verset dans le domaine moral du commerce honnête, tandis que « son œuvre » conserve l’ampleur et la tension de la formulation hébraïque.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Plateaux » rend concrètement le second terme de pesage et évite une répétition maladroite de « balance ». Le point-virgule marque le parallélisme des deux membres.
