  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: fr
  text: 'Celui qui est lent à la colère[a] vaut mieux qu’un homme puissant,

    et celui qui maîtrise son esprit[b] vaut mieux que celui qui prend une ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « patient » ; littéralement « long de narines », expression hébraïque signifiant être lent à se mettre en colère.
    reason: lexical_alternative
  - marker: b
    text: Ou « son tempérament » ou, de façon plus large, « se maîtriser » ; « son esprit » peut ici désigner la disposition intérieure ou les impulsions d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Cette tournure française naturelle conserve la forme comparative du proverbe hébreu, explicitée par les deux emplois de מִן (« que »).
- source_word: אֶרֶךְ אַפַּיִם
  choice: être lent à la colère
  rationale: L’expression hébraïque signifie littéralement « long de narines » et désigne celui qui tarde à se mettre en colère. Cette traduction en restitue précisément le sens idiomatique.
- source_word: מִגִּבּוֹר
  choice: qu’être un homme puissant
  rationale: גִּבּוֹר désigne un homme fort, puissant ou vaillant, souvent avec une nuance guerrière. « Homme puissant » garde l’étendue du terme sans le réduire à « guerrier ».
- source_word: וּמֹשֵׁל
  choice: et maîtriser
  rationale: 'Le participe décrit une disposition habituelle : exercer son autorité ou sa maîtrise. Dans ce contexte intérieur, « maîtriser » est naturel et fait ressortir le parallèle avec la prise d’une ville.'
- source_word: בְּרוּחוֹ
  choice: son esprit
  rationale: רוּחַ peut désigner l’esprit, le souffle ou la disposition intérieure. « Son esprit » reste proche de l’hébreu et préserve sa largeur de sens, tandis que la note indique des formulations plus interprétatives.
- source_word: מִלֹּכֵד עִיר
  choice: que prendre une ville
  rationale: לכד signifie saisir ou prendre, particulièrement dans un contexte militaire. « Prendre une ville » est l’expression française idiomatique pour sa conquête et maintient le contraste entre conquête extérieure et maîtrise intérieure.
theological_decisions:
- issue: Sens anthropologique de רוּחַ dans ce contexte sapiential
  choice: « son esprit », au sens de la disposition et des impulsions intérieures qu’une personne maîtrise
  alternative: « soi-même » comme paraphrase plus large, ou « son tempérament » comme interprétation plus étroite
  rationale: Le proverbe oppose la maîtrise de la vie intérieure à la conquête militaire. « Esprit » préserve l’étendue du terme hébreu sans le limiter à la colère ni l’élargir silencieusement à la personne entière.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative et le parallélisme poétique sont conservés ; le vocabulaire demeure accessible tout en maintenant l’ambiguïté de רוּחַ.
