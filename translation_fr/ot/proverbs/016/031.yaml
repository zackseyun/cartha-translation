source:
  edition: WLC
  text: עֲטֶ֣רֶת תִּפְאֶ֣רֶת שֵׂיבָ֑ה בְּ/דֶ֥רֶךְ צְ֝דָקָ֗ה תִּמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: fr
  text: Les cheveux blancs sont une couronne de gloire[b] ; ils se trouvent sur le chemin de la justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la voie de la justice ». L’image hébraïque du chemin désigne une manière de vivre caractérisée par la justice.'
    reason: lexical_alternative
  - marker: b
    text: Les cheveux blancs sont ici présentés comme honorables lorsqu’ils accompagnent une vie juste. Cette maxime de sagesse n’affirme pas que toute personne âgée est juste ni que toute personne juste atteindra nécessairement un âge avancé.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: Le nom désigne une couronne ou un ornement entourant la tête. « Couronne » conserve naturellement la métaphore honorifique.
- source_word: תִּפְאֶרֶת
  choice: gloire
  rationale: Le terme peut exprimer la beauté, la splendeur ou l’honneur. « Gloire » restitue le registre élevé de l’expression construite « couronne de gloire ».
- source_word: שֵׂיבָה
  choice: cheveux blancs
  rationale: Le nom évoque concrètement les cheveux blanchis et, par extension, la vieillesse. « Cheveux blancs » garde l’image hébraïque dans un français moderne et naturel.
- source_word: בְּדֶרֶךְ
  choice: sur le chemin
  rationale: Cette expression emploie l’image du chemin pour parler d’une conduite ou d’un parcours de vie. « Sur le chemin » préserve la métaphore et convient à l’usage français.
- source_word: צְדָקָה
  choice: justice
  rationale: Dans ce contexte sapientiel, le mot désigne une conduite conforme à ce qui est juste. « Justice » reste proche du terme hébreu sans réduire celui-ci à une simple qualité intérieure.
- source_word: תִּמָּצֵא
  choice: elle se trouve
  rationale: Le nifal de מצא signifie littéralement « être trouvé » ou « se trouver ». Cette formulation conserve l’ambiguïté entre le fait d’être rencontré et celui d’appartenir caractéristiquement à un parcours juste.
theological_decisions:
- issue: Portée interprétative du second membre
  choice: Présenter les cheveux blancs comme un honneur associé au chemin d’une vie juste, selon une maxime générale de sagesse.
  alternative: Comprendre le verset soit comme affirmant que toute vieillesse est honorable en elle-même, soit comme promettant sans exception que la justice garantit une longue vie.
  rationale: La formulation proverbiale exprime une relation générale sans imposer une garantie mécanique. La traduction littérale « elle se trouve sur le chemin de la justice » maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore concrète des cheveux blancs et celle du chemin sont conservées. Le pronom féminin « elle » reprend « une couronne de gloire », conformément à la structure poétique hébraïque.
