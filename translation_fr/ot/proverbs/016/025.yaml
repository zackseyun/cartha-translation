  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: fr
  text: Il y a une voie qui paraît droite à un homme, mais son aboutissement, ce sont des chemins de mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: voie
  rationale: « Voie » conserve l’image d’un itinéraire tout en évoquant naturellement une manière de vivre ou d’agir.
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: qui paraît droite à un homme
  rationale: Littéralement, la voie est « droite devant un homme » ; en français, cette formulation exprime naturellement le jugement favorable que l’homme porte sur elle sans affirmer qu’elle est réellement droite.
- source_word: אַחֲרִיתָהּ
  choice: son aboutissement
  rationale: Le terme désigne la fin, l’issue ou le résultat ultime de la voie ; « aboutissement » met en relief sa destination finale.
- source_word: דַּרְכֵי מָוֶת
  choice: des chemins de mort
  rationale: Le pluriel hébreu inattendu est conservé afin de préserver le contraste entre la voie unique telle qu’elle apparaît au départ et les chemins mortels auxquels elle aboutit.
theological_decisions:
- issue: La voie est-elle réellement droite ou seulement jugée droite par l’homme ?
  choice: « qui paraît droite à un homme »
  alternative: « droite devant un homme »
  rationale: Le contexte proverbial oppose l’évaluation humaine à l’issue mortelle. « Paraît » rend cette opposition implicite sans préciser la nature morale de l’erreur au-delà du texte.
- issue: Maintien du passage du singulier au pluriel
  choice: « une voie » puis « des chemins de mort »
  alternative: « un chemin de mort »
  rationale: Le changement de nombre appartient au texte hébreu et peut porter une tension poétique ou sémantique qu’il ne faut pas niveler.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « ce sont » permet de conserver naturellement le pluriel final de l’hébreu sans alourdir la phrase.
