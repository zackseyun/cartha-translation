source:
  edition: WLC
  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: fr
  text: La fureur d’un roi, ce sont des messagers de mort[a], mais un homme sage l’apaisera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « messagers de mort ». Le mot hébreu traduit par « messagers » peut aussi signifier « anges »; ici, il désigne probablement les agents envoyés par le roi.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu vient de la racine souvent traduite par « faire l’expiation ». Ici, il signifie apaiser ou détourner la fureur du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: fureur
  rationale: Le nom désigne une colère ardente. « Fureur » conserve la force et la gravité de l’hébreu tout en restant naturel en français.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Le sens concret est celui d’un monarque; « roi » préserve le cadre politique de la maxime.
- source_word: מַלְאֲכֵי מָוֶת
  choice: messagers de mort
  rationale: La traduction garde l’image frappante de la construction hébraïque. מַלְאָךְ peut désigner un messager humain ou un ange, mais le contexte royal favorise ici des agents du roi.
- source_word: וְאִישׁ חָכָם
  choice: mais un homme sage
  rationale: Le waw marque ici naturellement le contraste entre le péril provoqué par la colère royale et la réponse du sage. Le masculin singulier représentatif de l’hébreu est conservé.
- source_word: יְכַפְּרֶנָּה
  choice: l’apaisera
  rationale: Le suffixe féminin renvoie à la fureur. Dans ce contexte non cultuel, le piel de כפר exprime l’action de calmer ou détourner cette colère; le futur français convient à la portée générale de la maxime.
theological_decisions:
- issue: Faut-il rendre כפר par un terme cultuel lié à l’expiation ou par un terme non cultuel?
  choice: « l’apaisera »
  alternative: « fera l’expiation pour elle » ou « la détournera »
  rationale: Le contexte concerne la colère d’un roi et non un rite sacrificiel. « Apaisera » exprime ici le mieux l’idée de détourner la fureur sans importer une théologie cultuelle, tandis qu’une note signale le lien lexical avec le vocabulaire de l’expiation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La dislocation « La fureur d’un roi, ce sont… » permet de conserver le prédicat nominal hébreu et son image au pluriel sans produire une tournure artificielle. Les deux marqueurs de note figurent dans le texte.
