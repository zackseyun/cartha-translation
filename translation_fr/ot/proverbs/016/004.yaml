source:
  edition: WLC
  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: fr
  text: Yahweh a tout fait en vue de son but[a], même le méchant pour le jour du malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pour lui-même ». L’expression hébraïque est difficile et peut aussi être comprise ainsi : « Yahweh a tout fait pour lui-même. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour le jour du désastre » ou « pour un jour de calamité ». Ici, le terme traduit par « malheur » désigne une catastrophe ou une ruine, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: tout
  rationale: Le terme englobe ici la totalité de ce qui est envisagé. « Tout » est naturel en français et conserve la portée générale du proverbe.
- source_word: פָּעַל
  choice: a fait
  rationale: Le verbe peut signifier « faire », « accomplir » ou « œuvrer ». Avec Yahweh pour sujet et « tout » pour objet, « a fait » rend sobrement l’action divine sans la limiter explicitement à la création initiale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לַמַּעֲנֵהוּ
  choice: en vue de sa fin
  rationale: L’expression difficile peut évoquer ce qui répond à une chose, sa finalité ou ce qui lui convient. « En vue de sa fin » exprime l’orientation vers une issue déterminée, tandis que le possessif français laisse perceptible l’ambiguïté du suffixe hébreu.
- source_word: וְגַם
  choice: même
  rationale: 'La combinaison a une valeur d’extension emphatique : l’affirmation générale englobe jusqu’au méchant.'
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé au singulier désigne de façon représentative la personne méchante. Le singulier français suit cette formulation proverbiale.
- source_word: לְיוֹם רָעָה
  choice: pour le jour du malheur
  rationale: Dans ce contexte, רָעָה désigne une calamité ou un désastre, non le mal moral. « Le jour du malheur » conserve la formulation concise et l’idée d’une issue funeste.
theological_decisions:
- issue: Le rapport entre l’action souveraine de Yahweh, le méchant et le malheur
  choice: Le proverbe affirme que tout est orienté vers une fin, y compris le méchant vers le jour du malheur, sans préciser que Dieu serait l’auteur du mal moral.
  alternative: « Yahweh a tout fait pour lui-même, même le méchant pour le jour du malheur. »
  rationale: Le texte associe fortement la souveraineté divine et le sort du méchant, mais l’expression לַמַּעֲנֵהוּ demeure ambiguë. La traduction et la note conservent cette tension au lieu de trancher en faveur d’une formulation doctrinale plus explicite que l’hébreu.
translation_notes:
  register: Français international moderne, concis et proverbial. La tournure « en vue de sa fin » reste digne et intelligible tout en conservant l’ambiguïté réelle du possessif. Les marqueurs de notes suivent l’ordre normal [a], [b].
