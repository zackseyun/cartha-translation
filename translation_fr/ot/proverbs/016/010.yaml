revisions:
- from: Une sentence divine est sur les lèvres d’un roi[a] ; quand il juge, sa bouche ne trahit pas la justice[b].
  to: Une sentence divine est sur les lèvres d’un roi[a] ; dans ses jugements, sa bouche ne se montre pas infidèle[b].
  rationale: La révision conserve la lecture judiciaire positive de קֶסֶם et l'image des lèvres et de la bouche, mais rend plus directement le complément בְּמִשְׁפָּט comme cadre des décisions royales. Elle évite d'imposer comme seule lecture l'idée que la justice est l'objet direct de l'infidélité, tout en la préservant en note comme interprétation possible.
