    rationale: Le texte hébreu porte בְּמִשְׁפָּט (« dans/en matière de jugement ») avant « sa bouche ne commet pas d'infidélité ». « Ne trahit pas la justice » est une interprétation recevable, mais elle transforme un complément circonstanciel en objet et réduit une ambiguïté syntaxique à conserver.
  - severity: low
    issue: Portée de la note b
    rationale: La note actuelle ne signale pas l'alternative principale liée à בְּמִשְׁפָּט (« dans/en matière de jugement », « quand il juge ») et reprend l'interprétation de « justice » comme objet.
