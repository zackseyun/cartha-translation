  verdict: revise
  source_fidelity: 'Le premier membre rend bien la proposition nominale et le caractère général de « roi ». « Une sentence divine » est une contextualisation défendable de קֶסֶם, à condition de maintenir en note les sens lexicaux plus ordinaires. Dans le second membre, la traduction introduit cependant « la justice » comme objet de « trahit », alors que בְּמִשְׁפָּט se rattache plus directement au cadre de l''acte de juger : littéralement, « dans le jugement, sa bouche n''agit pas infidèlement/traîtreusement ».'
  naturalness: Le français est globalement naturel, sobre et proverbial. « Quand il juge, sa bouche ne trahit pas la justice » est fluide, mais explicite et resserre indûment la syntaxe hébraïque. « Dans le jugement, sa bouche ne commet pas d'infidélité » est plus proche, mais moins idiomatique ; « Dans ses jugements, sa bouche ne se montre pas infidèle » conserve une formulation française naturelle.
  terminology: « Sentence divine » convient au registre judiciaire et sapientiel. « Dans ses jugements » rend מִשְׁפָּט sans transformer ce terme en objet direct de l'infidélité. La note sur קֶסֶם doit présenter « divination » comme le sens courant et « oracle » comme autre possibilité, sans prétendre lever l'ambiguïté. La note b doit porter sur la possibilité de rendre בְּמִשְׁפָּט par « en matière de jugement » ou « quand il juge », plutôt que sur une paraphrase qui change sa relation syntaxique.
