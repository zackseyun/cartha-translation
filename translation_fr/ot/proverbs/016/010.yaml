source:
  edition: WLC
  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: fr
  text: Une sentence divine est sur les lèvres d’un roi[a] ; dans ses jugements, sa bouche ne se montre pas infidèle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne souvent la « divination » ; selon le contexte, il peut aussi désigner un « oracle ». Ici, « sentence divine » rend son emploi dans un contexte judiciaire.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le jugement » ; ou : « quand il juge ». L’expression peut aussi être comprise comme : « sa bouche ne trahit pas la justice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  choice: une sentence divine
  rationale: Le nom désigne souvent la divination ou une parole oraculaire. Ici, le parallélisme avec l’exercice de la justice appelle une formulation positive et judiciaire, tout en conservant la force d’une parole investie d’une autorité supérieure.
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: est sur les lèvres d’un roi
  rationale: Cette formulation conserve l’image locative de la proposition nominale hébraïque et la portée générale de l’absence d’article devant « roi ».
- source_word: בְּמִשְׁפָּט
  choice: quand il juge
  rationale: La préposition peut situer l’action dans le cadre ou au moment du jugement. Cette tournure française relie clairement le complément au verbe sans réduire מִשְׁפָּט à une notion abstraite.
- source_word: לֹא יִמְעַל
  choice: ne trahit pas
  rationale: Le verbe exprime l’infidélité, la déloyauté ou la transgression. « Ne trahit pas » rend naturellement l’idée d’une parole royale qui ne se montre pas infidèle à la justice.
- source_word: פִּיו
  choice: sa bouche
  rationale: Le terme concret est conservé, distinct des « lèvres » du premier membre, afin de reproduire la variation poétique hébraïque.
theological_decisions:
- issue: Faut-il donner à קֶסֶם son sens habituel de « divination » ou un sens positif adapté au jugement royal ?
  choice: « une sentence divine », compris comme une décision royale investie d’une autorité quasi oraculaire
  alternative: « la divination » ou « un oracle »
  rationale: Le second membre porte sur la fidélité à la justice et présente la parole judiciaire idéale du roi. Une traduction strictement négative évoquant une pratique occulte risquerait donc de contredire le parallélisme, mais l’ambiguïté lexicale authentique est signalée en note.
- issue: Rapport syntaxique de בְּמִשְׁפָּט
  choice: 'Le comprendre comme une indication de circonstance : « quand il juge »'
  alternative: « en matière de jugement » ou rattacher le terme à « la justice » comme objet de l’infidélité
  rationale: L’hébreu permet plusieurs nuances proches. La traduction choisie est naturelle et garde le cadre judiciaire, tandis que la note préserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure en deux membres et les images des « lèvres » et de la « bouche » sont conservées. « Sentence » est employé dans son sens judiciaire, encore courant et adapté au registre sapientiel.
