source:
  edition: WLC
  text: צוּף דְּ֭בַשׁ אִמְרֵי נֹ֑עַם מָת֥וֹק לַ֝/נֶּפֶשׁ וּ/מַרְפֵּ֥א לָ/עָֽצֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/024.yaml
  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: fr
  text: 'Les paroles agréables sont un rayon de miel[a] : douceur pour l’âme[b] et guérison pour les os.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du miel en rayon » ; l’expression hébraïque évoque le miel du rayon ou le rayon chargé de miel.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner la vie, la personne ou l’être intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: du miel en rayon
  rationale: L’expression désigne le miel contenu dans les rayons, ou le rayon chargé de miel. « Du miel en rayon » conserve l’image concrète et convient naturellement à l’idée de douceur.
- source_word: אִמְרֵי נֹעַם
  choice: les paroles agréables
  rationale: אִמְרֵי désigne des paroles ou propos, tandis que נֹעַם exprime l’agrément et le charme. « Paroles agréables » reste clair sans préciser indûment qu’elles seraient bienveillantes ou flatteuses.
- source_word: מָתוֹק
  choice: douces
  rationale: Le terme signifie « doux, sucré ». L’accord au féminin pluriel rattache naturellement l’adjectif aux « paroles », tout en maintenant la métaphore gustative du miel.
- source_word: לַנֶּפֶשׁ
  choice: pour l’être tout entier
  rationale: נֶפֶשׁ peut désigner la vie, la personne, le soi ou l’être vivant. Ici, « l’être tout entier » évite une lecture dualiste trop étroite de « l’âme » et rend la portée personnelle du terme.
- source_word: וּמַרְפֵּא
  choice: et guérissantes
  rationale: Le nom exprime la guérison, le remède ou ce qui procure la santé. Une formulation adjectivale coordonnée à « douces » produit un parallélisme français fluide sans réduire l’image à un médicament matériel.
- source_word: לָעָצֶם
  choice: pour les os
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel idiomatique français préserve l’image corporelle concrète.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: l’être tout entier
  alternative: l’âme
  rationale: Le mot hébreu ne désigne pas nécessairement une composante immatérielle distincte du corps. Le choix retenu conserve sa largeur sémantique, tandis qu’une note signale les autres traductions possibles.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé par « douces… et guérissantes », et les images concrètes du miel et des os sont maintenues.
