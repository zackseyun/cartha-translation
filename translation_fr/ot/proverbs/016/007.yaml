id: PRO.16.7
reference: Proverbs 16:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: fr
  text: Quand la conduite d’un homme plaît à Yahvé[a], il amène même ses ennemis à vivre en paix avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la conduite d’une personne » ; l’hébreu dit littéralement « les chemins d’un homme », avec une portée générale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: Quand … plaît à
  rationale: La préposition ב avec l’infinitif construit de רצה introduit ici une proposition temporelle ou circonstancielle. Cette tournure est naturelle en français et conserve l’idée d’agrément.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription du nom divin préserve son caractère de nom propre plutôt que de lui substituer un titre.
- source_word: דַּרְכֵי אִישׁ
  choice: la conduite d’un homme
  rationale: Le pluriel hébreu « chemins » désigne ici la manière de vivre. « Un homme » conserve le masculin singulier représentatif, tandis que la note en explicite la portée générique.
- source_word: גַּם
  choice: même
  rationale: 'Le terme a une valeur emphatique : l’effet s’étend jusque sur les ennemis de l’homme.'
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Rendu direct du nom pluriel avec suffixe possessif.
- source_word: יַשְׁלִם
  choice: il fait … vivre en paix
  rationale: Le hiphil de שלם exprime le fait de mettre ou maintenir en paix. La formulation française garde la valeur causative sans suggérer nécessairement une réconciliation intérieure complète.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: La préposition marque ici la relation dans laquelle la paix est établie.
theological_decisions:
- issue: Portée du masculin générique אִישׁ
  choice: un homme
  alternative: une personne
  rationale: Le texte hébreu emploie un masculin singulier à valeur représentative. Le texte le conserve et une note précise qu’il vise toute personne.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La transcription française usuelle du nom divin conserve le nom propre présent dans l’hébreu, sans le remplacer par un titre.
- issue: Nature de la paix causée par Dieu
  choice: il fait même vivre en paix avec lui ses ennemis
  alternative: il réconcilie même ses ennemis avec lui
  rationale: Le causatif de שלם indique que Dieu établit une situation de paix; « réconcilie » pourrait ajouter l’idée plus précise d’une restauration mutuelle des relations.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Conduite » rend idiomatiquement l’image hébraïque des « chemins » comme manière de vivre. Le parallélisme et la concision sont préservés.
