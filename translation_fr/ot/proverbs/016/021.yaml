  text: לַ/חֲכַם לֵ֭ב יִקָּרֵ֣א נָב֑וֹן וּ/מֶ֥תֶק שְׂ֝פָתַ֗יִם יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/021.yaml
  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: fr
  text: 'Le sage de cœur est appelé intelligent,

    et la douceur des lèvres augmente le savoir[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « augmente l’instruction » ou « accroît la force persuasive ». Le terme hébreu peut désigner l’apprentissage reçu, l’instruction ou l’effet persuasif d’un enseignement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: Celui qui est sage de cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de la sagesse tout en restant naturelle et compréhensible en français moderne.
- source_word: יִקָּרֵא
  choice: est appelé
  rationale: Le nifal exprime ici la manière dont cette personne est désignée ou reconnue. Le présent convient au caractère général du proverbe.
- source_word: נָבוֹן
  choice: perspicace
  rationale: Le terme désigne une personne douée de compréhension et de discernement. « Perspicace » rend cette qualité naturellement après « est appelé ».
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: et la douceur des lèvres
  rationale: La traduction conserve la métaphore poétique de la douceur et des lèvres, celles-ci représentant la parole.
- source_word: יֹסִיף
  choice: favorise
  rationale: Le hifil signifie littéralement « ajoute » ou « augmente ». Avec « apprentissage », « favorise » exprime naturellement en français l’effet accru produit par une parole agréable.
- source_word: לֶקַח
  choice: l’apprentissage
  rationale: Le mot peut désigner ce qui est reçu par l’enseignement, l’instruction ou l’effet persuasif de la parole. « Apprentissage » convient au contexte sans exclure l’idée de réception efficace.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle et les images hébraïques du cœur, de la douceur et des lèvres sont conservées; la note maintient l’ambiguïté de לֶקַח.
