source:
  edition: WLC
  text: אִם נָבַ֥לְתָּ בְ/הִתְנַשֵּׂ֑א וְ/אִם זַ֝מּ֗וֹתָ יָ֣ד לְ/פֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
translation:
  language: fr
  text: Si tu t’es conduit en insensé en t’élevant toi-même, ou si tu as tramé quelque chose[a], mets la main sur ta bouche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conçu un projet »; le verbe hébreu peut désigner le fait de méditer, de concevoir ou de tramer quelque chose, souvent avec une nuance négative.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la main à la bouche »; cette expression appelle à garder le silence et à se retenir de parler.'
    reason: idiom_explanation
lexical_decisions:
- source_word: נָבַלְתָּ
  choice: tu t’es conduit en insensé
  rationale: Le verbe נבל exprime ici une conduite insensée, voire honteuse, plutôt qu’un simple manque d’intelligence. Cette tournure conserve la portée morale du terme.
- source_word: בְהִתְנַשֵּׂא
  choice: en t’élevant toi-même
  rationale: L’infinitif hitpael de נשׂא a une valeur réfléchie et désigne ici le fait de se hausser ou de s’exalter soi-même.
- source_word: זַמּוֹתָ
  choice: tu as tramé quelque chose
  rationale: Le verbe זמם signifie concevoir ou préparer un projet, souvent avec une nuance négative. « Tramé quelque chose » rend cette nuance sans préciser un objet que l’hébreu ne nomme pas.
- source_word: יָד לְפֶה
  choice: mets la main sur ta bouche
  rationale: La formulation conserve l’image concrète de l’hébreu tout en exprimant clairement l’appel à se taire et à se retenir.
- source_word: אִם ... וְאִם
  choice: Si… ou si
  rationale: Les deux propositions présentent deux éventualités apparentées; « ou si » est naturel en français et rend cette structure conditionnelle.
theological_decisions: []
