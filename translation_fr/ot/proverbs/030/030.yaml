source:
  edition: WLC
  text: לַ֭יִשׁ גִּבּ֣וֹר בַּ/בְּהֵמָ֑ה וְ/לֹא יָ֝שׁ֗וּב מִ/פְּנֵי כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/030.yaml
  text: the lion[a], mighty among beasts, and does not turn back before any.
translation:
  language: fr
  text: le lion[a], puissant parmi les animaux, qui ne recule devant rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un lion, puissant parmi les animaux ». L’hébreu emploie un terme poétique pour le lion et un terme collectif large pour le monde animal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: le lion
  rationale: Terme hébreu poétique désignant le lion. Bien que l’article ne soit pas exprimé, le français emploie naturellement « le lion » pour présenter l’espèce comme figure emblématique dans cette série proverbiale.
- source_word: גִּבּוֹר
  choice: puissant
  rationale: Le mot évoque la force et la vaillance. « Puissant » conserve la tonalité élevée sans donner au contexte une coloration exclusivement militaire.
- source_word: בַּבְּהֵמָה
  choice: parmi les animaux
  rationale: La préposition ב marque ici la place ou la comparaison au sein du monde animal. « Animaux » rend le terme collectif בְּהֵמָה dans son sens large et reste naturel en français moderne.
- source_word: וְלֹא יָשׁוּב
  choice: qui ne recule
  rationale: שׁוּב signifie littéralement revenir ou faire demi-tour; dans ce contexte, « ne recule » exprime naturellement le refus de se retirer tout en conservant l’image du mouvement en arrière.
- source_word: מִפְּנֵי כֹל
  choice: devant rien
  rationale: L’expression signifie qu’il ne se retire face à aucun adversaire ou obstacle. La tournure française « ne recule devant rien » garde la portée générale de כֹל sans préciser indûment s’il s’agit de personnes, d’animaux ou de dangers.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et proverbial. La relative « qui ne recule devant rien » assure une formulation naturelle tout en préservant le parallélisme descriptif de l’hébreu.
