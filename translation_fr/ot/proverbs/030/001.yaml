id: PRO.30.1
reference: Proverbs 30:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דִּבְרֵ֤י אָג֥וּר בִּן יָקֶ֗ה הַ/מַּ֫שָּׂ֥א נְאֻ֣ם הַ֭/גֶּבֶר לְ/אִֽיתִיאֵ֑ל לְ/אִ֖יתִיאֵ֣ל וְ/אֻכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/001.yaml
  text: 'The words of Agur son of Jakeh[a], the oracle: the declaration of the man to Ithiel[b], to Ithiel and Ucal.'
translation:
  language: fr
  text: 'Paroles d’Agour, fils de Jaké[a], l’oracle : déclaration de l’homme à Ithiel[b], à Ithiel et Oukal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Paroles d’Agour, fils de Jaké, de Massa », si הַמַּשָּׂא est compris comme un nom de lieu ou de tribu plutôt que comme « l’oracle ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou peut-être, avec une autre vocalisation des derniers mots : « Je suis épuisé, ô Dieu, je suis épuisé, ô Dieu, et à bout », plutôt que d’y lire les noms Ithiel et Oukal.'
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Paroles de
  rationale: Le pluriel construit de דָּבָר introduit ici un ensemble de propos. « Paroles de » reste direct et convient à une suscription sapientielle.
- source_word: אָגוּר
  choice: Agour
  rationale: Nom propre transcrit selon les usages naturels du français.
- source_word: בִּן יָקֶה
  choice: fils de Yaqé
  rationale: בִּן est le marqueur généalogique ordinaire. Le nom יָקֶה est transcrit « Yaqé » afin de rendre approximativement sa forme hébraïque en français.
- source_word: הַמַּשָּׂא
  choice: l’oracle
  rationale: מַשָּׂא peut désigner un oracle ou une proclamation solennelle. Ce sens convient à la suscription, tandis que l’interprétation comme nom propre « Massa » demeure possible et est signalée en note.
- source_word: נְאֻם
  choice: déclaration
  rationale: Ce nom formulaire introduit une parole solennelle. « Déclaration » en conserve la force sans archaïsme excessif.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: גֶּבֶר désigne couramment un homme, parfois avec une nuance de vigueur. Le contexte ne permet pas d’imposer cette nuance.
- source_word: לְאִיתִיאֵל
  choice: à Itiel
  rationale: La préposition לְ est rendue dans son sens relationnel le plus direct. La répétition du nom est conservée comme dans le texte hébreu.
- source_word: וְאֻכָל
  choice: et Oukal
  rationale: Le texte massorétique vocalise ce terme comme un nom propre. Une autre vocalisation permettant une proposition verbale est conservée en note.
theological_decisions:
- issue: Interprétation de הַמַּשָּׂא dans la suscription
  choice: 'Nom commun : « l’oracle »'
  alternative: 'Nom propre ou désignation d’origine : « de Massa »'
  rationale: L’article défini favorise ici la lecture comme nom commun, mais l’identification à Massa est ancienne et plausible. La note maintient cette ambiguïté textuelle sans la trancher silencieusement.
- issue: Interprétation des derniers mots לְאִיתִיאֵל לְאִיתִיאֵל וְאֻכָל
  choice: 'Noms propres : « à Itiel, à Itiel et Oukal »'
  alternative: 'Proposition verbale telle que : « Je suis épuisé, ô Dieu, je suis épuisé, ô Dieu, et à bout »'
  rationale: Le corps du texte suit la vocalisation massorétique, qui présente Itiel et Oukal comme des noms. La lecture verbale, fondée sur une autre vocalisation des consonnes, donne un sens très différent et mérite donc d’être explicitement signalée.
translation_notes:
  register: Français international actuel, digne et accessible. La structure dense de la suscription hébraïque et la répétition d’« Itiel » sont conservées. Les noms sont transcrits sous des formes lisibles en français.
