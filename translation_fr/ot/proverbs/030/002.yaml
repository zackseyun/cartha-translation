source:
  edition: WLC
  text: כִּ֤י בַ֣עַר אָנֹכִ֣י מֵ/אִ֑ישׁ וְ/לֹֽא בִינַ֖ת אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/002.yaml
  text: For I am more brutish than anyone[a], and I do not have human understanding.
translation:
  language: fr
  text: Car je suis plus stupide qu’un homme[a], et je n’ai pas l’intelligence d’un être humain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Car je suis trop stupide pour être un homme, et je n’ai pas l’intelligence d’un homme. »'
    reason: La relation de בַּעַר à מֵאִישׁ peut être comprise soit comme un comparatif (« plus stupide qu’un homme »), soit comme l’expression d’une incapacité à être véritablement humain.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication donnée par le locuteur et conserve naturellement la valeur connective du terme hébreu.
- source_word: בַעַר
  choice: plus stupide
  rationale: Exprime le manque profond de raison ou d’intelligence, avec le ton fortement dépréciatif du propos. « Stupide » est direct, actuel et compréhensible, sans l’obscurité possible de « bestial ».
- source_word: אָנֹכִי
  choice: je suis
  rationale: Le pronom indépendant est explicite et appuyé; le français exige ici la copule devant l’adjectif.
- source_word: מֵאִישׁ
  choice: que quiconque
  rationale: Rend naturellement la lecture comparative de מִן dans ce contexte. La construction peut aussi se comprendre comme « trop stupide pour être un homme »; cette ambiguïté est conservée en note.
- source_word: וְלֹא
  choice: et je n’ai pas
  rationale: Traduit la coordination et la négation tout en intégrant idiomatiquement la construction possessive avec לִי.
- source_word: בִינַת
  choice: l’intelligence
  rationale: Désigne ici la faculté de comprendre ou de discerner; « intelligence » convient au parallélisme et au vocabulaire sapientiel.
- source_word: אָדָם
  choice: d’un être humain
  rationale: Le mot a ici une portée anthropologique générique. « Être humain » évite de restreindre le sens aux hommes de sexe masculin.
- source_word: לִי
  choice: je n’ai pas
  rationale: La tournure hébraïque exprimant la possession est rendue par la construction française idiomatique « avoir ».
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’intelligence d’un être humain
  alternative: l’intelligence d’un homme
  rationale: Dans ce contexte, אָדָם renvoie à l’humanité ou à la condition humaine en général, non exclusivement au sexe masculin.
- issue: Rapport syntaxique de בַעַר avec מֵאִישׁ
  choice: plus stupide que quiconque
  alternative: trop stupide pour être un homme
  rationale: La lecture comparative est retenue dans le texte principal, mais l’hébreu permet aussi une lecture exprimant l’indignité ou l’incapacité d’être véritablement humain; la note maintient cette ambiguïté sans la trancher artificiellement.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire volontairement rude préserve l’intense autodépréciation du locuteur, tandis que la note signale l’autre analyse possible de la comparaison.
