  text: שְׁ֭פַנִּים עַ֣ם לֹא עָצ֑וּם וַ/יָּשִׂ֖ימוּ בַ/סֶּ֣לַע בֵּיתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/026.yaml
  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
translation:
  language: fr
  text: Les damans[a] sont un peuple sans force, mais ils établissent leur demeure dans le rocher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hyrax »; traditionnellement « lapins » ou « blaireaux des rochers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַנִּים
  choice: damans
  rationale: Le terme désigne très probablement les damans des rochers. « Damans » est l’appellation zoologique française actuelle et convient au contexte rocheux.
- source_word: עַם
  choice: un peuple
  rationale: Le nom signifie littéralement « peuple » et présente ici ces animaux comme un groupe organisé; conserver cette image respecte la formulation proverbiale.
- source_word: לֹא עָצוּם
  choice: sans force
  rationale: Cette expression rend naturellement l’absence de puissance physique évoquée par l’hébreu, sans affaiblir le contraste avec leur manière avisée de se protéger.
- source_word: וַיָּשִׂימוּ
  choice: ils établissent
  rationale: Le verbe signifie littéralement « placer, mettre ». Avec « demeure », « établir » exprime en français idiomatique l’installation de leur habitat tout en restant proche de l’image source.
- source_word: בַסֶּלַע
  choice: dans le rocher
  rationale: Le singulier hébreu désigne le rocher, l’escarpement ou la falaise. « Dans le rocher » préserve le singulier et souligne le refuge rocheux.
- source_word: בֵּיתָם
  choice: leur demeure
  rationale: Littéralement « leur maison »; « demeure » s’applique naturellement à l’habitat d’animaux tout en conservant la métaphore domestique.
