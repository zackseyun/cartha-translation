  variant: modern international French
source:
  edition: WLC
  text: אַל תַּלְשֵׁ֣ן עֶ֭בֶד אֶל אדנ/ו פֶּֽן יְקַלֶּלְ/ךָ֥ וְ/אָשָֽׁמְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/010.yaml
  text: Do not slander a servant to his master[a], lest he curse you and you become guilty.
translation:
  language: fr
  text: Ne calomnie pas un esclave auprès de son maître, de peur qu’il ne te maudisse et que tu ne te rendes coupable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּלְשֵׁן
  choice: calomnie
  rationale: Le verbe évoque l’usage de la langue contre quelqu’un, notamment par une accusation malveillante. « Calomnie » exprime clairement la faute morale sans réduire le sens à un simple signalement.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans ce contexte social, le terme désigne un subordonné lié à un maître. « Esclave » rend explicitement sa condition et sa vulnérabilité, mieux que « serviteur ».
- source_word: אֶל אדניו
  choice: auprès de son maître
  rationale: La construction indique que la parole nuisible est portée devant le maître de l’esclave. « Auprès de son maître » est naturel en français et exprime bien le destinataire de la calomnie.
- source_word: פֶּן
  choice: de peur que
  rationale: La conjonction introduit une conséquence indésirable envisagée comme avertissement. « De peur que » conserve cette nuance et le ton proverbial.
- source_word: יְקַלֶּלְךָ
  choice: il ne te maudisse
  rationale: Le piel de קלל signifie ici prononcer une malédiction contre quelqu’un, et non simplement l’insulter. « Maudisse » en garde la gravité.
- source_word: וְאָשָׁמְתָּ
  choice: tu ne te rendes coupable
  rationale: Le verbe אשם exprime le fait d’encourir une culpabilité ou une responsabilité. La tournure pronominale est idiomatique en français et préserve l’idée de conséquence.
theological_decisions:
- issue: Nature de la conséquence exprimée par וְאָשָׁמְתָּ
  choice: que tu ne te rendes coupable
  alternative: que tu n’en portes la faute
  rationale: Le texte affirme l’entrée dans un état de culpabilité sans préciser le mécanisme exact reliant la malédiction à cette culpabilité. La traduction conserve cette tension plutôt que d’ajouter une explication théologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure négative « de peur que… ne… et que… ne… » est soutenue mais courante et permet de conserver la concision ainsi que l’enchaînement du texte hébreu.
