review_pass:
  verdict: revise
  source_fidelity: Le sens de l’interdiction, le complément « à ses paroles », la conséquence introduite par פֶּן et la réprimande divine sont correctement rendus. Le nifal וְנִכְזָבְתָּ exprime le fait d’être manifesté comme faux ou menteur; « convaincu de mensonge » déplace légèrement le sens vers une condamnation pour un acte de mensonge.
  naturalness: « N’ajoute rien à ses paroles » et « de peur qu’il ne te reprenne » sont naturels dans un registre moderne soutenu. « Être convaincu de mensonge » est moins idiomatique et moins précis ici que « être reconnu menteur ».
  terminology: Les pronoms conservent avec justesse le lien contextuel avec Dieu au verset précédent sans explicitation excessive. « Reprendre » convient à יוֹכִיחַ. « Reconnu menteur » rend de manière claire la dimension personnelle de כזב, tandis que la note conserve l’alternative plus large « démontré faux ».
  issues:
  - severity: medium
    issue: « convaincu de mensonge »
    rationale: Cette expression évoque surtout le fait d’être déclaré coupable d’avoir menti. Le passif hébreu peut bien impliquer l’exposition d’un menteur, mais il décrit plus directement une personne reconnue comme mensongère/fausse. « Reconnu menteur » est à la fois plus naturel et plus proche.
