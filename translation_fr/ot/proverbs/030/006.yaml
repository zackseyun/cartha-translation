  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
translation:
  language: fr
  text: N’ajoute rien à ses paroles, de peur qu’il ne te reprenne et que tu ne sois reconnu menteur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « démontré faux » ou « montré comme menteur ».
    reason: Alternative lexicale pour le nifal de כזב, qui peut désigner le fait d’être manifesté comme faux ou mensonger.
lexical_decisions:
- source_word: אַל תּוֹסְףְּ
  choice: N’ajoute rien
  rationale: אַל avec l’imparfait exprime une interdiction. « N’ajoute rien » rend naturellement en français l’idée de ne rien ajouter au contenu visé.
- source_word: עַל דְּבָרָיו
  choice: à ses paroles
  rationale: Avec יסף, עַל se rend idiomatiquement par « à ». « Ses paroles » conserve le pronom hébreu et le lien contextuel avec la parole de Dieu au verset 5.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française actuelle et digne exprime la conséquence négative que l’avertissement cherche à éviter.
- source_word: יוֹכִיחַ בְּךָ
  choice: il ne te reprenne
  rationale: Le hifil de יכח peut désigner l’action de réprimander, reprendre ou convaincre d’erreur. « Reprendre » convient ici à une intervention divine dirigée contre celui qui ajoute à ses paroles.
- source_word: וְנִכְזָבְתָּ
  choice: et que tu ne sois convaincu de mensonge
  rationale: Le nifal de כזב exprime le fait d’être reconnu ou démontré faux, mensonger. Cette formulation garde la force passive et le poids moral du terme.
theological_decisions:
- issue: Référent de « ses » et sujet implicite de « il »
  choice: Conserver les pronoms; dans le contexte, ils renvoient à Dieu mentionné au verset 5.
  alternative: Expliciter « aux paroles de Dieu » et « Dieu ne te reprenne ».
  rationale: Le contexte rend le référent naturel, mais l’hébreu emploie des pronoms. Les conserver évite une explicitation absente du verset lui-même tout en maintenant le lien contextuel.
- issue: Portée de וְנִכְזָבְתָּ
  choice: « convaincu de mensonge »
  alternative: « reconnu menteur » ou « trouvé faux »
  rationale: Le choix principal maintient l’ambiguïté entre la fausseté de l’affirmation et la culpabilité personnelle du locuteur, sans atténuer la gravité de l’avertissement.
translation_notes:
  register: Français international moderne, concis et digne. La construction « de peur que… ne » est soutenue sans être archaïque. Le pronom de troisième personne préserve la formulation hébraïque et son ancrage dans le verset précédent.
