source:
  edition: WLC
  text: וְ/לֹֽא לָמַ֥דְתִּי חָכְמָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים אֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
translation:
  language: fr
  text: Je n’ai pas appris la sagesse, et je ne connais pas le savoir du Saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des saints » ou « des êtres saints ». En hébreu, le terme est au pluriel, mais, dans les Proverbes, il peut désigner Dieu comme « le Saint ».'
    reason: Lecture alternative due à l’ambiguïté du pluriel hébreu.
lexical_decisions:
- source_word: לָמַדְתִּי
  choice: je n’ai pas appris
  rationale: Le parfait à la première personne exprime ici l’absence d’un apprentissage acquis dont le résultat demeure; le passé composé convient naturellement en français.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rendu habituel dans les Proverbes pour la sagesse pratique et morale.
- source_word: דַעַת
  choice: la connaissance
  rationale: Le nom désigne normalement la connaissance et forme ici un lien lexical avec le verbe ידע.
- source_word: קְדֹשִׁים
  choice: du Saint
  rationale: Bien que la forme hébraïque soit plurielle, dans la littérature sapientielle elle peut désigner Dieu comme « le Saint », notamment en Proverbes 9.10. L’ambiguïté réelle est conservée en note.
- source_word: אֵדָע
  choice: je n’ai pas
  rationale: La tournure idiomatique « je n’ai pas la connaissance » rend en français naturel l’affirmation présente portée par le verbe « connaître », sans reproduire la répétition peu naturelle « connaître la connaissance ».
theological_decisions:
- issue: קְדֹשִׁים désigne-t-il Dieu au singulier ou des êtres/personnes saints au pluriel ?
  choice: 'Référence singulière à Dieu : « le Saint »'
  alternative: « les saints » ou « les êtres saints »
  rationale: Le parallèle de Proverbes 9.10 favorise une référence divine, mais la morphologie plurielle permet réellement l’autre lecture; celle-ci est donc signalée sans être effacée.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé, tandis que la répétition littérale « connaître la connaissance » est rendue de façon idiomatique.
