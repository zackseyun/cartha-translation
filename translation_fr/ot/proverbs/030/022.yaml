  source_fidelity: 'Le texte rend fidèlement la structure elliptique de la liste : תַּחַת est bien repris par « sous », עֶבֶד par « esclave », et les deux circonstances introduites par כִּי sont correctement rendues par « quand ». « Il devient roi » est une interprétation recevable de יִמְלֹךְ (« il règne / devient roi »), et la note signale justement l’alternative. « Il est rassasié de pain » restitue précisément יִשְׂבַּע לָחֶם.'
  naturalness: Le français est concis, clair et d’un registre proverbial moderne. La répétition de « sous » et la forme fragmentaire sont appropriées, puisque le verset dépend de l’énoncé-cadre du verset 21. « Un insensé » demeure naturel dans ce registre et conserve la portée éthique du terme.
  terminology: « Esclave » rend de façon nette le statut social impliqué par עֶבֶד et convient au contraste social du proverbe. « Insensé » est un bon équivalent de נָבָל, sans le réduire à un manque d’intelligence. « Pain » préserve l’image littérale de לָחֶם; la note indique correctement son emploi possible au sens plus large de nourriture.
