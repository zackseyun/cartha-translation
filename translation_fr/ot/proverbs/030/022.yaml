source:
  edition: WLC
  text: תַּֽחַת עֶ֭בֶד כִּ֣י יִמְל֑וֹךְ וְ֝/נָבָ֗ל כִּ֣י יִֽשְׂבַּֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/022.yaml
  text: under a servant when he becomes king[a], and a fool when he is filled with bread[b],
translation:
  language: fr
  text: sous un esclave quand il devient roi[a], et sous un insensé quand il est rassasié de pain[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand il règne ».
    reason: lexical_alternative
  - marker: b
    text: Le mot « pain » peut aussi désigner plus largement la nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sous
  rationale: Dans la série des versets 21–23, le mot introduit chacune des situations sous lesquelles la terre tremble. « Sous » conserve cette image et la structure concise de l’énumération.
- source_word: עֶבֶד
  choice: esclave
  rationale: Le terme désigne un serviteur en condition de dépendance, voire un esclave. Ici, « esclave » fait clairement ressortir le renversement social au cœur du proverbe.
- source_word: כִּי
  choice: quand
  rationale: La conjonction introduit ici la circonstance dans laquelle se produit la situation évoquée.
- source_word: יִמְלֹךְ
  choice: il devient roi
  rationale: Le verbe peut signifier régner ou devenir roi. Cette formulation naturelle souligne l’accession inattendue au pouvoir, sans exclure le sens de régner.
- source_word: נָבָל
  choice: insensé
  rationale: Dans la littérature de sagesse, le mot qualifie une personne dépourvue de discernement moral et social, et non simplement d’intelligence. « Insensé » restitue cette portée dans un registre digne.
- source_word: יִשְׂבַּע
  choice: il est rassasié
  rationale: Le verbe exprime le fait d’être repu ou d’avoir mangé à satiété. « Est rassasié » conserve l’état décrit sans préciser s’il s’agit de satisfaction ou d’excès.
- source_word: לָחֶם
  choice: pain
  rationale: « Pain » traduit l’image concrète de l’hébreu, tout en pouvant naturellement représenter la nourriture en général.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La syntaxe fragmentaire et la répétition de « sous » sont conservées parce que le verset poursuit l’énumération commencée au verset 21. Le choix d’« insensé » garde la dimension morale du terme hébreu sans recourir à une formulation archaïque.
