base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
translation:
  language: fr
  text: 'de peur que, rassasié, je ne te renie et ne dise : « Qui est Yahweh ? » ou que, devenu pauvre, je ne vole et ne profane[a] le nom de mon Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « et je saisisse le nom de mon Dieu ». Le sens peut être : « fasse un mauvais usage du nom de mon Dieu » ou « déshonore le nom de mon Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française introduit naturellement la conséquence redoutée exprimée par l’hébreu.
- source_word: אֶשְׂבַּע
  choice: rassasié
  rationale: Le verbe désigne le fait d’être repu ou comblé; « rassasié » conserve l’image concrète de l’abondance.
- source_word: כִחַשְׁתִּי
  choice: je ne te renie
  rationale: Dans ce contexte, le verbe exprime le rejet de Dieu, explicité par la question provocatrice qui suit.
- source_word: מִי יְהוָה
  choice: Qui est Yahweh ?
  rationale: La formulation directe préserve la question rhétorique et rend le nom divin יהוה par « Yahweh ».
- source_word: אִוָּרֵשׁ
  choice: devenu pauvre
  rationale: Le niphal décrit ici l’entrée dans la pauvreté; cette expression forme un parallèle naturel avec « rassasié ».
- source_word: גָנַבְתִּי
  choice: je ne vole
  rationale: Rendu direct et courant du verbe hébreu.
- source_word: תָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: je ne profane le nom de mon Dieu
  rationale: L’expression signifie littéralement « saisir le nom de mon Dieu », mais semble idiomatiquement évoquer une atteinte portée à ce nom. « Profaner » exprime ce déshonneur sans le limiter à un mauvais usage verbal.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Rend directement le nom avec son suffixe possessif à la première personne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération conserve le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- issue: Sens de וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: profane le nom de mon Dieu
  alternative: fasse un mauvais usage du nom de mon Dieu
  rationale: Le sens exact de l’expression, littéralement « saisir le nom », est difficile. Le contexte suggère que le vol jetterait le déshonneur sur le nom de Dieu; une note maintient visible l’incertitude lexicale.
translation_notes:
  register: Français moderne, digne et accessible. Le subjonctif après « de peur que… ne » exprime les deux conséquences redoutées; le « ne » est explétif et n’ajoute pas une négation indépendante.
