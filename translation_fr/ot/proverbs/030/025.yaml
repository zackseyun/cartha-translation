  variant: modern international French
source:
  edition: WLC
  text: הַ֭/נְּמָלִים עַ֣ם לֹא עָ֑ז וַ/יָּכִ֖ינוּ בַ/קַּ֣יִץ לַחְמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
translation:
  language: fr
  text: Les fourmis sont un peuple sans force, pourtant elles préparent leur nourriture en été.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּמָלִים
  choice: les fourmis
  rationale: Le nom pluriel défini désigne ici les fourmis comme une classe; l’article défini est naturel en français.
- source_word: עַם
  choice: un peuple
  rationale: Ce choix conserve la métaphore frappante qui présente les fourmis comme un groupe organisé, sans réduire le terme à « créatures ».
- source_word: לֹא עָז
  choice: sans force
  rationale: Cette formulation rend directement la négation de l’adjectif « fort, puissant » tout en restant naturelle en français et sans accentuer jusqu’à « faibles ».
- source_word: וַיָּכִינוּ
  choice: elles préparent
  rationale: Le hiphil de כון signifie ici « rendre prêt, préparer »; ce choix évite l’interprétation plus précise « amassent ».
- source_word: בַקַּיִץ
  choice: en été
  rationale: Expression temporelle idiomatique en français pour désigner la saison où se fait la préparation.
- source_word: לַחְמָם
  choice: leur nourriture
  rationale: לֶחֶם peut désigner le pain au sens propre ou, plus largement, la nourriture; le sens général convient ici au contexte des fourmis.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La métaphore « un peuple » est maintenue, ainsi que le contraste proverbial entre l’absence de force et la prévoyance, marqué naturellement par « pourtant ».
