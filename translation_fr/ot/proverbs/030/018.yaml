  yaml_path: translation/ot/proverbs/030/018.yaml
  text: 'Three things are too wonderful for me[a]; four I do not understand:'
translation:
  language: fr
  text: 'Il y a trois choses qui sont trop merveilleuses pour moi, et quatre que je ne comprends pas :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: Il y a trois choses
  rationale: La formule numérique hébraïque signifie littéralement « trois, elles sont ». Le français naturel explicite « choses » et emploie « il y a » sans perdre la structure de l'énumération.
- source_word: נִפְלְאוּ מִמֶּנִּי
  choice: qui me dépassent
  rationale: Le verbe פלא associé à מִמֶּנִּי décrit des réalités extraordinaires qui dépassent la capacité de compréhension du locuteur. « Me dépassent » rend naturellement en français à la fois l'émerveillement implicite et l'incompréhensibilité.
- source_word: וְאַרְבַּע
  choice: et même quatre
  rationale: La conjonction est conservée, tandis que « même » fait entendre la progression rhétorique propre à la formule numérique x/x+1, sans transformer le quatre en simple addition.
- source_word: לֹא יְדַעְתִּים
  choice: que je ne comprends pas
  rationale: Bien que la forme signifie littéralement « je ne les connais pas », ידע exprime ici la saisie intellectuelle. Le pronom objet est naturellement repris en français par le relatif « que ».
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La formulation conserve la progression « trois… quatre » et le deux-points qui annonce l'énumération des versets suivants.
