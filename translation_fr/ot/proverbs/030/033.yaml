  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
translation:
  language: fr
  text: Car presser le lait produit du beurre[a], presser le nez fait couler du sang[b], et presser la colère provoque une querelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du lait caillé »; le terme hébreu peut désigner de façon générale un produit laitier obtenu par agitation ou coagulation.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu fait ici un jeu de mots : « presser le nez » et « presser la colère » emploient deux formes d’un même mot, qui peut désigner le nez ou, par extension, la colère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’exhortation précédente et conserve naturellement le lien logique.
- source_word: מִיץ
  choice: presser / attiser
  rationale: Le terme désigne l’action de presser ou de comprimer. « Presser » maintient la répétition dans les deux premières propositions; « attiser » exprime idiomatiquement l’action exercée sur la colère dans la troisième.
- source_word: חָלָב
  choice: le lait
  rationale: Équivalent direct et naturel.
- source_word: יוֹצִיא
  choice: produit / fait couler / provoque
  rationale: La forme causative exprime un résultat. La variation française rend naturellement chacun des trois effets tout en préservant la structure proverbiale.
- source_word: חֶמְאָה
  choice: du beurre
  rationale: Désigne un produit laitier épais obtenu par agitation ou coagulation; « beurre » est traditionnel et convient à l’image, sans exclure « lait caillé ».
- source_word: אַף
  choice: le nez
  rationale: Le sens corporel concret est requis puisque la pression fait couler du sang.
- source_word: דָם
  choice: du sang
  rationale: Équivalent direct.
- source_word: אַפַּיִם
  choice: la colère
  rationale: Le mot lié aux narines est couramment employé comme expression de la colère. Le rendre par « colère » communique le sens idiomatique visé.
- source_word: רִיב
  choice: une querelle
  rationale: Le nom désigne un conflit ou une dispute; « querelle » est clair, courant et adapté au parallélisme.
