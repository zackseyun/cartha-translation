source:
  edition: WLC
  text: דּ֭וֹר טָה֣וֹר בְּ/עֵינָ֑י/ו וּ֝/מִ/צֹּאָת֗/וֹ לֹ֣א רֻחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/012.yaml
  text: There is a generation that is pure in its own eyes[b][a], yet is not washed from its filth.
translation:
  language: fr
  text: Il y a une génération qui est pure à ses propres yeux[a], mais qui n’est pas lavée de son ordure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est propre à ses propres yeux ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner l’ordure, les immondices ou les excréments ; l’image est volontairement crue.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: génération
  rationale: Le nom désigne couramment une génération et, dans la série des versets 11 à 14, un type collectif de personnes. « Génération » conserve le sens lexical et la reprise rhétorique.
- source_word: טָהוֹר
  choice: pure
  rationale: Le terme peut évoquer la pureté rituelle ou morale. « Pure » garde cette amplitude et forme un contraste net avec l’absence de lavage.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: Cette expression idiomatique indique le jugement que le groupe porte sur lui-même. Le possessif s’accorde avec le nom collectif « génération ».
- source_word: וּמִצֹּאָתוֹ
  choice: de ses ordures
  rationale: צֹאָה peut désigner la saleté, les immondices ou les excréments. « Ordures » conserve une image répugnante et concrète sans limiter artificiellement le propos au sens physique.
- source_word: לֹא רֻחָץ
  choice: n’est pas lavée
  rationale: La forme passive ne précise pas l’agent. Cette formulation maintient le contraste entre la pureté revendiquée et l’impureté réelle.
theological_decisions:
- issue: Portée de l’image de pureté
  choice: Conserver un langage pouvant évoquer à la fois la pureté rituelle et la pureté morale.
  alternative: Préciser qu’il s’agit exclusivement d’une pureté morale ou exclusivement d’une pureté rituelle.
  rationale: Le contexte favorise une portée morale, mais les mots hébreux reposent sur une image de propreté qui n’impose pas une seule catégorie. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et proverbial. La tournure « Il est une génération » donne une dignité sentencieuse tout en restant intelligible ; « à ses propres yeux » préserve l’idiome hébreu.
