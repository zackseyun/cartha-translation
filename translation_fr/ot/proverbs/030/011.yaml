source:
  edition: WLC
  text: דּ֭וֹר אָבִ֣י/ו יְקַלֵּ֑ל וְ/אֶת אִ֝מּ֗/וֹ לֹ֣א יְבָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/011.yaml
  text: There is a generation that curses its father and does not bless its mother[a][b].
translation:
  language: fr
  text: Il y a une génération qui maudit son père et ne bénit pas sa mère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « ne bénit pas » peut aussi évoquer le fait de ne pas dire du bien de sa mère ou de ne pas l’honorer.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: génération
  rationale: Le nom désigne couramment une génération ou une catégorie de personnes partageant un même trait. Dans la série de Proverbes 30.11-14, sa répétition caractérise un type humain tout en maintenant le refrain littéraire.
- source_word: אָבִיו
  choice: son père
  rationale: Le suffixe hébreu est au masculin singulier. En français, « son père » convient naturellement au nom collectif singulier « génération » et conserve la relation individuelle exprimée par l’hébreu.
- source_word: יְקַלֵּל
  choice: maudit
  rationale: Le piel de קלל signifie ici maudire ou couvrir de mépris. « Maudit » restitue directement la gravité de l’acte et forme un contraste net avec « bénit ».
- source_word: וְאֶת
  choice: et
  rationale: וְ est rendu par « et » ; אֶת, marqueur de l’objet direct défini, n’a pas d’équivalent lexical à traduire en français.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Le suffixe masculin singulier renvoie au sujet collectif. « Sa mère » est naturel en français et préserve la relation au singulier.
- source_word: לֹא יְבָרֵךְ
  choice: ne bénit pas
  rationale: Le piel de ברך signifie normalement « bénir ». Le présent convient à la formulation proverbiale française et maintient l’antithèse lexicale avec « maudit », sans réduire le sens à la seule notion d’honneur.
theological_decisions: []
translation_notes:
  register: Formulation française moderne, concise et sentencieuse. La tournure « Il est une génération » conserve le refrain solennel de la série tout en restant intelligible. Les possessifs singuliers suivent à la fois la morphologie hébraïque et le genre grammatical de « génération ».
