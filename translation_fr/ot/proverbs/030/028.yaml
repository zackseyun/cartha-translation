  text: שְׂ֭מָמִית בְּ/יָדַ֣יִם תְּתַפֵּ֑שׂ וְ֝/הִ֗יא בְּ/הֵ֣יכְלֵי מֶֽלֶךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/028.yaml
  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
translation:
  language: fr
  text: Le lézard, tu peux le saisir avec les mains[a], pourtant il se trouve dans les palais des rois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’araignée ». Le mot hébreu שְׂמָמִית est rare et son sens incertain. De nombreuses traductions traditionnelles disent « araignée », tandis que d’autres y voient une sorte de lézard ou de gecko.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  choice: lézard
  rationale: Le terme hébreu, rare, est d’identification incertaine. Un petit reptile capable de pénétrer dans les demeures convient bien au contraste du verset. « Lézard » reste plus général que « gecko » et évite une précision non assurée.
- source_word: בְּיָדַיִם
  choice: avec les mains
  rationale: La préposition exprime ici le moyen; cette formulation naturelle conserve l’image concrète de l’hébreu sans ajouter un possessif absent du texte.
- source_word: תְּתַפֵּשׂ
  choice: tu peux le saisir
  rationale: La forme verbale est à la deuxième personne du masculin singulier et signifie saisir ou attraper. « Tu peux le saisir » rend naturellement l’adresse générique et la facilité apparente suggérée par le contraste.
- source_word: וְהִיא
  choice: pourtant il se trouve
  rationale: La conjonction introduit ici un contraste entre la petitesse ou la vulnérabilité de l’animal et sa présence dans des résidences royales. Le masculin français s’accorde avec « lézard ».
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  choice: dans les palais des rois
  rationale: Cette expression idiomatique conserve le pluriel « palais » et rend la portée générale de « roi » dans cette maxime, sans la limiter à un souverain précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure détachée « Le lézard, tu peux… » conserve la vivacité proverbiale et l’adresse directe de l’hébreu. L’incertitude zoologique est explicitement préservée en note.
