  text: a strutting rooster[a], a he-goat[b], and a king against whom there is no rising up.
translation:
  language: fr
  text: 'un coq qui se pavane[a], ou un bouc,

    et un roi contre qui nul ne se soulève[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare et son sens incertain. On propose aussi « un lévrier », « un cheval de guerre » ou, plus littéralement, « celui qui est bien ceint aux reins ».
    reason: lexical_alternative
  - marker: b
    text: 'La formule hébraïque est difficile et son analyse est incertaine. Une autre compréhension possible est : « un roi dont l’armée est avec lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  choice: un coq qui se pavane
  rationale: L’expression, littéralement liée aux « reins », est rare et incertaine. Dans le contexte d’êtres à l’allure majestueuse, « un coq qui se pavane » rend naturellement en français l’image d’un animal au port fier, sans masquer l’incertitude lexicale, signalée en note.
- source_word: אוֹ
  choice: ou
  rationale: Le texte massorétique porte explicitement la conjonction « ou ». La traduction la conserve, même si plusieurs versions lissent l’énumération avec « et ».
- source_word: תָיִשׁ
  choice: un bouc
  rationale: Le terme hébreu désigne spécifiquement le mâle de la chèvre ; « bouc » est le terme français naturel et précis.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: Traduction directe du nom courant désignant le roi.
- source_word: אַלְקוּם עִמּוֹ
  choice: contre qui personne ne se dresse
  rationale: Cette lecture comprend la formule difficile comme exprimant l’absence de soulèvement contre le roi. Elle donne un français clair tout en conservant en note l’autre interprétation majeure, celle d’un roi accompagné de son armée ou de son peuple.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et concret. « Se pavane » restitue l’allure fière suggérée par le contexte ; « se dresse » conserve la force de l’image d’un soulèvement contre le roi. Le « ou » du texte massorétique est maintenu plutôt que régularisé en « et ».
