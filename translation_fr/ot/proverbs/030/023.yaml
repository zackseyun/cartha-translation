review_pass:
  verdict: revise
  source_fidelity: La première proposition rend bien le nifal de בעל comme un changement d’état (« elle se marie »). Dans la seconde, « prend la place de » est une interprétation contextuellement possible de תירש, mais elle fixe un sens que le verbe ירש laisse plus ouvert (« hériter de », « prendre possession de », avec l’idée possible de succéder à la maîtresse). La note actuelle aggrave le problème en donnant « prend possession de sa maîtresse », formulation qui ne rend pas correctement l’objet du verbe en français.
  naturalness: Le français est sobre, fluide et convient à la forme proverbiale. « Esclave » et « sa maîtresse » sont naturels dans ce contexte domestique ancien. « Hérite de sa maîtresse » est un peu plus littéral et moins idiomatique, mais une note explicative permet de conserver l’ambiguïté du texte source sans imposer l’interprétation de la substitution de statut.
  terminology: « Femme détestée », « esclave » et « maîtresse » rendent de façon juste le registre social et les termes hébreux. La répétition de « sous » est acceptable puisque le verset reste la continuation de la construction de 30.21.
  issues:
  - severity: medium
    issue: La traduction principale de תירש est trop interprétative.
    rationale: « Prend la place de sa maîtresse » peut refléter le contexte, mais le verbe hébreu conserve une gamme incluant héritage et prise de possession. Il est préférable de ne pas décider seul du mécanisme précis de ce renversement social.
  - severity: medium
    issue: La note donne une pseudo-littéralité inexacte.
    rationale: « Prend possession de sa maîtresse » suggère que la personne elle-même est l’objet possédé. La note doit plutôt présenter « prend la place de sa maîtresse » comme une interprétation contextuelle, ou préciser qu’il s’agit de son statut ou de ses biens.
