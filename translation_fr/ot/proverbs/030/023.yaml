  text: under a hated woman when she is married[a], and a female servant when she inherits from her mistress.
translation:
  language: fr
  text: 'sous une femme détestée quand elle se marie,

    et sous une esclave quand elle hérite de sa maîtresse[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prend la place de sa maîtresse ». Le verbe hébreu peut signifier « hériter de » ou « prendre possession de » ; dans ce contexte, il peut évoquer l’accès au statut de la maîtresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sous
  rationale: Conserve l’image du poids sous lequel la terre tremble dans le contexte de Proverbes 30.21-23 et rattache naturellement ce verset à la phrase commencée au verset 21.
- source_word: שְׂנוּאָה
  choice: femme détestée
  rationale: 'Le participe passif exprime plus fortement qu’un simple manque d’affection : cette femme est haïe, rejetée ou détestée. « Détestée » garde cette force en français courant.'
- source_word: כִּי
  choice: quand
  rationale: Dans les deux membres, כִּי introduit la circonstance où survient le renversement de situation. « Quand » rend clairement cette valeur temporelle et situationnelle.
- source_word: תִבָּעֵל
  choice: elle se marie
  rationale: Le nifal de בעל décrit ici l’entrée dans l’état matrimonial. « Elle se marie » exprime naturellement en français ce changement de statut sans alourdir la formulation.
- source_word: שִׁפְחָה
  choice: esclave
  rationale: Le mot désigne une femme de condition servile, et non simplement une employée de maison. « Esclave » rend explicitement ce statut social.
- source_word: תִירַשׁ
  choice: elle prend la place de
  rationale: Le verbe signifie habituellement « hériter de », « prendre possession de » ou « déposséder ». Avec « sa maîtresse » comme objet, il évoque vraisemblablement une esclave qui accède à la place ou au statut de celle-ci. La note conserve l’ambiguïté lexicale.
- source_word: גְּבִרְתָּהּ
  choice: sa maîtresse
  rationale: Le nom désigne la femme qui exerce l’autorité sur l’esclave dans la maisonnée. « Maîtresse » est ici le terme français le plus concis et le plus précis.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme des deux propositions introduites par « sous » puis « quand » est conservé. « Femme détestée » maintient la vigueur du texte hébreu, tandis que « esclave » rend sans euphémisme la condition servile.
