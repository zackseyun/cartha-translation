  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
translation:
  language: fr
  text: Les criquets n’ont pas de roi, pourtant ils sortent tous par groupes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils sortent tous répartis en divisions »; le terme hébreu peut évoquer des groupes ou des sections distinctes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent direct et naturel du nom hébreu désignant un monarque.
- source_word: אֵין לָאַרְבֶּה
  choice: Les criquets n’ont pas
  rationale: La construction existentielle avec ל exprime ici la possession; le collectif singulier hébreu est rendu naturellement par un pluriel français.
- source_word: אַרְבֶּה
  choice: les criquets
  rationale: Le nom singulier a un sens collectif dans ce contexte, confirmé par כֻּלּוֹ; le pluriel est idiomatique en français.
- source_word: וַיֵּצֵא
  choice: pourtant ils sortent
  rationale: Le verbe singulier s’accorde avec le collectif hébreu. « Pourtant » explicite sobrement le contraste contextuel entre l’absence de roi et l’organisation du groupe.
- source_word: חֹצֵץ
  choice: en groupes bien ordonnés
  rationale: Le participe évoque une répartition en divisions ou en formations. Cette formulation française exprime l’organisation visible sans imposer une image militaire trop précise.
- source_word: כֻּלּוֹ
  choice: tous
  rationale: Le suffixe singulier renvoie à l’ensemble collectif des criquets; « tous » restitue naturellement cette totalité.
