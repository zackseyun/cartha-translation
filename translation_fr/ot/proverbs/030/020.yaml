source:
  edition: WLC
  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
translation:
  language: fr
  text: 'Telle est la conduite d’une femme adultère : elle mange, s’essuie la bouche[a] et dit : « Je n’ai rien fait de mal. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image de quelqu’un qui mange puis s’essuie la bouche évoque une faute commise avec désinvolture et dont on efface les traces, comme si elle n’avait laissé aucune marque.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « Je n’ai commis aucun mal. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Telle est
  rationale: Introduit l’analogie avec ce qui précède et donne en français une transition naturelle, sans réduire le lien comparatif à une simple conclusion.
- source_word: דֶּרֶךְ
  choice: conduite
  rationale: Le mot désigne ici la manière habituelle d’agir. « Conduite » exprime clairement cet emploi sapientiel, tandis que « chemin » serait moins naturel dans cette phrase française.
- source_word: אִשָּׁה מְנָאָפֶת
  choice: une femme adultère
  rationale: Le participe féminin décrit une femme qui commet l’adultère. Cette formulation moderne conserve le sens moral sans employer l’étiquette plus marquée « adultère » comme nom.
- source_word: אָכְלָה
  choice: elle mange
  rationale: Le parfait hébreu présente une action caractéristique de manière vive. Le présent français convient au caractère général et proverbial de l’énoncé.
- source_word: וּמָחֲתָה פִיהָ
  choice: s’essuie la bouche
  rationale: Rend directement l’image hébraïque tout en adoptant la tournure idiomatique française avec le pronom réfléchi.
- source_word: וְאָמְרָה
  choice: et dit
  rationale: Le présent maintient la série d’actions caractéristiques et la concision du proverbe.
- source_word: לֹא פָעַלְתִּי אָוֶן
  choice: Je n’ai rien fait de mal
  rationale: Formulation française naturelle qui conserve l’idée d’un acte accompli et nié. אָוֶן peut désigner le mal, la faute ou l’iniquité, sans qu’il soit nécessaire de préciser davantage ici.
theological_decisions:
- issue: Portée morale de אָוֶן
  choice: de mal
  alternative: d’inique / aucun méfait
  rationale: Le choix conserve la condamnation morale tout en restant naturel et compréhensible. La note signale une traduction plus formelle sans durcir le terme au-delà de sa gamme sémantique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève garde le rythme proverbial; « conduite » explicite naturellement l’emploi figuré de דֶּרֶךְ, tandis que l’image concrète du repas et de la bouche est préservée.
