id: PRO.30.4
reference: Proverbs 30:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
translation:
  language: fr
  text: Qui est monté au ciel et en est redescendu ? Qui a recueilli le vent dans le creux de ses mains ? Qui a enveloppé les eaux dans un vêtement ? Qui a établi toutes les extrémités de la terre ? Quel est son nom[a], et quel est le nom de son fils[c] ? Si tu le sais[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cieux ». Le mot hébreu שָׁמַיִם est de forme plurielle.
    reason: lexical_alternative
  - marker: b
    text: Ou « car tu le sais » ou « tu le sais sûrement ». L’hébreu peut exprimer ici un défi ironique.
    reason: lexical_alternative
  - marker: c
    text: L’interprétation chrétienne a souvent reconnu une portée particulière à l’expression « son fils », mais le texte hébreu lui-même n’identifie pas explicitement ce fils.
    reason: cross_reference
lexical_decisions:
- source_word: עָלָה ... וַיֵּרַד
  choice: est monté au ciel et en est redescendu
  rationale: Rend naturellement en français la séquence verbale accomplie et conserve le mouvement vertical. « En est redescendu » explicite seulement la reprise idiomatique du lieu déjà nommé.
- source_word: שָׁמַיִם
  choice: ciel
  rationale: Le pluriel morphologique hébreu désigne ici de façon idiomatique le ciel ou domaine céleste ; le singulier est le tour français le plus naturel. « Les cieux » reste possible.
- source_word: אָסַף רוּחַ
  choice: a recueilli le vent
  rationale: Dans cette série d’images cosmiques avec les eaux et la terre, רוּחַ désigne vraisemblablement le vent. « Recueillir » exprime l’action de rassembler et s’accorde avec l’image des mains creusées.
- source_word: בְּחָפְנָיו
  choice: dans le creux de ses mains
  rationale: Le terme évoque les mains jointes ou creusées servant à contenir quelque chose. Cette formulation est plus précise que « dans ses mains » et évite « dans ses poings », qui suggérerait des mains fermées.
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  choice: a enveloppé les eaux dans un vêtement
  rationale: צָרַר exprime l’action de serrer, lier ou envelopper ; שִׂמְלָה désigne un vêtement, souvent extérieur. La traduction préserve l’image sans la préciser au-delà du texte.
- source_word: הֵקִים כָּל אַפְסֵי אָרֶץ
  choice: a établi toutes les extrémités de la terre
  rationale: « Établir » restitue le sens de mettre fermement en place ; « les extrémités de la terre » conserve l’expression cosmographique hébraïque.
- source_word: מַה שְּׁמוֹ
  choice: Quel est son nom
  rationale: Traduction directe et idiomatique de l’interrogation hébraïque.
- source_word: וּמַה שֶּׁם בְּנוֹ
  choice: et quel est le nom de son fils
  rationale: Conserve explicitement « fils » et ne précise pas son identité, conformément au texte source.
- source_word: כִּי תֵדָע
  choice: Si tu le sais !
  rationale: Dans ce contexte de défi rhétorique, כִּי peut avoir une valeur conditionnelle. La tournure française garde l’ironie et l’adresse au singulier sans transformer la proposition en affirmation certaine.
theological_decisions:
- issue: Identité du « fils »
  choice: Conserver « son fils » sans identifier celui-ci dans le corps du texte.
  alternative: Lire cette expression de manière christologique ou comme une simple composante du défi portant sur l’identité du souverain cosmique.
  rationale: L’hébreu mentionne bien un fils, mais ne l’identifie pas. La traduction maintient donc l’ouverture du texte ; une note signale la réception chrétienne sans l’introduire dans le verset.
- issue: Force de כִּי תֵדָע
  choice: Rendre la formule par « Si tu le sais ! » comme défi ironique.
  alternative: « Car tu le sais » ou « Tu le sais sûrement ! »
  rationale: La lecture conditionnelle convient à la succession de questions impossibles et préserve l’ambiguïté de la particule, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions successives gardent leur rythme rhétorique. Le tutoiement correspond à la deuxième personne du singulier hébraïque. Les appels de note suivent immédiatement les éléments concernés, et « Si tu le sais ! » privilégie la lecture conditionnelle retenue par la révision philologique tout en documentant l’autre possibilité.
