  text: שְׁ֭תַּיִם שָׁאַ֣לְתִּי מֵ/אִתָּ֑/ךְ אַל תִּמְנַ֥ע מִ֝מֶּ֗/נִּי בְּ/טֶ֣רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/007.yaml
  text: 'Two things I have asked of you[a]; do not withhold them from me before I die:'
translation:
  language: fr
  text: 'Je t’ai demandé deux choses[a] ; ne me les refuse pas avant que je meure :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Deux [choses] je t’ai demandées. » Le mot « choses » est sous-entendu en hébreu et précisé par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם
  choice: deux choses
  rationale: Le numéral féminin « deux » est employé elliptiquement pour désigner deux demandes, précisées au verset suivant. L’ajout de « choses » est naturel en français et reste signalé en note.
- source_word: שָׁאַלְתִּי
  choice: j’ai demandé
  rationale: Le qal accompli à la première personne peut exprimer une demande déjà formulée qui demeure actuelle ; le passé composé convient naturellement au contexte de prière.
- source_word: מֵאִתָּךְ
  choice: je t’ai demandé
  rationale: La préposition marque la personne à qui la demande est adressée. La construction française directe avec « demander à quelqu’un » exige ici le pronom indirect « t’ ».
- source_word: אַל תִּמְנַע
  choice: ne me les refuse pas
  rationale: La négation avec l’inaccompli exprime une requête pressante. Avec une chose sollicitée, « refuser quelque chose à quelqu’un » rend naturellement l’idée de ne pas retenir ou empêcher son octroi.
- source_word: מִמֶּנִּי
  choice: me
  rationale: Avec « refuser », le français rend la relation marquée par מן au moyen du complément indirect « me » plutôt que par un calque « de moi ».
- source_word: בְּטֶרֶם אָמוּת
  choice: avant que je meure
  rationale: La locution temporelle signifie « avant que », suivie en français standard du subjonctif « je meure ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Ne me les refuse pas » est plus idiomatique que « ne les retiens pas loin de moi », tout en conservant la demande directe. Le deux-points maintient le lien avec l’énumération du verset suivant.
