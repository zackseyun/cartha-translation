  text: אַרְבָּ֣עָה הֵ֭ם קְטַנֵּי אָ֑רֶץ וְ֝/הֵ֗מָּה חֲכָמִ֥ים מְחֻכָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/024.yaml
  text: 'Four are small on the earth[a], yet they are exceedingly wise:'
translation:
  language: fr
  text: 'Il y a sur la terre quatre petits êtres, et pourtant ils sont extrêmement sages[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « sages, rendus sages » ; il s’agit d’une expression emphatique signifiant « très sages » ou « extrêmement sages ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: Il y en a quatre
  rationale: Le cardinal ouvre l’énumération. Cette tournure française naturelle conserve la brièveté de la formule numérique tout en formant une proposition complète.
- source_word: קְטַנֵּי אָרֶץ
  choice: petits sur la terre
  rationale: Littéralement « petits de/sur la terre ». La formulation garde la valeur adjectivale et n’ajoute pas « créatures », terme seulement implicite dans le contexte.
- source_word: וְהֵמָּה
  choice: et pourtant ils
  rationale: La conjonction et le pronom indépendant soulignent ici le contraste entre leur petitesse et leur sagesse.
- source_word: חֲכָמִים
  choice: sages
  rationale: Traduction habituelle dans la littérature de sagesse, appropriée au thème du proverbe.
- source_word: מְחֻכָּמִים
  choice: extrêmement sages
  rationale: Le participe pual, juxtaposé à « sages », forme une expression emphatique. « Extrêmement sages » en restitue naturellement l’intensité en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « Il y en a quatre » est idiomatique sans préciser prématurément la nature des quatre êtres, que les versets suivants identifieront.
