  terminology: « Sages » et « extrêmement sages » rendent correctement le vocabulaire sapientiel et son intensification. « Petits êtres » explicite seulement le référent animé qu’implique le contexte immédiat, sans imposer une espèce ou une interprétation doctrinale.
