  source_fidelity: 'Le sens de l’hébreu est bien rendu : le verset introduit quatre êtres de petite taille et souligne, par une formulation intensive (« sages, rendus sages »), leur sagesse exceptionnelle. Le contraste rendu par « pourtant » est contextuellement justifié. Une légère révision améliore la restitution de קְטַנֵּי אָרֶץ, dont « petits sur la terre » est grammaticalement possible mais peu idiomatique en français.'
