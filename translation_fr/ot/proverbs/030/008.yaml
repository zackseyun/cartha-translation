  text: שָׁ֤וְא וּֽ/דְבַר כָּזָ֡ב הַרְחֵ֬ק מִמֶּ֗/נִּי רֵ֣אשׁ וָ֭/עֹשֶׁר אַל תִּֽתֶּן לִ֑/י הַ֝טְרִיפֵ֗/נִי לֶ֣חֶם חֻקִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
translation:
  language: fr
  text: Éloigne de moi la fausseté et les paroles mensongères[a] ; ne me donne ni pauvreté ni richesse ; nourris-moi du pain qui m’est destiné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les propos trompeurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le pain de ma part fixée » ; autres traductions possibles : « ma portion de pain » ou « mon pain quotidien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: la fausseté
  rationale: Dans son parallélisme avec דְבַר כָּזָב, le terme désigne ici ce qui est faux ou trompeur, plutôt que la seule vanité ou futilité.
- source_word: דְבַר כָּזָב
  choice: les paroles mensongères
  rationale: L’expression signifie littéralement « parole de mensonge ». Le pluriel français exprime naturellement la catégorie générale des propos mensongers sans en modifier le sens.
- source_word: הַרְחֵק מִמֶּנִּי
  choice: Éloigne de moi
  rationale: L’impératif causatif demande que la fausseté soit mise à distance du locuteur. Cette formulation reste directe et naturelle dans une prière.
- source_word: רֵאשׁ וָעֹשֶׁר
  choice: pauvreté ni richesse
  rationale: Ces deux noms forment un contraste économique net. La construction française « ni… ni… » rend naturellement la négation hébraïque portant sur l’ensemble.
- source_word: הַטְרִיפֵנִי
  choice: nourris-moi
  rationale: Le causatif de טרף a ici le sens de fournir la nourriture nécessaire. « Nourris-moi » conserve la forme concrète et personnelle de la demande.
- source_word: לֶחֶם חֻקִּי
  choice: du pain qui m’est attribué
  rationale: La formulation garde l’image du pain et rend חֹק comme une part fixée ou attribuée, sans importer automatiquement la formule néotestamentaire « pain quotidien ».
theological_decisions:
- issue: Sens de לֶחֶם חֻקִּי dans la demande de subsistance
  choice: la part de nourriture attribuée ou appropriée au demandeur
  alternative: mon pain quotidien
  rationale: Le contexte oppose pauvreté et richesse et demande une provision mesurée. « Le pain qui m’est attribué » préserve cette idée de part fixée tout en laissant ouverte la périodicité de cette provision.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs gardent le caractère direct de la prière ; le rythme ternaire et le contraste entre pauvreté et richesse sont préservés.
