  text: שְׁלֹשָׁ֣ה הֵ֭מָּה מֵיטִ֣יבֵי צָ֑עַד וְ֝/אַרְבָּעָ֗ה מֵיטִ֥בֵי לָֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/029.yaml
  text: 'There are three that are stately in stride[a], even four that are stately in walking:'
translation:
  language: fr
  text: 'Il y en a trois dont la démarche est remarquable[a], et quatre dont la marche l’est aussi :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui excellent dans leur manière de marcher ». L’expression hébraïque désigne une démarche particulièrement belle ou impressionnante.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: Il y en a trois
  rationale: Cette tournure française naturelle rend la formule numérique qui introduit une série dans la littérature de sagesse.
- source_word: מֵיטִיבֵי צָעַד
  choice: dont la démarche est remarquable
  rationale: Le participe de יטב qualifie ici une manière de se mouvoir particulièrement réussie ou impressionnante, sans notion de bonté morale; « démarche » exprime le mouvement des pas.
- source_word: וְאַרְבָּעָה
  choice: quatre
  rationale: La juxtaposition française conserve la progression proverbiale de trois à quatre; le second nombre précise et amplifie le premier.
- source_word: מֵיטִבֵי לָכֶת
  choice: qui marchent avec allure
  rationale: Cette formulation rend le parallélisme sans répétition pesante et traduit l'idée d'une manière de marcher belle, assurée ou impressionnante.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste concrète et fluide, tout en préservant le parallélisme ainsi que la progression numérique « trois… quatre ».
