  text: לַֽ/עֲלוּקָ֨ה שְׁתֵּ֥י בָנוֹת֮ הַ֤ב הַ֥ב שָׁל֣וֹשׁ הֵ֭נָּה לֹ֣א תִשְׂבַּ֑עְנָה אַ֝רְבַּ֗ע לֹא אָ֥מְרוּ הֽוֹן׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/015.yaml
  text: 'The leech has two daughters: “Give[a], give.” Three things are never satisfied; four never say[c][b], “Enough.”'
translation:
  language: fr
  text: 'La sangsue a deux filles : « Donne ! Donne ! »[a] Il y a trois choses qui ne sont jamais rassasiées, quatre qui ne disent jamais : « Assez ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Encore ! Encore ! » Le cri répété peut exprimer plus explicitement leur demande insatiable.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quatre qui ne disent pas : “C’en est assez.” » Le dernier mot hébreu signifie habituellement « richesse »; son sens précis dans ce contexte est discuté, mais il est souvent compris comme une expression de suffisance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲלוּקָה
  choice: La sangsue
  rationale: עֲלוּקָה désigne la sangsue. Le ל préfixé introduit probablement le thème (« quant à la sangsue »), ce que le français idiomatique peut rendre directement par « La sangsue ».
- source_word: שְׁתֵּי בָנוֹת
  choice: a deux filles
  rationale: La proposition hébraïque est sans verbe; « a » est ajouté pour former une phrase française naturelle, tandis que « filles » conserve l’image du texte.
- source_word: הַב הַב
  choice: Donne ! Donne !
  rationale: La répétition exprime une demande insistante. « Donne ! Donne ! » garde la brièveté du cri hébreu sans l’interpréter d’emblée comme « Encore ! Encore ! ».
- source_word: שָׁלוֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה
  choice: Il y en a trois qui ne sont jamais rassasiées
  rationale: Cette formulation naturelle conserve la construction numérique et le féminin pluriel, qui anticipe les réalités énumérées au verset suivant.
- source_word: אַרְבַּע לֹא אָמְרוּ הוֹן
  choice: 'quatre qui ne disent jamais : « Assez ! »'
  rationale: Dans ce contexte, הוֹן fonctionne vraisemblablement comme une expression de suffisance plutôt que dans son sens nominal courant de « richesse ». « Assez ! » exprime clairement l’insatiabilité.
