base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
translation:
  language: fr
  text: L’œil qui se moque d’un père et méprise l’obéissance due à une mère[a] — les corbeaux du ravin[b] l’arracheront à coups de bec, et les petits de l’aigle[c] le mangeront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ordre d’une mère » ou « l’enseignement d’une mère ». Le mot hébreu est rare et désigne probablement l’obéissance ou l’attention due à la mère.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire par « les corbeaux de la vallée », « de l’oued » ou « du lit du torrent ».
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut désigner un aigle ou un vautour ; il est traditionnellement traduit par « aigle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: L’œil
  rationale: Le singulier concret « l’œil » conserve l’image frappante du texte hébreu et introduit naturellement le sujet proverbial en français.
- source_word: תִּלְעַג
  choice: se moque
  rationale: Le verbe exprime la moquerie et le mépris. « Se moque » est actuel, clair et fidèle à cette attitude de dérision.
- source_word: לְאָב
  choice: d’un père
  rationale: L’hébreu ne porte aucun suffixe possessif explicite. L’indéfini préserve donc la portée générale du proverbe sans ajouter « son ».
- source_word: וְתָבוּז
  choice: et méprise
  rationale: Le verbe בוז marque le dédain ou le mépris; « méprise » en restitue directement la force morale.
- source_word: לִיקֲּהַת אֵם
  choice: l’obéissance due à une mère
  rationale: יקהת est un terme rare et discuté. Dans ce contexte, il semble désigner l’obéissance ou l’attention que l’on doit à sa mère. L’ajout de « due » rend cette relation naturelle en français sans trancher davantage que le contexte.
- source_word: יִקְּרוּהָ
  choice: l’arracheront à coups de bec
  rationale: Dans cette scène mettant en jeu des oiseaux, נקר décrit l’action de crever ou d’arracher l’œil en le becquetant. Cette formulation française est à la fois précise, vive et idiomatique.
- source_word: עֹרְבֵי נַחַל
  choice: les corbeaux du ravin
  rationale: נחל peut désigner un ravin, un oued, un torrent ou son lit. « Ravin » est concis, accessible et convient au cadre où se trouvent les charognards.
- source_word: וְיֹאכְלוּהָ
  choice: le mangeront
  rationale: Le verbe אכל signifie simplement « manger ». Le pronom masculin français reprend « l’œil », là où l’hébreu emploie un suffixe féminin conforme au genre de עין.
- source_word: בְנֵי נָשֶׁר
  choice: les petits de l’aigle
  rationale: L’expression signifie littéralement les fils ou les petits du נשר. « Aigle » suit le rendu traditionnel, tandis qu’une note conserve l’identification possible comme vautour.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La phrase conserve l’image corporelle violente et la portée générique de l’hébreu, sans ajouter de possessif à « père » ou « mère ». Les trois ambiguïtés lexicales réelles sont signalées en notes.
