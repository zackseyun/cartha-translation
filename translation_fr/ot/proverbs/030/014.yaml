  source_fidelity: 'La seconde image du texte hébreu inverse les référents dans le brouillon : מַאֲכָלוֹת (« couteaux ») est le prédicat de מְתַלְּעֹתָיו (« ses crocs / dents de la mâchoire »), et non l’inverse. Le reste rend correctement le collectif דּוֹר, le parallélisme et l’image de prédation.'
  naturalness: « Les mâchoires des couteaux » n’est ni une construction française naturelle ni le sens du texte. « Dont les crocs sont des couteaux » est idiomatique, conserve l’image animale et évite de trancher plus précisément entre dents de la mâchoire, crocs ou molaires. « D’entre les humains » est plus fluide que « du milieu des humains » dans ce contexte.
  terminology: « Génération », « épées », « couteaux », « pauvres » et « nécessiteux » sont appropriés. « Crocs » rend naturellement מְתַלְּעֹתָיו dans l’imagerie prédatrice sans ajouter une lecture doctrinale. La note sur אָדָם doit refléter son emploi générique sans présenter une paraphrase française maladroite comme un littéral strict.
