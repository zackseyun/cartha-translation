  text: דּ֤וֹר חֲרָב֣וֹת שִׁנָּי/ו֮ וּֽ/מַאֲכָל֪וֹת מְֽתַלְּעֹ֫תָ֥י/ו לֶ/אֱכֹ֣ל עֲנִיִּ֣ים מֵ/אֶ֑רֶץ וְ֝/אֶבְיוֹנִ֗ים מֵ/אָדָֽם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/014.yaml
  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
translation:
  language: fr
  text: Une génération dont les dents sont des épées et dont les crocs sont des couteaux, pour dévorer les pauvres de la terre[a] et les nécessiteux d’entre les humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « d’Adam » ou « de l’humain » ; le terme hébreu désigne ici les humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: une génération
  rationale: Le nom désigne ici collectivement une catégorie de personnes et conserve la formulation brève de la série proverbiale.
- source_word: חֲרָבוֹת שִׁנָּיו
  choice: dont les dents sont des épées
  rationale: La traduction maintient l’image violente et concrète du texte hébreu.
- source_word: מַאֲכָלוֹת מְתַלְּעֹתָיו
  choice: les mâchoires des couteaux
  rationale: מְתַלְּעוֹת désigne probablement les mâchoires ou les dents de la mâchoire; «mâchoires» est naturel en français et évite de préciser indûment «crocs» ou «molaires». מַאֲכָלוֹת désigne ici des instruments tranchants, rendus par «couteaux».
- source_word: לֶאֱכֹל
  choice: pour dévorer
  rationale: Le verbe signifie littéralement manger, mais l’image prédatrice appliquée à l’oppression appelle naturellement «dévorer».
- source_word: עֲנִיִּים
  choice: les pauvres
  rationale: Dans ce contexte, le terme désigne les personnes pauvres ou affligées; «pauvres» exprime clairement leur vulnérabilité sociale.
- source_word: מֵאֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut signifier «terre» ou «pays»; le parallèle avec l’ensemble des humains favorise ici le sens large, sans exclure l’autre.
- source_word: אֶבְיוֹנִים
  choice: les nécessiteux
  rationale: Ce choix distingue le terme de עֲנִיִּים tout en conservant le parallélisme sémantique.
- source_word: מֵאָדָם
  choice: du milieu des humains
  rationale: אָדָם est générique et renvoie ici aux êtres humains collectivement, non à un homme particulier.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: les humains
  alternative: l’humanité; l’homme
  rationale: «Les humains» rend sans ambiguïté la référence générique à l’ensemble des êtres humains, sans introduire une distinction de sexe absente du contexte.
translation_notes:
  register: Français international moderne, sobre et imagé. La structure nominale abrupte de l’hébreu est conservée. Le collectif «génération» est repris par des formulations impersonnelles, tandis que le parallélisme poétique et l’image prédatrice restent visibles.
