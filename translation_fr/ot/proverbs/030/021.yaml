source:
  edition: WLC
  text: תַּ֣חַת שָׁ֭לוֹשׁ רָ֣גְזָה אֶ֑רֶץ וְ/תַ֥חַת אַ֝רְבַּ֗ע לֹא תוּכַ֥ל שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/021.yaml
  text: 'Under three things the earth trembles[a], and under four it cannot bear up:'
translation:
  language: fr
  text: 'Trois choses font trembler la terre, et il en est quatre qu’elle ne peut supporter[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elle ne peut porter ». Le verbe hébreu peut signifier porter, soutenir ou endurer.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: font / ne peut supporter
  rationale: Dans cette formule numérique, la préposition introduit ce qui provoque la réaction de la terre. Une restructuration verbale évite le calque peu naturel « sous trois choses » tout en conservant le rapport de cause et l’image du fardeau.
- source_word: שָׁלוֹשׁ
  choice: trois choses
  rationale: L’hébreu dit simplement « trois » ; « choses » est explicité en français pour introduire naturellement l’énumération.
- source_word: רָגְזָה
  choice: font trembler
  rationale: Le verbe רָגַז exprime le tremblement ou l’agitation. La tournure causative française rend naturellement la construction avec תַּחַת sans imposer l’idée précise d’un séisme.
- source_word: אֶרֶץ
  choice: la terre
  rationale: « La terre » convient à la personnification et à la portée générale de cette maxime, plutôt que « le pays ».
- source_word: אַרְבַּע
  choice: quatre
  rationale: Le nombre complète la formule sapientiale ascendante « trois… quatre » ; le nom « choses » demeure implicitement repris.
- source_word: לֹא תוּכַל שְׂאֵת
  choice: qu’elle ne peut supporter
  rationale: La construction signifie littéralement qu’elle « n’est pas capable de porter ». « Ne peut supporter » exprime à la fois le poids figuré et l’impossibilité d’endurer, tout en laissant l’alternative concrète en note.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve le parallélisme numérique et la personnification de la terre, tout en évitant le calque peu idiomatique « sous trois choses ».
