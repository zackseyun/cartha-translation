  text: כָּל אִמְרַ֣ת אֱל֣וֹהַּ צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לַֽ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/005.yaml
  text: Every word of God is proven; he is a shield to those who take refuge in him.
translation:
  language: fr
  text: Toute parole de Dieu a fait ses preuves ; il est un bouclier pour ceux qui trouvent refuge en lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִמְרַת אֱלוֹהַּ
  choice: Toute parole de Dieu
  rationale: « Toute parole » rend naturellement le singulier distributif כָּל אִמְרַת, tandis que « Dieu » traduit אֱלוֹהַּ sans surcharge stylistique.
- source_word: צְרוּפָה
  choice: a fait ses preuves
  rationale: Le participe passif de צרף évoque ce qui a été éprouvé ou affiné, notamment comme un métal au creuset. Cette formulation conserve ici l'idée d'une parole éprouvée et reconnue fiable, plutôt que de réduire le sens à la seule pureté.
- source_word: מָגֵן
  choice: un bouclier
  rationale: Équivalent direct de l'image protectrice du texte hébreu.
- source_word: לַחֹסִים בּוֹ
  choice: pour ceux qui trouvent refuge en lui
  rationale: Le participe חסה désigne ceux qui se réfugient ou cherchent protection en Dieu ; « trouvent refuge » est idiomatique et garde l'image concrète.
theological_decisions:
- issue: Rapport entre l'épreuve de la parole divine et sa pureté
  choice: a fait ses preuves
  alternative: est pure / est affinée
  rationale: Le contexte sapientiel affirme la fiabilité éprouvée de chaque parole divine. Le choix retenu préserve l'arrière-plan métallurgique de צרף par l'idée d'épreuve, sans imposer une affirmation doctrinale plus étroite sur la seule pureté.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme est conservé, ainsi que le passage de la parole de Dieu à Dieu lui-même comme protecteur.
