    reason: « Élevés » conserve plus littéralement l’image verticale de l’hébreu ; « hautains » en exprime naturellement la portée figurée dans le texte principal.
  revision_rationale: La révision conserve l’exclamation, le parallélisme et l’imagerie de l’hébreu, tout en rétablissant le collectif singulier et la voix non active de « sont levées ». Elle emploie un français moderne et maintient l’ambiguïté poétique entre hauteur physique et arrogance.
