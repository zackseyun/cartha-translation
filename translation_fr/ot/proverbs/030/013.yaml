review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu présente le collectif singulier דּוֹר, suivi d’une exclamation sur ses yeux « élevés » et ses paupières « levées ». Le projet rend bien l’idée d’orgueil, mais « ils lèvent les paupières » transforme le nifal יִנָּשֵׂאוּ (« sont levées / se lèvent ») en une action transitive active. La note actuelle (« se dressent ») s’éloigne également de l’image de paupières levées.
  naturalness: « Il est des gens » est idiomatique, mais atténue inutilement le singulier collectif et le lexique de « génération ». « Il y a une génération » est moderne et naturel dans ce contexte proverbial. « Combien » rend naturellement l’exclamation de degré et s’applique aux deux éléments parallèles.
  terminology: « Hautains » exprime de façon juste la valeur figurée des yeux élevés. « Paupières » maintient l’image corporelle concrète. Le singulier possessif (« ses ») conserve le collectif singulier hébreu sans rendre le français moins naturel.
  issues:
  - severity: medium
    issue: Changement de voix pour יִנָּשֵׂאוּ
    rationale: « Ils lèvent les paupières » introduit un sujet agent et un objet direct, alors que le nifal décrit les paupières comme levées. « Ses paupières sont levées » préserve la construction et l’image source.
  - severity: low
    issue: Le collectif singulier est remplacé par « des gens » et des pluriels
    rationale: Cette adaptation est possible sur le plan du sens, mais « une génération » et les possessifs singuliers reflètent mieux la forme collective répétée dans Proverbes 30.11-14.
  - severity: low
    issue: La note emploie « se dressent »
    rationale: Cette formulation ajoute une nuance plus forte que « être levées » et ne correspond pas exactement à la forme verbale hébraïque.
  revised_text: Il y a une génération — combien ses yeux sont hautains, et ses paupières sont levées !
