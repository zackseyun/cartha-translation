  yaml_path: translation/ot/proverbs/030/013.yaml
  text: There is a generation—how lofty are its eyes[a], and its eyelids are raised high.
translation:
  language: fr
  text: Il y a une génération — combien ses yeux sont hautains, et ses paupières sont levées !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹר
  choice: Il est des gens
  rationale: דּוֹר désigne littéralement une génération, mais, dans la série de Proverbes 30.11-14, le mot introduit chaque fois une catégorie de personnes. « Il est des gens » rend naturellement cette valeur collective et existentielle en français moderne.
- source_word: מָה
  choice: comme
  rationale: מָה a ici une valeur exclamative de degré, et non interrogative. La reprise de « comme » devant les deux membres fait entendre l’exclamation en français.
- source_word: רָמוּ
  choice: sont hautains
  rationale: Le verbe רום signifie être haut ou élevé. Appliqué aux yeux, il évoque l’orgueil. « Hautains » rend cette connotation dans une expression française naturelle, tandis que la seconde proposition conserve explicitement l’image verticale.
- source_word: עֵינָיו
  choice: leurs yeux
  rationale: Le suffixe hébreu est au masculin singulier et reprend le collectif דּוֹר. Puisque « des gens » explicite ce collectif en français, le pluriel « leurs » assure un accord naturel sans changer le référent.
- source_word: וְעַפְעַפָּיו
  choice: et comme ils lèvent les paupières
  rationale: עַפְעַף désigne concrètement la paupière. Le maintien de ce terme préserve l’image corporelle et poétique du texte.
- source_word: יִנָּשֵׂאוּ
  choice: ils lèvent
  rationale: Le nifal de נשׂא exprime le fait d’être levé ou de se lever. La tournure active idiomatique « ils lèvent les paupières » communique naturellement en français l’attitude fière décrite, tout en gardant l’image visible.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant mais digne. La formulation conserve le parallélisme, le ton exclamatif et l’image corporelle de l’arrogance, tout en évitant le peu naturel « ses yeux sont élevés » dans le corps du texte.
