revisions:
- from: Il est des gens — comme leurs yeux sont hautains[a], et comme ils lèvent les paupières !
  to: Il y a une génération — combien ses yeux sont hautains, et ses paupières sont levées !
  rationale: La révision conserve l’exclamation, le parallélisme et l’imagerie de l’hébreu, tout en rétablissant le collectif singulier et la voix non active de « sont levées ». Elle emploie un français moderne et maintient l’ambiguïté poétique entre hauteur physique et arrogance.
