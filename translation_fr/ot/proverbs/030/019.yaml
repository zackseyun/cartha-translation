  variant: modern international French
source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
translation:
  language: fr
  text: 'la voie de l’aigle dans le ciel[a],

    la voie du serpent sur le rocher,

    la voie du navire au cœur de la mer[b],

    et la voie d’un homme avec une jeune femme[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « aigle » peut désigner plus largement un grand rapace.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans le cœur de la mer », expression qui signifie « au milieu de la mer ».'
    reason: cultural_note
  - marker: c
    text: 'Ou : « avec une vierge ». Le mot hébreu désigne une jeune femme et n’affirme pas, à lui seul, qu’elle est vierge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: voie
  rationale: Le nom, répété quatre fois, peut désigner un chemin, une trajectoire ou une manière d’agir. « Voie » conserve cette ampleur et structure naturellement les quatre membres du proverbe.
- source_word: הַנֶּשֶׁר
  choice: l’aigle
  rationale: « Aigle » est le rendu traditionnel et naturel en français, tout en signalant en note que le terme hébreu peut désigner plus largement un grand rapace.
- source_word: בַּשָּׁמַיִם
  choice: dans le ciel
  rationale: Dans cette image concrète du vol d’un oiseau, « ciel » rend mieux l’espace visible que « cieux ».
- source_word: נָחָשׁ
  choice: serpent
  rationale: « Serpent » est le terme français courant et digne pour l’animal, sans imposer ici de symbolisme théologique particulier.
- source_word: עֲלֵי צוּר
  choice: sur le rocher
  rationale: Ce rendu direct préserve l’image du déplacement du serpent sur une surface rocheuse.
- source_word: אֳנִיָּה
  choice: navire
  rationale: « Navire » convient à une embarcation qui parcourt la mer et maintient un registre poétique sans archaïsme.
- source_word: בְלֶב יָם
  choice: au cœur de la mer
  rationale: La métaphore hébraïque, littéralement « au cœur de la mer », est claire et expressive en français; elle est donc conservée.
- source_word: גֶּבֶר
  choice: un homme
  rationale: Le terme désigne ici spécifiquement un adulte de sexe masculin; « homme » en restitue directement le sens.
- source_word: בְּעַלְמָה
  choice: avec une jeune femme
  rationale: עַלְמָה désigne une jeune femme en âge de se marier sans affirmer lexicalement sa virginité. La préposition est rendue par « avec », ce qui préserve l’ambiguïté relationnelle et suggestive du dernier membre.
theological_decisions:
- issue: Sens de וְדֶרֶךְ גֶּבֶר בְּעַלְמָה
  choice: la voie d’un homme avec une jeune femme
  alternative: la voie d’un homme avec une vierge; la voie d’un homme en une jeune femme
  rationale: Le texte évoque une « voie » difficile à saisir sans préciser s’il s’agit de l’attirance, de la séduction, de la relation ou d’un rapport sexuel. « Avec » conserve cette tension sans rendre la formulation plus explicite que l’hébreu; « jeune femme » respecte la portée de עַלְמָה sans lui imposer le sens plus étroit de « vierge ».
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme en quatre membres et la répétition de « la voie » sont maintenus. Les images concrètes et l’ambiguïté du dernier membre sont préservées.
