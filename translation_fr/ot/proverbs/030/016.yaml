id: PRO.30.16
reference: Proverbs 30:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׁאוֹל֮ וְ/עֹ֪צֶ֫ר רָ֥חַם אֶ֭רֶץ לֹא שָׂ֣בְעָה מַּ֑יִם וְ֝/אֵ֗שׁ לֹא אָ֥מְרָה הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
translation:
  language: fr
  text: 'le séjour des morts[a], le ventre stérile[b], la terre jamais rassasiée d’eau, et le feu qui ne dit jamais : « Assez ! »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Shéol » ou « la tombe »; le terme hébreu désigne le séjour des morts.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la fermeture du ventre », c’est-à-dire un ventre qui ne porte pas d’enfant.
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque finale est difficile. Beaucoup la comprennent comme « Assez ! »; d’autres proposent un sens lié à la richesse ou aux biens.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française rend le domaine des morts désigné par le terme hébreu, sans le réduire à une tombe individuelle; la translittération « Shéol » reste signalée en note.
- source_word: עֹצֶר רָחַם
  choice: le ventre stérile
  rationale: L’expression signifie littéralement la fermeture ou la rétention du ventre maternel et désigne idiomatiquement l’incapacité à enfanter.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Dans cette énumération d’éléments insatiables, le mot a une portée générale plutôt que territoriale.
- source_word: לֹא שָׂבְעָה מַּיִם
  choice: jamais rassasiée d’eau
  rationale: Le verbe exprime le fait d’être rassasié; « jamais » restitue naturellement la force proverbiale de la négation.
- source_word: אֵשׁ
  choice: le feu
  rationale: Équivalent français direct dans cette image élémentaire.
- source_word: לֹא אָמְרָה הוֹן
  choice: 'qui ne dit jamais : « Assez ! »'
  rationale: « Assez ! » convient au parallélisme portant sur l’insatiabilité, tout en maintenant en note l’incertitude du dernier mot hébreu.
theological_decisions:
- issue: Nature de שְׁאוֹל
  choice: le séjour des morts
  alternative: la tombe; le Shéol
  rationale: Le choix évite d’identifier le terme à une simple sépulture ou de lui imposer une conception confessionnelle précise de l’au-delà.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure elliptique de l’énumération commencée au verset précédent et emploie « ventre stérile », plus courant ici que le littéral « fermeture du ventre ».
