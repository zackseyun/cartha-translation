source:
  edition: WLC
  text: אַל תְּהִ֥י בְ/סֹֽבְאֵי יָ֑יִן בְּ/זֹלֲלֵ֖י בָשָׂ֣ר לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
translation:
  language: fr
  text: Ne sois pas avec ceux qui boivent du vin à l’excès, ni avec ceux qui se gavent de viande[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec ceux qui se gavent de viande pour eux-mêmes ». Le dernier terme hébreu, לָמוֹ, est syntaxiquement difficile et pourrait avoir une valeur d’insistance plutôt qu’ajouter une idée distincte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Ne sois pas
  rationale: La particule אַל suivie de l’imparfait à valeur jussive exprime une interdiction. « Ne sois pas » rend directement et naturellement la défense en français.
- source_word: בְסֹבְאֵי יָיִן
  choice: avec ceux qui boivent du vin à l’excès
  rationale: La préposition בְּ marque ici l’association. Le participe סֹבְאֵי désigne une pratique habituelle de consommation excessive, sans exiger le terme plus catégorisant « ivrognes ».
- source_word: בְזֹלֲלֵי בָשָׂר
  choice: ni avec ceux qui se gavent de viande
  rationale: Le second בְּ poursuit la construction associative; « ni » rend naturellement le parallélisme négatif en français. זֹלֲלֵי évoque une consommation excessive et déréglée, et בָשָׂר désigne ici la viande consommée comme nourriture.
- source_word: לָמוֹ
  choice: non exprimé séparément dans le texte principal
  rationale: Le terme final est syntaxiquement difficile et peut renforcer l’expression précédente plutôt qu’ajouter un complément distinct. Une note conserve l’autre lecture possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La formulation explicite les participes hébreux par « ceux qui… », conserve leur valeur habituelle et évite des étiquettes potentiellement plus fortes comme « ivrognes » et « gloutons ».
