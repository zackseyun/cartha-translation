source:
  edition: WLC
  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם וּ/בִ/שְׂדֵ֥י יְ֝תוֹמִ֗ים אַל תָּבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/010.yaml
  text: Do not move an ancient boundary marker[a], and do not enter the fields of orphans,
translation:
  language: fr
  text: Ne déplace pas une borne ancienne[a] et n’entre pas dans les champs des orphelins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne déplace pas une limite établie de longue date » ; l’interdiction vise le déplacement d’une délimitation foncière, par lequel on empiéterait sur une propriété.
    reason: Alternative lexicale pour « borne ancienne » et explicitation mesurée du contexte foncier.
lexical_decisions:
- source_word: תַּסֵּג
  choice: déplace
  rationale: Le verbe נסג désigne ici le déplacement illégitime d’une limite de propriété. « Déplacer » est naturel et conserve l’image concrète sans expliciter davantage l’intention d’empiéter.
- source_word: גְּבוּל
  choice: borne
  rationale: Dans ce contexte foncier, גְּבוּל renvoie à la marque concrète qui délimite une propriété. « Borne » exprime cela avec concision en français.
- source_word: עוֹלָם
  choice: ancienne
  rationale: Le terme qualifie ici une limite établie depuis longtemps, non une réalité éternelle. « Ancienne » convient au contexte juridique et sapiential.
- source_word: וּ/בִ/שְׂדֵי
  choice: et ... dans les champs de
  rationale: Avec un verbe de mouvement, la préposition ב indique l’entrée dans un lieu. La tournure française « entrer dans les champs de » restitue naturellement cette construction.
- source_word: יְתוֹמִים
  choice: orphelins
  rationale: Le mot désigne des enfants privés de père. « Orphelins » est le terme français courant, clair et inclusif quant à leur situation de vulnérabilité.
- source_word: תָּבֹא
  choice: entre
  rationale: Le verbe בוא signifie venir ou entrer. Dans cet avertissement relatif à une propriété, « entrer » rend directement le mouvement dans les champs sans transformer implicitement l’action en saisie ou en spoliation.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et sentencieux. Le parallélisme des deux interdictions est conservé. « Borne » privilégie l’image foncière concrète, tandis que la note préserve la possibilité plus générale de « limite ».
