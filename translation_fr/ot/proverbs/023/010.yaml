    rationale: Dans « une ancienne borne », « ancienne » peut avoir le sens de « précédente » ou « qui n’est plus en fonction ». « Une borne ancienne » rend plus nettement l’idée d’une borne de longue date portée par עוֹלָם.
  - severity: low
