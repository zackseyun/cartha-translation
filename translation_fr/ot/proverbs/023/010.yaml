  source_fidelity: 'Le sens des deux interdictions est bien rendu : תַּסֵּג vise le déplacement d’une délimitation foncière, et בוא עם בְּ exprime l’entrée dans les champs des personnes vulnérables. « Borne » convient très bien à גְּבוּל dans ce contexte. Toutefois, en français actuel, « une ancienne borne » peut se comprendre comme « une ex-borne » plutôt que comme une borne établie depuis longtemps ; l’antéposition de l’adjectif affaiblit donc la valeur de עוֹלָם.'
