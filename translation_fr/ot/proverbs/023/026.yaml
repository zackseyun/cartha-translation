  text: My son[a], give me your heart, and let your eyes delight in my ways.
translation:
  language: fr
  text: Mon fils, donne-moi ton cœur, et que tes yeux prennent plaisir à mes voies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte écrit porte « prennent plaisir à mes voies ». La lecture traditionnelle propose « observent » ou « gardent mes voies ».
    reason: variante de lecture (ketiv/qeré)
lexical_decisions:
- source_word: תְּנָה
  choice: donne
  rationale: L’impératif de נתן appelle une formulation directe. « Donne » est naturel dans cette exhortation paternelle.
- source_word: בְנִי
  choice: mon fils
  rationale: Le vocatif masculin singulier avec suffixe de première personne est conservé sans généralisation.
- source_word: לִבְּךָ לִי
  choice: donne-moi ton cœur
  rationale: Cette tournure française naturelle garde la métaphore biblique du cœur, qui désigne ici la personne intérieure, la volonté et les affections.
- source_word: וְעֵינֶיךָ
  choice: et que tes yeux
  rationale: La construction rend la nuance volitive du verbe tout en maintenant l’image des yeux.
- source_word: דְּרָכַי
  choice: mes voies
  rationale: דרך désigne ici la conduite ou la manière de vivre. « Mes voies » préserve l’image sapientielle sans la réduire à de simples chemins matériels.
- source_word: תרצנה
  choice: se plaisent dans
  rationale: Le verbe רצה exprime vraisemblablement ici un regard favorable, fait de plaisir et d’adhésion. La formulation conserve néanmoins l’image des yeux et laisse en note l’autre compréhension possible.
