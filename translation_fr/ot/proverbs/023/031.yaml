source:
  edition: WLC
  text: אַל תֵּ֥רֶא יַיִן֮ כִּ֪י יִתְאַ֫דָּ֥ם כִּֽי יִתֵּ֣ן ב/כיס עֵינ֑/וֹ יִ֝תְהַלֵּ֗ךְ בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/031.yaml
  text: Do not look at wine when it is red[a], when it sparkles in the cup[b], when it goes down smoothly.
translation:
  language: fr
  text: Ne regarde pas le vin quand il rougeoie, quand il scintille dans la coupe[a], quand il descend avec aisance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand il donne son œil dans la coupe », expression hébraïque évoquant l’aspect attirant du vin.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quand il se déplace tout droit ». L’expression peut évoquer le vin qui se boit facilement, qui descend sans difficulté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֵּרֶא
  choice: Ne regarde pas
  rationale: אַל suivi de l’imparfait exprime une interdiction. « Ne regarde pas » rend aussi la nuance volontaire de l’attention attirée par le vin.
- source_word: יַיִן
  choice: le vin
  rationale: Équivalent français courant du terme hébreu usuel pour le vin.
- source_word: כִּי יִתְאַדָּם
  choice: quand il rougeoie
  rationale: Dans cette suite descriptive, כִּי introduit naturellement la circonstance, tandis que la forme verbale évoque le vin qui se montre rouge ou prend une apparence rouge.
- source_word: כִּי יִתֵּן בַּכּוֹס עֵינוֹ
  choice: quand il scintille dans la coupe
  rationale: L’expression signifie littéralement que le vin « donne son œil » dans la coupe. « Scintille » en restitue l’attrait visuel en français naturel, sans alourdir le vers.
- source_word: יִתְהַלֵּךְ בְּמֵישָׁרִים
  choice: quand il descend avec aisance
  rationale: L’expression décrit probablement le mouvement facile et séduisant du vin lorsqu’on le boit. « Descend avec aisance » garde l’image du mouvement tout en laissant la note signaler le sens littéral plus incertain.
