  text: שְׁמַ֣ע לְ֭/אָבִי/ךָ זֶ֣ה יְלָדֶ֑/ךָ וְ/אַל תָּ֝ב֗וּז כִּֽי זָקְנָ֥ה אִמֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/022.yaml
  text: Listen to your father[a], who fathered you[b], and do not despise your mother when she is old.
translation:
  language: fr
  text: Écoute ton père, celui qui t’a engendré, et ne méprise pas ta mère quand elle a vieilli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce qu’elle a vieilli ». Le mot hébreu traduit par « quand » peut aussi avoir un sens causal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע לְאָבִיךָ
  choice: Écoute ton père
  rationale: L’impératif שְׁמַע appelle ici à une écoute attentive et obéissante; en français, « écouter » régit directement son complément.
- source_word: זֶה יְלָדֶךָ
  choice: lui qui t’a engendré
  rationale: « Lui » restitue l’emphase du démonstratif זֶה, tandis que « qui t’a engendré » exprime naturellement l’explication relative et garde le père comme sujet de ילד.
- source_word: וְאַל תָּבוּז
  choice: et ne méprise pas
  rationale: Le verbe בוז exprime le mépris ou le dédain; « ne méprise pas » en conserve directement la force.
- source_word: כִּי זָקְנָה אִמֶּךָ
  choice: ta mère quand elle est devenue vieille
  rationale: Dans ce contexte, כִּי peut introduire la circonstance temporelle. Le parfait זָקְנָה présente l’entrée dans la vieillesse comme accomplie, d’où « est devenue vieille ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve l’emphase inhabituelle du démonstratif hébreu par « lui » et maintient l’ambiguïté de כִּי en note.
