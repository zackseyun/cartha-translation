  text: עֵ֭ינֶי/ךָ יִרְא֣וּ זָר֑וֹת וְ֝/לִבְּ/ךָ֗ יְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/033.yaml
  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
translation:
  language: fr
  text: Tes yeux verront des choses étranges[a], et ton cœur prononcera des paroles perverses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des femmes étrangères » ou « des femmes interdites ». Le mot hébreu peut désigner de telles femmes, mais il peut aussi évoquer plus généralement des visions étranges ou déformées causées par l’ivresse.
    reason: alternative_reading
  - marker: b
    text: Ou « des paroles tordues » ou « des paroles fausses ». Le terme hébreu désigne ce qui est déformé ou pervers, notamment dans les paroles.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: Le duel hébreu muni du suffixe de deuxième personne du masculin singulier se rend naturellement au pluriel en français.
- source_word: יִרְאוּ
  choice: verront
  rationale: Dans le contexte de cet avertissement sur l’ivresse, l’imparfait hébreu exprime naturellement une conséquence à venir.
- source_word: זָרוֹת
  choice: des choses étranges
  rationale: Le féminin pluriel peut désigner des choses étranges ou, substantivé, des femmes étrangères ou interdites. Le contexte immédiat de l’ivresse favorise ici le sens général de perceptions étranges, sans supprimer l’autre lecture possible.
- source_word: וְלִבְּךָ
  choice: et ton cœur
  rationale: Le cœur représente ici l’être intérieur, notamment la pensée et la volonté. Le terme concret de l’hébreu est conservé plutôt que remplacé par « esprit ».
- source_word: יְדַבֵּר
  choice: dira
  rationale: L’imparfait est rendu au futur en parallèle avec « verront ». « Dira » est plus idiomatique en français dans cette construction que « parlera des choses ».
- source_word: תַּהְפֻּכוֹת
  choice: des choses perverses
  rationale: Le nom désigne ce qui est retourné, faussé ou moralement pervers, particulièrement dans les paroles. Cette formulation conserve à la fois l’idée de distorsion et sa portée morale.
