source:
  edition: WLC
  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
translation:
  language: fr
  text: Ne prive pas un garçon[a] de correction, car si tu le frappes avec le bâton[b], il ne mourra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un enfant » ou « un jeune ». Le nom hébreu peut désigner un garçon ou, plus largement, une personne jeune; le texte principal conserve le masculin singulier du proverbe.
    reason: lexical_alternative
  - marker: b
    text: Le proverbe affirme qu’une telle correction n’est pas en elle-même mortelle; il ne faut pas y voir une approbation générale de la violence abusive ni une garantie absolue valable dans tous les cas.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Ne prive pas
  rationale: La négation אַל avec l’inaccompli exprime une interdiction, et מנע signifie retenir ou refuser quelque chose à quelqu’un. « Ne prive pas… de » est naturel en français et conserve cette construction.
- source_word: מִנַּעַר
  choice: un garçon
  rationale: נַעַר désigne selon le contexte un garçon, un enfant ou un jeune homme. « Garçon » maintient ici le masculin singulier du proverbe sans exclure en note la portée lexicale plus large.
- source_word: מוּסָר
  choice: correction
  rationale: Dans les Proverbes, מוּסָר englobe l’éducation, la discipline et la réprimande corrective. Le contexte immédiat du bâton favorise « correction », terme courant qui garde la finalité éducative.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison donnée à l’exhortation. « Car » rend clairement ce lien explicatif dans un registre proverbial digne.
- source_word: תַכֶּנּוּ
  choice: tu le frappes
  rationale: Le verbe נכה signifie concrètement frapper. Cette traduction directe évite aussi bien l’atténuation de « corriger » que l’intensification possible de « battre ».
- source_word: בַשֵּׁבֶט
  choice: avec le bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge, un sceptre ou une tribu. Dans ce contexte de correction, « bâton » transmet l’image concrète en français moderne et courant.
- source_word: לֹא יָמוּת
  choice: il ne mourra pas
  rationale: La proposition hébraïque est une simple négation du verbe « mourir » à l’inaccompli. La formulation directe préserve l’affirmation proverbiale sans lui ajouter de précision interprétative.
theological_decisions:
- issue: Référence masculine de נַעַר dans une maxime de sagesse
  choice: Employer « un garçon » dans le texte principal
  alternative: Employer « un enfant » ou « un jeune »
  rationale: Le substantif et les reprises pronominales sont au masculin singulier. Le texte principal conserve cette forme, tandis qu’une note signale l’étendue sémantique du mot hébreu.
- issue: Portée de l’affirmation concernant la correction corporelle
  choice: Traduire directement « il ne mourra pas »
  alternative: Expliciter « cela ne le tuera pas » ou atténuer l’image
  rationale: L’hébreu formule une assurance proverbiale sans qualification explicite. La traduction ne doit ni transformer cette maxime en garantie absolue ni en effacer la tension; une note prévient plutôt une lecture justifiant la violence abusive.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes verbales hébraïques et au style direct de l’instruction sapientielle. « Bâton » est préféré à « verge », devenu littéraire ou vieilli dans de nombreux usages.
