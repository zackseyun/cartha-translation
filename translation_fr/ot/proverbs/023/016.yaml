id: PRO.23.16
reference: Proverbs 23:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/תַעְלֹ֥זְנָה כִלְיוֹתָ֑/י בְּ/דַבֵּ֥ר שְׂ֝פָתֶ֗י/ךָ מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/016.yaml
  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
translation:
  language: fr
  text: et au plus profond de moi, je me réjouirai quand tes lèvres diront ce qui est droit[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « mes reins », une expression hébraïque qui désigne le for intérieur ou les émotions les plus profondes.
    reason: cultural_note
  - marker: b
    text: Ou « ce qui est juste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  choice: se réjouira
  rationale: Le verbe עלז exprime une joie vive. « Se réjouira » est naturel, digne et conserve ici la valeur prospective.
- source_word: כִלְיוֹתָי
  choice: tout mon être
  rationale: Littéralement « mes reins », expression hébraïque désignant le for intérieur, siège des émotions profondes. « Tout mon être » restitue le sens anthropologique sans employer une image devenue opaque en français.
- source_word: בְּדַבֵּר
  choice: quand ... diront
  rationale: 'La préposition ב avec l’infinitif construit a ici une valeur temporelle : « quand tes lèvres parleront ». Avec le complément מֵישָׁרִים, « diront ce qui est droit » est plus idiomatique en français.'
- source_word: שְׂפָתֶיךָ
  choice: tes lèvres
  rationale: Le maintien de l’image concrète des lèvres préserve le parallélisme et la diction poétique de l’hébreu.
- source_word: מֵישָׁרִים
  choice: ce qui est droit
  rationale: Le terme évoque ce qui est droit ou juste, notamment sur le plan moral. « Ce qui est droit » conserve cette image fondamentale sans en réduire la portée à une seule nuance.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La métaphore des « lèvres » est conservée, tandis que celle des « reins », opaque pour le lectorat actuel, est rendue par « tout mon être ».
