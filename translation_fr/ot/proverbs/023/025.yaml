  yaml_path: translation/ot/proverbs/023/025.yaml
  text: Let your father and your mother be glad[a], and let her who gave birth to you rejoice.
translation:
  language: fr
  text: 'Que ton père et ta mère se réjouissent,

    et que celle qui t’a mis au monde exulte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: se réjouissent
  rationale: Le qal à valeur jussive exprime ici un souhait ou une exhortation. En français, « Que… se réjouissent » rend naturellement cette nuance; le singulier hébreu s’accorde avec le premier élément d’un sujet coordonné, tandis que le français demande le pluriel pour « ton père et ta mère ».
- source_word: אָבִיךָ וְאִמֶּךָ
  choice: ton père et ta mère
  rationale: La coordination et les suffixes possessifs de deuxième personne masculine singulière sont rendus directement et naturellement.
- source_word: וְתָגֵל
  choice: et que… exulte
  rationale: Le verbe גיל exprime une joie vive. « Exulte » conserve une intensité supérieure à « se réjouissent » et maintient la variation entre les deux verbes hébreux.
- source_word: יוֹלַדְתֶּךָ
  choice: celle qui t’a mis au monde
  rationale: Le participe féminin singulier de ילד désigne la femme qui a enfanté le destinataire, autrement dit sa mère. « Mettre au monde » est clair, naturel et digne en français contemporain.
theological_decisions: []
translation_notes:
  register: Formulation poétique, actuelle et digne. Le parallélisme hébreu est conservé en deux lignes, ainsi que la progression de « se réjouir » à « exulter ». Aucun marqueur de note n’est nécessaire, puisque la variante anglaise signalée correspond au sens directement exprimé dans le texte français.
