source:
  edition: WLC
  text: כִּֽי תֵ֭שֵׁב לִ/לְח֣וֹם אֶת מוֹשֵׁ֑ל בִּ֥ין תָּ֝בִ֗ין אֶת אֲשֶׁ֥ר לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/001.yaml
  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
translation:
  language: fr
  text: Quand tu t’assieds pour manger avec un dirigeant, examine attentivement ce qui est devant toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui t’est présenté ». L’hébreu peut désigner précisément la nourriture placée devant le convive, mais aussi évoquer plus largement la situation à laquelle il doit prendre garde.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cette instruction de sagesse, la conjonction introduit une situation concrète plutôt qu’une cause; « Quand » rend naturellement cette valeur circonstancielle.
- source_word: תֵשֵׁב
  choice: tu t’assieds
  rationale: Le verbe ישׁב désigne ici le fait de prendre place pour un repas; cette formulation reste concrète et naturelle en français.
- source_word: לִלְחוֹם
  choice: pour manger
  rationale: Dans cette construction, לחם signifie prendre un repas. « Manger » est courant, clair et fidèle sans donner au contexte une solennité absente de l’hébreu.
- source_word: אֶת מוֹשֵׁל
  choice: avec un dirigeant
  rationale: מוֹשֵׁל désigne une personne qui exerce l’autorité. Après le verbe exprimant le repas, אֶת a ici une valeur d’accompagnement; « dirigeant » convient au français international actuel.
- source_word: בִּין תָּבִין
  choice: examine attentivement
  rationale: L’infinitif absolu suivi du verbe de même racine intensifie l’appel au discernement. « Examine attentivement » exprime à la fois l’attention et l’emphase.
- source_word: אֶת אֲשֶׁר לְפָנֶיךָ
  choice: ce qui est devant toi
  rationale: La formule peut viser la nourriture placée devant le convive, tout en laissant entendre plus largement la situation dans laquelle il se trouve. Cette traduction conserve cette ambiguïté.
