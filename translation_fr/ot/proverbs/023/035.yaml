  text: הִכּ֥וּ/נִי בַל חָלִיתִי֮ הֲלָמ֗וּ/נִי בַּל יָ֫דָ֥עְתִּי מָתַ֥י אָקִ֑יץ א֝וֹסִ֗יף אֲבַקְשֶׁ֥/נּוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
translation:
  language: fr
  text: « On m’a frappé, mais je n’ai pas eu mal[a] ; on m’a roué de coups, mais je ne m’en suis pas rendu compte. Quand vais-je me réveiller ? Je le chercherai de nouveau[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais je n’ai pas été blessé ». Le verbe hébreu peut évoquer la douleur, la blessure, la faiblesse ou la maladie.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom renvoie très probablement au vin ou à la boisson enivrante mentionnés dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּנִי
  choice: On m’a frappé
  rationale: Le verbe נכה désigne couramment l’action de frapper. La tournure impersonnelle avec « on » est naturelle en français et conserve le pluriel indéfini de la forme hébraïque.
- source_word: בַל חָלִיתִי
  choice: mais je n’ai pas eu mal
  rationale: חלה peut exprimer la faiblesse, la maladie, la blessure ou la douleur. Après « frapper », cette formulation rend naturellement l’insensibilité physique de la personne ivre sans préciser indûment une blessure.
- source_word: הֲלָמוּנִי
  choice: on m’a roué de coups
  rationale: הלם signifie frapper avec force. « Rouer de coups » distingue ce second verbe du premier et restitue l’intensification du parallélisme.
- source_word: בַל יָדָעְתִּי
  choice: mais je ne m’en suis pas rendu compte
  rationale: ידע signifie littéralement « savoir, connaître », mais décrit ici l’absence de perception ou de conscience due à l’ivresse. Cette expression est idiomatique en français.
- source_word: מָתַי אָקִיץ
  choice: Quand vais-je me réveiller ?
  rationale: La forme verbale exprime le réveil. La question au futur proche est naturelle en français moderne tout en conservant l’image littérale, sans l’interpréter comme « retrouver mes esprits ».
- source_word: אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד
  choice: J’en chercherai encore
  rationale: יסף et עוד expriment ensemble la répétition ou la reprise. Le pronom masculin singulier renvoie très probablement au vin ou à la boisson du contexte ; le pronom adverbial « en » conserve toutefois un référent implicite et produit une phrase française naturelle.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et dignifié. Le discours garde le ton saisissant de la personne ivre, insensible aux coups et déjà résolue à rechercher de nouveau la boisson. Le parallélisme hébreu est rendu par deux verbes français distincts.
