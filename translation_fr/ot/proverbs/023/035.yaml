    rationale: « J’en chercherai encore » se comprend spontanément comme « je chercherai encore de cette boisson / davantage », alors que l’hébreu « j’ajouterai à le chercher encore » indique le retour à la recherche du même référent implicite. « Je le chercherai de nouveau » rend mieux cette valeur tout en conservant l’ambiguïté contextuelle du référent.
