source:
  edition: WLC
  text: וְ֭/הָיִיתָ כְּ/שֹׁכֵ֣ב בְּ/לֶב יָ֑ם וּ֝/כְ/שֹׁכֵ֗ב בְּ/רֹ֣אשׁ חִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/034.yaml
  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
translation:
  language: fr
  text: Tu seras comme quelqu’un couché au cœur de la mer, comme quelqu’un couché au sommet d’un mât[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est incertain. Il peut aussi désigner un cordage, le gréement ou un autre élément de l’équipement d’un navire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Tu seras
  rationale: Le parfait qal avec la conjonction prend ici une valeur consécutive ou future dans l’avertissement et maintient l’adresse directe à la deuxième personne.
- source_word: כְּשֹׁכֵב / וּכְשֹׁכֵב
  choice: comme quelqu’un couché
  rationale: Le participe de שׁכב décrit l’état d’une personne allongée. « Couché » rend naturellement l’image sans préciser qu’elle dort.
- source_word: בְּלֶב יָם
  choice: au cœur de la mer
  rationale: לֵב signifie littéralement « cœur » et, par extension, le milieu ou le centre. L’expression française conserve ici l’image vive de l’hébreu.
- source_word: בְּרֹאשׁ
  choice: au sommet de
  rationale: רֹאשׁ peut désigner la tête, le haut ou le sommet. Dans cette scène maritime, « au sommet de » exprime clairement la position élevée et précaire.
- source_word: חִבֵּל
  choice: un mât
  rationale: Le terme hébreu est rare et son sens exact dans ce passage est incertain. « Mât » correspond à l’interprétation contextuelle traditionnelle et donne une image nautique intelligible, tandis que les possibilités liées aux cordages ou au gréement sont signalées en note.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme hébreu est conservé par la répétition de « comme quelqu’un couché », et l’image « au cœur de la mer » est maintenue sans l’aplanir.
