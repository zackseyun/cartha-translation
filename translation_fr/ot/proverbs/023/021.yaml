  text: כִּי סֹבֵ֣א וְ֭/זוֹלֵל יִוָּרֵ֑שׁ וּ֝/קְרָעִ֗ים תַּלְבִּ֥ישׁ נוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/021.yaml
  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
translation:
  language: fr
  text: Car l’ivrogne et le glouton tomberont dans la pauvreté, et la somnolence couvrira l’homme de haillons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹבֵא
  choice: l’ivrogne
  rationale: Le nom désigne celui qui s’adonne habituellement à l’excès de boisson, et non simplement une personne momentanément ivre.
- source_word: זוֹלֵל
  choice: le glouton
  rationale: Dans ce contexte de sagesse, le terme évoque celui qui mange avec excès et dissipation; « glouton » rend naturellement son association avec « ivrogne ».
- source_word: יִוָּרֵשׁ
  choice: tomberont dans la pauvreté
  rationale: Le niphal exprime ici l’aboutissement à la pauvreté. Le singulier hébreu porte sur les deux types de personnes coordonnés; le pluriel est naturel en français.
- source_word: קְרָעִים
  choice: haillons
  rationale: Le mot désigne des vêtements déchirés; « haillons » restitue avec force l’image de la misère.
- source_word: תַּלְבִּישׁ
  choice: couvrira … de
  rationale: Le hiphil signifie littéralement « vêtir ». La tournure « couvrir de haillons » conserve la métaphore vestimentaire tout en étant idiomatique en français.
- source_word: נוּמָה
  choice: la somnolence
  rationale: Le nom peut désigner la somnolence ou le sommeil assoupi; ici, « somnolence » exprime clairement l’inertie qui mène à la misère.
