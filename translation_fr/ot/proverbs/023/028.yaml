id: PRO.23.28
reference: Proverbs 23:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַף הִ֭יא כְּ/חֶ֣תֶף תֶּֽאֱרֹ֑ב וּ֝/בוֹגְדִ֗ים בְּ/אָדָ֥ם תּוֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
translation:
  language: fr
  text: Oui, elle se tient en embuscade comme un brigand[a] et multiplie les perfides parmi les humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un voleur ». Le mot hébreu חֶתֶף est rare et difficile; certains y voient plus généralement l’idée d’une saisie violente ou d’une attaque soudaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « parmi l’être humain »; le mot hébreu אָדָם est employé collectivement pour désigner l’humanité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Oui
  rationale: La particule a ici une valeur emphatique qui renforce l’affirmation précédente; « Oui » la rend naturellement sans la réduire à une simple addition.
- source_word: הִיא
  choice: elle
  rationale: Le pronom féminin singulier renvoie à la femme étrangère mentionnée dans le contexte immédiat.
- source_word: כְּחֶתֶף
  choice: comme un brigand
  rationale: חֶתֶף est un terme rare et difficile. Avec le verbe « se tenir en embuscade », le sens personnel de brigand ou de voleur violent convient bien à l’image prédatrice, tout en exigeant une note signalant l’incertitude.
- source_word: תֶּאֱרֹב
  choice: se tient en embuscade
  rationale: Le verbe ארב désigne l’action de guetter en vue d’une attaque; cette expression française conserve clairement cette nuance.
- source_word: וּבוֹגְדִים
  choice: les perfides
  rationale: בוגדים désigne ceux qui agissent avec déloyauté ou perfidie. « Les perfides » garde la portée morale générale du terme sans la limiter à la trahison politique ou à l’infidélité conjugale.
- source_word: בְּאָדָם
  choice: parmi les humains
  rationale: אָדָם est ici collectif et générique. « Parmi les humains » exprime en français moderne que l’ensemble de l’humanité est visé.
- source_word: תּוֹסִף
  choice: multiplie
  rationale: La forme causative de יסף signifie qu’elle augmente le nombre de personnes perfides; « multiplie » exprime ce résultat avec concision.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’image de l’embuscade est conservée, et l’incertitude du terme rare חֶתֶף est explicitement signalée en note.
