source:
  edition: WLC
  text: הָבִ֣יאָ/ה לַ/מּוּסָ֣ר לִבֶּ֑/ךָ וְ֝/אָזְנֶ֗/ךָ לְ/אִמְרֵי דָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/012.yaml
  text: Apply your heart to instruction[a], and your ear to words of knowledge.
translation:
  language: fr
  text: 'Applique ton cœur à l’instruction[a],

    et ton oreille aux paroles de connaissance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Amène ton cœur à la discipline, et ton oreille aux paroles de connaissance. »'
    reason: Alternative lexicale préservant le sens plus littéral de הָבִיאָה et la nuance disciplinaire de מוּסָר.
lexical_decisions:
- source_word: הָבִיאָה
  choice: Applique
  rationale: L’impératif causatif signifie littéralement « fais venir » ou « amène ». En français, « applique ton cœur à » exprime naturellement l’orientation volontaire demandée tout en conservant la force de l’impératif.
- source_word: לַמּוּסָר
  choice: à l’instruction
  rationale: מוּסָר peut désigner l’instruction, la discipline ou la correction. Son parallélisme avec les « paroles de connaissance » met ici en avant l’enseignement formateur; une note conserve l’autre nuance majeure.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Dans l’anthropologie hébraïque, le cœur englobe notamment la pensée et la volonté, et pas seulement les sentiments. Le terme français traditionnel reste clair dans ce contexte sapientiel.
- source_word: וְאָזְנֶךָ
  choice: et ton oreille
  rationale: Le singulier hébreu est maintenu. En français, cette image poétique évoque l’écoute attentive et répond au singulier « ton cœur ».
- source_word: לְאִמְרֵי
  choice: aux paroles de
  rationale: Le pluriel construit désigne des paroles ou des sentences. « Paroles » est naturel, digne et fidèle sans imposer le caractère proverbial que pourrait suggérer « sentences ».
- source_word: דָעַת
  choice: connaissance
  rationale: דַּעַת signifie directement « connaissance »; ce choix maintient le vocabulaire sapientiel et le parallélisme pédagogique du verset.
theological_decisions: []
