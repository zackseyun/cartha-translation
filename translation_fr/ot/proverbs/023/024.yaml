  text: גול יגול אֲבִ֣י צַדִּ֑יק יולד חָ֝כָ֗ם ו/ישמח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/024.yaml
  text: The father of a righteous man will greatly rejoice[b][a]; he who fathers a wise son will be glad in him.
translation:
  language: fr
  text: Le père d’un homme juste éprouvera une grande joie[a] ; celui qui engendre un fils sage[b] se réjouira à son sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « se réjouissant, il se réjouira ». Le redoublement du verbe intensifie la joie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui engendre un sage ». Dans ce membre de phrase, l’hébreu ne répète pas explicitement le mot « fils », bien que le contexte implique fortement ce sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גול יגול
  choice: éprouvera une grande joie
  rationale: La construction associant l’infinitif absolu au verbe conjugué intensifie l’idée de joie. Cette formulation rend naturellement cette insistance en français.
- source_word: אֲבִי צַדִּיק
  choice: le père d’un homme juste
  rationale: Le groupe construit désigne le père d’un individu juste. « Homme juste » conserve le masculin singulier et correspond au contexte filial du vers parallèle.
- source_word: צַדִּיק
  choice: homme juste
  rationale: « Juste » préserve la catégorie morale exprimée par l’hébreu, tandis que « homme » rend le masculin singulier dans ce contexte.
- source_word: יולד
  choice: celui qui engendre
  rationale: Le participe masculin de ילד désigne ici celui qui devient père en engendrant. « Engendre » est précis, digne et évite l’ambiguïté de « donne naissance ».
- source_word: חָכָם
  choice: un fils sage
  rationale: Le nom « fils » n’est pas exprimé dans ce membre de phrase, mais il est fortement impliqué par le parallélisme avec « père » et par le contexte parental. Une note préserve cette donnée formelle.
- source_word: וישמח בו
  choice: se réjouira en lui
  rationale: Cette traduction conserve le sens de שמח ainsi que la relation marquée par la préposition בו, sans réduire la joie à une simple causalité.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme poétique est conservé, avec une explicitation minimale de « fils » signalée en note et une formulation non technique de l’intensification verbale.
