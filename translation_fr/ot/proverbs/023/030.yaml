id: PRO.23.30
reference: Proverbs 23:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לַֽ/מְאַחֲרִ֥ים עַל הַ/יָּ֑יִן לַ֝/בָּאִ֗ים לַ/חְקֹ֥ר מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/030.yaml
  text: For those who linger over wine[a], for those who come to search out mixed wine.
translation:
  language: fr
  text: 'Pour ceux qui s’attardent à boire du vin,

    pour ceux qui viennent rechercher du vin mélangé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du vin aromatisé » ou « une boisson mélangée ». Le terme hébreu désigne une boisson préparée par mélange, probablement du vin auquel on ajoutait d’autres ingrédients.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים עַל הַיָּיִן
  choice: s’attardent à boire du vin
  rationale: Le participe exprime le fait de rester longtemps ou de prolonger son activité. Cette formulation française naturelle explicite l’occupation liée au vin sans ajouter l’idée d’ivresse.
- source_word: בָּאִים
  choice: viennent
  rationale: Rend directement le verbe « venir » et conserve son mouvement, sans le remplacer par l’idiome français possible « vont ».
- source_word: לַחְקֹר
  choice: rechercher
  rationale: Le verbe désigne une recherche attentive ou délibérée. « Rechercher » reste naturel ici et est plus marqué que le simple « chercher ».
- source_word: מִמְסָךְ
  choice: vin mélangé
  rationale: Le nom désigne une boisson, vraisemblablement du vin, préparée par mélange. « Vin mélangé » conserve la généralité du terme sans préciser indûment les ingrédients ni leur effet.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes. La tournure « s’attarder à boire du vin » évite le peu naturel « s’attarder sur le vin » tout en gardant l’idée d’une consommation prolongée.
