  yaml_path: translation/ot/proverbs/023/015.yaml
  text: My son[a], if your heart is wise, my heart also will rejoice.
translation:
  language: fr
  text: Mon fils, si ton cœur est sage, mon cœur aussi se réjouira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors moi aussi, je me réjouirai ». Littéralement : « mon cœur se réjouira, moi aussi » ; l’hébreu souligne ainsi personnellement le locuteur.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu signifie littéralement « mon fils » et constitue une adresse paternelle masculine fréquente dans les Proverbes.
- source_word: אִם
  choice: si
  rationale: La particule introduit une condition, sans exprimer nécessairement l’idée temporelle de « quand ».
- source_word: חָכַם
  choice: est sage
  rationale: Dans cette proposition conditionnelle, le verbe décrit naturellement l’état d’une personne qui possède la sagesse plutôt que le processus par lequel elle devient sage.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Le cœur désigne ici la personne intérieure, notamment son intelligence et sa volonté. Le terme est conservé afin de préserver l’image hébraïque et le parallélisme avec « mon cœur ».
- source_word: יִשְׂמַח
  choice: se réjouira
  rationale: 'L’imparfait hébreu exprime ici naturellement le résultat futur de la condition : la sagesse du fils provoquera la joie du père.'
- source_word: לִבִּי
  choice: mon cœur
  rationale: Cette formulation conserve l’image explicite du texte et le parallélisme poétique entre le cœur du fils et celui du père.
- source_word: גַם אֲנִי
  choice: à moi aussi
  rationale: 'La tournure française rattache l’insistance au locuteur tout en maintenant « mon cœur » comme sujet : c’est bien son propre cœur qui se réjouira.'
theological_decisions: []
