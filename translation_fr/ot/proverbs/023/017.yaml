  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
translation:
  language: fr
  text: Que ton cœur n’envie pas les pécheurs, mais qu’il soit dans la crainte de Yahweh tout au long du jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יְקַנֵּא
  choice: n’envie pas
  rationale: La tournure prohibitive est rendue naturellement en français. Dans ce contexte, קנא exprime l’envie éprouvée devant les pécheurs, plutôt qu’une simple jalousie relationnelle.
- source_word: לִבְּךָ
  choice: ton cœur
  rationale: Le terme hébreu est conservé afin de préserver l’image biblique du cœur comme siège des désirs et de l’orientation intérieure.
- source_word: בַּחַטָּאִים
  choice: les pécheurs
  rationale: Traduction directe et courante du nom désignant des personnes caractérisées par le péché.
- source_word: כִּי אִם
  choice: mais
  rationale: 'Ces particules marquent ici la correction contrastive : non pas l’envie des pécheurs, mais une orientation différente.'
- source_word: בְּיִרְאַת יְהוָה
  choice: dans la crainte de Yahweh
  rationale: La formulation garde l’expression théologique importante « crainte de Yahweh » sans la réduire à la seule révérence, et conserve le nom divin.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette expression française naturelle préserve l’idée d’une disposition maintenue pendant toute la journée.
theological_decisions:
- issue: Interprétation de la seconde proposition sans verbe explicite
  choice: qu’il demeure dans la crainte de Yahweh
  alternative: qu’il soit tout au long du jour plein de zèle pour la crainte de Yahweh
  rationale: L’hébreu est elliptique. « Demeure » exprime sobrement l’état durable suggéré par « tout au long du jour », tandis que la note conserve la possibilité de sous-entendre à nouveau le verbe קנא avec le sens positif d’« être plein de zèle ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure « Que ton cœur… » conserve l’image hébraïque sans paraître archaïque. Le nom divin est rendu par « Yahweh » conformément à la donnée source et à la couche de consultation.
