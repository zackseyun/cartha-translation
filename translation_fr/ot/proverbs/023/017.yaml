revisions:
- from: Que ton cœur n’envie pas les pécheurs, mais qu’il demeure[a] dans la crainte de Yahweh tout au long du jour.
  to: Que ton cœur n’envie pas les pécheurs, mais qu’il soit dans la crainte de Yahweh tout au long du jour.
  rationale: La révision remplace « demeure » par « soit », la suppléance française la plus sobre pour l’ellipse hébraïque, et retire une note qui surinterprète la construction et risque d’induire le lecteur en erreur. Le contraste, l’expression « crainte de Yahweh » et l’insistance temporelle sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:20Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement אַל יְקַנֵּא לִבְּךָ בַּחַטָּאִים. Dans la seconde, l’hébreu est une proposition elliptique qui appelle naturellement « qu’il soit » (ou une formulation équivalente). « Demeure » introduit légèrement l’idée de persévérer/continuer, sans être nécessairement exigée par le texte.
  naturalness: « Que ton cœur n’envie pas les pécheurs » est naturel dans un registre biblique moderne. « Qu’il soit dans la crainte de Yahweh » reste intelligible et rend l’ellipse sans alourdir le français.
  terminology: '« Pécheurs », « cœur », « crainte de Yahweh » et « Yahweh » respectent à la fois les termes source et les choix terminologiques fournis. La note proposée n’est pas appropriée : elle présente comme une autre traduction de la seconde proposition la reprise d’un verbe qui n’y figure pas explicitement et produit en outre une formulation française peu naturelle (« plein de zèle pour la crainte »).'
  issues:
  - severity: medium
    issue: Le verbe « demeure » dans la seconde proposition est interprétatif.
    rationale: Le syntagme hébreu « dans la crainte de Yahweh tout le jour » est elliptique; l’état « être » est la suppléance minimale. « Demeurer » explicite une continuité qui peut être suggérée par « tout le jour », mais qui n’est pas lexicalement exprimée.
  - severity: medium
    issue: La note a une portée lexicale et syntaxique trompeuse.
    rationale: Le verbe קנא apparaît dans la première proposition seulement. La note suggère une lecture où il gouvernerait la seconde et propose « plein de zèle pour la crainte », qui ne constitue ni une restitution minimale de l’ellipse ni un français naturel. Il vaut mieux ne pas créer cette ambiguïté en note.
  revised_text: Que ton cœur n’envie pas les pécheurs, mais qu’il soit dans la crainte de Yahweh tout au long du jour.
