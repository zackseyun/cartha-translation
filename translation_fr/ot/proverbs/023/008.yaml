  text: פִּֽתְּ/ךָ אָכַ֥לְתָּ תְקִיאֶ֑/נָּה וְ֝/שִׁחַ֗תָּ דְּבָרֶ֥י/ךָ הַ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/008.yaml
  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
translation:
  language: fr
  text: Tu vomiras la bouchée que tu as mangée, et tu auras gaspillé tes paroles agréables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aimables » ou « gracieuses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְּךָ
  choice: la bouchée
  rationale: פַּת désigne un morceau ou une bouchée de pain ou de nourriture. « La bouchée » conserve l’image concise sans préciser indûment qu’il s’agit de pain.
- source_word: אָכַלְתָּ
  choice: que tu as mangée
  rationale: Le qal accompli à la deuxième personne du masculin singulier présente l’action de manger comme déjà réalisée. Le passé composé est naturel en français dans la relative.
- source_word: תְקִיאֶנָּה
  choice: tu vomiras
  rationale: La forme issue de קיא signifie vomir et comporte un suffixe féminin renvoyant à la bouchée. En français, le complément est naturellement exprimé par la relative antécédente, sans répéter « la ».
- source_word: וְשִׁחַתָּ
  choice: et tu auras gaspillé
  rationale: Dans ce contexte, שׁחת indique que les paroles prononcées auront été dépensées en vain. Le futur antérieur rend clairement ce résultat sans imposer le sens moins idiomatique de « détruire des paroles ».
- source_word: דְּבָרֶיךָ
  choice: tes paroles
  rationale: Traduction directe du pluriel avec suffixe de deuxième personne ; elle préserve la concision proverbiale.
- source_word: הַנְּעִימִים
  choice: agréables
  rationale: L’adjectif désigne ce qui est plaisant, aimable ou gracieux. « Agréables » en garde la portée générale, tandis que d’autres nuances sont signalées en note.
theological_decisions: []
translation_notes:
  register: Tutoiement conforme à l’adresse individuelle au masculin singulier. Style proverbial, direct et actuel ; l’image volontairement forte de vomir est conservée. Le marqueur de note est placé après « paroles agréables », le terme auquel portent les variantes lexicales.
