id: PRO.23.29
reference: Proverbs 23:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/מִ֨י א֥וֹי לְ/מִ֪י אֲב֡וֹי לְ/מִ֤י מדונים לְ/מִ֥י שִׂ֗יחַ לְ֭/מִי פְּצָעִ֣ים חִנָּ֑ם לְ֝/מִ֗י חַכְלִל֥וּת עֵינָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/029.yaml
  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
translation:
  language: fr
  text: Pour qui le malheur ? Pour qui la détresse ? Pour qui les querelles ? Pour qui les plaintes ? Pour qui les blessures sans raison[a] ? Pour qui les yeux rougis[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les blessures pour rien ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les yeux injectés de sang » ; l’expression hébraïque décrit l’apparence altérée des yeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: le malheur
  rationale: Rend avec concision l’idée de détresse ou de calamité, tout en gardant la force de la série proverbiale.
- source_word: אֲבוֹי
  choice: la détresse
  rationale: Distingue ce deuxième cri de lamentation du premier sans effacer leur parallélisme étroit.
- source_word: מְדֹונִים
  choice: les querelles
  rationale: Le pluriel désigne des conflits répétés; « querelles » est concret et naturel en français courant.
- source_word: שִׂיחַ
  choice: les plaintes
  rationale: Le terme peut évoquer la plainte, le discours ou la méditation troublée; « plaintes » convient au contexte sans préciser indûment qu’il s’agit de paroles incohérentes.
- source_word: פְּצָעִים
  choice: les blessures
  rationale: Équivalent direct et concret pour des lésions corporelles.
- source_word: חִנָּם
  choice: sans raison
  rationale: Exprime le caractère gratuit, injustifié ou inutile des blessures; « pour rien » reste une possibilité idiomatique.
- source_word: חַכְלִלוּת עֵינָיִם
  choice: les yeux rougis
  rationale: Conserve l’image hébraïque d’une apparence altérée des yeux sans imposer une description médicale trop précise.
- source_word: לְמִי
  choice: Pour qui
  rationale: Reproduit la question hébraïque répétée et sa cadence rhétorique plus directement que « Qui a… ? » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et rythmé. La répétition de « Pour qui » préserve la structure interrogative et l’effet cumulatif de l’hébreu. « Détresse » et « plaintes » maintiennent l’ambiguïté des termes de lamentation sans ajouter une interprétation confessionnelle.
