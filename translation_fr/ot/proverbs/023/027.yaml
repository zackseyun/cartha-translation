  yaml_path: translation/ot/proverbs/023/027.yaml
  text: For a prostitute is a deep pit[a], and a foreign woman is a narrow well.
translation:
  language: fr
  text: 'Car la prostituée est une fosse profonde,

    et la femme étrangère[a] un puits étroit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la femme inconnue »; certains traduisent de façon plus interprétative : « la femme adultère ».'
    reason: Alternative lexicale traditionnelle pour נָכְרִיָּה; « femme adultère » explicite interprétativement une connotation contextuelle possible.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’avertissement précédent et conserve naturellement la valeur explicative de l’hébreu.
- source_word: שׁוּחָה עֲמֻקָּה
  choice: une fosse profonde
  rationale: « Fosse » rend l’idée d’une cavité dangereuse, tandis que « profonde » préserve directement l’image concrète et le parallélisme.
- source_word: זוֹנָה
  choice: la prostituée
  rationale: Terme français actuel et précis pour une femme qui se prostitue, sans recourir à un mot archaïque ou inutilement injurieux.
- source_word: וּבְאֵר צָרָה
  choice: et … un puits étroit
  rationale: « Puits » correspond au sens ordinaire de בְּאֵר, et « étroit » maintient l’image d’un espace resserré dont il est difficile de sortir.
- source_word: נָכְרִיָּה
  choice: la femme étrangère
  rationale: Reproduit le sens lexical premier tout en laissant ouverte la portée sociale et morale particulière que l’expression peut avoir dans les Proverbes; une note signale la lecture interprétative courante.
theological_decisions:
- issue: Portée de נָכְרִיָּה dans les avertissements sapientiaux
  choice: la femme étrangère
  alternative: la femme adultère
  rationale: Le mot désigne littéralement une femme étrangère ou extérieure au groupe, mais il prend souvent dans les Proverbes une connotation de séduction sexuelle illicite. Le texte principal conserve cette tension au lieu de préciser d’emblée « adultère ».
translation_notes:
  register: Français international moderne, sobre et proverbial. L’ellipse du verbe « est » dans le second membre conserve le parallélisme poétique tout en restant naturelle en français. Le marqueur de note est placé après l’expression qu’il explique.
