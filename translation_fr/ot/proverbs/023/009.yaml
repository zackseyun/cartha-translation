  text: בְּ/אָזְנֵ֣י כְ֭סִיל אַל תְּדַבֵּ֑ר כִּֽי יָ֝ב֗וּז לְ/שֵׂ֣כֶל מִלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/009.yaml
  text: Do not speak in the hearing of a fool[b][a], for he will despise the wisdom of your words.
translation:
  language: fr
  text: Ne parle pas devant un insensé[a], car il méprisera le bon sens[b] de tes paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux oreilles d’un insensé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la perspicacité » ; « le discernement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: à portée d’oreille de
  rationale: L’expression hébraïque signifie littéralement « aux oreilles de ». La formulation française conserve l’image de l’audition tout en exprimant naturellement le fait de parler de manière à être entendu.
- source_word: כְסִיל
  choice: un insensé
  rationale: Dans les Proverbes, le terme désigne une personne moralement et intellectuellement réfractaire, et non quelqu’un qui manque simplement d’intelligence. « Insensé » conserve cette portée sapientiale.
- source_word: אַל תְּדַבֵּר
  choice: Ne parle pas
  rationale: Rend directement et sobrement la prohibition hébraïque.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction dans le style concis d’un proverbe.
- source_word: יָב֗וּז
  choice: il méprisera
  rationale: Le verbe exprime un rejet empreint de mépris; « mépriser » en restitue clairement la force.
- source_word: לְ/שֵׂכֶל
  choice: le bon sens
  rationale: שֵׂכֶל peut désigner la perspicacité, le discernement ou le bon sens. Ici, « bon sens » s’accorde naturellement avec « de tes paroles » sans élargir indûment le terme à toute la sagesse.
- source_word: מִלֶּֽי/ךָ
  choice: de tes paroles
  rationale: Conserve le pluriel concret et la relation génitive de l’hébreu.
