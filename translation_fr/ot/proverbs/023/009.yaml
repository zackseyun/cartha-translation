review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est correctement rendu : la défense de parler devant/à portée d’un כסיל et le motif selon lequel celui-ci méprisera le שכל exprimé par les paroles. « Bon sens » rend bien שכל ici, sans le surtraduire en « sagesse ». Toutefois, « à portée d’oreille » désigne surtout une distance ou une proximité acoustique et peut suggérer qu’on ne s’adresse pas à l’insensé. « Devant » est plus idiomatique dans un proverbe français et rend sans surcharge l’emploi hébreu « dans les oreilles de », dont la note conserve l’image littérale.'
