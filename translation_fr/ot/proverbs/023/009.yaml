  terminology: « Insensé » convient au terme sapientiel כסיל, qui renvoie à une personne obstinée et moralement réfractaire, non à une simple déficience intellectuelle. « Bon sens » est une option naturelle et suffisamment précise pour שכל. Les alternatives de la note sont maintenues, avec une ponctuation clarifiée.
