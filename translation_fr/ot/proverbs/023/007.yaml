source:
  edition: WLC
  text: כִּ֤י כְּמוֹ שָׁעַ֥ר בְּ/נַפְשׁ֗/וֹ כֶּ֫ן ה֥וּא אֱכֹ֣ל וּ֭/שְׁתֵה יֹ֣אמַר לָ֑/ךְ וְ֝/לִבּ֗/וֹ בַּל עִמָּֽ/ךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/007.yaml
  text: 'For as he calculates within himself[a], so he is: “Eat and drink,” he says to you, but his heart is not with you.'
translation:
  language: fr
  text: Car tel qu’il calcule en lui-même, tel il est[a]. « Mange et bois », te dit-il, mais son cœur n’est pas avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car tel qu’il pense en lui-même, tel il est. » Le verbe hébreu peut signifier « penser », mais il évoque plus précisément le fait d’évaluer ou de calculer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la mise en garde donnée par le contexte immédiat.
- source_word: כְּמוֹ ... כֵּן
  choice: tel que
  rationale: Rend la corrélation comparative de façon concise et naturelle en français.
- source_word: שָׁעַר
  choice: calcule
  rationale: Le verbe évoque ici une estimation ou un calcul intérieur, probablement celui du coût, plutôt qu’une simple pensée générale.
- source_word: בְּנַפְשׁוֹ
  choice: au fond de lui-même
  rationale: נֶפֶשׁ désigne ici l’être intérieur; cette formulation française exprime le caractère privé de son calcul sans imposer un sens technique à « âme ».
- source_word: כֵּן הוּא
  choice: il est tel
  rationale: Conserve l’affirmation concise selon laquelle son calcul intérieur révèle ce qu’il est réellement.
- source_word: אֱכֹל וּשְׁתֵה
  choice: Mange et bois !
  rationale: Traduit directement les impératifs de l’invitation et maintient leur contraste avec les dispositions réelles de l’hôte.
- source_word: יֹאמַר לָךְ
  choice: te dit-il
  rationale: Le présent convient au caractère général et proverbial de l’énoncé.
- source_word: וְלִבּוֹ בַּל עִמָּךְ
  choice: mais son cœur n’est pas avec toi
  rationale: La conjonction prend une valeur adversative en contexte; « cœur » et « avec toi » préservent l’image et le contraste relationnel de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme comparatif et la tension entre l’invitation prononcée et les dispositions intérieures de l’hôte.
