  verdict: revise
  source_fidelity: 'Le sens fondamental est bien visé : le calcul intérieur révèle la véritable disposition de cet homme, contrairement à son invitation verbale. Toutefois, la construction française proposée ne rend pas correctement la corrélation comparative hébraïque כְּמוֹ...כֵּן (« tel que... tel » / « comme... ainsi »).'
  naturalness: '« Car il est tel que ce qu’il calcule au fond de lui-même » n’est pas une formulation française idiomatique ni grammaticalement satisfaisante : « tel que ce qu’il calcule » ne peut pas porter le sens de « comme il calcule en lui-même, ainsi est-il ». La révision rétablit une tournure proverbiale naturelle et concise.'
