review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : l''instruction imagée de se maîtriser au repas et la condition liée à un appétit marqué sont conservées. Toutefois, « sur ta gorge » est moins idiomatique et un peu moins précis que « à ta gorge » dans cette image. La note présente aussi de façon trop mécanique le littéral de בַּעַל נֶפֶשׁ.'
  naturalness: « Mets un couteau à ta gorge » est l'expression française usuelle pour cette image volontairement saisissante. « Si tu as un grand appétit » est naturel, direct et convient au contexte alimentaire, tout en laissant la note signaler la portée plus large de l'idiome.
  terminology: '« Appétit » convient ici à נֶפֶשׁ dans son contexte. La note doit distinguer le sens littéral, « maître/propriétaire d''une âme, d''un désir », de la valeur contextuelle : une personne gouvernée par ses désirs, notamment alimentaires.'
  issues:
