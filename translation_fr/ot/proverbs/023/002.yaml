- from: et mets un couteau sur ta gorge, si tu es dominé par ton appétit.[a]
  to: Et mets un couteau à ta gorge, si tu as un grand appétit[a].
  rationale: La révision emploie la tournure française naturelle « à ta gorge » et clarifie la note sur l'idiome בעל נפש. Elle conserve l'avertissement hyperbolique, la condition introduite par אִם et l'application contextuelle à l'appétit, sans réduire le sens lexical de l'idiome à la seule gloutonnerie.
