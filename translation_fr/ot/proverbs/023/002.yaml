    issue: Formulation de la localisation du couteau
    rationale: « Sur ta gorge » est compréhensible, mais « à ta gorge » est la tournure française idiomatique qui rend le mieux l'image de mettre un couteau contre sa gorge.
  - severity: medium
    issue: Note lexicale trop littérale et syntaxiquement imprécise
    rationale: « Maître d'un appétit/désir » ne rend pas exactement בעל נפש (« maître/propriétaire d'une âme, d'un désir ») et la condition « si tu es » ne fait pas partie du groupe nominal lui-même. Une note révisée évite de présenter une paraphrase contextuelle comme un littéral.
  revised_text: Et mets un couteau à ta gorge, si tu as un grand appétit[a].
