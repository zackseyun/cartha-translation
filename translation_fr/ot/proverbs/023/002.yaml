source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שַׂכִּ֣ין בְּ/לֹעֶ֑/ךָ אִם בַּ֖עַל נֶ֣פֶשׁ אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/002.yaml
  text: and put a knife to your throat if you are a man of appetite[a].
translation:
  language: fr
  text: Et mets un couteau à ta gorge, si tu as un grand appétit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si tu es porté à la gourmandise ». Littéralement, « si tu es maître/propriétaire d'un désir » ; l'expression désigne ici une personne dominée par de forts désirs, en particulier par l'appétit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  choice: et mets
  rationale: Le waw suivi du parfait qal à la 2e personne du masculin singulier poursuit l’instruction du verset précédent avec une valeur proche de l’impératif. « Et mets » conserve cet enchaînement.
- source_word: שַׂכִּין
  choice: un couteau
  rationale: Le nom désigne simplement un couteau et maintient l’image volontairement saisissante de l’avertissement.
- source_word: בְּ/לֹעֶךָ
  choice: sur ta gorge
  rationale: לֹעַ désigne la gorge ou le gosier. Après « mettre », « sur ta gorge » est naturel en français et conserve l’image sans suggérer que le couteau est placé à l’intérieur de la gorge.
- source_word: אִם
  choice: si
  rationale: La particule introduit la condition dans laquelle l’avertissement s’applique.
- source_word: בַּעַל נֶפֶשׁ
  choice: dominé par ton appétit
  rationale: L’expression signifie littéralement « maître/propriétaire de souffle, désir ou appétit ». Dans le contexte d’un repas, elle décrit quelqu’un mû par un fort appétit. La formulation choisie rend naturellement cette emprise sans réduire nécessairement le sens à la gloutonnerie.
- source_word: אָתָּה
  choice: tu es
  rationale: Le pronom indépendant explicite et souligne le sujet dans la proposition conditionnelle.
