  text: ה/תעוף עֵינֶ֥י/ךָ בּ֗/וֹ וְֽ/אֵ֫ינֶ֥/נּוּ כִּ֤י עָשֹׂ֣ה יַעֲשֶׂה לּ֣/וֹ כְנָפַ֑יִם כְּ֝/נֶ֗שֶׁר ו/עיף הַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/005.yaml
  text: Will you let your eyes fly to it[a], and it is gone? For it surely makes wings for itself; like an eagle, it flies to the heavens.
translation:
  language: fr
  text: À peine as-tu posé les yeux sur la richesse qu’elle n’est déjà plus là ? Car elle se fait bel et bien des ailes et, comme un aigle[a], s’envole vers le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un vautour » ; le mot hébreu peut désigner plus largement un grand rapace.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָעוּף עֵינֶיךָ בּוֹ
  choice: À peine portes-tu les yeux sur la richesse
  rationale: La forme causative de עוּף évoque littéralement le fait de faire voler les yeux vers quelque chose. « Porter les yeux sur » restitue en français courant l’idée de diriger rapidement son regard, tandis que « à peine » prépare la disparition immédiate exprimée ensuite. « La richesse » explicite le référent du pronom masculin בּוֹ dans le contexte précédent.
- source_word: וְאֵינֶנּוּ
  choice: qu’elle n’est déjà plus là
  rationale: L’expression signifie littéralement « et elle n’est pas ». Cette formulation française exprime naturellement la disparition soudaine de la richesse; « déjà » rend sensible sa rapidité sans modifier le sens.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication imagée de cette disparition.
- source_word: עָשֹׂה יַעֲשֶׂה לּוֹ כְנָפַיִם
  choice: elle se fait des ailes
  rationale: L’infinitif absolu suivi de l’imparfait renforce le verbe. La tournure concise « se fait des ailes » conserve l’image et la valeur réflexive de לּוֹ; le contexte et l’enchaînement expriment naturellement la certitude.
- source_word: כְנֶשֶׁר
  choice: comme un aigle
  rationale: נֶשֶׁר désigne un grand rapace et est traditionnellement rendu par « aigle ». L’identification zoologique pouvant aussi orienter vers un vautour, cette possibilité est signalée en note.
- source_word: וְעָף הַשָּׁמָיִם
  choice: s’envole vers le ciel
  rationale: « S’envole » exprime clairement le départ soudain suggéré par עוּף, et « le ciel » rend naturellement le pluriel hébreu הַשָּׁמָיִם dans ce contexte poétique sans lui donner un sens doctrinal.
theological_decisions: []
