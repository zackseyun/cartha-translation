  naturalness: « À peine as-tu posé les yeux sur la richesse qu’elle n’est déjà plus là ? » est une formulation moderne, claire et idiomatique, tout en gardant le tour interrogatif énergique du texte. « Bel et bien » exprime naturellement l’insistance verbale sans alourdir le verset.
