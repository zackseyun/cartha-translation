source:
  edition: WLC
  text: אַל תִּיגַ֥ע לְֽ/הַעֲשִׁ֑יר מִֽ/בִּינָתְ/ךָ֥ חֲדָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/004.yaml
  text: Do not wear yourself out to get rich[a]; stop relying on your own understanding.
translation:
  language: fr
  text: Ne t’épuise pas à devenir riche[a] ; cesse de te fier à ta propre intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne peine pas pour t’enrichir ; cesse de compter sur ta propre sagesse. » Selon une autre analyse : « Par discernement, renonce à cette quête. »'
    reason: 'L’hébreu de la seconde proposition est très concis : מִבִּינָתְךָ peut désigner ce dont il faut cesser de dépendre ou, selon une autre analyse, le discernement qui conduit à renoncer à la recherche de la richesse.'
lexical_decisions:
- source_word: אַל תִּיגַע
  choice: Ne t’épuise pas
  rationale: La négation אַל introduit une défense, et יגע évoque un effort qui fatigue ou épuise. Cette formulation rend clairement la vigueur de l’avertissement.
- source_word: לְהַעֲשִׁיר
  choice: à devenir riche
  rationale: 'L’infinitif hiphil de עשר exprime ici le but de l’effort épuisant : acquérir la richesse ou devenir riche.'
- source_word: מִבִּינָתְךָ חֲדָל
  choice: cesse de te fier à ta propre intelligence
  rationale: חדל commande de cesser ou de renoncer, tandis que בינה désigne l’intelligence ou le discernement. Avec מִן, la tournure française naturelle explicite l’idée de ne plus prendre sa propre intelligence pour appui, sans faire de l’intelligence elle-même un mal.
theological_decisions:
- issue: Portée du second membre
  choice: cesse de te fier à ta propre intelligence
  alternative: 'renonce à ta propre intelligence ; ou : dans ton discernement, renonce'
  rationale: L’hébreu est condensé et permet plusieurs nuances. Le texte principal rend l’avertissement contre la confiance en son propre discernement dans la recherche de la richesse, tandis que la note conserve la formulation plus littérale et l’autre analyse possible sans supprimer la tension du texte.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse individuelle du proverbe. « Devenir riche » est plus neutre et soutenu que « s’enrichir » ou « devenir fortuné », tandis que « t’épuise » conserve l’image d’un effort usant.
