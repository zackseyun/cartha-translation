  text: אַל תִּ֭תְאָו לְ/מַטְעַמּוֹתָ֑י/ו וְ֝/ה֗וּא לֶ֣חֶם כְּזָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
translation:
  language: fr
  text: 'Ne désire pas ses mets savoureux,

    car c’est une nourriture trompeuse.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « pain de mensonges ».'
    reason: Conserve l’image littérale et le pluriel de l’hébreu, tandis que le texte emploie une formulation française idiomatique.
lexical_decisions:
- source_word: אַל תִּתְאָו
  choice: Ne convoite pas
  rationale: La négation אַל avec l’inaccompli exprime une interdiction. « Convoiter » rend ici le désir intense suscité par ces mets sans donner au verbe une connotation exclusivement sexuelle.
- source_word: לְמַטְעַמּוֹתָיו
  choice: ses mets raffinés
  rationale: Le nom désigne des aliments savoureux ou recherchés. « Mets raffinés » est naturel en français et convient au repas prestigieux évoqué par le contexte.
- source_word: וְהוּא
  choice: car c’est
  rationale: Le pronom hébreu est masculin singulier et peut reprendre collectivement ce qui vient d’être mentionné. « Car » explicite la valeur justificative naturelle de la seconde proposition, tandis que « c’est » conserve le singulier du texte source.
- source_word: לֶחֶם
  choice: une nourriture
  rationale: Bien que le sens premier soit « pain », לֶחֶם peut désigner la nourriture en général; ce sens large convient mieux aux mets du contexte.
- source_word: כְּזָבִים
  choice: trompeuse
  rationale: Le pluriel « mensonges/tromperies » qualifie la nourriture. « Trompeuse » communique clairement en français son caractère mensonger sans préciser abusivement la nature du piège.
theological_decisions:
- issue: Référent et portée de « nourriture trompeuse »
  choice: Maintenir une formulation générale qui caractérise le repas comme trompeur
  alternative: Préciser que l’hôte lui-même cherche à tromper son invité
  rationale: Le verset qualifie littéralement la nourriture de « pain de mensonges »; il suggère une intention cachée sans l’expliciter. La traduction ne doit pas résoudre cette tension au-delà du texte.
translation_notes:
  register: Français international moderne, concis et digne. « Mets raffinés » garde la dimension attirante d’un repas prestigieux; la note préserve l’image littérale, inhabituelle mais expressive, de « pain de mensonges ».
