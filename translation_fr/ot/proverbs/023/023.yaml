  text: אֱמֶ֣ת קְ֭נֵה וְ/אַל תִּמְכֹּ֑ר חָכְמָ֖ה וּ/מוּסָ֣ר וּ/בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/023.yaml
  text: Buy truth[a], and do not sell wisdom, instruction[c][b], and understanding.
translation:
  language: fr
  text: 'Achète la vérité[a] et ne la vends pas : sagesse, instruction[b] et discernement[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Acquiers la vérité ». Le verbe hébreu peut signifier « acheter » ou, plus largement, « acquérir » ; « achète » conserve l’image commerciale qui répond à « ne la vends pas ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « instruction » peut aussi désigner la discipline ou la correction.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « compréhension » ou « intelligence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: la vérité
  rationale: Dans cette exhortation sapientielle, אֱמֶת désigne naturellement la vérité, avec des connotations possibles de fiabilité et de fidélité.
- source_word: קְנֵה
  choice: achète
  rationale: Le sens concret « acheter » maintient l’image commerciale voulue, en opposition directe à « ne vends pas ».
- source_word: וְאַל תִּמְכֹּר
  choice: et ne la vends pas
  rationale: Cette formulation conserve la coordination et l’antithèse concise de l’hébreu. Le pronom reprend la vérité, seul objet explicitement antéposé avant le verbe « vendre ».
- source_word: חָכְמָה
  choice: acquiers la sagesse
  rationale: « Sagesse » est l’équivalent usuel de חָכְמָה dans les Proverbes. La répétition implicite du verbe קנה est explicitée en français pour éviter que la sagesse, l’instruction et l’intelligence ne paraissent être les objets de « vendre ».
- source_word: מוּסָר
  choice: l’instruction
  rationale: מוּסָר peut englober instruction, discipline et correction. « Instruction » convient au contexte sans réduire le terme à une sanction punitive.
- source_word: בִינָה
  choice: l’intelligence
  rationale: בִינָה évoque la faculté de comprendre et de discerner. « Intelligence » est ici naturel et digne, tandis que la note conserve les autres nuances possibles.
theological_decisions:
- issue: Portée syntaxique de « ne vends pas » et ellipse de קנה
  choice: Faire reprendre « la vérité » par un pronom, puis expliciter « acquiers » devant les trois qualités sapientielles.
  alternative: « Achète la vérité et ne vends pas la sagesse, l’instruction et l’intelligence. »
  rationale: L’hébreu place « vérité » comme objet de קנה, puis enchaîne « ne vends pas », avant une liste nominale. La ponctuation et la portée exactes peuvent être discutées. La formulation retenue rend le parallélisme commercial intelligible en français et comprend les trois derniers noms comme poursuivant l’exhortation à acquérir, sans transformer le verset en interdiction étrange de vendre seulement ces qualités.
translation_notes:
  register: Français international moderne, concis et proverbial. Le point-virgule marque les deux mouvements de l’exhortation. L’explicitation de « acquiers » favorise une lecture naturelle tout en maintenant la tension syntaxique dans les notes de décision.
