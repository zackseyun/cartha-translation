source:
  edition: WLC
  text: שְׁמַע אַתָּ֣ה בְנִ֣/י וַ/חֲכָ֑ם וְ/אַשֵּׁ֖ר בַּ/דֶּ֣רֶךְ לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/019.yaml
  text: Listen[a], my son, and be wise, and direct your heart in the way.
translation:
  language: fr
  text: Écoute, mon fils, et sois sage ; dirige ton cœur dans le chemin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif appelle à une écoute attentive et obéissante, au-delà de la simple perception auditive.
- source_word: בְנִי
  choice: mon fils
  rationale: Le vocatif hébreu est explicitement masculin singulier et correspond au cadre de l’instruction sapientielle.
- source_word: וַחֲכָם
  choice: et sois sage
  rationale: Cette formulation concise restitue naturellement en français la force exhortative de l’impératif.
- source_word: וְאַשֵּׁר
  choice: dirige
  rationale: Le piel exprime ici l’action d’orienter ou de maintenir droit ; « dirige » convient au complément métaphorique « ton cœur ».
- source_word: בַּדֶּרֶךְ
  choice: dans le droit chemin
  rationale: דרך désigne le chemin, souvent comme métaphore de la conduite. L’adjectif « droit » explicite toutefois une valeur qui n’est pas exprimée lexicalement dans ce groupe nominal.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: « Cœur » conserve la métaphore hébraïque englobant pensée, volonté et désirs.
theological_decisions:
- issue: Adresse filiale genrée dans l’enseignement de sagesse
  choice: mon fils
  alternative: mon enfant
  rationale: L’hébreu est masculin singulier ; la traduction conserve cette forme sans la neutraliser.
- issue: Caractérisation morale du chemin
  choice: dans le droit chemin
  alternative: dans le chemin / sur le chemin
  rationale: Le contexte sapientiel suggère le bon chemin, mais l’hébreu dit littéralement « dans le chemin » sans adjectif ; l’alternative préserve mieux cette indétermination.
translation_notes:
  register: Français moderne, simple et digne. La ponctuation met en relief les deux exhortations. « Le droit chemin » est idiomatique, mais plus explicite que l’hébreu ; la note signale cette différence.
