  text: אַ֭תָּה בַּ/שֵּׁ֣בֶט תַּכֶּ֑/נּוּ וְ֝/נַפְשׁ֗/וֹ מִ/שְּׁא֥וֹל תַּצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/014.yaml
  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
translation:
  language: fr
  text: Toi, tu le frapperas avec le bâton, et tu délivreras sa vie[a] du Shéol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme ». Le mot hébreu néfesh peut désigner la vie, la personne elle-même ou l’âme, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Le Shéol est le terme hébreu désignant le séjour des morts ; autre traduction possible : « la tombe ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  choice: avec la verge
  rationale: שֵׁבֶט désigne ici l’instrument concret de la discipline parentale. « Verge » conserve ce sens et le registre proverbial, sans réduire le mot à une simple métaphore.
- source_word: תַּכֶּנּוּ
  choice: tu le frapperas
  rationale: Le hifil de נכה exprime directement l’action de frapper. Cette formulation reste plus proche de l’hébreu que « tu le corrigeras » et moins excessive que « tu le battras ».
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l’âme. En relation avec le Shéol, « sa vie » rend naturellement l’idée d’être préservé de la mort, sans imposer une anthropologie particulière.
- source_word: מִשְּׁאוֹל
  choice: du Shéol
  rationale: La translittération préserve le concept hébreu du séjour des morts au lieu de le réduire à la seule tombe. Une note en précise le sens.
- source_word: תַּצִּיל
  choice: tu délivreras
  rationale: Le hifil de נצל signifie délivrer ou arracher au danger. « Délivrer » convient au ton solennel et s’emploie naturellement avec « du Shéol ».
theological_decisions:
- issue: Sens de נֶפֶשׁ en relation avec le Shéol
  choice: sa vie
  alternative: son âme
  rationale: Le proverbe présente la correction comme préservant l’enfant d’une voie menant à la mort. « Sa vie » rend bien l’idiome contextuel, tandis que la note maintient l’autre possibilité lexicale sans trancher une question de distinction entre âme et corps.
translation_notes:
  register: Français international moderne, digne et direct. L’accentuation du pronom אַתָּה est rendue par « Toi, tu ». « Verge » maintient l’image concrète traditionnelle de la discipline, tandis que les notes préservent l’étendue sémantique de néfesh et de Shéol.
