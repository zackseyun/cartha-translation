  text: כִּ֭י אִם יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/018.yaml
  text: For surely there is a future[a], and your hope will not be cut off.
translation:
  language: fr
  text: Car il y a bien un avenir[a], et ton espérance ne sera pas anéantie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une issue » ou « une fin » ; le mot hébreu peut désigner la fin, l’issue ou l’avenir. Ici, « avenir » convient au contexte d’attente confiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car… bien
  rationale: Cette tournure garde à la fois le lien explicatif avec le verset précédent et la valeur emphatique de l’expression hébraïque, sans introduire une condition trompeuse.
- source_word: יֵשׁ
  choice: il y a
  rationale: Formulation existentielle naturelle en français moderne.
- source_word: אַחֲרִית
  choice: un avenir
  rationale: Le mot peut désigner la fin, l’issue ou l’avenir. Dans ce contexte d’attente confiante, « avenir » rend naturellement la perspective positive tout en signalant l’alternative en note.
- source_word: וְתִקְוָתְךָ
  choice: et ton espérance
  rationale: « Espérance » exprime ici une attente confiante et s’accorde au registre sapiential et digne du passage.
- source_word: לֹא תִכָּרֵת
  choice: ne sera pas anéantie
  rationale: Le nifal de כרת signifie littéralement « être retranché/coupé ». Appliquée à l’espérance, la tournure française « ne sera pas anéantie » transmet clairement l’idée qu’elle ne prendra pas fin, sans l’étrangeté de « ne sera pas coupée ».
