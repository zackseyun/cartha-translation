source:
  edition: WLC
  text: כִּֽי גֹאֲלָ֥/ם חָזָ֑ק הֽוּא יָרִ֖יב אֶת רִיבָ֣/ם אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/011.yaml
  text: for their Redeemer is strong[a]; he will plead their case against you.
translation:
  language: fr
  text: car leur rédempteur est puissant[a] ; il plaidera leur cause contre toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur proche parent chargé de les défendre » ou « leur défenseur ». Le mot hébreu désigne celui qui intervient pour racheter, défendre ou faire justice pour un membre de sa famille.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction formulée au verset précédent et en conserve clairement la valeur causale.
- source_word: גֹאֲלָם
  choice: leur rédempteur
  rationale: Le terme désigne celui qui assume le devoir de racheter, de défendre ou de faire justice à un membre de sa famille. « Rédempteur » conserve ici à la fois la portée juridique, protectrice et théologique.
- source_word: חָזָק
  choice: puissant
  rationale: Exprime la force et la capacité effective d’intervenir. « Puissant » convient au registre proverbial et à l’action judiciaire décrite ensuite.
- source_word: הוּא
  choice: il
  rationale: Le pronom indépendant souligne que c’est bien le rédempteur lui-même qui agira ; le pronom explicite français maintient naturellement cette reprise emphatique.
- source_word: יָרִיב אֶת רִיבָם
  choice: il défendra leur cause
  rationale: La construction avec le verbe et le nom de même racine évoque une contestation judiciaire. Cette formulation française naturelle restitue l’idée de prendre leur parti et de plaider leur cause.
- source_word: אִתָּךְ
  choice: contre toi
  rationale: Dans ce contexte judiciaire et adversatif, la préposition marque la personne contre laquelle le rédempteur soutiendra leur cause.
theological_decisions:
- issue: Rendu de גֹאֵל dans ce contexte de sagesse
  choice: rédempteur
  alternative: proche parent chargé de les défendre ; défenseur
  rationale: « Rédempteur » préserve l’épaisseur juridique et théologique du terme sans réduire son rôle au seul rachat économique ni préciser davantage que l’hébreu l’identité du protecteur.
translation_notes:
  register: Français international moderne, digne et accessible. « Défendra leur cause » rend naturellement l’image judiciaire, tandis que « rédempteur » conserve la résonance particulière du terme hébreu.
