  text: אַ֭חֲרִית/וֹ כְּ/נָחָ֣שׁ יִשָּׁ֑ךְ וּֽ/כְ/צִפְעֹנִ֥י יַפְרִֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/032.yaml
  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
translation:
  language: fr
  text: À la fin[a], il mord comme un serpent et, comme une vipère, il répand son venin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « sa fin » : il s’agit de l’issue finale du vin décrit dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Le dernier verbe hébreu est difficile à interpréter. Il peut évoquer le fait de répandre ou d’injecter du venin; on le rend aussi traditionnellement par « pique » ou « frappe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  choice: À la fin
  rationale: אַחֲרִיתוֹ désigne ici l’issue finale du vin évoqué dans le contexte. « À la fin » est naturel en français et conserve cette idée de conséquence ultime.
- source_word: כְּנָחָשׁ
  choice: comme un serpent
  rationale: נָחָשׁ est le terme courant pour un serpent. « Serpent » est le nom générique naturel en français, sans précision zoologique indue.
- source_word: יִשָּׁךְ
  choice: il mord
  rationale: Le verbe נשׁך signifie « mordre ». Le présent convient à la portée générale et proverbiale de l’énoncé; le pronom renvoie au vin du contexte.
- source_word: וּכְצִפְעֹנִי
  choice: et comme une vipère
  rationale: צִפְעֹנִי désigne un serpent venimeux. « Vipère » est clair, courant et adapté au parallélisme.
- source_word: יַפְרִשׁ
  choice: frappe
  rationale: Ce verbe est lexicalement difficile. « Frappe » rend avec prudence l’attaque du serpent venimeux sans lui attribuer l’action de « piquer », moins exacte en français pour un serpent; les autres analyses sont signalées en note.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le présent conserve la forme proverbiale. La traduction maintient le parallélisme entre la morsure du serpent et l’attaque de la vipère, tout en signalant l’incertitude du dernier verbe.
