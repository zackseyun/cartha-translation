  text: אַל תִּלְחַ֗ם אֶת לֶ֭חֶם רַ֣ע עָ֑יִן וְ/אַל תתאו לְ/מַטְעַמֹּתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/006.yaml
  text: Do not eat the bread of a man with an evil eye[a], and do not crave his delicacies.
translation:
  language: fr
  text: Ne mange pas le pain d’un homme avare[a] et ne convoite pas ses mets délicats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain d’un homme à l’œil mauvais ». Cette expression hébraïque désigne une personne avare, mesquine ou qui donne à contrecœur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּלְחַם
  choice: mange
  rationale: Avec לֶחֶם, le verbe désigne ici l’action de manger, et non l’homographe signifiant « combattre ». « Mange » exprime directement le sens dans ce contexte.
- source_word: לֶחֶם
  choice: pain
  rationale: Le nom signifie littéralement « pain » et peut, par métonymie, désigner la nourriture ou le repas. Conserver « pain » préserve l’image hébraïque.
- source_word: רַע עָיִן
  choice: l’homme au regard mauvais
  rationale: L’expression hébraïque est littéralement « mauvais d’œil » et désigne ici une personne avare, mesquine ou qui donne à contrecœur. La formulation française conserve l’image, tandis que la note en explicite le sens idiomatique.
- source_word: תתאו
  choice: convoite
  rationale: La forme exprime un désir appuyé. « Convoite » convient à l’avertissement portant sur l’attrait intérieur exercé par ces mets.
- source_word: לְמַטְעַמֹּתָיו
  choice: ses mets délicats
  rationale: Le terme désigne des plats savoureux ou recherchés. « Mets délicats » est naturel, digne et conserve l’idée de nourriture particulièrement attirante.
theological_decisions: []
