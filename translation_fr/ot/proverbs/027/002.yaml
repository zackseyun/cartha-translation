  text: Let another praise you[a], and not your own mouth; a stranger[b], and not your own lips.
translation:
  language: fr
  text: Qu’un autre fasse ton éloge[a], et non ta propre bouche ; un étranger[b], et non tes propres lèvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un inconnu » ou « quelqu’un d’extérieur » pour זָר. Ici, le contraste avec « ta propre bouche » souligne surtout que l’éloge doit venir de quelqu’un d’autre.
    reason: lexical_alternative
  - marker: b
    text: Le second membre emploie un autre mot hébreu, נָכְרִי (« un étranger »), que le premier, זָר. La traduction conserve cette variation du parallélisme poétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלֶּלְךָ
  choice: Qu’un autre fasse ton éloge
  rationale: Le yiqtol à valeur exhortative se rend naturellement par « Qu’un autre… ». « Faire l’éloge de » exprime clairement הלל dans ce contexte de réputation, avec un registre proverbial digne et courant.
- source_word: זָר
  choice: un autre
  rationale: Bien que זָר puisse désigner un étranger ou une personne extérieure au cercle proche, son opposition à « ta propre bouche » met ici au premier plan l’idée de quelqu’un d’autre que soi.
- source_word: פִיךָ
  choice: ta propre bouche
  rationale: Le sens littéral est « ta bouche ». L’ajout de « propre » explicite sobrement le contraste avec autrui sans modifier la portée du proverbe.
- source_word: נָכְרִי
  choice: un étranger
  rationale: נָכְרִי désigne une personne étrangère ou inconnue. « Un étranger » préserve la variation lexicale avec זָר ainsi que le parallélisme poétique.
- source_word: שְׂפָתֶיךָ
  choice: tes propres lèvres
  rationale: « Lèvres » correspond directement à l’hébreu et maintient le parallélisme bouche/lèvres. « Propres » rend explicite le contraste avec l’éloge venu d’autrui.
- source_word: וְלֹא ... וְאַל
  choice: et non ... et non
  rationale: Cette répétition française conserve la structure équilibrée des deux membres et leur commune interdiction de se louer soi-même.
