  text: כַּ֭/מַּיִם הַ/פָּנִ֣ים לַ/פָּנִ֑ים כֵּ֤ן לֵֽב הָ֝/אָדָ֗ם לָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/019.yaml
  text: As in water face reflects face[b][a], so the heart of man reflects man.
translation:
  language: fr
  text: Comme dans l’eau, le visage répond au visage[a], ainsi le cœur de l’être humain répond à l’être humain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Comme l’eau, le visage au visage ». Le verbe « répond » est sous-entendu pour rendre l’image intelligible ; on peut aussi comprendre l’idée d’un reflet.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ainsi le cœur de l’humain à l’humain ». La relation exprimée par « répond à » demeure elliptique : le cœur peut être compris comme révélant la personne, ou comme correspondant à une personne.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּמַּיִם
  choice: Comme dans l’eau
  rationale: Le préfixe כַּ־ introduit la comparaison. « Dans l’eau » explicite naturellement en français le milieu où apparaît le reflet, sans modifier l’image.
- source_word: הַפָּנִים לַפָּנִים
  choice: un visage reflète un visage
  rationale: L’hébreu dit littéralement « le visage au visage » et ne comporte aucun verbe exprimé. « Reflète » rend l’ellipse suggérée par l’image de l’eau, tandis que la répétition de « visage » conserve le parallélisme.
- source_word: כֵּן
  choice: ainsi
  rationale: 'Ce terme établit la corrélation entre les deux membres : « comme… ainsi… ».'
- source_word: לֵב
  choice: le cœur
  rationale: « Cœur » conserve l’image biblique et peut désigner l’intériorité humaine, notamment les pensées, les dispositions et les intentions.
- source_word: הָאָדָם / לָאָדָם
  choice: de l’être humain / reflète l’être humain
  rationale: אָדָם a ici une portée générique. « Être humain » est naturel en français moderne et conserve cette portée. La répétition maintient l’ambiguïté concise de l’hébreu au lieu de préciser silencieusement s’il s’agit de la personne elle-même ou d’une autre personne.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme ; une personne
  rationale: Dans ce proverbe, אָדָם désigne vraisemblablement l’humain en général. « L’être humain » communique cette valeur sans faire du sexe masculin le propos du verset.
- issue: Rapport entre le cœur et אָדָם dans le second membre
  choice: le cœur de l’être humain reflète l’être humain
  alternative: le cœur d’une personne reflète ce qu’elle est ; le cœur d’une personne répond à celui d’une autre
  rationale: 'La construction hébraïque est elliptique : « le cœur de l’être humain à l’être humain ». Le texte peut évoquer le cœur comme reflet de la personne ou une correspondance entre personnes. La formulation retenue suit le parallélisme sans trancher entièrement cette tension.'
translation_notes:
  register: Français international moderne, sobre et proverbial. La répétition volontaire de « visage » et d’« être humain » reproduit le parallélisme dense de l’hébreu ; les notes signalent les ellipses et l’ambiguïté interprétative.
