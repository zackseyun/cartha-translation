revisions:
- from: Comme un oiseau qui erre loin de son nid, ainsi est l’homme qui erre loin de sa demeure[a].
  to: Comme un oiseau qui s’éloigne de son nid, ainsi est l’homme qui s’éloigne de sa place.
  rationale: La révision supprime l’intensification introduite par « loin de » et remplace « demeure » par « place », plus fidèle à l’ampleur de מְקוֹמוֹ. La répétition de « s’éloigne » conserve le parallélisme lexical entre les deux participes de נוד. Aucune note n’est nécessaire, puisque « sa place » exprime déjà la généralité du terme hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:31Z'
review_pass:
  verdict: revise
  source_fidelity: La répétition de « qui erre » rend bien le parallélisme de נוד. Cependant, « loin de » renforce la simple préposition מִן (« de »), et « demeure » restreint מְקוֹמוֹ, qui signifie plus largement « sa place / son lieu ».
  naturalness: « Comme un oiseau qui s’éloigne de son nid, ainsi est l’homme qui s’éloigne de sa place » est naturel en français moderne tout en gardant la forme proverbiale et la répétition voulue.
  terminology: « Oiseau », « nid », « homme » et « place » correspondent aux termes hébreux sans surspécification. « Place » préserve l’ambiguïté de מָקוֹם, qui peut viser le lieu habituel, la position ou le lieu propre de quelqu’un.
  issues:
  - severity: medium
    issue: « loin de » ajoute une notion de distance non explicitée par מִן.
    rationale: Le texte hébreu dit que l’oiseau et l’homme s’éloignent « de » leur nid ou lieu; il ne précise pas qu’ils en sont loin.
  - severity: medium
    issue: « sa demeure » réduit la portée de מִמְּקוֹמוֹ.
    rationale: מָקוֹם est « lieu, place » et ne se limite pas au domicile. La note reconnaît cette portée, mais le texte principal peut la rendre directement et naturellement par « sa place ».
  revised_text: Comme un oiseau qui s’éloigne de son nid, ainsi est l’homme qui s’éloigne de sa place.
  revised_footnotes: []
  revision_rationale: La révision supprime l’intensification introduite par « loin de » et remplace « demeure » par « place », plus fidèle à l’ampleur de מְקוֹמוֹ. La répétition de « s’éloigne » conserve le parallélisme lexical entre les deux participes de נוד. Aucune note n’est nécessaire, puisque « sa place » exprime déjà la généralité du terme hébreu.
