  text: כְּ֭/צִפּוֹר נוֹדֶ֣דֶת מִן קִנָּ֑/הּ כֵּֽן אִ֝֗ישׁ נוֹדֵ֥ד מִ/מְּקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
translation:
  language: fr
  text: Comme un oiseau qui s’éloigne de son nid, ainsi est l’homme qui s’éloigne de sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּצִפּוֹר
  choice: Comme un oiseau
  rationale: צִפּוֹר est un terme générique désignant un oiseau, souvent de petite taille; « oiseau » évite de préciser une espèce que l’hébreu ne précise pas.
- source_word: נוֹדֶדֶת / נוֹדֵד
  choice: qui erre / qui erre
  rationale: La répétition du verbe « errer » reproduit le parallélisme lexical de la racine נוד et évoque un déplacement sans stabilité.
- source_word: מִן קִנָּהּ
  choice: loin de son nid
  rationale: קֵן signifie « nid ». Dans ce contexte de mouvement, « loin de » exprime naturellement l’éloignement marqué par מִן.
- source_word: כֵּן
  choice: ainsi est
  rationale: Cette formulation conserve explicitement la structure comparative du proverbe dans un registre français digne.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le masculin singulier de l’hébreu désigne ici un individu représentatif; « l’homme » conserve cette forme sans exclure la portée générale du proverbe.
- source_word: מִמְּקוֹמוֹ
  choice: loin de sa demeure
  rationale: מָקוֹם signifie littéralement « lieu » et peut désigner le lieu où quelqu’un demeure ou auquel il appartient. « Demeure » donne ici un parallèle naturel avec le nid, tandis que la note signale la portée plus large de l’hébreu.
theological_decisions:
- issue: Langage représentatif masculin dans אִישׁ
  choice: l’homme
  alternative: une personne
  rationale: Le texte hébreu emploie un substantif masculin singulier. La traduction le conserve tout en laissant au proverbe sa valeur humaine générale.
- issue: Portée de מְקוֹמוֹ
  choice: sa demeure, avec note
  alternative: sa place
  rationale: « Demeure » rend clairement l’analogie avec le nid en français, mais l’hébreu est plus large; la note préserve donc la possibilité du lieu propre, de la situation ou de la place habituelle.
translation_notes:
  register: Français moderne international, naturel et proverbial. La reprise exacte de « qui erre » maintient le parallélisme hébreu; « ainsi est » conserve une solennité mesurée. Le marqueur [a] figure dans le texte principal.
