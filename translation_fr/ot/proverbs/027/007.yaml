  yaml_path: translation/ot/proverbs/027/007.yaml
  text: A satisfied person despises honey[b][a], but to a hungry person every bitter thing is sweet.
translation:
  language: fr
  text: Une personne rassasiée dédaigne le miel[a], mais, pour une personne affamée, tout ce qui est amer est doux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Une âme rassasiée foule aux pieds le miel, mais, pour une âme affamée, tout ce qui est amer est doux. » Ici, « âme » désigne la personne, notamment sous l’angle de son appétit. Le mot traduit par « miel » peut désigner plus précisément du miel qui coule ou du miel en rayon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: personne
  rationale: Le nom désigne ici la personne considérée sous l’angle de son appétit. « Personne » rend naturellement l’idiome hébreu en français, tandis que la note signale le sens plus littéral.
- source_word: שְׂבֵעָה
  choice: rassasiée
  rationale: L’adjectif indique que l’on a mangé à satiété. « Rassasiée » établit un contraste précis avec « affamée ».
- source_word: תָּבוּס
  choice: dédaigne
  rationale: Le verbe évoque littéralement le fait de fouler aux pieds, puis figurativement le mépris ou le rejet. « Dédaigne » conserve cette force sans rendre l’image trop littéralement dans le corps du texte.
- source_word: נֹפֶת
  choice: miel
  rationale: Le terme désigne du miel, possiblement du miel qui coule ou du miel en rayon. « Miel » est clair et exact; la nuance est indiquée en note.
- source_word: רְעֵבָה
  choice: affamée
  rationale: L’adjectif signifie « qui a faim ». « Affamée » forme une opposition idiomatique et vigoureuse avec « rassasiée » sans imposer l’idée extrême de mourir de faim.
- source_word: כָּל מַר
  choice: tout ce qui est amer
  rationale: כָּל a ici une portée distributive et מַר est employé substantivement. La formulation française est naturelle et conserve la généralisation proverbiale.
- source_word: מָתוֹק
  choice: est doux
  rationale: L’hébreu affirme directement la douceur, sans verbe exprimé. « Est doux » préserve cette prédication sans ajouter « paraît » ou « semble ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. La structure antithétique de l’hébreu est conservée. « Même » explicite légèrement la valeur concessive implicite du fait qu’une personne rassasiée rejette un aliment particulièrement désirable.
