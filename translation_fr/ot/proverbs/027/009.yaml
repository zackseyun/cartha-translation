  text: שֶׁ֣מֶן וּ֭/קְטֹרֶת יְשַׂמַּֽח לֵ֑ב וּ/מֶ֥תֶק רֵ֝עֵ֗/הוּ מֵֽ/עֲצַת נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
translation:
  language: fr
  text: L’huile et l’encens réjouissent le cœur, et la douceur d’un ami vient de ses conseils sincères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et la douceur d’un ami vaut mieux que les conseils que l’on se donne à soi-même ». L’hébreu du second membre est particulièrement concis et peut être compris de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  choice: l’huile
  rationale: Rend directement le nom hébreu, qui désigne l’huile, souvent parfumée ou employée pour l’onction, et conserve l’image concrète associée à l’encens.
- source_word: קְטֹרֶת
  choice: l’encens
  rationale: Le terme désigne couramment l’encens ou un mélange aromatique brûlé; « encens » préserve l’image sensorielle du texte.
- source_word: יְשַׂמַּח לֵב
  choice: réjouissent le cœur
  rationale: Expression française naturelle et digne qui conserve le causatif du verbe et le « cœur » comme siège de la vie intérieure.
- source_word: מֶתֶק
  choice: la douceur
  rationale: Conserve la métaphore sensorielle de la douceur et exprime le caractère agréable de l’amitié.
- source_word: רֵעֵהוּ
  choice: d’un ami
  rationale: Le nom signifie « ami, compagnon » avec un suffixe masculin singulier; la formulation générique convient au style proverbial français.
- source_word: מֵעֲצַת
  choice: vient d’un conseil
  rationale: 'Prend la préposition מִן dans son sens de provenance: la douceur de l’ami découle du conseil. La note signale l’autre analyse possible.'
- source_word: נָפֶשׁ
  choice: donné du fond de l’âme
  rationale: « Âme » préserve le terme anthropologique hébreu; « du fond de » exprime naturellement en français un conseil issu de l’être intérieur, sans réduire נֶפֶשׁ au seul registre affectif.
theological_decisions:
- issue: Sens de מֵעֲצַת נָפֶשׁ dans le second membre
  choice: 'Provenance: la douceur de l’ami vient d’un conseil donné du fond de l’âme.'
  alternative: 'Comparaison: la douceur d’un ami vaut mieux que les conseils que l’on se donne à soi-même.'
  rationale: L’hébreu est très elliptique et permet plusieurs analyses de מִן et de נֶפֶשׁ. Le texte principal retient une lecture cohérente de provenance, tandis que la note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme sensoriel est conservé par « huile », « encens » et « douceur ». La formulation « du fond de l’âme » garde le mot-source tout en évitant une tournure excessivement littérale.
