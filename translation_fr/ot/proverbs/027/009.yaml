- from: L’huile et l’encens réjouissent le cœur, et la douceur d’un ami vient d’un conseil donné du fond de l’âme.[a]
  to: L’huile et l’encens réjouissent le cœur, et la douceur d’un ami vient de ses conseils sincères[a].
  rationale: La révision conserve la lecture principale de provenance et le parallélisme du proverbe, tout en supprimant l’ajout « donné » et en clarifiant que les conseils sont ceux de l’ami. La note maintient explicitement la lecture comparative possible et donc l’ambiguïté réelle du texte hébreu.
