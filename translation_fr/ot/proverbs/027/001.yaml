id: PRO.27.1
reference: Proverbs 27:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַֽל תִּ֭תְהַלֵּל בְּ/י֣וֹם מָחָ֑ר כִּ֤י לֹא תֵ֝דַ֗ע מַה יֵּ֥לֶד יֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
translation:
  language: fr
  text: Ne te vante pas du lendemain, car tu ne sais pas ce qu’un jour fera naître[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qu’un jour produira » ou « ce qu’un jour apportera ». L’hébreu emploie littéralement l’image de ce qu’un jour « enfantera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: te vante
  rationale: Le hitpael de הלל exprime ici l’exaltation de soi. « Se vanter » est naturel en français moderne et conserve l’idée d’une assurance présomptueuse.
- source_word: בְּיוֹם מָחָר
  choice: du lendemain
  rationale: L’expression signifie littéralement « au jour de demain ». « Du lendemain » rend avec naturel l’objet de la vantardise tout en gardant la perspective du jour à venir.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’interdiction. « Car » convient au style bref et sentencieux du proverbe.
- source_word: תֵדַע
  choice: tu ne sais pas
  rationale: Le verbe ידע énonce une absence de connaissance, sans affirmer explicitement une incapacité absolue.
- source_word: מַה יֵּלֶד יוֹם
  choice: ce qu’un jour fera naître
  rationale: Le verbe ילד signifie proprement « enfanter, mettre au monde ». La formulation française conserve cette personnification du jour tout en restant intelligible et digne.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et proverbial. Le tutoiement singulier correspond à l’adresse individuelle de l’hébreu. La métaphore de l’enfantement est conservée dans le texte principal plutôt que remplacée par une simple paraphrase.
