  text: Know well the condition of your flock[b][a]; set your heart on the herds.
translation:
  language: fr
  text: Connais bien l’état de ton troupeau[a] ; porte toute ton attention à tes troupeaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Connais, connais la face de ton troupeau » ; l’expression hébraïque invite à en connaître soigneusement l’état.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « place ton cœur sur tes troupeaux ». Le terme hébreu désigne des groupes de bétail ; il peut aussi se traduire par « hardes » ou « troupeaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Connais bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’impératif. « Connais bien » rend cette insistance dans un français naturel.
- source_word: פְּנֵי
  choice: l’état de
  rationale: Le mot signifie littéralement « la face de », mais désigne ici l’aspect observable et, par extension, l’état des animaux.
- source_word: צֹאנְךָ
  choice: ton troupeau
  rationale: צֹאן désigne couramment le petit bétail, notamment les brebis et les chèvres. « Troupeau » est naturel et ne restreint pas indûment le sens aux seuls moutons.
- source_word: שִׁית לִבְּךָ
  choice: prends à cœur le soin de
  rationale: Littéralement « place ton cœur vers/sur ». La formulation française exprime l’attention soutenue et le souci concret impliqués par l’image hébraïque, tout en conservant le mot « cœur ».
- source_word: לַעֲדָרִים
  choice: tes hardes
  rationale: עֲדָרִים désigne des groupes d’animaux, des troupeaux ou des hardes. « Hardes » maintient une distinction lexicale avec צֹאן, sans limiter précisément l’espèce animale.
