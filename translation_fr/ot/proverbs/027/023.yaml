translation_notes:
  register: Français moderne, proverbial et direct. Le tutoiement correspond aux exhortations sapientielles adressées au lecteur. « Hardes » est légèrement plus soutenu, mais reste compréhensible et permet de refléter la variation lexicale de l’hébreu.
