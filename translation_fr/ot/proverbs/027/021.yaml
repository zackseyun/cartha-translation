  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וְ֝/אִ֗ישׁ לְ/פִ֣י מַהֲלָלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/021.yaml
  text: The crucible is for silver[a], and the furnace for gold, and a man is tested by his praise.
translation:
  language: fr
  text: Le creuset est pour l’argent, le fourneau pour l’or, et l’homme est éprouvé par sa louange[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « l’homme se révèle par ce qu’il loue »; ou : « l’homme est éprouvé par la louange qu’il reçoit ».'
    reason: 'Le sens de לְפִי מַהֲלָלוֹ est discuté : l’expression peut désigner ce qu’un homme loue ou la louange qui lui est adressée.'
lexical_decisions:
- source_word: מַצְרֵף
  choice: creuset
  rationale: Désigne un récipient servant à éprouver et à affiner les métaux; « creuset » est précis, courant et conserve l’image métallurgique.
- source_word: לַכֶּסֶף
  choice: pour l’argent
  rationale: La préposition indique ici la destination ou l’usage du creuset.
- source_word: כּוּר
  choice: fourneau
  rationale: Désigne un four destiné à la fusion ou à l’affinage des métaux; « fourneau » convient au contexte métallurgique et forme un parallèle naturel avec « creuset ».
- source_word: לַזָּהָב
  choice: pour l’or
  rationale: Rend le parallèle avec « pour l’argent » et indique le métal soumis au fourneau.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le masculin singulier hébreu désigne ici l’individu humain dans la formulation générale d’un proverbe; le rendu conserve cette forme sans l’aplanir.
- source_word: לְפִי
  choice: par
  rationale: L’expression signifie littéralement « selon la bouche de » et peut marquer la mesure ou le critère. Dans la formulation française, « par » exprime naturellement le moyen ou le critère de l’épreuve.
- source_word: מַהֲלָלוֹ
  choice: la louange
  rationale: Le nom peut évoquer la louange prononcée par un homme, celle qu’il reçoit, ou sa renommée. Le terme non spécifié « la louange » maintient cette tension mieux qu’une paraphrase univoque; la note explicite les principales lectures.
theological_decisions:
- issue: Ambiguïté du dernier membre du verset
  choice: l’homme est éprouvé par la louange
  alternative: l’homme se révèle par ce qu’il loue; l’homme est éprouvé par la louange qu’il reçoit
  rationale: 'לְפִי מַהֲלָלוֹ est réellement ambigu: il peut s’agir de ce qu’un homme loue ou de la louange qui lui est adressée. Le texte principal conserve une formulation compacte, tandis que la note expose les deux lectures sans en imposer une.'
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme nominal des deux premiers membres est conservé, avec une explicitation verbale minimale dans le dernier membre pour produire une phrase française naturelle.
