  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
translation:
  language: fr
  text: 'N’abandonne ni ton ami ni l’ami de ton père. Au jour de ton malheur, ne va pas chez ton frère[a] : mieux vaut un voisin proche qu’un frère éloigné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « frère » peut aussi désigner, plus largement, un proche parent ou un membre de la parenté.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ
  choice: ton ami
  rationale: רֵעַ peut désigner un ami, un compagnon ou un voisin. Le parallèle avec « l’ami de ton père » privilégie ici le sens relationnel d’« ami ».
- source_word: וְרֵעַ אָבִיךָ
  choice: ni l’ami de ton père
  rationale: Sous la portée de la négation, la coordination hébraïque וְ est rendue naturellement en français par la structure « ni… ni… », sans modifier le fait que les deux relations ne doivent pas être abandonnées.
- source_word: אַל־תַּעֲזֹב
  choice: N’abandonne
  rationale: עזב exprime ici l’abandon d’une relation loyale. « Abandonner » est actuel, clair et suffisamment fort en français.
- source_word: וּבֵית אָחִיךָ אַל־תָּבוֹא
  choice: ne va pas chez ton frère
  rationale: בוא peut signifier venir, aller ou entrer. Avec « la maison de ton frère », le français idiomatique « aller chez ton frère » conserve l’idée de se tourner vers son foyer en quête d’aide.
- source_word: בְּיוֹם אֵידֶךָ
  choice: Au jour de ton malheur
  rationale: אֵיד désigne une calamité ou un désastre. « Malheur » exprime une grave adversité sans en préciser indûment la nature.
- source_word: טוֹב
  choice: mieux vaut
  rationale: Littéralement « bon », טוֹב introduit ici une comparaison avec מִן ; la tournure proverbiale française « mieux vaut » en restitue naturellement la force.
- source_word: שָׁכֵן קָרוֹב
  choice: un voisin proche
  rationale: שָׁכֵן signifie « voisin » et קָרוֹב « proche ». La formulation met d’abord en avant la proximité concrète, tout en laissant possible une nuance relationnelle.
- source_word: מֵאָח רָחוֹק
  choice: qu’un frère éloigné
  rationale: La traduction garde l’image familiale de אָח et le contraste avec la proximité du voisin. « Éloigné » peut évoquer une distance géographique ou pratique.
theological_decisions:
- issue: Portée du terme de parenté אָח
  choice: Conserver « frère » dans le texte principal.
  alternative: « proche parent » ou « membre de la parenté »
  rationale: אָח peut parfois désigner un parent au sens large, mais « frère » préserve l’image concrète et la tension du proverbe entre le lien familial attendu et l’aide accessible d’un voisin proche.
- issue: Nature de la proximité dans שָׁכֵן קָרוֹב
  choice: Ne pas réduire « proche » à la seule intimité affective.
  alternative: « un voisin intime » ou « un voisin fidèle »
  rationale: קָרוֹב indique d’abord ce qui est proche, probablement dans l’espace ici, mais le proverbe peut aussi suggérer une disponibilité relationnelle. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure « ni… ni… » rend naturellement la coordination sous une interdiction. « Mieux vaut » donne à la dernière proposition une cadence proverbiale claire sans expliciter davantage le type d’aide attendu.
