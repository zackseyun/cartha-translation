  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
translation:
  language: fr
  text: Le fer aiguise le fer[a], et un homme aiguise le visage de son ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le fer aiguise le fer, et un homme aiguise un autre homme. » Dans le second membre, l’hébreu dit littéralement : « aiguise le visage de son ami » ; cette expression peut évoquer le fait de rendre une autre personne plus vive ou plus apte, sans préciser en quel sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: fer
  rationale: Le nom désigne clairement le fer. Sa répétition conserve la forme brève et parallèle du proverbe.
- source_word: בְּבַרְזֶל
  choice: le fer
  rationale: La préposition בְּ indique ici le moyen ou l’instrument (« avec/par le fer »). La tournure proverbiale naturelle « Le fer aiguise le fer » rend ce rapport sans lourdeur.
- source_word: יָחַד / יַחַד
  choice: aiguise
  rationale: À la forme causative, le verbe signifie rendre tranchant, affûter ou aiguiser. Répéter « aiguise » dans les deux membres préserve le parallélisme hébreu.
- source_word: וְאִישׁ
  choice: et un homme
  rationale: אִישׁ est un masculin singulier employé de manière représentative. « Un homme » en respecte la forme sans restreindre nécessairement la portée générale du proverbe.
- source_word: פְּנֵי
  choice: le visage de
  rationale: Le terme signifie littéralement « le visage de ». Conserver cette image concrète évite de trancher entre plusieurs interprétations possibles de l’expression.
- source_word: רֵעֵהוּ
  choice: son ami
  rationale: רֵעַ peut désigner un ami, un compagnon ou un proche. « Son ami » convient au contexte relationnel et se lit naturellement en français.
theological_decisions:
- issue: Langage masculin représentatif dans la littérature de sagesse
  choice: un homme
  alternative: une personne
  rationale: Le texte emploie explicitement אִישׁ, masculin singulier. La traduction en garde la forme grammaticale tout en laissant au proverbe sa portée sapientiale générale.
- issue: Sens de l’image « aiguiser le visage »
  choice: conserver l’expression concrète
  alternative: un homme en aiguise un autre
  rationale: L’hébreu dit littéralement qu’un homme « aiguise le visage » de son ami. Comme l’effet précis évoqué reste discuté, le texte principal préserve l’ambiguïté plutôt que de la résoudre en amélioration morale, intellectuelle ou relationnelle.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme et la répétition de « fer » et d’« aiguise » sont maintenus. La formulation inhabituelle « aiguise le visage » est volontairement conservée afin de respecter l’image et l’ambiguïté de l’hébreu, avec une note explicative.
