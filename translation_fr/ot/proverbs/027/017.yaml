  naturalness: La formulation principale est sobre et proverbiale. « Aiguise le visage » est insolite en français, mais cette étrangeté est justifiée ici par le choix d’une traduction littérale prudente et est correctement signalée par une note. La formulation actuelle de l’alternative en note (« un homme en aiguise un autre ») est toutefois syntaxiquement ambiguë et ne communique pas clairement le sens interprétatif visé.
  terminology: « Fer », « aiguise », « homme », « visage » et « ami » sont des équivalents appropriés et de registre moderne. La note doit employer une paraphrase française explicite plutôt que le pronom « en », dont l’antécédent est indécidable dans ce contexte.
