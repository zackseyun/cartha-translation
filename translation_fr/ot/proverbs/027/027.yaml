source:
  edition: WLC
  text: וְ/דֵ֤י חֲלֵ֬ב עִזִּ֗ים לְֽ֭/לַחְמְ/ךָ לְ/לֶ֣חֶם בֵּיתֶ֑/ךָ וְ֝/חַיִּ֗ים לְ/נַעֲרוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
translation:
  language: fr
  text: Et il y aura assez de lait de chèvre pour te nourrir, pour nourrir ta maisonnée[a], et de quoi faire vivre tes servantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « pour ton pain, pour le pain de ta maison ». Ici, « pain » désigne vraisemblablement la nourriture ou les provisions en général.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et la vie pour tes jeunes femmes ». Le mot traduit par « servantes » peut aussi simplement désigner de jeunes femmes, et « vie » évoque ici ce qui permet de vivre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי
  choice: Et il y aura assez
  rationale: דַּי exprime la suffisance. La tournure existentielle est naturelle en français et le « Et » conserve le lien du verset avec ce qui précède.
- source_word: חֲלֵב עִזִּים
  choice: de lait de chèvre
  rationale: L’expression désigne le lait provenant des chèvres. Le singulier générique « lait de chèvre » est la formulation française courante.
- source_word: לְלַחְמְךָ
  choice: pour te nourrir
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture. Avec le lait comme moyen de subsistance, la formulation verbale rend naturellement ce sens.
- source_word: לְלֶחֶם בֵּיתֶךָ
  choice: pour nourrir ta maisonnée
  rationale: Ici, לֶחֶם a le sens large de nourriture, et בַּיִת désigne les membres du foyer plutôt que le bâtiment.
- source_word: וְחַיִּים
  choice: et de quoi faire vivre
  rationale: חַיִּים signifie littéralement « vie » ou « vies ». Dans ce contexte de ressources domestiques, l’expression évoque ce qui permet de vivre, tout en conservant en français l’image de la vie.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: tes servantes
  rationale: נַעֲרָה peut désigner une jeune femme ou une servante. Dans cette évocation de l’approvisionnement d’une maisonnée, « servantes » convient au contexte social, tandis que la note signale l’autre possibilité.
theological_decisions: []
