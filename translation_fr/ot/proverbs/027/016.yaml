  text: צֹפְנֶ֥י/הָ צָֽפַן ר֑וּחַ וְ/שֶׁ֖מֶן יְמִינ֣/וֹ יִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/016.yaml
  text: Whoever restrains her restrains the wind[a], and his right hand grasps oil.
translation:
  language: fr
  text: 'Qui la retient retient le vent,

    et sa main droite appelle l’huile.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la seconde ligne est difficile. Littéralement : « et sa main droite appelle l’huile ». Le sens exact de cette expression est incertain. Certains y voient une image d’une main qui tente de saisir ou de retenir de l’huile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפְנֶיהָ
  choice: qui veut la contenir
  rationale: Le participe avec suffixe féminin renvoie à la femme querelleuse du verset précédent. « Contenir » exprime ici l’idée de la maîtriser ou de la retenir, tout en restant proche de l’image du proverbe.
- source_word: צָפַן
  choice: contient
  rationale: Le verbe signifie habituellement « cacher, mettre en réserve », mais le parallèle avec le vent suggère ici l’idée impossible de contenir. La répétition de la même racine est rendue autant que possible en français.
- source_word: רוּחַ
  choice: le vent
  rationale: Le contexte évoque une réalité insaisissable et incontrôlable; « vent » est donc préférable à « esprit ».
- source_word: וְשֶׁמֶן
  choice: l’huile
  rationale: « Huile » est l’équivalent direct, sans ajouter « d’olive », précision culturellement probable mais absente du texte.
- source_word: יְמִינוֹ
  choice: sa main droite
  rationale: La mention explicite de la droite est conservée afin de respecter l’image corporelle de l’hébreu.
- source_word: יִקְרָא
  choice: appelle
  rationale: Le texte massorétique porte la forme habituelle du verbe « appeler ». Bien que le sens de l’expression soit difficile, la traduction conserve cette formulation plutôt que d’imposer la conjecture « saisit »; une note signale la difficulté et l’interprétation possible.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le lien avec le verset précédent est maintenu par le pronom féminin implicite dans « la ». La formulation difficile de la seconde ligne est conservée dans le texte afin de ne pas résoudre abusivement l’ambiguïté hébraïque, avec explication en note.
