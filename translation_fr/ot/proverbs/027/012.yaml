id: PRO.27.12
reference: Proverbs 27:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה נִסְתָּ֑ר פְּ֝תָאיִ֗ם עָבְר֥וּ נֶעֱנָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
translation:
  language: fr
  text: L’homme avisé voit le danger et se met à l’abri, mais les naïfs poursuivent leur chemin et en subissent les conséquences.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sont punis ». L’hébreu peut évoquer une peine infligée ou le fait de subir les conséquences.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: l’homme avisé
  rationale: Dans les Proverbes, le terme désigne généralement une personne prudente et perspicace. « Avisé » garde cette valeur positive, tandis que « homme » reflète le masculin singulier représentatif de l’hébreu.
- source_word: רָאָה
  choice: voit
  rationale: L’accompli hébreu a ici une portée générale et proverbiale; le présent français exprime naturellement une conduite habituelle.
- source_word: רָעָה
  choice: le danger
  rationale: Le nom peut désigner le mal, le malheur ou une calamité. Dans ce contexte, il s’agit d’un péril discernable auquel on peut se soustraire; « danger » convient donc au contraste pratique du proverbe.
- source_word: נִסְתָּר
  choice: se met à l’abri
  rationale: Le niphal exprime le fait de se cacher ou de se retirer face au danger. « Se met à l’abri » est naturel en français et rend clairement la mesure de protection prise.
- source_word: פְּתָאיִם
  choice: les naïfs
  rationale: Ce terme sapientiel désigne les personnes inexpérimentées et dépourvues de discernement. « Les naïfs » est courant, compréhensible et moins artificiel que « les simples » en français moderne.
- source_word: עָבְרוּ
  choice: poursuivent leur chemin
  rationale: Le verbe indique qu’ils continuent d’avancer au lieu de prendre des précautions. Cette formulation rend naturellement le mouvement et le contraste avec l’homme avisé.
- source_word: נֶעֱנָשׁוּ
  choice: en subissent les conséquences
  rationale: Le niphal de ענשׁ peut évoquer une peine infligée ou les conséquences dommageables d’une conduite. Cette traduction préserve l’ouverture du terme sans imposer un cadre strictement judiciaire.
