revisions:
- from: Celui qui bénit son prochain à voix forte dès le matin, de très bonne heure, verra sa bénédiction comptée comme une malédiction.[a]
  to: Celui qui bénit son prochain à voix forte dès le matin, de très bonne heure, cela lui sera compté comme une malédiction.
  rationale: La révision retire l’ajout interprétatif « verra », maintient l’ambiguïté limitée du sujet implicite par « cela », et rend explicitement en français la construction passive « cela lui sera compté ». La note est supprimée, car son alternative ne reflète pas fidèlement le rattachement grammatical de לוֹ dans le texte source.
