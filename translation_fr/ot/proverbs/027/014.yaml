  text: מְבָ֘רֵ֤ךְ רֵעֵ֨/הוּ בְּ/ק֣וֹל גָּ֭דוֹל בַּ/בֹּ֣קֶר הַשְׁכֵּ֑ים קְ֝לָלָ֗ה תֵּחָ֥שֶׁב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/014.yaml
  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
translation:
  language: fr
  text: Celui qui bénit son prochain à voix forte dès le matin, de très bonne heure, cela lui sera compté comme une malédiction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבָרֵךְ
  choice: bénit
  rationale: Le participe piel de ברך désigne ici l’action de prononcer une bénédiction. « Bénit » conserve le sens lexical et l’ironie créée par son contraste avec « malédiction ».
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner le prochain, l’ami ou le compagnon. « Son prochain » convient à la portée relationnelle générale de la maxime sans imposer une intimité particulière.
- source_word: בְּקוֹל גָּדוֹל
  choice: à voix forte
  rationale: Expression française naturelle qui restitue concrètement le volume excessif suggéré par l’hébreu.
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  choice: dès le matin, de très bonne heure
  rationale: Cette formulation rend à la fois le cadre matinal et l’insistance de הַשְׁכֵּים sur le fait de se lever ou d’agir tôt.
- source_word: קְלָלָה
  choice: une malédiction
  rationale: Le nom signifie directement « malédiction » et produit le renversement ironique de la bénédiction initiale.
- source_word: תֵּחָשֶׁב לוֹ
  choice: verra sa bénédiction comptée comme
  rationale: La tournure préserve l’idée passive d’une action tenue ou comptée pour une malédiction, tout en rattachant naturellement לוֹ à celui qui bénit.
theological_decisions:
- issue: Référent de לוֹ et sujet implicite de תֵּחָשֶׁב
  choice: La bénédiction sera comptée comme une malédiction pour celui qui la prononce.
  alternative: Elle sera considérée comme une malédiction par celui qui la reçoit.
  rationale: L’hébreu permet une certaine ambiguïté quant à la perspective exacte. Le texte principal suit la lecture où l’acte est porté au compte de celui qui bénit, tandis que la note signale l’autre compréhension possible.
translation_notes:
  register: Français moderne, international et proverbial. La formulation reste digne et concise, avec une légère explicitation syntaxique (« sa bénédiction ») pour éviter un pronom français sans antécédent clair. Le marqueur de note est placé après la phrase entière, puisqu’il concerne à la fois l’ambiguïté syntaxique et l’ironie de la maxime.
