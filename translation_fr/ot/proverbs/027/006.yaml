  text: נֶ֭אֱמָנִים פִּצְעֵ֣י אוֹהֵ֑ב וְ֝/נַעְתָּר֗וֹת נְשִׁיק֥וֹת שׂוֹנֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/006.yaml
  text: Faithful are the wounds of a friend[a], but the kisses of an enemy are excessive.
translation:
  language: fr
  text: Les blessures d’un ami sont dignes de confiance, mais les baisers d’un ennemi sont abondants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont prodigués à l’excès ». Le mot hébreu est difficile; il peut évoquer des baisers donnés en abondance et, dans ce contexte, des marques d’affection suspectes, insincères ou trompeuses.
    reason: alternative lexicale
lexical_decisions:
- source_word: נֶאֱמָנִים
  choice: dignes de confiance
  rationale: L’adjectif exprime ce qui est fiable, sûr ou loyal. « Dignes de confiance » indique que les blessures causées par un ami procèdent d’une intention sincère et bénéfique, sans imposer à « blessures » le tour moins naturel « fidèles ».
- source_word: פִּצְעֵי
  choice: blessures
  rationale: Le nom désigne des blessures ou des lésions. « Blessures » conserve l’image vive et permet aussi le sens figuré de paroles ou de réprimandes douloureuses.
- source_word: אוֹהֵב
  choice: ami
  rationale: Le participe signifie littéralement « celui qui aime ». Dans ce proverbe, « ami » rend naturellement la relation bienveillante et forme un contraste clair avec « ennemi ».
- source_word: וְנַעְתָּרוֹת
  choice: sont prodigués à l’excès
  rationale: La forme hébraïque est difficile. Elle peut évoquer la profusion ou l’excès, tandis que le contexte suggère des marques d’affection trompeuses. La traduction principale conserve le sens quantitatif sans résoudre silencieusement l’ambiguïté.
- source_word: נְשִׁיקוֹת
  choice: baisers
  rationale: Le nom pluriel signifie directement « baisers » et représente ici des manifestations d’affection potentiellement insincères.
- source_word: שׂוֹנֵא
  choice: ennemi
  rationale: Le participe signifie littéralement « celui qui hait ». « Ennemi » est naturel en français et maintient le parallélisme antithétique avec « ami ».
