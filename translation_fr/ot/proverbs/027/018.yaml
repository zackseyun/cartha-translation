  text: נֹצֵ֣ר תְּ֭אֵנָה יֹאכַ֣ל פִּרְיָ֑/הּ וְ/שֹׁמֵ֖ר אֲדֹנָ֣י/ו יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
translation:
  language: fr
  text: Qui prend soin d’un figuier[a] mangera de son fruit, et qui veille sur son maître[b] sera honoré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garde un figuier » ; l’hébreu évoque une attention vigilante et soutenue.
    reason: lexical_alternative
  - marker: b
    text: Ou « garde son maître ». Il s’agit avant tout de lui accorder une attention soutenue, et pas nécessairement de le protéger physiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: prend soin de
  rationale: Le participe signifie garder ou veiller sur. Avec un figuier pour complément, « prendre soin de » exprime naturellement l’entretien attentif et fidèle qui conduit à la récolte.
- source_word: תְּאֵנָה
  choice: figuier
  rationale: Le nom désigne l’arbre, et non simplement la figue; « figuier » conserve l’image agricole concrète.
- source_word: יֹאכַל
  choice: mangera
  rationale: L’imparfait exprime ici le résultat attendu dans une maxime générale; le futur français rend clairement cette conséquence.
- source_word: פִּרְיָהּ
  choice: de son fruit
  rationale: Le suffixe féminin singulier renvoie au figuier; en français, le possessif « son » convient grammaticalement et naturellement.
- source_word: שֹׁמֵר
  choice: veille fidèlement sur
  rationale: Le participe signifie garder, observer ou veiller sur. Cette formulation exprime une attention constante envers un supérieur sans réduire le sens à sa seule protection physique; « fidèlement » explicite la qualité d’attention suggérée par le parallélisme.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Dans ce contexte sapientiel, le terme décrit naturellement un supérieur humain. « Maître » préserve cette relation sociale sans imposer un référent divin.
- source_word: יְכֻבָּד
  choice: sera honoré
  rationale: Le pual de כבד indique que la personne reçoit de l’honneur; « sera honoré » en est l’équivalent direct et idiomatique.
theological_decisions:
- issue: Référent de « son maître »
  choice: Un maître humain dans une comparaison sapientielle sur le service fidèle
  alternative: Le Seigneur ou Dieu comme application théologique plus large
  rationale: אֲדֹנָיו ne comporte aucun indice imposant un référent divin, et le parallélisme avec l’entretien d’un figuier favorise une relation sociale ordinaire. Une application à Dieu reste possible, mais elle ne doit pas être introduite dans le texte traduit.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle et la relation de cause à effet du proverbe sont conservées. Les notes signalent les sens plus littéraux des deux verbes hébreux apparentés sans alourdir le verset.
