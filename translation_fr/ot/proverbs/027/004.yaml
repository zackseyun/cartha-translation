  text: אַכְזְרִיּ֣וּת חֵ֭מָה וְ/שֶׁ֣טֶף אָ֑ף וּ/מִ֥י יַ֝עֲמֹד לִ/פְנֵ֥י קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/004.yaml
  text: Wrath is cruel[a], and anger is a flood, but who can stand before jealousy?
translation:
  language: fr
  text: La fureur est cruelle, et la colère, un torrent ; mais qui peut tenir devant la jalousie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’envie ». Le mot hébreu peut désigner la jalousie ou l’envie selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  choice: est cruelle
  rationale: Le nom exprime la cruauté ou la dureté. Dans cette proposition sans verbe, une formulation prédicative est naturelle en français et conserve le sens.
- source_word: חֵמָה
  choice: la fureur
  rationale: Le terme évoque une colère brûlante et intense. « Fureur » maintient cette force tout en le distinguant de אָף dans le membre parallèle.
- source_word: שֶׁטֶף
  choice: un torrent
  rationale: Le nom désigne un débordement, une crue ou un torrent. « Torrent » garde l’image vive d’une force impétueuse et incontrôlable.
- source_word: אָף
  choice: la colère
  rationale: Bien que le sens concret soit « nez », le terme désigne idiomatiquement la colère dans ce contexte.
- source_word: וּמִי
  choice: mais qui
  rationale: La conjonction suivie de l’interrogatif introduit ici un contraste culminant. « Mais qui » rend naturellement cette progression rhétorique.
- source_word: יַעֲמֹד
  choice: peut tenir
  rationale: Le verbe signifie se tenir debout ou rester en place. Dans la question rhétorique, « peut tenir » préserve l’image tout en exprimant la capacité de résister.
- source_word: לִפְנֵי
  choice: devant
  rationale: Cette préposition signifie littéralement « devant » ou « en présence de ». Le choix conserve la métaphore spatiale du texte.
- source_word: קִנְאָה
  choice: la jalousie
  rationale: Le terme peut désigner la jalousie, l’envie ou le zèle. Dans ce tableau de passions destructrices, « jalousie » convient bien, sans exclure l’autre sens possible signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme est conservé, ainsi que la montée en intensité vers la question finale. « Torrent » restitue l’image concrète de שֶׁטֶף sans explicitation excessive.
