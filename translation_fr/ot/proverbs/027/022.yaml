- from: Même si tu broies l’insensé dans un mortier, avec le pilon, au milieu des grains concassés[a], sa folie ne se séparera pas de lui.
  to: Même si tu piles l’insensé dans un mortier, au milieu de grains concassés avec un pilon, sa folie ne le quittera pas.[a]
  rationale: Révision limitée pour employer une syntaxe française plus fluide et une expression idiomatique de la permanence de la folie, tout en maintenant la force imagée et l’ambiguïté lexicale contrôlée de רִיפוֹת. Le tutoiement générique et le registre proverbial sont conservés.
