  yaml_path: translation/ot/proverbs/027/022.yaml
  text: Even if you grind a fool in a mortar with a pestle among crushed grain[a], his foolishness will not depart from him.
translation:
  language: fr
  text: Même si tu piles l’insensé dans un mortier, au milieu de grains concassés avec un pilon, sa folie ne le quittera pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grains pilés » ou, traditionnellement, « gruau ». Le terme hébreu désigne vraisemblablement une préparation de grain pilé ou concassé.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְתּוֹשׁ
  choice: tu broies
  rationale: Le verbe désigne l’action de piler ou de broyer dans un mortier. « Broies » conserve la force concrète de l’image et s’emploie naturellement avec le mortier et le pilon.
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Dans les Proverbes, le terme désigne une personne moralement et intellectuellement réfractaire, non une simple personne peu intelligente. « L’insensé » convient au registre sapiential français.
- source_word: מַּכְתֵּשׁ
  choice: mortier
  rationale: Équivalent précis et courant du récipient dans lequel on pile des grains ou des aromates.
- source_word: רִיפוֹת
  choice: grains concassés
  rationale: Le terme rare renvoie vraisemblablement à des grains pilés ou concassés. « Grains concassés » rend clairement l’image alimentaire tout en évitant une précision incertaine sur le produit obtenu.
- source_word: עֱלִי
  choice: pilon
  rationale: Nom français précis de l’outil employé avec un mortier.
- source_word: תָסוּר מֵעָלָיו
  choice: ne se séparera pas de lui
  rationale: Cette formulation conserve l’idée spatiale de סור מעל, selon laquelle la folie ne s’éloigne pas de la personne, tout en restant naturelle en français.
- source_word: אִוַּלְתּוֹ
  choice: sa folie
  rationale: « Folie » est le nom abstrait naturel correspondant à « l’insensé » et désigne ici son obstination profondément enracinée.
- source_word: אִם
  choice: Même si
  rationale: 'La particule introduit ici une hypothèse concessive extrême : même un traitement aussi violent ne retranche pas la folie de l’insensé.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et proverbial. Le tutoiement générique reflète la deuxième personne du singulier hébraïque. L’ordre des compléments garde le mortier, le pilon et les grains dans une même scène concrète sans alourdir la phrase.
