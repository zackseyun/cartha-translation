  source_fidelity: 'Le sens général est bien rendu : l’hypothèse concessive, le mortier, le pilon et l’idée que la folie demeure. Toutefois, la syntaxe française actuelle (« dans un mortier, avec le pilon, au milieu des grains concassés ») rend ambigu le rapport des compléments et ne reflète pas avec assez de clarté la scène de pilage. « Même si tu piles... au milieu de grains concassés avec un pilon » conserve les éléments hébreux sans prétendre résoudre plus précisément le sens rare de רִיפוֹת.'
  naturalness: « Sa folie ne se séparera pas de lui » est compréhensible, mais peu idiomatique en français moderne. « Sa folie ne le quittera pas » est nettement plus naturel tout en rendant correctement לֹא תָסוּר מֵעָלָיו. Le réagencement proposé allège aussi l’énumération des compléments.
  terminology: « L’insensé » et « folie » conviennent au registre sapientiel. « Mortier » et « pilon » sont précis. « Piler » est plus directement idiomatique que « broyer » pour l’action effectuée au mortier avec un pilon. La note doit signaler des possibilités lexicales sans qualifier globalement le sens de « incertain », car le champ de grains pilés/concassés est suffisamment établi, même si le référent exact demeure discuté.
