  text: ט֭וֹבָה תּוֹכַ֣חַת מְגֻלָּ֑ה מֵֽ/אַהֲבָ֥ה מְסֻתָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/005.yaml
  text: Open rebuke is better than hidden love[a].
translation:
  language: fr
  text: Mieux vaut une réprimande ouverte qu’un amour caché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un amour dissimulé ». L’hébreu peut désigner un amour qui n’est pas exprimé, plutôt qu’un amour absent.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה
  choice: Mieux vaut
  rationale: Avec מִן marquant la comparaison, l’adjectif exprime ici une préférence. La tournure française « Mieux vaut… que… » est naturelle et conserve la forme sentencieuse.
- source_word: תּוֹכַחַת
  choice: réprimande
  rationale: Le nom désigne une correction verbale, voire un blâme. « Réprimande » garde cette force tout en restant courant en français moderne.
- source_word: מְגֻלָּה
  choice: ouverte
  rationale: Le participe signifie littéralement « découverte, révélée ». « Ouverte » indique que la réprimande n’est pas dissimulée, sans imposer l’idée plus précise d’une intervention publique.
- source_word: מִן
  choice: que
  rationale: La préposition introduit le second terme de la comparaison et se rend naturellement par « que » dans la construction « Mieux vaut… que… ».
- source_word: אַהֲבָה
  choice: amour
  rationale: « Amour » est l’équivalent direct et usuel, sans affaiblir le terme en « affection ».
- source_word: מְסֻתָּרֶת
  choice: caché
  rationale: Le participe signifie « caché, dissimulé ». « Caché » préserve l’ambiguïté entre un amour tenu secret et un amour réel mais non manifesté.
theological_decisions: []
translation_notes:
  register: Formulation concise, proverbiale et digne, en français international moderne. L’antithèse entre une correction manifeste et un amour non manifesté est conservée sans préciser si la réprimande est publique.
