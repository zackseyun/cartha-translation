base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/011.yaml
  text: Be wise[a], my son, and make my heart glad[b], that I may answer the one who reproaches me.
translation:
  language: fr
  text: Sois sage[a], mon fils, et réjouis mon cœur, afin que je réponde[b] à celui qui m’insulte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Deviens sage, mon fils ». L’impératif hébreu peut souligner soit l’état de sagesse, soit l’entrée ou la progression dans cette sagesse.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « rendre une parole à celui qui m’insulte », c’est-à-dire lui répondre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם
  choice: Sois sage
  rationale: L’impératif masculin singulier de חכם exhorte le fils à posséder et à manifester la sagesse. « Sois sage » est direct, naturel et n’impose pas l’idée plus précise d’un processus, que pourrait suggérer « Deviens sage ».
- source_word: בְּנִי
  choice: mon fils
  rationale: בן avec le suffixe de première personne du singulier signifie littéralement « mon fils ». Le masculin singulier propre au cadre de l’enseignement sapientiel est conservé.
- source_word: וְשַׂמַּח לִבִּי
  choice: et réjouis mon cœur
  rationale: Le hifil impératif de שמח est causatif, et לִבִּי désigne explicitement « mon cœur ». Cette formulation française conserve l’image hébraïque avec naturel.
- source_word: וְאָשִׁיבָה … דָבָר
  choice: afin que je puisse répondre
  rationale: Le cohortatif de שוב associé à דָבָר forme ici l’expression littérale « rendre une parole », qui signifie donner une réponse. Le rapport de finalité ou de résultat avec l’exhortation précédente est rendu par « afin que ».
- source_word: חֹרְפִי
  choice: celui qui m’insulte
  rationale: Le participe actif de חרף avec suffixe de première personne désigne celui qui outrage, provoque ou couvre le locuteur d’opprobre. « Celui qui m’insulte » exprime clairement et naturellement cette hostilité verbale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure brève de l’exhortation sapientielle, l’image du cœur et l’adresse masculine singulière sont conservées, tandis que l’expression idiomatique hébraïque est rendue dans un français naturel.
