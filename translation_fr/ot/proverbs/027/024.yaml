id: PRO.27.24
reference: Proverbs 27:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
translation:
  language: fr
  text: 'Car la richesse[a] ne dure pas toujours,

    et une couronne[b] ne subsiste pas de génération en génération.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les richesses »; le mot hébreu peut désigner les ressources matérielles, l’abondance ou la force. Ici, le contexte favorise le sens matériel.
    reason: lexical_alternative
  - marker: b
    text: Ou « un diadème »; le mot hébreu peut aussi évoquer la consécration, mais il désigne probablement ici une couronne comme symbole de rang ou de pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’exhortation du contexte; « car » rend naturellement cette valeur explicative.
- source_word: חֹסֶן
  choice: richesse
  rationale: Dans le contexte des ressources agricoles et de la subsistance (v. 23-27), le terme désigne plus probablement les biens matériels que la force abstraite.
- source_word: לֹא לְעוֹלָם
  choice: ne dure pas toujours
  rationale: Exprime clairement la non-pérennité en français courant, sans donner à עוֹלָם un sens métaphysique excessif.
- source_word: וְאִם
  choice: et … ne … pas
  rationale: Après la première négation, la proposition elliptique prolonge l’idée négative. Cette formulation conserve le « et » hébreu tout en explicitant naturellement le verbe sous-entendu.
- source_word: נֵזֶר
  choice: couronne
  rationale: Le mot peut désigner un diadème ou la consécration; ici, le parallélisme avec la richesse et la succession des générations favorise l’image concrète d’une couronne, symbole de rang ou de pouvoir.
- source_word: לְדוֹר דּוֹר
  choice: de génération en génération
  rationale: Rend la succession continue des générations exprimée par la répétition du nom.
theological_decisions:
- issue: Sens de נֵזֶר dans le parallélisme proverbial
  choice: couronne, comme symbole de rang ou de pouvoir
  alternative: diadème; consécration
  rationale: Le contexte oppose deux réalités tenues pour durables, la richesse et le statut représenté par la couronne. Le choix préserve l’image concrète sans imposer une lecture cultuelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé sur deux lignes; « ne subsiste pas » explicite sobrement le verbe sous-entendu dans le second membre.
