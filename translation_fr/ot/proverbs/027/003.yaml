  yaml_path: translation/ot/proverbs/027/003.yaml
  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
translation:
  language: fr
  text: La pierre est lourde, et le sable pèse lourd ; mais la colère d’un insensé est plus pesante que tous deux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Une pierre est un poids, et le sable une charge ; mais la colère d’un insensé est plus lourde que tous deux. » L’hébreu emploie des termes apparentés au poids et à la lourdeur dans le premier et le troisième membre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּבֶד אֶבֶן
  choice: La pierre est lourde
  rationale: Le nom כֹּבֶד exprime le poids ou la lourdeur. Une proposition adjectivale rend naturellement cette expression nominale en français tout en conservant l’image concrète.
- source_word: וְנֵטֶל הַחוֹל
  choice: et le sable pèse lourd
  rationale: נֵטֶל désigne une charge ou un poids à porter. Cette formulation française naturelle maintient le champ lexical de la pesanteur et le parallélisme avec la pierre.
- source_word: כַעַס
  choice: l’irritation
  rationale: כַעַס peut désigner l’irritation, le dépit ou la colère. « Irritation » préserve ici l’ambiguïté entre l’état du sot et l’exaspération pénible qu’il provoque, sans limiter le sens à un accès de colère.
- source_word: אֱוִיל
  choice: d’un insensé
  rationale: « Insensé » rend le type moral et sapientiel désigné par אֱוִיל, plutôt qu’un simple manque d’intelligence, et conserve la portée générale du singulier.
- source_word: כָּבֵד מִשְּׁנֵיהֶם
  choice: est plus pesante que tous les deux
  rationale: La construction avec מִן établit la comparaison. « Plus pesante » reprend explicitement l’image du poids, tandis que « tous les deux » renvoie ensemble à la pierre et au sable.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et digne. Le parallélisme et la métaphore continue du poids sont conservés. « Irritation » évite de trancher entièrement entre la colère éprouvée par l’insensé et l’exaspération qu’il cause.
