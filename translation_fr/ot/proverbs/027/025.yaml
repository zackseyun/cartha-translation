  text: גָּלָ֣ה חָ֭צִיר וְ/נִרְאָה דֶ֑שֶׁא וְ֝/נֶאֶסְפ֗וּ עִשְּׂב֥וֹת הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/025.yaml
  text: The hay is removed[a], and the new growth appears[c][b], and the grasses of the mountains are gathered.
translation:
  language: fr
  text: L’herbe est enlevée[a], la verdure nouvelle apparaît[b], et les plantes des montagnes sont recueillies[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a disparu » ou « est mise à découvert ». Le verbe hébreu peut évoquer ce qui est découvert ou retiré; dans ce contexte, il peut suggérer que l’herbe a été coupée ou n’est plus là.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’herbe tendre » ou « l’herbe fraîche ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les herbes des montagnes sont rassemblées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלָה
  choice: disparaît
  rationale: Le verbe signifie fondamentalement « être découvert, mis à nu » et peut, dans ce contexte agricole, exprimer que l’herbe coupée est enlevée ou n’est plus là. « Disparaît » rend naturellement le résultat sans préciser indûment le procédé.
- source_word: חָצִיר
  choice: herbe coupée
  rationale: Le nom désigne l’herbe servant de fourrage. « Herbe coupée » convient mieux que « foin », qui peut suggérer une herbe déjà séchée, et rend claire la succession entre coupe et repousse.
- source_word: נִרְאָה
  choice: apparaît
  rationale: Le niphal signifie « être vu » ou « apparaître ». Ici, « apparaît » décrit naturellement la végétation qui devient visible.
- source_word: דֶשֶׁא
  choice: verdure nouvelle
  rationale: Le terme désigne une végétation fraîche et verte. « Verdure nouvelle » exprime la repousse sans répéter « herbe ».
- source_word: נֶאֶסְפוּ
  choice: sont recueillies
  rationale: Le passif signifie littéralement « sont rassemblées, recueillies ». Cette formulation reste proche de l’hébreu tout en convenant à la récolte du fourrage.
- source_word: עִשְּׂבוֹת
  choice: les plantes
  rationale: Le terme désigne largement les herbes ou la végétation. « Plantes » préserve cette étendue sémantique; « herbes » pourrait être compris en français moderne au sens culinaire ou médicinal.
- source_word: הָרִים
  choice: des montagnes
  rationale: Le nom signifie directement « montagnes »; ce choix conserve l’image géographique de l’hébreu sans l’atténuer en « collines ».
theological_decisions: []
