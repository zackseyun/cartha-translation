source:
  edition: WLC
  text: כְּבָשִׂ֥ים לִ/לְבוּשֶׁ֑/ךָ וּ/מְחִ֥יר שָׂ֝דֶ֗ה עַתּוּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/026.yaml
  text: Lambs are for your clothing[a], and goats are the price of a field.
translation:
  language: fr
  text: Les agneaux[a] servent à te vêtir, et les boucs à payer le prix d’un champ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « moutons ».'
    reason: Le nom hébreu désigne le plus souvent des agneaux ou de jeunes moutons, mais peut aussi être employé plus généralement pour des moutons.
lexical_decisions:
- source_word: כְּבָשִׂים
  choice: moutons
  rationale: Le terme peut désigner des agneaux ou, plus largement, des moutons. Dans le contexte de la production de vêtements, « moutons » rend naturellement l’idée du troupeau qui fournit la laine, tout en conservant l’alternative plus précise en note.
- source_word: לִלְבוּשֶׁךָ
  choice: servent à te vêtir
  rationale: La préposition ל exprime ici la destination ou l’usage. Cette formulation française naturelle restitue le sens de « pour ton vêtement » sans ajouter explicitement la laine, qui reste implicite en hébreu.
- source_word: וּמְחִיר שָׂדֶה
  choice: et … à payer un champ
  rationale: מְחִיר désigne le prix ou le paiement. La proposition hébraïque sans copule signifie que les boucs constituent la valeur permettant de payer un champ; la construction parallèle avec « servent » rend cette relation clairement et sobrement.
- source_word: עַתּוּדִים
  choice: boucs
  rationale: Le mot hébreu désigne spécifiquement des caprins mâles. « Boucs » conserve cette précision lexicale, contrairement au terme plus général « chèvres ».
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise et équilibrée. Le verbe « servent », exprimé dans le premier membre et sous-entendu dans le second, reproduit naturellement en français le parallélisme des deux propositions nominales hébraïques.
