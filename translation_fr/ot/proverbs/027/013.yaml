  text: קַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נָכְרִיָּ֣ה חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/013.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
translation:
  language: fr
  text: Prends son vêtement, car il s’est porté garant pour un étranger ; prends de lui un gage pour une étrangère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu du second membre est très concis. Le verbe peut évoquer le fait de prendre ou de retenir un gage auprès de cet homme. « Étrangère » peut désigner une femme non israélite ou, dans les Proverbes, une femme extérieure aux liens sociaux et moraux reconnus.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Prends
  rationale: L’impératif direct de לקח appelle un verbe simple et ferme ; « prends » convient au style proverbial.
- source_word: בִּגְדוֹ
  choice: son vêtement
  rationale: בגד désigne couramment un vêtement, notamment un bien susceptible de servir de garantie.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit le motif de l’ordre et conserve ici la concision du proverbe.
- source_word: עָרַב
  choice: s’est porté garant
  rationale: Le verbe exprime le fait de garantir la dette ou l’obligation d’autrui ; cette tournure française rend clairement le sens juridico-financier.
- source_word: זָר
  choice: un étranger
  rationale: זר désigne ici une personne extérieure au cercle des proches ; « étranger » préserve cette portée sans la préciser abusivement.
- source_word: וּבְעַד
  choice: s’il l’a fait pour
  rationale: בעד indique que l’action est accomplie pour ou au bénéfice de quelqu’un ; la formulation explicite naturellement le parallélisme elliptique.
- source_word: נָכְרִיָּה
  choice: une étrangère
  rationale: נכריה désigne littéralement une femme étrangère ou extérieure au groupe ; dans les Proverbes, le terme peut aussi évoquer une femme socialement ou moralement illicite, ambiguïté signalée en note.
- source_word: חַבְלֵהוּ
  choice: exige de lui un gage
  rationale: Dans un contexte de garantie, חבל signifie prendre un bien en gage. Le suffixe masculin renvoie naturellement à l’homme dont on exige la garantie, sans imposer que le complément soit exactement le vêtement.
theological_decisions:
- issue: Portée de נָכְרִיָּה
  choice: une étrangère
  alternative: une femme interdite / une adultère
  rationale: Le sens lexical large est conservé, car le contexte ne permet pas de réduire avec certitude le terme à l’adultère ou à une catégorie morale précise.
translation_notes:
  register: Français moderne, direct et proverbial. La répétition juridique est rendue de façon idiomatique tout en maintenant l’image du vêtement et du gage ainsi que l’ambiguïté de « l’étrangère ».
