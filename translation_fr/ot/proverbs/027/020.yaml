  text: שְׁא֣וֹל ו/אבדה לֹ֣א תִשְׂבַּ֑עְנָה וְ/עֵינֵ֥י הָ֝/אָדָ֗ם לֹ֣א תִשְׂבַּֽעְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
translation:
  language: fr
  text: Le shéol et Abaddon[a] ne sont jamais rassasiés ; les yeux de l’être humain[b] ne sont jamais rassasiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la destruction ». Le terme hébreu peut désigner la destruction ou le domaine de la destruction.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est au singulier et désigne ici les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération conserve la notion hébraïque du domaine des morts sans la réduire à la tombe ni lui imposer les connotations doctrinales plus tardives du mot « enfer ».
- source_word: אֲבַדָּה
  choice: la Perdition
  rationale: La majuscule rend la force personnifiée ou quasi locale du terme dans son parallélisme avec le shéol, tout en gardant son sens fondamental de destruction ou de ruine.
- source_word: לֹא תִשְׂבַּעְנָה
  choice: ne sont jamais rassasiés
  rationale: Le verbe exprime le fait d’être rempli jusqu’à satiété. Cette formulation française naturelle maintient la force absolue du proverbe et la répétition hébraïque.
- source_word: עֵינֵי הָאָדָם
  choice: les yeux de l’être humain
  rationale: La traduction conserve l’image concrète des yeux comme siège du désir, tandis que « l’être humain » rend clairement la valeur générique du singulier hébreu.
theological_decisions:
- issue: Valeur générique de הָאָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le nom singulier avec article désigne ici l’être humain en général, et non un individu masculin particulier. « L’être humain » transmet cette portée universelle sans modifier le sens du proverbe.
- issue: Caractère du domaine de destruction
  choice: la Perdition
  alternative: la destruction ; le lieu de perdition
  rationale: Le parallélisme avec le shéol permet une compréhension personnifiée ou locale, sans obliger à identifier précisément ce terme à une doctrine ultérieure de l’au-delà. La note conserve les autres nuances lexicales.
translation_notes:
  register: Français moderne, international et digne. La répétition exacte de « ne sont jamais rassasiés » préserve le parallélisme équilibré et l’insistance de l’hébreu ; le point-virgule rend nettement les deux membres du proverbe.
