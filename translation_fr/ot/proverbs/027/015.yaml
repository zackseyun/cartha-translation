  source_fidelity: La comparaison et la valeur durative de טוֹרֵד sont bien rendues, mais « gouttière » désigne en français le conduit qui évacue l’eau, non l’écoulement ou la fuite répétée que désigne דֶּלֶף. « Épouse » rend plus précisément אֵשֶׁת, « femme de / épouse de » dans cette construction.
