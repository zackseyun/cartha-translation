  terminology: « Fuite d’eau incessante » restitue l’image domestique d’une infiltration ou d’un écoulement importun sans confondre celle-ci avec une gouttière. « Épouse querelleuse » est à la fois naturel et plus exact que « femme querelleuse » pour le terme relationnel hébreu.
