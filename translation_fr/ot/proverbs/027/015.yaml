  text: דֶּ֣לֶף ט֭וֹרֵד בְּ/י֣וֹם סַגְרִ֑יר וְ/אֵ֥שֶׁת מדונים נִשְׁתָּוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/015.yaml
  text: A constant dripping on a day of heavy rain[a], and a quarrelsome wife, are alike.
translation:
  language: fr
  text: Une fuite d’eau incessante, lors d’un jour de pluie battante, et une épouse querelleuse se ressemblent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּלֶף
  choice: une gouttière qui… couler
  rationale: Le nom désigne l'eau qui goutte ou une fuite persistante, vraisemblablement à travers un toit. La formulation française conserve l'image concrète et répétitive.
- source_word: טוֹרֵד
  choice: ne cesse de
  rationale: Le participe exprime une action continue et importune. « Ne cesse de » rend naturellement cette durée en français moderne.
- source_word: בְּיוֹם סַגְרִיר
  choice: par un jour de pluie battante
  rationale: L'expression situe la scène lors d'un temps pluvieux soutenu ou violent. « Pluie battante » conserve l'intensité et le caractère désagréable de l'image sans élargir le sens à tout un orage.
- source_word: אֵשֶׁת מִדְיָנִים
  choice: une femme querelleuse
  rationale: Le syntagme signifie littéralement « une femme de querelles ». « Femme querelleuse » est idiomatique, actuel et fidèle à la caractérisation du texte; dans le contexte proverbial, « femme » peut aussi désigner une épouse.
- source_word: נִשְׁתָּוָה
  choice: se ressemblent
  rationale: Le verbe exprime l'assimilation ou la comparaison. Le pluriel français rend explicitement et naturellement la mise en parallèle des deux réalités, malgré la forme verbale singulière de l'hébreu.
