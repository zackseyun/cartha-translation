  yaml_path: translation/ot/proverbs/026/019.yaml
  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
translation:
  language: fr
  text: 'Tel est l’homme qui trompe son prochain[a] et qui dit : « Est-ce que je ne plaisante pas ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ami » ou « son compagnon ». Le mot hébreu peut désigner un prochain, un ami ou une personne de l’entourage, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « Est-ce que je ne joue pas ? » ou « Est-ce que je ne plaisante pas ? » Le terme hébreu peut évoquer le jeu ou la plaisanterie ; ici, il sert d’excuse pour minimiser une tromperie nuisible.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Tel est
  rationale: Introduit la comparaison avec le verset précédent et donne en français une formulation proverbiale naturelle.
- source_word: אִישׁ
  choice: l’homme
  rationale: Conserve le singulier masculin représentatif du texte hébreu dans une tournure proverbiale idiomatique.
- source_word: רִמָּה
  choice: trompe
  rationale: Exprime l’action délibérément mensongère ou manipulatrice visée par le verbe.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: Préserve le sens relationnel large de רֵעַ sans supposer nécessairement une amitié intime.
- source_word: וְאָמַר
  choice: et qui dit
  rationale: Le présent convient à la caractérisation générale propre au proverbe.
- source_word: הֲלֹא מְשַׂחֵק אָנִי
  choice: Je plaisantais, n’est-ce pas ?
  rationale: Rend la question rhétorique autojustificatrice en français naturel. L’imparfait correspond à l’excuse rétrospective donnée après la tromperie, tandis que « plaisantais » exprime ici le jeu présenté comme inoffensif.
