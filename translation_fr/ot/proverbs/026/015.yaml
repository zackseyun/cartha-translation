  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת נִ֝לְאָ֗ה לַֽ/הֲשִׁיבָ֥/הּ אֶל פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
translation:
  language: fr
  text: Le paresseux enfouit sa main dans le plat[a][b] ; il est trop las pour la ramener à sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cache sa main » ou « plonge sa main ». Le verbe hébreu peut signifier cacher, dissimuler ou enfouir.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le bol » ou « dans l’écuelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: enfouit
  rationale: Le verbe signifie cacher, dissimuler ou enfouir. « Enfouit » conserve l’image concrète, vive et volontairement exagérée du proverbe.
- source_word: עָצֵל
  choice: le paresseux
  rationale: Dans les Proverbes, le terme désigne un type humain récurrent. « Le paresseux » est naturel en français moderne tout en gardant cette portée caractérisante.
- source_word: יָדוֹ
  choice: sa main
  rationale: Traduction directe du nom singulier muni du suffixe possessif masculin singulier.
- source_word: בַּצַּלָּחַת
  choice: dans le plat
  rationale: Le nom désigne un récipient servant à présenter ou contenir des aliments. « Plat » convient au contexte sans préciser indûment sa forme.
- source_word: נִלְאָה
  choice: il est trop las
  rationale: 'La forme exprime la fatigue ou l’épuisement. Dans ce contexte hyperbolique, « trop las pour » rend naturellement le résultat implicite : il ne trouve même pas la force d’achever le geste.'
- source_word: לַהֲשִׁיבָהּ
  choice: pour la ramener
  rationale: Le hifil de שוב exprime le fait de faire revenir ou de ramener. Le pronom féminin renvoie à « sa main », déjà plongée dans le plat.
- source_word: אֶל פִּיו
  choice: à sa bouche
  rationale: Rendu direct et idiomatique qui préserve l’image comique du texte.
theological_decisions: []
