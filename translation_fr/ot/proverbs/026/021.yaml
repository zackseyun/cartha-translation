base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/021.yaml
  text: Charcoal for embers[a], and wood for fire[b], and a quarrelsome man for kindling strife.
translation:
  language: fr
  text: 'Du charbon de bois pour les braises,

    du bois pour le feu,

    et un homme querelleur pour attiser la querelle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּחָם
  choice: charbon
  rationale: Désigne ici le charbon employé comme combustible; ce choix le distingue des braises déjà ardentes et conserve la progression de l’image.
- source_word: גֶחָלִים
  choice: braises
  rationale: Le pluriel désigne des charbons ardents; « braises » est naturel en français et contraste clairement avec « charbon ».
- source_word: עֵצִים
  choice: bois
  rationale: Nom collectif courant; « bois » est concis et convient au parallélisme proverbial.
- source_word: אֵשׁ
  choice: feu
  rationale: Équivalent direct et naturel du nom hébreu.
- source_word: אִישׁ
  choice: homme
  rationale: Reproduit le masculin singulier de l’hébreu et s’intègre au style sentencieux du proverbe.
- source_word: מדונים
  choice: querelleur
  rationale: La tournure signifie littéralement « homme de querelles » et décrit une disposition habituelle; « querelleur » l’exprime naturellement.
- source_word: חַרְחַר
  choice: attiser
  rationale: Le verbe évoque l’action de faire flamber ou d’entretenir; « attiser » conserve à la fois l’image du feu et son application à un conflit.
- source_word: רִיב
  choice: dispute
  rationale: Désigne une querelle ou un conflit; « dispute » est courant, précis et s’associe naturellement à « attiser ».
