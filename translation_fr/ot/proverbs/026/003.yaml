  register: Formulation proverbiale concise, rythmée et dignifiée. Le parallélisme hébreu est conservé par la triple structure nominale avec « pour ». Le présent implicite de l’hébreu est rendu naturellement par « est » dans le premier membre, puis par ellipse dans les deux suivants.
