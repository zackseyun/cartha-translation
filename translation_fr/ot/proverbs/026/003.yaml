  text: שׁ֣וֹט לַ֭/סּוּס מֶ֣תֶג לַ/חֲמ֑וֹר וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/003.yaml
  text: A whip for the horse[a], a bridle for the donkey[b], and a rod for the back of fools.
translation:
  language: fr
  text: Le fouet est pour le cheval, le mors pour l’âne, et le bâton pour le dos des insensés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹט
  choice: fouet
  rationale: Désigne un instrument servant à faire avancer ou à corriger un animal ; « fouet » est l’équivalent français moderne le plus naturel.
- source_word: לַסּוּס
  choice: pour le cheval
  rationale: La préposition ל exprime ici l’usage ou la destination ; l’article défini convient à la formulation proverbiale.
- source_word: מֶתֶג
  choice: mors
  rationale: Le terme désigne le dispositif placé dans la bouche de l’animal pour le maîtriser. « Mors » est précis et naturel dans ce contexte, sans élargir le sens à toute la bride.
- source_word: לַחֲמוֹר
  choice: pour l’âne
  rationale: « Âne » est le terme français moderne courant et correspond à la formulation proverbiale avec article défini.
- source_word: וְשֵׁבֶט
  choice: et le bâton
  rationale: Dans ce contexte disciplinaire, שֵׁבֶט désigne un bâton servant à frapper ; « bâton » est courant, clair et moins archaïque que « verge ».
- source_word: לְגֵו
  choice: pour le dos
  rationale: Le nom vise ici le dos comme endroit où tombe le coup ; cette traduction conserve aussi le parallélisme des trois emplois introduits par « pour ».
- source_word: כְּסִילִים
  choice: des insensés
  rationale: Dans les Proverbes, le mot qualifie ceux qui manquent de sagesse sur le plan moral. « Insensés » garde cette portée sapientielle mieux que le familier « idiots ».
