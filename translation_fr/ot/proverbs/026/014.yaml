  text: הַ֭/דֶּלֶת תִּסּ֣וֹב עַל צִירָ֑/הּ וְ֝/עָצֵ֗ל עַל מִטָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/014.yaml
  text: As a door turns on its hinge[a], so a sluggard on his bed.
translation:
  language: fr
  text: La porte tourne sur ses gonds, et le paresseux sur son lit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme une porte tourne sur ses gonds, ainsi le paresseux se retourne sur son lit. » L’hébreu juxtapose les deux propositions sans exprimer explicitement « comme… ainsi » ni répéter le verbe dans la seconde.'
    reason: ambiguïté syntaxique et explicitation possible de la comparaison
lexical_decisions:
- source_word: הַדֶּלֶת
  choice: la porte
  rationale: Le nom désigne une porte. L’article défini français exprime naturellement ici une réalité générique, comme dans une maxime.
- source_word: תִּסּוֹב
  choice: tourne
  rationale: Le verbe סבב décrit le mouvement répété de la porte autour de son point de rotation. « Tourne » reste simple, naturel et proche de l’image hébraïque.
- source_word: עַל צִירָהּ
  choice: sur ses gonds
  rationale: צִיר désigne le gond ou pivot de la porte. Bien que l’hébreu emploie le singulier, le français idiomatique dit qu’une porte tourne « sur ses gonds ».
- source_word: וְעָצֵל
  choice: et le paresseux
  rationale: עָצֵל est le terme caractéristique des Proverbes pour une personne habituellement paresseuse. « Le paresseux » conserve la portée morale et générique de la maxime.
- source_word: עַל מִטָּתוֹ
  choice: sur son lit
  rationale: מִטָּה désigne ici le lit, et la préposition עַל indique le lieu où le paresseux se retourne, en parallèle avec la porte.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, en français moderne et soutenu sans archaïsme. L’ellipse verbale de la seconde proposition préserve le parallélisme serré et l’ironie de l’hébreu.
