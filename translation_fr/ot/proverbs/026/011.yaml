  text: כְּ֭/כֶלֶב שָׁ֣ב עַל קֵא֑/וֹ כְּ֝סִ֗יל שׁוֹנֶ֥ה בְ/אִוַּלְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/011.yaml
  text: Like a dog returning to its vomit[a], so a fool repeats his folly.
translation:
  language: fr
  text: 'Comme un chien retourne à son vomi,

    ainsi l’insensé répète sa folie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֶלֶב
  choice: Comme un chien
  rationale: Le préfixe כְּ marque la comparaison. « Comme un chien » introduit naturellement la similitude en français.
- source_word: שָׁב
  choice: qui retourne
  rationale: Le participe dépeint une action caractéristique et répétée. La relative « qui retourne » restitue cette valeur de façon naturelle.
- source_word: עַל קֵאוֹ
  choice: à ce qu’il a vomi
  rationale: Littéralement « sur/vers son vomi ». Cette formulation française, concrète et idiomatique, exprime clairement que le chien revient à ce qu’il a rejeté.
- source_word: כְּסִיל
  choice: l’insensé
  rationale: Dans les Proverbes, le terme désigne une personne moralement et intellectuellement réfractaire, non une simple déficience d’intelligence. « L’insensé » convient au registre sapientiel.
- source_word: שׁוֹנֶה
  choice: recommence
  rationale: Le participe signifie ici faire de nouveau ou répéter. « Recommence » rend l’action habituelle tout en restant naturel avec « sa folie ».
- source_word: בְאִוַּלְתּוֹ
  choice: sa folie
  rationale: Le nom désigne la folie avec un suffixe possessif masculin singulier. Avec « recommence », le français peut rendre idiomatiquement la préposition hébraïque sans l’expliciter.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme est conservé sur deux lignes; « insensé » maintient la portée morale du vocabulaire sapientiel sans suggérer un diagnostic intellectuel ou médical.
