  text: בְּ/אֶ֣פֶס עֵ֭צִים תִּכְבֶּה אֵ֑שׁ וּ/בְ/אֵ֥ין נִ֝רְגָּ֗ן יִשְׁתֹּ֥ק מָדֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
translation:
  language: fr
  text: Faute de bois, le feu s’éteint ; là où il n’y a pas de colporteur de ragots[a], la querelle s’apaise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « médisant ». Le terme hébreu désigne une personne qui propage des propos nuisibles, souvent secrètement ou à voix basse.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס
  choice: Faute de
  rationale: Cette tournure française naturelle exprime à la fois l’absence et son effet causal dans le proverbe.
- source_word: עֵצִים
  choice: bois
  rationale: Le pluriel hébreu désigne ici le bois servant de combustible ; le collectif français « bois » convient naturellement.
- source_word: תִּכְבֶּה
  choice: s’éteint
  rationale: Le verbe hébreu est intransitif et décrit un feu qui cesse de brûler.
- source_word: אֵשׁ
  choice: le feu
  rationale: L’article défini convient à la formulation générale et proverbiale en français.
- source_word: וּבְאֵין
  choice: quand il n’y a personne pour
  rationale: Cette formulation rend naturellement la condition générale exprimée par l’hébreu tout en introduisant un nom de personne.
- source_word: נִרְגָּן
  choice: colporter des ragots
  rationale: Le terme désigne une personne qui propage des paroles nuisibles, souvent à voix basse. La tournure verbale est plus courante et immédiatement compréhensible que « rapporteur » ou « chuchoteur » dans ce contexte.
- source_word: יִשְׁתֹּק
  choice: s’apaise
  rationale: Littéralement lié au silence, le verbe décrit ici la querelle qui retombe ; « s’apaise » conserve cette image sans affirmer nécessairement qu’elle disparaît entièrement.
- source_word: מָדוֹן
  choice: la querelle
  rationale: Le mot hébreu désigne la dispute ou la discorde ; « querelle » est concis, courant et adapté au parallélisme proverbial.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme causal est conservé, avec une formulation naturelle et accessible. Le point-virgule marque l’équilibre entre les deux propositions.
