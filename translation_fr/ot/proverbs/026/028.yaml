  text: לְֽשׁוֹן שֶׁ֭קֶר יִשְׂנָ֣א דַכָּ֑י/ו וּ/פֶ֥ה חָ֝לָ֗ק יַעֲשֶׂ֥ה מִדְחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/028.yaml
  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
translation:
  language: fr
  text: La langue mensongère déteste ceux qu’elle écrase[a], et la bouche flatteuse mène à la ruine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses victimes écrasées » ou « ceux qu’elle opprime ». L’hébreu désigne des personnes écrasées ou opprimées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une bouche lisse ». Cette expression évoque des paroles flatteuses ou trompeusement douces. Ou « cause la chute » ou « provoque la ruine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  choice: la langue mensongère
  rationale: Le syntagme signifie littéralement « langue de mensonge ». Cette formulation française, naturelle et digne, conserve la personnification de la langue comme agente.
- source_word: יִשְׂנָא
  choice: déteste
  rationale: L’inaccompli exprime ici une vérité générale propre au proverbe ; le présent français convient donc mieux qu’un futur.
- source_word: דַכָּיו
  choice: ceux qu’elle écrase
  rationale: La forme désigne des personnes écrasées ou opprimées. La relative explicite naturellement leur rapport probable avec la langue mensongère tout en gardant la force de l’image.
- source_word: וּפֶה חָלָק
  choice: et la bouche flatteuse
  rationale: Littéralement « une bouche lisse ». Dans cet idiome, la douceur trompeuse du discours évoque la flatterie ; « bouche flatteuse » en transmet clairement le sens en français moderne.
- source_word: יַעֲשֶׂה
  choice: mène à
  rationale: Avec מִדְחֶה, le verbe « faire » indique que cette parole produit une chute ou une ruine. « Mène à » exprime naturellement ce lien causal sans le surcharger.
- source_word: מִדְחֶה
  choice: la ruine
  rationale: Le nom peut évoquer la chute, l’effondrement ou la ruine. « Ruine » convient au parallélisme et à l’effet destructeur de la flatterie.
