  yaml_path: translation/ot/proverbs/026/012.yaml
  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
translation:
  language: fr
  text: As-tu vu un homme sage à ses propres yeux ? Il y a plus d’espoir pour un insensé que pour lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vois-tu un homme sage à ses propres yeux ? » Le parfait hébreu peut introduire une observation rhétorique formulée au passé ou au présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָ
  choice: As-tu vu
  rationale: Le qatal qal, 2e personne masculine singulière, de ראה se rend naturellement par un passé composé français dans cette question rhétorique. La formulation conserve aussi la possibilité d’une observation fondée sur l’expérience.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu désigne ici un individu masculin pris comme exemple; « un homme » en conserve la forme singulière et genrée.
- source_word: חָכָם
  choice: sage
  rationale: Adjectif attribut appliqué à l’homme; « sage » est le terme courant du vocabulaire sapientiel et prépare le contraste ironique avec כְסִיל.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: Cette expression idiomatique décrit le jugement que l’homme porte sur lui-même. « propres » explicite naturellement en français la valeur réflexive.
- source_word: תִּקְוָה
  choice: espoir
  rationale: Le nom exprime l’espoir ou la perspective d’une amélioration; « espoir » convient au contraste proverbial.
- source_word: לִכְסִיל
  choice: pour un insensé
  rationale: כְסִיל désigne dans les Proverbes une personne moralement et intellectuellement réfractaire. « Insensé » conserve cette catégorie sapientielle sans la réduire à un simple manque d’intelligence.
- source_word: מִמֶּנּוּ
  choice: que pour lui
  rationale: 'La préposition מן marque ici la comparaison: l’insensé offre davantage de raisons d’espérer que l’homme sage à ses propres yeux.'
