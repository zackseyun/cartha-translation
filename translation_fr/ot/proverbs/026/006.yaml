id: PRO.26.6
reference: Proverbs 26:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מְקַצֶּ֣ה רַ֭גְלַיִם חָמָ֣ס שֹׁתֶ֑ה שֹׁלֵ֖חַ דְּבָרִ֣ים בְּ/יַד כְּסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/006.yaml
  text: One who sends messages by the hand of a fool cuts off his feet and drinks violence[a].
translation:
  language: fr
  text: Celui qui fait porter des messages[a] par un insensé se coupe les pieds et boit la violence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des paroles » ; le terme hébreu peut avoir les deux sens, mais il désigne probablement ici une communication confiée à un messager.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַצֶּה
  choice: se coupe
  rationale: Le participe piel exprime une action forte, celle de couper ou retrancher. La tournure pronominale indique naturellement en français que l’expéditeur se fait du tort à lui-même, sans atténuer l’image frappante.
- source_word: רַגְלַיִם
  choice: les pieds
  rationale: Le duel désigne les pieds ou les jambes. « Les pieds » conserve l’image concrète et proverbiale la plus naturelle en français.
- source_word: חָמָס
  choice: la violence
  rationale: Le terme peut désigner la violence, le tort ou le dommage. « La violence » maintient la force concrète du mot et son parallélisme avec l’automutilation évoquée dans le premier membre.
- source_word: שֹׁתֶה
  choice: boit
  rationale: 'Le sens littéral de שתה est conservé afin de préserver la métaphore hébraïque saisissante : le sujet absorbe lui-même le mal qui résulte de son choix.'
- source_word: שֹׁלֵחַ
  choice: fait porter
  rationale: Dans ce contexte où un contenu est envoyé « par la main » de quelqu’un, « fait porter » exprime naturellement en français l’envoi confié à un messager.
- source_word: דְּבָרִים
  choice: messages
  rationale: דְּבָרִים signifie littéralement « paroles » ou « choses », mais l’expression désigne ici vraisemblablement une communication confiée à un porteur. L’autre possibilité est signalée en note.
- source_word: בְּיַד
  choice: par
  rationale: L’expression hébraïque « par la main de » marque ici l’intermédiaire ou l’agent. Le simple « par » est idiomatique en français et, avec « fait porter », rend clairement la fonction de messager.
- source_word: כְּסִיל
  choice: un insensé
  rationale: Dans les Proverbes, כְּסִיל désigne une personne moralement et pratiquement dépourvue de sagesse, et non seulement peu intelligente. « Insensé » garde cette portée sapientielle.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve les deux images abruptes de l’hébreu — se couper les pieds et boire la violence — tout en rendant naturellement la mission confiée à un messager.
