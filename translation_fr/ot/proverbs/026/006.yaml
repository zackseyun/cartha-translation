  source_fidelity: 'Le texte rend fidèlement la structure proverbiale hébraïque : l’expéditeur qui confie des communications à un כסיל s’inflige à lui-même un préjudice, exprimé par les images de se couper les pieds et de boire la violence. « Se coupe les pieds » explicite de manière idiomatique en français le dommage que le sujet se cause, sans ajouter un contenu doctrinal ou altérer l’image. « Boit la violence » conserve volontairement la métaphore abrupte de שֹׁתֶה חָמָס.'
