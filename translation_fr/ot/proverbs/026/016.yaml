  text: חָכָ֣ם עָצֵ֣ל בְּ/עֵינָ֑י/ו מִ֝/שִּׁבְעָ֗ה מְשִׁ֣יבֵי טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/016.yaml
  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
translation:
  language: fr
  text: Le paresseux se croit plus sage que sept personnes qui répondent avec bon sens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que sept personnes qui donnent une réponse judicieuse » ; littéralement : « que sept qui répondent avec discernement ».'
    reason: L’expression מְשִׁיבֵי טָעַם peut souligner soit des personnes qui répondent avec discernement, soit le caractère judicieux de leur réponse.
lexical_decisions:
- source_word: חָכָם
  choice: plus sage
  rationale: L’adjectif prédicatif entre dans une construction comparative avec מִן; « plus sage que » est la formulation française naturelle.
- source_word: עָצֵל
  choice: le paresseux
  rationale: Le terme désigne une personne caractérisée par sa paresse. « Le paresseux » est idiomatique, proverbial et immédiatement compréhensible en français moderne.
- source_word: בְּעֵינָיו
  choice: se croit
  rationale: L’expression hébraïque « à ses propres yeux » indique ici l’opinion que le paresseux a de lui-même. « Se croit » restitue naturellement cette autoévaluation sans la présenter comme objective.
- source_word: מִשִּׁבְעָה
  choice: que sept personnes
  rationale: La préposition מִן introduit la comparaison. Le nom « personnes » explicite en français le référent humain sous-entendu par le participe pluriel.
- source_word: מְשִׁיבֵי טָעַם
  choice: capables de répondre avec bon sens
  rationale: Le participe מְשִׁיבֵי désigne ceux qui donnent une réponse, tandis que טָעַם évoque ici le jugement ou le bon sens. Cette formulation préserve la nuance de capacité possible dans l’expression.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale, actuelle et digne. « Se croit » rend l’idiome hébreu de l’autoévaluation avec plus de naturel que le calque « est sage à ses propres yeux ». Le chiffre sept est conservé sans interpréter sa portée éventuelle.
