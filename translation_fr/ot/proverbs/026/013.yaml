  text: אָמַ֣ר עָ֭צֵל שַׁ֣חַל בַּ/דָּ֑רֶךְ אֲ֝רִ֗י בֵּ֣ין הָ/רְחֹבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/013.yaml
  text: The sluggard says[a], “There is a lion in the road! A lion in the public squares!”
translation:
  language: fr
  text: 'Le paresseux dit : « Il y a un lion sur le chemin ! Un lion au milieu des places publiques ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָצֵל
  choice: le paresseux
  rationale: Le nom désigne dans les Proverbes une personne caractérisée par une paresse habituelle. « Le paresseux » conserve cette portée proverbiale et typologique en français naturel.
- source_word: אָמַר
  choice: dit
  rationale: Bien que la forme hébraïque soit un qatal, le contexte proverbial lui donne une valeur générale ou habituelle. Le présent français exprime naturellement cette portée gnomique.
- source_word: שַׁחַל
  choice: lion
  rationale: Le terme désigne un lion, avec parfois une nuance de force ou de férocité. Le rendre simplement par « lion » évite une précision incertaine et maintient la répétition rhétorique avec אֲרִי.
- source_word: בַּדָּרֶךְ
  choice: sur le chemin
  rationale: L’expression situe le lion sur une voie empruntée. « Sur le chemin » est idiomatique et concret en français moderne.
- source_word: אֲרִי
  choice: lion
  rationale: Ce mot hébreu courant désigne le lion. Employer de nouveau « lion » restitue le parallélisme synonymique et l’exagération de l’excuse.
- source_word: בֵּין הָרְחֹבוֹת
  choice: au milieu des places publiques
  rationale: רְחֹבוֹת désigne de larges espaces ouverts d’une ville, notamment des places. בֵּין peut ici exprimer la présence parmi ou au milieu de ces lieux. Cette formulation conserve la distinction avec le chemin tout en restant naturelle.
