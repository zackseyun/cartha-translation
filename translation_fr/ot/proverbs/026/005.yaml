id: PRO.26.5
reference: Proverbs 26:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲנֵ֣ה כְ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּן יִהְיֶ֖ה חָכָ֣ם בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/005.yaml
  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
translation:
  language: fr
  text: Réponds à l’insensé selon sa folie[a], de peur qu’il ne se croie sage.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme sa folie le mérite ». L’hébreu peut désigner une réponse adaptée à sa folie, sans impliquer que l’on imite sa manière d’agir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ce proverbe est intentionnellement en tension avec Proverbes 26.4 : la sagesse discerne quand il convient de garder le silence et quand il faut répondre.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲנֵה
  choice: Réponds
  rationale: L’impératif appelle ici à donner une réponse. « Réponds » est direct, naturel et maintient le parallélisme avec le verset précédent.
- source_word: כְסִיל
  choice: à l’insensé
  rationale: כְסִיל désigne, dans la littérature sapientiale, une personne moralement et intellectuellement réfractaire à la sagesse. « Insensé » conserve cette catégorie sans la réduire à un manque d’intelligence.
- source_word: כְאִוַּלְתּוֹ
  choice: selon sa folie
  rationale: La préposition כְּ exprime ici une correspondance. Cette formulation proche de l’hébreu préserve l’ambiguïté voulue et la tension avec Proverbes 26.4, sans suggérer nécessairement qu’il faille imiter la conduite de l’insensé.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: פֶּן introduit le résultat négatif qu’il s’agit d’éviter. « De peur que… ne » convient au style proverbial et reste clair en français moderne.
- source_word: יִהְיֶה חָכָם בְּעֵינָיו
  choice: il ne se croie sage
  rationale: L’expression hébraïque signifie littéralement qu’il soit sage à ses propres yeux, c’est-à-dire dans sa propre estimation. « Se croire sage » restitue naturellement cet idiome en français.
theological_decisions:
- issue: Tension interprétative avec Proverbes 26.4
  choice: Conserver « selon sa folie » dans le texte, sans résoudre le paradoxe apparent.
  alternative: « comme sa folie le mérite » ou « d’une manière adaptée à sa folie »
  rationale: 'Les deux proverbes voisins présentent intentionnellement une tension propre au discernement : il ne faut pas répondre de façon à devenir semblable à l’insensé, mais il peut être nécessaire de lui répondre de manière à mettre sa folie en lumière.'
translation_notes:
  register: Français moderne, concis et digne, adapté au caractère proverbial. « Insensé » conserve la portée morale du terme sapiential; « se croie sage » rend idiomatiquement l’expression hébraïque « sage à ses propres yeux ».
