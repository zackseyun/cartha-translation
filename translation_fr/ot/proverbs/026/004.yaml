id: PRO.26.4
reference: Proverbs 26:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תַּ֣עַן כְּ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּֽן תִּשְׁוֶה לּ֥/וֹ גַם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
translation:
  language: fr
  text: Ne réponds pas à l’insensé selon sa folie[a], de peur que toi aussi, tu ne deviennes comme lui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une manière insensée ». L’expression hébraïque « selon sa folie » peut désigner une réponse qui reproduit la manière insensée de l’autre.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verset 5 donne l’instruction complémentaire : « Réponds à l’insensé selon sa folie. » Ensemble, les deux maximes appellent à discerner la réponse adaptée à chaque situation; elles ne formulent pas une règle mécanique.'
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּעַן
  choice: Ne réponds pas
  rationale: אַל suivi de l’inaccompli exprime une interdiction. Cette formulation française est directe et conserve le lien verbal avec le verset suivant.
- source_word: כְּסִיל
  choice: l’insensé
  rationale: Dans la littérature de sagesse, כְּסִיל désigne une personne moralement et intellectuellement obstinée, non une personne simplement peu intelligente. « L’insensé » est un terme français digne et traditionnel qui porte cette nuance.
- source_word: כְאִוַּלְתּוֹ
  choice: selon sa folie
  rationale: Le préfixe כְּ marque ici la correspondance. La formulation conserve l’ambiguïté entre une réponse qui reproduit la manière insensée de l’autre et une réponse ajustée à sa folie, ainsi que la tension voulue avec le verset 5.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: פֶּן introduit une conséquence négative à éviter. « De peur que… ne » rend précisément ce rapport sans ajouter de certitude au résultat.
- source_word: תִּשְׁוֶה לּוֹ
  choice: tu ne deviennes comme lui
  rationale: Le verbe שׁוה avec ל exprime ici l’égalité ou la ressemblance. « Devenir comme lui » rend naturellement l’avertissement portant sur l’assimilation à l’insensé.
- source_word: גַם אָתָּה
  choice: toi aussi
  rationale: La tournure emphatique avertit que l’interlocuteur risque, lui aussi, de rejoindre l’insensé dans sa manière d’être.
theological_decisions:
- issue: Tension interprétative avec Proverbes 26:5
  choice: Conserver « selon sa folie » sans en préciser un seul sens.
  alternative: « Ne réponds pas à l’insensé d’une manière insensée » ou « comme sa folie le mérite ».
  rationale: Les deux proverbes juxtaposés présentent une sagesse liée aux circonstances. Réduire ici la locution à la seule manière de répondre ou au traitement mérité supprimerait l’ambiguïté et atténuerait la tension délibérée avec le verset suivant.
translation_notes:
  register: Français international moderne, clair et digne. « L’insensé » maintient le registre sapientiel sans réduire כְּסִיל à un manque d’intelligence. La syntaxe demeure naturelle tout en conservant l’ambiguïté structurante de l’hébreu.
