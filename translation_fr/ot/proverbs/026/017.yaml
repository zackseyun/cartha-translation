  text: מַחֲזִ֥יק בְּ/אָזְנֵי כָ֑לֶב עֹבֵ֥ר מִ֝תְעַבֵּ֗ר עַל רִ֥יב לֹּֽא לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/017.yaml
  text: Like one who grabs a dog by the ears is a passerby who gets involved in a quarrel not his own[a].
translation:
  language: fr
  text: Comme quelqu’un qui saisit un chien par les oreilles, ainsi fait le passant qui se mêle d’une querelle qui ne le concerne pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui intervient dans une querelle qui n’est pas la sienne ». Le sens précis du verbe hébreu est difficile ; il peut désigner le fait de s’engager dans le conflit d’autrui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיק
  choice: qui saisit
  rationale: Le participe hiphil de חזק exprime ici le fait d’empoigner ou de tenir fermement. « Saisit » conserve la vivacité et le danger de l’image sans être familier.
- source_word: בְּאָזְנֵי
  choice: par les oreilles
  rationale: La préposition indique le point par lequel le chien est saisi ; « par les oreilles » est l’expression française naturelle.
- source_word: כָלֶב
  choice: un chien
  rationale: Traduction directe du nom singulier, maintenu dans l’image proverbiale.
- source_word: עֹבֵר
  choice: le passant
  rationale: Le participe qal substantivé désigne quelqu’un qui passe. « Le passant » est concis et naturel en français.
- source_word: מִתְעַבֵּר
  choice: se mêle
  rationale: Dans ce contexte, le hitpael de עבר évoque vraisemblablement l’intervention dans le conflit d’autrui. « Se mêler de » rend naturellement cette idée tout en laissant à la note la possibilité de signaler la difficulté lexicale.
- source_word: עַל רִיב
  choice: d’une querelle
  rationale: Avec « se mêler », le français demande « de ». « Querelle » correspond au conflit interpersonnel concret du proverbe.
- source_word: לֹא לוֹ
  choice: qui ne le concerne pas
  rationale: Cette formulation française idiomatique exprime qu’il s’agit d’une querelle étrangère au passant, sans suggérer qu’une querelle serait littéralement sa propriété.
