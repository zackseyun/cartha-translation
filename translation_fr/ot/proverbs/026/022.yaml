source:
  edition: WLC
  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: fr
  text: 'Les paroles du médisant sont comme des bouchées savoureuses[a] : elles descendent jusqu’au plus profond de l’être[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des friandises » ou « comme des choses avalées avec avidité ». Le terme hébreu est rare et son sens discuté ; une ancienne tradition le rend par « blessures ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans les chambres du ventre », image hébraïque désignant les parties les plus intimes de la personne.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי נִרְגָּן
  choice: Les paroles du médisant
  rationale: « Paroles » rend naturellement le construit דִּבְרֵי. נִרְגָּן désigne ici une personne qui colporte à voix basse des propos nuisibles et divise ainsi les autres. « Médisant » exprime cet effet mieux que « murmureur », peu idiomatique en français moderne, sans restreindre le sens à la calomnie mensongère.
- source_word: כְּמִתְלַהֲמִים
  choice: comme des bouchées savoureuses
  rationale: Le terme hébreu, rare et discuté, semble désigner des morceaux particulièrement agréables à avaler, image de propos reçus avec avidité. La note conserve les autres compréhensions possibles, notamment l’ancienne traduction « blessures ».
- source_word: וְהֵם יָרְדוּ
  choice: elles descendent
  rationale: Le pronom renvoie aux paroles. Le présent convient à la portée générale de ce proverbe et « descendent » préserve le mouvement concret de l’image hébraïque.
- source_word: חַדְרֵי בָטֶן
  choice: jusqu’au plus profond de l’être
  rationale: Littéralement « les chambres du ventre ». Cette formulation française naturelle communique la pénétration des paroles dans l’intériorité de la personne, tandis que la note préserve l’image corporelle originale.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points met en relief la conséquence imagée sans ajouter de lien causal. Le choix « médisant » reste accessible tout en gardant la portée nuisible et relationnelle de נִרְגָּן.
