id: PRO.26.10
reference: Proverbs 26:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֥ב מְחֽוֹלֵֽל כֹּ֑ל וְ/שֹׂכֵ֥ר כְּ֝סִ֗יל וְ/שֹׂכֵ֥ר עֹבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/010.yaml
  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
translation:
  language: fr
  text: Comme un archer qui blesse tout le monde, ainsi agit celui qui engage un insensé ou qui engage des passants[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est notoirement difficile. « Comme un archer qui blesse tout le monde » suit une interprétation ancienne. D’autres traductions rendent le début plus littéralement, par exemple : « Un grand homme produit toutes choses », ou de manière semblable, mais le sens obtenu s’accorde moins bien avec le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « qui engage un insensé et qui engage n’importe quel passant ». L’idée est qu’une embauche faite sans discernement cause du tort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב
  choice: un archer
  rationale: Le texte consonantique est très difficile. « Archer » suit une interprétation ancienne et cohérente avec le contexte, tandis que le sens courant « grand » produit ici une phrase obscure.
- source_word: מְחוֹלֵל
  choice: qui blesse
  rationale: Dans l’image de l’archer, le participe désigne naturellement une action qui inflige une blessure ou une douleur.
- source_word: כֹּל
  choice: tout le monde
  rationale: L’action de l’archer vise ici des personnes sans distinction; cette formulation française est plus naturelle que « tout ».
- source_word: וְשֹׂכֵר
  choice: ainsi agit celui qui engage
  rationale: Le waw relie l’image à son application. L’ajout de « ainsi agit » explicite en français la comparaison sans en changer la portée.
- source_word: כְּסִיל
  choice: un insensé
  rationale: « Insensé » exprime la déficience morale et intellectuelle associée à כסיל dans la littérature sapientielle.
- source_word: וְשֹׂכֵר
  choice: ou qui engage
  rationale: La répétition du participe peut présenter une seconde forme d’embauche inconsidérée; « ou » rend cette lecture avec naturel.
- source_word: עֹבְרִים
  choice: des passants
  rationale: Le terme désigne littéralement ceux qui passent, ici des personnes prises au hasard et engagées sans discernement.
theological_decisions: []
