  source_fidelity: 'Le texte rend de façon fidèle l’interprétation traditionnelle, attestée mais textuellement disputée, de רַב מְחוֹלֵל כֹּל : l’image d’un archer qui blesse indistinctement tous. « Celui qui engage un insensé ou … des passants » correspond bien aux deux participes répétés וְשֹׂכֵר et maintient l’ambiguïté de la coordination au moyen de la note b. La note a signale correctement la difficulté exceptionnelle de l’hébreu et ne présente pas l’interprétation retenue comme certaine.'
  naturalness: « Comme un archer qui blesse tout le monde, ainsi agit celui qui engage un insensé ou qui engage des passants » est naturel, clair et d’un registre sapientiel sobre en français international moderne. La reprise de « qui engage » est acceptable et rend visible la répétition hébraïque.
  terminology: « Archer », « blesse », « insensé » et « passants » sont des choix appropriés. « Insensé » conserve utilement la portée morale et intellectuelle de כְּסִיל sans lui imposer un sens confessionnel. Les deux appels de note sont correctement placés et les notes correspondent à leurs motifs annoncés.
