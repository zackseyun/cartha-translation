source:
  edition: WLC
  text: כִּֽי יְחַנֵּ֣ן ק֭וֹל/וֹ אַל תַּֽאֲמֶן בּ֑/וֹ כִּ֤י שֶׁ֖בַע תּוֹעֵב֣וֹת בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/025.yaml
  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
translation:
  language: fr
  text: Quand il donne à sa voix un ton aimable[a], ne lui fais pas confiance, car il y a sept abominations dans son cœur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand il parle avec amabilité » ou « Quand il prend une voix aimable ». L’hébreu dit littéralement « quand il rend sa voix gracieuse ».
    reason: lexical_alternative
  - marker: b
    text: Dans la littérature de sagesse, « sept » peut évoquer la plénitude ou la totalité ; le nombre est néanmoins conservé dans le texte.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַנֵּן
  choice: rend … aimable
  rationale: Le piel de חנן, avec « sa voix » comme objet, évoque le fait de donner à sa voix un caractère gracieux ou séduisant. « Rend sa voix aimable » conserve l’image hébraïque tout en restant intelligible en français.
- source_word: קוֹלוֹ
  choice: sa voix
  rationale: Le texte hébreu dit littéralement « sa voix ». Le maintien de cette expression concrète préserve l’image et la texture poétique du proverbe.
- source_word: אַל תַּאֲמֶן בּוֹ
  choice: ne lui fais pas confiance
  rationale: Le hifil de אמן suivi de ב exprime ici la confiance placée en une personne. Cette formulation convient mieux au contexte que « ne le crois pas », qui viserait surtout la véracité de ses paroles.
- source_word: שֶׁבַע
  choice: sept
  rationale: Le nombre explicite est conservé. Dans la littérature de sagesse, sept peut suggérer la plénitude ou la totalité, sans qu’il soit nécessaire de remplacer le nombre par une interprétation.
- source_word: תּוֹעֵבוֹת
  choice: abominations
  rationale: תּוֹעֵבוֹת désigne des réalités profondément odieuses ou détestables, avec une forte portée morale. « Abominations » en conserve l’intensité biblique.
- source_word: בְּלִבּוֹ
  choice: dans son cœur
  rationale: Le « cœur » désigne bibliquement l’être intérieur, notamment les pensées et les intentions. L’image hébraïque est naturelle et familière en français biblique moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu, tandis que « ne lui fais pas confiance » rend naturellement la construction verbale. Les images de la voix, des sept abominations et du cœur sont conservées.
