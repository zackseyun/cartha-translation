  yaml_path: translation/ot/proverbs/026/018.yaml
  text: Like a madman who shoots firebrands[a], arrows, and death[b],
translation:
  language: fr
  text: Comme un fou qui lance des projectiles enflammés[a], des flèches et la mort[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des tisons » ou « des traits enflammés ».
