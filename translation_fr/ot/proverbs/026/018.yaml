lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  choice: Comme un fou
  rationale: Le כ préfixé introduit la comparaison. Le participe exprime ici une conduite insensée, démente et dangereuse. « Comme un fou » est naturel, vif et suffisamment fort en français moderne.
- source_word: הַיֹּרֶה
  choice: qui lance
  rationale: Le verbe ירה peut désigner l’action de tirer ou de lancer des projectiles. Comme les objets comprennent à la fois des projectiles incendiaires et des flèches, « lance » permet de maintenir une construction naturelle sans préciser un dispositif absent du texte.
- source_word: זִקִּים
  choice: des projectiles enflammés
  rationale: Le nom désigne ici des objets incendiaires projetés. Cette formulation actuelle rend mieux le danger et le mouvement que « tisons », qui pourrait suggérer de simples morceaux de bois brûlant.
- source_word: חִצִּים
  choice: des flèches
  rationale: C’est le sens courant et direct du nom dans ce contexte.
- source_word: וָמָוֶת
  choice: et la mort
  rationale: 'La traduction littérale conserve la culmination saisissante de l’hébreu et son ambiguïté : la mort peut être présentée comme ce qui est lancé, comme le résultat des tirs ou comme un résumé poétique de leur effet meurtrier.'
