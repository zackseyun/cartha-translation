  variant: modern international French
source:
  edition: WLC
  text: כַּ/שֶּׁ֤לֶג בַּ/קַּ֗יִץ וְ/כַ/מָּטָ֥ר בַּ/קָּצִ֑יר כֵּ֤ן לֹא נָאוֶ֖ה לִ/כְסִ֣יל כָּבֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/001.yaml
  text: Like snow in summer and like rain at harvest[a], so honor is not fitting for a fool.
translation:
  language: fr
  text: Comme la neige en été et comme la pluie au temps de la moisson[a], l’honneur ne convient pas à un insensé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La neige en été et la pluie au temps de la moisson : de même, l’honneur ne sied pas à un insensé. »'
    reason: Alternative de formulation qui rend explicitement כֵּן (« de même ») et emploie « sied » pour la notion de convenance exprimée par נָאוֶה.
lexical_decisions:
- source_word: כַּשֶּׁלֶג
  choice: Comme la neige
  rationale: Le préfixe כַּ־ marque une comparaison. « Comme la neige » rend clairement l’image et convient au style proverbial français.
- source_word: בַּקַּיִץ
  choice: en été
  rationale: L’expression désigne la saison chaude et sèche ; « en été » est naturel et concis.
- source_word: וְכַמָּטָר
  choice: et comme la pluie
  rationale: La seconde comparaison est maintenue explicitement afin de préserver le parallélisme de l’hébreu.
- source_word: בַּקָּצִיר
  choice: au temps de la moisson
  rationale: קָצִיר désigne la moisson ou sa période. Cette formulation met en évidence le caractère saisonnier et inopportun de la pluie.
- source_word: כֵּן
  choice: '[structure comparative :] … l’honneur ne convient pas'
  rationale: En français, la construction « Comme… » peut introduire directement la conclusion sans rendre כֵּן par un « ainsi » lourd. La relation comparative reste nette ; la note propose une formulation plus explicite.
- source_word: לֹא נָאוֶה
  choice: ne convient pas
  rationale: Le verbe exprime ce qui n’est ni approprié ni séant. « Ne convient pas » est actuel, naturel et fidèle.
- source_word: לִכְסִיל
  choice: à un insensé
  rationale: Dans les Proverbes, כְּסִיל désigne une personne réfractaire à la sagesse, et non simplement quelqu’un qui manque d’intelligence. « Insensé » conserve cette portée morale et sapientielle.
- source_word: כָּבוֹד
  choice: l’honneur
  rationale: Dans ce contexte, כָּבוֹד renvoie à l’honneur ou à l’estime accordés socialement, plutôt qu’à la gloire divine.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme des deux images est conservé. « Insensé » maintient le vocabulaire sapientiel traditionnel sans réduire כְּסִיל à une déficience intellectuelle.
