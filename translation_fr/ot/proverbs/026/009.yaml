id: PRO.26.9
reference: Proverbs 26:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ח֭וֹחַ עָלָ֣ה בְ/יַד שִׁכּ֑וֹר וּ֝/מָשָׁ֗ל בְּ/פִ֣י כְסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/009.yaml
  text: Like a thorn that comes up in the hand of a drunkard[b][a], so is a proverb in the mouth of fools.
translation:
  language: fr
  text: Comme une épine qui s’élève dans la main d’un homme ivre[a][b], ainsi est un proverbe dans la bouche des insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comme un buisson épineux dans la main d’un homme ivre… »
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie littéralement « monter » ou « s’élever ». L’image peut évoquer une épine levée ou brandie, ou encore une épine qui vient dangereusement dans la main de l’homme ivre, sans que le geste précis soit explicité.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹחַ
  choice: épine
  rationale: Le nom peut désigner une épine ou une plante épineuse. « Épine » exprime de façon concise l’objet aigu et dangereux de la comparaison, tout en laissant l’autre possibilité en note.
- source_word: עָלָה
  choice: s’élève
  rationale: Le verbe signifie littéralement « monter » ou « s’élever ». Ce choix conserve l’image inhabituelle de l’hébreu sans préciser indûment si l’épine est levée, brandie ou vient blesser la main.
- source_word: בְיַד
  choice: dans la main de
  rationale: Traduction concrète et directe qui préserve le parallèle avec « dans la bouche de ».
- source_word: שִׁכּוֹר
  choice: homme ivre
  rationale: Le terme désigne une personne en état d’ivresse. « Homme ivre » est naturel en français et n’ajoute pas nécessairement l’idée d’une habitude permanente que pourrait suggérer « ivrogne ».
- source_word: מָשָׁל
  choice: proverbe
  rationale: Dans ce livre, le terme désigne couramment une sentence proverbiale; « proverbe » convient au genre et à la comparaison.
- source_word: בְּפִי
  choice: dans la bouche de
  rationale: La formulation concrète reprend l’image corporelle du texte et maintient le parallélisme avec « dans la main de ».
- source_word: כְסִילִים
  choice: insensés
  rationale: Dans la littérature sapientielle, le mot désigne des personnes moralement obtuses ou réfractaires à la sagesse, et non de simples personnes peu intelligentes.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. La tournure légèrement imagée « qui s’élève dans la main » conserve l’étrangeté et l’ambiguïté du texte hébreu plutôt que de les résoudre par « brandie » ou « qui blesse ». « Ainsi est » maintient la structure concise de la comparaison.
