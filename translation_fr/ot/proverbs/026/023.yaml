  text: כֶּ֣סֶף סִ֭יגִים מְצֻפֶּ֣ה עַל חָ֑רֶשׂ שְׂפָתַ֖יִם דֹּלְקִ֣ים וְ/לֶב רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/023.yaml
  text: Like silver dross overlaid on earthenware are fervent lips with an evil heart[a].
translation:
  language: fr
  text: Des lèvres ardentes et un cœur mauvais sont comme des scories d’argent plaquées sur un vase de terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des lèvres brûlantes » ; le participe hébreu évoque littéralement la chaleur ou le feu et décrit ici des paroles qui paraissent très chaleureuses ou empressées.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  choice: scories d’argent
  rationale: L’expression désigne les résidus impurs liés à l’argent, non de l’argent pur. « Scories d’argent » conserve le contraste entre un aspect métallique séduisant et une matière sans valeur.
- source_word: מְצֻפֶּה
  choice: une couche … sur
  rationale: Le participe passif évoque ce qui est recouvert ou plaqué. La tournure française présente naturellement une mince couverture extérieure sans suggérer que l’objet est en argent massif.
- source_word: עַל חָרֶשׂ
  choice: sur un vase de terre
  rationale: חָרֶשׂ renvoie à la terre cuite ou à la poterie. « Vase de terre » rend concrètement le support de peu de valeur sous son revêtement brillant.
- source_word: שְׂפָתַיִם
  choice: lèvres
  rationale: Le sens littéral est « lèvres ». L’image corporelle reste naturelle en français et désigne la parole exprimée.
- source_word: דֹּלְקִים
  choice: ardentes
  rationale: Le participe évoque littéralement la chaleur ou le fait de brûler. « Ardentes » préserve cette image et l’intensité apparente des paroles sans préciser indûment qu’elles seraient flatteuses.
- source_word: וְלֶב רָע
  choice: avec un cœur mauvais
  rationale: La conjonction associe les paroles extérieures à la réalité intérieure. « Avec » exprime cette coexistence sans transformer explicitement le lien en opposition, tandis que « cœur mauvais » maintient la portée morale de רָע.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La comparaison est explicitée par « ainsi sont » afin de relier clairement l’image initiale à son application, tout en conservant les métaphores des lèvres et du cœur ainsi que l’ambiguïté de l’ardeur apparente.
