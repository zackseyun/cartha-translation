revisions:
- from: Même si la haine se dissimule par la tromperie[a], sa méchanceté sera dévoilée au sein de l’assemblée[b].
  to: Même si la haine est dissimulée par la tromperie[a], le mal de celui qui la dissimule sera dévoilé dans l’assemblée[b].
  rationale: La révision conserve la construction concessive et les deux passifs du proverbe. Elle remplace le réfléchi « se dissimule » par le passif plus direct « est dissimulée » et explicite sobrement le référent personnel du suffixe de « son mal », qui risquait d’être obscurci par l’accord français.
