  text: תִּכַּסֶּ֣ה שִׂ֭נְאָה בְּ/מַשָּׁא֑וֹן תִּגָּלֶ֖ה רָעָת֣/וֹ בְ/קָהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/026.yaml
  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
translation:
  language: fr
  text: Même si la haine est dissimulée par la tromperie[a], le mal de celui qui la dissimule sera dévoilé dans l’assemblée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la duplicité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la communauté réunie ». Le terme hébreu désigne un groupe assemblé.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה
  choice: se dissimule
  rationale: Le nifal peut avoir ici une valeur passive ou réfléchie. « Se dissimule » rend naturellement en français l’idée que la haine demeure cachée derrière un comportement trompeur.
- source_word: שִׂנְאָה
  choice: la haine
  rationale: Le nom désigne la haine ou l’hostilité; « la haine » conserve la formulation abstraite et proverbiale.
- source_word: בְּמַשָּׁאוֹן
  choice: par la tromperie
  rationale: Le nom désigne ici la tromperie ou la duplicité, et la préposition ב marque vraisemblablement le moyen par lequel la haine est dissimulée.
- source_word: תִּגָּלֶה
  choice: sera dévoilée
  rationale: Le nifal exprime la mise au jour. Le futur convient à l’affirmation proverbiale selon laquelle le mal caché finit par devenir manifeste.
- source_word: רָעָתוֹ
  choice: sa méchanceté
  rationale: רָעָה peut désigner le mal, la méchanceté ou une intention nuisible. « Sa méchanceté » désigne clairement ici le mal moral et malveillant de la personne concernée.
- source_word: בְקָהָל
  choice: au sein de l’assemblée
  rationale: קָהָל désigne une communauté réunie. Cette formulation préserve le cadre concret d’un groupe assemblé sans le réduire au simple adverbe « publiquement ».
