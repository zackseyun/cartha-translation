review_pass:
  verdict: revise
  source_fidelity: 'La relation fondamentale est bien rendue : une haine cachée au moyen de la tromperie finit par voir le mal qui lui est associé exposé devant une assemblée. Toutefois, « sa méchanceté » peut en français renvoyer grammaticalement à « la haine » plutôt qu’à la personne visée par le suffixe masculin de רָעָתוֹ. Une reformulation légère lève cette ambiguïté sans restreindre le sens de רָעָה.'
  naturalness: Le français est clair et de registre approprié. « Dans l’assemblée » est un peu plus direct et idiomatique que « au sein de l’assemblée » tout en conservant le cadre collectif concret de קָהָל.
  terminology: « Tromperie » convient pour מַשָּׁאוֹן, et « assemblée » conserve utilement la portée communautaire de קָהָל. « Le mal de celui qui la dissimule » rend plus largement רָעָתוֹ que « méchanceté » et relie sans ambiguïté ce mal à l’auteur de la dissimulation.
  issues:
  - severity: medium
    issue: Ambiguïté du possessif dans « sa méchanceté ».
    rationale: Le suffixe -וֹ de רָעָתוֹ renvoie à l’individu animé impliqué dans la haine trompeusement cachée. En français, « sa » peut facilement être compris comme renvoyant à « la haine », nom féminin ; « le mal de celui qui la dissimule » préserve le référent personnel sans imposer une interprétation théologique.
  revised_text: Même si la haine est dissimulée par la tromperie[a], le mal de celui qui la dissimule sera dévoilé dans l’assemblée[b].
  revised_footnotes:
  - marker: a
    text: Ou « par la duplicité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la communauté réunie ». Le terme hébreu désigne un groupe assemblé.
    reason: lexical_alternative
  revision_rationale: La révision conserve la construction concessive et les deux passifs du proverbe. Elle remplace le réfléchi « se dissimule » par le passif plus direct « est dissimulée » et explicite sobrement le référent personnel du suffixe de « son mal », qui risquait d’être obscurci par l’accord français.
