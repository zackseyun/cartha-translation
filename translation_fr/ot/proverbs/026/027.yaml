  text: כֹּֽרֶה שַּׁ֭חַת בָּ֣/הּ יִפֹּ֑ל וְ/גֹ֥לֵ֥ל אֶ֝בֶן אֵלָ֥י/ו תָּשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/027.yaml
  text: Whoever digs a pit will fall into it[a], and he who rolls a stone, it will come back on him.
translation:
  language: fr
  text: Qui creuse une fosse y tombera, et celui qui roule une pierre, elle reviendra sur lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֶה
  choice: Qui creuse
  rationale: Le participe qal substantivé exprime une personne quelconque; « qui creuse » rend naturellement cette portée générale en français proverbial.
- source_word: שַּׁחַת
  choice: une fosse
  rationale: « Fosse » restitue l’image d’un trou profond, éventuellement préparé comme piège, sans ajouter explicitement une intention absente du terme.
- source_word: בָּהּ
  choice: y
  rationale: Le pronom féminin renvoie à « fosse »; avec « tomber », le pronom adverbial « y » est la formulation française la plus naturelle.
- source_word: יִפֹּל
  choice: tombera
  rationale: L’imparfait hébreu énonce ici la conséquence prévisible; le futur français convient à la formulation proverbiale de cause à effet.
- source_word: וְגֹלֵל
  choice: et qui roule
  rationale: Le second participe substantivé est rendu parallèlement au premier, en conservant la portée générale.
- source_word: אֶבֶן
  choice: une pierre
  rationale: « Pierre » est l’équivalent courant et suffisamment large du nom hébreu dans cette image.
- source_word: אֵלָיו
  choice: sur lui
  rationale: Avec le verbe « revenir », cette expression indique que le mouvement se retourne contre celui qui l’a provoqué, tout en conservant l’image concrète.
- source_word: תָּשׁוּב
  choice: la verra revenir
  rationale: Le sens de base est « elle reviendra ». La construction française « la verra revenir » évite une dislocation peu naturelle tout en exprimant clairement le retour de la pierre sur l’auteur de l’action.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme des deux participes génériques est conservé par la répétition de « qui ». Aucun marqueur de note n’est nécessaire, le sens pouvant être rendu clairement dans le texte.
