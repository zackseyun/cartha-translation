id: PRO.26.2
reference: Proverbs 26:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כַּ/צִּפּ֣וֹר לָ֭/נוּד כַּ/דְּר֣וֹר לָ/ע֑וּף כֵּ֥ן קִֽלְלַ֥ת חִ֝נָּ֗ם לא תָבֹֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
translation:
  language: fr
  text: 'Comme le moineau qui voltige,

    comme l’hirondelle[a] qui vole,

    ainsi une malédiction sans cause[b]

    ne vient pas se poser[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le martinet »; l’identification exacte de cet oiseau est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une malédiction pour rien », c’est-à-dire sans motif valable ou imméritée.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ne vient pas ». L’image suggère qu’elle ne se pose pas sur sa cible et ne produit pas son effet.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  choice: Comme le moineau
  rationale: צִפּוֹר peut désigner un petit oiseau en général. « Moineau » est une désignation naturelle et traditionnelle qui convient au parallélisme avec le second oiseau; le préfixe כַּ־ introduit la comparaison.
- source_word: לָנוּד
  choice: qui voltige
  rationale: נוּד évoque un mouvement errant, instable ou continuel. « Qui voltige » restitue cette mobilité dans une formulation poétique et naturelle.
- source_word: כַּדְּרוֹר
  choice: comme l’hirondelle
  rationale: דְּרוֹר est traditionnellement identifié à l’hirondelle, même si l’identification zoologique avec le martinet reste possible; cette autre possibilité est signalée en note.
- source_word: לָעוּף
  choice: qui vole
  rationale: עוּף signifie « voler ». La proposition relative forme un parallèle fluide avec « qui voltige ».
- source_word: כֵּן
  choice: ainsi
  rationale: כֵּן introduit la conclusion de la comparaison. « Ainsi » conserve la structure concise du proverbe.
- source_word: קִלְלַת חִנָּם
  choice: une malédiction sans cause
  rationale: La construction signifie littéralement une malédiction prononcée sans motif ou sans fondement. « Sans cause » préserve l’expression hébraïque et son ambiguïté entre absence de motif et caractère immérité.
- source_word: לֹא תָבֹא
  choice: ne vient pas se poser
  rationale: בוא signifie littéralement « venir ». Dans l’image d’oiseaux en mouvement, la formulation française exprime naturellement l’idée que la malédiction n’atteint pas sa cible et ne s’y pose pas, tout en signalant le sens littéral en note.
theological_decisions:
- issue: Effet d’une malédiction sans fondement
  choice: La traduire comme ne venant pas se poser
  alternative: « ne vient pas » ou « n’arrive pas »
  rationale: Le texte nie l’arrivée de la malédiction sans expliquer mécaniquement pourquoi. La traduction conserve cette affirmation proverbiale et l’image implicite, sans ajouter une doctrine particulière sur le fonctionnement des malédictions.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme hébreu est conservé sur quatre lignes; « voltige » et « se poser » maintiennent l’image des oiseaux sans employer un vocabulaire recherché.
