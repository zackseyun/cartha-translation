    issue: Formulation instrumentale peu naturelle
    rationale: En français, « se déguise par ses lèvres » sonne artificiel. Les lèvres désignent ici l’usage de la parole ; « par ses paroles » est une métonymie française naturelle, avec une note qui maintient le littéral.
  - severity: low
