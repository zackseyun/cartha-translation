source:
  edition: WLC
  text: ב/שפת/ו יִנָּכֵ֣ר שׂוֹנֵ֑א וּ֝/בְ/קִרְבּ֗/וֹ יָשִׁ֥ית מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/024.yaml
  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
translation:
  language: fr
  text: Celui qui hait se dissimule par ses paroles[a], mais il place la tromperie au fond de lui-même[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « par ses lèvres ». Ou « fait semblant par ses paroles ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans son intérieur » ou « au-dedans de lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׂפָתוֹ
  choice: par ses lèvres
  rationale: La préposition בְּ a ici une valeur instrumentale. Cette formulation conserve l’image concrète des lèvres comme moyen de dissimulation.
- source_word: יִנָּכֵר
  choice: se déguise
  rationale: Le niphal de נכר exprime ici le fait de se donner une apparence différente, donc de dissimuler ce que l’on est ou ressent réellement.
- source_word: שֹׂנֵא
  choice: celui qui éprouve de la haine
  rationale: Le participe substantivé désigne une personne qui hait. Cette tournure est naturelle en français moderne et évite le substantif peu idiomatique « un haineux ».
- source_word: וּבְקִרְבּוֹ
  choice: au-dedans de lui
  rationale: קֶרֶב désigne l’intérieur de la personne. La traduction préserve le contraste entre les lèvres visibles et la réalité intérieure sans préciser indûment « cœur ».
- source_word: יָשִׁית
  choice: il place
  rationale: שׁית signifie mettre, placer ou établir. « Place » garde l’idée d’un acte délibéré tout en restant proche de l’image hébraïque.
- source_word: מִרְמָה
  choice: la tromperie
  rationale: מִרְמָה désigne la tromperie, la duplicité ou la perfidie. « Tromperie » convient clairement au contraste entre l’apparence extérieure et l’intention intérieure.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre l’expression extérieure (« lèvres ») et l’intériorité est conservé; la formulation évite d’ajouter la notion de « cœur », absente du texte hébreu.
