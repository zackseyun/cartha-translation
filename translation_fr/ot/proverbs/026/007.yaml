  yaml_path: translation/ot/proverbs/026/007.yaml
  text: Like the legs that hang limp from a lame man[a], so is a proverb in the mouth of fools.
translation:
  language: fr
  text: Les jambes d’un boiteux pendent mollement ; tel est un proverbe dans la bouche des insensés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Comme les jambes qui pendent mollement chez un boiteux, ainsi est un proverbe dans la bouche des insensés. »'
    reason: La syntaxe concise de l’hébreu peut être rendue soit par deux membres parallèles, soit par une comparaison explicitée.
lexical_decisions:
- source_word: דַּלְיוּ
  choice: pendent, inertes
  rationale: Le verbe évoque des membres qui retombent sans force. Cette formulation conserve l’image concrète sans réduire le sens à une simple faiblesse.
- source_word: שֹׁקַיִם
  choice: jambes
  rationale: Le terme peut désigner plus précisément les jambes ou les parties inférieures des membres, mais « jambes » est ici naturel et suffisamment précis.
- source_word: מִפִּסֵּחַ
  choice: du boiteux
  rationale: 'La préposition marque ici l’appartenance ou l’association : il s’agit des jambes de la personne boiteuse.'
- source_word: וּמָשָׁל
  choice: tel est un proverbe
  rationale: La conjonction introduit le second terme de la comparaison. « Tel est » rend explicitement le parallélisme implicite en hébreu.
- source_word: מָשָׁל
  choice: proverbe
  rationale: Dans ce livre, מָשָׁל désigne naturellement un proverbe ou une maxime de sagesse ; « proverbe » correspond au genre et au contexte.
- source_word: בְּפִי
  choice: dans la bouche des
  rationale: La traduction conserve la métaphore concrète de l’hébreu pour la parole prononcée.
- source_word: כְסִילִים
  choice: insensés
  rationale: Dans la littérature sapientiale, le mot désigne des personnes dépourvues de sagesse sur les plans moral et intellectuel. « Insensés » préserve cette portée sans suggérer seulement un manque d’intelligence.
