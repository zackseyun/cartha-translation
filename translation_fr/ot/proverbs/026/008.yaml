  text: כִּ/צְר֣וֹר אֶ֭בֶן בְּ/מַרְגֵּמָ֑ה כֵּן נוֹתֵ֖ן לִ/כְסִ֣יל כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/008.yaml
  text: Like one who binds a stone in a sling[a], so is one who gives honor to a fool.
translation:
  language: fr
  text: Comme lorsqu’on attache une pierre dans une fronde[a], ainsi en est-il de celui qui honore un insensé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Comme déposer une pierre dans un tas de pierres, ainsi en est-il de celui qui honore un insensé. » Le sens du terme hébreu traduit par « fronde » est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּצְרוֹר
  choice: Comme attacher
  rationale: L’infinitif français rend naturellement l’image proverbiale et reflète le verbe צרר, « attacher, lier », sans préciser davantage la manière de fixer la pierre.
- source_word: אֶבֶן
  choice: une pierre
  rationale: « Pierre » est le sens courant et convient à l’image probable de la fronde.
- source_word: בְּמַרְגֵּמָה
  choice: à une fronde
  rationale: Le nom hébreu est rare et incertain. « Fronde » donne ici une image cohérente; la préposition « à » exprime idiomatiquement en français la fixation de la pierre à l’objet. L’autre interprétation, « tas de pierres », est conservée en note.
- source_word: כֵּן
  choice: ainsi fait
  rationale: Cette tournure relie clairement l’image à son application tout en produisant une maxime française naturelle.
- source_word: נוֹתֵן
  choice: celui qui accorde
  rationale: Le participe exprime une personne quelconque accomplissant l’action. « Accorder de l’honneur » est idiomatique et garde l’idée d’attribution.
- source_word: לִכְסִיל
  choice: à un insensé
  rationale: Dans les Proverbes, כְּסִיל désigne une personne moralement obtuse et réfractaire à la sagesse. « Insensé » garde ce poids moral mieux que le familier « idiot ».
- source_word: כָּבוֹד
  choice: de l’honneur
  rationale: Dans ce contexte, le terme désigne l’estime ou la considération sociale, et non la « gloire » au sens élevé.
