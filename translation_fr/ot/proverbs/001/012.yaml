id: PRO.1.12
reference: Proverbs 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: fr
  text: Engloutissons-les vivants comme le shéol[a], tout entiers[b] comme ceux qui descendent dans la fosse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le séjour des morts ». Le shéol désigne, dans la pensée hébraïque, le domaine des morts.
    reason: lexical_alternative
  - marker: b
    text: Ou « intacts » ou « sans défaut ». Le terme hébreu peut exprimer ici l’idée d’intégrité ou de totalité.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  choice: Engloutissons-les
  rationale: Le cohortatif qal à la première personne du pluriel exprime l’exhortation des conspirateurs. « Engloutissons-les » conserve l’image saisissante d’une absorption complète et sonne naturellement en français.
- source_word: כִּשְׁאוֹל
  choice: comme le shéol
  rationale: La translittération « shéol » préserve la notion hébraïque du séjour des morts et l’image de sa puissance dévorante, sans la réduire à la tombe individuelle.
- source_word: חַיִּים
  choice: vivants
  rationale: 'L’adjectif a ici une valeur prédicative : les victimes seraient englouties alors qu’elles sont encore en vie.'
- source_word: וּתְמִימִים
  choice: tout entiers
  rationale: Dans ce contexte de violence et d’engloutissement, le mot évoque l’intégrité physique plutôt qu’une qualité morale. « Tout entiers » conserve ce sens et le parallélisme poétique.
- source_word: כְּיֹרְדֵי בוֹר
  choice: comme ceux qui descendent dans la fosse
  rationale: La tournure participiale désigne ceux qui descendent vers le domaine de la mort. « La fosse » maintient l’image concrète de בור et son association poétique avec la mort.
theological_decisions:
- issue: Rendu de שְׁאוֹל
  choice: le shéol
  alternative: le séjour des morts ; la tombe
  rationale: Conserver « shéol » respecte l’imagerie et l’indétermination de la conception hébraïque, sans lui imposer un équivalent français plus étroit.
- issue: Sens de תְמִימִים dans le contexte
  choice: tout entiers
  alternative: intacts ; sans défaut ; irréprochables
  rationale: Le contexte décrit une embuscade meurtrière et l’engloutissement des victimes, non leur statut moral. Le sens physique est donc privilégié sans effacer les autres possibilités lexicales.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le verbe « engloutir » restitue l’image poétique avec naturel ; « shéol » est expliqué en note pour rester accessible. Le point d’exclamation rend l’élan exhortatif du cohortatif dans le discours direct.
