source:
  edition: WLC
  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: fr
  text: 'Au point le plus en vue des lieux bruyants, elle lance son appel[a] ; aux entrées des portes de la ville[b], elle prononce ses paroles[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Au sommet des lieux tumultueux, elle appelle. » L’expression hébraïque peut désigner soit l’endroit le plus en vue, soit un point élevé ou avancé au milieu de l’agitation publique.'
    reason: lexical_alternative
  - marker: b
    text: Les portes des villes étaient d’importants lieux publics où se déroulaient le commerce, les affaires judiciaires et la vie civique.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « elle dit ses paroles », tournure qui introduit sa prise de parole publique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ
  choice: À l’endroit le plus en vue
  rationale: רֹאשׁ signifie littéralement « tête » et peut désigner le sommet, le début ou l’endroit le plus en vue. Ici, la formulation française exprime naturellement l’idée d’une position publique de premier plan sans imposer l’image d’une hauteur physique.
- source_word: הֹמִיּוֹת
  choice: parmi les lieux bruyants
  rationale: Le terme, issu de la racine exprimant le grondement ou l’agitation, évoque des endroits marqués par le bruit et le tumulte. « Lieux bruyants » conserve cette indétermination mieux que l’ajout précis de « rues ».
- source_word: תִּקְרָא
  choice: elle lance son appel
  rationale: קרא signifie appeler ou crier. « Lance son appel » rend la proclamation publique et audible de la Sagesse dans un français naturel.
- source_word: בְּפִתְחֵי שְׁעָרִים
  choice: aux entrées des portes
  rationale: פֶּתַח désigne une ouverture ou une entrée, et שַׁעַר les portes de la ville. La traduction garde les deux éléments du texte hébreu.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: La locution situe explicitement la scène dans l’espace urbain, conformément au sens direct de l’hébreu.
- source_word: אֲמָרֶיהָ תֹאמֵר
  choice: elle prononce ses paroles
  rationale: L’hébreu dit littéralement « elle dit ses paroles ». « Elle prononce ses paroles » conserve le verbe et son objet tout en évitant une tournure peu idiomatique en français.
theological_decisions:
- issue: Personnification féminine de la Sagesse
  choice: Maintenir le pronom féminin « elle »
  alternative: Employer une formulation impersonnelle
  rationale: Les formes verbales et le suffixe hébreux sont au féminin singulier et prolongent la personnification de la Sagesse dans le contexte. Le féminin est donc grammaticalement et littérairement requis, sans qu’il faille en tirer une identification théologique supplémentaire.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation conserve la scène publique, le féminin de la Sagesse et l’ambiguïté spatiale de בְּרֹאשׁ, tandis que les notes signalent les principaux enjeux lexicaux et culturels.
