  yaml_path: translation/ot/proverbs/001/017.yaml
  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: fr
  text: Car c’est en vain qu’on tend un filet sous les yeux de tout oiseau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement: «tout possesseur d’aile».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication qui appuie l’avertissement précédent.
- source_word: חִנָּם
  choice: en vain
  rationale: Dans ce contexte, l’adverbe exprime l’inutilité ou l’inefficacité de l’action.
- source_word: מְזֹרָה
  choice: qu’on tend
  rationale: Le participe passif du verbe זרה décrit ici un filet déployé; la tournure française idiomatique est « tendre un filet».
- source_word: הָרָשֶׁת
  choice: un filet
  rationale: רֶשֶׁת désigne un filet servant à prendre un animal. L’indéfini est naturel en français dans cette maxime générale.
- source_word: בְּעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression conserve l’image concrète de la visibilité portée par l’hébreu, sans suggérer un jugement de valeur.
- source_word: כָל
  choice: tout
  rationale: Avec le singulier générique «oiseau», «tout» rend la portée distributive de l’hébreu.
- source_word: בַּעַל כָּנָף
  choice: oiseau
  rationale: L’expression signifie littéralement «possesseur d’aile» et désigne idiomatiquement un oiseau ou un être ailé.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve l’image proverbiale ainsi que le lien explicatif avec le contexte. «Sous les yeux» maintient plus directement la métaphore hébraïque que «à la vue».
