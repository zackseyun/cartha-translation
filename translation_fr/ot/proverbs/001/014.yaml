  to: Jette ton sort parmi nous[a] ; nous aurons tous une même bourse[b].
  rationale: La révision emploie l’expression française naturelle « jeter son sort » pour conserver l’image hébraïque du lot jeté et rend la seconde proposition dans un français plus courant, sans modifier l’idée d’une possession commune. La note b donne la formulation littérale de la construction hébraïque.
