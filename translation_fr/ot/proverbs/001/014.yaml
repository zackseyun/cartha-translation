review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est bien rendu : l’invitation à joindre le groupe par l’image du tirage/jet du lot, suivie de la promesse d’une bourse commune. « Sort » est le correspondant français idiomatique de גּוֹרָל dans cette expression, sans éliminer l’image du lot.'
  naturalness: '« Jette ton lot parmi nous » est compréhensible, mais peu idiomatique en français moderne : on dit plus naturellement « jeter son sort ». « Nous aurons tous une même bourse » rend avec plus de fluidité la possession collective exprimée par « sera pour nous tous ».'
  terminology: « Sort » maintient l’image de l’attribution par le sort ; il ne doit pas être compris comme une affirmation doctrinale sur la destinée. « Bourse » convient bien à כִּיס, une pochette ou bourse d’argent.
