  text: גּ֭וֹרָ֣לְ/ךָ תַּפִּ֣יל בְּ/תוֹכֵ֑/נוּ כִּ֥יס אֶ֝חָ֗ד יִהְיֶ֥ה לְ/כֻלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/014.yaml
  text: Throw in your lot among us[b][a]; we will all have one purse.
translation:
  language: fr
  text: Jette ton sort parmi nous[a] ; nous aurons tous une même bourse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mets ta part en commun avec nous. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une seule bourse sera pour nous tous ».'
    reason: literal_rendering
lexical_decisions:
- source_word: גּוֹרָלְךָ
  choice: ton lot
  rationale: גּוֹרָל désigne littéralement un lot, puis la part attribuée par le sort. « Ton lot » conserve ici l’image de l’hébreu et l’idée de lier sa part à celle du groupe, sans réduire le sens à une simple contribution financière.
- source_word: תַּפִּיל
  choice: Jette
  rationale: Le hifil de נפל signifie littéralement « faire tomber » et, avec גּוֹרָל, évoque l’action de jeter un lot. « Jette » préserve cette image tout en formant une invitation concise et intelligible.
- source_word: בְּתוֹכֵנוּ
  choice: parmi nous
  rationale: La locution signifie « au milieu de nous ». « Parmi nous » rend naturellement l’intégration au groupe proposée par les mauvais compagnons.
- source_word: כִּיס
  choice: bourse
  rationale: כִּיס désigne une poche ou un petit sac destiné à contenir de l’argent. « Bourse » exprime précisément cette fonction dans un registre digne et concis.
- source_word: אֶחָד
  choice: une seule
  rationale: Le numéral אֶחָד souligne l’unicité de la bourse commune. « Une seule » fait ressortir cette insistance plus clairement que le simple article indéfini.
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: sera à nous tous
  rationale: Cette formulation suit de près l’hébreu, littéralement « sera pour nous tous », et conserve l’idée de possession commune sans préciser davantage les modalités du partage.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et digne. L’image du lot jeté est maintenue dans le texte principal malgré son caractère légèrement marqué en français ; la note en explicite le sens social. La seconde proposition conserve la tournure possessive de l’hébreu, tandis que la note propose une formulation française plus idiomatique.
