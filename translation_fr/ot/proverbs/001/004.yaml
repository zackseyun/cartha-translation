id: PRO.1.4
reference: Proverbs 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/תֵ֣ת לִ/פְתָאיִ֣ם עָרְמָ֑ה לְ֝/נַ֗עַר דַּ֣עַת וּ/מְזִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: fr
  text: 'pour donner aux gens inexpérimentés la prudence,

    au jeune homme[a] la connaissance et le discernement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au jeune » ou « à une jeune personne ». L’hébreu est au masculin singulier (« jeune homme »), mais cette expression peut avoir une portée représentative dans l’enseignement de sagesse.
    reason: Alternative lexicale et portée possible du masculin singulier.
lexical_decisions:
- source_word: לָתֵת
  choice: pour donner
  rationale: L’infinitif construit avec ל poursuit l’expression du but commencée au verset précédent. « Pour donner » rend clairement ce lien en français.
- source_word: לִפְתָאיִם
  choice: aux gens inexpérimentés
  rationale: פְּתָאִים désigne des personnes naïves, sans expérience et faciles à influencer, non des personnes dépourvues d’intelligence. Cette formulation évite le sens dépréciatif que « simples » peut avoir en français moderne.
- source_word: עָרְמָה
  choice: la prudence
  rationale: Dans ce contexte sapientiel, עָרְמָה désigne une habileté pratique et avisée, même si le mot peut ailleurs évoquer la ruse. « Prudence » convient ici au sens positif.
- source_word: לְנַעַר
  choice: au jeune homme
  rationale: נַעַר est un nom masculin singulier désignant ici un garçon ou un jeune homme. La traduction conserve cette forme tout en signalant en note sa possible portée représentative.
- source_word: דַּעַת
  choice: la connaissance
  rationale: דַּעַת désigne directement la connaissance et appartient au vocabulaire caractéristique de la sagesse dans les Proverbes.
- source_word: וּמְזִמָּה
  choice: et le discernement
  rationale: מְזִמָּה peut évoquer la réflexion, la capacité de former des projets ou la discrétion. Dans cette série de qualités positives, « discernement » exprime naturellement le jugement réfléchi.
theological_decisions:
- issue: Masculin singulier dans l’enseignement de sagesse
  choice: jeune homme
  alternative: jeune personne ; jeune
  rationale: L’hébreu נַעַר est masculin singulier. Le texte principal conserve ce trait grammatical sans décider si l’expression vise exclusivement les hommes ; la note indique qu’elle peut avoir une portée représentative dans le cadre de l’enseignement sapientiel.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux membres est conservé. « Gens inexpérimentés » est préféré à « simples », potentiellement trompeur ou dépréciatif en français contemporain.
