source:
  edition: WLC
  text: לָ֭/קַחַת מוּסַ֣ר הַשְׂכֵּ֑ל צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט וּ/מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/003.yaml
  text: to receive instruction in wise dealing[a], righteousness, justice[c][b], and equity.
translation:
  language: fr
  text: pour recevoir une formation à la conduite avisée[a], à la justice, au droit et à l’équité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour accepter la discipline qui rend prudent ». Le mot traduit par « formation » peut aussi désigner la discipline ou la correction, et l’expression souligne un savoir-faire pratique dans la conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחַת
  choice: recevoir
  rationale: Avec מוּסַר, le verbe signifie idiomatiquement recevoir ou accepter une formation; l’infinitif exprime ici le but dans la série de Proverbes 1.2-3.
- source_word: מוּסַר
  choice: formation
  rationale: Le terme désigne une instruction formatrice qui comprend aussi discipline et correction. « Formation » rend sa portée éducative et morale sans la réduire à une sanction.
- source_word: הַשְׂכֵּל
  choice: conduite avisée
  rationale: Le terme vise l’habileté pratique à agir avec sagesse, plutôt qu’une compréhension seulement intellectuelle.
- source_word: צֶדֶק
  choice: justice
  rationale: Le mot désigne ici ce qui est juste ou droit sur le plan moral. « Justice » est naturel en français et reste distinct de « droit » pour מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: droit
  rationale: Dans cette triade éthique, le terme évoque l’ordre juste et le jugement conforme au droit; « droit » évite de répéter « justice ».
- source_word: מֵישָׁרִים
  choice: équité
  rationale: Le pluriel exprime la droiture et le caractère équitable des actes. « Équité » conserve la nuance éthique tout en formant une liste française naturelle.
