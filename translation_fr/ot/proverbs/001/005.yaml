source:
  edition: WLC
  text: יִשְׁמַ֣ע חָ֭כָם וְ/י֣וֹסֶף לֶ֑קַח וְ֝/נָב֗וֹן תַּחְבֻּל֥וֹת יִקְנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: fr
  text: Que le sage écoute et gagne en instruction[a], et que l’homme doué de discernement acquière des conseils judicieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le sage écoutera et gagnera en instruction » ; les verbes hébreux à l’imparfait peuvent être compris de manière descriptive, mais ils sont rendus ici comme une exhortation en raison du contexte didactique.'
    reason: alternative_reading
  - marker: b
    text: Le terme traduit par « conseils judicieux » peut aussi désigner la direction avisée, des orientations habiles ou des stratégies ; il évoque plus littéralement l’action de piloter.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: Que ... écoute
  rationale: L’imparfait hébreu à la 3e personne du masculin singulier peut être descriptif (« il écoutera »), mais le cadre didactique permet naturellement une valeur exhortative rendue par « Que ... écoute ».
- source_word: חָכָם
  choice: le sage
  rationale: Le substantif masculin singulier désigne ici une figure représentative. « Le sage » est naturel en français et conserve le singulier sans ajouter le mot « homme », absent du texte.
- source_word: וְיֹסֶף
  choice: et augmente
  rationale: Le verbe יסף signifie ajouter ou accroître. Avec לֶקַח comme complément, « augmenter son savoir » exprime naturellement l’idée d’un enrichissement continu.
- source_word: לֶקַח
  choice: son savoir
  rationale: Le terme désigne ce qui est reçu ou acquis par l’enseignement. « Savoir » convient à la construction avec « augmenter » et au contexte sapiential, tout en laissant ouverte la nuance d’instruction reçue.
- source_word: נָבוֹן
  choice: l’homme doué de discernement
  rationale: Cette formulation rend explicitement la personne masculine singulière désignée par la forme hébraïque et exprime sa capacité de comprendre et de discerner.
- source_word: תַּחְבֻּלוֹת
  choice: l’art de se diriger
  rationale: Le pluriel hébreu évoque des moyens de pilotage, puis, par extension, la direction avisée, les conseils ou les stratégies. « L’art de se diriger » garde perceptible cette image sans imposer une nuance militaire.
- source_word: יִקְנֶה
  choice: acquière
  rationale: קנה signifie acquérir ou obtenir. « Acquière » conserve ici l’image d’un bien précieux que l’on gagne.
theological_decisions:
- issue: Valeur des verbes à l’imparfait
  choice: 'Exhortation : « Que ... écoute ... et que ... acquière »'
  alternative: 'Description ou promesse : « Le sage écoutera ... et l’homme doué de discernement acquerra »'
  rationale: Le contexte introductif et pédagogique des Proverbes favorise l’exhortation, mais la morphologie hébraïque permet également une lecture descriptive; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe exhortative reprend le parallélisme hébreu. « Le sage » évite un masculin lexical ajouté, tandis que « l’homme doué de discernement » explicite naturellement la forme personnelle masculine singulière. Les deux notes conservent l’ambiguïté aspectuo-modale et l’image de pilotage portée par תַּחְבֻּלוֹת.
