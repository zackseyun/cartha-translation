source:
  edition: WLC
  text: כָּל ה֣וֹן יָקָ֣ר נִמְצָ֑א נְמַלֵּ֖א בָתֵּ֣י/נוּ שָׁלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/013.yaml
  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: fr
  text: Nous trouverons tous les biens précieux[a] ; nous remplirons nos maisons de butin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les biens de valeur » ou « toutes les richesses précieuses ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne des biens pris par la force ou lors d’un pillage.
    reason: lexical_clarification
lexical_decisions:
- source_word: כָּל הוֹן יָקָר
  choice: toutes sortes de biens précieux
  rationale: Cette formulation française naturelle exprime la portée globale de כָּל et le sens matériel de הוֹן, qualifié par יָקָר. Elle évite le tour peu idiomatique « toute richesse précieuse » sans réduire la vantardise des interlocuteurs.
- source_word: נִמְצָא
  choice: nous trouverons
  rationale: Le sens courant de מצא est « trouver ». Ici, la forme à la première personne du pluriel s’inscrit dans la promesse assurée de biens acquis par le crime.
- source_word: נְמַלֵּא
  choice: nous remplirons
  rationale: Le futur rend naturellement en français la suite des affirmations confiantes des pécheurs. Le contexte d’invitation conserve la nuance incitative possible sans imposer « remplissons ».
- source_word: בָתֵּינוּ
  choice: nos maisons
  rationale: Traduction concrète et directe de בָּתִּים avec le suffixe de première personne du pluriel ; l’image est celle de maisons remplies de biens volés.
- source_word: שָׁלָל
  choice: butin
  rationale: « Butin » désigne clairement les biens pris par vol ou violence et convient à un registre français moderne et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et soutenu sans archaïsme. Le parallélisme des deux propositions au futur et le ton de vantardise sont conservés.
