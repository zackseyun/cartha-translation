  text: לֹא אָב֥וּ לַ/עֲצָתִ֑/י נָ֝אֲצ֗וּ כָּל תּוֹכַחְתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/030.yaml
  text: They were unwilling to accept my counsel[b][a]; they despised all my reproof.
translation:
  language: fr
  text: Ils n’ont pas voulu de mon conseil[a] ; ils ont méprisé toutes mes réprimandes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils n’ont pas voulu accepter mon conseil. »'
    reason: La préposition לְ avec le verbe אָבָה exprime le refus d’accueillir ou d’accepter le conseil.
  - marker: b
    text: 'Ou : « toutes mes corrections » ou « tous mes reproches ».'
    reason: תּוֹכַחַת désigne une réprimande ou une correction; ces termes français rendent des nuances lexicales proches.
lexical_decisions:
- source_word: לֹא אָבוּ
  choice: Ils n’ont pas voulu
  rationale: La tournure exprime naturellement en français la négation et la nuance volontaire de אָבָה, sans renforcer celle-ci jusqu’à « ils ont refusé ».
- source_word: לַעֲצָתִי
  choice: de mes conseils
  rationale: Après « ne pas vouloir », le français emploie naturellement « de ». « Conseils » rend עֵצָה dans un registre actuel et digne.
- source_word: נָאֲצוּ
  choice: ils ont méprisé
  rationale: Le verbe indique un rejet empreint de mépris ; « méprisé » en conserve la force évaluative.
- source_word: כָּל
  choice: tous
  rationale: Le pluriel français s’accorde naturellement avec « avertissements » et maintient la portée totale du quantificateur.
- source_word: תּוֹכַחְתִּי
  choice: mes avertissements
  rationale: תּוֹכַחַת peut désigner la réprimande, la correction ou l’avertissement. Ici, « avertissements » est clair pour le lecteur moderne tout en gardant la portée corrective des paroles de la Sagesse.
