  text: לְ/הָבִ֣ין מָ֭שָׁל וּ/מְלִיצָ֑ה דִּבְרֵ֥י חֲ֝כָמִ֗ים וְ/חִידֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/006.yaml
  text: to understand a proverb and a saying[b][a], the words of the wise and their riddles.
translation:
  language: fr
  text: pour comprendre un proverbe et une formule[a], les paroles des sages et leurs énigmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une interprétation » ou « une formule éloquente ». Le terme hébreu peut désigner une expression travaillée ou frappante et, dans certains contextes, une formulation qui explicite ou interprète.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs paroles énigmatiques ». Le mot hébreu peut désigner des énigmes ou des propos obscurs qui demandent réflexion.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  choice: pour comprendre
  rationale: L’infinitif construit précédé de לְ exprime ici le but et prolonge les propositions finales des versets précédents. « Pour comprendre » est naturel et conserve le sens cognitif de בין.
- source_word: מָשָׁל
  choice: un proverbe
  rationale: Dans le livre des Proverbes, מָשָׁל désigne couramment un proverbe ou une maxime de sagesse. « Proverbe » convient au genre et au contexte immédiat.
- source_word: מְלִיצָה
  choice: une formule
  rationale: Ce terme rare peut désigner une expression travaillée, frappante ou porteuse d’un sens à interpréter. « Formule » reste concise, actuelle et assez ouverte pour ne pas imposer le sens technique d’« interprétation ».
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Le pluriel construit de דָּבָר est rendu directement par « les paroles de », formulation naturelle dans ce contexte sapiential.
- source_word: חֲכָמִים
  choice: des sages
  rationale: L’adjectif substantivé désigne des personnes sages. « Les sages » en conserve la portée collective sans préciser inutilement le genre.
- source_word: חִידֹתָם
  choice: leurs énigmes
  rationale: חִידָה peut désigner une énigme ou une parole énigmatique qui demande réflexion. « Leurs énigmes » est concret, lisible et conserve le suffixe possessif de troisième personne du pluriel.
