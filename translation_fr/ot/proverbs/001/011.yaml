reference: Proverbs 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם יֹאמְרוּ֮ לְכָ֪/ה אִ֫תָּ֥/נוּ נֶאֶרְבָ֥ה לְ/דָ֑ם נִצְפְּנָ֖ה לְ/נָקִ֣י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: fr
  text: 'S’ils te disent : « Viens avec nous ! Mettons-nous en embuscade pour verser le sang[a] ; guettons[b] l’innocent sans raison ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « pour le sang », expression concise qui évoque ici une violence meurtrière.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut signifier plus littéralement « cachons-nous » ou « restons dissimulés ». Dans ce contexte, il s’agit de se cacher ou de guetter afin de surprendre l’innocent.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ לְכָה
  choice: 'S’ils te disent : « Viens'
  rationale: La tournure conditionnelle est conservée, et le pronom « te » rend explicite le destinataire marqué par לְכָה dans le texte massorétique.
- source_word: אִתָּנוּ
  choice: avec nous
  rationale: Cette expression marque clairement l’invitation à se joindre au groupe.
- source_word: נֶאֶרְבָה
  choice: Mettons-nous en embuscade
  rationale: Le verbe ארב évoque une attente dissimulée en vue d’une attaque préméditée.
- source_word: לְדָם
  choice: pour verser le sang
  rationale: Littéralement « pour le sang » ; la formulation française explicite avec retenue l’idée de violence meurtrière portée par cette expression concise.
- source_word: נִצְפְּנָה
  choice: tendons un piège
  rationale: Le verbe signifie littéralement se cacher ou rester dissimulé ; dans le parallélisme, il décrit une dissimulation destinée à surprendre la victime.
- source_word: לְנָקִי
  choice: à l’innocent
  rationale: L’adjectif substantivé désigne la victime comme innocente, ce qui souligne le caractère injuste de l’agression.
- source_word: חִנָּם
  choice: sans raison
  rationale: Cette expression française courante rend l’absence de motif ou de justification.
theological_decisions:
- issue: Caractérisation morale de la victime
  choice: l’innocent
  alternative: le juste ; celui qui n’a rien fait
  rationale: « L’innocent » conserve directement le jugement moral du texte sans ajouter de portée doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde le ton pressant de l’invitation, tandis que le parallélisme entre l’embuscade et le piège restitue la préméditation violente du texte.
