  rationale: La révision remplace « correction » par « réprimandes » afin de refléter plus directement la valeur de תּוֹכַחַת et d’améliorer la collocation française avec « Revenez ». Le pluriel est également repris dans la note [a]. Le reste du texte et les notes préservent correctement l’image du verbe נבע, l’ambiguïté de רוּחַ et les deux ancrages de notes.
