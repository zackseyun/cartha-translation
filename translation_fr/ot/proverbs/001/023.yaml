source:
  edition: WLC
  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: fr
  text: 'Revenez à mes réprimandes[a] ! Voici : je répandrai sur vous mon esprit[b] ; je vous ferai connaître mes paroles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Changez de direction à cause de mes réprimandes » ; le verbe peut aussi exprimer l’idée de se repentir.'
    reason: lexical_alternative
  - marker: b
    text: « Mon esprit » peut aussi se comprendre comme « ma pensée intérieure » ou « ce qui m’anime ». Certains y voient une résonance plus large avec l’Esprit de Dieu, mais, dans ce passage, c’est la Sagesse personnifiée qui parle.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: Revenez
  rationale: Le verbe שׁוב appelle ici les auditeurs à changer de direction en réponse à la sagesse. « Revenez » conserve l’image du retournement sans imposer toute la portée théologique possible de « repentez-vous ».
- source_word: לְתוֹכַחְתִּי
  choice: à ma correction
  rationale: תּוֹכַחַת peut désigner la réprimande, le reproche ou la correction. « Correction » convient au contexte pédagogique des Proverbes et s’emploie naturellement avec « revenir à ».
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette particule attire l’attention sur la promesse qui suit. « Voici » garde cette fonction dans un registre français digne et actuel.
- source_word: אַבִּיעָה
  choice: je répandrai
  rationale: Le verbe נבע évoque ce qui jaillit ou s’écoule abondamment. Avec רוּחִי, « répandre » restitue cette image tout en restant naturel en français.
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ peut signifier esprit, souffle ou disposition intérieure. « Mon esprit », avec une minuscule, préserve la largeur du terme et n’identifie pas explicitement celui-ci à l’Esprit saint.
- source_word: אוֹדִיעָה
  choice: je ferai connaître
  rationale: La forme causative de ידע signifie directement « faire connaître ».
- source_word: דְבָרַי
  choice: mes paroles
  rationale: דָּבָר désigne ici les paroles instructives prononcées par la Sagesse ; « paroles » garde leur caractère verbal sans les réduire à un message abstrait.
- source_word: לָכֶם ... אֶתְכֶם
  choice: sur vous ... vous
  rationale: La première construction accompagne naturellement en français le verbe « répandre », tandis que la seconde devient le complément de « faire connaître » ; l’adresse au pluriel reste explicite.
theological_decisions:
- issue: Sens de « mon esprit » dans le discours de la Sagesse
  choice: « mon esprit » en minuscule, désignant immédiatement l’esprit ou la pensée intérieure de la Sagesse personnifiée
  alternative: Y voir une anticipation ou une représentation de l’Esprit de Dieu
  rationale: Dans le contexte immédiat, c’est la Sagesse personnifiée qui parle, et l’hébreu ne dit pas explicitement « l’Esprit de Dieu ». La minuscule respecte ce cadre littéraire tout en laissant ouverte une éventuelle résonance canonique.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la mise en relief de l’hébreu ; le parallélisme des deux promesses est maintenu. Les marqueurs [a] et [b] figurent tous deux dans le texte.
