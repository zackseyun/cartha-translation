source:
  edition: WLC
  text: יַ֣עַן קָ֭רָאתִי וַ/תְּמָאֵ֑נוּ נָטִ֥יתִי יָ֝דִ֗/י וְ/אֵ֣ין מַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: fr
  text: Puisque j’ai appelé et que vous avez refusé, puisque j’ai tendu la main et que personne n’a prêté attention,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: Puisque
  rationale: Introduit la cause du jugement annoncé dans la suite. « Puisque » convient naturellement à une proposition qui se prolonge au verset suivant.
- source_word: קָרָאתִי
  choice: j’ai appelé
  rationale: Rend directement l’appel lancé par la Sagesse, sans imposer la nuance plus forte de cri ou de proclamation.
- source_word: וַתְּמָאֵנוּ
  choice: et que vous avez refusé
  rationale: מאן exprime clairement le refus. La coordination avec « et » respecte le waw hébreu, tandis que la répétition de « que » produit une syntaxe française fluide après « puisque ».
- source_word: נָטִיתִי
  choice: j’ai tendu
  rationale: Préserve l’image concrète du geste consistant à étendre la main, dans une formulation française idiomatique.
- source_word: יָדִי
  choice: la main
  rationale: Le français emploie naturellement l’article défini avec une partie du corps lorsque le possesseur est déjà indiqué par le sujet; le sens possessif de l’hébreu reste clair.
- source_word: וְאֵין מַקְשִׁיב
  choice: et que personne n’a prêté attention
  rationale: Rend l’absence de toute écoute attentive. « Prêter attention » exprime קשב sans ajouter la notion plus forte d’obéissance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé par la répétition de « puisque… et que… ». La virgule finale signale que la phrase causale se poursuit au verset 25.
