id: PRO.1.33
reference: Proverbs 1:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: fr
  text: Mais qui m’écoute habitera en sécurité et vivra tranquille, sans craindre le malheur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Mais celui qui m’écoute demeurera en sécurité et sera tranquille, loin de la crainte du malheur. »'
    reason: Alternative plus formelle qui conserve explicitement la nuance de demeure de שׁכן et celle d’éloignement portée par מן.
lexical_decisions:
- source_word: וְשֹׁמֵעַ לִי
  choice: Mais qui m’écoute
  rationale: Le participe exprime ici une écoute attentive et suivie, et non la simple perception d’un son. « Qui » garde la portée générique du masculin hébreu. Dans le contexte, וְ marque le contraste avec le sort de ceux qui refusent d’écouter.
- source_word: יִשְׁכָּן
  choice: habitera
  rationale: Le verbe שׁכן évoque le fait de demeurer ou de s’établir. « Habitera » conserve cette image tout en restant naturel en français.
- source_word: בֶּטַח
  choice: en sécurité
  rationale: Le terme désigne la sécurité et l’assurance qui en découle. La locution « en sécurité » s’emploie naturellement avec « habitera ».
- source_word: וְשַׁאֲנַן
  choice: et vivra tranquille
  rationale: La forme issue de שׁאנ exprime ici une tranquillité paisible, à l’abri des troubles. « Vivra tranquille » rend ce sens positivement sans suggérer la suffisance ou l’insouciance coupable.
- source_word: מִפַּחַד רָעָה
  choice: sans craindre le malheur
  rationale: La préposition מן exprime l’éloignement ou l’affranchissement par rapport à la crainte. רָעָה désigne dans ce contexte le malheur ou la calamité plutôt que le mal moral.
theological_decisions:
- issue: Portée générique du participe masculin singulier
  choice: qui m’écoute
  alternative: celui qui m’écoute
  rationale: Le masculin grammatical a une valeur générale dans cette instruction de sagesse. La tournure « qui m’écoute » inclut naturellement toute personne sans ajouter une précision absente de l’hébreu.
- issue: La Sagesse personnifiée comme locutrice
  choice: Conserver la première personne « m’ » sans explicitation
  alternative: qui écoute la Sagesse
  rationale: Le verset poursuit le discours direct de la Sagesse dans le contexte. Expliciter son identité dans le texte introduirait une glose interprétative inutile.
- issue: Nature de רָעָה
  choice: malheur
  alternative: mal
  rationale: Dans la proposition, l’objet de la crainte est une calamité menaçante. « Malheur » préserve cette lecture contextuelle sans transformer le terme en affirmation sur le mal moral.
translation_notes:
  register: Français international moderne, courant et digne. La formulation privilégie la clarté orale tout en conservant le parallélisme de la promesse. Le marqueur [a] est placé après la phrase à laquelle se rapporte la variante.
