id: PRO.1.28
reference: Proverbs 1:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֣ז יִ֭קְרָאֻ/נְנִי וְ/לֹ֣א אֶֽעֱנֶ֑ה יְ֝שַׁחֲרֻ֗/נְנִי וְ/לֹ֣א יִמְצָאֻֽ/נְנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: fr
  text: Alors ils m’appelleront, mais je ne répondrai pas ; ils me chercheront avec empressement[a], mais ils ne me trouveront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils me chercheront dès l’aurore » ou « ils me chercheront ardemment ». Le verbe hébreu peut évoquer une recherche matinale, ardente ou empressée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui marque la conséquence des avertissements précédents ; « Alors » restitue naturellement l’enchaînement.
- source_word: יִקְרָאֻנְנִי
  choice: ils m’appelleront
  rationale: Le verbe קרא désigne ici le fait de lancer un appel à la Sagesse pour obtenir une réponse ou du secours.
- source_word: וְלֹא אֶעֱנֶה
  choice: mais je ne répondrai pas
  rationale: Bien que ו soit formellement une coordination, « mais » exprime en français le contraste net entre leur appel et l’absence de réponse.
- source_word: יְשַׁחֲרֻנְנִי
  choice: ils me chercheront avec empressement
  rationale: Au piel, שׁחר peut évoquer une recherche matinale, assidue ou ardente. « avec empressement » rend l’intensité de la démarche sans limiter le sens au moment de la journée.
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: mais ils ne me trouveront pas
  rationale: מצא signifie simplement « trouver » ; « mais » rend idiomatiquement le contraste avec leur recherche empressée.
theological_decisions:
- issue: Identité de la locutrice dans le contexte
  choice: Conserver le discours à la première personne de la Sagesse personnifiée dans Proverbes 1.
  alternative: Identifier explicitement la locutrice au Christ ou à une autre réalité théologique ultérieure.
  rationale: Le texte hébreu présente la Sagesse personnifiée comme locutrice. La traduction garde cette voix littéraire sans trancher les lectures typologiques possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu et les deux contrastes entre appel/recherche et absence de réponse/découverte sont conservés.
