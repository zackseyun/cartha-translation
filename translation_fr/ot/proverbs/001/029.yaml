  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: fr
  text: 'Parce qu’ils ont haï la connaissance

    et n’ont pas choisi la crainte de Yahweh[a][b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « crainte de Yahweh » est une expression clé des écrits de sagesse ; elle évoque une crainte révérencielle, et non une simple terreur.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici le nom divin יהוה (YHWH), rendu ici par « Yahweh » ; « Yahvé » est une autre transcription française courante.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: Parce que
  rationale: Cette locution introduit la cause du jugement annoncé dans le contexte. « Parce que » en restitue naturellement la valeur causale.
- source_word: שָׂנְאוּ
  choice: ils ont détesté
  rationale: Le verbe שׂנא exprime une forte aversion. « Détester » conserve cette force sans l’atténuer en simple rejet.
- source_word: דָעַת
  choice: la connaissance
  rationale: Dans les Proverbes, דַּעַת désigne souvent une connaissance liée à la sagesse et à la conduite morale. « Connaissance » reste la traduction la plus directe.
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  rationale: Cette expression fondamentale de la littérature de sagesse associe respect révérenciel, soumission et conscience du jugement divin. « Crainte » en préserve toute la tension, contrairement au seul mot « respect ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie le nom divin יהוה. « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- source_word: לֹא בָחָרוּ
  choice: n’ont pas choisi
  rationale: Le verbe בחר signifie « choisir ». Cette traduction directe maintient l’accent sur la décision volontaire sans expliciter davantage par « ont refusé ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le verset porte explicitement le nom divin. Le rendre par « Yahweh » préserve le nom propre, tout en signalant en note l’usage français traditionnel et l’incertitude de la vocalisation ancienne.
- issue: Portée de יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  alternative: le respect de Yahweh ; la révérence envers Yahweh
  rationale: « Crainte » conserve l’expression théologique structurante des Proverbes ainsi que son éventail de sens, qui ne se réduit ni à la terreur ni à une simple déférence.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme hébreu est conservé sur deux lignes. « Détesté », « connaissance », « choisi » et « crainte » maintiennent la force et la sobriété du texte source sans paraphrase confessionnelle.
