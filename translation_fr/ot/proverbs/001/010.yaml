id: PRO.1.10
reference: Proverbs 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּנִ֡/י אִם יְפַתּ֥וּ/ךָ חַ֝טָּאִ֗ים אַל תֹּבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: fr
  text: Mon fils[a], si des pécheurs cherchent à t’entraîner, ne cède pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon fils » conserve le masculin singulier de l’hébreu; il s’agit d’un appel paternel propre à l’enseignement de sagesse.
    reason: cultural_note
  - marker: b
    text: Ou « ne consens pas » ou « ne te montre pas disposé ». Le verbe hébreu signifie être disposé à quelque chose, y consentir.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif masculin singulier désigne littéralement un fils dans le cadre d’un appel paternel de sagesse; cette forme est conservée sans la neutraliser.
- source_word: אִם
  choice: si
  rationale: Particule conditionnelle ordinaire introduisant une situation éventuelle.
- source_word: יְפַתּוּךָ
  choice: cherchent à t’entraîner
  rationale: Le piel de פתה exprime ici une tentative de persuasion attirant vers une mauvaise conduite. Cette formulation française rend naturellement la visée manipulatrice sans introduire de connotation principalement sexuelle.
- source_word: חַטָּאִים
  choice: des pécheurs
  rationale: Pluriel substantivé désignant des personnes caractérisées par le péché; « pécheurs » en est l’équivalent direct et naturel.
- source_word: אַל
  choice: ne… pas
  rationale: Particule négative employée pour formuler une interdiction.
- source_word: תֹּבֵא
  choice: cède
  rationale: Le verbe אבה signifie être disposé, consentir. Dans ce contexte, « ne cède pas » exprime le refus de se laisser gagner à leur proposition, tout en gardant « ne consens pas » comme possibilité plus formelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond à l’adresse personnelle de l’hébreu. « Cherchent à t’entraîner » est idiomatique et explicite la tentative contenue dans la forme verbale, tandis que « ne cède pas » reste bref et énergique.
