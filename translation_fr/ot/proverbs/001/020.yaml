  text: חָ֭כְמוֹת בַּ/ח֣וּץ תָּרֹ֑נָּה בָּ֝/רְחֹב֗וֹת תִּתֵּ֥ן קוֹלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/020.yaml
  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: fr
  text: La Sagesse lance son appel dans la rue ; sur les places, elle fait entendre sa voix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָכְמוֹת
  choice: la Sagesse
  rationale: Bien que le nom ait une forme plurielle, les verbes féminins singuliers et le suffixe possessif singulier montrent qu’il fonctionne ici comme une personnification singulière. La majuscule rend cette personnification visible sans lui imposer une identification doctrinale ultérieure.
- source_word: בַּחוּץ
  choice: dans la rue
  rationale: Le terme désigne l’espace extérieur et public, par opposition à l’intérieur. « Dans la rue » est naturel en français et s’accorde avec le parallèle des places publiques.
- source_word: תָּרֹנָּה
  choice: lance son appel
  rationale: Le verbe רנן exprime ici une émission de voix forte et retentissante. « Lance son appel » restitue le caractère public et énergique de la proclamation, sans lui donner la nuance joyeuse que pourrait suggérer « chante ».
- source_word: בָּרְחֹבוֹת
  choice: sur les places
  rationale: Le pluriel désigne les espaces larges et ouverts d’une ville, notamment les places publiques. « Sur les places » est idiomatique et conserve le parallélisme spatial.
- source_word: תִּתֵּן קוֹלָהּ
  choice: elle fait entendre sa voix
  rationale: Littéralement, « elle donne sa voix ». L’expression française « fait entendre sa voix » conserve l’idée d’une voix publiquement déployée tout en évitant un calque peu naturel.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: Conserver « la Sagesse » comme figure féminine singulière.
  alternative: Rendre le terme comme une abstraction ordinaire, sans marquer nettement la personnification.
  rationale: Les formes féminines singulières du texte hébreu présentent la Sagesse comme une figure qui parle dans l’espace public. La traduction préserve ce procédé littéraire sans identifier cette figure à une personne ou à une doctrine extérieure au verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme hébreu est conservé par deux propositions coordonnées ; la formulation privilégie une expression française naturelle tout en maintenant la vigueur de l’appel public.
