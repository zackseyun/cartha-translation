id: PRO.1.19
reference: Proverbs 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: fr
  text: 'Tels sont les chemins de quiconque recherche un gain malhonnête[a] : ce gain ôte la vie à ceux qui le possèdent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tels sont les chemins de quiconque est avide de profit : celui-ci ôte la vie à ceux qui le possèdent. »'
    reason: 'Alternative lexicale : l’expression hébraïque peut mettre l’accent soit sur le caractère injuste du gain, soit sur l’avidité de celui qui le recherche.'
lexical_decisions:
- source_word: כֵּן
  choice: Tels sont
  rationale: Cette formule récapitule l’exemple précédent tout en conservant la valeur démonstrative et comparative de l’hébreu.
- source_word: אָרְחוֹת
  choice: les chemins
  rationale: Le terme désigne des sentiers ou des voies. « Chemins » maintient la métaphore concrète caractéristique de la littérature de sagesse.
- source_word: כָּל בֹּצֵעַ בָּצַע
  choice: quiconque recherche un gain malhonnête
  rationale: Le participe accompagné du nom apparenté exprime la poursuite avide d’un profit, avec ici une forte nuance d’injustice liée au contexte de violence et de spoliation. « Quiconque » préserve la portée universelle.
- source_word: נֶפֶשׁ
  choice: la vie
  rationale: Dans ce contexte, le mot désigne la vie de la personne plutôt qu’une âme immatérielle.
- source_word: בְּעָלָיו
  choice: ceux qui le possèdent
  rationale: 'Le suffixe renvoie le plus naturellement au gain : ceux qui croient le posséder finissent par perdre leur propre vie.'
- source_word: יִקָּח
  choice: ôte
  rationale: Le verbe signifie littéralement « prend ». « Ôte la vie » rend clairement sa portée mortelle dans cette maxime.
theological_decisions:
- issue: Agent de la destruction dans la seconde proposition
  choice: Le gain malhonnête est présenté comme ce qui ôte la vie à ses possesseurs.
  alternative: Comprendre plus généralement que l’avidité ou la conduite cupide détruit ceux qui s’y livrent.
  rationale: Le verbe masculin singulier et le suffixe de בְּעָלָיו permettent de rattacher la proposition au « gain » mentionné juste avant. La note conserve l’autre formulation sémantiquement possible sans transformer la maxime en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore des « chemins » est conservée, tandis que « ce gain » explicite sobrement le sujet de la dernière proposition pour éviter une ambiguïté pronominale artificielle en français.
