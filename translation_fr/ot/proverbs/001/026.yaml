id: PRO.1.26
reference: Proverbs 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אֲ֭נִי בְּ/אֵידְ/כֶ֣ם אֶשְׂחָ֑ק אֶ֝לְעַ֗ג בְּ/בֹ֣א פַחְדְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/026.yaml
  text: I also will laugh at your calamity[a]; I will mock when your dread comes,
translation:
  language: fr
  text: Moi aussi, je rirai de votre malheur ; je me moquerai quand viendra ce qui vous épouvante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand viendra votre terreur ». Le mot hébreu peut désigner la peur ou la terreur elle-même, mais aussi ce qui la provoque, c’est-à-dire l’événement redouté.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: La construction met le pronom en relief et marque une réponse correspondante au refus précédent. « Moi aussi » restitue naturellement l’emphase et l’idée d’une réaction en retour.
- source_word: בְּאֵידְכֶם
  choice: de votre malheur
  rationale: אֵיד désigne un désastre, un malheur ou une ruine. Avec « rire », le français idiomatique emploie « rire de » ; « malheur » conserve la gravité sans être inutilement technique.
- source_word: אֶשְׂחָק
  choice: je rirai
  rationale: Le qal de שׂחק signifie simplement « rire ». Le futur français convient au contexte et n’ajoute aucune intensification absente de l’hébreu.
- source_word: אֶלְעַג
  choice: je me moquerai
  rationale: לעג exprime la moquerie ou la dérision. « Se moquer » est courant, clair et maintient le parallélisme avec « rire ».
- source_word: בְּבֹא
  choice: quand viendra
  rationale: 'L’infinitif construit de בוא précédé de ב a ici une valeur temporelle : « quand vient/viendra ». L’inversion donne un français fluide et digne.'
- source_word: פַחְדְּכֶם
  choice: ce qui vous épouvante
  rationale: פחד peut désigner la peur elle-même ou ce qui la provoque. Puisque cette réalité « vient » et qu’elle est parallèle au malheur, la formulation vise naturellement l’événement redouté, tout en signalant en note l’ambiguïté lexicale.
theological_decisions:
- issue: Ton de la réponse de la Sagesse personnifiée aux insensés
  choice: Conserver sans atténuation les verbes « rire » et « se moquer ».
  alternative: Adoucir en « sourire » ou reformuler en « se réjouir du désastre ».
  rationale: L’hébreu emploie explicitement des verbes forts de rire et de dérision dans un contexte de jugement sapientiel. Les atténuer affaiblirait l’avertissement ; parler de réjouissance ajouterait une nuance qui n’est pas exprimée. La tension théologique est donc maintenue.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé, avec des tournures idiomatiques françaises. La formulation principale privilégie le référent redouté en raison du verbe « venir », tandis que la note préserve l’ambiguïté du terme hébreu.
