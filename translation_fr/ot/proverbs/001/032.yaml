id: PRO.1.32
reference: Proverbs 1:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: fr
  text: Car l’égarement des naïfs les tuera, et l’insouciance[a] des insensés les détruira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tranquillité », « la sécurité » ou « l’aisance ».
    reason: Le mot hébreu שַׁלְוָה couvre une gamme de sens allant de la tranquillité et de la sécurité à l’aisance satisfaite; le contexte lui donne ici une portée négative.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’avertissement précédent et conserve la relation explicative du texte hébreu.
- source_word: מְשׁוּבַת
  choice: l’égarement
  rationale: Désigne le fait de se détourner ou de suivre une voie dévoyée. « Égarement » reste naturel en français et évite les connotations doctrinales plus étroites de « apostasie ».
- source_word: פְּתָיִם
  choice: des naïfs
  rationale: Dans les Proverbes, le terme désigne des personnes crédules, inexpérimentées et moralement influençables, non des personnes dépourvues d’intelligence.
- source_word: תַּהַרְגֵם
  choice: les tuera
  rationale: Rend directement le verbe courant « tuer » et conserve la dureté de la conséquence annoncée.
- source_word: וְשַׁלְוַת
  choice: et l’insouciance
  rationale: Le nom peut évoquer la tranquillité, la sécurité ou l’aisance. Dans ce contexte, « insouciance » exprime la sécurité trompeuse qui empêche les insensés d’écouter la sagesse, tout en signalant les autres nuances dans une note.
- source_word: כְּסִילִים
  choice: des insensés
  rationale: Terme sapientiel désignant des personnes moralement obstinées et réfractaires à la sagesse, plutôt qu’un simple manque de capacités intellectuelles.
- source_word: תְּאַבְּדֵם
  choice: les détruira
  rationale: Le piel de אבד exprime le fait de causer la perte ou la destruction; « détruira » préserve sa force et le parallélisme avec « tuera ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme bref des deux propositions est conservé, ainsi que la distinction entre les naïfs, encore influençables, et les insensés, obstinément opposés à la sagesse.
