source:
  edition: WLC
  text: וְ֭/הֵם לְ/דָמָ֣/ם יֶאֱרֹ֑בוּ יִ֝צְפְּנ֗וּ לְ/נַפְשֹׁתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/018.yaml
  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: fr
  text: Mais eux, c’est pour leur propre sang qu’ils se mettent à l’affût[a] ; c’est à leur propre vie qu’ils tendent un piège[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur sang ». Le texte souligne que leur violence se retourne contre eux-mêmes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils se cachent pour leur propre vie ». Le verbe hébreu signifie plus littéralement « cacher, dissimuler » ; dans ce contexte, il évoque probablement un piège ou une embuscade préparés en secret.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: Mais eux
  rationale: Le waw et le pronom indépendant marquent ici le contraste avec l’oiseau du verset précédent et mettent les malfaiteurs en relief.
- source_word: לְדָמָם
  choice: pour leur propre sang
  rationale: 'Le choix conserve l’image concrète de דָּם et souligne l’ironie : la violence qu’ils préparent menace leur propre sang.'
- source_word: יֶאֱרֹבוּ
  choice: se mettent à l’affût
  rationale: ארב désigne l’action de guetter en vue d’une attaque. Cette tournure française naturelle garde la nuance prédatrice sans se confondre avec le second verbe.
- source_word: יִצְפְנוּ
  choice: tendent un piège
  rationale: צפן signifie fondamentalement cacher ou dissimuler ; dans ce parallélisme, il évoque une action secrètement préparée contre une victime. « Tendre un piège » en exprime naturellement la portée contextuelle.
- source_word: לְנַפְשֹׁתָם
  choice: à leur propre vie
  rationale: נֶפֶשׁ désigne ici la vie menacée par la violence. Le singulier distributif français exprime naturellement que chacun met sa propre vie en danger.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La construction détachée « Mais eux » et la répétition de « leur propre » préservent l’insistance et l’ironie du texte hébreu ; les deux verbes français restent distincts afin de refléter le parallélisme lexical.
