id: PRO.1.22
reference: Proverbs 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד מָתַ֣י פְּתָיִם֮ תְּֽאֵהֲב֫וּ פֶ֥תִי וְ/לֵצִ֗ים לָ֭צוֹן חָמְד֣וּ לָ/הֶ֑ם וּ֝/כְסִילִ֗ים יִשְׂנְאוּ דָֽעַת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: fr
  text: Jusqu’à quand, gens naïfs[a], aimerez-vous la naïveté[b] ? Jusqu’à quand les moqueurs prendront-ils plaisir à se moquer, et les insensés détesteront-ils la connaissance ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « personnes inexpérimentées »; le terme désigne des gens crédules ou encore dépourvus de discernement.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie des mots de même racine pour « naïfs » et « naïveté ».
    reason: wordplay
lexical_decisions:
- source_word: פְּתָיִם
  choice: gens naïfs
  rationale: Le terme désigne des personnes crédules, inexpérimentées et moralement peu formées, non des personnes simplement limitées intellectuellement. « Gens naïfs » est naturel en français moderne.
- source_word: תְּאֵהֲבוּ
  choice: aimerez-vous
  rationale: Dans cette question de reproche introduite par « jusqu’à quand », l’imparfait hébreu exprime une conduite persistante dont la prolongation est mise en cause.
- source_word: פֶתִי
  choice: naïveté
  rationale: « Naïveté » conserve en français le lien lexical avec « naïfs », écho intentionnel de l’hébreu.
- source_word: לֵצִים
  choice: moqueurs
  rationale: Dans les Proverbes, ce mot caractérise ceux qui tournent avec arrogance la sagesse et la correction en dérision. « Moqueurs » est clair et idiomatique.
- source_word: לָצוֹן
  choice: se moquer
  rationale: La tournure verbale naturelle « prendre plaisir à se moquer » préserve le lien lexical avec « moqueurs ».
- source_word: חָמְדוּ
  choice: prendront-ils plaisir
  rationale: Le verbe exprime ici le désir et l’attrait éprouvé pour la moquerie; cette formulation rend cet attachement volontaire sans la connotation matérielle de « convoiter ».
- source_word: לָהֶם
  choice: implicite dans « prendre plaisir »
  rationale: Le datif pronominal est idiomatique et souligne l’intérêt personnel des moqueurs; l’ajout de « pour eux-mêmes » serait pesant et potentiellement surinterprétatif en français.
- source_word: כְסִילִים
  choice: insensés
  rationale: Il s’agit d’une catégorie morale et spirituelle récurrente de la littérature sapientielle, et non d’un simple manque d’intelligence.
- source_word: יִשְׂנְאוּ
  choice: détesteront-ils
  rationale: Le verbe hébreu est fort. « Détester » exprime nettement l’aversion tout en s’intégrant naturellement à la question française.
- source_word: דָעַת
  choice: connaissance
  rationale: C’est le correspondant direct du nom hébreu et un terme central des Proverbes.
theological_decisions:
- issue: Terminologie des catégories morales dans les Proverbes
  choice: 'Conserver des catégories distinctes : « gens naïfs », « moqueurs » et « insensés ».'
  alternative: Uniformiser en descriptions psychologiques telles que « inexpérimentés », « railleurs » et « personnes stupides ».
  rationale: Ces termes représentent des profils éthiques récurrents dans les Proverbes. Les maintenir évite de réduire le propos à des capacités intellectuelles ou à des tempéraments.
- issue: Portée de « jusqu’à quand »
  choice: Répéter « Jusqu’à quand » devant la deuxième série de propositions.
  alternative: Ne l’exprimer qu’une fois, au début du verset.
  rationale: L’hébreu ne répète pas la formule, mais sa portée se prolonge sur les trois groupes. La répétition clarifie cette portée en français sans résoudre une ambiguïté théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est rendu par la répétition de « Jusqu’à quand ». Le jeu de mots hébreu est conservé autant que possible par « naïfs/naïveté », tandis que « moqueurs/se moquer » reproduit le second écho lexical.
