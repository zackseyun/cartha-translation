  text: to know wisdom and instruction[a], to understand words of insight[b],
translation:
  language: fr
  text: pour connaître la sagesse et l’instruction[a], pour comprendre les paroles de discernement[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « discipline » : le terme hébreu peut désigner une formation qui comprend aussi la correction.'
    reason: lexical_alternative
  - marker: b
    text: Ou « les propos de discernement » ou « les paroles d’intelligence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: pour connaître
  rationale: L’infinitif construit précédé de ל exprime ici le but dans la séquence programmatique des versets 2 à 6. « Pour connaître » conserve naturellement cette valeur.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: « Sagesse » est l’équivalent usuel dans les Proverbes et désigne un savoir-vivre pratique et moral, non la seule intelligence.
- source_word: מוּסָר
  choice: l’instruction
  rationale: Le mot englobe l’enseignement, la formation et la correction. « Instruction » convient au propos général du prologue, tandis qu’une note conserve la nuance disciplinaire.
- source_word: לְהָבִין
  choice: pour comprendre
  rationale: Cet infinitif de but est parallèle à לָדַעַת. « Pour comprendre » est naturel en français et respecte la structure hébraïque.
- source_word: אִמְרֵי
  choice: les paroles de
  rationale: Le pluriel à l’état construit désigne des paroles ou des propos. « Les paroles de » reste proche de la forme hébraïque et convient au registre sapientiel.
- source_word: בִינָה
  choice: discernement
  rationale: Le terme évoque la faculté de comprendre et de distinguer avec justesse. « Discernement » évite de répéter « comprendre » tout en préservant ce champ sémantique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des deux infinitifs de but est conservé. La virgule finale signale que le verset s’inscrit dans la suite syntaxique du prologue.
