translation:
  language: fr
  text: Car leurs pieds courent vers le mal[a], et ils se dépêchent de verser le sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se comprendre : « pour faire le mal ».'
