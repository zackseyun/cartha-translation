lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’avertissement précédent, dans un français naturel et soutenu.
- source_word: רַגְלֵיהֶם
  choice: leurs pieds
  rationale: Conserve l’image concrète de l’hébreu, qui exprime leur empressement par le mouvement des pieds.
- source_word: לָרַע
  choice: vers le mal
  rationale: Préserve la concision et l’orientation exprimée par la préposition, sans préciser à tort s’il s’agit d’aller vers le mal ou de le commettre.
- source_word: יָרוּצוּ
  choice: courent
  rationale: Rend le sens physique de base et maintient la vigueur de l’image.
- source_word: וִימַהֲרוּ
  choice: et ils se dépêchent
  rationale: Exprime l’empressement tout en formant un parallélisme naturel avec « courent ».
- source_word: לִשְׁפָּךְ דָּם
  choice: de verser le sang
  rationale: Expression française consacrée et naturelle pour désigner l’effusion violente de sang.
