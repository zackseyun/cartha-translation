id: PRO.1.7
reference: Proverbs 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: fr
  text: La crainte de Yahweh[a] est le commencement de la connaissance ; les insensés méprisent la sagesse et la discipline[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le respect de Yahweh » ou « la révérence envers Yahweh ». L’expression hébraïque englobe la révérence, la crainte et une attitude de soumission devant Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’instruction » ou « la correction ». Le terme hébreu désigne une formation qui peut comporter une correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: la crainte de
  rationale: Le nom à l’état construit exprime ici une crainte révérencielle et soumise. « Crainte » conserve toute la force de la formule sapientielle sans la réduire à un simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: רֵאשִׁית
  choice: le commencement
  rationale: Ce choix naturel préserve à la fois l’idée de point de départ et celle de fondement, sans imposer une interprétation plus étroite.
- source_word: דָּעַת
  choice: la connaissance
  rationale: Équivalent courant dans le vocabulaire sapientiel, distinct autant que possible des termes hébreux désignant plus précisément l’intelligence ou le discernement.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rend le terme central des Proverbes de manière traditionnelle, claire et suffisamment large.
- source_word: מוּסָר
  choice: la discipline
  rationale: Le mot désigne une formation qui peut comprendre instruction, avertissement et correction ; « discipline » garde cette dimension éducative et corrective.
- source_word: אֱוִילִים
  choice: les insensés
  rationale: Dans les Proverbes, le terme désigne une catégorie morale plutôt qu’un simple manque d’intelligence. « Insensés » est idiomatique et digne en français.
- source_word: בָּזוּ
  choice: méprisent
  rationale: Le verbe exprime un rejet empreint de dédain ; « méprisent » en conserve la force.
theological_decisions:
- issue: Sens de « crainte de Yahweh » dans la théologie sapientielle
  choice: Conserver « la crainte de Yahweh » dans le texte principal.
  alternative: « le respect de Yahweh » ou « la révérence envers Yahweh »
  rationale: La formule hébraïque associe crainte, révérence et soumission morale. Une formulation plus interprétative en atténuerait ou en réduirait la tension.
- issue: Rapport de רֵאשִׁית à la connaissance
  choice: « le commencement de la connaissance »
  alternative: « le fondement de la connaissance » ou « le principe premier de la connaissance »
  rationale: « Commencement » laisse ouvertes les nuances de point de départ et de principe fondateur présentes dans la formulation concise de l’hébreu.
translation_notes:
  register: Français international moderne, concis et solennel. La structure antithétique du proverbe est conservée. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
