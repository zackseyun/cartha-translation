  text: בְּנִ֗/י אַל תֵּלֵ֣ךְ בְּ/דֶ֣רֶךְ אִתָּ֑/ם מְנַ֥ע רַ֝גְלְ/ךָ֗ מִ/נְּתִיבָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/015.yaml
  text: My son[a], do not walk in the way with them; keep your foot from their path.
translation:
  language: fr
  text: Mon fils, ne marche pas avec eux sur leur chemin ; éloigne ton pied de leur sentier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif de בֵּן avec suffixe de première personne du singulier est rendu naturellement tout en conservant le masculin singulier et le cadre d’instruction d’un père à son fils.
- source_word: אַל תֵּלֵךְ
  choice: ne marche pas
  rationale: אַל suivi de l’imparfait à valeur jussive exprime une interdiction. Le verbe הלך peut signifier « aller » ou « marcher » ; « marcher » maintient ici à la fois l’image concrète et sa portée morale.
- source_word: בְּדֶרֶךְ אִתָּם
  choice: sur le même chemin qu’eux
  rationale: Cette formulation française naturelle exprime le fait d’avancer avec eux dans leur voie. « Chemin » conserve l’ambivalence de דֶּרֶךְ entre route concrète et conduite de vie.
- source_word: מְנַע
  choice: tiens … à l’écart
  rationale: L’impératif de מנע demande une retenue active. La tournure « tenir son pied à l’écart de » est idiomatique en français et communique l’évitement volontaire.
- source_word: רַגְלְךָ
  choice: ton pied
  rationale: Le singulier avec suffixe masculin singulier est conservé ; l’image du pied convient au parallélisme avec le chemin.
- source_word: מִנְּתִיבָתָם
  choice: de leur sentier
  rationale: נְתִיבָה désigne un sentier ou une piste. « Sentier » préserve la métaphore et la variation lexicale par rapport à דֶּרֶךְ, tandis que « de » rend la préposition d’éloignement מִן.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme des images (« chemin », « pied », « sentier ») est maintenu, ainsi que la double portée, concrète et morale, du langage de la marche.
