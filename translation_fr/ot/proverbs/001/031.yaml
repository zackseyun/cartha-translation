id: PRO.1.31
reference: Proverbs 1:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ֭/יֹאכְלוּ מִ/פְּרִ֣י דַרְכָּ֑/ם וּֽ/מִ/מֹּעֲצֹ֖תֵי/הֶ֣ם יִשְׂבָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: fr
  text: Ils mangeront donc du fruit de leur conduite[a] et se rassasieront de leurs propres projets[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement: «de leur chemin» ou «de leur voie».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «de leurs propres conseils»; ou «auront leur content de leurs propres desseins».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: Ils mangeront donc
  rationale: Le waw relie ce verset au refus décrit précédemment et peut naturellement exprimer ici la conséquence; le futur français conserve la valeur de יֹאכְלוּ.
- source_word: מִפְּרִי
  choice: du fruit
  rationale: La tournure française «manger du fruit de» rend naturellement מִן tout en conservant l’image selon laquelle ils subissent ce que leur vie a produit.
- source_word: דַרְכָּם
  choice: leur conduite
  rationale: דֶּרֶךְ signifie littéralement «chemin, voie», mais désigne fréquemment dans les Proverbes la manière de vivre. «Conduite» rend clairement ce sens moral dans un français actuel.
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: de leurs propres projets
  rationale: מֹעֵצוֹת peut désigner des conseils, des desseins ou des projets. Ici, «projets» convient à des décisions conçues par eux-mêmes, et «propres» souligne sans excès le suffixe possessif.
- source_word: יִשְׂבָּעוּ
  choice: se rassasieront
  rationale: Le verbe signifie être rassasié ou avoir à satiété. «Se rassasieront» maintient l’image alimentaire et son ironie judiciaire.
theological_decisions:
- issue: L’image de la conséquence morale dans le jugement sapientiel
  choice: Présenter le verset comme la conséquence de leur propre conduite et de leurs propres projets, sans ajouter une catégorie doctrinale extérieure.
  alternative: Conserver un simple «et» qui laisserait entièrement implicite le lien de conséquence.
  rationale: 'Les images du fruit mangé et du rassasiement expriment une conséquence appropriée: les personnes éprouvent le résultat de la voie qu’elles ont choisie. «Donc» explicite sobrement le rapport contextuel sans résoudre davantage la tension théologique.'
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme ainsi que la double image de l’alimentation («fruit», «se rassasier»).
