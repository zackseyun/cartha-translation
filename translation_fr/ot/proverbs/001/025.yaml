  text: וַ/תִּפְרְע֥וּ כָל עֲצָתִ֑/י וְ֝/תוֹכַחְתִּ֗/י לֹ֣א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/025.yaml
  text: but you ignored all my counsel[b][a], and you were unwilling to accept my reproof—
translation:
  language: fr
  text: mais vous avez fait fi de tous mes conseils[a] et vous n’avez pas voulu de ma réprimande[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez négligé tous mes conseils » ou « vous avez écarté tous mes conseils ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « vous avez refusé ma réprimande ». L’hébreu souligne plus littéralement l’absence de volonté : « vous n’avez pas voulu de ma réprimande ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: vous avez fait fi de
  rationale: Le verbe פרע exprime ici le fait de laisser de côté ou de ne tenir aucun compte d’une chose. « Faire fi de » rend le mépris délibéré sans suggérer un acte violent.
- source_word: כָל
  choice: tous
  rationale: כָל est le quantificateur courant « tout » ; au pluriel, « tous mes conseils » est naturel en français.
- source_word: עֲצָתִי
  choice: mes conseils
  rationale: עֵצָה désigne ici les conseils ou la direction donnés par la Sagesse. Le pluriel français est idiomatique et conserve l’idée de recommandations avisées.
- source_word: וְתוֹכַחְתִּי
  choice: ma réprimande
  rationale: תּוֹכַחַת désigne une parole qui reprend afin de corriger. « Réprimande » maintient la force disciplinaire du terme sans durcir le sens jusqu’à « condamnation ».
- source_word: לֹא אֲבִיתֶם
  choice: vous n’avez pas voulu de
  rationale: אָבָה, nié, souligne l’absence de volonté ou de consentement. « Vous n’avez pas voulu de » reproduit cette dimension volontaire tout en restant naturel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Faire fi de » est légèrement soutenu, mais exprime clairement un rejet délibéré. La coordination sans virgule suit le rythme bref du parallélisme hébreu ; le tiret final signale la continuation de la phrase.
