  text: for they are a graceful wreath for your head and necklaces for your neck[a][b].
translation:
  language: fr
  text: car ils sont une gracieuse couronne pour ta tête et des colliers pour ton cou[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une guirlande de faveur pour ta tête ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des chaînes pour ton cou ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison qui appuie l’exhortation du verset précédent et assure un lien naturel en français.
- source_word: לִוְיַת חֵן
  choice: une gracieuse couronne
  rationale: לִוְיַת désigne un ornement enroulé ou tressé porté sur la tête, tandis que חֵן évoque ici la grâce, le charme ou la beauté. Cette formulation est naturelle et évite de donner à « grâce » un sens doctrinal.
- source_word: הֵם
  choice: ils sont
  rationale: Le pronom renvoie à l’instruction du père et à l’enseignement de la mère au verset 8; le masculin pluriel français reprend ces deux noms.
- source_word: לְרֹאשֶׁךָ
  choice: pour ta tête
  rationale: Préserve la relation exprimée par לְ sans imposer plus précisément la position « sur » la tête.
- source_word: וַעֲנָקִים
  choice: et des colliers
  rationale: Conserve le pluriel hébreu et exprime clairement des ornements du cou, en parallèle avec la couronne.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: pour ton cou
  rationale: « Cou » est le terme français naturel dans le contexte de bijoux, là où une traduction anatomique par « gorge » serait maladroite.
