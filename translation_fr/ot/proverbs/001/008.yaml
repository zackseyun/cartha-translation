id: PRO.1.8
reference: Proverbs 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י מוּסַ֣ר אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: fr
  text: Écoute, mon fils, l’instruction[a] de ton père, et n’abandonne pas l’enseignement[b] de ta mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « discipline » : le mot hébreu évoque une formation qui comprend aussi la correction.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « loi » : ici, le terme désigne l’enseignement faisant autorité d’une mère plutôt qu’un code juridique formel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif appelle à une écoute attentive qui peut impliquer l’obéissance. « Écoute » est direct et naturel en français, sans expliciter davantage que l’hébreu.
- source_word: בְּנִי
  choice: mon fils
  rationale: L’hébreu porte explicitement le masculin singulier avec un suffixe de première personne ; « mon fils » conserve l’adresse familiale et la forme littéraire du discours de sagesse.
- source_word: מוּסַר
  choice: instruction
  rationale: Le terme désigne une formation qui peut inclure discipline et correction. « Instruction » convient au contexte parental et évite la coloration principalement punitive que peut avoir « discipline » en français moderne.
- source_word: אָבִיךָ
  choice: de ton père
  rationale: Cette tournure possessive est idiomatique en français et restitue clairement la relation exprimée par l’hébreu.
- source_word: וְאַל
  choice: et ne… pas
  rationale: La conjonction suivie de la négation coordonne directement le second impératif au premier.
- source_word: תִּטֹּשׁ
  choice: n’abandonne pas
  rationale: Le verbe signifie laisser ou délaisser. « Abandonner » conserve la force morale de l’expression tout en restant courant en français moderne.
- source_word: תּוֹרַת
  choice: enseignement
  rationale: Dans ce cadre familial, תּוֹרָה désigne l’enseignement autorisé de la mère plutôt qu’un code légal formel. « Enseignement » rend naturellement ce sens.
- source_word: אִמֶּךָ
  choice: de ta mère
  rationale: La construction est idiomatique en français et maintient le parallélisme avec « de ton père ».
theological_decisions:
- issue: Adresse filiale genrée dans le discours de sagesse
  choice: mon fils
  alternative: mon enfant
  rationale: Le texte hébreu est masculin singulier, et cette adresse de père à fils appartient à la forme rhétorique du passage. La traduction ne neutralise donc pas ce trait.
- issue: Sens de תּוֹרָה dans un contexte familial non mosaïque
  choice: enseignement
  alternative: loi
  rationale: Ici, le mot renvoie à l’instruction autorisée d’une mère, non à la Torah mosaïque envisagée comme corpus légal. « Enseignement » préserve ce sens contextuel sans introduire une lecture juridique trop étroite.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif « Écoute » garde la vivacité de l’adresse sapientielle ; le parallélisme entre le père et la mère est conservé.
