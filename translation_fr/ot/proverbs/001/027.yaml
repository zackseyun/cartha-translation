  naturalness: Le français est globalement fluide, poétique et accessible. « Votre terreur viendra comme une tempête » est naturel dans ce registre et permet de rester plus près de la formulation nominale hébraïque. « S’abattront sur vous » est idiomatique pour la détresse et l’angoisse qui surviennent.
  terminology: « Malheur », « détresse », « angoisse », « tempête » et « tourbillon » conviennent au registre sapientiel et rendent adéquatement les termes hébreux. La note conserve à juste titre l’alternative lexicale de שָׁאוָה.
