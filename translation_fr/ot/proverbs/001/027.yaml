  text: בְּ/בֹ֤א כ/שאוה פַּחְדְּ/כֶ֗ם וְֽ֭/אֵידְ/כֶם כְּ/סוּפָ֣ה יֶאֱתֶ֑ה בְּ/בֹ֥א עֲ֝לֵי/כֶ֗ם צָרָ֥ה וְ/צוּקָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: fr
  text: quand votre terreur viendra comme une tempête[a], quand votre malheur arrivera comme un tourbillon, quand la détresse et l’angoisse s’abattront sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme la dévastation » ; le terme hébreu peut souligner la ruine destructrice autant que la violence fracassante d’une tempête.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  choice: quand… fondra / arrivera / s’abattront
  rationale: La préposition ב avec l’infinitif construit de בוא introduit une proposition temporelle. La répétition de « quand » restitue la structure hébraïque, tandis que des verbes naturels en français rendent la venue soudaine du désastre.
- source_word: כְשָׁאוָה
  choice: comme une tempête
  rationale: Le nom évoque une irruption dévastatrice ou la ruine. « Tempête » conserve l’image vive, en parallèle avec « tourbillon », sans effacer la nuance de destruction, signalée en note.
- source_word: פַּחְדְּכֶם
  choice: ce que vous redoutez
  rationale: פּחד peut désigner la peur ou ce qui inspire la peur. Ici, le verbe de mouvement et la série des calamités favorisent le sens concret de la chose redoutée, tout en préservant la tension lexicale.
- source_word: וְאֵידְכֶם
  choice: votre malheur
  rationale: אֵיד désigne une catastrophe ou un désastre. « Malheur » est actuel, digne et naturel dans le registre sapientiel.
- source_word: כְסוּפָה
  choice: comme un tourbillon
  rationale: סוּפָה désigne une violente tempête de vent. « Tourbillon » rend sa force et maintient le parallélisme poétique.
- source_word: יֶאֱתֶה
  choice: arrivera
  rationale: Le verbe signifie venir ou arriver. « Arrivera » reste proche de l’hébreu et convient à l’apparition soudaine du malheur.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: Dans ce contexte, עַל présente l’adversité comme venant sur ses victimes. « Sur vous » est direct et idiomatique.
- source_word: צָרָה
  choice: la détresse
  rationale: צָרָה exprime la difficulté, l’oppression ou la détresse. Ce choix conserve à la fois la situation éprouvante et son effet ressenti.
- source_word: וְצוּקָה
  choice: et l’angoisse
  rationale: צוּקָה évoque l’étroitesse, la pression et l’angoisse. « Angoisse » distingue les deux termes parallèles sans nier leur recouvrement sémantique.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La triple reprise de « quand » conserve la progression et l’insistance de l’hébreu. Les verbes « fondra » et « s’abattront » rendent naturellement en français l’arrivée brutale suggérée par les images, sans ajouter d’interprétation confessionnelle.
