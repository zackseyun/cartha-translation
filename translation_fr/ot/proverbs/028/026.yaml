source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/לִבּ/וֹ ה֣וּא כְסִ֑יל וְ/הוֹלֵ֥ךְ בְּ֝/חָכְמָ֗ה ה֣וּא יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
translation:
  language: fr
  text: Qui se fie à son propre cœur est un insensé[a], mais qui marche avec sagesse échappera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le « cœur » désigne souvent la personne intérieure, y compris sa pensée, son jugement et sa volonté, et pas seulement ses émotions.
    reason: cultural_note
  - marker: b
    text: 'Ou : « sera délivré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: se fie
  rationale: Le participe de בטח exprime le fait de placer sa confiance dans quelqu’un ou quelque chose. « Se fie » rend naturellement ici la confiance mal placée en soi-même.
- source_word: בְּלִבּוֹ
  choice: à son propre cœur
  rationale: Le cœur désigne en hébreu la personne intérieure, notamment la pensée, le jugement et la volonté. « Son propre » explicite la valeur du suffixe et le caractère autoréférentiel de cette confiance.
- source_word: כְסִיל
  choice: un insensé
  rationale: Ce terme sapientiel désigne une personne déficiente à la fois dans son jugement et dans son orientation morale. « Insensé » conserve cette catégorie traditionnelle sans se réduire à une injure moderne.
- source_word: וְהוֹלֵךְ
  choice: qui marche
  rationale: Le verbe הלך évoque ici la conduite ou la manière de vivre. Le maintien de la métaphore de la marche reste naturel en français biblique moderne.
- source_word: בְּחָכְמָה
  choice: avec sagesse
  rationale: Cette formulation française idiomatique préserve l’idée d’une conduite guidée ou caractérisée par la sagesse.
- source_word: יִמָּלֵט
  choice: échappera
  rationale: Le niphal de מלט peut signifier échapper ou être délivré. « Échappera » convient à la concision proverbiale sans préciser indûment l’agent ou la nature de la délivrance.
- source_word: הוּא ... הוּא
  choice: est ... qui ... échappera
  rationale: Les pronoms hébreux donnent de l’emphase aux deux propositions. En français, la structure parallèle avec « qui » rend cette opposition sans répétition lourde.
theological_decisions:
- issue: Anthropologie du « cœur »
  choice: Conserver « cœur » tout en expliquant son sens hébreu en note.
  alternative: Traduire par « lui-même », « esprit » ou « jugement ».
  rationale: Le terme hébreu englobe la pensée, le discernement et la volonté, et non les seules émotions. Conserver l’image respecte l’anthropologie du texte sans la réduire à une catégorie psychologique moderne.
- issue: Masculin générique
  choice: Employer les tournures épicènes « qui » et « son propre cœur », sans ajouter de pronom personnel sexué.
  alternative: Employer « celui qui… il… » ou pluraliser au moyen de « leur ».
  rationale: L’hébreu est au masculin singulier avec une portée représentative. Le français permet ici de conserver le singulier et la portée universelle sans modifier le nombre ni rendre le genre plus saillant que dans le propos.
- issue: Sens de יִמָּלֵט
  choice: Retenir « échappera » dans le texte et signaler « sera délivré » en note.
  alternative: Mettre directement « sera délivré ».
  rationale: La forme hébraïque autorise les deux nuances. « Échappera » ne précise pas l’agent, tandis que la note préserve l’autre lecture légitime sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique et la métaphore de la marche sont conservés. « Insensé » maintient la valeur sapientielle de כְסִיל, tandis que les notes rendent explicites l’étendue sémantique de « cœur » et l’ambiguïté de יִמָּלֵט.
