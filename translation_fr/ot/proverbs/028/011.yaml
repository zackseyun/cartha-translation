  text: חָכָ֣ם בְּ֭/עֵינָי/ו אִ֣ישׁ עָשִׁ֑יר וְ/דַ֖ל מֵבִ֣ין יַחְקְרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/011.yaml
  text: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
translation:
  language: fr
  text: Un homme riche est sage à ses propres yeux, mais un pauvre qui a du discernement l’examine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sonde », « le scrute » ou, selon le contexte, « le perce à jour ». Le verbe hébreu peut désigner l’action de rechercher, d’examiner ou de sonder.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם בְּעֵינָיו
  choice: sage à ses propres yeux
  rationale: L’adjectif prédicatif « sage » est conservé, tandis que l’expression idiomatique « à ses propres yeux » indique clairement qu’il s’agit de l’estimation que l’homme riche a de lui-même.
- source_word: אִישׁ עָשִׁיר
  choice: un homme riche
  rationale: Le groupe nominal désigne directement un homme riche; le masculin singulier du proverbe est maintenu.
- source_word: וְדַל
  choice: mais un pauvre
  rationale: Le waw introduit ici le contraste entre richesse présomptueuse et pauvreté lucide; « mais » rend naturellement cette relation. L’adjectif substantivé דַל désigne une personne de faibles moyens.
- source_word: מֵבִין
  choice: qui a du discernement
  rationale: Le participe de בין exprime la capacité de comprendre et de discerner; la proposition relative est naturelle en français et conserve sa fonction attributive.
- source_word: יַחְקְרֶנּוּ
  choice: le perce à jour
  rationale: Le verbe חקר avec suffixe masculin singulier signifie rechercher, examiner ou sonder. Dans ce contexte, « percer à jour » exprime idiomatiquement le fait de pénétrer au-delà de l’apparence ou de la prétention, sans préciser indûment ce qui est découvert.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme antithétique est conservé. « Le perce à jour » privilégie une expression française claire tout en accompagnant d’une note la portée plus littérale et l’ambiguïté du verbe hébreu.
