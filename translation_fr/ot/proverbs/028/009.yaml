source:
  edition: WLC
  text: מֵסִ֣יר אָ֭זְנ/וֹ מִ/שְּׁמֹ֣עַ תּוֹרָ֑ה גַּֽם תְּ֝פִלָּת֗/וֹ תּוֹעֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/009.yaml
  text: Whoever turns his ear away from hearing the law—even his prayer is an abomination[a].
translation:
  language: fr
  text: Celui qui détourne l’oreille pour ne pas écouter la loi, même sa prière est une abomination[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction » ou « l’enseignement » pour « la loi » (hébreu torah), terme qui peut désigner un enseignement faisant autorité et ne se limite pas nécessairement à des prescriptions juridiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: détourne
  rationale: Le participe hiphil décrit ici une conduite caractéristique. « Détourne » exprime naturellement en français l’action volontaire de se soustraire à l’écoute.
- source_word: אָזְנוֹ
  choice: l’oreille
  rationale: La métaphore concrète de l’oreille est conservée; le possessif hébreu est rendu idiomatiquement par l’article défini après « celui qui ».
- source_word: מִשְּׁמֹעַ
  choice: pour ne pas écouter
  rationale: Cette formulation française explicite la visée du détournement et rend le refus actif impliqué par la construction hébraïque, sans en modifier le sens.
- source_word: תּוֹרָה
  choice: la loi
  rationale: « Loi » conserve le poids normatif et l’usage biblique établi de torah. Le sens plus large d’instruction autorisée est signalé en note.
- source_word: גַּם
  choice: même
  rationale: '« Même » rend la valeur emphatique: jusque dans sa prière, la conduite de cette personne est odieuse.'
- source_word: תְּפִלָּתוֹ
  choice: sa prière
  rationale: Traduction directe et naturelle du nom hébreu désignant la prière.
- source_word: תּוֹעֵבָה
  choice: une abomination
  rationale: Ce terme maintient la force morale et cultuelle du mot hébreu, plus intense qu’une simple idée de désagrément ou d’inacceptabilité.
theological_decisions:
- issue: Portée de תּוֹרָה dans le contexte sapientiel
  choice: « la loi », au sens de l’enseignement divin faisant autorité
  alternative: « l’instruction » ou « l’enseignement »
  rationale: Le contexte condamne le refus d’écouter l’enseignement normatif de Dieu. « La loi » en conserve la force d’autorité, tandis que la note préserve explicitement l’étendue lexicale possible.
- issue: Rapport entre refus d’écouter et prière
  choice: Conserver l’affirmation absolue et frappante selon laquelle même la prière est une abomination
  alternative: Paraphraser comme une prière « non exaucée » ou « inacceptable »
  rationale: Le texte hébreu emploie le terme fort תּוֹעֵבָה et ne précise ni le mécanisme ni les limites de l’affirmation; la traduction ne doit pas atténuer ou résoudre cette tension théologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe garde la métaphore hébraïque de l’oreille tout en employant « pour ne pas écouter », plus idiomatique que le calque « loin d’entendre ». « Abomination » préserve volontairement la vigueur du texte source.
