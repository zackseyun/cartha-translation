  text: הַֽכֵּר פָּנִ֥ים לֹא ט֑וֹב וְ/עַל פַּת לֶ֝֗חֶם יִפְשַׁע גָּֽבֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
translation:
  language: fr
  text: Faire preuve de partialité[a] n’est pas bon ; pourtant, pour un morceau de pain[b], un homme[c] commettra une faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « reconnaître les visages », expression qui signifie faire preuve de favoritisme ou de partialité.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour une bouchée de pain » ; l’idée est qu’un avantage minime peut pousser quelqu’un à mal agir.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « un homme » dans le sens représentatif propre aux maximes proverbiales.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  choice: faire preuve de partialité
  rationale: L’expression signifie littéralement « reconnaître les visages », mais constitue un idiome désignant le favoritisme dans le jugement ou la manière de traiter les gens. La formulation choisie est naturelle en français et conserve sa portée morale.
- source_word: לֹא טוֹב
  choice: n’est pas bien
  rationale: Cette formulation rend simplement l’évaluation morale générale de l’hébreu, sans la réduire à une seule notion juridique.
- source_word: וְעַל
  choice: pourtant, pour
  rationale: La conjonction et la préposition introduisent ici le contraste entre le principe moral du premier membre et la facilité avec laquelle quelqu’un peut le violer pour un gain dérisoire.
- source_word: פַּת לֶחֶם
  choice: un morceau de pain
  rationale: L’expression désigne une petite portion de pain et souligne ainsi le caractère insignifiant de l’avantage susceptible d’entraîner la faute.
- source_word: יִפְשַׁע
  choice: peut commettre une transgression
  rationale: Le verbe פשע exprime une transgression, voire une rébellion. Le modal « peut » convient à la portée générale et proverbiale de l’inaccompli hébreu, tandis que « transgression » en conserve le poids moral.
- source_word: גָּבֶר
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et désigne ici un homme pris comme exemple représentatif dans une maxime proverbiale.
theological_decisions:
- issue: Masculin générique dans une maxime proverbiale
  choice: un homme
  alternative: une personne
  rationale: Le texte emploie explicitement le masculin singulier גָּבֶר. La traduction conserve cette forme sexuée tout en signalant en note sa portée proverbiale générale.
- issue: Valeur de l’inaccompli יִפְשַׁע
  choice: peut commettre une transgression
  alternative: commettra une transgression
  rationale: Dans ce contexte proverbial, l’inaccompli peut exprimer un comportement possible ou caractéristique plutôt qu’une prédiction certaine. « Peut » préserve cette nuance sans atténuer la gravité de l’acte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme concis du proverbe est conservé, avec un point-virgule marquant le contraste entre ses deux membres.
