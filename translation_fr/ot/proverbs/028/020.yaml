source:
  edition: WLC
  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
translation:
  language: fr
  text: 'L’homme fidèle sera comblé de bénédictions,

    mais celui qui se hâte de devenir riche ne restera pas impuni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne sera pas tenu pour innocent » ou « ne sera pas acquitté ».'
    reason: Alternative lexicale reflétant les autres sens possibles de לֹא יִנָּקֶה.
lexical_decisions:
- source_word: אִישׁ אֱמוּנוֹת
  choice: L’homme fidèle
  rationale: La construction signifie littéralement « un homme de fidélités » et décrit une personne fiable, intègre et constante. « L’homme fidèle » conserve la forme masculine représentative du proverbe tout en restant naturel en français.
- source_word: רַב בְּרָכוֹת
  choice: sera comblé de bénédictions
  rationale: Dans cette proposition sans verbe, רַב exprime l’abondance. « Sera comblé de bénédictions » rend naturellement la portée générale et proverbiale de l’hébreu, tout en conservant le pluriel בְּרָכוֹת.
- source_word: וְאָץ
  choice: mais celui qui se hâte
  rationale: Le verbe אָץ exprime l’empressement ou la précipitation. La tournure choisie restitue la mise en contraste et la nuance négative d’une poursuite impatiente.
- source_word: לְהַעֲשִׁיר
  choice: de devenir riche
  rationale: L’infinitif hiphil peut signifier « devenir riche » ou « acquérir des richesses ». Cette formulation est claire, digne et n’ajoute pas l’idée que toute richesse serait condamnée.
- source_word: לֹא יִנָּקֶה
  choice: ne restera pas impuni
  rationale: Le niphal de נקה peut signifier être tenu pour innocent, être acquitté ou rester impuni. Dans ce contexte de conséquence morale, « ne restera pas impuni » est idiomatique et précis.
theological_decisions:
- issue: Objet de la condamnation morale
  choice: La traduction vise la précipitation à devenir riche, non la richesse en elle-même.
  alternative: Formuler le vers comme une condamnation générale de l’enrichissement.
  rationale: Le texte hébreu porte sur celui qui se hâte (אָץ) de devenir riche; il ne dit pas que toute possession de richesses est coupable.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique est conservé sur deux lignes. Le masculin singulier a ici une portée représentative, conformément à la forme proverbiale hébraïque.
