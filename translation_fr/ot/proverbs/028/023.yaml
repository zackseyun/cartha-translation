  text: מ֘וֹכִ֤יחַ אָדָ֣ם אַ֭חֲרַי חֵ֣ן יִמְצָ֑א מִֽ/מַּחֲלִ֥יק לָשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/023.yaml
  text: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
translation:
  language: fr
  text: Celui qui reprend quelqu’un trouvera ensuite davantage de faveur que n’en trouvera celui qui tient des propos flatteurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Celui qui reprend quelqu’un trouvera plus tard davantage de faveur que celui qui flatte par sa langue. »'
    reason: La syntaxe comparative peut être formulée de façon plus proche de l’hébreu, en conservant l’image de la « langue ».
lexical_decisions:
- source_word: מוֹכִיחַ
  choice: reprend
  rationale: Le participe hiphil de יכח exprime ici l’action d’adresser une réprimande ou une correction. « Reprend » conserve la fermeté du contraste avec la flatterie tout en étant naturel dans un proverbe.
- source_word: אָדָם
  choice: quelqu’un
  rationale: Le nom désigne ici une personne prise individuellement. « Quelqu’un » rend naturellement en français la portée humaine générique sans imposer un sexe que le contexte ne met pas en relief.
- source_word: אַחֲרַי
  choice: ensuite
  rationale: 'Dans ce contexte, le terme a vraisemblablement une valeur adverbiale temporelle : la faveur vient ultérieurement, après la réprimande.'
- source_word: חֵן
  choice: faveur
  rationale: חֵן désigne l’accueil favorable ou l’estime obtenue. « Faveur » préserve cette nuance sans charger le terme d’un sens théologique non requis ici.
- source_word: יִמְצָא
  choice: trouvera
  rationale: L’imparfait exprime l’issue attendue dans cette maxime. Le futur français convient à cette conséquence proverbiale.
- source_word: מִמַּחֲלִיק לָשׁוֹן
  choice: plus de faveur que celui qui tient des propos flatteurs
  rationale: Le מִן marque la comparaison. Le participe מחליק évoque littéralement le fait de rendre lisse, d’où flatter; לָשׁוֹן renvoie au langage. « Tenir des propos flatteurs » restitue idiomatiquement l’image en français courant.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et proverbiale; « reprend » garde la force de la correction, tandis que « quelqu’un » rend la référence générique de façon naturelle.
