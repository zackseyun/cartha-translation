    issue: Comparaison elliptique dans le texte principal
    rationale: « Trouvera ensuite plus de faveur que celui qui tient des propos flatteurs » peut donner l’impression de comparer une quantité de faveur à une personne. L’ajout de « n’en trouvera » explicite la relation comparative présente en hébreu.
  - severity: medium
    issue: Note alternative grammaticalement et sémantiquement imprécise
    rationale: « Trouvera par la suite faveur, plutôt que celui… » est une construction inachevée en français et ne maintient pas explicitement « plus de faveur que ». Elle doit être remplacée par une véritable variante, proche de l’image de la langue.
  revised_text: Celui qui reprend quelqu’un trouvera ensuite davantage de faveur que n’en trouvera celui qui tient des propos flatteurs[a].
  revised_footnotes:
