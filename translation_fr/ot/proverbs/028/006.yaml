  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ דְּ֝רָכַ֗יִם וְ/ה֣וּא עָשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/006.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his ways[a], though he is rich.
translation:
  language: fr
  text: Mieux vaut un pauvre qui marche dans son intégrité qu’un riche dont les voies sont tortueuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mieux vaut un pauvre qui marche dans son intégrité qu’un homme tortueux dans ses voies, et lui est riche. » La dernière proposition hébraïque, « et lui est riche », se rapporte à l’homme aux voies tortueuses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: En tête de ce proverbe, טוֹב introduit une comparaison. « Mieux vaut… que… » en restitue naturellement la structure aphoristique en français.
- source_word: רָשׁ
  choice: un pauvre
  rationale: רָשׁ désigne une personne pauvre ou démunie. Le masculin singulier représentatif de l’hébreu est conservé.
- source_word: הוֹלֵךְ
  choice: qui se conduit
  rationale: Le verbe signifie littéralement « marcher », mais possède ici une valeur éthique portant sur la manière de vivre. « Se conduit » exprime cette valeur avec naturel.
- source_word: בְּתֻמּוֹ
  choice: avec intégrité
  rationale: תֻּם évoque l’intégrité, la droiture ou l’entier attachement moral, sans nécessairement affirmer une perfection absolue.
- source_word: מֵעִקֵּשׁ
  choice: qu’un homme … tortueux
  rationale: La préposition מִן marque le second terme de la comparaison. עִקֵּשׁ décrit une personne moralement tortueuse ou perverse; « tortueux » maintient l’image spatiale liée aux chemins.
- source_word: דְּרָכַיִם
  choice: aux chemins
  rationale: Le terme, formellement duel ou pluriel, désigne ici les voies d’une personne, donc sa conduite. Le conserver sous forme d’image répond au contraste avec la manière de se conduire.
- source_word: וְהוּא עָשִׁיר
  choice: même s’il est riche
  rationale: L’hébreu dit littéralement « et lui, [il est] riche ». Dans le contraste proverbial, la coordination a une portée concessive; « même si » la rend clairement tout en gardant pour référent l’homme aux chemins tortueux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme proverbial et l’image des chemins, tout en rendant idiomatiquement la valeur morale de « marcher » et la nuance concessive de la proposition finale.
