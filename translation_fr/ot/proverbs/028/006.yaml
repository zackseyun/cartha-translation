revisions:
- from: Mieux vaut un pauvre qui se conduit avec intégrité qu’un homme aux chemins tortueux, même s’il est riche.[a]
  to: Mieux vaut un pauvre qui marche dans son intégrité qu’un riche dont les voies sont tortueuses.[a]
  rationale: La révision clarifie que la torsion concerne la conduite de l’homme, non la forme matérielle de ses chemins. Elle maintient la comparaison proverbiale, l’image de la marche et des voies, ainsi que le référent de la richesse. La place de « riche » dans le second terme rend en français le contraste implicite sans ajouter de contenu doctrinal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:34Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens comparatif est correctement rendu, de même que l’opposition entre l’intégrité du pauvre et la conduite dévoyée de l’homme riche. Toutefois, « un homme aux chemins tortueux » peut décrire ses chemins au sens physique et n’exprime pas assez clairement que עִקֵּשׁ qualifie la personne dans sa conduite. La richesse se rapporte bien au second terme de comparaison.
  naturalness: « Mieux vaut » et « qui marche dans son intégrité » sont naturels dans un registre proverbial moderne. « Un riche dont les voies sont tortueuses » est plus idiomatique et plus clair que « un homme aux chemins tortueux », tout en conservant l’image hébraïque des voies.
  terminology: « Intégrité » rend justement תֻּם. « Voies tortueuses » conserve l’image morale de דְּרָכַיִם et évite d’imposer « pervers ». « Riche » rend directement עָשִׁיר.
  issues:
  - severity: medium
    issue: Portée morale insuffisamment explicite dans « un homme aux chemins tortueux ».
    rationale: La formulation française peut se comprendre comme une description de routes sinueuses. L’hébreu décrit l’homme comme tortueux dans ses voies, c’est-à-dire dans sa conduite. Reformuler avec « dont les voies sont tortueuses » préserve l’image et rend cette relation sans ambiguïté.
  revised_text: Mieux vaut un pauvre qui marche dans son intégrité qu’un riche dont les voies sont tortueuses.[a]
  revised_footnotes:
