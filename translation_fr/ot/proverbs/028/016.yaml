source:
  edition: WLC
  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
translation:
  language: fr
  text: Un dirigeant qui manque de discernement multiplie les actes d’oppression[a], mais celui qui déteste le gain malhonnête[b] prolongera ses jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « est grand en oppressions ». On pourrait aussi traduire : « commet beaucoup d’extorsions ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le profit injuste », « le gain obtenu malhonnêtement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  choice: dirigeant
  rationale: Le terme désigne une personne investie d’autorité. « Dirigeant » convient à la portée générale du proverbe sans introduire la nuance monarchique plus étroite de « prince ».
- source_word: חֲסַר תְּבוּנוֹת
  choice: qui manque de discernement
  rationale: L’expression indique une déficience de compréhension et de jugement pratique. « Manquer de discernement » est naturel en français et correspond bien au vocabulaire sapientiel.
- source_word: וְרַב מַעֲשַׁקּוֹת
  choice: multiplie les actes d’oppression
  rationale: La formulation hébraïque, littéralement « grand/abondant en oppressions », décrit des agissements oppressifs nombreux. Cette tournure française en restitue naturellement la force sans limiter le sens à l’extorsion.
- source_word: מַעֲשַׁקּוֹת
  choice: actes d’oppression
  rationale: Le pluriel désigne des actes oppressifs ou abusifs. Cette traduction est plus claire que le simple pluriel « oppressions » et plus large que « extorsions ».
- source_word: שׂנֵא בֶצַע
  choice: celui qui déteste le gain malhonnête
  rationale: בֶצַע évoque ici un profit recherché avec avidité ou obtenu injustement. « Gain malhonnête » conserve cette valeur morale sans condamner tout profit en soi.
- source_word: יַאֲרִיךְ יָמִים
  choice: prolongera ses jours
  rationale: Cette expression hébraïque conventionnelle évoque une longue vie. La traduction conserve son image tout en restant compréhensible en français moderne.
theological_decisions:
- issue: Nature proverbiale de la promesse de longévité
  choice: Conserver l’énoncé direct « prolongera ses jours »
  alternative: Expliciter ou atténuer par « pourra vivre longtemps »
  rationale: Le texte formule sans réserve une conséquence sapientielle. La traduction ne doit ni transformer cette maxime en garantie doctrinale explicitée, ni l’affaiblir par une modalisation absente de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme antithétique est conservé. « Multiplie les actes d’oppression » rend idiomatiquement une expression hébraïque peu naturelle en traduction littérale, tandis que « prolongera ses jours » maintient l’image traditionnelle du texte source.
