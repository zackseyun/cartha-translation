source:
  edition: WLC
  text: מַשְׁגֶּ֤ה יְשָׁרִ֨ים בְּ/דֶ֥רֶךְ רָ֗ע בִּ/שְׁחוּת֥/וֹ הֽוּא יִפּ֑וֹל וּ֝/תְמִימִ֗ים יִנְחֲלוּ טֽוֹב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/010.yaml
  text: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
translation:
  language: fr
  text: Celui qui égare les hommes droits sur une mauvaise voie tombera lui-même dans sa propre fosse[a], mais les hommes intègres hériteront du bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombera dans sa propre ruine » ou « dans sa propre destruction ». Le terme hébreu peut désigner une fosse aussi bien que la ruine ou la destruction ; le texte conserve l’image du piège.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁגֶּה
  choice: Celui qui égare
  rationale: Le participe hiphil de שׁגה exprime l’action de faire errer ou de détourner. « Celui qui égare » conserve la portée générale du participe et reste naturel en français.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Le terme désigne des personnes moralement droites. « Les hommes droits » exprime clairement cette valeur éthique dans un français courant et digne.
- source_word: בְּדֶרֶךְ רָע
  choice: sur une mauvaise voie
  rationale: דֶּרֶךְ signifie littéralement « chemin, voie » et désigne souvent la conduite. Cette formulation préserve la métaphore sans préciser indûment si la voie est le moyen ou la destination de l’égarement.
- source_word: בִּשְׁחוּתוֹ
  choice: dans sa propre fosse
  rationale: Le nom peut évoquer une fosse, la destruction ou la ruine. « Fosse » conserve l’image concrète du piège et le suffixe possessif est rendu par « sa propre ».
- source_word: הוּא יִפּוֹל
  choice: tombera lui-même
  rationale: Le pronom explicite הוּא donne une valeur emphatique et contrastive, rendue naturellement par « lui-même ».
- source_word: וּתְמִימִים
  choice: mais les hommes intègres
  rationale: תמים désigne ici ceux dont la conduite est entière et irréprochable. « Intègres » convient au contexte sapiential, tandis que « mais » rend le contraste implicite entre les deux destins.
- source_word: יִנְחֲלוּ
  choice: hériteront
  rationale: Le verbe נחל signifie recevoir ou posséder en héritage. « Hériteront » préserve sa nuance forte sans expliquer davantage la nature de l’héritage.
- source_word: טוֹב
  choice: du bien
  rationale: Le substantif est large et non précisé. « Du bien » maintient cette ouverture sans le réduire à la prospérité matérielle ou à une bénédiction particulière.
theological_decisions:
- issue: Image de la conséquence morale dans בִּשְׁחוּתוֹ
  choice: Conserver dans le texte l’image concrète de « sa propre fosse »
  alternative: « sa propre ruine » ou « sa propre destruction »
  rationale: L’image exprime la justice rétributive propre au proverbe sans définir le mode exact du jugement. La conserver évite d’aplatir la formulation en une abstraction.
translation_notes:
  register: Français moderne international, clair et digne. Le parallélisme antithétique est conservé, ainsi que les métaphores de la voie, de la fosse et de l’héritage.
