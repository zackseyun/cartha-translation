id: PRO.28.1
reference: Proverbs 28:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נָ֣סוּ וְ/אֵין רֹדֵ֣ף רָשָׁ֑ע וְ֝/צַדִּיקִ֗ים כִּ/כְפִ֥יר יִבְטָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/001.yaml
  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
translation:
  language: fr
  text: Le méchant s’enfuit sans que personne le poursuive[a], mais les justes ont de l’assurance comme un jeune lion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le méchant s’enfuit bien que personne ne le poursuive… mais les justes sont hardis comme un lion. » L’hébreu permet de légères différences de nuance dans les deux membres; « jeune lion » rend le sens plus précis de כְּפִיר.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוּ
  choice: s’enfuit
  rationale: Le verbe נוס exprime la fuite. Le présent convient à la portée générale et proverbiale de l’énoncé; le singulier français s’accorde avec le sujet générique « le méchant ».
- source_word: וְאֵין רֹדֵף
  choice: sans que personne le poursuive
  rationale: אֵין suivi d’un participe indique l’absence de poursuivant. Cette formulation française naturelle conserve la valeur circonstancielle sans préciser indûment s’il s’agit d’une concession ou d’une simple circonstance.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le terme hébreu est singulier et représente ici un type moral. « Le méchant » garde ce singulier générique sans ajouter de précision absente du texte.
- source_word: וְצַדִּיקִים
  choice: mais les justes
  rationale: L’adjectif pluriel est employé substantivement. « Les justes » restitue naturellement cette catégorie morale et son opposition au méchant.
- source_word: כִּכְפִיר
  choice: comme un jeune lion
  rationale: כְּפִיר désigne plus précisément un jeune lion, et non le lion au sens le plus général. La traduction maintient cette nuance lexicale.
- source_word: יִבְטָח
  choice: ont de l’assurance
  rationale: בטח peut signifier se fier, être en sécurité ou être assuré. Dans la comparaison avec le jeune lion et par contraste avec la fuite, l’expression désigne ici une assurance exempte de crainte; le français emploie naturellement le pluriel avec « les justes ».
theological_decisions:
- issue: Types moraux génériques au singulier et au pluriel
  choice: Conserver « le méchant » au singulier générique et « les justes » au pluriel collectif.
  alternative: Employer « une personne méchante… les personnes justes » ou harmoniser les deux membres au même nombre.
  rationale: Le proverbe oppose des catégories morales, et les nombres différents reflètent la formulation hébraïque sans transformer ces désignations en références à des individus particuliers.
- issue: Nuance de יִבְטָח dans la comparaison
  choice: Traduire par « ont de l’assurance ».
  alternative: « se confient », « sont en sécurité » ou « sont hardis ».
  rationale: Le contexte met en contraste la fuite craintive et l’assurance des justes. La traduction retient cette nuance contextuelle sans faire du verset une affirmation doctrinale plus précise sur l’objet de leur confiance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise pour préserver le parallélisme proverbial; « ont de l’assurance » est courant sans être familier.
