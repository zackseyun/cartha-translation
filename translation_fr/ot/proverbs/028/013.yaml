source:
  edition: WLC
  text: מְכַסֶּ֣ה פְ֭שָׁעָי/ו לֹ֣א יַצְלִ֑יחַ וּ/מוֹדֶ֖ה וְ/עֹזֵ֣ב יְרֻחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/013.yaml
  text: Whoever covers his transgressions will not prosper[b][a], but he who confesses and forsakes them will be shown mercy.
translation:
  language: fr
  text: Celui qui cache[a] ses transgressions ne réussira pas, mais celui qui les avoue et les abandonne obtiendra miséricorde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dissimule » ses transgressions.
    reason: lexical_alternative
  - marker: b
    text: Ou « sera traité avec compassion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: cache
  rationale: Le participe de כסה exprime l’action de couvrir ou de dissimuler. « Cache » est naturel en français et rend clairement le fait de tenir ses fautes secrètes.
- source_word: פְשָׁעָיו
  choice: ses transgressions
  rationale: פשע désigne des actes de transgression, avec une nuance possible de rébellion. « Transgressions » conserve cette force morale sans réduire le terme à des fautes légères.
- source_word: יַצְלִיחַ
  choice: ne réussira pas
  rationale: Le hifil de צלח signifie réussir ou prospérer. « Ne réussira pas » est idiomatique en français moderne et ne limite pas le propos à la prospérité matérielle.
- source_word: וּמוֹדֶה
  choice: les avoue
  rationale: Dans ce contexte, ידה désigne la reconnaissance ou la confession des fautes. « Avoue » exprime directement cette reconnaissance et prend naturellement pour objet les transgressions déjà mentionnées.
- source_word: וְעֹזֵב
  choice: les abandonne
  rationale: עזב signifie laisser ou abandonner. Ici, « abandonne » indique que la confession s’accompagne du renoncement aux transgressions.
- source_word: יְרֻחָם
  choice: recevra compassion
  rationale: La forme passive de רחם indique que la personne devient bénéficiaire de compassion ou de miséricorde. Cette formulation française garde l’agent implicite et demeure naturelle.
- source_word: objet implicite après וּמוֹדֶה וְעֹזֵב
  choice: les
  rationale: L’objet sous-entendu reprend « ses transgressions ». Le pronom « les » explicite cette reprise conformément à l’usage français sans ajouter de nouveau contenu.
- source_word: formes masculines singulières à valeur générique
  choice: Celui qui
  rationale: Le masculin singulier hébreu a ici une portée représentative et générale. « Celui qui » conserve le singulier proverbial et reste naturel en français.
theological_decisions:
- issue: Agent de la compassion laissé implicite
  choice: recevra compassion
  alternative: Dieu lui fera miséricorde
  rationale: Le cadre du proverbe peut laisser entendre que Dieu accorde cette compassion, mais le texte hébreu emploie un passif sans nommer l’agent. La traduction ne l’explicite donc pas.
translation_notes:
  register: Français moderne, clair et digne, avec la concision antithétique d’un proverbe. « Réussira » évite de réduire יצליח à la seule prospérité financière, tandis que « recevra compassion » maintient l’agent non exprimé.
