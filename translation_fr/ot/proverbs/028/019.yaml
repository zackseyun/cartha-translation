source:
  edition: WLC
  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֥ף רֵ֝קִ֗ים יִֽשְׂבַּֽע רִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
translation:
  language: fr
  text: Qui cultive sa terre aura du pain à satiété, mais qui poursuit ce qui est vain[a] sera rassasié de pauvreté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi se comprendre comme « des choses vides » ou désigner des personnes vides, sans valeur ou oisives.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: cultive
  rationale: Dans ce contexte agricole, le participe désigne celui qui travaille la terre. « Cultive » est naturel en français et plus précis ici que le très général « travaille ».
- source_word: אַדְמָתוֹ
  choice: sa terre
  rationale: Le terme désigne le sol ou la terre cultivable; « sa terre » conserve l’image agricole et rend naturellement le suffixe possessif.
- source_word: יִשְׂבַּע לָחֶם
  choice: aura du pain à satiété
  rationale: Cette formulation conserve l’image concrète du pain et exprime l’idée d’une provision abondante, tout en préparant la reprise ironique du verbe « rassasier » dans le second membre.
- source_word: וּמְרַדֵּף
  choice: mais qui poursuit
  rationale: Le waw introduit ici le contraste entre les deux membres du proverbe. « Poursuit » rend l’action continue et délibérée du participe.
- source_word: רֵקִים
  choice: ce qui est vain
  rationale: Le pluriel substantivé signifie littéralement des réalités ou des êtres « vides ». « Ce qui est vain » exprime les occupations futiles sans exclure dans la note l’interprétation personnelle.
- source_word: יִשְׂבַּע רִישׁ
  choice: sera rassasié de pauvreté
  rationale: 'La traduction reprend le vocabulaire de la satiété afin de préserver le parallélisme et l’ironie de l’hébreu: l’un est rassasié de pain, l’autre de pauvreté.'
theological_decisions: []
