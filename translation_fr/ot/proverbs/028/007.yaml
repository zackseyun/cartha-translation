source:
  edition: WLC
  text: נוֹצֵ֣ר תּ֭וֹרָה בֵּ֣ן מֵבִ֑ין וְ/רֹעֶה זֽ֝וֹלְלִ֗ים יַכְלִ֥ים אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
translation:
  language: fr
  text: 'Celui qui observe la loi[a] est un fils avisé,

    mais celui qui fréquente[b] les gloutons[c] fait honte à son père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enseignement ». Le mot hébreu peut désigner une instruction faisant autorité aussi bien que la loi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fait paître » ou « conduit comme un berger » ; l’image est employée ici au sens de fréquenter certaines personnes ou de leur tenir compagnie.
    reason: lexical_alternative
  - marker: c
    text: Le terme peut désigner plus largement des gens qui se livrent aux excès et à la dissipation, des débauchés ou des prodigues.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹצֵר
  choice: observe
  rationale: Le participe exprime l’idée de garder fidèlement ou de mettre en pratique. « Observe » convient naturellement avec « la loi » et conserve le sens d’une obéissance attentive.
- source_word: תּוֹרָה
  choice: la loi
  rationale: Le mot peut désigner la loi ou, plus largement, un enseignement faisant autorité. « La loi » est ici concis et naturel, tandis qu’une note préserve l’autre possibilité.
- source_word: בֵּן מֵבִין
  choice: un fils qui a du discernement
  rationale: Cette formulation garde le masculin singulier explicite de בֵּן et rend le participe מֵבִין par une expression française claire relevant du vocabulaire sapientiel.
- source_word: וְרֹעֶה
  choice: mais celui qui fréquente
  rationale: Le verbe signifie littéralement « faire paître, conduire comme un berger », mais il est employé ici idiomatiquement au sens de fréquenter ou de tenir compagnie. « Fréquente » est naturel en français et convient au parallélisme antithétique.
- source_word: זֹלְלִים
  choice: les gloutons
  rationale: Le terme désigne directement des personnes qui mangent avec excès, tout en pouvant évoquer plus largement des gens dissolus ou prodigues. Le rendu direct est conservé dans le texte, avec l’extension de sens en note.
- source_word: יַכְלִים
  choice: fait honte à
  rationale: La forme causative signifie couvrir quelqu’un de honte ou lui attirer le déshonneur. « Fait honte à » est idiomatique, direct et fidèle.
- source_word: אָבִיו
  choice: son père
  rationale: Rendu direct du nom avec son suffixe possessif masculin singulier.
theological_decisions: []
