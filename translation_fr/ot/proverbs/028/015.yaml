  yaml_path: translation/ot/proverbs/028/015.yaml
  text: Like a roaring lion and a charging bear is a wicked ruler over a poor people[a].
translation:
  language: fr
  text: 'Un lion rugissant et un ours qui se précipite : tel est un mauvais chef sur un peuple pauvre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un ours vorace » ou « un ours qui fonce ». Le participe hébreu évoque une menace agressive et peut souligner soit un mouvement violent, soit une faim prédatrice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי נֹהֵם
  choice: un lion rugissant
  rationale: Cette expression naturelle et évocatrice restitue l’animal et son cri menaçant.
- source_word: דֹב שׁוֹקֵק
  choice: un ours qui fonce
  rationale: Le participe évoque vraisemblablement un mouvement violent et menaçant; cette formulation préserve le dynamisme de l’image sans exclure totalement l’idée d’une agressivité prédatrice.
- source_word: מֹשֵׁל רָשָׁע
  choice: le dirigeant méchant
  rationale: « Dirigeant » désigne naturellement une personne qui exerce le pouvoir, tandis que « méchant » conserve le jugement moral propre au vocabulaire sapientiel.
- source_word: עַל
  choice: qui domine
  rationale: Dans le contexte du gouvernement, la préposition exprime l’exercice d’une autorité sur le peuple; le verbe permet une phrase française fluide et souligne ici le caractère oppressif de ce pouvoir.
- source_word: עַם דָּל
  choice: un peuple pauvre
  rationale: « Peuple » convient à la population gouvernée, et « pauvre » rend le sens principal tout en laissant entendre sa vulnérabilité sociale.
