review_pass:
  verdict: revise
  source_fidelity: 'Le sens de base est bien rendu : la comparaison animale, le gouvernant moralement mauvais et le peuple pauvre correspondent à l’hébreu. Cependant, la reprise de « tel » avant le second membre alourdit inutilement la syntaxe et « qui domine » ajoute une nuance oppressive qui n’est pas explicitement portée par la simple construction « gouvernant sur ».'
  naturalness: '« Un lion rugissant et un ours qui fonce : ainsi est un dirigeant méchant sur un peuple pauvre » est compréhensible, mais peu naturel. Une comparaison nominale directe est plus idiomatique et plus proche de la concision proverbiale.'
  terminology: « Dirigeant » est acceptable, mais « chef mauvais » est plus direct ici et évite que « domine » interprète la relation de gouvernement. « Mauvais » rend naturellement רָשָׁע dans ce portrait proverbial. La note doit conserver l’incertitude de שׁוֹקֵק sans présenter « vorace » comme une traduction certaine.
  issues:
  - severity: medium
    issue: Construction comparative lourde
    rationale: La répétition « Tel ... tel est » est grammaticalement possible, mais elle produit une formulation raide qui ne restitue pas naturellement l’énoncé proverbial concis.
  - severity: low
    issue: Nuance interprétative dans « qui domine »
    rationale: Le participe מֹשֵׁל avec עַל désigne un chef exerçant son autorité sur un peuple. « Dominer » peut suggérer une oppression ajoutée au texte, même si le contexte est négatif.
  - severity: low
    issue: Choix lexical de « méchant »
    rationale: « Méchant » est possible, mais « mauvais » est plus courant dans ce type de caractérisation morale en français moderne et s’accorde mieux avec « chef ».
