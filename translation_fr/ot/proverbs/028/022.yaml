  text: נִֽבֳהָ֥ל לַ/ה֗וֹן אִ֭ישׁ רַ֣ע עָ֑יִן וְ/לֹֽא יֵ֝דַע כִּי חֶ֥סֶר יְבֹאֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/022.yaml
  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
translation:
  language: fr
  text: L’homme avare se précipite vers la richesse[a], sans savoir que la pauvreté viendra sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’homme à l’œil mauvais ». Cette expression hébraïque désigne une personne avare, mesquine ou cupide ; elle peut aussi suggérer l’envie.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֳהָל לַהוֹן
  choice: court après la richesse
  rationale: Le participe nifal de בהל exprime l’empressement ou la précipitation, et לַהוֹן en indique le but. « Court après la richesse » rend naturellement en français cette poursuite avide et irréfléchie.
- source_word: אִישׁ
  choice: L’homme
  rationale: Le nom hébreu est masculin singulier et désigne ici la figure représentative mise en scène par le proverbe.
- source_word: רַע עָיִן
  choice: au regard mauvais
  rationale: L’expression signifie littéralement « mauvais d’œil » et évoque, selon le contexte, l’avidité, l’envie ou l’avarice. Le texte conserve l’image hébraïque sous une forme française intelligible, tandis que la note en précise la portée idiomatique.
- source_word: וְלֹא יֵדַע
  choice: sans savoir
  rationale: Cette formulation naturelle en français conserve le lien entre la poursuite précipitée de la richesse et l’ignorance de son issue.
- source_word: חֶסֶר
  choice: la misère
  rationale: חֶסֶר désigne le manque ou la privation. « Misère » exprime ici concrètement la situation de dénuement qui menace l’homme avide.
- source_word: יְבֹאֶנּוּ
  choice: fondra sur lui
  rationale: Le verbe בוא signifie littéralement « venir ». « Fondra sur lui » restitue avec naturel et vigueur l’idée que le manque l’atteindra soudainement, sans changer l’issue annoncée.
