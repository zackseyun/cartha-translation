revisions:
- from: L’homme au regard mauvais court après la richesse[a], sans savoir que la misère fondra sur lui.
  to: L’homme avare se précipite vers la richesse[a], sans savoir que la pauvreté viendra sur lui.
  rationale: La révision remplace un calque français potentiellement trompeur par « avare », sens contextuellement approprié de l’idiome hébreu, et conserve le littéral ainsi que ses principales nuances en note. Elle rend יְבֹאֶנּוּ sans l’intensification non marquée de « fondra sur lui » et emploie « pauvreté » pour le manque matériel annoncé.
  reviewer_model: gpt-5.6-terra
