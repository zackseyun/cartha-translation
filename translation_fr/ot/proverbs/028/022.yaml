review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : un homme caractérisé par « l’œil mauvais » poursuit la richesse avec précipitation et ignore que le manque l’atteindra. Toutefois, « fondra sur lui » ajoute une idée de soudaineté ou d’attaque qui n’est pas exprimée par יְבֹאֶנּוּ (« viendra à/sur lui »).'
  naturalness: « Au regard mauvais » est grammatical, mais il évoque surtout en français un regard malveillant ou sinistre et ne communique pas naturellement l’idiome hébreu d’avarice ou de mesquinerie. Une traduction sémantique sobre dans le texte, avec le littéral en note, est plus claire en français international moderne.
  terminology: « Avare » convient bien au contexte proverbial et à l’usage de רַע עָיִן dans la littérature sapientielle, sans exclure par la note les nuances de cupidité, d’envie et de mesquinerie. « Pauvreté » rend plus directement חֶסֶר (« manque, dénuement ») que « misère », qui peut être plus intensif.
  issues:
  - severity: medium
    issue: « au regard mauvais » risque de faux sens
    rationale: En français courant, la formule décrit normalement un regard hostile ou inquiétant, non une disposition avare. Le calque littéral ne préserve donc pas efficacement l’idiome source.
  - severity: medium
    issue: « fondra sur lui » intensifie le verbe
    rationale: Le verbe בוא signifie « venir » ; il n’exprime pas en lui-même l’irruption soudaine suggérée par « fondre sur ».
  revised_text: L’homme avare se précipite vers la richesse[a], sans savoir que la pauvreté viendra sur lui.
