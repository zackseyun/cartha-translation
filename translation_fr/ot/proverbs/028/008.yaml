source:
  edition: WLC
  text: מַרְבֶּ֣ה ה֭וֹנ/וֹ בְּ/נֶ֣שֶׁךְ ו/ב/תרבית לְ/חוֹנֵ֖ן דַּלִּ֣ים יִקְבְּצֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/008.yaml
  text: Whoever increases his wealth by interest and profit gathers it for one who is gracious to the poor[a][b].
translation:
  language: fr
  text: Celui qui accroît sa fortune par les intérêts et le profit l’amasse pour celui qui fait preuve de bonté envers les pauvres[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’usure et l’accroissement ». Les deux termes hébreux désignent des gains tirés d’un prêt, souvent avec une nuance d’exploitation.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour celui qui est généreux envers les pauvres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבֶּה
  choice: accroît
  rationale: Le participe hiphil de רבה exprime le fait de rendre plus grand ou plus nombreux. « Accroît » convient naturellement à l’accumulation d’une fortune.
- source_word: הוֹנוֹ
  choice: sa fortune
  rationale: הוֹן désigne les richesses ou les biens. « Fortune » est idiomatique ici et évite de répéter une idée abstraite de richesse.
- source_word: בְּנֶשֶׁךְ
  choice: par les intérêts
  rationale: נֶשֶׁךְ désigne l’intérêt prélevé sur un prêt, avec souvent une connotation abusive. « Intérêts » nomme clairement la pratique économique, tandis que la note conserve la possibilité de « usure ».
- source_word: וּבְתַרְבִּית
  choice: et le profit
  rationale: תַּרְבִּית désigne un accroissement ou gain, notamment un supplément exigé lors d’un prêt. « Profit » le distingue du terme précédent sans restreindre excessivement son sens.
- source_word: לְחוֹנֵן
  choice: pour celui qui fait preuve de bonté
  rationale: חנן signifie accorder faveur ou grâce, agir avec bonté. Cette formulation française est naturelle et conserve la dimension de faveur sans réduire le terme à un simple don matériel.
- source_word: דַּלִּים
  choice: les pauvres
  rationale: דַּל désigne une personne pauvre, faible ou de basse condition. Le contexte économique favorise « les pauvres ».
- source_word: יִקְבְּצֶנּוּ
  choice: l’amasse
  rationale: קבץ signifie rassembler ou recueillir. Le suffixe masculin singulier renvoie à la fortune; « l’amasse » restitue avec concision l’ironie selon laquelle l’accumulateur travaille finalement pour un autre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale reste concise. « Fait preuve de bonté » préserve l’idée de faveur exprimée par חנן, tandis que la note signale la traduction plus concrète « généreux ».
