revisions:
- from: Quand les justes exultent, la gloire est grande ; mais quand les méchants se lèvent, chacun se cache.[a]
  to: Quand les justes se réjouissent, la gloire est grande ; mais quand les méchants s’élèvent, chacun[a] se cache.
  rationale: Révision limitée à une formulation française plus naturelle de l’ascension des méchants et à une note fidèle à l’ambiguïté générique de אדם. Le texte conserve le contraste, le caractère générique du sujet final et le sens contextuel de la dissimulation, sans présenter comme également probables des sens lexicaux qui ne conviennent pas ici.
