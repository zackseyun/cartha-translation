  text: בַּ/עֲלֹ֣ץ צַ֭דִּיקִים רַבָּ֣ה תִפְאָ֑רֶת וּ/בְ/ק֥וּם רְ֝שָׁעִ֗ים יְחֻפַּ֥שׂ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
translation:
  language: fr
  text: Quand les justes se réjouissent, la gloire est grande ; mais quand les méchants s’élèvent, chacun[a] se cache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un singulier générique : « une personne est cachée ». On peut aussi comprendre « les gens se cachent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹץ
  choice: Quand ... exultent
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. « Exulter » exprime la joie manifeste de עלץ dans un registre soutenu mais courant.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: Adjectif substantivé pluriel désignant les personnes qui agissent avec droiture ; « les justes » est idiomatique dans la littérature sapientiale.
- source_word: רַבָּה תִפְאָרֶת
  choice: la gloire est grande
  rationale: 'Cette formulation conserve la prédication hébraïque et laisse à תִפְאָרֶת son éventail de sens : gloire, honneur et splendeur publique.'
- source_word: וּבְקוּם רְשָׁעִים
  choice: mais quand les méchants se lèvent
  rationale: Le ו marque ici le contraste, tandis que ב avec l’infinitif construit est temporel. « Se lèvent » peut évoquer leur accession à une position dominante sans l’expliciter au-delà du texte.
- source_word: יְחֻפַּשׂ
  choice: se cache
  rationale: 'Le pual est rendu idiomatiquement par un pronominal français : sous la domination des méchants, on se dissimule ou se retire de la vue publique. Une note signale la forme passive possible.'
- source_word: אָדָם
  choice: chacun
  rationale: Le singulier générique désigne l’être humain ordinaire ou les gens en général. « Chacun » préserve le singulier distributif dans un français naturel, sans introduire une restriction masculine absente de l’emploi générique.
theological_decisions:
- issue: Portée du singulier générique אָדָם
  choice: chacun
  alternative: l’être humain / les gens / un homme
  rationale: Le contexte décrit l’effet social de l’ascension des méchants sur les personnes ordinaires. « Chacun » garde la force générique et distributive du singulier sans transformer le vers en collectif explicite.
- issue: Sens du pual יְחֻפַּשׂ
  choice: se cache
  alternative: est caché / est recherché
  rationale: Le contexte antithétique favorise l’idée que les personnes disparaissent de l’espace public par crainte. La formulation pronominale est naturelle en français, tandis que la note préserve la valeur passive de la forme hébraïque et l’autre analyse lexicale possible.
translation_notes:
  register: Français international moderne, digne et concis. Le parallélisme antithétique et la métaphore de l’élévation des méchants sont conservés. Le point-virgule marque nettement les deux membres du proverbe.
