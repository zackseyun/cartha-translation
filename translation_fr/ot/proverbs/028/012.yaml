review_pass:
  verdict: revise
  source_fidelity: Le sens général et le parallélisme sont bien rendus. « Chacun se cache » exprime de manière idiomatique le singulier générique אדם et le sens contextuel usuel du pual יְחֻפַּשׂ. Toutefois, « se lèvent » est un peu trop littéral et peu naturel dans ce contexte d’ascension ou de prédominance des méchants; « s’élèvent » conserve l’image sans expliciter indûment une prise de pouvoir.
  naturalness: Le français est clair et de registre proverbial approprié. « Exultent » est acceptable, mais « se réjouissent » est plus courant en français international moderne tout en conservant le sens de joie manifeste. Le déplacement de l’appel de note sur « chacun » rend son objet précis.
  terminology: « Justes », « méchants » et « gloire » conviennent au registre sapientiel. La note actuelle introduit inutilement « est recherché » / « est fouillé », analyse lexicale qui ne correspond pas au sens contextuel retenu et risque de troubler le lecteur. Elle doit plutôt expliciter la valeur générique de אדם, conformément à l’audit anglais.
  issues:
  - severity: medium
    issue: Note lexicale sur יְחֻפַּשׂ trop spéculative et insuffisamment ciblée
    rationale: La note actuelle donne « est recherché » ou « est fouillé » comme lectures possibles, alors que, dans ce proverbe, le contexte favorise nettement l’idée de dissimulation. L’audit anglais réserve la note à l’alternative de אדם (« une personne » / « les gens »).
  - severity: low
    issue: « Se lèvent » est peu idiomatique dans le contexte
    rationale: Le français peut comprendre une simple action physique. « S’élèvent » maintient l’imagerie de קום et suggère naturellement une montée en puissance sans imposer une paraphrase politique.
  revised_text: Quand les justes se réjouissent, la gloire est grande ; mais quand les méchants s’élèvent, chacun[a] se cache.
