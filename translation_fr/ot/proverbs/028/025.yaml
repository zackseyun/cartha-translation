source:
  edition: WLC
  text: רְחַב נֶ֭פֶשׁ יְגָרֶ֣ה מָד֑וֹן וּ/בוֹטֵ֖חַ עַל יְהוָ֣ה יְדֻשָּֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
translation:
  language: fr
  text: 'La personne avide[a] attise les querelles,

    mais celle qui met sa confiance en Yahweh sera comblée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « large d’âme » ; cette expression peut désigner une personne aux désirs insatiables. Autre traduction possible : « la personne orgueilleuse » ou « celle qui a un grand appétit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sera engraissée », image hébraïque évoquant l’abondance, le bien-être ou l’épanouissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  choice: la personne avide
  rationale: L’expression signifie littéralement « large d’âme » et décrit ici un désir insatiable ou avide. « La personne avide » en restitue naturellement la portée morale en français moderne.
- source_word: יְגָרֶה
  choice: attise
  rationale: La forme causative exprime l’action de provoquer ou d’alimenter un conflit. « Attise » convient au style bref et imagé du proverbe.
- source_word: מָדוֹן
  choice: les querelles
  rationale: Ce terme sapientiel désigne les disputes et les conflits interpersonnels. Le pluriel générique est idiomatique en français.
- source_word: וּבֹטֵחַ
  choice: mais celle qui met sa confiance
  rationale: Dans ce parallélisme antithétique, la conjonction a une valeur adversative. La tournure conserve la valeur descriptive du participe hébreu.
- source_word: עַל יְהוָה
  choice: en Yahweh
  rationale: Avec « mettre sa confiance », le français demande naturellement « en ». Le nom divin est translittéré « Yahweh ».
- source_word: יְדֻשָּׁן
  choice: sera comblée
  rationale: Le passif signifie littéralement « sera engraissé » et évoque figurativement l’abondance, le bien-être et l’épanouissement. « Sera comblée » conserve le passif sans produire une image trompeuse en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de la promesse יְדֻשָּׁן
  choice: sera comblée
  alternative: prospérera
  rationale: Ce choix exprime l’abondance et le bien-être suggérés par l’image hébraïque sans limiter nécessairement la promesse à la richesse matérielle.
- issue: Sujet masculin singulier à valeur représentative
  choice: la personne… celle qui
  alternative: l’homme… celui qui
  rationale: Le masculin hébreu est générique dans cette maxime. En français actuel, « la personne » conserve cette portée universelle sans modifier le sens.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, ainsi que le passif du second membre. Les notes signalent les deux images hébraïques difficiles sans les surcharger dans le texte principal.
