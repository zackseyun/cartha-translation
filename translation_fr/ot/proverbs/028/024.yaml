source:
  edition: WLC
  text: גּוֹזֵ֤ל אָ֘בִ֤י/ו וְ/אִמּ֗/וֹ וְ/אֹמֵ֥ר אֵֽין פָּ֑שַׁע חָבֵ֥ר ה֝֗וּא לְ/אִ֣ישׁ מַשְׁחִֽית׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
translation:
  language: fr
  text: 'Celui qui dépouille son père et sa mère et dit : « Ce n’est pas une transgression », est le compagnon d’un homme qui détruit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est l’associé d’un destructeur » ; autre traduction possible : « est le compagnon de celui qui cause la ruine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹזֵל
  choice: dépouille
  rationale: Le participe qal de גזל désigne une prise injuste, souvent violente. « Dépouille » en exprime la gravité plus nettement que « vole », sans imposer un cadre juridique précis.
- source_word: אָבִיו וְאִמּוֹ
  choice: son père et sa mère
  rationale: L’hébreu nomme séparément les deux parents; la traduction conserve cette forme et son effet rhétorique.
- source_word: וְאֹמֵר
  choice: et dit
  rationale: Cette coordination simple reproduit naturellement la conjonction suivie du participe hébreu.
- source_word: אֵין פָּשַׁע
  choice: Ce n’est pas une transgression
  rationale: פָּשַׁע peut désigner une transgression, une rébellion ou une faute. « Transgression » maintient la portée morale du terme sans la réduire à une infraction strictement juridique.
- source_word: חָבֵר
  choice: le compagnon
  rationale: חָבֵר désigne une personne liée ou associée à une autre. « Compagnon » exprime ici une solidarité morale sans suggérer nécessairement une relation affective.
- source_word: לְאִישׁ מַשְׁחִית
  choice: d’un homme qui détruit
  rationale: Le participe hiphil מַשְׁחִית désigne celui qui détruit ou cause la ruine, tandis que אִישׁ est rendu explicitement par « homme ». La tournure française exprime naturellement la relation marquée par לְ après חָבֵר.
- source_word: הוּא
  choice: est
  rationale: Le pronom sert à structurer la proposition nominale; en français, sa fonction copulative est naturellement rendue par « est » sans reprise pronominale.
theological_decisions: []
