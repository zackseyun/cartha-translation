  text: בְּ/פֶ֣שַֽׁע אֶ֭רֶץ רַבִּ֣ים שָׂרֶ֑י/הָ וּ/בְ/אָדָ֥ם מֵבִ֥ין יֹ֝דֵ֗עַ כֵּ֣ן יַאֲרִֽיךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/002.yaml
  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
translation:
  language: fr
  text: À cause de la rébellion d’un pays, ses dirigeants sont nombreux ; mais grâce à une personne qui comprend et qui sait[b], la stabilité perdure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu du second membre est difficile et elliptique. De façon plus proche de sa syntaxe : « mais avec/par une personne qui comprend et sait, ainsi il prolongera ». Le sujet et le complément de « prolongera » ne sont pas exprimés. La traduction comprend le propos comme l’idée qu’un discernement éclairé fait durer un ordre stable.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « personne » est adam, un terme singulier générique qui désigne ici de manière représentative un être humain, probablement un dirigeant ou un conseiller avisé.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: À cause de la révolte
  rationale: La préposition בְּ est comprise dans un sens causal. « Révolte » conserve ici la portée morale, juridique et politique de פֶּשַׁע, sans réduire le terme à une simple faute.
- source_word: אֶרֶץ
  choice: d’un pays
  rationale: Dans ce proverbe politique, אֶרֶץ désigne un territoire organisé ou une nation. L’article indéfini convient à la portée générale de la maxime.
- source_word: רַבִּים שָׂרֶיהָ
  choice: ses dirigeants sont nombreux
  rationale: שָׂרִים peut désigner des princes, des chefs ou des gouvernants. « Dirigeants » est actuel et assez large ; le français conserve l’énoncé littéral sans préciser s’il s’agit d’une multiplication simultanée ou de changements fréquents de pouvoir.
- source_word: וּבְאָדָם
  choice: mais grâce à une personne
  rationale: Le וְ marque ici le contraste entre les deux membres. בְּ indique le moyen ou l’agent. אָדָם est un singulier générique ; « une personne » en exprime naturellement la portée représentative en français moderne.
- source_word: מֵבִין יֹדֵעַ
  choice: qui comprend et qui sait
  rationale: 'Les deux participes sont rendus séparément afin de préserver la double caractérisation hébraïque : discernement et connaissance.'
- source_word: כֵּן
  choice: la stabilité
  rationale: Le mot signifie ordinairement « ainsi », mais, dans cette formulation difficile, il peut renvoyer à ce qui est bien établi ou ordonné. « La stabilité » explicite cette lecture tout en la signalant dans une note.
- source_word: יַאֲרִיךְ
  choice: perdure
  rationale: Le hifil de ארך exprime l’idée de prolonger ou de faire durer. « Perdure » donne en français une formulation concise et proverbiale de la durée prolongée de l’ordre politique.
theological_decisions:
- issue: Sujet ou complément implicite de יַאֲרִיךְ dans le second membre
  choice: Comprendre כֵּן comme l’ordre stable qui se prolonge grâce à la personne avisée
  alternative: 'Traduire plus formellement : « mais avec une personne qui comprend et qui sait, ainsi il prolongera » ou « cela durera longtemps »'
  rationale: L’hébreu du second membre est elliptique et difficile. La traduction retenue communique le contraste probable avec l’instabilité du premier membre, tandis que la note conserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique est conservé ; le point-virgule marque l’opposition. La formulation évite de transformer en certitude les détails politiques que l’hébreu laisse implicites.
