  rationale: La traduction principale conserve l'interprétation contextuellement plausible d'une stabilité politique prolongée, sans la présenter comme la seule analyse possible. La note est corrigée pour préserver l'ellipse et la valeur causative du verbe hébreu, tout en expliquant sobrement la lecture retenue.
