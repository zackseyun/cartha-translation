  text: בְּ/ק֣וּם רְ֭שָׁעִים יִסָּתֵ֣ר אָדָ֑ם וּ֝/בְ/אָבְדָ֗/ם יִרְבּ֥וּ צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
translation:
  language: fr
  text: Quand les méchants s’élèvent, chacun se cache[a] ; mais quand ils périssent, les justes deviennent nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « est caché » ; le verbe hébreu peut être compris au passif ou dans un sens réfléchi : « se cache ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: quand … s’élèvent
  rationale: La préposition ב avec l’infinitif construit de קום forme ici une proposition temporelle. « Quand … s’élèvent » conserve aussi l’idée d’une montée en puissance.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé au pluriel désigne les personnes caractérisées par la méchanceté, sans qu’il soit nécessaire d’ajouter une précision de genre.
- source_word: יִסָּתֵר
  choice: se cache
  rationale: Le nifal de סתר peut avoir un sens passif ou moyen-réfléchi. Dans ce contexte, « se cache » exprime naturellement le sens probable tout en signalant l’autre lecture en note.
- source_word: אָדָם
  choice: chacun
  rationale: אָדָם désigne ici l’être humain de manière générique et représentative. « Chacun » rend ce caractère général en français courant sans introduire une restriction masculine.
- source_word: וּבְאָבְדָם
  choice: mais quand ils disparaissent
  rationale: La conjonction et ב avec l’infinitif construit muni du suffixe pluriel forment une proposition temporelle. « Mais » fait ressortir le parallélisme antithétique ; « disparaissent » conserve la possibilité d’une disparition sans imposer nécessairement la mort.
- source_word: יִרְבּוּ
  choice: deviennent nombreux
  rationale: רבה indique ici que les justes augmentent en nombre ou deviennent plus présents. « Deviennent nombreux » est plus explicite que le seul verbe « augmentent », qui serait moins naturel pour des personnes.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif substantivé désigne ceux qui se caractérisent par la justice. « Les justes » est une formulation concise et traditionnelle, encore naturelle en français biblique moderne.
theological_decisions:
- issue: Nature de la disparition des méchants
  choice: disparaissent
  alternative: périssent
  rationale: Le verbe אבד peut exprimer le fait de périr, mais aussi de disparaître ou de ne plus être présent. Le choix retenu évite de préciser sans nécessité qu’il s’agit de leur mort.
- issue: Sens de l’augmentation des justes
  choice: deviennent nombreux
  alternative: se multiplient / augmentent
  rationale: Le texte peut évoquer une croissance numérique ou une présence publique accrue. La traduction conserve cette tension sans expliquer le mécanisme.
translation_notes:
  register: Français moderne, international et proverbial, avec une syntaxe brève et antithétique. « Chacun » rend la portée générique de אָדָם ; le point-virgule met en valeur les deux situations opposées.
