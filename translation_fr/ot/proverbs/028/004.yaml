language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
translation:
  language: fr
  text: Ceux qui abandonnent l’instruction[a] font l’éloge du méchant, mais ceux qui la respectent s’opposent à eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi » ou « l’enseignement ». Dans les écrits de sagesse, le mot hébreu peut désigner une instruction morale faisant autorité.
    reason: lexical_alternative
  - marker: b
    text: Ou « les affrontent » ou « entrent en conflit avec eux ». Le verbe hébreu exprime une opposition active.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי
  choice: ceux qui abandonnent
  rationale: Le participe qal pluriel décrit des personnes caractérisées par l’abandon. « Abandonnent » exprime clairement la rupture volontaire et conserve la portée morale du proverbe.
- source_word: תּוֹרָה
  choice: l’instruction
  rationale: Dans le cadre sapientiel des Proverbes, תּוֹרָה désigne couramment un enseignement moral faisant autorité. « Instruction » préserve cette ampleur sans réduire nécessairement le terme à une législation.
- source_word: יְהַלְלוּ
  choice: font l’éloge de
  rationale: Le piel de הלל signifie louer ou vanter. « Font l’éloge de » est naturel en français et souligne l’approbation paradoxale accordée au méchant.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé singulier a ici une valeur représentative ou générique. Le singulier français conserve la forme concise de l’hébreu.
- source_word: שֹׁמְרֵי
  choice: ceux qui la respectent
  rationale: Le participe qal de שמר peut signifier garder, observer ou respecter. Avec « instruction », « la respectent » exprime naturellement l’obéissance concrète sans suggérer une simple conservation matérielle.
- source_word: יִתְגָּרוּ
  choice: s’opposent
  rationale: Le hitpael de גרה exprime ici une action hostile ou une confrontation. « S’opposent » rend clairement cette orientation tout en évitant d’impliquer nécessairement une lutte physique.
- source_word: בָם
  choice: à eux
  rationale: Avec le verbe choisi, la préposition ב marque les personnes contre lesquelles l’opposition est dirigée. Le pronom pluriel conserve le changement compact de nombre présent en hébreu.
theological_decisions:
- issue: Référent du pronom pluriel בָם (« eux »)
  choice: Conserver « eux » sans préciser explicitement son antécédent.
  alternative: Expliciter « aux méchants » ou comprendre le pronom comme visant précisément ceux qui abandonnent l’instruction.
  rationale: L’hébreu passe du singulier représentatif « le méchant » à un pronom pluriel. Celui-ci peut viser la catégorie des méchants, ceux qui abandonnent l’instruction, ou l’ensemble évoqué par le premier membre. La traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, ainsi que le passage du singulier représentatif « le méchant » au pluriel « eux ».
