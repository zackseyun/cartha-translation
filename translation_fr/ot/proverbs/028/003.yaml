  text: גֶּ֣בֶר רָ֭שׁ וְ/עֹשֵׁ֣ק דַּלִּ֑ים מָטָ֥ר סֹ֝חֵ֗ף וְ/אֵ֣ין לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/003.yaml
  text: A poor man who oppresses the lowly is like a sweeping rain that leaves no food[a].
translation:
  language: fr
  text: Un homme pauvre qui opprime les faibles est comme une pluie torrentielle qui ne laisse aucune nourriture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’y a pas de pain ». Ici, le « pain » représente probablement la nourriture ou les ressources nécessaires à la subsistance en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: un homme
  rationale: Le nom désigne ici un individu masculin pris comme figure représentative dans le proverbe; « un homme » conserve cette précision.
- source_word: רָשׁ
  choice: pauvre
  rationale: Le terme désigne une personne démunie; « pauvre » est direct et naturel dans ce contexte.
- source_word: עֹשֵׁק
  choice: qui opprime
  rationale: Le participe exprime une action d’exploitation ou d’oppression; cette tournure en restitue clairement la valeur active.
- source_word: דַּלִּים
  choice: les faibles
  rationale: Le mot peut évoquer la faiblesse, l’abaissement social ou la pauvreté. « Les faibles » maintient une distinction avec רָשׁ, déjà rendu par « pauvre », sans exclure la vulnérabilité économique.
- source_word: מָטָר סֹחֵף
  choice: une pluie torrentielle
  rationale: L’expression décrit une pluie qui emporte ou ravage. « Pluie torrentielle » rend naturellement en français sa force destructrice.
- source_word: וְאֵין לָחֶם
  choice: qui ne laisse aucune nourriture
  rationale: Littéralement, « et il n’y a pas de pain ». Dans l’image proverbiale, le pain représente vraisemblablement la nourriture ou les ressources de subsistance en général; la note conserve le sens littéral.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le contraste frappant entre un pauvre et les faibles qu’il opprime, ainsi que l’image d’une pluie destructrice qui anéantit les moyens de subsistance.
