source:
  edition: WLC
  text: אָ֭דָם עָשֻׁ֣ק בְּ/דַם נָפֶשׁ עַד בּ֥וֹר יָ֝נ֗וּס אַל יִתְמְכוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
translation:
  language: fr
  text: Un homme accablé par le sang versé d’une personne fuira jusqu’à la fosse[a] ; que personne ne lui vienne en aide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à la tombe ». L’hébreu dit « la fosse », terme qui peut évoquer une issue mortelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Un homme
  rationale: Le singulier désigne ici un individu concret. « Un homme » conserve cette forme représentative et convient au contexte.
- source_word: עָשֻׁק
  choice: accablé
  rationale: Le terme peut signifier « opprimé », mais, associé au sang d’une vie, il évoque ici le poids qui pèse sur l’auteur d’un homicide. « Accablé » préserve cette image sans remplacer entièrement l’expression par le terme interprétatif « meurtrier ».
- source_word: בְּדַם נָפֶשׁ
  choice: par le sang versé d’une vie
  rationale: Littéralement, l’expression associe « sang » et « vie/personne » et renvoie à la culpabilité liée à une vie ôtée. L’ajout de « versé » rend l’idiome intelligible en français tout en gardant son image concrète.
- source_word: עַד בּוֹר
  choice: jusqu’à la fosse
  rationale: בּוֹר désigne une fosse, une citerne ou parfois, par extension, la tombe et une issue mortelle. « La fosse » conserve l’image et son ambiguïté.
- source_word: יָנוּס
  choice: fuira
  rationale: Le verbe exprime la fuite. Le futur français rend naturellement l’imparfait hébreu dans cette maxime.
- source_word: אַל יִתְמְכוּ בוֹ
  choice: que personne ne lui vienne en aide
  rationale: Le jussif pluriel vise des personnes non précisées et interdit de soutenir ou secourir cet homme. Cette formulation est naturelle en français et maintient la portée générale de l’interdiction.
theological_decisions:
- issue: Nature du « sang d’une vie »
  choice: Conserver dans le texte l’image du sang versé tout en signalant qu’elle implique la culpabilité pour une vie ôtée.
  alternative: Traduire directement par « coupable de meurtre » ou « chargé du crime de sang ».
  rationale: L’hébreu décrit la situation par une image concrète et ne nomme pas explicitement une qualification juridique précise. La formulation choisie maintient la tension entre image et implication morale.
- issue: Sens de la fosse
  choice: Employer « la fosse » sans identifier explicitement celle-ci à la tombe.
  alternative: Traduire « jusqu’à la tombe ».
  rationale: Le mot hébreu permet une lecture concrète ou une évocation de la mort. La traduction ne tranche pas au-delà du texte.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Accablé » et « la fosse » gardent les images hébraïques, tandis que « le sang versé d’une vie » explicite juste assez l’idiome pour le rendre compréhensible. Le marqueur [a] figure immédiatement après le terme concerné.
