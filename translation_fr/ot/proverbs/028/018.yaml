  text: הוֹלֵ֣ךְ תָּ֭מִים יִוָּשֵׁ֑עַ וְ/נֶעְקַ֥שׁ דְּ֝רָכַ֗יִם יִפּ֥וֹל בְּ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/018.yaml
  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
translation:
  language: fr
  text: Qui marche dans l’intégrité sera délivré[a], mais celui dont les voies sont tortueuses tombera soudain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera sauvé » ou « sera gardé en sécurité ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans une [seule] ». L’expression peut signifier « d’un seul coup » ou, éventuellement, « dans l’une [de ses voies] ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: marche
  rationale: Dans la littérature de sagesse, הלך évoque la manière de vivre. « Marche » conserve cette image, naturelle en français biblique courant.
- source_word: תָּמִים
  choice: dans l’intégrité
  rationale: תמים exprime ici la droiture et la cohérence morale, sans nécessairement suggérer une perfection absolue.
- source_word: יִוָּשֵׁעַ
  choice: sera délivré
  rationale: Le niphal de ישׁע désigne ici vraisemblablement la délivrance ou la préservation dans le cadre général de la sagesse. « Sera délivré » maintient le passif sans restreindre le propos à un sens doctrinal précis.
- source_word: נֶעְקַשׁ
  choice: tortueuses
  rationale: Le terme évoque ce qui est tordu ou moralement dévoyé. En français, l’adjectif appliqué aux « voies » restitue clairement cette image.
- source_word: דְּרָכַיִם
  choice: voies
  rationale: « Voies » préserve la métaphore hébraïque de la conduite et permet de rendre naturellement l’idée d’une personne dont le comportement est tortueux.
- source_word: יִפּוֹל
  choice: tombera
  rationale: La traduction littérale conserve l’image concrète de la chute, qui peut aussi évoquer la ruine dans ce contexte sapiential.
- source_word: בְּאֶחָת
  choice: soudain
  rationale: L’expression signifie littéralement « dans une » et son sens précis est discuté. « Soudain » rend l’interprétation adverbiale probable, tandis que la note conserve l’ambiguïté de l’hébreu.
theological_decisions:
- issue: Portée de יִוָּשֵׁעַ dans un proverbe de sagesse
  choice: délivrance générale ou concrète
  alternative: salut au sens théologique plus spécialisé
  rationale: Le contexte promet la préservation ou la délivrance de la personne intègre sans préciser la nature exacte de cette délivrance. La formulation retenue n’impose donc pas une lecture sotériologique particulière.
- issue: Caractère proverbial de la promesse
  choice: conserver le futur catégorique du texte
  alternative: atténuer en « peut être délivré »
  rationale: L’hébreu formule une maxime générale avec assurance. La traduction maintient cette force sans ajouter d’exceptions ou de qualifications absentes du verset.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure antithétique ainsi que les images de la marche, des voies et de la chute sont conservées. La seconde proposition est reformulée avec « dont les voies sont tortueuses » pour être idiomatique en français tout en respectant l’image hébraïque.
