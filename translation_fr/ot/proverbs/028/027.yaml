  text: נוֹתֵ֣ן לָ֭/רָשׁ אֵ֣ין מַחְס֑וֹר וּ/מַעְלִ֥ים עֵ֝ינָ֗י/ו רַב מְאֵרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
translation:
  language: fr
  text: 'Qui donne au pauvre ne manquera de rien,

    mais qui détourne les yeux[a] aura beaucoup de malédictions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cache ses yeux » ; expression désignant celui qui refuse délibérément de voir la détresse du pauvre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Qui donne
  rationale: Le participe qal a ici une valeur générale et proverbiale. « Qui donne » restitue naturellement cette portée en français.
- source_word: לָרָשׁ
  choice: au pauvre
  rationale: רָשׁ désigne une personne pauvre ou démunie. Le singulier « au pauvre » conserve la forme générique de l’hébreu.
- source_word: אֵין מַחְסוֹר
  choice: ne manquera de rien
  rationale: La proposition nominale négative exprime l’absence de manque. Cette formulation française claire conserve la promesse proverbiale sans préciser indûment la nature des biens concernés.
- source_word: וּמַעְלִים עֵינָיו
  choice: mais qui détourne les yeux
  rationale: Le participe hiphil de עלם associé aux yeux évoque le fait de refuser délibérément de voir la misère et d’y répondre. « Détourner les yeux » est une expression française naturelle qui garde l’image.
- source_word: רַב מְאֵרוֹת
  choice: sera accablé de malédictions
  rationale: La proposition hébraïque est sans verbe et signifie littéralement « nombreuses malédictions ». « Sera accablé de malédictions » exprime idiomatiquement en français l’abondance et la conséquence, sans identifier explicitement l’auteur des malédictions.
theological_decisions:
- issue: Origine et portée des malédictions
  choice: Ne pas préciser qui prononce ou inflige les malédictions
  alternative: « recevra de nombreuses malédictions » ou « aura de nombreuses malédictions »
  rationale: L’hébreu ne nomme ni leur auteur ni leur mécanisme. La traduction préserve cette indétermination et la tension propre au proverbe.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé, avec une formulation fluide et digne.
