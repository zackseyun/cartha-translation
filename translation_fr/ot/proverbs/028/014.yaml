  text: אַשְׁרֵ֣י אָ֭דָם מְפַחֵ֣ד תָּמִ֑יד וּ/מַקְשֶׁ֥ה לִ֝בּ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/014.yaml
  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
translation:
  language: fr
  text: Heureux l’homme qui est toujours dans la crainte[a] ! Mais celui qui endurcit son cœur tombera dans le malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui craint continuellement ». L’hébreu ne précise pas l’objet de sa crainte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le mal » ou « dans la détresse ». Le mot hébreu peut désigner le mal moral, le tort, l’épreuve ou le malheur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule de béatitude décrit une condition enviable. « Heureux » est naturel, digne et bien établi dans la littérature sapientielle française.
- source_word: אָדָם
  choice: l’homme
  rationale: Le singulier masculin a ici une portée générique et proverbiale ; « l’homme » conserve cette forme représentative sans alourdir la phrase.
- source_word: מְפַחֵד תָּמִיד
  choice: qui tremble sans cesse
  rationale: Le participe de פחד exprime la peur ou l’effroi, tandis que תָּמִיד marque la continuité. « Tremble » maintient la force du terme sans lui attribuer un objet absent de l’hébreu.
- source_word: וּמַקְשֶׁה לִבּוֹ
  choice: Mais celui qui endurcit son cœur
  rationale: Le hifil de קשה signifie rendre dur, endurcir. L’expression française conserve clairement l’idée d’obstination morale et volitive.
- source_word: יִפּוֹל
  choice: tombera
  rationale: L’imparfait hébreu exprime ici la conséquence générale annoncée par le proverbe ; le futur français convient naturellement.
- source_word: בְּרָעָה
  choice: dans le malheur
  rationale: רָעָה peut désigner le mal, le tort, la détresse ou le malheur. Dans ce contexte de conséquence désastreuse, « dans le malheur » est idiomatique tout en gardant l’amplitude du terme.
theological_decisions:
- issue: Objet et nature de la crainte recommandée
  choice: 'Conserver la crainte sans lui donner d’objet explicite : « qui tremble sans cesse »'
  alternative: « qui craint constamment le Seigneur » ou « qui reste toujours prudent »
  rationale: L’hébreu ne précise pas l’objet de la crainte. Ajouter le Seigneur résoudrait une ambiguïté réelle, tandis que « prudent » affaiblirait la valeur lexicale de פחד. Le texte garde ainsi sa tension entre crainte révérencielle, vigilance morale et conscience du danger.
translation_notes:
  register: Français international moderne, proverbial et digne. Le parallélisme antithétique est conservé, ainsi que l’ambiguïté de la crainte sans objet explicite et la gamme sémantique de רָעָה.
