id: PRO.28.5
reference: Proverbs 28:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
translation:
  language: fr
  text: 'Les hommes mauvais ne comprennent pas la justice,

    mais ceux qui cherchent Yahweh comprennent tout.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « comprennent tout » évoque un vaste discernement moral, particulièrement en matière de justice, et non une connaissance illimitée de toutes choses.
    reason: Précision sur la portée proverbiale de כֹל.
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  choice: Les hommes mauvais
  rationale: Le groupe construit signifie littéralement « hommes de mal ». Cette formulation conserve la forme masculine générique de l’hébreu tout en restant claire en français.
- source_word: יָבִינוּ
  choice: comprennent
  rationale: Le verbe בין exprime ici la compréhension ou le discernement. « Comprennent » convient aux deux membres du parallélisme et en maintient l’unité lexicale.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans la littérature de sagesse, מִשְׁפָּט désigne souvent la justice ou l’ordre juste, et non seulement un jugement juridique. « La justice » correspond au contraste moral du verset.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: ceux qui cherchent Yahweh
  rationale: Le participe désigne des personnes caractérisées par une recherche continue de Yahweh. Cette tournure est naturelle et préserve le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui préserve le nom personnel plutôt que de lui substituer un titre.
- source_word: כֹל
  choice: tout
  rationale: L’absolu כֹל se rend naturellement par « tout ». Le contexte proverbial lui donne la portée d’un discernement moral très étendu sans effacer la force générale de l’hébreu.
theological_decisions:
- issue: Portée de « comprennent tout »
  choice: Conserver l’énoncé proverbial général tout en signalant qu’il concerne un vaste discernement moral.
  alternative: Y voir l’affirmation d’une connaissance littéralement illimitée de toutes choses.
  rationale: Le parallélisme oppose l’incapacité des hommes mauvais à comprendre la justice au discernement de ceux qui cherchent Yahweh. La traduction maintient le « tout » de l’hébreu sans transformer ce proverbe en affirmation d’omniscience humaine.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé, ainsi que la répétition de « comprennent » et la force générale de « tout ».
