id: PRO.10.32
reference: Proverbs 10:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יֵדְע֣וּ/ן רָצ֑וֹן וּ/פִ֥י רְ֝שָׁעִ֗ים תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: fr
  text: Les lèvres du juste savent ce qui est agréable[a], mais la bouche des méchants profère des paroles perverses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui plaît », « ce qui convient » ou « la faveur ». Le nom hébreu peut désigner la faveur, le bon vouloir ou ce qui est jugé agréable et acceptable.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « mais la bouche des méchants — des perversités », sans verbe exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: les lèvres de
  rationale: L’expression concrète est naturelle en français biblique moderne et maintient le parallélisme poétique avec « la bouche ».
- source_word: צַדִּיק
  choice: du juste
  rationale: Le singulier hébreu a une valeur générique. « Le juste » conserve cette forme représentative sans alourdir la phrase.
- source_word: יֵדְעוּן
  choice: savent
  rationale: Le verbe signifie fondamentalement « savoir, connaître ». Le contexte implique le discernement dans la parole, mais la traduction préserve le noyau lexical.
- source_word: רָצוֹן
  choice: ce qui est agréable
  rationale: Le nom peut désigner la faveur, le bon vouloir ou ce qui plaît et convient. Ici, « ce qui est agréable » s’intègre naturellement comme objet du verbe « savoir » sans limiter le sens à la faveur divine.
- source_word: וּפִי
  choice: mais la bouche de
  rationale: La conjonction exprime ici le contraste, tandis que « bouche » conserve l’image concrète en parallèle avec « lèvres ».
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Ce pluriel désigne collectivement les personnes moralement mauvaises; « les méchants » est la formulation traditionnelle, concise et intelligible.
- source_word: תַּהְפֻּכוֹת
  choice: profère des paroles perverses
  rationale: Le nom pluriel évoque des choses tortueuses ou perverses, particulièrement dans la parole. Un verbe est ajouté pour former en français une proposition naturelle, et le pluriel est rendu par « des paroles perverses ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme concret « lèvres / bouche » est conservé; le verbe du second membre est explicité pour la clarté, avec une note signalant l’ellipse hébraïque.
