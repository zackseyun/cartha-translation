  register: Français international moderne, clair et digne. Le parallélisme antithétique est conservé, ainsi que l’image concrète des lèvres. « Nourrissent » maintient la métaphore pastorale sous une forme naturelle ; les notes signalent les deux principales expressions hébraïques dont la portée dépasse une traduction unique.
