  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: fr
  text: Les lèvres du juste nourrissent beaucoup de gens[a], mais les insensés meurent faute de discernement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nourrissent beaucoup » ; le verbe hébreu peut aussi évoquer l’action de faire paître ou de conduire un troupeau. Avec « lèvres » pour sujet, l’image est métaphorique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par manque de cœur » ; en hébreu, le cœur peut désigner l’intelligence, le jugement ou le discernement.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: les lèvres de
  rationale: Le sens littéral conserve l’image hébraïque des lèvres employées comme métonymie de la parole, tout en restant naturel en français.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé désigne ici de façon générique la personne juste. Le singulier français correspond à la forme hébraïque et convient au style sapiential.
- source_word: יִרְעוּ
  choice: nourrissent
  rationale: Le verbe רעה peut signifier faire paître, conduire comme un berger ou nourrir. Avec « lèvres » pour sujet, « nourrissent » restitue clairement la métaphore d’une parole qui soutient les autres sans l’aplatir.
- source_word: רַבִּים
  choice: beaucoup de gens
  rationale: Le substantif implicite renvoie à de nombreuses personnes. L’explicitation par « gens » rend la phrase idiomatique et immédiatement claire en français.
- source_word: אֱוִילִים
  choice: les insensés
  rationale: Ce terme sapiential désigne des personnes moralement obtuses et réfractaires à la sagesse, et non de simples personnes peu intelligentes. « Insensés » garde cette portée.
- source_word: בַּחֲסַר לֵב
  choice: faute de discernement
  rationale: L’expression signifie littéralement « par manque de cœur », le cœur étant en hébreu le siège de l’intelligence pratique et du jugement. « Discernement » exprime naturellement cette valeur.
- source_word: יָמוּתוּ
  choice: meurent
  rationale: Le verbe signifie directement « mourir ». Le présent convient à la portée générale d’un proverbe et évite d’atténuer le propos en simple « ruine ».
theological_decisions: []
