id: PRO.10.27
reference: Proverbs 10:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: fr
  text: La crainte de Yahweh ajoute des jours[a], mais les années des méchants seront abrégées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prolonge les jours ». Le verbe hébreu signifie littéralement « ajoute » et a « jours » pour complément.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: la crainte de
  rationale: Le nom à l’état construit désigne ici la crainte révérencielle envers Dieu. « La crainte de » conserve l’expression hébraïque et son poids théologique sans la réduire au simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: תּוֹסִיף
  choice: ajoute
  rationale: Le hifil de יסף signifie littéralement « ajouter » ou « augmenter ». « Ajoute » maintient l’image concrète avec « des jours »; le sens contextuel « prolonge » est signalé en note.
- source_word: יָמִים
  choice: des jours
  rationale: Le terme hébreu signifie littéralement « jours ». Ce choix conserve le parallélisme concret avec « les années » dans le second membre.
- source_word: וּ/שְׁנוֹת
  choice: mais les années
  rationale: Bien que la conjonction soit formellement « et », le parallélisme antithétique lui donne ici une valeur contrastive que « mais » rend naturellement en français.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Terme courant de la littérature sapientielle pour les personnes moralement mauvaises; « les méchants » est concis et conserve la portée représentative du pluriel.
- source_word: תִּקְצֹרְנָה
  choice: seront abrégées
  rationale: La forme féminine plurielle s’accorde avec « années » et exprime qu’elles deviennent courtes. « Seront abrégées » rend clairement ce résultat en français sans ajouter d’agent absent du texte.
theological_decisions:
- issue: Nature de l’affirmation concernant la longévité
  choice: Conserver la formulation directe comme principe général de sagesse, sans en faire explicitement une garantie absolue.
  alternative: Interpréter le verset comme une promesse inconditionnelle de longue vie pour toute personne qui craint Dieu et de mort précoce pour tout méchant.
  rationale: Le proverbe énonce un modèle moral général. La traduction garde sa force et sa tension propres sans introduire une précision doctrinale absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation « ajoute des jours » est légèrement marquée mais intelligible; elle conserve l’image hébraïque, tandis que la note fournit l’expression française plus idiomatique.
