source:
  edition: WLC
  text: מָע֣וֹז לַ֭/תֹּם דֶּ֣רֶךְ יְהוָ֑ה וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: fr
  text: La voie de Yahweh[a] est une forteresse pour l’homme intègre, mais une ruine[b] pour ceux qui font le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chemin de Yahweh ». L’hébreu peut désigner aussi bien la manière d’agir de Yahweh que la voie qu’il trace pour les humains.
    reason: lexical_alternative
  - marker: b
    text: Ou « destruction » ou « terreur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: forteresse
  rationale: Le nom désigne un lieu ou un moyen de protection et de force. « Forteresse » conserve l’image concrète tout en restant clair en français moderne.
- source_word: לַתֹּם
  choice: pour l’homme intègre
  rationale: תֹּם exprime l’intégrité, la droiture ou le caractère irréprochable. La formulation personnelle correspond au contraste avec « ceux qui font le mal ».
- source_word: דֶּרֶךְ יְהוָה
  choice: la voie de Yahweh
  rationale: 'Cette traduction naturelle conserve l’ambiguïté du groupe hébreu : il peut s’agir de la manière d’agir de Yahweh ou de la voie qu’il indique aux humains.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: וּמְחִתָּה
  choice: mais une cause de ruine
  rationale: מְחִתָּה peut évoquer la ruine, la destruction ou l’effroi. « Cause de ruine » rend intelligible en français la relation entre « la voie de Yahweh » et le sort des malfaisants, tandis que « mais » exprime l’antithèse portée par le contexte.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: pour ceux qui font le mal
  rationale: Cette expression actuelle préserve la valeur active du participe פֹעֲלֵי et le sens moral de אָוֶן sans recourir au tour archaïque « ouvriers d’iniquité ».
theological_decisions:
- issue: Portée sémantique de « la voie de Yahweh »
  choice: Conserver la formule large sans préciser s’il s’agit de la manière d’agir de Yahweh ou de la voie qu’il prescrit.
  alternative: Préciser soit « la manière d’agir de Yahweh », soit « la voie que Yahweh commande ».
  rationale: Le groupe construit hébreu permet les deux nuances; les départager dans le texte supprimerait une ambiguïté probablement intentionnelle.
- issue: Relation de la voie de Yahweh avec la ruine des malfaisants
  choice: Présenter cette voie comme une cause de ruine pour ceux qui font le mal.
  alternative: Traduire littéralement « mais une ruine pour ceux qui font le mal » ou comprendre « la forteresse est une ruine ».
  rationale: Le second membre elliptique reprend naturellement « la voie de Yahweh » comme sujet. La formulation retenue explicite seulement la relation nominale nécessaire à un français naturel, sans définir le mécanisme théologique du jugement.
translation_notes:
  register: Français international moderne, clair et digne. « L’homme intègre » est générique et marque la catégorie morale opposée à ceux qui font le mal. Les deux membres gardent la structure antithétique du proverbe.
