    issue: « une cause de ruine » explicite indûment le rapport du second membre
    rationale: Le texte dit littéralement « et [une] ruine pour les faiseurs de mal ». Bien que le sujet soit repris elliptiquement, le terme « cause » interprète la construction et alourdit le parallélisme. « Une ruine » préserve plus exactement l’ambiguïté et la formulation nominale hébraïques.
