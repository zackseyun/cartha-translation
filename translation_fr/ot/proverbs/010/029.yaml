  source_fidelity: Le parallélisme hébreu présente « la voie de Yahweh » comme une forteresse pour l’homme intègre et, par ellipse, comme une ruine pour les artisans du mal. « Une cause de ruine » ajoute une relation causale explicite qui n’est pas formulée par le nom hébreu מְחִתָּה et réduit l’ellipse expressive du second membre.
  naturalness: « La voie de Yahweh est une forteresse pour l’homme intègre, mais une ruine pour ceux qui font le mal » est idiomatique, clair et d’un registre proverbial naturel en français moderne. Le parallélisme y demeure net.
  terminology: « Yahweh », « voie », « forteresse », « homme intègre » et « ceux qui font le mal » rendent adéquatement les termes et le registre. « Ruine » est un bon rendu de מְחִתָּה; la note conserve les principales alternatives sans imposer le sens d’« effroi ».
  issues:
