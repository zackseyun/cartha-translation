id: PRO.10.24
reference: Proverbs 10:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: fr
  text: Ce que redoute le méchant lui arrivera[a], mais le désir des justes sera exaucé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La terreur du méchant viendra sur lui. » Le nom hébreu peut désigner la peur elle-même ou ce qui est redouté.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il donnera ». Le sujet n’est pas exprimé en hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת
  choice: ce que redoute
  rationale: Le nom peut désigner la frayeur ou ce qui est redouté. Dans ce contexte, « ce que redoute » exprime naturellement l’objet de la crainte et convient au parallélisme du proverbe.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé singulier désigne ici une personne représentative d’une catégorie. « Le méchant » conserve la formulation proverbiale sans ajouter de précision absente de l’hébreu.
- source_word: הִיא תְבוֹאֶנּוּ
  choice: lui arrivera
  rationale: Le pronom féminin renvoie à מְגוֹרַת, et le verbe בוא avec suffixe signifie que la chose redoutée viendra jusqu’à lui. « Lui arrivera » rend ce sens clairement en français courant.
- source_word: וְתַאֲוַת
  choice: mais le désir
  rationale: תַּאֲוָה désigne un désir ou une aspiration. La conjonction וְ est rendue par « mais » afin d’exprimer l’opposition portée par le parallélisme antithétique.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: Le pluriel substantivé désigne collectivement les personnes justes. « Les justes » est naturel, concis et fidèle à la portée générale du proverbe.
- source_word: יִתֵּן
  choice: sera exaucé
  rationale: Le verbe actif signifie littéralement « il donnera », mais son sujet n’est pas exprimé. La tournure passive restitue l’accomplissement du désir sans identifier le donateur au-delà du texte.
theological_decisions:
- issue: Sujet implicite de יִתֵּן
  choice: Laisser l’auteur du don implicite au moyen de « sera exaucé ».
  alternative: Traduire « il donnera » ou expliciter « Dieu exaucera ».
  rationale: L’hébreu ne nomme pas le sujet. Même si l’action divine peut être sous-entendue dans le cadre sapientiel, l’expliciter supprimerait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, concis et proverbial. « Méchant » et « justes » maintiennent le contraste moral traditionnel tout en restant immédiatement compréhensibles. La formulation conserve l’ambiguïté concernant l’auteur de l’exaucement.
