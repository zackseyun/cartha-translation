  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: fr
  text: La bouche du juste est une source de vie, mais la bouche des méchants cache la violence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la bouche des méchants couvre la violence ». La construction hébraïque peut aussi se comprendre : « la violence couvre la bouche des méchants ».'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: מְקוֹר חַיִּים
  choice: une source de vie
  rationale: מְקוֹר désigne une source d’eau jaillissante et forme ici une métaphore de parole vivifiante. « Source de vie » est naturel en français et conserve cette image concrète.
- source_word: פִּי צַדִּיק
  choice: la bouche du juste
  rationale: La formulation garde l’image concrète de la « bouche » et rend le singulier représentatif צַדִּיק par « le juste », sans ajout genré inutile.
- source_word: וּפִי רְשָׁעִים
  choice: mais la bouche des méchants
  rationale: Le ו introductif prend ici une valeur contrastive dans le parallélisme, d’où « mais ». Le texte associe le singulier « bouche » au pluriel « méchants » ; la traduction respecte cette dissymétrie.
- source_word: יְכַסֶּה
  choice: cache
  rationale: Le verbe כסה signifie « couvrir » et, par extension, « cacher ». Avec « la bouche des méchants » compris comme sujet antéposé, « cache » exprime clairement le sens figuré tout en gardant l’ambiguïté dans une note.
- source_word: חָמָס
  choice: la violence
  rationale: חָמָס désigne la violence ou le tort violent. « La violence » est ici le rendu français le plus direct et le plus concis.
theological_decisions:
- issue: Rapport syntaxique entre « la bouche des méchants », le verbe יְכַסֶּה et « la violence »
  choice: La bouche des méchants cache la violence.
  alternative: La violence couvre la bouche des méchants.
  rationale: L’ordre des mots et les formes hébraïques permettent d’analyser soit « la bouche » comme sujet et « la violence » comme objet, soit « la violence » comme sujet postposé avec « la bouche des méchants » mise en tête. Le texte principal retient la première lecture, cohérente et naturelle, tandis que la note préserve l’autre lecture sans trancher silencieusement.
translation_notes:
  register: Français moderne, international et digne. La concision antithétique du proverbe ainsi que ses images concrètes sont conservées.
