id: PRO.10.31
reference: Proverbs 10:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/031.yaml
  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
translation:
  language: fr
  text: La bouche du juste porte la sagesse comme fruit[a], mais la langue perverse sera retranchée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait germer la sagesse ». Le verbe hébreu évoque ce qui pousse ou porte du fruit.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: la bouche
  rationale: Conserve l’image concrète de la bouche comme source de la parole et répond à « la langue » dans le second membre.
- source_word: צַדִּיק
  choice: du juste
  rationale: Le singulier hébreu représente ici une catégorie morale; « le juste » est une formulation française traditionnelle, claire et non inutilement développée.
- source_word: יָנוּב
  choice: porte ... comme fruit
  rationale: Le verbe évoque la germination ou la production de fruit; cette formulation conserve la métaphore végétale tout en restant intelligible en français.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Reproduit directement le nom abstrait hébreu sans l’expliciter en « paroles sages ».
- source_word: לְשׁוֹן
  choice: la langue
  rationale: Conserve la métonymie hébraïque usuelle pour la parole et le parallélisme avec « la bouche ».
- source_word: תַּהְפֻּכוֹת
  choice: perverse
  rationale: Dans la construction française « la langue perverse », l’adjectif exprime naturellement le caractère tortueux ou moralement déviant de la parole; le pluriel hébreu peut évoquer des propos pervertis répétés.
- source_word: תִּכָּרֵת
  choice: sera retranchée
  rationale: Préserve le passif et la force du verbe כרת sans préciser indûment s’il s’agit d’être réduite au silence, supprimée ou détruite.
theological_decisions:
- issue: Portée de « sera retranchée »
  choice: Maintenir l’image forte sans en définir le mécanisme
  alternative: sera réduite au silence
  rationale: Le texte affirme le retranchement de la langue, mais n’explicite pas s’il désigne un jugement physique, social ou figuré; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme concret « bouche / langue » est conservé, de même que la métaphore végétale du premier membre et la sévérité du second.
