source:
  edition: WLC
  text: חֲכַם לֵ֭ב יִקַּ֣ח מִצְוֺ֑ת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: fr
  text: Le sage de cœur accepte les commandements, mais l’insensé aux lèvres bavardes sera précipité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ira à sa ruine ». Le dernier verbe est rare et peut évoquer le fait d’être jeté à bas ou de venir à la ruine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: celui qui a le cœur sage
  rationale: Rend naturellement l’expression hébraïque « sage de cœur » tout en conservant le cœur comme siège de la réflexion et de la volonté.
- source_word: יִקַּח
  choice: accepte
  rationale: Avec « commandements », le verbe « prendre » exprime ici l’accueil volontaire d’une directive; « accepte » restitue cet emploi idiomatique.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Le nom désigne des directives ayant autorité. « Commandements » en conserve la force obligatoire.
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Terme sapiential désignant une personne moralement et pratiquement dépourvue de sagesse; « insensé » convient au registre biblique sans réduire le mot à une simple injure.
- source_word: שְׂפָתַיִם
  choice: aux lèvres bavardes
  rationale: Conserve l’image concrète des lèvres tout en rendant intelligible l’idée d’un insensé caractérisé par une parole abondante ou inconsidérée.
- source_word: יִלָּבֵט
  choice: court à sa perte
  rationale: Le verbe rare semble exprimer le fait d’être abattu ou d’aller à la ruine. Cette formulation est naturelle en français et rend clairement l’issue funeste, tandis que l’incertitude lexicale est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique est conservé, ainsi que l’image hébraïque du cœur et celle des lèvres.
