id: PRO.10.30
reference: Proverbs 10:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: צַדִּ֣יק לְ/עוֹלָ֣ם בַּל יִמּ֑וֹט וּ֝/רְשָׁעִ֗ים לֹ֣א יִשְׁכְּנוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: fr
  text: Le juste ne vacillera jamais, mais les méchants n’habiteront pas le pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la terre ». Le mot hébreu אֶרֶץ peut désigner un pays ou territoire particulier, ou la terre dans un sens plus large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé au singulier présente la personne juste comme un type représentatif. « Le juste » conserve cette valeur générale sans ajouter de précision absente de l’hébreu.
- source_word: לְעוֹלָם … בַּל
  choice: ne … jamais
  rationale: L’expression temporelle associée à la négation poétique marque ici une stabilité durable et sans exception. « Ne … jamais » rend naturellement l’ensemble de la construction.
- source_word: יִמּוֹט
  choice: vacillera
  rationale: Le nifal de מוט évoque le fait de chanceler, de perdre sa stabilité ou d’être déplacé. « Vacillera » préserve l’image de stabilité sans renforcer le sens jusqu’à « sera renversé ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé pluriel désigne collectivement les personnes moralement mauvaises. « Les méchants » est concis et idiomatique.
- source_word: יִשְׁכְּנוּ
  choice: n’habiteront pas
  rationale: Le verbe שכן désigne l’action d’habiter ou de s’établir. « Habiteront » conserve l’idée d’une résidence établie sans introduire explicitement la notion supplémentaire de durée contenue dans « resteront ».
- source_word: אָרֶץ
  choice: le pays
  rationale: Le nom peut désigner un pays ou territoire déterminé, mais aussi la terre au sens plus large. « Le pays » garde la résonance territoriale possible du proverbe, tandis que l’autre lecture est signalée en note.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contraste peut évoquer la sécurité du juste et l’exclusion des méchants d’un territoire où l’on demeure, avec une possible résonance liée au pays d’Israël. Toutefois, le langage sapientiel peut aussi viser la terre en général ; la note maintient donc cette ambiguïté.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme entre « le juste » au singulier représentatif et « les méchants » au pluriel est conservé. La note est placée après « le pays », terme auquel elle se rapporte.
