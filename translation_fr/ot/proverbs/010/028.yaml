source:
  edition: WLC
  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: fr
  text: L’attente des justes mène à la joie[a], mais l’espoir des méchants disparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « espoir » pour « attente ». L’hébreu emploie ici un nom différent de celui qui est rendu par « espoir » dans le second membre, bien que leurs sens se recoupent.
    reason: alternative_lexicale
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: l’attente
  rationale: Le nom exprime une attente confiante ou pleine d’espoir. « L’attente » conserve une légère différence avec תִקְוָה dans le second membre tout en restant naturel en français.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif substantivé pluriel désigne les personnes justes. « Les justes » est concis et maintient le contraste proverbial avec « les méchants ».
- source_word: שִׂמְחָה
  choice: la joie
  rationale: Le nom signifie « joie » ou « allégresse ». « La joie » est ici la formulation la plus simple et naturelle.
- source_word: תִקְוַת
  choice: l’espoir
  rationale: Le nom désigne couramment l’espoir. Ce choix rend clairement le parallélisme antithétique tout en préservant la variation lexicale de l’hébreu.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif substantivé pluriel désigne ceux qui agissent avec méchanceté. « Les méchants » est une désignation concise et usuelle dans la littérature de sagesse.
- source_word: תֹּאבֵד
  choice: disparaîtra
  rationale: Le verbe אבד peut signifier périr, se perdre ou disparaître. Avec « espoir » comme sujet, « disparaîtra » est idiomatique et indique que cet espoir sera réduit à néant.
theological_decisions:
- issue: Ce qui disparaît dans le second membre
  choice: C’est explicitement l’espoir des méchants qui disparaît.
  alternative: Le vers peut être compris plus largement comme suggérant aussi la ruine des méchants eux-mêmes.
  rationale: Le verbe féminin singulier s’accorde avec תִקְוַת (« espoir »). La traduction ne tire donc pas de conclusion doctrinale plus large que l’énoncé syntaxique direct.
translation_notes:
  register: Français moderne, international et digne. « Débouche sur » explicite naturellement le rapport nominal très condensé de l’hébreu sans en faire une promesse doctrinale plus précise. La distinction entre « attente » et « espoir » reflète les deux noms hébreux proches mais différents.
