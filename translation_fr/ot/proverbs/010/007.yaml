source:
  edition: WLC
  text: זֵ֣כֶר צַ֭דִּיק לִ/בְרָכָ֑ה וְ/שֵׁ֖ם רְשָׁעִ֣ים יִרְקָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/007.yaml
  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
translation:
  language: fr
  text: Le souvenir du juste est une bénédiction[a], mais le nom des méchants pourrira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Le souvenir du juste est pour une bénédiction. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: souvenir
  rationale: Le nom désigne le souvenir ou la mémoire laissée par une personne. « Souvenir » est naturel en français et maintient le parallèle avec le « nom » dans le second vers.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé désigne de façon générique la personne juste. Le singulier français conserve la forme représentative de l’hébreu.
- source_word: לִבְרָכָה
  choice: est une bénédiction
  rationale: Littéralement « pour une bénédiction ». La formulation prédicative est idiomatique en français et exprime clairement la valeur positive du souvenir du juste.
- source_word: שֵׁם
  choice: le nom
  rationale: « Nom » rend directement l’hébreu et préserve l’image, laquelle peut englober la réputation et la postérité sans se limiter à l’une d’elles.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif pluriel substantivé désigne la catégorie morale des personnes méchantes. Cette tournure est concise et courante dans la littérature sapientiale.
- source_word: יִרְקָב
  choice: pourrira
  rationale: Le verbe évoque concrètement la décomposition. « Pourrira » conserve cette image forte plutôt que de l’atténuer par « disparaîtra » ou « périra ».
