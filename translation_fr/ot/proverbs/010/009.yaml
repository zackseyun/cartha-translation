  text: הוֹלֵ֣ךְ בַּ֭/תֹּם יֵ֣לֶךְ בֶּ֑טַח וּ/מְעַקֵּ֥שׁ דְּ֝רָכָ֗י/ו יִוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/009.yaml
  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: fr
  text: Qui marche dans l’intégrité marche en sécurité, mais qui rend ses voies tortueuses sera démasqué[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera connu », « deviendra connu » ou « sera découvert ». L’hébreu peut signifier soit que la personne aux voies tortueuses sera reconnue pour ce qu’elle est, soit que sa conduite sera mise au jour.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: Qui marche
  rationale: Le participe a une portée générale et proverbiale. « Qui marche » exprime naturellement cette valeur sans limiter l’énoncé à un homme en particulier et conserve la métaphore de la conduite comme marche.
- source_word: בַּתֹּם
  choice: dans l’intégrité
  rationale: תֹּם évoque l’intégrité, la droiture entière ou le caractère irréprochable. « Dans l’intégrité » préserve la forme nominale et évite l’absolu que pourrait suggérer « sans faute ».
- source_word: יֵלֶךְ
  choice: marche
  rationale: La répétition de « marche » reproduit le parallélisme lexical hébreu et maintient la métaphore du cheminement moral.
- source_word: בֶּטַח
  choice: en sécurité
  rationale: בֶּטַח désigne ici une situation de sûreté plutôt qu’un simple sentiment subjectif d’assurance. « En sécurité » est idiomatique en français.
- source_word: וּמְעַקֵּשׁ
  choice: mais qui rend … tortueuses
  rationale: Le participe de עקשׁ exprime l’action de rendre tortueux, de tordre ou de pervertir. Cette formulation conserve explicitement l’action exercée sur les « voies ».
- source_word: דְּרָכָיו
  choice: ses voies
  rationale: Le pluriel reprend directement l’image hébraïque des chemins représentant la manière de vivre. « Voies » garde le registre proverbial et le lien avec la marche.
- source_word: יִוָּדֵעַ
  choice: sera démasqué
  rationale: Le niphal de ידע peut signifier « être connu », « devenir connu » ou, dans ce contraste, « être découvert ». « Sera démasqué » rend clairement la conséquence implicite sans effacer l’ambiguïté, signalée en note.
theological_decisions:
- issue: Nature de la sécurité promise à la personne intègre
  choice: « marche en sécurité », sans préciser s’il s’agit d’une protection absolue, d’une stabilité morale ou d’une assurance liée à une conduite sans duplicité
  alternative: « marche avec assurance »
  rationale: Le verset formule une maxime sapientielle. La traduction ne doit ni transformer cette sécurité en garantie exhaustive contre toute souffrance ni la réduire à un état psychologique.
- issue: Sens passif de יִוָּדֵעַ
  choice: « sera démasqué », avec les autres possibilités en note
  alternative: « sera connu » ou « finira par être découvert »
  rationale: Le contexte antithétique favorise l’idée que la personne aux voies tortueuses sera reconnue pour ce qu’elle est ou que sa conduite sera mise au jour, mais la forme hébraïque ne tranche pas entièrement entre ces nuances.
translation_notes:
  register: Français international moderne, concis et proverbial. La répétition de « marche » et l’image des « voies » conservent le réseau métaphorique hébreu. Le tour générique « qui » évite un masculin inutile tout en restant naturel et digne.
