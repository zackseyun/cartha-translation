source:
  edition: WLC
  text: בְּ/שִׂפְתֵ֣י נָ֭בוֹן תִּמָּצֵ֣א חָכְמָ֑ה וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: fr
  text: Sur les lèvres de l’homme qui a du discernement se trouve la sagesse ; mais le bâton est pour le dos de celui qui manque de bon sens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui manque de cœur » ; en hébreu, le cœur est ici le siège de l’intelligence et du jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׂפְתֵי
  choice: Sur les lèvres de
  rationale: La préposition בְּ avec « lèvres » situe figurativement la sagesse dans les paroles prononcées. Cette formulation naturelle conserve l’image hébraïque.
- source_word: נָבוֹן
  choice: l’homme qui a du discernement
  rationale: נָבוֹן désigne quelqu’un doué d’intelligence et de discernement. La formulation explicite le sens tout en conservant le masculin singulier proverbial du texte.
- source_word: תִּמָּצֵא
  choice: se trouve
  rationale: L’imparfait nifal exprime ici une vérité générale, non un futur strict. Le présent français convient au caractère proverbial de l’énoncé.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent français usuel de חָכְמָה dans le livre des Proverbes.
- source_word: וְשֵׁבֶט
  choice: mais le bâton
  rationale: Le waw relie ici deux propositions contrastées ; « mais » rend cette opposition. שֵׁבֶט désigne le bâton comme instrument de correction ou de châtiment.
- source_word: לְגֵו
  choice: est pour le dos
  rationale: גֵו peut désigner le dos ou le corps ; dans le contexte d’un coup de bâton, « dos » est le terme précis. Le verbe « est » est ajouté pour rendre en français la proposition nominale hébraïque.
- source_word: חֲסַר לֵב
  choice: celui qui manque de bon sens
  rationale: L’expression signifie littéralement « qui manque de cœur », mais le cœur représente ici le siège de l’intelligence et du jugement. « Manque de bon sens » transmet clairement cet idiome en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure antithétique et les images concrètes des « lèvres », du « bâton » et du « dos » sont conservées. Le point-virgule met en évidence le parallélisme contrasté.
