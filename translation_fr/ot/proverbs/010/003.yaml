review_pass:
  verdict: revise
  source_fidelity: 'Le premier membre rend bien le hiphil de רעב : Yahweh ne permet pas que le juste ait faim. Le second membre conserve correctement l''image de יֶהְדֹּף, « repousser/écarter ». Toutefois, הַוַּת est lexicalement ambigu et « convoitise » introduit une nuance plus spécifique de désir coupable ou de cupidité que l''hébreu n''impose pas. « Désir » préserve mieux le sens retenu et l''ambiguïté signalée en note.'
  naturalness: « Yahweh ne laisse pas le juste souffrir de la faim » est naturel, clair et d'un registre approprié. « Il repousse le désir des méchants » est également idiomatique et garde la métaphore du verbe hébreu.
  terminology: « Yahweh », « le juste » et « les méchants » sont appropriés en français biblique moderne international. Le remplacement de « convoitise » par « désir » évite de surinterpréter le nom hébreu tout en maintenant le contraste proverbial avec la faim.
  issues:
  - severity: medium
    issue: « Convoitise » restreint indûment le sens de הַוַּת.
    rationale: Le terme français évoque habituellement l'avidité ou le désir de posséder ce qui appartient à autrui. Dans ce verset, le nom peut désigner plus largement le désir ou l'appétit des méchants; il peut aussi, selon une autre analyse lexicale, désigner leur ruine ou calamité. « Désir » est donc plus fidèle et moins interprétatif.
  - severity: low
    issue: La note propose « le désir des méchants » comme variante alors que cette formulation est préférable au texte principal.
    rationale: Puisque « désir » rend le sens choisi avec davantage de neutralité, il convient de le mettre dans le texte et de réserver la note au sens alternatif réel, « ruine/calamité ».
  revised_text: Yahweh ne laisse pas le juste souffrir de la faim, mais il repousse le désir[a] des méchants.
  revised_footnotes:
  - marker: a
    text: 'Ou : « la ruine » ou « la calamité des méchants ». Le nom hébreu peut désigner le désir, mais aussi la ruine ou la calamité ; la seconde proposition peut donc se comprendre : « mais il repousse la ruine des méchants ».'
    reason: alternative_reading
