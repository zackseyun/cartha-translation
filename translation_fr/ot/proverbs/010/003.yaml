id: PRO.10.3
reference: Proverbs 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: fr
  text: Yahweh ne laisse pas le juste souffrir de la faim, mais il repousse le désir[a] des méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la ruine » ou « la calamité des méchants ». Le nom hébreu peut désigner le désir, mais aussi la ruine ou la calamité ; la seconde proposition peut donc se comprendre : « mais il repousse la ruine des méchants ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: ne laisse pas … souffrir de la faim
  rationale: Le hiphil de רעב exprime le fait de causer la faim. Cette tournure française naturelle conserve la valeur causative sans suggérer nécessairement que Yahweh affame directement le juste.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français moderne du nom divin יהוה, plutôt que substitution par un titre.
- source_word: נֶפֶשׁ צַדִּיק
  choice: le juste
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne vivante, non une âme immatérielle distinguée du corps. Le substantif français « le juste » exprime naturellement la personne entière visée par l’hébreu.
- source_word: הַוַּת
  choice: la convoitise
  rationale: Dans le parallélisme avec la faim, le mot désigne vraisemblablement le désir pressant ou l’avidité des méchants. Son autre sens possible, « ruine » ou « calamité », est signalé en note.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Rendu substantivé courant du pluriel hébreu désignant les personnes moralement mauvaises.
- source_word: יֶהְדֹּף
  choice: il repousse
  rationale: Le verbe signifie pousser, chasser ou repousser. « Repousse » conserve cette image concrète sans expliciter davantage l’effet produit sur la convoitise.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin lui-même. Sa transcription préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Portée de נֶפֶשׁ
  choice: la personne entière, exprimée par « le juste »
  alternative: l’âme / la vie / l’appétit du juste
  rationale: Le contexte concerne la faim de la personne vivante et n’impose pas une distinction théologique entre âme et corps.
- issue: Sens de הַוַּת רְשָׁעִים
  choice: la convoitise des méchants
  alternative: la ruine ou la calamité des méchants
  rationale: Le contraste avec la faim favorise le sens de désir ou de convoitise, mais l’ambiguïté lexicale réelle est maintenue dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. « Le juste » et « les méchants » conservent les catégories sapientielles de l’hébreu, tandis que « souffrir de la faim » évite une formulation artificiellement littérale.
