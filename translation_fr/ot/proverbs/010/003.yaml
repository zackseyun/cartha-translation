revisions:
- from: Yahweh ne laisse pas le juste souffrir de la faim, mais il repousse la convoitise[a] des méchants.
  to: Yahweh ne laisse pas le juste souffrir de la faim, mais il repousse le désir[a] des méchants.
  rationale: La révision remplace un terme français trop étroitement marqué, « convoitise », par « désir », qui rend plus directement le sens retenu de הַוַּת sans éliminer son autre sens possible. La note est ajustée afin de documenter cette ambiguïté plutôt que de présenter comme simple alternative la formulation désormais retenue.
