  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: fr
  text: Quand les paroles abondent[a], la transgression ne manque pas, mais celui qui retient ses lèvres est prudent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans l’abondance des paroles, la transgression ne cesse pas. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « agit avec discernement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: Quand les paroles abondent
  rationale: La construction בְּרֹב exprime ici une circonstance liée à la quantité. Cette formulation naturelle en français conserve l’idée d’une profusion de paroles.
- source_word: לֹא יֶחְדַּל פָּשַׁע
  choice: la faute ne manque pas
  rationale: חדל avec la négation peut exprimer ce qui ne cesse pas ou ne fait pas défaut. « La faute ne manque pas » rend idiomatiquement l’avertissement proverbial tout en conservant le singulier collectif de פָּשַׁע.
- source_word: וְחֹשֵׂךְ
  choice: mais celui qui retient
  rationale: Le participe de חשׂך désigne la personne qui retient ou maîtrise quelque chose. Le ו est rendu par « mais » pour faire ressortir le contraste entre les deux membres du vers.
- source_word: שְׂפָתָיו
  choice: ses lèvres
  rationale: La traduction conserve l’image corporelle hébraïque des lèvres comme organe de la parole, image également naturelle en français.
- source_word: מַשְׂכִּיל
  choice: agit avec discernement
  rationale: Le participe hiphil de שׂכל peut décrire celui qui agit avec intelligence, sagesse pratique ou prudence. Cette formulation met en valeur la conduite avisée plutôt qu’une simple qualité abstraite.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme antithétique et l’image des lèvres sont conservés. « Celui qui » a une valeur générale, conformément au style proverbial hébreu.
