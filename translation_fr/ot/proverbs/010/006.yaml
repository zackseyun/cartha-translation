  text: בְּ֭רָכוֹת לְ/רֹ֣אשׁ צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: fr
  text: Les bénédictions reposent sur la tête du juste, mais la bouche des méchants couvre la violence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « mais la violence couvre la bouche des méchants ». En hébreu, la forme de la phrase permet de comprendre soit que la bouche couvre la violence, soit que la violence couvre la bouche.'
    reason: Préserver une ambiguïté syntaxique réelle concernant le sujet et le complément du verbe « couvrir ».
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: Les bénédictions
  rationale: Le pluriel hébreu est conservé; il évoque les bienfaits accordés au juste.
- source_word: לְרֹאשׁ
  choice: reposent sur la tête
  rationale: La préposition לְ marque ici la position ou la destination. L’ajout de « reposent » produit une phrase française naturelle sans effacer l’image de bénédictions placées sur la tête.
- source_word: צַדִּיק
  choice: du juste
  rationale: Rend le singulier hébreu et le terme sapientiel désignant celui qui agit conformément à la justice.
- source_word: יְכַסֶּה
  choice: couvre
  rationale: Conserve le sens concret et l’ambivalence de כסה, sans préciser qu’il s’agit nécessairement de cacher ou de dissimuler.
- source_word: חָמָס
  choice: la violence
  rationale: Rend le terme hébreu qui désigne la violence, le tort ou l’injustice; « violence » convient au parallélisme du proverbe.
theological_decisions:
- issue: Identification du sujet de יְכַסֶּה dans le second membre
  choice: « la bouche des méchants couvre la violence »
  alternative: « la violence couvre la bouche des méchants »
  rationale: Le verbe, « bouche » et « violence » étant tous masculins singuliers, la syntaxe permet les deux analyses. Le texte principal suit l’ordre immédiat et la lecture retenue par la couche anglaise auditée, tandis qu’une note préserve explicitement l’autre possibilité ancienne et grammaticalement viable.
translation_notes:
  register: Français international moderne, simple et digne. L’image corporelle de la « tête » et de la « bouche » est maintenue, de même que le verbe concret « couvre »; la note évite de résoudre silencieusement l’ambiguïté de l’hébreu.
