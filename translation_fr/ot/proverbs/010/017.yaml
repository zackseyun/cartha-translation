source:
  edition: WLC
  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: fr
  text: Qui observe la discipline est sur le chemin qui mène à la vie[a], mais qui abandonne la réprimande égare les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est un chemin qui mène à la vie » ; l’hébreu est concis et peut faire de « celui qui observe la discipline » le prédicat de « chemin qui mène à la vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: chemin
  rationale: Le nom désigne une route, une voie ou, métaphoriquement dans les Proverbes, une conduite. « Chemin » conserve cette image dans un français naturel.
- source_word: לְחַיִּים
  choice: de la vie
  rationale: La préposition לְ peut exprimer ici la direction ou le résultat. Dans la tournure idiomatique « sur le chemin de la vie », le français emploie naturellement « de », avec le sens de chemin qui mène à la vie.
- source_word: שׁוֹמֵר
  choice: tient compte de
  rationale: Le participe évoque le fait de garder, observer ou suivre continuellement. Avec « discipline », « tient compte de » exprime naturellement l'accueil effectif et durable de cette formation.
- source_word: מוּסָר
  choice: discipline
  rationale: Dans les Proverbes, le terme recouvre la formation morale, l'instruction et la correction. « Discipline » maintient cette ampleur sans le réduire à un simple enseignement.
- source_word: וְעוֹזֵב
  choice: mais qui rejette
  rationale: La conjonction introduit un contraste. Le verbe signifie laisser ou abandonner ; « rejette » rend ici la décision de ne pas accepter la correction dans un français courant.
- source_word: תּוֹכַחַת
  choice: correction
  rationale: Le mot désigne une remontrance ou une correction verbale. « Correction » est clair, actuel et convient au contexte sapientiel.
- source_word: מַתְעֶה
  choice: égare les autres
  rationale: 'Le participe au hiphil est causatif : il ne décrit pas seulement quelqu''un qui s''égare, mais quelqu''un qui en fait dévier d''autres. « Les autres » explicite en français l''objet laissé sous-entendu en hébreu.'
