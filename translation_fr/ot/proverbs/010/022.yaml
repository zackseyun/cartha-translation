  text: בִּרְכַּ֣ת יְ֭הוָה הִ֣יא תַעֲשִׁ֑יר וְ/לֹֽא יוֹסִ֖ף עֶ֣צֶב עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/022.yaml
  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: fr
  text: La bénédiction du SEIGNEUR enrichit, et il n’y ajoute aucune peine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: La bénédiction du SEIGNEUR
  rationale: « Bénédiction » rend directement בְּרָכָה. « Le SEIGNEUR » suit la convention française courante pour le nom divin יהוה.
- source_word: הִיא תַעֲשִׁיר
  choice: enrichit
  rationale: Le hiphil de עשר signifie « rendre riche, enrichir ». Le pronom féminin הִיא, qui reprend « la bénédiction », peut rester implicite en français.
- source_word: וְלֹא יוֹסִף עֶצֶב עִמָּהּ
  choice: et il n’y ajoute aucun chagrin
  rationale: Cette formulation conserve le sujet masculin implicite le plus naturel, le SEIGNEUR, et rend עֶצֶב par « chagrin », terme pouvant évoquer peine, douleur ou affliction. « Y » reprend la richesse issue de la bénédiction sans surcharger la phrase.
theological_decisions:
- issue: Sujet de יוֹסִף (« ajouter »)
  choice: il, renvoyant au SEIGNEUR
  alternative: elle, renvoyant à la bénédiction, ou une tournure impersonnelle telle que « sans que le chagrin y ajoute quoi que ce soit »
  rationale: Le verbe hébreu יוֹסִף est masculin singulier, ce qui favorise « le SEIGNEUR » comme sujet plutôt que le nom féminin « bénédiction ». La traduction évite néanmoins de développer au-delà de ce que dit le texte.
translation_notes:
  register: Français moderne, simple et sentencieux, adapté au style proverbial. « Aucun chagrin » est naturel et digne, tout en conservant la force absolue de לֹא.
