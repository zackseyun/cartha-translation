source:
  edition: WLC
  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: fr
  text: La haine suscite des querelles, mais l’amour couvre toutes les offenses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image de « couvrir » peut évoquer le fait de ne pas exposer les offenses ni de les entretenir ; le texte hébreu n’emploie pas ici un verbe signifiant explicitement « pardonner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂנְאָה
  choice: la haine
  rationale: Nom abstrait placé en contraste direct avec « l’amour » ; « la haine » est l’équivalent français naturel.
- source_word: תְּעוֹרֵר
  choice: suscite
  rationale: Le verbe exprime ici l’action de faire naître ou d’attiser ; « suscite » est naturel et conserve la valeur causative.
- source_word: מְדָנִים
  choice: des querelles
  rationale: Le pluriel désigne des disputes ou des conflits. « Querelles » convient bien au contexte relationnel et reste accessible en français moderne.
- source_word: וְ/עַל
  choice: mais
  rationale: La construction signifie littéralement « et sur », mais les deux propositions forment un parallélisme antithétique. « Mais » rend clairement ce contraste en français.
- source_word: כָּל
  choice: toutes les
  rationale: Rend sans restriction le quantificateur hébreu devant le pluriel.
- source_word: פְּשָׁעִים
  choice: offenses
  rationale: Le terme peut désigner des transgressions, des rébellions ou des torts. « Offenses » conserve sa portée morale tout en convenant au cadre interpersonnel du proverbe.
- source_word: תְּכַסֶּה
  choice: couvre
  rationale: Conserve l’image concrète du verbe hébreu sans la réduire à « pardonne » ni lui faire signifier explicitement « dissimule ».
- source_word: אַהֲבָה
  choice: l’amour
  rationale: Équivalent direct du nom abstrait, en opposition structurante avec « la haine ».
theological_decisions:
- issue: Sens de « l’amour couvre toutes les offenses »
  choice: Conserver la métaphore selon laquelle l’amour couvre les offenses.
  alternative: Traduire explicitement par « l’amour pardonne toutes les fautes » ou « l’amour dissimule tous les torts ».
  rationale: L’hébreu dit « couvre » et non explicitement « pardonne » ou « cache ». Garder l’image préserve son amplitude et évite aussi bien une affirmation doctrinale plus précise que le texte qu’une invitation à dissimuler l’injustice.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme antithétique est rendu de façon concise, et la métaphore centrale de l’hébreu est maintenue.
