source:
  edition: WLC
  text: רָ֗אשׁ עֹשֶׂ֥ה כַף רְמִיָּ֑ה וְ/יַ֖ד חָרוּצִ֣ים תַּעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/004.yaml
  text: A slack hand makes one poor[a], but the hand of the diligent makes rich.
translation:
  language: fr
  text: Une main paresseuse appauvrit[a], mais la main des gens diligents enrichit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une main trompeuse appauvrit » ; רְמִיָּה peut ailleurs évoquer la tromperie, mais, dans ce proverbe sur le travail, le contexte favorise le sens de « paresseuse » ou « négligente ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשׁ
  choice: appauvrit
  rationale: Le terme désigne ici le résultat de la pauvreté. Avec עֹשֶׂה, le français naturel exprime cette valeur causative par « appauvrit », en parallèle avec « enrichit ».
- source_word: עֹשֶׂה
  choice: appauvrit
  rationale: Dans cette construction, le participe de עשה indique qu’un état est produit. La formulation verbale « appauvrit » rend clairement et brièvement cette causalité.
- source_word: כַף
  choice: main
  rationale: Bien que כַף puisse désigner la paume, il représente ici la main comme instrument du travail.
- source_word: רְמִיָּה
  choice: paresseuse
  rationale: Dans le contexte du travail et en contraste avec la diligence, le mot évoque surtout le relâchement ou la négligence. « Paresseuse » est naturel en français moderne, tandis que le sens possible de tromperie est conservé en note.
- source_word: יָד
  choice: la main
  rationale: La traduction conserve l’image corporelle et le parallélisme antithétique des deux membres du proverbe.
- source_word: חָרוּצִים
  choice: des gens diligents
  rationale: L’adjectif pluriel substantivé désigne des personnes caractérisées par leur diligence. Cette formulation rend explicitement le pluriel et reste naturelle.
- source_word: תַּעֲשִׁיר
  choice: enrichit
  rationale: Le hiphil de עשר a une valeur causative, « rendre riche ». « Enrichit » répond avec concision à « appauvrit ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et proverbial. Le parallélisme concret des deux « mains » est maintenu, avec une antithèse concise entre « appauvrit » et « enrichit ».
