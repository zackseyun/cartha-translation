id: PRO.10.2
reference: Proverbs 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: fr
  text: Les trésors de la méchanceté[a] ne servent à rien, mais la justice[b] délivre de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les trésors acquis par la méchanceté ».'
    reason: La construction hébraïque « trésors de méchanceté » peut indiquer que les richesses ont été acquises par des moyens mauvais.
  - marker: b
    text: 'Ou : « la droiture ».'
    reason: Le terme hébreu peut désigner la justice ou la conduite droite.
lexical_decisions:
- source_word: אוֹצְרוֹת רֶשַׁע
  choice: les trésors de la méchanceté
  rationale: 'Cette formulation rend directement la construction hébraïque et conserve son ambiguïté : il peut s’agir de richesses liées à la méchanceté, notamment acquises par des moyens mauvais.'
- source_word: י֭וֹעִילוּ
  choice: ne servent à rien
  rationale: Le hiphil de יעל exprime l’utilité ou le bénéfice. Cette tournure française naturelle et concise maintient la force proverbiale.
- source_word: וּצְדָקָה
  choice: mais la justice
  rationale: Dans le parallélisme antithétique, le waw a naturellement une valeur adversative. « Justice » rend צְדָקָה dans son sens moral large, sans exclure l’idée de droiture.
- source_word: תַּצִּיל
  choice: délivre
  rationale: Le hiphil de נצל signifie arracher à un danger, secourir ou délivrer. « Délivre » est digne, idiomatique et ne restreint pas la portée du proverbe.
- source_word: מִמָּוֶת
  choice: de la mort
  rationale: La traduction directe préserve la portée potentiellement littérale et figurée de l’expression dans la littérature sapientiale.
theological_decisions:
- issue: Sens de צְדָקָה
  choice: justice
  alternative: droiture
  rationale: « Justice » est le correspondant français traditionnel et suffisamment large pour désigner ici une conduite conforme au bien. « Droiture » explicite davantage la dimension morale personnelle, mais rétrécit légèrement le champ du terme.
- issue: Nature de la délivrance hors de la mort
  choice: délivre de la mort
  alternative: sauve de la mort
  rationale: La formulation littérale conserve la tension du proverbe entre protection contre un danger mortel et portée théologique plus large, sans préciser artificiellement le mécanisme de cette délivrance.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme antithétique est marqué par « mais »; le vocabulaire reste digne et accessible.
