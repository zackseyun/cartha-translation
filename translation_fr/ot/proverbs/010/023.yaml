  text: כִּ/שְׂח֣וֹק לִ֭/כְסִיל עֲשׂ֣וֹת זִמָּ֑ה וְ֝/חָכְמָ֗ה לְ/אִ֣ישׁ תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: fr
  text: Commettre le mal est un jeu pour l’insensé[a], mais la sagesse est pour l’homme qui a du discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Commettre une infamie est un jeu pour l’insensé. » Le terme hébreu traduit par « mal » peut aussi désigner un acte honteux ou révoltant.
    reason: 'Alternative lexicale : זִמָּה peut évoquer une conduite infâme ou outrageuse. La formulation conserve la valeur de l’infinitif « commettre ».'
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: est comme un jeu
  rationale: Le préfixe כְּ marque la comparaison, tandis que שְׂחוֹק peut désigner le rire, l’amusement ou le jeu. « Comme un jeu » exprime naturellement en français que l’insensé traite le mal comme un divertissement.
- source_word: לִכְסִיל
  choice: pour l’insensé
  rationale: 'La préposition לְ indique ici le point de vue ou le rapport : c’est ainsi que l’insensé considère l’acte. « L’insensé » est le terme courant et digne du registre sapiential.'
- source_word: עֲשׂוֹת
  choice: Commettre
  rationale: L’infinitif construit a une fonction substantivale et sert de sujet à la proposition. Avec « le mal », « commettre » est idiomatique et conserve la force morale du propos.
- source_word: זִמָּה
  choice: le mal
  rationale: זִמָּה peut désigner un mauvais dessein, une conduite infâme ou un acte honteux et révoltant, avec parfois une nuance sexuelle selon le contexte. Ici, « le mal » garde le sens éthique général sans imposer une précision absente du verset.
- source_word: וְחָכְמָה
  choice: mais la sagesse
  rationale: Bien que וְ signifie formellement « et », le parallélisme oppose l’insensé à l’homme qui a du discernement. « Mais » rend clairement cette valeur adversative.
- source_word: לְאִישׁ תְּבוּנָה
  choice: est pour l’homme qui a du discernement
  rationale: L’hébreu dit littéralement « à/pour un homme de discernement » et omet le prédicat du second membre. « Est pour » préserve cette ellipse et son ouverture, sans ajouter l’idée plus interprétative que la sagesse serait son plaisir.
theological_decisions:
- issue: Langage masculin représentatif dans אִישׁ
  choice: l’homme qui a du discernement
  alternative: la personne qui a du discernement
  rationale: Le texte hébreu emploie le nom masculin singulier אִישׁ dans une maxime de portée générale. La traduction conserve cette forme masculine représentative sans limiter l’application du proverbe aux seuls hommes.
- issue: Relation elliptique entre la sagesse et l’homme qui a du discernement
  choice: la sagesse est pour l’homme qui a du discernement
  alternative: la sagesse fait la joie de l’homme qui a du discernement
  rationale: Le second membre ne comporte aucun verbe explicite. La formulation retenue maintient cette concision et évite de trancher en faveur d’une relation affective, telle que le plaisir, que le contexte suggère peut-être sans l’énoncer.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme bref du proverbe est conservé, ainsi que l’ellipse du second membre. « Insensé », « sagesse » et « discernement » maintiennent le registre traditionnel de la littérature sapientiale tout en restant compréhensibles aujourd’hui.
