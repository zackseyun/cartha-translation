  source_fidelity: Le titre « Proverbes de Salomon » rend fidèlement le pluriel construit מִשְׁלֵי. Les deux membres conservent le singulier masculin (« fils »), le contraste sapientiel entre חָכָם et כְּסִיל, et le causatif de יְשַׂמַּח (« réjouit »). « Son père » explicite de façon idiomatique en français le référent du père, sans altérer la portée générale du proverbe. Pour תּוּגַת אִמּוֹ, le texte hébreu emploie un prédicat nominal, littéralement « [est] le chagrin de sa mère ».
