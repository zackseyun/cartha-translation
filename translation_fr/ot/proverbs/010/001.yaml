  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: fr
  text: 'Proverbes de Salomon.


    Un fils sage réjouit son père,

    mais un fils insensé est le chagrin de sa mère.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Proverbes de
  rationale: Le pluriel construit de מָשָׁל sert ici de titre à une collection. « Proverbes » est l’équivalent français traditionnel, précis et naturel.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française établie du nom propre hébreu.
- source_word: בֵּן
  choice: un fils
  rationale: Le nom hébreu est explicitement masculin singulier; « fils » conserve cette précision.
- source_word: חָכָם
  choice: sage
  rationale: Dans les Proverbes, חָכָם désigne la sagesse morale et pratique, en contraste avec כְּסִיל.
- source_word: יְשַׂמַּח
  choice: réjouit
  rationale: Le hiphil de שׂמח exprime la causation de la joie. « Réjouit » rend ce sens de façon concise et idiomatique.
- source_word: אָב
  choice: son père
  rationale: Bien que l’hébreu n’ait pas ici de suffixe possessif, le français idiomatique appelle naturellement « son père », parallèlement à « sa mère »; le caractère général du proverbe demeure clair.
- source_word: וּבֵן
  choice: mais un fils
  rationale: Le waw est rendu par « mais » afin d’exprimer clairement le parallélisme antithétique.
- source_word: כְּסִיל
  choice: insensé
  rationale: Dans la littérature sapientielle, le terme désigne une folie morale et pratique plutôt qu’un simple manque d’intelligence. « Insensé » conserve cette portée et le registre proverbial.
- source_word: תּוּגַת
  choice: fait le chagrin de
  rationale: Le nom exprime le chagrin ou la douleur. La tournure verbale française est naturelle et restitue la relation de cause implicite entre le fils insensé et le chagrin maternel.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Le suffixe masculin singulier de troisième personne est explicitement rendu par le possessif « sa ».
