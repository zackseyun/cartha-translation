  - severity: medium
    issue: La note qualifie de littérale une formulation qui ajoute « vers sa ruine ».
    rationale: Le dernier verbe est difficile, mais l’hébreu ne contient pas explicitement « vers sa ruine ». La note devrait signaler l’incertitude sans transformer une interprétation en traduction littérale.
