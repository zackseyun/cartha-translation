  text: קֹ֣רֵֽץ עַ֭יִן יִתֵּ֣ן עַצָּ֑בֶת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/010.yaml
  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: fr
  text: 'Celui qui fait un clin d’œil cause du chagrin,

    et l’insensé en paroles court à sa perte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du dernier verbe hébreu est incertain. Littéralement, la seconde proposition dit : « un insensé des lèvres sera abattu » ou « tombera ». On peut aussi comprendre : « un insensé bavard court à sa perte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: Celui qui cligne de l’œil
  rationale: Le participe substantivé désigne de façon générale une personne qui cligne de l’œil. Cette formulation naturelle conserve l’image hébraïque, qui évoque ici un signe dissimulé ou malveillant.
- source_word: יִתֵּן עַצָּבֶת
  choice: cause du chagrin
  rationale: Le verbe נתן signifie littéralement « donner », mais avec עַצָּבֶת il exprime naturellement l’idée de causer ou d’apporter de la peine. « Chagrin » rend la souffrance émotionnelle sans la limiter à une douleur physique.
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: et l’insensé en paroles
  rationale: Littéralement « un insensé des lèvres ». « L’insensé en paroles » conserve le lien explicite avec la parole et reste compréhensible en français moderne, sans réduire l’expression à un simple bavard.
- source_word: יִלָּבֵט
  choice: court à sa perte
  rationale: Ce verbe rare et difficile indique vraisemblablement la chute ou la ruine. La formulation française exprime ce résultat de manière naturelle sans préciser indûment le mode de la chute.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme proverbial et l’image du clin d’œil sont conservés; l’expression inhabituelle « insensé des lèvres » est rendue par « insensé en paroles », tandis qu’une note signale la difficulté du dernier verbe.
