  text: חֲכָמִ֥ים יִצְפְּנוּ דָ֑עַת וּ/פִֽי אֱ֝וִיל מְחִתָּ֥ה קְרֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: fr
  text: Les sages mettent la connaissance en réserve[a], mais la bouche de l’insensé est une ruine proche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « amassent la connaissance », « thésaurisent le savoir » ou « cachent la connaissance ». Le verbe hébreu évoque le fait de conserver soigneusement quelque chose.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et la bouche de l’insensé : une ruine proche ». La phrase hébraïque ne comporte pas de verbe. Le terme traduit par « ruine » peut aussi désigner la destruction, l’effroi ou la consternation selon le contexte. La conjonction peut également se traduire par « et ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: חֲכָמִים
  choice: Les sages
  rationale: Adjectif substantivé masculin pluriel désignant les personnes sages de façon générique. « Les sages » est naturel dans le style proverbial français.
- source_word: יִצְפְּנוּ
  choice: mettent … en réserve
  rationale: Le verbe צפן peut signifier cacher, conserver ou amasser. Ici, il évoque la conservation prudente du savoir plutôt qu’une dissimulation trompeuse.
- source_word: דָעַת
  choice: le savoir
  rationale: דעת désigne couramment la connaissance dans les Proverbes. « Le savoir » s’intègre naturellement à l’image d’une chose conservée en réserve.
- source_word: וּפִי
  choice: mais la bouche de
  rationale: Le waw peut être simplement copulatif (« et »), mais le parallélisme oppose ici les sages à l’insensé ; « mais » rend clairement cette valeur adversative.
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Terme sapientiel désignant une personne moralement obtuse ou obstinée. « L’insensé » convient au registre proverbial et garde le singulier représentatif.
- source_word: מְחִתָּה
  choice: une ruine
  rationale: Le nom peut exprimer la ruine, la destruction, l’effroi ou la consternation. Dans ce contexte, la calamité menaçante paraît la lecture la plus probable, sans exclure les autres nuances signalées en note.
- source_word: קְרֹבָה
  choice: imminente
  rationale: L’adjectif signifie littéralement « proche ». Avec « ruine », « imminente » exprime naturellement en français l’idée d’un désastre tout proche.
theological_decisions:
- issue: Rapport entre la bouche de l’insensé et la ruine
  choice: « annonce une ruine imminente »
  alternative: « est une ruine imminente » / « approche de la ruine »
  rationale: L’hébreu juxtapose « la bouche de l’insensé » et « ruine proche » sans verbe exprimé. « Annonce » rend prudemment l’idée que sa parole signale ou prépare une calamité, tout en évitant d’identifier directement sa bouche à la ruine.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le rythme antithétique des deux membres est conservé. « Les sages » et « l’insensé » restent des désignations génériques usuelles dans la littérature de sagesse.
