  text: מְכַסֶּ֣ה שִׂ֭נְאָה שִׂפְתֵי שָׁ֑קֶר וּ/מוֹצִ֥א דִ֝בָּ֗ה ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: fr
  text: Qui cache sa haine a des lèvres mensongères[a], et qui répand la calomnie[b] est un insensé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Des lèvres mensongères cachent la haine. » La construction hébraïque permet de prendre « lèvres de mensonge » comme sujet.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un mauvais rapport ». L’expression hébraïque peut désigner plus largement la diffusion d’un propos nuisible, et pas seulement une calomnie au sens strict.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: cache
  rationale: Le participe de כסה signifie couvrir ou dissimuler. « Cache » est naturel en français et conserve l’idée d’une haine tenue secrète.
- source_word: שִׂנְאָה
  choice: haine
  rationale: Le nom désigne la haine ou l’hostilité; « haine » en donne ici l’équivalent direct.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: des lèvres mensongères
  rationale: L’expression construite signifie littéralement « lèvres de mensonge ». Cette formulation conserve l’image hébraïque et présente les lèvres mensongères comme l’attribut de celui qui cache sa haine.
- source_word: וּ/מוֹצִא
  choice: et qui répand
  rationale: Le participe hifil de יצא signifie littéralement « faire sortir »; associé à דִבָּה, il évoque le fait de mettre en circulation un propos nuisible.
- source_word: דִבָּה
  choice: la calomnie
  rationale: Le mot désigne un rapport défavorable ou diffamatoire. « Calomnie » rend clairement sa portée nuisible, tandis qu’une note préserve le sens plus large de « mauvais rapport ».
- source_word: הוּא כְסִיל
  choice: est un insensé
  rationale: כְּסִיל est un terme caractéristique des Proverbes pour une personne moralement obtuse. « Insensé » conserve cette catégorie sapientielle sans la réduire à un manque d’intelligence.
