  text: כֶּ֣סֶף נִ֭בְחָר לְשׁ֣וֹן צַדִּ֑יק לֵ֖ב רְשָׁעִ֣ים כִּ/מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/020.yaml
  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: fr
  text: La langue du juste est de l’argent de choix ; le cœur des méchants est peu de chose[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vaut peu », « est peu » ou « n’est presque rien ». L’hébreu כִּמְעָט est concis et peut exprimer une faible valeur ou le quasi-rien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: argent
  rationale: Le sens concret « argent » préserve l’image du métal précieux et l’évaluation implicite du proverbe.
- source_word: נִבְחָר
  choice: de choix
  rationale: Dans ce contexte, le participe qualifie une matière précieuse sélectionnée pour sa grande qualité ; « de choix » est naturel et digne en français.
- source_word: לְשׁוֹן
  choice: langue
  rationale: Le terme désigne littéralement la langue et, par métonymie, la parole ; conserver l’image corporelle respecte le parallélisme concret.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé singulier désigne la personne juste comme type ; le masculin générique français garde la forme concise du texte.
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » conserve l’image hébraïque et englobe ici la pensée, les dispositions et le caractère moral.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne collectivement ceux dont la conduite est mauvaise ; cette formulation est claire et usuelle.
- source_word: כִּמְעָט
  choice: vaut peu
  rationale: L’expression hébraïque concise indique ici une faible valeur. « Vaut peu » rend explicitement, sans lourdeur, l’évaluation suggérée par l’argent de choix dans le premier membre.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme entre « langue » et « cœur » ainsi que l’image concrète de l’argent sont conservés. La ponctuation met en relief l’antithèse sans ajouter de lien logique absent de l’hébreu.
