source:
  edition: WLC
  text: כַּ/עֲב֣וֹר ס֭וּפָה וְ/אֵ֣ין רָשָׁ֑ע וְ֝/צַדִּ֗יק יְס֣וֹד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: fr
  text: Quand la tempête passe[a], le méchant n’est plus[b], mais le juste est un fondement qui demeure pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme passe une tempête », « Quand passe le tourbillon » ou « Au passage de la tempête ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et il n’y a pas de méchant ». Dans ce contexte, cela peut exprimer qu’il disparaît ou périt.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un fondement durable » ou « un fondement permanent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: Quand … passe
  rationale: La préposition כְּ suivie de l’infinitif construit de עבר introduit ici naturellement une proposition temporelle. « Quand … passe » conserve aussi le mouvement de l’image hébraïque.
- source_word: סוּפָה
  choice: tempête
  rationale: Le terme désigne une violente tempête, éventuellement un tourbillon. « Tempête » est clair en français moderne tout en conservant la force destructrice de l’image.
- source_word: וְאֵין
  choice: n’est plus
  rationale: La formulation hébraïque est littéralement « et il n’y a pas de méchant ». Dans ce contexte, « n’est plus » exprime avec naturel sa disparition ou sa perte sans préciser davantage sa manière de périr.
- source_word: רָשָׁע
  choice: le méchant
  rationale: 'L’adjectif substantivé masculin singulier a ici une valeur représentative et proverbiale : il désigne toute personne méchante, non un homme particulier.'
- source_word: וְצַדִּיק
  choice: mais le juste
  rationale: Le waw relie deux membres fortement contrastés ; « mais » rend naturellement cette opposition. Le singulier « le juste » garde la forme proverbiale et générique de l’hébreu.
- source_word: יְסוֹד
  choice: fondement
  rationale: « Fondement » rend directement l’idée de base ou de fondation. La stabilité est exprimée par le complément עוֹלָם plutôt que par un adjectif ajouté.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Dans ce contexte, le terme exprime une permanence durable. « Pour toujours » conserve la formulation forte de l’hébreu, tandis que la note signale la nuance possible de durée indéfinie.
theological_decisions:
- issue: Valeur générique des masculins singuliers dans la littérature sapientiale
  choice: Conserver les formes proverbiales « le méchant » et « le juste » avec une portée générique.
  alternative: « La personne méchante … la personne juste » ou « les méchants … les justes ».
  rationale: Les singuliers hébreux décrivent deux catégories humaines et ne limitent pas l’énoncé aux hommes. En français, « le méchant » et « le juste » restent des désignations génériques naturelles et préservent le parallélisme singulier du texte.
- issue: Portée temporelle de עוֹלָם
  choice: « pour toujours », sans définir ici la nature métaphysique ou eschatologique de cette permanence.
  alternative: « durable » ou « permanent ».
  rationale: Le proverbe oppose la disparition du méchant à la stabilité du juste. La traduction conserve cette affirmation forte sans imposer une doctrine précise sur la vie éternelle.
translation_notes:
  register: Français international moderne, sobre et proverbial. La phrase conserve le contraste bref et équilibré de l’hébreu ainsi que l’image concrète de la tempête et du fondement.
