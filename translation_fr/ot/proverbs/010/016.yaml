id: PRO.10.16
reference: Proverbs 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: fr
  text: Le travail du juste conduit à la vie[a] ; le revenu du méchant conduit au péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est destiné à la vie » ou « aboutit à la vie ». La préposition hébraïque peut indiquer le but, la destination ou le résultat.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « péché » peut aussi désigner un « sacrifice pour le péché » dans des contextes cultuels ; ici, le contexte indique le péché.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: le travail
  rationale: פְּעֻלָּה peut désigner le travail, l’activité ou son produit, voire le salaire. « Travail » préserve ici le sens large et forme un parallèle naturel avec תְּבוּאַת.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé au singulier représente le type humain du juste ; le masculin générique est naturel dans la forme proverbiale française.
- source_word: לְחַיִּים
  choice: conduit à la vie
  rationale: La préposition לְ peut exprimer la destination, le but ou le résultat. « Conduit à » rend naturellement cette orientation sans trancher excessivement entre but et conséquence.
- source_word: תְּבוּאַת
  choice: le revenu
  rationale: תְּבוּאָה désigne une récolte, un produit ou ce que rapporte une activité. « Revenu » convient au contraste avec le travail et conserve l’idée de ce qui est obtenu, sans limiter le propos à l’agriculture.
- source_word: רָשָׁע
  choice: du méchant
  rationale: Comme צַדִּיק, le substantif adjectival singulier présente un type humain représentatif. « Méchant » est courant et clair dans le registre sapientiel.
- source_word: לְחַטָּאת
  choice: conduit au péché
  rationale: Dans ce contexte sapientiel, חַטָּאת désigne le péché plutôt qu’un sacrifice pour le péché. La même tournure que dans le premier membre restitue le parallélisme hébreu.
theological_decisions:
- issue: Sens de חַטָּאת
  choice: péché
  alternative: sacrifice pour le péché
  rationale: Bien que חַטָּאת puisse désigner un sacrifice pour le péché dans un contexte cultuel, ce proverbe oppose les conséquences morales de la conduite du juste et de celle du méchant ; aucun élément sacrificiel n’est présent.
- issue: Valeur de la préposition לְ dans les deux membres
  choice: conduit à
  alternative: est destiné à / a pour résultat
  rationale: L’hébreu permet une nuance de destination, de finalité ou de résultat. « Conduit à » maintient cette tension et exprime l’orientation morale du proverbe sans imposer une causalité mécanique.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme des deux membres est rendu par la répétition de « conduit à ». « Revenu » exprime largement ce que rapporte l’activité du méchant ; « produit », « rendement » ou « récolte » seraient également possibles.
