  yaml_path: translation/ot/proverbs/010/026.yaml
  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: fr
  text: Comme le vinaigre aux dents et la fumée aux yeux, ainsi est le paresseux pour ceux qui l’envoient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹמֶץ
  choice: vinaigre
  rationale: Le nom désigne une substance aigre, couramment du vinaigre. « Vinaigre » restitue naturellement l’effet désagréable évoqué dans la comparaison; « vin aigre » reste possible, mais n’a pas besoin d’être signalé puisqu’il renvoie ici au même produit.
- source_word: לַשִּׁנַּיִם
  choice: pour les dents
  rationale: La préposition ל exprime ici le rapport et l’effet. « Pour les dents » conserve la structure parallèle du texte hébreu dans un français naturel.
- source_word: עָשָׁן
  choice: fumée
  rationale: Équivalent direct qui garde l’image concrète de l’irritation des yeux.
- source_word: לָעֵינַיִם
  choice: pour les yeux
  rationale: Cette formulation répond à « pour les dents » et préserve le parallélisme hébreu.
- source_word: כֵּן
  choice: ainsi est
  rationale: Le corrélatif introduit l’application de la double comparaison. « Ainsi est » rend explicite la copule sous-entendue tout en conservant la forme sentencieuse.
- source_word: הֶעָצֵל
  choice: le paresseux
  rationale: L’adjectif substantivé désigne une personne caractérisée par la paresse. « Le paresseux » est clair, actuel et conforme au type moral récurrent des Proverbes.
- source_word: לְשֹׁלְחָיו
  choice: pour ceux qui l’envoient
  rationale: Le participe pluriel muni d’un suffixe masculin singulier signifie littéralement « pour ceux qui l’envoient ». Cette traduction conserve à la fois le pluriel des mandants et le singulier de leur envoyé.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La syntaxe parallèle « pour les dents… pour les yeux… pour ceux qui l’envoient » maintient la cohésion formelle de l’hébreu sans devenir obscure.
