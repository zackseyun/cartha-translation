  text: אֹגֵ֣ר בַּ֭/קַּיִץ בֵּ֣ן מַשְׂכִּ֑יל נִרְדָּ֥ם בַּ֝/קָּצִ֗יר בֵּ֣ן מֵבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: fr
  text: Celui qui amasse en été est un fils avisé[a][b], mais celui qui dort pendant la moisson est un fils qui fait honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui met de côté en été est un fils qui agit avec sagesse. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « fils » est au masculin singulier. Dans les Proverbes, il a souvent une portée représentative, tout en conservant la forme d’une instruction adressée par un père à son fils.
    reason: cultural_note
lexical_decisions:
- source_word: אֹגֵר
  choice: amasse
  rationale: Le participe désigne l’action de rassembler les produits de la terre. « Amasse » reste naturel en français et n’impose pas l’idée plus précise d’un entreposage.
- source_word: בַּקַּיִץ
  choice: en été
  rationale: Cette expression temporelle désigne la saison propice au rassemblement des récoltes ; « en été » est concis et idiomatique.
- source_word: בֵּן
  choice: fils
  rationale: L’hébreu emploie explicitement le masculin singulier et conserve ici la forme d’instruction de père à fils propre aux Proverbes.
- source_word: מַשְׂכִּיל
  choice: avisé
  rationale: Le participe exprime une intelligence pratique manifestée par une conduite judicieuse. « Avisé » convient à l’action accomplie au bon moment.
- source_word: נִרְדָּם
  choice: dort
  rationale: Le participe nifal décrit celui qui dort au moment où il devrait travailler. « Dort » rend directement et naturellement le contraste proverbial.
- source_word: בַּקָּצִיר
  choice: pendant la moisson
  rationale: La locution situe l’action au moment décisif de la récolte ; cette formulation en communique clairement la valeur temporelle.
- source_word: מֵבִישׁ
  choice: qui fait honte
  rationale: 'Le participe hiphil a une valeur causative : ce fils provoque la honte, vraisemblablement pour sa famille. « Qui fait honte » conserve cette nuance sans ajouter un complément absent de l’hébreu.'
