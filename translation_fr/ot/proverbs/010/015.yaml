  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ מְחִתַּ֖ת דַּלִּ֣ים רֵישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: fr
  text: La fortune du riche est sa ville fortifiée[a] ; la ruine[b] des pauvres, c’est leur pauvreté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la ville de sa force » ; on pourrait aussi traduire : « sa ville forte ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « destruction » ou, moins probablement ici, « effroi » ou « consternation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: fortune
  rationale: Le terme désigne les biens matériels ou la richesse. « Fortune » est naturel en français et convient au contraste économique du proverbe.
- source_word: עָשִׁיר
  choice: du riche
  rationale: L’adjectif substantivé est au masculin singulier. « Du riche » conserve cette forme et exprime clairement le rapport avec sa fortune.
- source_word: קִרְיַת עֻזּוֹ
  choice: sa ville fortifiée
  rationale: L’expression signifie littéralement « la ville de sa force ». « Sa ville fortifiée » rend naturellement l’image d’un lieu procurant force et sécurité, sans la réduire à une simple comparaison.
- source_word: מְחִתַּת
  choice: ruine
  rationale: Le nom peut évoquer la ruine, la destruction, l’effroi ou la consternation. Dans le parallélisme économique, « ruine » exprime au mieux l’idée que la pauvreté cause la perte des pauvres.
- source_word: דַּלִּים
  choice: des pauvres
  rationale: Le terme désigne des personnes pauvres, faibles ou de condition modeste. « Les pauvres » est ici concis et correspond au contraste avec « le riche ».
- source_word: רֵישָׁם
  choice: leur pauvreté
  rationale: Le nom désigne la pauvreté ou le dénuement. Cette traduction directe maintient le parallélisme et l’idée que leur manque les expose à la ruine.
