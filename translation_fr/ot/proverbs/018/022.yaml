  text: מָצָ֣א אִ֭שָּׁה מָ֣צָא ט֑וֹב וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: fr
  text: 'Celui qui trouve une épouse trouve ce qui est bon

    et obtient la faveur de Yahweh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Celui qui trouve une femme trouve un bien et obtient la faveur de Yahweh. » L’hébreu emploie le masculin singulier dans un sens proverbial et représentatif.'
    reason: Signale les rendus plus littéraux possibles de אִשָּׁה et טוֹב ainsi que la valeur générique de la forme masculine.
lexical_decisions:
- source_word: מָצָא
  choice: trouve
  rationale: 'Le parfait qal a ici une valeur gnomique : le présent français exprime naturellement cette vérité proverbiale.'
- source_word: אִשָּׁה
  choice: une femme
  rationale: Dans ce contexte matrimonial, le terme désigne une femme en tant qu’épouse. « Une femme » reste naturel en français et conserve la formulation concise de l’hébreu.
- source_word: טוֹב
  choice: le bonheur
  rationale: L’adjectif substantivé désigne ici quelque chose de bon, un bien. « Le bonheur » rend avec naturel la valeur positive et globale de la formule sans en faire un objet matériel.
- source_word: וַיָּפֶק
  choice: obtient
  rationale: Le verbe exprime ici le fait d’acquérir ou de recevoir. « Obtient » convient au parallélisme avec « trouve ».
- source_word: רָצוֹן
  choice: la faveur
  rationale: En rapport avec Dieu, רָצוֹן désigne sa bienveillance ou son agrément ; « faveur » en donne un équivalent français précis et théologiquement neutre.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: La préposition מִן marque la provenance, et le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: sujet implicite de מָצָא
  choice: Celui qui
  rationale: Le verbe hébreu est au masculin singulier et formule une maxime représentative. « Celui qui » maintient cette forme masculine dans un français proverbial naturel.
theological_decisions:
- issue: Sujet masculin générique du proverbe
  choice: Celui qui trouve une femme
  alternative: Qui trouve une épouse
  rationale: « Celui qui » reflète le masculin singulier de l’hébreu tout en gardant la portée générale d’une maxime.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Portée de טוֹב
  choice: trouve le bonheur
  alternative: trouve un bien
  rationale: L’hébreu substantivé reste large. « Le bonheur » exprime idiomatiquement en français le bien trouvé dans le mariage, tandis que « un bien » serait plus formel mais moins naturel.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme des deux propositions est conservé, ainsi que le nom divin sous la forme « Yahweh ».
