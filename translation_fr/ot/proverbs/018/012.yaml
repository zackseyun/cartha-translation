id: PRO.18.12
reference: Proverbs 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֭בֶר יִגְבַּ֣הּ לֵב אִ֑ישׁ וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: fr
  text: Avant la ruine, le cœur de l’homme s’élève[a] ; avant l’honneur vient l’humilité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « devient orgueilleux ». Littéralement : « s’élève ».'
    reason: La note explicite le sens figuré probable tout en signalant l’image concrète conservée dans le texte.
lexical_decisions:
- source_word: לִפְנֵי
  choice: avant
  rationale: La préposition a ici un sens temporel et introduit, dans chacun des deux membres, ce qui précède la ruine ou l’honneur.
- source_word: שֶׁבֶר
  choice: la ruine
  rationale: Dans ce contexte sapientiel, le nom évoque un effondrement ou un désastre, non une fracture matérielle. « Ruine » est naturel et concis en français.
- source_word: יִגְבַּהּ
  choice: s’élève
  rationale: Le verbe signifie littéralement « être haut, s’élever ». Associé au cœur, il exprime l’orgueil, mais « s’élève » conserve l’image hébraïque et sa tension avec l’humilité.
- source_word: לֵב אִישׁ
  choice: le cœur de l’homme
  rationale: Cette formulation garde le masculin singulier générique du proverbe hébreu tout en restant idiomatique dans un registre biblique français actuel.
- source_word: כָבוֹד
  choice: l’honneur
  rationale: Ici, le terme désigne la considération ou la dignité accordée à quelqu’un plutôt que la gloire divine.
- source_word: עֲנָוָה
  choice: l’humilité
  rationale: Le nom désigne l’abaissement ou la disposition humble et forme le contraste éthique direct avec le cœur qui s’élève.
theological_decisions:
- issue: Masculin générique אִישׁ dans un énoncé proverbial
  choice: le cœur de l’homme
  alternative: le cœur humain ; le cœur d’une personne
  rationale: L’hébreu emploie un nom masculin singulier à portée générique. La traduction conserve cette forme représentative sans limiter le principe aux seuls hommes de sexe masculin.
- issue: Image du cœur élevé
  choice: s’élève
  alternative: devient orgueilleux ; est hautain
  rationale: Le contexte implique l’orgueil, mais la traduction littérale intelligible préserve l’image hébraïque au lieu de réduire le verbe à une seule interprétation psychologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme « Avant… ; avant… » est maintenu, ainsi que la concision de l’hébreu. L’inversion naturelle du second membre avec « vient » rend explicite la relation temporelle sans ajout doctrinal.
