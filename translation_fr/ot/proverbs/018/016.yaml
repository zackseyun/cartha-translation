source:
  edition: WLC
  text: מַתָּ֣ן אָ֭דָם יַרְחִ֣יב ל֑/וֹ וְ/לִ/פְנֵ֖י גְדֹלִ֣ים יַנְחֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/016.yaml
  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: fr
  text: Le cadeau de quelqu’un lui ouvre la voie[a] et le conduit devant les grands[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « élargit pour lui » ou « lui fait de la place ».'
    reason: literal_rendering
  - marker: b
    text: 'Ou : « devant des personnes importantes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: cadeau
  rationale: Le nom désigne un don ou un présent offert à quelqu’un. « Cadeau » est naturel en français moderne et convient à l’idée concrète du proverbe.
- source_word: אָדָם
  choice: de quelqu’un
  rationale: Le singulier est ici générique et désigne une personne quelconque. « De quelqu’un » rend cette portée sans imposer un masculin marqué ni une lecture collective.
- source_word: יַרְחִיב לוֹ
  choice: lui ouvre la voie
  rationale: Le hiphil de רחב signifie littéralement « élargir, faire de la place ». L’expression française conserve l’image d’un accès rendu possible tout en restant idiomatique.
- source_word: וְלִפְנֵי גְדֹלִים
  choice: devant les grands
  rationale: לִפְנֵי signifie « devant, en présence de », tandis que גְדֹלִים désigne ici des personnes éminentes ou puissantes. « Les grands » est concis, naturel et préserve la formulation générale.
- source_word: יַנְחֶנּוּ
  choice: le conduit
  rationale: Le hiphil de נחה signifie « conduire, guider ». « Le conduit » conserve l’action exprimée par l’hébreu sans la réduire au seul résultat.
theological_decisions: []
