  text: שִׂפְתֵ֣י כְ֭סִיל יָבֹ֣אֽוּ בְ/רִ֑יב וּ֝/פִ֗י/ו לְֽ/מַהֲלֻמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/006.yaml
  text: A fool’s lips enter into strife[b][a], and his mouth calls for blows.
translation:
  language: fr
  text: Les lèvres de l’insensé s’engagent dans une querelle[a], et sa bouche appelle les coups[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entrent dans la dispute ».
    reason: lexical_alternative
  - marker: b
    text: Ou « invite à le frapper ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: les lèvres
  rationale: Le sens concret est conservé comme métonymie de la parole; il maintient aussi le parallélisme poétique avec « bouche ».
- source_word: כְסִיל
  choice: l’insensé
  rationale: Dans les Proverbes, le terme désigne une personne moralement et pratiquement dépourvue de sagesse, et non simplement quelqu’un de peu intelligent.
- source_word: יָבֹאוּ
  choice: s’engagent
  rationale: Avec בְרִיב, le verbe exprime l’entrée ou l’implication dans un conflit; « s’engagent » est naturel en français tout en gardant cette dynamique.
- source_word: בְרִיב
  choice: dans une querelle
  rationale: רִיב désigne une dispute, une contestation ou une querelle; ce choix convient au contexte interpersonnel.
- source_word: פִיו
  choice: sa bouche
  rationale: Le terme concret préserve l’image corporelle et le parallélisme avec « les lèvres ».
- source_word: לְמַהֲלֻמוֹת
  choice: les coups
  rationale: Le nom évoque des coups portés; cette traduction concise conserve la conséquence physique suggérée.
- source_word: יִקְרָא
  choice: appelle
  rationale: La formulation garde au verbe son sens direct d’appeler ou de réclamer, tout en permettant l’idée idiomatique que les paroles attirent les coups.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve les images hébraïques des lèvres et de la bouche ainsi que le parallélisme des deux membres. Les notes signalent les principales possibilités idiomatiques sans éliminer l’ambiguïté quant au fait d’appeler littéralement les coups ou de les attirer par sa conduite.
