  text: אָ֗ח נִפְשָׁ֥ע מִ/קִּרְיַת עֹ֑ז ו/מדונים כִּ/בְרִ֥יחַ אַרְמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: fr
  text: Un frère offensé est plus inaccessible qu’une ville fortifiée[a], et les différends sont comme la barre d’une citadelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Un frère lésé est plus inaccessible qu’une ville fortifiée ». Le participe hébreu peut désigner quelqu’un qui a subi un tort ou qui s’est senti offensé.
    reason: lexical_alternative
  - marker: b
    text: Ou « les différends sont comme la barre d’un palais ». Le dernier mot hébreu peut désigner une citadelle ou un palais ; l’image défensive du contexte favorise « citadelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: un frère
  rationale: Le nom signifie d’abord « frère » et peut aussi désigner un proche. Garder « frère » préserve l’image concrète et la force relationnelle du proverbe.
- source_word: נִפְשָׁע
  choice: offensé
  rationale: Le participe de פשע décrit ici vraisemblablement une personne lésée ou avec laquelle la relation a été rompue. « Offensé » est naturel en français et laisse ouverte la nature exacte du tort.
- source_word: מִקִּרְיַת עֹז
  choice: plus difficile à gagner qu’une ville fortifiée
  rationale: La préposition מן porte une comparaison, tandis que « ville de force » désigne une ville défendue. Le verbe « gagner », implicite dans la formulation hébraïque elliptique, exprime naturellement l’idée de reconquérir la faveur du frère sans effacer l’image militaire.
- source_word: וּמְדֹנִים
  choice: et les querelles
  rationale: Le pluriel désigne des disputes ou des différends. « Querelles » est actuel, clair et adapté au parallélisme proverbial.
- source_word: כִּבְרִיחַ
  choice: sont comme la barre de
  rationale: בְּרִיחַ désigne au singulier une barre ou un verrou servant à fermer une porte. Le singulier « la barre » respecte la forme hébraïque et conserve l’image d’un obstacle qui bloque l’accès.
- source_word: אַרְמוֹן
  choice: une citadelle
  rationale: Le terme peut désigner un palais ou une résidence fortifiée. Dans ce contexte de ville forte et de barre défensive, « citadelle » rend au mieux l’image, sans supprimer l’autre possibilité lexicale signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. La formulation conserve le parallélisme et l’imagerie défensive. L’ellipse de l’hébreu est explicitée par « plus difficile à gagner », tournure française qui vise la restauration de la relation plutôt que la conquête physique.
