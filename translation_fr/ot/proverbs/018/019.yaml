  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : אָח נִפְשָׁע évoque un frère offensé/lésé, comparé à une ville fortifiée, et les différends à une barre de fermeture. Toutefois, l''hébreu ne comporte pas de verbe explicite équivalant à « gagner » ; cette explicitation interprétative peut être évitée en français tout en conservant l''ellipse proverbiale. Le second membre porte littéralement « les querelles [sont] comme la barre d''un palais/citadelle » ; le singulier « barre » est approprié.'
  naturalness: « Plus inaccessible qu’une ville fortifiée » est idiomatique, concis et naturel dans un proverbe français. Il exprime l'image comparative sans ajouter l'idée spécifique de reconquérir quelqu'un. « Les querelles sont comme la barre d’une citadelle » reste compréhensible, mais « les différends » convient un peu mieux au substantif abstrait pluriel et au registre proverbial.
  terminology: « Frère » conserve l'image relationnelle de אָח. « Offensé » est défendable, avec « lésé » en alternative. « Ville fortifiée », « barre » et « citadelle » sont fidèles à l'imagerie. La note sur אַרְמוֹן doit garder « palais » comme possibilité lexicale, sans présenter « citadelle » comme certaine.
  issues:
