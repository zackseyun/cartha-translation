    issue: « plus difficile à gagner » explicite un verbe absent du texte hébreu.
    rationale: La formule anglaise traditionnelle « harder to win » représente une compréhension possible de l'ellipse, mais le français peut préserver plus directement l'image et l'ambiguïté par « plus inaccessible ». « Gagner » introduit plus précisément l'idée de regagner la personne ou sa faveur.
  - severity: low
    issue: « querelles » est possible, mais « différends » est plus proche du registre abstrait de מְדָנִים.
    rationale: Le terme hébreu vise les disputes/contentions ; « différends » est sobre et proverbial, sans réduire nécessairement l'image à des altercations ponctuelles.
