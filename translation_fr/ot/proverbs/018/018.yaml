source:
  edition: WLC
  text: מִ֭דְיָנִים יַשְׁבִּ֣ית הַ/גּוֹרָ֑ל וּ/בֵ֖ין עֲצוּמִ֣ים יַפְרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: fr
  text: Le tirage au sort met fin aux disputes[a] et sépare les puissants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « règle les différends et départage les puissants ».

      '
    reason: Alternative plus interprétative qui explicite la fonction d’arbitrage du tirage au sort.
lexical_decisions:
- source_word: מִדְיָנִים
  choice: disputes
  rationale: Le pluriel désigne des querelles ou des différends, éventuellement de nature judiciaire. « Disputes » est actuel et garde cette amplitude.
- source_word: יַשְׁבִּית
  choice: met fin à
  rationale: Le hifil de שבת exprime ici l’idée de faire cesser. « Met fin à » rend clairement cette valeur causative.
- source_word: הַגּוֹרָל
  choice: le tirage au sort
  rationale: גורל désigne le lot employé pour prendre une décision. En français moderne, « tirage au sort » communique plus immédiatement la pratique que le seul mot « sort ».
- source_word: וּבֵין
  choice: et… même
  rationale: בֵּין marque normalement la relation entre les parties. Avec יַפְרִיד, le français idiomatique exprime cette relation directement par « séparer les puissants »; « même » fait ressortir la force concessive suggérée par le parallélisme, sans l’imposer comme seul sens possible.
- source_word: עֲצוּמִים
  choice: les puissants
  rationale: L’adjectif substantivé désigne des personnes fortes ou puissantes, sans imposer le genre masculin en français.
- source_word: יַפְרִיד
  choice: sépare
  rationale: Le hifil de פרד signifie concrètement séparer ou diviser. « Sépare » préserve cette image, tout en laissant entendre son effet d’arbitrage dans le contexte.
theological_decisions: []
translation_notes:
  register: Style proverbial, concis et digne. « Tirage au sort » est préféré à « le sort » pour éviter, en français courant, une possible confusion avec le destin. La traduction principale conserve l’image concrète de la séparation; la note donne la lecture judiciaire plus explicite.
