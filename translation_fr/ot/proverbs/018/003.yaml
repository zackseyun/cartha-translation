id: PRO.18.3
reference: Proverbs 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּֽ/בוֹא רָ֭שָׁע בָּ֣א גַם בּ֑וּז וְֽ/עִם קָל֥וֹן חֶרְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/003.yaml
  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: fr
  text: Quand vient le méchant, vient aussi le mépris ; et avec la honte, l’opprobre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא
  choice: Quand vient
  rationale: La préposition ב suivie de l’infinitif construit de בוא exprime ici une circonstance temporelle. « Quand vient » est naturel en français et conserve la répétition du verbe dans le premier membre.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le terme hébreu est un adjectif substantivé masculin singulier désignant une personne méchante, employée comme figure représentative dans le proverbe. Le traduire par « le méchant » respecte mieux sa valeur personnelle que l’abstrait « la méchanceté ».
- source_word: בָּא
  choice: vient
  rationale: 'La reprise de la racine בוא produit une insistance : quand le méchant vient, le mépris vient lui aussi. La répétition de « vient » restitue cet effet.'
- source_word: גַם
  choice: aussi
  rationale: La particule ajoute le mépris comme réalité concomitante ; « aussi » en exprime clairement la valeur additive.
- source_word: בּוּז
  choice: le mépris
  rationale: Le nom désigne le mépris ou la dérision. « Mépris » conserve sa forme abstraite et convient au parallélisme avec « honte » et « opprobre ».
- source_word: וְעִם
  choice: et avec
  rationale: Cette traduction rend à la fois la conjonction et la préposition d’accompagnement, tout en maintenant le parallélisme du texte hébreu.
- source_word: קָלוֹן
  choice: la honte
  rationale: קָלוֹן évoque la honte, le déshonneur ou l’ignominie, notamment dans leur dimension publique. « Honte » est courant, digne et distinct du terme final.
- source_word: חֶרְפָּה
  choice: l’opprobre
  rationale: חֶרְפָּה désigne le déshonneur, l’outrage ou le reproche public. « Opprobre » rend fortement cette dimension sociale et évite de confondre le mot avec קָלוֹן.
theological_decisions:
- issue: Valeur concrète ou abstraite de רָשָׁע
  choice: le méchant
  alternative: la méchanceté
  rationale: La morphologie hébraïque indique normalement une personne méchante au masculin singulier, et non le nom abstrait « méchanceté ». La formulation proverbiale reste générale sans effacer cette distinction.
translation_notes:
  register: Français international moderne, concis et sentencieux. L’inversion « Quand vient le méchant, vient aussi le mépris » conserve la répétition et le rythme du premier membre hébreu. « Opprobre » relève d’un registre soutenu mais demeure précis et intelligible dans un texte sapientiel.
