  text: פִּֽי כְ֭סִיל מְחִתָּה ל֑/וֹ וּ֝/שְׂפָתָ֗י/ו מוֹקֵ֥שׁ נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: fr
  text: La bouche de l’insensé est sa ruine[a], et ses lèvres sont un piège pour sa vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La bouche de l’insensé est pour lui une destruction ».
    reason: lexical_alternative
  - marker: b
    text: Hébreu « son âme » ; le mot peut désigner ici sa vie ou sa personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: la bouche
  rationale: Conserve l’image concrète de l’hébreu, où la bouche représente les paroles qui en sortent.
- source_word: כְסִיל
  choice: l’insensé
  rationale: Terme courant dans la littérature sapientiale française; il exprime une folie morale et pratique, non un simple manque d’intelligence.
- source_word: מְחִתָּה
  choice: ruine
  rationale: Dans ce contexte, le nom désigne la ruine ou la destruction que les paroles de l’insensé lui attirent; «ruine» s’accorde naturellement avec le parallélisme du piège.
- source_word: לוֹ
  choice: sa
  rationale: Le datif hébreu, littéralement «pour lui» ou «à lui», est rendu idiomatiquement par une relation possessive en français.
- source_word: וּשְׂפָתָיו
  choice: et ses lèvres
  rationale: Préserve l’image corporelle et le parallélisme poétique avec «la bouche».
- source_word: מוֹקֵשׁ
  choice: un piège
  rationale: Rend clairement la métaphore d’un dispositif qui capture et met en péril.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: נֶפֶשׁ désigne ici vraisemblablement la vie ou la personne elle-même, plutôt qu’une âme immatérielle au sens étroit.
theological_decisions:
- issue: Sens anthropologique de נַפְשׁוֹ
  choice: sa vie
  alternative: son âme; lui-même
  rationale: «Sa vie» communique l’usage hébreu contextuel sans imposer une distinction théologique ultérieure entre l’âme et le corps; une note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme concret «bouche / lèvres» est conservé. «Insensé» maintient la portée morale propre aux Proverbes, tandis que «cause sa ruine» explicite naturellement en français la relation exprimée par le datif hébreu.
