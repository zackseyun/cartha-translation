  text: לֹֽא יַחְפֹּ֣ץ כְּ֭סִיל בִּ/תְבוּנָ֑ה כִּ֝֗י אִֽם בְּ/הִתְגַּלּ֥וֹת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/002.yaml
  text: A fool does not delight in understanding[a], but only in revealing his heart.
translation:
  language: fr
  text: L’insensé ne prend pas plaisir au discernement, mais plutôt à révéler ce qu’il a dans le cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « mais plutôt à exposer son cœur ». Ici, le « cœur » désigne les pensées, les intentions et les inclinations intérieures, et non pas uniquement les émotions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: ne prend pas plaisir
  rationale: Le verbe חפץ exprime ici le plaisir ou l’attrait volontaire. Cette formulation conserve cette nuance tout en restant naturelle en français.
- source_word: כְּסִיל
  choice: l’insensé
  rationale: Dans les Proverbes, כְּסִיל désigne une personne moralement et intellectuellement réfractaire à la sagesse, et non une personne simplement peu intelligente. « L’insensé » est le terme traditionnel et précis dans ce registre sapiential.
- source_word: תְבוּנָה
  choice: discernement
  rationale: Le nom תְבוּנָה évoque l’intelligence capable de comprendre et de distinguer avec justesse. « Discernement » convient au contexte de la sagesse et évite de réduire le sens à l’acquisition de connaissances.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: Cette construction marque un contraste exclusif entre ce qui ne plaît pas à l’insensé et ce qui lui plaît effectivement.
- source_word: בְּהִתְגַּלּוֹת
  choice: à dévoiler
  rationale: Issu de גלה, le terme exprime l’action de découvrir, manifester ou rendre visible. « Dévoiler » préserve cette image sans préciser indûment si la révélation est sincère, indiscrète ou présomptueuse.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Dans l’anthropologie hébraïque, le cœur représente l’être intérieur, notamment les pensées, les intentions et les inclinations. La traduction littérale conserve cette richesse sémantique.
theological_decisions:
- issue: Portée de « cœur »
  choice: Conserver « son cœur » dans le texte et en préciser le sens dans une note.
  alternative: « ce qu’il pense » ou « le fond de sa pensée »
  rationale: Les reformulations explicatives seraient plus immédiatement claires, mais elles réduiraient le champ de לֵב à la seule pensée et supprimeraient l’image hébraïque.
translation_notes:
  register: Français moderne, sobre et sapiential. « L’insensé » maintient le vocabulaire caractéristique des Proverbes; « dévoiler son cœur » conserve l’image concise de l’hébreu, tandis que la note prévient une lecture limitée aux émotions.
