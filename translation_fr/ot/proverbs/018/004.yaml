  text: מַ֣יִם עֲ֭מֻקִּים דִּבְרֵ֣י פִי אִ֑ישׁ נַ֥חַל נֹ֝בֵ֗עַ מְק֣וֹר חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: fr
  text: Les paroles de la bouche d’un homme sont des eaux profondes[a] ; la source de la sagesse est un ruisseau qui jaillit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Les paroles de la bouche d’un homme sont des eaux profondes, un ruisseau qui jaillit, une source de sagesse. » L’hébreu permet de comprendre que les deux images suivantes décrivent elles aussi les paroles, plutôt que de faire de la seconde ligne une affirmation distincte sur la sagesse.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: des eaux profondes
  rationale: Conserve l’image concrète et le pluriel poétique de l’hébreu sans expliciter indûment l’idée de profondeur intellectuelle.
- source_word: דִּבְרֵי
  choice: les paroles
  rationale: Rend directement le pluriel construit et convient naturellement aux propos qui sortent de la bouche.
- source_word: פִי אִישׁ
  choice: de la bouche d’un homme
  rationale: Suit étroitement la construction hébraïque et conserve le masculin singulier proverbial de אִישׁ.
- source_word: נַחַל נֹבֵעַ
  choice: un torrent jaillissant
  rationale: נַחַל désigne un cours d’eau, parfois un torrent ou un oued, tandis que נֹבֵעַ évoque l’eau qui sourd ou jaillit. Cette formulation française garde l’image vive d’une eau en mouvement.
- source_word: מְקוֹר חָכְמָה
  choice: la source de la sagesse
  rationale: « Source » conserve la métaphore aquatique de מְקוֹר et son sens possible d’origine, tout en restant naturel en français.
theological_decisions:
- issue: Rapport syntaxique entre les deux images aquatiques
  choice: Lire le second hémistiche comme une affirmation distincte sur la source de la sagesse.
  alternative: Lire « un torrent jaillissant, une source de sagesse » comme deux appositions décrivant les paroles de l’homme.
  rationale: L’absence de copule et la poésie condensée permettent les deux analyses. Le texte principal suit le parallélisme traditionnel, tandis que la note préserve l’autre lecture sans trancher une ambiguïté réelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Torrent jaillissant » privilégie une image poétique vive ; la ponctuation garde les deux membres du proverbe tout en signalant leur parallélisme.
