  text: גַּ֭ם מִתְרַפֶּ֣ה בִ/מְלַאכְתּ֑/וֹ אָ֥ח ה֝֗וּא לְ/בַ֣עַל מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/009.yaml
  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: fr
  text: Même celui qui se relâche dans son travail est frère de celui qui détruit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est frère d’un maître de la destruction ». L’expression hébraïque peut désigner soit une personne caractérisée par la destruction, soit, plus concrètement, quelqu’un qui détruit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: Marque avec force l’inclusion et souligne le rapprochement surprenant entre le travailleur négligent et le destructeur.
- source_word: מִתְרַפֶּה
  choice: celui qui se relâche
  rationale: Le participe hitpael de רפה décrit quelqu’un qui se laisse aller au relâchement ou à la négligence, plutôt qu’une simple incapacité.
- source_word: בִמְלַאכְתּוֹ
  choice: dans son travail
  rationale: Expression naturelle en français moderne qui conserve le domaine dans lequel se manifeste le relâchement.
- source_word: אָח הוּא
  choice: est frère de
  rationale: Conserve la métaphore concrète de parenté, qui exprime une étroite ressemblance de caractère ou d’effet.
- source_word: לְבַעַל מַשְׁחִית
  choice: de celui qui détruit
  rationale: בַּעַל peut désigner une personne caractérisée par ce qui suit, tandis que מַשְׁחִית peut s’entendre comme un destructeur. Cette formulation est naturelle et préserve l’idée d’une personne vouée à la destruction.
