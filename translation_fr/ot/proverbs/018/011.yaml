source:
  edition: WLC
  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ וּ/כְ/חוֹמָ֥ה נִ֝שְׂגָּבָ֗ה בְּ/מַשְׂכִּיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: fr
  text: 'La fortune du riche est sa ville forte,

    et elle est comme une haute muraille dans son imagination.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son esprit », « à ses yeux » ou « dans la représentation qu’il s’en fait ». Le terme hébreu évoque une image ou une manière de voir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: fortune
  rationale: Désigne les richesses ou les biens matériels. « Fortune » est naturel en français moderne et convient à la formulation générale du proverbe.
- source_word: עָשִׁיר
  choice: du riche
  rationale: L’adjectif substantivé désigne ici une personne riche au masculin singulier. « Du riche » conserve cette forme concise et générique.
- source_word: קִרְיַת עֻזּוֹ
  choice: sa ville forte
  rationale: Littéralement « la ville de sa force ». « Sa ville forte » préserve l’image urbaine fortifiée et son rôle de refuge protecteur.
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: et comme une haute muraille
  rationale: « Muraille » rend naturellement חוֹמָה dans le contexte d’une ville fortifiée; « haute » conserve l’idée d’élévation, avec la sécurité inaccessible qu’elle peut suggérer sans l’expliciter.
- source_word: בְּמַשְׂכִּיתוֹ
  choice: dans son imagination
  rationale: Le nom peut évoquer une image ou représentation mentale. Ici, il situe la muraille dans la manière dont le riche se représente sa sécurité, tout en laissant ouverte la question du caractère illusoire de cette perception.
theological_decisions:
- issue: La richesse est-elle réellement une protection ou seulement perçue comme telle ?
  choice: Conserver le contraste implicite en plaçant la haute muraille « dans son imagination ».
  alternative: Traduire par « à ses yeux » ou « dans son esprit ».
  rationale: L’hébreu présente d’abord la richesse comme une ville forte, puis emploie un terme lié à l’image ou à la représentation mentale. La traduction ne doit ni affirmer sans réserve la sécurité de la richesse ni imposer explicitement l’idée de vanité ou d’orgueil.
translation_notes:
  register: Français international moderne, concis et proverbial. « Ville forte » et « haute muraille » gardent le parallélisme imagé de l’hébreu; « imagination » préserve la dimension subjective sans ajouter un jugement moral explicite.
