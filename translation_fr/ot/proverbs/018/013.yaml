  text: מֵשִׁ֣יב דָּ֭בָר בְּ/טֶ֣רֶם יִשְׁמָ֑ע אִוֶּ֥לֶת הִיא ל֝֗/וֹ וּ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/013.yaml
  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: fr
  text: Celui qui répond avant d’avoir entendu l’affaire[a], c’est pour lui folie et honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant d’avoir entendu la parole » ou « le cas ». Le mot hébreu דָּבָר peut désigner une « parole », une « affaire » ou un « cas »; שמע peut signifier « entendre » ou « écouter ».
    reason: Ambiguïtés lexicales de דָּבָר et שמע.
lexical_decisions:
- source_word: מֵשִׁיב
  choice: répond
  rationale: Le participe hiphil de שוב a ici le sens idiomatique de « répondre ». Le présent français conserve la portée générale de la maxime.
- source_word: דָּבָר
  choice: une affaire
  rationale: דָּבָר peut désigner une parole, une chose, une affaire ou un cas. « Une affaire » convient au contexte d’une réponse donnée avant examen tout en gardant une application assez large.
- source_word: בְּטֶרֶם
  choice: avant de
  rationale: Cette tournure temporelle française rend simplement et naturellement l’antériorité exprimée par l’hébreu.
- source_word: יִשְׁמָע
  choice: l’avoir entendue
  rationale: שמע peut signifier « entendre » ou « écouter ». Le passé de l’infinitif exprime naturellement en français qu’il faut avoir pris connaissance de l’affaire avant de répondre; le pronom reprend « une affaire », objet implicite en hébreu.
- source_word: אִוֶּלֶת
  choice: folie
  rationale: « Folie » est un équivalent bref et traditionnel du terme sapientiel, qui associe défaut de jugement et faute morale.
- source_word: הִיא
  choice: c’est
  rationale: La construction présentative reprend l’acte décrit dans la première proposition et conserve la structure évaluative de l’hébreu.
- source_word: לוֹ
  choice: pour lui
  rationale: Cette expression maintient explicitement la référence personnelle marquée par le lamed hébreu sans préciser davantage s’il s’agit d’un jugement ou d’une conséquence.
- source_word: וּכְלִמָּה
  choice: et honte
  rationale: כלמה désigne la honte ou l’opprobre. « Honte » forme avec « folie » une paire concise fidèle au rythme proverbial.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et proverbial. La dislocation « Qui répond…, c’est pour lui… » conserve la structure hébraïque tout en restant intelligible; « folie et honte » préserve le parallélisme compact.
