source:
  edition: WLC
  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: fr
  text: 'Les paroles du médisant sont comme des friandises[a] : elles descendent jusqu’aux profondeurs de l’être[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme de petits mets délicats »; le terme hébreu, rare, pourrait aussi signifier « comme des blessures » ou « comme des choses avalées avec avidité ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans les chambres du ventre » : expression hébraïque désignant ce qu’il y a de plus profond dans une personne.'
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Les paroles du
  rationale: Le pluriel construit de דָּבָר désigne ici les propos tenus par la personne; « les paroles de » est naturel et fidèle.
- source_word: נִרְגָּן
  choice: médisant
  rationale: Le terme désigne quelqu’un qui fait circuler à voix basse des propos nuisibles ou diviseurs. « Médisant » exprime clairement la nature malveillante de ces propos sans les limiter nécessairement à une accusation mensongère.
- source_word: כְּמִתְלַהֲמִים
  choice: comme des friandises
  rationale: Ce terme rare est discuté. Dans ce proverbe et en Proverbes 26.22, le sens de bouchées savoureuses, avidement consommées, s’accorde bien avec l’image de ce qui descend dans le ventre. Les autres analyses possibles sont conservées en note.
- source_word: וְהֵם
  choice: elles
  rationale: Le pronom reprend « les paroles »; le féminin pluriel est requis en français.
- source_word: יָרְדוּ
  choice: descendent
  rationale: Bien que la forme hébraïque soit un accompli, le présent français rend la portée générale et proverbiale de l’énoncé.
- source_word: חַדְרֵי בָטֶן
  choice: jusqu’aux profondeurs de l’être
  rationale: Littéralement « les chambres du ventre ». Cette expression imagée désigne l’intérieur le plus profond de la personne; la formulation française en communique le sens tout en signalant l’image littérale en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. « Médisant » reste digne et largement compréhensible; « profondeurs de l’être » rend naturellement l’idiome hébreu, tandis que la note en préserve la métaphore corporelle.
