id: PRO.18.20
reference: Proverbs 18:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/פְּרִ֣י פִי אִ֭ישׁ תִּשְׂבַּ֣ע בִּטְנ֑/וֹ תְּבוּאַ֖ת שְׂפָתָ֣י/ו יִשְׂבָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: fr
  text: Du fruit de la bouche d’un homme son ventre se rassasie[a] ; du produit de ses lèvres il se rassasie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par le fruit de la bouche d’un homme son ventre est rempli ; par le produit de ses lèvres il est rempli. »'
    reason: La préposition מִן peut marquer la source ou le moyen, et שׂבע peut signifier « être rassasié » ou « être rempli ».
lexical_decisions:
- source_word: מִפְּרִי
  choice: Du fruit de
  rationale: La préposition מִן peut exprimer la source ou le moyen. « Du fruit de » conserve la métaphore ainsi que l’idée que les paroles produisent ce qui rassasie.
- source_word: פִי
  choice: la bouche
  rationale: פֶּה désigne la bouche et, par métonymie, la parole ; le sens concret préserve le parallélisme avec « lèvres ».
- source_word: אִישׁ
  choice: d’un homme
  rationale: Le nom hébreu est masculin singulier et revêt ici une portée proverbiale générale. Cette traduction en conserve la forme sans exclure l’application universelle du proverbe.
- source_word: תִּשְׂבַּע / יִשְׂבָּע
  choice: se rassasie
  rationale: שׂבע signifie « être rassasié, être comblé ». Le présent convient à une maxime et la répétition française reproduit celle de l’hébreu.
- source_word: בִּטְנוֹ
  choice: son ventre
  rationale: בֶּטֶן désigne littéralement le ventre. « Ventre » maintient l’image corporelle et s’accorde naturellement avec le verbe « se rassasier ».
- source_word: תְּבוּאַת
  choice: du produit de
  rationale: תְּבוּאָה désigne le produit, le rendement ou la récolte. « Produit » conserve l’image agricole en parallèle avec « fruit ».
- source_word: שְׂפָתָיו
  choice: ses lèvres
  rationale: שָׂפָה signifie littéralement « lèvre » et représente ici la parole par métonymie ; garder « lèvres » préserve le parallélisme poétique avec « bouche ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme bouche/lèvres, fruit/produit et la répétition de « se rassasie » sont conservés. Le point-virgule marque les deux membres du vers.
