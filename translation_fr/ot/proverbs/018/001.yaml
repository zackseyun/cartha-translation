revisions:
- from: '**Proverbes 18.1**


    Celui qui s’isole recherche ce qu’il désire[a] ; il s’emporte contre toute saine raison[b].'
  to: '**Proverbes 18.1**


    Celui qui s’isole poursuit son désir[a] ; il s’oppose à toute sagesse solide[b].'
  rationale: La révision remplace une paraphrase relative de « désir » par une expression qui respecte mieux la concision et le lien sémantique de l’hébreu. Elle remplace aussi « s’emporte », qui peut surinterpréter le verbe rare comme une simple perte de sang-froid, par « s’oppose », formulation française naturelle et sémantiquement prudente. Les deux notes sont conservées avec des ancres cohérentes et une explication explicite de la difficulté du second membre.
