  text: לְֽ֭/תַאֲוָה יְבַקֵּ֣שׁ נִפְרָ֑ד בְּ/כָל תּ֝וּשִׁיָּ֗ה יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/001.yaml
  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: fr
  text: '**Proverbes 18.1**


    Celui qui s’isole poursuit son désir[a] ; il s’oppose à toute sagesse solide[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « Celui qui se met à part cherche son désir ; il se querelle avec toute sagesse solide. » L’hébreu de la seconde proposition est difficile, en particulier le verbe rare rendu ici par « s’oppose ».'
    reason: alternative_reading
  - marker: b
    text: « Sagesse solide » peut aussi se traduire par « saine raison » ou « bon sens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: ce qu’il désire
  rationale: תַּאֲוָה désigne un désir, une envie ou une aspiration. Avec לְ dans cette formulation concise, l’expression indique vraisemblablement le but ou le mobile de la personne qui s’isole. « Ce qu’il désire » garde la portée générale du terme sans imposer l’idée de désir égoïste, qui reste implicite dans le contexte.
- source_word: יְבַקֵּשׁ
  choice: recherche
  rationale: Le piel de בקש signifie couramment « chercher » ou « rechercher ». « Recherche » convient au style proverbial et suggère une poursuite intentionnelle.
- source_word: נִפְרָד
  choice: celui qui s’isole
  rationale: Le participe niphal de פרד peut désigner une personne séparée ou qui se met à part. « Celui qui s’isole » exprime naturellement en français la valeur générique et probablement réfléchie du contexte, tout en signalant l’alternative plus littérale en note.
- source_word: בְּכָל
  choice: contre toute
  rationale: La valeur de בְ est difficile dans ce vers condensé. En lien avec le verbe suivant, « contre » rend la relation adversative probable ; כָּל est rendu par « toute ».
- source_word: תּוּשִׁיָּה
  choice: saine raison
  rationale: Dans les écrits de sagesse, תּוּשִׁיָּה peut évoquer la sagesse solide, le bon sens ou le jugement efficace. « Saine raison » est clair, actuel et suffisamment large pour le contexte.
- source_word: יִתְגַּלָּע
  choice: il s’emporte
  rationale: Ce verbe rare au hitpael est d’interprétation incertaine. Dans ce contexte, il semble exprimer une réaction ouverte et hostile, voire querelleuse. « Il s’emporte contre » donne un français naturel sans préciser indûment une image étymologique incertaine.
theological_decisions:
- issue: Nature morale du désir recherché
  choice: Ne pas qualifier explicitement le désir d’« égoïste »
  alternative: « recherche son propre désir » ou « poursuit un désir égoïste »
  rationale: Le contexte associe négativement l’isolement au désir, mais le nom תַּאֲוָה ne porte pas à lui seul la qualification « égoïste ». La traduction évite d’ajouter une évaluation qui n’est qu’implicite.
- issue: Portée de l’isolement
  choice: Comprendre נִפְרָד comme un isolement volontaire
  alternative: « celui qui est séparé »
  rationale: Le mouvement du proverbe favorise l’idée d’une personne qui se met à l’écart des autres et de leurs conseils. Une note conserve néanmoins la possibilité d’une formulation plus littérale et l’ambiguïté globale du verset.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure en deux propositions parallèles est conservée. « Celui qui » maintient la portée générale, tandis que « s’emporte » offre une expression courante et digne sans masquer l’incertitude du verbe hébreu, explicitée en note.
