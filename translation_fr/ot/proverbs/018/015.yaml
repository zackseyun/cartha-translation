source:
  edition: WLC
  text: לֵ֣ב נָ֭בוֹן יִקְנֶה דָּ֑עַת וְ/אֹ֥זֶן חֲ֝כָמִ֗ים תְּבַקֶּשׁ דָּֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/015.yaml
  text: An understanding heart acquires knowledge[b][a], and the ear of the wise seeks knowledge.
translation:
  language: fr
  text: 'Un cœur intelligent acquiert la connaissance,

    et l’oreille des sages recherche la connaissance.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’« oreille » est ici une image de la disposition à écouter et à recevoir l’instruction.
    reason: cultural_note
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Dans la littérature sapientiale hébraïque, le « cœur » désigne le siège de la pensée, du discernement et de la volonté. Le français conserve ici cette image biblique de manière naturelle.
- source_word: נָבוֹן
  choice: intelligent
  rationale: Le terme qualifie un cœur doué de compréhension et de discernement. « Intelligent » est clair et actuel, sans réduire le sens à la seule prudence.
- source_word: יִקְנֶה
  choice: acquiert
  rationale: Le verbe קנה peut signifier acheter, acquérir ou obtenir. Ici, « acquiert » exprime l’obtention active de la connaissance sans connotation commerciale excessive.
- source_word: דָּעַת
  choice: la connaissance
  rationale: Le mot désigne couramment la connaissance instruite dans les Proverbes. Sa répétition dans les deux membres est conservée pour respecter le parallélisme.
- source_word: אֹזֶן
  choice: l’oreille
  rationale: La traduction garde l’image concrète de l’hébreu, où l’oreille représente la disposition à écouter et à recevoir l’instruction.
- source_word: חֲכָמִים
  choice: des sages
  rationale: Le masculin pluriel a ici une valeur générique. « Les sages » désigne naturellement les personnes sages sans limiter le propos aux hommes.
- source_word: תְּבַקֶּשׁ
  choice: recherche
  rationale: Le piel de בקש exprime une recherche active. « Recherche » s’accorde naturellement avec « l’oreille » et rend cette démarche intentionnelle.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme hébreu, la répétition de « la connaissance » et les métaphores du « cœur » et de « l’oreille » sont préservés.
