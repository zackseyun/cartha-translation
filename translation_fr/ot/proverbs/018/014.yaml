  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: fr
  text: L’esprit d’un homme peut le soutenir dans la maladie[a], mais un esprit abattu[b], qui peut le supporter ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « L’esprit d’une personne peut la soutenir dans sa maladie. » En hébreu, le masculin singulier « homme » est employé dans un sens représentatif propre au style proverbial.
    reason: lexical_alternative
  - marker: b
    text: Ou « un esprit brisé » ou « un esprit écrasé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: l’esprit
  rationale: Dans ce proverbe, le mot désigne la vie intérieure ou la force morale d’une personne, plutôt que le vent ou le souffle physique.
- source_word: אִישׁ
  choice: d’un homme
  rationale: Le singulier masculin de l’hébreu est conservé; dans le style proverbial, il a ici une portée représentative.
- source_word: יְכַלְכֵּל
  choice: peut le soutenir
  rationale: Le verbe exprime l’action de soutenir ou de maintenir. Avec le pronom « le », la formulation française indique naturellement que l’esprit aide l’homme à traverser sa maladie.
- source_word: מַחֲלֵהוּ
  choice: dans la maladie
  rationale: Le nom avec suffixe signifie littéralement « sa maladie ». La tournure « le soutenir dans la maladie » restitue naturellement en français le fait de porter une personne au cours de son mal.
- source_word: נְכֵאָה
  choice: abattu
  rationale: L’adjectif peut décrire ce qui est frappé, brisé ou écrasé. « Abattu » est naturel en français pour un esprit privé de force, tout en laissant une variante plus forte en note.
- source_word: מִי
  choice: qui
  rationale: L’interrogatif introduit une question rhétorique sur la capacité de supporter un tel état.
- source_word: יִשָּׂאֶנָּה
  choice: peut le supporter
  rationale: Le verbe נשא signifie porter, supporter ou endurer. Le pronom reprend « esprit » selon l’usage naturel du français, et la construction exprime la capacité impliquée par la question rhétorique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme oppose la force intérieure qui soutient dans la maladie physique à l’esprit lui-même lorsqu’il est abattu. Les marqueurs suivent l’ordre de leur apparition dans le texte.
