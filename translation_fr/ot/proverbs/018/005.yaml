  text: שְׂאֵ֣ת פְּנֵי רָשָׁ֣ע לֹא ט֑וֹב לְ/הַטּ֥וֹת צַ֝דִּ֗יק בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/005.yaml
  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: fr
  text: Il n’est pas bon de favoriser le méchant[a], ni de priver le juste de justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « relever le visage du méchant », expression qui signifie lui accorder un traitement de faveur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « faire pencher le jugement contre le juste ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: favoriser
  rationale: L’expression signifie littéralement « relever le visage de » et désigne ici le fait d’accorder un traitement de faveur. « Favoriser » en restitue naturellement le sens judiciaire en français.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé désigne une personne moralement mauvaise, sans réduire nécessairement le terme au seul sens juridique de « coupable ».
- source_word: לֹא טוֹב
  choice: Il n’est pas bon
  rationale: Cette formulation directe conserve l’évaluation sobre de l’hébreu et sa portée morale.
- source_word: לְהַטּוֹת
  choice: priver
  rationale: Le verbe signifie littéralement « faire dévier, détourner ». Dans ce contexte judiciaire, « priver » exprime clairement l’effet produit sur le juste, tandis qu’une note conserve l’image plus littérale.
- source_word: צַדִּיק
  choice: le juste
  rationale: Le terme peut désigner celui qui est juste ou celui qui est dans son droit. « Le juste » préserve cette amplitude morale et judiciaire.
- source_word: בַּמִּשְׁפָּט
  choice: de justice
  rationale: Dans ce contexte, מִשְׁפָּט renvoie au jugement juste ou à la justice rendue. « De justice » est idiomatique et n’ajoute pas explicitement un tribunal absent du texte.
theological_decisions:
- issue: Portée de צַדִּיק
  choice: le juste
  alternative: l’innocent
  rationale: « Le juste » conserve la tension entre rectitude morale et bon droit judiciaire, tandis que « l’innocent » limiterait le sens à une déclaration juridique.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme concis de l’hébreu est conservé, avec une formulation idiomatique dans le texte et les images littérales en notes.
