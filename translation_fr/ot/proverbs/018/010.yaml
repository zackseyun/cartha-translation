id: PRO.18.10
reference: Proverbs 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: fr
  text: Le nom de Yahweh[a] est une tour forte ; le juste y court et se trouve hors d’atteinte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre transcription possible : « Yahvé ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « est en sécurité » ou « est protégé ». Le verbe hébreu évoque le fait d’être placé dans un lieu élevé et inaccessible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: une tour forte
  rationale: L’expression signifie littéralement « une tour de force ». « Une tour forte » conserve l’image défensive sous une forme naturelle en français.
- source_word: שֵׁם
  choice: le nom
  rationale: Le terme désigne explicitement le « nom » et peut aussi évoquer le caractère et la réputation ; le conserver évite de réduire sa richesse théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: בּוֹ
  choice: y
  rationale: Le suffixe masculin renvoie naturellement à la tour évoquée par « le nom de Yahweh ». « Y » exprime idiomatiquement en français le mouvement vers ce refuge.
- source_word: יָרוּץ
  choice: court
  rationale: Le verbe signifie « courir » ; le contexte fait entendre une course vers un refuge sans qu’il soit nécessaire d’ajouter « se réfugie ».
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé masculin singulier se rend naturellement par « le juste », forme proverbiale qui peut avoir une portée représentative sans ajout du mot « homme ».
- source_word: וְנִשְׂגָּב
  choice: et se trouve hors d’atteinte
  rationale: Le niphal de שׂגב évoque le fait d’être placé en hauteur, donc inaccessible et en sécurité. Cette formulation garde l’idée centrale d’inaccessibilité dans un français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. La translittération préserve le nom propre tout en signalant en note la convention française traditionnelle.
- issue: Portée de צַדִּיק
  choice: le juste
  alternative: un homme juste
  rationale: « Le juste » respecte le masculin singulier substantivé et le style proverbial, tout en laissant ouverte sa portée représentative.
- issue: Valeur de נִשְׂגָּב
  choice: se trouve hors d’atteinte
  alternative: est en sécurité
  rationale: Le verbe associe hauteur et sécurité. Le choix retenu conserve l’image d’un lieu élevé et inaccessible plutôt que de n’en donner que la conséquence abstraite.
translation_notes:
  register: Français international moderne, sobre et proverbial. La métaphore concrète de la tour et le mouvement exprimé par « court » sont maintenus ; « hors d’atteinte » restitue à la fois la hauteur et la protection suggérées par le dernier verbe.
