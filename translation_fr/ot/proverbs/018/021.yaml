source:
  edition: WLC
  text: מָ֣וֶת וְ֭/חַיִּים בְּ/יַד לָשׁ֑וֹן וְ֝/אֹהֲבֶ֗י/הָ יֹאכַ֥ל פִּרְיָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: fr
  text: La mort et la vie sont au pouvoir de la langue[a] ; ceux qui l’aiment mangeront de son fruit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « La mort et la vie sont dans la main de la langue. »'
    reason: lexical_alternative
  - marker: b
    text: '« Ceux qui l’aiment » désigne probablement ceux qui aiment faire usage de la langue : ils subiront les conséquences de leurs paroles, qu’elles conduisent à la mort ou à la vie.'
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת וְחַיִּים
  choice: la mort et la vie
  rationale: Les deux noms abstraits forment une opposition nette. חַיִּים, bien que morphologiquement pluriel, désigne couramment « la vie ».
- source_word: בְּיַד
  choice: sont au pouvoir de
  rationale: L’expression hébraïque signifie littéralement « dans la main de » et, par extension, « au pouvoir de ». Cette formulation française exprime naturellement l’idée d’autorité ou de capacité tout en permettant une note sur l’image originale.
- source_word: לָשׁוֹן
  choice: la langue
  rationale: Le terme concret est conservé afin de maintenir la métaphore corporelle qui désigne la parole et son usage.
- source_word: אֹהֲבֶיהָ
  choice: ceux qui l’aiment
  rationale: 'Le suffixe féminin renvoie le plus naturellement à « la langue ». La formulation conserve l’ambiguïté concernant ce que signifie aimer la langue : aimer parler, en faire grand usage ou apprécier son pouvoir.'
- source_word: יֹאכַל
  choice: mangeront
  rationale: Le futur français convient à la conséquence proverbiale. Le singulier hébreu après une expression participiale plurielle a une valeur collective et se rend naturellement au pluriel.
- source_word: פִּרְיָהּ
  choice: de son fruit
  rationale: Cette tournure conserve l’image agricole des résultats ou conséquences produits par l’usage de la langue.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme « la mort et la vie » ainsi que les métaphores de la langue et du fruit sont conservés. La ponctuation met en relief les deux propositions sans alourdir la maxime.
