  text: אִ֣ישׁ רֵ֭עִים לְ/הִתְרֹעֵ֑עַ וְ/יֵ֥שׁ אֹ֝הֵ֗ב דָּבֵ֥ק מֵ/אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: fr
  text: L’homme qui a beaucoup de compagnons peut courir à sa perte[a], mais il est un ami qui s’attache plus qu’un frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’homme qui a beaucoup de compagnons doit se montrer amical. » Le verbe hébreu לְהִתְרֹעֵעַ est difficile et a été compris de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: L’homme
  rationale: Conserve le masculin singulier représentatif de l’hébreu, dans un français proverbial naturel.
- source_word: רֵעִים
  choice: beaucoup de compagnons
  rationale: « Compagnons » distingue ce groupe nombreux de l’ami fidèle du second membre et préserve ainsi le contraste.
- source_word: לְהִתְרֹעֵעַ
  choice: peut courir à sa perte
  rationale: Le verbe est difficile. Cette traduction retient l’interprétation liée à la ruine tout en évitant de présenter l’issue comme inévitable; l’autre compréhension importante figure en note.
- source_word: וְיֵשׁ
  choice: mais il est
  rationale: Le « mais » rend la valeur contrastive du rapprochement entre de nombreux compagnons et un seul ami fidèle; « il est tel ami » conserve la tournure existentielle et la portée proverbiale.
- source_word: אֹהֵב
  choice: ami
  rationale: Dans ce contexte de sagesse, le participe désigne naturellement une personne aimante, donc un ami.
- source_word: דָּבֵק
  choice: s’attache plus étroitement
  rationale: Rend l’idée d’adhésion ferme et durable du participe דבק, avec une formulation relationnelle naturelle en français.
- source_word: מֵאָח
  choice: qu’un frère
  rationale: 'Rend la comparaison exprimée par מִן : l’attachement de cet ami dépasse même celui d’un frère.'
