  text: תַּחֲנוּנִ֥ים יְדַבֶּר רָ֑שׁ וְ֝/עָשִׁ֗יר יַעֲנֶ֥ה עַזּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/023.yaml
  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: fr
  text: Le pauvre parle en suppliant[a], mais le riche répond avec dureté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le pauvre parle en supplications, mais le riche répond par des paroles dures. »'
    reason: Alternative lexicale qui reproduit plus formellement les pluriels et la construction hébraïques.
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: en suppliant
  rationale: Le pluriel désigne des demandes insistantes de faveur ou de compassion. « En suppliant » exprime naturellement en français moderne la manière de parler indiquée par la construction hébraïque.
- source_word: יְדַבֶּר
  choice: parle
  rationale: Le piel de דבר signifie couramment « parler ». Le présent convient au caractère général de la maxime.
- source_word: רָשׁ
  choice: le pauvre
  rationale: Le terme substantivé désigne une personne pauvre. « Le pauvre » conserve le singulier représentatif et forme un parallèle naturel avec « le riche ».
- source_word: וְעָשִׁיר
  choice: mais le riche
  rationale: La conjonction ו peut marquer ici le contraste entre les deux membres du proverbe ; « mais » le rend clairement en français.
- source_word: יַעֲנֶה
  choice: répond
  rationale: Le qal de ענה signifie directement « répondre » et maintient le lien entre la supplication du pauvre et la réaction du riche.
- source_word: עַזּוֹת
  choice: avec dureté
  rationale: Cette forme plurielle employée adverbialement évoque une réponse dure, insolente ou brusque. « Avec dureté » préserve la valeur négative du contexte sans préciser excessivement la forme des paroles.
