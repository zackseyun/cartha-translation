  text: צַדִּ֣יק הָ/רִאשׁ֣וֹן בְּ/רִיב֑/וֹ יבא רֵ֝עֵ֗/הוּ וַ/חֲקָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/017.yaml
  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: fr
  text: Le premier à présenter sa cause paraît avoir raison[a], jusqu’à ce que l’autre partie vienne l’examiner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le premier dans son litige est juste, jusqu’à ce que son prochain vienne l’examiner. »'
    reason: Conserve la possibilité de rendre plus littéralement צַדִּיק par « est juste », רֵעֵהוּ par « son prochain » et חקר par « examiner ».
lexical_decisions:
- source_word: צַדִּיק
  choice: paraît avoir raison
  rationale: Dans le cadre d’un litige, l’adjectif signifie que le premier intervenant se présente comme étant dans son droit. « Paraît avoir raison » exprime la force persuasive initiale de son récit sans nier le sens plus littéral « est juste ».
- source_word: הָרִאשׁוֹן
  choice: Le premier
  rationale: Désigne la première personne à prendre la parole ou à comparaître dans le différend, en préparation du contraste avec l’arrivée de l’autre.
- source_word: בְּרִיבוֹ
  choice: à présenter sa cause
  rationale: רִיב peut désigner un différend, une contestation ou une affaire judiciaire. Cette formulation française rend naturellement le contexte quasi judiciaire.
- source_word: יבא
  choice: vienne
  rationale: Le verbe signifie littéralement « venir ». Il est rendu explicitement dans la seconde proposition, tandis que la première exprime idiomatiquement la comparution initiale par « présenter sa cause ».
- source_word: רֵעֵהוּ
  choice: l’autre partie
  rationale: רֵעַ peut signifier prochain, compagnon ou autre personne concernée. Dans ce contexte contradictoire, « l’autre partie » est clair et naturel, sans supposer une relation amicale.
- source_word: וַחֲקָרוֹ
  choice: l’interroger
  rationale: חקר signifie examiner, rechercher ou soumettre à investigation. « Interroger » convient à la confrontation des versions sans imposer le terme juridique plus technique « contre-interroger ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la tonalité sapientielle et le cadre d’une contestation, sans recourir à un jargon judiciaire excessif.
