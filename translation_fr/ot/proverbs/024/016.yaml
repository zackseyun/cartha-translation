id: PRO.24.16
reference: Proverbs 24:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י שֶׁ֨בַע יִפּ֣וֹל צַדִּ֣יק וָ/קָ֑ם וּ֝/רְשָׁעִ֗ים יִכָּשְׁל֥וּ בְ/רָעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
translation:
  language: fr
  text: Car le juste tombe sept fois et se relève[a], mais les méchants trébuchent dans le malheur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Sept fois » évoque probablement des chutes répétées ou leur pleine mesure : malgré celles-ci, le juste se relève.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « trébuchent dans la calamité » ou « sont renversés par le malheur ». Ici, le terme hébreu désigne vraisemblablement l’adversité plutôt que le mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le motif de l’avertissement précédent et conserve le lien logique avec le contexte.
- source_word: שֶׁבַע
  choice: sept fois
  rationale: Cette formulation préserve le chiffre hébreu, qui évoque vraisemblablement la répétition ou la plénitude.
- source_word: יִפּוֹל צַדִּיק
  choice: le juste tombe
  rationale: Le masculin singulier substantivé désigne le type représentatif du juste, et l’imparfait exprime ici une vérité proverbiale générale.
- source_word: וָקָם
  choice: et se relève
  rationale: Le verbe קום exprime le fait de se remettre debout après la chute; « se relève » rend naturellement cette reprise sans préciser indûment la nature de la chute.
- source_word: וּרְשָׁעִים
  choice: mais les méchants
  rationale: Le waw prend ici une valeur adversative dans le contraste entre le juste et les méchants; le pluriel substantivé est conservé.
- source_word: יִכָּשְׁלוּ
  choice: trébuchent
  rationale: Le verbe conserve l’image de la perte d’équilibre ou de l’effondrement, en contraste avec le juste qui se relève.
- source_word: בְרָעָה
  choice: dans le malheur
  rationale: Dans ce contexte, רָעָה désigne plus naturellement l’adversité ou la calamité que le mal moral; « malheur » est idiomatique et laisse subsister une certaine amplitude sémantique.
theological_decisions:
- issue: Portée du masculin singulier צַדִּיק
  choice: le juste
  alternative: une personne juste
  rationale: « Le juste » respecte le masculin singulier représentatif et le style proverbial français sans ajouter le nom « homme », absent de l’hébreu.
- issue: Nature de la chute du juste
  choice: une chute non spécifiée dont le juste se relève
  alternative: des péchés répétés suivis de repentance
  rationale: Le texte ne précise pas que la chute est morale. Le contexte et le contraste avec le malheur subi par les méchants favorisent l’idée d’adversité, tout en laissant l’image de la chute ouverte.
- issue: Sens de בְרָעָה
  choice: dans le malheur
  alternative: à cause du mal
  rationale: Le contexte favorise l’adversité ou la calamité plutôt que le mal moral; la traduction évite donc d’imposer une lecture doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Le juste » et « les méchants » sont des substantifs traditionnels encore naturels dans un registre biblique digne. La structure antithétique et l’image concrète tomber/se relever/trébucher sont conservées.
