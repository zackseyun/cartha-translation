source:
  edition: WLC
  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/033.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: fr
  text: Un peu de sommeil, un peu d’assoupissement, un peu croiser les mains pour se coucher[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour se reposer ». Le verbe hébreu peut désigner simplement le fait de se coucher ou d’être étendu, le repos ou le sommeil étant suggéré par le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט
  choice: un peu
  rationale: La triple répétition est conservée afin de rendre l’effet rhétorique et l’idée d’une concession apparemment minime qui se répète.
- source_word: שֵׁנוֹת
  choice: dormir
  rationale: Bien que l’hébreu emploie un nom pluriel, l’infinitif est plus naturel en français dans cette formule proverbiale et exprime clairement l’action.
- source_word: תְּנוּמוֹת
  choice: somnoler
  rationale: Ce verbe maintient le parallélisme avec « dormir » tout en exprimant un sommeil léger ou intermittent.
- source_word: חִבֻּק יָדַיִם
  choice: croiser les mains
  rationale: Cette tournure rend l’image hébraïque des mains repliées l’une contre l’autre, signe d’inactivité, sans la remplacer par l’expression française plus éloignée « croiser les bras ».
- source_word: לִשְׁכָּב
  choice: pour s’allonger
  rationale: Le verbe hébreu désigne le fait de se coucher ou d’être étendu; « s’allonger » en conserve la portée générale sans préciser à tort qu’il s’agit nécessairement de dormir.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, actuelle et rythmée. Les trois occurrences de « un peu » reproduisent l’insistance de l’hébreu; les infinitifs rendent la série naturelle en français.
