source:
  edition: WLC
  text: אַל תְּ֭קַנֵּא בְּ/אַנְשֵׁ֣י רָעָ֑ה וְ/אַל תתאו לִ/הְי֥וֹת אִתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/001.yaml
  text: Do not envy evil men[b][a], and do not desire to be with them.
translation:
  language: fr
  text: N'envie pas les hommes mauvais et ne désire pas être avec eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Ne jalouse pas
  rationale: La particule אַל avec la forme verbale exprime une interdiction. Ici, קנא désigne l’envie éprouvée envers les personnes mauvaises, et non un zèle positif.
- source_word: בְּאַנְשֵׁי רָעָה
  choice: les hommes mauvais
  rationale: La construction signifie littéralement « les hommes de mal ». « Les hommes mauvais » conserve le masculin explicite de אַנְשֵׁי tout en étant naturel en français.
- source_word: וְאַל תתאו
  choice: et ne désire pas
  rationale: La conjonction relie deux interdictions parallèles. Le verbe אוה exprime ici le désir ou l’inclination sans préciser à lui seul leur intensité.
- source_word: לִהְיוֹת אִתָּם
  choice: être avec eux
  rationale: La formulation directe conserve la structure de l’hébreu et peut évoquer aussi bien leur compagnie que l’association avec eux.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme des deux interdictions est conservé, ainsi que le masculin explicite du texte hébreu.
