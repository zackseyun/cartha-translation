  text: וְ/לַ/מּוֹכִיחִ֥ים יִנְעָ֑ם וַֽ֝/עֲלֵי/הֶ֗ם תָּב֥וֹא בִרְכַּת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/025.yaml
  text: But for those who rebuke[a], it will be pleasant[b], and a good blessing will come upon them.
translation:
  language: fr
  text: Mais pour ceux qui font des reproches, il y aura de la satisfaction, et une bénédiction favorable viendra sur eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une bénédiction de bien ». La première proposition peut aussi se traduire : « cela leur sera agréable » ou « ils en retireront de la satisfaction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  choice: Mais ceux qui reprennent
  rationale: Le participe de יכח désigne ceux qui adressent la réprimande ou la correction nécessaire. « Reprendre » convient au contexte moral et judiciaire, tandis que « mais » marque le contraste avec le verset précédent.
- source_word: יִנְעָם
  choice: seront dans la joie
  rationale: Le verbe נעם exprime ce qui est agréable ou réjouissant. En français, cette formulation rend naturellement l’idée qu’un sort heureux attend ceux qui reprennent, tout en signalant en note l’expression hébraïque plus impersonnelle.
- source_word: וַעֲלֵיהֶם תָּבוֹא
  choice: viendra sur eux
  rationale: La formulation conserve l’image hébraïque d’une bénédiction qui vient sur ses bénéficiaires et rend directement le futur de בוא.
- source_word: בִרְכַּת טוֹב
  choice: une heureuse bénédiction
  rationale: Le groupe construit signifie littéralement « bénédiction de bien ». « Une heureuse bénédiction » exprime de façon naturelle en français une bénédiction favorable et bienfaisante, sans préciser indûment sa forme.
