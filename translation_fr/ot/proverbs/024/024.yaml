source:
  edition: WLC
  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
translation:
  language: fr
  text: 'Celui qui dit au méchant : « Tu es juste » — les peuples le maudiront, les nations s’indigneront contre lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹמֵר
  choice: Celui qui dit
  rationale: Le participe masculin singulier a ici une valeur générale et proverbiale. « Celui qui dit » rend naturellement ce sujet indéfini en français.
- source_word: לְרָשָׁע
  choice: au méchant
  rationale: רָשָׁע désigne ici une personne moralement mauvaise, en contraste direct avec צַדִּיק. Le singulier générique « au méchant » conserve cette catégorie morale.
- source_word: צַדִּיק
  choice: juste
  rationale: Dans la littérature de sagesse, צַדִּיק exprime la droiture morale, tout en pouvant avoir une nuance judiciaire. « Juste » préserve cette tension et s’oppose clairement à « méchant ».
- source_word: יִקְּבֻהוּ
  choice: sera maudit par
  rationale: Le verbe נקב exprime ici l’action de maudire. La tournure passive française permet de conserver les peuples comme agents sans alourdir la phrase.
- source_word: עַמִּים
  choice: les peuples
  rationale: « Les peuples » rend le pluriel collectif et maintient la distinction lexicale avec לְאֻמִּים dans le second membre.
- source_word: יִזְעָמוּהוּ
  choice: s’indigneront contre lui
  rationale: Le verbe exprime une vive indignation dirigée contre quelqu’un. Cette formulation conserve sa force sans le confondre avec le verbe « maudire » du premier membre.
- source_word: לְאֻמִּים
  choice: les nations
  rationale: « Les nations » restitue le terme parallèle tout en maintenant sa distinction avec « les peuples ».
theological_decisions:
- issue: Portée morale ou judiciaire de צַדִּיק
  choice: « Tu es juste ! »
  alternative: « Tu es dans ton droit ! » ou « Tu es innocent ! »
  rationale: Le contexte immédiat, notamment le verset 23 sur la partialité dans le jugement, autorise une nuance judiciaire, mais le contraste sapientiel entre רָשָׁע et צַדִּיק garde aussi une portée morale. « Juste » préserve les deux dimensions sans trancher indûment.
translation_notes:
  register: Français moderne, international et digne. La structure proverbiale et le parallélisme « peuples / nations » sont conservés. Le point d’exclamation dans la citation fait entendre la déclaration catégorique sans ajouter de contenu.
