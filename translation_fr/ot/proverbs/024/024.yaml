  source_fidelity: 'Le sens fondamental est bien rendu : le sujet proverbial, l’adresse au méchant, l’affirmation de sa justice et la double réaction des peuples/nations correspondent au texte hébreu. Toutefois, la voix passive (« sera maudit par les peuples ») est moins directe que les verbes actifs du texte source et affaiblit légèrement le parallélisme verbal.'
  naturalness: Le français est globalement naturel. La formulation active « les peuples le maudiront » est plus fluide, plus incisive et plus conforme au style proverbial. La suppression du point d’exclamation évite d’ajouter une intonation que l’hébreu ne marque pas.
  terminology: « Méchant » et « juste » conservent de façon appropriée le contraste éthique et potentiellement judiciaire entre רָשָׁע et צַדִּיק. « Peuples » / « nations » maintient utilement la distinction lexicale des deux membres. « S’indigneront contre lui » rend la réaction hostile exprimée par זעם sans la réduire au premier verbe « maudire ».
