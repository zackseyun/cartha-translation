source:
  edition: WLC
  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
translation:
  language: fr
  text: Car il n’y aura pas d’avenir pour celui qui fait le mal[a] ; la lampe des méchants s’éteindra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fin » ou « issue ». Le mot hébreu peut désigner la fin, l’issue ou les perspectives futures d’une personne.
    reason: lexical_alternative
  - marker: b
    text: L’image de la lampe qui s’éteint peut évoquer la disparition de la vie, de la prospérité ou d’une situation durable.
    reason: metaphor_clarification
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et conserve naturellement la valeur causale en français.
- source_word: לֹא תִהְיֶה
  choice: il n’y a pas
  rationale: Avec « avenir », le présent français exprime naturellement l’absence de toute perspective future, tout en gardant la portée prospective de l’hébreu.
- source_word: אַחֲרִית
  choice: avenir
  rationale: Dans la littérature de sagesse, le terme peut désigner la fin, l’issue ou les perspectives futures d’une personne. « Avenir » convient au parallélisme avec la lampe qui s’éteint sans limiter le sens à la descendance.
- source_word: לָרָע
  choice: pour celui qui fait le mal
  rationale: Rend l’adjectif substantivé masculin singulier comme une personne caractérisée par le mal, sans ajouter « homme » ni suggérer une référence particulière au diable.
- source_word: נֵר
  choice: lampe
  rationale: Conserve l’image concrète de la lampe, qui évoque la vie, la prospérité ou la continuité.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Rend le pluriel substantivé et préserve le passage intentionnel du singulier dans le premier membre au pluriel dans le second.
- source_word: יִדְעָךְ
  choice: s’éteindra
  rationale: Le verbe désigne l’extinction d’une lampe. La forme pronominale est idiomatique en français et conserve l’image sans préciser un agent absent du texte.
theological_decisions:
- issue: Passage du singulier רָע au pluriel רְשָׁעִים
  choice: « celui qui fait le mal » au premier membre, puis « les méchants » au second
  alternative: Employer « les méchants » dans les deux membres pour lisser le français
  rationale: La traduction maintient la variation de nombre du texte hébreu sans attribuer au singulier un référent théologique particulier.
- issue: Sens de אַחֲרִית
  choice: « avenir »
  alternative: « fin » ou « issue »
  rationale: Le terme embrasse les perspectives futures et l’issue finale. « Avenir » s’accorde bien avec l’image parallèle d’une lampe qui s’éteint, tandis que la note conserve les autres nuances possibles.
- issue: Portée de l’image de la lampe éteinte
  choice: Conserver simplement la métaphore
  alternative: Expliciter qu’il s’agit de la vie, de la prospérité ou de la postérité
  rationale: Le texte ne fixe pas une seule application de l’image ; l’expliciter dans le corps du verset réduirait une ambiguïté authentique.
translation_notes:
  register: Français international moderne, clair et digne. « Celui qui fait le mal » évite le masculin générique ajouté par « homme mauvais » tout en gardant le singulier personnel. Le point-virgule restitue le parallélisme proverbial.
