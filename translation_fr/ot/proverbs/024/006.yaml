id: PRO.24.6
reference: Proverbs 24:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
translation:
  language: fr
  text: Car c’est avec une stratégie avisée[a] que tu mèneras la guerre, et la victoire[b] vient d’un grand nombre de conseillers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des conseils avisés » ou « des plans habiles » ; le terme hébreu peut désigner une direction prudente ou une planification tactique.
    reason: lexical_alternative
  - marker: b
    text: Ou « la délivrance » ; dans ce contexte militaire, le mot désigne plus précisément la victoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient l’exhortation précédente et conserve le lien logique du proverbe.
- source_word: בְתַחְבֻּלוֹת
  choice: avec une stratégie avisée
  rationale: Le terme évoque à la fois la direction habile, les plans et la tactique; cette formulation convient au contexte militaire tout en gardant l’idée de sagesse pratique.
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  choice: tu mèneras la guerre
  rationale: L’expression hébraïque signifie faire ou conduire la guerre. En français, « mener la guerre » est idiomatique; le datif לְךָ n’exige pas ici un possessif explicite.
- source_word: וּתְשׁוּעָה
  choice: et la victoire
  rationale: Dans ce contexte de guerre, le mot désigne naturellement l’issue favorable, tout en pouvant avoir le sens plus large de délivrance.
- source_word: בְּרֹב
  choice: vient d’un grand nombre de
  rationale: Rend la multiplicité ainsi que l’idée que le succès se trouve ou s’obtient grâce à de nombreux avis.
- source_word: יוֹעֵץ
  choice: conseillers
  rationale: Malgré la forme morphologiquement singulière, רֹב יוֹעֵץ fonctionne collectivement et appelle un pluriel naturel en français.
theological_decisions:
- issue: Portée de תְּשׁוּעָה
  choice: victoire dans le texte principal
  alternative: délivrance
  rationale: Le cadre explicitement militaire favorise « victoire », mais une note conserve le sens plus large du terme sans lui imposer une portée théologique particulière.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse proverbiale au singulier. « Stratégie avisée » maintient le lien avec la guerre sans réduire le terme hébreu à une technique purement militaire.
