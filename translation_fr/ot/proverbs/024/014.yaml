review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est correctement rendu : l’analogie avec le miel du verset précédent, la sagesse, la condition « si tu la trouves », l’avenir/issue et l’espérance non retranchée sont tous préservés. Toutefois, « est ainsi pour ton âme » reproduit trop littéralement une ellipse hébraïque et ne communique pas clairement en français le prédicat évaluatif repris du v. 13 (« bon »).'
  naturalness: « La sagesse est ainsi pour ton âme » est peu idiomatique et laisse « ainsi » sans complément naturel en français. « De même, sache que la sagesse est bonne pour ton âme » restitue explicitement et naturellement l’analogie contextuelle, sans ajouter de sens indépendant.
  terminology: « Sagesse », « âme », « avenir », « espérance » et « retranchée » sont des choix recevables dans un registre biblique moderne. « Retranchée » maintient la métaphore de כרת, tout en restant intelligible. La note sur אַחֲרִית est correctement ancrée à « avenir » et conserve les principales possibilités lexicales.
  issues:
  - severity: medium
    issue: 'Formulation elliptique non naturelle : « la sagesse est ainsi pour ton âme »'
    rationale: Le כֵּן renvoie analogiquement à la bonté du miel au v. 13 ; l’hébreu peut laisser ce prédicat implicite, mais le français ne le fait pas naturellement. Il convient d’expliciter « bonne » afin de rendre la comparaison et d’éviter une tournure opaque.
  revised_text: 'De même, sache que la sagesse est bonne pour ton âme : si tu la trouves, il y a un avenir[a], et ton espérance ne sera pas retranchée.'
