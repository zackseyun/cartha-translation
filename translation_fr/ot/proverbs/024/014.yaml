source:
  edition: WLC
  text: כֵּ֤ן דְּעֶ֥/ה חָכְמָ֗ה לְ/נַ֫פְשֶׁ֥/ךָ אִם מָ֭צָאתָ וְ/יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
translation:
  language: fr
  text: 'De même, sache que la sagesse est bonne pour ton âme : si tu la trouves, il y a un avenir[a], et ton espérance ne sera pas retranchée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il y a une issue » ou « il y a une fin ». Le mot hébreu אַחֲרִית peut désigner la fin d’une personne, l’issue de sa vie ou ses perspectives d’avenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ainsi
  rationale: 'Relie analogiquement ce verset à l’image du miel au verset précédent : de même que le miel est bon, ainsi la sagesse l’est pour l’être intérieur.'
- source_word: דְּעֶה
  choice: Sache
  rationale: Impératif singulier de ידע ; « Sache » est direct, naturel et digne en français.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rend le terme central du livre des Proverbes de façon constante et transparente.
- source_word: לְנַפְשֶׁךָ
  choice: pour ton âme
  rationale: Préserve l’image hébraïque et la portée personnelle de נֶפֶשׁ, qui peut aussi désigner la personne ou la vie.
- source_word: אִם מָצָאתָ
  choice: si tu la trouves
  rationale: Conserve la construction conditionnelle avec אִם et explicite naturellement en français que l’objet trouvé est la sagesse.
- source_word: וְיֵשׁ אַחֲרִית
  choice: il y a un avenir
  rationale: אַחֲרִית peut désigner la fin, l’issue ou l’avenir ; ici, le parallélisme avec l’espérance favorise l’idée d’une perspective future.
- source_word: וְתִקְוָתְךָ
  choice: et ton espérance
  rationale: « Espérance » exprime le sens de תִּקְוָה dans un registre actuel et digne, en harmonie avec la perspective d’avenir.
- source_word: לֹא תִכָּרֵת
  choice: ne sera pas retranchée
  rationale: Préserve la métaphore du niphal de כרת, « être coupé/retranché », sans l’aplanir en « disparaître ».
theological_decisions: []
translation_notes:
  register: Français moderne international, au tutoiement singulier correspondant à l’adresse hébraïque. Formulation volontairement proche de l’image et de la syntaxe de l’original, tout en restant claire. Le marqueur de note est placé après « avenir », terme réellement concerné par l’alternative lexicale.
