source:
  edition: WLC
  text: גֶּֽבֶר חָכָ֥ם בַּ/ע֑וֹז וְ/אִֽישׁ דַּ֝֗עַת מְאַמֶּץ כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/005.yaml
  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
translation:
  language: fr
  text: Un homme sage est puissant[a], et un homme qui a de la connaissance accroît sa force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un homme sage est dans la force »; peut-être aussi : « Un homme fort et sage ». La construction hébraïque est très concise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « fortifie sa puissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: un homme
  rationale: Le nom désigne ici un homme dans la formulation masculine représentative propre au proverbe. La notion de vigueur possible dans גֶּבֶר n’est pas ajoutée au nom, puisque la force est exprimée dans la suite du vers.
- source_word: חָכָם
  choice: sage
  rationale: Dans les Proverbes, le terme évoque normalement la sagesse morale et pratique; « sage » en est l’équivalent français direct et naturel.
- source_word: בַּעֹז
  choice: est puissant
  rationale: La construction compacte avec בְּ et עֹז peut être comprise de manière prédicative (« est puissant ») ou plus littéralement (« dans la force »). La formulation prédicative donne un français clair sans effacer l’ambiguïté, signalée en note.
- source_word: אִישׁ דַּעַת
  choice: un homme qui a de la connaissance
  rationale: Cette formulation conserve le parallélisme masculin du texte et rend דַּעַת directement, dans son sens de connaissance et de discernement pratique.
- source_word: מְאַמֶּץ
  choice: accroît
  rationale: Le participe piel de אמץ exprime ici le fait de rendre plus fort ou d’augmenter la force. « Accroît » produit avec « sa force » une tournure française naturelle tout en laissant ouverte la possibilité de « fortifie ».
- source_word: כֹּחַ
  choice: sa force
  rationale: כֹּחַ désigne la force ou la capacité. Le possessif est requis idiomatiquement en français pour rattacher cette force au sujet générique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme entre « un homme sage » et « un homme qui a de la connaissance » est conservé, ainsi que la formulation masculine du texte hébreu. Les notes rendent compte de la syntaxe compacte et ambiguë du premier membre et de l’alternative lexicale du second.
