id: PRO.24.2
reference: Proverbs 24:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי שֹׁ֭ד יֶהְגֶּ֣ה לִבָּ֑/ם וְ֝/עָמָ֗ל שִׂפְתֵי/הֶ֥ם תְּדַבֵּֽרְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/002.yaml
  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
translation:
  language: fr
  text: Car leur cœur médite la violence[a], et leurs lèvres parlent de méfaits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la destruction » ou « la dévastation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le mal » ou « ce qui cause du tort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’interdiction formulée au verset précédent et conserve la valeur explicative de la conjonction.
- source_word: שֹׁד
  choice: violence
  rationale: Le terme évoque une action violente qui entraîne ruine et dévastation. « Violence » exprime clairement la nature morale de ce qu’ils nourrissent intérieurement, tout en laissant en note les nuances de destruction.
- source_word: יֶהְגֶּה
  choice: médite
  rationale: Avec le cœur pour sujet, le verbe désigne une réflexion intérieure et soutenue. « Médite » préserve cette image sans préciser excessivement qu’il s’agit de comploter.
- source_word: לִבָּם
  choice: leur cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de la pensée et de la volonté, ainsi que le singulier collectif.
- source_word: וְעָמָל
  choice: méfaits
  rationale: Dans ce contexte, עָמָל désigne non le travail pénible, mais le mal nuisible ou les actes qui causent du tort. « Méfaits » rend cette intention malfaisante plus nettement que « peine » ou « malheur ».
- source_word: שִׂפְתֵיהֶם
  choice: leurs lèvres
  rationale: Préserve l’image poétique et le contraste entre la réflexion intérieure du cœur et la parole extérieure des lèvres.
- source_word: תְּדַבֵּרְנָה
  choice: parlent
  rationale: Le présent convient au caractère général de la maxime et rend simplement l’action de parler.
theological_decisions: []
