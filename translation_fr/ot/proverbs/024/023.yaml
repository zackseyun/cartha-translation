  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
translation:
  language: fr
  text: 'Voici encore des paroles des sages[a] :

    Il n’est pas bon de faire preuve de partialité quand on rend la justice[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Ces choses aussi, aux/pour les sages. » Il s’agit probablement d’un titre signifiant : « Voici encore des paroles des sages. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « reconnaître les visages dans le jugement », expression qui signifie favoriser certaines personnes ou faire preuve de partialité.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Voici encore
  rationale: Cette formulation naturelle en français marque l’ajout d’une nouvelle série de paroles et rend la fonction introductive de l’expression hébraïque.
- source_word: לַחֲכָמִים
  choice: des paroles des sages
  rationale: L’hébreu dit elliptiquement « aux/pour les sages ». Dans ce contexte, il s’agit vraisemblablement d’un titre présentant d’autres paroles provenant des sages ou leur étant attribuées.
- source_word: הַכֵּר פָּנִים
  choice: faire preuve de partialité
  rationale: L’expression signifie littéralement « reconnaître les visages » et désigne le fait de favoriser certaines personnes au lieu de juger impartialement.
- source_word: בְּמִשְׁפָּט
  choice: quand on rend la justice
  rationale: Le terme vise ici l’exercice concret du jugement, probablement dans un cadre judiciaire. Cette formulation est plus naturelle que « dans le jugement » en français courant.
- source_word: בַּל טוֹב
  choice: Il n’est pas bon
  rationale: Cette tournure conserve l’évaluation morale générale de l’hébreu sans la réduire aux seules notions d’illégalité ou d’inconvenance.
theological_decisions:
- issue: Valeur elliptique de לַחֲכָמִים
  choice: Comprendre l’expression comme un titre introduisant d’autres « paroles des sages ».
  alternative: « Ces choses aussi sont pour les sages » ou « appartiennent aux sages ».
  rationale: Le verset ouvre une nouvelle section. La lecture comme titre convient à cette fonction littéraire, tandis que la note conserve la formulation hébraïque et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La présentation sur deux lignes fait ressortir la fonction de titre de la première proposition, sans masquer dans la note l’ellipse et l’ambiguïté de l’hébreu.
