  text: מְחַשֵּׁ֥ב לְ/הָרֵ֑עַ ל֝֗/וֹ בַּֽעַל מְזִמּ֥וֹת יִקְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/008.yaml
  text: Whoever plans to do evil—to him they will call, “master of schemes.”
translation:
  language: fr
  text: Celui qui projette de faire le mal, on l’appellera « maître des machinations ».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְחַשֵּׁב לְהָרֵעַ
  choice: Celui qui projette de faire le mal
  rationale: מְחַשֵּׁב exprime ici l’élaboration réfléchie d’un projet, et לְהָרֵעַ son but malfaisant. « Projette » rend naturellement cette intention délibérée sans en atténuer la portée.
- source_word: בַּעַל מְזִמּוֹת
  choice: maître en intrigues
  rationale: La tournure בַּעַל + nom désigne quelqu’un qui possède ou maîtrise une qualité. מְזִמּוֹת peut évoquer des projets calculés ou des machinations; dans ce contexte négatif, « intrigues » conserve cette nuance, tandis que « maître en » préserve l’image expressive de l’hébreu.
- source_word: יִקְרָאוּ־לוֹ
  choice: on l’appelle
  rationale: Le pluriel indéfini hébreu se rend idiomatiquement en français par « on ». Le pronom reprend clairement la personne placée en tête de phrase.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La dislocation « Celui qui…, on l’appelle… » reflète la mise en relief de l’hébreu tout en restant naturelle; les guillemets signalent le qualificatif attribué à cette personne.
