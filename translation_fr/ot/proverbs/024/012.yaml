source:
  edition: WLC
  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
translation:
  language: fr
  text: 'Si tu dis : « Eh bien, nous ne savions rien de cela[a] », celui qui pèse les cœurs ne le comprend-il pas ? Celui qui veille sur ta vie[b] ne le sait-il pas ? Ne rendra-t-il pas à chacun selon ce qu’il a fait[c] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous ne le savions pas ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire par « qui garde ton âme » ou « qui veille sur ta personne ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit : « à l’être humain selon son action » ; le singulier a une portée générique.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Si tu dis
  rationale: כִּי introduit ici une éventualité, et l’imparfait à la deuxième personne du singulier exprime l’excuse hypothétique.
- source_word: הֵן
  choice: Voyons
  rationale: Cette interjection introduit l’excuse avec une nuance insistante; « Voyons » est naturel en français moderne sans l’archaïsme de « Voici » dans ce contexte.
- source_word: לֹא יָדַעְנוּ זֶה
  choice: nous ne savions rien de cela
  rationale: Cette formulation conserve la première personne du pluriel et exprime naturellement en français l’ignorance alléguée à propos de l’affaire évoquée.
- source_word: תֹכֵן לִבּוֹת
  choice: celui qui pèse les cœurs
  rationale: Le verbe תכן évoque la pesée ou l’évaluation. L’image concrète est conservée, et « les cœurs » garde l’anthropologie hébraïque des intentions et dispositions intérieures.
- source_word: יָבִין
  choice: comprend
  rationale: Le verbe בין désigne ici le discernement de Dieu face aux motivations cachées et à l’excuse avancée.
- source_word: וְנֹצֵר נַפְשְׁךָ
  choice: Celui qui veille sur ta vie
  rationale: נצר signifie garder ou veiller sur, tandis que נֶפֶשׁ peut désigner la vie, la personne ou l’âme. « Veille sur ta vie » est idiomatique et conserve l’idée de protection sans imposer une anthropologie dualiste.
- source_word: יֵדָע
  choice: ne le sait-il pas ?
  rationale: Le pronom « le » reprend naturellement en français la réalité de l’affaire et de l’excuse, tout en maintenant le parallèle avec « nous ne savions ».
- source_word: וְהֵשִׁיב לְאָדָם כְּפָעֳלוֹ
  choice: Ne rendra-t-il pas à chacun selon ce qu’il a fait ?
  rationale: Le hiphil de שוב a ici le sens de rendre ou rétribuer. אָדָם est générique; « à chacun » transmet cette portée universelle, et « selon ce qu’il a fait » rend naturellement כְּפָעֳלוֹ.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: ta vie
  alternative: ton âme
  rationale: נֶפֶשׁ possède une gamme de sens plus large que le français « âme ». Dans l’expression avec נצר, « ta vie » communique naturellement la garde de la personne sans réduire le terme au seul corps ni lui imposer un sens technique ultérieur.
- issue: Singulier générique אָדָם
  choice: à chacun
  alternative: à l’homme
  rationale: אָדָם désigne ici tout être humain soumis à la rétribution divine. « À chacun » conserve la portée distributive et générique du contexte sans suggérer que seuls les hommes de sexe masculin sont visés.
- issue: Nature de la connaissance divine
  choice: deux questions rhétoriques affirmant que Dieu comprend et sait
  alternative: une affirmation explicite avec « assurément »
  rationale: Les formes interrogatives avec הֲלֹא attendent une réponse affirmative, mais garder les questions préserve la force argumentative et la tension rhétorique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les images hébraïques fortes, notamment la pesée des cœurs, sont conservées; les tournures moins naturelles sont clarifiées par des notes brèves.
