source:
  edition: WLC
  text: הִ֭תְרַפִּיתָ בְּ/י֥וֹם צָרָ֗ה צַ֣ר כֹּחֶֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/010.yaml
  text: If you falter in a day of distress[a], your strength is small.
translation:
  language: fr
  text: Si tu faiblis au jour de la détresse[a], ta force est limitée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu te relâches au jour de l’épreuve, ta force est faible. »'
    reason: Alternative lexicale pour הִתְרַפִּיתָ (« se relâcher ») et צָרָה (« épreuve ») ; « faible » conserve une autre manière idiomatique de rendre l’insuffisance exprimée par צַר.
lexical_decisions:
- source_word: הִתְרַפִּיתָ
  choice: tu faiblis
  rationale: Le hitpael accompli de רפה exprime le fait de se relâcher, de perdre sa fermeté ou de se montrer faible. Dans la formulation conditionnelle du proverbe, « tu faiblis » est naturel et conserve à la fois l'idée de faiblesse et celle de perte de résolution.
- source_word: בְּיוֹם
  choice: au jour de
  rationale: La préposition ב avec יוֹם a ici une valeur temporelle. « Au jour de » garde la concision et la solennité proverbiales sans être obscur en français moderne.
- source_word: צָרָה
  choice: la détresse
  rationale: צָרָה désigne la détresse, l'épreuve ou l'adversité. « La détresse » rend bien la pression éprouvée et s'accorde avec la structure resserrée du verset.
- source_word: צַר
  choice: bien faible
  rationale: צַר signifie littéralement « étroit » et, appliqué à la force, indique qu'elle est restreinte ou insuffisante. « Bien faible » restitue naturellement en français la pointe évaluative du proverbe, tandis que la note conserve une formulation plus proche de l'image de limitation.
- source_word: כֹּחֶךָ
  choice: ta force
  rationale: כֹּחַ désigne couramment la force, la puissance ou la capacité. « Ta force » est le choix le plus direct et idiomatique dans ce contexte sapiential.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. La répétition « faiblis / faible » reproduit l'effet incisif du parallélisme hébreu; « au jour de » conserve la couleur proverbiale.
