  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
translation:
  language: fr
  text: Ne sois pas témoin sans raison contre ton prochain[a] ; et tromperais-tu par tes lèvres[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sans raison » peut aussi se traduire par « gratuitement », « sans motif » ou « pour rien ».
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu vocalisé introduit cette proposition par une particule interrogative ; la question a une force prohibitive. Autre traduction possible : « et ne trompe pas par tes lèvres ».'
    reason: grammatical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Ne témoigne pas
  rationale: La particule אַל suivie de l’imparfait exprime une interdiction. En français, « ne témoigne pas » rend naturellement l’expression « ne sois pas témoin » dans ce contexte juridique ou quasi juridique.
- source_word: עֵד
  choice: témoigne
  rationale: Le nom désigne un témoin. Sa valeur est rendue idiomatiquement en français par le verbe « témoigner », sans perdre le cadre judiciaire implicite.
- source_word: חִנָּם
  choice: sans raison
  rationale: L’adverbe peut signifier « gratuitement », « pour rien » ou « sans motif ». Ici, « sans raison » exprime clairement le caractère injustifié du témoignage.
- source_word: בְּרֵעֶךָ
  choice: contre ton prochain
  rationale: Avec le vocabulaire du témoignage, la préposition בְּ se rend naturellement par « contre ». « Ton prochain » conserve la portée sociale de רֵעַ.
- source_word: וַהֲפִתִּיתָ
  choice: et tromperais-tu
  rationale: Le texte massorétique comporte la particule interrogative הֲ devant une forme de פתה, « tromper, induire en erreur ». Une question rhétorique préserve mieux cette forme que l’ajout d’une seconde interdiction explicite.
- source_word: בִּשְׂפָתֶיךָ
  choice: par tes lèvres
  rationale: La formulation conserve l’image hébraïque concrète des lèvres comme moyen de la parole, tout en restant intelligible en français.
theological_decisions:
- issue: Valeur de la seconde proposition
  choice: 'Question rhétorique : « et tromperais-tu par tes lèvres ? »'
  alternative: 'Interdiction coordonnée : « et ne trompe pas par tes lèvres »'
  rationale: La vocalisation massorétique marque explicitement l’interrogation par הֲ. Toutefois, le parallélisme avec l’interdiction initiale permet de comprendre la question comme une seconde défense implicite ; cette autre lecture est donc signalée en note.
translation_notes:
  register: Français moderne, direct et digne, avec tutoiement proverbial. La première proposition est formulée idiomatiquement avec le verbe « témoigner » ; la seconde conserve la question rhétorique et l’image concrète des « lèvres » du texte hébreu.
