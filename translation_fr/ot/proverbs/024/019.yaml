source:
  edition: WLC
  text: אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בָּ/רְשָׁעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/019.yaml
  text: Do not be agitated because of evildoers[a]; do not envy the wicked.
translation:
  language: fr
  text: Ne t’irrite pas à cause de ceux qui font le mal[a] ; n’envie pas les méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne te laisse pas troubler par ceux qui font le mal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְחַר
  choice: t’irrite
  rationale: Le hitpael de חרה évoque le fait de s’échauffer intérieurement ou de s’emporter. « T’irrite » rend naturellement cette agitation teintée de colère en français moderne.
- source_word: בַּמְּרֵעִים
  choice: à cause de ceux qui font le mal
  rationale: Avec ce verbe, ב se comprend ici comme indiquant la cause ou l’objet de la réaction. La forme participiale מְרֵעִים désigne littéralement des personnes qui font le mal.
- source_word: תְּקַנֵּא
  choice: n’envie pas
  rationale: Dans la littérature sapientiale, קנא construit avec ב exprime couramment l’envie ou la jalousie envers quelqu’un. « Env دier » est ici direct et idiomatique.
- source_word: בָּרְשָׁעִים
  choice: les méchants
  rationale: רְשָׁעִים est une catégorie morale fréquente dans les Proverbes. « Les méchants » en conserve la concision et le registre proverbial.
- source_word: אַל
  choice: Ne… pas / n’… pas
  rationale: אַל suivi de l’imparfait à valeur jussive formule une interdiction simple, naturellement rendue en français par l’impératif négatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme des deux interdictions est conservé, tandis que « ceux qui font le mal » rend explicitement la valeur participiale du premier terme.
