    issue: « je l’ai pris à cœur »
    rationale: Cette expression française peut suggérer surtout une atteinte émotionnelle ou personnelle. L’hébreu signifie ici que le locuteur a porté attention à ce qu’il a vu et l’a considéré. « J’y ai réfléchi » transmet plus directement cette nuance.
