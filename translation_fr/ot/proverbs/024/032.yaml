revisions:
- from: J’ai contemplé cela et je l’ai pris à cœur[a] ; j’ai regardé et j’en ai tiré une leçon[b].
  to: J’ai observé cela et j’y ai réfléchi[a] ; j’ai regardé et j’en ai tiré une leçon[b].
  rationale: La révision remplace une expression potentiellement affective par une formulation qui rend plus précisément l’attention réfléchie exprimée par l’idiome hébreu « placer son cœur ». Elle préserve le parallélisme des deux perceptions et l’aboutissement en instruction, sans imposer une interprétation doctrinale.
