  text: וּ/בָֽא מִתְהַלֵּ֥ךְ רֵישֶׁ֑/ךָ וּ֝/מַחְסֹרֶ֗י/ךָ כְּ/אִ֣ישׁ מָגֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/034.yaml
  text: and your poverty will come like a prowler[a], and your need like an armed man.
translation:
  language: fr
  text: 'alors ta pauvreté viendra en rôdant,

    et ton dénuement comme un homme armé[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « comme un homme muni d’un bouclier » (ou « un porteur de bouclier »).
    reason: Précise l’image concrète de l’hébreu מָגֵן, rendue idiomatiquement par « armé » dans le texte.
lexical_decisions:
- source_word: וּבָא
  choice: alors… viendra
  rationale: Le parfait qal avec waw exprime ici la conséquence annoncée par le verset précédent. « Alors » rend clairement l’enchaînement proverbial, et le futur convient à l’avertissement.
- source_word: מִתְהַלֵּךְ
  choice: en rôdant
  rationale: Le participe hitpael de הלך évoque un déplacement de-ci de-là. « En rôdant » conserve l’image d’une approche progressive et menaçante sans transformer explicitement le participe en nom comparatif.
- source_word: רֵישֶׁךָ
  choice: ta pauvreté
  rationale: רֵישׁ désigne la pauvreté ou l’indigence. « Pauvreté » est courant, clair et fidèle.
- source_word: וּמַחְסֹרֶיךָ
  choice: et ton dénuement
  rationale: מַחְסוֹר désigne ce qui manque, le besoin ou la privation. Bien que la forme hébraïque soit morphologiquement plurielle, « ton dénuement » rend naturellement en français sa valeur collective et forme un parallèle net avec « ta pauvreté ».
- source_word: כְּאִישׁ מָגֵן
  choice: comme un homme armé
  rationale: Littéralement, l’expression décrit un « homme au bouclier ». « Homme armé » communique en français actuel la force menaçante de l’image; la formulation concrète est conservée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme des deux lignes est maintenu; « en rôdant » préserve la construction participiale et l’impression d’une menace qui approche.
