  source_fidelity: Le texte rend correctement la conséquence introduite par וּבָא au futur proverbial. « Ta pauvreté viendra en rôdant » exprime de manière idiomatique le participe מִתְהַלֵּךְ et conserve l’idée d’une approche mobile et menaçante, sans prétendre résoudre plus précisément la nuance imagée du terme. « Ton dénuement » rend convenablement le collectif מַחְסֹרֶיךָ. « Comme un homme armé » transmet la force de כְּאִישׁ מָגֵן, tandis que la note conserve le sens concret de « bouclier ».
