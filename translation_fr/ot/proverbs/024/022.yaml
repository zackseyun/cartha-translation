  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
translation:
  language: fr
  text: Car leur malheur surgira soudain, et qui connaît le désastre des deux[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et le désastre d’eux deux, qui le connaît ? » « Les deux » peut renvoyer à l’Éternel et au roi mentionnés au verset précédent, auquel cas il peut s’agir du désastre qu’ils provoquent ; la construction hébraïque peut aussi se comprendre autrement.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation du verset précédent et conserve clairement le lien causal.
- source_word: פִתְאֹם
  choice: soudain
  rationale: Exprime l’irruption brusque et imprévisible du malheur dans un français naturel.
- source_word: יָקוּם
  choice: surgira
  rationale: Rend l’image de קום, « se lever, surgir », tout en étant idiomatique avec « malheur ».
- source_word: אֵידָם
  choice: leur malheur
  rationale: אֵיד désigne une calamité ou un désastre. « Malheur » convient au registre sapientiel et le suffixe masculin pluriel est conservé par « leur ».
- source_word: וּפִיד
  choice: et… quel désastre
  rationale: פִיד évoque une ruine ou une calamité destructrice. « Désastre » maintient le parallélisme sans répéter « malheur ».
- source_word: שְׁנֵיהֶם
  choice: tous deux
  rationale: La forme signifie littéralement « eux deux ». Le français conserve cette expression sans nommer ses référents dans le corps du texte.
- source_word: מִי יוֹדֵעַ
  choice: qui sait
  rationale: Reproduit avec concision la question rhétorique qui souligne l’impossibilité humaine de prévoir l’étendue du désastre.
theological_decisions:
- issue: Référent et fonction de שְׁנֵיהֶם (« tous deux »)
  choice: Comprendre principalement « tous deux » comme l’Éternel et le roi du verset 21, sources du désastre frappant les rebelles.
  alternative: Comprendre l’expression comme « le désastre d’eux deux », c’est-à-dire un désastre qui les atteint, ou lui donner d’autres référents implicites dans le contexte.
  rationale: Les deux autorités explicitement nommées au verset précédent sont le référent contextuel le plus proche. La formulation principale donne un français intelligible, tandis que la note signale l’ambiguïté réelle de la construction hébraïque et évite de la transformer en certitude doctrinale.
translation_notes:
  register: Français international moderne, sobre et sentencieux. « Surgira soudain » conserve l’image vive de l’hébreu ; la seconde proposition est légèrement explicitée pour être naturelle, avec l’ambiguïté grammaticale documentée en note.
