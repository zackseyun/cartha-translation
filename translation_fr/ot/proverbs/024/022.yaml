    text: 'Littéralement : « et le désastre d’eux deux, qui le connaît ? » « Les deux » peut renvoyer à l’Éternel et au roi mentionnés au verset précédent, auquel cas il peut s’agir du désastre qu’ils provoquent ; la construction hébraïque peut aussi se comprendre autrement.'
    reason: alternative_reading
