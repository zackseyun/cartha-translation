  text: אַל תֶּאֱרֹ֣ב רָ֭שָׁע לִ/נְוֵ֣ה צַדִּ֑יק אַֽל תְּשַׁדֵּ֥ד רִבְצ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/015.yaml
  text: Do not lie in wait[a], O wicked man, against the dwelling of the righteous[b]; do not devastate his resting place.
translation:
  language: fr
  text: Ne tends pas de piège, méchant, contre la demeure du juste ; ne dévaste pas le lieu où il repose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « son lieu où il se couche » ; ou « son lieu de repos ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Ne… pas
  rationale: La particule prohibitive introduit ici une défense directe ; la négation française avec l’impératif en restitue clairement la force.
- source_word: תֶּאֱרֹב
  choice: guette
  rationale: Le verbe ארב évoque le fait de se tenir à l’affût en vue d’une attaque. « Guetter » conserve cette nuance prédatrice sans imposer un cadre militaire.
- source_word: רָשָׁע
  choice: méchant
  rationale: Le masculin singulier fonctionne comme une apostrophe. « Méchant » conserve la qualification morale et l’adresse directe dans un français biblique actuel.
- source_word: לִנְוֵה צַדִּיק
  choice: la demeure du juste
  rationale: נָוֶה désigne une demeure ou un lieu d’habitation ; avec ל dans ce contexte hostile, l’expression indique la cible de l’affût. « Du juste » garde la catégorie éthique au singulier.
- source_word: תְּשַׁדֵּד
  choice: dévaste
  rationale: Le verbe שדד exprime le pillage violent ou la destruction. « Dévaste » rend l’idée de ruine sans la limiter au vol.
- source_word: רִבְצוֹ
  choice: le lieu où il repose
  rationale: Le nom issu de רבץ désigne l’endroit où l’on se couche ou se repose. Cette formulation naturelle conserve l’image du repos sans la connotation animale que pourrait avoir « tanière ».
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. L’apostrophe « méchant » conserve le masculin singulier du texte hébreu ; le parallélisme entre « demeure » et « lieu où il repose » est maintenu.
