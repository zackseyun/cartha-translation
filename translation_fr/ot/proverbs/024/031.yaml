id: PRO.24.31
reference: Proverbs 24:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה עָ֘לָ֤ה כֻלּ֨/וֹ קִמְּשֹׂנִ֗ים כָּסּ֣וּ פָנָ֣י/ו חֲרֻלִּ֑ים וְ/גֶ֖דֶר אֲבָנָ֣י/ו נֶהֱרָֽסָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/031.yaml
  text: and behold[a], it was all overgrown with thorns; nettles covered its surface[c][b], and its stone wall was broken down.
translation:
  language: fr
  text: 'et voici : tout était envahi de plantes épineuses[a], les orties[b] en couvraient la surface[c], et son mur de pierres était en ruine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu désigne une végétation nuisible et piquante; l’espèce exacte est incertaine. Autres traductions possibles : « épines » ou « chardons ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une plante sauvage indésirable, peut-être des orties, des ronces ou de mauvaises herbes.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sa face », expression qui désigne ici la surface du terrain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: et voici
  rationale: Conserve la force déictique de l’interjection et rend vive l’observation, dans un registre digne mais compréhensible.
- source_word: עָלָה כֻלּוֹ
  choice: tout était envahi
  rationale: Dans ce contexte agricole, la végétation indésirable a poussé sur toute l’étendue du terrain; cette formulation exprime naturellement l’état qui en résulte.
- source_word: קִמְּשֹׂנִים
  choice: plantes épineuses
  rationale: L’identification botanique exacte est incertaine. La formulation désigne clairement une végétation nuisible et piquante sans imposer une espèce précise.
- source_word: כָּסּוּ
  choice: en couvraient
  rationale: Rend simplement l’action de couvrir et permet un enchaînement naturel avec « la surface ».
- source_word: פָנָיו
  choice: la surface
  rationale: Le mot hébreu signifie littéralement « sa face », mais désigne ici la surface visible du terrain.
- source_word: חֲרֻלִּים
  choice: orties
  rationale: Traduction traditionnelle plausible de ce second terme végétal, tout en maintenant la distinction avec קִמְּשֹׂנִים; l’identification reste incertaine.
- source_word: וְגֶדֶר אֲבָנָיו
  choice: et son mur de pierres
  rationale: Désigne le mur de délimitation construit en pierres autour de la propriété; « mur de pierres » est naturel et fidèle.
- source_word: נֶהֱרָסָה
  choice: était en ruine
  rationale: Le nifal décrit ici l’état démoli ou effondré du mur. « Était en ruine » convient à la scène d’abandon sans suggérer nécessairement un démolisseur.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « et voici » conserve la vivacité sapientielle du constat. Les deux termes végétaux hébreux restent distincts, tandis que les notes signalent honnêtement leur incertitude botanique.
