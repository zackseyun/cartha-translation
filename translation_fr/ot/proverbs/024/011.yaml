- from: Délivre ceux qu’on emmène à la mort[a] ; retiens ceux qui vacillent en allant au massacre.
  to: Délivre ceux qu’on emmène à la mort[a] ; retiens ceux qui vacillent vers le massacre.
  rationale: La révision conserve l’exhortation principale et son ambiguïté signalée, tout en supprimant une nuance ajoutée par « en allant » et en affinant la note selon le sens lexical de תַּחְשׂוֹךְ. L’ancre de note après « mort » reste adéquate, car elle signale la difficulté qui concerne la fin du verset.
