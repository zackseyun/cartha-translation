  text: הַ֭צֵּל לְקֻחִ֣ים לַ/מָּ֑וֶת וּ/מָטִ֥ים לַ֝/הֶ֗רֶג אִם תַּחְשֽׂוֹךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
translation:
  language: fr
  text: Délivre ceux qu’on emmène à la mort[a] ; retiens ceux qui vacillent vers le massacre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu se termine ainsi : « et ceux qui vacillent vers le massacre, si tu te retiens ». La syntaxe est difficile. Les derniers mots peuvent aussi être compris comme « ne te retiens pas » ou être rattachés au verset suivant. Le texte traduit le sens qui paraît le plus probable dans le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  choice: Délivre
  rationale: L’impératif de נצל appelle une intervention urgente pour arracher des personnes au danger. « Délivre » est naturel et digne en français, tout en conservant la force concrète du verbe.
- source_word: לְקֻחִים
  choice: ceux qu’on emmène
  rationale: Le participe passif de לקח désigne des personnes prises ou conduites quelque part. Cette formulation française exprime le mouvement en cours sans préciser indûment l’identité des responsables.
- source_word: לַמָּוֶת
  choice: à la mort
  rationale: 'La préposition ל marque ici la destination ou l’issue : ces personnes sont emmenées vers la mort.'
- source_word: וּמָטִים
  choice: ceux qui vacillent
  rationale: Le participe évoque l’instabilité, le fait de chanceler ou d’être sur le point de tomber. « Vacillent » préserve l’image sans imposer qu’il s’agisse seulement d’un épuisement physique.
- source_word: לַהֶרֶג
  choice: en allant au massacre
  rationale: הרג renvoie à une mise à mort violente. La tournure indique la direction vers cette issue et donne en français une construction naturelle avec « vacillent ».
- source_word: אִם תַּחְשׂוֹךְ
  choice: retiens
  rationale: La formulation massorétique est syntaxiquement difficile. Dans le parallélisme, elle est comprise comme un appel à empêcher l’avancée des personnes menacées, tout en signalant en note la lecture littérale et les autres analyses possibles.
theological_decisions:
- issue: Valeur syntaxique de אִם תַּחְשׂוֹךְ en fin de verset
  choice: 'Comprendre l’expression comme la poursuite de l’exhortation : « retiens » ceux qui vont au massacre.'
  alternative: Traduire littéralement « si tu t’abstiens » et rattacher l’expression au verset 12, ou comprendre « ne t’abstiens pas » / « ne te retiens pas ».
  rationale: L’hébreu est elliptique et sa syntaxe demeure incertaine. Pour un verset présenté isolément, l’exhortation coordonnée exprime clairement le sens contextuel probable, sans cacher l’ambiguïté, qui est conservée dans la note.
translation_notes:
  register: Français international actuel, direct et solennel. L’impératif « Délivre » porte l’urgence morale ; « massacre » conserve la violence de l’image. La ponctuation met en valeur le parallélisme poétique.
