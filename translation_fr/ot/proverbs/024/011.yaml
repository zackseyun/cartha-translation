    issue: Relation syntaxique de « en allant au massacre »
    rationale: Cette reformulation ajoute une nuance temporelle ou circonstancielle qui n’est pas explicitement portée par l’hébreu. « Vers le massacre » préserve mieux la direction et l’ellipse du texte source.
  - severity: low
    issue: Formulation de la note sur תַּחְשׂוֹךְ
    rationale: « Si tu t’abstiens » peut être compris comme une abstention générale. « Si tu te retiens » ou « si tu refuses d’intervenir » rend plus directement l’idée de retenir/refuser, tout en maintenant l’ambiguïté syntaxique.
