source:
  edition: WLC
  text: הָ֘כֵ֤ן בַּ/ח֨וּץ מְלַאכְתֶּ֗/ךָ וְ/עַתְּדָ֣/הּ בַּ/שָּׂדֶ֣ה לָ֑/ךְ אַ֝חַ֗ר וּ/בָנִ֥יתָ בֵיתֶֽ/ךָ׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/027.yaml
  text: Prepare your work outside[a]; make it ready for yourself in the field; afterward[b], build your house.
translation:
  language: fr
  text: 'Prépare ton travail au-dehors[a],

    mets-le en ordre pour toi dans les champs ;

    après cela, bâtis ta maison[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Organise ton travail au-dehors et prépare-le pour toi dans les champs. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « maison » peut aussi, dans la littérature de sagesse, évoquer plus largement le foyer ou la maisonnée. Toutefois, le contraste immédiat avec « au-dehors » et « dans les champs » favorise ici le sens concret.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכֵן
  choice: Prépare
  rationale: L’impératif de כון appelle ici à rendre prêt ou à disposer convenablement. « Prépare » est naturel, direct et maintient l’ordre des priorités exprimé par le proverbe.
- source_word: בַּחוּץ
  choice: au-dehors
  rationale: Le mot désigne l’espace extérieur, en contraste avec la maison à la fin du verset. « Au-dehors » conserve clairement cette opposition spatiale dans un registre digne.
- source_word: מְלַאכְתֶּךָ
  choice: ton travail
  rationale: מְלָאכָה désigne largement le travail, l’ouvrage ou la tâche. « Ton travail » convient au contexte d’une activité productive sans la réduire à une tâche ponctuelle.
- source_word: וְעַתְּדָהּ
  choice: mets-le en ordre
  rationale: Au piel, עתד signifie préparer, tenir prêt ou disposer. Le suffixe féminin renvoie naturellement à מְלָאכָה. « Mets-le en ordre » rend la préparation organisée tout en évitant la répétition immédiate de « prépare ».
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: שָׂדֶה désigne le champ ou l’espace cultivé. Le pluriel français « dans les champs » est idiomatique pour le lieu du travail agricole, sans modifier le référent collectif ou spatial.
- source_word: לָךְ
  choice: pour toi
  rationale: Le datif marque ici l’intérêt ou le bénéfice personnel. « Pour toi » conserve cette nuance sans suraccentuer une valeur réflexive.
- source_word: אַחַר
  choice: après cela
  rationale: L’adverbe indique la succession des étapes. « Après cela » rend explicitement l’ordre temporel central du proverbe.
- source_word: וּבָנִיתָ בֵיתֶךָ
  choice: bâtis ta maison
  rationale: Le sens immédiat est la construction d’une maison. « Bâtis ta maison » garde le contraste concret avec le dehors et les champs, tout en laissant ouverte une éventuelle portée plus large de בַּיִת.
theological_decisions:
- issue: Portée de בֵיתֶךָ (« ta maison »)
  choice: Conserver le sens concret « ta maison » dans le texte
  alternative: « Fonde ton foyer » ou « établis ta maisonnée »
  rationale: Dans la littérature de sagesse, בַּיִת peut désigner le foyer ou la maisonnée, mais son opposition immédiate avec « au-dehors » et « dans les champs » favorise ici le bâtiment. La note préserve l’extension possible sans l’imposer.
translation_notes:
  register: Tutoiement proverbial conforme à l’adresse masculine singulière de l’hébreu. Français moderne, international et digne ; formulation concise en trois mouvements, avec maintien du parallélisme et de l’ordre des priorités.
