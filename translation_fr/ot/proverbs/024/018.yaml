source:
  edition: WLC
  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
translation:
  language: fr
  text: de peur que Yahweh ne le voie, que cela ne lui déplaise[a] et qu’il ne détourne de lui sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que cela ne soit mal à ses yeux »; autre traduction : « qu’il ne le trouve mauvais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que
  rationale: Dans la suite de l’interdiction du verset précédent, cette locution introduit naturellement en français la conséquence redoutée, sans affirmer qu’elle se produira nécessairement.
- source_word: יִרְאֶה
  choice: ne le voie
  rationale: Le subjonctif requis après « de peur que » rend la conséquence éventuelle exprimée par l’imparfait hébreu. Le pronom « le » renvoie au fait de se réjouir évoqué au verset précédent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וְרַע בְּעֵינָיו
  choice: que cela ne lui déplaise
  rationale: Cette formulation française naturelle exprime l’évaluation négative portée par l’idiome hébreu « être mal à ses yeux », dont l’image littérale est signalée en note.
- source_word: וְהֵשִׁיב מֵעָלָיו אַפּוֹ
  choice: et qu’il ne détourne de lui sa colère
  rationale: Le hiphil de שׁוב indique que Yahweh fait revenir ou retire sa colère de dessus l’ennemi. « Détourner de lui sa colère » est clair, idiomatique et proche de l’image source.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de la mise en garde
  choice: une conséquence redoutée, non une promesse certaine
  alternative: une conséquence future certaine
  rationale: פֶּן introduit ici le risque qui motive l’interdiction de se réjouir du malheur d’un ennemi. Le français « de peur que » maintient cette modalité et la tension du propos.
translation_notes:
  register: Français moderne, digne et fluide. Le verset demeure syntaxiquement lié au verset 17. Le « ne » après « de peur que » est explétif et ne renverse pas le sens des verbes au subjonctif.
