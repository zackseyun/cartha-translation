source:
  edition: WLC
  text: שְׂפָתַ֥יִם יִשָּׁ֑ק מֵ֝שִׁ֗יב דְּבָרִ֥ים נְכֹחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
translation:
  language: fr
  text: Celui qui répond par des paroles justes embrasse les lèvres[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une réponse franche est comme un baiser sur les lèvres. » Le verbe hébreu est actif (« embrasse »), mais le proverbe peut employer cette image pour comparer une réponse appropriée à la proximité ou à la sincérité d’un baiser.'
    reason: alternative_reading
  - marker: b
    text: « Paroles justes » peut aussi se traduire par « paroles droites », « paroles franches » ou « paroles sincères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  choice: les lèvres
  rationale: Le duel de שָׂפָה désigne concrètement les lèvres. L’image est conservée plutôt que remplacée par une explication.
- source_word: יִשָּׁק
  choice: embrasse
  rationale: Le qal inaccompli à la 3e personne du masculin singulier est actif et signifie normalement « embrasser ». Le présent rend ici la portée générale propre au proverbe.
- source_word: מֵשִׁיב
  choice: qui répond
  rationale: Le participe hiphil de שוב peut exprimer l’action de rendre une réponse. « Qui répond » restitue directement cette valeur dans un français naturel.
- source_word: דְּבָרִים
  choice: par des paroles
  rationale: Le pluriel hébreu est maintenu. La préposition « par » explicite en français le moyen ou le contenu de la réponse sans réduire le terme à un singulier.
- source_word: נְכֹחִים
  choice: justes
  rationale: L’adjectif évoque ce qui est droit, correct ou franc. « Justes » conserve à la fois l’idée de rectitude et celle de pertinence, sans limiter le sens à la seule sincérité.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. La formulation garde l’image concrète et la construction active de l’hébreu, malgré son caractère volontairement énigmatique; la note signale l’interprétation comparative courante sans l’imposer au texte.
