id: PRO.24.7
reference: Proverbs 24:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָאמ֣וֹת לֶֽ/אֱוִ֣יל חָכְמ֑וֹת בַּ֝/שַּׁ֗עַר לֹ֣א יִפְתַּח פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
translation:
  language: fr
  text: La sagesse est trop élevée pour l’insensé[a] ; à la porte de la ville[b], il n’ouvre pas la bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les sagesses sont trop élevées pour l’insensé. » L’hébreu emploie un pluriel qui peut avoir une valeur abstraite ou intensive.'
    reason: lexical_alternative
  - marker: b
    text: Dans une ville israélite, la porte était un lieu de délibération publique, de jugement et de responsabilité civique.
    reason: cultural_note
lexical_decisions:
- source_word: רָאמוֹת
  choice: trop élevée
  rationale: Le terme vient de la racine רום, « être haut, élevé ». Dans ce contexte, il présente la sagesse comme hors de portée de l’insensé, tout en conservant l’image de la hauteur.
- source_word: לֶאֱוִיל
  choice: pour l’insensé
  rationale: 'La préposition ל marque ici la relation : la sagesse est trop élevée « pour » l’insensé. « Insensé » rend le type moral et intellectuel désigné par אֱוִיל dans les Proverbes.'
- source_word: חָכְמוֹת
  choice: la sagesse
  rationale: Bien que la forme hébraïque soit plurielle, elle peut exprimer ici une notion abstraite ou intensive. Le singulier collectif est naturel en français.
- source_word: בַּשַּׁעַר
  choice: à la porte de la ville
  rationale: La porte désigne le lieu public où se tenaient délibérations, jugements et affaires civiques. L’ajout « de la ville » explicite naturellement le référent culturel sans remplacer son image.
- source_word: לֹא יִפְתַּח פִּיהוּ
  choice: il n’ouvre pas la bouche
  rationale: 'Cette traduction conserve l’idiome hébreu et laisse ouverte la raison de son silence : incapacité, honte, ignorance ou absence d’autorité.'
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme concis du proverbe, préserve la métaphore de la hauteur et maintient l’ambiguïté du silence de l’insensé.
