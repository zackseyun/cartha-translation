language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
translation:
  language: fr
  text: Crains Yahweh, mon fils, et le roi ; ne te mêle pas à ceux qui sont portés au changement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne te mêle pas aux rebelles ». L’hébreu dit littéralement « ceux qui changent » ; il peut désigner des personnes enclines aux bouleversements ou à des changements déloyaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרָא
  choice: Crains
  rationale: L’impératif de ירא exprime ici une crainte révérencielle qui se traduit par une conduite loyale. « Crains » conserve la force et la tension du texte mieux que « révère » ou « respecte ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans l’hébreu.
- source_word: בְּנִי
  choice: mon fils
  rationale: L’hébreu est explicitement masculin singulier et reprend l’adresse paternelle caractéristique du livre des Proverbes.
- source_word: וָמֶלֶךְ
  choice: ainsi que le roi
  rationale: Le roi est le second objet du même impératif. « Ainsi que » rend clairement la coordination sans suggérer que Yahweh et le roi possèdent un statut égal.
- source_word: שׁוֹנִים
  choice: ceux qui sont portés au changement
  rationale: Le participe désigne littéralement des personnes qui changent ou sont enclines au changement. Cette formulation préserve l’indétermination entre instabilité, déloyauté et agitation politique sans imposer « rebelles » dans le texte principal.
- source_word: אַל תִּתְעָרָב
  choice: ne te mêle pas à
  rationale: Le hitpael de ערב avec עִם évoque le fait de se mélanger à certaines personnes ou de s’engager avec elles. Cette tournure est naturelle en français et conserve l’image du mélange.
theological_decisions:
- issue: Rapport entre la crainte de Yahweh et celle du roi
  choice: Maintenir les deux compléments sous le même impératif « Crains »
  alternative: Différencier explicitement les verbes, par exemple « Crains Yahweh et respecte le roi »
  rationale: La syntaxe hébraïque régit Yahweh et le roi par un seul impératif. La traduction conserve cette tension sans affirmer pour autant une égalité de statut entre eux.
- issue: Identification de שׁוֹנִים
  choice: Conserver dans le texte principal l’idée générale de personnes portées au changement
  alternative: Traduire directement par « rebelles »
  rationale: Le contexte peut viser des personnes séditieuses ou déloyales, mais le terme hébreu demeure plus large. Une note signale cette possibilité sans la transformer en certitude.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise, conforme au caractère proverbial, tout en conservant le parallélisme syntaxique et l’ambiguïté de שׁוֹנִים.
