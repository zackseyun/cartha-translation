id: PRO.24.30
reference: Proverbs 24:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל שְׂדֵ֣ה אִישׁ עָצֵ֣ל עָבַ֑רְתִּי וְ/עַל כֶּ֝֗רֶם אָדָ֥ם חֲסַר לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/030.yaml
  text: I passed by the field of a sluggard[a], and by the vineyard of a man lacking sense.
translation:
  language: fr
  text: Je suis passé près du champ d’un paresseux, et près de la vigne d’un homme qui manque de bon sens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui manque de cœur »; autre traduction possible : « dépourvu d’intelligence ».'
    reason: L’expression hébraïque associe le cœur au discernement; la note conserve sa forme littérale et une autre formulation possible.
lexical_decisions:
- source_word: עַל
  choice: près de
  rationale: Avec עָבַרְתִּי (« je suis passé »), la préposition indique ici le lieu devant lequel passe l’observateur. « Près de » exprime naturellement ce mouvement en français.
- source_word: שְׂדֵה
  choice: champ
  rationale: Dans ce contexte agricole et en parallèle avec la vigne, le terme désigne un terrain cultivé.
- source_word: אִישׁ עָצֵל
  choice: un paresseux
  rationale: Cette formulation française concise conserve la caractérisation morale habituelle de עָצֵל dans les Proverbes, sans la lourdeur de « un homme paresseux ».
- source_word: עָבַרְתִּי
  choice: je suis passé
  rationale: Le qal accompli à la première personne introduit le témoignage personnel de l’observateur.
- source_word: כֶּרֶם
  choice: vigne
  rationale: « Vigne » est le terme français courant pour une parcelle plantée de ceps et convient au parallélisme avec « champ ».
- source_word: אָדָם
  choice: un homme
  rationale: Le mot désigne ici un individu masculin, en parallèle avec אִישׁ dans le premier membre.
- source_word: חֲסַר לֵב
  choice: qui manque de bon sens
  rationale: L’expression signifie littéralement « qui manque de cœur », mais dans les Proverbes le cœur est le siège du discernement et du jugement. « Manquer de bon sens » en rend clairement la portée idiomatique.
theological_decisions:
- issue: Langage anthropologique masculin dans אָדָם
  choice: un homme
  alternative: une personne / quelqu’un
  rationale: Le terme est masculin et se trouve en parallèle avec אִישׁ. La traduction conserve cette représentation masculine sans l’étendre en principe universel ni la neutraliser.
- issue: Sens de l’expression חֲסַר לֵב
  choice: qui manque de bon sens
  alternative: qui manque de cœur / dépourvu d’intelligence
  rationale: Dans l’anthropologie sapientielle hébraïque, « cœur » peut désigner la faculté de comprendre et de juger. Le texte caractérise donc un défaut de discernement, non une absence d’émotion ou de compassion; la note préserve toutefois l’image littérale.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme hébreu est maintenu par la répétition de « près de », tandis que « un paresseux » et « un homme qui manque de bon sens » restent naturels et accessibles.
