  text: זִמַּ֣ת אִוֶּ֣לֶת חַטָּ֑את וְ/תוֹעֲבַ֖ת לְ/אָדָ֣ם לֵֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/009.yaml
  text: The scheme of folly is sin[b][a], and a scoffer is an abomination to mankind.
translation:
  language: fr
  text: Former un projet de folie, c’est pécher, et le moqueur[a] est en horreur aux yeux des gens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « railleur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמַּת
  choice: former un projet
  rationale: Le nom désigne ce qui est conçu ou projeté. La tournure verbale « former un projet » restitue naturellement en français l’idée d’une intention élaborée, sans imposer le sens plus étroit de « complot ».
- source_word: אִוֶּלֶת
  choice: insensé
  rationale: Le nom abstrait désigne la folie morale caractéristique des Proverbes. Dans la formulation française retenue, l’adjectif « insensé » exprime naturellement cette qualité du projet.
- source_word: חַטָּאת
  choice: pécher
  rationale: 'Le substantif hébreu a ici une fonction prédicative : ce projet relève du péché. « C’est pécher » conserve cette affirmation nette dans une syntaxe française idiomatique.'
- source_word: תוֹעֲבַת
  choice: ont … en horreur
  rationale: Cette expression française rend la forte répulsion portée par תוֹעֵבָה, tout en étant plus naturelle ici que « est une abomination pour ».
- source_word: לְאָדָם
  choice: les gens
  rationale: אָדָם a ici une valeur générique et vise les êtres humains en général. « Les gens » communique ce sens collectif dans un français moderne, naturel et inclusif.
- source_word: לֵץ
  choice: le moqueur
  rationale: Dans les Proverbes, לֵץ désigne celui qui tourne autrui ou la sagesse en dérision et refuse la correction. « Moqueur » rend clairement cette attitude; « railleur » reste possible.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: les gens
  alternative: l’humanité / les êtres humains
  rationale: Le singulier hébreu est générique plutôt qu’une référence à un homme particulier. Le pluriel collectif « les gens » en restitue la portée sans introduire de distinction de sexe.
- issue: Rapport entre le projet insensé et le péché
  choice: c’est pécher
  alternative: est un péché
  rationale: 'La traduction maintient l’identification prédicative exprimée par חַטָּאת : concevoir un tel projet relève du péché. Elle n’ajoute ni degré ni qualification doctrinale.'
translation_notes:
  register: Français international moderne, clair et digne. La première proposition adopte une tournure infinitive idiomatique pour éviter le peu naturel « le projet de la folie »; la seconde transpose le point de vue hébreu (« abomination pour les gens ») en « les gens ont … en horreur » sans en atténuer la force.
