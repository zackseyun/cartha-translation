  source_fidelity: La première proposition rend bien la relation prédicative de חַטָּאת, mais « projet insensé » peut désigner un projet simplement imprudent plutôt que la « folie » morale abstraite d’אִוֶּלֶת. « Projet de folie » conserve plus directement le construit hébreu. La seconde proposition restitue correctement la valeur générique de לְאָדָם et la forte répulsion de תוֹעֲבַת.
  naturalness: « Former un projet de folie, c’est pécher » est naturel et digne en français moderne. « Le moqueur est en horreur aux yeux des gens » est plus fluide que la construction transposée « les gens ont le moqueur en horreur », tout en gardant le sens générique.
