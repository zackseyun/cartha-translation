  text: בִּ/נְפֹ֣ל אויבי/ך אַל תִּשְׂמָ֑ח וּ֝/בִ/כָּשְׁל֗/וֹ אַל יָגֵ֥ל לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/017.yaml
  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
translation:
  language: fr
  text: 'Ne te réjouis pas quand ton ennemi tombe,

    et ne laisse pas ton cœur exulter quand il trébuche.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְפֹל
  choice: quand ... tombe
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. « Quand … tombe » rend naturellement l’expression tout en conservant l’image de la chute.
- source_word: אֹיְבֶיךָ
  choice: ton ennemi
  rationale: Bien que la forme consonantique puisse évoquer un pluriel, le suffixe singulier de la proposition parallèle (« il trébuche ») favorise ici le singulier.
- source_word: אַל תִּשְׂמָח
  choice: ne te réjouis pas
  rationale: אַל suivi de l’inaccompli exprime une interdiction. « Ne te réjouis pas » est une formulation française naturelle et digne.
- source_word: וּבִכָּשְׁלוֹ
  choice: et … quand il trébuche
  rationale: La construction a de nouveau une valeur temporelle. « Trébuche » maintient la distinction lexicale avec נפל, « tomber », dans le premier membre.
- source_word: אַל יָגֵל
  choice: n’exulte pas
  rationale: גיל peut désigner une joie vive ou débordante. « Exulter » préserve cette nuance et évite de confondre les deux termes hébreux relatifs à la joie.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Dans la littérature sapientielle, לב désigne l’être intérieur, notamment ses pensées et ses émotions. « Ton cœur » conserve l’image anthropologique hébraïque, courante en français biblique moderne.
theological_decisions: []
translation_notes:
  register: Français moderne international, naturel et digne. Le parallélisme hébreu est conservé, ainsi que les distinctions entre « tomber » et « trébucher », puis entre « se réjouir » et « exulter ».
