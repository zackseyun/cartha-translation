  text: אֱכָל בְּנִ֣/י דְבַ֣שׁ כִּי ט֑וֹב וְ/נֹ֥פֶת מָ֝ת֗וֹק עַל חִכֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/013.yaml
  text: Eat honey[a], my son, for it is good[b], and honey from the comb is sweet to your taste.
translation:
  language: fr
  text: Mange du miel, mon fils, car il est bon, et le miel qui coule des rayons[a] est doux à ton palais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le miel des rayons ». Le mot hébreu peut désigner le miel qui coule ou le miel contenu dans les rayons.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur ton palais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱכָל
  choice: Mange
  rationale: Impératif qal masculin singulier de אכל ; « Mange » conserve l’exhortation directe.
- source_word: בְּנִי
  choice: mon fils
  rationale: Formule vocative caractéristique de la littérature de sagesse ; elle préserve le masculin singulier et le cadre pédagogique.
- source_word: דְבַשׁ
  choice: du miel
  rationale: Équivalent français direct et naturel du nom hébreu courant désignant le miel.
- source_word: כִּי טוֹב
  choice: car il est bon
  rationale: כִּי introduit ici la raison de l’impératif, tandis que טוֹב porte une appréciation générale qui ne se limite pas au goût agréable.
- source_word: וְנֹפֶת
  choice: et le miel qui coule des rayons
  rationale: נֹפֶת peut désigner le miel qui s’écoule ou le miel contenu dans les rayons. Cette formulation française conserve l’image et distingue ce terme du simple דְבַשׁ.
- source_word: מָתוֹק
  choice: est doux
  rationale: Dans ce contexte gustatif, l’adjectif exprime la douceur sucrée ; « doux » convient naturellement avec « au palais ».
- source_word: עַל חִכֶּךָ
  choice: à ton palais
  rationale: Traduction proche de l’image anatomique de חֵךְ, tout en restant idiomatique en français moderne.
