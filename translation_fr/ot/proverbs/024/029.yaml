  text: אַל תֹּאמַ֗ר כַּ/אֲשֶׁ֣ר עָֽשָׂה לִ֭/י כֵּ֤ן אֶֽעֱשֶׂה לּ֑/וֹ אָשִׁ֖יב לָ/אִ֣ישׁ כְּ/פָעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/029.yaml
  text: Do not say[a], “As he has done to me, so I will do to him; I will repay the man according to his deed.”
translation:
  language: fr
  text: 'Ne dis pas : « Comme il a agi envers moi, j’agirai envers lui ; je rendrai à cet homme selon ce qu’il a fait. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Ne dis pas
  rationale: La particule négative אַל avec l’imparfait exprime ici une interdiction ; « Ne dis pas » est direct et naturel en français.
- source_word: כַּאֲשֶׁר עָשָׂה לִי
  choice: Comme il m’a fait
  rationale: La formulation conserve la comparaison et le verbe large עשה. Bien qu’un complément tel que « ce qu’il » soit plus courant, cette tournure reste intelligible et maintient le parallélisme serré de l’hébreu.
- source_word: כֵּן אֶעֱשֶׂה לּוֹ
  choice: ainsi je lui ferai
  rationale: « Comme… ainsi » reproduit la corrélation כַּאֲשֶׁר… כֵּן et souligne la réciprocité envisagée sans expliciter davantage la nature du tort.
- source_word: אָשִׁיב
  choice: je rendrai
  rationale: Le hiphil de שוב signifie littéralement faire revenir et, dans ce contexte, rendre ou payer de retour. « Je rendrai » conserve à la fois l’image du retour et le sens de représailles.
- source_word: לָאִישׁ
  choice: à cet homme
  rationale: אִישׁ désigne ici l’homme dont il vient d’être question. Le démonstratif français rend la référence définie avec naturel sans la généraliser.
- source_word: כְּפָעֳלוֹ
  choice: selon ce qu’il a fait
  rationale: פֹּעַל peut désigner l’action ou l’acte accompli. Cette formulation française est naturelle et exprime exactement la mesure de la riposte envisagée.
theological_decisions:
- issue: Portée éthique de l’interdiction
  choice: Le verset interdit le propos et l’intention de rendre personnellement à autrui ce qu’il a fait.
  alternative: Comprendre le verset comme une condamnation explicite de toute justice rétributive, y compris publique.
  rationale: Le texte vise directement le discours de représailles personnelles. La traduction n’élargit pas cette interdiction à des domaines que le proverbe ne mentionne pas.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme « Comme… ainsi » garde la structure sentencieuse de l’hébreu ; le point-virgule marque les deux formulations parallèles de la même intention de représailles.
