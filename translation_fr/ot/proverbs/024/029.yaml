  verdict: revise
  source_fidelity: Le projet rend correctement l’interdiction אַל, la corrélation comparative כַּאֲשֶׁר…כֵּן, et le double énoncé de rétribution personnelle. Toutefois, « Comme il m’a fait » ne peut pas rendre naturellement עָשָׂה לִי en français sans complément ; « a agi envers moi » conserve la portée volontairement large du verbe hébreu.
  naturalness: « Comme il m’a fait, ainsi je lui ferai » est elliptique au point d’être fautif ou nettement heurté en français moderne. « Comme il a agi envers moi, j’agirai envers lui » est idiomatique, clair et conserve le parallélisme proverbial. « Ainsi » est inutile après la reformulation et serait moins naturel ici.
  terminology: '« Rendrai à cet homme selon ce qu’il a fait » transmet bien אָשִׁיב לָאִישׁ כְּפָעֳלוֹ : il s’agit d’un retour/règlement en proportion de son acte, sans imposer un vocabulaire juridico-théologique. « Cet homme » conserve l’antécédent masculin singulier de אִישׁ.'
  issues:
