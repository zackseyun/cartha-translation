translation:
  language: fr
  text: Et par la connaissance, les pièces se remplissent de tous les biens précieux et agréables[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chambres » au lieu de « les pièces ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se rempliront » ; la forme inaccomplie hébraïque peut être comprise au futur, bien que le présent exprime ici une vérité générale.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « de toute richesse précieuse et agréable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַעַת
  choice: et, par la connaissance
  rationale: Le וּ conjonctif et le בְ instrumental sont représentés. « Par la connaissance » s’inscrit naturellement dans le parallélisme sapientiel du contexte.
- source_word: חֲדָרִים
  choice: les pièces
  rationale: Le nom désigne les pièces ou chambres intérieures d’une maison. « Pièces » est le terme moderne le plus naturel en français.
- source_word: יִמָּלְאוּ
  choice: se remplissent
  rationale: L’imparfait hébreu au nifal est rendu comme un présent de vérité générale, conformément au caractère proverbial du passage, tout en conservant l’idée d’un remplissage passif ou résultatif.
- source_word: כָּל הוֹן
  choice: de toutes sortes de biens
  rationale: הוֹן désigne les richesses, les biens ou la fortune. Avec כָּל et les deux adjectifs, cette formulation française exprime naturellement la totalité et la diversité des possessions évoquées.
- source_word: יָקָר
  choice: précieux
  rationale: « Précieux » restitue la valeur élevée ou le grand prix exprimé par l’adjectif hébreu.
- source_word: וְנָעִים
  choice: et agréables
  rationale: « Agréables » rend la qualité plaisante et désirable des biens sans la réduire à leur seule valeur monétaire.
