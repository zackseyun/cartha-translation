  register: Français international moderne, naturel et digne. La construction conserve le lien instrumental avec la connaissance et le ton général du proverbe. « Toutes sortes de biens » explicite idiomatiquement la portée de כָּל הוֹן, tandis que la note donne une formulation plus proche de la structure hébraïque.
