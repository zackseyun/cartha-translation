  text: בְּ֭/חָכְמָה יִבָּ֣נֶה בָּ֑יִת וּ֝/בִ/תְבוּנָ֗ה יִתְכּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/003.yaml
  text: By wisdom a house is built[b][a], and by understanding it is established.
translation:
  language: fr
  text: C’est par la sagesse qu’une maison[a] est bâtie, et par l’intelligence qu’elle est solidement établie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une famille » ou « une maisonnée » ; « maison » peut désigner aussi bien un bâtiment que, par extension, un foyer ou ceux qui y vivent.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’elle est affermie » ou « qu’elle est rendue stable » .
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָה
  choice: par la sagesse
  rationale: La préposition בְּ indique ici le moyen. « Par la sagesse » exprime naturellement en français le moyen par lequel la maison se bâtit.
- source_word: יִבָּנֶה
  choice: se bâtit
  rationale: Le nifal inaccompli a ici une valeur générale propre au proverbe. Le présent français et la tournure pronominale rendent cette vérité générale sans l’enfermer dans le futur.
- source_word: בָּיִת
  choice: une maison
  rationale: בַּיִת désigne d’abord une maison, mais peut aussi s’étendre à la famille ou à la maisonnée. « Maison » conserve l’image concrète et permet cette portée figurée.
- source_word: וּבִתְבוּנָה
  choice: et par l’intelligence
  rationale: תְּבוּנָה évoque l’intelligence, la compréhension ou le discernement. « Intelligence » forme un couple naturel avec « sagesse » dans le vocabulaire sapientiel français.
- source_word: יִתְכּוֹנָן
  choice: elle s’affermit
  rationale: La forme de כון exprime l’idée d’être rendu stable, solidement établi. « S’affermit » garde cette nuance et répond avec naturel à « se bâtit ».
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, actuelle et digne. Le parallélisme hébreu est conservé par « par la sagesse… et par l’intelligence », tandis que « se bâtit / s’affermit » restitue le mouvement de construction puis de stabilisation.
