  text: אִם יְהַלֵּ֣ךְ אִ֭ישׁ עַל הַ/גֶּחָלִ֑ים וְ֝/רַגְלָ֗י/ו לֹ֣א תִכָּוֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/028.yaml
  text: Can a man walk on coals and his feet not be scorched?[a]
translation:
  language: fr
  text: Un homme peut-il marcher sur des braises sans se brûler les pieds ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si un homme marche sur des braises, ses pieds ne seront-ils pas brûlés ? » L’hébreu commence par אִם (« si »), employé ici pour introduire une question rhétorique en parallèle avec le verset précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: peut-il
  rationale: Bien que אִם signifie habituellement « si », il introduit ici, en parallèle avec le verset précédent, une question rhétorique. La tournure « peut-il » en restitue naturellement la force en français.
- source_word: יְהַלֵּךְ
  choice: marcher
  rationale: Le verbe décrit l’action de marcher ou de se déplacer; « marcher » convient directement à l’image des pieds sur les braises.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et désigne ici l’individu masculin évoqué dans le contexte de l’avertissement sapiential.
- source_word: עַל הַגֶּחָלִים
  choice: sur des braises
  rationale: La préposition indique le contact avec la surface, et גֶּחָלִים désigne des charbons ardents ou des braises. « Braises » exprime clairement et sobrement cette image en français actuel.
- source_word: וְרַגְלָיו
  choice: les pieds
  rationale: Le français emploie naturellement l’article défini avec les parties du corps lorsque le possesseur est déjà identifié par le sujet; le pluriel de l’hébreu est conservé.
- source_word: לֹא תִכָּוֶינָה
  choice: sans se brûler
  rationale: La négation et le verbe passif « être brûlé » sont rendus par la construction idiomatique « sans se brûler » dans la question de possibilité. Elle conserve le sens tout en évitant une formulation française lourde.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La question rhétorique est formulée de manière naturelle; « braises » rend explicitement l’idée de charbons ardents sans surcharge. Le marqueur de note [a] figure dans le texte.
