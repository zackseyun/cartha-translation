  text: לֹא יִ֭שָּׂא פְּנֵ֣י כָל כֹּ֑פֶר וְ/לֹֽא יֹ֝אבֶ֗ה כִּ֣י תַרְבֶּה שֹֽׁחַד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/035.yaml
  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: fr
  text: Il n’acceptera aucune rançon[a] et ne cédera pas, si gros que soit le pot-de-vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « compensation ». L’hébreu dit littéralement qu’il ne « relèvera le visage » d’aucune rançon, expression signifiant ici qu’il refusera d’accorder sa faveur en échange d’un paiement.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: Il n’acceptera aucune
  rationale: L’expression idiomatique « relever le visage de » indique ici qu’il ne témoignera aucune faveur en acceptant le paiement mentionné. « N’acceptera aucune » rend naturellement ce sens en français.
- source_word: כָל כֹּפֶר
  choice: rançon
  rationale: כֹּפֶר désigne un paiement compensatoire visant à détourner les conséquences. « Rançon » conserve la force du terme, tandis que « compensation » est signalé en note comme autre traduction possible.
- source_word: לֹא יֹאבֶה
  choice: ne cédera pas
  rationale: Le verbe exprime le refus de consentir ou de se laisser fléchir, et non l’insatisfaction émotionnelle. Dans ce contexte, « ne cédera pas » traduit de façon concise et naturelle sa valeur volitive.
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: si gros que soit le pot-de-vin
  rationale: Cette formulation rend la valeur concessive de la proposition, la grandeur ou l’augmentation du paiement, ainsi que le singulier de שֹׁחַד.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le futur maintient la continuité avec le portrait du mari jaloux aux versets précédents. « Pot-de-vin » est courant et précis; « ne cédera pas » préserve la valeur de volonté du verbe hébreu.
