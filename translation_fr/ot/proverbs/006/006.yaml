  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
translation:
  language: fr
  text: Va vers la fourmi, paresseux ! Observe ses façons d’agir et deviens sage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל
  choice: Va vers
  rationale: L’impératif suivi de la préposition exprime un déplacement en direction de la fourmi. « Va vers » est naturel en français et conserve la vigueur de l’exhortation.
- source_word: נְמָלָה
  choice: la fourmi
  rationale: Le singulier avec l’article défini présente la fourmi comme représentante de son espèce et comme exemple à étudier.
- source_word: עָצֵל
  choice: paresseux
  rationale: Le nom est employé en apostrophe au masculin singulier. « Paresseux » garde la réprimande directe sans ajouter le substantif interprétatif « homme ».
- source_word: רְאֵה
  choice: Observe
  rationale: Le sens premier est « vois », mais le contexte sapiential appelle une observation attentive dont on tire une leçon. « Observe » rend cette nuance tout en restant concret.
- source_word: דְרָכֶיהָ
  choice: ses façons d’agir
  rationale: Littéralement « ses voies », expression qui désigne ici les comportements ou les habitudes de la fourmi. « Ses façons d’agir » est clair en français moderne et évite l’ambiguïté spatiale de « voies ».
- source_word: וַחֲכָם
  choice: et deviens sage
  rationale: La forme impérative appelle le paresseux à acquérir la sagesse grâce à son observation. « Deviens sage » rend mieux cette dynamique que le possible mais plus statique « sois sage ».
theological_decisions: []
translation_notes:
  register: Formulation concise, vive et digne, adaptée à la maxime sapientiale. L’apostrophe « paresseux » conserve la rudesse pédagogique de l’hébreu. Aucun marqueur de note n’est requis, puisque les nuances lexicales sont rendues directement dans le texte.
