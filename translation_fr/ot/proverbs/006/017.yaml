  text: les yeux hautains, la langue mensongère et les mains qui répandent le sang innocent,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַיִם
  choice: les yeux
  rationale: Le terme désigne littéralement les yeux et évoque, par métonymie, un regard orgueilleux. Le conserver maintient l’image hébraïque et la série des parties du corps.
- source_word: רָמוֹת
  choice: hautains
  rationale: Le mot signifie littéralement « élevés »; appliqué aux yeux, il exprime ici l’arrogance. « Hautains » rend naturellement cette valeur morale en français.
- source_word: לְשׁוֹן
  choice: la langue
  rationale: Le sens concret est conservé, la langue représentant la parole; cela préserve le parallélisme avec les yeux et les mains.
- source_word: שָׁקֶר
  choice: mensongère
  rationale: Dans cette construction, le nom « mensonge » caractérise la langue. L’adjectif « mensongère » exprime clairement une parole qui profère le faux.
- source_word: יָדַיִם
  choice: les mains
  rationale: Le pluriel concret est maintenu afin de respecter l’image des mains comme instruments de l’action violente.
- source_word: שֹׁפְכוֹת
  choice: qui répandent
  rationale: Le participe décrit une action caractéristique. La proposition relative est naturelle en français tout en conservant cette nuance.
- source_word: דָּם
  choice: le sang
  rationale: Traduction directe du terme hébreu, qui désigne ici le sang versé par violence.
- source_word: נָקִי
  choice: innocent
  rationale: L’adjectif qualifie le sang comme celui d’une personne exempte de faute dans l’affaire. L’expression « sang innocent » est précise et idiomatique en français.
