source:
  edition: WLC
  text: נֶֽגַע וְ/קָל֥וֹן יִמְצָ֑א וְ֝/חֶרְפָּת֗/וֹ לֹ֣א תִמָּחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/033.yaml
  text: He will find injury and disgrace[b][a], and his reproach will not be wiped away.
translation:
  language: fr
  text: Il subira une blessure et le déshonneur[a], et son opprobre ne s’effacera pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une atteinte et la honte » ; les termes hébreux peuvent évoquer à la fois une atteinte physique et un déshonneur public.
    reason: lexical_alternative
  - marker: b
    text: Ou « son déshonneur ne sera pas effacé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: coups
  rationale: Le nom peut désigner un coup, une blessure ou une atteinte. Dans le contexte immédiat de la vengeance du mari, « coups » garde la force concrète du terme sans évoquer à tort une maladie.
- source_word: קָלוֹן
  choice: déshonneur
  rationale: Le terme exprime une honte publique et une perte d’honneur. « Déshonneur » restitue clairement cette dimension sociale et morale.
- source_word: יִמְצָא
  choice: récoltera
  rationale: Littéralement « trouvera », le verbe indique ici que ces conséquences atteindront l’homme. « Récoltera » rend naturellement en français la conséquence de sa conduite, sans en modifier le sens.
- source_word: חֶרְפָּתוֹ
  choice: son humiliation
  rationale: Le mot désigne l’opprobre, la honte ou l’humiliation subie devant autrui. « Son humiliation » reste distinct de « déshonneur » tout en exprimant son caractère public et durable.
- source_word: לֹא תִמָּחֶה
  choice: ne s’effacera pas
  rationale: Le niphal de מחה signifie être effacé ou supprimé. « Ne s’effacera pas » conserve l’image hébraïque et son caractère durable dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme entre l’atteinte concrète, le déshonneur public et l’humiliation durable est conservé.
