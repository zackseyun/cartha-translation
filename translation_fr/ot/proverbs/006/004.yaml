source:
  edition: WLC
  text: אַל תִּתֵּ֣ן שֵׁנָ֣ה לְ/עֵינֶ֑י/ךָ וּ֝/תְנוּמָ֗ה לְ/עַפְעַפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/004.yaml
  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: fr
  text: Ne donne pas de sommeil à tes yeux, ni d’assoupissement[a] à tes paupières.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « somnolence ». Le terme hébreu évoque un sommeil léger ou le fait de s’assoupir.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Ne… pas
  rationale: Avec l’inaccompli, אַל exprime ici une interdiction. « Ne… pas » la rend naturellement sans ajouter d’emphase.
- source_word: תִּתֵּן
  choice: laisse
  rationale: Le verbe נתן signifie littéralement « donner », mais, dans cette tournure, « ne laisse pas tes yeux dormir » transmet naturellement en français l’idée de ne pas accorder de sommeil aux yeux.
- source_word: שֵׁנָה
  choice: dormir
  rationale: Le nom signifie « sommeil ». La transposition verbale produit une formulation française naturelle tout en conservant le sens concret.
- source_word: לְעֵינֶיךָ
  choice: tes yeux
  rationale: Les yeux sont les bénéficiaires du sommeil dans l’image hébraïque; ils deviennent naturellement le sujet de « dormir » en français.
- source_word: וּתְנוּמָה
  choice: ni… sommeiller
  rationale: תְּנוּמָה désigne l’assoupissement ou un sommeil léger. « Sommeiller » maintient la distinction avec le sommeil du premier membre et le parallélisme poétique.
- source_word: לְעַפְעַפֶּיךָ
  choice: tes paupières
  rationale: עַפְעַף désigne directement les paupières; ce choix conserve le parallélisme entre les parties du corps.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et poétique. La formulation évite le calque peu naturel « donner du sommeil à tes yeux », tout en préservant le parallélisme entre les yeux et les paupières ainsi que la nuance entre dormir et sommeiller.
