  yaml_path: translation/ot/proverbs/006/009.yaml
  text: How long[a], sluggard, will you lie there? When will you rise from your sleep?
translation:
  language: fr
  text: Jusqu’à quand, paresseux[a], resteras-tu couché ? Quand te lèveras-tu de ton sommeil ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « homme paresseux ».
