lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Cette tournure française naturelle exprime la durée interrogée et conserve le ton de reproche de l’hébreu.
- source_word: עָצֵל
  choice: paresseux
  rationale: Ce substantif désigne, dans les Proverbes, une personne caractérisée par sa paresse. « Paresseux » est courant, direct et convient au registre proverbial.
- source_word: תִּשְׁכָּב
  choice: resteras-tu couché
  rationale: Le verbe signifie « être couché/se coucher ». Dans le contexte, la question porte sur la prolongation de l’inactivité au lit ; « rester couché » le rend naturellement sans surcharge.
- source_word: מָתַי
  choice: Quand
  rationale: Équivalent direct et idiomatique de l’adverbe interrogatif.
- source_word: תָּקוּם
  choice: te lèveras-tu
  rationale: Le verbe signifie « se lever ». Cette formulation convient précisément au réveil et reste naturelle en français moderne.
- source_word: מִשְּׁנָתֶךָ
  choice: de ton sommeil
  rationale: Rend directement le nom « sommeil » avec le suffixe possessif masculin singulier et la préposition indiquant la sortie d’un état.
