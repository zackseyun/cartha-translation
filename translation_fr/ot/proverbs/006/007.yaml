id: PRO.6.7
reference: Proverbs 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֖ר אֵֽין לָ֥/הּ קָצִ֗ין שֹׁטֵ֥ר וּ/מֹשֵֽׁל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/007.yaml
  text: which has no chief[a], officer, or ruler,
translation:
  language: fr
  text: elle qui n’a ni chef[a], ni responsable, ni dirigeant,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commandant ».
    reason: Le mot hébreu peut désigner un chef, notamment investi d’un commandement.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: elle qui
  rationale: Le pronom relatif reprend la fourmi, nom féminin en français, et rattache naturellement ce verset au précédent.
- source_word: אֵין לָהּ
  choice: n’a ni
  rationale: La construction existentielle avec ל et suffixe pronominal exprime ici la possession. Dans cette énumération négative, « n’a ni » est naturel en français.
- source_word: קָצִין
  choice: chef
  rationale: Le terme désigne une personne placée à la tête d’un groupe. « Chef » reste distinct du dernier terme, qui insiste davantage sur l’exercice du pouvoir.
- source_word: שֹׁטֵר
  choice: responsable
  rationale: Le mot peut désigner un agent chargé de fonctions administratives ou de surveillance. « Responsable » est compréhensible en français moderne et évite la connotation principalement policière d’« officier ».
- source_word: וּמֹשֵׁל
  choice: ni dirigeant
  rationale: מֹשֵׁל désigne celui qui gouverne ou exerce l’autorité. Dans une série négative française, le waw se rend naturellement par « ni ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La triple structure est conservée au moyen de « ni… ni… ni », tout en distinguant la direction, la fonction administrative et l’exercice de l’autorité.
