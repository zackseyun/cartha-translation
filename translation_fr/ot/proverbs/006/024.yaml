  text: לִ֭/שְׁמָרְ/ךָ מֵ/אֵ֣שֶׁת רָ֑ע מֵֽ֝/חֶלְקַ֗ת לָשׁ֥וֹן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: fr
  text: pour te garder de la femme mauvaise[b], de la langue flatteuse[a] de l’étrangère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la douceur de la langue » ; l’expression évoque des paroles flatteuses ou séduisantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la femme perverse ». Le terme traduit par « l’étrangère » désigne une femme étrangère ou extérieure au groupe ; dans ce contexte, certains y voient une femme adultère.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: pour te garder
  rationale: L’infinitif construit avec ל exprime ici le but ou le résultat de l’enseignement évoqué au verset précédent. « Garder » conserve naturellement l’idée de protection.
- source_word: מֵאֵשֶׁת רָע
  choice: de la femme mauvaise
  rationale: אֵשֶׁת peut signifier « femme » ou « épouse » ; dans ce contexte, « femme » évite de préciser indûment son statut matrimonial. רָע qualifie sa conduite moralement mauvaise.
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: de la langue flatteuse
  rationale: L’expression évoque littéralement une langue « lisse », image hébraïque d’une parole séduisante ou flatteuse. En français courant, « langue flatteuse » transmet clairement l’effet idiomatique tout en permettant de signaler l’image littérale en note.
- source_word: נָכְרִיָּה
  choice: l’étrangère
  rationale: Le mot désigne fondamentalement une femme étrangère ou extérieure au groupe. « L’étrangère » reste concis et préserve cette valeur lexicale sans imposer l’interprétation plus étroite « femme adultère ».
theological_decisions:
- issue: Interprétation de נָכְרִיָּה dans la littérature sapientiale
  choice: Traduire par « l’étrangère » dans le texte principal
  alternative: « la femme adultère » ou « la femme d’un autre »
  rationale: Le contexte suggère une séduction sexuelle illicite, mais le terme hébreu lui-même signifie d’abord « étrangère ». Le texte principal préserve cette tension, tandis que la note indique l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « pour te garder » maintient le lien syntaxique avec le verset précédent. « Langue flatteuse » privilégie l’intelligibilité immédiate, tandis que la note conserve l’image concrète de la langue « lisse ».
