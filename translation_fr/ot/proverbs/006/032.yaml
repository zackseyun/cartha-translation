source:
  edition: WLC
  text: נֹאֵ֣ף אִשָּׁ֣ה חֲסַר לֵ֑ב מַֽשְׁחִ֥ית נַ֝פְשׁ֗/וֹ ה֣וּא יַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: fr
  text: Celui qui commet un adultère avec une femme manque de jugement[a] ; celui qui le fait se détruit lui-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « manque de cœur ». Autre traduction possible : « Celui qui commet un adultère avec une épouse manque d’intelligence ; celui qui le fait ruine sa vie. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאֵף
  choice: commet un adultère
  rationale: Le participe désigne celui qui se livre à l’adultère. Cette tournure verbale est naturelle en français et exprime clairement l’action.
- source_word: אִשָּׁה
  choice: avec une femme
  rationale: אִשָּׁה peut signifier « femme » ou « épouse ». Le sens adultère étant déjà porté par נֹאֵף, « avec une femme » conserve ici l’ambiguïté lexicale sans alourdir le texte.
- source_word: חֲסַר לֵב
  choice: manque de jugement
  rationale: Littéralement « manque de cœur » ; dans les Proverbes, l’expression désigne une déficience de discernement ou de bon sens, non un manque d’émotion.
- source_word: מַשְׁחִית
  choice: se détruit
  rationale: Le participe hiphil exprime le fait de causer la destruction ou la ruine. Avec נַפְשׁוֹ, la formulation pronominale française restitue naturellement la portée réflexive.
- source_word: נַפְשׁוֹ
  choice: lui-même
  rationale: נֶפֶשׁ désigne ici la personne ou sa vie, plutôt qu’une âme immatérielle distincte. « Lui-même » rend la force réflexive de l’expression.
- source_word: הוּא יַעֲשֶׂנָּה
  choice: celui qui le fait
  rationale: Le pronom emphatique et le verbe muni d’un suffixe féminin renvoient à l’action adultère. Cette formulation conserve la structure générique et concise du proverbe.
theological_decisions: []
