source:
  edition: WLC
  text: תַּֽהְפֻּכ֨וֹת בְּ/לִבּ֗/וֹ חֹרֵ֣שׁ רָ֣ע בְּ/כָל עֵ֑ת מדנים יְשַׁלֵּֽחַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/014.yaml
  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
translation:
  language: fr
  text: La perversité habite son cœur ; il trame sans cesse le mal et sème la discorde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envoie les querelles », c’est-à-dire qu’il provoque ou propage les conflits.'
    reason: Précise l’image hébraïque sous-jacente à l’expression idiomatique française « sème la discorde ».
lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: la perversité
  rationale: Ce pluriel abstrait évoque une disposition moralement tordue. « La perversité » restitue ce sens collectif en français naturel.
- source_word: בְּלִבּוֹ
  choice: habite son cœur
  rationale: La proposition hébraïque est sans verbe et situe la perversité dans le cœur. « Habite son cœur » exprime naturellement une disposition intérieure durable.
- source_word: חֹרֵשׁ רָע
  choice: il trame le mal
  rationale: Le verbe signifie littéralement labourer ou graver, mais prend ici le sens figuré de concevoir ou préparer le mal. « Tramer » conserve la nuance de calcul malveillant.
- source_word: בְּכָל־עֵת
  choice: sans cesse
  rationale: L’expression indique une conduite habituelle et continuelle. « Sans cesse » est idiomatique et fidèle à cette portée.
- source_word: מְדָנִים
  choice: la discorde
  rationale: Le pluriel désigne les querelles et conflits répétés. L’expression française « semer la discorde » en rend naturellement le sens collectif.
- source_word: יְשַׁלֵּחַ
  choice: sème
  rationale: Le piel signifie ici envoyer au loin ou répandre. Dans ce contexte, « semer la discorde » est l’équivalent idiomatique français de l’action qui consiste à provoquer et propager les conflits.
theological_decisions: []
