  text: תָּכִ֣ין בַּ/קַּ֣יִץ לַחְמָ֑/הּ אָגְרָ֥ה בַ֝/קָּצִ֗יר מַאֲכָלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/008.yaml
  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: fr
  text: elle prépare en été sa nourriture[a] ; elle amasse pendant la moisson ses provisions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son pain » ; ici, probablement au sens plus général de « nourriture » ou de « subsistance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: prépare
  rationale: Le hifil de כון exprime ici l’action de mettre en état ou de préparer ; « prépare » est naturel et convient au parallélisme avec l’action d’amasser.
- source_word: בַּקַּיִץ
  choice: en été
  rationale: La préposition ב avec le nom défini situe l’action dans cette saison ; « en été » est la formulation française la plus concise et naturelle.
- source_word: לַחְמָהּ
  choice: sa nourriture
  rationale: לֶחֶם signifie souvent « pain », mais peut désigner plus largement la nourriture ou la subsistance ; pour une fourmi, « sa nourriture » transmet clairement le sens contextuel.
- source_word: אָגְרָה
  choice: elle amasse
  rationale: Le verbe אגר désigne le fait de recueillir en vue de constituer une réserve. « Amasse » exprime à la fois le rassemblement et la mise en réserve.
- source_word: בַקָּצִיר
  choice: pendant la moisson
  rationale: Le terme désigne la période de la moisson ; « pendant la moisson » marque clairement le cadre temporel de l’action.
- source_word: מַאֲכָלָהּ
  choice: ses provisions
  rationale: מַאֲכָל désigne ce qui sert de nourriture. « Ses provisions » rend bien, dans ce contexte, la nourriture recueillie et conservée, tout en maintenant une légère variation par rapport à לַחְמָהּ.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux propositions est conservé, avec une légère variation lexicale entre « nourriture » et « provisions ».
