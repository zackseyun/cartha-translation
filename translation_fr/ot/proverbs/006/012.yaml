source:
  edition: WLC
  text: אָדָ֣ם בְּ֭לִיַּעַל אִ֣ישׁ אָ֑וֶן ה֝וֹלֵ֗ךְ עִקְּשׁ֥וּת פֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: fr
  text: Un vaurien, un homme malfaisant, va en tenant des propos tortueux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « perversité de bouche »; ou : « avec une bouche tortueuse » / « avec une bouche perverse ».'
    reason: L’hébreu emploie une expression concrète liée à la « bouche » pour désigner une parole tortueuse, déloyale ou perverse.
lexical_decisions:
- source_word: אָדָם
  choice: homme
  rationale: Le contexte présente un individu type dans l’enseignement sapientiel; « homme » rend le singulier personnel et maintient le parallélisme avec אִישׁ.
- source_word: בְּלִיַּעַל
  choice: vaurien
  rationale: Dans cette construction, le terme qualifie une personne sans valeur morale. « Vaurien » exprime ce jugement sans introduire le nom propre tardif « Bélial ».
- source_word: אִישׁ
  choice: homme
  rationale: Ce choix conserve le parallélisme hébreu avec אָדָם et désigne ici l’individu décrit par le proverbe.
- source_word: אָוֶן
  choice: malfaisant
  rationale: Le mot évoque ici le mal moral et les actes nuisibles. L’adjectif « malfaisant » produit en français une caractérisation naturelle équivalant à « homme de mal ».
- source_word: הוֹלֵךְ
  choice: va de-ci de-là
  rationale: Le participe décrit la manière habituelle d’aller et d’agir du personnage. « Va de-ci de-là » est naturel en français et garde l’idée de déplacement, sans réduire le verbe à la seule conduite abstraite.
- source_word: עִקְּשׁוּת פֶּה
  choice: en tenant des propos pervers
  rationale: L’expression littérale « perversité de bouche » désigne une parole tortueuse ou perverse. La formulation française explicite l’usage de la bouche tout en réservant l’image concrète à la note.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Vaurien » est bref et énergique; « va de-ci de-là en tenant des propos pervers » évite le calque peu naturel « marche avec une bouche perverse » tout en conservant ses composantes dans le texte et la note.
