- from: Un vaurien, un homme malfaisant, va de-ci de-là en tenant des propos pervers[a].
  to: Un vaurien, un homme malfaisant, va en tenant des propos tortueux[a].
  rationale: La révision retire l’ajout sémantique « de-ci de-là », conserve la valeur dynamique et habituelle de הוֹלֵךְ, et ajuste la note afin de distinguer la forme littérale hébraïque de ses traductions françaises possibles. Aucun enjeu doctrinal n’est en cause.
