source:
  edition: WLC
  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: fr
  text: Quand tu marcheras, elle[a] te guidera ; quand tu te coucheras, elle veillera sur toi ; quand tu te réveilleras, elle te parlera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Elle » renvoie à l’instruction ou à l’enseignement mentionné dans le contexte. Le pronom hébreu est féminin et peut aussi faire écho à la sagesse personnifiée comme une femme dans les Proverbes.
    reason: Préciser le référent du pronom féminin et préserver la possible personnification.
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: quand tu seras en chemin
  rationale: Le בְּ temporel suivi de l’infinitif construit du hitpael de הלך décrit le fait d’aller, de circuler ou de suivre son chemin. Cette formulation naturelle conserve à la fois la scène concrète et sa possible portée sur la conduite de la vie.
- source_word: תַּנְחֶה אֹתָךְ
  choice: elle te guidera
  rationale: Le hifil de נחה signifie « conduire, guider ». « Guider » convient au rôle de l’instruction évoquée dans le contexte.
- source_word: בְּשָׁכְבְּךָ
  choice: quand tu te coucheras
  rationale: Le בְּ temporel avec l’infinitif de שכב désigne le moment où l’on s’étend ou se couche, sans remplacer cette action par le sommeil lui-même.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: elle veillera sur toi
  rationale: שמר avec עַל exprime ici la garde et la protection. « Veiller sur » est idiomatique en français moderne et garde cette nuance protectrice.
- source_word: וַהֲקִיצוֹתָ
  choice: à ton réveil
  rationale: La forme de קיץ/יקץ marque le réveil et poursuit la série temporelle du verset. Le tour nominal est naturel et concis en français.
- source_word: הִיא
  choice: elle
  rationale: Le pronom hébreu est explicitement féminin singulier. Le français permet de conserver ce genre en renvoyant à l’instruction ou à la loi enseignée dans le contexte.
- source_word: תְשִׂיחֶךָ
  choice: elle te parlera
  rationale: Le verbe שׂיח peut évoquer la parole, l’entretien ou la méditation. « Te parlera » restitue simplement la relation personnelle exprimée ici sans transformer la parole en une explication doctrinale plus précise que l’hébreu.
theological_decisions:
- issue: Référent féminin et personnification de l’instruction
  choice: Employer « elle » dans le texte et signaler son référent contextuel en note
  alternative: Reformuler avec un nom explicite, comme « cette instruction », ou atténuer la personnification
  rationale: הִיא est féminin et renvoie vraisemblablement à la תּוֹרָה, l’instruction mentionnée dans le contexte, tout en faisant écho à la personnification féminine de la sagesse dans les Proverbes. « Elle » conserve cette donnée sans identifier davantage la figure.
- issue: Portée de תְשִׂיחֶךָ
  choice: elle te parlera
  alternative: elle s’entretiendra avec toi / elle nourrira ta méditation
  rationale: Le lexème permet plusieurs nuances liées à la parole et à la réflexion. La traduction choisie garde la formulation ouverte et relationnelle sans trancher en faveur d’une méditation intérieure ou d’un enseignement formel.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme ternaire du verset est maintenu, avec des verbes au futur et une ponctuation qui met en valeur les trois moments de la vie quotidienne.
