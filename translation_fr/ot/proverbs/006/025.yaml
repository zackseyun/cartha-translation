  text: אַל תַּחְמֹ֣ד יָ֭פְיָ/הּ בִּ/לְבָבֶ֑/ךָ וְ/אַל תִּ֝קָּֽחֲ/ךָ֗ בְּ/עַפְעַפֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/025.yaml
  text: Do not desire her beauty in your heart[b][a], and do not let yourself be captured by her eyelashes.
translation:
  language: fr
  text: Ne désire pas sa beauté dans ton cœur[a], et qu’elle ne te séduise pas par ses regards[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne convoite pas sa beauté au fond de toi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qu’elle ne te prenne pas par ses paupières » ; il s’agit du pouvoir séducteur de son regard.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: désire
  rationale: Le verbe חמד exprime ici un désir intérieur qui peut devenir convoitise. « Désire » reste naturel et suffisamment large, tandis que la note signale l’alternative « convoite ».
- source_word: יָפְיָהּ
  choice: sa beauté
  rationale: Rendu direct et idiomatique du nom יֹפִי, qui désigne la beauté ou l’attrait.
- source_word: בִּלְבָבֶךָ
  choice: dans ton cœur
  rationale: Conserve l’image anthropologique hébraïque du cœur comme siège des désirs et des intentions.
- source_word: תִּקָּחֲךָ
  choice: qu’elle ne te séduise pas
  rationale: Littéralement, le verbe signifie « qu’elle ne te prenne pas ». Dans ce contexte, la prise s’effectue par l’attrait des yeux; « séduise » exprime naturellement l’effet visé sans effacer le sens littéral, conservé en note.
- source_word: בְּעַפְעַפֶּיהָ
  choice: par ses regards
  rationale: עַפְעַף désigne littéralement les paupières, mais celles-ci représentent ici le jeu séducteur des yeux. « Par ses regards » communique naturellement l’image en français moderne; la formulation concrète est conservée en note.
