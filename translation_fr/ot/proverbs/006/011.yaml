source:
  edition: WLC
  text: וּ/בָֽא כִ/מְהַלֵּ֥ךְ רֵאשֶׁ֑/ךָ וּ֝/מַחְסֹֽרְ/ךָ֗ כְּ/אִ֣ישׁ מָגֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/011.yaml
  text: and your poverty will come like a prowler[b][a], and your lack like an armed man.
translation:
  language: fr
  text: alors ta pauvreté viendra comme un rôdeur[a], et ton dénuement comme un homme armé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « comme quelqu’un qui va et vient ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un homme muni d’un bouclier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: alors … viendra
  rationale: Le parfait qal de בוא exprime ici le résultat annoncé de la paresse décrite au verset précédent. « Viendra » rend naturellement cette valeur dans un avertissement proverbial, tandis que « alors » explicite sobrement le lien conséquentiel.
- source_word: כִמְהַלֵּךְ
  choice: comme un rôdeur
  rationale: Le participe de הלך désigne littéralement quelqu’un qui marche ou circule. Dans ce contexte menaçant, « rôdeur » restitue l’image vive sans masquer dans la note le sens plus littéral et moins déterminé.
- source_word: רֵאשֶׁךָ
  choice: ta pauvreté
  rationale: רֵאשׁ désigne ici la pauvreté matérielle. « Pauvreté » est clair, courant et distinct du terme parallèle מַחְסוֹר.
- source_word: וּמַחְסֹרְךָ
  choice: et ton dénuement
  rationale: מַחְסוֹר évoque le manque, le besoin ou la privation. « Dénuement » conserve le parallélisme avec « pauvreté » tout en exprimant l’état de manquer du nécessaire.
- source_word: כְּאִישׁ מָגֵן
  choice: comme un homme armé
  rationale: L’expression signifie littéralement « comme un homme avec un bouclier ». « Homme armé » rend en français actuel la force menaçante de la comparaison, tandis que la formulation concrète est conservée en note.
theological_decisions: []
