translation:
  language: fr
  text: Tu as été pris au piège par les paroles de ta bouche, tu as été pris par les paroles de ta bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: tu t’es laissé prendre
  rationale: Le nifal de יקש exprime le fait d’être pris dans un piège. Cette tournure française est naturelle et conserve l’image implicite du piège sans alourdir le premier membre.
- source_word: בְאִמְרֵי
  choice: par les paroles de
  rationale: 'La préposition ב a ici une valeur instrumentale : les paroles sont le moyen par lequel la personne se trouve prise. « Paroles » rend naturellement le pluriel construit אִמְרֵי.'
- source_word: פִיךָ
  choice: ta bouche
  rationale: La traduction concrète de פֶּה préserve l’expression hébraïque et la répétition rhétorique, tout en restant intelligible en français.
- source_word: נִלְכַּדְתָּ
  choice: tu as été pris au piège
  rationale: Le nifal de לכד signifie être capturé ou pris. « Pris au piège » explicite naturellement en français l’image commune aux deux membres et forme un parallèle renforcé.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier correspond à l’adresse paternelle du contexte. La répétition de « par les paroles de ta bouche » est maintenue afin de préserver le parallélisme emphatique de l’hébreu.
