  source_fidelity: Le premier verbe, נוֹקַשְׁתָּ, est un nifal passif (« tu as été pris au piège / enlacé dans un piège »). La formulation proposée « tu t’es laissé prendre » introduit indûment une idée de consentement ou de responsabilité volontaire absente de l’hébreu. Le second nifal, נִלְכַּדְתָּ, est bien rendu par « tu as été pris » ; la répétition de « par les paroles de ta bouche » reflète fidèlement le parallélisme.
  naturalness: « Tu as été pris au piège ... tu as été pris ... » est idiomatique en français moderne et conserve à la fois l’image du piège dans le premier membre et le parallélisme intensif du verset.
