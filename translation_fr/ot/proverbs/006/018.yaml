  text: לֵ֗ב חֹ֭רֵשׁ מַחְשְׁב֣וֹת אָ֑וֶן רַגְלַ֥יִם מְ֝מַהֲר֗וֹת לָ/ר֥וּץ לָֽ/רָעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/018.yaml
  text: a heart that devises wicked plans[a], feet that hurry to run to evil,
translation:
  language: fr
  text: un cœur qui conçoit des projets malfaisants[a], des pieds qui se hâtent de courir vers le mal,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cœur qui trame des desseins mauvais ».
    reason: Alternative lexicale reflétant les nuances possibles de חֹרֵשׁ, מַחְשְׁבוֹת et אָוֶן.
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Conserve l’image anthropologique hébraïque du siège de la pensée et de l’intention, sans la réduire au seul intellect.
- source_word: חֹרֵשׁ
  choice: conçoit
  rationale: Dans cet emploi figuré, le verbe signifie élaborer ou tramer. « Conçoit » s’associe naturellement à « projets » et exprime la formation intentionnelle.
- source_word: מַחְשְׁבוֹת
  choice: projets
  rationale: Le nom désigne des pensées élaborées, des desseins ou des plans. « Projets » rend ici l’idée d’une intention organisée.
- source_word: אָוֶן
  choice: malfaisants
  rationale: Le terme peut évoquer le mal, l’iniquité ou le méfait. « Malfaisants » qualifie clairement les projets sur le plan moral tout en évitant de répéter immédiatement « mal ».
- source_word: רַגְלַיִם
  choice: pieds
  rationale: La traduction littérale préserve l’image corporelle de la liste des choses que l’Éternel déteste.
- source_word: מְמַהֲרוֹת
  choice: se hâtent
  rationale: Le participe exprime la promptitude et l’empressement. « Se hâtent » convient au registre proverbial et reste courant.
- source_word: לָרוּץ
  choice: de courir
  rationale: Rend directement l’infinitif et maintient l’image d’un mouvement empressé.
- source_word: לָרָעָה
  choice: vers le mal
  rationale: Rend naturellement en français la préposition et le nom, sans ajouter explicitement l’idée de « faire » absente de l’hébreu.
