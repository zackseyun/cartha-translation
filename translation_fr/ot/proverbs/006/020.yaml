  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: fr
  text: Garde, mon fils, le commandement de ton père, et n’abandonne pas l’enseignement de ta mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: Garde
  rationale: L’impératif de נצר exprime l’idée de garder avec soin, de préserver et d’observer. « Garde » conserve cette nuance protectrice tout en restant naturel en français.
- source_word: בְּנִי
  choice: mon fils
  rationale: L’hébreu est explicitement masculin singulier avec un suffixe de première personne ; « mon fils » respecte la forme et le cadre parental du livre des Proverbes.
- source_word: מִצְוַת
  choice: le commandement
  rationale: מִצְוָה désigne un ordre ou commandement. « Le commandement » en restitue le poids sans confondre ce terme avec l’enseignement de la ligne parallèle.
- source_word: אָבִיךָ
  choice: de ton père
  rationale: Cette formulation française traduit naturellement le groupe construit hébreu et maintient le parallélisme parental.
- source_word: תִּטֹּשׁ
  choice: n’abandonne pas
  rationale: נטש signifie laisser ou abandonner. « N’abandonne pas » est actuel, clair et exprime pleinement la gravité de l’exhortation.
- source_word: תּוֹרַת
  choice: l’enseignement
  rationale: Dans ce contexte de sagesse familiale, תּוֹרָה renvoie à une formation ou à un enseignement plutôt qu’à une législation codifiée.
- source_word: אִמֶּךָ
  choice: de ta mère
  rationale: La tournure traduit naturellement le construit hébreu et préserve le parallèle avec « de ton père ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle entre le commandement du père et l’enseignement de la mère est conservée, ainsi que l’adresse masculine singulière.
