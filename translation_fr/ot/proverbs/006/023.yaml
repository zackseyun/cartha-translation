id: PRO.6.23
reference: Proverbs 6:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י נֵ֣ר מִ֭צְוָה וְ/ת֣וֹרָה א֑וֹר וְ/דֶ֥רֶךְ חַ֝יִּ֗ים תּוֹכְח֥וֹת מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: fr
  text: Car le commandement est une lampe, et l’enseignement est une lumière ; les réprimandes qui forment sont le chemin de la vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chemin qui mène à la vie ». L’hébreu peut évoquer aussi bien une manière de vivre que le chemin conduisant à la vie.
    reason: ambiguïté_sémantique
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et convient au style sentencieux du proverbe.
- source_word: נֵר
  choice: une lampe
  rationale: Conserve l’image concrète et la distingue de אוֹר, « lumière ».
- source_word: מִצְוָה
  choice: le commandement
  rationale: Rend la force normative d’une prescription faisant autorité dans le cadre de l’enseignement parental.
- source_word: תּוֹרָה
  choice: l’enseignement
  rationale: Dans ce contexte sapientiel, le mot désigne vraisemblablement un enseignement normatif plutôt que spécifiquement la Loi mosaïque.
- source_word: אוֹר
  choice: une lumière
  rationale: Préserve le parallélisme imagé avec la lampe et l’idée d’éclairage directeur.
- source_word: תּוֹכְחוֹת מוּסָר
  choice: les réprimandes qui corrigent
  rationale: Expression française naturelle qui associe les reproches verbaux à leur fonction de correction et de formation.
- source_word: דֶרֶךְ חַיִּים
  choice: le chemin de la vie
  rationale: Conserve l’expression sapientielle, laquelle peut désigner à la fois une conduite caractérisée par la vie et le chemin qui y mène.
theological_decisions:
- issue: Sens de תּוֹרָה dans le contexte sapientiel
  choice: l’enseignement
  alternative: la loi
  rationale: Le contexte immédiat porte sur l’enseignement parental. « Enseignement » maintient son autorité sans l’identifier plus étroitement à la Loi mosaïque.
- issue: Portée de דֶרֶךְ חַיִּים
  choice: le chemin de la vie
  alternative: le chemin qui mène à la vie
  rationale: La formulation retenue préserve l’ambiguïté de l’hébreu entre le mode de vie et le chemin conduisant à la vie.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme lampe/lumière est conservé. « Réprimandes qui corrigent » évite la tournure peu naturelle « réprimandes de discipline » tout en gardant les deux composantes de l’expression hébraïque.
