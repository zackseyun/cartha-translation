  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: fr
  text: Mon fils, si tu t’es porté garant pour ton prochain, si tu as scellé un engagement par une poignée de main avec un inconnu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si tu as frappé tes paumes à/pour un étranger ». Il s’agit du geste des mains par lequel on scellait un engagement ; le rapport exact indiqué par « à/pour » reste condensé dans l’expression hébraïque.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Vocatif paternel ou pédagogique courant dans les Proverbes; la formulation conserve le masculin singulier et reste naturelle en français.
- source_word: אִם
  choice: si
  rationale: Introduit ici une condition, poursuivie au verset suivant.
- source_word: עָרַבְתָּ
  choice: tu t’es porté garant
  rationale: Le verbe désigne le fait de garantir la dette ou l’obligation d’autrui. Cette expression française rend clairement la portée juridique et financière.
- source_word: לְרֵעֶךָ
  choice: pour ton prochain
  rationale: רֵעַ peut désigner un ami, un compagnon ou une personne avec laquelle on est en relation. « Prochain » conserve cette étendue sans supposer une amitié intime.
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: tu as frappé dans la main
  rationale: L’expression française rend naturellement le geste concret par lequel on scellait un accord, tout en conservant l’image corporelle de l’hébreu.
- source_word: לַזָּר
  choice: d’un inconnu
  rationale: זָר désigne une personne étrangère au cercle habituel, un inconnu ou un tiers. « Inconnu » est naturel dans ce contexte sans suggérer nécessairement une nationalité étrangère.
