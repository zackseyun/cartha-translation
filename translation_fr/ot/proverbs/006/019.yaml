  terminology: « Faux témoin » est le terme juridique et moral français approprié. « Mensonges », « querelles » et « frères » sont fidèles et adaptés. La note sur « frères » préserve correctement la possibilité d’une référence familiale ou communautaire plus large sans neutraliser le terme du texte.
