  source_fidelity: 'Le sens est globalement fidèle : עֵד שָׁקֶר est bien « faux témoin », כְּזָבִים « mensonges », et בֵּין אַחִים « entre frères ». Toutefois, « exhale des mensonges » transpose de façon trop calquée l’image de יָפִיחַ et ne constitue pas un usage français naturel pour l’énonciation mensongère. « Profère des mensonges » rend de manière exacte et idiomatique l’acte de produire/énoncer des mensonges, sans ajout interprétatif. « Propage des querelles » rend adéquatement le participe מְשַׁלֵּחַ dans ce contexte de conflit suscité ou répandu.'
