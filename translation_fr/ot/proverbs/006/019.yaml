  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
translation:
  language: fr
  text: le faux témoin qui profère des mensonges[a], et celui qui propage des querelles entre frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le témoin menteur qui profère des faussetés ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « entre frères »; il peut s’agir de frères au sens propre ou, plus largement, de membres proches d’une même communauté.
    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: exhale
  rationale: Le hiphil de פוח évoque le fait de faire sortir son souffle et, par image, de proférer des paroles. « Exhale » conserve cette métaphore vive tout en restant intelligible en français.
- source_word: כְּזָבִים
  choice: des mensonges
  rationale: Le pluriel désigne des faussetés ou des mensonges. « Des mensonges » est direct, naturel et conserve la force morale du terme.
- source_word: עֵד שָׁקֶר
  choice: le faux témoin
  rationale: L’expression signifie littéralement « témoin de fausseté ». « Faux témoin » est la formulation juridique et morale consacrée en français.
- source_word: וּמְשַׁלֵּחַ
  choice: et celui qui propage
  rationale: Le participe de שלח signifie littéralement « envoyer »; avec les querelles pour objet, il présente quelqu’un qui les fait circuler ou les répand. « Propage » rend cette action de manière naturelle sans introduire l’image différente de semailles.
- source_word: מְדָנִים
  choice: des querelles
  rationale: Le nom désigne des contestations ou des conflits. « Querelles » convient au pluriel hébreu et s’emploie naturellement avec « propage ».
- source_word: בֵּין אַחִים
  choice: entre frères
  rationale: Cette traduction suit directement la préposition « entre » et le masculin pluriel « frères », tout en laissant au contexte la possibilité d’un sens familial ou communautaire.
theological_decisions:
- issue: Portée du terme relationnel masculin אַחִים
  choice: frères
  alternative: proches; membres d’une même communauté
  rationale: L’hébreu emploie explicitement le masculin pluriel « frères ». Le texte principal conserve cette forme et sa texture sociale, tandis qu’une note signale que son référent peut dépasser les frères biologiques.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image respiratoire de יָפִיחַ, le caractère actif de וּמְשַׁלֵּחַ et le masculin concret de אַחִים, sans résoudre indûment la portée familiale ou communautaire de ce dernier.
