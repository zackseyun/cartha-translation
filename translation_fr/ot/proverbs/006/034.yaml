  variant: modern international French
source:
  edition: WLC
  text: כִּֽי קִנְאָ֥ה חֲמַת גָּ֑בֶר וְ/לֹֽא יַ֝חְמ֗וֹל בְּ/י֣וֹם נָקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: fr
  text: Car la jalousie est la fureur d’un homme, et il sera sans pitié au jour de la vengeance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: la jalousie
  rationale: Dans ce contexte d’adultère et de mari lésé, le terme désigne naturellement la jalousie, plutôt qu’un zèle plus général.
- source_word: חֲמַת גָּבֶר
  choice: met un homme en fureur
  rationale: La construction nominale est rendue idiomatiquement en français tout en conservant le lien étroit entre la jalousie et la fureur de l’homme.
- source_word: יַחְמוֹל
  choice: sera sans pitié
  rationale: Le verbe exprime le fait d’épargner ou d’avoir compassion; la formulation négative française traduit clairement l’absence de pitié.
- source_word: בְּיוֹם נָקָם
  choice: au jour de la vengeance
  rationale: Rend directement l’expression temporelle hébraïque et préserve la gravité judiciaire ou punitive de נָקָם.
theological_decisions:
- issue: Portée descriptive de la vengeance
  choice: Conserver « vengeance » sans préciser si elle est privée, judiciaire ou divine.
  alternative: Employer « représailles » ou expliciter « le jour où il se vengera ».
  rationale: Le contexte suggère la réaction du mari lésé, mais le texte hébreu reste concis; la traduction ne doit ni approuver moralement l’acte ni en fixer davantage la nature.
translation_notes:
  register: Français moderne, courant et digne. La tournure verbale « met un homme en fureur » évite le calque peu naturel « la jalousie est la fureur d’un homme » tout en préservant le sens et le parallélisme causal du verset.
