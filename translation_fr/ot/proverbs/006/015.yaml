source:
  edition: WLC
  text: עַל כֵּ֗ן פִּ֭תְאֹם יָב֣וֹא אֵיד֑/וֹ פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/015.yaml
  text: Therefore his disaster will come suddenly[a]; in an instant he will be broken[b], and there will be no healing.
translation:
  language: fr
  text: C’est pourquoi son malheur viendra soudain[a] ; en un instant, il sera brisé, sans remède[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa calamité surviendra soudain » ; ou « sa ruine viendra soudain ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et il n’y aura pas de guérison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque la conséquence de la conduite décrite dans les versets précédents ; « C’est pourquoi » en conserve clairement la valeur logique.
- source_word: פִּתְאֹם
  choice: soudain
  rationale: L’adverbe exprime la soudaineté ; « soudain » est direct, naturel et fidèle.
- source_word: יָבֹוא אֵידוֹ
  choice: son malheur viendra
  rationale: אֵיד désigne un malheur, une calamité ou une ruine. « Malheur » convient au registre sapientiel et ne précise pas indûment la nature du désastre.
- source_word: פֶּתַע
  choice: en un instant
  rationale: Cette seconde expression de soudaineté intensifie la première. Une formulation différente évite d’aplatir le parallélisme hébreu.
- source_word: יִשָּׁבֵר
  choice: il sera brisé
  rationale: Le niphal de שׁבר exprime ici le fait d’être brisé. Le passif préserve l’image générale d’un effondrement ou d’une destruction.
- source_word: וְאֵין מַרְפֵּא
  choice: sans remède
  rationale: מַרְפֵּא peut désigner la guérison, le remède ou la possibilité de restauration. « Sans remède » est idiomatique en français et exprime le caractère irréversible du jugement sans surinterpréter l’image.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé par « soudain » puis « en un instant », tandis que « il sera brisé » maintient l’image passive et ouverte du texte hébreu.
