source:
  edition: WLC
  text: כִּ֤י בְעַד אִשָּׁ֥ה זוֹנָ֗ה עַֽד כִּכַּ֫ר לָ֥חֶם וְ/אֵ֥שֶׁת אִ֑ישׁ נֶ֖פֶשׁ יְקָרָ֣ה תָצֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/026.yaml
  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: fr
  text: Car, à cause d’une prostituée, on en est réduit à une miche de pain[a], mais la femme d’un autre prend au piège une vie précieuse[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Car, à cause d’une prostituée, jusqu’à une miche de pain. » L’hébreu est très condensé ; beaucoup comprennent qu’un homme se trouve réduit à la pauvreté.'
    reason: lexical_alternative
  - marker: b
    text: « La femme d’un autre » traduit littéralement « la femme d’un homme » ; dans le contexte, il s’agit d’une femme mariée dans le cadre d’une relation adultère.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un être précieux » ou « une âme précieuse ». Le mot hébreu peut désigner l’être, la personne ou la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de l’avertissement précédent sans reproduire en français la lourdeur de « car parce que ».
- source_word: בְעַד אִשָּׁה זוֹנָה
  choice: à cause d’une prostituée
  rationale: בְעַד exprime ici vraisemblablement la cause ou la conséquence, et אִשָּׁה זוֹנָה désigne clairement une prostituée.
- source_word: עַד כִּכַּר לָחֶם
  choice: on en est réduit à un morceau de pain
  rationale: La tournure hébraïque est elliptique. Cette formulation rend l’idée probable d’appauvrissement tout en conservant l’image du pain; « morceau » exprime naturellement en français la faible valeur ou la subsistance minimale évoquée.
- source_word: וְאֵשֶׁת אִישׁ
  choice: mais la femme d’un autre
  rationale: Littéralement « et la femme d’un homme ». Le contexte vise la femme mariée avec laquelle un homme commettrait l’adultère; « d’un autre » explicite seulement la relation contextuelle et le contraste, tandis que « mais » rend sa valeur adversative.
- source_word: נֶפֶשׁ יְקָרָה
  choice: une vie précieuse
  rationale: נֶפֶשׁ peut désigner l’être, la personne ou la vie. Dans cet avertissement portant sur un péril extrême, « vie » convient le mieux sans exclure les autres nuances.
- source_word: תָצוּד
  choice: prend au piège
  rationale: Le verbe appartient au domaine de la chasse et du piégeage. Cette expression conserve l’image prédatrice et son objet direct.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite prudemment l’ellipse hébraïque sans effacer son incertitude, signalée en note. Le parallélisme et la métaphore de la chasse sont préservés.
