  text: Can a man carry fire in his bosom and his clothes not be burned?[a]
translation:
  language: fr
  text: Un homme peut-il porter du feu dans son sein[a] sans que ses vêtements brûlent ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son giron », « sur ses genoux » ou « contre sa poitrine » ; l’hébreu désigne la région du sein ou du giron, probablement aussi le repli du vêtement où l’on pouvait tenir quelque chose tout près de soi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: prendre
  rationale: Le verbe חתה désigne ici le fait de prendre ou de ramasser du feu. « Prendre » restitue directement l’action sans préciser au-delà de l’hébreu si le feu est porté ou amassé.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et s’inscrit dans une mise en garde adressée à un homme dans le contexte immédiat.
- source_word: אֵשׁ
  choice: du feu
  rationale: Équivalent français direct et naturel.
- source_word: בְּחֵיקוֹ
  choice: contre lui
  rationale: חֵיק désigne la région de la poitrine ou du giron, notamment le repli du vêtement où l’on peut tenir quelque chose tout près de soi. « Contre lui » donne une image naturelle en français, tandis qu’une note conserve les nuances concrètes possibles.
- source_word: וּבְגָדָיו
  choice: ses vêtements
  rationale: Équivalent moderne et courant de בְּגָדִים.
- source_word: לֹא תִשָּׂרַפְנָה
  choice: sans que ses vêtements brûlent
  rationale: La tournure française exprime naturellement la conséquence niée dans cette question rhétorique. « Brûlent » conserve le sens de שׂרף sans l’affaiblir en simple roussissement.
