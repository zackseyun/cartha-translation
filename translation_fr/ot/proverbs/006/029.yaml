translation_notes:
  register: Français moderne, sobre et proverbial. « Il en va de même » assure le lien avec l’image précédente; « la femme de son prochain » conserve la formulation relationnelle du texte; les marqueurs de notes sont placés immédiatement après les expressions concernées.
