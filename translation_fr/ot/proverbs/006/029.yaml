id: PRO.6.29
reference: Proverbs 6:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֵּ֗ן הַ֭/בָּא אֶל אֵ֣שֶׁת רֵעֵ֑/הוּ לֹ֥א יִ֝נָּקֶ֗ה כָּֽל הַ/נֹּגֵ֥עַ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: fr
  text: 'Il en va de même pour celui qui va vers la femme de son prochain : quiconque la touche[b] ne restera pas impuni[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne sera pas acquitté » ou « ne sera pas tenu pour innocent ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « la touche » désigne vraisemblablement un contact sexuel illicite, et non un simple contact physique fortuit.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Il en va de même
  rationale: Cette formule naturelle en français rattache explicitement le verset à la comparaison des versets précédents.
- source_word: הַבָּא
  choice: celui qui va vers
  rationale: Le participe avec article désigne « celui qui… ». « Va vers » conserve le mouvement exprimé par בוא אל tout en laissant le contexte préciser la portée sexuelle.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: vers la femme de son prochain
  rationale: « Son prochain » préserve la dimension relationnelle et éthique de רֵעַ sans généraliser en « la femme d’un autre ».
- source_word: לֹא יִנָּקֶה
  choice: ne restera pas impuni
  rationale: Le nifal de נקה exprime ici le fait de ne pas échapper à la sanction ou de ne pas être tenu pour innocent. Cette formulation est claire et idiomatique.
- source_word: כָּל
  choice: quiconque
  rationale: Le terme a ici une valeur distributive et universelle avec le participe qui suit.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: la touche
  rationale: Cette traduction maintient le verbe concret et sobre du texte hébreu, sans expliciter dans le corps du verset le contact sexuel suggéré par le contexte.
