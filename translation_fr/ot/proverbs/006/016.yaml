source:
  edition: WLC
  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: fr
  text: 'Il y a six choses que Yahweh déteste, et sept qui lui font horreur[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sept abominations pour son âme », c’est-à-dire sept choses qui lui sont odieuses.'
    reason: alternative lexicale et formulation littérale
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: Il y a six choses
  rationale: La tournure existentielle rend naturellement en français l’introduction du proverbe numérique et anticipe les éléments énumérés dans les versets suivants.
- source_word: שָׂנֵא
  choice: déteste
  rationale: Le verbe exprime une forte aversion. « Déteste » conserve cette vigueur dans un français actuel et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: וְשֶׁבַע
  choice: et sept
  rationale: Cette formulation conserve sans l’expliciter la structure numérique hébraïque x / x+1 (« six… et sept »).
- source_word: תועבות
  choice: qui lui font horreur
  rationale: Le pluriel désigne des choses profondément odieuses. La locution française exprime clairement cette forte répulsion sans lourdeur.
- source_word: נַפְשׁוֹ
  choice: lui
  rationale: Dans ce contexte, נֶפֶשׁ désigne idiomatiquement la personne elle-même. « Lui » transmet ce sens sans imposer une conception particulière de l’âme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. Sa transcription préserve le nom personnel au lieu de lui substituer un titre.
- issue: Expression anthropomorphique « abominations de son âme »
  choice: sept qui lui font horreur
  alternative: sept abominations pour son âme
  rationale: נַפְשׁוֹ renvoie ici idiomatiquement à Dieu lui-même. Le texte principal adopte un français naturel, tandis que la note conserve la forme littérale et la tension de l’expression source.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique « six… et sept » est conservée, sans ajouter « même » ni expliquer dans le texte principal la progression numérique.
