  text: winking with his eyes[a], signaling with his feet[b], pointing with his fingers.
translation:
  language: fr
  text: il fait des clins d’œil[a], fait des signes du pied[b] et fait des gestes avec ses doigts[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cligne des yeux» ou, plus généralement, «fait des signes avec ses yeux».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est rare et le geste précis reste incertain. On peut aussi comprendre «remue le pied» ou «frotte le sol du pied»; dans ce contexte, il s’agit vraisemblablement d’un signal discret.
    reason: lexical_alternative
  - marker: c
    text: Ou «indique du doigt» ou «dirige avec ses doigts». Le verbe hébreu peut également signifier «enseigner», mais le contexte décrit ici des gestes corporels.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ בְּעֵינָיו
  choice: fait des clins d’œil
  rationale: Le participe décrit un geste furtif des yeux servant de signal. Cette expression française est naturelle et conserve l’idée d’une communication dissimulée.
- source_word: מֹלֵל בְּרַגְלוֹ
  choice: donne des signes du pied
  rationale: Le verbe rare מֹלֵל est incertain; le parallélisme avec les yeux et les doigts indique vraisemblablement un signal corporel. Le singulier «du pied» respecte aussi la forme hébraïque בְּרַגְלוֹ.
- source_word: מֹרֶה בְּאֶצְבְּעֹתָיו
  choice: fait des gestes avec ses doigts
  rationale: מֹרֶה peut signifier montrer, diriger ou enseigner. Dans cette série de signaux corporels, «fait des gestes» exprime le sens contextuel sans réduire nécessairement le mouvement au seul fait de pointer.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La construction en trois membres conserve le parallélisme hébreu. Les notes maintiennent l’incertitude propre au verbe rare מֹלֵל et la polysémie de מֹרֶה.
