  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲשֵׂ֨ה זֹ֥את אֵפ֪וֹא בְּנִ֡/י וְֽ/הִנָּצֵ֗ל כִּ֘י בָ֤אתָ בְ/כַף רֵעֶ֑/ךָ לֵ֥ךְ הִ֝תְרַפֵּ֗ס וּ/רְהַ֥ב רֵעֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: fr
  text: 'Fais donc ceci, mon fils, et dégage-toi, puisque tu es tombé au pouvoir de ton prochain[a] : va, abaisse-toi[b] et insiste auprès de tes prochains[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la paume de ton prochain », image signifiant être en son pouvoir ou sous son emprise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « humilie-toi », voire « jette-toi à ses pieds ». Le verbe hébreu est rare et son geste précis demeure incertain.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu porte ici le pluriel « tes prochains », bien que le contexte précédent soit au singulier; certains comprennent donc : « ton prochain » ou « ton ami ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: Fais donc ceci
  rationale: L’impératif et le démonstratif sont rendus directement. « Donc » exprime la conclusion pressante marquée par אֵפוֹא sans ajouter de contenu.
- source_word: בְּנִי
  choice: mon fils
  rationale: Cette adresse masculine singulière, caractéristique de la littérature de sagesse, est conservée.
- source_word: וְהִנָּצֵל
  choice: et dégage-toi
  rationale: Le nifal impératif de נצל appelle le destinataire à se tirer de la situation où il s’est placé. « Dégage-toi » garde la force réflexive et l’urgence.
- source_word: כִּי בָאתָ בְכַף רֵעֶךָ
  choice: puisque tu es tombé au pouvoir de ton prochain
  rationale: כִּי introduit ici le motif de l’exhortation. L’image de la paume désigne le pouvoir ou l’emprise d’autrui; le français idiomatique « tomber au pouvoir de » exprime cet état résultant, tandis que l’image littérale est signalée en note.
- source_word: לֵךְ
  choice: va
  rationale: L’impératif simple est conservé et introduit les démarches urgentes à entreprendre.
- source_word: הִתְרַפֵּס
  choice: abaisse-toi
  rationale: Ce verbe rare semble demander de se faire petit ou de s’humilier devant l’autre. « Abaisse-toi » préserve cette posture sans imposer un geste physique précis.
- source_word: וּרְהַב
  choice: et insiste auprès de
  rationale: Dans ce contexte, l’impératif exprime une sollicitation énergique et persistante. « Insiste auprès de » reste naturel sans introduire un objet tel que « requête », absent de l’hébreu.
- source_word: רֵעֶיךָ
  choice: tes prochains
  rationale: La forme du texte massorétique est plurielle. Le pluriel est donc maintenu dans le texte, malgré le singulier de רֵעֶךָ dans la proposition précédente.
