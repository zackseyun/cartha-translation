lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Attache-les
  rationale: L’impératif qal de קשר exprime l’action concrète de fixer ou d’attacher. « Attache-les » conserve l’image tout en étant naturel en français.
- source_word: לִבְּךָ
  choice: à ton cœur
  rationale: Le terme désigne le cœur comme centre de la pensée, de la volonté et de la vie intérieure. « Cœur » préserve l’image anthropologique hébraïque sans la réduire à la seule intelligence.
- source_word: תָמִיד
  choice: sans cesse
  rationale: L’adverbe exprime une constance durable ou habituelle. « Sans cesse » rend cette continuité dans un français actuel et fluide.
- source_word: עָנְדֵם
  choice: noue-les
  rationale: Le verbe ענד évoque le fait de fixer ou de mettre un objet, notamment comme un ornement. « Noue-les » maintient l’image concrète et distingue ce verbe du précédent.
- source_word: גַּרְגְּרֹתֶךָ
  choice: autour de ton cou
  rationale: Dans ce contexte d’un objet porté ou fixé comme un ornement, le terme désigne naturellement le cou plutôt que la gorge.
