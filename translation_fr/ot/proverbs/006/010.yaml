  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/010.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: fr
  text: Un peu de sommeil, un peu d’assoupissement, un peu à croiser les mains pour se coucher…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: un peu
  rationale: La répétition de « un peu » conserve l’insistance et le rythme proverbial de l’hébreu.
- source_word: שֵׁנוֹת
  choice: sommeil
  rationale: Bien que le nom soit formellement au pluriel en hébreu, le singulier collectif « sommeil » est naturel en français.
- source_word: תְּנוּמוֹת
  choice: assoupissement
  rationale: Ce terme évoque un sommeil léger et maintient le parallélisme avec « sommeil » dans un registre courant et digne.
- source_word: חִבֻּק יָדַיִם
  choice: les mains croisées
  rationale: Littéralement, l’expression désigne une « étreinte des mains » ; « les mains croisées » restitue naturellement en français la posture d’inaction ou de repos.
- source_word: לִשְׁכָּב
  choice: pour rester couché
  rationale: L’infinitif signifie « se coucher » ou « être couché ». Dans ce contexte, « rester couché » exprime naturellement le but de la posture sans le confondre avec les termes précédents désignant le sommeil.
theological_decisions: []
translation_notes:
  register: Formulation concise et rythmée, dans un français moderne et proverbial. L’ellipse de la troisième proposition est maintenue autant que le permet l’usage français, et les points de suspension rendent la pensée suspendue qui se poursuit au verset suivant.
