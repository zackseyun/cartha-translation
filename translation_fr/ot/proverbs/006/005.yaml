  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: fr
  text: Délivre-toi[a] de la main[c], comme une gazelle[b], et de la main du piégeur, comme un oiseau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Libère-toi » ou « Échappe-toi ». L’impératif hébreu exprime l’urgence de se dégager.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire par « un chevreuil » ; le terme hébreu désigne plus précisément une gazelle.
    reason: lexical_alternative
  - marker: c
    text: Le texte hébreu dit seulement « de la main » dans ce premier membre, sans nommer son détenteur. Certains comprennent, par ellipse, « de la main du piégeur », à la lumière du second membre.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנָּצֵל
  choice: Délivre-toi
  rationale: L’impératif nifal masculin singulier de נצל exhorte le destinataire à se dégager lui-même d’un danger. « Délivre-toi » conserve la force impérative et le sens réfléchi, tout en restant digne et naturel.
- source_word: כִּצְבִי
  choice: comme une gazelle
  rationale: צְבִי désigne couramment la gazelle. Le préfixe כ introduit explicitement la comparaison.
- source_word: מִיָּד
  choice: de la main
  rationale: יָד signifie littéralement « main » et peut évoquer la prise ou le pouvoir de quelqu’un. Le maintien de l’image concrète respecte le parallélisme hébreu, même si le premier membre ne nomme pas celui à qui appartient cette main.
- source_word: וּכְצִפּוֹר
  choice: et comme un oiseau
  rationale: צִפּוֹר est un terme générique désignant un oiseau, souvent de petite taille, sans imposer une espèce précise.
- source_word: מִיַּד יָקוּשׁ
  choice: de la main de l’oiseleur
  rationale: יָקוּשׁ désigne celui qui pose des pièges ou des lacets. Dans le contexte immédiat d’un oiseau, « oiseleur » rend précisément l’agent visé et préserve l’expression « de la main de ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et imagé. La formulation conserve l’ellipse inhabituelle du premier membre hébreu au lieu d’y ajouter silencieusement « du piégeur » ; une note en explicite la difficulté. « Oiseleur » est légèrement littéraire, mais précis, intelligible et adapté au parallélisme poétique.
