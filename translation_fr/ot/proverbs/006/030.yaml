id: PRO.6.30
reference: Proverbs 6:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יָב֣וּזוּ לַ֭/גַּנָּב כִּ֣י יִגְנ֑וֹב לְ/מַלֵּ֥א נַ֝פְשׁ֗/וֹ כִּ֣י יִרְעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/030.yaml
  text: People do not despise a thief if he steals to satisfy himself when he is hungry[a][b].
translation:
  language: fr
  text: On ne méprise pas un voleur s’il vole pour se rassasier quand il a faim[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour remplir son être »; autre traduction possible : « pour satisfaire son appétit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parce qu’il a faim ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: on ne méprise pas
  rationale: Le verbe בוז exprime le mépris. La tournure impersonnelle avec « on » rend naturellement en français la portée générale du pluriel hébreu.
- source_word: לַגַּנָּב
  choice: un voleur
  rationale: Bien que l’hébreu emploie l’article défini, le singulier indéfini convient au caractère proverbial et représente ici tout voleur placé dans cette situation.
- source_word: כִּי יִגְנ֑וֹב
  choice: s’il vole
  rationale: כִּי introduit ici la circonstance dans laquelle l’affirmation s’applique. « S’il » exprime clairement cette valeur conditionnelle sans exclure la nuance circonstancielle.
- source_word: לְמַלֵּ֥א נַפְשׁוֹ
  choice: pour se rassasier
  rationale: L’expression signifie littéralement « remplir son être/sa personne ». Dans le contexte explicite de la faim, « se rassasier » restitue naturellement l’idée de combler son besoin de nourriture.
- source_word: נַפְשׁוֹ
  choice: se
  rationale: נֶפֶשׁ peut désigner la personne, la vie ou l’appétit. Le pronom réfléchi maintient la référence à la personne entière, tandis que la note signale l’image littérale et la nuance d’appétit.
- source_word: כִּי יִרְעָב
  choice: quand il a faim
  rationale: La proposition décrit la circonstance motivant le vol. « Quand » est idiomatique et conserve cette valeur situationnelle; la lecture causale « parce qu’il a faim » reste possible et figure en note.
theological_decisions:
- issue: Portée morale de l’affirmation
  choice: Traduire directement « on ne méprise pas » sans ajouter que le vol serait excusé ou approuvé.
  alternative: Expliciter une condamnation ou une justification morale du voleur.
  rationale: Le verset décrit la réaction sociale envers un vol motivé par la faim; il ne formule pas à lui seul une doctrine morale complète. La traduction préserve cette tension dans son contexte proverbial.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation impersonnelle « on » convient au constat proverbial; « se rassasier » rend l’idiome hébreu dans son contexte de faim sans alourdir le texte.
