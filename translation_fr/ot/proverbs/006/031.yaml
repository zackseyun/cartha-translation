    rationale: Cette locution peut se comprendre comme sept fois en plus de la valeur initiale. « Au septuple » est l’équivalent français établi de « sevenfold » et préserve mieux la formulation compacte de l’hébreu.
  - severity: low
    issue: « toutes les richesses de sa maison » restreint possiblement הוֹן à la richesse financière.
    rationale: Le terme hébreu couvre les biens, ressources ou possessions. « Tous les biens de sa maison » reflète cette étendue et la totalité marquée par כָּל.
