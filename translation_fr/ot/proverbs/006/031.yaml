  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le voleur découvert doit effectuer une restitution considérable, jusqu’à livrer l’ensemble des biens de son foyer. Toutefois, « sept fois autant » est moins précis et peut être compris, en français courant, comme « sept fois de plus » ; « au septuple » rend plus directement l’adverbe hébreu שִׁבְעָתָיִם.'
  naturalness: La phrase est globalement naturelle. « Tous les biens de sa maison » est plus idiomatique et plus exact dans ce contexte que « toutes les richesses de sa maison », car הוֹן peut désigner l’ensemble des possessions, non seulement des richesses au sens financier.
  terminology: « Restituer au septuple » convient au registre sapientiel à coloration juridique et rend היטב la notion de remboursement obligatoire. La note conserve l’alternative « sept fois » sans surinterpréter le calcul exact.
