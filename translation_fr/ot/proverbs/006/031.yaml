id: PRO.6.31
reference: Proverbs 6:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/נִמְצָא יְשַׁלֵּ֣ם שִׁבְעָתָ֑יִם אֶת כָּל ה֖וֹן בֵּית֣/וֹ יִתֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/031.yaml
  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: fr
  text: Mais s’il est pris, il devra restituer au septuple[a] ; il donnera tous les biens de sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept fois ». L’expression hébraïque peut désigner une restitution au septuple, ou un remboursement d’un montant égal à sept fois la valeur prise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: Mais s’il est pris
  rationale: Le nifal de מצא signifie ici être découvert ou pris. Dans le contexte du voleur évoqué au verset précédent, « s’il est pris » est naturel en français et la conjonction marque le contraste avec la compassion dont il peut d’abord faire l’objet.
- source_word: יְשַׁלֵּם
  choice: il devra rendre
  rationale: Le piel de שלם exprime ici la restitution obligatoire. « Devra rendre » communique clairement cette contrainte dans un français moderne.
- source_word: שִׁבְעָתָיִם
  choice: sept fois autant
  rationale: Cette forme numérique peut désigner une restitution au septuple ou un remboursement correspondant à sept fois la valeur dérobée. « Sept fois autant » rend naturellement cette multiplication.
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: toutes les richesses de sa maison
  rationale: הוֹן désigne les richesses, les biens ou les ressources. La formulation conserve la relation avec la maison, comprise comme le foyer ou le patrimoine domestique.
- source_word: יִתֵּן
  choice: il donnera
  rationale: נתן indique l’acte concret de livrer les biens en paiement. Le futur français convient à l’énoncé de la conséquence et évite une répétition lourde de « devra ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure garde le contraste avec le verset précédent et le parallélisme entre la restitution exigée et l’abandon de tout le patrimoine domestique.
