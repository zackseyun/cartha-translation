  text: Si tu te couches, tu n’auras pas peur ; une fois couché, ton sommeil sera doux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Conserve la valeur conditionnelle ou circonstancielle fondamentale de la particule hébraïque, dans une promesse à portée générale.
- source_word: תִּשְׁכַּב
  choice: tu te couches
  rationale: Rend naturellement שׁכב dans le contexte du sommeil tout en restant proche de l’image hébraïque.
- source_word: לֹא תִפְחָד
  choice: tu n’auras pas peur
  rationale: Exprime l’assurance résultative du verbe à l’inaccompli avec négation, sans la transformer en ordre.
- source_word: וְשָׁכַבְתָּ
  choice: une fois couché
  rationale: Reproduit la progression circonstancielle de la proposition et évite en français une répétition lourde de « tu te coucheras ».
- source_word: וְעָרְבָה
  choice: sera doux
  rationale: Dans son association avec le sommeil, ערב désigne ce qui est agréable ou doux ; « sommeil doux » est une expression française naturelle et évocatrice.
- source_word: שְׁנָתֶךָ
  choice: ton sommeil
  rationale: Équivalent direct, clair et courant du nom hébreu désignant le sommeil.
