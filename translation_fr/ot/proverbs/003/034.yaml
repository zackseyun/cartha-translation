id: PRO.3.34
reference: Proverbs 3:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: Surely he scoffs at scoffers[a], but gives favor[b] to the humble[c].
translation:
  language: fr
  text: Certes, il se moque des moqueurs[a], mais il accorde sa faveur[b] aux humbles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il raille les railleurs ». En hébreu, le verbe et le nom sont formés sur la même racine.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa grâce ».
    reason: lexical_alternative
  - marker: c
    text: Ou « aux pauvres » ou « aux affligés ». Le terme peut désigner des personnes abaissées par leur condition ou par les circonstances.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Certes
  rationale: 'Ici, אִם a une valeur d’affirmation plutôt que sa valeur conditionnelle habituelle : aucune proposition principale conditionnelle ne suit, et le proverbe affirme une conduite caractéristique.'
- source_word: לַלֵּצִים … יָלִיץ
  choice: il se moque des moqueurs
  rationale: Cette formulation naturelle reproduit l’écho délibéré de la racine hébraïque לוץ et la réciprocité de l’action.
- source_word: הוּא
  choice: il
  rationale: Le pronom hébreu est conservé sans expliciter son référent; le contexte précédent permet de comprendre qu’il s’agit de Dieu.
- source_word: וְלַעֲנִיִּים
  choice: mais … aux humbles
  rationale: Dans l’antithèse avec les moqueurs, « humbles » exprime bien la posture de personnes abaissées, sans effacer dans la note les sens sociaux et circonstanciels possibles.
- source_word: יִתֶּן
  choice: il accorde
  rationale: Le présent rend la valeur générale et caractéristique de l’imparfait dans ce proverbe; « accorde » forme en français une expression naturelle avec « faveur ».
- source_word: חֵן
  choice: sa faveur
  rationale: « Faveur » convient au contexte sapientiel et évite de restreindre le mot à une acception théologique ultérieure; le possessif est exigé par l’expression française naturelle.
theological_decisions:
- issue: Référent du pronom הוּא
  choice: Maintenir « il », Dieu étant compris d’après le contexte.
  alternative: Expliciter « Dieu » ou « le Seigneur ».
  rationale: Le texte hébreu emploie le pronom et non un nom divin; l’explicitation dans le corps du verset ajouterait un élément absent.
- issue: Sens de עֲנִיִּים dans ce contexte
  choice: « les humbles »
  alternative: « les pauvres », « les affligés » ou « les gens de condition modeste »
  rationale: L’opposition sapientielle avec les moqueurs favorise ici le sens de personnes humbles ou abaissées, tout en laissant ouvertes les dimensions sociale et circonstancielle du terme.
- issue: Valeur de אִם
  choice: 'Valeur asseverative : « Certes »'
  alternative: 'Valeur conditionnelle : « Si »'
  rationale: L’absence d’une apodose distincte et la structure antithétique du proverbe soutiennent une affirmation solennelle; la traduction évite ainsi de fabriquer une condition qui modifierait le sens.
translation_notes:
  register: Français international moderne, clair et digne. « Se moque des moqueurs » conserve de façon immédiatement intelligible le jeu de mots hébreu. « Certes » marque l’affirmation sans lourdeur, tandis que « accorde sa faveur » reste naturel dans un registre biblique contemporain.
