id: PRO.3.30
reference: Proverbs 3:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תרוב עִם אָדָ֣ם חִנָּ֑ם אִם לֹ֖א גְמָלְ/ךָ֣ רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: fr
  text: Ne cherche pas querelle à quelqu’un sans raison[a], s’il ne t’a fait aucun mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi évoquer une contestation ou une action en justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תרוב
  choice: Ne cherche pas querelle
  rationale: La négation אַל suivie de la forme verbale exprime une interdiction. ריב peut désigner une querelle, un conflit ou une contestation judiciaire ; « chercher querelle » est naturel en français et conserve l’idée générale d’engager un différend.
- source_word: עִם אָדָם
  choice: à quelqu’un
  rationale: אָדָם désigne ici de manière générique la personne avec qui l’on entre en conflit. « Quelqu’un » restitue naturellement cette portée générale en français moderne ; la préposition française est déterminée par l’expression « chercher querelle à ».
- source_word: חִנָּם
  choice: sans raison
  rationale: חִנָּם signifie ici « gratuitement », « sans motif » ou « sans cause ». « Sans raison » est clair, idiomatique et exprime l’absence de justification.
- source_word: אִם לֹא
  choice: s’il ne
  rationale: La traduction conditionnelle suit directement l’hébreu et laisse intact le rapport logique entre l’interdiction et l’absence de tort subi.
- source_word: גְמָלְךָ רָעָה
  choice: t’a fait aucun mal
  rationale: גמל avec רָעָה décrit le fait de causer ou de rendre du mal à quelqu’un. Cette formulation française rend naturellement l’acte nuisible dirigé contre le destinataire.
theological_decisions:
- issue: Portée de ריב
  choice: querelle ou différend au sens large
  alternative: action ou contestation judiciaire
  rationale: Le contexte sapientiel ne permet pas de limiter avec certitude le verbe au domaine judiciaire. Le texte principal garde donc un sens interpersonnel large, tandis que la note signale la nuance juridique possible.
translation_notes:
  register: Français international moderne, direct et proverbial. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu, sans surinterpréter le genre du destinataire. « Quelqu’un » rend la valeur générique de אָדָם sans masculiniser inutilement l’énoncé.
