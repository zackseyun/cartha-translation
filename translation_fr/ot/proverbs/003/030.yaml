  verdict: approve
  source_fidelity: « Ne cherche pas querelle à quelqu’un sans raison » rend de façon idiomatique l’interdiction אַל תרוב, tout en laissant au verbe un sens de différend qui n’est pas exclusivement judiciaire. « S’il ne t’a fait aucun mal » correspond fidèlement à la qualification אִם לֹא גמלך רעה, sans renforcer indûment la condition en exception explicite (« à moins que »). « Quelqu’un » restitue convenablement la valeur générique de אָדָם dans ce proverbe.
  naturalness: Le français est moderne, fluide et de registre proverbial naturel. « Chercher querelle à quelqu’un » est une expression courante; « sans raison » et « aucun mal » sont clairs et non archaïques. Le tutoiement est cohérent avec l’adresse singulière du texte source.
  terminology: Le choix de « querelle » est légèrement plus interpersonnel que le champ entier de ריב, mais la note signale utilement la possibilité d’une contestation ou action en justice. Aucun terme théologique ou nom propre ne pose problème. L’ancre [a] est placée directement après l’expression concernée et la note correspond bien à son objet.
