  text: and they will be life to your soul and grace to your neck[a][b].
translation:
  language: fr
  text: Ils seront vie pour ton être[a] et grâce pour ton cou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « être » peut aussi signifier « âme », « vie » ou « personne ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « grâce » peut aussi évoquer le charme, la faveur ou la beauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Ils seront
  rationale: Le qal inaccompli à la 3e personne du pluriel reprend la sagesse pratique et la réflexion du verset précédent. Dans ce contexte, il exprime naturellement le résultat plutôt qu’un souhait ou un ordre.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le mot hébreu soit de forme plurielle, il fonctionne couramment comme un nom abstrait signifiant « vie ».
- source_word: לְנַפְשֶׁךָ
  choice: pour ton être
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l’être intérieur. « Ton être » garde cette ampleur sans imposer au français moderne une opposition stricte entre l’âme et le corps.
- source_word: וְחֵן
  choice: une parure pleine de grâce
  rationale: חֵן évoque la grâce, le charme et ce qui attire la faveur. Associé au cou, le terme prend une valeur d’ornement; cette formulation rend à la fois l’image et la nuance morale-esthétique.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: pour ton cou
  rationale: Le terme désigne la gorge ou le cou. Dans l’imagerie sapientielle de l’ornement porté autour du cou, « cou » est le choix français le plus naturel.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: ton être
  alternative: ton âme
  rationale: « Ton être » préserve la référence à la personne vivante dans son ensemble et évite de réduire le terme hébreu à une substance spirituelle distincte du corps.
- issue: Valeur de חֵן dans l’image du cou
  choice: une parure pleine de grâce
  alternative: la grâce
  rationale: Le texte associe une qualité de faveur, de charme ou de beauté à une image d’ornement. La traduction conserve cette tension sans identifier la « grâce » à une doctrine technique.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme est conservé, tandis que « une parure pleine de grâce » explicite avec mesure l’image hébraïque du cou afin qu’elle reste naturelle et intelligible.
