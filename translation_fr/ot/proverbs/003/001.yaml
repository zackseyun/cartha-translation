id: PRO.3.1
reference: Proverbs 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ֭נִ/י תּוֹרָתִ֣/י אַל תִּשְׁכָּ֑ח וּ֝/מִצְוֺתַ֗/י יִצֹּ֥ר לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: fr
  text: Mon fils, n’oublie pas mon enseignement[a], et que ton cœur garde mes commandements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon instruction ». Ici, le mot hébreu torah désigne un enseignement directif, pas nécessairement la loi au sens juridique étroit.
    reason: lexical_alternative
  - marker: b
    text: Ou « veille sur mes commandements ». Le verbe hébreu exprime l’idée de garder avec soin, de préserver et d’observer.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: Le vocatif hébreu est au masculin singulier avec un suffixe de première personne. « Mon fils » conserve fidèlement le cadre littéraire de l’enseignement paternel dans les Proverbes.
- source_word: תּוֹרָתִי
  choice: mon enseignement
  rationale: Dans ce contexte sapientiel et familial, תּוֹרָה désigne une instruction transmise plutôt que la Loi mosaïque au sens juridique étroit. « Enseignement » est naturel en français moderne et garde cette portée.
- source_word: אַל תִּשְׁכָּח
  choice: n’oublie pas
  rationale: La tournure négative exprime une interdiction ou une exhortation directe. « N’oublie pas » en restitue simplement la force.
- source_word: וּמִצְוֺתַי
  choice: mes commandements
  rationale: מִצְוֹת désigne des prescriptions faisant autorité. « Commandements » en conserve le poids sans réduire le terme à de simples conseils.
- source_word: יִצֹּר
  choice: garde
  rationale: Le verbe נצר évoque le fait de garder avec soin, de préserver et, ici, d’observer. « Garde » maintient cette richesse lexicale et s’accorde avec l’image du cœur comme gardien intérieur.
- source_word: לִבֶּךָ
  choice: ton cœur
  rationale: Dans l’anthropologie hébraïque, le cœur est le siège de la pensée, de la volonté et des dispositions intérieures. Le rendre littéralement évite de le réduire au seul intellect.
theological_decisions:
- issue: Adresse masculine dans l’enseignement sapientiel
  choice: Conserver « Mon fils »
  alternative: « Mon enfant »
  rationale: L’hébreu emploie explicitement le masculin singulier et s’inscrit dans la forme littéraire d’un père instruisant son fils. La traduction conserve ce trait sans le neutraliser.
- issue: Portée de תּוֹרָה dans ce contexte
  choice: « mon enseignement »
  alternative: « ma loi »
  rationale: Le contexte immédiat est celui de l’instruction sapientielle. Traduire par « loi » pourrait suggérer à tort une référence nécessaire et exclusive à la Loi mosaïque, alors que le terme garde ici un sens plus large d’enseignement directif.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe « que ton cœur garde » conserve le changement de construction de l’hébreu et souligne l’intériorisation de l’obéissance. Les marqueurs de notes sont placés sur les termes auxquels leurs variantes se rapportent.
