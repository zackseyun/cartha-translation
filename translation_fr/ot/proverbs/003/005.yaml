id: PRO.3.5
reference: Proverbs 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: fr
  text: Fais confiance à Yahweh de tout ton cœur, et ne t’appuie pas sur ta propre intelligence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne te fie pas à ta propre intelligence ». Le verbe hébreu signifie littéralement « s’appuyer » ou « prendre appui » sur quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  choice: Mets ta confiance
  rationale: L’impératif appelle à une confiance active. « Mets ta confiance » est naturel en français et exprime clairement le fait de se fier à quelqu’un.
- source_word: אֶל יְהוָה
  choice: en Yahweh
  rationale: Avec « mettre sa confiance », la préposition « en » est idiomatique. « Yahweh » transcrit le nom divin exprimé par le tétragramme.
- source_word: בְּכָל לִבֶּךָ
  choice: de tout ton cœur
  rationale: Cette expression française courante rend la totalité de l’engagement intérieur; dans l’anthropologie hébraïque, le cœur englobe notamment la pensée et la volonté, pas seulement les sentiments.
- source_word: בִּינָתְךָ
  choice: ta propre intelligence
  rationale: בִּינָה désigne l’intelligence, la compréhension ou le discernement. « Propre » explicite naturellement en français le contraste entre la confiance en Yahweh et l’appui sur son propre jugement.
- source_word: אַל תִּשָּׁעֵן
  choice: ne t’appuie pas
  rationale: La forme exprime une interdiction. Le verbe signifie littéralement s’appuyer ou prendre appui, et cette traduction conserve la métaphore hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le nom divin lui-même. « Yahweh » le transcrit au lieu de lui substituer un titre.
- issue: Portée de לֵב (« cœur »)
  choice: cœur
  alternative: être intérieur; pensée
  rationale: « Cœur » conserve l’image hébraïque et sa portée large, qui comprend la pensée, la volonté et les dispositions intérieures, sans la réduire au seul domaine affectif.
translation_notes:
  register: Tutoiement singulier, conformément aux formes hébraïques de deuxième personne masculine singulière. Style direct, actuel et digne; la métaphore de l’appui est conservée.
