id: PRO.3.32
reference: Proverbs 3:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י תוֹעֲבַ֣ת יְהוָ֣ה נָל֑וֹז וְֽ/אֶת יְשָׁרִ֥ים סוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: fr
  text: Car l’homme tortueux est en horreur à Yahvé, mais son intimité est avec les hommes droits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il confie ses secrets aux hommes droits » ou « son conseil confidentiel est avec les hommes droits » ; le mot hébreu peut évoquer les confidences, le conseil secret ou une communion intime.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et convient au style sentencieux des Proverbes.
- source_word: תוֹעֲבַת יְהוָה
  choice: est en horreur à Yahvé
  rationale: Rend avec naturel la forte répulsion morale exprimée par le nom hébreu, tout en conservant Yahvé comme nom divin personnel.
- source_word: נָלוֹז
  choice: l’homme tortueux
  rationale: Désigne une personne moralement dévoyée; « tortueux » maintient l’image opposée à celle des hommes « droits ».
- source_word: וְאֶת
  choice: mais … avec
  rationale: Le contexte antithétique justifie « mais », tandis que « avec » reflète la construction hébraïque associée à סוֹד.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Exprime la rectitude morale et préserve le contraste imagé avec « l’homme tortueux ».
- source_word: סוֹדוֹ
  choice: son intimité
  rationale: Le mot peut désigner le cercle confidentiel, les confidences, le conseil secret ou la communion intime. « Son intimité » garde la dimension relationnelle sans exclure l’idée de confidence.
theological_decisions:
- issue: Sens de סוֹד dans la relation de Yahvé avec les hommes droits
  choice: son intimité est avec les hommes droits
  alternative: il confie ses secrets aux hommes droits; son conseil confidentiel est accordé aux hommes droits
  rationale: La formulation conserve la tension entre proximité personnelle, confidence et conseil secret, sans réduire le terme à la seule transmission d’informations ni à la seule communion.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme entre « tortueux » et « droits » est conservé, de même que l’ambiguïté relationnelle de סוֹד.
