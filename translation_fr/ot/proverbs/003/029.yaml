source:
  edition: WLC
  text: אַל תַּחֲרֹ֣שׁ עַל רֵעֲ/ךָ֣ רָעָ֑ה וְ/הֽוּא יוֹשֵׁ֖ב לָ/בֶ֣טַח אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: fr
  text: Ne prépare pas de mal contre ton prochain, alors qu’il habite en sécurité auprès de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne complote pas le mal contre ton prochain, alors qu’il demeure sans méfiance avec toi. »'
    reason: Alternative lexicale permettant de faire ressortir le caractère secret du projet et la nuance possible de confiance attachée à לָבֶטַח.
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: prépare
  rationale: Dans cette construction, חרשׁ désigne l’action de concevoir ou préparer secrètement un mauvais dessein, et non son sens littéral « labourer ». « Prépare » reste naturel et exprime l’intention délibérée.
- source_word: עַל
  choice: contre
  rationale: La préposition marque ici la direction hostile du projet envers la personne visée.
- source_word: רֵעֲךָ
  choice: ton prochain
  rationale: רֵעַ peut désigner un voisin, un compagnon ou un proche. « Ton prochain » convient à la portée éthique générale de la maxime sans supposer une amitié intime.
- source_word: רָעָה
  choice: du mal
  rationale: רָעָה peut désigner le mal moral, un tort ou un malheur. « Du mal » conserve cette ampleur sémantique sans réduire le propos au seul dommage matériel.
- source_word: יוֹשֵׁב
  choice: habite
  rationale: Le participe de ישׁב exprime ici une situation durable de résidence ou de présence; « habite » restitue directement cette valeur.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: בֶּטַח exprime la sécurité et peut aussi suggérer une confiance sans inquiétude. « En sécurité » rend clairement le sens principal.
- source_word: אִתָּךְ
  choice: auprès de toi
  rationale: La préposition exprime la présence ou l’association avec quelqu’un. « Auprès de toi » rend naturellement la proximité tout en laissant ouverte la nature exacte de la cohabitation ou du voisinage.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le tutoiement singulier reflète les formes hébraïques. « Ton prochain » maintient la portée morale traditionnelle tout en restant largement intelligible; la note préserve les nuances de complot, de confiance et de proximité.
