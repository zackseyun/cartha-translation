  source_fidelity: 'Le texte rend fidèlement l’interdiction de חרשׁ רעה (« préparer/ourdir du mal ») dirigée contre le prochain, ainsi que la circonstance exprimée par le participe יוֹשֵׁב et לָבֶטַח : celui-ci réside auprès du destinataire dans une condition de sécurité. « Auprès de toi » conserve sans la surinterpréter la proximité exprimée par אִתָּךְ.'
