  text: בְּ֭/דַעְתּ/וֹ תְּהוֹמ֣וֹת נִבְקָ֑עוּ וּ֝/שְׁחָקִ֗ים יִרְעֲפוּ טָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/020.yaml
  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: fr
  text: Par sa connaissance, les profondeurs[a] se sont fendues[b], et les nuages[c] distillent la rosée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les abîmes » ou « les eaux profondes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se sont ouvertes » ou « ont été fendues ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le ciel » ou « les cieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: Par sa connaissance
  rationale: La préposition בְּ exprime ici le moyen, et דַּעַת désigne la connaissance. Cette formulation concise conserve le rapport avec la sagesse divine dans le contexte.
- source_word: תְּהוֹמוֹת
  choice: les profondeurs
  rationale: Le pluriel évoque les eaux profondes ou les abîmes cosmiques. « Les profondeurs » reste naturel en français moderne tout en préservant l’ampleur poétique de l’image.
- source_word: נִבְקָעוּ
  choice: se sont ouvertes
  rationale: Le nifal décrit l’ouverture ou la séparation des profondeurs. « Se sont ouvertes » rend naturellement le procès sans imposer une causalité plus précise que l’hébreu.
- source_word: וּשְׁחָקִים
  choice: et les nuages
  rationale: שְׁחָקִים peut désigner les hauteurs célestes, le ciel ou les nuages. La mention de la rosée favorise ici « les nuages », tandis qu’une note conserve l’autre possibilité.
- source_word: יִרְעֲפוּ
  choice: distillent
  rationale: Le verbe exprime l’écoulement en gouttes. « Distillent » convient à la rosée, garde la douceur de l’image et présente un registre poétique mais compréhensible.
- source_word: טָל
  choice: la rosée
  rationale: « Rosée » est l’équivalent français direct et naturel de טָל dans ce contexte.
theological_decisions:
- issue: Imagerie cosmique de la création et de la providence
  choice: Conserver l’image des profondeurs qui s’ouvrent et des nuages qui distillent la rosée, la connaissance divine étant présentée comme le moyen de cet ordre.
  alternative: Comprendre le verset comme visant plus étroitement l’action providentielle de Dieu dans les phénomènes météorologiques.
  rationale: Le contexte de Proverbes 3.19-20 évoque l’établissement du monde par la sagesse de Dieu. La formulation préserve à la fois l’écho possible à la création et l’idée d’une providence continue, sans imposer une cosmologie technique.
translation_notes:
  register: Français international moderne, digne et poétique. « Distillent » maintient l’image délicate de gouttes de rosée; les notes signalent les principales ambiguïtés lexicales de תְּהוֹמוֹת, נִבְקָעוּ et שְׁחָקִים.
