  text: כָּ֭בוֹד חֲכָמִ֣ים יִנְחָ֑לוּ וּ֝/כְסִילִ֗ים מֵרִ֥ים קָלֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: fr
  text: Les sages hériteront de l’honneur, mais les insensés élèvent la honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבוֹד
  choice: honneur
  rationale: Rend naturellement l’idée de poids social, de considération et de gloire dans ce contraste sapientiel.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Équivalent courant et direct du terme hébreu désignant ceux qui vivent avec sagesse.
- source_word: יִנְחָלוּ
  choice: hériteront
  rationale: Conserve l’image forte de recevoir l’honneur comme un héritage ou une part durable.
- source_word: כְסִילִים
  choice: les insensés
  rationale: Désigne ici non un manque d’intelligence, mais l’attitude moralement réfractaire caractéristique du langage sapientiel.
- source_word: מֵרִים
  choice: élèvent
  rationale: Préserve le sens formel du participe de רום, « élever », ainsi que la formulation frappante et quelque peu énigmatique de l’hébreu.
- source_word: קָלוֹן
  choice: la honte
  rationale: Exprime le déshonneur public opposé à כָּבוֹד, tout en formant un contraste français clair avec « l’honneur ».
theological_decisions:
- issue: Sens de מֵרִים dans la proposition concernant les insensés
  choice: élèvent la honte
  alternative: récoltent la honte / la honte élève les insensés
  rationale: Le texte massorétique vocalisé soutient le participe actif « élevant ». La traduction conserve cette tension au lieu de substituer un verbe interprétatif comme « récolter » ou de modifier implicitement la syntaxe.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme antithétique et la métaphore de l’héritage sont conservés. « Élèvent la honte » reste volontairement saisissant afin de respecter la formulation hébraïque sans l’aplanir.
