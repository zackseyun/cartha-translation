id: PRO.3.18
reference: Proverbs 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵץ חַיִּ֣ים הִ֭יא לַ/מַּחֲזִיקִ֣ים בָּ֑/הּ וְֽ/תֹמְכֶ֥י/הָ מְאֻשָּֽׁר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: fr
  text: Elle[a] est un arbre de vie pour ceux qui la saisissent, et ceux qui la tiennent fermement[b] sont heureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pronoms féminins renvoient à la sagesse personnifiée dans le contexte.
    reason: cultural_note
  - marker: b
    text: Ou « ceux qui la soutiennent ». Le verbe hébreu peut signifier « soutenir », « maintenir » ou « tenir fermement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: un arbre de vie
  rationale: La construction signifie littéralement « arbre de vie ». L’article indéfini préserve l’image sans identifier explicitement cet arbre à l’unique arbre du jardin d’Éden.
- source_word: הִיא
  choice: Elle
  rationale: Le pronom féminin singulier renvoie à la sagesse personnifiée dans le contexte immédiat.
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: pour ceux qui la saisissent
  rationale: Cette formulation conserve l’image concrète d’une prise ferme et le pronom féminin qui renvoie à la sagesse.
- source_word: וְתֹמְכֶיהָ
  choice: et ceux qui la tiennent fermement
  rationale: Le verbe תמך peut exprimer l’idée de soutenir, maintenir ou tenir fermement. Ici, le parallélisme avec « la saisissent » favorise l’idée d’un attachement persévérant, tout en laissant l’autre nuance en note.
- source_word: מְאֻשָּׁר
  choice: sont heureux
  rationale: Le terme décrit une condition enviable de bonheur et d’épanouissement. « Heureux » est naturel en français biblique moderne et évite que « bénis » n’ajoute une précision théologique absente du mot lui-même.
theological_decisions:
- issue: Personnification de la sagesse
  choice: Conserver les pronoms féminins « elle » et « la »
  alternative: Employer des formes impersonnelles renvoyant à la sagesse comme notion abstraite
  rationale: L’hébreu emploie explicitement le féminin singulier et le contexte personnifie la sagesse. La traduction maintient ce procédé littéraire sans lui ajouter une identification théologique.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme et l’image concrète de la prise sont conservés; « sont heureux » restitue naturellement la formule sapientielle.
