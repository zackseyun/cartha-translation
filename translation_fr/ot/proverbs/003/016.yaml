id: PRO.3.16
reference: Proverbs 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: fr
  text: Une longue vie[a] est dans sa main droite ; dans sa main gauche sont la richesse et l’honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « une longueur de jours ».
    reason: Le texte hébreu emploie un idiome poétique qui signifie « une longue vie ».
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: une longue vie
  rationale: Cette expression rend naturellement en français l’hébraïsme « longueur de jours », qui désigne une vie prolongée, tout en conservant son sens dans le parallélisme poétique.
- source_word: בִּימִינָהּ
  choice: dans sa main droite
  rationale: La préposition ב est rendue par « dans » ; le suffixe féminin renvoie à la sagesse personnifiée dans le contexte.
- source_word: בִּשְׂמֹאולָהּ
  choice: dans sa main gauche
  rationale: Ce choix maintient le parallélisme équilibré avec « dans sa main droite » et conserve la référence féminine à la sagesse.
- source_word: עֹשֶׁר
  choice: la richesse
  rationale: « La richesse » exprime ici les biens matériels associés aux bienfaits de la sagesse et convient au registre sapiential.
- source_word: כָבוֹד
  choice: l’honneur
  rationale: Dans ce contexte, כָבוֹד désigne surtout la considération et le prestige social ; « l’honneur » convient mieux que « la gloire ».
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Les possessifs féminins renvoient à la sagesse personnifiée dans le contexte immédiat.
  alternative: Comprendre ces formes comme une référence à un être divin féminin.
  rationale: Le passage présente poétiquement la sagesse sous les traits d’une femme tenant des bienfaits dans ses mains ; cette personnification littéraire ne doit pas être transformée en affirmation ontologique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure des deux membres conserve le parallélisme des mains droite et gauche ainsi que la personnification féminine de la sagesse.
