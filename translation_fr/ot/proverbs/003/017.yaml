  source_fidelity: 'Le texte rend fidèlement le parallélisme hébreu : « ses voies » reprend le suffixe féminin renvoyant à la sagesse, « voies agréables » exprime naturellement les « voies de plaisance/agrément », et « tous ses sentiers sont des sentiers de paix » communique la caractérisation totale par le shalom. La répétition française de « sentiers » n''est pas formellement répétée dans le second cola hébreu, mais elle est une formulation française idiomatique qui n''ajoute pas de contenu doctrinal ou factuel.'
