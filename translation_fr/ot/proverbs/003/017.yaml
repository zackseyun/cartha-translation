source:
  edition: WLC
  text: דְּרָכֶ֥י/הָ דַרְכֵי נֹ֑עַם וְֽ/כָל נְתִ֖יבוֹתֶ֣י/הָ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/017.yaml
  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: fr
  text: 'Ses voies sont des voies agréables,

    et tous ses sentiers sont des sentiers de paix[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « paix » peut aussi évoquer le bien-être ou la plénitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: ses voies
  rationale: דֶּרֶךְ peut désigner une route, une voie ou une manière de vivre. « Ses voies » conserve l’image concrète et sa portée figurée; le suffixe féminin renvoie à la sagesse dans le contexte.
- source_word: דַרְכֵי
  choice: des voies
  rationale: 'La forme construite répète le même nom : littéralement, « ses voies sont des voies de… ». La répétition est conservée pour respecter l’insistance et le parallélisme poétique de l’hébreu.'
- source_word: נֹעַם
  choice: agréables
  rationale: נֹעַם exprime ce qui est plaisant, délicieux ou empreint de douceur. L’adjectif « agréables » restitue naturellement en français l’expression hébraïque « voies d’agrément » sans limiter le sens au seul plaisir émotionnel.
- source_word: וְכָל
  choice: et tous
  rationale: Cette formulation rend directement la conjonction וְ et la portée globale de כָּל.
- source_word: נְתִיבוֹתֶיהָ
  choice: ses sentiers
  rationale: נְתִיבָה désigne un sentier ou une piste et forme ici un parallèle poétique avec דֶּרֶךְ. « Sentiers » maintient cette image distincte en français.
- source_word: שָׁלוֹם
  choice: paix
  rationale: שָׁלוֹם recouvre la paix, le bien-être et la plénitude. « Paix » est la traduction française la plus naturelle et la plus établie ici, tandis qu’une note signale l’étendue du sens hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme ainsi que la répétition de « voies » sont préservés; « des sentiers de paix » maintient le nom שָׁלוֹם plutôt que de le réduire à l’adjectif « paisibles ».
