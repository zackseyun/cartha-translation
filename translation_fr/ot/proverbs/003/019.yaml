id: PRO.3.19
reference: Proverbs 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְֽהוָ֗ה בְּ/חָכְמָ֥ה יָֽסַד אָ֑רֶץ כּוֹנֵ֥ן שָׁ֝מַ֗יִם בִּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: fr
  text: Yahweh a fondé la terre par la sagesse[a] ; il a établi les cieux par l’intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec la sagesse »… « avec l’intelligence ». La préposition hébraïque peut exprimer le moyen ou l’accompagnement ; ici, « par » correspond le mieux à l’idée du moyen employé dans la création.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans l’hébreu plutôt que de lui substituer un titre.
- source_word: בְּחָכְמָה
  choice: par la sagesse
  rationale: La préposition בְּ exprime très probablement ici le moyen; « par » convient au contexte de création tout en laissant signaler en note la nuance possible d’accompagnement.
- source_word: יָסַד
  choice: a fondé
  rationale: Le verbe évoque l’action de poser des fondations ou de fonder; cette formulation conserve la métaphore architecturale.
- source_word: אָרֶץ
  choice: la terre
  rationale: Le parallélisme cosmique avec « les cieux » indique la terre, non un territoire particulier.
- source_word: כּוֹנֵן
  choice: a établi
  rationale: Le verbe exprime la mise en place ferme et stable; « a établi » est naturel et maintient une distinction avec « a fondé ».
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Cette forme rend le pluriel hébreu et le couple cosmologique « terre / cieux » dans un registre digne.
- source_word: בִּתְבוּנָה
  choice: par l’intelligence
  rationale: תְּבוּנָה désigne la compréhension ou le discernement. « Intelligence » appartient au vocabulaire sapiential courant et forme un parallèle naturel avec « sagesse ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahweh » le conserve sous une forme translittérée courante, sans le remplacer par un titre.
- issue: Rôle de la sagesse et de l’intelligence dans la création
  choice: par la sagesse… par l’intelligence
  alternative: avec la sagesse… avec l’intelligence
  rationale: Le בְּ peut indiquer le moyen ou l’accompagnement. Dans ce parallélisme de création, l’instrumentalité paraît la lecture la plus naturelle, mais l’autre nuance demeure possible et est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique ainsi que la métaphore architecturale sont conservés; le point-virgule marque les deux membres du vers.
