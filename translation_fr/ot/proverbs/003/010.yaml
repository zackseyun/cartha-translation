  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: fr
  text: 'alors tes greniers seront remplis d’abondance,

    et tes cuves déborderont[a] de vin nouveau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « feront irruption » ou « éclateront ». Le verbe hébreu dépeint quelque chose qui franchit ses limites, soulignant ici l’abondance.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: seront remplis
  rationale: 'Le niphal inaccompli de מלא exprime ici le résultat passif annoncé : les greniers se trouveront remplis.'
- source_word: אֲסָמֶיךָ
  choice: tes greniers
  rationale: אֹסֶם désigne un bâtiment où l’on entrepose les récoltes, notamment le grain ; « greniers » convient naturellement au contexte agricole.
- source_word: שָׂבָע
  choice: d’abondance
  rationale: Le nom évoque la satiété, la pleine suffisance et l’abondance. Cette tournure garde l’idée d’une provision qui comble, dans un registre digne.
- source_word: תִירוֹשׁ
  choice: vin nouveau
  rationale: תִּירוֹשׁ désigne habituellement le vin nouveau ou le produit frais de la vigne et se distingue du terme général pour le vin.
- source_word: יְקָבֶיךָ
  choice: tes cuves
  rationale: יֶקֶב désigne les installations ou cuves liées au pressurage et à la collecte du jus de raisin ; « cuves » préserve ici le parallélisme avec les greniers.
- source_word: יִפְרֹצוּ
  choice: déborderont
  rationale: פרץ évoque littéralement une irruption ou le fait de forcer une limite. Pour des cuves, « déborderont » communique naturellement l’abondance sans suggérer qu’elles seront détruites.
theological_decisions:
- issue: Nature de l’abondance promise
  choice: 'Conserver l’image concrète d’une abondance agricole : greniers, cuves et vin nouveau.'
  alternative: Transformer l’énoncé en une promesse générale ou exclusivement spirituelle.
  rationale: L’hébreu présente une prospérité agricole tangible. La traduction maintient cette image sans décider si la maxime doit être comprise comme une garantie absolue, une figure ou un principe général de sagesse.
translation_notes:
  register: Français international moderne, naturel et soutenu. Le tutoiement correspond au discours sapientiel adressé à « mon fils » dans le contexte. Le parallélisme poétique et l’image agricole concrète sont conservés.
