  text: אַל תְּ֭קַנֵּא בְּ/אִ֣ישׁ חָמָ֑ס וְ/אַל תִּ֝בְחַ֗ר בְּ/כָל דְּרָכָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
translation:
  language: fr
  text: N’envie pas l’homme violent[a] et ne choisis aucune de ses voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne sois pas jaloux de l’homme violent ». Le verbe hébreu peut exprimer l’envie ou la jalousie selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: N’envie pas
  rationale: אַל suivi de l’inaccompli exprime ici une interdiction. « N’envie pas » est naturel, direct et conserve le sens principal de קנא dans ce contexte.
- source_word: בְּאִישׁ חָמָס
  choice: l’homme violent
  rationale: אִישׁ désigne un homme, tandis que חָמָס évoque la violence, le tort ou l’injustice brutale. L’expression française concise « l’homme violent » restitue la construction hébraïque.
- source_word: וְאַל תִּבְחַר
  choice: et ne choisis
  rationale: La conjonction relie étroitement les deux interdictions parallèles, et בחר signifie « choisir ».
- source_word: בְּכָל דְּרָכָיו
  choice: aucune de ses voies
  rationale: 'Sous la négation, « aucune de » rend naturellement la portée totalisante de כָּל : il ne faut adopter aucune des manières d’agir de cet homme. « Voies » conserve la métaphore sapientielle de דֶּרֶךְ.'
