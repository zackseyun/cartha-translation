source:
  edition: WLC
  text: כִּ֤י אֶ֥ת אֲשֶׁ֣ר יֶאֱהַ֣ב יְהוָ֣ה יוֹכִ֑יחַ וּ֝/כְ/אָ֗ב אֶת בֵּ֥ן יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: fr
  text: Car Yahvé reprend[a] celui qu’il aime, comme un père le fils en qui il prend plaisir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corrige ». Le verbe hébreu évoque une réprimande qui vise à corriger ; dans le contexte, elle relève de la discipline de Yahvé.
    reason: lexical_alternative
  - marker: b
    text: Ou « et, comme un père, [il reprend] le fils en qui il prend plaisir ». La construction hébraïque est elliptique.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et convient au mouvement argumentatif du proverbe.
- source_word: אֶת אֲשֶׁר יֶאֱהַב
  choice: celui qu’il aime
  rationale: Rend naturellement en français la construction relative personnelle au singulier, tout en conservant la chaleur du verbe « aimer ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin représenté par le tétragramme, qui conserve ici le nom propre plutôt que de le remplacer par un titre.
- source_word: יוֹכִיחַ
  choice: reprend
  rationale: Le hiphil de יכח exprime ici la réprimande qui vise à corriger. « Reprend » en restitue le noyau lexical sans l’élargir d’emblée à toute la notion de discipline.
- source_word: וּכְאָב
  choice: comme un père
  rationale: Introduit la comparaison paternelle; l’absence de traduction explicite du waw donne une tournure française fluide sans modifier le rapport entre les propositions.
- source_word: בֵּן
  choice: le fils
  rationale: Conserve l’image masculine explicite et représentative du texte hébreu, sans ajouter un possessif absent de la forme source.
- source_word: יִרְצֶה
  choice: en qui il prend plaisir
  rationale: Exprime l’accueil favorable et le plaisir associés à רצה, en rattachant naturellement le verbe au père dans la comparaison.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. La traduction le conserve sous sa forme française usuelle plutôt que de lui substituer un titre.
- issue: Image parentale genrée
  choice: comme un père le fils
  alternative: comme un parent son enfant
  rationale: Le texte emploie explicitement les noms masculins « père » et « fils »; leur maintien préserve l’image proverbiale sans la neutraliser.
- issue: Portée de la correction divine
  choice: reprend
  alternative: corrige / discipline
  rationale: Le verbe désigne plus précisément une réprimande ou correction, tandis que le contexte plus large des versets précédents développe le thème de la discipline.
- issue: Syntaxe de la seconde proposition
  choice: comme un père le fils en qui il prend plaisir
  alternative: et, comme un père, le fils qu’il agrée
  rationale: L’hébreu est elliptique et permet de comprendre que le verbe de la première proposition reste sous-entendu dans la comparaison. La formulation principale rend cette ellipse intelligible sans nier une analyse plus littérale du waw et de רצה.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la concision proverbiale, le nom divin et l’image explicite du père et du fils. Les notes signalent la nuance de יוֹכִיחַ et l’ellipse réelle de la seconde proposition.
