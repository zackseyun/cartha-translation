  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: fr
  text: Alors tu trouveras grâce et bon sens aux yeux de Dieu et des êtres humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes ». L’hébreu אדם désigne ici les êtres humains de manière collective, par contraste avec Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְצָא
  choice: Alors tu trouveras
  rationale: 'La forme impérative coordonnée poursuit l’exhortation précédente, mais exprime ici naturellement en français le résultat attendu : « alors tu trouveras ».'
- source_word: חֵן
  choice: faveur
  rationale: חֵן désigne l’accueil favorable ou l’estime accordée; « faveur » convient à la tournure « aux yeux de » sans introduire la charge théologique que pourrait avoir « grâce ».
- source_word: וְשֵׂכֶל טוֹב
  choice: et bon discernement
  rationale: שֵׂכֶל évoque l’intelligence pratique, la prudence ou le discernement. « Bon discernement » conserve cette dimension cognitive et morale, tout en laissant en note les lectures contextuelles liées à l’estime ou à la réussite.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française naturelle conserve l’image hébraïque et indique le jugement ou l’évaluation.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu unique.
- source_word: וְאָדָם
  choice: et des êtres humains
  rationale: אָדָם s’oppose ici à Dieu et désigne collectivement l’humanité, sans restriction au sexe masculin. Le pluriel générique est idiomatique en français.
theological_decisions:
- issue: Portée de אָדָם dans l’opposition entre Dieu et l’humanité
  choice: des êtres humains
  alternative: de l’homme
  rationale: Le nom hébreu a ici une valeur collective et met en parallèle l’évaluation divine et l’évaluation humaine. « Des êtres humains » rend explicitement cette portée générale sans modifier le contraste.
- issue: Sens de שֵׂכֶל טוֹב
  choice: bon discernement
  alternative: bonne réputation ou réussite
  rationale: Le terme peut évoquer l’intelligence pratique, mais la construction « aux yeux de » permet aussi de comprendre une bonne réputation ou une approbation. Le texte principal retient le sens lexical central et la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « aux yeux de » conserve l’image de l’hébreu; « des êtres humains » exprime clairement la portée collective de אָדָם.
