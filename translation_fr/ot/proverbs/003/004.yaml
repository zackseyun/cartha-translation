  to: Alors tu trouveras grâce et bon sens aux yeux de Dieu et des êtres humains.[a]
  rationale: La révision améliore l’idiomaticité française par « trouver grâce ... aux yeux de » et « bon sens », tout en conservant le sens résultatif, le contraste entre Dieu et l’humanité, et l’ambiguïté collective de אדם. La note est corrigée afin d’expliquer l’alternative pertinente sans introduire une option sémantique insuffisamment fondée pour שֵׂכֶל טוֹב.
