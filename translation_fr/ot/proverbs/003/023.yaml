source:
  edition: WLC
  text: אָ֤ז תֵּלֵ֣ךְ לָ/בֶ֣טַח דַּרְכֶּ֑/ךָ וְ֝/רַגְלְ/ךָ֗ לֹ֣א תִגּֽוֹף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/023.yaml
  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: fr
  text: Alors tu avanceras en sécurité sur ton chemin[a], et ton pied ne trébuchera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sûreté ». L’expression hébraïque peut aussi se rendre plus littéralement par « avec sécurité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel et consécutif qui relie cette assurance aux exhortations précédentes; « Alors » est naturel et concis.
- source_word: תֵּלֵךְ
  choice: tu avanceras
  rationale: Le verbe הלך signifie « marcher, aller ». « Avancer » garde l’image du déplacement sur un chemin tout en évitant la tournure peu naturelle « marcher sur ton chemin ».
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Cette expression désigne principalement la sécurité plutôt qu’un simple sentiment subjectif de confiance.
- source_word: דַּרְכֶּךָ
  choice: sur ton chemin
  rationale: דֶּרֶךְ peut désigner un chemin concret ou la conduite de la vie; cette formulation conserve les deux résonances.
- source_word: וְרַגְלְךָ
  choice: et ton pied
  rationale: Le singulier de l’hébreu est conservé et convient à l’image individuelle de la marche.
- source_word: לֹא תִגּוֹף
  choice: ne trébuchera pas
  rationale: Dans ce contexte, נגף évoque le pied qui heurte un obstacle et fait trébucher; cette formulation française est claire et idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne masculine singulière. L’image sapientielle du chemin est préservée.
