source:
  edition: WLC
  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: fr
  text: Honore Yahweh avec tes biens et avec les prémices de toutes tes récoltes[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tes biens » ; après « honorer », la préposition hébraïque peut exprimer le moyen ou la provenance.
    reason: lexical_alternative
  - marker: b
    text: Les « prémices » sont la première part — et, par implication, une part de choix — de la récolte, offerte à Dieu pour l’honorer.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honore
  rationale: L’impératif piel de כבד signifie ici « honorer ». « Honore » est direct, naturel et conserve la force de l’exhortation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que par un titre de substitution.
- source_word: מֵהוֹנֶךָ
  choice: par tes biens
  rationale: הוֹן désigne les ressources, les possessions ou la richesse. « Tes biens » est idiomatique en français et englobe les ressources matérielles; la préposition מִן indique ici naturellement le moyen par lequel Yahweh est honoré.
- source_word: וּמֵרֵאשִׁית
  choice: et par les prémices
  rationale: רֵאשִׁית signifie le commencement ou la première part; associé aux récoltes, « prémices » exprime avec précision la première part offerte à Dieu.
- source_word: כָּל
  choice: toutes
  rationale: כָּל exprime ici la totalité et s’accorde naturellement avec le pluriel français « récoltes ».
- source_word: תְּבוּאָתֶךָ
  choice: tes récoltes
  rationale: תְּבוּאָה désigne le produit ou le rendement agricole. « Récoltes » rend clairement ce cadre agricole en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de מִן après « honorer »
  choice: par
  alternative: avec; sur; au moyen d’une part de
  rationale: « Par tes biens » présente les ressources comme moyen d’honorer Yahweh, sans exclure la nuance possible d’un prélèvement effectué sur celles-ci; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. « Biens » évite de réduire הוֹן à l’argent, tandis que « récoltes » explicite le domaine agricole de תְּבוּאָה.
