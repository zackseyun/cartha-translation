  text: for they will add to you length of days and years of life and peace[a].
translation:
  language: fr
  text: car ils prolongeront tes jours, ajouteront des années à ta vie et t’apporteront la paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bien-être » ou « la plénitude ». Le mot hébreu shalom désigne un plein épanouissement, et pas seulement l’absence de conflit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’exhortation précédente et assure un lien naturel en français.
- source_word: אֹרֶךְ יָמִים
  choice: prolongeront tes jours
  rationale: Rend l’idée de « longueur de jours » dans une formulation française actuelle, tout en conservant l’image des jours prolongés.
- source_word: וּשְׁנוֹת חַיִּים
  choice: ajouteront des années à ta vie
  rationale: Exprime naturellement le parallélisme hébreu et rattache explicitement l’idée d’ajout aux années de vie.
- source_word: וְשָׁלוֹם
  choice: et t’apporteront la paix
  rationale: « Paix » est la traduction concise habituelle de שָׁלוֹם; la note préserve son sens plus large de bien-être et de plénitude.
- source_word: יוֹסִיפוּ
  choice: prolongeront… ajouteront… apporteront
  rationale: Le verbe unique « ajouter » gouverne les trois compléments en hébreu. La modulation française évite une tournure maladroite sans changer l’idée d’un accroissement accordé au destinataire.
- source_word: לָךְ
  choice: tes… à ta… t’
  rationale: Le datif « à toi » est réparti idiomatiquement entre les trois membres de la phrase française.
theological_decisions: []
