id: PRO.3.3
reference: Proverbs 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֶ֥סֶד וֶ/אֱמֶ֗ת אַֽל יַעַ֫זְבֻ֥/ךָ קָשְׁרֵ֥/ם עַל גַּרְגְּרוֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: fr
  text: Que l’amour fidèle et la fidélité ne t’abandonnent pas[a] ; attache-les autour de ton cou, écris-les sur la tablette de ton cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bonté et la vérité ». Le couple hébreu désigne souvent un amour loyal et une fiabilité constante.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Le terme désigne souvent une bonté aimante, durable et loyale dans les relations. « Amour fidèle » en conserve les dimensions affective et relationnelle sans le réduire à la seule bonté ou à la seule miséricorde.
- source_word: אֱמֶת
  choice: fidélité
  rationale: Dans le couple חֶסֶד וֶאֱמֶת, le mot exprime ici surtout la fiabilité et la constance plutôt que la vérité abstraite.
- source_word: אַל יַעַזְבֻךָ
  choice: ne t’abandonnent pas
  rationale: La tournure préserve la personnification de l’amour fidèle et de la fidélité, présentés comme des réalités qui doivent constamment accompagner le destinataire.
- source_word: קָשְׁרֵם
  choice: attache-les
  rationale: L’impératif concret évoque le fait de garder volontairement ces qualités sur soi. « Attacher » est naturel en français dans l’image d’un objet porté autour du cou.
- source_word: גַּרְגְּרוֹתֶיךָ
  choice: autour de ton cou
  rationale: Bien que le nom puisse désigner la gorge ou la région du cou, l’image est ici celle d’un objet attaché et porté au cou.
- source_word: כָּתְבֵם
  choice: écris-les
  rationale: Le verbe prolonge l’image d’une intériorisation volontaire et durable, sans surélever inutilement le registre par « grave-les » ou « inscris-les ».
- source_word: לוּחַ לִבֶּךָ
  choice: la tablette de ton cœur
  rationale: La formulation conserve l’image concrète d’une surface d’écriture appliquée à l’être intérieur.
theological_decisions:
- issue: Traduction du couple חֶסֶד וֶאֱמֶת
  choice: l’amour fidèle et la fidélité
  alternative: la bonté et la vérité
  rationale: Le couple hébreu évoque une loyauté aimante et une fiabilité vécue. La traduction retenue rend cette portée relationnelle sans imposer une interprétation confessionnelle particulière; la note conserve l’autre lecture lexicale possible.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux formes hébraïques. Les deux images concrètes — porter au cou et écrire sur une tablette intérieure — sont conservées.
