id: PRO.3.15
reference: Proverbs 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: fr
  text: Elle est plus précieuse que les joyaux[a], et rien de ce que tu désires ne peut l’égaler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rubis », « les perles » ou « les coraux » ; le terme hébreu désigne des objets précieux dont l’identification exacte est incertaine.
    reason: alternative lexicale
lexical_decisions:
- source_word: יְקָרָה
  choice: plus précieuse
  rationale: L’adjectif exprime une grande valeur et, avec la préposition comparative מִן, appelle naturellement le comparatif français « plus précieuse ».
- source_word: הִיא
  choice: elle
  rationale: Le pronom féminin singulier renvoie à la sagesse dans le contexte et en préserve la personnification.
- source_word: מִפְּנִינִים
  choice: que les joyaux
  rationale: Le terme désigne des objets précieux, mais leur identification exacte demeure incertaine. « Joyaux » conserve l’idée de très grande valeur sans imposer une pierre particulière.
- source_word: וְכָל חֲפָצֶיךָ
  choice: et rien de ce que tu désires
  rationale: Littéralement, la tournure évoque « toutes les choses que tu désires » avec un verbe nié. La formulation distributive française « rien de ce que tu désires » exprime naturellement qu’aucune d’elles ne fait exception.
- source_word: לֹא יִשְׁווּ בָּהּ
  choice: ne peut l’égaler
  rationale: Le verbe שׁוה signifie ici être égal ou comparable. « L’égaler » rend directement la comparaison de valeur, tandis que « ne peut » exprime idiomatiquement son impossibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond au suffixe hébreu de deuxième personne. La personnification féminine de la sagesse est maintenue.
