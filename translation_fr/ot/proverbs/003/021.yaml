  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: fr
  text: Mon fils, ne les perds pas de vue[a] ; garde la sagesse pratique[b] et la réflexion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elles ne s’éloignent pas de tes yeux ». Le pluriel a un antécédent implicite, à chercher dans le contexte ou dans les qualités mentionnées ensuite.
    reason: lexical_alternative
  - marker: b
    text: Ou « la saine sagesse », « le bon jugement » ou « l’ingéniosité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu emploie un vocatif masculin singulier dans le cadre du discours d’un père ou maître à son fils.
- source_word: אַל יָלֻזוּ
  choice: qu’elles ne s’éloignent pas
  rationale: Le verbe au pluriel a un sujet implicite renvoyant aux réalités ou qualités évoquées dans le contexte précédent; la formulation conserve ce renvoi sans l’expliciter abusivement.
- source_word: מֵעֵינֶיךָ
  choice: de tes yeux
  rationale: La traduction préserve l’image hébraïque d’une attention visuelle constante, intelligible en français avec la note explicative.
- source_word: נְצֹר
  choice: garde précieusement
  rationale: L’impératif exprime une conservation vigilante; l’adverbe rend en français naturel la force active du verbe.
- source_word: תֻּשִׁיָּה
  choice: la sagesse efficace
  rationale: Dans les écrits sapientiaux, le terme désigne une sagesse solide qui permet d’agir efficacement; ce choix conserve ses dimensions intellectuelle et pratique.
- source_word: וּמְזִמָּה
  choice: et la réflexion
  rationale: Dans ce contexte positif, le mot évoque la capacité de réfléchir et de prévoir avec discernement, plutôt qu’une manœuvre malveillante.
theological_decisions:
- issue: Adresse filiale genrée
  choice: Mon fils
  alternative: Mon enfant
  rationale: Le texte hébreu est explicitement masculin singulier; le conserver respecte le cadre littéraire du discours père-fils sans généraliser le référent.
- issue: Antécédent du pluriel implicite
  choice: elles
  alternative: expliciter « la sagesse et la réflexion »
  rationale: Le texte hébreu laisse l’antécédent dépendre du contexte environnant. Le pronom féminin pluriel français renvoie naturellement aux réalités précédemment mentionnées tout en préservant cette relative ambiguïté.
translation_notes:
  register: Français moderne, international et digne. L’image des yeux est conservée, tandis que « garde précieusement » et « sagesse efficace » cherchent à rendre clairement la portée pratique du vocabulaire sapiential.
