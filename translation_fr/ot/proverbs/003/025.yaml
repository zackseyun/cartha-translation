reference: Proverbs 3:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּ֭ירָא מִ/פַּ֣חַד פִּתְאֹ֑ם וּ/מִ/שֹּׁאַ֥ת רְ֝שָׁעִ֗ים כִּ֣י תָבֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: fr
  text: Ne redoute ni une terreur soudaine, ni la dévastation des méchants[a] quand elle viendra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut désigner soit la dévastation qui frappe les méchants, soit celle qui est causée par eux; le rapport exact n’est pas précisé.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Ne redoute
  rationale: La particule négative אַל suivie de l’imparfait exprime une interdiction. « Ne redoute » restitue avec concision le verbe ירא et convient naturellement aux deux compléments.
- source_word: מִפַּחַד פִּתְאֹם
  choice: une terreur soudaine
  rationale: פַּחַד désigne la terreur ou l’effroi, et פִּתְאֹם en souligne le caractère soudain ou inattendu. Après « redouter », la préposition מִן n’a pas besoin d’être rendue séparément en français.
- source_word: וּמִשֹּׁאַת
  choice: ni la dévastation
  rationale: La coordination négative française « ni… ni… » rend naturellement וּ après l’interdiction. שֹׁאָה désigne une dévastation, une ruine ou un désastre; « dévastation » conserve ici la force d’une calamité destructrice.
- source_word: רְשָׁעִים
  choice: liée aux méchants
  rationale: 'Le rapport construct entre שֹׁאַת et רְשָׁעִים reste indéterminé: les méchants peuvent subir cette calamité ou y être associés comme agents. « liée aux méchants » préserve cette ambiguïté sans alourdir excessivement le texte.'
- source_word: כִּי תָבֹא
  choice: quand elle viendra
  rationale: כִּי a ici une valeur temporelle. Le féminin « elle » reprend « la dévastation », conformément au verbe hébreu féminin singulier תָבֹא.
theological_decisions:
- issue: Rapport entre la dévastation et les méchants
  choice: la dévastation liée aux méchants
  alternative: la dévastation qui frappe les méchants / la dévastation causée par les méchants
  rationale: L’état construit hébreu ne précise pas si les méchants sont les victimes ou les auteurs de la dévastation. La traduction principale conserve volontairement cette tension.
translation_notes:
  register: Français moderne, sobre et dignifié. « Redoute » maintient la concision proverbiale; « liée aux méchants » est choisi pour préserver l’ambiguïté réelle de l’hébreu. La virgule finale respecte le fait que le verset se poursuit syntaxiquement au verset 26.
