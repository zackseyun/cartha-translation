  text: אַל תִּמְנַע ט֥וֹב מִ/בְּעָלָ֑י/ו בִּ/הְי֨וֹת לְ/אֵ֖ל ידי/ך לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/027.yaml
  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: fr
  text: Ne refuse pas le bien à ceux qui y ont droit[a], quand tu as le pouvoir de le faire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ses propriétaires » ou « à ses détenteurs ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « quand ta main a le pouvoir d’agir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Ne refuse pas
  rationale: La négation אַל suivie de l’inaccompli exprime ici une interdiction. « Ne refuse pas » rend naturellement l’idée de ne pas retenir ou priver quelqu’un de quelque chose.
- source_word: טוֹב
  choice: le bien
  rationale: 'Le terme reste volontairement large : il peut désigner ce qui est bon, utile ou bénéfique. « Le bien » préserve mieux cette amplitude que « un bienfait » ou « une faveur ».'
- source_word: מִבְּעָלָיו
  choice: à ceux qui y ont droit
  rationale: Littéralement, l’expression parle des « propriétaires » ou détenteurs du bien. Dans ce contexte éthique, elle désigne naturellement ceux qui peuvent légitimement le réclamer, sans limiter le propos à la propriété matérielle.
- source_word: בִּהְיוֹת לְאֵל יָדֶךָ
  choice: quand tu as le pouvoir
  rationale: La tournure hébraïque attribue le pouvoir à la « main », image courante de la capacité d’agir. La formulation française en communique clairement le sens.
- source_word: לַעֲשׂוֹת
  choice: de le faire
  rationale: Le verbe עשה signifie couramment « faire » ou « accomplir ». Le pronom reprend naturellement l’action consistant à accorder le bien.
theological_decisions:
- issue: Nature de l’obligation envers les bénéficiaires du bien
  choice: ceux qui y ont droit
  alternative: ses propriétaires
  rationale: La traduction principale exprime la revendication légitime suggérée par בְּעָלָיו, tandis que la note conserve l’image juridique plus littérale sans réduire le verset aux seuls biens matériels.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond à l’adresse hébraïque. « Le bien » conserve la portée générale de טוֹב, et les deux notes rendent visibles les images concrètes des « propriétaires » et de la « main ».
