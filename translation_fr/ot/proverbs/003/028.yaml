id: PRO.3.28
reference: Proverbs 3:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תֹּ֘אמַ֤ר ל/רעי/ך לֵ֣ךְ וָ֭/שׁוּב וּ/מָחָ֥ר אֶתֵּ֗ן וְ/יֵ֣שׁ אִתָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: fr
  text: 'Ne dis pas à ton prochain : « Va, puis reviens[a] ; demain, je donnerai », alors que tu l’as avec toi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « retourne » pour « reviens ».'
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition signifie que la personne possède déjà ce qu’elle doit donner et ne devrait donc pas remettre son geste à plus tard.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: prochain
  rationale: Dans les Proverbes, le mot désigne couramment une personne de l’entourage social, sans impliquer nécessairement une amitié intime. « Prochain » conserve cette portée éthique plus large.
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif hébreu est simple et direct ; « Va » en est l’équivalent français le plus sobre.
- source_word: שׁוּב
  choice: reviens
  rationale: Dans une parole adressée directement à quelqu’un que l’on renvoie, « reviens » est naturel et rend le mouvement de retour sans lourdeur.
- source_word: מָחָר
  choice: demain
  rationale: Équivalent temporel direct, sans nuance particulière à expliciter.
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: L’objet reste implicite en hébreu ; la formulation française le laisse également implicite.
- source_word: יֵשׁ אִתָּךְ
  choice: alors que tu l’as avec toi
  rationale: Cette formulation garde l’objet indéterminé tout en exprimant sa disponibilité présente. « Alors que » fait ressortir le contraste moral porté par le contexte sans préciser davantage la nature de ce qui doit être donné.
- source_word: אַל
  choice: Ne dis pas
  rationale: La négation exprime une interdiction simple ; « Ne dis pas » évite d’ajouter une emphase absente de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La parole citée conserve la brièveté des impératifs hébreux, tandis que « prochain » maintient la portée générale de l’obligation envers autrui.
