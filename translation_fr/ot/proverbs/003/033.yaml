  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: fr
  text: La malédiction de Yahweh est sur la maison du méchant[a], mais il bénit la demeure des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la maison du méchant ». La préposition hébraïque peut exprimer la présence de la malédiction dans la maison ou son action sur elle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le foyer » ou « l’habitation » des justes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: malédiction
  rationale: Le nom désigne une malédiction ou un état de malédiction. « La malédiction » rend directement et naturellement la construction nominale hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בְּבֵית רָשָׁע
  choice: pèse sur la maison du méchant
  rationale: La préposition ב peut être rendue littéralement par « dans », mais, avec « malédiction », l’expression idiomatique « pèse sur » communique clairement qu’elle atteint la maison ou la maisonnée du méchant. Le singulier hébreu רָשָׁע a ici une valeur générique.
- source_word: וּנְוֵה צַדִּיקִים
  choice: mais … la demeure des justes
  rationale: נָוֶה désigne un lieu d’habitation, une demeure ou un foyer. Le contexte antithétique justifie « mais », et le pluriel substantivé צַדִּיקִים est naturellement rendu par « les justes ».
- source_word: יְבָרֵךְ
  choice: il bénit
  rationale: L’inaccompli exprime ici une vérité générale propre au proverbe ; le présent français convient mieux qu’un futur strict.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom divin tout en évitant de le remplacer par un titre.
- issue: Valeur générique du singulier רָשָׁע
  choice: du méchant
  alternative: de la personne méchante ; des méchants
  rationale: Le singulier hébreu présente un type moral représentatif. Le singulier français maintient cette forme générique sans transformer le nombre du texte.
- issue: Valeur temporelle de יְבָרֵךְ
  choice: il bénit
  alternative: il bénira
  rationale: Dans cette maxime, la forme verbale décrit l’action habituelle de Dieu plutôt qu’un seul événement futur, tout en laissant intacte l’opposition théologique entre malédiction et bénédiction.
translation_notes:
  register: Français international moderne, clair et digne. « Pèse sur » est idiomatique sans affaiblir l’image d’une malédiction présente sur la maison ; « demeure » conserve le parallélisme concret avec « maison ».
