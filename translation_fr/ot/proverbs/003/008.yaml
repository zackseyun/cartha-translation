  text: It will be healing to your body and refreshment to your bones[a][b].
translation:
  language: fr
  text: Ce sera une guérison pour ton corps[a] et un rafraîchissement pour tes os[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour ton nombril ». Le terme hébreu peut désigner précisément le nombril, mais il semble représenter ici plus largement le bien-être physique du corps.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’humidité » ou « de la nourriture » pour tes os.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  choice: guérison
  rationale: Le nom désigne la guérison ou le rétablissement de la santé. « Guérison » conserve le caractère concret et dynamique de l’image.
- source_word: תְּהִי
  choice: ce sera
  rationale: L’imparfait de היה, au féminin singulier en accord avec רִפְאוּת, exprime ici la conséquence attendue des exhortations précédentes.
- source_word: לְשָׁרֶּךָ
  choice: pour ton corps
  rationale: Le terme peut désigner précisément le nombril, mais semble représenter ici plus largement le centre corporel ou le bien-être physique. « Corps » rend ce sens probable dans un français naturel, tandis que la lecture anatomique est conservée en note.
- source_word: וְשִׁקּוּי
  choice: et un rafraîchissement
  rationale: Le nom évoque l’action d’abreuver ou d’humidifier. En parallèle avec la guérison, « rafraîchissement » exprime naturellement l’effet réparateur tout en conservant l’image.
- source_word: לְעַצְמוֹתֶיךָ
  choice: pour tes os
  rationale: Traduction directe qui préserve l’image hébraïque concrète des os comme charpente et siège de la vigueur de la personne.
