id: PRO.3.7
reference: Proverbs 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תְּהִ֣י חָכָ֣ם בְּ/עֵינֶ֑י/ךָ יְרָ֥א אֶת יְ֝הוָ֗ה וְ/ס֣וּר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: fr
  text: Ne sois pas sage à tes propres yeux[a] ; crains Yahweh[b] et détourne-toi du mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne te considère pas comme sage. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « révère Yahweh ». Le verbe hébreu peut désigner une crainte mêlée de profond respect et de révérence devant Dieu.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « éloigne-toi du mal » ou « écarte-toi du mal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Ne sois pas
  rationale: La particule négative אַל suivie de l’inaccompli à valeur jussive exprime une interdiction. « Ne sois pas » rend naturellement cette construction avec l’adjectif attribut חָכָם.
- source_word: חָכָם בְּעֵינֶיךָ
  choice: sage à tes propres yeux
  rationale: L’expression désigne la sagesse que l’on s’attribue selon sa propre estimation. « À tes propres yeux » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: יְרָא
  choice: crains
  rationale: L’impératif de ירא peut évoquer à la fois la crainte, le respect révérenciel et l’émerveillement devant Dieu. « Crains » préserve la force et l’ampleur de ce terme dans la littérature sapientielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin personnel, et non un titre. « Yahweh » le translittère au lieu de le remplacer par « le Seigneur ».
- source_word: וְסוּר
  choice: et détourne-toi
  rationale: L’impératif de סור appelle à s’écarter volontairement de quelque chose. La forme pronominale « détourne-toi » exprime naturellement ce mouvement moral en français.
- source_word: מֵרָע
  choice: du mal
  rationale: Dans ce contexte sapientiel, רָע désigne le mal sur le plan moral. « Du mal » reste concis et n’en restreint pas indûment la portée.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: crains Yahweh
  alternative: révère Yahweh
  rationale: « Crains » maintient la tension sémantique de ירא entre peur, profond respect et révérence, sans réduire le terme à une simple déférence.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Puisque l’hébreu emploie explicitement le tétragramme, le texte principal conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international actuel, concis et digne. Le tutoiement singulier correspond aux formes masculines singulières de l’exhortation hébraïque. L’image « à tes propres yeux » est conservée parce qu’elle demeure claire en français.
