id: PRO.3.13
reference: Proverbs 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם מָצָ֣א חָכְמָ֑ה וְ֝/אָדָ֗ם יָפִ֥יק תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: fr
  text: Heureux l’homme qui trouve la sagesse[a], et l’homme qui acquiert l’intelligence !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Heureuse la personne qui trouve la sagesse, et la personne qui acquiert l’intelligence ! » Le mot hébreu traduit par « homme » désigne ici tout être humain.'
    reason: Préciser la portée générique de אָדָם et fournir une formulation inclusive possible.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule idiomatique introduit une béatitude et décrit une condition enviable. « Heureux » est la tournure consacrée, naturelle et digne en français.
- source_word: אָדָם
  choice: l’homme
  rationale: Le nom est au singulier et désigne ici, de manière représentative, tout être humain qui trouve la sagesse. « L’homme » conserve la forme du texte hébreu, tandis que la note précise sa portée générale.
- source_word: מָצָא
  choice: qui trouve
  rationale: Bien que la forme hébraïque soit un accompli, la maxime exprime une vérité générale ; le présent français rend naturellement cette valeur gnomique.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: C’est le terme central du livre des Proverbes pour la sagesse pratique et morale ; la traduction habituelle convient pleinement ici.
- source_word: וְאָדָם
  choice: et l’homme
  rationale: La répétition explicite du nom préserve le parallélisme des deux membres du verset.
- source_word: יָפִיק
  choice: acquiert
  rationale: Dans ce contexte et en parallèle avec « trouve », le verbe exprime le fait d’obtenir ou de gagner quelque chose. « Acquiert » est idiomatique et conserve l’idée d’une obtention effective.
- source_word: תְּבוּנָה
  choice: l’intelligence
  rationale: Dans la littérature de sagesse, le terme désigne la capacité de comprendre et de discerner. « Intelligence » est une traduction française traditionnelle et naturelle dans ce couple avec « sagesse ».
theological_decisions:
- issue: Masculin générique dans une béatitude sapientielle
  choice: Conserver « l’homme » dans le texte principal avec une note indiquant sa portée représentative
  alternative: « la personne » ou « celui qui »
  rationale: L’hébreu emploie deux fois le singulier אָדָם dans un sens générique. La traduction garde cette forme et son parallélisme sans limiter l’énoncé aux hommes de sexe masculin ; la note explicite que toute personne est concernée.
translation_notes:
  register: Français international moderne, clair et digne, avec une formulation proverbiale concise. L’exclamation restitue la force de la béatitude. Le parallélisme hébreu est conservé par la répétition de « l’homme ».
