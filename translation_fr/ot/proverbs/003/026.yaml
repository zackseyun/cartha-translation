  text: כִּֽי יְ֭הוָה יִהְיֶ֣ה בְ/כִסְלֶ֑/ךָ וְ/שָׁמַ֖ר רַגְלְ/ךָ֣ מִ/לָּֽכֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: fr
  text: 'Car Yahweh sera ton assurance[a],

    et il protégera ton pied pour qu’il ne soit pas pris.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens spatial : « sera à ton côté ». Littéralement, l’expression se rapporte à ton flanc ou à tes reins ; dans ce contexte, elle désigne probablement l’assurance ou la sécurité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation et la promesse précédentes, tout en conservant le lien logique du texte hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: יִהְיֶה בְכִסְלֶךָ
  choice: sera ton assurance
  rationale: Dans ce contexte de protection, כֶּסֶל désigne probablement l’assurance ou la sécurité sur laquelle on s’appuie. Cette formulation reste personnelle et naturelle en français.
- source_word: וְשָׁמַר
  choice: et il empêchera
  rationale: Rend ici la fonction protectrice de שׁמר dans une construction française naturelle avec la proposition infinitive qui suit.
- source_word: רַגְלְךָ
  choice: ton pied
  rationale: Conserve le singulier hébreu et l’image concrète du pied exposé à être capturé.
- source_word: מִלָּכֶד
  choice: d’être pris
  rationale: Exprime le fait d’être capturé ou pris sans ajouter explicitement un piège que l’hébreu ne nomme pas.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin; sa transcription préserve cette distinction au lieu de le remplacer par un titre.
- issue: Sens de בְכִסְלֶךָ
  choice: sera ton assurance
  alternative: sera à tes côtés
  rationale: Le contexte favorise le sens figuré de sécurité ou d’assurance, mais le sens corporel et spatial sous-jacent permet aussi de comprendre que Yahweh se tient aux côtés du fidèle; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La structure en deux lignes conserve le parallélisme. « Empêchera ton pied d’être pris » évite d’ajouter le nom « piège », absent du texte hébreu, tout en gardant clairement l’image de la capture.
