  yaml_path: translation/ot/proverbs/003/014.yaml
  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
translation:
  language: fr
  text: car son gain vaut mieux que le gain de l’argent[a], et ce qu’elle produit vaut mieux que l’or fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles pour « gain » : « commerce », « profit » ou « bénéfice ». L’hébreu emploie le vocabulaire du commerce pour exprimer la valeur de ce que procure la sagesse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou simplement : « l’or ». Le terme hébreu peut désigner un or particulièrement précieux ou raffiné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’éloge précédent de la sagesse et convient naturellement au lien explicatif.
- source_word: טוֹב
  choice: vaut mieux
  rationale: Dans la construction comparative avec מִן, l’adjectif « bon » exprime ici une supériorité de valeur; « vaut mieux » rend clairement cette comparaison.
- source_word: סַחְרָהּ
  choice: ce qu’elle rapporte
  rationale: Rend en français naturel le langage commercial appliqué à la sagesse personnifiée, sans le réduire à un simple bénéfice monétaire.
- source_word: מִסְּחַר כָּסֶף
  choice: que le profit de l’argent
  rationale: Préserve l’idée de gain commercial attachée à l’argent plutôt que de comparer seulement la sagesse au métal lui-même.
- source_word: כָּסֶף
  choice: argent
  rationale: Désignation française habituelle du métal précieux dans ce contexte.
- source_word: וּמֵחָרוּץ
  choice: que l’or fin
  rationale: חָרוּץ désigne ici l’or, avec une possible nuance de qualité ou de raffinement; « or fin » restitue cette nuance.
- source_word: תְּבוּאָתָהּ
  choice: ce qu’elle produit
  rationale: Conserve l’image du produit ou du fruit obtenu tout en restant idiomatique et en parallèle avec « ce qu’elle rapporte ».
