source:
  edition: WLC
  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: fr
  text: Mon fils, ne méprise pas la discipline de Yahweh et ne prends pas en dégoût sa réprimande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne te lasse pas de sa réprimande ». Le verbe hébreu peut exprimer la lassitude ou l’impatience aussi bien que la répulsion.
    reason: alternative lexicale
lexical_decisions:
- source_word: מוּסַר
  choice: discipline
  rationale: Dans la littérature de sagesse, le terme désigne une formation corrective et éducative. « Discipline » conserve cette double dimension sans la réduire à un simple enseignement ni à une punition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: בְּנִי
  choice: Mon fils
  rationale: L’hébreu est au masculin singulier et relève de l’adresse paternelle caractéristique de l’enseignement sapientiel.
- source_word: אַל תִּמְאָס
  choice: ne méprise pas
  rationale: Le verbe מָאַס exprime le rejet accompagné de dédain. « Ne méprise pas » en restitue la force affective et exhortative.
- source_word: תָּקֹץ
  choice: n’éprouve pas de dégoût
  rationale: קוּץ peut évoquer la répulsion, mais aussi la lassitude ou l’impatience. Cette formulation rend naturellement en français le sens fort de l’aversion, tandis que l’autre nuance est signalée en note.
- source_word: בְּתוֹכַחְתּוֹ
  choice: ses réprimandes
  rationale: תּוֹכַחַת désigne une correction exprimée verbalement. « Réprimandes » la distingue de la discipline formative plus large; le pluriel idiomatique français ne prétend pas préciser le nombre d’actes.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le verset emploie directement le tétragramme; le rendre par « Yahweh » préserve le nom personnel dans le texte plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de l’exhortation et le parallélisme hébreu sont conservés; la note maintient l’ambiguïté réelle du second verbe.
