  text: בְּ/כָל דְּרָכֶ֥י/ךָ דָעֵ֑/הוּ וְ֝/ה֗וּא יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/006.yaml
  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: fr
  text: Dans toutes tes voies, reconnais-le, et il rendra tes sentiers droits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il dirigera tes sentiers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל
  choice: Dans toutes
  rationale: La préposition ב avec כָּל présente l’ensemble des voies comme le domaine où Dieu doit être reconnu. « Dans toutes » est naturel et conserve cette portée globale.
- source_word: דְּרָכֶיךָ
  choice: tes voies
  rationale: דֶּרֶךְ peut désigner une route ou, au sens figuré, la conduite et le cours de la vie. « Voies » garde cette ampleur et reste distinct de « sentiers » dans la seconde proposition.
- source_word: דָעֵהוּ
  choice: reconnais-le
  rationale: L’impératif de יָדַע avec suffixe appelle ici à connaître Dieu en tenant compte de lui dans toute sa conduite. « Reconnais-le » exprime cette dimension relationnelle et active sans réduire le verbe à une connaissance intellectuelle.
- source_word: וְהוּא
  choice: et lui, il
  rationale: Le pronom indépendant explicite et met légèrement en relief le sujet. La dislocation « lui, il » restitue cette insistance en français naturel.
- source_word: יְיַשֵּׁר
  choice: rendra droits
  rationale: Le piel de יָשַׁר signifie rendre droit ou aplanir. « Rendra droits » conserve directement l’image hébraïque, plutôt que de l’interpréter seulement comme une indication de direction.
- source_word: אֹרְחֹתֶיךָ
  choice: tes sentiers
  rationale: אֹרַח désigne un sentier ou une piste, littéralement ou figurativement. « Sentiers » préserve la métaphore et la variation lexicale par rapport à דְּרָכֶיךָ, « tes voies ».
theological_decisions:
- issue: Nature de l’action divine promise
  choice: il rendra droits tes sentiers
  alternative: il dirigera tes sentiers
  rationale: L’hébreu représente Dieu comme celui qui rend le parcours droit ou praticable, et non simplement comme celui qui indique une direction. Le texte principal conserve cette image sans exclure l’idée de direction exprimée par la traduction traditionnelle.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond aux formes hébraïques de deuxième personne du singulier. La formulation conserve le parallélisme entre « voies » et « sentiers », ainsi que l’insistance du pronom וְהוּא.
