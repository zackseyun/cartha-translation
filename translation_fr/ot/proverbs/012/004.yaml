id: PRO.12.4
reference: Proverbs 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵֽשֶׁת חַ֭יִל עֲטֶ֣רֶת בַּעְלָ֑/הּ וּ/כְ/רָקָ֖ב בְּ/עַצְמוֹתָ֣י/ו מְבִישָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: fr
  text: Une femme de valeur[a] est la couronne de son mari, mais celle qui fait honte est comme une pourriture dans ses os[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une femme capable », « une femme vaillante » ou « une femme remarquable ». Le mot hébreu חַיִל peut évoquer la force, la valeur, la compétence et l’excellence.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « comme une pourriture dans ses os » : image d’une ruine intérieure profonde ou d’une honte qui ronge.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: une femme de valeur
  rationale: Dans ce contexte conjugal, אֵשֶׁת désigne l’épouse, tandis que חַיִל réunit les idées de force, de capacité, de mérite et d’excellence. « Femme de valeur » conserve cette richesse sans réduire l’expression à la seule vertu morale.
- source_word: עֲטֶרֶת
  choice: la couronne
  rationale: Le nom désigne une couronne ou une guirlande honorifique. « Couronne » préserve clairement l’image d’honneur conféré au mari.
- source_word: בַּעְלָהּ
  choice: de son mari
  rationale: Dans ce contexte, בַּעַל désigne le mari; la construction possessive hébraïque se rend naturellement ainsi en français.
- source_word: מְבִישָׁה
  choice: celle qui fait honte
  rationale: Le participe féminin à la forme causative exprime l’action de provoquer ou d’apporter la honte. Cette formulation garde le sens actif et renvoie à la femme du premier membre sans préciser un objet que l’hébreu ne nomme pas.
- source_word: וּכְרָקָב
  choice: mais … est comme une pourriture
  rationale: Le waw prend ici une valeur adversative à cause du contraste proverbial. רָקָב évoque la pourriture ou la décomposition; l’image concrète est conservée.
- source_word: בְּעַצְמוֹתָיו
  choice: dans ses os
  rationale: La traduction littérale maintient l’image hébraïque d’une corruption profonde et intérieure.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et proverbial. La formulation conserve le parallélisme, la métaphore de la couronne et l’image viscérale des os, tout en évitant d’expliciter la personne que la femme couvre de honte puisque l’hébreu ne la nomme pas.
