id: PRO.12.10
reference: Proverbs 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יוֹדֵ֣עַ צַ֭דִּיק נֶ֣פֶשׁ בְּהֶמְתּ֑/וֹ וְֽ/רַחֲמֵ֥י רְ֝שָׁעִ֗ים אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: fr
  text: Le juste connaît la vie de son animal[a], mais la compassion des méchants est cruelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comprend les besoins de son animal ». L’hébreu dit littéralement « connaît la vie de son animal », ce qui exprime une attention à son état et à son bien-être.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: connaît
  rationale: Le participe de ידע exprime le fait de connaître ou de comprendre. Ici, le contexte implique une attention concrète, mais « connaît » préserve le noyau lexical sans transformer l’implication éthique en paraphrase.
- source_word: צַדִּיק
  choice: le juste
  rationale: צַדִּיק désigne une personne juste. « Le juste » conserve le masculin singulier proverbial de l’hébreu tout en restant une formulation naturelle et générique en français sapientiel.
- source_word: נֶפֶשׁ
  choice: la vie
  rationale: נֶפֶשׁ peut désigner la vie, l’être, le souffle vital ou les besoins d’un vivant. Avec un animal, « la vie » préserve au mieux l’expression hébraïque et son ampleur, tandis que la note explicite le sens contextuel.
- source_word: בְּהֶמְתּוֹ
  choice: de son animal
  rationale: בְּהֵמָה peut désigner une bête, un animal domestique ou du bétail. « Son animal » est actuel, naturel et ne restreint pas indûment le référent aux bovins.
- source_word: רַחֲמֵי
  choice: la compassion
  rationale: Le pluriel construit issu de רחם exprime ici les sentiments ou manifestations de miséricorde. Le singulier collectif « la compassion » est idiomatique en français et maintient le contraste ironique du verset.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le substantif pluriel désigne les personnes moralement mauvaises; « les méchants » est le correspondant traditionnel, concis et clair dans la littérature de sagesse.
- source_word: אַכְזָרִי
  choice: cruelle
  rationale: Le terme signifie « cruel, impitoyable ». « Cruelle » rend directement la force du paradoxe selon lequel même la compassion attribuée aux méchants se révèle cruelle.
theological_decisions:
- issue: Masculin singulier du sujet proverbial
  choice: le juste
  alternative: la personne juste / les justes
  rationale: L’hébreu emploie un masculin singulier à portée proverbiale. « Le juste » conserve cette forme grammaticale sans limiter l’application générale du proverbe.
- issue: Portée de נֶפֶשׁ appliqué à l’animal
  choice: la vie, avec une note indiquant le sens de condition et de besoins
  alternative: les besoins / l’âme
  rationale: « Les besoins » expliciterait justement le sens contextuel mais réduirait la polysémie; « l’âme » risquerait d’importer en français une distinction métaphysique absente du propos. « La vie » maintient l’ambiguïté concrète de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique et le paradoxe final sont conservés. « Le juste » relève du registre biblique courant sans être archaïque.
