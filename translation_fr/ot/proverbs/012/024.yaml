revisions:
- from: La main des gens travailleurs dominera, mais la main nonchalante sera astreinte aux travaux forcés[a].
  to: La main des travailleurs diligents dominera, mais la main paresseuse sera soumise à la corvée[a].
  rationale: La révision améliore l’idiome français et précise le contraste entre diligence et paresse. Elle conserve l’image de la « main » dans les deux membres, ce qui est une explicitation sobre de l’ellipse du second membre hébreu, et rend מַס par « corvée », terme culturellement et sémantiquement plus approprié.
