source:
  edition: WLC
  text: יַד חָרוּצִ֥ים תִּמְשׁ֑וֹל ו֝/רְמִיָּ֗ה תִּהְיֶ֥ה לָ/מַֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/024.yaml
  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
translation:
  language: fr
  text: La main des travailleurs diligents dominera, mais la main paresseuse sera soumise à la corvée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne un service de travail obligatoire, parfois appelé corvée.
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: la main
  rationale: Le nom concret est conservé. Dans les deux membres, « main » désigne par métonymie la personne dans son action et permet de rendre explicite le parallélisme elliptique de l’hébreu.
- source_word: חָרוּצִים
  choice: des gens travailleurs
  rationale: Cette expression courante rend l’idée de personnes diligentes et laborieuses, tout en s’opposant naturellement à la « main nonchalante ».
- source_word: תִּמְשׁוֹל
  choice: dominera
  rationale: Le verbe משל exprime l’exercice du pouvoir ou l’ascendant. « Dominera » conserve ici la force concise du proverbe sans préciser indûment la forme de cette autorité.
- source_word: רְמִיָּה
  choice: nonchalante
  rationale: Dans ce contraste avec חָרוּצִים, le terme désigne le relâchement, la négligence ou la paresse plutôt que la tromperie. L’adjectif qualifie « main », sous-entendu dans le second membre hébreu.
- source_word: תִּהְיֶה לָמַס
  choice: sera astreinte aux travaux forcés
  rationale: La tournure française exprime clairement le passage à une condition de service obligatoire. מַס désigne ici une corvée ou un travail imposé, et non simplement un impôt monétaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. « Gens travailleurs » reste accessible; « nonchalante » conserve l’image de la main tout en exprimant la négligence. Le futur gnomique et le parallélisme antithétique de l’hébreu sont maintenus.
