review_pass:
  verdict: revise
  source_fidelity: Le premier membre rend fidèlement la métonymie de יָד (« main »), le groupe des diligents et l’idée d’ascendant de תמשול. Dans le second, l’ellipse d’une « main » est admissible en français et maintient le parallélisme. מַס désigne une corvée, c’est-à-dire un travail obligatoire imposé, plutôt que les « travaux forcés » au sens pénal moderne.
  naturalness: « Des gens travailleurs » est lourd et peu proverbial; « des travailleurs diligents » est plus naturel. « Main nonchalante » évoque surtout une attitude désinvolte et ne rend pas précisément la paresse ou la négligence laborieuse en contraste. « Main paresseuse » est idiomatique, clair et parallèle à « la main des travailleurs diligents ».
  terminology: « Corvée » est le meilleur terme français concis pour מַס dans ce contexte. « Travaux forcés » peut induire l’idée moderne d’une peine pénale; il vaut mieux employer « corvée » dans le texte et expliquer son caractère obligatoire dans la note.
  issues:
  - severity: medium
    issue: « des gens travailleurs » est maladroit.
    rationale: La formulation est moins naturelle que « des travailleurs diligents » et atténue le style sentencieux du proverbe.
  - severity: medium
    issue: « nonchalante » ne traduit pas assez précisément רְמִיָּה.
    rationale: Dans cette antithèse, le terme vise la paresse ou la négligence; « nonchalante » peut désigner une décontraction sans rapport avec le travail.
  - severity: medium
    issue: « travaux forcés » risque une connotation pénale anachronique.
    rationale: מַס renvoie à une prestation de travail obligatoire ou corvée. « Corvée » est plus exact, la note explicitant la contrainte.
  revised_text: La main des travailleurs diligents dominera, mais la main paresseuse sera soumise à la corvée[a].
