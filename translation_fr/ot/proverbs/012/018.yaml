  text: יֵ֣שׁ בּ֭וֹטֶה כְּ/מַדְקְר֣וֹת חָ֑רֶב וּ/לְשׁ֖וֹן חֲכָמִ֣ים מַרְפֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: fr
  text: Il y en a qui parlent à la légère, et dont les paroles sont comme des coups d’épée[a], mais la langue des sages apporte la guérison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des blessures infligées par une épée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la langue des sages est guérison » ou « est un remède ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ בּוֹטֶה
  choice: Il y a des paroles irréfléchies
  rationale: La tournure existentielle יֵשׁ introduit un comportement typique, et le participe בּוֹטֶה désigne une parole lancée sans retenue. Cette formulation française est naturelle et conserve la portée générale du proverbe.
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: comme des coups d’épée
  rationale: מַדְקְרוֹת, au pluriel, évoque des coups qui transpercent ou poignardent. « Coups d’épée » rend l’image avec clarté et vigueur en français courant.
- source_word: וּלְשׁוֹן חֲכָמִים
  choice: mais la langue des sages
  rationale: « Langue » maintient la métaphore hébraïque de la parole, tandis que « des sages » désigne de façon générique les personnes sages. Le contraste appelle naturellement « mais » en français.
- source_word: מַרְפֵּא
  choice: apporte la guérison
  rationale: Le nom מַרְפֵּא peut signifier guérison ou remède. La formulation verbale exprime naturellement en français l’effet réparateur de la parole sage sans effacer la valeur nominale, signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme entre la parole qui blesse et la langue qui guérit est conservé, ainsi que l’image concrète de l’épée.
