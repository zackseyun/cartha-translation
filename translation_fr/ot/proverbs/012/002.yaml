id: PRO.12.2
reference: Proverbs 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ט֗וֹב יָפִ֣יק רָ֭צוֹן מֵ/יְהוָ֑ה וְ/אִ֖ישׁ מְזִמּ֣וֹת יַרְשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: fr
  text: L’homme de bien obtient la faveur de Yahvé[a], mais Yahvé condamne l’homme aux projets perfides[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « gagne l’approbation de Yahvé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’homme de projets ». Le terme hébreu peut être neutre ailleurs, mais le contraste et la condamnation lui donnent probablement ici un sens négatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: l’homme de bien
  rationale: L’adjectif substantivé désigne une personne caractérisée par sa bonté morale. « L’homme de bien » est concis, naturel dans un proverbe et conserve la forme masculine du texte hébreu.
- source_word: יָפִיק
  choice: obtient
  rationale: Avec רָצוֹן, le hiphil exprime idiomatiquement le fait d’obtenir ou de s’assurer la faveur de quelqu’un. « Obtient » rend clairement le résultat sans surinterpréter le mécanisme.
- source_word: רָצוֹן
  choice: la faveur
  rationale: Dans ce contexte, le nom désigne l’approbation ou la bienveillance divine. « Faveur » est bref et convient au parallélisme proverbial.
- source_word: מֵיְהוָה
  choice: de Yahvé
  rationale: La préposition מִן marque ici la source de la faveur, et le nom divin est rendu par « Yahvé » afin de représenter directement le tétragramme.
- source_word: אִישׁ מְזִמּוֹת
  choice: l’homme aux projets perfides
  rationale: מְזִמּוֹת peut désigner des projets de manière neutre ou positive, mais l’antithèse avec « l’homme de bien » et le verbe « condamner » lui donnent vraisemblablement ici une valeur négative. « Perfides » exprime cette valeur contextuelle sans préciser indûment la nature des projets.
- source_word: יַרְשִׁיעַ
  choice: Yahvé condamne
  rationale: Le hiphil de רשע signifie déclarer coupable ou condamner. Le sujet non exprimé dans le second membre est naturellement repris du premier membre; le nommer de nouveau produit un français clair.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » conserve sa fonction de nom propre et correspond à une forme française largement intelligible.
- issue: Sujet sous-entendu de יַרְשִׁיעַ
  choice: Répéter explicitement « Yahvé »
  alternative: Employer « il », en maintenant l’ellipse hébraïque
  rationale: Le sujet le plus naturel est Yahvé, repris du premier membre. En français, un simple « il » pourrait être compris comme renvoyant à « l’homme de bien »; la répétition évite cette fausse ambiguïté sans modifier le sens probable de l’hébreu.
- issue: Valeur morale de מְזִמּוֹת
  choice: projets perfides
  alternative: projets
  rationale: Le nom peut être neutre selon le contexte, mais le contraste avec l’homme de bien et la condamnation divine favorisent nettement une lecture négative. Une note conserve toutefois la largeur sémantique du terme.
translation_notes:
  register: Français moderne, international et digne, avec la concision propre au genre proverbial. La répétition de « Yahvé » clarifie le sujet sous-entendu du second membre; les notes signalent les principales possibilités lexicales sans alourdir le texte.
