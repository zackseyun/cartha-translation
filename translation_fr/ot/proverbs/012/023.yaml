id: PRO.12.23
reference: Proverbs 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָדָ֣ם עָ֭רוּם כֹּ֣סֶה דָּ֑עַת וְ/לֵ֥ב כְּ֝סִילִ֗ים יִקְרָ֥א אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: fr
  text: Une personne avisée cache son savoir[a], mais le cœur des insensés proclame leur folie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une personne prudente couvre la connaissance ». Le verbe hébreu signifie littéralement « couvrir », et l’adjectif peut aussi se rendre par « prudente » ou « habile ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le cœur des insensés crie la folie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: une personne
  rationale: Le nom désigne ici un individu représentatif. « Une personne » rend naturellement cette portée générale en français moderne sans transformer le proverbe en affirmation sur l’humanité entière.
- source_word: עָרוּם
  choice: avisée
  rationale: Dans ce contraste avec les insensés, l’adjectif exprime surtout la prudence et le discernement. « Avisée » conserve aussi une légère nuance d’habileté.
- source_word: כֹּסֶה
  choice: cache
  rationale: Le participe signifie littéralement « couvre » et, par extension, « cache » ou « tient dissimulé ». « Cache » est direct et naturel ici, sans expliquer la raison de cette retenue.
- source_word: דָּעַת
  choice: son savoir
  rationale: Le terme désigne la connaissance. « Son savoir » s’intègre naturellement à la tournure française tout en maintenant le contraste sapiential avec la folie.
- source_word: לֵב
  choice: le cœur
  rationale: Le « cœur » hébreu englobe la pensée et les dispositions intérieures. Le conserver respecte l’image anthropologique et la personnification du vers.
- source_word: כְּסִילִים
  choice: les insensés
  rationale: « Insensés » rend la catégorie morale et intellectuelle caractéristique des Proverbes dans un registre digne et actuel.
- source_word: יִקְרָא
  choice: proclame
  rationale: Le verbe signifie « appeler » ou « crier »; dans ce contexte, il décrit le fait de rendre la folie publiquement manifeste. « Proclame » exprime bien cette publicité.
- source_word: אִוֶּלֶת
  choice: leur folie
  rationale: « Folie » est le terme sapiential approprié. Le possessif explicite en français que la folie proclamée caractérise les insensés, sans modifier le contraste du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La formulation conserve l’image du cœur et le parallélisme entre la retenue de la personne avisée et l’étalage de la folie par les insensés.
