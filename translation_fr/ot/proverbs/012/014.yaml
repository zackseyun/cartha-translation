- from: Du fruit de sa bouche, un homme se rassasie de bien[a], et ce que les mains d’un être humain ont accompli lui revient[b].
  to: Un homme se rassasie de bien du fruit de sa bouche[a], et la rétribution de ses actes lui revient[b].
  rationale: La révision remplace une paraphrase qui assimilait גְמוּל aux œuvres accomplies par une formulation qui exprime son sens rétributif tout en gardant l’ambiguïté relative entre récompense, conséquence et retour des actes. Elle supprime aussi l’aspect passé introduit par « ont accompli » et harmonise les notes avec le texte révisé.
