source:
  edition: WLC
  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: fr
  text: Un homme se rassasie de bien du fruit de sa bouche[a], et la rétribution de ses actes lui revient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « un homme » est au masculin singulier, mais le proverbe énonce une vérité générale qui concerne toute personne.
    reason: cultural_note
  - marker: b
    text: 'Ou : « ce que ses actes produisent lui revient ». Le terme hébreu peut désigner la rétribution, le retour ou la conséquence des actes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: Du fruit de sa bouche, un homme
  rationale: Cette formulation conserve la métaphore hébraïque du « fruit » produit par la bouche, tout en rendant naturellement en français la relation de provenance exprimée par מִן.
- source_word: יִשְׂבַּע טוֹב
  choice: se rassasie de bien
  rationale: שׂבע évoque le fait d’être rassasié ou comblé. Le présent convient à la vérité générale énoncée par le proverbe, et « bien » garde l’ampleur de טוֹב sans le limiter à la prospérité matérielle.
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: ce que les mains d’un être humain ont accompli
  rationale: גְמוּל peut désigner ce qu’une action produit, mérite ou fait revenir sur son auteur. La tournure choisie est naturelle et maintient le parallélisme entre les paroles et les actes, tandis qu’une note signale le sens plus explicitement rétributif.
- source_word: יָשׁוּב לוֹ
  choice: lui revient
  rationale: Le verbe שׁוב signifie « revenir » ou « retourner ». « Lui revient » exprime avec concision le retour sur l’auteur de ce que ses actes ont produit.
theological_decisions:
- issue: Portée des masculins singuliers אִישׁ et אָדָם
  choice: « un homme » et « un être humain » avec une note précisant leur portée générale
  alternative: « une personne » ou « chacun » dans les deux membres
  rationale: Le premier terme est rendu de façon concrète par « un homme », tandis que אָדָם est traduit par « un être humain ». La note évite de restreindre le proverbe aux hommes de sexe masculin sans effacer la variation lexicale de l’hébreu.
- issue: Valeur de גְמוּל dans le second membre
  choice: 'Formulation ouverte : « ce que les mains… ont accompli »'
  alternative: « la rétribution des œuvres… »
  rationale: Le mot peut viser aussi bien le produit ou l’effet des actes que la rétribution qui en découle. Le texte principal conserve cette latitude, et la note présente explicitement la lecture rétributive.
translation_notes:
  register: Français international actuel, sobre et proverbial. La métaphore du fruit de la bouche est conservée; la syntaxe reste accessible sans aplatir l’ambiguïté de גְמוּל.
