source:
  edition: WLC
  text: הָפ֣וֹךְ רְשָׁעִ֣ים וְ/אֵינָ֑/ם וּ/בֵ֖ית צַדִּיקִ֣ים יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/007.yaml
  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: fr
  text: Les méchants sont renversés et ne sont plus[a], mais la maison des justes restera debout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ils ne sont pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mais la maisonnée des justes subsistera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: sont renversés
  rationale: La forme elliptique exprime ici un renversement subi et son résultat. Le français fournit un verbe conjugué pour rendre naturellement le sens prédicatif.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé pluriel désigne des personnes moralement mauvaises. « Les méchants » est concis et naturel dans le registre proverbial.
- source_word: וְאֵינָם
  choice: et ne sont plus
  rationale: Littéralement « et ils ne sont pas ». « Ne sont plus » exprime naturellement leur disparition sans préciser davantage la manière.
- source_word: וּבֵית
  choice: mais la maison
  rationale: בַּיִת peut désigner la maison, la maisonnée ou la lignée. « Maison » conserve cette amplitude métaphorique, tandis que « mais » explicite le contraste porté par le contexte.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif substantivé pluriel désigne ceux qui sont justes. « Les justes » est une formulation claire et consacrée dans les textes de sagesse.
- source_word: יַעֲמֹד
  choice: restera debout
  rationale: Le verbe signifie littéralement « se tenir debout ». « Restera debout » préserve l’image concrète tout en faisant entendre la stabilité durable opposée au renversement.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique et l’image du renversement opposé à la stabilité sont conservés. Les notes signalent le littéralisme de וְאֵינָם et l’ambiguïté de בַּיִת entre bâtiment, maisonnée et lignée.
