  source_fidelity: 'Le premier membre rend correctement la structure et le sens de יָפִיחַ אֱמוּנָה יַגִּיד צֶדֶק : une parole vraie/fiable fait connaître ce qui est juste. « Qui dit la vérité » est une désmétaphorisation légitime de « souffle/exhale », et « ce qui est juste » maintient utilement l’amplitude de צֶדֶק. Dans le second membre, « faux témoin » rend bien עֵד שְׁקָרִים. Il convient toutefois de remplacer « dit la tromperie », qui n’est pas idiomatique en français, par un verbe qui exprime l’énonciation sans surinterpréter l’ellipse hébraïque.'
