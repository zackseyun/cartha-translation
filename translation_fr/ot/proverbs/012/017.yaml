  text: יָפִ֣יחַ אֱ֭מוּנָה יַגִּ֣יד צֶ֑דֶק וְ/עֵ֖ד שְׁקָרִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/017.yaml
  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: fr
  text: Qui dit la vérité[a] proclame ce qui est juste[b] ; le faux témoin, lui, profère la tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité », au sens d’une parole digne de confiance.
    reason: lexical_alternative
  - marker: b
    text: Ou « proclame la justice » ou « proclame la droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפִיחַ
  choice: dit
  rationale: Le hiphil de נפח évoque littéralement le fait de souffler ou d’exhaler, mais sert ici à désigner l’émission d’une parole. « Dit » restitue naturellement cette valeur idiomatique en français moderne.
- source_word: אֱמוּנָה
  choice: la vérité
  rationale: Dans le contexte du témoignage et en opposition au faux témoin, אֱמוּנָה désigne une parole fiable et véridique. « La vérité » exprime clairement ce contraste, tandis que « fidélité » reste une possibilité lexicale signalée en note.
- source_word: יַגִּיד
  choice: proclame
  rationale: Le hiphil de נגד signifie faire connaître, annoncer ou déclarer. « Proclame » convient au cadre solennel du témoignage sans être excessivement technique.
- source_word: צֶדֶק
  choice: ce qui est juste
  rationale: צֶדֶק peut désigner la justice, la droiture ou ce qui est conforme au droit. « Ce qui est juste » conserve cette amplitude et s’intègre naturellement à la phrase.
- source_word: עֵד שְׁקָרִים
  choice: le faux témoin
  rationale: L’expression hébraïque signifie littéralement « témoin de mensonges » et désigne idiomatiquement un témoin qui dépose faussement. « Faux témoin » est l’équivalent français courant.
- source_word: מִרְמָה
  choice: la tromperie
  rationale: Le nom désigne la fraude ou la duplicité. « Tromperie » maintient le contraste direct avec « vérité » et la concision du proverbe.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le second « dit » explicite l’ellipse verbale de l’hébreu afin que l’antithèse soit immédiatement intelligible, tandis que « lui » souligne le contraste entre les deux témoins.
