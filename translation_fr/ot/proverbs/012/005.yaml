  text: מַחְשְׁב֣וֹת צַדִּיקִ֣ים מִשְׁפָּ֑ט תַּחְבֻּל֖וֹת רְשָׁעִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/005.yaml
  text: The thoughts of the righteous are justice[b][a]; the counsels of the wicked are deceit.
translation:
  language: fr
  text: Les pensées[a] des justes sont conformes au droit[b] ; les conseils[c] des méchants sont tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « projets » ou « intentions ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « droit », « justice » ou « jugement ». La tournure « sont conformes au droit » rend naturellement en français la prédication nominale.'
    reason: lexical_alternative
  - marker: c
    text: Ou « plans » ou « stratégies ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: pensées
  rationale: Le nom peut désigner les pensées, les intentions ou les projets. « Pensées » reste naturel et conserve l'intériorité morale du premier membre.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L'adjectif substantivé désigne les personnes qui vivent conformément à la justice ; « les justes » est concis et traditionnel sans être archaïque.
- source_word: מִשְׁפָּט
  choice: conformes au droit
  rationale: Le nom signifie notamment droit, justice ou jugement. Cette tournure prédicative exprime naturellement en français que les pensées des justes ont le droit pour norme, sans réduire le terme à un simple adjectif.
- source_word: תַּחְבֻּלוֹת
  choice: conseils
  rationale: Le terme peut évoquer conseils, plans ou stratégies. « Conseils » préserve sa neutralité lexicale, tandis que le prédicat en précise ici la qualité mauvaise.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L'adjectif substantivé désigne ceux qui agissent mal et maintient clairement l'antithèse avec « les justes ».
- source_word: מִרְמָה
  choice: tromperie
  rationale: Le nom désigne la tromperie, la fraude ou la duplicité. « Tromperie » est direct, courant et parallèle au nom abstrait du premier membre.
theological_decisions:
- issue: Valeur prédicative de מִשְׁפָּט
  choice: sont conformes au droit
  alternative: sont justice / sont justes
  rationale: Le français ne peut guère reproduire naturellement la prédication nominale hébraïque « les pensées… [sont] droit/justice ». La formulation retenue garde le substantif « droit » et le lien normatif sans transformer entièrement le mot en adjectif.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme antithétique est conservé. « Ne sont que » rend idiomatiquement la prédication nominale du second membre, sans ajouter une catégorie doctrinale.
