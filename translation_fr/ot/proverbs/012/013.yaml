source:
  edition: WLC
  text: בְּ/פֶ֣שַׁע שְׂ֭פָתַיִם מוֹקֵ֣שׁ רָ֑ע וַ/יֵּצֵ֖א מִ/צָּרָ֣ה צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: fr
  text: Dans la faute des lèvres[b] se trouve un piège pour le méchant[a], mais le juste sort de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par la faute de ses lèvres, le méchant est pris au piège. » L’hébreu est concis, et le rapport entre « faute des lèvres » et « piège » peut indiquer soit la sphère (« dans »), soit le moyen ou le résultat (« par »).'
    reason: alternative_reading
  - marker: b
    text: Les « lèvres » désignent ici la parole ou les paroles prononcées.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Dans la faute
  rationale: La préposition ב peut exprimer ici la sphère (« dans ») ou le moyen et le résultat (« par »). « Dans » conserve la formulation compacte et laisse subsister cette ambiguïté.
- source_word: שְׂפָתַיִם
  choice: des lèvres
  rationale: Le sens littéral maintient l’image corporelle hébraïque; les lèvres représentent ici la parole.
- source_word: מוֹקֵשׁ
  choice: un piège
  rationale: « Piège » restitue naturellement en français l’image d’un dispositif qui prend celui qui s’y laisse entraîner.
- source_word: רָע
  choice: l’homme mauvais
  rationale: L’adjectif substantivé singulier désigne une personne mauvaise. Cette formulation conserve le masculin représentatif du texte hébreu sans employer le terme plus fortement marqué « méchant ».
- source_word: וַיֵּצֵא
  choice: sort
  rationale: Le verbe signifie concrètement « sortir »; ce choix préserve l’image plutôt que de l’expliciter par « échappe ».
- source_word: מִצָּרָה
  choice: de la détresse
  rationale: צָרָה désigne la détresse, l’adversité ou une situation difficile. « Sortir de la détresse » est naturel et proche de l’hébreu.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne une personne juste; « le juste » est une formulation française naturelle et traditionnelle dans la littérature de sagesse.
theological_decisions:
- issue: Singuliers masculins représentant des types humains dans la littérature de sagesse
  choice: l’homme mauvais… le juste
  alternative: la personne mauvaise… la personne juste
  rationale: L’hébreu oppose deux figures masculines singulières représentatives. La traduction conserve cette forme quand elle reste naturelle en français, sans restreindre nécessairement la portée du proverbe aux seuls hommes.
- issue: Rapport entre la faute verbale et le piège
  choice: Dans la faute des lèvres se trouve un piège
  alternative: Par la faute de ses lèvres, l’homme mauvais est pris au piège
  rationale: La construction hébraïque est nominale et compacte. Le choix principal préserve l’ambiguïté entre la sphère où réside le piège et le moyen par lequel l’homme mauvais est pris, plutôt que de fixer explicitement une causalité.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme antithétique et les images concrètes de l’hébreu. Les marqueurs [b][a] suivent immédiatement « l’homme mauvais », comme dans la couche de consultation, tout en correspondant chacun à une note présente.
