  text: מִ֭רְמָה בְּ/לֶב חֹ֣רְשֵׁי רָ֑ע וּֽ/לְ/יֹעֲצֵ֖י שָׁל֣וֹם שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: fr
  text: 'La tromperie est dans le cœur de ceux qui trament le mal,

    mais la joie est pour ceux qui conseillent la paix.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « paix » peut aussi désigner le bien-être, l’harmonie ou la plénitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  choice: la tromperie
  rationale: Le nom désigne la tromperie, la duplicité ou l’intention frauduleuse. « La tromperie » est naturel en français et convient à la disposition intérieure évoquée.
- source_word: בְּלֶב
  choice: est dans le cœur de
  rationale: Le cœur représente ici le siège des intentions et de la réflexion. La copule absente en hébreu est explicitée en français.
- source_word: חֹרְשֵׁי רָע
  choice: ceux qui préparent le mal
  rationale: Le participe חֹרְשֵׁי évoque l’action de concevoir ou préparer un projet nuisible. « Préparent le mal » conserve l’idée de préméditation dans une formulation courante.
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: mais … pour ceux qui conseillent la paix
  rationale: Le lamed désigne les personnes auxquelles revient la joie, tandis que le participe exprime le fait de conseiller ou de promouvoir la paix. « Mais » rend le contraste entre les deux membres.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: « Paix » est le correspondant français principal de שָׁלוֹם et convient au contraste avec le mal, tout en laissant résonner les idées de bien-être et d’harmonie.
- source_word: שִׂמְחָה
  choice: la joie est pour
  rationale: La proposition nominale hébraïque exige une copule en français. « La joie est pour » garde l’accent sur la joie et exprime sans surinterprétation son association avec ceux qui conseillent la paix.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme antithétique et l’image biblique du cœur comme siège des intentions sont conservés. La formulation reste proche de la concision de l’hébreu.
