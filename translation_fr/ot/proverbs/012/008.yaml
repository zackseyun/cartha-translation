  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: fr
  text: Un homme est loué à la mesure de son discernement[a], mais celui dont le cœur est tortueux[b] sera méprisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en proportion de sa prudence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tortueux de cœur », expression désignant une disposition intérieure moralement dévoyée.'
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: à la mesure de
  rationale: L’expression signifie littéralement « selon la bouche de », mais fonctionne ici comme une indication de mesure ou de proportion. « À la mesure de » rend naturellement ce rapport en français.
- source_word: שִׂכְלוֹ
  choice: son discernement
  rationale: שֵׂכֶל peut désigner l’intelligence pratique, la prudence ou le bon sens. « Discernement » conserve ici la dimension à la fois intellectuelle et morale propre à la littérature sapientielle.
- source_word: יְהֻלַּל
  choice: est loué
  rationale: Le pual exprime le fait d’être loué. Le présent convient à la formulation d’une vérité générale proverbiale.
- source_word: אִישׁ
  choice: Un homme
  rationale: Le nom hébreu est masculin singulier et présente ici une figure représentative. « Un homme » respecte la forme du texte source sans empêcher sa portée générale.
- source_word: נַעֲוֵה
  choice: tortueux
  rationale: Le terme évoque ce qui est tordu ou dévié, notamment sur le plan moral. « Tortueux » préserve cette image en français courant et digne.
- source_word: לֵב
  choice: cœur
  rationale: Dans l’anthropologie hébraïque, le cœur comprend la pensée, la volonté et les dispositions intérieures. « Cœur » maintient l’idiome biblique sans en réduire le sens.
- source_word: יִהְיֶה לָבוּז
  choice: sera méprisé
  rationale: La construction signifie devenir ou être un objet de mépris. « Sera méprisé » en donne une formulation française concise et naturelle, tout en conservant l’aspect prospectif de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme antithétique du proverbe et l’image hébraïque du cœur, tout en employant « à la mesure de » pour rendre clairement la relation proportionnelle exprimée par לְפִי.
