source:
  edition: WLC
  text: אֹהֵ֣ב מ֭וּסָר אֹ֣הֵֽב דָּ֑עַת וְ/שֹׂנֵ֖א תוֹכַ֣חַת בָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
translation:
  language: fr
  text: Qui aime la discipline aime la connaissance, mais qui déteste la réprimande est stupide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abruti ». Le mot hébreu peut qualifier une personne bornée, dépourvue de discernement ou semblable à une bête.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Qui aime
  rationale: Le participe masculin singulier a ici une portée générale et proverbiale. « Qui aime » est naturel en français moderne et inclut toute personne.
- source_word: מוּסָר
  choice: discipline
  rationale: Dans les Proverbes, le terme désigne une formation qui instruit et corrige. « Discipline » conserve cette double dimension.
- source_word: דָּעַת
  choice: connaissance
  rationale: Équivalent courant de ce terme dans la littérature sapientielle, il maintient le lien entre l'acceptation de la discipline et l'acquisition du savoir.
- source_word: וְשֹׂנֵא
  choice: mais qui déteste
  rationale: La conjonction introduit l'opposition entre les deux membres du proverbe; « mais » rend clairement cette valeur antithétique.
- source_word: תוֹכַחַת
  choice: réprimande
  rationale: Le mot désigne une correction formulée verbalement. « Réprimande » est clair, actuel et suffisamment vigoureux.
- source_word: בָּעַר
  choice: stupide
  rationale: L'adjectif qualifie quelqu'un de borné, dépourvu de discernement, voire comparable à une bête. « Stupide » restitue directement la dureté de l'évaluation proverbiale.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme antithétique et la vigueur du jugement final sont conservés. Le masculin grammatical de l'hébreu est rendu par la tournure générique « qui ».
