  source_fidelity: 'Le sens antithétique du texte hébreu est bien rendu : la parole de vérité possède une stabilité durable, tandis que la langue mensongère n’a qu’une durée très brève. « Une parole vraie » est une transposition idiomatique justifiée de « lèvre de vérité », et « demeure ferme » rend de manière satisfaisante la notion d’être affermi/établi (תִּכּוֹן). La difficulté de וְעַד אַרְגִּיעָה est correctement signalée sans prétendre la résoudre au-delà de ce que permet le contexte.'
