  text: שְֽׂפַת אֱ֭מֶת תִּכּ֣וֹן לָ/עַ֑ד וְ/עַד אַ֝רְגִּ֗יעָה לְשׁ֣וֹן שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/019.yaml
  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: fr
  text: 'Une parole vraie demeure ferme pour toujours[a],

    mais la langue mensongère ne dure qu’un instant[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « La lèvre de vérité est affermie pour toujours. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque de la seconde ligne est difficile. Dans ce contraste poétique, elle semble indiquer que la parole mensongère ne subsiste que très peu de temps.
    reason: textual_difficulty
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: une parole vraie
  rationale: Littéralement « une lèvre de vérité ». En français courant, « une parole vraie » exprime naturellement la métonymie de la lèvre pour le discours, tout en conservant la qualité morale de vérité.
- source_word: תִּכּוֹן
  choice: demeure ferme
  rationale: Le nifal de כון évoque ce qui est établi, affermi et durable. « Demeure ferme » convient à la portée générale du proverbe et souligne la stabilité en contraste avec la brièveté du mensonge.
- source_word: לָעַד
  choice: pour toujours
  rationale: L’expression indique une permanence durable; « pour toujours » est clair, naturel et directement opposé à « un instant ».
- source_word: וְעַד אַרְגִּיעָה
  choice: mais … ne dure qu’un instant
  rationale: La formulation hébraïque est difficile. Dans le parallélisme antithétique, elle indique vraisemblablement la très courte durée de la parole mensongère; le français explicite le verbe sous-entendu.
- source_word: לְשׁוֹן שָׁקֶר
  choice: la langue mensongère
  rationale: « Langue » conserve l’image corporelle hébraïque désignant la parole, et « mensongère » rend naturellement le complément « de mensonge ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et proverbial. La première ligne privilégie « parole » pour éviter l’étrangeté de « lèvre » en français, tandis que la seconde conserve l’image biblique naturelle de la « langue ». Le parallélisme entre permanence de la vérité et brièveté du mensonge reste net.
