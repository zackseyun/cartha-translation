id: PRO.12.15
reference: Proverbs 12:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דֶּ֣רֶךְ אֱ֭וִיל יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/שֹׁמֵ֖עַ לְ/עֵצָ֣ה חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: fr
  text: La voie de l’insensé est droite à ses propres yeux[a], mais celui qui écoute les conseils est sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La voie de l’insensé lui paraît juste. » L’hébreu dit littéralement : « est droite à ses yeux », expression qui désigne son propre jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: voie
  rationale: « Voie » conserve la métaphore sapientielle du parcours de vie ou de la conduite, dans un registre français naturel et digne.
- source_word: אֱוִיל
  choice: insensé
  rationale: Dans les Proverbes, le terme désigne une personne dépourvue de sagesse sur les plans moral et intellectuel. « Insensé » rend cette catégorie sapientielle sans suggérer simplement un manque d’intelligence.
- source_word: יָשָׁר
  choice: droite
  rationale: L’adjectif signifie littéralement « droit » et, dans l’expression avec « à ses yeux », indique que la conduite est jugée correcte par l’intéressé. La traduction garde l’image hébraïque.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: Cette expression idiomatique hébraïque renvoie au jugement que la personne porte elle-même. « Propres » explicite naturellement en français la valeur du suffixe possessif et l’autoévaluation.
- source_word: וְשֹׁמֵעַ
  choice: mais celui qui écoute
  rationale: Le waw introduit ici l’antithèse entre l’insensé et le sage; « mais » rend clairement ce contraste. Le participe décrit de manière générale celui qui se caractérise par son écoute.
- source_word: לְעֵצָה
  choice: les conseils
  rationale: Le singulier hébreu peut désigner le conseil au sens collectif ou abstrait. Le pluriel français est idiomatique et évoque les avis reçus sans préciser indûment leur provenance.
- source_word: חָכָם
  choice: est sage
  rationale: 'L’adjectif prédicatif conclut directement l’antithèse : écouter les conseils caractérise la personne sage.'
theological_decisions:
- issue: Formes masculines singulières employées de façon générique
  choice: « l’insensé… ses propres yeux » et « celui qui… »
  alternative: « une personne insensée… à ses propres yeux » et « quiconque… »
  rationale: L’hébreu présente deux figures représentatives au masculin singulier. Le français masculin singulier conserve cette forme proverbiale sans limiter explicitement l’enseignement aux hommes.
- issue: Valeur de יָשָׁר dans l’autoévaluation de l’insensé
  choice: « est droite à ses propres yeux »
  alternative: « lui paraît juste »
  rationale: La formulation retenue préserve à la fois l’affirmation concise de l’hébreu et son idiome visuel, sans décider si le texte décrit seulement une impression subjective ou un jugement revendiqué.
translation_notes:
  register: Proverbe bref, antithétique et mémorable. Le registre est moderne et digne; « voie » et « insensé » maintiennent la tonalité traditionnelle de la littérature de sagesse tout en restant compréhensibles.
