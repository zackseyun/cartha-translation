source:
  edition: WLC
  text: דְּאָגָ֣ה בְ/לֶב אִ֣ישׁ יַשְׁחֶ֑/נָּה וְ/דָבָ֖ר ט֣וֹב יְשַׂמְּחֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: fr
  text: L’inquiétude dans le cœur d’un homme[b] l’abat[a], mais une bonne parole le réjouit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fait ployer ». Le verbe hébreu évoque le fait d’être abaissé ou courbé.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « homme » est ici un singulier représentatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: l’inquiétude
  rationale: Le nom désigne un souci anxieux. « Inquiétude » est naturel en français moderne et exprime cet état intérieur sans ajouter une nuance clinique trop précise.
- source_word: בְלֶב אִישׁ
  choice: dans le cœur d’un homme
  rationale: Cette traduction garde l’image hébraïque du cœur comme siège de la vie intérieure et le singulier masculin représentatif אִישׁ.
- source_word: יַשְׁחֶנָּה
  choice: l’abat
  rationale: La forme causative exprime le fait d’abaisser ou de courber. « L’abat » restitue clairement en français l’effet intérieur de l’inquiétude, tout en laissant la variante imagée en note.
- source_word: וְדָבָר טוֹב
  choice: mais une bonne parole
  rationale: דָבָר peut désigner une parole, un propos ou un message. « Bonne parole » reste volontairement large, tandis que « mais » rend l’opposition du parallélisme.
- source_word: יְשַׂמְּחֶנָּה
  choice: le réjouit
  rationale: 'Le piel de שׂמח a un sens causatif : rendre joyeux. « Le réjouit » est concis, naturel et fait écho à « l’abat ».'
theological_decisions: []
translation_notes:
  register: Français moderne, simple et proverbial. Le parallélisme antithétique est conservé, ainsi que l’image du cœur comme personne intérieure. Les pronoms français renvoient naturellement à l’homme dont le cœur est atteint, sans tenter de reproduire mécaniquement les suffixes féminins hébreux, dont le référent grammatical est difficile.
