  text: לֹא יַחֲרֹ֣ךְ רְמִיָּ֣ה צֵיד֑/וֹ וְ/הוֹן אָדָ֖ם יָקָ֣ר חָרֽוּץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: fr
  text: 'Le paresseux ne fait pas rôtir son gibier[a],

    mais le bien précieux de l’homme[b], c’est l’assiduité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne capture pas sa proie », si le verbe est compris plus largement au sens d’obtenir ou de préparer le produit de la chasse, plutôt que précisément de le faire rôtir.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici une formulation masculine proverbiale pour parler d’une personne en général.
    reason: cultural_note
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: fait rôtir
  rationale: Le verbe חרך évoque concrètement l’action de brûler ou de rôtir au feu. Avec « son gibier », « fait rôtir » rend naturellement l’image d’une personne qui ne tire pas parti de ce qu’elle a obtenu, tout en signalant en note l’interprétation plus large.
- source_word: רְמִיָּה
  choice: le paresseux
  rationale: Dans les Proverbes, le terme peut désigner la nonchalance ou la négligence plutôt que la tromperie au sens strict. « Le paresseux » forme un contraste clair avec חָרוּץ.
- source_word: צֵידוֹ
  choice: son gibier
  rationale: צֵיד désigne le produit de la chasse, le gibier ou la proie. « Son gibier » convient particulièrement à l’image de la cuisson.
- source_word: הוֹן
  choice: richesse
  rationale: הוֹן désigne couramment la richesse ou les biens. Le singulier français conserve la formulation sentencieuse.
- source_word: אָדָם
  choice: pour l’homme
  rationale: אָדָם renvoie ici à l’être humain dans une formulation proverbiale au masculin singulier. La traduction conserve cette forme tout en en précisant la portée générale en note.
- source_word: יָקָר
  choice: précieuse
  rationale: L’adjectif exprime la grande valeur ou le caractère précieux d’une chose.
- source_word: חָרוּץ
  choice: l’assiduité
  rationale: Le mot peut désigner la personne diligente ou la qualité de diligence. Le rendre par « l’assiduité » produit une phrase française naturelle et respecte le contraste avec la paresse, sans masquer la concision de l’hébreu.
theological_decisions:
- issue: Portée de אָדָם dans ce proverbe de sagesse
  choice: pour l’homme
  alternative: pour l’être humain ; pour chacun
  rationale: Aucun enjeu doctrinal particulier n’est en cause. La formulation masculine proverbiale est conservée, avec une note indiquant clairement sa portée générale.
- issue: Construction elliptique de la seconde proposition
  choice: l’assiduité est pour l’homme une richesse précieuse
  alternative: le diligent possède une richesse précieuse
  rationale: L’hébreu juxtapose de manière condensée הוֹן, אָדָם, יָקָר et חָרוּץ. La traduction retient l’analyse abstraite de חָרוּץ comme « assiduité », conforme au contraste avec רְמִיָּה, sans transformer la maxime en promesse matérielle explicite.
translation_notes:
  register: Français international moderne, sobre et sentencieux. « Assiduité » est préféré à « diligence », qui peut évoquer en français contemporain la rapidité ou un ancien véhicule, tandis que « paresseux », « gibier » et « richesse précieuse » restent immédiatement compréhensibles.
