  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: fr
  text: Les paroles des méchants guettent pour verser le sang[a], mais la bouche des hommes droits les délivre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement : « sont une embuscade pour le sang ». L’expression hébraïque présente les paroles des méchants comme un guet meurtrier.'
    reason: lexical_alternative
  - marker: b
    text: '« Les » désigne de manière générale les personnes menacées par cette violence. On comprend aussi parfois : « la bouche des hommes droits les délivre eux-mêmes », ou simplement : « délivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Le pluriel construit désigne ici les paroles prononcées; « les paroles de » est naturel et conserve le parallélisme avec « la bouche ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé désigne des personnes moralement mauvaises et forme un contraste net avec « les hommes droits ».
- source_word: אֱרָב דָּם
  choice: sont une embuscade meurtrière
  rationale: Cette formulation préserve l’image de l’embuscade tout en exprimant naturellement en français la visée sanglante indiquée par דָּם.
- source_word: וּפִי
  choice: mais la bouche de
  rationale: « Mais » rend le contraste entre les deux membres; « bouche » conserve l’image et le parallélisme hébreux.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: L’expression désigne les personnes moralement droites; l’ajout de « hommes » au sens générique permet un français courant et évite l’ambiguïté nominale de « les droits ».
- source_word: יַצִּילֵם
  choice: les délivre
  rationale: Le hiphil de נצל signifie délivrer ou sauver. Le pronom pluriel reste explicite sans identifier de manière indue son référent.
theological_decisions:
- issue: Référent du suffixe ם dans יַצִּילֵם
  choice: les délivre
  alternative: se délivrent eux-mêmes / délivre
  rationale: La morphologie comporte un objet masculin pluriel, mais son antécédent exact n’est pas exprimé. Le texte principal conserve donc « les », tandis que la note signale la lecture réflexive possible sans la privilégier.
translation_notes:
  register: Français international moderne, concis et proverbial. Le registre reste digne; l’image hébraïque de l’embuscade et celle de la bouche sont conservées, tandis que les ambiguïtés lexicales et pronominales sont signalées en notes.
