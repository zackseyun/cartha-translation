source:
  edition: WLC
  text: אֱוִ֗יל בַּ֭/יּוֹם יִוָּדַ֣ע כַּעְס֑/וֹ וְ/כֹסֶ֖ה קָל֣וֹן עָרֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: fr
  text: La colère de l’insensé se fait connaître aussitôt[a], mais l’homme avisé dissimule l’affront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se fait connaître le jour même » ; littéralement « dans le jour ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cache la honte » ou « dissimule le déshonneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Dans la littérature de sagesse, le terme désigne une personne moralement et pratiquement dépourvue de sagesse, et non simplement peu intelligente.
- source_word: בַּיּוֹם
  choice: aussitôt
  rationale: Littéralement « dans le jour » ; dans ce contexte proverbial, l’expression indique vraisemblablement que la colère se manifeste sans délai. La note conserve la lecture plus littérale.
- source_word: יִוָּדַע
  choice: se fait connaître
  rationale: Le nifal exprime ici le fait de devenir connu ou manifeste ; cette formulation française préserve cette nuance.
- source_word: כַּעְסוֹ
  choice: sa colère
  rationale: « Colère » rend clairement le sens courant du nom dans ce contraste entre réaction impulsive et retenue.
- source_word: וְכֹסֶה
  choice: mais ... dissimule
  rationale: Le participe signifie couvrir ou cacher. « Dissimule » est naturel avec « affront », tandis que la conjonction prend une valeur adversative dans le parallélisme.
- source_word: קָלוֹן
  choice: l’affront
  rationale: Le mot peut désigner la honte, le déshonneur ou une offense humiliante. Dans ce contexte, « affront » exprime naturellement ce que l’homme avisé choisit de ne pas exposer ou relever, sans exclure les autres nuances signalées en note.
- source_word: עָרוּם
  choice: l’homme avisé
  rationale: 'Dans les Proverbes, l’adjectif a généralement un sens positif : une personne prudente, perspicace et avisée. Le masculin singulier représentatif de l’hébreu est conservé.'
