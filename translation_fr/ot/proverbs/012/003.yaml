id: PRO.12.3
reference: Proverbs 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: fr
  text: 'L’être humain ne s’affermit pas par la méchanceté,

    mais la racine des justes ne sera pas ébranlée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִכּוֹן
  choice: s’affermit
  rationale: Le nifal de כון exprime le fait d’être établi ou rendu ferme. Le présent convient à la portée générale du proverbe; la tournure pronominale française rend naturellement l’état acquis sans suggérer que la personne s’affermit elle-même.
- source_word: אָדָם
  choice: l’être humain
  rationale: Ici, le singulier générique désigne tout individu humain. « L’être humain » conserve le singulier et la portée universelle sans donner au français moderne un sens exclusivement masculin.
- source_word: בְּרֶשַׁע
  choice: par la méchanceté
  rationale: 'La préposition ב est comprise comme indiquant le moyen: la méchanceté ne procure aucune stabilité durable.'
- source_word: שֹׁרֶשׁ
  choice: la racine
  rationale: La métaphore concrète est conservée; elle évoque l’enracinement, la vie et la stabilité.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif pluriel substantivé désigne ceux qui sont justes. « Les justes » est une désignation biblique naturelle et concise en français.
- source_word: בַּל
  choice: ne… pas
  rationale: Cette négation poétique renforce le démenti; la négation française simple suffit ici sans surtraduire.
- source_word: יִמּוֹט
  choice: ne sera pas ébranlée
  rationale: Le verbe מוט décrit ce qui chancelle, bouge ou perd sa stabilité. « Ébranlée » convient à l’image de la racine ferme et durable.
theological_decisions:
- issue: Portée générique de אָדָם dans le discours proverbial
  choice: « L’être humain » comme singulier représentatif de toute personne
  alternative: « Un homme »
  rationale: Le contexte formule une vérité générale sur la stabilité morale de tout être humain. En français moderne international, « l’être humain » exprime clairement cette portée tout en conservant le singulier hébreu.
- issue: Rapport entre justice et stabilité
  choice: Conserver la métaphore de la racine des justes qui ne sera pas ébranlée
  alternative: Expliciter comme une promesse de sécurité absolue ou matérielle
  rationale: Le texte affirme une stabilité durable par une image poétique, sans en préciser toutes les modalités. La traduction n’ajoute donc aucune définition doctrinale de cette stabilité.
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme antithétique est conservé, de même que le passage du singulier générique (« l’être humain ») au pluriel collectif (« les justes »). Aucun marqueur de note n’est nécessaire.
