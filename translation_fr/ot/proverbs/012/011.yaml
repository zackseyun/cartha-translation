source:
  edition: WLC
  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֖ף רֵיקִ֣ים חֲסַר לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: fr
  text: Qui cultive sa terre aura du pain à satiété, mais qui poursuit des choses vaines[a] manque de bon sens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens sans valeur » ; l’expression hébraïque « les vides » peut désigner des personnes ou des choses.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: cultive
  rationale: Dans ce contexte agricole, le participe désigne celui qui travaille la terre. « Cultive » est naturel en français et précise utilement la nature du travail.
- source_word: אַדְמָתוֹ
  choice: sa terre
  rationale: אֲדָמָה désigne le sol ou la terre cultivable. « Sa terre » convient au contexte agricole et reste idiomatique.
- source_word: יִשְׂבַּע לָחֶם
  choice: aura du pain à satiété
  rationale: L’expression signifie littéralement « sera rassasié de pain ». Cette formulation française préserve l’image concrète du pain ainsi que l’idée d’une provision suffisante et abondante.
- source_word: וּמְרַדֵּף
  choice: mais qui poursuit
  rationale: La conjonction introduit ici le contraste entre le travail productif et une poursuite futile. « Poursuit » conserve le caractère durable d’une orientation de vie.
- source_word: רֵיקִים
  choice: des choses vaines
  rationale: Le terme signifie littéralement « des êtres ou objets vides » et peut être compris de manière impersonnelle ou personnelle. « Des choses vaines » exprime naturellement l’idée de poursuites futiles sans effacer l’autre lecture, signalée en note.
- source_word: חֲסַר לֵב
  choice: manque de bon sens
  rationale: L’expression hébraïque signifie littéralement « dépourvu de cœur », le cœur étant ici le siège du discernement. « Manque de bon sens » rend clairement cet idiome sapientiel en français moderne.
