source:
  edition: WLC
  text: ט֣וֹב נִ֭קְלֶה וְ/עֶ֣בֶד ל֑/וֹ מִ֝/מְּתַכַּבֵּ֗ד וַ/חֲסַר לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/009.yaml
  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
translation:
  language: fr
  text: Mieux vaut être peu considéré et avoir un serviteur que faire l’important et manquer de pain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que s’attribuer de l’honneur et ne pas avoir de pain ». Le verbe hébreu peut évoquer le fait de se mettre soi-même en valeur, voire de se donner des airs d’importance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette comparaison proverbiale sans verbe exprimé, טוֹב a le sens idiomatique de « mieux vaut ».
- source_word: נִקְלֶה
  choice: être peu considéré
  rationale: Le participe nifal désigne une personne tenue pour insignifiante ou de faible statut. « Peu considéré » conserve cette nuance sociale sans aller jusqu’à « méprisé ».
- source_word: וְעֶבֶד לוֹ
  choice: et avoir un serviteur
  rationale: La tournure signifie littéralement « et un serviteur à lui ». « Avoir un serviteur » l’exprime naturellement en français, dans un contraste portant sur les moyens réels de la personne.
- source_word: מִמְּתַכַּבֵּד
  choice: que faire l’important
  rationale: Le participe hitpael de כבד présente quelqu’un qui se donne de l’importance ou affiche un statut honorable. « Faire l’important » est naturel et garde la nuance possible d’ostentation ou de prétention.
- source_word: וַחֲסַר לָחֶם
  choice: et manquer de pain
  rationale: La traduction concrète « pain » conserve l’image hébraïque tout en évoquant le manque de nourriture et la pauvreté réelle.
theological_decisions: []
translation_notes:
  register: Français moderne, proverbial et accessible. Le parallélisme oppose une position sociale modeste accompagnée de moyens réels à une importance affichée malgré le dénuement.
