  variant: modern international French
source:
  edition: WLC
  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: fr
  text: Aucun malheur ne frappe le juste[a], mais les méchants sont remplis de mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « malheur » peut aussi désigner le mal, le tort ou l’injustice.
    reason: Signaler l’étendue sémantique de אָוֶן sans imposer dans le texte principal une seule interprétation.
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: ne frappe
  rationale: Le verbe exprime ici ce qui arrive à quelqu’un ou l’atteint. « Frapper » donne en français une tournure naturelle avec « malheur » sans ajouter l’idée d’une action humaine précise.
- source_word: אָוֶן
  choice: malheur
  rationale: Dans ce contexte, le terme peut désigner un mal subi, une calamité ou un tort. « Malheur » convient au contraste avec ce dont les méchants sont remplis, tout en évitant de réduire le mot à la seule faute morale.
- source_word: מָלְאוּ רָע
  choice: sont remplis de mal
  rationale: Cette formulation conserve l’image hébraïque d’être rempli et l’ambiguïté de רָע, qui peut évoquer aussi bien le mal moral que le malheur.
theological_decisions:
- issue: L’affirmation absolue selon laquelle aucun malheur ne frappe le juste
  choice: Conserver la formulation absolue du proverbe
  alternative: Atténuer en disant qu’aucun malheur durable ou véritable ne frappe le juste
  rationale: Le texte hébreu ne contient aucune restriction explicite. La nature proverbiale de l’énoncé ne justifie pas d’insérer une qualification théologique absente du verset.
- issue: Sens moral ou calamiteux de רָע
  choice: Employer le terme général « mal »
  alternative: Préciser « malheur » ou « méchanceté »
  rationale: « Mal » préserve la tension sémantique du terme hébreu entre faute morale et situation funeste.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme et l’image d’être « remplis de mal » sont conservés malgré leur densité, afin de respecter la force et l’ambiguïté de l’hébreu.
