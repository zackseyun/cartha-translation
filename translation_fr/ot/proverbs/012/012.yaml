id: PRO.12.12
reference: Proverbs 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָמַ֣ד רָ֭שָׁע מְצ֣וֹד רָעִ֑ים וְ/שֹׁ֖רֶשׁ צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: fr
  text: Le méchant désire le butin des malfaiteurs[a], mais la racine des justes porte du fruit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le filet des malfaiteurs » ou « la proie des malfaiteurs ». Le sens du nom hébreu est incertain : il peut désigner un filet, un piège, une proie ou un butin.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la racine des justes donne ». « Porte du fruit » explicite le sens végétal probablement sous-entendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: désire
  rationale: Le verbe exprime un désir intense. « Désire » en conserve l’étendue lexicale sans préciser davantage la nature du désir; le contexte lui donne déjà une valeur négative.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé singulier désigne ici de manière générique celui qui agit mal. « Le méchant » est naturel dans le style proverbial français.
- source_word: מְצוֹד
  choice: le butin
  rationale: Le nom hébreu est difficile et peut évoquer ce qui est capturé, un filet ou un piège. « Butin » désigne naturellement ce que les malfaiteurs obtiennent ou s’emparent, tout en maintenant le contraste avec la fécondité des justes.
- source_word: רָעִים
  choice: des malfaiteurs
  rationale: L’adjectif pluriel substantivé désigne ceux qui font le mal. « Malfaiteurs » est idiomatique et évite la lourdeur de « hommes mauvais ».
- source_word: שֹׁרֶשׁ
  choice: la racine
  rationale: L’image végétale du texte doit être conservée; elle prépare le sens productif implicite du verbe suivant.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif pluriel substantivé désigne collectivement ceux qui vivent avec droiture. « Les justes » est la formulation française habituelle et naturelle.
- source_word: יִתֵּן
  choice: porte du fruit
  rationale: Le verbe signifie littéralement « donne ». Avec « racine » pour sujet, « porte du fruit » explicite sobrement le sens végétal probablement sous-entendu et produit une phrase française complète.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme entre le gain recherché par le méchant et la fécondité durable des justes est conservé, sans résoudre l’incertitude du terme מְצוֹד autrement que par une note.
