  source_fidelity: « Le méchant désire le butin des malfaiteurs » rend fidèlement le désir intense de חָמַד et les adjectifs substantivés רָשָׁע / רָעִים. Le sens de מְצוֹד demeure lexicalement disputé; « butin » est une option contextuellement défendable, et la note conserve explicitement les possibilités « filet », « piège » et « proie ». « La racine des justes porte du fruit » exprime de façon idiomatique la productivité végétale probablement impliquée par יִתֵּן (« donne »), sans effacer le sens littéral, qui est donné en note.
