  terminology: Les termes éthiques restent génériques et non confessionnels. « Méchant », « malfaiteurs » et « justes » conservent le contraste du texte sans ajout doctrinal. Les deux notes sont bien ancrées et correspondent aux deux décisions lexicales/interprétatives concernées.
