id: PRO.12.26
reference: Proverbs 12:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָתֵ֣ר מֵ/רֵעֵ֣/הוּ צַדִּ֑יק וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תַּתְעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: fr
  text: Le juste guide son prochain[a][b], mais la voie des méchants les égare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Le juste est supérieur à son prochain. » Le mot hébreu traduit ici par « guide » est difficile, et cette interprétation traditionnelle reste possible.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « prochain » peut aussi signifier « ami » ou « compagnon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָתֵר
  choice: guide
  rationale: La forme hébraïque est notoirement difficile. Dans le parallélisme antithétique avec la voie des méchants qui égare, « guide » exprime naturellement l’idée probable d’une influence qui oriente dans la bonne direction, sans masquer dans la note l’autre analyse comparative possible.
- source_word: מֵרֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner un prochain, un ami ou un compagnon. « Son prochain » conserve ici la portée sociale assez large du terme; le préfixe מ est compris dans la construction difficile avec יָתֵר.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne de façon générique la personne juste. « Le juste » est concis, naturel et traditionnel en français sapientiel.
- source_word: וְדֶרֶךְ
  choice: mais la voie
  rationale: Bien que ו soit normalement coordinatif, « mais » rend l’opposition nette entre le juste et les méchants dans ce parallélisme antithétique.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Ce substantif pluriel désigne couramment, dans la littérature de sagesse, ceux dont la conduite est mauvaise. « Les méchants » est direct et idiomatique.
- source_word: תַּתְעֵם
  choice: les égare
  rationale: Le hifil de תעה avec suffixe masculin pluriel signifie « les fait errer » ou « les égare ». La formulation française conserve le causatif et l’ambiguïté relative du référent du pronom.
theological_decisions:
- issue: Rapport exact entre le juste et son prochain dans le premier membre
  choice: Le juste guide son prochain
  alternative: Le juste est supérieur à son prochain
  rationale: Le texte hébreu permet difficilement de trancher. La lecture active s’accorde mieux avec le contraste entre bonne orientation et égarement, tandis que la lecture comparative traditionnelle est explicitement conservée en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Le juste » et « la voie des méchants » conservent le registre sapientiel biblique sans archaïsme. Le pronom « les » maintient la formulation concise et l’ambiguïté du suffixe hébreu.
