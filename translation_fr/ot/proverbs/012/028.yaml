  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: fr
  text: Sur le sentier de la justice se trouve la vie ; son chemin ne mène pas à la mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible de la seconde partie : « et son sentier est l’immortalité ». L’hébreu est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹרַח
  choice: Sur le sentier de
  rationale: אֹרַח désigne un sentier, un chemin ou une conduite. « Sur le sentier de » restitue naturellement en français la métaphore d’un parcours moral et la préposition בְּ.
- source_word: צְדָקָה
  choice: la justice
  rationale: צְדָקָה couvre la justice et la droiture. Dans ce contexte sapiential, « justice » est clair, digne et exprime une conduite conforme à ce qui est juste.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que de forme plurielle, חַיִּים désigne idiomatiquement la vie; le singulier français convient.
- source_word: וְדֶרֶךְ נְתִיבָה
  choice: son chemin
  rationale: La formulation hébraïque est très condensée et associe plusieurs termes de voie. « Son chemin » reprend le sentier de la justice sans produire en français une juxtaposition obscure.
- source_word: אַל־מָוֶת
  choice: ne mène pas à la mort
  rationale: La proposition difficile est comprise comme une négation de la mort en tant qu’issue du chemin. Cette formulation française explicite seulement la relation directionnelle suggérée par la métaphore, tout en maintenant l’opposition entre vie et mort.
theological_decisions:
- issue: Sens de la proposition difficile וְדֶרֶךְ נְתִיבָה אַל־מָוֶת
  choice: Le chemin de la justice ne mène pas à la mort.
  alternative: « et son sentier est l’immortalité »
  rationale: Le texte massorétique est condensé et son analyse demeure discutée. La lecture principale conserve la négation אַל et l’antithèse entre vie et mort, sans corriger silencieusement l’hébreu. La lecture traditionnelle « immortalité » est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé avec « sentier » et « chemin »; la formulation évite un jargon théologique tout en gardant l’opposition sapientiale entre vie et mort.
