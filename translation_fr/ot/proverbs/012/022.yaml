  variant: modern international French
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: fr
  text: Les lèvres mensongères sont une abomination pour Yahweh, mais il prend plaisir à ceux qui agissent avec fidélité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui pratiquent la fidélité », « qui agissent selon la vérité » ou « qui sont dignes de confiance ».
    reason: Alternative lexicale pour אֱמוּנָה, qui peut évoquer la fidélité, la véracité ou la fiabilité.
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: sont en abomination
  rationale: Le nom exprime ce qui est profondément odieux ou détestable. La tournure biblique française « être en abomination à » en conserve la forte portée morale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: les lèvres mensongères
  rationale: Cette formulation naturelle conserve la métaphore concrète de l’hébreu, littéralement « lèvres de mensonge ».
- source_word: וְעֹשֵׂי אֱמוּנָה
  choice: mais … ceux qui agissent avec fidélité
  rationale: La conjonction reçoit une valeur contrastive naturelle dans ce proverbe antithétique. אֱמוּנָה peut désigner la fidélité, la véracité ou la fiabilité; « agir avec fidélité » maintient cette amplitude sans réduire le sens à la seule parole vraie.
- source_word: רְצוֹנוֹ
  choice: il prend plaisir à
  rationale: Cette tournure française idiomatique exprime le plaisir ou l’approbation de Yahweh et forme un contraste net avec « en abomination ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Portée de אֱמוּנָה
  choice: fidélité manifestée dans la conduite
  alternative: vérité; fiabilité; loyauté
  rationale: Le mot possède ici une gamme sémantique réelle. Le texte principal retient « fidélité », tandis que la note signale les autres nuances plausibles au lieu de trancher excessivement.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore des « lèvres » et la vigueur morale d’« abomination » sont conservées; la seconde proposition est légèrement restructurée pour être idiomatique en français.
