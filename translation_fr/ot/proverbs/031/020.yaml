translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme hébreu est conservé par « la paume / les mains » et « pauvre / indigent ». Aucune note n’est nécessaire, car les choix retenus rendent clairement le sens tout en préservant l’image poétique.
