  text: כַּ֭פָּ/הּ פָּרְשָׂ֣ה לֶ/עָנִ֑י וְ֝/יָדֶ֗י/הָ שִׁלְּחָ֥ה לָֽ/אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/020.yaml
  text: She opens her palm to the poor[b][a], and extends her hands to the needy.
translation:
  language: fr
  text: Elle ouvre la paume au pauvre et tend les mains à l’indigent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפָּהּ
  choice: la paume
  rationale: כַּף désigne souvent la paume ou le creux de la main. « La paume » conserve l’image concrète d’une main ouverte et généreuse.
- source_word: פָּרְשָׂה
  choice: ouvre
  rationale: פרשׂ signifie déployer, étendre. Avec « la paume », « ouvre » est naturel en français et rend bien le geste de générosité, sans en expliciter davantage la portée.
- source_word: לֶעָנִי
  choice: au pauvre
  rationale: עָנִי peut désigner une personne pauvre, affligée ou vulnérable. Ici, le contexte de l’aide concrète favorise le sens socioéconomique.
- source_word: יָדֶיהָ
  choice: les mains
  rationale: Le duel/pluriel renvoie naturellement aux deux mains; « les mains » préserve aussi le parallélisme avec « la paume ».
- source_word: שִׁלְּחָה
  choice: tend
  rationale: Au piel, שלח peut exprimer l’action d’envoyer ou d’étendre. Avec « mains » et un bénéficiaire introduit par ל, « tend » rend sobrement le geste d’aide.
- source_word: לָאֶבְיוֹן
  choice: à l’indigent
  rationale: אֶבְיוֹן désigne celui qui est dans le besoin. « Indigent » distingue ce terme de עָנִי tout en conservant le parallélisme poétique.
