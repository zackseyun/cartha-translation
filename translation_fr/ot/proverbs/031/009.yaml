source:
  edition: WLC
  text: פְּתַח פִּ֥י/ךָ שְׁפָט צֶ֑דֶק וְ֝/דִ֗ין עָנִ֥י וְ/אֶבְיֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
translation:
  language: fr
  text: Ouvre la bouche[a], juge avec justice et défends la cause du pauvre et du démuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prends la parole, juge avec équité et défends la cause du pauvre et du démuni. »'
    reason: Alternative idiomatique pour l’expression « ouvre la bouche », avec une autre formulation possible de צֶדֶק dans ce contexte judiciaire.
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Ouvre la bouche
  rationale: L’impératif et son complément sont rendus directement, tout en conservant l’image hébraïque. En français, l’expression appelle ici clairement à prendre la parole.
- source_word: שְׁפָט צֶדֶק
  choice: juge avec justice
  rationale: Cette formulation naturelle conserve le sens judiciaire de שׁפט et la valeur adverbiale de צֶדֶק, sans réduire ce dernier à la seule impartialité.
- source_word: וְדִין
  choice: défends la cause de
  rationale: Le verbe דין peut désigner l’action de juger, de plaider ou de soutenir une cause. Dans ce parallélisme judiciaire, « défends la cause de » exprime naturellement l’intervention en faveur des personnes vulnérables sans effacer la nuance juridique.
- source_word: עָנִי
  choice: le pauvre
  rationale: Dans ce contexte de justice sociale et judiciaire, le terme désigne naturellement la personne pauvre, bien qu’il puisse aussi évoquer l’affligé.
- source_word: אֶבְיוֹן
  choice: le démuni
  rationale: « Démuni » restitue la situation de besoin marquée par אֶבְיוֹן et permet de distinguer les deux termes hébreux associés.
theological_decisions: []
