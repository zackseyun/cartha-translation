  text: הָ֭יְתָה כָּ/אֳנִיּ֣וֹת סוֹחֵ֑ר מִ֝/מֶּרְחָ֗ק תָּבִ֥יא לַחְמָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/014.yaml
  text: She is like merchant ships[a]; from far away she brings her food.
translation:
  language: fr
  text: Elle est comme les navires marchands ; de loin, elle apporte sa nourriture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son pain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: Elle est
  rationale: Le qal accompli à la 3e personne du féminin singulier décrit ici, dans un poème de sagesse, une conduite caractéristique ; le présent de vérité générale est naturel en français.
- source_word: כָּאֳנִיּוֹת סוֹחֵר
  choice: comme les navires marchands
  rationale: La préposition כְּ marque la comparaison, אֳנִיּוֹת signifie « navires » et סוֹחֵר précise leur fonction commerciale. L’expression française rend naturellement l’ensemble.
- source_word: מִמֶּרְחָק
  choice: de loin
  rationale: La préposition מִן associée à מֶרְחָק indique la provenance depuis un lieu éloigné. « De loin » est concis, idiomatique et fidèle.
- source_word: תָּבִיא
  choice: elle rapporte
  rationale: Le hiphil de בוא signifie « faire venir, apporter ». « Rapporte » souligne ici l’acheminement des provisions jusque chez elle sans ajouter d’idée étrangère au contexte.
- source_word: לַחְמָהּ
  choice: sa nourriture
  rationale: לֶחֶם désigne littéralement le pain, mais peut aussi prendre le sens plus large de nourriture ou de vivres. Le contexte de l’approvisionnement du foyer favorise « nourriture », tandis que le sens littéral est conservé en note.
