source:
  edition: WLC
  text: דָּ֭רְשָׁה צֶ֣מֶר וּ/פִשְׁתִּ֑ים וַ֝/תַּ֗עַשׂ בְּ/חֵ֣פֶץ כַּפֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/013.yaml
  text: She seeks wool and flax[a], and works with willing hands.
translation:
  language: fr
  text: 'Elle recherche de la laine et du lin,


    et travaille volontiers de ses mains.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et travaille de ses mains avec plaisir » ou « et travaille de ses mains avec empressement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרְשָׁה
  choice: recherche
  rationale: Le verbe exprime une démarche active pour chercher ou se procurer les matières nécessaires, sans préciser davantage le mode d’acquisition.
- source_word: צֶמֶר
  choice: laine
  rationale: Le nom désigne directement la laine, matière textile.
- source_word: וּפִשְׁתִּים
  choice: lin
  rationale: Le terme désigne le lin comme plante ou matière première; « lin » est donc préférable à « toile de lin ».
- source_word: וַתַּעַשׂ
  choice: travaille
  rationale: Dans ce contexte de production textile, « travaille » rend naturellement le sens large de faire ou fabriquer.
- source_word: בְּחֵפֶץ
  choice: de bon gré
  rationale: Cette expression française traduit la disposition volontaire et positive évoquée par חֵפֶץ, tout en laissant à la note les nuances de plaisir et d’empressement.
- source_word: כַּפֶּיהָ
  choice: de ses mains
  rationale: Bien que כף puisse désigner la paume, « mains » est l’équivalent idiomatique naturel lorsqu’il s’agit d’un travail manuel.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme poétique est conservé sur deux lignes. « De bon gré » exprime la volonté sans éliminer les autres nuances possibles de חֵפֶץ, signalées en note.
