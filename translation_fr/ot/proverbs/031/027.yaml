source:
  edition: WLC
  text: צ֭וֹפִיָּה הֲלִיכ֣וֹת בֵּיתָ֑/הּ וְ/לֶ֥חֶם עַ֝צְל֗וּת לֹ֣א תֹאכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/027.yaml
  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
translation:
  language: fr
  text: Elle veille sur les activités de sa maisonnée[a] et ne mange pas le pain de la paresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elle veille sur les allées et venues de sa maison ». L’hébreu dit littéralement « les allées et venues de sa maison », expression qui peut désigner son fonctionnement ou ses affaires.
    reason: lexical_alternative
  - marker: b
    text: « Le pain de la paresse » évoque le fait de vivre dans l’oisiveté ou de profiter d’une existence improductive.
    reason: cultural_note
lexical_decisions:
- source_word: צוֹפִיָּה
  choice: elle veille sur
  rationale: Le participe qal féminin singulier exprime une vigilance attentive et habituelle. « Veille sur » rend naturellement cette supervision continue.
- source_word: הֲלִיכוֹת
  choice: la marche
  rationale: Le pluriel hébreu désigne littéralement les allées et venues, et par extension la conduite ou le fonctionnement. « La marche » conserve l’image tout en évoquant la manière dont la maisonnée fonctionne.
- source_word: בֵּיתָהּ
  choice: sa maisonnée
  rationale: בַּיִת peut désigner la maison ou les personnes qui la composent. Ici, « maisonnée » convient à la supervision de la vie domestique et maintient la dimension collective.
- source_word: לֶחֶם
  choice: le pain
  rationale: Le sens concret de « pain » porte ici une métaphore de ce dont on se nourrit ou vit; il convient donc de préserver cette image.
- source_word: עַצְלוּת
  choice: la paresse
  rationale: Le nom désigne l'indolence ou la paresse. « Paresse » est moderne, clair et conserve la portée morale du terme.
- source_word: לֹא תֹאכֵל
  choice: ne mange pas
  rationale: L’imparfait exprime ici un comportement caractéristique plutôt qu’un simple futur. Le présent français rend cette valeur habituelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image hébraïque de la marche et la métaphore du pain, avec des notes pour en expliciter la portée.
