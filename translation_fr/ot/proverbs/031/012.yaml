  text: גְּמָלַ֣תְ/הוּ ט֣וֹב וְ/לֹא רָ֑ע כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/012.yaml
  text: She does him good[a], and not harm, all the days of her life.
translation:
  language: fr
  text: Elle lui fait du bien[a], et non du mal, tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elle lui rend le bien et non le mal. » Le verbe hébreu peut évoquer la manière de traiter quelqu’un ou le fait de lui rendre ce qui lui revient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  choice: Elle lui fait
  rationale: Le verbe גמל peut exprimer l’idée de traiter quelqu’un d’une certaine manière, de lui rendre ou de lui accorder quelque chose. Avec « du bien » comme complément, « elle lui fait du bien » est naturel en français et convient au contexte relationnel sans imposer l’idée précise de rétribution.
- source_word: טוֹב
  choice: du bien
  rationale: טוֹב est employé substantivement. « Du bien » rend directement et idiomatiquement le bénéfice qu’elle apporte à son mari.
- source_word: וְלֹא רָע
  choice: et non du mal
  rationale: רָע peut désigner le mal moral, le malheur ou le tort. Ici, « du mal » forme en français une antithèse naturelle avec « du bien » et conserve la portée assez large de l’hébreu.
- source_word: כֹּל יְמֵי
  choice: tous les jours de
  rationale: Cette formulation préserve l’expression temporelle distributive de l’hébreu ainsi que sa cadence poétique.
- source_word: חַיֶּיהָ
  choice: sa vie
  rationale: Bien que le nom hébreu ait une forme plurielle, il désigne couramment la vie ou la durée de l’existence d’une personne; le singulier est donc idiomatique en français.
