  text: She girds her waist with strength and makes her arms strong[a].
translation:
  language: fr
  text: Elle se ceint les reins de force et affermit ses bras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elle ceint sa taille de force et rend ses bras vigoureux. » L’hébreu conserve une image corporelle concrète de préparation et de vigueur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגְרָה
  choice: ceint
  rationale: Le verbe évoque concrètement le fait de ceindre ou de serrer autour de la taille. « Ceint » conserve cette image de préparation énergique dans un français digne et intelligible.
- source_word: בְעֹז
  choice: de force
  rationale: עֹז désigne la force ou la vigueur. Avec « ceindre », « de force » rend naturellement l’idée dont elle s’équipe.
- source_word: מָתְנֶיהָ
  choice: sa taille
  rationale: Le terme désigne la région des reins ou de la taille. « Sa taille » reste concret et naturel en français moderne, sans l’éventuelle connotation archaïque de « ses reins ».
- source_word: וַתְּאַמֵּץ
  choice: affermit
  rationale: La forme intensive exprime l’action de rendre fort ou ferme. « Affermit » restitue cette valeur tout en évitant une répétition maladroite de « force ».
- source_word: זְרֹעוֹתֶיהָ
  choice: ses bras
  rationale: Le nom pluriel désigne directement les bras et souligne ici sa vigueur et son aptitude au travail.
