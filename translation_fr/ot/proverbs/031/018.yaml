  text: טָ֭עֲמָה כִּי ט֣וֹב סַחְרָ֑/הּ לֹֽא יִכְבֶּ֖ה ב/ליל נֵרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/018.yaml
  text: She perceives that her merchandise is good[b][a]; her lamp does not go out at night.
translation:
  language: fr
  text: Elle constate que son commerce est profitable[a] ; sa lampe ne s’éteint pas pendant la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elle reconnaît par expérience que ses marchandises sont bonnes » ; le verbe traduit par « constate » signifie littéralement « goûte », et « son commerce » peut aussi désigner ses marchandises ou son gain.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָעֲמָה
  choice: elle constate
  rationale: Le verbe signifie littéralement « goûter », mais exprime ici un discernement acquis par l’expérience. « Constate » rend naturellement cette évaluation en français.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’elle constate.
- source_word: טוֹב
  choice: profitable
  rationale: Dans ce contexte commercial, « profitable » exprime la valeur positive ou avantageuse de son activité, sans limiter nécessairement le sens au seul bénéfice financier.
- source_word: סַחְרָהּ
  choice: son commerce
  rationale: Le nom peut désigner les marchandises, le commerce ou le gain. « Son commerce » convient au contexte des activités économiques décrites dans les versets voisins et reste assez large.
- source_word: לֹא יִכְבֶּה
  choice: ne s’éteint pas
  rationale: Expression française idiomatique pour une lampe qui continue de brûler.
- source_word: בַלַּיְלָה
  choice: pendant la nuit
  rationale: Cette formulation temporelle naturelle évoque la durée sans préciser si l’image doit être comprise absolument ou proverbialement.
- source_word: נֵרָהּ
  choice: sa lampe
  rationale: Le terme désigne concrètement une lampe et conserve l’image domestique du texte.
