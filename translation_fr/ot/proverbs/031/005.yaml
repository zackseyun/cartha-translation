  text: פֶּן יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח מְחֻקָּ֑ק וִֽ֝/ישַׁנֶּה דִּ֣ין כָּל בְּנֵי עֹֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/005.yaml
  text: lest he drink and forget what has been decreed[b][a], and pervert the justice due to all the afflicted.
translation:
  language: fr
  text: de peur qu’il boive, oublie ce qui a été décrété[a] et fausse le droit de tous ceux qui sont dans la détresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le décret » ou « ce qui est prescrit ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « les fils de l’affliction », expression désignant les personnes qui souffrent ou qui sont opprimées.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que
  rationale: Introduit avec naturel en français une conséquence redoutée, tout en conservant la force de l’avertissement.
- source_word: יִשְׁתֶּה
  choice: il ne boive
  rationale: Le subjonctif après « de peur que » exprime correctement l’action contre laquelle le texte met en garde.
- source_word: וְיִשְׁכַּח
  choice: n’oublie
  rationale: Coordonne directement la première conséquence de la consommation de boisson.
- source_word: מְחֻקָּק
  choice: ce qui a été décrété
  rationale: Préserve la valeur passive de la forme hébraïque et son ambiguïté entre décret et prescription, sans la réduire à la seule notion de loi.
- source_word: וִישַׁנֶּה
  choice: ne fausse
  rationale: Dans ce contexte judiciaire, le piel de שנה désigne une modification injuste; « fausser » restitue cette portée éthique sans suggérer seulement un changement neutre.
- source_word: דִּין
  choice: le droit
  rationale: Le terme renvoie ici au jugement ou au droit qui doit être rendu; « le droit de » convient au contexte royal et judiciaire.
- source_word: כָּל
  choice: tous
  rationale: Rend directement le quantificateur universel devant un groupe humain pluriel.
- source_word: בְּנֵי עֹנִי
  choice: ceux qui sont dans la détresse
  rationale: Rend en français naturel l’expression idiomatique littérale « fils de l’affliction », qui désigne des personnes éprouvées, misérables ou opprimées.
