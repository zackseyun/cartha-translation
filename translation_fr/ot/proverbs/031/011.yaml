  text: Le cœur de son mari met sa confiance en elle, et il ne manquera pas de gain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח בָּהּ
  choice: met sa confiance en elle
  rationale: Rend explicitement et naturellement l’idée de confiance exprimée par le verbe hébreu avec son complément.
- source_word: לֵב בַּעְלָהּ
  choice: Le cœur de son mari
  rationale: Conserve l’image anthropologique hébraïque du cœur comme siège de la confiance et rend בַּעַל selon son sens contextuel de « mari ».
- source_word: שָׁלָל
  choice: gain
  rationale: Le terme désigne littéralement le butin ou la prise; dans ce portrait domestique, « gain » transmet le bénéfice matériel sans introduire artificiellement un contexte guerrier.
- source_word: לֹא יֶחְסָר
  choice: il ne manquera d’aucun
  rationale: Rend la négation et l’idée de ne pas être privé de quelque chose, dans une formulation française idiomatique.
