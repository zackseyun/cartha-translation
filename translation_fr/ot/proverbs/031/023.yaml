source:
  edition: WLC
  text: נוֹדָ֣ע בַּ/שְּׁעָרִ֣ים בַּעְלָ֑/הּ בְּ֝/שִׁבְתּ֗/וֹ עִם זִקְנֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/023.yaml
  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
translation:
  language: fr
  text: Son mari est connu aux portes de la ville[a], lorsqu’il siège parmi les anciens du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les portes de la ville étaient le lieu public où se traitaient les affaires civiles, judiciaires et communautaires.
    reason: cultural_note
lexical_decisions:
- source_word: נוֹדָע
  choice: est connu
  rationale: Le participe nifal de ידע exprime le fait d’être connu ou reconnu. « Est connu » préserve ce sens sans préciser indûment qu’il est respecté, même si le contexte peut suggérer l’estime publique.
- source_word: בַּשְּׁעָרִים
  choice: aux portes de la ville
  rationale: Le pluriel « portes » désigne ici le lieu public où se traitaient les affaires civiques et judiciaires. L’ajout explicatif « de la ville » rend naturellement l’image en français sans remplacer la réalité culturelle.
- source_word: בַּעְלָהּ
  choice: son mari
  rationale: Dans le portrait domestique de cette femme, בעל désigne clairement son mari plutôt qu’un maître ou propriétaire.
- source_word: בְּשִׁבְתּוֹ
  choice: lorsqu’il siège
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. « Siège » convient à sa participation à l’assemblée des anciens et conserve le registre public du contexte.
- source_word: עִם
  choice: parmi
  rationale: Bien que עִם signifie littéralement « avec », « parmi » exprime plus naturellement en français son appartenance au groupe réuni des anciens.
- source_word: זִקְנֵי אָרֶץ
  choice: les anciens du pays
  rationale: Cette formulation conserve le sens littéral de זִקְנֵי אָרֶץ sans réduire « pays/terre » à la seule ville.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Lorsqu’il siège » évoque clairement la participation à un conseil public. Le rendu maintient « est connu », plutôt que d’expliciter « est respecté », afin de préserver l’ouverture sémantique de l’hébreu.
