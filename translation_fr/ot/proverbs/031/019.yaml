  text: יָ֭דֶי/הָ שִׁלְּחָ֣ה בַ/כִּישׁ֑וֹר וְ֝/כַפֶּ֗י/הָ תָּ֣מְכוּ פָֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/019.yaml
  text: She stretches out her hands to the distaff[a], and her palms hold the spindle.
translation:
  language: fr
  text: 'Elle tend les mains vers la quenouille[a],

    et ses paumes tiennent le fuseau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elle met les mains à la quenouille, et ses paumes saisissent le fuseau. »
    reason: Le verbe שׁלח avec la préposition ב et le verbe תמך permettent aussi une formulation qui insiste davantage sur la mise au travail et la prise en main des outils.
lexical_decisions:
- source_word: יָדֶיהָ
  choice: les mains
  rationale: Le duel avec suffixe féminin singulier désigne les deux mains de la femme. En français, « les mains » est naturel après « elle » et évite une répétition possessive inutile.
- source_word: שִׁלְּחָה
  choice: tend
  rationale: Le verbe שׁלח exprime ici un geste volontaire d’extension vers l’outil. « Tend » conserve l’image concrète sans imposer une nuance plus précise que le texte.
- source_word: בַכִּישׁוֹר
  choice: vers la quenouille
  rationale: כִּישׁוֹר désigne vraisemblablement un instrument de filage, traditionnellement distingué de פֶּלֶךְ comme la quenouille du fuseau. « Vers » rend naturellement la direction du geste dans ce contexte.
- source_word: וְכַפֶּיהָ
  choice: et ses paumes
  rationale: כַּף désigne proprement la paume ou le creux de la main. Le choix conserve la précision corporelle et le parallélisme poétique avec « les mains ».
- source_word: תָּמְכוּ
  choice: tiennent
  rationale: תמך peut signifier soutenir, tenir ou saisir. « Tiennent » convient au maniement de l’instrument tout en préservant l’indétermination du geste exact.
- source_word: פָלֶךְ
  choice: le fuseau
  rationale: פֶּלֶךְ désigne un instrument servant à filer, couramment identifié au fuseau. Ce terme forme avec « quenouille » un couple cohérent d’outils textiles.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme du vers hébreu et la distinction entre les deux instruments de filage sont conservés ; « paumes » maintient l’image précise du texte source malgré son caractère légèrement inhabituel en français.
