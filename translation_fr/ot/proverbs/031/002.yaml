  text: What[a], my son? And what, son of my womb? And what, son of my vows?
translation:
  language: fr
  text: Que dire[a], mon fils ? Et que dire, fils de mon ventre ? Et que dire, fils de mes vœux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Quoi, mon fils ? Et quoi, fils de mon ventre ? Et quoi, fils de mes vœux ? » L’hébreu répète l’interrogatif de façon elliptique et rhétorique.'
    reason: alternative lexicale
lexical_decisions:
- source_word: מַה
  choice: Quoi
  rationale: L’interrogatif répété introduit ici une apostrophe elliptique et chargée d’émotion. « Quoi » en conserve la brièveté, l’urgence et l’effet poétique.
- source_word: בְּרִי
  choice: mon fils
  rationale: Le nom בַּר, muni du suffixe de première personne, signifie « mon fils ». Cette formulation conserve le lien filial et le genre masculin du texte source.
- source_word: בַּר
  choice: fils de
  rationale: La répétition de « fils » préserve la structure ternaire et le vocabulaire masculin de l’hébreu.
- source_word: בִּטְנִי
  choice: mes entrailles
  rationale: בֶּטֶן désigne le ventre ou le sein maternel. Dans cette parole d’une mère, « mes entrailles » exprime naturellement en français l’origine maternelle sans réduire le terme à une simple partie du corps.
- source_word: נְדָרָי
  choice: mes vœux
  rationale: נֶדֶר signifie « vœu ». Le pluriel avec suffixe de première personne est rendu directement, sans préciser la nature ni les circonstances de ces vœux.
theological_decisions:
- issue: Portée de la triple apostrophe interrogative
  choice: 'Conserver trois questions abruptes : « Quoi… ? Et quoi… ? Et quoi… ? »'
  alternative: 'Expliciter : « Que te dirai-je… ? »'
  rationale: L’hébreu demeure elliptique et émotionnellement intense. La formulation retenue préserve cette tension sans ajouter un verbe absent du texte.
- issue: Désignation masculine du destinataire
  choice: « mon fils » et « fils de »
  alternative: « mon enfant » et « enfant de »
  rationale: Le texte répète le nom masculin בַּר. Le traduire par « fils » respecte à la fois le genre grammatical et la relation maternelle exprimée.
translation_notes:
  register: Français moderne, digne et poétique. L’expression « mes entrailles » est courante dans le registre biblique et littéraire pour évoquer le sein maternel, tout en restant compréhensible. L’ellipse inhabituelle est volontairement maintenue et expliquée en note.
