source:
  edition: WLC
  text: אֵֽשֶׁת חַ֭יִל מִ֣י יִמְצָ֑א וְ/רָחֹ֖ק מִ/פְּנִינִ֣ים מִכְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/010.yaml
  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
translation:
  language: fr
  text: Une femme de valeur[a], qui peut la trouver ? Sa valeur dépasse de loin celle des joyaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une épouse de valeur » ; le mot hébreu peut désigner une femme en général, mais le contexte familial et conjugal favorise aussi « épouse ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « joyaux » peut aussi désigner des perles, du corail ou, selon la traduction traditionnelle, des rubis ; la nature exacte de l’objet précieux est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: une femme de valeur
  rationale: L’expression désigne une femme caractérisée par la force, la capacité, l’excellence et la valeur morale. « Femme de valeur » conserve la portée large de חַיִל et reste naturelle en français, sans réduire le terme à la seule noblesse de caractère. Le contexte conjugal permet aussi « épouse », signalé en note.
- source_word: מִי יִמְצָא
  choice: qui peut la trouver ?
  rationale: L’imparfait hébreu a ici une valeur rhétorique et souligne la rareté exceptionnelle de cette femme plutôt qu’un simple futur.
- source_word: וְרָחֹק
  choice: dépasse de loin
  rationale: Littéralement lié à l’idée d’éloignement, le terme exprime ici une comparaison de valeur; cette formulation rend clairement la supériorité.
- source_word: פְּנִינִים
  choice: joyaux
  rationale: L’identité précise de ces objets précieux est incertaine. « Joyaux » évite de préciser sans preuve s’il s’agit de perles, de rubis ou de corail.
- source_word: מִכְרָהּ
  choice: sa valeur
  rationale: Le nom désigne le prix ou l’estimation. « Sa valeur » exprime la comparaison sans donner à la phrase une tonalité inutilement marchande.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure conserve le parallélisme proverbial et la question rhétorique. « Femme de valeur » est volontairement large afin de refléter les dimensions de force, de compétence et d’excellence de חַיִל.
