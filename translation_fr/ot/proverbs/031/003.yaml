reference: Proverbs 31:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּתֵּ֣ן לַ/נָּשִׁ֣ים חֵילֶ֑/ךָ וּ֝/דְרָכֶ֗י/ךָ לַֽ/מְח֥וֹת מְלָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/003.yaml
  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
translation:
  language: fr
  text: Ne donne pas ta vigueur[a] aux femmes, ni tes voies à ce qui détruit les rois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « vigueur » peut aussi englober la force, les capacités, les ressources ou les richesses.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est très concis et peut aussi se comprendre : « ni tes chemins à la destruction des rois » ou « ni tes voies à ce qui anéantit les rois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Ne donne pas
  rationale: La particule négative אַל avec l’inaccompli exprime ici une interdiction. « Ne donne pas » conserve naturellement en français la métaphore de נתן sans la renforcer en « ne livre jamais ».
- source_word: לַנָּשִׁים
  choice: aux femmes
  rationale: Le nom hébreu est au pluriel et ne signifie pas précisément « épouses ». La traduction garde la formulation générale du texte sans en faire une condamnation générale des femmes.
- source_word: חֵילֶךָ
  choice: ta vigueur
  rationale: חַיִל peut désigner la force, la capacité ou les ressources. Dans cette exhortation adressée à un roi, « vigueur » évoque la force personnelle et l’énergie sans limiter le sens à la puissance physique, à la virilité ou aux richesses.
- source_word: וּדְרָכֶיךָ
  choice: ni tes voies
  rationale: Après une première interdiction, le ו hébreu se rend naturellement par « ni ». « Tes voies » conserve le pluriel et peut désigner la conduite comme le cours de la vie.
- source_word: לַמְחוֹת
  choice: à ce qui détruit
  rationale: L’infinitif de מחה exprime l’effacement ou l’anéantissement. La construction hébraïque est concise et difficile; cette formulation française conserve le caractère non précisé de l’agent ou de la cause, sans introduire arbitrairement des personnes déterminées.
- source_word: מְלָכִין
  choice: les rois
  rationale: Ce pluriel araméisant désigne clairement des rois et maintient le cadre royal du proverbe.
theological_decisions:
- issue: Portée de l’avertissement concernant les femmes
  choice: Conserver « aux femmes » comme avertissement de sagesse contre la dissipation de la vigueur et des ressources royales.
  alternative: Limiter explicitement l’avertissement aux épouses étrangères, à la polygamie royale ou aux femmes séductrices.
  rationale: Le texte dit simplement « femmes ». Il convient de ne pas préciser davantage l’objet de l’avertissement ni de transformer cette exhortation pratique en affirmation doctrinale sur la nature des femmes.
- issue: Nature de ce qui détruit les rois
  choice: Employer la tournure non personnelle « ce qui détruit les rois ».
  alternative: « celles qui détruisent les rois », « ceux qui détruisent les rois » ou « la destruction des rois ».
  rationale: La syntaxe hébraïque permet une compréhension plus abstraite liée à l’infinitif « détruire/effacer ». La traduction retenue préserve cette indétermination et le parallélisme sans identifier explicitement les femmes du premier membre à l’agent destructeur.
translation_notes:
  register: Français international moderne, sobre et digne. « Vigueur » préserve l’étendue de חַיִל, tandis que « tes voies » maintient l’image hébraïque et sa portée morale. Les notes signalent les principales ambiguïtés lexicales et syntaxiques sans alourdir le verset.
