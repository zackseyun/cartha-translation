review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : les enfants reconnaissent publiquement le bonheur/la valeur de leur mère, et le mari la loue. Toutefois, « fait de même » ajoute une action non exprimée et brouille la syntaxe hébraïque : le mari n’est pas explicitement dit faire ce que font les enfants ; il est ensuite présenté comme celui qui la loue.'
  naturalness: « Ses enfants se lèvent » et « la déclarent heureuse » sont recevables dans un présent proverbial. « Son mari aussi la loue » est à la fois plus direct, plus naturel et plus fidèle que « son mari fait de même et chante ses louanges ».
  terminology: « Heureuse » rend de façon appropriée אשר au piel, sans importer le sens théologique plus marqué de « bénir ». « Ses enfants » conserve l’ambiguïté possible de בָנֶיהָ, avec une note pertinente pour « ses fils ».
  issues:
  - severity: medium
    issue: « Son mari fait de même »
    rationale: Cette expression affirme que le mari répète l’action des enfants (se lever et la déclarer heureuse), alors que l’hébreu coordonne simplement « son mari » avec le verbe singulier « il la loue ». Il convient de ne pas expliciter cette assimilation.
  - severity: low
    issue: « chante ses louanges »
    rationale: L’expression est idiomatique, mais elle est plus imagée et plus intense que הלל (« louer »). Le verbe direct conserve mieux la formulation concise de l’hébreu.
  revised_text: 'Ses enfants se lèvent et la déclarent heureuse[a] ; son mari aussi la loue :'
  revised_footnotes:
  - marker: a
    text: Ou « ses fils se lèvent ». Le mot hébreu peut désigner les fils en particulier ou, plus généralement, les enfants.
    reason: lexical_alternative
  revision_rationale: 'La révision supprime l’expansion interprétative « fait de même » et rend directement la seconde proposition hébraïque : « son mari aussi la loue ». Elle préserve le présent proverbial français, l’ambiguïté de « enfants/fils » et les deux-points qui introduisent l’éloge du verset suivant.'
