source:
  edition: WLC
  text: קָ֣מוּ בָ֭נֶי/הָ וַֽ/יְאַשְּׁר֑וּ/הָ בַּ֝עְלָ֗/הּ וַֽ/יְהַֽלְלָ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/028.yaml
  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
translation:
  language: fr
  text: 'Ses enfants se lèvent et la déclarent heureuse[a] ; son mari aussi la loue :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses fils se lèvent ». Le mot hébreu peut désigner les fils en particulier ou, plus généralement, les enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָמוּ
  choice: se lèvent
  rationale: Le qal accompli pluriel de קום exprime littéralement le fait de se lever. Le présent français convient à la description proverbiale et peut aussi suggérer le geste d’honneur sans l’expliciter.
- source_word: בָנֶיהָ
  choice: ses enfants
  rationale: בנים peut désigner les fils en particulier ou les enfants en général. « Ses enfants » conserve ici le sens collectif probable, tandis qu’une note signale l’autre possibilité.
- source_word: וַיְאַשְּׁרוּהָ
  choice: la déclarent heureuse
  rationale: Au piel, אשר signifie reconnaître ou déclarer quelqu’un heureux, bienheureux ou privilégié. Cette formulation naturelle garde le caractère verbal et public de l’éloge sans laisser entendre que les enfants lui confèrent eux-mêmes une bénédiction.
- source_word: בַּעְלָהּ
  choice: son mari
  rationale: Dans ce contexte familial, בַּעַל avec le suffixe féminin désigne clairement le mari, plutôt qu’un maître ou propriétaire.
- source_word: וַיְהַלְלָהּ
  choice: chante ses louanges
  rationale: הלל signifie louer ou célébrer. « Chante ses louanges » rend naturellement l’éloge appuyé en français et prépare les paroles qui suivent au verset 29.
- source_word: ו
  choice: fait de même et
  rationale: 'Les conjonctions ont ici une valeur additive : le mari se joint aux enfants, puis la loue. « Fait de même » rend cette ellipse avec clarté en français.'
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. Le deux-points final est conservé parce que le verset introduit directement l’éloge formulé au verset suivant. La traduction évite « la bénissent », qui pourrait suggérer qu’ils lui accordent une bénédiction plutôt qu’ils ne reconnaissent son bonheur.
