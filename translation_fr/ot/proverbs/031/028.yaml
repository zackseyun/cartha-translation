- from: 'Ses enfants se lèvent et la déclarent heureuse[a] ; son mari fait de même et chante ses louanges :'
  to: 'Ses enfants se lèvent et la déclarent heureuse[a] ; son mari aussi la loue :'
  rationale: 'La révision supprime l’expansion interprétative « fait de même » et rend directement la seconde proposition hébraïque : « son mari aussi la loue ». Elle préserve le présent proverbial français, l’ambiguïté de « enfants/fils » et les deux-points qui introduisent l’éloge du verset suivant.'
