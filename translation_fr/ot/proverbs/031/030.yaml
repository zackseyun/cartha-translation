source:
  edition: WLC
  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
translation:
  language: fr
  text: Le charme est trompeur, et la beauté n’est qu’un souffle[a] ; mais la femme qui craint Yahweh, elle, sera louée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la beauté est un souffle » ou « une vapeur ». L’image hébraïque peut évoquer ce qui est passager aussi bien que ce qui manque de consistance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une lecture réflexive possible : « se louera ». Le contexte favorise toutefois « sera louée ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר
  choice: trompeur
  rationale: Le nom hébreu exprime la fausseté ou la tromperie. L’adjectif « trompeur », employé comme attribut de « charme », est naturel en français et conserve la force critique du proverbe.
- source_word: הַחֵן
  choice: le charme
  rationale: Dans ce contexte, le terme désigne l’agrément ou l’attrait d’une personne, et non la grâce au sens théologique ni la faveur accordée par autrui.
- source_word: הֶבֶל
  choice: n’est qu’un souffle
  rationale: Le mot évoque concrètement le souffle ou la vapeur, puis ce qui est passager ou sans consistance. La formulation garde l’image hébraïque tout en faisant ressortir la fragilité de la beauté.
- source_word: הַיֹּפִי
  choice: la beauté
  rationale: Équivalent français direct et naturel du nom hébreu désignant la beauté ou l’attrait physique.
- source_word: אִשָּׁה
  choice: la femme
  rationale: Le mot peut signifier « femme » ou « épouse ». Le contexte immédiat permet le sens général « femme », sans exclure que le poème décrive aussi une épouse.
- source_word: יִרְאַת יְהוָה
  choice: qui craint Yahweh
  rationale: La tournure relative rend naturellement en français l’expression hébraïque « craignant Yahweh » et conserve le thème sapientiel de la crainte révérencielle de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à la forme du texte source.
- source_word: הִיא
  choice: elle
  rationale: 'Le pronom indépendant est explicité pour conserver son effet emphatique : c’est cette femme, par contraste avec le charme et la beauté, qui sera louée.'
- source_word: תִתְהַלָּל
  choice: sera louée
  rationale: La forme peut être comprise de manière réflexive ou passive. Dans le mouvement conclusif du proverbe et du poème, le sens passif « sera louée » est le plus probable.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre traditionnel.
- issue: Sens de תִתְהַלָּל dans la proposition finale
  choice: sera louée
  alternative: se louera / pourra se louer
  rationale: 'Le hitpael peut recevoir une nuance réflexive, mais le contexte de recommandation, notamment la conclusion du poème, favorise nettement une valeur passive : cette femme reçoit la louange. Une note conserve l’autre possibilité.'
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé. « N’est qu’un souffle » maintient l’image concrète de l’hébreu, tandis que « elle » restitue l’emphase du pronom indépendant sans alourdir excessivement la phrase.
