  text: אַ֤ל לַֽ/מְלָכִ֨ים לְֽמוֹאֵ֗ל אַ֣ל לַֽ/מְלָכִ֣ים שְׁתוֹ יָ֑יִן וּ֝/לְ/רוֹזְנִ֗ים או שֵׁכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/004.yaml
  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
translation:
  language: fr
  text: Ce n’est pas aux rois, Lemouel, ce n’est pas aux rois de boire du vin, ni aux dirigeants de rechercher de la boisson enivrante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est très concis. On peut aussi comprendre : « ni aux dirigeants : “Où est la boisson enivrante ?” »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל לַמְלָכִים
  choice: Ce n’est pas aux rois
  rationale: La particule négative אַל exprime ici une interdiction ou ce qui ne convient pas. Cette tournure française préserve la répétition emphatique et l’idée de convenance attachée à לַמְלָכִים.
- source_word: לְמוֹאֵל
  choice: Lemouel
  rationale: Le nom est employé en apostrophe. En français moderne, la simple insertion du nom entre virgules exprime naturellement le vocatif sans ajouter « ô ».
- source_word: שְׁתוֹ יָיִן
  choice: de boire du vin
  rationale: Cette formulation complète naturellement « ce n’est pas aux rois » et rend יָיִן par son équivalent courant, « vin ».
- source_word: וּלְרוֹזְנִים
  choice: ni aux dirigeants
  rationale: רוֹזְנִים désigne des hauts responsables ou détenteurs du pouvoir. « Dirigeants » est actuel, clair et maintient le parallélisme avec « rois ».
- source_word: או
  choice: de rechercher
  rationale: Dans cette formulation hébraïque très concise, le terme peut évoquer le fait de demander après une boisson ou de la rechercher. Le choix retenu donne en français un sens intelligible sans accentuer excessivement l’idée subjective de désir; l’autre lecture est signalée en note.
- source_word: שֵׁכָר
  choice: les boissons enivrantes
  rationale: שֵׁכָר désigne une boisson alcoolisée autre que le vin. « Boissons enivrantes » évite de suggérer uniquement des alcools distillés, inexistants dans ce contexte ancien.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « ce n’est pas aux rois » conserve l’insistance poétique de l’hébreu. « Boissons enivrantes » est plus exact historiquement que « boissons fortes », qui pourrait évoquer spécialement des alcools distillés.
