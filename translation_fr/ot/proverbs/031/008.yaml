  naturalness: « Ouvre ta bouche pour le muet, pour défendre la cause de tous ceux qui disparaissent » est idiomatique, direct et d’un registre proverbial naturel en français international. « Ta bouche » est à la fois naturel et plus fidèle que « la bouche ».
