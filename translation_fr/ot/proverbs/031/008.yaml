  text: פְּתַח פִּ֥י/ךָ לְ/אִלֵּ֑ם אֶל דִּ֝֗ין כָּל בְּנֵ֥י חֲלֽוֹף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
translation:
  language: fr
  text: Ouvre ta bouche pour le muet, pour défendre la cause de tous ceux qui disparaissent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour défendre les droits de tous les démunis », « de tous ceux qui sont voués à disparaître » ou, plus littéralement, « de tous les fils de l’éphémère ». L’expression hébraïque est difficile, en particulier le mot rare חֲלוֹף (ḥalof).
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Ouvre la bouche
  rationale: L’impératif concret « ouvre » et l’image de la « bouche » sont conservés; en français, l’expression évoque naturellement le fait de prendre la parole.
- source_word: לְאִלֵּם
  choice: en faveur du muet
  rationale: אִלֵּם désigne une personne muette ou incapable de parler. « En faveur de » exprime ici que le roi doit parler pour elle.
- source_word: אֶל־דִּין
  choice: pour défendre la cause
  rationale: דִּין possède ici une nuance judiciaire. Cette formulation française naturelle exprime l’intervention en justice sans réduire le terme aux seuls « droits ».
- source_word: כָּל בְּנֵי חֲלוֹף
  choice: de tous ceux qui disparaissent
  rationale: בְּנֵי désigne idiomatiquement une catégorie de personnes. Le rare חֲלוֹף est rattaché à l’idée de passer ou de disparaître; la formulation garde cette image tout en restant intelligible.
theological_decisions:
- issue: Identification des bénéficiaires désignés par כָּל בְּנֵי חֲלוֹף
  choice: tous ceux qui disparaissent
  alternative: tous les démunis; tous ceux qui sont voués à disparaître; tous les êtres passagers
  rationale: Le sens du rare חֲלוֹף est incertain. Le texte principal conserve l’idée lexicale de passage ou de disparition, tandis que la note signale les principales autres compréhensions sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme exhortatif est conservé, ainsi que l’image concrète de l’ouverture de la bouche. « Défendre la cause » rend explicite, sans lourdeur, la portée judiciaire de דִּין.
