revisions:
- from: Elle réfléchit à l’achat d’un champ et l’acquiert ; avec le fruit de son travail[a], elle plante une vigne.
  to: Elle envisage un champ et l’acquiert ; avec le produit de son travail[a], elle plante[b] un vignoble.
  rationale: La révision évite de préciser indûment un achat, emploie « vignoble » pour le terrain planté de vignes, et ajoute une note sur la forme masculine de נטע. Le sens contextuel traditionnellement retenu est conservé dans le texte tout en rendant la difficulté grammaticale visible.
