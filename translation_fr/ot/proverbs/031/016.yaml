  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
translation:
  language: fr
  text: Elle envisage un champ et l’acquiert ; avec le produit de son travail[a], elle plante[b] un vignoble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du fruit de ses mains », expression qui désigne le produit ou les revenus de son travail.'
    reason: cultural_note
  - marker: b
    text: 'Le texte hébreu porte formellement « il a planté ». Dans le contexte, beaucoup comprennent que la femme demeure le sujet : « elle plante ».'
    reason: textual_note
lexical_decisions:
- source_word: זָמְמָה
  choice: réfléchit à l’achat de
  rationale: Le verbe exprime une réflexion intentionnelle ou un projet. Avec « champ » et le verbe suivant, cette formulation naturelle indique une décision économique mûrie sans réduire le sens à un simple désir.
- source_word: שָׂדֶה
  choice: un champ
  rationale: Équivalent direct et naturel du terme désignant ici une terre cultivable.
- source_word: וַתִּקָּחֵהוּ
  choice: et l’acquiert
  rationale: Le verbe signifie largement « prendre » ou « acquérir ». « Acquiert » convient au contexte économique sans préciser indûment qu’il s’agit nécessairement d’un achat.
- source_word: מִפְּרִי כַפֶּיהָ
  choice: avec le fruit de son travail
  rationale: 'Littéralement « du fruit de ses mains » : l’expression désigne le produit ou les revenus de son activité. « Avec » rend naturellement en français le moyen financé par ce produit.'
- source_word: נטע
  choice: elle plante
  rationale: 'Le texte consonantique porte une forme pouvant être vocalisée « il a planté », tandis que la tradition massorétique et le contexte syntaxique comprennent la femme comme sujet : « elle plante ».'
- source_word: כָּרֶם
  choice: une vigne
  rationale: En français courant, « une vigne » peut désigner un terrain planté de ceps et constitue ici un équivalent naturel de « vignoble ».
