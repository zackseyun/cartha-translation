review_pass:
  verdict: revise
  source_fidelity: La formulation « à l’achat » restreint inutilement זממה (« elle envisage / considère ») et l’interprétation de לקח comme acquisition; l’hébreu ne précise pas le mode d’acquisition. « Une vigne » désigne habituellement un cep en français, tandis que כָּרֶם désigne un vignoble. Enfin, נטע est formellement une forme masculine singulière dans le texte massorétique, bien que le contexte ait conduit de nombreuses traductions à comprendre la femme comme sujet; cette difficulté doit être signalée.
  naturalness: Le français est globalement naturel. « Elle envisage un champ et l’acquiert » et « avec le produit de son travail » sont idiomatiques et conservent le mouvement économique du distique. « Un vignoble » est le terme français précis et naturel ici.
  terminology: « Champ », « acquiert », « produit de son travail » et « vignoble » rendent correctement les termes hébreux dans un registre moderne international. La note conserve l’image littérale des « mains » et distingue l’ambiguïté grammaticale finale sans imposer une solution doctrinale ou interprétative.
  issues:
  - severity: medium
    issue: « réfléchit à l’achat d’un champ » introduit explicitement un achat.
    rationale: זממה signifie envisager, projeter ou considérer; et לקח signifie prendre/acquérir. Le contexte peut évoquer une transaction, mais le texte ne spécifie pas l’achat.
  - severity: medium
    issue: « une vigne » est imprécis pour כָּרֶם.
    rationale: En français moderne, une vigne peut être un plant individuel; כָּרֶם désigne le terrain planté de vignes, soit un vignoble.
  - severity: medium
    issue: La divergence formelle de genre dans נטע n’est pas signalée.
    rationale: La forme massorétique est formellement « il a planté », alors que le contexte favorise souvent la compréhension « elle plante ». Une note permet de maintenir le rendu contextuel sans effacer la difficulté textuelle.
  revised_text: Elle envisage un champ et l’acquiert ; avec le produit de son travail[a], elle plante[b] un vignoble.
