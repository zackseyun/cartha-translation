  text: עֹז וְ/הָדָ֥ר לְבוּשָׁ֑/הּ וַ֝/תִּשְׂחַ֗ק לְ/י֣וֹם אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
translation:
  language: fr
  text: La force et la dignité sont son vêtement, et elle rit du jour à venir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « elle rit de l’avenir » ; littéralement, « elle rit d’un jour ultérieur ou dernier ».

      '
    reason: alternative_reading
lexical_decisions:
- source_word: עֹז
  choice: la force
  rationale: Le nom désigne couramment la force ou la puissance. « La force » est naturel en français moderne et caractérise ici la femme.
- source_word: הָדָר
  choice: la dignité
  rationale: Le terme peut évoquer la majesté, la splendeur ou l’honneur. Dans ce portrait de caractère, « la dignité » exprime une noblesse honorable sans suggérer nécessairement un faste royal.
- source_word: לְבוּשָׁהּ
  choice: sont son vêtement
  rationale: 'Le nom signifie « vêtement » avec un suffixe féminin singulier. Cette formulation conserve la métaphore hébraïque : force et dignité sont ce dont elle est revêtue.'
- source_word: וַתִּשְׂחַק
  choice: elle rit
  rationale: Le verbe signifie normalement « rire ». Cette traduction préserve l’image vive de son assurance plutôt que de l’atténuer en « sourire » ou de l’interpréter comme « se réjouir ».
- source_word: לְיוֹם אַחֲרוֹן
  choice: face au jour à venir
  rationale: Littéralement, l’expression évoque un jour ultérieur ou dernier. « Face au jour à venir » rend naturellement son assurance devant l’avenir tout en conservant le singulier et une part de l’ambiguïté du texte.
theological_decisions:
- issue: Sens potentiellement eschatologique de אַחֲרוֹן
  choice: « le jour à venir », compris principalement comme l’avenir dans ce contexte de sagesse
  alternative: « le dernier jour » ou, plus largement, « l’avenir »
  rationale: Le contexte immédiat décrit l’assurance prudente de la femme devant ce qui vient. Toutefois, puisque אַחֲרוֹן peut signifier « dernier », la note conserve cette possibilité sans imposer au verset un sens eschatologique explicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier « vêtement » maintient la métaphore hébraïque, tandis que « face au jour à venir » préserve mieux que le pluriel l’ambiguïté temporelle de l’original.
