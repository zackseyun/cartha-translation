  text: וַ/תָּ֤קָם בְּ/ע֬וֹד לַ֗יְלָה וַ/תִּתֵּ֣ן טֶ֣רֶף לְ/בֵיתָ֑/הּ וְ֝/חֹ֗ק לְ/נַעֲרֹתֶֽי/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/015.yaml
  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
translation:
  language: fr
  text: Elle se lève alors qu’il fait encore nuit ; elle donne de la nourriture à sa maisonnée et une part fixée à ses servantes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une tâche pour ses servantes ». Le mot hébreu peut désigner une part prescrite ou une attribution fixée, éventuellement une tâche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Elle se lève
  rationale: Le qatal inversé de קום s’inscrit dans la description poétique suivie de ses activités habituelles ; le présent français rend naturellement cette valeur.
- source_word: בְּעוֹד לַיְלָה
  choice: alors qu’il fait encore nuit
  rationale: Cette formulation naturelle conserve l’idée qu’elle se lève très tôt, sans préciser davantage le moment comme le ferait « avant l’aube ».
- source_word: וַתִּתֵּן
  choice: elle donne
  rationale: Traduction directe de נתן, adaptée au présent descriptif du passage.
- source_word: טֶרֶף
  choice: de la nourriture
  rationale: Bien que le terme puisse désigner une proie, le contexte domestique indique ici la nourriture ou les provisions.
- source_word: לְבֵיתָהּ
  choice: à sa maisonnée
  rationale: בַּיִת désigne ici les personnes de la maison plutôt que le bâtiment ; « maisonnée » préserve cette portée collective.
- source_word: וְחֹק
  choice: et une part fixée
  rationale: חֹק peut désigner ce qui est prescrit ou attribué, notamment une part déterminée. Le parallèle avec la nourriture favorise ce sens, tout en laissant une autre interprétation possible en note.
- source_word: לְנַעֲרֹתֶיהָ
  choice: à ses servantes
  rationale: Dans ce cadre domestique, נַעֲרוֹת désigne vraisemblablement les jeunes femmes attachées à son service. « Servantes » est actuel, clair et digne.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. Le point-virgule marque l’enchaînement des deux actions sans alourdir la phrase. « Maisonnée » rend l’unité domestique au sens large ; « part fixée » conserve la nuance de prescription portée par חֹק.
