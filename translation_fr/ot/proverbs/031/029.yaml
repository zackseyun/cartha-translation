  yaml_path: translation/ot/proverbs/031/029.yaml
  text: Many daughters have done nobly[b][a], but you surpass them all.
translation:
  language: fr
  text: Beaucoup de femmes ont fait preuve de valeur[a], mais toi, tu les surpasses toutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Beaucoup de filles ont fait [ou montré] de la valeur/force ». Dans ce contexte, « filles » peut désigner plus largement des femmes. Le terme traduit par « valeur » peut aussi évoquer la force, la vaillance, la capacité ou l’excellence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת בָּנוֹת
  choice: Beaucoup de femmes
  rationale: Littéralement « beaucoup de filles ». Dans ce contexte poétique, בָּנוֹת peut désigner plus largement des femmes. Le français naturel appelle ici « femmes », tandis qu’une note préserve l’image littérale.
- source_word: עָשׂוּ חָיִל
  choice: ont fait preuve de valeur
  rationale: L’expression associe le verbe « faire » à חַיִל, terme riche pouvant évoquer force, vaillance, capacité et excellence. « Faire preuve de valeur » garde cette amplitude sans limiter le propos au courage militaire.
- source_word: וְאַתְּ
  choice: mais toi
  rationale: La conjonction introduit ici un contraste, et le pronom indépendant met la femme interpellée en relief.
- source_word: עָלִית עַל כֻּלָּנָה
  choice: tu les surpasses toutes
  rationale: Avec עַל, le verbe « monter » exprime idiomatiquement le fait de s’élever au-dessus des autres, donc de les surpasser. Le présent français convient à cette affirmation d’éloge.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve l’adresse emphatique « mais toi » et rend l’éloge comparatif sans réduire la richesse sémantique de חַיִל.
