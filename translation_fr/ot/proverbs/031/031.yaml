  text: תְּנוּ לָ֭/הּ מִ/פְּרִ֣י יָדֶ֑י/הָ וִֽ/יהַלְל֖וּ/הָ בַ/שְּׁעָרִ֣ים מַעֲשֶֽׂי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/031.yaml
  text: Give her of the fruit of her hands[b][a], and let her works praise her in the gates.
translation:
  language: fr
  text: Donnez-lui du fruit de ses mains, et que ses œuvres la louent[b] aux portes de la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « aux portes » : dans l’ancien Israël, les portes de la ville étaient un lieu public de jugement, d’affaires et de reconnaissance.'
    reason: cultural_note
  - marker: b
    text: Ou « que ses réalisations fassent son éloge » ; l’hébreu personnifie ses œuvres, qui témoignent publiquement de sa valeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ לָהּ
  choice: Donnez-lui
  rationale: L’impératif pluriel de נתן, suivi du pronom indirect, appelle directement les destinataires à accorder à cette femme ce qui lui revient.
- source_word: מִפְּרִי יָדֶיהָ
  choice: du fruit de ses mains
  rationale: Cette formulation conserve à la fois la valeur partitive ou de provenance de מִן et l’image concrète des « mains » représentant son travail productif.
- source_word: וִיהַלְלוּהָ
  choice: et que … la louent
  rationale: Le tour volitif prolonge l’exhortation de l’impératif initial. « Que … la louent » conserve aussi la personnification des œuvres.
- source_word: בַשְּׁעָרִים
  choice: aux portes de la ville
  rationale: Les portes désignent ici le lieu public de la vie civique, du jugement et de la reconnaissance. L’ajout explicatif « de la ville » rend cette réalité culturelle immédiatement compréhensible.
- source_word: מַעֲשֶׂיהָ
  choice: ses œuvres
  rationale: Le pluriel désigne ses actes, ses réalisations et le résultat de son activité. « Œuvres » maintient la concision et permet de préserver leur personnification comme témoins publics de sa valeur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les images hébraïques du fruit, des mains et des œuvres personnifiées, tout en explicitant discrètement que les portes sont celles de la ville.
