source:
  edition: WLC
  text: מַרְבַדִּ֥ים עָֽשְׂתָה לָּ֑/הּ שֵׁ֖שׁ וְ/אַרְגָּמָ֣ן לְבוּשָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/022.yaml
  text: She makes coverings for herself[a]; fine linen and purple are her clothing.
translation:
  language: fr
  text: Elle se fait des couvertures[a] ; le fin lin et la pourpre sont ses vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvre-lits », « couvertures de lit » ou peut-être « tapisseries ». Le terme hébreu désigne de manière générale des pièces d’étoffe servant à couvrir et peut évoquer de riches textiles domestiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: couvertures
  rationale: Le nom pluriel désigne des pièces d’étoffe étendues, probablement des couvertures domestiques ou de lit. « Couvertures » reste naturel et suffisamment large sans préciser au-delà de l’hébreu.
- source_word: עָשְׂתָה
  choice: se fait
  rationale: L’accompli hébreu s’inscrit dans le portrait d’une activité caractéristique ; le présent français convient. La tournure « se fait » exprime aussi naturellement לָּהּ, l’usage à son propre bénéfice.
- source_word: לָּהּ
  choice: se
  rationale: Le datif avec suffixe indique ici le bénéfice ou la destination personnelle. Le pronom réfléchi dans « se fait » rend sobrement « pour elle-même ».
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: שֵׁשׁ désigne couramment un lin de qualité ; « fin lin » en conserve la valeur et le registre textile.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Le terme désigne une matière teinte en pourpre, associée au prestige. « Pourpre » est concis et son sens textile est clair dans le contexte des vêtements.
- source_word: לְבוּשָׁהּ
  choice: ses vêtements
  rationale: Le nom singulier collectif désigne l’habillement dans son ensemble ; le pluriel français est ici plus naturel qu’un singulier qui évoquerait une seule pièce.
