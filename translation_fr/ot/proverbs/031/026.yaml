  text: פִּ֭י/הָ פָּתְחָ֣ה בְ/חָכְמָ֑ה וְ/תֽוֹרַת חֶ֝֗סֶד עַל לְשׁוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
translation:
  language: fr
  text: Elle ouvre la bouche avec sagesse, et l’enseignement de la bonté[a] est sur sa langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi de la bonté est sur sa langue ». Le mot hébreu traduit par « enseignement » peut aussi signifier « loi ». Le terme rendu par « bonté » peut aussi évoquer la bienveillance, la fidélité, la miséricorde ou l’amour fidèle, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהָ
  choice: la bouche
  rationale: Conserve l’image concrète de l’hébreu; en français, « ouvrir la bouche » évoque naturellement la prise de parole.
- source_word: פָּתְחָה
  choice: ouvre
  rationale: Le présent exprime ici une conduite caractéristique dans ce portrait proverbial, tout en conservant le verbe hébreu.
- source_word: בְחָכְמָה
  choice: avec sagesse
  rationale: Rend naturellement la préposition בְ et préserve la sagesse comme disposition accompagnant ou gouvernant sa parole.
- source_word: וְתוֹרַת
  choice: un enseignement
  rationale: Dans ce contexte sapientiel, תּוֹרָה désigne vraisemblablement une instruction ou un enseignement plutôt qu’une loi au sens juridique. L’article indéfini donne une formulation française naturelle sans imposer un référent déterminé absent de l’hébreu.
- source_word: חֶסֶד
  choice: bienveillant
  rationale: Dans ce contexte interpersonnel, חֶסֶד qualifie vraisemblablement un enseignement empreint de bonté et de sollicitude. La note conserve les autres nuances possibles du nom hébreu.
- source_word: תּוֹרַת חֶסֶד
  choice: un enseignement bienveillant
  rationale: Cette formulation française naturelle comprend le génitif hébreu comme exprimant la qualité de l’enseignement, sans effacer dans la note l’autre lecture possible, « enseignement de la bonté ».
- source_word: עַל לְשׁוֹנָהּ
  choice: est sur sa langue
  rationale: Préserve l’image hébraïque d’une parole prête et habituelle, dans une tournure intelligible en français.
theological_decisions:
- issue: Portée de חֶסֶד dans תּוֹרַת חֶסֶד
  choice: bienveillant
  alternative: bonté, amour fidèle, fidélité, miséricorde
  rationale: Le contexte immédiat porte sur la manière d’enseigner ou de parler; « bienveillant » convient à cet emploi sans exclure les nuances relationnelles plus fortes de חֶסֶד, signalées en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les images concrètes de la bouche et de la langue sont conservés; la tournure centrale est légèrement idiomatisée pour éviter le peu naturel « enseignement de bienveillance ».
