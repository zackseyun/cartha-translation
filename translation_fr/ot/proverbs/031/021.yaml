source:
  edition: WLC
  text: לֹא תִירָ֣א לְ/בֵיתָ֣/הּ מִ/שָּׁ֑לֶג כִּ֥י כָל בֵּ֝יתָ֗/הּ לָבֻ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/021.yaml
  text: She does not fear snow for her household[a], for all her household are clothed in scarlet.
translation:
  language: fr
  text: Elle ne craint pas la neige pour les siens, car tous les siens sont vêtus d’écarlate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « portent des vêtements doublés ». Certains comprennent ici le mot hébreu שָׁנִים comme évoquant des vêtements doubles ou doublés, plutôt que l’écarlate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: ne craint pas
  rationale: Le qal inaccompli à la 3e personne du féminin singulier exprime ici une absence durable de crainte ou d’inquiétude.
- source_word: לְבֵיתָהּ
  choice: pour les siens
  rationale: בַּיִת peut désigner la maison ou les membres du foyer. Dans ce contexte, la neige menace les personnes dont elle prend soin; « les siens » est naturel et distinct de la reprise « ceux de sa maison ».
- source_word: מִשָּׁלֶג
  choice: la neige
  rationale: Avec ירא, la préposition מִן introduit ce qui pourrait inspirer la crainte; le français dit naturellement « craindre la neige ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle elle ne craint pas.
- source_word: לָבֻשׁ
  choice: sont vêtus
  rationale: Le participe passif singulier s’accorde formellement avec le collectif « toute sa maison »; en français, une formulation plurielle explicite naturellement les membres du foyer.
- source_word: שָׁנִים
  choice: d’écarlate
  rationale: Le sens lexical habituel est « écarlate » ou « étoffe écarlate ». Une autre analyse le rattache à l’idée de doublure ou de vêtements doubles; cette ambiguïté est conservée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La variation entre « les siens » et « ceux de sa maison » évite une répétition lourde tout en conservant le sens collectif de בַּיִת. L’image traditionnelle de l’écarlate reste dans le texte, et l’interprétation contextuelle liée aux vêtements doublés est signalée en note.
