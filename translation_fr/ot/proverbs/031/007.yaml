source:
  edition: WLC
  text: יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח רִישׁ֑/וֹ וַ֝/עֲמָל֗/וֹ לֹ֣א יִזְכָּר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/007.yaml
  text: Let him drink and forget his poverty[a], and remember his trouble no more.
translation:
  language: fr
  text: Qu’il boive et oublie sa pauvreté, et qu’il ne se souvienne plus de sa peine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son labeur », « de sa détresse » ou « de sa misère » ; le mot hébreu peut désigner le travail pénible, les difficultés ou la souffrance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁתֶּה
  choice: Qu’il boive
  rationale: L’imparfait à valeur volitive poursuit ici la permission ou l’exhortation du contexte. « Qu’il boive » restitue naturellement cette nuance en français.
- source_word: וְיִשְׁכַּח
  choice: et oublie
  rationale: La coordination avec l’imparfait prolonge la séquence volitive tout en laissant ouverte la nuance de but ou de résultat, sans l’expliciter excessivement.
- source_word: רִישׁוֹ
  choice: sa pauvreté
  rationale: רִישׁ désigne l’état de pauvreté ou de dénuement. « Pauvreté » est direct, courant et fidèle sans renforcer indûment le sens.
- source_word: וַעֲמָלוֹ
  choice: sa peine
  rationale: עָמָל peut évoquer le labeur, la difficulté, la souffrance ou la misère. « Peine » convient au contexte de détresse et préserve l’étendue sémantique du terme.
- source_word: לֹא יִזְכָּר עוֹד
  choice: qu’il ne se souvienne plus
  rationale: 'La négation avec עוֹד exprime la cessation : ne plus se souvenir. Cette formulation est idiomatique en français et conserve la force finale de l’hébreu.'
theological_decisions:
- issue: Portée de l’injonction relative à la boisson
  choice: Conserver la formulation volitive du verset sans transformer l’énoncé en approbation générale de l’ivresse.
  alternative: 'Traduire par un simple futur : « Il boira »'
  rationale: Le contexte immédiat commande une valeur permissive ou exhortative, mais la traduction ne doit ni élargir ni réduire la portée éthique du propos.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle du texte hébreu est conservée. « Sa peine » est naturel pour un lectorat général, tandis que la note maintient l’ambiguïté lexicale de עָמָל.
