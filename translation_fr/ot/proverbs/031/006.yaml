id: PRO.31.6
reference: Proverbs 31:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּנוּ שֵׁכָ֣ר לְ/אוֹבֵ֑ד וְ֝/יַיִן לְ/מָ֣רֵי נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/006.yaml
  text: Give strong drink to one who is perishing[b][a], and wine to those bitter in soul.
translation:
  language: fr
  text: Donnez une boisson enivrante à celui qui périt[a], et du vin à ceux qui ont l’âme amère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à celui qui va mourir ». Le participe hébreu peut désigner plus largement quelqu’un qui périt, qui va à sa perte ou qui est près de mourir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « aux amers d’âme », expression qui évoque une profonde détresse intérieure ou une grande misère.
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ
  choice: Donnez
  rationale: Impératif pluriel de נתן. « Donnez » rend directement et naturellement le commandement.
- source_word: שֵׁכָר
  choice: une boisson enivrante
  rationale: Le terme désigne une boisson alcoolisée autre que le vin, sans préciser nécessairement son type. « Boisson enivrante » en conserve la portée sans l’identifier à tort à une boisson particulière.
- source_word: לְאוֹבֵד
  choice: à celui qui périt
  rationale: Le participe de אבד peut désigner quelqu’un qui périt, va à sa perte ou approche de la mort. Cette formulation concise préserve l’étendue du sens hébreu et le parallélisme.
- source_word: וְיַיִן
  choice: et du vin
  rationale: Traduction courante et directe du nom hébreu יין, avec sa coordination explicite.
- source_word: לְמָרֵי נָפֶשׁ
  choice: à ceux qui ont l’âme amère
  rationale: L’expression signifie littéralement « aux amers d’âme ». La traduction conserve la métaphore hébraïque tout en exprimant clairement le pluriel.
- source_word: נָפֶשׁ
  choice: âme
  rationale: Dans cette expression, נפש évoque la vie intérieure, siège de la détresse. « Âme » permet de conserver l’image idiomatique sans la réduire à une seule nuance psychologique.
theological_decisions:
- issue: Faut-il atténuer le verset pour éviter qu’il paraisse approuver sans réserve l’ivresse ?
  choice: Conserver les impératifs directs tels qu’ils apparaissent dans l’hébreu.
  alternative: Présenter dans le texte principal un usage strictement médicinal, ou reformuler le propos comme une ironie ou un sarcasme.
  rationale: L’hébreu formule des impératifs directs et ne les limite ni ne les explique dans ce verset. Les précisions éthiques ou contextuelles relèvent de l’interprétation du passage environnant, non d’une modification de cette ligne.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve la brièveté impérative de l’hébreu ainsi que la métaphore de l’« âme amère », avec des notes pour expliciter les ambiguïtés lexicales sans les résoudre dans le texte.
