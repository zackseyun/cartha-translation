  text: דִּ֭בְרֵי לְמוּאֵ֣ל מֶ֑לֶךְ מַ֝שָּׂ֗א אֲֽשֶׁר יִסְּרַ֥תּ/וּ אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
translation:
  language: fr
  text: 'Paroles de Lemouel, roi : un oracle[a] que sa mère lui a enseigné[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Paroles de Lemouel, roi de Massa, que sa mère lui a enseignées. » Le mot hébreu מַשָּׂא peut désigner un « oracle » ou être compris comme le nom de lieu « Massa ».'
    reason: alternative_reading
  - marker: b
    text: Le verbe hébreu peut aussi signifier « instruire », « corriger » ou « discipliner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Paroles de
  rationale: Le pluriel construit de דָּבָר sert ici de titre à un recueil. « Paroles de » reste direct, naturel et moins interprétatif que « Proverbes de ».
- source_word: לְמוּאֵל
  choice: Lemouel
  rationale: Translittération française usuelle du nom propre hébreu, qui en fait entendre les voyelles sans le traduire.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Titre placé en apposition au nom Lemouel ; la ponctuation française rend cette relation sans ajouter de provenance absente du texte retenu.
- source_word: מַשָּׂא
  choice: un oracle
  rationale: Avec la vocalisation massorétique, le terme désigne naturellement une déclaration solennelle, souvent prophétique. La lecture comme nom de lieu « Massa » demeure possible et est conservée en note.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronom relatif reliant « oracle » à la proposition suivante, dans une syntaxe française naturelle.
- source_word: יִסְּרַתּוּ
  choice: a enseigné
  rationale: Le verbe יסר couvre l'instruction, la correction et la discipline. Dans ce contexte de transmission maternelle de sagesse, « enseigné » exprime clairement la valeur pédagogique sans exclure entièrement l'idée de correction, signalée en note.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Traduction directe du nom avec suffixe masculin singulier ; « sa » renvoie naturellement à Lemouel.
