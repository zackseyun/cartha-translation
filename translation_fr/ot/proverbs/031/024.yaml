  text: She makes linen garments and sells them[c][b][a], and supplies belts to the merchant.
translation:
  language: fr
  text: Elle confectionne des articles en lin[a] et les vend ; elle fournit des ceintures[b] au marchand[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vêtements de lin » ou « de l’étoffe de lin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des ceintures d’étoffe » ou « des bandes à la taille ».
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « au Cananéen » ; dans ce contexte, le mot désigne probablement un marchand ou un négociant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  choice: pièces de lin
  rationale: Le nom désigne un article en lin, possiblement une étoffe ou un vêtement. « Pièces de lin » reste naturel dans un contexte commercial tout en préservant l’imprécision du produit.
- source_word: עָשְׂתָה
  choice: confectionne
  rationale: Le parfait décrit ici une activité caractéristique dans le portrait poétique ; le présent d’habitude convient en français. « Confectionne » exprime le travail de fabrication textile.
- source_word: וַתִּמְכֹּר
  choice: et les vend
  rationale: Le présent poursuit la description des activités habituelles. Le pronom « les » reprend naturellement les pièces de lin.
- source_word: חֲגוֹר
  choice: ceintures
  rationale: Le terme désigne un article porté autour de la taille ; « ceintures » est clair et courant, tandis que « écharpes » ou « ceintures d’étoffe » demeurent possibles.
- source_word: נָתְנָה
  choice: fournit
  rationale: Le sens littéral est « donne », mais le contexte de production et de vente indique ici une remise ou une fourniture commerciale.
- source_word: לַכְּנַעֲנִי
  choice: au marchand
  rationale: Littéralement « au Cananéen » ; dans ce contexte commercial, le gentilé peut désigner par métonymie un marchand ou un négociant. La traduction principale rend le sens contextuel, et la note conserve la forme littérale.
