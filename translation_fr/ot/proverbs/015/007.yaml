  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: fr
  text: Les lèvres des sages répandent la connaissance[a], mais il n’en est pas ainsi du cœur des insensés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dispersent la connaissance ». Le verbe hébreu évoque l’action d’éparpiller ou de disséminer.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est elliptique : littéralement, « mais le cœur des insensés, pas ainsi ». Il ne précise pas en quoi le cœur des insensés ne correspond pas au premier membre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי חֲכָמִים
  choice: les lèvres des sages
  rationale: Conserve l’image concrète des lèvres et rend naturellement en français la relation construite ainsi que le pluriel substantivé « sages », sans préciser le genre.
- source_word: יְזָרוּ
  choice: répandent
  rationale: Le verbe זרה évoque l’action de disperser ou d’éparpiller. Avec « connaissance » comme complément, « répandent » garde cette image tout en restant naturel en français.
- source_word: דָעַת
  choice: la connaissance
  rationale: Équivalent direct et usuel de דַּעַת dans la littérature de sagesse.
- source_word: לֵב כְּסִילִים
  choice: le cœur des insensés
  rationale: « Cœur » préserve le terme majeur de l’anthropologie sapientielle hébraïque, qui englobe pensée et disposition intérieure. « Insensés » exprime ici la déficience morale et intellectuelle sans se limiter au manque d’intelligence.
- source_word: לֹא כֵן
  choice: n’est pas ainsi
  rationale: Conserve la formulation elliptique et concise de l’hébreu sans expliciter arbitrairement ce que le cœur des insensés ne fait pas ou n’est pas.
theological_decisions:
- issue: Portée de l’ellipse לֹא כֵן
  choice: 'Maintenir l’ellipse : « n’est pas ainsi »'
  alternative: « ne répand pas la connaissance »
  rationale: Le texte hébreu ne répète ni le verbe ni son complément. La traduction retenue préserve l’ambiguïté entre la disposition intérieure des insensés et leur incapacité à communiquer la connaissance.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle et l’image corporelle de l’hébreu sont conservées; les notes signalent le verbe imagé et l’ellipse réelle du second membre.
