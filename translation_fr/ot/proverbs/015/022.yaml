source:
  edition: WLC
  text: הָפֵ֣ר מַ֭חֲשָׁבוֹת בְּ/אֵ֣ין ס֑וֹד וּ/בְ/רֹ֖ב יוֹעֲצִ֣ים תָּקֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
translation:
  language: fr
  text: Les projets échouent faute de délibération, mais avec de nombreux conseillers, ils réussissent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפֵר
  choice: échouent
  rationale: Le hiphil de פרר exprime ici l’idée que les projets sont déjoués ou réduits à néant. Avec « projets » comme sujet, « échouent » rend naturellement en français le résultat de cette action.
- source_word: מַחֲשָׁבוֹת
  choice: projets
  rationale: Dans ce contexte de sagesse pratique, en parallèle avec les conseillers et l’aboutissement, le terme désigne des desseins ou projets réfléchis plutôt que de simples pensées.
- source_word: בְּאֵין
  choice: faute de
  rationale: Cette tournure exprime clairement l’absence avec sa valeur causale, dans un français concis et proverbial.
- source_word: סוֹד
  choice: concertation
  rationale: סוֹד peut désigner un entretien confidentiel, un conseil ou une délibération. Ici, le contraste avec les nombreux conseillers met surtout l’accent sur la consultation commune; « concertation » évite de confondre l’avis donné et la personne qui conseille.
- source_word: וּבְרֹב
  choice: mais avec de nombreux
  rationale: Le waw introduit l’opposition entre les deux membres du proverbe, tandis que רֹב exprime la multiplicité.
- source_word: יוֹעֲצִים
  choice: conseillers
  rationale: Le participe actif de יעץ désigne ceux qui donnent des conseils; « conseillers » est direct, courant et adapté au registre sapiential.
- source_word: תָּקוּם
  choice: ils se réalisent
  rationale: קום signifie « se lever », « tenir » ou « être établi ». Repris naturellement au pluriel en français avec « projets », « se réalisent » exprime leur aboutissement sans alourdir la maxime.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme antithétique est conservé. « Concertation » rend la dimension de délibération commune de סוֹד, tandis que la note préserve une traduction plus formelle et l’ambiguïté de קום.
