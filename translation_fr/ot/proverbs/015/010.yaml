source:
  edition: WLC
  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: fr
  text: Une correction sévère[a] attend celui qui abandonne le sentier[b] ; celui qui déteste la réprimande mourra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une mauvaise correction » ou « une correction néfaste ». L’adjectif hébreu peut aussi signifier « mauvais » ou « néfaste » ; ici, il semble décrire la rigueur pénible de la correction.
    reason: lexical_alternative
  - marker: b
    text: Ou « le chemin ». Dans les écrits de sagesse, le chemin est une image courante de la conduite morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר
  choice: correction
  rationale: Dans ce contexte, מוּסָר désigne une mesure corrective, avec une nuance pénible ou disciplinaire. « Correction » est naturel en français et reste distinct de la réprimande verbale exprimée dans le second membre.
- source_word: רָע
  choice: sévère
  rationale: L’adjectif signifie couramment « mauvais » ou « mal », mais il qualifie ici vraisemblablement la rigueur pénible de la correction. « Sévère » rend ce sens contextuel sans faire de la correction elle-même un mal moral.
- source_word: לְעֹזֵב
  choice: attend celui qui abandonne
  rationale: La préposition לְ marque ici la destination ou la relation, tandis que le participe décrit une personne caractérisée par l’abandon du bon chemin. « Attend » donne en français une proposition complète sans préciser indûment qui inflige la correction.
- source_word: אֹרַח
  choice: le sentier
  rationale: Le mot désigne un chemin et, dans la littérature de sagesse, sert souvent de métaphore pour la conduite morale. « Sentier » conserve cette image traditionnelle et reste compréhensible.
- source_word: שׂוֹנֵא
  choice: qui déteste
  rationale: Le participe a une portée générale. Cette formulation concise conserve le parallélisme proverbial.
- source_word: תוֹכַחַת
  choice: les réprimandes
  rationale: Le terme désigne des reproches ou avertissements correctifs. « Réprimandes » exprime la correction verbale et évite de confondre ce mot avec מוּסָר, rendu par « correction ».
- source_word: יָמוּת
  choice: mourra
  rationale: L’imparfait hébreu exprime ici le résultat ou l’avenir caractéristique d’une maxime. « Mourra » garde intacte la force de l’avertissement.
theological_decisions:
- issue: Nature de la mort annoncée
  choice: mourra
  alternative: ira à sa perte / périra / mourra physiquement
  rationale: Le verbe hébreu מות dit simplement « mourir » et le proverbe ne précise pas s’il s’agit exclusivement de la mort physique, d’une ruine plus large ou d’une réalité ultime. La traduction conserve cette indétermination.
translation_notes:
  register: Français moderne, sobre et proverbial. Le point-virgule fait ressortir le parallélisme des deux membres. « Sentier » maintient la métaphore sapientielle, tandis que « correction » et « réprimandes » préservent la distinction entre les deux termes hébreux.
