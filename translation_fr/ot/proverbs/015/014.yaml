  text: לֵ֣ב נָ֭בוֹן יְבַקֶּשׁ דָּ֑עַת ו/פני כְ֝סִילִ֗ים יִרְעֶ֥ה אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/014.yaml
  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: fr
  text: Le cœur de la personne avisée recherche la connaissance, mais le visage[a] des insensés se repaît de sottise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu lit littéralement : « le visage des insensés ». Certains comprennent ou traduisent « la bouche des insensés », image qui s’accorde plus directement avec le verbe « se repaître ».'
    reason: Le texte massorétique présente une image difficile ; la note signale l’interprétation courante sans modifier silencieusement le texte.
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Dans les Proverbes, le cœur désigne la personne intérieure, notamment son intelligence et sa volonté; « cœur » conserve l’image hébraïque.
- source_word: נָבוֹן
  choice: l’homme intelligent
  rationale: Le terme qualifie une personne douée de compréhension et de discernement. Cette formulation est naturelle en français et ne réduit pas le mot à la seule prudence.
- source_word: יְבַקֶּשׁ
  choice: recherche
  rationale: Le verbe exprime une démarche active et intentionnelle pour acquérir quelque chose.
- source_word: דָּעַת
  choice: la connaissance
  rationale: Dans le vocabulaire sapientiel, le nom désigne normalement la connaissance que recherche la personne avisée.
- source_word: וּפְנֵי
  choice: mais le visage
  rationale: Le texte massorétique porte littéralement « et/mais le visage de ». Cette image inhabituelle est conservée plutôt que remplacée silencieusement par « bouche ».
- source_word: כְסִילִים
  choice: des insensés
  rationale: « Insensés » rend la catégorie morale et intellectuelle propre aux Proverbes dans un registre digne.
- source_word: יִרְעֶה
  choice: se repaît de
  rationale: Le verbe signifie paître ou se nourrir. « Se repaît de » conserve l’image de l’alimentation tout en convenant à un objet abstrait.
- source_word: אִוֶּלֶת
  choice: sottise
  rationale: Le mot désigne la folie opposée à la sagesse; « sottise » est clair, idiomatique et adapté au parallélisme.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et sapientiel. Le parallélisme antithétique est préservé, ainsi que l’image surprenante du « visage » dans le texte massorétique.
