  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: fr
  text: En tout lieu, les yeux de Yahweh[a] observent les méchants et les bons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « l’Éternel » ou « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: En tout lieu
  rationale: Cette formulation naturelle et concise conserve le sens distributif de l’hébreu, littéralement « dans tout lieu ».
- source_word: עֵינֵי יְהוָה
  choice: les yeux de Yahweh
  rationale: Le choix préserve explicitement la construction hébraïque et son image anthropomorphique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: צֹפוֹת
  choice: observent
  rationale: Le participe exprime une observation continue. « Observent » reste naturel en français et évite de donner à tort au verbe le sens principalement protecteur que pourrait suggérer « veillent sur ».
- source_word: רָעִים וְטוֹבִים
  choice: les méchants et les bons
  rationale: Les adjectifs sont substantivés et désignent des personnes. Cette formulation garde la concision et le contraste équilibré du proverbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le Tétragramme. « Yahweh » préserve le nom personnel tout en signalant en note le rendu français traditionnel.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure brève, le parallélisme moral et l’image des « yeux » sont conservés sans explicitation superflue.
