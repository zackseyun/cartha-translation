id: PRO.15.8
reference: Proverbs 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: fr
  text: Le sacrifice des méchants est une abomination pour Yahweh, mais la prière des hommes droits lui est agréable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est son plaisir » ou « a sa faveur ». Le nom hébreu peut exprimer le plaisir, la faveur ou ce qui est agréé.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: sacrifice
  rationale: Le terme désigne une offrande sacrificielle; « sacrifice » convient naturellement au contraste proverbial avec la prière.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé au pluriel désigne des personnes moralement coupables; cette formulation conserve la catégorie éthique concise du proverbe.
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Le nom exprime une répulsion morale très forte; « abomination » en préserve l’intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel présent dans le texte hébreu.
- source_word: תְפִלַּת
  choice: la prière
  rationale: Le singulier représentatif convient au style proverbial et traduit la construction « la prière de ».
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Le terme désigne ceux qui sont moralement droits. Cette expression est naturelle en français et évite de confondre cette nuance avec celle de « justes ».
- source_word: רְצוֹנוֹ
  choice: fait ses délices
  rationale: Le nom peut exprimer le plaisir, la faveur ou l’acceptation. Dans l’antithèse avec « abomination », cette formulation rend nettement l’idée de plaisir sans effacer les autres possibilités, signalées en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Sens de רְצוֹנוֹ dans le second membre
  choice: fait ses délices
  alternative: a sa faveur; lui est agréable
  rationale: La proposition nominale hébraïque laisse la copule implicite, et le substantif peut désigner plaisir, faveur ou acceptation. Le texte principal préserve la forte antithèse avec « abomination », tandis que la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme antithétique est conservé, avec une syntaxe simple et proverbiale.
