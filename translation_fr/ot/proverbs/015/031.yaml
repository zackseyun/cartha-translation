  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: fr
  text: L’oreille qui écoute une réprimande qui mène à la vie demeurera parmi les sages[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’oreille qui écoute la réprimande de la vie logera parmi les sages. » Le verbe hébreu signifie littéralement « passer la nuit » ou « loger » ; il évoque ici, de manière figurée, le fait de demeurer parmi les sages.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « une réprimande qui mène à la vie » peut aussi se rendre par « la réprimande de la vie » ou « la réprimande pour la vie » ; elle désigne une correction qui conduit à la vie ou la préserve.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: l’oreille
  rationale: 'Le rendu littéral conserve la métonymie hébraïque : l’oreille représente ici la personne réceptive. Cette image reste naturelle et intelligible en français.'
- source_word: שֹׁמַעַת
  choice: qui écoute
  rationale: Le participe exprime une disposition durable à entendre avec attention, plutôt qu’une simple perception auditive.
- source_word: תּוֹכַחַת
  choice: une réprimande
  rationale: Le terme désigne une remontrance ou correction morale. « Réprimande » garde sa force sans adopter le registre plus vieilli de « répréhension ».
- source_word: חַיִּים
  choice: qui mène à la vie
  rationale: Dans la construction תּוֹכַחַת חַיִּים, le pluriel hébreu renvoie idiomatiquement à la vie. La formulation choisie exprime la valeur finale ou résultative probable tout en signalant l’ambiguïté dans une note.
- source_word: בְּקֶרֶב
  choice: parmi
  rationale: La préposition situe l’oreille, c’est-à-dire la personne attentive, au sein du groupe des sages. « Parmi » est idiomatique et concis.
- source_word: חֲכָמִים
  choice: les sages
  rationale: L’adjectif pluriel substantivé désigne les personnes sages sans marquage de genre superflu en français.
- source_word: תָּלִין
  choice: demeurera
  rationale: Le verbe signifie littéralement « passera la nuit » ou « logera ». Dans ce proverbe, il évoque figurativement une présence durable au milieu des sages ; « demeurera » conserve cette idée avec dignité et naturel.
