id: PRO.15.9
reference: Proverbs 15:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: fr
  text: La conduite du méchant est une abomination pour Yahweh, mais il aime celui qui poursuit la justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: une abomination
  rationale: Le nom exprime quelque chose de profondément odieux ou détestable. « Une abomination » conserve cette forte réprobation morale et le registre biblique sans l’atténuer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: דֶּרֶךְ
  choice: la conduite
  rationale: Ici, « chemin » désigne métaphoriquement la manière de vivre. « Conduite » rend ce sens clairement en français courant, tandis que « voie » reste une possibilité plus littérale.
- source_word: רָשָׁע
  choice: du méchant
  rationale: 'Le singulier masculin hébreu a une portée générique : il décrit toute personne caractérisée par la méchanceté, sans limiter l’énoncé aux hommes.'
- source_word: מְרַדֵּף
  choice: celui qui poursuit
  rationale: Le participe substantivé décrit une disposition ou une pratique continue. Cette tournure préserve le parallélisme avec « le méchant ».
- source_word: צְדָקָה
  choice: la justice
  rationale: Le terme désigne ici la droiture et ce qui est conforme au bien. « Justice » est naturel en français et garde l’idée d’un ordre moral juste; « droiture » explicite davantage la dimension personnelle.
- source_word: יֶאֱהָב
  choice: il aime
  rationale: L’inaccompli exprime dans ce proverbe une vérité générale; le présent français convient donc mieux qu’un futur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. Le conserver évite de substituer au nom un titre traditionnel.
- issue: Portée du masculin singulier générique
  choice: le méchant / celui qui poursuit
  alternative: l’homme méchant / l’homme qui poursuit
  rationale: Les formes masculines singulières sont représentatives en hébreu sapientiel. Le français choisi conserve cette portée générale sans ajouter une restriction liée au sexe.
- issue: Sens de צְדָקָה
  choice: la justice
  alternative: la droiture
  rationale: Le mot peut couvrir à la fois la conformité au bien, la droiture morale et la justice. Le texte principal retient « justice » sans exclure la nuance de « droiture », signalée en note.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Conduite » explicite la métaphore de דֶּרֶךְ pour une lecture naturelle; la structure antithétique et la force du mot « abomination » sont conservées.
