  text: אִ֣ישׁ חֵ֭מָה יְגָרֶ֣ה מָד֑וֹן וְ/אֶ֥רֶך אַ֝פַּ֗יִם יַשְׁקִ֥יט רִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/018.yaml
  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: fr
  text: Un homme coléreux attise la discorde, mais celui qui est lent à la colère apaise une querelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « calme un différend ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: un homme coléreux
  rationale: La construction désigne littéralement un « homme de fureur » et caractérise un type humain. « Un homme coléreux » conserve le masculin singulier du texte hébreu tout en exprimant naturellement un tempérament porté à la colère.
- source_word: יְגָרֶה
  choice: attise
  rationale: Le piel de גרה signifie susciter, provoquer ou exciter. « Attise » restitue avec force l’idée d’alimenter activement une opposition.
- source_word: מָדוֹן
  choice: les conflits
  rationale: Le nom désigne la discorde ou les querelles. Le pluriel français exprime naturellement la conduite habituelle décrite par cette maxime, sans limiter le terme à une procédure juridique.
- source_word: אֶרֶך אַפַּיִם
  choice: celui qui est lent à la colère
  rationale: L’expression hébraïque, littéralement « long de narines », est un idiome désignant la maîtrise patiente de la colère. La formulation retenue préserve explicitement le lien avec la colère.
- source_word: יַשְׁקִיט
  choice: apaise
  rationale: Le hiphil de שקט exprime le fait de rendre calme ou tranquille. « Apaise » en restitue la valeur causative dans un français courant et digne.
- source_word: רִיב
  choice: une querelle
  rationale: Le terme peut désigner une querelle, un différend ou un litige. Dans ce parallélisme sapiential, « querelle » convient au cadre interpersonnel sans imposer un sens juridique.
theological_decisions: []
translation_notes:
  register: Style proverbial concis, équilibré et accessible. Le parallélisme antithétique est conservé, ainsi que le masculin singulier représentatif du texte source. L’idiome hébreu אֶרֶך אַפַּיִם est rendu par son équivalent français transparent plutôt que littéralement.
