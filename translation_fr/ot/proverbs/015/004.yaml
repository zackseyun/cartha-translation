  text: מַרְפֵּ֣א לָ֭שׁוֹן עֵ֣ץ חַיִּ֑ים וְ/סֶ֥לֶף בָּ֝֗/הּ שֶׁ֣בֶר בְּ/רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/004.yaml
  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: fr
  text: Une langue qui guérit est un arbre de vie[a], mais sa perversité brise l’esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une langue bienfaisante est un arbre de vie » ; le mot hébreu peut évoquer la guérison, la santé ou ce qui est salutaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais la perversité en elle est une fracture dans l’esprit ».'
    reason: formal_equivalence
lexical_decisions:
- source_word: מַרְפֵּא
  choice: qui guérit
  rationale: Le nom hébreu évoque la guérison, le remède ou la santé. La tournure verbale « qui guérit » est naturelle en français et conserve le sens concret de restauration, sans le réduire à la seule douceur.
- source_word: לָשׁוֹן
  choice: langue
  rationale: Le terme désigne littéralement la langue et, par métonymie, les paroles. « Langue » préserve l’image proverbiale hébraïque tout en restant compréhensible.
- source_word: עֵץ חַיִּים
  choice: un arbre de vie
  rationale: L’expression conserve l’image sapientielle et ses résonances bibliques sans identifier nécessairement cet arbre à l’unique arbre du jardin d’Éden.
- source_word: סֶלֶף
  choice: perversité
  rationale: Le mot exprime ce qui est tordu, déformé ou corrompu, ici dans l’usage de la langue. « Perversité » en garde la portée morale et verbale.
- source_word: בָּהּ
  choice: sa
  rationale: Le suffixe féminin renvoie naturellement à la langue. Le possessif « sa » rend ce lien de manière concise et idiomatique en français.
- source_word: שֶׁבֶר
  choice: brise
  rationale: Le nom hébreu désigne une cassure, une fracture ou un effondrement. La verbalisation « brise » produit un français naturel tout en maintenant la force de l’image.
- source_word: בְּרוּחַ
  choice: l’esprit
  rationale: Dans ce contexte de sagesse, רוּחַ renvoie le plus naturellement à l’esprit intérieur de la personne. L’article défini conserve la formulation générale du proverbe.
theological_decisions:
- issue: Référent de רוּחַ
  choice: l’esprit humain, la vie intérieure
  alternative: l’Esprit divin
  rationale: Le contraste porte sur l’effet réparateur ou destructeur des paroles dans l’expérience humaine. Le contexte indique l’esprit humain plutôt que l’Esprit de Dieu.
- issue: Valeur de עֵץ חַיִּים
  choice: un arbre de vie
  alternative: l’arbre de vie
  rationale: L’hébreu présente ici une image sapientielle non déterminée. Cette traduction préserve les échos à la Genèse sans imposer une identification exclusive avec l’arbre d’Éden.
translation_notes:
  register: Français international moderne, courant et digne. La structure antithétique et les images concrètes du proverbe sont conservées ; les formulations nominales difficiles de l’hébreu sont légèrement verbalisées pour assurer une lecture naturelle.
