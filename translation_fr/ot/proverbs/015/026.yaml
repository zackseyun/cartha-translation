source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה מַחְשְׁב֣וֹת רָ֑ע וּ֝/טְהֹרִ֗ים אִמְרֵי נֹֽעַם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: fr
  text: Les pensées mauvaises sont une abomination pour Yahweh, mais les paroles agréables sont pures.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: sont abominables à
  rationale: Le nom construit exprime ce qui inspire l’horreur à Yahweh. La tournure adjectivale est naturelle en français et conserve la forte condamnation morale du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מַחְשְׁבוֹת רָע
  choice: les pensées mauvaises
  rationale: מַחְשְׁבוֹת peut désigner des pensées, des projets ou des desseins. « Pensées » préserve ici l’étendue du terme et le contraste possible entre dispositions intérieures et paroles prononcées.
- source_word: וּטְהֹרִים
  choice: mais … sont pures
  rationale: La conjonction est rendue par « mais » afin d’exprimer le parallélisme antithétique; l’ordre est réorganisé selon l’usage naturel du français.
- source_word: אִמְרֵי נֹעַם
  choice: les paroles agréables
  rationale: La construction désigne littéralement des paroles de douceur ou d’agrément. « Paroles agréables » reste proche du sens sans préciser indûment « bienveillantes » ou « pleines de grâce ».
- source_word: טְהֹרִים
  choice: pures
  rationale: L’adjectif peut signifier « pur » ou « propre »; « pures » convient au contraste moral avec ce qui est mauvais.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de מַחְשְׁבוֹת רָע
  choice: les pensées mauvaises
  alternative: les projets mauvais
  rationale: Le mot hébreu couvre pensées, intentions et projets. Le choix retenu conserve cette largeur sémantique et n’enferme pas le verset dans les seuls plans délibérés.
translation_notes:
  register: Français international moderne, concis et digne, conforme au parallélisme proverbial. La formulation conserve l’ambiguïté de מַחְשְׁבוֹת entre pensées, intentions et projets sans alourdir le verset.
