id: PRO.15.28
reference: Proverbs 15:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֣ב צַ֭דִּיק יֶהְגֶּ֣ה לַ/עֲנ֑וֹת וּ/פִ֥י רְ֝שָׁעִ֗ים יַבִּ֥יעַ רָעֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: fr
  text: Le cœur du juste réfléchit avant de répondre[a], mais la bouche des méchants déverse le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « médite en vue de répondre ». Le verbe hébreu peut évoquer une réflexion prolongée, une méditation ou un murmure réfléchi; plus littéralement : « réfléchit pour répondre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: le cœur
  rationale: Dans la littérature sapientiale hébraïque, le cœur désigne la personne intérieure, notamment le siège de la pensée et de la délibération. « Le cœur » conserve l’image hébraïque tout en restant naturel en français.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé désigne ici, de façon représentative, la personne juste. Le singulier français maintient le contraste formel avec le pluriel « des méchants » présent dans l’hébreu.
- source_word: יֶהְגֶּה
  choice: réfléchit
  rationale: Le verbe peut exprimer le fait de méditer, de ruminer ou de formuler à voix basse. Avec « répondre », il évoque une délibération attentive; « réfléchit » rend clairement ce sens sans exclure la nuance de méditation.
- source_word: לַעֲנוֹת
  choice: avant de répondre
  rationale: L’infinitif précédé de ל indique que la réflexion est orientée vers la réponse. « Avant de répondre » explicite naturellement en français l’antériorité pragmatique impliquée par le contexte, tandis que la note conserve une formulation plus proche de la structure hébraïque.
- source_word: וּפִי
  choice: mais la bouche
  rationale: La conjonction signifie littéralement « et », mais le parallélisme antithétique justifie « mais », qui rend clairement le contraste en français.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif pluriel substantivé désigne collectivement les personnes méchantes. « Des méchants » est concis et conserve le pluriel de l’hébreu.
- source_word: יַבִּיעַ
  choice: déverse
  rationale: Le verbe à la forme causative évoque ce qui jaillit ou coule abondamment. « Déverse » préserve l’image vive d’une parole abondante et incontrôlée.
- source_word: רָעוֹת
  choice: le mal
  rationale: Le pluriel hébreu peut désigner des choses mauvaises, des paroles mauvaises ou des maux. Le collectif français « le mal » reste naturel et conserve l’ampleur morale et nuisible de l’expression sans la réduire à un seul type de propos.
theological_decisions: []
