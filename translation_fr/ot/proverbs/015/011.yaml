id: PRO.15.11
reference: Proverbs 15:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׁא֣וֹל וַ֭/אֲבַדּוֹן נֶ֣גֶד יְהוָ֑ה אַ֝֗ף כִּֽי לִבּ֥וֹת בְּֽנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/011.yaml
  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: fr
  text: Le Shéol et l’Abaddon[a] sont à découvert devant Yahweh ; à plus forte raison les cœurs des humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Destruction ». « Abaddon » peut désigner la destruction ou le domaine, le lieu de destruction.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Adam », expression qui désigne ici les êtres humains en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: le Shéol
  rationale: La translittération conserve la notion hébraïque du séjour des morts sans la réduire à la tombe physique ni lui imposer une conception plus précise de l’au-delà.
- source_word: אֲבַדּוֹן
  choice: l’Abaddon
  rationale: La translittération préserve le parallélisme avec « le Shéol » et la valeur presque toponymique du terme, qui peut aussi désigner la destruction ou le lieu de destruction.
- source_word: נֶגֶד
  choice: sont à découvert devant
  rationale: Au-delà de la simple position spatiale, le contexte exprime que ces domaines cachés sont pleinement exposés au regard de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement afin de préserver la référence précise du tétragramme.
- source_word: אַף כִּי
  choice: à plus forte raison
  rationale: 'Cette locution française restitue naturellement le raisonnement a fortiori : si même le Shéol et l’Abaddon sont exposés, les cœurs humains le sont certainement davantage.'
- source_word: לִבּוֹת
  choice: les cœurs
  rationale: « Cœurs » maintient la métaphore hébraïque de l’être intérieur, englobant pensées, intentions et volonté.
- source_word: בְּנֵי אָדָם
  choice: les fils d’Adam
  rationale: La formulation garde l’image et la forme représentative de l’hébreu tout en laissant la note préciser qu’elle désigne ici l’ensemble des êtres humains.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte explicitement le tétragramme ; employer « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Statut de שְׁאוֹל et אֲבַדּוֹן
  choice: le Shéol et l’Abaddon
  alternative: le séjour des morts et la destruction
  rationale: Conserver les termes hébreux évite d’aplanir leurs nuances ou d’introduire une doctrine de l’au-delà plus précise que celle du proverbe.
- issue: Portée de בְּנֵי אָדָם
  choice: les fils d’Adam
  alternative: les êtres humains
  rationale: Le rendu formel préserve l’expression hébraïque, tandis qu’une note en explicite la portée générique.
translation_notes:
  register: Français moderne, digne et concis. « À plus forte raison » rend clairement la progression argumentative du proverbe, et « à découvert » exprime l’exposition totale au regard divin.
