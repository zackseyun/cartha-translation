source:
  edition: WLC
  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: fr
  text: Yahweh renverse la maison des orgueilleux[a], mais il affermit la limite de la veuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arrache la maison des orgueilleux ». Le verbe hébreu peut exprimer l’idée d’enlever ou d’arracher, et, avec « maison », celle de démolir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la limite de la veuve » ; il peut s’agir de la ligne de propriété ou de la borne qui délimite son terrain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: la maison des
  rationale: Le nom construit peut désigner la maison matérielle, la maisonnée ou le patrimoine. « La maison des orgueilleux » conserve l’image concrète et sa portée plus large.
- source_word: גֵּאִים
  choice: les orgueilleux
  rationale: Le terme désigne les personnes hautaines ou arrogantes. « Les orgueilleux » est naturel en français et convient au contraste sapientiel.
- source_word: יִסַּח
  choice: arrache
  rationale: Le verbe exprime l’enlèvement énergique et peut évoquer l’arrachement ou la démolition. « Arrache » préserve cette force sans réduire l’image à la seule destruction d’un bâtiment.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de préserver le nom propre présent dans l’hébreu.
- source_word: וְיַצֵּב
  choice: mais il affermit
  rationale: Le hiphil de יצב signifie établir ou rendre ferme. « Mais » explicite la valeur antithétique du parallélisme, tandis que « affermit » garde l’idée de stabilité.
- source_word: גְּבוּל
  choice: la limite du terrain
  rationale: Le mot désigne une frontière, une limite de propriété ou, par métonymie, un territoire. Cette formulation rend clairement l’image foncière sans la remplacer par une interprétation abstraite.
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Le singulier représente ici la veuve comme membre d’une catégorie socialement vulnérable, conformément à l’usage sapientiel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le Tétragramme. La translittération conserve le caractère de nom propre plutôt que de lui substituer un titre.
- issue: Valeur de la conjonction ו devant יַצֵּב
  choice: mais
  alternative: et
  rationale: La conjonction hébraïque signifie formellement « et », mais le parallélisme oppose la ruine des orgueilleux à la protection de la veuve. « Mais » rend cette fonction discursive sans modifier le contenu.
- issue: Portée de la protection accordée à la veuve
  choice: préservation concrète de sa limite foncière
  alternative: affirmation générale de ses droits
  rationale: Le vers emploie une image concrète de propriété. La traduction la conserve et laisse au lecteur le soin d’en percevoir la portée sociale et théologique.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme antithétique est conservé. « Arrache » maintient l’ambiguïté entre la destruction d’une maison et l’éradication d’une maisonnée ou d’un patrimoine ; la note fournit l’autre lecture naturelle.
