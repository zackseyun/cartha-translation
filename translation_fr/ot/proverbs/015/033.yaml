  text: יִרְאַ֣ת יְ֭הוָה מוּסַ֣ר חָכְמָ֑ה וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: fr
  text: La crainte de Yahweh est la discipline de la sagesse[a], et l’humilité précède l’honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction de la sagesse ». Le mot hébreu traduit par « discipline » peut aussi désigner une instruction ou une correction formatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  rationale: Le syntagme désigne une crainte révérencielle dirigée vers Yahweh. « Crainte » conserve toute la force du terme hébreu sans le réduire à la seule révérence, et le nom divin est rendu par « Yahweh ».
- source_word: מוּסַר
  choice: instruction
  rationale: Dans les Proverbes, le terme désigne une formation qui peut inclure discipline et correction. « Instruction » convient ici, tandis qu’une note préserve sa nuance corrective.
- source_word: חָכְמָה
  choice: sagesse
  rationale: C’est l’équivalent français normal du terme central de la littérature sapientielle.
- source_word: וְלִפְנֵי
  choice: et … précède
  rationale: La préposition exprime ici une antériorité logique ou temporelle. La formulation verbale est naturelle en français et respecte le parallélisme proverbial.
- source_word: כָבוֹד
  choice: honneur
  rationale: Dans ce contexte sapientiel, le mot évoque l’estime ou l’élévation sociale; « honneur » est donc plus juste et plus idiomatique que « gloire ».
- source_word: עֲנָוָה
  choice: humilité
  rationale: Le nom exprime l’humilité ou l’abaissement volontaire. « Humilité » convient au contraste éthique avec l’honneur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rapport entre מוּסַר et חָכְמָה
  choice: une instruction à la sagesse
  alternative: la discipline de la sagesse
  rationale: La construction hébraïque est concise et peut évoquer aussi bien une instruction qui forme à la sagesse qu’une discipline propre à celle-ci. Le texte principal reste naturel en français, et la note conserve la nuance disciplinaire.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme est conservé, avec un registre digne mais immédiatement compréhensible.
