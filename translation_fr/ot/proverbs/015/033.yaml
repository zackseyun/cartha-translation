    issue: Le groupe « une instruction à la sagesse » ne rend pas précisément la construction מוּסַר חָכְמָה.
    rationale: La préposition « à » transforme le génitif hébreu en une instruction orientée vers la sagesse. « Discipline de la sagesse » conserve la relation compacte et la nuance corrective de מוּסָר; l’alternative « instruction » est à signaler en note.
  revised_text: La crainte de Yahweh est la discipline de la sagesse[a], et l’humilité précède l’honneur.
  revised_footnotes:
