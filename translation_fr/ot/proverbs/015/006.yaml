  verdict: revise
  source_fidelity: 'La première proposition rend correctement בֵּית צַדִּיק et חֹסֶן רָב. Dans la seconde, « les revenus ... sont source de malheur » s’éloigne toutefois de la prédication passive de נֶעְכָּרֶת : le texte présente le produit/revenu du méchant comme affecté de trouble ou de ruine, plutôt que comme la cause active d’un malheur. Le singulier de תְבוּאָה est également préférable.'
  naturalness: « Dans la maison du juste, il y a de grandes richesses » est naturel en français moderne. « Le revenu du méchant est troublé » est un peu plus littéral, mais reste compréhensible et conserve utilement l’ambiguïté du verbe hébreu; la note explicite les possibilités idiomatiques.
  terminology: « juste », « méchant », « maison », « richesses » et « revenu » conviennent au registre proverbial et maintiennent le contraste éthique et économique. « Revenu » conserve l’extension possible de תְבוּאָה au-delà de la seule récolte.
  issues:
