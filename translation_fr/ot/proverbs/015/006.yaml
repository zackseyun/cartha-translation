  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: fr
  text: Dans la maison du juste, il y a de grandes richesses, mais le revenu du méchant est troublé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est ruiné »; le verbe hébreu peut évoquer le trouble, le malheur ou la ruine.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: la maison du juste
  rationale: Conserve l’image concrète de la maison tout en permettant le sens plus large de foyer, domaine et biens du juste; le singulier a une valeur représentative.
- source_word: חֹסֶן רָב
  choice: de grandes richesses
  rationale: חֹסֶן désigne ici des ressources, un trésor ou des richesses; רָב en marque l’abondance. Cette formulation française est naturelle et maintient le contraste économique avec תְבוּאָה.
- source_word: וּבִתְבוּאַת
  choice: mais les revenus
  rationale: La conjonction prend une valeur adversative dans le parallélisme. תְבוּאָה peut désigner les produits, la récolte ou, par extension, les revenus; « revenus » convient au contexte sapientiel et économique.
- source_word: רָשָׁע
  choice: du méchant
  rationale: Adjectif substantivé opposé à צַדִּיק; le singulier générique est conservé sans préciser le genre au-delà de la forme grammaticale française.
- source_word: נֶעְכָּרֶת
  choice: sont source de malheur
  rationale: Le verbe עכר exprime l’idée de troubler, de causer du malheur ou de mener à la ruine. La formulation rend naturellement en français la prédication portant sur les revenus, sans imposer exclusivement l’idée de destruction.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme antithétique est maintenu, ainsi que le singulier proverbial « le juste / le méchant ». Le marqueur [a] figure dans le texte après l’expression concernée.
