id: PRO.15.2
reference: Proverbs 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: fr
  text: La langue des sages présente bien la connaissance[a], mais la bouche des insensés répand la folie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait bon usage de la connaissance », « embellit la connaissance » ou « rend la connaissance attrayante ». Le verbe hébreu est causatif (« rend bonne ») et peut évoquer soit l’usage bénéfique que le sage fait de la connaissance, soit la manière dont il la présente.
    reason: lexical_alternative
  - marker: b
    text: Ou « fait jaillir » ou « déverse ». Le verbe hébreu évoque quelque chose qui s’écoule en abondance.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: la langue
  rationale: Conserve l’image concrète de l’organe de la parole, courante dans la littérature sapientielle hébraïque.
- source_word: חֲכָמִים
  choice: des sages
  rationale: Rend l’adjectif substantivé au pluriel comme une catégorie générale, sans précision de genre inutile.
- source_word: תֵּיטִיב
  choice: présente bien
  rationale: 'Exprime naturellement en français la valeur causative de יטב dans ce contexte : les sages donnent à la connaissance une forme bonne, utile ou attrayante, sans réduire le sens à une seule nuance.'
- source_word: דָּעַת
  choice: la connaissance
  rationale: Équivalent courant de דעת dans les Proverbes, qui maintient ici le contraste intellectuel et moral avec la folie.
- source_word: וּפִי
  choice: mais la bouche
  rationale: Le waw est rendu par « mais » afin d’expliciter l’opposition poétique entre les deux membres; « bouche » préserve l’image corporelle parallèle à « langue ».
- source_word: כְסִילִים
  choice: des insensés
  rationale: Terme naturel et digne pour la catégorie morale et intellectuelle désignée par כסילים dans les Proverbes.
- source_word: יַבִּיעַ
  choice: répand
  rationale: Rend l’image d’un contenu qui jaillit ou se déverse en abondance, dans un français fluide.
- source_word: אִוֶּלֶת
  choice: la folie
  rationale: Traduction habituelle de l’abstrait sapientiel désignant la qualité et les propos propres à l’insensé.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme concret « langue / bouche » est conservé. « Présente bien » privilégie l’intelligibilité tout en signalant en note l’ambiguïté réelle du causatif hébreu; « répand » restitue sobrement l’image d’abondance.
