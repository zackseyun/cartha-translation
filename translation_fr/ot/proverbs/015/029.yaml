id: PRO.15.29
reference: Proverbs 15:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: fr
  text: Yahvé[a] est loin des méchants, mais il entend la prière des justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom personnel de Dieu, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Précision sur le rendu du nom divin.
lexical_decisions:
- source_word: רָחוֹק
  choice: est loin de
  rationale: Cette formulation naturelle conserve l’image hébraïque de la distance sans la réduire à un éloignement géographique; dans le parallélisme, elle exprime surtout une distance morale et relationnelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte directement le nom divin YHWH. « Yahvé » en est la forme française courante et permet de le distinguer d’un simple titre comme « le Seigneur ».
- source_word: מֵרְשָׁעִים
  choice: des méchants
  rationale: Le pluriel désigne une catégorie de personnes caractérisées par leur méchanceté. « Les méchants » est concis et usuel dans la littérature de sagesse.
- source_word: וּתְפִלַּת
  choice: mais ... la prière
  rationale: Le waw relie les deux membres, mais leur opposition appelle naturellement « mais » en français. תְּפִלָּה signifie simplement « prière ».
- source_word: צַדִּיקִים
  choice: des justes
  rationale: Le terme désigne ceux qui se caractérisent par la justice. « Les justes » est la désignation collective traditionnelle et naturelle dans ce contexte sapiential.
- source_word: יִשְׁמָע
  choice: il entend
  rationale: Le verbe שׁמע signifie « entendre » ou « écouter ». « Il entend » préserve ici la formulation du texte sans expliciter abusivement une réponse automatique à la prière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le verset emploie le Tétragramme comme nom propre. Le rendre par « Yahvé » préserve cette fonction tout en utilisant une forme française connue.
- issue: Portée de la « distance » de Yahvé à l’égard des méchants
  choice: Conserver l’expression « est loin des méchants »
  alternative: Expliciter que Dieu est absent spatialement ou incapable de les entendre
  rationale: L’hébreu maintient une image de distance dont le parallélisme suggère une séparation morale et relationnelle. La traduction ne doit pas la transformer en affirmation métaphysique plus absolue.
- issue: Sens d’« entendre » la prière
  choice: il entend la prière
  alternative: il exauce la prière
  rationale: Dans un contexte de prière, שׁמע peut impliquer une attention favorable, mais « entend » conserve la tension lexicale sans promettre explicitement une réponse conforme à toute demande.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme antithétique du proverbe est conservé dans une phrase brève; « méchants » et « justes » gardent les catégories morales caractéristiques de la littérature de sagesse.
