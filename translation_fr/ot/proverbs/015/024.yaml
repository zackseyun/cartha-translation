  text: אֹ֣רַח חַ֭יִּים לְ/מַ֣עְלָ/ה לְ/מַשְׂכִּ֑יל לְמַ֥עַן ס֝֗וּר מִ/שְּׁא֥וֹל מָֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: fr
  text: Le chemin de la vie mène vers le haut pour l’homme avisé, afin qu’il se détourne du séjour des morts qui est en bas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: Le chemin de la vie
  rationale: Rend naturellement l’expression hébraïque tout en conservant sa portée sapientielle.
- source_word: לְמַעְלָה
  choice: monte
  rationale: Exprime la direction « vers le haut » en lien direct avec le chemin, et maintient le contraste avec « en bas ».
- source_word: לְמַשְׂכִּיל
  choice: pour l’homme avisé
  rationale: Le terme désigne une personne qui agit avec discernement et intelligence pratique; « avisé » convient au registre des Proverbes.
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Rend le shéol hébraïque comme le domaine des morts sans l’assimiler automatiquement à l’enfer au sens théologique ultérieur.
theological_decisions:
- issue: Relation exprimée par לְמַעַן
  choice: afin qu’il se détourne
  alternative: de sorte qu’il se détourne
  rationale: La conjonction peut marquer le but ou le résultat. « Afin que » conserve ici la nuance finale la plus directe sans préciser qui serait l’agent d’une intention.
- issue: Contraste spatial et théologique
  choice: monte… séjour des morts, en bas
  alternative: conduit vers les hauteurs… Shéol d’en bas
  rationale: Conserve l’opposition hébraïque entre le haut, associé au chemin de la vie, et le bas, associé au domaine des morts, sans développer une cosmologie non explicitée.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le parallélisme vertical du texte hébreu et évite le terme « enfer », trop interprétatif pour שְׁאוֹל.
