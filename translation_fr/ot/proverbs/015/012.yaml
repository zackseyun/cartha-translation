  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: fr
  text: Le moqueur n’aime pas celui qui le reprend ; il ne va pas vers les sages.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: le moqueur
  rationale: Dans la littérature sapientielle, le terme désigne une personne méprisante qui tourne en dérision la sagesse et la correction. « Le moqueur » est naturel en français moderne et conserve ce trait actif.
- source_word: יֶאֱהַב
  choice: n’aime pas
  rationale: Le verbe courant signifie « aimer ». La traduction directe préserve la formulation hébraïque sans l’intensifier en « déteste » ni l’affaiblir en simple préférence.
- source_word: הוֹכֵחַ לוֹ
  choice: qu’on le reprenne
  rationale: Le participe désigne ici l’action d’adresser une correction. La tournure impersonnelle française exprime naturellement que le moqueur n’aime pas la personne ou l’acte qui le reprend, sans donner à la réprimande une dureté excessive.
- source_word: אֶל חֲכָמִים
  choice: vers les sages
  rationale: La préposition אֶל marque le mouvement ou l’approche. « Vers les sages » rend cette orientation et emploie « les sages » comme catégorie générique, conformément à l’usage sapientiel.
- source_word: לֹא יֵלֵךְ
  choice: il ne va pas
  rationale: Dans ce proverbe, l’inaccompli peut exprimer une conduite habituelle ou une disposition persistante. Le présent français convient au caractère général de la maxime, tandis que « aller » est ici plus idiomatique que « marcher ».
theological_decisions:
- issue: Portée du masculin pluriel חֲכָמִים
  choice: les sages
  alternative: les hommes sages
  rationale: Bien que la forme hébraïque soit grammaticalement masculine plurielle, elle désigne vraisemblablement la catégorie générale des personnes sages plutôt qu’un groupe exclusivement masculin. « Les sages » conserve cette portée sans ajouter de restriction.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme est conservé par deux propositions brèves séparées par un point-virgule. La formulation reste digne et immédiatement compréhensible.
