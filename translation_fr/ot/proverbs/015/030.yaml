source:
  edition: WLC
  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: fr
  text: La lumière des yeux réjouit le cœur[a] ; une bonne nouvelle revigore jusqu’aux os[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’éclat des yeux », c’est-à-dire un regard lumineux ou joyeux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « engraisse l’os ». Cette image exprime une vigueur ou un réconfort qui atteint la personne en profondeur.'
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  choice: la lumière des yeux
  rationale: Cette traduction conserve l’image concrète et la relation construite de l’hébreu, sans trancher entre la lumière perçue par les yeux et l’éclat d’un regard.
- source_word: יְשַׂמַּח
  choice: réjouit
  rationale: Le piel exprime ici l’action de causer de la joie ; « réjouit » en restitue naturellement la valeur causative.
- source_word: לֵב
  choice: le cœur
  rationale: « Cœur » garde l’anthropologie imagée de l’hébreu et désigne la personne intérieure, sans réduire le terme aux seules émotions.
- source_word: שְׁמוּעָה טוֹבָה
  choice: une bonne nouvelle
  rationale: Le groupe nominal signifie un rapport ou une nouvelle favorable ; « une bonne nouvelle » est l’expression française courante et précise dans ce contexte.
- source_word: תְּדַשֶּׁן עָצֶם
  choice: revigore jusqu’aux os
  rationale: Le verbe évoque littéralement le fait d’engraisser, donc de rendre florissant ou vigoureux. Cette formulation française naturelle conserve l’image corporelle et l’idée d’un bienfait profond, tandis que la note signale la métaphore exacte.
