id: PRO.15.27
reference: Proverbs 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹכֵ֣ר בֵּ֭ית/וֹ בּוֹצֵ֣עַ בָּ֑צַע וְ/שׂוֹנֵ֖א מַתָּנֹ֣ת יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: fr
  text: 'Celui qui est avide de profit attire le malheur sur sa maison,

    mais celui qui déteste les pots-de-vin[a] vivra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cadeaux » ; dans ce contexte, il s’agit vraisemblablement de pots-de-vin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  choice: attire le malheur sur
  rationale: Le participe issu de עכר exprime le fait de causer trouble ou malheur. Cette formulation française rend clairement la relation de cause à effet sans aller jusqu’à l’idée de destruction totale.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: Le terme בַּיִת peut désigner la maison, la maisonnée ou la famille. « Sa maison » conserve l’image hébraïque tout en pouvant naturellement inclure le foyer.
- source_word: בּוֹצֵעַ בָּצַע
  choice: est avide de profit
  rationale: La construction associant le verbe et le nom de même racine souligne une recherche avide du gain, souvent moralement suspecte. « Avide de profit » préserve la concision et laisse le contexte exprimer la condamnation sans ajouter explicitement un qualificatif absent de l’hébreu.
- source_word: וְשׂוֹנֵא
  choice: mais celui qui déteste
  rationale: Bien que וְ puisse simplement signifier « et », le parallélisme antithétique appelle ici naturellement « mais » en français.
- source_word: מַתָּנוֹת
  choice: pots-de-vin
  rationale: Le nom signifie littéralement « cadeaux », mais il désigne dans ce contexte des présents intéressés susceptibles de corrompre. « Pots-de-vin » exprime ce sens contextuel, tandis que le sens lexical plus large est conservé en note.
- source_word: יִחְיֶה
  choice: vivra
  rationale: Cette forme de חיה peut évoquer la survie ou une vie préservée et prospère. « Vivra » garde la formulation brève et la portée ouverte de l’hébreu.
theological_decisions:
- issue: Portée de la promesse « vivra »
  choice: Conserver la déclaration concise « vivra »
  alternative: Préciser « préservera sa vie » ou « prospérera »
  rationale: Le texte sapiential ne précise pas s’il s’agit seulement de survie, de longévité ou d’une vie florissante. La traduction ne tranche donc pas cette tension.
translation_notes:
  register: Français moderne, international et proverbial. Le parallélisme est conservé en deux lignes, avec un vocabulaire courant mais digne. « Sa maison » maintient l’image concrète de l’hébreu tout en laissant entendre le foyer ou la famille.
