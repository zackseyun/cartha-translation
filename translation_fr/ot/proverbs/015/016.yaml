source:
  edition: WLC
  text: טוֹב מְ֭עַט בְּ/יִרְאַ֣ת יְהוָ֑ה מֵ/אוֹצָ֥ר רָ֝֗ב וּ/מְה֥וּמָה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
translation:
  language: fr
  text: Mieux vaut peu avec la crainte de Yahweh qu’un grand trésor avec de l’agitation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec du trouble » ou « avec de la confusion ». Le terme hébreu peut désigner l’agitation, le tumulte, le trouble ou la confusion.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Mieux vaut peu de biens
  rationale: Dans cette comparaison proverbiale sans verbe exprimé, טוֹב a le sens idiomatique de « mieux vaut ». « Peu de biens » explicite naturellement en français la faible quantité de ressources mise en contraste avec un grand trésor.
- source_word: בְּיִרְאַת יְהוָה
  choice: avec la crainte de Yahweh
  rationale: La préposition ב exprime ici l’accompagnement. La formulation conserve l’expression sapientielle et théologique « crainte de Yahweh » sans la réduire à la terreur ni la paraphraser entièrement par « respect ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מֵאוֹצָר רָב
  choice: qu’un grand trésor
  rationale: Le מִן marque la comparaison après טוֹב, tandis que אוֹצָר désigne un trésor ou des richesses accumulées et רָב leur abondance.
- source_word: וּמְהוּמָה בוֹ
  choice: accompagné d’agitation
  rationale: מְהוּמָה évoque une agitation troublée, le tumulte ou la confusion. Le pronom בוֹ renvoie naturellement au grand trésor et indique que cette agitation lui est associée.
theological_decisions:
- issue: Sens de « crainte de Yahweh » dans la littérature de sagesse
  choice: Conserver « la crainte de Yahweh » dans le texte principal
  alternative: « le respect de Yahweh » ou « la révérence envers Yahweh »
  rationale: Cette expression clé de Proverbes inclut respect, révérence et fidélité pieuse. La formulation littérale préserve sa portée canonique et son ampleur sans l’assimiler à une simple peur servile.
- issue: Rapport entre le trésor et מְהוּמָה
  choice: Comprendre l’agitation comme accompagnant le grand trésor
  alternative: « et de la confusion en lui »
  rationale: Le suffixe de בוֹ peut se rendre par une relation d’accompagnement ou de localisation. Le texte principal adopte un français naturel sans nier l’autre nuance, signalée en note.
translation_notes:
  register: Français international moderne, concis et proverbial. La tournure « Mieux vaut… que… » restitue naturellement la comparaison hébraïque. « Peu de biens » évite l’expression substantivée plus raide « un peu »; « accompagné d’agitation » maintient le lien de בוֹ avec le trésor tout en restant idiomatique.
