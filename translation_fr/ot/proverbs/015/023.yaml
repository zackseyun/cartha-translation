  text: שִׂמְחָ֣ה לָ֭/אִישׁ בְּ/מַעֲנֵה פִ֑י/ו וְ/דָבָ֖ר בְּ/עִתּ֣/וֹ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: fr
  text: Un homme se réjouit de la réponse de sa bouche[a] ; et une parole dite au bon moment[b], comme elle est bonne !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Pour un homme, il y a de la joie dans la réponse de sa bouche. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en son temps » ; on pourrait aussi traduire : « au moment opportun ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: de la joie
  rationale: Le nom désigne la joie ou l'allégresse. « De la joie » s'intègre naturellement à la construction française « trouver de la joie ».
- source_word: לָאִישׁ
  choice: Un homme trouve
  rationale: אִישׁ est un singulier masculin à valeur représentative. La tournure existentielle ou possessive marquée par ל est rendue en français courant par « trouve », sans modifier le sens.
- source_word: בְּמַעֲנֵה פִיו
  choice: dans la réponse que donne sa bouche
  rationale: מַעֲנֶה désigne une réponse, et פִיו signifie littéralement « sa bouche ». Cette formulation conserve l'image corporelle hébraïque tout en restant intelligible en français.
- source_word: וְדָבָר
  choice: et une parole
  rationale: Dans le parallélisme avec la réponse de la bouche, דָבָר désigne vraisemblablement une parole prononcée plutôt qu'une affaire.
- source_word: בְּעִתּוֹ
  choice: dite au bon moment
  rationale: Littéralement « en son temps ». Dans ce contexte, l'expression évoque une parole opportune ; « au bon moment » transmet naturellement cette nuance, tandis que la note conserve la forme plus littérale.
- source_word: מַה־טּוֹב
  choice: comme elle est bonne !
  rationale: La tournure hébraïque est exclamative. « Comme elle est bonne ! » en conserve la force et reprend clairement « une parole ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme et l'exclamation du proverbe sont préservés ; l'image hébraïque de la bouche est maintenue, avec une note signalant la construction plus formelle.
