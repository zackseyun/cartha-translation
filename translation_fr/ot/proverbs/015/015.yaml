source:
  edition: WLC
  text: כָּל יְמֵ֣י עָנִ֣י רָעִ֑ים וְ/טֽוֹב לֵ֝֗ב מִשְׁתֶּ֥ה תָמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/015.yaml
  text: All the days of the afflicted are bad[b][a], but a cheerful heart is a continual feast.
translation:
  language: fr
  text: Tous les jours du malheureux sont mauvais[a], mais un cœur joyeux est un festin continuel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pauvre » ou « de l’affligé »; le mot hébreu peut désigner une personne pauvre, affligée ou opprimée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « bon de cœur » ou « heureux de cœur »; l’expression hébraïque évoque ici une disposition intérieure heureuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Tous les jours
  rationale: Conserve l’image hébraïque de l’ensemble des jours, dans une tournure française naturelle.
- source_word: עָנִי
  choice: du malheureux
  rationale: Le terme peut désigner une personne pauvre, affligée ou opprimée. « Malheureux » garde ici une portée assez large sans réduire le proverbe à la pauvreté matérielle.
- source_word: רָעִים
  choice: sont mauvais
  rationale: Rend l’adjectif général sans lui donner nécessairement une portée morale; il qualifie ici la pénibilité des jours.
- source_word: וְטוֹב לֵב
  choice: mais un cœur joyeux
  rationale: Littéralement « bon de cœur »; dans ce contraste, l’expression désigne naturellement une disposition intérieure heureuse. « Cœur joyeux » communique ce sens en français moderne.
- source_word: מִשְׁתֶּה
  choice: un festin
  rationale: Le nom désigne un repas de fête ou un banquet; « festin » est concis et préserve l’image proverbiale.
- source_word: תָמִיד
  choice: perpétuel
  rationale: Exprime le caractère continuel du festin métaphorique dans une formulation française fluide.
theological_decisions: []
