  text: דֶּ֣רֶךְ עָ֭צֵל כִּ/מְשֻׂ֣כַת חָ֑דֶק וְ/אֹ֖רַח יְשָׁרִ֣ים סְלֻלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/019.yaml
  text: The way of the lazy is like a hedge of thorns[a], but the path of the upright is a raised highway.
translation:
  language: fr
  text: Le chemin du paresseux est comme une haie d’épines, mais le sentier des hommes droits est une chaussée surélevée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est aplanie » ou « est dégagée ». Le terme hébreu évoque une voie construite ou remblayée et, par extension, un parcours sans obstacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: chemin
  rationale: Terme courant pouvant désigner concrètement une voie et, par métaphore, la conduite ou le cours de la vie; « chemin » garde les deux dimensions.
- source_word: עָצֵל
  choice: le paresseux
  rationale: Désigne une personne habituellement paresseuse. Le singulier générique est naturel en français et convient au style proverbial.
- source_word: כִּמְשֻׂכַת
  choice: est comme une haie
  rationale: Le préfixe כְּ marque la comparaison, et מְשֻׂכָה désigne une haie ou une clôture formant obstacle.
- source_word: חָדֶק
  choice: d’épines
  rationale: Évoque des broussailles ou plantes épineuses; « haie d’épines » rend clairement l’image d’un obstacle pénible et infranchissable.
- source_word: אֹרַח
  choice: sentier
  rationale: Quasi-synonyme de דֶּרֶךְ; « sentier » maintient le champ métaphorique tout en reproduisant la variation lexicale du texte hébreu.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: Le mot qualifie ceux dont la conduite est moralement droite. « Les hommes droits » est clair et générique dans ce contexte proverbial.
- source_word: סְלֻלָה
  choice: est une route aménagée
  rationale: Forme issue de סלל, qui peut évoquer une voie remblayée, construite ou dégagée. « Route aménagée » conserve l’idée d’une voie préparée et sans obstacle sans imposer exclusivement l’élévation.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme entre l’obstacle épineux et la voie préparée est conservé. Le marqueur de note [a] suit l’expression dont le sens lexical admet plusieurs nuances.
