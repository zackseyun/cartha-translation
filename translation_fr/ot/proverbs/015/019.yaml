  rationale: La révision précise la traduction de סְלֻלָה par « chaussée surélevée », qui rend l’idée d’une voie bâtie ou remblayée. La note signale les nuances lexicales connexes sans imposer une lecture doctrinale ou réduire l’image à une seule abstraction.
