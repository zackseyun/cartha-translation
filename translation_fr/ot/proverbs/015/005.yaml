source:
  edition: WLC
  text: אֱוִ֗יל יִ֭נְאַץ מוּסַ֣ר אָבִ֑י/ו וְ/שֹׁמֵ֖ר תּוֹכַ֣חַת יַעְרִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/005.yaml
  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: fr
  text: L’insensé méprise la discipline de son père, mais celui qui tient compte de la réprimande devient avisé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais celui qui garde [ou observe] la réprimande se montre avisé » ou « agit avec prudence ». Le verbe traduit par « tient compte » signifie littéralement « garder » ou « observer » ; le dernier verbe peut désigner le fait de devenir avisé ou de faire preuve de prudence.'
    reason: alternative lexicale
lexical_decisions:
- source_word: אֱוִיל
  choice: l’insensé
  rationale: Terme courant de la littérature de sagesse pour une personne moralement et pratiquement dépourvue de sagesse, et non simplement peu intelligente.
- source_word: יִנְאַץ
  choice: méprise
  rationale: Le verbe exprime un rejet empreint de dédain, plus fort qu’un simple refus.
- source_word: מוּסַר
  choice: discipline
  rationale: Dans les Proverbes, le terme englobe la formation, l’instruction corrective et la correction parentale.
- source_word: אָבִיו
  choice: de son père
  rationale: L’hébreu nomme explicitement le père; la traduction conserve cette précision.
- source_word: וְשֹׁמֵר
  choice: mais celui qui tient compte
  rationale: Le participe signifie littéralement «garder» ou «observer»; dans ce contexte, il désigne l’accueil attentif et la mise en pratique d’une correction.
- source_word: תּוֹכַחַת
  choice: de la réprimande
  rationale: Le nom désigne une correction exprimée verbalement, un reproche destiné à ramener quelqu’un dans la bonne voie.
- source_word: יַעְרִם
  choice: agit avec prudence
  rationale: Le verbe peut exprimer le fait de devenir avisé ou de faire preuve de finesse; cette formulation rend l’idée positivement sans suggérer la ruse malveillante.
theological_decisions:
- issue: Langage parental genré
  choice: de son père
  alternative: de son parent
  rationale: Le texte hébreu mentionne précisément le père; neutraliser le terme effacerait une donnée du texte source.
- issue: Portée de יַעְרִם
  choice: agit avec prudence
  alternative: devient avisé / se montre fin
  rationale: Le contexte sapientiel favorise une qualité positive, mais la note conserve les nuances possibles entre acquisition de discernement et manifestation d’une habileté avisée.
translation_notes:
  register: Français moderne, sobre et proverbial. «L’insensé» garde le registre traditionnel de la sagesse tout en restant courant; «tient compte de» restitue naturellement l’attitude active exprimée par «garder».
