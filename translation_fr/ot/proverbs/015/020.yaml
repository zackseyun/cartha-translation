  yaml_path: translation/ot/proverbs/015/020.yaml
  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: fr
  text: Un fils sage fait la joie de son père, mais un homme insensé méprise sa mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּן
  choice: fils
  rationale: Le nom hébreu est masculin singulier et désigne naturellement un fils dans ce parallélisme proverbial.
- source_word: חָכָם
  choice: sage
  rationale: Dans la littérature sapientiale, le terme exprime une sagesse pratique et morale; « sage » est ici le rendu français le plus naturel.
- source_word: יְשַׂמַּח
  choice: fait la joie de
  rationale: La forme piel a un sens causatif, « rendre joyeux »; l’expression française choisie est actuelle et conserve cette valeur.
- source_word: אָב
  choice: son père
  rationale: Le possessif, implicite dans la relation entre le fils et le père, est requis par l’usage naturel du français et répond à l’explicite « sa mère » du second membre.
- source_word: כְסִיל
  choice: insensé
  rationale: Dans les Proverbes, le mot désigne celui qui manque de discernement moral et s’obstine dans sa conduite; « insensé » rend cette portée sans se limiter à une faible capacité intellectuelle.
- source_word: אָדָם
  choice: homme
  rationale: Le terme désigne ici un individu, en parallèle avec « fils », plutôt que l’humanité en général; « homme » respecte la formulation masculine du texte.
- source_word: בּוֹזֶה
  choice: méprise
  rationale: Le participe décrit une attitude caractéristique de dédain; « méprise » en restitue directement la force.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Le suffixe possessif est explicite en hébreu et doit être conservé.
