revisions:
- from: La folie fait la joie de celui qui manque de bon sens[a], mais l’homme intelligent va droit son chemin.
  to: La folie fait la joie de celui qui manque de jugement[a], mais l’homme de discernement dirige droit ses pas.
  rationale: La révision maintient la concision proverbiale et l’explication nécessaire de l’idiome « manquer de cœur ». Elle remplace « va droit son chemin » par « dirige droit ses pas » afin de rendre plus explicitement la valeur factitive de יְיַשֶׁר, tout en préservant l’image de la marche. « Homme de discernement » reflète plus précisément le vocabulaire de sagesse.
