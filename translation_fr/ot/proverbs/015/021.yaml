  text: אִ֭וֶּלֶת שִׂמְחָ֣ה לַ/חֲסַר לֵ֑ב וְ/אִ֥ישׁ תְּ֝בוּנָ֗ה יְיַשֶׁר לָֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: fr
  text: La folie fait la joie de celui qui manque de jugement[a], mais l’homme de discernement dirige droit ses pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui manque de cœur » ; en hébreu, cette expression désigne quelqu’un qui manque de bon sens ou de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: la folie
  rationale: Le nom abstrait désigne la folie comme disposition ou conduite et forme le contraste avec l’intelligence.
- source_word: שִׂמְחָה
  choice: fait la joie
  rationale: Cette tournure française naturelle rend le prédicat nominal hébreu sans développer excessivement l’expression.
- source_word: לַחֲסַר לֵב
  choice: de celui qui manque de bon sens
  rationale: Littéralement « qui manque de cœur » ; dans les Proverbes, l’expression désigne un défaut de discernement ou de jugement, non d’émotion.
- source_word: אִישׁ תְּבוּנָה
  choice: l’homme intelligent
  rationale: Conserve le masculin singulier représentatif du texte et rend תְּבוּנָה par une intelligence pratique et discernante.
- source_word: יְיַשֶׁר לָכֶת
  choice: va droit son chemin
  rationale: L’expression associe l’idée de marcher et celle d’aller droit. Cette formulation française préserve l’image de la conduite droite sans imposer un objet possessif absent de l’hébreu.
theological_decisions:
- issue: Masculin singulier représentatif
  choice: celui qui manque de bon sens… l’homme intelligent
  alternative: la personne qui manque de bon sens… la personne intelligente
  rationale: Le français masculin singulier maintient ici la forme proverbiale représentative de l’hébreu sans limiter nécessairement la maxime aux hommes.
- issue: Valeur de יְיַשֶׁר לָכֶת
  choice: va droit son chemin
  alternative: rend sa marche droite
  rationale: L’hébreu peut suggérer soit le fait de marcher droit, soit celui de rendre droite sa conduite. La formulation retenue garde l’image et une part de cette tension sans ajouter explicitement « son sentier ».
translation_notes:
  register: Français moderne, concis et proverbial. « Bon sens » explicite l’idiome hébreu, tandis que la note en conserve la forme littérale. « Va droit son chemin » garde le parallélisme entre discernement et conduite.
