review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend bien le prédicat nominal : la folie est source de joie pour la personne dépourvue de discernement. La note explique correctement l’idiome hébreu « manquer de cœur ». En revanche, יְיַשֶׁר est au piel et porte normalement une valeur factitive (« rend droit / dirige droit ») ; « va droit son chemin » privilégie une lecture intransitive et atténue cette valeur.'
  naturalness: « Fait la joie de » est naturel et convient au style proverbial. « Dirige droit ses pas » est une expression française moderne et idiomatique, tout en conservant l’image de la marche. « Homme de discernement » est plus précis dans ce contexte sapientiel que « homme intelligent », qui peut évoquer surtout les capacités intellectuelles.
  terminology: « Folie », « jugement » et « discernement » rendent convenablement les termes sapientiels hébreux. Le masculin singulier demeure représentatif, conformément à la forme du texte source.
  issues:
  - severity: medium
    issue: La traduction de יְיַשֶׁר par « va droit » ne rend pas suffisamment la valeur du piel.
    rationale: Le verbe hébreu signifie proprement « rendre droit, aplanir, diriger droit ». Une formulation française causative conserve mieux la force verbale sans trancher davantage que le texte sur la portée morale de l’image.
  - severity: low
    issue: « L’homme intelligent » est moins spécifique que תְּבוּנָה dans un proverbe de sagesse.
    rationale: « Discernement » exprime plus directement l’intelligence pratique et le jugement que désigne תְּבוּנָה.
  revised_text: La folie fait la joie de celui qui manque de jugement[a], mais l’homme de discernement dirige droit ses pas.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « qui manque de cœur » ; en hébreu, cette expression désigne quelqu’un qui manque de bon sens ou de jugement.'
    reason: lexical_alternative
  revision_rationale: La révision maintient la concision proverbiale et l’explication nécessaire de l’idiome « manquer de cœur ». Elle remplace « va droit son chemin » par « dirige droit ses pas » afin de rendre plus explicitement la valeur factitive de יְיַשֶׁר, tout en préservant l’image de la marche. « Homme de discernement » reflète plus précisément le vocabulaire de sagesse.
