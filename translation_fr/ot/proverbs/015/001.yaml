  text: מַֽעֲנֶה רַּ֭ךְ יָשִׁ֣יב חֵמָ֑ה וּ/דְבַר עֶ֝֗צֶב יַעֲלֶה אָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: fr
  text: Une réponse douce détourne la fureur, mais une parole blessante[a] fait monter la colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parole qui fait de la peine » ou « une parole dure ». L’expression hébraïque signifie littéralement « une parole de douleur ou de peine » et peut désigner une parole qui blesse et provoque ainsi la colère.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  choice: réponse
  rationale: Le nom désigne une réponse donnée dans un échange verbal. « Réponse » est naturel, précis et concis en français.
- source_word: רַךְ
  choice: douce
  rationale: L’adjectif signifie « doux » ou « tendre ». Ici, « douce » exprime clairement une manière de répondre qui apaise, sans réduire le terme au seul volume de la voix.
- source_word: יָשִׁיב
  choice: détourne
  rationale: Le hifil de שוב a ici le sens causatif de faire revenir ou d’écarter. Avec la fureur comme objet, « détourne » rend bien l’idée de désamorcer la colère.
- source_word: חֵמָה
  choice: fureur
  rationale: Le nom évoque une colère ardente et intense. « Fureur » préserve cette intensité tout en restant intelligible et digne.
- source_word: דְבַר
  choice: parole
  rationale: Dans cette construction, le terme désigne une parole prononcée. « Parole » convient au style proverbial français et reste proche de l’hébreu.
- source_word: עֶצֶב
  choice: blessante
  rationale: Le nom peut désigner la douleur, la peine ou ce qui les cause. « Blessante » exprime naturellement en français une parole qui fait mal et provoque ainsi la colère, tandis qu’une note conserve les autres nuances possibles.
- source_word: יַעֲלֶה
  choice: fait monter
  rationale: Le hifil de עלה signifie littéralement « faire monter ». « Fait monter » demeure naturel avec « colère » et conserve plus directement l’image causative de l’hébreu.
- source_word: אָף
  choice: colère
  rationale: Bien que le sens concret du nom soit « nez », il désigne couramment la colère par métonymie. « Colère » en donne ici le sens idiomatique clair.
theological_decisions: []
translation_notes:
  register: Formulation proverbiale concise, naturelle et digne en français international moderne. Le parallélisme est conservé entre la réponse qui apaise et la parole qui attise la colère; « fait monter » maintient l’image hébraïque sans devenir obscur.
