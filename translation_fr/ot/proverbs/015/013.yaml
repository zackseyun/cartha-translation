  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב פָּנִ֑ים וּ/בְ/עַצְּבַת לֵ֝ב ר֣וּחַ נְכֵאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/013.yaml
  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: fr
  text: Un cœur joyeux rend le visage radieux[a], mais le chagrin du cœur brise l’esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rend bon le visage » ; ou : « illumine le visage ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « abat l’esprit ». Littéralement : « dans/par le chagrin du cœur, l’esprit est brisé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: Dans les Proverbes, le terme désigne couramment la personne intérieure, notamment ses émotions et ses dispositions. « Cœur » est naturel en français et maintient le parallèle avec « esprit ».
- source_word: שָׂמֵחַ
  choice: joyeux
  rationale: L’adjectif exprime un état de joie. « Joyeux » convient à la portée générale et sapientielle de l’énoncé.
- source_word: יֵיטִב פָּנִים
  choice: rend le visage radieux
  rationale: Le hiphil de יטב signifie « rendre bon, améliorer ». Avec « visage », l’expression évoque idiomatiquement l’effet visible de la joie intérieure. Cette formulation conserve la causalité et l’image concrète.
- source_word: וּבְעַצְּבַת לֵב
  choice: mais le chagrin du cœur
  rationale: La conjonction introduit ici un contraste. Le nom exprime la peine ou le chagrin, et le préfixe ב peut avoir une valeur causale que le verbe français « abat » rend naturellement.
- source_word: רוּחַ
  choice: esprit
  rationale: Le mot renvoie ici à la disposition intérieure et à la force vitale de la personne, plutôt qu’au vent ou au souffle physique. « Esprit » préserve cette profondeur anthropologique.
- source_word: נְכֵאָה
  choice: abat
  rationale: L’adjectif hébreu décrit un esprit frappé, brisé ou abattu. La tournure verbale française « abat l’esprit » exprime naturellement l’effet causal du chagrin sans atténuer la force de l’image.
