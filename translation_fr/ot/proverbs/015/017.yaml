  rationale: La révision remplace une image française légèrement surinterprétative par une construction locative parallèle (« là où il y a »), qui reflète naturellement l’opposition hébraïque entre amour présent et haine présente. Les notes existantes sont conservées, car elles signalent adéquatement l’alternative concernant אָבוּס et l’ambiguïté du pronom final.
