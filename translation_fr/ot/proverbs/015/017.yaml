  text: ט֤וֹב אֲרֻחַ֣ת יָ֭רָק וְ/אַהֲבָה שָׁ֑ם מִ/שּׁ֥וֹר אָ֝ב֗וּס וְ/שִׂנְאָה בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/017.yaml
  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
translation:
  language: fr
  text: Mieux vaut un repas de légumes là où il y a de l’amour qu’un bœuf engraissé là où il y a de la haine[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’un bœuf nourri à l’étable » ; l’expression hébraïque peut souligner soit l’alimentation à l’étable, soit l’état engraissé qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « et la haine en lui » ; le pronom peut renvoyer au repas ou, plus largement, au cadre dans lequel il est pris.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette construction comparative avec מִן, la formule française idiomatique « Mieux vaut… que… » rend naturellement la valeur de טוֹב.
- source_word: אֲרֻחַת יָרָק
  choice: un repas de légumes
  rationale: אֲרֻחָה désigne un repas ou une portion de nourriture, et יָרָק des plantes vertes consommées comme aliments ; « repas de légumes » est clair et actuel.
- source_word: וְאַהֲבָה שָׁם
  choice: là où règne l’amour
  rationale: La formulation exprime naturellement la présence de l’amour dans le cadre du repas, tout en conservant la valeur locative de שָׁם.
- source_word: מִשּׁוֹר אָבוּס
  choice: qu’un bœuf engraissé
  rationale: שׁוֹר signifie « bœuf » et אָבוּס peut évoquer soit l’animal nourri à l’étable, soit son état engraissé ; le choix principal met en relief l’abondance du festin.
- source_word: וְשִׂנְאָה בוֹ
  choice: au milieu de la haine
  rationale: Cette tournure française restitue le contraste avec le lieu où règne l’amour et indique que la haine marque le repas ou son cadre, sans imposer un antécédent précis au pronom hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et proverbial. La structure antithétique est conservée ; « règne » et « au milieu de » rendent le cadre relationnel avec dignité sans alourdir la phrase.
