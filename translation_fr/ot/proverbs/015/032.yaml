id: PRO.15.32
reference: Proverbs 15:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פּוֹרֵ֣עַ מ֭וּסָר מוֹאֵ֣ס נַפְשׁ֑/וֹ וְ/שׁוֹמֵ֥עַ תּ֝וֹכַ֗חַת ק֣וֹנֶה לֵּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: fr
  text: Qui rejette l’instruction se méprise lui-même, mais qui écoute la réprimande acquiert du discernement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  choice: rejette l’instruction
  rationale: Le participe פּוֹרֵעַ exprime ici le fait de négliger, repousser ou rejeter la discipline; «rejette» rend clairement l’opposition volontaire, tandis qu’«instruction» couvre la formation corrective de מוּסָר.
- source_word: מוֹאֵס נַפְשׁוֹ
  choice: se méprise lui-même
  rationale: נֶפֶשׁ avec le suffixe renvoie ici à la personne elle-même. La tournure française naturelle «se méprise lui-même» conserve la force de מוֹאֵס sans suggérer seulement une faible estime de soi.
- source_word: שׁוֹמֵעַ תּוֹכַחַת
  choice: écoute la réprimande
  rationale: שׁמע implique une écoute réceptive; תּוֹכַחַת désigne une correction verbale qui met en lumière une faute. «Réprimande» est direct, courant et adapté au parallélisme.
- source_word: קֹנֶה לֵב
  choice: acquiert du discernement
  rationale: Littéralement «acquiert un cœur». Dans l’anthropologie sapientielle hébraïque, לֵב désigne ici la faculté de comprendre et de juger; «discernement» rend ce sens en français moderne tout en gardant l’idée d’une qualité acquise.
theological_decisions:
- issue: Sens de נַפְשׁוֹ
  choice: lui-même
  alternative: sa vie / son âme
  rationale: Dans ce proverbe, le terme désigne la personne dans son ensemble. «Lui-même» évite d’introduire une distinction théologique entre âme et corps absente du parallélisme.
- issue: Métaphore «acquérir un cœur»
  choice: acquiert du discernement
  alternative: acquiert un cœur
  rationale: Le calque serait obscur en français courant. Le contexte sapientiel indique la compréhension ou le bon jugement, sans exiger une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, concis et proverbial. Le parallélisme antithétique est conservé, avec des termes dignes et immédiatement compréhensibles.
