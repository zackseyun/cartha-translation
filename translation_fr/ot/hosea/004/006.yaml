source:
  edition: WLC
  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
translation:
  language: fr
  text: 'Mon peuple est anéanti faute de connaissance[a]. Puisque toi, tu as rejeté la connaissance, moi aussi, je te rejetterai : tu ne seras plus prêtre pour moi. Tu as oublié l’enseignement[b] de ton Dieu ; moi aussi, j’oublierai tes enfants[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « périt », « est réduit au silence » ou « est retranché ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la loi ». Le mot hébreu torah peut désigner la loi aussi bien que l’enseignement ou l’instruction.
    reason: lexical_alternative
  - marker: c
    text: Ou « tes fils », si le pluriel masculin hébreu est pris dans un sens plus restreint.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמוּ
  choice: est anéanti
  rationale: Le niphal de דמה exprime ici la ruine ou la disparition du peuple dans un contexte de jugement. Le présent à valeur résultative rend la force déclarative de l’accompli hébreu.
- source_word: מִבְּלִי הַדָּעַת
  choice: faute de connaissance
  rationale: Cette tournure française naturelle exprime clairement la privation qui cause la ruine.
- source_word: הַדָּעַת / הַדַּעַת
  choice: la connaissance
  rationale: Le terme garde sa portée relationnelle, morale et religieuse dans Osée sans ajouter explicitement « de Dieu », absent de ces propositions.
- source_word: מָאַסְתָּ
  choice: tu as rejeté
  rationale: « Rejeter » rend la répudiation volontaire exprimée par מאס et prépare la réciprocité du jugement.
- source_word: וְאֶמְאָסְאֲךָ
  choice: moi aussi, je te rejetterai
  rationale: Le futur français convient à l’imparfait hébreu de jugement et souligne la réponse symétrique de Dieu.
- source_word: מִכַּהֵן לִי
  choice: tu ne seras plus mon prêtre
  rationale: La construction exprime l’exclusion de la fonction sacerdotale. Cette formulation est naturelle en français tout en conservant la relation « pour moi » sous la forme possessive « mon ».
- source_word: וַתִּשְׁכַּח
  choice: tu as oublié
  rationale: Le passé composé relie l’action antérieure à la culpabilité présente et conserve le verbe concret repris dans le jugement divin.
- source_word: תּוֹרַת אֱלֹהֶיךָ
  choice: l’enseignement de ton Dieu
  rationale: תורה désigne ici l’instruction divine et ne se limite pas nécessairement à un code juridique. « Enseignement » préserve cette largeur sémantique.
- source_word: אֶשְׁכַּח
  choice: j’oublierai
  rationale: Le futur et la répétition d’« oublier » maintiennent la symétrie sévère de l’hébreu sans expliquer la métaphore.
- source_word: בָּנֶיךָ
  choice: tes enfants
  rationale: Le masculin pluriel בנים peut désigner collectivement la descendance ; « enfants » évite de restreindre indûment le référent aux fils.
theological_decisions:
- issue: Portée de « connaissance » dans l’accusation d’Osée
  choice: Conserver simplement « connaissance »
  alternative: « connaissance de Dieu »
  rationale: Le contexte donne au mot une portée d’alliance et de relation avec Dieu, mais le complément « de Dieu » n’apparaît pas dans cette proposition ; l’ajouter résoudrait implicitement ce que le texte laisse condensé.
- issue: Référent du « tu » singulier
  choice: Maintenir le singulier et le langage sacerdotal sans préciser davantage l’identité du destinataire
  alternative: Employer un pluriel visant l’ensemble des prêtres ou d’Israël
  rationale: La fonction sacerdotale favorise un représentant du sacerdoce, mais le texte emploie le singulier et ne tranche pas explicitement entre un individu représentatif et un collectif personnifié.
- issue: Sens de תורה
  choice: « enseignement » dans le texte principal
  alternative: « loi »
  rationale: « Enseignement » rend la portée fondamentale de תורה sans réduire le terme à des prescriptions légales ; « loi » demeure une traduction traditionnelle possible, signalée en note.
- issue: Portée de בָּנֶיךָ
  choice: « tes enfants »
  alternative: « tes fils »
  rationale: Le pluriel masculin peut avoir une portée générique et désigner la descendance ; la traduction choisie conserve cette possibilité sans exclure une lecture plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « connaissance », « rejeter » et « oublier » conserve les parallélismes accusatoires et la réciprocité du jugement. L’incise « toi » puis « moi aussi » rend l’opposition emphatique des pronoms hébreux sans alourdir excessivement le verset.
