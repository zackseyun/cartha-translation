source:
  edition: WLC
  text: חֲב֧וּר עֲצַבִּ֛ים אֶפְרָ֖יִם הַֽנַּֽח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/017.yaml
  text: Ephraim is joined to idols[a]; leave him alone.
translation:
  language: fr
  text: Éphraïm est attaché aux idoles ; laisse-le[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Éphraïm est lié aux idoles ; laisse-le tranquille. » L’hébreu est très concis, et l’ordre final peut exprimer l’abandon d’Éphraïm à l’idolâtrie qu’il a choisie.'
    reason: Variante lexicale et ambiguïté sur la portée de l’impératif final.
lexical_decisions:
- source_word: חֲבוּר
  choice: est attaché
  rationale: Le participe passif exprime un lien établi avec les idoles. « Est attaché » est naturel en français et conserve l’idée d’un lien fort sans en préciser excessivement la nature.
- source_word: עֲצַבִּים
  choice: idoles
  rationale: Dans la polémique prophétique, le terme désigne couramment des représentations cultuelles considérées comme des idoles. « Idoles » restitue clairement la portée religieuse et critique du contexte.
- source_word: אֶפְרָיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé. Dans Osée, il peut désigner par métonymie le royaume du Nord, mais cette explicitation n’est pas introduite dans le corps du texte.
- source_word: הַנַּח
  choice: laisse… tranquille
  rationale: L’impératif signifie laisser en repos, ne plus intervenir ou ne pas importuner. « Laisse-le tranquille » est idiomatique en français moderne et garde la brusquerie de l’ordre.
- source_word: לוֹ
  choice: le
  rationale: Le suffixe masculin singulier renvoie naturellement à Éphraïm, personnifié comme entité collective.
theological_decisions:
- issue: Référent d’Éphraïm
  choice: Le nom Éphraïm est maintenu comme sujet, sans développement dans le texte principal.
  alternative: Comprendre Éphraïm comme une désignation du royaume du Nord ou d’Israël.
  rationale: Cette formulation conserve la personnification et la rhétorique prophétique sans transformer une métonymie probable en explicitation interprétative.
- issue: Portée de l’impératif final
  choice: 'L’ordre demande à un interlocuteur implicite de ne plus intervenir auprès d’Éphraïm : « laisse-le tranquille ».'
  alternative: « Laisse-le » ou « qu’on le laisse », éventuellement avec l’idée de l’abandonner à son idolâtrie choisie.
  rationale: L’hébreu est extrêmement concis et ne nomme pas l’interlocuteur. La formulation retenue rend le sens le plus direct tout en signalant dans la note la nuance possible d’abandon.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase brève et abrupte reproduit la concision de l’hébreu ; « attaché » évite une tournure trop technique, tandis que la note préserve « lié » et la nuance possible d’abandon.
