  text: סָ֖ר סָבְאָ֑/ם הַזְנֵ֣ה הִזְנ֔וּ אָהֲב֥וּ הֵב֛וּ קָל֖וֹן מָגִנֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
translation:
  language: fr
  text: Quand leur boisson est finie[a], ils s’adonnent à la prostitution ; ses boucliers aiment passionnément la honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand leur boisson a tourné » ou « Quand leur ivresse est passée ». Le début du verset est difficile en hébreu : il peut évoquer la fin d’une beuverie ou une boisson qui s’est gâtée.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement « ses boucliers », image qui désigne probablement ses dirigeants ou ses protecteurs. La construction de la fin du verset est difficile ; on peut aussi comprendre plus littéralement : « ils aiment : “Donnez la honte !” ».'
    reason: alternative_reading
lexical_decisions:
- source_word: סָר סָבְאָם
  choice: leur boisson est finie
  rationale: סור signifie littéralement « se détourner, s’en aller ». Avec סָבְאָם, la formule peut évoquer une boisson épuisée, gâtée, ou la fin de l’ivresse. La traduction retenue reste naturelle tout en signalant l’incertitude en note.
- source_word: הַזְנֵה הִזְנוּ
  choice: ils se livrent sans cesse à la prostitution
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie ou souligne l’action. « Se livrent sans cesse » restitue cette insistance et conserve l’image concrète de la prostitution, importante chez Osée.
- source_word: אָהֲבוּ הֵבוּ קָלוֹן
  choice: aiment passionnément la honte
  rationale: La construction est difficile. אָהֲבוּ signifie « ils aiment » et קָלוֹן « honte, déshonneur ». הֵבוּ peut être compris comme un élément intensif dans cette expression, d’où « passionnément », sans masquer l’autre analyse possible donnée en note.
- source_word: מָגִנֶּיהָ
  choice: ses boucliers
  rationale: Le sens littéral est « ses boucliers ». L’image peut désigner les dirigeants ou protecteurs du pays ; le texte conserve la métaphore hébraïque et la note en explicite le référent probable.
theological_decisions:
- issue: Faut-il atténuer l’image de la prostitution en la rendant simplement par l’infidélité ?
  choice: Conserver « prostitution » dans le texte principal.
  alternative: « ils sont totalement infidèles »
  rationale: Chez Osée, l’image sexuelle exprime avec force l’infidélité d’Israël. La remplacer par une abstraction résoudrait indûment la tension voulue par le prophète.
- issue: Faut-il interpréter מָגִנֶּיהָ directement comme « ses dirigeants » ?
  choice: Conserver l’image littérale « ses boucliers ».
  alternative: « ses dirigeants » ou « ses protecteurs »
  rationale: La métaphore est authentique et son référent n’est pas entièrement explicite. Une note permet d’aider le lecteur sans effacer l’image.
- issue: Comment rendre la construction obscure אָהֲבוּ הֵבוּ קָלוֹן ?
  choice: « aiment passionnément la honte »
  alternative: '« ils aiment : “Donnez la honte !” »'
  rationale: La lecture intensive produit un français intelligible et correspond à une analyse reconnue, tandis que la note préserve la lecture plus littérale de הֵבוּ comme impératif « donnez ! ».
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve les images fortes et l’obscurité réelle de l’hébreu, avec des notes concises pour les principales variantes.
