  text: אַ֥ךְ אִ֛ישׁ אַל יָרֵ֖ב וְ/אַל יוֹכַ֣ח אִ֑ישׁ וְ/עַמְּ/ךָ֖ כִּ/מְרִיבֵ֥י כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
translation:
  language: fr
  text: Pourtant, que nul ne conteste, que nul ne reprenne[a], car ton peuple est comme ceux qui contestent un prêtre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier corriger, réprimander ou argumenter.
    reason: lexical_alternative
  - marker: b
    text: Cette comparaison peut rappeler la gravité du refus d’un jugement rendu par un prêtre selon la Loi ; voir Deutéronome 17.12.
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: Pourtant
  rationale: Marque ici une transition adversative nette avec l’accusation précédente, tout en gardant le caractère abrupt de l’hébreu.
- source_word: אִישׁ … אִישׁ
  choice: personne … personne
  rationale: Le nom masculin singulier a ici une portée générique. La tournure négative française « personne » restitue naturellement cette portée et conserve la répétition emphatique.
- source_word: אַל יָרֵב
  choice: que personne ne cherche querelle
  rationale: ריב peut désigner une dispute, une contestation ou une accusation de caractère juridique. « Chercher querelle » reste naturel en français et permet de reprendre la même expression dans la comparaison finale.
- source_word: וְאַל יוֹכַח
  choice: que personne ne fasse de reproches
  rationale: Au hiphil, יכח peut signifier reprendre, réprimander, corriger ou argumenter. « Faire des reproches » conserve ici la dimension corrective sans imposer un cadre judiciaire.
- source_word: וְעַמְּךָ
  choice: car ton peuple
  rationale: 'La conjonction est comprise comme explicative : la proposition qui suit donne la raison de l’interdiction précédente. Le singulier de l’adresse est conservé par « ton ».'
- source_word: כִּמְרִיבֵי
  choice: est comme ceux qui cherchent querelle
  rationale: Le préfixe כְּ introduit une comparaison, et le participe de ריב décrit des personnes caractérisées par la contestation. La reprise de « chercher querelle » fait entendre la répétition de la racine présente dans l’hébreu.
- source_word: כֹהֵן
  choice: à un prêtre
  rationale: Le singulier paraît générique plutôt que nécessairement défini ; « un prêtre » exprime cette valeur de classe.
theological_decisions:
- issue: Portée de la comparaison finale avec ceux qui cherchent querelle à un prêtre
  choice: Conserver une comparaison générale décrivant le refus rebelle de toute correction
  alternative: Y voir une allusion précise à la loi de Deutéronome 17.12 sur le refus du jugement sacerdotal
  rationale: Le texte présente clairement une comparaison, mais ne précise pas si l’allusion juridique est directe. La traduction garde donc cette tension et réserve le rapprochement possible à une note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « chercher querelle » reproduit le lien lexical créé par la racine ריב au début et à la fin du verset. Le tutoiement singulier conserve l’adresse hébraïque à « ton peuple ».
