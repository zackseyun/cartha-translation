revisions:
- from: Car Israël est aussi rétif qu’une génisse rétive ; maintenant, Yahweh les fera paître comme un agneau dans un vaste espace.[a]
  to: Car, comme une génisse rétive, Israël est rétif ; maintenant, Yahweh les fera paître comme un agneau dans un lieu spacieux.[a]
  rationale: La révision rétablit de manière plus transparente la double occurrence du vocabulaire de la rébellion dans le texte hébreu, tout en améliorant légèrement l’idiomaticité de l’expression spatiale et de la note. Elle ne tranche pas la portée, favorable ou judiciaire, de l’image pastorale finale.
