  text: כִּ֚י כְּ/פָרָ֣ה סֹֽרֵרָ֔ה סָרַ֖ר יִשְׂרָאֵ֑ל עַתָּה֙ יִרְעֵ֣/ם יְהוָ֔ה כְּ/כֶ֖בֶשׂ בַּ/מֶּרְחָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/016.yaml
  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
translation:
  language: fr
  text: Car, comme une génisse rétive, Israël est rétif ; maintenant, Yahweh les fera paître comme un agneau dans un lieu spacieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un mouton dans un espace ouvert » ou « dans un lieu spacieux ». L’image hébraïque peut évoquer soit un pâturage ouvert, soit une exposition vulnérable sous le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’accusation et du jugement précédents.
- source_word: כְּפָרָה
  choice: comme une génisse
  rationale: פָרָה désigne une vache ; « génisse » conserve ici l’image agricole féminine de manière précise et naturelle.
- source_word: סֹרֵרָה / סָרַר
  choice: ré­tif / rétive
  rationale: La répétition du même radical hébreu est conservée par la répétition de l’adjectif, lequel évoque naturellement un animal qui refuse de se laisser conduire.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom propre.
- source_word: עַתָּה
  choice: maintenant
  rationale: Marque la conséquence qui découle de l’obstination d’Israël.
- source_word: יִרְעֵם
  choice: les fera paître
  rationale: Le verbe רעה signifie faire paître, nourrir ou conduire comme un berger. Cette formulation maintient l’image pastorale sans en imposer une lecture exclusivement bienveillante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que substitution par un titre.
- source_word: כְּכֶבֶשׂ
  choice: comme un agneau
  rationale: כֶּבֶשׂ désigne couramment un agneau ou un jeune mouton ; « agneau » conserve l’image singulière et sa possible vulnérabilité.
- source_word: בַּמֶּרְחָב
  choice: dans un vaste espace
  rationale: מֶרְחָב désigne un lieu large ou spacieux. « Vaste espace » est idiomatique en français tout en laissant ouvertes les idées de pâturage libre, de dispersion ou d’exposition.
theological_decisions:
- issue: Tonalité de la proposition finale
  choice: Conserver l’ambiguïté entre la conduite pastorale et l’exposition vulnérable sous le jugement.
  alternative: Présenter soit une sollicitude pastorale sans réserve, soit un abandon explicite au danger.
  rationale: L’image hébraïque d’un agneau dans un lieu spacieux peut suggérer aussi bien l’ampleur d’un pâturage que l’isolement et l’exposition. La traduction ne tranche pas ce que le texte laisse en tension.
translation_notes:
  register: Français moderne, international et digne. « Rétif » restitue avec concision l’obstination appliquée au bétail et permet de reproduire l’insistance du radical hébreu. La ponctuation garde le lien entre la rébellion et sa conséquence.
