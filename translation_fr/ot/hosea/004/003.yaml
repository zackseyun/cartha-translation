source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
translation:
  language: fr
  text: C’est pourquoi le pays est en deuil[a], et tous ceux qui l’habitent dépérissent, avec les animaux des champs et les oiseaux du ciel ; même les poissons de la mer disparaissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre est en deuil ». Le mot hébreu peut désigner soit le pays, soit la terre ; ici, le contexte du jugement contre Israël favorise « le pays ».
    reason: alternative_reading
  - marker: b
    text: Ou « sont emportés » ; plus littéralement, « sont rassemblés ». Le verbe évoque ici leur retrait ou leur disparition sous l’effet du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: est en deuil
  rationale: Le verbe exprime normalement le deuil ou la lamentation. La formulation conserve la personnification du pays sans la réduire à l’idée physique de dessèchement.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte immédiat d’un jugement prononcé contre Israël, le territoire du peuple est probablement visé, même si « la terre » reste lexicalement possible.
- source_word: וְאֻמְלַל
  choice: dépérissent
  rationale: Le verbe évoque l’affaiblissement et le flétrissement. « Dépérir » convient à l’ensemble des habitants, humains et animaux, et garde ouverte la nature exacte de leur déclin.
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: tous ceux qui l’habitent
  rationale: Le participe singulier précédé de כָּל a une valeur collective. Cette tournure française naturelle en restitue la portée globale.
- source_word: בְּחַיַּת הַשָּׂדֶה
  choice: avec les animaux des champs
  rationale: La préposition associe les animaux au sort des habitants. « Animaux des champs » garde la catégorie biblique tout en restant compréhensible en français actuel.
- source_word: וּבְעוֹף הַשָּׁמָיִם
  choice: et les oiseaux du ciel
  rationale: « Du ciel » est naturel en français moderne et correspond à l’expression hébraïque sans solennité artificielle.
- source_word: וְגַם
  choice: même
  rationale: 'Le terme marque ici une progression culminante : le jugement atteint jusqu’aux poissons de la mer.'
- source_word: דְּגֵי הַיָּם
  choice: les poissons de la mer
  rationale: Traduction directe qui préserve la série animaux terrestres, oiseaux et poissons.
- source_word: יֵאָסֵפוּ
  choice: disparaissent
  rationale: Le nifal de אסף peut signifier être rassemblé, retiré ou emporté. Dans ce contexte de jugement, « disparaissent » communique le résultat sans préciser indûment le mécanisme ni imposer explicitement la mort.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: L’oracle vise immédiatement Israël et son territoire. « Le pays » rend donc le sens contextuel le plus probable, tandis qu’une note conserve la portée lexicale plus large possible.
- issue: Nature du sort des poissons exprimé par יֵאָסֵפוּ
  choice: disparaissent
  alternative: sont emportés / sont rassemblés
  rationale: Le contexte indique leur retrait sous l’effet du jugement, mais le verbe ne précise pas exactement comment. La traduction évite de trancher entre disparition, enlèvement et mort.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification du pays est conservée, ainsi que la progression qui étend le jugement aux êtres humains, aux animaux terrestres, aux oiseaux et jusqu’aux poissons.
