  to: Je ne punirai pas vos filles lorsqu’elles se prostituent, ni vos belles-filles lorsqu’elles commettent l’adultère; car eux-mêmes se mettent à l’écart[a] avec les prostituées et offrent des sacrifices avec les femmes consacrées[b]. Un peuple qui ne comprend pas va à sa perte[c].
