source:
  edition: WLC
  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
translation:
  language: fr
  text: Je ne punirai pas vos filles lorsqu’elles se prostituent, ni vos belles-filles lorsqu’elles commettent l’adultère; car eux-mêmes se mettent à l’écart[a] avec les prostituées et offrent des sacrifices avec les femmes consacrées[b]. Un peuple qui ne comprend pas va à sa perte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « se séparer » ou « se mettre à part »; ici, il évoque probablement le fait de se retirer avec des prostituées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « femmes consacrées ». Dans ce contexte, le terme peut désigner des femmes liées à un culte illicite; certains y voient des « prostituées cultuelles » ou des « prostituées de temple », mais cette interprétation reste discutée.
    reason: textual_or_lexical_uncertainty
  - marker: c
    text: Le dernier verbe hébreu est rare. Il peut évoquer le fait d’être renversé, jeté à terre ou plongé dans la confusion; le sens général est celui d’une issue désastreuse.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: אֶפְקוֹד
  choice: je ne punirai pas
  rationale: Avec עַל dans un contexte de jugement, פקד signifie demander des comptes ou intervenir pour punir. « Punir » exprime clairement ce sens judiciaire en français moderne.
- source_word: תִזְנֶינָה
  choice: elles se prostituent
  rationale: Le verbe זנה désigne ici une conduite sexuelle illicite et conserve, chez Osée, l’image concrète de la prostitution.
- source_word: כַלּוֹתֵיכֶם
  choice: vos belles-filles
  rationale: Le pluriel construit de כלה désigne ici les épouses des fils, plutôt que de simples fiancées ou jeunes mariées.
- source_word: תְנָאַפְנָה
  choice: elles commettent l’adultère
  rationale: נאף désigne précisément l’adultère; la traduction le distingue donc de זנה.
- source_word: הֵם
  choice: eux-mêmes
  rationale: Le pronom masculin pluriel met en relief la participation des hommes, sans ajouter dans le corps du texte un substantif absent de l’hébreu.
- source_word: יְפָרֵדוּ
  choice: s’isolent
  rationale: פרד signifie littéralement se séparer ou se mettre à part. Dans ce contexte, « s’isoler avec » rend l’euphémisme probable sans expliciter davantage l’acte.
- source_word: הַזֹּנוֹת
  choice: les prostituées
  rationale: Traduction directe et actuelle du terme féminin pluriel dérivé de זנה.
- source_word: הַקְּדֵשׁוֹת
  choice: des prostituées rituelles
  rationale: Le terme désigne des femmes liées à un culte illicite et, dans ce parallèle, à une pratique sexuelle. « Rituelles » conserve la dimension cultuelle sans imposer un cadre institutionnel précis comme celui d’un temple.
- source_word: יְזַבֵּחוּ
  choice: offrent des sacrifices
  rationale: Cette formulation française naturelle rend explicitement l’acte sacrificiel exprimé par זבח.
- source_word: וְעָם לֹא יָבִין
  choice: un peuple qui ne comprend pas
  rationale: La tournure garde la valeur générique du nom עם sans article et rend simplement לא יבין.
- source_word: יִלָּבֵט
  choice: va à sa perte
  rationale: Ce verbe rare évoque une chute, un renversement ou une ruine. La formule exprime naturellement l’issue désastreuse sans prétendre trancher son sens exact.
theological_decisions:
- issue: La non-punition annoncée aux filles et aux belles-filles
  choice: Maintenir l’énoncé selon lequel Dieu ne les punira pas, puis sa justification par la conduite parallèle des hommes.
  alternative: Reformuler comme si les femmes étaient déclarées innocentes ou comme si Dieu excusait définitivement leur conduite.
  rationale: La proposition causale introduite par כִּי met en cause les hommes eux-mêmes. La traduction conserve la tension du texte sans transformer la non-intervention annoncée en absolution morale.
- issue: Le sens de קְדֵשׁוֹת
  choice: prostituées rituelles
  alternative: femmes consacrées; prostituées de temple
  rationale: Le parallèle avec les prostituées et le contexte cultuel favorisent une désignation cultico-sexuelle. La formulation choisie évite toutefois d’affirmer que leur activité était nécessairement rattachée à un temple précis.
translation_notes:
  register: Français international moderne, digne et accessible. Les parallèles verbaux sont conservés, tandis que « eux-mêmes » maintient l’insistance du pronom masculin hébreu. Les notes signalent les principales incertitudes lexicales sans alourdir le verset.
