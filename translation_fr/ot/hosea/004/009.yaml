id: HOS.4.9
reference: Hosea 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֥ה כָ/עָ֖ם כַּ/כֹּהֵ֑ן וּ/פָקַדְתִּ֤י עָלָי/ו֙ דְּרָכָ֔י/ו וּ/מַעֲלָלָ֖י/ו אָשִׁ֥יב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/009.yaml
  text: 'And it will be: like people[a], like priest. And I will punish him for his ways[b], and repay him for his deeds.'
translation:
  language: fr
  text: Il en sera du peuple comme du prêtre[a]. Je le punirai pour ses voies[b] et je lui rendrai selon ses actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme le peuple, comme le prêtre ». Cette comparaison très concise indique que le peuple et le prêtre subiront pareillement le jugement.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici des pronoms au singulier (« le », « ses », « lui »). Ils peuvent avoir un sens distributif pour l’ensemble du groupe, ou viser plus précisément le prêtre.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Il en sera
  rationale: Cette tournure française naturelle exprime l’état ou la situation à venir introduite par le verbe hébreu, sans ajouter de lien causal.
- source_word: כָעָם כַּכֹּהֵן
  choice: du peuple comme du prêtre
  rationale: La formule conserve la comparaison concise et proverbiale entre peuple et prêtre, tout en restant idiomatique en français moderne.
- source_word: וּפָקַדְתִּי עָלָיו
  choice: Je le punirai
  rationale: Dans ce contexte de jugement, פקד avec על signifie demander compte ou punir. « Punirai » rend clairement la portée judiciaire et maintient le pronom singulier.
- source_word: דְּרָכָיו
  choice: ses voies
  rationale: Le terme désigne ici la manière de vivre ou la conduite. « Voies » préserve l’image hébraïque courante dans le langage prophétique.
- source_word: וּמַעֲלָלָיו
  choice: ses actes
  rationale: מַעֲלָלִים désigne des actions envisagées sous leur dimension morale ; « actes » est clair, sobre et actuel.
- source_word: אָשִׁיב לוֹ
  choice: je lui rendrai
  rationale: Le hiphil de שוב avec ל exprime ici la rétribution. Cette formulation conserve l’image d’un retour à l’auteur de ce qu’il a fait, explicitée par « selon ses actes ».
theological_decisions:
- issue: Référent et nombre des pronoms singuliers dans l’annonce du jugement
  choice: Maintenir les pronoms au singulier (« le », « ses », « lui »), conformément à l’hébreu.
  alternative: Employer le pluriel (« les », « leurs ») pour appliquer explicitement la sentence au peuple et aux prêtres, ou comprendre le singulier comme visant uniquement le prêtre.
  rationale: Le singulier peut avoir une valeur distributive ou collective, mais il peut aussi recentrer la parole sur le prêtre. Le conserver évite de trancher une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure proverbiale reste concise ; « voies » conserve l’imagerie prophétique, tandis que les pronoms singuliers et leur ambiguïté sont maintenus.
