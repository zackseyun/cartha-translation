  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
translation:
  language: fr
  text: Sur les sommets des montagnes, ils offrent des sacrifices, et sur les collines, ils brûlent des offrandes[a], sous le chêne, le peuplier et le térébinthe[b], car leur ombre est agréable. C’est pourquoi vos filles se prostituent[c], et vos belles-filles commettent l’adultère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils brûlent de l’encens ». Le verbe hébreu peut désigner précisément l’encens brûlé ou, plus largement, des offrandes que l’on fait monter en fumée.
    reason: lexical_alternative
  - marker: b
    text: Les arbres sont traditionnellement identifiés au chêne, au peuplier et au térébinthe, mais leurs équivalents botaniques exacts ne sont pas entièrement certains.
    reason: cultural_note
  - marker: c
    text: Osée emploie souvent l’infidélité sexuelle comme image de l’infidélité envers Dieu ; ici, les termes décrivent aussi clairement des fautes sexuelles concrètes.
    reason: cross_reference
lexical_decisions:
- source_word: רָאשֵׁי הֶהָרִים
  choice: au sommet des montagnes
  rationale: Littéralement « aux têtes des montagnes »; « au sommet des montagnes » exprime naturellement en français l’emplacement élevé des lieux de culte.
- source_word: יְזַבֵּחוּ
  choice: ils offrent des sacrifices
  rationale: Le piel de זבח désigne l’acte d’immoler ou d’offrir des sacrifices; cette formulation est claire et naturelle.
- source_word: יְקַטֵּרוּ
  choice: ils font fumer des offrandes
  rationale: Le piel de קטר peut désigner l’encens brûlé ou, plus largement, des offrandes que l’on fait monter en fumée. La formulation conserve cette amplitude lexicale.
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  choice: sous le chêne, le peuplier et le térébinthe
  rationale: Ces identifications botaniques sont traditionnelles mais pas entièrement certaines; les noms singuliers ont ici une valeur générique.
- source_word: כִּי טוֹב צִלָּהּ
  choice: car leur ombre est agréable
  rationale: Le suffixe hébreu est féminin singulier, mais renvoie vraisemblablement au couvert des arbres ou au dernier arbre pris comme représentatif. Le pluriel français reprend naturellement l’ensemble de la liste; « agréable » rend ici la qualité attractive de l’ombre.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque une conséquence et maintient le lien causal du discours prophétique.
- source_word: תִּזְנֶינָה
  choice: se prostituent
  rationale: זנה porte l’image forte de la prostitution et peut avoir un sens littéral ou métaphorique. Ici, les personnes nommées et le parallèle avec l’adultère mettent au premier plan la conduite sexuelle concrète.
- source_word: בְּנוֹתֵיכֶם
  choice: vos filles
  rationale: Traduction directe du terme familial.
- source_word: וְכַלּוֹתֵיכֶם
  choice: et vos belles-filles
  rationale: כַּלָּה peut désigner une jeune mariée ou une belle-fille; en parallèle avec « vos filles », « belles-filles » convient au cadre familial.
- source_word: תְּנָאַפְנָה
  choice: commettent l’adultère
  rationale: נאף désigne précisément l’adultère; la traduction préserve sa distinction par rapport au verbe plus large זנה.
theological_decisions:
- issue: Sens littéral ou métaphorique du langage sexuel
  choice: Le texte principal décrit une inconduite sexuelle concrète, tout en signalant en note la portée possible de l’image dans la prophétie d’Osée.
  alternative: Traduire directement le passage comme une description métaphorique de l’idolâtrie ou de l’infidélité envers Dieu.
  rationale: La syntaxe mentionne explicitement les filles et les belles-filles et met en parallèle deux verbes sexuels concrets. Cependant, l’emploi fréquent par Osée de cette image pour l’infidélité envers Dieu doit rester perceptible sans effacer le sens littéral immédiat.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique et le parallélisme sont conservés. « Font fumer des offrandes » préserve l’étendue du verbe hébreu sans la limiter d’emblée à l’encens; les ambiguïtés botanique et théologique sont indiquées en notes.
