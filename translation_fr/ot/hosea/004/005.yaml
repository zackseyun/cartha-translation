id: HOS.4.5
reference: Hosea 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָשַׁלְתָּ֣ הַ/יּ֔וֹם וְ/כָשַׁ֧ל גַּם נָבִ֛יא עִמְּ/ךָ֖ לָ֑יְלָה וְ/דָמִ֖יתִי אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
translation:
  language: fr
  text: Tu trébucheras en plein jour, et le prophète[a] trébuchera lui aussi avec toi pendant la nuit. Je détruirai[b] ta mère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prophète ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je réduirai au silence » ou « je retrancherai »; le verbe hébreu peut exprimer ces idées apparentées dans un contexte de jugement.
    reason: lexical_alternative
  - marker: c
    text: « Ta mère » désigne probablement, par métaphore, le peuple, la nation ou la communauté de l’alliance.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָשַׁלְתָּ
  choice: tu trébucheras
  rationale: Le qal accompli à la 2e personne du masculin singulier prend ici, dans l’annonce prophétique du jugement, une valeur future ou résultative. « Trébucher » conserve l’image sans la renforcer en « tomber ».
- source_word: הַיּוֹם
  choice: en plein jour
  rationale: L’opposition explicite avec לָיְלָה indique le temps diurne plutôt que le sens « aujourd’hui ». Cette tournure française fait ressortir le contraste jour-nuit.
- source_word: וְכָשַׁל
  choice: trébuchera
  rationale: Le même verbe est rendu de la même manière dans les deux propositions; le futur convient à l’annonce prophétique.
- source_word: גַּם נָבִיא
  choice: le prophète lui aussi
  rationale: גַּם marque l’ajout. Bien que נָבִיא soit sans article en hébreu, « le prophète » peut désigner naturellement en français le représentant connu ou typique de cette catégorie; l’indéfini demeure possible et figure en note.
- source_word: עִמְּךָ
  choice: avec toi
  rationale: Traduction directe et naturelle de la préposition עם munie du suffixe masculin singulier.
- source_word: לָיְלָה
  choice: pendant la nuit
  rationale: Cette expression préserve le contraste temporel avec « en plein jour » dans un français naturel.
- source_word: וְדָמִיתִי
  choice: je détruirai
  rationale: Dans ce contexte de jugement, le verbe exprime probablement l’anéantissement ou la mise à l’écart définitive. Les sens voisins « réduire au silence » et « retrancher » sont signalés en note.
- source_word: אִמֶּךָ
  choice: ta mère
  rationale: La traduction littérale préserve l’image familiale caractéristique d’Osée sans identifier directement son référent dans le corps du texte.
theological_decisions:
- issue: Référent de « ta mère »
  choice: Conserver la métaphore « ta mère » sans en préciser le référent dans le texte principal.
  alternative: Traduire explicitement par « Israël », « ton peuple », « ta nation » ou « ta communauté ».
  rationale: L’image peut désigner collectivement le peuple, la nation ou la communauté de l’alliance. La conserver maintient l’ambiguïté littéraire et théologique du texte.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier reflète les formes masculines singulières hébraïques. Le parallélisme entre le jour et la nuit ainsi que la répétition de « trébucher » sont conservés.
