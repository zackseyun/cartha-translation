reference: Hosea 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם זֹנֶ֤ה אַתָּה֙ יִשְׂרָאֵ֔ל אַל יֶאְשַׁ֖ם יְהוּדָ֑ה וְ/אַל תָּבֹ֣אוּ הַ/גִּלְגָּ֗ל וְ/אַֽל תַּעֲלוּ֙ בֵּ֣ית אָ֔וֶן וְ/אַל תִּשָּׁבְע֖וּ חַי יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
translation:
  language: fr
  text: 'Même si tu te prostitues, Israël, que Juda ne se rende pas coupable ! N’allez pas à Guilgal, ne montez pas à Beth-Aven[a] et ne jurez pas : « Yahweh est vivant ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Aven signifie « maison du mal » ou « maison de l’iniquité » ; c’est probablement un nom polémique donné à Béthel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: 'Dans ce contexte, אִם a une valeur concessive : l’infidélité d’Israël est tenue pour réelle, tandis que Juda est exhorté à ne pas y prendre part.'
- source_word: זֹנֶה
  choice: tu te prostitues
  rationale: Le participe de זנה conserve la métaphore prophétique volontairement forte de la prostitution pour l’infidélité envers l’alliance.
- source_word: אַל יֶאְשַׁם
  choice: que Juda ne se rende pas coupable
  rationale: Le qal de אשם peut exprimer le fait de devenir coupable ou de contracter une culpabilité; cette formulation rend la valeur jussive sans préciser indûment la nature de la sanction.
- source_word: תָּבֹאוּ הַגִּלְגָּל
  choice: N’allez pas à Guilgal
  rationale: בוא peut signifier venir, aller ou entrer. Avec une destination et à la deuxième personne du pluriel, « aller à » est naturel en français.
- source_word: תַּעֲלוּ
  choice: ne montez pas
  rationale: עלה signifie littéralement monter et peut désigner le déplacement vers un lieu cultuel; le verbe est conservé.
- source_word: בֵּית אָוֶן
  choice: Beth-Aven
  rationale: Le nom polémique du texte hébreu est translittéré plutôt que remplacé par Béthel; sa portée sémantique est expliquée en note.
- source_word: תִּשָּׁבְעוּ
  choice: ne jurez pas
  rationale: Le nifal désigne ici l’action de prêter serment.
- source_word: חַי יְהוָה
  choice: Par la vie de Yahweh !
  rationale: Cette formule française restitue naturellement la formule hébraïque de serment tout en conservant le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom propre divin, et non par un titre.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité envers l’alliance
  choice: Conserver explicitement « tu te prostitues »
  alternative: « tu es infidèle »
  rationale: La formulation de Hosea emploie intentionnellement une image sexuelle choquante; la neutraliser ferait perdre une part importante de sa force littéraire et théologique.
- issue: Portée de l’interdiction finale
  choice: Rendre littéralement l’interdiction de jurer « Par la vie de Yahweh ! »
  alternative: L’expliciter comme une condamnation de tout serment ou seulement des serments idolâtres
  rationale: Le verset ne précise pas à lui seul la portée exacte de l’interdiction; la traduction préserve cette tension au lieu de la résoudre.
- issue: Nom divin dans la formule de serment
  choice: Yahweh
  alternative: « le Seigneur »
  rationale: Le texte porte explicitement le tétragramme; employer le nom propre préserve cette donnée du texte source.
translation_notes:
  register: Français international moderne, direct et digne. Le singulier adressé à Israël est maintenu dans la première proposition, puis le pluriel des interdictions hébraïques est rendu par « N’allez pas », visant vraisemblablement les habitants de Juda. La ponctuation met en relief les exhortations sans ajouter d’interprétation.
