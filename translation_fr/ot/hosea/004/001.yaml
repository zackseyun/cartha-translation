id: HOS.4.1
reference: Hosea 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
translation:
  language: fr
  text: 'Écoutez la parole de Yahvé, fils d’Israël, car Yahvé est en procès avec les habitants du pays[a] : il n’y a dans le pays ni vérité, ni fidélité[b], ni connaissance de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Ici, le mot désigne probablement le pays d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « amour fidèle », « loyauté » ou « bonté ». Le terme hébreu peut désigner la fidélité durable au sein d’une relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle tout Israël à prêter attention; « Écoutez » est naturel en français et conserve la force de la sommation prophétique.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahvé
  rationale: « Parole » préserve la formule prophétique, tandis que « Yahvé » rend le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Cette traduction formelle conserve le masculin pluriel et la désignation nationale et généalogique du texte hébreu.
- source_word: רִיב לַיהוָה עִם
  choice: Yahvé est en procès avec
  rationale: רִיב appartient ici au registre judiciaire. Cette tournure française claire maintient l’image d’un litige sans ajouter explicitement la notion technique d’alliance.
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Le participe désigne ceux qui habitent le territoire; dans ce contexte adressé à Israël, « pays » indique naturellement le pays d’Israël.
- source_word: אֱמֶת
  choice: vérité
  rationale: « Vérité » est l’équivalent direct et permet de ne pas confondre le terme avec חֶסֶד, même si אֱמֶת peut aussi évoquer la fiabilité.
- source_word: חֶסֶד
  choice: fidélité
  rationale: Dans l’accusation d’Osée, le mot désigne une loyauté relationnelle durable. « Fidélité » en garde la portée sans expliciter dans le texte principal une « fidélité à l’alliance » qui demeure interprétative.
- source_word: דַּעַת אֱלֹהִים
  choice: connaissance de Dieu
  rationale: La construction exprime la connaissance de Dieu, avec sa dimension relationnelle et morale, sans que celle-ci soit développée dans la traduction.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahvé » le conserve comme nom personnel au lieu de le remplacer par un titre.
- issue: Portée de חֶסֶד dans l’accusation prophétique
  choice: fidélité
  alternative: amour fidèle; bonté; loyauté; fidélité à l’alliance
  rationale: « Fidélité » convient au manquement relationnel dénoncé et évite de réduire le terme à la compassion ou d’inscrire explicitement « alliance » alors que ce nom n’apparaît pas dans le verset.
- issue: Portée de הָאָרֶץ
  choice: pays
  alternative: terre
  rationale: L’adresse aux fils d’Israël et le contexte de l’accusation favorisent le territoire habité par Israël. La note conserve l’autre possibilité lexicale.
- issue: Caractère judiciaire de רִיב
  choice: est en procès avec
  alternative: a un litige avec; porte une accusation contre
  rationale: La formulation maintient la scène de procès divin tout en laissant ouverte la manière précise dont le différend est présenté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité de la sommation prophétique. « Est en procès avec » rend l’arrière-plan judiciaire de façon intelligible; « fils d’Israël » conserve volontairement la forme de l’hébreu.
