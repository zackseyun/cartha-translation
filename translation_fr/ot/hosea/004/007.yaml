source:
  edition: WLC
  text: כְּ/רֻבָּ֖/ם כֵּ֣ן חָֽטְאוּ לִ֑/י כְּבוֹדָ֖/ם בְּ/קָל֥וֹן אָמִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
translation:
  language: fr
  text: Plus ils se sont multipliés[a], plus ils ont péché contre moi ; je changerai leur gloire en déshonneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À mesure qu’ils se sont multipliés, ils ont péché contre moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’échangerai leur gloire contre le déshonneur. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֻבָּם ... כֵּן
  choice: Plus ils se sont multipliés, plus
  rationale: La construction corrélative exprime une progression proportionnelle. « Plus… plus… » la restitue naturellement en français, tandis que « se sont multipliés » conserve l’idée d’accroissement numérique portée par רבה.
- source_word: חָטְאוּ לִי
  choice: ils ont péché contre moi
  rationale: Avec ל, חטא désigne ici une faute dirigée contre quelqu’un. « Pécher contre moi » est l’expression française naturelle et fidèle.
- source_word: כְּבוֹדָם
  choice: leur gloire
  rationale: כָּבוֹד peut désigner la gloire, l’honneur ou le rang. « Leur gloire » préserve l’ampleur et l’ambiguïté du terme sans en préciser indûment le référent.
- source_word: בְּקָלוֹן
  choice: en déshonneur
  rationale: קָלוֹן désigne la honte, l’ignominie ou le déshonneur. Dans cette opposition avec « gloire », « déshonneur » rend clairement le renversement de statut.
- source_word: אָמִיר
  choice: je changerai
  rationale: La forme signifie « changer » ou « échanger ». « Je changerai… en… » constitue une tournure française claire et conserve explicitement le sujet divin à la première personne.
theological_decisions:
- issue: Référent de « leur gloire »
  choice: Maintenir « leur gloire » sans explicitation
  alternative: Leur honneur sacerdotal, leur richesse ou leur statut, ou Dieu lui-même considéré comme leur gloire
  rationale: L’hébreu ne précise pas le référent. Le laisser ouvert préserve l’ambiguïté et la tension théologique du texte.
- issue: Nature du renversement annoncé par אָמִיר
  choice: « je changerai leur gloire en déshonneur »
  alternative: « j’échangerai leur gloire contre le déshonneur »
  rationale: Les deux analyses lexicales sont possibles. Le texte principal exprime une transformation, tandis que la note conserve explicitement la nuance possible d’échange.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme corrélatif « Plus… plus… » est naturel, et l’ambiguïté de « leur gloire » est volontairement préservée.
