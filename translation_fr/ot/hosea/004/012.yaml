  source_fidelity: 'Révision nécessaire pour mieux refléter les aspects verbaux : הִתְעָה est un parfait (« l’a égaré ») et וַיִּזְנוּ une forme narrative consécutive, rendue ici par « il s’est prostitué ». « Son bâton lui répond » restitue plus directement l’idée que le bâton donne une réponse divinatoire que « lui donne la réponse », tout en restant idiomatique.'
  naturalness: Le singulier collectif après « mon peuple » est naturel en français. La formulation révisée est fluide, moderne et conserve la vigueur polémique du texte. « Loin de son Dieu » rend naturellement la séparation exprimée par מִן, tandis que la note signale l’image littérale de « dessous ».
  terminology: « Esprit de prostitution » et « se prostituer » conservent explicitement la métaphore sexuelle de זְנוּנִים et זנה, sans euphémisation doctrinale. « Morceau de bois » maintient le caractère matériel, possiblement dérisoire, de עֵץ sans imposer « idole ».
