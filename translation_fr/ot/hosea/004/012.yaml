base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
translation:
  language: fr
  text: Mon peuple consulte son morceau de bois[a], et son bâton lui répond. Car un esprit de prostitution[b] l’a égaré, et il s’est prostitué loin de son Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son bois » ; de manière plus interprétative : « son idole en bois ». L’hébreu dit littéralement « son bois » et désigne probablement un objet cultuel en bois utilisé pour la divination.'
    reason: lexical_alternative
  - marker: b
    text: Ou « un esprit de débauche » ou « un esprit d’infidélité ». L’hébreu maintient explicitement l’image de la prostitution.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « de dessous son Dieu », expression qui évoque l’abandon de l’allégeance et de l’autorité légitimes de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  choice: Mon peuple
  rationale: Le nom עַם avec le suffixe de première personne exprime ici la relation d’alliance entre Dieu et Israël. « Peuple » est plus naturel et relationnel que « nation ».
- source_word: בְּעֵצוֹ
  choice: consulte son morceau de bois
  rationale: Littéralement « interroge son bois ». Dans ce contexte divinatoire, « consulte » rend bien l’action, tandis que « morceau de bois » conserve le caractère concret et probablement moqueur de l’expression sans expliciter d’emblée « idole ».
- source_word: וּמַקְלוֹ יַגִּיד לוֹ
  choice: et son bâton lui donne la réponse
  rationale: מַקֵּל désigne un bâton, et le hiphil de נגד signifie faire connaître ou annoncer. Cette formulation française exprime naturellement la prétendue réponse divinatoire du bâton tout en gardant le singulier collectif du texte hébreu.
- source_word: רוּחַ זְנוּנִים
  choice: un esprit de prostitution
  rationale: L’expression conserve la métaphore sexuelle explicite de זְנוּנִים. « Prostitution » est actuel, clair et digne, contrairement à des termes vieillis, sans l’atténuer en simple « infidélité ».
- source_word: הִתְעָה
  choice: l’égare
  rationale: Le hiphil de תעה indique qu’on fait errer ou qu’on conduit hors du bon chemin. « Égare » est concis et restitue à la fois l’erreur et la déviation.
- source_word: וַיִּזְנוּ
  choice: il se prostitue
  rationale: Le verbe זנה reprend explicitement la métaphore de la prostitution appliquée à l’apostasie. Le présent français donne à l’énoncé prophétique une force directe et s’accorde avec les verbes précédents.
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  choice: en se détournant de son Dieu
  rationale: Littéralement « de dessous son Dieu ». La formulation retenue transmet naturellement l’idée de quitter l’autorité et l’allégeance dues à Dieu; la note conserve l’image hébraïque.
theological_decisions:
- issue: Métaphore sexuelle prophétique de l’idolâtrie
  choice: Conserver explicitement « prostitution » et « se prostitue » dans le texte principal.
  alternative: Employer une formulation atténuée telle que « infidélité » ou « se montre infidèle ».
  rationale: Osée présente volontairement l’apostasie d’Israël sous l’image choquante de la prostitution. Une paraphrase en termes d’infidélité seule affaiblirait la tension rhétorique et théologique du texte.
- issue: Singulier collectif et suffixes pronominaux
  choice: 'Conserver en français le singulier collectif : « son », « lui », « l’ », « il ».'
  alternative: 'Employer des pluriels distributifs : « leurs », « leur », « les », « ils ».'
  rationale: Contrairement à l’anglais, le français peut enchaîner naturellement sur le collectif singulier « mon peuple ». Ce choix suit de plus près les formes hébraïques sans modifier le référent collectif.
- issue: Image de la sortie « de dessous » Dieu
  choice: Rendre l’idée dans le texte par « en se détournant de son Dieu » et signaler la formulation littérale en note.
  alternative: Traduire formellement « loin de dessous son Dieu » ou « de dessous son Dieu ».
  rationale: La traduction littérale serait obscure ou peu idiomatique en français. La formulation choisie exprime le départ hors de l’allégeance et de l’autorité divines, tandis que la note préserve l’image source et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste accessible tout en conservant la vigueur de la métaphore prophétique. Le singulier collectif de « mon peuple » est maintenu, ce qui est naturel en français et proche de l’hébreu.
