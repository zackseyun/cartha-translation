source:
  edition: WLC
  text: זְנ֛וּת וְ/יַ֥יִן וְ/תִיר֖וֹשׁ יִֽקַּֽח לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
translation:
  language: fr
  text: L’inconduite sexuelle, le vin et le vin nouveau enlèvent le cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enlèvent le discernement » ou « privent de bon sens » ; littéralement, l’hébreu dit « enlèvent le cœur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זְנוּת
  choice: inconduite sexuelle
  rationale: Le nom désigne une conduite sexuelle illicite, avec chez Osée des connotations possibles de prostitution et d’infidélité à l’alliance. « Inconduite sexuelle » est actuel, clair et suffisamment large sans imposer ici le seul sens de prostitution.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent français courant du terme hébreu, qui désigne le vin.
- source_word: תִירוֹשׁ
  choice: vin nouveau
  rationale: Cette expression maintient la distinction lexicale avec יַיִן et désigne le produit récent de la vigne, sans trancher plus précisément son degré de fermentation.
- source_word: יִקַּח
  choice: enlèvent
  rationale: Le verbe signifie fondamentalement « prendre ». Avec « le cœur », « enlèvent » rend l’effet de privation tout en restant proche de l’image hébraïque. Le singulier hébreu peut traiter l’énumération comme un ensemble; le français naturel emploie ici le pluriel avec les trois sujets coordonnés.
- source_word: לֵב
  choice: le cœur
  rationale: Dans l’anthropologie hébraïque, le cœur comprend notamment la pensée, le discernement et la volonté. Le conserver préserve l’image et son ampleur plutôt que de la réduire au seul « discernement ».
theological_decisions:
- issue: Faut-il expliciter l’expression finale comme une perte de discernement ou conserver l’image du cœur ?
  choice: Conserver « enlèvent le cœur » dans le texte principal.
  alternative: « enlèvent le discernement » ou « privent de bon sens »
  rationale: L’expression concrète préserve l’anthropologie et la tension du texte hébreu. Une note donne les interprétations idiomatiques possibles sans en imposer une dans le corps du verset.
translation_notes:
  register: Français international moderne, sobre et digne. « Inconduite sexuelle » évite l’archaïsme de « débauche » et la restriction de « prostitution ». La formulation finale, volontairement concrète, suit de près l’image hébraïque; la note en éclaire le sens idiomatique.
