source:
  edition: WLC
  text: אָלֹ֣ה וְ/כַחֵ֔שׁ וְ/רָצֹ֥חַ וְ/גָנֹ֖ב וְ/נָאֹ֑ף פָּרָ֕צוּ וְ/דָמִ֥ים בְּ/דָמִ֖ים נָגָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
translation:
  language: fr
  text: Malédictions[a], mensonges, meurtres, vols et adultères se déchaînent ; le sang versé succède au sang versé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner de faux serments ou la violation de serments.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des sangs touchent des sangs », image d’actes sanglants qui s’enchaînent sans interruption.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אָלֹה
  choice: Malédictions
  rationale: Le terme peut désigner des malédictions prononcées, mais aussi des serments trompeurs ou violés. « Malédictions » conserve le sens premier sans enfermer le contexte dans une seule interprétation ; l’ambiguïté est signalée en note.
- source_word: כַחֵשׁ
  choice: mensonges
  rationale: Le verbe exprime l’action de mentir ou d’agir avec fausseté. Le nom pluriel s’intègre naturellement à l’énumération française.
- source_word: רָצֹחַ
  choice: meurtres
  rationale: רצח désigne généralement l’homicide illégitime plutôt que toute mise à mort. « Meurtres » en préserve la portée morale.
- source_word: גָנֹב
  choice: vols
  rationale: Le nom bref maintient le rythme de l’énumération et rend clairement l’action de voler.
- source_word: נָאֹף
  choice: adultères
  rationale: Le terme vise précisément l’adultère. Le pluriel nominal s’accorde avec la forme française de la liste.
- source_word: פָּרָצוּ
  choice: se déchaînent
  rationale: Le verbe évoque ce qui fait irruption ou franchit les limites. « Se déchaînent » exprime avec naturel la prolifération violente des actes énumérés sans ajouter d’objet absent de l’hébreu.
- source_word: דָמִים בְּדָמִים נָגָעוּ
  choice: le sang versé succède au sang versé
  rationale: Littéralement, « des sangs touchent des sangs ». La formulation française rend l’enchaînement ininterrompu des violences tout en conservant la répétition frappante de l’image.
theological_decisions:
- issue: Portée de אָלֹה dans le réquisitoire d’alliance
  choice: Traduire par « Malédictions » et signaler l’autre lecture en note
  alternative: « Faux serments » ou « parjures »
  rationale: Le contexte peut orienter le terme vers l’abus du serment ou sa violation, mais le mot permet aussi le sens plus général de malédiction. Le texte principal et la note préservent cette tension sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération nominale conserve le rythme serré de l’hébreu ; « se déchaînent » communique son mouvement de rupture, et la dernière proposition garde la répétition rhétorique autour du sang versé.
