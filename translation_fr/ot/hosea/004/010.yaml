source:
  edition: WLC
  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
translation:
  language: fr
  text: Ils mangeront, mais ne seront pas rassasiés ; ils se prostitueront[a], mais ne se multiplieront pas[b], car ils ont abandonné Yahweh pour s’attacher à la prostitution[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « ils se livreront à la prostitution » ou, plus largement, « ils commettront des actes sexuels immoraux ». Chez Osée, il évoque souvent aussi l’infidélité envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne s’accroîtront pas ». Le verbe signifie littéralement « faire irruption » ou « s’étendre » ; ici, il s’agit probablement d’un accroissement par la descendance ou la population.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est très concis : « car ils ont abandonné Yahweh, pour garder ». L’objet de « garder » n’est pas exprimé. La traduction le restitue d’après le contexte de la prostitution ; on peut aussi comprendre qu’ils ont abandonné le fait de prêter attention à Yahweh ou d’observer ce qu’il demande.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: ils mangeront
  rationale: Dans cette annonce de jugement, l’accompli hébreu coordonné présente naturellement en français la conséquence à venir.
- source_word: יִשְׂבָּעוּ
  choice: être rassasiés
  rationale: Le verbe שׂבע désigne le fait d’avoir mangé à satiété ; « rassasiés » convient directement au parallèle avec « mangeront ».
- source_word: הִזְנוּ
  choice: ils se prostitueront
  rationale: Le verbe זנה peut désigner la prostitution ou, plus largement, une conduite sexuelle infidèle ; chez Osée, il peut aussi évoquer l’infidélité envers Dieu. Le français retenu conserve ces résonances sans choisir exclusivement entre sens concret et métaphorique.
- source_word: יִפְרֹצוּ
  choice: se multiplier
  rationale: פרץ signifie littéralement « faire irruption, s’étendre » ; dans ce contexte sexuel, il évoque vraisemblablement l’accroissement par la descendance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: עָזְבוּ
  choice: ont abandonné
  rationale: « Abandonner » exprime clairement la rupture et la désertion relationnelle portées par עזב.
- source_word: לִשְׁמֹר
  choice: renonçant à lui rester fidèles
  rationale: L’infinitif « garder, observer, veiller » est elliptique dans l’hébreu. Cette formulation française exprime l’abandon de l’attachement vigilant à Yahweh sans introduire un objet précis tel que « sa loi ».
theological_decisions:
- issue: Portée de זנה dans l’accusation d’Osée
  choice: « ils se prostitueront », avec une portée concrète et une possible résonance d’infidélité envers Dieu
  alternative: « ils se livreront à l’immoralité sexuelle » ou lecture exclusivement métaphorique d’idolâtrie
  rationale: L’absence de multiplication favorise un sens sexuel concret, tandis que l’usage d’Osée maintient l’arrière-plan de l’infidélité à l’alliance. La traduction ne tranche pas artificiellement entre ces dimensions.
- issue: Construction elliptique de לִשְׁמֹר après l’abandon de Yahweh
  choice: « renonçant à lui rester fidèles »
  alternative: « ils ont abandonné Yahweh pour garder… », « ils ont cessé d’observer Yahweh » ou « ils ont abandonné l’observance de sa loi »
  rationale: Le texte hébreu est abrupt et ne donne pas d’objet explicite à « garder ». La traduction conserve l’idée d’une fidélité délaissée tout en signalant l’ellipse dans une note, sans ajouter « sa loi » ni rattacher arbitrairement l’infinitif à la prostitution.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme bref de l’hébreu est conservé, ainsi que l’ambiguïté entre prostitution concrète et infidélité spirituelle. Le dernier membre est rendu idiomatiquement, avec une note qui expose sa formulation elliptique.
