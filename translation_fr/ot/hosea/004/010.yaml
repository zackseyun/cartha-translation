  terminology: « Yahweh » respecte le choix de transcription du nom divin. « Se prostitueront » rend le verbe de manière concrète sans exclure, par la note, les résonances d’infidélité caractéristiques d’Osée. « S’attacher à la prostitution » rend de façon idiomatique l’idée contextuelle de « garder/entretenir ».
