  text: The wind has wrapped her in its wings[a], and they will be put to shame because of their sacrifices.
translation:
  language: fr
  text: Le vent l’a enveloppée dans ses ailes[a], et ils seront couverts de honte à cause de leurs sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un esprit l’a enserrée dans ses ailes. » Le mot hébreu רוּחַ peut signifier « vent », « souffle » ou « esprit », et le verbe peut signifier « lier », « enfermer » ou « envelopper ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַר
  choice: a enveloppée
  rationale: Le verbe exprime l’idée de lier, d’enfermer ou d’envelopper. « Envelopper » conserve ici la force poétique de l’image associant le vent à des ailes.
- source_word: רוּחַ
  choice: le vent
  rationale: Avec l’image des ailes et dans ce contexte de jugement, « vent » est le sens le plus naturel, tout en laissant « esprit » comme possibilité lexicale en note.
- source_word: אוֹתָהּ
  choice: l’
  rationale: Le pronom objet féminin singulier renvoie à l’entité collective féminine personnifiée dans le contexte, probablement Israël ou Éphraïm.
- source_word: בִּכְנָפֶיהָ
  choice: de ses ailes
  rationale: Le suffixe féminin singulier s’accorde grammaticalement avec רוּחַ. Cette formulation française rend naturellement l’image d’un vent ailé qui enveloppe la femme personnifiée.
- source_word: וְיֵבֹשׁוּ
  choice: et ils seront couverts de honte
  rationale: Le verbe בוש évoque la honte et le déshonneur résultant du jugement. Cette tournure exprime clairement ce résultat sans préciser au-delà du texte qui en est l’agent.
- source_word: מִזִּבְחוֹתָם
  choice: à cause de leurs sacrifices
  rationale: 'La préposition מן est comprise dans un sens causal : leurs sacrifices, idolâtres dans le contexte, sont la cause de leur honte.'
theological_decisions:
- issue: Référent et image du jugement
  choice: Le verset présente la femme personnifiée comme enveloppée par un vent destructeur, tandis que le groupe sera couvert de honte à cause de ses sacrifices.
  alternative: Le vent peut représenter plus précisément l’exil ou une calamité, et רוּחַ peut aussi se comprendre comme « esprit ».
  rationale: La traduction garde l’image poétique et la tension du texte sans identifier explicitement le vent à l’exil, au jugement divin ou à une calamité particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore concise du vent pourvu d’ailes est conservée, ainsi que le passage du féminin singulier (« l’ ») au pluriel (« ils ») présent dans l’hébreu.
