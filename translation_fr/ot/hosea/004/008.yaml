  text: חַטַּ֥את עַמִּ֖/י יֹאכֵ֑לוּ וְ/אֶל עֲוֺנָ֖/ם יִשְׂא֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/008.yaml
  text: They feed on the sin of my people[b][a], and they set their appetite on their iniquity.
translation:
  language: fr
  text: Ils se nourrissent du péché de mon peuple[a] et désirent ardemment la faute de mon peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils mangent le sacrifice pour le péché de mon peuple. » Le même mot hébreu peut désigner le péché ou le sacrifice offert pour le péché.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et vers leur faute, ils élèvent son âme ». Cette expression hébraïque signifie désirer ardemment quelque chose ; le singulier « son âme » s’accorde difficilement avec le verbe au pluriel dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: péché
  rationale: Le nom peut désigner soit le péché, soit le sacrifice pour le péché. Le parallélisme avec « faute » favorise ici le sens moral, sans exclure le sens cultuel signalé en note.
- source_word: יֹאכֵלוּ
  choice: se nourrissent de
  rationale: Le verbe signifie littéralement « manger ». Cette formulation naturelle conserve l’image de consommation tout en exprimant l’exploitation intéressée du péché du peuple.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rend directement le nom avec le suffixe de première personne.
- source_word: עֲוֺנָם
  choice: sa faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa sanction. « Faute » convient au parallélisme moral et le singulier collectif français renvoie naturellement à « mon peuple ».
- source_word: יִשְׂאוּ נַפְשׁוֹ
  choice: portent tous leurs désirs vers
  rationale: L’expression décrit un désir orienté vers quelque chose. Cette traduction garde l’image directionnelle de נשׂא tout en rendant clairement l’idée de convoitise.
- source_word: נַפְשׁוֹ
  choice: leurs désirs
  rationale: La forme hébraïque est littéralement « son âme », au singulier, malgré le verbe pluriel. Le pluriel distributif produit un français compréhensible, tandis que la difficulté grammaticale est conservée en note.
theological_decisions:
- issue: Sens de חַטַּאת dans le contexte de la corruption des prêtres
  choice: « péché » dans le texte principal
  alternative: « sacrifice pour le péché »
  rationale: Le parallélisme avec la faute du peuple soutient l'accusation morale générale, mais le contexte sacerdotal permet aussi une allusion aux portions de sacrifices consommées par les prêtres. La note préserve cette tension.
- issue: Référent et nombre de נַפְשׁוֹ
  choice: Sens distributif rendu par « leurs désirs »
  alternative: Traduction littérale « son âme »
  rationale: Le verbe pluriel désigne vraisemblablement les prêtres, alors que le nom suffixé est singulier. Le texte principal communique l'idiome sans trancher par une correction du texte hébreu; la note expose la forme exacte.
translation_notes:
  register: Français international moderne, digne et accessible. « Se nourrissent du péché » conserve la métaphore accusatrice; « portent tous leurs désirs vers » rend l'orientation insistante de l'idiome hébreu sans effacer la difficulté du singulier, explicitée en note.
