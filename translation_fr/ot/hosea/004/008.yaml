  source_fidelity: Le premier membre rend fidèlement חַטַּאת (« péché »), tout en conservant en note l’alternative cultuelle légitime. Dans le second membre, « sa faute » rattache explicitement la faute à « mon peuple » au singulier collectif, alors que l’hébreu porte le suffixe pluriel « leur iniquité ». Cette clarification du référent est possible, mais le possessif et la formulation proposés affaiblissent inutilement le parallélisme et l’ambiguïté grammaticale de l’original.
  naturalness: « Portent tous leurs désirs vers » est compréhensible mais pesant et peu idiomatique en français moderne. « Désirent ardemment » rend naturellement la valeur de l’idiome sans prétendre résoudre l’anomalie du singulier « son âme », qui demeure signalée en note.
  terminology: « Péché », « sacrifice pour le péché » et « faute » appartiennent à un registre moderne, clair et approprié. « La faute de mon peuple » conserve le singulier abstrait de עָוֹן tout en rendant explicite, sans le déformer, le référent pluriel impliqué par le suffixe hébreu.
