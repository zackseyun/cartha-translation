  variant: modern international French
source:
  edition: WLC
  text: וּ/זְרַעְתִּ֤י/הָ לִּ/י֙ בָּ/אָ֔רֶץ וְ/רִֽחַמְתִּ֖י אֶת לֹ֣א רֻחָ֑מָה וְ/אָמַרְתִּ֤י לְ/לֹֽא עַמִּי֙ עַמִּ/י אַ֔תָּה וְ/ה֖וּא יֹאמַ֥ר אֱלֹהָֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
translation:
  language: fr
  text: 'Je la sèmerai pour moi dans le pays[a], j’aurai compassion de Sans-Compassion[b], et je dirai à Pas-Mon-Peuple : « Tu es mon peuple », et il dira[c] : « Mon Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre ». Le mot hébreu peut désigner le pays ou la terre au sens plus large.
    reason: lexical_alternative
  - marker: b
    text: Noms hébreux traditionnellement transcrits Lo-Rouhama et Lo-Ammi ; ils sont traduits ici par « Sans-Compassion » et « Pas-Mon-Peuple » afin de faire ressortir le renversement des noms de jugement en promesse de restauration.
    reason: alternative_reading
  - marker: c
    text: Littéralement « et lui, il dira ». Le masculin singulier présente vraisemblablement le peuple restauré comme un seul répondant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  choice: Je la sèmerai
  rationale: Le verbe זרע désigne l’action de semer. Cette formulation conserve l’image agricole, le lien verbal avec Jizréel et le suffixe féminin singulier du texte hébreu.
- source_word: לִּי
  choice: pour moi
  rationale: 'Le datif exprime ici l’intérêt ou l’appartenance : Dieu sème de nouveau celle qu’il revendique comme sienne.'
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner la terre au sens large ou le pays. Le contexte de restauration d’Israël favorise « le pays », sans supprimer l’autre possibilité, signalée en note.
- source_word: וְרִחַמְתִּי
  choice: J’aurai compassion
  rationale: Le verbe רחם exprime une compassion agissante. « Avoir compassion » est naturel en français et permet de rendre perceptible le renversement du nom symbolique.
- source_word: לֹא רֻחָמָה
  choice: Sans-Compassion
  rationale: Le nom prophétique est traduit afin que le lecteur perçoive immédiatement son renversement par « J’aurai compassion ». Les traits d’union marquent qu’il s’agit d’un nom symbolique.
- source_word: לְלֹא עַמִּי
  choice: à Pas-Mon-Peuple
  rationale: La traduction du nom symbolique rend transparente la restauration de la relation d’alliance dans la déclaration qui suit.
- source_word: עַמִּי אַתָּה
  choice: Tu es mon peuple
  rationale: La formule directe conserve le singulier grammatical de l’hébreu tout en désignant collectivement le peuple restauré.
- source_word: וְהוּא יֹאמַר
  choice: Alors il dira
  rationale: Le pronom et le verbe sont au masculin singulier. « Il dira » en respecte la forme et maintient la personnification collective; « alors » exprime naturellement l’enchaînement porté par וְ.
- source_word: אֱלֹהָי
  choice: Mon Dieu !
  rationale: Cette confession brève répond à la formule d’alliance « mon peuple ». Le point d’exclamation en transmet la force sans ajouter de contenu.
theological_decisions:
- issue: Traduction ou translittération des noms symboliques
  choice: Traduire par « Sans-Compassion » et « Pas-Mon-Peuple » dans le texte principal
  alternative: Employer les formes traditionnelles « Lo-Rouhama » et « Lo-Ammi »
  rationale: Le mouvement théologique du verset repose sur le renversement explicite des noms de jugement. Leur traduction permet de percevoir ce mouvement sans imposer une interprétation extérieure; les translittérations sont conservées en note.
- issue: Réponse du peuple restauré au masculin singulier
  choice: Conserver « il dira »
  alternative: Généraliser au pluriel par « ils diront » ou employer « celui-ci dira »
  rationale: L’hébreu présente explicitement un sujet masculin singulier, qui personnifie vraisemblablement le peuple comme un seul répondant. La traduction préserve cette tension entre forme singulière et référent collectif.
- issue: Portée géographique de אֶרֶץ
  choice: Retenir « le pays »
  alternative: Traduire par « la terre »
  rationale: Le contexte immédiat de restauration de la relation entre Dieu, son peuple et son territoire favorise « le pays », mais l’ambiguïté lexicale réelle est maintenue dans une note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que les noms symboliques sont traduits pour préserver le jeu prophétique. Les majuscules et traits d’union signalent clairement leur fonction de noms propres.
