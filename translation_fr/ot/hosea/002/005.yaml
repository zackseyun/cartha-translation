  text: פֶּן אַפְשִׁיטֶ֣/נָּה עֲרֻמָּ֔ה וְ/הִ֨צַּגְתִּ֔י/הָ כְּ/י֖וֹם הִוָּֽלְדָ֑/הּ וְ/שַׂמְתִּ֣י/הָ כַ/מִּדְבָּ֗ר וְ/שַׁתִּ֨/הָ֙ כְּ/אֶ֣רֶץ צִיָּ֔ה וַ/הֲמִתִּ֖י/הָ בַּ/צָּמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
translation:
  language: fr
  text: Sinon, je la dépouillerai et l’exposerai nue, comme au jour de sa naissance[a] ; je la rendrai semblable au désert, semblable à une terre desséchée, et je la ferai mourir de soif[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de peur que je ne la dépouille et ne l’expose nue ». La particule hébraïque peut introduire plus formellement la conséquence redoutée.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une forme causative : « je causerai sa mort par la soif ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Sinon
  rationale: Introduit naturellement en français moderne la conséquence menaçante liée à l’avertissement précédent, tout en conservant la valeur préventive de la particule.
- source_word: אַפְשִׁיטֶנָּה עֲרֻמָּה
  choice: je la déshabillerai et la mettrai nue
  rationale: Rend explicitement le verbe causatif et son résultat, sans atténuer l’image corporelle de honte et de jugement.
- source_word: וְהִצַּגְתִּיהָ
  choice: je l’exposerai
  rationale: Le verbe signifie la placer ou la présenter en vue ; « exposer » convient au contexte de mise à nu publique et reste naturel en français.
- source_word: כְּיוֹם הִוָּלְדָהּ
  choice: comme au jour de sa naissance
  rationale: Formulation française concise qui conserve la comparaison avec l’état de vulnérabilité au moment de la naissance.
- source_word: וְשַׂמְתִּיהָ כַמִּדְבָּר
  choice: je la rendrai semblable au désert
  rationale: Préserve la comparaison et l’image de désolation portée par מִדְבָּר.
- source_word: וְשַׁתִּהָ כְּאֶרֶץ צִיָּה
  choice: semblable à une terre desséchée
  rationale: « Desséchée » exprime clairement l’aridité extrême de צִיָּה et prolonge l’intensification de l’image du désert.
- source_word: וַהֲמִתִּיהָ בַּצָּמָא
  choice: je la ferai mourir de soif
  rationale: Rend directement la valeur causative du hifil de מות ainsi que le moyen ou la cause exprimé par בַּצָּמָא, dans un français naturel.
theological_decisions:
- issue: Image métaphorique du jugement contre la femme infidèle, représentant Israël
  choice: Conserver concrètement les images de nudité, d’exposition, de désert et de mort par la soif.
  alternative: Les remplacer par une formulation abstraite évoquant seulement l’humiliation et la privation.
  rationale: La force théologique du texte réside dans ces images sévères de jugement lié à l’infidélité ; les expliciter en abstraction imposerait une interprétation et affaiblirait la métaphore.
- issue: Force causative de la mort par la soif
  choice: « je la ferai mourir de soif »
  alternative: « je la laisserai mourir de soif »
  rationale: Le hifil וַהֲמִתִּיהָ présente le sujet comme causant la mort ; « laisser mourir » pourrait indûment atténuer cette responsabilité causative.
translation_notes:
  register: 'Français international moderne, digne et direct. Le parallélisme hébreu est conservé par la répétition de « semblable », tandis que la ponctuation rend lisible la progression : mise à nu, exposition, désolation, puis mort par la soif.'
