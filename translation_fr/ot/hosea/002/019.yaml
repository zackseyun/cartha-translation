  text: וַ/הֲסִרֹתִ֛י אֶת שְׁמ֥וֹת הַ/בְּעָלִ֖ים מִ/פִּ֑י/הָ וְ/לֹֽא יִזָּכְר֥וּ ע֖וֹד בִּ/שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/019.yaml
  text: And I will remove the names of the Baals from her mouth[a], and they will no longer be remembered by name.
translation:
  language: fr
  text: J’ôterai de sa bouche les noms des Baals, et l’on ne les mentionnera plus par leur nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on ne se souviendra plus d’eux par leur nom ». Le verbe hébreu peut signifier « être mentionné » ou « être rappelé à la mémoire » ; dans ce contexte, il concerne la cessation de l’invocation des Baals.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: J’ôterai
  rationale: Le hiphil de סור exprime ici l’action de faire disparaître ou d’enlever. « Ôter » convient naturellement à l’objet « les noms » et conserve la force de la déclaration divine.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: Le pluriel construit de שֵׁם désigne les noms ou titres sous lesquels les Baals étaient invoqués. La traduction directe préserve l’image et la portée polémique.
- source_word: הַבְּעָלִים
  choice: des Baals
  rationale: Dans le contexte d’Osée, le pluriel désigne les divinités cananéennes liées à l’infidélité cultuelle d’Israël, et non de simples maîtres humains. Le pluriel français « Baals » garde cette référence religieuse.
- source_word: מִפִּיהָ
  choice: de sa bouche
  rationale: La traduction littérale conserve l’image hébraïque de noms prononcés ou invoqués.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: et ils ne seront plus évoqués
  rationale: Le niphal de זכר peut exprimer le fait d’être rappelé à la mémoire ou mentionné. « Évoqués » laisse entendre ces deux dimensions sans réduire le sens à une seule.
- source_word: בִּשְׁמָם
  choice: par leur nom
  rationale: Cette formulation conserve le singulier collectif de שֵׁם avec le suffixe pluriel et rend l’idée qu’ils ne seront plus désignés ou rappelés sous leur nom.
theological_decisions:
- issue: Référent des « Baals »
  choice: Les divinités païennes associées à l’infidélité d’Israël
  alternative: Des « maîtres » ou « seigneurs » au sens générique
  rationale: Le contexte religieux et polémique d’Osée indique les divinités baalistes dont les noms et l’invocation doivent disparaître. « Baals » préserve ce contraste sans ajouter de précision doctrinale étrangère au texte.
- issue: Portée de זכר
  choice: Conserver ensemble les idées de souvenir et de mention au moyen de « évoqués »
  alternative: Traduire exclusivement par « on ne se souviendra plus d’eux » ou par « ils ne seront plus mentionnés »
  rationale: Le verbe hébreu permet les deux nuances, particulièrement proches dans un contexte où le souvenir cultuel se manifeste par la prononciation des noms.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. « J’ôterai » garde une tonalité digne et reste courant ; « évoqués » préserve avec naturel l’ambiguïté du verbe hébreu entre souvenir et mention.
