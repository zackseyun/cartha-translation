  source_fidelity: Le texte rend correctement l’action divine (« J’ôterai »), les « noms des Baals » et l’image de leur disparition de la bouche d’Israël. Le niphal de זכר peut recouvrir la mention aussi bien que le souvenir ; une formulation française doit éviter de trancher indûment tout en restant idiomatique. « Par leur nom » rend de façon formelle בִּשְׁמָם.
  naturalness: '« Ils ne seront plus évoqués par leur nom » est peu idiomatique en français : on évoque généralement quelqu’un ou quelque chose, mais « évoquer par un nom » sonne forcé. De plus, le pronom « ils » peut momentanément renvoyer grammaticalement aux « noms » plutôt qu’aux Baals. Une tournure impersonnelle lève cette ambiguïté.'
  terminology: « Baals » est le terme approprié pour les divinités visées dans le contexte d’Osée. « Ôter », « bouche » et « noms » conviennent au registre moderne soutenu. La note doit présenter le sens alternatif de souvenir sans faire de la disparition du culte une partie du sens lexical du verset.
