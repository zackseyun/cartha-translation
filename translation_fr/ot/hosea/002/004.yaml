  text: רִ֤יבוּ בְ/אִמְּ/כֶם֙ רִ֔יבוּ כִּֽי הִיא֙ לֹ֣א אִשְׁתִּ֔/י וְ/אָנֹכִ֖י לֹ֣א אִישָׁ֑/הּ וְ/תָסֵ֤ר זְנוּנֶ֨י/הָ֙ מִ/פָּנֶ֔י/ה וְ/נַאֲפוּפֶ֖י/הָ מִ/בֵּ֥ין שָׁדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
translation:
  language: fr
  text: Faites un procès à votre mère[a], faites-lui un procès, car elle n’est pas ma femme, et moi, je ne suis pas son mari. Qu’elle ôte de son visage ses prostitutions[b], et d’entre ses seins ses actes d’adultère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Plaidez contre votre mère » ou « Accusez votre mère ». Le verbe hébreu peut exprimer une contestation ayant une portée juridique.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner des conduites sexuelles concrètes et, chez Osée, évoquer aussi l’infidélité à l’alliance par l’idolâtrie.
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם רִיבוּ
  choice: Faites un procès à votre mère, faites-lui un procès
  rationale: L’impératif pluriel de ריב, construit avec ב, possède ici une force de contestation juridique. Cette formulation française conserve à la fois l’image du procès, la reprise insistante et l’adresse aux enfants, sans préciser indûment une procédure judiciaire formelle.
- source_word: כִּי הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ
  choice: car elle n’est pas ma femme, et moi, je ne suis pas son mari
  rationale: אשה et איש désignent ici les partenaires du lien conjugal. « Femme » et « mari » expriment naturellement en français la métaphore matrimoniale, tandis que « et moi » rend l’insistance portée par אָנֹכִי.
- source_word: וְתָסֵר
  choice: Qu’elle ôte
  rationale: La forme exprime ici une injonction ou un souhait pressant à la troisième personne. « Qu’elle ôte » en restitue la valeur jussive et convient aux compléments concrets qui suivent.
- source_word: זְנוּנֶיהָ
  choice: ses prostitutions
  rationale: Le pluriel désigne des conduites de prostitution et peut évoquer chez Osée aussi bien l’inconduite sexuelle que, métaphoriquement, l’infidélité à l’alliance. Le terme fort et concret préserve cette tension sans la réduire à une interprétation unique.
- source_word: מִפָּנֶיהָ
  choice: de son visage
  rationale: La traduction garde l’image corporelle et visible du texte hébreu, plutôt que de l’abstraire en « de sa présence » ou d’ajouter l’idée interprétative de signes ou d’ornements.
- source_word: וְנַאֲפוּפֶיהָ
  choice: ses adultères
  rationale: Le mot, dérivé de נאף, évoque des actes adultères. Le pluriel français conserve la vigueur morale et conjugale de l’hébreu.
- source_word: מִבֵּין שָׁדֶיהָ
  choice: d’entre ses seins
  rationale: Cette traduction directe maintient l’image corporelle frappante de l’hébreu sans décider s’il s’agit d’ornements, de marques de séduction ou d’une autre réalité concrète.
theological_decisions:
- issue: Métaphore conjugale de la rupture de l’alliance
  choice: Conserver littéralement les termes « femme » et « mari » ainsi que les images conjugales et sexuelles.
  alternative: Expliciter dans le texte principal l’infidélité d’Israël envers Dieu.
  rationale: Le verset formule son accusation à travers la métaphore matrimoniale. Une paraphrase explicitement théologique résoudrait une image que le texte prophétique laisse agir dans toute sa force et sa tension.
- issue: Portée de זְנוּנֶיהָ
  choice: Employer le terme fort « prostitutions » et signaler sa possible portée métaphorique en note.
  alternative: Adoucir en « infidélités » ou « immoralité ».
  rationale: Le langage volontairement sexuel d’Osée ne doit pas être neutralisé. Il peut désigner la conduite sexuelle dans l’image conjugale tout en évoquant l’infidélité idolâtre à l’alliance.
- issue: Rapport matrimonial déclaré rompu
  choice: 'Traduire la déclaration telle quelle : « elle n’est pas ma femme… je ne suis pas son mari ».'
  alternative: La reformuler comme une formule technique de divorce ou comme une rupture définitive de l’alliance.
  rationale: Le texte affirme la rupture du rapport conjugal, mais la traduction ne doit pas décider au-delà de ses mots précis de son statut juridique ou de son caractère définitif.
translation_notes:
  register: Français moderne, soutenu mais accessible. La répétition conserve l’urgence prophétique. Les expressions corporelles (« visage », « seins ») et le vocabulaire sexuel fort sont maintenus afin de ne pas atténuer ni expliquer excessivement la métaphore hébraïque.
