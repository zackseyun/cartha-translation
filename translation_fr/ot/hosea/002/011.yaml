- from: C’est pourquoi je reprendrai mon grain en son temps et mon vin nouveau en sa saison ; j’arracherai ma laine et mon lin[a], qui devaient couvrir sa nudité[b].
  to: C’est pourquoi je reviendrai prendre mon grain en son temps et mon vin nouveau en sa saison ; j’enlèverai[a] ma laine et mon lin pour couvrir sa nudité[b].
  rationale: La révision conserve explicitement les deux verbes initiaux (« je reviendrai prendre »), choisit un équivalent français contextuellement plus neutre pour le retrait de la laine et du lin, et rend l’infinitif hébreu comme un but. Les notes conservent l’alternative plus énergique et la connotation possible de honte, sans les imposer au texte principal.
