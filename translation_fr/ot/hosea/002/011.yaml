  text: לָ/כֵ֣ן אָשׁ֔וּב וְ/לָקַחְתִּ֤י דְגָנִ/י֙ בְּ/עִתּ֔/וֹ וְ/תִירוֹשִׁ֖/י בְּ/מֽוֹעֲד֑/וֹ וְ/הִצַּלְתִּי֙ צַמְרִ֣/י וּ/פִשְׁתִּ֔/י לְ/כַסּ֖וֹת אֶת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
translation:
  language: fr
  text: C’est pourquoi je reviendrai prendre mon grain en son temps et mon vin nouveau en sa saison ; j’enlèverai[a] ma laine et mon lin pour couvrir sa nudité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’arracherai ». Le verbe hébreu peut évoquer un retrait brusque ou un arrachement.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie « sa nudité » et peut aussi évoquer la honte liée au fait d’être exposée.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence du réquisitoire précédent dans un français naturel et soutenu.
- source_word: אָשׁוּב וְלָקַחְתִּי
  choice: je reprendrai
  rationale: Le verbe שוב associé à לקח exprime ici un retour à l’action conduisant à la reprise des biens accordés. Le français « reprendrai » restitue cette idée sans la formulation peu naturelle « je retournerai et prendrai ».
- source_word: דְגָנִי בְּעִתּוֹ
  choice: mon grain en son temps
  rationale: דגן désigne les céréales ou le grain produit, et le suffixe de בְּעִתּוֹ renvoie à son temps propre, celui de la récolte.
- source_word: וְתִירוֹשִׁי בְּמוֹעֲדוֹ
  choice: et mon vin nouveau en sa saison
  rationale: תירוש désigne le produit frais de la vigne, souvent rendu par « vin nouveau » ; מועד indique le moment fixé ou la saison appropriée.
- source_word: וְהִצַּלְתִּי
  choice: j’arracherai
  rationale: Le hiphil de נצל peut signifier retirer ou arracher. Dans ce contexte de dépossession, « arracherai » conserve la force soudaine du verbe.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: ma laine et mon lin
  rationale: Les deux termes désignent les matières textiles ; פשתה est le lin plutôt que le tissu fini.
- source_word: לְכַסּוֹת אֶת־עֶרְוָתָהּ
  choice: qui devaient couvrir sa nudité
  rationale: La relative exprime naturellement en français la fonction des matières retirées, tandis que « nudité » préserve l’image concrète et son association possible à la honte.
theological_decisions:
- issue: Rendre explicite la reprise par YHWH de biens auparavant accordés
  choice: Employer « je reprendrai »
  alternative: Traduire formellement « je reviendrai et je prendrai »
  rationale: Le contexte présente les produits comme appartenant à YHWH et désormais retirés. « Reprendre » rend la dépossession implicite sans ajouter d’explication doctrinale.
- issue: Préserver l’image d’exposition en עֶרְוָתָהּ
  choice: Conserver « sa nudité » dans le texte
  alternative: Employer « sa honte »
  rationale: Le terme hébreu désigne concrètement la nudité, avec une possible connotation de honte. La traduction ne réduit pas l’image à cette seule connotation.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme agricole est conservé, ainsi que l’attribution répétée des biens à YHWH (« mon »). Les notes signalent les nuances lexicales sans atténuer la métaphore prophétique.
