language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רִדְּפָ֤ה אֶת מְאַהֲבֶ֨י/הָ֙ וְ/לֹֽא תַשִּׂ֣יג אֹתָ֔/ם וּ/בִקְשָׁ֖תַ/ם וְ/לֹ֣א תִמְצָ֑א וְ/אָמְרָ֗ה אֵלְכָ֤ה וְ/אָשׁ֨וּבָה֙ אֶל אִישִׁ֣/י הָֽ/רִאשׁ֔וֹן כִּ֣י ט֥וֹב לִ֛/י אָ֖ז מֵ/עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
translation:
  language: fr
  text: 'Elle poursuivra ses amants, mais elle ne les rattrapera pas ; elle les cherchera, mais elle ne les trouvera pas. Alors elle dira : « Je partirai et je retournerai auprès de mon premier mari, car j’étais mieux autrefois que maintenant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִדְּפָה
  choice: Elle poursuivra
  rationale: Dans cette séquence prophétique, la forme verbale décrit naturellement une action future. « Poursuivra » conserve l’image d’une poursuite active.
- source_word: מְאַהֲבֶיהָ
  choice: ses amants
  rationale: Dans la métaphore conjugale d’Osée, le terme désigne des partenaires illicites. « Amants » rend directement cette dimension sans l’atténuer.
- source_word: תַשִּׂיג
  choice: elle ne les rattrapera pas
  rationale: Après « poursuivra », « rattrapera » restitue précisément l’idée de ne pas parvenir à rejoindre ceux que l’on poursuit.
- source_word: וּבִקְשָׁתַם
  choice: elle les cherchera
  rationale: Le verbe exprime une recherche intentionnelle ; cette formulation simple maintient le parallélisme avec « trouvera ».
- source_word: תִמְצָא
  choice: elle ne les trouvera pas
  rationale: « Trouver » est l’équivalent français direct dans le contexte d’une recherche infructueuse.
- source_word: וְאָמְרָה
  choice: Alors elle dira
  rationale: '« Alors » exprime clairement la progression : l’échec de sa recherche mène à la résolution qui suit.'
- source_word: אֵלְכָה וְאָשׁוּבָה
  choice: Je partirai et je retournerai
  rationale: La traduction garde les deux verbes et leur nuance de résolution, au lieu de les fondre en un simple « je retournerai ».
- source_word: אֶל אִישִׁי הָרִאשׁוֹן
  choice: auprès de mon premier mari
  rationale: Dans ce contexte conjugal, אִישׁ signifie « mari », et הָרִאשׁוֹן signifie littéralement « premier ». « Auprès de » rend naturellement le mouvement vers la relation antérieure.
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  choice: car j’étais mieux autrefois que maintenant
  rationale: Cette formulation française naturelle préserve l’opposition temporelle entre la situation passée et la situation présente.
theological_decisions:
- issue: Métaphore conjugale de l’infidélité d’Israël
  choice: Conserver directement les termes « amants » et « mari »
  alternative: Remplacer la métaphore par des termes interprétatifs tels qu’« alliés », « protecteurs » ou « fournisseurs »
  rationale: Le texte s’inscrit dans la métaphore conjugale continue d’Osée. Les amants peuvent symboliser des divinités étrangères ou des alliances politiques, mais le verset lui-même ne tranche pas ici entre ces référents et emploie explicitement un langage conjugal.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « mais elle ne… pas » conserve le parallélisme hébreu, tandis que « premier mari » maintient la formulation concrète du texte source sans imposer une interprétation symbolique particulière.
