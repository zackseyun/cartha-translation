    issue: Temps de « on leur disait »
    rationale: Le premier יֵאָמֵר est un imparfait passif, en contraste avec le second qui porte naturellement une valeur future dans la promesse. « On leur disait » introduit un passé contextuel qui n’est pas exprimé par l’hébreu. « On leur dit » maintient l’indétermination de l’agent et rend plus directement la forme source.
