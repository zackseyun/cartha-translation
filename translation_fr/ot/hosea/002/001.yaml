source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
translation:
  language: fr
  text: 'Pourtant, le nombre des fils d’Israël sera comme le sable de la mer[a], qu’on ne peut ni mesurer ni compter. Et là même où on leur dit : « Vous n’êtes pas mon peuple », on leur dira : « Fils du Dieu vivant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « enfants d’Israël » et « enfants du Dieu vivant ». L’hébreu emploie « fils » dans les deux expressions.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְהָיָה
  choice: Pourtant, ... sera
  rationale: Le waw introduit ici, dans le contexte, un net retournement du jugement vers la restauration. « Pourtant » en rend naturellement la valeur adversative, tandis que le futur exprime la promesse.
- source_word: מִסְפַּר
  choice: le nombre
  rationale: Ce choix direct conserve le sens ordinaire du nom et son lien avec l’impossibilité de mesurer ou de compter.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: « Fils » reflète le masculin pluriel hébreu et maintient le parallèle avec « fils du Dieu vivant » à la fin du verset.
- source_word: כְּחוֹל הַיָּם
  choice: comme le sable de la mer
  rationale: Formulation française naturelle qui conserve l’image biblique traditionnelle de l’innombrable multitude.
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  choice: qu’on ne peut ni mesurer ni compter
  rationale: Les formes passives expriment ici une impossibilité pratique. La tournure impersonnelle française préserve l’absence d’un agent déterminé et distingue les deux verbes.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: là même où
  rationale: Cette expression idiomatique conserve la portée locative tout en soulignant que le renversement se produit précisément au lieu de la déclaration de rejet.
- source_word: יֵאָמֵר ... יֵאָמֵר
  choice: on leur disait ... on leur dira
  rationale: Le pronom impersonnel « on » rend naturellement les passifs hébreux sans identifier le locuteur. L’imparfait dans la première proposition situe la parole de rejet par rapport à son renversement futur.
- source_word: לֹא עַמִּי אַתֶּם
  choice: Vous n’êtes pas mon peuple
  rationale: Cette formulation française claire préserve la formule d’alliance et le sens contextuel de עַם.
- source_word: בְּנֵי אֵל חָי
  choice: Fils du Dieu vivant
  rationale: « Fils » conserve le masculin pluriel et le parallèle interne; « Dieu vivant » est l’équivalent français naturel et consacré de אֵל חָי.
theological_decisions:
- issue: Langage filial genré dans la formule de restauration de l’alliance
  choice: Conserver « fils » dans « fils d’Israël » et « Fils du Dieu vivant ».
  alternative: Employer « enfants d’Israël » et « enfants du Dieu vivant ».
  rationale: Le texte hébreu emploie בְּנֵי, masculin pluriel, aux deux endroits. Le maintien de « fils » reflète la forme source et préserve le parallèle rhétorique, tandis qu’une note signale l’alternative française plus englobante.
- issue: Valeur discursive du waw initial
  choice: Traduire par « Pourtant ».
  alternative: Traduire par « Et » ou « Or ».
  rationale: Le contexte passe brusquement de l’annonce du jugement à une promesse de multiplication et de restauration. « Pourtant » explicite ce contraste sans résoudre une tension théologique étrangère au texte.
- issue: Identité du locuteur des deux déclarations
  choice: Employer la tournure impersonnelle « on leur disait ... on leur dira ».
  alternative: Nommer Dieu comme locuteur ou conserver un passif plus lourd.
  rationale: Les verbes hébreux sont passifs et ne nomment pas explicitement l’agent. La traduction évite donc d’imposer une identification, tout en restant naturelle en français.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement solennelle sans archaïsme. « Là même où » rend le caractère concret et emphatique du retournement, et « on » permet de conserver l’indétermination des passifs hébreux.
