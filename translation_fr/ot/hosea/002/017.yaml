    issue: « je lui rendrai ses vignes »
    rationale: נתן signifie « donner » ; « rendre » introduit l’idée d’une restitution d’un bien antérieurement possédé. Cette idée peut convenir au contexte, mais elle n’est pas portée explicitement par le verbe et réduit la fidélité lexicale.
  - severity: low
    issue: Emplacement de l’appel de note b
    rationale: La note b porte sur la vallée d’Akor, mais son appel est actuellement placé après « Égypte ». Le déplacer après « Akor » rétablit un ancrage transparent.
