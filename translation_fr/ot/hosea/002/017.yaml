revisions:
- from: Et de là, je lui rendrai ses vignes, et je ferai de la vallée d’Akor une porte d’espérance. Là, elle répondra[a] comme aux jours de sa jeunesse, comme au jour où elle est montée du pays d’Égypte.[b]
  to: Et de là, je lui donnerai ses vignes et je ferai de la vallée d’Akor[b] une porte d’espérance. Là, elle répondra[a] comme aux jours de sa jeunesse, comme au jour où elle est montée du pays d’Égypte.
  rationale: La révision remplace « rendrai » par « donnerai », traduction directe de נתן qui évite d’expliciter une restitution seulement suggérée par le contexte. Elle déplace aussi l’appel de la note historique au syntagme qu’elle éclaire. Aucune autre modification n’est requise.
