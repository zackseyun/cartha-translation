source:
  edition: WLC
  text: וְ/נָתַ֨תִּי לָ֤/הּ אֶת כְּרָמֶ֨י/הָ֙ מִ/שָּׁ֔ם וְ/אֶת עֵ֥מֶק עָכ֖וֹר לְ/פֶ֣תַח תִּקְוָ֑ה וְ/עָ֤נְתָה שָּׁ֨מָּ/ה֙ כִּ/ימֵ֣י נְעוּרֶ֔י/הָ וִּ/כְ/י֖וֹם עֲלֹתָ֥/הּ מֵ/אֶֽרֶץ מִצְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
translation:
  language: fr
  text: Et de là, je lui donnerai ses vignes et je ferai de la vallée d’Akor[b] une porte d’espérance. Là, elle répondra[a] comme aux jours de sa jeunesse, comme au jour où elle est montée du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle chantera là ». Le verbe hébreu signifie normalement « répondre », mais il peut ici évoquer une réponse chantée.
    reason: lexical_alternative
  - marker: b
    text: 'La vallée d’Akor rappelle le lieu associé au jugement d’Akân (Josué 7.24-26) : un lieu de malheur devient ainsi une porte d’espérance.'
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי לָהּ אֶת־כְּרָמֶיהָ מִשָּׁם
  choice: Et de là, je lui rendrai ses vignes
  rationale: Le verbe נתן signifie littéralement « donner ». Dans ce contexte de restauration, « rendre » exprime naturellement en français le rétablissement des vignes qui lui appartenaient, tandis que « de là » conserve le lien spatial avec le contexte précédent.
- source_word: עֵמֶק עָכוֹר
  choice: la vallée d’Akor
  rationale: Le nom propre est translittéré sous la forme française courante « Akor », en conservant l’allusion au lieu de Josué 7.
- source_word: לְפֶתַח תִּקְוָה
  choice: une porte d’espérance
  rationale: פתח désigne une ouverture ou une porte, et לְ indique ici la fonction ou le résultat. Cette formulation garde intacte la métaphore hébraïque.
- source_word: וְעָנְתָה שָּׁמָּה
  choice: Là, elle répondra
  rationale: Le sens lexical premier de ענה au qal est « répondre ». Le contexte permet éventuellement l’idée de chanter en réponse, sans l’imposer.
- source_word: כִּימֵי נְעוּרֶיהָ
  choice: comme aux jours de sa jeunesse
  rationale: Traduction proche de l’hébreu et naturelle dans un registre biblique moderne.
- source_word: וּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ מִצְרָיִם
  choice: comme au jour où elle est montée du pays d’Égypte
  rationale: La formulation conserve l’image hébraïque de la montée hors d’Égypte et l’allusion à l’Exode.
theological_decisions:
- issue: Sens de וְעָנְתָה dans le contexte de la restauration
  choice: elle répondra
  alternative: elle chantera / elle répondra par des chants
  rationale: « Répondre » préserve le sens fondamental du verbe et l’ambiguïté du texte. La possibilité d’un chant responsorial est signalée en note plutôt qu’imposée dans le texte.
- issue: Portée de la vallée d’Akor
  choice: Conserver le nom propre et expliquer l’allusion en note
  alternative: Traduire ou expliciter directement comme « vallée du Malheur »
  rationale: Le texte nomme un lieu réel tout en jouant probablement sur son association avec le malheur. La translittération évite de réduire le nom propre à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans devenir artificielle. « Espérance » convient mieux que « espoir » au registre poétique et théologique du passage, sans ajouter de contenu doctrinal.
