reference: Hosea 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
translation:
  language: fr
  text: 'Car leur mère s’est prostituée[a] ; celle qui les a conçus s’est conduite honteusement[b]. Elle a dit : « J’irai à la suite de mes amants, eux qui me donnent mon pain et mon eau, ma laine et mon lin, mon huile et mes boissons[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « s’est livrée à la prostitution ». L’hébreu emploie une image sexuelle explicite pour parler de l’infidélité à l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « a agi honteusement » ou « les a couverts de honte ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ce que je bois », voire « ma provision de boisson ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  choice: s’est prostituée
  rationale: Le verbe désigne littéralement une conduite sexuelle illicite et porte, dans la métaphore prophétique, l’idée d’infidélité à l’alliance. Cette formulation conserve la force sexuelle du texte sans la réduire à une simple infidélité générale.
- source_word: אִמָּם
  choice: leur mère
  rationale: Traduction directe du nom avec suffixe de troisième personne du pluriel ; la mère représente collectivement le peuple dans la métaphore du passage.
- source_word: הֹבִישָׁה
  choice: s’est conduite honteusement
  rationale: Le hiphil de בוש peut décrire une conduite honteuse ou l’action de couvrir autrui de honte. Ici, le parallélisme et les verbes féminins singuliers mettent surtout en avant la conduite de la mère.
- source_word: הוֹרָתָם
  choice: celle qui les a conçus
  rationale: Cette formulation conserve le sens de הרה, « concevoir », ainsi que le parallélisme poétique avec « leur mère », sans fondre les deux expressions.
- source_word: אֵלְכָה אַחֲרֵי
  choice: J’irai à la suite de
  rationale: Cette tournure rend le mouvement vers les partenaires recherchés et reste naturelle dans un registre français digne.
- source_word: מְאַהֲבַי
  choice: mes amants
  rationale: Dans la métaphore conjugale d’Osée, il s’agit de partenaires illicites, non simplement de personnes aimées.
- source_word: נֹתְנֵי
  choice: eux qui me donnent
  rationale: Le participe substantivé présente les amants comme ceux qui pourvoient à ses besoins ; « eux » souligne cette attribution erronée sans ajouter d’interprétation.
- source_word: לַחְמִי וּמֵימַי
  choice: mon pain et mon eau
  rationale: La traduction garde les images concrètes des denrées essentielles plutôt que de généraliser par « nourriture ».
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: ma laine et mon lin
  rationale: פשתים désigne le lin, notamment comme matière textile ; « lin » correspond plus directement à l’hébreu que « vêtements de lin ».
- source_word: שַׁמְנִי
  choice: mon huile
  rationale: « Huile » suffit à rendre le terme hébreu ; préciser « d’olive » ajouterait une information implicite mais non exprimée.
- source_word: שִׁקּוּיָי
  choice: mes boissons
  rationale: La forme désigne les boissons ou l’approvisionnement en boisson. Le pluriel français rend naturellement la forme hébraïque tout en laissant ouverte l’étendue exacte de la provision.
theological_decisions:
- issue: Métaphore conjugale prophétique et infidélité à l’alliance
  choice: Conserver explicitement l’image sexuelle par « s’est prostituée » et « mes amants ».
  alternative: Atténuer l’image par « a été infidèle » et « ceux qu’elle aime ».
  rationale: Osée emploie délibérément le langage de la sexualité et de l’adultère pour évoquer la rupture d’alliance et l’idolâtrie. La traduction maintient cette tension théologique sans expliciter dans le corps du verset ce que la métaphore représente.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle de « leur mère » et « celle qui les a conçus » est conservé. Le vocabulaire concret des provisions est maintenu, ainsi que la rudesse voulue de la métaphore sexuelle.
