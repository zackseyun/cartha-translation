  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵרַשְׂתִּ֥י/ךְ לִ֖/י בֶּ/אֱמוּנָ֑ה וְ/יָדַ֖עַתְּ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
translation:
  language: fr
  text: Et je te fiancerai à moi dans la fidélité[a], et tu connaîtras Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la loyauté » ou, plus formellement, « dans la foi ». Le terme hébreu évoque la fiabilité et la fidélité à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  choice: Et je te fiancerai
  rationale: Le verbe désigne précisément l’entrée dans une relation de fiançailles. Cette formulation préserve l’image conjugale et l’engagement d’alliance du passage.
- source_word: לִי
  choice: à moi
  rationale: Traduction directe de la préposition avec suffixe de première personne, qui exprime ici l’appartenance relationnelle sans explicitation supplémentaire.
- source_word: בֶּאֱמוּנָה
  choice: dans la fidélité
  rationale: Dans ce contexte conjugal et d’alliance, le nom évoque la constance, la fiabilité et la fidélité. « Fidélité » rend ce sens plus clairement que « foi », qui pourrait être compris comme la seule croyance subjective.
- source_word: וְיָדַעַתְּ
  choice: et tu connaîtras
  rationale: Le verbe signifie « connaître » et peut porter ici une profondeur relationnelle et liée à l’alliance. La traduction conserve cette richesse sans l’expliciter excessivement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Portée relationnelle de « connaître » dans le contexte conjugal et d’alliance
  choice: Conserver « connaître » sans ajout explicatif dans le texte principal
  alternative: « reconnaître Yahweh » ou « connaître intimement Yahweh »
  rationale: Le contexte donne au verbe sa profondeur relationnelle. Une expansion dans le texte principal trancherait trop nettement une richesse sémantique que l’hébreu laisse implicite.
translation_notes:
  register: Français moderne, digne et accessible. Le féminin singulier de l’interlocutrice est implicite dans le contexte et dans la forme hébraïque, sans devoir être ajouté artificiellement en français. La répétition de « et » respecte la coordination du texte source.
