base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
translation:
  language: fr
  text: 'C’est pourquoi, me voici : je vais barrer ton chemin avec des épines[a] et dresser un mur autour d’elle[b], si bien qu’elle ne trouvera pas ses sentiers[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec des buissons épineux » ou « avec des broussailles épineuses ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici une tournure concise et difficile, littéralement proche de « je murerai son mur »; le sens paraît être que Dieu dressera une barrière autour d’elle.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe de la deuxième personne (« ton chemin ») à la troisième (« elle… ses sentiers »). Ce changement est conservé.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement la conséquence du jugement annoncé dans le contexte précédent.
- source_word: הִנְנִי
  choice: me voici
  rationale: Rend l’annonce déictique et emphatique de l’action divine dans un français biblique actuel et digne.
- source_word: שָׂךְ
  choice: je vais barrer
  rationale: Le contexte donne à la forme participiale une valeur d’action imminente; « barrer » exprime clairement l’obstruction sans perdre l’image du chemin.
- source_word: דַּרְכֵּךְ
  choice: ton chemin
  rationale: Conserve le singulier et le suffixe féminin de deuxième personne, ainsi que la portée concrète et figurée de דֶּרֶךְ.
- source_word: בַּסִּירִים
  choice: avec des épines
  rationale: Désigne une végétation épineuse formant un obstacle; ce choix est vivant et idiomatique en français.
- source_word: וְגָדַרְתִּי אֶת גְּדֵרָהּ
  choice: et dresser un mur autour d’elle
  rationale: La tournure hébraïque, fondée sur un verbe et un nom apparentés, est concise et difficile. Cette formulation restitue le sens probable d’une barrière érigée autour d’elle sans reproduire un calque français obscur.
- source_word: וּנְתִיבוֹתֶיהָ
  choice: ses sentiers
  rationale: Conserve le pluriel et le passage à la troisième personne féminine; « sentiers » maintient l’image des voies recherchées.
- source_word: לֹא תִמְצָא
  choice: si bien qu’elle ne trouvera plus
  rationale: Exprime le résultat de l’obstruction. « Plus » rend naturellement en contexte l’impossibilité désormais imposée, sans prétendre que l’adverbe est lexicalement présent.
theological_decisions:
- issue: Changement de personne grammaticale
  choice: Conserver le passage de « ton chemin » à « elle / ses sentiers ».
  alternative: Harmoniser tout le verset à la deuxième personne (« tes sentiers ») ou à la troisième (« son chemin »).
  rationale: Le texte hébreu passe de la deuxième personne féminine à la troisième personne féminine. Préserver ce mouvement respecte la rhétorique prophétique et évite de résoudre artificiellement la tension.
- issue: Nature de la seconde barrière
  choice: Rendre l’expression par « dresser un mur autour d’elle » tout en signalant son caractère difficile.
  alternative: Traduire littéralement « murer son mur » ou comprendre « l’enfermer derrière une clôture ».
  rationale: Le verbe גדר et le nom apparenté גדרה évoquent l’édification d’une barrière. La traduction choisie communique le sens probable sans imposer une précision matérielle ou théologique absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Me voici » conserve la solennité de l’annonce sans archaïsme excessif. La syntaxe reste fluide tout en préservant le changement rhétorique de personne et l’image progressive d’un chemin d’abord barré par des épines, puis entouré d’un mur.
