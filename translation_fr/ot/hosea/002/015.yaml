source:
  edition: WLC
  text: וּ/פָקַדְתִּ֣י עָלֶ֗י/הָ אֶת יְמֵ֤י הַ/בְּעָלִים֙ אֲשֶׁ֣ר תַּקְטִ֣יר לָ/הֶ֔ם וַ/תַּ֤עַד נִזְמָ/הּ֙ וְ/חֶלְיָתָ֔/הּ וַ/תֵּ֖לֶךְ אַחֲרֵ֣י מְאַהֲבֶ֑י/הָ וְ/אֹתִ֥/י שָׁכְחָ֖ה נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
translation:
  language: fr
  text: Je lui demanderai des comptes pour les jours des Baals, où elle leur offrait de l’encens. Elle se parait de son anneau[a] et de ses bijoux, allait à la suite de ses amants et m’oubliait — déclaration de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « anneau de nez » ou « boucle d’oreille ». Le mot hébreu peut désigner différents anneaux servant de parure.
    reason: alternative lexicale
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  choice: Je lui demanderai compte
  rationale: Avec עַל dans un contexte de jugement, פקד exprime ici l’idée de demander des comptes et de punir. Cette formulation française conserve la force judiciaire sans réduire le verbe au seul châtiment.
- source_word: יְמֵי הַבְּעָלִים
  choice: les jours consacrés aux Baals
  rationale: Le pluriel désigne les diverses manifestations ou figures cultuelles de Baal. « Consacrés » explicite naturellement que ces jours étaient voués à leur culte, sans imposer qu’il s’agisse uniquement de fêtes formelles.
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  choice: où elle faisait brûler des offrandes pour eux
  rationale: Le hiphil de קטר désigne le fait de faire monter la fumée d’une offrande et peut inclure l’encens sans s’y limiter. « Des offrandes » préserve cette étendue sémantique.
- source_word: וַתַּעַד
  choice: Elle se parait
  rationale: Le verbe exprime le fait de se parer ou de s’orner; cette tournure est naturelle, actuelle et adaptée au registre poétique.
- source_word: נִזְמָהּ
  choice: son anneau
  rationale: נזם peut désigner un anneau porté au nez ou à l’oreille. Le terme général « anneau » maintient l’indétermination, précisée en note.
- source_word: וְחֶלְיָתָהּ
  choice: ses bijoux
  rationale: חֶלְיָה renvoie à une parure ou à des bijoux; le pluriel collectif est idiomatique en français.
- source_word: מְאַהֲבֶיהָ
  choice: ses amants
  rationale: Dans la métaphore conjugale d’Osée, ce terme désigne les partenaires infidèles recherchés par Israël, notamment les divinités et puissances auxquelles elle s’attache.
- source_word: וְאֹתִי שָׁכְחָה
  choice: et moi, elle m’oubliait
  rationale: La dislocation met en relief le pronom אֹתִי placé en tête et rend le contraste marqué avec la poursuite des amants, tout en conservant la coordination hébraïque.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם est une formule prophétique solennelle. Le nom divin est translittéré « Yahweh » afin de rendre explicitement le tétragramme.
theological_decisions:
- issue: Sens judiciaire de פקד על
  choice: demander compte
  alternative: punir
  rationale: Le contexte annonce bien un jugement, mais l’expression choisie conserve la notion de mise en cause ou de reddition de comptes inhérente au verbe, sans affaiblir sa portée punitive.
- issue: Identification des « Baals »
  choice: conserver le pluriel « Baals »
  alternative: les idoles de Baal
  rationale: Le pluriel hébreu peut viser diverses manifestations locales ou représentations cultuelles de Baal. Le conserver évite de trancher plus précisément que le texte.
- issue: Nature de ce qui était brûlé
  choice: des offrandes
  alternative: de l’encens
  rationale: Le verbe peut concerner l’encens, mais aussi plus largement la fumée sacrificielle. La formulation retenue préserve cette amplitude rituelle.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom propre divin; sa translittération permet de préserver cette donnée du texte source.
translation_notes:
  register: Français moderne, digne et accessible. L’image conjugale et le contraste emphatique entre les amants et Yahweh sont conservés. L’imparfait rend les actions habituelles associées aux jours du culte des Baals; le futur marque le jugement annoncé.
