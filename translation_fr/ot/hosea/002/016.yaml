review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement la séquence : conséquence (לָכֵן), appel d’attention (הִנֵּה), initiative divine, conduite vers le désert et parole adressée au cœur. Toutefois, « séduire » évoque fréquemment en français moderne une séduction sexuelle ou trompeuse et risque de surdéterminer פתה dans ce contexte restaurateur. « Attirer » rend mieux l’idée d’allure/attraction tout en laissant à la note les nuances de persuasion et de tendresse. La note appelle « littérale » une formulation qui ne reflète pas la préposition עַל (« sur ») ; elle doit être rectifiée.'
  naturalness: « C’est pourquoi, voici que » est soutenu mais naturel dans un registre prophétique moderne. « Je vais l’attirer » et « je lui parlerai au cœur » sont idiomatiques, accessibles et conservent la dignité du passage. Le point-virgule articule bien le retournement annoncé.
  terminology: « Désert » convient à הַמִּדְבָּר dans l’usage biblique français. « Conduire » rend adéquatement le causatif de הלך. « Parler au cœur » est une expression française établie qui préserve l’image hébraïque sans imposer une interprétation confessionnelle.
