revisions:
- from: C’est pourquoi, voici que je vais la séduire ; je la conduirai au désert et je parlerai à son cœur[a].
  to: C’est pourquoi, voici que je vais l’attirer ; je la conduirai au désert et je lui parlerai au cœur[a].
  rationale: La révision remplace « séduire » par « attirer », équivalent moderne plus sûr de la nuance d’allure de פתה dans ce cadre de restauration, sans effacer la dimension persuasive par une note inutilement lourde. Elle remplace aussi « à son cœur » par « au cœur », tournure française plus idiomatique avec « parler », et corrige la mention de la littéralité dans la note.
