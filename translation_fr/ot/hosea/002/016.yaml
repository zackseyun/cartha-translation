    issue: Connotation de « séduire »
    rationale: En français international actuel, le terme suggère souvent une relation sexuelle ou une manœuvre trompeuse. Bien que פתה puisse comporter l’idée d’attirer ou d’entraîner, le contexte de restauration favorise « attirer », avec les autres nuances conservées en note.
  - severity: low
    issue: Présentation inexacte de la littéralité dans la note
    rationale: La note qualifie « je parlerai à son cœur » de littéral, alors que l’hébreu porte littéralement « je parlerai sur son cœur ». Le texte principal peut employer l’expression française naturelle, mais la note doit distinguer l’idiome de la traduction mot à mot.
