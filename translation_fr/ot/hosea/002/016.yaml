  text: לָ/כֵ֗ן הִנֵּ֤ה אָֽנֹכִי֙ מְפַתֶּ֔י/הָ וְ/הֹֽלַכְתִּ֖י/הָ הַ/מִּדְבָּ֑ר וְ/דִבַּרְתִּ֖י עַל לִבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
translation:
  language: fr
  text: C’est pourquoi, voici que je vais l’attirer ; je la conduirai au désert et je lui parlerai au cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je lui parlerai avec tendresse ». Littéralement : « je parlerai sur son cœur ».'
    reason: Précise à la fois la formulation hébraïque et la valeur idiomatique de l’expression, tout en conservant dans le texte l’image française du cœur.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence rhétorique inattendue qui fait passer du jugement annoncé à l’initiative de restauration.
- source_word: הִנֵּה אָנֹכִי
  choice: voici que je
  rationale: « Voici que » conserve la fonction d’appel à l’attention de הִנֵּה. En français, la tournure met déjà en relief le sujet divin sans alourdir le texte par « moi-même ».
- source_word: מְפַתֶּיהָ
  choice: je vais la séduire
  rationale: Le participe exprime ici une action imminente. « Séduire » garde la dimension affective et persuasive de פתה dans la métaphore conjugale, tout en préservant une part de l’ambivalence du terme hébreu.
- source_word: וְהֹלַכְתִּיהָ
  choice: je la conduirai
  rationale: La forme causative de הלך signifie faire aller, mener. « Conduire » exprime une direction intentionnelle sans réduire le mouvement au simple fait d’amener.
- source_word: הַמִּדְבָּר
  choice: au désert
  rationale: « Désert » est le terme français biblique naturel pour מִדְבָּר et évoque à la fois un espace aride et le lieu fondateur de la rencontre entre Dieu et Israël.
- source_word: וְדִבַּרְתִּי עַל לִבָּהּ
  choice: et je parlerai à son cœur
  rationale: Cette traduction conserve l’image hébraïque et son caractère intime. L’expression peut aussi signifier parler avec tendresse ou de manière réconfortante.
theological_decisions:
- issue: Tonalité de פתה dans la métaphore de restauration conjugale
  choice: je vais la séduire
  alternative: je vais l’attirer / la persuader
  rationale: Le contexte présente une reprise gracieuse de la relation après le jugement, mais le verbe פתה possède une gamme de sens qui peut inclure persuasion et séduction. « Séduire » maintient ici la force affective de la métaphore sans effacer cette tension lexicale.
- issue: Portée de l’expression עַל לִבָּהּ
  choice: je parlerai à son cœur
  alternative: je lui parlerai avec tendresse
  rationale: La formulation littérale préserve la métaphore du cœur et laisse ouvertes ses nuances de consolation, de persuasion et d’intimité ; l’équivalent idiomatique est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule met en relief l’initiative annoncée après « voici » et articule naturellement les actions successives. Le marqueur [a] est placé après l’expression qu’il explique.
