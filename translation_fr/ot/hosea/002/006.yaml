    reason: lexical_alternative
  revision_rationale: La révision conserve la structure, le jugement et l’imagerie sévère de l’hébreu. Elle améliore l’idiomaticité française et évite que « enfants de prostitution » ne fixe indûment une interprétation de parenté littérale. La note préserve les alternatives pertinentes ainsi que la portée symbolique du contexte.
