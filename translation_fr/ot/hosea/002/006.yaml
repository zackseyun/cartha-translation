revisions:
- from: Et je n’aurai pas compassion de ses enfants[a], car ce sont des enfants de prostitution.
  to: Et je n’aurai pas de compassion pour ses enfants[a], car ce sont des enfants de débauche.
  rationale: La révision conserve la structure, le jugement et l’imagerie sévère de l’hébreu. Elle améliore l’idiomaticité française et évite que « enfants de prostitution » ne fixe indûment une interprétation de parenté littérale. La note préserve les alternatives pertinentes ainsi que la portée symbolique du contexte.
