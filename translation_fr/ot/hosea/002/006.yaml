  text: And I will not show compassion to her children[a], for they are children of whoredom.
translation:
  language: fr
  text: Et je n’aurai pas de compassion pour ses enfants[a], car ce sont des enfants de débauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enfants de prostitution » ou « enfants d’inconduite sexuelle ». L’hébreu emploie une expression forte, liée à l’infidélité sexuelle; dans le livre d’Osée, cette image évoque aussi l’infidélité à l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנֶיהָ
  choice: Et… ses enfants
  rationale: La conjonction introduit la nouvelle proposition, tandis que le marqueur d’objet direct n’a pas d’équivalent distinct en français. בנים est ici rendu au sens générique d’« enfants » plutôt que de « fils ».
- source_word: לֹא אֲרַחֵם
  choice: je n’aurai pas compassion
  rationale: Le piel de רחם exprime le fait d’éprouver ou de manifester de la compassion. Cette formulation reste naturelle et solennelle en français moderne, tout en conservant la portée affective et relationnelle du verbe.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du refus de compassion et convient au registre prophétique.
- source_word: בְנֵי זְנוּנִים
  choice: enfants de prostitution
  rationale: La formule conserve l’image sexuelle dure de זְנוּנִים et son évocation de l’infidélité, sans recourir au terme vieilli « débauche » ni réduire l’expression à la seule idée abstraite d’infidélité.
- source_word: הֵמָּה
  choice: ce sont
  rationale: La tournure française explicite la prédication et rend naturellement le pronom indépendant hébreu, légèrement emphatique.
theological_decisions:
- issue: Portée de בְנֵי זְנוּנִים dans la métaphore conjugale d’Osée
  choice: enfants de prostitution
  alternative: enfants nés de la prostitution ; enfants de débauche ; enfants de l’infidélité
  rationale: La traduction maintient l’imagerie sexuelle sévère qui symbolise l’infidélité à l’alliance. Elle ne précise toutefois pas si l’expression affirme littéralement une filiation illégitime ou fonctionne avant tout dans le cadre du signe prophétique, ambiguïté que le texte hébreu laisse subsister.
translation_notes:
  register: Français international moderne, clair et digne. « Prostitution » conserve la force de l’image sans employer un vocabulaire archaïque ; la note signale le pluriel abstrait/intensif de l’hébreu et la dimension symbolique sans effacer la tension littérale.
