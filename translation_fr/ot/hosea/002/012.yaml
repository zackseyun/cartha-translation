source:
  edition: WLC
  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: fr
  text: Et maintenant, je dévoilerai sa nudité sous les yeux de ses amants, et personne ne la délivrera de ma main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲגַלֶּה אֶת־נַבְלֻתָהּ
  choice: je dévoilerai sa nudité
  rationale: Le verbe גלה signifie ici « découvrir, dévoiler », et נַבְלוּת désigne la nudité exposée de manière honteuse. Cette formulation conserve l’image dure et publique du texte.
- source_word: לְעֵינֵי מְאַהֲבֶיהָ
  choice: sous les yeux de ses amants
  rationale: Expression française naturelle qui garde le sens d’une exposition devant ceux qu’elle présente comme ses partenaires amoureux.
- source_word: וְאִישׁ לֹא יַצִּילֶנָּה
  choice: et personne ne la délivrera
  rationale: 'אִישׁ négativé a ici une portée générale : aucun être humain ne pourra intervenir. « Personne » l’exprime naturellement sans restreindre artificiellement le propos aux hommes de sexe masculin.'
- source_word: מִיָּדִי
  choice: de ma main
  rationale: L’image hébraïque de la main évoque la puissance ou l’emprise. La traduction littérale reste claire en français et préserve la force poétique.
theological_decisions:
- issue: Nature de l’exposition annoncée
  choice: Conserver l’image explicite de la nudité dévoilée
  alternative: Atténuer par « révéler sa honte »
  rationale: Le texte source associe étroitement nudité, honte et jugement public. Une paraphrase atténuée supprimerait l’image concrète et la tension du passage.
- issue: Portée de אִישׁ dans la négation
  choice: « personne »
  alternative: « aucun homme »
  rationale: Dans cette construction, אִישׁ fonctionne comme un indéfini humain général. « Personne » transmet mieux l’affirmation théologique qu’aucun intervenant ne pourra arracher Israël à la main divine.
translation_notes:
  register: Français moderne, digne et direct. La syntaxe parallèle et l’image anthropomorphique « de ma main » sont conservées; aucune note n’est nécessaire.
