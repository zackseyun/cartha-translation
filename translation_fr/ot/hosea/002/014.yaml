base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
translation:
  language: fr
  text: 'Je dévasterai sa vigne et son figuier, dont elle disait : « Voilà le salaire[a] que m’ont donné mes amants. » J’en ferai une forêt, et les animaux sauvages des champs les dévoreront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rétribution » ; le mot hébreu peut aussi désigner le salaire d’une prostituée dans la métaphore d’infidélité employée par Osée.
    reason: Alternative lexicale et nuance contextuelle.
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: Je dévasterai
  rationale: Le hiphil de שׁמם exprime ici l’action de rendre dévasté. « Dévaster » restitue clairement la force du jugement en français actuel.
- source_word: גַּפְנָהּ וּתְאֵנָתָהּ
  choice: sa vigne et son figuier
  rationale: Cette traduction conserve les deux images agricoles au singulier et rend naturellement תְּאֵנָה par « figuier ».
- source_word: אֶתְנָה
  choice: le salaire
  rationale: Le mot désigne une rétribution et peut spécialement évoquer le salaire d’une prostituée. « Salaire » maintient le caractère transactionnel sans expliciter dans le corps du texte ce que le contexte métaphorique suggère.
- source_word: מְאַהֲבַי
  choice: mes amants
  rationale: Dans la métaphore d’infidélité d’Osée, « amants » exprime plus exactement la relation illicite que le terme général « ceux qui m’aiment ».
- source_word: וְשַׂמְתִּים לְיַעַר
  choice: Je les changerai en broussailles
  rationale: יַעַר peut désigner une forêt ou une zone de végétation sauvage. Ici, l’image est celle de cultures retournant à l’état sauvage ; « broussailles » est naturelle et cohérente avec le fait que les animaux les dévorent.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Cette formulation moderne restitue l’expression hébraïque sans le tour plus ancien « les bêtes des champs ».
theological_decisions:
- issue: Faut-il expliciter la nuance sexuelle de אֶתְנָה dans le texte principal ?
  choice: Employer « salaire » dans le texte et signaler la nuance en note.
  alternative: « salaire de prostituée » ou « rétribution »
  rationale: Le contexte d’Osée porte déjà la métaphore de l’infidélité. L’ajout de « prostituée » dans le texte principal rendrait explicite une nuance lexicale réelle, mais non formulée directement dans ce membre de phrase.
- issue: Valeur métaphorique des « amants »
  choice: Conserver simplement « mes amants ».
  alternative: Identifier explicitement les amants aux faux dieux ou aux alliances étrangères.
  rationale: Le verset entretient la métaphore conjugale. Identifier directement ses référents lèverait une tension interprétative que la traduction doit préserver.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu, tandis que « broussailles » rend naturellement l’idée d’une culture livrée à la végétation sauvage. Le marqueur [a] figure dans le texte principal.
