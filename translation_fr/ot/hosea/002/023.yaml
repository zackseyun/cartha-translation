  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא אֶֽעֱנֶה֙ נְאֻם יְהוָ֔ה אֶעֱנֶ֖ה אֶת הַ/שָּׁמָ֑יִם וְ/הֵ֖ם יַעֲנ֥וּ אֶת הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/023.yaml
  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
translation:
  language: fr
  text: En ce jour-là, déclare Yahweh, je répondrai aux cieux, et ils répondront à la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit le pays ; « terre » est retenu ici pour préserver le parallèle poétique avec « les cieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: il arrivera
  rationale: Cette tournure introduit naturellement une scène future tout en conservant la portée prophétique de la formule hébraïque.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Expression prophétique française courante, claire et digne, qui conserve la valeur temporelle de l’hébreu.
- source_word: אֶעֱנֶה / יַעֲנוּ
  choice: je répondrai / répondront
  rationale: La répétition de « répondre » maintient la chaîne poétique et la personnification voulues par les occurrences répétées de ענה.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation conserve le caractère solennel de la formule prophétique et son insertion parenthétique dans la phrase.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: « Les cieux » préserve le registre poétique et forme le pendant naturel de « la terre ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Ce choix préserve l’association poétique entre les cieux et la terre dans la chaîne agricole du contexte, sans nier le sens possible de « pays ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Interprétation de la répétition de ענה
  choice: Conserver le verbe « répondre » dans les deux propositions
  alternative: Expliciter par « envoyer la pluie » ou « rendre fertile »
  rationale: La traduction maintient la métaphore et la tension poétique du texte au lieu d’en imposer une explication agricole.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. L’incise « déclaration de Yahweh » respecte la position de la formule prophétique dans l’hébreu, tandis que la répétition de « répondre » conserve le mouvement poétique du verset.
