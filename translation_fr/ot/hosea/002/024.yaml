source:
  edition: WLC
  text: וְ/הָ/אָ֣רֶץ תַּעֲנֶ֔ה אֶת הַ/דָּגָ֖ן וְ/אֶת הַ/תִּיר֣וֹשׁ וְ/אֶת הַ/יִּצְהָ֑ר וְ/הֵ֖ם יַעֲנ֥וּ אֶֽת יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
translation:
  language: fr
  text: Et la terre répondra aux céréales, au vin nouveau et à l’huile, et ils répondront à Jizréel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Jizréel évoque en hébreu l’expression « Dieu sème ». Dans le livre d’Osée, il fonctionne à la fois comme nom de personne ou de lieu et comme symbole.
    reason: Jeu de mots et portée symbolique du nom hébreu.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: et la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. Dans la chaîne poétique ciel → terre → produits agricoles, « terre » restitue le mieux l’ordre créé personnifié.
- source_word: תַּעֲנֶה / יַעֲנוּ
  choice: répondra / répondront
  rationale: La répétition de ענה construit une chaîne de réponses. Le même verbe français en conserve la structure et la personnification.
- source_word: הַדָּגָן
  choice: le blé
  rationale: דָּגָן désigne les céréales ou le grain. « Blé » est naturel en français biblique moderne dans la triade agricole, tout en restant concret et immédiatement compréhensible.
- source_word: הַתִּירוֹשׁ
  choice: le vin nouveau
  rationale: תִּירוֹשׁ désigne couramment le vin nouveau, produit récent de la récolte; cette traduction garde la nuance agricole.
- source_word: הַיִּצְהָר
  choice: l’huile
  rationale: יִצְהָר désigne l’huile comme produit agricole, normalement l’huile d’olive. « L’huile » évite d’ajouter une précision absente de la formulation hébraïque.
- source_word: וְהֵם
  choice: et eux
  rationale: Le pronom masculin pluriel reprend collectivement le blé, le vin nouveau et l’huile. Le pronom tonique « eux » rend son antécédent plus clair malgré les genres différents en français.
- source_word: יִזְרְעֶאל
  choice: Jizréel
  rationale: Le nom propre est translittéré sous sa forme française usuelle; sa portée symbolique est signalée en note plutôt que remplacée par une interprétation.
theological_decisions:
- issue: Conserver ou expliciter la chaîne personnifiée de réponses
  choice: Conserver deux fois le verbe « répondre »
  alternative: La terre produira le blé, le vin nouveau et l’huile, qui nourriront Jizréel
  rationale: La répétition exprime la restauration comme une réponse ordonnée de la création sous l’action de Dieu; une paraphrase causale effacerait cette image.
- issue: Rendre la valeur symbolique du nom Jizréel
  choice: Garder le nom propre dans le texte et expliquer son sens en note
  alternative: Traduire le nom par « Dieu sème »
  rationale: Le texte emploie un nom propre qui porte aussi un jeu de sens. La translittération préserve l’identité du nom, tandis que la note rend accessible sa force symbolique sans trancher abusivement son rôle précis.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition volontaire de « répondre » et la personnification des éléments agricoles sont conservées. « Et eux » est légèrement marqué, mais clarifie la reprise collective des trois produits et maintient le rythme hébreu.
