source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּי֙ כָּל מְשׂוֹשָׂ֔/הּ חַגָּ֖/הּ חָדְשָׁ֣/הּ וְ/שַׁבַּתָּ֑/הּ וְ/כֹ֖ל מוֹעֲדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
translation:
  language: fr
  text: 'Je mettrai fin à toute sa joie : ses fêtes, ses nouvelles lunes, ses sabbats et toutes ses fêtes fixées[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses temps fixés » ; le terme hébreu peut désigner des temps déterminés ou, dans ce contexte, les fêtes religieuses qui leur correspondent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Je mettrai fin à
  rationale: Le hiphil de שׁבת exprime ici l’action causative de faire cesser; cette tournure est naturelle en français et conserve la force du jugement annoncé.
- source_word: כָּל מְשׂוֹשָׂהּ
  choice: toutes ses réjouissances
  rationale: מָשׂוֹשׂ désigne la joie ou les manifestations de joie; le pluriel français introduit naturellement la série des célébrations qui suit.
- source_word: חַגָּהּ
  choice: ses fêtes
  rationale: חַג désigne une fête religieuse, souvent liée à un pèlerinage; le pluriel collectif convient à l’énumération cultuelle.
- source_word: חָדְשָׁהּ
  choice: ses nouvelles lunes
  rationale: Dans ce contexte cultuel, חֹדֶשׁ désigne les célébrations mensuelles de la nouvelle lune, et non simplement les mois.
- source_word: וְשַׁבַּתָּהּ
  choice: ses sabbats
  rationale: Le terme renvoie collectivement aux jours de sabbat dans le calendrier religieux; la minuscule suit l’usage courant du français moderne.
- source_word: וְכֹל מוֹעֲדָהּ
  choice: et tous ses temps fixés
  rationale: מוֹעֵד peut désigner un temps fixé ou une fête prescrite. « Temps fixés » préserve l’étendue sémantique et évite de répéter « fêtes ».
theological_decisions:
- issue: Nature des observances énumérées
  choice: L’énumération vise principalement les célébrations du calendrier religieux d’Israël.
  alternative: L’intitulé peut aussi englober plus largement toutes les occasions de joie sociale.
  rationale: La suite « fêtes, nouvelles lunes, sabbats » relève clairement du vocabulaire cultuel, tandis que « toutes ses réjouissances » maintient la portée plus générale de l’annonce.
- issue: Portée de מוֹעֵד
  choice: Conserver la formulation ouverte « temps fixés » dans le texte.
  alternative: Traduire explicitement par « fêtes fixées » ou « célébrations prescrites ».
  rationale: Le contexte favorise les observances religieuses, mais le mot hébreu désigne fondamentalement un moment déterminé; la traduction ne doit pas supprimer cette nuance.
translation_notes:
  register: Français international moderne, simple et digne. Les possessifs répétés reproduisent l’insistance de l’hébreu. Les deux-points rendent clairement la relation entre le terme général « réjouissances » et l’énumération qui l’explicite.
