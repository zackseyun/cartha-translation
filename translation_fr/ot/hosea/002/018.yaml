id: HOS.2.18
reference: Hosea 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה תִּקְרְאִ֖י אִישִׁ֑/י וְ/לֹֽא תִקְרְאִי לִ֥/י ע֖וֹד בַּעְלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
translation:
  language: fr
  text: Et ce jour-là, déclare Yahweh, tu m’appelleras « mon mari », et tu ne m’appelleras plus « mon Baal »[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ba‘li peut signifier « mon maître », « mon seigneur », ou même « mon mari ». Il est rendu ici par « mon Baal » afin de préserver le jeu de mots et l’allusion probable au culte de Baal dans le contexte d’Osée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Et ce jour-là
  rationale: La formule hébraïque introduit une circonstance future. En français naturel, « Et ce jour-là » exprime cette valeur sans reproduire lourdement le verbe existentiel.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » conserve la solennité de la formule prophétique, tandis que « Yahweh » rend le nom divin personnel יהוה.
- source_word: תִּקְרְאִי
  choice: tu m’appelleras
  rationale: Le verbe קרא signifie ici s’adresser à quelqu’un au moyen d’une appellation. Le féminin singulier du verbe renvoie à Israël figuré comme épouse; le français ne marque pas ce genre dans la forme verbale.
- source_word: אִישִׁי
  choice: mon mari
  rationale: Dans la métaphore conjugale du passage, אִישִׁי désigne clairement le mari et exprime la relation d’alliance restaurée.
- source_word: וְלֹא תִקְרְאִי לִי עוֹד
  choice: et tu ne m’appelleras plus
  rationale: Cette tournure française rend naturellement la négation associée à עוֹד et son idée de cessation définitive.
- source_word: בַּעְלִי
  choice: mon Baal
  rationale: La translittération « Baal » préserve le jeu de mots et l’allusion probable au culte de Baal, tandis que « mon » rend le suffixe possessif hébreu. Une note signale les autres sens du nom commun.
theological_decisions:
- issue: Faut-il traduire בַּעְלִי selon son sens commun ou préserver son allusion probable au dieu Baal ?
  choice: mon Baal
  alternative: mon maître ; mon seigneur ; mon mari
  rationale: Dans le contexte d’Osée, le contraste oppose l’intimité conjugale de l’alliance à une appellation compromise par le culte de Baal. « Mon Baal » conserve cette tension et le jeu de mots sans cacher la polysémie hébraïque, expliquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise et prophétique. Les appellations entre guillemets mettent en relief le contraste relationnel et religieux du texte.
