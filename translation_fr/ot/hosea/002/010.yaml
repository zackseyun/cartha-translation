source:
  edition: WLC
  text: וְ/הִיא֙ לֹ֣א יָֽדְעָ֔ה כִּ֤י אָֽנֹכִי֙ נָתַ֣תִּי לָ֔/הּ הַ/דָּגָ֖ן וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֑ר וְ/כֶ֨סֶף הִרְבֵּ֥יתִי לָ֛/הּ וְ/זָהָ֖ב עָשׂ֥וּ לַ/בָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
translation:
  language: fr
  text: Mais elle ne savait pas que c’était moi qui lui ai donné le grain, le vin nouveau et l’huile, et qui lui ai donné abondamment de l’argent et de l’or, dont ils se sont servis pour Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis : il peut signifier qu’ils ont fabriqué une représentation de Baal avec l’argent et l’or, ou qu’ils ont employé ces biens plus généralement pour son culte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא לֹא יָדְעָה
  choice: Mais elle ne savait pas
  rationale: « Mais » exprime naturellement le contraste contextuel; « ne savait pas » rend directement le qal de ידע tout en laissant entendre, sans l’imposer, l’absence de reconnaissance.
- source_word: כִּי אָנֹכִי
  choice: que c’était moi qui
  rationale: La tournure clivée restitue l’insistance portée par le pronom indépendant אָנֹכִי.
- source_word: נָתַתִּי לָהּ
  choice: lui donnais
  rationale: L’imparfait français convient à l’évocation de dons répétés ou continus dans ce contexte, sans changer l’identité du donateur.
- source_word: הַדָּגָן
  choice: le blé
  rationale: Dans une triade agricole, « blé » est une désignation française naturelle des céréales alimentaires, bien que le terme hébreu puisse désigner les céréales plus largement.
- source_word: הַתִּירוֹשׁ
  choice: le vin nouveau
  rationale: Cette expression conserve la valeur agricole de תירוש, produit récent de la vigne.
- source_word: הַיִּצְהָר
  choice: l’huile
  rationale: Le mot désigne l’huile comme produit agricole, normalement l’huile d’olive; « huile » est ici clair et idiomatique.
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ וְזָהָב
  choice: et qui lui prodiguais l’argent et l’or
  rationale: « Prodiguer » communique l’idée causative d’abondance portée par le hiphil de רבה, dans un français naturel; le second objet coordonné dépend du même verbe.
- source_word: עָשׂוּ לַבָּעַל
  choice: dont ils se sont servis pour Baal
  rationale: L’hébreu est elliptique. Cette formulation préserve le pluriel inattendu et rend l’emploi des richesses au service de Baal sans affirmer exclusivement qu’elles ont été façonnées en statue.
theological_decisions:
- issue: Sens de לַבָּעַל dans le contexte idolâtre
  choice: pour Baal
  alternative: pour le Baal; pour le maître
  rationale: Le contexte vise la divinité cananéenne Baal. Le nom propre évite de transformer l’accusation en titre générique.
- issue: Nature exacte de l’usage de l’argent et de l’or
  choice: dont ils se sont servis pour Baal
  alternative: qu’ils ont transformés en une statue de Baal; qu’ils ont consacrés à Baal
  rationale: עָשׂוּ לַבָּעַל est concis et peut évoquer la fabrication d’une image ou, plus largement, l’emploi de ces biens dans le culte de Baal. Le texte principal maintient cette ouverture et la note l’explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’emphase sur Dieu comme véritable donateur, ainsi que le passage énigmatique du féminin singulier (« elle ») au pluriel (« ils »).
