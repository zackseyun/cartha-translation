source:
  edition: WLC
  text: וְ/אֵרַשְׂתִּ֥י/ךְ לִ֖/י לְ/עוֹלָ֑ם וְ/אֵרַשְׂתִּ֥י/ךְ לִ/י֙ בְּ/צֶ֣דֶק וּ/בְ/מִשְׁפָּ֔ט וּ/בְ/חֶ֖סֶד וּֽ/בְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/021.yaml
  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
translation:
  language: fr
  text: Je te fiancerai à moi pour toujours ; oui, je te fiancerai à moi avec justice et droit, avec amour fidèle[a] et compassion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne un amour loyal et constant, marqué aussi par la bonté et la miséricorde, notamment dans le cadre d’une alliance.
    reason: Préciser la richesse sémantique de חֶסֶד sans surcharger le texte principal.
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  choice: je ferai de toi ma fiancée
  rationale: Le verbe ארשׂ désigne précisément les fiançailles. Cette tournure française naturelle conserve l’image nuptiale et la forme féminine du suffixe hébreu.
- source_word: לִי
  choice: de toi ma fiancée
  rationale: Le pronom « à moi » est rendu idiomatiquement par le possessif « ma », qui exprime ici la relation personnelle sans alourdir la phrase.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française courante et digne qui rend la permanence de l’engagement.
- source_word: בְּצֶדֶק
  choice: dans la justice
  rationale: « Justice » rend le juste ordre moral et relationnel exprimé par צֶדֶק ; « dans » conserve la construction répétée en בְּ sans trancher excessivement entre manière, cadre et moyen.
- source_word: וּבְמִשְׁפָּט
  choice: et le droit
  rationale: « Le droit » distingue מִשְׁפָּט de צֶדֶק tout en évoquant ce qui est juste et conforme à l’ordre établi, plutôt qu’un acte de condamnation.
- source_word: וּבְחֶסֶד
  choice: dans l’amour fidèle
  rationale: « Amour fidèle » exprime à la fois l’attachement, la bonté et la loyauté relationnelle de חֶסֶד, dans un français moderne et non technique.
- source_word: וּבְרַחֲמִים
  choice: et la compassion
  rationale: Bien que le nom hébreu soit morphologiquement pluriel, il a ici une valeur abstraite ; « compassion » en restitue naturellement la tendresse miséricordieuse.
theological_decisions:
- issue: Maintien de l’image des fiançailles
  choice: je ferai de toi ma fiancée
  alternative: je t’épouserai / tu seras à moi
  rationale: L’image prophétique des fiançailles est centrale et doit rester distincte d’une simple affirmation d’appartenance ou d’une formulation générale du mariage.
- issue: Portée de la préposition בְּ dans la série des qualités
  choice: dans la justice et le droit, dans l’amour fidèle et la compassion
  alternative: par la justice et le droit / avec justice et droit
  rationale: « Dans » préserve l’ouverture sémantique de l’hébreu, qui peut évoquer le cadre, la manière ou les conditions de l’engagement, sans imposer une interprétation unique.
- issue: Sens de חֶסֶד
  choice: amour fidèle
  alternative: amour d’alliance / bonté / miséricorde
  rationale: La traduction retenue préserve la loyauté aimante du terme sans introduire explicitement « alliance », mot absent du verset, tandis qu’une note en signale la richesse sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « je ferai de toi ma fiancée » reproduit l’insistance de l’hébreu. Le point-virgule articule les deux déclarations sans ajouter le « oui » absent du texte source.
