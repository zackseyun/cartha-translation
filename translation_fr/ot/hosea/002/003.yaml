base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/003.yaml
  text: Say to your brothers[a], “My people,” and to your sisters[b], “Shown mercy.”
translation:
  language: fr
  text: 'Dites à vos frères[a] : « Mon peuple », et à vos sœurs[b] : « Celle qui a reçu compassion. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Ammi, nom symbolique qui signifie « Mon peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : Ruhama, nom symbolique qui signifie « celle qui a reçu compassion » ou « celle qui a reçu miséricorde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Dites
  rationale: Impératif masculin pluriel de אמר. « Dites » rend directement l’acte de parole et convient naturellement à l’introduction des deux appellations.
- source_word: לַאֲחֵיכֶם
  choice: à vos frères
  rationale: Le nom masculin pluriel signifie littéralement « vos frères ». Le parallèle explicite avec « vos sœurs » invite à conserver les deux groupes distincts.
- source_word: עַמִּי
  choice: Mon peuple
  rationale: Le terme signifie « mon peuple » et reprend le nom symbolique Ammi. Traduire son sens dans le texte rend perceptible le renversement prophétique, tandis qu’une note conserve la forme hébraïque.
- source_word: וְלַאֲחוֹתֵיכֶם
  choice: et à vos sœurs
  rationale: Le féminin pluriel est explicite en hébreu ; « vos sœurs » le restitue précisément et naturellement.
- source_word: רֻחָמָה
  choice: Celle à qui compassion a été faite
  rationale: Cette forme féminine passive de רחם désigne une personne qui a reçu compassion. La formulation française conserve le genre féminin ainsi que le sens passif, sans réduire le terme à la seule translittération du nom.
theological_decisions:
- issue: Faut-il translittérer les noms symboliques ou en traduire le sens dans le texte principal ?
  choice: Traduire leur sens dans le texte principal (« Mon peuple » et « Celle à qui compassion a été faite »), avec les formes Ammi et Rouhama en notes.
  alternative: Employer directement « Ammi » et « Rouhama » dans le texte principal.
  rationale: Dans le contexte d’Osée, la signification de ces noms porte l’annonce prophétique du rétablissement. La traduction sémantique permet au lecteur francophone de saisir ce renversement, tandis que les notes préservent le lien avec les noms hébreux.
- issue: 'Valeur de רֻחָמָה : miséricorde ou compassion'
  choice: Employer « compassion » tout en conservant la valeur passive du mot.
  alternative: « Celle à qui miséricorde a été faite » ou « Celle qui a obtenu miséricorde ».
  rationale: רחם exprime une compassion tendre et agissante. « Compassion » est naturel en français contemporain ; la tournure passive maintient que cette compassion est reçue plutôt que produite par la personne nommée.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle de l’hébreu est conservée. La formulation de la seconde appellation est volontairement plus développée afin de préserver à la fois le féminin singulier et la valeur passive du terme hébreu.
