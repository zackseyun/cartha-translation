  text: וְ֠/נִקְבְּצוּ בְּנֵֽי יְהוּדָ֤ה וּ/בְנֵֽי יִשְׂרָאֵל֙ יַחְדָּ֔ו וְ/שָׂמ֥וּ לָ/הֶ֛ם רֹ֥אשׁ אֶחָ֖ד וְ/עָל֣וּ מִן הָ/אָ֑רֶץ כִּ֥י גָד֖וֹל י֥וֹם יִזְרְעֶֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
translation:
  language: fr
  text: Alors les fils de Juda et les fils d’Israël seront rassemblés tous ensemble. Ils se donneront un seul chef[a] et monteront du pays[b], car grand sera le jour de Jizréel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « une seule tête », image qui désigne ici un chef commun.
    reason: lexical_alternative
  - marker: b
    text: L’expression « du pays » peut évoquer une sortie d’exil ou une montée liée au rétablissement du peuple; l’hébreu n’en précise pas ici exactement le sens.
    reason: alternative_reading
  - marker: c
    text: Jizréel est à la fois un nom de lieu et un nom chargé de sens dans Osée; il évoque notamment les thèmes de la dispersion et de l’ensemencement.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  choice: se rassembleront
  rationale: Le nifal de קבץ peut exprimer le fait d’être rassemblés ou de se réunir. La tournure pronominale française est naturelle et conserve cette latitude.
- source_word: בְּנֵי יְהוּדָה וּבְנֵי יִשְׂרָאֵל
  choice: les fils de Juda et les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque et le parallélisme entre les deux groupes réunis.
- source_word: יַחְדָּו
  choice: ensemble, rendu implicitement par « se rassembleront » et par la phrase commune
  rationale: L’idée d’unité est déjà clairement portée en français par le rassemblement des deux groupes; ajouter « ensemble » serait possible, mais légèrement redondant.
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  choice: ils se donneront un seul chef
  rationale: שׂים avec לָהֶם indique qu’ils établissent ou choisissent cette autorité pour eux-mêmes. « Chef » communique naturellement le sens métaphorique de רֹאשׁ, littéralement « tête ».
- source_word: וְעָלוּ מִן הָאָרֶץ
  choice: et monteront du pays
  rationale: La traduction conserve l’image spatiale de עלה et l’indétermination de אֶרֶץ. La formulation volontairement ouverte n’impose ni un retour d’exil précis ni une autre destination.
- source_word: כִּי גָדוֹל יוֹם יִזְרְעֶאל
  choice: car grand sera le jour de Jizréel
  rationale: L’ordre marqué conserve la solennité et l’accent de l’hébreu. Jizréel reste un nom propre tout en portant, dans Osée, des résonances liées au fait de semer et de disperser.
theological_decisions:
- issue: Identité et nature du « seul chef »
  choice: Ne pas identifier le chef et conserver seulement l’affirmation d’une direction unifiée.
  alternative: Préciser « un roi », « un chef messianique » ou « un dirigeant politique ».
  rationale: Le verset parle d’un רֹאשׁ אֶחָד sans nommer cette personne ni définir explicitement sa fonction. Une précision supplémentaire résoudrait une tension que le texte laisse ouverte.
- issue: Sens de la montée « du pays »
  choice: Conserver l’expression spatiale ouverte « monteront du pays ».
  alternative: Interpréter explicitement la phrase comme une sortie d’exil, un nouvel exode, une montée vers la terre promise ou un rassemblement militaire.
  rationale: Le contexte de restauration permet plusieurs évocations, mais le texte ne fixe pas ici le point de départ ni la destination. La traduction ne tranche donc pas.
- issue: Portée du « jour de Jizréel »
  choice: Conserver Jizréel comme nom propre et signaler ses résonances dans une note.
  alternative: Traduire directement le nom selon une étymologie comme « Dieu sème ».
  rationale: Jizréel désigne un nom chargé de sens dans Osée, mais le remplacer par une interprétation effacerait sa fonction de nom propre et réduirait son jeu polysémique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est conservé dans « car grand sera le jour ». « Chef » est plus naturel que le calque « tête » dans le corps du texte, tandis que la note préserve l’image hébraïque. La ponctuation en deux phrases évite une accumulation de coordinations sans modifier les rapports du texte.
