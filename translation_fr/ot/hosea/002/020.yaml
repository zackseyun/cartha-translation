  text: וְ/כָרַתִּ֨י לָ/הֶ֤ם בְּרִית֙ בַּ/יּ֣וֹם הַ/ה֔וּא עִם חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/עִם ע֣וֹף הַ/שָּׁמַ֔יִם וְ/רֶ֖מֶשׂ הָֽ/אֲדָמָ֑ה וְ/קֶ֨שֶׁת וְ/חֶ֤רֶב וּ/מִלְחָמָה֙ אֶשְׁבּ֣וֹר מִן הָ/אָ֔רֶץ וְ/הִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
translation:
  language: fr
  text: En ce jour-là, je conclurai pour eux une alliance avec les animaux sauvages, avec les oiseaux du ciel et avec les créatures qui rampent sur le sol. Je briserai l’arc et l’épée, et je mettrai fin à la guerre dans le pays[a] ; je les ferai reposer en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: je conclurai ... une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance », mais « conclure une alliance » en rend naturellement le sens en français tout en conservant le terme théologique alliance.
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition ל indique ici les bénéficiaires, tandis que עִם introduit les créatures avec lesquelles l’alliance est conclue. « Pour eux » préserve cette distinction syntaxique.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Cette expression désigne les animaux non domestiques vivant hors des lieux habités. La traduction est claire et actuelle.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: « Oiseaux du ciel » est une expression française naturelle qui rend עוֹף et le pluriel שָׁמַיִם sans imposer ici le sens théologique de « cieux ».
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: les bêtes qui rampent sur le sol
  rationale: La formulation exprime le mouvement associé à רֶמֶשׂ et distingue אֲדָמָה, le sol, de אֶרֶץ dans la proposition suivante.
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה
  choice: l’arc, l’épée et la guerre
  rationale: Les trois éléments restent distincts, conformément à l’accumulation poétique qui va des armes particulières à la guerre elle-même.
- source_word: אֶשְׁבּוֹר
  choice: je briserai et ferai disparaître
  rationale: Le verbe « briser » convient directement à l’arc et à l’épée, mais moins naturellement à « la guerre » en français. L’ajout coordonné « ferai disparaître » explicite la portée résultative commune sans réduire la série à une paraphrase générale.
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Dans le contexte de restauration d’Israël, « pays » exprime bien la dimension territoriale de אֶרֶץ. « De la terre » demeure possible et est signalé en note.
- source_word: וְהִשְׁכַּבְתִּים לָבֶטַח
  choice: je les ferai reposer en sécurité
  rationale: La forme causative de שׁכב est conservée par « je les ferai reposer »; ce choix rend aussi naturellement l’image pastorale de repos paisible.
theological_decisions:
- issue: Rapport entre les bénéficiaires et les partenaires de l’alliance
  choice: Dieu conclut pour le peuple une alliance avec le monde animal.
  alternative: Dieu conclut une alliance conjointement avec le peuple et les animaux.
  rationale: Le texte distingue לָהֶם, « pour eux », des occurrences de עִם, « avec », devant les groupes d’animaux. La traduction maintient cette distinction sans définir davantage la nature de cette alliance.
- issue: Étendue de אֶרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat favorise le territoire où le peuple restauré vivra en sécurité, mais le mot hébreu peut avoir une portée plus large; cette ambiguïté est conservée par une note.
- issue: Référent du pronom suffixe dans וְהִשְׁכַּבְתִּים
  choice: « les » est laissé sans explicitation, avec pour référent contextuel probable le peuple bénéficiaire.
  alternative: Expliciter « mon peuple » ou rapporter le pronom aux créatures.
  rationale: Le masculin pluriel renvoie naturellement aux bénéficiaires humains déjà évoqués par לָהֶם, mais le texte ne les renomme pas. Garder le pronom évite une précision absente de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique à la première personne et la triple énumération sont conservées. « Conclure une alliance » est idiomatique; « bêtes qui rampent » reste concret sans employer le substantif plus technique « reptiles ».
