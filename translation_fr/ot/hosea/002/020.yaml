revisions:
- from: En ce jour-là, je conclurai pour eux une alliance avec les animaux sauvages, avec les oiseaux du ciel et avec les bêtes qui rampent sur le sol. Je briserai et ferai disparaître du pays[a] l’arc, l’épée et la guerre, et je les ferai reposer en sécurité.
  to: En ce jour-là, je conclurai pour eux une alliance avec les animaux sauvages, avec les oiseaux du ciel et avec les créatures qui rampent sur le sol. Je briserai l’arc et l’épée, et je mettrai fin à la guerre dans le pays[a] ; je les ferai reposer en sécurité.
  rationale: La révision supprime le dédoublement non exprimé du verbe hébreu. « Je briserai l’arc et l’épée » rend directement שׁבר pour les armes, tandis que « je mettrai fin à la guerre » exprime en français l’effet du même verbe sur « guerre », sans prétendre ajouter une action indépendante. « Dans le pays » situe naturellement l’abolition de la guerre; la note préserve la possibilité plus large de « terre ».
  reviewer_model: gpt-5.6-terra
