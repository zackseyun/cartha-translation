id: HOS.14.7
reference: Hosea 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵֽלְכוּ֙ יֹֽנְקוֹתָ֔י/ו וִ/יהִ֥י כַ/זַּ֖יִת הוֹד֑/וֹ וְ/רֵ֥יחַֽ ל֖/וֹ כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/007.yaml
  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
translation:
  language: fr
  text: Ses jeunes pousses s’étendront[a] ; sa splendeur sera comme celle de l’olivier[b], et son parfum comme celui du Liban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ses branches se déploieront » ou « Ses tendres pousses s’étendront ». Le verbe hébreu signifie littéralement « aller » ; il évoque ici une croissance vers l’extérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa beauté » ou « sa majesté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: s’étendront
  rationale: Le verbe signifie littéralement « aller » ou « marcher », mais, avec des pousses pour sujet, il décrit naturellement leur extension. « S’étendront » restitue clairement l’image végétale.
- source_word: יֹנְקוֹתָיו
  choice: ses jeunes pousses
  rationale: Le nom désigne des pousses ou rejetons qui puisent leur nourriture dans la plante. « Jeunes pousses » est naturel en français moderne et conserve la vigueur de l’image.
- source_word: וִיהִי
  choice: sera
  rationale: La forme poursuit ici la description prophétique de la restauration. Le futur convient au contexte et évite de lui donner artificiellement une valeur de souhait.
- source_word: כַזַּיִת
  choice: comme celle de l’olivier
  rationale: Le terme désigne l’olivier. La tournure comparative avec « celle de » évite de suggérer que la splendeur est elle-même un arbre tout en conservant l’image.
- source_word: הוֹדוֹ
  choice: sa splendeur
  rationale: Le mot peut exprimer la splendeur, la majesté ou la beauté. « Splendeur » garde le registre élevé et convient à l’aspect visuel de l’olivier florissant.
- source_word: וְרֵיחַ לוֹ
  choice: et son parfum
  rationale: Littéralement, « et un parfum à lui ». Dans le contexte, le suffixe renvoie à Israël restauré sous l’image d’une plante. « Son parfum » est la formulation française naturelle et rend la nuance positive du mot.
- source_word: כַלְּבָנוֹן
  choice: comme celui du Liban
  rationale: Le Liban évoque ici l’odeur renommée de ses forêts et de sa végétation. « Celui du Liban » rend explicite en français que la comparaison porte sur le parfum.
theological_decisions:
- issue: Référent des suffixes masculins singuliers à la troisième personne
  choice: Les rendre par « ses/sa/son », en les rapportant à Israël restauré dans la métaphore végétale.
  alternative: Employer des formulations renvoyant plus mécaniquement à un individu masculin.
  rationale: Bien que les suffixes hébreux soient au masculin singulier, leur référent contextuel est le peuple restauré, décrit comme une plante florissante. Le possessif français maintient cette référence sans introduire un personnage masculin distinct.
- issue: Valeur de וִיהִי
  choice: 'Le rendre par un futur descriptif : « sera ».'
  alternative: 'Le rendre comme un souhait ou une injonction : « que sa splendeur soit ».'
  rationale: Dans la suite du passage, cette forme prolonge le tableau prophétique de la croissance et de la restauration. Le futur préserve la cohérence de la séquence sans supprimer totalement la nuance volitive que la forme peut porter.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, tandis que « celle de » et « celui du » rendent les comparaisons naturelles et non ambiguës en français.
