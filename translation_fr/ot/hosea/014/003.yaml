  text: קְח֤וּ עִמָּ/כֶם֙ דְּבָרִ֔ים וְ/שׁ֖וּבוּ אֶל יְהוָ֑ה אִמְר֣וּ אֵלָ֗י/ו כָּל תִּשָּׂ֤א עָוֺן֙ וְ/קַח ט֔וֹב וּֽ/נְשַׁלְּמָ֥ה פָרִ֖ים שְׂפָתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
translation:
  language: fr
  text: 'Prenez avec vous des paroles et revenez à Yahweh. Dites-lui : « Enlève toute faute[a] et accueille ce qui est bon, et nous t’offrirons les taureaux de nos lèvres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pardonne toute faute ». L’expression hébraïque parle littéralement du fait de porter ou d’emporter la faute.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit « les taureaux de nos lèvres » : les paroles de louange, de confession ou d’engagement sont présentées comme une offrande. D’anciens témoins et certaines interprétations comprennent plutôt « le fruit de nos lèvres ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  choice: Prenez avec vous des paroles
  rationale: 'La formulation conserve les trois éléments explicites de l’hébreu : l’impératif « prenez », l’accompagnement « avec vous » et le terme concret « paroles ». Dans le contexte, il s’agit de paroles de retour à Dieu, sans réduire d’emblée leur portée à une confession ou à une supplication.'
- source_word: וְשׁוּבוּ אֶל־יְהוָה
  choice: et revenez à Yahweh
  rationale: « Revenez » garde à la fois l’image du mouvement et son sens de repentance. Le nom divin est translittéré « Yahweh ».
- source_word: כָּל־תִּשָּׂא עָוֹן
  choice: Enlève toute faute
  rationale: L’expression נשא עון peut évoquer le fait d’emporter la faute et, par extension, de la pardonner. « Enlève toute faute » préserve cette image sans rendre l’idiome obscur.
- source_word: וְקַח־טוֹב
  choice: et accueille ce qui est bon
  rationale: La formule hébraïque, concise et discutée, dit littéralement « et prends le bon ». « Accueille ce qui est bon » convient à une prière adressée à Dieu sans préciser un objet que le texte ne nomme pas.
- source_word: וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ
  choice: Alors, nous t’offrirons les taureaux de nos lèvres
  rationale: Le verbe évoque ce que l’on acquitte ou présente, notamment dans un cadre votif ou sacrificiel. « Offrirons » rend naturellement cette nuance, tandis que « les taureaux de nos lèvres » maintient l’image saisissante du texte massorétique.
theological_decisions:
- issue: Le sens pénitentiel de שׁוב
  choice: revenez
  alternative: retournez-vous vers
  rationale: « Revenez » laisse subsister ensemble le mouvement figuré vers Dieu et l’appel à la repentance, sans réduire le verbe à un terme doctrinal abstrait.
- issue: L’idiome נשא עון
  choice: Enlève toute faute
  alternative: Pardonne toute faute
  rationale: Le choix principal conserve l’image hébraïque de la faute emportée; la note donne le sens idiomatique explicite sans imposer une seule lecture dans le corps du texte.
- issue: L’offrande des lèvres en פָרִים שְׂפָתֵינוּ
  choice: les taureaux de nos lèvres
  alternative: le fruit de nos lèvres
  rationale: Le texte massorétique porte « taureaux ». Cette leçon maintient la tension entre sacrifice animal et offrande verbale. L’alternative « fruit », connue par d’anciens témoins et par l’interprétation traditionnelle, est signalée en note.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe reste directe et accessible. Les formulations inhabituelles « accueille ce qui est bon » et « les taureaux de nos lèvres » sont volontairement conservées afin de ne pas effacer l’ellipse et la métaphore sacrificielle de l’hébreu; les notes apportent les principales clarifications.
