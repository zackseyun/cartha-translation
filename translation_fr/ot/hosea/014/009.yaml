source:
  edition: WLC
  text: אֶפְרַ֕יִם מַה לִּ֥/י ע֖וֹד לָֽ/עֲצַבִּ֑ים אֲנִ֧י עָנִ֣יתִי וַ/אֲשׁוּרֶ֗/נּוּ אֲנִי֙ כִּ/בְר֣וֹשׁ רַֽעֲנָ֔ן מִמֶּ֖/נִּי פֶּרְיְ/ךָ֥ נִמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
translation:
  language: fr
  text: Éphraïm, qu’ai-je encore à faire avec les idoles[a] ? Je lui ai répondu et je veillerai sur lui[b]. Je suis comme un cyprès verdoyant[c] ; c’est de moi que vient ton fruit[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre qu’Éphraïm prend ici la parole : « Éphraïm dit : “Qu’ai-je encore à faire avec les idoles ?” » L’hébreu n’indique pas explicitement le changement de locuteur.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je porte mon regard sur lui » ou « je prends soin de lui ».'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne un conifère dont l’espèce exacte est incertaine ; on propose aussi « sapin » ou « genévrier ».
    reason: textual_clarification
  - marker: d
    text: 'Plus littéralement : « c’est de moi que ton fruit se trouve » ; autre traduction : « ton fruit vient de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  choice: qu’ai-je encore à faire avec les idoles ?
  rationale: L’expression idiomatique מַה לִּי marque la prise de distance (« qu’ai-je à faire avec… ? »), tandis que עוֹד signifie ici « encore ». « Idoles » rend clairement עֲצַבִּים dans son emploi prophétique.
- source_word: עָנִיתִי
  choice: je lui ai répondu
  rationale: Le verbe ענה signifie ici « répondre ». Le passé composé rend naturellement l’accompli hébreu et le pronom « lui » explicite en français le destinataire implicite, Éphraïm.
- source_word: וַאֲשׁוּרֶנּוּ
  choice: et je veille sur lui
  rationale: Le verbe exprime le fait de regarder avec attention ou de porter son regard sur quelqu’un. Dans ce contexte de restauration, « veiller sur » communique cette attention bienveillante sans effacer les autres nuances, signalées en note.
- source_word: כִּבְרוֹשׁ רַעֲנָן
  choice: comme un cyprès verdoyant
  rationale: בְּרוֹשׁ désigne un conifère dont l’identification précise reste discutée ; « cyprès » est une désignation traditionnelle et compréhensible. רַעֲנָן évoque la fraîcheur, la vigueur et la verdure.
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  choice: c’est de moi que vient ton fruit
  rationale: Cette formulation française naturelle maintient l’accent de מִמֶּנִּי sur Dieu comme source du fruit d’Éphraïm. Une traduction plus formelle du niphal נִמְצָא est donnée en note.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Translittération française usuelle du nom propre, qui personnifie ici le royaume du Nord.
theological_decisions:
- issue: Identification du locuteur dans la proposition initiale
  choice: La proposition est intégrée au discours du Seigneur, qui interpelle Éphraïm.
  alternative: 'Éphraïm confesse lui-même : « Qu’ai-je encore à faire avec les idoles ? »'
  rationale: L’hébreu ne comporte aucun marqueur explicite de changement de locuteur. Les verbes à la première personne qui suivent favorisent la continuité du discours divin, mais la syntaxe permet aussi d’entendre la première question comme la confession d’Éphraïm. La note conserve cette ambiguïté réelle.
- issue: Origine du fruit d’Éphraïm
  choice: « c’est de moi que vient ton fruit » présente Dieu comme la source du fruit.
  alternative: « c’est auprès de moi que ton fruit se trouve »
  rationale: La préposition מִן indique normalement la provenance, mais le passif נִמְצָא permet une formulation plus littérale avec « se trouve ». La traduction principale conserve la provenance sans préciser davantage la nature du fruit.
translation_notes:
  register: Français international moderne, digne et accessible. La question idiomatique reste directe ; le parallélisme et les images végétales sont conservés. Les notes rendent visibles l’ambiguïté du locuteur, la nuance du regard divin, l’incertitude botanique et la formulation littérale de la dernière proposition.
