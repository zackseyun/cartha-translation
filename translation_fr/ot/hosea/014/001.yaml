source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
translation:
  language: fr
  text: Samarie portera sa culpabilité[a], parce qu’elle s’est révoltée contre son Dieu. Ses habitants tomberont par l’épée ; leurs tout-petits seront mis en pièces[b], et leurs femmes enceintes seront éventrées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera reconnue coupable » ou « subira les conséquences de sa faute ».
    reason: lexical_alternative
  - marker: b
    text: Ou « seront fracassés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  choice: portera sa culpabilité
  rationale: Le verbe אשם peut exprimer à la fois la culpabilité encourue et ses conséquences. Cette formulation conserve ces deux dimensions dans l’annonce du jugement.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de la ville, personnifiée au féminin dans ce contexte.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici clairement la cause du jugement annoncé.
- source_word: מָרְתָה
  choice: s’est révoltée
  rationale: מרה désigne la rébellion ou le refus de l’autorité, ici celle de Dieu.
- source_word: בֵּאלֹהֶיהָ
  choice: contre son Dieu
  rationale: La préposition désigne l’objet de la révolte, et le suffixe féminin singulier renvoie à Samarie personnifiée.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: tomberont par l’épée
  rationale: Cette expression conserve l’image hébraïque traditionnelle de la mort violente à la guerre sans expliciter davantage que le texte.
- source_word: עֹלְלֵיהֶם
  choice: leurs tout-petits
  rationale: עולל désigne de très jeunes enfants ; « tout-petits » est naturel en français moderne sans limiter le sens aux nouveau-nés.
- source_word: יְרֻטָּשׁוּ
  choice: seront écrasés
  rationale: Le passif décrit une mise à mort brutale. « Écrasés » restitue directement la violence, tandis que la note donne une formulation plus littérale.
- source_word: וְהָרִיּוֹתָיו
  choice: leurs femmes enceintes
  rationale: Malgré le suffixe singulier dans la forme massorétique, le contexte collectif renvoie naturellement aux habitants de Samarie.
- source_word: יְבֻקָּעוּ
  choice: auront le ventre fendu
  rationale: בקע signifie fendre ou éventrer. La formulation française rend explicitement et sans euphémisme la violence infligée aux femmes enceintes.
theological_decisions:
- issue: Personnification de Samarie et changement de référent
  choice: Conserver Samarie comme figure féminine dans la première proposition, puis préciser « ses habitants » comme sujet du pluriel.
  alternative: Maintenir partout une référence grammaticale directe à Samarie, ou supprimer la personnification.
  rationale: L’hébreu passe de Samarie personnifiée au féminin à des verbes pluriels visant sa population. « Ses habitants » explicite ce passage nécessairement en français sans modifier le sens.
- issue: Violence explicite de l’oracle de jugement
  choice: Maintenir les détails violents dans le texte principal.
  alternative: Atténuer les images par des euphémismes.
  rationale: La brutalité est intentionnelle dans l’hébreu et fait partie de la portée de l’oracle ; la traduction ne doit pas la masquer.
- issue: Portée de תֶּאְשַׁם
  choice: « portera sa culpabilité », qui associe faute et conséquence.
  alternative: « sera reconnue coupable » ou « subira le châtiment de sa faute ».
  rationale: Le verbe permet une tension entre état de culpabilité, responsabilité et conséquence judiciaire ; la formulation retenue évite de trancher inutilement.
translation_notes:
  register: Français international moderne, digne et direct. Le futur simple convient à l’annonce prophétique. « Tout-petits » reste accessible ; le vocabulaire violent est conservé sans archaïsme ni atténuation.
