    rationale: Le passif de רטש décrit le fait d’être violemment brisé ou mis en pièces. « Seront mis en pièces » restitue mieux cette image sans l’atténuer.
  - severity: low
    issue: « Auront le ventre fendu » est une formulation moins directe que le passif hébreu.
    rationale: יִבָּקֵעוּ annonce que les femmes enceintes seront fendues/ouvertes. « Seront éventrées » est idiomatique en français et conserve le caractère explicite, passif et violent du texte.
