source:
  edition: WLC
  text: שׁ֚וּבָ/ה יִשְׂרָאֵ֔ל עַ֖ד יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּ֥י כָשַׁ֖לְתָּ בַּ/עֲוֺנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
translation:
  language: fr
  text: Reviens, Israël, à Yahweh, ton Dieu, car tu as trébuché à cause de ta faute[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as trébuché dans ta faute ». La préposition hébraïque peut indiquer la cause du faux pas ou la sphère dans laquelle Israël a trébuché.
    reason: alternative_lexicale
lexical_decisions:
- source_word: שׁוּבָה
  choice: Reviens
  rationale: L’impératif de שׁוב exprime fondamentalement le retour ou le fait de se détourner d’une voie pour revenir. « Reviens » conserve ici le mouvement relationnel vers Dieu sans le réduire au terme plus interprétatif « repens-toi ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre rendu selon sa forme française usuelle.
- source_word: עַד
  choice: à
  rationale: Avec un verbe de retour, עַד indique le but du mouvement. « Revenir à » est la tournure naturelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », conformément à la politique du projet.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'Le nom avec suffixe masculin singulier exprime directement la relation d’alliance : Yahweh est le Dieu d’Israël.'
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel au retour. « Car » convient au registre prophétique tout en restant courant.
- source_word: כָשַׁלְתָּ
  choice: tu as trébuché
  rationale: כשל évoque le fait de trébucher ou de chanceler. Cette traduction maintient la métaphore sans préciser indûment une chute définitive.
- source_word: בַּעֲוֺנֶךָ
  choice: à cause de ta faute
  rationale: La préposition ב peut ici exprimer la cause de la chute, tandis que עָוֹן désigne la faute, l’iniquité ou la culpabilité. La formulation retenue est naturelle en français; l’autre possibilité, celle de la faute comme sphère où Israël trébuche, est conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de שׁוב dans l’appel prophétique
  choice: Reviens
  alternative: Repens-toi; retourne
  rationale: Le verbe implique la repentance dans ce contexte, mais son image première est celle d’un retour vers Dieu. « Reviens » préserve à la fois cette image et sa portée relationnelle.
- issue: Valeur de la préposition ב dans בַּעֲוֺנֶךָ
  choice: 'Cause : « à cause de ta faute »'
  alternative: 'Sphère : « dans ta faute »'
  rationale: Les deux analyses sont possibles. Le texte principal adopte la formulation causale, plus naturelle en français, sans exclure l’interprétation locative, signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. L’impératif « Reviens » garde la force directe de l’appel prophétique; le tutoiement singulier correspond à Israël interpellé comme une personne collective.
