id: HOS.14.6
reference: Hosea 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶהְיֶ֤ה כַ/טַּל֙ לְ/יִשְׂרָאֵ֔ל יִפְרַ֖ח כַּ/שּֽׁוֹשַׁנָּ֑ה וְ/יַ֥ךְ שָׁרָשָׁ֖י/ו כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
translation:
  language: fr
  text: Je serai comme la rosée pour Israël[a] ; il fleurira comme le lis et enfoncera ses racines comme le Liban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu présente Israël comme une entité collective au masculin singulier ; de là viennent « il » et « ses » dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: Le Liban évoque la solidité et la grandeur, probablement par ses arbres renommés aux racines profondes ; l’hébreu ne dit pas explicitement « les cèdres ».
    reason: cultural_note
lexical_decisions:
- source_word: אֶהְיֶה
  choice: Je serai
  rationale: L’imparfait hébreu qal à la première personne du singulier a ici une valeur future naturelle dans ce contexte de promesse divine.
- source_word: כַטַּל
  choice: comme la rosée
  rationale: La préposition כ marque la comparaison, et « rosée » conserve l’image agricole d’une humidité qui donne la vie.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: La préposition ל peut exprimer la destination ou le bénéfice ; « pour Israël » est naturel en français et souligne ici l’action bienfaisante.
- source_word: יִפְרַח
  choice: il fleurira
  rationale: Le verbe masculin singulier présente Israël comme une entité collective singulière. « Fleurira » correspond précisément à l’image florale qui suit.
- source_word: כַשּׁוֹשַׁנָּה
  choice: comme le lis
  rationale: שׁוֹשַׁנָּה désigne conventionnellement le lis, ou une fleur apparentée ; l’article hébreu est rendu par « le ».
- source_word: וְיַךְ שָׁרָשָׁיו
  choice: et enfoncera ses racines
  rationale: Le hiphil de נכה, avec « ses racines », évoque le fait de les faire pénétrer et s’établir fermement. Cette formulation française conserve la valeur causative et le suffixe masculin singulier sans calque maladroit.
- source_word: כַלְּבָנוֹן
  choice: comme le Liban
  rationale: Le texte nomme le Liban lui-même sans mentionner explicitement les cèdres ; la traduction préserve cette image ouverte.
theological_decisions:
- issue: Référent et genre des verbes et du pronom singuliers appliqués à Israël
  choice: 'Conserver Israël comme collectif masculin singulier : « il fleurira… ses racines ».'
  alternative: Employer un pluriel de sens (« ils fleuriront… leurs racines ») ou reformuler sans pronom.
  rationale: L’hébreu emploie des formes masculines singulières et personnifie Israël comme une seule entité ; la traduction maintient cette représentation sans la neutraliser.
- issue: Portée de l’image du Liban
  choice: Traduire simplement « comme le Liban ».
  alternative: Expliciter « comme les cèdres du Liban ».
  rationale: Les arbres réputés du Liban éclairent probablement l’image de stabilité et de grandeur, mais le texte hébreu ne précise pas « cèdres ».
translation_notes:
  register: Français international moderne, poétique et digne. « Enfoncera ses racines » reste naturel tout en conservant la force causative de l’expression hébraïque et son suffixe possessif.
