id: HOS.14.4
reference: Hosea 14:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַשּׁ֣וּר לֹ֣א יוֹשִׁיעֵ֗/נוּ עַל סוּס֙ לֹ֣א נִרְכָּ֔ב וְ/לֹא נֹ֥אמַר ע֛וֹד אֱלֹהֵ֖י/נוּ לְ/מַעֲשֵׂ֣ה יָדֵ֑י/נוּ אֲשֶׁר בְּ/ךָ֖ יְרֻחַ֥ם יָתֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
translation:
  language: fr
  text: 'L’Assyrie ne nous sauvera pas ; nous ne monterons pas sur des chevaux et nous ne dirons plus : « Notre Dieu ! » à l’œuvre de nos mains. Auprès de toi, l’orphelin[a] trouve compassion[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne littéralement une personne privée de père et peut, plus largement, évoquer celui qui est sans protection.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire le lien avec ce qui précède : « Car auprès de toi, l’orphelin trouve compassion. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Nom français usuel de la puissance impériale dont Israël renonce à attendre le salut.
- source_word: יוֹשִׁיעֵנוּ
  choice: ne nous sauvera pas
  rationale: Le hifil de ישׁע signifie « sauver, délivrer » ; « sauver » conserve ici la portée politique et théologique du terme.
- source_word: עַל סוּס לֹא נִרְכָּב
  choice: nous ne monterons pas sur des chevaux
  rationale: Formulation française naturelle qui garde l’image concrète des chevaux et, sans l’expliciter, son évocation de la puissance militaire.
- source_word: וְלֹא נֹאמַר עוֹד
  choice: et nous ne dirons plus
  rationale: עוֹד avec la négation exprime la cessation définitive de cette pratique.
- source_word: אֱלֹהֵינוּ
  choice: « Notre Dieu ! »
  rationale: Dans cette adresse idolâtre, אֱלֹהֵינוּ fonctionne comme un titre au singulier ; l’exclamation rend naturel le fait de donner ce nom à un objet fabriqué.
- source_word: לְמַעֲשֵׂה יָדֵינוּ
  choice: à l’œuvre de nos mains
  rationale: Expression proche de l’hébreu, intelligible en français et évocatrice des idoles fabriquées sans les nommer explicitement.
- source_word: אֲשֶׁר בְּךָ
  choice: Auprès de toi
  rationale: בְּךָ indique que Dieu est celui auprès de qui la compassion est reçue. L’absence de connecteur explicite dans le texte principal préserve la souplesse du lien introduit par אֲשֶׁר.
- source_word: יְרֻחַם
  choice: trouve compassion
  rationale: Le poual de רחם exprime le fait d’être pris en compassion ; cette tournure française conserve le sens réceptif tout en restant fluide.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Terme français courant pour une personne privée de protection parentale, notamment paternelle dans le contexte ancien, sans imposer une application exclusivement littérale ou métaphorique.
theological_decisions:
- issue: Lien logique de la dernière proposition
  choice: 'Proposition autonome : « Auprès de toi, l’orphelin trouve compassion. »'
  alternative: « Car auprès de toi, l’orphelin trouve compassion. »
  rationale: אֲשֶׁר peut introduire une explication ou un motif. Une phrase autonome laisse perceptible ce rapport sans le rendre explicitement causal.
- issue: Référent de יָתוֹם
  choice: Conserver le terme concret « l’orphelin »
  alternative: Expliciter une référence métaphorique à Israël sans protection
  rationale: Le texte peut évoquer à la fois les personnes réellement vulnérables et la condition d’Israël, mais il ne tranche pas explicitement entre ces dimensions.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure confessionnelle est maintenue, ainsi que les images de la dépendance politique, militaire et idolâtre. La ponctuation clarifie l’adresse « Notre Dieu ! » sans ajouter le mot « idole », absent de l’hébreu.
