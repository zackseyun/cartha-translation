  source_fidelity: 'Le texte rend fidèlement les trois renoncements exprimés par les imparfaits hébreux : l’Assyrie comme secours, les chevaux comme appui, et l’attribution du titre divin à une œuvre humaine. « Auprès de toi » transmet de façon idiomatique בְּךָ sans imposer le lien causal possible de la relative. « L’orphelin trouve compassion » rend convenablement le poual יְרֻחַם et conserve l’ouverture du terme יָתוֹם.'
  naturalness: Le français est moderne, sobre et fluide. « Monter sur des chevaux » est une formulation recevable dans ce contexte poétique et maintient l’image concrète du texte. La ponctuation de la parole rapportée permet de comprendre que « Notre Dieu ! » est ce qui ne sera plus dit à l’œuvre des mains humaines.
  terminology: '« L’Assyrie », « sauver », « l’œuvre de nos mains » et « l’orphelin » sont des choix justes et accessibles. Le singulier « Notre Dieu ! » respecte l’usage contextuel de אֱלֹהֵינוּ comme appellation d’une idole, sans explicitation doctrinale. Les notes sont correctement ancrées : a éclaire יָתוֹם et b signale sobrement la possibilité causale.'
