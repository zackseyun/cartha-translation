base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
translation:
  language: fr
  text: Ceux qui habitent à son ombre reviendront ; ils reprendront vie comme le blé[a] et fleuriront comme la vigne. Sa renommée[b] sera comme le vin du Liban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils feront revivre le grain » ou « ils raviveront le grain ». L’hébreu est condensé ; « comme le blé » explicite une comparaison suggérée par le parallélisme avec « comme la vigne ». On peut aussi comprendre : « ils produiront de nouveau du grain ».'
    reason: lexical_alternative
  - marker: b
    text: « Sa renommée » peut aussi se traduire par « son souvenir » ou « sa mémoire ». Le suffixe est au singulier ; son référent n’est pas explicitement identifié dans cette expression.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  choice: reviendront
  rationale: Le qal inaccompli de שוב signifie normalement « revenir » ou « retourner ». Ici, il exprime naturellement le rétablissement de ceux qui vivent sous sa protection, sans préciser davantage la nature de ce retour.
- source_word: יֹשְׁבֵי בְצִלּוֹ
  choice: Ceux qui habitent à son ombre
  rationale: Le participe substantivé désigne « ceux qui habitent ». L’image de l’ombre évoque protection et bienfait ; « à son ombre » est une formulation française naturelle qui conserve la métaphore.
- source_word: יְחַיּוּ דָגָן
  choice: ils reprendront vie comme le blé
  rationale: Le piel de חיה porte l’idée de faire vivre ou de ranimer. La construction avec דָגָן est condensée et poétique ; le parallélisme agricole avec la vigne permet d’expliciter la comparaison avec le blé qui reprend vie, tout en signalant les autres analyses en note.
- source_word: וְיִפְרְחוּ כַגָּפֶן
  choice: et fleuriront comme la vigne
  rationale: פרח exprime l’éclosion ou l’épanouissement, et כַגָּפֶן introduit explicitement la comparaison. La traduction conserve l’image agricole et son parallélisme.
- source_word: זִכְרוֹ
  choice: Sa renommée
  rationale: זֵכֶר peut désigner le souvenir, la mémoire ou la renommée. La comparaison avec le vin réputé du Liban favorise ici « renommée », sans supprimer l’autre sens possible.
- source_word: כְּיֵין לְבָנוֹן
  choice: comme le vin du Liban
  rationale: La traduction directe conserve la comparaison et l’association régionale avec un vin apprécié.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « son ombre » et « sa renommée »
  choice: Conserver les possessifs au singulier sans identifier explicitement leur référent.
  alternative: Expliciter « l’ombre d’Israël » et « la renommée d’Israël », ou employer un pluriel collectif.
  rationale: L’hébreu emploie des suffixes masculins singuliers dans un contexte où Israël est personnifié. La formulation française maintient cette donnée grammaticale et l’ouverture poétique du texte.
- issue: Rapport entre יְחַיּוּ et דָגָן
  choice: Rendre l’image par « ils reprendront vie comme le blé ».
  alternative: « Ils feront revivre le blé », « ils produiront de nouveau du blé » ou « ils seront ranimés par le blé ».
  rationale: La phrase hébraïque est très condensée. Le parallélisme avec « fleuriront comme la vigne » soutient une image de vitalité renouvelée, mais la note conserve les autres lectures possibles sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le rythme en deux phrases préserve la progression entre retour, renouveau agricole et renommée. « Blé » est retenu plutôt que « froment », jugé plus vieilli, ou « céréales », moins naturel dans cette comparaison.
