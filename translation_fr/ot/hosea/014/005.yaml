id: HOS.14.5
reference: Hosea 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶרְפָּא֙ מְשׁ֣וּבָתָ֔/ם אֹהֲבֵ֖/ם נְדָבָ֑ה כִּ֛י שָׁ֥ב אַפִּ֖/י מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
translation:
  language: fr
  text: Je guérirai leur infidélité ; je les aimerai de bon gré, car ma colère s’est détournée de lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici le singulier « de lui » ; certaines traductions harmonisent avec les formes plurielles précédentes et rendent « d’eux ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְפָּא
  choice: Je guérirai
  rationale: Le verbe רפא signifie couramment « guérir ». Ce choix conserve la métaphore d’une restauration morale et spirituelle.
- source_word: מְשׁוּבָתָם
  choice: leur infidélité
  rationale: מְשׁוּבָה désigne le fait de se détourner ou d’abandonner l’alliance. « Infidélité » exprime naturellement en français ce contexte relationnel et collectif, sans réduire le terme à un simple écart passager.
- source_word: אֹהֲבֵם
  choice: je les aimerai
  rationale: אהב signifie directement « aimer » et le suffixe masculin pluriel exige ici « les ».
- source_word: נְדָבָה
  choice: de bon gré
  rationale: נְדָבָה évoque ce qui est volontaire, spontané ou librement offert. « De bon gré » conserve cette idée d’un amour accordé librement.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici le motif de la promesse précédente ; « car » rend clairement ce rapport logique.
- source_word: שָׁב
  choice: s’est détournée
  rationale: Dans ce contexte, שׁוב exprime le retrait de la colère divine. Cette formulation française conserve l’image du mouvement tout en restant naturelle.
- source_word: אַפִּי
  choice: ma colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: La forme hébraïque porte un suffixe masculin singulier. Le singulier est donc conservé malgré les référents pluriels des propositions précédentes.
theological_decisions:
- issue: Changement de nombre dans le dernier pronom
  choice: 'Conserver le singulier hébreu : « de lui »'
  alternative: « d’eux »
  rationale: Le texte hébreu passe des objets pluriels (« leur », « les ») au suffixe singulier מִמֶּנּוּ. La traduction maintient cette tension grammaticale au lieu de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Infidélité » garde la portée relationnelle et alliancielle du terme hébreu ; « de bon gré » rend le caractère volontaire de l’amour promis. Le singulier final, inattendu en français comme en hébreu, est volontairement préservé et expliqué en note.
