source:
  edition: WLC
  text: מִ֤י חָכָם֙ וְ/יָ֣בֵֽן אֵ֔לֶּה נָב֖וֹן וְ/יֵֽדָעֵ֑/ם כִּֽי יְשָׁרִ֞ים דַּרְכֵ֣י יְהוָ֗ה וְ/צַדִּקִים֙ יֵ֣לְכוּ בָ֔/ם וּ/פֹשְׁעִ֖ים יִכָּ֥שְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
translation:
  language: fr
  text: 'Qui est sage ? Qu’il comprenne ces choses. Qui a du discernement ? Qu’il les connaisse. Car les chemins de Yahweh sont droits[a] : les justes y marchent, mais les rebelles[b] y trébuchent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « justes » ou « rectilignes ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « transgresseurs » : ceux qui se révoltent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Qui est sage ?
  rationale: La tournure interrogative et rhétorique de l’hébreu est conservée, sans transformer la question en proposition indéfinie.
- source_word: וְיָבֵן אֵלֶּה
  choice: Qu’il comprenne ces choses
  rationale: L’imparfait peut avoir ici une valeur d’exhortation dans ce contexte sapientiel. « Ces choses » renvoie à l’ensemble du message qui précède.
- source_word: נָבוֹן
  choice: Qui a du discernement ?
  rationale: Cette formulation française naturelle distingue le nom de qualité du verbe « comprendre » employé juste avant.
- source_word: וְיֵדָעֵם
  choice: Qu’il les connaisse
  rationale: Le suffixe masculin pluriel renvoie aux réalités évoquées par « ces choses ». « Connaisse » conserve la portée large de ידע sans la réduire à « reconnaisse » ou « admette ».
- source_word: יְשָׁרִים
  choice: droits
  rationale: « Droits » exprime la rectitude morale tout en maintenant l’image des chemins sur lesquels on marche ou trébuche.
- source_word: דַּרְכֵי יְהוָה
  choice: les chemins de Yahweh
  rationale: « Chemins » rend naturellement l’image directrice du verset; le nom divin est transcrit « Yahweh ».
- source_word: וְצַדִּקִים
  choice: les justes
  rationale: Le substantif français désigne avec concision ceux dont la conduite est juste.
- source_word: יֵלְכוּ בָם
  choice: y marchent
  rationale: Le pronom adverbial « y » renvoie clairement aux chemins et préserve la métaphore de la marche.
- source_word: וּפֹשְׁעִים
  choice: les rebelles
  rationale: Le terme désigne ceux qui rompent délibérément avec l’autorité ou l’alliance; « rebelles » est courant et restitue cette dimension volontaire.
- source_word: יִכָּשְׁלוּ בָם
  choice: y trébuchent
  rationale: La traduction conserve le contraste imagé entre marcher sur les chemins de Yahweh et y trébucher.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Yahvé
  rationale: Le texte hébreu porte le tétragramme comme nom propre. « Yahweh » le rend directement plutôt que de lui substituer un titre.
- issue: Valeur des imparfaits וְיָבֵן et וְיֵדָעֵם
  choice: 'Exhortation : « Qu’il comprenne… Qu’il les connaisse »'
  alternative: 'Conséquence ou caractérisation : « et il comprendra… et il les connaîtra »'
  rationale: Dans cette conclusion sapientielle, la valeur exhortative s’accorde naturellement aux questions rhétoriques. La forme hébraïque permet toutefois de percevoir aussi une nuance de conséquence, qui n’est pas développée dogmatiquement.
- issue: Image morale des chemins droits
  choice: « les chemins de Yahweh sont droits »
  alternative: « les chemins de Yahweh sont justes » ou « rectilignes »
  rationale: « Droits » maintient ensemble la rectitude morale et l’image concrète du chemin, essentielle au contraste entre marcher et trébucher.
translation_notes:
  register: Français international moderne, clair et digne. Les questions brèves conservent le ton sapientiel de la conclusion. Le masculin singulier de l’hébreu reste générique dans « Qui est sage ? », tandis que les pluriels « les justes » et « les rebelles » suivent le texte source.
