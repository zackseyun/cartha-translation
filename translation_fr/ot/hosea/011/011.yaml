  text: יֶחֶרְד֤וּ כְ/צִפּוֹר֙ מִ/מִּצְרַ֔יִם וּ/כְ/יוֹנָ֖ה מֵ/אֶ֣רֶץ אַשּׁ֑וּר וְ/הוֹשַׁבְתִּ֥י/ם עַל בָּתֵּי/הֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
translation:
  language: fr
  text: Ils viendront en tremblant, comme un oiseau d’Égypte[a] et comme une colombe du pays d’Assyrie. Je les installerai dans leurs maisons — oracle de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils trembleront comme un oiseau venant d’Égypte… et comme une colombe venant du pays d’Assyrie. » Le verbe hébreu peut mettre l’accent sur le tremblement lui-même ; dans ce contexte, il semble aussi impliquer qu’ils viennent en tremblant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֶרְדוּ
  choice: Ils viendront en tremblant
  rationale: Le verbe חרד exprime le tremblement ou un mouvement anxieux. Dans le contexte du retour depuis l’Égypte et l’Assyrie, cette formulation rend à la fois le mouvement implicite vers Yahweh et le tremblement explicite, tout en signalant l’autre lecture en note.
- source_word: כְצִפּוֹר
  choice: comme un oiseau
  rationale: צִפּוֹר est ici un terme générique désignant un oiseau, souvent petit, sans permettre d’identifier sûrement une espèce précise.
- source_word: מִמִּצְרַיִם
  choice: depuis l’Égypte
  rationale: La préposition מן indique le point de départ; « depuis » s’accorde naturellement avec l’idée de venue exprimée dans la proposition.
- source_word: וּכְיוֹנָה
  choice: et comme une colombe
  rationale: יוֹנָה désigne couramment la colombe ou le pigeon; « colombe » est le terme biblique usuel et convient à l’image.
- source_word: מֵאֶרֶץ אַשּׁוּר
  choice: depuis le pays d’Assyrie
  rationale: La traduction conserve explicitement אֶרֶץ, « pays », ainsi que l’idée de provenance.
- source_word: וְהוֹשַׁבְתִּים
  choice: Je les établirai
  rationale: 'Le hiphil de ישב est causatif: faire habiter, installer. « Établir » exprime de manière naturelle une installation durable sans ajouter explicitement l’idée de retour.'
- source_word: עַל בָּתֵּיהֶם
  choice: dans leurs maisons
  rationale: Avec le verbe d’installation, עַל peut décrire le lieu où les personnes sont rétablies. Le français idiomatique exige ici « dans », tandis que « maisons » conserve le sens concret de בָּתִּים.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם introduit une formule prophétique solennelle, et le nom divin יְהוָה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le caractère de nom propre sans le remplacer par un titre.
- issue: Nuance de restauration dans וְהוֹשַׁבְתִּים עַל בָּתֵּיהֶם
  choice: Je les établirai dans leurs maisons
  alternative: Je les ramènerai dans leurs maisons
  rationale: La forme causative exprime l’installation ou l’habitation assurée. Le contexte évoque bien un retour, mais le verbe lui-même ne dit pas explicitement « ramener »; la traduction évite donc d’inscrire cette précision contextuelle dans le texte.
- issue: Mouvement implicite dans יֶחֶרְדוּ
  choice: Ils viendront en tremblant
  alternative: Ils trembleront
  rationale: Les compléments de provenance et le contexte immédiat soutiennent l’idée d’une approche tremblante, mais le sens lexical direct reste « trembler »; cette ambiguïté est préservée par une note.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation sépare clairement la promesse finale de la comparaison précédente. « Déclaration de Yahweh » garde la solennité et la forme nominale de la formule prophétique.
