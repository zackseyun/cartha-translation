source:
  edition: WLC
  text: אַחֲרֵ֧י יְהוָ֛ה יֵלְכ֖וּ כְּ/אַרְיֵ֣ה יִשְׁאָ֑ג כִּֽי ה֣וּא יִשְׁאַ֔ג וְ/יֶחֶרְד֥וּ בָנִ֖ים מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
translation:
  language: fr
  text: Ils marcheront à la suite de Yahvé ; il rugira comme un lion. Car lui-même rugira, et des fils[a] viendront en tremblant de l’ouest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des enfants » ; le mot hébreu est littéralement au masculin pluriel : « des fils ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la mer » ; ici, « la mer » désigne probablement l’ouest comme direction géographique.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה יֵלְכוּ
  choice: Ils marcheront à la suite de Yahvé
  rationale: « À la suite de » rend l’emploi idiomatique de אַחֲרֵי avec le verbe « marcher » sans réduire l’image concrète à un simple « ils obéiront ». « Yahvé » transcrit en français moderne le nom divin.
- source_word: כְּאַרְיֵה יִשְׁאָג
  choice: il rugira comme un lion
  rationale: Le verbe שׁאג désigne typiquement le rugissement du lion ; la comparaison est conservée directement.
- source_word: כִּי הוּא יִשְׁאַג
  choice: Car lui-même rugira
  rationale: « Car » donne à כִּי sa valeur explicative, tandis que « lui-même » fait entendre l’insistance portée par le pronom explicite הוּא. La répétition de « rugira » préserve l’effet rhétorique de l’hébreu.
- source_word: וְיֶחֶרְדוּ
  choice: viendront en tremblant
  rationale: חרד exprime le tremblement causé par la crainte ou la saisie. Dans ce contexte de rassemblement, « viendront en tremblant » exprime le mouvement implicite sans ajouter une destination absente de l’hébreu.
- source_word: בָנִים
  choice: des fils
  rationale: Le nom hébreu est un masculin pluriel signifiant littéralement « fils ». Cette forme est maintenue dans le texte, avec l’éventuel sens collectif signalé en note.
- source_word: מִיָּם
  choice: de l’ouest
  rationale: Littéralement « de la mer », expression qui, depuis le territoire d’Israël, sert couramment à désigner l’ouest. La direction géographique probable est donnée dans le texte et la formulation littérale en note.
theological_decisions:
- issue: Le tremblement comme réponse au rugissement divin
  choice: Le peuple est présenté comme revenant en tremblant en réponse à l’appel de Yahvé.
  alternative: Le verbe pourrait être rendu plus minimalement par « trembleront », sans expliciter le mouvement de retour.
  rationale: Le contexte de restauration en Osée 11.8-11 et la provenance indiquée par מִיָּם favorisent un mouvement vers Yahvé. La traduction n’ajoute cependant ni « vers lui » ni une destination non exprimée.
- issue: L’insistance du pronom הוּא
  choice: « lui-même »
  alternative: « il rugira »
  rationale: Le pronom sujet explicite, non indispensable grammaticalement en hébreu, peut porter une insistance. La traduction la conserve sans en tirer une conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la marche « à la suite de » Yahvé, le double rugissement et le tremblement, tout en rendant naturellement l’idiome géographique hébreu.
