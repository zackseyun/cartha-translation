base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
translation:
  language: fr
  text: Pourtant, c’est moi qui ai appris à Éphraïm à marcher, les prenant dans mes bras[a] ; mais ils n’ont pas reconnu que je les ai guéris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu litt. : « il les a pris sur ses bras ». Le texte massorétique présente ici une forme et un suffixe difficiles à la troisième personne. Beaucoup comprennent néanmoins que le Seigneur continue de parler à la première personne : « je les ai pris dans mes bras ».'
    reason: textual_variant
lexical_decisions:
- source_word: תִרְגַּלְתִּי
  choice: ai appris … à marcher
  rationale: Dans cette forme, le verbe évoque concrètement le fait d’apprendre à un enfant à marcher. Cette tournure française conserve l’image parentale.
- source_word: לְאֶפְרַיִם
  choice: à Éphraïm
  rationale: La préposition ל est intégrée naturellement à la construction française « apprendre à quelqu’un à marcher ».
- source_word: קָחָם
  choice: les prenant
  rationale: La forme massorétique est difficile et paraît introduire une troisième personne au milieu d’un discours divin à la première personne. Le participe présent maintient la continuité de la scène sans dissimuler la difficulté, signalée en note.
- source_word: עַל זְרוֹעֹתָיו
  choice: dans mes bras
  rationale: « Dans les bras » est l’expression idiomatique française pour porter un enfant. La première personne suit le locuteur divin et le contexte immédiat, tandis que le suffixe massorétique de troisième personne est documenté en note.
- source_word: וְלֹא יָדְעוּ
  choice: mais ils n’ont pas reconnu
  rationale: Le français « mais » rend la valeur adversative du ו dans le contexte. « Reconnaître » exprime ici non une simple ignorance factuelle, mais l’incapacité d’identifier Dieu comme l’auteur de leur guérison.
- source_word: רְפָאתִים
  choice: je les guérissais
  rationale: « Guérir » conserve la métaphore concrète de רפא. L’imparfait français présente cette action comme le soin divin qui accompagnait leur histoire.
theological_decisions:
- issue: Image parentale anthropomorphique appliquée à Dieu
  choice: Conserver l’image de Dieu apprenant à Éphraïm à marcher et le prenant dans ses bras.
  alternative: Réduire l’image à une affirmation générale de protection ou de conduite.
  rationale: Le texte hébreu décrit des soins parentaux intimes ; les généraliser affaiblirait cette image théologique.
- issue: Passage difficile de la première à la troisième personne dans le texte massorétique
  choice: Maintenir dans le texte courant la première personne exigée par le discours, tout en signalant la forme massorétique en note.
  alternative: Traduire littéralement « il les prenait dans ses bras » ou modifier sans note le texte en une première personne explicite.
  rationale: Le contexte est un discours de Dieu à la première personne, mais les formes de troisième personne du texte massorétique constituent une difficulté réelle qui ne doit pas être cachée.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le passage d’« Éphraïm », nom collectif singulier, au pronom pluriel « ils/les », présent dans l’hébreu. Le point-virgule met en relief le contraste entre les soins divins et l’absence de reconnaissance.
