  text: אֵ֞יךְ אֶתֶּנְ/ךָ֣ אֶפְרַ֗יִם אֲמַגֶּנְ/ךָ֙ יִשְׂרָאֵ֔ל אֵ֚יךְ אֶתֶּנְ/ךָ֣ כְ/אַדְמָ֔ה אֲשִֽׂימְ/ךָ֖ כִּ/צְבֹאיִ֑ם נֶהְפַּ֤ךְ עָלַ/י֙ לִבִּ֔/י יַ֖חַד נִכְמְר֥וּ נִחוּמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
translation:
  language: fr
  text: Comment pourrais-je t’abandonner, Éphraïm ? Comment pourrais-je te livrer, Israël ? Comment pourrais-je te traiter comme Adma[a] ? Comment pourrais-je te rendre semblable à Tseboïm ? Mon cœur se retourne en moi[b] ; toutes mes compassions s’embrasent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adma et Tseboïm étaient des villes associées au même renversement que Sodome et Gomorrhe ; la comparaison évoque une destruction totale (voir Deutéronome 29.22).
    reason: cross_reference
  - marker: b
    text: 'Ou : « Mon cœur change au-dedans de moi. » Plus littéralement, l’hébreu présente le cœur de Dieu comme « retourné », image d’un profond bouleversement intérieur.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « toutes mes compassions sont profondément émues » ; littéralement, elles « s’échauffent » ou « s’embrasent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment pourrais-je
  rationale: Dans ces questions répétées, l’interrogatif exprime la stupeur et la profonde réticence plutôt qu’une simple demande sur la manière d’agir. Le conditionnel rend naturellement cette nuance en français.
- source_word: אֶתֶּנְךָ
  choice: t’abandonner
  rationale: Le verbe signifie littéralement « donner », mais le contexte judiciaire appelle l’idée de livrer quelqu’un à son sort. « Abandonner » conserve ici la force affective du propos.
- source_word: אֲמַגֶּנְךָ
  choice: te livrer
  rationale: La forme intensive de מגן désigne ici l’action de livrer ou de remettre. « Te livrer » est clair et maintient la variation du parallélisme avec « t’abandonner ».
- source_word: כְאַדְמָה
  choice: comme Adma
  rationale: Le nom de la ville est conservé, car l’hébreu évoque directement son anéantissement et ne le remplace pas par une explication.
- source_word: אֲשִׂימְךָ
  choice: te traiter
  rationale: שים signifie fondamentalement « placer, mettre ». Dans cette comparaison avec une ville vouée à la destruction, « te traiter comme » exprime naturellement en français l’action envisagée, sans masquer l’allusion judiciaire.
- source_word: כִּצְבֹאיִם
  choice: une autre Tseboïm
  rationale: Cette formulation idiomatique traduit l’idée de faire d’Israël l’équivalent de Tseboïm dans son sort, tout en conservant le nom propre.
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  choice: Mon cœur se retourne en moi
  rationale: La traduction garde l’image viscérale du cœur bouleversé ou retourné. Elle évite de réduire l’expression à la seule idée abstraite d’un changement d’avis.
- source_word: יַחַד
  choice: toutes
  rationale: Bien que l’adverbe signifie littéralement « ensemble », il présente ici les compassions comme une totalité ; « toutes » rend cette portée collective en français naturel.
- source_word: נִכְמְרוּ
  choice: s’embrasent
  rationale: Le verbe peut évoquer l’échauffement, l’embrasement ou un profond mouvement intérieur. « S’embrasent » conserve cette image intense, avec une note signalant une traduction moins imagée possible.
- source_word: נִחוּמָי
  choice: mes compassions
  rationale: Dans ce contexte, le nom pluriel désigne les mouvements de pitié et de tendresse miséricordieuse. Le pluriel français, légèrement marqué mais intelligible, reflète celui de l’hébreu.
theological_decisions:
- issue: Langage anthropopathique décrivant le mouvement intérieur de Dieu
  choice: Conserver les images du cœur qui se retourne et des compassions qui s’embrasent
  alternative: 'Abstraire le propos en disant : « J’ai changé d’avis »'
  rationale: Le texte hébreu présente délibérément la compassion divine dans un langage viscéral et relationnel. La traduction doit préserver cette tension sans la résoudre par une formulation doctrinale plus abstraite.
- issue: Référence à Adma et Tseboïm
  choice: Conserver les noms des villes dans le texte principal
  alternative: Les remplacer par une expression interprétative telle que « les villes que j’ai détruites »
  rationale: Les noms propres portent l’allusion historique et littéraire au jugement total. Une note peut l’expliquer sans substituer une interprétation aux mots du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les quatre questions parallèles sont maintenues pour préserver le rythme et la force affective. Les noms sont transcrits selon des formes françaises usuelles (« Éphraïm », « Adma », « Tseboïm »). Les métaphores corporelles et affectives de l’hébreu restent visibles, tandis que les notes donnent les principales possibilités lexicales sans trancher une ambiguïté réelle.
