  yaml_path: translation/ot/hosea/011/006.yaml
  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
translation:
  language: fr
  text: L’épée fera rage dans ses villes[a], détruira ses barres[b] et dévorera à cause de leurs projets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « tournoiera dans ses villes » ou « s’abattra sur ses villes ». Le verbe hébreu est difficile et peut évoquer un mouvement tournoyant, une chute ou une action violente.'
    reason: lexical_alternative
  - marker: b
    text: Ou « les barres de ses portes ». Certains comprennent « ses dirigeants », mais le contexte d’une attaque contre des villes favorise l’image de barres défensives.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָלָה
  choice: fera rage
  rationale: Le verbe est difficile. Dans ce contexte de guerre, « fera rage » exprime naturellement en français le mouvement violent et destructeur de l’épée, sans réduire l’image à une simple chute.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Le nom concret au singulier est conservé; en français, l’article défini convient à l’emploi collectif et personnifié de l’épée comme image de la guerre.
- source_word: בְּעָרָיו
  choice: dans ses villes
  rationale: La préposition ב est rendue dans son sens spatial ordinaire. Le suffixe masculin singulier est conservé par « ses ».
- source_word: וְכִלְּתָה
  choice: elle anéantira
  rationale: כלה indique ici l’action de mener à son terme, d’épuiser ou de détruire entièrement. « Anéantira » transmet clairement cette destruction complète.
- source_word: בַדָּיו
  choice: ses barres
  rationale: Dans le cadre d’une attaque contre des villes, בדים désigne vraisemblablement les barres défensives, notamment celles des portes. Le terme « barres » conserve la formulation concise de l’hébreu.
- source_word: וְאָכָלָה
  choice: et dévorera
  rationale: Le sens concret de אכל est « manger », et « dévorer » maintient la personnification saisissante de l’épée. Aucun complément d’objet explicite n’est ajouté, conformément à l’hébreu.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: à cause de leurs projets
  rationale: La préposition מן est comprise dans un sens causal. « Projets » rend עצות dans un français actuel, tout en laissant ouverte la nuance de conseils, desseins ou stratégies.
theological_decisions:
- issue: Passage des suffixes singuliers (« ses villes », « ses barres ») au suffixe pluriel (« leurs projets »)
  choice: Conserver tel quel le passage du singulier au pluriel.
  alternative: 'Uniformiser les pronoms au pluriel : « leurs villes… leurs barres… leurs projets ».'
  rationale: L’hébreu peut présenter Israël ou Éphraïm comme une personne collective au singulier, puis viser les membres du peuple au pluriel. Uniformiser effacerait cette tension grammaticale et théologique.
- issue: Objet implicite du verbe « dévorer »
  choice: Ne pas ajouter de complément d’objet explicite.
  alternative: Ajouter « les » ou « tout » pour compléter la construction française.
  rationale: Le texte hébreu ne donne aucun objet explicite à וְאָכָלָה. L’emploi absolu, quoique poétique en français, évite d’identifier arbitrairement ce qui est dévoré.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La personnification de l’épée et le parallélisme poétique sont maintenus. La virgule après « dévorera » signale l’emploi absolu du verbe avant l’indication de cause.
