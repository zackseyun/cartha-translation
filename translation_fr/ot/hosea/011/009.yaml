  text: לֹ֤א אֶֽעֱשֶׂה֙ חֲר֣וֹן אַפִּ֔/י לֹ֥א אָשׁ֖וּב לְ/שַׁחֵ֣ת אֶפְרָ֑יִם כִּ֣י אֵ֤ל אָֽנֹכִי֙ וְ/לֹא אִ֔ישׁ בְּ/קִרְבְּ/ךָ֣ קָד֔וֹשׁ וְ/לֹ֥א אָב֖וֹא בְּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
translation:
  language: fr
  text: Je ne donnerai pas libre cours à l’ardeur de ma colère[a] ; je ne recommencerai pas à détruire Éphraïm[b]. Car moi, je suis Dieu, et non un homme, le Saint au milieu de toi ; je ne viendrai pas dans la ville[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la brûlure de ma colère ».'
    reason: Le nom hébreu évoque littéralement la chaleur ou la brûlure de la colère.
  - marker: b
    text: 'Ou : « je ne reviendrai pas pour détruire Éphraïm ».'
    reason: Le verbe hébreu peut exprimer aussi bien la répétition que le retour.
  - marker: c
    text: 'Hébreu difficile ; littéralement : « je ne viendrai pas dans la ville ». Certains comprennent la clause, dans ce contexte, comme le refus de venir en destructeur ou avec fureur.'
    reason: La dernière expression est discutée. Le texte principal conserve la formulation littérale, tandis que la note indique l’interprétation contextuelle possible.
lexical_decisions:
- source_word: אֶעֱשֶׂה חֲרוֹן אַפִּי
  choice: donnerai libre cours à l’ardeur de ma colère
  rationale: Littéralement, עשה signifie « faire » et חֲרוֹן אַף désigne la brûlure ou l’ardeur de la colère. En français, « donner libre cours à » exprime naturellement la mise à exécution de cette colère sans réduire celle-ci à un simple sentiment.
- source_word: אָשׁוּב לְשַׁחֵת
  choice: recommencerai à détruire
  rationale: שׁוב suivi d’un infinitif peut marquer soit le retour, soit la répétition. Ici, « recommencerai » donne un français courant et conserve la valeur itérative probable ; l’autre analyse est signalée en note.
- source_word: לְשַׁחֵת
  choice: détruire
  rationale: Le piel de שׁחת exprime ici la destruction ou la ruine produite par le jugement ; « détruire » est direct et adapté au contexte.
- source_word: אֵל
  choice: Dieu
  rationale: Dans l’opposition avec אִישׁ, le terme désigne clairement Dieu et souligne la différence entre Dieu et l’être humain.
- source_word: אִישׁ
  choice: un homme
  rationale: Le singulier hébreu forme l’antithèse « Dieu, et non un homme ». Cette formulation française reste naturelle et fidèle à l’image du texte.
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  choice: le Saint au milieu de toi
  rationale: קָדוֹשׁ est employé substantivement comme désignation divine, tandis que בְּקִרְבְּךָ exprime la présence au sein d’Éphraïm. Le tutoiement singulier conserve l’adresse collective hébraïque.
- source_word: וְלֹא אָבוֹא בְּעִיר
  choice: je ne viendrai pas avec fureur
  rationale: La clause est difficile. Dans le contexte d’un jugement retenu, elle est comprise comme le refus d’une venue hostile ou furieuse. La lecture plus littérale de בְּעִיר, « dans la ville », est conservée en note afin de ne pas masquer l’incertitude.
theological_decisions:
- issue: Le refus divin d’exécuter pleinement la colère
  choice: La déclaration de compassion est maintenue telle quelle et rattachée à l’identité de Dieu, qui est le Saint présent au milieu de son peuple.
  alternative: Expliquer le passage comme un changement émotionnel de Dieu ou, à l’inverse, atténuer le langage relationnel pour défendre une conception particulière de son immuabilité.
  rationale: Le texte fonde lui-même le refus de détruire sur la différence entre Dieu et l’homme ainsi que sur sa sainteté. La traduction préserve cette tension sans lui imposer une solution dogmatique.
- issue: Sens de וְלֹא אָבוֹא בְּעִיר
  choice: « je ne viendrai pas avec fureur » dans le texte principal
  alternative: « je n’entrerai pas dans la ville »
  rationale: Le contexte favorise une venue de jugement qui n’aura pas lieu, mais la forme hébraïque permet une lecture concrète liée à la ville. La note conserve explicitement cette autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme déclaratif et les contrastes du verset sont conservés. « Éphraïm » et le tutoiement singulier reflètent l’adresse collective du texte hébreu.
