- from: Mon peuple est résolument porté à se détourner de moi[a] ; même s’ils en appellent au Très-Haut, celui-ci ne les relève pas tous ensemble[b].
  to: Mon peuple est résolument porté à se détourner de moi[a] ; même s’ils en appellent au Très-Haut, tous ensemble, il ne les relève pas[b].
  rationale: La révision conserve la lecture principale de l’audit anglais — le Très-Haut ne relève pas le peuple — tout en plaçant יַחַד dans une position adverbiale plus proche de l’hébreu et en indiquant avec plus de précision les rattachements et analyses concurrents. Elle améliore aussi la fluidité du français et remplace un terme lexical alternatif peu courant.
