base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
translation:
  language: fr
  text: Mon peuple est résolument porté à se détourner de moi[a] ; même s’ils en appellent au Très-Haut, tous ensemble, il ne les relève pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « se détourner » peut aussi évoquer l’infidélité ou l’apostasie. La construction avec « moi » est difficile.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une autre analyse de l’hébreu difficile : « tous ensemble, ils ne l’exaltent pas » ou « pas un seul ne l’exalte ». « Tous ensemble » peut aussi se rattacher à leur appel au Très-Haut.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Mon peuple
  rationale: עַם désigne ici le peuple lié à Dieu par l’alliance plutôt qu’une nation au sens politique ; le suffixe de première personne impose « mon ».
- source_word: תְלוּאִים
  choice: est résolument porté à
  rationale: Le participe évoque le fait d’être attaché ou fixé à quelque chose. Cette tournure française exprime une inclination persistante sans retenir l’image peu naturelle d’être « suspendu ».
- source_word: לִמְשׁוּבָתִי
  choice: se détourner de moi
  rationale: מְשׁוּבָה peut désigner l’infidélité, l’apostasie ou le retour en arrière. La formulation verbale rend clairement, dans ce contexte, l’éloignement relationnel du peuple vis-à-vis de Dieu.
- source_word: וְאֶל־עַל
  choice: même s’ils en appellent au Très-Haut
  rationale: אֶל־עַל est compris comme désignant « le Très-Haut ». « Même si » rend le contraste contextuel entre l’appel adressé à Dieu et l’absence de relèvement.
- source_word: יִקְרָאֻהוּ
  choice: ils en appellent
  rationale: Le verbe signifie appeler ou invoquer. « En appeler au Très-Haut » est idiomatique en français et conserve l’idée d’un recours adressé à Dieu.
- source_word: יַחַד
  choice: tous ensemble
  rationale: יַחַד exprime l’action collective. Sa portée syntaxique demeure incertaine ; le texte principal le rattache au groupe que Dieu ne relève pas, tout en signalant d’autres analyses en note.
- source_word: לֹא יְרוֹמֵם
  choice: celui-ci ne les relève pas
  rationale: Le verbe רום peut signifier élever, exalter ou relever. Le sujet est compris comme le Très-Haut et l’objet implicite comme le peuple ; « relever » convient au contexte d’un secours refusé.
theological_decisions:
- issue: Interprétation de la proposition difficile יַחַד לֹא יְרוֹמֵם
  choice: 'Le Très-Haut est le sujet : malgré leur appel, il ne relève pas le peuple dans son ensemble.'
  alternative: « Tous ensemble, ils ne l’exaltent pas » ou « pas un seul ne l’exalte ».
  rationale: L’hébreu est très condensé et permet soit d’y voir l’absence d’intervention divine, soit le refus d’Israël d’exalter Dieu. Le contraste contextuel entre l’appel au Très-Haut et l’absence de délivrance favorise la première lecture, sans exclure les autres.
translation_notes:
  register: Français international moderne, digne et accessible. « Résolument porté à » exprime l’obstination sans lourdeur archaïque. Le pronom démonstratif « celui-ci » clarifie que, selon la lecture principale, le Très-Haut est le sujet de « relève ».
