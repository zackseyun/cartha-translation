    issue: Portée interprétative de « ne les relève pas tous ensemble »
    rationale: Cette formulation précise un objet implicite (« les » = le peuple) et fait de יַחַד une qualification de cet objet. La lecture est défendable, mais le dernier membre demeure syntaxiquement disputé ; une note doit présenter clairement l’alternative où le peuple est sujet et Dieu objet.
  - severity: low
    issue: 'Note a : « apostasier »'
    rationale: Le verbe est rare et peu idiomatique en français international moderne. « Apostasie » ou « se détourner de Dieu » communique mieux l’alternative sans jargon inutile.
  - severity: low
    issue: « celui-ci »
    rationale: Le démonstratif est un peu lourd après « le Très-Haut ». Le pronom « il » est plus naturel et garde le même référent dans la lecture principale.
