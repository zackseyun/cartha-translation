  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
translation:
  language: fr
  text: Quand Israël était enfant[a], je l’ai aimé, et d’Égypte, j’ai appelé mon fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Car Israël était un jeune garçon, et je l’ai aimé. » Le début hébreu peut se comprendre soit comme causal (« car », « parce que »), soit comme temporel (« quand ») ; le sens temporel convient bien à cette évocation du passé. La seconde partie du verset est citée en Matthieu 2.15.'
    reason: Variante lexicale et ambiguïté syntaxique de כִּי ; signalement de la reprise intertextuelle.
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans ce contexte rétrospectif, כִּי introduit naturellement une proposition temporelle ou circonstancielle. « Quand » convient mieux au récit que le causal « car » ou « parce que », tout en signalant l’autre lecture en note.
- source_word: נַעַר
  choice: enfant
  rationale: נַעַר peut désigner un garçon, un jeune ou un serviteur. Dans la métaphore collective de la jeunesse d’Israël et de sa relation filiale avec Dieu, « enfant » exprime l’immaturité sans préciser indûment l’âge.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre du peuple personnifié au singulier ; la forme française traditionnelle est conservée.
- source_word: וָאֹהֲבֵהוּ
  choice: je l’ai aimé
  rationale: Le suffixe masculin singulier renvoie à Israël personnifié comme fils. Le passé composé est naturel en français moderne dans cette évocation rétrospective.
- source_word: וּמִמִּצְרַיִם
  choice: et hors d’Égypte
  rationale: La préposition מִן indique l’origine ou la provenance. « Hors d’Égypte » maintient le mouvement de sortie et la résonance de l’exode.
- source_word: קָרָאתִי
  choice: j’ai appelé
  rationale: קרא signifie couramment « appeler » ou « convoquer ». « J’ai appelé » préserve la largeur sémantique du verbe et son lien verbal avec la citation ultérieure en Matthieu 2.15.
- source_word: לִבְנִי
  choice: mon fils
  rationale: Avec קרא, le ל peut introduire celui qui est appelé ; en français, « appeler mon fils » rend idiomatiquement l’expression et conserve la métaphore filiale collective.
theological_decisions:
- issue: Israël collectif comme « mon fils » et reprise christologique ultérieure
  choice: Traduire selon le sens immédiat d’Osée, où le fils désigne Israël collectivement lors de l’exode, sans exclure la reprise de Matthieu 2.15.
  alternative: Formuler le verset comme une prédiction messianique directe et exclusive.
  rationale: Le référent historique et littéraire immédiat est Israël. La formulation reste néanmoins compatible avec l’application canonique ultérieure sans l’introduire artificiellement dans le texte d’Osée.
translation_notes:
  register: Français international moderne, simple et digne. Le passé composé rend naturellement la rétrospective en prose courante. « Hors d’Égypte » conserve l’image spatiale de la sortie, tandis que les pronoms masculins singuliers maintiennent la personnification filiale d’Israël.
