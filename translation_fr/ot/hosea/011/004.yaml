  - severity: medium
    issue: « de dessus leurs mâchoires » est lourd et peu idiomatique.
    rationale: La formulation reproduit trop littéralement la construction spatiale hébraïque. Une formulation indiquant que le joug est relevé des mâchoires conserve l’image sans produire une tournure artificielle.
