  text: בְּ/חַבְלֵ֨י אָדָ֤ם אֶמְשְׁכֵ/ם֙ בַּ/עֲבֹת֣וֹת אַהֲבָ֔ה וָ/אֶהְיֶ֥ה לָ/הֶ֛ם כִּ/מְרִ֥ימֵי עֹ֖ל עַ֣ל לְחֵי/הֶ֑ם וְ/אַ֥ט אֵלָ֖י/ו אוֹכִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
translation:
  language: fr
  text: Je les tirais avec des cordes humaines[a], avec des cordes d’amour. J’étais pour eux comme ceux qui relèvent le joug qui pesait sur leurs mâchoires; je me penchais vers lui et lui donnais à manger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des cordes d’homme ». L’expression hébraïque peut évoquer une manière humaine et douce de conduire, plutôt que des cordes appartenant littéralement à un homme.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu passe ici du pluriel au singulier : « vers lui… lui donnais à manger ». De nombreuses traductions harmonisent : « vers eux… leur donnais à manger ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵי אָדָם
  choice: avec des liens humains
  rationale: חַבְלֵי désigne des liens ou des cordes, et אָדָם peut caractériser ici une manière humaine de conduire, par contraste avec le traitement d’un animal. « Liens humains » reste concis, naturel en français et conserve une part de l’ambiguïté de l’expression hébraïque.
- source_word: אֶמְשְׁכֵם
  choice: Je les tirais
  rationale: משך signifie tirer ou attirer. « Tirais » maintient l’image concrète des liens tout en permettant le sens relationnel d’une attraction exercée avec amour.
- source_word: בַּעֲבֹתוֹת אַהֲבָה
  choice: avec des cordes d’amour
  rationale: עֲבֹתוֹת désigne des cordes épaisses. « Cordes » distingue ce terme des « liens » du premier membre et conserve le parallélisme poétique; אַהֲבָה signifie « amour ».
- source_word: וָאֶהְיֶה לָהֶם
  choice: J’étais pour eux
  rationale: Cette formulation française naturelle introduit la comparaison qui suit sans ajouter d’interprétation.
- source_word: כִּמְרִימֵי עֹל
  choice: comme ceux qui soulèvent le joug
  rationale: Le participe est au pluriel. « Ceux qui soulèvent » respecte ce nombre inhabituel et ne le normalise pas en un sujet singulier.
- source_word: עַל לְחֵיהֶם
  choice: de dessus leurs mâchoires
  rationale: לְחִי peut désigner la joue ou la mâchoire. Dans l’image du joug imposé à un animal, « mâchoires » rend concrètement la partie sur laquelle il exerce sa pression; « de dessus » conserve la valeur spatiale de עַל.
- source_word: וְאַט
  choice: je me penchais
  rationale: La forme est difficile, mais dans ce contexte elle évoque couramment le geste de se baisser ou de se pencher avec sollicitude. Cette traduction maintient l’image concrète sans l’expliquer abstraitement.
- source_word: אֵלָיו אוֹכִיל
  choice: vers lui et lui donnais à manger
  rationale: Le suffixe de אֵלָיו est singulier, et le hiphil de אכל signifie faire manger ou nourrir. La formulation conserve le passage du pluriel au singulier présent dans le texte massorétique.
theological_decisions:
- issue: Images anthropomorphiques et pastorales des soins de Dieu
  choice: 'Conserver les gestes concrets: tirer par des liens, soulever le joug, se pencher et donner à manger.'
  alternative: Reformuler abstraitement en disant que Dieu guidait Israël avec bonté et pourvoyait à ses besoins.
  rationale: L’hébreu associe autorité et tendresse au moyen d’images concrètes. Les préserver évite d’imposer une interprétation théologique absente du verset.
- issue: Passage des pronoms pluriels au pronom singulier אֵלָיו
  choice: Conserver « vers lui » et « lui donnais à manger » dans le texte principal.
  alternative: 'Harmoniser au pluriel: « vers eux » et « leur donnais à manger ».'
  rationale: Le texte massorétique porte un suffixe singulier, qui peut envisager collectivement Israël comme un seul fils. Il convient de ne pas effacer ce changement de nombre, tout en signalant la lecture harmonisée.
translation_notes:
  register: Français international moderne, poétique mais accessible. L’imparfait exprime les actions répétées et les soins continus évoqués dans le contexte. Les images concrètes et le changement de nombre du texte hébreu sont maintenus; les formulations trop techniques ou confessionnelles sont évitées.
