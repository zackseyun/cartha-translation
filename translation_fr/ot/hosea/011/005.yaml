source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: fr
  text: Il ne reviendra pas au pays d’Égypte, mais l’Assyrie sera son roi, car ils ont refusé de revenir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Revenir » peut aussi évoquer le fait de revenir sur ses pas ou, dans un sens spirituel, de se tourner de nouveau vers Dieu. Le même verbe hébreu est employé au début et à la fin du verset.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  choice: Il ne retournera pas
  rationale: Le qal inaccompli à la 3e personne du masculin singulier, précédé de la négation, est rendu comme une annonce future. « Retourner » maintient le lien lexical avec לָשׁוּב à la fin du verset.
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: au pays d’Égypte
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays/terre », et l’écho possible au séjour ancien d’Israël en Égypte.
- source_word: וְאַשּׁוּר
  choice: mais l’Assyrie
  rationale: 'La conjonction est comprise ici dans son sens adversatif contextuel : non pas l’Égypte, mais l’Assyrie.'
- source_word: הוּא מַלְכּוֹ
  choice: sera son roi
  rationale: Le futur convient à l’annonce prophétique. La métaphore royale est conservée plutôt que paraphrasée par « dominera sur lui ».
- source_word: כִּי מֵאֲנוּ
  choice: parce qu’ils ont refusé
  rationale: כִּי introduit le motif du jugement, et le parfait pluriel de מאן exprime le refus arrêté du peuple sans expliciter un sujet absent du syntagme hébreu.
- source_word: לָשׁוּב
  choice: de revenir
  rationale: « Revenir » peut évoquer à la fois un mouvement concret et le retour à Dieu. Il reprend en français la même famille lexicale que « retournera ».
theological_decisions:
- issue: Sens de שוב dans les deux propositions
  choice: Employer « retourner » puis « revenir », deux verbes de même sens en français, sans préciser explicitement « se repentir ».
  alternative: Traduire la fin par « ils ont refusé de se repentir ».
  rationale: Le contexte permet une résonance géographique et une résonance spirituelle. Une traduction explicite par « se repentir » lèverait une ambiguïté que l’hébreu maintient.
- issue: Référent du pluriel מֵאֲנוּ
  choice: Conserver « ils » sans ajouter d’antécédent.
  alternative: Écrire « mon peuple a refusé ».
  rationale: Le verbe hébreu est au pluriel, mais aucun sujet nominal n’est exprimé dans cette proposition. Ajouter « mon peuple » importerait le contexte immédiat dans le texte du verset.
- issue: Image de la royauté assyrienne
  choice: Conserver « l’Assyrie sera son roi ».
  alternative: Rendre par « l’Assyrie dominera sur lui ».
  rationale: La formulation personnifie l’Assyrie et présente sa domination comme une royauté étrangère; cette tension métaphorique mérite d’être préservée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure contrastive et la métaphore de l’Assyrie comme roi sont conservées; une note signale le double sens possible du verbe שוב.
