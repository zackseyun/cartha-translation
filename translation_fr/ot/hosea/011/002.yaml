source:
  edition: WLC
  text: קָרְא֖וּ לָ/הֶ֑ם כֵּ֚ן הָלְכ֣וּ מִ/פְּנֵי/הֶ֔ם לַ/בְּעָלִ֣ים יְזַבֵּ֔חוּ וְ/לַ/פְּסִלִ֖ים יְקַטֵּרֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
translation:
  language: fr
  text: Plus on les appelait[a], plus ils s’éloignaient d’eux ; ils continuaient à offrir des sacrifices aux Baals et à brûler de l’encens aux idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « À mesure qu’ils les appelaient, ceux-ci s’éloignaient d’eux. » L’hébreu ne précise pas qui lançait l’appel.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les images sculptées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  choice: on les appelait
  rationale: Le qal pluriel avec ל exprime un appel adressé à eux, mais le sujet n’est pas nommé. Le pronom indéfini « on » conserve cette indétermination en français naturel sans identifier les auteurs de l’appel.
- source_word: כֵּן
  choice: plus… plus…
  rationale: 'Dans cette construction corrélative, כֵּן marque la correspondance ou la progression proportionnelle : à mesure que l’appel se répétait, l’éloignement augmentait.'
- source_word: הָלְכוּ מִפְּנֵיהֶם
  choice: ils s’éloignaient d’eux
  rationale: הלך avec מן־פנים indique ici le fait de se retirer de la présence de quelqu’un. « S’éloignaient d’eux » est idiomatique et conserve le pronom pluriel de l’hébreu.
- source_word: לַבְּעָלִים
  choice: aux Baals
  rationale: Le pluriel désigne les diverses manifestations ou divinités du culte de Baal ; « les Baals » en maintient explicitement la pluralité.
- source_word: יְזַבֵּחוּ
  choice: ils continuaient à offrir des sacrifices
  rationale: L’imparfait hébreu décrit vraisemblablement une pratique habituelle ou répétée. Cette formulation française en rend la persistance.
- source_word: לַפְּסִלִים
  choice: pour les idoles
  rationale: פְּסִילִים désigne des images cultuelles taillées. « Idoles » est le terme courant, tandis que la nuance concrète de sculpture est signalée en note.
- source_word: יְקַטֵּרוּן
  choice: brûler de l’encens
  rationale: Le piel de קטר, dans un contexte cultuel, désigne couramment l’action de faire fumer de l’encens ou une offrande aromatique.
theological_decisions:
- issue: Sujet non exprimé de « ils les appelaient »
  choice: Conserver un sujet indéterminé au moyen de « on »
  alternative: « Dieu les appelait », « les prophètes les appelaient » ou « ils étaient appelés »
  rationale: L’hébreu emploie un verbe au pluriel sans identifier les auteurs de l’appel. Les nommer trancherait une question que le verset laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La corrélation « plus… plus… » restitue naturellement le mouvement du verset. « On » maintient l’indétermination du sujet appelant, tandis que les pronoms conservent la formulation resserrée de la poésie hébraïque.
