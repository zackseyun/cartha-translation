  terminology: « Yahweh », « agrée », « faute », « péchés » et « Égypte » sont appropriés. « Agrée » convient au contexte sacrificiel. Le maintien d’« Égypte » et de la note préserve l’ambiguïté entre retour réel et image d’asservissement.
