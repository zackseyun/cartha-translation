  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
translation:
  language: fr
  text: Quant aux sacrifices de mes offrandes[a], ils sacrifient de la viande et la mangent, mais Yahweh ne les agrée pas[b]. Maintenant, il se souviendra de leur faute et les châtiera pour leurs péchés. Eux, ils retourneront en Égypte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu présente ici une expression inhabituelle, littéralement proche de « les sacrifices de mes offrandes ». On peut aussi comprendre : « mes dons sacrificiels » ou, moins probablement, « mes sacrifices bien-aimés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne les accepte pas » ou « n’y prend pas plaisir ».'
    reason: lexical_alternative
  - marker: c
    text: Le « retour en Égypte » peut désigner un retour effectif ou, plus largement, un nouvel asservissement et l’exil sous l’image de l’Égypte.
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  choice: les sacrifices qu’ils m’offrent
  rationale: L’expression hébraïque est inhabituelle, littéralement proche de « les sacrifices de mes offrandes ». Cette formulation française en transmet le sens probable de manière naturelle, tout en signalant l’incertitude lexicale en note.
- source_word: יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ
  choice: ils sacrifient de la viande et la mangent
  rationale: Le contexte sacrificiel donne à בָשָׂר le sens concret de viande destinée au repas sacrificiel. La reprise pronominale rend la phrase naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לֹא רָצָם
  choice: ne les agrée pas
  rationale: Dans le contexte des sacrifices, רצה exprime l’acceptation favorable. « Agréer » conserve cette nuance cultuelle dans un registre digne.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: il se souviendra de leur faute
  rationale: « Se souvenir » préserve l’image hébraïque et sa portée judiciaire; « faute » rend עָוֹן en français courant sans effacer la culpabilité impliquée.
- source_word: וְיִפְקֹד חַטֹּאותָם
  choice: leur fera rendre compte de leurs péchés
  rationale: פקד désigne ici l’intervention judiciaire de Dieu. La formulation évite l’étrangeté de « visiter leurs péchés » tout en conservant l’idée de mise en compte et de sanction.
- source_word: הֵמָּה מִצְרַיִם יָשׁוּבוּ
  choice: Eux, ils retourneront en Égypte
  rationale: La dislocation française rend l’insistance du pronom הֵמָּה. Le nom Égypte est maintenu afin de ne pas trancher entre retour géographique et image d’un nouvel asservissement.
theological_decisions:
- issue: Sens du retour en Égypte
  choice: ils retourneront en Égypte
  alternative: ils retomberont dans un asservissement semblable à celui d’Égypte
  rationale: L’hébreu nomme directement l’Égypte. Le texte principal conserve cette formulation et la note maintient ouvertes les lectures littérale, symbolique ou conjointes.
- issue: Portée de la mémoire divine
  choice: il se souviendra de leur faute
  alternative: il leur demandera compte de leur faute
  rationale: La traduction garde le verbe « se souvenir », qui porte ici une force judiciaire, sans réduire l’expression à une simple activité mentale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « les sacrifices qu’ils m’offrent » privilégie la lisibilité tout en renvoyant en note à l’expression hébraïque difficile. « Agréer » maintient la nuance cultuelle sans archaïsme excessif, et « Eux, ils » restitue l’emphase du pronom hébreu.
