source:
  edition: WLC
  text: כִּֽי הִרְבָּ֥ה אֶפְרַ֛יִם מִזְבְּחֹ֖ת לַ/חֲטֹ֑א הָיוּ ל֥/וֹ מִזְבְּח֖וֹת לַ/חֲטֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/011.yaml
  text: Because Ephraim has multiplied altars for sinning[a], they have become altars for sinning to him.
translation:
  language: fr
  text: Parce qu’Éphraïm a multiplié les autels pour pécher[a], ils sont devenus pour lui des autels pour pécher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour offrir des sacrifices pour le péché », aux deux endroits où figure « pour pécher ». La forme hébraïque peut recevoir un sens cultuel, mais le contexte favorise l’idée que ces autels sont devenus des occasions de pécher.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Parce que
  rationale: Introduit ici la raison ou le fondement du jugement annoncé et s’enchaîne naturellement avec le contexte.
- source_word: הִרְבָּה
  choice: a multiplié
  rationale: Le hiphil de רבה exprime l’accroissement causé; cette formulation conserve la force verbale et l’accusation prophétique.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé; dans Osée, il désigne souvent par métonymie le royaume du Nord, mais le texte nomme explicitement Éphraïm.
- source_word: מִזְבְּחֹת
  choice: les autels
  rationale: Équivalent français courant de מזבח; le pluriel souligne la prolifération des lieux de culte.
- source_word: לַחֲטֹא
  choice: pour pécher
  rationale: L’infinitif construit de חטא garde ainsi son sens verbal le plus naturel dans ce contexte polémique, tout en permettant une note sur l’interprétation cultuelle possible.
- source_word: הָיוּ לוֹ
  choice: ils sont devenus pour lui
  rationale: « Sont devenus » exprime l’état résultant, tandis que « pour lui » conserve la nuance du datif לוֹ.
- source_word: מִזְבְּחוֹת לַחֲטֹא
  choice: des autels pour pécher
  rationale: La répétition est maintenue afin de reproduire la rhétorique et l’ironie de l’hébreu.
theological_decisions:
- issue: Sens de לַחֲטֹא dans ses deux occurrences
  choice: 'Sens verbal : « pour pécher »'
  alternative: 'Sens cultuel : « pour les sacrifices pour le péché »'
  rationale: חטא peut avoir un emploi cultuel dans certains contextes, mais ici la dénonciation des autels multipliés favorise l’idée qu’ils sont devenus des occasions ou instruments de péché. La variante est néanmoins signalée afin de préserver l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition volontaire de « autels pour pécher » conserve l’insistance et l’ironie prophétiques de l’hébreu.
