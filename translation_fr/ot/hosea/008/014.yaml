revisions:
- from: Car Israël a oublié celui qui l’a fait et s’est construit des palais[a] ; Juda a multiplié les villes fortifiées. Alors j’enverrai le feu dans ses villes, et il dévorera leurs citadelles.
  to: Car Israël a oublié celui qui l’a fait et a bâti des palais[a] ; Juda a multiplié les villes fortifiées. Alors j’enverrai du feu dans ses villes, et il dévorera leurs citadelles.
  rationale: 'La seule révision nécessaire remplace « s’est construit » par « a bâti », afin d’éviter l’ajout d’une valeur réflexive absente du verbe hébreu. Le reste conserve les choix prudents du projet : « palais » avec une note pour l’alternative « temples », et la distinction française entre « ses villes » et « leurs citadelles » sans trancher davantage l’ambiguïté des suffixes.'
