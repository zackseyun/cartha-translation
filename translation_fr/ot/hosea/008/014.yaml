  text: וַ/יִּשְׁכַּ֨ח יִשְׂרָאֵ֜ל אֶת עֹשֵׂ֗/הוּ וַ/יִּ֨בֶן֙ הֵֽיכָל֔וֹת וִֽ/יהוּדָ֕ה הִרְבָּ֖ה עָרִ֣ים בְּצֻר֑וֹת וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
translation:
  language: fr
  text: Car Israël a oublié celui qui l’a fait et a bâti des palais[a] ; Juda a multiplié les villes fortifiées. Alors j’enverrai du feu dans ses villes, et il dévorera leurs citadelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des temples ». Le mot hébreu peut désigner des palais ou des édifices cultuels.'
    reason: 'Alternative lexicale significative : הֵיכָלוֹת peut désigner des palais ou des structures cultuelles.'
lexical_decisions:
- source_word: עֹשֵׂהוּ
  choice: celui qui l’a fait
  rationale: Cette formulation naturelle conserve la valeur participiale et personnelle de l’hébreu ainsi que le pronom renvoyant à Israël, sans recourir au terme plus abstrait « Créateur ».
- source_word: הֵיכָלוֹת
  choice: palais
  rationale: Le mot peut désigner des palais ou des temples. « Palais » convient au parallèle avec les villes fortifiées et les citadelles, tandis que l’autre sens est signalé en note.
- source_word: הִרְבָּה
  choice: a multiplié
  rationale: Le hiphil exprime ici le fait de rendre nombreux ; « a multiplié » restitue avec concision l’expansion délibérée des ouvrages défensifs.
- source_word: עָרִים בְּצֻרוֹת
  choice: villes fortifiées
  rationale: Expression française courante qui rend clairement le caractère défensif et militaire des villes.
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: Alors j’enverrai le feu
  rationale: « Alors » explicite sobrement le lien entre la confiance placée dans les défenses et le jugement annoncé, sans forcer une causalité plus précise que le contexte.
- source_word: בְּעָרָיו
  choice: dans ses villes
  rationale: Avec l’envoi du feu, « dans » exprime naturellement son entrée dévastatrice dans les villes ; le suffixe masculin singulier renvoie le plus naturellement à Juda.
- source_word: אַרְמְנֹתֶיהָ
  choice: leurs citadelles
  rationale: « Citadelles » rend le sens de places fortes dans ce contexte militaire. En français, le pluriel « leurs » renvoie naturellement aux villes et restitue la référence du suffixe féminin hébreu sans ambiguïté artificielle de genre.
theological_decisions:
- issue: Changement de référent dans les suffixes entre Israël, Juda et les villes
  choice: « ses villes » renvoie à Juda, tandis que « leurs citadelles » renvoie aux villes.
  alternative: Comprendre que la dernière proposition revient entièrement à Israël, ou uniformiser les référents en français.
  rationale: Juda est l’antécédent masculin singulier le plus proche de « ses villes ». Le suffixe féminin de « citadelles » se rapporte naturellement aux villes ; la formulation française conserve ce déplacement de référent de manière intelligible.
- issue: Sens de הֵיכָלוֹת
  choice: « palais » dans le texte, avec « temples » en note.
  alternative: « temples » dans le texte principal.
  rationale: Le terme hébreu admet les deux sens. Le contexte des villes fortifiées et des citadelles favorise les structures politiques de sécurité, mais la possibilité cultuelle reste réelle et doit être préservée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme de l’hébreu. « Celui qui l’a fait » évite une abstraction inutile ; « alors » marque la progression vers le jugement. Le changement entre « ses villes » et « leurs citadelles » rend les référents hébreux sans employer en français des pronoms de genre potentiellement trompeurs.
