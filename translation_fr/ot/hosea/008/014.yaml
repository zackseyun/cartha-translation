    reason: 'Alternative lexicale significative : הֵיכָלוֹת peut désigner des palais ou des structures cultuelles.'
  revision_rationale: 'La seule révision nécessaire remplace « s’est construit » par « a bâti », afin d’éviter l’ajout d’une valeur réflexive absente du verbe hébreu. Le reste conserve les choix prudents du projet : « palais » avec une note pour l’alternative « temples », et la distinction française entre « ses villes » et « leurs citadelles » sans trancher davantage l’ambiguïté des suffixes.'
