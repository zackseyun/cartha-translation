  text: לִ֖/י יִזְעָ֑קוּ אֱלֹהַ֥/י יְֽדַעֲנ֖וּ/ךָ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/002.yaml
  text: To me they cry[a], ‘My God[b], we—Israel—know you!’
translation:
  language: fr
  text: 'Vers moi, ils crient[a] : « Mon Dieu, nous te connaissons[b], nous, Israël ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils crient au secours ». Le verbe hébreu peut exprimer un cri pressant lancé dans la détresse.
    reason: lexical_alternative
  - marker: b
    text: Ici, « connaître » peut évoquer une relation reconnue avec Dieu, notamment dans le cadre de l’alliance, et non une simple connaissance intellectuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: vers moi
  rationale: 'La préposition ל avec le suffixe de première personne indique ici la direction de l’appel : Israël adresse son cri à Dieu. « Vers moi » est naturel en français dans cette construction.'
- source_word: יִזְעָקוּ
  choice: ils crient
  rationale: Le verbe זעק désigne souvent un cri pressant, notamment un appel au secours. Le présent français convient au discours prophétique et s’insère naturellement dans le contexte.
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Le nom porte un suffixe de première personne du singulier et forme ici une interpellation directe. « Mon Dieu » en conserve la simplicité sans ajouter une particule vocative.
- source_word: יְדַעֲנוּךָ
  choice: nous te connaissons
  rationale: ידע signifie « connaître » et peut évoquer une relation reconnue, notamment dans un cadre d’alliance. La traduction littérale préserve cette richesse sans expliciter davantage que l’hébreu.
- source_word: יִשְׂרָאֵל
  choice: nous, Israël
  rationale: Placé après le verbe à la première personne du pluriel, « Israël » identifie avec insistance ceux qui parlent. La reprise « nous, Israël » conserve cette auto-identification emphatique et la position finale marquée.
theological_decisions:
- issue: Portée relationnelle de « connaître » dans le contexte de l’alliance
  choice: nous te connaissons
  alternative: nous te reconnaissons / nous sommes liés à toi par l’alliance
  rationale: Chez Osée, « connaître » peut comporter une dimension relationnelle, morale et liée à l’alliance. Le texte formule néanmoins une affirmation simple, dont le contexte révèle le caractère contestable ; l’expliciter dans le corps du verset résoudrait indûment cette tension.
- issue: Fonction d’« Israël » dans la parole rapportée
  choice: 'Comprendre « Israël » comme l’auto-identification emphatique des locuteurs : « nous, Israël »'
  alternative: Comprendre « Israël » comme un interlocuteur distinct ou comme un élément extérieur à la citation
  rationale: La première personne du pluriel de « nous te connaissons » indique que le peuple parle à Dieu. Le nom final précise avec emphase l’identité des locuteurs plutôt qu’il ne désigne un nouvel interlocuteur.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation marque clairement le discours direct. La reprise finale « nous, Israël » garde l’insistance et la légère abrupteté de l’hébreu sans rendre la phrase obscure.
