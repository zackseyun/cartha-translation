id: HOS.8.10
reference: Hosea 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֛ם כִּֽי יִתְנ֥וּ בַ/גּוֹיִ֖ם עַתָּ֣ה אֲקַבְּצֵ֑/ם וַ/יָּחֵ֣לּוּ מְּעָ֔ט מִ/מַּשָּׂ֖א מֶ֥לֶךְ שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
translation:
  language: fr
  text: Même s’ils achètent des appuis parmi les nations[a], maintenant je les rassemblerai ; ils commenceront à diminuer[b] sous le fardeau du roi des princes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « même s’ils font des dons parmi les nations ». Le verbe hébreu signifie habituellement « donner », mais il semble désigner ici le paiement par lequel Israël cherche à obtenir l’appui de puissances étrangères.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette proposition est difficile. On peut aussi comprendre : « ils se tordront quelque peu de douleur » ou « ils deviendront peu nombreux à cause du fardeau » — éventuellement « du tribut ».'
    reason: alternative_reading
  - marker: c
    text: L’expression « le roi des princes » peut désigner le souverain d’un empire, dont le fardeau prend notamment la forme d’un tribut oppressif.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְנוּ בַגּוֹיִם
  choice: ils achètent des appuis parmi les nations
  rationale: Le verbe נתן signifie normalement « donner », mais, après l’image d’Éphraïm qui paie des amants en 8.9, il évoque vraisemblablement ici les paiements destinés à obtenir des soutiens étrangers. « Achètent des appuis » exprime naturellement ce sens politique sans préciser indûment la forme de l’alliance.
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe temporel annonce l’intervention divine imminente.
- source_word: אֲקַבְּצֵם
  choice: je les rassemblerai
  rationale: 'קבץ signifie « rassembler ». La formulation reste neutre : le contexte suggère un rassemblement en vue du jugement, mais le texte ne l’explicite pas dans le verbe lui-même.'
- source_word: וַיָּחֵלּוּ מְּעָט
  choice: ils commenceront à diminuer
  rationale: La construction est difficile. Cette traduction conserve l’idée possible d’un commencement et comprend מעט comme l’expression d’une diminution, tout en signalant les autres analyses dans une note.
- source_word: מִמַּשָּׂא
  choice: sous le fardeau
  rationale: מַשָּׂא désigne une charge ou un fardeau et peut évoquer concrètement un tribut ou une exaction. « Sous le fardeau » garde l’image tout en convenant au contexte de domination impériale.
- source_word: מֶלֶךְ שָׂרִים
  choice: du roi des princes
  rationale: Cette traduction conserve la chaîne construite concise de l’hébreu et peut désigner un souverain impérial placé au-dessus de dirigeants subalternes, sans la transformer en « roi et princes ».
theological_decisions:
- issue: Le rassemblement annoncé est-il restaurateur ou judiciaire ?
  choice: Conserver « je les rassemblerai » sans en préciser le but dans le corps du texte
  alternative: Expliciter un rassemblement pour le jugement ou comprendre une restauration future
  rationale: Le contexte immédiat des alliances étrangères et de l’oppression favorise une portée judiciaire. Toutefois, le verbe קבץ ne précise pas à lui seul la finalité du rassemblement ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international actuel, clair et digne. Le point-virgule respecte l’articulation du verset. « Achètent des appuis » rend idiomatiquement le contexte politique, tandis que les notes conservent les principales ambiguïtés lexicales et syntaxiques.
