  source_fidelity: 'Le texte rend adéquatement les principaux éléments du verset : l’idée contextuelle de paiements pour obtenir des soutiens étrangers (יִתְנוּ בַגּוֹיִם), le rassemblement divin sans en imposer la finalité (אֲקַבְּצֵם), et la formulation difficile relative à la diminution et au fardeau du « roi des princes ». « Sous le fardeau » est une restitution contextuellement recevable de מִמַּשָּׂא, qui peut aussi évoquer un tribut.'
