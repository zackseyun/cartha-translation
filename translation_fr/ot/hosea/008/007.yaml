  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
translation:
  language: fr
  text: Car ils sèment le vent et moissonneront la tempête[a]. Le blé sur pied n’a pas d’épi[b] ; il ne donnera pas de farine. Même s’il en produit[c], des étrangers l’engloutiront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tourbillon » ou « l’ouragan ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « pousse » ou « croissance » ; ici, il désigne probablement l’épi nécessaire à la production de farine.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Peut-être en produira-t-il ; des étrangers l’engloutiront. »'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le motif du jugement précédent et conserve le lien argumentatif du texte prophétique.
- source_word: רוּחַ
  choice: le vent
  rationale: Le sens concret convient à l’image agricole des semailles et de la moisson ainsi qu’au parallèle intensifié avec סוּפָה.
- source_word: וְסוּפָתָה
  choice: la tempête
  rationale: סוּפָה désigne une violente tempête, parfois un tourbillon. « Tempête » est naturel en français et exprime clairement l’aggravation entre ce qui est semé et ce qui sera récolté.
- source_word: יִקְצֹרוּ
  choice: moissonneront
  rationale: L’inaccompli exprime ici la conséquence future ; « moissonner » reprend précisément le vocabulaire agricole.
- source_word: קָמָה
  choice: le blé sur pied
  rationale: Le nom désigne les céréales encore dressées dans le champ. Cette formulation française est naturelle et concrète.
- source_word: צֶמַח
  choice: épi
  rationale: Le terme peut désigner une pousse ou une croissance ; dans ce contexte céréalier, l’épi est la partie attendue pour produire de la farine. L’ambiguïté lexicale est signalée en note.
- source_word: בְּלִי יַעֲשֶׂה קֶּמַח
  choice: il ne donnera pas de farine
  rationale: Rend idiomatiquement l’absence de tout produit utilisable, sans surcharger l’image d’une explication.
- source_word: אוּלַי
  choice: Même si
  rationale: 'Dans le contexte, אוּלַי introduit une possibilité concédée : à supposer qu’il y ait un rendement, celui-ci profitera à d’autres.'
- source_word: זָרִים
  choice: des étrangers
  rationale: Désigne des personnes extérieures au peuple, vraisemblablement des étrangers ; le terme français garde cette portée sans précision ajoutée.
- source_word: יִבְלָעֻהוּ
  choice: l’engloutiraient
  rationale: Préserve l’image vive du verbe בלע, « avaler, engloutir », et l’idée d’une consommation totale.
theological_decisions:
- issue: Interprétation de la métaphore agricole
  choice: Conserver directement l’image de semer le vent, moissonner la tempête et perdre la récolte.
  alternative: Expliciter par une paraphrase abstraite évoquant des actes vains et leurs conséquences désastreuses.
  rationale: Le verset formule lui-même le jugement sous forme d’image agricole. La traduction laisse cette image porter sa force théologique sans lui imposer une interprétation développée.
- issue: Valeur de אוּלַי dans la dernière proposition
  choice: 'Lire la proposition comme une concession : « Même s’il en donnait ».'
  alternative: 'Conserver plus littéralement la possibilité : « Peut-être en donnera-t-il ; des étrangers l’engloutiront. »'
  rationale: La lecture concessive s’accorde bien à la progression du jugement, mais la valeur ordinaire de « peut-être » demeure possible et est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme agricole est conservé, avec « semer », « moissonner », « blé sur pied », « épi » et « farine ». Les pronoms renvoient au blé sur pied ; la tournure hypothétique finale maintient la tension du texte hébreu.
