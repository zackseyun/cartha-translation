  text: נִבְלַ֖ע יִשְׂרָאֵ֑ל עַתָּה֙ הָי֣וּ בַ/גּוֹיִ֔ם כִּ/כְלִ֖י אֵֽין חֵ֥פֶץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/008.yaml
  text: Israel is swallowed up[a]; now they are among the nations like a vessel in which there is no delight.
translation:
  language: fr
  text: Israël est englouti ; maintenant, il est parmi les nations, comme un objet dont personne ne veut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un objet qui ne plaît à personne ».'
    reason: La formule hébraïque אֵין חֵפֶץ בּוֹ exprime littéralement l’absence de plaisir, d’agrément ou de désir à son égard. La traduction principale rend l’idée de manière idiomatique; la note conserve l’autre nuance lexicale pertinente.
lexical_decisions:
- source_word: נִבְלַע
  choice: est englouti
  rationale: Le nifal de בלע exprime le fait d’être avalé ou englouti. Le présent rend avec force l’accompli prophétique tout en conservant le passif.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre désignant ici le royaume du Nord, envisagé collectivement.
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe marque la situation qui résulte désormais du jugement annoncé.
- source_word: הָיוּ בַגּוֹיִם
  choice: il se trouve parmi les nations
  rationale: Le verbe au pluriel renvoie aux membres du peuple désigné collectivement par le singulier « Israël ». En français, la reprise au singulier donne une phrase naturelle sans perdre ce sens collectif.
- source_word: כִּכְלִי
  choice: comme un objet
  rationale: כְּלִי peut désigner un récipient, un ustensile ou plus largement un objet. « Objet » convient naturellement à la proposition relative qui suit et préserve l’indétermination du terme.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: dont personne ne veut
  rationale: L’expression indique qu’on ne trouve en lui ni agrément ni intérêt, donc qu’il n’est pas désiré. Cette formulation française naturelle restitue clairement l’idée sans lui ajouter de portée doctrinale.
