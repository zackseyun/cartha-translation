  text: זָנַח֙ עֶגְלֵ֣/ךְ שֹֽׁמְר֔וֹן חָרָ֥ה אַפִּ֖/י בָּ֑/ם עַד מָתַ֕י לֹ֥א יוּכְל֖וּ נִקָּיֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
translation:
  language: fr
  text: Il a rejeté ton veau[a], Samarie ! Ma colère s’enflamme contre eux. Jusqu’à quand seront-ils incapables d’être purs[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ton veau t’a rejetée, Samarie. » La syntaxe hébraïque permet de comprendre « ton veau » comme sujet du verbe, tandis que le texte principal prend Dieu comme sujet implicite.'
    reason: alternative_reading
  - marker: b
    text: Ou « innocents ». Le terme hébreu peut évoquer la pureté, l’innocence ou la propreté, avec des connotations à la fois morales et cultuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: a rejeté
  rationale: Le verbe exprime le rejet ou la répudiation. « A rejeté » est naturel et conserve la force de la dénonciation prophétique.
- source_word: עֶגְלֵךְ
  choice: ton veau
  rationale: Le nom signifie littéralement « veau ». Le contexte indique une image idolâtrique, mais le texte principal conserve l’expression concrète sans explicitation interprétative.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Le nom fonctionne comme une apostrophe. En français, la ponctuation suffit à rendre cette adresse directe sans recourir à l’archaïsant « ô ».
- source_word: חָרָה אַפִּי
  choice: Ma colère s’enflamme
  rationale: Cette formulation française naturelle préserve l’image hébraïque d’une colère qui brûle.
- source_word: בם
  choice: contre eux
  rationale: Avec l’expression de la colère, la préposition indique ici sa cible. Le pluriel renvoie vraisemblablement aux personnes liées à l’idolâtrie.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Équivalent idiomatique direct de la question temporelle hébraïque.
- source_word: לֹא יוּכְלוּ
  choice: seront-ils incapables de
  rationale: Le tour rend l’incapacité persistante exprimée par le verbe dans cette question rhétorique, sans transformer celle-ci en simple refus volontaire.
- source_word: נִקָּיוֹן
  choice: pureté
  rationale: Le substantif peut évoquer l’innocence, la pureté ou l’état de propreté. « Pureté » maintient ici la possible convergence des dimensions morale et cultuelle.
theological_decisions:
- issue: Sujet du verbe initial זָנַח
  choice: 'Dieu comme sujet implicite : « Il a rejeté ton veau »'
  alternative: 'Le veau comme sujet : « Ton veau t’a rejetée, Samarie »'
  rationale: La syntaxe hébraïque permet les deux analyses. Le discours divin et la proposition suivante, « Ma colère s’enflamme », favorisent Dieu comme sujet implicite, mais l’autre lecture demeure authentiquement possible et est signalée en note.
- issue: Portée de נִקָּיוֹן
  choice: pureté
  alternative: innocence
  rationale: Le terme peut désigner l’absence de culpabilité comme la pureté ou la propreté. « Pureté » préserve mieux l’entrelacement possible des connotations morales et cultuelles, tandis que « innocence » reste une traduction recevable.
translation_notes:
  register: Français international moderne, digne et direct. L’apostrophe « Samarie ! » évite le « ô » littéraire. La métaphore de la colère ardente est conservée, ainsi que la question finale volontairement difficile et accusatrice.
