source:
  edition: WLC
  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
translation:
  language: fr
  text: Porte la trompette à tes lèvres ! Comme un aigle[a] au-dessus de la maison de Yahweh[d] ! Car ils ont violé mon alliance[b] et se sont révoltés contre ma loi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vautour ». Le mot hébreu peut désigner plus largement un grand rapace.
    reason: lexical_alternative
  - marker: b
    text: Ou « ont rompu mon alliance ». Le verbe hébreu signifie littéralement « passer au-delà de » et, dans ce contexte, « transgresser » ou « violer ».
    reason: lexical_alternative
  - marker: c
    text: Ou « mon instruction » ou « mon enseignement ». Le mot hébreu תּוֹרָה peut avoir ces différents sens.
    reason: lexical_alternative
  - marker: d
    text: L’expression « maison de Yahweh » peut désigner le sanctuaire, mais aussi plus largement le peuple ou le domaine appartenant à Yahweh.
    reason: referential_ambiguity
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  choice: Porte la trompette à ta bouche !
  rationale: L’hébreu, abrupt et sans verbe, signifie littéralement « à ton palais, une trompette ». L’impératif explicite naturellement l’appel à sonner l’alarme, tandis que « bouche » conserve l’image concrète.
- source_word: כַּנֶּשֶׁר
  choice: Tel un aigle
  rationale: נֶשֶׁר désigne un grand rapace et est traditionnellement rendu par « aigle ». « Tel » préserve la comparaison concise et menaçante ; l’identification possible comme vautour est signalée en note.
- source_word: עַל בֵּית יְהוָה
  choice: sur la maison de Yahweh
  rationale: « Sur » conserve la valeur spatiale de עַל ainsi que la construction elliptique du texte, sans exclure la nuance hostile « contre ». « Maison » maintient l’ambiguïté entre sanctuaire, territoire et peuple appartenant à Yahweh.
- source_word: עָבְרוּ בְרִיתִי
  choice: ils ont violé mon alliance
  rationale: Dans un contexte d’alliance, עָבַר exprime idiomatiquement la transgression. « Violé mon alliance » est naturel en français et conserve l’idée d’une infraction grave sans imposer la nuance plus définitive de « rompu ».
- source_word: תּוֹרָתִי
  choice: ma loi
  rationale: תּוֹרָה peut désigner la loi, l’instruction ou l’enseignement. Ici, le cadre de violation de l’alliance favorise « loi », tandis que la portée plus large du mot est conservée en note.
- source_word: פָּשָׁעוּ
  choice: se sont révoltés contre
  rationale: פָּשַׁע désigne une rébellion ou une transgression délibérée. « Se sont révoltés contre » rend la défiance volontaire et relationnelle du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Référent de « la maison de Yahweh »
  choice: Conserver l’expression littérale sans préciser son référent
  alternative: Le temple de Yahweh ; le peuple ou la famille de Yahweh
  rationale: Dans ce contexte prophétique, l’expression peut évoquer le sanctuaire, mais aussi Israël comme maison appartenant à Yahweh. La formulation littérale préserve cette tension.
- issue: Valeur de תּוֹרָה
  choice: ma loi
  alternative: mon instruction ; mon enseignement
  rationale: Le parallélisme avec la violation de l’alliance donne ici une force juridique au terme, sans annuler son sens plus large d’instruction, indiqué en note.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération conserve le nom d’alliance employé directement dans le texte source.
translation_notes:
  register: Français international moderne, sobre et prophétique. Les deux exclamations brèves conservent l’urgence et l’ellipse de l’hébreu. « Se sont révoltés » exprime une défiance volontaire plutôt qu’une faute accidentelle.
