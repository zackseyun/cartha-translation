  text: זָנַ֥ח יִשְׂרָאֵ֖ל ט֑וֹב אוֹיֵ֖ב יִרְדְּֽפ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
translation:
  language: fr
  text: Israël a rejeté ce qui est bon[a] ; un ennemi le poursuivra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bien ».
    reason: L’hébreu emploie substantivement le mot « bon » ; « le bien » en est une traduction plus littérale.
lexical_decisions:
- source_word: זָנַח
  choice: a rejeté
  rationale: Le verbe exprime l’action de rejeter ou de repousser. « A rejeté » est naturel en français moderne et conserve l’idée d’une répudiation délibérée.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre désignant ici la nation personnifiée ; la forme française consacrée convient.
- source_word: טוֹב
  choice: ce qui est bon
  rationale: L’adjectif est employé substantivement. « Ce qui est bon » rend naturellement en français sa portée générale, morale et religieuse, sans la réduire à un bien particulier.
- source_word: אוֹיֵב
  choice: un ennemi
  rationale: Le nom singulier sans article a ici une valeur indéfinie ou générique. « Un ennemi » évite d’identifier plus précisément l’adversaire que ne le fait l’hébreu.
- source_word: יִרְדְּפוֹ
  choice: le poursuivra
  rationale: L’imparfait hébreu exprime naturellement une conséquence future dans ce contexte prophétique. Le pronom masculin singulier maintient la personnification d’Israël comme entité nationale singulière.
theological_decisions:
- issue: Référent et nombre du suffixe pronominal dans יִרְדְּפוֹ
  choice: '« le poursuivra » : Israël est traité comme une nation personnifiée au singulier.'
  alternative: « les poursuivra », selon le sens collectif d’Israël.
  rationale: Le suffixe hébreu est à la troisième personne du masculin singulier. Le français « le » préserve cette forme grammaticale et la personnification prophétique sans la lisser en un collectif pluriel.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase brève et le point-virgule conservent le parallélisme serré de l’hébreu. Le pronom « le » reprend Israël comme nation personnifiée.
