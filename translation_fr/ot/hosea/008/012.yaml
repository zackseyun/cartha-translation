  text: אכתוב ל֔/וֹ רבו תּֽוֹרָתִ֑/י כְּמוֹ זָ֖ר נֶחְשָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/012.yaml
  text: Though I wrote for him the many things of my law[a], they were regarded as something foreign.
translation:
  language: fr
  text: J’ai beau avoir écrit pour lui les innombrables préceptes de ma loi[a], ils ont été considérés comme étrangers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Quand bien même j’écrirais pour lui des myriades de mes instructions, elles seraient considérées comme étrangères. » Le premier verbe hébreu peut avoir une valeur inaccomplie ou hypothétique, et « ma loi » peut aussi se traduire par « mon instruction » ou « ma Torah ».'
    reason: Alternative lexicale et aspectuelle
lexical_decisions:
- source_word: אכתוב
  choice: J’ai beau avoir écrit
  rationale: 'Le qatal attendu n’est pas employé : אכתוב est un inaccompli qal à la 1re personne du singulier. Dans ce contexte, il peut évoquer de manière rhétorique l’instruction déjà donnée. La tournure concessive « J’ai beau avoir écrit » rend naturellement le contraste avec son rejet, sans exclure l’autre lecture modale signalée en note.'
- source_word: לוֹ
  choice: pour lui
  rationale: La préposition ל avec suffixe masculin singulier a ici une valeur bénéficiaire. Le pronom singulier représente collectivement Israël ou Éphraïm.
- source_word: רבו
  choice: les innombrables prescriptions
  rationale: Le terme exprime une très grande quantité, éventuellement des « myriades ». « Innombrables » transmet cette abondance en français naturel, tandis que « prescriptions » fournit un complément idiomatique à « ma loi » sans réduire la Torah à une notion abstraite.
- source_word: תּוֹרָתִי
  choice: de ma loi
  rationale: תּוֹרָה désigne l’enseignement ou l’instruction, avec ici une forte portée d’alliance. « Ma loi » est clair et reconnu en français biblique moderne ; « mes instructions » est conservé en note comme autre rendu possible.
- source_word: כְּמוֹ זָר
  choice: comme étrangères
  rationale: La comparaison indique que les prescriptions divines ont été traitées comme étrangères, c’est-à-dire comme ne concernant pas Israël ou ne lui appartenant pas.
- source_word: נֶחְשָׁבוּ
  choice: elles ont été considérées
  rationale: Le nifal accompli pluriel de חשב exprime ici une appréciation passive. Ce rendu garde le pluriel et la valeur évaluative du verbe.
theological_decisions:
- issue: Référent du pronom singulier לוֹ
  choice: Le masculin singulier renvoie collectivement à Israël ou à Éphraïm.
  alternative: Comprendre « lui » comme un individu non précisé.
  rationale: Osée personnifie fréquemment la nation au singulier. Le texte français maintient le pronom du texte hébreu sans expliciter davantage son référent.
- issue: Valeur temporelle ou modale de אכתוב et de la proposition finale
  choice: 'Lecture concessive liée au don passé de la loi : « J’ai beau avoir écrit… elles ont été considérées ».'
  alternative: 'Lecture hypothétique : « Quand bien même j’écrirais… elles seraient considérées ».'
  rationale: L’inaccompli hébreu permet les deux nuances. Le contexte appuie bien l’évocation de l’instruction déjà donnée, mais l’ambiguïté réelle est préservée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. « J’ai beau » exprime clairement la concession ; « innombrables prescriptions » communique l’abondance sans employer le peu courant « myriades » dans le corps du verset. L’accord féminin pluriel rattache sans ambiguïté la dernière proposition aux prescriptions.
