  naturalness: Le français est globalement clair et de registre moderne. « Sans que je le sache » est plus naturel ici que « je ne les ai pas reconnus » et suit plus étroitement le parallélisme de l’original.
  terminology: « Établi des rois », « chefs », « idoles » et « retranchés » conviennent. « Par moi » rend directement מִמֶּנִּי sans ajouter l’idée, possible mais non exprimée, d’un mandat ou d’une approbation.
