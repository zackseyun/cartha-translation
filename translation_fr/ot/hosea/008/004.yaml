  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: fr
  text: Ils ont établi des rois, mais pas par moi ; ils ont nommé des chefs, sans que je le sache. Avec leur argent et leur or, ils se sont fabriqué des idoles, afin d’être retranchés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte un verbe au singulier : « afin qu’il soit retranché ». Son sujet n’est pas exprimé ; le français emploie le pluriel en fonction du contexte, sans trancher le référent précis.'
    reason: Le singulier de יִכָּרֵת et son référent implicite sont conservés comme une ambiguïté textuelle.
lexical_decisions:
- source_word: הִמְלִיכוּ
  choice: ont établi des rois
  rationale: Le hiphil de מלך exprime ici l’action d’instituer ou d’établir des rois, plutôt que simplement de les « faire ».
- source_word: מִמֶּנִּי
  choice: de ma part
  rationale: Cette formulation conserve le sens littéral « de moi » tout en exprimant naturellement en français que ces royautés ne procédaient pas de Dieu.
- source_word: הֵשִׂירוּ
  choice: ont nommé des chefs
  rationale: Le verbe désigne ici l’établissement de dirigeants ou de princes. « Chefs » est actuel et suffisamment large.
- source_word: יָדָעְתִּי
  choice: je ne les ai pas reconnus
  rationale: Dans ce contexte, « connaître » comporte vraisemblablement l’idée de reconnaître ou d’agréer. Cette traduction évite de suggérer une simple ignorance factuelle, tout en gardant le langage relationnel du verbe.
- source_word: עֲצַבִּים
  choice: idoles
  rationale: Terme courant et précis pour les représentations cultuelles condamnées dans le passage.
- source_word: יִכָּרֵת
  choice: être retranchés
  rationale: Le niphal de כרת signifie être coupé, retranché ou supprimé. « Retranchés » préserve la force judiciaire du terme.
theological_decisions:
- issue: Sens de « je ne connaissais pas » appliqué aux dirigeants
  choice: je ne les ai pas reconnus
  alternative: je n’en savais rien
  rationale: Le choix principal rend la non-reconnaissance ou la non-approbation divine sans transformer le verset en affirmation d’une ignorance factuelle de Dieu.
- issue: Référent implicite du singulier יִכָּרֵת
  choice: afin d’être retranchés, avec une note signalant le singulier hébreu
  alternative: afin qu’Israël soit retranché
  rationale: Le contexte vise les responsables et le peuple, mais l’hébreu emploie un singulier dont le sujet reste implicite. Le texte français demeure intelligible sans imposer explicitement « Israël » comme antécédent.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme des deux premières propositions est conservé, ainsi que la progression entre pouvoir politique illégitime et idolâtrie.
