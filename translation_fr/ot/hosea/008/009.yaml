revisions:
- from: Car eux, ils sont montés en Assyrie, tel un âne sauvage qui vit solitaire[a] ; Éphraïm s’est acheté des amants.[b]
  to: Car ils sont montés vers l’Assyrie, comme un âne sauvage, seul à part[a] ; Éphraïm s’est acheté des amants[b].
  rationale: La révision retire l’ajout verbal « vit », améliore la tournure française du déplacement vers l’Assyrie et allège une emphase française trop marquée. Elle maintient la comparaison, l’intensité de l’isolement, l’idée d’un paiement et la métaphore des amants. Les ancres de notes restent placées sur les expressions qu’elles expliquent.
