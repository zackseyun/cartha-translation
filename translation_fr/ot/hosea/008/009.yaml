review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement le lien causal, l’image de l’âne sauvage et la métaphore des « amants ». Toutefois, « qui vit solitaire » ajoute l’idée de « vivre » et affaiblit la concision descriptive de בּוֹדֵד לוֹ. « Sont montés en Assyrie » est compréhensible mais peu naturel en français moderne pour un déplacement vers un pays; « sont montés vers l’Assyrie » conserve le mouvement ascendant de l’hébreu avec une construction plus idiomatique.
  naturalness: La reprise « eux, ils » est possible mais lourde dans un registre biblique moderne. « Car ils » est fluide; l’emphase explicite du pronom hébreu n’a pas besoin d’être reproduite par une dislocation française. « Comme un âne sauvage, seul à part » rend de façon concise l’isolement intensifié, sans introduire un verbe absent du texte.
  terminology: « Éphraïm » et « âne sauvage » sont appropriés. « S’est acheté des amants » garde l’idée d’acquisition contre paiement et la métaphore conjugale; cette formulation peut être conservée. La note sur les amants explique le référent politique sans le substituer à l’image du texte.
  issues:
