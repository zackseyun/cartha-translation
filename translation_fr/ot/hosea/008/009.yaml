  text: כִּֽי הֵ֨מָּה֙ עָל֣וּ אַשּׁ֔וּר פֶּ֖רֶא בּוֹדֵ֣ד ל֑/וֹ אֶפְרַ֖יִם הִתְנ֥וּ אֲהָבִֽים־
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
translation:
  language: fr
  text: Car ils sont montés vers l’Assyrie, comme un âne sauvage, seul à part[a] ; Éphraïm s’est acheté des amants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu juxtapose littéralement « un âne sauvage, solitaire pour lui-même », sans mot correspondant explicitement à « comme ».
    reason: ambiguïté syntaxique
  - marker: b
    text: « Amants » conserve la métaphore de l’infidélité à l’alliance chez Osée ; dans ce contexte, elle évoque les puissances étrangères dont Éphraïm recherche l’appui.
    reason: portée de la métaphore
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’accusation précédente et conserve le lien causal.
- source_word: הֵמָּה
  choice: eux, ils
  rationale: Rend l’insistance du pronom hébreu explicite tout en restant idiomatique en français.
- source_word: עָלוּ אַשּׁוּר
  choice: sont montés en Assyrie
  rationale: Conserve le sens concret de « monter » et emploie la tournure française naturelle avec le nom du pays.
- source_word: פֶּרֶא
  choice: âne sauvage
  rationale: Désigne l’âne non domestiqué et préserve l’image animale du texte.
- source_word: בּוֹדֵד לוֹ
  choice: qui vit solitaire
  rationale: Exprime l’isolement renforcé par le pronom לוֹ sans surcharger la phrase française.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Forme française usuelle du nom tribal et national.
- source_word: הִתְנוּ אֲהָבִים
  choice: s’est acheté des amants
  rationale: Rend l’idée de se procurer par paiement et maintient la métaphore relationnelle et sexuelle d’Osée dans un français naturel.
theological_decisions:
- issue: Description métaphorique des alliances étrangères
  choice: Conserver « amants » et l’idée d’un paiement.
  alternative: Éphraïm s’est procuré des alliés.
  rationale: Le langage des amants maintient le thème de l’infidélité à l’alliance propre à Osée, tandis que le contexte assyrien permet de reconnaître l’allusion politique sans remplacer la métaphore par son interprétation.
- issue: Rapport syntaxique de l’image de l’âne sauvage
  choice: Rendre l’image comme une comparaison introduite par « tel ».
  alternative: Lire « âne sauvage qui vit solitaire » comme une apposition sans marque comparative explicite.
  rationale: L’hébreu juxtapose les éléments sans particule comparative. « Tel » donne une phrase française intelligible tout en conservant l’image, et la note signale la construction plus abrupte de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « eux, ils » rend l’emphase hébraïque ; « tel » clarifie la juxtaposition poétique sans effacer l’ambiguïté, explicitée en note.
