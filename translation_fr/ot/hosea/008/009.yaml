    issue: Ajout interprétatif dans « qui vit solitaire »
    rationale: Le syntagme בּוֹדֵד לוֹ décrit l’âne comme isolé/solitaire; il ne contient pas de verbe correspondant à « vit ». Une formulation nominale préserve mieux la densité poétique et l’ambiguïté syntaxique.
  - severity: low
    issue: Tournure « sont montés en Assyrie » peu idiomatique
    rationale: En français, « monter vers l’Assyrie » exprime plus naturellement le déplacement tout en conservant le sens littéral de עלוּ.
  - severity: low
    issue: Dislocation emphatique « eux, ils » lourde
    rationale: Elle est grammaticalement possible, mais alourdit inutilement le verset. Le pronom sujet français suffit ici sans perte significative de l’emphase hébraïque.
