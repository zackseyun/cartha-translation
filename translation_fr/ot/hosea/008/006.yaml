source:
  edition: WLC
  text: כִּ֤י מִ/יִּשְׂרָאֵל֙ וְ/ה֔וּא חָרָ֣שׁ עָשָׂ֔/הוּ וְ/לֹ֥א אֱלֹהִ֖ים ה֑וּא כִּֽי שְׁבָבִ֣ים יִֽהְיֶ֔ה עֵ֖גֶל שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
translation:
  language: fr
  text: 'Car il est issu d’Israël : un artisan l’a fabriqué, et il n’est pas Dieu[a]. En effet, le veau de Samarie sera réduit en morceaux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce n’est pas un dieu ». L’hébreu dit littéralement : « et il n’est pas Dieu », niant que l’idole soit véritablement divine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « deviendra des fragments » ou « sera mis en pièces ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Au début du verset, la conjonction introduit la raison de la dénonciation précédente.
- source_word: מִיִּשְׂרָאֵל
  choice: il vient d’Israël
  rationale: 'La préposition מִן exprime ici l’origine : l’idole est issue d’Israël lui-même.'
- source_word: חָרָשׁ עָשָׂהוּ
  choice: un artisan l’a fabriqué
  rationale: חָרָשׁ désigne un artisan qualifié sans préciser nécessairement son matériau, et עשה exprime simplement la fabrication.
- source_word: וְלֹא אֱלֹהִים הוּא
  choice: et il n’est pas Dieu
  rationale: Cette formulation conserve la négation directe de l’hébreu et son contraste entre fabrication humaine et véritable divinité.
- source_word: כִּי
  choice: Oui
  rationale: La seconde occurrence a une valeur d’affirmation ou d’insistance qui introduit l’annonce du jugement.
- source_word: שְׁבָבִים יִהְיֶה
  choice: sera réduit en morceaux
  rationale: Le substantif rare שְׁבָבִים évoque des fragments ou éclats; la tournure française exprime naturellement la destruction qui produit ce résultat.
- source_word: עֵגֶל שֹׁמְרוֹן
  choice: le veau de Samarie
  rationale: La construction nominale associe le veau idolâtre à Samarie, capitale du royaume du Nord.
theological_decisions:
- issue: Portée de la négation « il n’est pas Dieu »
  choice: La proposition nie que le veau soit véritablement Dieu.
  alternative: « ce n’est pas un dieu » ou « il n’est pas un dieu »
  rationale: Le texte hébreu formule directement la négation avec אֱלֹהִים. La traduction retenue préserve cette force polémique sans développer une catégorie métaphysique étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le pronom masculin « il » reprend naturellement « le veau » sous-entendu par le contexte. Les deux-points rendent explicite le lien avec la fabrication humaine sans ajouter d’idée au texte.
