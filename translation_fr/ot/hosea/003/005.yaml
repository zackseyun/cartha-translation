source:
  edition: WLC
  text: אַחַ֗ר יָשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בִקְשׁוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וְ/אֵ֖ת דָּוִ֣ד מַלְכָּ֑/ם וּ/פָחֲד֧וּ אֶל יְהוָ֛ה וְ/אֶל טוּב֖/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
translation:
  language: fr
  text: Après cela, les enfants d’Israël reviendront et chercheront Yahweh, leur Dieu, ainsi que David, leur roi.[a] Ils viendront en tremblant vers Yahweh et vers sa bonté[b], dans les temps à venir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « David, leur roi » peut désigner David comme figure royale représentative ou un futur roi de sa lignée ; l’hébreu ne précise pas davantage.
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « ils craindront Yahweh et sa bonté ». Le verbe hébreu peut exprimer la crainte ou, avec cette construction, une approche tremblante.'
    reason: lexical_alternative
  - marker: c
    text: L’expression prophétique peut aussi se traduire par « dans les derniers jours » ou « dans les jours à venir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר
  choice: Après cela
  rationale: Marque naturellement la séquence qui suit la période de privation décrite aux versets précédents.
- source_word: יָשֻׁבוּ
  choice: reviendront
  rationale: Préserve le sens premier de « revenir / retourner » ainsi que sa possible portée d’un retour à l’alliance, sans expliciter indûment la repentance.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les enfants d’Israël
  rationale: Conserve l’expression familiale et identitaire de l’hébreu dans une formulation française traditionnelle et compréhensible.
- source_word: וּבִקְשׁוּ
  choice: chercheront
  rationale: Exprime la recherche résolue de Dieu et du roi sans ajouter l’idée plus spécifique de consultation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Reproduit simplement le syntagme avec suffixe possessif et sa portée relationnelle.
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: ainsi que David, leur roi
  rationale: Rend le second objet du verbe « chercher » et conserve le nom de David sans déterminer s’il désigne David lui-même ou un roi davidique futur.
- source_word: וּפָחֲדוּ אֶל
  choice: Ils viendront en tremblant vers
  rationale: Avec la préposition directionnelle אֶל, le verbe peut évoquer une approche tremblante. Cette formulation garde à la fois le mouvement et la crainte révérencielle.
- source_word: וְאֶל טוּבוֹ
  choice: et vers sa bonté
  rationale: Préserve le parallélisme directionnel et laisse טוּב évoquer aussi bien la bonté de Dieu que ses bienfaits.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans les temps à venir
  rationale: Formulation française naturelle qui garde l’orientation prophétique de l’expression sans imposer un schéma eschatologique précis.
theological_decisions:
- issue: Identité de « David, leur roi »
  choice: Maintenir « David, leur roi » sans développement interprétatif.
  alternative: « un futur roi de la lignée de David » ou une référence au David historique
  rationale: Le texte hébreu nomme directement David, mais n’explicite pas ici la manière dont cette figure royale doit être comprise. La traduction conserve donc l’ambiguïté prophétique.
- issue: Valeur de פחדו אל יהוה ואל טובו
  choice: « Ils viendront en tremblant vers Yahweh et vers sa bonté »
  alternative: « Ils craindront Yahweh et sa bonté »
  rationale: La construction avec אֶל peut exprimer une approche tremblante vers Dieu. La traduction retient le mouvement et la crainte révérencielle sans faire de la bonté divine un simple objet de terreur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, tandis que « dans les temps à venir » évite une tournure inutilement archaïque. Les virgules autour des appositions clarifient les relations sans modifier le sens.
