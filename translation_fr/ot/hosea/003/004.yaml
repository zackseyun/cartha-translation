source:
  edition: WLC
  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
translation:
  language: fr
  text: Car pendant de nombreux jours, les Israélites resteront sans roi ni chef, sans sacrifice ni pierre dressée[a], sans éphod[b] ni idoles domestiques[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « stèle » ou « colonne sacrée » : le terme hébreu désigne un monument de pierre érigé à usage cultuel.'
    reason: lexical_alternative
  - marker: b
    text: L’« éphod » est un objet cultuel dont le nom hébreu désigne souvent un vêtement sacerdotal, ou parfois un objet rituel qui lui est associé.
    reason: cultural_note
  - marker: c
    text: 'Ou « téraphim » : objets ou idoles liés au culte domestique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du signe prophétique donné dans le contexte. « Car » restitue naturellement cette valeur explicative sans la renforcer en affirmation solennelle.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Conserve l’image temporelle de l’hébreu et son caractère indéterminé, tout en étant naturel en français.
- source_word: יֵשְׁבוּ
  choice: resteront
  rationale: Dans ce contexte, ישב décrit la persistance dans une situation plutôt que l’action littérale de s’asseoir ou le simple fait d’habiter.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent collectif courant, clair et inclusif de l’expression hébraïque littérale « les fils d’Israël ».
- source_word: אֵין מֶלֶךְ
  choice: sans roi
  rationale: « Sans » rend avec concision la privation exprimée par אֵין et permet de conserver le rythme de l’énumération.
- source_word: שָׂר
  choice: chef
  rationale: שׂר désigne un dirigeant ou un haut responsable. « Chef » convient à l’association avec le roi sans imposer le sens dynastique que « prince » peut suggérer en français moderne.
- source_word: זֶבַח
  choice: sacrifice
  rationale: Équivalent courant d’un sacrifice impliquant normalement l’immolation d’un animal.
- source_word: מַצֵּבָה
  choice: pierre dressée
  rationale: Désigne ici un monument de pierre érigé à usage cultuel. Cette formulation est plus précise que « stèle » ou « colonne », tandis qu’une note explicite sa fonction.
- source_word: אֵפוֹד
  choice: éphod
  rationale: La translittération conserve un terme cultuel dont la forme ou la fonction exacte varie selon les contextes bibliques; une note apporte l’éclairage nécessaire.
- source_word: תְרָפִים
  choice: idoles domestiques
  rationale: Rend de façon accessible ces objets cultuels associés à la maisonnée, sans laisser dans le texte principal le terme opaque « téraphim ».
theological_decisions:
- issue: La liste réunit-elle des institutions cultuelles légitimes et illégitimes ?
  choice: 'Traduire chaque élément sans harmoniser la liste : Israël sera privé à la fois de direction politique et de tout son appareillage cultuel.'
  alternative: Présenter toute la liste soit comme relevant exclusivement du culte légitime, soit comme relevant exclusivement du culte illégitime.
  rationale: Le sacrifice et l’éphod peuvent être associés au culte reconnu, tandis que la pierre dressée et les téraphim sont souvent associés à des pratiques condamnées. La traduction préserve cette tension du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétée avec « sans » garde le rythme de privation de l’hébreu. « Les Israélites » est préféré au calque « les fils d’Israël », peu naturel ici; « chef » évite la connotation principalement dynastique de « prince » en français contemporain.
