source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/הָ יָמִ֤ים רַבִּים֙ תֵּ֣שְׁבִי לִ֔/י לֹ֣א תִזְנִ֔י וְ/לֹ֥א תִֽהְיִ֖י לְ/אִ֑ישׁ וְ/גַם אֲנִ֖י אֵלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: fr
  text: 'Je lui dis : « Tu resteras longtemps pour moi. Tu ne te prostitueras pas et tu ne seras à aucun homme ; moi aussi, je serai envers toi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « et moi aussi envers toi » ; la formulation est elliptique et son sens précis demeure ouvert.'
    reason: Signaler l’ellipse inhabituelle de l’original et préserver son ambiguïté authentique.
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: longtemps
  rationale: Expression idiomatique française naturelle pour « de nombreux jours », sans modifier l’idée d’une longue période.
- source_word: תֵּשְׁבִי לִי
  choice: tu resteras longtemps pour moi
  rationale: Le verbe ישׁב exprime ici le fait de demeurer ou rester, tandis que לִי conserve la relation « pour moi ».
- source_word: לֹא תִזְנִי
  choice: tu ne te prostitueras pas
  rationale: Rend directement le verbe זנה, qui désigne ici la prostitution ou l’inconduite sexuelle.
- source_word: וְלֹא תִהְיִי לְאִישׁ
  choice: tu ne seras à aucun homme
  rationale: Reproduit l’expression relationnelle volontairement sobre « être à/pour un homme », sans préciser davantage la nature de l’union.
- source_word: וְגַם אֲנִי אֵלָיִךְ
  choice: moi aussi, je serai envers toi
  rationale: La proposition hébraïque est elliptique, le verbe « être » étant sous-entendu. « Envers toi » préserve son caractère relationnel et son ambiguïté.
theological_decisions:
- issue: Nature de l’engagement final d’Osée envers la femme
  choice: je serai envers toi
  alternative: je t’attendrai / je serai fidèle à toi / je ne m’unirai pas à toi
  rationale: L’hébreu dit littéralement « et moi aussi envers toi », sans expliciter le verbe ni la portée exacte de l’engagement. La traduction conserve cette tension au lieu d’imposer une interprétation conjugale ou sexuelle.
translation_notes:
  register: Français moderne, digne et direct. Le futur traduit ici la consigne ferme donnée à la femme. La tournure finale, volontairement inhabituelle, reflète l’ellipse du texte hébreu.
