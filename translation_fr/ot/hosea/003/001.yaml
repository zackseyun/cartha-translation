  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
translation:
  language: fr
  text: 'Et Yahweh me dit de nouveau : « Va, aime une femme aimée d’un autre et qui commet l’adultère, comme Yahweh aime les enfants d’Israël, bien qu’ils se tournent vers d’autres dieux et aiment les galettes de raisins secs.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « galettes de raisins secs » désignent vraisemblablement des gâteaux de raisins pressés, peut-être consommés lors de fêtes ou associés à des pratiques idolâtres.
    reason: Note culturelle expliquant l’expression alimentaire ancienne et son association contextuelle possible, sans la présenter comme certaine.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et maintient sa répétition dans le verset.
- source_word: עוֹד
  choice: encore
  rationale: Dans cette séquence narrative, le terme indique naturellement que Yahweh adresse une nouvelle instruction à Osée.
- source_word: לֵךְ אֱהַב
  choice: Va, aime
  rationale: Conserve les deux impératifs et le lien lexical entre l’amour demandé à Osée et l’amour de Yahweh.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le mot peut désigner une femme ou une épouse. « Une femme » respecte ici la formulation indéfinie sans identifier explicitement Gomer ni imposer un lien matrimonial que ce verset ne précise pas à lui seul.
- source_word: אֲהֻבַת רֵעַ
  choice: aimée d’un autre
  rationale: Rend la construction passive sans préciser indûment si רֵעַ désigne un compagnon, un amant ou un mari.
- source_word: וּמְנָאָפֶת
  choice: et qui commet l’adultère
  rationale: La formulation verbale française restitue naturellement le participe décrivant une conduite adultère.
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  choice: comme Yahweh aime les enfants d’Israël
  rationale: Exprime clairement la comparaison et reproduit la répétition du verbe « aimer ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les enfants d’Israël
  rationale: Conserve l’expression nationale et généalogique de l’hébreu.
- source_word: וְהֵם פֹּנִים אֶל אֱלֹהִים אֲחֵרִים
  choice: bien qu’ils se tournent vers d’autres dieux
  rationale: « Bien que » explicite en français le contraste implicite entre l’amour de Yahweh et l’infidélité d’Israël; le présent rend l’action caractéristique exprimée par le participe.
- source_word: וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים
  choice: et aiment les gâteaux de raisins secs
  rationale: Préserve la répétition du vocabulaire de l’amour et rend l’expression alimentaire de manière compréhensible en français moderne.
theological_decisions:
- issue: Identité de la femme dans le geste prophétique d’Osée
  choice: La désigner simplement comme « une femme ».
  alternative: Traduire « ta femme » ou l’identifier explicitement à Gomer.
  rationale: Le verset ne nomme pas Gomer et ne dit pas « ta femme ». La traduction conserve donc l’indétermination du texte et ne tranche pas entre les lectures possibles.
- issue: Identité de רֵעַ et nature exacte de sa relation avec la femme
  choice: Traduire « un autre ».
  alternative: Préciser « son mari », « un compagnon » ou « un amant ».
  rationale: Le terme permet plusieurs nuances relationnelles. La formulation retenue préserve l’ambiguïté sans bâtir une interprétation théologique sur une identification incertaine.
- issue: Rapport entre l’amour de Yahweh et l’apostasie d’Israël
  choice: Employer la concession « bien qu’ils ».
  alternative: Coordonner littéralement par « et ils ».
  rationale: La concession rend en français le contraste discursif saisissant entre l’amour persistant de Yahweh et le fait qu’Israël se tourne vers d’autres dieux, sans supprimer cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu tout en étant lisible. « Qui commet l’adultère » est plus idiomatique que « adultère » comme adjectif isolé; « se tournent vers » conserve l’image d’une orientation religieuse. L’unique appel de note [a] figure bien dans le texte.
