  text: וָ/אֶכְּרֶ֣/הָ לִּ֔/י בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר כָּ֑סֶף וְ/חֹ֥מֶר שְׂעֹרִ֖ים וְ/לֵ֥תֶךְ שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/002.yaml
  text: So I bought her for myself for fifteen shekels of silver and a homer and a lethech of barley[a][b].
translation:
  language: fr
  text: Je l’ai achetée pour moi au prix de quinze sicles d’argent[b], d’un homer et d’un léthek d’orge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le léthek était probablement une mesure de capacité pour les matières sèches équivalant à la moitié d’un homer.
    reason: cultural_note
  - marker: b
    text: 'Ou : « quinze pièces d’argent ». L’hébreu dit littéralement « quinze d’argent »; l’unité monétaire est sous-entendue d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְּרֶהָ
  choice: je l’ai achetée
  rationale: Dans ce contexte de paiement, le verbe exprime l’acquisition moyennant un prix. « Achetée » est naturel et précis, tandis qu’« acquise » serait moins explicite.
- source_word: לִּי
  choice: pour moi
  rationale: Le datif marque ici l’intérêt personnel du sujet. « Pour moi » conserve cette nuance sans la lourdeur de « je me la suis achetée ».
- source_word: בַּחֲמִשָּׁה עָשָׂר כָּסֶף
  choice: pour quinze sicles d’argent
  rationale: L’hébreu dit littéralement « pour quinze d’argent », l’unité monétaire étant sous-entendue. « Sicles d’argent » explicite sobrement cette unité probable; l’autre lecture est signalée en note.
- source_word: חֹמֶר
  choice: un homer
  rationale: Le nom de cette ancienne mesure de capacité est translittéré afin d’éviter une conversion moderne nécessairement approximative.
- source_word: שְׂעֹרִים
  choice: d’orge
  rationale: Traduction directe du nom de la céréale. Sa position après les deux mesures permet naturellement de comprendre qu’elle se rapporte au homer comme au létek.
- source_word: לֵתֶךְ
  choice: un létek
  rationale: Cette mesure ancienne est conservée par translittération. Son équivalence probable avec un demi-homer est donnée en note sans être imposée dans le texte.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le passé composé convient à une narration accessible. Les unités anciennes sont conservées par translittération, et la construction « un homer et un létek d’orge » évite une répétition tout en laissant « d’orge » porter sur les deux mesures.
