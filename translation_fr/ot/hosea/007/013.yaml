  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
translation:
  language: fr
  text: Malheur à eux, car ils se sont éloignés de moi ! La dévastation est leur lot, car ils se sont révoltés contre moi. Moi, je voudrais les racheter[a], mais eux, ils profèrent des mensonges contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourtant, je veux les racheter » ; certains comprennent le verbe au passé : « Mais moi, je les ai rachetés. »'
    reason: Lecture alternative de la valeur temporelle ou modale de l’imparfait hébreu אֶפְדֵּם.
lexical_decisions:
- source_word: א֤וֹי
  choice: Malheur
  rationale: Cette interjection exprime à la fois la lamentation et l’annonce du jugement; « Malheur » conserve le ton prophétique.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: ils se sont éloignés de moi
  rationale: נדד évoque le fait de s’éloigner, d’errer ou de fuir. Cette formulation naturelle préserve l’idée de rupture sans imposer celle d’une fuite délibérée.
- source_word: שֹׁד לָהֶם
  choice: La dévastation est leur lot
  rationale: שֹׁד désigne une ruine ou une dévastation, souvent violente. « Est leur lot » rend naturellement la construction nominale לָהֶם sans atténuer le jugement.
- source_word: פָשְׁעוּ בִי
  choice: ils se sont révoltés contre moi
  rationale: פשע exprime une rébellion ou une rupture de loyauté, sens plus fort qu’une simple faute.
- source_word: וְאָנֹכִי אֶפְדֵּם
  choice: Moi, je voudrais les délivrer
  rationale: L’imparfait אֶפְדֵּם peut exprimer ici une volonté ou une disposition à agir. La mise en relief de אָנֹכִי et le contraste avec וְהֵמָּה sont conservés par « Moi » et « mais eux ».
- source_word: דִּבְּרוּ עָלַי כְּזָבִים
  choice: disent des mensonges contre moi
  rationale: La formule désigne des paroles fausses dirigées contre Dieu; le présent français convient à la portée actuelle ou habituelle du parfait hébreu dans ce contexte.
theological_decisions:
- issue: Valeur de וְאָנֹכִי אֶפְדֵּם
  choice: Moi, je voudrais les délivrer
  alternative: Mais moi, je les ai délivrés
  rationale: La forme imperfective favorise une valeur non passée, exprimant ici la volonté ou la disposition divine à délivrer. La note conserve toutefois la lecture passée possible et laisse subsister la tension entre l’intention salvatrice de Dieu et les mensonges du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme prophétique, l’opposition emphatique entre « Moi » et « eux », ainsi que la tension entre jugement et volonté de délivrance sont maintenus.
