source:
  edition: WLC
  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
translation:
  language: fr
  text: Et ils ne se disent pas que je me souviens de toute leur méchanceté[a]. Maintenant, leurs agissements les entourent ; ils sont devant ma face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ne disent pas à leur cœur que je me souviens de toute leur méchanceté ». L’expression hébraïque décrit leur réflexion intérieure ; on peut aussi traduire : « se disent à eux-mêmes ».'
    reason: Elle signale l’idiome hébreu tout en fournissant une formulation française naturelle.
  - marker: b
    text: 'Ou : « devant moi ». L’hébreu dit littéralement « devant ma face », image qui souligne que leurs agissements sont pleinement exposés à la présence et au regard de Dieu.'
    reason: Elle explique l’expression anthropomorphique et indique l’alternative française plus idiomatique.
lexical_decisions:
- source_word: וּבַל
  choice: Mais ils ne
  rationale: La conjonction suivie de la négation poursuit l’accusation tout en marquant naturellement, en français, le contraste avec leur conduite inconsciente du regard de Dieu.
- source_word: יֹאמְרוּ לִלְבָבָם
  choice: se disent
  rationale: Littéralement « disent à leur cœur » ; « se disent » restitue en français courant l’idée de réflexion intérieure sans réduire l’expression au seul acte de penser.
- source_word: כָּל רָעָתָם
  choice: tout le mal qu’ils ont fait
  rationale: רָעָה désigne ici collectivement leur mal moral. L’explicitation verbale convient au contexte des agissements, tout en évitant le français peu naturel « tout leur mal ».
- source_word: זָכָרְתִּי
  choice: je me souviens
  rationale: Le parfait hébreu exprime ici une mémoire divine acquise et toujours actuelle ; le présent français rend clairement cette conscience persistante.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Le terme introduit la situation présente qui résulte de leur faute et conserve la transition nette du texte hébreu.
- source_word: סְבָבוּם
  choice: les entourent
  rationale: Le verbe dépeint leurs actes comme les encerclant ; la traduction conserve directement cette métaphore.
- source_word: מַעַלְלֵיהֶם
  choice: leurs agissements
  rationale: מַעֲלָל désigne des actes avec une forte coloration morale. « Agissements » exprime naturellement en français cette nuance défavorable.
- source_word: נֶגֶד פָּנַי
  choice: devant ma face
  rationale: Cette traduction conserve l’image concrète et anthropomorphique de la présence et du regard immédiats de Dieu.
- source_word: הָיוּ
  choice: ils sont
  rationale: 'Le parfait décrit un état présent : leurs agissements demeurent exposés devant Dieu. Le présent est le temps français le plus naturel ici.'
theological_decisions:
- issue: Expression anthropomorphique de la connaissance et du jugement divins
  choice: devant ma face
  alternative: devant moi
  rationale: Le texte hébreu emploie une image corporelle concrète pour souligner que les actes d’Israël sont directement exposés à Dieu. La conserver maintient la force prophétique sans préciser davantage la nature de Dieu.
- issue: Référent du pronom pluriel dans la dernière proposition
  choice: ils sont, renvoyant aux agissements
  alternative: elles sont, en comprenant les mauvaises actions
  rationale: Le masculin pluriel hébreu renvoie naturellement à מַעַלְלֵיהֶם, « leurs agissements ». La traduction maintient ce lien grammatical et la progression de l’image.
translation_notes:
  register: Français moderne, international et digne. « Se disent » rend l’idiome intérieur de façon naturelle ; « agissements » conserve la portée morale du terme prophétique. « Devant ma face », formulation volontairement marquée mais compréhensible, préserve l’image hébraïque et fait l’objet d’une note.
