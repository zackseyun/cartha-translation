  terminology: « Filet », « oiseaux du ciel », « assemblée » et « corrigerai » conviennent. « Corrigerai » peut exprimer la discipline/jugement de יסר sans trancher en faveur d’une punition purement rétributive. Les notes doivent présenter les autres possibilités sans les attribuer à tort à des certitudes textuelles.
