  text: כַּ/אֲשֶׁ֣ר יֵלֵ֗כוּ אֶפְר֤וֹשׂ עֲלֵי/הֶם֙ רִשְׁתִּ֔/י כְּ/ע֥וֹף הַ/שָּׁמַ֖יִם אֽוֹרִידֵ֑/ם אַיְסִרֵ֕/ם כְּ/שֵׁ֖מַע לַ/עֲדָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
translation:
  language: fr
  text: Lorsqu’ils iront, j’étendrai mon filet sur eux ; comme les oiseaux du ciel, je les ferai descendre. Je les corrigerai[a] selon la nouvelle adressée à leur assemblée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les punirai » ou « je les châtierai ». Le verbe hébreu peut désigner une correction disciplinaire aussi bien qu’un châtiment.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition hébraïque est difficile. On pourrait aussi traduire : « selon ce que leur assemblée a entendu » ou « conformément à ce qui a été annoncé à leur assemblée ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  choice: Quand ils partiront
  rationale: כַּאֲשֶׁר introduit ici une proposition temporelle, et יֵלֵכוּ exprime leur déplacement. « Partiront » convient au contexte des démarches d’Éphraïm sans préciser indûment leur destination.
- source_word: אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי
  choice: j’étendrai mon filet sur eux
  rationale: La formulation conserve l’image concrète d’un filet déployé au-dessus d’une proie.
- source_word: כְּעוֹף הַשָּׁמַיִם
  choice: comme les oiseaux du ciel
  rationale: Le singulier collectif עוֹף est rendu naturellement par le pluriel français ; « du ciel » est idiomatique et fidèle à l’image.
- source_word: אוֹרִידֵם
  choice: je les ferai descendre
  rationale: Le hifil de ירד signifie littéralement « faire descendre ». Cette traduction maintient le lien avec les oiseaux pris au filet sans ajouter « à terre », absent de l’hébreu.
- source_word: אַיְסִרֵם
  choice: Je les corrigerai
  rationale: Le hifil de יסר peut désigner une correction disciplinaire comportant une dimension judiciaire. « Corriger » conserve cette tension mieux que le seul « punir ».
- source_word: כְּשֵׁמַע לַעֲדָתָם
  choice: conformément à ce qui a été annoncé à leur assemblée
  rationale: La proposition hébraïque est difficile. Cette formulation donne à שֵׁמַע le sens de nouvelle ou annonce entendue et comprend ל comme indiquant les destinataires, tout en signalant d’autres analyses en note.
- source_word: עֲדָתָם
  choice: leur assemblée
  rationale: « Assemblée » rend עֵדָה dans un français actuel sans lui donner une coloration ecclésiale étrangère au contexte.
theological_decisions:
- issue: Nature de l’action divine exprimée par אַיְסִרֵם
  choice: Je les corrigerai
  alternative: Je les punirai ; je les châtierai
  rationale: יסר peut associer sanction et correction. Le texte principal ne réduit donc pas l’action à une peine exclusivement rétributive, tandis que la note expose les autres nuances possibles.
- issue: Sens de la proposition difficile כְּשֵׁמַע לַעֲדָתָם
  choice: conformément à ce qui a été annoncé à leur assemblée
  alternative: selon ce que leur assemblée a entendu ; conformément à la nouvelle concernant leur assemblée
  rationale: La syntaxe et le rapport exact entre שֵׁמַע, ל et עֵדָה restent incertains. Une note préserve cette ambiguïté au lieu d’imposer une seule interprétation théologique ou historique.
translation_notes:
  register: Français international moderne, digne et accessible. Les images du filet et des oiseaux sont conservées sans explicitation ajoutée. Les marqueurs de note sont placés auprès des expressions auxquelles les notes se rapportent réellement.
