source:
  edition: WLC
  text: אֶפְרַ֕יִם בָּ/עַמִּ֖ים ה֣וּא יִתְבּוֹלָ֑ל אֶפְרַ֛יִם הָיָ֥ה עֻגָ֖ה בְּלִ֥י הֲפוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/008.yaml
  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
translation:
  language: fr
  text: Éphraïm se mêle aux peuples ; Éphraïm est devenu une galette qu’on n’a pas retournée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’image est celle d’une galette qui n’a pas été retournée pendant la cuisson : brûlée d’un côté et insuffisamment cuite de l’autre.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  choice: se mêle
  rationale: La forme réfléchie exprime la participation d’Éphraïm à son propre mélange avec les peuples étrangers. « Se mêle » est naturel en français et conserve cette nuance.
- source_word: בָּעַמִּים
  choice: aux peuples
  rationale: La préposition et le pluriel désignent l’association avec les peuples environnants. « Aux peuples » s’accorde naturellement avec le verbe français « se mêler » sans réduire le sens aux États-nations modernes.
- source_word: עֻגָה
  choice: galette
  rationale: Le nom désigne un pain rond et plat cuit sur une surface chaude ou des braises. « Galette » restitue plus précisément cette réalité que « gâteau » en français moderne.
- source_word: בְּלִי הֲפוּכָה
  choice: qu’on n’a pas retournée
  rationale: Cette formulation concise décrit une galette laissée sans être retournée pendant la cuisson et préserve l’image concrète.
- source_word: הָיָה
  choice: est devenu
  rationale: Dans le contexte, l’accompli exprime l’état résultant auquel Éphraïm est arrivé ; « est devenu » rend clairement cette valeur.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé tel quel. Chez Osée, il représente souvent le royaume du Nord, mais la traduction ne remplace pas le nom par cette interprétation.
theological_decisions:
- issue: Référent d’« Éphraïm »
  choice: Conserver « Éphraïm », qui représente implicitement le royaume du Nord.
  alternative: Remplacer par « Israël » ou « le royaume du Nord ».
  rationale: Le texte prophétique emploie expressément le nom d’Éphraïm. Le conserver respecte sa portée historique et théologique sans intégrer l’interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Galette » évoque ici un pain plat, non une pâtisserie. La répétition d’« Éphraïm » et le parallélisme incisif de l’hébreu sont maintenus.
