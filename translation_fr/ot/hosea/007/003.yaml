  yaml_path: translation/ot/hosea/007/003.yaml
  text: By their evil they make the king glad[a], and by their lies the princes.
translation:
  language: fr
  text: Par leur méchanceté, ils réjouissent le roi, et par leurs mensonges, les princes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרָעָתָם
  choice: Par leur méchanceté
  rationale: La préposition בְּ a ici une valeur instrumentale. « Méchanceté » rend naturellement le mal moral collectif désigné par רָעָה.
- source_word: יְשַׂמְּחוּ
  choice: ils réjouissent
  rationale: 'Le piel de שׂמח est causatif : ils rendent joyeux le roi. « Réjouissent » exprime cette force avec concision en français.'
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Malgré l'absence d'article en hébreu, le contexte vise un roi déterminé, celui d'Israël ; l'article défini convient en français.
- source_word: וּבְכַחֲשֵׁיהֶם
  choice: et par leurs mensonges
  rationale: כַּחַשׁ peut désigner le mensonge, la fausseté ou la tromperie. Le pluriel « mensonges » est direct et respecte le parallèle avec « méchanceté ».
- source_word: שָׂרִים
  choice: les princes
  rationale: שָׂרִים désigne ici les hauts dignitaires de la cour. « Princes » conserve le cadre politique et le parallélisme avec « le roi ».
