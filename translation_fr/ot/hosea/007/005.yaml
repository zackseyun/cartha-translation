  text: י֣וֹם מַלְכֵּ֔/נוּ הֶחֱל֥וּ שָׂרִ֖ים חֲמַ֣ת מִ/יָּ֑יִן מָשַׁ֥ךְ יָד֖/וֹ אֶת לֹצְצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
translation:
  language: fr
  text: Le jour de notre roi[a], les princes se sont rendus malades par l’ardeur du vin[b] ; il a tendu la main aux moqueurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au jour de notre roi ». Certains comprennent qu’il s’agit d’un jour de fête royale, mais l’hébreu dit littéralement « jour de notre roi ».
    reason: lexical_alternative
  - marker: b
    text: « L’ardeur du vin » peut aussi se comprendre comme « la brûlure du vin » ou, moins probablement, « le poison du vin ».
    reason: lexical_alternative
  - marker: c
    text: Le geste suggère probablement qu’il s’est associé aux moqueurs ou qu’il a recherché leur compagnie.
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  choice: Au jour de notre roi
  rationale: La construction signifie littéralement « jour de notre roi ». « Au jour de » est naturel en français et n’ajoute pas l’idée possible, mais non explicite, d’une fête royale.
- source_word: הֶחֱל֥וּ
  choice: se sont rendus malades
  rationale: 'Le hifil de חלה est compris ici dans un sens causatif à valeur réfléchie : les princes se sont eux-mêmes rendus malades. Cette lecture convient au contexte d’excès de vin, tout en reconnaissant que le verbe a aussi été rapproché du sens « commencer ».'
- source_word: שָׂרִ֖ים
  choice: les princes
  rationale: שׂרים peut désigner des princes, des hauts fonctionnaires ou des chefs. « Princes » maintient le cadre de la cour et le lien immédiat avec le roi.
- source_word: חֲמַ֣ת מִיָּ֑יִן
  choice: sous l’ardeur du vin
  rationale: חמה peut évoquer la chaleur, l’ardeur, la fureur ou le venin. « L’ardeur du vin » conserve l’image forte et son ambiguïté sans introduire explicitement l’idée moins probable de poison.
- source_word: מָשַׁ֥ךְ יָד֖וֹ
  choice: il a tendu la main
  rationale: La formulation préserve l’image hébraïque d’une main étendue. Dans ce contexte, le geste suggère vraisemblablement l’accueil, l’alliance ou la fréquentation.
- source_word: אֶת לֹצְצִֽים
  choice: aux moqueurs
  rationale: לֹצְצִים désigne des moqueurs ou railleurs. Avec « tendre la main », le français demande naturellement « aux » ; le contexte permet de comprendre un geste d’association avec eux.
theological_decisions:
- issue: Identification du sujet de « il a tendu la main »
  choice: Conserver le sujet singulier sous la forme « il », avec le roi comme antécédent le plus naturel.
  alternative: Comprendre l’action de façon plus générale dans le cadre de la cour, ou la rapporter par le sens à l’ensemble des princes.
  rationale: Le verbe hébreu est au singulier et le roi est le dernier référent singulier plausible, mais le texte ne répète pas explicitement son nom. La traduction conserve donc le pronom sans lever entièrement l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le rythme de la scène de cour et l’image concrète de la main tendue. Le terme « ardeur » maintient la polysémie poétique de חמה sans paraître archaïque.
