source:
  edition: WLC
  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/לֹֽא שָׁ֨בוּ֙ אֶל יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/לֹ֥א בִקְשֻׁ֖/הוּ בְּ/כָל זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
translation:
  language: fr
  text: L’orgueil d’Israël témoigne contre lui[a], mais ils ne reviennent pas vers Yahweh, leur Dieu, et ne le cherchent pas dans tout cela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « témoigne devant lui » ou « en face de lui » ; l’hébreu dit littéralement « devant sa face ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « malgré tout cela ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  choice: témoigne
  rationale: Dans cette construction avec גְאוֹן יִשְׂרָאֵל et בְּפָנָיו, le verbe exprime le témoignage accusateur. « Témoigne » conserve la portée quasi judiciaire sans la réduire au sens plus littéral de « répond ».
- source_word: גְאוֹן יִשְׂרָאֵל
  choice: l’orgueil d’Israël
  rationale: גָּאוֹן peut désigner l’élévation, la majesté ou l’orgueil. Le contexte de réprimande favorise ici le sens négatif d’« orgueil ».
- source_word: בְּפָנָיו
  choice: contre lui
  rationale: La locution signifie littéralement « à sa face/devant lui ». Avec le verbe pris au sens de témoigner, « contre lui » rend naturellement la force accusatrice tout en maintenant le suffixe hébreu au singulier.
- source_word: שָׁבוּ אֶל
  choice: reviennent à
  rationale: שׁוּב avec אֶל exprime ici le retour vers Dieu, y compris sa dimension relationnelle et repentante, sans qu’il soit nécessaire de l’expliciter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le possessif est conservé et souligne la relation revendiquée entre Israël et son Dieu.
- source_word: בִּקְשֻׁהוּ
  choice: le cherchent
  rationale: « Chercher » garde la largeur sémantique du verbe, qui peut inclure le fait de se tourner vers Dieu et de solliciter son secours.
- source_word: בְּכָל־זֹאת
  choice: malgré tout cela
  rationale: Dans le contexte des maux déjà décrits, la locution a naturellement une valeur concessive. La traduction plus formelle « au milieu de tout cela » est signalée en note.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans בְּפָנָיו
  choice: Maintien du singulier dans « contre lui »
  alternative: Employer « contre eux » pour harmoniser avec le sujet pluriel de la suite, ou comprendre « devant lui » en référence collective à Israël
  rationale: Le suffixe hébreu est singulier et peut renvoyer au collectif « Israël ». Le conserver respecte le passage immédiat au pluriel dans la proposition suivante au lieu de régulariser le nombre.
- issue: Valeur de בְּכָל־זֹאת
  choice: 'Lecture concessive : « malgré tout cela »'
  alternative: 'Lecture circonstancielle plus formelle : « au milieu de tout cela » ou « dans tout cela »'
  rationale: Le contexte favorise la nuance concessive, mais la préposition hébraïque reste assez ouverte pour justifier la mention de l’autre lecture.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre le singulier collectif « Israël/lui » et le pluriel « ils » est volontairement préservé. Le point-virgule met en relief l’opposition marquée par וְלֹא sans alourdir la phrase.
