source:
  edition: WLC
  text: וַ/יְהִ֣י אֶפְרַ֔יִם כְּ/יוֹנָ֥ה פוֹתָ֖ה אֵ֣ין לֵ֑ב מִצְרַ֥יִם קָרָ֖אוּ אַשּׁ֥וּר הָלָֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
translation:
  language: fr
  text: 'Éphraïm est devenu comme une colombe naïve, sans discernement[a] : ils font appel à l’Égypte, ils vont en Assyrie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans cœur », expression qui signifie ici « sans intelligence » ou « sans discernement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: est devenu
  rationale: Le wayyiqtol de היה décrit ici l’entrée dans un état dont la pertinence demeure; « est devenu » le rend naturellement en français.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé, même s’il désigne par métonymie le royaume du Nord.
- source_word: כְּיוֹנָה
  choice: comme une colombe
  rationale: « Colombe » est le correspondant français courant de יוֹנָה et préserve l’image.
- source_word: פוֹתָה
  choice: naïve
  rationale: Le terme évoque la simplicité crédule et la facilité à se laisser tromper; « naïve » convient à la colombe et reste naturel.
- source_word: אֵין לֵב
  choice: sans discernement
  rationale: Littéralement « sans cœur »; לֵב désigne ici la faculté de comprendre et de juger. « Sans discernement » explicite l’idiome sans affaiblir le reproche.
- source_word: מִצְרַיִם קָרָאוּ
  choice: ils appellent l’Égypte
  rationale: קרא exprime ici un appel adressé à l’Égypte, vraisemblablement pour obtenir son aide. La construction française évite une coloration religieuse indue.
- source_word: אַשּׁוּר הָלָכוּ
  choice: ils vont vers l’Assyrie
  rationale: הלך indique un déplacement ou une démarche en direction de l’Assyrie; le présent rend la description prophétique vive.
theological_decisions:
- issue: Référent d’Éphraïm
  choice: Conserver « Éphraïm » comme entité nommée représentant implicitement le royaume du Nord.
  alternative: « Israël » ou « le royaume du Nord »
  rationale: Le texte hébreu nomme explicitement Éphraïm. Le remplacer lèverait une métonymie que le texte laisse au lecteur le soin de reconnaître.
translation_notes:
  register: Français international moderne, clair et digne. « Naïve » restitue la crédulité exprimée par פוֹתָה; les présents « appellent » et « vont » rendent la conduite décrite de manière vive. Le deux-points relie l’absence de discernement aux démarches contradictoires auprès des puissances étrangères.
