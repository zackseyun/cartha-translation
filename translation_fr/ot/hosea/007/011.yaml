    rationale: La construction peut évoquer le fait de convoquer l’Égypte. Dans le contexte diplomatique et selon la valeur de קרא, « ils font appel à l’Égypte » exprime plus clairement le recours recherché sans ajouter une interprétation confessionnelle.
  revised_text: 'Éphraïm est devenu comme une colombe naïve, sans discernement[a] : ils font appel à l’Égypte, ils vont en Assyrie.'
