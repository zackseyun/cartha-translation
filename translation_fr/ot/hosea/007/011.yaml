  terminology: « Éphraïm », « colombe », « discernement », « Égypte » et « Assyrie » conviennent. « Naïve » restitue de manière recevable la crédulité de פוֹתָה. La note sur « sans cœur » doit être ancrée à « sans discernement », qui en est l’explication, plutôt qu’à « naïve ».
