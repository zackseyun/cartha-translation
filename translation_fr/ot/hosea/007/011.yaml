  source_fidelity: 'Le sens est bien rendu : Éphraïm est comparé à une colombe crédule, dépourvue de jugement, qui se tourne à la fois vers l’Égypte et l’Assyrie. Toutefois, « ils appellent l’Égypte » est moins idiomatique et peut suggérer qu’ils la convoquent plutôt qu’ils sollicitent son aide. « Ils font appel à l’Égypte » rend naturellement קָרָאוּ dans ce contexte. « Ils vont en Assyrie » est aussi plus direct que « vont vers l’Assyrie » pour הָלָכוּ.'
