  text: וַ/אֲנִ֣י יִסַּ֔רְתִּי חִזַּ֖קְתִּי זְרֽוֹעֹתָ֑/ם וְ/אֵלַ֖/י יְחַשְּׁבוּ רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
translation:
  language: fr
  text: Moi, je les ai formés[a], j’ai fortifié leurs bras, mais eux méditent le mal contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je les ai disciplinés » ou « je les ai corrigés » ; le verbe hébreu peut désigner aussi bien une formation qu’une discipline corrective.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסַּרְתִּי
  choice: je les ai formés
  rationale: Le verbe יסר peut exprimer la formation, l’instruction ou la discipline. En parallèle avec « j’ai fortifié leurs bras », « formés » rend naturellement ici l’action qui équipe, sans exclure entièrement la nuance de discipline, signalée en note.
- source_word: חִזַּקְתִּי
  choice: j’ai fortifié
  rationale: Le piel de חזק signifie rendre fort ou fortifier. « Fortifié » conserve le lien direct avec les bras et produit une formulation française naturelle.
- source_word: זְרוֹעֹתָם
  choice: leurs bras
  rationale: Le nom désigne littéralement les bras et peut, par métonymie, évoquer la force. Garder l’image concrète respecte le texte hébreu.
- source_word: וְאֵלַי
  choice: contre moi
  rationale: La préposition signifie littéralement « vers moi », mais, avec l’expression « méditer le mal », elle indique que l’intention hostile vise Dieu. « Contre moi » exprime clairement cette relation en français.
- source_word: יְחַשְּׁבוּ רָע
  choice: ils méditent le mal
  rationale: חשב avec רע désigne une activité délibérée de pensée ou de préparation mauvaise. « Méditent le mal » préserve la portée intentionnelle et morale de l’expression sans préciser indûment la forme du projet.
- source_word: וַאֲנִי
  choice: Moi, je
  rationale: La conjonction et le pronom indépendant mettent l’action de Dieu en relief et en contraste avec celle d’Israël. Le contraste concessif ressort ensuite naturellement grâce à « mais eux ».
theological_decisions:
- issue: Nature de l’action divine exprimée par יִסַּרְתִּי
  choice: 'Action formatrice : « je les ai formés »'
  alternative: « je les ai disciplinés » ou « je les ai châtiés »
  rationale: Le parallèle immédiat, « j’ai fortifié leurs bras », favorise une action qui forme et équipe. La note conserve néanmoins la possibilité d’une discipline corrective inhérente au verbe hébreu.
translation_notes:
  register: Français moderne, international et digne. La reprise « Moi, je… mais eux… » rend l’opposition fortement marquée en hébreu. L’image concrète des bras est conservée.
