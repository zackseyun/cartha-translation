  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
translation:
  language: fr
  text: Ils sont tous brûlants comme un four et dévorent leurs juges[a] ; tous leurs rois sont tombés. Aucun d’eux ne fait appel à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs dirigeants ». Le mot hébreu peut désigner plus largement les autorités qui gouvernent, et pas seulement des magistrats.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Ils sont tous
  rationale: Cette tournure française naturelle conserve la portée totale et distributive de l’hébreu.
- source_word: יֵחַמּוּ
  choice: brûlants
  rationale: Le terme exprime le fait d’être échauffé ou embrasé. « Brûlants » s’accorde naturellement avec l’image du four sans préciser s’il s’agit de désir, de colère ou de complot.
- source_word: כַּתַּנּוּר
  choice: comme un four
  rationale: Traduction directe de la comparaison récurrente dans le passage.
- source_word: וְאָכְלוּ
  choice: et dévorent
  rationale: Le présent restitue la description vive d’une conduite caractéristique ou répétée ; « dévorent » conserve la violence de la métaphore.
- source_word: אֶת שֹׁפְטֵיהֶם
  choice: leurs juges
  rationale: « Juges » est le sens lexical direct, tandis que le contexte politique permet aussi le sens plus large de « dirigeants », signalé en note.
- source_word: כָּל מַלְכֵיהֶם
  choice: tous leurs rois
  rationale: La formulation préserve la répétition du langage totalisant et la dimension politique du reproche.
- source_word: נָפָלוּ
  choice: sont tombés
  rationale: 'Le passé composé rend naturellement l’accompli hébreu et laisse ouverte la nature de leur chute : mort, renversement ou les deux.'
- source_word: אֵין קֹרֵא בָהֶם אֵלָי
  choice: Aucun d’eux ne crie vers moi
  rationale: Cette formulation conserve la négation existentielle, l’appartenance au groupe et le mouvement de l’appel adressé à Dieu. « Crier vers » est naturel dans le registre biblique moderne sans être archaïque.
theological_decisions:
- issue: Faut-il expliciter moralement l’image du four en parlant de désir, de colère ou de complot ?
  choice: Conserver l’image sans nommer la passion précise
  alternative: « Ils brûlent tous de désir comme un four » ou « Ils sont tous enflammés comme un four »
  rationale: Le contexte associe la chaleur aux passions et aux intrigues destructrices, mais ce verset ne les définit pas explicitement. La traduction maintient donc l’ambiguïté de l’hébreu.
- issue: שֹׁפְטֵיהֶם désigne-t-il strictement des juges ou, plus largement, des dirigeants ?
  choice: Employer « juges » dans le texte et signaler « dirigeants » en note
  alternative: « leurs dirigeants »
  rationale: Le sens direct est « juges », mais le mot peut désigner des autorités gouvernantes dans ce contexte de bouleversements politiques.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme en trois propositions conserve la force de l’accusation prophétique ; l’image du four et l’ambiguïté concernant la chute des rois restent intactes.
