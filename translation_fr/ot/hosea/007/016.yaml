base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
translation:
  language: fr
  text: Ils se tournent[a], mais pas vers le haut ; ils sont comme un arc trompeur[b]. Leurs chefs tomberont par l’épée à cause de la fureur de leur langue. Ce sera leur dérision au pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais pas vers le Très-Haut ». Cette lecture comprend « vers le haut » comme une allusion elliptique à Dieu, sous l’influence de la formulation du verset précédent.'
    reason: alternative_reading
  - marker: b
    text: L’expression peut aussi désigner un arc relâché, traître ou défectueux, c’est-à-dire un arc peu fiable qui ne tire pas juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Ils se tournent
  rationale: Le verbe שׁוּב peut signifier « revenir », « retourner » ou « se tourner ». Ici, « se tournent » conserve le mouvement moral ou politique sans imposer l’idée d’un simple retour spatial.
- source_word: לֹא עָל
  choice: mais pas vers le haut
  rationale: L’hébreu porte littéralement une expression directionnelle difficile, « pas vers le haut ». La traduction principale la conserve sans ajouter explicitement Dieu, tandis que la note signale l’interprétation « vers le Très-Haut ».
- source_word: הָיוּ כְּקֶשֶׁת רְמִיָּה
  choice: ils sont comme un arc trompeur
  rationale: Le parfait de היה exprime ici un état dans une comparaison. רְמִיָּה évoque la tromperie, la traîtrise ou le manque de fiabilité ; « arc trompeur » préserve l’image prophétique et sa force lexicale.
- source_word: יִפְּלוּ בַחֶרֶב שָׂרֵיהֶם
  choice: Leurs chefs tomberont par l’épée
  rationale: « Tomber par l’épée » rend l’expression traditionnelle de mort violente. « Chefs » exprime naturellement la fonction politique de שָׂרֵיהֶם sans supposer un titre dynastique précis.
- source_word: מִזַּעַם לְשׁוֹנָם
  choice: à cause de la fureur de leur langue
  rationale: זַעַם désigne la fureur, l’indignation ou la colère. Cette formulation reste proche de l’image hébraïque de la langue tout en laissant entendre une parole violente, provocatrice ou arrogante.
- source_word: זֹו לַעְגָּם
  choice: Voilà ce qui leur vaudra les moqueries
  rationale: 'Cette formulation française explicite avec mesure la valeur résultative probable : le jugement annoncé deviendra pour eux une cause de dérision, sans préciser davantage qui se moquera d’eux.'
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: au pays d’Égypte
  rationale: La formulation conserve le syntagme hébreu complet et sa tonalité prophétique.
theological_decisions:
- issue: Interprétation de לֹא עָל
  choice: Conserver « mais pas vers le haut » dans le texte principal.
  alternative: « mais pas vers le Très-Haut »
  rationale: Le verset ne contient pas explicitement le titre « Très-Haut », même si le verset précédent emploie עֶלְיוֹן et peut favoriser cette lecture elliptique. La traduction principale préserve donc l’ambiguïté du texte transmis, et la note donne l’interprétation théologique possible.
translation_notes:
  register: Français international moderne, digne et accessible. Les images hébraïques de la direction, de l’arc, de l’épée et de la langue sont maintenues. La ponctuation française emploie une espace avant le point-virgule, et les marqueurs de notes sont placés immédiatement après les expressions concernées.
