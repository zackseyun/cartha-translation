revisions:
- from: Ils se tournent[a], mais pas vers le haut ; ils sont comme un arc trompeur[b]. Leurs chefs tomberont par l’épée à cause de la fureur de leur langue. Voilà ce qui leur vaudra les moqueries au pays d’Égypte.
  to: Ils se tournent[a], mais pas vers le haut ; ils sont comme un arc trompeur[b]. Leurs chefs tomberont par l’épée à cause de la fureur de leur langue. Ce sera leur dérision au pays d’Égypte.
  rationale: La révision limite l’explicitation de la dernière clause afin de reproduire plus directement « ce sera leur dérision », sans déterminer qui formule la moquerie. Elle corrige aussi l’explication technique de l’image de l’arc dans la note b. Le reste du texte préserve adéquatement les choix littéraux et l’ambiguïté signalée par l’audit anglais.
