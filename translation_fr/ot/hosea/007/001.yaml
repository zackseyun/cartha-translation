  rationale: 'Révision limitée à deux améliorations de français et de précision lexicale : « mauvaises actions » remplace l’ordre adjectival marqué « actes mauvais », et « pille au-dehors » remplace « fait un raid au-dehors » pour rendre plus naturellement l’image d’une bande qui ravage ou pille à l’extérieur. Les ambiguïtés temporelles de כְּרָפְאִי sont maintenues dans la note.'
