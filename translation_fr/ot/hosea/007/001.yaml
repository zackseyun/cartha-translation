  text: כְּ/רָפְאִ֣/י לְ/יִשְׂרָאֵ֗ל וְ/נִגְלָ֞ה עֲוֺ֤ן אֶפְרַ֨יִם֙ וְ/רָע֣וֹת שֹֽׁמְר֔וֹן כִּ֥י פָעֲל֖וּ שָׁ֑קֶר וְ/גַנָּ֣ב יָב֔וֹא פָּשַׁ֥ט גְּד֖וּד בַּ/חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/001.yaml
  text: When I would heal Israel[a], the iniquity of Ephraim is uncovered, and the evil deeds of Samaria; for they practice falsehood. A thief comes in[c][b]; a raiding band strips outside.
translation:
  language: fr
  text: Quand je guéris Israël[a], la faute d’Éphraïm se révèle, ainsi que les mauvaises actions de Samarie, car ils pratiquent la tromperie[b]. Un voleur entre ; une bande de pillards pille au-dehors[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand j’ai guéri Israël » ou « Tandis que je guérissais Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car ils agissent avec tromperie ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression hébraïque peut aussi se traduire : « une troupe pille au-dehors ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָפְאִי
  choice: Quand je guéris
  rationale: La préposition כְּ introduit ici une circonstance temporelle (« quand / lorsque / tandis que »), et le suffixe de première personne désigne Dieu comme celui qui guérit. Le présent français garde ouverte la nuance d’une action entreprise ou en cours.
- source_word: לְיִשְׂרָאֵל
  choice: Israël
  rationale: Le nom national est conservé ; en français, « guérir » peut prendre directement pour complément la personne ou le peuple guéri.
- source_word: וְנִגְלָה
  choice: se révèle
  rationale: Le nifal de גלה exprime le fait d’être mis au jour ou révélé. Le présent rend la vivacité de l’énoncé prophétique.
- source_word: עֲוֺן
  choice: la faute
  rationale: עון peut désigner la faute, la culpabilité ou l’iniquité. « Faute » est naturel en français moderne tout en conservant ici le sens moral.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Transcription française traditionnelle du nom propre, qui représente souvent le royaume du Nord chez Osée.
- source_word: וְרָעוֹת שֹׁמְרוֹן
  choice: les actes mauvais de Samarie
  rationale: Le pluriel רָעוֹת désigne ici les mauvaises actions plutôt que des malheurs subis. « Actes mauvais » explicite sobrement cette valeur morale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle la faute et les mauvaises actions sont mises au jour.
- source_word: פָעֲלוּ שָׁקֶר
  choice: ils pratiquent la tromperie
  rationale: L’association de פעל avec שקר décrit une conduite qui produit ou met en œuvre la fausseté. « Pratiquent la tromperie » suggère une conduite habituelle.
- source_word: וְגַנָּב יָבוֹא
  choice: Un voleur entre
  rationale: Le singulier est générique et בוא signifie simplement venir ou entrer ; le contexte permet « entre » sans imposer l’idée plus précise d’une effraction.
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  choice: une bande de pillards fait un raid au-dehors
  rationale: Avec גְּדוּד, le verbe פשט évoque l’incursion et le pillage. La formulation française distingue la violence collective extérieure de l’action du voleur qui entre.
theological_decisions:
- issue: Cadre temporel entre la guérison divine et la révélation de la faute
  choice: La faute se révèle au moment où Dieu guérit Israël.
  alternative: 'Le texte peut se comprendre : « Lorsque j’ai guéri Israël » ou « tandis que je guérissais Israël ».'
  rationale: La construction hébraïque autorise plusieurs nuances temporelles et aspectuelles. Le présent français ne tranche pas en faveur d’un événement passé précis ni n’ajoute explicitement une intention divine absente de la forme hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste bref entre le voleur qui entre et la bande qui opère au-dehors, sans rendre la seconde proposition artificiellement littérale.
