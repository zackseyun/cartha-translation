  source_fidelity: 'Le sens du texte hébreu est globalement bien rendu : la guérison d’Israël sert de cadre temporel à la mise au jour de la faute d’Éphraïm et des mauvaises actions de Samarie. Le contraste entre le voleur qui entre et la bande qui agit dehors est conservé. La formulation proposée pour la dernière proposition peut toutefois être améliorée afin de rendre plus directement la valeur de pillage/incursion de פשט עם גדוד.'
  naturalness: Le français est clair et de registre approprié. « Une bande de pillards fait un raid » est cependant moins naturel et légèrement calqué sur l’anglais ; « pille au-dehors » est plus idiomatique et plus direct. « Les mauvaises actions » est aussi plus naturel que « les actes mauvais ».
  terminology: Les noms propres et les termes moraux sont adéquats. « Faute » convient pour עָוֺן sans imposer la nuance de culpabilité ou de châtiment. « Tromperie » rend bien שָׁקֶר dans ce contexte. Les notes conservent les principales possibilités temporelles et lexicales sans les surinterpréter.
