id: HOS.7.9
reference: Hosea 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָכְל֤וּ זָרִים֙ כֹּח֔/וֹ וְ/ה֖וּא לֹ֣א יָדָ֑ע גַּם שֵׂיבָה֙ זָ֣רְקָה בּ֔/וֹ וְ/ה֖וּא לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
translation:
  language: fr
  text: Des étrangers ont dévoré sa force[a], mais il ne le sait pas ; même des cheveux blancs le parsèment[b], mais il ne le sait pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des étrangers ont consumé sa vigueur. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des cheveux blancs sont répandus sur lui » ; c’est une image du déclin et du vieillissement.'
    reason: cultural_note
lexical_decisions:
- source_word: אָכְלוּ
  choice: ont dévoré
  rationale: Le qal accompli de אכל garde ici son image vive de consommation destructrice ; « dévoré » convient naturellement à l’épuisement des ressources et de la vigueur.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne des personnes ou puissances étrangères à Israël. « Étrangers » préserve cette portée sans préciser davantage leur identité.
- source_word: כֹּחוֹ
  choice: sa force
  rationale: כֹּחַ peut désigner la force, la vigueur ou la capacité ; « force » reste concret et n’impose pas une interprétation exclusivement militaire.
- source_word: וְהוּא לֹא יָדָע
  choice: mais lui ne le sait pas
  rationale: La répétition souligne l’inconscience du sujet. « Mais » rend la valeur adversative du contexte, tandis que « lui » fait ressortir le contraste porté par le pronom hébreu explicite.
- source_word: גַּם
  choice: même
  rationale: '« Même » marque l’intensification : aux forces déjà consumées s’ajoute un signe manifeste de déclin.'
- source_word: שֵׂיבָה
  choice: des cheveux blancs
  rationale: Le nom évoque concrètement les cheveux gris ou blancs, signe de vieillissement ; le pluriel français convient à l’image de leur apparition dispersée.
- source_word: זָרְקָה
  choice: se sont répandus
  rationale: Le verbe exprime l’action de disperser ou de parsemer. La tournure pronominale restitue en français l’image des cheveux blancs apparaissant çà et là, sans transformer le verbe en simple état.
- source_word: בּוֹ
  choice: sur lui
  rationale: Avec l’image des cheveux blancs, « sur lui » rend directement la préposition et conserve la formulation imagée de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition finale est conservée afin de reproduire l’insistance rhétorique de l’hébreu. L’image concrète des cheveux blancs est maintenue plutôt que remplacée par l’expression abstraite « vieillesse ».
