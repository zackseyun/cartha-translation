  naturalness: Le français révisé est naturel et clair. « Celui-ci » identifie sans ambiguïté le boulanger comme sujet de « cesse ». « Attiser un four » est idiomatique dans l’image de la cuisson, tout en restant signalé comme interprétation contextuelle en note.
  terminology: « Adultères » maintient le terme concret sans imposer une lecture d’infidélité religieuse. « Four », « boulanger », « pâte » et « fermenté » conviennent au registre moderne et à l’image domestique. La note sur « brûlant » est désormais une véritable alternative au texte principal.
