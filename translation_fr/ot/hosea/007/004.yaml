source:
  edition: WLC
  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
translation:
  language: fr
  text: Ils sont tous adultères, comme un four chauffé par un boulanger[a] ; celui-ci cesse de l’attiser[b] depuis le pétrissage de la pâte jusqu’à ce qu’elle ait fermenté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brûlant ». Le participe hébreu peut souligner la chaleur active du four.
    reason: lexical_alternative
  - marker: b
    text: Ou « cesse de le remuer ». Le verbe hébreu est difficile dans ce contexte et peut désigner l’action d’attiser le four ou, plus largement, de cesser de s’en occuper.
    reason: lexical_alternative
  - marker: c
    text: Ou « jusqu’à ce qu’elle ait levé ». L’hébreu désigne probablement la fermentation de la pâte, ou le résultat de ce processus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Ils sont tous
  rationale: Cette formulation française naturelle conserve la portée globale et emphatique de l’expression hébraïque.
- source_word: מְנָאֲפִים
  choice: adultères
  rationale: Le participe pluriel est employé substantivement. « Adultères » maintient l’accusation concrète sans expliciter dans le texte la possible portée métaphorique liée à l’infidélité envers l’alliance.
- source_word: כְּמוֹ
  choice: pareils à
  rationale: Cette tournure introduit clairement et naturellement la comparaison en français.
- source_word: תַנּוּר
  choice: four
  rationale: Le contexte de la pâte et du boulanger désigne un four à pain plutôt qu’une fournaise.
- source_word: בֹּעֵרָה
  choice: brûlant
  rationale: Le participe présente le four comme activement brûlant ou ardent. « Brûlant » préserve cette vigueur, tandis que « chauffé » reste une autre lecture contextuelle possible.
- source_word: מֵאֹפֶה
  choice: chauffé par un boulanger
  rationale: La préposition est comprise comme indiquant l’agent ou la source de la chaleur. L’ajout de « chauffé » rend explicite en français le rapport elliptique entre le four brûlant et le boulanger.
- source_word: יִשְׁבּוֹת
  choice: cesse
  rationale: Le verbe signifie cesser ou interrompre une activité; « cesse » convient au registre prophétique sans être archaïque.
- source_word: מֵעִיר
  choice: de l’attiser
  rationale: Le terme est difficile dans ce contexte. « Attiser » applique l’idée de réveiller ou d’exciter au feu du four, tout en signalant en note l’autre possibilité, plus générale, de remuer.
- source_word: מִלּוּשׁ בָּצֵק
  choice: après avoir pétri la pâte
  rationale: Cette formulation idiomatique exprime en français le point de départ temporel marqué par la préposition hébraïque, sans la lourdeur de « depuis le pétrissage de la pâte ».
- source_word: עַד
  choice: jusqu’à ce que
  rationale: La locution marque naturellement le terme du laps de temps en français.
- source_word: חֻמְצָתוֹ
  choice: elle ait fermenté
  rationale: Le mot désigne le processus par lequel la pâte fermente sous l’action du levain. « Fermenté » reste proche de ce processus; « levé » en exprime le résultat visible.
theological_decisions:
- issue: Faut-il expliciter une infidélité spirituelle ou liée à l’alliance dans « adultères » ?
  choice: Conserver le terme concret « adultères » sans ajout explicatif dans le texte.
  alternative: « infidèles à Dieu » ou « adultères, c’est-à-dire infidèles à l’alliance »
  rationale: Dans Osée, l’adultère peut évoquer l’infidélité envers l’alliance, mais le mot hébreu conserve ici son sens concret. Ne pas développer la métaphore préserve la tension voulue et laisse le contexte prophétique guider l’interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La comparaison est formulée avec un vocabulaire courant de boulangerie. « Celui-ci » lève l’ambiguïté référentielle en indiquant que le boulanger est le sujet de « cesse », sans développer davantage l’image.
