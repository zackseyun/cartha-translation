base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
translation:
  language: fr
  text: Car ils s’approchent, le cœur comme un four, dans leur embuscade[a]. Toute la nuit, leur boulanger dort[b] ; au matin, il brûle comme un feu flamboyant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans leur embuscade » ou « alors qu’ils sont à l’affût ». L’hébreu évoque le fait de rôder ou de guetter en vue d’une attaque.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur boulanger ». Dans la métaphore prolongée du four, il peut désigner figurativement celui qui entretient ou attise l’ardeur de leur complot.'
    reason: cultural_note
  - marker: c
    text: L’hébreu porte simplement « il brûle » ; le sujet peut renvoyer au cœur, au four ou à un autre élément de l’image.
    reason: textual_ambiguity
lexical_decisions:
- source_word: קֵרְבוּ
  choice: ils s’approchent
  rationale: Le qal accompli de קרב exprime l’idée de s’approcher. La traduction conserve ce mouvement sans préciser artificiellement de qui ou de quoi ils s’approchent.
- source_word: כַתַּנּוּר לִבָּם
  choice: le cœur pareil à un four
  rationale: La comparaison explicite avec le four est conservée. Le singulier collectif hébreu לִבָּם est rendu par « le cœur », naturel en français avec un sujet pluriel dans cette construction.
- source_word: בְּאָרְבָּם
  choice: tandis qu’ils se tiennent en embuscade
  rationale: Le terme dérivé de ארב évoque le fait de guetter, de rôder ou de préparer une embuscade. La formulation verbale rend la scène compréhensible sans en préciser davantage la cible.
- source_word: יָשֵׁן
  choice: dort
  rationale: Le mot décrit simplement l’état de sommeil et s’intègre naturellement au présent narratif français.
- source_word: אֹפֵהֶם
  choice: leur boulanger
  rationale: La traduction littérale maintient la métaphore prolongée du four et laisse ouverte l’identité figurée de celui qui entretient ou attise le complot.
- source_word: בֹעֵר
  choice: brûle
  rationale: Le participe actif de בער indique une combustion en cours. « Brûle » conserve l’image sans ajouter l’idée d’allumage.
- source_word: כְאֵשׁ לֶהָבָה
  choice: comme un feu flamboyant
  rationale: Cette expression restitue l’intensification produite en hébreu par l’association du feu et de la flamme.
theological_decisions:
- issue: Sujet et agent dans la métaphore du four
  choice: Le cœur des conspirateurs est présenté comme un four, et « leur boulanger » demeure un personnage métaphorique non identifié.
  alternative: On peut comprendre que les conspirateurs s’approchent d’une personne, peut-être du roi, avec un cœur brûlant, ou analyser autrement cette syntaxe hébraïque très condensée.
  rationale: Le texte ne permet pas de déterminer avec certitude la cible de l’approche ni l’identité du « boulanger ». La traduction préserve cette tension sans lui imposer une interprétation doctrinale.
- issue: Sujet implicite de בֹעֵר au matin
  choice: Répéter « leur cœur » dans le texte français.
  alternative: Traduire plus littéralement « il brûle », en laissant le pronom renvoyer au cœur ou au four.
  rationale: En français, « il » semblerait renvoyer spontanément au boulanger, ce qui fausserait probablement l’image. La reprise du cœur relie la dernière proposition à la comparaison initiale, tout en signalant dans une note que l’hébreu n’explicite pas le nom.
translation_notes:
  register: Français international moderne, sobre et imagé. La syntaxe a été légèrement déployée pour rendre lisible l’hébreu très condensé, tout en conservant le cœur, le four, le boulanger et le feu comme éléments de la métaphore.
