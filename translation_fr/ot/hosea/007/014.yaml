source:
  edition: WLC
  text: וְ/לֹֽא זָעֲק֤וּ אֵלַ/י֙ בְּ/לִבָּ֔/ם כִּ֥י יְיֵלִ֖ילוּ עַל מִשְׁכְּבוֹתָ֑/ם עַל דָּגָ֧ן וְ/תִיר֛וֹשׁ יִתְגּוֹרָ֖רוּ יָס֥וּרוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
translation:
  language: fr
  text: Ils ne crient pas vers moi du fond du cœur, mais ils se lamentent sur leurs lits. Pour du grain et du vin nouveau, ils se rassemblent[a] ; ils se détournent de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils se tailladent ». Le verbe hébreu est difficile et peut évoquer soit le fait de se rassembler, soit des incisions pratiquées sur soi dans le cadre de lamentations rituelles.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ
  choice: crient
  rationale: Le verbe exprime un cri intense, souvent un appel au secours. « Crient vers moi » conserve cette force en français naturel.
- source_word: אֵלַי בְּלִבָּם
  choice: vers moi du fond du cœur
  rationale: Cette formulation idiomatique rend l’orientation vers Dieu et la sincérité intérieure opposée aux lamentations extérieures.
- source_word: כִּי
  choice: mais
  rationale: Dans ce contexte, la conjonction introduit le contraste entre l’absence d’un appel sincère à Dieu et les lamentations sur les couches.
- source_word: יְיֵלִילוּ
  choice: ils se lamentent
  rationale: Le verbe désigne une lamentation sonore. « Se lamentent » reste digne et naturel, sans imposer la nuance animale possible de « hurlent ».
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: sur leurs couches
  rationale: « Couches » préserve l’image concrète tout en convenant au registre biblique moderne et digne.
- source_word: דָּגָן וְתִירוֹשׁ
  choice: du blé et du vin nouveau
  rationale: דגן désigne ici les céréales, rendues naturellement par « blé » dans le contexte agricole, tandis que תירוש évoque le vin nouveau.
- source_word: יִתְגֹּרָרוּ
  choice: ils se rassemblent
  rationale: La forme hébraïque est difficile. La vocalisation du texte massorétique soutient une compréhension liée au rassemblement; l’autre lecture ancienne, « ils se tailladent », est signalée en note afin de préserver l’ambiguïté.
- source_word: יָסוּרוּ בִי
  choice: ils se détournent de moi
  rationale: Cette traduction exprime clairement l’éloignement relationnel sans renforcer le texte par « se rebellent ».
theological_decisions:
- issue: Sens de יִתְגֹּרָרוּ
  choice: ils se rassemblent pour obtenir du blé et du vin nouveau
  alternative: ils se tailladent pour du blé et du vin nouveau
  rationale: Le verbe est notoirement difficile. Le texte principal suit la lecture du texte massorétique comme rassemblement, tandis que la note conserve la lecture de l’automutilation rituelle, attestée par une autre compréhension ancienne et cohérente avec le contexte religieux d’Osée.
translation_notes:
  register: Français international moderne, clair et digne. « Du fond du cœur » communique naturellement la sincérité; « couches » maintient une légère solennité. La ponctuation met en relief la progression entre lamentation intéressée et éloignement de Dieu.
