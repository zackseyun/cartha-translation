revisions:
- from: Yahweh est en procès avec Juda[a] ; il demandera des comptes à Jacob pour sa conduite[b] et lui rendra selon ses actes.
  to: Yahweh a un litige avec Juda[a] ; il punira Jacob[b] selon sa conduite et lui rendra selon ses actes.
  rationale: La révision rétablit « selon » pour la valeur de mesure de כִּדְרָכָיו, explicite de façon naturelle le sens punitif de פקד על dans ce contexte, et corrige l’explication littérale de la note. Elle maintient les noms, le registre juridique et la distinction non résolue entre Juda et Jacob.
