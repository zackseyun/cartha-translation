source:
  edition: WLC
  text: וְ/רִ֥יב לַֽ/יהוָ֖ה עִם יְהוּדָ֑ה וְ/לִ/פְקֹ֤ד עַֽל יַעֲקֹב֙ כִּ/דְרָכָ֔י/ו כְּ/מַעֲלָלָ֖י/ו יָשִׁ֥יב לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
translation:
  language: fr
  text: Yahweh a un litige avec Juda[a] ; il punira Jacob[b] selon sa conduite et lui rendra selon ses actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh porte une accusation contre Juda » ou « Yahweh a un différend avec Juda ». L’hébreu emploie le vocabulaire d’un litige judiciaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il demandera des comptes à Jacob ». Littéralement, l’expression signifie « visiter sur/contre » ; dans un contexte de jugement, elle désigne souvent une intervention punitive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: est en procès avec
  rationale: Le nom appartient ici au langage juridique et prophétique. Cette formulation naturelle conserve l’image d’un litige engagé par Yahweh sans réduire le terme à une simple querelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עִם יְהוּדָה
  choice: avec Juda
  rationale: Après רִיב, la préposition désigne la partie adverse dans le litige. En français, « être en procès avec » exprime naturellement cette relation judiciaire.
- source_word: לִפְקֹד עַל
  choice: demandera des comptes à
  rationale: Dans ce contexte de jugement, l’expression évoque une intervention judiciaire pouvant mener au châtiment. « Demander des comptes » en préserve la dimension de reddition de comptes sans imposer une formulation plus étroite.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom est conservé tel quel afin de préserver le jeu possible entre le patriarche et le peuple qui descend de lui.
- source_word: כִדְרָכָיו
  choice: pour sa conduite
  rationale: Le pluriel de דֶּרֶךְ désigne métaphoriquement la manière de vivre. « Conduite » rend ce sens clairement en français moderne.
- source_word: כְמַעֲלָלָיו
  choice: selon ses actes
  rationale: מַעֲלָלִים désigne les actions, souvent avec une portée morale dans les annonces prophétiques de jugement.
- source_word: יָשִׁיב לוֹ
  choice: lui rendra
  rationale: 'Le hiphil de שוב avec ל exprime ici la rétribution : ce que Jacob recevra correspondra à ses propres actes. La formulation maintient cette correspondance sans ajout explicatif.'
theological_decisions:
- issue: Distinction entre Juda et Jacob dans le jugement prophétique
  choice: 'Conserver les deux noms : Juda est la partie au procès, puis Jacob est appelé à rendre compte et reçoit selon ses actes.'
  alternative: Comprendre explicitement « Jacob » comme un simple synonyme de l’ensemble d’Israël, Juda compris.
  rationale: Le texte nomme distinctement Juda et Jacob. La traduction ne les harmonise pas et laisse ouverte la portée collective de « Jacob ».
- issue: Portée judiciaire de פקד
  choice: « demandera des comptes à », qui exprime la reddition de comptes divine.
  alternative: « punira », qui explicite directement l’issue punitive.
  rationale: Le contexte est clairement judiciaire, mais le verbe peut désigner plus largement le fait d’intervenir contre quelqu’un ou de lui demander compte. La formulation choisie préserve cette amplitude tout en restant intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. « Être en procès avec » conserve le cadre juridique prophétique ; « demander des comptes » évite une tournure littérale obscure tout en maintenant la tension entre jugement et châtiment.
