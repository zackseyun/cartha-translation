reference: Hosea 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּנַ֗עַן בְּ/יָד֛/וֹ מֹאזְנֵ֥י מִרְמָ֖ה לַ/עֲשֹׁ֥ק אָהֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/008.yaml
  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
translation:
  language: fr
  text: Un marchand, les balances frauduleuses à la main, aime exploiter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « Canaan ». Le mot peut aussi être compris comme « Cananéen » ou, par extension, « marchand » ; ce dernier sens convient au contexte des balances frauduleuses.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַעַן
  choice: Un marchand
  rationale: Le mot désigne formellement « Canaan », mais peut s’employer par extension au sens de « marchand ». L’image immédiate des balances frauduleuses favorise ici le sens commercial, tandis que le sens propre est conservé en note.
- source_word: בְּיָדוֹ
  choice: avec dans sa main
  rationale: Cette formulation conserve l’image concrète de l’instrument tenu en main, tout en rattachant naturellement le groupe au marchand.
- source_word: מֹאזְנֵי מִרְמָה
  choice: des balances trompeuses
  rationale: « Balances » désigne clairement l’instrument de pesée, et « trompeuses » rend le substantif hébreu exprimant la fraude ou la tromperie.
- source_word: לַעֲשֹׁק
  choice: exploiter
  rationale: Le verbe peut signifier opprimer, extorquer ou dépouiller. Dans ce contexte commercial, « exploiter » garde à la fois l’idée d’abus économique et la portée plus large de l’oppression.
- source_word: אָהֵב
  choice: aime
  rationale: 'Le présent exprime une disposition caractéristique et conserve la force morale du verbe : le marchand prend plaisir à cette conduite.'
theological_decisions:
- issue: Faut-il comprendre כְּנַעַן comme le nom propre « Canaan », comme « Cananéen » ou comme l’appellatif « marchand » ?
  choice: L’appellatif « marchand » dans le texte principal.
  alternative: « Canaan » ou « un Cananéen », avec une possible identification rhétorique d’Éphraïm à Canaan.
  rationale: Les balances trompeuses rendent le sens commercial immédiatement intelligible et contextuellement probable. La note conserve toutefois l’ambiguïté hébraïque et sa possible portée prophétique sans la résoudre entièrement.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’image concrète et l’accusation concise de l’hébreu. « Exploiter » est plus naturel ici que « opprimer » tout en préservant l’idée d’abus.
