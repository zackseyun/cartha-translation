id: HOS.12.4
reference: Hosea 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/בֶּ֖טֶן עָקַ֣ב אֶת אָחִ֑י/ו וּ/בְ/אוֹנ֖/וֹ שָׂרָ֥ה אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/004.yaml
  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
translation:
  language: fr
  text: Dans le ventre de sa mère, il saisit son frère par le talon[a] ; dans sa vigueur, il lutta avec Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il prit son frère par le talon ». Le verbe hébreu évoque le récit de la naissance de Jacob et peut aussi prendre le sens plus large de « supplanter ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il lutta avec un être divin ». Le verset suivant désigne cette figure comme « l’ange » ; Osée maintient ainsi une tension entre les deux désignations.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  choice: Dans le ventre de sa mère
  rationale: בטן désigne ici le ventre maternel. L’ajout idiomatique « de sa mère » rend le sens contextuel explicite sans modifier l’image hébraïque.
- source_word: עָקַב אֶת אָחִיו
  choice: il saisit son frère par le talon
  rationale: Le verbe עָקַב évoque le talon et renvoie au récit de la naissance de Jacob en Genèse 25. La formulation française conserve cette image concrète sans imposer le sens étendu de « supplanter ».
- source_word: וּבְאוֹנוֹ
  choice: dans sa vigueur
  rationale: אוֹן peut désigner la force ou la vigueur. « Dans sa vigueur » suit la construction hébraïque et reste naturel en français, sans préciser indûment l’âge ou la puissance sexuelle.
- source_word: שָׂרָה
  choice: il lutta
  rationale: Le verbe exprime une lutte ou un affrontement et fait écho au nom d’Israël. « Lutta » conserve l’action sans affirmer ici que Jacob l’a emporté.
- source_word: אֶת אֱלֹהִים
  choice: avec Dieu
  rationale: Dans cette construction liée au verbe de lutte, אֶת se rend naturellement par « avec ». אֱלֹהִים est traduit par « Dieu » dans le texte principal, conformément au terme hébreu, tout en signalant l’autre compréhension possible en note.
theological_decisions:
- issue: Référent de אֱלֹהִים dans la lutte de Jacob
  choice: Dieu
  alternative: un être divin ; l’ange, à la lumière du verset suivant
  rationale: Le texte de ce verset emploie אֱלֹהִים, tandis que le verset suivant parle de « l’ange ». Le texte principal garde donc « Dieu » et la note préserve la tension entre la désignation divine et la désignation angélique au lieu de les harmoniser.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux propositions est conservé ; le point-virgule marque leur articulation. « Vigueur » évite une tournure pesante, et « lutta » restitue clairement l’affrontement sans en préciser l’issue.
