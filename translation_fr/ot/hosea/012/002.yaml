id: HOS.12.2
reference: Hosea 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
translation:
  language: fr
  text: Éphraïm se nourrit de vent[a] et poursuit le vent d’est toute la journée[b] ; il multiplie le mensonge et la dévastation[c]. Ils[d] concluent une alliance avec l’Assyrie[e], et de l’huile est transportée en Égypte[f].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait paître le vent » ; le verbe hébreu signifie littéralement « faire paître », « paître » ou « nourrir ».
    reason: lexical_alternative
  - marker: b
    text: Dans la région, le vent d’est était un vent brûlant et destructeur ; l’image évoque donc à la fois la vanité et le danger.
    reason: cultural_note
  - marker: c
    text: Ou « la fausseté et les ravages » ; le second terme hébreu peut évoquer la dévastation, la destruction violente ou le pillage.
    reason: lexical_alternative
  - marker: d
    text: L’hébreu passe ici du singulier, avec Éphraïm comme sujet collectif, au pluriel, qui peut désigner le peuple ou ses dirigeants.
    reason: grammatical_note
  - marker: e
    text: Littéralement « coupent une alliance », expression hébraïque habituelle signifiant « conclure une alliance ou un traité ».
    reason: lexical_alternative
  - marker: f
    text: Il s’agit probablement d’huile d’olive envoyée comme tribut ou présent diplomatique à l’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֶה רוּחַ
  choice: se nourrit de vent
  rationale: Le verbe רעה signifie littéralement « faire paître », « paître » ou « nourrir ». Dans cette association métaphorique avec le vent, « se nourrit de vent » reste naturel en français tout en exprimant une activité vaine et sans substance.
- source_word: וְרֹדֵף קָדִים
  choice: et poursuit le vent d’est
  rationale: רדף signifie « poursuivre » et קדים désigne le vent d’est, vent chaud et destructeur dans la région. L’image concrète est conservée sans être remplacée par son interprétation.
- source_word: כָּל הַיּוֹם
  choice: toute la journée
  rationale: Cette expression française courante rend la continuité indiquée par l’hébreu.
- source_word: כָּזָב וָשֹׁד
  choice: le mensonge et la dévastation
  rationale: כָּזָב désigne le mensonge ou la fausseté, tandis que שֹׁד peut désigner la dévastation, la destruction violente ou le pillage. « Dévastation » préserve ici l’idée de ravage sans réduire le terme à la seule violence interpersonnelle.
- source_word: יַרְבֶּה
  choice: il multiplie
  rationale: La forme verbale signifie « rendre nombreux, multiplier ». Le singulier est maintenu en accord avec le sujet collectif Éphraïm.
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  choice: Ils concluent une alliance avec l’Assyrie
  rationale: כרת ברית, littéralement « couper une alliance », est l’expression hébraïque habituelle pour conclure une alliance ou un traité. Le pluriel « ils » respecte le passage du singulier collectif au verbe pluriel.
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  choice: et de l’huile est transportée en Égypte
  rationale: 'שׁמן signifie « huile », probablement de l’huile d’olive, et יוּבָל est un passif : « est apportée, transportée ». La traduction évite de préciser dans le texte la fonction diplomatique probable de cette huile.'
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre hébreu est conservé, même s’il représente souvent chez Osée le royaume du Nord dans son ensemble.
theological_decisions:
- issue: Portée de la métaphore politique du vent
  choice: Conserver les images du vent et du vent d’est
  alternative: 'Paraphraser : « Éphraïm poursuit le néant et la destruction »'
  rationale: Ces images dénoncent probablement une politique à la fois vaine et dangereuse, mais leur force poétique et leur pluralité de sens appartiennent au texte et ne doivent pas être résolues dans la traduction.
- issue: Passage du singulier au pluriel
  choice: Employer « il » pour Éphraïm, puis « ils » pour le verbe pluriel
  alternative: Uniformiser tout le verset au singulier ou au pluriel
  rationale: L’hébreu passe du nom collectif Éphraïm accompagné de verbes au singulier à יִכְרֹתוּ, au pluriel. La traduction conserve cette tension grammaticale, qui peut viser le peuple ou ses dirigeants.
- issue: Nature de l’alliance étrangère
  choice: Traduire ברית par « alliance » sans qualifier davantage celle-ci
  alternative: Employer « traité » ou expliciter une compromission religieuse
  rationale: Le contexte est politique, mais ברית garde une portée plus large que le seul terme « traité ». La traduction n’ajoute aucun jugement doctrinal absent de cette proposition.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les métaphores prophétiques, le parallélisme des accusations et le changement de nombre grammatical, tout en expliquant en notes les idiomes et le contexte culturel.
