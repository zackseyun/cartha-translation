base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/005.yaml
  text: He strove with the angel and prevailed[a]; he wept and sought his favor. At Bethel he found him[b], and there he spoke with us—
translation:
  language: fr
  text: Il lutta contre l’ange et eut le dessus ; il pleura et le supplia de lui accorder sa faveur.[a] À Béthel, il le trouva, et là, il parla avec nous.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il implora sa faveur ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « avec nous » ; certains comprennent « avec lui », ce qui régularise le changement de personne. Le texte principal conserve la leçon massorétique.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: il lutta
  rationale: Dans l’allusion au combat de Jacob en Genèse 32, le verbe שרה exprime l’idée de lutter ou de combattre, non celle d’être droit. « Lutta » est naturel et conserve le lien narratif.
- source_word: אֶל מַלְאָךְ
  choice: contre l’ange
  rationale: La préposition marque ici l’affrontement, et מַלְאָךְ désigne l’être surnaturel rencontré par Jacob. L’article défini est fourni en français puisque le référent est identifiable dans le contexte.
- source_word: וַיֻּכָל
  choice: et l’emporta
  rationale: Le verbe יכל signifie ici prévaloir dans le combat. « L’emporta » rend clairement ce sens sans suggérer nécessairement une destruction ou une victoire absolue.
- source_word: בָּכָה
  choice: il pleura
  rationale: Rendu direct et courant du verbe signifiant pleurer.
- source_word: וַיִּתְחַנֶּן לוֹ
  choice: le supplia de lui accorder sa faveur
  rationale: La forme réfléchie-intensive de חנן évoque une supplication en vue d’obtenir faveur ou grâce. Cette formulation garde cette nuance lexicale tout en restant idiomatique en français.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française usuelle du nom de lieu.
- source_word: יִמְצָאֶנּוּ
  choice: il le trouva
  rationale: Le sujet singulier poursuit naturellement le souvenir de Jacob, et le suffixe est compris ici comme renvoyant à l’être rencontré. Le passé convient au récit rétrospectif.
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  choice: et là, il parla avec nous
  rationale: Le suffixe de première personne du pluriel est conservé tel qu’il figure dans le texte massorétique. L’imparfait hébreu est rendu au passé dans cette évocation narrative.
theological_decisions:
- issue: Changement de personne dans la dernière proposition
  choice: avec nous
  alternative: avec lui
  rationale: Le texte massorétique passe du récit concernant Jacob à la première personne du pluriel, ce qui peut associer les destinataires à l’expérience de leur ancêtre. La traduction préserve cette tension plutôt que d’harmoniser le pronom au singulier.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme en propositions brèves conserve la force poétique du verset. « Ange », « faveur » et « Béthel » sont immédiatement compréhensibles sans imposer une interprétation confessionnelle.
