source:
  edition: WLC
  text: סְבָבֻ֤/נִי בְ/כַ֨חַשׁ֙ אֶפְרַ֔יִם וּ/בְ/מִרְמָ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל וִֽ/יהוּדָ֗ה עֹ֥ד רָד֙ עִם אֵ֔ל וְ/עִם קְדוֹשִׁ֖ים נֶאֱמָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
translation:
  language: fr
  text: Éphraïm m’a entouré de mensonges, et la maison d’Israël de tromperie. Mais Juda marche encore avec Dieu[a] et demeure fidèle au Saint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible de toute la proposition : « Mais Juda reste indiscipliné envers Dieu, envers le Saint qui est fidèle. » Le texte hébreu est difficile, surtout quant au sens du verbe traduit par « marche » et au rapport du mot « fidèle » avec les termes qui précèdent.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « avec les saints » ou « avec les êtres saints »; le pluriel hébreu peut aussi être compris comme désignant « le Saint », c’est-à-dire Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  choice: m’a entouré
  rationale: Le qal accompli à la 3e personne du pluriel avec suffixe de 1re personne signifie littéralement « ils m’ont entouré ». Le singulier français s’accorde naturellement avec le collectif « Éphraïm ».
- source_word: בְכַחַשׁ
  choice: de mensonges
  rationale: כחש désigne ici la fausseté ou le mensonge. « De mensonges » est clair et conserve l’image de Dieu entouré par la fausseté d’Éphraïm.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé; bien qu’il désigne souvent par métonymie le royaume du Nord chez Osée, cette interprétation n’est pas introduite dans le texte.
- source_word: וּבְמִרְמָה
  choice: de tromperie
  rationale: מרמה évoque la tromperie, la duplicité ou la perfidie. « Tromperie » reste distinct de « mensonges » sans surinterpréter.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La tournure formelle du texte hébreu est conservée; elle convient au registre prophétique.
- source_word: וִיהוּדָה
  choice: Mais Juda
  rationale: La conjonction peut signifier simplement « et », mais « mais » exprime la lecture contrastive retenue entre Éphraïm-Israël et Juda.
- source_word: עֹד
  choice: encore
  rationale: עֹד marque ici la continuité d’un état ou d’une conduite.
- source_word: רָד עִם אֵל
  choice: marche encore avec Dieu
  rationale: Le verbe רד/רוד est extrêmement difficile dans ce contexte. « Marche avec Dieu » retient la lecture relationnelle positive suggérée par la suite de la proposition, sans masquer dans la note la possibilité d’une lecture négative.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל fonctionne ici comme un titre divin commun; « Dieu » est la traduction française naturelle.
- source_word: וְעִם קְדוֹשִׁים
  choice: au Saint
  rationale: קדושים est morphologiquement pluriel, mais peut ici être compris comme une désignation intensive de Dieu. La traduction au singulier s’accorde avec la lecture positive retenue; le pluriel littéral est signalé en note.
- source_word: נֶאֱמָן
  choice: demeure fidèle
  rationale: Le participe nifal exprime la fidélité, la fiabilité ou la constance. « Demeure fidèle » rend naturellement en français la valeur continue du participe dans cette proposition.
theological_decisions:
- issue: Interprétation de la proposition concernant Juda dans un texte hébreu particulièrement difficile
  choice: 'Lecture contrastive positive : Juda marche encore avec Dieu et demeure fidèle au Saint.'
  alternative: 'Lecture négative : Juda reste indiscipliné envers Dieu, envers le Saint qui est fidèle.'
  rationale: Le sens du verbe רָד, la fonction de עִם et le rapport syntaxique de נֶאֱמָן avec les mots précédents sont incertains. La lecture positive fournit un contraste cohérent avec la tromperie d’Éphraïm et d’Israël, mais l’autre lecture demeure réellement possible et est donc conservée en note.
- issue: Singulier ou pluriel de קְדוֹשִׁים
  choice: « le Saint », comme désignation de Dieu
  alternative: « les saints » ou « les êtres saints »
  rationale: La forme est plurielle, mais le contexte peut permettre une désignation intensive de Dieu. Le texte principal suit cette compréhension tout en donnant en note le pluriel formel afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international actuel, sobre et digne. La répétition structurée « Éphraïm… la maison d’Israël » et l’image « entouré de mensonges » sont conservées. Les notes rendent visibles les ambiguïtés lexicales, syntaxiques et théologiques réelles du texte hébreu.
