  text: הִכְעִ֥יס אֶפְרַ֖יִם תַּמְרוּרִ֑ים וְ/דָמָי/ו֙ עָלָ֣י/ו יִטּ֔וֹשׁ וְ/חֶ֨רְפָּת֔/וֹ יָשִׁ֥יב ל֖/וֹ אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
translation:
  language: fr
  text: Éphraïm a provoqué une amère colère ; son sang versé restera sur lui[a], et son Seigneur lui rendra son opprobre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses sangs resteront sur lui ». En contexte judiciaire, l’expression peut désigner le sang versé ou la culpabilité qui en résulte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son maître lui rendra son opprobre ». Le mot traduit par « Seigneur » peut aussi signifier « maître » ; « opprobre » peut également se rendre par « honte » ou « disgrâce ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִכְעִיס תַּמְרוּרִים
  choice: a provoqué une amère colère
  rationale: Le hiphil de כעס exprime l’idée de provoquer à la colère, tandis que תמרורים en intensifie le caractère amer. La formulation française est naturelle et conserve la force émotionnelle de l’hébreu.
- source_word: וְדָמָיו
  choice: son meurtre
  rationale: Le pluriel hébreu דמים désigne fréquemment le sang versé, voire le meurtre dont quelqu’un porte la culpabilité. « Son meurtre » garde l’acte sanglant au premier plan sans réduire le terme au seul sentiment de culpabilité.
- source_word: עָלָיו יִטּוֹשׁ
  choice: restera à sa charge
  rationale: נטש signifie ici laisser sur quelqu’un. « Restera à sa charge » exprime naturellement en français la responsabilité persistante, tout en laissant implicite le sujet du verbe comme en hébreu.
- source_word: וְחֶרְפָּתוֹ
  choice: l’outrage qu’il a commis
  rationale: חרפה peut désigner l’opprobre, l’outrage ou l’objet du mépris. Dans la construction rétributive, cette formulation rend l’outrage imputable à Éphraïm sans effacer la possibilité d’une honte qui lui revient.
- source_word: יָשִׁיב לוֹ
  choice: lui fera retomber dessus
  rationale: Le hiphil de שוב avec ל exprime le retour ou la rétribution. Cette tournure française conserve l’image de l’acte qui revient sur son auteur.
- source_word: אֲדֹנָיו
  choice: son Seigneur
  rationale: Le titre désigne vraisemblablement Dieu dans ce contexte. La majuscule signale cette référence sans substituer le nom divin YHWH, absent du texte.
theological_decisions:
- issue: Référent de אֲדֹנָיו
  choice: « son Seigneur », titre divin renvoyant à Dieu
  alternative: « son maître »
  rationale: Dans le contexte du jugement prophétique, celui qui fait retomber l’outrage sur Éphraïm est Dieu. « Seigneur » préserve le titre hébreu sans introduire « l’Éternel », qui supposerait la présence explicite du tétragramme.
- issue: Valeur judiciaire de דָמָיו
  choice: « son meurtre restera à sa charge »
  alternative: « son sang restera sur lui » ou « la culpabilité du sang versé restera sur lui »
  rationale: Le terme peut évoquer concrètement le sang versé et, par métonymie, la responsabilité judiciaire qui en découle. Le texte principal privilégie un français direct, tandis que la note conserve l’éventail sémantique.
- issue: Sens de חֶרְפָּתוֹ dans la rétribution
  choice: l’outrage commis par Éphraïm lui retombe dessus
  alternative: son Seigneur lui rendra son opprobre / sa honte
  rationale: Le suffixe peut renvoyer à l’outrage dont Éphraïm est responsable ou à son propre opprobre. La traduction principale explicite la logique rétributive, et la note maintient l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme judiciaire est conservé sans ajouter de lien logique absent de l’hébreu. Les notes maintiennent les ambiguïtés réelles de דמים, חרפה et אדניו.
