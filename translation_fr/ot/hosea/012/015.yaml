  source_fidelity: La première proposition rend correctement הִכְעִיס תַּמְרוּרִים. En revanche, « son meurtre » réduit abusivement דָמָיו (« ses sangs ») à un meurtre unique, alors que le terme peut désigner le sang versé ou la culpabilité de sang. « l’outrage qu’il a commis » ajoute l’idée de commission, absente de חֶרְפָּתוֹ, et tranche une ambiguïté que le texte ne tranche pas. La révision conserve le parallélisme judiciaire et l’ambiguïté du suffixe.
  naturalness: La formulation révisée est naturelle dans un français biblique moderne et accessible. « Restera sur lui » garde l’image juridique du texte sans lourdeur, tandis que « lui rendra son opprobre » est une expression française claire dans ce contexte de jugement.
  terminology: « Sang versé » rend sobrement la portée judiciaire possible de דמים sans la limiter à « meurtre ». « Opprobre » rend חרפה sans introduire l’idée interprétative d’un outrage commis. « Seigneur » convient comme titre divin contextuel; la note maintient l’alternative « maître » sans substituer le tétragramme.
