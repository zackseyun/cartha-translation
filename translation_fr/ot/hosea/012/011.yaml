id: HOS.12.11
reference: Hosea 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דִבַּ֨רְתִּי֙ עַל הַ/נְּבִיאִ֔ים וְ/אָנֹכִ֖י חָז֣וֹן הִרְבֵּ֑יתִי וּ/בְ/יַ֥ד הַ/נְּבִיאִ֖ים אֲדַמֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
translation:
  language: fr
  text: J’ai parlé par les prophètes[a] ; moi-même, j’ai multiplié les visions, et par la main des prophètes[b], j’ai employé des comparaisons[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « J’ai parlé aux prophètes ». La préposition hébraïque peut se comprendre de plusieurs manières ici, bien que le parallélisme favorise l’idée d’une parole transmise par les prophètes.
    reason: alternative_reading
  - marker: b
    text: « Par la main des prophètes » est une expression hébraïque qui signifie « par l’intermédiaire des prophètes ».
    reason: idiom_explanation
  - marker: c
    text: Ou « j’ai proposé des paraboles » ou « j’ai parlé en images ». Le verbe hébreu est difficile et peut désigner un discours formulé au moyen de ressemblances ou de figures.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  choice: J’ai parlé par les prophètes
  rationale: La préposition עַל admet ici plusieurs compréhensions. Le sens instrumental « par » est retenu dans le texte en raison du parallélisme avec וּבְיַד הַנְּבִיאִים, tout en signalant en note le sens possible « aux prophètes ».
- source_word: וְאָנֹכִי
  choice: moi-même
  rationale: Le pronom indépendant אָנֹכִי souligne le sujet déjà inclus dans la forme verbale ; « moi-même » rend cette insistance en français courant.
- source_word: חָזוֹן הִרְבֵּיתִי
  choice: j’ai multiplié les visions
  rationale: Le hifil de רבה signifie « multiplier, rendre nombreux ». Cette formulation conserve « visions » comme complément direct et préserve la diversité des moyens de révélation mentionnés.
- source_word: וּבְיַד הַנְּבִיאִים
  choice: par la main des prophètes
  rationale: L’expression בְּיַד est un idiome d’intermédiaire ou d’agent. La traduction conserve l’image hébraïque de la main, tandis qu’une note en explicite le sens.
- source_word: אֲדַמֶּה
  choice: j’ai employé des comparaisons
  rationale: Le piel de דמה est difficile ici et renvoie vraisemblablement à l’usage de ressemblances, d’images ou de paraboles. « Employer des comparaisons » reste compréhensible sans imposer une catégorie littéraire trop étroite.
theological_decisions:
- issue: Mode de la révélation prophétique
  choice: Dieu parle par l’intermédiaire des prophètes, au moyen de paroles, de visions et de comparaisons.
  alternative: Dieu pourrait être décrit comme parlant aux prophètes plutôt que par eux dans la première proposition.
  rationale: Le parallélisme avec « par la main des prophètes » favorise l’idée d’une communication transmise par eux, mais la préposition de la première proposition demeure ambiguë ; l’autre lecture est donc conservée en note.
- issue: Nature des comparaisons prophétiques
  choice: Le verbe est rendu de manière générale par « j’ai employé des comparaisons ».
  alternative: « J’ai proposé des paraboles » ou « j’ai parlé en images ».
  rationale: Le terme hébreu peut viser diverses formes de langage figuré. Une formulation générale évite de restreindre indûment le propos aux seules paraboles au sens technique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle et l’insistance de « moi-même » sont conservées. L’image de la main est maintenue dans le texte, puis expliquée en note ; le dernier verbe est rendu sans archaïsme et sans réduire son champ sémantique à une seule forme littéraire.
