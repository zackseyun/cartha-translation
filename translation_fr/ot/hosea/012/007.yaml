  text: וְ/אַתָּ֖ה בֵּ/אלֹהֶ֣י/ךָ תָשׁ֑וּב חֶ֤סֶד וּ/מִשְׁפָּט֙ שְׁמֹ֔ר וְ/קַוֵּ֥ה אֶל אֱלֹהֶ֖י/ךָ תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/007.yaml
  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
translation:
  language: fr
  text: Et toi, par ton Dieu[a], reviens ; garde l’amour fidèle et la justice, et espère[b] constamment en ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reviens à ton Dieu ». L’hébreu dit littéralement « par/avec ton Dieu, reviens », construction inhabituelle qui peut exprimer le moyen, la relation ou, selon le sens, la direction.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se traduire par « attends » ou « mets ton espérance » ; il évoque une attente confiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  choice: par ton Dieu
  rationale: La préposition ב peut exprimer le moyen, la relation ou la sphère. « Par ton Dieu » conserve la construction inhabituelle et suggère que le retour est rendu possible ou fondé par Dieu, sans exclure les autres nuances signalées en note.
- source_word: תָשׁוּב
  choice: reviens
  rationale: Le verbe שׁוב signifie couramment « revenir » ou « retourner ». « Reviens » garde à la fois son sens concret et sa portée d’appel au rétablissement de la relation avec Dieu, sans expliciter davantage par « repens-toi ».
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: חסד associe amour, bonté et fidélité dans une relation d’engagement. « L’amour fidèle » est clair en français moderne et préserve cette richesse mieux que le seul terme « bonté » ou « miséricorde ».
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans cette exhortation éthique, « la justice » exprime la conduite droite ainsi que la dimension sociale et judiciaire de מִשְׁפָּט.
- source_word: שְׁמֹר
  choice: garde
  rationale: L’impératif « garde » rend l’idée de préserver et de pratiquer durablement l’amour fidèle et la justice.
- source_word: וְקַוֵּה
  choice: et espère
  rationale: קוה désigne une attente confiante et pleine d’espérance. « Espère » communique naturellement cette disposition en français, tandis que la note conserve la nuance d’attente.
- source_word: אֶל אֱלֹהֶיךָ
  choice: en ton Dieu
  rationale: Avec « espérer », le français idiomatique emploie « en ». Cette formulation rend la direction personnelle exprimée par אֶל et maintient « ton Dieu ».
- source_word: תָּמִיד
  choice: constamment
  rationale: תמיד exprime la continuité. « Constamment » s’associe naturellement à l’exhortation à espérer et souligne sa permanence.
theological_decisions:
- issue: Faut-il rendre l’appel par un terme explicitement pénitentiel ?
  choice: reviens
  alternative: repens-toi
  rationale: Le contexte comporte un appel à renouer avec Dieu, mais שׁוב reste plus large qu’un terme technique de repentance. « Reviens » préserve cette portée sans réduire la tension théologique.
- issue: Comment comprendre ב dans בֵּאלֹהֶיךָ ?
  choice: par ton Dieu
  alternative: à ton Dieu / avec ton Dieu
  rationale: La construction hébraïque est inhabituelle et peut indiquer le moyen, la relation ou la direction comprise selon le contexte. Le texte principal conserve « par », tandis que la note présente les autres lectures plausibles sans trancher silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs au singulier conservent l’adresse directe. La syntaxe légèrement inhabituelle de « par ton Dieu, reviens » est volontaire et accompagnée d’une note afin de préserver l’ambiguïté réelle de l’hébreu.
