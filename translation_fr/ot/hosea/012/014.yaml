source:
  edition: WLC
  text: וּ/בְ/נָבִ֕יא הֶעֱלָ֧ה יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וּ/בְ/נָבִ֖יא נִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
translation:
  language: fr
  text: Par un prophète[a], Yahweh a fait monter Israël hors d’Égypte, et par un prophète, Israël a été gardé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte de l’exode, ce prophète est probablement Moïse.
    reason: cross_reference
  - marker: b
    text: Ou « protégé » ou « préservé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָבִיא
  choice: par un prophète
  rationale: La préposition בְּ exprime ici le moyen ou l’intermédiaire. « Par un prophète » conserve la reprise parallèle des deux membres et laisse le prophète non nommé, comme en hébreu.
- source_word: הֶעֱלָה
  choice: a fait monter
  rationale: Le hifil de עלה signifie « faire monter » ou « faire sortir en montant ». Cette formulation préserve l’expression hébraïque traditionnelle de l’exode sans la réduire à « a fait sortir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte source.
- source_word: מִמִּצְרַיִם
  choice: hors d’Égypte
  rationale: Avec « faire monter », « hors d’Égypte » exprime naturellement en français le mouvement depuis l’Égypte tout en conservant l’image de la montée.
- source_word: נִשְׁמָר
  choice: a été gardé
  rationale: 'Le nifal de שׁמר a ici un sens passif : être gardé, protégé ou préservé. « A été gardé » reste proche de la forme et de la sobriété de l’hébreu.'
theological_decisions:
- issue: Identification implicite du prophète
  choice: Maintenir « un prophète » sans le nommer dans le texte principal.
  alternative: Employer « le prophète » ou nommer Moïse.
  rationale: L’hébreu ne nomme pas explicitement Moïse et met l’accent sur la médiation prophétique. Une note permet de signaler l’identification probable sans l’imposer au texte.
- issue: Sujet implicite de נִשְׁמָר
  choice: Répéter « Israël » en français.
  alternative: Traduire littéralement par « il a été gardé », ce qui pourrait renvoyer grammaticalement à Yahweh en français.
  rationale: Le sujet sous-entendu est naturellement Israël, repris du premier membre. Le rendre explicite évite une ambiguïté française artificielle sans modifier le sens contextuel.
translation_notes:
  register: Français moderne, sobre et digne. La structure parallèle « par un prophète… par un prophète » est conservée, ainsi que l’expression imagée « faire monter hors d’Égypte ».
