  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
translation:
  language: fr
  text: Si Galaad est iniquité[a], ils ne sont assurément que néant[b]. À Guilgal, ils sacrifient des taureaux ; leurs autels aussi sont comme des tas de pierres sur les sillons des champs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Oui, Galaad n’est qu’iniquité » ; la particule hébraïque peut avoir une valeur emphatique plutôt que conditionnelle.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ils ne sont assurément que vanité », « que fausseté » ou « sans valeur » ; l’expression hébraïque, très concise, évoque le vide, la vanité ou la tromperie.'
    reason: lexical_alternative
  - marker: c
    text: L’image compare peut-être leurs nombreux autels aux tas de pierres que l’on voyait dans les champs labourés.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule peut être conditionnelle ou emphatique. « Si » conserve la forme ramassée et la tension rhétorique de l’hébreu sans imposer une seule interprétation.
- source_word: גִּלְעָד
  choice: Galaad
  rationale: Forme française traditionnelle et courante du nom de lieu biblique.
- source_word: אָוֶן
  choice: iniquité
  rationale: Le terme désigne le mal moral et peut comporter, chez les prophètes, une connotation idolâtre. « Iniquité » garde cette accusation forte sans la réduire explicitement à l’idolâtrie.
- source_word: אַךְ
  choice: assurément
  rationale: L’adverbe exprime ici une forte insistance sur le verdict qui suit.
- source_word: שָׁוְא
  choice: néant
  rationale: Le mot évoque ce qui est vide, vain, trompeur ou sans valeur. « Néant » restitue de façon concise la force du jugement tout en laissant la note signaler les autres nuances possibles.
- source_word: בַּגִּלְגָּל
  choice: À Guilgal
  rationale: Forme française usuelle du nom du lieu cultuel, avec une préposition locative naturelle.
- source_word: שְׁוָרִים זִבֵּחוּ
  choice: ils sacrifient des taureaux
  rationale: Le présent rend naturellement une pratique cultuelle dénoncée comme habituelle ; « taureaux » convient au contexte sacrificiel.
- source_word: גַּם מִזְבְּחוֹתָם
  choice: leurs autels aussi
  rationale: « Aussi » marque l’ajout ou l’intensification introduite par גַּם sans surcharger la phrase.
- source_word: כְּגַלִּים
  choice: comme des tas de pierres
  rationale: Le nom désigne des monceaux, souvent de pierres ; cette formulation rend concrète l’image agricole.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: sur les sillons des champs
  rationale: Rendu proche de l’image hébraïque, sans préciser artificiellement l’emplacement exact des tas par rapport aux sillons.
theological_decisions:
- issue: Sens de la proposition initiale אִם גִּלְעָד אָוֶן
  choice: 'Lecture conditionnelle et rhétorique : « Si Galaad est iniquité »'
  alternative: 'Lecture emphatique : « Oui, Galaad n’est qu’iniquité »'
  rationale: Dans le discours prophétique, אִם peut introduire une condition ou renforcer une affirmation. Le texte principal préserve la construction conditionnelle, tandis que la note maintient ouverte la lecture emphatique.
- issue: Référent du pluriel הָיוּ
  choice: Conserver le pronom « ils » sans expliciter son référent
  alternative: Expliciter « ses habitants » ou rapporter le pluriel aux pratiques cultuelles
  rationale: L’hébreu passe du nom singulier « Galaad » à un verbe pluriel sans nommer explicitement le référent. Ajouter « ses habitants » rendrait la phrase plus claire, mais résoudrait une ellipse authentique du texte.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste volontairement concise afin de conserver la vigueur de l’accusation prophétique et l’ambiguïté du passage du singulier « Galaad » au pluriel « ils ».
