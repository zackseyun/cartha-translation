source:
  edition: WLC
  text: וַֽ/יהוָ֖ה אֱלֹהֵ֣י הַ/צְּבָא֑וֹת יְהוָ֖ה זִכְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/006.yaml
  text: And Yahweh[b][a], the God of hosts—Yahweh is his memorial name.
translation:
  language: fr
  text: Et Yahweh[b], le Dieu des armées — Yahweh est son nom mémorial.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh est son souvenir » ou « son mémorial » ; c’est le nom par lequel il est rappelé ou invoqué.'
    reason: lexical_alternative
  - marker: b
    text: 'YHWH est traditionnellement rendu par « le SEIGNEUR » ; autre transcription possible : « Yahvé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Et Yahweh
  rationale: La conjonction וַ est rendue simplement par « Et », dans la continuité du contexte. Le nom divin יהוה est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: le Dieu des armées
  rationale: Cette formulation conserve le titre divin traditionnel et la portée collective de צְבָאוֹת, qui peut évoquer les armées célestes et, plus largement, les puissances placées sous le commandement de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La répétition du nom divin dans le texte hébreu est maintenue, car elle donne sa force à l’identification qui suit.
- source_word: זִכְרוֹ
  choice: le nom qui perpétue son souvenir
  rationale: Littéralement « son souvenir » ou « son mémorial » ; dans ce contexte, le mot désigne le nom par lequel Dieu est gardé en mémoire ou invoqué. La formulation française explicite l’implication du nom sans effacer l’image du souvenir.
theological_decisions:
- issue: Traduction du tétragramme יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le caractère de nom propre du tétragramme. Une note signale la substitution traditionnelle afin de ne pas masquer l’usage liturgique bien établi.
- issue: Rapport entre יהוה et זִכְרוֹ
  choice: Yahweh est le nom qui perpétue son souvenir
  alternative: Yahweh est son mémorial
  rationale: Le texte identifie יהוה à ce qui garde Dieu en mémoire. L’ajout explicatif de « le nom » produit un français naturel, tandis que la note conserve la formulation hébraïque plus dense et son possible rapport à l’invocation.
translation_notes:
  register: Français moderne, digne et accessible. Le tiret met en relief la répétition solennelle du nom divin. « Armées » conserve le titre biblique sans le limiter explicitement à des forces humaines.
