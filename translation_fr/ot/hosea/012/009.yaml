base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
translation:
  language: fr
  text: 'Éphraïm dit : « Certainement, je me suis enrichi ; je me suis acquis une fortune.[a] Dans tous mes gains,[b] on ne trouvera chez moi aucune faute qui soit un péché.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me suis acquis de la puissance » ; le mot hébreu peut désigner la force, les biens ou la richesse. Ici, il s’agit probablement de richesse matérielle.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans tout mon travail ». Le terme hébreu peut désigner aussi bien le labeur que ce qu’il rapporte.
    reason: lexical_alternative
  - marker: c
    text: 'Le texte hébreu de la dernière proposition est très condensé. Autre traduction possible : « Dans tous mes gains, on ne trouvera chez moi aucune faute qui puisse être considérée comme un péché. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule souligne ici l’assurance avec laquelle Éphraïm affirme sa réussite; « Oui » rend naturellement cette insistance sans lui donner un sens exclusif.
- source_word: עָשַׁרְתִּי
  choice: je me suis enrichi
  rationale: Le parfait exprime l’acquisition d’un état de richesse; cette formulation conserve la valeur résultative.
- source_word: אוֹן
  choice: une fortune
  rationale: Dans ce contexte commercial, le mot désigne probablement des biens ou une richesse matérielle, tout en pouvant ailleurs signifier la force.
- source_word: כָּל יְגִיעַי
  choice: tout le fruit de mon travail
  rationale: יְגִיעַ peut désigner le labeur ou ce qu’il rapporte. La formulation française privilégie ici les gains, cohérents avec le contexte, tout en signalant l’autre possibilité en note.
- source_word: יִמְצְאוּ לִי
  choice: on ne trouvera chez moi
  rationale: Le pluriel indéfini hébreu se rend naturellement par « on »; « chez moi » garde l’idée qu’aucune culpabilité ne pourrait être relevée à son encontre.
- source_word: עָוֺן
  choice: faute
  rationale: Le terme peut exprimer la faute, l’iniquité ou la culpabilité. « Faute » est clair en français moderne et permet de conserver la distinction tendue avec חֵטְא.
- source_word: אֲשֶׁר חֵטְא
  choice: qui soit un péché
  rationale: La proposition hébraïque est concise et difficile. Cette traduction préserve sa qualification appositionnelle sans expliquer trop précisément la logique autojustificatrice d’Éphraïm.
theological_decisions:
- issue: Point de vue du locuteur et ironie morale
  choice: Présenter les paroles comme l’affirmation pleine d’assurance et autojustificatrice d’Éphraïm, sans la cautionner.
  alternative: Expliciter dans le texte qu’Éphraïm se trompe ou cherche à se justifier.
  rationale: L’hébreu rapporte directement les paroles d’Éphraïm. Le contexte prophétique en révèle la portée ironique; la traduction ne doit pas introduire ce jugement dans la citation elle-même.
- issue: Rapport entre עָוֺן et חֵטְא
  choice: « aucune faute qui soit un péché »
  alternative: « aucune faute qui puisse m’être imputée comme péché » ou « aucune faute constituant un péché »
  rationale: La formulation garde la tension du texte, où Éphraïm nie qu’une faute qualifiable de péché soit décelable dans ses gains, sans imposer une distinction doctrinale rigide entre faute et péché.
translation_notes:
  register: Français international moderne, naturel et digne. La citation conserve l’assurance d’Éphraïm et la formulation volontairement tendue de sa dénégation, tandis que les principales ambiguïtés lexicales et syntaxiques sont indiquées en notes.
