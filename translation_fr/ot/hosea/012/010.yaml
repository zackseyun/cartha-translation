    issue: Rendu de בָאֳהָלִים par « sous des tentes »
    rationale: Le préfixe hébreu ב indique le lieu où l’on habite (« dans des tentes »). En français, « sous des tentes » peut se comprendre, mais décrit plus volontiers une situation abritée qu’une résidence dans des tentes.
  - severity: low
    issue: Formulation de l’alternative dans la note
    rationale: « La fête fixée » est peu idiomatique en français moderne. « Une fête prescrite » exprime plus naturellement la lecture cultuelle possible de מוֹעֵד, tout en laissant ouverte l’identification à la fête des Tentes.
