id: HOS.12.10
reference: Hosea 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם עֹ֛ד אוֹשִֽׁיבְ/ךָ֥ בָ/אֳהָלִ֖ים כִּ/ימֵ֥י מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
translation:
  language: fr
  text: Pourtant, moi, je suis Yahweh, ton Dieu, depuis le pays d’Égypte. Je te ferai de nouveau habiter dans des tentes, comme aux jours du temps fixé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme aux jours d’une fête prescrite ». Le mot hébreu peut désigner un temps fixé ou une fête. La mention des tentes peut faire allusion à la fête des Tentes, durant laquelle Israël habitait dans des abris temporaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Pourtant, moi, je
  rationale: Le pronom אָנֹכִי est emphatique; « moi » rend cette insistance, tandis que « pourtant » exprime la valeur adversative possible de la conjonction dans le contexte de reproche.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement la désignation d’alliance et le suffixe masculin singulier de deuxième personne.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: depuis le pays d’Égypte
  rationale: « Depuis » préserve ici la nuance temporelle possible de מִן et rappelle que Yahweh est le Dieu d’Israël depuis l’Exode, sans effacer la référence géographique.
- source_word: עֹד
  choice: de nouveau
  rationale: 'Avec le verbe au futur, le terme indique naturellement la répétition: Dieu fera encore habiter Israël sous des tentes.'
- source_word: אוֹשִׁיבְךָ
  choice: Je te ferai habiter
  rationale: La tournure causative rend le hiphil de ישׁב sans l’aplatir en simple « tu habiteras ».
- source_word: בָאֳהָלִים
  choice: sous des tentes
  rationale: Expression française naturelle pour l’habitation en tente; elle conserve le sens concret sans introduire dans le texte principal le nom traditionnel d’une fête.
- source_word: כִּימֵי מוֹעֵד
  choice: comme aux jours du temps fixé
  rationale: Cette formulation garde la comparaison et l’ambiguïté de מוֹעֵד entre temps fixé et fête prescrite; la note expose la possibilité cultuelle.
theological_decisions:
- issue: S’agit-il principalement d’une promesse, d’une menace ou d’un renversement ironique?
  choice: 'Formulation neutre: « Je te ferai de nouveau habiter sous des tentes »'
  alternative: Préciser soit un renouvellement bienveillant de l’expérience de l’Exode, soit une menace d’exil et de privation
  rationale: L’hébreu annonce l’action sans marque évaluative explicite. La formulation conserve donc la tension entre restauration, jugement et rappel du désert ou de la fête.
- issue: Identification de מוֹעֵד avec la fête des Tentes
  choice: Ne pas nommer explicitement la fête dans le texte principal
  alternative: « comme aux jours de la fête des Tentes »
  rationale: La proximité de « tentes » rend l’allusion plausible, mais מוֹעֵד reste lexicalement plus large; l’identification précise appartient donc à la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier respecte les formes hébraïques adressées à Israël. « Yahweh » conserve le nom divin; « temps fixé » maintient dans le texte l’ambiguïté de מוֹעֵד.
