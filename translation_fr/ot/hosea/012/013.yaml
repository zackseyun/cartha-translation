  yaml_path: translation/ot/hosea/012/013.yaml
  text: Jacob fled to the field of Aram[a]; Israel served for a wife[b], and for a wife he kept watch.
translation:
  language: fr
  text: Jacob s’enfuit vers la campagne d’Aram[a] ; Israël servit pour une femme, et pour une femme il veilla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le champ d’Aram ». On peut aussi traduire : « le territoire d’Aram » ou « la campagne d’Aram ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il garda » ou « il veilla sur ». Dans le contexte de Jacob et de Laban, le verbe peut évoquer la garde ou le soin des troupeaux, sans que ceux-ci soient nommés dans le verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: Le verbe ברח exprime la fuite. « S’enfuit » est naturel et conserve la force narrative sans préciser davantage le motif.
- source_word: שְׂדֵה אֲרָם
  choice: dans la campagne d’Aram
  rationale: שָׂדֶה signifie littéralement « champ » et peut désigner la campagne ou le territoire d’une région. « Campagne d’Aram » conserve l’image tout en étant idiomatique en français.
- source_word: וַיַּעֲבֹד
  choice: travailla
  rationale: עבד peut signifier « servir » ou « travailler ». Ici, le travail accompli chez Laban est visé ; « travailla » rend clairement ce sens en français courant.
- source_word: בְּאִשָּׁה
  choice: pour obtenir une femme
  rationale: 'Dans ce contexte, la préposition ב a une valeur de but ou de compensation : Jacob travaille afin d’obtenir une épouse. « Femme » préserve toutefois la gamme sémantique de אִשָּׁה.'
- source_word: וּבְאִשָּׁה
  choice: et, pour une femme
  rationale: La répétition hébraïque est conservée pour maintenir le parallélisme et l’insistance rhétorique du verset.
- source_word: שָׁמָר
  choice: il garda les troupeaux
  rationale: שׁמר signifie « garder, surveiller, veiller sur ». Le complément « les troupeaux », implicite dans le récit de Jacob et Laban, permet une formulation française naturelle ; une note signale cet apport contextuel.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacob / Israël
  rationale: L’alternance intentionnelle des deux noms est maintenue, car elle relie le patriarche au peuple qui descend de lui sans effacer la variation du texte.
theological_decisions:
- issue: Maintien de l’alternance Jacob/Israël
  choice: Conserver distinctement les deux noms dans le texte principal
  alternative: Uniformiser le verset avec seulement « Jacob » ou seulement « Israël »
  rationale: L’hébreu passe délibérément de Jacob à Israël, ce qui peut évoquer à la fois le patriarche et la nation. La traduction ne doit pas aplanir cette tension.
- issue: Interprétation contextuelle de שָׁמָר
  choice: Expliciter la garde des troupeaux tout en la signalant en note
  alternative: Traduire sans complément par « il veilla » ou « il garda »
  rationale: Le contexte de Genèse 29–31 indique le soin des troupeaux, mais le nom « troupeaux » n’est pas exprimé dans ce verset hébreu. La note préserve cette distinction entre texte et explicitation contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et l’alternance des noms sont conservés ; la ponctuation rend la répétition intelligible sans la supprimer.
