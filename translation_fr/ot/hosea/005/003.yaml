language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִי֙ יָדַ֣עְתִּי אֶפְרַ֔יִם וְ/יִשְׂרָאֵ֖ל לֹֽא נִכְחַ֣ד מִמֶּ֑/נִּי כִּ֤י עַתָּה֙ הִזְנֵ֣יתָ אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
translation:
  language: fr
  text: Moi, je connais Éphraïm, et Israël ne m’est pas caché. Car maintenant, Éphraïm, tu t’es prostitué[a] ; Israël est devenu impur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie l’image de la prostitution pour parler de l’infidélité envers Dieu.
    reason: Explication de la métaphore prophétique.
  - marker: b
    text: 'Autre traduction possible : « Israël est souillé. »'
    reason: Variante lexicale exprimant l’état résultant.
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: je connais
  rationale: Bien que la forme hébraïque soit un accompli, elle exprime ici la connaissance certaine et actuelle que Dieu a d’Éphraïm. Le présent français rend naturellement cette valeur.
- source_word: נִכְחַד מִמֶּנִּי
  choice: ne m’est pas caché
  rationale: Cette formulation conserve le passif du nifal et l’idée qu’Israël ne demeure nullement dissimulé au regard de Dieu, sans ajouter une nuance de possibilité absente du texte.
- source_word: כִּי עַתָּה
  choice: car maintenant
  rationale: « Car » maintient le lien explicatif introduit par כִּי, tandis que « maintenant » conserve l’accent temporel de עַתָּה.
- source_word: הִזְנֵיתָ
  choice: tu t’es prostitué
  rationale: La traduction garde l’image volontairement crue de la prostitution, employée chez Osée pour évoquer l’infidélité d’Éphraïm envers Dieu, plutôt que de la réduire à la notion générale d’infidélité.
- source_word: נִטְמָא
  choice: est devenu impur
  rationale: Le nifal accompli décrit l’entrée dans un état d’impureté et son résultat présent. « Est devenu impur » préserve cette progression ainsi que la portée morale et cultuelle du terme.
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: Éphraïm / Israël
  rationale: 'Les deux noms sont conservés afin de respecter le parallélisme et la nuance prophétique : chez Osée, Éphraïm désigne souvent le royaume du Nord, sans être simplement interchangeable avec Israël dans chaque occurrence.'
theological_decisions:
- issue: Force métaphorique du langage sexuel appliqué à l’infidélité envers Dieu
  choice: Conserver explicitement l’image de la prostitution dans le texte principal.
  alternative: Employer une formulation générale telle que « tu as été infidèle ».
  rationale: L’image sexuelle appartient au langage théologique central d’Osée et donne à l’accusation sa force. La neutraliser ferait disparaître une dimension intentionnelle du texte.
- issue: Valeur temporelle de la connaissance divine
  choice: Employer le présent « je connais ».
  alternative: Traduire par « j’ai connu » ou « je connaissais ».
  rationale: Dans ce contexte, l’accompli hébreu exprime une connaissance établie qui vaut au moment de la déclaration. Le présent français souligne cette connaissance actuelle sans nier la forme hébraïque.
- issue: Rapport entre impureté morale et impureté cultuelle
  choice: Garder le terme englobant « impur ».
  alternative: Préciser exclusivement « moralement souillé » ou « rituellement impur ».
  rationale: Le vocabulaire hébreu peut faire résonner ensemble les dimensions morale et cultuelle. La traduction ne tranche donc pas une tension que le verset laisse ouverte.
translation_notes:
  register: Français international contemporain, digne et direct. L’ouverture « Moi, je connais » restitue l’insistance du pronom hébreu explicite. Le tutoiement adressé à Éphraïm préserve le passage soudain de la déclaration à l’interpellation, et les deux noms sont maintenus pour conserver le parallélisme.
