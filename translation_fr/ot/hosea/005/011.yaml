  text: עָשׁ֥וּק אֶפְרַ֖יִם רְצ֣וּץ מִשְׁפָּ֑ט כִּ֣י הוֹאִ֔יל הָלַ֖ךְ אַחֲרֵי צָֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/011.yaml
  text: Ephraim is oppressed, crushed in judgment, because he was determined to walk after filth.
translation:
  language: fr
  text: 'Éphraïm est opprimé,

    écrasé par le jugement,

    car il a résolu de suivre une prescription[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « prescription » est obscur dans ce contexte. Il peut désigner un ordre imposé; certaines traductions, suivant une autre lecture ou une correction du texte, parlent plutôt d’idoles ou de souillure.
    reason: Signaler une difficulté textuelle et lexicale réelle sans substituer une conjecture à la leçon du texte massorétique.
lexical_decisions:
- source_word: עָשׁוּק
  choice: opprimé
  rationale: Le participe passif décrit Éphraïm comme victime d’oppression; « opprimé » conserve directement cette valeur.
- source_word: רְצוּץ מִשְׁפָּט
  choice: écrasé par le jugement
  rationale: רְצוּץ signifie « écrasé, broyé ». מִשְׁפָּט peut désigner le jugement judiciaire qui frappe Éphraïm; la formulation française conserve cette tension sans préciser indûment l’agent.
- source_word: הוֹאִיל הָלַךְ
  choice: il a résolu de suivre
  rationale: הוֹאִיל exprime ici le consentement volontaire ou la détermination, tandis que הָלַךְ אַחֲרֵי forme l’idée de suivre. Cette tournure rend la volonté engagée d’Éphraïm.
- source_word: צָו
  choice: une prescription
  rationale: Le mot signifie normalement « ordre, commandement, prescription », mais son emploi ici est difficile et peut viser une directive humaine ou idolâtre. « Prescription » garde le sens lexical sans identifier abusivement son contenu.
theological_decisions:
- issue: Nature de ce qu’Éphraïm a suivi
  choice: une prescription, avec une note signalant l’obscurité du texte
  alternative: « des idoles », « la souillure » ou « l’ordure »
  rationale: Le texte consonantique massorétique porte צָו, généralement rattaché à l’idée d’ordre ou de prescription. Les traductions évoquant les idoles ou la souillure reposent sur une autre compréhension ou sur une correction conjecturale; elles ne doivent pas remplacer silencieusement la leçon transmise.
- issue: Sens de מִשְׁפָּט
  choice: le jugement
  alternative: « en justice » ou « son droit est brisé »
  rationale: La construction est concise et susceptible de plusieurs analyses. « Écrasé par le jugement » s’accorde au contexte de condamnation tout en conservant la force judiciaire du terme.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme est rendu sur trois lignes. « Éphraïm » conserve l’accent traditionnel; « écrasé » exprime vigoureusement l’image hébraïque sans archaïsme.
