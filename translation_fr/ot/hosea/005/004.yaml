source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
translation:
  language: fr
  text: Leurs actes ne leur permettent pas de revenir à leur Dieu, car un esprit de prostitution[a] est en eux, et ils ne connaissent pas Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de débauche » ou « un esprit d’infidélité sexuelle ». L’hébreu emploie l’image de l’infidélité sexuelle pour parler de l’infidélité à l’alliance et de l’idolâtrie.
    reason: Alternative lexicale et explicitation de la métaphore prophétique.
lexical_decisions:
- source_word: יִתְּנוּ
  choice: ne leur permettent pas
  rationale: Dans la tournure « ne pas donner … de revenir », le verbe נתן exprime ici l’idée de ne pas permettre ou de ne pas laisser la possibilité. Cette formulation restitue naturellement l’idiome hébreu.
- source_word: מַעַלְלֵיהֶם
  choice: leurs actes
  rationale: Le nom désigne leurs agissements ou leurs œuvres. « Actes » est courant, sobre et conserve la portée morale de l’accusation prophétique.
- source_word: לָשׁוּב
  choice: revenir
  rationale: שׁוב évoque à la fois le retour et le repentir compris comme retour à Dieu. « Revenir » préserve cette richesse sans expliciter excessivement.
- source_word: אֶל אֱלֹהֵיהֶם
  choice: à leur Dieu
  rationale: Bien que אֱלֹהִים puisse être singulier ou pluriel, le contexte de l’alliance désigne ici le Dieu d’Israël, dont le peuple s’est détourné.
- source_word: רוּחַ זְנוּנִים
  choice: un esprit de prostitution
  rationale: La formule emploie l’infidélité sexuelle comme image de l’idolâtrie et de l’infidélité à l’alliance. « Prostitution » reste fort et intelligible en français moderne.
- source_word: בְּקִרְבָּם
  choice: est en eux
  rationale: L’expression peut signifier « au milieu d’eux » ou « en eux ». Ici, elle présente l’infidélité comme une disposition intérieure au peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לֹא יָדָעוּ
  choice: ils ne connaissent pas
  rationale: Le verbe ידע peut inclure une connaissance relationnelle propre à l’alliance. La traduction directe maintient cette profondeur sans la réduire à « reconnaître » ou « obéir ».
theological_decisions:
- issue: Image prophétique de l’infidélité sexuelle
  choice: « un esprit de prostitution »
  alternative: « un esprit de débauche » ou « un esprit d’infidélité sexuelle »
  rationale: « Prostitution » conserve la vigueur de l’image par laquelle Osée dénonce l’idolâtrie et la rupture de l’alliance, tandis que la note en précise la portée métaphorique.
- issue: Sens relationnel de « connaître »
  choice: « ils ne connaissent pas Yahweh »
  alternative: « ils ne reconnaissent pas Yahweh »
  rationale: La formulation littérale laisse subsister la tension entre connaissance, relation d’alliance et fidélité, sans imposer une seule explication.
- issue: Référent de אֱלֹהֵיהֶם
  choice: 'singulier : « leur Dieu »'
  alternative: 'pluriel : « leurs dieux »'
  rationale: Dans le procès d’alliance développé par Osée, il s’agit du retour au Dieu d’Israël dont le peuple s’est éloigné.
translation_notes:
  register: Français international moderne, naturel et digne. La structure causale et le parallélisme de l’hébreu sont conservés. « Prostitution » maintient la force de l’image sans recourir à un terme vieilli.
