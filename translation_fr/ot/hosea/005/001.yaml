  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
translation:
  language: fr
  text: Écoutez ceci, prêtres ! Maison d’Israël, soyez attentifs ! Maison du roi, prêtez l’oreille ! Car le jugement vous concerne[a], puisque vous avez été un piège à Mitspa et un filet tendu sur le Tabor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le jugement est contre vous ». L’expression hébraïque, très concise, peut signifier que le jugement les concerne ou qu’il est dirigé contre eux.'
    reason: alternative_reading
  - marker: b
    text: Mitspa et le Tabor sont des noms de lieux, probablement évoqués ici comme des sites bien connus d’Israël auxquels est associée l’image de la capture.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif courant de שׁמע ; « Écoutez » introduit naturellement la sommation prophétique.
- source_word: הַקְשִׁיבוּ
  choice: Sois attentive
  rationale: Rend l’appel intensifié à l’attention tout en accordant l’impératif avec le collectif féminin « maison d’Israël » en français.
- source_word: הַאֲזִינוּ
  choice: Prête l’oreille
  rationale: Conserve un troisième impératif auditif distinct et le crescendo rhétorique de l’hébreu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Maintient l’expression collective et représentative de l’hébreu.
- source_word: בֵּית הַמֶּלֶךְ
  choice: maison du roi
  rationale: Préserve le parallélisme avec « maison d’Israël » et ne tranche pas entre cour, famille et dynastie royales.
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  choice: Car le jugement vous concerne
  rationale: La formulation française reste concise et conserve l’ambiguïté entre un jugement qui les concerne et un jugement dirigé contre eux.
- source_word: הַמִּשְׁפָּט
  choice: le jugement
  rationale: Dans cette accusation prophétique, le terme possède une portée judiciaire que « jugement » restitue sans surinterprétation.
- source_word: פַח
  choice: un piège
  rationale: Terme moderne et clair pour un dispositif destiné à capturer une proie.
- source_word: לְמִצְפָּה
  choice: à Mitspa
  rationale: Le lamed devant le nom de lieu est compris ici dans un sens locatif ; le toponyme est translittéré selon l’usage français.
- source_word: רֶשֶׁת פְּרוּשָׂה
  choice: un filet tendu
  rationale: Expression française naturelle qui conserve l’image concrète du filet déployé.
- source_word: עַל תָּבוֹר
  choice: sur le Tabor
  rationale: Rend la préposition et emploie la forme française usuelle du nom de la montagne.
theological_decisions:
- issue: Portée de la déclaration judiciaire adressée aux trois groupes
  choice: Le jugement les concerne et, dans le contexte accusateur, les met en cause.
  alternative: « Le jugement est contre vous », formulation qui explicite directement la condamnation.
  rationale: La construction hébraïque compacte peut désigner soit l’objet d’une affaire judiciaire, soit ses destinataires adverses. Le contexte indique la culpabilité, mais le texte principal conserve la tension sémantique.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Les trois verbes d’écoute sont différenciés pour reproduire la progression rhétorique. L’accord au singulier féminin avec « maison » donne une apostrophe naturelle en français, tandis que les groupes visés restent collectifs.
