  source_fidelity: 'Le sens général est fidèle au texte hébreu : les prêtres, la maison d’Israël et la maison du roi sont interpellés; le משפט est formulé de manière volontairement compacte; les images du piège à Mitspa et du filet déployé sur le Tabor sont conservées. Toutefois, les deuxième et troisième impératifs hébreux sont au pluriel et visent les membres collectifs des « maisons ».'
  naturalness: Le français est globalement moderne et soutenu. Cependant, « Sois attentive » et « Prête l’oreille » au singulier créent une discordance avec les impératifs pluriels de l’original et avec le pronom pluriel « vous » de la suite. La reformulation avec les apostrophes placées avant les impératifs est plus naturelle.
