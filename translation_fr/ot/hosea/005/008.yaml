base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
translation:
  language: fr
  text: 'Sonnez du cor à Guibéa, de la trompette à Rama ! Poussez le cri d’alarme à Beth-Aven[a] : « Derrière toi[b], Benjamin ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Aven est probablement un nom polémique donné à Béthel ; il évoque la « maison du mal » ou la « maison de la vanité ».
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « Derrière toi, Benjamin ! » Le contexte peut suggérer : « L’ennemi est derrière toi, Benjamin ! », mais le texte ne nomme pas l’ennemi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Sonnez
  rationale: Impératif pluriel de תקע dans le contexte d’un signal donné avec un instrument. « Sonnez du cor » est une tournure française naturelle et restitue l’action sans lourdeur.
- source_word: שׁוֹפָר
  choice: cor
  rationale: Désigne un instrument fait d’une corne, distinct de חֲצֹצְרָה dans le membre parallèle. « Cor » maintient cette distinction lexicale.
- source_word: בַּגִּבְעָה
  choice: à Guibéa
  rationale: Le préfixe ב est rendu naturellement par « à » devant ce nom de ville.
- source_word: חֲצֹצְרָה
  choice: trompette
  rationale: Désigne une trompette distincte du שׁוֹפָר. Le verbe « sonnez » est sous-entendu par parallélisme en hébreu et demeure aisément compris en français.
- source_word: בָּרָמָה
  choice: à Rama
  rationale: Le préfixe ב est rendu par « à », parallèlement à « à Guibéa ».
- source_word: הָרִיעוּ
  choice: Poussez le cri d’alarme
  rationale: L’impératif hiphil de ריע exprime ici un cri ou signal sonore urgent dans un contexte de menace militaire. « Cri d’alarme » communique clairement cette fonction.
- source_word: בֵּית אָוֶן
  choice: Beth-Aven
  rationale: Le toponyme est translittéré plutôt que remplacé par son interprétation probable. Sa portée polémique est signalée en note.
- source_word: אַחֲרֶיךָ
  choice: À tes trousses
  rationale: L’expression hébraïque abrupte signifie littéralement « derrière toi/après toi ». Dans ce contexte d’alarme, « à tes trousses » conserve l’exclamation elliptique et suggère naturellement une menace poursuivante, sans ajouter explicitement « l’ennemi ».
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Le nom désigne ici vraisemblablement la tribu ou son territoire, interpellé au singulier. La forme française traditionnelle est conservée.
theological_decisions:
- issue: Portée polémique de בֵּית אָוֶן
  choice: Conserver « Beth-Aven » dans le texte et expliquer en note son probable jeu polémique sur Béthel.
  alternative: Traduire « maison du mal/de la vanité » ou remplacer directement le nom par « Béthel ».
  rationale: Le texte porte un toponyme, mais son choix semble chargé de polémique religieuse. La translittération préserve la forme du texte, tandis que la note maintient l’allusion sans l’imposer comme substitution certaine.
- issue: Référent implicite de אַחֲרֶיךָ
  choice: Conserver une formule elliptique, « À tes trousses, Benjamin ! »
  alternative: 'Expliciter : « L’ennemi est derrière toi, Benjamin ! »'
  rationale: L’hébreu ne nomme pas l’ennemi. La formulation retenue rend l’urgence et le sens contextuel tout en préservant cette ellipse et l’ambiguïté grammaticale.
translation_notes:
  register: Français international actuel, solennel et direct. Les impératifs brefs et la ponctuation énergique rendent l’urgence militaire. « Cor » et « trompette » préservent la distinction entre les deux instruments ; l’expression idiomatique « à tes trousses » garde la brusquerie de l’hébreu sans expliciter indûment le sujet menaçant.
