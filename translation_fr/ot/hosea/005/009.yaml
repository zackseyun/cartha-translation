source:
  edition: WLC
  text: אֶפְרַ֨יִם֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה בְּ/י֖וֹם תּֽוֹכֵחָ֑ה בְּ/שִׁבְטֵי֙ יִשְׂרָאֵ֔ל הוֹדַ֖עְתִּי נֶאֱמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/009.yaml
  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
translation:
  language: fr
  text: Éphraïm deviendra une désolation[a] au jour de la réprimande[b] ; parmi les tribus d’Israël, j’ai fait connaître ce qui est certain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deviendra un objet d’effroi ». Le terme hébreu peut désigner une dévastation qui suscite la stupeur ou l’horreur.
    reason: lexical_alternative
  - marker: b
    text: Ou « au jour du châtiment » ou « au jour du jugement ».
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « j’ai fait connaître une annonce digne de foi ». La formule souligne la certitude et la fiabilité du jugement annoncé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé, sans expliciter dans le texte son emploi métonymique fréquent pour le royaume du Nord.
- source_word: לְשַׁמָּה תִהְיֶה
  choice: sera dévasté
  rationale: Cette formulation française naturelle exprime l’entrée d’Éphraïm dans un état de dévastation. La note conserve l’autre nuance possible du nom שַׁמָּה, celle d’un spectacle effroyable.
- source_word: בְּיוֹם תּוֹכֵחָה
  choice: au jour de la réprimande
  rationale: « Réprimande » reste proche du sens premier de תּוֹכֵחָה tout en laissant le contexte prophétique donner à cette intervention sa portée punitive et judiciaire.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: parmi les tribus d’Israël
  rationale: 'La préposition ב est comprise dans un sens locatif ou sphérique : au sein des tribus d’Israël.'
- source_word: הוֹדַעְתִּי
  choice: j’ai fait connaître
  rationale: Le hiphil de ידע signifie « faire connaître » ou « annoncer ». Le passé composé rend l’accompli hébreu comme une déclaration déjà faite et toujours pertinente.
- source_word: נֶאֱמָנָה
  choice: ce qui est certain
  rationale: Le terme, issu de la racine אמן, évoque ce qui est ferme, fiable et assuré. Employé ici substantivement, il qualifie le contenu certain de l’annonce divine.
theological_decisions:
- issue: Faut-il expliciter qu’Éphraïm désigne le royaume du Nord ?
  choice: Conserver « Éphraïm » sans développement explicatif
  alternative: « le royaume du Nord » ou « Israël »
  rationale: Le texte hébreu nomme directement Éphraïm. Son emploi représentatif ressort du contexte et ne doit pas être imposé par une paraphrase dans le corps du texte.
- issue: Quelle force judiciaire donner à תּוֹכֵחָה ?
  choice: « réprimande »
  alternative: « châtiment » ou « jugement »
  rationale: Le contexte implique bien une sanction, mais le nom désigne d’abord une réprimande ou une correction. Le choix principal préserve cette tension lexicale ; la note signale les rendus contextuels possibles.
- issue: Comment comprendre נֶאֱמָנָה dans la dernière proposition ?
  choice: 'Le prendre substantivement : « ce qui est certain »'
  alternative: '« une annonce digne de foi » ou une valeur adverbiale : « je l’ai fait connaître avec certitude »'
  rationale: La forme féminine peut caractériser une chose ou une déclaration sous-entendue. Le rendu retenu conserve l’accent sur la certitude et la fiabilité du jugement annoncé sans préciser davantage le substantif implicite.
translation_notes:
  register: Français international moderne, sobre et prophétique. La ponctuation met en relief les deux propositions sans ajouter de lien logique absent de l’hébreu. Les notes préservent les principales nuances lexicales et syntaxiques.
