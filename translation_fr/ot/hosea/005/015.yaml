reference: Hosea 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵלֵ֤ךְ אָשׁ֨וּבָה֙ אֶל מְקוֹמִ֔/י עַ֥ד אֲשֶֽׁר יֶאְשְׁמ֖וּ וּ/בִקְשׁ֣וּ פָנָ֑/י בַּ/צַּ֥ר לָ/הֶ֖ם יְשַׁחֲרֻֽ/נְנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
translation:
  language: fr
  text: Je m’en irai, je retournerai à ma place, jusqu’à ce qu’ils reconnaissent leur culpabilité[a] et cherchent ma face. Dans leur détresse, ils me chercheront avec empressement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « portent leur faute » ou « soient reconnus coupables ». Le verbe hébreu peut désigner la culpabilité encourue ou sa reconnaissance ; le contexte de la recherche du Seigneur favorise ici « reconnaissent leur culpabilité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « me chercheront dès l’aube ». L’expression hébraïque évoque probablement une recherche diligente et ardente plutôt que seulement matinale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ
  choice: Je m’en irai
  rationale: Le qal à la première personne exprime un départ. « Je m’en irai » s’accorde naturellement avec le mouvement de retrait suivi du retour à « ma place ».
- source_word: אָשׁוּבָה
  choice: je retournerai
  rationale: שׁוב signifie couramment « retourner » ou « revenir ». Ici, le complément « à ma place » favorise « retourner ».
- source_word: מְקוֹמִי
  choice: ma place
  rationale: La traduction littérale préserve l’image spatiale du retrait divin sans préciser s’il s’agit d’une demeure particulière.
- source_word: עַד אֲשֶׁר
  choice: jusqu’à ce que
  rationale: Cette locution introduit le terme temporel du retrait.
- source_word: יֶאְשְׁמוּ
  choice: ils reconnaissent leur culpabilité
  rationale: Le verbe אשם peut exprimer le fait d’être coupable, de porter sa faute ou de s’en reconnaître coupable. Les démarches qui suivent — chercher la face de Dieu et le chercher avec empressement — favorisent ici la reconnaissance de la culpabilité, tout en justifiant une note sur l’ambiguïté.
- source_word: וּבִקְשׁוּ פָנַי
  choice: et cherchent ma face
  rationale: Cette formulation conserve l’image hébraïque de la recherche de la présence ou de la faveur de Dieu, qui reste compréhensible en français biblique moderne.
- source_word: בַּצַּר לָהֶם
  choice: Dans leur détresse
  rationale: 'La tournure hébraïque désigne la circonstance dans laquelle ils se trouvent : au moment de leur détresse.'
- source_word: יְשַׁחֲרֻנְנִי
  choice: ils me chercheront avec empressement
  rationale: Au piel, שׁחר peut évoquer une recherche matinale, mais exprime souvent une recherche diligente et ardente. « Avec empressement » communique cette intensité sans imposer un sens strictement horaire.
theological_decisions:
- issue: Portée du retrait divin
  choice: Présenter Dieu comme se retirant jusqu’à ce que le peuple se tourne vers lui, sans définir la nature métaphysique de cette absence.
  alternative: Interpréter la phrase comme un abandon total, ou seulement comme un changement de perception humaine.
  rationale: Les verbes de mouvement et l’expression « ma place » mettent en scène un retrait relationnel et judiciaire. La traduction conserve cette tension sans lui superposer une explication doctrinale.
- issue: Valeur de יֶאְשְׁמוּ
  choice: « reconnaissent leur culpabilité » dans le texte, avec les autres sens possibles en note.
  alternative: « portent leur faute » ou « soient reconnus coupables ».
  rationale: Le contexte immédiat de recherche de Dieu favorise une prise de conscience ou un aveu de culpabilité, mais la polysémie du verbe doit rester visible.
translation_notes:
  register: Français international moderne, digne et accessible. L’expression biblique « chercher ma face » est conservée pour préserver l’image hébraïque ; « avec empressement » rend naturellement l’intensité du dernier verbe.
