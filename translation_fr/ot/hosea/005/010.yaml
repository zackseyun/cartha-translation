id: HOS.5.10
reference: Hosea 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָיוּ֙ שָׂרֵ֣י יְהוּדָ֔ה כְּ/מַסִּיגֵ֖י גְּב֑וּל עֲלֵי/הֶ֕ם אֶשְׁפּ֥וֹךְ כַּ/מַּ֖יִם עֶבְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/010.yaml
  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
translation:
  language: fr
  text: Les princes de Juda sont devenus comme ceux qui déplacent une borne[a] ; sur eux, je déverserai ma fureur comme de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme ceux qui repoussent une limite ». L’image peut désigner littéralement le déplacement de bornes de propriété ou, au sens figuré, la violation de limites fixées par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיוּ
  choice: sont devenus
  rationale: Le qatal de היה peut exprimer l’aboutissement à un état. « Sont devenus » rend ici l’accusation prophétique avec naturel.
- source_word: שָׂרֵי יְהוּדָה
  choice: les princes de Juda
  rationale: שָׂרִים désigne des gouvernants, princes ou hauts responsables. « Princes » conserve la portée politique et le registre élevé du texte.
- source_word: כְּמַסִּיגֵי גְּבוּל
  choice: comme ceux qui déplacent une borne
  rationale: L’expression évoque le déplacement illicite d’une limite de propriété. Cette formulation garde l’image concrète sans en imposer une interprétation exclusivement littérale.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: Rendu direct de la préposition et du pronom, qui désignent les destinataires du jugement.
- source_word: אֶשְׁפּוֹךְ
  choice: je déverserai
  rationale: Le verbe שׁפך décrit l’action de verser en abondance. « Déverser » convient à l’image liquide et au contexte de jugement.
- source_word: כַּמַּיִם
  choice: comme de l’eau
  rationale: Le texte dit simplement « comme l’eau » et n’explicite pas une inondation. La traduction conserve cette comparaison sobre.
- source_word: עֶבְרָתִי
  choice: ma fureur
  rationale: עֶבְרָה désigne une colère intense. « Fureur » est naturel en français prophétique et préserve la force du terme.
theological_decisions:
- issue: Nature de l’accusation portée contre les dirigeants de Juda
  choice: Maintenir l’image concrète du déplacement d’une borne tout en laissant ouverte sa portée métaphorique.
  alternative: Préciser qu’il s’agit soit d’une spoliation foncière littérale, soit d’une violation des limites fixées par Dieu, soit d’un empiètement politique.
  rationale: L’hébreu évoque une infraction connue liée aux limites de propriété, mais son application dans Osée peut être plus large. Le texte principal préserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. « Borne » restitue de façon concise l’image foncière ; « déverserai ma fureur » conserve la vigueur du jugement prophétique et la comparaison avec l’eau.
