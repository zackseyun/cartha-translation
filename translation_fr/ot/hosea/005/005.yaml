  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/יִשְׂרָאֵ֣ל וְ/אֶפְרַ֗יִם יִכָּֽשְׁלוּ֙ בַּ/עֲוֺנָ֔/ם כָּשַׁ֥ל גַּם יְהוּדָ֖ה עִמָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
translation:
  language: fr
  text: L’orgueil d’Israël témoigne contre lui[a] ; Israël et Éphraïm trébucheront dans leur faute[b], et Juda aussi a trébuché avec eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « La majesté d’Israël témoigne à sa face » ou « devant lui ». L’hébreu emploie littéralement une expression spatiale ; le texte principal en donne le sens judiciaire probable.'
    reason: lexical_alternative
  - marker: b
    text: « Dans leur faute » peut aussi se traduire par « dans leur iniquité » ou « à cause de leur faute ».
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi traduire : « Juda aussi trébuchera avec eux » ou « Juda aussi trébuche avec eux ». La forme verbale hébraïque diffère de celle de la proposition précédente et sa valeur temporelle peut être comprise de plusieurs façons.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  choice: témoigne
  rationale: Dans ce contexte d’accusation, le verbe exprime vraisemblablement le témoignage à charge. « Témoigne » restitue naturellement en français la portée judiciaire du tour hébreu.
- source_word: גְאוֹן
  choice: orgueil
  rationale: Le contexte de faute et de chute favorise le sens moral négatif d’orgueil plutôt que celui, neutre ou positif, de majesté.
- source_word: בְּפָנָיו
  choice: contre lui
  rationale: Littéralement « à sa face » ou « devant lui ». Avec « témoigne », « contre lui » rend le sens judiciaire probable, tandis que la note conserve l’image spatiale.
- source_word: יִשְׂרָאֵל וְאֶפְרַיִם
  choice: Israël et Éphraïm
  rationale: Les noms sont conservés afin de respecter la diction prophétique, même s’ils renvoient ici de façon étroitement parallèle au royaume du Nord.
- source_word: יִכָּשְׁלוּ
  choice: trébucheront
  rationale: Le futur français convient à l’inaccompli hébreu dans ce contexte de jugement et préserve la métaphore de la chute.
- source_word: בַּעֲוֹנָם
  choice: dans leur faute
  rationale: « Faute » peut désigner à la fois le tort moral et la culpabilité qui en résulte. « Dans » conserve la concision et l’ambiguïté de la préposition hébraïque.
- source_word: כָּשַׁל
  choice: a trébuché
  rationale: Le parfait hébreu se distingue des inaccomplis précédents. Le passé composé maintient cette différence aspectuelle sans imposer une chronologie trop rigide.
- source_word: גַּם יְהוּדָה עִמָּם
  choice: et Juda aussi a trébuché avec eux
  rationale: « Aussi » marque simplement l’association de Juda au même égarement et au même jugement ; « avec eux » reprend Israël et Éphraïm.
theological_decisions:
- issue: Sens de « l’orgueil d’Israël »
  choice: L’orgueil moral d’Israël témoigne à charge contre lui.
  alternative: La majesté ou la grandeur d’Israël témoigne devant lui.
  rationale: Le cadre immédiat est celui de l’accusation, de la faute et de la chute. Le choix principal exprime cette dimension morale sans effacer dans la note l’autre valeur lexicale possible.
- issue: Valeur temporelle et aspectuelle du verbe concernant Juda
  choice: « Juda aussi a trébuché »
  alternative: « Juda aussi trébuchera » ou « Juda aussi trébuche »
  rationale: Le texte passe d’un inaccompli pluriel à un parfait singulier. Le passé composé préserve ce changement formel et présente Juda comme déjà engagé dans la même chute, tout en signalant les autres lectures possibles.
- issue: Rapport entre la faute et la chute
  choice: « trébucheront dans leur faute »
  alternative: « trébucheront à cause de leur faute » ou « dans leur perversité »
  rationale: La préposition peut indiquer la sphère ou la cause. La formulation retenue garde cette tension au lieu de préciser explicitement un lien causal.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle. La répétition des noms et la métaphore de la chute sont conservées ; les ambiguïtés lexicales et aspectuelles importantes sont documentées en notes.
