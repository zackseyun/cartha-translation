language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
translation:
  language: fr
  text: 'Ils ont trahi le SEIGNEUR,

    car ils ont eu des enfants étrangers[a].

    Maintenant, la nouvelle lune[b] les dévorera

    avec leurs parts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « enfants étrangers » peut désigner des enfants issus d’unions contraires à l’alliance ou, plus largement, une génération devenue étrangère au SEIGNEUR.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un mois les dévorera avec leurs parts ». Le mot hébreu peut signifier « nouvelle lune » ou « mois ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיהוָה בָּגָדוּ
  choice: Ils ont trahi le SEIGNEUR
  rationale: Avec בגד, la préposition ב introduit la personne envers laquelle la trahison est commise. « Trahir » exprime naturellement en français l’infidélité grave, notamment dans une relation d’alliance, tandis que « le SEIGNEUR » représente le tétragramme YHWH.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’accusation.
- source_word: בָנִים זָרִים
  choice: des enfants étrangers
  rationale: 'La formulation conserve l’image hébraïque et son ambiguïté : il peut s’agir d’enfants issus d’unions contraires à l’alliance ou d’une génération devenue étrangère au SEIGNEUR.'
- source_word: יָלָדוּ
  choice: ils ont eu
  rationale: Cette tournure française naturelle peut englober la mise au monde et l’engendrement sans imposer un point de vue exclusivement maternel ou paternel.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Le mot marque l’imminence de la conséquence annoncée.
- source_word: יֹאכְלֵם
  choice: les dévorera
  rationale: Le verbe signifie littéralement « manger » ; dans cette image de jugement destructeur, « dévorer » rend mieux sa force en français.
- source_word: חֹדֶשׁ
  choice: la nouvelle lune
  rationale: חֹדֶשׁ peut désigner la nouvelle lune ou un mois. Le texte principal retient la résonance cultuelle de la nouvelle lune, bien adaptée au contexte d’Osée, et la note conserve l’autre sens possible.
- source_word: חֶלְקֵיהֶם
  choice: leurs parts
  rationale: חֵלֶק désigne une part, un lot ou un bien attribué. « Leurs parts » maintient cette largeur de sens sans limiter le terme aux champs, aux terres ou à l’héritage.
theological_decisions:
- issue: Sens de « des enfants étrangers »
  choice: Conserver l’expression concrète sans réduire son sens à l’origine ethnique.
  alternative: Des enfants nés d’unions avec des étrangers, ou, au sens figuré, une génération étrangère au SEIGNEUR.
  rationale: Dans le contexte prophétique, l’expression porte une accusation d’infidélité à l’alliance. La traduction laisse ouvertes ses dimensions familiale et spirituelle.
- issue: Sens de חֹדֶשׁ dans l’annonce du jugement
  choice: « la nouvelle lune », comme cycle festif ou cultuel devenant occasion ou agent du jugement
  alternative: « un mois », indiquant que le jugement surviendra dans un bref délai
  rationale: Les deux sens sont lexicalement possibles. Le texte principal conserve la résonance cultuelle, tandis que la note signale clairement la lecture temporelle.
translation_notes:
  register: Français international actuel, sobre et digne. Le parallélisme poétique est rendu par des retours à la ligne. « Trahir » évite une tournure lourde comme « agir avec infidélité », et « ils ont eu des enfants » reste idiomatique tout en ne précisant pas le sexe des parents.
