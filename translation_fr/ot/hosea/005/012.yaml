  text: וַ/אֲנִ֥י כָ/עָ֖שׁ לְ/אֶפְרָ֑יִם וְ/כָ/רָקָ֖ב לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
translation:
  language: fr
  text: Et moi, pour Éphraïm, je suis comme la teigne, et, pour la maison de Juda, comme la pourriture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la décomposition » ou « le dépérissement ». L’image hébraïque évoque une corruption interne qui entraîne une destruction progressive.
    reason: Alternative lexicale pour רָקָב et clarification de l’image.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Et moi, je suis
  rationale: Le waw est rendu simplement par « Et », tandis que le pronom indépendant garde l’insistance sur le locuteur divin. L’ajout de « je suis », exigé par le français, explicite la proposition nominale sans en modifier le sens.
- source_word: כָעָשׁ
  choice: comme la teigne
  rationale: עָשׁ désigne couramment la teigne, insecte qui détruit progressivement les tissus. Ce choix conserve la comparaison et son image de destruction lente.
- source_word: לְאֶפְרָיִם
  choice: pour Éphraïm
  rationale: La préposition ל marque ici celui à l’égard duquel Dieu est comme une teigne. « Pour Éphraïm » est idiomatique en français et maintient le nom précis du royaume du Nord.
- source_word: וְכָרָקָב
  choice: comme la pourriture
  rationale: רָקָב évoque la pourriture, la décomposition ou le dépérissement. « Pourriture » est concret et conserve l’image d’une corruption interne et progressive; la coordination est naturellement portée par la structure parallèle française.
- source_word: לְבֵית יְהוּדָה
  choice: pour la maison de Juda
  rationale: « Maison de Juda » préserve l’expression collective hébraïque, qui désigne le peuple ou royaume du Sud, sans la réduire au seul nom « Juda ».
theological_decisions:
- issue: Dieu se décrit au moyen d’agents destructeurs
  choice: 'Conserver les comparaisons nominales: Dieu est « comme la teigne » et « comme la pourriture ».'
  alternative: 'Expliciter leurs effets: « Je dévorerai Éphraïm comme une teigne et je ferai dépérir Juda. »'
  rationale: L’hébreu présente deux comparaisons directes, sans verbes décrivant explicitement leurs effets. Maintenir ces images préserve la force et la tension de la parole de jugement sans ajouter une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme bref de l’hébreu est conservé; « teigne » et « pourriture » restent des images concrètes et immédiatement compréhensibles.
