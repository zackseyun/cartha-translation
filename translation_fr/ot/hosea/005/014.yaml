  text: כִּ֣י אָנֹכִ֤י כַ/שַּׁ֨חַל֙ לְ/אֶפְרַ֔יִם וְ/כַ/כְּפִ֖יר לְ/בֵ֣ית יְהוּדָ֑ה אֲנִ֨י אֲנִ֤י אֶטְרֹף֙ וְ/אֵלֵ֔ךְ אֶשָּׂ֖א וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
translation:
  language: fr
  text: Car moi, je suis comme un lion pour Éphraïm[a], comme un jeune lion pour la maison de Juda. Moi, moi, je déchirerai, puis je m’en irai ; j’emporterai, et nul ne pourra délivrer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un lion féroce » ; le terme hébreu peut souligner la force ou la férocité du lion.
    reason: lexical_alternative
  - marker: b
    text: Ou « et nul ne peut délivrer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שַּׁחַל
  choice: lion
  rationale: Le terme désigne un lion, avec une possible nuance de force ou de férocité. « Lion » reste naturel et n’explicite pas outre mesure une nuance déjà rendue par les verbes de prédation.
- source_word: כְּפִיר
  choice: jeune lion
  rationale: Le mot désigne couramment un jeune lion. Cette expression préserve le parallélisme poétique sans la nuance potentiellement diminutive de « lionceau ».
- source_word: לְאֶפְרַיִם
  choice: pour Éphraïm
  rationale: Dans cette comparaison, la préposition marque la relation de menace envers Éphraïm. « Pour Éphraïm » est idiomatique en français tout en conservant cette orientation.
- source_word: לְבֵית יְהוּדָה
  choice: pour la maison de Juda
  rationale: « Maison de Juda » conserve l’image collective hébraïque et le parallélisme avec Éphraïm.
- source_word: אֲנִי אֲנִי
  choice: Moi, moi
  rationale: La répétition inhabituelle du pronom est maintenue afin de rendre l’insistance vigoureuse du texte hébreu.
- source_word: אֶטְרֹף
  choice: je déchirerai
  rationale: Dans l’image du lion, le verbe évoque l’action de déchirer une proie. Le choix reste vif et conserve le complément implicite dans ce premier membre.
- source_word: וְאֵלֵךְ
  choice: puis je m’en irai
  rationale: Le lion s’éloigne après avoir attaqué. « Puis » rend naturellement la succession implicite, et « m’en irai » exprime le départ.
- source_word: אֶשָּׂא
  choice: j’emporterai ma proie
  rationale: Le verbe peut signifier soulever, porter ou emporter. Dans la métaphore du prédateur, « emporter » convient au contexte ; « ma proie » explicite sobrement l’objet laissé sous-entendu en hébreu, nécessaire à la fluidité française et repris par le pronom suivant.
- source_word: וְאֵין מַצִּיל
  choice: et personne ne pourra la délivrer
  rationale: La tournure exprime l’absence de tout sauveteur capable d’arracher la proie au prédateur. « Délivrer » conserve la force du verbe sans réduire l’énoncé à une simple absence physique.
theological_decisions:
- issue: Dieu se présente comme un prédateur dans l’annonce du jugement
  choice: Conserver sans atténuation l’image du lion qui déchire et emporte sa proie.
  alternative: Remplacer l’image par une formulation générale indiquant que Dieu punira Éphraïm et Juda.
  rationale: Le texte hébreu emploie expressément deux désignations du lion et plusieurs verbes de prédation. Atténuer cette image affaiblirait la violence intentionnelle de l’oracle de jugement.
translation_notes:
  register: Français moderne, international et digne. La structure poétique parallèle est conservée, ainsi que la répétition emphatique « Moi, moi ». La métaphore violente du prédateur n’est pas adoucie ; l’objet implicite de « j’emporterai » est explicité par « ma proie » pour obtenir une phrase française naturelle.
