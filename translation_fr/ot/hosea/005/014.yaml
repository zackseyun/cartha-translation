  source_fidelity: 'La métaphore et l’insistance du pronom כפול sont bien rendues. Toutefois, « ma proie » introduit un objet possessif absent de l’hébreu : אֶשָּׂא (« j’emporterai / je porterai au loin ») laisse son objet implicite, comme le fait le verset pour l’action de déchirer. La reprise « la délivrer » dépend de cette explicitation ajoutée et doit donc être supprimée.'
  naturalness: La formulation révisée demeure naturelle dans un registre biblique moderne et soutenu. « Pour Éphraïm » et « pour la maison de Juda » rendent de façon idiomatique la relation hostile exprimée par les comparaisons. La répétition « Moi, moi » est volontairement marquée afin de conserver l’emphase poétique.
  terminology: « Lion », « jeune lion », « maison de Juda », « déchirer », « emporter » et « délivrer » rendent correctement les termes et l’imagerie du texte. « Nul ne pourra délivrer » conserve l’absence de tout sauveteur sans imposer un complément qui n’est pas exprimé en hébreu.
