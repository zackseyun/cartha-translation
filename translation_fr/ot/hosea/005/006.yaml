source:
  edition: WLC
  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
translation:
  language: fr
  text: 'Avec leur petit et leur gros bétail[a], ils iront chercher Yahvé, mais ils ne le trouveront pas : il s’est retiré d’eux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mention du petit et du gros bétail suggère qu’ils viennent chercher Yahvé en amenant des animaux destinés aux sacrifices.
    reason: cultural_note
  - marker: b
    text: Ou « il s’est éloigné d’eux » ou « il s’est soustrait à eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֹאנָם וּבִבְקָרָם
  choice: Avec leur petit et leur gros bétail
  rationale: צֹאן désigne collectivement les moutons et les chèvres, tandis que בָּקָר désigne les bovins. « Petit et gros bétail » restitue naturellement en français la distinction entre ces deux catégories; les prépositions בְּ expriment ici l’accompagnement.
- source_word: יֵלְכוּ לְבַקֵּשׁ
  choice: ils iront chercher
  rationale: L’imparfait hébreu a ici une valeur future dans le discours prophétique, et בּקשׁ conserve l’idée religieuse de chercher Dieu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est sa forme usuelle en français moderne et permet de conserver le nom propre plutôt que de lui substituer un titre.
- source_word: וְלֹא יִמְצָאוּ
  choice: mais ils ne le trouveront pas
  rationale: La conjonction prend une valeur adversative dans ce contexte. Le pronom « le », implicite en hébreu, est nécessaire en français et renvoie à Yahvé.
- source_word: חָלַץ מֵהֶם
  choice: il s’est retiré loin d’eux
  rationale: חלץ exprime ici le fait de se dégager ou de se retirer. Le passé composé rend l’action accomplie dont la conséquence demeure présente; « loin d’eux » explicite naturellement la séparation exprimée par מֵהֶם sans en durcir le sens.
theological_decisions:
- issue: Traduction du nom divin
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Puisque יהוה est explicitement présent, le nom divin est conservé sous sa forme française courante plutôt que remplacé par un titre.
- issue: Nature de la recherche d’Israël
  choice: Le texte principal laisse implicite la dimension sacrificielle, tandis qu’une note l’explique.
  alternative: Ajouter dans le texte qu’ils viennent offrir des sacrifices.
  rationale: La présence du petit et du gros bétail suggère fortement des animaux destinés aux sacrifices, mais le texte hébreu ne le dit pas expressément.
- issue: Sens de חָלַץ מֵהֶם
  choice: il s’est retiré loin d’eux
  alternative: il est parti loin d’eux / il s’est dégagé d’eux
  rationale: Cette formulation préserve l’idée d’une absence volontaire et judiciaire de Dieu sans préciser davantage que ne le fait le verbe hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « petit et gros bétail » est idiomatique et maintient la distinction du texte hébreu. Les deux-points soulignent que l’échec de leur recherche s’explique par le retrait préalable de Yahvé.
