  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
translation:
  language: fr
  text: Les rebelles ont poussé le massacre à l’extrême[a] ; mais moi, je suis une discipline pour eux tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre compréhension ancienne : « Les rebelles ont creusé une fosse profonde. » Le texte hébreu vocalisé porte « massacre ».'
    reason: textual_alternative
  - marker: b
    text: 'Le terme traduit par « discipline » peut aussi désigner la correction, le châtiment ou l’instruction. Littéralement : « mais moi, discipline pour eux tous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטָה
  choice: dans le massacre
  rationale: Le nom désigne l’abattage ou le massacre. Avec le verbe « s’enfoncer », « dans le massacre » exprime naturellement l’idée d’un engagement toujours plus profond dans la violence meurtrière.
- source_word: שֵׂטִים
  choice: les rebelles
  rationale: Le terme désigne ceux qui se détournent ou dévient. « Rebelles » conserve ici sa portée morale et religieuse sans employer le terme plus technique « apostats ».
- source_word: הֶעְמִיקוּ
  choice: se sont enfoncés profondément
  rationale: La forme verbale exprime littéralement l’idée de rendre profond et, idiomatiquement, celle d’aller loin ou de s’enfoncer. Cette formulation maintient la métaphore sans lui attribuer un objet absent de l’hébreu.
- source_word: וַאֲנִי
  choice: mais moi
  rationale: Dans ce contexte d’accusation suivie de la réponse divine, la conjonction a une valeur adversative naturelle.
- source_word: מוּסָר
  choice: je les corrigerai
  rationale: Le nom peut désigner la correction, la discipline, le châtiment ou l’instruction. La tournure verbale donne en français une phrase naturelle et conserve ici l’idée d’une correction exercée par le locuteur.
- source_word: לְכֻלָּם
  choice: tous
  rationale: 'Cette formulation rend la portée universelle de l’expression : aucun des rebelles n’échappe à la correction annoncée.'
theological_decisions:
- issue: Identité du locuteur et portée de la réponse divine
  choice: Le Seigneur est compris comme celui qui corrigera tous les rebelles.
  alternative: « Mais moi, je suis une discipline pour eux tous », avec une nuance plus pédagogique ou une formulation nominale.
  rationale: Le contexte immédiat d’accusation et de jugement favorise la correction disciplinaire, tout en laissant en note la gamme de sens de מוּסָר et la structure nominale concise de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et prophétique. La métaphore de la profondeur est conservée, tandis que la proposition nominale hébraïque est rendue verbalement pour être naturelle et intelligible en français.
