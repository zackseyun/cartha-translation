  naturalness: « Ont poussé le massacre à l’extrême » est une expression moderne et claire qui rend l’intensification exprimée par l’hébreu. « Je suis une discipline pour eux tous » est légèrement marqué, mais demeure intelligible et respecte volontairement la formulation nominale concise et frappante de l’oracle.
  terminology: « Rebelles » est un bon rendu non technique de שֵׂטִים. « Discipline » rend מוּסָר sans réduire le terme à la seule réprimande ni imposer le sens exclusivement punitif de « châtiment » ; la note indique les possibilités contextuelles. « Massacre » suit la vocalisation massorétique de שַׁחֲטָה, tout en signalant l’alternative textuelle ancienne « fosse ».
