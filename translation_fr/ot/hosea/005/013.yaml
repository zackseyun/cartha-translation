base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
translation:
  language: fr
  text: Quand Éphraïm a vu sa maladie et Juda sa plaie, Éphraïm est allé en Assyrie et a envoyé au roi Yareb[a]. Mais celui-ci ne pourra pas vous guérir ni faire disparaître votre plaie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « au roi vengeur », « au roi qui combat » ou « au grand roi » ; le sens du mot hébreu Yareb est incertain, et il peut s’agir d’un titre plutôt que d’un nom propre.
    reason: Le syntagme מֶלֶךְ יָרֵב admet plusieurs analyses ; la note préserve cette ambiguïté lexicale et historique.
lexical_decisions:
- source_word: חָלְיוֹ
  choice: sa maladie
  rationale: Le nom désigne une maladie et décrit ici, par métaphore, l’état national d’Éphraïm. « Maladie » est naturel en français et conserve l’image médicale.
- source_word: מְזֹרוֹ / מָזוֹר
  choice: sa plaie / votre plaie
  rationale: Le terme peut désigner une plaie ou une blessure. « Plaie » convient à l’image d’un mal corporel nécessitant une guérison et permet de conserver la répétition hébraïque.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Il s’agit ici de la puissance politique assyrienne; la forme française usuelle est retenue.
- source_word: מֶלֶךְ יָרֵב
  choice: le roi Yareb
  rationale: La translittération préserve la possibilité que יָרֵב soit un nom ou une désignation assimilée à un nom, sans trancher dans le corps du texte entre les interprétations proposées.
- source_word: וַיִּשְׁלַח אֶל
  choice: a envoyé un message à
  rationale: L’hébreu dit littéralement qu’Éphraïm « a envoyé vers » le roi, l’objet envoyé restant implicite. En français, « envoyer un message à » exprime naturellement l’idée sans imposer la présence explicite de messagers.
- source_word: לֹא יוּכַל לִרְפֹּא לָכֶם
  choice: ne pourra pas vous guérir
  rationale: Cette formulation rend directement l’incapacité du roi ou de la puissance assyrienne à apporter la guérison recherchée.
- source_word: וְלֹא יִגְהֶה מִכֶּם מָזוֹר
  choice: ni faire disparaître votre plaie
  rationale: Le verbe rare est compris dans le contexte comme l’enlèvement ou la guérison du mal. « Faire disparaître » conserve une distinction avec le verbe précédent tout en restant idiomatique.
theological_decisions:
- issue: Référent de וְהוּא (« mais lui/celui-ci »)
  choice: « celui-ci » renvoie immédiatement au roi Yareb
  alternative: Le pronom peut viser plus largement l’Assyrie en tant que puissance politique.
  rationale: Le roi est l’antécédent singulier le plus proche. Toutefois, le propos général demeure l’impuissance de l’Assyrie, roi compris, à guérir Éphraïm et Juda.
- issue: Portée du passage du singulier au pluriel dans « vous guérir »
  choice: Conserver le pluriel « vous », qui englobe Éphraïm et Juda après les références singulières à chacun.
  alternative: Expliciter « vous deux » ou nommer de nouveau Éphraïm et Juda.
  rationale: Le changement de nombre appartient à la rhétorique hébraïque. Le français peut le conserver sans ajout explicatif.
translation_notes:
  register: Français moderne, international et digne. Les métaphores médicales parallèles (« maladie », « plaie », « guérir ») sont conservées. « Celui-ci » clarifie sobrement le référent immédiat sans exclure la portée plus large visant l’Assyrie.
