id: HOS.6.1
reference: Hosea 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
translation:
  language: fr
  text: Venez, revenons à Yahweh, car il nous a déchirés, mais il nous guérira ; il nous a frappés, mais il pansera nos blessures.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il nous guérira… et il nous pansera » ; la conjonction hébraïque signifie simplement « et », mais le contexte fait ressortir le contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venez
  rationale: L’impératif pluriel de הלך sert ici d’exhortation ouvrant un appel collectif. « Venez » rend naturellement cette valeur en français.
- source_word: וְנָשׁוּבָה
  choice: revenons
  rationale: Le cohortatif à la première personne du pluriel exprime une résolution commune. « Revenons » conserve le mouvement vers Yahweh sans expliciter excessivement par « repentons-nous ».
- source_word: אֶל יְהוָה
  choice: à Yahweh
  rationale: La préposition marque la direction, et le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée pour revenir à Yahweh.
- source_word: טָרָף
  choice: il nous a déchirés
  rationale: Le verbe évoque notamment une bête qui déchire sa proie. Le complément « nous », implicite dans ce premier membre, est fourni par le parallélisme et les suffixes qui suivent.
- source_word: וְיִרְפָּאֵנוּ
  choice: mais il nous guérira
  rationale: Le yiqtol exprime ici la restauration attendue. « Mais » explicite en français l’opposition contextuelle portée formellement par la simple coordination hébraïque.
- source_word: יַךְ
  choice: il nous a frappés
  rationale: Malgré la forme morphologiquement non accomplie, le parallélisme avec טָרָף permet de comprendre l’action comme le jugement déjà subi. « Frappés » reste direct et préserve l’image.
- source_word: וְיַחְבְּשֵׁנוּ
  choice: mais il pansera nos blessures
  rationale: Le verbe signifie bander ou panser une blessure. Cette formulation française naturelle conserve la métaphore médicale et rend explicite l’objet sous-entendu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme ; sa translittération préserve le caractère de nom propre.
- issue: Rapport temporel entre jugement et restauration
  choice: Jugement au passé et restauration au futur
  alternative: Comprendre « il frappe » ou « il frappera », ou coordonner tous les verbes sans contraste explicite
  rationale: 'Le parallélisme présente vraisemblablement les blessures comme déjà infligées et la guérison comme attendue. Cette lecture maintient la tension : celui qui juge est aussi celui dont on attend la restauration.'
- issue: Valeur des conjonctions devant les verbes de restauration
  choice: mais
  alternative: et
  rationale: L’hébreu emploie la coordination וְ, qui peut être rendue littéralement par « et ». « Mais » fait ressortir l’opposition logique en français sans nier la possibilité formelle de la coordination, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Venez, revenons » garde la force de l’exhortation collective. « Pansera nos blessures » est plus naturel en français actuel que le calque « nous bandera », tout en préservant l’image médicale.
