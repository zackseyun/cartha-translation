  text: בְּ/בֵית֙ יִשְׂרָאֵ֔ל רָאִ֖יתִי שעריריה שָׁ֚ם זְנ֣וּת לְ/אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
translation:
  language: fr
  text: 'Dans la maison d’Israël, j’ai vu une chose horrible[a] : là, il y a de la prostitution en Éphraïm[b] ; Israël s’est souillé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chose effroyable ». Le terme hébreu désigne quelque chose de choquant ou d’atroce.
    reason: lexical_alternative
  - marker: b
    text: 'La formulation hébraïque est condensée. On peut aussi comprendre : « là, Éphraïm se prostitue » ou « là se trouve la prostitution propre à Éphraïm ».'
    reason: alternative_reading
  - marker: c
    text: Ou « Israël est impur », « Israël est devenu impur » ou « Israël s’est rendu impur ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  choice: Dans la maison d’Israël
  rationale: Cette formulation conserve l’image collective et familiale de la « maison d’Israël », sans la réduire au simple nom géographique « Israël ».
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé rend naturellement en français le qatal à la première personne dans cette déclaration prophétique.
- source_word: שעריריה
  choice: une chose horrible
  rationale: Le terme désigne une réalité choquante ou atroce. « Une chose horrible » est clair, actuel et conserve la forte réprobation du texte.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe est maintenu explicitement et renvoie à la maison d’Israël qui vient d’être mentionnée.
- source_word: זְנוּת לְאֶפְרַיִם
  choice: se trouve la prostitution d’Éphraïm
  rationale: Cette formulation française naturelle conserve la métaphore sexuelle de זְנוּת et rend l’association elliptique exprimée par לְ sans décider excessivement si elle indique le lieu, l’appartenance ou l’attribution.
- source_word: נִטְמָא יִשְׂרָאֵל
  choice: Israël s’est rendu impur
  rationale: Le rendu exprime l’entrée dans un état d’impureté et la responsabilité d’Israël, tout en conservant le vocabulaire d’impureté porté par טמא.
theological_decisions:
- issue: La prostitution désigne-t-elle une conduite sexuelle littérale, l’idolâtrie ou plus largement l’infidélité à l’alliance ?
  choice: Conserver « prostitution » sans expliciter son référent.
  alternative: Traduire par « immoralité sexuelle » ou expliciter « idolâtrie ».
  rationale: Chez Osée, l’image peut porter simultanément des connotations sexuelles et une accusation d’infidélité envers Dieu. La traduction ne doit pas réduire cette tension.
- issue: Le niphal נִטְמָא décrit-il seulement un état subi ou une souillure dont Israël est responsable ?
  choice: Israël s’est rendu impur.
  alternative: Israël est impur ; Israël est devenu impur ; Israël s’est souillé.
  rationale: Le contexte attribue cette impureté à la conduite d’Israël. Le choix principal rend cette responsabilité sans exclure la lecture plus strictement stative, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique brève et accusatrice est conservée. Les images de la maison, de la prostitution et de l’impureté restent visibles, tandis que les ambiguïtés de la construction avec לְ et du niphal sont signalées en notes.
