id: HOS.6.7
reference: Hosea 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֕מָּה כְּ/אָדָ֖ם עָבְר֣וּ בְרִ֑ית שָׁ֖ם בָּ֥גְדוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
translation:
  language: fr
  text: Mais eux, comme Adam[a], ont transgressé l’alliance ; là, ils m’ont trahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme l’être humain » ou « comme les humains ». Le mot hébreu אָדָם peut désigner Adam en personne ou l’humanité en général.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mais eux
  rationale: Le pronom est emphatique, et la conjonction marque ici naturellement le contraste avec ce qui précède.
- source_word: כְּאָדָם
  choice: comme Adam
  rationale: אָדָם peut être le nom propre Adam ou désigner l’être humain, voire l’humanité. Le nom propre convient au contexte d’une transgression d’alliance, tandis que l’ambiguïté réelle est conservée en note.
- source_word: עָבְרוּ
  choice: ont transgressé
  rationale: Avec « alliance », le verbe exprime le franchissement ou la violation d’une limite imposée et garde ici toute sa portée relationnelle et théologique.
- source_word: בְרִית
  choice: l’alliance
  rationale: Bien que le nom soit sans article en hébreu, le contexte évoque une relation d’alliance déterminée ; l’article défini est naturel en français.
- source_word: שָׁם
  choice: là
  rationale: Cette traduction conserve le sens locatif ordinaire de l’adverbe sans préciser un référent que le texte laisse implicite.
- source_word: בָּגְדוּ
  choice: ils m’ont trahi
  rationale: Le verbe désigne une conduite perfide ou infidèle. « Trahir » est naturel en français et exprime clairement la rupture personnelle de fidélité.
- source_word: בִי
  choice: m’
  rationale: Avec « trahir », le complément personnel direct rend idiomatiquement en français la personne envers laquelle la perfidie est commise.
theological_decisions:
- issue: Interprétation de כְּאָדָם dans un contexte d’alliance
  choice: comme Adam
  alternative: comme l’être humain / comme les humains
  rationale: Le texte peut évoquer Adam personnellement et sa transgression première, mais אָדָם peut aussi avoir un sens générique. La lecture par le nom propre figure dans le texte, sans supprimer l’autre lecture, signalée en note.
translation_notes:
  register: Français moderne, international et digne. « Mais eux » préserve l’emphase ; « ont transgressé l’alliance » maintient la portée covenantale du texte ; « m’ont trahi » privilégie une formulation courante et forte plutôt qu’un calque moins naturel comme « ont agi infidèlement envers moi ».
