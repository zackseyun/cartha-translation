lexical_decisions:
- source_word: גִּלְעָד
  choice: Galaad
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: קִרְיַת
  choice: une ville de
  rationale: Le nom est à l’état construit devant le groupe participial; « une ville de » est naturel en français.
- source_word: פֹּעֲלֵי אָוֶן
  choice: malfaiteurs
  rationale: Le groupe désigne ceux qui commettent le mal; « malfaiteurs » est concis, actuel et conserve la portée morale.
- source_word: עֲקֻבָּה
  choice: marquée de traces
  rationale: Cette forme rare et difficile semble évoquer des empreintes ou des marques; la formulation conserve cette image sans trancher excessivement.
- source_word: מִדָּם
  choice: de sang
  rationale: Après עֲקֻבָּה, la préposition מן est difficile; « de sang » exprime naturellement en français la matière ou la nature des traces.
