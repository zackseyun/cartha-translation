  text: Galaad est une ville de malfaiteurs, marquée de traces de sang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « tachée de sang », « marquée par le sang » ou, en suivant plus étroitement les mots hébreux, « marquée de traces venant du sang ». L’expression hébraïque est rare et difficile.'
