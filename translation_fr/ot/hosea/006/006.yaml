  rationale: 'La traduction rétablit les deux membres parallèles du verset sous une forme française complète : Dieu désire l’amour fidèle plutôt que les sacrifices, et la connaissance de Dieu plutôt que les holocaustes. Elle maintient le contraste préférentiel du texte sans en faire une abolition explicite du sacrifice. La note b est corrigée afin de distinguer la forme littérale de son effet comparatif en contexte.'
