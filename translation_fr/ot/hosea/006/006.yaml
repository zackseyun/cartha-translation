source:
  edition: WLC
  text: כִּ֛י חֶ֥סֶד חָפַ֖צְתִּי וְ/לֹא זָ֑בַח וְ/דַ֥עַת אֱלֹהִ֖ים מֵ/עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/006.yaml
  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
translation:
  language: fr
  text: Car je désire l’amour fidèle[a] plutôt que les sacrifices, la connaissance de Dieu plutôt que les holocaustes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bonté », « miséricorde » ou « fidélité ». Le mot hébreu חֶסֶד peut associer bienveillance, loyauté et fidélité à l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « que des holocaustes » ou « de [plutôt que] des holocaustes »; la construction hébraïque exprime ici une comparaison ou une préférence.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la parole précédente et conserve naturellement la valeur causale ou explicative de la conjonction.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression rend à la fois l’amour bienveillant et la loyauté durable, notamment dans le cadre de l’alliance, sans réduire le terme à un simple sentiment.
- source_word: חָפַצְתִּי
  choice: je prends plaisir à
  rationale: Le verbe exprime le désir ou le plaisir que l’on trouve en quelque chose. Cette tournure française convient au contraste entre fidélité et rite sacrificiel.
- source_word: זָבַח
  choice: sacrifices
  rationale: Le nom désigne ici de manière générale les sacrifices; le pluriel français exprime naturellement cette valeur collective et maintient le contraste avec les holocaustes.
- source_word: דַעַת אֱלֹהִים
  choice: la connaissance de Dieu
  rationale: La formulation nominale préserve le parallélisme hébreu et peut englober une connaissance relationnelle de Dieu, et non seulement intellectuelle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le texte emploie le titre divin אֱלֹהִים et non le nom propre YHWH.
- source_word: מֵעֹלוֹת
  choice: plutôt qu’aux holocaustes
  rationale: La préposition מִן marque ici une comparaison ou une préférence. « Plutôt que » l’exprime clairement sans transformer implicitement la priorité prophétique en abolition absolue des sacrifices.
- source_word: עֹלוֹת
  choice: holocaustes
  rationale: Terme français traditionnel et précis pour les offrandes entièrement consumées sur l’autel.
theological_decisions:
- issue: Le contraste constitue-t-il un rejet absolu des sacrifices ou l’expression d’une préférence?
  choice: Maintenir la préférence donnée à l’amour fidèle et à la connaissance de Dieu sur l’observance sacrificielle.
  alternative: Comprendre le verset comme une abolition ou une condamnation absolue de tout sacrifice.
  rationale: La négation du premier membre et la comparaison introduite par מִן dans le second relèvent du contraste prophétique. La traduction conserve sa force sans trancher au-delà de ce que dit la formulation hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé, avec un vocabulaire religieux courant mais précis. « Amour fidèle » rend la richesse de חֶסֶד tout en restant intelligible pour le grand public.
