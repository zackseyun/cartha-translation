source:
  edition: WLC
  text: מָ֤ה אֶֽעֱשֶׂה לְּ/ךָ֙ אֶפְרַ֔יִם מָ֥ה אֶעֱשֶׂה לְּ/ךָ֖ יְהוּדָ֑ה וְ/חַסְדְּ/כֶם֙ כַּֽ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֥ים הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
translation:
  language: fr
  text: Que vais-je faire de toi, Éphraïm ? Que vais-je faire de toi, Juda ? Votre fidélité[a] est comme un nuage matinal, comme la rosée qui disparaît de bonne heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « amour fidèle » ou « loyauté envers l’alliance ». Le mot hébreu חֶסֶד désigne ici un amour loyal et une fidélité qui s’inscrivent dans une relation d’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: Que vais-je faire de toi
  rationale: Cette tournure naturelle en français conserve la délibération empreinte d’exaspération de la question rhétorique.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé; dans le contexte, il représente le royaume du Nord.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom propre est conservé en parallèle avec Éphraïm; il désigne ici le royaume du Sud.
- source_word: חַסְדְּכֶם
  choice: fidélité
  rationale: Dans ce reproche adressé au peuple, « fidélité » rend naturellement la loyauté relationnelle et durable attendue dans l’alliance, sans introduire dans le corps du texte une explicitation absente de l’hébreu. La richesse sémantique du terme est signalée en note.
- source_word: כַּעֲנַן בֹּקֶר
  choice: comme un nuage matinal
  rationale: La traduction conserve l’image hébraïque du nuage du matin, éphémère et vite dissipé.
- source_word: וְכַטַּל
  choice: comme la rosée
  rationale: Le second membre parallèle garde la comparaison simple avec la rosée.
- source_word: מַשְׁכִּים הֹלֵךְ
  choice: qui disparaît de bonne heure
  rationale: Dans cette collocation, le mouvement exprimé par הלך décrit la disparition rapide de la rosée; « de bonne heure » rend la nuance temporelle de מַשְׁכִּים.
theological_decisions:
- issue: Rendu de חֶסֶד dans un contexte prophétique d’alliance
  choice: fidélité
  alternative: amour fidèle; loyauté envers l’alliance
  rationale: Le verset dénonce le caractère fugitif de la réponse d’Éphraïm et de Juda à Dieu. « Fidélité » préserve la dimension relationnelle et l’exigence de constance, tandis que la note maintient les autres nuances légitimes du terme sans imposer une seule interprétation développée.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions parallèles conservent la force rhétorique du texte; les deux images météorologiques restent concrètes et symétriques.
