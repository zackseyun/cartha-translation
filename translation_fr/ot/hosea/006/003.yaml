  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
translation:
  language: fr
  text: Apprenons à connaître Yahweh ; cherchons sans relâche à le connaître. Son apparition est aussi certaine que l’aurore[a]. Il viendra à nous comme la pluie[b], comme la pluie de printemps qui arrose la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Sa sortie est certaine comme l’aurore » ; on peut aussi comprendre : « son apparition ».'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire le verbe comme un souhait : « Qu’il vienne à nous comme la pluie. »'
    reason: alternative_reading
  - marker: c
    text: La « pluie de printemps » est la pluie tardive de la saison, importante pour la maturation des cultures.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֵדְעָה
  choice: Connaissons donc
  rationale: Le cohortatif exprime une exhortation collective. « Donc » marque naturellement la progression après l’appel à revenir du contexte précédent.
- source_word: נִרְדְּפָה לָדַעַת
  choice: poursuivons avec ardeur la connaissance de
  rationale: רדף signifie littéralement poursuivre. La formulation conserve l’idée d’un effort persévérant tout en restant naturelle en français ; ידע garde ici sa portée relationnelle et d’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: כְּשַׁחַר נָכוֹן מוֹצָאוֹ
  choice: Sa venue est aussi certaine que l’aurore
  rationale: נכון exprime la certitude ou la stabilité. מוצא désigne littéralement une sortie ou apparition ; « venue » rend ici clairement la manifestation de Yahweh sans imposer l’image d’un lever astral.
- source_word: וְיָבוֹא
  choice: Il viendra
  rationale: L’imparfait hébreu se lit naturellement comme un futur exprimant une attente assurée, tout en signalant en note la lecture volitive possible.
- source_word: כַגֶּשֶׁם
  choice: comme la pluie
  rationale: גשם est le terme général désignant la pluie.
- source_word: כְּמַלְקוֹשׁ
  choice: comme la pluie de printemps
  rationale: מלקוש désigne la pluie tardive de la saison agricole, qui tombe au printemps.
- source_word: יוֹרֶה אָרֶץ
  choice: qui arrose la terre
  rationale: Dans cet emploi météorologique, la forme verbale décrit la pluie tombant sur le sol ; « arrose » en exprime naturellement l’effet vivifiant.
theological_decisions:
- issue: Portée de ידע
  choice: connaître / la connaissance de
  alternative: reconnaître
  rationale: « Connaître » préserve la richesse relationnelle et liée à l’alliance sans la réduire à une reconnaissance intellectuelle.
- issue: Valeur de וְיָבוֹא
  choice: 'futur affirmatif : « Il viendra »'
  alternative: 'souhait : « Qu’il vienne »'
  rationale: La comparaison avec l’aurore certaine favorise l’expression d’une assurance, mais la possibilité grammaticale du souhait est conservée en note.
- issue: Sens de מוֹצָאוֹ
  choice: sa venue
  alternative: sa sortie / son apparition
  rationale: Le substantif peut évoquer la sortie ou l’apparition de Yahweh. « Venue » convient au parallélisme avec « il viendra », tandis qu’une note préserve le caractère imagé et l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif du premier membre et le parallélisme poétique sont conservés. Les ambiguïtés de מוצא et de la valeur modale de ויבוא sont signalées sans alourdir le texte principal.
