id: HOS.6.2
reference: Hosea 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְחַיֵּ֖/נוּ מִ/יֹּמָ֑יִם בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י יְקִמֵ֖/נוּ וְ/נִחְיֶ֥ה לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
translation:
  language: fr
  text: Après deux jours[a], il nous fera revivre ; le troisième jour[c], il nous relèvera[b], et nous vivrons devant lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en deux jours » ; l’expression temporelle hébraïque peut désigner un bref intervalle qui aboutit au troisième jour.
    reason: lexical_alternative
  - marker: b
    text: « Nous relèvera » peut aussi se comprendre plus généralement comme « nous rétablira » ou « nous remettra debout ».
    reason: lexical_alternative
  - marker: c
    text: Beaucoup de chrétiens voient dans la mention du « troisième jour » une anticipation typologique de la résurrection du Messie, bien que le verset parle directement de la restauration du peuple.
    reason: cross_reference
  - marker: d
    text: Ou « en sa présence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  choice: il nous fera revivre
  rationale: Le piel de חיה exprime ici l’action de rendre la vie. « Faire revivre » conserve cette valeur causative et convient au contexte de restauration collective.
- source_word: מִיֹּמָיִם
  choice: après deux jours
  rationale: Avec cette expression temporelle, מִן indique vraisemblablement le terme d’un bref intervalle. « Après deux jours » rend naturellement la progression vers le troisième jour, tout en laissant « en deux jours » comme possibilité.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: C’est l’équivalent français naturel de cette expression temporelle et il préserve la séquence marquée du texte hébreu.
- source_word: יְקִימֵנוּ
  choice: il nous relèvera
  rationale: Le hifil de קום peut signifier relever, remettre debout ou rétablir. « Relèvera » maintient à la fois l’image d’un peuple abattu remis debout et les possibles résonances de résurrection, sans les imposer.
- source_word: וְנִחְיֶה
  choice: et nous vivrons
  rationale: La coordination hébraïque énonce naturellement le résultat des actions divines. Cette formulation préserve plus directement la syntaxe que l’explicitation finale « afin que nous vivions ».
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rendu direct et idiomatique de לְפָנָיו ; l’expression peut également signifier « en sa présence » dans un sens relationnel.
theological_decisions:
- issue: Faut-il présenter ce verset comme une prophétie messianique directe de la résurrection ou comme l’annonce de la restauration collective du peuple ?
  choice: Le texte principal conserve le « nous » collectif et annonce que Dieu rendra la vie à son peuple et le relèvera.
  alternative: Une lecture chrétienne peut voir dans la mention du « troisième jour » une anticipation typologique de la résurrection du Messie.
  rationale: Dans son énoncé immédiat, l’hébreu parle à la première personne du pluriel de la restauration du peuple. La traduction ne doit pas transformer cette déclaration en prédiction christologique explicite, mais une note peut signaler la lecture typologique traditionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche du parallélisme hébreu tout en étant naturelle à l’oral comme à l’écrit. « Faire revivre » et « relever » conservent les images de vie et de remise debout sans réduire le passage à une interprétation doctrinale particulière.
