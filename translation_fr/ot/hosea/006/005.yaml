base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
translation:
  language: fr
  text: C’est pourquoi je les ai taillés en pièces par les prophètes ; je les ai mis à mort par les paroles de ma bouche, et tes jugements sont comme la lumière qui paraît.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon jugement paraît comme la lumière ». Le texte hébreu vocalisé porte « tes jugements », mais certains interprètes comprennent ici le jugement de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée du reproche qui précède.
- source_word: חָצַבְתִּי
  choice: je les ai taillés
  rationale: Conserve l’image forte du verbe désignant l’action de tailler ou d’équarrir, sans la réduire à un simple reproche verbal.
- source_word: בַּנְּבִיאִים
  choice: par l’intermédiaire des prophètes
  rationale: 'Rend clairement la valeur instrumentale de la préposition : les prophètes sont les agents par lesquels Dieu agit.'
- source_word: הֲרַגְתִּים
  choice: je les ai tués
  rationale: Respecte la violence délibérée du verbe hébreu tout en restant direct et naturel en français moderne.
- source_word: בְּאִמְרֵי פִי
  choice: par les paroles de ma bouche
  rationale: Préserve l’image concrète de la parole sortant de la bouche divine.
- source_word: וּמִשְׁפָּטֶיךָ
  choice: et tes jugements
  rationale: Suit le texte massorétique vocalisé, dont le suffixe est à la deuxième personne du masculin singulier, et conserve le pluriel du nom.
- source_word: אוֹר יֵצֵא
  choice: jaillissent comme la lumière
  rationale: Exprime en français l’apparition manifeste évoquée par « sortir » et la comparaison implicite avec la lumière ; l’accord français se fait avec « jugements ».
theological_decisions:
- issue: Suffixe et référent de וּמִשְׁפָּטֶיךָ
  choice: tes jugements jaillissent comme la lumière
  alternative: mon jugement jaillit comme la lumière
  rationale: Le texte massorétique transmis porte « tes jugements », formulation difficile mais authentiquement attestée. La traduction principale la maintient, tandis que la note signale la lecture contextuelle et ancienne « mon jugement » sans trancher silencieusement la tension.
translation_notes:
  register: Français moderne, digne et poétique. « Taillés » garde la métaphore abrupte de l’hébreu ; « par l’intermédiaire » clarifie l’instrument sans rendre les prophètes eux-mêmes violents. La difficulté grammaticale et interprétative du dernier membre est conservée et expliquée en note.
