  source_fidelity: La formulation principale actuelle (« des brigands qui guettent un homme ») adopte l’une des reconstructions possibles de l’hébreu difficile, alors que le texte anglais de référence retient plus prudemment l’image générale d’hommes à l’affût. Il est préférable de ne pas faire de cette reconstruction spécifique le texte principal. « Vers Sichem » rend explicitement la terminaison directive de שֶׁכְמָה.
  naturalness: Le français est globalement naturel, mais « commet des meurtres » est moins direct et moins idiomatique ici que « assassine ». « Sur le chemin de Sichem » peut aussi se comprendre comme le chemin appartenant à Sichem ; « sur la route vers Sichem » est plus net.
  terminology: « Bande de prêtres » conserve la connotation hostile de חֶבֶר. « Assassine » restitue la force de רצח. « Infamie » traduit bien זִמָּה sans restreindre indûment le terme à un domaine sexuel ni ajouter une qualification interprétative comme « abominable ».
