revisions:
- from: Comme des brigands qui guettent un homme[a], une bande de prêtres commet des meurtres sur le chemin de Sichem ; oui, ils ont commis un crime abominable[b].
  to: Et, comme des hommes à l’affût[a], une bande de prêtres assassine sur la route vers Sichem ; oui, ils ont commis une infamie[b].
  rationale: 'La révision suit la prudence du texte source et de l’audit anglais pour l’ouverture syntaxiquement incertaine : le texte principal garde l’image de l’affût sans imposer l’objet « un homme » ni identifier sans réserve les guetteurs comme des brigands. Cette lecture plus spécifique est conservée en note. « Sur la route vers Sichem » rend la direction vers Sichem, et « assassine » ainsi que « infamie » offrent un français moderne, sobre et fidèle aux termes hébreux.'
