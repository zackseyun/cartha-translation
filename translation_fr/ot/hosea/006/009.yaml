source:
  edition: WLC
  text: וּ/כְ/חַכֵּ֨י אִ֜ישׁ גְּדוּדִ֗ים חֶ֚בֶר כֹּֽהֲנִ֔ים דֶּ֖רֶךְ יְרַצְּחוּ שֶׁ֑כְמָ/ה כִּ֥י זִמָּ֖ה עָשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
translation:
  language: fr
  text: Et, comme des hommes à l’affût[a], une bande de prêtres assassine sur la route vers Sichem ; oui, ils ont commis une infamie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. Autre traduction possible : « Comme des brigands guettent un homme, ainsi une bande de prêtres assassine sur la route vers Sichem. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « un crime honteux », « un acte odieux ». Le terme hébreu désigne un acte particulièrement honteux ou révoltant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: Comme des brigands qui guettent un homme
  rationale: L’hébreu est condensé et difficile. Cette formulation conserve l’image de pillards embusqués et la présence de אִישׁ, sans prétendre lever entièrement l’incertitude syntaxique.
- source_word: חֶבֶר כֹּהֲנִים
  choice: une bande de prêtres
  rationale: חֶבֶר désigne ici un groupe uni dans une entreprise violente ; « bande » restitue mieux cette nuance hostile que « groupe » ou « association ».
- source_word: דֶּרֶךְ שֶׁכְמָה
  choice: sur le chemin de Sichem
  rationale: דֶּרֶךְ exprime le chemin ou la route, et le suffixe directionnel de שֶׁכְמָה indique le mouvement vers Sichem.
- source_word: יְרַצְּחוּ
  choice: commet des meurtres
  rationale: רצח désigne le meurtre plutôt qu’une mise à mort générique. Le singulier s’accorde naturellement avec le sujet collectif « une bande ».
- source_word: כִּי
  choice: oui
  rationale: Dans ce contexte, כִּי renforce et confirme l’accusation ; « oui » rend cette valeur emphatique avec naturel.
- source_word: זִמָּה
  choice: un crime abominable
  rationale: זִמָּה évoque ici un acte odieux et moralement scandaleux, sans qu’il faille lui donner nécessairement un sens sexuel.
- source_word: עָשׂוּ
  choice: ils ont commis
  rationale: Le verbe עשה signifie littéralement « faire » ; avec « crime », le français idiomatique demande « commettre ».
theological_decisions:
- issue: Interprétation de la comparaison initiale וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: Les prêtres sont rapprochés de brigands qui guettent un homme.
  alternative: « Comme des hommes à l’affût, une bande de prêtres… » ou « Comme des brigands guettent un homme, ainsi une bande de prêtres… »
  rationale: La syntaxe hébraïque est difficile et peut être comprise de plusieurs façons. Le texte principal conserve l’image centrale de l’embuscade violente, tandis que la note signale une autre construction possible sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. « Sichem » suit la forme française biblique usuelle. La violence criminelle de רצח et la gravité morale de זִמָּה sont maintenues sans ajouter de précision doctrinale.
