id: HOS.6.11
reference: Hosea 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם יְהוּדָ֕ה שָׁ֥ת קָצִ֖יר לָ֑/ךְ בְּ/שׁוּבִ֖/י שְׁב֥וּת עַמִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/011.yaml
  text: Also for you[a], Judah, a harvest is appointed[b], when I restore the fortunes of my people.
translation:
  language: fr
  text: Pour toi aussi[a], Juda, une moisson est fixée, quand je rétablirai la situation de mon peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une moisson est aussi fixée pour toi, Juda. »'
    reason: La formulation alternative reproduit une autre disposition naturelle des mêmes éléments et fait ressortir plus directement que la moisson est destinée à Juda.
  - marker: b
    text: 'Ou : « quand je ramènerai les captifs de mon peuple ». L’expression hébraïque peut aussi désigner le rétablissement de la situation du peuple.'
    reason: La formule hébraïque permet une lecture concrète liée à la captivité ainsi qu’un sens idiomatique plus général de restauration.
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Exprime l’ajout de Juda à ce qui précède, tout en suivant naturellement le groupe « pour toi » dans l’ordre hébreu.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom du royaume et du peuple du Sud.
- source_word: שָׁת
  choice: est fixée
  rationale: Le verbe signifie « placer, établir, fixer ». Avec « moisson », la tournure passive française rend naturellement l’idée qu’elle est assignée ou arrêtée pour Juda, sans préciser qui en est l’agent.
- source_word: קָצִיר
  choice: une moisson
  rationale: Rend directement le nom hébreu et conserve la métaphore sans décider s’il s’agit d’un jugement ou d’une bénédiction.
- source_word: לָךְ
  choice: pour toi
  rationale: Le suffixe féminin singulier renvoie à Juda envisagé comme une entité féminine; « pour toi » est idiomatique en français.
- source_word: בְּשׁוּבִי
  choice: quand je rétablirai
  rationale: La construction signifie littéralement « lors de mon retour/ramener ». Avec שְׁבוּת, elle forme une expression de restauration; le futur convient à l’orientation prophétique de la phrase.
- source_word: שְׁבוּת
  choice: la situation de
  rationale: Dans cette formule prophétique, le terme peut désigner le renversement d’une condition malheureuse et le rétablissement, sans se limiter nécessairement à une captivité littérale.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rend directement l’expression d’appartenance et d’alliance.
theological_decisions:
- issue: Valeur positive ou négative de la « moisson »
  choice: Conserver « une moisson » sans la qualifier
  alternative: « une moisson de jugement » ou « une moisson de bénédiction »
  rationale: Le contexte peut faire entendre le jugement, tandis que la proposition suivante évoque la restauration. La traduction maintient cette tension.
- issue: Sens de la formule בְּשׁוּבִי שְׁבוּת
  choice: « quand je rétablirai la situation de mon peuple »
  alternative: « quand je ramènerai les captifs de mon peuple »
  rationale: La formule peut exprimer globalement un rétablissement de la condition du peuple, mais une référence plus concrète au retour de captivité demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre initial « Pour toi aussi, Juda » reste proche de l’hébreu tout en étant naturel. Le terme « moisson » conserve l’ambiguïté métaphorique du texte.
