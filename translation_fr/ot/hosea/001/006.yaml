- from: 'Elle devint de nouveau enceinte et mit au monde une fille. Et il lui dit : « Donne-lui le nom de Lo-Rouhama[a], car je n’aurai désormais plus compassion de la maison d’Israël : je ne leur pardonnerai certainement pas[b]. »'
  to: 'Elle devint de nouveau enceinte et mit au monde une fille. Et il lui dit : « Donne-lui le nom de Lo-Rouhama[a], car je ne continuerai plus à avoir compassion de la maison d’Israël, pour leur pardonner certainement[b]. »'
  rationale: La révision conserve la lecture de « pardonner » suivie dans la piste d’audit anglaise, mais la formule « pour leur pardonner certainement » la rattache à la cessation de la compassion au lieu d’ajouter une négation française indépendante. La note maintient explicitement l’autre lecture possible. La glose du nom est également précisée afin de rendre son sens passif.
