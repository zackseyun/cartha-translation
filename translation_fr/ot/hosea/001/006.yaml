base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
translation:
  language: fr
  text: 'Elle devint de nouveau enceinte et mit au monde une fille. Et il lui dit : « Donne-lui le nom de Lo-Rouhama[a], car je ne continuerai plus à avoir compassion de la maison d’Israël, pour leur pardonner certainement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lo-Rouhama signifie « non objet de compassion » ou « sans miséricorde ».
    reason: Le nom symbolique repose sur la racine רחם, reprise dans l’explication divine.
  - marker: b
    text: 'Autre traduction possible : « car je les emporterai certainement ». La dernière proposition hébraïque est difficile.'
    reason: Le verbe נשׂא peut signifier « porter, enlever » ou, à propos d’une faute, « pardonner » ; la relation exacte de cette proposition avec la négation précédente est discutée.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Elle devint de nouveau enceinte
  rationale: Le verbe הרה exprime la conception ou le fait de devenir enceinte, et עוֹד marque la répétition. Cette formulation suit naturellement la progression du récit.
- source_word: וַתֵּלֶד בַּת
  choice: et mit au monde une fille
  rationale: ילד avec בַּת signifie qu’elle donne naissance à une fille. « Mit au monde » est courant, digne et précis en français moderne.
- source_word: וַיֹּאמֶר לוֹ
  choice: Et il lui dit
  rationale: L’hébreu laisse le sujet implicite et emploie un complément masculin singulier, probablement Osée. La traduction conserve les pronoms du texte sans expliciter arbitrairement « le SEIGNEUR » ou « à Osée ».
- source_word: קְרָא שְׁמָהּ
  choice: Donne-lui le nom de
  rationale: Il s’agit de la formule de nomination. Cette tournure est naturelle en français tout en gardant la solennité de l’acte prophétique.
- source_word: לֹא רֻחָמָה
  choice: Lo-Rouhama
  rationale: Le nom propre est translittéré selon une forme française lisible. Son lien avec רחם, « avoir compassion », est conservé dans la proposition explicative et précisé en note.
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  choice: je n’aurai désormais plus compassion
  rationale: La combinaison de יסף, עוֹד et רחם indique la cessation de la compassion. « Désormais plus » rend ce sens sans la redondance peu naturelle de « ne continuerai plus encore » et maintient l’écho lexical avec Lo-Rouhama.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La traduction conserve l’expression collective et historique explicite de l’hébreu plutôt que de la réduire à « Israël ».
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: je ne leur pardonnerai certainement pas
  rationale: נשׂא peut désigner le fait d’enlever ou de porter la faute, donc de pardonner. L’infinitif absolu avec le verbe conjugué apporte l’emphase, rendue par « certainement ». La négation est comprise comme se prolongeant dans cette explication, mais la difficulté réelle de la clause et l’autre lecture possible sont signalées en note.
theological_decisions:
- issue: Sens du nom symbolique de la fille
  choice: Translittérer « Lo-Rouhama » dans le texte et faire entendre sa signification par « compassion » dans l’explication.
  alternative: Traduire directement le nom par « Sans-Compassion », « Non-Prise-en-Pitié » ou « Pas-de-Miséricorde ».
  rationale: La translittération respecte son statut de nom propre, tandis que la répétition du champ lexical de רחם et la note rendent accessible la portée théologique du nom-signe.
- issue: Interprétation de la clause difficile כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: 'La comprendre comme une déclaration emphatique de non-pardon : « je ne leur pardonnerai certainement pas ».'
  alternative: 'La comprendre comme l’annonce d’un enlèvement : « car je les emporterai certainement ».'
  rationale: Dans le contexte immédiat du retrait de la compassion, le sens de נשׂא comme enlèvement de la faute, donc pardon, donne une lecture cohérente. Toutefois, la syntaxe et la polysémie permettent une lecture de jugement différente ; celle-ci est conservée en note afin de ne pas effacer la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le texte conserve l’ambiguïté des pronoms « il » et « lui », l’expression « maison d’Israël » et le lien lexical entre Lo-Rouhama et la compassion. Les marqueurs de note sont placés immédiatement après le nom expliqué et après la clause hébraïque difficile.
