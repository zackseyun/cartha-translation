  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית יְהוּדָה֙ אֲרַחֵ֔ם וְ/הֽוֹשַׁעְתִּ֖י/ם בַּ/יהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/לֹ֣א אֽוֹשִׁיעֵ֗/ם בְּ/קֶ֤שֶׁת וּ/בְ/חֶ֨רֶב֙ וּ/בְ/מִלְחָמָ֔ה בְּ/סוּסִ֖ים וּ/בְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
translation:
  language: fr
  text: Mais j’aurai compassion de la maison de Juda et je les sauverai par Yahweh, leur Dieu[a]. Je ne les sauverai ni par l’arc, ni par l’épée, ni par la guerre, ni par les chevaux, ni par les cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’intermédiaire de Yahweh, leur Dieu ». La préposition hébraïque peut marquer le moyen ou l’agent ; le contexte oppose Yahweh aux moyens militaires de délivrance.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mais
  rationale: La conjonction introduit ici un contraste avec le jugement annoncé contre Israël au verset précédent; « Mais » rend clairement cette valeur adversative en français.
- source_word: בֵּית יְהוּדָה
  choice: la maison de Juda
  rationale: Cette expression nationale et dynastique est intelligible en français et conserve le registre prophétique de l’hébreu.
- source_word: אֲרַחֵם
  choice: j’aurai compassion
  rationale: Le verbe רחם exprime une compassion active ou la miséricorde; cette formulation moderne en préserve la dimension affective.
- source_word: וְהוֹשַׁעְתִּים
  choice: je les sauverai
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. « Sauver » convient au contexte politique et militaire tout en conservant la portée plus large du terme.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: par Yahweh, leur Dieu
  rationale: La préposition ב est comprise comme marquant le moyen ou l’agent, en contraste avec les moyens militaires ensuite écartés. La formulation inhabituelle où Yahweh dit qu’il sauvera par Yahweh est conservée plutôt que lissée.
- source_word: וְלֹא אוֹשִׁיעֵם
  choice: Je ne les sauverai
  rationale: La répétition de « sauver » reproduit celle de la racine ישׁע et souligne le contraste entre l’action divine et les moyens militaires.
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה
  choice: ni par l’arc, ni par l’épée, ni par la guerre
  rationale: La répétition de « ni par » restitue naturellement en français l’accumulation des moyens militaires niés par le texte.
- source_word: בְּסוּסִים וּבְפָרָשִׁים
  choice: ni par les chevaux, ni par les cavaliers
  rationale: Ces équivalents concrets conservent l’image des forces montées sans généraliser en « armée » ou moderniser en « cavalerie ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre au lieu de lui substituer un titre.
- issue: Valeur de la préposition ב dans בַּיהוָה אֱלֹהֵיהֶם
  choice: 'valeur instrumentale ou d’agence : « par Yahweh, leur Dieu »'
  alternative: 'valeur relationnelle : « en Yahweh, leur Dieu »; médiation : « par l’intermédiaire de Yahweh, leur Dieu »'
  rationale: Le contexte oppose Yahweh à l’arc, à l’épée, à la guerre, aux chevaux et aux cavaliers. La lecture instrumentale ou agentive est donc la plus naturelle, mais la note conserve l’autre possibilité sans effacer l’étrangeté théologique de la formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique est préservée, notamment « la maison de Juda », la répétition de « sauver » et l’énumération martiale. La ponctuation sépare les deux affirmations contrastées sans expliciter davantage leur relation.
