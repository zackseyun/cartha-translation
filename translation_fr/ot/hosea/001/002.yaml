revisions:
- from: 'Début de la parole de Yahweh transmise par Osée[a]. Yahweh dit à Osée : « Va, prends pour toi une femme qui se prostitue et des enfants issus de la prostitution[b], car le pays se livre sans retenue à la prostitution[c] en se détournant de Yahweh. »'
  to: 'Début de la parole de Yahweh transmise par Osée[a]. Yahweh dit à Osée : « Va, prends pour toi une femme de prostitution et des enfants de prostitution[b], car le pays se livre sans retenue à la prostitution[c] en se détournant de Yahweh. »'
  rationale: La révision ne modifie pas le sens général, mais remplace deux explicitations interprétatives par une formulation qui préserve la construction parallèle et l’ambiguïté du texte hébreu. Les notes et leurs ancrages restent complets et cohérents.
