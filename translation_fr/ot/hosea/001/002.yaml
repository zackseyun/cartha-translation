source:
  edition: WLC
  text: תְּחִלַּ֥ת דִּבֶּר יְהוָ֖ה בְּ/הוֹשֵׁ֑עַ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הוֹשֵׁ֗עַ לֵ֣ךְ קַח לְ/ךָ֞ אֵ֤שֶׁת זְנוּנִים֙ וְ/יַלְדֵ֣י זְנוּנִ֔ים כִּֽי זָנֹ֤ה תִזְנֶה֙ הָ/אָ֔רֶץ מֵֽ/אַחֲרֵ֖י יְהוָֽה־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
translation:
  language: fr
  text: 'Début de la parole de Yahweh transmise par Osée[a]. Yahweh dit à Osée : « Va, prends pour toi une femme de prostitution et des enfants de prostitution[b], car le pays se livre sans retenue à la prostitution[c] en se détournant de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Lorsque Yahweh commença à parler par Osée ». L’ouverture hébraïque peut se comprendre comme un intitulé ou comme une proposition temporelle.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une femme de prostitutions et des enfants de prostitutions ». Le terme hébreu peut désigner la prostitution proprement dite ou, plus largement, l’inconduite sexuelle.'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu répète la racine verbale pour insister : littéralement, « car le pays, se prostituant, se prostitue loin de Yahweh ». Cette image exprime avec force son infidélité envers Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבֶּר יְהוָה בְּהוֹשֵׁעַ
  choice: Début de la parole de Yahweh transmise par Osée
  rationale: La formulation conserve la valeur possible d’incipit de תְּחִלַּת et comprend בְּהוֹשֵׁעַ dans un sens instrumental, « par l’intermédiaire d’Osée ». La note maintient l’autre analyse possible, celle d’une proposition temporelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לֵךְ קַח לְךָ
  choice: Va, prends pour toi
  rationale: Les deux impératifs ainsi que לְךָ sont conservés. « Épouse » serait plus explicite, mais interpréterait davantage le verbe קַח.
- source_word: אֵשֶׁת זְנוּנִים
  choice: une femme qui se prostitue
  rationale: Cette expression française naturelle garde la violence de l’image sexuelle. זְנוּנִים peut viser la prostitution proprement dite ou, plus largement, l’inconduite sexuelle.
- source_word: וְיַלְדֵי זְנוּנִים
  choice: et des enfants issus de la prostitution
  rationale: La traduction maintient le parallélisme avec la femme et explicite en français le lien que le construit hébreu laisse condensé, sans déterminer davantage la situation des enfants.
- source_word: כִּי זָנֹה תִזְנֶה
  choice: car le pays se livre sans retenue à la prostitution
  rationale: « Sans retenue » restitue l’intensification produite par l’infinitif absolu suivi du verbe conjugué, tout en gardant l’image prophétique.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le terme désigne le territoire d’Israël avec ses habitants. « Pays » permet naturellement en français la personnification collective.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: en se détournant de Yahweh
  rationale: La tournure rend clairement l’idée d’abandonner la marche à la suite de Yahweh, portée par l’expression hébraïque littérale « loin de derrière Yahweh ».
theological_decisions:
- issue: Degré de crudité à conserver dans l’image sexuelle
  choice: Conserver l’image de la prostitution dans les trois occurrences
  alternative: Employer « infidélité », « débauche » ou « inconduite »
  rationale: Le langage sexuel choquant fait partie de la force du signe prophétique et de l’accusation d’infidélité envers Yahweh. La note signale toutefois que le mot hébreu peut couvrir un champ plus large que la prostitution commerciale.
- issue: Valeur de בְּהוֹשֵׁעַ dans la première proposition
  choice: par Osée, au sens de médiation prophétique
  alternative: à Osée ou avec Osée
  rationale: La proposition suivante emploie explicitement אֶל הוֹשֵׁעַ pour introduire la parole adressée « à Osée ». Cette variation favorise ici la valeur instrumentale, sans supprimer l’ambiguïté de l’ouverture.
- issue: Rapport entre le comportement du pays et son abandon de Yahweh
  choice: Présenter la prostitution comme l’image de l’abandon de Yahweh
  alternative: Lire les deux éléments comme des actions simplement juxtaposées
  rationale: 'מֵאַחֲרֵי יְהוָה précise en quoi consiste la prostitution métaphorique du pays : il cesse de suivre Yahweh. La traduction maintient ce rapport sans réduire l’expression à une notion doctrinale plus précise.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu là où elle demeure naturelle. Le vocabulaire sexuel n’est pas édulcoré, mais les tournures françaises évitent l’archaïsme peu intelligible de formulations telles que « femme de prostitutions » dans le corps du texte.
