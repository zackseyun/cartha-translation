base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/005.yaml
  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
translation:
  language: fr
  text: En ce jour-là, je briserai l’arc d’Israël dans la vallée de Jizréel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je mettrai en pièces l’arc d’Israël ». L’« arc » représente ici la puissance militaire d’Israël.
    reason: Variante lexicale et explication de l’image.
lexical_decisions:
- source_word: וְהָיָה
  choice: En ce jour-là
  rationale: La formule hébraïque introduit un événement futur. En français naturel, elle s’intègre à l’expression temporelle sans qu’il soit nécessaire de rendre littéralement « il arrivera ».
- source_word: בַּיּוֹם הַהוּא
  choice: en ce jour-là
  rationale: Cette tournure prophétique temporelle est rendue de manière courante et digne en français.
- source_word: וְשָׁבַרְתִּי
  choice: je briserai
  rationale: Le verbe שׁבר signifie « briser » ou « mettre en pièces ». « Briser » conserve ici la force de l’image appliquée à une arme.
- source_word: קֶשֶׁת יִשְׂרָאֵל
  choice: l’arc d’Israël
  rationale: La traduction garde l’image concrète de l’arc, employée par métonymie pour évoquer la puissance militaire d’Israël.
- source_word: בְּעֵמֶק
  choice: dans la vallée de
  rationale: עֵמֶק désigne une vallée; la préposition situe l’action dans ce lieu.
- source_word: יִזְרְעֶאל
  choice: Jizréel
  rationale: « Jizréel » est la forme française traditionnelle et usuelle du nom de ce lieu biblique.
theological_decisions:
- issue: Faut-il traduire « l’arc » littéralement ou expliciter la puissance militaire d’Israël ?
  choice: Conserver « l’arc d’Israël » dans le texte principal.
  alternative: la puissance militaire d’Israël
  rationale: L’hébreu présente une image militaire concrète dotée d’une portée symbolique. La conserver respecte la rhétorique prophétique sans remplacer le texte par son interprétation.
translation_notes:
  register: Français international moderne, naturel et soutenu. L’image prophétique est préservée; le nom géographique suit l’usage biblique français.
