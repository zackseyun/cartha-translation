id: HOS.1.3
reference: Hosea 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח אֶת גֹּ֖מֶר בַּת דִּבְלָ֑יִם וַ/תַּ֥הַר וַ/תֵּֽלֶד ל֖/וֹ בֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
translation:
  language: fr
  text: Il alla donc prendre Gomer, fille de Diblaïm[a]. Elle devint enceinte et lui donna un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épouser Gomer » ou « prendre Gomer pour femme ». L’hébreu dit littéralement « prendre »; le contexte lui donne ici un sens matrimonial.
    reason: Alternative lexicale
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il alla donc
  rationale: Le wayyiqtol de הלך fait progresser le récit. « Il alla donc » exprime naturellement en français la succession et la conséquence de l’ordre précédent.
- source_word: וַיִּקַּח
  choice: prendre
  rationale: לקח signifie littéralement « prendre » et peut, dans ce contexte, désigner le fait de prendre une femme pour épouse. Garder « prendre » préserve la formulation hébraïque, tandis que le contexte fournit le sens matrimonial.
- source_word: אֶת גֹּמֶר
  choice: Gomer
  rationale: La marque de l’objet direct אֵת ne se traduit pas. Le nom propre est translittéré sous la forme française usuelle « Gomer ».
- source_word: בַּת דִּבְלָיִם
  choice: fille de Diblaïm
  rationale: בַּת suivi d’un nom propre constitue une désignation patronymique. « Fille de Diblaïm » est direct et naturel en français.
- source_word: וַתַּהַר
  choice: Elle devint enceinte
  rationale: הרה signifie concevoir ou devenir enceinte. Cette formulation est claire, actuelle et naturelle en français.
- source_word: וַתֵּלֶד
  choice: donna
  rationale: Dans la tournure « donner un fils à quelqu’un », ילד est rendu idiomatiquement avec le sens d’enfanter, sans lourdeur.
- source_word: לוֹ
  choice: lui
  rationale: Le ל préfixé avec suffixe pronominal marque ici la relation au père; « lui donna un fils » en restitue naturellement la valeur.
- source_word: בֵּן
  choice: un fils
  rationale: בֵּן désigne un enfant de sexe masculin. L’article indéfini convient puisque l’enfant est introduit ici avant d’être nommé au verset suivant.
theological_decisions:
- issue: Faut-il expliciter le sens matrimonial de וַיִּקַּח ?
  choice: Conserver « prendre » dans le texte principal.
  alternative: « épouser Gomer » ou « prendre Gomer pour femme »
  rationale: Le verbe peut avoir un sens matrimonial dans ce contexte, mais l’hébreu dit simplement « prendre ». Le commandement du verset précédent rend la relation matrimoniale intelligible; la note signale l’explicitation possible sans l’imposer au texte.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe suit le déroulement narratif hébreu tout en restant idiomatique. « Devint enceinte » évite le registre plus littéraire de « conçut », et la note préserve la portée matrimoniale possible de « prendre ».
