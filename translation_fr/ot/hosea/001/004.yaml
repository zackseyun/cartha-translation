  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
translation:
  language: fr
  text: 'Alors Yahweh lui dit : « Appelle-le Jizréel[a], car, dans peu de temps, je punirai la maison de Jéhu pour le sang de Jizréel[b], et je mettrai fin au royaume de la maison d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jizréel est à la fois le nom symbolique de l’enfant et celui du lieu associé aux actes violents de Jéhu.
    reason: cultural_note
  - marker: b
    text: 'On peut aussi comprendre : « pour le sang versé à Jizréel » ou « pour la culpabilité liée au sang versé à Jizréel ». L’expression hébraïque signifie littéralement « les sangs de Jizréel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver son caractère de nom propre plutôt que de le remplacer par un titre.
- source_word: קְרָא שְׁמוֹ
  choice: Donne-lui le nom de
  rationale: Cette formulation française naturelle rend l’acte de nommer exprimé par l’idiome hébreu, sans raideur inutile.
- source_word: יִזְרְעֶאל
  choice: Jizréel
  rationale: La forme française usuelle du nom propre est conservée aux deux occurrences, ce qui maintient le lien symbolique entre le nom de l’enfant et le lieu.
- source_word: כִּי עוֹד מְעַט
  choice: car, dans peu de temps
  rationale: « Car » conserve la valeur explicative de כִּי, tandis que « dans peu de temps » exprime l’imminence sans la réduire au simple adverbe « bientôt ».
- source_word: וּפָקַדְתִּי
  choice: je punirai
  rationale: Dans cet oracle de jugement, פקד a une valeur punitive; « punir » en communique clairement la force en français moderne.
- source_word: דְּמֵי יִזְרְעֶאל
  choice: le sang versé à Jizréel
  rationale: Le pluriel idiomatique hébreu, littéralement « les sangs », désigne le sang répandu ou la culpabilité qui s’y rattache. La note préserve l’étendue possible de l’expression.
- source_word: עַל בֵּית יֵהוּא
  choice: la maison de Jéhu pour
  rationale: Avec le verbe punitif, cette construction française exprime naturellement la cible du jugement et son motif.
- source_word: וְהִשְׁבַּתִּי
  choice: je mettrai fin à
  rationale: La forme causative du verbe signifie ici faire cesser; cette expression est claire, naturelle et suffisamment solennelle.
- source_word: מַמְלְכוּת בֵּית יִשְׂרָאֵל
  choice: le royaume de la maison d’Israël
  rationale: La traduction conserve « maison », présent dans la chaîne construite hébraïque, sans décider s’il faut mettre principalement l’accent sur la dynastie ou sur la nation.
theological_decisions:
- issue: Nature du jugement prononcé contre Jéhu
  choice: Présenter le châtiment de la maison de Jéhu pour le sang versé associé à Jizréel, sans expliquer davantage sa relation avec 2 Rois 9–10.
  alternative: Affirmer soit que le massacre accompli par Jéhu était en lui-même coupable, soit que seuls les actes ultérieurs de sa dynastie sont visés.
  rationale: Le verset annonce nettement un jugement, mais ne résout pas à lui seul la tension avec la mission autrefois confiée à Jéhu. La traduction ne doit ni harmoniser ni accentuer cette tension par une interprétation ajoutée.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’oracle hébreu tout en évitant les calques peu idiomatiques; les répétitions porteuses de sens, notamment « Jizréel » et « maison », sont conservées.
