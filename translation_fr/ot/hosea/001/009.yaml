source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר קְרָ֥א שְׁמ֖/וֹ לֹ֣א עַמִּ֑י כִּ֤י אַתֶּם֙ לֹ֣א עַמִּ֔/י וְ/אָנֹכִ֖י לֹֽא אֶהְיֶ֥ה לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/009.yaml
  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
translation:
  language: fr
  text: 'Il dit : « Appelle-le Pas-mon-peuple, car vous n’êtes pas mon peuple, et moi, je ne serai pas à vous.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et je ne serai pas votre Dieu ». L’hébreu est elliptique et évoque ici la formule de l’alliance.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  choice: Appelle-le
  rationale: Cette formulation française naturelle rend l’expression hébraïque de désignation, littéralement « appelle son nom », sans alourdir la phrase.
- source_word: לֹא עַמִּי
  choice: Pas-mon-peuple
  rationale: Le sens du nom symbolique est traduit plutôt que translittéré afin de préserver sa force prophétique ; les traits d’union indiquent qu’il s’agit d’un nom propre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée au choix du nom ; « car » conserve clairement cette valeur causale.
- source_word: אַתֶּם לֹא עַמִּי
  choice: vous n’êtes pas mon peuple
  rationale: Traduction directe de la formule d’alliance renversée, avec le pluriel « vous » explicitement présent dans l’hébreu.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  choice: et moi, je ne serai pas à vous
  rationale: Le futur de אֶהְיֶה est conservé et « à vous » maintient autant que possible l’ellipse hébraïque sans ajouter « Dieu ». La tournure inhabituelle préserve la tension de la formule d’alliance.
theological_decisions:
- issue: Renversement de la formule d’alliance dans la dernière proposition
  choice: Ne pas ajouter « votre Dieu » dans le texte principal
  alternative: « et je ne serai pas votre Dieu » ou « et je ne serai pas des vôtres »
  rationale: L’hébreu fait écho à la formule d’alliance, mais ne contient pas explicitement le mot « Dieu ». La traduction principale conserve donc l’ellipse et le futur, tandis que la note présente l’interprétation explicite courante.
translation_notes:
  register: 'Français moderne, digne et accessible. Le nom symbolique est traduit pour que son lien avec la proposition suivante soit immédiatement perceptible. La légère étrangeté de « je ne serai pas à vous » est intentionnelle : elle reflète l’ellipse et l’ambiguïté de l’hébreu.'
