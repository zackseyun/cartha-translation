id: HOS.1.1
reference: Hosea 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל הוֹשֵׁ֨עַ֙ בֶּן בְּאֵרִ֔י בִּ/ימֵ֨י עֻזִּיָּ֥ה יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה וּ/בִ/ימֵ֛י יָרָבְעָ֥ם בֶּן יוֹאָ֖שׁ מֶ֥לֶךְ יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/001.yaml
  text: The word of Yahweh that came to Hosea son of Beeri in the days of Uzziah[a], Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam son of Joash, king of Israel.
translation:
  language: fr
  text: La parole de Yahvé[a] qui fut adressée à Osée, fils de Beéri, au temps d’Ozias, de Jotham, d’Ahaz et d’Ézéchias, rois de Juda, et au temps de Jéroboam, fils de Joas, roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le SEIGNEUR » ; autre transcription possible : « Yahweh ».'
    reason: Signaler la forme hébraïque du nom divin ainsi que ses principales conventions de rendu en français.
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: La parole de Yahvé
  rationale: Cette formulation conserve l’expression consacrée des introductions prophétiques et son registre de révélation divine, sans réduire דָּבָר au sens plus interprétatif de « message ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la transcription française courante du nom divin YHWH et permet de le distinguer du titre « Seigneur ».
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui fut adressée à
  rationale: Dans les formules d’introduction prophétiques, cette tournure indique que la parole divine parvient au prophète. « Fut adressée à » est naturel en français tout en gardant la parole comme sujet.
- source_word: הוֹשֵׁעַ בֶּן בְּאֵרִי
  choice: Osée, fils de Beéri
  rationale: Les noms suivent leurs formes françaises bibliques usuelles, et le patronyme hébreu est rendu directement.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Cette expression française rend naturellement l’indication temporelle hébraïque littéralement formulée « dans les jours de ».
- source_word: עֻזִּיָּה יוֹתָם אָחָז יְחִזְקִיָּה מַלְכֵי יְהוּדָה
  choice: Ozias, Jotham, Ahaz et Ézéchias, rois de Juda
  rationale: Les formes françaises établies des noms royaux sont employées, et l’apposition « rois de Juda » conserve la structure et la portée du texte.
- source_word: וּבִימֵי יָרָבְעָם בֶּן יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: et au temps de Jéroboam, fils de Joas, roi d’Israël
  rationale: La répétition du cadre temporel est maintenue, ainsi que le patronyme et l’apposition royale qui distinguent le souverain du royaume du Nord.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La transcription « Yahvé », familière au lectorat francophone, préserve son statut de nom personnel, tandis qu’une note signale la tradition qui le remplace par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la solennité concise d’une suscription prophétique et la répétition du repère chronologique, tout en employant une syntaxe française naturelle.
