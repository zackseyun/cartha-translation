  text: After she had weaned Lo-ruhamah[a], she conceived and gave birth to a son.
translation:
  language: fr
  text: Après avoir sevré Lo-Rouhama[a], elle conçut et mit au monde un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lo-Rouhama signifie « Celle qui n’a pas reçu de compassion » ou « Sans compassion ». Le sens de ce nom est important dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  choice: Après avoir sevré
  rationale: Dans ce contexte, le qal de גמל signifie « sevrer ». La construction temporelle française exprime naturellement que le sevrage précède la nouvelle conception.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule signale en hébreu un complément d’objet direct défini et n’a pas d’équivalent lexical distinct en français.
- source_word: לֹא רֻחָמָה
  choice: Lo-Rouhama
  rationale: Le nom propre est translittéré plutôt que traduit dans le texte principal. Le trait d’union conserve visiblement sa forme composée, et « Rouhama » représente naturellement la prononciation hébraïque en français.
- source_word: וַתַּהַר
  choice: elle devint enceinte
  rationale: Cette formulation française actuelle et digne rend clairement הרה dans la formule narrative de conception.
- source_word: וַתֵּלֶד
  choice: donna naissance
  rationale: « Donner naissance » est une expression claire et naturelle en français moderne pour ילד dans ce récit.
- source_word: בֵּן
  choice: à un fils
  rationale: Le nom signifie « fils » ; l’article indéfini convient à l’introduction d’un nouvel enfant dans le récit.
