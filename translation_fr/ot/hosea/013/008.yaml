    issue: « éventrera » pour תבקעֵם
    rationale: Le verbe signifie fendre, ouvrir ou mettre en pièces. « Éventrer » ajoute un objet anatomique précis qui n’est pas exprimé par le verbe final et peut produire une redondance interprétative avec l’image précédente du cœur.
