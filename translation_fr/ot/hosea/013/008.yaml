  source_fidelity: Le sens menaçant de l’hébreu est bien rendu, de même que la succession des images de prédateurs. Toutefois, לָבִיא n’impose pas le féminin ; « lion » est la solution française générique et plus prudente, avec « lionne » maintenu en note. Pour תבקעֵם, « mettra en pièces » restitue mieux l’idée de fendre ou déchirer violemment sans imposer le détail anatomique d’« éventrer ».
  naturalness: Le français est moderne, fluide et conserve un registre prophétique soutenu. « Une bête sauvage » est idiomatique pour חַיַּת הַשָּׂדֶה, dont la formule désigne un animal sauvage plutôt qu’un animal précisément localisé dans des champs.
  terminology: « Ourse privée de ses petits », « enveloppe de leur cœur » avec note explicative, et « dévorerai » sont des choix fidèles et naturels. Le changement de « lionne » à « lion » préserve l’ambiguïté lexicale sans tirer une conclusion à partir de l’image antérieure de l’ourse.
