base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
translation:
  language: fr
  text: Je les attaquerai comme une ourse privée de ses petits, et je déchirerai l’enveloppe de leur cœur[a] ; là, je les dévorerai comme un lion[b] ; une bête sauvage les mettra en pièces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui enferme leur cœur », possiblement leur poitrine ou leur poitrine. L’expression hébraïque est rare et difficile.
    reason: lexical_alternative
  - marker: b
    text: Ou « une lionne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  choice: Je les attaquerai
  rationale: Le verbe פגשׁ signifie d’abord « rencontrer, affronter », mais le contexte de jugement et l’image des prédateurs lui donnent ici une force hostile que « attaquer » exprime naturellement.
- source_word: כְּדֹב שַׁכּוּל
  choice: comme une ourse privée de ses petits
  rationale: שַׁכּוּל décrit la perte de ses enfants ou de ses petits. Le féminin « ourse », naturel en français dans cette image maternelle, restitue la férocité implicite.
- source_word: וְאֶקְרַע
  choice: et je déchirerai
  rationale: קרע signifie « déchirer, mettre en pièces ». « Déchirer » conserve directement la violence de l’image.
- source_word: סְגוֹר לִבָּם
  choice: l’enveloppe de leur cœur
  rationale: L’expression rare désigne littéralement ce qui ferme ou entoure le cœur, probablement la poitrine. Cette formulation conserve l’étrangeté de l’hébreu sans imposer une interprétation anatomique certaine.
- source_word: וְאֹכְלֵם שָׁם
  choice: là, je les dévorerai
  rationale: Dans l’imagerie animale, אכל se rend naturellement par « dévorer » ; שָׁם est explicitement conservé par « là ».
- source_word: כְּלָבִיא
  choice: comme une lionne
  rationale: לָבִיא peut désigner un lion ou une lionne adulte. « Lionne » s’accorde avec la série d’images maternelles ouverte par l’ourse, tout en laissant l’autre possibilité en note.
- source_word: חַיַּת הַשָּׂדֶה
  choice: une bête sauvage
  rationale: Le singulier hébreu et le verbe singulier favorisent une bête individuelle. En français moderne, « sauvage » rend suffisamment l’idée de l’animal des espaces non domestiqués, sans le calque pesant « des champs ».
- source_word: תְּבַקְּעֵם
  choice: les éventrera
  rationale: בקע signifie « fendre, ouvrir en fendant ». Dans ce contexte d’attaque animale, « éventrer » exprime précisément l’ouverture violente du corps, plus directement que « mettre en pièces ».
theological_decisions:
- issue: Dieu se décrit au moyen d’images de prédateurs
  choice: Maintenir la parole divine à la première personne et toute la violence des métaphores animales.
  alternative: Atténuer les images en les reformulant comme une annonce générale de jugement.
  rationale: L’hébreu présente Dieu comme l’agent direct du jugement et enchaîne des images volontairement brutales. Les adoucir supprimerait une tension théologique réelle du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve le rythme menaçant de la série verbale et la brutalité voulue des images, tout en signalant les principales incertitudes lexicales.
