  to: Je les attaquerai comme une ourse privée de ses petits, et je déchirerai l’enveloppe de leur cœur[a] ; là, je les dévorerai comme un lion[b] ; une bête sauvage les mettra en pièces.
  rationale: La révision préserve l’incertitude concernant לָבִיא en choisissant « lion » dans le texte et en indiquant « lionne » comme alternative. Elle remplace aussi « éventrera » par « mettra en pièces », qui rend la violence de בקע sans spécifier que l’animal ouvre le ventre. La note a est conservée et clarifie la difficulté de l’expression sans l’aplanir.
