  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וֵ/אלֹהִ֤ים זֽוּלָתִ/י֙ לֹ֣א תֵדָ֔ע וּ/מוֹשִׁ֥יעַ אַ֖יִן בִּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
translation:
  language: fr
  text: Mais moi, je suis Yahvé, ton Dieu, depuis le pays d’Égypte[a]. Tu ne connais aucun dieu en dehors de moi[b], et il n’y a pas de sauveur en dehors de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à partir du pays d’Égypte » ou « en te faisant sortir du pays d’Égypte ». L’expression hébraïque peut souligner soit la relation de Yahvé avec Israël depuis l’époque de l’exode, soit son action salvatrice lorsqu’il l’a fait sortir d’Égypte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu ne reconnaîtras aucun dieu en dehors de moi ». Le verbe hébreu peut avoir une valeur déclarative, mais aussi exprimer une exigence liée à l’alliance.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Mais moi, je
  rationale: La conjonction et le pronom emphatique marquent ici un contraste. « Mais moi, je » le rend naturellement en français tout en conservant l’insistance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du tétragramme préserve le nom personnel divin au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Avec le nom YHWH et le suffixe masculin singulier, le terme désigne au singulier le Dieu d’Israël dans le cadre de l’alliance.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: depuis le pays d’Égypte
  rationale: Cette formulation conserve la référence historique et la nuance temporelle possible de la préposition, sans exclure l’allusion à l’action salvatrice de la sortie d’Égypte.
- source_word: וֵאלֹהִים
  choice: aucun autre dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים a ici un sens générique singulier dans une affirmation d’exclusivité. « Aucun autre dieu » est clair et idiomatique en français.
- source_word: זוּלָתִי
  choice: que moi
  rationale: Le terme exprime l’exclusion. Après « aucun autre dieu », « que moi » restitue cette valeur avec naturel.
- source_word: לֹא תֵדָע
  choice: tu ne connais
  rationale: Le présent rend la lecture déclarative du verbe tout en laissant résonner sa portée relationnelle et covenantale; la possible valeur injonctive est signalée en note.
- source_word: וּמוֹשִׁיעַ
  choice: et il n’y a pas de sauveur
  rationale: Le participe désigne celui qui sauve ou délivre. La tournure existentielle française correspond à la construction avec אַיִן.
- source_word: אַיִן בִּלְתִּי
  choice: il n’y a pas… en dehors de moi
  rationale: Cette formulation exprime clairement la négation existentielle et l’exclusion absolue portées par les deux termes hébreux.
theological_decisions:
- issue: Exclusivité de l’identité divine et du salut
  choice: Le verset affirme que Yahvé est le seul Dieu qu’Israël connaisse et qu’il n’existe aucun sauveur en dehors de lui.
  alternative: 'La première proposition peut être comprise plus directement en lien avec la sortie d’Égypte, et la proposition centrale comme une prescription : « tu ne reconnaîtras aucun autre dieu que moi ».'
  rationale: L’hébreu présente une déclaration d’alliance enracinée dans l’Égypte ou l’exode et revendique pour Yahvé seul la divinité et le pouvoir de sauver. La traduction préserve cette exclusivité sans y ajouter de formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. « Yahvé » conserve le nom divin; « sauveur » garde la portée à la fois historique et théologique du participe hébreu.
