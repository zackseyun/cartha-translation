id: HOS.13.5
reference: Hosea 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֥י יְדַעְתִּ֖י/ךָ בַּ/מִּדְבָּ֑ר בְּ/אֶ֖רֶץ תַּלְאֻבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/005.yaml
  text: I knew you in the wilderness[b][a], in a land of severe drought.
translation:
  language: fr
  text: Moi, je t’ai connu[a] dans le désert, dans une terre de grande sécheresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai pris soin de toi » ou « je t’ai reconnu » ; le verbe hébreu peut exprimer une connaissance relationnelle, notamment dans le cadre d’une alliance, et non une simple connaissance intellectuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans une terre brûlée par la chaleur », « dans une terre de soif » ou « dans une terre aride » ; le terme hébreu est rare et évoque une sécheresse ou une chaleur extrême.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיךָ
  choice: je t’ai connu
  rationale: Le verbe ידע signifie fondamentalement « connaître ». Dans ce contexte, il peut évoquer une relation d’alliance, la reconnaissance ou les soins accordés à Israël, mais « je t’ai connu » préserve le sens lexical premier et laisse cette portée relationnelle implicite.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région désertique ou sauvage. « Dans le désert » est naturel en français moderne et conserve l’écho du séjour d’Israël au désert après l’exode.
- source_word: בְּאֶרֶץ
  choice: dans une terre
  rationale: La construction hébraïque est indéfinie et décrit le milieu traversé. « Dans une terre » rend cette formulation sans identifier un territoire précis.
- source_word: תַּלְאֻבוֹת
  choice: de grande sécheresse
  rationale: Ce nom rare évoque une aridité extrême, la soif ou une chaleur desséchante. « Grande sécheresse » exprime clairement la rigueur du milieu tout en réservant les autres nuances à la note.
theological_decisions:
- issue: Portée de la connaissance divine envers Israël
  choice: La dimension relationnelle ou liée à l’alliance reste implicite dans « je t’ai connu ».
  alternative: « J’ai pris soin de toi » ou « je t’ai reconnu »
  rationale: Le contexte rappelle vraisemblablement les soins de YHWH envers Israël au désert, mais le verbe hébreu demeure « connaître ». La traduction principale conserve donc la tension entre connaissance et sollicitude, sans imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, simple et digne. L’accent initial « Moi » rend l’emphase du pronom hébreu אֲנִי. « Désert » maintient la résonance biblique de l’exode, tandis que les notes signalent les ambiguïtés lexicales réelles sans alourdir le texte principal.
