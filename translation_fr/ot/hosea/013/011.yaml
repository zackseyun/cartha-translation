  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
translation:
  language: fr
  text: Je t’ai donné un roi dans ma colère[a], et je l’ai repris[b] dans ma fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Je te donne un roi dans ma colère, et je le reprends dans ma fureur. » Les formes verbales hébraïques sont des inaccomplis, qui peuvent aussi recevoir une valeur présente ou future ; le contexte permet toutefois de les comprendre rétrospectivement.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit simplement « et je prends » ; le roi n’est pas exprimé. Le pronom « le », qui renvoie au roi, explicite cet objet sous-entendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֶּן
  choice: Je t’ai donné
  rationale: Bien que la forme soit un inaccompli qal à la première personne du singulier, le contexte permet une lecture rétrospective évoquant l’octroi de la royauté à Israël. Le passé composé est naturel en français actuel, tandis que la valeur morphologique plus littérale est signalée en note.
- source_word: לְךָ
  choice: t’
  rationale: Le complément de deuxième personne masculine singulière désigne Israël collectivement. Le pronom indirect placé avant « ai donné » est la formulation française idiomatique.
- source_word: מֶלֶךְ
  choice: un roi
  rationale: Le nom sans article se rend naturellement par l’indéfini et renvoie à l’octroi d’un roi ou de la royauté sans nommer ici un souverain précis.
- source_word: בְּאַפִּי
  choice: dans ma colère
  rationale: Cette expression indique la circonstance dans laquelle Dieu a donné le roi. « Colère » traduit couramment אַף et préserve la distinction avec le terme plus intense du second membre.
- source_word: וְאֶקַּח
  choice: et je l’ai repris
  rationale: Le verbe signifie littéralement « prendre »; le roi constitue l’objet implicite. « Reprendre » exprime en français le retrait de ce qui avait été donné, sans ajouter un nouveau référent.
- source_word: בְּעֶבְרָתִי
  choice: dans ma fureur
  rationale: עֶבְרָה évoque une colère intense. « Fureur » conserve la vigueur du terme et le contraste lexical avec « colère ».
theological_decisions:
- issue: Valeur temporelle et aspectuelle des deux formes verbales à la première personne
  choice: 'Lecture rétrospective : « Je t’ai donné… et je l’ai repris »'
  alternative: 'Lecture présente ou future : « Je te donne… et je le reprends / le reprendrai »'
  rationale: Les formes hébraïques sont des inaccomplis, mais le contexte prophétique peut présenter rétrospectivement l’octroi puis le retrait des rois. La traduction principale adopte ce sens discursif tout en conservant l’ambiguïté morphologique dans une note.
- issue: Objet implicite de וְאֶקַּח
  choice: Le roi est repris explicitement par le pronom « l’ »
  alternative: 'Conserver l’absence d’objet : « et j’ai repris »'
  rationale: L’hébreu n’exprime pas l’objet, mais « un roi » fournit son référent immédiat. Le pronom est nécessaire à une formulation française claire et ne tranche pas une question doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé rend naturellement la lecture rétrospective. « Repris » souligne le mouvement inverse de « donné », tandis que « colère » et « fureur » maintiennent la variation et l’intensification du parallélisme hébreu. Tous les appels de note figurent dans le texte.
