source:
  edition: WLC
  text: כִּ֣י ה֔וּא בֵּ֥ן אַחִ֖ים יַפְרִ֑יא יָב֣וֹא קָדִים֩ ר֨וּחַ יְהוָ֜ה מִ/מִּדְבָּ֣ר עֹלֶ֗ה וְ/יֵב֤וֹשׁ מְקוֹר/וֹ֙ וְ/יֶחֱרַ֣ב מַעְיָנ֔/וֹ ה֣וּא יִשְׁסֶ֔ה אוֹצַ֖ר כָּל כְּלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
translation:
  language: fr
  text: Même s’il porte du fruit parmi ses frères[a], un vent d’est viendra — le vent de Yahvé[b], qui monte du désert. Sa source se tarira et sa fontaine s’asséchera. Il pillera le trésor de tout objet précieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car il est fécond parmi ses frères. » Selon le contexte, כִּי peut être compris dans un sens causal plutôt que concessif.'
    reason: lexical_alternative
  - marker: b
    text: « Le vent de Yahvé » peut aussi se traduire par « le souffle de Yahvé » ; ici, le parallèle avec le vent d’est qui monte du désert favorise le sens de « vent ».
    reason: alternative_reading
  - marker: c
    text: 'Le sujet de « pillera » est probablement le vent d’est ; il pourrait aussi s’agir d’un assaillant sous-entendu. Autre traduction possible : « Il pillera le dépôt de tout objet précieux. »'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Même si
  rationale: 'Dans le contexte, la particule introduit vraisemblablement une concession : malgré la fécondité d’Éphraïm, le jugement arrive. La note conserve la possibilité d’un sens causal.'
- source_word: בֵּן אַחִים יַפְרִיא
  choice: il porte du fruit parmi ses frères
  rationale: Cette formulation garde l’image de la fécondité liée au nom d’Éphraïm et rend naturellement l’expression difficile « fils de frères » comme une appartenance au groupe fraternel.
- source_word: קָדִים
  choice: un vent d’est
  rationale: Désigne le vent chaud et destructeur venant du désert, image courante du jugement prophétique.
- source_word: רוּחַ יְהוָה
  choice: le vent de Yahvé
  rationale: Le sens météorologique de רוּחַ est privilégié en raison de son apposition à « vent d’est » et de sa montée depuis le désert; le nom divin est translittéré.
- source_word: מִמִּדְבָּר עֹלֶה
  choice: qui monte du désert
  rationale: Préserve la valeur vivante du participe et rend מִדְבָּר par le naturel « désert ».
- source_word: מְקוֹרוֹ ... מַעְיָנוֹ
  choice: sa source ... sa fontaine
  rationale: Maintient le parallélisme entre deux termes désignant des points d’eau sans les confondre totalement.
- source_word: וְיֵבֹשׁ ... וְיֶחֱרַב
  choice: se tarira ... s’asséchera
  rationale: Deux verbes français idiomatiques rendent le dessèchement progressif des ressources en eau et conservent la variation du texte hébreu.
- source_word: יִשְׁסֶה
  choice: Il pillera
  rationale: Le verbe exprime le dépouillement ou le pillage. Le pronom masculin français peut renvoyer au vent d’est, tout en laissant perceptible l’indétermination du sujet hébreu.
- source_word: אוֹצַר כָּל כְּלִי חֶמְדָּה
  choice: le trésor de tous ses objets précieux
  rationale: אוֹצָר est compris comme le dépôt ou trésor contenant les objets de prix; le possessif explicite leur rattachement au personnage collectif.
theological_decisions:
- issue: Agent du jugement destructeur
  choice: Le vent d’est est qualifié de « vent de Yahvé », ce qui présente le désastre comme un jugement placé sous l’action divine.
  alternative: Traduire רוּחַ יְהוָה par « souffle de Yahvé » ou « Esprit de Yahvé ».
  rationale: L’apposition à « vent d’est » et la mention du désert favorisent nettement le sens météorologique, sans supprimer l’idée d’une initiative divine.
- issue: Sujet de יִשְׁסֶה
  choice: Le sujet est probablement le vent destructeur, rendu par « Il ».
  alternative: Comprendre comme sujet Éphraïm personnifié ou un envahisseur implicite.
  rationale: Le vent est l’antécédent actif le plus proche, mais l’hébreu n’identifie pas explicitement le sujet; la note signale donc l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme prophétique est conservé par les tirets et le parallélisme « source/fontaine ». « Porter du fruit » maintient le jeu étymologique probable avec Éphraïm, tandis que les notes préservent les ambiguïtés syntaxiques et lexicales.
