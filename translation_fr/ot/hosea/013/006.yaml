  text: As their pasture[a], they were satisfied; they were satisfied, and their heart was lifted up[b]; therefore they forgot me.
translation:
  language: fr
  text: Quand ils avaient leur pâturage[a], ils se sont rassasiés ; rassasiés, leur cœur s’est élevé[b] ; c’est pourquoi ils m’ont oublié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « selon leur pâturage ». L’hébreu peut aussi être compris dans un sens circonstanciel : « lorsqu’ils avaient un pâturage » ou « lorsqu’ils étaient au pâturage ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur cœur s’est élevé », expression évoquant l’orgueil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְעִיתָם
  choice: Quand ils ont eu de quoi paître
  rationale: Le כְּ initial peut avoir ici une valeur temporelle ou circonstancielle, tandis que מַרְעִית évoque la pâture. Cette formulation française exprime naturellement la situation d’abondance sans déterminer plus que ne le fait l’hébreu.
- source_word: וַיִּשְׂבָּעוּ … שָׂבְעוּ
  choice: ils ont été rassasiés ; une fois rassasiés
  rationale: La répétition de la racine שׂבע est conservée afin de reproduire l’insistance rhétorique du texte et la progression de l’abondance vers l’orgueil.
- source_word: וַיָּרָם לִבָּם
  choice: leur cœur s’est élevé
  rationale: La métaphore hébraïque est maintenue plutôt que remplacée directement par « ils sont devenus orgueilleux ».
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution marque clairement la conséquence en français courant et soutenu.
- source_word: שְׁכֵחוּנִי
  choice: ils m’ont oublié
  rationale: La traduction directe garde la force relationnelle et covenantale du verbe hébreu sans l’atténuer en « négligé ».
theological_decisions:
- issue: La métaphore du cœur élevé comme expression de l’orgueil
  choice: leur cœur s’est élevé
  alternative: ils sont devenus orgueilleux
  rationale: Conserver l’image biblique préserve la texture théologique du passage et laisse le lecteur percevoir le lien entre rassasiement, élévation intérieure et oubli de Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « rassasiés » et la métaphore du cœur élevé sont volontairement conservées ; la ponctuation rend nette la progression du verset.
