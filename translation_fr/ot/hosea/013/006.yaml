    issue: « de quoi paître »
    rationale: Cette expression peut faire entendre que les Israélites sont ceux qui paissent, alors que מַרְעִיתָם désigne plus directement leur pâturage ou la situation où ils étaient nourris. « leur pâturage » est à la fois plus proche et plus net.
  - severity: low
    issue: Formulation de la note a
    rationale: « Selon leur pâturage » est un calque peu naturel en français isolé. Il vaut mieux indiquer qu’il s’agit d’une traduction plus littérale et offrir les valeurs circonstancielle et temporelle sans surinterpréter.
