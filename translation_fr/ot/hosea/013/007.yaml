  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
translation:
  language: fr
  text: Alors je suis devenu à leur égard comme un lion ; comme un léopard, je serai à l’affût sur le chemin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « comme un léopard, je guetterai sur le chemin » ou « comme un léopard, je serai en embuscade sur la route ». Le dernier mot hébreu est difficile : il peut être compris comme un verbe à la première personne signifiant « guetter » ou « être à l’affût », plutôt que comme le nom « Assyrie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Alors je suis devenu
  rationale: Le wayyiqtol qal à la première personne du singulier de היה peut ici exprimer l’entrée dans un nouvel état. « Alors » rend naturellement l’enchaînement du jugement dans le contexte.
- source_word: לָהֶם
  choice: pour eux
  rationale: Avec « devenir », le français idiomatique emploie « pour eux » pour exprimer la relation à Israël.
- source_word: כְּמוֹ שָׁחַל
  choice: comme un lion
  rationale: שָׁחַל désigne un lion, avec une possible nuance de vigueur ou de férocité que le contexte prédateur fait déjà ressortir.
- source_word: כְּנָמֵר
  choice: comme un léopard
  rationale: נָמֵר désigne conventionnellement le léopard, félin tacheté associé ici à l’affût.
- source_word: עַל דֶּרֶךְ
  choice: au bord du chemin
  rationale: La formule situe le prédateur près d’une voie de passage, position naturelle pour une embuscade.
- source_word: אָשׁוּר
  choice: je me suis posté en embuscade
  rationale: Dans ce contexte, la forme difficile est comprise comme un verbe à la première personne évoquant l’observation ou l’affût. Cette traduction exprime clairement l’image prédatrice sans la réduire au seul fait de regarder.
theological_decisions:
- issue: Représentation anthropomorphique de Dieu comme prédateur dans le jugement
  choice: Conserver directement les comparaisons avec le lion et le léopard à l’affût.
  alternative: Atténuer l’image en traduisant par une surveillance protectrice du chemin.
  rationale: L’hébreu présente une image sévère du jugement divin. La traduction doit en préserver la force et la tension théologique.
- issue: Ambiguïté de אָשׁוּר
  choice: Comprendre la forme comme un verbe à la première personne décrivant l’affût.
  alternative: Lire le nom propre « Assyrie » ou traduire plus formellement « je guettais ».
  rationale: Le parallélisme des deux prédateurs et la mention du chemin favorisent fortement une action de guet ou d’embuscade, mais la difficulté textuelle mérite d’être signalée.
translation_notes:
  register: Français international moderne, naturel et digne. « Se poster en embuscade » rend explicitement l’image d’affût suggérée par le contexte, tandis que la note conserve les autres analyses possibles et l’ambiguïté du dernier mot.
