  - severity: low
    issue: Localisation rendue trop latérale
    rationale: « Au bord du chemin » est interprétatif. עַל־דֶּרֶךְ signifie plus directement « sur le chemin / la route »; la formulation révisée maintient l’ambiguïté spatiale sans perdre l’idée de guet.
