  source_fidelity: La lecture verbale de אָשׁוּר (« je guetterai / serai à l’affût ») est bien adaptée au contexte des deux prédateurs et l’ambiguïté avec « Assyrie » est signalée. Toutefois, le texte hébreu porte un imparfait à la seconde proposition; « je me suis posté » le transforme en action achevée. « Sur le chemin » rend plus directement עַל־דֶּרֶךְ que « au bord du chemin », sans exclure l’image d’affût.
  naturalness: La formulation révisée est naturelle en français international moderne. « Être à l’affût » exprime avec sobriété l’attente prédatrice, sans ajouter le détail concret d’une embuscade déjà accomplie.
  terminology: « Lion » et « léopard » sont exacts et conservent la vigueur de l’image de jugement. « À leur égard » évite la possible connotation favorable de « pour eux » tout en exprimant la relation marquée par לָהֶם.
