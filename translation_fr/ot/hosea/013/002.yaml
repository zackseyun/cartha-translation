source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. Of them they say[a], “Those who sacrifice human beings kiss calves[b][c].”'
translation:
  language: fr
  text: 'Et maintenant, ils continuent à pécher : ils se fabriquent avec leur argent des statues en métal fondu, des idoles façonnées selon leur propre savoir-faire — tout cela est l’œuvre d’artisans. À leur sujet, ils disent[a] : « Ceux qui sacrifient des êtres humains embrassent des veaux[b][c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « à eux, ils disent »; le lien syntaxique entre « à eux » et les mots qui suivent est difficile à déterminer.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Que les hommes qui offrent des sacrifices embrassent des veaux ! » Cette lecture comprend « être humain » comme un sujet générique et attribue au dernier verbe une valeur proche du souhait ou de l’ordre; la forme massorétique se lit plus naturellement comme un indicatif : « embrassent ».'
    reason: alternative_reading
  - marker: c
    text: C’est-à-dire des idoles en forme de veau.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le contexte précédent et la valeur temporelle du marqueur hébreu.
- source_word: יוֹסִפוּ לַחֲטֹא
  choice: ils continuent à pécher
  rationale: Rend l’idée de continuation ou de répétition exprimée par la construction hébraïque, dans un français naturel.
- source_word: וַיַּעְשׂוּ לָהֶם מַסֵּכָה
  choice: ils se fabriquent … des statues en métal fondu
  rationale: Le tour pronominal rend לָהֶם, « pour eux-mêmes »; le pluriel français exprime naturellement la valeur collective du singulier מַסֵּכָה dans le contexte des idoles.
- source_word: מִכַּסְפָּם
  choice: avec leur argent
  rationale: Dans ce contexte de fabrication, la préposition française « avec » indique naturellement la matière employée, leur propre argent.
- source_word: כִּתְבוּנָם
  choice: selon leur propre savoir-faire
  rationale: Le contexte immédiat de fabrication et la mention des artisans favorisent le sens d’habileté technique, tout en conservant la pointe ironique sur une œuvre purement humaine.
- source_word: עֲצַבִּים
  choice: des idoles façonnées
  rationale: « Idoles » désigne clairement les objets cultuels; « façonnées » relie sans lourdeur le terme à leur fabrication mentionnée juste avant.
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  choice: tout cela est l’œuvre d’artisans
  rationale: Souligne que ces idoles ne sont que des produits du travail humain et conserve le pluriel « artisans ».
- source_word: לָהֶם הֵם אֹמְרִים
  choice: À leur sujet, on dit
  rationale: Propose une formulation française intelligible reliant la parole aux idoles ou à leurs adorateurs, tandis que la difficulté syntaxique du littéral « à eux, ils disent » est signalée en note.
- source_word: זֹבְחֵי אָדָם
  choice: Ceux qui sacrifient des êtres humains
  rationale: Prend אָדָם comme complément du participe, lecture syntaxiquement naturelle du texte massorétique; « êtres humains » évite de limiter indûment le sens aux hommes de sexe masculin.
- source_word: עֲגָלִים יִשָּׁקוּן
  choice: embrassent des veaux
  rationale: Rend la forme massorétique comme un indicatif, sa valeur la plus naturelle, et conserve l’image frappante des veaux.
theological_decisions:
- issue: Interprétation de זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן
  choice: « Ceux qui sacrifient des êtres humains embrassent des veaux. »
  alternative: « Que les hommes qui offrent des sacrifices embrassent des veaux ! »
  rationale: L’hébreu est extrêmement condensé et permet plusieurs analyses. Le texte principal suit la lecture où אָדָם est l’objet du sacrifice et où le dernier verbe est indicatif. La lecture qui fait d’אָדָם un sujet humain générique et donne au verbe une nuance jussive demeure plausible et est donc conservée en note, sans effacer la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la progression de l’accusation. « Savoir-faire » convient au contexte artisanal; les notes préservent explicitement les difficultés syntaxiques et l’ambiguïté théologique du dernier membre.
