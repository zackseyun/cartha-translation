id: HOS.13.3
reference: Hosea 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן יִֽהְיוּ֙ כַּ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֣ים הֹלֵ֑ךְ כְּ/מֹץ֙ יְסֹעֵ֣ר מִ/גֹּ֔רֶן וּ/כְ/עָשָׁ֖ן מֵ/אֲרֻבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
translation:
  language: fr
  text: C’est pourquoi ils seront comme le nuage du matin, comme la rosée qui disparaît de bonne heure, comme la balle emportée en tourbillons hors de l’aire de battage, et comme la fumée qui sort par une fenêtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un treillis ». Le terme hébreu peut désigner une ouverture servant de fenêtre ou un ouvrage à claire-voie.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence de l’accusation et du jugement précédents.
- source_word: יִהְיוּ
  choice: ils seront
  rationale: Rend directement l’imparfait hébreu à valeur future dans cette annonce prophétique.
- source_word: כַּעֲנַן בֹּקֶר
  choice: comme le nuage du matin
  rationale: Conserve l’image de quelque chose de passager et sans consistance, avec une formulation française naturelle.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: comme la rosée qui disparaît de bonne heure
  rationale: מַשְׁכִּים marque la précocité, tandis que הֹלֵךְ décrit ici la rosée qui s’en va ou se dissipe rapidement.
- source_word: כְּמֹץ
  choice: comme la balle
  rationale: מוֹץ désigne la balle légère séparée du grain lors du battage ou du vannage; le singulier collectif est idiomatique en français.
- source_word: יְסֹעֵר
  choice: emportée en tourbillons
  rationale: Restitue le mouvement violent et tournoyant du verbe sans ajouter explicitement un agent absent du texte.
- source_word: מִגֹּרֶן
  choice: hors de l’aire de battage
  rationale: Préserve le cadre agricole de l’image et exprime clairement l’éloignement depuis l’aire.
- source_word: וּכְעָשָׁן
  choice: et comme la fumée
  rationale: Maintient la structure parallèle des comparaisons et l’image de ce qui se dissipe vite.
- source_word: מֵאֲרֻבָּה
  choice: qui sort par une fenêtre
  rationale: אֲרֻבָּה peut désigner une ouverture ou une fenêtre, éventuellement munie d’un treillis; « fenêtre » est le terme le plus accessible dans le texte principal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le rythme cumulatif des quatre comparaisons est conservé, ainsi que leur évocation commune d’une disparition rapide. Le marqueur de note a été placé après « fenêtre », le mot auquel porte réellement la variante lexicale.
