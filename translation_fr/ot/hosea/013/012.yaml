  text: Ephraim’s iniquity is bound up[a]; his sin is stored up.
translation:
  language: fr
  text: La faute d’Éphraïm est liée[a] ; son péché est gardé en réserve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « liée » ou « serrée en paquet ». L’image est celle d’une chose attachée et conservée.'
    reason: métaphore_lexicale
  - marker: b
    text: 'Ou : « caché ». Le verbe hébreu peut désigner ce qui est dissimulé ou ce qui est conservé en réserve, probablement ici en vue d’un règlement futur.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: צָרוּר
  choice: est mise sous scellés
  rationale: Le participe passif évoque ce qui est lié, serré ou rassemblé en paquet afin d’être conservé. « Mise sous scellés » transpose naturellement en français l’image d’une faute sécurisée et retenue, sans la réduire à une simple dissimulation.
- source_word: עֲוֺן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. Le parallélisme avec « péché » favorise ici l’acte coupable. « Faute » est courant, digne et conserve la portée morale du terme.
- source_word: אֶפְרָיִם
  choice: d’Éphraïm
  rationale: Le nom propre est translittéré selon l’usage français, et sa relation avec עֲוֺן est rendue naturellement par le complément du nom.
- source_word: צְפוּנָה
  choice: est gardé en réserve
  rationale: Le participe passif de צפן peut signifier caché, conservé ou mis en réserve. Dans ce contexte de jugement, « gardé en réserve » préserve l’idée que le péché demeure conservé, probablement en vue d’un règlement futur, sans rendre cette implication explicite dans le texte.
- source_word: חַטָּאתוֹ
  choice: son péché
  rationale: חַטָּאת désigne ici le péché et non un sacrifice pour le péché. Le suffixe masculin singulier est rendu par « son » et renvoie à Éphraïm envisagé collectivement.
theological_decisions:
- issue: Portée des deux images de conservation
  choice: La faute et le péché d’Éphraïm sont présentés comme retenus et conservés, ce qui suggère un jugement à venir sans l’expliciter.
  alternative: On pourrait comprendre la seconde image plus faiblement comme un péché simplement caché.
  rationale: Le parallélisme des deux participes passifs, dans le contexte de jugement d’Osée 13, évoque une culpabilité qui n’est ni effacée ni oubliée. La formulation maintient toutefois l’image prophétique et ne transforme pas son implication en affirmation doctrinale explicite.
translation_notes:
  register: Français international moderne, sobre et prophétique. « Mise sous scellés » évite l’étrangeté de « liée en paquet » dans le corps du texte tout en conservant l’idée d’une faute sécurisée et retenue ; la note donne l’image hébraïque littérale.
