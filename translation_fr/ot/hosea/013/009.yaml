  text: שִֽׁחֶתְ/ךָ֥ יִשְׂרָאֵ֖ל כִּֽי בִ֥/י בְ/עֶזְרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/009.yaml
  text: You have destroyed yourself[a], Israel, because your help is in me.
translation:
  language: fr
  text: Il t’a détruit, Israël,[a] car c’est en moi que se trouve ton secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de ce verset est difficile; le sujet de « il t’a détruit » est implicite. On peut aussi comprendre : « Tu t’es détruit, Israël, car c’est en moi que se trouve ton secours », ou, plus littéralement : « Ta destruction, Israël… » Une autre lecture possible est : « Ta destruction, Israël : car tu es contre moi, contre ton secours. »'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁחֶתְךָ
  choice: Il t’a détruit
  rationale: La vocalisation massorétique se comprend le plus directement comme une forme verbale avec un objet masculin singulier (« t’ »), tandis que le sujet reste implicite. Le français exigeant généralement un sujet exprimé, « Il » est fourni sans identifier davantage ce sujet. La difficulté syntaxique et les autres lectures importantes sont signalées en note.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française habituelle et fonctionne ici comme vocatif.
- source_word: כִּי
  choice: car
  rationale: « Car » exprime naturellement la valeur explicative ou causale de כִּי tout en laissant subsister la tension logique du verset.
- source_word: בִי
  choice: en moi
  rationale: La préposition ב est rendue selon son sens ordinaire de localisation ou de relation. La lecture adversative « contre moi » reste possible dans cette phrase difficile et figure dans la note.
- source_word: בְעֶזְרֶךָ
  choice: se trouve ton secours
  rationale: עֵזֶר est rendu par le nom « secours ». L’ajout idiomatique « se trouve » explicite en français la proposition nominale hébraïque sans transformer le nom en verbe.
theological_decisions:
- issue: Interprétation de l’ouverture syntaxiquement difficile
  choice: « Il t’a détruit » suit au plus près la vocalisation du texte massorétique, avec un sujet implicite rendu par « Il ».
  alternative: « Tu t’es détruit » ou « Ta destruction »
  rationale: Le texte hébreu est comprimé et difficile. La lecture réflexive est ancienne et contextuellement plausible, mais le pronom réfléchi n’est pas explicite dans la forme massorétique. La traduction principale conserve donc la difficulté grammaticale plutôt que de la résoudre silencieusement.
- issue: Rapport entre Dieu, la destruction et le secours
  choice: « car c’est en moi que se trouve ton secours »
  alternative: « parce que tu es contre moi, contre ton secours »
  rationale: Le sens habituel de בִי et le nom עֵזֶר favorisent l’idée que le secours d’Israël se trouve en Dieu. Toutefois, la construction permet une lecture adversative attestée; elle est conservée dans la note afin de ne pas effacer la tension théologique.
translation_notes:
  register: Français moderne, international et digne. « Secours » conserve le substantif hébreu et convient au registre biblique courant. La tournure clivée « c’est en moi que » rend clairement l’accent porté sur Dieu sans supprimer l’ambiguïté globale, explicitée en note.
