base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
translation:
  language: fr
  text: Les douleurs d’une femme en travail l’atteignent. C’est un fils sans sagesse, car, le moment venu, il ne se présente pas à l’ouverture de la matrice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne se tient pas au mishbar des enfants ». Le mot rare mishbar semble désigner l’ouverture ou le passage de l’accouchement; le sens précis reste incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי יֹלֵדָה
  choice: les douleurs d’une femme en travail
  rationale: Dans ce contexte obstétrical, חֶבְלֵי désigne les douleurs de l’accouchement, et le participe יֹלֵדָה une femme en train d’enfanter. La formulation française est naturelle et conserve l’image.
- source_word: יָבֹאוּ לוֹ
  choice: l’atteignent
  rationale: Le tour indique que les douleurs viennent jusqu’à lui ou sur lui. « L’atteignent » rend ce mouvement sans accentuer indûment l’idée de châtiment.
- source_word: בֵן לֹא חָכָם
  choice: un fils sans sagesse
  rationale: Cette formulation garde la construction négative et l’image filiale de l’hébreu, sans donner à « insensé » une coloration morale plus forte.
- source_word: כִּי עֵת
  choice: car, le moment venu
  rationale: Le syntagme renvoie au moment critique de la naissance. « Le moment venu » est idiomatique tout en évitant d’ajouter explicitement l’idée d’un moment « approprié », absente du lexème lui-même.
- source_word: לֹא יַעֲמֹד
  choice: il ne se présente pas
  rationale: Le verbe signifie littéralement « se tenir », mais, dans la métaphore de l’accouchement, il évoque le fils qui ne vient pas se placer pour sortir. Le choix français exprime ce sens contextuel sans aplatir toute l’image.
- source_word: בְּמִשְׁבַּר בָּנִים
  choice: à l’ouverture par laquelle naissent les enfants
  rationale: L’expression rare désigne vraisemblablement le lieu ou le passage de la venue au monde. Cette traduction conserve l’image concrète tout en restant compréhensible; une note signale la littéralité et l’incertitude.
theological_decisions:
- issue: Référent de la métaphore de l’accouchement
  choice: Conserver les pronoms masculins et l’image du fils sans nommer explicitement Éphraïm ou Israël.
  alternative: 'Expliciter : « Éphraïm est un fils sans sagesse ».'
  rationale: Le contexte identifie le référent, mais ce verset ne le nomme pas. L’expliciter dans le texte résoudrait une référence que l’hébreu laisse implicite.
- issue: Portée de l’image finale
  choice: Présenter l’échec du fils à venir au monde sans expliquer dans le texte ce qu’il symbolise.
  alternative: Interpréter directement l’image comme le refus d’une occasion de délivrance ou de repentance.
  rationale: Le texte poétique maintient une tension entre douleur, naissance imminente et incapacité du fils à sortir. Une explication théologique dans le corps du verset dépasserait la traduction.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore obstétricale demeure concrète; la seule expression hébraïque particulièrement obscure est explicitée en note plutôt que tranchée silencieusement.
