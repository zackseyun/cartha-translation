  text: אֱהִ֤י מַלְכְּ/ךָ֙ אֵפ֔וֹא וְ/יוֹשִֽׁיעֲ/ךָ֖ בְּ/כָל עָרֶ֑י/ךָ וְ/שֹׁ֣פְטֶ֔י/ךָ אֲשֶׁ֣ר אָמַ֔רְתָּ תְּנָ/ה לִּ֖/י מֶ֥לֶךְ וְ/שָׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
translation:
  language: fr
  text: 'Où est donc ton roi[a], pour qu’il te sauve dans toutes tes villes, et tes juges, dont tu as dit : « Donne-moi un roi et des chefs[b] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « Je serais ton roi ; où donc est celui qui pourrait te sauver… ? » Le début du texte hébreu est difficile.'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « chefs » peut aussi désigner des « princes », des « responsables » ou des « dirigeants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי … אֵפוֹא
  choice: Où est donc
  rationale: Le début hébreu est difficile. Dans le contexte, la lecture interrogative forme une question ironique sur l’impuissance du roi. « Donc » rend la force de אֵפוֹא dans un français naturel, tandis qu’une autre analyse de אֱהִי est signalée en note.
- source_word: מַלְכְּךָ
  choice: ton roi
  rationale: Le nom singulier avec suffixe possessif est rendu directement et rappelle la demande d’Israël d’avoir un roi.
- source_word: וְיוֹשִׁיעֲךָ
  choice: pour qu’il te sauve
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. Après la question rhétorique, cette tournure française exprime naturellement le défi ironique.
- source_word: בְּכָל עָרֶיךָ
  choice: dans toutes tes villes
  rationale: La préposition est comprise dans son sens locatif, sans élargir inutilement l’expression.
- source_word: וְשֹׁפְטֶיךָ
  choice: tes juges
  rationale: « Juges » conserve le sens lexical premier, tout en permettant ici la fonction plus large de gouvernants.
- source_word: אֲשֶׁר אָמַרְתָּ
  choice: ceux dont tu as dit
  rationale: Cette formulation rattache naturellement la proposition relative aux autorités mentionnées et rend l’accompli hébreu par le passé composé.
- source_word: תְּנָה לִּי
  choice: Donne-moi
  rationale: L’impératif de נתן avec לִי est rendu directement, sans substituer l’idée plus interprétative de nomination.
- source_word: מֶלֶךְ וְשָׂרִים
  choice: un roi et des chefs
  rationale: שָׂרִים désigne des personnes investies d’autorité. « Chefs » est courant, digne et moins susceptible que « princes » d’évoquer exclusivement des fils de roi; les autres possibilités sont données en note.
theological_decisions:
- issue: Interprétation du difficile אֱהִי au début du verset
  choice: 'Question ironique : « Où est donc ton roi… ? »'
  alternative: « Je serais ton roi ; où donc est celui qui pourrait te sauver… ? »
  rationale: La lecture interrogative s’accorde avec le contexte où la monarchie humaine d’Israël est mise en cause. Comme la forme hébraïque reste difficile et peut être analysée comme un verbe à la première personne, l’autre lecture est conservée en note plutôt qu’écartée.
translation_notes:
  register: Français international moderne, clair et digne. La reprise de « où sont » répartit la longue interrogation en deux questions naturelles sans modifier sa portée. « Chefs » évite une association trop étroite avec la descendance royale, tout en conservant le registre politique.
