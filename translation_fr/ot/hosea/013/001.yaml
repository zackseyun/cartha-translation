    issue: Formulation de la prééminence d’Éphraïm
    rationale: « Il occupait une place élevée » explicite la notion de fonction ou de position durable. Le verbe hébreu נשא, dans cette construction elliptique, appelle plutôt une expression brève d’élévation ou de prominence, sans définir la nature de cette position.
  revised_text: Quand Éphraïm parlait, on tremblait ; il était haut placé en Israël.[a] Mais il s’est rendu coupable par Baal[b] et il est mort.
