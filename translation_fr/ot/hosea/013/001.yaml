source:
  edition: WLC
  text: כְּ/דַבֵּ֤ר אֶפְרַ֨יִם֙ רְתֵ֔ת נָשָׂ֥א ה֖וּא בְּ/יִשְׂרָאֵ֑ל וַ/יֶּאְשַׁ֥ם בַּ/בַּ֖עַל וַ/יָּמֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
translation:
  language: fr
  text: Quand Éphraïm parlait, on tremblait ; il était haut placé en Israël.[a] Mais il s’est rendu coupable par Baal[b] et il est mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé. On peut aussi comprendre : « il fut élevé en Israël » ou « il s’éleva en Israël ».'
    reason: alternative_reading
  - marker: b
    text: '« Par Baal » peut aussi se comprendre : « par le culte de Baal » ou « en s’attachant à Baal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר
  choice: Quand … parlait
  rationale: Le כ préfixé à l’infinitif construit a ici une valeur temporelle. L’imparfait français exprime naturellement la situation passée récurrente ou caractéristique sans préciser davantage l’aspect.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé. Dans Osée, il peut représenter le royaume du Nord, mais cette identification n’est pas explicitée dans le texte principal.
- source_word: רְתֵת
  choice: on tremblait
  rationale: Le substantif désigne le tremblement. Cette formulation française rend naturellement la réaction suscitée par la parole d’Éphraïm sans décider s’il s’agit de peur, de respect ou d’effroi politique.
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  choice: il occupait une place élevée en Israël
  rationale: La proposition hébraïque est très condensée et נָשָׂא peut évoquer le fait d’être élevé ou de s’élever. La formulation retenue exprime la prééminence d’Éphraïm sans trancher artificiellement entre une lecture passive et une lecture active-réfléchie.
- source_word: וַיֶּאְשַׁם
  choice: il s’est rendu coupable
  rationale: Le verbe אשם indique le fait de devenir coupable ou d’encourir une culpabilité. Cette expression conserve clairement sa portée morale.
- source_word: בַּבַּעַל
  choice: par Baal
  rationale: La préposition ב peut ici marquer le moyen ou l’association. « Par Baal » reste concise, conserve le nom de la divinité et n’ajoute pas explicitement le mot « culte », absent de l’hébreu.
- source_word: וַיָּמֹת
  choice: et il est mort
  rationale: La formulation rend directement la conséquence abrupte sans préciser si la mort est individuelle, collective, politique ou figurée.
theological_decisions:
- issue: Nature de l’élévation d’Éphraïm
  choice: Exprimer sa position élevée sans déterminer s’il a été élevé ou s’il s’est élevé lui-même.
  alternative: « Il fut élevé en Israël » ou « il s’éleva en Israël ».
  rationale: La syntaxe hébraïque est concise et permet plus d’une analyse. Une expression de position prééminente préserve cette ambiguïté réelle et le contraste avec la chute qui suit.
- issue: Portée de la mort d’Éphraïm
  choice: Conserver simplement « il est mort ».
  alternative: Comprendre une mort collective ou politique du royaume du Nord.
  rationale: Le contexte peut orienter vers une portée collective, mais le verset ne l’explicite pas. La traduction ne doit donc pas résoudre cette tension dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme oppose nettement l’ancienne prééminence d’Éphraïm à sa culpabilité et à sa mort. Les deux appels de note figurent dans le texte principal au point pertinent.
