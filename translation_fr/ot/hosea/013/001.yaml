revisions:
- from: Quand Éphraïm parlait, on tremblait ; il occupait une place élevée en Israël.[a] Mais il s’est rendu coupable par Baal[b] et il est mort.
  to: Quand Éphraïm parlait, on tremblait ; il était haut placé en Israël.[a] Mais il s’est rendu coupable par Baal[b] et il est mort.
  rationale: La révision remplace une paraphrase de statut par une expression française plus concise et plus proche de l’ellipse hébraïque. Elle maintient l’ambiguïté réelle quant à la manière dont Éphraïm fut ou devint élevé, explicitée par la note, et ne modifie ni le sens de la culpabilité associée à Baal ni la conséquence exprimée par la mort.
