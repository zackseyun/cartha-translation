language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/יַּ֤ד שְׁאוֹל֙ אֶפְדֵּ֔/ם מִ/מָּ֖וֶת אֶגְאָלֵ֑/ם אֱהִ֨י דְבָרֶי/ךָ֜ מָ֗וֶת אֱהִ֤י קָֽטָבְ/ךָ֙ שְׁא֔וֹל נֹ֖חַם יִסָּתֵ֥ר מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
translation:
  language: fr
  text: Je les rachèterai du pouvoir du séjour des morts[a], je les délivrerai de la mort. Mort, où sont tes fléaux ? Séjour des morts[b][c], où est ta destruction ? La compassion sera cachée à mes yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les rachèterais-je du pouvoir du séjour des morts ? Les délivrerais-je de la mort ? » Les deux premières propositions peuvent être comprises comme des questions rhétoriques annonçant non une délivrance, mais un refus de sauver.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu אֱהִי peut aussi être compris au sens de « je serai » ou « que je sois » : « Je serai tes fléaux, Mort ; je serai ta destruction, séjour des morts. »'
    reason: alternative_reading
  - marker: c
    text: 'Traduction traditionnelle influencée par la version grecque : « Mort, où est ton aiguillon ? Séjour des morts, où est ta victoire [ou : ton aiguillon] ? » Comparer 1 Corinthiens 15.55.'
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Littéralement « de la main de ». Dans cet idiome, la main représente le pouvoir ou l’emprise ; « du pouvoir de » exprime naturellement ce sens en français.
- source_word: שְׁאוֹל
  choice: séjour des morts
  rationale: שְׁאוֹל désigne le domaine des morts, et non simplement une tombe. « Séjour des morts » rend ce concept en français courant sans lui attribuer nécessairement le sens ultérieur d’enfer.
- source_word: אֶפְדֵּם
  choice: je les rachèterai
  rationale: Le verbe פדה évoque le rachat qui libère d’une emprise ou d’un danger. « Racheter » le distingue du verbe גאל du membre parallèle.
- source_word: אֶגְאָלֵם
  choice: je les délivrerai
  rationale: גאל exprime l’action de reprendre ou de délivrer, parfois avec des connotations de parenté. « Délivrer » évite une répétition artificielle tout en conservant le parallélisme.
- source_word: אֱהִי
  choice: où sont
  rationale: La forme est ambiguë. La lecture interrogative produit ici une apostrophe provocatrice à la Mort et au séjour des morts ; l’autre analyse, « je serai » ou « que je sois », est signalée en note.
- source_word: דְבָרֶיךָ
  choice: tes fléaux
  rationale: Dans ce contexte, le terme désigne vraisemblablement des pestes ou fléaux mortels plutôt que des « paroles ». « Fléaux » s’accorde au parallèle avec la destruction.
- source_word: קָטָבְךָ
  choice: ta destruction
  rationale: קֶטֶב évoque la destruction ou la dévastation mortelle. « Destruction » est une traduction directe, tandis que « aiguillon » dépend davantage de la tradition grecque.
- source_word: נֹחַם
  choice: la compassion
  rationale: Le nom peut exprimer le regret, le fait de revenir sur une décision ou la compassion. Ici, « compassion » communique clairement l’idée qu’aucune pitié n’interviendra.
- source_word: יִסָּתֵר מֵעֵינָי
  choice: se dérobera à mes yeux
  rationale: Cette formulation française conserve l’image hébraïque de quelque chose qui est caché au regard, avec la valeur prospective de l’imparfait hébreu.
theological_decisions:
- issue: Les premiers membres sont-ils une promesse de délivrance ou des questions rhétoriques annonçant un refus de sauver ?
  choice: Des déclarations de délivrance, suivies d’une apostrophe triomphante à la Mort et au séjour des morts.
  alternative: « Les rachèterais-je du pouvoir du séjour des morts ? Les délivrerais-je de la mort ? », questions rhétoriques qui impliqueraient un refus.
  rationale: Les formes verbales peuvent naturellement être lues comme des déclarations à la première personne, et l’apostrophe suivante peut former un défi lancé à la Mort. Toutefois, le contexte immédiat de jugement permet aussi une lecture interrogative ; la note conserve donc cette tension réelle.
- issue: Valeur de אֱהִי dans les deux apostrophes
  choice: 'Valeur interrogative : « où sont… ? »'
  alternative: 'Valeur verbale ou volitive : « je serai » ou « que je sois » les fléaux et la destruction.'
  rationale: La lecture interrogative convient à une apostrophe de victoire et correspond à la réception ancienne reflétée en 1 Corinthiens 15.55. La morphologie hébraïque permet cependant l’autre lecture, qui est maintenue en note.
translation_notes:
  register: Français moderne, international et digne. « Séjour des morts » est retenu plutôt que la translittération « Shéol », afin de rester immédiatement compréhensible sans réduire le terme à la tombe. Le tutoiement convient à l’apostrophe poétique adressée à la Mort et au séjour des morts.
