  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
translation:
  language: fr
  text: Ils prononcent de vaines paroles, prêtent de faux serments et concluent des alliances[a] ; aussi le jugement[b] pousse-t-il comme une plante vénéneuse[c] sur les sillons des champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupent une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la justice », avec une nuance d’ironie amère.'
    reason: alternative_reading
  - marker: c
    text: Le mot hébreu désigne une plante amère ou toxique dont l’identification exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  choice: Ils prononcent de vaines paroles
  rationale: La construction avec le verbe et son nom apparenté souligne une parole creuse. Le présent rend naturellement l'accusation prophétique portant sur une conduite caractéristique.
- source_word: אָלוֹת שָׁוְא
  choice: prêtent de faux serments
  rationale: אָלָה désigne ici un serment, avec une possible implication de malédiction, et שָׁוְא en marque la fausseté ou la vanité. « Faux serments » exprime clairement l'accusation dans un français actuel.
- source_word: כָּרֹת בְּרִית
  choice: concluent des alliances
  rationale: Littéralement « couper une alliance », expression idiomatique hébraïque. « Conclure une alliance » est l'équivalent français naturel et laisse ouverte la nature politique ou religieuse de ces engagements.
- source_word: וּפָרַח
  choice: pousse
  rationale: Le verbe évoque le fait de germer, pousser ou fleurir. « Pousse » convient à l'image d'une végétation nuisible sans introduire une connotation favorable.
- source_word: כָּרֹאשׁ
  choice: comme une plante vénéneuse
  rationale: רֹאשׁ désigne ici une plante amère ou toxique, sans identification botanique certaine. La formulation conserve l'image et son caractère nocif sans préciser indûment l'espèce.
- source_word: מִשְׁפָּט
  choice: le jugement
  rationale: Le terme peut signifier jugement, droit ou justice. Dans cette dénonciation, « jugement » conserve la portée judiciaire tout en s'accordant avec l'image d'une croissance nocive.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: dans les sillons des champs
  rationale: תֶּלֶם désigne le sillon ou la levée produite par le labour. « Dans les sillons des champs » restitue naturellement l'image agricole.
theological_decisions:
- issue: Valeur de מִשְׁפָּט dans le contexte de dénonciation
  choice: le jugement
  alternative: la justice
  rationale: Le mot peut désigner la justice, mais l'image de la plante toxique suggère ici un ordre judiciaire corrompu ou ses effets nocifs. « Jugement » préserve cette tension ; une note signale la lecture ironique possible avec « justice ».
translation_notes:
  register: Français international moderne, sobre et prophétique. La coordination rend la série d'accusations de manière fluide ; l'inversion « aussi… pousse-t-il » marque clairement la conséquence. Les notes préservent l'idiome hébraïque, l'ambiguïté de מִשְׁפָּט et l'incertitude botanique.
