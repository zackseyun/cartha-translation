source:
  edition: WLC
  text: מִ/ימֵי֙ הַ/גִּבְעָ֔ה חָטָ֖אתָ יִשְׂרָאֵ֑ל שָׁ֣ם עָמָ֔דוּ לֹֽא תַשִּׂיגֵ֧/ם בַּ/גִּבְעָ֛ה מִלְחָמָ֖ה עַל בְּנֵ֥י עַֽלְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
translation:
  language: fr
  text: Depuis les jours de Guibéa[a], tu as péché, Israël ; ils y sont restés. La guerre contre les fils de perversité ne les atteindra-t-elle pas à Guibéa[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Guibéa rappelle le crime et la guerre civile racontés en Juges 19–21. Osée présente cet épisode comme le modèle d’une corruption profondément enracinée en Israël.
    reason: cross_reference
  - marker: b
    text: 'Autres traductions possibles : « La guerre menée à Guibéa contre les fils de perversité ne les a pas atteints » ou « ne les atteindra pas ». L’hébreu de cette proposition est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִימֵי הַגִּבְעָה
  choice: Depuis les jours de Guibéa
  rationale: La préposition מִן marque ici le point de départ temporel. « Depuis les jours de » conserve le lien entre la faute ancienne de Guibéa et sa persistance jusqu’au temps du prophète.
- source_word: חָטָאתָ
  choice: tu as péché
  rationale: Le parfait qal à la deuxième personne du masculin singulier s’adresse directement à Israël comme à une entité collective ; le passé composé exprime naturellement en français un acte passé dont la portée demeure.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom a une valeur vocative. En français moderne, la simple apposition après la virgule est plus naturelle que « ô Israël » tout en conservant l’adresse prophétique.
- source_word: שָׁם עָמָדוּ
  choice: ils y sont restés
  rationale: שָׁם est rendu par « y », tandis que עמד garde ici l’idée de demeurer ou de persister dans une position. Le passage du singulier « tu » au pluriel « ils » est conservé comme dans l’hébreu, qui traite Israël à la fois collectivement et comme une pluralité.
- source_word: לֹא תַשִּׂיגֵם
  choice: ne les atteindra-t-elle pas ?
  rationale: Le hiphil de נשׂג signifie atteindre ou rattraper. La négation est comprise comme introduisant une question rhétorique qui attend une réponse affirmative, sans masquer les autres analyses possibles de cette proposition difficile.
- source_word: מִלְחָמָה
  choice: la guerre
  rationale: Le terme peut désigner la guerre ou le combat. « La guerre » convient à l’allusion au conflit de Juges 19–21 et fonctionne comme sujet de « atteindre ».
- source_word: בַּגִּבְעָה
  choice: à Guibéa
  rationale: La préposition בְּ est prise dans son sens locatif devant le nom de lieu.
- source_word: בְּנֵי עַלְוָה
  choice: les fils de perversité
  rationale: La traduction conserve l’expression sémitique « fils de », qui désigne des personnes caractérisées par la qualité nommée. « Perversité » rend la déviation morale exprimée par עַלְוָה sans la limiter à la seule injustice sociale.
theological_decisions:
- issue: Sens de la proposition difficile לֹא תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל בְּנֵי עַלְוָה
  choice: Question rhétorique annonçant que la guerre atteindra les coupables à Guibéa.
  alternative: Déclaration selon laquelle la guerre ne les a pas atteints, ou ne les atteindra pas, à Guibéa.
  rationale: La question rhétorique s’accorde bien avec l’annonce prophétique du jugement et avec le sens usuel de נשׂג, mais la syntaxe hébraïque reste assez difficile pour que les autres lectures soient signalées plutôt qu’écartées.
- issue: Rapport entre le péché d’Israël et Guibéa
  choice: Conserver l’allusion historique sans expliciter dans le corps du verset la nature exacte de la faute.
  alternative: Paraphraser Guibéa comme symbole explicite de corruption ou identifier directement l’épisode de Juges 19–21 dans le texte.
  rationale: Le texte évoque Guibéa de manière dense. La note fournit le repère historique nécessaire sans imposer dans la traduction une interprétation plus développée que l’hébreu.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le tutoiement singulier adressé à Israël et le passage au pluriel sont maintenus. « Fils de perversité » conserve l’image hébraïque et la dignité du registre, tandis que les notes rendent visibles l’allusion historique et l’ambiguïté syntaxique.
