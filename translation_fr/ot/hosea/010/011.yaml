  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
translation:
  language: fr
  text: Éphraïm était une génisse bien dressée, qui aimait fouler le grain[a], mais moi, j’ai épargné son beau cou[b]. Je mettrai Éphraïm sous le joug[c] ; Juda labourera, Jacob hersera pour lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fouler ». Il s’agit de séparer les grains des épis en les faisant piétiner par un animal.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « je suis passé sur son beau cou ». L’hébreu de cette proposition est difficile ; le texte principal comprend qu’Éphraïm avait jusque-là été préservé d’un fardeau plus lourd.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « J’attellerai Éphraïm ». Littéralement, le verbe signifie « je ferai monter Éphraïm » ; dans ce contexte agricole, il semble désigner la mise sous harnais ou sous joug.'
    reason: lexical_alternative
  - marker: d
    text: « Herser » signifie briser les mottes et égaliser le sol après le labour. Le pronom « lui » renvoie probablement à Juda, mais l’hébreu ne l’explicite pas.
    reason: cultural_and_ambiguity_note
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  choice: une génisse bien dressée
  rationale: L’expression décrit une jeune vache habituée au travail. « Bien dressée » est naturel en français et conserve l’image agricole.
- source_word: אֹהַבְתִּי לָדוּשׁ
  choice: qui aimait fouler le grain
  rationale: Le texte exprime un goût habituel pour le dépiquage, travail relativement agréable puisque l’animal pouvait manger en travaillant. « Fouler le grain » rend l’activité plus clairement que le terme technique « dépiquer ».
- source_word: וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: mais moi, j’ai épargné son beau cou
  rationale: L’hébreu est difficile. Dans le contexte, cette formulation exprime vraisemblablement que Dieu avait jusque-là préservé Éphraïm d’un travail plus pénible, tout en gardant la description positive de son cou.
- source_word: אַרְכִּיב אֶפְרַיִם
  choice: Je mettrai Éphraïm sous le joug
  rationale: Le hiphil de רכב signifie littéralement « faire monter/chevaucher », mais le contexte agricole suggère la mise sous harnais ou sous joug. Cette traduction explicite l’image sans en changer la portée.
- source_word: יַחֲרֹשׁ
  choice: labourera
  rationale: Sens agricole courant du verbe, dans une annonce de travail imposé.
- source_word: יְשַׂדֶּד
  choice: hersera
  rationale: Le verbe désigne le travail secondaire qui brise les mottes et égalise le sol après le labour. « Herser » est le terme français précis.
- source_word: לּוֹ יַעֲקֹב
  choice: Jacob hersera pour lui
  rationale: Le suffixe pronominal masculin est conservé sans décider explicitement si son référent est Juda ou un autre antécédent implicite.
theological_decisions:
- issue: Image métaphorique d’Éphraïm, de Juda et de Jacob soumis aux travaux agricoles
  choice: Le verset présente Dieu faisant passer Éphraïm d’un travail apprécié à un labeur plus lourd, tandis que Juda et Jacob reçoivent aussi des tâches agricoles.
  alternative: On peut comprendre l’ensemble plus simplement comme une répartition de travaux agricoles, sans insister sur leur caractère punitif.
  rationale: Le contexte d’Osée 10 est celui du jugement et de l’appel au retour. La traduction garde donc la force disciplinaire de l’image sans lui imposer une élaboration doctrinale étrangère.
- issue: Sens de וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: J’ai épargné son beau cou.
  alternative: Je suis passé sur son beau cou.
  rationale: La construction hébraïque demeure incertaine. Le texte principal donne le sens contextuel probable, tandis que la note conserve une traduction plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Les termes agricoles précis sont maintenus, avec des notes pour « fouler » et « herser ». La difficulté du milieu du verset et l’ambiguïté du pronom final sont explicitement préservées.
