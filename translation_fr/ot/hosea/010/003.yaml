  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
translation:
  language: fr
  text: 'Car maintenant ils diront : « Nous n’avons pas de roi, car nous n’avons pas craint Yahweh[a]. Et le roi, que pourrait-il faire pour nous[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car nous ne craignons pas Yahweh ». Le parfait hébreu peut évoquer soit leur faute passée, soit leur état persistant.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que fera-t-il pour nous ? » La forme hébraïque est future; la traduction principale rend la portée rhétorique de la question.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: Car maintenant
  rationale: La conjonction introduit l’explication de la situation annoncée, tandis que l’adverbe marque le moment présent ou imminent.
- source_word: יֹאמְרוּ
  choice: ils diront
  rationale: L’imparfait hébreu est compris ici comme prédictif dans le discours prophétique.
- source_word: אֵין מֶלֶךְ לָנוּ
  choice: Nous n’avons pas de roi
  rationale: Cette tournure française naturelle conserve la valeur existentielle de אֵין et le complément לָנוּ.
- source_word: כִּי לֹא יָרֵאנוּ אֶת יְהוָה
  choice: car nous n’avons pas craint Yahweh
  rationale: Le parfait peut désigner une faute passée dont les effets demeurent. « Craindre » préserve les dimensions de crainte, de révérence et de soumission liées au verbe ירא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְהַמֶּלֶךְ
  choice: Et le roi
  rationale: La coordination et le détachement syntaxique rendent le brusque passage à une question sur l’utilité du roi.
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  choice: que pourrait-il faire pour nous ?
  rationale: Le conditionnel français exprime naturellement la portée rhétorique de la question, qui met en doute la capacité pratique du roi, tout en laissant en note la valeur formellement future de l’imparfait hébreu.
theological_decisions:
- issue: Sens de « craindre Yahweh »
  choice: Conserver « craindre Yahweh » dans le texte principal
  alternative: révérer Yahweh
  rationale: Le verbe hébreu peut inclure la révérence et l’obéissance, mais « craindre » conserve mieux la force de l’accusation et sa tension théologique.
- issue: Valeur temporelle de יָרֵאנוּ
  choice: nous n’avons pas craint
  alternative: nous ne craignons pas
  rationale: Le parfait permet de présenter leur absence de crainte comme une faute accomplie; la note préserve la lecture possible d’un état persistant.
- issue: Portée de la question sur le roi
  choice: que pourrait-il faire pour nous ?
  alternative: que fera-t-il pour nous ?
  rationale: Le texte principal rend l’idée rhétorique d’impuissance sans effacer la valeur future formelle, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation détache « le roi » afin de reproduire le brusque mouvement rhétorique de l’hébreu. Les deux appels de note figurent dans le texte principal.
