  - severity: low
    issue: « au jour du combat » est moins idiomatique que « le jour du combat ».
    rationale: Les deux formulations sont compréhensibles, mais « le jour du combat » est la tournure moderne internationale la plus naturelle tout en conservant la détermination temporelle de בְּיוֹם מִלְחָמָה.
