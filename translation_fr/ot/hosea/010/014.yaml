base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
translation:
  language: fr
  text: Le tumulte s’élèvera parmi ton peuple, et toutes tes forteresses seront dévastées, comme Shalman[a] dévasta Beth-Arbel le jour du combat ; la mère fut mise en pièces sur des enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shalman désigne peut-être un roi nommé Salmanasar, mais son identification historique exacte reste incertaine.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une mère fut mise en pièces sur des enfants ». L’expression hébraïque est concise et saisissante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם שָׁאוֹן
  choice: Le tumulte s’élèvera
  rationale: Dans ce discours prophétique, la forme verbale annonce un événement futur. « S’élèvera » restitue l’idée d’un fracas qui surgit, tandis que « tumulte » convient à l’agitation bruyante d’un assaut.
- source_word: בְּעַמֶּךָ
  choice: parmi ton peuple
  rationale: La préposition désigne ici le milieu dans lequel éclatera le tumulte ; « parmi » est idiomatique en français.
- source_word: וְכָל מִבְצָרֶיךָ יוּשַּׁד
  choice: et toutes tes forteresses seront dévastées
  rationale: « Forteresses » garde le sens militaire des places défendues. Le passif « seront dévastées » exprime à la fois la destruction violente et le pillage impliqués par שׁדד.
- source_word: כְּשֹׁד שַׁלְמַן
  choice: comme Shalman dévasta
  rationale: La comparaison nominale hébraïque est rendue verbalement pour un français naturel, sans préciser l’identité historique incertaine de Shalman.
- source_word: בֵּית אַרְבֵאל
  choice: Beth-Arbel
  rationale: Le nom de lieu est translittéré ; le trait d’union rend lisible sa forme composée.
- source_word: בְּיוֹם מִלְחָמָה
  choice: au jour du combat
  rationale: Cette formulation conserve la structure solennelle de l’hébreu et renvoie à une bataille déterminée.
- source_word: אֵם עַל בָּנִים רֻטָּשָׁה
  choice: la mère fut écrasée avec ses enfants
  rationale: Le singulier générique « la mère » respecte la morphologie hébraïque. « Avec ses enfants » rend naturellement la relation exprimée par עַל sans imposer une mécanique précise à cette scène atroce ; « fut écrasée » traduit la mise à mort brutale évoquée par רטש.
theological_decisions:
- issue: Identification de שַׁלְמַן
  choice: Conserver le nom « Shalman ».
  alternative: L’identifier à Salmanasar III ou à Salmanasar V.
  rationale: Le texte hébreu fournit la forme Shalman, mais son identification historique demeure incertaine. La traduction ne tranche donc pas au-delà du texte.
- issue: Sens exact de la dernière proposition
  choice: « la mère fut écrasée avec ses enfants »
  alternative: « une mère fut écrasée sur ses enfants » ou une formulation au pluriel collectif.
  rationale: L’hébreu est singulier, concis et graphique. La traduction maintient le singulier générique et la violence de la scène, tout en signalant l’expression plus littérale en note au lieu d’en préciser indûment les circonstances.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier suit l’adresse hébraïque à Israël. La ponctuation conserve l’enchaînement abrupt de la proposition finale, et les notes préservent les incertitudes historique et lexicale.
