revisions:
- from: Le tumulte s’élèvera parmi ton peuple, et toutes tes forteresses seront dévastées, comme Shalman dévasta Beth-Arbel au jour du combat[a] ; la mère fut écrasée avec ses enfants[b].
  to: Le tumulte s’élèvera parmi ton peuple, et toutes tes forteresses seront dévastées, comme Shalman[a] dévasta Beth-Arbel le jour du combat ; la mère fut mise en pièces sur des enfants[b].
  rationale: La révision renforce la fidélité au verbe hébreu רטש par « fut mise en pièces » et conserve la préposition « sur », dont le sens précis dans cette formule atroce reste discuté. Le singulier générique « la mère » est maintenu. Le déplacement de l’ancre a après « Shalman » l’attache directement au nom qu’elle éclaire ; l’ancre b demeure placée à la fin de la proposition concernée. Aucune identification historique ni interprétation supplémentaire n’est imposée.
