source:
  edition: WLC
  text: גֶּ֤פֶן בּוֹקֵק֙ יִשְׂרָאֵ֔ל פְּרִ֖י יְשַׁוֶּה לּ֑/וֹ כְּ/רֹ֣ב לְ/פִרְי֗/וֹ הִרְבָּה֙ לַֽ/מִּזְבְּח֔וֹת כְּ/ט֣וֹב לְ/אַרְצ֔/וֹ הֵיטִ֖יבוּ מַצֵּבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
translation:
  language: fr
  text: Israël est une vigne luxuriante[a], qui porte du fruit pour lui-même[b]. Plus son fruit abondait, plus il multipliait les autels ; plus son pays prospérait, plus ils embellissaient les pierres dressées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une vigne qui se vide » ou « une vigne qui s’étend ». Le mot hébreu est difficile ; le texte retient le sens qui correspond le mieux au fruit abondant et au pays prospère mentionnés ensuite.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui porte son fruit ». L’hébreu peut exprimer ici une nuance réflexive ou intéressée.'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de monuments de pierre dressés à des fins cultuelles, ici dans le cadre d’un culte condamné.
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  choice: une vigne luxuriante
  rationale: Dans ce contexte de fruit abondant et de pays prospère, בּוֹקֵק décrit probablement une vigne vigoureuse et étendue. Une note conserve les autres analyses possibles de ce terme difficile.
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  choice: qui produit du fruit pour elle-même
  rationale: « Produit du fruit » rend naturellement le verbe difficile יְשַׁוֶּה dans l’image de la vigne ; « pour elle-même » maintient la valeur possible de לּוֹ, sans masquer son ambiguïté.
- source_word: כְּרֹב לְפִרְיוֹ
  choice: Plus son fruit abondait
  rationale: La tournure comparative « plus… plus… » exprime clairement le rapport proportionnel du texte hébreu.
- source_word: הִרְבָּה לַמִּזְבְּחוֹת
  choice: plus il multipliait les autels
  rationale: Le hiphil de רבה indique qu’Israël augmentait le nombre des autels ; le singulier renvoie collectivement à Israël.
- source_word: כְּטוֹב לְאַרְצוֹ
  choice: plus son pays prospérait
  rationale: טוב désigne ici la bonne condition matérielle et agricole du territoire, non sa bonté morale.
- source_word: הֵיטִיבוּ מַצֵּבוֹת
  choice: plus ils embellissaient les pierres dressées
  rationale: Le pluriel verbal fait passer naturellement d’Israël collectif à ses habitants. « Embellissaient » exprime l’amélioration ou l’ornementation des objets cultuels, tandis que « pierres dressées » conserve leur forme concrète.
theological_decisions:
- issue: Lien entre prospérité et idolâtrie
  choice: Le verset présente Israël comme fertile et prospère, mais employant cette prospérité à multiplier les autels et à embellir les pierres cultuelles.
  alternative: 'L’ouverture peut être comprise négativement : « Israël est une vigne qui se vide » ou « une vigne vide ».'
  rationale: 'Les mentions de l’abondance du fruit et de la prospérité du pays favorisent une lecture ironique : l’abondance nourrit le culte condamné. La note préserve néanmoins l’incertitude lexicale.'
- issue: Valeur de לּוֹ après יְשַׁוֶּה
  choice: « pour elle-même »
  alternative: « produit son fruit », sans nuance réflexive ou intéressée explicite
  rationale: La traduction retient la valeur réflexive ou bénéficiaire possible du pronom hébreu, tout en signalant en note une formulation plus neutre.
translation_notes:
  register: Français international moderne, naturel et digne. L’alternance « elle-même / il / ils » respecte l’image féminine de la vigne, puis Israël comme peuple collectif et enfin ses habitants. Les constructions parallèles « plus… plus… » rendent le mouvement rhétorique de l’hébreu.
