  source_fidelity: 'Le sens principal est bien rendu, notamment « tremblent », « veaux » et l’étonnant « exultent », conforme au texte massorétique. Toutefois, « cette idole » et « celle-ci l’a quittée » assignent trop nettement les référents des suffixes, alors que l’hébreu maintient une référence singulière ambiguë après « veaux ». La note b donne en outre un littéral fautif : מִמֶּנּוּ est « loin de lui » (masculin), non « loin d’elle ».'
  naturalness: La révision conserve un français moderne et lisible tout en évitant une clarification interprétative excessive. « Mène le deuil » est idiomatique dans un registre biblique moderne ; « s’en est allée loin de lui » reflète naturellement le départ de la gloire sans fixer son antécédent.
  terminology: « Prêtres idolâtres » rend de façon recevable les כְּמָרִים, terme spécialisé pour des desservants d’un culte que le prophète réprouve. « Beth-Aven » et « Béthel » sont conservés avec une note explicative. Aucun terme théologique n’est imposé au-delà de la qualification inhérente au contexte lexical.
  issues:
