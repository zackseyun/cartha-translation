base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: fr
  text: Les habitants de Samarie tremblent pour les veaux de Beth-Aven[a] ; car son peuple mène le deuil à son sujet, et ses prêtres idolâtres exultent à son sujet, à cause de sa gloire, car elle s’en est allée loin de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Aven signifie « maison du mal » ou « maison de l’iniquité » ; c’est un nom péjoratif donné à Béthel.
    reason: Le jeu polémique sur le nom du sanctuaire est significatif mais ne peut être reproduit directement dans le corps du texte.
  - marker: b
    text: 'Littéralement : « car elle est partie loin de lui ». Après « veaux », l’hébreu emploie des pronoms au singulier ; leurs référents exacts sont discutés. La « gloire » paraît désigner celle de l’objet cultuel.'
    reason: La construction hébraïque est concise, passe du pluriel au singulier et ne permet pas d’identifier tous les référents avec certitude.
lexical_decisions:
- source_word: יָגּוּרוּ
  choice: tremblent
  rationale: Le verbe exprime ici la crainte ou l’effroi éprouvé au sujet des veaux menacés.
- source_word: עֶגְלוֹת
  choice: veaux
  rationale: Le pluriel féminin hébreu désigne les représentations cultuelles en forme de jeunes bovins; « veaux » est l’expression française traditionnelle et naturelle dans ce contexte.
- source_word: כְמָרָיו
  choice: ses prêtres idolâtres
  rationale: כמרים désigne des prêtres attachés à un culte condamné par le prophète; cette précision distingue leur fonction de celle des prêtres légitimes.
- source_word: יָגִילוּ
  choice: exultent
  rationale: Le texte massorétique porte le verbe « exulter, se réjouir ». Ce sens difficile est conservé plutôt que remplacé par « se lamenter », malgré le deuil mentionné dans la proposition précédente.
- source_word: גָלָה
  choice: a quittée
  rationale: Le verbe signifie partir, être emmené ou aller en exil. Ici, appliqué à la gloire de l’idole, « l’a quittée » rend clairement son départ sans imposer un mécanisme précis.
theological_decisions:
- issue: Contraste entre le deuil du peuple et l’exultation des prêtres
  choice: Conserver « exultent » selon le texte massorétique
  alternative: « se lamentent » ou « tremblent » d’après une correction conjecturale
  rationale: La formulation hébraïque reçue crée une tension réelle. La traduction ne la résout pas silencieusement par une conjecture.
- issue: Référents des pronoms singuliers après le pluriel « veaux »
  choice: Employer « cette idole », puis rapporter « sa gloire » à celle-ci
  alternative: Maintenir partout des pronoms pluriels ou traduire « le veau » au singulier
  rationale: L’hébreu passe du pluriel עגלות à des suffixes singuliers. « Cette idole » rend ce glissement collectif sans supprimer le pluriel initial.
translation_notes:
  register: Français moderne, international et digne. La phrase garde le contraste abrupt du texte hébreu entre le deuil du peuple et l’exultation des prêtres, tout en clarifiant avec retenue le passage du pluriel « veaux » aux pronoms singuliers.
