  to: Les habitants de Samarie tremblent pour les veaux de Beth-Aven[a] ; car son peuple mène le deuil à son sujet, et ses prêtres idolâtres exultent à son sujet, à cause de sa gloire, car elle s’en est allée loin de lui[b].
