id: HOS.10.13
reference: Hosea 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲרַשְׁתֶּם רֶ֛שַׁע עַוְלָ֥תָ/ה קְצַרְתֶּ֖ם אֲכַלְתֶּ֣ם פְּרִי כָ֑חַשׁ כִּֽי בָטַ֥חְתָּ בְ/דַרְכְּ/ךָ֖ בְּ/רֹ֥ב גִּבּוֹרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
translation:
  language: fr
  text: Vous avez labouré la méchanceté, vous avez moissonné l’injustice, vous avez mangé le fruit de la tromperie[a], parce que tu as mis ta confiance dans ta propre voie, dans la multitude de tes guerriers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du mensonge » ou « de la fausseté ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe ici du pluriel (« vous avez labouré… moissonné… mangé ») au singulier (« tu as mis ta confiance… ta voie… tes guerriers »), probablement parce qu’Israël est alors considéré comme une seule entité.
    reason: cultural_note
lexical_decisions:
- source_word: חֲרַשְׁתֶּם
  choice: vous avez labouré
  rationale: Conserve l’image agricole littérale et ouvre la progression labourer–moissonner–manger.
- source_word: רֶשַׁע
  choice: la méchanceté
  rationale: Exprime nettement le mal moral cultivé métaphoriquement, sans le réduire à une faute particulière.
- source_word: עַוְלָתָה
  choice: l’injustice
  rationale: Rend la dimension morale et sociale du terme tout en le distinguant de רֶשַׁע.
- source_word: קְצַרְתֶּם
  choice: vous avez moissonné
  rationale: Préserve le vocabulaire agricole et s’accorde naturellement avec « labouré ».
- source_word: אֲכַלְתֶּם
  choice: vous avez mangé
  rationale: Maintient la dernière étape concrète de la métaphore agricole.
- source_word: פְּרִי כָחַשׁ
  choice: le fruit de la tromperie
  rationale: « Fruit de » reproduit la relation construite; « tromperie » exprime ici la fausseté active aussi bien que son résultat.
- source_word: כִּי
  choice: parce que
  rationale: Introduit naturellement la raison de l’accusation précédente.
- source_word: בָטַחְתָּ
  choice: tu as mis ta confiance
  rationale: Rend le sens de confiance ou d’appui et permet au français de signaler le passage au singulier.
- source_word: בְדַרְכְּךָ
  choice: dans ta propre voie
  rationale: « Voie » conserve la métaphore hébraïque; « propre » explicite en français la valeur du possessif sans définir davantage s’il s’agit de conduite, de politique ou de stratégie.
- source_word: בְּרֹב גִּבּוֹרֶיךָ
  choice: dans la multitude de tes guerriers
  rationale: Exprime l’objet de la confiance et donne à גִּבּוֹרִים son sens militaire probable dans ce contexte.
theological_decisions:
- issue: Passage de la deuxième personne du pluriel à la deuxième personne du masculin singulier
  choice: Marquer le changement par « vous avez… » puis « tu as… ta… tes… »
  alternative: Uniformiser toute l’adresse au pluriel ou au singulier
  rationale: Le français distingue le nombre, contrairement à l’anglais moderne. Garder le changement reflète donc la forme du texte hébreu et laisse visible l’adresse à Israël, successivement comme collectivité plurielle puis comme entité nationale singulière.
- issue: Sens de בְדַרְכְּךָ
  choice: ta propre voie
  alternative: ta puissance, ta politique ou ta conduite
  rationale: Le terme « voie » préserve l’image et son ouverture sémantique sans préciser indûment la nature exacte de l’assurance d’Israël.
translation_notes:
  register: Français international moderne, digne et direct. La métaphore agricole est conservée intégralement. Le passage du pluriel au singulier est rendu dans le corps du texte et expliqué en note; les marqueurs [a] et [b] figurent tous deux dans le texte.
