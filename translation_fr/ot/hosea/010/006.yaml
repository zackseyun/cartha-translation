  text: גַּם אוֹת/וֹ֙ לְ/אַשּׁ֣וּר יוּבָ֔ל מִנְחָ֖ה לְ/מֶ֣לֶךְ יָרֵ֑ב בָּשְׁנָה֙ אֶפְרַ֣יִם יִקָּ֔ח וְ/יֵב֥וֹשׁ יִשְׂרָאֵ֖ל מֵ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
translation:
  language: fr
  text: Lui aussi sera transporté en Assyrie, en tribut au roi Yareb[a]. Éphraïm connaîtra la honte, et Israël aura honte de son conseil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « roi Yareb ». Cette expression peut aussi être comprise comme un titre, par exemple « le roi vengeur » ou « le roi combattant ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « à cause de son conseil » ou « de son projet ». Le suffixe hébreu peut renvoyer au collectif Israël/Éphraïm ou, possiblement, à un autre référent contextuel ; son référent exact demeure ambigu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אוֹתוֹ
  choice: Lui aussi
  rationale: 'La tournure placée en tête met l’accent sur le veau-idole mentionné dans le contexte : non seulement ses adorateurs, mais le veau lui aussi subira l’exil. Le masculin français convient au référent « veau ».'
- source_word: לְאַשּׁוּר יוּבָל
  choice: sera transporté en Assyrie
  rationale: Le hofal de יבל exprime l’action passive d’emporter ou de transporter. Avec une idole comme référent, « transporté » est naturel, et la préposition indique ici la destination.
- source_word: מִנְחָה
  choice: comme tribut
  rationale: Dans ce contexte politique lié à l’Assyrie et à son roi, le mot désigne vraisemblablement un présent imposé à un souverain, donc un tribut, plutôt qu’une offrande cultuelle.
- source_word: לְמֶלֶךְ יָרֵב
  choice: pour le roi Yareb
  rationale: Yareb est conservé comme désignation royale translittérée afin de ne pas trancher dans le texte principal entre un nom et une épithète. « Pour » exprime le destinataire du tribut.
- source_word: בָּשְׁנָה יִקָּח
  choice: recevra la honte
  rationale: La traduction garde l’image hébraïque selon laquelle Éphraïm « prend » ou « reçoit » la honte, tout en employant un verbe compréhensible en français actuel.
- source_word: וְיֵבוֹשׁ
  choice: aura honte
  rationale: Le qal de בוש peut exprimer le fait d’éprouver la honte ou d’être couvert de honte. « Aura honte » préserve ici le sens verbal direct sans préciser une cause extérieure.
- source_word: מֵעֲצָתוֹ
  choice: de son propre projet
  rationale: La préposition מן avec בוש introduit naturellement ce dont Israël aura honte. « Projet » rend ici une décision ou politique délibérée; « propre » clarifie la reprise du sujet collectif Israël sans attribuer le projet à un autre personnage.
theological_decisions:
- issue: Sens et statut de יָרֵב
  choice: Conserver « roi Yareb » dans le texte principal.
  alternative: Traduire par « roi vengeur » ou « roi querelleur/combattant » comme épithète du roi assyrien.
  rationale: La forme hébraïque permet aussi bien une désignation proche d’un nom propre qu’une épithète descriptive. La translittération maintient cette ambiguïté sans imposer une identification ou une interprétation incertaine.
- issue: Référent de עֲצָתוֹ
  choice: Comprendre le suffixe comme renvoyant collectivement à Israël et traduire « son propre projet ».
  alternative: Le rattacher au veau-idole ou rendre plus littéralement « son conseil », sans expliciter le référent.
  rationale: Dans la proposition, Israël est le sujet de « aura honte », et מן avec בוש désigne couramment la cause de cette honte. La lecture d’une politique conçue par Israël convient au contexte, mais la note conserve l’ambiguïté du suffixe.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « projet » rend עֵצָה plus naturellement que « conseil » dans ce contexte politique. Les deux phrases françaises évitent un point-virgule lourd tout en conservant la progression du jugement.
