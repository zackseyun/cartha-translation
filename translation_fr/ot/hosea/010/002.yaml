source:
  edition: WLC
  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
translation:
  language: fr
  text: Leur cœur est partagé[a] ; maintenant, ils porteront leur faute[b]. Lui-même démolira leurs autels et détruira leurs pierres sacrées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Leur cœur est trompeur ». Le verbe hébreu peut évoquer ce qui est lisse ou trompeur, ou ce qui est partagé. Ici, « partagé » souligne leur loyauté divisée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils seront reconnus coupables » ou « ils subiront les conséquences de leur faute ».'
    reason: lexical_alternative
  - marker: c
    text: Les « pierres sacrées » étaient des pierres dressées employées dans le culte.
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק
  choice: est partagé
  rationale: Avec « cœur » pour sujet, le verbe peut évoquer un cœur partagé, mais aussi l’idée d’être lisse ou trompeur. « Est partagé » convient au contexte de loyauté religieuse divisée, tout en signalant l’autre possibilité en note.
- source_word: לִבָּם
  choice: leur cœur
  rationale: Le singulier collectif de l’hébreu est conservé. « Cœur » désigne ici le centre de la volonté, de la pensée et de la fidélité.
- source_word: עַתָּה
  choice: maintenant
  rationale: Rend directement la transition entre l’accusation et l’annonce du jugement.
- source_word: יֶאְשָׁמוּ
  choice: ils porteront leur culpabilité
  rationale: Le verbe peut exprimer le fait d’être coupable ou de subir les conséquences de sa faute. Cette formulation maintient ensemble culpabilité et responsabilité pénale, sans réduire le sens à une simple punition.
- source_word: הוּא
  choice: Lui-même
  rationale: Le pronom explicite est emphatique. La formulation française en conserve l’insistance sans ajouter le nom de Dieu, absent de ce verset.
- source_word: יַעֲרֹף
  choice: démolira
  rationale: Le verbe évoque littéralement l’action de briser ou de trancher au cou. Appliqué aux autels, « démolira » exprime naturellement leur destruction violente.
- source_word: מִזְבְּחוֹתָם
  choice: leurs autels
  rationale: Équivalent français courant du terme désignant les lieux où l’on offre des sacrifices.
- source_word: יְשֹׁדֵד
  choice: détruira
  rationale: Dans ce parallélisme, le verbe décrit une action dévastatrice. « Détruira » est naturel et précis, sans lui imposer le sens plus étroit de pillage.
- source_word: מַצֵּבוֹתָם
  choice: leurs pierres sacrées
  rationale: Le terme désigne des pierres dressées à fonction cultuelle. « Pierres sacrées » rend cette fonction clairement pour le lectorat moderne; une note précise la réalité culturelle.
theological_decisions:
- issue: Référent du pronom emphatique הוּא
  choice: Conserver « Lui-même » comme sujet singulier, avec Dieu comme référent contextuel probable sans le nommer explicitement.
  alternative: Comprendre le sujet comme un ennemi non nommé servant d’agent au jugement.
  rationale: Le contexte d’Osée favorise Dieu comme auteur ultime du jugement, mais le texte du verset ne le nomme pas. La traduction préserve donc à la fois l’insistance du pronom et cette légère indétermination.
- issue: Sens de יֶאְשָׁמוּ
  choice: « ils porteront leur culpabilité »
  alternative: « ils seront reconnus coupables » ou « ils subiront les conséquences de leur faute »
  rationale: L’hébreu peut viser la culpabilité, sa constatation ou ses conséquences. Le choix retenu maintient la tension entre faute et châtiment au lieu de trancher entièrement.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier collectif « leur cœur » et l’emphase de « Lui-même » conservent les traits marquants de l’hébreu. Les notes rendent visibles les ambiguïtés lexicales sans alourdir le verset.
