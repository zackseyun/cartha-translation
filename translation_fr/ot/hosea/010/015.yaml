source:
  edition: WLC
  text: כָּ֗כָה עָשָׂ֤ה לָ/כֶם֙ בֵּֽית אֵ֔ל מִ/פְּנֵ֖י רָעַ֣ת רָֽעַתְ/כֶ֑ם בַּ/שַּׁ֕חַר נִדְמֹ֥ה נִדְמָ֖ה מֶ֥לֶךְ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
translation:
  language: fr
  text: Voilà ce que Béthel vous a fait, à cause de l'extrême gravité de votre mal[a]. À l'aube, le roi d'Israël sera totalement anéanti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le mal de votre mal »; la répétition hébraïque souligne l'extrême gravité du mal.
    reason: lexical_alternative
  - marker: b
    text: Ou « sera certainement retranché » ou « sera entièrement réduit au silence ». L'hébreu renforce le verbe par une construction intensive.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  choice: Voilà ce que
  rationale: Dans cette phrase, l'adverbe déictique renvoie au jugement décrit dans le contexte. « Voilà ce que » donne en français une articulation naturelle tout en gardant la vigueur prophétique.
- source_word: עָשָׂה לָכֶם
  choice: vous a fait
  rationale: Le parfait suivi du complément indirect se rend directement par « vous a fait ». Le passé composé convient à une déclaration présentant le jugement comme accompli ou certain.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Il s'agit ici du nom de lieu Béthel. La translittération française usuelle évite de transformer sans nécessité le nom propre en « maison de Dieu ».
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition exprime ici la cause du jugement.
- source_word: רָעַת רָעַתְכֶם
  choice: l'extrême gravité de votre mal
  rationale: La répétition hébraïque, littéralement « le mal de votre mal », intensifie le substantif. Cette formulation conserve l'idée de « mal » et exprime naturellement l'intensité en français.
- source_word: בַּשַּׁחַר
  choice: À l'aube
  rationale: Le groupe temporel désigne l'aube ou le matin et peut aussi suggérer la soudaineté du jugement. « À l'aube » est précis et évocateur.
- source_word: נִדְמֹה נִדְמָה
  choice: sera totalement anéanti
  rationale: L'infinitif absolu associé au verbe conjugué renforce l'affirmation. Le nifal de דמה peut évoquer l'anéantissement, la suppression ou le silence; « totalement anéanti » exprime ici la disparition décisive du roi sans effacer l'ambiguïté lexicale, signalée en note.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d'Israël
  rationale: Le syntagme construit désigne directement le roi d'Israël; l'article est nécessaire en français courant.
theological_decisions:
- issue: Référent de « Béthel »
  choice: Conserver Béthel comme nom du centre cultuel, susceptible de représenter par métonymie le régime idolâtre qui y est associé.
  alternative: Comprendre Béthel comme une désignation directe du veau-idole, ou comme un emploi sarcastique du nom du lieu.
  rationale: L'hébreu nomme directement le lieu. La traduction conserve donc le nom propre et n'impose pas dans le texte une identification plus précise que la source.
- issue: Valeur du redoublement רָעַת רָעַתְכֶם
  choice: 'Le traiter comme une intensification: « l''extrême gravité de votre mal ».'
  alternative: Traduire plus littéralement « le mal de votre mal », ou plus dynamiquement « votre profonde méchanceté ».
  rationale: Le redoublement souligne la gravité du mal. La formulation choisie reste intelligible tout en laissant apparaître en note la construction particulière de l'hébreu.
- issue: Sens de נִדְמֹה נִדְמָה
  choice: 'Annoncer la disparition complète du roi: « sera totalement anéanti ».'
  alternative: « sera certainement retranché », « sera entièrement réduit au silence » ou « sera sûrement détruit ».
  rationale: Le verbe autorise plusieurs nuances voisines, et la construction intensive marque la certitude ou la totalité. La note préserve cette amplitude sémantique au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. La phrase garde le ton tranchant de l'oracle. Les deux particularités emphatiques de l'hébreu sont rendues naturellement dans le texte et documentées par des notes; les marqueurs [a] et [b] figurent bien dans le texte principal.
