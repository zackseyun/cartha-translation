  text: נִדְמֶ֥ה שֹׁמְר֖וֹן מַלְכָּ֑/הּ כְּ/קֶ֖צֶף עַל פְּנֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
translation:
  language: fr
  text: Samarie est anéantie[a] ; son roi est comme de l’écume[b] à la surface des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Samarie est détruite » ou « Samarie est réduite au silence » ; le verbe hébreu peut exprimer le fait d’être supprimé, détruit ou réduit au silence.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un débris à la surface des eaux » ; certains comprennent le mot hébreu comme désignant un petit morceau de bois ou un débris flottant sans pouvoir résister au courant.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  choice: est anéantie
  rationale: Le nifal de דמה exprime ici le fait d’être supprimé, détruit ou réduit au silence. « Est anéantie » rend naturellement la disparition politique annoncée, sans atténuer la force du verbe.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle du nom de la capitale du royaume du Nord, qui peut aussi représenter ici le royaume lui-même.
- source_word: מַלְכָּהּ
  choice: son roi
  rationale: Le suffixe féminin singulier renvoie à Samarie. Le français emploie naturellement « son » devant le nom masculin « roi ».
- source_word: כְּקֶצֶף
  choice: comme de l’écume
  rationale: « Écume » rend le sens lexical probable de קֶצֶף et évoque quelque chose d’instable, d’insubstantiel et rapidement emporté. Le sens « morceau de bois » ou « débris » reste possible et est signalé en note.
- source_word: עַל פְּנֵי מָיִם
  choice: à la surface des eaux
  rationale: Rend idiomatiquement l’expression littérale « sur la face des eaux » tout en conservant son image.
