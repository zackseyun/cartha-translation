  source_fidelity: 'Révision nécessaire pour rendre la voix passive de וְאֻסְּפוּ : le texte dit que des peuples « seront rassemblés », non simplement qu’ils se rassembleront. « Quand je le voudrai » rend plus directement la valeur volitive de בְּאַוָּתִי que « Quand je le désirerai », dont le pronom « le » est moins net en français.'
  naturalness: La formulation révisée reste naturelle en français international moderne. « Châtierai » convient au contexte explicite de jugement et exprime mieux la force usuelle de יסר que « corrigerai », sans exclure sa dimension disciplinaire, signalée en note.
  terminology: « Châtier » rend ici יסר dans son emploi judiciaire; la note conserve « discipliner » comme possibilité mettant en relief l’aspect correctif. « Deux fautes » conserve le pluriel et le nombre de l’interprétation contextuellement dominante de la finale difficile, sans identifier ces fautes. « Liera » préserve l’agent non exprimé.
  issues:
