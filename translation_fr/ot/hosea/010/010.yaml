- from: Quand je le désirerai, je les corrigerai[a] ; des peuples se rassembleront contre eux quand on les liera pour leurs deux fautes[b].
  to: Quand je le voudrai, je les châtierai[a] ; des peuples seront rassemblés contre eux lorsqu’on les liera pour leurs deux fautes[b].
  rationale: La révision restitue le passif de la réunion des peuples, améliore l’expression de la volonté divine et choisit un terme français qui porte la gravité judiciaire de יסר. Elle maintient l’agent indéterminé de « lier » et ne résout pas au-delà de ce que permet le texte la finale textuellement difficile.
