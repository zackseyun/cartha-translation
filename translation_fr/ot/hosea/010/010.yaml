    issue: La voix de « des peuples se rassembleront » ne correspond pas à la forme passive hébraïque.
    rationale: וְאֻסְּפוּ est un passif (« seront rassemblés/assemblés »). Le pronominal français peut être possible stylistiquement, mais efface ici l’indétermination de l’agent que porte le passif.
  - severity: low
    issue: « Quand je le désirerai » est moins idiomatique et moins précis que « Quand je le voudrai ».
    rationale: Le pronom neutre peut laisser entendre un objet distinct, alors que l’expression hébraïque introduit la volonté divine comme circonstance de l’action qui suit.
  - severity: medium
    issue: « Corrigerai » atténue le registre de jugement de יסר dans ce contexte.
    rationale: Le verbe peut comporter l’idée d’instruire ou de corriger, mais il désigne fréquemment un châtiment disciplinaire. « Châtierai » est plus fidèle tout en restant compréhensible dans un registre biblique moderne.
  revised_text: Quand je le voudrai, je les châtierai[a] ; des peuples seront rassemblés contre eux lorsqu’on les liera pour leurs deux fautes[b].
