  text: בְּ/אַוָּתִ֖/י וְ/אֶסֳּרֵ֑/ם וְ/אֻסְּפ֤וּ עֲלֵי/הֶם֙ עַמִּ֔ים בְּ/אָסְרָ֖/ם לִ/שְׁתֵּ֥י עינת/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
translation:
  language: fr
  text: Quand je le voudrai, je les châtierai[a] ; des peuples seront rassemblés contre eux lorsqu’on les liera pour leurs deux fautes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les disciplinerai ». Le verbe peut désigner un châtiment qui a aussi une visée corrective ou instructive.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour leur double culpabilité ». La forme hébraïque est difficile ; ses consonnes permettent aussi la lecture « pour leurs deux yeux », moins probable dans ce contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  choice: Quand je le désirerai
  rationale: La préposition ב avec le nom verbal et le suffixe de première personne exprime ici la volonté de Dieu comme circonstance temporelle de l’action. Cette formulation française est naturelle et conserve cette nuance volitive.
- source_word: וְאֶסֳּרֵם
  choice: je les corrigerai
  rationale: La forme relève de יסר, « corriger, discipliner, instruire », et non de אסר, « lier ». « Corriger » convient au registre du jugement tout en laissant ouverte la dimension corrective.
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  choice: des peuples se rassembleront contre eux
  rationale: Le passif hébreu indique que plusieurs peuples seront réunis dans une intention hostile. Le passif se rend naturellement en français par le pronominal « se rassembleront », sans préciser l’agent.
- source_word: בְּאָסְרָם
  choice: quand on les liera
  rationale: L’infinitif construit de אסר avec ב a une valeur temporelle. La tournure avec « on » conserve l’agent indéterminé du texte et évite de l’attribuer explicitement à Dieu ou aux peuples.
- source_word: לִשְׁתֵּי עינתם
  choice: pour leurs deux fautes
  rationale: Dans ce contexte judiciaire, la forme difficile est comprise comme désignant deux fautes ou une double culpabilité. « Deux fautes » préserve le nombre sans identifier ces fautes ni résoudre davantage l’expression.
theological_decisions:
- issue: Sens de la formule finale לִשְׁתֵּי עינתם
  choice: pour leurs deux fautes
  alternative: pour leur double culpabilité ; pour leurs deux yeux
  rationale: Le contexte de jugement favorise un sens lié à la faute, mais la forme consonantique est difficile. Le texte principal garde l’élément numérique et la note signale tant la possibilité d’une double culpabilité que la lecture littérale moins probable « leurs deux yeux ».
- issue: Agent de l’action « lier »
  choice: quand on les liera
  alternative: quand je les lierai ; quand ils seront liés
  rationale: L’hébreu compact ne permet pas d’identifier sûrement l’agent. Le français impersonnel préserve cette indétermination théologique et syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. « Corriger » évite le caractère scolaire de certains emplois modernes de « discipliner ». La ponctuation distingue clairement les deux actions, et les notes conservent les principales ambiguïtés lexicales et textuelles.
