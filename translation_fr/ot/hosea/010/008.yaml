id: HOS.10.8
reference: Hosea 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
translation:
  language: fr
  text: 'Les hauts lieux d’Aven[a], le péché d’Israël, seront détruits. Épines et chardons pousseront sur leurs autels. Ils diront aux montagnes : « Couvrez-nous ! » et aux collines : « Tombez sur nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hauts lieux du mal ». En hébreu, Aven peut être un nom de lieu, mais signifie aussi « mal » ou « iniquité »; il y a probablement ici un jeu de mots intentionnel.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Expression française consacrée pour les sites cultuels surélevés de la Bible hébraïque; elle préserve leur portée religieuse.
- source_word: אָוֶן
  choice: Aven
  rationale: Le mot peut fonctionner ici comme un nom de lieu, tout en évoquant le mal ou l’iniquité; la note conserve ce jeu de sens probable.
- source_word: חַטַּאת יִשְׂרָאֵל
  choice: le péché d’Israël
  rationale: חַטַּאת désigne naturellement ici le péché, en apposition aux hauts lieux; le sens « sacrifice pour le péché » ne convient pas au contexte.
- source_word: וְנִשְׁמְדוּ
  choice: seront détruits
  rationale: Le nifal de שׁמד exprime l’anéantissement ou la destruction; cette formulation est claire, sobre et adaptée à l’annonce prophétique.
- source_word: קוֹץ וְדַרְדַּר
  choice: épines et chardons
  rationale: Le pluriel idiomatique français rend naturellement ces végétaux à valeur collective et l’image de désolation.
- source_word: יַעֲלֶה עַל מִזְבְּחוֹתָם
  choice: pousseront sur leurs autels
  rationale: Avec des végétaux, עלה signifie naturellement « pousser »; le pluriel s’accorde en français avec « épines et chardons ».
- source_word: כַּסּוּנוּ
  choice: Couvrez-nous !
  rationale: L’impératif direct préserve l’image forte d’une population cherchant à être cachée sous les montagnes.
- source_word: נִפְלוּ עָלֵינוּ
  choice: Tombez sur nous !
  rationale: La traduction littérale et naturelle maintient l’appel désespéré à être enseveli ou soustrait au jugement.
theological_decisions:
- issue: 'אָוֶן : nom commun ou nom de lieu'
  choice: Aven dans le texte principal
  alternative: « mal », « iniquité » ou « hauts lieux du mal »
  rationale: La syntaxe permet une valeur toponymique et Osée affectionne les jeux de mots dépréciatifs autour de ce nom. Le texte principal garde la référence géographique probable, tandis que la note préserve l’ambiguïté et la charge morale.
translation_notes:
  register: Français international moderne, digne et direct. « Hauts lieux » conserve le vocabulaire cultuel biblique; les impératifs brefs restituent l’intensité de la scène. La ponctuation en deux phrases après l’annonce de destruction améliore la lisibilité sans modifier la progression du verset.
