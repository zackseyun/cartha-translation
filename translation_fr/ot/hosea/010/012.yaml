  text: זִרְע֨וּ לָ/כֶ֤ם לִ/צְדָקָה֙ קִצְר֣וּ לְ/פִי חֶ֔סֶד נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/עֵת֙ לִ/דְר֣וֹשׁ אֶת יְהוָ֔ה עַד יָב֕וֹא וְ/יֹרֶ֥ה צֶ֖דֶק לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
translation:
  language: fr
  text: Semez pour vous-mêmes en vue de la justice, moissonnez selon l’amour fidèle. Défrichez-vous une terre en friche, car il est temps de chercher le SEIGNEUR, jusqu’à ce qu’il vienne et fasse pleuvoir sur vous la justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et vous enseigne la justice ». Le verbe hébreu peut signifier « enseigner », mais l’image agricole du verset favorise ici le sens de « faire pleuvoir ».
    reason: alternative_reading
lexical_decisions:
- source_word: זִרְעוּ לָכֶם לִצְדָקָה
  choice: Semez pour vous-mêmes en vue de la justice
  rationale: L’impératif agricole est conservé, ainsi que la valeur bénéficiaire ou réflexive de לָכֶם. « En vue de » exprime naturellement en français l’orientation ou le résultat indiqué par לְ.
- source_word: קִצְרוּ לְפִי חֶסֶד
  choice: moissonnez selon l’amour fidèle
  rationale: « Moissonnez » prolonge directement l’image des semailles. « Amour fidèle » rend la richesse relationnelle et durable de חֶסֶד sans la réduire à un simple sentiment.
- source_word: נִירוּ לָכֶם נִיר
  choice: Défrichez pour vous-mêmes une terre en friche
  rationale: Cette formulation garde l’insistance de la répétition hébraïque autour du travail d’une terre encore improductive, tout en restant intelligible en français courant.
- source_word: לִדְרוֹשׁ אֶת יְהוָה
  choice: rechercher le SEIGNEUR
  rationale: « Rechercher » exprime ici une démarche volontaire et persévérante vers Dieu. Le tétragramme est rendu selon la convention française traditionnelle par « le SEIGNEUR ».
- source_word: וְיֹרֶה צֶדֶק לָכֶם
  choice: et fasse pleuvoir sur vous la justice
  rationale: Le sens lié à la pluie s’accorde avec les semailles, la moisson et la terre défrichée. « Justice » maintient le lien lexical avec צְדָקָה au début du verset.
theological_decisions:
- issue: Sens de וְיֹרֶה צֶדֶק
  choice: Dieu « fait pleuvoir » la justice sur son peuple.
  alternative: Dieu « enseigne » la justice à son peuple.
  rationale: L’ensemble du verset développe une image agricole, ce qui favorise le sens de pluie. Cependant, le verbe hébreu peut aussi signifier « enseigner » ; cette ambiguïté réelle est donc conservée en note.
translation_notes:
  register: 'Français international moderne, naturel et digne. Les impératifs pluriels sont maintenus, ainsi que la progression agricole : semer, moissonner, défricher et recevoir la pluie. La répétition « pour vous-mêmes » reflète celle de l’hébreu et souligne la responsabilité des destinataires.'
