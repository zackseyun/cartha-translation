  source_fidelity: 'La question hébraïque מַה תִּתֵּן ne contient pas « leur » : le pronom doit donc être retiré de « que leur donneras-tu ? ». Le participe מַשְׁכִּיל décrit littéralement un utérus/ventre qui fait perdre ses enfants; « qui avorte » risque en français d’attribuer l’acte au ventre et de restreindre indûment le sens à l’avortement. « sujet aux fausses couches » rend naturellement l’image reproductive tout en laissant l’alternative plus large en note.'
  naturalness: « Donne-leur, Yahvé — que donneras-tu ? » est naturel et garde l’hésitation rhétorique. « Un ventre sujet aux fausses couches » est plus idiomatique et précis en français moderne que « un ventre qui avorte ». « Seins desséchés » demeure une formulation sobre, concrète et naturelle.
  terminology: « Yahvé » est une forme française établie pour le tétragramme. « Ventre » convient dans cette image corporelle non technique; « seins » traduit directement שָׁדַיִם. La note conserve la possibilité lexicale de « priver d’enfants », sans imposer une lecture confessionnelle.
  issues:
