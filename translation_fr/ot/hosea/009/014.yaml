    issue: Pronom ajouté dans la question
    rationale: La traduction « que leur donneras-tu ? » ajoute « leur », absent de מַה תִּתֵּן. Le destinataire est déjà exprimé dans l’impératif initial et final; la question doit rester « que donneras-tu ? ».
  - severity: medium
    issue: « qui avorte » est maladroit et trop étroit
    rationale: En français moderne, cette expression suggère que le ventre accomplit volontairement l’avortement et ne rend pas bien la valeur de perte d’enfants/fausse couche du participe hébreu. Une formulation décrivant des fausses couches est plus naturelle, tandis que la note préserve le sens plus large de privation d’enfants.
