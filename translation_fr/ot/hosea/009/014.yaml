source:
  edition: WLC
  text: תֵּן לָ/הֶ֥ם יְהוָ֖ה מַה תִּתֵּ֑ן תֵּן לָ/הֶם֙ רֶ֣חֶם מַשְׁכִּ֔יל וְ/שָׁדַ֖יִם צֹמְקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
translation:
  language: fr
  text: Donne-leur, Yahvé — que donneras-tu ? Donne-leur un ventre sujet aux fausses couches[a] et des seins desséchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui prive d’enfants ». Le participe hébreu peut désigner ce qui cause la perte des enfants; dans ce contexte, « sujet aux fausses couches » exprime plus précisément le jugement touchant la grossesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן
  choice: Donne
  rationale: L’impératif direct adressé à Dieu garde ici toute sa force et sa simplicité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui conserve le nom propre plutôt que de le remplacer par un titre.
- source_word: מַה תִּתֵּן
  choice: que leur donneras-tu ?
  rationale: L’interrogatif suivi de l’imparfait exprime naturellement une question rhétorique et l’hésitation douloureuse du prophète.
- source_word: רֶחֶם
  choice: ventre
  rationale: Dans ce contexte reproductif, « ventre » désigne naturellement le lieu où l’enfant est porté, sans la technicité d’« utérus » ni l’ambiguïté de « sein » en français moderne.
- source_word: מַשְׁכִּיל
  choice: qui avorte
  rationale: Le participe causatif de שכל évoque un ventre qui cause la perte de l’enfant; cette formulation concise conserve l’image corporelle et le jugement sur la fécondité.
- source_word: שָׁדַיִם
  choice: seins
  rationale: Le terme concret correspond directement à l’hébreu et maintient l’image frappante de l’allaitement rendu impossible.
- source_word: צֹמְקִים
  choice: desséchés
  rationale: Le participe décrit des seins taris ou flétris; « desséchés » conserve à la fois l’image physique et l’absence de lait.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; le rendre par le nom propre préserve l’adresse personnelle au Dieu d’Israël.
- issue: Portée de מַשְׁכִּיל
  choice: qui avorte
  alternative: qui prive d’enfants
  rationale: Le contexte immédiat de fécondité favorise l’idée de fausse couche, mais le participe peut aussi avoir le sens plus large de causer la perte des enfants; l’alternative est donc signalée sans effacer l’ambiguïté.
translation_notes:
  register: Français moderne, sobre et solennel. L’interjection archaïsante « ô » a été évitée; le tiret marque l’hésitation poignante du prophète. Les images corporelles directes de l’hébreu ont été conservées.
