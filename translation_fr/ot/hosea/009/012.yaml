source:
  edition: WLC
  text: כִּ֤י אִם יְגַדְּלוּ֙ אֶת בְּנֵי/הֶ֔ם וְ/שִׁכַּלְתִּ֖י/ם מֵֽ/אָדָ֑ם כִּֽי גַם א֥וֹי לָ/הֶ֖ם בְּ/שׂוּרִ֥/י מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
translation:
  language: fr
  text: Même s’ils élèvent leurs enfants[a], je les priverai de leurs enfants, au point qu’il ne reste plus personne[b]. Oui, malheur à eux quand je me retirerai d’eux[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs fils ». Le nom hébreu peut désigner spécifiquement les fils, mais aussi plus largement les enfants ou la descendance.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu est concis et difficile. L’expression peut souligner que cette privation ira jusqu’à ce qu’il ne reste plus aucun survivant.
    reason: textual_ambiguity
  - marker: c
    text: Ou « quand je me détournerai d’eux ». L’expression évoque le retrait de Dieu dans le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Même si
  rationale: 'Dans ce contexte, la locution introduit une concession : même s’ils parviennent à élever leurs enfants, le jugement annoncé les atteindra.'
- source_word: יְגַדְּלוּ
  choice: ils élèvent
  rationale: Au piel, גדל peut désigner le fait d’élever des enfants ; « élèvent » est naturel et précis en français contemporain.
- source_word: בְּנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner spécifiquement les fils, mais aussi la descendance de façon plus générale. Le contexte collectif favorise « enfants », tout en signalant l’autre possibilité en note.
- source_word: וְשִׁכַּלְתִּים
  choice: je les en priverai
  rationale: שׁכל exprime la perte des enfants et le deuil qui en résulte. Le pronom « en » renvoie clairement aux enfants dans un français naturel, sans atténuer la gravité de la menace.
- source_word: מֵאָדָם
  choice: jusqu’à ce qu’il ne reste plus personne
  rationale: L’expression hébraïque difficile intensifie la privation jusqu’à l’absence de tout survivant humain. Cette formulation communique le sens probable sans reproduire un idiome obscur en français ; l’ambiguïté est signalée en note.
- source_word: כִּי גַם
  choice: Oui
  rationale: La combinaison a ici une valeur emphatique qui renforce l’annonce de malheur. « Oui » restitue cette insistance avec solennité et fluidité.
- source_word: אוֹי לָהֶם
  choice: malheur à eux
  rationale: Formule prophétique traditionnelle qui exprime à la fois la lamentation et l’annonce du jugement.
- source_word: בְּשׂוּרִי מֵהֶם
  choice: quand je m’éloignerai d’eux
  rationale: Le verbe סור signifie s’écarter ou s’éloigner, et le préfixe ב marque ici la circonstance temporelle. La première personne indique que c’est Dieu qui se retire.
theological_decisions:
- issue: Sens du retrait divin dans la dernière proposition
  choice: Dieu s’éloigne du peuple dans le contexte du jugement.
  alternative: Dieu se détourne d’eux.
  rationale: Le suffixe de première personne dans בְּשׂוּרִי désigne très probablement l’action de Dieu. La traduction conserve l’image de son retrait sans expliciter davantage ses conséquences théologiques.
- issue: Étendue de la privation exprimée par מֵאָדָם
  choice: La perte aboutit à l’absence de tout survivant humain.
  alternative: Je les priverai de tout homme / de toute descendance.
  rationale: La construction est concise et difficile. Le contexte de la perte des enfants appuie l’idée d’une privation totale, mais une note préserve l’incertitude quant à la portée exacte de אָדָם.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible, tandis que « malheur à eux » conserve le registre prophétique. Les notes rendent visibles les principales ambiguïtés lexicales sans alourdir le texte principal.
