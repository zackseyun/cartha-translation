  rationale: La révision explicite la privation des enfants, corrige la note relative à la difficile expression מֵאָדָם afin de préserver son incertitude sans lui attribuer un sens maladroit, et rend le retrait divin par « me retirerai ». Le sens du passage, son intensité judiciaire et ses ambiguïtés textuelles sont conservés.
