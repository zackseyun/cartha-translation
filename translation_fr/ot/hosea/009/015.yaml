source:
  edition: WLC
  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
translation:
  language: fr
  text: Toute leur méchanceté est à Guilgal[a] ; car c’est là que je les ai haïs, à cause de la perversité de leurs actes. Je les chasserai de ma maison[b] ; je ne les aimerai plus. Tous leurs chefs sont rebelles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Toute leur méchanceté s’est manifestée à Guilgal ». La proposition hébraïque ne comporte pas de verbe exprimé. Le mot rendu par « car » peut aussi avoir une valeur d’insistance : « oui, c’est là que je les ai haïs ».'
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: « Ma maison » peut désigner plus précisément le pays du Seigneur, son sanctuaire ou la communauté qui lui appartient ; l’hébreu garde l’image condensée.
    reason: note culturelle et métaphorique
  - marker: c
    text: Ou « Tous leurs dirigeants sont insoumis » ; le terme peut désigner des chefs, des responsables ou des princes.
    reason: alternative lexicale
lexical_decisions:
- source_word: כָּל רָעָתָם
  choice: Toute leur méchanceté
  rationale: Le singulier abstrait רָעָה, précédé de כָּל, désigne collectivement l’ensemble de leur mal moral. « Toute leur méchanceté » conserve cette valeur globale et convient au registre prophétique.
- source_word: בַּגִּלְגָּל
  choice: à Guilgal
  rationale: La préposition בְּ est ici locative. « À Guilgal » est la tournure française naturelle pour ce nom de lieu.
- source_word: כִּי שָׁם
  choice: car c’est là
  rationale: כִּי peut introduire une explication causale ou porter une nuance d’insistance. « Car c’est là » exprime le lien explicatif tout en mettant le lieu en relief.
- source_word: שְׂנֵאתִים
  choice: je les ai haïs
  rationale: Le verbe שׂנא exprime directement la haine ou l’aversion. La traduction ne l’atténue pas en « rejetés » ou « repoussés ».
- source_word: עַל רֹעַ מַעַלְלֵיהֶם
  choice: à cause de la perversité de leurs actes
  rationale: עַל indique ici le motif ; רֹעַ qualifie moralement leurs מַעֲלָלִים, leurs actes ou agissements. « Perversité » évite une répétition immédiate de « méchanceté » tout en gardant la force morale.
- source_word: מִבֵּיתִי אֲגָרְשֵׁם
  choice: Je les chasserai de ma maison
  rationale: גָּרַשׁ désigne l’expulsion, et מִן marque le lieu dont ils seront chassés. L’image concise de « ma maison » est conservée sans en fixer le référent.
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  choice: je ne les aimerai plus
  rationale: Dans cette construction, יסף exprime la continuation ou la répétition. La formule française rend naturellement la cessation annoncée.
- source_word: כָּל שָׂרֵיהֶם
  choice: Tous leurs chefs
  rationale: שָׂרִים désigne des dirigeants, chefs ou hauts responsables. « Chefs » est clair en français moderne et n’implique pas nécessairement des fils de roi, contrairement à « princes ».
- source_word: סֹרְרִים
  choice: sont rebelles
  rationale: Le participe de סרר décrit une disposition persistante à la rébellion ou à l’insoumission. « Sont rebelles » en restitue directement la force.
theological_decisions:
- issue: Le langage de la haine divine
  choice: Conserver « je les ai haïs »
  alternative: « je les ai rejetés » ou « je me suis détourné d’eux »
  rationale: Le verbe hébreu שׂנא emploie un langage explicite de haine dans un contexte de jugement. L’atténuer résoudrait une tension théologique que le texte lui-même maintient.
- issue: Le sens de « ma maison »
  choice: Conserver l’image « ma maison »
  alternative: « mon pays », « mon sanctuaire » ou « ma famille »
  rationale: Le contexte peut évoquer le pays du Seigneur, son sanctuaire ou sa communauté d’alliance, mais l’hébreu ne précise pas le référent. La métaphore est donc laissée ouverte.
- issue: La portée de la déclaration « je ne les aimerai plus »
  choice: Traduire directement la cessation annoncée
  alternative: « je ne continuerai pas à leur témoigner mon amour »
  rationale: La formulation hébraïque est abrupte. La traduction conserve cette tension de jugement sans l’expliquer ni la limiter doctrinalement.
translation_notes:
  register: Français international moderne, sobre et digne, avec une syntaxe prophétique ferme. Les formulations directes « je les ai haïs » et « je ne les aimerai plus » préservent la rudesse du jugement. Le nom traditionnel « Guilgal » est retenu. Tous les appels de notes [a], [b] et [c] figurent dans le texte principal.
