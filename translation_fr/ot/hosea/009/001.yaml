  text: אַל תִּשְׂמַ֨ח יִשְׂרָאֵ֤ל אֶל גִּיל֙ כָּֽ/עַמִּ֔ים כִּ֥י זָנִ֖יתָ מֵ/עַ֣ל אֱלֹהֶ֑י/ךָ אָהַ֣בְתָּ אֶתְנָ֔ן עַ֖ל כָּל גָּרְנ֥וֹת דָּגָֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
translation:
  language: fr
  text: Ne te réjouis pas[a], Israël, en exultant comme les peuples, car tu t’es prostitué en te détournant de ton Dieu ; tu as aimé le salaire d’une prostituée[b] sur toutes les aires de battage du grain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne te réjouis pas, Israël, comme les peuples. » La tournure hébraïque est condensée et peut se rendre naturellement de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: Le « salaire d’une prostituée » désigne la rémunération reçue par une prostituée. Dans ce contexte, l’expression est employée métaphoriquement à propos d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Ne te réjouis pas
  rationale: אַל suivi de l’inaccompli exprime ici une interdiction. « Se réjouir » restitue naturellement שׂמח dans le registre prophétique.
- source_word: אֶל גִּיל כָּעַמִּים
  choice: en exultant comme les peuples
  rationale: La tournure hébraïque est condensée et difficile à reproduire littéralement. Cette formulation conserve l’idée d’exultation et la comparaison avec les autres peuples sans préciser indûment la relation syntaxique.
- source_word: זָנִיתָ מֵעַל אֱלֹהֶיךָ
  choice: tu t’es prostitué loin de ton Dieu
  rationale: La traduction maintient l’image sexuelle voulue par Osée ainsi que le mouvement d’éloignement exprimé par מֵעַל, sans l’aplanir en simple « infidélité ».
- source_word: אֶתְנָן
  choice: le salaire d’une prostituée
  rationale: אֶתְנָן désigne concrètement la rémunération versée à une prostituée. Cette expression française est claire, actuelle et préserve l’image.
- source_word: עַל כָּל גָּרְנוֹת דָּגָן
  choice: sur toutes les aires de battage du grain
  rationale: La formulation rend explicitement גֹּרֶן, « aire de battage », et דָּגָן, « grain », tout en restant idiomatique en français.
theological_decisions:
- issue: Métaphore prophétique de la prostitution appliquée à l’apostasie d’Israël
  choice: Conserver explicitement l’image de la prostitution dans le texte principal
  alternative: Rendre de façon abstraite par « tu as été infidèle à ton Dieu »
  rationale: Chez Osée, l’image sexuelle exprime délibérément la rupture de l’alliance et l’idolâtrie. La conserver respecte la force et la tension théologiques du texte sans les atténuer.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier correspond à l’adresse à Israël comme entité collective. La métaphore crue mais centrale d’Osée est conservée sans archaïsme.
