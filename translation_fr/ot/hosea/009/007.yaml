id: HOS.9.7
reference: Hosea 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
translation:
  language: fr
  text: 'Les jours du châtiment sont arrivés ; les jours de la rétribution sont arrivés : Israël le saura. Le prophète est insensé, l’homme inspiré est fou[a], à cause de l’ampleur de ta culpabilité et de ta grande hostilité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme de l’esprit est fou ». L’expression peut désigner un homme inspiré ou quelqu’un qui prétend l’être. Certains comprennent aussi ces mots comme le jugement méprisant du peuple sur le véritable prophète : « Le prophète est insensé, l’homme inspiré est fou. » L’hébreu ne les présente pas explicitement comme une citation.'
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: 'Autre traduction possible : « à cause de l’abondance de ta culpabilité et de ta grande haine ». L’objet de cette hostilité ou de cette haine n’est pas précisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: châtiment
  rationale: Dans ce contexte de jugement prophétique, le nom désigne une intervention punitive ou l’heure des comptes. « Châtiment » en exprime clairement la portée judiciaire.
- source_word: שִׁלֻּם
  choice: rétribution
  rationale: Le terme évoque le fait de rendre à quelqu’un selon ses actes. « Rétribution » convient au parallélisme avec « châtiment » sans préciser indûment la forme de cette rétribution.
- source_word: יֵדְעוּ יִשְׂרָאֵל
  choice: Israël le saura
  rationale: 'L’imparfait est compris comme prédictif : Israël reconnaîtra la réalité du jugement annoncé. Le pronom « le » explicite naturellement en français l’objet sous-entendu.'
- source_word: אֱוִיל
  choice: insensé
  rationale: Le mot constitue ici un prédicat sévère appliqué au prophète. « Insensé » garde cette force tout en convenant à un registre biblique moderne et digne.
- source_word: מְשֻׁגָּע
  choice: délire
  rationale: Le participe décrit celui qui paraît frappé de folie ou se comporte comme tel. Le verbe « délire » restitue vivement cette accusation sans employer un diagnostic médical moderne.
- source_word: אִישׁ הָרוּחַ
  choice: l’homme inspiré
  rationale: Littéralement « l’homme de l’esprit », l’expression désigne vraisemblablement un homme qui reçoit ou revendique une inspiration. « Inspiré » est naturel en français ; la note conserve l’expression littérale et son ambiguïté.
- source_word: עַל
  choice: Cela vient de
  rationale: La préposition introduit ici le motif ou la cause de la situation dénoncée. Cette formulation française évite de rattacher artificiellement la proposition causale à un seul des énoncés précédents.
- source_word: רֹב עֲוֺנְךָ
  choice: la grandeur de ta faute
  rationale: רֹב exprime ici l’ampleur ou l’abondance, tandis que עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. Cette traduction garde le poids moral de l’expression.
- source_word: מַשְׂטֵמָה
  choice: ta profonde hostilité
  rationale: Le nom signifie hostilité, animosité ou haine. « Hostilité » préserve l’absence d’objet explicite ; le possessif français rend naturellement la seconde personne implicite dans la coordination, et « profonde » évite une répétition pesante de « grandeur ».
theological_decisions:
- issue: Référent de « Le prophète est insensé, l’homme inspiré délire »
  choice: Le texte principal laisse ces paroles comme une affirmation non encadrée de guillemets, pouvant annoncer le dévoilement de figures prophétiques lors du jugement.
  alternative: Il peut s’agir des paroles méprisantes du peuple à l’égard du véritable prophète, ou d’une dénonciation visant uniquement de faux prophètes.
  rationale: L’hébreu ne marque pas explicitement une citation. Ne pas ajouter de guillemets préserve le déroulement syntaxique tout en signalant dans la note l’interprétation concurrente.
- issue: Sens de « esprit » dans אִישׁ הָרוּחַ
  choice: Une personne inspirée ou se disant inspirée, sans identifier explicitement cet esprit à l’Esprit de Dieu.
  alternative: Un homme inspiré par l’Esprit de Dieu.
  rationale: Le contexte et le parallélisme avec « prophète » évoquent l’inspiration, mais l’hébreu ne contraint pas ici à préciser « l’Esprit saint ». La traduction évite donc d’importer cette détermination théologique.
- issue: Objet de l’hostilité finale
  choice: L’objet de l’hostilité reste non précisé.
  alternative: L’hostilité peut viser Dieu, son prophète ou la vraie prophétie.
  rationale: Le substantif מַשְׂטֵמָה n’a pas de complément explicite dans le verset. La traduction ne doit pas en fournir un arbitrairement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle des deux premières propositions est conservé. « L’homme inspiré » est plus naturel que le calque « l’homme de l’esprit », lequel est donné en note. Aucun guillemet n’est ajouté autour de la dénonciation, afin de ne pas trancher une ambiguïté absente de la ponctuation hébraïque.
